  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: pt
  text: Se o corpo inteiro fosse um olho, onde estaria a audição[a]? Se fosse todo audição, onde estaria o olfato?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde estaria o ouvido? ... onde estaria o nariz?” O grego fala das faculdades da audição e do olfato, e não literalmente dos órgãos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: o corpo inteiro
  rationale: Expressa diretamente a totalidade do corpo e preserva a imagem hipotética de Paulo em português natural.
- source_word: ὀφθαλμός
  choice: olho
  rationale: No predicativo após “fosse”, o português dispensa naturalmente o artigo indefinido, mantendo a metáfora de uma única parte do corpo.
- source_word: ποῦ
  choice: onde estaria...?
  rationale: A forma condicional corresponde com naturalidade à hipótese irreal introduzida por “se... fosse”.
- source_word: ἀκοή
  choice: a audição / audição
  rationale: O substantivo grego designa a capacidade de ouvir, não especificamente a orelha ou o ouvido como órgão. A primeira ocorrência leva artigo; a segunda funciona como predicativo sem artigo.
- source_word: ὅλον
  choice: todo
  rationale: Mantém a elipse do substantivo “corpo” na segunda condição sem repetição desnecessária; “Se fosse todo audição” é compreensível e retoricamente forte.
- source_word: ὄσφρησις
  choice: o olfato
  rationale: Designa de modo claro e corrente a faculdade de sentir cheiros, preservando o paralelismo funcional com “audição”.
theological_decisions:
- issue: Metáfora corporal formulada em termos de faculdades sensoriais ou de órgãos físicos
  choice: 'Traduzir ἀκοή e ὄσφρησις como faculdades sensoriais: “audição” e “olfato”.'
  alternative: 'Traduzir pelos órgãos: “ouvido” e “nariz”.'
  rationale: O grego nomeia as capacidades de ouvir e cheirar, não os órgãos anatômicos. A tradução conserva essa formulação sem tornar a imagem mais concreta do que o texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A elipse da segunda oração foi preservada, e os termos técnicos foram evitados no texto principal.
