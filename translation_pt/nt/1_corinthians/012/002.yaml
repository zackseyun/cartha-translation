review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente «Vocês sabem», «gentios» e «ídolos mudos», bem como a voz passiva. Contudo, «conforme quer que» não é uma formulação portuguesa natural para ὡς ἂν neste contexto. «De qualquer maneira que» expressa com clareza a força indefinida/modal sem resolver indevidamente a construção enfática e algo tensa do grego.
  naturalness: «Conforme quer que fossem conduzidos» soa artificial e pouco idiomático no português moderno. A substituição por «de qualquer maneira que fossem conduzidos» é natural, compreensível internacionalmente e mantém o registro sóbrio.
  terminology: «Gentios» é apropriado para ἔθνη no uso paulino contextual; «ídolos mudos» reproduz de modo conciso τὰ εἴδωλα τὰ ἄφωνα e conserva o contraste retórico relativo à fala. «Aos ídolos» é uma realização portuguesa mais direta do movimento direcional do que «para os ídolos» neste contexto.
  issues:
  - severity: medium
    issue: Construção final pouco idiomática
    rationale: «Conforme quer que» não transmite de forma natural em português a expressão ὡς ἂν. «De qualquer maneira que» preserva seu valor modal/indefinido.
  - severity: medium
    issue: Nota b apresenta uma paráfrase desordenada e excessivamente explicativa
    rationale: A alternativa atual inverte e amplia a construção, introduzindo «arrastados», mais forte do que o necessário para ἀπαγόμενοι, e sua explicação afirma «repetidamente» de modo pouco preciso. A nota deve esclarecer apenas a dupla passividade e a nuance de «levar para longe».
  revised_text: Vocês sabem que, quando eram gentios, eram levados aos ídolos mudos[a], de qualquer maneira que fossem conduzidos[b].
