  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: pt
  text: Vocês sabem que, quando eram gentios, eram levados aos ídolos mudos[a], de qualquer maneira que fossem conduzidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos sem voz” ou “ídolos que não podem falar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eram conduzidos aos ídolos mudos, de qualquer maneira que fossem levados”. O grego emprega duas formas passivas e pode salientar que eram levados para longe sob influências anteriores não especificadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Vocês sabem
  rationale: Expressa de modo direto e natural o apelo de Paulo a um conhecimento compartilhado.
- source_word: ἔθνη
  choice: gentios
  rationale: Preserva aqui o sentido étnico-religioso da condição anterior dos coríntios, sem o tom potencialmente pejorativo de “pagãos”.
- source_word: πρὸς τὰ εἴδωλα
  choice: para os ídolos
  rationale: Mantém o sentido direcional de πρός com acusativo e resulta natural em português.
- source_word: τὰ ἄφωνα
  choice: mudos
  rationale: Destaca a incapacidade dos ídolos de falar e preserva o contraste contextual com a fala inspirada pelo Espírito.
- source_word: ὡς ἂν
  choice: conforme quer que
  rationale: Reproduz a força indefinida ou modal da expressão grega, isto é, “de qualquer maneira que”.
- source_word: ἤγεσθε ... ἀπαγόμενοι
  choice: eram levados ... fossem conduzidos
  rationale: Conserva a insistência grega no movimento passivo sob influência anterior, embora evite uma duplicação excessivamente pesada em português.
theological_decisions:
- issue: Sentido de ἔθνη na descrição da vida anterior dos coríntios
  choice: gentios
  alternative: pagãos; pessoas das nações
  rationale: “Gentios” mantém a dimensão étnico-religiosa do termo paulino sem acrescentar uma avaliação moral mais forte do que a explicitada pelo texto.
- issue: Contraste entre os ídolos incapazes de falar e as manifestações espirituais do contexto
  choice: ídolos mudos
  alternative: ídolos sem voz; ídolos que não podem falar
  rationale: A formulação compacta preserva o contraste retórico sem transformá-lo em explicação teológica.
- issue: Dupla expressão passiva em ἤγεσθε ἀπαγόμενοι
  choice: eram levados ... fossem conduzidos
  alternative: eram conduzidos, sendo arrastados; deixavam-se levar
  rationale: Mantém a passividade e a repetição enfática do grego, sem atribuir explicitamente agência voluntária aos coríntios nem identificar quem os conduzia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. A construção final conserva deliberadamente parte da repetição e da tensão sintática do grego.
