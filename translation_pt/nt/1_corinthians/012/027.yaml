id: 1CO.12.27
reference: 1 Corinthians 12:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: pt
  text: Pois bem, vocês são o corpo do Messias[a] e, cada um por sua parte, membros dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o corpo de Cristo”. O título grego Χριστός pode ser traduzido por “Messias” ou “Cristo”.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, “e membros, cada um por sua parte”. A expressão grega indica aqui que cada pessoa é um membro dentro do corpo inteiro; “dele” está implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vocês
  rationale: O pronome de segunda pessoa do plural dirige a afirmação à comunidade inteira. “Vocês” é claro, corrente e natural no português de ampla legibilidade brasileira.
- source_word: δέ
  choice: pois bem
  rationale: Aqui δέ introduz a aplicação direta da metáfora desenvolvida anteriormente, sem exigir uma oposição forte. “Pois bem” sinaliza essa transição de modo natural.
- source_word: σῶμα Χριστοῦ
  choice: o corpo do Messias
  rationale: No contexto, a expressão predicativa identifica coletivamente os destinatários como o corpo pertencente ao Messias. O artigo é necessário para uma formulação portuguesa natural.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός conserva aqui seu valor titular messiânico; “Messias” comunica esse conteúdo sem reduzir o termo a mero nome próprio.
- source_word: μέλη
  choice: membros
  rationale: “Membros” preserva tanto a imagem das partes do corpo quanto sua aplicação à comunidade.
- source_word: ἐκ μέρους
  choice: cada um por sua parte
  rationale: A expressão é entendida distributivamente no contraste entre um só corpo e muitos membros. Esta formulação comunica que cada destinatário ocupa individualmente seu lugar no conjunto, sem sugerir que sejam membros apenas de maneira incompleta.
theological_decisions:
- issue: Tradução de Χριστοῦ na afirmação eclesiológica paulina
  choice: Messias
  alternative: Cristo
  rationale: O termo mantém aqui o sentido do título messiânico. “Messias” explicita esse valor sem alterar a afirmação de que a comunidade constitui coletivamente seu corpo.
- issue: Sentido de ἐκ μέρους em καὶ μέλη ἐκ μέρους
  choice: 'sentido distributivo: “cada um por sua parte, membros dele”'
  alternative: “membros em particular” ou, mais literalmente, “membros em parte”
  rationale: O contexto imediato contrapõe a unidade do corpo à diversidade de seus membros. A leitura distributiva preserva essa tensão; “em parte” poderia ser entendida equivocadamente como participação incompleta.
- issue: Referente implícito de μέλη
  choice: explicitar “dele”
  alternative: deixar apenas “membros”
  rationale: O pronome não está expresso no grego, mas o corpo do Messias é seu referente contextual inequívoco. A explicitação evita em português uma construção truncada sem acrescentar uma nova relação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. “Pois bem” representa a transição marcada por δέ sem impor contraste excessivo. A formulação mantém a imagem corporal e equilibra a identidade coletiva da comunidade com a participação individual de seus membros.
