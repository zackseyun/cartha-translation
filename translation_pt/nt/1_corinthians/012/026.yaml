id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: pt
  text: E, se um membro sofre, todos os membros sofrem com ele; se um membro é honrado[a], todos os membros se alegram com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «é glorificado». Aqui, o sentido provável é que um membro recebe honra, e o corpo inteiro participa da alegria.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: se ... se
  rationale: A repetição de «se» soa natural em português e preserva a apresentação de duas situações correspondentes na metáfora do corpo.
- source_word: πάσχει
  choice: sofre
  rationale: Mantém o sentido amplo do presente grego, sem especificar indevidamente se o sofrimento é físico, emocional ou social.
- source_word: ἓν μέλος
  choice: um membro
  rationale: «Membro» preserva tanto a imagem anatômica quanto sua aplicação à comunidade; o numeral grego ἓν é naturalmente expresso pelo artigo indefinido neste contexto.
- source_word: συμπάσχει
  choice: sofrem com ele
  rationale: Explicita a participação solidária indicada pelo prefixo συν-, retomando de modo claro o membro singular.
- source_word: πάντα τὰ μέλη
  choice: todos os membros
  rationale: Conserva a abrangência e a repetição retórica do texto grego nas duas orações.
- source_word: δοξάζεται
  choice: é honrado
  rationale: No contexto da vida do corpo, comunica naturalmente que um membro recebe honra ou reconhecimento, sem excluir por nota a tradução mais formal «é glorificado».
- source_word: μέλος
  choice: um membro
  rationale: Na segunda oração, o substantivo não traz o numeral ἓν; em português, «um membro» funciona naturalmente de modo indefinido sem insistir no valor numérico.
- source_word: συγχαίρει
  choice: se alegram com ele
  rationale: 'Preserva a ideia do verbo composto: os demais membros participam da alegria daquele que recebe honra.'
theological_decisions:
- issue: Sentido de δοξάζεται na metáfora comunitária do corpo
  choice: é honrado
  alternative: é glorificado
  rationale: O contexto imediato enfatiza cuidado mútuo e solidariedade entre os membros. «É honrado» expressa bem o sentido social provável, enquanto a nota preserva a alternativa lexical mais formal e a ambiguidade do verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A repetição de «todos os membros» e o paralelismo entre sofrimento e alegria foram mantidos.
