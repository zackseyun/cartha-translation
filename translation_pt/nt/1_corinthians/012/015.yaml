id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: pt
  text: 'Se o pé disser: “Porque não sou mão, não faço parte do corpo”[a], será que, por isso, ele não faz parte do corpo?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não sou do corpo”. A mesma expressão grega se repete no fim do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Se ... disser
  rationale: A construção com ἐὰν e subjuntivo apresenta uma condição hipotética geral. Em português, “Se ... disser” é natural e conserva essa força.
- source_word: ὁ πούς
  choice: o pé
  rationale: Mantém a imagem corporal concreta da metáfora de Paulo.
- source_word: Ὅτι
  choice: Porque
  rationale: 'No discurso do pé, introduz a razão alegada: não ser mão serviria de fundamento para a conclusão de não pertencer ao corpo.'
- source_word: χείρ
  choice: mão
  rationale: Preserva o contraste literal entre os membros do corpo.
- source_word: ἐκ τοῦ σώματος
  choice: fazer parte do corpo
  rationale: A expressão grega indica pertencimento ou integração ao corpo. “Fazer parte do corpo” comunica isso com clareza e naturalidade em português, e sua repetição conserva a coesão retórica.
- source_word: οὐ παρὰ τοῦτο
  choice: será que, por isso, ...?
  rationale: “Por isso” expressa a razão que Paulo rejeita; a formulação interrogativa conserva a pergunta retórica do texto grego.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ele não faz parte do corpo?
  rationale: Conserva a negação e a forma de pergunta retórica, evitando uma dupla negação artificial em português.
theological_decisions:
- issue: Forma da negação na pergunta retórica
  choice: 'Conservar a pergunta: “será que, por isso, ele não faz parte do corpo?”'
  alternative: “nem por isso deixa de fazer parte do corpo”
  rationale: A alternativa enuncia de modo mais direto a conclusão implícita, mas a escolha mantém a forma interrogativa do grego e deixa que a resposta negativa esperada produza o efeito retórico.
- issue: Sentido de ἐκ τοῦ σώματος
  choice: “fazer parte do corpo”
  alternative: “ser do corpo”
  rationale: Aqui a expressão descreve pertencimento dentro da metáfora comunitária. A tradução escolhida torna esse sentido inteligível sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “faz parte do corpo” reproduz a insistência retórica do original, enquanto “será que” mantém a pergunta natural em português.
