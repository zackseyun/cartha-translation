reference: 1 Corinthians 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: pt
  text: e às partes do corpo que consideramos menos honrosas damos honra ainda maior; e as nossas partes menos apresentáveis têm maior decoro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm maior boa apresentação” ou “têm maior aparência apropriada”. O grego pode indicar decoro, boa apresentação ou respeitabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: que consideramos
  rationale: Expressa uma avaliação humana, não uma qualidade objetiva, e soa natural em português atual.
- source_word: ἀτιμότερα
  choice: menos honrosas
  rationale: Preserva o comparativo e o contraste lexical com τιμή, sem intensificar para 'desonrosas'.
- source_word: τοῦ σώματος
  choice: do corpo
  rationale: Mantém a imagem concreta do corpo, central ao argumento do contexto.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: damos honra ainda maior
  rationale: Traduz idiomaticamente o ato de conferir honra, preservando o valor comparativo de περισσοτέραν.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: as nossas partes menos apresentáveis
  rationale: Comunica aquilo que socialmente não convém expor sem sugerir necessariamente imoralidade ou indecência.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: são tratadas com maior decoro
  rationale: Em português, explicita de modo natural o cuidado que confere aparência apropriada; o contexto sustenta esse sentido, embora a forma grega diga literalmente que essas partes 'têm' maior decoro.
theological_decisions:
- issue: Linguagem metafórica do corpo e honra social
  choice: Manter a referência concreta às partes do corpo
  alternative: Parafrasear diretamente como membros socialmente menos valorizados da igreja
  rationale: O argumento de Paulo parte do tratamento dado ao corpo literal e depois o aplica à comunidade; preservar a imagem evita antecipar ou impor a interpretação.
- issue: Natureza da avaliação de menor honra
  choice: Traduzir como algo que 'consideramos' menos honroso
  alternative: Apresentar essas partes como objetivamente menos honrosas
  rationale: δοκοῦμεν marca a percepção ou avaliação humana e conserva a tensão retórica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem corporal e o paralelismo entre menor honra, honra maior e decoro, evitando linguagem excessivamente clínica ou moralizante.
