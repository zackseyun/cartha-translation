  naturalness: A redação é moderna, clara e adequada ao português internacional. «Têm maior decoro» é igualmente natural neste registro e preserva melhor a construção do original.
  terminology: «Menos honrosas», «honra ainda maior», «menos apresentáveis» e «decoro» mantêm o contraste de honra e apresentação apropriada sem moralizar indevidamente as partes corporais. A nota lexical deve descrever alternativas de εὐσχημοσύνη sem introduzir «dignidade», que se aproxima desnecessariamente de τιμή.
