  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: pt
  text: Por acaso todos têm dons de curas[a]? Por acaso todos falam em línguas[b]? Por acaso todos interpretam?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «dons de cura». O grego emprega o plural: «dons de curas».'
    reason: lexical_alternative
  - marker: b
    text: Ou «falam em idiomas». Neste contexto, o termo se refere ao dom comumente chamado de «línguas».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Será que todos...?
  rationale: A construção com μή introduz perguntas retóricas que esperam resposta negativa. Em português, «Será que todos...?» comunica isso com naturalidade, sem transformar a pergunta em afirmação explícita.
- source_word: χαρίσματα
  choice: dons
  rationale: No contexto, χάρισμα designa uma dádiva concedida pela graça; «dons» é a forma corrente e natural em português.
- source_word: ἰαμάτων
  choice: de curas
  rationale: Preserva o plural grego ἰαμάτων e a formulação recorrente neste capítulo, sem reduzi-la à abstração singular «cura».
- source_word: γλώσσαις
  choice: em línguas
  rationale: No contexto de 1 Coríntios 12–14, refere-se ao fenômeno carismático tradicionalmente chamado «línguas»; a expressão portuguesa é clara e estabelecida.
- source_word: λαλοῦσιν
  choice: falam
  rationale: O presente indica uma característica geral, adequadamente expressa pelo presente simples em português.
- source_word: διερμηνεύουσιν
  choice: interpretam
  rationale: No contexto, significa tornar inteligível aos outros o que é falado em línguas; «interpretam» mantém o sentido sem especificar além do texto.
theological_decisions:
- issue: Caráter das perguntas retóricas introduzidas por μή
  choice: Formulá-las como perguntas que naturalmente esperam resposta negativa
  alternative: Apresentá-las como perguntas neutras ou convertê-las em afirmações negativas
  rationale: A sintaxe grega pressupõe que nem todos possuem cada um desses dons. «Será que todos...?» preserva a forma interrogativa e destaca a diversidade de dons no corpo sem apagar a retórica de Paulo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição «Será que todos...?» reproduz a cadência retórica do original. Todos os marcadores de notas aparecem no texto principal junto aos termos pertinentes.
