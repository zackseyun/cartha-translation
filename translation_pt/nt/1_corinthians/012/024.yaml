id: 1CO.12.24
reference: 1 Corinthians 12:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: pt
  text: mas as nossas partes apresentáveis não têm necessidade disso. Pelo contrário, Deus combinou o corpo, dando maior honra à parte que dela carecia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus mesclou o corpo, dando maior honra à parte que dela carecia”. O verbo grego enfatiza a combinação de elementos em um todo unificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: partes apresentáveis
  rationale: No contraste com as partes menos apresentáveis do versículo anterior, expressa decoro exterior em linguagem moderna; “partes” é suprido pelo contexto.
- source_word: χρείαν ἔχει
  choice: não têm necessidade disso
  rationale: Reproduz a expressão idiomática de modo natural; “disso” retoma o cuidado ou tratamento especial mencionado no contexto.
- source_word: συνεκέρασεν
  choice: combinou
  rationale: Preserva a ideia de reunir ou mesclar elementos num todo unificado, sem reduzir a ação de Deus a uma organização meramente mecânica.
- source_word: σῶμα
  choice: o corpo
  rationale: Mantém sem expansão a metáfora central de Paulo.
- source_word: τῷ ὑστεροῦντι
  choice: à parte que dela carecia
  rationale: Indica que a parte carecia de honra, e não que tivesse menor valor intrínseco; o referente de “dela” é a honra mencionada em seguida.
- source_word: περισσοτέραν τιμήν
  choice: maior honra
  rationale: Tradução clara e natural que conserva a força comparativa.
- source_word: δοὺς
  choice: dando
  rationale: Mantém a construção participial e apresenta a concessão de honra como ligada ao modo pelo qual Deus combinou o corpo.
theological_decisions:
- issue: Sentido da ação de Deus ao combinar o corpo
  choice: Deus reúne intencionalmente o corpo e concede maior honra à parte que carecia dela.
  alternative: A referência poderia ser entendida apenas como descrição da constituição do corpo humano físico.
  rationale: O contexto sustenta simultaneamente a anatomia ilustrativa e sua aplicação à comunidade como corpo; a tradução mantém a metáfora sem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pelo contrário” marca naturalmente o contraste de ἀλλά. O pretérito perfeito traduz o aoristo συνεκέρασεν sem acrescentar uma ênfase aspectual não exigida pelo grego.
