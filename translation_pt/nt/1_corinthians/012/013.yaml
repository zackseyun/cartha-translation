  source_fidelity: A tradução reproduz adequadamente a estrutura argumentativa, os contrastes sociais e étnicos, a incorporação em um só corpo e a metáfora de beber de um só Espírito. A opção «em um só Espírito» preserva corretamente a ambiguidade de ἐν. A oração final mantém de modo apropriado o passivo de ἐποτίσθημεν mediante a construção impessoal portuguesa «foi dado ... beber».
  naturalness: O texto é claro e de registro moderno. Ajusta-se a pontuação inicial para que «de fato» funcione naturalmente como expressão parentética. A construção final «a todos nós foi dado beber» é compreensível, mas «foi dado a todos nós beber» oferece fluxo um pouco mais direto, preservando a ênfase em «todos nós».
  terminology: «Espírito», «batizados», «corpo», «judeus», «gregos», «escravos» e «livres» são escolhas fiéis, naturais e teologicamente não sectárias. As duas ambiguidades distintas da cláusula final — a ordem/construção de «dar de beber» e a capitalização interpretativa de πνεῦμα — devem receber notas separadas, em vez de serem acumuladas sob uma única âncora de nota lexical.
