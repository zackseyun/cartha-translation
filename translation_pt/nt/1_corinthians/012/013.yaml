  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether slaves or free—and we all were given to drink one Spirit.
translation:
  language: pt
  text: Pois, de fato, em um só Espírito[a], todos nós fomos batizados em um só corpo — quer judeus, quer gregos, quer escravos, quer livres — e foi dado a todos nós beber de um só Espírito[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por um só Espírito”. A preposição grega pode indicar esfera (“em”) ou meio/agência (“por”).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e todos nós recebemos um só Espírito para beber”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “espírito”, se entendido de modo menos específico, embora o contexto aponte fortemente para o Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: Preserva tanto o valor explicativo de γάρ quanto a ênfase de καί, em português natural.
- source_word: ἐν ἑνὶ πνεύματι
  choice: em um só Espírito
  rationale: Mantém a forma grega e não resolve indevidamente se ἐν indica esfera, meio ou agência; a alternativa instrumental é registrada em nota.
- source_word: ἡμεῖς πάντες
  choice: todos nós
  rationale: Reproduz a ênfase coletiva do pronome explícito com πάντες.
- source_word: ἐβαπτίσθημεν
  choice: fomos batizados
  rationale: É a expressão corrente e apropriada ao uso eclesial paulino, sem introduzir uma posição sobre o modo do batismo.
- source_word: εἰς ἓν σῶμα
  choice: em um só corpo
  rationale: Exprime a incorporação resultante indicada por εἰς e preserva a imagem paulina da unidade do corpo.
- source_word: Ἰουδαῖοι / Ἕλληνες
  choice: judeus / gregos
  rationale: Conserva o contraste étnico-religioso expresso diretamente pelos termos gregos.
- source_word: δοῦλοι / ἐλεύθεροι
  choice: escravos / livres
  rationale: O contraste explícito de condição social requer 'escravos', enquanto 'livres' é a contraparte clara e natural.
- source_word: ἐποτίσθημεν
  choice: foi dado beber
  rationale: Expressa naturalmente o passivo de ποτίζω, 'dar de beber', preservando a metáfora de participação comum.
- source_word: ἓν πνεῦμα
  choice: um só Espírito
  rationale: O contexto favorece uma referência ao Espírito Santo e a repetição de 'um só' reforça a unidade; uma construção alternativa é indicada em nota.
theological_decisions:
- issue: Se ἐν ἑνὶ πνεύματι indica esfera ou agência/meio
  choice: em um só Espírito
  alternative: por um só Espírito
  rationale: A preposição ἐν admite ambas as nuances. O texto principal preserva de modo mais direto a construção grega, e a nota mantém aberta a leitura instrumental.
- issue: Referente de ἓν πνεῦμα na oração final
  choice: um só Espírito
  alternative: um só espírito
  rationale: O contexto imediato sobre a atuação unificadora do Espírito favorece o Espírito Santo, embora a minúscula possa representar uma leitura menos específica.
- issue: Sentido social de δοῦλοι
  choice: escravos
  alternative: servos
  rationale: No contraste com 'livres', está em foco a condição de escravidão, não apenas o serviço.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “um só” comunica a ênfase na unidade; “quer... quer...” preserva com concisão os pares contrastivos do grego.
