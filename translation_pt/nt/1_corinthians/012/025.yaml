source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: pt
  text: para que não haja divisão no corpo[a], mas para que os membros tenham igual cuidado uns com os outros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cisão” ou “cisma”. O termo grego pode indicar uma ruptura ou um rasgo; aqui se refere à divisão dentro do corpo.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “mas que os membros cuidem igualmente uns dos outros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: para que não haja
  rationale: Expressa naturalmente em português a finalidade ou o resultado pretendido, preservando o valor de ἵνα com o subjuntivo.
- source_word: σχίσμα
  choice: divisão
  rationale: Comunica uma ruptura ou cisão dentro do corpo sem recorrer ao termo mais técnico e historicamente carregado “cisma”.
- source_word: ἐν τῷ σώματι
  choice: no corpo
  rationale: Preserva diretamente a metáfora paulina do corpo, que no contexto representa a comunidade cristã.
- source_word: τὸ αὐτό
  choice: igual cuidado
  rationale: Em ligação com μεριμνῶσι, a expressão indica correspondência ou igualdade no cuidado mútuo, e não simplesmente “a mesma coisa”.
- source_word: ὑπὲρ ἀλλήλων
  choice: uns pelos outros
  rationale: Preserva o sentido recíproco e indica cuidado dirigido ao bem dos demais, sem sugerir substituição.
- source_word: μεριμνῶσι
  choice: tenham ... cuidado
  rationale: Neste contexto, o verbo descreve solicitude positiva, não ansiedade; a formulação é natural e combina com τὸ αὐτό.
- source_word: τὰ μέλη
  choice: os membros
  rationale: Mantém o vocabulário da metáfora corporal e sua aplicação implícita aos integrantes da comunidade.
theological_decisions:
- issue: Tradução de σχίσμα na metáfora eclesial
  choice: divisão
  alternative: cisma
  rationale: “Divisão” preserva o sentido imediato de ruptura interna no corpo e evita introduzir as conotações institucionais posteriores que “cisma” pode ter.
- issue: Relação expressa por τὸ αὐτὸ ... μεριμνῶσι
  choice: tenham igual cuidado uns pelos outros
  alternative: tenham o mesmo cuidado uns pelos outros
  rationale: “Igual cuidado” torna perceptível a possível nuance distributiva de cuidado equitativo entre os membros, sem excluir a ideia de uma solicitude comum e recíproca.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “para que” explicita a coordenação entre as duas orações finais; “membros” preserva a metáfora corporal tradicional sem soar arcaico.
