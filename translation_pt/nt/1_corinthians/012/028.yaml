id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: pt
  text: E Deus designou na igreja, em primeiro lugar, apóstolos; em segundo, profetas; em terceiro, mestres; depois, milagres[a]; depois, dons de curas, formas de auxílio, administrações[b] e variedades de línguas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obras de poder”.
    reason: lexical_alternative
  - marker: b
    text: Ou “formas de direção” ou “formas de liderança”.
    reason: lexical_alternative
  - marker: c
    text: Ou “variedades de idiomas”. O termo grego pode significar “línguas” ou “idiomas”; o texto principal preserva a ambiguidade da formulação de Paulo neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: designou
  rationale: No contexto, τίθημι indica que Deus atribuiu ou estabeleceu pessoas e funções na igreja. “Designou” comunica essa ação divina de modo natural, sem reduzi-la à ideia espacial de simplesmente colocar.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: na igreja
  rationale: Em Paulo, ἐκκλησία aqui se refere à comunidade reunida do povo de Deus. “Igreja” é a forma corrente, clara e adequada ao contexto.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: em primeiro lugar ... em segundo ... em terceiro
  rationale: A formulação reproduz claramente a sequência marcada pelo grego sem explicar se ela indica hierarquia, cronologia ou proeminência funcional.
- source_word: ἀποστόλους
  choice: apóstolos
  rationale: Preserva o termo reconhecido para a função apostólica neste catálogo eclesial, em vez de generalizá-lo como simples mensageiros.
- source_word: προφήτας
  choice: profetas
  rationale: Equivalente direto e corrente para os que exercem função profética.
- source_word: διδασκάλους
  choice: mestres
  rationale: “Mestres” expressa naturalmente a função de ensinar na comunidade e mantém a forma pessoal do substantivo grego.
- source_word: δυνάμεις
  choice: milagres
  rationale: Embora o sentido literal seja “poderes”, neste catálogo δυνάμεις designa manifestações ou obras poderosas. “Milagres” comunica o sentido contextual, enquanto a nota preserva a alternativa mais literal.
- source_word: χαρίσματα ἰαμάτων
  choice: dons de curas
  rationale: Mantém o plural dos dois substantivos gregos, evitando reduzir a expressão a um único dom ou a uma única modalidade de cura.
- source_word: ἀντιλήμψεις
  choice: formas de auxílio
  rationale: O substantivo plural denota atos, capacidades ou funções de assistência. “Formas de auxílio” é claro em português e preserva a amplitude da expressão.
- source_word: κυβερνήσεις
  choice: administrações
  rationale: O termo evoca condução, direção ou governo. “Administrações” expressa funções de organizar e dirigir sem transformá-las necessariamente em um cargo hierárquico.
- source_word: γένη γλωσσῶν
  choice: variedades de línguas
  rationale: “Variedades” representa γένη, e “línguas” preserva a ambiguidade de γλῶσσαι entre o fenômeno denominado falar em línguas e idiomas, sem decidir sua natureza precisa.
theological_decisions:
- issue: Se a sequência indica hierarquia permanente, ordem cronológica ou proeminência funcional
  choice: Reproduzir a sequência como “em primeiro lugar ... em segundo ... em terceiro ... depois ... depois”.
  alternative: Explicitar uma hierarquia de autoridade, uma cronologia ou uma ordem de importância.
  rationale: O texto apresenta uma ordem, mas não define a natureza dessa ordem. A tradução conserva a sequência sem acrescentar uma interpretação teológica.
- issue: O sentido de γλῶσσαι neste contexto
  choice: Usar “línguas” no texto principal.
  alternative: Usar “idiomas” e assim identificar de modo mais específico o fenômeno.
  rationale: “Línguas” mantém a terminologia paulina e a ambiguidade contextual; a nota registra “idiomas” como possibilidade lexical.
- issue: O plural em χαρίσματα ἰαμάτων
  choice: Manter “dons de curas”.
  alternative: Regularizar para o singular idiomático “dom de cura”.
  rationale: Os dois termos estão no plural no grego. A forma escolhida conserva essa particularidade sem determinar quantos dons ou tipos de cura Paulo tinha em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação destaca a sequência inicial e distingue os grupos do catálogo. Mantiveram-se “dons de curas” e “línguas” para preservar formas e ambiguidades relevantes do grego, enquanto notas breves apresentam alternativas lexicais.
