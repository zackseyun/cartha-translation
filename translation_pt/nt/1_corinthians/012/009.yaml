  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: pt
  text: a outro, fé[a] pelo mesmo Espírito; a outro, dons de curas por um só Espírito[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade” ou “confiança”, para “fé” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “dons de curas”, com os dois substantivos no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: a outro
  rationale: O dativo singular dá continuidade à distribuição iniciada no versículo anterior. “A outro” é natural em português e não força uma distinção entre ἕτερος e ἄλλος que o contexto não exige.
- source_word: πίστις
  choice: fé
  rationale: “Fé” é a correspondência mais direta e habitual para πίστις. Neste contexto, designa um dom concedido pelo Espírito, sem que a tradução determine uma teoria específica sobre sua natureza.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: pelo mesmo Espírito
  rationale: O uso de ἐν com o dativo pode indicar meio ou agência. “Pelo mesmo Espírito” é idiomático e preserva a ênfase no Espírito como aquele por meio de quem o dom é concedido.
- source_word: ἄλλῳ
  choice: a outro
  rationale: Mantém o padrão distributivo da lista. Repetir “a outro” é claro e natural em português.
- source_word: χαρίσματα
  choice: dons
  rationale: “Dons” expressa de modo conciso os benefícios concedidos pela graça e corresponde ao vocabulário do contexto.
- source_word: ἰαμάτων
  choice: de curas
  rationale: Conserva o plural do grego e, assim, a formulação incomum “dons de curas”, sem reduzi-la ao singular mais idiomático.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: pelo único Espírito
  rationale: “Pelo” comunica o provável valor instrumental de ἐν; “único” distingue ἑνί (“um só”) de αὐτῷ (“mesmo”) e ressalta a unidade do Espírito em contraste com a diversidade dos dons.
theological_decisions:
- issue: Sentido de πίστις no contexto dos dons espirituais
  choice: fé
  alternative: fidelidade ou confiança
  rationale: O texto apresenta πίστις como algo distribuído pelo Espírito, mas não define com maior precisão sua manifestação. “Fé” preserva o termo paulino usual; a nota registra alternativas lexicais legítimas sem impor uma doutrina carismática específica.
- issue: Referência de πνεύματι
  choice: Espírito, com inicial maiúscula, como referência ao Espírito Santo
  alternative: espírito
  rationale: O contexto imediato de 1 Coríntios 12 identifica o Espírito como o agente comum na distribuição dos dons. A maiúscula torna essa referência clara sem acrescentar conteúdo alheio ao contexto.
- issue: Pluralidade em χαρίσματα ἰαμάτων
  choice: dons de curas
  alternative: dons de cura
  rationale: Ambos os substantivos estão no plural no grego. A tradução conserva essa forma, embora seja menos convencional em português, sem concluir o que cada plural implica teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação acompanha a estrutura distributiva do contexto. “Dons de curas” é deliberadamente menos idiomático para preservar o plural grego; as notas registram ambiguidades lexicais reais.
