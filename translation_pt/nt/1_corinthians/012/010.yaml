  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: pt
  text: a outro, realizações de milagres[a]; a outro, profecia; a outro, discernimentos de espíritos; a outro, variedades de línguas[b]; a outro, interpretação de línguas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “operações de poderes” ou “operações de feitos poderosos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “variedades de idiomas” e “interpretação de idiomas”. O termo grego pode significar tanto “línguas” como “idiomas”; aqui se mantém “línguas” para preservar a ambiguidade na discussão de Paulo sobre os dons espirituais.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: operações de milagres
  rationale: A expressão indica atuações ou efeitos de poder e, neste contexto de dons espirituais, provavelmente se refere a feitos milagrosos. “Operações” preserva a ideia de atividade eficaz, enquanto “milagres” comunica o referente provável; a nota registra alternativas mais literais.
- source_word: προφητεία
  choice: profecia
  rationale: Equivalente padrão, conciso e natural, sem restringir indevidamente a natureza do dom.
- source_word: διακρίσεις
  choice: discernimentos
  rationale: O plural grego pode indicar atos ou manifestações variadas de discernimento; o plural em português preserva essa forma.
- source_word: πνευμάτων
  choice: de espíritos
  rationale: Mantém aberto se os espíritos são humanos, sobrenaturais ou fontes de manifestações, sem acrescentar uma identificação ausente no grego.
- source_word: γένη
  choice: diferentes tipos
  rationale: Expressa de modo natural as classes ou variedades indicadas pelo substantivo plural grego.
- source_word: γλωσσῶν
  choice: de línguas
  rationale: “Línguas” conserva tanto o uso tradicional no contexto dos dons quanto a ambiguidade lexical entre línguas humanas e outras formas de fala.
- source_word: ἑρμηνεία
  choice: interpretação
  rationale: Indica tornar inteligível o conteúdo expresso em línguas sem limitar o sentido à tradução entre idiomas conhecidos.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: a outro
  rationale: A repetição marca a distribuição dos dons entre pessoas distintas. A mesma formulação em português mantém fluidez sem atribuir peso excessivo à alternância lexical grega.
theological_decisions:
- issue: Sentido de δυνάμεων na lista de dons
  choice: milagres
  alternative: poderes; feitos poderosos
  rationale: Neste contexto, δυνάμεις provavelmente designa manifestações concretas de poder, isto é, milagres. A nota preserva as alternativas mais formais.
- issue: Sentido de γλωσσῶν
  choice: línguas
  alternative: idiomas
  rationale: “Línguas” preserva a tensão lexical e teológica, sem decidir se o fenômeno consiste exclusivamente em idiomas humanos conhecidos, fala extática ou uma categoria mais ampla.
- issue: Referente de πνευμάτων
  choice: espíritos
  alternative: manifestações espirituais; espíritos por trás das declarações
  rationale: O texto grego não identifica com precisão os espíritos em questão; manter o termo amplo evita impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enumerativa e a repetição de “a outro” refletem a distribuição dos dons no grego. “Operações de milagres” mantém uma formulação bíblica reconhecível sem se tornar arcaica.
source_grounding:
  english_pob_role: consult_only
