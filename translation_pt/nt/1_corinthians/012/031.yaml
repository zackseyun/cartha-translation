  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: pt
  text: Mas desejem ardentemente os dons maiores.[a] E lhes mostro um caminho ainda mais excelente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas vocês desejam ardentemente os dons maiores”. Neste contexto, a forma grega ζηλοῦτε pode ser entendida como imperativo ou como indicativo.'
    reason: alternative_reading
  - marker: b
    text: A expressão grega indica uma superioridade extraordinária, além da medida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: desejem ardentemente
  rationale: Expressa o desejo intenso ou zelo do verbo. O imperativo se ajusta bem ao fluxo exortativo, embora a forma grega também possa ser entendida como indicativo; essa ambiguidade é preservada em nota.
- source_word: χαρίσματα
  choice: dons
  rationale: No contexto, refere-se aos dons concedidos pela graça. “Dons” é claro e conciso, sem acrescentar “espirituais”, palavra ausente desta oração.
- source_word: μείζονα
  choice: maiores
  rationale: Preserva o comparativo grego sem explicar além do texto se a grandeza diz respeito à importância, ao proveito ou a outro aspecto contextual.
- source_word: καὶ ἔτι
  choice: E ainda
  rationale: Mantém tanto a continuidade com a discussão anterior quanto a progressão para algo que vai além dela.
- source_word: καθ’ ὑπερβολὴν
  choice: que supera todos
  rationale: Comunica em português natural a ideia de superioridade extraordinária ou além da medida, evitando a formulação pouco idiomática “mais sobreexcelente”.
- source_word: ὁδὸν
  choice: caminho
  rationale: Preserva a metáfora de uma maneira de viver ou proceder, que introduz o ensino sobre o amor.
- source_word: δείκνυμι
  choice: mostro
  rationale: Traduz diretamente o presente grego e funciona naturalmente como presente de introdução ao que Paulo passa a expor.
theological_decisions:
- issue: Valor verbal de ζηλοῦτε
  choice: 'imperativo: “desejem ardentemente”'
  alternative: 'indicativo: “vocês desejam ardentemente”'
  rationale: A forma grega admite as duas leituras neste contexto. O imperativo combina com o tom exortativo da passagem, mas a alternativa é registrada para não eliminar uma ambiguidade real.
- issue: Relação entre os dons maiores e o caminho do amor
  choice: manter “dons maiores” e apresentar o amor como um caminho que supera todos
  alternative: explicitar que o amor é “o dom maior”
  rationale: O texto chama o amor de caminho, não de dom. A tradução evita fundir essas categorias e preserva a tensão argumentativa entre o final do capítulo 12 e o capítulo 13.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Desejem ardentemente” conserva a intensidade sem soar arcaico; “lhes mostro” mantém o presente grego. A formulação “um caminho que supera todos” é idiomática e deixa claro que a comparação recai sobre o caminho, sem acrescentar uma identificação doutrinária não expressa no versículo.
