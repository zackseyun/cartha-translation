id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: pt
  text: Vocês não sabem que são santuário de Deus[a][b] e que o Espírito de Deus habita em vocês[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo de Deus”.
    reason: lexical_alternative
  - marker: b
    text: “Vocês” está no plural; Paulo se dirige à comunidade coletivamente.
    reason: cultural_note
  - marker: c
    text: Ou “entre vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Preserva a forma de pergunta retórica e traduz explicitamente a segunda pessoa do plural em português natural.
- source_word: ναὸς θεοῦ
  choice: santuário de Deus
  rationale: ναός designa especificamente o espaço sagrado interior, não todo o complexo do templo. “Santuário” comunica essa precisão em português; “templo” permanece uma alternativa natural.
- source_word: ἐστε
  choice: são
  rationale: Concorda com “vocês” e mantém o destinatário plural, importante para a imagem comunitária no contexto.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: o Espírito de Deus
  rationale: Reproduz com clareza a construção genitiva grega e emprega a forma consagrada e natural em português.
- source_word: οἰκεῖ
  choice: habita
  rationale: Expressa residência contínua e se harmoniza com a imagem do santuário.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Mantém a expressão grega sem decidir entre habitação no conjunto da comunidade e presença entre seus membros.
theological_decisions:
- issue: Se o versículo se refere principalmente a cada fiel ou à comunidade reunida
  choice: O texto principal usa “vocês”, preservando o plural e a formulação do original.
  alternative: “Vocês, juntos, são o santuário de Deus” ou “cada um de vocês é santuário de Deus”.
  rationale: O grego se dirige à comunidade no plural, mas não contém “juntos” nem “cada um”. A tradução evita tanto explicitar além do texto a leitura corporativa quanto individualizá-lo.
- issue: Sentido espacial de ἐν ὑμῖν
  choice: “em vocês” no texto principal
  alternative: “entre vocês”
  rationale: A preposição ἐν permite que, neste contexto plural e comunitário, a frase seja entendida como presença no conjunto ou entre os destinatários. A nota conserva a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vocês” torna explícito o plural do grego; “habita” preserva a imagem sacral sem soar arcaico.
