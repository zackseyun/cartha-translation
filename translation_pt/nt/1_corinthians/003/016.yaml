  verdict: approve
  source_fidelity: A tradução reproduz adequadamente a pergunta retórica, o predicado plural dirigido à comunidade, a imagem cultual de ναὸς θεοῦ e a habitação contínua do Espírito. “Santuário de Deus” é uma opção semanticamente defensável para ναός; a nota registra de modo apropriado “templo de Deus” como alternativa. “Em vocês” preserva a ambiguidade possível de ἐν ὑμῖν.
  naturalness: O texto é claro, moderno e natural em português de ampla compreensão. “Vocês não sabem que são santuário de Deus...?” mantém um registro bíblico digno sem arcaísmo excessivo. “Habita em vocês” é fluente e condiz com a metáfora do santuário.
  terminology: “Espírito de Deus” e “habita” são escolhas estabelecidas e adequadas. “Santuário” comunica o campo semântico mais específico de ναός, enquanto a nota com “templo” oferece a alternativa portuguesa mais corrente. A nota sobre o plural evita individualizar indevidamente o destinatário coletivo.
