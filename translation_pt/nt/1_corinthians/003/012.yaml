lexical_decisions:
- source_word: εἰ
  choice: se
  rationale: Introduz diretamente a condição e corresponde ao uso natural do português.
- source_word: δέ
  choice: não expresso separadamente
  rationale: Marca uma leve progressão no argumento; em português, a ligação com o contexto fica natural sem acrescentar um conectivo que poderia sugerir contraste ou temporalidade indevidos.
- source_word: τις
  choice: alguém
  rationale: Preserva a referência indefinida e genérica em linguagem corrente.
- source_word: ἐποικοδομεῖ
  choice: constrói
  rationale: Expressa com clareza o ato de construir sobre algo; a relação com a base é explicitada pela expressão seguinte.
- source_word: ἐπὶ τὸν θεμέλιον
  choice: sobre o fundamento
  rationale: Mantém a imagem arquitetônica e a relação espacial ou metafórica do original.
- source_word: χρυσόν
  choice: ouro
  rationale: Equivalente direto do material mencionado.
- source_word: ἄργυρον
  choice: prata
  rationale: Equivalente direto, em paralelo com ouro.
- source_word: λίθους τιμίους
  choice: pedras preciosas
  rationale: Preserva o sentido de pedras valiosas ou de alta qualidade sem restringi-las necessariamente a gemas ornamentais.
- source_word: ξύλα
  choice: madeira
  rationale: O substantivo coletivo é a forma idiomática em português para esse material de construção.
- source_word: χόρτον
  choice: feno
  rationale: No contraste entre materiais de construção, comunica matéria vegetal seca e combustível melhor do que o sentido genérico de capim.
- source_word: καλάμην
  choice: palha
  rationale: É o equivalente natural no contexto da lista de materiais frágeis e combustíveis.
