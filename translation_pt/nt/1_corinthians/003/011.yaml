  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: pt
  text: Pois ninguém pode colocar outro fundamento além do que já está posto, que é Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”.'
    reason: Registra a forma tradicional de verter Ἰησοῦς Χριστός.
lexical_decisions:
- source_word: θεμέλιον
  choice: fundamento
  rationale: Mantém de modo natural a metáfora de construção desenvolvida por Paulo no contexto.
- source_word: γὰρ
  choice: pois
  rationale: Expressa a relação explicativa com a afirmação anterior sem acrescentar conteúdo.
- source_word: ἄλλον οὐδεὶς δύναται θεῖναι
  choice: ninguém pode colocar outro
  rationale: Reproduz a negação universal, a ideia de possibilidade e a ação de assentar um fundamento em português corrente.
- source_word: παρὰ τὸν κείμενον
  choice: além do que já está posto
  rationale: Preserva a força excludente de παρά e o estado resultante indicado pelo particípio κείμενον.
- source_word: ὅς ἐστιν
  choice: que é
  rationale: Liga diretamente o fundamento à sua identificação, conservando a estrutura relativa do grego.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa a forma idiomática portuguesa com artigo, sem tratá-lo apenas como sobrenome.
theological_decisions:
- issue: Sentido de Χριστός em Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: O contexto identifica o fundamento com Jesus em sua condição messiânica. A tradução explicita o valor titular de Χριστός; a forma tradicional é registrada em nota.
- issue: Identificação metafórica do fundamento
  choice: que é Jesus, o Messias
  alternative: o qual é Jesus, o Messias
  rationale: A forma escolhida mantém a identificação explícita presente no grego sem explicar além do texto nem desfazer a metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fundamento” preserva a imagem arquitetônica; “já está posto” comunica o caráter previamente estabelecido do fundamento. O marcador [a] aparece no texto principal.
