  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: pt
  text: Se a obra que alguém construiu sobre esse fundamento permanecer[a], receberá uma recompensa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «resistir» ou «durar».
    reason: lexical_alternative
  - marker: b
    text: Ou «um pagamento» ou «um salário».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Se
  rationale: Introduz de modo direto uma condição simples.
- source_word: τινος
  choice: alguém
  rationale: O pronome indefinido no genitivo indica a pessoa a quem pertence a obra; em português, a construção com «alguém construiu» transmite isso naturalmente.
- source_word: τὸ ἔργον
  choice: a obra
  rationale: Mantém a amplitude do termo e se ajusta à metáfora de construção presente no contexto.
- source_word: μενεῖ
  choice: permanecer
  rationale: Reproduz o sentido básico de continuar ou ficar, sem explicitar demais a ideia contextual de sobreviver à prova.
- source_word: ὃ ἐποικοδόμησεν
  choice: que alguém construiu sobre esse fundamento
  rationale: O verbo composto expressa construir sobre uma base. «Esse fundamento» torna a frase natural em português e retoma o fundamento explicitamente mencionado no contexto imediato, sem identificar além disso a natureza da obra.
- source_word: μισθὸν
  choice: uma recompensa
  rationale: No contexto de avaliação, «recompensa» comunica compensação ou reconhecimento sem restringir o termo ao sentido econômico de salário.
- source_word: λήμψεται
  choice: receberá
  rationale: Traduz de maneira concisa e digna o futuro de λαμβάνω; o sujeito permanece recuperável pelo contexto, como no grego.
theological_decisions:
- issue: Natureza da recompensa
  choice: uma recompensa
  alternative: um pagamento; um salário
  rationale: O texto afirma que haverá μισθός, mas não define aqui sua natureza. «Recompensa» preserva essa abertura e evita pressupor um pagamento contratual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A omissão de um pronome equivalente a «ele» em «receberá» é idiomática em português e não altera a referência singular do texto grego.
