id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: pt
  text: E eu, irmãos[a], não pude falar a vocês como a pessoas espirituais, mas como a pessoas carnais, como a bebês no Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em Cristo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: E eu
  rationale: Preserva tanto a conexão de καί com o contexto anterior quanto o pronome explícito, sem dar ênfase excessiva.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina do vocativo grego; a possível referência inclusiva à comunidade é registrada em nota.
- source_word: οὐκ ἠδυνήθην
  choice: não pude
  rationale: Expressa de modo natural em português a incapacidade passada indicada pelo aoristo.
- source_word: λαλῆσαι ὑμῖν
  choice: falar a vocês
  rationale: É uma tradução direta e corrente do infinitivo com objeto no dativo, com ampla legibilidade brasileira.
- source_word: πνευματικοῖς
  choice: pessoas espirituais
  rationale: Explicita o uso substantivado do adjetivo sem definir além do texto em que sentido essas pessoas são espirituais.
- source_word: σαρκίνοις
  choice: pessoas carnais
  rationale: Conserva o contraste lexical com “espirituais” e a ligação com σάρξ, sem recorrer a paráfrases mais interpretativas, como “mundanas” ou “dominadas pelo pecado”.
- source_word: νηπίοις
  choice: bebês
  rationale: Comunica com clareza a metáfora de imaturidade expressa por νήπιος e soa mais natural no português contemporâneo do que “lactentes”.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva a força titular de Χριστός segundo a orientação do projeto, ao mesmo tempo que mantém a construção relacional de ἐν.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: A opção principal conserva a força de título de Χριστός. A forma tradicional e possivelmente mais nominal em uso paulino é mantida em nota, sem eliminar a tensão lexical.
- issue: Sentido de σαρκίνοις
  choice: pessoas carnais
  alternative: pessoas de carne
  rationale: “Carnais” preserva a oposição a “espirituais” e é inteligível, mas não se acrescenta uma explicação moralizante que identificaria diretamente o termo com perversidade ou mundanismo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural para leitores brasileiros. “A vocês” evita regionalismo excessivo; “bebês” torna a metáfora imediatamente compreensível. Os marcadores [a] e [b] aparecem junto aos termos a que suas notas se referem.
