  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: pt
  text: Afinal, o que é Apolo? E o que é Paulo?[a] São servos[b] por meio dos quais vocês creram, conforme o Senhor concedeu a cada um.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Quem é Apolo? E quem é Paulo?” O grego emprega “o que”, destacando a função deles, não sua identidade.'
    reason: lexical_alternative
  - marker: b
    text: Ou “ministros”. A palavra grega indica servos ou agentes de serviço e não necessariamente o ofício eclesiástico de diácono.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão grega é elíptica: não declara expressamente o que o Senhor concedeu a cada um. Também pode ser entendida como “segundo o que o Senhor atribuiu a cada um”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: o que
  rationale: O interrogativo neutro põe em foco a função ou condição de Apolo e Paulo, não a identidade pessoal deles; por isso, “o que” reproduz melhor a força retórica do grego.
- source_word: οὖν
  choice: Afinal
  rationale: Neste contexto argumentativo, “afinal” expressa de modo natural a transição inferencial, sem tornar a conclusão excessivamente rígida.
- source_word: δέ
  choice: E
  rationale: A partícula liga a segunda pergunta à primeira com leve contraste; “e” preserva a coordenação retórica em português corrente.
- source_word: διάκονοι
  choice: servos
  rationale: Aqui, o termo designa pessoas que prestam serviço ou atuam como agentes, não necessariamente ocupantes do ofício eclesiástico de diácono.
- source_word: δι’ ὧν
  choice: por meio dos quais
  rationale: διά com o genitivo indica meio ou agência; a formulação deixa claro que Apolo e Paulo foram instrumentos, não a causa última da fé.
- source_word: ἐπιστεύσατε
  choice: vocês creram
  rationale: A forma verbal aponta diretamente para o ato de crer, sem acrescentar ao texto um objeto ou uma explicação interpretativa.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: conforme o Senhor concedeu a cada um
  rationale: A tradução mantém sem objeto explícito o verbo “concedeu”, preservando a elipse do grego, mas com sintaxe compreensível em português.
- source_word: κύριος
  choice: Senhor
  rationale: “Senhor” é a correspondência portuguesa tradicional e adequada, sem explicitar no corpo do versículo um referente que o grego não nomeia.
theological_decisions:
- issue: Referente de κύριος
  choice: Manter apenas “o Senhor” no texto principal.
  alternative: Explicitar “o Senhor Jesus” ou entender a expressão como referência mais geral a Deus.
  rationale: Embora o contexto paulino favoreça a referência ao Senhor Jesus, a tradução não deve especificar além do que o próprio versículo declara.
- issue: Elipse em “conforme o Senhor concedeu a cada um”
  choice: Preservar o objeto não expresso de “concedeu”.
  alternative: Traduzir “conforme a tarefa que o Senhor atribuiu a cada um” ou “conforme o Senhor designou a cada um”.
  rationale: Acrescentar “tarefa”, “função” ou outro objeto resolveria uma abertura que o texto grego mantém; a nota esclarece a construção sem alterar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente a segunda pessoa do plural. O acréscimo de “São” torna a resposta nominal idiomática em português, sem mudar seu conteúdo. As notas preservam as alternativas lexicais e a elipse do original.
