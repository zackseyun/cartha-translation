  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: pt
  text: seja Paulo, seja Apolo, seja Cefas, seja o mundo, seja a vida, seja a morte, sejam as coisas presentes, sejam as futuras — tudo é de vocês,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: seja... seja
  rationale: A repetição preserva a estrutura retórica da série e soa natural em português; a flexão para «sejam» acompanha os itens no plural.
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: Ἀπολλῶς
  choice: Apolo
  rationale: Forma portuguesa tradicional e corrente do nome pessoal.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Preserva o nome de forma semítica empregado no texto grego, sem substituí-lo pelo equivalente Pedro.
- source_word: κόσμος
  choice: o mundo
  rationale: Equivalente natural e suficientemente amplo para o mundo ou a ordem criada no argumento de Paulo.
- source_word: ζωή
  choice: a vida
  rationale: Correspondência direta e natural no contexto da enumeração.
- source_word: θάνατος
  choice: a morte
  rationale: Correspondência lexical direta, preservando o contraste com a vida.
- source_word: ἐνεστῶτα
  choice: as coisas presentes
  rationale: O particípio substantivado designa as realidades presentes; a formulação mantém o paralelismo com «as futuras».
- source_word: μέλλοντα
  choice: as futuras
  rationale: O particípio substantivado designa realidades futuras; a elipse de «coisas» evita repetição pesada sem perder o sentido.
- source_word: πάντα
  choice: tudo
  rationale: Resume de modo totalizante a lista, que inclui tanto pessoas quanto realidades, e é idiomático em português.
- source_word: ὑμῶν
  choice: é de vocês
  rationale: Expressa diretamente a relação de posse indicada pelo genitivo e oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Alcance da afirmação possessiva
  choice: Manter a formulação abrangente «tudo é de vocês»
  alternative: Explicitar que tudo está a serviço ou para o benefício dos fiéis
  rationale: O texto afirma posse de modo conciso e retoricamente forte; explicar a natureza dessa posse no corpo da tradução resolveria uma tensão que o versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. A sequência «seja... seja» reproduz a anáfora grega, e o travessão marca a conclusão enfática. A vírgula final foi mantida porque o versículo continua sintaticamente em 1 Coríntios 3:23.
