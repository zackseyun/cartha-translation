  source_fidelity: A tradução reproduz fielmente a série alternativa de εἴτε … εἴτε, mantém os nomes Paulo, Apolo e Cefas (sem substituir Cefas por Pedro), e verte adequadamente κόσμος, ζωή, θάνατος, ἐνεστῶτα, μέλλοντα, πάντα e ὑμῶν. «Tudo é de vocês» preserva a conclusão abrangente e enfática do grego sem acrescentar explicações interpretativas.
