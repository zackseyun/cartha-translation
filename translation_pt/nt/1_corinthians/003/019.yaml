  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: pt
  text: 'Pois a sabedoria deste mundo é loucura diante de Deus.[a] Porque está escrito: “Ele apanha os sábios na astúcia deles.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “junto de Deus”; isto é, aos olhos de Deus ou segundo o seu julgamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “na esperteza ardilosa deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: É o equivalente português padrão e mantém o contraste de Paulo entre a sabedoria reivindicada pelo mundo e a avaliação de Deus.
- source_word: κόσμου τούτου
  choice: deste mundo
  rationale: κόσμος significa naturalmente “mundo” neste contexto; a expressão aponta para a ordem humana presente em oposição à sabedoria de Deus.
- source_word: μωρία
  choice: loucura
  rationale: Reproduz o vocabulário recorrente de Paulo no contexto e expressa a completa insensatez dessa sabedoria segundo o juízo divino.
- source_word: παρὰ τῷ θεῷ
  choice: diante de Deus
  rationale: 'Torna explícito em português o valor avaliativo de παρά com o dativo: aquilo que é considerado loucura na presença ou no julgamento de Deus.'
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula portuguesa consagrada e natural para introduzir uma citação das Escrituras, preservando a força do perfeito grego.
- source_word: δρασσόμενος
  choice: captura
  rationale: Comunica a ideia de agarrar ou apanhar alguém, com a implicação contextual de fazer os sábios caírem na própria trama.
- source_word: σοφοὺς
  choice: os sábios
  rationale: Designa pessoas consideradas sábias sem acrescentar uma especificação de gênero ausente da intenção contextual.
- source_word: πανουργίᾳ
  choice: astúcia
  rationale: Mantém a conotação negativa de habilidade ardilosa ou inescrupulosa presente no contexto.
theological_decisions:
- issue: Identidade do sujeito na citação de Jó 5:13
  choice: Ele captura os sábios
  alternative: Aquele que captura os sábios
  rationale: O particípio grego substantivado se refere a Deus no contexto. “Ele” produz uma frase natural em português e explicita apenas o referente já estabelecido, sem acrescentar uma nova afirmação teológica.
- issue: Avaliação divina da sabedoria do mundo
  choice: loucura diante de Deus
  alternative: loucura junto de Deus
  rationale: “Diante de Deus” comunica com clareza que a frase expressa a perspectiva ou o julgamento divino, ao mesmo tempo que uma nota preserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém o paralelismo enfático das duas orações introduzidas por γάρ.
