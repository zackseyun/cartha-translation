lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão inferida do argumento anterior de forma clara e natural.
- source_word: μηδεὶς
  choice: ninguém
  rationale: Expressa de modo direto a proibição geral e indefinida.
- source_word: καυχάσθω
  choice: se orgulhe
  rationale: Preserva a ideia de gloriar-se ou vangloriar-se, em linguagem atual e digna.
- source_word: ἐν ἀνθρώποις
  choice: de pessoas
  rationale: Neste uso com καυχάομαι, ἐν indica a base do orgulho; 'pessoas' mantém o sentido genérico de ἀνθρώποις sem restringi-lo a homens nem explicitar líderes.
- source_word: πάντα
  choice: tudo
  rationale: Transmite naturalmente em português a abrangência do neutro plural grego.
- source_word: γὰρ
  choice: pois
  rationale: Apresenta a razão da proibição, conservando a relação lógica do texto.
- source_word: ὑμῶν ἐστιν
  choice: é de vocês
  rationale: Expressa posse de maneira idiomática e amplamente compreensível em português, mantendo a referência plural aos destinatários.
theological_decisions:
- issue: Identidade das pessoas em quem não se deve ter orgulho
  choice: pessoas
  alternative: líderes humanos
  rationale: O contexto envolve líderes como Paulo, Apolo e Cefas, mas o substantivo grego é mais amplo; a tradução preserva essa amplitude sem resolver a referência de modo interpretativo.
