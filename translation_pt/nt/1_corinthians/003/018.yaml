  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: pt
  text: Ninguém se engane. Se alguém entre vocês pensa que é sábio nesta era[a], torne-se insensato[b], para que se torne sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sábio segundo os padrões desta era».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «tolo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Ninguém engane a si mesmo
  rationale: Preserva a proibição, o objeto reflexivo explícito e o sentido direto de enganar, em português claro e digno.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: pensa que é sábio
  rationale: Neste contexto, δοκεῖ expressa a avaliação que a pessoa faz de si mesma; «pensa» comunica isso com naturalidade.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Expressa de modo corrente a pertença ou presença no meio da comunidade coríntia.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: nesta era
  rationale: Mantém a nuance temporal e teológica de αἰών e o contraste entre a sabedoria da era presente e a sabedoria de Deus.
- source_word: μωρὸς γενέσθω
  choice: torne-se insensato
  rationale: Conserva o predicativo adjetival e o paradoxo, sem transformar desnecessariamente a expressão em um rótulo fixo.
- source_word: ἵνα γένηται σοφός
  choice: para que se torne sábio
  rationale: Preserva a oração de finalidade e a repetição de γίνομαι, importante para a formulação paradoxal do versículo.
theological_decisions:
- issue: Sentido de αἰών no contraste paulino
  choice: «era»
  alternative: «mundo» ou «segundo os padrões desta era»
  rationale: «Era» preserva de modo mais direto a dimensão temporal do contraste de Paulo, sem inserir no texto a explicação interpretativa «segundo os padrões».
- issue: Força de μωρός no paradoxo
  choice: «insensato»
  alternative: «tolo» ou «um tolo»
  rationale: «Insensato» preserva a oposição com «sábio» e funciona como predicativo, sem suavizar o paradoxo nem impor a ideia de identidade permanente.
- issue: Referência singular genérica
  choice: Reestruturação com «alguém» e formas verbais na terceira pessoa, sem pronome masculino explícito
  alternative: «ele» ou «a si próprio»
  rationale: O singular representativo do grego é preservado gramaticalmente; a formulação portuguesa inclui qualquer integrante da comunidade sem alterar o alcance do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom exortativo, o contraste entre «sábio» e «insensato» e a repetição de «tornar-se». Todos os marcadores de nota aparecem no texto principal.
