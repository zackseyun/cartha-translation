id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: pt
  text: Se alguém destruir o santuário de Deus[a], Deus o destruirá; pois o santuário de Deus é santo, e vocês são esse santuário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corromper” ou “profanar”, nas duas ocorrências do verbo traduzido como “destruir”.
    reason: lexical_alternative
  - marker: b
    text: “Vocês” está no plural; Paulo identifica coletivamente a comunidade como o santuário de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: santuário
  rationale: “Santuário” distingue o lugar sagrado da construção mais ampla do templo e expressa com precisão a morada santa de Deus; também soa natural em português neste contexto metafórico.
- source_word: φθείρει / φθερεῖ
  choice: destruir / destruirá
  rationale: Mantém a repetição intencional do mesmo verbo grego e a severidade da advertência. O campo semântico também pode incluir corromper ou profanar, registrado em nota.
- source_word: τοῦτον
  choice: o
  rationale: O pronome retoma de modo conciso e natural “alguém”. Em português, a forma não explicita gênero e evita introduzir uma distinção ausente da referência indefinida.
- source_word: ἅγιος
  choice: santo
  rationale: É a correspondência corrente e direta, preservando as ideias de santidade e consagração sem paráfrase.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: e esse santuário são vocês
  rationale: Explicita naturalmente em português o referente da oração relativa e conserva a identificação enfática da comunidade com o único santuário.
- source_word: ὑμεῖς
  choice: vocês
  rationale: Torna inequívoco o plural do grego e, junto do singular “santuário”, comunica a dimensão coletiva da afirmação.
theological_decisions:
- issue: Se o santuário de Deus designa principalmente cada cristão ou a comunidade cristã coletivamente
  choice: A formulação apresenta a comunidade coletivamente como o santuário de Deus.
  alternative: A afirmação pode ser aplicada ao cristão individual com base em outros textos bíblicos.
  rationale: Neste versículo, o singular ναός (“santuário”) é identificado com o plural ὑμεῖς (“vocês”), e o contexto de 1 Coríntios 3 trata da comunidade edificada em conjunto. A tradução preserva essa relação gramatical sem excluir inferências formuladas a partir de outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” explicita o plural; “santuário” preserva a precisão de ναός. O travessão dá clareza à identificação final sem enfraquecer sua ênfase.
