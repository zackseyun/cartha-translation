  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: pt
  text: Assim, nem o que planta é alguma coisa, nem o que rega, mas Deus, que faz crescer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas Deus, que dá o crescimento”; tradicionalmente, “dá o aumento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior.
- source_word: ὁ φυτεύων
  choice: o que planta
  rationale: Preserva o particípio substantivado e mantém o paralelismo da frase em português claro.
- source_word: ἐστίν τι
  choice: é alguma coisa
  rationale: Reproduz de perto o idioma grego sem substituir sua força retórica por uma explicação interpretativa.
- source_word: ὁ ποτίζων
  choice: o que rega
  rationale: Mantém a estrutura paralela a “o que planta” e o sentido verbal do particípio.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca diretamente o contraste entre os trabalhadores humanos e Deus.
- source_word: ὁ αὐξάνων
  choice: que faz crescer
  rationale: Comunica que Deus produz o crescimento, sem acrescentar um objeto não expresso no grego.
- source_word: θεός
  choice: Deus
  rationale: Conserva o referente e sua posição de destaque no contraste final.
theological_decisions:
- issue: Contraste entre a importância dos trabalhadores e a ação divina
  choice: nem o que planta é alguma coisa, nem o que rega, mas Deus
  alternative: nem o que planta nem o que rega têm importância; somente Deus
  rationale: A formulação escolhida preserva a tensão e a expressão contundente do grego, sem transformar o contraste em uma afirmação teológica mais explícita do que o texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima ao grego. A vírgula antes de “que faz crescer” favorece a leitura natural em português e identifica Deus como aquele que produz o crescimento.
