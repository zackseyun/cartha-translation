  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: pt
  text: 'E também: “O Senhor conhece os raciocínios dos sábios e sabe que são inúteis.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação do Salmo 94:11 (93:11 na Septuaginta). “Raciocínios” também pode ser traduzido como “pensamentos”; “inúteis”, como “vazios” ou “fúteis”.
    reason: cross_reference_and_lexical_alternatives
lexical_decisions:
- source_word: καὶ πάλιν
  choice: E também
  rationale: Introduz de modo natural uma segunda citação usada como apoio, preservando o valor aditivo de πάλιν no contexto.
- source_word: Κύριος
  choice: O Senhor
  rationale: Equivalente corrente e digno de κύριος neste contexto de citação das Escrituras.
- source_word: γινώσκει
  choice: conhece
  rationale: Tradução direta de γινώσκω, adequada tanto ao objeto pessoal quanto ao conteúdo intelectual aqui expresso.
- source_word: τοὺς διαλογισμοὺς
  choice: os raciocínios
  rationale: διαλογισμός pode indicar pensamentos ou processos de reflexão; “raciocínios” destaca a atividade intelectual dos que são chamados sábios e combina com o contexto.
- source_word: τῶν σοφῶν
  choice: dos sábios
  rationale: Reproduz naturalmente o adjetivo substantivado e preserva a tensão contextual em torno da sabedoria humana.
- source_word: ὅτι εἰσὶν μάταιοι
  choice: e sabe que são inúteis
  rationale: A repetição elíptica de “sabe” torna explícita em português a oração de conteúdo introduzida por ὅτι, sem mudar seu sentido; “inúteis” comunica a falta de valor ou eficácia de μάταιοι.
