source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: pt
  text: Pois vocês ainda são carnais. Pois, onde há ciúme e discórdia entre vocês, não são carnais e andam de maneira meramente humana?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “segundo o ser humano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ainda
  rationale: Expressa a continuidade da condição repreendida por Paulo, de modo natural em português.
- source_word: γὰρ
  choice: pois / porque
  rationale: Mantém a função explicativa das duas ocorrências, com pequena variação idiomática para evitar rigidez em português.
- source_word: σαρκικοί
  choice: carnais
  rationale: Preserva a ligação explícita com σάρξ, “carne”, sem substituí-la por uma explicação doutrinária como “dominados pela natureza pecaminosa”.
- source_word: ὅπου
  choice: havendo
  rationale: Transmite naturalmente em português a ideia de que a presença de ciúme e discórdia entre eles comprova a condição descrita, sem alterar a relação lógica.
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto negativo de rivalidade comunitária, indica ciúme ou inveja, e não zelo positivo.
- source_word: ἔρις
  choice: discórdia
  rationale: Abrange conflito, rivalidade e contenda sem restringir o sentido apenas a discussões verbais.
- source_word: οὐχὶ
  choice: não são
  rationale: Preserva a pergunta retórica que espera resposta afirmativa.
- source_word: κατὰ ἄνθρωπον
  choice: de maneira meramente humana
  rationale: Comunica em português atual a conduta segundo padrões puramente humanos, mantendo em nota uma forma mais próxima da estrutura grega.
- source_word: περιπατεῖτε
  choice: andam
  rationale: Conserva a metáfora paulina de andar como descrição da maneira de viver.
theological_decisions:
- issue: Linguagem relacionada a σάρξ em σαρκικοί
  choice: carnais
  alternative: mundanos; dominados pela natureza pecaminosa
  rationale: “Carnais” mantém a metáfora da carne e a tensão entre a identidade dos destinatários e sua conduta, sem inserir uma formulação teológica mais específica do que o texto.
- issue: Sentido de κατὰ ἄνθρωπον
  choice: de maneira meramente humana
  alternative: segundo o ser humano; segundo padrões humanos
  rationale: A formulação principal é compreensível e preserva o contraste ético com uma vida moldada pelo Espírito; a nota registra uma tradução estruturalmente mais próxima do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se os termos paulinos “carnais” e “andam”, enquanto a expressão final recebe uma formulação idiomática acompanhada de alternativa literal em nota.
