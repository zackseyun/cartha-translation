lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase do grego e soa natural no contraste com Apolo e Deus.
- source_word: ἐφύτευσα
  choice: plantei
  rationale: Mantém de modo direto e natural a metáfora agrícola de plantar.
- source_word: Ἀπολλῶς
  choice: Apolo
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐπότισεν
  choice: regou
  rationale: É o equivalente português mais natural no contexto agrícola e conserva o paralelismo conciso.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa com clareza o forte contraste entre o trabalho dos ministros e a ação decisiva de Deus.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Identifica Deus como o agente que efetivamente produz o crescimento, sem acrescentar ênfase ausente do texto.
- source_word: ηὔξανεν
  choice: fazia crescer
  rationale: Traduz naturalmente o sentido causativo de αὐξάνω e preserva o aspecto contínuo ou progressivo do imperfeito grego.
theological_decisions:
- issue: A ação divina em relação ao trabalho humano
  choice: Paulo plantou e Apolo regou, mas Deus fazia crescer.
  alternative: Paulo plantou e Apolo regou, mas Deus deu o crescimento.
  rationale: A tradução mantém tanto a realidade do trabalho humano quanto a ação divina decisiva, sem reduzir uma delas nem desenvolver uma formulação doutrinária além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase breve conserva o paralelismo e o contraste do original; “fazia crescer” comunica naturalmente o imperfeito grego.
