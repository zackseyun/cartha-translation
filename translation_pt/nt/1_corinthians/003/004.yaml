  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: pt
  text: 'Pois, quando alguém diz: “Eu sou de Paulo”, e outro: “Eu sou de Apolo”, vocês não estão agindo como simples seres humanos?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “vocês não são seres humanos?”; também pode ser entendido como “vocês não estão agindo como homens?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Em português, “quando” expressa naturalmente a circunstância genérica ou recorrente indicada por ὅταν; “sempre que” seria possível, mas aqui soaria mais pesado.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o argumento anterior de Paulo.
- source_word: λέγῃ τις
  choice: alguém diz
  rationale: Reproduz com naturalidade a construção indefinida singular e seu sentido genérico.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Eu sou de Paulo
  rationale: Preserva a formulação concisa do genitivo de filiação partidária sem explicitar em excesso a natureza da relação.
- source_word: ἕτερος δέ
  choice: e outro
  rationale: Expressa de modo fluente o contraste correlativo μέν...δέ.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Eu sou de Apolo
  rationale: Supre o verbo elíptico conforme a oração anterior e conserva o paralelismo das declarações de lealdade.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: vocês não estão agindo como simples seres humanos?
  rationale: No contexto, a pergunta repreende uma conduta regida por critérios meramente humanos. A formulação comunica essa força pragmática em português, enquanto a tradução lexical mais direta é preservada em nota.
theological_decisions:
- issue: Sentido contextual de ἄνθρωποι na pergunta retórica
  choice: estão agindo como simples seres humanos
  alternative: não são seres humanos?
  rationale: A leitura contextual entende que Paulo censura o comportamento mundano ou meramente humano, não que questione a humanidade dos coríntios. A nota conserva a ambiguidade formal da expressão grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. “Apolo” segue a forma portuguesa tradicional do nome. A construção principal prioriza clareza contextual, e a nota registra a forma mais literal e a alternativa interpretativa.
