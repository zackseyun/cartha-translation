  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: pt
  text: Pois somos cooperadores de Deus[a]; vocês são a lavoura de Deus, o edifício de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cooperadores com Deus”.'
    reason: Leitura alternativa possível para a relação expressa pelo genitivo θεοῦ.
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Mantém a função explicativa da afirmação em relação ao argumento anterior, em português natural e digno.
- source_word: συνεργοί
  choice: cooperadores
  rationale: Expressa de modo conciso pessoas que trabalham em conjunto, preservando a forma nominal plural e sem ampliar indevidamente a metáfora.
- source_word: θεοῦ (com συνεργοί)
  choice: de Deus
  rationale: Reproduz o genitivo grego e, no contexto, pode indicar que os cooperadores pertencem a Deus ou estão a seu serviço, sem eliminar por completo a ambiguidade da construção.
- source_word: γεώργιον
  choice: lavoura
  rationale: Transmite o sentido de terreno cultivado e se encaixa naturalmente na metáfora agrícola desenvolvida no contexto.
- source_word: οἰκοδομή
  choice: edifício
  rationale: É uma tradução clara daquilo que está sendo construído e prepara a metáfora de construção desenvolvida nos versículos seguintes.
- source_word: ἐστε
  choice: vocês são
  rationale: Representa explicitamente a segunda pessoa do plural em linguagem amplamente compreensível.
theological_decisions:
- issue: Se θεοῦ συνεργοί significa “cooperadores de Deus” ou “cooperadores com Deus”
  choice: cooperadores de Deus
  alternative: cooperadores com Deus
  rationale: O genitivo grego admite discussão. No contexto imediato, Paulo enfatiza que os ministros pertencem a Deus e o servem, enquanto a comunidade é propriedade de Deus. A tradução principal conserva essa ênfase, e a nota mantém disponível a leitura segundo a qual eles trabalham juntamente com Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural do grego; “lavoura” conserva a imagem agrícola, e “edifício” introduz naturalmente a metáfora arquitetônica subsequente.
