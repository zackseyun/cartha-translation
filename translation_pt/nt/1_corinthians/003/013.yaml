  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: pt
  text: a obra de cada um se tornará evidente, pois o Dia[a] a revelará, porque ele é revelado em fogo[b]; e o próprio fogo provará qual é a qualidade da obra de cada um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Dia” provavelmente se refere ao futuro dia da avaliação ou do juízo divino.
    reason: cross_reference
  - marker: b
    text: 'Ou: “pelo fogo”. A expressão grega pode ser entendida como “em fogo” ou, em sentido instrumental, “pelo fogo”. Nesse caso, pode-se entender: “pois o Dia a revelará, porque ela é revelada pelo fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τὸ ἔργον
  choice: a obra de cada um
  rationale: Preserva a força distributiva do genitivo singular e mantém amplo o sentido de ἔργον no contexto da obra realizada por cada construtor.
- source_word: φανερὸν γενήσεται
  choice: se tornará evidente
  rationale: Expressa naturalmente em português o resultado futuro indicado pelo adjetivo com o verbo γενήσεται.
- source_word: ἡ ἡμέρα
  choice: o Dia
  rationale: O artigo e o contexto apontam para o dia futuro da avaliação divina; a inicial maiúscula sinaliza esse referente específico sem acrescentar uma explicação ao corpo do texto.
- source_word: δηλώσει
  choice: a revelará
  rationale: O pronome retoma naturalmente 'a obra'; 'revelará' comunica que o Dia tornará manifesta sua verdadeira natureza.
- source_word: ἐν πυρὶ
  choice: em fogo
  rationale: Mantém a forma transparente da preposição grega e preserva a possibilidade de nuance locativa ou instrumental.
- source_word: ἀποκαλύπτεται
  choice: é revelado
  rationale: Conserva o presente passivo do grego. O masculino singular retoma 'o Dia', leitura sintaticamente natural, sem eliminar a ambiguidade interpretativa da construção.
- source_word: ὁποῖόν ἐστιν
  choice: que tipo de obra
  rationale: Comunica a ideia de natureza ou qualidade da obra em linguagem corrente.
- source_word: τὸ πῦρ αὐτὸ δοκιμάσει
  choice: o próprio fogo provará
  rationale: '''O próprio fogo'' preserva a ênfase de αὐτό; ''provará'' expressa aqui testar para determinar a qualidade.'
theological_decisions:
- issue: Referente de ἡ ἡμέρα
  choice: o Dia, com inicial maiúscula
  alternative: o dia, em sentido genérico
  rationale: O contexto de avaliação futura favorece o Dia escatológico, mas a nota evita definir além do necessário se se trata especificamente de juízo ou avaliação.
- issue: Sentido de ἐν πυρί
  choice: em fogo
  alternative: pelo fogo
  rationale: A expressão grega admite leitura locativa ou instrumental; o texto principal conserva a formulação mais transparente e a nota registra a alternativa.
- issue: Sujeito implícito de ἀποκαλύπτεται
  choice: o Dia é revelado em fogo
  alternative: a obra é revelada pelo fogo
  rationale: O sujeito masculino mais próximo é ἡ ἡμέρα, e o predicativo/preposição segue no contexto; contudo, a estrutura pode ser entendida de modo instrumental em relação à manifestação da obra, possibilidade preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada para tornar explícita a retomada de 'a obra', sem resolver silenciosamente a ambiguidade de ἐν πυρί e de ἀποκαλύπτεται.
