  terminology: «Obra», «Dia», «revelará», «em fogo» e «o próprio fogo» são escolhas adequadas. «Qual é a qualidade» explicita em português a força qualitativa de ὁποῖόν ἐστιν sem acrescentar uma ação realizada por cada pessoa.
