  source_fidelity: A primeira oração e a referência ao Dia correspondem bem ao grego. Contudo, a redação final «provará que tipo de obra cada um fez» introduz «fez», que não está expresso, e enfraquece a construção grega, na qual o fogo testa a obra quanto ao tipo/qualidade que ela é. A oração passiva referente ao Dia deve ter um sujeito explícito ou inequivocamente retomado em português.
