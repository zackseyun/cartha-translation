review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a condição, a destruição da obra, a perda sofrida e a salvação da própria pessoa. Contudo, “como que através do fogo” introduz uma atenuação idiomática (“como que”, no sentido de ‘por assim dizer’) que não está marcada no grego e pode enfraquecer a imagem comparativa concisa de ὡς διὰ πυρός.
  naturalness: O texto é moderno e claro. “Como através do fogo” é uma formulação deliberadamente concisa e um pouco elíptica, mas é natural o suficiente no registro bíblico e preserva melhor a força da expressão grega do que “como que através do fogo”.
  terminology: “Obra”, “sofrerá perda” e “será salva” são escolhas adequadas, consistentes com o contexto e teologicamente não tendenciosas. “Consumida pelo fogo” transmite de modo apropriado o valor intensivo de κατακαήσεται.
