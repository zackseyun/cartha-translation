  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: pt
  text: Se a obra de alguém for consumida pelo fogo, essa pessoa sofrerá perda; ela mesma, porém, será salva, mas como através do fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas somente como através do fogo”; ou: “mas como quem escapa através do fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Se ... de alguém
  rationale: Preserva de modo natural a condição simples e o caráter indefinido da pessoa.
- source_word: τὸ ἔργον
  choice: a obra
  rationale: Mantém o termo amplo e sua ligação com a obra construída no contexto imediato.
- source_word: κατακαήσεται
  choice: for consumida pelo fogo
  rationale: Expressa a queima completa ou destrutiva indicada pelo verbo intensivo, sem enfraquecer a metáfora.
- source_word: ζημιωθήσεται
  choice: sofrerá perda
  rationale: Comunica perda ou prejuízo sem especificar indevidamente que se trata de punição ou perda de recompensa.
- source_word: αὐτὸς δὲ
  choice: ela mesma, porém
  rationale: Preserva a ênfase no indivíduo e o contraste entre a destruição da obra e a salvação da pessoa.
- source_word: σωθήσεται
  choice: será salva
  rationale: Verte diretamente o sentido soteriológico usual de σῴζω neste contexto.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: mas como que através do fogo
  rationale: Conserva a imagem breve e a ambiguidade do grego; “como que” assinala a comparação sem explicar em excesso sua natureza.
theological_decisions:
- issue: Se a cláusula final deve ser formulada de modo a favorecer uma leitura doutrinária específica, como purificação pós-morte ou simples escape por pouco.
  choice: mas como que através do fogo
  alternative: mas somente como quem escapa através do fogo
  rationale: A formulação mantém a imagem metafórica sem definir se o fogo representa purificação, juízo, provação ou apenas escape perigoso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “essa pessoa” evita o masculino genérico rígido e permite que “ela mesma” preserve a ênfase de αὐτός. A redação mantém a concisão e a tensão metafórica do original.
