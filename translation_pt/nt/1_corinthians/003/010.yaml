id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: pt
  text: Segundo a graça de Deus que me foi dada, como sábio mestre construtor[a], lancei um alicerce, e outro constrói sobre ele. Mas cada um[b] cuide de como constrói.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arquiteto”; o termo grego designa o construtor principal que supervisiona a obra.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega aqui uma forma masculina singular com sentido representativo: “cada um”.'
    reason: cultural_note
  - marker: c
    text: Ou “de como constrói sobre ele”.
    reason: previous_rendering
lexical_decisions:
- source_word: Κατὰ
  choice: Segundo
  rationale: Expressa conformidade com a graça recebida, de modo natural em português, sem reduzi-la a mero instrumento.
- source_word: χάριν
  choice: graça
  rationale: Preserva o sentido paulino de favor e capacitação concedidos por Deus, bem como seu peso teológico.
- source_word: τὴν δοθεῖσάν μοι
  choice: que me foi dada
  rationale: Identifica claramente a graça como algo concedido a Paulo e mantém a voz passiva do grego.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: como sábio mestre construtor
  rationale: Mantém tanto a comparação introduzida por ὡς quanto a ideia antiga de um construtor principal que dirige a obra; a alternativa lexical “arquiteto” é registrada em nota.
- source_word: θεμέλιον ἔθηκα
  choice: lancei um alicerce
  rationale: “Lançar um alicerce” é uma combinação idiomática em português e corresponde à imagem concreta do grego.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: e outro constrói sobre ele
  rationale: 'Explicita o referente implícito do verbo composto: a construção ocorre sobre o alicerce já lançado.'
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Mas cada um cuide
  rationale: O imperativo βλεπέτω pede atenção vigilante; “cuide” comunica de forma concisa a advertência.
- source_word: πῶς ἐποικοδομεῖ
  choice: de como constrói
  rationale: Repete a imagem da construção sem a formulação pesada “constrói sobre ele”; o alicerce permanece claro pelo contexto imediato.
theological_decisions:
- issue: Masculino singular representativo em ἕκαστος
  choice: cada um ... constrói
  alternative: cada pessoa ... constrói; cada homem ... constrói
  rationale: “Cada um” conserva a forma distributiva singular e o masculino gramatical do grego sem restringir indevidamente a advertência apenas aos homens.
- issue: Natureza da graça dada a Paulo
  choice: Manter simplesmente “graça”, sem explicar no texto se se trata de favor, chamado ou capacitação ministerial
  alternative: favor; capacitação concedida por Deus
  rationale: O termo χάρις comporta essas nuances no contexto, mas o versículo não as separa nem define; a tradução preserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mestre construtor” evita o sentido moderno mais restrito de “arquiteto”; “alicerce” e “constrói” sustentam de maneira natural a metáfora contínua da construção.
