  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: pt
  text: Alimentei vocês com leite[a], não com alimento sólido[b], pois ainda não eram capazes. Mas, mesmo agora, ainda não são capazes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «Dei a vocês leite para beber».'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega significa «alimento» em geral; «sólido» explicita o contraste com o leite.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: leite
  rationale: Equivalente direto que preserva a imagem de nutrição e o contraste estabelecido por Paulo.
- source_word: ἐπότισα
  choice: alimentei
  rationale: Embora o verbo signifique literalmente «dei de beber», «alimentei vocês com leite» expressa a metáfora com naturalidade em português e mantém o contraste com alimento sólido; a forma mais literal consta em nota.
- source_word: βρῶμα
  choice: alimento sólido
  rationale: O substantivo designa alimento em geral, mas, no contraste com leite, refere-se contextualmente a uma nutrição mais substancial. «Alimento sólido» torna esse contraste claro sem restringi-lo a carne.
- source_word: οὔπω
  choice: ainda não
  rationale: Expressa de modo direto e natural a negação temporal.
- source_word: ἐδύνασθε
  choice: eram capazes
  rationale: Mantém o sentido de capacidade do verbo δύναμαι e o tempo passado, sem acrescentar explicitamente um complemento ausente no grego.
- source_word: οὐδὲ ἔτι νῦν
  choice: mesmo agora, continuam sem
  rationale: Reproduz tanto a ênfase no presente («mesmo agora») quanto a persistência da incapacidade («continuam»), em ordem natural no português.
- source_word: δύνασθε
  choice: ser capazes
  rationale: Preserva o sentido de capacidade e o paralelismo com a ocorrência anterior, deixando implícito, como no grego, aquilo de que não eram capazes.
theological_decisions:
- issue: Interpretação da metáfora de nutrição usada por Paulo
  choice: Manter a imagem do leite em contraste com o alimento sólido, sem explicar no corpo do texto a que tipos de ensino ela corresponde.
  alternative: Parafrasear como «ensinei a vocês apenas as verdades básicas, não as mais avançadas».
  rationale: O grego apresenta uma metáfora e não identifica explicitamente níveis específicos de doutrina. Preservá-la evita impor uma interpretação teológica mais estreita do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com uso de «vocês» para o plural. A formulação mantém a metáfora e a elipse do original, enquanto as notas registram a tradução mais literal de ἐπότισα e o sentido geral de βρῶμα.
