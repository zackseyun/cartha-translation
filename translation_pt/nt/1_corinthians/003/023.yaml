  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: pt
  text: e vocês são do Messias[a], e o Messias é de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Cristo” em vez de “Messias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: Pronome de segunda pessoa do plural; “vocês” comunica naturalmente os destinatários plurais em português moderno, sem acrescentar ênfase ausente do texto.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ dá continuidade ao encadeamento e introduz leve contraste; “e” preserva com naturalidade o fluxo conciso do argumento.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Genitivo que expressa posse ou pertencimento. “Do Messias” conserva tanto o título quanto a formulação breve e relacional do grego.
- source_word: Χριστὸς
  choice: o Messias
  rationale: O título é repetido no nominativo, mantendo a simetria retórica entre as duas orações.
- source_word: θεοῦ
  choice: de Deus
  rationale: Genitivo singular que expressa posse ou relação; “de Deus” reproduz diretamente a construção paralela e evita explicar além do texto.
theological_decisions:
- issue: Como traduzir os dois genitivos de pertencimento sem atenuar a relação expressa por Paulo.
  choice: “vocês são do Messias, e o Messias é de Deus”
  alternative: “vocês pertencem ao Messias, e o Messias pertence a Deus”
  rationale: A formulação escolhida mantém a concisão, o paralelismo e a tensão teológica do grego. A alternativa explicita o pertencimento, mas interpreta mais diretamente a relação e reduz a ambiguidade genuína da construção genitiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “ser de” é natural em português e preserva de modo econômico o paralelismo dos genitivos gregos.
