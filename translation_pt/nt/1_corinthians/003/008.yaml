    rationale: Embora possa verter δέ, soa discursivo e algo arcaizante em português contemporâneo, sem ser necessário para o sentido.
  - severity: low
    issue: “são um”
    rationale: É uma tradução formalmente possível, mas “são um só” é mais idiomático em português e deixa mais clara a noção de unidade, não de identidade entre pessoas.
  - severity: low
    issue: “mas” para o segundo δέ
    rationale: O conectivo pode indicar uma transição para a responsabilidade individual, mas “e” mantém melhor a coordenação discreta do grego e evita reforçar um contraste que o texto não explicita.
  revised_text: Quem planta e quem rega são um só[a], e cada um receberá a sua própria recompensa de acordo com o seu próprio trabalho.
