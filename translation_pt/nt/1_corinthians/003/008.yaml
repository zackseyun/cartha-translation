source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: pt
  text: Quem planta e quem rega são um só[a], e cada um receberá a sua própria recompensa de acordo com o seu próprio trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estão unidos” ou “têm um só propósito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: o que planta
  rationale: O particípio presente com artigo funciona como substantivo; a expressão é natural em português e preserva a metáfora agrícola.
- source_word: ποτίζων
  choice: o que rega
  rationale: Assim como φυτεύων, o particípio articulado designa o trabalhador e mantém de modo claro a imagem agrícola.
- source_word: ἕν
  choice: são um
  rationale: O neutro singular expressa unidade, não identidade pessoal. A formulação compacta preserva a tensão do grego, e a nota apresenta equivalentes interpretativos.
- source_word: μισθὸν
  choice: recompensa
  rationale: No contexto do serviço ministerial, indica a retribuição recebida sem restringir o sentido a salário monetário.
- source_word: λήμψεται
  choice: receberá
  rationale: O futuro é expresso de modo direto, natural e digno em português.
- source_word: κατὰ
  choice: de acordo com
  rationale: Preserva a relação normativa ou proporcional entre a recompensa e o trabalho de cada pessoa.
- source_word: κόπον
  choice: trabalho
  rationale: É linguagem corrente e compreensível, embora o termo grego também possa salientar esforço e fadiga.
- source_word: ἴδιον
  choice: sua própria / seu próprio
  rationale: A repetição de ἴδιον é preservada para destacar tanto a recompensa individual quanto o trabalho individual.
- source_word: δὲ
  choice: Ora / mas
  rationale: A primeira ocorrência introduz um contraste ou desenvolvimento no argumento; a segunda contrasta a unidade dos trabalhadores com a avaliação individual de cada um.
theological_decisions:
- issue: Sentido de ἕν εἰσιν (“são um”)
  choice: Manter “são um” no texto, indicando unidade entre os trabalhadores sem confundir suas pessoas ou funções.
  alternative: “estão unidos” ou “têm um só propósito”
  rationale: O neutro ἕν aponta para unidade, e o contexto combate o partidarismo ao apresentar os diferentes servos como participantes de uma obra coordenada sob Deus. A tradução principal evita definir em excesso a natureza exata dessa unidade.
- issue: Relação entre recompensa e trabalho
  choice: “de acordo com o seu próprio trabalho”
  alternative: “proporcionalmente ao seu próprio esforço”
  rationale: κατά estabelece correspondência entre a recompensa e o trabalho, mas o versículo não especifica aqui um cálculo estritamente quantitativo; por isso, a redação preserva a formulação ampla do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção paralela conserva a metáfora agrícola e a repetição enfática de “próprio”. O marcador [a] aparece imediatamente após a expressão anotada.
