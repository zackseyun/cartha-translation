  source_fidelity: 'O sentido central é bem preservado: os dois trabalhadores agrícolas estão em unidade, mas cada um receberá individualmente a recompensa correspondente ao seu trabalho. “Recompensa”, “receberá” e a repetição de “próprio” representam adequadamente μισθός, λήμψεται e ἴδιος.'
  naturalness: “Ora” é desnecessariamente marcado e pouco natural neste contexto em português moderno. Além disso, “são um só” comunica com mais idiomaticidade a unidade expressa pelo neutro singular ἕν, sem sugerir identidade pessoal.
  terminology: A terminologia agrícola e a linguagem de retribuição são claras e adequadas. “Trabalho” é aceitável para κόπος, embora o termo possa também evocar esforço penoso; não é necessária nota para isso neste versículo.
