source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: pt
  text: Nós somos tolos por causa do Messias[a], mas vocês são sábios no Messias[b]; nós somos fracos, mas vocês são fortes; vocês são honrados[c], mas nós somos desonrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa de Cristo” ou “por amor a Cristo”. A expressão grega pode indicar causa, motivo ou finalidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “em Cristo”. O grego traz a frequente expressão paulina ἐν Χριστῷ.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “honrados” e “desonrados” provavelmente dizem respeito à posição pública e à honra ou vergonha aos olhos dos outros, não apenas a sentimentos interiores.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: tolos
  rationale: Preserva a força aguda e irônica do predicativo grego e forma um contraste direto com “sábios”.
- source_word: διὰ Χριστόν
  choice: por causa do Messias
  rationale: διά com acusativo pode indicar causa ou motivo; esta formulação é natural em português e preserva o vínculo explícito com o Messias sem excluir totalmente uma nuance de dedicação.
- source_word: φρόνιμοι
  choice: sábios
  rationale: É o equivalente mais direto no contraste retórico com “tolos”.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém a expressão paulina com ἐν e traduz Χριστός como título, sem dissolver sua densidade teológica.
- source_word: ἀσθενεῖς
  choice: fracos
  rationale: Termo amplo que preserva o paralelismo e não restringe a fraqueza ao âmbito físico ou social.
- source_word: ἰσχυροί
  choice: fortes
  rationale: Antônimo direto de “fracos”, adequado ao paralelismo do texto.
- source_word: ἔνδοξοι
  choice: honrados
  rationale: No contraste social do contexto, comunica estima e posição pública melhor que “gloriosos”.
- source_word: ἄτιμοι
  choice: desonrados
  rationale: Preserva a oposição formal e social a “honrados”, sem intensificá-la indevidamente como “desprezados”.
- source_word: δὲ
  choice: mas
  rationale: Expressa claramente o contraste repetido entre “nós” e “vocês”.
- source_word: ἡμεῖς / ὑμεῖς
  choice: nós / vocês
  rationale: Os pronomes explícitos são enfáticos no grego e essenciais à ironia da contraposição. “Vocês” oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias em διὰ Χριστόν e ἐν Χριστῷ
  alternative: Cristo
  rationale: Aqui o termo conserva força titular; “Messias” explicita essa dimensão e é aplicado coerentemente nas duas ocorrências.
- issue: Valor de διὰ Χριστόν
  choice: por causa do Messias
  alternative: pelo Messias / por amor ao Messias
  rationale: A construção pode exprimir causa ou propósito. O texto principal adota a leitura causal mais imediata, enquanto a nota preserva a amplitude sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. Mantém o paralelismo enfático e a ironia mordaz do grego por meio da repetição de “nós” e “vocês”; o ponto e vírgula organiza a tríade sem suavizar os contrastes.
