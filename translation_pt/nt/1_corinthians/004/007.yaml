  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: pt
  text: Pois quem faz você diferente?[a] E o que você tem que você não recebeu? E, se de fato você recebeu, por que se vangloria como se não tivesse recebido?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois quem distingue você?” O verbo grego pode significar “distinguir”, “diferenciar” ou “tornar distinto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Pois quem faz você diferente dos outros?
  rationale: “Pois” representa γάρ como fundamento da repreensão anterior. O verbo διακρίνω é transitivo e, neste contexto, questiona quem ou o que tornaria o interlocutor distinto ou superior; “dos outros” explicita a comparação já implícita no verbo e produz uma pergunta natural em português.
- source_word: τί δὲ ἔχεις
  choice: E o que você tem
  rationale: δὲ funciona aqui como conexão leve entre perguntas retóricas; “E” preserva a progressão sem introduzir um contraste mais forte do que o grego exige.
- source_word: ὃ οὐκ ἔλαβες
  choice: que não tenha recebido
  rationale: A construção portuguesa com “tenha recebido” é idiomática depois da pergunta de sentido geral e mantém a ideia de que aquilo que se possui foi recebido, não produzido por si mesmo.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: E, se de fato recebeu
  rationale: “De fato” comunica o valor enfático de καί junto de εἰ. O objeto permanece implícito, como no grego, mas é facilmente recuperado da pergunta anterior.
- source_word: τί καυχᾶσαι
  choice: por que se orgulha
  rationale: “Orgulhar-se” expressa de modo corrente e digno o sentido de καυχάομαι neste contexto de vanglória e mantém a força da repreensão retórica.
- source_word: ὡς μὴ λαβών
  choice: como se não tivesse recebido
  rationale: 'A oração com “como se” e o mais-que-perfeito composto transmite a maneira contrária aos fatos sugerida pelo particípio: a pessoa se orgulha como se não fosse receptora.'
theological_decisions:
- issue: Alcance da repreensão de Paulo sobre distinção, posses e dádivas
  choice: Manter a formulação abrangente, segundo a qual qualquer distinção ou coisa possuída foi recebida, sem restringi-la explicitamente aos dons espirituais.
  alternative: Limitar a afirmação aos dons espirituais ou às funções ministeriais; ou ampliá-la expressamente a toda capacidade, posição e bênção.
  rationale: O contexto imediato envolve ministério apostólico, partidarismo e vanglória, mas as perguntas de Paulo são formuladas de maneira geral. A tradução conserva essa amplitude e a tensão contextual sem impor uma delimitação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “você” para o singular de σε, evitando tanto arcaísmo quanto regionalismo marcado. As perguntas retóricas e a repetição de “receber” foram preservadas.
