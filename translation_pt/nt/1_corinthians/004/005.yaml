id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: pt
  text: Portanto, não julguem coisa alguma antes do tempo[a], até que venha o Senhor, o qual também trará à luz as coisas ocultas das trevas e revelará os propósitos dos corações[b][c]. Então, cada um receberá de Deus o louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antes do momento oportuno” ou “prematuramente”; a expressão grega pode indicar uma ação realizada antes do tempo próprio.
    reason: lexical_alternative
  - marker: b
    text: Ou “as intenções dos corações” ou “os motivos dos corações”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, na avaliação final feita pelo Senhor quando ele vier e revelar o que está oculto.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão inferida do argumento anterior e preserva claramente a conexão lógica.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: não julguem coisa alguma antes do tempo
  rationale: Mantém o alcance amplo de τι e traduz πρὸ καιροῦ sem acrescentar explicitamente a ideia de um tempo previamente designado, embora o contexto a possa sugerir.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: até que venha o Senhor
  rationale: Expressa o limite temporal da proibição e conserva κύριος como título, sem explicitar no corpo do texto a identidade que o contexto paulino permite reconhecer.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: trará à luz as coisas ocultas das trevas
  rationale: Emprega uma expressão portuguesa natural para a revelação metafórica e preserva a formulação incomum 'das trevas'.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: revelará os propósitos dos corações
  rationale: βουλαί pode significar propósitos, intenções ou desígnios; 'propósitos' mantém essa amplitude sem reduzir o termo apenas a motivos psicológicos. O plural 'corações' conserva o idioma grego para a interioridade humana.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: cada um receberá de Deus o seu louvor
  rationale: Comunica naturalmente que o louvor destinado a cada pessoa procederá de Deus, preservando tanto a distribuição individual quanto a origem divina.
theological_decisions:
- issue: Alcance e momento do julgamento
  choice: A proibição recai sobre o julgamento humano feito antes do tempo, à espera da vinda e da revelação do Senhor.
  alternative: Entender a frase como proibição absoluta de toda forma de discernimento ou restringi-la exclusivamente à avaliação dos apóstolos.
  rationale: A própria oração temporal limita a ordem pela vinda do Senhor. A tradução mantém amplo o objeto de 'julgar', sem transformar o versículo numa afirmação sobre toda forma possível de discernimento.
- issue: Identidade de “o Senhor”
  choice: Conservar o título “o Senhor”, que no contexto paulino aponta naturalmente para Jesus em sua vinda futura como juiz.
  alternative: Expandir o texto para “o Senhor Jesus” ou entender a expressão apenas como referência geral a Deus.
  rationale: O grego traz somente ὁ κύριος. Manter o título preserva a formulação textual e sua força cristológica sem inserir uma explicitação ausente do versículo.
- issue: Sentido do louvor final
  choice: O louvor de cada pessoa procede de Deus após a revelação do que está oculto.
  alternative: Parafrasear como recompensa, absolvição ou aprovação merecida por todos.
  rationale: ἔπαινος significa louvor ou aprovação, mas o texto não emprega aqui a linguagem específica de recompensa nem explica de que modo isso se aplica a cada pessoa. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “não julguem” para dirigir a exortação à comunidade e evita tanto arcaísmos quanto explicações doutrinárias inseridas no corpo do versículo.
