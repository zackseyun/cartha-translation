id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: pt
  text: Pois não tenho consciência de nada contra mim mesmo[a]; contudo, nem por isso sou justificado[b]. Quem me examina é o Senhor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não sei de nada contra mim mesmo” ou “não estou consciente de nada em mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sou absolvido” ou “sou declarado justo”. O grego emprega um termo forense que Paulo também usa para “justificar”.
    reason: lexical_alternative
  - marker: c
    text: Ou “Quem me julga”. O verbo grego pode significar examinar, investigar ou avaliar em um contexto judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Pois não tenho consciência de nada contra mim mesmo
  rationale: A construção σύνοιδα com o dativo reflexivo expressa consciência pessoal, aqui com possível nuance moral ou forense. A formulação é natural em português e preserva a ideia de não conhecer acusação contra si, sem afirmar ausência objetiva de culpa.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: contudo, nem por isso
  rationale: A expressão portuguesa comunica de modo idiomático que a consciência limpa de Paulo não constitui a base do veredito, preservando o contraste introduzido por ἀλλά.
- source_word: δεδικαίωμαι
  choice: sou justificado
  rationale: O perfeito passivo de δικαιόω possui peso forense. “Sou justificado” conserva o vocabulário paulino e a tensão teológica, enquanto a nota registra alternativas contextuais como “absolvido” e “declarado justo”.
- source_word: ὁ ... ἀνακρίνων με
  choice: Quem me examina
  rationale: ἀνακρίνω pode indicar examinar, investigar ou avaliar, especialmente em contexto judicial. “Examina” mantém a ideia de escrutínio sem antecipar indevidamente um veredito final.
- source_word: κύριός
  choice: o Senhor
  rationale: Traduz diretamente o substantivo definido sem explicitar “Jesus”, identificação que o versículo não formula.
theological_decisions:
- issue: Nuance forense de δεδικαίωμαι em relação à autoavaliação de Paulo
  choice: sou justificado
  alternative: sou absolvido; sou declarado justo
  rationale: A tradução preserva o termo teologicamente significativo de Paulo, mas o contexto imediato é o exame e o veredito sobre seu serviço. Não se amplia a frase para resolver sua relação com formulações sistemáticas da justificação.
- issue: Alcance da consciência limpa de Paulo
  choice: não tenho consciência de nada contra mim mesmo
  alternative: não sei de nada contra mim mesmo; não estou consciente de nada em mim
  rationale: A frase relata a percepção de Paulo, não uma declaração de impecabilidade. O contraste seguinte mantém claro que sua autoavaliação não determina o veredito.
- issue: Identidade de κύριος
  choice: o Senhor
  alternative: o Senhor Jesus
  rationale: Embora o contexto paulino possa apontar para Cristo, a tradução não acrescenta uma identificação ausente do texto grego deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Nem por isso” evita o calque “não nisto” e comunica com clareza a relação lógica. A ordem final foi levemente naturalizada, sem perder a ênfase de que o Senhor é o examinador.
