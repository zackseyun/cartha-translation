source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: pt
  text: 'Irmãos[a], apliquei essas coisas a mim e a Apolo em favor de vocês, para que aprendam, por nosso exemplo, isto: “Não ultrapassem o que está escrito”[b], a fim de que nenhum de vocês se encha de orgulho a favor de um e contra o outro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “irmãos” também pode dirigir-se a um grupo formado por homens e mulheres.
    reason: cultural_note
  - marker: b
    text: 'O grego é elíptico; literalmente, algo como: “o ‘não além do que está escrito’”. A expressão talvez fosse uma máxima ou um lema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: essas coisas
  rationale: O demonstrativo plural retoma a discussão anterior; “essas coisas” preserva essa referência ampla e é natural em português.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Mantém a forma masculina do vocativo grego; uma nota esclarece que o termo pode abranger toda a comunidade, incluindo homens e mulheres.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: apliquei essas coisas a mim e a Apolo
  rationale: Expressa a transferência retórica da discussão anterior para Paulo e Apolo sem tornar explícita uma interpretação além do contexto.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: Comunica que a aplicação foi feita tendo os coríntios em vista; preserva a amplitude da construção, que pode envolver motivo e benefício.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: para que aprendam, por nosso exemplo
  rationale: A construção grega é comprimida; “por nosso exemplo” comunica naturalmente que Paulo e Apolo são o meio ou modelo pelo qual a lição deve ser aprendida.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'isto: “Não ultrapassem o que está escrito”'
  rationale: O artigo introduz o conteúdo da lição. A formulação portuguesa fornece a força exortativa implícita na expressão elíptica, enquanto a nota registra sua forma literal e possível caráter proverbial.
- source_word: φυσιοῦσθε
  choice: se encha de orgulho
  rationale: Transmite em português corrente a imagem de alguém inflado pela arrogância, recorrente em 1 Coríntios.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: a favor de um e contra o outro
  rationale: Preserva o contraste partidário e a oposição entre pessoas ou líderes no contexto das facções coríntias.
theological_decisions:
- issue: Sentido da expressão elíptica τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Apresentá-la como exortação: “Não ultrapassem o que está escrito”.'
  alternative: 'Traduzir mais literalmente: “O ‘não além do que está escrito’”, ou tratá-la como máxima: “Nada além do que está escrito”.'
  rationale: No contexto, a expressão funciona como a lição que os coríntios devem aprender. A tradução exortativa é inteligível sem definir de modo denominacional quais escritos ou limites específicos Paulo tinha em vista; a nota conserva a elipse e a possível natureza de máxima.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O tratamento “vocês” evita regionalismos marcados; “Apolo” segue a forma portuguesa tradicional do nome. A sintaxe foi levemente explicitada em “por nosso exemplo”, sem eliminar a ambiguidade registrada na análise lexical.
