id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: pt
  text: Pois, mesmo que vocês tenham inúmeros[a] tutores[b] no Messias[c], não têm muitos pais. Pois foi no Messias Jesus que, por meio do evangelho, eu gerei vocês[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez mil”; o termo grego é frequentemente usado para indicar uma quantidade muito grande.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “guardiões” ou “supervisores”. No mundo greco-romano, o termo designava quem acompanhava, supervisionava e disciplinava uma criança, não principalmente um professor.
    reason: cultural_note
  - marker: c
    text: Tradicionalmente, “em Cristo”. Aqui, o título grego Χριστός é traduzido como “Messias”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “eu gerei vocês”. A expressão é metafórica e se refere ao papel de Paulo na chegada dos coríntios à fé por meio do evangelho.
    reason: cultural_note
lexical_decisions:
- source_word: μυρίους
  choice: inúmeros
  rationale: Embora possa significar literalmente “dez mil”, aqui o termo tem força idiomática e retórica, indicando uma quantidade extremamente grande em contraste com “não muitos pais”.
- source_word: παιδαγωγοὺς
  choice: tutores
  rationale: No contexto greco-romano, o παιδαγωγός era responsável por acompanhar, supervisionar e disciplinar uma criança, não sendo principalmente um professor de sala de aula. “Tutores” é natural em português, com a função histórica esclarecida em nota.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός conserva seu valor de título. “No Messias” mantém tanto esse valor quanto a expressão paulina de esfera ou união, sem explicá-la além do texto.
- source_word: πατέρας
  choice: pais
  rationale: Preserva diretamente a metáfora paterna e o contraste entre muitos tutores e poucos pais, sem acrescentar no texto principal o qualificativo interpretativo “espirituais”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém o título Χριστός traduzido como “Messias” e conserva de perto a construção grega, ainda compreensível em português.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: por meio do evangelho
  rationale: διά com genitivo indica meio ou instrumento; a formulação deixa claro que o evangelho foi o meio pelo qual ocorreu a geração metafórica.
- source_word: ἐγέννησα
  choice: eu gerei vocês
  rationale: A tradução preserva a imagem forte e explícita de gerar, que fundamenta a referência de Paulo à paternidade, sem substituí-la por uma explicação interpretativa.
theological_decisions:
- issue: A metáfora da paternidade de Paulo
  choice: “eu gerei vocês”
  alternative: “tornei-me pai de vocês” ou “tornei-me o pai espiritual de vocês”
  rationale: A formulação mantém a metáfora de γεννάω e a relaciona ao evangelho, sem atribuir ao texto implicações sacramentais, clericais ou institucionais que ele não explicita.
- issue: O sentido de ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: Preservar “no Messias” sem paráfrase explicativa
  alternative: Explicitar como “em união com o Messias” ou reduzir a expressão a uma referência genérica à fé cristã
  rationale: A preposição pode evocar esfera, relação ou união. A tradução conserva essa densidade e ambiguidade paulina em vez de selecionar silenciosamente uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes e formas verbais de alta legibilidade brasileira. “Inúmeros” transmite a força retórica sem arcaísmo; “tutores” é fluente no texto principal, enquanto a nota recupera o contexto social antigo. A formulação deliberadamente preserva as metáforas de paternidade e geração.
