source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: pt
  text: Quando somos difamados[a], rogamos; tornamo-nos como o lixo do mundo, a escória de todos[b], até agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando somos caluniados”. O verbo grego descreve fala ofensiva ou difamatória dirigida contra alguém.
    reason: lexical_alternative
  - marker: b
    text: Os dois termos traduzidos por “lixo” e “escória” são raros e muito fortes. Podem designar aquilo que é varrido, raspado ou removido durante uma limpeza, ressaltando o extremo desprezo social. “De todos” pode também abranger “de todas as coisas”.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Quando somos difamados
  rationale: O particípio passivo descreve fala hostil ou prejudicial contra os apóstolos. A construção temporal é natural em português e mantém sua função adverbial.
- source_word: παρακαλοῦμεν
  choice: fazemos um apelo
  rationale: O verbo possui uma faixa semântica ampla, incluindo apelar, exortar, encorajar e rogar. Neste contraste, indica uma resposta verbal conciliatória em vez de retaliação; a formulação evita acrescentar um advérbio não expresso no grego.
- source_word: ὡς
  choice: como
  rationale: Introduz uma comparação, preservando o caráter figurado da descrição.
- source_word: περικαθάρματα
  choice: lixo
  rationale: Designa aquilo que é removido numa limpeza e, figuradamente, algo considerado desprezível. “Lixo” é atual, claro e forte.
- source_word: τοῦ κόσμου
  choice: do mundo
  rationale: Reproduz naturalmente o genitivo de relação.
- source_word: ἐγενήθημεν
  choice: tornamo-nos
  rationale: Expressa a entrada numa condição que continua até o momento da escrita, conforme esclarecido por ἕως ἄρτι.
- source_word: πάντων
  choice: de todos
  rationale: Preserva a amplitude e a ambiguidade formal do genitivo plural, sem restringi-lo explicitamente a pessoas ou coisas.
- source_word: περίψημα
  choice: escória
  rationale: Termo raro para resíduo removido ou matéria desprezível. “Escória” mantém a intensidade retórica e forma um par natural com “lixo”.
- source_word: ἕως ἄρτι
  choice: até agora
  rationale: Expressão temporal corrente que indica a continuidade da situação até o presente da escrita.
theological_decisions:
- issue: Sentido dos termos emparelhados περικαθάρματα e περίψημα
  choice: Empregar linguagem vívida de degradação social — “lixo” e “escória” — sem introduzir no texto principal uma interpretação sacrificial.
  alternative: Traduzir como “imundície” e “restos” ou explicitar uma possível alusão a vítimas expiatórias.
  rationale: O contexto imediato enfatiza a humilhação e o desprezo sofridos pelos apóstolos. Possíveis associações rituais ou expiatórias são incertas e não devem ser transformadas em afirmação teológica explícita.
- issue: Força de παρακαλοῦμεν como resposta à difamação
  choice: “fazemos um apelo”, mantendo a natureza da resposta sem qualificá-la explicitamente como gentil.
  alternative: “rogamos”, “exortamos” ou “respondemos com bondade”.
  rationale: O verbo admite vários sentidos relacionados. O contexto favorece uma resposta conciliatória, mas o grego não contém um advérbio equivalente a “gentilmente”; a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Fazemos um apelo” preserva melhor a amplitude de παρακαλοῦμεν do que uma paráfrase que acrescente mansidão não expressa. “Lixo” e “escória” mantêm a aspereza deliberada das imagens gregas.
