id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: pt
  text: Por essa razão, enviei Timóteo a vocês. Ele é meu filho[a] amado e fiel no Senhor e lhes recordará os meus caminhos no Messias Jesus[b], assim como ensino em toda parte, em cada igreja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego τέκνον designa literalmente «filho» ou «criança»; por referir-se a Timóteo, «filho» é uma tradução contextual natural.
    reason: lexical_alternative
  - marker: b
    text: Ou «em Cristo Jesus». O título grego Χριστός é traduzido aqui por «Messias» para explicitar seu significado.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Expressa naturalmente a relação causal com o argumento anterior.
- source_word: ἔπεμψα ὑμῖν Τιμόθεον
  choice: enviei Timóteo a vocês
  rationale: O aoristo é vertido pelo pretérito perfeito simples; «a vocês» é claro e amplamente compreensível em português moderno.
- source_word: τέκνον
  choice: filho
  rationale: Embora o termo grego signifique literalmente «criança» ou «filho» sem especificar o sexo, «filho» é natural para a relação espiritual de Paulo com Timóteo, que é homem; a nota preserva a extensão lexical.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: amado e fiel
  rationale: Mantém tanto o afeto de Paulo quanto a ideia de lealdade e confiabilidade de Timóteo.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a expressão paulina que situa a relação e o serviço de Timóteo na esfera do Senhor.
- source_word: ἀναμνήσει
  choice: fará vocês se lembrarem
  rationale: Equivalente idiomático do futuro ativo, indicando a tarefa que Timóteo cumprirá.
- source_word: τὰς ὁδούς μου
  choice: dos meus caminhos
  rationale: Conserva a metáfora abrangente para o modo de viver, ensinar e servir de Paulo, sem reduzi-la apenas à conduta ou às viagens.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: A expressão qualifica os caminhos de Paulo como definidos por sua relação e serviço no Messias Jesus; Χριστός é traduzido segundo seu valor titular.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: assim como ensino em toda parte, em cada igreja
  rationale: Mantém a correspondência e a dupla ênfase do grego na extensão geográfica e em cada comunidade.
theological_decisions:
- issue: Tradução de Χριστός em ἐν Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός conserva força titular; «Messias» comunica o sentido do título, enquanto a alternativa tradicional é registrada em nota.
- issue: Sentido de «meus caminhos»
  choice: Preservar a metáfora para os padrões de vida, ensino e ministério de Paulo no Messias
  alternative: meu modo de viver; minha conduta
  rationale: O contexto aponta para práticas apostólicas que Timóteo recordará e que Paulo ensina em todas as igrejas; a formulação não limita indevidamente o alcance da metáfora.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A oração relativa grega foi dividida em uma nova frase para evitar ambiguidade sobre o antecedente de «ele», sem alterar as relações semânticas. As expressões paulinas «no Senhor» e «meus caminhos» foram preservadas.
