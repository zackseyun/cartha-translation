revisions:
- from: Mas irei visitá-los em breve, se o Senhor quiser, e então saberei não o que dizem os que estão cheios de orgulho[a], mas o poder que têm.
  to: Mas em breve irei até vocês, se o Senhor quiser, e descobrirei não a fala dos que estão cheios de orgulho[a], mas o poder.
  rationale: A revisão remove explicitações interpretativas em «visitar» e «que têm», conserva a referência aberta de «o Senhor» e formula a oposição λόγος/δύναμις como «fala/poder». A nota permanece adequadamente ancorada na expressão que traduz πεφυσιωμένων e explica sua metáfora recorrente sem impor uma interpretação doutrinária.
