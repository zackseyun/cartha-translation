source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: pt
  text: Mas em breve irei até vocês, se o Senhor quiser, e descobrirei não a fala dos que estão cheios de orgulho[a], mas o poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega descreve pessoas “inchadas” ou “infladas” de orgulho, imagem que Paulo emprega repetidamente nesta carta.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Mas irei visitá-los em breve
  rationale: 'O futuro de ἔρχομαι indica a ida de Paulo até os coríntios; em português, “irei visitá-los” expressa naturalmente o movimento e o encontro pessoal. δέ conserva o contraste com o contexto anterior por meio de “Mas”, e ταχέως indica proximidade temporal: “em breve”.'
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: se o Senhor quiser
  rationale: Forma corrente e fiel em português para a condição dependente da vontade do Senhor, sem identificar além do que o grego explicita.
- source_word: γνώσομαι
  choice: então saberei
  rationale: O verbo significa literalmente “saberei/conhecerei”; no contexto, indica que Paulo verificará pessoalmente a realidade. “Então” torna natural em português a relação com a visita sem acrescentar uma conclusão doutrinária.
- source_word: οὐ τὸν λόγον
  choice: não o que dizem
  rationale: λόγος pode designar palavra, fala ou discurso. “O que dizem” comunica de modo claro a fala alegada pelos adversários e mantém o contraste com δύναμις.
- source_word: τῶν πεφυσιωμένων
  choice: dos que estão cheios de orgulho
  rationale: O particípio perfeito passivo descreve um estado persistente de presunção. A formulação transmite a metáfora de pessoas interiormente infladas, sem recorrer a uma expressão pouco natural.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: mas o poder que têm
  rationale: δύναμις é mantido como “poder”. A construção portuguesa explicita apenas a relação sintática implícita com as mesmas pessoas, sem definir em que consiste esse poder.
theological_decisions:
- issue: Referência de ὁ κύριος
  choice: o Senhor
  alternative: o Senhor Jesus; Deus
  rationale: O texto grego não especifica mais. A tradução preserva a formulação e evita resolver a referência de modo mais estreito.
- issue: Natureza do contraste entre λόγος e δύναμις
  choice: o que dizem ... o poder que têm
  alternative: discurso versus poder milagroso; retórica versus autoridade apostólica
  rationale: A tradução conserva o contraste amplo entre fala e poder sem decidir se esse poder é eficácia espiritual, autoridade apostólica, ação milagrosa ou outra manifestação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Irei visitá-los” evita a possível estranheza regional de “irei ter com vocês”; “cheios de orgulho” comunica com naturalidade a imagem de presunção. O marcador [a] aparece no texto principal.
