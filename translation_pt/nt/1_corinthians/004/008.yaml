id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: pt
  text: Vocês já estão fartos![a] Já ficaram ricos! Sem nós, já estão reinando! Quem dera que de fato reinassem, para que também nós reinássemos com vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já estão plenamente satisfeitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Paulo fala ironicamente: os coríntios agem como se já estivessem plenamente satisfeitos, ricos e reinando.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Preserva a ênfase temporal repetida e o crescente tom irônico das primeiras afirmações.
- source_word: κεκορεσμένοι ἐστέ
  choice: estão fartos
  rationale: A construção perifrástica no perfeito descreve um estado presente de plena saciedade; “estão fartos” é natural e mantém a imagem, sem explicá-la.
- source_word: ἐπλουτήσατε
  choice: ficaram ricos
  rationale: Conserva o caráter verbal do aoristo e comunica a aquisição de riqueza alegada ironicamente.
- source_word: χωρὶς ἡμῶν
  choice: sem nós
  rationale: Tradução direta e natural que ressalta a pretensa independência dos coríntios em relação aos apóstolos.
- source_word: ἐβασιλεύσατε
  choice: já estão reinando / reinassem
  rationale: Mantém a imagem explícita de exercer realeza. Na primeira ocorrência, a forma progressiva expressa naturalmente em português o estado presente resultante alegado; na oração de desejo, o imperfeito do subjuntivo marca uma situação desejada, mas não realizada.
- source_word: ὄφελόν γε
  choice: Quem dera que de fato
  rationale: Expressa de modo idiomático o desejo enfático, preservando tanto a força de ὄφελον quanto a ênfase de γε.
- source_word: ἵνα
  choice: para que
  rationale: Introduz com clareza a finalidade ou consequência pretendida do desejo.
- source_word: συμβασιλεύσωμεν
  choice: também nós reinássemos com vocês
  rationale: Preserva tanto a ideia de reinado quanto o sentido associativo do prefixo συν-.
theological_decisions:
- issue: Tom das três primeiras afirmações
  choice: Apresentá-las como exclamações irônicas, sem inserir uma explicação no corpo do versículo.
  alternative: Lê-las como elogios ou descrições literais.
  rationale: O contraste com a condição dos apóstolos em 4.9–13 indica ironia, mas a formulação mantém a tensão retórica em vez de substituí-la por paráfrase.
- issue: Sentido da linguagem de realeza
  choice: Manter “reinar” nas duas ocorrências.
  alternative: Generalizar como “ter poder”, “vencer” ou “estar por cima”.
  rationale: βασιλεύω e συμβασιλεύω contêm uma imagem régia explícita, possivelmente com ressonância escatológica, que não deve ser neutralizada.
- issue: Relação entre ironia e desejo genuíno
  choice: Traduzir ὄφελόν γε como um desejo enfático real dentro do contexto irônico.
  alternative: Tratar toda a oração apenas como sarcasmo.
  rationale: A expressão pode combinar a repreensão irônica com o desejo genuíno de que o reinado fosse realidade e pudesse ser compartilhado pelos apóstolos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. As exclamações reproduzem a intensidade retórica; “vocês” evita regionalismo excessivo, e a repetição de “já” conserva a progressão irônica.
