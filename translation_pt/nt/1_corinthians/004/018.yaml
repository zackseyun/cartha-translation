  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: pt
  text: Alguns se encheram de orgulho[a], como se eu não fosse até vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foram inflados” ou “ficaram inchados”. Paulo usa repetidamente essa imagem em 1 Coríntios para falar do orgulho presunçoso; veja 1Co 4:6, 19; 5:2; 8:1; 13:4.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὡς
  choice: como se
  rationale: Introduz a suposição equivocada que está por trás da atitude de alguns coríntios, preservando de modo natural a força comparativa e hipotética.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: eu não fosse visitá-los
  rationale: A construção participial no genitivo, subordinada a ὡς e negada por μή, apresenta uma situação suposta, não uma afirmação direta. “Fosse” conserva essa força irreal, e “visitá-los” expressa naturalmente o movimento de Paulo até os destinatários.
- source_word: δέ
  choice: —
  rationale: Partícula conectiva leve, cuja função discursiva é suficientemente transmitida pela continuidade com o versículo anterior; explicitá-la isoladamente poderia tornar a frase menos natural.
- source_word: ἐφυσιώθησάν
  choice: ficaram cheios de orgulho
  rationale: Comunica em português corrente o estado de presunção indicado pelo verbo. Embora a expressão grega evoque literalmente alguém “inchado”, uma tradução inteiramente literal seria pouco idiomática; a nota preserva a imagem recorrente de Paulo.
- source_word: τινες
  choice: Alguns
  rationale: Indica de maneira concisa e natural apenas uma parte da comunidade.
theological_decisions:
- issue: A crítica de Paulo ao orgulho de alguns coríntios
  choice: Traduzir no texto como “ficaram cheios de orgulho”, registrando em nota a imagem literal de estarem “inchados”.
  alternative: Alguns ficaram inchados de orgulho, como se eu não fosse visitá-los.
  rationale: A escolha comunica claramente a censura de Paulo sem transformar a metáfora em uma expressão artificial, enquanto a nota permite ao leitor reconhecer a imagem verbal recorrente em 1 Coríntios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Visitá-los” evita a formulação menos natural “vir até vocês”, sem alterar a ideia de que Paulo iria pessoalmente à comunidade.
