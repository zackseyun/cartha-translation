  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: pt
  text: Além disso, neste caso, exige-se dos administradores que alguém seja achado fiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aqui, além disso”. Literalmente: “procura-se entre os administradores que alguém seja achado fiel”; isto é, espera-se ou exige-se deles que sejam fiéis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Além disso
  rationale: A combinação introduz a conclusão prática decorrente do versículo anterior. Em português, uma única locução de transição evita acumular marcadores discursivos e comunica naturalmente o avanço do argumento.
- source_word: ζητεῖται
  choice: o que se exige
  rationale: Embora o verbo tenha o sentido básico de procurar, nesta construção indica o que se espera ou requer dos administradores.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: dos administradores
  rationale: Com ζητεῖται, a expressão identifica a classe de pessoas de quem se exige essa qualidade; a formulação é idiomática em português.
- source_word: οἰκονόμοις
  choice: administradores
  rationale: Preserva a imagem de pessoas encarregadas de gerir bens ou assuntos confiados a elas e é imediatamente compreensível no contexto moderno.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: é que cada um seja considerado fiel
  rationale: Expressa o conteúdo da exigência, mantém a referência distributiva e genérica e traduz εὑρεθῇ como uma avaliação ou constatação do caráter da pessoa.
theological_decisions:
- issue: Singular representativo e gênero
  choice: cada um seja considerado fiel
  alternative: alguém seja considerado fiel; cada administrador seja considerado fiel
  rationale: O indefinido singular grego é genérico, não restrito a homens. “Cada um” preserva a aplicação individual dentro do grupo sem recorrer a um masculino especificamente biológico.
- issue: Sentido de πιστός
  choice: fiel
  alternative: digno de confiança; confiável
  rationale: “Fiel” preserva tanto a ideia contextual de confiabilidade no desempenho de uma incumbência quanto a densidade moral do termo, sem limitar o sentido a mera competência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Administradores” comunica com clareza a metáfora de gestão confiada; a nota preserva a forma mais literal “achado fiel” e o valor básico de ζητεῖται.
