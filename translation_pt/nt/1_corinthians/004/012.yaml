  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: pt
  text: e nos afadigamos, trabalhando com as próprias mãos. Quando somos insultados, abençoamos; quando somos perseguidos, suportamos;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: nos afadigamos
  rationale: Expressa trabalho árduo e fatigante, distinguindo-o do particípio seguinte, que explica como esse esforço se realiza.
- source_word: ἐργαζόμενοι
  choice: trabalhando
  rationale: 'Reproduz naturalmente o particípio que especifica o modo do esforço: o trabalho manual.'
- source_word: ταῖς ἰδίαις χερσίν
  choice: com as próprias mãos
  rationale: Preserva a ênfase de ἰδίαις no trabalho manual realizado por eles mesmos.
- source_word: λοιδορούμενοι
  choice: quando somos insultados
  rationale: Comunica em linguagem atual o abuso verbal indicado pelo particípio passivo e mantém a estrutura circunstancial da sequência.
- source_word: εὐλογοῦμεν
  choice: abençoamos
  rationale: Mantém o termo bíblico e o contraste entre receber insultos e responder com bênção.
- source_word: διωκόμενοι
  choice: quando somos perseguidos
  rationale: Expressa o sentido hostil usual no contexto paulino e mantém o paralelismo com a oração anterior.
- source_word: ἀνεχόμεθα
  choice: suportamos
  rationale: Transmite a ideia de aguentar o sofrimento ou a hostilidade sem acrescentar um objeto que não está explícito no grego.
theological_decisions:
- issue: Resposta ética aos maus-tratos
  choice: 'O versículo descreve a conduta apostólica: eles abençoam diante dos insultos e suportam a perseguição.'
  alternative: Transformar a descrição em uma ordem geral dirigida aos leitores.
  rationale: As formas verbais estão na primeira pessoa do plural e descrevem a prática dos apóstolos; a tradução conserva sua força ética sem convertê-la em mandamento explícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Nos afadigamos” preserva a noção de esforço extenuante sem confundi-la com o simples “trabalhando”. O paralelismo das duas respostas aos maus-tratos foi mantido.
