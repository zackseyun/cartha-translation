id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: pt
  text: 'Que cada pessoa nos considere desta maneira: como servidores do Messias[a] e administradores dos mistérios de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de Cristo». O termo grego Χριστός significa «Messias», isto é, «Ungido».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: desta maneira
  rationale: Expressa o modo pelo qual Paulo e seus cooperadores devem ser avaliados, em português natural.
- source_word: ἡμᾶς
  choice: nos
  rationale: Objeto direto de λογιζέσθω; refere-se a Paulo e aos demais obreiros mencionados no contexto.
- source_word: λογιζέσθω
  choice: considere
  rationale: O imperativo presente pede uma avaliação normativa; a construção «Que cada pessoa nos considere» preserva essa força com naturalidade.
- source_word: ἄνθρωπος
  choice: cada pessoa
  rationale: Neste contexto, o substantivo singular tem sentido genérico. «Cada pessoa» comunica claramente que a orientação vale para qualquer indivíduo.
- source_word: ὡς
  choice: como
  rationale: Introduz a condição ou função em que eles devem ser considerados.
- source_word: ὑπηρέτας
  choice: servidores
  rationale: Indica pessoas que atuam em serviço subordinado, sem necessariamente transmitir a condição de escravidão associada a δοῦλος.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός conserva aqui seu valor titular, referindo-se ao Ungido a quem esses servidores pertencem e servem.
- source_word: οἰκονόμους
  choice: administradores
  rationale: Designa responsáveis a quem se confia a gestão de uma casa ou de bens; «administradores» torna a metáfora compreensível em português atual.
- source_word: μυστηρίων
  choice: dos mistérios
  rationale: Preserva o termo paulino para realidades ou propósitos divinos antes ocultos e dados a conhecer, sem explicá-lo além do texto.
- source_word: θεοῦ
  choice: de Deus
  rationale: O genitivo indica naturalmente que os mistérios pertencem a Deus e procedem dele.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: 'O título Χριστός mantém sentido ativo neste contexto: os obreiros são servidores do Ungido. A alternativa tradicional é registrada sem alterar o texto principal.'
- issue: Sentido genérico de ἄνθρωπος
  choice: cada pessoa
  alternative: um homem
  rationale: Embora o substantivo grego esteja no singular, seu referente é genérico, não especificamente masculino. «Cada pessoa» preserva esse alcance em português natural sem acrescentar uma restrição de gênero.
- issue: Metáfora de οἰκονόμους
  choice: administradores
  alternative: despenseiros
  rationale: «Administradores» preserva a ideia de responsabilidade delegada e é mais facilmente compreendido hoje; «despenseiros» é tradicional, mas pode sugerir apenas o cuidado de mantimentos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita arcaísmos como «despenseiros» e distingue «servidores» de termos que implicariam escravidão. O marcador [a] aparece no texto principal.
