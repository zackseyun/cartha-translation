  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: pt
  text: Quanto a mim, pouco me importa ser examinado por vocês ou por um tribunal humano[a]; mas nem sequer examino a mim mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “por um dia humano”, expressão que se refere a julgamento ou avaliação humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: Quanto a mim
  rationale: Expressa naturalmente o dativo de referência e mantém em primeiro plano a perspectiva pessoal de Paulo.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: pouco me importa
  rationale: Transmite em português corrente que a questão tem importância mínima para Paulo, sem sugerir que seja absolutamente irrelevante.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: ser examinado por vocês
  rationale: A construção com infinitivo comunica com naturalidade o conteúdo daquilo que Paulo considera de pouca importância; “examinado” preserva a ideia de escrutínio sem antecipar uma sentença final.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: ou por um tribunal humano
  rationale: Traduz idiomaticamente a expressão literal “dia humano” como uma instância humana de avaliação, em contraste contextual com o julgamento do Senhor.
- source_word: ἀλλ’ οὐδὲ
  choice: na verdade, nem sequer
  rationale: 'Reproduz a progressão enfática: Paulo vai além da avaliação alheia e afirma que nem ele próprio se submete a esse exame.'
- source_word: ἐμαυτὸν ἀνακρίνω
  choice: examino a mim mesmo
  rationale: Mantém a ligação lexical com ἀνακριθῶ e a forma reflexiva explícita do grego.
theological_decisions:
- issue: Sentido de ἀνθρωπίνης ἡμέρας
  choice: tribunal humano
  alternative: dia humano; julgamento humano
  rationale: A expressão provavelmente designa figuradamente uma ocasião ou instância de avaliação humana, em contraste com o dia e o julgamento do Senhor no contexto. A tradução idiomática evita uma formulação temporal obscura, e a nota preserva a imagem grega.
- issue: Alcance de ἀνακρίνω
  choice: examinar
  alternative: julgar; investigar
  rationale: “Examinar” preserva o sentido de escrutínio ou avaliação e não resolve indevidamente o termo como condenação ou juízo definitivo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Quanto a mim” preserva a perspectiva enfática, e “tribunal humano” torna clara a expressão idiomática, enquanto a nota registra sua forma literal.
