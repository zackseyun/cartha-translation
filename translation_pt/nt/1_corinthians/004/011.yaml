  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: pt
  text: Até esta mesma hora[a], passamos fome e temos sede, e estamos vestidos precariamente[b], e somos golpeados, e andamos sem moradia fixa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até agora mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estamos com pouca roupa”; o grego pode indicar vestimenta insuficiente, e não necessariamente nudez completa.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “vagamos de um lugar para outro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Até esta mesma hora
  rationale: Expressa a continuidade até o presente e preserva a ênfase de ἄρτι e a imagem concreta de ὥρα, em português natural.
- source_word: πεινῶμεν
  choice: passamos fome
  rationale: Comunica uma condição contínua de privação de alimento de modo corrente, sem intensificar indevidamente o verbo.
- source_word: διψῶμεν
  choice: temos sede
  rationale: Mantém o paralelismo com a fome e descreve claramente a privação contínua.
- source_word: γυμνιτεύομεν
  choice: estamos vestidos precariamente
  rationale: O verbo pode indicar falta de roupa suficiente, não necessariamente nudez completa; a escolha preserva essa amplitude.
- source_word: κολαφιζόμεθα
  choice: somos golpeados
  rationale: O presente passivo retrata agressões físicas sofridas de maneira contínua ou repetida. “Golpeados” é claro sem restringir o tipo exato de golpe.
- source_word: ἀστατοῦμεν
  choice: andamos sem moradia fixa
  rationale: Reproduz tanto a ausência de residência estável quanto a ideia possível de deslocamento constante, sem reduzir o sentido apenas à categoria social moderna de “sem-teto”.
- source_word: καὶ … καὶ … καὶ …
  choice: e … e … e …
  rationale: A repetição de “e” conserva o ritmo cumulativo e insistente da lista grega.
theological_decisions:
- issue: Natureza da descrição que Paulo faz dos apóstolos
  choice: Catálogo concreto de privação e maus-tratos apostólicos contínuos
  alternative: Descrição sobretudo retórica ou hiperbólica
  rationale: Os presentes do indicativo apresentam adversidades em curso de maneira direta. A tradução não suaviza nem intensifica a descrição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação repetida preserva a força cumulativa do grego. As notas mantêm abertas as nuances legítimas referentes à vestimenta insuficiente e à vida sem lugar estável.
