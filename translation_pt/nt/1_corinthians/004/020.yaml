source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: pt
  text: Pois o reino de Deus não consiste em palavras[a], mas em poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em fala”, “em discurso” ou “em meras palavras”; o contraste é com o poder eficaz, não com a simples retórica.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois ... não
  rationale: γάρ introduz a razão do que foi dito antes; “pois” é um conector natural e conciso em português, enquanto “não” traduz diretamente οὐ.
- source_word: ἐν λόγῳ
  choice: consiste em palavras
  rationale: λόγος pode significar “palavra”, “fala” ou “discurso”. Aqui, em contraste com δύναμις, “palavras” comunica naturalmente a ideia de expressão verbal sem acrescentar ao texto a qualificação interpretativa “meras”.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o reino de Deus
  rationale: É a formulação tradicional, clara e abrangente, que preserva tanto a ideia de domínio quanto a de reinado sem restringir o sentido.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: mas em poder
  rationale: δύναμις significa normalmente “poder” e forma a antítese direta com λόγος, preservando a referência ampla à realidade eficaz do reino.
theological_decisions:
- issue: Natureza do contraste entre “palavras” e “poder”
  choice: Manter um contraste amplo entre expressão verbal e poder eficaz, sem definir de que manifestação de poder se trata.
  alternative: Entender o poder especificamente como milagres, transformação moral, disciplina e autoridade apostólica, ou atuação do Espírito em sentido mais restrito.
  rationale: O grego não especifica aqui a forma desse poder; a tradução deve preservar essa abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Consiste em” torna idiomática a construção grega ἐν ... ἀλλ’ ἐν e evita a formulação pouco natural “não está em palavras”, mantendo o paralelismo e a tensão do original.
