  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: pt
  text: O que vocês querem? Devo ir até vocês com uma vara ou com amor e com um espírito de mansidão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com amor e mansidão de espírito”. A expressão também pode ser entendida como uma alusão à atuação do Espírito Santo.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: O que vocês querem?
  rationale: Reproduz de modo direto e natural a pergunta retórica grega, mantendo o tom desafiador de Paulo.
- source_word: ἐν ῥάβδῳ
  choice: com uma vara
  rationale: Preserva a imagem concreta e disciplinar de ῥάβδος sem substituí-la pela interpretação abstrata “disciplina”.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Devo ir até vocês
  rationale: Expressa naturalmente em português a pergunta deliberativa marcada pelo subjuntivo aoristo grego.
- source_word: ἐν ἀγάπῃ
  choice: com amor
  rationale: Mantém o paralelismo com “com uma vara” e traduz ἀγάπη pela forma corrente e abrangente “amor”.
- source_word: πνεύματί τε πραΰτητος
  choice: e espírito de mansidão
  rationale: Conserva tanto πνεῦμα quanto a construção genitiva πραΰτητος, sem decidir no texto principal se se trata apenas da disposição de Paulo ou de uma ação implícita do Espírito Santo.
theological_decisions:
- issue: Sentido de πνεύματι em πνεύματί τε πραΰτητος
  choice: “espírito de mansidão”, com inicial minúscula e referência primária à disposição de Paulo
  alternative: “Espírito de mansidão”, como referência implícita ao Espírito Santo; ou “mansidão de espírito”
  rationale: 'O contraste imediato diz respeito às maneiras pelas quais Paulo poderia chegar: com severidade disciplinar ou com amor e mansidão. A ausência de artigo e o contexto favorecem a ideia de disposição, mas a formulação e a nota preservam a possibilidade de que essa mansidão seja produzida pelo Espírito Santo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. “Vara” mantém a força da metáfora disciplinar; “mansidão” preserva o sentido de πραΰτης sem sugerir fraqueza.
