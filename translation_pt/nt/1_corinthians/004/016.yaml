base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: pt
  text: 'Portanto, peço a vocês: tornem-se meus imitadores.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sejam meus imitadores”.'
    reason: lexical_alternative
  - marker: b
    text: 'Em outro trecho, Paulo especifica: “Sejam meus imitadores, assim como eu também sou imitador do Messias” (1Co 11:1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: peço a vocês com insistência
  rationale: Expressa a força de uma exortação ou apelo sincero em português corrente, sem o tom excessivamente formal de “exorto”.
- source_word: οὖν
  choice: Portanto
  rationale: Marca claramente a conclusão ou inferência decorrente do argumento anterior.
- source_word: ὑμᾶς
  choice: a vocês
  rationale: Explicita que o objeto do apelo está no plural, algo que o pronome grego assinala diretamente.
- source_word: μιμηταί
  choice: imitadores
  rationale: Preserva o sentido direto de pessoas que tomam outra como modelo, sem enfraquecê-lo para o conceito mais amplo de simples seguidores.
- source_word: μου
  choice: meus
  rationale: O genitivo indica que Paulo é aquele a quem os destinatários devem imitar; “meus imitadores” é natural e direto em português.
- source_word: γίνεσθε
  choice: tornem-se
  rationale: Conserva a ideia de passar a assumir uma condição ou postura, além de representar o imperativo plural.
theological_decisions:
- issue: A ordem de Paulo para que os coríntios o imitem pode parecer forte quando isolada de seu contexto cristocêntrico mais amplo.
  choice: Traduzir diretamente “tornem-se meus imitadores”.
  alternative: “sigam o meu exemplo”
  rationale: O grego apresenta Paulo explicitamente como modelo imediato. A formulação direta preserva a tensão do versículo, enquanto a referência a 1 Coríntios 11:1 é oferecida em nota, sem alterar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Peço a vocês com insistência” comunica o caráter urgente do apelo apostólico sem recorrer ao registro mais erudito de “exorto”. A colocação dos marcadores depois da frase evita interromper a exortação.
