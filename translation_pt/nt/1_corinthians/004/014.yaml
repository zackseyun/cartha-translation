  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: pt
  text: Não escrevo estas coisas para envergonhá-los, mas para adverti-los como meus filhos amados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas para aconselhá-los como meus filhos amados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: para envergonhá-los
  rationale: 'Com a negação, o particípio expressa propósito ou modo: Paulo não escreve com a intenção de lhes causar vergonha. A formulação preserva a dimensão social de honra e vergonha.'
- source_word: γράφω ταῦτα
  choice: escrevo estas coisas
  rationale: Mantém o presente epistolar e o plural de ταῦτα em português natural.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca de modo claro o contraste entre a intenção negada e a ação pastoral afirmada.
- source_word: ὡς
  choice: como
  rationale: Preserva a comparação relacional sem transformá-la numa afirmação explicativa adicional.
- source_word: τέκνα μου ἀγαπητὰ
  choice: meus filhos amados
  rationale: τέκνα é inclusivo quanto ao gênero no referente coletivo; 'filhos' funciona em português como plural genérico e comunica a relação filial, enquanto 'amados' conserva o afeto de ἀγαπητά.
- source_word: νουθετῶν
  choice: para aconselhá-los
  rationale: O verbo envolve instrução corretiva e advertência. 'Aconselhar' é atual e pastoral, embora a nota registre a alternativa mais explicitamente corretiva.
theological_decisions:
- issue: Tom da correção pastoral de Paulo
  choice: para aconselhá-los como meus filhos amados
  alternative: advertindo-os como meus filhos amados
  rationale: A tradução mantém unidas a correção moral e a afeição paterna, sem converter a fala de Paulo em mera condenação nem eliminar sua força corretiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura de propósito torna natural em português o contraste entre “para envergonhá-los” e “para aconselhá-los”; a nota conserva a força de advertência presente em νουθετῶν.
