    issue: “Em último lugar” é possível, mas não reproduz tão diretamente o predicativo ἐσχάτους.
    rationale: “Como os últimos” conserva a caracterização dos apóstolos como os que ocupam a posição derradeira/rebaixada.
  - severity: low
