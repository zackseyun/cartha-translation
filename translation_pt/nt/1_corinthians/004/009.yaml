  source_fidelity: 'O sentido central é bem preservado: Paulo entende que Deus expôs publicamente os apóstolos em posição derradeira, como pessoas destinadas à morte, diante de uma audiência cósmica e humana. Convém, porém, expressar ἐσχάτους mais diretamente como “os últimos”, e ἀπέδειξεν com um verbo que mantenha a noção de exibição pública.'
  naturalness: 'A construção “nos apresentou, a nós, os apóstolos, em último lugar” é compreensível, mas soa pesada e redundante em português moderno. “Nos exibiu, a nós, os apóstolos, como os últimos” conserva a ênfase apositiva e flui melhor. A série final é mais natural e transparente como três dativos coordenados: “ao mundo, aos anjos e aos seres humanos”.'
  terminology: “Anjos”, “seres humanos”, “condenados à morte” e “espetáculo” são escolhas adequadas. “Exibiu” faz melhor justiça à imagem pública de ἀπέδειξεν e à continuidade metafórica com θέατρον.
