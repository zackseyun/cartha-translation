source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: pt
  text: Pois me parece que Deus nos exibiu, a nós, os apóstolos, como os últimos, como condenados à morte[a], porque nos tornamos um espetáculo[b] ao mundo, aos anjos e aos seres humanos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como pessoas destinadas a morrer”. O termo grego provavelmente evoca condenados expostos publicamente na arena.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “um teatro”; aqui, no sentido de um espetáculo exposto à vista de todos.
    reason: lexical_alternative
  - marker: c
    text: “Seres humanos” traduz ἀνθρώποις em contraste com “anjos” e se refere à humanidade em geral.
    reason: lexical_clarification
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Pois me parece
  rationale: Preserva a avaliação pessoal de Paulo e a ligação explicativa de γάρ, em português natural.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: nos apresentou, a nós, os apóstolos
  rationale: Mantém a construção apositiva e identifica explicitamente o grupo ao qual Paulo pertence.
- source_word: ἐσχάτους
  choice: em último lugar
  rationale: Expressa a posição final e rebaixada sugerida pelo termo no contexto retórico.
- source_word: ἀπέδειξεν
  choice: apresentou
  rationale: Comunica a ideia de colocar alguém publicamente em exibição e combina com a imagem subsequente do espetáculo.
- source_word: ὡς ἐπιθανατίους
  choice: como condenados à morte
  rationale: Traduz pessoas destinadas a morrer, provavelmente evocando condenados expostos na arena, sem acrescentar o substantivo masculino 'homens' ausente como termo independente no grego.
- source_word: θέατρον ἐγενήθημεν
  choice: nos tornamos um espetáculo
  rationale: Transmite idiomaticamente a metáfora de exposição pública; 'teatro' seria mais literal, mas menos claro no português atual.
- source_word: τῷ κόσμῳ
  choice: para o mundo
  rationale: Representa o dativo como audiência diante da qual os apóstolos são expostos.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: tanto para anjos como para seres humanos
  rationale: Preserva o paralelismo e deixa claro que ἀνθρώποις designa a humanidade, não apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Sentido de ἀγγέλοις
  choice: anjos, isto é, seres celestiais que integram a audiência do espetáculo
  alternative: mensageiros humanos
  rationale: Em contraste coordenado com seres humanos e dentro da audiência abrangente do mundo, a leitura mais natural é a de seres angelicais; a tradução não acrescenta qualificação doutrinária.
- issue: Agência e imagem de condenação pública
  choice: Deus apresenta os apóstolos como condenados à morte
  alternative: Deus os declara juridicamente condenados à morte
  rationale: O texto atribui a Deus a apresentação pública, mas a comparação introduzida por ὡς não exige que se faça dela uma sentença judicial divina formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição enfática “a nós, os apóstolos” conserva a aposição grega; “seres humanos” evita a ambiguidade contemporânea de “homens”.
