source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: pt
  text: mas nós proclamamos o Messias crucificado[a], para os judeus pedra de tropeço e para os gentios loucura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo crucificado”.'
    reason: alternative_reading
  - marker: b
    text: Em grego, “nações”; aqui, provavelmente os gentios, em contraste com os judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: proclamamos
  rationale: Expressa naturalmente o anúncio público e autorizado indicado pelo verbo grego, sem restringi-lo ao ato moderno de pregar um sermão.
- source_word: Χριστόν
  choice: o Messias
  rationale: Preserva aqui o valor titular de Χριστός no conteúdo da proclamação; “Cristo” continua sendo uma alternativa tradicional válida.
- source_word: ἐσταυρωμένον
  choice: crucificado
  rationale: Reproduz de modo conciso e idiomático o particípio perfeito passivo, mantendo em foco tanto a crucificação sofrida quanto a condição do Messias crucificado.
- source_word: Ἰουδαίοις
  choice: para os judeus
  rationale: No contraste retórico com ἔθνεσιν, refere-se naturalmente aos judeus como grupo étnico-religioso, não apenas aos habitantes da Judeia.
- source_word: σκάνδαλον
  choice: pedra de tropeço
  rationale: Conserva a metáfora de algo que faz tropeçar; “motivo de escândalo” seria possível, mas menos claramente metafórico no português atual.
- source_word: ἔθνεσιν
  choice: para os gentios
  rationale: Embora o sentido lexical amplo seja “nações”, o contraste explícito com os judeus favorece “gentios”, isto é, os não judeus.
- source_word: μωρίαν
  choice: loucura
  rationale: É uma formulação natural e digna para aquilo que é considerado insensato, além de manter a conexão vocabular com o argumento do capítulo.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: O contexto apresenta a identidade messiânica do crucificado como conteúdo da proclamação. A tradução titular torna isso explícito sem excluir a tradicional leitura “Cristo”.
- issue: Força do perfeito em ἐσταυρωμένον
  choice: crucificado
  alternative: que foi crucificado
  rationale: A forma concisa preserva a descrição central sem resolver além do grego se a ênfase recai sobretudo no evento passado ou na condição resultante.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o contraste retórico do grego; os dois-pontos e o ponto e vírgula tornam claras as duas avaliações paralelas sem acrescentar conteúdo interpretativo.
