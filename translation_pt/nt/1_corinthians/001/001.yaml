  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: pt
  text: Paulo, chamado para ser apóstolo do Messias Jesus[a] pela vontade de Deus, e Sóstenes, o irmão,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: Cristo Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: κλητὸς ἀπόστολος
  choice: apóstolo chamado
  rationale: Reproduz diretamente a construção adjetival grega e mantém a ênfase de que Paulo é apóstolo por chamado, sem acrescentar explicitamente «para ser».
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Χριστός conserva aqui seu valor titular; «Messias» torna esse sentido explícito, e a ordem dos nomes segue o grego.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Expressão portuguesa natural para o valor de meio ou agência de διά com genitivo neste contexto.
- source_word: Σωσθένης
  choice: Sóstenes
  rationale: Forma portuguesa tradicional do nome pessoal grego.
- source_word: ὁ ἀδελφὸς
  choice: o irmão
  rationale: Mantém o artigo definido e o substantivo masculino do texto grego, que não contém pronome possessivo.
theological_decisions:
- issue: Tradução de Χριστός na saudação paulina
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto, Χριστός identifica Jesus por seu título messiânico; «Messias» preserva esse conteúdo em vez de tratar o termo apenas como elemento semelhante a um nome.
- issue: Sentido de κλητός em relação ao apostolado
  choice: apóstolo chamado
  alternative: chamado para ser apóstolo
  rationale: A formulação escolhida conserva a construção compacta e a ênfase do original sem resolver o adjetivo em uma expressão verbal acrescentada.
- issue: Força de ὁ ἀδελφός
  choice: o irmão
  alternative: nosso irmão
  rationale: O original usa artigo definido, mas não traz «nosso». Embora «nosso irmão» seja idiomático em português e plausível no contexto epistolar, «o irmão» preserva mais diretamente a forma e sua leve estranheza.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. «Apóstolo chamado» preserva a concisão original; «o irmão» é deliberadamente formal e fonte-próximo. O marcador da nota foi colocado após «Messias Jesus», termo ao qual a alternativa se refere.
