  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: pt
  text: Agradeço por não ter batizado nenhum de vocês, exceto Crispo e Gaio,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Agradeço
  rationale: Expressa de modo natural e atual o presente do indicativo, preservando a ação de dar graças sem tornar explícito no texto principal um objeto cuja presença varia na tradição manuscrita.
- source_word: ὅτι
  choice: por
  rationale: Em português, a construção «agradeço por» introduz naturalmente o motivo ou conteúdo da gratidão de Paulo.
- source_word: οὐδένα ὑμῶν
  choice: nenhum de vocês
  rationale: Equivalência direta, clara e amplamente compreensível da expressão negativa grega.
- source_word: ἐβάπτισα
  choice: ter batizado
  rationale: O infinitivo composto ajusta-se à construção portuguesa com «por», enquanto «batizado» é o equivalente cristão tradicional e não determina o modo do batismo.
- source_word: εἰ μὴ
  choice: exceto
  rationale: Marca com clareza a exceção à declaração negativa precedente.
- source_word: Κρίσπον
  choice: Crispo
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: Γάϊον
  choice: Gaio
  rationale: Forma tradicional e corrente do nome próprio em português.
theological_decisions:
- issue: Presença de θεῷ («a Deus») após εὐχαριστῶ
  choice: Incluir «a Deus» no texto, com nota de variante
  alternative: 'Omitir «a Deus»: «Agradeço por não ter batizado...»'
  rationale: O sinal crítico do SBLGNT indica variante textual. A expressão está amplamente atestada e explicita o destinatário normalmente pressuposto no uso paulino de εὐχαριστέω; a nota preserva transparência quanto à evidência manuscrita sem ocultar a variante.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» para a segunda pessoa do plural. A ordem foi ajustada à sintaxe natural do português, e a vírgula final preserva a continuidade da frase no versículo seguinte.
