id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: pt
  text: Ele também os manterá firmes[a] até o fim, irrepreensíveis[b] no dia de nosso Senhor Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os confirmará” ou “os fortalecerá”.
    reason: lexical_alternative
  - marker: b
    text: Ou “livres de acusação” ou “acima de qualquer acusação”.
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “Cristo”; aqui traduzido como “Messias” para preservar o sentido do título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: manterá firmes
  rationale: Expressa de modo natural a ideia de tornar ou conservar alguém firme e seguro, especialmente com a extensão temporal de ἕως τέλους.
- source_word: ἕως τέλους
  choice: até o fim
  rationale: Preserva com clareza a duração até o ponto final de caráter escatológico.
- source_word: ἀνεγκλήτους
  choice: irrepreensíveis
  rationale: Termo conciso e corrente no registro bíblico, que comunica não estar sujeito a acusação legítima.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: no dia
  rationale: Mantém a expressão bíblica para o dia escatológico e é idiomático em português.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução portuguesa consagrada e adequada ao peso titular de κύριος neste contexto.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Preserva o significado titular de Χριστός; a construção apositiva com artigo é natural em português e evita que o título pareça sobrenome.
theological_decisions:
- issue: Referente de ὃς ('o qual/ele')
  choice: O pronome é representado por “Ele” e remete ao Senhor Jesus, o Messias, mencionado no versículo anterior.
  alternative: Entender o referente de forma mais ampla como Deus, mencionado anteriormente no contexto.
  rationale: O antecedente masculino singular mais próximo é “nosso Senhor Jesus, o Messias” em 1.7. “Ele” mantém a ligação pronominal sem repetir nem explicitar além do que a sintaxe contextual indica.
- issue: Relação de ἀνεγκλήτους com o verbo
  choice: Manter “irrepreensíveis” como predicativo ligado diretamente aos destinatários.
  alternative: 'Explicitar uma relação de resultado: “para que sejam irrepreensíveis”.'
  rationale: A forma direta preserva a concisão e não decide se a qualidade é resultado, propósito ou condição mantida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Manterá firmes” evita um uso excessivamente técnico de “confirmará”; “irrepreensíveis” conserva o registro bíblico sem perder inteligibilidade. A pontuação em “Jesus, o Messias” apresenta Χριστός como título.
