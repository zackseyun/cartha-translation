id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: pt
  text: Pois a mensagem da cruz é loucura para os que estão perecendo, mas, para nós que estamos sendo salvos, é o poder de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγος
  choice: mensagem
  rationale: Neste contexto, refere-se ao conteúdo proclamado acerca da cruz; “mensagem” comunica esse sentido com naturalidade, enquanto “palavra” seria uma alternativa mais formal.
- source_word: σταυροῦ
  choice: cruz
  rationale: Preserva a expressão compacta de Paulo e sua força, sem explicitar indevidamente a metonímia como “crucificação”.
- source_word: ἀπολλυμένοις
  choice: os que estão perecendo
  rationale: Reproduz o aspecto presente do particípio e mantém a ideia de uma condição em curso; “os perdidos” seria menos aspectualmente preciso.
- source_word: μωρία
  choice: loucura
  rationale: É o equivalente português claro e corrente para aquilo que é considerado insensato, preservando o contraste com o poder de Deus.
- source_word: σῳζομένοις
  choice: nós que estamos sendo salvos
  rationale: Conserva o aspecto presente e a referência explícita a “nós”, apresentando a salvação como realidade em curso.
- source_word: δύναμις θεοῦ
  choice: o poder de Deus
  rationale: Mantém de modo natural e formalmente próximo a construção predicativa e seu peso teológico.
theological_decisions:
- issue: Aspecto da salvação em σῳζομένοις
  choice: nós que estamos sendo salvos
  alternative: nós que somos salvos
  rationale: O particípio presente apresenta aqui a salvação como realidade presente ou em curso. A tradução preserva essa tensão sem reduzi-la apenas a um acontecimento passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre “os que estão perecendo” e “nós que estamos sendo salvos”, sem acrescentar explicações ao texto.
