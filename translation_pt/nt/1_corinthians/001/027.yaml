base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: pt
  text: Mas Deus escolheu o que é loucura no mundo[a] para envergonhar os sábios[b], e Deus escolheu o que é fraco no mundo[c] para envergonhar o que é forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas loucas do mundo”. O grego usa um adjetivo neutro plural como substantivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “expor os sábios à vergonha”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as coisas fracas do mundo”. O grego novamente usa um adjetivo neutro plural como substantivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca de modo natural e conciso o forte contraste com a afirmação anterior.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: o que é loucura no mundo
  rationale: Reproduz o adjetivo neutro plural substantivado sem restringir a referência apenas a pessoas; “no mundo” expressa com naturalidade a esfera da avaliação.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: É a correspondência comum e clara para a ação deliberada expressa por ἐκλέγομαι.
- source_word: ὁ θεός
  choice: Deus
  rationale: Mantém o sujeito explícito e sua posição enfática no sentido da oração.
- source_word: ἵνα
  choice: para
  rationale: Expressa de forma idiomática a finalidade da escolha divina.
- source_word: καταισχύνῃ
  choice: envergonhar
  rationale: Comunica de modo direto a ideia de causar vergonha ou expor à vergonha.
- source_word: τοὺς σοφούς
  choice: os sábios
  rationale: Traduz naturalmente o adjetivo masculino plural substantivado e preserva o contraste retórico.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: o que é fraco no mundo
  rationale: Preserva o neutro plural substantivado e evita decidir se Paulo se refere exclusivamente a pessoas ou também a realidades consideradas fracas.
- source_word: τὰ ἰσχυρά
  choice: o que é forte
  rationale: Preserva o neutro plural e mantém o paralelismo com “o que é fraco”, sem estreitar a referência.
