  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: pt
  text: porque, nele, vocês foram enriquecidos em tudo, em toda palavra e em todo conhecimento,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: No contexto, introduz a razão da ação de graças de Paulo no versículo anterior; o valor causal é o mais claro.
- source_word: ἐν παντὶ
  choice: em tudo
  rationale: Preserva a abrangência da expressão grega e soa natural em português, sendo especificada pelas duas expressões seguintes.
- source_word: ἐπλουτίσθητε
  choice: vocês foram enriquecidos
  rationale: Mantém tanto a voz passiva quanto a metáfora de riqueza, indicando que os coríntios receberam esse enriquecimento.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Conserva o sentido mais provável de esfera ou união com Cristo, sem substituí-lo por uma leitura instrumental como «por meio dele».
- source_word: ἐν παντὶ λόγῳ
  choice: em toda palavra
  rationale: Mantém a amplitude semântica de λόγος e o paralelismo conciso do grego; «palavra» pode abranger expressão verbal e discurso sem restringir o texto a uma habilidade específica.
- source_word: πάσῃ γνώσει
  choice: em todo conhecimento
  rationale: Reproduz o paralelismo com «em toda palavra» e conserva o sentido amplo de γνώσις.
theological_decisions:
- issue: Sentido de ἐν αὐτῷ
  choice: nele
  alternative: por meio dele
  rationale: A formulação preserva a linguagem paulina de participação ou união com Cristo e evita resolver a preposição como mero instrumento.
- issue: Alcance de λόγος
  choice: palavra
  alternative: capacidade de falar
  rationale: O termo pode indicar palavra, discurso ou expressão verbal. A tradução evita reduzir a dádiva a uma capacidade específica que o grego não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de «vocês» para o plural. A ordem «nele, vocês foram» torna clara a ligação de «nele» com o enriquecimento. Mantém-se a vírgula final por se tratar de uma cláusula que continua no versículo seguinte.
