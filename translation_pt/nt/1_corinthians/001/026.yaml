source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: pt
  text: Considerem, pois, o chamado de vocês, irmãos:[a] não há muitos sábios segundo os padrões humanos, nem muitos poderosos, nem muitos de família nobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” aqui se dirige coletivamente à congregação e inclui tanto as mulheres quanto os homens que creem.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: considerem
  rationale: Embora a forma possa ser entendida como indicativo ou imperativo, o contexto favorece uma exortação para que os coríntios reflitam sobre sua própria situação.
- source_word: κλῆσιν
  choice: chamado
  rationale: Em Paulo, o termo se refere ao chamado de Deus que constitui a comunidade dos crentes, e não a profissão ou posição social deles.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; no contexto, o vocativo se dirige coletivamente a toda a congregação, conforme esclarece a nota.
- source_word: οὐ πολλοὶ σοφοὶ κατὰ σάρκα
  choice: não foram chamados muitos sábios segundo os padrões humanos
  rationale: A repetição implícita da ideia de chamado torna natural explicitar 'foram chamados'. 'Segundo os padrões humanos' comunica o sentido avaliativo de κατὰ σάρκα sem sugerir carne literal ou natureza pecaminosa.
- source_word: δυνατοί
  choice: poderosos
  rationale: Preserva a referência ampla a pessoas detentoras de poder ou influência sem restringir indevidamente o tipo de poder.
- source_word: εὐγενεῖς
  choice: de família nobre
  rationale: Expressa com clareza a referência à linhagem social elevada e soa natural em português moderno.
theological_decisions:
- issue: Relação de κλῆσιν com a série οὐ πολλοὶ
  choice: Explicitar 'foram chamados' apenas na primeira oração da série
  alternative: 'Traduzir literalmente: ''não muitos sábios... não muitos poderosos...'''
  rationale: A construção grega é elíptica e pode descrever aqueles que compõem o chamado da comunidade ou aqueles que foram chamados. A explicitação adotada transmite naturalmente em português a relação contextual sem afirmar que nenhuma pessoa dessas classes foi chamada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a repetição retórica de “muitos” e preserva a força social das três categorias.
