  text: so that no flesh may boast before God[a].
translation:
  language: pt
  text: para que nenhuma carne se vanglorie diante de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que nenhum ser humano se vanglorie diante de Deus». Literalmente, «toda carne».'
    reason: Alternativa lexical que esclarece que «carne» se refere aqui ao ser humano; a formulação literal reflete πᾶσα σὰρξ.
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz uma oração de propósito ou resultado e preserva naturalmente a força télica do grego.
- source_word: μὴ
  choice: nenhuma
  rationale: Com o subjuntivo, nega universalmente a possibilidade visada; em português, combina-se de modo natural com «carne».
- source_word: καυχήσηται
  choice: se vanglorie
  rationale: O aoristo subjuntivo médio de καυχάομαι expressa vangloriar-se ou gloriar-se; «se vanglorie» é claro, atual e preserva a ideia de exaltação própria.
- source_word: πᾶσα σὰρξ
  choice: nenhuma carne
  rationale: Embora a expressão seja literalmente «toda carne», sob a negação ela exclui universalmente a vanglória. A formulação mantém a imagem paulina, e a nota esclarece seu referente humano.
- source_word: σὰρξ
  choice: carne
  rationale: Aqui designa a humanidade em sua condição criatural e frágil, não uma suposta «natureza pecaminosa». «Carne» preserva a textura bíblica e a tensão lexical do termo.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Equivalente português idiomático e conciso para estar na presença ou perante Deus.
theological_decisions:
- issue: Sentido de σάρξ no contexto paulino
  choice: Manter «carne» no texto principal.
  alternative: Traduzir como «ser humano» ou «humanidade».
  rationale: Neste versículo, σάρξ aponta para os seres humanos em sua fraqueza criatural diante de Deus, não para um princípio moral interno. Manter «carne» conserva a retórica de Paulo sem impor a interpretação «natureza pecaminosa».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «nenhuma carne» é deliberadamente bíblica; a nota oferece a formulação corrente sem apagar a imagem do original.
