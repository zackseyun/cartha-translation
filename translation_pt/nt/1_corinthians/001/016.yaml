  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: pt
  text: Também batizei os da casa de Estéfanas[a]. Além disso, não sei se batizei mais alguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a casa de Estéfanas”. O termo grego pode designar a unidade doméstica como um todo, e não apenas o edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: batizei
  rationale: O verbo aoristo se refere claramente à administração do batismo; “batizei” é a forma portuguesa padrão e não especifica por si só o modo do rito.
- source_word: δὲ καὶ
  choice: Também
  rationale: A combinação funciona de modo aditivo, acrescentando a casa de Estéfanas à relação anterior; “Também” transmite isso com naturalidade.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: os da casa de Estéfanas
  rationale: οἶκος designa aqui, com maior probabilidade, as pessoas que compõem a unidade doméstica, e não apenas o edifício. A expressão portuguesa mantém amplitude maior que “família”.
- source_word: λοιπὸν
  choice: Além desses
  rationale: A expressão introduz o que resta depois da exceção recém-acrescentada. “Além desses” liga naturalmente a incerteza de Paulo às pessoas já mencionadas.
- source_word: οὐκ οἶδα
  choice: não sei
  rationale: Reproduz diretamente a afirmação grega de falta de conhecimento, sem explicitar “não me lembro”, embora o contexto envolva memória.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: se batizei mais alguém
  rationale: A oração expressa incerteza quanto a qualquer outra pessoa batizada e soa natural em português.
