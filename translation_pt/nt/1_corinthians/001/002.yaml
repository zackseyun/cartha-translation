  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: pt
  text: 'À igreja de Deus que está em Corinto, aos santificados no Messias Jesus[a], chamados para serem santos[b], junto com todos os que invocam o nome de nosso Senhor Jesus, o Messias[c], em todo lugar — deles e nosso[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Cristo Jesus”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “santos chamados”.
    reason: lexical_alternative
  - marker: c
    text: Ou “Jesus Cristo”.
    reason: lexical_alternative
  - marker: d
    text: A expressão “em todo lugar — deles e nosso” pode se referir a todo lugar pertencente a eles e a nós; também pode ser entendida como “nosso Senhor ... deles e nosso”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: “Igreja” é a forma natural e amplamente compreendida neste endereço epistolar, preservando a ideia da comunidade reunida de Deus.
- source_word: ἡγιασμένοις
  choice: santificados
  rationale: O particípio perfeito passivo indica uma ação recebida com resultado presente; “santificados” preserva tanto a voz passiva quanto o peso teológico do termo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém Χριστός como título messiânico e conserva a ordem grega, ainda que a formulação seja deliberadamente mais marcada do que o tradicional “em Cristo Jesus”.
- source_word: κλητοῖς ἁγίοις
  choice: chamados para serem santos
  rationale: É a formulação portuguesa mais clara e natural para os dois adjetivos gregos, sem sugerir que “santos” designe apenas uma classe especial dentro da igreja.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: invocam o nome
  rationale: “Invocar o nome” expressa com naturalidade o sentido de apelo, confissão e culto presente na locução grega.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente estabelecido e adequado ao caráter confessional da referência a Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: A construção portuguesa apresenta Χριστός de modo idiomático como título, e não como sobrenome.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: em todo lugar — deles e nosso
  rationale: A formulação compacta conserva a possibilidade de “deles e nosso” qualificar tanto “lugar” quanto “Senhor”, sem decidir uma ambiguidade real do grego.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias nas duas ocorrências
  alternative: Cristo
  rationale: Neste endereço e na confissão do nome de Jesus, o valor titular de Χριστός permanece perceptível; “Messias” torna esse valor explícito sem acrescentar uma distinção denominacional.
- issue: Sentido de κλητοῖς ἁγίοις
  choice: chamados para serem santos
  alternative: santos chamados
  rationale: A opção principal comunica de modo natural a vocação divina à santidade; a nota registra a construção mais literal e preserva a possibilidade de entender ambos os termos como descrições coordenadas.
- issue: Referente de αὐτῶν καὶ ἡμῶν
  choice: manter a ambiguidade na redação
  alternative: explicitar “Senhor deles e nosso” ou “lugar deles e nosso”
  rationale: A sintaxe grega admite associação com “lugar” ou, mais remotamente, com “Senhor”; a tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções familiares no registro bíblico. “No Messias Jesus” é intencionalmente marcado para preservar o título Χριστός; as notas oferecem as formas tradicionais. A pontuação final procura conservar, e não eliminar, a ambiguidade sintática de αὐτῶν καὶ ἡμῶν.
