id: 1CO.1.7
reference: 1 Corinthians 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: pt
  text: de modo que não lhes falta nenhum dom[a], enquanto aguardam com grande expectativa a revelação[b] de nosso Senhor Jesus Cristo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nenhum dom espiritual» ou «nenhum dom da graça».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a manifestação» ou «o aparecimento de nosso Senhor Jesus Cristo».'
    reason: lexical_alternative
  - marker: c
    text: O grego traz «Jesus Cristo»; Cristo significa «Messias», de modo que também se pode traduzir «Jesus, o Messias».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado da graça e do enriquecimento mencionados no contexto anterior, com formulação natural em português.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: não lhes falta
  rationale: Expressa ausência de deficiência e concorda naturalmente com o estado presente da comunidade.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: nenhum dom
  rationale: χαρίσμα designa um dom concedido pela graça; «dom» é claro e evita acrescentar «espiritual», termo não expresso aqui.
- source_word: ἀπεκδεχομένους
  choice: enquanto aguardam com grande expectativa
  rationale: Preserva tanto a ação contínua do particípio quanto a intensidade da espera expectante.
- source_word: ἀποκάλυψιν
  choice: revelação
  rationale: É o equivalente lexical mais direto e preserva a linguagem escatológica paulina sem reduzi-la apenas a uma aparição visível.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução estabelecida e contextualmente adequada de κύριος como título de Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  rationale: Nesta combinação, Χριστός funciona como designação consolidada, próxima de um nome; «Cristo» preserva o uso português tradicional sem ocultar em nota o sentido titular.
theological_decisions:
- issue: Sentido de χάρισμα
  choice: dom
  alternative: dom espiritual; dom da graça
  rationale: «Dom» preserva a abrangência do termo no contexto. «Espiritual» explicita uma interpretação plausível, e «dom da graça» torna visível sua relação lexical com χάρις.
- issue: Sentido escatológico de ἀποκάλυψις
  choice: revelação
  alternative: manifestação; aparecimento
  rationale: «Revelação» mantém a forma lexical e a ideia de Jesus Cristo ser desvelado; as alternativas exprimem o evento de sua manifestação futura.
- issue: Tradução de Χριστός em Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  alternative: Jesus, o Messias
  rationale: A expressão funciona aqui como designação pessoal consolidada, sem ênfase independente no título. A nota conserva explicitamente o sentido messiânico de Χριστός.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de terceira pessoa para boa legibilidade brasileira. «Com grande expectativa» comunica a força de ἀπεκδέχομαι sem recorrer ao possível brasileirismo semântico de «ansiosamente». Todos os marcadores de nota aparecem no texto.
