  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: pt
  text: 'para que, como está escrito: “Quem se gloria, glorie-se no Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz o propósito ou resultado decorrente do contexto anterior e preserva de modo natural a força da conjunção grega.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Reproduz a fórmula corrente de citação das Escrituras; o presente em português comunica adequadamente a validade contínua expressa pelo perfeito grego.
- source_word: Ὁ καυχώμενος
  choice: Quem se gloria
  rationale: Traduz naturalmente o particípio substantivado e mantém o campo semântico de encontrar motivo de orgulho ou exultação, sem sugerir necessariamente vanglória pecaminosa.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a preposição e expressa em português idiomático o Senhor como esfera e fundamento do gloriar-se.
- source_word: καυχάσθω
  choice: glorie-se
  rationale: O imperativo na terceira pessoa preserva diretamente a força exortativa do grego e forma, com a oração anterior, uma construção portuguesa clara e digna.
theological_decisions:
- issue: Força do imperativo na citação
  choice: glorie-se
  alternative: deve gloriar-se
  rationale: A forma imperativa portuguesa corresponde diretamente a καυχάσθω, conservando a exortação sem transformá-la explicitamente em declaração de obrigação.
- issue: Sentido de καυχάομαι
  choice: gloriar-se
  alternative: orgulhar-se / vangloriar-se
  rationale: “Gloriar-se” permite que o contexto determine a legitimidade do ato e preserva a tensão entre a rejeição da exaltação própria e o gloriar-se corretamente no Senhor.
- issue: Referente de κύριος na citação
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κυρίῳ, e Paulo formula a citação com “Senhor”. A tradução não resolve tipograficamente além do grego a relação com o nome divino no texto veterotestamentário subjacente.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com registro bíblico digno. A formulação concisa mantém a estrutura proverbial da citação e evita linguagem arcaica.
