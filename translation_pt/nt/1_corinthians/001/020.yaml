source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: pt
  text: Onde está o sábio?[a] Onde está o escriba? Onde está o debatedor desta era? Acaso Deus não tornou insensata a sabedoria do mundo?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa sábia”. O grego está no masculino singular, provavelmente com sentido representativo.
    reason: lexical_alternative
  - marker: b
    text: “Desta era” traduz um termo grego diferente daquele traduzido por “mundo” mais adiante no versículo.
    reason: cross_reference
  - marker: c
    text: Ou “mostrou que a sabedoria do mundo é insensata”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Onde está
  rationale: Reproduz a pergunta retórica que desafia a presença ou relevância das figuras mencionadas, em português natural.
- source_word: σοφός
  choice: o sábio
  rationale: Preserva o masculino singular substantivado do grego; no contexto, representa a classe das pessoas consideradas sábias.
- source_word: γραμματεύς
  choice: o escriba
  rationale: É o equivalente histórico mais direto e mantém a força concreta do termo, sem restringi-lo explicitamente a uma interpretação específica.
- source_word: συζητητής
  choice: o debatedor
  rationale: Expressa de modo atual e claro aquele que argumenta ou disputa mediante raciocínio.
- source_word: τοῦ αἰῶνος τούτου
  choice: desta era
  rationale: Mantém αἰών distinto de κόσμος, empregado mais adiante no mesmo versículo.
- source_word: οὐχὶ
  choice: Acaso ... não
  rationale: Marca com naturalidade uma pergunta retórica que espera resposta afirmativa.
- source_word: ἐμώρανεν
  choice: tornou louca
  rationale: Conserva a força causativa do verbo; a nota registra a possibilidade de entendê-lo como demonstração do caráter insensato.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: Equivalente usual que preserva o contraste retórico entre a sabedoria reivindicada pelo mundo e a ação de Deus.
- source_word: κόσμου
  choice: do mundo
  rationale: Equivalente natural de κόσμος e deliberadamente distinto de αἰών, traduzido por “era”.
theological_decisions:
- issue: Distinção entre αἰών e κόσμος no mesmo versículo
  choice: Traduzir αἰών por “era” e κόσμος por “mundo”
  alternative: Traduzir ambos por “mundo” para obter uma formulação mais tradicional
  rationale: O texto grego emprega termos diferentes. Preservar a distinção evita nivelar a referência à era presente e a referência ao mundo.
- issue: Força de ἐμώρανεν
  choice: “tornou louca”
  alternative: “mostrou que é louca” ou “demonstrou ser insensata”
  rationale: A tradução principal mantém o valor causativo mais direto sem excluir, na nota, a leitura declarativa ou demonstrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Onde está” preserva o ritmo retórico. “Escriba” mantém a referência histórica, “debatedor” oferece clareza contemporânea, e “desta era” distingue os dois substantivos gregos sem tornar a frase artificial.
