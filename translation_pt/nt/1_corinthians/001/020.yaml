  to: Onde está o sábio?[a] Onde está o escriba? Onde está o debatedor desta era? Acaso Deus não tornou insensata a sabedoria do mundo?[b][c]
  rationale: A revisão limita-se a substituir «louca» por «insensata» no texto e na nota alternativa. Assim, preserva-se a relação causativa de ἐμώρανεν, evita-se uma conotação clínica moderna desnecessária e mantém-se o contraste retórico de Paulo.
