id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: pt
  text: Irmãos[a], apelo a vocês, em nome de nosso Senhor Jesus, o Messias[b], que todos digam a mesma coisa e que não haja divisões[c] entre vocês, mas que sejam plenamente unidos[d] no mesmo entendimento e no mesmo parecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o plural masculino grego pode dirigir-se a toda a comunidade dos que creem.
    reason: cultural_note
  - marker: b
    text: Tradicionalmente, «Cristo».
    reason: lexical_alternative
  - marker: c
    text: Ou «rupturas» ou «cismas».
    reason: lexical_alternative
  - marker: d
    text: Ou «sejam restaurados», «sejam ajustados» ou «sejam recompostos».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: faço-lhes um apelo
  rationale: Expressa a súplica pastoral insistente de Paulo sem reduzi-la a uma ordem seca; é natural e digna em português.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Preserva a forma masculina plural do grego; o alcance contextual à comunidade inteira é esclarecido em nota.
- source_word: διὰ τοῦ ὀνόματος
  choice: em nome de
  rationale: Construção idiomática em português que comunica que o apelo se apoia no nome e na autoridade de Jesus.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός, em vez de apenas transliterá-lo; o artigo torna a expressão natural em português.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: que todos digam a mesma coisa
  rationale: Mantém a formulação concreta de Paulo e sua ênfase na concordância expressa, sem substituí-la apenas pela ideia abstrata de concordar.
- source_word: σχίσματα
  choice: divisões
  rationale: Termo corrente e claro para rupturas e facções dentro da comunidade, sem o tom técnico de «cismas».
- source_word: κατηρτισμένοι
  choice: estejam bem unidos
  rationale: Comunica o resultado passivo de serem ajustados e recompostos numa unidade adequada ao contexto de facções.
- source_word: νοῒ
  choice: entendimento
  rationale: Representa a esfera do pensamento ou compreensão e permanece distinto de γνώμη.
- source_word: γνώμῃ
  choice: parecer
  rationale: Conserva a noção de juízo, posição ou resolução compartilhada, sem fundi-la com νοῦς.
theological_decisions:
- issue: Tradução do título cristológico Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, o termo mantém força titular; «Messias» torna explícito seu sentido sem alterar o referente.
- issue: Alcance do vocativo masculino ἀδελφοί
  choice: Irmãos no texto, com nota inclusiva
  alternative: irmãos e irmãs
  rationale: A forma gramatical masculina é preservada, enquanto a nota reconhece que Paulo se dirige representativamente a toda a comunidade cristã.
- issue: Natureza da unidade pedida
  choice: mesmo entendimento e mesmo parecer
  alternative: mesma mente e mesmo julgamento
  rationale: Mantém distintos os dois termos gregos e não transforma o pedido em uniformidade absoluta além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação inicial do vocativo evita uma sequência pesada; «faço-lhes um apelo» conserva o tom pastoral. O texto mantém a imagem concreta de todos dizerem a mesma coisa e distingue entendimento de parecer.
