  to: Irmãos[a], apelo a vocês, em nome de nosso Senhor Jesus, o Messias[b], que todos digam a mesma coisa e que não haja divisões[c] entre vocês, mas que sejam plenamente unidos[d] no mesmo entendimento e no mesmo parecer.
  rationale: A revisão uniformiza o tratamento dos destinatários com «vocês» e substitui «estejam bem unidos» por «sejam plenamente unidos», formulação que representa com maior precisão o particípio passivo κατηρτισμένοι e sua ideia de uma unidade devidamente restaurada ou ajustada. Não altera o sentido nem introduz interpretação confessional.
