base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: pt
  text: 'Quero dizer o seguinte: cada um de vocês diz: “Eu sou de Paulo”, “Eu sou de Apolo”, “Eu sou de Cefas” ou “Eu sou do Messias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu sou de Cristo”.'
    reason: Registra a forma tradicional de traduzir Χριστοῦ.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: Quero dizer o seguinte
  rationale: Expressa de modo natural em português a função explicativa da frase grega, sem alterar seu conteúdo.
- source_word: ἕκαστος ὑμῶν
  choice: cada um de vocês
  rationale: Preserva a força distributiva de ἕκαστος e usa uma forma clara e amplamente compreensível.
- source_word: λέγει
  choice: diz
  rationale: O presente simples corresponde ao presente grego e descreve a prática recorrente entre os coríntios.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Eu sou de Paulo ... Eu, de Apolo ... Eu, de Cefas ... Eu, do Messias
  rationale: A construção portuguesa “ser de” comunica naturalmente filiação ou lealdade partidária. A elipse de “sou” nas três últimas declarações evita repetição pesada sem apagar o paralelismo.
- source_word: Κηφᾶ
  choice: Cefas
  rationale: Translitera o nome empregado por Paulo, em vez de substituí-lo por Pedro.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título e emprega a contração exigida em português antes de “Messias”.
theological_decisions:
- issue: Tradução de Χριστοῦ no lema de uma facção
  choice: do Messias
  alternative: de Cristo
  rationale: O termo grego mantém seu valor titular; “Messias” traduz esse título, enquanto a forma tradicional “Cristo” é registrada em nota sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário corrente. Os nomes aparecem nas formas portuguesas consagradas Paulo, Apolo e Cefas; a pontuação destaca os quatro lemas paralelos.
