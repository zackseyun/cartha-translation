  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Senhor Jesus Cristo”.'
    reason: Alternativa lexical tradicional para Χριστός.
lexical_decisions:
- source_word: χάρις
  choice: Graça
  rationale: Preserva o termo característico da saudação paulina, incluindo seu peso teológico e sua abrangência semântica.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa de modo claro e corrente o dativo dos destinatários; é amplamente compreensível em português moderno.
- source_word: εἰρήνη
  choice: paz
  rationale: É a correspondência natural e consagrada, preservando as ressonâncias relacionais e pactuais do termo.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Indica com naturalidade a fonte da graça e da paz e permite manter a coordenação dos dois nomes que se seguem.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  rationale: Reproduz a relação apositiva do grego em português claro, sem sugerir a estrutura distinta 'nosso Deus e Pai'.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém o título tradicional e sua força teológica, sendo a equivalência portuguesa normal de κύριος neste contexto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, em vez de apenas transliterá-lo, e usa a forma idiomática portuguesa com artigo e aposto.
theological_decisions:
- issue: Se deve ser preservada a origem comum da graça e da paz em relação tanto ao Pai quanto a Jesus.
  choice: Uma única expressão de origem, 'da parte de', rege a coordenação 'Deus, nosso Pai, e do Senhor Jesus, o Messias'.
  alternative: Repetir 'da parte de' antes de 'Senhor Jesus' ou reformular a frase de modo a enfraquecer a coordenação.
  rationale: No grego, uma única preposição ἀπό abrange os dois termos coordenados. A redação conserva essa relação sem acrescentar explicação doutrinária.
- issue: Como representar o valor de Χριστός na fórmula de saudação.
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita o sentido titular de Χριστός; a alternativa tradicional é registrada em nota para preservar a familiaridade e a possibilidade de leitura convencional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem geral da saudação grega foi preservada, e as vírgulas esclarecem as aposições 'nosso Pai' e 'o Messias'.
