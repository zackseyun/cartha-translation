  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: pt
  text: 'Pois está escrito: “Destruirei a sabedoria dos sábios e rejeitarei o entendimento dos inteligentes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada de introdução de uma citação das Escrituras, preservando o sentido resultante do perfeito passivo grego.
- source_word: γάρ
  choice: Pois
  rationale: Mantém de modo conciso a relação explicativa com a afirmação anterior.
- source_word: Ἀπολῶ
  choice: Destruirei
  rationale: Expressa diretamente o futuro de ἀπόλλυμι, com o sentido de destruir ou levar à ruína, sem ampliar sua força.
- source_word: σοφίαν τῶν σοφῶν
  choice: a sabedoria dos sábios
  rationale: Preserva a construção genitiva e a repetição retórica entre palavras cognatas.
- source_word: σύνεσιν τῶν συνετῶν
  choice: o entendimento dos entendidos
  rationale: Preserva o paralelismo e, em português, reproduz a relação cognata entre o substantivo e o grupo de pessoas caracterizado por ele.
- source_word: ἀθετήσω
  choice: rejeitarei
  rationale: Aqui o verbo indica tornar sem efeito ou recusar decisivamente; “rejeitarei” é natural, claro e mantém a tensão lexical sem explicação interpretativa excessiva.
theological_decisions:
- issue: Força dos verbos na citação de Isaías e contraste com a sabedoria humana
  choice: 'Empregar futuros diretos: “Destruirei” e “rejeitarei”'
  alternative: “Farei desaparecer” e “anularei”
  rationale: Os futuros diretos conservam a ação divina afirmada no grego e a força retórica da citação, sem importar uma formulação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo compacto e solene da citação.
