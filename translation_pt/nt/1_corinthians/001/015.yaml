  text: so that no one may say that you were baptized into my name[a].
translation:
  language: pt
  text: para que ninguém diga que vocês foram batizados em meu nome[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para o meu nome”; o grego usa uma preposição que também pode indicar movimento para dentro de algo.
    reason: Preserva em nota a força direcional de εἰς e a alternativa mais literal, sem introduzir no texto uma construção portuguesa artificial.
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido e corresponde naturalmente à função da oração grega.
- source_word: μή τις
  choice: ninguém
  rationale: A combinação expressa de modo idiomático um sujeito indefinido negado.
- source_word: εἴπῃ
  choice: diga
  rationale: O subjuntivo português depois de “para que” preserva adequadamente o valor prospectivo do aoristo subjuntivo grego.
- source_word: εἰς
  choice: para dentro de
  rationale: Torna explícito o sentido direcional de εἰς e preserva a formulação incomum e sua possível força relacional, sem reduzi-la à expressão instrumental “em nome de”.
- source_word: τὸ ἐμὸν ὄνομα
  choice: o meu nome
  rationale: Reproduz com naturalidade a construção possessiva enfática do grego.
- source_word: ἐβαπτίσθητε
  choice: vocês foram batizados
  rationale: Preserva a voz passiva e emprega o termo português corrente, sem impor uma modalidade batismal específica.
theological_decisions:
- issue: Sentido de εἰς τὸ ἐμὸν ὄνομα no contexto batismal
  choice: para dentro do meu nome
  alternative: em meu nome
  rationale: A tradução principal mantém a direção expressa por εἰς e a tensão teológica da identificação batismal. A forma mais idiomática “em meu nome” continua possível, mas pode sugerir sobretudo autoridade ou agência; por isso, aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural. A expressão deliberadamente marcada “para dentro do meu nome” prioriza a transparência ao grego; a alternativa portuguesa mais usual é preservada em nota.
