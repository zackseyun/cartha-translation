  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: pt
  text: assim como o testemunho a respeito do Messias foi confirmado entre vocês[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o testemunho do Messias”.'
    reason: Preserva a ambiguidade genuína do genitivo τοῦ Χριστοῦ.
  - marker: b
    text: 'Ou: “foi confirmado em vocês”.'
    reason: Registra a alternativa mais literal para ἐν ὑμῖν.
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz a correspondência com a afirmação anterior e preserva de modo natural a força comparativa do grego.
- source_word: μαρτύριον
  choice: testemunho
  rationale: Mantém tanto o sentido de testemunho proclamado quanto sua dimensão comprobatória, sem transformar o termo em uma paráfrase como “mensagem”.
- source_word: τοῦ Χριστοῦ
  choice: a respeito do Messias
  rationale: Adota no texto principal o genitivo objetivo, entendendo que o testemunho tem o Messias como conteúdo; “Messias” conserva o valor titular de Χριστός.
- source_word: ἐβεβαιώθη
  choice: foi confirmado
  rationale: Expressa adequadamente o passivo e a ideia de tornar firme, estabelecer ou validar.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto de destinatários plurais, comunica naturalmente a confirmação no âmbito da comunidade de Corinto, sem excluir a alternativa mais literalmente interior indicada em nota.
theological_decisions:
- issue: Força do genitivo em τοῦ Χριστοῦ
  choice: 'genitivo objetivo: “o testemunho a respeito do Messias”'
  alternative: 'genitivo subjetivo ou genitivo amplo: “o testemunho do Messias”'
  rationale: O contexto favorece o testemunho apostólico acerca do Messias confirmado na comunidade, mas a forma grega admite a leitura alternativa, que por isso é preservada em nota.
- issue: Alcance de ἐν ὑμῖν
  choice: “entre vocês”, com sentido comunitário
  alternative: “em vocês”, com possível ênfase interior ou corporativa
  rationale: O plural e o contexto comunitário tornam “entre vocês” natural, embora “em vocês” seja uma correspondência possível e teologicamente significativa.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem dos marcadores acompanha cada ponto de ambiguidade no texto: [a] após “Messias” e [b] após “vocês”.'
