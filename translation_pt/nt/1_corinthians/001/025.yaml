source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: pt
  text: Pois a loucura de Deus é mais sábia do que os seres humanos, e a fraqueza de Deus é mais forte do que os seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da afirmação anterior com uma conexão causal natural e digna em português.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: a loucura de Deus
  rationale: Preserva a formulação deliberadamente paradoxal e incisiva do grego, sem acrescentar a interpretação explícita de que se trata apenas do que 'parece' loucura.
- source_word: σοφώτερον
  choice: mais sábia
  rationale: Mantém o comparativo direto; a concordância feminina acompanha 'loucura' em português.
- source_word: τῶν ἀνθρώπων
  choice: do que os seres humanos
  rationale: Expressa o sentido genérico e inclusivo de ἄνθρωποι, evitando o possível sentido restrito de 'homens'.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: a fraqueza de Deus
  rationale: Conserva o paralelismo e a tensão retórica da expressão grega.
- source_word: ἰσχυρότερον
  choice: mais forte
  rationale: Reproduz de modo claro e natural o comparativo de força.
theological_decisions:
- issue: O caráter paradoxal de 'loucura de Deus' e 'fraqueza de Deus'
  choice: Manter as expressões sem qualificadores
  alternative: Traduzir como 'aquilo que parece loucura em Deus' e 'aquilo que parece fraqueza em Deus'
  rationale: O contexto aponta para a percepção humana da ação divina, mas o texto formula o paradoxo de maneira absoluta. A tradução preserva essa tensão em vez de explicá-la no corpo do versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo e a força provocadora do original foram preservados.
source_grounding:
  english_pob_role: consult_only
