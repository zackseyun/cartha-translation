id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: pt
  text: 'Deus é fiel: por meio dele[a] vocês foram chamados à comunhão[b] com seu Filho, Jesus, o Messias[c], nosso Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por quem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “participação” ou “partilha”.
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “Jesus Cristo”; “Messias” traduz o título Χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: fiel
  rationale: Expressa o caráter digno de confiança de Deus e preserva a força teológica e relacional do adjetivo predicativo.
- source_word: δι’ οὗ
  choice: por meio dele
  rationale: διά com genitivo indica mediação ou agência. A formulação retoma Deus com clareza e soa mais natural em português do que uma oração relativa literal.
- source_word: ἐκλήθητε
  choice: vocês foram chamados
  rationale: Preserva a voz passiva e a linguagem paulina do chamado divino; “vocês” oferece compreensão ampla e leitura natural no português brasileiro.
- source_word: κοινωνίαν
  choice: comunhão
  rationale: Abrange vínculo relacional e participação compartilhada sem restringir o sentido a um uso sacramental.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: com seu Filho
  rationale: Embora o grego use o genitivo, κοινωνία é expresso idiomaticamente em português como comunhão “com” uma pessoa.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz o título Χριστός em vez de apenas transliterá-lo; o artigo torna a expressão titular natural em português.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução corrente e adequada do título κύριος neste contexto cristológico.
theological_decisions:
- issue: Se Χριστοῦ deve ser apresentado como “Cristo” ou traduzido como o título “Messias”.
  choice: o Messias
  alternative: Cristo
  rationale: Na sequência referente a Jesus, Χριστός ainda comunica o título messiânico. “O Messias” torna esse conteúdo transparente sem negar que “Jesus Cristo” seja a forma tradicional.
- issue: A relação expressa por κοινωνία com o Filho.
  choice: comunhão com seu Filho
  alternative: participação em seu Filho
  rationale: “Comunhão com” preserva tanto a dimensão relacional quanto a participativa, sem definir mais precisamente do que o grego a natureza dessa união.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os dois-pontos preservam a ligação lógica entre a fidelidade de Deus e seu ato de chamar, evitando uma oração relativa pouco natural em português.
