lexical_decisions:
- source_word: ἐπειδή
  choice: Pois
  rationale: Introduz a razão explicativa ligada ao argumento do contexto e preserva de modo natural o valor causal em português.
- source_word: καί ... καί
  choice: tanto ... como
  rationale: Reproduz a correlação entre os dois grupos de maneira clara e idiomática, sem alterar o paralelismo.
- source_word: Ἰουδαῖοι
  choice: os judeus
  rationale: No contexto, designa o grupo judaico em contraste cultural e religioso com os gregos; esta é a forma corrente e adequada em português.
- source_word: σημεῖα
  choice: sinais
  rationale: É o equivalente direto e preserva a amplitude do termo grego, inclusive sua possível referência a manifestações milagrosas.
- source_word: αἰτοῦσιν
  choice: pedem
  rationale: Traduz diretamente o presente do verbo, sem intensificá-lo indevidamente como faria 'exigem'.
- source_word: Ἕλληνες
  choice: os gregos
  rationale: Preserva a formulação específica de Paulo e o quadro cultural sugerido pela busca de sabedoria, em vez de ampliá-la para 'gentios'.
- source_word: σοφίαν
  choice: sabedoria
  rationale: Mantém o alcance conceitual do substantivo sem restringi-lo antecipadamente à filosofia.
- source_word: ζητοῦσιν
  choice: buscam
  rationale: Expressa com naturalidade a ação contínua indicada pelo presente grego.
