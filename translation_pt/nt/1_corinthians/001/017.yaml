id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: pt
  text: Pois o Messias não me enviou para batizar, mas para anunciar as boas-novas — não com sabedoria de palavras[a], para que a cruz do Messias não seja esvaziada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com eloquência”; mais literalmente, “com sabedoria de palavra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não seja anulada” ou “não seja esvaziada de seu poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: o Messias / do Messias
  rationale: Traduz Χριστός como título significativo, de acordo com seu sentido, e mantém a mesma escolha nas duas ocorrências.
- source_word: βαπτίζειν
  choice: batizar
  rationale: Termo consagrado, preciso e natural em português, sem restringir o sentido a uma explicação específica do rito.
- source_word: εὐαγγελίζεσθαι
  choice: anunciar as boas-novas
  rationale: Expressa de modo claro e atual o ato de comunicar a boa notícia, preservando o valor verbal do grego.
- source_word: σοφίᾳ λόγου
  choice: com sabedoria de palavras
  rationale: Mantém a formulação relativamente concreta e ambígua do grego, que pode aludir à habilidade retórica ou eloquência.
- source_word: κενωθῇ
  choice: seja esvaziada
  rationale: Preserva a metáfora e a voz passiva do grego, sem acrescentar no texto principal o complemento interpretativo 'de seu poder'.
- source_word: σταυρὸς
  choice: a cruz
  rationale: Equivalente direto, natural e teologicamente adequado no contexto paulino.
theological_decisions:
- issue: Tradução de Χριστός como título ou forma tradicional transliterada
  choice: Messias
  alternative: Cristo
  rationale: A tradução explicita o valor titular de Χριστός sem tratá-lo apenas como nome próprio; a alternativa tradicional permanece possível.
- issue: Sentido do esvaziamento da cruz
  choice: não seja esvaziada
  alternative: não seja privada de seu poder / não perca o efeito
  rationale: A redação principal conserva a metáfora aberta de Paulo e evita resolver silenciosamente se o foco recai sobre poder, conteúdo ou eficácia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção adversativa e a metáfora final foram preservadas; 'boas-novas' torna εὐαγγελίζεσθαι transparente sem recorrer a vocabulário excessivamente eclesiástico.
