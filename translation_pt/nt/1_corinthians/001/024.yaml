id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: pt
  text: Mas, para os que são chamados, tanto judeus como gregos, o Messias[a] é o poder de Deus e a sabedoria de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: o Cristo.'
    reason: Alternativa lexical tradicional para Χριστόν.
lexical_decisions:
- source_word: κλητοῖς
  choice: os que são chamados
  rationale: O adjetivo substantivado designa as pessoas caracterizadas pelo chamado; a formulação preserva seu sentido verbal e é natural em português.
- source_word: Ἰουδαίοις
  choice: judeus
  rationale: No contraste paulino com Ἕλληνες, o termo tem sentido etnorreligioso, bem expresso por «judeus».
- source_word: Ἕλλησιν
  choice: gregos
  rationale: Mantém o termo explícito do texto grego e o conhecido par paulino «judeus e gregos», sem ampliá-lo interpretativamente para «gentios».
- source_word: Χριστόν
  choice: o Messias
  rationale: Traduz o conteúdo titular de Χριστός, em vez de apenas transliterá-lo; o artigo é exigido pelo uso natural do título em português.
- source_word: θεοῦ δύναμιν
  choice: o poder de Deus
  rationale: Preserva de modo claro e formal a construção genitiva e o paralelismo da frase.
- source_word: θεοῦ σοφίαν
  choice: a sabedoria de Deus
  rationale: Preserva a repetição enfática de θεοῦ e o paralelismo com «o poder de Deus».
- source_word: relação predicativa sem cópula explícita
  choice: o Messias é o poder de Deus e a sabedoria de Deus
  rationale: A oração grega é elíptica e depende do contexto anterior; inserir «é» explicita em português a relação predicativa sem acrescentar uma interpretação estranha ao texto.
theological_decisions:
- issue: Tradução do título cristológico Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, Χριστός conserva força titular; «Messias» comunica seu significado. A alternativa tradicional «Cristo» é registrada em nota sem alterar a afirmação cristológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantiveram-se o contraste «judeus e gregos», a repetição «de Deus» e a tensão predicativa do original.
