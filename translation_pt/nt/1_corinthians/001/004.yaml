  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: pt
  text: Dou sempre graças ao meu Deus por vocês, por causa da graça de Deus que lhes foi dada no Messias Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”.'
