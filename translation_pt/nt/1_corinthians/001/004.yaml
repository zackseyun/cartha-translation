lexical_decisions:
- source_word: Εὐχαριστῶ τῷ θεῷ μου
  choice: Dou graças ao meu Deus
  rationale: A expressão portuguesa “dar graças a Deus” reproduz naturalmente o verbo de ação de graças e o dativo grego, mantendo também o possessivo explícito μου (“meu”).
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente direto e corrente, que preserva a ampla força temporal do advérbio.
- source_word: περὶ ὑμῶν
  choice: por vocês
  rationale: Em uma fórmula de ação de graças, περί com o genitivo indica aqueles a respeito de quem ou em favor de quem Paulo agradece; “por vocês” é a forma mais natural em português.
- source_word: ἐπὶ τῇ χάριτι τοῦ θεοῦ
  choice: por causa da graça de Deus
  rationale: ἐπί com o dativo expressa aqui a base ou o motivo da ação de graças. “Por causa de” comunica essa relação causal sem tornar a frase pesada, enquanto “de Deus” preserva a amplitude do genitivo.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: que lhes foi dada
  rationale: Mantém a voz passiva do particípio de δίδωμι e Deus como doador implícito. “Lhes” é conciso e natural, retomando “vocês”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός pelo título “Messias” e conserva a ordem do grego. A contração “no” expressa naturalmente ἐν + artigo conceitualmente suprido em português; a alternativa tradicional é registrada em nota.
theological_decisions:
- issue: Valor de Χριστός em ἐν Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução principal torna explícito o sentido titular de Χριστός sem acrescentar uma interpretação denominacional. A forma tradicional e lexicalmente possível “Cristo Jesus” é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa. “Dou graças” mantém o caráter paulino de ação de graças; “por causa da” esclarece com naturalidade a base do agradecimento. A colocação de “sempre” após o verbo evita rigidez sem alterar seu alcance.
