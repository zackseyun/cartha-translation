  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: pt
  text: Pois, meus irmãos[a], fui informado a respeito de vocês, por pessoas ligadas a Cloé, de que há conflitos entre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e minhas irmãs”. O grego diz “irmãos” e pode dirigir-se de modo inclusivo a toda a comunidade de fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: fui informado
  rationale: Expressa naturalmente em português o passivo pelo qual a informação foi levada ao conhecimento de Paulo.
- source_word: γάρ
  choice: Pois
  rationale: Preserva a ligação explicativa com a exortação anterior.
- source_word: περὶ ὑμῶν
  choice: a respeito de vocês
  rationale: Equivalente contemporâneo e claro da locução preposicional, sem rigidez desnecessária.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Mantém a forma masculina plural do grego; o provável alcance inclusivo à comunidade inteira é indicado em nota.
- source_word: ὑπὸ τῶν Χλόης
  choice: por pessoas ligadas a Cloe
  rationale: Traduz a associação com Cloe sem especificar indevidamente que se tratava necessariamente de familiares ou membros de sua casa.
- source_word: ἔριδες
  choice: conflitos
  rationale: Denota disputas e contendas interpessoais; evita confundir o termo com a ideia mais ampla de divisões no contexto.
- source_word: ἐν ὑμῖν εἰσιν
  choice: há ... entre vocês
  rationale: Reproduz a construção existencial de maneira idiomática no português moderno.
theological_decisions:
- issue: Sentido de ἀδελφοί numa igreja composta por homens e mulheres
  choice: meus irmãos
  alternative: meus irmãos e minhas irmãs
  rationale: A tradução principal conserva a forma masculina plural do texto grego, enquanto a nota registra que o vocativo pode incluir toda a comunidade de fé.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pessoas ligadas a Cloe” evita o coloquialismo de “o pessoal de Cloe” e não acrescenta a especificação incerta de “casa” ou “família”.
