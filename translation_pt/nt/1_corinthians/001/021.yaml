reference: 1 Corinthians 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: pt
  text: Visto que, na sabedoria de Deus, o mundo não conheceu a Deus por meio da sabedoria, Deus se agradou de salvar os que creem por meio da loucura da proclamação.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da loucura da pregação”.'
    reason: Registra a leitura alternativa em que κήρυγμα enfatiza o ato ou método de pregar.
  - marker: b
    text: Aqui, “loucura” é a avaliação do mundo sobre a mensagem proclamada.
    reason: Esclarece a ironia contextual de μωρία sem tratar a mensagem como realmente deficiente.
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Pois, visto que
  rationale: Preserva tanto a ligação explicativa de γάρ com o argumento anterior quanto a relação causal ou circunstancial introduzida por ἐπειδή, em português natural.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: na sabedoria de Deus
  rationale: Mantém a ambiguidade de ἐν entre esfera, contexto e possível instrumentalidade, sem especificar além do que o grego permite.
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: o mundo não conheceu
  rationale: Traduz diretamente o aoristo de γινώσκω e conserva a amplitude cognitiva e relacional de “conhecer”; “o mundo” mantém o uso paulino representativo.
- source_word: διὰ τῆς σοφίας
  choice: por meio da sabedoria
  rationale: Expressa com clareza o valor de meio de διά com o genitivo sem acrescentar que se trata especificamente da sabedoria humana, embora o contexto aponte nessa direção.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: Deus se agradou
  rationale: Conserva a ideia de beneplácito ou boa vontade divina, evitando reduzir o verbo a uma simples decisão.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: por meio da loucura da proclamação
  rationale: “Proclamação” preserva melhor que “pregação” a possível referência ao conteúdo anunciado, sem excluir inteiramente o ato de proclamar; “loucura” mantém a ironia do contexto.
- source_word: σῶσαι τοὺς πιστεύοντας
  choice: salvar os que creem
  rationale: Emprega a formulação portuguesa clara e tradicional, preservando o sentido soteriológico de σῴζω e o valor substantivado do particípio presente πιστεύοντας.
theological_decisions:
- issue: Sentido de διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: A expressão aponta principalmente para a mensagem proclamada, considerada loucura pelo mundo, sem excluir totalmente o ato de proclamá-la.
  alternative: A expressão pode ser entendida como “por meio da loucura da pregação”, com ênfase no método ou ato de pregar.
  rationale: κήρυγμα costuma designar aquilo que é proclamado, mas pode evocar a proclamação pública no contexto. O texto principal conserva essa tensão, e as notas esclarecem a alternativa e a perspectiva implícita na palavra “loucura”.
- issue: Força de ἐν em ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: Manter “na sabedoria de Deus”, sem definir se a sabedoria é esfera, ordem ou instrumento.
  alternative: Traduzir “pela sabedoria de Deus”, tornando a expressão explicitamente instrumental.
  rationale: A construção grega admite mais de uma nuance, e o contexto não exige que a tradução resolva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “Pois, visto que” conserva o encadeamento argumentativo, e “proclamação” mantém a ambiguidade relevante entre mensagem e ato público de anunciar.
