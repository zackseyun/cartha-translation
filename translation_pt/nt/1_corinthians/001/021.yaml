  source_fidelity: 'A tradução reproduz com precisão a progressão principal do grego: a incapacidade do mundo de conhecer Deus mediante a sabedoria, no âmbito da sabedoria de Deus, e o beneplácito divino de salvar os que creem mediante aquilo tido por loucura na proclamação. “Na sabedoria de Deus”, “por meio da sabedoria”, “loucura da proclamação” e “salvar os que creem” são escolhas fiéis e preservam as ambiguidades pertinentes.'
  naturalness: A única dificuldade relevante é “Pois, visto que”, que acumula conectores causais de forma pouco natural no português moderno. “Visto que” apresenta com clareza a relação circunstancial-causal de ἐπειδή, enquanto a ligação explicativa de γάρ permanece adequadamente perceptível no encadeamento com o contexto anterior.
  terminology: “Sabedoria”, “proclamação”, “loucura”, “salvar” e “os que creem” são termos claros, dignos e adequados ao vocabulário paulino. “Proclamação” é preferível a restringir κήρυγμα ao ato de pregar. A segunda nota deve esclarecer a avaliação implicada em “loucura” sem reformular a frase como se seu sentido inteiro fosse meramente instrumental.
  issues:
