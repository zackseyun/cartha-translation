source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: pt
  text: E Deus escolheu as coisas de origem humilde do mundo e as coisas desprezadas, as coisas que não são, para reduzir a nada as coisas que são,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para tornar sem efeito as coisas que são”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: coisas de origem humilde
  rationale: Preserva a referência à falta de nascimento nobre ou posição social sem recorrer a termos hoje ambíguos como “baixas” ou “vis”.
- source_word: ἐξουθενημένα
  choice: coisas desprezadas
  rationale: Expressa de modo conciso o estado resultante de terem sido tratadas como sem valor ou com desprezo.
- source_word: τὰ μὴ ὄντα
  choice: as coisas que não são
  rationale: Mantém a formulação deliberadamente forte e abrangente de Paulo, sem reduzi-la no texto principal a uma mera categoria social.
- source_word: τὰ ὄντα
  choice: as coisas que são
  rationale: Conserva o paralelismo e a antítese verbal com “as coisas que não são”.
- source_word: καταργήσῃ
  choice: reduzir a nada
  rationale: Comunica a ideia de tornar ineficaz, destituir de força ou anular, além de reproduzir naturalmente a conexão retórica com “as coisas que não são”.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: É a tradução corrente e natural para o ato deliberado de Deus, em harmonia com a repetição do verbo no contexto.
theological_decisions:
- issue: Se τὰ μὴ ὄντα / τὰ ὄντα deve ser interpretado no texto principal como categorias sociais ou como afirmações ontológicas absolutas.
  choice: 'Preservar o contraste formal: “as coisas que não são” / “as coisas que são”.'
  alternative: 'Explicitar dinamicamente: “os que não são considerados nada” / “os que são considerados importantes”.'
  rationale: O contexto aponta para condição e prestígio perante o mundo, mas a expressão grega é intencionalmente mais ampla e incisiva. A tradução formal conserva tanto a força retórica quanto a possível leitura social, sem resolver a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De origem humilde” explicita o componente de nascimento e posição social de ἀγενῆ. A estrutura repetitiva foi mantida para preservar a cadência e a antítese do grego.
