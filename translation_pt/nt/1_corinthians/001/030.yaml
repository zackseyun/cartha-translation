id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: pt
  text: Mas é dele que vem o fato de vocês estarem no Messias Jesus, o qual se tornou para nós sabedoria da parte de Deus, justiça[a], santificação e redenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão».
    reason: Alternativa lexical para δικαιοσύνη, destacando a qualidade ou condição de ser reto.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: é dele que vem
  rationale: Preserva a ideia de origem ou fonte expressa por ἐξ, indicando que a condição dos fiéis no Messias procede de Deus, em português natural.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a formulação paulina de estar «em» Jesus e traduz Χριστός como o título «Messias», sem explicitar além do texto a natureza dessa união.
- source_word: ἐγενήθη
  choice: se tornou
  rationale: Representa diretamente γίνομαι e exprime aquilo que Jesus veio a ser para os fiéis.
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: para nós sabedoria da parte de Deus
  rationale: Conserva tanto o benefício dirigido a «nós» quanto a origem divina da sabedoria, sem transformar a expressão em paráfrase.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: É o equivalente português tradicional e semanticamente amplo, capaz de abranger a condição justa e a ação salvadora de Deus; «retidão» é registrada como alternativa.
- source_word: ἁγιασμός
  choice: santificação
  rationale: Mantém o substantivo abstrato e sua nuance de consagração ou de tornar santo.
- source_word: ἀπολύτρωσις
  choice: redenção
  rationale: Expressa adequadamente a libertação associada ao termo e preserva o vocabulário teológico paulino corrente.
theological_decisions:
- issue: Relação entre «sabedoria da parte de Deus» e os três substantivos seguintes
  choice: Conservar os quatro termos em sequência, permitindo que justiça, santificação e redenção sejam lidos como explicação da sabedoria ou como elementos coordenados.
  alternative: Marcar os três últimos substantivos explicitamente como uma explicação de «sabedoria», por exemplo com dois-pontos ou travessão.
  rationale: A sintaxe grega admite mais de uma percepção da relação entre os termos. A pontuação simples evita resolver uma ambiguidade teológica e sintática que o original deixa aberta.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural. A construção «é dele que vem o fato de» combina fidelidade à noção de origem com clareza idiomática. «Messias Jesus» preserva o valor titular de Χριστός, embora seja menos convencional que «Cristo Jesus».
