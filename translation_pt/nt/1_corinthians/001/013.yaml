  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: pt
  text: O Messias[a] foi dividido? Foi Paulo crucificado em favor de vocês? Ou vocês foram batizados em nome de Paulo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Cristo foi dividido?”'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para o nome de Paulo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: foi dividido
  rationale: O perfeito passivo apresenta a divisão como um ato consumado com resultado presente. Em português, «foi dividido» preserva de modo natural a força da pergunta retórica; «está dividido» é uma alternativa possível.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: O artigo favorece aqui o valor titular de Χριστός. «O Messias» torna explícito esse sentido, enquanto «o Cristo» permanece uma alternativa tradicional legítima.
- source_word: μὴ
  choice: implícito na pergunta retórica
  rationale: μή indica que se espera resposta negativa. A forma interrogativa comunica isso naturalmente em português, sem acrescentar «por acaso» ou «certamente não».
- source_word: ἐσταυρώθη
  choice: foi crucificado
  rationale: Correspondência direta e clara ao aoristo passivo.
- source_word: ὑπὲρ ὑμῶν
  choice: em favor de vocês
  rationale: Expressa a ação realizada em benefício ou representação dos destinatários sem definir além do necessário a nuance teológica de ὑπέρ.
- source_word: εἰς τὸ ὄνομα
  choice: para o nome
  rationale: «Para» preserva melhor que «em» a direção expressa por εἰς, embora a fórmula portuguesa tradicional seja «em nome de».
- source_word: ἐβαπτίσθητε
  choice: vocês foram batizados
  rationale: Mantém a voz passiva e a força interrogativa do grego em linguagem portuguesa atual.
theological_decisions:
- issue: Tradução de Χριστός na pergunta retórica paulina
  choice: o Messias
  alternative: o Cristo
  rationale: Com o artigo, o uso titular é proeminente. «O Messias» comunica o conteúdo do título, sem excluir em nota a forma tradicional.
- issue: Sentido de εἰς τὸ ὄνομα na linguagem batismal
  choice: para o nome de Paulo
  alternative: em nome de Paulo
  rationale: A opção principal conserva a força direcional e associativa de εἰς sem explicar se se trata especificamente de incorporação, pertencimento ou lealdade. A alternativa registra a expressão portuguesa consagrada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» apropriado à referência plural. A sequência de três perguntas mantém a concisão e a intensidade retórica do original.
