id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: pt
  text: Mas tenham cuidado para que esse direito de vocês não venha, de algum modo, a se tornar uma pedra de tropeço para os fracos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa liberdade de vocês”. A palavra grega pode significar “autoridade”, “direito” ou “liberdade”; aqui se refere à liberdade que alguns fiéis reivindicavam para comer alimentos associados aos ídolos.
    reason: lexical_alternative
  - marker: b
    text: “Os fracos” são aqui aqueles cuja consciência é fraca nessa questão.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: tenham cuidado
  rationale: O imperativo pede vigilância. A formulação é natural em português moderno e mantém a força de advertência.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição levemente contrastiva para a advertência de Paulo.
- source_word: μή πως
  choice: para que ... não venha, de algum modo
  rationale: Expressa a precaução negativa diante de um resultado possível, conservando a nuance de possibilidade.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: esse direito de vocês
  rationale: No contexto, refere-se à prerrogativa ou liberdade reivindicada por alguns para comer alimentos ligados aos ídolos. “Direito” comunica isso claramente, sem reduzir toda a amplitude lexical de ἐξουσία, registrada em nota.
- source_word: πρόσκομμα
  choice: uma pedra de tropeço
  rationale: Preserva a metáfora de algo que leva outra pessoa a cair moral ou espiritualmente e corresponde ao uso paulino.
- source_word: γένηται
  choice: venha ... a se tornar
  rationale: Reproduz de modo idiomático o resultado possível indicado pelo subjuntivo na construção de precaução.
- source_word: τοῖς ἀσθενέσιν
  choice: para os fracos
  rationale: Mantém a expressão concisa do grego; no capítulo, ela designa pessoas cuja consciência é fraca nessa questão.
theological_decisions:
- issue: Sentido de ἐξουσία no contexto
  choice: A prerrogativa ou o direito reivindicado pelos coríntios quanto a alimentos associados aos ídolos.
  alternative: Autoridade ou poder em sentido mais amplo; ou “liberdade”.
  rationale: O contexto imediato trata da conduta de quem entende ter liberdade para comer. “Direito” comunica a questão ética concreta sem introduzir uma ideia de autoridade institucional.
- issue: Sentido de τοῖς ἀσθενέσιν
  choice: Pessoas fracas na consciência quanto a essa questão.
  alternative: Pessoas fracas em sentido geral ou físico.
  rationale: O capítulo identifica a fraqueza com a consciência vulnerável. O texto principal preserva a expressão breve, enquanto a nota esclarece seu referente contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e preserva a metáfora tradicional “pedra de tropeço”, esclarecendo em notas as ambiguidades lexical e contextual.
