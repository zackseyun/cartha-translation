id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: pt
  text: E assim, pecando dessa maneira contra os irmãos[a] e ferindo a consciência fraca deles, vocês pecam contra o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «irmãos» se refere aos demais fiéis e pode incluir tanto homens como mulheres.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Cristo». O termo grego é Χριστός, título que significa «Messias».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: E assim
  rationale: δέ faz uma ligação leve com o argumento anterior, enquanto οὕτως retoma a maneira de agir já descrita; «E assim» preserva a progressão natural do raciocínio.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: pecando dessa maneira contra os irmãos
  rationale: O particípio indica a maneira ou circunstância da ação principal, e εἰς com ἁμαρτάνω tem sentido direcionado e hostil, portanto «contra». A posição de «dessa maneira» junto de «pecando» explicita sua ligação com o particípio.
- source_word: τύπτοντες
  choice: ferindo
  rationale: O verbo tem imagem concreta de golpear, mas aqui é metafórico. «Ferindo» mantém a força do dano causado e soa natural em português.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: a consciência fraca deles
  rationale: Mantém o singular distributivo do grego e traduz o particípio ἀσθενοῦσαν de modo adjetival e idiomático.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: vocês pecam contra o Messias
  rationale: εἰς indica novamente direção hostil, e o presente é bem expresso pelo presente simples em português. «Messias» conserva o valor titular de Χριστός.
theological_decisions:
- issue: Abrangência de ἀδελφοὺς no contexto da comunidade
  choice: irmãos
  alternative: irmãos e irmãs; membros da comunidade
  rationale: A forma grega é masculina plural, mas no uso epistolar pode abranger os demais fiéis de ambos os sexos. O texto principal preserva a forma, e a nota esclarece a abrangência contextual.
- issue: Tradução de Χριστόν
  choice: Messias
  alternative: Cristo
  rationale: O título grego Χριστός corresponde a «Messias». A alternativa tradicional «Cristo» é registrada em nota sem apagar o caráter titular do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» torna explícito o sujeito plural grego sem regionalismo excessivo; «consciência fraca deles» preserva o singular distributivo da fonte.
