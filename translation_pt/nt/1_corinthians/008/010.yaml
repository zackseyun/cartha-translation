source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: pt
  text: Pois, se alguém vir você, que tem conhecimento, reclinado à mesa num templo dedicado a um ídolo, acaso a consciência dessa pessoa, que é fraca, não será edificada[a] a ponto de comer alimentos sacrificados a ídolos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será encorajada” ou “ganhará coragem”. O grego diz literalmente “será edificada”, empregando a linguagem habitual de Paulo sobre edificação, possivelmente com ironia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a advertência anterior e o fluxo do argumento.
- source_word: ἐὰν ... τις ἴδῃ
  choice: se alguém vir
  rationale: Expressa naturalmente em português a condição hipotética formada por ἐὰν com o subjuntivo aoristo.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: você, que tem conhecimento
  rationale: Conserva a caracterização enfática do destinatário e o termo temático “conhecimento”, sem rigidez desnecessária.
- source_word: ἐν εἰδωλείῳ
  choice: num templo de ídolo
  rationale: Identifica de modo conciso o recinto cultual associado a um ídolo.
- source_word: κατακείμενον
  choice: reclinado à mesa
  rationale: Preserva a imagem concreta da postura adotada durante a refeição e explicita naturalmente o contexto em português.
- source_word: οὐχὶ
  choice: acaso ... não
  rationale: Marca uma pergunta retórica que espera resposta afirmativa.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: a consciência dessa pessoa, que é fraca
  rationale: O masculino ἀσθενοῦς retoma a pessoa que observa; a formulação evita atribuir gramaticalmente a fraqueza apenas à consciência.
- source_word: οἰκοδομηθήσεται
  choice: será edificada
  rationale: Retém a metáfora usual de Paulo e sua provável ironia neste contexto, em que a suposta edificação conduz a uma ação prejudicial.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: a ponto de comer alimentos sacrificados a ídolos
  rationale: Comunica o resultado ou a tendência da construção grega e preserva o sentido cultual de εἰδωλόθυτα.
theological_decisions:
- issue: Sentido de οἰκοδομηθήσεται no contexto de uma imitação espiritualmente prejudicial
  choice: será edificada
  alternative: será encorajada; ganhará coragem
  rationale: A tradução mantém a linguagem paulina de edificação e a tensão irônica do texto, em vez de resolver a metáfora de forma interpretativa. A nota registra o sentido idiomático possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” corresponde ao singular σέ; “reclinado à mesa” preserva a imagem antiga sem soar obscuro. A construção “a consciência dessa pessoa, que é fraca” mantém a referência gramatical da fraqueza à pessoa observadora.
