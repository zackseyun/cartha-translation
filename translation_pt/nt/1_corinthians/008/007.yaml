  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: pt
  text: Mas nem todos têm esse conhecimento. Alguns, por causa de sua ligação anterior com o ídolo, que persiste até agora[a][b], comem o alimento como sacrificado a um ídolo; e a consciência deles, sendo fraca, é contaminada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “por causa do costume, até agora, com o ídolo”. A construção grega é difícil; no contexto, indica a influência persistente da ligação anterior dessas pessoas com o culto aos ídolos.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “consciência” em vez de “costume” nesta expressão, produzindo um sentido como “por causa da consciência que até agora têm do ídolo”. O texto principal segue o SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: conhecimento
  rationale: Mantém o sentido paulino usual e a ligação verbal com o contexto imediato, no qual se afirma saber que o ídolo nada é.
- source_word: συνήθεια
  choice: familiaridade
  rationale: Expressa uma relação habitual e arraigada com o culto ao ídolo, sem limitar o termo a um costume genérico nem adotar a variante textual que traz a ideia de consciência.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: que ainda têm com o ídolo
  rationale: Representa de modo natural tanto a relação com o ídolo quanto a força temporal de ἕως ἄρτι, indicando que essa influência persiste até o presente.
- source_word: εἰδωλόθυτον
  choice: algo sacrificado a um ídolo
  rationale: Preserva a referência cultual do termo e indica como essas pessoas consideram o alimento, sem afirmar que o ídolo seja uma divindade real.
- source_word: συνείδησις
  choice: consciência
  rationale: Equivalente corrente no vocabulário ético de Paulo para a percepção moral da pessoa.
- source_word: ἀσθενής
  choice: fraca
  rationale: Conserva o termo característico usado por Paulo neste capítulo para uma consciência sem firmeza quanto a essa questão.
- source_word: μολύνεται
  choice: fica contaminada
  rationale: Transmite o resultado passivo de mancha ou contaminação moral com linguagem atual e clara.
theological_decisions:
- issue: Como descrever o alimento ligado ao culto idolátrico sem sugerir que os ídolos sejam deuses reais
  choice: comem esse alimento como algo sacrificado a um ídolo
  alternative: comem carne sacrificada a ídolos
  rationale: 'A formulação preserva a perspectiva daqueles que ainda atribuem significado cultual ao alimento e mantém a tensão do capítulo: o ídolo nada é, mas comer nessas condições pode contaminar uma consciência fraca.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, enquanto a ambiguidade da construção grega foi preservada e explicada em nota.
