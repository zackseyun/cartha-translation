reference: 1 Corinthians 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: pt
  text: Pois, pelo teu conhecimento, aquele que é fraco é destruído — o irmão por quem o Messias morreu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «é arruinado» ou «vai à perdição». O verbo grego pode indicar ruína ou destruição grave; o texto não determina por si só se Paulo se refere à devastação espiritual nesta vida, à destruição escatológica ou a ambas.
    reason: alternative_reading
  - marker: b
    text: Aqui, «irmão» significa alguém da mesma fé; no contexto, a aplicação pode incluir um irmão ou uma irmã.
    reason: lexical_alternative
  - marker: c
    text: 'Grego: «Cristo»; traduzido aqui por «Messias» porque Χριστός funciona como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: é destruído
  rationale: Reproduz diretamente a força grave do presente passivo/médio sem determinar se a destruição é espiritual e temporal, escatológica, ou ambas; a nota preserva essa amplitude.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação da advertência anterior de maneira concisa e natural em português.
- source_word: ὁ ἀσθενῶν
  choice: aquele que é fraco
  rationale: Traduz o particípio substantivado no singular sem antecipar «irmão», que aparece separadamente no texto grego.
- source_word: ἐν τῇ σῇ γνώσει
  choice: por causa do teu conhecimento
  rationale: Expressa o valor causal ou instrumental de ἐν neste contexto e torna clara a ironia de que o conhecimento alegado contribui para a destruição do fraco.
- source_word: γνῶσις
  choice: conhecimento
  rationale: Mantém a terminologia recorrente no contexto imediato de 1 Coríntios 8.
- source_word: ὁ ἀδελφός
  choice: o irmão
  rationale: Preserva o masculino singular do grego e identifica aquele que é fraco como membro da comunidade de fé; a possível abrangência da aplicação é esclarecida em nota.
- source_word: δι’ ὃν
  choice: por quem
  rationale: Expressa de modo idiomático que o irmão é aquele em favor de quem o Messias morreu.
- source_word: Χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona como título e ressalta a identidade e a obra redentora daquele que morreu.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O pretérito perfeito simples traduz naturalmente o aoristo e apresenta o evento de forma direta.
theological_decisions:
- issue: Se ἀπόλλυται implica necessariamente a perdição eterna de um verdadeiro crente
  choice: é destruído
  alternative: vai à perdição; é arruinado
  rationale: A tradução conserva a linguagem forte do verbo sem decidir uma controvérsia sobre apostasia e perseverança. A nota explicita que o contexto admite discussão quanto ao alcance temporal ou escatológico da destruição.
- issue: Se ἀδελφός deve ser tornado neutro quanto ao gênero no texto principal
  choice: o irmão
  alternative: a pessoa crente; o irmão ou a irmã
  rationale: O texto principal preserva o masculino singular da fonte, enquanto a nota esclarece que se trata de alguém da mesma fé e que a aplicação pode abranger irmãos e irmãs.
- issue: Como traduzir Χριστός nesta ocorrência
  choice: o Messias
  alternative: Cristo
  rationale: O termo funciona como título neste enunciado e «Messias» comunica esse valor sem transformar a expressão em mero nome próprio.
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com formas de segunda pessoa singular («teu») coerentes com o referente individual do grego. O travessão preserva a aposição enfática final. A formulação evita tanto suavizar a gravidade de ἀπόλλυται como resolver sua tensão teológica.
