  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: pt
  text: Mas a comida não nos aproximará de Deus[a], pois nem, se comemos, ficamos em vantagem, nem, se não comemos, ficamos em desvantagem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: não nos tornará mais aceitáveis diante de Deus; ou: não nos apresentará diante de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: se comemos, não abundamos; e, se não comemos, não ficamos em falta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: a comida
  rationale: Termo amplo para alimento, sem restringir o sentido a carne ou a uma refeição específica.
- source_word: δὲ
  choice: porém
  rationale: Marca o contraste moderado com a discussão anterior e soa natural nesta posição em português.
- source_word: παραστήσει τῷ θεῷ
  choice: nos apresentará diante de Deus
  rationale: Conserva a imagem verbal e o futuro do grego, sem decidir de modo definitivo se a ideia é apresentação, aproximação ou aceitação perante Deus.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: pois, se comemos, não ficamos em vantagem
  rationale: Neste contexto, περισσεύομεν indica ter ganho, benefício ou vantagem, e não simplesmente abundância material.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: e, se não comemos, não ficamos em desvantagem
  rationale: Expressa de maneira clara e paralela a ausência de deficiência ou perda indicada por ὑστερούμεθα.
theological_decisions:
- issue: Se παραστήσει descreve apresentação diante de Deus, aproximação a Deus ou melhora da condição espiritual
  choice: Manter a formulação imagética “nos apresentará diante de Deus” no texto e registrar a leitura relacional em nota.
  alternative: “não nos tornará mais aceitáveis diante de Deus” ou “não nos aproximará de Deus”
  rationale: O contexto sustenta a ideia de que comer ou abster-se não produz vantagem espiritual por si só, mas o verbo grego permite uma formulação mais concreta. A tradução evita transformar uma implicação contextual em definição exclusiva.
- issue: Natureza da vantagem ou desvantagem expressa por περισσεύομεν e ὑστερούμεθα
  choice: “não ficamos em vantagem” e “não ficamos em desvantagem”
  alternative: “nada ganhamos” e “nada perdemos”; literalmente, “não abundamos” e “não temos falta”
  rationale: A formulação comunica a oposição contextual sem especificar indevidamente se a vantagem é moral, ritual, escatológica ou de outra natureza.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível no Brasil e compreensível internacionalmente. O paralelismo dos dois condicionais foi preservado, enquanto expressões excessivamente literais e pouco naturais foram esclarecidas em nota.
