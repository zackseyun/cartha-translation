id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: pt
  text: Por isso, se algum alimento leva meu irmão a tropeçar, jamais comerei carne, para não levar meu irmão a tropeçar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão enfática introduzida pelo conectivo grego.
- source_word: βρῶμα
  choice: algum alimento
  rationale: Mantém o sentido genérico de comida ou alimento, em contraste com o termo mais específico para carne na oração seguinte.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: leva ... a tropeçar
  rationale: Preserva a metáfora de causar queda moral ou espiritual, sem reduzi-la a mero incômodo ou ofensa emocional.
- source_word: οὐ μὴ φάγω ... εἰς τὸν αἰῶνα
  choice: jamais comerei
  rationale: A combinação de οὐ μή com εἰς τὸν αἰῶνα constitui uma negação futura fortemente enfática; “jamais” comunica em português tanto a certeza quanto a duração ilimitada.
- source_word: κρέα
  choice: carne
  rationale: Traduz o termo específico em contraste com βρῶμα, que designa alimento em geral.
theological_decisions:
- issue: Natureza do dano expresso por σκανδαλίζω
  choice: levar a tropeçar
  alternative: ofender
  rationale: “Tropeçar” conserva a possibilidade de queda moral ou espiritual presente na metáfora grega; “ofender” poderia sugerir apenas ferir sensibilidades.
- issue: Força e duração da renúncia de Paulo
  choice: jamais comerei carne
  alternative: nunca mais comerei carne
  rationale: “Jamais” reproduz de maneira concisa a negação enfática οὐ μή e a expressão εἰς τὸν αἰῶνα, sem enfraquecer o caráter absoluto da declaração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “meu irmão” e “levar ... a tropeçar” foi mantida para refletir a estrutura retórica do original.
