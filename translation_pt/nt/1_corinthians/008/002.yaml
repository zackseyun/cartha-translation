base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: pt
  text: Se alguém pensa que sabe alguma coisa[a], ainda não sabe como deve saber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se alguém pensa ter chegado a conhecer alguma coisa, ainda não sabe da maneira como deve saber”.'
    reason: Alternativa lexical e aspectual para o perfeito ἐγνωκέναι e explicitação possível do valor modal de καθὼς.
lexical_decisions:
- source_word: εἴ τις
  choice: Se alguém
  rationale: Expressa de modo natural a condição e o caráter genérico do pronome indefinido.
- source_word: δοκεῖ
  choice: pensa
  rationale: Neste contexto, indica a avaliação subjetiva que alguém faz de seu próprio conhecimento.
- source_word: ἐγνωκέναι τι
  choice: sabe alguma coisa
  rationale: O perfeito apresenta a alegação de possuir conhecimento; o presente português é idiomático. A nota registra a nuance possível de conhecimento adquirido.
- source_word: οὔπω ἔγνω
  choice: ainda não conhece
  rationale: Preserva οὔπω e distingue com naturalidade, em português, a segunda ocorrência de γινώσκω sem impor uma diferença lexical absoluta.
- source_word: καθὼς δεῖ γνῶναι
  choice: como deve conhecer
  rationale: Conserva a dimensão modal ou normativa da expressão grega sem explicar em que consiste esse modo adequado.
theological_decisions:
- issue: Referência genérica singular
  choice: alguém, sem pronome de gênero
  alternative: ele
  rationale: O grego τις tem alcance genérico. O português permite manter o singular sem introduzir uma referência exclusivamente masculina.
- issue: Natureza da crítica de Paulo
  choice: conhecimento inadequado quanto ao modo ou padrão
  alternative: negação absoluta de todo conhecimento humano
  rationale: A oração não nega simplesmente que a pessoa conheça; afirma que ela ainda não conhece como deve, preservando a tensão epistemológica do texto.
- issue: Relação entre as formas de γινώσκω
  choice: sabe / conhece
  alternative: veio a conhecer / conheceu
  rationale: A variação é idiomática em português e a nota explicita uma tradução mais aspectualmente marcada, sem transformar a variação portuguesa em distinção teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação mantém a concisão e a repetição conceitual do grego, usando “saber” e “conhecer” conforme a idiomaticidade portuguesa.
