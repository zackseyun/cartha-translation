id: 1CO.8.3
reference: 1 Corinthians 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: pt
  text: Mas, se alguém ama a Deus, esse é conhecido por ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é reconhecido por ele” ou “tem sido conhecido por ele”. O perfeito passivo grego pode sugerir o estado duradouro de ser conhecido por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Mas, se
  rationale: A combinação introduz uma condição com leve contraste em relação à afirmação anterior; “Mas, se” preserva ambos de modo natural.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido tem sentido genérico e inclusivo; “alguém” é claro e corrente em português.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: O presente do indicativo é expresso diretamente por “ama”, preservando o sentido verbal simples e contínuo no contexto.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Em português, o objeto direto pessoal normalmente recebe a preposição “a”; “Deus” permanece definido sem artigo.
- source_word: οὗτος
  choice: esse
  rationale: O demonstrativo retoma com certa ênfase a pessoa recém-descrita. “Esse” conserva essa retomada melhor que um pronome pessoal simples.
- source_word: ἔγνωσται
  choice: é conhecido
  rationale: 'O perfeito passivo indica um estado presente resultante: a pessoa está conhecida por Deus. “É conhecido” é idiomático e mantém a voz passiva e a amplitude semântica.'
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: O pronome retoma naturalmente Deus e preserva a coesão pronominal do grego.
theological_decisions:
- issue: Sentido do conhecimento divino na afirmação de Paulo
  choice: é conhecido por ele
  alternative: é reconhecido por ele; tem sido conhecido por ele; é aprovado por ele
  rationale: Com Deus como agente, γινώσκω pode envolver conhecimento relacional, reconhecimento ou aprovação, mas o texto não obriga a escolher uma dessas especificações. A formulação ampla preserva a tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação mantém a concisão e a estrutura condicional do grego; o demonstrativo “esse” preserva sua ênfase sem recorrer a linguagem excessivamente literal.
