source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: pt
  text: Pois, mesmo que existam os chamados deuses[a], quer no céu, quer na terra — como de fato existem muitos deuses e muitos senhores[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deuses assim chamados”. O particípio grego pode significar “chamados” ou, no contexto, “assim chamados”; esta última formulação preserva o distanciamento de Paulo em relação a essas supostas divindades.'
    reason: lexical_alternative
  - marker: b
    text: “Senhores” traduz o plural da mesma palavra grega frequentemente vertida por “Senhor”. Aqui se refere aos muitos seres ou poderes reconhecidos por esse título, em contraste com o único Senhor do versículo 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação ligada ao versículo anterior; em português, “Pois” comunica naturalmente a força explicativa de γάρ, enquanto a ênfase de καί aparece na construção concessiva seguinte.
- source_word: εἴπερ
  choice: ainda que
  rationale: No contexto, introduz uma concessão argumentativa. “Ainda que” preserva essa força sem afirmar diretamente a realidade divina dos seres mencionados.
- source_word: λεγόμενοι θεοὶ
  choice: os chamados deuses
  rationale: Mantém a possibilidade lexical de “chamados” e, no contexto, expressa certa distância em relação à designação, sem transformar a tradução em interpretação excessivamente explícita.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: seja no céu, seja na terra
  rationale: Reproduz com clareza e naturalidade a estrutura correlativa e o alcance cosmológico da expressão grega.
- source_word: ὥσπερ
  choice: como de fato
  rationale: 'Expressa o valor confirmatório da oração parentética: há, de fato, muitos seres ou poderes reconhecidos por tais títulos.'
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: muitos “deuses” e muitos “senhores”
  rationale: Preserva a repetição enfática e a correspondência lexical com “Deus” e “Senhor” no versículo 6; as aspas sinalizam que são designações atribuídas, não equivalência com o único Deus e o único Senhor.
theological_decisions:
- issue: Distanciamento retórico de Paulo em relação às divindades pagãs
  choice: Traduzir λεγόμενοι θεοὶ por “os chamados deuses”, com nota explicando “os assim chamados deuses”
  alternative: “os supostos deuses”
  rationale: A formulação principal preserva a ambiguidade lexical do particípio, que pode indicar simplesmente como são designados, enquanto a nota esclarece o distanciamento sugerido pelo contexto monoteísta dos versículos 4–6.
- issue: Sentido de θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: Manter “deuses” e “senhores” em minúsculas e entre aspas
  alternative: “divindades” e “dominadores”
  rationale: Isso conserva a tensão do texto, que reconhece a multiplicidade de seres ou poderes assim nomeados sem lhes atribuir a mesma condição do único Deus e do único Senhor do versículo 6.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação mantém o versículo como oração aberta, em continuidade sintática com o versículo 6. As aspas em “deuses” e “senhores” tornam explícito o caráter de títulos reconhecidos sem resolver indevidamente a questão da natureza desses seres.
