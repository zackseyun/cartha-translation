id: 1CO.8.4
reference: 1 Corinthians 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: pt
  text: Portanto, quanto ao ato de comer alimentos sacrificados aos ídolos, sabemos que um ídolo nada é no mundo[a] e que não há Deus senão um só[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um ídolo não tem existência real no mundo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não há deus senão um só”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: ato de comer
  rationale: O substantivo designa o ato de comer, não propriamente o alimento; esta formulação preserva seu sentido verbal na construção com περὶ.
- source_word: εἰδωλοθύτων
  choice: alimentos sacrificados aos ídolos
  rationale: O termo abrange alimentos ligados a sacrifícios pagãos e não deve ser limitado apenas a carne.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Reproduz de modo direto o verbo de forma perfeita com sentido presente e mantém o apelo de Paulo a um conhecimento compartilhado.
- source_word: οὐδὲν εἴδωλον
  choice: um ídolo nada é
  rationale: Preserva a formulação compacta e enfática do grego, indicando a nulidade ou falta de realidade do ídolo, sem desenvolver além do texto.
- source_word: ἐν κόσμῳ
  choice: no mundo
  rationale: É o equivalente corrente de κόσμος neste contexto e situa a afirmação na esfera da realidade criada.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: não há Deus senão um só
  rationale: Expressa com clareza a afirmação monoteísta exclusiva. A nota registra a possível leitura com substantivo comum, sem eliminar a ambiguidade gráfica do grego.
- source_word: οὖν
  choice: Portanto
  rationale: Marca explicitamente a transição inferencial em relação ao argumento precedente.
theological_decisions:
- issue: A afirmação de Paulo sobre os ídolos e a unicidade de Deus
  choice: Apresentar o ídolo como nada no mundo e afirmar que não há Deus senão um só.
  alternative: Explicitar que o ídolo não tem existência real e escrever “deus” com inicial minúscula.
  rationale: A tradução mantém a força das duas afirmações sem acrescentar uma formulação metafísica ou doutrinária posterior; as alternativas legítimas são preservadas em notas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quanto ao ato de comer” conserva a precisão do substantivo grego sem soar excessivamente técnico; “um ídolo nada é” retém deliberadamente a concisão e a tensão da formulação original.
