id: 1CO.8.1
reference: 1 Corinthians 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: pt
  text: Quanto aos alimentos sacrificados aos ídolos[a], sabemos que todos temos conhecimento[b]. O conhecimento incha, mas o amor edifica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às carnes oferecidas aos ídolos” ou “às coisas sacrificadas aos ídolos”.
    reason: lexical_alternative
  - marker: b
    text: 'Paulo talvez esteja retomando aqui um lema dos coríntios: “todos temos conhecimento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz naturalmente um novo assunto na argumentação, preservando a função de transição sem acrescentar um advérbio temporal inexistente no grego.
- source_word: τῶν εἰδωλοθύτων
  choice: aos alimentos sacrificados aos ídolos
  rationale: O substantivo designa coisas oferecidas em sacrifício aos ídolos, especialmente comida neste contexto. “Alimentos” é claro e não restringe indevidamente o referente apenas à carne.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Reproduz de modo direto e idiomático o verbo grego, cuja forma perfeita tem sentido presente aqui.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: que todos temos conhecimento
  rationale: Mantém o alcance não qualificado de πάντες e a repetição lexical de γνῶσις, sem decidir no texto principal se a frase é uma afirmação compartilhada ou um lema coríntio.
- source_word: ἡ γνῶσις
  choice: O conhecimento
  rationale: Preserva a ligação lexical com “conhecimento” na oração anterior e apresenta o substantivo abstrato de maneira natural em português.
- source_word: φυσιοῖ
  choice: incha
  rationale: Conserva a metáfora vívida de inflar ou tornar inchado, com a implicação contextual de orgulho, em vez de substituí-la por uma explicação.
- source_word: ἡ δὲ ἀγάπη
  choice: mas o amor
  rationale: Expressa a oposição marcada por δέ e traduz ἀγάπη pelo termo português corrente e teologicamente não sectário.
- source_word: οἰκοδομεῖ
  choice: edifica
  rationale: Mantém a metáfora de construção usada por Paulo. “Edifica” é corrente no registro bíblico português e continua compreensível para leitores modernos.
theological_decisions:
- issue: Se “todos temos conhecimento” é uma afirmação direta de Paulo ou a retomada de um lema dos coríntios
  choice: Manter a frase sem aspas no texto principal e registrar a possibilidade retórica em nota
  alternative: Colocar “todos temos conhecimento” entre aspas como citação explícita de um lema coríntio
  rationale: O grego não contém um marcador explícito de citação. A redação preserva a ambiguidade e evita transformar uma possibilidade contextual em certeza textual.
- issue: Sentido de φυσιοῖ no contraste entre conhecimento e amor
  choice: Preservar a metáfora com “incha”
  alternative: Explicitar como “enche de orgulho” ou “torna arrogante”
  rationale: A imagem de inflação contrasta deliberadamente com a imagem construtiva de οἰκοδομεῖ. Preservar ambas mantém a força e a tensão da formulação paulina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Quanto a” evita acrescentar um “agora” temporal; “incha” e “edifica” preservam as metáforas paralelas do original.
