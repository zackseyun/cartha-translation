  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: pt
  text: Contudo, para nós há um só Deus, o Pai, de quem provêm todas as coisas e nós para ele[a], e um só Senhor, Jesus, o Messias[b], por meio de quem existem todas as coisas e nós por meio dele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é concisa: “e nós para ele”. Pode indicar direção, alvo ou finalidade; isto é, os crentes estão orientados para Deus.'
    reason: lexical_alternative
  - marker: b
    text: Ou “Jesus Cristo”. O grego Χριστός pode funcionar como título (“Messias”) ou como uma forma semelhante a nome próprio (“Cristo”).
    reason: alternative_reading
  - marker: c
    text: 'No grego, a última expressão é concisa: “e nós por meio dele”. A construção pode abranger nossa existência, vida ou salvação por meio de Jesus, sem especificar uma dessas nuances. As expressões “de quem” e “por meio de quem” distinguem, respectivamente, fonte e mediação.'
    reason: textual_clarity
lexical_decisions:
- source_word: ἀλλ’
  choice: contudo
  rationale: Expressa o contraste com os muitos chamados deuses e senhores mencionados anteriormente, em português atual e digno.
- source_word: ἡμῖν
  choice: para nós
  rationale: 'O dativo indica referência ou perspectiva: esta é a confissão reconhecida pela comunidade cristã.'
- source_word: εἷς θεὸς ὁ πατήρ
  choice: um só Deus, o Pai
  rationale: Preserva a afirmação numérica e monoteísta e identifica o Pai por meio da aposição definida.
- source_word: ἐξ οὗ τὰ πάντα
  choice: de quem provêm todas as coisas
  rationale: ἐξ indica fonte ou origem. “Provêm” comunica essa relação sem afirmar além do que o texto permite.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: e para quem nós existimos
  rationale: εἰς pode indicar direção, alvo ou finalidade. A formulação natural em português apresenta Deus como o fim para o qual existimos, enquanto a nota registra a concisão e a amplitude do grego.
- source_word: εἷς κύριος
  choice: um só Senhor
  rationale: Mantém o paralelismo confessional com “um só Deus” e conserva o peso cristológico de κύριος.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Neste enunciado confessional, Χριστός pode ser entendido como título. O artigo explicativo em português torna essa função clara sem ocultar a tradução tradicional “Cristo”.
- source_word: δι’ οὗ τὰ πάντα
  choice: por meio de quem existem todas as coisas
  rationale: διά com genitivo indica mediação ou agência. “Por meio de” distingue essa relação daquela expressa por ἐξ, sem reduzi-la a mera causa instrumental.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: e por meio de quem nós existimos
  rationale: Explicita em português o verbo elíptico, mas mantém a afirmação ampla, sem limitá-la à criação, à vida ou à salvação.
theological_decisions:
- issue: Relação entre “um só Deus” e “um só Senhor” na confissão monoteísta
  choice: 'Manter o paralelismo: “um só Deus, o Pai ... e um só Senhor, Jesus, o Messias”.'
  alternative: Atenuar o título “Senhor” ou acrescentar linguagem trinitária posterior.
  rationale: O texto atribui grande peso cristológico a Jesus e, ao mesmo tempo, distingue o Pai e Jesus pelas relações expressas como “de quem”, “para quem” e “por meio de quem”. A tradução conserva essa tensão sem impor uma explicação doutrinária adicional.
- issue: Distinção entre as preposições ἐξ, εἰς e διά
  choice: Traduzir respectivamente por “de quem”, “para quem” e “por meio de quem”.
  alternative: Uniformizar as relações causais ou traduzir εἰς apenas como movimento espacial.
  rationale: 'As preposições apresentam relações distintas: fonte, alvo ou finalidade, e mediação. Preservá-las evita apagar a estrutura teológica do enunciado.'
- issue: Sentido das cláusulas elípticas sobre “nós”
  choice: Fornecer “existimos” no texto e registrar a elipse na nota.
  alternative: Especificar “fomos criados”, “vivemos” ou “somos salvos”.
  rationale: O grego omite o verbo, e o contexto permite mais de uma nuance. “Existimos” produz português inteligível e abrangente sem decidir se Paulo tem em vista somente criação, vida presente ou salvação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é confessional e digno, sem arcaísmos. “Um só” preserva a ênfase numérica; “por meio de” conserva com clareza a mediação expressa por διά. A pontuação mantém as duas partes paralelas da confissão em uma única frase.
