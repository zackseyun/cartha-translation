  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: pt
  text: Alegro-me com a chegada de Estéfanas, Fortunato e Acaico, porque eles supriram o que faltava da parte de vocês[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “compensaram a ausência de vocês”. É provável que Paulo se refira à impossibilidade de os coríntios estarem pessoalmente com ele, e não a uma deficiência moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Alegro-me
  rationale: Preserva a expressão pessoal e direta do presente do indicativo, em registro digno e natural.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui é um conectivo leve; em português, a continuidade pode ser transmitida naturalmente sem uma conjunção explícita, evitando um contraste indevido.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: com a chegada
  rationale: No contexto, παρουσία indica a chegada e presença pessoal dos três homens, sem sentido escatológico.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Estéfanas, Fortunato e Acaico
  rationale: Emprega formas portuguesas tradicionais e reconhecíveis dos nomes próprios.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da alegria de Paulo.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: o que faltava da parte de vocês
  rationale: Mantém a amplitude de ὑστέρημα, sem decidir no texto principal que se trata exclusivamente da ausência física dos coríntios nem sugerir necessariamente deficiência moral.
- source_word: οὗτοι
  choice: eles
  rationale: Retoma de modo natural e inequívoco os três homens recém-nomeados; sua posição antes do verbo preserva uma ênfase moderada.
- source_word: ἀνεπλήρωσαν
  choice: supriram
  rationale: Expressa o ato de preencher ou prover aquilo que faltava, com concisão e proximidade lexical ao grego.
theological_decisions:
- issue: Natureza daquilo que faltava da parte dos coríntios
  choice: 'Preservar no texto a formulação ampla: “o que faltava da parte de vocês”'
  alternative: “compensaram a ausência de vocês”
  rationale: O contexto pode apontar para a impossibilidade de os coríntios estarem pessoalmente com Paulo, mas o grego não explicita “ausência”. A tradução mantém a ambiguidade genuína e a nota apresenta a interpretação contextual provável sem convertê-la em certeza textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção evita uma paráfrase excessiva no texto principal e esclarece na nota a leitura contextual provável.
