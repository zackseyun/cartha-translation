  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: pt
  text: A graça do Senhor Jesus esteja com vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado e semanticamente adequado nas bênçãos paulinas, expressando o favor gracioso e a bênção provenientes do Senhor.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o uso titular e a força cristológica do termo no Novo Testamento, além de soar natural nesta fórmula de bênção.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa estabelecida do nome próprio grego.
- source_word: μεθ’ ὑμῶν
  choice: esteja com vocês
  rationale: Embora a expressão grega seja literalmente «com vocês» e não tenha verbo explícito, «esteja» comunica naturalmente em português o valor optativo da bênção.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Mantém a estrutura genitiva do grego de modo claro e idiomático, sem tornar a ideia de origem mais explícita do que o texto.
theological_decisions:
- issue: Fórmula de bênção elíptica, sem verbo explícito
  choice: 'Suprir «esteja»: «A graça do Senhor Jesus esteja com vocês.»'
  alternative: «A graça do Senhor Jesus com vocês.»
  rationale: Em português, a inclusão do verbo torna a bênção completa e natural, refletindo a força convencional da fórmula grega sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» representa naturalmente o plural ὑμῶν e evita a ambiguidade regional de «vós».
