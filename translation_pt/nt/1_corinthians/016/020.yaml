  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: pt
  text: Todos os irmãos[a] enviam saudações a vocês. Saúdem uns aos outros com um beijo santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todos os irmãos e irmãs enviam saudações a vocês”; aqui, “irmãos” pode referir-se coletivamente aos demais fiéis.'
    reason: lexical_alternative
  - marker: b
    text: O “beijo santo” era uma forma costumeira de saudação entre os fiéis, marcada pela santidade e pela comunhão mútua.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: enviam saudações
  rationale: No contexto epistolar, expressa naturalmente que pessoas ausentes mandam cumprimentos; evita a impressão de uma saudação presencial.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Todos os irmãos
  rationale: Preserva a forma masculina plural do grego, que neste contexto também pode designar coletivamente os demais fiéis; essa abrangência é indicada em nota.
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Traduz diretamente o imperativo e mantém o sentido básico de oferecer uma saudação, de modo natural em português.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: É a formulação recíproca corrente e clara em português.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: com um beijo santo
  rationale: Preserva tanto o gesto concreto quanto sua qualificação como santo, usando uma formulação bíblica digna e compreensível.
theological_decisions:
- issue: Sentido de ἀδελφοί no contexto da congregação
  choice: irmãos
  alternative: irmãos e irmãs; fiéis
  rationale: A tradução principal conserva a forma masculina do texto grego sem negar seu possível uso coletivo para homens e mulheres, esclarecido em nota.
- issue: Natureza do “beijo santo”
  choice: beijo santo
  alternative: beijo sagrado; beijo de santidade
  rationale: A expressão é mantida sem reduzir o mandamento a uma saudação genérica nem impor uma aplicação denominacional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para ὑμᾶς e o imperativo correspondente “saúdem”. As notas foram posicionadas junto às expressões que explicam, corrigindo a associação invertida observada na camada inglesa.
