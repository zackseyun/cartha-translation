  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: pt
  text: para que vocês também se submetam a pessoas como essas e a todo aquele que coopera e trabalha arduamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Mantém de modo natural a força final ou completiva da conjunção, ligando esta exortação ao apelo do versículo anterior.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: Preserva a inclusão enfática dos coríntios sem rigidez estilística.
- source_word: ὑποτάσσησθε
  choice: se submetam
  rationale: Expressa a forma médio-passiva como disposição voluntária de se colocar sob a liderança ou ordem reconhecida, sem acrescentar a ideia de obediência absoluta.
- source_word: τοῖς τοιούτοις
  choice: a pessoas como essas
  rationale: Refere-se à categoria de pessoas exemplificada pela casa de Estéfanas, sem tornar o gênero masculino o foco da expressão.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: a todo aquele que coopera
  rationale: Conserva a força verbal do particípio e a ideia de participação conjunta no trabalho, sem exigir que se explicite um objeto ausente no grego.
- source_word: καὶ κοπιῶντι
  choice: e trabalha arduamente
  rationale: Comunica o esforço intenso expresso por κοπιάω em português atual e claro.
theological_decisions:
- issue: Natureza da submissão ordenada
  choice: Uma exortação à deferência voluntária para com trabalhadores cristãos como os mencionados no contexto.
  alternative: Uma ordem geral de obediência hierárquica irrestrita.
  rationale: O contexto imediato trata da casa de Estéfanas e de todos os que cooperam e se esforçam no trabalho. A tradução preserva a força de ὑποτάσσησθε sem institucionalizar ou absolutizar a submissão além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a relação sintática com o versículo anterior; por isso, começa com letra minúscula. Não são necessárias notas, pois as alternativas relevantes cabem adequadamente no texto principal.
