id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: pt
  text: Pois não quero vê-los agora apenas de passagem[a], porque espero permanecer com vocês por algum tempo, se o Senhor permitir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto estiver de passagem” ou “a caminho”.
    reason: Alternativas lexicais para ἐν παρόδῳ, que descreve uma visita breve durante o trajeto.
lexical_decisions:
- source_word: οὐ θέλω
  choice: não quero
  rationale: Expressa o desejo ou a intenção pessoal de Paulo de modo direto e natural, sem dar à frase um sentido excessivamente formal de volição.
- source_word: ἄρτι
  choice: agora
  rationale: Marca a circunstância presente de maneira concisa e idiomática.
- source_word: ἐν παρόδῳ
  choice: apenas de passagem
  rationale: Comunica uma visita breve durante o trajeto; “apenas” explicita naturalmente o contraste contextual com a permanência mais longa desejada por Paulo.
- source_word: ἰδεῖν
  choice: vê-los
  rationale: Preserva o sentido básico de “ver”, que neste contexto implica encontrar-se com eles ou visitá-los.
- source_word: ἐλπίζω
  choice: espero
  rationale: Mantém a combinação de expectativa e desejo sem transmitir certeza.
- source_word: χρόνον τινά
  choice: por algum tempo
  rationale: Indica uma duração indefinida, mas significativa, em português corrente.
- source_word: ἐπιμεῖναι
  choice: permanecer
  rationale: Preserva o sentido de continuar presente junto aos destinatários e oferece um registro digno e natural.
- source_word: πρὸς ὑμᾶς
  choice: com vocês
  rationale: Com um verbo de permanência, exprime naturalmente a presença e convivência junto aos coríntios.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: se o Senhor permitir
  rationale: Reproduz a condição e a dependência da permissão soberana do Senhor em formulação tradicional e clara.
- source_word: κύριος
  choice: Senhor
  rationale: É a equivalência portuguesa estabelecida e preserva a referência não especificada do texto grego.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter simplesmente “o Senhor”, sem especificar o referente.
  alternative: “o Senhor Jesus” ou “Deus”
  rationale: O grego usa κύριος sem identificação explícita; a tradução preserva essa abertura em vez de resolver além do que o versículo afirma.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. “Vocês” evita regionalismo e corresponde ao plural ὑμᾶς; a redação mantém tom pessoal, claro e digno.
