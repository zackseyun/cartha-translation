  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: pt
  text: Pois uma porta grande e eficaz se abriu para mim[a], e há muitos adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grande e eficaz oportunidade se abriu para mim”. Paulo usa “porta” como metáfora de uma abertura para o ministério.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: porta
  rationale: Mantém a imagem concreta do grego, usada metaforicamente para uma abertura no ministério, sem substituí-la pela interpretação “oportunidade”.
- source_word: γάρ
  choice: pois
  rationale: Introduz de modo natural e conciso a razão dos planos de Paulo mencionados no contexto anterior.
- source_word: μοι
  choice: para mim
  rationale: Expressa com naturalidade a referência ou vantagem pessoal indicada pelo dativo.
- source_word: ἀνέῳγεν
  choice: se abriu
  rationale: É uma formulação idiomática em português que comunica a abertura e seu resultado presente sem explicitar indevidamente o agente.
- source_word: μεγάλη
  choice: grande
  rationale: Preserva tanto a imagem da porta quanto a importância ou amplitude da abertura.
- source_word: ἐνεργής
  choice: eficaz
  rationale: Comunica que essa abertura produz efeito ou fruto, preservando a modificação metafórica de “porta”.
- source_word: ἀντικείμενοι
  choice: adversários
  rationale: O particípio substantivado designa pessoas que se opõem ativamente; “adversários” é conciso, corrente e digno.
- source_word: πολλοί
  choice: muitos
  rationale: Equivalente direto e natural para o sentido quantitativo do termo.
theological_decisions:
- issue: A “porta” como metáfora de uma oportunidade para o ministério
  choice: Manter a metáfora “porta”.
  alternative: Traduzir interpretativamente como “uma grande e eficaz oportunidade se abriu para mim”.
  rationale: O texto grego conserva a imagem da porta, frequente em Paulo para uma abertura de atuação. Mantê-la preserva a linguagem original e evita resolver a metáfora dentro do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a conexão argumentativa; “porta grande e eficaz” preserva a metáfora e a tensão expressiva do original.
