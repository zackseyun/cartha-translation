  source_fidelity: A tradução transmite corretamente Περὶ δέ como transição de assunto (“Quanto a”), identifica Apolo como “o irmão” sem introduzir possessivo no texto principal, preserva a intensidade de πολλὰ παρεκάλεσα (“insisti muito”) e a ênfase negativa de πάντως οὐκ (“de modo algum”). A vontade de não ir é corretamente atribuída a Apolo, sem importar uma referência à vontade divina. “Quando tiver oportunidade” traduz adequadamente ὅταν εὐκαιρήσῃ.
