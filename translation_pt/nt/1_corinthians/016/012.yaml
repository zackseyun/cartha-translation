id: 1CO.16.12
reference: 1 Corinthians 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: pt
  text: Quanto ao irmão Apolo[a], insisti muito com ele para que fosse até vocês com os irmãos; mas ele de modo algum quis ir agora[b]. Contudo, irá quando tiver oportunidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apolo, nosso irmão”. O grego diz literalmente “Apolo, o irmão”, sem pronome possessivo explícito.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “não era de modo algum sua vontade ir agora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: Quanto ao irmão Apolo
  rationale: “Quanto a” introduz naturalmente o novo assunto epistolar. “Irmão Apolo” mantém o artigo grego sem acrescentar um possessivo explícito; “Apolo” é a forma tradicional do nome em português.
- source_word: πολλὰ παρεκάλεσα αὐτὸν
  choice: insisti muito com ele
  rationale: Expressa de modo natural a intensidade de πολλὰ e o apelo persistente de παρακαλέω.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: para que fosse até vocês
  rationale: A oração com ἵνα indica o conteúdo do apelo. “Até vocês” comunica o movimento em direção aos coríntios, e “vocês” oferece ampla legibilidade brasileira.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: com os irmãos
  rationale: Mantém o masculino plural do grego, que no contexto provavelmente designa homens específicos que viajariam como colaboradores.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: mas ele de modo algum quis ir agora
  rationale: “De modo algum” preserva a forte negação de πάντως οὐκ; a formulação verbal é portuguesa natural e atribui a vontade a Apolo conforme o referente contextual mais próximo.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: Contudo, irá quando tiver oportunidade
  rationale: “Contudo” marca o contraste de δέ, e “quando tiver oportunidade” transmite a ideia de uma ocasião favorável sem reduzi-la a mera conveniência pessoal.
theological_decisions:
- issue: Sujeito e sentido de οὐκ ἦν θέλημα
  choice: A falta de disposição é atribuída a Apolo.
  alternative: Entender que não era vontade de Deus que Apolo fosse naquele momento.
  rationale: Apolo é o referente imediato, e o texto não menciona Deus nem sinaliza uma mudança para a vontade divina. A tradução evita introduzir uma afirmação teológica ausente do grego.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “de modo algum” conserva a ênfase sem soar arcaico. As notas preservam a forma nominal e a ausência do possessivo explícito no grego.
