  naturalness: “Eu lhes faço um apelo” é compreensível, mas “Faço-lhes um apelo” é mais natural e direto no registro bíblico moderno. A revisão evita a repetição de “conhecem, sabem” e explicita de maneira idiomática que os membros da casa são os agentes da dedicação.
  terminology: “Primícias”, “Acaia”, “Estéfanas” e “santos” são adequados. “Casa de Estéfanas” pode conservar o alcance de οἰκία como unidade doméstica. A nota a deve incluir o esclarecimento sobre o uso congregacional de “irmãos”, conforme a decisão lexical e teológica registrada.
