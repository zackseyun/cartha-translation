id: 1CO.16.15
reference: 1 Corinthians 16:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: pt
  text: 'Faço-lhes um apelo[a], irmãos: vocês conhecem a casa de Estéfanas, que é as primícias da Acaia[b] e cujos membros se dedicaram ao serviço dos santos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os exorto”. O grego diz “irmãos”, uma forma de tratamento que pode incluir toda a congregação.'
    reason: lexical_alternative
  - marker: b
    text: “Primícias” provavelmente indica os primeiros que creram na Acaia, preservando também a imagem da primeira porção separada para Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: faço um apelo
  rationale: Expressa uma exortação insistente de modo natural e digno, sem reduzi-la a um simples pedido.
- source_word: δὲ
  choice: não expresso por palavra isolada
  rationale: Marca uma transição leve; em português, o encadeamento contextual transmite essa função sem exigir um 'agora' temporal ou discursivo.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego; uma nota esclarece que, como forma congregacional de tratamento, pode incluir toda a comunidade.
- source_word: οἴδατε
  choice: vocês conhecem, sabem
  rationale: O perfeito grego tem sentido presente. A retomada com 'sabem que' torna natural em português a construção explicativa que segue.
- source_word: οἰκίαν Στεφανᾶ
  choice: a casa de Estéfanas
  rationale: '''Casa'' pode designar aqui o conjunto doméstico, não apenas o edifício; é uma formulação corrente em português e preserva a amplitude do termo.'
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: as primícias da Acaia
  rationale: Mantém a metáfora agrícola e sua possível conotação de uma porção inicial consagrada a Deus, sem reduzi-la apenas aos primeiros convertidos.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: ao serviço dos santos
  rationale: Expressa de modo amplo e idiomático o serviço prestado em benefício dos santos, sem sugerir necessariamente um cargo eclesiástico formal.
- source_word: ἔταξαν ἑαυτούς
  choice: se dedicaram
  rationale: Comunica que eles se dispuseram deliberada e continuamente para essa tarefa, em vez de sugerir uma nomeação oficial.
theological_decisions:
- issue: Alcance de ἀδελφοί no tratamento à congregação
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução conserva a forma lexical masculina do grego, enquanto a nota reconhece seu provável uso inclusivo numa congregação mista.
- issue: Sentido de ἀπαρχὴ τῆς Ἀχαΐας
  choice: as primícias da Acaia
  alternative: os primeiros convertidos da Acaia
  rationale: A opção preserva tanto o aspecto temporal quanto a metáfora e sua possível dimensão de consagração, sem decidir entre essas nuances.
- issue: Concordância coletiva de οἰκία com os verbos no plural
  choice: eles são... se dedicaram
  alternative: ela é... dedicou-se
  rationale: Embora οἰκία esteja no singular, o plural ἔταξαν e o referente humano coletivo favorecem entender os membros da casa como agentes; o português explicita naturalmente essa concordância sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa 'vocês' como plural não regionalmente marcado para grande parte do público e conserva os termos bíblicos 'primícias' e 'santos', esclarecendo a metáfora menos transparente em nota.
