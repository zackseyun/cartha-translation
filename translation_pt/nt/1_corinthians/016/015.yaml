  to: 'Faço-lhes um apelo[a], irmãos: vocês conhecem a casa de Estéfanas, que é as primícias da Acaia[b] e cujos membros se dedicaram ao serviço dos santos.'
  rationale: A revisão conserva a força exortativa de Παρακαλῶ, a transição não marcada de δέ, a metáfora de ἀπαρχή e o sentido coletivo de οἰκία. Ela substitui a dupla formulação “conhecem, sabem” por uma oração relativa portuguesa natural, e torna explícito que o plural ἔταξαν se refere aos integrantes da casa. A nota sobre “irmãos” foi completada para corresponder ao tratamento congregacional documentado no dossiê.
