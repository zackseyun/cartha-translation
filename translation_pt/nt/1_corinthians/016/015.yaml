    rationale: A decisão lexical e teológica afirma que a nota deve esclarecer que “irmãos”, como tratamento congregacional, pode incluir toda a comunidade. A nota atual oferece apenas uma alternativa para Παρακαλῶ.
  - severity: low
    issue: Referente plural de ἔταξαν após “casa”
    rationale: O verbo grego está no plural e se refere às pessoas da casa. Indicar “seus membros” em português elimina uma ambiguidade de concordância sem alterar o referente.
