  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: pt
  text: Se alguém não ama o Senhor, seja amaldiçoado[a]. Maranata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, tradicionalmente: “seja anátema”; isto é, fique sob maldição.'
    reason: lexical_alternative
  - marker: b
    text: Expressão aramaica. Pode significar “Nosso Senhor, vem!” ou “Nosso Senhor veio”.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ama
  rationale: Aqui, φιλέω expressa amor ou afeição pessoal pelo Senhor. “Ama” é a formulação mais natural em português e não restringe indevidamente o sentido a amizade ou sentimento.
- source_word: κύριον
  choice: o Senhor
  rationale: No contexto paulino, κύριος é um título cristológico que se refere a Jesus; “o Senhor” preserva tanto o título como o uso estabelecido no Novo Testamento.
- source_word: ἤτω
  choice: seja
  rationale: O imperativo presente de εἰμί tem força jussiva. “Seja” reproduz de modo conciso e solene a declaração imprecatória ou judicial.
- source_word: ἀνάθεμα
  choice: amaldiçoado
  rationale: ἀνάθεμα designa alguém posto sob maldição ou destinado à destruição. “Amaldiçoado” comunica o sentido em português corrente, enquanto o termo tradicional “anátema” é registrado em nota.
- source_word: Μαράνα θά
  choice: Maranata
  rationale: A expressão aramaica foi preservada em letras gregas, e sua divisão e interpretação são debatidas. A forma tradicional portuguesa “Maranata” mantém o caráter litúrgico e a ambiguidade do original; as principais interpretações aparecem em nota.
theological_decisions:
- issue: Sentido da expressão aramaica Μαράνα θά
  choice: Manter a transliteração “Maranata” no texto principal.
  alternative: “Vem, nosso Senhor!” ou “Nosso Senhor veio.”
  rationale: A expressão é estável no texto, mas sua segmentação aramaica permite interpretações diferentes. A transliteração evita resolver silenciosamente a ambiguidade e preserva seu caráter exclamativo e litúrgico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção breve conserva a intensidade da advertência paulina, e “Maranata” mantém a expressão semítica familiar sem eliminar sua ambiguidade.
