  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: pt
  text: Pois eles trouxeram alívio ao meu espírito e ao de vocês. Portanto, reconheçam homens como esses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deem o devido reconhecimento a homens como esses” ou “apreciem homens como esses”. A expressão grega está no masculino e, neste contexto, refere-se aos homens mencionados pouco antes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: reanimaram
  rationale: O verbo é metafórico e indica alívio e renovação interior, não descanso literal. “Reanimaram” comunica de modo natural o fortalecimento do ânimo.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão da recomendação anterior e preserva com concisão a ligação argumentativa.
- source_word: πνεῦμα
  choice: espírito
  rationale: Neste contexto, refere-se à dimensão interior ou ao estado de ânimo da pessoa, e não ao Espírito Santo; “espírito” conserva o idioma paulino.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: tanto o meu espírito como o de vocês
  rationale: Explicita naturalmente a elipse de πνεῦμα depois de τὸ ὑμῶν e deixa claro que a ação beneficiou Paulo e os coríntios.
- source_word: ἐπιγινώσκετε
  choice: reconheçam
  rationale: Aqui o verbo pede que se dê o devido reconhecimento a essas pessoas, não apenas que sejam identificadas. “Reconheçam” preserva a amplitude do termo sem intensificá-lo para “honrem”.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática inferida da afirmação precedente.
- source_word: τοὺς τοιούτους
  choice: homens como esses
  rationale: A expressão aponta, no contexto imediato, para Estéfanas, Fortunato e Acaico. A formulação mantém a referência masculina específica e soa natural em português.
theological_decisions:
- issue: Referência de gênero em τοὺς τοιούτους
  choice: homens como esses
  alternative: pessoas como essas
  rationale: Embora a expressão possa ter alcance genérico em outros contextos, aqui retoma especificamente três homens mencionados nos versículos anteriores. A tradução preserva essa referência sem transformar a exortação em uma regra exclusivamente masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo e corresponde ao plural do texto. A construção “tanto... como...” esclarece que o espírito de Paulo e o dos coríntios foram reanimados.
