  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: pt
  text: O meu amor esteja com todos vocês em Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”. O título grego Χριστός pode ser traduzido como “Messias” ou, na forma tradicional, “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: o meu amor
  rationale: Expressa de modo direto o amor pessoal e dedicado de Paulo; «caridade» seria menos natural no português atual.
- source_word: μετὰ πάντων ὑμῶν
  choice: esteja com todos vocês
  rationale: A frase grega não contém verbo; «esteja» explicita naturalmente o desejo implícito no encerramento epistolar, enquanto «todos vocês» preserva o alcance inclusivo.
- source_word: ἐν
  choice: 'no'
  rationale: Mantém a expressão paulina de esfera ou união sem a explicar além do que o texto diz.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Traduz Χριστός como título e translitera o nome Ἰησοῦ, preservando de forma transparente o sentido messiânico.
theological_decisions:
- issue: Sentido da frase sem verbo
  choice: O meu amor esteja
  alternative: O meu amor está
  rationale: O contexto de despedida favorece uma expressão de desejo ou bênção, mas o verbo acrescentado permanece em itálico conceitual apenas; a tradução não pretende afirmar que exista um modo verbal explícito no grego.
- issue: Tradução de Χριστός na fórmula ἐν Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: «Messias» torna explícito o valor titular de Χριστός; a alternativa tradicional é registrada em nota para não ocultar a possibilidade legítima de tratá-lo como forma consolidada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A formulação preserva a concisão e o tom afetuoso da despedida.
source_grounding:
  english_pob_role: consult_only
