  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: pt
  text: Estejam vigilantes; permaneçam firmes na fé; ajam com coragem[a]; sejam fortalecidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ajam como homens”; o verbo grego é uma expressão idiomática que chama à coragem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sejam fortes”. A forma grega é passiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Estejam vigilantes
  rationale: O imperativo presente plural pede vigilância contínua. A formulação é natural, digna e preserva a força exortativa.
- source_word: στήκετε
  choice: permaneçam firmes
  rationale: στήκω comunica constância e firmeza, não apenas a postura física de estar em pé.
- source_word: ἐν τῇ πίστει
  choice: na fé
  rationale: O artigo e o contexto favorecem a fé como esfera ou conteúdo da confissão cristã, sem precisar explicitar interpretativamente «a fé cristã».
- source_word: ἀνδρίζεσθε
  choice: ajam com coragem
  rationale: Embora formado a partir de ἀνήρ («homem»), o verbo funciona idiomaticamente como chamado à coragem. A tradução comunica esse sentido em português atual, enquanto a nota preserva a imagem literalmente masculina.
- source_word: κραταιοῦσθε
  choice: sejam fortalecidos
  rationale: A forma é imperativa presente passiva. Esta redação preserva a voz passiva e a possível abertura quanto ao agente que concede força.
theological_decisions:
- issue: Sentido de πίστις com artigo
  choice: na fé
  alternative: com fé
  rationale: «Na fé» preserva a construção grega e sugere a esfera ou o conteúdo da fé confessada; «com fé» tenderia a enfatizar mais o ato subjetivo de confiar.
- issue: Força masculina de ἀνδρίζεσθε
  choice: ajam com coragem
  alternative: portem-se como homens
  rationale: O sentido idiomático do verbo é agir corajosamente. A tradução literal seria pouco natural e poderia ser entendida como limitação do chamado aos homens; a nota mantém transparente a imagem de origem sem impor essa leitura.
- issue: Voz de κραταιοῦσθε
  choice: sejam fortalecidos
  alternative: sejam fortes
  rationale: A forma grega é passiva, e preservá-la mantém a tensão entre a exortação dirigida aos leitores e a força que lhes é concedida, sem nomear um agente ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sequência breve de quatro imperativos e o tom enfático do original foram preservados; o ponto e vírgula ajuda a manter o ritmo sem fragmentar o versículo.
