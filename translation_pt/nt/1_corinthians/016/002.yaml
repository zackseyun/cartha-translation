base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: pt
  text: No primeiro dia de cada semana[a], cada um de vocês ponha de lado uma quantia, guardando-a consigo[b], conforme for prosperando[c], para que não se façam coletas quando eu chegar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No primeiro dia da semana”. A expressão grega tem aqui sentido distributivo e indica uma prática semanal regular.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “junto de si” ou “consigo”. Isso pode indicar que cada pessoa devia guardar a quantia pessoalmente, talvez em casa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de acordo com a sua prosperidade”. A ideia é separar uma quantia correspondente à prosperidade que cada um fosse recebendo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: No primeiro dia de cada semana
  rationale: A construção com κατά tem força distributiva e indica uma prática semanal recorrente. A formulação é natural em português e explicita essa regularidade.
- source_word: ἕκαστος ὑμῶν
  choice: cada um de vocês
  rationale: Reproduz diretamente o caráter distributivo da instrução, dirigida individualmente a todos os destinatários.
- source_word: παρ’ ἑαυτῷ
  choice: consigo
  rationale: Preserva a expressão espacial/pessoal do grego sem decidir se a reserva era necessariamente feita em casa ou apenas mantida sob responsabilidade individual.
- source_word: τιθέτω
  choice: separe
  rationale: O imperativo presente pede uma ação habitual. Em português, “separe” comunica com clareza a ordem de pôr uma quantia à parte.
- source_word: θησαυρίζων
  choice: acumulando
  rationale: O particípio indica que o valor separado devia ser guardado e aumentado progressivamente ao longo das semanas.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: conforme tiver prosperado
  rationale: Expressa a relação entre a contribuição e a prosperidade recebida, sem restringir o sentido a salário ou renda e sem impor um montante fixo.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε
  choice: para que ... quando eu chegar
  rationale: Mantém com naturalidade tanto a finalidade da instrução quanto a referência temporal à chegada de Paulo.
- source_word: λογεῖαι γίνωνται
  choice: não se façam coletas
  rationale: λογεῖαι designa coletas, aqui de recursos financeiros; a construção impessoal é corrente e preserva o sentido do grego.
theological_decisions:
- issue: Local em que a contribuição seria guardada
  choice: “consigo”, mantendo aberta a possibilidade de reserva pessoal
  alternative: “em casa” ou depósito numa tesouraria comunitária
  rationale: παρ’ ἑαυτῷ pode sugerir que cada pessoa guardasse o valor junto de si, possivelmente em casa, mas o texto não especifica inequivocamente o local nem descreve uma coleta congregacional semanal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quantia” é acrescentado como complemento contextual de “separe”, pois a coleta financeira torna o referente implícito evidente. A redação evita tanto arcaísmos como uma especificação indevida sobre o lugar onde o dinheiro seria guardado.
