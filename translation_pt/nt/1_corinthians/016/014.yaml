translation:
  language: pt
  text: Que tudo o que vocês fizerem seja feito em amor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Que tudo o que é de vocês seja em amor.”'
