lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural de πᾶς tem sentido abrangente; “tudo” preserva naturalmente esse alcance universal em português.
- source_word: ὑμῶν
  choice: o que vocês fizerem
  rationale: O genitivo ligado a πάντα é elíptico, literalmente algo como “todas as coisas de vocês”. A expressão explicita de modo idiomático aquilo que procede dos destinatários, sem restringir materialmente o sentido.
- source_word: ἐν ἀγάπῃ
  choice: com amor
  rationale: ἀγάπη é traduzido pelo equivalente usual “amor”. Aqui ἐν pode indicar esfera ou modo; “com amor” expressa naturalmente o modo da ação em português.
- source_word: γινέσθω
  choice: seja feito
  rationale: O imperativo presente de γίνομαι funciona como exortação. Em combinação com a formulação elíptica anterior, “seja feito” comunica com clareza e naturalidade a força imperativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” adequado à referência plural e legibilidade brasileira. A formulação mantém o alcance universal da exortação e registra em nota a estrutura mais literal do grego.
