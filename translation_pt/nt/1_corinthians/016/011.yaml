  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: pt
  text: Portanto, ninguém o despreze. Ajudem-no, porém, a seguir viagem em paz, para que venha até mim, pois estou esperando por ele com os irmãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com os irmãos e as irmãs»; ἀδελφῶν pode, conforme o contexto, referir-se de modo abrangente a cristãos ou colaboradores.
    reason: alternativa lexical e possível referência inclusiva de ἀδελφῶν
lexical_decisions:
- source_word: μή τις οὖν
  choice: Portanto, ninguém
  rationale: μή com o subjuntivo aoristo expressa proibição; «portanto» preserva a ligação inferencial de οὖν com o contexto anterior.
- source_word: ἐξουθενήσῃ
  choice: o despreze
  rationale: O verbo significa considerar alguém sem valor ou tratá-lo com desdém; «despreze» é direto, forte e natural.
- source_word: προπέμψατε
  choice: Ajudem-no ... a seguir viagem
  rationale: O verbo pode designar despedir alguém para a continuação de uma viagem, acompanhando-o ou prestando-lhe o auxílio necessário. A formulação explicita esse sentido sem restringir o tipo de assistência.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Mantém a expressão grega e comunica uma partida pacífica, sem impedimentos nem hostilidade.
- source_word: ἵνα ἔλθῃ πρός με
  choice: para que venha até mim
  rationale: «Para que» preserva a finalidade expressa por ἵνα com o subjuntivo.
- source_word: ἐκδέχομαι
  choice: estou esperando
  rationale: Expressa naturalmente a expectativa contínua indicada pelo presente grego.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: com os irmãos
  rationale: Preserva o plural masculino do grego e sua possível referência concreta aos homens que acompanhariam Timóteo, sem excluir na nota o uso mais amplo para outros cristãos ou colaboradores.
theological_decisions:
- issue: Sentido de ἀδελφῶν em um possível grupo cristão misto
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto grego usa o plural masculino. O texto principal mantém essa forma e a nota preserva a possibilidade contextual de que o termo designe um grupo mais amplo de cristãos ou colaboradores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Ajudem-no a seguir viagem» evita o tom potencialmente brusco de «mandem-no embora» e comunica o auxílio de viagem implícito em προπέμπω. O marcador [a] aparece no texto principal.
