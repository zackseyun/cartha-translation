  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: pt
  text: Se Timóteo vier, cuidem para que ele esteja com vocês sem medo, pois trabalha na obra do Senhor, assim como eu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pois realiza a obra do Senhor, assim como eu também a realizo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: Se Timóteo for
  rationale: A construção com ἐάν e o aoristo do subjuntivo expressa uma possibilidade futura. Em português, «se ... for» comunica naturalmente a ida de Timóteo ao lugar onde estavam os destinatários; δέ funciona como transição leve e não exige uma conjunção explícita.
- source_word: βλέπετε ἵνα
  choice: cuidem para que
  rationale: O imperativo exige atenção ativa por parte da comunidade, e «cuidem para que» introduz de modo natural a oração de finalidade ou resultado.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: ele esteja entre vocês sem medo
  rationale: A formulação preserva tanto a presença de Timóteo junto à comunidade quanto sua condição livre de temor, sem reduzir a expressão apenas à ideia subjetiva de sentir-se seguro.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: pois trabalha na obra do Senhor
  rationale: Evita em português a repetição pouco natural «trabalha o trabalho», ao mesmo tempo que mantém o aspecto contínuo da atividade e a relação explícita com a obra do Senhor.
- source_word: ὡς κἀγώ
  choice: assim como eu
  rationale: 'Mantém a elipse concisa do grego: o verbo e seu complemento são recuperados naturalmente da oração anterior.'
theological_decisions:
- issue: Referente de κυρίου
  choice: Senhor
  alternative: explicitar «Senhor Jesus»
  rationale: Embora no uso paulino o referente provavelmente seja Jesus, o texto grego diz apenas «Senhor»; a tradução conserva essa forma sem acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Vocês» oferece compreensão ampla; «cuidem» expressa responsabilidade comunitária sem excessiva formalidade. O marcador [a] foi colocado após a unidade à qual a alternativa se refere.
