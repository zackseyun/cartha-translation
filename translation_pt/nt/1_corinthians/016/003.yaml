base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: pt
  text: E, quando eu chegar, enviarei com cartas aqueles que vocês aprovarem para levarem a contribuição de vocês a Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a dádiva generosa de vocês». A palavra grega também pode significar «graça», mas aqui se refere à contribuição enviada a Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Mas, quando eu chegar
  rationale: ὅταν com o subjuntivo aoristo indica uma circunstância futura; «quando eu chegar» é natural em português. δέ retoma o fluxo com leve contraste em relação às instruções anteriores, adequadamente expresso por «Mas».
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: aqueles que vocês aprovarem
  rationale: δοκιμάζω pode envolver examinar e, após avaliação, aprovar. No contexto da escolha de representantes, «aprovarem» comunica com clareza o resultado, sem acrescentar um processo não explicitado.
- source_word: δι’ ἐπιστολῶν
  choice: com cartas
  rationale: διά com genitivo expressa aqui meio ou acompanhamento instrumental. «Com cartas» preserva a formulação concisa do grego sem especificar interpretativamente que seriam cartas de recomendação.
- source_word: τούτους πέμψω
  choice: enviarei ... aqueles
  rationale: O demonstrativo τούτους retoma enfaticamente os representantes aprovados. A construção portuguesa explicita o objeto de modo natural.
- source_word: ἀπενεγκεῖν
  choice: para levarem
  rationale: O infinitivo expressa a finalidade do envio. «Levar» adota naturalmente a perspectiva do ponto de partida, Corinto, em direção a Jerusalém.
- source_word: τὴν χάριν ὑμῶν
  choice: a oferta de vocês
  rationale: No contexto imediato da coleta para os santos, χάρις designa concretamente a contribuição generosa. «Oferta» é clara e digna, enquanto a nota preserva a nuance lexical de graça ou dádiva generosa.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: εἰς com nome de cidade indica destino; «a Jerusalém» é uma expressão portuguesa direta e natural.
theological_decisions:
- issue: Sentido de χάρις no contexto da coleta
  choice: oferta material destinada aos fiéis de Jerusalém
  alternative: graça, dádiva generosa ou ato de generosidade
  rationale: O contexto de 1 Coríntios 16 trata de uma coleta concreta. A tradução «oferta» evita transformar χάρις em uma abstração teológica, enquanto a nota mantém sua conotação de generosidade graciosa.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para legibilidade brasileira e compreensão internacional ampla. A ordem «enviarei com cartas aqueles...» mantém as cartas ligadas ao ato de enviar, embora o grego não declare seu conteúdo. A vírgula antes da oração final favorece a leitura sem alterar a relação de finalidade.
