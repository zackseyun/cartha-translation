source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: pt
  text: As igrejas da Ásia enviam saudações a vocês.[a] Áquila e Prisca[b], juntamente com a igreja que se reúne na casa deles, enviam calorosas saudações a vocês no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ásia” refere-se aqui à província romana da Ásia, no oeste da Ásia Menor, e não ao continente moderno.
    reason: cultural_note
  - marker: b
    text: O texto grego traz “Prisca”, também chamada “Priscila” em outras passagens (por exemplo, Atos 18:2, 18, 26).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: enviam saudações
  rationale: No contexto epistolar, ἀσπάζομαι indica saudar ou transmitir saudações; esta formulação é natural em português e funciona tanto para o plural quanto para o singular grego.
- source_word: αἱ ἐκκλησίαι
  choice: as igrejas
  rationale: No uso paulino, ἐκκλησία normalmente designa congregações cristãs locais; “igrejas” é claro, corrente e adequado ao plural.
- source_word: τῆς Ἀσίας
  choice: da Ásia
  rationale: Mantém a forma concisa do grego; uma nota esclarece que se trata da província romana, não do continente moderno.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a fórmula paulina e sua dimensão teológica e relacional sem explicitar além do texto.
- source_word: πολλὰ
  choice: calorosas
  rationale: Como acusativo adverbial, πολλὰ intensifica a saudação. “Calorosas saudações” expressa essa força de modo idiomático em português.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Áquila e Prisca
  rationale: Translitera os nomes conforme a forma presente no texto grego, Πρίσκα, sem substituí-la pela forma diminutiva Priscila.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: juntamente com a igreja que se reúne na casa deles
  rationale: Explicita de modo natural o sentido idiomático de uma congregação reunida numa residência, evitando que “igreja na casa” seja entendida como o edifício ou apenas a família.
theological_decisions:
- issue: Sentido de ἐκκλησία em ambiente doméstico
  choice: “a igreja que se reúne na casa deles” designa uma congregação cristã local reunida na residência de Áquila e Prisca
  alternative: “a igreja na casa deles”, expressão mais formal e menos explícita
  rationale: O contexto e o uso paulino favorecem uma comunidade cristã reunida no lar, não simplesmente os membros da família. A explicitação comunica esse sentido sem impor uma estrutura denominacional.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a linguagem confessional paulina e a formulação tradicional, sem restringir ou ampliar indevidamente o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa e uma formulação epistolar natural. Os marcadores foram posicionados junto aos elementos que as notas esclarecem.
