  footnotes:
  - marker: a
    text: 'Ou: «quando eu passar pela Macedônia». O subjuntivo aoristo grego pode ser traduzido de modo mais simples, mas «quando tiver passado» ressalta que a passagem pela Macedônia ocorrerá antes da visita de Paulo.'
