lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: irei
  rationale: O futuro de ἔρχομαι expressa a intenção futura de Paulo. Em português, «irei até vocês» é a forma deíctica mais natural neste contexto.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz uma transição com leve contraste em relação aos planos de viagem anteriores; «Mas» preserva essa mudança sem torná-la excessivamente enfática.
- source_word: πρὸς ὑμᾶς
  choice: até vocês
  rationale: πρός com acusativo após verbo de movimento indica deslocamento em direção aos destinatários; «até vocês» é idiomático e claro.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo aoristo, ὅταν introduz uma circunstância futura. Neste plano concreto de viagem, «quando» é mais natural do que «sempre que».
- source_word: Μακεδονίαν
  choice: a Macedônia
  rationale: Emprega-se a forma portuguesa consagrada do nome da província romana.
- source_word: διέλθω
  choice: tiver atravessado
  rationale: O subjuntivo aoristo sob ὅταν apresenta a travessia como anterior à visita. O futuro composto do subjuntivo preserva essa relação de anterioridade, sem confundi-lo com o presente διέρχομαι da oração seguinte.
- source_word: γὰρ
  choice: pois
  rationale: γάρ explica por que a visita ocorrerá depois da travessia; «pois» mantém de modo conciso a ligação explicativa.
- source_word: διέρχομαι
  choice: vou atravessar
  rationale: O presente grego descreve aqui uma rota planejada ou intenção já estabelecida. «Vou atravessar» soa natural em português e evita sugerir equivocadamente que Paulo já se encontrava em trânsito pela Macedônia.
