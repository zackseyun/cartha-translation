base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: pt
  text: E, se for apropriado que eu também vá[a], eles irão comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se valer a pena que eu também vá”. A expressão grega pode indicar o que é apropriado, justificável ou válido nas circunstâncias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: E, se
  rationale: A condição é introduzida por ἐάν, enquanto δέ funciona aqui como conectivo leve; “E, se” mantém a continuidade sem criar contraste forte.
- source_word: ἄξιον ᾖ
  choice: for apropriado
  rationale: A construção impessoal indica que a viagem de Paulo seria apropriada ou justificável nas circunstâncias; “for apropriado” é natural e evita sugerir mérito moral pessoal.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: que eu também vá
  rationale: A oração infinitiva especifica a ação considerada apropriada, e κἀμέ preserva o sentido aditivo de que Paulo também iria.
- source_word: σὺν ἐμοὶ
  choice: comigo
  rationale: Expressa diretamente o acompanhamento indicado por σύν com o dativo.
- source_word: πορεύσονται
  choice: eles irão
  rationale: O futuro indica a viagem dos representantes; “irão” preserva a repetição sem acrescentar a ideia mais específica de escolta.
theological_decisions:
- issue: Sentido da declaração condicional de Paulo sobre acompanhar a delegação
  choice: Paulo afirma que, se for apropriado que ele também viaje, os representantes irão com ele.
  alternative: A oferta é importante o bastante para justificar a ida de Paulo; ou Paulo é pessoalmente digno de ir.
  rationale: ἄξιον é impessoal, e a oração infinitiva identifica a ação avaliada. O contexto trata dos preparativos práticos para levar a coleta, não do mérito moral de Paulo; a nota preserva a amplitude lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “For apropriado” comunica adequação prática sem soar excessivamente técnico; “eles irão comigo” mantém a concisão e a repetição verbal do grego.
