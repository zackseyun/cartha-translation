  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: pt
  text: Quanto à coleta para os santos[a], façam vocês também como instruí as igrejas da Galácia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o povo de Deus”.'
    reason: Alternativa lexical que esclarece o sentido comunitário de “santos”.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz naturalmente um novo assunto na carta. Em português, “quanto a” comunica a transição temática sem acrescentar um advérbio temporal ausente do grego.
- source_word: λογείας
  choice: coleta
  rationale: Designa a arrecadação de dinheiro; “coleta” é clara e não a caracteriza indevidamente como oferta cultual.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: para os santos
  rationale: Expressa os beneficiários da coleta e preserva a designação paulina habitual dos fiéis.
- source_word: διέταξα
  choice: determinei
  rationale: Mantém a força de uma instrução autorizada sem a dureza que “ordenei” pode sugerir no português corrente.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: Refere-se às comunidades cristãs locais; “igrejas” é a forma estabelecida e natural.
- source_word: τῆς Γαλατίας
  choice: da Galácia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: façam vocês também como
  rationale: Reproduz a ordem dirigida ao grupo e a correspondência com as instruções dadas às igrejas da Galácia, em sintaxe portuguesa natural.
theological_decisions:
- issue: Sentido de ἅγιοι no contexto de auxílio financeiro
  choice: santos
  alternative: povo de Deus
  rationale: “Santos” conserva a terminologia comunitária de Paulo e sua continuidade teológica, sem pressupor a noção posterior de canonização; a nota oferece uma equivalência funcional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “façam vocês também” evita ambiguidade quanto ao sujeito plural e mantém a força diretiva do imperativo.
