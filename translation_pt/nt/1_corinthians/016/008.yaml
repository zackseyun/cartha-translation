- source_word: ἐπιμενῶ
  choice: permanecerei
  rationale: O futuro ativo de ἐπιμένω, no contexto dos planos de viagem de Paulo, indica continuar em determinado lugar por algum tempo. “Permanecerei” é natural, digno e preciso em português.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz aqui um contraste leve com os planos de viagem mencionados anteriormente; “mas” preserva essa relação discursiva.
- source_word: ἐν Ἐφέσῳ
  choice: em Éfeso
  rationale: ἐν com o dativo tem sentido locativo direto; emprega-se a forma portuguesa tradicional do nome da cidade.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: até Pentecostes
  rationale: ἕως com o genitivo marca duração até um ponto no tempo. “Pentecostes” é a designação convencional e amplamente reconhecida da festa judaica no contexto do Novo Testamento.
