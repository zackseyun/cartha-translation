  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: pt
  text: E talvez eu fique com vocês ou até passe o inverno, para que vocês me ajudem a seguir viagem[a] para onde quer que eu vá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me acompanhem na partida”. O verbo grego pode incluir despedir o viajante, acompanhá-lo ao partir ou dar-lhe a ajuda necessária para a viagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: com vocês
  rationale: Com verbo de permanência, πρός + acusativo indica presença junto a pessoas; “com vocês” é natural e preciso em português.
- source_word: δὲ
  choice: E
  rationale: Aqui funciona como conectivo brando na continuação dos planos de viagem, sem contraste forte.
- source_word: τυχὸν
  choice: talvez
  rationale: Expressa possibilidade ou contingência de modo conciso e idiomático.
- source_word: παραμενῶ
  choice: eu fique
  rationale: O verbo significa permanecer ou ficar por algum tempo; “fique” é natural no contexto de uma visita.
- source_word: ἢ καὶ
  choice: ou até
  rationale: 'Realça a segunda possibilidade como mais extensa: não apenas ficar, mas passar todo o inverno.'
- source_word: παραχειμάσω
  choice: passe o inverno aí
  rationale: O verbo designa passar o inverno em determinado lugar; “aí” explicita naturalmente que se trata de Corinto, sem acrescentar conteúdo estranho ao contexto.
- source_word: ἵνα
  choice: para que
  rationale: Preserva a relação de propósito introduzida pela conjunção.
- source_word: προπέμψητε
  choice: me encaminhem na viagem
  rationale: No contexto de viagens, o verbo pode abranger despedir, acompanhar no início do percurso e prestar a ajuda necessária para a continuação; a formulação preserva essa amplitude.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: aonde quer que eu vá
  rationale: A construção com ἐάν e subjuntivo indica destino indefinido e contingente; “aonde” é adequado por envolver movimento para um destino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A redação mantém a incerteza de Paulo por meio de “talvez” e “aonde quer que”, sem especificar indevidamente a forma de assistência indicada por προπέμπω.
