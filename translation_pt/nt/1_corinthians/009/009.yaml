  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: pt
  text: 'Pois está escrito na Lei de Moisés: “Não amordace o boi enquanto ele debulha[a].” Será que Deus se preocupa com os bois?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto pisa os grãos”.
    reason: Alternativa lexical que explicita o modo tradicional de debulhar com o boi, coerente com o contexto da citação, embora “os grãos” não apareça de forma expressa na redação grega de Paulo.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Pois está escrito na Lei de Moisés
  rationale: A expressão preposicional é vertida pelo uso bíblico natural “na Lei de Moisés”; γάρ é preservado por “Pois”, que liga o versículo ao argumento anterior.
- source_word: γέγραπται
  choice: está escrito
  rationale: Mantém a fórmula tradicional e natural que introduz uma citação das Escrituras, refletindo o perfeito passivo grego.
- source_word: Οὐ κημώσεις
  choice: Não amordace
  rationale: O futuro indicativo funciona como proibição na citação legal. O imperativo negativo é a forma mais natural em português moderno, e “amordaçar” expressa diretamente a ação de impedir o animal de comer.
- source_word: βοῦν
  choice: o boi
  rationale: “Boi” é o termo corrente e preciso para o bovino usado no trabalho agrícola; o artigo definido soa natural numa regra geral em português.
- source_word: ἀλοῶντα
  choice: enquanto ele debulha
  rationale: O particípio presente indica uma ação em curso. “Enquanto ele debulha” conserva essa relação temporal sem acrescentar ao texto principal a explicitação de que o animal pisa os grãos.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Será que Deus se preocupa com os bois?
  rationale: A pergunta com μή tem força retórica e espera resposta negativa no argumento. Esta formulação é natural e mantém a pergunta sem inserir “somente” nem transformar a frase numa negação absoluta explícita.
theological_decisions:
- issue: A pergunta retórica de Paulo sobre o cuidado de Deus pelos animais
  choice: Será que Deus se preocupa com os bois?
  alternative: Será que é com os bois que Deus se preocupa?
  rationale: A tradução preserva a força retórica da pergunta introduzida por μή, mas não acrescenta “somente” nem afirma expressamente que Deus não cuida dos animais. Assim, mantém a tensão entre o argumento de Paulo e a questão mais ampla do cuidado divino pela criação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A citação legal usa imperativo negativo corrente; a pergunta final conserva o caráter retórico sem resolver a tensão teológica.
