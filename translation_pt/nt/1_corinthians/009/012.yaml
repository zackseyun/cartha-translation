  terminology: “Direito”, “evangelho” e “Messias” são escolhas consistentes com o contexto e com as decisões lexicais apresentadas. A nota de a esclarece apropriadamente o alcance de “sobre vocês”; a nota de b explica de forma suficiente a opção titular “Messias” para Χριστός.
