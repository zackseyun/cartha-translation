id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: pt
  text: Se outros participam desse direito sobre vocês[a], não o temos nós ainda mais? Contudo, não fizemos uso desse direito. Pelo contrário, suportamos tudo para não causarmos nenhum impedimento ao evangelho do Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dessa reivindicação sobre vocês” ou “dessa autoridade em relação a vocês”. A expressão grega provavelmente se refere ao direito dos apóstolos de receber sustento material dos coríntios.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “do Cristo”. Aqui, “Messias” traduz Χριστός como título. A forma tradicional é “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: direito
  rationale: No contexto, indica a prerrogativa legítima dos apóstolos de receber sustento material. “Direito” expressa isso com mais naturalidade do que “autoridade”.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: desse direito sobre vocês
  rationale: O genitivo ὑμῶν descreve um direito exercido em relação aos coríntios, não um direito pertencente a eles. A formulação mantém essa relação, enquanto a nota registra alternativas.
- source_word: μετέχουσιν
  choice: participam
  rationale: Expressa ter parte ou beneficiar-se do direito mencionado.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: não o temos nós ainda mais?
  rationale: Preserva a pergunta retórica, a comparação enfática de μᾶλλον e o destaque dado a ἡμεῖς.
- source_word: ἐχρησάμεθα
  choice: fizemos uso
  rationale: χράομαι significa valer-se de algo ou fazer uso dele; a expressão é idiomática em português.
- source_word: πάντα
  choice: tudo
  rationale: Mantém o alcance abrangente do acusativo neutro plural.
- source_word: στέγομεν
  choice: suportamos
  rationale: Neste contexto, o verbo se refere a aguentar privações ou dificuldades, e não a cobrir ou ocultar.
- source_word: τινα ἐγκοπὴν
  choice: nenhum impedimento
  rationale: ἐγκοπή designa obstáculo ou entrave; “impedimento” preserva o sentido no contexto da proclamação.
- source_word: δῶμεν
  choice: causarmos
  rationale: Embora o verbo signifique literalmente “dar”, com ἐγκοπή a construção portuguesa natural é “causar impedimento”. O subjuntivo após ἵνα μή expressa finalidade negativa.
- source_word: εὐαγγελίῳ
  choice: evangelho
  rationale: É o equivalente português estabelecido e claro no uso paulino.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Aqui Χριστός funciona como título; “Messias” torna explícito seu valor titular sem acrescentar interpretação denominacional.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: O termo funciona aqui como título. A tradução principal preserva o sentido messiânico, e a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Contudo” e “pelo contrário” articulam o contraste sem tornar a frase excessivamente coloquial; “suportamos tudo” conserva a força abrangente da afirmação de Paulo.
