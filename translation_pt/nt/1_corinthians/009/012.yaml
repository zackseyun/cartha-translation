  source_fidelity: O texto preserva adequadamente a pergunta retórica e o valor comparativo de οὐ μᾶλλον ἡμεῖς, bem como o contraste duplo introduzido por ἀλλά. “Direito sobre vocês” comunica de modo defensável a relação expressa pelo genitivo ὑμῶν, sem sugerir que o direito pertença aos coríntios. “Suportamos tudo” traduz bem πάντα στέγομεν, e “para não causarmos nenhum impedimento” expressa com fidelidade a finalidade negativa de ἵνα μή ... δῶμεν.
