  source_fidelity: 'O sentido geral está correto: ἐξουσία é adequadamente traduzido por “direito”; περιάγειν por “levar conosco”; e os grupos mencionados, inclusive “Cefas”, são preservados. Contudo, “uma irmã como esposa” não exprime com segurança a aposição grega ἀδελφὴν γυναῖκα e, em português, pode sugerir inadequadamente que uma irmã é tomada por esposa. A construção designa uma esposa que é também irmã na fé.'
