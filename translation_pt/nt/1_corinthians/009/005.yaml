source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: pt
  text: Não temos o direito de levar conosco uma esposa que seja irmã na fé[a], assim como também os demais apóstolos, os irmãos do Senhor e Cefas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma irmã, uma esposa”; isto é, uma esposa que também é irmã na fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: o direito
  rationale: Neste contexto, Paulo reivindica uma prerrogativa apostólica legítima, não autoridade abstrata; “o direito” é claro e natural em português.
- source_word: ἀδελφὴν γυναῖκα
  choice: uma irmã como esposa
  rationale: 'Preserva os dois elementos da expressão grega: uma esposa que é também irmã na fé. A nota esclarece a construção incomum sem eliminar sua forma do texto principal.'
- source_word: περιάγειν
  choice: levar conosco
  rationale: O infinitivo indica fazer-se acompanhar em viagens; “levar conosco” comunica esse sentido de modo natural.
- source_word: ὡς καὶ
  choice: assim como
  rationale: Expressa com naturalidade tanto a comparação quanto a inclusão dos exemplos citados.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: os demais apóstolos
  rationale: “Demais” distingue os outros membros do mesmo grupo e corresponde precisamente a λοιποί.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: os irmãos do Senhor
  rationale: Reproduz diretamente a expressão grega sem decidir a natureza exata do parentesco.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Mantém a forma do nome usada no texto grego, em vez de substituí-la por Pedro.
theological_decisions:
- issue: Sentido de “os irmãos do Senhor”
  choice: Manter a expressão direta “os irmãos do Senhor”.
  alternative: Especificar irmãos biológicos, meio-irmãos ou parentes próximos.
  rationale: A expressão grega não resolve por si só a discussão posterior sobre a natureza exata desse parentesco.
- issue: Sentido de ἀδελφὴν γυναῖκα
  choice: Traduzir “uma irmã como esposa”, esclarecendo em nota que se trata de uma esposa irmã na fé.
  alternative: “uma esposa crente” ou “uma esposa cristã”.
  rationale: A opção escolhida conserva ambos os substantivos gregos e evita tornar explícita no texto principal uma interpretação que a forma original comunica de maneira condensada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A pergunta retórica preserva a expectativa de resposta afirmativa do grego.
