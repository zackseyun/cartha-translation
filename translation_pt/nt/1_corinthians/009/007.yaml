  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: pt
  text: Quem jamais serve como soldado às próprias custas?[a] Quem planta uma vinha e não come do seu fruto? Ou quem pastoreia um rebanho e não bebe do leite do rebanho?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o próprio soldo” ou “com as próprias provisões”. O termo grego pode indicar o pagamento ou as provisões de um soldado; aqui, o sentido é que ele não arca com o custo do próprio serviço.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não come do leite do rebanho”. O grego usa o mesmo verbo, “comer”, nas duas últimas perguntas; em português, com leite, “beber” é mais natural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: serve como soldado
  rationale: Expressa o serviço militar sem restringir o sentido ao combate e preserva a analogia ocupacional.
- source_word: ἰδίοις ὀψωνίοις
  choice: às próprias custas
  rationale: ὀψώνια pode designar soldo ou provisões militares; no contexto, a pergunta indica que o soldado não financia o próprio serviço. A nota registra a alternativa lexical mais concreta.
- source_word: ποτέ
  choice: jamais
  rationale: Na pergunta retórica, transmite de modo natural o valor de “alguma vez”.
- source_word: φυτεύει ἀμπελῶνα
  choice: planta uma vinha
  rationale: Reproduz diretamente a imagem agrícola em português corrente.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: do seu fruto
  rationale: καρπός designa aqui o produto da vinha; a formulação mantém a relação explícita com ela.
- source_word: ποιμαίνει ποίμνην
  choice: pastoreia um rebanho
  rationale: Preserva a imagem pastoril e o vínculo lexical entre a ação e o rebanho.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: do leite do rebanho
  rationale: Mantém o valor de fonte ou participação expresso por ἐκ e comunica que o pastor se beneficia do que o rebanho produz.
- source_word: ἐσθίει
  choice: come / se alimenta
  rationale: O verbo grego é literalmente “come” nas duas ocorrências. Na segunda, “se alimenta do leite” conserva melhor o paralelismo lexical do original sem soar tão estranho quanto “come do leite”; a nota esclarece a literalidade.
theological_decisions:
- issue: Masculino singular genérico nas três perguntas com τίς
  choice: Construções portuguesas sem pronome pessoal explícito, mantendo cada exemplo no singular
  alternative: Explicitar “ele” ou reformular no plural
  rationale: O português permite preservar naturalmente os exemplos representativos no singular sem acrescentar um pronome que o texto grego não exige nem transformar as perguntas em plurais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As três perguntas retóricas foram mantidas em paralelo. “Às próprias custas” é idiomático e amplamente compreensível; “vinha”, “pastoreia” e “rebanho” preservam as imagens concretas do original.
