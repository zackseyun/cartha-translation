base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: pt
  text: Ou será que somente eu e Barnabé não temos o direito de não trabalhar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a autoridade de não trabalhar» ou «a liberdade de não trabalhar». Aqui, trata-se do direito de deixar de trabalhar para o próprio sustento e receber sustento no ministério.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou será que
  rationale: Introduz outra alternativa retórica no argumento de Paulo; a formulação mantém a ligação com o contexto e soa natural em português.
- source_word: μόνος
  choice: somente
  rationale: Modifica o sujeito coordenado «eu e Barnabé» e destaca que eles seriam a única exceção.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: eu e Barnabé
  rationale: Preserva a ordem grega, que também é natural e clara em português.
- source_word: οὐκ ἔχομεν
  choice: não temos
  rationale: Reproduz de modo direto e natural a negação do presente do indicativo.
- source_word: ἐξουσίαν
  choice: o direito
  rationale: Neste contexto, indica uma prerrogativa legítima dos apóstolos, sobretudo quanto ao sustento material, e não autoridade governamental.
- source_word: μὴ ἐργάζεσθαι
  choice: de não trabalhar
  rationale: 'Expressa de maneira concisa o conteúdo do direito reivindicado: deixar de exercer trabalho para o próprio sustento.'
theological_decisions:
- issue: Sentido de ἐξουσία no contexto
  choice: Paulo se refere ao direito apostólico de não trabalhar para o próprio sustento e de receber sustento material das igrejas.
  alternative: Paulo se refere genericamente a autoridade ou liberdade, sem referência específica ao sustento material.
  rationale: O contexto imediato trata dos direitos dos apóstolos, especialmente de receber alimento e sustento, bem como da renúncia voluntária de Paulo a esses direitos. A tradução mantém esse sentido contextual sem acrescentá-lo explicitamente ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A aparente dupla negação foi preservada porque corresponde à estrutura e à tensão retórica do grego; a nota esclarece o sentido contextual.
