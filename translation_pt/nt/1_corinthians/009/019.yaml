  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a slave to all, so that I might win more of them.
translation:
  language: pt
  text: Pois, sendo livre de todos, fiz-me escravo de todos[a], para ganhar mais pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fiz-me servo de todos». O grego emprega linguagem de escravidão; «escravo» foi mantido no texto porque o contraste com «livre» é central ao argumento de Paulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: livre
  rationale: Expressa a condição de quem não está sujeito à escravidão nem à obrigação; também mantém o contraste direto com «escravo».
- source_word: ἐκ πάντων
  choice: de todos
  rationale: Indica liberdade em relação a todas as pessoas. A formulação compacta preserva o paralelismo retórico entre «livre de todos» e «escravo de todos».
- source_word: πᾶσιν
  choice: de todos
  rationale: O dativo identifica aqueles a quem Paulo voluntariamente se subordinou; em português, «fazer-se escravo de alguém» é a construção natural.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: fiz-me escravo
  rationale: Preserva tanto a linguagem forte de escravidão quanto o caráter voluntário e reflexivo da ação de Paulo.
- source_word: ἵνα
  choice: para
  rationale: Introduz de modo claro e natural a finalidade da autossubordinação de Paulo.
- source_word: τοὺς πλείονας
  choice: mais pessoas
  rationale: O comparativo substantivado se refere a um número maior de pessoas. «Mais pessoas» torna explícito o referente implícito sem acrescentar a ideia mais forte de «o maior número possível».
- source_word: κερδήσω
  choice: ganhar
  rationale: Mantém a metáfora de obter ou conquistar pessoas no contexto da missão de Paulo, sem explicitar além do grego em que sentido elas são ganhas.
theological_decisions:
- issue: Tradução da linguagem de δουλόω
  choice: escravo
  alternative: servo
  rationale: A imagem de escravidão é central ao contraste entre ser livre de todos e submeter-se voluntariamente a todos. «Servo» é possível, mas suaviza a força retórica do verbo grego.
- issue: Sentido de τοὺς πλείονας
  choice: mais pessoas
  alternative: o maior número possível
  rationale: A tradução escolhida preserva o comparativo e a abertura do original. A alternativa expressa uma ideia plausível no contexto, mas introduz explicitamente uma noção de maximização que não está formulada no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «sendo livre» mantém a relação circunstancial do particípio grego sem tornar a concessão mais explícita do que no original; «pois» preserva a função explicativa de γάρ.
