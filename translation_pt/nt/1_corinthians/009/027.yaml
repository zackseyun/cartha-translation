  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my slave[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: pt
  text: Mas disciplino severamente o meu corpo[a] e faço dele meu escravo[b], para que, depois de ter pregado aos outros, eu mesmo não venha, de algum modo, a ser desqualificado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “golpeio o meu corpo”. O verbo grego refere-se literalmente a golpear sob o olho, mas aqui é usado como imagem de disciplina rigorosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu o escravizo” ou “eu o reduzo à escravidão”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “reprovado” ou “não aprovado”. “Desqualificado” corresponde à imagem atlética do contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: disciplino severamente
  rationale: O verbo pode significar literalmente golpear sob o olho, mas aqui, no contexto atlético, expressa disciplina corporal rigorosa. A formulação comunica a força da metáfora sem sugerir desnecessariamente automutilação literal.
- source_word: σῶμα
  choice: corpo
  rationale: Mantém o substantivo concreto empregado por Paulo, sem ampliá-lo para 'eu mesmo' ou 'minha pessoa'.
- source_word: δουλαγωγῶ
  choice: o faço meu escravo
  rationale: Preserva a metáfora forte de submeter alguém à escravidão, em vez de suavizá-la como simples controle.
- source_word: μή πως
  choice: para que ... não venha a
  rationale: Expressa em português natural a finalidade negativa ou o resultado temido introduzido pela locução grega.
- source_word: ἄλλοις
  choice: aos outros
  rationale: Representa naturalmente o dativo ligado ao ato de pregar.
- source_word: κηρύξας
  choice: depois de ter pregado
  rationale: Explicita a anterioridade do particípio aoristo em relação à possibilidade de vir a ser desqualificado.
- source_word: ἀδόκιμος
  choice: desqualificado
  rationale: Combina com a imagem atlética do contexto e preserva a ideia de não passar na avaliação, sem decidir se se trata especificamente de salvação, recompensa ou aptidão ministerial.
- source_word: γένωμαι
  choice: venha a ser
  rationale: Transmite o sentido prospectivo do subjuntivo e o resultado que Paulo procura evitar.
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca com clareza o contraste com os versículos anteriores.
theological_decisions:
- issue: Sentido do temor de Paulo de se tornar ἀδόκιμος
  choice: desqualificado
  alternative: rejeitado; reprovado; não aprovado
  rationale: A tradução mantém a seriedade da advertência e sua relação com a metáfora atlética, mas não determina se Paulo se refere à perda da salvação, da recompensa ou da utilidade ministerial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as ligações sintáticas foram ajustadas ao uso natural do português, preservando as metáforas fortes do texto grego e a ambiguidade teológica de ἀδόκιμος.
