reference: 1 Corinthians 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: pt
  text: Pois, se anuncio o evangelho[a], não tenho motivo para me gloriar, pois uma necessidade pesa sobre mim. Ai de mim se eu não anunciar o evangelho!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proclamo a boa notícia” / “proclamar a boa notícia”, respectivamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: anuncio / anunciar o evangelho
  rationale: O verbo significa proclamar boas notícias; neste contexto paulino, a mensagem implícita é o evangelho. A formulação é natural em português e mantém a força pública da proclamação nas duas ocorrências.
- source_word: καύχημα
  choice: motivo para me gloriar
  rationale: O substantivo indica aquilo que serve de base ou motivo para glória. A tradução deixa claro que Paulo não considera o anúncio do evangelho fundamento para exaltação própria.
- source_word: ἀνάγκη
  choice: necessidade
  rationale: O termo expressa necessidade, obrigação ou compulsão. “Necessidade” preserva a amplitude do grego sem definir indevidamente a origem ou a natureza da pressão.
- source_word: ἐπίκειται
  choice: sobre mim pesa
  rationale: O verbo descreve algo que repousa ou exerce pressão sobre alguém. A expressão portuguesa comunica o peso da obrigação e permanece natural.
- source_word: οὐαί
  choice: Ai de mim
  rationale: A expressão conserva o tom solene de aflição ou desastre iminente e é idiomática em português.
- source_word: ἐὰν μὴ
  choice: se eu não
  rationale: Reproduz de modo direto e claro a condição negativa do texto grego.
- source_word: γάρ
  choice: pois
  rationale: Mantém a função explicativa do conectivo nas duas ocorrências, embora a segunda introduza naturalmente a exclamação conclusiva.
theological_decisions:
- issue: Natureza da necessidade de Paulo anunciar o evangelho
  choice: “sobre mim pesa essa necessidade”
  alternative: “sou obrigado a fazer isso” ou “Deus me encarregou disso”
  rationale: O versículo afirma que uma necessidade pesa sobre Paulo, mas não identifica explicitamente aqui se a ênfase recai na comissão divina, na compulsão interior ou em outra forma de obrigação. A tradução conserva essa abertura.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. “Gloriar” preserva o registro paulino sem recorrer a formulação excessivamente arcaica.
