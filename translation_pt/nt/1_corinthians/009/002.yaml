id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: pt
  text: Se para outros não sou apóstolo, pelo menos para vocês sou, pois vocês são o selo[a] do meu apostolado no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prova” ou “confirmação da autenticidade”. O grego diz literalmente “selo”, preservando a imagem de algo que atesta que uma coisa é genuína.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Na defesa que Paulo faz de si mesmo, o termo indica sua comissão reconhecida como apóstolo, e não apenas um mensageiro em sentido genérico.
- source_word: ἀλλά γε
  choice: pelo menos ... sou
  rationale: A expressão introduz contraste enfático e afirma que, quaisquer que sejam as dúvidas de outros, os coríntios não poderiam negar a relação apostólica de Paulo com eles.
- source_word: σφραγίς
  choice: selo
  rationale: Mantém a metáfora grega de uma marca que confirma autenticidade, enquanto a nota explicita sua força probatória no contexto.
- source_word: ἀποστολή
  choice: apostolado
  rationale: Designa aqui a comissão ou condição apostólica de Paulo; “apostolado” preserva o vínculo lexical com “apóstolo” e é natural em português.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a fórmula paulina e mantém aberta sua amplitude relacional, sem reduzi-la à mera ideia de agência divina.
- source_word: ἄλλοις
  choice: para outros
  rationale: Reproduz de modo natural o dativo relacional ligado à afirmação de ser apóstolo.
theological_decisions:
- issue: Alcance da afirmação de Paulo sobre seu apostolado
  choice: A frase admite retoricamente que outros talvez não reconheçam Paulo como apóstolo, mas afirma enfaticamente que os coríntios são evidência de seu apostolado.
  alternative: Paulo estaria limitando literalmente seu apostolado apenas aos coríntios.
  rationale: O contexto é uma defesa retórica da autoridade apostólica de Paulo; a existência da comunidade coríntia no Senhor autentica sua comissão, sem necessariamente restringi-la a essa igreja.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase conserva o contraste retórico do grego, e “no Senhor” permanece ligado à afirmação inteira sem explicitar além do texto se indica esfera, união ou fundamento.
