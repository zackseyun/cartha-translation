  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: pt
  text: Aos fracos, tornei-me fraco[a], para ganhar os fracos. Tornei-me tudo para todos, para, por todos os meios[b], salvar alguns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fracos na consciência»; em 1 Coríntios, esta expressão pode referir-se especificamente àqueles cuja consciência é vulnerável.
    reason: lexical_alternative
  - marker: b
    text: Ou «de todas as maneiras»; a expressão indica o uso de todos os meios possíveis na busca desse objetivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: tornei-me
  rationale: O aoristo de γίνομαι descreve a adaptação de Paulo em situações de seu ministério; «tornei-me» é natural e preserva a ideia de assumir uma condição ou postura.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: fracos
  rationale: A repetição de «fraco» preserva a força retórica do grego. No contexto de 1 Coríntios, a expressão pode incluir pessoas de consciência vulnerável, mas o versículo mantém a categoria ampla.
- source_word: κερδήσω
  choice: ganhar
  rationale: No contexto evangelístico, κερδαίνω significa conquistar pessoas, ou ganhá-las, em vez de obter simples vantagem; «ganhar» é conciso e idiomático em português.
- source_word: τοῖς πᾶσιν
  choice: para com todos
  rationale: A expressão dativa é elíptica e indica a relação de Paulo com todo tipo de pessoa; «para com todos» explicita essa relação sem restringir o alcance.
- source_word: γέγονα
  choice: tornei-me
  rationale: Embora seja perfeito, o resultado presente pode ser comunicado naturalmente em português por «tornei-me» dentro da declaração de uma postura ministerial vigente, evitando a forma menos natural «tenho me tornado».
- source_word: πάντα
  choice: tudo
  rationale: «Tudo para com todos» preserva a amplitude e o paralelismo compacto da formulação grega, sem sugerir literalmente que Paulo se tornou todas as coisas.
- source_word: πάντως
  choice: por todos os meios
  rationale: Neste contexto, o advérbio indica o emprego de todos os meios possíveis em busca do objetivo. A tradução evita a possível conotação de compromisso antiético presente em «a qualquer custo».
- source_word: τινὰς
  choice: alguns
  rationale: 'O pronome indefinido mantém a modéstia deliberada da afirmação: Paulo não diz que todos seriam salvos por seu trabalho.'
- source_word: σώσω
  choice: salvar
  rationale: σῴζω conserva aqui seu peso soteriológico. «Salvar» traduz diretamente o verbo e deixa que o contexto determine o papel instrumental de Paulo.
theological_decisions:
- issue: Sentido de «os fracos» no contexto
  choice: Manter a expressão ampla «os fracos» no texto principal.
  alternative: «os de consciência fraca» ou «os sem força»
  rationale: Em 1 Coríntios, «fraco» pode referir-se especialmente a pessoas cuja consciência é vulnerável, sobretudo nos capítulos 8–10; contudo, a redação imediata é geral e paralela aos grupos mencionados no contexto. Restringi-la no texto principal resolveria uma ambiguidade que o grego preserva.
- issue: Força de «salvar»
  choice: Empregar «salvar» para expressar o objetivo evangelístico de Paulo.
  alternative: «levar alguns à salvação» ou «ajudar a salvar alguns»
  rationale: O verbo grego é linguagem genuína de salvação. Uma formulação mais fraca subestimaria o texto, enquanto uma paráfrase que definisse Paulo como agente último diria mais do que ele afirma. O contexto permite entender seu papel como instrumental.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade no Brasil e em outros contextos lusófonos. Preservou-se a repetição retórica de «fraco» e a tensão da afirmação «salvar alguns». Os marcadores [a] e [b] aparecem junto às expressões que explicam.
