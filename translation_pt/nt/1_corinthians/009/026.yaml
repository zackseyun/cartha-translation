  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: pt
  text: Portanto, corro assim, não sem rumo[a]; assim luto como boxeador, não como quem golpeia o ar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não de modo incerto”. O advérbio grego pode indicar falta de clareza ou falta de um objetivo definido; na imagem da corrida, “sem rumo” destaca a ideia de correr sem um alvo claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Portanto
  rationale: Marca a conclusão prática que Paulo tira da analogia atlética anterior, de modo natural e claro em português.
- source_word: οὕτως
  choice: assim
  rationale: Preserva a repetição enfática do grego e indica o modo como Paulo corre e luta.
- source_word: τρέχω
  choice: corro
  rationale: Mantém diretamente a metáfora da corrida e o presente vívido do texto-fonte.
- source_word: ἀδήλως
  choice: sem rumo
  rationale: No contexto da corrida, comunica a ausência de direção ou alvo definido, preservando em nota a alternativa ligada à incerteza.
- source_word: πυκτεύω
  choice: luto como boxeador
  rationale: Explicita o sentido específico de lutar com os punhos sem recorrer ao anglicismo verbal “boxear”, menos corrente em parte do mundo lusófono.
- source_word: ἀέρα
  choice: o ar
  rationale: Mantém a imagem concreta do texto grego.
- source_word: δέρων
  choice: golpeando
  rationale: Expressa de maneira natural os golpes do boxe e conserva a imagem de golpes ineficazes dirigidos ao ar.
