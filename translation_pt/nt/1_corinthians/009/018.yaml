id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: pt
  text: Qual é, então, a minha recompensa? É que, ao anunciar as boas-novas, eu apresente gratuitamente as boas-novas[a], sem fazer pleno uso do meu direito no anúncio das boas-novas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o evangelho”, em todas as ocorrências neste versículo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem fazer pleno uso do meu direito no ministério do evangelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: recompensa
  rationale: No contexto, designa a recompensa de Paulo por seu serviço, não apenas salário ou pagamento; a formulação preserva a ironia de que sua recompensa consiste em anunciar sem cobrar.
- source_word: εὐαγγελιζόμενος
  choice: ao anunciar as boas-novas
  rationale: Expressa de modo natural a ação simultânea do particípio e preserva sua força verbal.
- source_word: ἀδάπανον
  choice: gratuitamente
  rationale: Comunica com clareza que a mensagem é apresentada sem custo ou cobrança.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: eu apresente ... as boas-novas
  rationale: O sentido literal de 'pôr/colocar' assume aqui o valor contextual de apresentar ou oferecer; 'apresente' é natural sem apagar a construção grega.
- source_word: εὐαγγέλιον
  choice: boas-novas
  rationale: Traduz o sentido básico do termo em linguagem atual e compreensível; 'evangelho' é mantido como alternativa em nota.
- source_word: καταχρήσασθαι
  choice: fazer pleno uso
  rationale: Preserva a ideia de usar plenamente um direito legítimo sem introduzir indevidamente a noção de abuso ou exploração.
- source_word: ἐξουσίᾳ
  choice: direito
  rationale: O contexto trata especificamente do direito legítimo de Paulo ao sustento material, embora o termo também possa ter o sentido mais amplo de autoridade.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: no anúncio das boas-novas
  rationale: Explicita de maneira moderada a relação idiomática com a atividade ministerial, evitando o português pouco natural 'nas boas-novas'.
theological_decisions:
- issue: Natureza da ἐξουσία de Paulo no contexto
  choice: Um direito legítimo ligado ao sustento no anúncio das boas-novas, do qual Paulo decide não fazer pleno uso.
  alternative: Autoridade apostólica em sentido mais amplo, ou uso abusivo dessa autoridade.
  rationale: O contexto imediato de 1 Coríntios 9 trata repetidamente do direito apostólico ao sustento. A tradução não sugere que o direito fosse ilegítimo nem que seu exercício fosse necessariamente abusivo.
- issue: Sentido de ἐν τῷ εὐαγγελίῳ
  choice: no anúncio das boas-novas
  alternative: nas boas-novas; no ministério do evangelho
  rationale: A expressão grega é compacta e admite o sentido de 'em conexão com o evangelho'. A formulação escolhida torna explícita apenas a atividade já indicada por εὐαγγελιζόμενος, enquanto a nota conserva uma alternativa ministerial.
- issue: Tradução de εὐαγγέλιον
  choice: boas-novas
  alternative: evangelho
  rationale: A escolha comunica diretamente o sentido lexical em português moderno sem excluir a forma eclesiástica tradicional, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural lexicalizado “boas-novas” mantém a ideia de notícia favorável; a repetição do termo reproduz a ênfase do grego. As notas estão marcadas no texto principal e preservam tanto a alternativa tradicional “evangelho” quanto a possível explicitação ministerial da frase final.
