  source_fidelity: A tradução preserva a estrutura condicional e a pergunta retórica do grego. “Coisas espirituais” e “coisas materiais” refletem adequadamente o contraste entre τὰ πνευματικά e τὰ σαρκικά neste contexto de sustento ministerial. “Semeamos” é uma forma portuguesa apropriada para a ação passada do aoristo, e “colhermos” transmite bem a perspectiva futura na oração condicional.
  naturalness: O texto é claro, idiomático e de registro moderno e digno. “Entre vocês”, “de vocês” e “será demais” soam naturais para o português internacional com boa legibilidade brasileira. A repetição explícita de “nós” no início conserva suficientemente a ênfase sem tornar a frase pesada.
  terminology: “Coisas materiais” evita corretamente a leitura moralmente negativa que “coisas carnais” poderia causar. A nota oferece uma alternativa legítima e explica de modo sóbrio o contraste lexical, sem restringir indevidamente os termos gregos.
