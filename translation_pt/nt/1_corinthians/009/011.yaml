id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: pt
  text: Se nós semeamos entre vocês coisas espirituais, será demais se colhermos de vocês coisas materiais?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas desta vida”. O grego contrasta as “coisas espirituais” com aquilo que pertence à vida física ou material comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: coisas espirituais
  rationale: O adjetivo neutro plural substantivado tem sentido amplo, abrangendo os benefícios e o ministério espirituais, sem restringi-los a um objeto específico.
- source_word: ἐσπείραμεν
  choice: semeamos
  rationale: O aoristo aponta para o trabalho ministerial já realizado por Paulo e seus companheiros; o pretérito perfeito simples é natural em português e preserva a metáfora agrícola.
- source_word: μέγα
  choice: demais
  rationale: Na pergunta retórica, comunica de modo idiomático a ideia de algo excessivo ou desproporcional.
- source_word: τὰ σαρκικὰ
  choice: coisas materiais
  rationale: No contexto, designa sustento pertencente à vida física e temporal. Evita que 'carnais' sugira conduta pecaminosa, que não está em vista aqui.
- source_word: θερίσομεν
  choice: colhermos
  rationale: O futuro grego prossegue a metáfora da semeadura e colheita. Em português, a construção 'será demais se colhermos' expressa naturalmente a perspectiva futura.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Expressa de forma natural a origem do sustento que seria recebido dos coríntios.
- source_word: ἡμεῖς
  choice: nós
  rationale: Mantém o pronome explícito e sua ênfase no contraste entre o trabalho apostólico e o sustento esperado.
theological_decisions:
- issue: Sentido de σαρκικὰ em contraste com πνευματικὰ
  choice: Refere-se a recursos materiais ou ao sustento físico do ministério, sem conotação moral negativa.
  alternative: coisas carnais
  rationale: O contexto defende o direito dos apóstolos de receber sustento. O contraste é entre o benefício espiritual oferecido e a provisão material recebida, não entre santidade e pecado.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para leitura amplamente natural no Brasil. A metáfora agrícola e a pergunta retórica do grego foram preservadas.
