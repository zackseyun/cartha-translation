id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: pt
  text: Vocês não sabem que, no estádio,[a] todos os corredores correm, mas apenas um recebe o prêmio? Corram de tal maneira que o alcancem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na pista de corrida”. O grego στάδιον se refere ao lugar onde se realizava a corrida, isto é, um estádio ou uma pista.
    reason: lexical_alternative
  - marker: b
    text: Ou “Corram assim, para que o obtenham” ou “para que se apoderem dele”. O verbo grego καταλαμβάνω pode significar alcançar, obter ou apoderar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Preserva a fórmula retórica paulina e o sentido lexical de οἶδα, em português natural e amplamente compreensível.
- source_word: οἱ ἐν σταδίῳ τρέχοντες
  choice: no estádio, todos os corredores correm
  rationale: Mantém o cenário concreto da pista de competição e a repetição da ideia de correr, com sintaxe natural em português.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: todos ... mas apenas um
  rationale: Expressa claramente o contraste μέν...δέ; “apenas” torna idiomático o valor contrastivo sem acrescentar uma conclusão teológica.
- source_word: λαμβάνει τὸ βραβεῖον
  choice: recebe o prêmio
  rationale: “Recebe” conserva o sentido direto de λαμβάνει, enquanto “prêmio” é a designação natural do βραβεῖον atlético.
- source_word: οὕτως τρέχετε
  choice: Corram de tal maneira
  rationale: Preserva a força do imperativo e apresenta οὕτως como referência ao modo de correr ilustrado anteriormente.
- source_word: ἵνα καταλάβητε
  choice: que o alcancem
  rationale: “Alcançar” comporta os sentidos de atingir, obter ou apoderar-se e funciona naturalmente com o prêmio implícito como objeto.
theological_decisions:
- issue: Aplicação da metáfora atlética à perseverança cristã
  choice: Manter a imagem competitiva e a exortação a correr visando alcançar o prêmio.
  alternative: Explicitar como “corram para vencer” ou definir o prêmio em termos de salvação, mérito ou recompensa específica.
  rationale: O grego exorta à busca disciplinada por meio da analogia atlética, mas não resolve neste versículo a natureza exata do prêmio nem debates sobre mérito e perseverança.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para o plural e imperativo “corram”, de ampla legibilidade brasileira. A formulação preserva a pergunta retórica, a imagem atlética concreta e a ambiguidade lexical de καταλάβητε.
