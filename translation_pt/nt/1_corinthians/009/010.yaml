id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: pt
  text: Ou será que é inteiramente por nossa causa que ele diz isso? Sim[a], foi escrito por nossa causa, pois quem ara deve arar com esperança, e quem debulha deve debulhar com esperança de participar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O advérbio grego também pode ser entendido como “certamente” ou “sem dúvida”, intensificando a pergunta retórica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com esperança de participar”. O objeto — como a produção ou a colheita — fica implícito no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: inteiramente
  rationale: No contexto da pergunta retórica, o advérbio intensifica a afirmação. “Inteiramente” preserva a possibilidade de sentido abrangente, enquanto a nota registra alternativas modais como “certamente”.
- source_word: δι’ ἡμᾶς
  choice: por nossa causa
  rationale: διά com acusativo pode expressar causa ou benefício. “Por nossa causa” é natural e mantém a repetição enfática nas duas ocorrências.
- source_word: ἐγράφη
  choice: foi escrito
  rationale: Traduz diretamente o aoristo passivo e é idiomático em português no contexto de uma referência às Escrituras.
- source_word: ὀφείλει
  choice: deve
  rationale: Expressa obrigação ou expectativa legítima sem recorrer a uma formulação excessivamente técnica.
- source_word: ἐπ’ ἐλπίδι
  choice: com esperança / com a esperança
  rationale: A expressão indica a expectativa que acompanha e motiva o trabalho. A pequena variação com artigo torna a segunda oração natural em português.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: quem ara deve arar
  rationale: Mantém a construção genérica e a repetição verbal do grego, sem introduzir marcação de gênero desnecessária.
- source_word: ὁ ἀλοῶν
  choice: quem debulha
  rationale: “Debulhar” comunica em português corrente o trabalho agrícola de separar os grãos e preserva o paralelismo com “quem ara”.
- source_word: τοῦ μετέχειν
  choice: de receber uma parte
  rationale: μετέχω indica participar ou ter parte. Esta formulação comunica a expectativa de participação sem inserir no texto um objeto específico que o grego deixa implícito.
theological_decisions:
- issue: Objeto implícito de μετέχειν
  choice: Mantido indeterminado em “receber uma parte”
  alternative: “participar da colheita” ou “receber parte da colheita”
  rationale: O contexto agrícola sugere a produção ou colheita, mas o grego não declara o objeto. A tradução evita resolver essa abertura no texto principal; a nota esclarece a elipse.
- issue: Força de πάντως na pergunta retórica
  choice: “inteiramente”, seguido de “Sim” como resposta contextual
  alternative: “certamente” ou “sem dúvida”, sem resposta explícita
  rationale: A redação preserva a leitura abrangente do advérbio e torna explícita a resposta afirmativa exigida pelo fluxo do argumento, enquanto a nota reconhece outras análises lexicais legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo agrícola e as repetições do original foram preservados; ambiguidades lexicais e o objeto implícito foram registrados em notas.
