id: 1CO.9.20
reference: 1 Corinthians 9:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: pt
  text: E, para os judeus, tornei-me como judeu, a fim de ganhar os judeus[a]; para os que estão debaixo da Lei[b], como se estivesse debaixo da Lei — embora eu mesmo não esteja debaixo da Lei —, a fim de ganhar os que estão debaixo da Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conquistar”; o verbo pode significar ganhar ou conquistar alguém.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Lei” provavelmente se refere à Lei de Moisés.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: tornei-me
  rationale: O aoristo de γίνομαι descreve Paulo assumindo uma maneira de agir em relação a diferentes grupos. “Tornei-me” preserva diretamente essa ideia sem sugerir mudança de etnia.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: para os judeus ... como judeu
  rationale: Mantém a construção comparativa com ὡς e comunica adaptação de conduta, sem implicar que Paulo tenha deixado de ser judeu etnicamente.
- source_word: ἵνα ... κερδήσω
  choice: a fim de ganhar
  rationale: κερδαίνω pode significar literalmente obter ou ganhar e, neste contexto missionário, ganhar pessoas. A formulação conserva a metáfora do original e é natural em português.
- source_word: τοῖς ὑπὸ νόμον
  choice: para os que estão debaixo da Lei
  rationale: A expressão preposicional substantivada designa pessoas sujeitas à Lei. “Debaixo da Lei” preserva a imagem e a formulação paulina tradicional, sendo compreensível no português atual.
- source_word: ὡς ὑπὸ νόμον
  choice: como se estivesse debaixo da Lei
  rationale: A inclusão de “se estivesse” torna natural em português a expressão grega condensada e deixa claro seu caráter comparativo, confirmado pela ressalva seguinte.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: embora eu mesmo não esteja debaixo da Lei
  rationale: O particípio presente introduz uma ressalva simultânea. “Embora” expressa naturalmente o contraste, e o presente mantém a declaração sobre a condição de Paulo.
- source_word: αὐτός
  choice: eu mesmo
  rationale: Preserva a ênfase do pronome grego na condição pessoal de Paulo.
- source_word: νόμος
  choice: Lei
  rationale: Neste contexto, νόμος provavelmente aponta para a Lei mosaica. A forma “Lei” mantém no texto a expressão paulina sem inserir a especificação interpretativa “de Moisés”.
theological_decisions:
- issue: Sentido da afirmação de Paulo de que ele não está “debaixo da Lei”
  choice: 'Traduzir diretamente como uma declaração da condição do próprio Paulo: “embora eu mesmo não esteja debaixo da Lei”.'
  alternative: Explicitar “debaixo da Lei de Moisés” ou harmonizar a frase com a linguagem do versículo 21 sobre a lei de Deus e a lei de Cristo.
  rationale: O grego deste versículo afirma apenas que Paulo não está debaixo da lei. A tradução não deve restringir nem harmonizar a afirmação por meio de palavras trazidas do versículo seguinte; assim, preserva-se a tensão retórica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “debaixo da Lei” foi mantida por sua função retórica, e os travessões destacam a ressalva parentética. Todos os marcadores de nota aparecem no texto principal.
