reference: 1 Corinthians 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: pt
  text: Para os que estão fora da lei, tornei-me como alguém fora da lei[a] — embora eu não esteja fora da lei de Deus, mas debaixo da lei do Messias[b] — a fim de ganhar os que estão fora da lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como alguém sem lei». Aqui, a expressão se refere aos que não estão debaixo da Lei mosaica, e não necessariamente a pessoas moralmente sem lei.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «mas dentro da lei do Messias»; também pode ser traduzido «mas sujeito à lei do Messias».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἀνόμοις / ἄνομος / τοὺς ἀνόμους
  choice: os que estão fora da lei / alguém fora da lei
  rationale: No contraste de 1 Coríntios 9:20–21, a expressão designa principalmente os que não estão sujeitos à Lei mosaica. A tradução mantém a repetição grega e evita que «sem lei» ou «transgressores» sugira necessariamente imoralidade.
- source_word: ὡς
  choice: como
  rationale: Indica a postura de adaptação de Paulo, sem afirmar que ele tenha passado a viver sem qualquer obrigação diante de Deus.
- source_word: μὴ ὢν
  choice: embora eu não esteja
  rationale: Explicita de modo natural em português o valor concessivo do particípio, que restringe a declaração anterior.
- source_word: ἄνομος θεοῦ
  choice: fora da lei de Deus
  rationale: Preserva o contraste verbal com «fora da lei» e entende o genitivo θεοῦ como relação com a lei pertencente a Deus, sem transformar a frase numa negação genérica de impiedade.
- source_word: ἔννομος Χριστοῦ
  choice: debaixo da lei do Messias
  rationale: «Debaixo da lei» comunica de forma corrente a ideia de estar sujeito à lei. «Messias» conserva aqui o valor titular de Χριστός.
- source_word: ἵνα κερδάνω
  choice: a fim de ganhar
  rationale: A construção expressa propósito. Neste contexto evangelístico, «ganhar» significa conquistar pessoas, não obter lucro.
- source_word: ἐγενόμην (subentendido pelo contexto de 9:20)
  choice: tornei-me
  rationale: O verbo da oração anterior continua subentendido na construção elíptica grega. Sua expressão em português produz uma frase completa e mantém o paralelismo contextual.
theological_decisions:
- issue: Sentido de ἄνομος neste contexto
  choice: Pessoas fora da esfera da Lei mosaica, especialmente gentios
  alternative: Pessoas moralmente sem lei, perversas ou rebeldes
  rationale: O contexto imediato contrasta os que estão debaixo da lei com os que estão fora dela. A ressalva de Paulo mostra que ele fala de posição em relação à Lei, não de abandono da obediência moral.
- issue: Sentido de ἔννομος Χριστοῦ
  choice: Paulo permanece sujeito à lei do Messias
  alternative: Paulo está dentro da lei em relação ao Messias
  rationale: A forma grega admite a imagem de estar dentro da esfera da lei ou sujeito a ela. «Debaixo da lei do Messias» comunica com clareza a responsabilidade contínua de Paulo sem identificar automaticamente essa lei com todas as disposições da aliança mosaica.
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Neste sintagma, Χριστός conserva força titular; «Messias» torna esse valor explícito sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. A repetição de «fora da lei» foi mantida por sua importância retórica. O verbo «tornei-me», subentendido no grego a partir do versículo anterior, foi expresso para completar a construção em português.
