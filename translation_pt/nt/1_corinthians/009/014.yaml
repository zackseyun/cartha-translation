id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: pt
  text: Do mesmo modo, o Senhor também ordenou que os que proclamam o evangelho vivam do evangelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, tirem seu sustento da proclamação do evangelho.
    reason: 'Esclarece o sentido contextual de “vivam do evangelho”: receber sustento material por seu trabalho de proclamação, e não obter vida espiritual do evangelho.'
lexical_decisions:
- source_word: οὕτως
  choice: Do mesmo modo
  rationale: Explicita de forma natural a analogia com os exemplos anteriores, preservando a força comparativa do termo.
- source_word: καὶ
  choice: também
  rationale: 'Transmite o valor aditivo: além dos exemplos já citados, o Senhor igualmente deu esta ordem.'
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É a correspondência tradicional e natural de κύριος; mantém a formulação da fonte sem explicitar no corpo do texto o provável referente, Jesus.
- source_word: διέταξεν
  choice: ordenou
  rationale: Expressa instrução dotada de autoridade, mais forte que uma simples orientação.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: os que proclamam
  rationale: Reproduz o particípio substantivado e conserva o sentido de anúncio público de καταγγέλλω em português atual.
- source_word: τὸ εὐαγγέλιον
  choice: o evangelho
  rationale: Termo estabelecido, compreensível e lexicalmente consistente no contexto paulino.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: do evangelho
  rationale: Preserva concisamente a ideia de fonte do sustento, deixando que o contexto esclareça que se trata do sustento decorrente do ministério do evangelho.
- source_word: ζῆν
  choice: vivam
  rationale: O presente do subjuntivo integra naturalmente em português a construção introduzida por “ordenou que” e preserva a força normativa.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter “o Senhor”, com provável referência a Jesus
  alternative: Explicitar “o Senhor Jesus” ou entender como referência divina mais geral
  rationale: No argumento paulino, a expressão provavelmente alude ao ensino de Jesus, mas a tradução não acrescenta “Jesus”, preservando a formulação e a medida de explicitude da fonte.
- issue: Natureza do sustento em “vivam do evangelho”
  choice: Sustento material dos que proclamam o evangelho
  alternative: Vida espiritual derivada do evangelho
  rationale: O contexto imediato trata do direito ao sustento material. A formulação relativamente literal preserva a expressão grega, enquanto a nota esclarece seu sentido contextual sem inserir uma paráfrase no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Do mesmo modo” torna clara a ligação analógica; “proclamam” mantém o tom público do anúncio; “vivam do evangelho” conserva a concisão e a tensão da expressão original, com esclarecimento em nota.
