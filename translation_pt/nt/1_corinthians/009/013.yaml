  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: pt
  text: Não sabem que os que realizam os serviços sagrados comem do que vem do templo[a], e que os que servem junto ao altar recebem uma parte do que é oferecido no altar[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os que trabalham com as coisas sagradas comem as coisas que vêm do templo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “partilham com o altar”, isto é, recebem uma porção dos sacrifícios oferecidos ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Não sabem
  rationale: Preserva a fórmula retórica paulina em linguagem portuguesa natural e reconhecível.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: os que realizam os serviços sagrados
  rationale: O grego fala literalmente dos que trabalham com as coisas sagradas; no contexto, a expressão designa quem exerce o serviço do templo. A formulação comunica essa função sem introduzir estruturas eclesiásticas posteriores.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: comem do que vem do templo
  rationale: Mantém tanto o verbo concreto 'comer' quanto a ideia de que o sustento procede das provisões do templo.
- source_word: ἱεροῦ
  choice: templo
  rationale: Ἱερόν normalmente se refere ao templo ou ao seu recinto, e 'templo' é a equivalência padrão mais clara neste contexto.
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: os que servem junto ao altar
  rationale: O particípio indica pessoas postadas junto ao altar para atendê-lo; 'servem junto ao altar' preserva tanto a posição quanto a função cultual.
- source_word: τῷ θυσιαστηρίῳ συμμερίζονται
  choice: recebem uma parte das ofertas do altar
  rationale: A expressão literal 'partilham com o altar' pode soar obscura em português. A tradução explicita com moderação que essas pessoas recebem a porção ligada aos sacrifícios apresentados no altar.
theological_decisions:
- issue: Serviço sagrado e sustento material
  choice: Preservar a analogia entre o serviço no templo e o recebimento de sustento proveniente desse serviço.
  alternative: 'Traduzir de modo estritamente literal: ''partilham com o altar''.'
  rationale: O argumento de Paulo depende do costume de os servidores do culto receberem uma porção das ofertas. A redação torna essa relação compreensível sem aplicá-la diretamente a cargos ou instituições eclesiásticas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica e o paralelismo das duas orações foram preservados; termos excessivamente técnicos ou denominacionais foram evitados.
