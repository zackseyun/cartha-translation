base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: pt
  text: Não temos o direito de comer e beber?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “autoridade para comer e beber”. Aqui, “o direito” indica uma prerrogativa ou liberdade legítima, provavelmente no sentido de receber sustento material, conforme o argumento de Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Não temos nós...?
  rationale: A combinação introduz uma pergunta retórica que espera resposta positiva. A formulação preserva a força interrogativa e afirmativa em português natural e digno.
- source_word: ἔχομεν
  choice: temos
  rationale: O presente do indicativo é vertido diretamente; “possuímos” seria formal demais neste contexto.
- source_word: ἐξουσίαν
  choice: o direito
  rationale: Aqui o termo indica prerrogativa ou liberdade legítima, e não poder bruto nem autoridade governante. “O direito” comunica bem a reivindicação apostólica no argumento.
- source_word: φαγεῖν
  choice: de comer
  rationale: O infinitivo dependente de ἐξουσίαν é expresso naturalmente em português pela construção “direito de comer”.
- source_word: καὶ πεῖν
  choice: e beber
  rationale: A coordenação sem repetir a preposição é idiomática em português e preserva integralmente o sentido.
theological_decisions:
- issue: Alcance da prerrogativa apostólica no contexto
  choice: O texto principal mantém a formulação geral “direito de comer e beber”, entendida no contexto como a prerrogativa legítima dos apóstolos ou trabalhadores de receber sustento material.
  alternative: Uma declaração geral sobre a liberdade humana comum de comer e beber.
  rationale: O contexto imediato de 1 Coríntios 9 trata dos direitos de Paulo como apóstolo, especialmente do sustento por parte daqueles a quem serve. A tradução não insere “receber sustento” no texto principal, evitando explicitar mais do que o grego, mas a nota esclarece a provável força contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Não temos nós” conserva a força retórica sem recorrer a uma paráfrase explicativa.
