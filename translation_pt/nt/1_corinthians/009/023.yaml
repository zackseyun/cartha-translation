id: 1CO.9.23
reference: 1 Corinthians 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: pt
  text: Mas faço tudo por causa das boas-novas[a], para que eu me torne coparticipante delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa do evangelho” ou “em favor do evangelho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que eu participe delas” ou “para que eu me torne parceiro delas”.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O acusativo neutro plural de πᾶς tem sentido abrangente; “tudo” é a forma natural e completa em português.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz aqui um contraste leve com o que precede; “Mas” preserva essa nuance adversativa.
- source_word: ποιῶ
  choice: faço
  rationale: O presente do indicativo expressa a prática contínua ou habitual de Paulo, adequadamente comunicada pelo presente simples.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: por causa das boas-novas
  rationale: διά com acusativo pode indicar motivo, finalidade ou benefício. “Por causa das boas-novas” preserva essa amplitude melhor que uma formulação exclusivamente final, enquanto “boas-novas” torna εὐαγγέλιον acessível sem perder o sentido.
- source_word: ἵνα
  choice: para que
  rationale: Introduz uma oração de finalidade; “para que” mantém naturalmente a força télica.
- source_word: συγκοινωνὸς
  choice: coparticipante
  rationale: O substantivo designa alguém que participa juntamente com outros. “Coparticipante” preserva o elemento associativo do prefixo συν- sem definir indevidamente a natureza dessa participação.
- source_word: αὐτοῦ
  choice: delas
  rationale: O pronome retoma τὸ εὐαγγέλιον. Como “boas-novas” é plural em português, a retomada idiomática exige “delas”.
- source_word: γένωμαι
  choice: eu me torne
  rationale: O aoristo subjuntivo médio de γίνομαι após ἵνα conserva uma nuance de vir a ser, expressa por “me torne”, em vez do simples “seja”.
theological_decisions:
- issue: Natureza da participação de Paulo nas boas-novas
  choice: Manter a participação ampla e não especificada
  alternative: Explicitar participação nas bênçãos, na propagação das boas-novas ou no ministério do evangelho
  rationale: συγκοινωνός pode abranger participação nas boas-novas, em seus benefícios ou em sua missão. “Coparticipante delas” preserva essa tensão sem impor uma interpretação sacramental, mística ou exclusivamente ministerial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” favorece a transparência lexical; a nota registra o termo eclesial tradicional “evangelho”. “Coparticipante” é um pouco mais formal, mas reproduz de modo conciso o sentido compartilhado de συγκοινωνός.
