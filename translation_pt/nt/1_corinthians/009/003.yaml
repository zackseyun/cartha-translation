  source_fidelity: 'O sentido central está correto: ἀπολογία é bem traduzido por “defesa”, e ἀνακρίνουσιν por “examinam” preserva a ideia de escrutínio crítico. Contudo, o dativo τοῖς é expresso mais diretamente por “aos que”, como destinatários da defesa; “diante dos” é possível, mas introduz uma nuance forense de comparecimento que o grego não exige.'
