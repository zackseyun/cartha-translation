  text: This is my defense to those who examine me[a].
translation:
  language: pt
  text: Esta é a minha defesa aos que me examinam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a minha defesa aos que me julgam.”'
    reason: 'Alternativa lexical: ἀνακρίνω pode indicar examinar, interrogar ou julgar; no contexto, refere-se à avaliação crítica de Paulo.'
lexical_decisions:
- source_word: ἀπολογία
  choice: defesa
  rationale: No contexto, Paulo apresenta uma resposta às avaliações ou críticas sobre seu apostolado e seus direitos. “Defesa” expressa bem esse sentido sem sugerir pedido de desculpas.
- source_word: ἀνακρίνουσίν
  choice: examinam
  rationale: O particípio descreve pessoas que submetem Paulo a escrutínio ou avaliação crítica. “Examinam” preserva essa amplitude sem implicar necessariamente um veredito judicial definitivo.
- source_word: Ἡ ἐμὴ
  choice: minha
  rationale: O possessivo é direto; “minha” é natural em português e não acrescenta uma ênfase indevida como poderia ocorrer com “minha própria”.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: diante dos que me examinam
  rationale: O dativo identifica aqueles perante os quais a defesa é apresentada. “Diante dos” soa natural com “defesa” e conserva a possível tonalidade forense da expressão.
- source_word: ἐστιν αὕτη
  choice: Esta é
  rationale: A ordem portuguesa natural identifica o conteúdo imediato como a defesa de Paulo. O demonstrativo pode apontar para o que segue ou para sua argumentação no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve tonalidade forense. “Diante dos que” é amplamente compreensível e evita tanto tecnicismo jurídico excessivo quanto informalidade.
