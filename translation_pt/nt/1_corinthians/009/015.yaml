id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: pt
  text: Mas eu não me vali de nenhuma dessas coisas[a]. Contudo, não escrevi tudo isso para que se proceda assim comigo, pois eu preferiria morrer a— ninguém esvaziará o meu motivo de orgulho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido pelo contexto: “de nenhum desses direitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego interrompe a frase depois de “a—” e então retoma: “ninguém esvaziará o meu motivo de orgulho”. Muitas traduções regularizam a frase como “a deixar que alguém esvaziasse o meu motivo de orgulho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: não me vali
  rationale: O perfeito médio indica que Paulo não recorreu nem se beneficiou dos direitos que acabou de expor. “Não me vali” é natural em português e não sugere uso indevido.
- source_word: οὐδενὶ τούτων
  choice: de nenhuma dessas coisas
  rationale: Mantém a formulação abrangente do grego, enquanto a nota esclarece que o referente contextual são os direitos mencionados anteriormente.
- source_word: ἔγραψα ... ταῦτα
  choice: não escrevi tudo isso
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito; “tudo isso” remete à argumentação precedente sem tornar o português artificial.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: para que se proceda assim comigo
  rationale: Expressa a finalidade negada e a ideia de que Paulo não escreveu para obter para si o tratamento ou sustento descrito, preservando a construção impessoal do original.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: pois eu preferiria morrer
  rationale: Traduz de modo idiomático a comparação enfática de Paulo, sem atenuar sua determinação.
- source_word: τὸ καύχημά μου
  choice: o meu motivo de orgulho
  rationale: καύχημα pode indicar não apenas o ato de gloriar-se, mas também sua base ou motivo; aqui se refere à razão que Paulo tem para se orgulhar de anunciar sem cobrar.
- source_word: κενώσει
  choice: esvaziará
  rationale: Preserva a metáfora do verbo grego, que significa tornar vazio, sem conteúdo ou sem efeito. O contexto permite compreender o sentido de anular ou privar de valor.
theological_decisions:
- issue: Sintaxe interrompida depois de ἤ
  choice: 'Preservar a interrupção com travessão: “preferiria morrer a— ninguém esvaziará...”'
  alternative: 'Completar a ideia: “preferiria morrer a deixar que alguém esvaziasse o meu motivo de orgulho”.'
  rationale: O grego interrompe a comparação depois de “do que/a” e retoma com uma declaração independente. Manter a ruptura conserva a intensidade retórica e evita fornecer silenciosamente palavras ausentes do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o contraste, a metáfora de “esvaziar” e a quebra sintática enfática do original, sem resolver sua tensão retórica.
