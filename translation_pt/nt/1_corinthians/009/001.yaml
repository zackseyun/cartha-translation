id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: pt
  text: Não sou livre? Não sou apóstolo? Não vi Jesus, nosso Senhor? Não são vocês a minha obra no Senhor?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: livre
  rationale: Expressa diretamente a liberdade e os direitos que Paulo reivindica no contexto, mantendo a ligação com a discussão anterior sobre liberdade.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o sentido técnico do ofício apostólico de Paulo, e não apenas o de um mensageiro genérico.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jesus, nosso Senhor
  rationale: Segue de perto a ordem grega e usa a vírgula para tornar clara e natural em português a aposição do título cristológico.
- source_word: ἑόρακα
  choice: vi
  rationale: O perfeito grego aponta para uma visão passada de relevância contínua; no português corrente, o pretérito perfeito simples comunica isso com mais naturalidade que uma forma composta.
- source_word: ἔργον
  choice: obra
  rationale: Designa os coríntios como resultado do trabalho apostólico de Paulo e preserva a metáfora simples do original.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a conhecida expressão paulina e sua possível referência tanto à esfera quanto à relação em que se realiza a obra.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Não sou...? / Não vi...? / Não são...?
  rationale: Reproduz as perguntas retóricas negativas, todas formuladas de modo a esperar resposta afirmativa.
theological_decisions:
- issue: Sentido da afirmação de Paulo de que viu Jesus
  choice: Manter a formulação simples como evidência de seu apostolado
  alternative: Explicitar que Paulo viu Jesus ressuscitado
  rationale: O contexto relaciona essa visão com a condição apostólica de Paulo, mas o grego não contém a palavra “ressuscitado”; a tradução preserva essa tensão sem acrescentar uma explicação ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμεῖς. A sequência curta de quatro perguntas conserva a força retórica do grego. Não se acrescentou nota, pois “Jesus, nosso Senhor” transmite naturalmente a construção grega sem exigir alternativa textual.
