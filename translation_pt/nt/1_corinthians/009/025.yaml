id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: pt
  text: Todo aquele que compete exerce domínio próprio em todas as coisas. Eles fazem isso para receber uma coroa perecível[a], mas nós, uma imperecível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinalda”; a palavra grega se refere à grinalda do vencedor concedida nas competições atléticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Todo aquele
  rationale: O singular genérico abrange qualquer pessoa que participa da competição e soa natural em português.
- source_word: ἀγωνιζόμενος
  choice: que compete
  rationale: No contexto atlético imediato, o verbo descreve a participação numa disputa; “compete” preserva claramente essa imagem.
- source_word: πάντα
  choice: em todas as coisas
  rationale: Expressa a abrangência do domínio próprio sem restringi-lo apenas à alimentação ou ao treinamento.
- source_word: ἐγκρατεύεται
  choice: exerce domínio próprio
  rationale: Comunica uma prática ativa e habitual de autocontrole, adequada à disciplina do atleta.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Eles fazem isso
  rationale: Retoma os competidores e explicita de modo natural em português a ação subentendida, mantendo o contraste com “nós”.
- source_word: ἵνα
  choice: para
  rationale: Marca de maneira concisa e natural a finalidade da disciplina.
- source_word: φθαρτὸν
  choice: perecível
  rationale: Forma um contraste direto e claro com “imperecível”, preservando a oposição do grego.
- source_word: στέφανον
  choice: coroa
  rationale: Mantém a metáfora concisa de honra e recompensa; a nota esclarece que, no contexto atlético, se trata da grinalda do vencedor.
- source_word: λάβωσιν
  choice: receber
  rationale: É idiomático para um prêmio concedido e representa adequadamente o subjuntivo de finalidade após ἵνα.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: mas nós, uma imperecível
  rationale: Preserva a elipse de “coroa” existente no grego, usando a vírgula para tornar a construção clara em português.
theological_decisions:
- issue: Natureza da metáfora da recompensa
  choice: Manter a imagem do prêmio atlético como “coroa”, sem definir seu referente doutrinário.
  alternative: Explicitar a coroa como vida eterna ou como recompensas celestiais.
  rationale: O versículo não identifica com precisão doutrinária a recompensa; preservar a metáfora mantém a amplitude e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora atlética, o contraste perecível/imperecível e a elipse final do original.
