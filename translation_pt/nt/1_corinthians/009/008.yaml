id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: pt
  text: Será que digo essas coisas de uma perspectiva meramente humana[a]? Ou a Lei também não diz essas coisas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de um ponto de vista humano” ou “segundo o homem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Será que... ?
  rationale: Introduz uma pergunta retórica que espera resposta negativa; esta formulação soa natural em português e preserva essa força.
- source_word: κατὰ ἄνθρωπον
  choice: segundo critérios meramente humanos
  rationale: Expressa uma base ou perspectiva exclusivamente humana, em contraste com o testemunho da Lei, sem reduzir a expressão a simplesmente 'como homem'.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o plural e retoma o argumento apresentado por Paulo nos versículos anteriores.
- source_word: λαλῶ
  choice: digo
  rationale: O presente refere-se ao que Paulo está dizendo no argumento em curso; 'digo' é direto e natural em português.
- source_word: ἢ
  choice: Ou
  rationale: Preserva a conjunção disjuntiva que introduz o testemunho alternativo — e adicional — da Lei.
- source_word: καὶ
  choice: também
  rationale: 'Mantém o valor aditivo: a Lei dá testemunho além do raciocínio apresentado.'
- source_word: ὁ νόμος
  choice: a Lei
  rationale: Refere-se à Lei mosaica, como confirma a citação de Deuteronômio 25:4 no versículo seguinte; a inicial maiúscula assinala esse referente específico.
- source_word: οὐ λέγει
  choice: não diz
  rationale: Preserva a forma negativa da pergunta retórica grega, cuja resposta esperada é afirmativa.
theological_decisions:
- issue: Referente de 'a Lei' no argumento de Paulo
  choice: '''a Lei'' designa a Lei mosaica ou o corpus legal das Escrituras'
  alternative: lei como princípio genérico
  rationale: O versículo seguinte cita Deuteronômio 25:4, mostrando que Paulo apela especificamente à Lei nas Escrituras, sem exigir explicitação adicional no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira pergunta mantém sua expectativa de resposta negativa, e a segunda conserva a estrutura retórica negativa do grego. 'Critérios' comunica a ideia de base ou padrão humano sem transformar a expressão em uma afirmação sobre autoridade de modo excessivamente interpretativo.
