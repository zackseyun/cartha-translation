  to: Pois, se faço isso de livre vontade, tenho uma recompensa; mas, se o faço contra a minha vontade, foi-me confiada uma administração.[a]
  rationale: A revisão limita-se ao termo que traduz οἰκονομία. “Uma administração” evita a ambiguidade introduzida por “encargo de administrador” e conserva a noção de uma gestão ou responsabilidade recebida em confiança. A inclusão de “uma” antes de “recompensa” acompanha naturalmente o sentido de μισθόν sem alterar o contraste do versículo.
