  naturalness: “De livre vontade” e “contra a minha vontade” são naturais, claras e mantêm adequadamente o paralelismo. “Foi-me confiada uma administração” é uma formulação formal, mas idiomática e apropriada ao registro da carta.
  terminology: “Administração” preserva de modo mais direto a metáfora de gestão confiada em οἰκονομία do que “encargo de administrador”. A nota com “missão” é uma alternativa contextual legítima, desde que permaneça como alternativa e não substitua a imagem principal.
