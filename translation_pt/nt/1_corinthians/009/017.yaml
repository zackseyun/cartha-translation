id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: pt
  text: Pois, se faço isso de livre vontade, tenho uma recompensa; mas, se o faço contra a minha vontade, foi-me confiada uma administração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi-me confiada uma missão”.'
    reason: Alternativa contextual para οἰκονομία, que pode salientar a incumbência confiada, embora expresse menos diretamente a imagem de administração.
lexical_decisions:
- source_word: ἑκὼν
  choice: de livre vontade
  rationale: Expressa de modo natural a ação voluntária e mantém o contraste direto com ἄκων, sem acrescentar a ideia de entusiasmo.
- source_word: τοῦτο πράσσω
  choice: faço isso
  rationale: Conserva a referência ampla à ação ministerial discutida no contexto, sem explicitar além do que o grego diz.
- source_word: μισθὸν
  choice: recompensa
  rationale: Neste contexto, indica a retribuição pelo serviço voluntário; “recompensa” preserva um sentido mais amplo que salário ou pagamento.
- source_word: ἄκων
  choice: contra a minha vontade
  rationale: É o antônimo de ἑκών e comunica falta de voluntariedade sem sugerir necessariamente relutância emocional.
- source_word: οἰκονομίαν
  choice: um encargo de administrador
  rationale: Torna compreensível a ideia de administrar uma responsabilidade recebida em confiança e preserva a metáfora administrativa de οἰκονομία.
- source_word: πεπίστευμαι
  choice: foi-me confiado
  rationale: 'Reproduz o perfeito passivo: o encargo foi confiado a Paulo, e essa responsabilidade permanece sobre ele.'
theological_decisions:
- issue: A natureza do ministério de Paulo na segunda oração
  choice: Mesmo que não aja de livre vontade, Paulo continua responsável por um encargo que lhe foi confiado.
  alternative: Paulo recebe apenas uma obrigação, e não recompensa, quando age contra a vontade; ou ele contrasta serviço voluntário e ofício compulsório sem negar o chamado divino.
  rationale: O texto contrapõe μισθὸν ἔχω a οἰκονομίαν πεπίστευμαι. A tradução mantém a tensão entre recompensa pelo serviço voluntário e responsabilidade confiada, sem impor uma teoria denominacional do ministério.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “De livre vontade” e “contra a minha vontade” formam um contraste natural; “encargo de administrador” evita o termo técnico e menos transparente “mordomia”.
