  source_fidelity: A tradução preserva a pergunta retórica, a negação futura de κληρονομήσουσιν e a sequência de categorias da lista. «Os injustos», «o reino de Deus» e «não herdarão» correspondem bem ao grego. Para μαλακοί e ἀρσενοκοῖται, o texto mantém termos distintos e as notas registram apropriadamente a incerteza lexical, sem transformar categorias antigas em identidades modernas.
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. O uso de «vocês» é idiomático, e o paralelismo com «nem» reproduz bem a força enumerativa do original. «Homens efeminados» é uma formulação marcada no uso contemporâneo, mas a nota explicita que se trata de uma opção lexical limitada e contestada, o que evita falsa precisão.
  terminology: «Injustos», «reino de Deus», «idólatras» e «adúlteros» são termos estabelecidos e adequados. As duas notas estão ancoradas nos respectivos termos gregos em português e distinguem corretamente μαλακοί de ἀρσενοκοῖται. A formulação descritiva para ἀρσενοκοῖται evita linguagem identitária anacrônica.
