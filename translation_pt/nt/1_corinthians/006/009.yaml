  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: pt
  text: 'Ou vocês não sabem que os injustos não herdarão o reino de Deus? Não se enganem: nem os sexualmente imorais, nem os idólatras, nem os adúlteros, nem os homens efeminados[a], nem os homens que têm relações sexuais com outros homens[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego μαλακοί significa literalmente “macios” ou “suaves”. Aplicado a homens, pode significar “efeminados”, “moralmente fracos” ou, neste contexto, talvez “prostitutos” ou parceiros passivos em relações sexuais entre homens.
    reason: lexical_alternative
  - marker: b
    text: O termo grego ἀρσενοκοῖται é raro e seu alcance exato é debatido. Pode ser traduzido como “homens que praticam sexo com homens”, “sodomitas” ou, de modo mais amplo, “homens que mantêm relações sexuais ilícitas com pessoas do sexo masculino”. Muitos o relacionam à formulação grega de Levítico.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ou
  rationale: Mantém a transição retórica incisiva que liga esta pergunta ao argumento anterior.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Reproduz a fórmula retórica paulina em português corrente; o plural explícito evita a ambiguidade de número.
- source_word: ἄδικοι
  choice: os injustos
  rationale: Preserva a categoria moral ampla do grego, sem reduzi-la apenas a determinados atos.
- source_word: θεοῦ βασιλείαν
  choice: o reino de Deus
  rationale: Expressão bíblica tradicional, clara e diretamente correspondente à construção grega.
- source_word: οὐ κληρονομήσουσιν
  choice: não herdarão
  rationale: Conserva a linguagem de herança e suas ressonâncias pactuais e escatológicas.
- source_word: μὴ πλανᾶσθε
  choice: Não se enganem
  rationale: Forma natural em português que admite a advertência contra o autoengano, embora o grego também possa ser entendido como 'não sejam enganados'.
- source_word: πόρνοι
  choice: os sexualmente imorais
  rationale: Comunica a amplitude do termo sem recorrer ao arcaico e mais estreito 'fornicadores'.
- source_word: εἰδωλολάτραι
  choice: os idólatras
  rationale: Equivalente direto, conciso e amplamente compreensível.
- source_word: μοιχοὶ
  choice: os adúlteros
  rationale: Equivalente direto que mantém a referência específica à infidelidade conjugal.
- source_word: μαλακοὶ
  choice: os homens efeminados[a]
  rationale: Traduz de maneira relativamente direta o sentido de 'suaves/macios' aplicado a homens, sem inserir no texto principal uma identificação sexual mais específica do que o termo isoladamente assegura; a nota registra os sentidos contextuais debatidos.
- source_word: ἀρσενοκοῖται
  choice: os homens que têm relações sexuais com outros homens[b]
  rationale: Formulação descritiva, e não identitária, que reflete a provável referência a atividade sexual entre homens e mantém em nota a incerteza ligada a este termo raro.
theological_decisions:
- issue: Sentido conjunto de μαλακοὶ e ἀρσενοκοῖται na lista de vícios
  choice: Traduzir distintamente como 'homens efeminados' e 'homens que têm relações sexuais com outros homens', com notas
  alternative: '''parceiros passivos em relações sexuais entre homens'' e ''homens que se deitam com homens''; ou ''prostitutos'' e ''sodomitas'''
  rationale: Os termos são distintos no grego e não devem ser fundidos. A tradução principal evita categorias modernas de identidade e não afirma sem ressalva que μαλακοί designa necessariamente o parceiro passivo; as notas preservam as principais possibilidades lexicais e a tensão interpretativa.
- issue: Voz e nuance de μὴ πλανᾶσθε
  choice: Não se enganem
  alternative: Não sejam enganados; não se deixem enganar
  rationale: A forma escolhida é idiomática e adequada ao contexto de advertência moral, mas não pretende excluir a nuance passiva possível do imperativo grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'vocês' para tornar explícito o plural e mantém o paralelismo da lista. As expressões contestadas são formuladas sem categorias identitárias anacrônicas, e suas alternativas são documentadas em notas.
