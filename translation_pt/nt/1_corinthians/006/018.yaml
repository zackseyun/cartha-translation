id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: pt
  text: Fujam da imoralidade sexual. Todo pecado que uma pessoa comete está fora do corpo, mas quem pratica imoralidade sexual peca contra o próprio corpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φεύγετε
  choice: Fujam
  rationale: O imperativo presente, na segunda pessoa do plural, expressa uma ordem urgente de evitar continuamente; “Fujam” é direto, natural e vigoroso.
- source_word: πορνείαν
  choice: imoralidade sexual
  rationale: πορνεία abrange condutas sexuais ilícitas em sentido amplo; “imoralidade sexual” preserva essa amplitude em português atual.
- source_word: πᾶν ἁμάρτημα
  choice: Todo pecado
  rationale: Reproduz de modo natural o caráter genérico e abrangente da expressão grega.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: que uma pessoa comete
  rationale: ἄνθρωπος tem aqui sentido humano genérico, não especificamente masculino. O presente idiomático em português expressa com naturalidade a generalização formada por ἐὰν com o subjuntivo aoristo.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: está fora do corpo
  rationale: Mantém a formulação espacial e metafórica do grego e preserva o contraste difícil com a oração seguinte.
- source_word: ὁ δὲ πορνεύων
  choice: mas quem pratica imoralidade sexual
  rationale: A construção conserva a força verbal do particípio substantivado e retoma claramente πορνεία.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: peca contra o próprio corpo
  rationale: “Contra” comunica naturalmente o valor relacional de εἰς neste contexto, enquanto “o próprio corpo” preserva a ênfase reflexiva de ἴδιον sem impor gênero em português.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος
  choice: uma pessoa
  alternative: um homem
  rationale: Embora o substantivo grego esteja no masculino singular, seu referente é representativo e genérico. “Uma pessoa” transmite esse sentido com clareza em português contemporâneo, sem restringir indevidamente a afirmação aos homens.
- issue: A afirmação de que todo pecado está “fora do corpo”
  choice: Traduzir diretamente, preservando a tensão exegética
  alternative: Explicá-la como lema dos coríntios ou qualificá-la doutrinariamente
  rationale: O texto grego apresenta a afirmação sem marca explícita de citação nem explicação harmonizadora. A tradução não deve resolver no corpo do texto uma dificuldade interpretativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém o paralelismo e a tensão do original. Não há notas, portanto nenhum marcador é necessário no texto principal.
