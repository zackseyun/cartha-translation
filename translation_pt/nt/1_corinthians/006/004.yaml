  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: pt
  text: Portanto, se vocês têm tribunais para questões desta vida[a], será que colocam como juízes os que não têm posição reconhecida na igreja?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “questões da vida cotidiana”. O grego se refere a assuntos terrenos, civis ou comuns.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que são desprezados na igreja”. A expressão grega pode indicar, de modo irônico, pessoas consideradas insignificantes dentro da igreja ou pessoas sem posição reconhecida do ponto de vista dela.'
    reason: alternative_reading
  - marker: c
    text: 'Alguns entendem a frase como um imperativo sarcástico: “coloquem como juízes os que não têm posição reconhecida na igreja”.'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: questões desta vida
  rationale: Expressa assuntos comuns, terrenos ou civis, sem a possível conotação moral negativa de “mundanos”.
- source_word: κριτήρια
  choice: tribunais
  rationale: No contexto de litígios, o termo pode indicar instâncias judiciais; “tribunais” preserva esse sentido institucional.
- source_word: ἐὰν ἔχητε
  choice: se vocês têm
  rationale: Tradução direta e natural da construção condicional.
- source_word: τοὺς ἐξουθενημένους
  choice: os que não têm consideração
  rationale: Preserva a ideia de pessoas tratadas como sem importância ou desprezadas, sem decidir se são membros insignificantes ou pessoas sem reconhecimento perante a igreja.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: na igreja
  rationale: Mantém a formulação aberta quanto a significar dentro da comunidade ou segundo a avaliação dela.
- source_word: τούτους καθίζετε
  choice: colocam como juízes justamente
  rationale: Torna explícita a função judicial implícita em “sentar/colocar”, enquanto “justamente” comunica a ênfase de τούτους no tom de censura.
theological_decisions:
- issue: Forma sintática da frase e identidade dos que não têm consideração
  choice: 'Pergunta retórica de censura: “será que colocam como juízes...?”'
  alternative: 'Imperativo sarcástico: “coloquem como juízes os que não têm consideração na igreja”; também é possível entender essas pessoas como desprezadas pela igreja ou sem posição reconhecida nela.'
  rationale: A pontuação do SBLGNT e o contexto favorecem a pergunta retórica, mas a construção grega admite o imperativo sarcástico. A expressão “na igreja” permanece deliberadamente aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A ordem dos marcadores segue sua ocorrência natural no texto; preserva-se a dificuldade sintática e interpretativa do grego por meio das notas.
