  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: pt
  text: Digo isso para envergonhá-los. Será mesmo que não há entre vocês nem sequer um sábio[a] que seja capaz de julgar entre um irmão e outro[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa sábia”. O grego está no masculino singular, mas Paulo se dirige à congregação como um todo.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “entre seu irmão”, numa construção elíptica em que a outra parte da disputa fica implícita. “Irmão” refere-se aqui a um membro da comunidade de fé e pode incluir homem ou mulher.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: para vergonha de vocês
  rationale: Preserva a construção nominal e a força direta da repreensão de Paulo, em português claro e atual.
- source_word: λέγω
  choice: Digo
  rationale: O presente simples corresponde naturalmente ao discurso direto no contexto.
- source_word: οὕτως
  choice: Será mesmo que
  rationale: Expressa a inferência retórica e indignada, em vez de reduzir οὕτως a um simples advérbio de modo.
- source_word: οὐκ ἔνι ἐν ὑμῖν
  choice: não há entre vocês
  rationale: Reproduz a ideia de inexistência no âmbito da comunidade e soa natural em português.
- source_word: οὐδεὶς σοφὸς
  choice: nem sequer um sábio
  rationale: Torna perceptível a ênfase da negação e conserva a forma masculina singular do grego, sem restringir necessariamente o referente a homens.
- source_word: δυνήσεται
  choice: capaz de
  rationale: Comunica a capacidade prospectiva indicada pelo futuro grego sem produzir uma construção pesada em português.
- source_word: διακρῖναι
  choice: julgar
  rationale: No contexto de disputas judiciais, o verbo designa avaliar e decidir uma questão entre partes.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: entre seus irmãos
  rationale: A expressão grega é elíptica depois de 'entre'. A forma plural oferece uma leitura portuguesa natural sem especificar artificialmente a segunda parte da disputa; a literalidade e a elipse são registradas em nota.
theological_decisions:
- issue: Linguagem masculina representativa em uma congregação mista
  choice: um sábio ... seus irmãos
  alternative: uma pessoa sábia ... outros irmãos na fé
  rationale: O texto grego emprega formas masculinas singulares, mas se dirige à congregação inteira. A tradução mantém a imagem familiar e a forma gramatical, esclarecendo em notas seu possível alcance representativo.
- issue: Elipse na identificação das partes da disputa
  choice: entre seus irmãos
  alternative: entre um irmão e outro
  rationale: O grego menciona literalmente apenas 'seu irmão' depois de 'entre', deixando a outra parte implícita. O plural idiomático evita inserir explicitamente 'outro', embora a relação entre duas partes esteja pressuposta pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. A pergunta retórica conserva o tom incisivo de Paulo; as notas preservam a forma masculina e a elipse do original sem impor uma solução doutrinária.
