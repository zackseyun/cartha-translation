id: 1CO.6.6
reference: 1 Corinthians 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: pt
  text: Mas um irmão vai a tribunal contra outro irmão[a], e isso diante de descrentes?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetição de «irmão» refere-se a membros da comunidade cristã.
    reason: cultural_note
  - marker: b
    text: 'Ou: «diante dos descrentes». A expressão provavelmente se refere a tribunais civis conduzidos por pessoas de fora da igreja, mas o grego diz simplesmente «diante de descrentes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca com naturalidade o forte contraste com a situação ideal apresentada no versículo anterior.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: um irmão ... outro irmão
  rationale: Preserva a linguagem familiar cristã e a repetição do substantivo masculino singular, enquanto «outro» torna natural em português a relação entre as duas partes.
- source_word: μετὰ
  choice: contra
  rationale: No contexto forense, expressa a oposição entre as partes de uma causa, em vez do sentido associativo comum de «com».
- source_word: κρίνεται
  choice: vai a tribunal
  rationale: Comunica o sentido forense contextual do verbo sem conservar a ambiguidade pouco natural de uma tradução como «é julgado».
- source_word: καὶ τοῦτο
  choice: e isso
  rationale: 'Mantém a ênfase retórica de indignação: além de haver litígio entre irmãos, ele ocorre nesse ambiente.'
- source_word: ἐπὶ ἀπίστων
  choice: diante de descrentes
  rationale: Reproduz o cenário perante o qual a causa é tratada sem acrescentar «juízes», termo sugerido pelo contexto, mas ausente do grego.
theological_decisions:
- issue: Sentido representativo de ἀδελφός na comunidade cristã
  choice: irmão
  alternative: irmão na fé; membro da comunidade; irmão ou irmã
  rationale: Conserva a forma masculina singular e a linguagem familiar de Paulo. Uma nota esclarece que, no contexto, o termo identifica membros da comunidade cristã, sem neutralizar silenciosamente a forma grega.
- issue: Alcance de ἀπίστων
  choice: descrentes
  alternative: juízes descrentes; os descrentes; pessoas de fora
  rationale: Preserva o contraste entre a comunidade da fé e quem não crê, sem restringir o referente a juízes, embora o contexto judicial favoreça essa aplicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Vai a tribunal» é uma formulação internacional e natural para a ação judicial; «descrentes» preserva o contraste religioso sem a carga potencialmente pejorativa de outras opções.
