  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: pt
  text: Mas vocês mesmos cometem injustiça e defraudam — e isso contra seus próprios irmãos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o termo grego diz «irmãos» e pode referir-se de modo mais amplo aos demais fiéis.
    reason: Alternativa lexical e esclarecimento do possível sentido inclusivo.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com a afirmação anterior de modo natural em português.
- source_word: ὑμεῖς
  choice: vocês mesmos
  rationale: Preserva a ênfase do pronome grego expresso, destacando a conduta dos próprios coríntios.
- source_word: ἀδικεῖτε
  choice: cometem injustiça
  rationale: Expressa o sentido amplo de agir injustamente ou causar dano, mantendo a força moral do verbo.
- source_word: ἀποστερεῖτε
  choice: defraudam
  rationale: No contexto jurídico e econômico, comunica privar alguém do que lhe é devido ou enganá-lo em seus direitos.
- source_word: καὶ τοῦτο
  choice: — e isso
  rationale: Conserva o reforço retórico pelo qual Paulo agrava a acusação; o travessão reproduz a ênfase com naturalidade.
- source_word: ἀδελφούς
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego, que neste contexto pode designar de modo amplo outros membros da comunidade cristã.
theological_decisions:
- issue: Sentido de ἀδελφούς no contexto da comunidade cristã
  choice: irmãos
  alternative: irmãos e irmãs; outros irmãos na fé
  rationale: A forma grega é masculina plural, embora no uso paulino possa abranger os fiéis em geral. A tradução mantém a forma lexical e esclarece em nota seu possível alcance inclusivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. A formulação conserva a ênfase do pronome, o paralelismo verbal e o golpe retórico final do grego.
