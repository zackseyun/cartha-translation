  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: pt
  text: Mas quem se une ao Senhor é um só espírito com ele[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está unido ao Senhor”. A forma do verbo grego pode ser entendida com sentido reflexivo (“se une”) ou com sentido semelhante ao passivo (“está unido”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, simplesmente: “é um só espírito”. As palavras “com ele” estão implícitas no grego e foram acrescentadas para dar clareza em português.'
    reason: lexical_alternative
  - marker: c
    text: Alguns intérpretes poderiam escrever “Espírito” com inicial maiúscula, mas a frase parece indicar mais naturalmente que a pessoa unida ao Senhor é um só espírito com ele.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: se une
  rationale: O particípio indica ligação ou adesão estreita. “Se une” conserva a possível força reflexiva da forma médio-passiva e, no contexto, mantém o paralelo com a união mencionada no versículo anterior sem soar artificial em português.
- source_word: κυρίῳ (κύριος)
  choice: Senhor
  rationale: Em Paulo, neste contexto, refere-se ao Senhor Jesus ressuscitado; “Senhor” preserva o peso cristológico do termo.
- source_word: ἓν
  choice: um só
  rationale: A expressão portuguesa “um só” comunica com naturalidade a unidade enfática indicada pelo numeral grego.
- source_word: πνεῦμα
  choice: espírito
  rationale: A inicial minúscula representa mais naturalmente a união espiritual entre a pessoa e o Senhor, sem identificá-los com o Espírito Santo. Os manuscritos gregos não resolvem a questão por uso de maiúsculas.
- source_word: ὁ δὲ ... ἐστιν
  choice: Mas quem ... é
  rationale: O artigo com o particípio funciona como substantivo e tem sentido representativo. “Quem” é idiomático, inclusivo e fiel ao singular genérico da construção.
theological_decisions:
- issue: Natureza da união expressa por “um só espírito”
  choice: Expressar uma união espiritual real com o Senhor, preservando a distinção entre a pessoa e o Senhor.
  alternative: Entender a frase como identificação mística mais forte ou apenas como comunhão de atitude e propósito.
  rationale: O contexto contrasta a união corporal do versículo 16 com a união com o Senhor. “Um só espírito com ele” preserva a força da unidade sem sugerir fusão ontológica.
- issue: Explicitação de “com ele”
  choice: Incluir “com ele” para tornar explícita em português a relação implícita no grego.
  alternative: Traduzir apenas “é um só espírito”.
  rationale: A formulação mais curta reproduz formalmente o grego, mas pode parecer incompleta ou obscura em português. O complemento explicita a relação exigida pelo contexto sem alterar seu sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se une” é corrente e direto; “um só espírito” preserva a ênfase da unidade e a tensão teológica do original.
