  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: pt
  text: Algum de vocês ousa, tendo uma causa contra outro, ser julgado diante dos injustos[a], e não diante dos santos[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que não são justos”. Algumas traduções interpretam a expressão como “dos descrentes”, mas o grego diz literalmente “dos injustos”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “santos” se refere ao povo santo de Deus, isto é, aos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: ousa
  rationale: Preserva a força retórica de τολμάω, que neste contexto expressa uma audácia censurável.
- source_word: τις ὑμῶν
  choice: algum de vocês
  rationale: Reproduz naturalmente o pronome indefinido singular com o genitivo partitivo e mantém a interpelação direta aos coríntios.
- source_word: πρᾶγμα ἔχων
  choice: tendo uma causa
  rationale: Em contexto judicial, πρᾶγμα designa uma questão ou causa litigiosa; a construção participial é mantida de modo claro em português.
- source_word: πρὸς τὸν ἕτερον
  choice: contra outro
  rationale: No contexto de litígio, πρός indica oposição entre as partes, e ἕτερον é empregado genericamente.
- source_word: κρίνεσθαι
  choice: levá-la a julgamento
  rationale: Expressa idiomaticamente o infinitivo passivo judicial sem restringi-lo indevidamente a uma fórmula jurídica moderna específica.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: diante dos injustos
  rationale: Mantém o termo moralmente carregado ἄδικοι e verte ἐπί segundo seu sentido forense de comparecer diante de julgadores.
- source_word: καὶ οὐχὶ
  choice: e não
  rationale: Preserva de maneira direta o contraste enfático da pergunta retórica.
- source_word: ἐπὶ τῶν ἁγίων
  choice: diante dos santos
  rationale: Conserva a designação paulina estabelecida para o povo santo de Deus e mantém o paralelismo com 'diante dos injustos'.
theological_decisions:
- issue: Contraste entre ἀδίκων e ἁγίων
  choice: os injustos ... os santos
  alternative: os descrentes ... os crentes
  rationale: O contexto aponta para juízes externos à comunidade cristã, mas o grego emprega termos moral e teologicamente carregados. A tradução preserva essa formulação sem substituir a expressão por sua interpretação contextual.
- issue: Referência representativa masculina singular em ἔχων
  choice: algum de vocês, tendo uma causa
  alternative: quando alguém de vocês tiver uma causa
  rationale: A formulação portuguesa mantém a referência singular representativa sem inserir um pronome masculino desnecessário; não altera o alcance genérico do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi levemente ajustada para uma pergunta retórica natural, preservando o paralelismo judicial e os termos teologicamente marcados do grego.
