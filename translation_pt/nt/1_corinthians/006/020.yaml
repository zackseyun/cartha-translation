base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: pt
  text: Pois vocês foram comprados por um preço; glorifiquem, portanto, a Deus no corpo de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Manuscritos posteriores acrescentam: “e no espírito de vocês, que pertencem a Deus”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: foram comprados
  rationale: O aoristo passivo de ἀγοράζω expressa uma compra realizada. A formulação preserva de modo natural e direto a metáfora comercial do grego.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão para a exortação precedente. “Pois” mantém essa ligação argumentativa em português corrente e digno.
- source_word: τιμῆς
  choice: por um preço
  rationale: O genitivo indica o preço pago na transação. “Por um preço” conserva a imagem de compra sem explicitar aquilo que o versículo deixa implícito.
- source_word: δοξάσατε
  choice: glorifiquem
  rationale: O imperativo aoristo plural convoca os destinatários a uma ação decisiva. “Glorifiquem” preserva o sentido teológico usual de δοξάζω.
- source_word: δὴ
  choice: portanto
  rationale: A partícula reforça a passagem da razão apresentada para a ordem, com valor inferencial e exortativo. “Portanto” torna essa força clara.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: no corpo de vocês
  rationale: Mantém concretamente σῶμα e reproduz o singular distributivo do grego com possuidor plural, apontando para a conduta corporal de cada destinatário.
theological_decisions:
- issue: Metáfora comercial da redenção
  choice: Manter “foram comprados por um preço”
  alternative: “foram resgatados a um custo”
  rationale: O texto emprega linguagem explícita de compra. Preservá-la evita substituir a imagem paulina por uma formulação teológica mais interpretativa.
- issue: Ética corporal
  choice: Traduzir σῶμα concretamente como “corpo”
  alternative: “vida” ou “ser”
  rationale: O contexto imediato trata da conduta sexual e corporal; a tradução concreta conserva o argumento sem ampliação parafrástica.
- issue: Número gramatical de “corpo”
  choice: Conservar o singular distributivo em “no corpo de vocês”
  alternative: “nos corpos de vocês”
  rationale: O grego traz σῶμα no singular com ὑμῶν no plural. A escolha conserva essa forma e pode indicar o corpo de cada membro, sem decidir entre uma ênfase estritamente individual e uma possível dimensão comunitária.
translation_notes:
  register: Português moderno de ampla compreensão, com boa legibilidade brasileira. O plural “vocês” torna explícito que a exortação se dirige à comunidade, enquanto “corpo” conserva o singular do texto grego. A sintaxe permanece próxima da fonte, mas natural em português.
