source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: pt
  text: “Tudo me é permitido”[a], mas nem tudo é proveitoso.[b] “Tudo me é permitido”, mas eu não serei dominado por coisa alguma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, sem aspas: Tudo me é permitido. Muitos entendem esta frase como um lema dos coríntios que Paulo cita e depois qualifica.'
    reason: alternative_reading
  - marker: b
    text: Ou “benéfico” ou “útil”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não serei submetido ao poder de coisa alguma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Tudo me é permitido
  rationale: A construção idiomática comunica que tudo é permitido ao falante. “Tudo” preserva a abrangência do neutro plural Πάντα, e “me é permitido” expressa com naturalidade o valor de ἔξεστιν com o dativo μοι.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: mas nem tudo é proveitoso
  rationale: συμφέρει indica aquilo que traz vantagem, benefício ou proveito. “É proveitoso” mantém essa avaliação prática e ética sem restringi-la ao lucro financeiro.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: mas eu não serei dominado
  rationale: O futuro passivo de ἐξουσιάζω exprime ficar sob o poder ou controle de algo. “Não serei dominado” preserva a voz passiva e o campo semântico de autoridade; o pronome explícito “eu” reflete a ênfase de ἐγώ.
- source_word: ὑπό τινος
  choice: por coisa alguma
  rationale: Embora τινος possa, em termos gramaticais, referir-se a pessoa ou coisa, o contexto imediato trata de práticas, desejos e coisas consideradas permitidas. “Coisa alguma” é a formulação portuguesa mais natural sem limitar o princípio a uma entidade específica.
theological_decisions:
- issue: Se Πάντα μοι ἔξεστιν deve ser marcado como lema dos coríntios
  choice: Apresentar a cláusula repetida entre aspas como uma afirmação citada e então qualificada por Paulo
  alternative: Apresentá-la sem aspas como uma declaração do próprio Paulo, imediatamente qualificada pelas orações seguintes
  rationale: Muitos entendem a frase como um lema dos coríntios citado por Paulo, mas os manuscritos gregos não continham aspas, e a identificação como citação é interpretativa. As aspas tornam essa leitura retórica visível, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição exata de “Tudo me é permitido” conserva a força retórica do grego. “Proveitoso” evita tanto um tom excessivamente comercial quanto uma paráfrase explicativa, e “não serei dominado” mantém a linguagem de poder presente no verbo grego.
