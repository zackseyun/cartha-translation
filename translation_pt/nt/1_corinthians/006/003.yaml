base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: pt
  text: Vocês não sabem que julgaremos anjos? Quanto mais[a] as questões desta vida!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que dirá as questões desta vida” ou “muito menos as questões desta vida”.'
    reason: Alternativas para a força retórica de μήτιγε, cuja relação do maior para o menor pode ser expressa de mais de uma maneira em português.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Preserva a fórmula retórica paulina e soa natural no português moderno, com referência plural explícita.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente a oração que expressa o conteúdo do verbo “saber”.
- source_word: ἀγγέλους
  choice: anjos
  rationale: Neste contexto escatológico e judicial, indica seres celestiais, não mensageiros humanos.
- source_word: κρινοῦμεν
  choice: julgaremos
  rationale: Mantém tanto o futuro do indicativo quanto o sentido judicial amplo de κρίνω, sem especificar de que modo ocorrerá esse julgamento.
- source_word: μήτιγε
  choice: Quanto mais
  rationale: 'Expressa o argumento enfático do maior para o menor: se os fiéis julgarão anjos, certamente são aptos para tratar questões ordinárias. A nota registra alternativas possíveis em português.'
- source_word: βιωτικά
  choice: as questões desta vida
  rationale: O adjetivo substantivado abrange assuntos ligados à vida terrena comum e, no contexto, especialmente disputas ordinárias, sem restringir o termo apenas a processos judiciais.
theological_decisions:
- issue: Natureza do ato de os fiéis “julgarem anjos”
  choice: julgaremos anjos
  alternative: governaremos anjos; julgaremos anjos caídos
  rationale: O texto afirma o ato futuro, mas não define seu modo, alcance nem quais anjos estão em vista. A formulação literal preserva essa abertura e evita introduzir uma escatologia específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna natural o plural dirigido à comunidade. A pontuação em duas perguntas/frases enfáticas acompanha a força retórica do grego, enquanto a nota preserva a variação possível de μήτιγε.
