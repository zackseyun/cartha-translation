base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: pt
  text: E Deus ressuscitou o Senhor e também nos ressuscitará por meio do seu poder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo leve na continuação do argumento, sem exigir contraste forte; “E” mantém a fluidez natural.
- source_word: θεὸς
  choice: Deus
  rationale: Equivalente padrão de θεός e sujeito explícito da ação de ressuscitar.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Preserva κύριος como título cristológico usual, referindo-se aqui a Jesus.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: No contexto, ἐγείρω designa o ato passado de Deus de levantar Jesus dentre os mortos; “ressuscitou” comunica isso com clareza em português.
- source_word: ἡμᾶς
  choice: nos
  rationale: Pronome de primeira pessoa do plural que inclui Paulo e seus leitores como objetos da futura ação de Deus.
- source_word: ἐξεγερεῖ
  choice: também nos ressuscitará
  rationale: O futuro de ἐξεγείρω, ligado por καί à ressurreição do Senhor, indica a ação futura correspondente sobre nós. A colocação de “também” torna o paralelismo natural em português.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: por meio do seu poder
  rationale: διά com genitivo expressa meio ou instrumentalidade; “por meio do seu poder” preserva essa relação explicitamente e com naturalidade.
theological_decisions:
- issue: Referência à ressurreição na oração futura
  choice: Ressurreição futura dos crentes
  alternative: Vindicação divina geral ou elevação espiritual metafórica
  rationale: O contexto imediato trata do corpo (1Co 6.13-20), e o paralelismo com a ressurreição do Senhor favorece uma ressurreição futura real, sem necessidade de acrescentar “do corpo” ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ressuscitou/ressuscitará” explicita naturalmente o sentido contextual dos verbos gregos e conserva o paralelismo. Nenhuma nota de rodapé é necessária.
