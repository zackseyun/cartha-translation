  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: pt
  text: Ou vocês não sabem que o corpo de vocês é templo do Espírito Santo que está em vocês e que vocês têm da parte de Deus[a]? E vocês não pertencem a si mesmos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Espírito Santo em vocês”.'
    reason: lexical_alternative
  - marker: b
    text: No grego, “corpo” está no singular, enquanto “de vocês” está no plural. A expressão pode se referir distributivamente ao corpo de cada pessoa ou ter sentido representativo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Mantém a transição retórica incisiva que dá continuidade ao argumento anterior.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Reproduz a fórmula retórica paulina de modo direto e natural em português.
- source_word: τὸ σῶμα ὑμῶν
  choice: o corpo de vocês
  rationale: Conserva o singular de σῶμα junto ao possessivo plural, sem decidir se o sentido é distributivo ou representativo.
- source_word: ναὸς
  choice: templo
  rationale: Expressa o santuário sagrado indicado por ναός e preserva a força da metáfora.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: do Espírito Santo que está em vocês
  rationale: Liga a expressão genitiva a 'templo' e torna clara, sem ampliar o sentido, a localização expressa por ἐν ὑμῖν.
- source_word: οὗ
  choice: o qual
  rationale: Retoma pessoalmente o Espírito Santo e evita a possível ambiguidade de 'que' após a oração relativa anterior.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: vocês têm da parte de Deus
  rationale: Mantém o presente de ἔχετε e comunica naturalmente a origem expressa por ἀπὸ θεοῦ, sem explicitar 'receberam'.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: E vocês não pertencem a si mesmos
  rationale: Comunica com clareza o valor possessivo da construção genitiva reflexiva. 'Não são de vocês mesmos' seria mais formalmente próximo, mas pouco natural.
theological_decisions:
- issue: Referente e caráter pessoal do pronome relativo οὗ
  choice: Entender o pronome como referência ao Espírito Santo e vertê-lo pessoalmente por 'o qual'.
  alternative: Empregar uma forma potencialmente impessoal ou reestruturar toda a oração.
  rationale: O antecedente gramatical é ἁγίου πνεύματος. A forma escolhida preserva essa referência pessoal sem acrescentar formulação doutrinária ao texto.
- issue: Singular 'corpo' com destinatários no plural
  choice: Manter 'o corpo de vocês'.
  alternative: Pluralizar como 'os corpos de vocês' ou explicitar 'o corpo de cada um'.
  rationale: O grego combina τὸ σῶμα no singular com ὑμῶν no plural. A tradução conserva a tensão entre uma leitura distributiva e uma leitura representativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' adequado à legibilidade brasileira. A sintaxe foi mantida próxima do grego sem sacrificar a naturalidade. A vírgula final preserva a continuidade sintática com o versículo seguinte.
