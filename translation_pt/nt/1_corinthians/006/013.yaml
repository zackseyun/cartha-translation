  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: pt
  text: Os alimentos são para o estômago, e o estômago para os alimentos[a][b] — mas Deus porá fim tanto a este como àqueles.[c] O corpo, porém, não é para a imoralidade sexual, mas para o Senhor, e o Senhor para o corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “A comida é para o estômago, e o estômago para a comida.” O grego emprega o plural.'
    reason: lexical_alternative
  - marker: b
    text: Muitos intérpretes entendem “Os alimentos são para o estômago, e o estômago para os alimentos” como um lema dos coríntios que Paulo cita antes de corrigi-lo.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “Deus destruirá tanto este como aqueles.” O verbo também pode ser traduzido por “abolirá” ou “tornará inoperantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: os alimentos
  rationale: O plural grego é preservado de modo natural em português e expressa genericamente aquilo que serve de comida.
- source_word: κοιλίᾳ / κοιλία
  choice: estômago
  rationale: Neste contexto, o termo se refere ao órgão ligado à alimentação e à digestão; “estômago” é claro e preciso, enquanto “ventre” seria mais amplo e potencialmente ambíguo.
- source_word: καταργήσει
  choice: porá fim
  rationale: A expressão comunica a cessação futura da função ou da relação entre alimentos e estômago sem exigir a ideia mais forte de aniquilação física.
- source_word: ταύτην καὶ ταῦτα
  choice: tanto a este como àqueles
  rationale: Os pronomes gregos retomam, respectivamente, “o estômago” e “os alimentos”; a formulação conserva essa distinção de número e gênero de maneira compreensível.
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente português direto e usual, preservando tanto o sentido físico quanto sua relevância teológica no argumento de Paulo.
- source_word: πορνείᾳ
  choice: imoralidade sexual
  rationale: A expressão moderna abrange adequadamente a categoria ampla de conduta sexual ilícita indicada pelo substantivo grego, sem a estreiteza ou o tom arcaico de “fornicação”.
- source_word: κυρίῳ / κύριος
  choice: Senhor
  rationale: Trata-se da designação paulina habitual para Jesus e preserva o peso cristológico e a relação de autoridade presentes no texto.
- source_word: δὲ
  choice: mas / porém
  rationale: As duas ocorrências introduzem contrastes. “Mas” destaca a ação futura de Deus em contraste com a máxima anterior, e “porém” marca naturalmente a transição para o propósito do corpo.
theological_decisions:
- issue: Se a frase inicial é um lema dos coríntios citado por Paulo ou uma declaração do próprio Paulo
  choice: Apresentar a frase sem aspas nem fórmula introdutória
  alternative: Colocá-la entre aspas como lema coríntio ou introduzi-la com “vocês dizem”
  rationale: O grego não contém marcas explícitas de citação. A pontuação evidencia o contraste sem transformar uma interpretação provável em afirmação textual.
- issue: Sentido de καταργήσει quanto aos alimentos e ao estômago
  choice: Expressar cessação futura com “porá fim”
  alternative: Traduzir por “destruirá”, “abolirá” ou “tornará inoperantes”
  rationale: A escolha mantém aberta a extensão exata da ação divina e não impõe ao verbo a ideia específica de aniquilação material.
- issue: Força da expressão “o Senhor para o corpo”
  choice: Manter a formulação recíproca, concisa e sem explicação adicional
  alternative: Expandir como “o Senhor cuida do corpo” ou “o Senhor é para o bem do corpo”
  rationale: A construção grega é deliberadamente breve e paralela. Explicá-la no texto resolveria indevidamente a natureza exata da relação do Senhor com o corpo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela e a concisão do grego foram preservadas, enquanto a pontuação torna o contraste natural sem introduzir aspas interpretativas.
