id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: pt
  text: 'Ou vocês não sabem que aquele que se une a uma prostituta é um só corpo com ela?[a] Pois, como ele diz[b]: “Os dois se tornarão uma só carne.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “aquele que está unido a uma prostituta é um só corpo”.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “ele diz”. A citação é de Gênesis 2:24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz a continuação retórica do argumento de Paulo e preserva sua ligação com o contexto anterior.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Mantém a conhecida fórmula retórica paulina em linguagem portuguesa natural e direta.
- source_word: ὁ κολλώμενος
  choice: aquele que se une
  rationale: O verbo pode significar ligar-se, apegar-se ou unir-se; neste contexto sexual, “se une” comunica com clareza a ligação pessoal e corporal sem acrescentar explicações.
- source_word: τῇ πόρνῃ
  choice: a uma prostituta
  rationale: πόρνη designa especificamente uma prostituta. O artigo grego tem sentido genérico, para o qual o indefinido é natural em português.
- source_word: ἓν σῶμά ἐστιν
  choice: é um só corpo com ela
  rationale: Preserva o presente de ἐστιν e explicita apenas o complemento relacional implícito no grego, evitando a formulação truncada “é um só corpo”.
- source_word: Ἔσονται γάρ
  choice: Pois ... se tornarão
  rationale: Na construção com εἰς da citação de Gênesis, o futuro de εἰμί expressa adequadamente a passagem à condição de uma só carne.
- source_word: φησίν
  choice: como ele diz
  rationale: Conserva o singular pessoal do grego sem identificar explicitamente o sujeito, que o texto não nomeia.
- source_word: οἱ δύο
  choice: Os dois
  rationale: Reproduz de modo simples e direto a formulação da citação.
- source_word: εἰς σάρκα μίαν
  choice: uma só carne
  rationale: Mantém a expressão bíblica concreta e relacional, sem reinterpretar σάρξ como “natureza pecaminosa”.
theological_decisions:
- issue: Implicação da citação de Gênesis para a união sexual fora do casamento
  choice: Apresentar diretamente a afirmação de que a união com uma prostituta constitui uma união corporal de “uma só carne”.
  alternative: Restringir a citação exclusivamente ao casamento ou acrescentar conclusões doutrinárias e morais não expressas neste versículo.
  rationale: Paulo aplica Gênesis 2:24 analogicamente à relação sexual com uma prostituta. A tradução preserva essa força e a tensão teológica do argumento sem expandi-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e conserva a expressão bíblica tradicional “uma só carne”. O texto mantém a concisão e a força retórica do original.
