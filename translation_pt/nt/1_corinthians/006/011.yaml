  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: pt
  text: E alguns de vocês eram assim. Mas vocês foram lavados[a], mas foram santificados, mas foram justificados em nome do Senhor Jesus e no Espírito do nosso Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês se lavaram”. A forma grega também pode ser entendida em sentido reflexivo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pelo Espírito do nosso Deus”. A expressão grega pode indicar tanto a esfera quanto o agente da ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: E alguns de vocês eram assim
  rationale: Expressa de modo natural a referência de ταῦτα às categorias mencionadas anteriormente, mantendo a ênfase na condição passada de alguns leitores.
- source_word: ἀλλὰ
  choice: mas
  rationale: A repetição de “mas” conserva o forte contraste e o ritmo enfático das três ocorrências de ἀλλά.
- source_word: ἀπελούσασθε
  choice: vocês foram lavados
  rationale: Embora a forma grega seja média e possa admitir sentido reflexivo, o valor passivo se harmoniza com os dois passivos seguintes e com a sequência de ações salvadoras. A alternativa reflexiva é registrada em nota.
- source_word: ἡγιάσθητε
  choice: foram santificados
  rationale: Mantém o termo teológico corrente e a continuidade lexical de ἁγιάζω, sem excluir as ideias de serem tornados santos ou consagrados.
- source_word: ἐδικαιώθητε
  choice: foram justificados
  rationale: É a formulação portuguesa estabelecida e concisa para o verbo paulino δικαιόω, preservando sua dimensão declarativa sem reduzi-la a uma única paráfrase.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: em nome do Senhor Jesus
  rationale: Formulação portuguesa natural que preserva a amplitude de ἐν, incluindo esfera, autoridade e possível instrumentalidade.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: no Espírito do nosso Deus
  rationale: Mantém formalmente a segunda construção com ἐν e identifica πνεῦμα como o Espírito de Deus, sem decidir no texto principal entre esfera e agência.
theological_decisions:
- issue: Voz e agência em ἀπελούσασθε
  choice: vocês foram lavados
  alternative: vocês se lavaram
  rationale: O contexto de ἡγιάσθητε e ἐδικαιώθητε favorece a leitura passiva ou médio-passiva, mas a morfologia permite uma leitura reflexiva, preservada em nota.
- issue: Valor de ἐν diante de πνεύματι
  choice: no Espírito do nosso Deus
  alternative: pelo Espírito do nosso Deus
  rationale: “No Espírito” preserva a ambiguidade entre esfera e instrumento; a alternativa explicita a possível agência do Espírito.
- issue: Referência de πνεύματι
  choice: Espírito, com inicial maiúscula
  alternative: espírito, em sentido mais geral
  rationale: A expressão “Espírito do nosso Deus” no contexto paulino aponta naturalmente para o Espírito Santo, sem necessidade de acrescentar “Santo” ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição deliberada de “mas” conserva a retórica enfática de Paulo; os termos “santificados” e “justificados” mantêm precisão e continuidade teológica.
