  source_fidelity: O texto transmite com precisão o contraste de Paulo entre a condição passada e as três ações expressas pelos verbos gregos. “E alguns de vocês eram assim” é uma forma idiomática e fiel de retomar as categorias da lista anterior. “Foram lavados”, “foram santificados” e “foram justificados” preservam adequadamente a sequência verbal e sua ênfase retórica. “Em nome do Senhor Jesus” e “no Espírito do nosso Deus” mantêm, sem restringi-la indevidamente, a amplitude de ἐν nas duas expressões finais.
