id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: pt
  text: Vocês não sabem que os seus corpos são membros do Messias[a]? Tomarei, então, os membros do Messias e farei deles membros de uma prostituta? Que isso jamais aconteça![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou empregado na forma tradicional “Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou, “De modo nenhum!” ou “Certamente não!”. A expressão grega é uma forte fórmula de repúdio.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Mantém a pergunta retórica pela qual Paulo apela a algo que os leitores já deveriam saber, em português atual e claro.
- source_word: σώματα
  choice: corpos
  rationale: O plural se refere à realidade corporal dos próprios fiéis no contexto da imoralidade sexual; “corpos” é direto e não reduz o termo a meras partes anatômicas.
- source_word: μέλη
  choice: membros
  rationale: Preserva a imagem corporal e a ideia de partes que pertencem a uma realidade maior, além da repetição enfática do grego.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός designa o Ungido a quem os fiéis pertencem; “Messias” torna explícito o valor titular, enquanto a nota registra a forma tradicional “Cristo”.
- source_word: ἄρας
  choice: Tomarei, então
  rationale: O particípio integra a pergunta retórica e apresenta a ação inconcebível de tomar os membros do Messias; essa formulação é natural em português sem perder a força do original.
- source_word: ποιήσω
  choice: farei deles
  rationale: Expressa de modo claro o ato de fazer com que os membros do Messias se tornem membros de uma prostituta, explicitando apenas o complemento exigido pela fluência portuguesa.
- source_word: πόρνης
  choice: de uma prostituta
  rationale: O substantivo denota especificamente uma prostituta neste contexto; a escolha evita tanto arcaísmo quanto generalização indevida.
- source_word: μὴ γένοιτο
  choice: Que isso jamais aconteça!
  rationale: Conserva o formato volitivo e a rejeição enfática da expressão grega, com força idiomática em português.
theological_decisions:
- issue: Valor de Χριστός na linguagem paulina de união corporal
  choice: Messias
  alternative: Cristo
  rationale: A tradução principal conserva o sentido titular de “Ungido” sem resolver ou alterar a teologia paulina da pertença dos fiéis a ele; a forma tradicional é apresentada em nota.
- issue: Força da rejeição μὴ γένοιτο
  choice: Que isso jamais aconteça!
  alternative: De modo nenhum! / Certamente não!
  rationale: A expressão não é uma simples resposta negativa, mas uma repudiação veemente da conclusão proposta; a opção escolhida preserva também a nuance volitiva.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “os seus corpos” acompanha o grego e evita uma paráfrase interpretativa. A repetição de “membros do Messias” e “membros de uma prostituta” foi mantida por sua força retórica e teológica.
