source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: pt
  text: Ou vocês não sabem que os santos julgarão o mundo? E, se o mundo é julgado por vocês[a], vocês não são capazes de decidir até mesmo as causas mais insignificantes?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre vocês”. A expressão grega é literalmente “em vocês” ou “entre vocês”; neste contexto, pode indicar que os santos participam do julgamento do mundo.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos menores tribunais”. O grego diz literalmente “tribunais mais pequenos”; no contexto, a expressão também pode referir-se a causas judiciais de menor importância.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz uma continuação retórica incisiva do argumento anterior.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Preserva a fórmula retórica paulina e usa a forma corrente e amplamente compreensível do português moderno.
- source_word: οἱ ἅγιοι
  choice: os santos
  rationale: Designa coletivamente os que pertencem a Deus; mantém o termo paulino tradicional sem restringi-lo a uma elite canonizada.
- source_word: τὸν κόσμον
  choice: o mundo
  rationale: Reproduz de modo natural a abrangência de κόσμος sem especificar além do texto se o foco é humano ou cósmico.
- source_word: κρινοῦσιν
  choice: julgarão
  rationale: Mantém o futuro e o sentido judicial de κρίνω, sem definir a maneira dessa participação no juízo.
- source_word: ἐν ὑμῖν
  choice: por vocês
  rationale: Expressa idiomaticamente o sentido instrumental ou associativo mais provável no contexto, enquanto a alternativa mais literal é registrada em nota.
- source_word: κρίνεται
  choice: é julgado
  rationale: Conserva a voz passiva e o presente de sentido condicional, ligado ao juízo futuro já mencionado.
- source_word: ἀνάξιοί ἐστε
  choice: vocês não são dignos
  rationale: Preserva a força avaliativa de ἀνάξιος e a forma de pergunta retórica, evitando reduzi-la apenas à ideia de capacidade técnica.
- source_word: κριτηρίων ἐλαχίστων
  choice: julgar nem as causas mais insignificantes
  rationale: No contexto de litígios, comunica naturalmente questões judiciais de pouquíssima importância. O verbo 'julgar' é explicitado em português a partir do campo semântico judicial da expressão, e a alternativa institucional é indicada em nota.
theological_decisions:
- issue: Identidade dos “santos”
  choice: os fiéis, isto é, o povo de Deus em sentido coletivo
  alternative: um grupo mais restrito de fiéis excepcionalmente santos
  rationale: No uso paulino, “os santos” normalmente designa os cristãos como povo separado para Deus, não uma classe espiritual superior.
- issue: Participação dos santos no julgamento do mundo
  choice: participação real em um juízo futuro, sem especificar seu modo
  alternative: mera avaliação moral metafórica ou autoridade judicial independente
  rationale: O texto afirma que os santos julgarão o mundo, mas não explica como nem lhes atribui explicitamente uma autoridade independente.
- issue: Sentido de ἐν ὑμῖν
  choice: 'agência ou participação dos destinatários: “por vocês”'
  alternative: 'localidade ou esfera: “entre vocês”'
  rationale: O contexto favorece a participação dos santos no julgamento, mas a construção grega admite uma leitura mais literal, preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural e sintaxe retórica natural. A formulação principal privilegia o sentido judicial contextual, enquanto as notas preservam as ambiguidades de ἐν ὑμῖν e κριτήρια.
