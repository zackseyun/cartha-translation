base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: pt
  text: De fato, o fato de vocês terem processos judiciais[b] entre si já é uma derrota total[a] para vocês. Por que não preferem sofrer injustiça? Por que não preferem ser defraudados[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perda” ou “fracasso”. O termo grego pode designar uma perda, um fracasso ou uma derrota.
    reason: lexical_alternative
  - marker: b
    text: Ou “ações judiciais” ou “causas legais”. Aqui, o termo grego se refere a controvérsias levadas aos tribunais.
    reason: lexical_alternative
  - marker: c
    text: Ou “privados do que é seu” ou “lesados”. O verbo grego pode significar privar, lesar ou defraudar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Marca que a derrota já existe antes mesmo do resultado dos processos.
- source_word: μὲν οὖν
  choice: de fato
  rationale: Expressa a transição conclusiva e a ênfase moderada da combinação grega de modo natural em português.
- source_word: ὅλως
  choice: completa
  rationale: Intensifica a avaliação de Paulo, preservando a ideia de que toda a situação constitui uma derrota.
- source_word: ἥττημα
  choice: derrota
  rationale: Comunica com força a perda moral e comunitária já presente na existência dos litígios, sem acrescentar uma categoria doutrinária.
- source_word: ὑμῖν ἐστιν
  choice: é ... para vocês
  rationale: Preserva de forma idiomática o dativo de referência, sem introduzir a ideia não expressa de vergonha.
- source_word: κρίματα
  choice: processos judiciais
  rationale: No contexto imediato, refere-se a controvérsias levadas aos tribunais; esta expressão é clara e corrente em português.
- source_word: μεθ’ ἑαυτῶν
  choice: entre si
  rationale: Expressa de forma concisa o conflito interno e recíproco entre membros da comunidade.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Por que não preferem
  rationale: Reproduz naturalmente o desafio retórico e a força comparativa de μᾶλλον.
- source_word: ἀδικεῖσθε
  choice: sofrer injustiça
  rationale: Mantém o sentido passivo de receber tratamento injusto em linguagem natural.
- source_word: ἀποστερεῖσθε
  choice: ser defraudados
  rationale: Preserva o sentido forte de ser privado ou lesado por outra pessoa, apropriado ao contexto patrimonial e judicial.
theological_decisions:
- issue: Natureza da avaliação de Paulo sobre litígios dentro da comunidade
  choice: derrota
  alternative: perda; fracasso
  rationale: 'A tradução mantém a forte avaliação moral de Paulo: a própria existência dos processos já representa uma derrota para a comunidade, independentemente de quem vença judicialmente, sem definir uma categoria doutrinária além do texto.'
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a progressão retórica do grego: avaliação enfática seguida por duas perguntas paralelas. Os marcadores de nota foram colocados imediatamente após os termos que esclarecem.'
