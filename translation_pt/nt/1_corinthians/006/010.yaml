  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: pt
  text: nem ladrões, nem gananciosos, nem bêbados, nem pessoas que insultam, nem exploradores[a] herdarão o reino de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “extorsores” ou “saqueadores”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, não receberão participação no reino de Deus.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: ladrões
  rationale: Equivalente português natural e direto para pessoas que roubam, adequado ao formato da lista de vícios.
- source_word: πλεονέκται
  choice: gananciosos
  rationale: Expressa pessoas caracterizadas pelo desejo insaciável de possuir mais, especialmente em sentido material, em linguagem atual e acessível.
- source_word: μέθυσοι
  choice: bêbados
  rationale: Designa pessoas caracterizadas pela embriaguez, e não simplesmente quem se embriagou alguma vez; mantém a forma substantiva e concisa da lista.
- source_word: λοίδοροι
  choice: pessoas que insultam
  rationale: Comunica de modo claro os que agridem ou ultrajam verbalmente; evita restringir o termo à calúnia ou falsa acusação.
- source_word: ἅρπαγες
  choice: exploradores
  rationale: Abrange os que se apoderam dos bens alheios ou exploram outros para obter ganho. Uma nota preserva alternativas mais específicas.
- source_word: βασιλείαν θεοῦ
  choice: o reino de Deus
  rationale: Formulação portuguesa estabelecida que preserva a ressonância teológica da expressão paulina.
- source_word: κληρονομήσουσιν
  choice: herdarão
  rationale: Preserva de maneira concisa a imagem de receber como herança e sua nuance escatológica.
theological_decisions:
- issue: Força da lista de vícios e linguagem de herança
  choice: Manter os substantivos que descrevem classes de pessoas e afirmar que não herdarão o reino de Deus, sem acrescentar qualificadores interpretativos.
  alternative: Explicitar no texto que se trata de pessoas caracterizadas por práticas persistentes ou não abandonadas.
  rationale: Os substantivos plurais da lista naturalmente descrevem pessoas reconhecidas por tais condutas, mas o texto não inclui qualificadores como “persistentes” ou “impenitentes”. A tradução conserva essa tensão sem transformar a inferência contextual em redação explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “nem” preserva o ritmo enfático do grego. “Pessoas que insultam” é mais imediatamente compreensível que “injuriadores”; “exploradores” mantém a amplitude de ἅρπαγες, enquanto a nota registra sentidos mais específicos.
