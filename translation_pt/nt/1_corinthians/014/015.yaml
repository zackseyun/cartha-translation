id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: pt
  text: Então, o que fazer? Orarei com o espírito[a], mas também orarei com a mente[b]; cantarei louvores com o espírito[a][c], mas também cantarei louvores com a mente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no espírito» ou «pelo espírito». O grego não explicita se «espírito» se refere especificamente ao Espírito Santo, ao espírito humano de quem fala ou à expressão espiritual.
    reason: lexical_alternative
  - marker: b
    text: Ou «com entendimento».
    reason: lexical_alternative
  - marker: c
    text: Ou «cantarei» ou «entoarei cânticos».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Então, o que fazer?
  rationale: A expressão introduz a conclusão prática do argumento. Esta formulação é natural em português atual e comunica melhor a função retórica do que a tradução estritamente literal «Então, o que é?».
- source_word: προσεύξομαι
  choice: orarei
  rationale: O futuro de προσεύχομαι indica a decisão ou prática de Paulo e é expresso com clareza pelo futuro simples em português.
- source_word: τῷ πνεύματι
  choice: com o espírito
  rationale: Preserva o paralelismo com «com a mente» e não determina se πνεῦμα se refere ao Espírito Santo, ao espírito humano ou à expressão espiritual.
- source_word: τῷ νοΐ
  choice: com a mente
  rationale: νοῦς designa aqui a faculdade de pensar e compreender. «Com a mente» conserva o contraste lexical com «espírito» sem transformar o termo em uma explicação interpretativa.
- source_word: ψαλῶ
  choice: cantarei louvores
  rationale: No contexto de culto, ψάλλω se refere ao louvor cantado. A expressão comunica tanto o ato de cantar como seu caráter de louvor.
- source_word: δὲ καὶ
  choice: mas também
  rationale: A combinação acrescenta o segundo elemento com leve contraste, equilibrando espírito e mente.
theological_decisions:
- issue: Sentido de πνεῦμα no contraste entre espírito e mente
  choice: Manter «espírito» sem especificar no texto principal
  alternative: «Espírito», «meu espírito» ou uma formulação que indique expressão espiritual
  rationale: O grego não resolve de modo explícito se Paulo se refere ao Espírito Santo, ao espírito humano ou à atividade espiritual. A tradução preserva essa ambiguidade e evita impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro simples mantém a estrutura deliberativa de Paulo; a repetição é preservada para conservar o paralelismo retórico do grego.
