  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: pt
  text: Dois ou três profetas falem, e os outros avaliem o que foi dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “julguem”, “discernam” ou “examinem”. O verbo grego pode indicar a avaliação da fala profética.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: profetas
  rationale: Tradução direta do substantivo que designa profetas ou pessoas que exercem fala profética; adequa-se às instruções de Paulo sobre a reunião da comunidade.
- source_word: δὲ
  choice: e
  rationale: Aqui a partícula introduz uma transição leve na sequência de instruções. A conjunção mantém a fluidez sem sugerir um contraste forte.
- source_word: δύο ἢ τρεῖς
  choice: dois ou três
  rationale: Reprodução direta da expressão numérica.
- source_word: λαλείτωσαν
  choice: falem
  rationale: O presente imperativo na terceira pessoa do plural é expresso de modo natural e conserva a força de instrução.
- source_word: οἱ ἄλλοι
  choice: os outros
  rationale: Mantém indefinido o referente da expressão grega, sem decidir se são os demais profetas, líderes ou outros participantes da reunião.
- source_word: διακρινέτωσαν
  choice: avaliem o que foi dito
  rationale: Neste contexto, o verbo indica examinar ou discernir a fala profética. A formulação explicita o objeto implícito em português e comunica uma avaliação cuidadosa, sem a conotação predominantemente condenatória que “julgar” pode ter.
theological_decisions:
- issue: Identidade de “os outros” na reunião
  choice: Manter a expressão genérica “os outros”.
  alternative: Especificar “os outros profetas” ou “o restante da comunidade”.
  rationale: O grego não identifica expressamente esse grupo. A tradução preserva a ambiguidade e não resolve uma questão eclesiológica que o texto deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mantendo a concisão e a força instrutiva do grego.
