base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: pt
  text: Dou graças a Deus porque falo em línguas mais do que todos vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falo em idiomas mais do que todos vocês”. O termo grego pode significar “idiomas”, mas, neste contexto, refere-se ao fenômeno discutido ao longo de 1 Coríntios 12–14, tradicionalmente chamado de “línguas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Dou graças
  rationale: O presente do indicativo expressa a ação atual de Paulo. “Dou graças” é natural, digno e preserva mais diretamente a construção grega do que simplesmente “agradeço”.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo indica a pessoa a quem se dirigem as graças; em português, a construção idiomática é “dar graças a Deus”.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: mais do que todos vocês
  rationale: A expressão comparativa relaciona a prática de Paulo à do grupo inteiro. Esta formulação é clara e preserva a abrangência coletiva sem explicitar além do texto se a comparação é com cada indivíduo separadamente.
- source_word: γλώσσαις
  choice: em línguas
  rationale: No contexto de 1 Coríntios 12–14, o plural designa o fenômeno espiritual em discussão. “Em línguas” conserva a terminologia tradicional sem decidir se se trata exclusivamente de idiomas humanos ou de outra forma de fala.
- source_word: λαλῶ
  choice: falo
  rationale: O presente ativo, na primeira pessoa do singular, é expresso naturalmente pelo presente simples em português.
theological_decisions:
- issue: Sentido de γλώσσαις no contexto dos dons espirituais
  choice: em línguas
  alternative: em idiomas
  rationale: “Línguas” mantém a designação contextual do fenômeno e sua ambiguidade legítima. “Idiomas” é lexicalmente possível, mas poderia restringir indevidamente a referência a línguas humanas identificáveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo a comparação e a ambiguidade do termo grego γλώσσαις.
