id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: pt
  text: Portanto, se toda a igreja se reunir no mesmo lugar, e todos falarem em línguas[a], e entrarem pessoas não instruídas[b] ou descrentes, não dirão que vocês estão fora de si?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falarem em idiomas”. O termo grego pode significar “idiomas”, mas “línguas” preserva a expressão estabelecida neste contexto sem decidir a natureza exata do fenômeno.
    reason: alternative_reading
  - marker: b
    text: Ou “pessoas de fora”. O termo grego provavelmente se refere a pessoas não informadas ou não iniciadas nas práticas da congregação, aqui distinguidas dos “descrentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: igreja
  rationale: No uso paulino, refere-se aqui à comunidade cristã reunida; “igreja” é a equivalência natural e corrente em português.
- source_word: ὅλη
  choice: toda a igreja
  rationale: Preserva a ênfase na congregação inteira como coletividade.
- source_word: ἐπὶ τὸ αὐτό
  choice: no mesmo lugar
  rationale: Expressa com clareza o sentido espacial da reunião conjunta, sem redundância desnecessária.
- source_word: λαλῶσιν γλώσσαις
  choice: falarem em línguas
  rationale: “Falar em línguas” é a expressão consagrada em português para o fenômeno carismático tratado em 1 Coríntios 12–14 e mantém aberta a questão de sua natureza exata.
- source_word: ἰδιῶται
  choice: pessoas não familiarizadas com isso
  rationale: Comunica que essas pessoas não estão informadas ou iniciadas na prática em questão, sem confundi-las automaticamente com os descrentes mencionados em seguida.
- source_word: ἄπιστοι
  choice: descrentes
  rationale: Equivalente corrente para os que não creem, preservando sua distinção em relação aos ἰδιῶται.
- source_word: μαίνεσθε
  choice: vocês estão fora de si
  rationale: Expressão idiomática natural que transmite a acusação de loucura sem soar clínica, arcaica ou excessivamente coloquial.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: não dirão que
  rationale: Mantém o futuro e a força da pergunta retórica, que espera resposta afirmativa.
- source_word: οὖν
  choice: Portanto
  rationale: Marca explicitamente a inferência tirada do argumento anterior.
- source_word: συνέλθῃ
  choice: se reunir
  rationale: Verbo natural em português para uma comunidade que se junta em assembleia.
theological_decisions:
- issue: Natureza de γλώσσαι em 1 Coríntios 14
  choice: “línguas” no texto principal
  alternative: “idiomas”
  rationale: O termo grego pode designar idiomas, mas neste contexto nomeia o fenômeno carismático em debate. “Línguas” preserva a terminologia reconhecida e não decide se se tratava de idiomas humanos, fala extática ou ambas as coisas.
- issue: Identidade dos ἰδιῶται
  choice: “pessoas não familiarizadas com isso”
  alternative: “pessoas de fora” ou “não instruídos”
  rationale: A formulação preserva a provável ideia de pessoas não informadas ou não iniciadas nas práticas da reunião e mantém a distinção textual em relação aos “descrentes”, sem definir de modo rígido sua relação com a comunidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a pergunta retórica e evita tanto linguagem denominacional quanto a resolução indevida das ambiguidades de γλώσσαι e ἰδιῶται.
