  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: pt
  text: 'Na Lei está escrito: “Por meio de pessoas de outras línguas e pelos lábios de estrangeiros falarei a este povo[a]; e nem mesmo assim eles me ouvirão[b]”, diz o Senhor.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio de outras línguas e pelos lábios de outros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles me darão ouvidos”.'
    reason: lexical_alternative
  - marker: c
    text: A citação evoca Isaías 28.11–12.
    reason: cross_reference
  - marker: d
    text: Como esta é uma citação em que o Deus de Israel fala, algumas traduções trazem “diz o SENHOR”, refletindo o contexto hebraico.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Na Lei
  rationale: Embora a citação venha de Isaías, νόμος pode designar aqui de modo amplo as Escrituras de Israel. A inicial maiúscula preserva esse uso convencional.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada e natural em português para o perfeito passivo que introduz uma citação das Escrituras.
- source_word: ἑτερογλώσσοις
  choice: por meio de pessoas de outras línguas
  rationale: O termo indica pessoas caracterizadas por uma língua diferente. A formulação explicita o referente humano exigido pelo contexto e mantém a ligação com o tema das línguas no capítulo.
- source_word: χείλεσιν ἑτέρων
  choice: pelos lábios de estrangeiros
  rationale: Mantém a imagem concreta de “lábios” e entende ἑτέρων, no contexto, como pessoas de outro povo ou idioma.
- source_word: λαλήσω
  choice: falarei
  rationale: Equivalente direto e natural do futuro de λαλέω.
- source_word: τῷ λαῷ τούτῳ
  choice: a este povo
  rationale: λαός designa naturalmente “povo”, especialmente em uma citação dirigida ao povo da aliança.
- source_word: οὐδ’ οὕτως
  choice: nem mesmo assim
  rationale: 'Conserva a ênfase de οὐδέ e o sentido modal de οὕτως: nem sequer por esse meio extraordinário o povo responderá.'
- source_word: εἰσακούσονταί μου
  choice: eles me ouvirão
  rationale: “Ouvir” é claro e natural, sem eliminar a possível nuance de atender ou dar ouvidos, registrada em nota.
- source_word: λέγει κύριος
  choice: diz o Senhor
  rationale: Reproduz naturalmente a fórmula de citação no presente e traduz κύριος por “Senhor”.
theological_decisions:
- issue: Tradução de κύριος em uma citação na qual o Deus de Israel fala
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριος, portanto “o Senhor” permanece no texto principal. Como a passagem evoca Isaías 28 e, em seu contexto hebraico, identifica o Deus de Israel, a forma “o SENHOR” é registrada como alternativa em nota.
- issue: Nuance de εἰσακούσονταί μου
  choice: eles me ouvirão
  alternative: eles me darão ouvidos
  rationale: O verbo pode expressar tanto ouvir quanto atender. O texto principal preserva uma formulação simples, enquanto a nota apresenta explicitamente a nuance de acatamento sem transformá-la na única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens principais do grego foram preservadas, mas a expressão substantivada ἑτερογλώσσοις foi explicitada para soar natural em português. A pontuação distingue a introdução paulina, a citação e a fórmula final de atribuição.
