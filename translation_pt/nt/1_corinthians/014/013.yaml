  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: pt
  text: Por isso, quem fala em uma língua[a] ore para que interprete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em um idioma». O grego diz literalmente «em uma língua», expressão habitual neste capítulo para uma fala que precisa ser interpretada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Conjunção inferencial que apresenta uma conclusão decorrente do argumento anterior; «Por isso» é natural e conserva a relação lógica.
- source_word: ὁ λαλῶν
  choice: quem fala
  rationale: O particípio presente com artigo funciona como substantivo e designa genericamente qualquer pessoa que fale; «quem fala» preserva o singular e evita restringir a referência por gênero.
- source_word: γλώσσῃ
  choice: em uma língua
  rationale: O dativo singular acompanha «falar». «Língua» preserva tanto o sentido lexical quanto a terminologia recorrente do capítulo, sem decidir se se trata necessariamente de um idioma humano ou de outra forma de fala que exige interpretação.
- source_word: προσευχέσθω
  choice: ore
  rationale: Imperativo presente na terceira pessoa; «ore» transmite diretamente a força exortativa e é corrente em português.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o conteúdo pretendido da oração; «para que» conserva claramente a nuance de propósito.
- source_word: διερμηνεύῃ
  choice: possa interpretá-la
  rationale: O verbo indica tornar inteligível para outros aquilo que foi falado. «Interpretar» se ajusta ao tema do capítulo sem limitar o sentido à tradução entre idiomas; o pronome retoma naturalmente «uma língua».
theological_decisions:
- issue: Sentido de γλώσσῃ em 1 Coríntios 12–14
  choice: língua
  alternative: idioma
  rationale: O contexto trata de uma manifestação que precisa ser interpretada na reunião da comunidade. «Língua» mantém a conexão literária e teológica do capítulo e não resolve indevidamente se a fala é um idioma humano, fala extática ou uma categoria mais ampla.
- issue: Expressão masculina singular genérica
  choice: quem fala ... possa interpretar
  alternative: aquele que fala ... possa interpretar
  rationale: Embora o grego empregue formas gramaticalmente masculinas no singular, elas representam qualquer pessoa nessa situação. A construção portuguesa «quem fala» mantém o referente singular sem sugerir que a exortação se limite aos homens.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O imperativo «ore» conserva a força direta do grego; «interpretá-la» explicita apenas a retomada gramatical de «uma língua», sem acrescentar um agente ou uma explicação teológica.
