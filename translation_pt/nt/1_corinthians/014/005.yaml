id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: pt
  text: Quero que todos vocês falem em línguas, mas quero ainda mais que profetizem. Quem profetiza é maior do que quem fala em línguas, a não ser que este interprete[a], para que a igreja seja edificada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a não ser que alguém interprete”. O verbo grego no singular pode referir-se à própria pessoa que fala em línguas ou, de modo mais geral no contexto, à provisão de interpretação.'
    reason: alternative_reading
  - marker: b
    text: “Edificada” significa fortalecida e desenvolvida espiritualmente como comunidade reunida.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Quero
  rationale: Expressa de modo direto e natural o desejo pessoal de Paulo, sem acrescentar um marcador temporal ausente no grego.
- source_word: πάντας ὑμᾶς
  choice: todos vocês
  rationale: Preserva tanto a pluralidade do pronome quanto o caráter abrangente da expressão.
- source_word: λαλεῖν γλώσσαις
  choice: falem em línguas
  rationale: É a formulação corrente em português para o fenômeno tratado em 1 Coríntios 12–14 e mantém a terminologia de γλῶσσα.
- source_word: μᾶλλον δὲ
  choice: mas quero ainda mais
  rationale: Explicita naturalmente em português a continuidade do verbo de desejo e conserva a preferência comparativa, sem apresentar rejeição absoluta das línguas.
- source_word: ἵνα προφητεύητε
  choice: que profetizem
  rationale: Depois de θέλω, a oração com ἵνα expressa o conteúdo desejado; o subjuntivo português é natural e preciso.
- source_word: μείζων
  choice: maior
  rationale: Mantém o comparativo do texto, deixando que a finalidade de edificar a igreja determine seu sentido funcional no contexto.
- source_word: ὁ προφητεύων
  choice: Quem profetiza
  rationale: Reproduz de maneira inclusiva e idiomática o particípio substantivado genérico.
- source_word: ὁ λαλῶν γλώσσαις
  choice: quem fala em línguas
  rationale: Mantém o paralelismo da comparação e a terminologia já empregada na primeira oração.
- source_word: ἐκτὸς εἰ μὴ
  choice: a não ser que
  rationale: Equivalente idiomático da cláusula de exceção.
- source_word: διερμηνεύῃ
  choice: este interprete
  rationale: O singular retoma mais naturalmente quem fala em línguas; o demonstrativo evita ambiguidade gramatical excessiva em português, enquanto a nota preserva a possibilidade contextual de outra pessoa interpretar.
- source_word: ἡ ἐκκλησία
  choice: a igreja
  rationale: Designa aqui a comunidade cristã reunida e é a expressão mais reconhecível e natural em português.
- source_word: οἰκοδομὴν λάβῃ
  choice: seja edificada
  rationale: Transmite com naturalidade o sentido metafórico de receber edificação, evitando a construção pouco idiomática 'receba edificação'.
theological_decisions:
- issue: Superioridade relativa da profecia sobre as línguas
  choice: manter «maior», com a finalidade de edificação da igreja definindo o sentido contextual
  alternative: traduzir como «mais importante» ou entender como superioridade de posição espiritual
  rationale: A oração final relaciona a comparação ao benefício para a comunidade. A tradução conserva a formulação comparativa sem introduzir uma hierarquia de valor pessoal ou santidade.
- issue: Referente de διερμηνεύῃ
  choice: entender que o próprio falante em línguas interpreta
  alternative: entender que outra pessoa interpreta ou que simplesmente haja interpretação
  rationale: Sem um novo sujeito expresso, o verbo singular retoma mais naturalmente a pessoa que fala em línguas. Contudo, o contexto mais amplo admite interpretação por outra pessoa, possibilidade preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para explicitar o plural e «igreja» no sentido contextual da comunidade reunida. As notas são marcadas no texto como [a] e [b].
