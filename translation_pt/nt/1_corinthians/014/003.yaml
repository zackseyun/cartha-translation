id: 1CO.14.3
reference: 1 Corinthians 14:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: pt
  text: Mas quem profetiza fala às pessoas para edificação, encorajamento e consolo.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fortalecimento” ou “para crescimento”. A palavra grega emprega a figura de construir.
    reason: lexical_alternative
  - marker: b
    text: “Encorajamento” traduz παράκλησις, que também pode significar “exortação” ou, em alguns contextos, “conforto”.
    reason: lexical_alternative
  - marker: c
    text: “Consolo” traduz παραμυθία; outra tradução possível é “conforto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Mas quem profetiza
  rationale: O particípio presente substantivado designa a pessoa que pratica a ação. “Quem profetiza” reproduz isso com naturalidade, e “mas” expressa o contraste leve de δέ com o versículo anterior.
- source_word: ἀνθρώποις
  choice: às pessoas
  rationale: O dativo plural indica os destinatários da fala e tem sentido genérico, não exclusivamente masculino.
- source_word: λαλεῖ
  choice: fala
  rationale: Tradução direta do presente de λαλέω; com “às pessoas”, a relação com os destinatários fica clara.
- source_word: οἰκοδομὴν
  choice: para edificação
  rationale: No uso paulino, οἰκοδομή frequentemente denota fortalecimento espiritual mediante a metáfora de construir. A preposição “para” explicita de modo natural a finalidade ou o resultado da fala.
- source_word: παράκλησιν
  choice: encorajamento
  rationale: παράκλησις pode significar encorajamento, exortação ou conforto. “Encorajamento” é corrente e permite distingui-lo do tom consolador de παραμυθία.
- source_word: παραμυθίαν
  choice: consolo
  rationale: παραμυθία denota fala que conforta ou consola. “Consolo” preserva a distinção possível em relação a παράκλησις e é mais natural no português atual do que “consolação” neste contexto.
theological_decisions:
- issue: Sentido de “profetiza” no contexto da congregação
  choice: Manter “profetiza” sem restringir seu sentido
  alternative: “prega” ou “transmite uma revelação”
  rationale: O versículo descreve os efeitos da profecia em contraste com as línguas, mas não a define de modo exaustivo. Manter o termo preserva sua amplitude e evita impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concisa conserva a sequência tríplice do grego e não define indevidamente a natureza da profecia.
