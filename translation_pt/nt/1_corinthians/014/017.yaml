  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: pt
  text: Pois você dá graças como convém, mas a outra pessoa não é edificada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ
  choice: você
  rationale: Mantém a segunda pessoa do singular e a referência direta ao indivíduo, com boa legibilidade no português brasileiro contemporâneo.
- source_word: μὲν γὰρ
  choice: pois, de fato
  rationale: “Pois” expressa a explicação introduzida por γάρ, enquanto “de fato” conserva o reconhecimento concessivo de μέν antes do contraste com ἀλλά.
- source_word: καλῶς
  choice: como convém
  rationale: Comunica o sentido de fazer algo bem ou adequadamente e soa mais natural neste contexto do que “dá graças bem”.
- source_word: εὐχαριστεῖς
  choice: dá graças
  rationale: Expressão corrente para o ato de agradecer a Deus em oração ou no culto, sem acrescentar um objeto que o grego deixa implícito.
- source_word: ἀλλ’
  choice: mas
  rationale: Preserva diretamente o contraste adversativo.
- source_word: ὁ ἕτερος
  choice: a outra pessoa
  rationale: Torna explícito, sem sobreinterpretar, que se trata do outro participante ou ouvinte na reunião.
- source_word: οὐκ οἰκοδομεῖται
  choice: não é edificada
  rationale: Conserva a voz passiva e a metáfora paulina de construção aplicada ao fortalecimento espiritual da pessoa.
theological_decisions:
- issue: Metáfora paulina de οἰκοδομέω no contexto da reunião da igreja
  choice: não é edificada
  alternative: não é fortalecida
  rationale: A opção principal preserva a imagem de construção usada por Paulo e não restringe o benefício a uma dimensão doutrinária ou emocional específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o “você” singular, o reconhecimento inicial de Paulo e o contraste central, sem transformar o indicativo em possibilidade nem explicar além do que o texto afirma.
