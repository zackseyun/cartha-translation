  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: pt
  text: Mas, se todos profetizarem e entrar uma pessoa descrente ou não instruída[a], ela será convencida por todos e examinada por todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pessoa de fora”. O termo grego pode indicar uma pessoa não informada, não iniciada ou que não faz parte do grupo que está falando.
    reason: Leitura alternativa plausível de ἰδιώτης.
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: Mantém o quantificador inclusivo e sua repetição enfática no contexto da reunião.
- source_word: προφητεύωσιν
  choice: profetizarem
  rationale: Preserva a categoria paulina estabelecida ao longo do capítulo, sem reduzi-la a uma explicação interpretativa.
- source_word: ἄπιστος
  choice: descrente
  rationale: No contexto, designa alguém que não crê; “descrente” é corrente, claro e não sugere apenas infidelidade moral.
- source_word: ἰδιώτης
  choice: pessoa não instruída
  rationale: Expressa a falta de conhecimento ou familiaridade relevante com o que ocorre na reunião, sem impor a ideia de uma categoria eclesiástica moderna. A possibilidade de se tratar de alguém de fora é registrada em nota.
- source_word: ἐλέγχεται
  choice: é convencido
  rationale: Comunica que a fala profética leva a pessoa a reconhecer sua condição, preservando a dimensão de convicção sem acrescentar condenação final.
- source_word: ἀνακρίνεται
  choice: é examinado
  rationale: Retém o sentido de exame ou escrutínio e evita intensificá-lo para uma sentença condenatória.
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Reproduz de modo conciso a frase grega e sua repetição retórica.
- source_word: δέ
  choice: Mas / e
  rationale: O primeiro δέ marca o contraste com o cenário anterior; a segunda ocorrência é representada por “e”, de forma natural na oração condicional.
- source_word: τις
  choice: algum
  rationale: Conserva a referência indefinida antes das duas possíveis descrições da pessoa que entra.
theological_decisions:
- issue: Sentido de ἰδιώτης no contexto da reunião
  choice: pessoa não instruída
  alternative: alguém de fora
  rationale: O contexto imediato enfatiza inteligibilidade e o efeito da fala congregacional sobre quem não possui entendimento ou familiaridade. A tradução principal não determina que a pessoa esteja necessariamente fora da comunidade, enquanto a nota preserva essa leitura contextual plausível.
- issue: Força de ἐλέγχεται e ἀνακρίνεται
  choice: é convencido; é examinado
  alternative: é repreendido; é julgado
  rationale: A formulação mantém a progressão entre convicção e escrutínio sem transformar o segundo verbo em condenação judicial definitiva.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura condicional e a repetição “por todos” foram preservadas. O marcador da nota foi colocado junto à expressão correspondente, “pessoa não instruída”.
