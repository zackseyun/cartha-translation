  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: pt
  text: Pois, se oro em uma língua[a], meu espírito ora, mas minha mente[b] fica infrutífera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em um idioma”. A palavra grega pode designar uma língua humana ou “língua” no sentido de fala capacitada pelo Espírito, como é usada ao longo deste capítulo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu entendimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Pois, se
  rationale: “Pois” preserva a função explicativa de γάρ no argumento, e “se” expressa naturalmente a condição introduzida por ἐάν.
- source_word: προσεύχωμαι
  choice: oro
  rationale: O presente do subjuntivo na oração condicional é expresso de modo claro e idiomático pelo presente em português.
- source_word: γλώσσῃ
  choice: em uma língua
  rationale: Mantém o singular e a amplitude lexical de γλῶσσα, que pode designar um idioma ou a fala chamada de “língua” neste capítulo, sem definir antecipadamente sua natureza.
- source_word: τὸ πνεῦμά μου
  choice: meu espírito
  rationale: Reproduz diretamente o possessivo e preserva o provável contraste antropológico com “minha mente”, sem ampliar o texto para “Espírito Santo”.
- source_word: προσεύχεται
  choice: ora
  rationale: O presente simples comunica de maneira natural a ação paralela a “oro”.
- source_word: ὁ δὲ νοῦς μου
  choice: mas minha mente
  rationale: “Mente” é um equivalente direto e abrangente de νοῦς; “mas” torna explícito o contraste marcado por δέ.
- source_word: ἄκαρπός ἐστιν
  choice: fica infrutífera
  rationale: Preserva a metáfora de ἄκαρπος. “Fica” soa mais natural em português nessa construção condicional do que uma reprodução rígida com “é”.
theological_decisions:
- issue: Referente de τὸ πνεῦμά μου (“meu espírito”)
  choice: o espírito da própria pessoa que ora
  alternative: o Espírito Santo atuando na pessoa
  rationale: O possessivo “meu” e o contraste com “minha mente” favorecem a referência ao espírito humano. A tradução literal “meu espírito” conserva, porém, a formulação do texto sem excluir explicações sobre a atuação do Espírito Santo.
- issue: Natureza da γλῶσσα (“língua”)
  choice: manter o termo amplo “língua”
  alternative: especificar “idioma humano” ou “fala extática capacitada pelo Espírito”
  rationale: O vocábulo e o contexto admitem debate quanto à natureza precisa da fala. A tradução não resolve uma ambiguidade que o versículo não esclarece por si só.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade no Brasil. A ordem e o contraste do grego foram preservados sem rigidez, e a metáfora de falta de fruto foi mantida.
