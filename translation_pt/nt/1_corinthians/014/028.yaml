  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: pt
  text: Mas, se não houver intérprete, fique calado na igreja[a] e fale consigo mesmo e com Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na assembleia” ou “na congregação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διερμηνευτής
  choice: intérprete
  rationale: Designa quem torna inteligível aos demais o que foi dito em outra língua; “intérprete” é a forma corrente e clara neste contexto.
- source_word: σιγάτω
  choice: fique calado
  rationale: O imperativo presente na terceira pessoa expressa uma ordem. A formulação preserva essa força em português natural, sem sugerir necessariamente silêncio absoluto fora da fala pública em questão.
- source_word: ἐν ἐκκλησίᾳ
  choice: na igreja
  rationale: No contexto de 1 Coríntios 14, refere-se à comunidade cristã reunida. “Na igreja” é natural e amplamente compreensível; a nota registra alternativas que tornam explícito o sentido de reunião.
- source_word: ἑαυτῷ
  choice: consigo mesmo
  rationale: Traduz diretamente o pronome reflexivo no dativo, sem acrescentar qualificações como “em particular” ou “sozinho”.
- source_word: λαλείτω
  choice: fale
  rationale: O imperativo dá continuidade à instrução sobre a fala; “fale” é neutro, atual e digno.
- source_word: τῷ θεῷ
  choice: com Deus
  rationale: Com o verbo “falar”, o português idiomático emprega “com”; a expressão preserva Deus como destinatário dessa fala.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Mas, se não houver
  rationale: Reproduz de modo idiomático a condição com o subjuntivo de εἰμί e indica a ausência de intérprete.
theological_decisions:
- issue: Alcance da ordem de silêncio no culto comunitário
  choice: A ordem impede a fala pública à igreja quando não há intérprete, mas permite a fala consigo mesmo e com Deus.
  alternative: Entender que o falante deve cessar absolutamente toda fala, ou que pode continuar falando de maneira dirigida à congregação.
  rationale: O contraste entre ficar calado na igreja e falar consigo mesmo e com Deus limita a manifestação pública sem definir além do texto a modalidade ou a audibilidade dessa fala.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “fique calado” comunica diretamente o imperativo; “consigo mesmo e com Deus” mantém a concisão e a ambiguidade prática do original.
