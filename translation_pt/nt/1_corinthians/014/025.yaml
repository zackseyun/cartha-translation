id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: pt
  text: 'os segredos do seu coração se tornam evidentes e, assim, ele se prostrará com o rosto em terra, adorará a Deus e declarará: “Deus realmente está entre vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus realmente está em vocês.”'
    reason: A expressão grega ἐν ὑμῖν pode indicar tanto presença no meio da comunidade quanto presença interior.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: os segredos
  rationale: O adjetivo neutro plural substantivado designa aquilo que está oculto no íntimo da pessoa. “Os segredos” é natural e adequado ao contexto de revelação.
- source_word: τῆς καρδίας αὐτοῦ
  choice: do seu coração
  rationale: Preserva o termo antropológico bíblico “coração” como centro dos pensamentos e motivos interiores, sem substituí-lo por uma interpretação.
- source_word: φανερὰ γίνεται
  choice: se tornam evidentes
  rationale: Mantém o sentido de algo oculto que passa a ficar manifesto ou claro, inclusive o aspecto processual de γίνεται.
- source_word: καὶ οὕτως
  choice: e, assim
  rationale: Expressa de modo natural a conexão resultativa entre a exposição dos segredos e a reação subsequente.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ele se prostrará com o rosto em terra
  rationale: Comunica claramente a postura física de profunda reverência, evitando a possível estranheza literal de “cair sobre o rosto”.
- source_word: προσκυνήσει τῷ θεῷ
  choice: adorará a Deus
  rationale: Neste contexto, o verbo indica adoração dirigida a Deus; a postura de prostração já está expressa na oração anterior.
- source_word: ἀπαγγέλλων
  choice: e declarará
  rationale: Transforma naturalmente o particípio em verbo coordenado, preservando a ação concomitante de reconhecer e enunciar a presença divina.
- source_word: Ὄντως
  choice: realmente
  rationale: Transmite em português atual a ênfase de autenticidade e certeza do advérbio.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto da igreja reunida, expressa a presença de Deus no meio da comunidade. A possibilidade literal “em vocês” é mantida em nota.
theological_decisions:
- issue: Sentido de ἐν ὑμῖν na confissão final
  choice: entre vocês
  alternative: em vocês
  rationale: O contexto imediato é a reunião comunitária e o reconhecimento, por alguém de fora, da presença de Deus no meio da congregação. Como a preposição também pode indicar presença interior, a alternativa é preservada em nota, sem eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” representa naturalmente o plural de ὑμῖν. A construção verbal foi levemente reordenada para fluência sem alterar a sequência lógica do grego.
