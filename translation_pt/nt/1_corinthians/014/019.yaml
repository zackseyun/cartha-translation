reference: 1 Corinthians 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: pt
  text: Mas, na igreja, prefiro falar cinco palavras com o meu entendimento, para também instruir outros, a falar dez mil palavras em uma língua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em uma linguagem”. A palavra grega pode significar “língua” ou “linguagem”; aqui, refere-se ao tipo de fala discutido ao longo de 1 Coríntios 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: na igreja
  rationale: Neste contexto, refere-se à comunidade cristã reunida para o culto. “Na igreja” é natural em português e mantém o sentido comunitário.
- source_word: θέλω
  choice: prefiro
  rationale: Embora o verbo signifique literalmente “quero” ou “desejo”, a construção contrastiva com ἢ expressa preferência. “Prefiro” comunica essa força de modo claro e conciso.
- source_word: πέντε λόγους
  choice: cinco palavras
  rationale: A tradução concreta preserva o contraste retórico deliberado entre cinco e dez mil palavras.
- source_word: τῷ νοΐ μου
  choice: com a minha mente
  rationale: Mantém a referência explícita ao νοῦς e o contraste contextual entre fala mentalmente compreendida e fala não compreendida pelos ouvintes, sem substituir o termo por uma explicação.
- source_word: λαλῆσαι
  choice: falar
  rationale: É a forma portuguesa comum e adequada para expressão verbal pública neste contexto.
- source_word: κατηχήσω
  choice: instruir
  rationale: Expressa o sentido de transmitir ensino oral sem importar o sentido eclesiástico técnico posterior de “catequizar”.
- source_word: ἄλλους
  choice: outros
  rationale: Reproduz de maneira simples e natural a referência às demais pessoas da comunidade reunida.
- source_word: μυρίους λόγους
  choice: dez mil palavras
  rationale: Conserva o número básico de μύριοι e o contraste vívido com “cinco palavras”, em vez de generalizá-lo como “inúmeras”.
- source_word: ἐν γλώσσῃ
  choice: em uma língua
  rationale: “Língua” preserva a ambiguidade lexical e a terminologia do capítulo. O singular corresponde ao texto grego e evita definir a natureza exata do fenômeno.
theological_decisions:
- issue: Sentido de γλῶσσα em 1 Coríntios 12–14
  choice: em uma língua
  alternative: em língua; em uma linguagem; em línguas
  rationale: A tradução mantém o termo lexicalmente aberto, sem decidir se Paulo se refere especificamente a um idioma humano estrangeiro, a fala carismática ou a outra forma de expressão. A nota registra essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe comparativa natural (“prefiro... a...”). O artigo em “uma língua” torna a expressão idiomática em português, enquanto a nota preserva a amplitude semântica e a controvérsia contextual.
