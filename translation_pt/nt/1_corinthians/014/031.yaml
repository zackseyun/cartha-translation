  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: pt
  text: Pois todos podem profetizar, um por um[a], para que todos aprendam e todos sejam encorajados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um de cada vez”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam exortados” ou “consolados”; o verbo grego pode transmitir as ideias de encorajamento, exortação ou consolo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: podem
  rationale: Expressa capacidade ou possibilidade no presente; “podem” é natural em português e se ajusta à instrução prática de Paulo.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a instrução anterior, preservando de modo conciso a ligação argumentativa.
- source_word: καθ’ ἕνα
  choice: um por um
  rationale: Expressão idiomática que indica sequência individual; no contexto, cada pessoa fala por sua vez.
- source_word: πάντες
  choice: todos
  rationale: Mantém as três ocorrências e sua ênfase, sem restringir no texto os referentes além do que o contexto permite.
- source_word: προφητεύειν
  choice: profetizar
  rationale: Preserva a categoria paulina estabelecida sem reduzi-la a uma paráfrase interpretativa mais estreita.
- source_word: ἵνα
  choice: para que
  rationale: Comunica naturalmente a ideia de propósito ou resultado introduzida pela conjunção.
- source_word: μανθάνωσιν
  choice: aprendam
  rationale: Mantém o sentido pedagógico geral e se encaixa naturalmente na oração de finalidade.
- source_word: παρακαλῶνται
  choice: sejam encorajados
  rationale: O verbo pode indicar encorajamento, exortação ou consolo. Neste contexto de edificação da comunidade, “encorajados” conserva melhor sua amplitude sem limitá-lo apenas à repreensão ou ao consolo.
theological_decisions:
- issue: Alcance de πάντες (“todos”) na instrução à comunidade reunida
  choice: Mantém-se “todos” nas três ocorrências, sem explicitar “todos vocês” nem “todos os profetas”.
  alternative: Traduzir a primeira ocorrência como “todos vocês” ou “todos os profetas” e as demais como “todos”.
  rationale: A primeira ocorrência provavelmente se refere aos que podem profetizar, enquanto as duas seguintes abrangem os que aprendem e recebem encorajamento. A repetição aberta do grego permite que o contexto delimite cada grupo sem resolver no texto uma questão que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição de “todos” foi preservada por sua força retórica, e “um por um” mantém a ênfase na ordem da participação comunitária.
