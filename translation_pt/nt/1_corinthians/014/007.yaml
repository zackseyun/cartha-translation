  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: pt
  text: Até mesmo coisas sem vida que produzem som — seja uma flauta, seja uma lira —, se não emitirem notas distintas, como se reconhecerá o que é tocado na flauta ou na lira?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως
  choice: Até mesmo
  rationale: Introduz com ênfase a comparação entre a fala humana e instrumentos sem vida, de modo natural em português.
- source_word: τὰ ἄψυχα
  choice: coisas sem vida
  rationale: Preserva a referência ampla a objetos inanimados e é mais corrente do que 'coisas inanimadas'.
- source_word: φωνὴν διδόντα
  choice: que produzem som
  rationale: Expressa idiomaticamente a ideia de 'dar som/voz' sem atribuir fala aos instrumentos.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: seja uma flauta, seja uma lira
  rationale: αὐλός designa um instrumento de sopro semelhante a uma flauta ou tubo; κιθάρα é um antigo instrumento de cordas mais precisamente identificado como lira.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: se não emitirem notas distintas
  rationale: Comunica de forma clara a diferenciação necessária entre os sons musicais; o plural retoma naturalmente os instrumentos mencionados.
- source_word: πῶς γνωσθήσεται
  choice: como se reconhecerá
  rationale: Mantém o futuro passivo e se ajusta ao contexto de identificar aquilo que está sendo executado.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: o que é tocado na flauta ou na lira
  rationale: Os particípios substantivados indicam aquilo que é executado nos instrumentos; a formulação conserva o paralelismo sem repetição pesada.
