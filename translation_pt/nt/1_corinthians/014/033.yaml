id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: pt
  text: Pois Deus não é Deus de desordem, mas de paz,[a] como em todas as igrejas dos santos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois Deus não é Deus de confusão, mas de paz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como acontece em todas as igrejas do povo santo de Deus”. Alguns ligam esta expressão ao versículo seguinte, em vez de ligá-la a este.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: desordem
  rationale: No contexto das reuniões comunitárias, indica desordem ou perturbação, não apenas confusão mental. “Desordem” exprime com naturalidade o contraste com a paz.
- source_word: εἰρήνης
  choice: paz
  rationale: Equivalente direto e tradicional de εἰρήνη; aqui comunica paz harmoniosa e ordenada na comunidade.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: O artigo grego identifica o Deus pessoal; em português, o nome próprio normalmente dispensa artigo nesta construção.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão das orientações anteriores e mantém de modo conciso a relação argumentativa.
- source_word: ὡς
  choice: como em
  rationale: Preserva a formulação compacta e a possível comparação com o que ocorre nas igrejas, sem explicitar além do grego.
- source_word: ἐκκλησίαις
  choice: igrejas
  rationale: É o termo corrente e contextualmente adequado para as comunidades cristãs locais.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Mantém a designação paulina tradicional para os fiéis e sua ligação lexical com santidade; uma formulação explicativa aparece em nota.
theological_decisions:
- issue: Ligação sintática de ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Ligada ao versículo 33 como comparação ou referência à prática de todas as igrejas
  alternative: Ligada ao versículo seguinte, iniciando a declaração sobre a conduta nas igrejas
  rationale: A pontuação fornecida no SBLGNT favorece a ligação com o versículo 33, mas o grego permite a outra divisão. A tradução principal segue o texto fornecido, e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção repetida “Deus não é Deus de...” preserva a força e a concisão do grego; “santos” mantém o vocabulário paulino tradicional.
