base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: pt
  text: Pois, se a trombeta der um som indistinto[a], quem se preparará para a batalha?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um som pouco claro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “para a guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação que sustenta o argumento anterior; “Pois” expressa essa relação de modo natural e conciso em português.
- source_word: ἐὰν
  choice: se
  rationale: Introduz a condição ilustrativa com o subjuntivo δῷ; “se” é o equivalente direto e idiomático.
- source_word: ἄδηλον
  choice: indistinto
  rationale: Indica algo não claro ou não reconhecível. No contexto de um sinal de trombeta, “indistinto” comunica precisamente a falta de definição do toque.
- source_word: φωνὴν
  choice: som
  rationale: Embora possa significar “voz”, em relação à trombeta refere-se naturalmente ao som emitido.
- source_word: σάλπιγξ
  choice: a trombeta
  rationale: O singular definido funciona naturalmente em português para representar genericamente esse instrumento usado como sinal militar.
- source_word: δῷ
  choice: der
  rationale: Preserva a imagem do verbo δίδωμι, “dar”, e a expressão “dar um som” é clara em português.
- source_word: τίς
  choice: quem
  rationale: Reproduz diretamente o pronome interrogativo na pergunta retórica.
- source_word: παρασκευάσεται
  choice: se preparará
  rationale: A forma média sugere preparar-se ou pôr-se em prontidão; o pronome reflexivo torna essa nuance explícita e natural em português.
- source_word: εἰς πόλεμον
  choice: para a batalha
  rationale: Embora πόλεμος também possa ser traduzido por “guerra”, “batalha” se ajusta ao contexto imediato de um toque militar que convoca combatentes.
