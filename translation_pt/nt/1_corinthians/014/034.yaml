reference: 1 Corinthians 14:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: pt
  text: As mulheres[a] devem ficar em silêncio nas igrejas, pois não lhes é permitido falar[b]; mas devem manter-se submissas, assim como também diz a lei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as esposas”; o termo grego pode significar “mulheres” ou “esposas”, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: O versículo não especifica que tipo de fala está em vista; alguns entendem a expressão de modo mais restrito à luz do contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “a Lei”; Paulo pode estar se referindo especificamente à Lei mosaica ou, de modo mais amplo, às Escrituras.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: mulheres
  rationale: γυνή pode significar “mulher” ou “esposa”. Como o versículo não menciona maridos, o sentido mais amplo fica no texto principal, e a alternativa é registrada em nota.
- source_word: ἐκκλησίαις
  choice: igrejas
  rationale: No uso paulino, ἐκκλησία frequentemente designa as comunidades cristãs reunidas. “Igrejas” é a forma mais natural e reconhecível em português moderno.
- source_word: σιγάτωσαν
  choice: devem ficar em silêncio
  rationale: O imperativo presente pede silêncio ou contenção na situação descrita e corresponde ao uso do mesmo verbo no contexto próximo do capítulo.
- source_word: ἐπιτρέπεται
  choice: não lhes é permitido
  rationale: A forma passiva expressa negação de permissão. Esta construção é clara e preserva esse valor sem acrescentar quem concede ou nega a permissão.
- source_word: λαλεῖν
  choice: falar
  rationale: λαλέω é um verbo amplo para o ato de falar. “Falar” mantém essa generalidade sem determinar no texto principal que tipo de fala está em vista.
- source_word: ὑποτασσέσθωσαν
  choice: devem manter-se submissas
  rationale: O imperativo médio/passivo descreve uma postura de submissão. “Manter-se submissas” soa natural em português e não introduz um objeto que o grego não explicita.
- source_word: νόμος
  choice: lei
  rationale: O grego não esclarece aqui se νόμος se refere especificamente à Lei mosaica ou, em sentido mais amplo, às Escrituras; a forma “lei” mantém essa questão aberta.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: assim como também diz a lei
  rationale: A formulação preserva tanto a comparação introduzida por καθὼς quanto o valor adicional de καί.
theological_decisions:
- issue: Referente de γυναῖκες
  choice: mulheres nas igrejas
  alternative: esposas nas igrejas
  rationale: O substantivo grego admite ambos os sentidos. Como o versículo não menciona maridos, “mulheres” é mantido no texto, sem excluir a alternativa lexical indicada em nota.
- issue: Alcance da proibição de falar
  choice: traduzir de modo direto, sem limitar no texto principal o tipo de fala
  alternative: fala desordeira ou fala ligada à avaliação de profecias
  rationale: O versículo emprega apenas o verbo amplo “falar”. Como a possível limitação pelo contexto é debatida, a tradução não incorpora uma interpretação mais estreita ao texto.
- issue: Sentido de ὁ νόμος
  choice: a lei
  alternative: a Lei mosaica especificamente ou as Escrituras em sentido mais amplo
  rationale: A referência exata de Paulo não é identificada no versículo. A tradução e a nota preservam essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a força imperativa sem recorrer a linguagem excessivamente arcaica ou áspera. As notas preservam as ambiguidades lexicais e interpretativas reais do grego.
