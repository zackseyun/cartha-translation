  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: pt
  text: Quem fala em uma língua[a] edifica a si mesmo, mas quem profetiza edifica a igreja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em um idioma”. Neste capítulo, porém, o termo provavelmente se refere ao dom de falar em línguas; a natureza exata dessa fala é discutida.
    reason: lexical_alternative
  - marker: b
    text: Ou “a assembleia” ou “a congregação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Quem fala
  rationale: O artigo com o particípio presente funciona como substantivo e descreve, de modo representativo, qualquer pessoa caracterizada por essa ação. “Quem fala” é natural em português e mantém o paralelismo com “quem profetiza”.
- source_word: γλώσσῃ
  choice: em uma língua
  rationale: O dativo singular sem artigo é preservado. No contexto, o termo se refere ao fenômeno ou dom de falar em línguas, cuja natureza exata permanece discutida; a formulação não o restringe a uma interpretação específica.
- source_word: ἑαυτὸν
  choice: a si mesmo
  rationale: O pronome reflexivo masculino singular concorda com a construção representativa. “A si mesmo” preserva tanto a reflexividade quanto a forma singular masculina do grego.
- source_word: οἰκοδομεῖ
  choice: edifica
  rationale: O verbo é metafórico e indica fortalecimento ou benefício espiritual. “Edifica” é corrente no português bíblico, compreensível e conserva a metáfora de construção.
- source_word: ὁ δὲ προφητεύων
  choice: mas quem profetiza
  rationale: O particípio substantivado é traduzido em paralelo com a primeira oração, e “mas” expressa o contraste leve introduzido por δέ.
- source_word: ἐκκλησίαν
  choice: a igreja
  rationale: Neste contexto paulino, o termo designa a comunidade cristã reunida. “Igreja” é a opção mais natural e reconhecível, embora “assembleia” ou “congregação” também sejam possíveis.
theological_decisions:
- issue: Sentido de γλώσσῃ em 1 Coríntios 12–14
  choice: “em uma língua”, no contexto do dom de línguas, sem definir a natureza exata da fala
  alternative: “em um idioma” ou uma formulação que determine explicitamente fala extática ou língua estrangeira
  rationale: O contexto trata do dom de línguas no culto, mas não exige que a tradução resolva se a manifestação consiste exclusivamente em idioma estrangeiro, fala extática ou outra forma de fala inspirada.
- issue: Formas masculinas singulares usadas de maneira representativa
  choice: “Quem fala... a si mesmo”
  alternative: “A pessoa que fala... a si própria” ou uma formulação plural inclusiva
  rationale: A tradução mantém o singular e a reflexividade do texto grego sem limitar o princípio aos homens; “quem” funciona naturalmente de maneira geral em português.
- issue: Contraste entre edificação individual e comunitária
  choice: Preservar a afirmação descritiva sem qualificar moralmente a autoedificação
  alternative: Acrescentar linguagem que condene ou aprove explicitamente a autoedificação
  rationale: O versículo estabelece um contraste entre o alcance individual e o comunitário, mas, isoladamente, não explicita uma avaliação completa da primeira ação. A tradução não deve importar essa conclusão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “Quem fala... mas quem profetiza” reproduz o paralelismo do grego de forma idiomática. “Edifica” preserva a metáfora paulina sem recorrer a uma paráfrase explicativa.
