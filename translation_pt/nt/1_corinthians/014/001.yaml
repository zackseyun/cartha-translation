  source_fidelity: 'O sentido central é preservado: os dois imperativos, o objeto «amor», o desejo pelas τὰ πνευματικά e a prioridade dada à profecia. Contudo, «desejem com zelo» reproduz desnecessariamente a raiz semântica e soa pouco idiomático em português atual. «Coisas espirituais» traduz com maior transparência a amplitude formal de τὰ πνευματικά, sem antecipar interpretativamente «dons».'
  naturalness: «Busquem o amor» é claro e aceitável para o imperativo Διώκετε. «Desejem ardentemente» é mais natural e expressivo que «desejem com zelo». A sequência «sobretudo profetizar» é fluente e preserva a construção de conteúdo do desejo.
  terminology: «Amor» mantém a ligação lexical com o capítulo anterior. «Coisas espirituais» conserva a amplitude da expressão grega; a nota explica adequadamente que o contexto trata de manifestações concedidas pelo Espírito. «Profetizar» é o termo bíblico estabelecido e não requer paráfrase.
  issues:
