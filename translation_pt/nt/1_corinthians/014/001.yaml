reference: 1 Corinthians 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: pt
  text: Busquem o amor e desejem ardentemente as coisas espirituais[a], sobretudo profetizar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os dons espirituais”. A expressão grega é mais ampla que “dons”, mas, neste contexto, o foco recai sobre manifestações concedidas pelo Espírito na igreja.
    reason: lexical_alternative
  - marker: b
    text: Ou “mas, antes, que vocês profetizem”.
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Busquem
  rationale: Expressa a ordem de perseguir ou procurar com empenho, de modo natural em português, conservando a ideia de esforço contínuo.
- source_word: τὴν ἀγάπην
  choice: o amor
  rationale: É a tradução corrente de ἀγάπη e mantém a ligação direta com o capítulo anterior.
- source_word: ζηλοῦτε
  choice: desejem com zelo
  rationale: Preserva tanto a ideia de desejo intenso quanto a de zelo presente no verbo grego.
- source_word: τὰ πνευματικά
  choice: as realidades espirituais
  rationale: Mantém a amplitude do neutro plural grego sem acrescentar explicitamente 'dons'; no contexto, refere-se especialmente às manifestações concedidas pelo Espírito na comunidade.
- source_word: μᾶλλον δὲ
  choice: sobretudo
  rationale: Comunica a preferência e a ênfase comparativa de Paulo com fluidez em português; a alternativa mais contrastiva é registrada em nota.
- source_word: ἵνα προφητεύητε
  choice: profetizar
  rationale: O infinitivo é uma formulação portuguesa natural para o conteúdo do desejo, sem alterar o sentido da construção grega com ἵνα e subjuntivo.
theological_decisions:
- issue: Alcance de τὰ πνευματικά
  choice: as realidades espirituais
  alternative: os dons espirituais; as coisas espirituais
  rationale: A expressão grega é mais ampla que 'dons', embora o contexto de 1 Coríntios 12–14 trate de manifestações do Espírito na igreja. A tradução conserva essa amplitude sem obscurecer o referente contextual.
- issue: Força da preferência por profetizar
  choice: sobretudo profetizar
  alternative: mas, antes, que vocês profetizem
  rationale: A formulação preserva a prioridade comparativa dada à profecia sem sugerir que ela seja a única manifestação válida; a leitura mais adversativa permanece disponível em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural implícito dos imperativos foi explicitado pelas formas verbais, evitando regionalismos pronominais. A redação preserva a amplitude lexical e a tensão comparativa do grego.
