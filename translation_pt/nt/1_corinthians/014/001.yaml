    rationale: O verbo ζηλοῦτε comunica desejo intenso/entusiasmo; em português, «desejar com zelo» não é uma colocação corrente e pode sugerir uma reprodução mecânica da raiz grega. «Desejem ardentemente» transmite a força exortativa com português moderno.
  - severity: low
    issue: «Realidades espirituais» é mais abstrato do que o grego e menos direto em português.
    rationale: 'Τὰ πνευματικά é uma expressão neutra e ampla: «coisas espirituais» conserva essa abertura de modo claro. A nota pode registrar «dons espirituais» como explicitação contextual possível.'
