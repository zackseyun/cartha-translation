  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: pt
  text: Portanto, se eu não souber o sentido da voz[a], serei um estrangeiro para quem fala[b], e quem fala será estrangeiro para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a força da voz”; isto é, a significação ou o sentido transmitido pelo som.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “bárbaro”; aqui, alguém estrangeiro quanto à fala ou cuja fala é ininteligível, não necessariamente uma pessoa incivilizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva tanto a inferência expressa por οὖν quanto a condição introduzida por ἐάν, com fluidez em português.
- source_word: μὴ εἰδῶ
  choice: eu não souber
  rationale: Mantém o sentido básico de οἶδα, “saber/conhecer”, sem substituir explicitamente por “entender”.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: o sentido da voz
  rationale: Neste contexto, δύναμις indica a força significativa ou o conteúdo inteligível comunicado pela φωνή. “Sentido” transmite essa ideia em português natural, enquanto “voz” preserva a amplitude lexical de φωνή.
- source_word: ἔσομαι τῷ λαλοῦντι
  choice: serei estrangeiro para quem fala
  rationale: Reproduz o futuro e a relação expressa pelo dativo, mantendo a forma participial de maneira natural.
- source_word: βάρβαρος
  choice: estrangeiro
  rationale: Aqui o termo descreve alguém cuja fala é estrangeira ou ininteligível para o outro; “bárbaro” poderia sugerir indevidamente falta de civilização.
- source_word: ὁ λαλῶν ἐν ἐμοὶ
  choice: quem fala será estrangeiro para mim
  rationale: Traduz a reciprocidade da construção; ἐν ἐμοί tem valor relacional e é expresso naturalmente por “para mim”.
