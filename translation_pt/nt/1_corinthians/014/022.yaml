id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: pt
  text: Portanto, as línguas[a] são um sinal não para os que creem, mas para os descrentes[b]; a profecia, porém, não é para os descrentes, mas para os que creem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “idiomas”. O termo grego pode designar idiomas, mas, em 1 Coríntios 12–14, “línguas” preserva a terminologia estabelecida por Paulo sem decidir uma interpretação debatida.
    reason: lexical_alternative
  - marker: b
    text: À luz da citação precedente de Isaías 28:11–12, alguns intérpretes entendem “um sinal” como um sinal de juízo.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Expressa a conclusão inferencial decorrente do argumento anterior, em português natural e digno.
- source_word: γλῶσσαι
  choice: as línguas
  rationale: Preserva a terminologia paulina tradicional no contexto de 1 Coríntios 12–14 sem decidir se se trata especificamente de idiomas humanos ou de outra forma de fala.
- source_word: εἰς σημεῖόν
  choice: são um sinal
  rationale: Transmite de modo compacto a função ou o resultado indicado por εἰς, sem definir se o sinal é confirmatório ou judicial.
- source_word: τοῖς πιστεύουσιν
  choice: para os que creem
  rationale: Mantém perceptível a força verbal do particípio substantivado e produz uma expressão portuguesa corrente.
- source_word: τοῖς ἀπίστοις
  choice: para os descrentes
  rationale: Traduz de forma concisa o contraste comunitário e religioso com os que creem.
- source_word: προφητεία
  choice: a profecia
  rationale: É a equivalência direta e consagrada para o dom ou a atividade profética discutida no capítulo.
- source_word: δὲ
  choice: porém
  rationale: Marca claramente o contraste entre a função das línguas e a da profecia.
theological_decisions:
- issue: Sentido de γλῶσσαι no contexto carismático
  choice: línguas
  alternative: idiomas; fala extática
  rationale: A natureza exata do fenômeno é debatida. A formulação preserva a terminologia e a ambiguidade do texto sem impor uma interpretação denominacional.
- issue: Força de σημεῖον em relação aos descrentes
  choice: um sinal
  alternative: um sinal confirmatório; um sinal de juízo
  rationale: O grego não qualifica explicitamente o sinal. A possível relação com juízo, à luz da citação precedente de Isaías 28, é indicada em nota, sem resolver a tensão no texto principal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção paralela mantém o contraste retórico do grego; “descrentes” é corrente e conciso, enquanto “os que creem” conserva a dimensão verbal de πιστεύουσιν.
