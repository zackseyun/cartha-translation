  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: pt
  text: Portanto, meus irmãos[a], empenhem-se em profetizar e não proíbam o falar em línguas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se inclusivamente a toda a congregação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Conjunção inferencial que apresenta a conclusão prática da discussão anterior; “portanto” conserva com clareza essa força conclusiva.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Preserva o vocativo masculino plural e o possessivo do grego, com nota esclarecendo que, no contexto, a expressão pode abranger toda a congregação.
- source_word: ζηλοῦτε
  choice: procurem com empenho
  rationale: O imperativo presente exprime busca zelosa e contínua; a formulação é natural em português e evita a possível ambiguidade de “tenham zelo”.
- source_word: τὸ προφητεύειν
  choice: profetizar
  rationale: O infinitivo substantivado funciona como objeto da exortação; o infinitivo português comunica isso de modo direto e natural.
- source_word: μὴ κωλύετε
  choice: não proíbam
  rationale: O imperativo presente com μή formula uma proibição direta; “não proíbam” corresponde bem à instrução no contexto da reunião comunitária.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: o falar em línguas
  rationale: Mantém a construção nominal do infinitivo articulado e emprega a expressão corrente em português para a prática discutida no capítulo.
theological_decisions:
- issue: Sentido do vocativo ἀδελφοί numa congregação composta por homens e mulheres
  choice: meus irmãos
  alternative: meus irmãos e irmãs
  rationale: O texto grego emprega o masculino plural, provavelmente de modo representativo para toda a congregação. O texto principal preserva a forma lexical, enquanto a nota registra sua possível abrangência inclusiva sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação preserva o paralelismo entre a exortação positiva e a proibição, sem acrescentar qualificações teológicas ausentes do versículo.
