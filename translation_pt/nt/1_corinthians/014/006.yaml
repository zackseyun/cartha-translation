id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: pt
  text: Agora, irmãos[a], se eu for até vocês falando em línguas[b], que benefício lhes trarei, a menos que lhes fale por meio de revelação, de conhecimento, de profecia ou de ensino?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; em grego, “irmãos” pode dirigir-se a uma congregação composta de homens e mulheres.
    reason: lexical_alternative
  - marker: b
    text: Ou “falando em idiomas”; o termo grego pode significar “idiomas”, mas aqui se refere ao fenômeno discutido ao longo de 1 Coríntios 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Agora
  rationale: Marca a transição para a aplicação imediata do argumento de Paulo sem acentuar indevidamente uma oposição.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do grego e o modo tradicional e natural de dirigir-se à congregação; uma nota esclarece seu possível alcance inclusivo.
- source_word: γλώσσαις λαλῶν
  choice: falando em línguas
  rationale: É a expressão portuguesa corrente para o fenômeno carismático discutido em 1 Coríntios 12–14, sem definir sua natureza; a alternativa lexical é registrada em nota.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: em que vou beneficiá-los
  rationale: Expressa de modo natural em português a pergunta sobre que proveito ou ajuda Paulo proporcionaria aos destinatários.
- source_word: ἐὰν μὴ
  choice: a menos que
  rationale: Reproduz com naturalidade a condição negativa introduzida pelo grego.
- source_word: ὑμῖν λαλήσω
  choice: lhes fale
  rationale: Mantém a referência explícita aos destinatários e a continuidade semântica com o ato de falar mencionado antes.
- source_word: ἐν ἀποκαλύψει ... ἐν γνώσει ... ἐν προφητείᾳ ... ἐν διδαχῇ
  choice: por meio de revelação, de conhecimento, de profecia ou de ensino
  rationale: Interpreta ἐν em sentido modal ou instrumental e preserva o paralelismo da enumeração em português fluente.
theological_decisions:
- issue: Alcance de ἀδελφοί no tratamento congregacional
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma gramatical masculina do original, enquanto a nota reconhece que o vocativo pode abranger toda a congregação, sem excluir as mulheres.
- issue: Sentido de γλώσσαις neste contexto
  choice: línguas
  alternative: idiomas
  rationale: “Línguas” preserva a designação convencional do fenômeno de 1 Coríntios 12–14 sem decidir se se trata necessariamente de idiomas humanos reconhecíveis ou de outra forma de fala espiritual.
- issue: Relação das quatro expressões introduzidas por ἐν com o verbo falar
  choice: 'sentido modal ou instrumental: “por meio de”'
  alternative: 'sentido mais formal: “em revelação, em conhecimento, em profecia ou em ensino”'
  rationale: O contexto pergunta como a fala pode beneficiar a congregação; “por meio de” comunica essa função com clareza, sem transformar as quatro categorias em definições técnicas rígidas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Se eu for até vocês” evita a ambiguidade que “vier a vocês” pode causar em português, e “em que vou beneficiá-los” mantém o foco de Paulo na edificação prática da congregação.
