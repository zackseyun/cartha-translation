lexical_decisions:
- source_word: εἰ
  choice: se
  rationale: Partícula condicional comum; introduz a condição sem afirmar que ela seja verdadeira.
- source_word: δέ
  choice: mas
  rationale: Expressa a contraposição com a afirmação anterior sobre reconhecer que as palavras de Paulo são mandamento do Senhor.
- source_word: τις
  choice: alguém
  rationale: Indefinido singular de sentido genérico, expresso naturalmente em português.
- source_word: ἀγνοεῖ
  choice: não reconhece
  rationale: No contexto do v. 37, o verbo indica não reconhecer ou não admitir a instrução apostólica; a formulação também permite a nuance de recusa deliberada sem impô-la.
- source_word: ἀγνοεῖται
  choice: não é reconhecido
  rationale: Mantém a voz passiva e reproduz, com o mesmo verbo português, o paralelismo retórico entre as formas ativa e passiva do grego.
theological_decisions:
- issue: Sentido da forma passiva ἀγνοεῖται
  choice: não é reconhecido
  alternative: é ignorado; não é conhecido; segundo uma variante textual, continue na ignorância
  rationale: O texto adotado traz um indicativo passivo, não um imperativo. A tradução preserva a reciprocidade ou consequência judicial sugerida pelo contexto, sem especificar se o agente é Deus, a comunidade ou ambos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não reconhece... não é reconhecido” conserva a repetição intencional do grego e sua ambiguidade quanto ao agente da passiva.
