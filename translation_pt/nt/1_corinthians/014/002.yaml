  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: pt
  text: Pois quem fala em uma língua não fala às pessoas, mas a Deus, pois ninguém entende[a]; porém, em espírito, fala mistérios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém ouve”. O verbo grego pode significar “ouvir” ou, neste contexto, “entender”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelo Espírito fala mistérios”. A expressão grega pode se referir ao Espírito Santo ou ao espírito de quem fala.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: quem fala
  rationale: O artigo com o particípio presente tem valor substantivado e genérico; “quem fala” é natural em português e não especifica gênero.
- source_word: γλώσσῃ
  choice: em uma língua
  rationale: Preserva o singular do dativo e evita definir se se trata de um idioma humano, uma fala extática ou outra forma de manifestação.
- source_word: ἀνθρώποις
  choice: às pessoas
  rationale: O plural é genérico e não especificamente masculino; “às pessoas” comunica isso com naturalidade.
- source_word: θεῷ
  choice: a Deus
  rationale: Reproduz diretamente o objeto dativo de λαλεῖ.
- source_word: ἀκούει
  choice: entende
  rationale: Embora o sentido básico seja “ouve”, o contexto da fala não compreendida favorece o sentido contextual “entende”; a tradução literal permanece na nota.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: O dativo pode indicar esfera ou meio. Esta formulação apresenta como leitura principal a atuação do Espírito Santo, sem ocultar na nota a possibilidade de referência ao espírito do falante.
- source_word: μυστήρια
  choice: mistérios
  rationale: Mantém a ressonância teológica do termo paulino sem substituí-lo por uma paráfrase interpretativa.
- source_word: δὲ
  choice: porém
  rationale: Marca de modo natural o contraste com a afirmação anterior.
theological_decisions:
- issue: Referente de πνεύματι
  choice: pelo Espírito
  alternative: em espírito; por seu espírito
  rationale: O grego não determina inequivocamente se πνεύματι se refere ao Espírito Santo ou ao espírito do falante. A leitura principal é apresentada no texto, e a ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da última oração foi ajustada para soar natural e manter o contraste expresso por δέ. Todos os marcadores de nota aparecem no texto principal.
