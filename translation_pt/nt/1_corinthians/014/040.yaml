base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: pt
  text: Mas tudo seja feito de maneira apropriada[a] e com ordem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de maneira digna”; o termo grego indica aquilo que é adequado ou condizente.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente; “tudo” é natural em português e preserva o alcance geral da instrução.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste, ligando esta orientação conclusiva aos problemas tratados anteriormente.
- source_word: εὐσχημόνως
  choice: de maneira apropriada
  rationale: Expressa aquilo que é adequado, digno e condizente com a reunião da comunidade; a formulação é clara e atual, sem restringir o termo à mera aparência social.
- source_word: κατὰ τάξιν
  choice: com ordem
  rationale: Indica conformidade com uma disposição ou sequência ordenada. “Com ordem” é idiomático e preserva a ideia de organização apropriada.
- source_word: γινέσθω
  choice: seja feito
  rationale: O imperativo presente na terceira pessoa funciona como orientação geral; combinado com “tudo”, “tudo seja feito” transmite naturalmente sua força normativa.
theological_decisions:
- issue: Alcance da ordem de Paulo no contexto da reunião da comunidade
  choice: Uma orientação geral para que tudo na reunião seja conduzido de modo apropriado e ordeiro, sem prescrever um modelo litúrgico denominacional específico.
  alternative: Entender a frase como prescrição de uma ordem de culto formal e fixa, ou como regra irrestrita para toda prática da igreja além do contexto imediato.
  rationale: O versículo resume a discussão imediata sobre as manifestações de fala e a ordem na reunião. A tradução mantém a generalidade do grego sem acrescentar uma estrutura eclesiástica ou litúrgica não especificada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De maneira apropriada” evita o possível sentido estreito de “decentemente” no uso atual, enquanto “com ordem” conserva a concisão e a força da orientação.
