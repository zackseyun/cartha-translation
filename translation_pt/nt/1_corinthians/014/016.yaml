source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: pt
  text: Caso contrário, se você pronunciar uma bênção em espírito[b], como aquele que ocupa o lugar de uma pessoa sem instrução[a] dirá Amém à sua ação de graças[c], visto que não sabe o que você está dizendo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de quem é leigo”, “de uma pessoa comum” ou “de quem não tem conhecimento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com o espírito”; o grego não exige aqui uma interpretação mais específica.
    reason: alternative_reading
  - marker: c
    text: “Ação de graças” aqui se refere ao ato de dar graças, não necessariamente ao uso técnico posterior do termo “Eucaristia”.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Caso contrário, se
  rationale: Introduz uma situação condicional com força inferencial ou corretiva em relação ao argumento anterior.
- source_word: εὐλογῇς
  choice: pronunciar uma bênção
  rationale: Expressa o ato verbal de abençoar no culto e soa mais claro em português do que o possível, porém ambíguo, 'abençoar' sem complemento.
- source_word: πνεύματι
  choice: em espírito
  rationale: Preserva a possibilidade de valor instrumental ou de esfera e não determina se a referência é ao espírito humano ou à fala capacitada pelo Espírito.
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: aquele que ocupa o lugar
  rationale: Reproduz naturalmente a imagem de alguém que ocupa determinada posição na reunião.
- source_word: τοῦ ἰδιώτου
  choice: de quem não tem instrução
  rationale: No contexto, designa alguém sem o conhecimento necessário para compreender a fala; a formulação evita a conotação moderna pejorativa de 'ignorante'.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: como ... dirá o amém
  rationale: Mantém o artigo grego e a prática congregacional de responder com assentimento.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: ao seu agradecimento
  rationale: Indica a resposta de amém à expressão de graças sem introduzir o sentido sacramental técnico posterior.
- source_word: ἐπειδὴ
  choice: visto que
  rationale: Introduz com clareza a razão pela qual a pessoa não pode responder de modo consciente.
- source_word: τί λέγεις οὐκ οἶδεν
  choice: não sabe o que você está dizendo
  rationale: Segue de perto o grego e preserva a ligação entre desconhecimento e falta de inteligibilidade.
theological_decisions:
- issue: Sentido de πνεύματι no contexto do culto carismático
  choice: em espírito
  alternative: com o espírito; pelo Espírito
  rationale: O grego não exige identificar de modo definitivo o espírito humano ou o Espírito Santo, nem escolher exclusivamente entre esfera e instrumento.
- issue: Sentido de εὐχαριστίᾳ
  choice: agradecimento
  alternative: ação de graças; Eucaristia
  rationale: O contexto trata de graças expressas verbalmente e compreendidas pela assembleia; o termo técnico sacramental posterior não é exigido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A ordem dos marcadores foi ajustada para que cada nota acompanhe imediatamente a expressão pertinente.
