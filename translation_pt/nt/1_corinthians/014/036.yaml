base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: pt
  text: Ou será que a palavra de Deus saiu de vocês[a]? Ou será que chegou somente a vocês[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teve origem entre vocês?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alcançou apenas vocês?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou será que
  rationale: Mantém a disjunção interrogativa de ἤ e expressa com naturalidade, em português, a força retórica da repreensão.
- source_word: ἀφ’ ὑμῶν
  choice: de vocês
  rationale: ἀπό com o genitivo indica fonte ou origem; a formulação direta preserva essa ideia sem explicá-la em excesso.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva a expressão paulina ampla e solene, sem restringi-la ao evangelho ou a uma profecia específica.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Reproduz a imagem verbal de ἐξέρχομαι e deixa implícita a possível noção de origem, esclarecida em nota.
- source_word: εἰς ὑμᾶς μόνους
  choice: somente a vocês
  rationale: Mantém a ênfase de μόνους na exclusividade dos destinatários.
- source_word: κατήντησεν
  choice: chegou
  rationale: Traduz naturalmente o sentido de chegar ou alcançar um destino, sem acrescentar uma nuance ausente do grego.
theological_decisions:
- issue: Referente de “a palavra de Deus”
  choice: Manter a expressão ampla “a palavra de Deus”
  alternative: Especificar “a mensagem do evangelho” ou “a palavra profética na reunião”
  rationale: O contexto permite uma referência ampla à mensagem divina e à instrução apostólica; a tradução não resolve indevidamente essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Ou será que” torna nítidas as duas perguntas retóricas e preserva o tom incisivo de Paulo.
