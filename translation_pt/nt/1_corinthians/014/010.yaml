  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: pt
  text: Há, talvez, tantos tipos de línguas no mundo[a], e nenhuma delas é desprovida de significado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Há, talvez, tantos tipos de sons no mundo, e nenhum é sem som».'
