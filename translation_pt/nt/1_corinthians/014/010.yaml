lexical_decisions:
- source_word: τοσαῦτα
  choice: tantos
  rationale: Preserva a ideia de grande número expressa pelo quantificador, com formulação natural em português.
- source_word: εἰ τύχοι
  choice: talvez
  rationale: Traduz o valor adverbial e atenuador da expressão grega sem tornar a afirmação excessivamente categórica.
- source_word: γένη
  choice: tipos
  rationale: Expressa de modo corrente as variedades ou categorias em vista.
- source_word: φωνῶν
  choice: de línguas
  rationale: No contexto de fala inteligível e interpretação, «línguas» comunica melhor o referente provável; a amplitude lexical de φωνή é preservada na nota.
- source_word: ἐν κόσμῳ
  choice: no mundo
  rationale: Equivalente direto e natural para a referência geral ao mundo.
- source_word: οὐδὲν ἄφωνον
  choice: nenhuma delas é sem significado
  rationale: No encadeamento do argumento, indica que nenhuma língua carece de conteúdo comunicativo; a imagem mais literal de ausência de som/voz é registrada na nota.
