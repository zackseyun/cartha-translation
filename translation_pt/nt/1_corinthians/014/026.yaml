  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: pt
  text: Que fazer, então, irmãos[a]? Quando vocês se reúnem, cada um tem um salmo, tem um ensino, tem uma revelação, tem uma língua[b], tem uma interpretação. Que tudo seja feito para edificação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” é aqui uma forma representativa de se dirigir a toda a congregação, incluindo mulheres e homens.
    reason: lexical_alternative
  - marker: b
    text: Ou “um idioma”. O termo grego pode designar uma língua ou idioma; neste contexto, faz parte da discussão de Paulo sobre falar em línguas, sem definir com maior precisão a natureza desse fenômeno.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Então, o que fazer
  rationale: Expressa de modo natural em português a pergunta retórica idiomática que introduz a conclusão prática de Paulo, sem transformar a frase em mera pergunta de definição.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva o substantivo masculino plural do grego como forma representativa de tratamento à congregação mista; a abrangência é esclarecida em nota.
- source_word: ὅταν συνέρχησθε
  choice: Quando vocês se reúnem
  rationale: Formulação corrente e clara que mantém o sentido temporal de uma situação recorrente na reunião da igreja.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a força distributiva do grego e introduz naturalmente a lista de contribuições.
- source_word: ψαλμὸν
  choice: um salmo
  rationale: Conserva o termo específico do grego, sem ampliá-lo para 'cântico' ou restringi-lo a outra categoria musical.
- source_word: διδαχὴν
  choice: um ensino
  rationale: É claro no contexto de uma contribuição congregacional e evita o tom excessivamente sistemático que 'doutrina' poderia adquirir.
- source_word: ἀποκάλυψιν
  choice: uma revelação
  rationale: Equivalente tradicional e transparente para uma comunicação revelatória apresentada na reunião.
- source_word: γλῶσσαν
  choice: uma língua
  rationale: Mantém a ambiguidade lexical entre língua e fala em línguas no contexto de 1 Coríntios 12–14; a nota indica a alternativa terminológica.
- source_word: ἑρμηνείαν
  choice: uma interpretação
  rationale: Corresponde ao ato de tornar compreensível à congregação o conteúdo expresso em uma língua.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Que tudo seja feito para a edificação da comunidade
  rationale: Reproduz a força imperativa e a metáfora construtiva de οἰκοδομή; 'da comunidade' explicita o referente coletivo exigido pelo contexto, evitando que 'edificação' pareça apenas individual.
theological_decisions:
- issue: Tratamento masculino representativo dirigido à congregação
  choice: Manter 'irmãos' no texto principal e esclarecer em nota que o tratamento inclui mulheres e homens.
  alternative: '''irmãos e irmãs'' no texto principal'
  rationale: Preserva a forma gramatical e retórica do original sem excluir a composição mista da congregação coríntia.
- issue: Sentido de γλῶσσα neste capítulo
  choice: Usar 'língua' no texto principal, com nota para a expressão tradicional 'falar em línguas'.
  alternative: '''manifestação em línguas'' ou ''fala em língua'''
  rationale: O substantivo grego pode designar língua ou idioma e, neste contexto, o fenômeno carismático discutido por Paulo. A tradução evita decidir se se trata necessariamente de idioma humano conhecido ou de outra modalidade de fala.
- issue: Relação entre γλῶσσαν e ἑρμηνείαν na enumeração
  choice: Traduzir a coordenação como 'uma língua ou uma interpretação'.
  alternative: '''uma língua, uma interpretação'''
  rationale: A tradição manuscrita refletida no SBLGNT assinala variação na ordem e coordenação destes itens. A formulação adotada segue a leitura impressa com ἢ e mantém as contribuições como possibilidades distribuídas, sem afirmar que cada pessoa possui todas elas.
translation_notes:
  register: Português moderno, digno e acessível, com uso de 'vocês' para ampla legibilidade brasileira. A formulação conserva a cadência enumerativa do grego, evita jargão onde possível e explicita apenas o referente comunitário de 'edificação', já indicado pelo contexto da reunião congregacional.
