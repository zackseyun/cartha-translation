  terminology: “Língua” preserva a terminologia paulina tradicional e mantém a abertura do grego γλῶσσα. “Interprete” é o verbo contextual apropriado para διερμηνευέτω e não impõe a noção mais restrita de tradução entre idiomas conhecidos. A nota lexical oferece “idioma” como alternativa e evita tomar posição no debate sobre a natureza do dom.
