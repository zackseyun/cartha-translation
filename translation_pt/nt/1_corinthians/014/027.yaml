id: 1CO.14.27
reference: 1 Corinthians 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: pt
  text: Se alguém falar em língua[a], falem dois ou, no máximo, três, cada um por sua vez, e um interprete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em um idioma”. A palavra grega pode significar língua ou idioma; aqui, “língua” mantém a terminologia de Paulo neste capítulo sem decidir a natureza desse dom.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: em língua
  rationale: A construção com λαλεῖ designa o falar em língua ou idioma. Em 1 Coríntios 12–14, “língua” preserva o termo já estabelecido para o fenômeno carismático sem definir se se trata de idioma humano ou de outra forma de fala.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido tem sentido genérico e condicional; “alguém” é natural em português.
- source_word: λαλεῖ
  choice: falar
  rationale: No período condicional geral introduzido por εἴτε, o infinitivo pessoal em “se alguém falar” expressa naturalmente o valor do presente grego.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: falem dois ou, no máximo, três
  rationale: A expressão limita o número de participantes. A repetição implícita do verbo como “falem” torna a instrução clara e idiomática em português.
- source_word: ἀνὰ μέρος
  choice: cada um por sua vez
  rationale: A locução indica participação separada e sucessiva, não simultânea; esta formulação conserva sua força distributiva.
- source_word: εἷς
  choice: um
  rationale: O numeral substantivado indica que uma pessoa deve exercer a interpretação.
- source_word: διερμηνευέτω
  choice: interprete
  rationale: O imperativo pede que a fala seja tornada inteligível para a comunidade. “Interpretar” é o termo contextual e tradicional, sem restringir a ação à tradução entre idiomas conhecidos.
theological_decisions:
- issue: Sentido de γλώσσῃ no contexto dos dons espirituais
  choice: “língua” no texto principal, referindo-se ao fenômeno tratado em 1 Coríntios 12–14 sem especificar sua natureza
  alternative: “idioma”; ou identificação explícita como fala extática ou como idioma humano estrangeiro
  rationale: O contexto imediato trata do dom de línguas, mas o versículo não decide o debate sobre a natureza dessa fala. “Língua” mantém a abertura lexical e teológica do texto.
- issue: Referente dos dois ou três participantes
  choice: Explicitar “falem” para indicar dois ou três falantes
  alternative: 'Tradução mais literal e elíptica: “seja por dois ou, no máximo, três”'
  rationale: O grego emprega uma expressão elíptica de regulamentação. Em português, “falem dois...” comunica com clareza que o limite se aplica aos que falam, sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem é direta, e “cada um por sua vez” explicita a sucessão exigida pelo grego sem ampliar o conteúdo.
