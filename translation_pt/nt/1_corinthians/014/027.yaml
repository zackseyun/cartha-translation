  source_fidelity: O texto traduz adequadamente a construção condicional εἴτε γλώσσῃ τις λαλεῖ por “Se alguém falar em língua” e preserva o caráter regulador dos imperativos subsequentes. “Falem dois ou, no máximo, três” comunica corretamente o limite de participantes expresso por κατὰ δύο ἢ τὸ πλεῖστον τρεῖς. “Cada um por sua vez” reproduz bem ἀνὰ μέρος, e “um interprete” corresponde ao imperativo singular διερμηνευέτω sem especificar indevidamente a natureza da interpretação.
