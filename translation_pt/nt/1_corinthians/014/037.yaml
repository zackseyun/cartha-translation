id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: pt
  text: Se alguém pensa ser profeta ou espiritual, reconheça que o que escrevo a vocês é mandamento do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é do Senhor” ou “pertence ao Senhor”. O grego diz literalmente “é do Senhor”; a palavra “mandamento” foi acrescentada no texto para explicitar o sentido indicado pelo contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: pensa
  rationale: Neste contexto, expressa a avaliação ou reivindicação que alguém faz a respeito de si mesmo. “Pensa” é natural e conserva o possível tom corretivo de Paulo.
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente corrente e preciso no contexto dos dons espirituais e da fala profética.
- source_word: πνευματικός
  choice: espiritual
  rationale: Preserva a forma compacta e a amplitude do adjetivo grego, que pode designar quem se considera espiritual ou dotado pelo Espírito, sem limitar indevidamente o sentido.
- source_word: ἐπιγινωσκέτω
  choice: reconheça
  rationale: O imperativo pede que a pessoa reconheça ou admita a autoridade da instrução apostólica; “reconheça” transmite isso com clareza.
- source_word: ἃ γράφω ὑμῖν
  choice: o que escrevo a vocês
  rationale: Formulação natural em português moderno que representa adequadamente o relativo e o presente epistolar.
- source_word: κυρίου ἐστίν
  choice: é mandamento do Senhor
  rationale: A construção grega é elíptica, literalmente “é do Senhor”. No contexto, a ideia é que o escrito tem autoridade normativa procedente do Senhor; “mandamento” explicita essa força, com nota que preserva a forma aberta do original.
theological_decisions:
- issue: Força elíptica de κυρίου ἐστίν
  choice: “é mandamento do Senhor” no texto principal
  alternative: “é do Senhor” ou “pertence ao Senhor”
  rationale: O contexto favorece uma afirmação da autoridade vinculante da instrução, mas o grego não contém explicitamente o substantivo “mandamento”. A tradução comunica a força contextual, enquanto a nota registra a formulação literal e sua ambiguidade.
- issue: Gênero em τις ... προφήτης ... πνευματικός
  choice: Manter as formas masculinas “profeta” e “espiritual” com referência genérica introduzida por “alguém”
  alternative: Reformular com linguagem explicitamente inclusiva ou repetir formas masculinas e femininas
  rationale: As formas gregas são masculinas singulares e genericamente aplicáveis a qualquer indivíduo. A redação portuguesa preserva essa estrutura sem acrescentar uma delimitação de sexo ausente da intenção contextual.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade no Brasil e compreensão internacional. “A vocês” evita regionalismos mais marcados; “reconheça” mantém o tom exortativo, e a nota conserva a concisão e a ambiguidade genuína da expressão grega.
