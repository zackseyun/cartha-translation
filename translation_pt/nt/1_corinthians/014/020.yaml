id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: pt
  text: Irmãos[a], não se tornem crianças no modo de pensar; quanto ao mal[b], sejam bebês, mas, no modo de pensar, tornem-se maduros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Irmãos e irmãs”; o grego emprega o plural masculino “irmãos” como forma de tratamento à congregação.
    reason: lexical_alternative
  - marker: b
    text: Ou “quanto à malícia”; o termo grego κακία pode significar mal, maldade ou malícia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Irmãos
  rationale: Mantém a forma masculina plural do vocativo grego e seu uso como forma de tratamento à congregação; a abrangência contextual é indicada em nota.
- source_word: παιδία
  choice: crianças
  rationale: Designa crianças de modo geral e preserva o contraste com νηπιάζετε e τέλειοι sem especificar demais a idade.
- source_word: γίνεσθε
  choice: não se tornem / tornem-se
  rationale: Preserva a ideia de tornar-se expressa por γίνομαι e a repetição retórica nas duas ocorrências.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: no modo de pensar
  rationale: Expressa naturalmente em português a faculdade de compreensão e pensamento, entendendo o dativo como referência ou aspecto.
- source_word: τῇ κακίᾳ
  choice: quanto ao mal
  rationale: Mantém o sentido ético amplo de κακία e torna clara a relação de aspecto indicada pelo dativo, sem restringi-la à malícia interpessoal.
- source_word: νηπιάζετε
  choice: sejam bebês
  rationale: Comunica a exortação a ser ou agir como infantes e preserva o contraste deliberado entre crianças, bebês e maduros.
- source_word: τέλειοι
  choice: maduros
  rationale: No contexto, indica maturidade ou pleno desenvolvimento, não perfeição sem pecado.
- source_word: ἀλλὰ ... δὲ
  choice: porém ... mas
  rationale: Representa as mudanças contrastivas do grego em ordem natural para o português, destacando primeiro a exceção relativa ao mal e depois o retorno ao modo de pensar.
theological_decisions:
- issue: Forma masculina de tratamento à congregação
  choice: Manter “Irmãos” no texto principal, com nota sobre sua possível abrangência inclusiva.
  alternative: “Irmãos e irmãs”
  rationale: O grego traz o masculino plural ἀδελφοί, provavelmente dirigido à congregação inteira. A tradução conserva a forma lexical visível, enquanto a nota esclarece seu alcance contextual.
- issue: Sentido de τέλειοι
  choice: “maduros”
  alternative: “perfeitos”
  rationale: A oposição a crianças no modo de pensar aponta para maturidade de entendimento, não para uma afirmação de perfeição moral absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No modo de pensar” evita a formulação menos natural “nas faculdades mentais”; “bebês” preserva de modo corrente a distinção lexical do grego. A pontuação em duas frases favorece a clareza sem alterar a estrutura argumentativa.
