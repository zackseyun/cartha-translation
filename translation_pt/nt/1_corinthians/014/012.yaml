revisions:
- from: Assim também vocês, já que têm grande desejo pelos dons espirituais[a], procurem se destacar na edificação da igreja.
  to: Assim também vocês, já que são zelosos pelos dons espirituais[a], procurem se sobressair visando à edificação da igreja.
