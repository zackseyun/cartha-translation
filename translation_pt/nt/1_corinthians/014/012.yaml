  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: pt
  text: Assim também vocês, já que são zelosos pelos dons espirituais[a], procurem se sobressair visando à edificação da igreja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, “de espíritos”; também pode ser entendido, conforme o contexto, como “realidades espirituais”. Aqui a expressão provavelmente se refere a dons ou manifestações do Espírito.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: Retoma a comparação anterior e conserva a força inferencial da expressão grega em português natural.
- source_word: ἐπεὶ
  choice: já que
  rationale: Introduz a razão da exortação, com valor causal claro e corrente.
- source_word: ζηλωταί ἐστε
  choice: têm grande desejo
  rationale: Expressa o zelo ou forte interesse indicado pelo substantivo ζηλωταί sem recorrer a uma formulação rígida.
- source_word: πνευμάτων
  choice: dons espirituais
  rationale: No contexto de 1 Coríntios 12–14, refere-se mais provavelmente aos dons ou manifestações espirituais. A formulação mais literal e ambígua é preservada em nota.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: na edificação da igreja
  rationale: Conserva a metáfora paulina de construir e fortalecer a comunidade, usando linguagem portuguesa acessível.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: procurem se destacar
  rationale: Transmite a exortação a buscar abundância ou excelência com vistas à edificação da igreja, sem acrescentar como objeto explícito os dons, objeto que o grego deixa implícito.
theological_decisions:
- issue: Sentido de πνευμάτων
  choice: dons espirituais
  alternative: espíritos; realidades espirituais
  rationale: O contexto trata dos dons e das manifestações ligados ao Espírito, sobretudo profecia e línguas. A tradução principal evita sugerir que os cristãos desejavam vários espíritos, mas a nota conserva a forma condensada e a ambiguidade lexical do grego.
- issue: Objeto ou esfera de περισσεύητε
  choice: se destacar na edificação da igreja
  alternative: ter os dons em abundância para a edificação da igreja
  rationale: O grego não declara expressamente que os dons sejam o objeto de περισσεύητε. A redação escolhida mantém o alvo comunitário da exortação sem inserir esse objeto de modo categórico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Edificação” preserva uma metáfora paulina reconhecível; “procurem se destacar” torna idiomática a ideia de abundar ou exceder sem resolver indevidamente o objeto implícito.
