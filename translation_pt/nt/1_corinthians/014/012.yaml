review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente πνευμάτων, no contexto, como “dons espirituais”, com nota que preserva a ambiguidade lexical. Contudo, “se destacar na edificação da igreja” desloca πρὸς de finalidade/alvo (“com vistas à edificação”) para esfera de atuação (“na edificação”) e pode sugerir excelência pessoal no ato de edificar. A revisão conserva o alvo comunitário expresso pelo grego.
  naturalness: O texto é claro e atual, mas “procurar se destacar na edificação” é menos preciso do que uma formulação que expresse diretamente a finalidade. “Procurem se sobressair visando à edificação da igreja” é natural em português internacional e mantém o tom exortativo.
  terminology: “Dons espirituais”, “edificação” e “igreja” são escolhas adequadas e consistentes com o contexto paulino. A nota deve dizer “de espíritos”, pois πνευμάτων está no genitivo plural na construção grega; “realidades espirituais” deve ser apresentado como possibilidade contextual, não como sentido literal.
  issues:
  - severity: medium
    issue: “na edificação da igreja” enfraquece a relação final de πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας.
    rationale: πρός aqui orienta a busca de abundar/sobressair para o benefício da edificação da comunidade. “Na edificação” pode ser entendido como o campo em que se deve destacar, em vez de indicar o propósito comunitário.
  - severity: low
    issue: A nota chama πνευμάτων de “literalmente, ‘espíritos’”.
    rationale: Como o termo ocorre na construção ζηλωταὶ πνευμάτων, a indicação formal mais exata é “de espíritos”. A nota pode ainda registrar “realidades espirituais” como leitura interpretativa contextual.
