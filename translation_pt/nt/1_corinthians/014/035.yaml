reference: 1 Corinthians 14:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: pt
  text: Mas, se quiserem aprender alguma coisa, perguntem em casa aos próprios maridos, pois é vergonhoso para uma mulher[a] falar na assembleia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma esposa”. A palavra grega pode significar “mulher” ou “esposa”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “na igreja” ou “na congregação”; o termo grego se refere à comunidade reunida.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: aprender
  rationale: Traduz diretamente o infinitivo de μανθάνω, preservando a ideia de adquirir conhecimento sem restringi-la a um tipo específico de instrução.
- source_word: ἐν οἴκῳ
  choice: em casa
  rationale: É a forma idiomática e natural em português, mantendo o contraste entre o ambiente doméstico e a reunião da comunidade.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: aos próprios maridos
  rationale: Embora ἀνήρ possa significar “homem” ou “marido”, o possessivo ἰδίους e o contexto doméstico favorecem claramente o sentido conjugal.
- source_word: ἐπερωτάτωσαν
  choice: perguntem
  rationale: Preserva de modo claro e natural a força do imperativo presente, sem acrescentar a ideia de interrogatório ou contestação.
- source_word: αἰσχρὸν
  choice: vergonhoso
  rationale: Mantém a forte avaliação moral e social do termo grego; “impróprio” seria mais brando.
- source_word: γυναικὶ
  choice: uma mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. A formulação genérica “uma mulher” é adequada no texto principal, enquanto a possibilidade contextual de “esposa” é preservada em nota.
- source_word: λαλεῖν
  choice: falar
  rationale: É o equivalente amplo e direto de λαλέω e não especifica indevidamente a natureza da fala em questão.
- source_word: ἐν ἐκκλησίᾳ
  choice: na assembleia
  rationale: Representa a comunidade reunida e evita que “igreja” seja entendida primeiramente como edifício ou instituição.
theological_decisions:
- issue: Alcance da restrição referente à fala das mulheres
  choice: Traduzir a cláusula sem limitar “falar” a perguntas perturbadoras, ao julgamento de profecias ou a outra modalidade específica de fala.
  alternative: Explicitar no texto uma restrição a perguntas, interrupções ou avaliação profética; ou tratar a declaração como citação de uma posição coríntia.
  rationale: A redação grega deste versículo não define por si só a modalidade exata de fala. A tradução preserva essa tensão interpretativa em vez de resolvê-la por expansão.
- issue: Sentido conjugal ou geral de γυνή e ἀνήρ
  choice: Usar “maridos” para ἄνδρας e “mulher” para γυναικί, registrando “esposa” em nota.
  alternative: Traduzir consistentemente como “esposas/maridos” ou como “mulheres/homens”.
  rationale: O possessivo em “seus próprios maridos” favorece o sentido conjugal de ἀνήρ. Já γυναικί admite tanto a leitura genérica “mulher” quanto a contextual “esposa”; a nota conserva essa ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perguntem em casa” é idiomático; “assembleia” preserva o sentido de reunião comunitária. A construção “é vergonhoso uma mulher falar” mantém concisão e naturalidade sem suavizar a força do original.
