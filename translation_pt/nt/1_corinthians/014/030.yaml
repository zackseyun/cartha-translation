source:
  edition: SBLGNT
  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: pt
  text: Mas, se algo for revelado a outro que está sentado[a], o primeiro se cale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se outro, estando sentado, receber uma revelação”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, aquele que estava falando primeiro deve parar para que o outro possa falar.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mas, se
  rationale: ἐὰν introduz a condição, e δὲ assinala uma transição com leve contraste dentro das instruções; “Mas, se” reproduz naturalmente essa relação.
- source_word: ἄλλῳ
  choice: a outro
  rationale: O dativo singular indica outro participante, distinto daquele que está falando.
- source_word: ἀποκαλυφθῇ
  choice: algo for revelado
  rationale: O aoristo passivo do subjuntivo significa literalmente “for revelado”. O pronome “algo” torna explícito em português o conteúdo implícito do verbo sem definir além do texto sua natureza ou seu agente.
- source_word: καθημένῳ
  choice: que está sentado
  rationale: O particípio modifica “outro” e descreve esse participante como sentado na reunião.
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: Mantém a formulação concisa do grego; no contexto, trata-se do primeiro a falar, isto é, daquele que já estava falando.
- source_word: σιγάτω
  choice: se cale
  rationale: O imperativo de terceira pessoa ordena que o primeiro pare de falar. “Se cale” é direto, natural e preserva a força imperativa.
theological_decisions:
- issue: Natureza e agente do evento revelador na profecia congregacional
  choice: “algo for revelado”, sem identificar expressamente o agente
  alternative: “outro receber uma revelação de Deus”
  rationale: O contexto permite entender uma revelação divina, mas o versículo não nomeia o agente. A tradução conserva essa contenção e a construção passiva do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem segue de perto o grego, mas evita rigidez. “Se cale” é entendido aqui como cessar a fala e ceder a palavra, não como uma proibição permanente.
