  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: pt
  text: 'Assim também vocês: se, por meio da língua, não proferirem palavras compreensíveis[a], como se entenderá o que está sendo dito? Pois estarão falando ao ar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras claras” ou “uma mensagem inteligível”. O grego enfatiza uma fala reconhecível e compreensível para os ouvintes.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: Mantém a ligação comparativa com a ilustração anterior e a aplicação direta aos coríntios, em português natural.
- source_word: διὰ τῆς γλώσσης
  choice: por meio da língua
  rationale: Preserva a imagem concreta de γλῶσσα e expressa o sentido instrumental da preposição διά.
- source_word: ἐὰν μὴ εὔσημον λόγον δῶτε
  choice: se ... não proferirem palavras compreensíveis
  rationale: εὔσημος indica aquilo que é claro, reconhecível ou inteligível. 'Proferirem' traduz naturalmente o ato de produzir fala, enquanto 'palavras' dá a λόγος seu sentido contextual de expressão verbal.
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: como se entenderá o que está sendo dito?
  rationale: No contexto da comunicação, o passivo de γινώσκω diz respeito à compreensão pelos ouvintes; o particípio presente passivo é refletido por 'está sendo dito'.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Pois estarão falando ao ar
  rationale: Conserva a metáfora de uma fala que não alcança ouvintes com compreensão; 'falar ao ar' é claro e idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a imagem da língua e a metáfora final, mas usa 'proferirem' para evitar a combinação pouco natural 'dar palavras'.
