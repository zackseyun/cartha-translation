id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: pt
  text: Pois Deus nos revelou essas coisas por meio do Espírito[a], porque o Espírito sonda todas as coisas, até mesmo as profundezas de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos revelou isso”; o objeto direto está implícito no grego e é entendido com base no contexto anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “as coisas profundas de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: nos
  rationale: 'Expressa naturalmente em português o dativo de destinatário: Deus revelou algo a nós.'
- source_word: ἀπεκάλυψεν
  choice: revelou
  rationale: O aoristo indica o ato de revelação; o pretérito perfeito português comunica adequadamente a ação concluída com relevância no contexto.
- source_word: '[objeto implícito de ἀπεκάλυψεν]'
  choice: essas coisas
  rationale: O grego deixa o objeto direto implícito; “essas coisas” o recupera do contexto precedente sem definir além do que o texto permite.
- source_word: διὰ τοῦ πνεύματος
  choice: por meio do Espírito
  rationale: διά com genitivo indica meio ou agência; a formulação preserva claramente esse valor.
- source_word: πνεῦμα
  choice: Espírito
  rationale: O contexto de revelação divina e conhecimento das profundezas de Deus favorece a referência ao Espírito Santo.
- source_word: ἐραυνᾷ
  choice: sonda
  rationale: “Sonda” conserva a ideia de investigação penetrante e combina naturalmente com a metáfora das profundezas.
- source_word: πάντα
  choice: todas as coisas
  rationale: Mantém a abrangência da expressão grega e o tom digno do argumento.
- source_word: καὶ
  choice: até mesmo
  rationale: Representa o valor intensivo e culminante de καί antes de “as profundezas de Deus”.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: as profundezas de Deus
  rationale: Preserva de modo formal e inteligível a metáfora de profundidade, sem explicá-la indevidamente.
theological_decisions:
- issue: Se πνεῦμα se refere ao Espírito Santo ou ao espírito humano
  choice: Espírito Santo nas duas ocorrências
  alternative: espírito humano em sentido geral
  rationale: O Espírito é apresentado como o meio da revelação de Deus e como aquele que sonda até as profundezas de Deus, o que favorece fortemente a referência ao Espírito Santo.
- issue: Natureza do ato de o Espírito “sondar” Deus
  choice: Preservar a linguagem de investigação penetrante
  alternative: Explicitar como conhecimento onisciente ou descoberta de algo antes desconhecido
  rationale: O texto afirma que o Espírito sonda, mas não sugere ignorância nem explica o modo desse conhecimento; a tradução mantém a tensão metafórica sem impor uma sistematização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por meio do” explicita naturalmente o valor instrumental; “sonda” preserva a força metafórica sem soar excessivamente técnico.
