source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: pt
  text: 'Mas, como está escrito: “O que nenhum olho viu, nenhum ouvido ouviu e não veio ao coração de ninguém[a] — isso Deus preparou para os que o amam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não subiu ao coração humano”; ou “não ocorreu a ninguém”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Expressa de modo conciso o contraste com o pensamento anterior.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Preserva a fórmula de citação das Escrituras e o sentido resultante do perfeito grego.
- source_word: Ἃ ... ὅσα
  choice: O que ... tudo isso
  rationale: Reproduz a retomada correlativa dos plurais neutros gregos em português natural, sem eliminar a estrutura poética.
- source_word: ὀφθαλμὸς ... οὖς
  choice: nenhum olho ... nenhum ouvido
  rationale: Mantém os substantivos no singular genérico e torna explícito em português o valor negativo produzido por οὐκ.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: não subiu ao coração humano
  rationale: Conserva a metáfora espacial do grego e o termo bíblico “coração”; “humano” comunica o sentido genérico de ἀνθρώπου sem restringi-lo ao sexo masculino.
- source_word: ἡτοίμασεν
  choice: preparou
  rationale: O pretérito perfeito traduz naturalmente a ação concluída do aoristo, cujo resultado permanece relevante.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: para os que o amam
  rationale: Formulação idiomática que mantém o valor descritivo e contínuo do particípio presente.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπου
  choice: coração humano
  alternative: coração do homem
  rationale: Neste contexto, ἄνθρωπος se refere ao ser humano de modo genérico. “Coração humano” preserva esse alcance e evita que o leitor moderno entenda uma referência exclusiva a homens.
- issue: Imagem bíblica do coração
  choice: manter “coração”
  alternative: traduzir por “mente” ou “imaginação”
  rationale: “Coração” preserva a antropologia e a metáfora do texto, sem reduzir antecipadamente o campo semântico a uma faculdade mental específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e a metáfora incomum “subiu ao coração”, esclarecida em nota, em vez de substituí-la silenciosamente por uma interpretação.
