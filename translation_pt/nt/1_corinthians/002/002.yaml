source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: pt
  text: Pois decidi não saber coisa alguma entre vocês, a não ser Jesus, o Messias — e este crucificado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. Em grego, “Jesus Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: decidi
  rationale: Neste contexto, κρίνω expressa uma determinação deliberada, não um julgamento judicial. “Decidi” é natural e preserva a intenção resoluta de Paulo.
- source_word: τι εἰδέναι
  choice: não saber coisa alguma
  rationale: 'Com οὐ e εἰ μὴ, a formulação tem força restritiva: Paulo decidiu não saber coisa alguma, salvo o objeto mencionado.'
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: A expressão situa a presença e o ministério de Paulo no meio dos coríntios. “Entre vocês” é claro e corrente.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: A construção é exceptiva; “a não ser” reproduz seu sentido de modo natural em português.
- source_word: Χριστόν
  choice: o Messias
  rationale: Aqui Χριστός funciona como título de Jesus. “O Messias” explicita esse valor, enquanto a forma tradicional “Cristo” é registrada em nota.
- source_word: τοῦτον ἐσταυρωμένον
  choice: e este crucificado
  rationale: O demonstrativo retoma Jesus enfaticamente, e o particípio perfeito passivo o apresenta como aquele que foi crucificado, com relevância persistente. A formulação compacta preserva a ênfase do grego.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, o termo destaca a identidade messiânica de Jesus em conexão com sua crucificação. A tradução por título preserva essa força sem excluir a alternativa tradicional, indicada em nota.
- issue: Força de ἐσταυρωμένον
  choice: crucificado
  alternative: que foi crucificado
  rationale: O particípio perfeito passivo permite a expressão condensada “crucificado”, que mantém em foco tanto o acontecimento da crucificação quanto a condição resultante, sem desenvolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão paulinas foram preservadas; o travessão marca a retomada enfática de Jesus pelo demonstrativo grego.
