id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: pt
  text: Nós, porém, não recebemos o espírito do mundo, mas o Espírito que vem de Deus, para que conheçamos[a] as coisas que Deus nos concedeu por sua graça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “compreendamos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos deu gratuitamente” ou “nos deu como presente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: espírito / Espírito
  rationale: A primeira ocorrência designa o princípio ou a influência que caracteriza o mundo; a segunda, no contexto, refere-se mais naturalmente ao Espírito Santo. A diferença de maiúscula preserva esse contraste sem ampliar o texto.
- source_word: κόσμου
  choice: mundo
  rationale: “Mundo” é a equivalência corrente e adequada para a ordem humana presente em contraste com Deus.
- source_word: ἐλάβομεν
  choice: recebemos
  rationale: O pretérito perfeito simples é natural em português e expressa a ação passada relevante para o argumento presente.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: que vem de Deus
  rationale: Explicita de modo natural a relação de origem indicada por ἐκ, sem identificar o Espírito como parte de Deus nem introduzir uma formulação técnica ausente do grego.
- source_word: ἵνα εἰδῶμεν
  choice: para que conheçamos
  rationale: Mantém explícita a finalidade da recepção do Espírito e preserva o sentido cognitivo de οἶδα.
- source_word: χαρισθέντα
  choice: concedeu por sua graça
  rationale: A formulação comunica tanto o ato de dar quanto a nuance de favor ou graça presente em χαρίζομαι.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: as coisas que Deus nos concedeu por sua graça
  rationale: O neutro plural tem alcance amplo; “as coisas” evita restringir a expressão aos dons espirituais.
theological_decisions:
- issue: Se πνεῦμα τὸ ἐκ τοῦ θεοῦ se refere especificamente ao Espírito Santo
  choice: “Espírito que vem de Deus”, com inicial maiúscula
  alternative: “espírito que vem de Deus”, com inicial minúscula
  rationale: No contraste imediato com “o espírito do mundo”, a referência mais natural é ao Espírito Santo recebido pelos fiéis. A maiúscula sinaliza essa leitura, enquanto a redação continua próxima do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência natural, mantendo o contraste, a finalidade e a amplitude do original.
