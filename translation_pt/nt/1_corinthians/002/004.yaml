id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: pt
  text: E minha fala e minha proclamação não se caracterizaram por sabedoria persuasiva[a], mas por demonstração do Espírito[b] e de poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com palavras persuasivas de sabedoria”.
    reason: lexical_alternative
  - marker: b
    text: Ou “espírito”.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: fala
  rationale: No contexto, refere-se à expressão oral de Paulo e contrasta com a persuasão retórica; “fala” é natural e mantém distinção de κήρυγμα.
- source_word: κήρυγμα
  choice: proclamação
  rationale: Preserva o sentido de anúncio público e autorizado sem confundi-lo com λόγος.
- source_word: πειθοῖ σοφίας
  choice: com sabedoria persuasiva
  rationale: A expressão grega não contém explicitamente “palavras”; esta tradução conserva sua forma concisa e a ideia de persuasão associada à sabedoria.
- source_word: ἀποδείξει
  choice: demonstração
  rationale: Expressa uma manifestação ou evidência que contrasta com a mera persuasão retórica.
- source_word: πνεύματος
  choice: do Espírito
  rationale: O contexto imediato e mais amplo aponta para a atuação do Espírito de Deus, embora a alternativa “espírito” permaneça possível e seja registrada em nota.
- source_word: δυνάμεως
  choice: de poder
  rationale: É a equivalência clara e habitual, preservando a coordenação grega com “do Espírito”.
theological_decisions:
- issue: Se πνεύματος designa o Espírito Santo ou “espírito” em sentido não especificado
  choice: do Espírito
  alternative: de espírito
  rationale: O desenvolvimento de 1 Coríntios 2 favorece a referência ao Espírito de Deus, mas a ausência de artigo e a possibilidade lexical justificam conservar a alternativa em nota.
- issue: Natureza da persuasão contrastada com a demonstração divina
  choice: sabedoria persuasiva
  alternative: palavras persuasivas de sabedoria
  rationale: A tradução principal evita inserir “palavras”, ausente no texto grego, sem definir além do necessário se a sabedoria em vista é apenas retórica ou também humana em sentido mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vieram com” comunica de modo natural a maneira pela qual a fala e a proclamação ocorreram, sem transformar explicitamente a expressão em comentário sobre seu conteúdo.
