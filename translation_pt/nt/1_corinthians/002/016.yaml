id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: pt
  text: Pois quem conheceu a mente do Senhor[b], para que o instrua? Nós, porém, temos a mente do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mente de Cristo”.'
    reason: lexical_alternative
  - marker: b
    text: Paulo faz eco a Isaías 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: Pois quem
  rationale: Expressa de modo direto a pergunta retórica e mantém a ligação explicativa de γάρ com o argumento anterior.
- source_word: ἔγνω νοῦν κυρίου
  choice: conheceu a mente do Senhor
  rationale: Preserva os termos centrais da citação e sua ressonância bíblica; o pretérito perfeito simples é natural em português neste contexto.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: para poder instruí-lo
  rationale: Comunica naturalmente a ideia de alguém conhecer a mente do Senhor em grau que o habilitasse a instruí-lo, sem transformar a pergunta retórica em afirmação.
- source_word: ἡμεῖς δὲ
  choice: Nós, porém
  rationale: Mantém a ênfase explícita em ἡμεῖς e o contraste marcado por δέ.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: temos a mente do Messias
  rationale: Mantém νοῦς como “mente”, traduz ἔχομεν diretamente e conserva Χριστός como título messiânico.
theological_decisions:
- issue: Tradução de Χριστοῦ em νοῦν Χριστοῦ
  choice: a mente do Messias
  alternative: a mente de Cristo
  rationale: Aqui Χριστός pode ser entendido como título. “Messias” torna explícita essa força, enquanto a alternativa tradicional “Cristo” é registrada em nota sem alterar a afirmação teológica.
- issue: Referente de αὐτόν
  choice: o Senhor, retomado por “-lo” em “instruí-lo”
  alternative: uma formulação que deixasse o referente menos explícito
  rationale: A construção grega retoma naturalmente κύριος; a forma pronominal portuguesa preserva essa referência sem acrescentar uma identificação além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Nós, porém” conserva a ênfase e o contraste do grego; “para poder instruí-lo” evita uma formulação excessivamente literal ou arcaica.
