  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: pt
  text: para que a fé de vocês não se apoiasse na sabedoria humana, mas no poder de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a oração de finalidade e preserva a força télica do grego.
- source_word: ἡ πίστις ὑμῶν
  choice: a fé de vocês
  rationale: πίστις refere-se aqui à resposta de fé dos coríntios; «de vocês» traduz o plural ὑμῶν com clareza e ampla legibilidade brasileira.
- source_word: μὴ ᾖ ἐν
  choice: não se apoiasse em
  rationale: O idiomatismo português explicita o sentido metafórico de a fé ter seu fundamento ou apoio em algo, sem alterar o contraste central.
- source_word: σοφίᾳ ἀνθρώπων
  choice: sabedoria humana
  rationale: ἀνθρώπων é genérico, abrangendo os seres humanos em geral. «Humana» comunica esse alcance naturalmente em português, sem a possível leitura exclusivamente masculina de «dos homens».
- source_word: δυνάμει θεοῦ
  choice: no poder de Deus
  rationale: Preserva o contraste paralelo entre a sabedoria humana e o poder divino, entendidos como aquilo em que a fé se apoia.
theological_decisions:
- issue: Sentido de ἐν nas expressões contrastantes
  choice: Traduzir como o apoio ou fundamento da fé
  alternative: Manter literalmente «estar na sabedoria humana... no poder de Deus»
  rationale: No contexto, Paulo contrasta a base sobre a qual repousa a fé, não uma localização física. «Apoiar-se» torna essa relação clara sem resolver além do que o texto afirma.
- issue: Alcance de ἀνθρώπων
  choice: «humana», em sentido genérico
  alternative: «dos homens»
  rationale: O substantivo grego designa aqui a humanidade em geral, sem contraste entre os sexos. A forma portuguesa escolhida preserva com precisão esse alcance.
translation_notes:
  register: Português moderno, digno e corrente, com legibilidade brasileira. A construção «a fé de vocês» evita a ambiguidade regional de «sua fé» e mantém explícito o plural. Não há necessidade de nota textual ou lexical.
