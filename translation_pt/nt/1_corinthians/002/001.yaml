  source_fidelity: O texto traduz corretamente a construção temporal ἐλθὼν … ἦλθον, o vocativo ἀδελφοί, o contraste com superioridade retórica ou sabedoria, o particípio καταγγέλλων e a leitura SBLGNT μαρτύριον τοῦ θεοῦ. A revisão conserva a ambiguidade do genitivo «de Deus» e a variante «mistério».
  naturalness: «Anunciando-lhes» é gramatical, mas soa mais formal e menos natural no português internacional com legibilidade brasileira, sobretudo após «vocês». «Anunciando a vocês» é claro e mantém o destinatário expresso. A posição da chamada da nota textual também fica mais precisa ao abranger toda a expressão variante.
  terminology: «Irmãos», «testemunho de Deus» e «mistério de Deus» são adequados. «Excelência de discurso ou de sabedoria» preserva o sentido de ὑπεροχή e é aceitável no registro digno do contexto.
