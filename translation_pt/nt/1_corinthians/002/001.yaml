id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: pt
  text: E eu, irmãos[a], quando fui até vocês, não fui com excelência de discurso ou de sabedoria, anunciando a vocês o testemunho de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode se referir aos membros da comunidade cristã em geral, incluindo as mulheres da congregação.
    reason: cultural_note
  - marker: b
    text: Alguns manuscritos trazem “mistério de Deus”.
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: E eu
  rationale: Preserva tanto a ligação de καί com o contexto anterior quanto a presença enfática do pronome de primeira pessoa, sem exagerar a ênfase.
- source_word: ἐλθὼν … ἦλθον
  choice: quando fui até vocês, não fui
  rationale: Converte o particípio em oração temporal natural em português e mantém a repetição do verbo presente no grego.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego; uma nota esclarece seu possível uso coletivo para os membros da congregação.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: com excelência de discurso ou de sabedoria
  rationale: Expressa a ideia de superioridade ou destaque retórico sem reduzir λόγος apenas ao estilo nem identificar a sabedoria com uma escola específica.
- source_word: καταγγέλλων
  choice: anunciando-lhes
  rationale: Mantém a forma participial e o sentido de anúncio público e declarativo do verbo.
- source_word: μαρτύριον
  choice: o testemunho
  rationale: Segue a leitura do texto-base SBLGNT e conserva o peso formal do substantivo.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém aberta a relação do genitivo, que pode indicar origem, pertencimento ou conteúdo, sem decidir a questão na tradução.
theological_decisions:
- issue: Variante textual em μαρτύριον
  choice: o testemunho de Deus
  alternative: o mistério de Deus
  rationale: O texto-base SBLGNT traz μαρτύριον, «testemunho». A variante μυστήριον, «mistério», é relevante e por isso é registrada em nota, não incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e preserva a repetição verbal e a ambiguidade do genitivo, evitando explicações denominacionais no texto.
