id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: pt
  text: Pois quem, entre os seres humanos, conhece o que é próprio do ser humano[a], a não ser o espírito do próprio ser humano, que está nele? Do mesmo modo, ninguém conhece[b] o que é próprio de Deus, a não ser o Espírito de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as coisas do ser humano”; também pode ser entendido como “os pensamentos do ser humano”.
    reason: lexical_alternative
  - marker: b
    text: Ou, “conheceu”. O perfeito grego pode enfatizar um conhecimento já adquirido, com efeito no presente.
    reason: tense_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: seres humanos / ser humano
  rationale: O substantivo tem referência humana genérica, não especificamente masculina. A escolha preserva essa abrangência em português moderno.
- source_word: τὰ τοῦ ἀνθρώπου / τὰ τοῦ θεοῦ
  choice: o que é próprio do ser humano / o que é próprio de Deus
  rationale: A construção grega é ampla e abrange o que pertence à esfera interior ou própria de alguém. A formulação mantém a amplitude e o paralelismo sem restringir o sentido apenas a pensamentos.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: o espírito do próprio ser humano, que está nele
  rationale: A tradução preserva a referência ao espírito da pessoa e verte explicitamente a oração atributiva τὸ ἐν αὐτῷ, sem acrescentar a noção interpretativa de habitação.
- source_word: οὕτως καὶ
  choice: Do mesmo modo
  rationale: Expressa com naturalidade a analogia estreita estabelecida entre o conhecimento humano e o divino.
- source_word: ἔγνωκεν
  choice: conheceu
  rationale: Mantém o valor formal do perfeito grego; a alternativa com valor presente resultante é registrada em nota.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Espírito de Deus
  rationale: No contexto imediato, a expressão designa o próprio Espírito de Deus, que sonda e revela as coisas divinas; a inicial maiúscula sinaliza esse referente pessoal sem ampliar o conteúdo.
theological_decisions:
- issue: Se πνεῦμα τοῦ θεοῦ deve ser apresentado como título pessoal divino ou como expressão não titular.
  choice: Espírito de Deus
  alternative: espírito de Deus
  rationale: O contexto de 1 Coríntios 2 apresenta o Espírito como aquele que sonda e revela as coisas de Deus. A capitalização segue esse referente contextual sem inserir elaboração doutrinária adicional.
- issue: O alcance de τὰ τοῦ ἀνθρώπου e τὰ τοῦ θεοῦ.
  choice: 'Manter expressões amplas e paralelas: “o que é próprio do ser humano” e “o que é próprio de Deus”.'
  alternative: Restringir ambas a “pensamentos”.
  rationale: O grego permite que pensamentos estejam incluídos, mas não limita explicitamente as expressões a eles; preservar a amplitude evita resolver uma tensão lexical que o texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Ser humano” evita uma leitura exclusivamente masculina; o paralelismo das duas metades do versículo foi preservado.
