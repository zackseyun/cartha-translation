  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: pt
  text: Porém, a pessoa espiritual[b] avalia[a] todas as coisas, mas ela mesma não é avaliada por ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «examina», «discerne» ou «julga», nas duas ocorrências de ἀνακρίνω.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é um adjetivo masculino singular usado como substantivo e se refere genericamente a uma pessoa caracterizada pelo Espírito.
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: a pessoa espiritual
  rationale: O adjetivo masculino singular é substantivado e designa genericamente uma pessoa caracterizada pelo Espírito; esta formulação é natural em português e não restringe a referência a um homem.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: avalia / é avaliada
  rationale: Neste contexto, o verbo expressa exame criterioso ou discernimento, não necessariamente condenação judicial. A repetição da mesma raiz em português preserva a correspondência entre a voz ativa e a passiva.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Preserva sem atenuação a abrangência e a forma substantivada da expressão grega.
- source_word: αὐτὸς
  choice: ela mesma
  rationale: Retém a ênfase do pronome grego e concorda naturalmente com «a pessoa» em português, sem alterar a referência genérica.
- source_word: ὑπ’ οὐδενὸς
  choice: por ninguém
  rationale: Expressa de modo natural e direto a negação absoluta da frase grega.
theological_decisions:
- issue: Alcance da afirmação sobre a pessoa espiritual
  choice: Manter sem qualificação «todas as coisas» e «por ninguém».
  alternative: Explicitar no texto principal que a afirmação se limita às realidades espirituais.
  rationale: O versículo formula a afirmação de modo absoluto, enquanto o contexto imediato oferece seu enquadramento. Acrescentar uma limitação explícita resolveria uma tensão que o grego preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pessoa espiritual» evita uma referência exclusivamente masculina. A repetição de «avalia» preserva o paralelismo lexical do original; os dois «mas» refletem as duas ocorrências de δέ, embora produzam uma repetição deliberada em português.
