id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: pt
  text: Mas a pessoa natural[a] não aceita as coisas do Espírito de Deus, pois são loucura para ela, e não pode conhecê-las, porque são discernidas espiritualmente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa não espiritual”.
    reason: lexical_alternative
  - marker: b
    text: Ou “são avaliadas espiritualmente” ou “são examinadas espiritualmente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: natural
  rationale: Preserva o contraste de Paulo com πνευματικός e descreve a pessoa limitada à vida meramente humana, sem explicitar além do que o grego afirma.
- source_word: ἄνθρωπος
  choice: pessoa
  rationale: O masculino singular grego tem sentido representativo; “pessoa” comunica naturalmente essa referência genérica em português.
- source_word: δέχεται
  choice: aceita
  rationale: Expressa acolher ou admitir como válido, sentido adequado ao argumento, e não apenas receber informação.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: as coisas do Espírito de Deus
  rationale: Mantém a construção ampla do grego, sem restringi-la a dons, palavras ou verdades específicas.
- source_word: μωρία
  choice: loucura
  rationale: É a equivalência corrente e digna em português, além de preservar o contraste recorrente entre a sabedoria de Deus e o juízo humano em 1 Coríntios.
- source_word: γνῶναι
  choice: conhecê-las
  rationale: Reflete diretamente o verbo γινώσκω e preserva sua amplitude, embora no contexto também possa envolver compreender ou reconhecer.
- source_word: πνευματικῶς
  choice: espiritualmente
  rationale: Reproduz de modo direto a forma adverbial e conserva a possível referência ao modo ou à esfera do discernimento.
- source_word: ἀνακρίνεται
  choice: são discernidas
  rationale: No contexto, comunica avaliação e percepção correta; a nota registra os sentidos igualmente possíveis de examinar e avaliar.
theological_decisions:
- issue: Sentido de ψυχικὸς ἄνθρωπος em contraste com o discernimento espiritual
  choice: a pessoa natural
  alternative: a pessoa não espiritual
  rationale: “Pessoa natural” preserva a tensão entre a condição meramente humana e o discernimento espiritual sem inserir explicitamente a formulação interpretativa “sem o Espírito”.
- issue: Agente ou modo em πνευματικῶς
  choice: espiritualmente
  alternative: pelo Espírito
  rationale: A tradução adverbial conserva a forma e a ambiguidade do grego, sem tornar explícito um agente que o texto não nomeia nessa oração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e as relações lógicas do grego foram preservadas sem rigidez excessiva; os pronomes foram ajustados para concordar naturalmente com “pessoa”.
