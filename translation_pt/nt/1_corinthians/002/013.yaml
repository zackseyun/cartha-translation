base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: pt
  text: Essas coisas também falamos, não com palavras ensinadas pela sabedoria humana, mas com palavras ensinadas pelo Espírito, expressando coisas espirituais com palavras espirituais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “explicando coisas espirituais a pessoas espirituais”. O grego admite mais de uma interpretação: πνευματικοῖς pode referir-se a pessoas espirituais ou, no contexto, a palavras espirituais; συγκρίνοντες também pode ter o sentido de combinar ou comparar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ καὶ λαλοῦμεν
  choice: Essas coisas também anunciamos
  rationale: “Essas coisas” retoma naturalmente as realidades mencionadas antes; “anunciamos” expressa a comunicação oral de λαλοῦμεν com dignidade e clareza.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: não com palavras ensinadas pela sabedoria humana
  rationale: “Com” comunica em português o valor instrumental de ἐν, enquanto a construção preserva a sabedoria humana como fonte do ensino.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: mas com palavras ensinadas pelo Espírito
  rationale: Repõe “palavras”, subentendido no grego, para evitar uma formulação obscura em português. O contexto identifica πνεύματος como o Espírito de Deus.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: explicando coisas espirituais a pessoas espirituais
  rationale: Toma πνευματικοῖς como masculino dativo e συγκρίνοντες no sentido de explicar ou interpretar. A ambiguidade sintática genuína é preservada em nota.
theological_decisions:
- issue: Referente de πνεύματος
  choice: o Espírito Santo, expresso como “o Espírito”
  alternative: espírito em sentido genérico
  rationale: O contexto imediato de 1 Coríntios 2 contrapõe repetidamente o Espírito de Deus à sabedoria humana.
- issue: Gênero e função de πνευματικοῖς
  choice: 'masculino: “a pessoas espirituais”'
  alternative: 'neutro ou instrumental: “com palavras espirituais”; também é possível “comparando coisas espirituais com espirituais”'
  rationale: A forma admite mais de uma análise. A leitura masculina produz sentido coerente, mas não elimina as alternativas plausíveis, registradas na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “palavras” explicita a elipse grega sem alterar o contraste. A nota conserva a conhecida ambiguidade da cláusula final.
