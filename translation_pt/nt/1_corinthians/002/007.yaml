source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: pt
  text: Mas falamos da sabedoria de Deus como mistério[a], a sabedoria oculta que Deus predestinou[b], antes das eras[c], para a nossa glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em mistério” ou “em segredo”. Em Paulo, “mistério” costuma designar o plano de Deus antes oculto e agora revelado.
    reason: lexical_alternative
  - marker: b
    text: Ou “determinou de antemão” ou “estabeleceu previamente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “antes dos tempos” ou “antes de todos os tempos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: falamos
  rationale: É o sentido simples de λαλέω e preserva o contraste de Paulo sem ampliá-lo para uma proclamação formal.
- source_word: θεοῦ σοφίαν
  choice: da sabedoria de Deus
  rationale: Reproduz naturalmente o genitivo grego e mantém a ideia de que essa sabedoria pertence a Deus e procede dele.
- source_word: ἐν μυστηρίῳ
  choice: em mistério
  rationale: Mantém o termo paulino para o propósito divino antes oculto e agora revelado, sem reduzi-lo a mero segredo.
- source_word: τὴν ἀποκεκρυμμένην
  choice: a sabedoria oculta
  rationale: O particípio feminino retoma 'sabedoria'; repetir o substantivo torna a referência clara em português.
- source_word: προώρισεν
  choice: predestinou
  rationale: É uma tradução direta e consagrada de προορίζω, preservando a força da determinação prévia de Deus sem definir um sistema doutrinário mais estreito.
- source_word: πρὸ τῶν αἰώνων
  choice: antes dos tempos
  rationale: Expressa a anterioridade cósmico-temporal de αἰῶνες em português corrente, sem a paráfrase interpretativa 'antes da criação do mundo'.
- source_word: εἰς δόξαν ἡμῶν
  choice: para a nossa glória
  rationale: É a tradução mais direta e preserva o peso teológico de δόξα sem explicá-lo como 'glorificação'.
theological_decisions:
- issue: O alcance doutrinário de προώρισεν no contexto paulino
  choice: predestinou
  alternative: determinou de antemão
  rationale: O verbo afirma uma determinação prévia de Deus. 'Predestinou' conserva essa força lexical, sem acrescentar quem ou o que mais estaria abrangido por essa determinação além da sabedoria mencionada no versículo.
- issue: O sentido paulino de μυστηρίῳ
  choice: mistério
  alternative: segredo
  rationale: '''Mistério'' preserva a tensão entre um propósito divino oculto e sua revelação, enquanto ''segredo'' pode sugerir apenas informação confidencial.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura apositiva do grego e mantém os termos teologicamente carregados “mistério”, “predestinou” e “glória”, esclarecendo alternativas apenas nas notas.
