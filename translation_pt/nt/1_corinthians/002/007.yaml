  source_fidelity: 'O texto preserva adequadamente a estrutura e o sentido do grego: o contraste de ἀλλά, a sabedoria pertencente a Deus, sua condição antes oculta, a determinação prévia divina e sua finalidade «para a nossa glória». Contudo, «antes dos tempos» é menos específico para πρὸ τῶν αἰώνων, cujo sentido temporal-cósmico é melhor conservado por «antes das eras».'
  naturalness: «Em mistério» é compreensível em registro bíblico, mas soa pouco natural no português moderno e pode sugerir apenas uma maneira enigmática de falar. «Como mistério» comunica de modo mais claro que a sabedoria é apresentada como mistério, preservando a formulação sem impor uma interpretação doutrinária.
  terminology: «Sabedoria», «mistério», «oculta», «predestinou» e «glória» são escolhas adequadas e consistentes com o vocabulário paulino. «Predestinou» mantém a força de προώρισεν sem especificar além do texto o alcance de tal determinação.
