    rationale: Embora próxima da forma grega, pode ser entendida como modo de discurso misterioso, em vez de qualificar a sabedoria como mistério. «Como mistério» é claro e permanece dentro do campo semântico indicado pela própria nota.
  - severity: low
    issue: «antes dos tempos» atenua a imagem de αἰῶνες.
    rationale: «Eras» traduz mais diretamente αἰῶνες e conserva a moldura temporal-cósmica do original; «antes dos tempos» pode ficar como alternativa em nota.
