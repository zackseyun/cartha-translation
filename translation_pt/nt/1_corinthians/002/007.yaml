  to: Mas falamos da sabedoria de Deus como mistério[a], a sabedoria oculta que Deus predestinou[b], antes das eras[c], para a nossa glória.
  rationale: A revisão melhora a legibilidade moderna de ἐν μυστηρίῳ com «como mistério» e adota «antes das eras» para representar mais precisamente πρὸ τῶν αἰώνων. O restante é mantido, pois é fiel ao grego e terminologicamente apropriado.
