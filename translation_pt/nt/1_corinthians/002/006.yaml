  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: pt
  text: No entanto, falamos sabedoria entre os maduros[a], mas não uma sabedoria desta era nem dos governantes desta era[b], que estão sendo reduzidos a nada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os perfeitos»; aqui, provavelmente, os que têm maturidade espiritual.
    reason: lexical_alternative
  - marker: b
    text: «Governantes desta era» pode se referir a autoridades humanas, a poderes espirituais ou a ambos.
    reason: alternative_reading
  - marker: c
    text: Ou «que estão passando», «que estão sendo abolidos» ou «que estão sendo anulados».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: sabedoria
  rationale: Equivalente direto e corrente de σοφία; a repetição conceitual é preservada no versículo.
- source_word: δὲ
  choice: No entanto / mas
  rationale: As duas ocorrências têm força adversativa. «No entanto» expressa o contraste inicial com o contexto, e «mas» introduz naturalmente a contraposição seguinte.
- source_word: λαλοῦμεν
  choice: falamos
  rationale: Traduz o sentido básico de λαλέω sem ampliá-lo para «proclamamos».
- source_word: ἐν τοῖς τελείοις
  choice: entre os maduros
  rationale: «Entre» reproduz naturalmente o valor contextual de ἐν, e «maduros» comunica o provável sentido de τέλειοις sem sugerir necessariamente perfeição moral absoluta.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: não a sabedoria desta era
  rationale: «Era» preserva o sentido temporal de αἰών e evita confundi-lo com κόσμος, «mundo».
- source_word: ἀρχόντων
  choice: governantes
  rationale: Termo amplo que pode abranger autoridades humanas ou poderes espirituais, sem decidir a referência debatida.
- source_word: τῶν καταργουμένων
  choice: que estão sendo reduzidos a nada
  rationale: Preserva a força processual do particípio presente e o sentido de tornar inoperante ou levar a nada.
theological_decisions:
- issue: Referência de «os governantes desta era»
  choice: Manter «governantes» sem especificar a natureza deles.
  alternative: Autoridades políticas ou religiosas humanas; poderes espirituais; ou ambos.
  rationale: A expressão grega não determina por si só uma dessas interpretações, portanto a tradução mantém a ambiguidade.
- issue: Sentido de τοῖς τελείοις
  choice: Traduzir como «os maduros».
  alternative: «Os perfeitos» ou «os plenamente desenvolvidos».
  rationale: No contexto, a expressão provavelmente indica maturidade, mas a nota conserva a alternativa mais formal e evita transformar essa probabilidade em certeza absoluta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a repetição de «sabedoria» nem as ambiguidades do grego.
