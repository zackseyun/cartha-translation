reference: 1 Corinthians 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: pt
  text: a qual nenhum dos governantes desta era[a] conheceu, pois se a tivessem conhecido, não teriam crucificado o Senhor da glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Governantes desta era” pode se referir a autoridades humanas, a poderes espirituais ou a ambos.
    reason: 'Leitura alternativa: a expressão grega não determina por si só qual desses referentes está em vista.'
lexical_decisions:
- source_word: ἣν
  choice: a qual
  rationale: O pronome relativo feminino singular retoma a sabedoria mencionada no contexto anterior; “a qual” torna essa ligação explícita e preserva a continuidade sintática.
- source_word: ἀρχόντων
  choice: governantes
  rationale: Expressa pessoas ou poderes que exercem autoridade sem limitar a referência a líderes humanos.
- source_word: αἰῶνος τούτου
  choice: desta era
  rationale: Preserva o sentido temporal e histórico de αἰών e a formulação paulina, sem reduzi-lo simplesmente a “mundo”.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: conheceu / tivessem conhecido
  rationale: Traduz diretamente γινώσκω e mantém a repetição do verbo grego. Na condição irreal, “tivessem conhecido” é a forma portuguesa natural e deixa em aberto se o conhecimento envolve reconhecimento ou compreensão.
- source_word: κύριον τῆς δόξης
  choice: Senhor da glória
  rationale: Mantém a construção genitiva, sua solenidade e sua força teológica, em vez de parafraseá-la como simples adjetivo.
- source_word: ἐσταύρωσαν
  choice: crucificado
  rationale: É a tradução direta e historicamente específica do ato designado por σταυρόω.
theological_decisions:
- issue: Identidade dos “governantes desta era”
  choice: A expressão foi mantida sem identificar os governantes como exclusivamente humanos ou espirituais.
  alternative: “líderes humanos desta era”, “poderes espirituais desta era” ou uma referência conjunta aos dois grupos
  rationale: O grego admite autoridades humanas, poderes espirituais ou uma referência em camadas que envolva ambos; o texto principal preserva essa ambiguidade genuína.
- issue: Nuance de γινώσκω no contexto
  choice: “conheceu / tivessem conhecido”
  alternative: “compreendeu / tivessem compreendido” ou “reconheceu / tivessem reconhecido”
  rationale: “Conhecer” acompanha mais diretamente o verbo grego e não decide se Paulo enfatiza compreensão da sabedoria, reconhecimento de Cristo ou ambos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada apenas o necessário para uma condição contrafactual natural em português; a repetição de “conhecer” e a ambiguidade dos governantes foram preservadas.
