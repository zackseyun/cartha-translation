  text: κἀγὼ ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ ἐγενόμην πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: pt
  text: E eu estive entre vocês em fraqueza[a], com temor e com muito tremor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eu fui até vocês em fraqueza, com temor e com muito tremor.”'
    reason: A expressão grega ἐγενόμην πρὸς ὑμᾶς pode descrever a presença de Paulo entre os coríntios ou, com maior foco no movimento, sua ida até eles.
lexical_decisions:
- source_word: κἀγώ
  choice: E eu
  rationale: Preserva tanto a ligação com a frase anterior quanto a autorreferência explícita de Paulo, sem acrescentar ênfase indevida.
- source_word: ἐν ἀσθενείᾳ
  choice: em fraqueza
  rationale: Mantém a amplitude de ἀσθένεια, que pode indicar fraqueza ou fragilidade, em linguagem clara e corrente.
- source_word: ἐν φόβῳ
  choice: com temor
  rationale: Expressa diretamente o estado descrito por Paulo, sem reduzi-lo a mera cautela nem especificar indevidamente a causa ou o objeto do temor.
- source_word: ἐν τρόμῳ πολλῷ
  choice: com muito tremor
  rationale: Traduz τρόμος de modo concreto e conserva o valor intensificador de πολλῷ; a repetição de 'com' produz uma sequência natural em português.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: estive entre vocês
  rationale: No contexto, comunica naturalmente a condição de Paulo em meio aos coríntios. A construção grega também pode focalizar sua chegada, possibilidade preservada na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “temor” preserva o peso de φόβος sem suavizá-lo, e “muito tremor” conserva de perto a intensidade do grego.
