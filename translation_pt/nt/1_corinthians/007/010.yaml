source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: pt
  text: Aos casados, porém, ordeno — não eu, mas o Senhor — que a esposa não se separe[a] do marido —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se divorcie do marido”. O verbo grego pode indicar separação conjugal e, neste contexto, talvez inclua o divórcio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Aos casados, porém
  rationale: O particípio perfeito indica pessoas que se encontram no estado de casadas; “aos casados” conserva de modo conciso o destinatário no dativo. “Porém” representa δέ como transição levemente contrastiva, sem introduzir uma ideia temporal ausente do grego.
- source_word: παραγγέλλω
  choice: ordeno
  rationale: O verbo expressa instrução autorizada; “ordeno” é direto, natural e mantém a força do original.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: não eu, mas o Senhor
  rationale: Mantém o contraste enfático do grego sem acrescentar uma explicação interpretativa ao texto.
- source_word: γυναῖκα ἀπὸ ἀνδρός
  choice: a esposa ... do marido
  rationale: No contexto matrimonial, γυνή e ἀνήρ significam respectivamente “esposa” e “marido”. O artigo definido em português apresenta o caso de modo geral e idiomático.
- source_word: μὴ χωρισθῆναι
  choice: que a esposa não se separe
  rationale: Embora a forma grega seja passiva, χωρίζω pode ter sentido intransitivo/passivo de separar-se. A construção portuguesa transmite naturalmente o conteúdo da ordem e preserva a amplitude entre separação conjugal e divórcio.
theological_decisions:
- issue: Sentido de “não eu, mas o Senhor”
  choice: Conservar literalmente o contraste entre Paulo e o Senhor
  alternative: Explicitar no corpo do texto que Paulo se refere a uma ordem anteriormente ensinada por Jesus
  rationale: A formulação literal preserva a tensão e não sugere que as palavras apostólicas careçam de autoridade, nem insere no versículo uma explicação que pertence à interpretação contextual.
- issue: Alcance de χωρισθῆναι no casamento
  choice: não se separe
  alternative: não se divorcie
  rationale: “Separar-se” corresponde mais diretamente ao verbo grego e deixa aberta a questão de o ato incluir ou equivaler juridicamente ao divórcio neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos elementos conserva a ênfase do original; os travessões refletem a interrupção enfática e o travessão final indica que a frase continua no versículo seguinte.
