base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: pt
  text: Você está vinculado a uma esposa? Não procure libertar-se[a]. Você está liberto de uma esposa? Não procure esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Você é casado? Não procure o divórcio. Você é divorciado? Não procure esposa.” O grego fala mais literalmente de estar “vinculado” e “liberto”.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: está ligado
  rationale: Preserva a metáfora do perfeito de δέω e seu contraste deliberado com λύσις/λέλυσαι, sem substituí-la diretamente por “casado”.
- source_word: γυναικί
  choice: a uma esposa
  rationale: Neste contexto matrimonial, γυνή significa “esposa”; o dativo indica a pessoa a quem alguém está ligado.
- source_word: ζήτει
  choice: procure
  rationale: Expressa de modo natural e direto a força do imperativo de ζητέω.
- source_word: λύσιν
  choice: desligar-se
  rationale: Traduz idiomaticamente a ideia de soltura ou liberação e mantém em português a correspondência lexical com “desligado” na oração seguinte.
- source_word: λέλυσαι
  choice: está desligado
  rationale: Preserva o perfeito e o paralelo com δέδεσαι, sem decidir se a condição decorre especificamente de divórcio, viuvez ou outra forma de ausência de vínculo conjugal.
- source_word: ἀπὸ γυναικός
  choice: de uma esposa
  rationale: Mantém o sentido relacional de ἀπό e entende γυνή no contexto como “esposa”.
- source_word: γυναῖκα
  choice: esposa
  rationale: O contexto trata de contrair casamento; em português, “procurar esposa” comunica isso de maneira clara e natural.
theological_decisions:
- issue: Se o texto deve empregar terminologia matrimonial explícita (“casado/divorciado”) ou conservar a imagem de vínculo e desligamento.
  choice: Conservar no texto principal a imagem de estar “ligado” ou “desligado”.
  alternative: “Você é casado? Não procure divorciar-se. Você é divorciado? Não procure esposa.”
  rationale: O grego emprega a linguagem de δέω/λύω, não termos inequívocos para casamento e divórcio. A formulação escolhida preserva a imagem e não restringe indevidamente a segunda condição ao divórcio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ligado/desligado” conserva o jogo lexical do grego; a nota oferece a interpretação matrimonial mais explícita sem eliminar a ambiguidade genuína do original.
