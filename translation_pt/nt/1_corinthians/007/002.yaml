  terminology: “Esposa” e “marido” são os sentidos contextualmente adequados de γυνή e ἀνήρ neste paralelismo conjugal. “Imoralidades sexuais” representa de modo transparente πορνείας sem impor uma definição doutrinária mais estreita. A âncora [a] está corretamente posicionada após a expressão anotada.
