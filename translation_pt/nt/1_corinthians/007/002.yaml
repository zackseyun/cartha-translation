id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: pt
  text: Mas, por causa das imoralidades sexuais[a], cada homem tenha a sua própria esposa, e cada mulher tenha o seu próprio marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “da imoralidade sexual” (no singular). O grego emprega o plural: “das imoralidades sexuais”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: διὰ δὲ
  choice: Mas, por causa de
  rationale: διά com o acusativo exprime causa, e δέ introduz um contraste ou avanço moderado no discurso. A formulação preserva tanto a relação causal quanto a transição.
- source_word: τὰς πορνείας
  choice: as imoralidades sexuais
  rationale: πορνεία designa conduta sexualmente imoral. O plural grego é mantido em português, embora o singular coletivo também seja idiomático.
- source_word: ἕκαστος
  choice: cada homem
  rationale: O masculino singular, em paralelo com ἑκάστη e com o par esposa/marido, aponta aqui para um referente masculino, e não para o sentido genérico de “cada pessoa”.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: a sua própria esposa
  rationale: γυνή pode significar “mulher” ou “esposa”; neste paralelismo conjugal com ἄνδρα, “esposa” é o sentido natural. ἑαυτοῦ reforça a relação própria de cada um.
- source_word: ἐχέτω
  choice: tenha
  rationale: O imperativo presente na terceira pessoa é vertido diretamente por “tenha”, preservando sua força sem ampliá-lo para “deve se casar” ou “tem de ter”.
- source_word: καὶ ἑκάστη
  choice: e cada mulher
  rationale: O distributivo feminino corresponde à primeira oração. “Cada mulher” reflete a forma grega, enquanto “seu próprio marido” explicita a relação conjugal.
- source_word: τὸν ἴδιον ἄνδρα
  choice: o seu próprio marido
  rationale: ἀνήρ pode significar “homem” ou “marido”; no contexto e no paralelismo com γυνή, “marido” é o sentido adequado. ἴδιον enfatiza que se trata do próprio cônjuge.
theological_decisions:
- issue: Se o versículo deve ser apresentado como recomendação de casamento para evitar o pecado sexual ou como instrução sobre relações conjugais
  choice: Manter a formulação direta “cada homem tenha... cada mulher tenha”, sem explicá-la como “case-se” nem como referência explícita aos deveres conjugais.
  alternative: Traduzir interpretativamente como “cada homem deve se casar” ou “cada um cumpra seus deveres conjugais”.
  rationale: O grego emprega ἐχέτω (“tenha”), não um verbo explícito para casar-se nem uma expressão específica para relações sexuais. A tradução preserva a abertura interpretativa do texto e evita acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural menos habitual “imoralidades sexuais” foi mantido para refletir a forma do grego; a alternativa idiomática no singular aparece em nota.
