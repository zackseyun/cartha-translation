  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: pt
  text: A circuncisão não é nada[a], e a incircuncisão não é nada, mas guardar os mandamentos de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não tem valor», nas duas ocorrências de «não é nada».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: circuncisão
  rationale: Emprega o substantivo português consagrado e preserva o contraste entre marcas de condição identitária.
- source_word: οὐδέν ἐστιν
  choice: não é nada
  rationale: Reproduz de modo direto e enfático a estrutura grega repetida; a nota registra a alternativa idiomática e avaliativa.
- source_word: ἀκροβυστία
  choice: incircuncisão
  rationale: Mantém o antônimo nominal de «circuncisão» e a simetria retórica do original.
- source_word: ἀλλά
  choice: o que importa é
  rationale: Expressa naturalmente em português o contraste elíptico entre aquilo que «não é nada» e aquilo que tem valor, sem acrescentar um objeto ou verbo ausente do grego.
- source_word: τήρησις
  choice: guardar
  rationale: «Guardar os mandamentos» é uma construção portuguesa natural, concreta e próxima do sentido de observância.
- source_word: ἐντολῶν θεοῦ
  choice: os mandamentos de Deus
  rationale: Preserva o plural concreto e a relação genitiva do texto grego em registro claro e digno.
theological_decisions:
- issue: A avaliação paulina da circuncisão e da incircuncisão
  choice: O versículo relativiza tanto a circuncisão quanto a incircuncisão diante da observância dos mandamentos de Deus.
  alternative: Entender a frase como abolição de toda possível relevância moral da circuncisão em qualquer contexto.
  rationale: A tradução conserva a afirmação incisiva e o contraste do versículo sem ampliar seu alcance para além do argumento imediato nem resolver a tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém a repetição enfática do grego; o ponto e vírgula deixa claro o contraste final. «Incircuncisão» é termo bíblico formal, mas transparente no paralelismo.
