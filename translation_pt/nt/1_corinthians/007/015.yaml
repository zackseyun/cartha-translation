id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: pt
  text: Mas, se o descrente se separar[a], que se separe. O irmão ou a irmã não está escravizado em casos assim[b]; Deus, porém, nos chamou para viver em paz.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, se o cônjuge descrente se separar. O grego diz literalmente “o descrente”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não está sujeito à escravidão”. O verbo grego significa “escravizar”, e não é o verbo mais comum para “ligar”.'
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos trazem “vocês” em vez de “nos”.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: o descrente
  rationale: A expressão substantivada designa, no contexto, o cônjuge que não crê. “O descrente” é natural em português e não acrescenta “cônjuge” ao texto principal.
- source_word: χωρίζεται / χωριζέσθω
  choice: se separar / que se separe
  rationale: Mantém a repetição lexical do grego e evita decidir se se trata especificamente de divórcio legal ou de partida física. O imperativo é concessivo, não uma ordem para provocar a separação.
- source_word: οὐ δεδούλωται
  choice: não está escravizado
  rationale: Traduz diretamente δουλόω, “escravizar”, em vez de usar o verbo mais genérico “estar ligado”; assim, não transforma a frase numa conclusão técnica sobre divórcio ou novo casamento.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: o irmão ou a irmã
  rationale: Preserva explicitamente a linguagem de parentesco espiritual e os dois gêneros presentes no grego.
- source_word: ἐν τοῖς τοιούτοις
  choice: em casos assim
  rationale: Expressão idiomática clara que remete a situações como a separação descrita.
- source_word: ἐν δὲ εἰρήνῃ
  choice: porém, ... para viver em paz
  rationale: Em português, “chamar para viver em paz” comunica naturalmente a esfera ou condição de paz expressa por ἐν, sem reduzir a frase a mera tranquilidade interior.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Deus ... nos chamou
  rationale: Segue a leitura ἡμᾶς, “nos”, do SBLGNT. O perfeito grego denota um chamado realizado com efeito presente; o pretérito perfeito simples é a forma portuguesa natural.
theological_decisions:
- issue: Alcance de οὐ δεδούλωται quanto à dissolução do casamento e a um novo casamento
  choice: “não está escravizado”, sem definir no texto o alcance completo dessa liberdade
  alternative: “não está ligado”, entendido como autorização técnica para um novo casamento; ou liberdade apenas da obrigação de perseguir o cônjuge que parte
  rationale: O versículo não explicita todas as consequências jurídicas ou pastorais da expressão. A tradução lexical preserva essa tensão e evita impor uma conclusão denominacional.
- issue: Referente de ὁ ἄπιστος
  choice: “o descrente” no texto, entendido contextualmente como o cônjuge descrente
  alternative: “o cônjuge descrente”
  rationale: O contexto identifica o referente, mas o substantivo “cônjuge” não aparece no grego; a formulação escolhida conserva essa implicitidade.
- issue: Sentido de ἐν εἰρήνῃ
  choice: “para viver em paz”
  alternative: “em paz” ou “à paz”
  rationale: A formulação portuguesa apresenta a paz como o âmbito ou modo de vida do chamado divino, sem afirmar que a manutenção do casamento a qualquer custo seja o sentido exclusivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “que se separe” expressa concessão sem soar como ordem para iniciar o divórcio. Os marcadores foram colocados junto às expressões a que se referem; a variante textual aparece após a oração correspondente.
