source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: pt
  text: Pois como você sabe, esposa, se você salvará seu marido?[a] Ou como você sabe, marido, se você salvará sua esposa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais idiomática: «como você pode saber [...] se poderá salvar [...]?». O grego emprega um verbo no futuro («salvará») numa pergunta indireta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Pois como você sabe
  rationale: A expressão interrogativa τί + οἶδας é transmitida naturalmente por «como você sabe»; «pois» preserva a força explicativa de γάρ em relação ao contexto anterior.
- source_word: γύναι
  choice: esposa
  rationale: Embora γυνή possa significar «mulher», o contexto matrimonial exige «esposa».
- source_word: ἄνερ
  choice: marido
  rationale: Embora ἀνήρ possa significar «homem», o vocativo ocorre em contexto matrimonial e designa o marido.
- source_word: σώσεις
  choice: salvará
  rationale: O futuro do indicativo é preservado. Com εἰ numa pergunta indireta, não afirma o resultado, mas põe em questão se ele ocorrerá.
- source_word: τὸν ἄνδρα
  choice: seu marido
  rationale: O possessivo explicita de forma idiomática em português a relação conjugal indicada pelo contexto.
- source_word: τὴν γυναῖκα
  choice: sua esposa
  rationale: O possessivo expressa naturalmente em português a relação conjugal indicada pelo contexto.
- source_word: ἢ
  choice: Ou
  rationale: A conjunção simples preserva o paralelismo disjuntivo entre as duas perguntas.
theological_decisions:
- issue: Sentido de «salvar» no contexto matrimonial
  choice: Manter «salvar», conservando sua possível força salvífica sem a reduzir.
  alternative: Levar à fé; preservar o casamento; salvar em sentido espiritual mais amplo.
  rationale: σῴζω frequentemente tem peso salvífico no uso paulino. A tradução não deve restringir o termo à preservação do casamento nem resolver a tensão interpretativa por meio de paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por «você» evita formas regionais marcadas; os vocativos «esposa» e «marido» preservam o paralelismo do grego. A nota registra a alternativa idiomática sem apagar a forma futura do original.
