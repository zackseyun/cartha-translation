source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: pt
  text: Mas digo isso como concessão[a], não como mandamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a título de concessão” ou “como permissão”.
    reason: Alternativas lexicais que expressam o sentido permissivo de συγγνώμην neste contexto.
lexical_decisions:
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma a afirmação pertinente no contexto imediato sem especificar além do que o grego permite.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca aqui uma transição com leve contraste, introduzindo a distinção entre concessão e mandamento.
- source_word: λέγω
  choice: digo
  rationale: O presente simples traduz de modo natural o presente do indicativo grego.
- source_word: κατὰ συγγνώμην
  choice: como concessão
  rationale: A expressão indica uma permissão ou concessão, em contraste com uma determinação obrigatória.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: não como mandamento
  rationale: A expressão nega que a declaração seja apresentada como uma ordem vinculante; “mandamento” preserva claramente o contraste com “concessão”.
theological_decisions:
- issue: Se a declaração de Paulo deve ser entendida como permissão pessoal ou como uma forma menor de mandamento divino
  choice: Paulo apresenta explicitamente o que diz como concessão, não como mandamento obrigatório.
  alternative: O conselho ainda pode carregar autoridade apostólica indireta.
  rationale: O texto distingue claramente concessão de mandamento. A tradução mantém essa tensão sem minimizar nem ampliar a autoridade apostólica além do que o versículo afirma.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. “Isso” é idiomático para a referência contextual, e “mandamento” conserva o vocabulário bíblico corrente sem soar arcaico.
