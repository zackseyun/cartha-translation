reference: 1 Corinthians 7:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: pt
  text: Digo isso para o benefício de vocês mesmos, não para lhes lançar um laço, mas visando ao que é apropriado e à dedicação constante ao Senhor, sem distrações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: benefício
  rationale: Expressa aquilo que é vantajoso ou proveitoso para os destinatários, em linguagem natural e direta.
- source_word: βρόχον
  choice: laço
  rationale: Preserva a metáfora forte de uma armadilha ou corda que restringe, em vez de reduzi-la ao sentido abstrato de 'restrição'.
- source_word: εὔσχημον
  choice: o que é digno
  rationale: Comunica conduta apropriada, respeitável e decorosa sem impor uma aplicação mais específica do que o grego.
- source_word: εὐπάρεδρον
  choice: dedicação
  rationale: No contexto, indica estar assiduamente voltado ao Senhor; 'dedicação' oferece uma formulação portuguesa clara sem sugerir necessariamente uma postura física.
- source_word: ἀπερισπάστως
  choice: sem distrações
  rationale: Mantém a ideia de atenção não desviada ou não dividida.
theological_decisions:
- issue: Natureza do conselho de Paulo sobre casamento e estado civil
  choice: Formulação em termos de benefício, dignidade e dedicação, sem transformar o conselho em mandamento absoluto
  alternative: Traduzir como uma obrigação religiosa ou superioridade universal do celibato
  rationale: A negação 'não para lhes lançar um laço' indica que Paulo não pretende impor coerção; a tradução preserva essa tensão pastoral.
- issue: Relação sintática de εὔσχημον e εὐπάρεδρον
  choice: Coordenar 'o que é digno' e 'a dedicação ao Senhor sem distrações'
  alternative: Subordinar um conceito ao outro, como 'a conduta digna que consiste em dedicação'
  rationale: O καί permite coordenação, e a estrutura portuguesa conserva a relativa abertura da relação entre os dois objetivos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'vocês'. A metáfora de 'laço' foi mantida. Evitou-se um marcador inicial como 'Ora' ou 'Agora', pois δέ aqui funciona melhor como conexão discursiva leve e não exige tradução explícita.
