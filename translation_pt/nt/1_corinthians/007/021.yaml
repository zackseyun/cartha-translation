id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a slave? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: pt
  text: Você era escravo quando foi chamado? Não deixe que isso o preocupe. Mas, se de fato puder tornar-se livre, aproveite a oportunidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes, tire proveito da sua condição atual”, isto é, permaneça como está. No grego, o objeto de “aproveite” não é expresso, e a frase tem sido entendida das duas maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: escravo
  rationale: O termo indica condição de escravidão, salientada aqui pela possibilidade de tornar-se livre; “servo” poderia atenuar indevidamente essa condição social.
- source_word: ἐκλήθης
  choice: quando foi chamado
  rationale: Preserva a linguagem paulina do chamado sem acrescentar explicitamente “por Deus” ou “à fé”, elementos compreendidos pelo contexto, mas não expressos nesta oração.
- source_word: μή σοι μελέτω
  choice: Não deixe que isso o preocupe
  rationale: Expressa de modo natural a ideia de preocupação ou inquietação transmitida pelo idioma grego.
- source_word: ἐλεύθερος γενέσθαι
  choice: tornar-se livre
  rationale: Reflete diretamente a mudança de condição social, da escravidão para a liberdade.
- source_word: μᾶλλον χρῆσαι
  choice: aproveite a oportunidade
  rationale: χρῆσαι significa “fazer uso” ou “aproveitar”, mas seu objeto está implícito. No texto principal, entende-se como objeto a oportunidade de obter a liberdade, sugerida pela oração imediatamente anterior.
theological_decisions:
- issue: Ambiguidade interpretativa de μᾶλλον χρῆσαι
  choice: Entender que Paulo aconselha o escravo a aproveitar a oportunidade de tornar-se livre.
  alternative: Entender que Paulo aconselha o escravo a fazer uso de sua condição atual, isto é, a permanecer escravo.
  rationale: A oração imediatamente anterior fornece como referente mais natural a possibilidade de liberdade. Contudo, como o grego não declara o objeto de χρῆσαι e a leitura alternativa possui apoio histórico substancial, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita eufemizar δοῦλος e conserva em nota a ambiguidade real da última oração.
