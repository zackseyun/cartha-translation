source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: pt
  text: Quanto às virgens[a], não tenho mandamento do Senhor, mas dou o meu parecer[b], como alguém que recebeu misericórdia do Senhor para ser digno de confiança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às mulheres solteiras” ou, segundo algumas interpretações do contexto, “às filhas virgens”. O grego diz “virgens”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha opinião” ou “o meu conselho”. Paulo contrasta aqui seu parecer ponderado com um “mandamento do Senhor” direto.
    reason: alternative_reading
  - marker: c
    text: Ou “de ser fiel”. O termo grego pode significar tanto “fiel” quanto “digno de confiança”; neste contexto, pode indicar que, pela misericórdia do Senhor, Paulo é um orientador confiável.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz um novo assunto no discurso. “Quanto a” é natural em português e preserva a transição temática sem acrescentar um advérbio temporal inexistente no grego.
- source_word: τῶν παρθένων
  choice: às virgens
  rationale: παρθένος designa basicamente uma virgem, muitas vezes uma jovem solteira. A tradução mantém o termo mais direto, sem decidir no texto principal qual grupo específico está em vista.
- source_word: ἐπιταγὴν κυρίου
  choice: mandamento do Senhor
  rationale: ἐπιταγή indica ordem, mandamento ou determinação. A expressão portuguesa preserva tanto a autoridade quanto a possível relação de origem ou posse expressa pelo genitivo.
- source_word: γνώμην
  choice: o meu parecer
  rationale: γνώμη pode significar parecer, opinião ou juízo ponderado. “Parecer” comunica uma avaliação refletida e mantém o contraste com um mandamento direto.
- source_word: δίδωμι
  choice: dou
  rationale: 'Reproduz diretamente o presente do verbo e forma uma expressão idiomática natural em português: “dou o meu parecer”.'
- source_word: ὡς
  choice: como alguém que
  rationale: Expressa a condição ou qualidade na qual Paulo apresenta seu parecer e explicita de modo natural o sujeito implícito.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: recebeu do Senhor a misericórdia
  rationale: O particípio perfeito passivo indica alguém que foi alvo da misericórdia do Senhor. A formulação preserva a iniciativa divina e a relação com a condição descrita a seguir.
- source_word: πιστὸς εἶναι
  choice: de ser digno de confiança
  rationale: πιστός pode significar “fiel” ou “digno de confiança”. No contexto, a confiabilidade de Paulo como orientador é proeminente, embora a alternativa permaneça registrada em nota.
theological_decisions:
- issue: Natureza da autoridade de Paulo em contraste com um mandamento do Senhor
  choice: Paulo afirma não possuir um mandamento direto do Senhor sobre o assunto, mas oferece seu parecer como alguém tornado digno de confiança pela misericórdia do Senhor.
  alternative: Entender suas palavras como mera opinião particular sem autoridade, ou supor que ele esteja citando indiretamente um mandamento desconhecido de Jesus.
  rationale: O contraste entre ἐπιταγή e γνώμη distingue um mandamento direto de uma avaliação apostólica ponderada. A tradução mantém essa tensão sem reduzir o parecer a uma opinião casual nem apresentá-lo como mandamento direto do Senhor.
- issue: Sentido de πιστός
  choice: digno de confiança
  alternative: fiel
  rationale: Ambos os sentidos são lexicalmente possíveis. “Digno de confiança” se ajusta ao fato de Paulo fundamentar a credibilidade de seu parecer, mas a nota preserva a alternativa “fiel”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quanto às” marca naturalmente a mudança de assunto; “parecer” evita tanto a informalidade de “opinião” quanto uma formulação que pudesse soar como ordem. A estrutura final conserva a ligação explícita entre a misericórdia do Senhor e a confiabilidade de Paulo.
