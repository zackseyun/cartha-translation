base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become slaves of men.
translation:
  language: pt
  text: Vocês foram comprados por um preço; não se tornem escravos de seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “escravos de pessoas”. O termo grego se refere aqui aos seres humanos em contraste com o Senhor, não apenas a homens do sexo masculino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: por um preço
  rationale: O genitivo indica o preço ou custo da compra. A formulação preserva a metáfora comercial sem acrescentar ao texto que o preço foi “alto” ou especificar em que consistiu.
- source_word: ἠγοράσθητε
  choice: vocês foram comprados
  rationale: O aoristo passivo, na segunda pessoa do plural, descreve uma compra já realizada e mantém a metáfora de aquisição presente no contexto.
- source_word: μὴ γίνεσθε
  choice: não se tornem
  rationale: Preserva o sentido normal de γίνομαι, “tornar-se”, e a força da proibição, em vez de reduzi-la ao estado expresso por “não sejam”.
- source_word: δοῦλοι
  choice: escravos
  rationale: A ideia de sujeição e pertencimento é central no contraste com a compra mencionada na primeira oração; “servos” enfraqueceria essa metáfora.
- source_word: ἀνθρώπων
  choice: de seres humanos
  rationale: ἄνθρωπος, aqui no plural, abrange pessoas humanas em contraste com o Senhor, não apenas indivíduos do sexo masculino. “Seres humanos” comunica esse alcance com precisão em português atual.
theological_decisions:
- issue: O alcance de δοῦλοι ἀνθρώπων e o contraste entre domínio humano e pertencimento ao Senhor
  choice: escravos de seres humanos
  alternative: escravos de homens; servos de pessoas
  rationale: “Escravos” mantém a força da linguagem de propriedade e lealdade, enquanto “seres humanos” expressa o sentido abrangente de ἀνθρώπων. A tradução não define além do texto se a proibição trata de escravidão social, submissão espiritual ou ambas, preservando a tensão do contexto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”, natural para ampla leitura brasileira. A estrutura breve e paralela do grego foi preservada; evitou-se acrescentar “alto” a “preço” ou explicar no corpo do versículo quem efetuou a compra.
