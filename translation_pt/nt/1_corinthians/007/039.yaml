  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: pt
  text: A esposa está ligada enquanto o marido vive; mas, se o marido adormecer[a], ela fica livre para se casar com quem quiser, somente no Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, morrer. O grego emprega “adormecer” como eufemismo comum para a morte.
    reason: lexical_alternative
  - marker: b
    text: “No Senhor” é frequentemente entendido como “com alguém que pertence ao Senhor”, isto é, um crente. A expressão também pode enfatizar que o casamento deve ocorrer dentro da esfera de fidelidade ao Senhor.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνὴ
  choice: A esposa
  rationale: No contexto matrimonial, γυνή designa especificamente a esposa, não a mulher em sentido geral.
- source_word: δέδεται
  choice: está ligada
  rationale: O perfeito passivo expressa um estado contínuo de vínculo; a formulação preserva a força relacional e jurídica sem acrescentar “pela lei”.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: enquanto ... vive
  rationale: A construção indica a duração integral do vínculo e soa natural em português atual.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: o marido
  rationale: Neste contexto, ἀνήρ tem o sentido inequívoco de marido; o possessivo pode ficar implícito naturalmente em português.
- source_word: κοιμηθῇ
  choice: adormecer
  rationale: Mantém o eufemismo grego para a morte e sua textura metafórica; a nota esclarece o sentido.
- source_word: ἐλευθέρα ἐστὶν
  choice: ela fica livre
  rationale: Indica que, com a morte do marido, ela deixa de estar sob o vínculo matrimonial anterior.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: para se casar com quem quiser
  rationale: Expressa naturalmente em português tanto a liberdade de escolha quanto o sentido matrimonial do infinitivo passivo.
- source_word: μόνον ἐν κυρίῳ
  choice: contanto que seja no Senhor
  rationale: Comunica a força restritiva de μόνον e preserva a expressão paulina ἐν κυρίῳ sem explicá-la excessivamente no texto principal.
theological_decisions:
- issue: Sentido de “no Senhor” na orientação sobre um novo casamento
  choice: Preservar a formulação “no Senhor” no texto principal.
  alternative: Traduzir de modo explícito como “somente com alguém que pertença ao Senhor” ou “somente com outro crente”.
  rationale: A expressão é teologicamente significativa e semanticamente condensada. A tradução literal preserva a ambiguidade genuína entre a identidade do cônjuge e a esfera ou maneira do casamento; a nota registra a interpretação mais comum.
- issue: Eufemismo para a morte
  choice: Preservar “adormecer” no texto principal.
  alternative: Traduzir diretamente por “morrer”.
  rationale: O verbo κοιμάομαι funciona aqui como eufemismo comum para morrer. Manter a metáfora conserva a forma e a ressonância do texto grego, enquanto a nota garante clareza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Esposa”, “marido” e “se casar” são correntes; “está ligada” preserva o teor do vínculo sem soar excessivamente jurídico. As notas mantêm visíveis tanto o eufemismo grego quanto a concisão interpretativa de “no Senhor”.
