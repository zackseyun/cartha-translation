source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: pt
  text: O marido dê à esposa o que lhe é devido no casamento[a], e, da mesma forma, a esposa ao marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a obrigação que tem para com ela”; mais literalmente, “a dívida”. Neste contexto, refere-se à obrigação conjugal que os cônjuges têm um para com o outro.'
    reason: alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: γυναικί
  choice: esposa
  rationale: No contexto imediato de instruções matrimoniais, γυνή designa especificamente a esposa, não a mulher em sentido geral.
- source_word: ἀνήρ / ἀνδρί
  choice: marido
  rationale: Em paralelo com γυνή e dentro do contexto matrimonial, ἀνήρ significa marido.
- source_word: ὀφειλήν
  choice: o que lhe é devido no casamento
  rationale: ὀφειλή denota literalmente dívida ou obrigação. A formulação preserva essa ideia básica e, ao mencionar o casamento, esclarece o sentido conjugal indicado pelo contexto sem tornar a expressão mais explícita que o original.
- source_word: ἀποδιδότω
  choice: dê
  rationale: O imperativo presente expressa uma obrigação contínua; o presente do subjuntivo com valor imperativo é natural, digno e direto em português.
- source_word: ὁμοίως δὲ καὶ
  choice: e, da mesma forma
  rationale: A expressão liga a segunda oração à primeira e ressalta a plena reciprocidade entre os cônjuges.
theological_decisions:
- issue: Grau de explicitação da obrigação indicada por ὀφειλή
  choice: o que lhe é devido no casamento
  alternative: dever conjugal; obrigação conjugal; o que lhe é devido
  rationale: A escolha mantém a metáfora de algo devido e deixa que o contexto dos versículos próximos indique sua dimensão sexual, evitando tanto uma formulação vaga demais quanto uma especificação que exceda o substantivo grego.
- issue: Reciprocidade da obrigação matrimonial
  choice: Preservar a estrutura paralela entre marido e esposa
  alternative: Reformular a frase em termos coletivos dos cônjuges
  rationale: O paralelismo do original dá a mesma obrigação a ambos e deve permanecer visível, sem introduzir assimetria teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção paralela conserva a concisão e a reciprocidade do grego; a nota registra o sentido mais literal de ὀφειλή.
