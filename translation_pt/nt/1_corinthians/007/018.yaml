  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: pt
  text: Alguém foi chamado estando circuncidado? Não tente desfazer a circuncisão[a]. Alguém foi chamado estando incircunciso? Não se circuncide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não se torne incircunciso”; isto é, não tente ocultar ou reverter as marcas da circuncisão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: estando circuncidado
  rationale: O particípio perfeito descreve o estado resultante da circuncisão no momento do chamado; esta formulação preserva tanto o estado quanto a relação temporal, em paralelo com a segunda pergunta.
- source_word: ἐκλήθη / κέκληταί
  choice: foi chamado
  rationale: No contexto, o verbo se refere ao chamado de Deus para a vida cristã. A mesma forma portuguesa nas duas perguntas é natural e não atribui peso indevido à variação aspectual grega.
- source_word: ἐπισπάσθω
  choice: não tente desfazer a circuncisão
  rationale: O verbo alude à tentativa de ocultar ou reverter fisicamente as marcas da circuncisão. A tradução comunica a prática antiga com clareza, enquanto a nota registra a formulação mais literal.
- source_word: ἐν ἀκροβυστίᾳ
  choice: estando incircunciso
  rationale: A expressão indica a condição em que a pessoa foi chamada. 'Estando incircunciso' é idiomático, preciso e mantém o paralelismo.
- source_word: περιτεμνέσθω
  choice: não seja circuncidado
  rationale: O imperativo presente com μή expressa proibição; esta construção preserva a força diretiva sem ampliá-la.
theological_decisions:
- issue: Sentido de 'chamado' nas duas perguntas
  choice: Chamado por Deus para a vida cristã enquanto a pessoa se encontrava em determinada condição
  alternative: Chamado em sentido meramente geral
  rationale: O contexto imediato de 1 Coríntios 7 relaciona o chamado divino à condição do fiel naquele momento. Mantém-se, porém, o verbo 'chamar', sem parafraseá-lo como 'converter', para não eliminar sua amplitude teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O paralelismo das duas perguntas foi preservado; 'incircunciso' é usado por precisão e concisão, e a prática antiga implícita no primeiro mandamento é esclarecida em nota.
