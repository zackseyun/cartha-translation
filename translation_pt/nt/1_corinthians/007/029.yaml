  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: pt
  text: 'O que quero dizer é isto, irmãos[a]: o tempo foi abreviado; de agora em diante, de modo que até os que têm esposa sejam como se não tivessem esposa,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o plural masculino ἀδελφοί, que pode ser usado para se dirigir a um grupo misto de fiéis.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: O que quero dizer é isto
  rationale: Expressa em português natural a fórmula discursiva com que Paulo introduz uma explicação, sem reduzi-la ao sentido literal e menos idiomático de “isto digo”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego. No contexto, ela pode funcionar como modo de dirigir-se ao conjunto dos fiéis, o que é esclarecido em nota.
- source_word: ὁ καιρός
  choice: o tempo
  rationale: É uma formulação concisa e natural; καιρός pode indicar um tempo decisivo ou determinado, nuance preservada em nota junto à construção seguinte.
- source_word: συνεσταλμένος ἐστίν
  choice: foi abreviado
  rationale: A construção perifrástica no perfeito descreve uma redução já ocorrida com efeito presente. “Foi abreviado” conserva a imagem de encurtamento sem explicitar quem o abreviou.
- source_word: τὸ λοιπὸν
  choice: de agora em diante
  rationale: Comunica com clareza a orientação temporal da exortação para o período restante.
- source_word: ἵνα
  choice: De agora em diante, ... sejam
  rationale: A ligação com a abreviação do tempo é mantida pela sequência imediata e pelo modo subjuntivo, sem decidir rigidamente entre propósito e resultado.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: os que têm esposa
  rationale: Mantém a referência específica a homens que têm esposa, em vez de generalizar para todas as pessoas casadas.
- source_word: ὡς μὴ ἔχοντες
  choice: como se não tivessem
  rationale: Reproduz de modo natural a comparação enfática do grego, deixando “esposa” subentendido a partir da oração anterior.
theological_decisions:
- issue: Força pastoral e teológica da orientação de Paulo a respeito do casamento
  choice: Manter diretamente a afirmação de que os que têm esposa sejam como se não tivessem.
  alternative: Parafrasear como “não façam do casamento sua prioridade” ou “vivam desapegados do casamento”.
  rationale: O texto relativiza de maneira urgente uma condição social comum diante do tempo abreviado. A tradução preserva essa tensão, sem sugerir o abandono das obrigações conjugais nem harmonizar interpretativamente a frase com outras afirmações paulinas sobre o casamento.
- issue: Relação expressa por ἵνα entre o tempo abreviado e a exortação
  choice: Conservar a ligação sem fixá-la exclusivamente como propósito ou como resultado.
  alternative: Traduzir explicitamente “a fim de que” ou “com o resultado de que”.
  rationale: ἵνα admite aqui mais de uma nuance contextual. A redação evita resolver uma ambiguidade legítima do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a intensidade da formulação paulina e termina com vírgula porque a sentença continua no versículo seguinte.
