review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a fórmula introdutória, a referência aos irmãos, o encurtamento do tempo e a comparação relativa aos que têm esposa. Contudo, a redação atual não expressa de forma gramaticalmente suficiente a ligação introduzida por ἵνα: depois de ponto, “De agora em diante, ... sejam” fica como subjuntivo solto. A revisão restitui essa ligação sem decidir de modo indevido entre finalidade e consequência.'
  naturalness: “O que quero dizer é isto” e “como se não tivessem esposa” são naturais em português moderno. A frase revista usa ponto e vírgula e “de modo que” para tornar a construção fluente e completa, preservando a suspensão final exigida pela continuidade no versículo seguinte.
  terminology: “Irmãos” preserva a forma masculina plural de ἀδελφοί, com nota cultural apropriada. “Esposa” corresponde ao sentido contextual de γυναῖκας. “Tempo” é adequado para καιρός; a nota registra de maneira útil a alternativa que salienta seu caráter determinado.
  issues:
