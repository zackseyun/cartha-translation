revisions:
- from: 'O que quero dizer é isto, irmãos[a]: o tempo foi abreviado[b]. De agora em diante, até os que têm esposa sejam como se não tivessem,'
  to: 'O que quero dizer é isto, irmãos[a]: o tempo foi abreviado; de agora em diante, de modo que até os que têm esposa sejam como se não tivessem esposa,'
  rationale: A revisão corrige a ligação sintática e semântica da cláusula com ἵνα, preservando sua flexibilidade contextual por meio de “de modo que”. Também explicita “esposa” na comparação final, evitando que “não tivessem” fique sem referente expresso numa oração já densa. Mantêm-se o registro, a intensidade da formulação e a vírgula final, pois a frase continua no versículo seguinte. A nota b é mantida como alternativa lexical, embora o marcador não seja necessário no texto principal revisado; para evitar marcador órfão, ela deve ser ancorada em “tempo” como “tempo[b]”.
