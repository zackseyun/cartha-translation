    issue: A oração subordinada introduzida por ἵνα não está explicitamente ligada à oração precedente.
    rationale: Em “O tempo foi abreviado. De agora em diante, até os que têm esposa sejam...”, o subjuntivo “sejam” fica sintaticamente solto em português. O grego liga a condição presente do tempo abreviado à exortação/resultado subsequente por ἵνα. “De modo que” oferece uma ligação portuguesa natural sem impor exclusivamente finalidade ou resultado.
  revised_text: 'O que quero dizer é isto, irmãos[a]: o tempo foi abreviado; de agora em diante, de modo que até os que têm esposa sejam como se não tivessem esposa,'
