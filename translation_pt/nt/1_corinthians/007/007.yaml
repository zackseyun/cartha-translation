  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: pt
  text: 'Quero que todos sejam como eu mesmo. No entanto, cada um tem seu próprio dom da parte de Deus: um de uma maneira, outro de outra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: Eu gostaria
  rationale: Expressa aqui um desejo pessoal de Paulo de modo natural em português, sem converter a afirmação em ordem.
- source_word: πάντας ἀνθρώπους
  choice: todos
  rationale: O plural de ἄνθρωπος tem alcance humano geral; “todos” comunica isso naturalmente sem introduzir uma restrição explícita aos homens.
- source_word: χάρισμα
  choice: dom
  rationale: Mantém a ideia de uma dádiva concedida por Deus e corresponde ao uso cristão corrente, sem especificar além do texto a natureza exata do dom.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: um de um modo, outro de outro
  rationale: Reproduz a contraposição deliberadamente aberta do grego e preserva sua concisão.
theological_decisions:
- issue: A natureza do “dom” de cada pessoa
  choice: Manter “dom” sem identificá-lo exclusivamente com celibato, casamento ou continência.
  alternative: Explicitar que uma pessoa tem o dom do celibato e outra o do casamento.
  rationale: O contexto relaciona a declaração ao estado de Paulo e às diferentes condições de vida, mas o versículo formula a diversidade dos dons de modo aberto; especificá-los resolveria uma tensão que o grego preserva.
- issue: Força do desejo de Paulo
  choice: Traduzir θέλω por “gostaria”, como desejo pessoal.
  alternative: “Quero”, que pode soar mais volitivo ou prescritivo em português.
  rationale: A continuação reconhece que cada pessoa recebeu seu próprio dom de Deus, mostrando que a frase não impõe a condição de Paulo como norma universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção evita linguagem marcada por gênero onde o grego é genericamente humano e conserva a formulação aberta da frase final.
