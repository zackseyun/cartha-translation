base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: pt
  text: 'Quanto aos assuntos sobre os quais vocês escreveram: é bom que o homem não toque em mulher.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “tocar em mulher” pode ser um eufemismo para ter relações sexuais.
    reason: Esclarece o provável sentido idiomático de ἅπτεσθαι sem substituir a imagem concreta nem eliminar sua ambiguidade no texto principal.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Quanto aos assuntos sobre os quais vocês escreveram
  rationale: Expressa naturalmente a mudança de assunto marcada por Περὶ δέ e conserva a referência ao conteúdo da carta dos coríntios, sem acrescentar um advérbio temporal inexistente.
- source_word: καλόν
  choice: é bom
  rationale: Mantém a avaliação ampla e concisa do grego, sem especificar se significa recomendável, vantajoso ou moralmente superior.
- source_word: ἀνθρώπῳ
  choice: que o homem
  rationale: Neste contexto, o contraste com γυναικός indica um homem do sexo masculino, e não o ser humano em sentido genérico.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: não toque em mulher
  rationale: Preserva a formulação literal e a possível expressão eufemística do grego, deixando a nota esclarecer o provável sentido sexual sem apagá-lo no texto.
theological_decisions:
- issue: Se “é bom...” é uma afirmação de Paulo ou uma citação da carta dos coríntios
  choice: Não usar aspas
  alternative: Apresentar a frase entre aspas como citação dos coríntios
  rationale: O texto grego não contém marcas que decidam a questão. A ausência de aspas preserva a ambiguidade interpretativa em vez de identificar categoricamente o falante.
- issue: Alcance de γυνή
  choice: mulher
  alternative: esposa
  rationale: γυνή pode significar mulher ou esposa, mas a construção isolada não exige a referência exclusiva ao casamento; “mulher” conserva o alcance lexical mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural e estrutura próxima do grego. A formulação evita tanto linguagem excessivamente técnica quanto uma paráfrase sexual explícita no texto principal.
