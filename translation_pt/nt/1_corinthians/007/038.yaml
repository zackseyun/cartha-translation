reference: 1 Corinthians 7:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: pt
  text: Assim, aquele que dá em casamento a sua virgem[a] faz bem, e aquele que não a dá em casamento fará melhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que se casa com sua noiva virgem faz bem, e aquele que não se casa com ela fará melhor”. Outra interpretação comum entende a expressão como “sua filha virgem”. O verbo grego empregado aqui significa mais naturalmente “dar em casamento”; por isso, o texto principal preserva esse sentido sem especificar a relação exata entre o homem e a virgem.'
    reason: Registra as principais interpretações de uma expressão grega discutida e explica por que o texto principal mantém a leitura causativa e o referente em aberto.
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz a conclusão inferida do argumento anterior de modo natural e preserva a força lógica do grego.
- source_word: γαμίζων
  choice: dá em casamento
  rationale: O verbo causativo γαμίζω significa mais naturalmente “dar em casamento”, em contraste com γαμέω, “casar-se”. A tradução mantém essa distinção sem definir além do necessário a relação entre o homem e a virgem.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: a sua virgem
  rationale: παρθένος significa “virgem”, e ἑαυτοῦ expressa uma relação própria ou possessiva. Embora a expressão seja incomum em português, ela preserva a ambiguidade do referente, que pode ser entendida no contexto como filha virgem, jovem sob responsabilidade ou, segundo outra leitura, noiva virgem.
- source_word: καλῶς ποιεῖ
  choice: faz bem
  rationale: Expressão idiomática clara que mantém a avaliação positiva do grego sem transformá-la em mandamento absoluto.
- source_word: μὴ γαμίζων
  choice: não a dá em casamento
  rationale: Mantém o mesmo sentido causativo do primeiro uso de γαμίζω; o pronome “a” retoma naturalmente “a sua virgem”.
- source_word: κρεῖσσον ποιήσει
  choice: fará melhor
  rationale: Preserva o valor comparativo de κρεῖσσον, sem convertê-lo no superlativo “fará o melhor”.
theological_decisions:
- issue: Referente de “a sua virgem” e sentido de γαμίζω em 1 Coríntios 7:38
  choice: O texto principal mantém o sentido causativo “dar em casamento” e não especifica se a virgem é filha ou outra jovem sob responsabilidade.
  alternative: “Aquele que se casa com sua noiva virgem faz bem, e aquele que não se casa com ela fará melhor”; outra interpretação comum especifica “sua filha virgem”.
  rationale: 1 Coríntios 7:36–38 constitui uma conhecida dificuldade interpretativa. A forma γαμίζω favorece o sentido causativo “dar em casamento”, mas a identidade social exata da virgem permanece discutida. A tradução evita impor uma reconstrução específica e registra as principais alternativas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão incomum “a sua virgem” foi mantida deliberadamente para não resolver no texto uma ambiguidade real do original; a nota oferece formulações portuguesas naturais para as principais interpretações.
