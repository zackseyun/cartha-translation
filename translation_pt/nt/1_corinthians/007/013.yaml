  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: pt
  text: E, se uma mulher tem marido que não crê, e ele concorda em viver com ela, que ela não deixe o marido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que ela não mande embora o marido». O verbo grego pode significar literalmente «deixar» ou «mandar embora»; aqui se refere a pôr fim à relação matrimonial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mulher
  rationale: γυνή pode significar «mulher» ou «esposa». Aqui o contexto matrimonial é explícito por ἔχει ἄνδρα; «uma mulher tem marido» é natural e claro em português.
- source_word: εἴ τις
  choice: se uma mulher
  rationale: A construção condicional indefinida apresenta um caso geral. Em português, «se uma mulher» comunica essa força sem a rigidez de «se alguma mulher».
- source_word: ἄνδρα / τὸν ἄνδρα
  choice: marido / o marido
  rationale: Embora ἀνήρ também possa significar «homem», o contexto matrimonial exige «marido». Na repetição, o artigo identifica o cônjuge já mencionado.
- source_word: ἄπιστον
  choice: que não crê
  rationale: No contexto, designa o cônjuge que não compartilha a fé cristã. A oração relativa é clara e evita que «infiel» seja entendido como maritalmente adúltero.
- source_word: οὗτος
  choice: ele
  rationale: O demonstrativo retoma o marido; o pronome «ele» é a forma idiomática em português.
- source_word: συνευδοκεῖ
  choice: concorda
  rationale: O verbo expressa anuência ou disposição favorável. «Concorda» é corrente e preserva a ideia de consentimento voluntário.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: em viver com ela
  rationale: A expressão se refere à continuidade da vida doméstica compartilhada. «Viver com ela» é natural e preciso.
- source_word: μὴ ἀφιέτω
  choice: que ela não deixe
  rationale: A forma imperativa negativa é bem representada por «que ela não deixe». «Deixar» preserva melhor a amplitude lexical de ἀφίημι do que «divorciar-se», sem reduzir a ordem a uma simples ausência física; a nota esclarece o sentido matrimonial.
theological_decisions:
- issue: Sentido da ordem μὴ ἀφιέτω em um casamento de fé mista
  choice: que ela não deixe o marido
  alternative: que ela não se divorcie do marido
  rationale: No contexto, a ordem diz respeito a não pôr fim à relação matrimonial quando o cônjuge que não crê aceita continuar a vida em comum. «Deixe» acompanha mais de perto a amplitude do grego e preserva a tensão entre separação e dissolução formal, esclarecida em nota, sem impor uma definição jurídico-denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo e a estrutura condicional do grego, evitando «infiel» por sua possível conotação de infidelidade conjugal.
