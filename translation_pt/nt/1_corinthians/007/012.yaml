  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: pt
  text: 'Mas, aos demais, digo eu — não o Senhor —: se algum irmão tem uma esposa que não crê, e ela concorda em viver com ele, que ele não se divorcie dela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que ele não a deixe” ou “que ele não a mande embora”. O verbo grego significa mais literalmente “deixar” ou “mandar embora”, mas aqui se refere a pôr fim ao casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Mas, aos demais
  rationale: “Aos demais” identifica o grupo restante ainda não tratado; “mas” expressa a transição levemente contrastiva de δέ.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: digo eu — eu, não o Senhor —
  rationale: Mantém a ênfase do pronome ἐγώ e a força parentética da distinção, sem sugerir que Paulo esteja negando a autoridade de sua instrução.
- source_word: ἀδελφὸς
  choice: irmão
  rationale: O masculino singular, em contraste com “esposa”, refere-se especificamente a um homem pertencente à comunidade cristã.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: tem uma esposa que não crê
  rationale: ἔχει γυναῖκα é expressão matrimonial; “que não crê” deixa claro que ἄπιστον diz respeito à fé, não à infidelidade conjugal.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: e ela concorda
  rationale: Expressa de modo natural a disposição favorável ou anuência indicada por συνευδοκεῖ.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: em viver com ele
  rationale: Representa a vida doméstica compartilhada em português corrente.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: que ele não se divorcie dela
  rationale: No contexto matrimonial, ἀφίημι designa deixar ou repudiar a esposa, isto é, pôr fim ao casamento; “divorciar-se” comunica claramente esse sentido ao leitor moderno.
theological_decisions:
- issue: A declaração de Paulo “eu, não o Senhor”
  choice: Preservar a distinção entre a instrução apostólica de Paulo e uma palavra direta de Jesus sobre esse caso.
  alternative: Entender a frase como mera opinião pessoal de Paulo, sem autoridade.
  rationale: O contexto diferencia um ensino diretamente atribuído ao Senhor de uma aplicação apostólica a uma situação não explicitamente tratada por Jesus. A tradução conserva essa tensão sem explicar dentro do versículo se a instrução possui menor autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “digo eu — eu” conserva a ênfase incomum do grego; “esposa que não crê” evita a possível leitura de “descrente” como pessoa cética em sentido genérico ou de “infiel” como adúltera.
