reference: 1 Corinthians 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: pt
  text: Pois o marido que não crê foi santificado por meio da esposa, e a esposa que não crê foi santificada por meio do irmão[a]. Caso contrário, os filhos de vocês são impuros; mas, de fato, são santos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por meio do marido crente. O grego diz literalmente «por meio do irmão», provavelmente usando «irmão» no sentido habitual de Paulo para um companheiro de fé.
    reason: lexical_alternative
  - marker: b
    text: Aqui, «foi santificado» indica uma condição santa ou separada em relação ao cônjuge crente e à família; não significa necessariamente salvação pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: foi santificado
  rationale: O perfeito passivo expressa uma ação passada com estado resultante. A formulação preserva a ligação lexical com «santos» sem afirmar, por si só, salvação pessoal.
- source_word: ἄπιστος
  choice: que não crê
  rationale: No contexto matrimonial, descreve quem não é crente; a locução é clara e natural em português e evita o possível sentido moral de «infiel».
- source_word: ἐν
  choice: por meio de
  rationale: Expressa o valor relacional ou instrumental da preposição neste contexto, sem restringi-la indevidamente a uma única explicação teológica.
- source_word: ἀνήρ / γυνή
  choice: marido / esposa
  rationale: O contexto imediato trata do casamento, tornando esses sentidos mais específicos do que «homem / mulher».
- source_word: ἀδελφῷ
  choice: o irmão
  rationale: Preserva a expressão específica do texto grego e o uso paulino de «irmão» para um companheiro de fé; a nota esclarece o referente provável.
- source_word: ἐπεὶ ἄρα
  choice: caso contrário
  rationale: Introduz de modo idiomático a consequência que se seguiria se a afirmação anterior não fosse válida.
- source_word: ἀκάθαρτα
  choice: impuros
  rationale: Conserva o contraste religioso e cultual com «santos»; no plural referente a «filhos», «impuros» é corrente e compreensível.
- source_word: νῦν δὲ
  choice: mas, de fato
  rationale: Marca a situação real em contraste com a hipótese precedente; aqui νῦν tem força lógica, não necessariamente temporal.
- source_word: ἅγια
  choice: santos
  rationale: Mantém a terminologia de santidade e a conexão lexical com ἡγίασται, sem substituí-la por uma paráfrase interpretativa.
theological_decisions:
- issue: Sentido da santificação do cônjuge que não crê
  choice: Manter «foi santificado» no texto e explicar que a expressão indica uma condição santa ou separada em relação ao cônjuge crente e à família, sem necessariamente significar salvação pessoal.
  alternative: Entender que o cônjuge é automaticamente salvo, ou reduzir a frase apenas à legitimidade sexual do casamento.
  rationale: O argumento relaciona a condição do casamento à dos filhos, mas o versículo não define exaustivamente a natureza dessa santidade. A tradução preserva a tensão e a nota evita uma conclusão soteriológica indevida.
- issue: Referente de ἀδελφῷ
  choice: Conservar «o irmão», entendido provavelmente como o marido crente.
  alternative: Traduzir diretamente como «o marido crente» ou «o cônjuge crente».
  rationale: O grego emprega especificamente ἀδελφός, e não ἀνήρ, na segunda oração. A tradução mantém essa diferença, enquanto a nota fornece o esclarecimento contextual.
- issue: Condição dos filhos
  choice: Traduzir os presentes ἐστιν como «são», tanto em «são impuros» quanto em «são santos».
  alternative: Empregar «seriam impuros» na oração hipotética.
  rationale: Embora «seriam» seja idiomático em português após «caso contrário», o presente conserva mais diretamente a forma verbal grega e a formulação argumentativa incisiva de Paulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Que não crê» evita a ambiguidade de «infiel»; «o irmão» mantém transparência ao original; as notas preservam a ambiguidade teológica sem impor uma tradição denominacional.
