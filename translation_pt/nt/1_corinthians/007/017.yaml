  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: pt
  text: Contudo, cada um ande[b] conforme o que o Senhor lhe atribuiu[a] e conforme Deus o chamou. E assim ordeno em todas as igrejas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “repartiu” ou “designou”. O verbo grego pode referir-se ao que o Senhor distribuiu, atribuiu ou designou a cada pessoa.
    reason: lexical_alternative
  - marker: b
    text: “Andar” é uma metáfora bíblica frequente para o modo de viver; também se pode traduzir por “viva” ou “conduza a sua vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Contudo
  rationale: Neste contexto, a expressão funciona como transição adversativa que introduz o princípio geral de Paulo, e não como condição literal. “Contudo” é natural em português e mantém a ligação com a discussão anterior.
- source_word: ἑκάστῳ / ἕκαστον
  choice: cada um
  rationale: A expressão preserva a aplicação distributiva e individual enfatizada pela repetição de ἕκαστος no grego, ainda que a frase portuguesa evite uma repetição pouco natural.
- source_word: ἐμέρισεν
  choice: repartiu
  rationale: O verbo indica aquilo que o Senhor distribuiu ou atribuiu a cada pessoa. “Repartiu” conserva a imagem verbal do original sem definir excessivamente a natureza da situação concedida.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Forma consagrada e natural em português, preservando o título distinto usado no primeiro membro paralelo.
- source_word: κέκληκεν
  choice: chamou
  rationale: “Chamou” expressa com naturalidade o chamado divino já realizado; no contexto, seu efeito continuado é compreendido sem necessidade de uma construção composta pouco idiomática.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente padrão de θεός, mantendo a designação distinta do segundo membro paralelo.
- source_word: οὕτως
  choice: conforme / assim
  rationale: “Conforme” expressa nos dois membros o modo ou padrão da vida de cada pessoa, enquanto “assim” retoma naturalmente o mesmo princípio na oração final.
- source_word: περιπατείτω
  choice: ande
  rationale: Preserva a metáfora bíblica de caminhar como modo de viver, sendo ao mesmo tempo clara e familiar em português.
- source_word: διατάσσομαι
  choice: instruo
  rationale: Comunica a orientação apostólica com autoridade sem intensificar desnecessariamente o tom para “ordeno” ou “mando”.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: em todas as igrejas
  rationale: Tradução clara e estabelecida para as comunidades cristãs locais mencionadas por Paulo.
theological_decisions:
- issue: Distinção entre “o Senhor” e “Deus”
  choice: 'Manter os dois títulos: “o Senhor lhe repartiu” e “Deus o chamou”'
  alternative: Tratar ambos como simples variação estilística e uniformizar o referente
  rationale: O grego emprega duas designações divinas distintas em membros paralelos. A tradução conserva essa distinção sem impor uma harmonização interpretativa.
- issue: Metáfora ética em περιπατείτω
  choice: Preservar a metáfora com “ande”
  alternative: Explicitar como “viva” ou “conduza a vida”
  rationale: A metáfora permanece compreensível em português e conserva a textura do original sem restringir o alcance da exortação.
- issue: Natureza da situação repartida pelo Senhor
  choice: Não explicitar o objeto de “repartiu”
  alternative: Acrescentar “uma condição”, “uma situação” ou “um lugar na vida”
  rationale: O objeto não é declarado no grego. Mantê-lo implícito preserva a amplitude e a ambiguidade contextual da formulação paulina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada com moderação para soar natural, preservando a metáfora de “andar”, a distinção entre “o Senhor” e “Deus” e a força geral da instrução apostólica.
