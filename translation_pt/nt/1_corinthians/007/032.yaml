base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: pt
  text: 'Mas quero que vocês estejam livres de preocupações. O homem solteiro se preocupa com as coisas do Senhor[a]: como agradar ao Senhor;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A pessoa solteira”. O grego está no masculino singular (“o homem solteiro”), embora, no contexto mais amplo, Paulo trate tanto de homens como de mulheres, casados e solteiros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Mas quero
  rationale: θέλω expressa vontade ou desejo; δέ introduz aqui um contraste leve com a discussão anterior, bem representado por “Mas”.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: que vocês estejam livres de preocupações
  rationale: ἀμέριμνος indica estar sem ansiedade ou preocupação indevida. A formulação é natural em português e não sugere indiferença absoluta.
- source_word: ὁ ἄγαμος
  choice: O homem solteiro
  rationale: O adjetivo substantivado está no masculino singular. “Homem solteiro” preserva essa forma e se ajusta ao contraste específico desenvolvido nos versículos seguintes.
- source_word: μεριμνᾷ
  choice: se preocupa com
  rationale: O verbo pode significar preocupar-se ou ocupar-se com algo. A repetição da família semântica de ἀμέριμνος é preservada de modo claro e natural.
- source_word: τὰ τοῦ κυρίου
  choice: as coisas do Senhor
  rationale: A expressão abrange aquilo que diz respeito ao Senhor, sem delimitar essas questões de maneira indevida.
- source_word: κυρίου / κυρίῳ
  choice: Senhor
  rationale: “Senhor” preserva o título cristológico habitual de κύριος e sua força teológica no contexto.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: em como agradar ao Senhor
  rationale: πῶς introduz o modo ou objetivo da preocupação. Em português, o infinitivo após “em como” comunica naturalmente a ação contemplada pelo subjuntivo grego.
theological_decisions:
- issue: Referência masculina singular no contraste de Paulo entre estados civilmente solteiro e casado
  choice: 'Manter o masculino singular no texto principal: “O homem solteiro”'
  alternative: “A pessoa solteira” ou “Quem não é casado”
  rationale: O grego emprega uma forma masculina singular, e os versículos adjacentes tratam separadamente dos casos masculino e feminino. A nota esclarece que o contexto mais amplo aborda ambos sem neutralizar a forma desta frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Vocês” representa naturalmente o plural ὑμᾶς. A repetição “preocupações / se preocupa” conserva a relação lexical intencional do grego.
