  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: pt
  text: A esposa não tem autoridade sobre seu próprio corpo, mas o marido tem; da mesma forma, o marido também não tem autoridade sobre seu próprio corpo, mas a esposa tem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não exerce autoridade sobre”. O verbo grego pode indicar tanto possuir como exercer autoridade; aqui, a afirmação é recíproca entre os cônjuges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: esposa
  rationale: No contexto imediato do casamento e dos deveres conjugais mútuos, o termo designa especificamente a mulher casada.
- source_word: ἀνήρ
  choice: marido
  rationale: Em paralelo com γυνή e dentro do contexto conjugal, o termo significa especificamente o homem casado.
- source_word: ἰδίου σώματος
  choice: o próprio corpo
  rationale: Preserva a ênfase de ἴδιος naquilo que pertence à própria pessoa e soa natural em português.
- source_word: ἐξουσιάζει
  choice: exerce autoridade sobre
  rationale: O verbo pode indicar possuir ou exercer autoridade. Esta formulação comunica naturalmente a ação no presente e preserva a força relacional e recíproca da frase, sem ampliá-la para dominação.
- source_word: ἀλλά
  choice: mas
  rationale: Marca de forma direta o contraste entre a própria pessoa e o cônjuge.
- source_word: ὁμοίως δὲ καὶ
  choice: da mesma forma, ... também
  rationale: Preserva a correspondência enfática e a simetria entre as duas afirmações.
theological_decisions:
- issue: Natureza da autoridade conjugal no versículo
  choice: Expressar a declaração em termos de autoridade mútua e simétrica.
  alternative: Traduzir mais fracamente em termos de pertencimento, ou mais fortemente em termos de controle de um cônjuge sobre o outro.
  rationale: A construção grega atribui reciprocamente a cada cônjuge autoridade em relação ao corpo do outro. A tradução conserva essa tensão sem introduzir hierarquia unilateral, coerção ou simples linguagem de propriedade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição e o paralelismo foram mantidos para preservar a reciprocidade enfática do original.
