  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the slave who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s slave.
translation:
  language: pt
  text: Pois o escravo que foi chamado no Senhor é uma pessoa liberta pertencente ao Senhor; do mesmo modo, a pessoa livre que foi chamada é escrava do Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição de escravidão central ao paradoxo de Paulo, sem suavizá-la como “servo”.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação paulina, que pode indicar esfera ou união com o Senhor, sem explicá-la em excesso.
- source_word: κληθεὶς
  choice: quando foi chamado
  rationale: Expressa naturalmente em português o particípio aoristo passivo e conserva a ideia do chamado recebido.
- source_word: ἀπελεύθερος
  choice: liberto
  rationale: Designa especificamente alguém libertado da escravidão e mantém o contraste social e jurídico com “escravo”.
- source_word: κυρίου
  choice: do Senhor
  rationale: 'Conserva a relação genitiva, incluindo a possível nuance de pertencimento: o liberto pertence ao Senhor.'
- source_word: ὁμοίως
  choice: do mesmo modo
  rationale: Reproduz com naturalidade o paralelismo entre as duas metades do versículo.
- source_word: ἐλεύθερος
  choice: livre
  rationale: Indica a condição social oposta à de escravo sem acrescentar ao texto um substantivo marcado por gênero.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título, “Messias”, e conserva a relação de pertencimento expressa pelo genitivo.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título cristológico de peso teológico, mais amplo que a simples relação social expressa por “senhor” ou “amo”.
theological_decisions:
- issue: O paradoxo entre condição social e pertencimento espiritual
  choice: 'Manter a inversão incisiva: o escravo chamado é liberto do Senhor, e o livre chamado é escravo do Messias.'
  alternative: Suavizar “escravo” para “servo” ou generalizar “liberto” como “pessoa livre”.
  rationale: A força do argumento depende do contraste entre escravidão, libertação e novo pertencimento; termos mais brandos apagariam parte dessa tensão.
- issue: Sentido do genitivo em “liberto do Senhor”
  choice: Preservar a expressão compacta e ambígua “liberto do Senhor”.
  alternative: Explicitar como “alguém libertado pelo Senhor” ou “o liberto pertencente ao Senhor”.
  rationale: O grego κυρίου pode ser entendido em relação de pertencimento e também suscitar a ideia de libertação efetuada pelo Senhor; a tradução não deve resolver silenciosamente essa nuance.
- issue: Tradução do título Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Neste contexto, Χριστός conserva valor titular; “Messias” torna esse valor explícito sem importar uma interpretação denominacional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aquele que era... quando foi chamado” torna explícita a condição existente no momento do chamado e preserva o paralelismo. “Liberto” mantém a precisão histórica sem recorrer ao pouco corrente “liberto do Senhor” como título técnico não explicado; a nota registra a ambiguidade do genitivo.
