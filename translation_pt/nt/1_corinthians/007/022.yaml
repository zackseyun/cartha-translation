revisions:
- from: Pois aquele que era escravo quando foi chamado no Senhor é liberto do Senhor[a]; do mesmo modo, aquele que era livre quando foi chamado é escravo do Messias.
  to: Pois o escravo que foi chamado no Senhor é uma pessoa liberta pertencente ao Senhor; do mesmo modo, a pessoa livre que foi chamada é escrava do Messias.
  rationale: A revisão substitui a expressão potencialmente enganosa «liberto do Senhor» por uma formulação que torna clara a relação de pertencimento sem transformar o genitivo em uma afirmação inequívoca de agente. Também simplifica as duas orações relativas, mantendo o paralelismo e o sentido do particípio passivo «foi chamado».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:25:55Z'
review_pass:
  verdict: revise
  source_fidelity: O rascunho preserva adequadamente o paralelismo, o chamado «no Senhor», o contraste social entre escravo e livre e o título «Messias». Contudo, «liberto do Senhor» é ambíguo em português de modo problemático, pois pode ser entendido como alguém libertado do Senhor, invertendo a relação expressa pelo genitivo grego.
  naturalness: «Aquele que era escravo quando foi chamado» é compreensível, mas é mais pesado e menos próximo da construção participial do que «o escravo que foi chamado». A formulação revista é atual, clara e mantém o registro digno.
  terminology: «Escravo», «Senhor» e «Messias» são escolhas adequadas. Para ἀπελεύθερος κυρίου, «uma pessoa liberta pertencente ao Senhor» comunica tanto a condição de pessoa libertada quanto a relação de pertencimento, sem sugerir que foi libertada para longe do Senhor.
  issues:
  - severity: medium
    issue: «liberto do Senhor» permite uma leitura invertida do genitivo
    rationale: Em português, «liberto de/do Senhor» pode significar «libertado do Senhor», enquanto ἀπελεύθερος κυρίου caracteriza o escravo chamado como pessoa liberta que pertence ao Senhor. A nota reconhece a ambiguidade, mas não elimina o risco no texto principal.
  - severity: low
    issue: A expressão temporal «era ... quando foi chamado» é desnecessariamente perifrástica
    rationale: O particípio κληθείς pode ser traduzido de modo mais direto por «que foi chamado», preservando a relação entre a condição social e o chamado sem acrescentar uma construção mais pesada.
  revised_text: Pois o escravo que foi chamado no Senhor é uma pessoa liberta pertencente ao Senhor; do mesmo modo, a pessoa livre que foi chamada é escrava do Messias.
  revised_footnotes:
  - marker: a
    text: Ou “um liberto do Senhor”. O termo grego designa especificamente uma pessoa que foi libertada da escravidão. A expressão indica sua relação de pertencimento ao Senhor.
    reason: lexical_alternative
  revision_rationale: A revisão substitui a expressão potencialmente enganosa «liberto do Senhor» por uma formulação que torna clara a relação de pertencimento sem transformar o genitivo em uma afirmação inequívoca de agente. Também simplifica as duas orações relativas, mantendo o paralelismo e o sentido do particípio passivo «foi chamado».
