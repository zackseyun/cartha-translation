  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: pt
  text: Mas, mesmo que você se casar, não pecou; e, se a virgem se casar, não pecou. No entanto, essas pessoas terão aflição na carne[a], mas eu quero poupar vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dificuldades na vida terrena” ou “sofrimento no corpo”. A expressão provavelmente se refere às dificuldades terrenas ou corporais associadas ao casamento, não especificamente à “natureza pecaminosa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mas poupo vocês” ou “mas estou poupando vocês”. Paulo indica seu propósito pastoral ao adverti-los sobre essas dificuldades.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: você se case
  rationale: Com ἐάν, o aoristo do subjuntivo exprime uma condição futura simples. Em português, “se você se case” preserva naturalmente essa força sem sugerir obrigação.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: não pecou
  rationale: O aoristo indicativo nega que o ato de casar constitua pecado. O pretérito perfeito é direto e natural em português.
- source_word: ἡ παρθένος
  choice: a virgem
  rationale: Preserva o sentido lexical e a formulação específica do grego, sem generalizar para “mulher solteira” nem acrescentar a ideia de noivado.
- source_word: θλῖψιν
  choice: aflição
  rationale: “Aflição” comunica pressão, dificuldade ou sofrimento sem impor necessariamente um sentido escatológico, como “tribulação” poderia sugerir a alguns leitores.
- source_word: τῇ σαρκὶ
  choice: na carne
  rationale: Mantém a expressão concreta e ambígua de Paulo. No contexto, refere-se provavelmente às dificuldades da existência terrena e corporal, não à “natureza pecaminosa”.
- source_word: οἱ τοιοῦτοι
  choice: os que fazem isso
  rationale: Retoma de modo natural em português as pessoas que se casam, sem estreitar indevidamente a referência.
- source_word: φείδομαι
  choice: quero poupar vocês
  rationale: Expressa com naturalidade a intenção pastoral de Paulo. A forma grega também admite a tradução mais direta “poupo vocês”.
theological_decisions:
- issue: Sentido de σάρξ em τῇ σαρκί
  choice: “na carne”, entendido como na vida terrena e corporal
  alternative: “na natureza pecaminosa” ou “nesta vida”
  rationale: O contexto trata das dificuldades ligadas ao casamento, não de uma afirmação sobre depravação moral. A tradução literal preserva a tensão, e a nota esclarece o provável sentido sem o tornar exclusivo.
- issue: Força de φείδομαι
  choice: “quero poupar vocês”
  alternative: “poupo vocês” ou “estou poupando vocês”
  rationale: A formulação escolhida torna claro o propósito pastoral da advertência, enquanto a nota registra a possibilidade de uma tradução mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” corresponde ao primeiro destinatário da condição; “vocês” preserva o plural de ὑμῶν no encerramento. As notas mantêm as ambiguidades lexicais relevantes.
