source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: pt
  text: Mas ela é mais feliz se permanecer como está[a], segundo o meu parecer; e penso que eu também tenho o Espírito de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais bem-aventurada”. O comparativo grego μακαριωτέρα pode indicar tanto maior felicidade quanto uma condição de maior bem-aventurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: mais feliz
  rationale: O comparativo de μακάριος pode indicar maior felicidade ou maior bem-aventurança. Neste conselho pastoral, “mais feliz” comunica de modo natural a comparação prática sem excluir a nuance indicada em nota.
- source_word: ἐὰν οὕτως μείνῃ
  choice: se permanecer como está
  rationale: μένω significa permanecer ou ficar, e οὕτως retoma a condição de viúva mencionada no contexto. A formulação é idiomática e evita explicitar além do texto.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: segundo o meu parecer
  rationale: γνώμη designa aqui uma opinião ponderada ou juízo. “Parecer” mantém o tom de conselho refletido e distingue esta declaração de uma ordem direta do Senhor.
- source_word: δοκῶ
  choice: penso
  rationale: Preserva a modéstia retórica da afirmação sem transformá-la em dúvida real.
- source_word: κἀγὼ
  choice: eu também
  rationale: Representa o valor aditivo da crase κἀγώ e sua possível referência implícita a outras pessoas que reivindicavam autoridade espiritual.
- source_word: πνεῦμα θεοῦ
  choice: o Espírito de Deus
  rationale: No uso paulino e neste contexto, a expressão se refere mais naturalmente ao Espírito Santo, não apenas a uma disposição espiritual.
- source_word: ἔχειν
  choice: tenho
  rationale: Tradução direta e natural do infinitivo ἔχειν como complemento de δοκῶ, ajustada à sintaxe portuguesa.
theological_decisions:
- issue: Referente de πνεῦμα θεοῦ
  choice: “o Espírito de Deus”, entendido como o Espírito Santo
  alternative: “um espírito vindo de Deus” ou “discernimento espiritual divino”
  rationale: Em Paulo, πνεῦμα θεοῦ normalmente designa o Espírito de Deus. A tradução preserva a reivindicação de orientação espiritual sem converter o conselho em mandamento direto do Senhor.
- issue: Força de δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: Afirmação genuína, formulada com modéstia retórica, de autoridade guiada pelo Espírito
  alternative: Incerteza real de Paulo quanto a ter o Espírito, ou réplica explicitamente irônica
  rationale: “Penso” conserva a forma moderada da expressão grega, mas o contexto não exige que ela seja entendida como dúvida. Tampouco se explicita ironia que o texto apenas pode sugerir.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ela” mantém o referente feminino do contexto; “parecer” evita tanto a casualidade de “opinião” quanto um tom judicial excessivo. O ponto e vírgula conserva a progressão da frase sem tornar a sintaxe artificial.
