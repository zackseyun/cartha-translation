id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: pt
  text: E ele está dividido. A mulher não casada[a], isto é, a virgem, preocupa-se com as coisas do Senhor, para ser santa tanto no corpo como no espírito. Mas a mulher casada preocupa-se com as coisas do mundo, em como agradar ao marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A mulher não casada e a virgem preocupam-se com as coisas do Senhor”. O grego pode ser entendido como uma lista de duas categorias, em vez de identificar a mulher não casada com a virgem.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: está dividida
  rationale: Preserva o perfeito passivo/resultativo e a imagem de interesses divididos, dando continuidade ao pensamento do versículo anterior sem interpretar excessivamente como mera distração.
- source_word: γυνὴ ἡ ἄγαμος
  choice: a mulher não casada
  rationale: γυνή pode significar mulher ou esposa; no contraste com a mulher casada, a referência mais clara é à mulher que não está casada. A formulação também evita confundir necessariamente essa condição com nunca ter sido casada.
- source_word: παρθένος
  choice: a virgem
  rationale: Mantém a especificidade lexical de παρθένος, em vez de reduzi-la a um termo mais geral como jovem ou donzela.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: a mulher não casada, isto é, a virgem
  rationale: A construção grega é compacta e pode ser entendida em aposição ou como duas categorias coordenadas. A aposição combina naturalmente com o verbo singular μεριμνᾷ; a leitura coordenada permanece registrada em nota.
- source_word: μεριμνᾷ
  choice: preocupa-se com
  rationale: Neste contexto, expressa atenção e interesse concentrados, não necessariamente ansiedade pecaminosa. A escolha é natural em português e funciona nos dois lados do contraste.
- source_word: τὰ τοῦ κυρίου
  choice: as coisas do Senhor
  rationale: Conserva a estrutura concreta e repetida do grego, bem como o contraste com 'as coisas do mundo'.
- source_word: ἵνα ᾖ ἁγία
  choice: para ser santa
  rationale: Expressa de modo natural a finalidade indicada por ἵνα com o subjuntivo, preservando explicitamente a linguagem de santidade.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: tanto no corpo como no espírito
  rationale: Representa os dativos como esferas ou aspectos da santidade e reproduz naturalmente a correlação καὶ... καὶ, sem impor uma teoria antropológica.
- source_word: ἡ δὲ γαμήσασα
  choice: a mulher casada
  rationale: O particípio aoristo substantivado descreve a mulher em condição matrimonial; esta é a forma idiomática e paralela em português.
- source_word: τὰ τοῦ κόσμου
  choice: as coisas do mundo
  rationale: Espelha 'as coisas do Senhor' e evita atribuir à expressão um tom pejorativo mais forte do que o contexto exige.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: em como agradar ao marido
  rationale: No contexto matrimonial, ἀνήρ significa marido. 'Em como agradar' integra naturalmente a expressão à ideia de preocupação.
theological_decisions:
- issue: Se 'a mulher não casada' e 'a virgem' designam duas categorias ou se a segunda expressão esclarece a primeira
  choice: 'Leitura apositiva no texto: ''a mulher não casada, isto é, a virgem'''
  alternative: 'Leitura coordenada: ''a mulher não casada e a virgem'''
  rationale: A sintaxe é comprimida, mas o verbo singular favorece um sujeito unificado. Como a leitura coordenada continua gramaticalmente possível e pode distinguir categorias, ela é preservada em nota, sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Não casada' foi preferido a 'solteira' para indicar o estado atual sem implicar necessariamente que a mulher nunca tenha sido casada. Mantiveram-se os paralelos 'coisas do Senhor/coisas do mundo' e 'corpo/espírito'.
