source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: pt
  text: Mas o homem casado se preocupa com as coisas do mundo[a], em como agradar à esposa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os assuntos deste mundo” ou “as questões da vida no mundo”.
    reason: Alternativas lexicais para τὰ τοῦ κόσμου que esclarecem seu sentido como assuntos da vida comum, sem impor conotação moral negativa.
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: o homem casado
  rationale: O particípio aoristo substantivado refere-se ao homem que se casou, em contraste com o homem não casado no contexto. “O homem casado” é natural em português e preserva o masculino singular.
- source_word: μεριμνᾷ
  choice: se preocupa com
  rationale: O verbo pode indicar preocupação, cuidado ou ansiedade. Aqui descreve as atenções próprias da vida conjugal, sem necessariamente sugerir ansiedade pecaminosa.
- source_word: τὰ τοῦ κόσμου
  choice: as coisas do mundo
  rationale: A expressão designa assuntos pertencentes à vida comum neste mundo. A tradução preserva a forma concreta e plural do grego sem atribuir, por si só, um sentido moralmente negativo a κόσμος.
- source_word: πῶς ἀρέσῃ
  choice: em como agradar
  rationale: 'A construção introduz o conteúdo da preocupação: como agradar à esposa. “Em como agradar” conecta-se naturalmente a “se preocupa” e mantém a ideia deliberativa do subjuntivo.'
- source_word: τῇ γυναικί
  choice: à esposa
  rationale: No contexto matrimonial, γυνή significa claramente “esposa”. O vínculo possessivo está implícito na situação, embora não precise ser explicitado em português.
theological_decisions:
- issue: Se κόσμος deve receber aqui sentido moralmente negativo
  choice: Traduzir de modo neutro como “as coisas do mundo”
  alternative: Traduzir pejorativamente como “coisas mundanas”
  rationale: No contexto, Paulo contrasta as responsabilidades práticas do casamento com a dedicação sem distrações ao Senhor; não condena necessariamente o casamento nem as responsabilidades comuns. A formulação neutra preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se preocupa com” é corrente e não exagera a ideia de ansiedade; “esposa” torna explícito o sentido conjugal de γυνή. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
