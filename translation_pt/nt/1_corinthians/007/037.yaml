reference: 1 Corinthians 7:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: pt
  text: Mas aquele que permanece firme em seu coração, não estando sob necessidade[a], mas tendo autoridade sobre a própria vontade, e decidiu isso em seu próprio coração — conservar a sua virgem[b] — fará bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem estar sob coação”.
    reason: lexical_alternative
  - marker: b
    text: “A sua virgem” pode se referir à filha virgem do homem ou à sua noiva/prometida; o sentido exato da expressão grega é debatido.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: permanece firme
  rationale: Expressa a resolução estável e já estabelecida indicada pelo perfeito de ἵστημι em combinação com ἑδραῖος, em linguagem portuguesa natural.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: em seu coração
  rationale: Preserva a imagem bíblica do coração como centro da decisão e acompanha a repetição intencional da expressão no versículo.
- source_word: μὴ ἔχων ἀνάγκην
  choice: não tendo nenhuma necessidade
  rationale: Mantém o sentido básico de ἀνάγκη sem decidir se a necessidade seria circunstancial, externa ou coerciva; a alternativa idiomática é registrada em nota.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: tendo autoridade sobre a própria vontade
  rationale: Conserva tanto a ideia de autoridade ou domínio em ἐξουσία quanto a de vontade ou intenção em θέλημα, sem reduzir a frase meramente a desejo sexual.
- source_word: κέκρικεν
  choice: decidiu
  rationale: O perfeito indica uma decisão tomada e estabelecida; “decidiu” é claro e corrente em português.
- source_word: τηρεῖν
  choice: conservar
  rationale: τηρέω significa guardar, conservar ou manter. “Conservar” preserva o caráter não explícito do complemento sem acrescentar “solteira”, ausente do grego.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: a sua virgem
  rationale: A formulação deliberadamente literal preserva a ambiguidade do referente de παρθένος, que pode ser entendida como filha virgem ou noiva/prometida virgem.
- source_word: καλῶς ποιήσει
  choice: fará bem
  rationale: Reproduz de modo natural o idioma grego que avalia a conduta como boa ou apropriada.
theological_decisions:
- issue: Referente de τὴν ἑαυτοῦ παρθένον (“a sua virgem”)
  choice: Manter no texto principal a expressão ambígua “a sua virgem”.
  alternative: Especificar “sua filha virgem” ou “sua noiva/prometida virgem”.
  rationale: O grego não identifica inequivocamente a relação entre o homem e a virgem. Explicitar filha ou noiva resolveria uma questão interpretativa genuinamente debatida; por isso, as possibilidades ficam na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura acompanha de perto a longa frase argumentativa de Paulo, mas usa pontuação para tornar a decisão central clara. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
