  to: Mas aquele que permanece firme em seu coração, não estando sob necessidade[a], mas tendo autoridade sobre a própria vontade, e decidiu isso em seu próprio coração — conservar a sua virgem[b] — fará bem.
  rationale: A revisão substitui uma construção portuguesa menos idiomática por “não estando sob necessidade”, preservando a indeterminação semântica de ἀνάγκη e mantendo a alternativa “sob coação” na nota. Também ajusta a redação da nota b para maior naturalidade, sem alterar as duas leituras historicamente debatidas. Não se acrescenta “solteira”, pois isso não está expresso no grego.
