  terminology: “Permanece firme”, “autoridade sobre a própria vontade”, “conservar a sua virgem” e “fará bem” são escolhas defensáveis. A formulação principal “a sua virgem” preserva, ainda que de modo incomum, a ambiguidade exegética que não deve ser resolvida no texto. A nota deve expressar as alternativas de maneira mais natural em português.
