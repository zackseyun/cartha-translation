source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: pt
  text: Mas, se ela vier a se separar[a], permaneça sem se casar ou reconcilie-se com o marido; e o marido não deve se divorciar[b] da esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, ainda que ela se separe”. O grego pode ter aqui uma leve força concessiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “mandar embora a esposa”. Neste contexto conjugal, o verbo costuma referir-se ao divórcio ou repúdio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ χωρισθῇ
  choice: Mas, se ela vier a se separar
  rationale: A formulação preserva a condição, a referência feminina indicada pelo contexto e o sentido de separação conjugal, sem equiparar automaticamente χωρίζω a divórcio formal. A possível força concessiva de καί é registrada em nota.
- source_word: μενέτω ἄγαμος
  choice: permaneça sem se casar
  rationale: Expressa com clareza a ordem de continuar em condição não casada. Em português, “sem se casar” evita a possível impressão de que “solteira” descreva apenas quem nunca se casou.
- source_word: τῷ ἀνδρὶ καταλλαγήτω
  choice: reconcilie-se com o marido
  rationale: Mantém o sentido relacional do imperativo passivo de καταλλάσσω e traduz ἀνήρ segundo o contexto conjugal.
- source_word: ἄνδρα γυναῖκα μὴ ἀφιέναι
  choice: o marido não deve se divorciar da esposa
  rationale: Torna natural em português a proibição dirigida ao marido. No contexto matrimonial, ἀφίημι pode indicar despedir a esposa ou divorciar-se dela; “divorciar-se” comunica claramente a força conjugal, enquanto a alternativa mais literal consta em nota.
theological_decisions:
- issue: Se χωρισθῇ e ἀφιέναι devem receber o mesmo termo em português
  choice: Traduzir χωρισθῇ por “se separar” e ἀφιέναι por “se divorciar”
  alternative: Traduzir ambos por “divorciar-se” ou ambos por “separar-se/deixar”
  rationale: Paulo emprega verbos diferentes. Preservar essa distinção evita impor a χωρίζω uma categoria jurídica mais específica do que o grego exige, ao mesmo tempo que reconhece a força de repúdio ou divórcio de ἀφίημι neste contexto.
- issue: Como representar o sujeito feminino implícito da primeira oração
  choice: Empregar “ela”
  alternative: Repetir “a esposa”
  rationale: O contexto imediato trata primeiro da esposa, e o português requer que o sujeito seja recuperável com clareza. “Ela” preserva a estrutura do discurso sem acrescentar interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vier a se separar” soa natural e mantém o caráter eventual da condição; “permaneça sem se casar” comunica com precisão o estado ordenado sem usar “solteira”, que poderia sugerir alguém que nunca se casou.
