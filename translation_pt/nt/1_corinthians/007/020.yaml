  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: pt
  text: Cada um permaneça na vocação em que foi chamado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na condição», «na situação» ou «na posição na vida». O grego diz literalmente «vocação», em correspondência com «foi chamado» na mesma frase.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Cada um
  rationale: Preserva o valor distributivo singular e aplica a instrução individualmente, em português natural.
- source_word: κλήσει
  choice: vocação
  rationale: Mantém o sentido literal de κλῆσις e o jogo verbal com ἐκλήθη, sem reduzir o termo apenas à condição social ou circunstância de vida.
- source_word: ᾗ ἐκλήθη
  choice: em que foi chamado
  rationale: Conserva a construção relativa e a repetição conceitual da preposição ἐν; a voz passiva permite que o agente divino permaneça implícito, como no grego.
- source_word: ἐν ταύτῃ
  choice: na vocação em que
  rationale: A formulação portuguesa integra naturalmente o demonstrativo retomando a vocação já mencionada, sem a repetição pouco idiomática de «nesta».
- source_word: μενέτω
  choice: permaneça
  rationale: O presente imperativo é expresso por um subjuntivo de valor imperativo, forma atual, clara e digna em português.
theological_decisions:
- issue: Sentido de κλῆσις no contexto
  choice: Manter «vocação» no texto principal
  alternative: condição; situação; posição na vida
  rationale: O contexto trata de circunstâncias como circuncisão e escravidão, mas Paulo associa deliberadamente κλήσει a ἐκλήθη. «Vocação» preserva a tensão entre o chamado divino e a situação em que a pessoa se encontrava.
- issue: Gênero do singular representativo
  choice: Usar «cada um», sem pronome masculino adicional
  alternative: cada pessoa; todos
  rationale: «Cada um» corresponde ao masculino singular representativo do grego e é uma formulação portuguesa natural. A flexão de «chamado» também preserva formalmente o singular masculino representativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção concisa acompanha a ordem e a força imperativa do grego, preservando seu jogo verbal e sua ambiguidade contextual.
