id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: pt
  text: Irmãos[b], cada um permaneça diante de Deus[a] na condição em que foi chamado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com Deus” ou “na presença de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Irmãos” dirige-se à congregação inteira, incluindo as mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva o singular distributivo e aplica a orientação individualmente a cada integrante da comunidade.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: na condição em que
  rationale: Expressa de modo natural a circunstância social ou situação de vida em vista no contexto, sem sugerir mero lugar físico.
- source_word: ἐκλήθη
  choice: foi chamado
  rationale: Mantém o passivo do grego e não explicita o agente, embora o contexto paulino aponte para o chamado de Deus.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Reproduz o vocativo masculino plural do texto-fonte; a nota esclarece seu uso como forma de tratamento da comunidade inteira.
- source_word: μενέτω
  choice: permaneça
  rationale: O imperativo comunica continuidade na condição presente e mantém a repetição temática do capítulo.
- source_word: παρὰ θεῷ
  choice: diante de Deus
  rationale: A expressão παρά com dativo pode indicar proximidade ou relação. Em português, “diante de Deus” comunica naturalmente uma vida conduzida na presença e perante Deus, preservando na nota a alternativa “com Deus”.
theological_decisions:
- issue: Explicitar ou não a atuação de Deus em ἐκλήθη
  choice: Manter “foi chamado” sem acrescentar “por Deus”
  alternative: “foi chamado por Deus”
  rationale: O contexto torna a atuação divina muito provável, mas o grego deixa o agente implícito; a tradução preserva essa forma.
- issue: Sentido de παρὰ θεῷ
  choice: “diante de Deus”
  alternative: “com Deus” ou “na presença de Deus”
  rationale: A frase grega é concisa e admite nuances de proximidade, relação e presença. A tradução principal evita reduzir a expressão à companhia, enquanto a nota conserva as alternativas legítimas.
- issue: Alcance de ἀδελφοί numa congregação composta por homens e mulheres
  choice: “Irmãos”, com nota explicativa
  alternative: “irmãos e irmãs”
  rationale: A forma lexical masculina do original é mantida, sem ocultar que, nesse contexto, o tratamento abrange toda a congregação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português, mantendo o vínculo entre a condição do chamado e a ordem de permanecer. Todos os marcadores aparecem no texto principal.
