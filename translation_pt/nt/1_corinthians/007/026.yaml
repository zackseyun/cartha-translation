id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: pt
  text: 'Portanto, considero que isto é bom por causa da aflição presente[a]: é bom que o homem permaneça como está[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da necessidade presente” ou “por causa da crise que se apresenta”.
    reason: lexical_alternative
  - marker: b
    text: Ou “que a pessoa permaneça como está”; o termo grego traduzido como “homem” também pode ser usado em sentido genérico.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “estar assim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: considero
  rationale: Expressa o juízo ponderado de Paulo em primeira pessoa, sem transformar seu conselho em ordem absoluta.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a inferência em relação à discussão anterior.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: isto é bom
  rationale: Converte naturalmente a construção infinitiva grega em oração finita e mantém καλόν no sentido contextual de bom ou apropriado.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: por causa da aflição presente
  rationale: ἀνάγκη pode indicar necessidade, pressão ou aflição; aqui sugere uma circunstância opressiva, enquanto ἐνεστῶσαν a apresenta como presente, embora a expressão admita outras nuances.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural em português o conteúdo explicativo do juízo de Paulo, sem forçar uma relação causal.
- source_word: καλὸν
  choice: é bom
  rationale: Mantém a repetição lexical de καλόν e evita especificar além do texto se é conveniente ou vantajoso.
- source_word: ἀνθρώπῳ
  choice: o homem
  rationale: Preserva a forma masculina singular da fonte; uma nota registra que ἄνθρωπος também pode ter sentido genérico.
- source_word: τὸ οὕτως εἶναι
  choice: permaneça como está
  rationale: Expressa em português idiomático o sentido contextual de continuar na condição em que se encontra, embora literalmente seja 'estar assim'.
theological_decisions:
- issue: Natureza da declaração de Paulo
  choice: Apresentá-la como juízo pastoral relacionado à aflição presente.
  alternative: Entendê-la como preferência universal e atemporal contrária ao casamento.
  rationale: A primeira pessoa 'considero' e a razão circunstancial 'por causa da aflição presente' apontam para conselho situado; a tradução, porém, não acrescenta uma explicação doutrinária ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Considero” comunica melhor um juízo ponderado do que o mais coloquial “acho”. A pontuação evita a repetição pesada de “que” sem eliminar a possível função explicativa de ὅτι.
