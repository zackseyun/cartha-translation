source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: pt
  text: e os que choram, como se não chorassem; os que se alegram, como se não se alegrassem; e os que compram, como se não possuíssem,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego repete literalmente uma construção concisa: “como não chorando [...] como não se alegrando [...] como não possuindo”. Ela indica uma maneira de viver, não a negação de que essas experiências realmente ocorram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: os que choram
  rationale: O particípio presente substantivado indica “os que choram”. “Choram” é direto, natural e não restringe o sentido ao luto.
- source_word: ὡς μὴ κλαίοντες
  choice: como se não chorassem
  rationale: A construção ὡς μή com particípio descreve a maneira ou postura com que se vive a experiência, sem negar que o choro realmente ocorra. A formulação é idiomática em português e preserva a concisão.
- source_word: χαίροντες
  choice: os que se alegram
  rationale: χαίρω significa aqui alegrar-se. A forma pronominal é natural em português contemporâneo e mantém o contraste com “choram”.
- source_word: ὡς μὴ χαίροντες
  choice: como se não se alegrassem
  rationale: Reproduz a mesma construção e conserva o paralelismo retórico da passagem.
- source_word: ἀγοράζοντες
  choice: os que compram
  rationale: É o equivalente moderno mais direto para a atividade comum de adquirir algo mediante compra.
- source_word: κατέχοντες
  choice: possuíssem
  rationale: No contraste com comprar, κατέχω aponta para ter ou manter algo como posse. “Possuíssem” expressa essa nuance sem reduzi-la ao título jurídico de propriedade.
- source_word: καὶ
  choice: e
  rationale: O primeiro e o último καί são mantidos para ligar este versículo à sequência e preservar seu caráter cumulativo; no membro central, o ponto e vírgula torna desnecessária a repetição em português sem apagar o paralelismo.
theological_decisions:
- issue: Força interpretativa das construções repetidas ὡς μή
  choice: Entendê-las como orientação quanto à postura diante do choro, da alegria e das posses, sem negar a realidade ou a legitimidade dessas experiências.
  alternative: Entendê-las como proibição ascética dessas experiências ou como simples descrição psicológica sem dimensão escatológica.
  rationale: O contexto afirma que a forma deste mundo está passando. ὡς μή com particípio indica modo ou atitude, não negação absoluta; a tradução preserva essa tensão sem transformar o conselho em proibição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Como se não...” oferece naturalidade sem perder o paralelismo e a tensão do original. O marcador [a] aparece no texto principal.
