    issue: Construção pouco natural de «privem um ao outro»
    rationale: Em português, «privar» geralmente requer complemento introduzido por «de». A formulação recíproca «não se privem um do outro» transmite naturalmente o sentido contextual de não reter do cônjuge o que lhe é devido, sem explicitar além do grego.
