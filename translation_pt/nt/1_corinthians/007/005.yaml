id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: pt
  text: Não se privem um do outro, a não ser talvez por mútuo consentimento e por algum tempo, para se dedicarem à oração. Depois, voltem a estar juntos[a], para que Satanás não os tente por causa da falta de domínio próprio de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «estejam juntos novamente»; no contexto, refere-se à retomada da vida conjugal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: privem
  rationale: No contexto conjugal, o verbo indica privar o cônjuge do que lhe é devido. “Privar” conserva a força ética sem sugerir necessariamente fraude comercial.
- source_word: ἀλλήλους
  choice: um ao outro
  rationale: Expressa com naturalidade a reciprocidade da instrução dirigida aos dois cônjuges.
- source_word: εἰ μήτι ἂν
  choice: a não ser talvez
  rationale: Mantém tanto a exceção quanto o tom qualificativo ou cauteloso da expressão grega.
- source_word: ἐκ συμφώνου
  choice: por mútuo consentimento
  rationale: Torna explícita a concordância bilateral já contida na expressão, sem atribuir a decisão a apenas um dos cônjuges.
- source_word: πρὸς καιρόν
  choice: por algum tempo
  rationale: Indica uma duração limitada e temporária em português corrente.
- source_word: σχολάσητε
  choice: se dedicarem
  rationale: Neste contexto, o verbo significa ficar livre para ocupar-se intencionalmente de algo; “dedicar-se” comunica isso com clareza.
- source_word: τῇ προσευχῇ
  choice: à oração
  rationale: Preserva o singular grego, que aqui designa a prática da oração em sentido geral.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: voltem a estar juntos
  rationale: Conserva a formulação indireta e recatada do grego, ao mesmo tempo que permite ao contexto conjugal indicar a retomada da união marital.
- source_word: πειράζῃ
  choice: tente
  rationale: Com Satanás como agente, o sentido é induzir ao pecado, não simplesmente pôr à prova.
- source_word: Σατανᾶς
  choice: Satanás
  rationale: É a forma tradicional portuguesa do nome pessoal e preserva a referência a um agente pessoal.
- source_word: ἀκρασίαν
  choice: falta de domínio próprio
  rationale: Expressa a incapacidade de exercer autocontrole, especialmente pertinente ao contexto sexual, em linguagem moderna e clara.
theological_decisions:
- issue: Se πάλιν ἐπὶ τὸ αὐτὸ ἦτε deve explicitar a retomada das relações sexuais
  choice: “voltem a estar juntos”, deixando a implicação conjugal e sexual no contexto
  alternative: “voltem a ter relações sexuais”
  rationale: A expressão aponta para a retomada da união conjugal, provavelmente incluindo relações sexuais, mas o próprio texto a formula com discrição. A tradução preserva essa modéstia e a ambiguidade relativa.
- issue: Se ὁ Σατανᾶς deve ser traduzido como nome pessoal ou como designação genérica
  choice: “Satanás”
  alternative: “o adversário”
  rationale: Neste uso paulino, a expressão se refere ao ser pessoal chamado Satanás; a forma nominal portuguesa preserva essa referência sem generalizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” no complemento final para evitar a ambiguidade de “sua”, enquanto “um ao outro” mantém a mutualidade. A redação preserva o caráter temporário e consensual da abstinência e a discrição do original quanto à retomada da intimidade conjugal.
