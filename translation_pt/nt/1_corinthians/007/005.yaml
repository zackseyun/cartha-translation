  source_fidelity: A tradução preserva a exceção qualificada (εἰ μήτι ἄν), o consentimento mútuo, a duração limitada, a dedicação à oração, a retomada da união e a finalidade de evitar a tentação por falta de autocontrole. Contudo, «Não privem um ao outro» soa sintaticamente incompleto em português, pois «privar» normalmente pede a construção «privar alguém de algo».
  naturalness: «Não se privem um do outro» é uma construção recíproca mais idiomática e clara no português moderno. O restante tem registro sóbrio e compreensível internacionalmente, com boa legibilidade brasileira.
  terminology: «Mútuo consentimento», «oração», «Satanás» e «falta de domínio próprio» são escolhas adequadas. A nota deve conservar a discrição do eufemismo grego e não afirmar de forma mais explícita do que o texto que se trata de relações íntimas.
