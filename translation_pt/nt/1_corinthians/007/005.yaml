    rationale: πάλιν ἐπὶ τὸ αὐτὸ ἦτε aponta, no contexto, para a retomada da vida conjugal, provavelmente com a implicação sexual; porém o grego emprega linguagem indireta. A nota deve refletir essa discrição.
