base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: pt
  text: Mas, se não conseguem se controlar, que se casem, pois é melhor casar do que arder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, provavelmente se refere a arder de desejo sexual. O grego diz simplesmente “arder”.
    reason: Preserva a formulação implícita do original e indica, sem apresentá-lo como explícito, o sentido mais provável no contexto.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado com a afirmação anterior e soa natural em português.
- source_word: οὐκ ἐγκρατεύονται
  choice: não conseguem se controlar
  rationale: Expressa de modo idiomático o exercício de domínio próprio no contexto sexual, sem transformar a condição em uma característica permanente.
- source_word: γαμησάτωσαν
  choice: que se casem
  rationale: Preserva a força do imperativo aoristo na terceira pessoa do plural e é uma formulação natural em português.
- source_word: κρεῖττον
  choice: melhor
  rationale: Equivalente comparativo direto e corrente.
- source_word: γαμῆσαι
  choice: casar
  rationale: Reproduz diretamente o infinitivo e mantém o paralelismo com πυροῦσθαι.
- source_word: πυροῦσθαι
  choice: arder
  rationale: Mantém a metáfora concisa e a relativa implicitude do grego; o contexto aponta fortemente para desejo sexual, esclarecido na nota.
theological_decisions:
- issue: Sentido de πυροῦσθαι no contexto
  choice: arder, com provável referência ao desejo sexual
  alternative: arder no juízo ou arder em sentido não especificado
  rationale: A discussão imediata sobre continência e casamento favorece fortemente o desejo sexual, mas o texto grego não acrescenta um complemento explícito; por isso, a metáfora permanece no texto e a interpretação contextual é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Que se casem” conserva o tom de instrução; “não conseguem se controlar” é corrente sem ser coloquial demais. O marcador [a] aparece após “arder”, termo ao qual a nota se refere.
