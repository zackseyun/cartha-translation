source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: pt
  text: Mas, se alguém pensa que está agindo de modo impróprio para com a sua virgem[a], caso ela já tenha passado da juventude e assim deva ser, faça o que deseja; não está pecando. Que se casem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para com a sua noiva/prometida virgem”; tradicionalmente, também se entende “para com a sua filha virgem”. O grego é ambíguo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: agindo de modo impróprio
  rationale: Expressa uma conduta inconveniente ou indecorosa sem intensificar o sentido para uma indecência necessariamente sexual.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: para com a sua virgem
  rationale: Mantém παρθένος como “virgem” e preserva no texto principal a ambiguidade de αὐτοῦ entre noiva prometida e filha virgem sob os cuidados do homem.
- source_word: ὑπέρακμος
  choice: já tenha passado da juventude
  rationale: Comunica que ela está além do auge juvenil, sem fixar uma idade moderna precisa nem acrescentar explicitamente “idade de casar”.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: e assim deva acontecer
  rationale: Preserva a generalidade de γίνεσθαι e a ideia de necessidade ou obrigação em ὀφείλει, sem determinar a causa dessa necessidade.
- source_word: ὃ θέλει ποιείτω
  choice: faça o que deseja
  rationale: Imperativo permissivo natural e digno em português, mantendo a liberdade de ação expressa no grego.
- source_word: οὐχ ἁμαρτάνει
  choice: não está pecando
  rationale: Mantém o aspecto verbal presente e declara claramente que a ação permitida não constitui pecado.
- source_word: γαμείτωσαν
  choice: Que se casem
  rationale: Reproduz naturalmente o imperativo na terceira pessoa do plural e identifica ambos como participantes do casamento.
theological_decisions:
- issue: Identidade de “a sua virgem” (παρθένον αὐτοῦ)
  choice: O texto principal conserva a expressão ambígua “a sua virgem”.
  alternative: Pode referir-se à noiva/prometida virgem de um homem ou à filha virgem sob os cuidados de um pai ou responsável.
  rationale: A construção grega permite ambas as interpretações, presentes na história da leitura do texto; escolher uma delas no corpo do versículo eliminaria uma ambiguidade genuína da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva deliberadamente certa estranheza em “a sua virgem” para não resolver a ambiguidade do original; a nota apresenta as principais leituras.
