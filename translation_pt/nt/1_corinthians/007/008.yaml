base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: pt
  text: 'Digo aos que não são casados[a] e às viúvas: é bom para eles se permanecerem como eu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos homens não casados”, pois a forma grega é masculina plural; o masculino pode ser usado de modo representativo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como também eu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Mas digo
  rationale: δέ marca aqui uma transição levemente adversativa ou conectiva; “Mas digo” a representa naturalmente em português sem acrescentar uma ideia temporal.
- source_word: τοῖς ἀγάμοις
  choice: aos não casados
  rationale: ἄγαμος significa “não casado”. O masculino plural pode referir-se especificamente a homens ou funcionar de modo representativo; a formulação preserva essa amplitude, esclarecida em nota.
- source_word: ταῖς χήραις
  choice: às viúvas
  rationale: χήρα designa especificamente uma mulher viúva, categoria mencionada de modo distinto.
- source_word: καλὸν
  choice: é bom
  rationale: καλός exprime o que é bom, apropriado ou recomendável, sem conter por si só uma comparação como “melhor”.
- source_word: αὐτοῖς
  choice: que permaneçam
  rationale: Em português, o beneficiário indicado pelo dativo é expresso naturalmente pela oração “é bom que permaneçam”, sem necessidade de reproduzir um pronome que soaria pesado.
- source_word: ἐὰν μείνωσιν
  choice: que permaneçam
  rationale: A construção condicional grega após καλόν é vertida idiomaticamente em português por “é bom que”; μένω indica continuar no estado em questão.
- source_word: ὡς κἀγώ
  choice: como eu
  rationale: κἀγώ equivale literalmente a “também eu”; no contexto, “como eu” comunica de modo natural a referência de Paulo ao próprio estado.
theological_decisions:
- issue: Alcance de ἀγάμοις em relação a “viúvas”
  choice: “não casados”, com nota sobre o masculino plural grego
  alternative: “homens não casados”
  rationale: A forma é masculina plural e pode ser específica, mas também pode ter uso representativo. A tradução não deve decidir silenciosamente entre essas possibilidades.
- issue: Força de καλὸν no conselho de Paulo
  choice: “é bom”
  alternative: “é melhor”
  rationale: O adjetivo grego não é comparativo; “melhor” acrescentaria uma avaliação mais forte do que o texto expressa.
- issue: Estado de Paulo pressuposto por ὡς κἀγώ
  choice: Manter apenas “como eu”
  alternative: Explicitar “sem se casar, como eu”
  rationale: O contexto aponta para o estado não casado de Paulo, mas a formulação grega é concisa; a tradução preserva essa concisão sem desenvolver inferências biográficas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não casados” é mais corrente do que “solteiros” e evita restringir a expressão aos que nunca se casaram. A colocação dos marcadores liga cada nota diretamente à expressão correspondente.
