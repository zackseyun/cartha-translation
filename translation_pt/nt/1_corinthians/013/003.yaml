  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: pt
  text: E se eu distribuir todos os meus bens e se eu entregar o meu corpo para ser queimado[a], mas não tiver amor, nada ganho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “para que eu me glorie” em vez de “para ser queimado”.
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: distribua
  rationale: O verbo descreve a distribuição em porções e, neste contexto, a entrega dos bens a outros; “distribua” é natural e mantém esse sentido concreto.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: tudo o que possuo
  rationale: Expressa a totalidade dos bens materiais de modo claro, atual e abrangente.
- source_word: παραδῶ
  choice: entregue
  rationale: Preserva o sentido de colocar ou dar nas mãos de outros, sem acrescentar a interpretação de “sacrificar”.
- source_word: τὸ σῶμά μου
  choice: o meu corpo
  rationale: Tradução direta da expressão concreta grega.
- source_word: ἵνα καυθήσομαι
  choice: para ser queimado
  rationale: Reproduz de modo natural em português a finalidade expressa pela leitura do SBLGNT, sem alterar sua referência à queima.
- source_word: ἀγάπην
  choice: amor
  rationale: É o equivalente português atual e abrangente de ἀγάπη neste contexto.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: nada ganho
  rationale: Comunica de forma concisa que o sujeito não recebe benefício algum.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: E ainda que ... e ainda que
  rationale: Mantém as duas condições hipotéticas e a progressão retórica de Paulo; “ainda que” comunica naturalmente o caráter extremo das hipóteses.
theological_decisions:
- issue: Variante textual na oração de finalidade
  choice: Seguir καυθήσομαι, “ser queimado”, no texto principal.
  alternative: καυχήσωμαι — “para que eu me glorie” ou “para poder me orgulhar”.
  rationale: O texto-base fornecido, SBLGNT, traz a leitura referente a ser queimado. A variante afeta materialmente a interpretação e, por isso, é registrada em nota, sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “e ainda que” preserva a progressão do original; “tudo o que possuo” evita tanto arcaísmo quanto tecnicismo.
