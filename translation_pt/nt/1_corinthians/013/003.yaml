    issue: «Ainda que» em lugar de «se»
    rationale: Embora seja possível em português e transmita o caráter extremo das hipóteses, «ainda que» dá à construção uma coloração concessiva mais forte. O grego repete diretamente a condição καὶ ἐὰν; «e se ... e se» a representa de modo mais próximo.
  - severity: low
    issue: «Tudo o que possuo» em lugar de «todos os meus bens»
    rationale: A redação atual é compreensível, mas pode abranger mais do que as posses materiais. «Todos os meus bens» reflete mais especificamente τὰ ὑπάρχοντά μου, sem perder naturalidade.
