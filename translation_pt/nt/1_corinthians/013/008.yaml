  source_fidelity: 'A tradução representa fielmente as três afirmações e preserva as distinções verbais do grego: πίπτει («falha»), καταργηθήσονται/καταργηθήσεται («serão anuladas» / «será anulado») e παύσονται («cessarão»). A construção repetida «havendo» comunica de modo adequado a série elíptica introduzida por εἴτε δέ, sem transformar o enunciado em uma afirmação doutrinariamente mais específica.'
  naturalness: O texto é claro, digno e natural em português moderno de ampla compreensão, inclusive no Brasil. «O amor nunca falha» é idiomático; «línguas cessarão» mantém concisão e boa cadência. Embora «havendo» seja ligeiramente mais formal, é perfeitamente compreensível e corresponde bem à estrutura contrastiva do original.
  terminology: «Amor», «profecias», «línguas» e «conhecimento» são escolhas estáveis e contextualmente adequadas. «Línguas» preserva a terminologia do discurso de 1 Coríntios 12–14 sem decidir a natureza do fenômeno. «Anuladas/anulado» mantém a correspondência entre as duas ocorrências de καταργέω, enquanto «cessarão» preserva a diferença de παύω.
