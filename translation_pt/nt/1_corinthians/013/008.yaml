id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: pt
  text: O amor nunca falha.[a] Mas, havendo profecias, serão anuladas; havendo línguas,[b] cessarão; havendo conhecimento, será anulado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O amor nunca cai” ou “O amor nunca chega ao fim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “idiomas”.'
    reason: alternative_reading
  - marker: c
    text: O verbo traduzido por “será anulado” é o mesmo usado na cláusula sobre as profecias.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: É o equivalente português amplo, corrente e natural para o termo de Paulo, sem o estreitamento moderno que “caridade” poderia sugerir.
- source_word: οὐδέποτε
  choice: nunca
  rationale: Expressa de modo direto e idiomático a negação absoluta.
- source_word: πίπτει
  choice: falha
  rationale: Neste contexto, o verbo tem sentido figurado. “Falha” ressalta a permanência e a confiabilidade do amor sem igualá-lo aos verbos de cessação que aparecem depois.
- source_word: εἴτε δὲ
  choice: Mas, havendo
  rationale: Introduz naturalmente em português cada elemento da série contrastante e explicita a elipse grega sem transformar a construção em uma condição incerta.
- source_word: προφητεῖαι
  choice: profecias
  rationale: É o equivalente consagrado e suficientemente abrangente para mensagens ou manifestações proféticas.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: serão anuladas / será anulado
  rationale: Mantém o mesmo verbo português nas duas ocorrências e comunica que essas realidades perderão sua função ou vigência, sem exigir a ideia de destruição.
- source_word: γλῶσσαι
  choice: línguas
  rationale: Preserva o termo contextual de 1 Coríntios 12–14 e deixa em aberto a natureza exata do fenômeno.
- source_word: παύσονται
  choice: cessarão
  rationale: Verte naturalmente o futuro médio e preserva a distinção lexical em relação a καταργέω.
- source_word: γνῶσις
  choice: conhecimento
  rationale: Corresponde ao uso paulino normal e se conecta naturalmente ao conhecimento parcial mencionado no contexto seguinte.
theological_decisions:
- issue: Sentido de πίπτει na afirmação sobre o amor
  choice: O amor nunca falha
  alternative: O amor nunca cai; o amor nunca chega ao fim
  rationale: “Nunca falha” comunica a permanência confiável do amor no contraste com os dons transitórios, sem apagar a diferença entre πίπτει e os verbos posteriores.
- issue: Sentido de γλῶσσαι neste capítulo
  choice: línguas
  alternative: idiomas
  rationale: “Línguas” conserva a terminologia característica da discussão paulina e não decide se o fenômeno corresponde necessariamente a idiomas humanos reconhecíveis.
- issue: Força de καταργέω nas cláusulas sobre profecias e conhecimento
  choice: ser anuladas / ser anulado
  alternative: ser abolidas / ser abolido; perder a função
  rationale: A tradução indica cessação de vigência ou função sem impor a noção mais forte de aniquilação, e mantém visível que o mesmo verbo grego ocorre nas duas cláusulas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva as distinções entre πίπτει, καταργέω e παύω e evita resolver a controvérsia sobre a natureza das línguas.
