  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: pt
  text: não se alegra com a injustiça[a], mas se alegra com a verdade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a maldade”, “com a prática do mal” ou “com a iniquidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “alegra-se na verdade”. O verbo grego composto pode significar alegrar-se juntamente com a verdade ou alegrar-se por ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: se alegra
  rationale: Expressa de modo natural o ato de sentir alegria ou satisfação e preserva o paralelismo verbal com συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: com a injustiça
  rationale: Com χαίρω, ἐπί com dativo indica a causa ou ocasião da alegria. Em português, “alegrar-se com” é idiomático; “injustiça” mantém o contraste ético amplo com “verdade”, enquanto alternativas são registradas em nota.
- source_word: συγχαίρει
  choice: se alegra com
  rationale: O verbo composto pode indicar compartilhar a alegria com alguém ou alegrar-se por causa de algo. A formulação mantém essa ambiguidade de maneira natural em português.
- source_word: δὲ
  choice: mas
  rationale: Aqui a conjunção estabelece contraste direto entre aquilo com que o amor não se alegra e aquilo com que se alegra.
- source_word: τῇ ἀληθείᾳ
  choice: a verdade
  rationale: Preserva o artigo grego e o contraste conceitual com ἀδικία, sem restringir “verdade” à fala verdadeira, à conduta ou ao evangelho.
theological_decisions:
- issue: Sentido ético-teológico de ἀδικία no contraste paulino
  choice: injustiça
  alternative: maldade; prática do mal; iniquidade
  rationale: “Injustiça” corresponde diretamente ao campo semântico de ἀδικία e conserva tanto a dimensão moral quanto a relacional, sem limitar o termo ao âmbito jurídico ou social.
- issue: Força do prefixo συν- em συγχαίρει
  choice: se alegra com a verdade
  alternative: alegra-se na verdade; compartilha a alegria da verdade
  rationale: A tradução escolhida permite entender tanto alegria junto com a verdade personificada quanto alegria por causa do que é verdadeiro, preservando a tensão sem explicá-la excessivamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “se alegra” conserva o paralelismo retórico do grego; “com” produz uma construção natural em português e preserva a possível personificação da verdade.
