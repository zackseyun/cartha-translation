id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: pt
  text: O amor é paciente, o amor é bondoso. Não tem inveja[a], não se vangloria, não se enche de orgulho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não sente ciúme”. O verbo grego pode indicar zelo, ciúme ou inveja; neste contexto negativo, “inveja” é o sentido mais provável.
    reason: lexical_alternative
  - marker: b
    text: Ou “não é arrogante”. O grego emprega a imagem de alguém inflado pelo orgulho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: “Amor” é a correspondência portuguesa natural e abrangente, adequada ao sentido ético e relacional do termo neste contexto.
- source_word: μακροθυμεῖ
  choice: é paciente
  rationale: Expressa paciência prolongada, especialmente no trato com outras pessoas, em linguagem atual e clara.
- source_word: χρηστεύεται
  choice: é bondoso
  rationale: O verbo raro indica agir com bondade ou benevolência; “é bondoso” mantém o paralelismo predicativo e explicita o caráter ativo dessa disposição.
- source_word: ζηλοῖ
  choice: tem inveja
  rationale: Embora o verbo possa indicar zelo ou ciúme, a negação e a sequência de vícios favorecem aqui o sentido negativo de invejar.
- source_word: περπερεύεται
  choice: se vangloria
  rationale: Comunica exibição presunçosa e jactância em português corrente, digno e facilmente compreensível.
- source_word: φυσιοῦται
  choice: se enche de orgulho
  rationale: Preserva de modo natural a imagem de alguém inflado pelo orgulho, recorrente no vocabulário paulino, sem recorrer à formulação menos idiomática “fica inchado”.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: O amor ... o amor ... [sujeito implícito]
  rationale: A repetição nas duas primeiras orações conserva a ênfase retórica. Nas negativas seguintes, o português permite omitir naturalmente o sujeito sem perder a referência ao amor; isso também evita apoiar a tradução na repetição textualmente variável antes de ζηλοῖ.
- source_word: οὐ
  choice: não
  rationale: A negação simples “não” reproduz de forma natural a série enfática de declarações negativas.
theological_decisions:
- issue: Tradução de ἀγάπη nesta passagem ética e teológica
  choice: amor
  alternative: caridade
  rationale: “Amor” preserva o alcance amplo, relacional e ético do termo. No português moderno, “caridade” pode restringir indevidamente o sentido à ajuda material ou beneficência.
- issue: Metáfora de orgulho em φυσιοῦται
  choice: não se enche de orgulho
  alternative: não é arrogante
  rationale: A opção escolhida retém algo da imagem grega de inflação e mantém a relação com o uso paulino, enquanto “não é arrogante” explicaria o sentido, mas apagaria a metáfora.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém o ritmo breve e paralelo do grego, com vocabulário digno e acessível. Os marcadores de notas foram colocados junto às expressões que efetivamente explicam.
