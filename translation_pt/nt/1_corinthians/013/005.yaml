  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: pt
  text: não age de modo indecoroso[a], não busca seus próprios interesses[b], não se irrita[c], não leva em conta o mal[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não age de modo impróprio” ou “não se comporta de maneira rude”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não busca as coisas de si mesma”. Ou “não busca o que é seu”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não se deixa provocar”. Também pode ser traduzido por “não se irrita facilmente”, embora o grego não diga “facilmente”.
    reason: alternative_reading
  - marker: d
    text: Ou “não contabiliza o mal” ou, em sentido contextual, “não mantém registro das ofensas”. A expressão grega também pode ser entendida como “não atribui o mal”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: se comporta de maneira indecorosa
  rationale: O verbo descreve uma conduta imprópria, vergonhosa ou contrária ao decoro. A formulação preserva a dimensão moral e social sem reduzi-la à mera falta de educação.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: busca o que é seu
  rationale: Reproduz de modo natural a expressão grega, literalmente “busca as coisas de si mesma”, e mantém aberta sua aplicação a interesses, vantagens ou desejos próprios.
- source_word: παροξύνεται
  choice: se irrita
  rationale: Expressa em português corrente a ideia de ser despertado ou incitado a uma reação aguda de irritação ou ira. Não se acrescenta “facilmente”, pois não há advérbio correspondente no grego.
- source_word: λογίζεται τὸ κακόν
  choice: leva em conta o mal
  rationale: “Levar em conta” conserva o sentido de calcular, contabilizar ou lançar à conta. “O mal” mantém o singular e a amplitude da expressão grega, que pode referir-se ao mal em geral ou ao mal sofrido.
- source_word: ἀγάπη (sujeito implícito pelo contexto)
  choice: sujeito oculto nas orações
  rationale: O sujeito continua sendo “o amor”, estabelecido no contexto anterior. O português permite omiti-lo naturalmente nesta sequência, preservando a personificação.
theological_decisions:
- issue: Se παροξύνεται deve ser intensificado como “irrita-se facilmente”
  choice: não se irrita
  alternative: não se irrita facilmente
  rationale: O texto grego não contém um termo equivalente a “facilmente”. A tradução evita acrescentar uma limitação que poderia enfraquecer a afirmação.
- issue: Se λογίζεται τὸ κακόν deve ser explicitado como registro de ofensas sofridas
  choice: não leva em conta o mal
  alternative: não mantém registro das ofensas recebidas
  rationale: A alternativa é contextualmente plausível, mas explicita o agente e pluraliza o objeto. A redação principal preserva a metáfora contábil, o singular e a ambiguidade do original.
- issue: Se ζητεῖ τὰ ἑαυτῆς deve ser interpretado como insistência na própria vontade
  choice: não busca o que é seu
  alternative: não insiste em fazer a própria vontade
  rationale: A alternativa restringe a expressão a uma forma específica de egoísmo. A formulação escolhida conserva o alcance mais amplo do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A sequência mantém o ritmo conciso do grego. “Indecorosa” preserva o teor moral e social sem coloquialismo excessivo; “leva em conta” torna acessível a metáfora contábil sem resolver indevidamente se “o mal” é maldade em geral, mal atribuído ou ofensa sofrida.
