id: 1CO.13.9
reference: 1 Corinthians 13:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: pt
  text: Pois conhecemos em parte[a] e profetizamos em parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parcialmente”; a expressão grega significa literalmente “de uma parte” e se repete nas duas orações para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: em parte
  rationale: A expressão significa “em parte” ou “parcialmente”. “Em parte” conserva a repetição do grego nas duas orações e prepara o contraste contextual com o que é completo.
- source_word: γὰρ
  choice: Pois
  rationale: Conjunção explicativa que liga este versículo ao argumento anterior; “pois” mantém essa relação de modo natural e digno em português.
- source_word: γινώσκομεν
  choice: conhecemos
  rationale: Tradução direta do verbo γινώσκω, preservando o sentido de conhecimento sem interpretá-lo especificamente como compreensão.
- source_word: καὶ
  choice: e
  rationale: Conectivo simples que mantém o paralelismo entre as duas orações.
- source_word: προφητεύομεν
  choice: profetizamos
  rationale: Mantém a terminologia do contexto dos dons espirituais sem restringir a atividade à previsão do futuro ou à pregação em geral.
theological_decisions:
- issue: Sentido da atividade profética na igreja
  choice: profetizamos
  alternative: predizemos o futuro; pregamos
  rationale: O termo grego pode designar fala profética inspirada em sentido mais amplo que mera predição. A formulação preserva essa amplitude e não resolve uma questão interpretativa debatida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “em parte” foi mantida para reproduzir o paralelismo enfático do original.
