source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: pt
  text: E se eu tiver profecia, entender todos os mistérios e todo o conhecimento, e se eu tiver toda a fé[a], a ponto de mover montanhas, mas não tiver amor, nada sou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda a confiança»; menos provavelmente, «toda a fidelidade». A palavra grega pode ter uma variedade de sentidos, mas aqui provavelmente se refere a uma fé extraordinária.
    reason: Alternativa lexical para πίστις, preservada do audit trail inglês.
lexical_decisions:
- source_word: προφητείαν
  choice: profecia
  rationale: Mantém o substantivo amplo do grego e sua ligação contextual com os dons espirituais, sem especificá-lo como ato, capacidade ou ofício.
- source_word: εἰδῶ
  choice: conheça
  rationale: Traduz diretamente o valor cognitivo de οἶδα. Em português, «conhecer os mistérios» é natural, enquanto «possua todo o conhecimento» distingue a expressão seguinte e evita uma repetição pouco elegante.
- source_word: μυστήρια
  choice: mistérios
  rationale: Preserva o termo paulino consagrado e seu sentido de realidades divinas ocultas ou reveladas, sem reduzi-lo a meros segredos.
- source_word: πᾶσαν τὴν γνῶσιν
  choice: possua todo o conhecimento
  rationale: «Conhecimento» preserva a distinção lexical em relação a εἰδῶ; o verbo «possua», elíptico no grego, produz uma construção portuguesa clara e natural.
- source_word: πᾶσαν τὴν πίστιν
  choice: toda a fé
  rationale: Mantém a tradução normal de πίστις. Neste contexto hiperbólico, a expressão aponta para uma fé extraordinária capaz de realizar o impossível, sem defini-la como categoria técnica de fé salvadora.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: a ponto de mover montanhas
  rationale: Reproduz naturalmente a construção de resultado e conserva a imagem proverbial grega de poder extraordinário.
- source_word: ἀγάπην
  choice: amor
  rationale: É a equivalência moderna, ampla e estabelecida para ἀγάπη, adequada ao argumento do capítulo.
- source_word: οὐθέν εἰμι
  choice: nada sou
  rationale: Tradução concisa e enfática que conserva a forte autonegação de Paulo e soa digna em português.
theological_decisions:
- issue: Sentido de πίστις no contexto de capacidade extraordinária para mover montanhas
  choice: fé
  alternative: confiança; fidelidade
  rationale: «Fé» é o sentido mais provável neste contexto de capacidade extraordinária. «Confiança» é lexicalmente possível, mas menos convencional; «fidelidade» é ainda menos provável porque não se ajusta bem à capacidade de mover montanhas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação repetida «e ainda que» preserva a progressão retórica do grego; «nada sou» mantém a conclusão breve e contundente.
