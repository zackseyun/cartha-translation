reference: 1 Corinthians 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: pt
  text: Pois agora vemos por meio de um espelho, de forma enigmática[a], mas então veremos face a face. Agora conheço em parte, mas então conhecerei plenamente, assim como também fui plenamente conhecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “em um enigma”. A expressão grega ressalta que nossa percepção atual é indireta e difícil de decifrar; também pode ser traduzida como “obscuramente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: vemos
  rationale: Preserva de modo direto e natural a metáfora visual do presente do indicativo.
- source_word: ἄρτι
  choice: agora
  rationale: Mantém o contraste temporal conciso com τότε, “então”.
- source_word: δι’ ἐσόπτρου
  choice: por meio de um espelho
  rationale: Expressa o valor instrumental ou mediador de διά com genitivo sem sugerir que se olhe literalmente através do espelho.
- source_word: ἐν αἰνίγματι
  choice: de forma enigmática
  rationale: Conserva a ideia lexical de αἴνιγμα — percepção indireta e difícil de decifrar — em português corrente e digno.
- source_word: τότε δὲ
  choice: mas então
  rationale: Torna natural e explícito o contraste entre a condição presente e a futura.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: face a face
  rationale: Equivalente idiomático estabelecido que comunica encontro ou percepção direta.
- source_word: γινώσκω ἐκ μέρους
  choice: conheço em parte
  rationale: Reproduz com naturalidade a expressão de conhecimento parcial e o paralelismo do texto.
- source_word: ἐπιγνώσομαι
  choice: conhecerei plenamente
  rationale: Comunica um conhecimento futuro mais pleno em contraste com o parcial, sem afirmar onisciência exaustiva.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: assim como também fui plenamente conhecido
  rationale: Preserva a correspondência lexical com ἐπιγνώσομαι e mantém implícito, como no grego, quem conhece o sujeito.
theological_decisions:
- issue: Alcance do conhecimento futuro indicado por ἐπιγνώσομαι
  choice: conhecerei plenamente
  alternative: conhecerei completamente; compreenderei tudo
  rationale: A formulação mantém o contraste entre conhecimento parcial e mais pleno, mas não transforma a frase numa afirmação de onisciência humana.
- issue: Identidade daquele por quem Paulo foi plenamente conhecido
  choice: manter o agente implícito na voz passiva
  alternative: explicitar “por Deus”
  rationale: Embora Deus seja naturalmente entendido no contexto teológico, o texto grego não nomeia o agente; a tradução preserva essa forma e sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por meio de um espelho” evita a impressão imprópria de enxergar através dele, enquanto “de forma enigmática” preserva o substantivo grego e sua imagem. O singular da segunda metade é mantido para acompanhar a passagem de “vemos” a “conheço” no original.
