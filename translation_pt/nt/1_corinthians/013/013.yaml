id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: pt
  text: 'Agora, porém, permanecem estas três: a fé[a], a esperança e o amor[b]. Mas o maior destes é o amor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fé” também pode transmitir aqui a ideia de “confiança”.
    reason: alternative_reading
  - marker: b
    text: O termo grego também foi tradicionalmente traduzido por “caridade”, mas aqui significa “amor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Agora, porém
  rationale: νυνί indica o estado presente ou conclusivo, enquanto δέ introduz conexão com leve contraste. “Agora, porém” preserva ambas as nuances e se liga naturalmente ao contraste anterior.
- source_word: μένει
  choice: permanecem
  rationale: O singular grego concorda com a série tomada coletivamente, mas em português a concordância plural com “estas três” é mais natural. “Permanecem” comunica continuidade e duração sem o tom arcaico de “subsistem”.
- source_word: πίστις
  choice: fé
  rationale: Na tríade paulina, “fé” é a tradução estabelecida e mais provável; “confiança” é possível como explicitação do sentido, mas seria mais estreita.
- source_word: ἐλπίς
  choice: esperança
  rationale: “Esperança” expressa de modo natural o sentido usual de ἐλπίς no uso paulino e nesta tríade.
- source_word: ἀγάπη
  choice: amor
  rationale: “Amor” é a tradução moderna, ampla e adequada neste contexto; evita o sentido assistencial mais restrito que “caridade” costuma ter hoje.
- source_word: τὰ τρία ταῦτα
  choice: estas três
  rationale: A forma feminina concorda em português com as três virtudes nomeadas e retoma a série de modo conciso.
- source_word: μείζων δὲ τούτων
  choice: Mas o maior destes
  rationale: 'Embora μείζων seja formalmente comparativo, a comparação dentro de um conjunto de três tem valor superlativo em português: “o maior destes”.'
theological_decisions:
- issue: Sentido de πίστις na tríade teológica
  choice: fé
  alternative: confiança; fidelidade
  rationale: A associação com esperança e amor favorece “fé”. “Confiança” permanece uma possível descrição semântica, enquanto “fidelidade” é menos provável aqui.
- issue: Relação expressa por μείζων entre as três virtudes
  choice: o maior destes é o amor
  alternative: o amor é maior do que estes
  rationale: A formulação superlativa comunica naturalmente que o amor ocupa o primeiro lugar na tríade, sem explicar por que ou em que sentido ele é maior.
- issue: Continuidade das três virtudes
  choice: permanecem
  alternative: continuam; subsistem
  rationale: A tradução mantém a afirmação do texto sem determinar se a permanência se refere somente ao presente, ao futuro ou a ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da tríade e a repetição final de “amor” foram preservadas. “Agora, porém” retém tanto a referência temporal quanto o leve contraste de νυνὶ δέ.
