reference: 1 Corinthians 13:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: pt
  text: Se eu falar nas línguas dos seres humanos e dos anjos[a], mas não tiver amor, tornei-me bronze que ressoa[b] ou címbalo estridente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nos idiomas». A palavra grega pode referir-se a línguas ou idiomas; aqui, «línguas» também mantém a ligação com a discussão sobre fala inspirada em Corinto.
    reason: lexical_alternative
  - marker: b
    text: Ou «metal que ressoa». O termo grego designa bronze, cobre ou metal semelhante, sem indicar necessariamente um instrumento específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Ainda que
  rationale: No encadeamento retórico de 1 Coríntios 13, introduz uma hipótese extrema; «ainda que» expressa naturalmente em português essa força concessivo-condicional.
- source_word: ταῖς γλώσσαις
  choice: nas línguas
  rationale: γλῶσσα pode significar língua ou idioma. «Línguas» conserva a ambiguidade lexical e a ligação com a discussão coríntia sobre fala inspirada.
- source_word: τῶν ἀνθρώπων
  choice: dos seres humanos
  rationale: ἄνθρωποι designa aqui a humanidade em contraste com os anjos; a expressão é precisa, inclusiva e natural no português atual.
- source_word: λαλῶ
  choice: eu fale
  rationale: O presente do subjuntivo português encaixa-se naturalmente na construção hipotética iniciada por «ainda que».
- source_word: καὶ τῶν ἀγγέλων
  choice: e dos anjos
  rationale: O contraste com seres humanos favorece o sentido de seres celestiais, sem decidir se a expressão é literal ou hiperbólica.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente corrente e abrangente de ἀγάπη; evita o sentido moderno mais restrito de «caridade».
- source_word: δὲ μὴ ἔχω
  choice: mas não tenha
  rationale: Preserva o contraste marcado por δέ e a ausência de amor expressa por μή com ἔχω.
- source_word: γέγονα
  choice: tornei-me
  rationale: Traduz o perfeito resultativo como passagem a um estado presente, sem reduzi-lo simplesmente a «sou».
- source_word: χαλκὸς ἠχῶν
  choice: bronze que ressoa
  rationale: Mantém o metal não especificado como instrumento e reproduz a ideia de material metálico que produz som.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: ou címbalo que retine
  rationale: κύμβαλον é címbalo, e ἀλαλάζον evoca som forte e estridente; «retine» comunica o ruído metálico de modo conciso e digno.
theological_decisions:
- issue: Sentido de «línguas dos seres humanos e dos anjos»
  choice: Manter a contraposição retórica entre línguas humanas e angélicas sem explicar sua natureza.
  alternative: Entender como idiomas celestiais reais ou como hipérbole para a fala mais elevada concebível.
  rationale: O texto não obriga a decidir entre referência literal e hipérbole; a tradução conserva essa tensão.
- issue: Natureza do amor mencionado
  choice: Traduzir ἀγάπη simplesmente por «amor».
  alternative: «Caridade».
  rationale: «Amor» preserva a amplitude do termo no contexto, enquanto «caridade» poderia sugerir apenas ajuda material ou importar tradição terminológica específica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação conserva o paralelismo, a hipótese retórica e a imagem sonora do grego, evitando arcaísmos e conclusões doutrinárias não exigidas pelo texto.
