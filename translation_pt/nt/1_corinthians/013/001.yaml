- from: Ainda que eu fale nas línguas dos seres humanos e dos anjos[a], mas não tenha amor, tornei-me bronze que ressoa[b] ou címbalo que retine.
  to: Se eu falar nas línguas dos seres humanos e dos anjos[a], mas não tiver amor, tornei-me bronze que ressoa[b] ou címbalo estridente.
  rationale: A revisão substitui a concessiva «Ainda que» pela condicional «Se», que corresponde diretamente a Ἐὰν e permite conservar «mas não tiver amor» como contraste interno. Mantém-se «tornei-me» para refletir o perfeito resultativo γέγονα e ajusta-se a última imagem para «címbalo estridente», mais fiel a ἀλαλάζον. As notas permanecem pertinentes e seus marcadores continuam corretamente ancorados.
