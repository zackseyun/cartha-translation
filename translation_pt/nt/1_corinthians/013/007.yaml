  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: pt
  text: Tudo suporta[a], tudo crê[b], tudo espera, tudo persevera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo cobre”; στέγει também pode ter o sentido de cobrir ou proteger.'
    reason: lexical_alternative
  - marker: b
    text: Em “tudo crê”, também é possível entender “em tudo confia”; o sentido não é que o amor seja ingênuo, mas que se inclina a confiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural acusativo tem sentido abrangente com cada verbo. A repetição de “tudo” preserva a concisão, o paralelismo e a amplitude retórica do grego.
- source_word: στέγει
  choice: suporta
  rationale: στέγω pode significar “cobrir, proteger” e, por extensão, “suportar”. “Suporta” é natural neste contexto de constância do amor, enquanto a nuance de “cobre” é preservada em nota.
- source_word: πιστεύει
  choice: crê
  rationale: πιστεύω pode significar “crer” ou “confiar”. “Crê” mantém uma correspondência lexical direta e o ritmo conciso da série, sem exigir que o amor seja entendido como crédulo.
- source_word: ἐλπίζει
  choice: espera
  rationale: O presente descreve uma ação característica. “Espera” é uma tradução direta e preserva o paralelismo breve do versículo; a possível explicitação de esperança contínua não é necessária no texto.
- source_word: ὑπομένει
  choice: persevera
  rationale: ὑπομένω expressa permanecer firme sob pressão, suportar e perseverar. “Persevera” distingue este verbo de στέγει e produz uma conclusão climática natural em português.
theological_decisions:
- issue: Sentido das afirmações repetidas com πάντα
  choice: A linguagem é retórica e descreve a abrangente firmeza do amor, não uma aceitação crédula ou aprovação moral de qualquer coisa.
  alternative: Entender as expressões como universalidade absoluta de ação ou credulidade.
  rationale: O contexto imediato é uma descrição poética do caráter do amor. Repetir “tudo” conserva a força retórica de Paulo sem acrescentar no corpo do texto uma limitação interpretativa ausente do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição anafórica de “tudo” e as quatro formas verbais concisas preservam o ritmo do original. As marcas [a] e [b] aparecem no texto principal.
