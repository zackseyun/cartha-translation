source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: pt
  text: Quando eu era criança, falava como criança, pensava como criança, raciocinava como criança. Quando me tornei homem, deixei para trás as coisas de criança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas infantis” ou “os modos de uma criança”. Em grego, literalmente, “as coisas da criança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: criança
  rationale: νήπιος designa uma criança pequena e pode realçar imaturidade. “Criança” preserva naturalmente a metáfora e evita restringi-la a um bebê.
- source_word: ἐλάλουν
  choice: falava
  rationale: λαλέω significa falar ou conversar. “Falava” é claro, digno e mantém a cadência da série verbal.
- source_word: ἐφρόνουν
  choice: pensava
  rationale: φρονέω pode indicar pensamento, disposição mental ou atitude. Neste paralelismo, “pensava” é conciso e natural.
- source_word: ἐλογιζόμην
  choice: raciocinava
  rationale: λογίζομαι pode significar calcular, considerar ou raciocinar. “Raciocinava” distingue este verbo de ἐφρόνουν e preserva sua nuance reflexiva.
- source_word: γέγονα
  choice: me tornei
  rationale: O perfeito apresenta a chegada a um estado adulto. Depois de “quando”, o pretérito perfeito em português expressa a transição de modo idiomático.
- source_word: ἀνήρ
  choice: homem
  rationale: ἀνήρ significa especificamente “homem” neste contraste autobiográfico com a criança. A escolha conserva o masculino do grego sem transformar a ilustração em uma afirmação de superioridade masculina.
- source_word: κατήργηκα
  choice: deixei para trás
  rationale: καταργέω pode significar eliminar, pôr fim ou tornar inoperante. No quadro do amadurecimento, “deixei para trás” comunica com naturalidade o abandono das coisas próprias da infância.
- source_word: τὰ τοῦ νηπίου
  choice: as coisas de criança
  rationale: A expressão significa literalmente “as coisas da criança”. “As coisas de criança” conserva a forma concreta e abrangente do grego, sem limitar a referência apenas a atitudes infantis.
theological_decisions:
- issue: Contraste marcado por gênero em ἀνήρ
  choice: homem
  alternative: adulto
  rationale: O texto grego usa o substantivo masculino singular ἀνήρ. Paulo fala de si como exemplo de amadurecimento; preservar “homem” mantém a forma da ilustração sem sugerir que maturidade seja exclusiva dos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “como criança” preserva a cadência retórica do grego. A ausência de conjunção antes de “raciocinava” acompanha o paralelismo enfático do original.
