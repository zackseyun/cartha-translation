  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: pt
  text: Mas, quando vier o que é perfeito[a], o que é parcial será abolido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o que é completo» ou «o que é maduro». A expressão grega é debatida e pode ser entendida como perfeição, completude, maturidade ou a consumação futura, em contraste com a condição parcial presente.
    reason: alternative_reading
  - marker: b
    text: Ou «será posto de lado», «passará» ou «deixará de ter efeito».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal referente a um acontecimento futuro esperado; «quando» é natural em português e evita o sentido iterativo que «sempre que» poderia sugerir.
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste moderado com a condição presente, caracterizada pelo que é parcial.
- source_word: ἔλθῃ
  choice: vier
  rationale: O aoristo do subjuntivo depois de ὅταν aponta aqui para um acontecimento futuro; «quando vier» é a construção idiomática correspondente em português.
- source_word: τὸ τέλειον
  choice: o que é perfeito
  rationale: A expressão substantivada neutra pode indicar aquilo que é perfeito, completo ou maduro. «O que é perfeito» mantém a amplitude lexical e não identifica antecipadamente o referente.
- source_word: τὸ ἐκ μέρους
  choice: o que é parcial
  rationale: O artigo substantiva a expressão «em parte». A formulação escolhida produz um contraste claro com «o que é perfeito» e preserva a ideia de uma condição apenas parcial.
- source_word: καταργηθήσεται
  choice: deixará de existir
  rationale: O futuro passivo indica que aquilo que é parcial será tornado inoperante ou chegará ao fim. A formulação comunica cessação sem exigir a ideia de aniquilação; outras traduções possíveis são registradas em nota.
theological_decisions:
- issue: Referente de τὸ τέλειον
  choice: A tradução mantém a expressão genérica «o que é perfeito», sem especificar seu referente.
  alternative: «O que é completo», «a maturidade», a consumação escatológica associada à volta de Cristo ou ao conhecimento face a face; alguns também propõem o cânon completo das Escrituras.
  rationale: O grego não identifica explicitamente o referente neste versículo. Embora a forma neutra favoreça um sentido abstrato ou coletivo, ela não resolve a questão. A tradução preserva, portanto, a ambiguidade e evita impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. As construções paralelas «o que é perfeito» e «o que é parcial» reproduzem o contraste do grego de modo natural. As notas preservam tanto a ambiguidade interpretativa de τὸ τέλειον quanto a variedade semântica de καταργέω.
