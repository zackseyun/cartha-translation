base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: pt
  text: Não sejam motivo de tropeço nem para os judeus, nem para os gregos[b], nem para a igreja de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não deem motivo de ofensa» ou «sejam irrepreensíveis».'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «gregos» provavelmente se refere de modo amplo aos não judeus no contexto de Paulo; o texto grego diz especificamente «gregos».
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: não sejam motivo de tropeço
  rationale: No contexto, o adjetivo aponta para uma conduta que não leva outros a tropeçar nem lhes cria impedimento. Esta formulação conserva a imagem ética e relacional com naturalidade em português.
- source_word: γίνεσθε
  choice: sejam
  rationale: O imperativo presente expressa uma exortação contínua; «sejam» é natural e não força a ideia de uma mudança pontual.
- source_word: Ἰουδαίοις
  choice: para os judeus
  rationale: Refere-se ao povo judeu como grupo étnico-religioso, e não apenas aos habitantes da Judeia.
- source_word: Ἕλλησιν
  choice: para os gregos
  rationale: Mantém o termo específico do texto grego, embora neste contexto ele provavelmente designe de maneira ampla os não judeus.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: para a igreja de Deus
  rationale: «Igreja» é a forma corrente e adequada para a comunidade reunida de fiéis; o genitivo é preservado diretamente como «de Deus».
theological_decisions:
- issue: Agrupamento dos destinatários da exortação ética de Paulo
  choice: 'Preservar os três grupos explicitamente nomeados: judeus, gregos e a igreja de Deus.'
  alternative: Entender «gregos» explicitamente como «gentios» ou tratar a exortação sobretudo como estratégia missionária.
  rationale: O versículo distingue três grupos, e a tradução não amplia nem restringe essas categorias. «Motivo de tropeço» expressa a dimensão ética sem definir além do texto a relação entre esses grupos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção imperativa é natural, e «motivo de tropeço» preserva a força relacional do termo sem introduzir linguagem denominacional.
