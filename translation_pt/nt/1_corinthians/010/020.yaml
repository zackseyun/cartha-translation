id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: pt
  text: Não. Pelo contrário, o que eles sacrificam, sacrificam a demônios, e não a Deus; e eu não quero que vocês se tornem participantes com os demônios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que têm comunhão com os demônios” ou “os que compartilham com os demônios”.
    reason: Alternativas lexicais para κοινωνούς, que expressa participação, compartilhamento ou comunhão.
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Não. Pelo contrário,
  rationale: No contexto, a expressão corrige uma possível inferência do versículo anterior. A formulação idiomática preserva a força adversativa sem reproduzir de modo artificial a sintaxe grega.
- source_word: ἃ θύουσιν
  choice: o que eles sacrificam
  rationale: O pronome relativo neutro se refere genericamente às ofertas sacrificiais, sem exigir que se acrescente um substantivo.
- source_word: θύουσιν
  choice: sacrificam
  rationale: Em contexto cultual, θύω significa oferecer em sacrifício; “sacrificam” é conciso e mantém o sentido ritual.
- source_word: δαιμονίοις
  choice: a demônios
  rationale: No uso do Novo Testamento e neste contraste, δαιμόνιον designa demônios, não divindades menores neutras.
- source_word: καὶ οὐ θεῷ
  choice: e não a Deus
  rationale: O contexto estabelece um contraste com o Deus verdadeiro; a ausência do artigo em grego não exige a tradução “um deus”.
- source_word: οὐ θέλω δὲ
  choice: e eu não quero
  rationale: δέ dá continuidade ao argumento com leve contraste; “e” produz um fluxo natural em português.
- source_word: κοινωνοὺς
  choice: participantes
  rationale: κοινωνός indica quem compartilha ou participa de algo. “Participantes” comunica envolvimento real e se harmoniza com o argumento dos versículos 16–18.
- source_word: τῶν δαιμονίων
  choice: com os demônios
  rationale: O genitivo ligado a κοινωνούς é expresso naturalmente em português como participação ou associação “com” alguém.
- source_word: γίνεσθαι
  choice: se tornem
  rationale: γίνομαι ressalta a entrada em um estado, e não apenas a permanência nele; “se tornem” preserva essa nuance.
theological_decisions:
- issue: Natureza do culto sacrificial pagão
  choice: Paulo afirma que os sacrifícios pagãos são oferecidos a demônios, e não a Deus.
  alternative: Entender a declaração apenas como descrição retórica do significado social das refeições idólatras ou como referência meramente metafórica a falsos deuses.
  rationale: O contraste explícito do texto deve permanecer sem atenuação, mas sem acrescentar especulações sobre a natureza ou a atuação desses seres.
- issue: Força de κοινωνοὺς τῶν δαιμονίων
  choice: Participação ou associação real com os demônios.
  alternative: Mera convivência social com idólatras, ou plena submissão cultual aos demônios.
  rationale: O contexto emprega linguagem de participação real, mas o versículo não autoriza ampliar isso para uma declaração de lealdade total. “Participantes com os demônios” conserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A correção inicial foi pontuada como “Não. Pelo contrário,” para soar natural e deixar clara a retomada do versículo anterior. O artigo em “com os demônios” é idiomático em português e não altera o referente grego.
