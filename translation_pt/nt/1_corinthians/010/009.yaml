source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: pt
  text: Nem ponhamos o Messias à prova[a], como alguns deles o puseram à prova e iam morrendo por causa das cobras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o Senhor” em vez de “o Messias” (ou “Cristo”).
    reason: textual_variant
  - marker: b
    text: Ou “serpentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Nem ponhamos
  rationale: Dá continuidade à série de advertências do contexto e preserva a força exortativa do subjuntivo.
- source_word: ἐκπειράζωμεν
  choice: ponhamos ... à prova
  rationale: Expressa a ideia de submeter alguém indevidamente a uma prova, sem sugerir que o Messias pudesse ser seduzido ao mal.
- source_word: τὸν Χριστόν
  choice: o Messias
  rationale: Χριστός funciona como título; “Messias” comunica seu sentido em português, enquanto o artigo grego é preservado.
- source_word: καθώς
  choice: como
  rationale: Introduz de modo natural a comparação com o exemplo da geração do deserto.
- source_word: τινες αὐτῶν
  choice: alguns deles
  rationale: Refere-se a alguns dentre os israelitas mencionados no contexto.
- source_word: ἐπείρασαν
  choice: o puseram à prova
  rationale: Retoma explicitamente o mesmo ato da primeira oração e mantém o objeto implícito no grego.
- source_word: ὑπὸ τῶν ὄφεων
  choice: pelas cobras
  rationale: Traduz o agente da construção passiva em linguagem moderna e amplamente compreensível; “serpentes” é registrado como alternativa lexical.
- source_word: ἀπώλλυντο
  choice: iam sendo mortos
  rationale: A construção progressiva procura refletir o aspecto imperfeito do verbo, enquanto “mortos” comunica naturalmente o resultado letal causado pelas cobras.
theological_decisions:
- issue: Referente e variante textual de τὸν Χριστόν
  choice: o Messias
  alternative: o Senhor; Cristo
  rationale: O texto adotado pelo SBLGNT traz Χριστόν e, neste contexto, relaciona o Messias àquele que Israel pôs à prova no deserto. A variante significativa “o Senhor” é preservada em nota, sem resolver silenciosamente a tensão textual.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção exortativa natural. A forma progressiva “iam sendo mortos” preserva o valor aspectual do imperfeito sem tornar a frase excessivamente técnica.
