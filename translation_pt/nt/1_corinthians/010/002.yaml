  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: pt
  text: e todos foram batizados em Moisés[a], na nuvem e no mar[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “identificados com Moisés” ou “em lealdade a Moisés”. O grego diz literalmente “para Moisés”, preservando a construção incomum e o paralelo tipológico de Paulo com o batismo.
    reason: alternative_reading
  - marker: b
    text: Paulo diz “no mar”, e não “através do mar”, preservando o paralelo com “na nuvem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: O plural refere-se coletivamente a todos os israelitas em vista e preserva a ênfase repetida de Paulo no contexto.
- source_word: εἰς τὸν Μωϋσῆν
  choice: em Moisés
  rationale: A formulação conserva, em português natural, a construção incomum e a relação tipológica com a linguagem do batismo, sem reduzi-la a uma única explicação.
- source_word: ἐβαπτίσαντο
  choice: foram batizados
  rationale: Embora a forma grega esteja na voz média, o passivo idiomático comunica adequadamente aqui o sentido de βαπτίζω e evita a leitura excessivamente literal de que eles batizaram a si mesmos.
- source_word: ἐν τῇ νεφέλῃ
  choice: na nuvem
  rationale: Preserva a preposição ἐν e permite a ambiguidade entre esfera, meio e associação presente na expressão grega.
- source_word: ἐν τῇ θαλάσσῃ
  choice: no mar
  rationale: Mantém o paralelismo com 'na nuvem' e segue ἐν, sem substituí-lo pela ideia narrativa de passar 'através do mar'.
theological_decisions:
- issue: Sentido de Israel ter sido 'batizado em Moisés'
  choice: Manter a linguagem tipológica e representativa sem explicá-la além do texto.
  alternative: Identificado com Moisés; batizado para se submeter à liderança de Moisés.
  rationale: Paulo estabelece uma analogia entre a experiência do êxodo de Israel e o batismo cristão. A tradução preserva essa tensão teológica em vez de impor uma interpretação doutrinária única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores acompanha a ordem das notas, e todos os marcadores aparecem no texto principal.
