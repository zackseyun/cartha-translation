id: 1CO.10.4
reference: 1 Corinthians 10:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: pt
  text: e todos beberam a mesma bebida espiritual, pois bebiam de uma rocha espiritual que os acompanhava, e a rocha era o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Cristo”. Aqui, o termo é traduzido como “Messias” porque funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: bebida espiritual
  rationale: Preserva o termo teologicamente significativo de Paulo e o paralelo com o alimento espiritual do versículo anterior, sem restringi-lo a “simbólica” ou “sobrenatural”.
- source_word: ἔπιον
  choice: beberam
  rationale: O aoristo resume a experiência comum da geração do deserto; o pretérito perfeito é natural e distingue esta forma do imperfeito seguinte.
- source_word: ἔπινον
  choice: bebiam
  rationale: O pretérito imperfeito expressa ação contínua ou repetida e preserva o contraste aspectual com “beberam”.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: de uma rocha espiritual que os acompanhava
  rationale: “Uma” reflete a ausência de artigo; “acompanhava” transmite com naturalidade o aspecto durativo do particípio presente ἀκολουθούσης, sem decidir como a rocha os seguia.
- source_word: πέτρα
  choice: rocha
  rationale: Indica uma massa rochosa, não uma pedra pequena, e conserva a força tipológica da imagem.
- source_word: ἡ πέτρα δὲ ἦν
  choice: e a rocha era
  rationale: O conectivo “e” mantém o fluxo explicativo sem impor um contraste forte.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Neste predicado, Χριστός tem força titular; “Messias” comunica o sentido do título em português, em vez de tratá-lo como mero nome próprio.
- source_word: πάντες τὸ αὐτὸ
  choice: todos ... a mesma
  rationale: Mantém a ênfase de Paulo na experiência compartilhada por todo o grupo.
theological_decisions:
- issue: A afirmação de identidade entre a rocha e o Messias
  choice: “a rocha era o Messias”
  alternative: “a rocha representava o Messias”
  rationale: A oração equativa grega é mantida diretamente, preservando a força e a tensão da identificação cristológica sem reduzi-la a mera representação nem explicar filosoficamente sua natureza.
- issue: O sentido de “espiritual” aplicado à bebida e à rocha
  choice: Manter “espiritual”
  alternative: “simbólica” ou “sobrenatural”
  rationale: O adjetivo de Paulo permanece aberto à sua dimensão de provisão divina e significado tipológico; alternativas mais interpretativas estreitariam o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Que os acompanhava” é mais idiomático do que “que os seguia” para uma rocha e preserva o aspecto contínuo sem eliminar a imagem incomum. A única nota explica a opção titular “Messias”; seu marcador aparece no texto principal.
