base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: pt
  text: Então, o que estou dizendo? Que a comida sacrificada aos ídolos é alguma coisa[a], ou que um ídolo é alguma coisa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que uma oferta feita a um ídolo tem alguma importância”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Então, o que estou dizendo?
  rationale: Reproduz a pergunta retórica, a primeira pessoa e o valor argumentativo de οὖν em português natural.
- source_word: ὅτι
  choice: Que
  rationale: Introduz diretamente o conteúdo daquilo que Paulo poderia parecer estar afirmando, sem explicação adicional.
- source_word: εἰδωλόθυτόν
  choice: a comida sacrificada aos ídolos
  rationale: Expressa com clareza atual o alimento ligado ao sacrifício pagão, tema do contexto de 1 Coríntios 8–10.
- source_word: τί ἐστιν
  choice: é alguma coisa
  rationale: Mantém a formulação breve e deliberadamente aberta do grego quanto à realidade, ao valor ou à significância em questão.
- source_word: ἢ
  choice: ou
  rationale: Preserva a coordenação disjuntiva simples entre as duas orações paralelas.
- source_word: εἴδωλον
  choice: um ídolo
  rationale: É a designação portuguesa corrente e contextualmente precisa para a imagem cultual pagã.
theological_decisions:
- issue: Se a pergunta de Paulo atribui existência ou significado real ao alimento sacrificado e ao ídolo
  choice: Manter as duas perguntas retóricas com a expressão aberta “é alguma coisa”.
  alternative: Explicitar “tem existência real” ou “tem algum significado espiritual”.
  rationale: O grego não especifica em que sentido seriam “alguma coisa”. A tradução preserva essa tensão e evita inserir no texto principal uma conclusão metafísica ou denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “é alguma coisa” conserva o paralelismo e a concisão retórica do original.
