reference: 1 Corinthians 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: pt
  text: Nem pratiquemos imoralidade sexual, como alguns deles praticaram; e, num só dia, caíram[a] vinte e três mil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «morreram» ou «foram abatidos». O grego diz literalmente «caíram», expressão que aqui se refere à morte sob juízo.
    reason: lexical_alternative
  - marker: b
    text: Números 25:9 registra vinte e quatro mil. Aqui Paulo afirma que vinte e três mil caíram «num só dia». Isso talvez diferencie os que morreram naquele dia do total mais amplo, mas o texto mantém o número dado por Paulo sem harmonizá-lo.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Nem
  rationale: Mantém a ligação negativa com a série de advertências anterior e introduz com naturalidade a exortação em português.
- source_word: πορνεύωμεν
  choice: pratiquemos imoralidade sexual
  rationale: Expressa a exortação negativa do subjuntivo e conserva a abrangência moral de πορνεύω sem recorrer ao termo mais estreito ou antiquado «fornicar».
- source_word: καθώς
  choice: como
  rationale: Introduz de modo direto a comparação com o exemplo da geração de Israel no deserto.
- source_word: τινες αὐτῶν
  choice: alguns deles
  rationale: Reproduz com clareza a referência indefinida a parte daquele povo.
- source_word: ἐπόρνευσαν
  choice: praticaram
  rationale: Retoma de modo natural a expressão «pratiquemos imoralidade sexual» sem repetir desnecessariamente todo o complemento; o sentido permanece explícito pelo contexto imediato.
- source_word: ἔπεσαν
  choice: caíram
  rationale: Preserva a imagem do verbo grego πίπτω. Neste contexto de juízo, a queda implica morte, esclarecida em nota sem substituir a formulação do texto.
- source_word: μιᾷ ἡμέρᾳ
  choice: num só dia
  rationale: Comunica de forma idiomática o período concentrado em que ocorreu o juízo, preservando a ênfase em um único dia.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: vinte e três mil
  rationale: Traduz diretamente o número presente no texto grego, por extenso e sem harmonização.
theological_decisions:
- issue: Relação com o total registrado em Números 25:9
  choice: Manter «vinte e três mil», conforme 1 Coríntios 10:8.
  alternative: Harmonizar o texto principal com os «vinte e quatro mil» de Números 25:9 ou afirmar como certa uma solução conciliatória.
  rationale: O texto grego de 1 Coríntios declara inequivocamente «vinte e três mil». A tradução deve preservar a tensão textual, enquanto uma possível explicação pode ser apresentada apenas como possibilidade em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Imoralidade sexual» preserva a abrangência do termo grego; «num só dia» soa natural e mantém a ênfase. A repetição do verbo grego é representada de modo idiomático por «pratiquemos ... como alguns deles praticaram».
