source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: pt
  text: Portanto, meus amados, fujam da idolatria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “culto aos ídolos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Portanto
  rationale: Conjunção inferencial que apresenta a exortação como conclusão do argumento anterior; “Portanto” preserva com naturalidade essa força lógica.
- source_word: ἀγαπητοί μου
  choice: meus amados
  rationale: Vocativo afetuoso que conserva tanto o pronome possessivo quanto o calor característico da linguagem paulina.
- source_word: φεύγετε
  choice: fujam
  rationale: Imperativo presente na segunda pessoa do plural; “fujam” comunica uma ordem direta e urgente de afastamento diante de um perigo.
- source_word: ἀπὸ
  choice: da
  rationale: A preposição indica separação do objeto evitado e integra-se idiomaticamente em português à construção “fugir da”.
- source_word: τῆς εἰδωλολατρίας
  choice: idolatria
  rationale: Termo português corrente e conciso para o culto ou serviço prestado a ídolos, sem restringir indevidamente o sentido às disposições interiores.
theological_decisions:
- issue: Natureza da proibição
  choice: Uma ordem direta para evitar a idolatria, incluindo a participação no culto aos ídolos e nas práticas associadas
  alternative: Uma advertência mais estreita, limitada apenas à devoção interior a ídolos
  rationale: No contexto imediato, Paulo adverte contra a participação em refeições e práticas cultuais pagãs. O termo grego abrange a idolatria de modo geral; por isso, a tradução mantém o termo amplo sem reduzir a ordem a uma atitude meramente interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Meus amados” preserva o tom afetuoso paulino; “fujam” mantém a urgência do imperativo.
