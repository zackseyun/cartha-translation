- from: Se algum dos que não creem convidar vocês, e vocês quiserem ir, comam de tudo o que lhes for servido, sem fazer perguntas por causa da consciência.[a]
  to: Se alguém que não crê convidar vocês e vocês quiserem ir, comam tudo o que lhes for servido, sem fazer perguntas por consideração à consciência.[a]
