    rationale: Embora semanticamente defensável, a expressão é menos natural para a consideração ética indicada pelo grego. «Por consideração à consciência» é mais idiomático e mantém a ambiguidade do referente.
  - severity: low
    issue: «comam de tudo o que lhes for servido»
    rationale: A construção partitiva é aceitável, mas «comam tudo o que lhes for servido» reproduz com mais diretamente o objeto abrangente πᾶν τὸ παρατιθέμενον e soa mais fluente.
  revised_text: Se alguém que não crê convidar vocês e vocês quiserem ir, comam tudo o que lhes for servido, sem fazer perguntas por consideração à consciência.[a]
