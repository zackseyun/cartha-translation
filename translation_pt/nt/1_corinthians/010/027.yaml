review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a condição, o convite, a disposição de ir, a instrução de comer o que é servido e a proibição de investigar. A referência não especificada de «consciência» é corretamente preservada. «Alguém que não crê» exprime naturalmente o sentido de τις τῶν ἀπίστων sem tom desnecessariamente pejorativo.
  naturalness: O texto é claro e acessível. «Por causa da consciência» é possível, mas em português pode sugerir uma causa mais direta e soa menos idiomático neste contexto ético; «por consideração à consciência» comunica melhor a força de διά com o acusativo. «Comam tudo o que lhes for servido» é mais direto do que «comam de tudo o que lhes for servido» e preserva o escopo de πᾶν.
  terminology: «Consciência» é o termo estabelecido e adequado para συνείδησις. «Não creem» mantém registro moderno e não hostil. A nota preserva apropriadamente as alternativas de ἀνακρίνοντες e não resolve prematuramente a ambiguidade sobre de quem é a consciência.
  issues:
