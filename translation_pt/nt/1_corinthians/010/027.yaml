  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: pt
  text: Se alguém que não crê convidar vocês e vocês quiserem ir, comam tudo o que lhes for servido, sem fazer perguntas por consideração à consciência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem examinar nada” ou “sem procurar saber”. A ideia é não investigar a procedência da comida. O versículo seguinte esclarece a questão da consciência, distinguindo a consciência da outra pessoa da consciência de quem come.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: dos que não creem
  rationale: Expressa em português atual as pessoas caracterizadas pela falta de fé, provavelmente anfitriões não cristãos, sem acrescentar tom hostil.
- source_word: καλεῖ
  choice: convidar
  rationale: No contexto de uma refeição, o verbo significa naturalmente fazer um convite, não apenas chamar.
- source_word: θέλετε πορεύεσθαι
  choice: vocês quiserem ir
  rationale: Preserva tanto a disposição voluntária quanto a condição envolvida em aceitar o convite.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: de tudo o que lhes for servido
  rationale: Comunica de modo natural a abrangência de πᾶν e o ato de pôr comida diante dos convidados.
- source_word: ἐσθίετε
  choice: comam
  rationale: O imperativo presente formula uma orientação geral; o imperativo simples em português transmite essa força adequadamente.
- source_word: μηδὲν ἀνακρίνοντες
  choice: sem fazer perguntas
  rationale: No contexto, a ideia é não investigar a procedência ou o histórico da comida; a formulação mantém a força prática sem especificar mais do que o grego.
- source_word: διὰ τὴν συνείδησιν
  choice: por causa da consciência
  rationale: Mantém a relação de motivo ou consideração expressa por διά com o acusativo e não determina antecipadamente de quem é a consciência.
theological_decisions:
- issue: Sentido de συνείδησις no contexto
  choice: Manter a referência geral à consciência, deixando o versículo seguinte esclarecer de quem ela é.
  alternative: Especificar aqui a consciência do próprio cristão ou a consciência da outra pessoa.
  rationale: A formulação grega deste versículo é breve e não explicita o possuidor; especificá-lo eliminaria uma ambiguidade que Paulo esclarece no contexto imediato.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para o plural. “Dos que não creem” evita a possível carga pejorativa de “descrentes”; “lhes for servido” é idiomático no contexto de uma refeição. O marcador foi colocado após a oração final porque a nota reúne a alternativa lexical de ἀνακρίνοντες e a explicação contextual de συνείδησις.
