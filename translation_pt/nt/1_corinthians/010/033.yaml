base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: pt
  text: Assim como eu também agrado a todos em tudo[a], não buscando o meu próprio benefício, mas o de muitos[b], para que sejam salvos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo a todos”. O grego diz mais literalmente “a todos em tudo” e expressa uma ampla disposição de acomodar-se visando ao bem alheio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a minha própria vantagem, mas a vantagem de muitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: assim como eu também
  rationale: Preserva a comparação com a exortação anterior e apresenta Paulo como exemplo.
- source_word: πάντα πᾶσιν
  choice: a todos em tudo
  rationale: Reproduz de modo natural a expressão ampla do grego sem importar exatamente a formulação de 1 Coríntios 9:22.
- source_word: ἀρέσκω
  choice: procuro agradar
  rationale: Expressa o sentido contextual de empenhar-se em atender aos outros para o bem deles, reduzindo a possível impressão de mera bajulação sem alterar o valor lexical básico.
- source_word: μὴ ζητῶν
  choice: não buscando
  rationale: Mantém o particípio de maneira ou motivação em formulação corrente e direta.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: o meu próprio benefício
  rationale: σύμφορον indica aquilo que é benéfico ou vantajoso; “benefício” permite manter o paralelismo elíptico da frase seguinte.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: mas o de muitos
  rationale: Preserva a construção elíptica e o sentido literal de οἱ πολλοί, sem generalizá-lo para “todos” ou “os outros”.
- source_word: ἵνα σωθῶσιν
  choice: para que sejam salvos
  rationale: Mantém tanto a finalidade expressa por ἵνα como a voz passiva e o sentido salvífico normal de σῴζω neste contexto paulino.
theological_decisions:
- issue: Alcance e sentido de σωθῶσιν
  choice: “sejam salvos”, no sentido salvífico paulino comum
  alternative: “sejam ajudados” ou “sejam preservados”
  rationale: O contexto evangelístico e o uso de σῴζω em 1 Coríntios favorecem a salvação, mantendo-se a voz passiva sem explicitar além do texto o agente.
- issue: Sentido de agradar às pessoas
  choice: empenhar-se em agradar ou acomodar-se visando ao bem e à salvação delas
  alternative: buscar aprovação humana ou fazer concessões por bajulação
  rationale: 'A oração seguinte define a motivação de Paulo: ele não procura benefício próprio, mas o de muitos. “Procuro agradar” conserva o verbo e torna perceptível esse caráter intencional.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém a ligação sintática com o versículo anterior, a elipse do original e sua tensão entre agradar às pessoas e não buscar aprovação egoísta.
