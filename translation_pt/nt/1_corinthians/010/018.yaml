  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: pt
  text: Considerem Israel segundo a carne:[a] os que comem dos sacrifícios não são participantes do altar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Israel por descendência natural” ou “o Israel étnico”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não têm comunhão com o altar?” ou “não participam do altar?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Considerem
  rationale: O imperativo plural pede atenção reflexiva no desenvolvimento do argumento, não apenas o ato físico de olhar.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Israel segundo a carne
  rationale: Preserva a formulação paulina e sua ambiguidade genuína; neste contexto, a expressão aponta para Israel quanto à descendência natural, sem introduzir a ideia de 'natureza pecaminosa'.
- source_word: οὐχ ... εἰσίν;
  choice: não participam ...?
  rationale: Mantém a pergunta retórica introduzida por οὐχ, que espera resposta afirmativa.
- source_word: οἱ ἐσθίοντες
  choice: os que comem
  rationale: Reproduz de modo natural o particípio substantivado e conserva a ação concreta de comer.
- source_word: τὰς θυσίας
  choice: dos sacrifícios
  rationale: A construção portuguesa 'comer dos sacrifícios' expressa naturalmente comer uma porção das ofertas sacrificiais.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: participam do altar
  rationale: Expressa a participação real na realidade cultual ligada ao altar, com construção natural em português e sem sugerir presença física dentro dele.
theological_decisions:
- issue: Sentido de 'Israel segundo a carne'
  choice: Manter a expressão formal, entendida no contexto como Israel segundo a descendência natural
  alternative: Israel por descendência natural; o Israel étnico
  rationale: A formulação preserva a linguagem e a tensão paulinas sem resolver debates mais amplos sobre Israel e a igreja.
- issue: Natureza da participação no altar
  choice: Participação cultual representada pelo ato de comer dos sacrifícios
  alternative: Comunhão com o altar; participantes do altar
  rationale: κοινωνοί indica partilha ou associação real. A tradução evita definir além do que o argumento analógico de Paulo afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural 'Considerem' torna explícito o número do imperativo grego. A expressão paulina 'segundo a carne' é mantida no texto e esclarecida em nota.
