source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: pt
  text: Contudo, Deus não se agradou da maioria deles, pois ficaram prostrados[a] no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram abatidos” ou “foram espalhados pelo chão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Contudo
  rationale: Marca com naturalidade o forte contraste com os privilégios de Israel mencionados nos versículos anteriores.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: não se agradou da maioria deles
  rationale: Expressa idiomaticamente em português a construção de εὐδοκέω com ἐν e preserva o sentido quantitativo de τοῖς πλείοσιν.
- source_word: ηὐδόκησεν
  choice: se agradou
  rationale: Equivalente corrente de εὐδοκέω neste contexto; com a negação, comunica que Deus não teve prazer nem aprovação neles.
- source_word: ὁ θεός
  choice: Deus
  rationale: Correspondência direta ao sujeito nominativo grego.
- source_word: κατεστρώθησαν
  choice: ficaram prostrados
  rationale: Preserva a imagem vívida de pessoas abatidas e estendidas pelo chão, implicando morte sob juízo, sem explicitar além do verbo grego o agente da ação.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo conciso a explicação que comprova o desagrado de Deus.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: Forma natural e amplamente reconhecida em português para o cenário das peregrinações de Israel.
theological_decisions:
- issue: Natureza do juízo descrito por κατεστρώθησαν
  choice: O texto retrata a maioria dos israelitas prostrada, isto é, morta no deserto em consequência do desagrado divino.
  alternative: Traduzir de modo mais explicitamente judicial, como “foram abatidos”, ou conservar mais literalmente a imagem de corpos “espalhados” no deserto.
  rationale: “Ficaram prostrados” conserva a imagem concreta e o resultado mortal no contexto da advertência de Paulo, sem inserir no próprio verbo um agente expresso que o grego deixa implícito.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Contudo” mantém o contraste enfático; “no deserto” conserva a linguagem bíblica corrente. O marcador da nota foi colocado após a oração a que se refere.
