id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: pt
  text: Vocês não podem beber o cálice do Senhor e o cálice dos demônios; não podem participar da mesa do Senhor e da mesa dos demônios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: vocês não podem
  rationale: Expressa de modo direto e natural a impossibilidade ou incompatibilidade categórica indicada pela forma grega, repetida nas duas orações.
- source_word: ποτήριον
  choice: cálice
  rationale: É o equivalente consagrado e natural neste contexto ritual, preservando as conotações de comunhão sem explicitá-las além do texto.
- source_word: κυρίου
  choice: do Senhor
  rationale: Reproduz o genitivo e mantém o paralelismo solene com “dos demônios”.
- source_word: πίνειν
  choice: beber
  rationale: Infinitivo simples e idiomático depois de “podem”, sem acrescentar aspecto progressivo.
- source_word: δαιμονίων
  choice: demônios
  rationale: Equivalente transparente que preserva a referência a seres espirituais pessoais, sem paráfrase interpretativa.
- source_word: τραπέζης
  choice: mesa
  rationale: Correspondência direta que conserva simultaneamente a imagem cultual e comunitária; “altar” seria mais interpretativo.
- source_word: μετέχειν
  choice: participar da
  rationale: Comunica envolvimento ou partilha real e é corrente no português moderno; evita o menos natural “tomar parte da” e o mais tradicional “participar à mesa”.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação e o paralelismo enfático do original.
theological_decisions:
- issue: Natureza da negação de Paulo quanto à adoração pagã e à mesa do Senhor
  choice: Incompatibilidade categórica entre beber/participar em ambos os âmbitos
  alternative: Mera exortação retórica ou recomendação contra a prática
  rationale: A repetição de οὐ δύνασθε apresenta incompatibilidade enfática. “Não podem” preserva essa força sem explicar se a impossibilidade é moral, espiritual ou de outra natureza.
- issue: Sentido cultual de “cálice” e “mesa”
  choice: Conservar as metáforas concretas sem expansão doutrinária
  alternative: Explicitar como Ceia do Senhor e sacrifícios ou refeições idolátricas
  rationale: O contexto sustenta essas associações, mas o versículo usa apenas “cálice” e “mesa”; a tradução não deve resolver além do que está lexicalmente expresso.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para o plural explícito. A estrutura paralela e a repetição de “não podem” foram preservadas. Nenhuma nota é necessária, pois “participar da mesa” transmite adequadamente μετέχειν τραπέζης sem perda relevante ou ambiguidade que exija alternativa.
