  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: pt
  text: Porque há um só pão[a], nós, embora muitos, somos um só corpo, pois todos participamos do único pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um único pão”, nas duas ocorrências. O grego ἄρτος pode designar um pão como uma unidade, o que pode ressaltar a imagem de muitos compartilhando de uma mesma fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Porque
  rationale: Introduz a razão explicativa ligada à afirmação anterior e conserva com clareza o valor causal.
- source_word: εἷς ἄρτος
  choice: um só pão
  rationale: “Pão” é natural em português e preserva a ressonância da Ceia já presente no contexto; “um só” destaca a unidade expressa pelo numeral.
- source_word: ἓν σῶμα
  choice: um só corpo
  rationale: Mantém a imagem comunitária e sua densidade teológica sem explicá-la além do que o texto afirma.
- source_word: οἱ πολλοί
  choice: nós, embora muitos
  rationale: Expressa de modo natural o contraste entre a multiplicidade das pessoas e a unidade do corpo.
- source_word: γὰρ
  choice: pois
  rationale: Introduz naturalmente em português a explicação da afirmação precedente.
- source_word: πάντες
  choice: todos
  rationale: Preserva a ênfase na participação comum de todo o grupo.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: do único pão
  rationale: A preposição marca a fonte ou aquilo de que todos compartilham; “do único pão” é idiomático com “participamos” e mantém a singularidade.
- source_word: μετέχομεν
  choice: participamos
  rationale: Comunica envolvimento e partilha efetivos, ajusta-se ao contexto da refeição e evita o tom arcaico de “participamos de/comemos de” em formulações alternativas.
theological_decisions:
- issue: Relação entre o único pão e o único corpo
  choice: Preservar a ligação causal entre a participação comum no pão e a unidade dos muitos em um corpo.
  alternative: Explicitar uma leitura estritamente simbólica ou uma ontologia sacramental específica.
  rationale: O grego relaciona diretamente o pão compartilhado e a unidade dos fiéis, mas não exige que a tradução decida debates confessionais posteriores sobre a natureza da Ceia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “nós, embora muitos” conserva o contraste retórico sem rigidez; “um só” e “único” evitam repetição excessiva, mantendo a unidade lexical e conceitual do grego.
