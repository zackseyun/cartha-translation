id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: pt
  text: Nenhuma tentação sobreveio a vocês que não fosse humana.[a] Mas Deus é fiel e não permitirá que vocês sejam tentados[b] além do que podem suportar; pelo contrário, juntamente com a tentação, ele também providenciará a saída,[c] para que possam suportá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que não fosse comum às pessoas” ou “que não fosse própria da condição humana”.'
    reason: lexical_alternative
  - marker: b
    text: “Tentação” e “sejam tentados” também podem ser traduzidos por “provação” e “sejam provados”.
    reason: lexical_alternative
  - marker: c
    text: “A saída” também pode significar “o escape” ou “o desfecho”; no contexto, é aquilo que Deus providencia para tornar possível suportar a experiência.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: tentação / sejam tentados
  rationale: O campo semântico inclui tentação, provação e teste. O contexto imediato de desejos pecaminosos e idolatria favorece a dimensão moral, sem excluir o sentido mais amplo, registrado em nota.
- source_word: εἴληφεν
  choice: sobreveio
  rationale: Expressa de modo natural que a tentação veio sobre os destinatários; o perfeito grego apresenta a experiência como já ocorrida e presente em seus efeitos.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: que não fosse humana
  rationale: 'Mantém o sentido direto de ἀνθρώπινος: algo humano, próprio da experiência humana, e evita acrescentar ao texto a noção explícita de frequência contida em ''comum''.'
- source_word: πιστός
  choice: fiel
  rationale: Comunica a confiabilidade constante de Deus no cumprimento do que é afirmado.
- source_word: ἐάσει
  choice: não permitirá
  rationale: Equivalente claro e digno para a ideia de permitir ou deixar acontecer.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: além do que podem suportar
  rationale: No contexto, a capacidade mencionada é a de resistir ou suportar a tentação; a formulação torna essa relação natural em português.
- source_word: ποιήσει
  choice: providenciará
  rationale: Embora ποιέω seja literalmente 'fazer', com ἔκβασις indica que Deus produz ou fornece a saída.
- source_word: σὺν τῷ πειρασμῷ
  choice: juntamente com a tentação
  rationale: 'Preserva a ideia de acompanhamento: a provisão divina ocorre junto da tentação, não necessariamente por sua remoção imediata.'
- source_word: ἔκβασιν
  choice: a saída
  rationale: É uma tradução concisa de 'saída/escape/desfecho'. A frase final esclarece que essa saída capacita a perseverança.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: para que possam suportá-la
  rationale: Representa o valor de propósito ou resultado do infinitivo articular e explicita o objeto implícito de ὑποφέρω de modo natural em português.
theological_decisions:
- issue: Sentido de πειρασμός e πειρασθῆναι
  choice: Tentação e ser tentado no texto principal
  alternative: Provação/teste e ser provado/testado
  rationale: As advertências anteriores contra desejo mau e idolatria favorecem 'tentação', mas os termos gregos também podem designar prova ou provação. A nota preserva essa amplitude sem atribuir a Deus a incitação ao mal.
- issue: Natureza da 'saída' fornecida por Deus
  choice: A saída é apresentada em conexão com a capacidade de suportar a tentação
  alternative: Escape imediato ou desfecho
  rationale: A oração final não promete necessariamente a remoção instantânea da dificuldade; afirma que a provisão divina torna possível suportá-la. A tradução conserva essa tensão.
- issue: Alcance de ἀνθρώπινος
  choice: Humana
  alternative: Comum às pessoas / própria da condição humana
  rationale: O adjetivo descreve a tentação como humana, sem indicar algo sobre-humano ou singular. A nota oferece formulações explicativas sem restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural 'vocês' reflete os destinatários coletivos. A construção evita linguagem excessivamente técnica e preserva a relação entre a provisão divina e a perseverança.
