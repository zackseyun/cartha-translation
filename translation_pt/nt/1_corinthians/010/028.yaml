  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: pt
  text: 'Mas, se alguém disser a vocês: “Isto foi oferecido em sacrifício”[a], não comam, por consideração à pessoa que os informou e por causa da consciência[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isto é alimento sacrificial”. O adjetivo grego se refere a algo oferecido em sacrifício.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, por causa da consciência da outra pessoa, não da consciência de quem comeria; veja o versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Mas, se alguém disser a vocês
  rationale: A construção ἐὰν com o subjuntivo aoristo apresenta uma situação condicional; τις é indefinido e corresponde naturalmente a “alguém”. δέ marca o contraste com o cenário anterior e é traduzido por “Mas”.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Isto foi oferecido em sacrifício
  rationale: ἱερόθυτος designa algo oferecido em sacrifício, especialmente alimento ou carne de uma oferta cultual. A formulação verbal é clara e natural em português e evita inserir “ídolo”, termo que não está expresso neste adjetivo.
- source_word: μὴ ἐσθίετε
  choice: não comam
  rationale: O imperativo presente com μή expressa proibição. Em português, o objeto pode permanecer implícito porque o alimento acaba de ser identificado; o plural corresponde aos destinatários.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: por consideração à pessoa que os informou
  rationale: διά com acusativo indica aqui motivo ou consideração. μηνύσαντα significa quem informou, comunicou ou revelou o fato. “Por consideração” explicita de modo natural que a abstinência visa ao bem dessa pessoa.
- source_word: καὶ τὴν συνείδησιν
  choice: e por causa da consciência
  rationale: συνείδησις significa “consciência”. A expressão grega é concisa e coordenada à razão anterior; “por causa de” produz uma frase natural sem determinar no corpo do versículo de quem é a consciência.
theological_decisions:
- issue: De quem é a consciência indicada por τὴν συνείδησιν
  choice: Manter “a consciência” sem especificar no texto principal; a nota esclarece que o contexto aponta para a consciência da outra pessoa.
  alternative: 'Explicitar no texto: “por causa da consciência dessa pessoa”.'
  rationale: O versículo seguinte esclarece que Paulo não se refere à consciência do próprio destinatário, mas à do outro. Preservar aqui a formulação concisa mantém a progressão argumentativa e a tensão momentânea do original, enquanto a nota auxilia o leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” e flexão verbal correspondente, evitando regionalismos marcados. A tradução preserva a concisão do grego e deixa para a nota a identificação contextual da consciência.
