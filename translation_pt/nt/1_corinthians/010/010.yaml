  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: pt
  text: E não reclamem, como alguns deles reclamaram e foram destruídos pelo destruidor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo anjo destruidor”. O grego diz “pelo destruidor”, possivelmente aludindo ao agente de destruição nos juízos sofridos por Israel no deserto.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: E não
  rationale: Liga esta proibição às advertências anteriores e soa natural em português atual.
- source_word: γογγύζετε
  choice: fiquem reclamando
  rationale: Expressa a ação contínua ou habitual de manifestar descontentamento; é mais corrente do que “murmurar” e mais clara do que uma formulação excessivamente literal.
- source_word: καθάπερ
  choice: como
  rationale: Introduz de modo claro e natural a comparação com o exemplo de Israel.
- source_word: τινὲς αὐτῶν
  choice: alguns deles
  rationale: Mantém diretamente a expressão partitiva e sua referência contextual aos israelitas.
- source_word: ἐγόγγυσαν
  choice: reclamaram
  rationale: Repete a mesma raiz lexical usada na ordem anterior, preservando a ligação retórica do grego.
- source_word: ἀπώλοντο
  choice: foram destruídos
  rationale: A construção com agente expresso favorece uma forma passiva explícita, em vez de “pereceram”.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: pelo Destruidor
  rationale: Traduz o substantivo grego sem especificar além do texto a identidade do agente. A inicial maiúscula sinaliza seu uso como título definido.
theological_decisions:
- issue: Identidade de ὁ ὀλοθρευτής
  choice: o Destruidor
  alternative: o anjo destruidor
  rationale: O grego designa o agente como “o destruidor”, mas não o identifica explicitamente como anjo. O texto principal preserva essa indeterminação, e a interpretação tradicional fica na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Fiquem reclamando” evita o tom arcaico de “murmureis” ou “murmurar”, enquanto “Destruidor” conserva o título substantivado e a ambiguidade do original.
