  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: pt
  text: Falo a vocês como a pessoas sensatas[a]; julguem vocês mesmos[b] o que digo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pessoas sábias” ou “pessoas prudentes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “julguem por vocês mesmos o que digo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: como a
  rationale: Introduz a condição em que Paulo considera seus destinatários ao lhes dirigir a palavra; em português, “falo a vocês como a pessoas...” expressa isso naturalmente.
- source_word: φρονίμοις
  choice: pessoas sensatas
  rationale: O termo denota bom senso, prudência e discernimento prático. “Sensatas” é atual e evita exagerar o sentido com “sábias”.
- source_word: λέγω
  choice: Falo
  rationale: Neste contexto, “falo a vocês” forma uma construção portuguesa natural e mantém o ato de dirigir-se aos leitores.
- source_word: κρίνατε
  choice: julguem
  rationale: Preserva a força do imperativo e a ideia de avaliar ponderadamente a afirmação de Paulo.
- source_word: ὑμεῖς
  choice: vocês mesmos
  rationale: O pronome grego explícito é enfático; “vocês mesmos” conserva essa ênfase sem acrescentar a nuance potencialmente distinta de “por si mesmos”.
- source_word: ὅ
  choice: o que
  rationale: Equivalente natural do pronome relativo neutro usado como objeto de φημί.
- source_word: φημι
  choice: digo
  rationale: Traduz de modo conciso a ideia de dizer ou afirmar, preservando a repetição conceitual com λέγω sem tornar a frase artificial.
theological_decisions:
- issue: Caracterização retórica dos destinatários
  choice: Paulo se dirige aos coríntios como pessoas capazes de discernimento sensato, sem declarar aprovação moral irrestrita.
  alternative: Entender a expressão como ironia ou como elogio pleno à sabedoria deles.
  rationale: A formulação positiva, porém moderada, preserva a possibilidade retórica do contexto sem impor ironia nem transformar a fala em aprovação abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta conserva a ênfase do pronome grego e mantém o convite de Paulo à avaliação.
