id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: pt
  text: Refiro-me à consciência do outro[a], não à sua própria. Pois por que a minha liberdade é julgada pela consciência de outra pessoa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não à sua própria, mas à do outro”. O contexto favorece o sentido “não à sua própria, mas à consciência do outro”.'
    reason: lexical_alternative
  - marker: b
    text: Esta pergunta retórica pode ser entendida tanto como um questionamento do próprio Paulo quanto como uma objeção que ele apresenta sem marcas explícitas de citação no grego.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: consciência
  rationale: Em Paulo, o termo designa a consciência moral pela qual a pessoa avalia seus atos; “consciência” é o equivalente português corrente e preciso.
- source_word: δὲ λέγω
  choice: Refiro-me
  rationale: A expressão esclarece o que Paulo quis dizer no contexto anterior. “Refiro-me” comunica essa função explicativa sem introduzir um marcador temporal inexistente.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: à consciência do outro, não à sua própria
  rationale: A formulação torna explícito o substantivo subentendido e expressa naturalmente em português o contraste contextual entre a consciência do destinatário e a de outra pessoa.
- source_word: ἱνατί γὰρ
  choice: Pois por que
  rationale: “Pois” preserva a ligação explicativa de γάρ, enquanto “por que” mantém a força retórica de ἱνατί.
- source_word: ἐλευθερία
  choice: liberdade
  rationale: É o equivalente moderno e direto no contexto da liberdade de agir.
- source_word: κρίνεται
  choice: é julgada
  rationale: Preserva o sentido amplo de avaliação ou juízo sem restringi-lo indevidamente à condenação.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: pela consciência de outra pessoa
  rationale: Identifica com clareza o agente do julgamento e soa mais natural em português do que “por outra consciência”.
theological_decisions:
- issue: Referente do contraste possessivo na primeira oração
  choice: O texto principal apresenta a consciência do outro em contraste com a consciência do destinatário.
  alternative: 'Traduzir de modo estritamente formal: “não à sua própria, mas à do outro”, mantendo menos explícito o referente contextual do possessivo.'
  rationale: Embora ἑαυτοῦ tenha forma de terceira pessoa, o discurso dirige-se aos coríntios e esclarece a instrução anterior. A redação escolhida comunica esse sentido contextual, enquanto a nota registra a forma mais literal.
- issue: Voz da pergunta retórica
  choice: A pergunta permanece sem indicação explícita de mudança de interlocutor.
  alternative: Entendê-la como uma objeção formulada por um interlocutor coríntio, ou exclusivamente como um desafio do próprio Paulo.
  rationale: O grego não contém marcas de citação ou mudança de voz. A tradução preserva a ambiguidade, e a nota informa as duas possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Refiro-me” dá naturalidade à explicação; “consciência de outra pessoa” evita a construção pouco idiomática “outra consciência”. Todos os marcadores de nota aparecem no texto principal.
