  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: pt
  text: Comam de tudo o que se vende no mercado de carnes, sem fazer perguntas[a] por causa da consciência,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem investigar nada” ou “sem procurar saber”; o sentido é não investigar a procedência da carne.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: de tudo o que se vende
  rationale: A expressão neutra substantivada tem sentido abrangente, “tudo aquilo que é vendido”. A formulação portuguesa é natural e preserva essa abrangência.
- source_word: ἐν μακέλλῳ
  choice: no mercado de carnes
  rationale: μάκελλον designa especificamente um mercado onde se vendia carne, não um mercado genérico. “Mercado de carnes” comunica o cenário sem sugerir necessariamente uma única loja ou açougue.
- source_word: ἐσθίετε
  choice: Comam
  rationale: Imperativo presente ativo na segunda pessoa do plural. “Comam” é direto, natural e adequado ao português moderno.
- source_word: μηδὲν ἀνακρίνοντες
  choice: sem fazer perguntas
  rationale: ἀνακρίνω pode significar examinar, investigar ou interrogar. No contexto, trata-se de não investigar a procedência da carne; “sem fazer perguntas” expressa isso de modo idiomático, enquanto a nota preserva alternativas lexicais.
- source_word: διὰ τὴν συνείδησιν
  choice: por causa da consciência
  rationale: διά com acusativo indica aqui motivo ou consideração. A expressão mantém a referência genérica à consciência e evita identificar antecipadamente de quem ela é.
theological_decisions:
- issue: Referente de “consciência”
  choice: Manter simplesmente “a consciência”, sem pronome possessivo
  alternative: “a consciência de vocês” ou “a consciência da outra pessoa”
  rationale: O grego diz literalmente “a consciência” e, neste versículo isolado, não explicita o referente. A tradução preserva essa ambiguidade até que o contexto seguinte a esclareça.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com forma verbal plural de uso brasileiro. A vírgula final foi mantida porque o versículo continua sintaticamente no texto seguinte.
