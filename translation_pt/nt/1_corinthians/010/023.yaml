  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: pt
  text: “Tudo é permitido”, mas nem tudo é benéfico.[a] “Tudo é permitido”, mas nem tudo edifica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo é lícito”. As aspas indicam que esta expressão provavelmente era um lema dos coríntios que Paulo qualifica; também é possível lê-la sem aspas como uma afirmação do próprio Paulo.'
    reason: Alternativa lexical e ambiguidade interpretativa da pontuação.
lexical_decisions:
- source_word: Πάντα
  choice: Tudo
  rationale: O neutro plural substantivado tem alcance geral. Em português, “tudo” reproduz de modo natural e conciso a formulação abrangente e sua repetição enfática.
- source_word: ἔξεστιν
  choice: é permitido
  rationale: O verbo indica aquilo que é lícito ou permitido. “É permitido” é claro e corrente, além de conservar a concisão da provável fórmula citada.
- source_word: ἀλλ’
  choice: mas
  rationale: Conjunção adversativa simples; “mas” preserva diretamente os dois contrastes breves do grego.
- source_word: συμφέρει
  choice: é benéfico
  rationale: O verbo expressa aquilo que traz proveito ou vantagem. “É benéfico” comunica o sentido ético com clareza, sem a possível conotação comercial de “lucrativo”.
- source_word: οἰκοδομεῖ
  choice: edifica
  rationale: O verbo mantém aqui a metáfora paulina de construir ou fortalecer pessoas e a comunidade. “Edifica” é conciso, digno e amplamente compreensível no contexto bíblico.
theological_decisions:
- issue: Se Πάντα ἔξεστιν deve ser marcado como uma citação de um lema coríntio
  choice: 'Usar aspas: “Tudo é permitido”'
  alternative: Apresentar a expressão sem aspas, como afirmação não marcada do próprio Paulo
  rationale: É provável que Paulo esteja retomando e limitando um lema dos coríntios. Como os manuscritos gregos não empregavam aspas modernas, essa pontuação é interpretativa; a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura paralela e a repetição do original foram preservadas. “Edifica” conserva a metáfora comunitária paulina sem explicá-la excessivamente.
