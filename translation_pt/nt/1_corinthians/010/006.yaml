id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: pt
  text: Essas coisas se tornaram exemplos para nós[a], a fim de que não sejamos pessoas que desejam coisas más, como eles também desejaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tipos para nós” ou “modelos para nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Essas coisas
  rationale: O demonstrativo neutro plural retoma os acontecimentos no deserto já narrados. “Essas coisas” é natural e evita explicitar “acontecimentos”, que seria um pouco mais interpretativo.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca transição ou desenvolvimento leve; em português, o fluxo é natural sem acrescentar “agora”, “mas” ou “e”, que poderiam dar uma força indevida.
- source_word: τύποι
  choice: exemplos
  rationale: No contexto de exortação, refere-se a precedentes instrutivos. “Exemplos” comunica isso com clareza, enquanto “tipos” pode soar excessivamente técnico. As alternativas legítimas são preservadas em nota.
- source_word: ἡμῶν
  choice: para nós
  rationale: Com τύποι, o genitivo indica pertinência e aplicação à comunidade; “para nós” é a formulação idiomática em português.
- source_word: ἐγενήθησαν
  choice: se tornaram
  rationale: Preserva a noção de que essas coisas vieram a funcionar como exemplos, em vez de simplesmente afirmar que “eram” exemplos.
- source_word: εἰς τὸ μὴ εἶναι
  choice: a fim de que não sejamos
  rationale: Expressa adequadamente a finalidade ou resultado pretendido da advertência e mantém o verbo εἶναι.
- source_word: ἐπιθυμητὰς
  choice: pessoas que desejam
  rationale: O substantivo designa quem deseja ou cobiça. A perífrase é clara e natural, sem restringir o sentido à esfera sexual.
- source_word: κακῶν
  choice: coisas más
  rationale: O neutro plural genitivo indica os objetos do desejo e conserva a força moral ampla do termo.
- source_word: καθὼς
  choice: como
  rationale: Introduz naturalmente a comparação com a geração do deserto; “assim como” também seria possível, mas é mais enfático do que o necessário.
- source_word: κἀκεῖνοι
  choice: eles também
  rationale: Preserva tanto a referência àquelas pessoas quanto a força aditiva de καί.
- source_word: ἐπεθύμησαν
  choice: desejaram
  rationale: Mantém a ligação lexical com “pessoas que desejam”. O objeto permanece subentendido, como no grego, e é recuperável pelo contexto imediato.
theological_decisions:
- issue: Sentido de τύποι em relação às experiências de Israel no deserto
  choice: “exemplos”, em sentido de advertência ética
  alternative: “tipos” ou “modelos”
  rationale: O argumento imediato destaca a função instrutiva e admonitória dos acontecimentos, sem exigir que o termo seja entendido como uma categoria tipológica técnica. A nota preserva a amplitude lexical.
- issue: Amplitude da linguagem de desejo em ἐπιθυμητάς e ἐπεθύμησαν
  choice: “pessoas que desejam” e “desejaram”
  alternative: “cobiçadores” e “cobiçaram”
  rationale: O texto trata de desejo moralmente mau em sentido amplo. “Desejar” evita restringir a referência a desejo sexual, enquanto “coisas más” deixa explícita sua qualidade moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “não sejamos pessoas que desejam” conserva a forma nominal do grego, embora seja deliberadamente mais marcada que o simples “não desejemos”. O marcador [a] aparece junto de “exemplos”.
