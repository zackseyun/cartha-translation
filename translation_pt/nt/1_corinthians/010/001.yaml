reference: 1 Corinthians 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: pt
  text: Pois não quero, irmãos[a], que vocês fiquem sem saber que nossos pais estavam todos sob a nuvem e todos passaram pelo mar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; em grego, “irmãos” pode dirigir-se a uma congregação composta por homens e mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: não quero que vocês desconheçam
  rationale: Preserva a formulação negativa característica de Paulo e comunica falta de conhecimento sem sugerir necessariamente o ato deliberado de ignorar.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior de modo natural em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do grego; no contexto, o vocativo se dirige à congregação inteira, como esclarece a nota.
- source_word: οἱ πατέρες ἡμῶν
  choice: nossos pais
  rationale: Preserva a linguagem familiar e a identificação retórica dos leitores com a história de Israel, em vez de generalizá-la como simples ancestralidade.
- source_word: πάντες
  choice: todos
  rationale: Mantém as duas ocorrências e sua repetição enfática, importante para o desenvolvimento do argumento.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: estiveram todos debaixo da nuvem
  rationale: Reproduz com clareza a imagem da nuvem do êxodo e sua posição sobre o povo.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: todos passaram pelo mar
  rationale: Expressa o movimento através do mar sem acrescentar detalhes não explicitados no texto.
theological_decisions:
- issue: O alcance do vocativo ἀδελφοί numa congregação composta por homens e mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma lexical masculina do original, enquanto a nota registra que, no uso congregacional, ela pode incluir ambos os sexos.
- issue: A identificação corporativa da igreja, inclusive seus membros gentios, com Israel em οἱ πατέρες ἡμῶν
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A opção mantém a linguagem familiar deliberada de Paulo e a tensão teológica de ele chamar a geração do êxodo de “nossos pais” ao falar aos coríntios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo. A ordem e a repetição de “todos” preservam a ênfase retórica do grego.
