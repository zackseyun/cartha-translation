lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: estamos provocando ... ao ciúme
  rationale: 'Expressa o sentido causativo do verbo no presente: despertar ciúme por causa de uma lealdade rival.'
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Equivalente natural e tradicional de κύριος neste contexto, mantendo aberta a referência cristológica e a alusão veterotestamentária.
- source_word: μὴ
  choice: Por acaso
  rationale: Introduz em português uma pergunta retórica cuja resposta esperada é negativa.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: mais fortes do que ele
  rationale: Reproduz diretamente o comparativo e o pronome sem acrescentar interpretação.
theological_decisions:
- issue: O ciúme divino
  choice: provocando o Senhor ao ciúme
  alternative: despertando o zelo do Senhor
  rationale: Mantém a imagem bíblica de ciúme ligada à exclusividade da aliança, sem suavizar sua tensão teológica.
- issue: Força da segunda pergunta retórica
  choice: Por acaso somos mais fortes do que ele?
  alternative: Certamente não somos mais fortes do que ele, somos?
  rationale: A forma interrogativa natural em português comunica claramente a resposta negativa esperada por μή, sem inserir uma afirmação explícita ausente do grego.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação das duas perguntas retóricas do original.
