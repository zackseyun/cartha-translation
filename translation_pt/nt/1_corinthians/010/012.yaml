  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: pt
  text: Portanto[a], quem pensa estar de pé cuide para não cair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, quem pensa que está de pé tenha cuidado para não cair.”'
    reason: Alternativa lexical e sintática para ὥστε, ἑστάναι e βλεπέτω.
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Conjunção inferencial que tira uma conclusão dos exemplos de advertência anteriores; “Portanto” é claro e natural em português.
- source_word: ὁ δοκῶν
  choice: quem pensa
  rationale: O particípio presente substantivado designa de modo representativo qualquer pessoa que tenha essa convicção; “quem pensa” reproduz isso naturalmente.
- source_word: ἑστάναι
  choice: estar de pé
  rationale: O infinitivo perfeito de ἵστημι expressa o estado de estar em pé. A formulação evita acrescentar a ideia de firmeza, que não está explícita.
- source_word: βλεπέτω
  choice: cuide
  rationale: O imperativo presente pede vigilância contínua. “Cuide” mantém a força da advertência em português corrente e digno.
- source_word: μὴ πέσῃ
  choice: para não cair
  rationale: μή com o subjuntivo aoristo após o imperativo expressa prevenção ou propósito negativo; “para não cair” é idiomático e preserva a advertência.
theological_decisions:
- issue: Natureza da “queda” na advertência de Paulo
  choice: Manter a advertência geral “cair”, sem especificar em que consiste a queda.
  alternative: “cair em pecado”, “cair sob juízo” ou “afastar-se da fé”
  rationale: O contexto imediato adverte contra a autoconfiança à luz das falhas de Israel, mas πέσῃ não define por si só apostasia, fracasso moral ou juízo. A formulação ampla preserva a tensão teológica do texto.
- issue: Expressão masculina singular representativa
  choice: Usar a construção inclusiva e singular “quem pensa estar de pé”, sem pronome explícito.
  alternative: “aquele que pensa estar de pé”
  rationale: O grego está no masculino singular com sentido representativo. Em português, “quem” comunica naturalmente essa generalidade sem alterar o número nem introduzir uma especificação de gênero desnecessária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é direto, digno e admonitório; evita arcaísmos e não restringe o sentido teológico de “cair”.
