source:
  edition: SBLGNT
  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: pt
  text: Se eu participo com gratidão[a], por que sou difamado por aquilo pelo que dou graças?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se eu participo pela graça, por que falam mal de mim por aquilo pelo que dou graças?» O grego χάριτι pode ser traduzido por «pela graça»; neste contexto, muitos o entendem como «com gratidão» por causa da expressão seguinte, «dou graças».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: com gratidão
  rationale: No contexto de alimento e da oração de agradecimento mencionada logo depois, expressa a gratidão com que se participa. A alternativa «pela graça» permanece possível e é registrada em nota.
- source_word: μετέχω
  choice: participo
  rationale: Preserva a ideia de tomar parte em algo sem acrescentar explicitamente «como» ou «da refeição», embora o contexto se refira ao consumo de alimento.
- source_word: βλασφημοῦμαι
  choice: sou difamado
  rationale: Como a pessoa que sofre a ação é o falante, o verbo indica falar mal dele ou desacreditá-lo, não blasfêmia dirigida a Deus.
- source_word: ὑπὲρ οὗ
  choice: por aquilo pelo que
  rationale: Expressa a causa da difamação e mantém a ligação relativa com aquilo pelo que se dão graças.
- source_word: εὐχαριστῶ
  choice: dou graças
  rationale: Tradução direta e corrente, sem explicitar «a Deus», que está implícito no contexto, mas não aparece no texto grego.
- source_word: τί
  choice: por que
  rationale: 'Na pergunta retórica, o pronome interrogativo tem sentido causal: «por que razão?».'
- source_word: ἐγὼ ... ἐγὼ
  choice: eu ... [verbo na primeira pessoa]
  rationale: O primeiro «eu» é expresso naturalmente; no segundo caso, a flexão de «dou» já identifica o sujeito, evitando uma repetição pouco natural em português sem alterar o contraste.
theological_decisions:
- issue: Sentido de χάριτι em relação ao alimento e à ação de graças
  choice: com gratidão
  alternative: pela graça
  rationale: A proximidade de εὐχαριστῶ («dou graças») favorece o sentido de gratidão associada à participação. Ainda assim, «pela graça» é lexicalmente possível e foi preservado em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Dou graças» conserva o registro bíblico sem soar arcaico; «difamado» comunica fala hostil contra a pessoa.
