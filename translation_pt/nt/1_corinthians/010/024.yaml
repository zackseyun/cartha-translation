  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: pt
  text: Ninguém busque o seu próprio bem[a], mas o bem do outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ninguém busque o que é seu, mas o que é do outro.”'
    reason: alternativa lexical que preserva a construção elíptica do grego
lexical_decisions:
- source_word: μηδεὶς
  choice: Ninguém
  rationale: O pronome indefinido negativo, com o imperativo na terceira pessoa, introduz uma proibição geral. “Ninguém busque” reproduz essa força de modo natural e conciso em português.
- source_word: ζητείτω
  choice: busque
  rationale: ζητέω tem o sentido amplo de buscar, procurar ou empenhar-se por algo. “Busque” conserva a simplicidade e a amplitude do verbo grego.
- source_word: τὸ ἑαυτοῦ
  choice: o seu próprio bem
  rationale: A expressão grega é elíptica, literalmente “o que é de si mesmo”. No contexto de 1 Coríntios 10:23-33, “bem” explicita com naturalidade o benefício ou vantagem em vista, sem restringi-lo a interesses materiais.
- source_word: ἀλλὰ
  choice: mas
  rationale: A conjunção estabelece contraste direto entre buscar o próprio bem e o do outro.
- source_word: τὸ τοῦ ἑτέρου
  choice: o bem do outro
  rationale: A expressão também é elíptica. ἕτερος designa aqui a outra pessoa em contraste com o próprio indivíduo; repetir “bem” torna a frase clara em português e mantém o paralelismo.
theological_decisions:
- issue: Explicitação do objeto implícito em τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: “o seu próprio bem ... o bem do outro”
  alternative: “o que é seu ... o que é do outro” ou “os seus próprios interesses ... os do outro”
  rationale: O grego não nomeia expressamente o objeto buscado. O contexto imediato trata de agir visando ao benefício do próximo, em vez da própria vantagem. “Bem” comunica essa força ética sem definir de maneira indevidamente estreita o tipo de benefício. A nota preserva a forma mais literal e a ambiguidade da elipse.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A construção breve mantém o caráter proverbial da exortação; “seu próprio” reforça o contraste presente no reflexivo grego.
