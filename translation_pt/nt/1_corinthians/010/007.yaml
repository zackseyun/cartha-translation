  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: pt
  text: 'Não se tornem idólatras, como alguns deles; conforme está escrito: “O povo sentou-se para comer e beber e levantou-se para se divertir”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levantou-se para festejar”. A citação vem de Êxodo 32:6, onde essa diversão está ligada à festa idólatra de Israel em torno do bezerro de ouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Não
  rationale: Dá continuidade natural, em português, à série de advertências do contexto, sem exigir o mais rígido «nem».
- source_word: εἰδωλολάτραι
  choice: idólatras
  rationale: É o equivalente conciso e corrente para pessoas que prestam culto a ídolos.
- source_word: γίνεσθε
  choice: se tornem
  rationale: Preserva o sentido de vir a ser ou passar a agir como, em vez de reduzir o verbo a um estado estático.
- source_word: καθώς τινες αὐτῶν
  choice: como alguns deles
  rationale: Reproduz a comparação com parte do povo de Israel; o predicativo «idólatras» fica naturalmente subentendido em português.
- source_word: ὥσπερ γέγραπται
  choice: conforme está escrito
  rationale: Fórmula de citação clara e digna, que preserva a referência ao texto escrito ainda vigente.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: O povo sentou-se
  rationale: Mantém o sujeito coletivo e a ação narrativa da citação de Êxodo 32:6.
- source_word: φαγεῖν καὶ πεῖν
  choice: para comer e beber
  rationale: Tradução direta dos dois infinitivos de finalidade.
- source_word: ἀνέστησαν
  choice: levantou-se
  rationale: Concorda com o coletivo «o povo» e conserva a progressão narrativa.
- source_word: παίζειν
  choice: para se divertir
  rationale: Expressa em português atual o sentido básico de participar de diversão ou folguedo, sem explicitar além do grego a natureza da celebração; a conotação de festejo idólatra é indicada em nota.
theological_decisions:
- issue: Grau de explicitação da alusão a Êxodo 32 no verbo παίζειν
  choice: Manter no texto a formulação relativamente aberta «para se divertir» e explicar em nota sua possível força contextual.
  alternative: «para festejar» ou «para se entregar à farra»
  rationale: A passagem cita Êxodo 32:6 e se refere à festa em torno do bezerro de ouro. Como παίζειν pode designar diversão, folguedo ou celebração, o texto principal deve conservar essa abertura sem introduzir uma descrição moral ou sexual mais específica do que a fonte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural «vocês» fica implícito na forma verbal «se tornem». A citação conserva tom bíblico digno sem recorrer a vocabulário arcaico.
