  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: pt
  text: Essas coisas lhes aconteciam como exemplos[a], mas foram escritas para nossa instrução[b] — para nós, sobre quem chegaram os fins das eras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como tipos” ou “tipologicamente”; Paulo apresenta esses acontecimentos como padrões dotados de significado instrutivo para os que vieram depois.
    reason: lexical_alternative
  - marker: b
    text: Ou “para nossa advertência”; o termo grego abrange instrução corretiva e aviso.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão grega traz os dois substantivos no plural: “os fins das eras”. Também se pode traduzir de modo mais fluente por “o fim das eras” ou, de forma interpretativa, “a consumação das eras”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: como exemplos
  rationale: Expressa com clareza que os acontecimentos serviam de padrões instrutivos, sem recorrer ao termo técnico “tipologicamente” nem reduzir a ideia a uma simples ilustração.
- source_word: συνέβαινεν
  choice: aconteciam
  rationale: O imperfeito apresenta os acontecimentos passados em seu desenrolar ou repetição; “aconteciam” preserva essa nuance e soa natural no contexto.
- source_word: ἐκείνοις
  choice: com eles
  rationale: O dativo se refere à geração do deserto. Em português, “aconteciam com eles” é mais idiomático que “aconteciam a eles”.
- source_word: ἐγράφη
  choice: foram escritas
  rationale: Embora o verbo grego esteja no singular, refere-se ao registro escrito dessas coisas. O plural em português retoma naturalmente “essas coisas”.
- source_word: πρὸς νουθεσίαν
  choice: para nossa instrução
  rationale: “Instrução” comunica de modo acessível a formação corretiva pretendida; a nota preserva também a dimensão de advertência presente em νουθεσία.
- source_word: εἰς οὓς
  choice: sobre quem
  rationale: Preserva a imagem direcional de algo que chegou sobre as pessoas em vista, sem substituí-la por uma paráfrase teológica.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: os fins das eras
  rationale: Mantém os dois plurais da expressão grega e sua tensão histórico-salvífica, em vez de uniformizá-la como “o fim dos tempos”.
- source_word: κατήντηκεν
  choice: chegaram
  rationale: O perfeito indica uma chegada consumada cujos efeitos permanecem. “Chegaram” é natural em português; a concordância plural acompanha “os fins”.
theological_decisions:
- issue: A expressão histórico-salvífica τὰ τέλη τῶν αἰώνων
  choice: os fins das eras chegaram
  alternative: o fim das eras chegou; a consumação das eras chegou
  rationale: A formulação conserva os plurais incomuns de Paulo e não resolve sua tensão escatológica mediante uma expressão singular ou uma paráfrase interpretativa.
- issue: O valor de τυπικῶς
  choice: como exemplos
  alternative: como tipos; tipologicamente
  rationale: “Como exemplos” mantém a função paradigmática dos acontecimentos no argumento imediato. A nota registra a linguagem tipológica possível sem impor ao texto um sistema interpretativo específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conservou-se a formulação incomum “os fins das eras” para refletir a expressão grega e evitar a solução teológica antecipada de “fim dos tempos”.
