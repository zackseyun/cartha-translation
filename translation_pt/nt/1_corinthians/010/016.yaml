id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: pt
  text: O cálice de bênção que abençoamos não é uma participação no sangue do Messias? O pão que partimos não é uma participação no corpo do Messias?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comunhão com” ou “partilha no”.'
    reason: lexical_alternative
  - marker: b
    text: Grego Christós, isto é, “Ungido”; tradicionalmente, “Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: o cálice
  rationale: “Cálice” é a designação bíblica corrente em português para um recipiente de beber neste contexto. Mantém um registro digno sem especificar o material ou a forma do recipiente.
- source_word: τῆς εὐλογίας
  choice: de bênção
  rationale: Reproduz diretamente o substantivo εὐλογία e preserva tanto a formulação grega quanto sua possível relação com a bênção pronunciada à mesa.
- source_word: ὃ εὐλογοῦμεν
  choice: que abençoamos
  rationale: Preserva a repetição lexical entre “bênção” e “abençoamos”, sem reduzir o ato especificamente a dar graças.
- source_word: οὐχὶ
  choice: não é
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa, conservando de modo natural a forma interrogativa do grego.
- source_word: κοινωνία
  choice: participação
  rationale: Expressa envolvimento ou partilha real no sangue e no corpo, sem definir o modo dessa participação nem impor o sentido social mais fraco de “convívio”.
- source_word: τοῦ αἵματος
  choice: no sangue
  rationale: A preposição “em” exigida por “participação” resulta na contração “no” e comunica naturalmente participação no sangue, preservando sua força sacrificial e pactual sem expansão interpretativa.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός mantém aqui seu valor titular, “o Ungido”; “Messias” torna esse valor perceptível em português, enquanto a forma tradicional “Cristo” é registrada em nota.
- source_word: τὸν ἄρτον
  choice: o pão
  rationale: É o equivalente comum e suficientemente amplo; o versículo não exige que se explicite “um pão” ou “um único pão”.
- source_word: ὃν κλῶμεν
  choice: que partimos
  rationale: “Partir o pão” é expressão portuguesa natural e preserva a ação ritual concreta do verbo κλάω.
- source_word: τοῦ σώματος
  choice: no corpo
  rationale: A construção natural com “participação” preserva diretamente “corpo” e não define de maneira denominacional a natureza da relação sacramental.
theological_decisions:
- issue: Sentido de κοινωνία no contexto da ceia
  choice: participação
  alternative: comunhão; partilha
  rationale: “Participação” preserva a força de tomar parte no sangue e no corpo do Messias, sem reduzir a afirmação a mero símbolo e sem resolver debates sobre o modo da presença sacramental.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo ainda identifica aquele a quem pertencem o sangue e o corpo como o Ungido. “Messias” preserva explicitamente o título; “Cristo”, consagrado pela tradição portuguesa, permanece em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe de ampla compreensão no Brasil e em outros contextos lusófonos. A repetição “bênção… abençoamos” e o paralelismo das duas perguntas foram mantidos. “Cálice” conserva o uso bíblico português, e “participação” evita tanto uma leitura meramente social quanto terminologia sacramental excessivamente técnica.
