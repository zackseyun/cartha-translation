  text: and all ate the same spiritual food[a]
translation:
  language: pt
  text: e todos comeram o mesmo alimento espiritual[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «alimento sobrenatural»; a expressão provavelmente alude ao maná no deserto e pode ter força tipológica neste contexto.
    reason: alternativa lexical e esclarecimento alusivo
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa usual, ligando este versículo à afirmação anterior.
- source_word: πάντες
  choice: todos
  rationale: Preserva a universalidade enfática referente ao conjunto de Israel, sem acrescentar pronome desnecessário.
- source_word: τὸ αὐτὸ
  choice: o mesmo
  rationale: Expressa de modo direto e natural a identidade indicada pelo artigo com αὐτός.
- source_word: πνευματικὸν
  choice: espiritual
  rationale: Mantém o termo paulino e sua amplitude sem restringi-lo a «dado pelo Espírito» nem explicá-lo apenas como «sobrenatural».
- source_word: βρῶμα
  choice: alimento
  rationale: Equivalente português natural e digno para comida ou sustento, adequado ao contexto do maná.
- source_word: ἔφαγον
  choice: comeram
  rationale: Traduz diretamente o aoristo indicativo como ação passada.
theological_decisions:
- issue: Sentido de «alimento espiritual» na tipologia do deserto
  choice: Manter «alimento espiritual» no texto principal.
  alternative: Explicitar «o maná dado por Deus», «alimento dado pelo Espírito» ou uma referência tipológica à Ceia do Senhor.
  rationale: A expressão provavelmente alude ao maná, mas o contexto também pode conferir força tipológica. A formulação preserva a amplitude e a tensão teológica do texto sem impor uma identificação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha naturalmente o grego; «alimento espiritual» conserva a formulação paulina e a ambiguidade contextual.
