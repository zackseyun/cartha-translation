  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: pt
  text: Portanto, quer vocês comam, quer bebam, quer façam qualquer coisa, façam tudo para a glória de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: quer ... quer ... quer
  rationale: A construção correlativa apresenta casos alternativos. “Quer... quer...” preserva a estrutura retórica grega em português natural e claro.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão inferida da discussão anterior e mantém explícita a ligação lógica da exortação com o contexto.
- source_word: ἐσθίετε
  choice: vocês comam
  rationale: O presente tem valor geral; após “quer”, o subjuntivo é a forma idiomática em português para expressar a alternativa sem sugerir uma ação apenas momentânea.
- source_word: πίνετε
  choice: bebam
  rationale: Assim como ἐσθίετε, expressa ação geral. O sujeito “vocês” fica naturalmente subentendido na sequência coordenada.
- source_word: τι ποιεῖτε
  choice: façam qualquer outra coisa
  rationale: Neste contexto, τι amplia o enunciado para além de comer e beber. “Qualquer outra coisa” comunica essa extensão de modo natural, sem limitar o alcance.
- source_word: πάντα
  choice: tudo
  rationale: O acusativo neutro plural tem alcance abrangente. “Tudo” é a formulação corrente e preserva a totalidade.
- source_word: εἰς δόξαν
  choice: para a glória
  rationale: εἰς indica finalidade ou objetivo. “Para a glória” expressa com clareza que as ações devem ter a glória de Deus como finalidade.
- source_word: θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente a relação genitiva e conserva a expressão conhecida e teologicamente significativa “a glória de Deus”.
- source_word: ποιεῖτε
  choice: façam
  rationale: Na oração principal, a forma funciona como exortação imperativa. “Façam” preserva tanto o sentido amplo de ποιέω quanto a força do mandamento.
theological_decisions:
- issue: Alcance da exortação de Paulo
  choice: 'Princípio ético abrangente: todas as ações, inclusive as mais comuns, devem visar à glória de Deus.'
  alternative: Instrução mais restrita, referente apenas às questões de comida e bebida.
  rationale: A progressão dos exemplos específicos — comer e beber — para “qualquer outra coisa” e “tudo” indica um princípio geral, embora ele surja da controvérsia imediata tratada no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” torna explícito o plural presente nas formas gregas; a correlação “quer... quer...” conserva a cadência do original sem soar arcaica.
