  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: pt
  text: Pois do Senhor é a terra e tudo o que nela existe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação do Salmo 24:1. Mais literalmente, «e a sua plenitude».
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: Senhor
  rationale: O genitivo τοῦ κυρίου é expresso naturalmente pela construção possessiva «do Senhor», preservando tanto o sentido de pertencimento quanto o caráter de citação bíblica.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a base bíblica para o argumento anterior e mantém de forma concisa a ligação explicativa.
- source_word: γῆ
  choice: terra
  rationale: No contexto da citação do Salmo 24:1, o termo tem alcance cósmico; «terra» é natural e preserva a ressonância intertextual.
- source_word: πλήρωμα
  choice: tudo o que nela existe
  rationale: Neste contexto, designa tudo aquilo que enche ou compõe a terra. A formulação é clara em português moderno, sem perder o sentido abrangente do original.
- source_word: αὐτῆς
  choice: nela
  rationale: O pronome feminino retoma «terra»; na expressão portuguesa escolhida, «nela» comunica essa referência com naturalidade.
theological_decisions:
- issue: Tradução de κύριος numa citação bíblica de peso teológico
  choice: Senhor
  alternative: SENHOR
  rationale: Paulo emprega o grego κύριος. «Senhor» preserva o uso neotestamentário e a referência da citação sem introduzir aqui a convenção tipográfica usada diretamente para o nome divino no texto hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem frasal que conserva a ênfase da citação. «Tudo o que nela existe» comunica o alcance de πλήρωμα com mais naturalidade do que o literal «sua plenitude».
