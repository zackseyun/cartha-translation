id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: pt
  text: 'De fato, ouve-se dizer que há imoralidade sexual entre vocês, e uma imoralidade sexual de tal natureza que não existe nem mesmo entre os gentios[a]: um homem tem a mulher de seu pai[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre as nações”; algumas traduções dizem “entre os pagãos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tem a mulher de seu pai”; isto é, mantém com ela uma relação conjugal ou sexual. Possivelmente se trata de sua madrasta.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: De fato
  rationale: Expressa idiomaticamente a ênfase e o espanto de Paulo, em vez de um sentido quantitativo como “inteiramente”.
- source_word: ἀκούεται
  choice: ouve-se dizer
  rationale: A forma passiva indica que o caso está sendo comentado ou noticiado; esta formulação é natural em português e mantém a imagem auditiva do grego.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica que a situação ocorre no interior da comunidade coríntia, em linguagem corrente e clara.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Termo abrangente e atual para conduta sexual ilícita, sem a estreiteza ou o caráter antiquado de alternativas como “fornicação”.
- source_word: τοιαύτη πορνεία
  choice: uma imoralidade sexual de tal natureza
  rationale: Preserva a força qualitativa e enfática de τοιαύτη, destacando o caráter chocante do caso.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: que não existe nem mesmo entre os gentios
  rationale: “Gentios” preserva o contraste judaico-cristão de ἔθνη. “Existe” explicita com naturalidade em português a elipse verbal do grego, sem alterar seu sentido.
- source_word: ὥστε
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente a descrição específica que comprova a afirmação anterior, evitando um “de modo que” causal ou consecutivo inadequado no contexto.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: a mulher de seu pai
  rationale: Mantém a expressão do original sem especificar “madrasta”, identificação provável, mas não lexicalmente explícita.
- source_word: ἔχειν
  choice: tem
  rationale: Preserva a formulação breve e eufemística do grego para manter uma relação conjugal ou sexual, sem impor detalhes como coabitação.
theological_decisions:
- issue: Tradução de ἔθνεσιν
  choice: gentios
  alternative: nações; pagãos
  rationale: “Gentios” conserva o contraste étnico-religioso característico do contexto paulino. “Pagãos” acrescentaria uma conotação avaliativa que não é inerente ao termo, e “nações” seria menos claro neste contexto.
- issue: Identidade da mulher
  choice: a mulher de seu pai
  alternative: sua madrasta
  rationale: A expressão provavelmente se refere à madrasta do homem, mas o grego não emprega um termo específico de parentesco. A tradução mantém a precisão do texto e deixa a inferência em nota.
- issue: Sentido relacional de ἔχειν
  choice: tem
  alternative: vive com; mantém relações sexuais com
  rationale: O verbo pode funcionar eufemisticamente para uma relação conjugal ou sexual. A forma concisa preserva essa tensão sem decidir se havia casamento formal, coabitação ou outro arranjo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De fato” comunica a ênfase inicial sem coloquialismo excessivo; “ouve-se dizer” mantém proximidade com a forma grega e naturalidade. A repetição de “imoralidade sexual” foi preservada por sua função retórica.
