  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: pt
  text: Pois que me cabe julgar os de fora? Não são os de dentro que vocês devem julgar?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o que tenho eu a ver com julgar os de fora?”'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, os que fazem parte da comunidade da igreja. O grego também pode ser traduzido: “Não são os de dentro que vocês julgam?”'
    reason: cultural_and_grammatical_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Pois que me cabe
  rationale: A expressão pergunta que responsabilidade ou relação isso tem com o falante. “Que me cabe” é idiomático em português, preserva a força retórica e, com “pois”, mantém o valor explicativo de γάρ.
- source_word: τοὺς ἔξω
  choice: os de fora
  rationale: O adjetivo substantivado designa pessoas fora da comunidade cristã. “Os de fora” mantém de forma natural o contraste espacial e comunitário com “os de dentro”.
- source_word: κρίνειν
  choice: julgar
  rationale: No contexto, κρίνω se refere a exercer julgamento ligado à disciplina comunitária. “Julgar” preserva a amplitude do termo sem explicitar além do original.
- source_word: οὐχὶ
  choice: Não são... que
  rationale: A construção introduz uma pergunta retórica que espera resposta afirmativa. Esta formulação conserva essa expectativa em português corrente e digno.
- source_word: τοὺς ἔσω
  choice: os de dentro
  rationale: Refere-se aos que pertencem à comunidade cristã e conserva o paralelismo direto com “os de fora”.
- source_word: ὑμεῖς κρίνετε
  choice: vocês devem julgar
  rationale: Embora a forma grega seja indicativa e possa ser entendida descritivamente (“vocês julgam”), o contexto disciplinar favorece uma responsabilidade esperada. “Devem julgar” expressa essa força sem transformar a frase em ordem direta.
theological_decisions:
- issue: O alcance do julgamento mencionado por Paulo
  choice: O contraste diz respeito ao julgamento disciplinar dos que estão dentro da comunidade, em oposição aos que estão fora dela.
  alternative: Entender a frase como uma declaração geral sobre toda forma de julgamento moral.
  rationale: O contexto de 1 Coríntios 5:9–13 trata da disciplina comunitária. A tradução mantém o contraste entre dentro e fora sem ampliar a afirmação para uma doutrina geral que o versículo não formula.
- issue: Força de ὑμεῖς κρίνετε
  choice: “vocês devem julgar”, indicando responsabilidade no contexto.
  alternative: “vocês julgam”, preservando estritamente o indicativo e permitindo leitura descritiva.
  rationale: A pergunta retórica e o contexto imediato favorecem a ideia de dever, mas a nota registra a ambiguidade gramatical genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação preserva o tom retórico de Paulo, o contraste paralelo entre “os de fora” e “os de dentro” e a ambiguidade do indicativo grego por meio de nota.
