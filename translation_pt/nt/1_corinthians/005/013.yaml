id: 1CO.5.13
reference: 1 Corinthians 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: pt
  text: Mas Deus julga os que estão de fora.[a][b] Expulsem o perverso do meio de vocês.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os de fora”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego está no presente (“julga”), embora o contexto também possa levar à tradução “julgará”.
    reason: lexical_alternative
  - marker: c
    text: 'A formulação retoma as ordens de Deuteronômio para eliminar o mal do meio da comunidade da aliança. Também se pode traduzir: “Retirem o perverso do meio de vocês”.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: os que estão de fora
  rationale: O advérbio substantivado designa as pessoas que não pertencem à comunidade cristã. A expressão preserva a perspectiva relacional do grego sem acrescentar uma definição institucional.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado com o julgamento dos que estão dentro da comunidade, mencionado no versículo anterior.
- source_word: κρίνει
  choice: julga
  rationale: Mantém o presente do indicativo grego, que pode expressar uma verdade geral. O contexto permite que alguns entendam uma referência futura, mas a tradução não resolve essa tensão.
- source_word: ἐξάρατε
  choice: Expulsem
  rationale: O imperativo aoristo exige uma ação decisiva de afastamento da comunidade. “Expulsem” é claro e natural em português, sem introduzir terminologia eclesiástica posterior.
- source_word: τὸν πονηρὸν
  choice: o perverso
  rationale: O adjetivo substantivado singular e masculino caracteriza concretamente o transgressor mencionado no contexto e também preserva o eco da fórmula deuteronômica.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: do meio de vocês
  rationale: Expressa de modo idiomático a retirada de alguém de dentro da própria comunidade.
theological_decisions:
- issue: Natureza da ordem relativa à disciplina da comunidade
  choice: A congregação deve afastar de sua convivência o transgressor mencionado, enquanto Deus julga os de fora.
  alternative: A ordem pode ser entendida de modo mais geral como a remoção do mal da comunidade, sem especificar uma exclusão formal.
  rationale: O contexto de 1 Coríntios 5 contrasta a responsabilidade da comunidade em relação aos seus membros com o julgamento divino dos que estão fora. A tradução comunica afastamento comunitário, mas evita importar procedimentos ou categorias eclesiásticas posteriores.
- issue: Valor temporal de κρίνει
  choice: 'Presente: “julga”.'
  alternative: 'Futuro contextual: “julgará”.'
  rationale: A forma grega é presente e pode ser gnômica. Como o contexto não obriga a convertê-la em futuro, conserva-se o presente e registra-se a alternativa em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vocês” torna explícito o plural comunitário; “o perverso” preserva a referência masculina singular do contexto e o eco deuteronômico. As notas mantêm visíveis as alternativas lexical, temporal e intertextual.
