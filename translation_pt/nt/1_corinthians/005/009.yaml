  text: Ἔγραψα ὑμῖν ἐν τῇ ἐπιστολῇ μὴ συναναμίγνυσθαι πόρνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/009.yaml
  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: pt
  text: Eu lhes escrevi na carta[a] que não se associassem[b] com pessoas sexualmente imorais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na minha carta”. O grego pode se referir tanto a uma carta anterior enviada por Paulo quanto a esta própria carta, em um trecho anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “que não mantivessem convivência” ou “que não se misturassem”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com os sexualmente imorais”. O termo grego πόρνοις se refere a pessoas caracterizadas pela imoralidade sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Eu lhes escrevi
  rationale: O aoristo indicativo é traduzido naturalmente pelo pretérito perfeito. A formulação mantém a referência direta de Paulo aos destinatários.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo indica os destinatários da escrita; “lhes” é natural e claro em português.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: na carta
  rationale: Preserva o artigo definido e não decide se Paulo se refere a uma carta anterior ou à própria correspondência em curso.
- source_word: μὴ συναναμίγνυσθαι
  choice: que não se associassem
  rationale: Expressa em português natural o conteúdo da instrução e o sentido de não manter convivência ou companhia, sem sugerir mero contato casual.
- source_word: πόρνοις
  choice: com pessoas sexualmente imorais
  rationale: O substantivo plural designa pessoas caracterizadas pela imoralidade sexual. Esta expressão é atual, compreensível e mais abrangente do que termos tradicionais mais estreitos.
theological_decisions:
- issue: Referência de “a carta”
  choice: Manter indefinido se Paulo se refere a uma carta anterior ou a esta própria carta.
  alternative: Especificar “numa carta anterior” ou entender a expressão como referência a uma parte anterior de 1 Coríntios.
  rationale: A expressão grega ἐν τῇ ἐπιστολῇ é definida, mas não resolve por si só a questão histórica; a tradução preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha os respectivos termos no texto, e a tradução conserva a ambiguidade histórica de “na carta”.
