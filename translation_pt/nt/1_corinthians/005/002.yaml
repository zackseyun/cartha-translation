source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: pt
  text: E vocês estão inflados de orgulho! Não deveriam, antes, ter lamentado, para que aquele que praticou esse ato fosse tirado do meio de vocês?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fosse afastado dentre vocês”. No contexto, isso provavelmente se refere à sua exclusão da congregação por meio de disciplina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: cheios de orgulho
  rationale: O particípio perfeito expressa um estado estabelecido de orgulho. A formulação é natural e clara em português; embora não reproduza literalmente a imagem de estar ‘inchado’, comunica seu sentido e se harmoniza com o uso paulino no contexto.
- source_word: οὐχὶ μᾶλλον
  choice: Não deveriam, antes
  rationale: Preserva a força da pergunta retórica de repreensão e o contraste entre a atitude real dos coríntios e a reação que deveriam ter tido.
- source_word: ἐπενθήσατε
  choice: ter lamentado
  rationale: Mantém a forte linguagem de luto, mais intensa que uma referência genérica à tristeza, e permite a dimensão comunitária e penitencial do contexto.
- source_word: ἵνα ἀρθῇ
  choice: para que ... fosse tirado
  rationale: Reproduz a construção de propósito ou resultado e conserva a voz passiva sem identificar explicitamente o agente.
- source_word: ἐκ μέσου ὑμῶν
  choice: do meio de vocês
  rationale: É uma expressão portuguesa natural que preserva a dimensão comunitária do idioma grego.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: aquele que praticou esse ato
  rationale: Identifica o responsável sem repetir seu nome; ‘praticou esse ato’ conserva a gravidade da expressão sem acrescentar detalhes.
theological_decisions:
- issue: Natureza da ação requerida contra o transgressor
  choice: fosse tirado do meio de vocês
  alternative: fosse expulso da congregação; fosse tirado por Deus
  rationale: O contexto imediato favorece a exclusão disciplinar da comunidade, mas a forma passiva de ἀρθῇ não especifica o agente. A tradução mantém essa abertura e a nota indica a leitura contextual provável sem torná-la explícita no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação inicial transmite a censura enfática; a pergunta retórica preserva a tensão do grego. O marcador [a] aparece no texto principal e corresponde à nota.
