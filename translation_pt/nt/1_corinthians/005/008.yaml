source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: pt
  text: Portanto, celebremos a festa[a], não com fermento velho, nem com o fermento da maldade e da perversidade, mas com os pães sem fermento[b] da sinceridade e da verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guardemos a festa” ou “observemos a festividade”. O grego mantém a imagem da festa da Páscoa usada no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as coisas sem fermento”. A palavra “pães” foi explicitada para tornar clara a imagem da Páscoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão decorrente do argumento anterior e preserva com naturalidade a força inferencial do grego.
- source_word: ἑορτάζωμεν
  choice: celebremos a festa
  rationale: O presente do subjuntivo tem força exortativa. A expressão mantém a imagem da festa da Páscoa desenvolvida no contexto, sem sugerir necessariamente uma observância ritual literal.
- source_word: ζύμῃ παλαιᾷ
  choice: com fermento velho
  rationale: “Fermento” é corrente em português e conserva a metáfora pascal; “com” expressa de modo idiomático o valor instrumental ou associativo de ἐν.
- source_word: κακίας
  choice: maldade
  rationale: Transmite o caráter moralmente mau ou a má disposição indicada pelo substantivo e permanece acessível ao leitor comum.
- source_word: πονηρίας
  choice: perversidade
  rationale: Distingue o termo de κακία e comunica a ideia de conduta moralmente corrupta ou perversa.
- source_word: ἀζύμοις
  choice: os pães sem fermento
  rationale: O adjetivo substantivado significa literalmente “coisas sem fermento”; a explicitação de “pães” torna clara em português a imagem da Páscoa presente no contexto.
- source_word: εἰλικρινείας
  choice: sinceridade
  rationale: Expressa genuinidade não misturada ou não corrompida, em contraste com o efeito figurado do fermento.
- source_word: ἀληθείας
  choice: verdade
  rationale: É a correspondência direta e natural, preservando o paralelismo com “sinceridade”.
theological_decisions:
- issue: Imagem da Páscoa na exortação de Paulo
  choice: Manter “celebremos a festa” e “pães sem fermento”
  alternative: Traduzir de modo mais genérico como “celebremos” e “coisas sem fermento”
  rationale: O contexto imediato identifica Cristo como o cordeiro pascal e sustenta a metáfora da festa e dos pães sem fermento. A tradução conserva essa conexão sem decidir se Paulo ordena uma celebração ritual literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a metáfora pascal e o contraste retórico do original sem acrescentar uma conclusão denominacional sobre observância litúrgica.
