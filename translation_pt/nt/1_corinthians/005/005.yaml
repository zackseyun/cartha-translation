  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: pt
  text: entregar tal homem a Satanás, para a destruição da carne[a], a fim de que o espírito seja salvo no dia do Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a ruína da carne”. A expressão pode se referir a um juízo físico severo ou, em sentido mais figurado, à destruição da orientação carnal ou pecaminosa do homem.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “do nosso Senhor Jesus” ou “do Senhor Jesus” em vez de simplesmente “do Senhor”.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: entregar
  rationale: O infinitivo aoristo expressa a ação que Paulo determina. “Entregar” é natural em português e preserva a força de παραδίδωμι.
- source_word: τὸν τοιοῦτον
  choice: esse homem
  rationale: A expressão aponta para o infrator específico e mantém a referência masculina singular; “esse homem” é claro e corrente em português.
- source_word: Σατανᾷ
  choice: Satanás
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: εἰς ὄλεθρον
  choice: para a destruição
  rationale: ὄλεθρος pode indicar destruição ou ruína. “Destruição” conserva a gravidade da medida sem definir de modo indevido se o efeito é físico ou figurado.
- source_word: τῆς σαρκός
  choice: da carne
  rationale: A tradução literal preserva a ambiguidade entre o corpo e a orientação carnal ou pecaminosa, evitando resolvê-la no texto principal.
- source_word: ἵνα
  choice: a fim de que
  rationale: Expressa com clareza a finalidade ou o resultado pretendido da ação.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: O grego não contém pronome possessivo explícito. “O espírito” mantém essa contenção formal sem acrescentar “dele”.
- source_word: σωθῇ
  choice: seja salvo
  rationale: Reproduz o subjuntivo passivo e mantém a linguagem de salvação sem especificar além do texto.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: no dia
  rationale: Expressão temporal natural em português, especialmente neste contexto escatológico.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Segue exatamente o texto-base, que traz apenas κυρίου, sem acrescentar “Jesus” ou “nosso”.
theological_decisions:
- issue: Sentido de “destruição da carne”
  choice: Manter no texto principal a expressão ambígua “destruição da carne”.
  alternative: Juízo físico grave ou morte; destruição da orientação carnal ou pecaminosa do homem.
  rationale: A frase aponta para consequências disciplinares severas, mas o grego não obriga a escolher entre um sentido corporal e um sentido figurado. A formulação mantém a tensão interpretativa.
- issue: Referente de “o espírito”
  choice: Traduzir “o espírito”, sem acrescentar pronome possessivo.
  alternative: “o espírito dele”
  rationale: Embora o contexto sugira fortemente a salvação final do infrator, o grego não traz um possessivo explícito.
- issue: Expressão escatológica “o dia do Senhor”
  choice: Traduzir τοῦ κυρίου como “do Senhor”.
  alternative: “do nosso Senhor Jesus” ou “do Senhor Jesus”
  rationale: O texto da SBLGNT fornecido contém apenas “do Senhor”. As formas ampliadas pertencem a variantes manuscritas e são registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão do grego, preserva a ambiguidade de “carne” e evita inserir um possessivo em “o espírito”. Os marcadores foram posicionados junto às expressões a que se referem.
