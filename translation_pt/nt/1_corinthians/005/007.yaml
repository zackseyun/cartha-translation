reference: 1 Corinthians 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: pt
  text: Eliminem o fermento velho, para que sejam uma nova massa, assim como vocês são sem fermento. Pois o Messias,[a] nosso cordeiro pascal,[b] foi sacrificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego Christós, tradicionalmente traduzido como “Cristo”; aqui, o sentido de título (“Messias”) está em primeiro plano.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pois também a nossa Páscoa foi sacrificada, Messias”. Neste contexto, “Páscoa” pode designar o cordeiro ou o sacrifício pascal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Eliminem
  rationale: O aoristo imperativo ativo, na segunda pessoa do plural, ordena a remoção completa. “Eliminem” é claro, enérgico e natural em português atual.
- source_word: τὴν παλαιὰν ζύμην
  choice: o fermento velho
  rationale: “Fermento” preserva tanto a imagem concreta da massa quanto sua ligação com a Páscoa e os pães sem fermento; “velho” representa παλαιάν e aponta para a influência corruptora anterior.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: para que sejam uma nova massa
  rationale: A construção expressa propósito ou resultado pretendido. “Nova massa” comunica de modo natural a metáfora de um conjunto de massa preparado para assar.
- source_word: καθώς ἐστε ἄζυμοι
  choice: assim como vocês são sem fermento
  rationale: A tradução mantém a comparação de καθώς e a tensão entre a ordem de remover o fermento e a identidade que Paulo já atribui aos destinatários.
- source_word: τὸ πάσχα ἡμῶν
  choice: nosso cordeiro pascal
  rationale: Literalmente, a expressão diz “nossa Páscoa”, mas πάσχα também pode designar a vítima pascal. Como o verbo seguinte significa “foi sacrificado”, “cordeiro pascal” explicita o referente implícito sem abandonar a imagem do texto.
- source_word: ἐτύθη
  choice: foi sacrificado
  rationale: O aoristo passivo de θύω descreve o abate sacrificial. “Foi sacrificado” preserva esse sentido cultual e o aspecto de acontecimento realizado.
- source_word: Χριστός
  choice: o Messias
  rationale: Neste contexto pascal, Χριστός conserva forte valor de título. “O Messias” torna esse valor perceptível ao leitor moderno, enquanto a nota registra a tradução tradicional “Cristo”.
theological_decisions:
- issue: Identificação de Cristo com τὸ πάσχα ἡμῶν
  choice: nosso cordeiro pascal
  alternative: nossa Páscoa; nosso sacrifício pascal
  rationale: O grego deixa o substantivo πάσχα semanticamente amplo, mas “foi sacrificado” indica a vítima pascal. O texto principal explicita “cordeiro”, e a nota preserva a formulação mais literal e a amplitude da expressão.
- issue: Valor titular de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A moldura pascal torna especialmente saliente o sentido titular de Χριστός. A opção não acrescenta uma identificação denominacional e a nota informa a forma tradicional.
- issue: Tensão entre exortação e identidade
  choice: para que sejam uma nova massa, assim como vocês são sem fermento
  alternative: para que se tornem uma nova massa, visto que são sem fermento
  rationale: A redação mantém lado a lado o propósito ético da ordem e a condição já afirmada dos destinatários, sem resolver a tensão teológica por paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para deixar explícita a segunda pessoa do plural. A metáfora culinária e pascal foi mantida por meio de “fermento”, “massa”, “sem fermento” e “cordeiro pascal”; as notas preservam a literalidade e a ambiguidade relevante do grego.
