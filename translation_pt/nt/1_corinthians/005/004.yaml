  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: pt
  text: Em nome de nosso Senhor Jesus[a], quando vocês estiverem reunidos, e o meu espírito estiver com vocês, com o poder de nosso Senhor Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra possibilidade de pontuação e ligação sintática: “em nome de nosso Senhor Jesus, estando vocês reunidos e o meu espírito com vocês, com o poder de nosso Senhor Jesus”. O grego emprega uma construção de genitivo absoluto bastante condensada.'
    reason: alternativa_sintática
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: em nome de
  rationale: Expressão portuguesa consagrada que preserva a forma do grego e pode comunicar atuação sob a autoridade de Jesus.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém o título cristológico usual no Novo Testamento e seu peso teológico.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Emprega a forma tradicional do nome em português.
- source_word: συναχθέντων ὑμῶν
  choice: quando vocês estiverem reunidos
  rationale: Verte o particípio aoristo passivo do genitivo absoluto como oração temporal natural, sem atribuir explicitamente aos destinatários a iniciativa de se reunirem.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: o meu espírito estiver com vocês
  rationale: Explicita de modo comedido a construção grega elíptica e preserva a afirmação de participação não física de Paulo.
- source_word: σὺν
  choice: com
  rationale: Representa de forma direta e natural a ideia de associação ou acompanhamento.
- source_word: δυνάμει
  choice: poder
  rationale: Preserva o sentido amplo de força eficaz, sem reduzi-lo a mera autoridade formal.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de nosso Senhor Jesus
  rationale: Mantém o genitivo e deixa aberta sua nuance exata, que pode envolver posse ou fonte.
theological_decisions:
- issue: Natureza da presença de Paulo na assembleia
  choice: o meu espírito estiver com vocês
  alternative: entender “espírito” apenas como atitude ou intenção, ou como uma presença mística definida mais fortemente
  rationale: O texto afirma uma participação não corporal de Paulo, mas não explica seu mecanismo; a tradução conserva essa tensão sem impor uma interpretação doutrinária.
- issue: Relação do poder do Senhor Jesus com a reunião e a ação disciplinar
  choice: com o poder de nosso Senhor Jesus
  alternative: pela autoridade de nosso Senhor Jesus
  rationale: A formulação preserva a ligação sintática comprimida e o termo δύναμις como “poder”, sem decidir em excesso se ele indica presença capacitadora, autoridade ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo 5. A nota registra a compressão e a ambiguidade estrutural do grego.
