id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: pt
  text: O orgulho de vocês não é bom. Vocês não sabem que um pouco de fermento faz fermentar toda a massa[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: toda a porção de massa.'
    reason: Alternativa lexical para φύραμα, que pode indicar a porção inteira de massa amassada.
lexical_decisions:
- source_word: καλὸν
  choice: bom
  rationale: Aqui, καλός avalia negativamente a atitude dos coríntios. “Bom” é direto, natural e conserva a amplitude moral e prática do termo.
- source_word: καύχημα
  choice: orgulho
  rationale: O substantivo pode indicar o ato ou o objeto de gloriar-se. “Orgulho” expressa em português corrente a atitude censurada, sem introduzir um motivo específico que o grego não explicita.
- source_word: οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Mantém a fórmula retórica característica de Paulo e corresponde diretamente ao sentido de οἶδα.
- source_word: μικρὰ ζύμη
  choice: um pouco de fermento
  rationale: “Fermento” comunica naturalmente a imagem antiga do agente que leveda a massa; “um pouco” preserva o contraste proverbial entre pequena quantidade e efeito total.
- source_word: ὅλον τὸ φύραμα
  choice: toda a massa
  rationale: φύραμα designa a massa misturada ou amassada, e ὅλον ressalta sua totalidade. A expressão é clara e idiomática em português.
- source_word: ζυμοῖ
  choice: faz fermentar
  rationale: A construção causativa reproduz o sentido de “levedar” em linguagem amplamente compreensível e mantém a ligação lexical com “fermento”.
theological_decisions:
- issue: Imagem metafórica do fermento
  choice: Manter o provérbio sobre fermento e massa sem explicitar sua aplicação moral.
  alternative: Expandir interpretativamente para algo como “um pouco de pecado corrompe toda a igreja”.
  rationale: O texto formula a advertência por meio de uma imagem proverbial. Embora o contexto indique sua aplicação, inserir “pecado” ou “igreja” resolveria no próprio versículo aquilo que Paulo deixa para o contexto.
- issue: Sentido de καύχημα
  choice: Traduzir como “orgulho”, preservando a possibilidade de se referir à atitude ou expressão de gloriar-se.
  alternative: “Motivo de orgulho” ou “jactância”.
  rationale: “Motivo de orgulho” favoreceria o objeto do orgulho, enquanto “jactância” enfatizaria sua expressão verbal. O contexto e a forma nominal permitem certa amplitude, mantida por “orgulho”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes como “vocês”, “fermento” e “massa”. A pergunta retórica e a concisão proverbial do grego foram preservadas.
