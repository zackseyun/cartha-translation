base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: pt
  text: Pois eu, embora ausente em corpo, presente em espírito[a], já julguei, como se estivesse presente, aquele que praticou isso dessa maneira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «presente pelo espírito». A expressão provavelmente se refere ao próprio espírito de Paulo, não diretamente ao Espírito Santo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «aquele que cometeu tal coisa». O grego inclui tanto a referência ao ato quanto uma expressão que ressalta seu modo ou caráter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o contexto anterior de modo natural em português.
- source_word: ἀπὼν τῷ σώματι
  choice: ausente em corpo
  rationale: Mantém o contraste conciso com «presente em espírito» sem sugerir morte ou separação metafísica.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: mas presente em espírito
  rationale: Conserva a formulação intencionalmente aberta do grego e o contraste retórico com a ausência corporal.
- source_word: ἤδη κέκρικα
  choice: já julguei
  rationale: O perfeito indica um julgamento já formado e ainda vigente; «julguei» permanece próximo de κρίνω.
- source_word: ὡς παρὼν
  choice: como se estivesse presente
  rationale: Expressa naturalmente a força comparativa de ὡς e a validade do julgamento de Paulo como se ele estivesse no local.
- source_word: τὸν ... κατεργασάμενον
  choice: aquele que praticou
  rationale: Representa o particípio substantivado sem acrescentar um substantivo ausente no grego; «praticou» se ajusta ao contexto de uma conduta censurada.
- source_word: οὕτως τοῦτο
  choice: isso dessa maneira
  rationale: Representa tanto o demonstrativo τοῦτο, que aponta para o ato, quanto οὕτως, que destaca seu caráter ou modo, evitando reduzir a expressão a apenas «isso».
theological_decisions:
- issue: Sentido de «presente em espírito»
  choice: Manter «presente em espírito» no texto, sem definir o mecanismo dessa presença; no contexto, a leitura mais provável é que se trate do próprio espírito de Paulo.
  alternative: Entender a expressão como referência à presença ou percepção concedida pelo Espírito Santo, ou como uma presença mística mais forte.
  rationale: O contraste imediato entre σώματι e πνεύματι favorece a referência ao corpo e ao espírito do próprio Paulo, mas a tradução não deve eliminar a abertura da expressão.
- issue: Força do julgamento apostólico
  choice: «já julguei»
  alternative: «já decidi» ou «já proferi julgamento»
  rationale: A formulação preserva tanto o ato judicial ou disciplinar quanto a força contínua do perfeito, sem especificar além do texto a forma exata da sentença.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção próxima do grego sem rigidez excessiva. A repetição de «presente» preserva o contraste retórico do original. Os marcadores [a] e [b] aparecem no texto principal.
