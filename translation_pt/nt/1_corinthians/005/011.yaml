  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: pt
  text: Mas agora escrevi a vocês que não se associem com ninguém que seja chamado irmão e que seja sexualmente imoral, ganancioso, idólatra, insultador, bêbado ou explorador; com tal pessoa, nem sequer comam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Mas agora escrevi
  rationale: Mantém o aoristo grego e o contraste com a referência anterior à carta, sem convertê-lo automaticamente em presente.
- source_word: μὴ συναναμίγνυσθαι
  choice: que não se associem
  rationale: Expressa de modo natural a proibição de manter convivência ou vínculo social próximo.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: alguém que, dizendo-se irmão
  rationale: Preserva a ideia de alguém que leva ou reivindica o nome de irmão, sem decidir se a pessoa é de fato crente.
- source_word: πόρνος
  choice: sexualmente imoral
  rationale: Termo amplo e contemporâneo para conduta sexual ilícita, sem restringir o sentido a uma prática específica.
- source_word: πλεονέκτης
  choice: ganancioso
  rationale: Comunica o desejo ávido de possuir mais, sentido central do termo.
- source_word: λοίδορος
  choice: insultador
  rationale: Indica quem agride ou difama verbalmente; é mais específico do que o amplo 'abusivo'.
- source_word: μέθυσος
  choice: bêbado
  rationale: Designa alguém caracterizado pela embriaguez habitual.
- source_word: ἅρπαξ
  choice: explorador
  rationale: Abrange quem se apodera dos bens alheios ou obtém vantagem de modo predatório; evita limitar o termo necessariamente a fraude comercial.
- source_word: μηδὲ συνεσθίειν
  choice: nem sequer comam
  rationale: Reproduz a intensificação e a referência concreta a compartilhar uma refeição.
theological_decisions:
- issue: Status religioso de ἀδελφὸς ὀνομαζόμενος
  choice: dizendo-se irmão
  alternative: chamado irmão
  rationale: A formulação conserva a tensão entre a profissão pública e a realidade do pertencimento, sem declarar nem negar a autenticidade da fé da pessoa.
- issue: Alcance de 'nem sequer comam'
  choice: Manter a expressão sem explicação interpretativa no corpo do texto
  alternative: Explicitar que se trata da Ceia do Senhor ou de toda refeição social
  rationale: O grego não especifica aqui se a proibição se limita a uma refeição cultual ou abrange refeições sociais; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta. A enumeração preserva o peso ético do original sem linguagem excessivamente técnica ou denominacional.
