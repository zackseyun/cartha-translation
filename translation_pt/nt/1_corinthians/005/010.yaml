id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: pt
  text: não me referia, de modo algum, aos sexualmente imorais deste mundo, nem aos gananciosos e exploradores[a], nem aos idólatras[b], pois, nesse caso, vocês teriam de sair do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ladrões” ou “extorsionários”. O termo grego pode designar os que se apoderam do que pertence a outros pela força ou pela exploração.
    reason: lexical_alternative
  - marker: b
    text: Paulo esclarece que não quis dizer que os fiéis devessem evitar todas as pessoas imorais que estão fora da igreja; compare 1 Coríntios 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: não me referia, de modo algum
  rationale: No contexto, a expressão esclarece e restringe o sentido de uma instrução anterior. A formulação portuguesa explicita a referência elíptica sem transformar a frase numa proibição absoluta.
- source_word: πόρνοις
  choice: aos sexualmente imorais
  rationale: Preserva a referência específica à conduta sexual e usa linguagem contemporânea, clara e não eufemística.
- source_word: τοῦ κόσμου τούτου
  choice: deste mundo
  rationale: Aqui κόσμος designa a sociedade humana em geral, particularmente os que estão fora da comunidade cristã. A expressão conserva a formulação concreta do grego.
- source_word: πλεονέκταις
  choice: aos gananciosos
  rationale: O termo descreve pessoas dominadas pelo desejo de possuir mais, frequentemente com implicações de exploração. “Gananciosos” é natural e amplamente compreensível.
- source_word: καὶ ἅρπαξιν
  choice: e exploradores
  rationale: ἅρπαξ descreve quem se apodera do que pertence a outros, pela força ou por práticas abusivas. “Exploradores” preserva essa amplitude; uma nota registra alternativas mais específicas.
- source_word: εἰδωλολάτραις
  choice: aos idólatras
  rationale: É a correspondência tradicional, concisa e clara para pessoas que prestam culto a ídolos.
- source_word: ἐπεὶ
  choice: pois, nesse caso
  rationale: Introduz a consequência absurda que resultaria de interpretar a instrução de maneira absoluta.
- source_word: ὠφείλετε
  choice: vocês teriam de
  rationale: Embora seja formalmente um imperfeito do indicativo, no argumento expressa necessidade prática resultante de uma hipótese implícita.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: sair do mundo
  rationale: 'Mantém a imagem deliberadamente forte: evitar toda pessoa desse tipo exigiria abandonar o próprio mundo.'
theological_decisions:
- issue: Alcance da separação ordenada no contexto
  choice: Paulo esclarece que sua instrução anterior não exigia separação total das pessoas sexualmente imorais que fazem parte da sociedade em geral.
  alternative: Entender que Paulo ordena completo afastamento social de todas as pessoas imorais.
  rationale: A consequência apresentada pelo próprio versículo — ter de sair do mundo — rejeita uma leitura de isolamento absoluto. A tradução mantém esse esclarecimento sem ampliar ou reduzir a aplicação dada pelo texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” comunica naturalmente a segunda pessoa do plural. A construção “não me referia” supre a elipse contextual necessária em português, enquanto “de modo algum” preserva a ênfase de οὐ πάντως.
