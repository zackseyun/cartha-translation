id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: pt
  text: Caso contrário, o que farão os que se batizam em favor dos mortos[a]? Se os mortos de modo algum são ressuscitados, por que, então, eles se batizam em favor deles?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos mortos”, “por causa dos mortos” ou, menos provavelmente, “sobre os mortos”. A preposição grega pode ser entendida de mais de uma maneira, e não se sabe ao certo a que prática Paulo se refere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Caso contrário
  rationale: Neste contexto argumentativo, introduz a consequência retórica caso se negue a ressurreição; “Caso contrário” expressa isso naturalmente em português.
- source_word: τί ποιήσουσιν
  choice: o que farão
  rationale: Mantém o sentido amplo de ποιέω e a força aberta da pergunta retórica.
- source_word: οἱ βαπτιζόμενοι
  choice: os que se batizam
  rationale: Forma corrente em português para o passivo grego no contexto do batismo, sem determinar a legitimidade ou a natureza da prática.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: em favor dos mortos
  rationale: Expressa um sentido natural de ὑπέρ com genitivo sem explicar qual prática histórica está em vista; outras possibilidades são preservadas em nota.
- source_word: εἰ ὅλως
  choice: Se ... de modo algum
  rationale: “De modo algum” conserva a ênfase de ὅλως ligada à negação.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: os mortos ... não são ressuscitados
  rationale: Preserva a voz passiva do grego e a linguagem paulina de ressurreição, sem explicitar o agente.
- source_word: τί καὶ
  choice: por que, então
  rationale: Reproduz de modo idiomático a força argumentativa da segunda pergunta.
- source_word: βαπτίζονται
  choice: eles se batizam
  rationale: Mantém paralelismo com a primeira ocorrência e apresenta a prática como corrente, sem interpretá-la.
- source_word: ὑπὲρ αὐτῶν
  choice: em favor deles
  rationale: Retoma “os mortos” e conserva o paralelismo lexical com a primeira ocorrência de ὑπέρ.
theological_decisions:
- issue: Sentido do batismo ὑπὲρ τῶν νεκρῶν
  choice: Manter a formulação minimamente interpretativa “se batizam em favor dos mortos”.
  alternative: “se batizam pelos mortos”, “por causa dos mortos” ou, menos provavelmente, “sobre os mortos”
  rationale: A prática exata mencionada por Paulo é incerta. A tradução preserva a tensão do texto e sua função no argumento sobre a ressurreição, sem endossar uma interpretação histórica ou doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Caso contrário” marca a transição argumentativa; “em favor de” conserva a possível ideia representativa, enquanto a nota registra a ambiguidade genuína.
