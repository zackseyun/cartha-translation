  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: pt
  text: Depois, ele apareceu a mais de quinhentos irmãos[a] de uma só vez. A maioria deles permanece até agora, embora alguns tenham adormecido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”. O grego diz “irmãos”, termo que, no uso cristão antigo, às vezes podia referir-se à comunidade mais ampla dos que creem.
    reason: lexical_alternative
  - marker: b
    text: Isto é, morreram. Paulo usa “adormecido”, uma expressão cristã antiga comum para a morte à luz da esperança da ressurreição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Marca a sequência das aparições relatadas por Paulo de modo natural e conciso.
- source_word: ὤφθη
  choice: ele apareceu
  rationale: Neste contexto de aparições após a ressurreição, a forma passiva de ὁράω tem o sentido idiomático de aparecer; o sujeito implícito é Cristo.
- source_word: ἐπάνω πεντακοσίοις
  choice: a mais de quinhentos
  rationale: ἐπάνω diante de numeral indica quantidade superior à mencionada.
- source_word: ἀδελφοῖς
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; no uso cristão antigo, o termo também pode abranger a comunidade de fiéis em geral, possibilidade registrada em nota.
- source_word: ἐφάπαξ
  choice: de uma só vez
  rationale: Expressa que a aparição ao grande grupo ocorreu simultaneamente, numa mesma ocasião.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: A maioria deles
  rationale: Reproduz de modo idiomático a construção partitiva e o sentido de 'o maior número dentre eles'.
- source_word: μένουσιν ἕως ἄρτι
  choice: permanece até agora
  rationale: Preserva o sentido lexical de μένω e a referência ao tempo de Paulo; o singular concorda naturalmente com o coletivo 'maioria'.
- source_word: τινὲς δὲ
  choice: embora alguns
  rationale: Comunica o contraste moderado introduzido por δέ entre a maioria que permanece e os que adormeceram.
- source_word: ἐκοιμήθησαν
  choice: tenham adormecido
  rationale: Conserva a metáfora cristã primitiva do sono para a morte, especialmente significativa no contexto da ressurreição.
theological_decisions:
- issue: Sentido potencialmente inclusivo de ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução mantém no texto a forma masculina do original sem excluir a possibilidade de referência à comunidade mais ampla, esclarecida em nota.
- issue: Metáfora de κοιμάομαι no contexto da ressurreição
  choice: tenham adormecido
  alternative: tenham morrido
  rationale: Preserva a imagem empregada por Paulo e sua ressonância com a esperança da ressurreição, explicando o sentido em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva tanto o masculino do substantivo grego quanto a metáfora do sono, sem eliminar as ambiguidades relevantes.
