id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: pt
  text: 'Mas cada um na sua própria ordem: o Messias[a], as primícias; depois, os que pertencem ao Messias, na sua vinda.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego Χριστός significa “Ungido”.
    reason: alternative_reading
  - marker: b
    text: Ou “presença” ou “chegada”, em vez de “vinda” (παρουσία); neste contexto, o termo se refere ao seu advento futuro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Expressa de modo natural o valor distributivo e retoma a sequência da ressurreição no contexto anterior.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: na sua própria ordem
  rationale: Preserva a ideia de disposição ou sequência estabelecida sem impor ao termo uma conotação militar.
- source_word: ἀπαρχὴ
  choice: as primícias
  rationale: Mantém a imagem bíblica e cultual da primeira porção da colheita, que antecipa e garante o que virá depois.
- source_word: Χριστός
  choice: o Messias
  rationale: Aqui funciona de modo proeminente como título, 'o Ungido', no contraste entre ele e os que lhe pertencem.
- source_word: οἱ τοῦ Χριστοῦ
  choice: os que pertencem ao Messias
  rationale: Torna explícita, em português corrente, a relação de pertencimento expressa pelo genitivo.
- source_word: ἐν τῇ παρουσίᾳ αὐτοῦ
  choice: na sua vinda
  rationale: No contexto escatológico paulino, 'vinda' comunica com clareza o advento futuro, sem acrescentar detalhes não expressos no grego.
theological_decisions:
- issue: Tradução de Χριστός como título messiânico
  choice: o Messias
  alternative: Cristo
  rationale: 'O contexto destaca a função titular de Χριστός: o Messias ressuscitado como primícias e os que lhe pertencem. A alternativa tradicional permanece indicada em nota.'
- issue: Sentido escatológico de παρουσία
  choice: vinda
  alternative: presença ou chegada
  rationale: '''Vinda'' é natural e adequada à sequência futura descrita, enquanto a nota preserva a amplitude lexical do termo grego.'
- issue: Relação entre o Messias e 'as primícias'
  choice: o Messias, as primícias
  alternative: o Messias como primícias
  rationale: A aposição direta acompanha de perto a construção nominal grega e não explicita além do texto a relação por meio de 'como'.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural consagrado “as primícias” preserva a metáfora bíblica, e a pontuação mantém a estrutura concisa do grego.
