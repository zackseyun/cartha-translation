  text: 'Mas alguém dirá: “Como os mortos são ressuscitados?[a] E com que tipo de corpo eles vêm?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como os mortos ressuscitam?” O verbo grego está na voz passiva, literalmente “são ressuscitados”, o que pode sugerir agência divina.'
