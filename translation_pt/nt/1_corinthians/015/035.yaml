lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mas
  rationale: Marca a transição contrastiva para uma pergunta ou objeção antecipada, de modo direto e natural em português.
- source_word: ἐρεῖ τις
  choice: alguém dirá
  rationale: Preserva o futuro do indicativo e introduz naturalmente um interlocutor hipotético.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Como os mortos são ressuscitados?
  rationale: Mantém a interrogativa e a voz passiva explícita de ἐγείρονται, sem tornar o agente mais explícito do que o grego.
- source_word: ποίῳ δὲ σώματι
  choice: E com que tipo de corpo
  rationale: A expressão “que tipo de” preserva a força qualitativa de ποίῳ; “com” traduz de maneira natural o dativo instrumental ou associativo neste contexto.
- source_word: ἔρχονται
  choice: eles vêm
  rationale: Traduz diretamente ἔρχονται e evita substituí-lo interpretativamente por “aparecem” ou repetir “são ressuscitados”.
theological_decisions:
- issue: Formulação e agência da ressurreição
  choice: os mortos são ressuscitados
  alternative: os mortos ressuscitam
  rationale: A voz passiva do grego é preservada por sua possível ressonância de agência divina, sem identificar expressamente o agente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas perguntas reproduz com naturalidade a estrutura interrogativa grega sem eliminar sua relação lógica.
