  text: μὴ πλανᾶσθε· φθείρουσιν ἤθη χρηστὰ ὁμιλίαι κακαί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: pt
  text: 'Não se deixem enganar: as más companhias corrompem os bons costumes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as más conversas corrompem os bons costumes”. O termo grego pode referir-se tanto à convivência ou associação quanto à conversa; o sentido mais amplo, “companhias”, parece ajustar-se melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Não se deixem enganar
  rationale: Preserva a forma de advertência e a ambiguidade da voz grega, sem determinar se o engano vem da própria pessoa ou de outros.
- source_word: φθείρουσιν
  choice: corrompem
  rationale: Expressa deterioração moral e mantém a força proverbial da frase.
- source_word: ἤθη
  choice: costumes
  rationale: No plural, refere-se aos hábitos e à conduta moral; “bons costumes” é uma expressão natural e amplamente compreensível em português.
- source_word: χρηστὰ
  choice: bons
  rationale: Transmite de modo simples e direto o valor ético positivo do adjetivo.
- source_word: ὁμιλίαι
  choice: companhias
  rationale: O substantivo pode indicar convivência, associação ou conversa. “Companhias” comunica naturalmente, neste contexto, a influência das pessoas com quem se convive.
- source_word: κακαί
  choice: más
  rationale: Qualifica as companhias como moralmente nocivas sem intensificar desnecessariamente o sentido para “perversas” ou “malignas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação proverbial natural. O plural inclusivo “se deixem” é adequado a uma comunidade de leitores e evita uma construção passiva menos corrente.
