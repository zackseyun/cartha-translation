  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: pt
  text: Depois, ele apareceu a Tiago[a] e, em seguida, a todos os apóstolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “foi visto por Tiago [...] por todos os apóstolos”.'
    reason: Alternativa lexical que preserva a forma passiva de ὤφθη e dos dativos gregos.
lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Advérbio temporal que introduz o acontecimento seguinte na sequência das aparições; “Depois” é natural e preserva a progressão.
- source_word: ὤφθη
  choice: ele apareceu
  rationale: Aoristo passivo de ὁράω usado de modo idiomático para aparições; “apareceu” comunica naturalmente esse sentido, enquanto a nota preserva a forma mais literal.
- source_word: Ἰακώβῳ
  choice: a Tiago
  rationale: Dativo que indica a pessoa a quem ele apareceu; “Tiago” é a forma tradicional portuguesa do nome neste contexto.
- source_word: εἶτα
  choice: em seguida
  rationale: Segundo advérbio sequencial; “em seguida” distingue com clareza a nova etapa sem alterar a ordem indicada por Paulo.
- source_word: ἀποστόλοις
  choice: apóstolos
  rationale: Neste contexto, designa testemunhas reconhecidas como apóstolos, e não mensageiros em sentido genérico.
- source_word: πᾶσιν
  choice: todos
  rationale: Modifica “apóstolos” e enfatiza a totalidade do grupo, sem definir sua composição exata.
theological_decisions:
- issue: Identidade e abrangência de “todos os apóstolos” em relação a Tiago
  choice: Manter “todos os apóstolos” sem restringir o referente.
  alternative: Entender especificamente os Doze ou um grupo mais amplo de testemunhas comissionadas.
  rationale: O grego não especifica a composição exata do grupo. A tradução preserva a distinção entre a aparição a Tiago e a aparição posterior a todos os apóstolos, sem impor harmonização.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção é natural, preserva a sequência temporal e mantém na nota a formulação grega mais literal.
