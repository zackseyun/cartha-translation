  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: pt
  text: e que foi sepultado, e que foi ressuscitado[a] no terceiro dia, segundo as Escrituras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ressuscitou”. O verbo grego está no perfeito e pode ressaltar que a ressurreição é um acontecimento realizado cujo resultado permanece.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: foi sepultado
  rationale: O aoristo passivo de θάπτω indica de modo direto o sepultamento. “Foi sepultado” é natural em português, preserva a voz passiva e não acrescenta detalhes sobre o tipo de túmulo.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: O perfeito passivo de ἐγείρω descreve a ressurreição como ato realizado com resultado vigente. Como o português não dispõe de uma forma verbal natural que reproduza simultaneamente o perfeito grego e sua voz passiva, “foi ressuscitado” preserva com clareza o acontecimento e a voz; a nota registra a força duradoura do perfeito.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: no terceiro dia
  rationale: A expressão temporal no dativo significa idiomaticamente “no terceiro dia”. Evita-se acrescentar “depois”, que tornaria a cronologia mais explícita do que o texto grego.
- source_word: κατὰ τὰς γραφάς
  choice: segundo as Escrituras
  rationale: Expressa conformidade com o testemunho das Escrituras e conserva a fórmula repetida no contexto imediato.
- source_word: γραφάς
  choice: as Escrituras
  rationale: Neste uso paulino, o termo designa os escritos sagrados reconhecidos, não escritos em geral. A inicial maiúscula sinaliza esse referente.
- source_word: ὅτι
  choice: que
  rationale: Introduz cada oração de conteúdo na fórmula confessional; sua repetição preserva o ritmo estruturado do grego.
- source_word: καὶ
  choice: e
  rationale: Mantém o conectivo simples e repetido da sequência formulaica.
theological_decisions:
- issue: Aspecto e voz do verbo da ressurreição
  choice: foi ressuscitado
  alternative: está ressuscitado; ressuscitou
  rationale: “Foi ressuscitado” mantém a voz passiva, que apresenta Jesus como aquele sobre quem a ação foi realizada. O perfeito grego também aponta para o resultado presente e duradouro, nuance explicitada na nota. “Ressuscitou” é mais idiomático, mas não conserva de forma transparente a voz passiva; “está ressuscitado” soa pouco natural no português contemporâneo.
- issue: Referente de “as Escrituras”
  choice: as Escrituras
  alternative: as Escrituras judaicas; os escritos sagrados
  rationale: A formulação de Paulo remete ao corpo reconhecido de textos sagrados sem defini-lo mais detalhadamente. As alternativas acrescentariam uma explicitação ausente do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “e que” foi mantida para conservar a cadência confessional do original; “segundo as Escrituras” preserva a formulação tradicional sem perder naturalidade.
