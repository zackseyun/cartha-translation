id: 1CO.15.21
reference: 1 Corinthians 15:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: pt
  text: Pois, visto que a morte veio por meio de um homem[a][b], também por meio de um homem veio a ressurreição dos mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por um homem», nas duas orações; a preposição grega pode indicar tanto agência como mediação.
    reason: lexical_alternative
  - marker: b
    text: O contexto de Paulo identifica os dois homens como Adão e o Messias (ver 15.22,45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Pois, visto que
  rationale: Preserva tanto a função explicativa de γάρ quanto a relação causal de ἐπειδή, em português natural e digno.
- source_word: δι’ ἀνθρώπου
  choice: por meio de um homem
  rationale: διά com genitivo pode indicar mediação ou agência. A formulação mantém o singular anartro e o paralelismo representativo entre Adão e o Messias.
- source_word: θάνατος
  choice: a morte veio
  rationale: O grego não traz verbo expresso; «veio» completa naturalmente a frase em português e comunica a entrada da morte sem sobrecarregar o texto.
- source_word: καὶ
  choice: também
  rationale: Explicita a correspondência entre os dois membros paralelos do argumento.
- source_word: ἀνάστασις νεκρῶν
  choice: a ressurreição dos mortos
  rationale: É a expressão portuguesa direta e consagrada para a ressurreição concreta daqueles que morreram, sem reduzi-la a uma noção vaga de vida após a morte.
theological_decisions:
- issue: Contraste representativo entre Adão e Cristo
  choice: Manter «um homem» nas duas orações sem identificar os homens no texto principal.
  alternative: «um só homem» nas duas orações; ou explicitar «Adão» e «Cristo».
  rationale: O contexto identifica os dois homens, mas este versículo apresenta o princípio em forma paralela e concisa. A tradução preserva a formulação grega sem acrescentar nomes nem um numeral ausente.
- issue: Natureza da ressurreição
  choice: Traduzir ἀνάστασις νεκρῶν como «a ressurreição dos mortos».
  alternative: «ressurreição espiritual» ou «vida após a morte».
  rationale: O argumento de 1 Coríntios 15 trata da ressurreição real dos mortos; a tradução não deve espiritualizar nem enfraquecer essa afirmação.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A ordem das palavras foi ajustada na segunda oração para produzir paralelismo natural, mantendo a repetição deliberada de «por meio de um homem».
