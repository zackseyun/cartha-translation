  text: ἔσχατον δὲ πάντων ὡσπερεὶ τῷ ἐκτρώματι ὤφθη κἀμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: pt
  text: E, por último de todos, apareceu também a mim, como a um nascido fora de tempo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «como ao feto abortado» ou «como ao aborto espontâneo». Paulo emprega uma metáfora forte e autodepreciativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: E, por último de todos
  rationale: ἔσχατον funciona adverbialmente, e πάντων completa a ideia de sequência entre todas as aparições mencionadas; δέ prossegue o relato sem exigir contraste forte.
- source_word: ὡσπερεὶ
  choice: como a
  rationale: Introduz uma comparação aproximativa; «como a» é natural em português e preserva a força comparativa sem transformá-la em afirmação literal.
- source_word: τῷ ἐκτρώματι
  choice: um nascido fora do tempo
  rationale: ἔκτρωμα designa literalmente um feto abortado ou produto de aborto espontâneo e funciona aqui como metáfora autodepreciativa. A formulação escolhida conserva a ideia de nascimento anormal e impróprio, enquanto a nota registra o caráter mais forte do grego.
- source_word: ὤφθη
  choice: apareceu
  rationale: Embora a forma seja passiva, em relatos de aparição ὁράω é naturalmente vertido por «apareceu», indicando manifestação visível.
- source_word: κἀμοί
  choice: também a mim
  rationale: A crase de καί com ἐμοί tem sentido aditivo e inclui Paulo na sequência das testemunhas.
theological_decisions:
- issue: A metáfora autodepreciativa ἐκτρώματι
  choice: Manter no texto a metáfora de nascimento fora do tempo e explicar em nota sua formulação literal mais contundente.
  alternative: «como ao abortivo», «como ao que foi abortado» ou «como a um nascido de modo anormal»
  rationale: O grego expressa anormalidade e profunda autodepreciação, mas não define aqui exatamente em que aspecto Paulo desenvolve a imagem. A tradução evita impor uma interpretação doutrinária específica e conserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Por último de todos» preserva a sequência, e «nascido fora do tempo» mantém a imagem em linguagem corrente; a nota explicita a contundência lexical do original.
