id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: pt
  text: Pois, assim como em Adão todos morrem, assim também no Messias[a] todos serão vivificados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo”. O título grego Χριστός pode ser vertido como “Cristo” ou traduzido por seu sentido, “Messias”.'
    reason: Registra a tradução tradicional alternativa do título grego sem alterar o sentido do texto principal.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a ligação explicativa de γάρ com o contexto anterior quanto a força comparativa de ὥσπερ, em português natural.
- source_word: ἐν τῷ Ἀδὰμ
  choice: em Adão
  rationale: Mantém a linguagem compacta e representativa do grego sem definir ἐν como instrumento ou explicitar uma união de modo interpretativo.
- source_word: πάντες
  choice: todos
  rationale: Conserva o alcance não qualificado e o paralelismo deliberado entre as duas ocorrências.
- source_word: ἀποθνῄσκουσιν
  choice: morrem
  rationale: O presente simples expressa naturalmente a realidade geral associada a Adão.
- source_word: οὕτως καὶ
  choice: assim também
  rationale: Reproduz a correlação com ὥσπερ e preserva a força aditiva de καί.
- source_word: ἐν τῷ Χριστῷ
  choice: no Messias
  rationale: Traduz Χριστός como título, comunicando seu sentido, e mantém o paralelo formal com “em Adão”.
- source_word: ζῳοποιηθήσονται
  choice: serão vivificados
  rationale: Preserva o futuro e a voz passiva do verbo, deixando implícito, como no grego, o agente que dá vida.
theological_decisions:
- issue: Alcance de “todos” nas duas orações
  choice: Manter “todos” sem qualificação em ambas as partes.
  alternative: Restringir explicitamente o segundo “todos” aos que creem, ou declarar que ambas as ocorrências abrangem a humanidade exatamente no mesmo sentido.
  rationale: O texto grego estabelece o paralelo πάντες… πάντες, mas este versículo, isoladamente, não explicita o mecanismo nem resolve todas as implicações de seu alcance. A tradução preserva essa tensão.
- issue: Sentido relacional de ἐν (“em”)
  choice: Conservar “em Adão” e “no Messias”.
  alternative: Traduzir como “por meio de Adão/do Messias” ou “em união com Adão/o Messias”.
  rationale: As alternativas especificariam instrumentalidade ou união de forma mais explícita do que o texto grego, enfraquecendo sua concisão e ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vivificados” foi mantido por reproduzir com concisão a voz passiva e a ideia de receber vida; o paralelismo sintático das duas orações foi preservado.
