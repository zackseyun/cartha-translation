  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: pt
  text: num instante, num piscar de olhos[a], ao som da última trombeta. Pois a trombeta soará, os mortos serão ressuscitados incorruptíveis, e nós seremos transformados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num abrir e fechar de olhos”. A expressão grega indica extrema rapidez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: num instante
  rationale: Ἄτομος designa literalmente algo indivisível; nesta expressão temporal, indica um ponto de tempo extremamente breve. “Num instante” transmite isso com naturalidade, sem recorrer ao tecnicismo “num instante indivisível”.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: num piscar de olhos
  rationale: A expressão descreve um movimento extremamente rápido do olho e, no contexto, reforça a rapidez súbita da transformação. “Num piscar de olhos” é claro e idiomático em português.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: ao som da última trombeta
  rationale: A preposição ἐν admite aqui valor temporal associado ao toque da trombeta. “Ao som da última trombeta” é natural em português, mantém “última” para ἐσχάτῃ e não especifica além do texto o papel escatológico desse sinal.
- source_word: σαλπίσει
  choice: a trombeta soará
  rationale: O verbo significa tocar a trombeta ou fazê-la soar. Como σάλπιγγι aparece imediatamente antes, explicitar “a trombeta” fornece um sujeito natural em português e preserva a ligação contextual.
- source_word: οἱ νεκροὶ
  choice: os mortos
  rationale: O adjetivo substantivado refere-se coletivamente às pessoas mortas. “Os mortos” é a forma direta e corrente em português.
- source_word: ἐγερθήσονται
  choice: serão ressuscitados
  rationale: O futuro passivo de ἐγείρω, neste contexto de ressurreição, é expresso com clareza por “serão ressuscitados”, preservando a voz passiva e evitando a possível ambiguidade de “serão levantados”.
- source_word: ἄφθαρτοι
  choice: incorruptíveis
  rationale: Ἄφθαρτος indica aquilo que não está sujeito à corrupção, deterioração ou morte. “Incorruptíveis” é uma forma corrente no vocabulário bíblico em português e se encaixa no argumento do capítulo.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome está explícito no grego e deve ser mantido, inclusive por seu contraste com “os mortos”, sem explicar no corpo do versículo quem integra esse “nós”.
- source_word: ἀλλαγησόμεθα
  choice: seremos transformados
  rationale: O futuro passivo de ἀλλάσσω indica uma mudança sofrida pelo sujeito. “Seremos transformados” comunica em português a mudança profunda pressuposta pelo contexto, sem especificar sua natureza além do argumento imediato.
theological_decisions:
- issue: A relação da “última trombeta” com sistemas escatológicos específicos
  choice: ao som da última trombeta
  alternative: na última trombeta
  rationale: A tradução conserva a designação “última” e a imagem da trombeta, mas não identifica o evento com qualquer esquema escatológico desenvolvido posteriormente.
- issue: A identidade do grupo indicado por “nós”
  choice: nós seremos transformados
  alternative: os que dentre nós ainda estiverem vivos serão transformados
  rationale: O pronome grego de primeira pessoa é preservado sem uma expansão interpretativa. O contraste com “os mortos” permanece visível, mas sua explicação deve vir do contexto, não de uma paráfrase inserida no versículo.
- issue: A passividade da ressurreição e da transformação
  choice: serão ressuscitados; seremos transformados
  alternative: ressuscitarão; nós nos transformaremos
  rationale: As formas passivas gregas são mantidas. Isso evita apresentar os mortos ou os vivos como agentes de sua própria mudança, sem nomear explicitamente um agente que o versículo não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência paralela do grego é preservada em “num instante, num piscar de olhos”, e o vocabulário escatológico permanece direto sem receber explicações doutrinárias no corpo do texto.
