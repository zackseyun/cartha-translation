  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: pt
  text: O primeiro homem era da terra, feito de pó[a]; o segundo homem é do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de pó» ou «terrestre». O adjetivo grego χοϊκός remete à criação de Adão a partir do pó.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: primeiro
  rationale: Preserva o ordinal que inicia o contraste representativo entre Adão e Cristo.
- source_word: ἄνθρωπος
  choice: homem
  rationale: No singular e neste contexto, refere-se paralelamente a Adão e a Cristo; “homem” conserva a tipologia e a repetição deliberada.
- source_word: ἐκ γῆς
  choice: veio da terra
  rationale: Expressa origem e mantém a alusão à criação de Adão a partir da terra; a inserção verbal torna natural em português a oração nominal grega.
- source_word: χοϊκός
  choice: feito de pó
  rationale: Comunica a composição ou qualidade ligada ao pó e torna perceptível a alusão de Gênesis, sem o sentido moderno potencialmente ambíguo de “terreno”.
- source_word: δεύτερος
  choice: segundo
  rationale: Mantém o paralelismo formal com “primeiro”.
- source_word: ἐξ οὐρανοῦ
  choice: é do céu
  rationale: Indica origem celestial em português natural e preserva a leitura presente da oração elíptica.
theological_decisions:
- issue: Força cristológica de “o segundo homem”
  choice: Manter “o segundo homem” sem acrescentar “Cristo”.
  alternative: “O segundo homem, Cristo, é do céu.”
  rationale: O contexto identifica esse homem com Cristo, mas o versículo grego não o nomeia; a formulação preserva a tipologia sem expansão interpretativa.
- issue: Tempo verbal da segunda oração
  choice: “é do céu”
  alternative: “veio do céu” ou “era do céu”
  rationale: Embora não haja cópula expressa no grego, a elipse admite naturalmente uma afirmação presente; isso evita impor uma simetria pretérita não exigida pelo texto.
- issue: Relação entre ἐκ γῆς e χοϊκός
  choice: 'Traduzir as duas expressões distintamente: “da terra, feito de pó”.'
  alternative: Fundir como “terreno” ou “feito do pó da terra”.
  rationale: A tradução conserva tanto a indicação de origem quanto o adjetivo que ecoa a formação de Adão do pó.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “homem” preserva o paralelismo do original; “céu”, no singular, mantém o sentido transcendente do contexto.
