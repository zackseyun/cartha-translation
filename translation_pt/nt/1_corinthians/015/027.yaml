reference: 1 Corinthians 15:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: pt
  text: Pois ele sujeitou todas as coisas debaixo dos pés dele. Mas, quando se diz que “todas as coisas foram sujeitas”, fica claro que isso não inclui[a] aquele que lhe sujeitou todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com exceção daquele que lhe sujeitou todas as coisas”.'
    reason: Alternativa concisa que preserva o valor de exceção de ἐκτός, sem introduzir a ideia deslocada de que «isso ocorre» com uma exceção.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: todas as coisas
  rationale: O plural neutro tem alcance abrangente e preserva a referência à linguagem do Salmo 8; não se limita especificamente a todas as pessoas.
- source_word: ὑπέταξεν
  choice: sujeitou
  rationale: Expressa a ação decisiva de colocar tudo em posição subordinada, com formulação natural e digna em português.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sob os pés dele
  rationale: Mantém literalmente a imagem bíblica de domínio. “Dele” evita que “seus” seja entendido como referência aos pés do sujeito que realiza a ação.
- source_word: ὅταν δὲ εἴπῃ
  choice: Mas, quando se diz
  rationale: A construção impessoal é natural em português e preserva a indefinição formal do sujeito, permitindo a referência à declaração bíblica sem identificar explicitamente quem fala.
- source_word: ὑποτέτακται
  choice: foram sujeitas
  rationale: Conserva a voz passiva e comunica o ato consumado; no contexto, o estado resultante permanece evidente.
- source_word: δῆλον
  choice: fica claro
  rationale: Apresenta de modo corrente a inferência lógica que Paulo considera evidente.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: isso não inclui aquele que lhe sujeitou todas as coisas
  rationale: 'Torna clara, em português natural, a exceção expressa por ἐκτός: aquele que sujeitou tudo ao Messias não faz parte do conjunto que lhe foi sujeitado.'
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo indica aquele a quem todas as coisas foram sujeitadas, isto é, o Filho no contexto, sem acrescentar uma preposição ausente do sentido da construção.
theological_decisions:
- issue: Relação entre o Filho e aquele que sujeita todas as coisas
  choice: Aquele que sujeitou todas as coisas ao Filho é explicitamente excluído das “todas as coisas” sujeitas a ele.
  alternative: “exceto aquele que lhe sujeitou todas as coisas”
  rationale: A tradução conserva a distinção e a exceção lógica presentes no texto, sem diminuir a dignidade do Filho nem desenvolver uma formulação doutrinária além do que Paulo afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “todas as coisas” e a imagem “sob os pés” foram mantidas por sua função argumentativa e por sua ressonância bíblica. A formulação impessoal “quando se diz” preserva a ambiguidade do sujeito de εἴπῃ.
