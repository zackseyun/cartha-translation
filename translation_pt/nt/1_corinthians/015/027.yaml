revisions:
- from: Pois ele sujeitou todas as coisas sob os pés dele. Mas, quando se diz que “todas as coisas foram sujeitas”, fica claro que isso não inclui[a] aquele que lhe sujeitou todas as coisas.
  to: Pois ele sujeitou todas as coisas debaixo dos pés dele. Mas, quando se diz que “todas as coisas foram sujeitas”, fica claro que isso não inclui[a] aquele que lhe sujeitou todas as coisas.
  rationale: Apenas a nota precisava de correção segura, pois sua redação anterior não representava adequadamente a construção de exceção. Ajustou-se também «sob» para «debaixo de», expressão mais corrente na linguagem bíblica portuguesa para a imagem literal de domínio, sem alterar o sentido. A ambiguidade formal do sujeito de «quando se diz» e as distinções pronominais do contexto foram preservadas.
