review_pass:
  verdict: revise
  source_fidelity: O texto transmite corretamente a sujeição universal, a imagem de domínio «sob os pés», a leitura impessoal da declaração citada e a exceção daquele que sujeitou todas as coisas a Cristo. A forma verbal «foram sujeitas» é aceitável para o perfeito passivo grego, embora expresse menos claramente o estado resultante do que «estão sujeitas».
  naturalness: A redação é clara e de registro adequado. «Sob os pés dele» é justificável para evitar que «seus pés» seja atribuído ao sujeito de «sujeitou», mas «debaixo dos pés dele» é uma formulação bíblica portuguesa mais estabelecida e natural neste contexto.
  terminology: '«Todas as coisas» preserva bem o escopo de πάντα. «Sujeitou/sujeitas» mantém coerência lexical e a linguagem de subordinação do original. A nota, porém, não apresenta uma alternativa idiomática nem sintaticamente equivalente: «isso ocorre com exceção» desloca o sentido da exceção.'
