  text: Onde está, ó morte, a tua vitória?[a] Onde está, ó morte, o teu aguilhão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem, na primeira oração: “Onde está, ó morte, o teu aguilhão?”, leitura refletida em algumas traduções tradicionais.'
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: Onde está
  rationale: O advérbio interrogativo introduz uma pergunta retórica de desafio. Em português, “Onde está” expressa naturalmente a construção elíptica grega sem acrescentar ênfase indevida.
- source_word: σου
  choice: a sua / o seu
  rationale: O genitivo de segunda pessoa indica posse. A forma “seu/sua” é natural e amplamente compreensível no discurso dirigido à morte personificada.
- source_word: θάνατε
  choice: ó morte
  rationale: O vocativo dirige-se à morte personificada. “Ó morte” conserva a força apostrófica e poética do grego.
- source_word: νῖκος
  choice: vitória
  rationale: O substantivo significa vitória ou triunfo. “Vitória” é claro, tradicional e se liga diretamente ao contexto do versículo 54.
- source_word: κέντρον
  choice: aguilhão
  rationale: κέντρον pode designar um ferrão ou instrumento pontiagudo. “Aguilhão” mantém a imagem figurada e corresponde bem à explicação de Paulo no versículo seguinte.
theological_decisions:
- issue: Leitura do texto crítico na primeira oração
  choice: Traduzir νῖκος por “vitória” no texto principal
  alternative: Traduzir a primeira oração com “aguilhão”, segundo a variante preservada em alguns manuscritos e refletida em traduções tradicionais.
  rationale: O SBLGNT traz νῖκος na primeira oração, formando a sequência “vitória ... aguilhão” e retomando a afirmação de que a morte foi tragada pela vitória no versículo 54. A variante merece nota por sua presença na tradição manuscrita e tradutória.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. O vocativo “ó morte” preserva a personificação; “aguilhão” mantém a metáfora e a ligação com o versículo 56.
