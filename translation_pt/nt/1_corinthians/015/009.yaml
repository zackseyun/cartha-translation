reference: 1 Corinthians 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: pt
  text: Pois eu sou o menor dos apóstolos e não sou digno[a] de ser chamado apóstolo, porque persegui a igreja de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não sou qualificado» ou «não sou apto para ser chamado apóstolo».'
    reason: A palavra grega ἱκανός pode indicar dignidade, suficiência, aptidão ou qualificação.
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior de modo natural e conciso em português.
- source_word: ἐλάχιστος
  choice: o menor
  rationale: Expressa posição ou importância relativa entre os apóstolos, não tamanho físico.
- source_word: ἀπόστολος / ἀποστόλων
  choice: apóstolo / apóstolos
  rationale: Preserva o sentido reconhecido do grupo e da função apostólica neste contexto.
- source_word: ἱκανός
  choice: digno
  rationale: No contexto de auto-humilhação motivada pela perseguição passada, comunica adequadamente a percepção de indignidade de Paulo, sem excluir a nuance de aptidão registrada em nota.
- source_word: καλεῖσθαι
  choice: ser chamado
  rationale: Reproduz naturalmente em português a construção passiva do grego.
- source_word: διότι
  choice: porque
  rationale: Introduz claramente a razão apresentada por Paulo para sua declaração de indignidade.
- source_word: ἐδίωξα
  choice: persegui
  rationale: Comunica o sentido hostil inequívoco das ações anteriores de Paulo contra os cristãos.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: a igreja de Deus
  rationale: É uma formulação natural e consolidada que preserva a referência à comunidade pertencente a Deus.
- source_word: ὃς
  choice: e não sou
  rationale: A coordenação evita em português a relativa pesada e pouco natural «o qual não sou», mantendo a continuidade semântica da autodescrição de Paulo.
theological_decisions:
- issue: Natureza da declaração de Paulo sobre seu apostolado
  choice: Paulo se inclui entre os apóstolos, mas declara-se o menor e indigno do título por ter perseguido a igreja.
  alternative: Entender que Paulo nega ser apóstolo, ou que fala somente de inferioridade social, sem dimensão moral.
  rationale: «Sou o menor dos apóstolos» pressupõe sua inclusão no grupo, enquanto a perseguição passada fundamenta sua declaração de indignidade. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação «e não sou» é mais natural do que uma reprodução rígida do pronome relativo grego. O marcador de nota foi colocado após a frase à qual se aplica.
