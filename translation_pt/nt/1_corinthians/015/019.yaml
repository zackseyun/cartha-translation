id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: pt
  text: Se temos colocado nossa esperança no Messias[a] somente para esta vida[b], somos mais dignos de compaixão do que todas as outras pessoas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em Cristo». O título grego Χριστός pode ser traduzido por «Cristo» ou «Messias»; aqui, «Messias» preserva o sentido do título.
    reason: alternative_reading
  - marker: b
    text: 'Outra tradução possível: «Se somente nesta vida temos colocado nossa esperança no Messias».'
    reason: word_order_and_scope
  - marker: c
    text: Ou «de todas as pessoas, somos as mais dignas de compaixão». O comparativo grego também pode ser expresso de modo idiomático com sentido superlativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Introduz diretamente a condição retórica de Paulo.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: para esta vida
  rationale: Neste contexto, exprime com clareza que a esperança estaria limitada à vida presente, sem sugerir apenas o período em que se espera.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva tanto a preposição da fórmula paulina quanto o sentido titular de Χριστός; a forma tradicional «em Cristo» é registrada em nota.
- source_word: ἠλπικότες ἐσμὲν
  choice: temos colocado nossa esperança
  rationale: 'Expressa em português natural o perfeito perifrástico grego: uma esperança assumida anteriormente e mantida no presente.'
- source_word: μόνον
  choice: somente
  rationale: Limita a esperança a esta vida; sua colocação evita a leitura de que esperar seria a única ação dos fiéis.
- source_word: ἐλεεινότεροι
  choice: mais dignos de compaixão
  rationale: Conserva a forma comparativa e o sentido de pessoas que merecem piedade, não simplesmente de pessoas infelizes.
- source_word: πάντων ἀνθρώπων
  choice: do que todas as outras pessoas
  rationale: Refere-se à humanidade em geral, sem restrição de gênero; «outras» torna explícita em português a comparação com o restante das pessoas.
theological_decisions:
- issue: Sentido de Χριστός na fórmula paulina ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: A tradução principal conserva o sentido do título, enquanto a alternativa tradicional é oferecida sem transformar a questão lexical em afirmação doutrinária.
- issue: Alcance de μόνον em relação à esperança cristã
  choice: A esperança é apresentada condicionalmente como limitada à vida presente
  alternative: Se somente nesta vida temos colocado nossa esperança no Messias
  rationale: A formulação principal esclarece o argumento contextual, mas a nota preserva a ordem mais próxima do grego e sua possível nuance.
- issue: Força do comparativo ἐλεεινότεροι
  choice: mais dignos de compaixão do que todas as outras pessoas
  alternative: de todas as pessoas, somos as mais dignas de compaixão
  rationale: Mantém-se o comparativo formal no texto, registrando-se em nota a expressão superlativa idiomática possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Temos colocado nossa esperança» evita o sentido comum de «esperar» como aguardar e comunica uma confiança estabelecida e ainda vigente. A sintaxe principal privilegia clareza, enquanto as notas preservam alternativas formais e tradicionais.
