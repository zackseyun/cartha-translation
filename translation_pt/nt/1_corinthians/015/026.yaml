lexical_decisions:
- source_word: ἔσχατος
  choice: último
  rationale: Indica o que vem por último numa sequência e preserva naturalmente a ordem escatológica do argumento de Paulo.
- source_word: ἐχθρὸς
  choice: inimigo
  rationale: Designa um adversário ou poder hostil e mantém a personificação da morte.
- source_word: καταργεῖται
  choice: a ser reduzido a nada
  rationale: Expressa a ideia de levar ao fim ou tornar inoperante, sem exigir a noção mais específica de aniquilação. A construção também comunica com naturalidade o presente passivo em função da sequência descrita.
- source_word: ὁ θάνατος
  choice: a morte
  rationale: O substantivo definido identifica a morte, personificada, como o inimigo final.
theological_decisions:
- issue: Sentido de καταργεῖται em relação à derrota da morte
  choice: a ser reduzido a nada
  alternative: a ser destruído
  rationale: A opção principal preserva a amplitude do verbo grego — pôr fim, anular ou tornar inoperante — sem definir além do texto a natureza metafísica dessa derrota. A alternativa tradicional permanece legítima.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a personificação da morte e a sequência escatológica do contexto.
