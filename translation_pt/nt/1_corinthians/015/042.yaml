  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: pt
  text: 'Assim também é com a ressurreição dos mortos: o corpo é semeado em condição perecível; é ressuscitado em condição imperecível.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “semeado sujeito à deterioração; ressuscitado livre da deterioração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Assim também
  rationale: Mantém de forma concisa a força comparativa e conclusiva que liga a afirmação à analogia da semente no contexto anterior.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: a ressurreição dos mortos
  rationale: Reproduz naturalmente a construção genitiva grega e conserva o foco de Paulo na ressurreição daqueles que morreram.
- source_word: σπείρεται
  choice: semeia-se
  rationale: Preserva a metáfora agrícola e a forma passiva, além do paralelismo com ἐγείρεται.
- source_word: ἐν φθορᾷ
  choice: em condição perecível
  rationale: Expressa aqui a sujeição do corpo à deterioração e à morte. A inclusão de 'condição' torna a construção natural em português sem limitar φθορά ao processo físico de decomposição.
- source_word: ἐγείρεται
  choice: ressuscita-se
  rationale: No contexto da ressurreição, comunica com clareza o sentido de ser levantado dentre os mortos e mantém a construção passiva e impessoal paralela a 'semeia-se'.
- source_word: ἐν ἀφθαρσίᾳ
  choice: em condição imperecível
  rationale: Conserva o contraste lexical direto com φθορά e comunica a incapacidade de deteriorar-se ou morrer novamente.
theological_decisions:
- issue: Natureza do corpo na ressurreição no contraste de Paulo
  choice: Manter a metáfora corporal de semear e ressuscitar com formas passivas, sem explicitar no texto o substantivo 'corpo'.
  alternative: Parafrasear como 'o corpo é sepultado... ressuscitado imperecível' ou entender o contraste sobretudo em sentido moral.
  rationale: O contexto identifica o referente corporal, mas o versículo grego deixa o sujeito de σπείρεται e ἐγείρεται implícito. A tradução mantém tanto o caráter corporal da metáfora quanto essa concisão e preserva a tensão entre continuidade e transformação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Condição perecível/imperecível' evita o possível sentido moral de 'corrupção/incorrupção' no português atual, sem perder a oposição semântica do grego.
