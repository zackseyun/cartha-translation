review_pass:
  verdict: revise
  source_fidelity: 'A oposição de φθορά e ἀφθαρσία é bem captada por “condição perecível” e “condição imperecível”, e a metáfora de semear/ressuscitar é preservada. Contudo, as formas “semeia-se” e “ressuscita-se” são ambíguas em português: podem ser lidas como impessoais ou reflexivas e não exprimem com suficiente clareza o passivo grego. A explicitação contextual de “o corpo” permite uma construção passiva inequívoca sem alterar o sentido.'
  naturalness: “Assim também é a ressurreição dos mortos” é compreensível, mas “Assim também é com a ressurreição dos mortos” soa mais idiomático como conclusão da analogia precedente. A construção com “o corpo é semeado ... é ressuscitado” é fluente, clara e mantém o paralelismo.
  terminology: “Ressurreição dos mortos” é a formulação adequada para ἡ ἀνάστασις τῶν νεκρῶν. “Perecível/imperecível” comunica de modo moderno e não moralizante o contraste entre φθορά e ἀφθαρσία. “Corpo” é contextual, pois o argumento imediato trata do corpo que é semeado e levantado.
  issues:
