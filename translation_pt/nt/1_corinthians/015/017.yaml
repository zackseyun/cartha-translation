id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: pt
  text: Mas, se o Messias não foi ressuscitado[a], a fé de vocês é inútil[b]; vocês ainda estão em seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ressuscitou”.'
    reason: Alternativa que entende a forma verbal em sentido intransitivo/médio, embora a tradução principal preserve a forma passiva.
  - marker: b
    text: 'Ou: “é vã”.'
    reason: Alternativa lexical tradicional para ματαία.
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Preserva o sentido titular de Χριστός neste argumento teológico, em linguagem clara e natural.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: O perfeito passivo expressa um acontecimento passado com consequência presente e preserva a agência divina implícita sem explicitar o agente.
- source_word: ματαία
  choice: inútil
  rationale: Comunica de modo atual que, nessa hipótese, a fé não alcançaria seu propósito; evita a possível ambiguidade moderna de 'vã'.
- source_word: πίστις ὑμῶν
  choice: a fé de vocês
  rationale: Neste contexto, πίστις designa a fé dos coríntios; 'de vocês' é amplamente inteligível e reproduz o plural de ὑμῶν.
- source_word: ἔτι
  choice: ainda
  rationale: Expressa naturalmente a continuidade da condição resultante.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: em seus pecados
  rationale: Mantém a metáfora locativa do grego sem definir além do texto se estão em foco culpa, domínio ou condição do pecado.
- source_word: δὲ
  choice: Mas
  rationale: Assinala adequadamente o contraste com o argumento precedente.
theological_decisions:
- issue: Formulação da ressurreição e agência
  choice: não foi ressuscitado
  alternative: não ressuscitou
  rationale: A forma passiva conserva a construção grega e a agência implícita, sem acrescentar explicitamente Deus como agente.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Aqui o termo funciona adequadamente como título do ungido cuja ressurreição está em questão; a tradução torna esse valor perceptível ao leitor.
- issue: Sentido de estar nos pecados
  choice: em seus pecados
  alternative: sob o poder de seus pecados
  rationale: A formulação literal preserva a amplitude teológica da expressão, sem restringi-la indevidamente a culpa, poder ou condenação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural é explicitado por “vocês”. A pontuação preserva a progressão lógica da frase grega.
