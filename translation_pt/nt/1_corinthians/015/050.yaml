id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: pt
  text: 'Digo isto, irmãos[a]: carne e sangue não podem herdar o reino de Deus[b], nem o que é perecível herda o que é imperecível.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego diz «irmãos» e pode dirigir-se inclusivamente a toda a congregação.
    reason: lexical_alternative
  - marker: b
    text: «Carne e sangue» é uma expressão idiomática para a vida humana mortal em sua condição presente, e não uma negação da ressurreição corporal.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Digo isto
  rationale: Preserva a afirmação direta de Paulo. O valor conectivo leve de δέ pode ficar implícito em português, evitando acrescentar um marcador temporal inexistente no grego.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego e seu uso tradicional como vocativo; a possível referência inclusiva a toda a congregação é indicada em nota.
- source_word: σὰρξ καὶ αἷμα
  choice: carne e sangue
  rationale: Conserva a expressão idiomática e sua força retórica, explicando em nota que se refere à vida humana mortal em sua condição presente.
- source_word: βασιλείαν θεοῦ
  choice: o reino de Deus
  rationale: Equivalente natural e consagrado que preserva a construção e o peso teológico da expressão.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: herdar / herda
  rationale: Mantém a repetição e o paralelismo do texto grego, bem como a nuance de receber uma herança.
- source_word: οὐ δύναται
  choice: não podem
  rationale: Concorda naturalmente com o composto idiomático «carne e sangue» em português e expressa a incapacidade indicada pelo grego.
- source_word: ἡ φθορά
  choice: o que é perecível
  rationale: No contexto da ressurreição, comunica com clareza aquilo que está sujeito à deterioração, sem reduzir o termo a «corrupção» em sentido moral.
- source_word: τὴν ἀφθαρσίαν
  choice: o que é imperecível
  rationale: Preserva o contraste lexical direto com φθορά. Evita «imortalidade», conceito relacionado, mas expresso por outro vocábulo grego.
theological_decisions:
- issue: Sentido de «carne e sangue» em relação à ressurreição
  choice: Expressão idiomática para a existência humana mortal e perecível em sua condição presente.
  alternative: Afirmação de que a materialidade física em si não pode entrar no reino de Deus.
  rationale: O contexto imediato ensina a transformação do corpo perecível em imperecível, não o abandono de toda existência corporal. A tradução mantém a expressão sem inserir uma interpretação antagônica ao corpo.
- issue: Referência do vocativo ἀδελφοί
  choice: «irmãos» no texto, com o possível sentido congregacional inclusivo explicado em nota.
  alternative: «irmãos e irmãs» no texto principal.
  rationale: A opção preserva a forma masculina do original e, ao mesmo tempo, informa o leitor de que o uso paulino pode abranger toda a congregação.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. O paralelismo do grego foi preservado por meio de «herdar/herda» e «perecível/imperecível».
