  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: pt
  text: Há também corpos celestiais e corpos terrestres; mas uma é a glória dos celestiais, e outra, a dos terrestres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώματα
  choice: corpos
  rationale: Traduz diretamente o termo grego e mantém amplo o referente da analogia, sem especificar indevidamente corpos astronômicos, ressuscitados ou outras formas corpóreas.
- source_word: ἐπουράνια
  choice: celestiais
  rationale: Expressa aquilo que pertence ao céu e forma um par natural com “terrestres”; no contexto, não restringe necessariamente o referente a astros.
- source_word: ἐπίγεια
  choice: terrestres
  rationale: Corresponde ao que está na terra ou pertence a ela e mantém o paralelismo conciso com “celestiais”.
- source_word: ἀλλὰ
  choice: mas
  rationale: Reproduz de modo simples e natural o contraste introduzido pelo grego.
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: uma ... e outra
  rationale: Preserva a construção correlativa e a distinção qualitativa entre as duas glórias sem acrescentar a palavra “tipo”, ausente no texto.
- source_word: δόξα
  choice: glória
  rationale: Mantém o vocabulário paulino e permite tanto a ideia de esplendor quanto suas ressonâncias teológicas mais amplas.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: dos celestiais ... dos terrestres
  rationale: Conserva a elipse do grego, cujo substantivo “corpos” é recuperado naturalmente da primeira oração; na segunda ocorrência, “a” retoma “glória” para dar clareza em português.
theological_decisions:
- issue: Referente de “corpos celestiais” e “corpos terrestres”
  choice: Manter as expressões genéricas, sem identificar explicitamente os corpos celestiais como astros nem como seres celestiais.
  alternative: Traduzir como “corpos do céu e corpos da terra”, ou interpretar como corpos astronômicos e corpos vivos terrestres.
  rationale: O grego emprega σώματα, “corpos”, e o contexto enfatiza diferentes formas corpóreas e diferentes glórias. A formulação genérica preserva a amplitude e a tensão da analogia de Paulo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Celestiais/terrestres” conserva o paralelismo compacto e evita explicitar uma interpretação astronômica. A repetição estrutural aproxima a tradução do ritmo do grego.
