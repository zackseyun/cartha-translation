  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: pt
  text: É semeado um corpo natural; é ressuscitado um corpo espiritual. Se há um corpo natural[a], há também um corpo espiritual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «corpo psíquico» — em contraste com «corpo espiritual». O contraste de Paulo não é entre um corpo material e outro imaterial, mas entre um corpo caracterizado pela vida humana natural e um corpo caracterizado pelo espírito ou Espírito.
    reason: Registra uma alternativa lexical e evita que «espiritual» seja entendido como «sem corpo», preservando ao mesmo tempo a ambiguidade de πνευματικόν.
lexical_decisions:
- source_word: σπείρεται
  choice: é semeado
  rationale: Mantém o presente passivo e a imagem da semente desenvolvida no contexto imediato.
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente direto e natural; no contexto, refere-se ao ser humano corporal na morte e na ressurreição.
- source_word: ψυχικόν
  choice: natural
  rationale: Preserva o contraste paulino com πνευματικόν sem sugerir que o primeiro corpo seja meramente físico ou que o segundo seja imaterial. A alternativa literalizante «psíquico» seria opaca ou enganosa no português atual.
- source_word: ἐγείρεται
  choice: é ressuscitado
  rationale: Expressa claramente o sentido passivo no contexto da ressurreição; «é levantado» seria menos natural e poderia obscurecer a referência.
- source_word: πνευματικόν
  choice: espiritual
  rationale: Preserva a terminologia de Paulo e a relação lexical com o espírito ou Espírito, sem explicitar no texto principal uma interpretação que o grego deixa implícita.
- source_word: Εἰ
  choice: Se
  rationale: Conserva a forma condicional grega sem convertê-la interpretativamente em «visto que» ou «já que».
- source_word: καὶ
  choice: também
  rationale: Comunica com naturalidade a força aditiva da segunda afirmação.
theological_decisions:
- issue: Sentido do contraste entre «corpo natural» e «corpo espiritual»
  choice: Conservar no texto principal o contraste lexical de Paulo entre um corpo caracterizado pela vida natural e um corpo caracterizado pelo espírito ou Espírito.
  alternative: Interpretar a expressão como contraste entre «corpo físico» e «corpo imaterial», ou explicitar «corpo animado pela alma» e «corpo animado pelo Espírito».
  rationale: O substantivo «corpo» qualifica os dois estados, de modo que «espiritual» não significa necessariamente incorpóreo. A nota esclarece o contraste sem eliminar a possível tensão entre a referência ao espírito humano e ao Espírito de Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação paralela e concisa reproduz a estrutura retórica grega. «É ressuscitado» foi preferido a «é levantado» por ser o modo idiomático de indicar ressurreição em português.
