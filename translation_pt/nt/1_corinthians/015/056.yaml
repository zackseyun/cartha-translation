  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: pt
  text: O aguilhão da morte é o pecado, e a força do pecado é a lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “a lei” provavelmente se refere sobretudo à lei mosaica no argumento de Paulo, embora a formulação também permita o sentido mais amplo do papel da lei em revelar e intensificar o pecado. Ou: “o poder do pecado é a lei”.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: κέντρον
  choice: aguilhão
  rationale: Preserva a imagem de uma ponta que fere e corresponde naturalmente à personificação da morte no contexto; também mantém a ligação com o uso de κέντρον no versículo anterior.
- source_word: θανάτου
  choice: da morte
  rationale: 'Traduz diretamente o genitivo como associação ou posse: o aguilhão pertencente à morte.'
- source_word: ἁμαρτία
  choice: pecado
  rationale: Mantém o singular paulino, no qual o pecado aparece não apenas como atos individuais, mas também como poder ou princípio atuante.
- source_word: δύναμις
  choice: força
  rationale: Expressa a capacidade eficaz que a lei confere ao pecado no argumento. “Poder” também seria possível, mas “força” forma uma declaração clara e natural em português.
- source_word: νόμος
  choice: a lei
  rationale: Preserva a formulação geral do grego e sua provável ressonância com a lei mosaica, sem restringir explicitamente o sentido por meio de maiúscula.
- source_word: δὲ
  choice: e
  rationale: As duas ocorrências articulam a explicação e a progressão do pensamento, sem exigir uma oposição forte; na primeira oração, a ligação pode permanecer implícita em português, e na segunda “e” é natural.
theological_decisions:
- issue: Sentido de “a lei” como força do pecado
  choice: “a lei”, em minúscula, mantendo aberta a provável referência à lei mosaica e a dimensão mais ampla do papel da lei
  alternative: “a Lei”, como referência explicitamente delimitada à lei mosaica; ou “lei”, em sentido geral
  rationale: O argumento paulino evoca fortemente a lei mosaica, mas a formulação não deve eliminar a amplitude teológica segundo a qual a lei expõe e intensifica o pecado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aguilhão” conserva a metáfora concreta do original; “força” é natural no enunciado, enquanto a alternativa “poder” é registrada em nota. O marcador da nota vem após a oração à qual suas duas observações se aplicam.
