  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: pt
  text: Portanto, também os que adormeceram no Messias pereceram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Adormeceram” é um eufemismo grego para “morreram”, usado especialmente a respeito dos fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Portanto
  rationale: Partícula inferencial que apresenta a consequência do argumento anterior; “portanto” torna clara a conclusão em português.
- source_word: καὶ
  choice: também
  rationale: Preserva a força aditiva, incluindo os mortos no Messias entre as consequências da hipótese discutida.
- source_word: οἱ κοιμηθέντες
  choice: os que adormeceram
  rationale: Mantém a metáfora eufemística grega para a morte, comum no contexto dos fiéis, sem reduzi-la diretamente a “morreram”.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Traduz Χριστός como título e preserva a linguagem paulina de estar unido ao Messias.
- source_word: ἀπώλοντο
  choice: pereceram
  rationale: Expressa a ruína resultante na hipótese de não haver ressurreição; o pretérito perfeito português corresponde naturalmente ao aoristo neste argumento.
theological_decisions:
- issue: Tradução de Χριστῷ na fórmula paulina de união
  choice: no Messias
  alternative: em Cristo
  rationale: “Messias” explicita o valor titular de Χριστός; “no” é a contração portuguesa natural de “em + o”. A alternativa tradicional “em Cristo” é reconhecível, mas não é necessária para esclarecer o versículo.
- issue: Sentido de ἀπώλοντο
  choice: pereceram
  alternative: estão perdidos
  rationale: “Pereceram” conserva a gravidade e a abertura semântica do verbo grego, sem especificar além do texto a natureza exata da perdição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a inferência, a adição e a metáfora do original.
