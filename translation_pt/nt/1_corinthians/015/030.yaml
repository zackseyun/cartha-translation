lexical_decisions:
- source_word: τί
  choice: Por que
  rationale: Nesta pergunta retórica, τί pede a razão ou o sentido da ação no contexto do argumento sobre a ressurreição; “Por que” comunica essa força naturalmente em português.
- source_word: καὶ
  choice: também
  rationale: καὶ tem sentido aditivo, incluindo Paulo e seus companheiros entre os exemplos anteriores.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito é preservado; sua posição depois de “também” mantém de modo natural a força aditiva e levemente enfática.
- source_word: κινδυνεύομεν
  choice: estamos em perigo
  rationale: Expressa diretamente o sentido de estar exposto a perigo, sem acrescentar a ideia mais específica de arriscar a vida.
- source_word: πᾶσαν ὥραν
  choice: a toda hora
  rationale: É uma expressão portuguesa corrente para exposição contínua e conserva a imagem temporal do grego.
theological_decisions:
- issue: Força retórica no argumento de Paulo sobre a ressurreição
  choice: A frase é traduzida como pergunta retórica que ressalta a falta de sentido do perigo enfrentado pelos apóstolos caso os mortos não ressuscitem.
  alternative: Traduzir τί literalmente como “o que”, produzindo uma construção pouco natural em português.
  rationale: A sintaxe e o contexto imediato favorecem a pergunta pela razão, sem eliminar a tensão do argumento nem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A toda hora” soa natural e mantém a imagem de πᾶσαν ὥραν; a formulação evita tanto linguagem arcaica quanto explicitação excessiva.
