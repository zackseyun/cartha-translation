  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: pt
  text: Portanto, seja eu, sejam eles, assim proclamamos, e assim vocês creram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: quer ... quer
  rationale: Preserva a estrutura correlativa que apresenta as duas alternativas e soa natural em português.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão decorrente da exposição anterior sobre as testemunhas da ressurreição.
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: tenha sido eu ... tenham sido eles
  rationale: Explicita de maneira idiomática o contraste entre Paulo e os demais apóstolos mencionados no contexto, sem acrescentar identificação ao texto.
- source_word: οὕτως κηρύσσομεν
  choice: é isso que proclamamos
  rationale: O advérbio remete ao conteúdo do evangelho recém-resumido; esta formulação comunica essa referência com clareza e mantém o sentido de proclamação pública de κηρύσσω.
- source_word: οὕτως ἐπιστεύσατε
  choice: foi nisso que vocês creram
  rationale: Retoma o mesmo conteúdo proclamado e preserva o valor passado do aoristo, em português natural.
theological_decisions:
- issue: Âmbito da unidade da proclamação apostólica
  choice: O texto afirma que Paulo e os outros proclamavam a mesma mensagem sobre Cristo, na qual os coríntios creram.
  alternative: 'Entender οὕτως principalmente como indicação de modo: “assim proclamamos, e assim vocês creram”.'
  rationale: A repetição de οὕτως vincula tanto a proclamação quanto a fé ao conteúdo exposto no contexto, sem ampliar a afirmação para reivindicações eclesiológicas que o versículo não faz.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para a segunda pessoa plural. “Proclamamos” conserva o caráter público de κηρύσσομεν; a construção paralela com “isso/nisso” torna explícita a retomada do conteúdo sem resolver além do necessário a possível nuance modal de οὕτως.
