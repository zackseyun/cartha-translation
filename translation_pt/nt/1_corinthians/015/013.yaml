  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: pt
  text: Mas, se não há ressurreição dos mortos, nem mesmo o Messias foi ressuscitado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo foi ressuscitado”. O título grego Χριστός pode ser traduzido por “Cristo” ou “Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Introduz a condição e mantém a leve contraposição de δέ no desenvolvimento do argumento.
- source_word: ἀνάστασις νεκρῶν
  choice: ressurreição dos mortos
  rationale: Expressão portuguesa consagrada e semanticamente direta para a ressurreição de pessoas mortas como classe.
- source_word: οὐκ ἔστιν
  choice: não há
  rationale: Traduz de modo idiomático a negação existencial do grego.
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: 'Preserva a inferência enfática: se a premissa fosse verdadeira, isso se aplicaria até ao Messias.'
- source_word: Χριστός
  choice: o Messias
  rationale: Traduz o título grego pelo seu sentido, de modo natural em português, em vez de tratá-lo aqui como simples nome próprio.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: Preserva a voz passiva e o resultado vigente da ação; o agente, possivelmente Deus, permanece implícito como no grego.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O contexto permite reconhecer o valor titular de Χριστός; traduzir como “Messias” torna esse sentido transparente sem acrescentar uma interpretação denominacional.
- issue: Voz de ἐγήγερται
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: A forma grega é passiva. A tradução mantém essa voz e não explicita quem realizou a ação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa acompanha a lógica condicional de Paulo e evita explicitar o agente da ressurreição.
