  source_fidelity: 'A tradução reproduz com precisão a estrutura condicional e o argumento inferencial do grego: εἰ δέ por “Mas, se”, ἀνάστασις νεκρῶν por “ressurreição dos mortos”, a negação existencial por “não há”, e οὐδέ por “nem mesmo”. “Foi ressuscitado” mantém adequadamente a voz passiva de ἐγήγερται sem introduzir Deus como agente. Embora o perfeito grego ressalte o estado presente decorrente, o pretérito perfeito passivo português é a forma idiomática normal neste contexto e não altera o sentido.'
