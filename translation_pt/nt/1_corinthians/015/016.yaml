id: 1CO.15.16
reference: 1 Corinthians 15:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: pt
  text: Pois, se os mortos não são ressuscitados, nem mesmo o Messias[a] foi ressuscitado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, conforme a tradição consolidada, “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Preserva a função explicativa de γάρ e a condição introduzida por εἰ, com encadeamento argumentativo natural em português.
- source_word: νεκροὶ
  choice: os mortos
  rationale: O adjetivo plural substantivado refere-se genericamente às pessoas mortas; “os mortos” é idiomático e mantém a força categórica.
- source_word: οὐκ ἐγείρονται
  choice: não são ressuscitados
  rationale: Mantém a voz passiva do presente grego no contexto da ressurreição, sem transformá-la na formulação intransitiva “não ressuscitam”.
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: 'Expressa a consequência enfática: se os mortos não são ressuscitados, então nem sequer o Messias o foi.'
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título grego pelo seu sentido, em vez de apenas transliterá-lo, preservando sua função cristológica no argumento.
- source_word: οὐδὲ Χριστὸς ἐγήγερται
  choice: nem mesmo o Messias foi ressuscitado
  rationale: Em português, “nem mesmo” já incorpora a negação exigida por οὐδέ; repetir “não” seria desnecessário. O perfeito passivo é expresso de maneira natural como um acontecimento concluído relevante para o argumento presente.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: Preserva a voz passiva e comunica naturalmente o ato concluído. A relevância contínua do perfeito decorre do próprio argumento e do contexto.
theological_decisions:
- issue: Tradução de Χριστός no argumento sobre a ressurreição
  choice: o Messias
  alternative: o Cristo
  rationale: O termo funciona aqui como título do ungido. “O Messias” torna o sentido transparente, enquanto “o Cristo” representa a forma tradicional e permanece uma tradução possível.
- issue: Agente implícito da ressurreição
  choice: manter a construção passiva sem nomear o agente
  alternative: Deus não ressuscita os mortos... Deus não ressuscitou o Messias
  rationale: O grego usa passivos e não explicita o agente neste versículo. Acrescentar “Deus” resolveria uma informação deixada implícita pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois, se” mantém a ligação lógica com o contexto; “são ressuscitados” e “foi ressuscitado” preservam a passividade verbal. O artigo em “o Messias” é natural e necessário neste uso titular em português.
