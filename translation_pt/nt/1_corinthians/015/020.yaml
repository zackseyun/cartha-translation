id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: pt
  text: Mas agora o Messias[a] foi ressuscitado dentre os mortos, as primícias[b] dos que adormeceram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. “Messias” traduz o título grego Christós.'
    reason: alternative_reading
  - marker: b
    text: “Primícias” eram a primeira parte da colheita oferecida a Deus; a imagem sugere que a ressurreição do Messias antecipa a ressurreição dos demais.
    reason: cultural_note
  - marker: c
    text: “Adormeceram” é uma metáfora para os que morreram, especialmente apropriada neste contexto de ressurreição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Mas agora
  rationale: Marca a forte virada adversativa entre a hipótese anterior — a negação da ressurreição — e a afirmação presente da ressurreição do Messias.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o sentido titular de Χριστός neste argumento teológico e representativo, em vez de apenas transliterá-lo como nome.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: Preserva a voz passiva, sem explicitar um agente que o grego deixa implícito. Embora o perfeito grego também destaque o resultado vigente, esta é a formulação idiomática mais natural em português no contexto.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa naturalmente a ideia de sair do meio dos mortos e preserva o plural substantivado do grego.
- source_word: ἀπαρχὴ
  choice: as primícias
  rationale: Mantém a imagem cultual e agrícola da primeira parte da colheita, que antecipa a colheita completa.
- source_word: τῶν κεκοιμημένων
  choice: dos que adormeceram
  rationale: Preserva a metáfora tradicional do sono para a morte, especialmente significativa neste contexto de ressurreição.
theological_decisions:
- issue: Voz e agência na ressurreição
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: A voz passiva do grego é mantida para não ocultar a agência divina implícita nem especificar além do texto quem realizou a ação.
- issue: Tradução do título cristológico
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona como título no argumento sobre a ressurreição e a representação dos demais mortos; por isso, seu significado é traduzido.
- issue: Metáfora das primícias
  choice: as primícias dos que adormeceram
  alternative: o primeiro dos que morreram
  rationale: A imagem original é preservada, pois comunica não somente prioridade, mas também antecipação representativa da ressurreição futura, sem reduzir a expressão a uma simples ordem cronológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém as metáforas bíblicas essenciais sem sacrificar a inteligibilidade.
