  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: pt
  text: É semeado em desonra; é ressuscitado em glória. É semeado em fraqueza; é ressuscitado em poder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: é semeado
  rationale: Mantém o presente passivo e a metáfora da semeadura que Paulo desenvolve no contexto. O sujeito implícito é o corpo mencionado nos versículos próximos.
- source_word: ἀτιμίᾳ
  choice: desonra
  rationale: Reproduz diretamente o contraste antitético com δόξῃ, sem restringir o sentido a vergonha subjetiva ou humilhação.
- source_word: ἐγείρεται
  choice: é ressuscitado
  rationale: No contexto da ressurreição corporal, expressa com clareza o sentido de ἐγείρω e conserva a voz passiva, deixando implícito o agente divino.
- source_word: δόξῃ
  choice: glória
  rationale: É a correspondência natural e teologicamente ampla para δόξα, preservando o contraste com desonra.
- source_word: ἀσθενείᾳ
  choice: fraqueza
  rationale: Equivalente direto e corrente que abrange a fragilidade corporal sem estreitar indevidamente o termo.
- source_word: δυνάμει
  choice: poder
  rationale: Preserva o contraste lexical com fraqueza e permite um alcance mais amplo que mera força física.
theological_decisions:
- issue: Voz e agência na linguagem da ressurreição
  choice: Empregar formas passivas sem nomear explicitamente Deus como agente.
  alternative: Deus o ressuscita.
  rationale: O grego repete formas passivas. Conservá-las mantém a agência divina implícita, sem acrescentar ao texto uma identificação que Paulo não explicita neste versículo.
- issue: Referente do sujeito implícito
  choice: Manter o sujeito oculto em português, entendido como o corpo no contexto imediato.
  alternative: O corpo é semeado... o corpo é ressuscitado.
  rationale: O grego não repete um substantivo como sujeito. O português permite recuperá-lo naturalmente do contexto, preservando a concisão e o paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo rigoroso entre as duas antíteses. “É ressuscitado” foi preferido a “é levantado” para tornar inequívoco o contexto de ressurreição sem explicitar o agente.
