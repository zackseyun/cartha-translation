  terminology: «Messias Jesus» é uma tradução coerente de Χριστῷ Ἰησοῦ quando Χριστός é tratado como título; a nota tradicional «Cristo Jesus» é apropriada. «Senhor» para κύριος também está correto. A revisão limita-se a aperfeiçoar a equivalência de καύχησις.
