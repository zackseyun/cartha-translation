  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: pt
  text: Morro todos os dias — pelo orgulho que tenho de vocês no Messias Jesus, nosso Senhor[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “diariamente morro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tão certo como o orgulho que tenho de vocês”, “pela glória que tenho em vocês” ou “pelo orgulho de vocês”. A expressão grega tem caráter de juramento, e a relação sintática da frase sobre gloriar-se é discutida.
    reason: alternative_reading
  - marker: c
    text: 'Tradução tradicional: “Cristo Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: todos os dias
  rationale: Expressão idiomática com sentido de “diariamente” ou “dia após dia”. “Todos os dias” é natural em português e preserva a força reiterativa.
- source_word: ἀποθνῄσκω
  choice: morro
  rationale: O presente do indicativo é mantido de forma direta e vívida. “Enfrento a morte” explicaria um possível sentido contextual, mas seria mais interpretativo.
- source_word: νὴ
  choice: pela
  rationale: A partícula introduz uma afirmação enfática de caráter semelhante a juramento. “Pela” conserva de modo conciso a construção, cuja força pode também ser expressa por “tão certo como”.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: a glória em vocês
  rationale: καύχησις pode indicar o ato ou o motivo de gloriar-se. A oração relativa favorece a ideia da glória que Paulo tem nos coríntios, mas a formulação mantém a preposição e evita transformar o termo em mero orgulho pessoal.
- source_word: ἣν ἔχω
  choice: que tenho
  rationale: Tradução direta e idiomática da oração relativa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a linguagem paulina de estar “em” Jesus e traduz Χριστός como título, “Messias”, em vez de tratá-lo apenas como parte de um nome.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: nosso Senhor
  rationale: Tradução corrente e dignificada de κύριος com o possessivo ἡμῶν.
theological_decisions:
- issue: Χριστός como título ou forma tradicional semelhante a nome
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Χριστός conserva força titular, por isso “Messias” comunica seu sentido. A forma tradicional é registrada sem ser introduzida silenciosamente no texto.
- issue: Sentido de καύχησις com ὑμετέραν
  choice: a glória que Paulo tem nos coríntios
  alternative: a glória ou jactância dos próprios coríntios
  rationale: A oração “que tenho” favorece algo que Paulo possui em relação aos coríntios. Como a sintaxe da expressão de juramento e a relação do possessivo são discutidas, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva a concisão enfática e a leve estranheza da construção grega, enquanto as notas registram suas principais possibilidades sintáticas e lexicais.
