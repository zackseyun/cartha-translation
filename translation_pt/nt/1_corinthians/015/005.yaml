  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: pt
  text: e que apareceu a Cefas[a][b] e, depois, aos doze.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi visto por Cefas”. A forma do verbo grego é passiva, mas, em contextos de aparições após a ressurreição, costuma ser traduzida por “apareceu”.'
    reason: lexical_alternative
  - marker: b
    text: Cefas é o nome aramaico correspondente a Pedro.
    reason: cross_reference
  - marker: c
    text: “Os doze” é a designação estabelecida do círculo apostólico de Jesus, mesmo quando o grupo não contava exatamente com doze membros.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu
  rationale: Embora a forma grega seja passiva, o verbo é usado idiomaticamente nos relatos de aparições após a ressurreição. “Apareceu” é natural em português e mantém a ênfase na manifestação visível de Jesus; a alternativa formal é registrada em nota.
- source_word: Κηφᾷ
  choice: a Cefas
  rationale: Preserva por transliteração o nome próprio usado no texto grego, em vez de harmonizá-lo com o equivalente mais conhecido, Pedro.
- source_word: εἶτα
  choice: depois
  rationale: Indica a sequência temporal dos testemunhos recitados por Paulo de maneira clara e corrente.
- source_word: τοῖς δώδεκα
  choice: aos doze
  rationale: Mantém literalmente a designação tradicional do círculo apostólico, sem substituí-la por “os apóstolos” ou harmonizá-la com outra contagem.
- source_word: καὶ ὅτι
  choice: e que
  rationale: Conserva a estrutura coordenada das cláusulas de conteúdo iniciadas no contexto anterior.
theological_decisions:
- issue: Linguagem da aparição após a ressurreição
  choice: apareceu
  alternative: foi visto por
  rationale: “Apareceu” expressa de modo idiomático a manifestação visível do ressuscitado sem explicar indevidamente o modo da aparição; a forma passiva possível permanece disponível em nota.
- issue: A referência aos “doze” apesar da ausência de Judas
  choice: aos doze
  alternative: aos apóstolos; aos onze
  rationale: O grego emprega a designação coletiva estabelecida “os doze”. Mantê-la evita harmonizar o versículo com reconstruções históricas baseadas em outras passagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “depois” entre vírgulas torna clara a progressão da fórmula tradicional. Os marcadores foram associados às expressões exatas a que se referem.
