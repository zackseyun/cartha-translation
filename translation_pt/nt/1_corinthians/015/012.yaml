source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: pt
  text: Mas, se o Messias[a] é proclamado como ressuscitado dentre os mortos, como alguns entre vocês podem dizer que não há ressurreição dos mortos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. O grego Χριστός pode ser traduzido como “Messias” ou transliterado na forma tradicional “Cristo”; aqui, o texto principal preserva seu sentido de título.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: O termo conserva aqui seu valor de título cristológico. O artigo é acrescentado em português por naturalidade e para expressar o sentido definido do título.
- source_word: κηρύσσεται
  choice: é proclamado
  rationale: O presente passivo descreve o anúncio público e contínuo; “é proclamado” preserva tanto a voz passiva quanto o sentido de proclamação.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa de modo idiomático que ele foi levantado do meio dos que morreram, preservando a preposição ἐκ e o plural substantivado.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: O perfeito passivo indica uma ação concluída cujos efeitos permanecem. Em português, “foi ressuscitado” preserva claramente a voz passiva, embora não reproduza por completo o aspecto perfeito grego.
- source_word: πῶς
  choice: como ... podem
  rationale: A formulação comunica a força retórica da pergunta e a incompatibilidade que Paulo aponta.
- source_word: ἐν ὑμῖν τινες
  choice: alguns entre vocês
  rationale: Identifica certos membros dentro da própria comunidade coríntia.
- source_word: ἀνάστασις νεκρῶν
  choice: ressurreição dos mortos
  rationale: Reproduz a construção genitiva e designa a ressurreição geral dos que morreram.
- source_word: οὐκ ἔστιν
  choice: não há
  rationale: É a forma portuguesa natural de exprimir o sentido existencial da construção.
theological_decisions:
- issue: Tradução de Χριστός no argumento paulino
  choice: o Messias
  alternative: Cristo
  rationale: “Messias” traduz o valor do título, relevante para o argumento sobre aquele que é publicamente proclamado. A forma tradicional “Cristo” permanece indicada em nota, sem resolver de modo indevido a possível percepção do termo como título ou designação consolidada.
- issue: Agente implícito de ἐγήγερται
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: A voz passiva do grego é preservada sem explicitar o agente. Assim, a tradução não acrescenta “por Deus”, embora esse agente possa estar teologicamente implícito no contexto paulino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Entre vocês” mantém boa inteligibilidade internacional; “dentre os mortos” preserva a imagem da expressão grega sem soar excessivamente técnica.
