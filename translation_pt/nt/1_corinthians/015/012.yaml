  naturalness: “Mas, se o Messias é proclamado como ressuscitado dentre os mortos” é claro, idiomático e adequado ao registro bíblico moderno. “Vocês”, “dentre os mortos” e “ressurreição dos mortos” têm ampla compreensão e boa legibilidade brasileira.
