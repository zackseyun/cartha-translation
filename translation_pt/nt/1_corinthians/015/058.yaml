reference: 1 Corinthians 15:58
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: pt
  text: Portanto, meus amados irmãos[a], tornem-se firmes, inabaláveis, sempre abundantes na obra do Senhor, sabendo que o trabalho de vocês no Senhor não é inútil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o grego adelphoi, que, conforme o contexto, pode designar coletivamente os fiéis, incluindo mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Conjunção inferencial que apresenta a exortação como conclusão do argumento anterior sobre a ressurreição.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meus amados irmãos
  rationale: Preserva a forma masculina plural e o tom afetuoso do grego; neste contexto, o termo se dirige coletivamente aos fiéis, como esclarece a nota.
- source_word: ἑδραῖοι γίνεσθε
  choice: tornem-se firmes
  rationale: Mantém a força verbal de γίνεσθε, em vez de reduzi-lo a uma simples cópula, e expressa estabilidade de convicção.
- source_word: ἀμετακίνητοι
  choice: inabaláveis
  rationale: Expressa de modo natural em português a ideia de não ser deslocado ou afastado de uma posição, sem sugerir imobilidade física.
- source_word: περισσεύοντες
  choice: sempre abundantes
  rationale: Preserva a ideia de continuidade e abundância do particípio, em ligação com πάντοτε.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: na obra do Senhor
  rationale: Mantém a amplitude de ἔργον e a relação genitiva, sem restringir a expressão apenas ao ministério formal.
- source_word: εἰδότες
  choice: sabendo
  rationale: Conserva a forma participial e sua ligação com a exortação, sem explicitar em excesso uma possível nuance causal.
- source_word: ὁ κόπος ὑμῶν
  choice: o trabalho de vocês
  rationale: Em português corrente, 'trabalho' comunica esforço aplicado e funciona naturalmente neste contexto; a construção com 'de vocês' evita ambiguidade regional.
- source_word: οὐκ ἔστιν κενὸς
  choice: não é inútil
  rationale: Equivalente idiomático que comunica ausência de futilidade ou falta de resultado; evita o tom menos corrente de 'não é vão'.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a formulação paulina e sua amplitude relacional e teológica, sem reduzi-la a uma única explicação.
theological_decisions:
- issue: Referência de gênero em ἀδελφοί
  choice: irmãos no texto, com nota sobre o alcance coletivo
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, mas, no contexto da carta à igreja inteira, pode incluir mulheres. A tradução mantém a forma lexical e a nota preserva o alcance contextual.
- issue: Relação sintática e teológica de ἐν κυρίῳ
  choice: o trabalho de vocês no Senhor não é inútil
  alternative: o trabalho de vocês não é inútil por causa do Senhor
  rationale: A construção mais naturalmente caracteriza o trabalho dos fiéis como realizado 'no Senhor', preservando a amplitude da expressão em vez de convertê-la explicitamente em causa.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: '''Senhor'' é o equivalente estabelecido e apropriado ao uso cristológico no contexto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Optou-se por 'vocês' para clareza internacional e por 'inabaláveis' como equivalente natural de ἀμετακίνητοι. A estrutura conserva o encadeamento lógico e participial do grego sem sacrificar a fluidez.
