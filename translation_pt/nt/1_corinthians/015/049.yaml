  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: pt
  text: E, assim como temos levado a imagem do homem feito do pó, também levaremos a imagem do homem celestial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “levemos também a imagem do homem celestial”.'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz com naturalidade a correspondência entre a condição humana ligada a Adão e a futura conformidade ao homem celestial.
- source_word: ἐφορέσαμεν
  choice: temos levado
  rationale: O pretérito perfeito composto liga a experiência iniciada no passado à condição ainda presente; «levado» expressa portar a imagem sem sugerir apenas aparência externa.
- source_word: εἰκόνα
  choice: imagem
  rationale: É a equivalência corrente de εἰκών e preserva o vínculo tipológico entre Adão e Cristo.
- source_word: τοῦ χοϊκοῦ
  choice: do homem feito do pó
  rationale: Explicita o referente masculino indicado pelo contexto e mantém a alusão de χοϊκός ao pó de Gênesis, evitando que «terreno» enfraqueça essa conexão.
- source_word: φορέσομεν
  choice: levaremos
  rationale: Traduz o futuro indicativo do texto principal do SBLGNT, apresentando a conformidade futura como parte da esperança da ressurreição.
- source_word: τοῦ ἐπουρανίου
  choice: do homem celestial
  rationale: Explicita «homem» em paralelo com a expressão anterior e preserva o contraste contextual entre o homem feito do pó e o homem do céu.
- source_word: καὶ
  choice: também
  rationale: Na segunda oração, comunica claramente a força aditiva e mantém o paralelismo.
theological_decisions:
- issue: Futuro indicativo ou subjuntivo exortativo no segundo verbo
  choice: também levaremos
  alternative: levemos também
  rationale: O texto impresso do SBLGNT traz φορέσομεν, futuro indicativo, coerente com a transformação futura na ressurreição. A variante φορέσωμεν, de sentido exortativo, é relevante e por isso consta em nota, sem substituir a leitura adotada.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A construção paralela conserva o contraste Adão–Cristo do contexto imediato; «feito do pó» mantém audível a alusão a Gênesis.
