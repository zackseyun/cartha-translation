base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: pt
  text: Se, falando em termos meramente humanos[a], lutei com feras[b] em Éfeso, que proveito tiro disso? Se os mortos não são ressuscitados, “comamos e bebamos, pois amanhã morreremos”.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Se, de um ponto de vista meramente humano, lutei com feras em Éfeso...”. A expressão pode qualificar a maneira de falar ou a perspectiva de Paulo.'
    reason: lexical_alternative
  - marker: b
    text: “Lutei com feras” pode referir-se literalmente a animais selvagens ou, em sentido figurado, à oposição brutal de seres humanos; o grego permite conservar a imagem sem decidir entre essas leituras.
    reason: alternative_reading
  - marker: c
    text: Citação ou alusão a Isaías 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: falando em termos meramente humanos
  rationale: Expressa de modo natural o valor idiomático da frase, provavelmente ligado à maneira humana de falar ou avaliar, sem excluir a possível nuance de perspectiva.
- source_word: ἐθηριομάχησα
  choice: lutei com feras
  rationale: Preserva a imagem vívida e o sentido lexical do verbo grego sem decidir se a luta foi literal ou uma metáfora para adversários humanos brutais.
- source_word: ἐν Ἐφέσῳ
  choice: em Éfeso
  rationale: Forma portuguesa corrente do nome geográfico.
- source_word: τί μοι τὸ ὄφελος
  choice: que vantagem tenho com isso?
  rationale: Reproduz com clareza e naturalidade a pergunta retórica sobre benefício pessoal.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: os mortos não são ressuscitados
  rationale: Mantém a forma passiva do grego e não explicita o agente.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: comamos e bebamos
  rationale: Os subjuntivos exortativos são representados naturalmente pela primeira pessoa do plural em português.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: pois amanhã morreremos
  rationale: Expressa o sentido futuro convencional da frase e mantém sua formulação proverbial.
theological_decisions:
- issue: Se ἐθηριομάχησα descreve uma luta literal com animais ou, metaforicamente, oposição humana brutal
  choice: Manter “lutei com feras” no texto principal
  alternative: Explicitar “lutei contra adversários brutais”
  rationale: A redação preserva a imagem grega e a ambiguidade histórica, sem impor uma interpretação que o argumento do versículo não exige.
- issue: Agente da ressurreição em νεκροὶ οὐκ ἐγείρονται
  choice: Usar a passiva “não são ressuscitados”
  alternative: Explicitar “Deus não ressuscita os mortos” ou usar “os mortos não ressuscitam”
  rationale: A forma passiva corresponde ao grego e preserva a referência implícita ao agente sem acrescentá-lo ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos, conserva a concisão retórica e mantém a ambiguidade genuína do original.
