  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: pt
  text: por meio do qual vocês também estão sendo salvos[a], se vocês se apegam firmemente à mensagem que lhes anunciei como boa notícia[b] — a menos que tenham crido em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são salvos”. O presente grego pode indicar uma ação em curso (“estão sendo salvos”) ou ser entendido de maneira mais geral (“são salvos”).'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “se vocês se apegam firmemente em/por que palavra lhes anunciei como boa notícia”. A construção grega pode referir-se à mensagem anunciada ou à forma em que ela foi anunciada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: por meio do qual
  rationale: διά com o genitivo expressa meio ou instrumentalidade e retoma o evangelho mencionado no versículo anterior.
- source_word: σῴζεσθε
  choice: estão sendo salvos
  rationale: O presente passivo pode sugerir um processo em curso; a formulação preserva esse aspecto sem impor um sistema doutrinário.
- source_word: τίνι λόγῳ
  choice: a mensagem
  rationale: λόγος, nesta construção idiomática ligada a κατέχετε, refere-se à mensagem ou ao conteúdo do anúncio; 'mensagem' é natural e claro em português.
- source_word: εὐηγγελισάμην
  choice: anunciei como boa notícia
  rationale: O verbo significa anunciar boas-novas; esta forma torna explícito seu sentido, sem reduzi-lo ao ato formal de pregar.
- source_word: κατέχετε
  choice: retêm firmemente
  rationale: κατέχω indica conservar, manter ou apegar-se de modo contínuo; 'retêm firmemente' preserva tanto a ideia de retenção quanto a de perseverança.
- source_word: ἐκτὸς εἰ μὴ
  choice: a menos que
  rationale: A expressão introduz uma exceção, vertida naturalmente em português por 'a menos que'.
- source_word: εἰκῇ
  choice: em vão
  rationale: No contexto, designa algo inútil, vazio ou sem resultado; 'em vão' preserva a advertência de Paulo.
- source_word: ἐπιστεύσατε
  choice: tenham crido
  rationale: O aoristo remete ao ato anterior de crer; o subjuntivo composto é exigido naturalmente em português depois de 'a menos que'.
theological_decisions:
- issue: Aspecto da salvação em σῴζεσθε
  choice: estão sendo salvos
  alternative: são salvos
  rationale: A forma progressiva representa adequadamente o presente grego e conserva a tensão entre as dimensões já realizada e contínua da salvação, sem resolver debates sobre perseverança ou segurança.
- issue: Condição em εἰ κατέχετε
  choice: se retêm firmemente
  alternative: entendida como mera evidência de fé genuína ou como condição retórica cuja verdade se presume
  rationale: Mantém-se a condição expressa por Paulo, sem explicá-la segundo uma leitura denominacional específica.
- issue: Força de ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε
  choice: a menos que tenham crido em vão
  alternative: se é que não creram sem fundamento
  rationale: 'A tradução conserva a advertência e sua ambiguidade: a crença pode ser descrita como inútil, vazia ou sem resultado, sem definir antecipadamente a razão dessa inutilidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome 'vocês' explicita o plural de ὑμεῖς; 'lhes' evita repetição pesada. A ordem foi levemente ajustada à sintaxe natural do português, preservando a condição e a exceção do grego.
