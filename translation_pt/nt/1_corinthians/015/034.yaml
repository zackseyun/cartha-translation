source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: pt
  text: Voltem ao bom senso, como devem,[a] e não continuem pecando; pois alguns não têm conhecimento de Deus.[b] Digo isso para vergonha de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Recobrem a sobriedade devidamente”. O verbo evoca literalmente recobrar a sobriedade após a embriaguez, mas aqui provavelmente é usado em sentido figurado.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser traduzida por “são ignorantes a respeito de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Voltem ao bom senso
  rationale: O aoristo imperativo exige uma mudança decisiva. O verbo evoca literalmente recobrar a sobriedade, mas aqui é metafórico; a formulação comunica com naturalidade o retorno à lucidez.
- source_word: δικαίως
  choice: como é justo
  rationale: O advérbio qualifica a ordem anterior com a ideia de agir correta ou devidamente, preservando sua força moral sem recorrer ao menos natural 'justamente'.
- source_word: μὴ ἁμαρτάνετε
  choice: não continuem pecando
  rationale: O presente imperativo com μή pode indicar ação contínua ou habitual; esta tradução expressa essa nuance sem afirmar que todos praticavam exatamente o mesmo pecado.
- source_word: ἀγνωσίαν ... θεοῦ
  choice: não têm conhecimento de Deus
  rationale: A construção expressa ignorância ou falta de conhecimento referente a Deus. A forma negativa é idiomática em português e mantém o sentido direto.
- source_word: τινες
  choice: alguns
  rationale: Representa naturalmente o pronome indefinido plural, que aponta para uma parte do grupo.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: para vergonha de vocês
  rationale: Preserva a linguagem forte de vergonha dirigida aos destinatários e evita decidir de modo rígido entre propósito e resultado.
- source_word: λαλῶ
  choice: Digo isso
  rationale: No contexto discursivo, a expressão remete naturalmente à repreensão que Paulo acaba de fazer.
theological_decisions:
- issue: Força moral de δικαίως
  choice: como é justo
  alternative: devidamente; com justiça
  rationale: A expressão mantém a dimensão ética do advérbio sem lhe impor um sentido técnico de justiça ou justificação.
- issue: Aspecto da proibição μὴ ἁμαρτάνετε
  choice: não continuem pecando
  alternative: não pequem; parem de pecar
  rationale: A escolha torna perceptível a possível força contínua ou habitual do presente imperativo, mas a nota registra alternativas para não tratar essa nuance como incontestável.
- issue: Sentido de ἀγνωσίαν θεοῦ
  choice: não têm conhecimento de Deus
  alternative: são ignorantes a respeito de Deus
  rationale: A formulação conserva a severidade da afirmação sem definir se se trata de ausência relacional, doutrinária ou ambas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural foi vertido por “vocês”. A imagem de sobriedade foi suavizada no texto para maior naturalidade e preservada na nota.
