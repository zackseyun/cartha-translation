id: 1CO.15.53
reference: 1 Corinthians 15:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: pt
  text: Pois é necessário que este corpo perecível se revista de imperecibilidade[a], e que este corpo mortal se revista de imortalidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “é necessário que este perecível se revista de imperecibilidade, e que este mortal se revista de imortalidade”. O grego não repete explicitamente a palavra “corpo” neste versículo, embora o contexto deixe claro que se refere ao corpo.'
    reason: alternativa lexical e explicitação contextual
lexical_decisions:
- source_word: δεῖ
  choice: é necessário
  rationale: Expressa a necessidade inevitável da transformação. Em português, a construção impessoal combina naturalmente com os infinitivos reflexivos das duas orações.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior em registro digno e corrente.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: este corpo perecível
  rationale: φθαρτός designa aquilo que está sujeito à deterioração. “Corpo” é explicitado a partir do contexto imediato da ressurreição corporal, evitando uma formulação excessivamente abstrata.
- source_word: ἐνδύσασθαι
  choice: se revista de
  rationale: Preserva a metáfora de vestir-se e soa natural em português, embora seja um pouco mais elevada que “vestir”.
- source_word: ἀφθαρσίαν
  choice: imperecibilidade
  rationale: Conserva o contraste lexical direto com “perecível” e comunica a condição de não estar sujeito à deterioração.
- source_word: καὶ
  choice: e
  rationale: Coordena de modo simples as duas orações paralelas.
- source_word: τὸ θνητὸν τοῦτο
  choice: este corpo mortal
  rationale: θνητός significa sujeito à morte. “Corpo” é explicitado pelo contexto e mantém o paralelismo da frase.
- source_word: ἀθανασίαν
  choice: imortalidade
  rationale: É a forma portuguesa padrão para a condição de não estar sujeito à morte e estabelece um contraste claro com “mortal”.
theological_decisions:
- issue: Explicitação de “corpo”, embora σώμα não apareça no versículo
  choice: Traduzir os adjetivos substantivados como “este corpo perecível” e “este corpo mortal”
  alternative: “este perecível... este mortal...”
  rationale: O contexto imediato, especialmente 1 Coríntios 15:42–54, trata da ressurreição e transformação do corpo. A explicitação esclarece o referente sem acrescentar uma afirmação doutrinária nova; a nota preserva a forma mais estrita do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” conserva a relação argumentativa; “se revista de” mantém a metáfora do vestuário. “Imperecibilidade” é menos comum na fala cotidiana, mas preserva com precisão o contraste perecível/imperecibilidade.
