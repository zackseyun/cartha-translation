  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: pt
  text: Mas não vem primeiro o espiritual[a], e sim o natural[b]; depois, o espiritual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não vem primeiro o corpo espiritual, mas o corpo natural; depois, o corpo espiritual”. Paulo omite aqui a palavra “corpo”, embora ela apareça explicitamente no contexto próximo.'
    reason: alternative_reading
  - marker: b
    text: “Natural” traduz o grego psychikón, isto é, aquilo que pertence à vida animada comum; de modo mais literal, “anímico”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: primeiro
  rationale: Uso adverbial que indica ordem ou sequência; “primeiro” é direto e natural em português.
- source_word: πνευματικόν
  choice: o espiritual
  rationale: Adjetivo neutro singular substantivado. Preserva a concisão do grego e não acrescenta “corpo”, embora o contexto imediato permita entendê-lo.
- source_word: ψυχικόν
  choice: o natural
  rationale: No contraste paulino, designa o que pertence à vida animada comum, em oposição à vida escatológica do Espírito. “Natural” é claro e evita tanto o literalismo obscuro de “anímico” quanto a conotação moral de “não espiritual”.
- source_word: ἔπειτα
  choice: depois
  rationale: Marca a etapa subsequente na sequência e corresponde de modo simples e idiomático ao grego.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Mas não ... e sim
  rationale: A construção portuguesa reproduz com naturalidade a correção contrastiva da estrutura grega.
theological_decisions:
- issue: Sentido do contraste entre ψυχικόν e πνευματικόν
  choice: Contraste sequencial entre o natural e o espiritual no argumento de Paulo sobre a ressurreição.
  alternative: Contraste especificamente entre o corpo natural e o corpo espiritual; ou entre pessoas não espirituais e espirituais.
  rationale: O contexto menciona explicitamente “corpo natural” e “corpo espiritual” no versículo 44, mas o versículo 46 omite “corpo”. A tradução mantém os adjetivos substantivados e, assim, não restringe indevidamente a formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e a ambiguidade contextual do grego; “e sim” expressa naturalmente o contraste corretivo.
