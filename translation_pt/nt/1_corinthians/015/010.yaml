id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: pt
  text: Mas, pela graça de Deus, sou o que sou, e a graça dele para comigo não se mostrou vazia[a]. Pelo contrário, trabalhei mais do que todos eles; contudo, não eu, mas a graça de Deus que estava comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se tornou vazia” ou “não foi em vão”.
    reason: Alternativas lexicais para οὐ κενὴ ἐγενήθη, que pode conservar a imagem de algo vazio ou indicar algo sem resultado.
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Mas, pela graça de Deus
  rationale: O dativo χάριτι tem sentido instrumental, expresso naturalmente por “pela”. “Mas” preserva o contraste leve de δέ com o contexto anterior, e “graça” mantém o termo paulino central.
- source_word: εἰμι ὅ εἰμι
  choice: sou o que sou
  rationale: Preserva de modo direto e idiomático a repetição grega, referindo-se à condição e identidade presente de Paulo moldadas pela graça.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: a graça dele para comigo
  rationale: “Para comigo” conserva a direção de εἰς e soa natural em português, indicando a graça de Deus dirigida a Paulo.
- source_word: οὐ κενὴ ἐγενήθη
  choice: não se mostrou vazia
  rationale: Mantém a metáfora de κενή e comunica que a graça não ficou sem efeito. A nota registra traduções alternativas igualmente possíveis.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Pelo contrário, trabalhei mais do que todos eles
  rationale: “Pelo contrário” expressa a força adversativa de ἀλλά. “Trabalhei” é claro e atual, enquanto o contexto e a comparação comunicam o esforço intenso de κοπιάω.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: contudo, não eu, mas a graça de Deus
  rationale: A formulação qualifica a afirmação anterior sem negar o trabalho real de Paulo e preserva a atribuição decisiva à graça divina.
- source_word: ἡ σὺν ἐμοί
  choice: que estava comigo
  rationale: Explicita em português a ligação do artigo grego com “a graça de Deus” e traduz diretamente σύν com o dativo.
theological_decisions:
- issue: Relação entre o trabalho de Paulo e a graça divina
  choice: Preservar tanto o trabalho genuíno de Paulo quanto a atuação eficaz da graça de Deus.
  alternative: Explicitar uma cooperação simétrica entre Deus e Paulo, ou minimizar o trabalho de Paulo em favor de uma atuação divina exclusiva.
  rationale: O grego afirma que Paulo trabalhou mais do que os demais e, ao mesmo tempo, corrige essa afirmação com “não eu, mas a graça de Deus”. A tradução mantém essa tensão sem a resolver segundo um sistema teológico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura retórica e os contrastes do grego foram preservados sem rigidez excessiva.
