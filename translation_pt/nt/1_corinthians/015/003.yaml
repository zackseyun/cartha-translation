id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: pt
  text: 'Pois transmiti a vocês, como de importância primordial, o que também recebi: que o Messias[a] morreu por nossos pecados, segundo as Escrituras[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo morreu por nossos pecados”. O título grego Χριστός pode ser traduzido por “Messias” quando seu sentido titular está em destaque.
    reason: alternative_reading
  - marker: b
    text: Ou “de acordo com as Escrituras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: transmiti
  rationale: No contexto da tradição recebida e comunicada, παραδίδωμι indica transmitir ou passar adiante um ensinamento autorizado. “Transmiti” expressa isso com naturalidade e dignidade em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e conserva de modo claro a conexão argumentativa.
- source_word: ἐν πρώτοις
  choice: como de importância primordial
  rationale: Expressa a provável prioridade de importância, e não apenas uma sequência temporal, sem tornar a formulação excessivamente técnica.
- source_word: ὃ καὶ παρέλαβον
  choice: o que também recebi
  rationale: Preserva o paralelo entre receber a tradição e transmiti-la.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo recebido e transmitido.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Nesta síntese confessional, Χριστός conserva força titular. “O Messias” torna explícito esse sentido em português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo apresenta o acontecimento de forma pontual e é naturalmente traduzido pelo pretérito perfeito.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: por nossos pecados
  rationale: Mantém a afirmação salvífica ampla do grego sem impor uma teoria específica sobre o modo da expiação.
- source_word: κατὰ τὰς γραφάς
  choice: segundo as Escrituras
  rationale: κατά indica conformidade ou correspondência; a formulação é tradicional, clara e conserva o plural γραφάς.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: O termo funciona aqui como título na fórmula confessional. “O Messias” preserva sua dimensão messiânica judaica; “Cristo” continua sendo uma tradução tradicional possível.
- issue: Sentido de ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: por nossos pecados
  alternative: por causa de nossos pecados
  rationale: “Por nossos pecados” preserva a relação salvífica afirmada pelo texto e não restringe ὑπέρ a uma única explicação teológica.
- issue: Relação expressочему em κατὰ τὰς γραφάς
  choice: segundo as Escrituras
  alternative: de acordo com as Escrituras
  rationale: Ambas expressam conformidade com as Escrituras; a opção principal é concisa, natural e consagrada pelo uso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Transmiti a vocês” evita tanto o arcaísmo de “vos entreguei” quanto a possível perda do sentido de tradição autorizada em uma formulação excessivamente coloquial. Os marcadores foram colocados junto às expressões às quais cada nota se refere.
