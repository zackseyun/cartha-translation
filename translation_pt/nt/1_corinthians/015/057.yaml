id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: pt
  text: Mas graças a Deus, que nos dá a vitória por meio de nosso Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Forma tradicional: “Jesus Cristo”. O título grego Χριστός significa “Messias”.'
    reason: Registra a forma portuguesa tradicional e esclarece o sentido do título traduzido no texto principal.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição contrastiva entre a derrota da morte descrita antes e a ação de graças que encerra o argumento.
- source_word: τῷ θεῷ χάρις
  choice: graças a Deus
  rationale: Nesta fórmula idiomática, χάρις expressa agradecimento, não a graça concedida por Deus. A formulação é natural e preserva a força doxológica.
- source_word: τῷ διδόντι
  choice: que nos dá
  rationale: O particípio presente substantivado caracteriza Deus como aquele que dá a vitória; o presente português conserva o sentido contínuo ou característico.
- source_word: ἡμῖν τὸ νῖκος
  choice: nos dá a vitória
  rationale: O pronome é objeto indireto, e o artigo aponta para a vitória específica sobre a morte desenvolvida no contexto.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, διά indica meio ou agência. 'Por meio de' torna explícita essa relação sem ampliá-la.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: Reproduz o título cristológico κύριος e o possessivo comunitário ἡμῶν em português corrente e digno.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor titular. Em português, o artigo e a vírgula apresentam 'o Messias' naturalmente como título explicativo de Jesus.
theological_decisions:
- issue: Sentido de Χριστός na sequência Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: O texto principal traduz o significado do título grego em vez de apenas conservar sua forma tradicional. A alternativa consagrada é registrada em nota, sem negar que a expressão também pode soar como uma designação pessoal fixa.
- issue: Natureza da vitória
  choice: a vitória
  alternative: uma vitória; triunfo
  rationale: O artigo grego e o contexto imediato apontam para a vitória escatológica sobre a morte, mas a tradução não acrescenta essa explicação ao corpo do versículo.
translation_notes:
  register: Português moderno, internacional e de leitura natural no Brasil. A construção mantém o tom solene de ação de graças sem recorrer a ordem sintática arcaica. A vírgula antes de “o Messias” favorece a compreensão do termo como título.
