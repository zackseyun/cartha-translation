id: 1CO.15.25
reference: 1 Corinthians 15:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: pt
  text: Pois é necessário que ele reine até que ponha todos os seus inimigos debaixo dos seus pés.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que tenha posto todos os seus inimigos debaixo dos seus pés”. A formulação grega não exige, por si só, uma distinção entre essas possibilidades aspectuais em português.'
    reason: lexical_alternative
  - marker: b
    text: A imagem de inimigos colocados “debaixo dos seus pés” representa, na Bíblia, sua completa sujeição; compare Salmo 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: é necessário
  rationale: Expressa necessidade ou inevitabilidade divina. A formulação é natural e preserva a força do grego sem explicitação excessiva.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a ligação lógica com dignidade e clareza.
- source_word: αὐτὸν
  choice: ele
  rationale: 'Embora seja acusativo como sujeito do infinitivo no grego, em português a construção idiomática usa uma oração finita: «que ele reine».'
- source_word: βασιλεύειν
  choice: reine
  rationale: Traduz diretamente a ideia de exercer governo real e preserva a nuance de realeza.
- source_word: ἄχρι οὗ
  choice: até que
  rationale: Marca um ponto temporal. A expressão portuguesa não afirma, por si só, que o reinado cesse depois desse ponto.
- source_word: θῇ
  choice: ponha
  rationale: O subjuntivo presente é natural depois de «até que» e conserva a ambiguidade aspectual do grego sem exigir uma distinção entre «ponha» e «tenha posto».
- source_word: πάντας τοὺς ἐχθροὺς
  choice: todos os seus inimigos
  rationale: Preserva tanto a totalidade da oposição quanto a relação pessoal indicada pelo contexto e pelo pronome final.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: debaixo dos seus pés
  rationale: Mantém diretamente a conhecida imagem bíblica de completa sujeição, com formulação corrente em português.
theological_decisions:
- issue: Força temporal de ἄχρι οὗ («até que»)
  choice: Traduzir por «até que» sem indicar que o reinado do Messias termine depois da submissão dos inimigos.
  alternative: Interpretar a expressão como afirmação de que seu reinado acaba quando os inimigos são submetidos.
  rationale: A construção grega destaca o ponto até o qual o reinado está em vista nesta frase, mas não afirma por si mesma que ele cesse depois. A tradução preserva essa tensão sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pois» mantém a conexão explicativa; «é necessário que ele reine» comunica a necessidade divina sem rigidez; e «debaixo dos seus pés» preserva a imagem bíblica reconhecível.
