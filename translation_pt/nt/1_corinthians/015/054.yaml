source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: pt
  text: 'Mas, quando este corpo perecível se revestir de imperecibilidade, e este corpo mortal se revestir de imortalidade, então se realizará o que está escrito: “A morte foi tragada em vitória”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citação de Isaías 25:8, conforme a tradição grega citada por Paulo. A expressão “se realizará” traduz um verbo que significa mais literalmente “acontecerá” ou “virá a ser”; também se pode traduzir: “então acontecerá o que está escrito”. “Em vitória” traduz uma expressão que indica o desfecho de vitória, sem especificar quem ou o que traga a morte.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: φθαρτὸν
  choice: corpo perecível
  rationale: O adjetivo substantivado aponta, no contexto, para o corpo presente sujeito à deterioração. A explicitação de “corpo” torna a referência natural em português sem alterar o sentido.
- source_word: ἐνδύσηται
  choice: se revestir de
  rationale: Preserva a metáfora de vestir-se e reflete adequadamente a voz média, em linguagem digna e corrente.
- source_word: ἀφθαρσίαν
  choice: imperecibilidade
  rationale: Mantém a correspondência lexical com “perecível” e designa a condição de não estar sujeito à deterioração.
- source_word: θνητὸν
  choice: corpo mortal
  rationale: Expressa aquilo que está sujeito à morte; “corpo” é explicitado por causa do adjetivo substantivado e do contexto imediato.
- source_word: ἀθανασίαν
  choice: imortalidade
  rationale: Equivalente direto e corrente para a condição de não morrer.
- source_word: γενήσεται
  choice: se cumprirá
  rationale: No contexto de uma declaração escrita citada como realizada naquele momento, esta é a formulação portuguesa mais natural. A nota registra que o verbo grego significa mais literalmente “acontecerá” ou “se realizará”.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: o que está escrito
  rationale: Forma idiomática em português para introduzir uma declaração escrita, sem exigir a tradução rígida de λόγος por “palavra”.
- source_word: Κατεπόθη
  choice: foi tragada
  rationale: O pretérito perfeito passivo preserva o aoristo da citação e apresenta a derrota da morte como consumada no momento futuro descrito.
- source_word: εἰς νῖκος
  choice: pela vitória
  rationale: Expressa de modo natural a vitória como aquilo que engole e derrota a morte; a construção grega admite nuances de resultado, e a formulação acompanha o sentido da tradição grega citada por Paulo.
theological_decisions:
- issue: Relação de γενήσεται com a citação bíblica
  choice: se cumprirá o que está escrito
  alternative: acontecerá o que está escrito; se realizará a palavra escrita
  rationale: “Se cumprirá” comunica naturalmente que a declaração escrita se torna realidade, embora γίνομαι não seja o verbo técnico usual para “cumprir”. A nota preserva a força lexical mais literal.
- issue: Aspecto temporal de Κατεπόθη na declaração escatológica
  choice: A morte foi tragada pela vitória
  alternative: A morte é tragada pela vitória; A morte terá sido tragada pela vitória
  rationale: O perfeito português apresenta a ação como consumada no ponto futuro introduzido por “quando... então”, sem transformar a frase em afirmação meramente atemporal.
- issue: Agente ou meio implícito em εἰς νῖκος
  choice: pela vitória
  alternative: na vitória; para a vitória
  rationale: A expressão declara a derrota completa da morte sem identificar além do texto quem exerce a vitória. A ambiguidade teológica relevante não é preenchida por um agente nomeado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “este corpo” conserva a ênfase demonstrativa e esclarece os adjetivos substantivados. A metáfora de revestir-se foi mantida, e a nota reúne apenas informações diretamente úteis sobre a fonte da citação e a alternativa lexical.
