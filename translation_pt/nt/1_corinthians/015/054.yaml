    issue: “Pela vitória” para εἰς νῖκος
    rationale: A formulação introduz uma relação instrumental/agencial (“a vitória” como aquilo que traga a morte). O grego εἰς νῖκος expressa antes o desfecho de vitória. “Em vitória” conserva essa relação sem especificar agente ou meio.
  - severity: low
    issue: “Se cumprirá” para γενήσεται
    rationale: É uma tradução possível no contexto de uma declaração escrita, mas “se realizará” reproduz melhor o sentido de “vir a acontecer/realizar-se”, sem importar uma fórmula mais forte de cumprimento.
