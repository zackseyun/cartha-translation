  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: pt
  text: E aquilo que você semeia não é o corpo que virá a existir, mas um simples grão, talvez de trigo ou de alguma outra espécie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: semeia
  rationale: Preserva o verbo agrícola e a imagem da semeadura que estrutura a analogia de Paulo.
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente direto e mantém a ligação com o argumento mais amplo sobre a ressurreição do corpo.
- source_word: τὸ γενησόμενον
  choice: que virá a existir
  rationale: Expressa o sentido futuro de γίνομαι sem reduzir a ideia ao mero crescimento botânico.
- source_word: γυμνὸν κόκκον
  choice: um simples grão
  rationale: Em português, evita a estranheza de 'grão nu' e comunica um grão ainda sem a forma futura, preservando o contraste essencial.
- source_word: εἰ τύχοι
  choice: talvez
  rationale: Reproduz com naturalidade o caráter exemplificativo e contingente da expressão grega.
- source_word: σίτου
  choice: de trigo
  rationale: Neste contexto, o termo designa naturalmente o trigo como exemplo concreto.
- source_word: τινος τῶν λοιπῶν
  choice: de alguma outra espécie
  rationale: Torna explícita de modo natural a referência elíptica a outra espécie de grão ou semente.
theological_decisions:
- issue: Relação entre a semente e o corpo ressuscitado
  choice: Manter 'corpo' e a formulação futura sem explicar além da metáfora.
  alternative: Traduzir dinamicamente como 'a planta que vai crescer'.
  rationale: A redação conserva tanto a continuidade quanto a transformação sugeridas pela analogia, sem substituir o vocabulário corporal de Paulo por uma interpretação puramente botânica.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O pronome 'você' traduz o singular do verbo grego e se harmoniza com a legibilidade brasileira.
