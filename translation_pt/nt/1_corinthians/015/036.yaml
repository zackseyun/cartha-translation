  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: pt
  text: Insensato[a]! Aquilo que você semeia não recebe vida[b] se não morrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tolo!”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não ganha vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Insensato
  rationale: Preserva a repreensão direta no vocativo e soa natural e digna em português atual, sem recorrer a uma forma arcaica.
- source_word: σὺ
  choice: você
  rationale: O pronome explícito no grego é refletido em «você», adequado à legibilidade brasileira e capaz de preservar a ênfase pessoal no contexto.
- source_word: ὃ σπείρεις
  choice: Aquilo que você semeia
  rationale: Mantém a imagem agrícola e expressa com clareza o antecedente singular retomado pelo verbo «morrer».
- source_word: ζῳοποιεῖται
  choice: não recebe vida
  rationale: Conserva o valor passivo do verbo e sua ideia de vivificação, com formulação corrente em português; a alternativa «não ganha vida» é mais idiomática, porém menos transparente quanto ao passivo.
- source_word: ἐὰν μὴ
  choice: se não
  rationale: Reproduz naturalmente a condição negativa do grego sem acrescentar uma sequência temporal explícita.
- source_word: ἀποθάνῃ
  choice: morrer
  rationale: O infinitivo depois de «se não» oferece em português uma construção natural e mantém a condição expressa pelo aoristo subjuntivo, sem acrescentar «primeiro».
theological_decisions:
- issue: Relação metafórica entre a morte da semente e a vida da ressurreição
  choice: Manter a metáfora agrícola sem transformá-la numa fórmula doutrinária explícita.
  alternative: Explicitar que a afirmação se refere diretamente à ressurreição corporal.
  rationale: Paulo emprega a semeadura para responder à objeção sobre a ressurreição; a tradução preserva essa imagem e sua força teológica sem inserir explicações ausentes do versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Insensato» mantém a repreensão firme; «você» favorece a compreensão brasileira. A frase conserva a concisão e a metáfora agrícola do grego.
