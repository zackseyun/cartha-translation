source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: pt
  text: Uma é a glória do sol[a], outra, a glória da lua, e outra, a glória das estrelas; pois uma estrela difere de outra em glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «esplendor» ou «brilho» em todo o versículo; aqui, o grego δόξα pode indicar o resplendor visível, embora «glória» preserve a palavra repetida por Paulo no argumento ao redor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: uma... outra... outra
  rationale: A repetição distingue os corpos celestes e soa natural em português, com elipse verbal nas cláusulas paralelas.
- source_word: δόξα
  choice: glória
  rationale: No contexto imediato, pode designar o esplendor ou brilho visível, mas «glória» preserva a repetição lexical e a ligação com o argumento de Paulo sobre a ressurreição.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: do sol / da lua / das estrelas
  rationale: Os genitivos dependem de δόξα e formam a tríade paralela do sol, da lua e das estrelas.
- source_word: ἀστὴρ... ἀστέρος
  choice: uma estrela... de outra
  rationale: Preserva a comparação entre membros da mesma categoria em português idiomático.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo conciso a explicação da afirmação anterior.
- source_word: διαφέρει
  choice: difere
  rationale: Expressa distinção sem impor a ideia mais forte de superioridade.
- source_word: ἐν δόξῃ
  choice: em glória
  rationale: Indica o aspecto em que as estrelas diferem e mantém o termo-chave repetido.
theological_decisions:
- issue: Sentido de δόξα na analogia cosmológica inserida no ensino sobre a ressurreição
  choice: glória
  alternative: esplendor; brilho
  rationale: Embora o referente imediato inclua a luminosidade dos corpos celestes, «glória» conserva a amplitude semântica e a continuidade retórica com a glória do corpo ressuscitado, sem reduzir o termo a um fenômeno meramente físico.
translation_notes:
  register: Português moderno, claro e digno, com construção paralela natural e legibilidade brasileira. A pontuação marca as elipses em «outra, a glória» sem acrescentar conteúdo ausente do grego.
