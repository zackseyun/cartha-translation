source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: pt
  text: Faço saber a vocês, irmãos[a], as boas-novas que lhes anunciei, que vocês também receberam e nas quais também estão firmes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego diz «irmãos» e muitas vezes usa a forma masculina para se dirigir a toda a comunidade de fiéis.
    reason: alternativa lexical e esclarecimento de abrangência
lexical_decisions:
- source_word: Γνωρίζω
  choice: Faço saber
  rationale: Reproduz diretamente o sentido de tornar conhecido ou informar, sem substituir o verbo pela ideia interpretativa de apenas relembrar.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição leve. Em português, o início de um novo assunto já cumpre essa função; «porém» sugeriria contraste excessivo, e «agora» poderia introduzir uma noção temporal ausente.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina do vocativo grego. Como no uso paulino ela pode incluir toda a comunidade cristã, essa abrangência é indicada em nota.
- source_word: τὸ εὐαγγέλιον
  choice: as boas-novas
  rationale: Expressa em linguagem acessível o sentido transparente de notícia boa, preservando também a ligação semântica com o verbo «anunciei».
- source_word: εὐηγγελισάμην
  choice: anunciei
  rationale: Comunica naturalmente o ato de anunciar as boas-novas, sem restringi-lo ao uso eclesiástico de «pregar».
- source_word: παρελάβετε
  choice: receberam
  rationale: Preserva o sentido amplo de receber uma mensagem ou tradição, sem acrescentar a nuance subjetiva mais forte de «aceitar».
- source_word: ἐν ᾧ
  choice: nas quais
  rationale: Retoma «as boas-novas» e conserva a imagem do evangelho como a esfera na qual os destinatários se mantêm.
- source_word: ἑστήκατε
  choice: permanecem firmes
  rationale: O perfeito indica um estado presente resultante de uma ação anterior. «Permanecem firmes» comunica esse estado de modo natural em português.
theological_decisions:
- issue: Abrangência de ἀδελφοί ao dirigir-se à congregação
  choice: «irmãos» no texto principal, com nota inclusiva
  alternative: «irmãos e irmãs»
  rationale: A forma do original é preservada, enquanto a nota esclarece que, nesse uso, o termo frequentemente se dirige a toda a comunidade de fiéis, sem excluir as mulheres.
- issue: Força de ἐν ᾧ καὶ ἑστήκατε
  choice: «nas quais também permanecem firmes»
  alternative: «pelas quais também são sustentados»
  rationale: A tradução mantém a preposição «em» e o estado expresso pelo perfeito, sem antecipar a afirmação sobre salvação do versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «A vocês» evita regionalismos pronominais; «boas-novas» torna εὐαγγέλιον transparente, e «permanecem firmes» expressa naturalmente o valor resultativo do perfeito grego.
