id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: pt
  text: Então virá o fim[a], quando ele entregar o reino a Deus, o Pai[b], quando ele reduzir a nada todo governo, toda autoridade e todo poder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a consumação”. A palavra grega também pode indicar a meta ou o desfecho.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “a Deus e Pai”.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “quando ele abolir todo governo, toda autoridade e todo poder”. O verbo grego pode significar anular, tornar inoperante ou abolir; a construção não exige que essa ação ocorra antes da entrega do reino.'
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Então
  rationale: Marca de forma concisa a etapa seguinte na sequência escatológica de Paulo.
- source_word: τὸ τέλος
  choice: o fim
  rationale: Preserva o sentido temporal mais direto de τέλος no contexto, sem excluir suas nuances de meta ou consumação.
- source_word: ὅταν παραδιδῷ
  choice: quando ele entregar
  rationale: Expressa naturalmente em português o evento futuro de transferir o reino.
- source_word: τὴν βασιλείαν
  choice: o reino
  rationale: É a equivalência corrente e mantém tanto a imagem régia quanto a possível ideia dinâmica de reinado.
- source_word: τῷ θεῷ καὶ πατρί
  choice: a Deus, o Pai
  rationale: Entende a construção como apositiva, mas a vírgula preserva com clareza a identificação do Pai sem tornar invisível a forma grega com καί.
- source_word: ὅταν καταργήσῃ
  choice: depois de reduzir a nada
  rationale: O aoristo subjuntivo pode indicar ação anterior à entrega do reino; a expressão comunica a cessação decisiva da eficácia dos poderes sem exigir aniquilação metafísica.
- source_word: πᾶσαν ἀρχὴν
  choice: todo governo
  rationale: Neste trio, ἀρχή pode designar governo, domínio ou poder governante; a escolha preserva melhor a formulação abstrata do texto do que 'governante'.
- source_word: πᾶσαν ἐξουσίαν
  choice: toda autoridade
  rationale: Equivalente português claro para autoridade exercida ou domínio delegado.
- source_word: δύναμιν
  choice: todo poder
  rationale: Mantém a amplitude de δύναμις e a cadência da tríade.
theological_decisions:
- issue: Relação entre “Deus” e “Pai” em τῷ θεῷ καὶ πατρί
  choice: 'Leitura apositiva: “a Deus, o Pai”'
  alternative: 'Leitura coordenada: “a Deus e Pai”'
  rationale: A leitura apositiva é natural no contexto paulino, enquanto a vírgula deixa transparente que “o Pai” identifica Deus sem acrescentar uma conclusão doutrinária além do enunciado.
- issue: Relação temporal entre καταργήσῃ e παραδιδῷ
  choice: 'Abolição anterior à entrega: “depois de reduzir a nada”'
  alternative: 'Eventos simplesmente concomitantes: “quando reduzir a nada”'
  rationale: 'O aoristo subjuntivo καταργήσῃ, em contraste com o presente subjuntivo παραδιδῷ, permite e favorece a ideia de anterioridade: ele entrega o reino após neutralizar todos os poderes; a nota registra a alternativa menos explícita.'
- issue: Força de καταργέω quanto aos poderes
  choice: 'Cessação decisiva de sua eficácia: “reduzir a nada”'
  alternative: “abolir”, “anular” ou “destruir”
  rationale: A tradução comunica que sua atuação e domínio são encerrados, sem definir como aniquilação a condição metafísica desses poderes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Virá” explicita de modo natural o evento elíptico em εἶτα τὸ τέλος. A formulação evita vocabulário denominacional e conserva em notas as ambiguidades lexical, sintática e temporal relevantes.
