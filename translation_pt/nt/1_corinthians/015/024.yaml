  rationale: A revisão substitui «depois de» por «quando», preservando a ambiguidade temporal da construção grega e a coordenação das duas orações com ὅταν. Mantêm-se as escolhas lexicais que representam naturalmente a tríade e a identificação apositiva de Deus como Pai. A nota c é ajustada para explicar a alternativa lexical e impedir que se atribua ao aoristo uma anterioridade obrigatória.
