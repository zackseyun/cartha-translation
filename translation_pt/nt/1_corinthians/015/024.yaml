  naturalness: O português é claro, moderno e de boa leitura. «Então virá o fim» e «a Deus, o Pai» são formulações naturais em registro bíblico contemporâneo. «Quando ele reduzir a nada» preserva a ligação sintática do grego de maneira mais direta do que «depois de».
