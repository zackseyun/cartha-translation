base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: pt
  text: Assim como é o homem do pó[a], assim também são os que são do pó; e assim como é o homem celestial, assim também são os que são celestiais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Tal qual o homem do pó, tais também os que são do pó; e tal qual o homem celestial, tais também os que são celestiais.”'
    reason: Alternativa lexical que reproduz mais diretamente a construção correlativa grega οἷος ... τοιοῦτοι.
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Assim como é ... assim também são ...
  rationale: A construção correlativa indica correspondência entre uma figura representativa e os que pertencem à mesma ordem. A formulação mantém o paralelismo e é clara em português atual.
- source_word: χοϊκός
  choice: do pó
  rationale: O adjetivo descreve aquilo que é feito do pó ou caracterizado por ele, retomando a origem de Adão no contexto anterior. “Do pó” preserva essa alusão e a repetição lexical.
- source_word: ὁ χοϊκός
  choice: o homem do pó
  rationale: Embora “homem” esteja implícito no adjetivo substantivado, o contexto contrasta Adão e Cristo como figuras humanas representativas. A explicitação torna o português natural sem ir além do contexto.
- source_word: οἱ χοϊκοί
  choice: os que são do pó
  rationale: A expressão designa pessoas que compartilham a condição do homem do pó. A tradução mantém a ligação verbal com o singular e evita a possível imprecisão de “terrenos”.
- source_word: ἐπουράνιος
  choice: celestial
  rationale: O adjetivo significa pertencente ao céu ou caracterizado por ele. “Celestial” conserva a forma adjetiva e o contraste de Paulo, sem importar para este versículo a formulação “do céu” do versículo anterior.
- source_word: ὁ ἐπουράνιος
  choice: o homem celestial
  rationale: O singular remete, no contexto imediato, a Cristo em contraste com Adão. A explicitação de “homem” preserva a simetria entre as duas figuras representativas.
- source_word: οἱ ἐπουράνιοι
  choice: os que são celestiais
  rationale: O plural se refere às pessoas que correspondem ao homem celestial. Essa formulação preserva a força adjetiva e não sugere que Paulo esteja falando de anjos.
theological_decisions:
- issue: Explicitar “homem” nas duas expressões singulares substantivadas
  choice: o homem do pó ... o homem celestial
  alternative: aquele que é do pó ... aquele que é celestial
  rationale: O contexto de 1 Coríntios 15:45–49 estabelece o contraste representativo entre Adão e Cristo. Explicitar “homem” esclarece os referentes e mantém o paralelismo, sem acrescentar uma identificação estranha ao contexto.
- issue: Identidade dos οἱ ἐπουράνιοι
  choice: os que são celestiais, entendidos como seres humanos correspondentes ao homem celestial
  alternative: os seres celestiais
  rationale: O argumento trata da humanidade e da ressurreição, especialmente daqueles que levarão a imagem do homem celestial. A tradução evita uma leitura angélica, mas não especifica além do texto a maneira ou o momento dessa correspondência.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo deliberadamente preservado. “Do pó” mantém a alusão a Gênesis e “celestial” conserva o contraste adjetival do original. O marcador [a] aparece no texto principal.
