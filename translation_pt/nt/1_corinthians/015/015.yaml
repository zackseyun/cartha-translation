id: 1CO.15.15
reference: 1 Corinthians 15:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: pt
  text: Então, somos até considerados falsas testemunhas a respeito de Deus[a], porque testemunhamos contra Deus, dizendo que ele ressuscitou o Messias[b], a quem ele não ressuscitou, se é verdade que os mortos não ressuscitam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falsas testemunhas de Deus”. O genitivo grego pode ser reproduzido dessa forma, mas aqui indica mais provavelmente que o falso testemunho diz respeito a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “o Cristo”. “Messias” traduz o título Χριστός neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: somos considerados
  rationale: O presente passivo indica que os apóstolos ficam demonstrados ou são tidos como tais; a formulação é natural em português e preserva o sentido resultante.
- source_word: δὲ καὶ
  choice: Então, ... até
  rationale: “Então” explicita a consequência lógica do argumento anterior, e “até” conserva a força enfática e aditiva de καί.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: falsas testemunhas a respeito de Deus
  rationale: “Falsas testemunhas” mantém a linguagem de depoimento; o genitivo é entendido como referência ou objeto do falso testemunho, sem sugerir que as testemunhas pertencem a Deus.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: testemunhamos contra Deus
  rationale: κατά com genitivo normalmente tem sentido adversativo. Se Deus não ressuscitou o Messias, atribuir-lhe esse ato constitui testemunho contra ele, o que preserva a severidade do argumento.
- source_word: ἤγειρεν τὸν Χριστόν
  choice: ressuscitou o Messias
  rationale: No contexto da ressurreição, ἐγείρω é expresso naturalmente por “ressuscitar”; o artigo e o contexto favorecem o valor titular de Χριστός, traduzido como “Messias”.
- source_word: ὃν οὐκ ἤγειρεν
  choice: a quem ele não ressuscitou
  rationale: Mantém a oração relativa e repete o verbo para conservar o contraste retórico do grego.
- source_word: εἴπερ ἄρα
  choice: se é verdade que
  rationale: Expressa a premissa condicional assumida para fins do argumento, com linguagem corrente e sem eliminar sua força.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: os mortos não ressuscitam
  rationale: O adjetivo substantivado designa as pessoas mortas em geral. O português idiomático usa “ressuscitam”; no contexto, isso não exige que elas o façam por poder próprio.
theological_decisions:
- issue: Sentido de κατὰ τοῦ θεοῦ
  choice: contra Deus
  alternative: a respeito de Deus
  rationale: 'O sentido adversativo normal de κατά com genitivo produz uma afirmação forte, porém coerente: se Deus não realizou a ressurreição proclamada, os apóstolos testemunharam falsamente contra ele. A tradução não suaviza essa tensão.'
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O artigo e a função no argumento favorecem a leitura como título. “Messias” comunica esse valor de modo transparente, sem transformar o termo em nome próprio.
- issue: Voz de οὐκ ἐγείρονται
  choice: não ressuscitam
  alternative: não são ressuscitados
  rationale: A forma grega pode ser entendida como passiva, mas “os mortos não ressuscitam” é a expressão portuguesa mais natural para a proposição geral e não determina, por si só, a agência da ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura argumentativa foi mantida, e a distinção entre “a respeito de Deus” no genitivo e “contra Deus” em κατά com genitivo foi preservada. Todos os marcadores de nota aparecem no texto principal.
