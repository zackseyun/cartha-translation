source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: pt
  text: E, se o Messias não foi ressuscitado, então vazia é a nossa proclamação, e vazia também é a fé de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Preserva o sentido titular de Χριστός no argumento de Paulo; “Cristo” é uma alternativa tradicional, mas pode soar mais como nome próprio.
- source_word: ἐγήγερται
  choice: foi ressuscitado
  rationale: Reflete o perfeito passivo no contexto da ressurreição e mantém implícita a agência divina, embora o português expresse de modo menos marcado o resultado continuado do perfeito grego.
- source_word: ἄρα
  choice: então
  rationale: Marca de maneira natural a conclusão lógica decorrente da condição anterior.
- source_word: κήρυγμα
  choice: proclamação
  rationale: Conserva a ideia de anúncio público, sem restringir o termo à atividade de pregar um sermão.
- source_word: κενὸν / κενὴ
  choice: vazia
  rationale: Mantém nas duas ocorrências a mesma imagem de algo sem conteúdo, fundamento ou validade, preservando o paralelismo retórico.
- source_word: πίστις
  choice: fé
  rationale: Neste contexto, refere-se à resposta de crença ou confiança dos coríntios; “fé” é a forma mais natural e reconhecível em português.
theological_decisions:
- issue: Formulação da ressurreição e agência
  choice: não foi ressuscitado
  alternative: não ressuscitou
  rationale: A forma passiva preserva a construção grega e deixa intacta a nuance teológica da ação de Deus, sem resolver além do texto a questão da agência.
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A escolha torna explícito o valor titular do termo no raciocínio sobre a ressurreição, em vez de tratá-lo apenas como nome próprio.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem “vazia é... e vazia também...” reproduz a ênfase e o paralelismo do grego sem perder naturalidade.
