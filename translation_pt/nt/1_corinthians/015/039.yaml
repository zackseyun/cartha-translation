  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: pt
  text: Nem toda carne é a mesma carne[a], mas uma é a carne dos seres humanos; outra, a dos animais; outra, a das aves; e outra, a dos peixes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “Nem todo tipo de carne é igual”.'
    reason: alternativa lexical que explicita a distinção entre tipos implícita na construção grega
lexical_decisions:
- source_word: σὰρξ
  choice: carne
  rationale: Neste contexto, o termo se refere literalmente à constituição física dos diferentes seres vivos, não à natureza pecaminosa. “Carne” preserva tanto o sentido concreto quanto a repetição enfática de Paulo.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Nem toda carne é a mesma carne
  rationale: A formulação conserva a negação, a ênfase e a repetição do grego. Embora “nem todo tipo de carne é igual” seja mais idiomático, explicita a ideia de “tipo”, que está apenas implícita no original.
- source_word: ἄλλη
  choice: outra
  rationale: O termo estabelece distinções entre categorias. A repetição de “outra” reproduz o paralelismo retórico da enumeração grega.
- source_word: ἀνθρώπων
  choice: seres humanos
  rationale: O plural abrange a humanidade em geral, sem referência exclusiva ao sexo masculino. “Seres humanos” também torna clara a contraposição com as demais criaturas.
- source_word: κτηνῶν
  choice: animais
  rationale: O termo pode designar animais, especialmente quadrúpedes ou animais domesticados. Neste catálogo amplo de criaturas, “animais” é a opção mais clara e natural, sem restringir indevidamente o sentido a gado.
- source_word: πτηνῶν
  choice: aves
  rationale: Embora possa designar criaturas voadoras de modo mais amplo, “aves” expressa naturalmente a categoria pretendida neste contexto.
- source_word: ἰχθύων
  choice: peixes
  rationale: É o equivalente português direto e corrente para a categoria indicada pelo genitivo plural grego.
- source_word: ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ σὰρξ πτηνῶν, ἄλλη δὲ ἰχθύων
  choice: uma é a carne dos seres humanos; outra, a dos animais; outra, a das aves; e outra, a dos peixes
  rationale: A tradução explicita “carne” no primeiro membro e usa elipse nos seguintes, como é natural em português. Assim, mantém o paralelismo categorial sem produzir repetição pesada. O último membro continua a ideia de “carne” mesmo onde o substantivo não aparece expresso no texto grego.
theological_decisions:
- issue: Sentido de σάρξ em um contexto paulino
  choice: carne em sentido literal
  alternative: corpo; natureza; natureza pecaminosa
  rationale: O contexto trata das diferentes formas físicas da vida criada e prepara a discussão sobre a ressurreição. Portanto, σάρξ tem sentido concreto; traduzi-lo como “natureza pecaminosa” introduziria aqui uma noção teológica ausente do texto.
- issue: Relação entre as diferentes carnes e a argumentação sobre a ressurreição
  choice: preservar a enumeração sem explicar sua implicação teológica dentro do versículo
  alternative: parafrasear como diferentes tipos de corpos criados por Deus
  rationale: Paulo usa a diversidade das criaturas como parte de seu argumento, mas o versículo não explicita ainda toda a conclusão. A tradução preserva essa progressão e evita resolver antecipadamente a tensão entre continuidade e transformação corporal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Seres humanos” evita ambiguidade de gênero; “aves” e “peixes” são categorias correntes. Os pontos e vírgulas destacam o paralelismo da enumeração, e a elipse de “carne” após o primeiro item evita uma repetição pouco natural sem apagar a estrutura do original.
