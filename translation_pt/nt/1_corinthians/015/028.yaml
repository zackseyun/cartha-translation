  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: pt
  text: Mas, quando todas as coisas[a] lhe forem sujeitas, então o próprio Filho será sujeito àquele que lhe sujeitou todas as coisas, para que Deus seja tudo em todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo”. O grego repete a expressão “todas as coisas” (τὰ πάντα), ressaltando o alcance cósmico do argumento de Paulo.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é compacta e pode ser entendida como “todas as coisas em todos” ou “tudo em todos”. A forma grega final (πᾶσιν) pode referir-se a “todos” ou, mais amplamente, a “todas as coisas”. “Tudo em todos” preserva a concisão e a amplitude da frase.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν introduz uma oração temporal, e δέ marca uma transição levemente adversativa ou continuativa no argumento.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: forem sujeitas / será sujeito
  rationale: As duas formas de ὑποτάσσω são passivas. A tradução conserva tanto a voz passiva quanto a repetição lexical, com formulação natural e digna em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: O dativo remete ao Filho no contexto e indica a quem todas as coisas são sujeitas.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: A expressão neutra plural, repetida por Paulo, tem alcance abrangente e cósmico; a mesma formulação foi mantida nas duas ocorrências.
- source_word: τότε
  choice: então
  rationale: Advérbio temporal que assinala a etapa consequente da sequência descrita.
- source_word: αὐτὸς ὁ υἱὸς
  choice: o próprio Filho
  rationale: αὐτός dá ênfase pessoal ao Filho, bem expressa em português por “o próprio Filho”.
- source_word: τῷ ὑποτάξαντι
  choice: àquele que ... sujeitou
  rationale: O particípio aoristo ativo com artigo funciona como substantivo e identifica aquele que realizou a sujeição.
- source_word: ἵνα ᾖ
  choice: para que ... seja
  rationale: ἵνα com o subjuntivo expressa propósito ou resultado; “para que” preserva essa abertura sem decidir rigidamente entre as duas nuances.
- source_word: πάντα ἐν πᾶσιν
  choice: tudo em todos
  rationale: A formulação compacta conserva a força retórica e a amplitude da expressão paulina, sem limitar indevidamente o referente de πᾶσιν.
theological_decisions:
- issue: A sujeição do Filho
  choice: Traduzir diretamente que o próprio Filho “será sujeito” àquele que lhe sujeitou todas as coisas.
  alternative: Parafrasear a sujeição como simples entrega administrativa do reino ou acrescentar qualificações sobre a natureza do Filho.
  rationale: O texto afirma a futura sujeição do Filho no desenvolvimento escatológico de Paulo. A tradução preserva essa tensão sem inferir inferioridade de essência nem inserir distinções teológicas posteriores no versículo.
- issue: Alcance de τὰ πάντα e πάντα ἐν πᾶσιν
  choice: 'Manter linguagem abrangente: “todas as coisas” e “tudo em todos”.'
  alternative: Restringir o sentido a todas as pessoas ou explicitar “tudo em todas as coisas”.
  rationale: A repetição de πᾶς sustenta o alcance cósmico do argumento, enquanto a concisão da frase final não identifica de modo inequívoco se πᾶσιν é masculino ou neutro.
- issue: Presença de “também” na sujeição do Filho
  choice: Não acrescentar “também”.
  alternative: “Então o próprio Filho também será sujeito”.
  rationale: Embora “também” possa tornar explícita a relação lógica com a sujeição universal anterior, não há καί no texto grego apresentado. A sequência já é clara em português sem essa adição.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a repetição de “sujeitar” e “todas as coisas”, a voz passiva do grego e a formulação tradicionalmente reconhecível “tudo em todos”, sem resolver a ambiguidade do último plural.
