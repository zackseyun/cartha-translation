source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: pt
  text: Mas Deus lhe dá um corpo, como quis, e dá a cada uma das sementes o seu próprio corpo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e dá a cada semente o seu próprio corpo”. O grego diz literalmente “a cada uma das sementes”, expressão que pode ter sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: lhe dá
  rationale: O presente δίδωσιν é naturalmente traduzido por “dá”, e o pronome dativo αὐτῷ retoma a semente mencionada no contexto anterior; “lhe dá” conserva essa relação de modo idiomático.
- source_word: σῶμα
  choice: corpo
  rationale: “Corpo” é o equivalente padrão e preserva o vínculo lexical com o tema da ressurreição corporal ao longo do capítulo.
- source_word: καθὼς ἠθέλησεν
  choice: como quis
  rationale: A expressão comunica a vontade de Deus de maneira natural e concisa, sem ampliar o sentido para uma formulação doutrinária não explícita.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: a cada uma das sementes
  rationale: A formulação mantém o valor distributivo de ἑκάστῳ e representa de perto o genitivo partitivo τῶν σπερμάτων.
- source_word: ἴδιον
  choice: seu próprio
  rationale: A expressão assinala o corpo particular pertencente a cada semente e preserva a força individualizadora do termo grego.
theological_decisions:
- issue: Ação e vontade divinas na analogia entre a semente e o corpo
  choice: Deus dá à semente o corpo conforme sua vontade, e cada semente recebe seu próprio corpo.
  alternative: Explicitar que Deus dá a cada “tipo” ou “espécie” de semente um corpo distinto.
  rationale: O texto atribui claramente a Deus a ação e a decisão, mas não contém um termo explícito para “tipo” ou “espécie”. A tradução mantém a agência divina e a distribuição individual sem acrescentar uma classificação não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Como quis” é mais natural no português corrente do que “como desejou” ou “conforme determinou”, e preserva a concisão do grego. A vírgula antes de “seu próprio corpo” ajuda a tornar clara a construção elíptica sem inserir outro verbo.
