id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: pt
  text: 'Assim também está escrito: “O primeiro homem, Adão, tornou-se um ser vivente”[a]; o último Adão tornou-se espírito que dá vida[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma alma vivente”, forma tradicional que também pode traduzir a expressão de Gênesis 2:7.
    reason: lexical_alternative
  - marker: b
    text: Ou “um espírito vivificante”. A expressão caracteriza o último Adão em contraste com o primeiro; no grego, ela é qualitativa e não identifica necessariamente Cristo de modo explícito com o Espírito Santo como pessoa distinta.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Assim também está escrito
  rationale: Preserva a ligação inferencial com o argumento anterior e emprega a fórmula corrente de introdução de uma citação das Escrituras.
- source_word: Ἐγένετο
  choice: tornou-se
  rationale: Expressa de modo natural a passagem a um estado ou condição resultante, em consonância com a alusão a Gênesis 2:7.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: o primeiro homem
  rationale: Mantém tanto o sentido masculino referente a Adão quanto a força representativa e tipológica do contraste com o último Adão.
- source_word: Ἀδὰμ
  choice: Adão
  rationale: Usa a forma tradicional e plenamente estabelecida do nome em português.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: um ser vivente
  rationale: No contexto da criação, ψυχή designa o ser animado e vivo, não necessariamente uma parte imaterial separável. A formulação também ecoa naturalmente Gênesis 2:7 em português.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: o último Adão
  rationale: Conserva a expressão tipológica tradicional e o contraste escatológico estabelecido por Paulo.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: espírito que dá vida
  rationale: Traduz de maneira clara o valor qualitativo de πνεῦμα e a ação expressa por ζῳοποιέω, sem transformar a frase em uma identificação dogmática explícita com o Espírito Santo.
theological_decisions:
- issue: Sentido antropológico de ψυχή na citação de Gênesis
  choice: Traduzir ψυχὴν ζῶσαν por “um ser vivente”.
  alternative: “uma alma vivente”
  rationale: A expressão descreve Adão como pessoa ou criatura viva e não define, por si só, uma antropologia de componentes separáveis. A alternativa tradicional é registrada em nota.
- issue: Sentido de “o último Adão tornou-se espírito que dá vida”
  choice: Manter a contraposição tipológica em linguagem qualitativa, sem explicação doutrinária inserida no versículo.
  alternative: “o último Adão tornou-se o Espírito vivificante”
  rationale: πνεῦμα não tem artigo e a construção é naturalmente qualitativa. A tradução evita identificar explicitamente Cristo com o Espírito Santo como pessoa distinta, sem negar qualquer relação entre Cristo ressuscitado e a obra do Espírito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ser vivente” preserva o eco bíblico sem sugerir indevidamente uma antropologia dualista; “espírito que dá vida” é mais transparente ao leitor comum do que “espírito vivificante”, mantido em nota como alternativa concisa e tradicional.
