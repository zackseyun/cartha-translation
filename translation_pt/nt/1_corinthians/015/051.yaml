lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Preserva a força solene do marcador que chama a atenção e é uma formulação bíblica ainda inteligível em português moderno.
- source_word: μυστήριον
  choice: mistério
  rationale: No uso paulino, designa uma verdade divina antes oculta e agora revelada, não apenas algo difícil de compreender; “mistério” preserva esse sentido estabelecido.
- source_word: ὑμῖν λέγω
  choice: lhes digo
  rationale: Expressão direta e natural que mantém o destinatário plural explícito no grego.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: nem todos dormiremos
  rationale: Mantém a metáfora neotestamentária do sono para a morte e expressa com naturalidade que a negação recai sobre “todos”.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: mas todos seremos transformados
  rationale: “Transformados” comunica melhor que uma mudança escatológica profunda está em vista; “mas” preserva o contraste marcado por δέ.
theological_decisions:
- issue: Sentido de “dormir” no contexto da ressurreição
  choice: Manter “dormiremos” como metáfora da morte física à luz da futura ressurreição.
  alternative: Traduzir interpretativamente como “morreremos”.
  rationale: A metáfora é do próprio texto e se integra ao argumento de Paulo sobre a ressurreição, sem exigir nem afirmar uma doutrina específica sobre o estado intermediário.
- issue: Variante textual sobre quem dorme e quem é transformado
  choice: 'Seguir o SBLGNT: “nem todos dormiremos, mas todos seremos transformados”.'
  alternative: 'Uma variante notável apresenta, em essência: “todos dormiremos, mas nem todos seremos transformados”.'
  rationale: O texto principal traduz diretamente a edição grega fornecida; a variante, por sua relevância interpretativa, é registrada em nota sem substituir o texto adotado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a solenidade do anúncio; “lhes digo” evita uma formulação excessivamente arcaica. As duas notas têm marcadores correspondentes no texto principal.
