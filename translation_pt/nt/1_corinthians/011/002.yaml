  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: pt
  text: Eu os elogio porque se lembram de mim em tudo e se mantêm firmes nas tradições, assim como eu as transmiti a vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ensinamentos” ou “as instruções”; em grego, “as tradições”, isto é, aquilo que foi transmitido.
    reason: alternativa lexical
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Eu os elogio
  rationale: Traduz diretamente o sentido de louvar ou aprovar, em português natural; o pronome explicita o objeto plural presente em ὑμᾶς.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como transição leve. Em português, iniciar diretamente com a declaração evita inserir um contraste ou marcador temporal inexistente, sem perda relevante.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do elogio de Paulo e preserva claramente o valor causal.
- source_word: πάντα μου μέμνησθε
  choice: se lembram de mim em tudo
  rationale: Mantém o amplo alcance de πάντα e traduz de modo corrente a lembrança contínua expressa por μέμνησθε.
- source_word: καθὼς
  choice: assim como
  rationale: Preserva a correspondência entre a forma como Paulo transmitiu as tradições e a forma como os coríntios as conservam.
- source_word: παρέδωκα
  choice: transmiti
  rationale: Expressa naturalmente em português o ato de entregar ou passar adiante ensino e prática recebidos, mantendo a relação semântica com παραδόσεις.
- source_word: τὰς παραδόσεις
  choice: as tradições
  rationale: É a correspondência lexical mais transparente para aquilo que foi transmitido; evita reduzir o termo apenas a ensino ou instrução.
- source_word: κατέχετε
  choice: se mantêm firmes
  rationale: Comunica retenção e adesão ativa em linguagem portuguesa atual, com o complemento 'nas tradições'.
theological_decisions:
- issue: Sentido de παραδόσεις no contexto eclesial
  choice: tradições
  alternative: ensinamentos; instruções
  rationale: O termo designa aquilo que Paulo transmitiu aos coríntios. 'Tradições' preserva a categoria do texto e sua ligação com a transmissão apostólica, sem importar alegações denominacionais posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma plural de segunda pessoa é expressa por “vocês”; “eu os elogio” mantém concordância normativa e natural. A colocação da nota após a frase segue o texto de consulta.
