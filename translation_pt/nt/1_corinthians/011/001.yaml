id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: pt
  text: Tornem-se meus imitadores, assim como eu também sou imitador do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de Cristo».'
    reason: alternative_reading
lexical_decisions:
- source_word: μιμηταί
  choice: imitadores
  rationale: Preserva diretamente a ideia de imitar ou seguir o exemplo de alguém, sem a generalidade de «seguidores».
- source_word: μου
  choice: meus
  rationale: Em português, «meus imitadores» expressa com naturalidade o genitivo grego e equivale a «imitadores de mim».
- source_word: γίνεσθε
  choice: Tornem-se
  rationale: Mantém a força do imperativo de γίνομαι, que conclama os leitores a assumir esse modo de agir, em vez do mais estático «sejam».
- source_word: καθὼς
  choice: assim como
  rationale: Expressa de modo claro e idiomático a comparação entre a imitação de Paulo pelos leitores e a imitação do Messias por Paulo.
- source_word: κἀγὼ
  choice: eu também
  rationale: Preserva o valor aditivo de καί na crase κἀγώ.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título e emprega a forma genitiva portuguesa exigida pela relação com «imitador».
theological_decisions:
- issue: Sentido de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: «Messias» torna explícito o valor titular de Χριστός neste contexto; a forma tradicional «Cristo» é mantida em nota.
- issue: Elipse no segundo membro da comparação
  choice: sou imitador do Messias
  alternative: sou do Messias
  rationale: O grego omite μιμητής no segundo membro, recuperando-o da primeira oração. Repetir «imitador» em português evita que «sou do Messias» seja entendido como mera pertença, sem alterar a relação comparativa do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «imitador» explicita em português a elipse inequívoca do grego.
