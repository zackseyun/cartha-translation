base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: pt
  text: Mas, se julgássemos a nós mesmos[a], não seríamos julgados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “examinássemos a nós mesmos” ou “discerníssemos a nós mesmos”. O verbo grego pode significar avaliar ou distinguir; aqui, “julgássemos” preserva o contraste com “seríamos julgados” na oração seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: A conjunção εἰ introduz a condição, e δέ marca contraste ou transição leve. “Mas, se” preserva ambas as funções em português natural.
- source_word: ἑαυτοὺς
  choice: a nós mesmos
  rationale: É o objeto reflexivo no acusativo; “a nós mesmos” expressa com clareza que a avaliação recai sobre os próprios participantes.
- source_word: διεκρίνομεν
  choice: julgássemos
  rationale: Neste contexto, διακρίνω indica fazer uma avaliação criteriosa de si mesmo. “Julgássemos” preserva a relação verbal e retórica com ἐκρινόμεθα na oração seguinte, sem excluir os sentidos contextualmente possíveis de examinar ou discernir.
- source_word: οὐκ ἂν
  choice: não seríamos
  rationale: Com o imperfeito, ἄν forma a consequência de uma condição irreal ou contrária ao fato. O condicional português comunica essa relação de modo idiomático.
- source_word: ἐκρινόμεθα
  choice: seríamos julgados
  rationale: κρίνω se refere aqui a estar sob julgamento, à luz do desenvolvimento do contexto imediato. A tradução mantém a conexão lexical com a primeira oração e evita intensificar o termo para “condenados”.
theological_decisions:
- issue: Se a segunda oração se refere à condenação final ou ao julgamento disciplinador de Deus
  choice: Manter simplesmente “seríamos julgados”, permitindo que o contexto indique o julgamento disciplinador
  alternative: “seríamos condenados”
  rationale: O versículo seguinte distingue o julgamento e a disciplina do Senhor da condenação com o mundo. Portanto, “julgados” preserva a tensão do texto sem antecipar uma interpretação mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “julgar a nós mesmos” é mantida para tornar perceptível o jogo verbal do grego; a nota registra alternativas naturais.
