id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: pt
  text: Pois, todas as vezes que vocês comem deste pão e bebem do cálice[a], proclamam a morte do Senhor, até que ele venha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “do cálice”, e não “deste cálice” neste versículo, embora o contexto imediato identifique de qual cálice se trata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: todas as vezes que
  rationale: 'Expressa uma ocorrência indefinida e repetida: cada vez que a ação acontece. É natural em português e preserva a força iterativa.'
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que fundamenta a instrução anterior.
- source_word: ἐσθίητε
  choice: vocês comem
  rationale: O presente do subjuntivo grego numa oração temporal indefinida é expresso naturalmente pelo presente do indicativo em português.
- source_word: τὸν ἄρτον τοῦτον
  choice: deste pão
  rationale: Preserva o demonstrativo e produz uma construção portuguesa natural depois de “comer”; “pão” é o equivalente comum de ἄρτος neste contexto.
- source_word: τὸ ποτήριον
  choice: do cálice
  rationale: O grego traz artigo, mas não demonstrativo neste versículo. “Cálice” conserva o referente concreto e o registro solene corrente, sem inserir “deste”.
- source_word: καταγγέλλετε
  choice: proclamam
  rationale: Comunica anúncio público e declarativo, preservando o peso formal do verbo.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: a morte do Senhor
  rationale: Reproduz de modo claro e solene a relação genitiva do grego.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: até que ele venha
  rationale: Marca o limite temporal da proclamação; o subjuntivo “venha” é idiomático após “até que” e mantém o Senhor como sujeito implícito.
theological_decisions:
- issue: Referente do sujeito implícito em ἄχρι οὗ ἔλθῃ
  choice: “ele” se refere ao Senhor Jesus
  alternative: Deixar o sujeito sem referente explícito
  rationale: “O Senhor” é o antecedente imediato e natural, em harmonia com a expectativa paulina de sua vinda.
- issue: Linguagem eucarística/sacramental
  choice: Traduzir diretamente comer o pão, beber do cálice e proclamar a morte do Senhor
  alternative: Adotar uma paráfrase especificamente sacramentalista ou memorialista
  rationale: O versículo declara que a ação proclama a morte do Senhor, mas não desenvolve uma teoria sacramental completa; a tradução não resolve essa tensão segundo uma tradição denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural do grego. “Cálice” mantém o registro bíblico-litúrgico sem acrescentar interpretação denominacional.
