id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: pt
  text: Portanto, quem comer o pão ou beber o cálice do Senhor de maneira indigna[a] será culpado com relação ao corpo e ao sangue do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “De maneira indigna” traduz um advérbio e descreve como a pessoa come ou bebe, não a dignidade intrínseca da pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de maneira mais literal e tradicional: “será culpado do corpo e do sangue do Senhor”. A construção grega expressa culpa ou responsabilidade referente ao corpo e ao sangue do Senhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Introduz uma conclusão inferida da discussão anterior sobre a Ceia do Senhor.
- source_word: ὃς ἂν
  choice: quem
  rationale: Expressa de modo natural em português o sentido indefinido e generalizante da construção grega.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: comer o pão
  rationale: Mantém o presente de uma condição geral e o artigo que identifica o pão já em discussão.
- source_word: ἢ
  choice: ou
  rationale: Preserva a conjunção disjuntiva do texto grego, sem harmonizá-la com a fórmula litúrgica esperada.
- source_word: πίνῃ τὸ ποτήριον
  choice: beber o cálice
  rationale: Conserva a metonímia solene e tradicional do original, natural no contexto da Ceia.
- source_word: ἀναξίως
  choice: de maneira indigna
  rationale: Traduz o advérbio como descrição da maneira de comer ou beber, não do valor intrínseco da pessoa.
- source_word: ἔνοχος ἔσται
  choice: será culpado
  rationale: Comunica diretamente a ideia de culpa e responsabilidade expressa pela construção grega.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: com relação ao corpo e ao sangue do Senhor
  rationale: Representa o genitivo ligado a ἔνοχος sem definir em excesso sua nuance jurídica, preservando a gravidade e a ambiguidade da expressão.
theological_decisions:
- issue: Sentido de ἀναξίως na participação da Ceia
  choice: A advertência diz respeito a comer ou beber de maneira indigna.
  alternative: Entender que o texto qualifica o participante como uma pessoa indigna.
  rationale: ἀναξίως é advérbio e modifica os verbos; a tradução não deve transformar essa descrição do modo de participar em uma declaração sobre a dignidade intrínseca da pessoa.
- issue: Força de ἢ entre comer e beber
  choice: Manter “ou”, de modo que a advertência se aplique a qualquer uma das duas ações.
  alternative: Traduzir ou interpretar como “e”, tratando as ações somente como um par fixo.
  rationale: O original emprega uma conjunção disjuntiva explícita, que deve ser preservada apesar de expectativas litúrgicas posteriores.
- issue: Relação expressa pelo genitivo após ἔνοχος
  choice: “culpado com relação ao corpo e ao sangue do Senhor”
  alternative: “culpado do corpo e do sangue do Senhor”
  rationale: A formulação principal esclarece que se trata de responsabilidade referente ao corpo e ao sangue, mas a nota conserva a tradução mais literal e tradicional sem resolver além do necessário a nuance jurídica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Cálice” preserva a linguagem bíblica reconhecível sem soar arcaico. As notas distinguem a forma adverbial e registram a alternativa literal para o genitivo.
