  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: pt
  text: Pois, na hora de comer, cada um se adianta com a sua própria ceia[a]; assim, um passa fome, enquanto outro se embriaga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “come a sua própria refeição antes dos outros”; o verbo grego pode destacar tanto fazer algo antecipadamente como seguir em frente sem esperar pelos demais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um fica com fome, outro está bêbado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva a força distributiva e singular do grego, destacando a conduta individual de cada participante.
- source_word: γὰρ
  choice: pois
  rationale: Introduz naturalmente, em português, a explicação da repreensão feita no contexto anterior.
- source_word: τὸ ἴδιον δεῖπνον
  choice: a sua própria ceia
  rationale: “Ceia” corresponde a δεῖπνον e mantém a ligação verbal com a Ceia do Senhor no contexto; “sua própria” ressalta o caráter privado e egoísta da refeição.
- source_word: προλαμβάνει
  choice: se adianta com
  rationale: Expressa a ideia de tomar a iniciativa e proceder sem esperar os demais, sem eliminar a possível nuance de fazer algo antes deles.
- source_word: ἐν τῷ φαγεῖν
  choice: na hora de comer
  rationale: Reproduz de modo natural o valor temporal da construção grega com infinitivo, sem acrescentar uma circunstância estranha ao texto.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: um ... outro
  rationale: Mantém de maneira concisa o contraste correlativo entre participantes e seus resultados opostos.
- source_word: πεινᾷ
  choice: passa fome
  rationale: No contexto da refeição desigual, comunica não apenas a sensação de fome, mas o fato de alguém permanecer sem alimento; a leitura mais estritamente estativa é registrada em nota.
- source_word: μεθύει
  choice: se embriaga
  rationale: Transmite claramente a intoxicação alcoólica indicada pelo verbo, sem suavizá-la como simples excesso na comida ou bebida.
theological_decisions:
- issue: Referência distributiva singular com forma masculina
  choice: cada um ... a sua própria ceia
  alternative: cada pessoa ... a própria ceia
  rationale: A formulação conserva o singular distributivo e a forma masculina do texto grego, sendo também uma construção corrente e compreensível em português.
- issue: Natureza do abuso na Ceia do Senhor
  choice: outro se embriaga
  alternative: outro está bêbado
  rationale: O verbo grego indica embriaguez real; a tradução não atenua o contraste escandaloso entre quem fica sem comer e quem bebe em excesso, mas a nota preserva a possível leitura estativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Ceia” preserva a ressonância contextual da Ceia do Senhor; “se adianta” evita uma formulação excessivamente técnica e mantém a ambiguidade relevante do verbo grego.
