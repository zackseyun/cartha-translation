source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: pt
  text: Cada um, porém, examine a si mesmo e, assim, coma do pão e beba do cálice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: examine
  rationale: O verbo pede que a pessoa avalie ou ponha à prova a si mesma; “examine” é natural, claro e preserva o sentido deliberativo do imperativo.
- source_word: ἄνθρωπος
  choice: cada um
  rationale: Aqui ἄνθρωπος tem referência genérica a qualquer pessoa participante, não especificamente a um homem do sexo masculino. “Cada um” preserva a força individual do singular e combina naturalmente com “a si mesmo”.
- source_word: οὕτως
  choice: assim
  rationale: Mantém a ligação entre o autoexame e o ato subsequente de comer e beber, sem acrescentar uma condição não expressa.
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: do pão / do cálice
  rationale: 'A preposição ἐκ pode ser representada idiomaticamente por “de/do” nestas construções: comer do pão e beber do cálice.'
theological_decisions:
- issue: Relação entre o autoexame e a participação
  choice: “e, assim, coma... e beba”
  alternative: “e somente então coma... e beba”
  rationale: O grego καὶ οὕτως indica a maneira ou sequência apropriada, mas não explicita “somente” nem ordena abstinência; a tradução preserva essa tensão sem ampliá-la.
- issue: Referência genérica de ἄνθρωπος
  choice: “cada um”
  alternative: “o homem”
  rationale: No contexto, a exortação é dirigida genericamente aos participantes. A opção evita sugerir uma restrição masculina que o grego não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural no Brasil e inteligível internacionalmente. O paralelismo “coma... e beba” e os termos tradicionais “pão” e “cálice” foram preservados.
