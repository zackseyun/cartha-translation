  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: pt
  text: Portanto, quando vocês se reúnem no mesmo lugar, o que vocês comem não é a ceia do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não é para comer a ceia do Senhor”; também pode ser entendido como “vocês não estão comendo a ceia do Senhor”, ressaltando que a conduta deles impede que a refeição seja considerada como tal.'
    reason: Leitura alternativa da construção compacta οὐκ ἔστιν ... φαγεῖν.
lexical_decisions:
- source_word: συνερχομένων
  choice: quando vocês se reúnem
  rationale: O particípio no genitivo, ligado a ὑμῶν, forma uma expressão temporal. “Quando vocês se reúnem” é natural e mantém o sentido de reunião comunitária.
- source_word: οὖν
  choice: Portanto
  rationale: Indica uma conclusão decorrente da repreensão anterior a respeito das divisões na comunidade.
- source_word: ἐπὶ τὸ αὐτό
  choice: no mesmo lugar
  rationale: A expressão idiomática aponta para a reunião em um lugar comum. A formulação conserva a nuance espacial sem apenas repetir a ideia de reunir-se.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: o que vocês comem não é
  rationale: 'A construção grega é compacta e admite mais de uma formulação. No contexto, avalia a refeição dos coríntios: devido à maneira como agem, ela não pode ser devidamente caracterizada como a ceia do Senhor. A nota preserva uma tradução alternativa mais próxima da forma infinitiva.'
- source_word: κυριακὸν
  choice: do Senhor
  rationale: O adjetivo significa “pertencente ao Senhor”; a locução portuguesa expressa naturalmente essa relação.
- source_word: δεῖπνον
  choice: ceia
  rationale: Refere-se à refeição comunitária em questão. “Ceia” é corrente no contexto cristão e mantém a associação reconhecível da expressão, sem reduzir o termo a um rito definido pelo tradutor.
- source_word: κυριακὸν δεῖπνον
  choice: a ceia do Senhor
  rationale: É uma expressão clara e consagrada em português, correspondente ao adjetivo e ao substantivo gregos.
theological_decisions:
- issue: Se Paulo nega a possibilidade de comer a refeição ou afirma que a prática deles não pode ser considerada a ceia do Senhor
  choice: A conduta deles faz com que aquilo que comem não seja propriamente a ceia do Senhor.
  alternative: “Não é para comer a ceia do Senhor” ou “vocês não estão comendo a ceia do Senhor”.
  rationale: Os versículos seguintes censuram a maneira divisiva de realizar a refeição, não enunciam uma impossibilidade metafísica. O texto principal comunica a força avaliativa, enquanto a nota mantém visível a ambiguidade da construção grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A formulação evita arcaísmos e preserva, por meio da nota, a tensão interpretativa do grego.
