id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: pt
  text: Por essa razão, a mulher deve ter autoridade na cabeça[a], por causa dos anjos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “deve usar na cabeça um sinal de autoridade”. O texto grego diz “autoridade” e não inclui explicitamente as palavras “sinal” ou “cobertura”.'
    reason: alternative_reading
  - marker: b
    text: Ou “por causa dos mensageiros”, embora “anjos” seja o sentido mais provável aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Preserva de modo natural o nexo causal e inferencial com o argumento anterior.
- source_word: ὀφείλει
  choice: deve
  rationale: Expressa obrigação ou conveniência moral com clareza, sem transformar a frase em formulação jurídica.
- source_word: ἡ γυνὴ
  choice: a mulher
  rationale: Mantém o singular genérico e não restringe γυνή ao sentido de esposa, que o contexto não exige.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Traduz diretamente o substantivo grego, sem acrescentar 'sinal' ou 'cobertura', termos não expressos no original.
- source_word: ἔχειν
  choice: ter
  rationale: Corresponde ao sentido direto do infinitivo, evitando introduzir interpretativamente a ideia de vestir ou usar algo.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: sobre a cabeça
  rationale: Reproduz naturalmente a relação espacial da expressão grega e conserva sua abertura interpretativa.
- source_word: διὰ τοὺς ἀγγέλους
  choice: por causa dos anjos
  rationale: διά com acusativo indica aqui razão ou causa; 'anjos' é o sentido mais provável de ἀγγέλους no contexto.
theological_decisions:
- issue: Sentido de ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Manter 'ter autoridade sobre a cabeça'.
  alternative: Usar na cabeça um sinal de autoridade; ter uma cobertura na cabeça como sinal de autoridade.
  rationale: O grego contém 'autoridade', mas não contém palavras para 'sinal' ou 'cobertura'. A redação principal conserva a formulação difícil e a nota registra a interpretação comum sem apresentá-la como tradução explícita.
- issue: Referente de ἀγγέλους
  choice: anjos
  alternative: mensageiros
  rationale: Embora ἄγγελος possa designar um mensageiro, o plural sem qualificação é mais provavelmente referência a seres celestiais; não se adota uma teoria específica sobre a razão de serem mencionados.
- issue: Alcance de γυνή
  choice: mulher
  alternative: esposa
  rationale: O contexto trata de homem e mulher de modo representativo; traduzir por 'esposa' estreitaria desnecessariamente o alcance.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores segue sua ocorrência no texto. A formulação deliberadamente incomum 'ter autoridade sobre a cabeça' preserva a ambiguidade e a tensão do grego, esclarecidas sem resolução dogmática nas notas.
