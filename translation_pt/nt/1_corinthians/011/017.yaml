id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: pt
  text: Mas, ao dar esta orientação[a], não os elogio, porque vocês se reúnem não para o melhor, mas para o pior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao dar esta ordem”. O particípio grego pode transmitir a ideia de dar uma orientação, instrução ou ordem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: esta
  rationale: O demonstrativo neutro aponta para a orientação que Paulo passa a dar; em português, integra-se naturalmente à expressão «esta orientação».
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com contraste em relação ao elogio anterior, introduzindo agora uma repreensão.
- source_word: παραγγέλλων
  choice: ao dar esta orientação
  rationale: O particípio de παραγγέλλω pode indicar instruir, orientar ou ordenar. A formulação conserva o caráter autoritativo sem tornar o tom desnecessariamente severo.
- source_word: οὐκ ἐπαινῶ
  choice: não os elogio
  rationale: Traduz diretamente a ideia de não louvar ou aprovar e mantém o contraste com o elogio de 11:2.
- source_word: ὅτι
  choice: porque
  rationale: 'Expressa de modo claro a relação causal: Paulo explica por que não os elogia.'
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: não para o melhor
  rationale: Preserva a construção comparativa e a concisão do grego, indicando resultado ou efeito das reuniões.
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: mas para o pior
  rationale: Mantém o paralelismo antitético com «para o melhor» e não especifica um tipo de prejuízo que o texto não explicita aqui.
- source_word: συνέρχεσθε
  choice: vocês se reúnem
  rationale: Forma natural e clara em português para o ato de a comunidade se congregar.
theological_decisions:
- issue: Tom e autoridade de παραγγέλλων
  choice: orientação
  alternative: ordem
  rationale: O verbo admite força de ordem ou mandamento, mas também de instrução ou orientação autoritativa. «Orientação» comunica a diretiva apostólica sem resolver em favor do tom mais severo; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por «vocês» para a segunda pessoa do plural. A construção paralela «não para o melhor, mas para o pior» preserva a tensão e a concisão do original.
