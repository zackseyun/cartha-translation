source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: pt
  text: Pois vocês não têm casas para comer e beber? Ou desprezam a igreja de Deus e envergonham os que nada têm? O que devo dizer a vocês? Devo elogiá-los? Nisso não os elogio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pobres” ou “os que não têm comida”; literalmente, em grego, “os que não têm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: casas
  rationale: Refere-se aos espaços domésticos particulares, em contraste com a comunidade reunida; “casas” preserva essa oposição com clareza.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: onde comer e beber
  rationale: A construção indica finalidade. Em português, “casas onde comer e beber” expressa essa função de modo natural, sem perder o sentido.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: a igreja de Deus
  rationale: Uso paulino estabelecido para a comunidade reunida que pertence a Deus; não exige uma leitura institucional específica.
- source_word: καταφρονεῖτε
  choice: desprezam
  rationale: Preserva a força moral do verbo, que significa tratar como sem valor ou pouca importância.
- source_word: καταισχύνετε
  choice: envergonham
  rationale: Expressa diretamente a ação de causar vergonha, sem intensificá-la para “humilham”.
- source_word: τοὺς μὴ ἔχοντας
  choice: os que nada têm
  rationale: Reproduz de perto a expressão elíptica “os que não têm”, preservando sua abrangência; o contexto sugere falta de alimento ou recursos.
- source_word: τί εἴπω ὑμῖν;
  choice: Que direi a vocês?
  rationale: O subjuntivo deliberativo forma uma pergunta retórica; esta formulação é atual, concisa e mantém a perplexidade repreensiva.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Devo elogiá-los?
  rationale: Mantém a pergunta deliberativa e sua ironia, com expectativa de resposta negativa.
- source_word: ἐν τούτῳ
  choice: Nisso
  rationale: Retoma de forma natural e concisa a conduta que acaba de ser repreendida.
- source_word: οὐκ ἐπαινῶ
  choice: não os elogio
  rationale: Repete o mesmo campo lexical de ἐπαινέσω e preserva o efeito retórico do original.
theological_decisions:
- issue: Referente de τοὺς μὴ ἔχοντας no contexto da ceia do Senhor
  choice: os que nada têm
  alternative: os pobres; os que não têm comida
  rationale: O contexto aponta para membros materialmente desfavorecidos, provavelmente sem comida suficiente, mas o grego é elíptico e mais amplo. O texto principal preserva essa abertura, e a nota esclarece as leituras contextuais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e evita tanto arcaísmos como explicitações denominacionais. A sequência de perguntas retóricas e a repetição de “elogiar” foram preservadas.
