id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: pt
  text: Mas, se uma mulher usa cabelo comprido, isso é glória para ela, porque o cabelo lhe foi dado em lugar de uma cobertura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como cobertura”. A preposição grega pode expressar correspondência ou substituição; por si só, a frase não determina se Paulo quer dizer que o cabelo funciona como a cobertura ou que foi dado em relação a uma cobertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: uma mulher
  rationale: Embora γυνή possa significar “mulher” ou “esposa”, aqui a formulação tem caráter geral e não menciona explicitamente a relação conjugal.
- source_word: κομᾷ
  choice: usa cabelo comprido
  rationale: O verbo κομάω indica usar ou manter o cabelo comprido; esta formulação é natural e preserva o sentido, sem sugerir apenas a posse de cabelo.
- source_word: δόξα
  choice: glória
  rationale: Mantém a força retórica e a ligação lexical de δόξα, aqui entendida como aquilo que traz honra ou distinção.
- source_word: κόμη
  choice: cabelo
  rationale: κόμη designa o cabelo da cabeça, com possível nuance de cabelo crescido ou comprido; como essa nuance já aparece no verbo, “cabelo” evita repetição desnecessária.
- source_word: ἀντί
  choice: em lugar de
  rationale: Expressa de maneira direta o valor comum de substituição ou correspondência de ἀντί, sem decidir além do que a construção permite.
- source_word: περιβολαίου
  choice: uma cobertura
  rationale: περιβόλαιον é um termo geral para algo usado para cobrir ou envolver; “cobertura” evita a especificidade não exigida de “véu”.
- source_word: δέδοται
  choice: lhe foi dado
  rationale: Preserva a voz passiva e comunica em português natural o estado resultante expresso pelo perfeito grego.
theological_decisions:
- issue: Se o cabelo é identificado como a própria cobertura discutida no contexto ou se foi dado em correspondência a outra cobertura.
  choice: Traduzir ἀντὶ περιβολαίου como “em lugar de uma cobertura” e registrar a amplitude da preposição em nota.
  alternative: “como cobertura” ou “em correspondência a uma cobertura”
  rationale: A construção pode expressar substituição ou correspondência. A tradução mantém a força lexical mais direta, enquanto a nota preserva a ambiguidade relevante e evita resolver a controvérsia sobre uma cobertura adicional.
- issue: Se περιβόλαιον deve ser especificado como “véu”.
  choice: uma cobertura
  alternative: um véu; um manto
  rationale: O substantivo grego é mais amplo que “véu”; a escolha genérica não impõe uma conclusão cultural ou doutrinária que o termo isoladamente não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Usa cabelo comprido” soa mais natural e preciso que uma reprodução literal do verbo; “em lugar de” conserva a tensão interpretativa de ἀντί. O marcador [a] aparece imediatamente após a expressão a que se refere.
