source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: pt
  text: Se alguém estiver com fome, coma em casa, para que vocês não se reúnam para juízo.[a] Quanto às demais coisas, darei instruções quando eu chegar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “condenação”. O grego κρίμα pode significar “juízo” ou “condenação”; aqui, “juízo” se ajusta melhor ao contexto imediato, no qual Paulo fala da disciplina presente do Senhor, e não da condenação final (vv. 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: estiver com fome
  rationale: Expressa de modo natural em português a condição presente indicada pelo verbo grego, dentro da construção condicional.
- source_word: ἐν οἴκῳ
  choice: em casa
  rationale: Indica o ambiente doméstico em contraste com a reunião da comunidade e é a formulação corrente em português.
- source_word: ἐσθιέτω
  choice: coma
  rationale: Preserva a força do imperativo presente na terceira pessoa e concorda naturalmente com o indefinido singular “alguém”.
- source_word: εἰς κρίμα
  choice: para juízo
  rationale: Mantém o sentido judicial amplo de κρίμα e a ligação com a disciplina divina descrita no contexto imediato, sem especificar de forma excessiva uma condenação final.
- source_word: συνέρχησθε
  choice: vocês não se reúnam
  rationale: Reproduz o verbo usado repetidamente no contexto para a reunião da comunidade; “vocês” oferece clareza e ampla legibilidade brasileira.
- source_word: Τὰ δὲ λοιπὰ
  choice: Quanto às demais coisas
  rationale: Introduz naturalmente os assuntos restantes que Paulo deixa para tratar em sua visita.
- source_word: ὡς ἂν ἔλθω
  choice: quando eu chegar
  rationale: Comunica de modo idiomático a referência temporal futura à visita esperada de Paulo.
- source_word: διατάξομαι
  choice: darei instruções
  rationale: Expressa o ato de prescrever ou determinar como os assuntos práticos deverão ser conduzidos.
theological_decisions:
- issue: Sentido de κρίμα na advertência sobre a reunião para a Ceia do Senhor
  choice: juízo, entendido no contexto como juízo disciplinar divino sem limitar explicitamente o termo a isso
  alternative: condenação; sentença judicial em sentido mais amplo
  rationale: Os versículos 29–32 relacionam esse juízo à disciplina presente do Senhor e o distinguem da condenação com o mundo. “Juízo” preserva tanto essa ligação contextual quanto a amplitude lexical do termo.
- issue: Indefinido singular τις com imperativo na terceira pessoa
  choice: “alguém ... coma”
  alternative: explicitar um pronome masculino ou converter a construção ao plural
  rationale: A sintaxe portuguesa permite conservar o singular indefinido e a força imperativa sem introduzir gênero não expresso lexicalmente pelo pronome grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A segunda pessoa do plural foi vertida por “vocês”, e a transição final foi formulada de maneira natural sem perder o caráter diretivo do verbo grego.
