  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: a condição relativa à fome, o imperativo singular para comer em casa, a finalidade de evitar reunir-se para juízo e a promessa de Paulo de tratar dos assuntos restantes em sua chegada. A alternância entre o singular indefinido (“alguém ... coma”) e o plural dirigido à comunidade (“vocês ... se reúnam”) corresponde à sintaxe do original.'
