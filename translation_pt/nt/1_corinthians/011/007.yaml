reference: 1 Corinthians 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: pt
  text: Pois o homem[a] não deve cobrir a cabeça[b], visto que é imagem e glória de Deus; mas a mulher é glória do homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o marido” e “a esposa” em lugar de “o homem” e “a mulher” ao longo do versículo; os termos gregos ἀνήρ e γυνή podem ter qualquer um desses sentidos, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “cobrir a cabeça com um véu”; o grego diz, de modo mais geral, “cobrir a cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: o homem
  rationale: O substantivo é usado aqui em sentido representativo e genérico, no contraste entre homem e mulher. “Marido” é lexicalmente possível, mas tornaria o âmbito necessariamente conjugal.
- source_word: ὀφείλει
  choice: deve
  rationale: Expressa de modo natural a obrigação normativa indicada pelo verbo, sem a intensificar além do necessário.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: cobrir a cabeça
  rationale: Mantém a formulação geral do grego sem especificar que tipo de cobertura estaria em vista.
- source_word: εἰκὼν
  choice: imagem
  rationale: É o equivalente corrente e preserva a provável evocação da linguagem da criação em Gênesis.
- source_word: δόξα
  choice: glória
  rationale: Preserva, nas duas ocorrências, a amplitude e o peso teológico do termo, bem como o paralelismo da frase.
- source_word: θεοῦ
  choice: de Deus
  rationale: Conserva diretamente a relação genitiva, sem explicação adicional.
- source_word: ὑπάρχων
  choice: visto que é
  rationale: Torna explícito, em português idiomático, o valor causal do particípio em relação à afirmação anterior.
- source_word: ἡ γυνὴ
  choice: a mulher
  rationale: Mantém o contraste representativo entre os sexos. “A esposa” é possível lexicalmente, mas restringiria a afirmação ao casamento.
- source_word: ἀνδρός
  choice: do homem
  rationale: Corresponde ao sentido genérico adotado para ἀνήρ e preserva a formulação paralela e concisa do grego.
theological_decisions:
- issue: Se ἀνήρ e γυνή devem ser traduzidos como “homem/mulher” ou “marido/esposa”
  choice: homem/mulher
  alternative: marido/esposa
  rationale: O contexto imediato relaciona o contraste entre homem e mulher à cobertura da cabeça e à teologia da criação, favorecendo o sentido mais amplo. A nota preserva a possibilidade lexical da leitura conjugal.
- issue: Como traduzir a afirmação assimétrica de que a mulher é δόξα do homem
  choice: a mulher é glória do homem
  alternative: a mulher reflete a glória do homem / a mulher é honra do homem
  rationale: A tradução direta preserva tanto a força de ἐστιν quanto a tensão teológica do texto. “Reflete” acrescentaria uma interpretação, e “honra” estreitaria o campo semântico de δόξα.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o contraste do grego foram preservados sem suavizar a afirmação teológica. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
