  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: pt
  text: Por essa razão, há entre vocês muitos fracos e doentes, e muitos já adormeceram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “já morreram”. Paulo provavelmente emprega “adormeceram” como metáfora cristã habitual para a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Preserva a relação causal explícita com o abuso da Ceia do Senhor mencionado no contexto anterior e soa natural em português.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica uma situação existente no meio da comunidade de Corinto, e não uma condição interna aos indivíduos.
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz de modo direto e conciso o adjetivo quantitativo usado substantivamente.
- source_word: ἀσθενεῖς
  choice: fracos
  rationale: Mantém o sentido amplo de debilidade e preserva a distinção lexical em relação ao termo mais específico para doença que vem em seguida.
- source_word: ἄρρωστοι
  choice: doentes
  rationale: Expressa enfermidade física em linguagem atual e acessível, distinguindo-a de 'fracos'.
- source_word: κοιμῶνται
  choice: já adormeceu
  rationale: Preserva a metáfora de dormir usada para a morte. O advérbio 'já' torna natural em português a leitura resultativa sugerida pelo contexto, sem eliminar a imagem do original.
- source_word: ἱκανοί
  choice: um número considerável
  rationale: Comunica que se trata de uma quantidade expressiva e evita repetir mecanicamente 'muitos'.
theological_decisions:
- issue: Se κοιμῶνται deve ser traduzido literalmente como sono ou explicitado como morte
  choice: Preservar no texto a metáfora 'já adormeceu'
  alternative: Traduzir diretamente como 'morreu' ou entender como sono literal
  rationale: A progressão entre fraqueza, doença e sono, no contexto do juízo divino sobre a comunidade, aponta fortemente para a morte. Manter a metáfora conserva o tom e a tensão teológica do texto sem tornar explícito no corpo do versículo aquilo que Paulo expressa figuradamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção no singular, 'um número considerável já adormeceu', concorda com o núcleo coletivo 'número' e transmite o valor quantitativo de ἱκανοί.
