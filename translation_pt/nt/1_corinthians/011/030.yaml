  naturalness: «Por essa razão» e «entre vocês» são naturais no registro pretendido. «Muitos já adormeceram» é mais fluente e claro do que atribuir «adormeceu» a «um número considerável».
  terminology: «Fracos», «doentes» e «adormeceram» preservam tanto a distinção entre ἀσθενεῖς e ἄρρωστοι como a metáfora de κοιμῶνται, sem impor uma leitura doutrinária. A nota explicita corretamente o referente metafórico e deve usar o plural, em concordância com os indivíduos em questão.
