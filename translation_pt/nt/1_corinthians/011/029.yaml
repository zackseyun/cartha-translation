  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: pt
  text: Pois quem come e bebe come e bebe juízo sobre si mesmo, por não discernir o corpo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o corpo do Senhor” em vez de “o corpo”.
    reason: textual_variant
  - marker: b
    text: Ou “distinguir o corpo”; isto pode se referir a reconhecer o significado da Ceia do Senhor, a comunidade reunida dos fiéis, ou ambos.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: juízo
  rationale: Expressa um veredito ou julgamento e, à luz dos versículos seguintes, não implica necessariamente condenação final.
- source_word: ἑαυτῷ
  choice: sobre si mesmo
  rationale: Comunica com naturalidade que a própria pessoa incorre no juízo, preservando o sentido adverso do dativo reflexivo.
- source_word: διακρίνων
  choice: discernir
  rationale: Mantém a ideia de reconhecer, avaliar ou fazer a devida distinção sem definir de modo excessivamente estreito o sentido do verbo.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Reproduz a forma concisa do texto grego e preserva a possível referência ao corpo de Cristo na ceia, ao corpo reunido dos fiéis, ou a ambos.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: quem come e bebe
  rationale: Forma genérica, natural e inclusiva em português para o particípio substantivado grego.
- source_word: μὴ διακρίνων
  choice: por não discernir
  rationale: Expressa em português corrente a relação circunstancial do particípio com o juízo incorrido, sem alterar seu conteúdo básico.
theological_decisions:
- issue: Sentido de “o corpo” no contexto da Ceia do Senhor
  choice: Manter “o corpo” sem especificação
  alternative: “o corpo do Senhor” ou “o corpo dos fiéis”
  rationale: O texto grego adotado diz apenas “o corpo”. O contexto permite relação tanto com o corpo de Cristo na ceia quanto com a comunidade como corpo; a tradução não deve resolver essa tensão.
- issue: Força de κρίμα
  choice: juízo
  alternative: condenação
  rationale: O contexto posterior distingue a disciplina divina da condenação com o mundo; “juízo” preserva essa amplitude e evita sugerir necessariamente perdição final.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Quem come e bebe” evita rigidez desnecessária; “por não discernir” mantém a relação lógica do particípio, e “o corpo” preserva deliberadamente a ambiguidade do original.
