source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: pt
  text: Mas, se alguém parece ser contencioso[a], nós não temos tal costume[b], nem as igrejas de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ser briguento”, “ser dado a contendas” ou “gostar de contendas”.'
    reason: lexical_alternative
  - marker: b
    text: “Tal costume” pode se referir tanto à prática de ser contencioso quanto à prática discutida nos versículos anteriores.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: parece
  rationale: Preserva de modo natural a construção grega com infinitivo e mantém em aberto se Paulo descreve uma aparência, uma reputação ou uma disposição percebida.
- source_word: φιλόνεικος
  choice: gostar de discussões
  rationale: Expressa em português corrente a inclinação para contendas ou disputas, sem reduzir o sentido à simples apresentação de argumentos.
- source_word: τοιαύτην
  choice: tal
  rationale: Mantém a referência retrospectiva genérica do demonstrativo sem determinar de forma indevida a qual prática ele se refere.
- source_word: συνήθειαν
  choice: costume
  rationale: Comunica uma prática habitual ou estabelecida e conserva a amplitude semântica necessária no contexto.
- source_word: οὐκ ἔχομεν
  choice: não temos
  rationale: Reproduz diretamente a expressão verbal, evitando acrescentar ideias como proibição ou rejeição formal.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: as igrejas de Deus
  rationale: É uma formulação natural e digna que preserva o genitivo e a referência às comunidades pertencentes a Deus.
theological_decisions:
- issue: Referente de “tal costume”
  choice: A tradução mantém a expressão ampla “tal costume”, sem identificar explicitamente o referente.
  alternative: Entender a expressão como o costume de promover contendas ou como a prática discutida nos versículos anteriores.
  rationale: O grego τοιαύτην συνήθειαν é conciso e permite mais de uma ligação contextual. Especificar o referente no texto principal resolveria uma ambiguidade genuína que deve ser preservada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é direto e digno. “Gostar de discussões” é mais acessível que “ser contencioso”, enquanto a nota registra alternativas mais formais. A ambiguidade contextual de “tal costume” foi preservada.
