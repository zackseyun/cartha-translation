id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: pt
  text: Pois, de fato, o homem não foi criado para a mulher, mas a mulher para o homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da mulher” e “por causa do homem”. A preposição grega pode indicar causa ou finalidade; aqui foi traduzida por “para” em vista do argumento baseado na criação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: “Pois” preserva a função explicativa de γάρ, ligando o versículo ao argumento anterior, enquanto “de fato” transmite a leve ênfase de καί de modo natural em português.
- source_word: ἐκτίσθη
  choice: foi criado
  rationale: Traduz diretamente o aoristo passivo de κτίζω e corresponde à referência de Paulo ao relato da criação.
- source_word: ἀνὴρ / γυνὴ
  choice: o homem / a mulher
  rationale: Neste apelo ao relato de Gênesis, os termos têm referência representativa e genérica aos sexos, não necessariamente o sentido mais restrito de “marido” e “esposa”.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: para a mulher / para o homem
  rationale: Com acusativo, διά pode indicar causa, finalidade ou consideração. “Para” preserva aqui a orientação de finalidade ou benefício sem definir a nuance além do que o contexto permite; a possível leitura causal é registrada em nota.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa com clareza o contraste direto entre as duas orações.
theological_decisions:
- issue: Se ἀνήρ e γυνή devem ser traduzidos como “homem/mulher” ou “marido/esposa”
  choice: homem/mulher
  alternative: marido/esposa
  rationale: O verbo “foi criado” ancora a afirmação no relato da criação. A tradução mais ampla preserva esse alcance sem limitar o texto antecipadamente à relação conjugal.
- issue: Se διά + acusativo deve ser entendido como finalidade ou causa
  choice: para
  alternative: por causa de
  rationale: O argumento orientado à criação favorece a ideia de finalidade ou consideração, mas a construção grega também admite valor causal. A tradução principal mantém “para”, e a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O paralelismo conciso do grego foi preservado.
