  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: pt
  text: 'Julguem vocês mesmos: é apropriado que uma mulher ore a Deus com a cabeça descoberta?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma esposa”, caso γυνή seja entendido no sentido marital no contexto mais amplo desta passagem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: vocês mesmos
  rationale: A expressão reforça o apelo ao julgamento dos próprios coríntios. Em português, “vocês mesmos” transmite naturalmente essa ênfase reflexiva.
- source_word: κρίνατε
  choice: Julguem
  rationale: O imperativo aoristo pede uma avaliação direta. “Julguem” preserva a força do apelo retórico de Paulo.
- source_word: πρέπον ἐστὶν
  choice: é apropriado
  rationale: A construção pergunta se a prática é conveniente ou condizente. “É apropriado” é claro, atual e mantém o sentido de decoro.
- source_word: γυναῖκα
  choice: uma mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. Como o versículo formula a pergunta de modo geral e não menciona explicitamente um marido, “uma mulher” é a opção principal mais segura; a possibilidade marital é preservada em nota.
- source_word: ἀκατακάλυπτον
  choice: com a cabeça descoberta
  rationale: O adjetivo significa “descoberta/sem cobertura”. O contexto imediato trata da cobertura da cabeça, por isso a explicitação produz português natural sem alterar o referente contextual.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo com προσεύχομαι indica aquele a quem a oração é dirigida. “Orar a Deus” é a formulação portuguesa direta e idiomática.
- source_word: προσεύχεσθαι
  choice: ore
  rationale: O infinitivo significa “orar”. Na estrutura interrogativa portuguesa, a oração finita com “que” comunica de maneira natural a relação sintática com “é apropriado”.
theological_decisions:
- issue: Sentido de γυνή na discussão sobre a cobertura da cabeça
  choice: uma mulher
  alternative: uma esposa
  rationale: O versículo não menciona explicitamente um marido e apresenta a pergunta em termos gerais. A tradução principal evita impor um sentido marital mais restrito, enquanto a nota preserva essa possibilidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Julguem vocês mesmos” mantém a interpelação enfática; “é apropriado” evita tanto formalismo excessivo quanto coloquialismo.
