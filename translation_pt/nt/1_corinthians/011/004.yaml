id: 1CO.11.4
reference: 1 Corinthians 11:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: pt
  text: Todo homem que ora ou profetiza com algo sobre a cabeça desonra a sua cabeça[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “com a cabeça coberta”. O grego diz literalmente “tendo algo sobre ou descendo da cabeça” e não especifica qual era a cobertura.
    reason: lexical_alternative
  - marker: b
    text: “A sua cabeça” pode referir-se literalmente à cabeça do próprio homem e, ao mesmo tempo, evocar o uso relacional de “cabeça” no contexto próximo.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Todo homem
  rationale: ἀνήρ pode significar “homem” ou “marido”, conforme o contexto. Aqui, a formulação genérica e o paralelo com “toda mulher” no versículo seguinte favorecem “todo homem”, sem excluir possíveis implicações conjugais no contexto mais amplo.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: que ora ou profetiza
  rationale: Os particípios presentes descrevem o homem enquanto participa dessas atividades. A oração relativa é natural em português e mantém os dois atos coordenados.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: com algo sobre a cabeça
  rationale: A expressão grega significa literalmente ter algo sobre ou descendo da cabeça, mas não identifica o objeto. A tradução evita especificar indevidamente um véu ou outro tipo exato de cobertura.
- source_word: καταισχύνει
  choice: desonra
  rationale: O verbo expressa vergonha ou desonra. “Desonra” é claro, atual e adequado à dinâmica de honra e vergonha da passagem.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: a sua cabeça
  rationale: A expressão pode indicar literalmente a cabeça do homem e também evocar o uso relacional de “cabeça” no contexto. A tradução mantém essa ambiguidade.
theological_decisions:
- issue: Se κεφαλή na oração final deve ser explicitada como cabeça física ou como cabeça em sentido relacional
  choice: Manter a ambiguidade com “a sua cabeça”
  alternative: “a própria cabeça” ou “aquele que é a sua cabeça”
  rationale: A redação de Paulo permite uma sobreposição retórica entre a cabeça física e o uso relacional ou teológico de “cabeça” no contexto próximo; explicitar apenas um sentido resolveria uma tensão presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção preserva tanto a indefinição da cobertura quanto o possível duplo sentido de “cabeça”.
