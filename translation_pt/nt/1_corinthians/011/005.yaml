language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: pt
  text: Mas toda mulher[a] que ora ou profetiza com a cabeça descoberta[b] desonra a sua cabeça[a], pois isso é uma só e a mesma coisa que estar com a cabeça rapada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «toda esposa que ora ou profetiza [...] desonra o marido, sua cabeça». A palavra grega pode significar «mulher» ou «esposa», e «cabeça» pode ser entendida literalmente ou em sentido metafórico à luz do contexto.'
    reason: alternative_reading
  - marker: b
    text: «Descoberta» não especifica por si só o tipo exato de cobertura. Há diferentes entendimentos sobre se Paulo se refere especificamente a um véu ou, de modo mais geral, à cabeça sem cobertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mulher
  rationale: Pode significar «mulher» ou «esposa». Aqui, «toda mulher que ora ou profetiza» soa mais naturalmente como referência genérica, sem restringir o texto às casadas; a alternativa «esposa» fica registrada em nota.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: que ora ou profetiza
  rationale: Os particípios presentes descrevem a mulher no exercício dessas ações. A oração relativa é natural em português e conserva o sentido verbal.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: com a cabeça descoberta
  rationale: Expressa a circunstância em que ela ora ou profetiza, sem decidir se a cobertura seria especificamente um véu, o cabelo ou outra coisa.
- source_word: καταισχύνει
  choice: desonra
  rationale: Transmite a ideia de causar vergonha ou desonra no contexto social, com linguagem clara e digna.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: a sua cabeça
  rationale: Mantém a formulação literal e a possível ambiguidade entre a cabeça física da mulher e «cabeça» em sentido relacional ou metafórico.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: pois isso é uma só e a mesma coisa
  rationale: Reproduz a ênfase da expressão grega de identidade ou equivalência.
- source_word: τῇ ἐξυρημένῃ
  choice: ter a cabeça rapada
  rationale: Comunica naturalmente em português o estado resultante indicado pelo particípio perfeito; a explicitação de «cabeça» torna a comparação clara sem acrescentar uma interpretação nova.
theological_decisions:
- issue: Sentido da segunda ocorrência de «cabeça» em «desonra a sua cabeça»
  choice: Conservar «a sua cabeça» sem definir se é física ou metafórica.
  alternative: Entender como a cabeça física da mulher ou como sua cabeça relacional, isto é, o marido/homem no quadro do argumento.
  rationale: A redação grega permite o sentido literal, enquanto o contexto anterior levanta a possibilidade metafórica. A tradução preserva essa tensão interpretativa.
- issue: Natureza da cobertura
  choice: Usar genericamente «descoberta».
  alternative: Especificar «sem véu» ou entender a referência como relativa ao cabelo.
  rationale: O adjetivo indica ausência de cobertura, mas não identifica por si só qual seria essa cobertura.
- issue: Sentido de γυνή
  choice: Traduzir por «mulher».
  alternative: Traduzir por «esposa».
  rationale: O termo admite ambos os sentidos, mas a construção imediata favorece a referência genérica; a alternativa conjugal permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi ajustada para que [b] acompanhe «descoberta» e [a] acompanhe a ambiguidade de «mulher/esposa» e «cabeça». Evitou-se especificar «véu» no texto principal.
