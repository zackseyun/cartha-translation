  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: pt
  text: Portanto, meus irmãos[a], quando vocês se reunirem para comer, esperem uns pelos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e irmãs”; o grego diz “irmãos” e frequentemente usa a forma masculina para se dirigir a uma comunidade composta de homens e mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Conjunção inferencial que apresenta a conclusão prática da correção anterior sobre os abusos na ceia do Senhor. “Portanto” preserva com naturalidade a força lógica do grego.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Vocativo plural com pronome possessivo, literalmente “meus irmãos”. Mantém-se a forma masculina do texto grego, esclarecendo em nota seu frequente uso representativo para toda a comunidade.
- source_word: συνερχόμενοι
  choice: quando vocês se reunirem
  rationale: Particípio presente empregado adverbialmente com o imperativo, indicando a ocasião em que a ordem se aplica. A oração temporal é natural em português e preserva a linguagem de reunião comunitária do capítulo.
- source_word: εἰς τὸ φαγεῖν
  choice: para comer
  rationale: Preposição com infinitivo articular que expressa propósito. “Para comer” transmite o sentido de modo conciso, sem especificar além do texto a natureza da refeição.
- source_word: ἀλλήλους
  choice: uns pelos outros
  rationale: Pronome recíproco no acusativo, objeto do imperativo. “Uns pelos outros” é uma formulação portuguesa clara e idiomática neste contexto.
- source_word: ἐκδέχεσθε
  choice: esperem
  rationale: Embora o verbo também possa significar receber ou acolher, o contexto imediato — alguns comendo antes dos demais — favorece o sentido de esperar antes de iniciar a refeição.
theological_decisions:
- issue: Uso representativo do masculino em ἀδελφοί
  choice: Manter “irmãos” no texto principal e esclarecer em nota que a palavra pode abranger irmãos e irmãs.
  alternative: Traduzir diretamente como “irmãos e irmãs”.
  rationale: O vocativo grego está no masculino plural, mas frequentemente se dirige à congregação inteira, provavelmente incluindo mulheres. A tradução conserva a forma explícita da fonte sem ocultar seu provável alcance inclusivo.
- issue: Sentido contextual de ἐκδέχεσθε
  choice: “esperem”, entendendo a ordem como esperar pelos demais antes de comer.
  alternative: “acolham” ou “recebam”.
  rationale: O campo semântico admite recepção ou acolhimento, mas a censura de que uns se antecipavam e comiam enquanto outros ficavam com fome (v. 21) torna “esperem” a correção prática mais provável, sem acrescentar uma interpretação sacramental específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O pronome “vocês” torna explícito o plural já presente nas formas verbais gregas; “se reunirem” e “esperem uns pelos outros” mantêm o tom pastoral e comunitário.
