id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: pt
  text: Pois, em primeiro lugar, quando vocês se reúnem como igreja[a], ouço dizer que há divisões entre vocês, e em parte acredito nisso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em assembleia” ou “na congregação”; o grego se refere à igreja reunida, não especificamente a um edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: em primeiro lugar
  rationale: Preserva a função discursiva da expressão, que introduz o primeiro ponto, mesmo sem um par formal μέν...δέ.
- source_word: συνερχομένων ὑμῶν
  choice: quando vocês se reúnem
  rationale: Traduz naturalmente o genitivo absoluto com valor temporal e mantém a linguagem recorrente do capítulo para a reunião comunitária.
- source_word: ἐν ἐκκλησίᾳ
  choice: como igreja
  rationale: Neste contexto, refere-se à congregação reunida, não a um edifício; a formulação portuguesa expressa com clareza o caráter comunitário da reunião.
- source_word: ἀκούω
  choice: ouço dizer
  rationale: Comunica de modo idiomático que Paulo recebeu essa informação por relatos, sem alterar o valor do presente grego.
- source_word: σχίσματα
  choice: divisões
  rationale: Abrange rupturas internas sem sugerir necessariamente facções formalmente organizadas.
- source_word: ὑπάρχειν
  choice: há
  rationale: Expressa de forma concisa e natural a existência das divisões mencionadas no relato.
- source_word: καὶ μέρος τι πιστεύω
  choice: e em parte acredito nisso
  rationale: Preserva a aceitação parcial ou cautelosa do relato e explicita apenas o objeto já implícito no contexto.
theological_decisions:
- issue: Sentido de ἐκκλησία no contexto
  choice: a congregação reunida (‘como igreja’), não um edifício
  alternative: na assembleia; na igreja
  rationale: O contexto trata da reunião dos coríntios para a vida comunitária e a Ceia do Senhor. A tradução evita associar o termo primariamente a um local físico, sem reduzir seu sentido eclesial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Vocês’ oferece clareza internacional e naturalidade no Brasil; ‘como igreja’ evita a leitura arquitetônica de ‘na igreja’.
