  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: pt
  text: Pois o homem não procede da mulher,[a] mas a mulher, do homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o marido não procede da esposa, mas a esposa, do marido”. Os termos gregos podem significar tanto “homem/mulher” como “marido/esposa”; aqui se prefere o sentido mais amplo, relacionado à criação.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e mantém de modo natural a ligação argumentativa.
- source_word: ἀνὴρ / ἀνδρός
  choice: homem / do homem
  rationale: No argumento baseado na criação, o par com γυνή aponta principalmente para homem e mulher, e não apenas para marido e esposa.
- source_word: ἐκ / ἐξ
  choice: procede da / do
  rationale: As preposições indicam fonte ou origem. “Procede de” expressa isso com clareza e naturalidade em português.
- source_word: γυναικός / γυνὴ
  choice: mulher / a mulher
  rationale: O contexto da criação favorece o sentido amplo de mulher, em contraste com homem, sem restringir a referência à esposa.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca diretamente o contraste forte entre as duas orações.
- source_word: ἐστιν
  choice: procede
  rationale: Embora seja formalmente o verbo “ser”, em combinação com ἐκ seu sentido relacional de origem é comunicado de modo mais natural por “procede”.
theological_decisions:
- issue: Se ἀνήρ/γυνή deve ser traduzido como “homem/mulher” ou “marido/esposa”
  choice: homem/mulher
  alternative: marido/esposa
  rationale: A referência à origem na narrativa da criação favorece o sentido mais amplo. A alternativa conjugal permanece lexicalmente possível e é registrada em nota, sem reduzir a ambiguidade do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse de “procede” na segunda oração evita repetição sem perder o paralelismo.
