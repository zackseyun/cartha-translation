id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: pt
  text: 'Do mesmo modo, depois da ceia, tomou também o cálice e disse: “Este cálice é a nova aliança[a] no meu sangue. Continuem fazendo isto, sempre que beberem dele[b], em memória de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o novo testamento”. A palavra grega pode significar “aliança” ou “testamento”, mas “aliança” se ajusta melhor ao pano de fundo bíblico desta passagem.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “todas as vezes que beberem”. A expressão grega indica ocasiões repetidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Do mesmo modo... também
  rationale: Preserva tanto a correspondência com a ação sobre o pão quanto a força aditiva de καί, em português natural.
- source_word: τὸ ποτήριον
  choice: o cálice
  rationale: No contexto da ceia, “cálice” é claro e corrente em português bíblico, sem exigir uma forma litúrgica específica do recipiente.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: depois da ceia
  rationale: A construção temporal indica que a ação ocorreu depois de comer; “depois da ceia” é conciso e adequado ao contexto.
- source_word: λέγων
  choice: tomou também o cálice e disse
  rationale: O grego traz literalmente “dizendo” numa construção elíptica que retoma a ação do versículo anterior. “Tomou” explicita em português essa ação implícita e “disse” transmite naturalmente o particípio.
- source_word: ἡ καινὴ διαθήκη
  choice: a nova aliança
  rationale: “Aliança” corresponde ao pano de fundo bíblico de διαθήκη e evita o sentido moderno predominante de “testamento” como disposição de última vontade.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: no meu sangue
  rationale: Mantém de perto a preposição e a formulação sacrificial e pactual, sem definir além do texto como o sangue se relaciona com a aliança.
- source_word: τοῦτο ποιεῖτε
  choice: Continuem fazendo isto
  rationale: O imperativo presente, junto da oração seguinte, favorece uma prática recorrente; a formulação torna essa continuidade clara em português.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: sempre que beberem dele
  rationale: Expressa ocasiões repetidas e contingentes. “Dele” retoma naturalmente o cálice como o recipiente do qual se bebe, embora o objeto esteja implícito no grego.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: em memória de mim
  rationale: Comunica o ato de lembrar e comemorar Jesus sem reduzir a expressão a uma explicação meramente mental ou simbólica.
theological_decisions:
- issue: Sentido de διαθήκη no contexto da instituição da Ceia
  choice: aliança
  alternative: testamento
  rationale: A linguagem do sangue e o pano de fundo veterotestamentário favorecem “aliança”. A alternativa lexical é registrada em nota sem substituir a leitura contextual mais forte.
- issue: Relação entre o cálice, a nova aliança e o sangue
  choice: “Este cálice é a nova aliança no meu sangue”, preservando a identificação direta
  alternative: “Este cálice representa a nova aliança estabelecida pelo meu sangue”
  rationale: O grego não explica a identificação nem resolve debates posteriores sobre presença sacramental, representação ou modo de instituição. A tradução conserva a tensão do enunciado.
- issue: Aspecto do mandamento τοῦτο ποιεῖτε
  choice: Continuem fazendo isto
  alternative: Façam isto
  rationale: A forma escolhida evidencia a prática reiterada apoiada pelo imperativo presente e por “sempre que”, sem determinar frequência ritual específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cálice”, “aliança” e “em memória de mim” preservam o registro bíblico sem arcaísmo excessivo. A elipse grega foi completada com “tomou”, retomando a ação paralela do contexto imediato.
