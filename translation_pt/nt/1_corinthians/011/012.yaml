reference: 1 Corinthians 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: pt
  text: Pois, assim como a mulher procede do homem[a], também o homem procede por meio da mulher; mas todas as coisas procedem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esposa” e “marido”, se o contexto for entendido mais estritamente como relação conjugal, e não como relação geral entre mulher e homem.
    reason: γυνή e ἀνήρ podem significar, conforme o contexto, “mulher/homem” ou “esposa/marido”.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de γάρ quanto a estrutura comparativa introduzida por ὥσπερ, em português natural.
- source_word: ἡ γυνή
  choice: a mulher
  rationale: γυνή pode significar “mulher” ou “esposa”; aqui, a referência à criação e ao nascimento favorece o sentido genérico “mulher”.
- source_word: ἐκ τοῦ ἀνδρός
  choice: veio do homem
  rationale: ἐκ expressa fonte ou origem. O verbo “veio”, recuperado naturalmente em português, torna a frase completa e mantém a alusão à origem da mulher a partir do homem.
- source_word: ὁ ἀνήρ
  choice: o homem
  rationale: ἀνήρ pode significar “homem” ou “marido”; o paralelismo geral com γυνή favorece “homem”.
- source_word: διὰ τῆς γυναικός
  choice: por meio da mulher
  rationale: διά com genitivo indica meio ou agência. “Por meio da mulher” comunica o nascimento do homem sem confundir essa relação com a origem expressa antes por ἐκ.
- source_word: τὰ δὲ πάντα
  choice: mas todas as coisas
  rationale: δέ introduz uma transição levemente contrastiva para a afirmação culminante sobre a fonte divina de tudo.
- source_word: ἐκ τοῦ θεοῦ
  choice: vêm de Deus
  rationale: ἐκ indica fonte ou origem; “vêm de Deus” é idiomático e mantém Deus como a origem última de todas as coisas.
theological_decisions:
- issue: Sentido de γυνή e ἀνήρ
  choice: “mulher” e “homem” em sentido genérico
  alternative: “esposa” e “marido”
  rationale: Embora os termos possam designar cônjuges, a combinação da alusão à criação com o nascimento humano amplia a declaração para além da relação conjugal. A alternativa legítima é registrada em nota.
- issue: Relação entre as origens da mulher e do homem
  choice: preservar a distinção entre ἐκ (“de”) e διά (“por meio de”)
  alternative: traduzir ambas as preposições como “de”
  rationale: A distinção apresenta a mulher como proveniente do homem na criação e o homem como vindo ao mundo por meio da mulher, preservando a reciprocidade e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “vem/vêm” explicita os verbos subentendidos no grego e conserva o paralelismo. “Por meio da” foi preferido a “através da” por expressar meio ou agência sem possível ambiguidade espacial.
