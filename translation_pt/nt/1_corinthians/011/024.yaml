  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: pt
  text: 'E, depois de dar graças, partiu o pão e disse: “Isto é o meu corpo, que é para vocês[a][b]. Continuem fazendo isto em memória de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que é por vocês”; também pode ser traduzido como “que é em favor de vocês” ou “que é para o benefício de vocês”.
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos acrescentam “partido” depois de “para vocês”: “Isto é o meu corpo, partido para vocês”.'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: depois de dar graças
  rationale: O particípio aoristo indica uma ação anterior à de partir o pão; esta formulação é natural em português e conserva a sequência.
- source_word: ἔκλασεν
  choice: partiu o pão
  rationale: O verbo significa ‘partiu’; ‘o pão’ explicita em português o objeto recuperado do contexto imediato.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Isto é o meu corpo
  rationale: Mantém diretamente a construção copulativa grega, sem substituí-la por uma interpretação como ‘representa’.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: que é dado por vocês
  rationale: ‘Por vocês’ expressa o sentido benefactivo ou representativo de ὑπέρ. O verbo ‘dado’ é uma elipse natural em português, mas por não estar expresso no grego é assinalado em nota.
- source_word: τοῦτο ποιεῖτε
  choice: Continuem fazendo isto
  rationale: O imperativo presente, neste contexto de instituição, favorece uma prática continuada ou repetida.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: em memória de mim
  rationale: Expressa de modo claro e digno o ato de recordar ou comemorar Jesus, sem reduzir a frase a uma simples atividade mental.
theological_decisions:
- issue: Sentido de “Isto é o meu corpo” no contexto da Ceia
  choice: 'Manter a afirmação direta: “Isto é o meu corpo”'
  alternative: “Isto representa o meu corpo” ou uma formulação que defina o modo da presença de Cristo
  rationale: A construção grega não resolve debates posteriores entre leituras sacramentais e simbólicas; a tradução preserva essa tensão.
- issue: Força de ὑπὲρ ὑμῶν
  choice: “por vocês”, com “dado” assinalado como palavra suprida
  alternative: “em favor de vocês” ou “em benefício de vocês”
  rationale: A expressão conserva o benefício e a dimensão representativa sem impor uma teoria técnica da expiação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” traduz o plural ὑμῶν. A formulação mantém a conexão com o versículo anterior por meio do “e” inicial e preserva a ambiguidade teológica central.
