  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: pt
  text: No entanto, no Senhor, a mulher[a] não está à parte do homem, nem o homem à parte da mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a esposa não está à parte do marido, nem o marido à parte da esposa”. Os termos gregos podem significar tanto “mulher/homem” como “esposa/marido”; aqui se prefere o sentido mais amplo porque a afirmação parece geral, não limitada ao casamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: No entanto
  rationale: Introduz uma ressalva que equilibra o argumento anterior, preservando a transição concessiva de Paulo em português natural.
- source_word: γυνή
  choice: mulher
  rationale: Embora possa significar também “esposa”, o contraste geral com ἀνήρ e a referência à relação entre os sexos favorecem o sentido mais amplo.
- source_word: ἀνήρ
  choice: homem
  rationale: Embora possa significar também “marido”, o contexto de criação, culto e mutualidade favorece o sentido geral “homem”.
- source_word: χωρὶς
  choice: separada de / separado de
  rationale: Expressa separação ou ausência de independência relacional sem acrescentar a interpretação mais explícita “independente de”.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a fórmula paulina e sua possível referência à esfera, união ou relação definida pelo Senhor.
- source_word: οὔτε ... οὔτε
  choice: nem ... nem
  rationale: Reproduz com clareza e paralelismo a negação correlativa grega.
theological_decisions:
- issue: Se γυνή / ἀνήρ devem ser traduzidos como “mulher/homem” ou “esposa/marido”
  choice: mulher/homem
  alternative: esposa/marido
  rationale: O contexto imediato trata de homem e mulher na criação e no culto, e o versículo formula uma mutualidade geral “no Senhor”. A alternativa conjugal continua lexicalmente possível e, por isso, é registrada em nota.
- issue: Sentido de ἐν κυρίῳ
  choice: no Senhor
  alternative: em relação ao Senhor
  rationale: A formulação tradicional e natural preserva a concisão e a amplitude da expressão paulina, sem limitar sua força à mera referência ou relação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O verbo “existe” torna natural em português a construção elíptica grega, enquanto “separada de” preserva a ideia relacional sem explicá-la excessivamente.
