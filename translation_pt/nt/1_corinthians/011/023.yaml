id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: pt
  text: 'Pois eu recebi do Senhor o que também transmiti a vocês: que o Senhor Jesus, na noite em que estava sendo entregue[a], tomou o pão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, «foi traído».
    reason: Leitura contextual alternativa de παρεδίδετο.
lexical_decisions:
- source_word: παρέλαβον
  choice: recebi
  rationale: Expressa a recepção, por Paulo, da tradição ou instrução e mantém a correspondência com παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: do Senhor
  rationale: Preserva a ideia mais natural de fonte sem ampliar a expressão grega.
- source_word: παρέδωκα
  choice: transmiti
  rationale: Em português atual, comunica com clareza o ato de passar adiante uma tradição recebida; evita repetir «entregar», verbo necessário logo depois para παρεδίδετο.
- source_word: ὅτι
  choice: que
  rationale: Introduz naturalmente o conteúdo daquilo que Paulo transmitiu.
- source_word: κύριος
  choice: Senhor
  rationale: Conserva a força reverencial e cristológica habitual do termo.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: na noite em que
  rationale: Forma portuguesa idiomática que preserva a construção temporal relativa.
- source_word: παρεδίδετο
  choice: estava sendo entregue
  rationale: Reproduz o aspecto imperfeito e a voz passiva, preservando a amplitude semântica de ser entregue ou traído.
- source_word: ἔλαβεν ἄρτον
  choice: tomou o pão
  rationale: Expressão natural e reconhecível no contexto da ceia; o artigo em português é idiomático e não implica que haja artigo no grego.
theological_decisions:
- issue: Tradução de παρεδίδετο na narrativa da instituição
  choice: estava sendo entregue
  alternative: foi traído
  rationale: O verbo pode indicar entregar, entregar às autoridades ou trair. A formulação principal preserva a amplitude e a tensão do texto, sem restringir a ação apenas à traição de Judas; a leitura tradicional fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» oferece naturalidade internacional com forte clareza no Brasil; «transmiti» mantém o vocabulário de tradição sem criar repetição enganosa com «entregue».
