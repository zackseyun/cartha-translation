source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: pt
  text: Nem a própria natureza[b] ensina a vocês que, se um homem usa cabelo comprido[a], isso é uma desonra para ele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixa o cabelo crescer” ou “tem cabelo comprido”. O verbo grego se refere a usar ou ter cabelo comprido.
    reason: lexical_alternative
  - marker: b
    text: “A própria natureza” pode se referir à ordem criada, à percepção humana comum ou ao que uma cultura considera naturalmente apropriado; aqui, o grego não especifica o sentido com maior precisão.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Não ... a própria
  rationale: Introduz a pergunta retórica e, em conjunto com αὐτή, conserva a ênfase de que até a própria natureza ensina isso; em português, a formulação é natural sem exigir um 'até mesmo' mais pesado.
- source_word: ἡ φύσις αὐτὴ
  choice: a própria natureza
  rationale: Preserva a ênfase de αὐτή e mantém φύσις semanticamente ampla, sem restringi-la à biologia ou ao costume social.
- source_word: διδάσκει ὑμᾶς
  choice: ensina a vocês
  rationale: Verte diretamente o presente indicativo e o objeto plural, com linguagem clara e amplamente compreensível em português.
- source_word: ἀνὴρ
  choice: um homem
  rationale: O contexto estabelece contraste entre homem e mulher, não especificamente entre marido e esposa.
- source_word: ἐὰν κομᾷ
  choice: se um homem usa cabelo comprido
  rationale: κομάω indica usar, deixar crescer ou ter cabelo comprido. A expressão escolhida é concisa e natural, e a nota registra alternativas legítimas.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: isso é uma desonra para ele
  rationale: Conserva o sentido de falta de honra ou vergonha e expressa naturalmente em português a construção predicativa com dativo.
theological_decisions:
- issue: Sentido de φύσις no argumento de Paulo
  choice: própria natureza
  alternative: ordem criada; percepção humana comum; aquilo que uma cultura considera naturalmente apropriado
  rationale: O termo grego não determina aqui, de maneira inequívoca, se a referência é biológica, moral-intuitiva ou sociocultural. A tradução mantém essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e claro, com leitura natural no Brasil e compreensão internacional. Mantém a pergunta retórica e evita resolver no texto a ambiguidade de “natureza”.
