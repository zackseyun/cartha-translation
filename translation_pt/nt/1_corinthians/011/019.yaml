source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: pt
  text: Pois é necessário que haja também facções[a] entre vocês, para que também os que são aprovados[b] se tornem evidentes entre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “divisões”, “partidos” ou “seitas”; em uso posterior, “heresias”. Aqui, o sentido mais provável é o de facções dentro da comunidade.
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que são aprovados” também pode ser traduzida como “os genuínos” ou “os que foram postos à prova e aprovados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: é necessário que haja
  rationale: Preserva a forte ideia de necessidade sem determinar se ela é providencial, lógica ou circunstancial.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior em registro digno e natural.
- source_word: καὶ αἱρέσεις
  choice: também facções
  rationale: No contexto, designa grupos ou partidos que dividem a comunidade, não necessariamente heresias doutrinárias no sentido posterior.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Expressão natural em português para algo existente no interior da comunidade.
- source_word: ἵνα
  choice: para que
  rationale: Conserva a possível nuance de propósito ou resultado sem decidir rigidamente entre elas.
- source_word: καὶ οἱ δόκιμοι
  choice: também ... os que são aprovados
  rationale: δόκιμοι descreve pessoas reconhecidas como genuínas depois de provadas; a posição de “também” preserva a ênfase do segundo καί.
- source_word: φανεροὶ γένωνται
  choice: se tornem manifestos
  rationale: Expressa o processo de passarem a ser publicamente reconhecíveis, preservando γένωνται.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Repete deliberadamente o enquadramento comunitário presente no grego.
theological_decisions:
- issue: Sentido de αἱρέσεις
  choice: facções
  alternative: divisões, partidos, seitas ou, em uso posterior, heresias
  rationale: O contexto imediato trata de rupturas internas na reunião da comunidade. “Facções” evita introduzir no texto a noção técnica posterior de heresia doutrinária.
- issue: Força de δεῖ
  choice: é necessário
  alternative: é inevitável / tem de haver
  rationale: A tradução mantém a afirmação de necessidade, mas não especifica se ela decorre da providência divina, da inevitabilidade prática ou de ambas.
- issue: Valor de ἵνα
  choice: para que
  alternative: de modo que
  rationale: A construção pode envolver propósito ou resultado; “para que” mantém a formulação do texto sem explicar a origem da necessidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “entre vocês” e os dois usos de “também” foram preservados por refletirem a estrutura e a ênfase do grego.
