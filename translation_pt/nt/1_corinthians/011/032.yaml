id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: pt
  text: Mas, quando somos julgados pelo Senhor[a], somos disciplinados, para não sermos condenados com o mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao sermos julgados pelo Senhor, estamos sendo disciplinados”. As formas gregas no presente podem destacar uma ação em andamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: quando somos julgados
  rationale: O particípio presente passivo é entendido temporalmente no contexto. A formulação mantém o sentido judicial de κρίνω sem confundi-lo com a condenação expressa depois por κατακρίνω.
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve com a advertência do versículo anterior; “Mas” torna essa relação clara e natural em português.
- source_word: ὑπὸ κυρίου
  choice: pelo Senhor
  rationale: Ὑπό com genitivo indica o agente. “Senhor” preserva o título do texto sem acrescentar “Jesus”, embora o contexto torne a referência clara.
- source_word: παιδευόμεθα
  choice: somos disciplinados
  rationale: Neste contexto, παιδεύω descreve correção formativa e remedial, não simples punição. “Disciplinados” comunica essa função em português atual.
- source_word: ἵνα μὴ
  choice: para não
  rationale: Expressa de modo conciso e idiomático a finalidade do ato disciplinador.
- source_word: σὺν τῷ κόσμῳ
  choice: com o mundo
  rationale: Σύν indica participação no mesmo destino. A expressão natural em português conserva o sentido coletivo de κόσμος.
- source_word: κατακριθῶμεν
  choice: sermos condenados
  rationale: Κατακρίνω indica juízo adverso ou condenação e mantém a distinção lexical em relação a κρίνω no início do versículo.
theological_decisions:
- issue: Relação entre o julgamento presente do Senhor e a condenação com o mundo
  choice: O julgamento do Senhor é apresentado como disciplina corretiva cuja finalidade é evitar a condenação com o mundo.
  alternative: Entender a frase apenas como punição temporal, sem implicar contraste entre disciplina presente e condenação futura.
  rationale: O contraste entre κρινόμενοι e κατακριθῶμεν, juntamente com παιδευόμεθα e a oração de finalidade, sustenta a distinção entre correção e condenação. A tradução não define um sistema doutrinário sobre perseverança, juízo final ou eficácia sacramental.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção é concisa e preserva a diferença entre “julgados” e “condenados”, bem como o caráter corretivo de “disciplinados”.
