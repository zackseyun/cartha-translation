id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: pt
  text: Mas quero que vocês saibam que a cabeça de todo homem é o Messias[a], a cabeça da mulher é o homem[b], e a cabeça do Messias é Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como “cabeça” também é entendida por alguns como “fonte” ou “autoridade sobre”; a metáfora do original foi mantida no texto.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “mulher” e “homem” também podem ser entendidos como “esposa” e “marido”.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Mas quero que vocês saibam
  rationale: Expressa de modo natural e direto a intenção de Paulo. “Mas” marca a transição ou o leve contraste indicado por δέ, e “vocês” oferece ampla legibilidade brasileira.
- source_word: παντὸς ἀνδρὸς
  choice: de todo homem
  rationale: ἀνήρ pode significar “homem” ou “marido”; nesta primeira oração, o sentido genérico se ajusta melhor ao paralelismo, sem neutralizar a referência masculina.
- source_word: κεφαλή
  choice: cabeça
  rationale: Mantém a metáfora grega e não decide entre as interpretações disputadas de “fonte/origem” e “autoridade sobre”.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: o Messias / do Messias
  rationale: Χριστός tem força de título no enunciado e é vertido como “Messias”, preservando também a repetição nas duas ocorrências.
- source_word: γυναικός
  choice: da mulher
  rationale: γυνή pode designar “mulher” ou “esposa”. O texto principal conserva a leitura geral, enquanto a possibilidade conjugal é registrada em nota.
- source_word: ὁ ἀνήρ
  choice: o homem
  rationale: Preserva a correspondência lexical com ἀνήρ e a ambiguidade relacional do grego; “marido” continua possível no contexto e consta da nota.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução portuguesa corrente de θεός e formulação direta do sujeito predicativo na oração final.
theological_decisions:
- issue: Sentido de κεφαλή nas três orações paralelas
  choice: Conservar a metáfora “cabeça” no texto principal.
  alternative: “fonte/origem” ou “autoridade sobre”
  rationale: O sentido preciso da metáfora é objeto de debate. Traduzir pela mesma metáfora preserva a ambiguidade e a tensão teológica do original sem impor uma interpretação.
- issue: Sentido de ἀνήρ e γυνή
  choice: Usar “homem” e “mulher” no texto principal.
  alternative: “marido” e “esposa”
  rationale: O paralelismo imediato favorece uma formulação geral, mas o vocabulário e o contexto também permitem uma leitura conjugal; por isso, essa alternativa é explicitada em nota.
- issue: Relação expressa na oração final
  choice: Traduzir diretamente “a cabeça do Messias é Deus”.
  alternative: Paráfrases que definam essa relação apenas como ordem funcional ou como inferioridade de essência.
  rationale: A tradução mantém a afirmação tal como formulada, sem expandi-la nem enfraquecê-la mediante uma explicação doutrinária importada.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A construção paralela do grego foi preservada, bem como a repetição de “cabeça”. “Vocês” traduz o plural ὑμᾶς com clareza amplamente compreensível.
