  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: pt
  text: Pois, se a mulher não cobre a cabeça[a], que também corte o cabelo; mas, se é vergonhoso para a mulher ter o cabelo cortado ou a cabeça raspada, que cubra a cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a esposa”; o grego gynē pode significar “mulher” ou “esposa”, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: 'Também se pode traduzir: “que se cubra” ou “que esteja velada”. O grego fala de estar coberta, e o contexto dá a entender que se trata da cabeça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: não cobre a cabeça / que cubra a cabeça
  rationale: O verbo significa cobrir ou velar. O objeto implícito é explicitado como “a cabeça” por causa do contexto, sem especificar o tipo de cobertura.
- source_word: γυνή
  choice: mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. Como o versículo não menciona explicitamente o marido, “mulher” preserva o alcance mais amplo; a alternativa é registrada em nota.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: que mande também cortar o cabelo / ter o cabelo cortado
  rationale: O verbo se refere a tosquiar ou cortar rente. A formulação distingue esse ato de raspar a cabeça e expressa naturalmente o valor médio/passivo em português.
- source_word: καί
  choice: também
  rationale: 'Mantém a progressão retórica: se ela não se cobre, que aceite também a consequência adicional de cortar o cabelo.'
- source_word: αἰσχρόν
  choice: vergonhoso
  rationale: Expressa de modo natural a dimensão pública de vergonha e desonra presente no termo grego.
- source_word: ξυρᾶσθαι
  choice: ter a cabeça raspada
  rationale: O verbo denota raspar com navalha. A explicitação de “a cabeça” evita a leitura genérica de depilação e conserva o contraste com cortar o cabelo.
- source_word: γὰρ ... δέ
  choice: Pois ... mas
  rationale: Reproduz claramente a relação explicativa e o contraste no argumento.
theological_decisions:
- issue: Se γυνή deve ser traduzido como “mulher” ou “esposa”
  choice: mulher
  alternative: esposa
  rationale: O enunciado imediato não menciona um marido e pode referir-se às mulheres em geral. “Mulher” evita restringir indevidamente o alcance, enquanto a possibilidade lexical de “esposa” permanece indicada em nota.
- issue: Natureza da cobertura indicada por κατακαλύπτω
  choice: cobrir a cabeça
  alternative: usar véu / estar velada
  rationale: O contexto implica a cabeça, mas não identifica de modo inequívoco uma peça específica. A tradução conserva essa abertura e evita transformar a cobertura necessariamente em um véu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Que mande cortar” evita sugerir que a própria mulher necessariamente execute o corte; “cabeça raspada” torna explícito o referente de ξυρᾶσθαι. Os marcadores de nota aparecem no texto principal.
