  naturalness: O texto é moderno, claro e de registro adequado. “Que também corte o cabelo” é mais direto e idiomático do que “que mande também cortar o cabelo”, mantendo a força retórica do original. A nota sobre véu deve evitar apresentar uma peça específica como exigida pelo verbo grego.
  terminology: “Mulher”, “vergonhoso”, “cabelo cortado” e “cabeça raspada” são escolhas adequadas. “Cobrir a cabeça” expressa com clareza o objeto contextual implícito, sem impor que a cobertura seja necessariamente um véu.
