  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: pt
  text: O presbítero ao amado Gaio, a quem eu amo em verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “verdadeiramente”; alternativamente, “na verdade”. A expressão grega pode indicar amor sincero, amor fundamentado na verdade do evangelho, ou ambas as ideias.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: O presbítero
  rationale: Como autodesignação substantivada do remetente, “presbítero” preserva a provável nuance de função ou posição reconhecida. “Ancião” seria possível, mas poderia sugerir apenas idade avançada.
- source_word: Γαΐῳ
  choice: a Gaio
  rationale: O dativo identifica o destinatário da carta, e “Gaio” é a forma tradicional e amplamente reconhecida do nome em português.
- source_word: τῷ ἀγαπητῷ
  choice: ao amado
  rationale: Transmite o tratamento afetuoso e preserva a ligação lexical com o verbo ἀγαπῶ, traduzido por “amo” na oração seguinte.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: a quem eu amo
  rationale: A construção mantém o pronome como objeto de “amo” e conserva a leve ênfase do pronome grego explícito ἐγώ por meio de “eu”.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Preserva a formulação aberta do grego, que pode indicar sinceridade, amor situado na verdade do evangelho, ou ambas as ideias, sem decidir entre elas no texto principal.
theological_decisions:
- issue: Nuance joanina de ἀλήθεια na expressão final
  choice: em verdade
  alternative: verdadeiramente; na verdade
  rationale: Nos escritos joaninos, “verdade” pode ter profundidade teológica, mas o contexto também admite a ideia de sinceridade. A tradução mantém essa tensão, enquanto a nota registra as principais possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Presbítero” é um termo eclesiástico corrente, mas não especifica uma estrutura denominacional. A formulação concisa conserva o estilo epistolar do grego.
