base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: pt
  text: Eu tinha muitas coisas para lhe escrever, mas não quero lhe escrever com tinta e caneta[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com tinta e pena de cana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: muitas coisas
  rationale: O adjetivo neutro plural é usado substantivamente; “muitas coisas” preserva o plural e soa natural em português.
- source_word: εἶχον
  choice: Eu tinha
  rationale: O imperfeito introduz aquilo que o autor pretendia escrever, preservando o enquadramento passado do grego.
- source_word: γράψαι σοι
  choice: para lhe escrever
  rationale: O infinitivo aoristo expressa a ação contemplada; “lhe” representa naturalmente o dativo σοι em português.
- source_word: ἀλλ’ οὐ θέλω
  choice: mas não quero
  rationale: Traduz de modo direto e atual a ideia de vontade ou desejo expressa por θέλω.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: com tinta e caneta
  rationale: διά com genitivo indica o meio empregado. μέλαν é “tinta”, e κάλαμος designa literalmente um cálamo, isto é, uma haste usada como instrumento de escrita; “caneta” comunica naturalmente sua função ao leitor moderno.
- source_word: γράφειν
  choice: escrever
  rationale: O infinitivo presente pode realçar o processo, mas o infinitivo simples em português transmite o sentido sem explicitar em excesso o aspecto verbal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “lhe” para o singular σοι e evita a forma técnica “cálamo” no texto principal.
