  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: pt
  text: Paz seja com você.[a] Os amigos mandam saudações a você. Cumprimente os amigos pelo nome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Paz a você”, uma bênção epistolar concisa.
    reason: lexical_alternative
  - marker: b
    text: Ou “um por um” ou “individualmente”. O grego diz “pelo nome”, enfatizando uma saudação pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Paz seja com você
  rationale: Expressa naturalmente em português a bênção epistolar concisa do grego, cujo sentido literal é “Paz a você”.
- source_word: ἀσπάζονταί σε
  choice: mandam saudações
  rationale: No contexto epistolar, transmite com naturalidade que os amigos enviam cumprimentos ao destinatário.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: os amigos
  rationale: Preserva o termo grego φίλοι e evita substituí-lo por designações eclesiásticas não presentes no texto.
- source_word: ἀσπάζου
  choice: Cumprimente
  rationale: Equivalente direto e corrente do imperativo singular, adequado a uma saudação pessoal.
- source_word: κατ’ ὄνομα
  choice: pelo nome
  rationale: Mantém a imagem verbal do grego e destaca que cada pessoa deve ser saudada pessoalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula inicial foi explicitada de modo idiomático, enquanto “os amigos” e “pelo nome” preservam a terminologia distintiva e a força pessoal do original.
