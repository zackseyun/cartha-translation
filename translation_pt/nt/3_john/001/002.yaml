id: 3JN.1.2
reference: 3 John 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: pt
  text: Amado, oro para que você prospere em tudo[a] e tenha boa saúde, assim como prospera a sua alma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em todos os aspectos». Tradicionalmente, «acima de tudo»; o grego indica mais naturalmente âmbito do que prioridade.
    reason: alternative_reading
  - marker: b
    text: Ou «assim como tudo vai bem com o seu ser interior».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Amado
  rationale: O vocativo singular expressa afeto e mantém a ligação lexical com o amor, com dignidade adequada ao contexto epistolar.
- source_word: περὶ πάντων
  choice: em tudo
  rationale: A expressão indica mais naturalmente o âmbito do desejo — em todos os aspectos — e não prioridade, como sugeriria «acima de tudo».
- source_word: εὔχομαί
  choice: oro
  rationale: No contexto da carta, o verbo pode expressar desejo ou oração; «oro» conserva sua possível nuance religiosa e é natural em português.
- source_word: σε εὐοδοῦσθαι
  choice: que você prospere
  rationale: O verbo indica que as coisas vão bem para alguém. «Prosperar» é conciso e permite conservar a repetição deliberada do mesmo verbo na segunda oração.
- source_word: ὑγιαίνειν
  choice: tenha boa saúde
  rationale: Neste contexto, refere-se naturalmente à saúde física; a formulação é clara e corrente.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz de modo claro a comparação entre o bem-estar geral e o estado da alma do destinatário.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: prospera a sua alma
  rationale: Conserva o eco lexical de εὐοδοῦσθαι e o aspecto presente do bem-estar contínuo da ψυχή.
- source_word: ψυχή
  choice: alma
  rationale: «Alma» preserva a referência ao aspecto interior da pessoa sem impor uma definição técnica de sua constituição.
theological_decisions:
- issue: Sentido de περὶ πάντων no desejo inicial
  choice: em tudo, indicando âmbito
  alternative: acima de tudo, indicando prioridade
  rationale: A construção grega exprime mais naturalmente os aspectos nos quais João deseja o bem-estar de seu destinatário, e não a prioridade máxima desse pedido.
- issue: Sentido de ψυχή
  choice: alma
  alternative: ser interior; vida
  rationale: «Alma» mantém a distinção contextual em relação à saúde física, mas a nota registra uma opção menos sujeita a leitura antropológica técnica.
- issue: Repetição de εὐοδόομαι
  choice: prosperar nas duas ocorrências
  alternative: variar entre «ir bem» e «prosperar»
  rationale: A repetição reproduz o paralelo intencional do grego entre o bem-estar desejado para a pessoa e o bem-estar já presente em sua alma, sem transformar o versículo numa promessa de prosperidade material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «você» para legibilidade brasileira. A repetição de «prosperar» conserva o paralelismo do grego; no contexto, trata-se de uma oração ou desejo pessoal, não de uma promessa geral de riqueza ou saúde.
