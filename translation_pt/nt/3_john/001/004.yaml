source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: pt
  text: 'Não tenho alegria maior do que esta: ouvir que meus filhos estão andando na verdade.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Não tenho alegria maior do que estas coisas.”'
    reason: lexical_alternative
  - marker: b
    text: “Meus filhos” provavelmente se refere aos filhos espirituais do autor — os fiéis sob seu cuidado pastoral.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: maior
  rationale: Comparativo que modifica χαράν; “alegria maior” é a expressão natural em português e preserva a força do original.
- source_word: τούτων
  choice: do que esta
  rationale: Genitivo de comparação. Embora a forma grega seja plural, o singular idiomático remete naturalmente ao conteúdo explicitado em seguida.
- source_word: χαράν
  choice: alegria
  rationale: Equivalente corrente e digno de χαρά, adequado tanto ao sentido afetivo quanto ao uso teológico.
- source_word: ἵνα ἀκούω
  choice: ouvir que
  rationale: Neste contexto, ἵνα introduz o conteúdo que constitui a alegria, não uma finalidade estrita; a formulação é natural em português.
- source_word: τὰ ἐμὰ τέκνα
  choice: meus filhos
  rationale: Preserva a metáfora familiar do grego sem determinar no texto principal se os filhos são biológicos ou espirituais.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: na verdade
  rationale: Mantém a expressão definida e sua amplitude joanina, que pode abranger tanto a verdade confessada quanto a vida orientada por ela.
- source_word: περιπατοῦντα
  choice: estão andando
  rationale: Conserva a metáfora ética de caminhar como modo de viver, conhecida e inteligível no registro bíblico português.
theological_decisions:
- issue: Se τέκνα designa filhos biológicos ou espirituais
  choice: Manter “meus filhos” no texto principal.
  alternative: “meus filhos espirituais” ou “meus convertidos”
  rationale: O contexto favorece discípulos ou fiéis sob o cuidado pastoral de João, mas o grego conserva a metáfora familiar; explicitá-la no texto resolveria uma questão que o original deixa implícita.
- issue: Sentido de ἐν τῇ ἀληθείᾳ
  choice: Traduzir por “na verdade”.
  alternative: “com sinceridade” ou “segundo o ensino verdadeiro”
  rationale: O uso joanino reúne dimensões éticas e confessionais da verdade; a tradução não deve reduzir a expressão a apenas uma delas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “alegria maior do que esta” é idiomática; “andando na verdade” preserva deliberadamente a metáfora e a amplitude teológica do grego.
