id: 3JN.1.14
reference: 3 John 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλπίζω δὲ εὐθέως ⸂σε ἰδεῖν⸃, καὶ στόμα πρὸς στόμα λαλήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: pt
  text: Mas espero ver você em breve, e conversaremos face a face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “boca a boca”; isto é, em conversa direta e pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: espero
  rationale: O presente do indicativo expressa a esperança ou expectativa pessoal do autor; “espero” é natural no encerramento de uma carta.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao que foi dito antes sobre escrever.
- source_word: εὐθέως
  choice: em breve
  rationale: Embora possa significar “imediatamente”, neste contexto de uma visita futura indica proximidade temporal.
- source_word: σε ἰδεῖν
  choice: ver você
  rationale: Reproduz diretamente a construção grega sem explicitar como “visitar” aquilo que o contexto apenas sugere.
- source_word: στόμα πρὸς στόμα
  choice: face a face
  rationale: É o equivalente idiomático natural em português para uma conversa pessoal e direta; a forma literal “boca a boca” seria enganosa.
- source_word: λαλήσομεν
  choice: conversaremos
  rationale: O futuro indica a conversa esperada. “Conversaremos” expressa naturalmente a ação recíproca sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ver você” evita a ambiguidade regional de “vê-lo” e mantém o destinatário masculino ou feminino sem explicitação indevida; “conversaremos” soa mais natural do que “falaremos” neste contexto.
