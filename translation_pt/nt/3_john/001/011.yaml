  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: pt
  text: Amado, não imite o mal, mas o bem. Quem faz o bem[a] é de Deus; quem faz o mal não viu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «aquele que faz o bem ... aquele que faz o mal». Os particípios gregos podem enfatizar prática contínua ou conduta característica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Amado
  rationale: Vocativo singular afetuoso; preserva o calor da forma de tratamento e o estilo joanino recorrente.
- source_word: μὴ μιμοῦ
  choice: não imite
  rationale: O imperativo presente com μή expressa proibição, e «imitar» mantém a ênfase no exemplo moral.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: o mal / o bem
  rationale: Os adjetivos neutros substantivados designam categorias morais gerais; esta formulação é natural e mantém o contraste conciso.
- source_word: ὁ ἀγαθοποιῶν / ὁ κακοποιῶν
  choice: quem pratica o bem / quem pratica o mal
  rationale: Os particípios presentes substantivados podem indicar conduta contínua ou característica; «pratica» comunica esse valor melhor que uma ação isolada.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: procede de Deus
  rationale: Preserva a força de origem ou fonte de ἐκ em português natural, sem reduzi-la apenas a associação ou pertencimento.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: não tem visto Deus
  rationale: Mantém o perfeito grego e a linguagem joanina de «ver» Deus, sem substituí-la interpretativamente por «conhecer».
theological_decisions:
- issue: Relação entre a conduta moral e a relação com Deus na fórmula joanina
  choice: 'Manter as categorias do texto: quem pratica o bem procede de Deus; quem pratica o mal não tem visto Deus.'
  alternative: Explicitar regeneração, perfeccionismo moral ou ausência absoluta de qualquer relação anterior com Deus.
  rationale: O grego apresenta um diagnóstico moral e espiritual em linguagem joanina, mas não formula diretamente essas construções sistemático-teológicas; a tradução conserva a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Amado» preserva o tom pastoral; «procede de Deus» conserva a noção de origem, e «não tem visto Deus» mantém deliberadamente a expressão teológica joanina.
