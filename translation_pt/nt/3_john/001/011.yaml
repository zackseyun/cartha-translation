revisions:
- from: Amado, não imite o mal, mas o bem. Quem pratica o bem procede de Deus; quem pratica o mal não tem visto Deus.[a]
  to: Amado, não imite o mal, mas o bem. Quem faz o bem[a] é de Deus; quem faz o mal não viu Deus.
  rationale: A revisão elimina o uso não idiomático de «não tem visto», que em português altera o aspecto da afirmação, e adota «não viu Deus». Também usa «quem faz» e «é de Deus», formulações naturais que mantêm mais de perto as categorias verbais e teológicas do grego; a nota preserva a possível nuance de prática característica dos particípios.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente o vocativo, a proibição de imitar, o contraste moral e a fórmula joanina sobre Deus. Contudo, «não tem visto Deus» não corresponde ao uso natural do perfeito em português: o pretérito perfeito composto português normalmente sugere ação repetida ou continuada, sentido que o perfeito grego ἑώρακεν não exige aqui.'
  naturalness: «Amado», «não imite o mal, mas o bem» e «é de Deus» são claros, dignos e amplamente compreensíveis. «Não viu Deus» é a forma portuguesa natural para manter a afirmação negativa de experiência expressa pelo perfeito grego, sem introduzir a nuance iterativa de «tem visto».
  terminology: «É de Deus» conserva de modo conciso a fórmula joanina ἐκ τοῦ θεοῦ ἐστιν e evita explicações doutrinárias. «Quem faz o bem/mal» traduz diretamente os particípios e deixa que a nota indique sua possível força de prática característica.
  issues:
  - severity: medium
    issue: «não tem visto Deus» emprega inadequadamente o pretérito perfeito composto português.
    rationale: Em português moderno, «tem visto» tende a comunicar repetição ou continuidade até o presente. O grego οὐχ ἑώρακεν é perfeito e afirma que a pessoa não viu Deus; «não viu Deus» preserva o enunciado em português idiomático sem acrescentar aspecto iterativo.
  - severity: low
    issue: «pratica» explicita mais fortemente do que necessário a nuance habitual dos particípios.
    rationale: Os particípios presentes podem sugerir conduta característica, mas «faz» é mais direto e permite que a nota registre essa possível ênfase sem incorporá-la como exigência semântica na redação principal.
  revised_text: Amado, não imite o mal, mas o bem. Quem faz o bem[a] é de Deus; quem faz o mal não viu Deus.
  revised_footnotes:
