  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: pt
  text: Amado, você age fielmente em tudo o que faz pelos irmãos, inclusive por aqueles que lhe são desconhecidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Amado, você faz algo fiel em tudo o que realiza pelos irmãos — e isso por desconhecidos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Amado
  rationale: O vocativo singular expressa afeto e preserva o tom caloroso da carta.
- source_word: πιστὸν ποιεῖς
  choice: você age fielmente
  rationale: Expressa em português natural o sentido idiomático de fazer algo caracterizado pela fidelidade.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: em tudo o que faz
  rationale: A construção com ἐάν e subjuntivo tem sentido indefinido, equivalente a 'tudo o que' ou 'qualquer coisa que' se faça.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: pelos irmãos
  rationale: A preposição tem aqui valor benefactivo; 'irmãos' conserva o plural masculino do grego e designa companheiros na fé.
- source_word: καὶ τοῦτο ξένους
  choice: inclusive quando são desconhecidos para você
  rationale: Torna explícito o sentido contextual de que esses irmãos não eram conhecidos pessoalmente por Gaio, sem sugerir necessariamente estrangeiros de outra nacionalidade.
- source_word: ξένους
  choice: desconhecidos para você
  rationale: No contexto de hospitalidade, refere-se a pessoas que o anfitrião não conhece, e não necessariamente a estrangeiros.
theological_decisions:
- issue: Identidade dos ξένους
  choice: Os desconhecidos são entendidos como os próprios irmãos mencionados anteriormente.
  alternative: Entender 'irmãos' e 'estrangeiros' como dois grupos distintos.
  rationale: A concordância no acusativo masculino plural e o contexto favorecem a identificação dos ξένους com os irmãos, embora a sintaxe concisa permita uma formulação mais literal.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade brasileira ampla. “Amado” mantém o tom epistolar afetuoso; “desconhecidos para você” evita que “estrangeiros” seja entendido como referência à nacionalidade.
