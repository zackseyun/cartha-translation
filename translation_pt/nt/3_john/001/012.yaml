  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: pt
  text: Demétrio recebeu testemunho de todos[a] e da própria verdade. Nós também damos testemunho, e você sabe que o nosso testemunho é verdadeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos deram testemunho dele”. O grego emprega a forma passiva perfeita do verbo “testemunhar”, indicando um testemunho já estabelecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Demétrio
  rationale: Forma tradicional e natural do nome grego em português.
- source_word: μεμαρτύρηται
  choice: tem recebido bom testemunho
  rationale: O perfeito passivo indica um testemunho favorável já estabelecido e com efeito presente. Embora “bom” não esteja expresso lexicalmente, o contexto de recomendação torna explícito o sentido favorável.
- source_word: ὑπὸ πάντων
  choice: de todos
  rationale: Ὑπό com genitivo indica a origem ou os agentes do testemunho; “de todos” é idiomático em português e preserva o alcance geral.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: da própria verdade
  rationale: “Própria” preserva a força intensiva de αὐτῆς, sem reduzir “a verdade” ao evangelho ou à conduta de Demétrio.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Nós também damos testemunho
  rationale: A formulação preserva a força aditiva e mantém a conexão lexical com “testemunho” na oração seguinte.
- source_word: οἶδας
  choice: você sabe
  rationale: Embora tenha forma de perfeito, οἶδα funciona como verbo de estado presente no grego koiné.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: o nosso testemunho
  rationale: Tradução direta e natural, conservando a repetição lexical do campo de μαρτυρέω.
- source_word: ἀληθής ἐστιν
  choice: é verdadeiro
  rationale: Tradução direta que preserva a ligação lexical e temática com ἀλήθεια, “verdade”, na frase anterior.
theological_decisions:
- issue: Sentido de “a própria verdade” no uso joanino
  choice: Manter “a própria verdade” sem explicação no texto principal.
  alternative: “o próprio evangelho” ou “a vida de Demétrio confirma isso”
  rationale: A expressão pode indicar que a vida de Demétrio está de acordo com a verdade ou, de modo mais amplo, que a verdade ou o evangelho testemunha em seu favor. A tradução não deve resolver essa ambiguidade teológica e literária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Você” representa o singular de οἶδας. A expressão “a própria verdade” foi preservada por sua densidade joanina. Não se incluiu o marcador [b] do texto inglês porque a nota correspondente explicava “a verdade”, não a oração “Nós também damos testemunho”; esse conteúdo foi registrado na decisão teológica, sem marcador textual indevidamente posicionado.
