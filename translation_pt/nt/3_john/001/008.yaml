id: 3JN.1.8
reference: 3 John 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: pt
  text: Portanto, nós devemos acolher pessoas assim[a], para que nos tornemos cooperadores em favor da verdade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por “acolher” também pode incluir a ideia de receber com hospitalidade e sustentar materialmente esses trabalhadores itinerantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “cooperadores com a verdade” ou “cooperadores na verdade”. O dativo grego pode ser entendido de mais de uma maneira; o texto principal adota o sentido de trabalhar em favor da causa da verdade.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito é mantido para preservar a ênfase no dever dos que recebem esses trabalhadores.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a conclusão tirada do versículo anterior e mantém clara a ligação lógica.
- source_word: ὀφείλομεν
  choice: devemos
  rationale: Comunica obrigação moral de forma natural e direta, sem transformar desnecessariamente a afirmação em ordem absoluta.
- source_word: ὑπολαμβάνειν
  choice: acolher
  rationale: No contexto, indica receber hospitaleiramente esses trabalhadores e prestar-lhes o apoio necessário. “Acolher” é natural em português e conserva essa amplitude contextual.
- source_word: τοὺς τοιούτους
  choice: pessoas assim
  rationale: Refere-se a pessoas do tipo descrito anteriormente. A formulação é corrente e não introduz uma especificação masculina além do que a expressão grega exige.
- source_word: ἵνα
  choice: para que
  rationale: Introduz com clareza a finalidade ou o resultado pretendido do acolhimento.
- source_word: συνεργοὶ
  choice: cooperadores
  rationale: Preserva a ideia de participação conjunta no trabalho, em registro digno e compreensível.
- source_word: γινώμεθα
  choice: nos tornemos
  rationale: 'Mantém o valor de γίνομαι: ao apoiar essas pessoas, os leitores passam a participar de seu trabalho.'
- source_word: τῇ ἀληθείᾳ
  choice: em favor da verdade
  rationale: Interpreta o dativo como indicando a causa beneficiada pelo trabalho conjunto, adequadamente ao contexto missionário, sem ocultar em nota outras relações gramaticalmente possíveis.
theological_decisions:
- issue: Relação de τῇ ἀληθείᾳ com συνεργοὶ
  choice: “em favor da verdade”, indicando participação no trabalho que promove a verdade
  alternative: “com a verdade” ou “na verdade”
  rationale: O contexto trata do apoio aos que saíram por causa do Nome; esse apoio torna os leitores participantes do trabalho deles. Como o dativo grego admite mais de uma relação, as alternativas legítimas são preservadas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno. “Acolher” evita o sentido potencialmente vago de “receber” e comunica hospitalidade sem limitar o verbo apenas a hospedagem; a nota explicita o apoio material. A ordem conserva o “nós” enfático do grego.
