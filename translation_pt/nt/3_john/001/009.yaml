source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: pt
  text: Escrevi algo à igreja[a], mas Diótrefes, que gosta de ocupar o primeiro lugar entre eles, não nos recebe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Escrevi uma breve mensagem à igreja”. O texto grego usa uma expressão indefinida (“escrevi algo”), e alguns manuscritos trazem uma formulação ampliada.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “não nos acolhe” ou “não nos reconhece”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Escrevi
  rationale: O aoristo indicativo é expresso naturalmente pelo pretérito perfeito simples em português, mantendo a referência direta a uma ação passada.
- source_word: τι
  choice: algo
  rationale: O pronome indefinido neutro significa mais naturalmente “algo”. A formulação preserva a indefinição e não acrescenta um objeto mais específico do que o texto grego.
- source_word: τῇ ἐκκλησίᾳ
  choice: à igreja
  rationale: No contexto joanino, ἐκκλησία designa a comunidade cristã local; “igreja” é a expressão corrente e amplamente compreendida em português.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca de modo claro e natural o forte contraste entre o que o autor fez e a reação de Diótrefes.
- source_word: ὁ φιλοπρωτεύων
  choice: que gosta de ocupar o primeiro lugar
  rationale: Expressa a inclinação de Diótrefes a ter primazia. “Ocupar o primeiro lugar” comunica tanto posição quanto preeminência sem recorrer a linguagem arcaica.
- source_word: αὐτῶν
  choice: entre eles
  rationale: Indica o grupo dentro do qual Diótrefes procura a primazia, sem afirmar mais especificamente que exerça autoridade formal sobre eles.
- source_word: Διοτρέφης
  choice: Diótrefes
  rationale: Forma tradicional e reconhecível do nome em português, com acentuação adequada.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: não nos recebe
  rationale: “Receber” mantém a amplitude de ἐπιδέχομαι, que pode envolver acolhimento pessoal, hospitalidade ou reconhecimento, sem restringir prematuramente o sentido.
theological_decisions:
- issue: Natureza da oposição de Diótrefes
  choice: não nos recebe
  alternative: não nos acolhe; não nos reconhece
  rationale: A tradução mantém amplo o sentido de ἐπιδέχεται, sem decidir se a questão principal é hospitalidade, acolhimento pessoal ou reconhecimento do autor e de seus representantes. Assim, preserva-se a tensão do texto sem introduzir uma afirmação eclesiológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “gosta de ocupar o primeiro lugar” comunica a censura moral do particípio grego de modo natural; “não nos recebe” preserva deliberadamente a ambiguidade lexical.
