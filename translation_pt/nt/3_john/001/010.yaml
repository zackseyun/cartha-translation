id: 3JN.1.10
reference: 3 John 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: pt
  text: 'Por isso, se eu for aí, chamarei a atenção para as obras que ele pratica: profere contra nós palavras maldosas e sem sentido. E, não satisfeito com isso, ele próprio não acolhe os irmãos[a], impede os que querem acolhê-los e os expulsa da igreja.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Acolhe” também pode ser traduzido por “recebe”, especialmente no sentido de oferecer hospitalidade. “Os irmãos” provavelmente são cristãos itinerantes que serviam à missão.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os expulsa da comunidade”. O texto não esclarece se isso descreve um procedimento formal ou a exclusão abusiva da congregação local.'
    reason: ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Preserva a relação causal e consequencial de forma natural no português atual.
- source_word: ἐὰν ἔλθω
  choice: se eu for aí
  rationale: 'Mantém a condição e adota a perspectiva epistolar natural em português: o autor vai ao lugar onde estão os destinatários.'
- source_word: ὑπομνήσω
  choice: chamarei a atenção para
  rationale: No contexto, o autor pretende trazer publicamente a conduta de Diótrefes à consideração, não apenas recordar algo de modo neutro.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: as obras que ele pratica
  rationale: Retém o plural concreto ἔργα e comunica que se trata de conduta em curso.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: profere contra nós palavras maldosas e sem sentido
  rationale: “Palavras maldosas” expressa λόγοις πονηροῖς, enquanto “sem sentido” preserva em φλυαρέω a ideia de fala vazia ou disparatada; “contra nós” identifica o alvo hostil.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: não satisfeito com isso
  rationale: Reproduz naturalmente a construção participial e mostra que a conduta censurável vai além das palavras.
- source_word: ἐπιδέχεται τοὺς ἀδελφούς
  choice: acolhe os irmãos
  rationale: “Acolhe” inclui a ideia contextual de receber com hospitalidade; “os irmãos” mantém a forma masculina e a provável referência aos cristãos itinerantes.
- source_word: τοὺς βουλομένους κωλύει
  choice: impede os que querem acolhê-los
  rationale: Explicita o complemento subentendido do verbo volitivo sem acrescentar uma ação nova e preserva a força de obstrução de κωλύει.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: os expulsa da igreja
  rationale: Expressa a ação vigorosa e contínua de excluir pessoas da comunidade cristã local.
theological_decisions:
- issue: Sentido e referência de τοὺς ἀδελφούς no contexto da hospitalidade cristã
  choice: os irmãos
  alternative: os irmãos e as irmãs; os outros cristãos; os irmãos missionários
  rationale: O contexto da carta aponta provavelmente para cristãos itinerantes, possivelmente homens, mas o texto não os chama explicitamente de missionários. A tradução mantém o masculino do grego e deixa a identificação contextual para a nota.
- issue: Sentido institucional de ἐκκλησία
  choice: igreja
  alternative: comunidade; assembleia
  rationale: “Igreja” é a forma natural em português neste contexto, sem determinar se a exclusão era um ato disciplinar formal ou uma expulsão exercida abusivamente por Diótrefes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita tanto o arcaísmo “tagarelando” quanto uma paráfrase que transformaria a fala vazia em uma acusação técnica de calúnia. A pontuação divide a enumeração longa sem enfraquecer a progressão do argumento.
