    rationale: A expressão grega é compacta e pode referir-se à fidelidade do destinatário à verdade; a redação proposta é possível, mas acrescenta a noção de verdade “em” alguém. Uma formulação contextual com nota literal comunica melhor o sentido sem perder o dado textual.
