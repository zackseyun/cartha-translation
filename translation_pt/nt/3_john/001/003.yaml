  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: pt
  text: Pois me alegrei muito quando irmãos[a] vieram e deram testemunho da sua fidelidade à verdade[b], assim como você anda na verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”, referindo-se a outros cristãos; o grego emprega a forma masculina “irmãos”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “deram testemunho da sua verdade”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Pois fiquei muito alegre
  rationale: O aoristo de χαίρω tem sentido ativo, e γάρ liga a frase à anterior como explicação. “Fiquei muito alegre” comunica naturalmente a intensidade de λίαν em português atual.
- source_word: ἐρχομένων ἀδελφῶν
  choice: quando alguns irmãos vieram
  rationale: A construção participial no genitivo é circunstancial e temporal. “Alguns” é implícito e natural em português, sem sugerir que todos os irmãos tenham vindo.
- source_word: μαρτυρούντων
  choice: deram testemunho
  rationale: Preserva a linguagem de testemunho de μαρτυρέω e soa digna e corrente no contexto epistolar.
- source_word: σου τῇ ἀληθείᾳ
  choice: da verdade que há em você
  rationale: Evita a impressão moderna de que “sua verdade” seja uma verdade particular ou subjetiva, ao mesmo tempo que mantém a relação estreita entre o destinatário e a verdade. A nota conserva uma versão mais formal e a possibilidade de referência à fidelidade do destinatário.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: de como você anda na verdade
  rationale: Neste contexto, καθώς explicita em que consiste o testemunho, sem perder a correspondência expressa pelo termo. “Anda na verdade” preserva a metáfora ética joanina de περιπατέω.
theological_decisions:
- issue: O sentido de ἀλήθεια no contexto ético joanino
  choice: Manter “verdade” nas duas ocorrências e conservar a metáfora “andar na verdade”.
  alternative: Traduzir a primeira ocorrência como “fidelidade à verdade” e a segunda como “viver segundo a verdade”.
  rationale: “Verdade” mantém unidas as dimensões doutrinária, relacional e ética do termo, sem reduzi-lo apenas à sinceridade, à conduta moral ou à fidelidade doutrinária.
- issue: A relação sintática de σου com τῇ ἀληθείᾳ
  choice: “a verdade que há em você”
  alternative: “sua fidelidade à verdade” ou, mais literalmente, “sua verdade”
  rationale: A construção grega é compacta e admite mais de uma explicação. A formulação principal evita a ideia de verdade privada, enquanto a nota registra as alternativas sem encerrar indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” evita regionalismos excessivos; “dar testemunho” e “andar na verdade” preservam o tom e as imagens joaninas sem arcaísmo desnecessário.
