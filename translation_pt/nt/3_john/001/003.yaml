  source_fidelity: A tradução capta a alegria, a vinda dos irmãos, o testemunho e a imagem joanina de andar na verdade. Contudo, “alguns irmãos” introduz uma limitação ausente do grego, e “de como” enfraquece a comparação expressa por καθώς (“assim como”). “A verdade que há em você” é uma explicitação interpretativa possível, mas não preserva tão bem a concisão nem a ambiguidade de σου τῇ ἀληθείᾳ.
  naturalness: “Pois me alegrei muito” e “assim como você anda na verdade” são naturais, claros e mantêm um registro epistolar digno em português moderno. “Dar testemunho da sua fidelidade à verdade” é idiomático; a nota resguarda a formulação mais literal.
  terminology: Mantêm-se “irmãos”, “dar testemunho”, “verdade” e “andar na verdade”. “Fidelidade à verdade” na primeira ocorrência explicita uma leitura contextual muito provável, enquanto a nota conserva a alternativa literal e evita atribuir ao destinatário uma “verdade” privada no sentido moderno.
