  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: pt
  text: Eles deram testemunho do seu amor diante da igreja, e você fará bem em ajudá-los a prosseguir viagem[a] de maneira digna de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enviá-los adiante”; o verbo grego pode incluir o apoio prático dado a viajantes para que continuem seu caminho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: deram testemunho
  rationale: O aoristo indica um ato passado e concluído. “Deram testemunho” conserva o sentido de relatar ou atestar e soa natural no contexto da carta.
- source_word: σου τῇ ἀγάπῃ
  choice: do seu amor
  rationale: 'O dativo indica aquilo a respeito do qual eles testemunharam: o amor demonstrado pelo destinatário. A formulação é idiomática e preserva ἀγάπη como “amor”.'
- source_word: ἐνώπιον ἐκκλησίας
  choice: diante da igreja
  rationale: ἐνώπιον expressa presença pública, e ἐκκλησία designa aqui a comunidade cristã reunida.
- source_word: καλῶς ποιήσεις
  choice: você fará bem
  rationale: A expressão funciona como recomendação cortês, embora esteja formalmente no futuro. A tradução preserva tanto a forma quanto a força exortativa.
- source_word: προπέμψας
  choice: em encaminhá-los em sua viagem
  rationale: O verbo descreve o ato de ajudar viajantes a seguir adiante, frequentemente com apoio prático. “Encaminhá-los em sua viagem” é claro sem especificar mais do que o grego exige; a nota registra a nuance de auxílio.
- source_word: ἀξίως τοῦ θεοῦ
  choice: de maneira digna de Deus
  rationale: 'ἀξίως indica o modo da ação: o apoio deve corresponder à honra e ao caráter de Deus.'
theological_decisions:
- issue: Nuance de προπέμπω na hospitalidade cristã
  choice: encaminhá-los em sua viagem
  alternative: ajudá-los a prosseguir viagem
  rationale: O verbo pode envolver mais que uma simples despedida, incluindo provisões ou outra ajuda para a continuação da viagem. O texto principal evita limitar o tipo de auxílio, e a nota preserva essa dimensão prática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” dirige-se naturalmente ao destinatário singular; “igreja” mantém o referente comunitário cristão. A estrutura coordenada acompanha de perto a única frase grega sem soar rígida.
