source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: pt
  text: Pois eles partiram por causa do Nome, sem aceitar coisa alguma dos gentios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pagãos» ou «descrentes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Com o genitivo «do Nome», expressa causa ou motivo. «Por causa de» comunica isso de modo natural e mantém a concisão do grego.
- source_word: τοῦ ὀνόματος
  choice: o Nome
  rationale: Mantém a expressão reverente e definida do grego, que alude implicitamente a Jesus/o Senhor sem explicitar um referente ausente do texto.
- source_word: ἐξῆλθον
  choice: partiram
  rationale: No contexto de deslocamento missionário, «partiram» é corrente e expressa melhor o início da viagem do que o literal, porém menos específico, «saíram».
- source_word: μηδὲν λαμβάνοντες
  choice: sem aceitar coisa alguma
  rationale: O particípio descreve a maneira como partiram. «Aceitar» ressalta que recusavam sustento material oferecido, sem restringir o objeto a dinheiro.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: dos gentios
  rationale: Preserva a coloração étnico-religiosa e o enquadramento judaico-cristão do termo, sem reduzi-lo interpretativamente a «pagãos» ou «descrentes».
theological_decisions:
- issue: Referente de «o Nome»
  choice: Referência reverente a Jesus/o Senhor, mantida implicitamente como «o Nome».
  alternative: Explicitar como «o nome de Cristo» ou «seu nome».
  rationale: O grego não nomeia o referente neste versículo. Manter a forma implícita preserva sua ressonância teológica e evita acrescentar uma identificação, embora o contexto cristão a torne reconhecível.
- issue: Sentido de ἐθνικῶν
  choice: «gentios» no texto principal.
  alternative: «pagãos» ou «descrentes».
  rationale: «Gentios» corresponde mais diretamente ao termo e conserva sua dimensão histórica. Neste contexto, porém, ele provavelmente caracteriza pessoas de fora da comunidade cristã; a nota registra essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Partiram» evita o tom arcaico de «saíram em missão» e «coisa alguma» preserva uma solenidade leve sem perder clareza.
