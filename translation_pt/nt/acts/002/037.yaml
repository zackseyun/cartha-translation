base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: pt
  text: 'Quando ouviram isso, ficaram com o coração traspassado[a] e disseram a Pedro e aos demais apóstolos: “O que devemos fazer, irmãos[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram profundamente abalados no coração”. A expressão grega descreve forte convicção ou aflição interior, como se o coração tivesse sido perfurado.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “homens, irmãos”, forma convencional de tratamento que, conforme o contexto, pode equivaler a “irmãos” ou “irmãos e irmãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quando ouviram isso
  rationale: O particípio aoristo introduz a reação ao discurso anterior de Pedro. “Isso” é naturalmente suprido pelo contexto; δέ marca a progressão narrativa e não exige uma palavra separada em português.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: ficaram com o coração traspassado
  rationale: Preserva a metáfora incisiva do grego e expressa forte convicção ou aflição interior em linguagem digna e compreensível.
- source_word: εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: e disseram a Pedro e aos demais apóstolos
  rationale: Traduz diretamente o verbo de dizer e mantém a distinção entre Pedro e os apóstolos restantes.
- source_word: Τί ποιήσωμεν
  choice: o que devemos fazer?
  rationale: O subjuntivo aoristo deliberativo pede orientação sobre a conduta apropriada; “devemos” comunica isso naturalmente em português contemporâneo.
- source_word: ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: Forma convencional de tratamento; “irmãos” preserva o termo familiar sem a duplicação pouco natural de “homens, irmãos”.
theological_decisions:
- issue: Alcance de gênero da expressão ἄνδρες ἀδελφοί
  choice: Irmãos
  alternative: Homens, irmãos; irmãos e irmãs
  rationale: A forma grega é masculina, mas pode funcionar como tratamento convencional dirigido ao grupo. O texto principal conserva a forma masculina sem decidir silenciosamente que a referência exclui mulheres; a nota registra a possível abrangência contextual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem da pergunta foi ajustada para soar idiomática, sem alterar o conteúdo. O registro mantém dignidade narrativa e preserva a metáfora do original.
