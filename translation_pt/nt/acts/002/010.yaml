  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: pt
  text: a Frígia e a Panfília, o Egito e as regiões da Líbia próximas de Cirene[a], e os romanos que estavam de passagem[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as regiões da Líbia ao redor de Cirene”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os romanos que estavam ali temporariamente” ou “os visitantes romanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: a Frígia e a Panfília
  rationale: Emprega os nomes geográficos tradicionais em português e reproduz com naturalidade a ligação dos dois itens na enumeração.
- source_word: Αἴγυπτον
  choice: o Egito
  rationale: Forma consagrada do nome do país em português.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: as regiões da Líbia
  rationale: Neste contexto geográfico, “regiões” comunica de modo mais natural do que o literal “partes” as áreas da Líbia mencionadas pelo autor.
- source_word: τῆς κατὰ Κυρήνην
  choice: próximas de Cirene
  rationale: κατά relaciona essa parte da Líbia com Cirene sem definir com precisão se a ideia é proximidade, entorno ou direção; “próximas de” conserva a referência regional sem impor limites políticos.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: os romanos que estavam de passagem
  rationale: O particípio indica romanos presentes temporariamente no lugar. “De passagem” é atual e claro, sem sugerir residência permanente.
