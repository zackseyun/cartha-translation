translation_notes:
  register: Português moderno, digno e acessível, com nomes geográficos tradicionais. A estrutura permanece como parte da enumeração iniciada nos versículos anteriores. O marcador [a] foi colocado junto à expressão sobre a Líbia e Cirene, à qual a alternativa se refere.
