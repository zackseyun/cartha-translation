id: ACT.2.22
reference: Acts 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: pt
  text: 'Homens de Israel, escutem estas palavras: Jesus, o Nazareno[a], um homem confirmado por Deus diante de vocês mediante milagres[b], prodígios e sinais que Deus realizou por meio dele entre vocês, como vocês mesmos sabem —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus de Nazaré” ou “Jesus, o Nazoreu”. O título grego Ναζωραῖος admite mais de uma tradução natural.
    reason: lexical_alternative
  - marker: b
    text: Ou “obras poderosas”. Neste contexto, o grego δυνάμεσι pode designar literalmente manifestações de poder ou, de modo idiomático, milagres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  rationale: Preserva tanto o vocativo masculino ἄνδρες quanto a identificação étnica Ἰσραηλῖται, em formulação natural no português atual.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: escutem estas palavras
  rationale: O imperativo pede atenção imediata; “estas palavras” mantém o sentido concreto de λόγους sem ampliá-lo para “mensagem”.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, o Nazareno
  rationale: Mantém a força descritiva ou titular de Ναζωραῖος e continua compreensível em português; a nota registra alternativas naturais.
- source_word: ἄνδρα
  choice: um homem
  rationale: Traduz diretamente o substantivo masculino e preserva a afirmação explícita da humanidade de Jesus.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ
  choice: confirmado por Deus
  rationale: Expressa que Deus demonstrou ou atestou publicamente quem Jesus era, evitando a possível conotação meramente burocrática de “credenciado” e a ambiguidade moral de “aprovado”.
- source_word: εἰς ὑμᾶς
  choice: diante de vocês
  rationale: Comunica a apresentação ou confirmação pública dirigida aos ouvintes e distingue esta expressão de ἐν μέσῳ ὑμῶν, traduzida depois por “entre vocês”.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: milagres, prodígios e sinais
  rationale: “Milagres” comunica de modo claro as manifestações de poder indicadas por δυνάμεσι; “prodígios e sinais” preserva a tríade tradicional e seu paralelismo.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: que Deus realizou por meio dele
  rationale: Mantém Deus como sujeito explícito das obras e Jesus como agente mediador, conforme δι’ αὐτοῦ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: entre vocês
  rationale: É a forma corrente e natural de exprimir o sentido idiomático de algo ocorrido no meio da comunidade.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: como vocês mesmos sabem
  rationale: “Vocês mesmos” preserva a ênfase de αὐτοὶ.
theological_decisions:
- issue: Formulação cristológica de ἄνδρα
  choice: Manter “um homem” no texto principal
  alternative: “uma pessoa” ou omitir o substantivo
  rationale: O grego afirma explicitamente ἄνδρα. A tradução preserva a humanidade real de Jesus sem fazer inferências contrárias à cristologia mais ampla do Novo Testamento.
- issue: Agência na realização dos milagres
  choice: “que Deus realizou por meio dele”
  alternative: “que ele realizou” ou uma formulação que não identifique o agente principal
  rationale: O texto apresenta ὁ θεός como sujeito e δι’ αὐτοῦ como indicação da mediação de Jesus. Essa tensão deve permanecer explícita, sem ser harmonizada ou enfraquecida.
- issue: Sentido da confirmação divina
  choice: “confirmado por Deus diante de vocês”
  alternative: “aprovado por Deus” ou “credenciado por Deus”
  rationale: “Confirmado” comunica a demonstração pública proporcionada pelas obras, sem reduzir a expressão a aprovação moral nem importar uma noção institucional moderna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivamente formal; “Homens de Israel” preserva o gênero e o caráter direto do vocativo. O travessão final mantém a continuidade sintática com o versículo seguinte.
