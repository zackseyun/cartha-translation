  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: pt
  text: E eles se dedicavam ao ensino dos apóstolos e à comunhão[a], ao partir do pão[b] e às orações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à partilha» ou «à participação».
    reason: lexical_alternative
  - marker: b
    text: «O partir do pão» pode se referir a refeições em comum em geral, embora muitos entendam que aqui também inclua a Ceia do Senhor.
    reason: alternative_reading
  - marker: c
    text: Ou «às orações estabelecidas»; o artigo pode sugerir horários ou formas reconhecidos de oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: E eles se dedicavam
  rationale: A construção perifrástica no imperfeito expressa uma prática contínua e habitual no passado; «se dedicavam» comunica tanto a perseverança quanto o compromisso constante.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: ao ensino dos apóstolos
  rationale: «Ensino» é natural e atual, sem a conotação mais sistematizada que «doutrina» pode ter. O genitivo indica, mais provavelmente, o ensino transmitido pelos apóstolos.
- source_word: τῇ κοινωνίᾳ
  choice: à comunhão
  rationale: «Comunhão» preserva a ideia ampla de vida, participação e partilha em comum, sem restringir o termo apenas a bens materiais ou a um rito.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: ao partir do pão
  rationale: A expressão natural em português mantém a formulação característica de Lucas–Atos e não decide se a referência é somente a refeições compartilhadas ou se inclui a Ceia do Senhor.
- source_word: ταῖς προσευχαῖς
  choice: às orações
  rationale: O plural com artigo é preservado e pode apontar para orações, horários ou formas de oração reconhecidos pela comunidade.
theological_decisions:
- issue: Se κλάσει τοῦ ἄρτου deve ser traduzido explicitamente como Ceia do Senhor ou Eucaristia
  choice: ao partir do pão
  alternative: à Ceia do Senhor; à Eucaristia; às refeições comunitárias que incluíam a Ceia do Senhor
  rationale: A expressão pode designar refeições compartilhadas e, no contexto cristão, talvez inclua a refeição memorial de Jesus, mas o texto não exige uma interpretação sacramental técnica. A formulação ampla preserva essa tensão.
- issue: Se κοινωνία deve ser limitada à partilha financeira ou à comunhão sacramental
  choice: à comunhão
  alternative: à partilha; à participação; ao compartilhamento de bens
  rationale: O termo abrange participação e vida comum, possivelmente com dimensões materiais e espirituais. Uma tradução mais estreita resolveria indevidamente sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação da lista segue de perto o grego, enquanto «ao partir do pão» evita uma construção excessivamente literal e pouco natural. Todos os artigos relevantes foram representados.
