  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: pt
  text: Dia após dia, perseveravam unidos no mesmo propósito nos pátios do templo[a]; partiam o pão de casa em casa[b] e partilhavam do alimento[c] com alegria e simplicidade de coração[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no complexo do templo, não especificamente no santuário interior.
    reason: cultural_note
  - marker: b
    text: “Partir o pão” pode referir-se a refeições comuns compartilhadas, embora alguns entendam que a expressão também inclui a Ceia do Senhor.
    reason: alternative_reading
  - marker: c
    text: Ou “as refeições”.
    reason: lexical_alternative
  - marker: d
    text: Ou “sinceridade de coração” ou “generosidade de coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Dia após dia
  rationale: Expressa naturalmente em português o valor distributivo e reiterado de κατά com acusativo.
- source_word: προσκαρτεροῦντες
  choice: perseveravam
  rationale: O imperfeito português comunica a ação contínua do particípio presente e preserva a ideia de persistência.
- source_word: ὁμοθυμαδόν
  choice: unidos no mesmo propósito
  rationale: Conserva tanto a dimensão comunitária quanto a convergência de intenção, em linguagem atual.
- source_word: ἐν τῷ ἱερῷ
  choice: nos pátios do templo
  rationale: ἱερόν designa o complexo do templo, não especificamente o santuário interior; a expressão torna essa distinção clara.
- source_word: κλῶντές ... ἄρτον
  choice: partiam o pão
  rationale: Mantém a expressão convencional de Lucas-Atos sem limitá-la a uma refeição comum nem defini-la explicitamente como celebração sacramental.
- source_word: κατ’ οἶκον
  choice: de casa em casa
  rationale: Reproduz o sentido distributivo, indicando a prática em diferentes casas.
- source_word: μετελάμβανον τροφῆς
  choice: compartilhavam as refeições
  rationale: Traduz de modo natural a participação contínua no alimento dentro do contexto comunitário, sem sugerir mera recepção passiva.
- source_word: ἐν ἀγαλλιάσει
  choice: com alegria
  rationale: Comunica de forma clara e digna a alegria intensa indicada pelo substantivo grego.
- source_word: ἀφελότητι καρδίας
  choice: simplicidade de coração
  rationale: Permanece próxima da formulação grega e preserva sua amplitude sem reduzi-la exclusivamente a sinceridade ou generosidade.
theological_decisions:
- issue: Se «partir o pão» deve ser explicitado como Ceia do Senhor/Eucaristia
  choice: Manter a expressão ampla «partiam o pão» no contexto das refeições compartilhadas.
  alternative: Entender a expressão somente como refeições comuns ou traduzi-la como referência explícita à Ceia do Senhor.
  rationale: Em Lucas-Atos, a expressão pode indicar comunhão à mesa e também admitir ressonância eucarística. A menção imediata a τροφή favorece refeições comunitárias, mas não elimina a possível dimensão litúrgica; por isso, a tradução preserva a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação organiza os três movimentos do versículo sem eliminar sua continuidade. «Unidos no mesmo propósito» evita a formulação antiquada «de comum acordo», e as notas preservam as ambiguidades lexical e teológica do grego.
