    issue: «compartilhavam as refeições» para μετελάμβανον τροφῆς
    rationale: O verbo μετελάμβανον com genitivo significa ‘participavam de’ ou ‘tomavam parte de’; «compartilhavam» pode sugerir que eles distribuíam as refeições. «Partilhavam do alimento» mantém a participação no alimento e a abertura contextual à comunhão à mesa.
