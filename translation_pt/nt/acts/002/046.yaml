revisions:
- from: Dia após dia, perseveravam unidos no mesmo propósito nos pátios do templo[a]; partiam o pão de casa em casa[b] e compartilhavam as refeições[c] com alegria e simplicidade de coração[d].
  to: Dia após dia, perseveravam unidos no mesmo propósito nos pátios do templo[a]; partiam o pão de casa em casa[b] e partilhavam do alimento[c] com alegria e simplicidade de coração[d].
  rationale: A revisão substitui apenas a formulação que poderia atribuir ao verbo a ideia de distribuir ou compartilhar refeições. «Partilhavam do alimento» corresponde mais diretamente a μετελάμβανον τροφῆς e continua natural em português moderno. A nota c foi ajustada para que a alternativa lexical corresponda à relação entre «alimento» e «refeições».
