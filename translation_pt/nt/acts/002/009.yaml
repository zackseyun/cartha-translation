  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: pt
  text: Partos, medos e elamitas, e os que habitam na Mesopotâmia, na Judeia e na Capadócia, no Ponto e na Ásia[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, situada no oeste da Ásia Menor, e não o continente moderno.
