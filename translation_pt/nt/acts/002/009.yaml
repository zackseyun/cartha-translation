lexical_decisions:
- source_word: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται
  choice: partos, medos e elamitas
  rationale: Emprega as formas tradicionais e reconhecíveis em português para esses povos, preservando a sequência do grego sem reproduzir de modo artificial cada ocorrência de καί.
- source_word: οἱ κατοικοῦντες
  choice: os que habitam
  rationale: O particípio presente substantivado designa pessoas residentes nesses lugares; a formulação é clara, atual e mantém o valor verbal do original.
- source_word: τὴν Μεσοποταμίαν
  choice: na Mesopotâmia
  rationale: Usa o nome geográfico consagrado em português e a preposição exigida naturalmente por «habitam».
- source_word: Ἰουδαίαν τε καὶ Καππαδοκίαν
  choice: na Judeia e na Capadócia
  rationale: Representa τε καί por uma coordenação natural em português. A leve força associativa ou aditiva da expressão não requer uma construção marcada neste contexto.
- source_word: Πόντον
  choice: no Ponto
  rationale: «Ponto» é a forma portuguesa tradicional do nome da região histórica; o artigo integra a regência natural em português.
- source_word: τὴν Ἀσίαν
  choice: na Ásia
  rationale: Mantém o nome empregado no texto, enquanto a nota esclarece que se trata da província romana, não do continente moderno.
