  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: pt
  text: 'E, com muitas outras palavras, ele deu testemunho solene e continuou a exortá-los, dizendo: “Sejam salvos desta geração perversa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salvem-se desta geração perversa”. O verbo grego está na voz passiva (“sejam salvos”), mas a alternativa expressa de modo mais ativo a resposta exigida dos ouvintes.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: com muitas outras palavras
  rationale: Expressão natural em português que preserva tanto ἑτέροις (“outras”) quanto πλείοσιν (“muitas/mais numerosas”) e apresenta o meio pelo qual Pedro prosseguiu falando.
- source_word: διεμαρτύρατο
  choice: deu testemunho solene
  rationale: Preserva a força enfática e solene de διαμαρτύρομαι sem reduzir o verbo apenas à ideia de advertir.
- source_word: παρεκάλει
  choice: continuou a exortá-los
  rationale: O imperfeito indica ação contínua ou reiterada; “continuou a exortar” comunica esse aspecto e a força apelativa de παρακαλέω.
- source_word: Σώθητε
  choice: Sejam salvos
  rationale: Mantém a voz passiva do imperativo aoristo de σῴζω e, ao mesmo tempo, conserva sua força de apelo dirigido aos ouvintes.
- source_word: ἀπὸ τῆς γενεᾶς
  choice: desta geração
  rationale: Em português, “ser salvo desta geração” expressa naturalmente a separação indicada por ἀπό e mantém o sentido lexical de γενεά.
- source_word: σκολιᾶς
  choice: corrompida
  rationale: No contexto moral, “corrompida” é claro e corrente em português. Embora não reproduza literalmente a imagem espacial de algo “torto”, comunica de modo natural a perversão moral indicada por σκολιός.
theological_decisions:
- issue: Voz e agência em Σώθητε
  choice: Sejam salvos
  alternative: Salvem-se
  rationale: O grego emprega um imperativo passivo. A tradução preserva essa voz para não sugerir uma capacidade autônoma de autossalvação que o texto não afirma, sem eliminar o chamado real dos ouvintes a responder.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Deu testemunho solene” mantém o tom formal do verbo grego; “continuou a exortá-los” explicita o aspecto contínuo do imperfeito. A nota conserva a alternativa tradicional sem apagar a voz passiva do original.
