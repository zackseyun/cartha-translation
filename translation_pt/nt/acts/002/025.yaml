  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: pt
  text: 'Pois Davi diz a respeito dele: “Eu via[a] o Senhor[b] sempre diante de mim, porque ele está à minha direita, para que eu não seja abalado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu via antecipadamente o Senhor sempre diante de mim”. Em certos contextos, o verbo grego pode significar “ver antecipadamente”; aqui, porém, as expressões ao redor favorecem o sentido de ver continuamente o Senhor diante de si.'
    reason: lexical_alternative
  - marker: b
    text: Pedro cita o Salmo 16:8. No texto hebraico do salmo, encontra-se aqui o nome divino, muitas vezes representado nas traduções como “SENHOR”.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: diz a respeito dele
  rationale: Neste contexto introdutório de citação, εἰς αὐτόν indica referência a alguém, não discurso dirigido diretamente a ele.
- source_word: Προορώμην
  choice: Eu mantinha ... diante de mim
  rationale: O imperfeito expressa ação contínua ou habitual; com ἐνώπιόν μου e διὰ παντός, a formulação comunica a ideia de conservar continuamente o Senhor diante de si, sem lhe dar sentido necessariamente preditivo.
- source_word: κύριον
  choice: o Senhor
  rationale: Reproduz naturalmente κύριον sem resolver no texto a tensão entre a forma grega da citação, sua origem no Salmo e sua aplicação cristológica por Pedro.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: sempre diante de mim
  rationale: Preserva a imagem relacional e espacial e traduz de modo natural a continuidade indicada pela expressão.
- source_word: ἐκ δεξιῶν μού
  choice: à minha direita
  rationale: Equivalente idiomático em português para a posição ao lado direito, que no contexto sugere amparo e estabilidade sem explicitar essa inferência.
- source_word: ἵνα μὴ σαλευθῶ
  choice: para que eu não seja abalado
  rationale: Mantém a construção de finalidade ou resultado com o subjuntivo e a metáfora de perder a estabilidade.
theological_decisions:
- issue: Referente de “o Senhor” na citação do Salmo conforme usada por Pedro
  choice: Manter “o Senhor” sem identificação adicional no texto
  alternative: “o SENHOR” ou “o Messias”
  rationale: O grego de Atos traz κύριον, enquanto Pedro aplica a passagem cristologicamente e o texto hebraico do Salmo contém o nome divino. A tradução preserva essa tensão em vez de impor uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Mantinha ... diante de mim” soa mais natural em português do que uma reprodução literal como “continuava vendo”, ao mesmo tempo que conserva o aspecto contínuo do imperfeito. Os marcadores foram colocados após a unidade da citação à qual as duas notas se referem.
