base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: pt
  text: Todos os que criam estavam juntos[a] e tinham tudo em comum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam reunidos no mesmo lugar”. A expressão grega pode indicar que estavam juntos ou reunidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Todos
  rationale: Preserva a força abrangente de πάντες ao modificar o grupo expresso pelo particípio substantivado.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δὲ marca uma continuação narrativa leve; em português, a sequência é natural sem uma conjunção explícita, evitando sugerir contraste.
- source_word: οἱ πιστεύοντες
  choice: os que criam
  rationale: Representa naturalmente o particípio presente substantivado e, no contexto narrativo, identifica aqueles que haviam abraçado a fé, sem acrescentar um objeto não expresso no grego.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: estavam juntos
  rationale: Traduz o sentido comunitário usual da expressão de modo natural, preservando em nota a possibilidade locativa de estarem reunidos no mesmo lugar.
- source_word: εἶχον
  choice: tinham
  rationale: O imperfeito é vertido pelo pretérito imperfeito português, que comunica adequadamente uma situação contínua ou habitual.
- source_word: ἅπαντα κοινά
  choice: tudo em comum
  rationale: Expressão portuguesa corrente que conserva a abrangência de ἅπαντα e a ideia de bens ou recursos compartilhados, sem explicitar mais do que o texto.
theological_decisions:
- issue: Natureza da vida compartilhada da comunidade
  choice: O versículo descreve que os que criam mantinham tudo em comum.
  alternative: Entender o relato como prescrição explícita de um sistema econômico normativo para todas as comunidades cristãs.
  rationale: A forma grega relata uma prática da comunidade; não contém aqui uma ordem nem formula explicitamente uma regra universal. A tradução permanece descritiva e não impõe uma conclusão doutrinária ou política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Os que criam” mantém proximidade com a estrutura grega; “tudo em comum” é idiomático e evita explicar em excesso a natureza ou a extensão concreta da partilha.
