source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: pt
  text: Todos ficaram cheios do Espírito Santo e começaram a falar em outras línguas[a], conforme o Espírito lhes concedia falar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “outros idiomas”. A palavra grega pode designar tanto a língua como órgão da fala quanto uma língua falada; no contexto seguinte, os ouvintes entendem a fala como línguas humanas reconhecíveis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: ficaram cheios
  rationale: O aoristo passivo de πίμπλημι indica que o grupo foi cheio ou capacitado; “ficaram cheios” expressa naturalmente tanto o resultado quanto o início desse estado no relato.
- source_word: πάντες
  choice: todos
  rationale: Preserva a ênfase na totalidade do grupo presente e ocupa uma posição natural no início da frase em português.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: No contexto de Atos 2, a expressão se refere ao Espírito divino prometido por Jesus. O artigo e as iniciais maiúsculas são naturais em português para esse referente específico.
- source_word: ἤρξαντο λαλεῖν
  choice: começaram a falar
  rationale: Reproduz com clareza o valor ingressivo de ἄρχομαι com infinitivo, marcando o início da ação.
- source_word: ἑτέραις γλώσσαις
  choice: em outras línguas
  rationale: “Línguas” corresponde diretamente a γλώσσαις e mantém, em português, sua amplitude lexical, enquanto “outras” traduz ἑτέραις e indica fala diferente da habitual.
- source_word: καθὼς
  choice: conforme
  rationale: Introduz naturalmente a maneira ou medida segundo a qual a fala ocorria, sem sugerir mera simultaneidade.
- source_word: ἐδίδου
  choice: concedia
  rationale: O imperfeito apresenta a ação contínua do Espírito. “Concedia” comunica que a capacidade de falar procedia dele, sem acrescentar uma explicação doutrinária.
- source_word: ἀποφθέγγεσθαι
  choice: que se expressassem
  rationale: O verbo denota proferir ou falar de modo audível e articulado, por vezes com força pública ou solene. “Que se expressassem” é corrente em português e evita o substantivo menos natural “elocução”.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo é representado naturalmente pelo objeto indireto “lhes” junto de “concedia”.
theological_decisions:
- issue: Se πνεύματος ἁγίου deve ser entendido como referência divina pessoal ou como “espírito santo” genérico.
  choice: Espírito Santo
  alternative: espírito santo
  rationale: O contexto identifica o referente como o Espírito prometido e como agente da capacitação na segunda oração. A forma adotada comunica essa referência específica sem desenvolver doutrina além do texto.
- issue: Se γλώσσαις deve ser explicitado como “idiomas” ou mantido como “línguas”.
  choice: outras línguas
  alternative: outros idiomas
  rationale: “Línguas” preserva a amplitude do termo grego e permite que o desenvolvimento narrativo esclareça a natureza da fala. A nota registra a alternativa mais explícita, pois Atos 2:6–11 mostra ouvintes reconhecendo suas próprias línguas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a progressão narrativa e evita terminologia técnica ou denominacional. “Conforme” e “se expressassem” mantêm fluidez sem apagar a ação capacitadora do Espírito.
