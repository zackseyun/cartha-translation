id: ACT.2.41
reference: Acts 2:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: pt
  text: Assim, os que acolheram a palavra dele foram batizados, e naquele dia foram acrescentadas cerca de três mil almas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pessoas”. No grego, “almas” é uma maneira comum de contar seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Assim, os que
  rationale: A combinação de partículas dá continuidade à narrativa e apresenta o resultado da exortação anterior. “Assim” expressa essa progressão de modo natural em português.
- source_word: ἀποδεξάμενοι
  choice: acolheram
  rationale: O verbo indica recepção favorável e voluntária da mensagem. “Acolheram” preserva essa nuance positiva sem tornar explícita uma formulação doutrinária adicional.
- source_word: τὸν λόγον αὐτοῦ
  choice: a palavra dele
  rationale: “Palavra” mantém transparência lexical em relação a λόγος e, no contexto, designa a mensagem proclamada por Pedro. “Dele” explicita naturalmente o pronome grego sem substituir o termo por “mensagem”.
- source_word: ἐβαπτίσθησαν
  choice: foram batizados
  rationale: A forma passiva do aoristo é reproduzida diretamente, sem acrescentar interpretação sobre modo, agentes ou eficácia do batismo.
- source_word: προσετέθησαν
  choice: foram acrescentadas
  rationale: A tradução conserva a voz passiva e deixa implícito, como no grego, a quem essas pessoas foram acrescentadas.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: É a forma temporal corrente e natural em português.
- source_word: ψυχαὶ
  choice: almas
  rationale: “Almas” reproduz formalmente ψυχαί e conserva o estilo bíblico de contar seres humanos. Uma nota esclarece que, neste uso, o termo pode significar pessoas, evitando que se imponha ao versículo uma afirmação antropológica técnica.
- source_word: ὡσεὶ τρισχίλιαι
  choice: cerca de três mil
  rationale: “Cerca de” comunica com naturalidade o valor aproximativo de ὡσεί.
theological_decisions:
- issue: Objeto implícito de “foram acrescentadas”
  choice: Manter o objeto implícito
  alternative: “foram acrescentadas a eles” ou “foram acrescentadas à igreja”
  rationale: O contexto indica incorporação à comunidade dos que criam, mas este versículo não declara expressamente o objeto. A tradução não acrescenta uma identificação eclesiológica além do texto.
- issue: Sentido antropológico de ψυχαί
  choice: Usar “almas” no texto e esclarecer o sentido idiomático em nota
  alternative: “pessoas” ou “seres humanos” no texto principal
  rationale: A escolha mantém visível o termo grego, enquanto a nota impede que “almas” seja entendida necessariamente como referência técnica a uma parte imaterial do ser humano.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para “naquele dia” soar natural, sem alterar as relações do texto. O marcador da nota foi colocado junto a “almas”, o termo ao qual a explicação lexical se refere.
