language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: pt
  text: 'Pedro, porém, pondo-se de pé com os onze, levantou a voz e lhes declarou: “Homens da Judeia[a] e todos vocês que moram em Jerusalém, saibam disto e prestem atenção às minhas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Homens judeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: pondo-se de pé
  rationale: O particípio aoristo de ἵστημι introduz a ação e a postura de Pedro. A formulação é natural em português e conserva melhor o aspecto de ele tomar posição do que o simples estado “estando de pé”.
- source_word: δὲ
  choice: porém
  rationale: Assinala a transição contrastiva em relação à acusação dos zombadores no versículo anterior, sem tornar o contraste excessivamente forte.
- source_word: σὺν τοῖς ἕνδεκα
  choice: com os onze
  rationale: Reproduz de modo direto e claro a ideia de companhia expressa por σύν com o dativo.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: levantou a voz
  rationale: Expressão idiomática portuguesa que comunica que Pedro falou em voz alta diante da multidão.
- source_word: ἀπεφθέγξατο
  choice: declarou
  rationale: O verbo designa uma fala pública, enfática ou solene. “Declarou” mantém esse peso sem afirmar explicitamente uma inspiração que o verbo, por si só, não exige.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Homens da Judeia
  rationale: Mantém o vocativo masculino ἄνδρες e oferece uma formulação portuguesa natural para Ἰουδαῖοι neste contexto de Jerusalém. A possível leitura identitária “homens judeus” é preservada em nota.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: todos vocês que moram em Jerusalém
  rationale: Expressa com clareza o particípio presente κατοικοῦντες e torna explícita, de modo natural no discurso direto, a referência aos ouvintes.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: saibam disto
  rationale: Forma imperativa idiomática e concisa que preserva a força da declaração formal grega.
- source_word: ἐνωτίσασθε
  choice: prestem atenção
  rationale: O imperativo pede escuta atenta, não apenas percepção auditiva. A expressão é moderna, clara e mantém essa intensidade.
- source_word: τὰ ῥήματά μου
  choice: às minhas palavras
  rationale: Tradução direta de ῥήματα, preservando a referência ao que Pedro está prestes a dizer sem ampliar para “mensagem”.
theological_decisions:
- issue: Especificidade de gênero em Ἄνδρες
  choice: Homens da Judeia
  alternative: Povo da Judeia
  rationale: Ἄνδρες é explicitamente masculino. A tradução conserva essa forma de tratamento em vez de neutralizá-la.
- issue: Sentido geográfico ou identitário de Ἰουδαῖοι
  choice: da Judeia
  alternative: judeus
  rationale: No cenário de Jerusalém, a leitura geográfica é adequada, mas o adjetivo grego também pode designar a identidade judaica. A nota registra a alternativa sem eliminar a ambiguidade lexical.
- issue: Possível conotação inspirada de ἀπεφθέγξατο
  choice: declarou
  alternative: falou sob inspiração
  rationale: Embora o verbo possa ocorrer em contextos de fala solene ou capacitada pelo Espírito, ele não codifica sozinho uma afirmação explícita de inspiração. A tradução evita acrescentar essa interpretação ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto conserva o tom público e solene sem recorrer a construções arcaicas como “dai ouvidos”.
