source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: pt
  text: Pois a promessa é para vocês, para os seus filhos e para todos os que estão longe[a] — todos quantos o Senhor, nosso Deus, chamar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todos os que estão distantes». A expressão pode referir-se aos que estão geograficamente longe, aos que estão distantes quanto à aliança, ou a ambos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todos aqueles a quem o Senhor, nosso Deus, chamar».'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Preserva a ligação explicativa com a exortação do versículo anterior de modo natural e digno em português.
- source_word: ἐπαγγελία
  choice: a promessa
  rationale: Traduz diretamente o substantivo grego sem substituí-lo pelo conteúdo prometido, embora o contexto imediato mencione o dom do Espírito Santo.
- source_word: τέκνοις
  choice: filhos
  rationale: Mantém o sentido familiar comum de τέκνα e permite, sem impor, uma referência mais ampla à descendência.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: todos os que estão longe
  rationale: Conserva a imagem de distância e não decide se ela é geográfica, relacionada à aliança ou ambas.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: todos quantos ... chamar
  rationale: A expressão portuguesa com futuro do subjuntivo comunica naturalmente o grupo indefinido, porém abrangente, expresso por ὅσους ἂν com o subjuntivo grego. Evita acrescentar explicitamente «para si», ideia não lexicalizada de modo inequívoco.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: o Senhor, nosso Deus
  rationale: Retém tanto o título κύριος como a identificação ὁ θεὸς ἡμῶν; as vírgulas apresentam «nosso Deus» como aposição natural em português.
theological_decisions:
- issue: Alcance de «os que estão longe»
  choice: Formulação ampla, sem identificar exclusivamente judeus da diáspora ou gentios.
  alternative: Entender a expressão apenas como distância geográfica, apenas como distância da aliança ou especificamente como referência aos gentios.
  rationale: A expressão grega admite ressonâncias geográficas e relacionadas à aliança; o próprio versículo não obriga a uma delimitação exclusiva.
- issue: Natureza do chamado divino em ὅσους ἂν προσκαλέσηται
  choice: Traduzir simplesmente «todos quantos o Senhor, nosso Deus, chamar».
  alternative: Explicitar um chamado eficaz em sentido reformado ou um convite geral.
  rationale: O texto afirma o chamado de Deus, mas não define aqui seu mecanismo soteriológico. A tradução preserva a afirmação sem importar um sistema denominacional.
- issue: Relação sintática de ὅσους ἂν προσκαλέσηται com o que precede
  choice: Apresentar «todos quantos...» como explicação ou delimitação do alcance dos grupos mencionados, mediante travessão.
  alternative: Ligar a oração apenas a «todos os que estão longe».
  rationale: A construção grega permite debate quanto ao alcance preciso da oração final. A pontuação escolhida favorece sua força explicativa abrangente sem reescrever a sintaxe como uma interpretação explícita.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Vocês» evita a regionalidade de «vós», enquanto «Pois», «todos quantos» e a aposição «o Senhor, nosso Deus» preservam a dignidade bíblica sem arcaísmo excessivo. O travessão torna perceptível a qualificação final e evita resolver silenciosamente todas as possibilidades de seu alcance sintático.
