id: ACT.2.31
reference: Acts 2:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: pt
  text: 'Prevendo isso, ele falou a respeito da ressurreição do Messias[a]: ele não foi abandonado ao Hades[b], nem a sua carne sofreu decomposição[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego “Christos”; aqui traduzido por “Messias” porque o sentido de título se destaca no apelo de Pedro às Escrituras. Tradicionalmente, “Cristo”.
    reason: alternative_reading
  - marker: b
    text: '“Hades” refere-se ao domínio dos mortos, não especificamente ao lugar final de juízo. Também se pode traduzir: “não foi abandonado no Hades” ou “não foi deixado no Hades”.'
    reason: cultural_note
  - marker: c
    text: Literalmente, “viu corrupção” ou “viu decomposição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Prevendo isso
  rationale: O particípio aoristo indica percepção antecipada em relação ao ato de falar. “Isso” é retomado do contexto para tornar a expressão natural em português.
- source_word: ἐλάλησεν
  choice: ele falou
  rationale: Mantém o sentido comum de λαλέω e se ajusta naturalmente ao contexto de uma declaração profética.
- source_word: περὶ τῆς ἀναστάσεως
  choice: a respeito da ressurreição
  rationale: περί com genitivo significa “a respeito de” ou “acerca de”; a formulação escolhida é clara e digna em português atual.
- source_word: τοῦ χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός funciona de modo destacado como título do ungido prometido nas Escrituras, e não meramente como nome próprio.
- source_word: οὔτε ἐγκατελείφθη
  choice: não foi abandonado
  rationale: O passivo de ἐγκαταλείπω comunica ser deixado para trás ou abandonado. “Abandonado” preserva a força do verbo.
- source_word: εἰς ᾅδην
  choice: no Hades
  rationale: Embora εἰς normalmente indique movimento para dentro, com o verbo passivo neste contexto a expressão comunica que ele não permaneceu abandonado no domínio dos mortos. “No Hades” é natural em português e não confunde o termo com o lugar do juízo final.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: a sua carne
  rationale: σάρξ tem aqui sentido físico e concreto. “Carne” preserva o vocabulário da citação e realça a realidade corporal da ressurreição.
- source_word: εἶδεν διαφθοράν
  choice: sofreu decomposição
  rationale: A expressão literal “viu decomposição” é um idiomatismo semítico pouco natural em português. “Sofreu decomposição” comunica com clareza a deterioração física pretendida, sem alterar o referente corporal.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: No argumento de Pedro baseado nas Escrituras, o sentido titular de “ungido” está em primeiro plano. A nota conserva a forma tradicional como alternativa legítima.
- issue: Tradução de ᾅδης
  choice: Hades
  alternative: mundo dos mortos
  rationale: “Hades” preserva o termo grego e evita identificá-lo indevidamente com o lugar do juízo final. A nota esclarece seu sentido contextual.
- issue: Tradução de σάρξ
  choice: carne
  alternative: corpo
  rationale: O uso é literal e corporal, não ético nem metafórico. “Carne” preserva tanto a forma lexical quanto o vínculo com a citação do salmo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém o paralelismo negativo do grego sem recorrer à construção mais marcada “nem... nem”. Termos teologicamente sensíveis são preservados e explicados em notas, sem impor uma leitura denominacional.
