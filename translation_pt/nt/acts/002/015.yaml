  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: pt
  text: Pois estes não estão bêbados, como vocês supõem, pois é a terceira hora do dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, cerca das nove horas da manhã, segundo a contagem judaica das horas.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois ... não
  rationale: γάρ introduz a explicação ligada ao versículo anterior, e οὐ nega diretamente a acusação; «Pois ... não» preserva o fluxo argumentativo em português natural.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: como vocês supõem
  rationale: ὑπολαμβάνω significa aqui supor, presumir ou pensar; «vocês» mantém a referência direta e oferece ampla legibilidade brasileira.
- source_word: οὗτοι
  choice: estes
  rationale: O demonstrativo aponta para o grupo acusado de embriaguez sem acrescentar «homens» ou «pessoas», termos não expressos no grego.
- source_word: μεθύουσιν
  choice: estão bêbados
  rationale: O presente descreve o estado de embriaguez que lhes era atribuído; esta é uma formulação direta, corrente e fiel.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: visto que ainda é a terceira hora do dia
  rationale: A oração apresenta a razão da rejeição da acusação. «Ainda» explicita naturalmente a relevância pragmática do horário sem converter a expressão antiga no texto principal.
- source_word: ὥρα τρίτη
  choice: a terceira hora do dia
  rationale: Mantém no texto principal a maneira judaica antiga de contar as horas; o equivalente moderno é esclarecido em nota.
