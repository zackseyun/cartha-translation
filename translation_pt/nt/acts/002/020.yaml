id: ACT.2.20
reference: Acts 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: pt
  text: O sol será transformado em trevas, e a lua, em sangue, antes que venha o grande e glorioso[a] dia do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «manifesto» ou «notável».'
    reason: alternativa lexical para ἐπιφανῆ
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: será transformado
  rationale: O futuro passivo expressa uma mudança de estado; a formulação preserva a imagem profética sem explicar seu mecanismo.
- source_word: εἰς σκότος
  choice: em trevas
  rationale: A preposição εἰς indica o estado resultante, e «em trevas» é natural em português.
- source_word: εἰς αἷμα
  choice: em sangue
  rationale: Mantém a imagem forte e literal do grego, sem reduzi-la à interpretação «vermelha como sangue».
- source_word: πρὶν ἢ ἐλθεῖν
  choice: antes que venha
  rationale: Expressa de modo corrente e exato a relação temporal entre os acontecimentos.
- source_word: ἡμέραν κυρίου
  choice: dia do Senhor
  rationale: Conserva a expressão profética reconhecível e evita a possível associação de «dia dominical» com o domingo.
- source_word: κυρίου
  choice: Senhor
  rationale: Traduz diretamente κύριος e mantém a alusão à linguagem profética do Antigo Testamento.
- source_word: μεγάλην
  choice: grande
  rationale: Equivalente direto que preserva o tom elevado da profecia.
- source_word: ἐπιφανῆ
  choice: glorioso
  rationale: No contexto escatológico, comunica de modo natural o caráter esplêndido e marcante do dia, enquanto a nota preserva a dimensão de visibilidade ou notoriedade do termo.
theological_decisions:
- issue: A expressão profética ἡμέραν κυρίου na citação de Joel dentro do discurso de Pedro
  choice: dia do Senhor
  alternative: dia pertencente ao Senhor
  rationale: A formulação tradicional preserva a referência ao dia culminante da intervenção divina sem introduzir uma identificação denominacional nem confundi-la com o domingo.
- issue: O alcance semântico de ἐπιφανῆ
  choice: glorioso
  alternative: manifesto ou notável
  rationale: «Glorioso» transmite bem o tom escatológico em português corrente, mas o adjetivo grego também pode destacar aquilo que se torna visível, evidente ou notável; essa ambiguidade é mantida na nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A elipse em «e a lua, em sangue» evita repetição pesada sem enfraquecer o paralelismo. O marcador foi colocado imediatamente após «glorioso», termo ao qual a nota se refere.
