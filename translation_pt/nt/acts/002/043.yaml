id: ACT.2.43
reference: Acts 2:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: pt
  text: E o temor tomava conta de todos[a], e muitos prodígios e sinais eram realizados por meio dos apóstolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o assombro tomava conta de cada pessoa”. Em grego, literalmente: “o temor vinha sobre cada alma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: o temor tomava conta
  rationale: O imperfeito de γίνομαι com φόβος descreve um estado que se instaurava ou perdurava. “Tomava conta” expressa isso naturalmente em português, sem reduzir a frase a uma simples afirmação estática.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ dá continuidade à narrativa, sem indicar contraste forte; “E” preserva o fluxo do contexto.
- source_word: πάσῃ ψυχῇ
  choice: de todos
  rationale: A expressão grega significa literalmente “de cada alma”, mas funciona idiomaticamente com o sentido de todas as pessoas. “De todos” é claro e natural; a forma literal é preservada em nota.
- source_word: φόβος
  choice: temor
  rationale: “Temor” mantém a amplitude de φόβος, que pode envolver medo e reverência diante da ação divina, sem resolver a tensão em favor apenas de “assombro” ou “reverência”.
- source_word: πολλά
  choice: muitos
  rationale: Equivalente quantitativo corrente e adequado em concordância com “prodígios e sinais”.
- source_word: τέρατα
  choice: prodígios
  rationale: No par τέρατα καὶ σημεῖα, τέρατα destaca o caráter extraordinário e assombroso dos acontecimentos. “Prodígios” preserva a distinção em relação a “sinais”.
- source_word: σημεῖα
  choice: sinais
  rationale: “Sinais” conserva a função indicativa ou reveladora de σημεῖα e corresponde naturalmente ao par tradicional “prodígios e sinais”.
- source_word: διὰ τῶν ἀποστόλων
  choice: por meio dos apóstolos
  rationale: διά com genitivo expressa agência intermediária ou instrumentalidade. “Por meio dos apóstolos” mantém os apóstolos como instrumentos, sem torná-los necessariamente os agentes últimos.
- source_word: ἐγίνετο
  choice: eram realizados
  rationale: O segundo imperfeito descreve acontecimentos repetidos ou contínuos. Com “prodígios e sinais”, “eram realizados” é idiomático e se ajusta à agência instrumental expressa por διά.
theological_decisions:
- issue: Nuance de φόβος diante dos sinais apostólicos
  choice: temor
  alternative: medo; assombro; reverência
  rationale: “Temor” preserva a força lexical e permite que a reação envolva tanto medo quanto reverência ou assombro, sem impor uma interpretação exclusivamente devocional.
- issue: Agência na realização dos prodígios e sinais
  choice: por meio dos apóstolos
  alternative: pelos apóstolos
  rationale: A formulação preserva a instrumentalidade de διά com genitivo e deixa aberta a ação divina implícita como causa última.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Temor”, “prodígios e sinais” e “por meio dos apóstolos” preservam o tom solene e as distinções do grego sem soar excessivamente arcaicos.
