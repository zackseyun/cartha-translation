source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: pt
  text: Este homem, entregue conforme o plano determinado e a presciência de Deus, vocês o mataram, pregando-o numa cruz por meio de homens sem lei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de homens perversos”. A expressão grega também pode designar pessoas alheias à Lei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Este homem
  rationale: O demonstrativo acusativo aponta enfaticamente para Jesus no discurso de Pedro. “Este homem” é natural em português e conserva melhor essa força dêitica do que apenas “ele”.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: conforme o plano determinado
  rationale: A expressão apresenta a entrega de Jesus em conformidade com aquilo que Deus havia estabelecido. “Plano determinado” comunica tanto βουλή, no sentido de plano ou propósito, quanto ὡρισμένῃ, no sentido de definido ou estabelecido.
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: e a presciência de Deus
  rationale: “Presciência” traduz πρόγνωσις com precisão e mantém a distinção formal entre o plano determinado e o conhecimento prévio de Deus, sem explicar além do que o texto afirma.
- source_word: ἔκδοτον
  choice: entregue
  rationale: O adjetivo verbal descreve Jesus como alguém entregue ou dado nas mãos de outros. “Entregue” preserva a concisão e não especifica um agente além do que o contexto permite.
- source_word: διὰ χειρὸς ἀνόμων
  choice: por meio de homens sem lei
  rationale: διά com o genitivo expressa agência mediada. A formulação evita o pouco natural “por meio da mão” e conserva em “sem lei” a amplitude de ἄνομος, que pode caracterizar pessoas contrárias à lei ou fora dela.
- source_word: προσπήξαντες
  choice: pregando-o numa cruz
  rationale: O particípio significa prender ou fixar com pregos. No contexto da execução de Jesus, explicitar a cruz torna clara a ação implícita sem acrescentar uma interpretação doutrinária.
- source_word: ἀνείλατε
  choice: vocês o mataram
  rationale: O verbo significa matar ou eliminar. A forma direta mantém a força da acusação de Pedro e o pronome retoma naturalmente “Este homem” em português.
theological_decisions:
- issue: Relação entre a determinação divina e a responsabilidade humana
  choice: Manter lado a lado o plano determinado e a presciência de Deus, a ação mediadora dos homens sem lei e a acusação direta “vocês o mataram”.
  alternative: Atenuar a determinação divina ou atribuir a morte exclusivamente aos executores imediatos.
  rationale: O grego afirma simultaneamente que Jesus foi entregue em conformidade com o plano e a presciência de Deus e que os ouvintes de Pedro foram responsáveis por sua morte. A tradução preserva essa tensão sem a resolver segundo um sistema teológico.
- issue: Sentido de ἀνόμων
  choice: homens sem lei
  alternative: homens perversos
  rationale: “Sem lei” preserva a possível referência a pessoas fora da Lei, bem como a conotação de desrespeito à lei. “Perversos” expressaria apenas uma avaliação moral e eliminaria essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A ordem da frase conserva o destaque inicial em Jesus e mantém a acusação final direta. “Presciência” é um termo formal, mas preciso e reconhecível neste contexto; “homens sem lei” é deliberadamente mais literal para preservar a ambiguidade do original.
