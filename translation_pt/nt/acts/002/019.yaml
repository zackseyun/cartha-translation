  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: pt
  text: 'E darei prodígios no céu acima e sinais na terra abaixo: sangue, fogo e uma nuvem de fumaça.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “vapor de fumaça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: darei
  rationale: Preserva o sentido direto do futuro de δίδωμι e o modo profético de falar de Deus como aquele que concede ou estabelece os sinais, embora “mostrarei” fosse mais idiomático.
- source_word: τέρατα
  choice: prodígios
  rationale: Expressa fenômenos extraordinários que causam assombro e mantém a associação bíblica corrente com “sinais”, sem restringir o termo a milagres de cura.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: no céu, em cima
  rationale: Mantém tanto a referência cósmica de οὐρανός quanto o contraste vertical explícito de ἄνω com “embaixo”.
- source_word: σημεῖα
  choice: sinais
  rationale: Designa acontecimentos extraordinários que têm significado, preservando a conhecida combinação “prodígios e sinais”.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: na terra, embaixo
  rationale: No contraste com o céu, γῆ tem sentido cósmico de “terra”; “embaixo” reproduz o contraste espacial de κάτω.
- source_word: αἷμα
  choice: sangue
  rationale: Tradução direta que conserva a imagem concreta da profecia.
- source_word: πῦρ
  choice: fogo
  rationale: Tradução direta que conserva a imagem vívida e elementar.
- source_word: ἀτμίδα καπνοῦ
  choice: uma nuvem de fumaça
  rationale: Comunica de modo natural em português a imagem de uma massa visível de fumaça; a formulação mais literal é preservada em nota.
theological_decisions:
- issue: Locais cósmicos na citação de Joel
  choice: céu, em cima ... terra, embaixo
  alternative: firmamento acima ... terra abaixo
  rationale: A oposição entre céu e terra preserva o alcance cósmico e apocalíptico da profecia sem reduzir as imagens a fenômenos apenas meteorológicos ou locais.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. As vírgulas em “no céu, em cima” e “na terra, embaixo” preservam a oposição espacial sem produzir construções excessivamente artificiais.
