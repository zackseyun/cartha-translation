source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male slaves and my female slaves in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: pt
  text: Até mesmo sobre os meus escravos e as minhas escravas, naqueles dias, derramarei do meu Espírito, e profetizarão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί γε
  choice: Até
  rationale: A combinação é enfática e estende a promessa inclusive a pessoas de baixa condição social; “até” expressa essa força com naturalidade em português.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: sobre os meus escravos e as minhas escravas
  rationale: Os substantivos distinguem explicitamente homens e mulheres em condição servil. “Escravos” preserva a condição social baixa e juridicamente subordinada salientada no contexto.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Tradução direta, idiomática e fiel ao valor temporal e demonstrativo da expressão.
- source_word: ἐκχεῶ
  choice: derramarei
  rationale: Mantém a metáfora de verter abundantemente e reproduz de modo natural o futuro do verbo grego.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: do meu Espírito
  rationale: A contração “do” pode expressar a procedência marcada por ἀπό e produz uma formulação natural em português; a nota registra a alternativa tradicional que pode sugerir valor partitivo.
- source_word: προφητεύσουσιν
  choice: eles profetizarão
  rationale: Reproduz diretamente o futuro do verbo e conserva o termo bíblico sem paráfrase desnecessária.
theological_decisions:
- issue: Sentido de δοῦλος/δούλη no contexto da efusão do Espírito
  choice: escravos / escravas
  alternative: servos / servas
  rationale: A menção expressa aos dois sexos e a inclusão enfática de pessoas socialmente subordinadas favorecem “escravos/escravas”. A alternativa lexical é possível, mas enfraquece a ênfase na baixa condição social.
- issue: Valor de ἀπό em ἀπὸ τοῦ πνεύματός μου
  choice: do meu Espírito
  alternative: uma porção do meu Espírito
  rationale: “Do meu Espírito” preserva de maneira concisa a ideia de procedência sem determinar se a expressão deve ser entendida de modo estritamente partitivo. A tradução evita acrescentar uma quantificação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A repetição masculina/feminina foi mantida por ser semanticamente relevante. O pronome “eles” retoma em conjunto os escravos e as escravas segundo o uso abrangente corrente.
