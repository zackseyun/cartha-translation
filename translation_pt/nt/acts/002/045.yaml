source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: pt
  text: E vendiam suas propriedades e seus bens, distribuindo-os entre todos[a], conforme a necessidade de cada um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “suas terras e suas posses”. Os dois termos gregos provavelmente distinguem tipos de bens: κτήματα muitas vezes se refere a propriedades ou terras, enquanto ὑπάρξεις designa mais geralmente aquilo que alguém possui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: propriedades
  rationale: O termo costuma designar propriedades adquiridas, muitas vezes terras ou imóveis; “propriedades” preserva essa ideia e mantém alguma distinção em relação a ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: bens
  rationale: Refere-se de modo geral ao que alguém possui. “Bens” é natural em português e evita repetir “propriedades”.
- source_word: ἐπίπρασκον
  choice: vendiam
  rationale: O imperfeito expressa ação contínua ou repetida no passado, sentido bem comunicado pelo imperfeito português.
- source_word: διεμέριζον
  choice: distribuindo-os
  rationale: No contexto, indica repartir ou destinar os bens, ou o que se obtinha com eles, aos membros da comunidade; “distribuindo” é corrente sem especificar além do texto o mecanismo exato.
- source_word: αὐτά
  choice: -os
  rationale: O pronome retoma conjuntamente “propriedades e bens”. A forma pronominal mantém a concisão e não explicita “o dinheiro” ou “o produto da venda”, que estão apenas implícitos.
- source_word: πᾶσιν
  choice: entre todos
  rationale: Indica amplamente os destinatários no contexto da comunidade; “entre todos” combina naturalmente com “distribuindo”.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: conforme a necessidade de cada um
  rationale: Expressa que a distribuição ocorria de acordo com a necessidade individual, preservando de forma idiomática a força indefinida de ἄν τις.
theological_decisions:
- issue: Natureza da partilha de bens entre os que criam
  choice: O versículo descreve vendas e distribuições repetidas, feitas conforme surgiam necessidades, sem afirmar explicitamente a abolição formal da propriedade privada.
  alternative: Entender o versículo como imposição de propriedade integralmente comunitária a todos os cristãos.
  rationale: Os verbos no imperfeito retratam uma prática contínua ou recorrente. O texto descreve o que acontecia, mas não declara que toda propriedade privada tenha sido abolida nem transforma explicitamente a prática em norma universal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O imperfeito “vendiam” conserva o aspecto contínuo ou repetido do grego. A formulação evita especificar que somente o dinheiro das vendas era distribuído e mantém a descrição sem impor uma doutrina socioeconômica.
