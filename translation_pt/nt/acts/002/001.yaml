source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: pt
  text: Quando se completava o dia de Pentecostes[a], todos estavam juntos no mesmo lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando chegou plenamente o dia de Pentecostes”.'
    reason: Alternativa lexical mais resultativa para συμπληροῦσθαι, em contraste com a nuance processual da tradução principal.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: estava se completando
  rationale: O infinitivo presente passivo, na construção temporal com ἐν τῷ, apresenta o dia em processo de se completar. A formulação preserva essa nuance sem excluir a tradução tradicional indicada em nota.
- source_word: πεντηκοστῆς
  choice: Pentecostes
  rationale: É o nome consagrado em português para a festa judaica celebrada cinquenta dias depois da Páscoa e corresponde diretamente ao termo grego usado no texto.
- source_word: πάντες
  choice: todos eles
  rationale: Expressa a totalidade do grupo retomado do contexto anterior e torna explícito, de modo natural em português, o sujeito implícito do verbo.
- source_word: ὁμοῦ
  choice: reunidos
  rationale: Comunica que o grupo estava junto; em combinação com a locução seguinte, produz uma frase portuguesa natural sem perder a ideia de companhia.
- source_word: ἐπὶ τὸ αὐτό
  choice: no mesmo lugar
  rationale: Preserva a possível nuance locativa da expressão, enquanto ὁμοῦ é representado por 'reunidos'.
theological_decisions:
- issue: Identidade do sujeito implícito em ἦσαν
  choice: todos eles estavam
  alternative: todos estavam
  rationale: O grego não repete o sujeito, que deve ser recuperado do contexto anterior. O pronome 'eles' explicita apenas essa continuidade narrativa, sem decidir de maneira independente quem integrava o grupo.
- issue: Relação entre ὁμοῦ e ἐπὶ τὸ αὐτό
  choice: reunidos no mesmo lugar
  alternative: todos juntos
  rationale: A tradução mantém tanto a união do grupo quanto a possível dimensão espacial, sem reduzir as duas expressões gregas a uma única ideia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Estava se completando' é natural no português do Brasil e conserva melhor o aspecto processual do grego; a nota registra a formulação tradicional e mais resultativa.
