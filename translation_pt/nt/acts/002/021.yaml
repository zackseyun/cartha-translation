id: ACT.2.21
reference: Acts 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: pt
  text: E acontecerá que todo aquele que invocar o nome do Senhor será salvo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem invocar o nome do Senhor”. A frase retoma Joel 2:32, onde “o Senhor” se refere a YHWH; em Atos, Pedro emprega a citação no contexto de sua proclamação a respeito de Jesus.'
    reason: Registra uma tradução alternativa para a construção universal e esclarece a alusão veterotestamentária sem resolver no texto principal a tensão quanto ao referente de “Senhor”.
lexical_decisions:
- source_word: ἔσται
  choice: acontecerá
  rationale: O futuro de εἰμί integra uma fórmula introdutória profética. “Acontecerá” é natural em português, conserva o sentido futuro e mantém um tom bíblico digno sem recorrer ao mais arcaizante “será que”.
- source_word: πᾶς ὃς ἐὰν
  choice: todo aquele que
  rationale: A construção expressa uma condição universal indefinida. “Todo aquele que” preserva claramente o alcance universal e é corrente no português bíblico moderno.
- source_word: ἐπικαλέσηται
  choice: invocar
  rationale: Com “o nome”, ἐπικαλέω indica apelar ou chamar em dependência religiosa. “Invocar” reproduz com precisão a expressão bíblica e é amplamente compreensível em português.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: A tradução literal preserva a fórmula bíblica “invocar o nome”, com suas associações de adoração, confiança e reconhecimento da autoridade divina.
- source_word: κυρίου
  choice: do Senhor
  rationale: κύριος é traduzido de modo não interpretativamente restritivo por “Senhor”. Na construção portuguesa, “o nome do Senhor” representa naturalmente τὸ ὄνομα κυρίου.
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo de σῴζω admite os sentidos de salvar e livrar. “Será salvo” é a formulação portuguesa mais direta e preserva tanto a ideia de livramento quanto as implicações de salvação no contexto de Atos.
theological_decisions:
- issue: Referente de “Senhor” na citação de Joel empregada em Atos
  choice: Manter “Senhor” no texto principal sem explicitar o referente.
  alternative: Identificar expressamente o Senhor como YHWH, conforme o contexto original de Joel, ou como Jesus, conforme a aplicação cristológica no discurso de Pedro.
  rationale: O grego diz κυρίου e não resolve explicitamente o referente neste versículo. A citação remete a Joel, onde o Senhor é YHWH, enquanto Pedro a emprega numa proclamação centrada em Jesus. Manter “Senhor” preserva tanto a redação quanto a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E acontecerá” preserva o caráter profético da citação; “todo aquele que invocar” mantém uma cadência bíblica natural sem linguagem excessivamente arcaica.
