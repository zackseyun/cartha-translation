  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: pt
  text: Portanto, sendo profeta e sabendo que Deus lhe havia jurado solenemente que faria um dos seus descendentes[a] sentar-se no trono de Davi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do fruto de seus lombos”, uma expressão para descendência física.
    reason: Preserva a imagem concreta e genealógica da expressão grega, vertida no texto por uma formulação portuguesa mais natural.
lexical_decisions:
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente corrente e preciso para alguém que fala por revelação divina.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a relação de inferência com o argumento anterior a respeito de Davi.
- source_word: ὑπάρχων
  choice: sendo
  rationale: Mantém a construção participial e soa natural em português neste período.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Conserva o paralelismo participial com ὑπάρχων.
- source_word: ὅρκῳ ὤμοσεν
  choice: havia jurado solenemente
  rationale: A combinação do substantivo 'juramento' com o verbo 'jurar' enfatiza a solenidade; a formulação evita a redundância pouco natural 'jurado com juramento'.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: um dos seus descendentes
  rationale: Expressa com clareza moderna o sentido genealógico da expressão idiomática, enquanto a imagem literal é preservada em nota.
- source_word: καθίσαι
  choice: faria ... sentar-se
  rationale: 'Preserva a força causativa do infinitivo: Deus instalaria no trono o descendente prometido.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: em seu trono
  rationale: Formulação idiomática de entronização; no contexto, o pronome se refere naturalmente ao trono de Davi.
theological_decisions:
- issue: Promessa régia messiânica feita a Davi
  choice: Mantida como promessa de que um descendente de Davi seria colocado em seu trono.
  alternative: Explicitar que 'o Messias' se sentaria no trono.
  rationale: O contexto aplica a promessa a Jesus, mas este versículo a formula em termos do descendente e do trono de Davi; a tradução não antecipa nem acrescenta essa identificação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe participial foi mantida sem rigidez excessiva; 'havia jurado solenemente' comunica a ênfase do original sem redundância artificial.
