  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: pt
  text: 'Todos estavam admirados e perplexos[a] e diziam uns aos outros: “O que isso quer dizer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem saber o que pensar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: estavam admirados
  rationale: O imperfeito descreve um estado contínuo de espanto; a expressão é natural e evita a conotação enganosa de uma tradução etimológica como “fora de si”.
- source_word: δὲ
  choice: e
  rationale: Aqui, δέ funciona como conectivo narrativo leve, sem exigir contraste forte.
- source_word: πάντες
  choice: todos
  rationale: Preserva a abrangência explícita do grego e retoma naturalmente as pessoas mencionadas no contexto.
- source_word: διηπόρουν
  choice: perplexos
  rationale: Expressa a forte incerteza ou dificuldade de compreender, mantendo paralelismo natural com “admirados”.
- source_word: ἄλλος πρὸς ἄλλον
  choice: uns aos outros
  rationale: É a forma recíproca corrente em português e transmite adequadamente a interação entre os presentes.
- source_word: λέγοντες
  choice: diziam
  rationale: O imperfeito em português integra naturalmente o particípio ao quadro narrativo e introduz de modo neutro o conteúdo da fala.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: O que isso quer dizer?
  rationale: Reproduz com naturalidade o sentido idiomático da construção grega e conserva, por meio de “quer dizer”, um leve eco lexical de θέλει sem sugerir volição literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Admirados e perplexos” preserva os dois aspectos da reação; “O que isso quer dizer?” comunica naturalmente a pergunta sobre o significado do acontecimento.
