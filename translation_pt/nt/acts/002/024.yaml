  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: pt
  text: a quem Deus ressuscitou, libertando-o das dores da morte[a], porque não era possível que ele fosse retido por ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dores de parto”; a palavra grega pode designar especificamente as dores do parto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por ela”; o pronome refere-se mais naturalmente à morte, isto é, “retido pela morte”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: a quem
  rationale: O pronome relativo retoma Jesus, mencionado no versículo anterior, e preserva a ligação sintática com a frase precedente.
- source_word: ἀνέστησεν
  choice: ressuscitou
  rationale: Neste contexto, o verbo descreve Deus levantando Jesus dentre os mortos. “Ressuscitou” expressa isso de modo claro e natural em português.
- source_word: λύσας
  choice: rompendo
  rationale: O particípio de λύω comunica desfazer, soltar ou quebrar aquilo que prende. “Rompendo” conserva a força concreta da imagem sem acrescentar um objeto que não está explícito no grego.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: as dores da morte
  rationale: ὠδίν pode indicar dores intensas ou dores de parto. “Dores da morte” é clara no contexto, enquanto a possível nuance de parto é preservada em nota.
- source_word: καθότι
  choice: porque
  rationale: Introduz naturalmente a razão pela qual Deus o ressuscitou.
- source_word: οὐκ ἦν δυνατὸν
  choice: não era possível
  rationale: Reproduz de perto a construção impessoal e seu tom explicativo.
- source_word: κρατεῖσθαι
  choice: fosse retido
  rationale: O infinitivo passivo indica ser segurado ou mantido sob domínio. “Retido” é conciso e adequado ao registro.
- source_word: ὑπ’ αὐτοῦ
  choice: por ela
  rationale: O pronome grego retoma mais naturalmente “morte”. Em português, o feminino “ela” torna essa referência inteligível sem substituir o pronome pelo substantivo.
theological_decisions:
- issue: Referente de ὑπ’ αὐτοῦ
  choice: O pronome refere-se à morte.
  alternative: Entender o pronome como referência a uma pessoa masculina ou explicitar “pela morte”.
  rationale: θάνατος é o antecedente mais próximo e coerente, e a cláusula afirma que a morte não podia continuar retendo Jesus. A nota registra o referente sem apagar a forma pronominal do texto.
- issue: Sentido de ὠδῖνας
  choice: “dores” no texto principal
  alternative: “dores de parto” ou “ânsias”
  rationale: Embora o termo possa designar especificamente dores de parto, no contexto ele comunica as dores associadas à morte e à sua força de retenção. A nuance lexical mais específica permanece na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a conexão do versículo com a frase anterior e conserva no texto a imagem concreta de λύω, esclarecendo em notas as ambiguidades lexicais genuínas.
