  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: pt
  text: Foi a este Jesus que Deus ressuscitou[a], do qual todos nós somos testemunhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus levantou este Jesus”. Neste contexto, o verbo grego se refere à ressurreição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: a este Jesus
  rationale: A construção clivada preserva a força enfática e dêitica de τοῦτον sem produzir a formulação menos natural «este Jesus» como objeto direto em português.
- source_word: ἀνέστησεν
  choice: ressuscitou
  rationale: Neste contexto, o verbo transitivo descreve inequivocamente Deus trazendo Jesus de volta da morte; «ressuscitou» comunica isso de modo claro e natural.
- source_word: ὁ θεός
  choice: Deus
  rationale: Mantém explicitamente Deus como sujeito da ação.
- source_word: οὗ
  choice: disso
  rationale: O relativo genitivo pode apontar para o fato recém-afirmado — a ressurreição de Jesus. «Disso» produz português natural e mantém os apóstolos como testemunhas desse acontecimento, sem excluir a referência a Jesus.
- source_word: πάντες ἡμεῖς
  choice: todos nós
  rationale: Preserva a ênfase da combinação grega em ordem idiomática portuguesa.
- source_word: ἐσμεν μάρτυρες
  choice: somos testemunhas
  rationale: Reproduz a construção nominal do grego e identifica os falantes como testemunhas.
theological_decisions:
- issue: Formulação da ressurreição
  choice: Deus ressuscitou este Jesus
  alternative: Deus levantou este Jesus
  rationale: O contexto exige referência à ressurreição. «Ressuscitou» torna essa afirmação explícita sem acrescentar explicação doutrinária.
- issue: Referente de οὗ
  choice: testemunhas disso
  alternative: testemunhas dele
  rationale: O genitivo relativo permite relacionar o testemunho tanto com Jesus quanto com sua ressurreição. «Disso» liga naturalmente o testemunho ao acontecimento afirmado no contexto imediato, preservando em nota a alternativa pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «Foi a este Jesus que...» conserva a ênfase do demonstrativo grego; «e disso» dá fluidez à segunda oração.
