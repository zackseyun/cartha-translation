  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: pt
  text: louvando a Deus e contando com a simpatia de todo o povo. E, dia após dia, o Senhor acrescentava ao grupo[a] os que estavam sendo salvos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “juntos” ou “no mesmo lugar”. A expressão grega ἐπὶ τὸ αὐτό pode indicar a integração ao grupo ou, alternativamente, o fato de estarem juntos ou no mesmo lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: louvando a Deus
  rationale: O particípio presente expressa a atividade contínua da comunidade; “louvando” é natural e mantém o sentido durativo.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: contando com a simpatia de todo o povo
  rationale: A expressão indica desfrutar favor ou boa vontade junto à população. A formulação é corrente em português e evita sugerir que eram eles que concediam favor ao povo.
- source_word: ὁ δὲ κύριος
  choice: E ... o Senhor
  rationale: Representa levemente o conectivo δέ e conserva κύριος como “Senhor”.
- source_word: προσετίθει
  choice: acrescentava
  rationale: O imperfeito retrata uma ação repetida ou contínua; o imperfeito português preserva esse aspecto.
- source_word: τοὺς σῳζομένους
  choice: os que estavam sendo salvos
  rationale: A construção progressiva preserva o caráter verbal e processual do particípio presente passivo, sem o reduzir a um rótulo estático.
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: Expressão idiomática que comunica a repetição distributiva ao longo de dias sucessivos.
- source_word: ἐπὶ τὸ αὐτό
  choice: ao grupo
  rationale: Com προσετίθει, a expressão provavelmente indica incorporação à comunidade reunida. “Ao grupo” é natural e menos quantitativo que “ao número deles”; as possibilidades “juntos” e “no mesmo lugar” são preservadas em nota.
theological_decisions:
- issue: Aspecto de τοὺς σῳζομένους e a teologia da salvação
  choice: os que estavam sendo salvos
  alternative: os salvos; os que haviam sido salvos
  rationale: O particípio presente passivo apresenta a salvação, neste contexto narrativo, como ação em curso. A tradução mantém esse aspecto sem decidir debates confessionais mais amplos sobre a ordem da salvação.
- issue: Sentido de ἐπὶ τὸ αὐτό
  choice: ao grupo
  alternative: juntos; no mesmo lugar
  rationale: A ligação com “acrescentava” favorece a ideia de incorporação à comunidade, mas a expressão grega também pode ter sentido adverbial. A nota conserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contando com a simpatia” comunica o idioma grego com naturalidade; “ao grupo” evita a explicitação quantitativa de “ao número deles”. O marcador [a] foi colocado junto da expressão ambígua que a nota explica.
