source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: pt
  text: Por causa disso, meu coração se alegrou, e minha língua exultou; além disso, até a minha carne habitará em esperança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu corpo repousará em esperança”.'
    reason: Alternativa lexical para ἡ σάρξ μου e κατασκηνώσει, que também pode ser entendida como uma referência mais direta ao repouso corporal.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por causa disso
  rationale: A construção διά com o acusativo τοῦτο expressa causa ou fundamento. A tradução explicita essa força causal.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: meu coração se alegrou
  rationale: A forma passiva é usada aqui com sentido de estado ou experiência. A formulação é natural em português e preserva o coração como imagem bíblica da pessoa interior.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: minha língua exultou
  rationale: O verbo comunica alegria intensa, e “exultou” preserva essa intensidade. “Língua” mantém a imagem poética do texto grego em vez de interpretá-la como “boca” ou “voz”.
- source_word: ἔτι δὲ καὶ
  choice: além disso, até
  rationale: A expressão amplia a declaração anterior e dá ênfase ao elemento seguinte; a combinação escolhida comunica continuação e intensificação.
- source_word: ἡ σάρξ μου
  choice: a minha carne
  rationale: Neste contexto, σάρξ se refere à existência corporal, não a uma natureza moralmente pecaminosa. “Carne” preserva o termo antropológico e a linguagem concreta do original.
- source_word: κατασκηνώσει
  choice: habitará
  rationale: O verbo evoca morar, acampar ou estabelecer-se. “Habitará” conserva essa imagem sem restringi-la ao sentido interpretativo de “repousará”.
- source_word: ἐπ’ ἐλπίδι
  choice: em esperança
  rationale: A expressão pode indicar esfera ou fundamento. “Em esperança” mantém a formulação aberta e comunica segurança esperançosa sem acrescentar uma explicação ao texto.
theological_decisions:
- issue: Sentido de σάρξ numa citação aplicada à ressurreição
  choice: a minha carne
  alternative: o meu corpo
  rationale: Embora o contexto posterior relacione a citação à ressurreição, o termo grego é antropológico e concreto. “Carne” preserva essa linguagem sem inserir antecipadamente uma interpretação mais específica.
- issue: Nuance de κατασκηνώσει ἐπ’ ἐλπίδι
  choice: habitará em esperança
  alternative: repousará em esperança
  rationale: A escolha principal conserva a metáfora de habitação segura. A alternativa expressa uma interpretação antiga e plausível no contexto da morte, mas estreita a imagem verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados; “exultou” mantém o tom elevado sem arcaísmo excessivo.
