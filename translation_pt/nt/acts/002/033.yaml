id: ACT.2.33
reference: Acts 2:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: pt
  text: Portanto, tendo sido exaltado à direita de Deus[a] e tendo recebido do Pai a promessa do Espírito Santo[b], ele derramou isto que vocês mesmos estão vendo e ouvindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exaltado pela mão direita de Deus”. O dativo grego pode indicar tanto o lugar ou a posição da exaltação (“à direita”) quanto o meio pelo qual ela ocorreu (“pela mão direita”, isto é, pelo poder de Deus).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o Espírito Santo prometido”. A expressão grega pode referir-se tanto ao próprio Espírito, como dom prometido, quanto à promessa referente ao Espírito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: à direita de Deus
  rationale: O dativo é entendido como locativo, em harmonia com o tema da entronização e com a citação do Salmo 110 no contexto; a leitura instrumental permanece na nota.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência que Pedro tira do argumento anterior sobre a ressurreição e a exaltação de Jesus.
- source_word: ὑψωθεὶς
  choice: tendo sido exaltado
  rationale: Preserva o particípio aoristo passivo e comunica a exaltação de Jesus, não apenas um movimento físico para cima.
- source_word: τήν τε ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: a promessa do Espírito Santo
  rationale: 'Mantém de perto a construção genitiva grega e sua ambiguidade: pode designar tanto a promessa referente ao Espírito quanto o Espírito como dom prometido.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: recebido do Pai
  rationale: Comunica a ação anterior à do verbo principal e preserva παρά com genitivo como indicação de origem.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: O aoristo apresenta o ato realizado, cujos resultados a multidão percebe naquele momento; em português, o pretérito perfeito é natural e preciso.
- source_word: τοῦτο
  choice: isto
  rationale: Preserva o demonstrativo sem acrescentar uma identificação interpretativa como 'este dom' ou 'este Espírito'.
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: vocês mesmos estão vendo e ouvindo
  rationale: O pronome explícito recebe a ênfase de 'mesmos', e a forma progressiva retrata a percepção imediata dos fenômenos.
theological_decisions:
- issue: Se τῇ δεξιᾷ τοῦ θεοῦ indica exaltação à direita de Deus ou pela mão direita/pelo poder de Deus
  choice: à direita de Deus
  alternative: pela mão direita de Deus
  rationale: A leitura locativa se ajusta à entronização messiânica e à referência ao Salmo 110 no contexto imediato. Como o dativo também admite sentido instrumental, a alternativa é preservada em nota.
- issue: Se τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου significa a promessa referente ao Espírito ou o Espírito como dom prometido
  choice: a promessa do Espírito Santo
  alternative: o Espírito Santo prometido
  rationale: A tradução formal conserva a ambiguidade genuína do genitivo. O contexto daquilo que é derramado favorece entender o Espírito como o dom prometido, mas a redação grega também pode referir-se à promessa acerca dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo e preserva a ênfase do pronome grego por meio de “mesmos”. A estrutura participial foi mantida sem tornar a frase artificial.
