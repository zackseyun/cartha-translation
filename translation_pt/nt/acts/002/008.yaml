  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: pt
  text: E como é que cada um de nós ouve em sua própria língua materna?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em nosso próprio dialeto, no qual nascemos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πῶς
  choice: E como é que
  rationale: Mantém a ligação com o contexto por meio de “E” e expressa, em português natural, a pergunta marcada por admiração.
- source_word: ἡμεῖς ... ἕκαστος
  choice: cada um de nós
  rationale: Reproduz o sentido distributivo de ἕκαστος e a inclusão enfática de ἡμεῖς em uma construção idiomática portuguesa.
- source_word: ἀκούομεν
  choice: ouve
  rationale: A concordância no singular acompanha “cada um de nós”; o verbo permanece sem objeto expresso, como no texto grego.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: em sua própria língua materna
  rationale: διάλεκτος pode designar língua ou dialeto. “Língua materna” comunica de modo claro a variedade linguística própria de cada ouvinte, enquanto “própria” representa ἰδίᾳ.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: materna
  rationale: A expressão condensa naturalmente em português a ideia da língua associada ao nascimento e à origem, preservando na nota a forma mais literal da oração relativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “como é que” transmite surpresa sem perder naturalidade; “língua materna” evita o possível tom técnico ou restrito de “dialeto”, cuja alternativa é preservada na nota.
