  source_fidelity: 'A tradução reproduz com fidelidade a estrutura e o sentido do grego: ὅτι é adequadamente vertido por “porque”; οὐκ ἐγκαταλείψεις por “não abandonarás”; τὴν ψυχήν μου por “a minha alma”; e a construção δώσεις ... ἰδεῖν por “permitirás que ... veja”. “No Hades” é uma solução idiomática portuguesa defensável com “abandonar”, sem confundir ᾅδης com inferno. “Veja a decomposição” preserva a imagem de ἰδεῖν διαφθοράν e seu sentido físico no contexto.'
