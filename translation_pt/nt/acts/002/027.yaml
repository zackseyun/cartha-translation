id: ACT.2.27
reference: Acts 2:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: pt
  text: porque não abandonarás a minha alma no Hades[a], nem permitirás que o teu Santo[b] veja a decomposição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Sheol”, conforme o texto hebraico que está por trás desta citação; aqui, o grego traz “Hades”.
    reason: alternative_reading
  - marker: b
    text: Ou “aquele que te é fiel”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, a decomposição do corpo; tradicionalmente, “corrupção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: abandonarás
  rationale: O futuro do indicativo expressa que Deus não deixará a pessoa entregue a esse destino. “Abandonar” é natural, atual e mantém a força do verbo grego.
- source_word: τὴν ψυχήν μου
  choice: a minha alma
  rationale: ψυχή pode significar “alma”, “vida” ou “pessoa”. “Minha alma” conserva a formulação da citação do salmo e sua ambiguidade antropológica sem transformá-la numa afirmação técnica sobre o estado intermediário.
- source_word: εἰς ᾅδην
  choice: no Hades
  rationale: ᾅδης designa aqui o domínio dos mortos, não devendo ser confundido automaticamente com o inferno. Em português, com o verbo “abandonar”, “no Hades” expressa naturalmente o lugar ou estado em que alguém seria deixado, embora εἰς tenha forma direcional.
- source_word: δώσεις ... ἰδεῖν
  choice: permitirás que ... veja
  rationale: Embora δώσεις signifique literalmente “darás”, seguido do infinitivo forma uma expressão de permissão. Esta redação reproduz o sentido com clareza em português.
- source_word: τὸν ὅσιόν σου
  choice: o teu Santo
  rationale: ὅσιος pode indicar alguém santo, piedoso ou fiel diante de Deus. “O teu Santo” preserva o valor lexical e a identificação cristológica feita no contexto de Atos, sem acrescentar explicação ao versículo.
- source_word: ἰδεῖν διαφθοράν
  choice: veja a decomposição
  rationale: A expressão grega é literalmente “ver decomposição/corrupção”. “Decomposição” comunica com precisão o sentido físico no contexto da morte e ressurreição, evitando a conotação predominantemente moral que “corrupção” pode ter no português atual.
theological_decisions:
- issue: Sentido de ᾅδης na citação sobre a ressurreição
  choice: Hades
  alternative: mundo dos mortos; Sheol; sepultura
  rationale: A transliteração preserva o termo do texto grego e evita identificar indevidamente ᾅδης com “inferno”. A nota registra “Sheol”, presente no pano de fundo hebraico da citação.
- issue: Identificação cristológica de τὸν ὅσιόν σου
  choice: o teu Santo
  alternative: o teu fiel; aquele que te é fiel; o teu piedoso
  rationale: Pedro aplica explicitamente o salmo a Jesus neste discurso. “O teu Santo” conserva tanto a amplitude lexical de ὅσιος quanto a força cristológica do contexto, sem resolver em excesso a tensão do texto citado.
- issue: Referência de ψυχή
  choice: alma
  alternative: vida; pessoa
  rationale: A escolha mantém a linguagem tradicional da citação e sua abertura sem impor uma antropologia dicotômica nem reduzir ψυχή apenas à vida física.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém “Hades” como termo técnico transliterado, usa “alma” para preservar a ambiguidade da citação e prefere “decomposição” para tornar claro o sentido físico de διαφθορά.
