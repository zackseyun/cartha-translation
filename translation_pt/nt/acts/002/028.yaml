  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: pt
  text: Tu me fizeste conhecer os caminhos da vida[a]; tu me encherás de alegria na tua presença[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as veredas da vida”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com o teu rosto”; isto é, “na tua presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: tu me fizeste conhecer
  rationale: Reproduz o aoristo ativo e o sentido causativo de γνωρίζω, mantendo μοι como objeto indireto de maneira natural e clara em português.
- source_word: ὁδοὺς ζωῆς
  choice: os caminhos da vida
  rationale: Mantém o plural de ὁδούς e a imagem concreta de caminhos. A expressão pode indicar caminhos caracterizados pela vida ou que conduzem a ela, sem exigir que essa relação seja definida na tradução.
- source_word: πληρώσεις με
  choice: tu me encherás
  rationale: Expressa diretamente o futuro ativo, com o pronome como objeto, e preserva o paralelismo da frase.
- source_word: εὐφροσύνης
  choice: de alegria
  rationale: O genitivo indica aquilo de que a pessoa será cheia. “Alegria” comunica em português atual o contentamento jubiloso de εὐφροσύνη.
- source_word: μετὰ τοῦ προσώπου σου
  choice: na tua presença
  rationale: A formulação grega é literalmente “com o teu rosto”, mas funciona como expressão de presença pessoal. “Na tua presença” transmite esse sentido com naturalidade, enquanto a nota conserva a imagem original.
theological_decisions:
- issue: Expressão da presença divina na citação do salmo
  choice: na tua presença
  alternative: com o teu rosto
  rationale: A tradução comunica claramente a alegria experimentada diante da presença pessoal de Deus, sem introduzir uma interpretação doutrinária adicional; a imagem literal de “rosto” é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “tu” preserva a segunda pessoa singular do grego e o tom da citação bíblica; a colocação pronominal escolhida é natural no uso brasileiro.
