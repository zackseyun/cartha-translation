source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: pt
  text: E, de repente, veio do céu um som como o de um vento impetuoso[a], e encheu toda a casa onde estavam sentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um som como o de um vento violento que soprava”. O grego compara o som ao de ar impelido com força; não afirma explicitamente que havia um vento de fato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: veio
  rationale: Na construção narrativa impessoal com ἦχος, “veio” expressa naturalmente em português o surgimento do som, sem a rigidez de “aconteceu” nem a menor vivacidade de “houve”.
- source_word: ἄφνω
  choice: de repente
  rationale: Equivalente corrente e digno que comunica a ocorrência súbita.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Preserva a procedência celestial sugerida no contexto de Lucas–Atos, sem reduzir οὐρανός ao espaço atmosférico.
- source_word: ἦχος
  choice: um som
  rationale: Termo amplo e semanticamente preciso; “ruído” pode ter conotação negativa, e opções como “estrondo” seriam específicas demais.
- source_word: ὥσπερ
  choice: como o de
  rationale: 'Marca claramente a comparação: o texto descreve um som semelhante ao de vento, sem afirmar de modo explícito que havia vento literal.'
- source_word: φερομένης
  choice: que avançava
  rationale: O particípio retrata o ar em movimento, sendo levado ou impelido. “Que avançava” comunica esse movimento de modo natural sem identificar o fenômeno como vento literal.
- source_word: πνοῆς
  choice: vento
  rationale: Embora possa designar sopro ou respiração, neste contexto auditivo, junto de βιαίας e φερομένης, refere-se mais naturalmente a uma corrente de ar.
- source_word: βιαίας
  choice: forte
  rationale: Comunica a força de βίαιος em português corrente. “Violento” seria mais direto, mas pode sugerir destruição ou agressão não afirmadas pelo contexto.
- source_word: ἐπλήρωσεν
  choice: ele encheu
  rationale: Mantém “o som” como sujeito gramatical e explicita o referente com o pronome masculino, evitando possível leitura de que o vento encheu a casa.
- source_word: ὅλον τὸν οἶκον
  choice: toda a casa
  rationale: Formulação natural que preserva a totalidade expressa por ὅλον.
- source_word: οὗ ἦσαν καθήμενοι
  choice: onde estavam sentados
  rationale: Reproduz de modo claro a oração relativa e o aspecto durativo da construção verbal.
theological_decisions:
- issue: Natureza do fenômeno comparado ao vento
  choice: 'O texto principal conserva a comparação: veio um som como o de um vento forte que avançava.'
  alternative: Um vento forte literal veio e encheu a casa.
  rationale: ὥσπερ introduz uma comparação. A tradução não transforma a figura em uma afirmação de que havia vento literal e mantém a sobriedade teológica do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa é natural, e o pronome “ele” esclarece que foi o som que encheu a casa. A nota preserva tanto a alternativa mais tradicional “impetuoso” quanto a distinção entre comparação sonora e vento literal.
