  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: pt
  text: 'Então Pedro lhes disse: “Arrependam-se, e cada um de vocês seja batizado em nome de Jesus, o Messias,[a] para o perdão dos seus pecados,[b] e vocês receberão o dom do Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou “Cristo”; aqui, “Messias” preserva o sentido do título na proclamação de Pedro.
    reason: alternative_reading
  - marker: b
    text: A expressão “para o perdão dos seus pecados” traduz o grego diretamente. Há diferentes interpretações sobre a relação entre o batismo e o perdão neste versículo; a tradução não resolve essa discussão além do que diz o próprio texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Arrependam-se
  rationale: O imperativo aoristo plural convoca os ouvintes a uma resposta decidida. “Arrependam-se” é a formulação portuguesa concisa que preserva tanto a mudança interior quanto a reorientação moral implicadas pelo verbo.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: cada um de vocês seja batizado
  rationale: A construção conserva o imperativo passivo na terceira pessoa do singular e a ênfase distributiva de ἕκαστος, ao mesmo tempo que soa natural em português moderno.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: em nome de
  rationale: É o equivalente idiomático mais claro no contexto batismal e não restringe indevidamente a nuance grega a fundamento, autoridade ou confissão.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Neste contexto de proclamação, Χριστός mantém força titular. A vírgula e o artigo tornam o título explícito e idiomático em português.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: para o perdão dos seus pecados
  rationale: Traduz diretamente a orientação expressa por εἰς e o sentido de remissão de ἄφεσις, preservando o plural “pecados” sem definir além do texto a relação teológica entre batismo e perdão.
- source_word: λήμψεσθε
  choice: vocês receberão
  rationale: Expressa naturalmente em português a promessa indicada pelo futuro grego.
- source_word: τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: o dom do Espírito Santo
  rationale: “Dom” comunica uma dádiva concedida e é uma formulação digna e corrente; “Espírito Santo” é a designação contemporânea habitual.
theological_decisions:
- issue: Relação entre o batismo e o perdão em εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: Traduzir de modo transparente como “para o perdão dos seus pecados”.
  alternative: “para que seus pecados sejam perdoados” ou “por causa do perdão dos seus pecados”
  rationale: A formulação escolhida preserva a relação expressa pelo grego sem impor uma explicação denominacional sobre eficácia sacramental, sequência ou simbolismo.
- issue: Tradução de Χριστοῦ
  choice: “o Messias” como título de Jesus
  alternative: “Cristo”
  rationale: No contexto explicitamente messiânico do discurso de Pedro, o sentido titular permanece ativo; “o Messias” torna esse sentido acessível ao leitor moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo; “seja batizado” preserva a estrutura distributiva e imperativa do original. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
