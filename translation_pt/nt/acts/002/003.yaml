  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: pt
  text: E apareceram-lhes línguas como que de fogo, que se repartiam, e pousou sobre cada um deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: «línguas divididas, como que de fogo» ou «línguas, como se fossem de fogo». A construção grega destaca tanto a aparência visível quanto a sua distribuição entre eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: apareceram
  rationale: O aoristo passivo de ὁράω tem aqui sentido intransitivo de tornar-se visível; «apareceram» é natural em português e conserva a manifestação visível.
- source_word: αὐτοῖς
  choice: a eles
  rationale: O dativo indica as pessoas às quais o fenômeno apareceu; «a eles» é direto e claro.
- source_word: διαμεριζόμεναι
  choice: que se repartiam
  rationale: O particípio presente médio/passivo modifica «línguas» e expressa sua divisão ou distribuição, sem decidir rigidamente entre processo e resultado.
- source_word: γλῶσσαι
  choice: línguas
  rationale: Conserva a imagem visível de formas semelhantes a línguas e, ao mesmo tempo, a ligação lexical com o tema da fala nos versículos seguintes; «chamas» eliminaria essa ressonância.
- source_word: ὡσεὶ πυρός
  choice: como de fogo
  rationale: ὡσεὶ introduz uma comparação, não uma identificação. «Como de fogo» preserva a formulação cautelosa e não afirma que eram fogo literal.
- source_word: ἐκάθισεν
  choice: isso pousou
  rationale: O verbo está no singular, embora «línguas» seja plural. «Isso» preserva o singular e pode retomar coletivamente o fenômeno visível, enquanto «pousou» exprime com naturalidade a ideia de assentar-se sobre alguém.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: sobre cada um deles
  rationale: 'Mantém a força distributiva: a manifestação alcançou individualmente cada pessoa presente.'
theological_decisions:
- issue: Natureza da manifestação no Pentecostes
  choice: Traduzir como «línguas como de fogo», mantendo a imagem visual, a comparação e a ligação com a fala.
  alternative: «chamas de fogo» ou «línguas de fogo» entendidas como fogo literal
  rationale: O grego emprega γλῶσσαι e a partícula comparativa ὡσεὶ. A tradução não deve reduzir o sinal a chamas nem afirmar que se tratava literalmente de fogo.
- issue: Singular de ἐκάθισεν após o plural «línguas»
  choice: Preservar o singular por meio de «isso pousou», remetendo ao fenômeno em conjunto.
  alternative: «elas pousaram», fazendo concordância semântica com «línguas»
  rationale: A forma singular é textualmente significativa e pode apresentar a manifestação distribuída como uma unidade coletiva; a redação conserva essa tensão sem impor uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a imagem de «línguas», a comparação com fogo, o aspecto distributivo do particípio e o singular inesperado do verbo final.
