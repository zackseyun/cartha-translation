  terminology: «Apoio para os pés» comunica diretamente ὑποπόδιον sem recorrer ao termo mais arcaico «escabelo». «Teus» torna inequívoca a segunda pessoa da fala citada, onde «seus» pode gerar ambiguidade fora de contexto.
