  yaml_path: translation/nt/acts/002/035.yaml
  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: pt
  text: até que eu faça dos teus inimigos um apoio para os teus pés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta frase retoma o Salmo 110:1, texto de entronização régia e messiânica.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: até que
  rationale: A locução expressa o ponto futuro até o qual permanece válida a declaração anterior; “até que” reproduz essa força temporal com naturalidade em português.
- source_word: θῶ
  choice: eu ponha
  rationale: O verbo τίθημι significa “pôr/colocar”. “Ponha” conserva de modo natural a imagem concreta e a construção predicativa do grego.
- source_word: τοὺς ἐχθρούς σου
  choice: os seus inimigos
  rationale: Tradução direta que preserva tanto a referência pessoal quanto o sentido de oposição régia no salmo citado.
- source_word: ὑποπόδιον
  choice: estrado
  rationale: “Estrado” designa aqui o apoio para os pés e mantém a imagem régia de sujeição sem convertê-la em explicação interpretativa.
- source_word: τῶν ποδῶν σου
  choice: para os seus pés
  rationale: Expressa de maneira corrente em português o genitivo da fórmula “estrado dos/para os pés”, sem acrescentar a interpretação espacial “debaixo dos seus pés”.
theological_decisions:
- issue: Imagem de sujeição régia na citação do Salmo 110:1
  choice: Manter a imagem concreta “estrado para os seus pés”.
  alternative: “até que eu subjugue completamente os seus inimigos debaixo dos seus pés”
  rationale: A formulação preserva a força régia e messiânica da citação sem substituir a metáfora por uma interpretação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do grego foram preservadas sem rigidez artificial. Não se acrescentou nota lexical, pois “ponha ... como estrado para os seus pés” já reflete de perto a forma do original.
