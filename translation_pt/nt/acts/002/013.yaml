  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: pt
  text: 'Mas outros, zombando, diziam: “Eles estão cheios de vinho doce.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho novo”. O grego γλεῦκος se refere a vinho fresco e doce; a tradução tradicional “vinho novo” também é possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: outros
  rationale: O adjetivo substantivado designa outro grupo entre os presentes; “outros” é natural e preserva o contraste.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste com a reação anterior.
- source_word: διαχλευάζοντες
  choice: zombando
  rationale: Expressa escárnio ou ridicularização de modo claro e corrente, sem intensificar indevidamente.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala contínua ou repetida; “diziam” conserva naturalmente esse aspecto.
- source_word: ὅτι
  choice: discurso direto introduzido por dois-pontos
  rationale: A conjunção introduz o conteúdo da fala; em português, o discurso direto é natural neste contexto.
- source_word: Γλεύκους
  choice: vinho doce
  rationale: γλεῦκος se refere a vinho novo, fresco e doce; “vinho doce” destaca com precisão sua característica lexical central.
- source_word: μεμεστωμένοι
  choice: cheios
  rationale: O particípio perfeito passivo descreve o estado resultante alegado; “estão cheios de” é idiomático em português.
- source_word: εἰσίν
  choice: estão
  rationale: A cópula completa a construção perifrástica e, em português, “estar” expressa adequadamente o estado.
