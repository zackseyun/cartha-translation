id: ACT.2.34
reference: Acts 2:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: pt
  text: 'Pois Davi não subiu aos céus[a], mas ele mesmo diz: “O Senhor disse ao meu Senhor: Sente-se à minha direita,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Salmo 110:1. No texto hebraico, o primeiro «Senhor» representa o nome divino YHWH; compare com: «O SENHOR disse ao meu Senhor».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: O aoristo de ἀναβαίνω indica aqui subir aos céus. “Subiu” é natural em português e preserva a linguagem bíblica da ascensão.
- source_word: τοὺς οὐρανούς
  choice: aos céus
  rationale: Mantém o plural grego e corresponde ao uso bíblico corrente em português.
- source_word: λέγει δὲ αὐτός
  choice: mas ele mesmo diz
  rationale: “Mas” expressa o contraste leve de δέ, enquanto “ele mesmo” conserva a ênfase intensiva de αὐτός. O presente “diz” apresenta a Escritura como fala vigente.
- source_word: ὁ κύριος
  choice: O Senhor
  rationale: O texto grego traz κύριος; por isso, a tradução principal usa “Senhor”. A identidade do primeiro termo com YHWH no hebraico do Salmo 110:1 é indicada em nota.
- source_word: τῷ κυρίῳ μου
  choice: ao meu Senhor
  rationale: “Senhor” preserva a repetição de κύριος e a força messiânica da argumentação de Pedro, sem reduzir o termo a “senhor” ou “mestre”.
- source_word: Κάθου
  choice: Sente-se
  rationale: Forma imperativa natural e digna no português moderno, adequada à ordem de entronização.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Equivalente idiomático consagrado para a posição de honra e autoridade; uma tradução literal de ἐκ seria inadequada em português.
theological_decisions:
- issue: Tradução das duas ocorrências de κύριος na citação do Salmo 110:1
  choice: 'As duas são traduzidas por “Senhor” no texto principal: “O Senhor disse ao meu Senhor”.'
  alternative: “O SENHOR disse ao meu Senhor”, refletindo o nome divino YHWH na primeira ocorrência do texto hebraico.
  rationale: O texto-fonte grego emprega κύριος nas duas ocorrências. A tradução principal segue essa forma, enquanto a nota preserva a informação intertextual de que a primeira ocorrência representa YHWH no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “céus” e a repetição de “Senhor” preservam a forma e a ressonância escriturística do grego. A pontuação mantém o versículo aberto, pois a citação continua no versículo seguinte.
