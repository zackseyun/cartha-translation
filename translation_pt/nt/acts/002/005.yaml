id: ACT.2.5
reference: Acts 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: pt
  text: Havia em Jerusalém judeus[a] residentes, homens devotos vindos de todas as nações debaixo do céu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeanos”; aqui, o contexto favorece o sentido étnico-religioso mais amplo, pois eles são descritos como vindos de todas as nações debaixo do céu.
    reason: alternative_reading
  - marker: b
    text: “Debaixo do céu” é uma expressão bíblica que significa “em todo o mundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Havia
  rationale: Expressa naturalmente a construção existencial; o δέ funciona como conexão narrativa leve e não exige uma conjunção explícita em português.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: em Jerusalém ... residentes
  rationale: Preserva o sentido locativo e durativo de κατοικοῦντες, indicando que moravam na cidade, não que estavam apenas de passagem.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: O contexto de pessoas vindas de todas as nações favorece o sentido étnico-religioso amplo, embora o termo também possa significar 'judeanos' em outros contextos.
- source_word: ἄνδρες εὐλαβεῖς
  choice: homens devotos
  rationale: Mantém o valor especificamente masculino de ἄνδρες e traduz εὐλαβεῖς por uma expressão corrente de reverência e piedade.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: vindos de todas as nações
  rationale: Em português, o plural idiomático comunica a abrangência distributiva da expressão grega sem sugerir que cada homem procedesse de mais de uma nação.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: debaixo do céu
  rationale: Conserva o conhecido idiomatismo bíblico, cujo sentido abrangente é esclarecido em nota.
theological_decisions:
- issue: Sentido de Ἰουδαῖοι
  choice: judeus
  alternative: judeanos
  rationale: A procedência de todas as nações aponta para judeus da diáspora, tornando inadequado restringir o termo aos habitantes da Judeia.
- issue: Valor de gênero de ἄνδρες
  choice: homens
  alternative: pessoas
  rationale: O substantivo grego é especificamente masculino; a tradução conserva essa informação em vez de neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência sem eliminar a relação participial, e o idiomatismo bíblico foi preservado com esclarecimento em nota.
