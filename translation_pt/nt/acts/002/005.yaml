  source_fidelity: 'A tradução preserva todos os elementos do grego: a construção existencial no imperfeito (Ἦσαν), a residência em Jerusalém (κατοικοῦντες), «judeus» para Ἰουδαῖοι, o masculino explícito de ἄνδρες, «devotos» para εὐλαβεῖς e a procedência universal expressa por «de todas as nações debaixo do céu». A leve força conectiva de δέ pode ser idiomaticamente não explicitada em português.'
