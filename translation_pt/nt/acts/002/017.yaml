source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: pt
  text: E acontecerá nos últimos dias, diz Deus, que derramarei do meu Espírito[a] sobre toda carne[b]. Os filhos e as filhas de vocês profetizarão, os rapazes de vocês verão visões, e os homens idosos de vocês terão sonhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa uma preposição que indica procedência: “a partir do meu Espírito”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre todas as pessoas”. “Toda carne” preserva a expressão profética do texto grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Expressão temporal consagrada e natural em português, preservando o teor escatológico sem definir além do texto o alcance desse período.
- source_word: λέγει ὁ θεός
  choice: diz Deus
  rationale: Mantém o presente da fórmula de citação e a ordem enfática do grego em português fluente.
- source_word: ἐκχεῶ
  choice: derramarei
  rationale: Preserva a metáfora concreta do derramamento e o valor futuro do verbo.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: do meu Espírito
  rationale: Em português, “do meu Espírito” expressa naturalmente a procedência indicada por ἀπό; a nota registra a formulação mais explícita sem sugerir que o Espírito seja dividido.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: sobre toda carne
  rationale: Conserva a imagem profética e a ligação verbal com Joel, enquanto a nota esclarece o sentido idiomático referente às pessoas.
- source_word: προφητεύσουσιν
  choice: profetizarão
  rationale: Equivalente direto e corrente, sem diluir a linguagem profética.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: os filhos e as filhas de vocês
  rationale: Preserva explicitamente os dois grupos de gênero e comunica a repetição possessiva grega de modo natural em português.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: os jovens de vocês
  rationale: Forma atual e legível; o artigo masculino e o paralelismo com os homens idosos mantêm a referência aos jovens do sexo masculino.
- source_word: ὁράσεις ὄψονται
  choice: verão visões
  rationale: Mantém o verbo “ver” e a figura retórica da construção cognata do grego, ainda compreensível e digna em português.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: os homens idosos de vocês
  rationale: O contexto estabelece contraste de idade com os jovens; “homens idosos” evita que “anciãos” seja entendido como título ou função comunitária.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: terão sonhos
  rationale: Equivalente português natural da expressão cognata grega, preservando o sentido e o paralelismo com as visões sem produzir uma formulação artificial.
theological_decisions:
- issue: Alcance e força idiomática de ἐπὶ πᾶσαν σάρκα
  choice: Manter “sobre toda carne” no texto principal.
  alternative: “sobre todas as pessoas” ou “sobre toda a humanidade”
  rationale: A escolha conserva a imagem e a ressonância profética, sem restringir a amplitude da promessa; a nota apresenta o sentido idiomático em português corrente.
- issue: Referente de πνεῦμα no derramamento divino
  choice: Traduzir “meu Espírito”, com inicial maiúscula.
  alternative: “meu espírito”
  rationale: Deus é quem fala e identifica o Espírito como seu; a maiúscula comunica o referente divino indicado pelo contexto sem acrescentar uma definição teológica ausente do verso.
- issue: Valor de ἀπό em ἀπὸ τοῦ πνεύματός μου
  choice: Usar “do meu Espírito” no texto e explicitar a procedência em nota.
  alternative: “a partir do meu Espírito”
  rationale: A construção portuguesa escolhida é natural e pode expressar procedência. A alternativa é mais formalmente explícita, mas poderia sugerir indevidamente divisão ou quantidade parcial do Espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens proféticas de derramar, carne e visões, e evita-se “anciãos” para não sugerir um cargo comunitário. A pontuação divide a longa estrutura grega em duas frases sem alterar suas relações de sentido.
