  terminology: “Meu Espírito”, “derrama rei”, “toda carne”, “profetizarão” e “visões” são escolhas fiéis e adequadas. A nota sobre ἀπό deve evitar caracterizar “a partir de” como simplesmente “mais literal”, pois “do” em português pode expressar bem a procedência; convém explicar diretamente o valor da preposição grega.
