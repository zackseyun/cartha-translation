  - severity: low
    issue: 'Formulação da nota a: “Mais literalmente, ‘a partir do meu Espírito’”'
    rationale: A expressão portuguesa “do meu Espírito” já pode indicar procedência e é uma tradução legítima de ἀπό neste contexto. “A partir de” torna a procedência mais explícita, mas não é, de modo simples, uma tradução mais literal.
