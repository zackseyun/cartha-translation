source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: pt
  text: Quando esse som ocorreu, a multidão se reuniu e ficou perplexa, porque cada um os ouvia falar em seu próprio idioma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu próprio dialeto”. O termo grego pode designar tanto um idioma quanto uma variedade regional de fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: Quando esse som ocorreu
  rationale: O genitivo absoluto expressa uma circunstância temporal. Neste contexto, φωνή designa o fenômeno audível mencionado anteriormente; “som” evita especificá-lo indevidamente como voz ou ruído.
- source_word: δέ
  choice: não traduzido separadamente
  rationale: A partícula estabelece uma ligação narrativa leve. Em português, a transição temporal com “Quando” mantém o fluxo natural sem exigir uma conjunção adicional.
- source_word: συνῆλθε τὸ πλῆθος
  choice: a multidão se reuniu
  rationale: A expressão descreve muitas pessoas convergindo para o mesmo lugar. “A multidão se reuniu” é corrente, clara e próxima do sentido grego.
- source_word: συνεχύθη
  choice: ficou perplexa
  rationale: O passivo de συγχέω comunica desorientação ou confusão. “Ficou perplexa” expressa a reação causada pelo fenômeno sem sugerir necessariamente desordem física.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo direto a causa da perplexidade da multidão.
- source_word: ἤκουον
  choice: ouvia
  rationale: O imperfeito apresenta a percepção como contínua no decorrer da cena. O imperfeito português preserva naturalmente esse aspecto.
- source_word: εἷς ἕκαστος
  choice: cada um
  rationale: 'Mantém a força distributiva enfática: cada pessoa da multidão teve essa experiência.'
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: em seu próprio idioma
  rationale: διάλεκτος pode indicar idioma ou variedade regional de fala. “Idioma” é mais natural e menos restritivo no português contemporâneo, enquanto a nota registra a alternativa formal “dialeto”.
- source_word: λαλούντων αὐτῶν
  choice: os ouvia falar
  rationale: Preserva o pronome referente aos falantes já mencionados e não identifica o grupo de maneira mais específica do que o texto permite.
theological_decisions:
- issue: Identidade dos falantes
  choice: manter o referente pronominal em “os ouvia falar”
  alternative: explicitar “ouvia os apóstolos falar”
  rationale: O grego emprega apenas αὐτῶν, “eles”, retomando os falantes do contexto. Explicitar “os apóstolos” estreitaria uma referência que este versículo não define por nome.
- issue: Expressão distributiva com gênero gramatical
  choice: “cada um ... em seu próprio idioma”
  alternative: “cada pessoa ... em seu próprio idioma”
  rationale: A formulação conserva o singular distributivo do grego e é uma construção genérica normal em português, sem afirmar que a multidão fosse composta somente por homens.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente no Brasil e amplamente compreensível no mundo lusófono. O ponto da nota vem após o marcador para manter a ligação inequívoca entre a nota e “idioma”.
