source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: pt
  text: Tanto judeus como prosélitos, cretenses e árabes — nós os ouvimos falar em nossos próprios idiomas das grandes obras de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: judeus
  rationale: Neste contexto, o termo designa o povo judeu presente entre a multidão da diáspora, não apenas habitantes da Judeia.
- source_word: τε καὶ
  choice: judeus e prosélitos
  rationale: A coordenação portuguesa transmite naturalmente o vínculo entre os dois grupos sem uma construção correlativa pesada.
- source_word: προσήλυτοι
  choice: prosélitos
  rationale: Termo preciso e estabelecido para gentios que haviam aderido ao judaísmo.
- source_word: Κρῆτες καὶ Ἄραβες
  choice: cretenses e árabes
  rationale: Designações modernas e naturais dos habitantes de Creta e dos povos árabes.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: nós os ouvimos falar
  rationale: Reproduz de modo idiomático a percepção direta expressa pelo presente de ἀκούομεν e pelo particípio λαλούντων.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: em nossos próprios idiomas
  rationale: O contexto imediato destaca idiomas humanos reconhecíveis; “próprios” preserva a ênfase de ἡμετέραις.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: os feitos grandiosos de Deus
  rationale: Expressa atos notáveis e poderosos atribuídos a Deus, evitando a possível abstração de “grandezas”.
theological_decisions:
- issue: Sentido de γλώσσαις no relato de Pentecostes
  choice: idiomas humanos reconhecíveis
  alternative: línguas ou expressões extáticas
  rationale: A multidão multinacional afirma ouvir em seus próprios idiomas. A tradução segue essa indicação narrativa sem transformar o versículo numa definição abrangente de todas as ocorrências de “línguas” no Novo Testamento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O travessão preserva a transição da enumeração para a declaração enfática da multidão.
