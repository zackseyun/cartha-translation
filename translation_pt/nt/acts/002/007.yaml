  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: pt
  text: 'E eles estavam atônitos e admirados, dizendo: “Vejam![a] Não são galileus todos estes que estão falando?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis!”; ou: “Olhem!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: estavam atônitos
  rationale: O imperfeito exprime uma reação contínua de profundo espanto. “Estavam atônitos” preserva a intensidade sem recorrer a uma expressão opaca como “estavam fora de si”.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo narrativo brando; “E” dá continuidade natural ao relato.
- source_word: καὶ
  choice: e
  rationale: Coordena as duas reações cumulativas descritas pelos verbos no imperfeito.
- source_word: ἐθαύμαζον
  choice: admirados
  rationale: O verbo indica admiração ou assombro diante de algo extraordinário. Em combinação com “atônitos”, “admirados” conserva a segunda nuance da reação expressa no grego.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz diretamente o conteúdo da fala e mantém a simultaneidade da reação.
- source_word: Οὐχ
  choice: Não são
  rationale: A partícula introduz uma pergunta que espera resposta afirmativa; a pergunta negativa em português preserva essa expectativa.
- source_word: ἰδοὺ
  choice: Vejam!
  rationale: Partícula que chama a atenção dos ouvintes. “Vejam!” é atual, clara e conserva sua força deíctica.
- source_word: πάντες οὗτοί
  choice: todos estes
  rationale: Traduz a totalidade do grupo sem acrescentar “homens”, termo que não aparece explicitamente no grego.
- source_word: οἱ λαλοῦντες
  choice: que estão falando
  rationale: O particípio substantivado presente identifica os falantes e apresenta a ação como em andamento.
- source_word: Γαλιλαῖοι
  choice: galileus
  rationale: É a designação regional direta e consagrada em português, sem inserir explicações sociais não declaradas no versículo.
theological_decisions:
- issue: Força social ou regional implícita de “galileus”
  choice: Manter apenas a designação regional “galileus”.
  alternative: Acrescentar qualificações como “galileus do norte” ou “galileus sem instrução”.
  rationale: O texto registra surpresa com a origem galileia dos falantes, mas não explica sua causa. Qualificações sobre sotaque, educação ou posição social introduziriam inferências contextuais no corpo da tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A duplicação semântica de “atônitos e admirados” foi mantida para representar os dois verbos gregos e sua reação cumulativa. A exclamação após “Vejam!” reproduz naturalmente a função de ἰδού antes da pergunta.
