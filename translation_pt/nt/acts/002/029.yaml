id: ACT.2.29
reference: Acts 2:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: pt
  text: 'Homens, irmãos[a], posso falar-lhes com franqueza a respeito do patriarca Davi: ele morreu e foi sepultado, e seu túmulo permanece entre nós até hoje.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Irmãos”. O grego traz literalmente “Homens, irmãos”, uma forma solene de dirigir-se aos israelitas ali reunidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Homens, irmãos
  rationale: Preserva os dois vocativos masculinos do grego. Embora a fórmula seja pouco comum no português atual, ela mantém a solenidade do discurso e evita apagar a forma explícita do original.
- source_word: ἐξὸν εἰπεῖν
  choice: posso falar-lhes
  rationale: Expressa a liberdade ou permissão para falar, e não mera capacidade. Combinada com «com franqueza», forma uma construção natural em português.
- source_word: μετὰ παρρησίας
  choice: com franqueza
  rationale: Neste contexto, παρρησία destaca fala aberta, franca e confiante. «Com franqueza» comunica isso mais naturalmente em português do que uma reprodução rígida como «com ousadia».
- source_word: πρὸς ὑμᾶς
  choice: falar-lhes
  rationale: O pronome enclítico representa de modo conciso e natural os destinatários da fala.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: a respeito do patriarca Davi
  rationale: Mantém o título πατριάρχης com seu equivalente português tradicional e traduz περί de modo claro e corrente.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da declaração permitida pelo contexto, sem alterar sua relação sintática.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: ele morreu e foi sepultado
  rationale: Transmite os dois fatos coordenados e a voz passiva de ἐτάφη. O valor correlativo de καί...καί fica suficientemente expresso pela coordenação natural em português, sem o peso estilístico de «tanto...como».
- source_word: τὸ μνῆμα αὐτοῦ
  choice: seu túmulo
  rationale: μνῆμα designa aqui o local de sepultamento conhecido de Davi; «túmulo» é preciso e adequado ao contexto.
- source_word: ἔστιν ἐν ἡμῖν
  choice: permanece entre nós
  rationale: O presente, em conjunto com «até hoje», implica existência continuada. «Permanece» torna essa continuidade natural em português, enquanto «entre nós» conserva o sentido local e comunitário.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: até hoje
  rationale: Equivalente idiomático direto que conserva o ponto temporal da fala.
theological_decisions:
- issue: Tratamento da dupla forma masculina de chamamento
  choice: Homens, irmãos
  alternative: Irmãos; Irmãos e irmãs
  rationale: O grego traz explicitamente os dois vocativos masculinos ἄνδρες e ἀδελφοί. A tradução os conserva sem ampliar o texto para «irmãos e irmãs». A nota explica a função formal da expressão e oferece a forma portuguesa mais fluente como alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A dupla saudação é deliberadamente formal por refletir o grego; o restante da frase usa sintaxe corrente. O tratamento «falar-lhes» evita regionalismos mais marcados.
