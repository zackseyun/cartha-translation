id: ACT.2.36
reference: Acts 2:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: pt
  text: Portanto, que toda a casa de Israel saiba com certeza que Deus fez deste Jesus, que vocês crucificaram, Senhor e Messias[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Cristo». O título grego é Χριστός (Christós); aqui, «Messias» preserva seu sentido de título no discurso de Pedro a Israel.
    reason: alternative_reading
  - marker: b
    text: No contexto imediato, a expressão se refere à exaltação pública de Jesus por Deus (Atos 2:33).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: com certeza
  rationale: Expressa de modo natural e enfático a certeza indicada pelo advérbio.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a conclusão lógica extraída do argumento anterior sobre a ressurreição e a exaltação de Jesus.
- source_word: γινωσκέτω
  choice: que ... saiba
  rationale: Reproduz o imperativo de terceira pessoa dirigido coletivamente a Israel.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: toda a casa de Israel
  rationale: Preserva a expressão bíblica corporativa e sua referência ao povo da aliança.
- source_word: κύριον
  choice: Senhor
  rationale: Conserva o título de autoridade exaltada e sua provável relação com a citação precedente.
- source_word: χριστόν
  choice: Messias
  rationale: No discurso dirigido a Israel, o sentido titular é saliente; a nota registra a alternativa tradicional «Cristo».
- source_word: ἐποίησεν
  choice: fez
  rationale: Traduz diretamente o aoristo sem substituir sua força lexical por «nomeou» ou «constituiu»; o contexto e a nota esclarecem a exaltação pública.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: a este Jesus
  rationale: Mantém a força demonstrativa e enfática da identificação do Jesus histórico.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: que vocês crucificaram
  rationale: Formulação direta, natural e fiel à acusação enfática dirigida aos ouvintes.
theological_decisions:
- issue: Sentido de «Deus fez Senhor e Messias» em relação à cristologia
  choice: Manter «fez» no texto e explicar que a frase se refere à exaltação e instalação pública de Jesus nessas funções.
  alternative: Traduzir «nomeou» ou «constituiu», ou interpretar a frase como mudança da natureza divina de Jesus.
  rationale: «Fez» preserva a força lexical de ἐποίησεν e a tensão da formulação; a nota evita impor ao verbo a ideia de criação ou de mudança da natureza divina.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Diante da «casa de Israel», o termo funciona claramente como título messiânico; «Messias» torna esse sentido transparente, enquanto a alternativa tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva o tom solene e conclusivo do discurso sem soar arcaica; «vocês» comunica naturalmente o plural explícito de ὑμεῖς.
