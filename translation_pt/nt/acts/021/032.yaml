lexical_decisions:
- source_word: ἐξαυτῆς
  choice: imediatamente
  rationale: Expressa a ação sem demora, com naturalidade e clareza no português atual.
- source_word: παραλαβὼν
  choice: reuniu
  rationale: No contexto, indica que o oficial tomou consigo soldados e centuriões; «reuniu» comunica de modo natural a mobilização do grupo, sem sugerir que os encontrou casualmente.
- source_word: στρατιώτας
  choice: soldados
  rationale: É o equivalente comum e preciso para os militares mencionados individualmente.
- source_word: ἑκατοντάρχας
  choice: centuriões
  rationale: Preserva o título militar romano reconhecido e indica que mais de um oficial acompanhou o comandante.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: desceu correndo até eles
  rationale: Mantém tanto a rapidez quanto o movimento descendente sugerido pelo contexto da fortaleza, sem atribuir hostilidade adicional.
- source_word: χιλίαρχον
  choice: comandante
  rationale: Torna imediatamente compreensível a função do oficial romano; uma nota registra os equivalentes históricos mais específicos.
- source_word: ἐπαύσαντο
  choice: pararam
  rationale: Equivalente direto e natural para a interrupção da ação em curso.
- source_word: τύπτοντες
  choice: de espancar
  rationale: Expressa golpes repetidos e violentos, preservando o aspecto contínuo do particípio.
