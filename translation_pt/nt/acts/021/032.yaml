base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: pt
  text: Ele imediatamente tomou consigo soldados e centuriões e desceu correndo até eles; quando viram o comandante[a] e os soldados, pararam de espancar Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tribuno militar». O termo grego χιλίαρχος designava o oficial romano que comandava uma coorte.
