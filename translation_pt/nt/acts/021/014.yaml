id: ACT.21.14
reference: Acts 21:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: pt
  text: 'Como ele não se deixava convencer, nós nos calamos[a] e dissemos: “Seja feita a vontade do Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “paramos de insistir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Como ele não se deixava convencer
  rationale: A construção absoluta no genitivo apresenta a circunstância que levou o grupo a cessar sua insistência. “Não se deixava convencer” preserva a nuance contextual de que Paulo não cedia aos apelos, sem parafrasear como “não queria ouvir”.
- source_word: ἡσυχάσαμεν
  choice: nós nos calamos
  rationale: O aoristo indica que eles cessaram de argumentar e ficaram em silêncio. “Nós nos calamos” é natural e conciso em português; a nota registra a nuance possível de cessar a insistência.
- source_word: εἰπόντες
  choice: e dissemos
  rationale: A coordenação é a forma mais natural em português de expressar o particípio ligado ao verbo principal, sem mudar a sequência narrativa.
- source_word: Τοῦ κυρίου
  choice: do Senhor
  rationale: “Senhor” é a tradução corrente de κύριος e mantém o referente no mesmo grau de explicitação do grego.
- source_word: τὸ θέλημα
  choice: a vontade
  rationale: “Vontade” expressa de modo direto aquilo que o Senhor quer ou determina e é a formulação idiomática consagrada neste contexto.
- source_word: γινέσθω
  choice: Seja feita
  rationale: O imperativo expressa submissão à vontade do Senhor. “Seja feita” é natural, digna e preserva a formulação bíblica sem reduzir o sentido a uma mera previsão do que acontecerá.
theological_decisions:
- issue: Referente de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: O contexto provavelmente aponta para Jesus, mas o texto grego diz apenas “o Senhor”. A tradução não torna o referente mais explícito nem adota uma interpretação denominacional.
- issue: Força de γινέσθω
  choice: Seja feita a vontade do Senhor
  alternative: Que aconteça a vontade do Senhor
  rationale: A opção escolhida comunica submissão, não fatalismo, e mantém aberta a relação entre propósito divino e os acontecimentos anunciados.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural: o particípio εἰπόντες foi vertido por coordenação (“e dissemos”).'
