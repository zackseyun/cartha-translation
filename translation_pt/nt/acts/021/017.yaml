id: ACT.21.17
reference: Acts 21:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: pt
  text: Quando chegamos a Jerusalém, os irmãos nos receberam com alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “irmãos”, termo que também pode se referir de modo mais amplo aos demais fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Quando chegamos
  rationale: O genitivo absoluto com γίνομαι estabelece a circunstância temporal da chegada. “Quando chegamos” expressa isso de modo natural e fiel em português.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: εἰς indica o destino. Com o verbo “chegar”, a regência portuguesa natural é “chegar a Jerusalém”.
- source_word: ἀσμένως
  choice: com alegria
  rationale: O advérbio indica satisfação ou contentamento ao receber alguém. “Com alegria” é claro, natural e semanticamente próximo, sem acrescentar a ideia mais específica de cordialidade sugerida por “calorosamente”.
- source_word: ἀπεδέξαντο
  choice: receberam
  rationale: Neste contexto, ἀποδέχομαι descreve o acolhimento de pessoas. “Receberam com alegria” comunica naturalmente a ideia hospitaleira do verbo, sem precisar explicitar “acolheram”.
- source_word: οἱ ἀδελφοί
  choice: os irmãos
  rationale: A tradução preserva a forma masculina plural do grego e o uso cristão de parentesco espiritual. O termo pode abranger a comunidade de fiéis em sentido mais amplo, possibilidade indicada em nota.
theological_decisions:
- issue: Sentido de οἱ ἀδελφοί para a comunidade cristã de Jerusalém
  choice: os irmãos
  alternative: os irmãos e as irmãs; os fiéis
  rationale: O texto grego emprega o masculino plural ἀδελφοί. A redação principal preserva essa forma e sua metáfora de parentesco espiritual, enquanto a nota registra que, no uso cristão antigo, o termo também pode incluir mulheres.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “chegamos a Jerusalém” segue a regência corrente, e “receberam com alegria” mantém a naturalidade sem perder o valor de ἀσμένως.
