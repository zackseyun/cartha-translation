  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: pt
  text: Nós, depois de completarmos a viagem marítima de Tiro, chegamos a Ptolemaida. Depois de saudar os irmãos[a], ficamos um dia com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “irmãos”, um masculino plural que pode referir-se mais amplamente aos fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Nós
  rationale: O pronome explícito mantém o sujeito da narrativa; δέ funciona como transição ou continuação e não precisa ser vertido por uma conjunção marcada em português.
- source_word: τὸν πλοῦν διανύσαντες ἀπὸ Τύρου
  choice: completando a viagem desde Tiro
  rationale: διανύω indica levar um percurso ao fim, e πλοῦς designa uma viagem marítima. A formulação preserva a construção participial e apresenta Tiro como ponto de partida.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: chegamos a Ptolemaida
  rationale: Em contexto de viagem, καταντάω significa chegar ou alcançar um destino; a preposição εἰς assinala esse destino.
- source_word: ἀσπασάμενοι
  choice: Depois de saudar
  rationale: O particípio aoristo expressa ação anterior à permanência, e ἀσπάζομαι significa saudar ou cumprimentar.
- source_word: τοὺς ἀδελφοὺς
  choice: os irmãos
  rationale: A forma grega é masculina plural e, no uso cristão antigo, pode designar de modo coletivo os fiéis, possivelmente incluindo mulheres; a forma lexical é mantida no texto e a abrangência é registrada em nota.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: ficamos um dia com eles
  rationale: μένω significa ficar ou permanecer; o acusativo indica duração, e παρά com dativo expressa companhia ou presença junto às pessoas.
theological_decisions:
- issue: Abrangência de ἀδελφοὺς na comunidade cristã
  choice: os irmãos
  alternative: os irmãos e as irmãs; os fiéis
  rationale: O texto mantém o masculino plural formal do grego sem excluir a possibilidade contextual de que o termo abranja toda a comunidade de fiéis; essa possibilidade é explicitada em nota para preservar a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ptolemaida” segue a forma tradicional portuguesa do topônimo; a divisão em duas frases melhora a fluidez sem alterar a sequência dos acontecimentos.
