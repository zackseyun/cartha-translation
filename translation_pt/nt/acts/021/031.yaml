  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: pt
  text: Enquanto procuravam matá-lo, chegou ao comandante da coorte[a] a notícia de que Jerusalém inteira estava em tumulto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A coorte era uma unidade militar romana; seu comandante era um oficial conhecido como tribuno militar.
    reason: cultural_note
  - marker: b
    text: Ou “estava em confusão” ou “estava agitada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Enquanto procuravam matá-lo
  rationale: O genitivo absoluto com particípio presente indica uma ação em andamento, contemporânea à chegada da notícia. “Procuravam matá-lo” preserva esse aspecto e traduz ἀποκτεῖναι de maneira direta e natural.
- source_word: ἀνέβη φάσις
  choice: chegou ... a notícia
  rationale: A expressão grega diz literalmente que uma informação “subiu”, provavelmente em direção à fortaleza e ao comandante. Em português, “chegou ... a notícia” comunica naturalmente o movimento e o resultado sem obscurecer o sentido.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: ao comandante da coorte
  rationale: χιλίαρχος designa aqui o oficial romano que comandava a unidade; σπεῖρα é o termo para uma coorte. A tradução mantém a designação histórica da unidade e explica sua natureza em nota.
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: de que Jerusalém inteira estava em tumulto
  rationale: “Jerusalém inteira” preserva a metonímia compacta do grego. συγχύννεται retrata a cidade em estado de perturbação ou confusão coletiva; “estava em tumulto” é claro e adequado ao contexto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe narrativa natural. Mantém “coorte” pela precisão histórica, acompanhado de nota explicativa; evita o tecnicismo menos acessível “quiliarca”.
