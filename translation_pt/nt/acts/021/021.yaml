review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a acusação reportada, a referência metonímica a Moisés, o alcance aos judeus dispersos entre as nações e os dois conteúdos da alegada instrução. Contudo, falta a preposição exigida pela construção portuguesa «ensinar alguém a + infinitivo», o que compromete a relação sintática que reproduz διδάσκεις ... λέγων.
  naturalness: O registro é moderno, claro e apropriado. Com «a abandonar», a frase fica plenamente idiomática e inequívoca em português internacional de boa legibilidade brasileira.
  terminology: «Abandonar Moisés» conserva de modo eficaz a força acusatória de ἀποστασίαν ἀπὸ Μωϋσέως sem converter a expressão em uma conclusão teológica. A nota explica com sobriedade tanto a alternativa lexical quanto a metonímia. «Costumes» é uma boa tradução contextual de ἔθεσιν.
  issues:
  - severity: medium
    issue: Falta a preposição «a» após «ensina todos os judeus».
    rationale: Em português, o infinitivo que expressa o conteúdo da instrução requer «ensinar alguém a fazer algo». Sem «a», a construção fica sintaticamente deficiente e pode obscurecer que «abandonar Moisés» é aquilo que Paulo supostamente ensinava os judeus a fazer.
  revised_text: Mas foram informados a seu respeito que você ensina todos os judeus que vivem entre as nações a abandonar Moisés[a], dizendo-lhes que não circuncidem seus filhos nem vivam segundo os costumes.
  revised_footnotes:
  - marker: a
    text: 'Ou: “a apostatar de Moisés”. Aqui, “Moisés” representa a Lei de Moisés e as práticas judaicas ancestrais.'
    reason: Alternativa lexical e nota cultural para ἀποστασίαν ἀπὸ Μωϋσέως.
  revision_rationale: Acrescentou-se apenas a preposição «a», necessária à regência de «ensinar», sem alterar o sentido, o escopo da acusação ou a ambiguidade preservada no texto grego.
