source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: pt
  text: Mas foram informados a seu respeito que você ensina todos os judeus que vivem entre as nações a abandonar Moisés[a], dizendo-lhes que não circuncidem seus filhos nem vivam segundo os costumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a apostatar de Moisés”. Aqui, “Moisés” representa a Lei de Moisés e as práticas judaicas ancestrais.'
    reason: Alternativa lexical e nota cultural para ἀποστασίαν ἀπὸ Μωϋσέως.
lexical_decisions:
- source_word: κατηχήθησαν
  choice: foram informados
  rationale: O passivo de κατηχέω indica aqui que eles receberam oralmente informações a respeito de Paulo. “Foram informados” expressa com naturalidade o caráter indireto da acusação.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: a abandonar Moisés
  rationale: A construção denota afastamento ou deserção. A forma verbal é mais natural em português do que “apostasia de Moisés” e mantém a força da acusação sem transformá-la em categoria teológica técnica.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: todos os judeus que vivem entre as nações
  rationale: A expressão se refere aos judeus da diáspora, residentes entre os povos não judeus. “Entre as nações” preserva τὰ ἔθνη e é clara no contexto.
- source_word: λέγων
  choice: dizendo-lhes
  rationale: O particípio introduz o conteúdo ou a maneira do ensino atribuído a Paulo e retoma naturalmente os judeus mencionados.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: que não circuncidem seus filhos
  rationale: αὐτούς fornece a ideia possessiva ligada a τὰ τέκνα. “Filhos” é idiomático em português e não explicita além do texto o sexo das crianças.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: nem vivam segundo os costumes
  rationale: Embora περιπατεῖν signifique literalmente “andar”, aqui é uma metáfora para a conduta de vida. “Vivam segundo” comunica o sentido de modo natural, enquanto ἔθεσιν se refere aos costumes judaicos herdados.
theological_decisions:
- issue: Natureza da acusação contra Paulo quanto a Moisés
  choice: Apresentar como acusação que Paulo ensinava os judeus a “abandonar Moisés”
  alternative: “ensina apostasia de Moisés” ou “ensina a abandonar a lei de Moisés”
  rationale: O versículo relata o que outros foram informados acerca de Paulo, sem confirmar a veracidade da alegação. “Moisés” é mantido no texto, preservando a metonímia e evitando resolver a tensão por meio de uma expansão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “você” para o singular dirigido a Paulo, “vivem” para tornar explícita a situação dos judeus entre as nações e “vivam segundo os costumes” para traduzir naturalmente a metáfora grega de andar.
