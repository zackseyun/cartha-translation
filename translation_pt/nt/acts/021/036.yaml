lexical_decisions:
- source_word: ἠκολούθει
  choice: vinha atrás
  rationale: O imperfeito apresenta a ação em andamento no passado; a expressão é natural em português para a multidão que seguia Paulo e os soldados.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o relato do versículo anterior.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: a multidão do povo
  rationale: Reproduz o substantivo coletivo e seu qualificativo sem acrescentar o tom pejorativo de “turba”.
- source_word: κράζοντες
  choice: gritando
  rationale: Exprime a ação simultânea e intensa do particípio em linguagem corrente e digna.
- source_word: Αἶρε αὐτόν
  choice: Acabem com ele!
  rationale: No contexto hostil, a expressão idiomática exige a eliminação de Paulo, não simplesmente que ele seja levantado; a nota preserva a alternativa mais literal e também possível.
