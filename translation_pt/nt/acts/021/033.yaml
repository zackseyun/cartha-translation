  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: pt
  text: Então, o comandante[a] se aproximou, agarrou Paulo e ordenou que o amarrassem com duas correntes[b]. E perguntava quem ele era e o que tinha feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tribuno”. O termo grego χιλίαρχος designa um oficial militar romano, literalmente um “comandante de mil”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “duas correntes” pode fazer eco à profecia de Atos 21:11, segundo a qual Paulo seria amarrado em Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa o oficial romano que comandava uma coorte, literalmente um “comandante de mil”. “Comandante” é claro e natural, enquanto o termo técnico alternativo fica registrado em nota.
- source_word: ἐγγίσας
  choice: se aproximou
  rationale: O particípio aoristo indica a aproximação que antecedeu as ações principais; a formulação é natural e preserva a sequência narrativa.
- source_word: ἐπελάβετο αὐτοῦ
  choice: agarrou Paulo
  rationale: O verbo expressa tomar alguém fisicamente; “agarrou” comunica a ação enérgica no contexto de detenção. O nome “Paulo” evita ambiguidade pronominal em português.
- source_word: ἐκέλευσε δεθῆναι
  choice: ordenou que o prendessem
  rationale: Preserva a ordem autoritativa e o sentido passivo sem produzir uma construção rígida em português.
- source_word: ἁλύσεσι δυσί
  choice: com duas correntes
  rationale: É a correspondência direta de ἁλύσεις no contexto de custódia e mantém a possível relação verbal com Atos 21:11.
- source_word: ἐπυνθάνετο
  choice: perguntava
  rationale: O imperfeito retrata uma indagação em andamento em meio ao tumulto.
- source_word: τίς εἴη
  choice: quem ele era
  rationale: Transmite naturalmente a pergunta indireta; o optativo oblíquo não requer uma expressão modal explícita em português.
- source_word: τί ἐστιν πεποιηκώς
  choice: o que tinha feito
  rationale: A construção perifrástica perfeita aponta para uma ação realizada com relevância presente; no discurso indireto passado, o mais-que-perfeito composto é natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. A repetição de “e” foi moderada por divisão em duas frases, sem alterar a progressão do grego. “Paulo” explicita o referente de αὐτοῦ para evitar ambiguidade.
