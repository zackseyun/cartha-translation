id: ACT.21.29
reference: Acts 21:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: pt
  text: Pois eles tinham visto anteriormente Trófimo, o efésio, na cidade com ele, e supunham que Paulo o havia levado para dentro do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o termo grego traduzido como “templo” pode se referir ao complexo ou recinto do templo, e não necessariamente apenas ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: tinham visto anteriormente
  rationale: A construção perifrástica expressa uma ação anterior ao que estava acontecendo; o mais-que-perfeito composto com “anteriormente” comunica essa relação temporal com clareza.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trófimo, o efésio
  rationale: O adjetivo em aposição identifica Trófimo por sua origem e preserva de modo natural a estrutura grega.
- source_word: ἐν τῇ πόλει
  choice: na cidade
  rationale: Refere-se a Jerusalém como espaço urbano, em contraste contextual com a área do templo.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Tradução direta que mantém a forma pronominal do grego; no contexto, o referente é Paulo.
- source_word: ἐνόμιζον
  choice: supunham
  rationale: Expressa uma conclusão inferida, não conhecimento certo, e mantém um registro digno e corrente.
- source_word: εἰς τὸ ἱερὸν
  choice: para dentro do templo
  rationale: “Templo” é a expressão mais natural no texto principal; a preposição composta explicita o movimento para o interior, enquanto a nota preserva o alcance mais amplo de ἱερόν.
- source_word: εἰσήγαγεν
  choice: havia levado
  rationale: O mais-que-perfeito composto indica naturalmente que a suposta entrada era anterior à acusação; “levar” se ajusta ao movimento de conduzir alguém para dentro.
theological_decisions:
- issue: Alcance de ἱερόν na acusação contra Paulo
  choice: templo, com nota explicando que o termo pode designar o complexo ou recinto do templo
  alternative: pátios do templo; recinto do templo
  rationale: O termo grego é mais amplo que ναός e não especifica apenas o santuário interior. A formulação principal permanece natural, e a nota conserva a precisão histórica relevante à acusação de introduzir um gentio em área restrita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Supunham” preserva o caráter inferencial da acusação; “com ele” mantém a referência pronominal do original sem explicitação indevida.
