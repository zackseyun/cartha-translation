  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: pt
  text: 'Ao ouvirem isso, eles glorificaram a Deus e lhe disseram: “Você vê, irmão, quantos milhares[a] há entre os judeus[b] que creram, e todos são zelosos pela lei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quantas dezenas de milhares”. O grego μυριάδες pode indicar unidades de dez mil ou, de modo mais geral, um número muito grande.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre os judeanos” ou “entre os habitantes da Judeia”, caso o termo seja entendido geograficamente, e não principalmente em sentido étnico-religioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo tem valor temporal; “isso” retoma naturalmente o relato anterior, embora o objeto esteja implícito no grego.
- source_word: ἐδόξαζον τὸν θεόν
  choice: eles glorificaram a Deus
  rationale: Preserva o sentido de atribuir glória a Deus e o aspecto narrativo do imperfeito no contexto, expresso naturalmente em português pelo pretérito perfeito.
- source_word: εἶπόν τε αὐτῷ
  choice: e lhe disseram
  rationale: Representa a coordenação narrativa de τε e explicita de modo idiomático o objeto indireto αὐτῷ.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: Você vê, irmão
  rationale: Mantém o apelo direto e retórico a Paulo em linguagem atual, com o vocativo masculino específico.
- source_word: πόσαι μυριάδες
  choice: quantos milhares
  rationale: Comunica uma quantidade muito grande em português corrente sem impor que μυριάδες seja uma contagem técnica exata; a possibilidade de “dezenas de milhares” é preservada em nota.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: entre os judeus
  rationale: O contexto destaca a identidade étnico-religiosa dos que creram; a leitura geográfica “judeus da Judeia” permanece possível e é registrada em nota.
- source_word: τῶν πεπιστευκότων
  choice: que creram
  rationale: Conserva a força verbal do particípio perfeito, referindo-se aos que chegaram à fé e continuam nessa condição, sem acrescentar um objeto não expresso.
- source_word: πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: e todos são zelosos pela lei
  rationale: “Zelosos” preserva a intensidade de ζηλωταί, enquanto ὑπάρχουσιν funciona aqui como cópula; “pela lei” remete naturalmente à Lei mosaica.
theological_decisions:
- issue: Alcance de ἐν τοῖς Ἰουδαίοις
  choice: entre os judeus
  alternative: entre os judeus da Judeia
  rationale: A afirmação enfatiza principalmente a identidade judaica e o zelo pela Lei, não apenas a residência geográfica. A nota conserva a possibilidade de entender Ἰουδαῖοι em sentido regional.
- issue: Força numérica de μυριάδες
  choice: quantos milhares
  alternative: quantas dezenas de milhares
  rationale: O termo pode indicar unidades de dez mil ou, de maneira menos precisa, uma multidão muito numerosa. O texto principal evita uma precisão indevida e a nota registra o valor numérico mais estrito.
- issue: Relação dos crentes judeus com a lei
  choice: todos são zelosos pela lei
  alternative: todos têm grande zelo pela Lei
  rationale: A tradução mantém a declaração descritiva do texto sem inferir aprovação ou censura teológica desse zelo e sem especificar além do contexto como ele se manifestava.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” torna natural o singular de Θεωρεῖς sem perder o respeito do vocativo “irmão”. A ordem das frases acompanha de perto o grego, mas evita construções excessivamente literais. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
