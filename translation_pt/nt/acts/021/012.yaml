id: ACT.21.12
reference: Acts 21:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: pt
  text: Quando ouvimos essas coisas, tanto nós como os moradores daquele lugar insistíamos com ele para que não subisse a Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suplicávamos a ele que não subisse a Jerusalém”. O verbo também pode transmitir a ideia de um apelo insistente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz a circunstância temporal e a progressão do relato de maneira natural; o valor levemente conectivo de δέ não precisa ser expresso separadamente.
- source_word: ἠκούσαμεν ταῦτα
  choice: ouvimos essas coisas
  rationale: Retoma, no plural, o conteúdo profético relatado anteriormente, sem especificá-lo além do texto grego.
- source_word: παρεκαλοῦμεν
  choice: insistíamos com ele
  rationale: O verbo pode indicar exortar, apelar ou suplicar. “Insistíamos” comunica o apelo sério, e o imperfeito preserva seu caráter continuado.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: tanto nós como os moradores daquele lugar
  rationale: Mantém a ênfase nos dois grupos que participaram do apelo e expressa ἐντόπιοι em português claro e digno.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: para que não subisse
  rationale: Expressa naturalmente o conteúdo negativo do apelo, mantendo a referência a Paulo e o sentido direcional de ἀναβαίνω.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: Indica o destino de modo idiomático em português; em conjunto com “subisse”, preserva a linguagem de subida a Jerusalém.
theological_decisions:
- issue: Linguagem direcional da viagem a Jerusalém
  choice: subisse a Jerusalém
  alternative: fosse a Jerusalém
  rationale: O grego emprega ἀναβαίνειν, “subir”, expressão convencional para viajar a Jerusalém. Preservá-la reflete a forma do texto sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Moradores daquele lugar” evita o tom coloquial de “os locais”, enquanto “insistíamos com ele” conserva a seriedade e a duração do apelo.
