  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: pt
  text: Enquanto permanecíamos ali por mais alguns dias, desceu da Judeia um profeta chamado Ágabo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Enquanto permanecíamos ali
  rationale: O particípio presente no genitivo integra uma construção absoluta de sentido temporal. O sujeito implícito, à luz do contexto narrativo, é Paulo e seus companheiros; por isso, a primeira pessoa do plural é adequada. “Permanecíamos ali” expressa a continuidade da estadia.
- source_word: δὲ
  choice: Enquanto
  rationale: A partícula marca uma transição leve e, junto da construção participial, pode ser naturalmente incorporada à oração temporal em português, sem exigir um “e” ou “então” separado.
- source_word: ἡμέρας πλείους
  choice: por mais alguns dias
  rationale: O acusativo indica duração. O comparativo πλείους pode apontar para dias adicionais; “mais alguns dias” preserva essa nuance melhor que apenas “vários dias” e soa natural em português.
- source_word: κατῆλθέν
  choice: desceu
  rationale: Preserva o movimento direcional expresso por κατέρχομαι e a perspectiva geográfica convencional da viagem da Judeia para a região costeira.
- source_word: τις
  choice: um
  rationale: O pronome indefinido introduz um novo participante. Em português, “um profeta” comunica essa indefinição de modo natural, sem a rigidez de “certo profeta”.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: da Judeia
  rationale: Tradução direta e idiomática da expressão de origem geográfica.
- source_word: προφήτης
  choice: um profeta
  rationale: Equivalente corrente e preciso, mantendo a função profética atribuída a Ágabo sem paráfrase interpretativa.
- source_word: ὀνόματι Ἅγαβος
  choice: chamado Ágabo
  rationale: A construção com ὀνόματι identifica o nome da pessoa. “Chamado Ágabo” é idiomático, claro e digno em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com ampla legibilidade brasileira. A ordem “desceu da Judeia um profeta” conserva discretamente a progressão informacional do grego e continua natural em registro bíblico contemporâneo.
