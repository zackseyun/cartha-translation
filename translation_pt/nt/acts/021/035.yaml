  verdict: revise
  source_fidelity: A tradução principal comunica corretamente a chegada aos degraus e a causa da ação. Contudo, «teve de ser carregado» explicita uma necessidade que é fortemente sugerida pelo contexto, mas que a construção συνέβη + infinitivo apresenta mais diretamente como o fato ocorrido. Uma formulação que preserve «aconteceu que» representa melhor a construção grega sem perder clareza.
  naturalness: «Quando Paulo chegou aos degraus, aconteceu que os soldados o carregaram...» é português moderno, claro e narrativamente natural. A expressão evita uma passiva pesada e mantém Paulo explicitamente identificado.
  terminology: «Degraus», «soldados», «violência» e «multidão» são escolhas adequadas. A nota deve dizer «quartel romano», não «fortaleza romana», pois o contexto imediato fala do quartel/acampamento militar; além disso, a nota lexical deve corresponder ao marcador ligado à violência.
  issues:
  - severity: medium
    issue: A formulação principal «teve de ser carregado» transforma em necessidade explícita o que o grego formula como o acontecimento de ele estar sendo carregado.
    rationale: συνέβη βαστάζεσθαι significa literalmente algo como «aconteceu que ele era/foi carregado». A necessidade é uma inferência contextual legítima, mas é melhor mantê-la como alternativa em nota, não como único sentido do texto.
  - severity: low
    issue: A nota sobre os degraus chama o destino de «fortaleza romana».
    rationale: Atos 21:34, 37 refere-se ao quartel/acampamento militar. «Quartel romano» é mais preciso e não acrescenta uma caracterização desnecessária.
  - severity: low
    issue: A nota lexical atualmente ligada a «multidão» trata da construção «aconteceu que ... foi carregado».
    rationale: A âncora deve ficar junto de «carregaram», expressão à qual a observação lexical se refere.
