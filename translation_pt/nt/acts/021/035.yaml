  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: pt
  text: Quando Paulo chegou aos degraus[a], aconteceu que os soldados o carregaram[b] por causa da violência da multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os degraus da escadaria que levava ao quartel romano (veja Atos 21:34, 37).
    reason: cross_reference
  - marker: b
    text: 'Ou: “ele teve de ser carregado pelos soldados”. A expressão grega diz literalmente que aconteceu que ele era carregado; no contexto, a violência da multidão torna evidente a necessidade disso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Quando
  rationale: Introduz a oração temporal; o δέ é uma conexão narrativa leve que pode ser absorvida naturalmente em português.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: Paulo chegou aos degraus
  rationale: A construção idiomática indica chegada a um lugar. O nome 'Paulo', explícito pelo contexto, evita a ambiguidade natural do pronome em português.
- source_word: ἀναβαθμούς
  choice: degraus
  rationale: Designa os degraus ou a escadaria que subia para a fortaleza; 'degraus' preserva a imagem concreta.
- source_word: συνέβη βαστάζεσθαι
  choice: teve de ser carregado
  rationale: A combinação descreve a circunstância resultante provocada pela violência da multidão. Em português, esta formulação expressa naturalmente a necessidade contextual, embora o grego também possa ser vertido de modo mais formal como 'aconteceu que foi carregado'.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: pelos soldados
  rationale: Tradução direta e natural do agente da construção passiva.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: por causa da violência da multidão
  rationale: διά com acusativo indica causa; βία comunica força violenta, e ὄχλος é traduzido de modo lexicalmente neutro como 'multidão'.
