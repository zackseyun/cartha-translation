translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador fique junto da expressão que explica. A formulação principal prioriza naturalidade sem ocultar na nota a construção mais formal do grego.
