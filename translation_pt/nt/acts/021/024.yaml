language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: pt
  text: Leve esses homens com você, purifique-se junto com eles e pague as despesas deles, para que raspem a cabeça. Assim, todos saberão que não há fundamento algum nas coisas que lhes disseram a seu respeito[a], mas que você também vive de modo ordeiro[b], guardando a Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas coisas que lhes ensinaram a seu respeito”. O verbo grego pode significar “instruir” ou, de modo mais geral, “informar”. Aqui se refere aos relatos que circulavam sobre Paulo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “anda em linha, guardando a Lei”, isto é, conduz-se de maneira coerente com a observância da Lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Leve esses homens com você
  rationale: O particípio παραλαβών tem força imperativa no contexto. “Esses homens” explicita o referente masculino indicado pelo contexto anterior, e “com você” expressa naturalmente a ideia de tomá-los consigo.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: purifique-se junto com eles
  rationale: O imperativo refere-se à purificação ritual; a forma reflexiva é natural em português e “junto com eles” representa claramente σύν.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: pague as despesas deles
  rationale: A expressão indica arcar com os custos em favor deles, provavelmente os relacionados ao voto.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: para que raspem a cabeça
  rationale: A construção com ἵνα expressa finalidade. O singular coletivo/distributivo “a cabeça” é natural em português e conserva a forma do grego.
- source_word: γνώσονται πάντες
  choice: Assim, todos saberão
  rationale: O futuro é direto, e “Assim” torna explícita a consequência pretendida sem alterar o sentido.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: nas coisas que lhes disseram a seu respeito
  rationale: κατηχέω pode significar instruir ou informar. Neste contexto, a formulação abrange relatos recebidos sem pressupor catequese formal; a nota preserva a alternativa lexical.
- source_word: οὐδέν ἐστιν
  choice: não há fundamento algum
  rationale: A expressão afirma que os relatos não têm substância ou base; esta formulação comunica o valor idiomático com clareza.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: mas que você também vive de modo ordeiro, guardando a Lei
  rationale: στοιχέω descreve andar em linha ou conduzir-se de modo coerente, enquanto φυλάσσω significa guardar ou observar. A tradução mantém distintos os dois elementos, evitando reduzir um ao outro.
- source_word: νόμον
  choice: a Lei
  rationale: No contexto, refere-se à Lei judaica. A inicial maiúscula sinaliza esse referente reconhecível sem acrescentar “de Moisés”, que não aparece no texto.
theological_decisions:
- issue: A relação de Paulo com a Lei nesta narrativa
  choice: você também vive de modo ordeiro, guardando a Lei
  alternative: você também vive em observância da Lei
  rationale: A tradução apresenta a conclusão que a ação pública de Paulo deveria produzir, sem convertê-la numa formulação sistemática sobre sua teologia da Lei. Também preserva os dois verbos gregos e a tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar a Lei judaica neste contexto. As notas [a] e [b] aparecem no texto principal e esclarecem, respectivamente, a amplitude de κατηχέω e a imagem de στοιχέω.
