base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: pt
  text: Alguns dos discípulos de Cesareia também foram conosco e nos levaram até um certo Mnasom, natural de Chipre, discípulo de longa data,[b] com quem ficaríamos hospedados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conduzindo-nos até Mnasom... para que ficássemos hospedados com ele” ou “levando-nos à casa de Mnasom”. O particípio e o verbo referente à hospedagem admitem maneiras ligeiramente diferentes, mas próximas, de entender a construção grega.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um discípulo dos primeiros tempos”. A expressão pode indicar que Mnasom era discípulo havia muito tempo, possivelmente desde os primeiros dias do movimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον
  choice: foram conosco
  rationale: No contexto da viagem, o verbo, reforçado por σὺν ἡμῖν, indica que esses discípulos acompanharam o grupo.
- source_word: τῶν μαθητῶν
  choice: alguns dos discípulos
  rationale: 'O genitivo com καί tem sentido partitivo: não todos, mas alguns dentre os discípulos.'
- source_word: ἀπὸ Καισαρείας
  choice: de Cesareia
  rationale: Indica a procedência dos discípulos em português corrente.
- source_word: ἄγοντες
  choice: nos levaram até
  rationale: Expressa de modo natural que eles conduziram o grupo ao lugar ou à pessoa que lhes daria hospedagem.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: com quem ficaríamos hospedados
  rationale: ξενίζω, neste contexto, refere-se a receber alguém como hóspede; a formulação comunica a hospedagem prevista.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: certo Mnasom, natural de Chipre
  rationale: Mantém a apresentação indefinida de τινι e traduz Κυπρίῳ de maneira imediatamente compreensível.
- source_word: ἀρχαίῳ μαθητῇ
  choice: um dos primeiros discípulos
  rationale: Preserva o provável sentido temporal de um discípulo dos primeiros tempos, sem afirmar que pertencia necessariamente ao grupo original.
theological_decisions:
- issue: Sentido de ἀρχαίῳ μαθητῇ
  choice: um dos primeiros discípulos
  alternative: um discípulo de longa data
  rationale: A expressão pode apontar tanto para alguém ligado aos primeiros tempos do movimento quanto para alguém que era discípulo havia muito tempo. O texto principal adota o sentido histórico provável, e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficar hospedado” torna explícito o contexto de hospitalidade sem recorrer a linguagem arcaica. As notas preservam as ambiguidades sintáticas e temporais do grego.
