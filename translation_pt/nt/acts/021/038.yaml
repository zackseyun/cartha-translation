  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: pt
  text: Então você não é o egípcio que, há algum tempo, provocou uma revolta e levou para o deserto os quatro mil sicários[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assassinos armados de punhais”; o termo grego é “sicários”, nome dado a um grupo conhecido por ataques com punhais ocultos.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Então você não é
  rationale: A combinação introduz uma inferência em forma de pergunta. “Então” expressa naturalmente em português a conclusão que o comandante tira ao ouvir Paulo falar grego.
- source_word: ὁ Αἰγύπτιος
  choice: o egípcio
  rationale: O artigo aponta para uma figura conhecida ou notória no contexto. “O egípcio” preserva essa referência definida sem acrescentar explicação ao texto.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: há alguns dias
  rationale: A expressão indica um período breve anterior ao momento da fala. Esta formulação é idiomática e não especifica além do grego.
- source_word: ἀναστατώσας
  choice: provocou uma revolta
  rationale: Neste contexto político, o verbo descreve incitação à agitação ou insurreição, não apenas desordem genérica.
- source_word: ἐξαγαγὼν
  choice: levou ... para
  rationale: O particípio indica conduzir um grupo para fora, em direção ao deserto. A formulação portuguesa é natural e mantém a ação de liderança.
- source_word: εἰς τὴν ἔρημον
  choice: para o deserto
  rationale: Ἔρημος designa uma região desabitada ou erma. “Deserto” é claro no contexto geográfico, sem necessariamente implicar apenas dunas de areia.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: os quatro mil
  rationale: O artigo define um grupo específico. Em português, “os quatro mil” é suficiente porque “sicários” já identifica homens pertencentes ao grupo; evita a construção pesada “os quatro mil homens dos sicários”.
- source_word: τῶν σικαρίων
  choice: sicários
  rationale: O termo grego é a designação histórica de membros de um grupo associado a ataques com punhais ocultos. A transliteração portuguesa preserva o referente histórico, enquanto a nota esclarece o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta conserva o tom inferencial e surpreso do comandante. A vírgula após “que” separa o adjunto temporal deslocado sem tornar a frase excessivamente formal.
