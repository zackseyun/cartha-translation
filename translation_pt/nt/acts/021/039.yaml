id: ACT.21.39
reference: Acts 21:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: pt
  text: 'Mas Paulo disse: “Eu sou judeu, de Tarso, na Cilícia, cidadão de uma cidade que não é insignificante. Peço-lhe que me permita falar ao povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: sou judeu
  rationale: A construção portuguesa identifica Paulo de modo natural e fiel, sem exigir a expressão menos idiomática «homem judeu»; o masculino singular já está expresso em «judeu».
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: natural de Tarso, na Cilícia
  rationale: Expressa de forma corrente a origem indicada por Ταρσεύς e situa Tarso na Cilícia, mantendo «cidadão» para traduzir separadamente πολίτης.
- source_word: οὐκ ἀσήμου πόλεως
  choice: de uma cidade nada insignificante
  rationale: Preserva a litotes grega, em vez de convertê-la diretamente em «cidade importante».
- source_word: πολίτης
  choice: cidadão
  rationale: Mantém a noção de vínculo ou condição cívica, mais específica que a de simples habitante.
- source_word: δέομαι
  choice: Peço-lhe
  rationale: Comunica um pedido respeitoso e insistente dirigido à autoridade, sem recorrer a uma formulação excessivamente dramática.
- source_word: ἐπίτρεψόν μοι
  choice: que me permita
  rationale: É uma forma natural e respeitosa de solicitar autorização em português contemporâneo.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: falar ao povo
  rationale: Traduz diretamente o ato de dirigir a palavra ao λαός, preservando «povo» em vez de restringir o referente a «multidão».
- source_word: μέν
  choice: ênfase incorporada em «Eu sou judeu»
  rationale: A partícula dá relevo à autoidentificação de Paulo; em português, o pronome explícito «Eu» transmite essa ênfase de modo mais natural que «de fato» ou «certamente».
theological_decisions:
- issue: Sentido de Ἰουδαῖος no contexto
  choice: judeu
  alternative: judeano
  rationale: Paulo distingue sua identidade judaica de sua procedência geográfica, especificada em seguida como Tarso da Cilícia; «judeano» poderia sugerir equivocadamente origem na Judeia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, mas «natural de Tarso» e «cidadão» permanecem distintos, refletindo Ταρσεύς e πολίτης. Não se acrescentou nota, pois a ambiguidade estrutural não altera substancialmente o sentido em português.
