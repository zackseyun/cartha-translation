  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: pt
  text: No dia seguinte, partimos e chegamos a Cesareia. Entramos na casa de Filipe, o evangelista, que era um dos sete[a], e ficamos hospedados com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um dos sete homens anteriormente escolhidos para o serviço em Jerusalém (ver Atos 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressa de modo natural em português a sequência temporal da narrativa; o valor continuativo de δέ fica adequadamente refletido pelo fluxo do relato.
- source_word: ἐξελθόντες
  choice: partimos
  rationale: No contexto de viagem, indica a saída do local anterior e evita a literalidade pouco natural de «tendo saído».
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: chegamos a Cesareia
  rationale: Embora ἔρχομαι possa ser traduzido por «ir» ou «vir», com um destino expresso a formulação portuguesa destaca naturalmente a chegada, sem alterar o movimento narrativo.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Entramos na casa
  rationale: Converte o particípio em oração coordenada natural, preservando a sequência das ações e o sentido concreto de οἶκος.
- source_word: Φιλίππου
  choice: Filipe
  rationale: Forma portuguesa tradicional do nome próprio grego.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: o evangelista
  rationale: Mantém o substantivo ministerial εὐαγγελιστής com seu equivalente estabelecido e compreensível em português, sem explicá-lo além do texto.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: que era um dos sete
  rationale: Identifica Filipe com o grupo mencionado anteriormente, sem transformar a expressão em título técnico nem acrescentar uma função eclesiástica.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: ficamos hospedados com ele
  rationale: No contexto de viagem e hospitalidade, explicita de maneira idiomática o sentido contextual de μένω παρά, mais precisamente do que o simples «ficamos com ele».
theological_decisions:
- issue: Identificação de Filipe como «um dos sete»
  choice: Manter «que era um dos sete», com «sete» em minúscula e uma nota de referência histórica.
  alternative: «que pertencia aos Sete» ou identificação explícita como diácono
  rationale: O texto alude aos sete homens de Atos 6, mas não lhes atribui aqui um título eclesiástico técnico. A formulação preserva a referência histórica sem importar estruturas ministeriais posteriores.
translation_notes:
  register: Português moderno, digno e fluente, com ampla legibilidade brasileira. A divisão em duas frases reduz o acúmulo de coordenações do grego sem mudar a ordem dos acontecimentos. «Ficamos hospedados» torna claro o contexto de hospitalidade; «um dos sete» conserva a formulação não técnica do original.
