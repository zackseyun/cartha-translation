  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: pt
  text: No dia seguinte[a], Paulo foi conosco até Tiago, e todos os presbíteros estavam presentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No outro dia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “compareceram” ou “chegaram”. O verbo grego pode destacar tanto a chegada como a presença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: No dia seguinte
  rationale: A expressão idiomática no dativo indica o dia seguinte. A formulação é natural em português moderno; a partícula δέ funciona aqui como transição narrativa e não exige tradução explícita.
- source_word: εἰσῄει
  choice: foi
  rationale: O verbo expressa movimento para dentro ou entrada. Com o complemento pessoal introduzido por πρός, «foi ... até Tiago» comunica naturalmente o deslocamento sem acrescentar um local não expresso.
- source_word: σὺν ἡμῖν
  choice: conosco
  rationale: σύν com o dativo indica acompanhamento; «conosco» é a equivalência direta e idiomática.
- source_word: πρὸς Ἰάκωβον
  choice: até Tiago
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. «Até Tiago» preserva esse valor direcional sem inserir que se tratava da casa de Tiago ou explicitar a finalidade da visita.
- source_word: πάντες τε
  choice: e todos
  rationale: τέ liga a oração à anterior com leve força coordenativa; «e» reproduz essa conexão sem sobrecarregar a frase.
- source_word: παρεγένοντο
  choice: compareceram
  rationale: παραγίνομαι pode focalizar a chegada ou a presença. «Compareceram» é natural para a participação em um encontro e mantém alguma proximidade entre chegar e estar presente; uma nota registra outras possibilidades.
- source_word: οἱ πρεσβύτεροι
  choice: os presbíteros
  rationale: No contexto de Atos, o termo designa líderes reconhecidos da comunidade. «Presbíteros» é corrente em português bíblico, preserva a designação funcional e evita substituí-la pela explicação mais ampla «líderes».
theological_decisions:
- issue: Identidade e função de Ἰάκωβον
  choice: Traduzir apenas pelo nome pessoal «Tiago», sem explicação adicional.
  alternative: «Tiago, irmão do Senhor» ou «Tiago, líder da igreja de Jerusalém».
  rationale: O versículo não identifica Tiago por parentesco nem por cargo. Embora o contexto permita reconhecer a pessoa, acrescentar uma identificação resolveria no texto algo que o grego deixa implícito.
- issue: Sentido eclesial de οἱ πρεσβύτεροι
  choice: «os presbíteros», sem especificar uma estrutura denominacional.
  alternative: «os anciãos» ou «os líderes da igreja».
  rationale: O termo se refere a líderes reconhecidos da comunidade de Jerusalém, mas não define aqui uma forma posterior de governo eclesiástico. A tradução mantém o título sem importar uma estrutura denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «No dia seguinte» e «conosco» são idiomáticos; «compareceram» se ajusta ao contexto de uma reunião. Mantém-se «Tiago» sem identificação acrescentada e «presbíteros» sem definição denominacional.
