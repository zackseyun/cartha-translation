  source_fidelity: O texto reproduz com precisão a acusação em discurso direto, o apelo vocativo, a extensão «a todos, por toda parte», os três objetos de «contra» e a referência específica a «gregos». A nota explica corretamente que ἱερόν designa o complexo/recintos do templo, não o santuário interior. Contudo, «chegou a introduzir» pode sugerir que ele por fim conseguiu fazê-los entrar ou que isso ocorreu depois de tentativas, nuance que não está em εἰσήγαγεν; o elemento intensificador é expresso por ἔτι τε καί.
  naturalness: O português é moderno, claro e adequado ao registro de uma acusação pública. «Além disso, ele até introduziu» é mais idiomático e transmite diretamente a intensificação acusatória sem a possível implicação temporal de «chegou a».
  terminology: «Lei», no contexto da Lei mosaica, é uma capitalização defensável; «profanou» é apropriado para κοινόω em contexto cultual; e «lugar santo» preserva a linguagem do texto. «Gregos» deve permanecer, em vez de generalizar para «gentios».
