  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: pt
  text: 'gritando: “Homens de Israel, ajudem! Este é o homem que ensina a todos, por toda parte, contra o povo, contra a Lei e contra este lugar. Além disso, ele até introduziu gregos no templo[a] e profanou este lugar santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere ao complexo ou aos pátios do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: gritando
  rationale: O particípio presente indica a maneira pública e urgente pela qual faziam a acusação; “gritando” é natural e direto em português.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  rationale: Preserva o vocativo masculino e constitui uma forma de tratamento clara e digna em português.
- source_word: βοηθεῖτε
  choice: ajudem!
  rationale: Imperativo plural que pede auxílio sem explicitar um objeto; evita acrescentar “nos”, ausente do grego.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Este é o homem
  rationale: Reproduz de modo natural a identificação enfática e acusatória.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: contra o povo, contra a Lei e contra este lugar
  rationale: κατά com genitivo exprime oposição. A repetição de “contra” esclarece em português que os três elementos dependem da mesma relação; “Lei” indica, pelo contexto, a Lei mosaica.
- source_word: πάντας πανταχῇ διδάσκων
  choice: que ensina a todos, por toda parte
  rationale: Conserva a abrangência enfática de πάντας e πανταχῇ em formulação idiomática.
- source_word: ἔτι τε καὶ
  choice: Além disso
  rationale: Expressa a adição intensificadora de uma acusação ainda mais grave.
- source_word: Ἕλληνας
  choice: gregos
  rationale: Mantém o sentido lexical específico, sem generalizá-lo para “gentios”.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: ele chegou a introduzir gregos no templo
  rationale: “Chegou a” comunica o valor enfático de καί, enquanto “introduzir” representa o ato de fazê-los entrar. “Templo” é natural no texto, com nota sobre o alcance de ἱερόν.
- source_word: κεκοίνωκεν
  choice: profanou
  rationale: No contexto cultual, κοινόω significa tornar impuro ou profano; “profanou” comunica com clareza a alegação de violação da santidade do lugar.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: este lugar santo
  rationale: Preserva tanto o demonstrativo quanto a qualificação cultual do local.
theological_decisions:
- issue: Referência de τοῦ νόμου
  choice: Lei, com inicial maiúscula, como referência à Lei mosaica
  alternative: lei, em minúscula, como formulação graficamente genérica
  rationale: No contexto judaico e do templo em Jerusalém, a acusação diz respeito à Lei de Israel. A maiúscula ajuda a identificar o referente sem acrescentar conteúdo doutrinário.
- issue: Alcance de ἱερόν
  choice: templo no texto, com nota esclarecendo o complexo ou os pátios do templo
  alternative: pátios do templo ou recinto do templo no texto principal
  rationale: “Templo” é a expressão mais natural para o leitor comum, mas ἱερόν não designa especificamente o santuário interior; a nota conserva essa distinção histórica e lexical.
- issue: Natureza da declaração sobre Paulo
  choice: Manter a formulação como acusação dos opositores, sem confirmar sua veracidade
  alternative: Explicitar no versículo que a acusação era falsa
  rationale: O discurso direto já apresenta as palavras dos acusadores. Inserir uma avaliação editorial resolveria algo que o versículo não declara expressamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contra” favorece clareza oral; “profanou” mantém o registro cultual sem soar arcaico.
