  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: pt
  text: Então Paulo levou consigo aqueles homens e, no dia seguinte, depois de se purificar com eles, entrou no templo[a], comunicando o término dos dias da purificação, até que a oferta fosse apresentada[b] em favor de cada um deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no complexo do templo; o termo grego não se refere especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fosse oferecida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: levou consigo aqueles homens
  rationale: Expressa naturalmente que Paulo os tomou como acompanhantes, sem acrescentar finalidade não declarada no texto.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: no dia seguinte
  rationale: Equivalente temporal corrente e claro em português.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: depois de se purificar com eles
  rationale: Comunica a purificação ritual conjunta e preserva de modo natural o valor reflexivo do particípio.
- source_word: εἰσῄει εἰς τὸ ἱερόν
  choice: entrou no templo
  rationale: O pretérito perfeito produz narrativa natural em português; o contexto pode acomodar o aspecto imperfeito grego sem exigir uma construção progressiva artificial. ἱερόν designa o complexo do templo, esclarecido em nota.
- source_word: διαγγέλλων
  choice: comunicando
  rationale: Reflete uma comunicação formal ou oficial no contexto dos procedimentos do templo, sem especificar destinatários ausentes do texto.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: o término dos dias da purificação
  rationale: Mantém a referência ao período ritual exigido, com formulação compreensível e digna.
- source_word: ἕως οὗ
  choice: até que
  rationale: Preserva a relação temporal e a sintaxe aberta do original, sem transformar indevidamente a frase em explicação.
- source_word: προσηνέχθη
  choice: fosse apresentada
  rationale: No contexto cultual, preserva o sentido formal do passivo de προσφέρω; a alternativa idiomática 'fosse oferecida' consta em nota.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: por cada um deles
  rationale: Reproduz de modo conciso a relação da oferta com cada indivíduo, sem decidir além do texto se a ênfase recai no benefício, na representação ou na obrigação ritual.
- source_word: ἡ προσφορά
  choice: a oferta
  rationale: Termo cultual geral e direto, sem estreitar o sentido para uma modalidade específica de sacrifício.
theological_decisions:
- issue: Natureza da participação de Paulo no rito de purificação do templo
  choice: Narrar diretamente sua participação nos procedimentos judaicos de purificação.
  alternative: Redigir de modo a sugerir aprovação ou rejeição da validade contínua desses ritos para os cristãos.
  rationale: O versículo relata a ação de Paulo, mas não formula uma conclusão doutrinária sobre a Lei, o templo ou a teologia da aliança.
- issue: Relação temporal e ritual da oferta com o período de purificação
  choice: Manter a formulação temporal 'até que', relativamente próxima da construção grega.
  alternative: Explicitar quem apresentou a oferta ou reconstruir a sequência ritual de maneira inequívoca.
  rationale: A sintaxe grega é compacta e não identifica expressamente o agente da oferta; a tradução preserva essa abertura em vez de importar uma reconstrução interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a estrutura temporal densa do grego sem acrescentar explicações teológicas ou agentes não expressos. Os marcadores foram colocados junto aos termos efetivamente esclarecidos pelas notas.
