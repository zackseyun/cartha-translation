  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem narrativa e a reciprocidade do grego foram preservadas sem rigidez. O marcador [b] foi colocado junto à expressão que ele explica, “suas casas”.
