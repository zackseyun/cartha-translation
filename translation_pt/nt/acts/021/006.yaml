source:
  edition: SBLGNT
  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: pt
  text: Depois de nos despedirmos uns dos outros[a], embarcamos no navio, e eles voltaram para suas casas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de nos saudarmos”. A expressão grega pode indicar tanto saudação como despedida; o contexto de partida favorece o sentido adotado no texto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para o que era deles” ou “para seus próprios lugares”; a expressão idiomática refere-se às suas casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: nos despedirmos uns dos outros
  rationale: Embora o verbo possa se referir a uma saudação ou despedida, o contexto de partida favorece claramente o sentido de despedir-se. A formulação recíproca preserva ἀλλήλους.
- source_word: ἐνέβημεν
  choice: embarcamos
  rationale: No contexto de viagem marítima, o verbo indica entrar ou subir numa embarcação; “embarcamos” é preciso e natural em português.
- source_word: πλοῖον
  choice: navio
  rationale: O termo pode designar barco ou navio; “navio” é adequado ao contexto das viagens marítimas em Atos e mantém a linguagem corrente.
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: Reproduz de modo direto e natural o movimento de retorno expresso pelo verbo.
- source_word: εἰς τὰ ἴδια
  choice: para suas casas
  rationale: A expressão idiomática indica aquilo que é próprio de alguém, especialmente seu lugar ou lar; “suas casas” comunica naturalmente o sentido contextual.
theological_decisions: []
