base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: pt
  text: 'Quando Paulo estava prestes a ser levado ao quartel[a], disse ao comandante[b]: “Posso dizer-lhe uma coisa?” Ele perguntou: “Sabe grego?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, as instalações militares romanas, provavelmente dentro do complexo da fortaleza.
    reason: cultural_note
  - marker: b
    text: Ou “tribuno”. O termo grego designa um oficial militar romano, tradicionalmente chamado de “tribuno”.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Quando Paulo estava para ser levado para dentro
  rationale: A oração temporal comunica naturalmente a iminência expressa por μέλλων e preserva a voz passiva de εἰσάγεσθαι.
- source_word: παρεμβολή
  choice: quartel
  rationale: Neste contexto militar em Jerusalém, designa as instalações das tropas romanas, provavelmente na fortaleza Antônia; “quartel” é claro e corrente em português.
- source_word: χιλίαρχος
  choice: comandante
  rationale: O termo designa um oficial romano de alta patente, literalmente associado ao comando de mil homens. “Comandante” é mais compreensível ao leitor comum; a especificidade histórica é indicada em nota.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Posso dizer-lhe uma coisa?
  rationale: Reproduz como pedido cortês de permissão a força idiomática da construção grega, sem o artificialismo de uma condicional literal em português.
- source_word: τι
  choice: uma coisa
  rationale: Equivalente coloquial e natural do pronome indefinido “algo” neste pedido de fala.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Você sabe grego?
  rationale: Mantém o sentido básico de γινώσκεις e expressa de modo natural o conhecimento de uma língua em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dizer-lhe” preserva cortesia sem excessiva formalidade; “você” torna natural a pergunta direta do comandante. A repetição genérica de λέγει/ἔφη foi diferenciada como “disse/perguntou” porque a segunda fala é claramente interrogativa.
