id: ACT.21.1
reference: Acts 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: pt
  text: Depois de nos separarmos deles com dificuldade e partirmos para o mar, seguimos em linha reta e chegamos a Cós; no dia seguinte, a Rodes; e dali, a Pátara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Depois de
  rationale: A construção idiomática introduz o acontecimento seguinte na sequência narrativa; «Depois de» produz uma transição temporal natural em português.
- source_word: ἀναχθῆναι
  choice: partirmos para o mar
  rationale: Em contexto náutico, ἀνάγω significa sair para o mar ou zarpar; a formulação escolhida é clara e atual.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: nos separarmos deles com dificuldade
  rationale: ἀποσπάω transmite uma separação forçada ou dolorosa, mais forte que uma simples partida. A expressão conserva essa carga sem soar artificial.
- source_word: εὐθυδρομήσαντες
  choice: seguimos em linha reta
  rationale: O verbo náutico indica navegar em curso reto; a tradução preserva a ideia de trajeto direto em linguagem natural.
- source_word: ἤλθομεν εἰς
  choice: chegamos a
  rationale: No relato de viagem, a expressão indica chegada ao destino; «chegamos a» é conciso e idiomático.
- source_word: Κῶ
  choice: Cós
  rationale: Forma portuguesa tradicional e reconhecível do nome da ilha grega.
- source_word: τῇ δὲ ἑξῆς
  choice: no dia seguinte
  rationale: Equivalente português direto e natural para a expressão temporal.
- source_word: Ῥόδον
  choice: Rodes
  rationale: Forma portuguesa estabelecida do nome da ilha.
- source_word: κἀκεῖθεν
  choice: e dali
  rationale: A crase de καί com ἐκεῖθεν encadeia a etapa seguinte da viagem; «e dali» preserva ambas as ideias com concisão.
- source_word: Πάταρα
  choice: Pátara
  rationale: Forma portuguesa consagrada, com acento necessário à pronúncia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A intensidade emocional de ἀποσπασθέντας foi expressa de modo natural, evitando tanto o enfraquecimento por «nos despedirmos» quanto a formulação excessivamente literal «nos arrancarmos». A elipse de «chegamos» nos dois últimos destinos acompanha o grego e mantém o itinerário fluente.
