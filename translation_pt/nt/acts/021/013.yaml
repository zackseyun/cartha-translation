id: ACT.21.13
reference: Acts 21:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: pt
  text: 'Então Paulo respondeu: “O que vocês estão fazendo, chorando e partindo meu coração[a]? Pois estou pronto não só para ser amarrado, mas também para morrer em Jerusalém pelo nome[b] do Senhor Jesus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esmagando meu coração”. O verbo grego é mais forte que uma simples tristeza e retrata uma ruptura emocional profunda.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa do nome do Senhor Jesus”. Na linguagem bíblica, “o nome” representa o próprio Jesus, sua autoridade e a causa ligada a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη
  choice: Então Paulo respondeu
  rationale: Reproduz naturalmente a sequência narrativa e o verbo comum de resposta, sem acrescentar força interpretativa.
- source_word: Τί ποιεῖτε
  choice: O que vocês estão fazendo
  rationale: Mantém a forma direta da pergunta grega e o tom de protesto emocionado de Paulo.
- source_word: κλαίοντες
  choice: chorando
  rationale: Expressa em português atual a ação contínua indicada pelo particípio, com a solenidade adequada ao contexto.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: partindo meu coração
  rationale: Conserva a metáfora emocional do original em uma expressão portuguesa natural; a intensidade lexical mais forte é indicada em nota.
- source_word: δεθῆναι
  choice: ser amarrado
  rationale: Traduz diretamente a ideia de ser atado, especialmente pertinente ao gesto profético anterior de Ágabo, sem ampliá-la para o sentido mais geral de ser encarcerado.
- source_word: ἀποθανεῖν
  choice: morrer
  rationale: Equivalente direto e idiomático do infinitivo grego.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Em português, a preposição locativa expressa naturalmente o lugar onde Paulo se dispõe a sofrer e morrer.
- source_word: ἑτοίμως ἔχω
  choice: estou pronto
  rationale: Equivalente natural e conciso do idioma grego que indica disposição ou preparo.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: pelo nome
  rationale: Preserva o idioma bíblico e sua densidade sem reduzi-lo a uma paráfrase explicativa.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Mantém κύριος como título cristológico e segue a forma consagrada e natural em português.
theological_decisions:
- issue: Tradução de κύριος aplicado a Jesus
  choice: Senhor Jesus
  alternative: Mestre Jesus
  rationale: “Senhor” preserva o título cristológico normalmente expresso por κύριος e evita enfraquecê-lo por paráfrase.
- issue: Preservação do idioma “o nome”
  choice: pelo nome do Senhor Jesus
  alternative: por causa do Senhor Jesus
  rationale: O original apresenta “o nome” como referência à pessoa, autoridade e causa de Jesus. A formulação principal conserva essa expressão teologicamente significativa, enquanto a nota esclarece uma alternativa idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural do verbo grego; “partindo meu coração” comunica a metáfora com naturalidade, e “pelo nome” conserva o idioma bíblico.
