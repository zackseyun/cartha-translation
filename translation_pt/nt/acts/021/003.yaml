id: ACT.21.3
reference: Acts 21:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: pt
  text: Depois de avistarmos Chipre e deixá-la à nossa esquerda[a], continuamos navegando rumo à Síria e chegamos a Tiro[b], pois era ali que o navio descarregava a carga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Chipre ficou do lado esquerdo do navio enquanto eles navegavam.
    reason: cultural_note
  - marker: b
    text: Ou “descemos a Tiro”. O grego diz mais literalmente “descemos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “estava sendo descarregado” ou “desembarcava sua carga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: depois de avistarmos
  rationale: O particípio aoristo indica ação anterior à navegação principal. “Avistarmos” é natural em contexto marítimo e expressa a entrada da ilha no campo de visão.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: deixá-la à nossa esquerda
  rationale: Preserva diretamente o sentido de εὐώνυμον, indicando que Chipre ficou do lado esquerdo durante a rota, sem recorrer ao termo náutico mais técnico “bombordo”.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: continuamos navegando rumo à Síria
  rationale: A formulação comunica o curso contínuo expresso pelo imperfeito e soa natural em português.
- source_word: κατήλθομεν εἰς Τύρον
  choice: chegamos a Tiro
  rationale: κατέρχομαι traz literalmente a ideia de “descer”, mas em relatos de viagem também pode indicar chegada. “Chegamos” evita uma expressão direcional pouco natural em português, enquanto a nota registra o sentido mais literal.
- source_word: ἐκεῖσε
  choice: ali
  rationale: Retoma Tiro de forma clara e idiomática como o local onde ocorria o descarregamento.
- source_word: ἀποφορτιζόμενον
  choice: descarregava
  rationale: A construção perifrástica ἦν ἀποφορτιζόμενον descreve uma ação em curso. A forma grega admite entender que o navio descarregava ou estava sendo descarregado; a redação principal usa a personificação náutica natural.
- source_word: τὸν γόμον
  choice: a carga
  rationale: γόμος designa a carga ou frete transportado por um navio; “a carga” é corrente, precisa e suficiente no contexto.
theological_decisions: []
