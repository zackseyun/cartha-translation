  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução mantém a perspectiva narrativa na primeira pessoa do plural, evita jargão náutico desnecessário e registra em notas as ambiguidades lexicais genuínas.
