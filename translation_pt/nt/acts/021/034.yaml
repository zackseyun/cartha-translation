base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: pt
  text: Mas, no meio da multidão, uns gritavam uma coisa, e outros, outra. Como ele não conseguia apurar os fatos[a] por causa do tumulto, ordenou que Paulo fosse levado para o quartel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descobrir a verdade sobre o caso” ou “saber ao certo o que havia acontecido”.
    reason: lexical_alternative
  - marker: b
    text: O “quartel” referia-se às instalações militares romanas, provavelmente dentro da fortaleza ligada à área do templo.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: no meio da multidão, uns gritavam uma coisa, e outros, outra
  rationale: Reproduz o contraste distributivo de ἄλλοι...ἄλλο τι, o aspecto contínuo do imperfeito ἐπεφώνουν e a localização na multidão, em português natural.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Como ele não conseguia apurar
  rationale: O genitivo absoluto apresenta a causa da ordem seguinte; “apurar” expressa a tentativa de descobrir informação confiável, e não mero conhecimento abstrato.
- source_word: τὸ ἀσφαλές
  choice: os fatos
  rationale: No contexto, designa aquilo que era seguro ou certo acerca do ocorrido. “Os fatos” é conciso e idiomático, enquanto a nota preserva as alternativas mais formais.
- source_word: διὰ τὸν θόρυβον
  choice: por causa do tumulto
  rationale: θόρυβος indica uma perturbação coletiva ruidosa, mais forte que simples barulho.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: ordenou que Paulo fosse levado
  rationale: Preserva a ordem decisiva e a construção passiva sem acrescentar quem o levou. O referente é explicitado como Paulo para evitar uma sequência ambígua de pronomes em português.
- source_word: εἰς τὴν παρεμβολήν
  choice: para o quartel
  rationale: Neste contexto de Atos, refere-se às instalações militares romanas junto à área do templo; “quartel” é claro e natural em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o cenário tumultuado e evita transformar τὸ ἀσφαλές numa afirmação mais específica do que o grego permite.
