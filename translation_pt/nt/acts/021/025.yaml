revisions:
- from: Quanto aos gentios que creram, nós lhes enviamos instruções, depois de decidir que se abstivessem do que é sacrificado aos ídolos, do sangue, da carne de animais estrangulados[a] e da imoralidade sexual.
  to: Quanto aos gentios que creram, nós lhes enviamos uma mensagem, depois de termos decidido que se abstivessem do que é sacrificado aos ídolos, do sangue, da carne de animais estrangulados[a] e da imoralidade sexual.
  rationale: A revisão conserva o sentido e a estrutura do versículo, mas substitui uma caracterização mais forte do objeto implícito por «uma mensagem» e torna a nota lexicalmente mais precisa quanto a πνικτόν. Não resolve nem introduz qualquer interpretação doutrinária sobre a duração ou o fundamento das proibições.
