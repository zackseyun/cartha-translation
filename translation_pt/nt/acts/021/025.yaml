review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o tópico («Quanto aos»), a referência aos gentios crentes, a decisão anterior ao envio e os quatro itens do decreto. Contudo, «instruções» explicita e pluraliza o objeto que o grego deixa implícito; embora o contexto indique uma comunicação do decreto, «uma mensagem» representa melhor a elipse sem caracterizá-la indevidamente.
  naturalness: O português é claro, moderno e de registro apropriado. «Depois de termos decidido» torna inequívoca a anterioridade expressa pelo particípio grego e soa mais natural do que «depois de decidir» neste contexto narrativo.
  terminology: «Gentios», «imoralidade sexual», «sangue» e «do que é sacrificado aos ídolos» são escolhas adequadas. «Carne de animais estrangulados» comunica corretamente o referente alimentar de πνικτόν. A nota deve especificar a morte por estrangulamento, não apenas a ausência de drenagem de sangue.
  issues:
  - severity: low
    issue: «instruções» torna explícito e plural o objeto de ἀπεστείλαμεν.
    rationale: O verbo grego «enviamos» não repete objeto direto. O contexto permite entender uma comunicação relativa ao decreto, mas «uma mensagem» é uma explicitação mais neutra e menos interpretativa.
  - severity: low
    issue: A nota sobre animais estrangulados não menciona explicitamente o estrangulamento.
    rationale: πνικτόν se refere propriamente ao que foi estrangulado; a retenção do sangue explica a relevância alimentar, mas não substitui a definição lexical.
  revised_text: Quanto aos gentios que creram, nós lhes enviamos uma mensagem, depois de termos decidido que se abstivessem do que é sacrificado aos ídolos, do sangue, da carne de animais estrangulados[a] e da imoralidade sexual.
