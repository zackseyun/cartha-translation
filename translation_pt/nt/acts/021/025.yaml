  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: pt
  text: Quanto aos gentios que creram, nós lhes enviamos uma mensagem, depois de termos decidido que se abstivessem do que é sacrificado aos ídolos, do sangue, da carne de animais estrangulados[a] e da imoralidade sexual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, carne de animais mortos por estrangulamento, normalmente sem que o sangue fosse drenado.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: Quanto aos
  rationale: Introduz naturalmente o novo tópico e preserva a transição suave marcada por δέ, sem exagerar o contraste.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: os gentios que creram
  rationale: Identifica ἔθνη como gentios no contexto e expressa de modo natural o estado resultante do perfeito πεπιστευκότων.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: nós lhes enviamos instruções
  rationale: O pronome explícito preserva a ênfase em 'nós'. Como o objeto de ἀπεστείλαμεν está implícito, 'instruções' comunica a ação contextual sem especificar indevidamente uma carta no texto deste versículo.
- source_word: κρίναντες
  choice: depois de decidir
  rationale: Expressa com clareza que a decisão antecedeu o envio e mantém o caráter deliberativo do particípio.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: que se abstivessem
  rationale: Formulação corrente e digna para a ideia reflexiva de manter-se longe dos itens proibidos.
- source_word: τό τε εἰδωλόθυτον
  choice: do que é sacrificado aos ídolos
  rationale: Mantém a abrangência da expressão grega sem restringi-la explicitamente a carne, embora comida esteja implicada pelo contexto.
- source_word: αἷμα
  choice: do sangue
  rationale: Tradução direta, preservando a concisão do grego sem inserir no corpo do texto uma explicação sobre consumo.
- source_word: πνικτόν
  choice: da carne de animais estrangulados
  rationale: Torna explícito em português o referente alimentar do adjetivo substantivado e evita a expressão pouco natural 'do estrangulado'.
- source_word: πορνείαν
  choice: da imoralidade sexual
  rationale: Expressão moderna e abrangente para conduta sexual ilícita, sem limitar o termo a uma única forma de transgressão.
theological_decisions:
- issue: Natureza e duração das proibições do decreto apostólico
  choice: Apresentar diretamente as quatro proibições sem definir sua duração ou fundamento teológico.
  alternative: Explicá-las como concessões temporárias para a comunhão à mesa ou como lei moral universal permanentemente vinculante.
  rationale: O versículo recorda a decisão apostólica, mas não esclarece aqui a extensão temporal nem a fundamentação de cada item; a tradução deve preservar essa tensão.
- issue: Referente de πνικτόν
  choice: 'Entender o termo em seu sentido alimentar usual: carne de animal morto por estrangulamento.'
  alternative: Traduzir de modo estritamente formal como 'o que é estrangulado'.
  rationale: O substantivo designa no contexto alimento proveniente de animal estrangulado, normalmente sem o sangue drenado; a formulação escolhida é mais clara em português sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da lista e sua formulação concisa foram preservadas; evitou-se inserir interpretações denominacionais.
