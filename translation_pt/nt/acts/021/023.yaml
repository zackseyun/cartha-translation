  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: pt
  text: 'Portanto, faça o que lhe dizemos: temos quatro homens que estão sob voto[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fizeram um voto”. O grego diz literalmente “que têm um voto”.'
    reason: lexical_alternative
  - marker: b
    text: O contexto mais amplo pode sugerir um voto semelhante ao nazireado, mas este versículo diz apenas “um voto”.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Portanto
  rationale: οὖν introduz uma conclusão ou inferência; «portanto» preserva essa ligação, enquanto τοῦτο é expresso pelo conteúdo da ordem seguinte.
- source_word: ποίησον
  choice: faça
  rationale: O imperativo aoristo de ποιέω pede uma ordem direta; «faça» é natural e recebe seu complemento da oração relativa seguinte.
- source_word: ὅ σοι λέγομεν
  choice: o que lhe dizemos
  rationale: A oração relativa expressa o conteúdo da ordem. O presente «dizemos» mantém de modo natural a forma grega.
- source_word: εἰσὶν ἡμῖν
  choice: temos
  rationale: A construção existencial com dativo é idiomaticamente possessiva; «temos» é clara e natural em português.
- source_word: ἄνδρες τέσσαρες
  choice: quatro homens
  rationale: ἀνήρ designa aqui homens adultos; a tradução mantém a referência masculina explícita.
- source_word: εὐχὴν ἔχοντες
  choice: que têm sobre si um voto
  rationale: A expressão comunica que os homens se encontram vinculados por um voto, sem especificar sua modalidade. «Têm sobre si» também permite representar ἀφ’ ἑαυτῶν sem recorrer à formulação pouco clara «um voto próprio».
- source_word: ἀφ’ ἑαυτῶν
  choice: sobre si
  rationale: A expressão indica que o voto recai sobre os próprios homens. A formulação preserva esse sentido reflexivo sem sugerir necessariamente que agiram sem ajuda ou por iniciativa independente.
theological_decisions:
- issue: Natureza do voto no contexto
  choice: Manter apenas «um voto» no texto principal.
  alternative: «um voto de nazireado»
  rationale: Embora o contexto mais amplo possa sugerir um voto semelhante ao nazireado, este versículo usa apenas εὐχή, «voto». Especificá-lo no texto principal excederia a informação explícita da fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção «têm sobre si um voto» é deliberadamente mais próxima da forma grega e preserva sua tensão sem atribuir ao voto uma modalidade não declarada.
