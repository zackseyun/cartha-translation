id: ACT.21.4
reference: Acts 21:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: pt
  text: Depois de encontrarmos os discípulos, ficamos ali sete dias. Por meio do Espírito[a], eles diziam repetidamente a Paulo que não subisse a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo Espírito”. A expressão pode indicar que o Espírito revelou o sofrimento que aguardava Paulo, e que, com base nisso, os discípulos concluíram que ele não deveria prosseguir para Jerusalém.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Depois de encontrarmos
  rationale: O particípio aoristo apresenta uma ação anterior à permanência de sete dias. A formulação é natural em português e mantém a sequência dos acontecimentos; o verbo também pode sugerir que foi preciso localizar os discípulos.
- source_word: μαθητάς
  choice: os discípulos
  rationale: Preserva o termo habitual de Atos para os seguidores de Jesus, sem ampliá-lo para o sentido mais geral de “crentes”.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: ficamos ali
  rationale: ἐπιμένω indica permanecer ou ficar, e αὐτοῦ tem aqui valor locativo, “ali”. A tradução evita acrescentar “com eles”, ideia possível no contexto, mas não expressa diretamente.
- source_word: ἡμέρας ἑπτά
  choice: sete dias
  rationale: O acusativo expressa duração; em português, a duração fica clara com “ficamos ali sete dias”, sem necessidade de acrescentar “durante”.
- source_word: οἵτινες
  choice: eles
  rationale: Retoma os discípulos. O início de uma nova frase torna a referência clara e produz leitura natural.
- source_word: ἔλεγον
  choice: diziam repetidamente
  rationale: O imperfeito pode indicar ação contínua ou reiterada. “Diziam repetidamente” conserva essa força sem transformar a declaração em um único aviso.
- source_word: διὰ τοῦ πνεύματος
  choice: Por meio do Espírito
  rationale: A construção expressa meio ou agência. A inicial maiúscula identifica naturalmente o Espírito Santo no contexto de Atos, sem inserir o adjetivo “Santo”, ausente no grego.
- source_word: μὴ ἐπιβαίνειν
  choice: que não subisse
  rationale: O infinitivo dependente de ἔλεγον transmite o conteúdo do que diziam. “Subisse” preserva a linguagem convencional de subir a Jerusalém e é natural em português.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: Indica o destino da viagem. Com “subir”, a regência “a Jerusalém” é clara e corrente.
theological_decisions:
- issue: Relação entre διὰ τοῦ πνεύματος e a continuação da viagem de Paulo
  choice: Por meio do Espírito
  alternative: pelo Espírito
  rationale: O texto afirma que os discípulos falavam por meio do Espírito, mas não explica se o Espírito comunicou diretamente uma proibição ou se revelou os sofrimentos futuros e os discípulos concluíram que Paulo não deveria prosseguir. A tradução mantém essa tensão com Atos 19:21 e 20:22-23, sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Subisse a Jerusalém” conserva o modo bíblico de indicar a viagem à cidade sem soar excessivamente arcaico. O marcador da nota foi colocado junto à expressão que ela explica.
