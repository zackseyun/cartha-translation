base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: pt
  text: Depois desses dias, fizemos os preparativos[a] e subimos para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arrumamos a bagagem” ou “ficamos prontos”. O particípio grego pode se referir de modo geral aos preparativos para a viagem, e não apenas à bagagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Depois daqueles dias
  rationale: μετά com o acusativo indica sequência temporal. Em português narrativo, “daqueles dias” retoma naturalmente o período mencionado logo antes, sem acrescentar que todos os dias necessariamente “se passaram”.
- source_word: ἐπισκευασάμενοι
  choice: fizemos os preparativos
  rationale: O particípio aoristo indica preparação para a viagem e pode incluir arrumar a bagagem, mas não se limita necessariamente a isso. A formulação ampla preserva melhor a extensão semântica do grego.
- source_word: ἀνεβαίνομεν
  choice: subimos
  rationale: O imperfeito é empregado na progressão narrativa da viagem. “Subimos” preserva a noção direcional e a maneira convencional de descrever a ida a Jerusalém.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: εἰς indica movimento em direção à cidade; “para Jerusalém” é a expressão natural em português neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Preferiu-se “fizemos os preparativos” à opção mais específica “arrumamos a bagagem” para preservar a amplitude lexical do particípio grego.
