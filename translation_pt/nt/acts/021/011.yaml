id: ACT.21.11
reference: Acts 21:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: pt
  text: 'Ele veio até nós, pegou o cinto de Paulo, amarrou os próprios pés e as próprias mãos e disse: “Assim diz o Espírito Santo: ‘Desta maneira, em Jerusalém, os judeus amarrarão o homem a quem pertence este cinto e o entregarão nas mãos dos gentios.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: cinto
  rationale: “Cinto” é o equivalente moderno mais claro para a faixa ou cinto usado em torno da cintura e funciona naturalmente no gesto profético narrado.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: amarrou os próprios pés e as próprias mãos
  rationale: O pronome reflexivo ἑαυτοῦ remete naturalmente ao sujeito, Ágabo. “Amarrou” conserva a ligação lexical com δήσουσιν, mais adiante, e descreve com clareza o ato simbólico.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e bíblica sem deixar de ser compreensível em português atual.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: É a forma corrente e consolidada em português para a expressão grega.
- source_word: Τὸν ἄνδρα
  choice: o homem
  rationale: Reproduz a referência específica a um homem adulto, sem acrescentar o demonstrativo “este”, ausente nessa expressão.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: a quem pertence este cinto
  rationale: Expressa naturalmente em português a relação de posse indicada pelo pronome relativo genitivo.
- source_word: οὕτως
  choice: Desta maneira
  rationale: Liga explicitamente o modo como Ágabo se amarrou ao que aconteceria com Paulo.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação do texto grego sem restringi-la indevidamente a líderes nem substituí-la por uma categoria geográfica.
- source_word: παραδώσουσιν
  choice: o entregarão
  rationale: “Entregar” comunica de modo natural a transferência de Paulo ao poder de outros, sem introduzir a ideia mais específica de traição.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: nas mãos dos gentios
  rationale: Preserva a expressão idiomática bíblica de submissão ao poder alheio; no contexto, ἐθνῶν designa os não judeus.
theological_decisions:
- issue: Fórmula profética apresentada como fala autorizada do Espírito
  choice: Assim diz o Espírito Santo
  alternative: Isto é o que diz o Espírito Santo
  rationale: A escolha preserva a forma solene da fórmula profética grega e sua reivindicação textual de autoridade, sem desenvolver uma interpretação doutrinária adicional.
- issue: Referente de ἑαυτοῦ
  choice: Ágabo amarrou os próprios pés e as próprias mãos
  alternative: Ágabo amarrou os pés e as mãos de Paulo
  rationale: O pronome reflexivo refere-se naturalmente ao sujeito do particípio, indicando que Ágabo realizou em si mesmo o sinal profético.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura foi levemente ajustada à ordem natural do português, enquanto a repetição lexical entre o gesto de amarrar e a profecia foi preservada. Não foram necessárias notas de rodapé.
