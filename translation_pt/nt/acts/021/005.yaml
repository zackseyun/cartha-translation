  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: pt
  text: Quando chegou o momento de completarmos aqueles dias, partimos e seguimos viagem. Todos eles, com as esposas e os filhos, nos acompanharam até fora da cidade. Então, ajoelhados na praia[a], oramos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na margem” ou “à beira-mar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: chegou o momento de completarmos aqueles dias
  rationale: Preserva a construção temporal com ἐγένετο + infinitivo e o sentido de ἐξαρτίζω como completar um período determinado, sem transformar a expressão em mera indicação de partida.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: partimos e seguimos viagem
  rationale: Expressa tanto a saída indicada pelo particípio quanto o prosseguimento da jornada no imperfeito, em português natural.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Todos eles ... nos acompanharam
  rationale: προπέμπω descreve acompanhar alguém que parte, frequentemente como despedida. A formulação conserva a ação concreta sem exigir explicitação interpretativa.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: com as esposas e os filhos
  rationale: No contexto de πάντων no masculino plural e da participação de famílias inteiras, γυναιξίν é mais naturalmente entendido como 'esposas'.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: até fora da cidade
  rationale: Mantém de modo conciso a ideia espacial de acompanhamento até um ponto além dos limites da cidade.
- source_word: θέντες τὰ γόνατα
  choice: ajoelhados
  rationale: Traduz naturalmente o idioma grego de pôr os joelhos, preservando a postura assumida antes da oração.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: na praia
  rationale: αἰγιαλός designa a faixa costeira ou praia; 'praia' é claro e corrente, enquanto alternativas são registradas em nota.
- source_word: προσευξάμενοι
  choice: oramos
  rationale: O particípio aoristo encerra a sequência do versículo; a forma finita produz narrativa natural e conserva a primeira pessoa plural do relato de viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a sequência narrativa e evita literalismos pouco naturais. Não foi inserida nota após “aqueles dias”, pois a alternativa fornecida no material inglês para essa posição descreve, na verdade, προπέμπω e não a expressão temporal grega.
