translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente reorganizada para fluidez narrativa, sem resolver além do texto a identidade de quem fechou as portas; a voz passiva do grego foi preservada.
