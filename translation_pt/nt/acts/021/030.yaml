  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: pt
  text: Toda a cidade ficou agitada, e o povo acorreu em massa[a]. Agarraram Paulo e o arrastavam para fora do templo[b]; imediatamente, as portas foram fechadas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “houve um ajuntamento repentino do povo”. A expressão grega descreve pessoas convergindo às pressas.'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os portões foram fechados”, pois, neste contexto, o termo pode designar os acessos ao recinto do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: ficou agitada
  rationale: O passivo de κινέω descreve aqui comoção coletiva, não simples movimento físico. A expressão é natural em português e mantém a imagem da cidade inteira perturbada.
- source_word: ἡ πόλις ὅλη
  choice: toda a cidade
  rationale: Reproduz de modo direto e idiomático a abrangência da expressão grega.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: o povo acorreu em massa
  rationale: συνδρομή indica uma convergência repentina de pessoas. A formulação dinâmica comunica tanto o ajuntamento quanto a pressa sugerida pelo termo.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: Agarraram Paulo
  rationale: O particípio indica que tomaram Paulo fisicamente e à força. A oração finita torna a sequência clara e natural em português.
- source_word: εἷλκον αὐτὸν
  choice: o arrastaram
  rationale: ἕλκω expressa puxar ou arrastar à força. Embora o imperfeito apresente a ação em curso, o pretérito perfeito é mais natural nesta sequência narrativa portuguesa e não elimina a duração inerente ao ato de arrastar.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: para fora do templo
  rationale: ἱερόν designa o complexo ou recinto do templo, não especificamente o santuário interior. Mantém-se “templo” no texto por clareza, com a precisão cultural em nota.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente claro e atual para o advérbio de prontidão.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: as portas foram fechadas
  rationale: Preserva a construção passiva e o sentido básico de θύραι; no contexto, também pode referir-se a portões de acesso.
