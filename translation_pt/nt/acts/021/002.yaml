  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: pt
  text: Depois de encontrarmos um navio que atravessava para a Fenícia[a], embarcamos e zarpamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um navio com destino à Fenícia”. O grego descreve literalmente um navio “que atravessava para a Fenícia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: encontrando
  rationale: O particípio aoristo indica uma ação anterior à partida; em português, o gerúndio ligado à sequência narrativa comunica isso naturalmente sem tornar a frase pesada.
- source_word: πλοῖον
  choice: um navio
  rationale: Designa aqui uma embarcação marítima adequada à viagem pelo Mediterrâneo; “navio” é claro e corrente.
- source_word: διαπερῶν
  choice: que fazia a travessia
  rationale: Preserva a ideia verbal do particípio presente, que descreve o percurso do navio, em vez de reduzi-lo apenas ao destino.
- source_word: εἰς Φοινίκην
  choice: para a Fenícia
  rationale: A preposição εἰς indica o destino ou direção do percurso.
- source_word: ἐπιβάντες
  choice: embarcamos
  rationale: No contexto náutico, ἐπιβαίνω significa subir a bordo; a forma finita produz uma sequência natural em português.
- source_word: ἀνήχθημεν
  choice: partimos
  rationale: No uso marítimo, ἀνάγω significa fazer-se ao mar ou zarpar. “Partimos” é natural no contexto e evita a possível redundância estilística de “embarcamos e zarpamos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a descrição do navio como estando em rota de travessia e mantém a sequência narrativa concisa.
