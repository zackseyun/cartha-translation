  terminology: '«Língua hebraica» preserva apropriadamente a expressão grega sem resolver no texto principal a provável referência histórica ao aramaico. A nota deve citar a expressão grega de modo mais exato: «língua/dialeto hebraico», não «na língua» ou «no dialeto hebraico».'
