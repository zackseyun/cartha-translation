translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A tradução mantém a referência pronominal ao comandante dependente do contexto, como no grego, e preserva no texto principal a ambiguidade histórica entre “hebraico” e “aramaico” por meio de nota.
