  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: pt
  text: 'Depois que ele lhe deu permissão, Paulo, de pé nos degraus, fez um gesto com a mão para o povo. Quando houve grande silêncio, dirigiu-se a eles em língua hebraica[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em aramaico”. O grego diz literalmente “em língua/dialeto hebraico”, expressão que, neste contexto, pode designar a língua semítica local comumente chamada aramaico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Depois que ele lhe deu permissão
  rationale: A construção absoluta tem valor temporal e retoma o comandante no contexto anterior. A formulação conserva o pronome do grego e explicita, de modo natural em português, que a permissão foi dada a Paulo.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: Paulo, de pé nos degraus
  rationale: O particípio perfeito descreve a posição de Paulo. “De pé nos degraus” é corrente e mantém a referência à escadaria que conduzia à fortaleza.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: fez um gesto com a mão para o povo
  rationale: O verbo indica um sinal feito com a mão, aqui para obter a atenção ou o silêncio. A tradução evita especificar além do texto qual foi exatamente o gesto.
- source_word: τῷ λαῷ
  choice: para o povo
  rationale: Mantém o valor lexical direto de λαός, embora, no contexto, se trate da multidão reunida.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Quando se fez profundo silêncio
  rationale: Reproduz o valor temporal da segunda construção absoluta e o caráter intenso do silêncio, em português natural e digno.
- source_word: προσεφώνησεν
  choice: dirigiu-se a eles
  rationale: O verbo descreve o ato de falar publicamente a determinados ouvintes. O pronome retoma naturalmente o povo mencionado antes.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: em língua hebraica
  rationale: Preserva a designação explícita do grego sem decidir no texto principal se, neste contexto, ela se refere mais precisamente ao aramaico; essa possibilidade fica registrada em nota.
- source_word: λέγων
  choice: 'dizendo:'
  rationale: O particípio introduz o discurso direto que começa no versículo seguinte; os dois-pontos sinalizam essa continuidade.
