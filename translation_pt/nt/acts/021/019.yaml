id: ACT.21.19
reference: Acts 21:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: pt
  text: Depois de saudá-los, Paulo passou a relatar, um por um,[a] os feitos de Deus entre os gentios[b] por meio do seu ministério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em detalhe» ou «cada coisa separadamente». A expressão grega indica um relato item por item.
    reason: lexical_alternative
  - marker: b
    text: Ou «entre as nações». Neste contexto, a expressão se refere aos gentios, isto é, aos povos não judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Depois de saudá-los
  rationale: O particípio aoristo indica uma ação anterior ao relato; esta formulação preserva com naturalidade a sequência.
- source_word: ἐξηγεῖτο
  choice: passou a relatar
  rationale: O imperfeito apresenta um relato em andamento ou desenvolvido; «passou a relatar» comunica esse aspecto sem tornar a frase pesada.
- source_word: καθ’ ἓν ἕκαστον
  choice: um por um
  rationale: A expressão tem força distributiva e indica que Paulo expôs os acontecimentos individualmente ou em detalhe.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: os feitos de Deus
  rationale: A formulação concisa preserva Deus como agente das ações relatadas e se encaixa naturalmente depois de «relatar, um por um».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: Neste contexto de Atos, ἔθνη designa povos não judeus, e não principalmente nações em sentido geopolítico.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: por meio do seu ministério
  rationale: διά com genitivo expressa mediação ou instrumentalidade; «ministério» descreve adequadamente o serviço missionário de Paulo.
theological_decisions:
- issue: A agência na missão de Paulo
  choice: Deus é o autor dos feitos, realizados por meio do ministério de Paulo.
  alternative: Paulo é apresentado como aquele que realizou os feitos entre os gentios.
  rationale: O grego atribui explicitamente a ação a Deus (ἐποίησεν ὁ θεός) e apresenta o ministério de Paulo como o meio (διὰ τῆς διακονίας αὐτοῦ).
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O nome «Paulo» foi explicitado para evitar a possível ambiguidade de «ele» no versículo isolado. As notas preservam as principais alternativas lexicais sem sobrecarregar o texto.
