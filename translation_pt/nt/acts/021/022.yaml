  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: pt
  text: O que se deve fazer, então? Certamente eles ouvirão que você chegou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que é, então?” A expressão grega pergunta o que deve ser feito diante da situação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: O que se deve fazer, então?
  rationale: Literalmente, a expressão diz “O que é, então?”, mas, neste contexto, funciona como uma pergunta prática sobre a providência a tomar. A formulação escolhida comunica essa força idiomática em português natural.
- source_word: πάντως
  choice: Certamente
  rationale: O advérbio reforça a certeza do acontecimento futuro, sem indicar aqui a ideia de obrigação ou de fazer algo “de todo modo”.
- source_word: ἀκούσονται
  choice: eles ouvirão
  rationale: O futuro médio de ἀκούω tem sentido ativo neste contexto. O sujeito plural, implícito no grego e recuperável pelo contexto, é expresso em português.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que eles ouvirão, e não uma oração causal.
- source_word: ἐλήλυθας
  choice: você chegou
  rationale: O perfeito de ἔρχομαι apresenta a chegada de Paulo como fato consumado com resultado presente. Em português, “chegou” expressa isso de modo mais natural do que “tem vindo”, enquanto “você” mantém legível o singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “O que se deve fazer, então?” reproduz naturalmente a função discursiva da pergunta; “certamente” preserva a ênfase de πάντως.
