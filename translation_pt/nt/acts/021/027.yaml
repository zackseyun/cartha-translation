id: ACT.21.27
reference: Acts 21:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: pt
  text: Quando os sete dias já estavam para terminar, os judeus vindos da Ásia, ao verem Paulo no templo[a], agitaram toda a multidão[b] e o agarraram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «templo» se refere ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: 'Ou: «lançaram toda a multidão em confusão». O verbo grego pode destacar tanto a agitação como a confusão da multidão.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «puseram as mãos sobre ele»; isto é, apoderaram-se dele à força.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Quando os sete dias já estavam para terminar
  rationale: Reproduz a circunstância temporal e a ideia de iminência de μέλλω com o infinitivo, em português natural, sem explicar no texto a que período os sete dias se referem.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: os judeus vindos da Ásia
  rationale: Indica procedência e evita que «asiáticos» seja entendido segundo a geografia moderna; Ásia designa aqui a província romana.
- source_word: θεασάμενοι αὐτὸν
  choice: ao verem Paulo
  rationale: Expressa naturalmente o particípio e torna explícito o referente do pronome, sem acrescentar informação não presente no contexto.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma corrente e digna em português; uma nota esclarece que ἱερόν abrange o complexo do templo, não apenas o santuário interior.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: agitaram toda a multidão
  rationale: συγχέω pode denotar agitação, confusão ou desordem. «Agitaram» se ajusta ao contexto de tumulto sem excluir a nuance de confusão, preservada em nota.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: o agarraram
  rationale: Transmite em português atual o sentido idiomático de pôr as mãos sobre alguém para dominá-lo ou detê-lo à força, evitando uma tradução literal potencialmente ambígua.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português. «Paulo» explicita o referente contextual de αὐτόν. As notas preservam a extensão semântica de ἱερόν e as alternativas legítimas de συγχέω e da expressão idiomática ἐπιβάλλω τὰς χεῖρας.
