lexical_decisions:
- source_word: τούτῳ
  choice: Ele
  rationale: O dativo singular retoma Filipe no contexto imediato; em português, a construção possessiva com sujeito explícito é natural.
- source_word: δὲ
  choice: —
  rationale: Partícula conectiva leve, cuja função é suficientemente expressa pela continuidade narrativa, sem equivalente explícito.
- source_word: ἦσαν
  choice: tinha
  rationale: A construção existencial grega τούτῳ ... ἦσαν é idiomaticamente expressa em português como posse.
- source_word: θυγατέρες
  choice: filhas
  rationale: Equivalente familiar direto e natural.
- source_word: τέσσαρες
  choice: quatro
  rationale: Numeral cardinal que determina 'filhas'.
- source_word: παρθένοι
  choice: virgens
  rationale: Preserva de modo direto o sentido lexical de mulheres que não haviam tido relações sexuais, sem reduzir o termo apenas ao estado civil.
- source_word: προφητεύουσαι
  choice: que profetizavam
  rationale: O particípio presente feminino plural caracteriza a atividade das filhas; o imperfeito português comunica adequadamente uma atividade habitual ou característica no quadro narrativo passado.
theological_decisions:
- issue: Sentido de παρθένοι no relato de mulheres que profetizavam
  choice: virgens
  alternative: solteiras
  rationale: O grego declara a condição de virgens e a atividade profética sem explicar relação teológica entre ambas. 'Virgens' preserva a afirmação lexical mais específica; 'solteiras' indicaria apenas estado civil e poderia omitir parte do sentido.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para leitores brasileiros e compreensão internacional. A ordem simples conserva o foco narrativo sem acrescentar explicações doutrinárias.
