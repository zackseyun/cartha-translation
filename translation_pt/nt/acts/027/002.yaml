base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: pt
  text: Então embarcamos num navio de Adramítio, que estava prestes a navegar para localidades ao longo da Ásia[a][b], e fizemo-nos ao mar. Aristarco, um macedônio de Tessalônica, estava conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, situada no oeste da Ásia Menor, e não o continente moderno.
    reason: cultural_note
  - marker: b
    text: 'Ou: “para os portos ao longo da costa da Ásia”. O termo grego diz literalmente “lugares”, mas o contexto de navegação pode indicar portos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες δὲ
  choice: Então embarcamos
  rationale: O particípio aoristo indica a ação anterior à partida, enquanto δέ faz a narrativa avançar sem contraste forte. A formulação é natural e preserva a sequência.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: num navio de Adramítio
  rationale: O adjetivo identifica o navio por sua origem ou porto de procedência. A locução com o topônimo é mais clara em português corrente do que um gentílico raro.
- source_word: μέλλοντι πλεῖν
  choice: que estava prestes a navegar
  rationale: μέλλω com infinitivo expressa ação iminente ou planejada; a tradução conserva essa nuance sem afirmar mais do que o texto.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: para localidades ao longo da costa da Ásia
  rationale: κατά com acusativo tem aqui sentido geográfico ou distributivo. O contexto marítimo favorece localidades costeiras, embora τόπους não signifique especificamente 'portos'; a nota registra essa alternativa.
- source_word: Ἀσίαν
  choice: Ásia
  rationale: Mantém o nome histórico usado no texto, com nota explicando que se trata da província romana, e não do continente moderno.
- source_word: ἀνήχθημεν
  choice: fizemo-nos ao mar
  rationale: O verbo é uma expressão náutica convencional para sair do porto. Esta formulação portuguesa comunica precisamente o início da viagem marítima.
- source_word: ὄντος σὺν ἡμῖν Ἀριστάρχου
  choice: Aristarco ... estava conosco
  rationale: A oração em genitivo absoluto acrescenta uma circunstância acompanhante. Transformá-la em oração independente produz português natural sem alterar a relação com a ação principal.
- source_word: Μακεδόνος Θεσσαλονικέως
  choice: um macedônio de Tessalônica
  rationale: Preserva tanto a identificação regional quanto a cidade de origem, evitando o acúmulo pouco natural de dois gentílicos.
