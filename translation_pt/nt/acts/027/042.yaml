  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: pt
  text: Mas os soldados decidiram matar os prisioneiros, para que nenhum deles escapasse nadando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο
  choice: Mas os soldados decidiram
  rationale: Expressa em português natural a ideia de que surgiu ou foi adotado um plano entre os soldados; δέ marca a contraposição com o contexto anterior.
- source_word: τοὺς δεσμώτας
  choice: os prisioneiros
  rationale: Equivalente corrente e preciso para pessoas mantidas sob custódia.
- source_word: ἀποκτείνωσιν
  choice: matar
  rationale: Reproduz diretamente a intenção letal do verbo grego.
- source_word: μή τις ἐκκολυμβήσας διαφύγῃ
  choice: para que nenhum deles escapasse nadando
  rationale: Preserva a finalidade preventiva expressa por μή e integra o particípio ἐκκολυμβήσας de modo idiomático, sem redundância artificial em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A conjunção inicial “Mas” conserva o valor contrastivo de δέ; “decidiram” evita a construção menos natural “o plano dos soldados foi”.
