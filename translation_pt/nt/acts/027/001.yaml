  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: a decisão impessoal oficial (ἐκρίθη), o conteúdo de que o grupo narrador partiria por mar para a Itália, a transferência de custódia de Paulo e de outros prisioneiros, e a apresentação de Júlio como centurião da σπεῖρα Σεβαστή. A flexão «navegaríamos» preserva adequadamente o «nós» narrativo implícito em ἡμᾶς.'
