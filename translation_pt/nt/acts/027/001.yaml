id: ACT.27.1
reference: Acts 27:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: pt
  text: Quando ficou decidido que navegaríamos para a Itália, entregaram Paulo e alguns outros presos a um centurião chamado Júlio, da Coorte Augusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da Coorte Imperial”; possivelmente, “da coorte de Sebaste”. O grego reflete um título associado a Augusto ou ao imperador, mas não se sabe ao certo qual era essa unidade militar.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: ficou decidido
  rationale: O aoristo passivo é usado impessoalmente para uma decisão de caráter oficial; a formulação mantém a voz passiva e soa natural em português.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: que navegaríamos
  rationale: O infinitivo articular expressa o conteúdo da decisão. “Navegar” preserva o caráter marítimo de ἀποπλεῖν, e a primeira pessoa do plural mantém a participação do narrador.
- source_word: παρεδίδουν
  choice: entregaram
  rationale: Indica a transferência formal de custódia; o pretérito perfeito é a forma narrativa natural em português neste contexto.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Paulo e alguns outros presos
  rationale: Reproduz com clareza a associação expressa por τε...καί; “presos” é corrente e adequado para pessoas mantidas sob custódia.
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: a um centurião chamado Júlio
  rationale: O dativo identifica quem recebeu os presos, e a construção introduz naturalmente o oficial e seu nome.
- source_word: σπείρης Σεβαστῆς
  choice: da Coorte Augusta
  rationale: É uma tradução direta do título militar grego, associado a Augusto ou ao imperador, sem determinar além do texto qual unidade histórica específica era essa.
theological_decisions:
- issue: Identificação histórica de σπείρης Σεβαστῆς
  choice: da Coorte Augusta
  alternative: da Coorte Imperial; da coorte de Sebaste
  rationale: A expressão é historicamente incerta, embora não seja uma questão doutrinária. O texto adota a tradução formal mais direta e registra em nota as possibilidades de sentido ou identificação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o “nós” narrativo de forma implícita na flexão verbal e evita acrescentar um marcador temporal que não esteja expresso no grego.
