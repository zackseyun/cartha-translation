  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: pt
  text: Durante muitos dias, navegamos devagar e, com dificuldade, chegamos diante de Cnido. Como o vento não nos permitia prosseguir[a], navegamos ao abrigo de Creta[b], ao largo de Salmona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não nos permitia aproximar-nos”. A expressão grega indica que o vento impediu o avanço ou a aproximação pretendida.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “navegamos por baixo de Creta”, isto é, pelo lado da ilha protegido do vento, a sotavento.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Durante muitos dias
  rationale: A expressão indica duração ao longo de um período considerável; esta formulação é natural em português e comunica a demora.
- source_word: βραδυπλοοῦντες
  choice: navegamos devagar
  rationale: Preserva a imagem náutica e distingue o avanço lento da dificuldade expressa em seguida por μόλις.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: com dificuldade, chegamos diante de Cnido
  rationale: μόλις indica dificuldade, enquanto κατά, neste contexto náutico, situa o navio diante ou à altura de Cnido.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Como o vento não nos permitia prosseguir
  rationale: O genitivo absoluto apresenta a causa da mudança de rota; 'prosseguir' expressa naturalmente o movimento impedido sem especificar além do contexto.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: navegamos ao abrigo de Creta
  rationale: O verbo náutico indica navegar pelo lado protegido da ilha, a sotavento; a formulação é clara para leitores não especializados.
- source_word: κατὰ Σαλμώνην
  choice: diante de Salmona
  rationale: κατά com um ponto costeiro indica posição diante ou à altura desse marco geográfico.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Cnido / Creta / Salmona
  rationale: Empregam-se as formas portuguesas tradicionais e reconhecíveis dos topônimos.
