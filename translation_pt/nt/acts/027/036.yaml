lexical_decisions:
- source_word: εὔθυμοι
  choice: animados
  rationale: No contexto, indica que recuperaram o ânimo e ficaram em melhor disposição. “Animados” é natural em português e evita a leveza excessiva que “alegres” poderia sugerir.
- source_word: δὲ
  choice: Então
  rationale: Aqui a partícula dá prosseguimento à narrativa, sem marcar contraste forte.
- source_word: γενόμενοι
  choice: ficaram
  rationale: Com εὔθυμοι, o particípio expressa a entrada em um novo estado; “ficaram animados” reproduz isso de modo idiomático.
- source_word: πάντες
  choice: todos
  rationale: Mantém a ênfase de que o grupo inteiro a bordo reagiu dessa maneira.
- source_word: καὶ αὐτοὶ
  choice: também eles mesmos
  rationale: 'Preserva tanto o sentido aditivo quanto a ênfase do pronome: os demais seguiram o exemplo de Paulo.'
- source_word: προσελάβοντο
  choice: comeram
  rationale: Com τροφῆς, o verbo se refere a tomar alimento. “Comeram” comunica naturalmente o sentido prático em português.
- source_word: τροφῆς
  choice: alimento
  rationale: O substantivo designa comida ou alimento; seu sentido está incorporado naturalmente no verbo “comeram” e é explicitado na nota literal.
