  text: Então todos se animaram, e eles também comeram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “também eles mesmos tomaram alimento”, enfatizando que os outros seguiram o exemplo de Paulo.
