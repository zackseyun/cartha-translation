  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: pt
  text: Então os soldados cortaram as cordas do bote e o deixaram cair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ir à deriva”. O verbo grego também pode ter esse sentido no contexto marítimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural e conciso a sequência temporal da narrativa.
- source_word: ἀπέκοψαν
  choice: cortaram
  rationale: Expressa o ato de seccionar as cordas; em português, o resultado de soltura fica claro pelo contexto.
- source_word: οἱ στρατιῶται
  choice: os soldados
  rationale: Equivalente direto, corrente e preciso.
- source_word: τὰ σχοινία
  choice: as cordas
  rationale: Termo claro para a cordoaria que prendia a embarcação menor.
- source_word: τῆς σκάφης
  choice: do bote
  rationale: Designa naturalmente em português a pequena embarcação auxiliar ligada ao navio, distinguindo-a do navio principal.
- source_word: εἴασαν αὐτὴν
  choice: o deixaram
  rationale: Preserva a construção com ἐάω e retoma 'bote' com o pronome masculino exigido em português.
- source_word: ἐκπεσεῖν
  choice: cair no mar
  rationale: Mantém a imagem básica de 'cair para fora', explicitando de forma natural o destino implícito no contexto marítimo; a possibilidade contextual de afastar-se à deriva é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bote” é mais corrente do que “esquife” para a embarcação auxiliar. A formulação evita o pouco natural “deixaram-no cair para fora” e registra em nota a ambiguidade contextual de ἐκπεσεῖν.
