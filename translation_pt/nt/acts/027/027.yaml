  terminology: “Mar de Ádria” e a nota geográfica conservam adequadamente o referente antigo, sem o restringir ao Adriático moderno. “Marinheiros” é apropriado. A alteração para “suspeitar” mantém a nuance lexical de ὑπονοέω.
