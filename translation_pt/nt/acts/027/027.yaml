revisions:
- from: Quando chegou a décima quarta noite, enquanto éramos levados à deriva pelo mar de Ádria[a], por volta da meia-noite os marinheiros começaram a perceber que alguma terra se aproximava deles.[b]
  to: Quando chegou a décima quarta noite, enquanto éramos arrastados pelo mar de Ádria[a], por volta da meia-noite os marinheiros começaram a suspeitar que alguma terra se aproximava deles.[b]
  rationale: A revisão substitui uma percepção relativamente certa por uma suspeita, conforme ὑπενόουν, e torna mais explícito o caráter de deslocamento involuntário de διαφερομένων. Mantêm-se a ordem narrativa, a indefinição de τινά χώραν, a perspectiva grega de a terra aproximar-se dos marinheiros e as âncoras das notas.
