  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: pt
  text: Quando chegou a décima quarta noite, enquanto éramos arrastados pelo mar de Ádria[a], por volta da meia-noite os marinheiros começaram a suspeitar que alguma terra se aproximava deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O antigo nome “Ádria” podia designar uma área marítima mais ampla no Mediterrâneo central, e não apenas o atual mar Adriático.
    reason: cultural_note
  - marker: b
    text: Literalmente, “os marinheiros suspeitavam que alguma terra se aproximava deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: chegou a décima quarta noite
  rationale: A expressão temporal indica que se alcançou a décima quarta noite; a formulação é natural em português e preserva a sequência narrativa.
- source_word: διαφερομένων ἡμῶν
  choice: enquanto éramos levados à deriva
  rationale: O particípio passivo descreve movimento contínuo e involuntário. “Levados à deriva” comunica que o navio era carregado pelas forças do mar e do vento, sem sugerir controle dos viajantes.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: pelo mar de Ádria
  rationale: “Ádria” preserva o nome geográfico antigo e evita identificá-lo de modo excessivamente estreito com o atual mar Adriático; a preposição “pelo” se ajusta ao movimento expresso no contexto.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: por volta da meia-noite
  rationale: Preserva tanto a referência ao meio da noite quanto o caráter aproximativo da expressão grega.
- source_word: ὑπενόουν
  choice: começaram a perceber
  rationale: O imperfeito admite nuance ingressiva, e o verbo indica uma conclusão ainda tentativa baseada em indícios. “Perceber” é idiomático no contexto náutico, sem tornar a constatação absolutamente certa.
- source_word: οἱ ναῦται
  choice: os marinheiros
  rationale: Equivalente moderno, claro e corrente para os profissionais que conduziam o navio.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: que alguma terra se aproximava deles
  rationale: Mantém a perspectiva peculiar da construção grega, na qual uma terra não identificada parece aproximar-se dos marinheiros, em vez de reformular a frase como se eles fossem o sujeito da aproximação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a perspectiva figurada do grego na aproximação da terra e esclarece-se em nota a extensão antiga do nome Ádria.
