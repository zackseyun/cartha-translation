lexical_decisions:
- source_word: σφοδρῶς
  choice: com violência
  rationale: Expressa de modo natural a intensidade e a força perigosa da tempestade.
- source_word: χειμαζομένων
  choice: a tempestade nos castigava
  rationale: Conserva a ideia passiva de estarem sofrendo os efeitos severos da tempestade, em português corrente e digno.
- source_word: ἡμῶν
  choice: nos
  rationale: O genitivo absoluto grego é vertido naturalmente por uma oração em que o grupo narrador sofre a ação.
- source_word: τῇ ἑξῆς
  choice: no dia seguinte
  rationale: Equivalente temporal direto e idiomático.
- source_word: ἐκβολὴν
  choice: lançar a carga ao mar
  rationale: O substantivo é uma expressão náutica para o alijamento; 'a carga' explicita o objeto normalmente entendido no contexto.
- source_word: ἐποιοῦντο
  choice: começaram a lançar
  rationale: Reproduz idiomaticamente a locução grega e apresenta o início da ação narrada, sem o literalismo pouco natural de 'faziam um alijamento'.
