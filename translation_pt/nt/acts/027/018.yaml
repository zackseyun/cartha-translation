  verdict: revise
  source_fidelity: 'A oração inicial deve preservar mais claramente o valor passivo de χειμαζομένων: o grupo narrador está sofrendo a ação da tempestade. “Castigava” é compreensível, mas introduz uma nuance de punição e torna a relação ativa menos direta. “Estávamos sendo violentamente sacudidos pela tempestade” transmite de modo mais fiel e idiomático a aflição causada pela tempestade. A expressão náutica ἐκβολὴν ἐποιοῦντο é bem representada por “começaram a lançar a carga ao mar”, conforme o sentido contextual de alijar carga.'
  naturalness: A revisão mantém português moderno e amplamente compreensível, inclusive para leitores brasileiros. “Estávamos sendo ... sacudidos pela tempestade” é natural no registro narrativo e evita a conotação punitiva de “castigava”. O marcador da nota é deslocado para junto da expressão náutica que ela esclarece.
