source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: pt
  text: Agora aconselho vocês a manter a coragem[a], pois não haverá perda de vida alguma entre vocês[b]; somente o navio será perdido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ter bom ânimo” ou “a não perder a coragem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “nenhuma perda de vida”; aqui, ψυχή se refere à vida física, não especificamente à alma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: agora
  rationale: Expressão temporal idiomática que introduz a exortação de Paulo; “agora” é natural e conciso em português.
- source_word: παραινῶ
  choice: aconselho
  rationale: O verbo expressa conselho ou exortação. “Aconselho” preserva o tom pastoral e deliberativo sem enfraquecer a seriedade do apelo.
- source_word: εὐθυμεῖν
  choice: a manter a coragem
  rationale: O infinitivo denota estar animado ou ter coragem. No contexto da tempestade, “manter a coragem” é uma formulação natural e comunica perseverança diante do perigo.
- source_word: ἀποβολὴ
  choice: perda
  rationale: Aqui o substantivo se refere à perda, não ao ato literal de lançar fora; a escolha se ajusta tanto à vida quanto, por contraste, ao navio.
- source_word: ψυχῆς
  choice: vida
  rationale: Neste contexto, ψυχή designa a vida física. “Vida” evita sugerir especificamente a alma imaterial.
- source_word: οὐδεμία ἔσται
  choice: não haverá ... nenhuma
  rationale: Reproduz de modo idiomático a construção existencial futura e conserva a ênfase da negação.
- source_word: ἐξ ὑμῶν
  choice: entre vocês
  rationale: Indica o grupo do qual nenhuma vida será perdida; “entre vocês” é claro e natural.
- source_word: πλὴν τοῦ πλοίου
  choice: mas somente do navio
  rationale: A expressão introduz a única perda prevista. Como “perda” rege naturalmente “de” em português, esta formulação explicita que o navio, ao contrário das pessoas, será perdido.
