  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: pt
  text: Depois de medirem a profundidade[a], encontraram vinte braças; avançando um pouco mais e medindo novamente, encontraram quinze braças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “depois de lançarem a sonda”; o grego se refere à medição da profundidade do mar com uma linha de sondagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: depois de medirem a profundidade
  rationale: O particípio descreve a medição da profundidade do mar com uma linha de sondagem, provavelmente munida de chumbo. A formulação comunica a ação com clareza em português atual.
- source_word: εὗρον
  choice: encontraram
  rationale: Tradução direta do aoristo, aqui usado para informar o resultado obtido nas medições.
- source_word: ὀργυιὰς
  choice: braças
  rationale: A ὀργυιά era uma medida de comprimento próxima da braça marítima, cerca de 1,8 metro; “braças” preserva a unidade náutica do texto.
- source_word: εἴκοσι
  choice: vinte
  rationale: Tradução direta do numeral.
- source_word: βραχὺ διαστήσαντες
  choice: avançando um pouco mais
  rationale: A expressão indica que percorreram uma curta distância antes de repetir a medição; esta formulação torna natural em português o movimento implícito no contexto.
- source_word: πάλιν
  choice: novamente
  rationale: Indica a repetição da medição.
- source_word: δεκαπέντε
  choice: quinze
  rationale: Tradução direta do numeral.
- source_word: καὶ ... δὲ ... καὶ
  choice: Depois de...; avançando... e...
  rationale: Os conectivos estruturam uma sequência narrativa, sem contraste forte; a pontuação e os gerúndios reproduzem essa progressão de modo natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário náutico inteligível. “Braças” mantém a antiga unidade marítima; a nota esclarece o procedimento técnico sem sobrecarregar o versículo.
