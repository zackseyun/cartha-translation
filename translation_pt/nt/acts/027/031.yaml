  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: pt
  text: 'Paulo disse ao centurião e aos soldados: “Se estes homens não permanecerem no navio, vocês não poderão ser salvos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser resgatados”. O grego diz “ser salvos”; aqui, a expressão se refere à sobrevivência física.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurião
  rationale: Termo português consagrado e preciso para a patente militar romana.
- source_word: οὗτοι
  choice: estes homens
  rationale: O demonstrativo refere-se aos marinheiros que tentavam abandonar o navio; acrescentar “homens” explicita naturalmente o referente implícito.
- source_word: μείνωσιν
  choice: permanecerem
  rationale: Reproduz o sentido de continuar no local, com registro digno e corrente.
- source_word: πλοίῳ
  choice: navio
  rationale: No contexto da viagem marítima, designa uma embarcação de grande porte, não um barco pequeno.
- source_word: σωθῆναι
  choice: ser salvos
  rationale: Preserva o verbo grego amplo “salvar”, enquanto o contexto indica sobrevivência física.
- source_word: οὐ δύνασθε
  choice: não poderão
  rationale: Expressa de modo natural em português a incapacidade futura dentro da condição apresentada.
theological_decisions:
- issue: Se σωθῆναι deve ser traduzido com linguagem explicitamente física ou pelo termo mais amplo “ser salvos”.
  choice: ser salvos
  alternative: ser resgatados; sobreviver
  rationale: O contexto trata claramente da sobrevivência ao naufrágio, mas “ser salvos” mantém a amplitude lexical do grego sem introduzir uma afirmação sobre salvação eterna; a nota esclarece o sentido imediato.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural explícito ὑμεῖς; a construção condicional preserva a força direta da advertência.
