  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: pt
  text: Mas, passando ao abrigo de uma pequena ilha chamada Cauda[a], mal conseguimos pôr sob controle o bote do navio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «navegando a sotavento de uma pequena ilha chamada Cauda». O grego emprega linguagem náutica para indicar o deslocamento pelo lado da ilha protegido do vento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: uma pequena ilha
  rationale: Preserva o sentido diminutivo de νησίον em português natural, sem recorrer ao menos comum «ilhota».
- source_word: δέ
  choice: Mas
  rationale: Marca a leve transição ou contraste narrativo entre a tempestade e o abrigo temporário proporcionado pela ilha.
- source_word: ὑποδραμόντες
  choice: passando ao abrigo de
  rationale: Expressa de modo claro o uso náutico de navegar pelo lado protegido do vento, sem impor terminologia técnica no texto principal.
- source_word: καλούμενον Καῦδα
  choice: chamada Cauda
  rationale: Reproduz diretamente a identificação da ilha e mantém a forma do topônimo atestada nesta tradição textual.
- source_word: ἰσχύσαμεν μόλις
  choice: mal conseguimos
  rationale: Transmite de forma idiomática tanto a capacidade quanto a grande dificuldade indicadas pela expressão grega.
- source_word: περικρατεῖς γενέσθαι
  choice: pôr sob controle
  rationale: Conserva a ideia literal de conseguir domínio ou controle sobre o bote; «prender» poderia especificar em excesso a ação realizada.
- source_word: τῆς σκάφης
  choice: o bote do navio
  rationale: Identifica claramente a embarcação menor associada ao navio, provavelmente rebocada, sem usar um termo excessivamente técnico.
