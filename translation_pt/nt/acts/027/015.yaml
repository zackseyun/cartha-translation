  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: pt
  text: Mas, quando o navio foi arrastado e não conseguia enfrentar o vento, cedemos e fomos levados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cedemos ao vento e fomos levados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντος
  choice: foi arrastado
  rationale: O particípio aoristo passivo retrata o navio subitamente dominado por uma força externa. “Foi arrastado” comunica com naturalidade a ação violenta do vento sem antecipar todos os detalhes da perda de controle expressos no restante do versículo.
- source_word: πλοίου
  choice: navio
  rationale: “Navio” é o equivalente corrente e adequado ao contexto marítimo da narrativa.
- source_word: μὴ δυναμένου
  choice: não conseguindo
  rationale: Preserva a construção participial e expressa de modo natural a incapacidade do navio de manter-se contra o vento.
- source_word: ἀντοφθαλμεῖν
  choice: enfrentar
  rationale: Neste contexto náutico, o verbo indica voltar a proa contra o vento ou resistir-lhe. “Enfrentar o vento” mantém a imagem do grego sem acrescentar precisão técnica desnecessária.
- source_word: ἀνέμῳ
  choice: o vento
  rationale: Traduz diretamente ἄνεμος; embora o contexto descreva uma tempestade, o substantivo aqui significa simplesmente “vento”.
- source_word: ἐπιδόντες
  choice: cedemos
  rationale: No contexto náutico, o particípio indica que os tripulantes desistiram de resistir à força do vento. “Cedemos” é conciso e preserva essa decisão, enquanto a nota explicita a alternativa contextual.
- source_word: ἐφερόμεθα
  choice: nos deixamos levar
  rationale: O imperfeito passivo descreve movimento contínuo sob força externa. A formulação portuguesa é natural e, em conjunto com “cedemos”, transmite que o navio passou a ser levado pelo vento.
- source_word: δέ
  choice: Mas
  rationale: δέ dá continuidade à narrativa com leve contraste em relação à tentativa anterior de controlar o navio; “Mas” torna essa relação clara e natural em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A linguagem evita jargão náutico excessivo e conserva a progressão do grego: o navio é dominado, torna-se incapaz de enfrentar o vento, os navegantes cedem e passam a ser levados.'
