  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: pt
  text: 'Até o amanhecer, Paulo continuava a insistir que todos comessem algo, dizendo: “Hoje é o décimo quarto dia que vocês continuam esperando[a], sem comer e sem ingerir nada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em ansiosa expectativa”. O particípio grego indica espera ou expectativa; neste contexto de tempestade, pode também sugerir ansiedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Enquanto o dia estava para amanhecer
  rationale: Expressa de modo natural o período que se estende até a iminência do amanhecer, preservando a ideia de que o dia estava prestes a chegar.
- source_word: παρεκάλει
  choice: insistia
  rationale: O imperfeito indica uma ação contínua ou repetida; “insistia” comunica a força da exortação de Paulo sem soar excessivamente formal.
- source_word: ἅπαντας
  choice: com todos
  rationale: Abrange todas as pessoas a bordo e se integra naturalmente à construção portuguesa “insistia com todos”.
- source_word: μεταλαβεῖν τροφῆς
  choice: para que comessem alguma coisa
  rationale: Comunica claramente a ideia de tomar alimento e reflete o sentido partitivo de τροφῆς.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Hoje completa catorze dias
  rationale: Preserva a ênfase no dia presente como o décimo quarto, em formulação corrente e clara em português.
- source_word: προσδοκῶντες
  choice: esperando
  rationale: Mantém o sentido básico de expectativa sem impor no texto principal a ansiedade que o contexto pode sugerir.
- source_word: ἄσιτοι διατελεῖτε
  choice: estão esperando, sem comer
  rationale: A construção transmite a permanência nesse estado ao longo do período; “sem comer” evita a possível conotação religiosa de “jejuando”.
- source_word: μηθὲν προσλαβόμενοι
  choice: sem ingerir nada
  rationale: Preserva a frase participial enfática, embora haja repetição semântica com “sem comer”, como no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a repetição enfática do original entre estar sem comer e não ingerir nada, e a nota mantém aberta a nuance contextual de προσδοκῶντες.
