  terminology: «Euraquilão» é uma adaptação portuguesa estabelecida e apropriada para o nome próprio. «Euroclidão» representa adequadamente a variante textual tradicional. A descrição do vento deve permanecer não técnica e não converter o nome próprio em tradução interpretativa.
