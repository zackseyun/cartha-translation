lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: pouco depois
  rationale: Expressão temporal idiomática que indica um breve intervalo; a formulação é natural e fiel em português atual.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição narrativa com leve contraste, introduzindo a súbita mudança adversa.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: desceu com violência sobre ela
  rationale: Transmite o movimento impetuoso do vento e conserva o pronome feminino do grego, cujo referente contextual mais provável é a ilha, sem substituí-lo explicitamente.
- source_word: ἄνεμος τυφωνικὸς
  choice: um vento com força de tufão
  rationale: Mantém 'vento' como núcleo e expressa de maneira clara a violência giratória ou tempestuosa indicada por τυφωνικός, sem impor uma classificação meteorológica moderna exata.
- source_word: ὁ καλούμενος
  choice: chamado
  rationale: Equivalente direto e natural da fórmula que introduz uma designação ou nome.
- source_word: Εὐρακύλων
  choice: Euraquilão
  rationale: Translitera como nome próprio a forma do texto grego adotado, com adaptação fonológica e ortográfica natural ao português.
