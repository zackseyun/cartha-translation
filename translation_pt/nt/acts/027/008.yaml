  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: pt
  text: E, costeando-a com dificuldade[a], chegamos a certo lugar chamado Bons Portos, perto do qual ficava uma cidade chamada Laseia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passando com dificuldade ao longo de sua costa”. O verbo grego é um termo náutico que indica navegar acompanhando a linha costeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: com dificuldade
  rationale: Expressa que o avanço só foi conseguido com grande dificuldade e preserva a ênfase narrativa nas condições adversas.
- source_word: τε
  choice: E
  rationale: Liga a oração ao relato anterior de modo natural, sem dar peso excessivo à partícula.
- source_word: παραλεγόμενοι
  choice: costeando
  rationale: No contexto náutico, indica navegar acompanhando de perto a linha da costa; “costear” é conciso e preciso em português.
- source_word: αὐτὴν
  choice: -a
  rationale: O pronome retoma Creta no contexto anterior; a forma enclítica feminina preserva essa referência sem explicitação desnecessária.
- source_word: ἤλθομεν
  choice: chegamos
  rationale: Traduz naturalmente o verbo de movimento quando seguido de um destino.
- source_word: εἰς τόπον τινὰ
  choice: a certo lugar
  rationale: Mantém a indefinição de τινά e soa natural no estilo narrativo.
- source_word: καλούμενον
  choice: chamado
  rationale: Forma corrente e fiel para introduzir o nome de um lugar.
- source_word: Καλοὺς Λιμένας
  choice: Bons Portos
  rationale: Traduz o topônimo grego de maneira transparente e segue uma forma tradicional e reconhecível em português.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: perto do qual ficava uma cidade chamada Laseia
  rationale: Conserva a referência relativa ao lugar, a ideia de proximidade e a indefinição do substantivo anartro πόλις.
