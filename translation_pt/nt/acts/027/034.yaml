base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: pt
  text: Por isso, peço com insistência que comam alguma coisa, pois isso é necessário para a sobrevivência de vocês[a]; pois nem um só fio de cabelo da cabeça de qualquer um de vocês se perderá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pois isso é para a salvação de vocês”. A palavra grega pode significar “salvação”, “livramento”, “preservação” ou “sobrevivência”; neste contexto, refere-se à sobrevivência física.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da situação e das palavras anteriores.
- source_word: παρακαλῶ
  choice: peço com insistência
  rationale: Comunica o apelo sério e encorajador de Paulo sem recorrer a uma formulação excessivamente formal.
- source_word: μεταλαβεῖν τροφῆς
  choice: que comam alguma coisa
  rationale: Transmite em português corrente o sentido idiomático de ingerir alimento ou nutrir-se.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: pois isso é necessário para a sobrevivência de vocês
  rationale: No contexto imediato do perigo marítimo, a expressão aponta para a preservação da vida. A formulação torna clara a relação prática entre comer e sobreviver.
- source_word: σωτηρίας
  choice: sobrevivência
  rationale: Representa o sentido contextual de preservação ou livramento físico, enquanto a nota mantém visível a amplitude lexical do termo grego.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: porque nenhum de vocês
  rationale: Preserva a força distributiva da construção grega em português natural.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: sequer um fio de cabelo da cabeça
  rationale: Mantém a imagem idiomática de segurança completa e acrescenta 'sequer' para reproduzir sua ênfase.
- source_word: ἀπολεῖται
  choice: perderá
  rationale: Com 'fio de cabelo' como objeto na formulação portuguesa, 'perderá' é idiomático e expressa que nada lhes faltará ou será perdido.
theological_decisions:
- issue: Sentido de σωτηρία no contexto
  choice: sobrevivência ou preservação física
  alternative: salvação
  rationale: O contexto imediato é a garantia de que os ocupantes do navio sobreviverão ao naufrágio. A nota conserva a alternativa lexical 'salvação' sem sugerir indevidamente que o versículo trata diretamente da salvação espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Peço com insistência' preserva a intensidade de παρακαλῶ; 'comam alguma coisa' evita o formalismo de 'tomem alimento'. A imagem proverbial do fio de cabelo foi mantida.
