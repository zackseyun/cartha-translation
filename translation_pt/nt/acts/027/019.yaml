  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: pt
  text: No terceiro dia, eles lançaram ao mar, com as próprias mãos, o equipamento do navio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles mesmos lançaram fora o equipamento do navio”.'
    reason: Registra a alternativa de traduzir αὐτόχειρες por “eles mesmos”, preservando a ênfase de que realizaram pessoalmente a ação.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: No terceiro dia
  rationale: O dativo com o ordinal funciona como expressão temporal; explicitar “dia” é natural em português e corresponde ao sentido contextual.
- source_word: αὐτόχειρες
  choice: com as próprias mãos
  rationale: Preserva a ênfase do adjetivo no fato de que as pessoas a bordo realizaram pessoalmente a ação, e não apenas por intermédio de outros.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: os equipamentos do navio
  rationale: No contexto náutico, σκευή designa coletivamente o aparelhamento ou equipamento da embarcação. O plural idiomático “os equipamentos” é claro e amplamente compreensível.
- source_word: ἔρριψαν
  choice: lançaram ao mar
  rationale: O verbo significa lançar ou jogar; “ao mar” explicita de modo natural a direção inerente ao contexto da tempestade e da embarcação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário náutico não técnico. A ordem “com as próprias mãos” mantém a ênfase do grego sem tornar a frase artificial.
