  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: pt
  text: Havia muitos dias que nem o sol nem as estrelas apareciam, e uma tempestade nada pequena se abatia sobre nós; a partir de então, toda esperança de sermos salvos[a] foi se perdendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sermos resgatados”. O verbo grego pode significar “salvar” ou “resgatar”; aqui se refere ao livramento físico da tempestade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: apareciam
  rationale: Expressa que os astros não se tornavam visíveis, formulação natural no contexto de navegação, sem restringir o sentido apenas a brilhar.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: havia muitos dias
  rationale: Comunica de modo idiomático em português a duração prolongada indicada pela expressão grega.
- source_word: χειμῶνός
  choice: tempestade
  rationale: No contexto marítimo, designa mau tempo tempestuoso, não a estação do inverno.
- source_word: οὐκ ὀλίγου
  choice: nada pequena
  rationale: Preserva a litotes de Lucas e sua ênfase, mantendo uma expressão compreensível em português moderno.
- source_word: ἐπικειμένου
  choice: se abatia sobre nós
  rationale: Transmite a pressão contínua e ameaçadora da tempestade sobre os viajantes.
- source_word: λοιπὸν
  choice: daí em diante
  rationale: Marca a etapa resultante da situação e a continuidade temporal da perda de esperança.
- source_word: περιῃρεῖτο
  choice: foi desaparecendo
  rationale: O imperfeito passivo descreve um processo em curso; a formulação portuguesa comunica a perda gradual sem sugerir necessariamente um agente explícito.
- source_word: ἐλπὶς πᾶσα
  choice: toda esperança
  rationale: Mantém a totalidade enfática da expressão grega de modo idiomático.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: de sermos salvos
  rationale: Reproduz o conteúdo da esperança e conserva a amplitude lexical de σῴζω, enquanto o contexto indica livramento físico.
theological_decisions:
- issue: Sentido de σῴζεσθαι no contexto narrativo marítimo
  choice: livramento físico da morte no mar, traduzido como “sermos salvos”
  alternative: sermos resgatados
  rationale: O contexto imediato é de tempestade, naufrágio iminente e sobrevivência. “Salvos” preserva a continuidade lexical do verbo sem impor aqui um sentido de salvação espiritual; a nota esclarece a referência física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a progressão da frase grega e a litotes “nada pequena”, ao mesmo tempo que usa construções naturais como “se abatia sobre nós” e “foi desaparecendo”.
