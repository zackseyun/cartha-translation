  rationale: A revisão preserva a litotes “nada pequena”, a duração indicada por ἐπὶ πλείονας ἡμέρας, a pressão continuada da tempestade e o caráter progressivo da perda de esperança. “Foi se perdendo” é mais natural do que uma passiva literal, mas reflete melhor que “foi desaparecendo” a esperança que lhes era retirada.
