  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: pt
  text: Quando um vento do sul começou a soprar suavemente, eles pensaram que já tinham alcançado seu objetivo. Então levantaram âncora[a] e navegaram ao longo de Creta, perto da costa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo levantado”; no contexto náutico, refere-se a levantar a âncora.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “navegaram costeando Creta, mais perto da costa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: começou a soprar suavemente
  rationale: Expressa o sopro leve do vento e, de modo natural em português, o valor ingressivo sugerido pelo contexto.
- source_word: νότου
  choice: um vento sul
  rationale: Identifica um vento vindo do sul; o artigo indefinido soa natural na introdução dessa condição meteorológica.
- source_word: δόξαντες
  choice: eles pensaram
  rationale: Comunica uma avaliação subjetiva dos navegantes sem sugerir certeza objetiva.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: já tinham alcançado seu objetivo
  rationale: O conjunto idiomático indica que julgavam ter conseguido realizar seu propósito ou plano de navegação.
- source_word: ἄραντες
  choice: levantaram âncora
  rationale: O objeto está implícito no grego; no contexto náutico, a expressão significa içar ou levantar a âncora para partir.
- source_word: ἆσσον
  choice: bem de perto
  rationale: Preserva a ideia comparativa de proximidade e, com o verbo de navegação costeira, indica que seguiam próximos da costa.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: foram costeando Creta
  rationale: O verbo tem sentido náutico de navegar ao longo da costa; a construção mantém Creta como objeto, como no grego, em português natural.
