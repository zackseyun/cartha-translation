  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: pt
  text: Ali, o centurião encontrou um navio alexandrino que seguia para a Itália e nos fez embarcar nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Ali
  rationale: O composto pode significar “e ali”; em português, “Ali” mantém a referência ao lugar e permite que a sequência narrativa soe natural sem explicitar o conectivo.
- source_word: εὑρὼν
  choice: encontrou
  rationale: Embora seja um particípio aoristo, a forma verbal finita comunica naturalmente em português a ação anterior à de fazer embarcar.
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: É o termo tradicional, preciso e amplamente compreendido para essa patente militar romana.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: um navio alexandrino
  rationale: Preserva de modo conciso o adjetivo geográfico, que pode indicar origem ou vínculo com Alexandria.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: que seguia para a Itália
  rationale: Expressa o percurso ou destino do navio de modo natural, sem acrescentar ao particípio grego uma especificação náutica desnecessária.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: nos fez embarcar nele
  rationale: 'Preserva claramente o sentido causativo do verbo: o centurião providenciou ou determinou que eles embarcassem no navio.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das ações do grego foi preservada em uma coordenação natural. Não se acrescentou nota, pois “que seguia para a Itália” comunica adequadamente a construção e não exige uma alternativa para evitar perda relevante.
