base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: pt
  text: Depois de içarem o bote, usaram cabos de reforço[a] para envolver o navio. Temendo serem arrastados para a Sirte[b], baixaram o equipamento[c] e assim eram levados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «usaram reforços para cingir o navio»; o grego fala literalmente de «ajudas» ou «suportes». Provavelmente eram cabos passados ao redor do casco.
    reason: lexical_alternative
  - marker: b
    text: A Sirte era uma região conhecida por seus perigosos baixios e bancos de areia ao largo da costa norte-africana.
    reason: cultural_note
  - marker: c
    text: Ou «baixaram a aparelhagem»; possivelmente se tratava de uma âncora flutuante. O grego diz apenas «o equipamento», e o objeto náutico exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Depois de içarem o bote
  rationale: O pronome relativo retoma a pequena embarcação do versículo anterior. Repetir «o bote» esclarece o referente em português, e «içar» exprime naturalmente a ação náutica de levantá-lo.
- source_word: βοηθείαις
  choice: cabos de reforço
  rationale: O termo significa literalmente «ajudas» ou «suportes»; no contexto marítimo, designa os meios, provavelmente cabos, usados para reforçar o casco.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: para cingir o navio por baixo
  rationale: Preserva a imagem do verbo técnico, que descreve a passagem de cabos ao redor e por baixo do casco para fortalecê-lo.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: de encalhar na Sirte
  rationale: No contexto, o perigo era o navio ser lançado sobre os bancos de areia da região chamada Sirte; «encalhar» comunica esse risco de modo claro.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: baixaram o equipamento
  rationale: σκεῦος é um termo amplo para objeto, aparelhagem ou equipamento. Como não se pode identificar com certeza o dispositivo náutico, a tradução mantém a generalidade do grego.
- source_word: οὕτως ἐφέροντο
  choice: e assim foram levados pelo vento
  rationale: O imperfeito passivo descreve movimento contínuo causado por uma força externa. O contexto identifica o vento como essa força, sem sugerir que a tripulação controlava o rumo.
