translation_notes:
  register: Português moderno, digno e acessível, com terminologia náutica compreensível. A redação explicita o referente de ἣν como «o bote» e preserva em nota a incerteza de σκεῦος, evitando identificar categoricamente o objeto como âncora flutuante.
