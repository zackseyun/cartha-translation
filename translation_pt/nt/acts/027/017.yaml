  naturalness: O português é claro e moderno. «Envolver o navio» é mais natural e menos espacialmente restritivo do que «cingir o navio por baixo». «E assim eram levados» comunica melhor o valor contínuo do imperfeito passivo do que «foram levados pelo vento».
  terminology: «Bote», «cabos de reforço», «Sirte» e «equipamento» são escolhas adequadas. A nota sobre σκεῦος preserva corretamente a incerteza náutica; «aparelhagem» funciona como alternativa.
