base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: pt
  text: Quando amanheceu, não reconheceram a terra, mas avistaram uma enseada com praia e pretendiam, se pudessem, encalhar o navio nela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançar o navio à praia”. O verbo grego indica impelir ou forçar a embarcação para a praia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Quando amanheceu
  rationale: Expressão temporal natural em português, fiel à chegada da luz do dia; δέ funciona como transição narrativa leve e não exige um conectivo explícito.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: eles não reconheceram a terra
  rationale: ἐπιγινώσκω indica reconhecer ou identificar; 'terra' conserva o sentido amplo de γῆ sem especificar indevidamente a costa ou o lugar.
- source_word: κόλπον δέ τινα κατενόουν
  choice: mas avistaram uma enseada
  rationale: κόλπος designa aqui uma baía ou enseada, e κατανοέω indica perceber com atenção. 'Avistaram uma enseada' é natural no contexto náutico; o artigo indefinido transmite adequadamente τινα.
- source_word: ἔχοντα αἰγιαλὸν
  choice: com praia
  rationale: αἰγιαλός refere-se à praia ou margem do mar. 'Praia' é concreto e não acrescenta que fosse arenosa.
- source_word: εἰς ὃν
  choice: nela
  rationale: O pronome retoma a enseada e, em conjunto com o verbo de encalhar, comunica de modo natural o destino indicado por εἰς.
- source_word: ἐβουλεύοντο
  choice: decidiram
  rationale: βουλεύομαι pode expressar deliberar, planejar ou decidir. No contexto, descreve a resolução condicionada pela possibilidade de executar a manobra.
- source_word: εἰ δύναιντο
  choice: se pudessem
  rationale: Preserva de forma concisa a contingência expressa por εἰ com o optativo.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: encalhar nela o navio
  rationale: No contexto náutico, ἐξωθέω descreve impelir o navio para a praia. 'Encalhar o navio' comunica a ação intencional com naturalidade, embora 'lançar o navio à praia' preserve mais explicitamente a ideia de fazê-lo avançar sobre a margem.
