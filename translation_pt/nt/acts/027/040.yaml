  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: pt
  text: E, depois de soltarem as âncoras e deixá-las no mar, ao mesmo tempo afrouxaram as amarras dos lemes[a], içaram ao vento a vela de proa[b] e seguiram em direção à praia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as faixas” ou “os dispositivos de fixação dos lemes”; o termo grego é uma palavra náutica rara para aquilo que prendia o aparelho de governo.
    reason: lexical_alternative
  - marker: b
    text: Ou “vela superior” ou “vela situada na proa”; a referência exata desse termo náutico grego é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: soltaram
  rationale: O particípio aoristo descreve a liberação das âncoras antes do avanço do navio. “Soltaram” comunica naturalmente a ação náutica sem afirmar, além do grego, que as cordas foram cortadas.
- source_word: ἀγκύρας
  choice: as âncoras
  rationale: Equivalente náutico direto do substantivo acusativo plural.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: as deixaram no mar
  rationale: ἐάω indica deixar ou abandonar; o pronome retoma naturalmente as âncoras, que não foram recolhidas.
- source_word: ἅμα
  choice: ao mesmo tempo
  rationale: Expressa claramente que as ações seguintes ocorreram simultaneamente.
- source_word: ἀνέντες
  choice: afrouxaram
  rationale: No contexto, indica liberar aquilo que mantinha preso o aparelho de governo. “Afrouxaram” é corrente e se combina naturalmente com “amarras”.
- source_word: ζευκτηρίας τῶν πηδαλίων
  choice: as amarras dos lemes
  rationale: ζευκτηρίας é um termo náutico raro para cordas, faixas ou dispositivos que prendiam o aparelho de governo; πηδάλια designa aqui os lemes ou remos de direção. A nota preserva a incerteza técnica.
- source_word: ἐπάραντες
  choice: içaram
  rationale: Verbo náutico natural em português para levantar e armar uma vela.
- source_word: ἀρτέμωνα
  choice: a vela de proa
  rationale: Termo náutico de identificação exata incerta. “Vela de proa” transmite sua provável localização e função sem recorrer a vocabulário excessivamente técnico; alternativas são registradas em nota.
- source_word: τῇ πνεούσῃ
  choice: ao vento
  rationale: Tradução concisa do particípio substantivado implícito, indicando que a vela foi exposta ao vento que soprava.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: seguiram em direção à praia
  rationale: κατέχω tem aqui sentido náutico de manter ou dirigir o curso; αἰγιαλός se refere especificamente à praia ou faixa litorânea.
