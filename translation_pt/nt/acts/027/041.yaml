base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: pt
  text: Mas, ao darem num lugar onde duas águas se encontravam[a], encalharam o navio. A proa ficou presa e permaneceu imóvel, enquanto a popa era desfeita pela força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num lugar entre duas águas”. A expressão grega é rara e pode indicar um canal, um banco de areia ou o ponto de encontro de duas massas ou correntes de água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: ao darem num
  rationale: Expressa o encontro súbito e adverso com o local sem especificar além do grego a manobra náutica envolvida.
- source_word: τόπον διθάλασσον
  choice: um lugar onde duas águas se encontravam
  rationale: Preserva a referência rara e ambígua a duas massas ou correntes de água, evitando identificar de modo indevido o acidente geográfico como banco de areia ou canal.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: encalharam o navio
  rationale: Equivalente náutico corrente e preciso para fazer o navio dar em terra ou ficar preso no fundo.
- source_word: πρῷρα
  choice: a proa
  rationale: Termo náutico português comum para a parte dianteira do navio.
- source_word: ἐρείσασα
  choice: ficou presa
  rationale: Comunica que a proa se firmou ou se cravou após o encalhe, com linguagem natural.
- source_word: ἔμεινεν ἀσάλευτος
  choice: permaneceu imóvel
  rationale: Reproduz diretamente a ideia de que a proa continuou fixa, sem se mover.
- source_word: πρύμνα
  choice: a popa
  rationale: Termo náutico português comum para a parte traseira do navio.
- source_word: ἐλύετο
  choice: começou a se desfazer
  rationale: O imperfeito descreve um processo em curso de desagregação; a formulação portuguesa transmite essa progressão com naturalidade.
- source_word: ὑπὸ τῆς βίας
  choice: com a força das águas
  rationale: βία denota força ou violência. O contexto marítimo permite explicitar as águas como a força atuante, sem restringi-la necessariamente apenas às ondas.
