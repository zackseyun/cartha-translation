revisions:
- from: Mas, ao darem num lugar onde duas águas se encontravam[a], encalharam o navio. A proa ficou presa e permaneceu imóvel, enquanto a popa começou a se desfazer com a força das águas.
  to: Mas, ao darem num lugar onde duas águas se encontravam[a], encalharam o navio. A proa ficou presa e permaneceu imóvel, enquanto a popa era desfeita pela força.
  rationale: A revisão substitui a formulação incoativa por um imperfeito passivo que corresponde ao processo contínuo indicado por ἐλύετο e remove a explicitação interpretativa «das águas», preservando a concisão e a ambiguidade do grego. A nota é mantida, pois explica de modo equilibrado a expressão rara διθάλασσον.
  reviewer_model: gpt-5.6-terra
