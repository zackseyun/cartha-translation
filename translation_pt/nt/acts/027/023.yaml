source:
  edition: SBLGNT
  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: pt
  text: Pois nesta mesma noite um anjo do Deus a quem pertenço[a] e a quem também adoro[b] esteve ao meu lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «de quem sou».
    reason: lexical_alternative
  - marker: b
    text: Ou «a quem também sirvo»; o verbo grego pode indicar serviço sagrado ou adoração prestada a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: esteve ao meu lado
  rationale: Preserva o sentido espacial de presença junto a Paulo sem recorrer à formulação mais interpretativa «apareceu-me».
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação para a confiança expressa por Paulo no contexto.
- source_word: ταύτῃ τῇ νυκτί
  choice: esta mesma noite
  rationale: Comunica naturalmente a proximidade temporal e a ênfase do demonstrativo.
- source_word: τοῦ θεοῦ
  choice: do Deus
  rationale: Mantém o genitivo ligado a «anjo» e permite que as orações relativas seguintes caracterizem Deus.
- source_word: οὗ εἰμι
  choice: a quem pertenço
  rationale: Expressa em português atual o sentido literal de «de quem sou», preservando a ideia de pertencimento.
- source_word: ᾧ καὶ λατρεύω
  choice: e a quem também adoro
  rationale: λατρεύω, quando dirigido a Deus, denota serviço religioso ou culto; «adoro» comunica claramente essa dimensão, enquanto «também» preserva καί.
- source_word: ἄγγελος
  choice: um anjo
  rationale: O contexto de revelação e encorajamento divino indica um mensageiro celestial, não meramente humano.
theological_decisions:
- issue: Tradução de οὗ εἰμι
  choice: a quem pertenço
  alternative: de quem sou
  rationale: A escolha comunica posse e vínculo com Deus em linguagem natural, sem ampliar o enunciado além do que o grego afirma.
- issue: Tradução de λατρεύω
  choice: adoro
  alternative: sirvo
  rationale: O verbo pode abranger serviço religioso prestado a Deus; «adoro» explicita o caráter cultual, e a alternativa «sirvo» é preservada em nota para manter a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural, preservando a relação entre «um anjo», «do Deus» e as duas orações relativas.
