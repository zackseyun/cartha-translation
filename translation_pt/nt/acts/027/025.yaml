  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: pt
  text: 'Por isso, tenham coragem, homens, pois acredito em Deus: acontecerá exatamente como me foi dito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da garantia e da exortação anteriores.
- source_word: εὐθυμεῖτε
  choice: tenham coragem
  rationale: Imperativo que conclama os ouvintes a manter a confiança em meio ao perigo; é corrente e digno em português moderno.
- source_word: ἄνδρες
  choice: homens
  rationale: Mantém o vocativo masculino explícito, adequado aos homens presentes no navio.
- source_word: πιστεύω τῷ θεῷ
  choice: eu creio em Deus
  rationale: Em português, esta é uma formulação natural para a confiança dirigida a Deus, embora possa também ser entendida como crer no que Deus disse; a nota preserva essa nuance.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo em que Paulo crê.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: tudo acontecerá exatamente como
  rationale: Reproduz com clareza a correspondência entre o acontecimento futuro e a mensagem recebida, evitando uma construção portuguesa rígida.
- source_word: λελάληταί μοι
  choice: me foi dito
  rationale: Preserva a voz passiva e o sentido de uma mensagem anteriormente comunicada a Paulo, ainda válida no presente.
theological_decisions:
- issue: Sentido de πιστεύω τῷ θεῷ
  choice: eu creio em Deus
  alternative: eu acredito em Deus / eu confio em Deus / eu creio no que Deus disse
  rationale: A construção com dativo pode salientar confiança pessoal em Deus ou aceitação da palavra divina. O texto principal usa português natural, e a nota registra a ambiguidade sem restringi-la a uma leitura apenas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tenham coragem” evita arcaísmo; “exatamente como” comunica a força comparativa sem literalismo rígido.
