source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: pt
  text: Depois de dizer isso, Paulo tomou pão, deu graças a Deus diante de todos e, depois de parti-lo, começou a comer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Depois de dizer isso
  rationale: O particípio aoristo apresenta uma ação anterior à ação principal; “depois de dizer” expressa naturalmente essa sequência. O δέ funciona aqui como leve transição narrativa e não exige uma conjunção explícita em português.
- source_word: λαβὼν ἄρτον
  choice: Paulo tomou pão
  rationale: “Tomou pão” preserva a formulação simples e não especifica indevidamente se era um pão inteiro ou apenas uma porção. O nome “Paulo” é explicitado pelo contexto para dar clareza ao sujeito em português.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: deu graças a Deus
  rationale: Expressão corrente e digna que representa diretamente o sentido de εὐχαριστέω e mantém Deus como destinatário explícito da gratidão.
- source_word: ἐνώπιον πάντων
  choice: diante de todos
  rationale: Comunica de modo natural que a ação foi pública, realizada na presença de todos.
- source_word: κλάσας
  choice: depois de parti-lo
  rationale: O particípio aoristo indica que Paulo partiu o pão antes de começar a comer. O pronome “-lo” retoma claramente “pão”.
- source_word: ἤρξατο ἐσθίειν
  choice: começou a comer
  rationale: Mantém o aspecto ingressivo da construção ἄρχομαι com infinitivo.
theological_decisions:
- issue: Possível ressonância eucarística na sequência de tomar o pão, dar graças, parti-lo e comer
  choice: Descrever as ações em linguagem narrativa comum, sem identificá-las explicitamente como celebração da Ceia do Senhor.
  alternative: Empregar linguagem litúrgica tradicional que acentue uma interpretação eucarística.
  rationale: A sequência pode recordar relatos da Ceia, mas o contexto imediato descreve uma refeição pública no navio. A tradução preserva a possível ressonância sem transformar essa associação em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem dos acontecimentos foi preservada sem rigidez excessiva. Não se manteve a nota inglesa associada a “bread”, pois o conteúdo “Or ‘before everyone’” corresponde lexicalmente a ἐνώπιον πάντων, já traduzido diretamente como “diante de todos”, e não constitui variante necessária no texto português.
