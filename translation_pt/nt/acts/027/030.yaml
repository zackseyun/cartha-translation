  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: pt
  text: Enquanto os marinheiros tentavam fugir do navio e haviam baixado o bote ao mar, sob o pretexto de que iam lançar âncoras da proa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναυτῶν
  choice: marinheiros
  rationale: Termo corrente e claro para os integrantes da tripulação encarregados da navegação.
- source_word: ζητούντων φυγεῖν
  choice: tentavam fugir
  rationale: A construção com ζητέω e infinitivo expressa tentativa ou intenção; a formulação é natural e preserva a ideia de abandonar o navio.
- source_word: ἐκ τοῦ πλοίου
  choice: do navio
  rationale: Equivalente preposicional natural em português neste contexto.
- source_word: χαλασάντων τὴν σκάφην
  choice: baixavam o bote
  rationale: σκάφη designa a pequena embarcação auxiliar do navio; «bote» é claro e não sugere anacronicamente um barco salva-vidas moderno. O aspecto é apresentado como ação circunstancial em curso, de acordo com a sequência narrativa.
- source_word: εἰς τὴν θάλασσαν
  choice: ao mar
  rationale: Expressão portuguesa idiomática para baixar uma embarcação até a água do mar.
- source_word: προφάσει
  choice: sob o pretexto
  rationale: Comunica uma justificativa aparente que ocultava a verdadeira intenção dos marinheiros.
- source_word: ὡς
  choice: de que
  rationale: Introduz de modo natural em português a intenção alegada que constituía o pretexto.
- source_word: ἐκ πρῴρης
  choice: pela proa
  rationale: «Proa» é o termo náutico corrente em português para a parte dianteira da embarcação; a preposição indica o ponto do navio a partir do qual as âncoras seriam lançadas.
- source_word: ἀγκύρας
  choice: âncoras
  rationale: Tradução direta, mantendo o plural grego.
- source_word: μελλόντων ἐκτείνειν
  choice: iam lançar
  rationale: μέλλω indica intenção ou ação iminente, e ἐκτείνω, neste contexto náutico, refere-se a estender ou lançar as âncoras; «iam lançar» é natural e preciso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a oração circunstancial e a vírgula final do versículo, pois a frase continua no versículo seguinte. Não foram incluídas notas, já que «bote» e «proa» são escolhas claras e não exigem alternativas para preservar ambiguidade relevante.
