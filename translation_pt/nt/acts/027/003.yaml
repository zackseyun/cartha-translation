  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: pt
  text: No dia seguinte, aportamos em Sidom. Júlio tratou Paulo com bondade[a] e permitiu que ele fosse até seus amigos para receber cuidados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tratou Paulo com humanidade”, destacando a conduta benevolente de Júlio para com um prisioneiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “receber assistência” ou “receber atenção”; a expressão grega pode se referir de modo amplo à ajuda necessária prestada por amigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: No dia seguinte
  rationale: O dativo temporal, no contexto da sequência narrativa, indica o dia seguinte; esta formulação é natural e clara em português.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: aportamos em Sidom
  rationale: κατάγω tem aqui sentido náutico, de levar a embarcação ao porto. “Aportamos” preserva esse valor com concisão.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: tratou Paulo com bondade
  rationale: A construção descreve a maneira benevolente e humana como Júlio procedeu com Paulo. A formulação escolhida é corrente e digna.
- source_word: ἐπέτρεψεν
  choice: permitiu
  rationale: Expressa diretamente a concessão de autorização por Júlio, responsável pelo prisioneiro.
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: que ele fosse até seus amigos
  rationale: O particípio aoristo dependente de ἐπέτρεψεν é expresso naturalmente em português por uma oração completiva; o artigo com φίλους é entendido relacionalmente como “seus amigos”.
- source_word: ἐπιμελείας τυχεῖν
  choice: receber cuidados
  rationale: A expressão pode abranger atenção, assistência e provisão das necessidades de Paulo; “receber cuidados” mantém essa amplitude.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Aportamos” conserva o cenário marítimo; “Sidom” segue a forma portuguesa tradicional do topônimo. As notas preservam a amplitude semântica das expressões gregas.
