  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: pt
  text: E, depois de zarparmos dali, navegamos pelo lado abrigado[a] de Chipre, porque os ventos eram contrários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “navegamos a sotavento de Chipre”. O verbo grego é um termo náutico para navegar pelo lado protegido de uma ilha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: E, partindo dali
  rationale: Expressa naturalmente a combinação de καί com ἐκεῖθεν e, junto ao particípio seguinte, mantém a progressão narrativa.
- source_word: ἀναχθέντες
  choice: partindo
  rationale: No contexto náutico, ἀνάγω significa fazer-se ao mar ou zarpar. “Partindo” é claro e natural, sem acrescentar a ideia mais específica de levantar âncora.
- source_word: ὑπεπλεύσαμεν
  choice: navegamos pelo lado abrigado de
  rationale: O verbo náutico ὑποπλέω indica navegar pelo lado de uma ilha protegido dos ventos. A formulação comunica o sentido a leitores comuns sem recorrer a jargão marítimo.
- source_word: τὴν Κύπρον
  choice: Chipre
  rationale: Forma portuguesa consagrada do nome da ilha.
- source_word: διὰ τὸ ... εἶναι
  choice: porque
  rationale: διά com infinitivo articular exprime causa; “porque” é a equivalência mais direta e natural.
- source_word: τοὺς ἀνέμους
  choice: os ventos
  rationale: Tradução direta e corrente do plural de ἄνεμος.
- source_word: ἐναντίους
  choice: eram contrários
  rationale: Preserva a ideia de ventos adversos sem inserir explicitamente um objeto ausente no grego; o contexto torna claro que dificultavam a navegação.
