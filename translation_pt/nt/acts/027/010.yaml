source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: pt
  text: 'dizendo-lhes: “Homens, percebo que esta viagem será marcada por desastre e grande prejuízo[a], não somente para a carga e o navio, mas também para as nossas vidas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acompanhada de danos e muita perda”. A expressão grega pode destacar a violência das dificuldades ou os danos que acompanharão a viagem.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as nossas almas”; neste contexto, o sentido é “as nossas vidas”, isto é, o risco de morte no mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: dizendo-lhes
  rationale: Mantém a introdução participial e o fluxo narrativo do grego de maneira concisa e natural.
- source_word: Ἄνδρες
  choice: Senhores
  rationale: Embora o termo designe literalmente homens adultos, o vocativo funciona aqui como uma forma direta de se dirigir aos homens reunidos; “Senhores” preserva esse valor de tratamento com naturalidade em português.
- source_word: θεωρῶ
  choice: percebo
  rationale: Expressa observação e avaliação refletida, não simplesmente visão física.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: marcada por desastre e grande prejuízo
  rationale: No contexto marítimo, ὕβρις aponta para dano severo ou calamidade, enquanto ζημία indica perda ou prejuízo. A formulação conserva os dois elementos sem atribuir a ὕβρις o sentido moral de arrogância.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: não somente para a carga e o navio, mas também para
  rationale: Explicita em português que o prejuízo atingirá a carga, o navio e as pessoas, preservando a construção correlativa do grego.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: a nossa vida
  rationale: Neste contexto de naufrágio e morte física, ψυχή significa a vida da pessoa. O singular coletivo “nossa vida” é idiomático e mantém o sentido compartilhado do perigo.
- source_word: μέλλειν ἔσεσθαι
  choice: será
  rationale: No enunciado de previsão, o futuro português comunica naturalmente a expectativa iminente indicada pela construção com μέλλω, sem a rigidez de “está para ser”.
- source_word: τὸν πλοῦν
  choice: esta viagem
  rationale: πλοῦς designa especificamente a viagem por mar; o demonstrativo torna natural a referência à viagem em curso ou planejada.
theological_decisions:
- issue: Sentido de ψυχή em τῶν ψυχῶν ἡμῶν
  choice: a nossa vida
  alternative: as nossas almas
  rationale: O risco imediato é a morte em um possível naufrágio; portanto, o termo se refere à vida física, sem fazer aqui uma afirmação sobre a natureza da alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Senhores” evita a estranheza do vocativo literal “Homens” sem apagar que Paulo se dirige a um grupo masculino. A sintaxe permanece próxima do grego, mas é ajustada para fluência em português.
