source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: pt
  text: Como o porto não era adequado para passar o inverno, a maioria decidiu zarpar dali, para ver se conseguiriam chegar a Fenice[a] e ali passar o inverno — um porto de Creta voltado para o sudoeste e o noroeste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fenice era um porto de Creta. O nome também pode ser transliterado “Fênix”.
    reason: cultural_note
  - marker: b
    text: A expressão final que descreve a orientação do porto é difícil. Tradicionalmente, é traduzida como “voltado para o sudoeste e o noroeste”; alguns entendem o segundo termo mais especificamente como “oeste-noroeste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: não era adequado
  rationale: Expressa que o porto não servia bem ao propósito de permanecer ali durante o inverno, em linguagem portuguesa natural.
- source_word: λιμένος
  choice: porto
  rationale: “Porto” é a designação náutica corrente e clara em português para λιμήν neste contexto.
- source_word: πρὸς παραχειμασίαν
  choice: para passar o inverno
  rationale: Traduz de modo idiomático a finalidade expressa pela construção grega.
- source_word: οἱ πλείονες
  choice: a maioria
  rationale: Representa diretamente o grupo numericamente maior, sem especificar além do texto quem o compunha.
- source_word: ἔθεντο βουλήν
  choice: decidiu
  rationale: O idioma grego indica a adoção coletiva de uma decisão; o singular concorda naturalmente com “a maioria”.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: partir dali
  rationale: No contexto marítimo, ἀνάγω significa fazer-se ao mar; “partir dali” comunica isso com naturalidade, enquanto o contexto já deixa claro que se trata de navegação.
- source_word: εἴ πως δύναιντο
  choice: na esperança de conseguir
  rationale: Preserva a combinação de intenção, possibilidade e incerteza, evitando uma formulação portuguesa pouco natural como “se de algum modo pudessem”.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: chegar a Fenice
  rationale: O particípio indica alcançar o destino; “chegar a” é claro e idiomático.
- source_word: Φοίνικα
  choice: Fenice
  rationale: Forma portuguesa tradicional do topônimo cretense, distinguindo-o naturalmente da ave fênix.
- source_word: παραχειμάσαι
  choice: ali passar o inverno
  rationale: Mantém a repetição intencional da ideia de invernar e explicita o destino de modo natural.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: voltado para o sudoeste e o noroeste
  rationale: “Voltado para” expressa a orientação do porto; a tradução tradicional dos rumos é mantida, com nota sobre a dificuldade da segunda designação.
