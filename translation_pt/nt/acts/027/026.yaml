  text: εἰς νῆσον δέ τινα δεῖ ἡμᾶς ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: pt
  text: Mas teremos de encalhar em alguma ilha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ser levados à costa de alguma ilha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao que foi dito antes; “Mas” é natural e preserva essa função discursiva.
- source_word: δεῖ
  choice: teremos de
  rationale: Expressa necessidade. A construção portuguesa “teremos de” comunica essa força de modo natural no contexto da previsão, sem explicitar a fonte da necessidade.
- source_word: ἡμᾶς
  choice: nós (implícito em “teremos”)
  rationale: O pronome é sujeito acusativo do infinitivo em grego; em português, a primeira pessoa do plural está claramente indicada pela flexão verbal.
- source_word: ἐκπεσεῖν
  choice: encalhar
  rationale: No contexto náutico, o verbo pode indicar que a embarcação é levada à costa ou encalha. “Encalhar” é conciso, corrente e adequado à situação.
- source_word: εἰς νῆσον
  choice: em alguma ilha
  rationale: Com o verbo náutico, εἰς indica o destino ou lugar do encalhe; em português idiomático, “encalhar em uma ilha” preserva esse sentido.
- source_word: τινα
  choice: alguma
  rationale: Mantém a referência indefinida a uma ilha não identificada.
theological_decisions:
- issue: Natureza da necessidade expressa por δεῖ
  choice: Manter apenas a ideia de necessidade em “teremos de”
  alternative: Explicitar necessidade divina ou cumprimento de um plano
  rationale: O versículo não nomeia por si só a fonte da necessidade; a tradução preserva essa abertura, deixando que o contexto a esclareça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Encalhar” conserva o caráter náutico; a nota registra a alternativa passiva, que destaca a embarcação sendo impelida à costa.
