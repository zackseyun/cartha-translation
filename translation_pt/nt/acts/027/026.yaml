  naturalness: A formulação é moderna, clara e de registro apropriado. Embora «encalhar» se associe mais diretamente a uma embarcação, seu uso com o grupo a bordo é compreensível e idiomático neste contexto marítimo.
  terminology: «Teremos de» comunica a necessidade sem atribuir-lhe indevidamente uma causa explícita. «Encalhar» e a alternativa «ser levados à costa» cobrem de modo equilibrado o campo semântico náutico, sem eliminar a nuance de deslocamento forçado.
