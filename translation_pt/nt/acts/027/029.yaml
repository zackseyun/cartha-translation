source:
  edition: SBLGNT
  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: pt
  text: E, com medo de que fôssemos dar em lugares rochosos[a], lançaram quatro âncoras da popa e oravam para que o dia chegasse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fôssemos levados contra lugares escarpados” ou “encalhássemos em lugares acidentados”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para que se tornasse dia”. O verbo traduzido por “oravam” também pode significar “desejavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: com medo
  rationale: Expressa de modo natural em português a circunstância e a motivação introduzidas pelo particípio grego.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: de que fôssemos dar em lugares rochosos
  rationale: Reproduz a apreensão de que o navio fosse levado contra uma área costeira áspera ou rochosa, sem especificar além do grego se eram recifes, baixios ou rochedos.
- source_word: ἐκ πρύμνης
  choice: da popa
  rationale: Emprega o termo náutico português preciso e corrente para a parte traseira do navio.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: lançaram quatro âncoras
  rationale: Formulação náutica natural que preserva a ação anterior à oração contínua expressa pelo verbo principal.
- source_word: ηὔχοντο
  choice: oravam
  rationale: O imperfeito indica ação contínua; neste contexto, εὔχομαι pode denotar oração, embora também admita a ideia de desejo, mantida em nota.
- source_word: ἡμέραν γενέσθαι
  choice: para que o dia chegasse
  rationale: Mantém a imagem do texto grego e comunica naturalmente a espera ansiosa pela chegada da luz do dia.
theological_decisions:
- issue: Sentido de ηὔχοντο
  choice: oravam
  alternative: desejavam ansiosamente
  rationale: O verbo pode indicar oração ou desejo. O contexto não identifica explicitamente o destinatário, por isso a alternativa lexical é preservada em nota sem eliminar a possível dimensão religiosa.
translation_notes:
  register: Português moderno, claro e digno, com terminologia náutica precisa. A primeira pessoa do plural em “fôssemos” preserva a forma grega e inclui o narrador no perigo; “lançaram” retoma os marinheiros como agentes da ação.
