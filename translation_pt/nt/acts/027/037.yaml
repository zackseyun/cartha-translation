lexical_decisions:
- source_word: ἤμεθα
  choice: éramos
  rationale: Preserva a primeira pessoa do plural do grego e soa natural em português na expressão de um total que inclui o narrador.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula funciona como conexão narrativa leve; neste versículo, a continuidade é comunicada naturalmente sem acrescentar «ora», «mas» ou «e».
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: ao todo ... pessoas
  rationale: Neste contexto, ψυχαί designa os seres humanos a bordo, não especificamente almas imateriais; «ao todo» representa a ideia de totalidade de πᾶσαι.
- source_word: ἐν τῷ πλοίῳ
  choice: no navio
  rationale: Tradução natural e direta da localização expressa pelo grego.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Mantém a contagem exata em formato numérico claro e corrente.
theological_decisions:
- issue: Sentido de ψυχαί
  choice: pessoas
  alternative: almas
  rationale: O uso é uma forma de contar pessoas presentes no navio. «Almas» poderia sugerir indevidamente uma afirmação sobre a parte imaterial do ser humano.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «Ao todo, éramos» conserva de modo natural a primeira pessoa do original e destaca a totalidade sem rigidez.
