  language: pt
  text: Ao todo, éramos 276 pessoas no navio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Éramos, ao todo, 276 almas no navio.” Aqui, “almas” significa “pessoas” ou “gente”, e não especificamente almas imateriais.'
