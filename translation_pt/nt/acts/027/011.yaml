  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: pt
  text: Mas o centurião dava mais crédito ao piloto e ao proprietário do navio do que ao que Paulo dizia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era mais persuadido pelo piloto e pelo proprietário do navio do que pelo que Paulo dizia”.'
    reason: Alternativa lexical que reproduz mais diretamente a forma passiva de ἐπείθετο.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: Termo histórico corrente e preciso para o oficial militar romano.
- source_word: κυβερνήτῃ
  choice: piloto
  rationale: No contexto marítimo, designa quem dirige ou navega a embarcação; mantém a distinção em relação a ναύκληρος.
- source_word: ναυκλήρῳ
  choice: proprietário do navio
  rationale: Expressa o provável sentido de dono ou principal responsável pela operação do navio, sem confundi-lo com o piloto.
- source_word: μᾶλλον ἐπείθετο
  choice: dava mais crédito
  rationale: Comunica naturalmente a ideia de deixar-se persuadir ou confiar mais no parecer de alguém, preservando a comparação de μᾶλλον.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: ao que Paulo dizia
  rationale: Forma natural em português que conserva a referência às palavras ou ao conselho de Paulo e o aspecto durativo do particípio presente.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a advertência de Paulo no versículo anterior.
- source_word: ἢ
  choice: do que
  rationale: Marcador comparativo natural em correlação com 'mais'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Dava mais crédito' evita a possível ideia de mera atenção auditiva e expressa de modo idiomático a confiança comparativamente maior no parecer dos profissionais do navio.
