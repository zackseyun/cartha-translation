  naturalness: O português é claro e de registro apropriado. A revisão proposta torna a ordem mais fluente e elimina a construção algo pesada “fossem os primeiros a se lançar ... e chegar”.
  terminology: “Centurião”, “salvar Paulo” e “os que podiam nadar” são escolhas adequadas, historicamente corretas e naturais. “Lançar-se ao mar” comunica bem o salto do navio para a água.
