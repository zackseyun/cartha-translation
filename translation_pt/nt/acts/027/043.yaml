  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: pt
  text: Mas o centurião, querendo salvar Paulo, impediu-os de levar adiante seu plano[a] e ordenou aos que podiam nadar que se lançassem primeiro ao mar e chegassem à terra[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, o plano dos soldados de matar os prisioneiros, mencionado no versículo anterior. Outra tradução possível: “impediu-os de realizar seu propósito”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tendo-se lançado primeiro, ir para a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: Título militar romano consagrado e imediatamente compreensível em português.
- source_word: βουλόμενος
  choice: querendo
  rationale: Expressa de modo natural a vontade ou intenção do centurião, sem intensificá-la.
- source_word: διασῶσαι
  choice: salvar
  rationale: No contexto, significa preservar Paulo com vida diante do perigo.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: impediu que executassem seu plano
  rationale: Torna explícito de maneira natural que o centurião frustrou a intenção dos soldados mencionada no versículo anterior.
- source_word: ἐκέλευσέν τε
  choice: e ordenou
  rationale: Reproduz com clareza a autoridade expressa por κελεύω.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: os que sabiam nadar
  rationale: Formulação corrente em português para identificar os que tinham capacidade de nadar.
- source_word: ἀπορίψαντας
  choice: se lançar ao mar
  rationale: Comunica idiomaticamente o ato de se atirarem para fora do navio, no mar.
- source_word: πρώτους
  choice: fossem os primeiros
  rationale: 'Preserva a sequência: os nadadores deveriam partir antes dos demais.'
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: chegar à terra
  rationale: Expressa com clareza o movimento da água para terra firme, sem pressupor além do texto se chegaram à praia naquele exato momento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Centurião” preserva o título histórico; “se lançar ao mar” explicita naturalmente o movimento para fora do navio. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
