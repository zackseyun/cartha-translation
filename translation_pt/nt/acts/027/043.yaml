  - severity: medium
    issue: Nota b não reproduz adequadamente a ordem sintática do grego
    rationale: A nota atual põe “fossem os primeiros” junto de “sair para a terra”; uma nota literal deve indicar que o “primeiro” acompanha “tendo-se lançado”.
