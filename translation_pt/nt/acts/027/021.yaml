base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: pt
  text: 'Depois de passarem muito tempo sem comer,[a] Paulo se pôs de pé entre eles e disse: “Homens, vocês deveriam ter me dado ouvidos[b], não ter zarpado de Creta e assim evitado este dano e esta perda”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Depois de um longo período de jejum”. A palavra grega pode indicar tanto falta de alimento quanto abstinência de comer; no contexto desta tempestade, é mais provável que se refira a um longo período sem comer.
    reason: lexical_alternative
  - marker: b
    text: Ou “me obedecido”. O verbo pode significar obedecer a uma instrução ou autoridade; aqui se refere a acatar o conselho de Paulo.
    reason: lexical_alternative
  - marker: c
    text: A expressão “dano e perda” provavelmente distingue o dano físico da perda material.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Depois de passarem muito tempo sem comer
  rationale: O genitivo absoluto estabelece a circunstância anterior ao discurso. ἀσιτία pode indicar falta de alimento ou abstinência, mas, no contexto da tempestade, provavelmente descreve um longo período sem comer. “Depois de” evita sugerir causalidade excessiva.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: Paulo se pôs de pé no meio deles
  rationale: Expressa de modo natural tanto a ação de Paulo assumir posição para falar quanto sua localização entre os presentes.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Homens, vocês deveriam ter
  rationale: O imperfeito de δεῖ indica o que deveria ter sido feito. “Homens” preserva o vocativo masculino direto, e “deveriam ter” comunica a repreensão retrospectiva.
- source_word: πειθαρχήσαντάς μοι
  choice: me dado ouvidos
  rationale: πειθαρχέω pode significar obedecer ou atender a uma orientação. Aqui, “dar ouvidos” preserva a ideia de acatar o conselho de Paulo sem pressupor uma relação formal de autoridade.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: não ter partido de Creta
  rationale: No contexto náutico, ἀνάγω significa fazer-se ao mar ou partir. A formulação escolhida é clara e idiomática em português.
- source_word: κερδῆσαί τε
  choice: assim teriam evitado
  rationale: Embora κερδαίνω normalmente envolva ganho, neste contexto exprime não incorrer no dano e na perda. “Teriam evitado” transmite essa força idiomática.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: este dano e esta perda
  rationale: No contexto marítimo, ὕβρις aponta para o dano ou violência sofrida, enquanto ζημία indica perda ou prejuízo. A tradução mantém os dois termos sem fundi-los.
