    issue: «não ter partido de Creta» não explicita o sentido náutico de ἀνάγεσθαι.
    rationale: No contexto da viagem marítima, o verbo significa fazer-se ao mar ou zarpar. «Partir» pode indicar qualquer tipo de saída; «zarpar de Creta» preserva melhor a especificidade da fonte.
  - severity: low
    issue: A oração final muda desnecessariamente de «deveriam ter» para «teriam evitado».
    rationale: O grego coordena κερδῆσαι aos infinitivos dependentes de ἔδει. Manter «e assim evitado» produz uma construção portuguesa natural e torna mais visível a unidade sintática.
