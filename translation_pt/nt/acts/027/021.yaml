  verdict: revise
  source_fidelity: A tradução transmite adequadamente a circunstância de prolongada falta de alimento, a ação de Paulo de se levantar entre o grupo, a repreensão retrospectiva e a dupla «dano e perda». Contudo, «partido de Creta» é genérico demais para o uso náutico de ἀνάγεσθαι, que indica sair para o mar/zarp ar.
  naturalness: O português é claro, moderno e apropriado. A coordenação da fala de Paulo fica mais fluente e mais próxima da construção grega ao manter «evitado» sob «deveriam ter», em vez de mudar para «teriam evitado» após ponto e vírgula.
  terminology: «Dano» e «perda» preservam de modo útil a distinção entre ὕβρις e ζημία. «Dar ouvidos» é uma boa expressão idiomática para πειθαρχήσαντάς μοι neste contexto. «Zarpado» torna explícito, sem excesso técnico, o sentido marítimo do verbo.
