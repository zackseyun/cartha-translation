  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: pt
  text: 'Como já havia passado bastante tempo, e a viagem já era perigosa[b], pois até o Jejum[a] já havia passado, Paulo os aconselhava:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Provavelmente, o jejum anual judaico do Dia da Expiação. Esse jejum ocorria numa época do ano em que a navegação no Mediterrâneo se tornava perigosa.
    reason: cultural_note
  - marker: b
    text: 'Ou: “arriscada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Como já havia passado bastante tempo
  rationale: A oração temporal em genitivo absoluto indica que um período considerável já havia transcorrido; a formulação é natural em português e não exagera sua duração.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: a viagem já era perigosa
  rationale: πλοῦς designa aqui a viagem ou navegação marítima, e ἐπισφαλής descreve seu caráter arriscado naquele momento.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: pois até o Jejum já havia passado
  rationale: A construção com διά e infinitivo articular expressa a razão; καί tem valor inclusivo ou intensivo, bem representado por “até”. “O Jejum” preserva a referência cultural definida sem explicá-la excessivamente no texto principal.
- source_word: παρῄνει
  choice: os aconselhava
  rationale: O imperfeito apresenta Paulo dando conselho ou exortação. “Aconselhava” mantém o sentido sem intensificá-lo indevidamente como uma advertência explícita.
