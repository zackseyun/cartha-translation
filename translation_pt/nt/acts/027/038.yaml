translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Comerem o suficiente» evita o tom excessivamente literal de «serem saciados de alimento»; «aliviar o navio» conserva a imagem náutica do texto-fonte. Os marcadores foram posicionados junto aos elementos a que se referem.
