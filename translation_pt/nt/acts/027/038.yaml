  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: pt
  text: Depois de comerem o suficiente[a], começaram[c] a aliviar o navio, lançando o trigo[b] ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Depois de se saciarem com a comida» ou «Depois de ficarem satisfeitos com o alimento».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os cereais» ou «os grãos». A palavra grega pode ter sentido mais amplo, embora aqui provavelmente se refira ao trigo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «foram aliviando o navio» ou, simplesmente, «aliviaram o navio». O imperfeito grego pode destacar o processo ou o início da ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: Depois de comerem o suficiente
  rationale: O particípio aoristo passivo, acompanhado do genitivo τροφῆς, indica que ficaram saciados de alimento. A formulação portuguesa comunica naturalmente tanto a suficiência da refeição quanto a relação temporal com a ação seguinte.
- source_word: δὲ
  choice: Depois de
  rationale: A partícula faz uma transição narrativa leve. Em vez de uma conjunção independente, sua função é expressa naturalmente pela ligação temporal da oração inicial.
- source_word: ἐκούφιζον
  choice: começaram a aliviar
  rationale: O imperfeito pode apresentar a ação em desenvolvimento ou em seu início. Esta tradução adota o valor incoativo, adequado à progressão narrativa, sem ocultar a alternativa aspectual, registrada em nota.
- source_word: τὸ πλοῖον
  choice: o navio
  rationale: No contexto da viagem marítima e de uma embarcação cargueira, «navio» é mais apropriado do que «barco».
- source_word: ἐκβαλλόμενοι
  choice: lançando
  rationale: O particípio presente explica o meio pelo qual aliviavam o navio. «Lançando» preserva a relação simultânea de modo natural em português.
- source_word: τὸν σῖτον
  choice: o trigo
  rationale: σῖτος pode designar cereal ou grão de modo mais amplo, mas frequentemente significa trigo; no contexto da carga do navio, «trigo» é uma escolha específica e plausível, mantendo-se a alternativa em nota.
- source_word: εἰς τὴν θάλασσαν
  choice: ao mar
  rationale: Equivalente português idiomático e fiel à direção indicada pela preposição εἰς.
