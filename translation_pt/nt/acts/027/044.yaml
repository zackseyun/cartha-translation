  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: pt
  text: e os demais, uns sobre tábuas e outros sobre alguns pedaços do navio. E assim aconteceu que todos chegaram a salvo à terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos foram levados a salvo à terra” ou “todos escaparam em segurança para a praia”. Aqui, o verbo grego se refere ao livramento físico durante o naufrágio.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: os demais
  rationale: Refere-se às pessoas restantes, não incluídas na instrução do versículo anterior; “os demais” é natural e preciso em português.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: uns ... e outros
  rationale: A construção correlativa divide as pessoas restantes em dois grupos; esta formulação reproduz o contraste de modo idiomático.
- source_word: ἐπὶ σανίσιν
  choice: sobre tábuas
  rationale: σανίς designa uma tábua ou prancha; “tábuas” é claro e apropriado ao contexto do naufrágio.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: sobre algumas partes do navio
  rationale: A expressão é deliberadamente indefinida e indica objetos ou partes provenientes do navio, sem especificar que tipo de destroços eram.
- source_word: οὕτως
  choice: assim
  rationale: Resume a maneira descrita imediatamente antes e introduz o resultado.
- source_word: ἐγένετο
  choice: aconteceu
  rationale: No uso narrativo desta construção, introduz o desfecho dos acontecimentos de forma direta e natural.
- source_word: πάντας διασωθῆναι
  choice: todos chegaram a salvo
  rationale: No contexto, διασῴζω expressa livramento físico em meio ao naufrágio. A formulação comunica o resultado com naturalidade e evita sugerir indevidamente salvação espiritual.
- source_word: ἐπὶ τὴν γῆν
  choice: à terra
  rationale: No contexto marítimo, γῆ é a terra firme em contraste com o mar; “à terra” é conciso e idiomático.
theological_decisions:
- issue: Possíveis conotações teológicas de διασωθῆναι
  choice: chegaram a salvo à terra
  alternative: foram salvos até chegarem à terra; escaparam em segurança para a praia
  rationale: O contexto imediato determina que se trata de livramento físico do naufrágio. A tradução não introduz uma afirmação sobre salvação espiritual, embora a nota preserve alternativas lexicais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém a continuidade com o versículo anterior e conserva a indefinição de “algumas partes do navio” sem acrescentar detalhes não expressos no grego.
