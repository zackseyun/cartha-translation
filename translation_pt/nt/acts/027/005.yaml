source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: pt
  text: Depois de navegarmos pelo mar aberto ao largo da Cilícia e da Panfília[a], descemos até Mira, na Lícia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao longo da Cilícia e da Panfília», indicando um percurso junto à costa dessas regiões.
    reason: lexical_alternative
  - marker: b
    text: Ou «chegamos a Mira, na Lícia». O verbo grego significa literalmente «descemos».
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: mar aberto
  rationale: O substantivo designa especificamente o mar aberto, e não apenas o mar em sentido genérico; «mar aberto» preserva essa precisão marítima em português natural.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: ao longo da Cilícia e da Panfília
  rationale: κατά com acusativo nesta expressão geográfica indica um percurso junto à costa dessas regiões; «ao longo de» comunica bem essa relação sem afirmar que a viagem ocorreu em terra.
- source_word: διαπλεύσαντες
  choice: Depois de atravessarmos
  rationale: O particípio aoristo descreve uma ação concluída antes da ação principal. A oração temporal explicita essa sequência em português corrente e mantém a ideia de travessia por navegação, já indicada por «mar aberto».
- source_word: κατήλθομεν
  choice: descemos até
  rationale: Preserva o sentido direcional literal de κατέρχομαι e continua compreensível como linguagem de viagem; a alternativa idiomática «chegamos a» é registrada em nota.
- source_word: Μύρα τῆς Λυκίας
  choice: Mira, na Lícia
  rationale: O genitivo localiza a cidade na região da Lícia; esta construção é clara e idiomática em português.
- source_word: τε
  choice: conexão implícita
  rationale: A partícula liga levemente a frase à narrativa anterior, mas não exige equivalente lexical explícito em português; sua função é absorvida pela continuidade do relato.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a especificidade náutica de «mar aberto» e a expressão direcional «descemos», sem tornar a sintaxe artificial. Os marcadores foram posicionados imediatamente após os trechos aos quais cada nota se refere.
