source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: pt
  text: 'dizendo: “Não tenha medo, Paulo. É necessário que você compareça diante de César. E veja: Deus lhe concedeu todos os que navegam com você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Expressa de modo natural em português a proibição no presente, sem sugerir necessariamente que Paulo já estivesse com medo.
- source_word: δεῖ
  choice: É necessário
  rationale: Preserva a ideia de necessidade determinada no contexto pelo propósito divino, sem explicitar além do grego.
- source_word: παραστῆναι
  choice: compareça diante de
  rationale: No contexto de César, transmite a ideia de apresentar-se formalmente perante a autoridade imperial.
- source_word: ἰδοὺ
  choice: veja
  rationale: Mantém o marcador enfático que chama a atenção para o anúncio seguinte, em linguagem atual.
- source_word: κεχάρισταί σοι
  choice: lhe concedeu
  rationale: Comunica a concessão graciosa já efetuada por Deus; o perfeito grego indica uma dádiva com resultado vigente.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: todos os que navegam com você
  rationale: Segue de perto a formulação grega e inclui todas as pessoas a bordo que viajavam com Paulo.
theological_decisions:
- issue: Sentido da concessão divina das pessoas a Paulo
  choice: Deus lhe concedeu todos os que navegam com você
  alternative: Deus poupará a vida de todos os que navegam com você
  rationale: A tradução preserva a forma e a tensão do original, sem transformar sua implicação contextual — a preservação da vida dos demais — em explicitação dentro do texto.
- issue: Natureza da necessidade de comparecer diante de César
  choice: É necessário que você compareça diante de César
  alternative: Você deverá comparecer diante de César
  rationale: “É necessário” conserva a força de δεῖ e permite que o contexto revele sua dimensão providencial, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Compareça diante de César” preserva o cenário formal; “veja” mantém a ênfase de ἰδού sem recorrer ao mais arcaizante “eis”. Mantém-se “você” em coerência com o tratamento direto natural no português brasileiro.
