id: ACT.9.16
reference: Acts 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: pt
  text: Pois eu lhe mostrarei quanto ele terá de sofrer por causa do meu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo meu nome” ou “em favor do meu nome”.
    reason: Alternativas lexicais para ὑπέρ, que pode destacar causa, finalidade ou atuação em favor de alguém.
lexical_decisions:
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito foi mantido para preservar a ênfase do grego, embora o português pudesse omiti-lo.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva claramente a conexão discursiva.
- source_word: ὑποδείξω
  choice: mostrarei
  rationale: Expressa de modo direto e natural o sentido futuro de mostrar, indicar ou dar a conhecer.
- source_word: αὐτῷ
  choice: lhe
  rationale: Reproduz naturalmente em português o objeto indireto no dativo.
- source_word: ὅσα
  choice: quanto
  rationale: Neste contexto com δεῖ e o infinitivo, indica a extensão do sofrimento, e não necessariamente uma lista de acontecimentos.
- source_word: δεῖ
  choice: terá de
  rationale: Comunica necessidade com naturalidade em português, sem especificar além do texto se ela é providencial, decretiva ou de outra natureza.
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Com “meu nome”, expressa de maneira clara a causa ou motivação do sofrimento; outras nuances possíveis são preservadas na nota.
- source_word: τοῦ ὀνόματός μου
  choice: do meu nome
  rationale: Mantém a linguagem bíblica em que o nome pode representar a pessoa, sua autoridade e a confissão pública ligada a ela.
- source_word: παθεῖν
  choice: sofrer
  rationale: É a tradução comum, direta e idiomática do infinitivo de πάσχω.
theological_decisions:
- issue: Natureza da necessidade expressa por δεῖ
  choice: terá de
  alternative: está destinado a; foi designado para
  rationale: A formulação afirma necessidade sem definir explicitamente sua natureza. “Terá de” conserva essa tensão e evita introduzir uma determinação mais específica do que o grego declara.
- issue: Nuance de ὑπὲρ τοῦ ὀνόματός μου
  choice: por causa do meu nome
  alternative: pelo meu nome; em favor do meu nome
  rationale: A escolha torna inteligível a ligação entre a identificação com Jesus e o sofrimento, enquanto a nota conserva as nuances de finalidade ou representação possíveis em ὑπέρ.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi mantida próxima do grego sem sacrificar a naturalidade. “Pois” conserva o vínculo explicativo; “terá de sofrer” soa mais corrente do que “deve sofrer” neste anúncio futuro.
