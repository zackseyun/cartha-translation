  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: pt
  text: E aqui ele tem autoridade, recebida dos principais sacerdotes, para prender todos os que invocam o teu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que clamam pelo teu nome”. A expressão grega é um idioma bíblico para invocar alguém, muitas vezes em oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: aqui
  rationale: Advérbio de lugar que, no contexto, se refere a Damasco; “aqui” é direto e natural.
- source_word: ἐξουσίαν παρὰ τῶν ἀρχιερέων
  choice: autoridade, recebida dos chefes dos sacerdotes
  rationale: ἐξουσία indica autorização oficial, e παρά com genitivo marca sua origem. “Recebida” explicita naturalmente essa relação sem mudar o sentido.
- source_word: δῆσαι
  choice: prender
  rationale: O sentido básico é “amarrar”, mas neste contexto a ação autorizada é deter pessoas. “Prender” comunica com clareza o efeito jurídico, preservando a ideia de sujeição física.
- source_word: πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου
  choice: todos os que invocam o teu nome
  rationale: O particípio substantivado significa “todos os que invocam”. “Invocar o teu nome” conserva o conhecido idioma bíblico, inclusive sua dimensão de oração e devoção, sem o reduzir a uma paráfrase.
theological_decisions:
- issue: Sentido de “invocar o teu nome” em referência a Jesus
  choice: Manter “invocam o teu nome”
  alternative: “oram a ti” ou “apelam para a tua autoridade”
  rationale: A expressão bíblica pode envolver oração, apelo e lealdade. Como Ananias fala diretamente a Jesus, ela carrega peso devocional, mas a tradução não deve restringir nem ampliar explicitamente o que o grego deixa no idioma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Chefes dos sacerdotes” evita a possível impressão de vários sumos sacerdotes simultâneos e designa naturalmente a liderança sacerdotal. O pronome “teu” mantém naturalidade na fala direta dirigida a Jesus.
