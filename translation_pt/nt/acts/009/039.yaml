  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: pt
  text: Então Pedro se levantou e foi com eles. Quando chegou, levaram-no para a sala do andar de cima. Todas as viúvas se puseram junto dele[a], chorando e mostrando as túnicas e as vestes[b] que Dorcas[c] fazia enquanto estava com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se apresentaram diante dele”. A expressão grega também pode ter um sentido mais formal; no contexto, porém, provavelmente descreve as viúvas reunidas junto de Pedro.'
    reason: lexical_alternative
  - marker: b
    text: “Túnicas e vestes” traduz dois termos gregos distintos, provavelmente referentes a peças de roupa básicas e exteriores.
    reason: cultural_note
  - marker: c
    text: Dorcas é o nome grego da mulher que, em Atos 9:36, também é chamada Tabita.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Expressa de modo natural a ação responsiva de Pedro, preservando o sentido de levantar-se.
- source_word: συνῆλθεν αὐτοῖς
  choice: foi com eles
  rationale: No contexto, o verbo indica que Pedro acompanhou os mensageiros; a formulação é clara e idiomática.
- source_word: παραγενόμενον
  choice: quando chegou
  rationale: Torna explícita, de maneira fluente, a relação temporal do particípio com a ação seguinte.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: levaram-no ao quarto de cima
  rationale: Preserva tanto o movimento para cima quanto a referência a um aposento no piso superior, em linguagem portuguesa corrente.
- source_word: παρέστησαν αὐτῷ
  choice: ficaram ao lado dele
  rationale: Retrata naturalmente as viúvas reunidas junto de Pedro, sem excluir a possibilidade mais formal indicada em nota.
- source_word: κλαίουσαι
  choice: chorando
  rationale: O particípio presente descreve o lamento em andamento; “chorando” é natural e mantém o tom solene do contexto.
- source_word: ἐπιδεικνύμεναι
  choice: mostrando
  rationale: Comunica de forma simples a apresentação das peças para que Pedro as visse.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: túnicas e mantos
  rationale: Mantém a distinção entre os dois termos gregos de vestuário, provavelmente uma peça básica e uma peça exterior.
- source_word: ὅσα ἐποίει
  choice: que ... fazia
  rationale: O imperfeito é preservado naturalmente e pode sugerir atividade continuada ou costumeira sem tornar essa nuance excessivamente explícita.
- source_word: μετ’ αὐτῶν οὖσα
  choice: enquanto estava com elas
  rationale: Preserva a referência ao período em que Dorcas ainda vivia entre as viúvas, sem explicitar além do grego a sua morte.
theological_decisions:
- issue: Relação de Dorcas com as viúvas em μετ’ αὐτῶν οὖσα
  choice: enquanto estava com elas
  alternative: quando ainda vivia com elas
  rationale: A tradução escolhida segue de perto a expressão grega e evita inserir diretamente a ideia de estar viva, embora o contexto narrativo a pressuponha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi dividida em três frases para evitar um período excessivamente longo. “Quarto de cima” é mais transparente no uso corrente do que “cenáculo”, e “levaram-no” mantém concisão sem arcaísmo excessivo.
