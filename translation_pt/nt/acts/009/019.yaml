lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: Depois de comer
  rationale: O particípio aoristo seguido de τροφή descreve o ato de receber e consumir alimento; esta formulação natural preserva a sequência temporal.
- source_word: ἐνίσχυσεν
  choice: recuperou as forças
  rationale: No contexto de três dias sem comer nem beber, o verbo indica que Saulo voltou a ter vigor; a expressão é idiomática e comunica adequadamente o resultado.
- source_word: Ἐγένετο δὲ
  choice: E ficou
  rationale: A expressão funciona como transição narrativa. Em português, “ficou” apresenta com naturalidade a permanência de Saulo junto aos discípulos, sem traduzir mecanicamente a fórmula grega.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: com os discípulos que estavam em Damasco
  rationale: μετά com genitivo indica associação, e a expressão atributiva identifica a localização dos discípulos.
- source_word: ἡμέρας τινάς
  choice: alguns dias
  rationale: O acusativo expressa duração por um período breve e não especificado; “alguns dias” preserva essa indefinição.
