  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: pt
  text: Em Jope havia uma discípula chamada Tabita[a], cujo nome, traduzido, é Dorcas. Ela era cheia de boas obras e de atos de misericórdia que praticava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorcas é o nome grego correspondente a Tabita; o nome significa “gazela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: discípula
  rationale: O substantivo grego é explicitamente feminino, e o português permite preservar essa informação de modo natural com “discípula”.
- source_word: ὀνόματι Ταβιθά
  choice: chamada Tabita
  rationale: A expressão dativa introduz naturalmente o nome da mulher; “chamada” é corrente e idiomático em português.
- source_word: ἣ διερμηνευομένη λέγεται Δορκάς
  choice: nome que, traduzido, é Dorcas
  rationale: Preserva a explicação de que Dorcas é o equivalente grego do nome sem sugerir que o texto oferece apenas seu significado lexical.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: cheia de boas obras
  rationale: Reproduz de perto a construção grega e permanece natural no registro bíblico moderno.
- source_word: ἐλεημοσυνῶν
  choice: atos de misericórdia
  rationale: Expressa ações concretas de cuidado misericordioso e auxílio aos necessitados sem restringi-las necessariamente a doações em dinheiro.
- source_word: ὧν ἐποίει
  choice: que praticava
  rationale: O imperfeito indica atividade habitual ou continuada; “praticava” comunica essa continuidade com naturalidade.
- source_word: δέ
  choice: sem equivalente explícito
  rationale: Aqui δέ promove o desenvolvimento narrativo; a passagem para esta cena é natural em português sem um marcador inicial acrescentado.
- source_word: Ἐν Ἰόππῃ
  choice: Em Jope
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo no sintagma locativo.
theological_decisions:
- issue: Forma feminina de μαθήτρια
  choice: discípula
  alternative: seguidora
  rationale: “Discípula” preserva explicitamente o raro substantivo feminino do original e sua relação lexical com “discípulo”, sem paráfrase interpretativa.
- issue: Alcance de ἐλεημοσυνῶν
  choice: atos de misericórdia
  alternative: esmolas
  rationale: O termo pode designar esmolas, mas também enfatiza a assistência misericordiosa. A opção escolhida conserva essa amplitude, enquanto o contexto imediato mostrará formas concretas de cuidado.
- issue: Relação entre Tabita e Dorcas
  choice: Dorcas como tradução/equivalente grego do nome
  alternative: traduzir ambos simplesmente como “Gazela”
  rationale: Lucas apresenta dois nomes em línguas diferentes; mantê-los no texto preserva a forma narrativa, e a nota informa o significado compartilhado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e uso internacional. A formulação conserva a forma feminina “discípula”, a continuidade habitual do imperfeito e a distinção entre os nomes Tabita e Dorcas.
