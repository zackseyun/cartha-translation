id: ACT.9.3
reference: Acts 9:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: pt
  text: Enquanto ele seguia viagem, aconteceu que, ao se aproximar de Damasco, de repente uma luz vinda do céu[a] brilhou ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega pode indicar tanto o céu visível quanto o céu como esfera divina; neste contexto, provavelmente ressalta a origem divina da luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Enquanto ele seguia viagem
  rationale: A construção ἐν com infinitivo articular expressa uma ação simultânea. “Enquanto ele seguia viagem” transmite esse valor temporal em português natural; δέ funciona aqui como leve transição narrativa e não exige uma palavra específica.
- source_word: ἐγένετο
  choice: aconteceu que
  rationale: Preserva o marcador narrativo frequente em Lucas sem tornar a frase excessivamente literal.
- source_word: αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: ao se aproximar de Damasco
  rationale: Expressa de modo idiomático a construção de acusativo com infinitivo e conserva o aspecto progressivo de ἐγγίζειν, indicando aproximação, não entrada na cidade.
- source_word: ἐξαίφνης τε
  choice: de repente
  rationale: Comunica a irrupção súbita do acontecimento; a ligação leve de τε é suficientemente representada pela estrutura da frase em português.
- source_word: περιήστραψεν
  choice: brilhou ao redor dele
  rationale: O verbo composto descreve uma luz que resplandece envolvendo alguém. A formulação é clara e natural, sem acrescentar uma intensidade não explicitada.
- source_word: φῶς
  choice: uma luz
  rationale: O artigo indefinido é natural em português para introduzir essa luz no relato.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vinda do céu
  rationale: “Céu” é a correspondência portuguesa direta e mantém a possível referência tanto ao céu visível quanto à esfera divina; “vinda de” explicita naturalmente a origem marcada por ἐκ.
theological_decisions:
- issue: Sentido de οὐρανός no contexto da revelação
  choice: céu
  alternative: céu visível
  rationale: “Céu” conserva em português a amplitude lexical do grego. O contexto favorece a origem divina da luz, mas a tradução não elimina a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem foi levemente ajustada para evitar uma construção pesada, preservando a simultaneidade, a aproximação progressiva e a súbita luz envolvente.
