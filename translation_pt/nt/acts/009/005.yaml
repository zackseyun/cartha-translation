id: ACT.9.5
reference: Acts 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: pt
  text: 'E ele disse: “Quem és tu, Senhor[a]?” E ele disse: “Eu sou Jesus, a quem tu persegues.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ter esse sentido; aqui, “Senhor” também condiz com o contexto da revelação.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: perguntou / respondeu
  rationale: 'Embora o verbo grego seja literalmente “disse” nas duas ocorrências, o conteúdo das falas permite usar verbos de elocução naturais em português: a primeira fala é uma pergunta, e a segunda, sua resposta.'
- source_word: δέ
  choice: E / sem equivalente explícito
  rationale: O primeiro δέ funciona como conectivo narrativo leve e é representado por “E”. Na segunda ocorrência, a transição já fica clara com “Ele respondeu”, de modo que outro conectivo seria pouco natural.
- source_word: Τίς εἶ
  choice: Quem és tu
  rationale: Tradução direta e idiomática do interrogativo com a cópula; a ordem preserva um tom digno e corrente.
- source_word: κύριε
  choice: Senhor
  rationale: κύριε pode ser tanto uma forma respeitosa de tratamento quanto a invocação “Senhor”. No contexto da revelação celestial e conforme a equivalência usual de κύριος, “Senhor” é mantido, com a alternativa indicada em nota.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva o pronome expresso e enfático do grego, sem acrescentar conotações além da autoidentificação imediata.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ὃν σὺ διώκεις
  choice: a quem tu persegues
  rationale: A locução “a quem” marca Jesus como objeto pessoal do verbo. O “tu” expresso preserva a ênfase do pronome grego σὺ, e o presente “persegues” representa a ação em curso sem exigir uma construção progressiva.
theological_decisions:
- issue: Sentido de κύριε antes de Jesus se identificar
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento; ou “meu senhor”
  rationale: O vocativo grego é genuinamente ambíguo quanto ao grau de reconhecimento de Saulo nesse momento. “Senhor” preserva a força narrativa e teológica no contexto da aparição, enquanto a nota mantém aberta a leitura meramente respeitosa.
- issue: Identificação de Jesus com os perseguidos
  choice: “a quem tu persegues” sem explicação no corpo do texto
  alternative: Explicitar “cujo povo tu persegues”
  rationale: O original afirma diretamente que Saulo persegue Jesus. A tradução conserva essa tensão cristológica e eclesiológica, sem substituí-la por uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “tu” preserva a ênfase do pronome grego e combina naturalmente com “és” e “persegues”. A variação “perguntou/respondeu” favorece fluidez sem alterar a função das falas.
