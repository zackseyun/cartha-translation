id: ACT.9.1
reference: Acts 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: pt
  text: Saulo, porém, ainda respirava ameaças e morte[a] contra os discípulos do Senhor. Ele se apresentou ao sumo sacerdote
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homicídio” ou “matança”. O grego φόνος pode indicar morte violenta ou homicídio.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: porém
  rationale: Marca a retomada de Saulo com leve contraste em relação à cena anterior, de modo natural em português.
- source_word: ἔτι
  choice: ainda
  rationale: Expressa a continuidade da hostilidade de Saulo.
- source_word: ἐμπνέων
  choice: respirava
  rationale: Preserva a metáfora vívida de que ameaças e morte permeavam a atitude de Saulo.
- source_word: ἀπειλῆς
  choice: ameaças
  rationale: O plural é idiomático em português e comunica atos e intenções hostis.
- source_word: φόνου
  choice: morte
  rationale: Mantém a amplitude lexical de φόνος — morte violenta, matança ou homicídio — sem decidir no texto principal a classificação jurídica ou moral precisa.
- source_word: εἰς τοὺς μαθητὰς
  choice: contra os discípulos
  rationale: No contexto hostil, εἰς indica o alvo das ameaças e da violência.
- source_word: μαθητὰς
  choice: discípulos
  rationale: É o termo convencional e preciso para os seguidores comprometidos do Senhor em Atos.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Reproduz o genitivo e o uso cristológico contextual de κύριος.
- source_word: προσελθὼν
  choice: se apresentou
  rationale: Comunica que Saulo foi até o sumo sacerdote e compareceu diante dele, preparando naturalmente o pedido do versículo seguinte.
- source_word: ἀρχιερεῖ
  choice: sumo sacerdote
  rationale: Equivalente português consagrado para o singular ἀρχιερεύς.
theological_decisions:
- issue: Tradução de κύριος em τοῦ κυρίου
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” corresponde ao uso normal de κύριος em Lucas–Atos neste contexto e evita introduzir uma interpretação denominacional.
- issue: Força moral de φόνος
  choice: morte
  alternative: homicídio; matança
  rationale: O vocábulo grego pode designar morte violenta ou homicídio. “Morte” preserva essa amplitude no texto, enquanto a nota registra alternativas mais específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “respirava ameaças e morte” foi preservada. A divisão em duas orações evita uma construção participial pesada, sem alterar a relação narrativa com o versículo seguinte.
