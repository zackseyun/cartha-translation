source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: pt
  text: 'Então Ananias foi, entrou na casa e, impondo as mãos sobre ele, disse: “Irmão Saulo, o Senhor Jesus, que apareceu a você no caminho pelo qual você vinha, me enviou para que você recupere a visão[a] e seja cheio do Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “volte a enxergar”.
    reason: Alternativa lexical que traduz de modo mais verbal e direto o sentido contextual de ἀναβλέψῃς.
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Então Ananias foi
  rationale: δέ dá prosseguimento à narrativa, com valor consequencial no contexto; “Então” liga naturalmente a ação de Ananias à ordem anterior, enquanto “foi” traduz ἀπῆλθεν sem enfatizar em excesso a ideia de partida.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: entrou na casa
  rationale: Expressão portuguesa direta e idiomática que preserva o movimento para o interior da casa.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: impondo as mãos sobre ele
  rationale: Mantém o ato físico e a expressão bíblica reconhecível, representando o particípio como ação concomitante.
- source_word: Σαοὺλ ἀδελφέ
  choice: Irmão Saulo
  rationale: Forma vocativa natural em português, preservando o tom de acolhimento e fraternidade do termo ἀδελφέ.
- source_word: ἀπέσταλκέν με
  choice: me enviou
  rationale: O pretérito perfeito português comunica de modo natural uma ação passada cujo resultado permanece vigente; uma forma composta seria menos idiomática neste contexto.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Jesus, aquele que apareceu a você
  rationale: Preserva a aposição de Ἰησοῦς a “o Senhor” e o valor identificador do particípio articular, sem reorganizar silenciosamente a sintaxe como “o Senhor Jesus”.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: no caminho pelo qual você vinha
  rationale: “Caminho” é natural para ὁδός e “vinha” conserva o aspecto durativo do imperfeito ἤρχου, bem como a perspectiva de movimento em direção ao destino.
- source_word: ἀναβλέψῃς
  choice: você recupere a visão
  rationale: No contexto da cegueira e cura, ἀναβλέπω indica voltar a enxergar, não apenas erguer os olhos.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: fique cheio do Espírito Santo
  rationale: “Fique cheio” expressa com clareza o aoristo passivo subjuntivo; “do Espírito Santo” é a forma idiomática portuguesa para a referência definida ao Espírito divino.
theological_decisions:
- issue: Relação apositiva entre “o Senhor” e “Jesus”
  choice: “o Senhor me enviou — Jesus, aquele que apareceu a você...”
  alternative: “o Senhor Jesus, que apareceu a você..., me enviou”
  rationale: A tradução mantém a ordem e a tensão sintática do grego, no qual Ἰησοῦς funciona como aposição explicativa de ὁ κύριος. A pontuação esclarece que Jesus identifica o Senhor sem transformar a construção em um título composto.
- issue: Sentido de ἀδελφέ no tratamento dado a Saulo
  choice: “Irmão Saulo”
  alternative: “Saulo, irmão”
  rationale: A forma escolhida preserva a linguagem relacional de acolhimento e comunhão, sem exigir que se determine aqui se o termo enfatiza fraternidade étnica ou especificamente cristã.
- issue: πνεύματος ἁγίου sem artigo grego
  choice: “do Espírito Santo”
  alternative: “de Espírito Santo”
  rationale: A ausência de artigo em grego não exige sentido indefinido. Em Atos, a expressão designa o Espírito divino, e o artigo é necessário para uma formulação portuguesa natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a aposição incomum do original mediante travessões, em vez de reordená-la como “o Senhor Jesus”. O pronome “você” favorece clareza internacional com leitura brasileira natural; “impondo as mãos” conserva a expressão bíblica tradicional sem arcaísmo excessivo.
