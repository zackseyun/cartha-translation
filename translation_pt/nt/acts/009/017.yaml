  to: 'Então Ananias foi, entrou na casa e, impondo as mãos sobre ele, disse: “Irmão Saulo, o Senhor Jesus, que apareceu a você no caminho pelo qual você vinha, me enviou para que você recupere a visão[a] e seja cheio do Espírito Santo.”'
  rationale: A única revisão necessária é reorganizar a aposição «Jesus, aquele que apareceu...» como «o Senhor Jesus, que apareceu...», uma construção portuguesa clara que preserva a identificação apositiva do grego e evita uma interrupção ambígua depois de «me enviou». Também se emprega «seja cheio» para refletir mais diretamente o subjuntivo passivo πλησθῇς. A nota existente permanece corretamente ancorada e pertinente.
