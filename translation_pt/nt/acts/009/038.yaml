source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: pt
  text: 'Como Lida ficava perto de Jope, os discípulos, ao ouvirem que Pedro estava ali, enviaram-lhe dois homens, pedindo com insistência: “Não demore para vir até nós.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não hesite em vir até nós.” O verbo grego pode indicar tanto hesitação quanto demora; no texto, “não demore” ressalta a urgência do pedido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Como Lida ficava perto de Jope
  rationale: O genitivo absoluto fornece a circunstância de fundo e, no contexto, sugere a razão prática para o envio dos homens. “Como” preserva essa nuance sem acrescentar um marcador temporal inexistente.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lida / Jope
  rationale: Formas tradicionais e amplamente reconhecidas em português para os topônimos gregos do contexto do Novo Testamento.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Termo corrente e preciso em Atos para os integrantes da comunidade de seguidores de Jesus.
- source_word: ἀκούσαντες
  choice: ao ouvirem
  rationale: Expressa naturalmente a circunstância anterior indicada pelo particípio aoristo, sem tornar a frase pesada.
- source_word: ἐν αὐτῇ
  choice: ali
  rationale: O pronome retoma Lida; “ali” é a forma locativa natural em português.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: enviaram-lhe dois homens
  rationale: Reproduz de modo conciso o envio de dois homens a Pedro; o pronome dativo deixa claro o destinatário.
- source_word: παρακαλοῦντες
  choice: pedindo com insistência
  rationale: Comunica o caráter urgente e enfático do pedido sem elevar indevidamente a intensidade para “implorando”.
- source_word: Μὴ ὀκνήσῃς
  choice: Não demore
  rationale: No pedido de deslocamento, ὀκνέω pode indicar demora ou hesitação. “Não demore” exprime com naturalidade a urgência contextual.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: para vir até nós
  rationale: Traduz idiomaticamente o deslocamento de Pedro até o lugar dos falantes, preservando a perspectiva de quem faz o pedido.
