id: ACT.9.21
reference: Acts 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: pt
  text: 'Todos os que o ouviam ficavam espantados e diziam: “Não é este o homem que, em Jerusalém, devastou os que invocam este nome[a]? E não tinha ele vindo aqui para isto: levá-los presos aos chefes dos sacerdotes?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Este nome” refere-se a Jesus. “Invocar este nome” também pode ser entendido como apelar para esse nome ou confessá-lo.
    reason: lexical_and_referential_clarification
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ficavam espantados
  rationale: O imperfeito expressa a reação contínua dos ouvintes; a formulação é natural em português e preserva a intensidade sem exagerá-la.
- source_word: πάντες οἱ ἀκούοντες
  choice: todos os que o ouviam
  rationale: O particípio substantivado designa os que ouviam Saulo; o pronome explicita o objeto implícito pelo contexto.
- source_word: πορθήσας
  choice: devastou
  rationale: O verbo é mais forte do que simplesmente “perseguiu” e retrata a ação destrutiva de Saulo contra os discípulos.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: os que invocam este nome
  rationale: “Invocar” preserva a expressão bíblica de apelo e confissão ligada ao nome, sem explicitar além do grego a referência a Jesus.
- source_word: εἰς τοῦτο
  choice: justamente para isto
  rationale: A expressão indica propósito; “justamente” comunica a ênfase contextual da pergunta.
- source_word: ἐληλύθει
  choice: tinha ele vindo
  rationale: O mais-que-perfeito grego situa a vinda antes da reação presente dos falantes; a inversão do pronome soa natural na pergunta retórica.
- source_word: δεδεμένους
  choice: presos
  rationale: Expressa o estado de pessoas detidas e conduzidas sob custódia, sem especificar indevidamente o instrumento usado para prendê-las.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: levá-los ... aos chefes dos sacerdotes
  rationale: “Levar” representa adequadamente ἄγω, e “aos” preserva o movimento em direção às autoridades sacerdotais.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: No contexto do Segundo Templo, o plural designa as principais autoridades sacerdotais, não vários sumos sacerdotes simultâneos.
theological_decisions:
- issue: Explicitar a referência de “este nome”
  choice: Manter “este nome” no texto principal
  alternative: o nome de Jesus
  rationale: O grego deixa o referente implícito. A forma demonstrativa preserva a força retórica e reverencial, enquanto o contexto identifica Jesus.
- issue: Intensidade de πορθήσας
  choice: devastou
  alternative: perseguiu
  rationale: O verbo grego descreve ruína ou devastação e é mais intenso que o termo genérico para perseguição.
- issue: Sentido de ἐπικαλουμένους
  choice: invocam
  alternative: chamam por
  rationale: “Invocar” conserva tanto a ideia de apelo quanto a possível dimensão confessional ou cultual, sem resolver em excesso sua amplitude.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi preservada, assim como o aspecto contínuo de “ouviam”, “ficavam” e “diziam”. Evitou-se linguagem denominacional e manteve-se implícita, como no grego, a referência de “este nome”.
