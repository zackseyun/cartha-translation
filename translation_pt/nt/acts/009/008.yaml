  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: pt
  text: Saulo se levantou do chão e, embora estivesse com os olhos abertos, não via nada. Então o conduziram pela mão e o levaram para dentro de Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: se levantou
  rationale: 'O aoristo passivo de ἐγείρω tem aqui sentido intransitivo no fluxo narrativo: Saulo tornou a ficar de pé. “Se levantou” é natural e atual em português.'
- source_word: ἀπὸ τῆς γῆς
  choice: do chão
  rationale: Neste contexto, γῆ designa o chão onde Saulo havia caído, não a terra em sentido cósmico ou geográfico.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: embora estivesse com os olhos abertos
  rationale: O genitivo absoluto indica circunstância concomitante, e o contexto lhe confere força concessiva, ressaltando o contraste entre ter os olhos abertos e não enxergar.
- source_word: οὐδὲν ἔβλεπεν
  choice: não via nada
  rationale: Expressa diretamente a ausência total de visão e permanece próximo da formulação grega.
- source_word: χειραγωγοῦντες
  choice: o conduziram pela mão
  rationale: χειραγωγέω denota especificamente conduzir alguém pela mão, em especial quem necessita de orientação; a tradução preserva essa imagem concreta.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: o levaram para dentro de Damasco
  rationale: εἰσάγω indica levar ou introduzir para dentro. A formulação preserva o movimento de entrada na cidade sem repetir “conduzir”.
- source_word: δὲ
  choice: e / Então
  rationale: As três ocorrências marcam progressão narrativa e leve contraste. Em português, não é necessário representar cada uma de modo idêntico; “e” liga as primeiras ações, enquanto “Então” apresenta naturalmente a ação subsequente.
- source_word: Σαῦλος
  choice: Saulo
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Δαμασκόν
  choice: Damasco
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
