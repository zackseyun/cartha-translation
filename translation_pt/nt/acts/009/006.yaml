    issue: Mistura de formas de tratamento
    rationale: “Levante-se”, “entre” e “lhe” seguem tratamento formal, enquanto “você” introduz outra série pronominal na mesma frase. A omissão de “você” em “o que deve fazer” mantém o referente e torna o tratamento consistente.
  - severity: low
    issue: Adição de “então”
    rationale: O grego traz καί (“e”), sem advérbio temporal ou consecutivo explícito. “E” preserva mais diretamente a ligação coordenativa do texto-fonte.
  revised_text: Mas levante-se e entre na cidade, e lhe será dito o que deve fazer.
