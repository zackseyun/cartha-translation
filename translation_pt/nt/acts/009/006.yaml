  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: pt
  text: Mas levante-se e entre na cidade, e lhe será dito o que deve fazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca a transição adversativa para a ordem dada a Saulo; “Mas” é conciso e natural em português.
- source_word: ἀνάστηθι
  choice: levante-se
  rationale: Imperativo que, no contexto de Saulo caído por terra, é expresso de modo claro e idiomático por “levante-se”.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: entre na cidade
  rationale: Reproduz naturalmente o movimento para dentro indicado pelo verbo e pela preposição gregos.
- source_word: λαληθήσεταί σοι
  choice: lhe será dito
  rationale: Mantém a construção passiva e a ausência de um agente explícito no grego, sem tornar a frase artificial em português.
- source_word: ὅ τί
  choice: o que
  rationale: Introduz de maneira natural em português o conteúdo daquilo que será comunicado.
- source_word: σε δεῖ ποιεῖν
  choice: o que você deve fazer
  rationale: “Deve” preserva a força de necessidade ou obrigação de δεῖ, enquanto “você” torna explícito o destinatário já indicado no grego.
theological_decisions:
- issue: Força de δεῖ no contexto de orientação divina
  choice: deve
  alternative: precisa
  rationale: “Deve” preserva a força de necessidade ou obrigação sem definir além do texto a natureza exata dessa necessidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O ponto e vírgula e “então” apresentam com naturalidade a sequência entre entrar na cidade e receber instruções; a voz passiva preserva a indeterminação do agente presente no grego.
