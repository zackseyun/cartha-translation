- from: Mas levante-se e entre na cidade; então lhe será dito[a] o que você deve fazer.
  to: Mas levante-se e entre na cidade, e lhe será dito o que deve fazer.
  rationale: A revisão remove a nuance adicional de “então” e uniformiza o tratamento pronominal, preservando a passiva impessoal e a força de necessidade do grego. A nota mantém uma alternativa mais literal para a construção passiva e para δεῖ.
