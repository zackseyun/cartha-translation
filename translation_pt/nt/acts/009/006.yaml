review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a adversativa (ἀλλά), os dois imperativos, a entrada na cidade, a passiva futura sem agente expresso e a necessidade expressa por δεῖ. Contudo, “então” introduz uma nuance consecutiva/temporal que não está explicitamente marcada pelo simples καί grego.
  naturalness: A redação é clara, mas alterna tratamento formal em “levante-se”, “entre” e “lhe” com “você” na oração final. A uniformização melhora a fluidez e a adequação a um registro moderno e amplamente internacional.
  terminology: “Deve fazer” transmite bem a força de δεῖ sem especificar indevidamente a origem da necessidade. “Será dito” mantém de modo natural a passiva de λαληθήσεται.
  issues:
