id: ACT.9.31
reference: Acts 9:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: pt
  text: Assim, a igreja[a] por toda a Judeia, Galileia e Samaria tinha paz e era edificada; e, vivendo no temor do Senhor e no encorajamento do Espírito Santo[b], crescia em número.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “as igrejas” em vez de “a igreja”.
    reason: textual_variant
  - marker: b
    text: Ou “consolo” ou “exortação” do Espírito Santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: a igreja
  rationale: Segue o singular do SBLGNT e apresenta a igreja coletivamente nas três regiões; a variante plural é registrada em nota.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: em toda a Judeia, Galileia e Samaria
  rationale: Expressa de modo natural o sentido regional e distributivo de κατά com o genitivo e mantém a abrangência indicada por ὅλης.
- source_word: εἶχεν εἰρήνην
  choice: tinha paz
  rationale: Reproduz diretamente a expressão grega e pode abranger tanto o alívio da perseguição quanto a estabilidade da comunidade.
- source_word: οἰκοδομουμένη
  choice: era edificada
  rationale: Preserva a metáfora de construção e o aspecto passivo e contínuo do particípio, em formulação corrente no português bíblico.
- source_word: πορευομένη
  choice: Vivendo
  rationale: Transmite naturalmente o sentido metafórico de conduta ou modo de vida, evitando que o literal 'caminhando' seja entendido como deslocamento físico.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: no temor do Senhor
  rationale: Mantém a expressão bíblica tradicional e sua amplitude de reverência, devoção e obediência, sem reduzi-la a terror.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: no encorajamento do Espírito Santo
  rationale: Encorajamento se ajusta ao contexto de edificação e crescimento, enquanto a nota preserva os sentidos possíveis de consolo e exortação.
- source_word: ἐπληθύνετο
  choice: ela se multiplicava
  rationale: Expressa o aumento numérico contínuo indicado pelo imperfeito e mantém a concordância com o sujeito coletivo singular.
theological_decisions:
- issue: Número e alcance de ἐκκλησία
  choice: 'singular coletivo: “a igreja”'
  alternative: 'variante plural: “as igrejas”'
  rationale: O texto crítico fornecido traz o substantivo, os particípios e os verbos no singular, retratando uma só igreja espalhada pelas regiões; a variante plural permanece em nota.
- issue: Sentido de “temor do Senhor”
  choice: reverência devota que orienta a vida
  alternative: terror diante do Senhor ou mera reverência religiosa genérica
  rationale: A formulação literal preserva a riqueza e a tensão da expressão bíblica sem impor uma paráfrase interpretativa estreita.
- issue: Sentido de παράκλησις ligado ao Espírito Santo
  choice: encorajamento
  alternative: consolo ou exortação
  rationale: O termo grego comporta essas nuances. “Encorajamento” é natural no contexto, mas as demais possibilidades são teologicamente relevantes e aparecem em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Era edificada” conserva a metáfora do original; “vivendo” comunica de forma idiomática o sentido ético de πορευομένη. Os marcadores [a] e [b] aparecem no texto principal.
