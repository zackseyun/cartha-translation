  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: pt
  text: 'E Pedro lhe disse: “Eneias, Jesus, o Messias, cura você. Levante-se e arrume a sua cama.” E ele se levantou imediatamente.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: cura
  rationale: O presente do verbo ἰάομαι é preservado de modo natural e direto, com força declarativa no contexto da cura, sem convertê-lo em resultado passado.
- source_word: Χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona como título de Jesus; “o Messias” comunica seu sentido em português corrente, e as vírgulas deixam clara a aposição.
- source_word: ἀνάστηθι
  choice: Levante-se
  rationale: Imperativo natural e digno em português para a ordem dirigida a um homem acamado.
- source_word: στρῶσον σεαυτῷ
  choice: arrume a sua cama
  rationale: Expressão idiomática que comunica preparar ou pôr em ordem a própria cama. O possessivo transmite naturalmente a referência reflexiva de σεαυτῷ sem a ênfase pouco idiomática de “para você mesmo”.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente direto que mantém a ênfase narrativa na prontidão e eficácia da cura.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Retoma naturalmente o verbo da ordem anterior e narra seu cumprimento imediato.
- source_word: Αἰνέα
  choice: Eneias
  rationale: Forma portuguesa tradicional e reconhecível do nome grego Αἰνέας.
theological_decisions:
- issue: Sentido titular de Χριστός na declaração de cura
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A tradução explicita o valor de título de Χριστός sem tratá-lo como sobrenome ou elemento meramente nominal; a alternativa tradicional continua semanticamente possível, mas é menos transparente para leitores comuns.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “lhe disse” evita repetição pesada; “cura você” mantém a declaração no presente e é natural no português brasileiro. Nenhuma nota é necessária porque as ambiguidades relevantes podem ser representadas adequadamente no texto.
