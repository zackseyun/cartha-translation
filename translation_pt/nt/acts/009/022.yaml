id: ACT.9.22
reference: Acts 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: pt
  text: Saulo, porém, ficava cada vez mais forte e deixava confusos os judeus que moravam em Damasco, demonstrando que este é o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός significa “Ungido” e corresponde a “Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: ficava cada vez mais forte
  rationale: Expressa o desenvolvimento contínuo indicado pelo imperfeito e a intensificação de μᾶλλον, sem definir se a força vinha do próprio Saulo ou lhe era concedida por outro agente.
- source_word: συνέχυννεν
  choice: deixava confusos
  rationale: Preserva a ideia de lançar os ouvintes em confusão ou desorientação diante da argumentação, em português corrente e natural.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: os judeus que moravam em Damasco
  rationale: Identifica de modo claro e natural o grupo local a que o texto se refere, sem generalizar para todos os judeus.
- source_word: συμβιβάζων
  choice: demonstrando
  rationale: No contexto argumentativo, o particípio descreve Saulo reunindo elementos para sustentar uma conclusão; “demonstrando” comunica essa força probatória sem sugerir uma prova formal absoluta.
- source_word: οὗτός
  choice: este
  rationale: Mantém a força demonstrativa do grego, apontando especificamente para Jesus, em vez de reduzi-la a um simples pronome.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título judaico messiânico; “Messias” comunica ao leitor moderno a identificação de Jesus como o Ungido esperado.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: 'O artigo e o contexto mostram uso titular: Saulo demonstra que Jesus é o Ungido esperado. “Messias” preserva com clareza esse sentido judaico, enquanto a alternativa tradicional é registrada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficava cada vez mais forte” preserva a possível ambiguidade quanto à fonte do fortalecimento; “deixava confusos” mantém a força retórica sem acrescentar que os interlocutores ficaram necessariamente sem resposta.
