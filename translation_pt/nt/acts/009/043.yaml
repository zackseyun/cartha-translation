  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: pt
  text: E ficou muitos dias em Jope com certo Simão[a], um curtidor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na casa de certo Simão». A preposição grega pode indicar hospedagem na casa dessa pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: ficou
  rationale: A construção com ἐγένετο e infinitivo é idiomática; em português natural, o infinitivo funciona adequadamente como verbo principal, sem a formulação rígida «aconteceu que ficou».
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo narrativo leve. «E» mantém a continuidade sem sugerir contraste forte.
- source_word: ἡμέρας ἱκανὰς
  choice: muitos dias
  rationale: Com uma expressão temporal, ἱκανός indica quantidade ou duração considerável; «muitos dias» é claro e idiomático.
- source_word: ἐν Ἰόππῃ
  choice: em Jope
  rationale: «Jope» é a forma portuguesa tradicional e amplamente reconhecida do topônimo Ἰόππη.
- source_word: παρά τινι Σίμωνι
  choice: hospedado com certo Simão
  rationale: παρά com o dativo pode indicar permanência junto de alguém ou em sua casa. «Hospedado com» explicita naturalmente a ideia contextual de alojamento, enquanto «certo» preserva a indefinição de τινι.
- source_word: βυρσεῖ
  choice: um curtidor de couro
  rationale: βυρσεύς designa quem trata e prepara peles. «Curtidor de couro» é preciso e mais imediatamente compreensível para leitores modernos do que apenas «curtidor».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para evitar que «um curtidor de couro» pareça descrever Pedro, sem perder a concisão do grego.
