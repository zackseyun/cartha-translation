  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: pt
  text: 'E, caindo no chão, ele ouviu uma voz que lhe dizia: “Saulo, Saulo, por que você me persegue?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: caindo
  rationale: O particípio aoristo de πίπτω é mantido em forma participial natural em português, preservando o fluxo da frase sem precisar demais a relação temporal.
- source_word: ἐπὶ τὴν γῆν
  choice: no chão
  rationale: Expressão idiomática para o movimento e a posição resultante no solo; “chão” se ajusta melhor à cena imediata do que “terra”.
- source_word: ἤκουσεν φωνὴν
  choice: ele ouviu uma voz
  rationale: Como a voz profere palavras inteligíveis, φωνή significa aqui “voz”, não apenas “som”.
- source_word: λέγουσαν αὐτῷ
  choice: que lhe dizia
  rationale: Reproduz com naturalidade a construção participial grega e introduz a fala direta; o imperfeito em português acompanha a ação percebida enquanto ele ouvia.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Emprega a forma portuguesa tradicional do nome e preserva a repetição enfática do texto grego.
- source_word: τί
  choice: por que
  rationale: Neste uso adverbial interrogativo, τί pergunta pela razão da ação.
- source_word: με
  choice: me
  rationale: Mantém sem expansão o objeto direto, preservando a identificação expressa pelo próprio falante.
- source_word: διώκεις
  choice: você me persegue
  rationale: O presente expressa a ação em curso. “Perseguir” comunica adequadamente a hostilidade contra os seguidores de Jesus e é natural em português.
theological_decisions:
- issue: Identificação do falante com aqueles que Saulo ataca
  choice: Manter literalmente “me”, sem explicação adicional.
  alternative: Expandir para “meus seguidores” ou “meu povo”.
  rationale: O próprio versículo apresenta o falante como pessoalmente identificado com a comunidade perseguida. A tradução preserva essa força teológica e sua tensão sem inserir interpretação no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação “você me persegue” é corrente e evita a ambiguidade regional de “tu” quanto à concordância. Não são necessárias notas de rodapé neste versículo.
