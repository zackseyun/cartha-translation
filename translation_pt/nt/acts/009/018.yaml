  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: pt
  text: E imediatamente algo como escamas caiu dos olhos dele, e ele recuperou a visão; então se levantou e foi batizado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa de modo claro e natural a rapidez temporal indicada pelo advérbio.
- source_word: ἀπέπεσαν
  choice: caiu
  rationale: O verbo indica que algo caiu ou se desprendeu; o singular concorda naturalmente com a expressão portuguesa «algo como escamas».
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: dos olhos dele
  rationale: Formulação idiomática e inequívoca em português, preservando a ideia de afastamento a partir dos olhos.
- source_word: ὡς λεπίδες
  choice: algo como escamas
  rationale: Preserva tanto a imagem concreta de λεπίδες quanto o caráter comparativo de ὡς, sem afirmar que eram escamas literais.
- source_word: ἀνέβλεψεν
  choice: recuperou a visão
  rationale: No contexto da cura da cegueira, ἀναβλέπω significa voltar a enxergar, não simplesmente olhar para cima.
- source_word: ἀναστάς
  choice: levantando-se
  rationale: Mantém a relação participial e a sequência narrativa de modo natural e digno.
- source_word: ἐβαπτίσθη
  choice: foi batizado
  rationale: Reproduz o passivo grego com a terminologia portuguesa estabelecida, sem especificar uma modalidade batismal não declarada no versículo.
theological_decisions:
- issue: Tradução de βαπτίζω sem impor uma modalidade denominacional
  choice: foi batizado
  alternative: foi imerso
  rationale: O texto relata o batismo, mas não explicita neste versículo sua modalidade; «foi batizado» é lexicalmente fiel e teologicamente neutro.
- issue: Natureza do que caiu dos olhos de Saulo
  choice: algo como escamas
  alternative: escamas
  rationale: A partícula ὡς introduz uma comparação. A tradução conserva a aparência descrita sem transformar a figura em identificação material certa.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A colocação «dos olhos dele» evita a possível ambiguidade de «seus olhos».
