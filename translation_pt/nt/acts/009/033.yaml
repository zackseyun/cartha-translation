  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: pt
  text: E ali encontrou certo homem chamado Eneias, acamado havia oito anos[a], que era paralítico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
