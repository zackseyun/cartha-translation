lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Ali encontrou
  rationale: Expressa de modo natural a continuação narrativa e o advérbio de lugar. O valor leve de δέ fica adequadamente representado pela sequência do relato, sem exigir uma conjunção explícita em português.
- source_word: ἄνθρωπόν τινα
  choice: um homem
  rationale: Em português atual, “um homem” introduz naturalmente uma pessoa específica ainda não mencionada. “Certo homem” preservaria mais explicitamente τις, mas soaria menos espontâneo neste contexto.
- source_word: ὀνόματι Αἰνέαν
  choice: chamado Eneias
  rationale: É a forma idiomática de verter a construção dativa com ὀνόματι; o nome grego é transliterado na forma portuguesa consagrada.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: havia oito anos
  rationale: A expressão grega indica uma condição que se prolongava por oito anos; “havia oito anos” comunica essa duração de modo claro e natural.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: acamado
  rationale: Resume idiomaticamente a condição prolongada de estar deitado sobre uma cama simples, esteira ou maca. Como a formulação reduz a imagem concreta de κράβαττος, ela é preservada em nota.
- source_word: ὃς ἦν παραλελυμένος
  choice: que era paralítico
  rationale: Mantém a oração relativa e descreve claramente a condição contínua indicada pelo perfeito perifrástico grego, sem acrescentar causa ou diagnóstico mais específico.
