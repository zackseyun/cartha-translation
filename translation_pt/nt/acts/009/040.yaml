  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: pt
  text: 'Pedro, porém, mandou todos sair. Então, pôs-se de joelhos e orou. Depois, voltando-se para o corpo, disse: “Tabita, levante-se!”[a] Ela abriu os olhos e, ao ver Pedro, sentou-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “erga-se”. O imperativo grego pode expressar o ato de levantar-se ou erguer-se; “levante-se” preserva essa amplitude no contexto da restauração à vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: mandou todos sair
  rationale: Expressa de modo natural em português a retirada de todas as pessoas do recinto, sem atribuir ao gesto uma violência que o contexto não exige.
- source_word: θεὶς τὰ γόνατα
  choice: pôs-se de joelhos
  rationale: Equivalente idiomático atual para o gesto de ajoelhar-se, preservando sua ligação com a oração seguinte.
- source_word: προσηύξατο
  choice: orou
  rationale: Tradução direta e corrente de προσεύχομαι neste contexto.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: voltando-se para o corpo
  rationale: Mantém tanto o movimento físico quanto σῶμα, sem substituir o termo por uma designação mais interpretativa como “cadáver”.
- source_word: Ταβιθά
  choice: Tabita
  rationale: Transliteração ajustada à ortografia portuguesa corrente do nome aramaico representado no texto grego.
- source_word: ἀνάστηθι
  choice: levante-se
  rationale: Imperativo natural e digno em português, adequado tanto ao ato físico de erguer-se quanto ao contexto de restauração à vida, sem explicitar além do grego.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: abriu os olhos
  rationale: Reprodução direta e idiomática da expressão grega.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: ao ver Pedro
  rationale: Converte o particípio em construção temporal natural, preservando a sequência narrativa.
- source_word: ἀνεκάθισεν
  choice: sentou-se
  rationale: O verbo indica que ela passou da posição deitada à posição sentada; o contexto torna esse movimento claro sem exigir expansão.
- source_word: δὲ / καί
  choice: porém / então / depois / e
  rationale: Os conectores foram distribuídos segundo sua função narrativa em português, evitando repetição mecânica e preservando a progressão dos acontecimentos.
theological_decisions:
- issue: Linguagem do mandamento associado à restauração da vida
  choice: levante-se
  alternative: erga-se
  rationale: “Levante-se” preserva a amplitude de ἀνάστηθι e sua ressonância de restauração à vida, mas continua sendo uma ordem natural em português. A tradução não acrescenta uma formulação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação divide a longa sequência grega em frases naturais, sem alterar a ordem dos acontecimentos.
