source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: pt
  text: Barnabé, porém, tomou-o consigo e o levou aos apóstolos, e lhes contou como, no caminho, Saulo tinha visto o Senhor, que lhe havia falado, e como, em Damasco, tinha falado com coragem em nome de Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: tomou-o consigo
  rationale: Expressa a iniciativa concreta e solidária de Barnabé sem sugerir a força hostil que «agarrou-o» poderia transmitir em português.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: o levou aos apóstolos
  rationale: Forma natural em português para a ação de conduzir e apresentar Saulo aos apóstolos.
- source_word: διηγήσατο αὐτοῖς
  choice: lhes contou
  rationale: Traduz o ato de relatar os acontecimentos; as orações seguintes fornecem os detalhes do relato.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: como, no caminho
  rationale: Refere-se à viagem em que ocorreu o encontro, não ao movimento cristão chamado «o Caminho».
- source_word: εἶδεν τὸν κύριον
  choice: Saulo tinha visto o Senhor
  rationale: O nome «Saulo» explicita o sujeito implícito, evitando que a sequência de pronomes fique ambígua em português. O mais-que-perfeito composto situa o encontro antes do relato de Barnabé.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: que lhe havia falado
  rationale: Mantém o Senhor como sujeito mais natural do verbo no contexto e representa a anterioridade da fala em relação ao relato.
- source_word: ἐπαρρησιάσατο
  choice: tinha falado com coragem
  rationale: Comunica a ideia de falar livre e ousadamente sem restringir indevidamente o verbo a «pregar».
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: em nome de Jesus
  rationale: Preserva o conhecido idioma bíblico, incluindo suas associações com autoridade, representação e confissão.
theological_decisions:
- issue: Referente de «o Senhor» na experiência do caminho
  choice: «o Senhor» refere-se a Jesus
  alternative: Referência divina mais geral
  rationale: O contexto imediato identifica aquele que apareceu a Saulo como Jesus, e a conclusão «em nome de Jesus» reforça essa identificação. A tradução conserva o título «Senhor».
- issue: Sujeito de ἐλάλησεν em «que lhe havia falado»
  choice: o Senhor falou a Saulo
  alternative: Saulo falou ao Senhor
  rationale: O sujeito mais próximo e discursivamente contínuo é «o Senhor»; essa leitura também corresponde ao relato anterior da aparição. A redação portuguesa preserva essa relação sem acrescentar uma identificação doutrinária além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Tomou-o consigo» conserva a ação pessoal e acolhedora de Barnabé; «falado com coragem» soa mais natural que «falado ousadamente». A divisão em duas frases melhora a clareza sem alterar a estrutura informacional.
