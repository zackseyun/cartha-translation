  source_fidelity: 'O sentido do versículo está corretamente representado: o particípio ἐπιγνόντες retoma a informação anterior, οἱ ἀδελφοί é traduzido de forma literal, e as ações sucessivas de levar Paulo a Cesareia e enviá-lo a Tarso são preservadas. A expressão portuguesa “levaram-no para baixo, até Cesareia”, porém, é uma transferência excessivamente literal e pouco idiomática do componente direcional de κατήγαγον; o movimento descendente é inferível pelo itinerário e não precisa ser reproduzido com uma construção artificial.'
  naturalness: A redação revisada é mais fluida em português moderno. “Levaram-no a Cesareia” é natural, clara e mantém o deslocamento ao destino. A nota também é ajustada para que a alternativa lexical seja uma expressão nominal, não uma oração inteira deslocada.
