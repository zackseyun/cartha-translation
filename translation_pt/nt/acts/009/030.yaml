source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: pt
  text: Quando os irmãos souberam disso[a], levaram-no a Cesareia e o enviaram para Tarso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz literalmente “irmãos”, mas, neste contexto, o termo pode referir-se de modo mais amplo à comunidade dos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: souberam disso
  rationale: O particípio aoristo indica que eles tomaram conhecimento da situação mencionada no versículo anterior. Como o objeto está implícito no grego, “disso” o retoma naturalmente em português.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Reproduz diretamente o masculino plural do grego. No uso comunitário de Atos, o termo pode abranger os demais fiéis, nuance registrada em nota.
- source_word: κατήγαγον
  choice: levaram-no para baixo, até
  rationale: Preserva o elemento direcional de κατάγω, adequado ao deslocamento de Jerusalém em direção à costa, ao mesmo tempo que “até” introduz naturalmente o destino.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἐξαπέστειλαν
  choice: o enviaram
  rationale: Expressa com naturalidade o ato de fazê-lo partir para outro destino. Embora o composto possa sugerir envio para longe ou para fora, acrescentar “embora” ou “despacharam” seria estilisticamente mais marcado do que o contexto exige.
- source_word: Ταρσόν
  choice: Tarso
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
theological_decisions:
- issue: Abrangência de ἀδελφοί numa comunidade possivelmente mista
  choice: os irmãos
  alternative: os irmãos e as irmãs; os demais fiéis
  rationale: O texto principal mantém a forma masculina plural do original, sem decidir que apenas homens estejam em vista. A nota esclarece que, neste contexto, o termo pode designar de modo mais amplo a comunidade dos que creem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “levaram-no” mantém um tom bíblico moderadamente formal sem arcaísmo excessivo; “o enviaram” evita a repetição dessa construção e soa natural. A explicitação direcional “para baixo” conserva um traço significativo do verbo grego.
