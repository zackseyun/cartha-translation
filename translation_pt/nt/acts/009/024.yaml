id: ACT.9.24
reference: Acts 9:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: pt
  text: Mas a conspiração deles chegou ao conhecimento de Saulo. Eles também vigiavam os portões[a] dia e noite, a fim de matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os portões da cidade”. O grego diz apenas “os portões”; pelo contexto, entende-se que eram os portões da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: chegou ao conhecimento
  rationale: Preserva o sentido passivo de que Saulo tomou conhecimento da conspiração sem especificar quem o informou, em português natural.
- source_word: ἐπιβουλή
  choice: conspiração
  rationale: Expressa um plano hostil tramado contra alguém e se ajusta à intenção de matar explicitada no fim do versículo.
- source_word: παρετηροῦντο
  choice: vigiavam
  rationale: O imperfeito indica vigilância contínua; “vigiavam” comunica essa ação durativa sem transformar o verbo em mera guarda defensiva.
- source_word: πύλας
  choice: portões
  rationale: Refere-se, no contexto, aos portões da cidade de Damasco. A forma simples mantém a concisão do grego, e a nota explicita o referente contextual.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: dia e noite
  rationale: É a expressão portuguesa corrente para a vigilância contínua indicada pela locução grega.
- source_word: ὅπως
  choice: a fim de
  rationale: Introduz claramente a finalidade da vigilância.
- source_word: ἀνέλωσιν
  choice: matá-lo
  rationale: Neste contexto, ἀναιρέω significa matar ou eliminar; “matá-lo” transmite de modo direto a intenção homicida.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste narrativo entre a conspiração e o fato de ela ter chegado ao conhecimento de Saulo.
- source_word: καὶ
  choice: também
  rationale: Acrescenta à conspiração a ação adicional de vigiar os portões.
theological_decisions: []
