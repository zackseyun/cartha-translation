id: ACT.9.10
reference: Acts 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: pt
  text: 'Havia em Damasco um discípulo chamado Ananias. O Senhor lhe disse numa visão:


    — Ananias!


    Ele respondeu:


    — Aqui estou, Senhor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Havia
  rationale: O imperfeito de εἰμί introduz um novo participante, enquanto δέ assinala uma transição narrativa leve. “Havia” inicia a nova cena com naturalidade em português, sem acrescentar um advérbio temporal ausente do grego.
- source_word: τις μαθητὴς
  choice: um discípulo
  rationale: τις tem valor indefinido e apresenta uma pessoa ainda desconhecida; o artigo indefinido português transmite isso naturalmente, sem a ênfase algo artificial de “certo discípulo”.
- source_word: ἐν Δαμασκῷ
  choice: em Damasco
  rationale: Trata-se do uso locativo direto de ἐν com o dativo.
- source_word: ὀνόματι Ἁνανίας
  choice: chamado Ananias
  rationale: A expressão idiomática com ὀνόματι identifica o nome; “chamado Ananias” é conciso e corrente.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lhe disse
  rationale: A construção λέγω com πρός e acusativo indica fala dirigida a alguém. “Lhe disse” reproduz isso de modo claro e natural.
- source_word: ἐν ὁράματι
  choice: numa visão
  rationale: A expressão indica o contexto ou meio em que o Senhor falou. A contração “numa” é natural no português moderno e preserva o sentido.
- source_word: ὁ κύριος
  choice: O Senhor
  rationale: O substantivo articulado designa aqui o Senhor que fala a Ananias; a tradução tradicional e contextualmente adequada é “o Senhor”.
- source_word: Ἁνανία
  choice: Ananias
  rationale: Forma vocativa do nome próprio, vertida segundo a forma portuguesa consagrada.
- source_word: Ἰδοὺ ἐγώ
  choice: Aqui estou
  rationale: É uma resposta convencional que expressa presença, atenção e prontidão. “Aqui estou” comunica sua força idiomática melhor do que uma tradução literal de ἰδού.
- source_word: κύριε
  choice: Senhor
  rationale: Embora o vocativo possa significar “senhor” como tratamento respeitoso em outros contextos, aqui responde à manifestação do Senhor numa visão e conserva adequadamente o valor cristológico do contexto.
theological_decisions:
- issue: Referente de ὁ κύριος e κύριε na visão
  choice: Ambas as ocorrências são traduzidas por “Senhor”, referindo-se ao Jesus ressuscitado.
  alternative: Entender κύριε como um tratamento divino mais genérico ou, isoladamente, como “senhor”.
  rationale: No desenvolvimento de Atos 9, quem fala na visão é o Senhor que envia Ananias a Saulo. A tradução “Senhor” preserva a identificação contextual e a força cristológica sem inserir no versículo uma explicação que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala direta foi disposta em travessões. A exclamação no chamado “Ananias!” e a resposta “Aqui estou” refletem a vivacidade pragmática do diálogo sem alterar seu conteúdo.
