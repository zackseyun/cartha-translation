id: ACT.9.26
reference: Acts 9:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: pt
  text: Quando chegou a Jerusalém, tentava juntar-se aos discípulos[a], mas todos tinham medo dele, pois não acreditavam que fosse discípulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ligar-se aos discípulos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Quando chegou
  rationale: O particípio aoristo apresenta a chegada como circunstância anterior à ação principal; a oração temporal é natural em português e preserva essa relação.
- source_word: δὲ
  choice: Quando chegou
  rationale: A partícula é um conectivo narrativo leve. Em português, a progressão fica natural sem uma conjunção inicial explícita, evitando dar a δέ um contraste excessivo.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: Expressa movimento em direção à cidade; esta construção é idiomática e fiel ao sentido direcional.
- source_word: ἐπείραζεν
  choice: tentava
  rationale: O imperfeito retrata uma tentativa em andamento, sem exigir a ideia mais forte de repetição insistente.
- source_word: κολλᾶσθαι
  choice: juntar-se
  rationale: No contexto social, o verbo indica ligar-se ou associar-se estreitamente ao grupo. “Juntar-se” é claro e não sugere um rito formal de ingresso.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Refere-se ao grupo conhecido de discípulos em Jerusalém, sem necessidade de explicitação adicional.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: mas todos tinham medo dele
  rationale: Embora καί costume significar “e”, aqui a reação dos discípulos contrasta com a tentativa de Saulo; “mas” torna essa relação natural em português. O imperfeito é bem expresso por “tinham medo”.
- source_word: μὴ πιστεύοντες
  choice: pois não acreditavam
  rationale: O particípio negativo apresenta a razão do medo. A oração causal explícita comunica essa função com clareza em português.
- source_word: ὅτι ἐστὶν μαθητής
  choice: que fosse discípulo
  rationale: Depois de “não acreditavam”, o subjuntivo é a construção portuguesa natural. Não nega que Saulo fosse discípulo; representa a avaliação duvidosa dos demais.
- source_word: μαθητής
  choice: discípulo
  rationale: É o equivalente consolidado e preciso para um seguidor e aprendiz comprometido.
theological_decisions:
- issue: Natureza da relação que Saulo procurava estabelecer com os discípulos de Jerusalém
  choice: juntar-se aos discípulos
  alternative: ligar-se aos discípulos
  rationale: A formulação descreve a procura de aceitação e convivência com o grupo, sem importar noções posteriores de filiação institucional ou de rito eclesiástico.
- issue: Status de Saulo como discípulo
  choice: não acreditavam que fosse discípulo
  alternative: não acreditavam que ele era discípulo
  rationale: O subjuntivo português expressa a perspectiva incrédula dos discípulos sem resolver ou enfraquecer a afirmação narrativa de que Saulo de fato havia se tornado discípulo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação do marcador após “discípulos” vincula corretamente a nota à tradução de κολλᾶσθαι; o marcador fornecido após “Jerusalém” na camada inglesa não correspondia ao conteúdo da nota.
