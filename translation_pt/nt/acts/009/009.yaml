lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: ficou três dias
  rationale: O acusativo indica extensão de tempo. “Ficou três dias” é natural em português e representa ἦν sem acrescentar uma ideia mais forte do que o texto expressa.
- source_word: μὴ βλέπων
  choice: sem ver
  rationale: A expressão participial significa literalmente “não vendo”. “Sem ver” é idiomático, preserva a forma verbal do grego e não substitui a expressão pelo adjetivo mais interpretativo “cego”.
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: não comeu nem bebeu
  rationale: A coordenação negativa é vertida naturalmente em português por “não... nem...”, mantendo os dois verbos simples do original.
