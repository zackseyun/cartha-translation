  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: pt
  text: E ficou três dias sem ver[a]; não comeu nem bebeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não vendo”. A expressão indica que Saulo não conseguia enxergar.
