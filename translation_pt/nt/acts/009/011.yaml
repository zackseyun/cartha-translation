id: ACT.9.11
reference: Acts 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: pt
  text: 'E o Senhor lhe disse: “Levante-se e vá à rua chamada Direita e, na casa de Judas, procure um homem chamado Saulo, natural de Tarso[a], pois eis que ele está orando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saulo de Tarso”. O adjetivo grego Ταρσέα identifica Saulo por sua origem em Tarso.'
    reason: alternativa lexical
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título grego usual no Novo Testamento sem explicitar no versículo a identidade do interlocutor além do que o texto diz.
- source_word: Ἀναστὰς πορεύθητι
  choice: Levante-se e vá
  rationale: O particípio aoristo ligado ao imperativo expressa o início imediato da ação; esta formulação é natural e direta em português moderno.
- source_word: ῥύμην
  choice: rua
  rationale: Designa uma via dentro da cidade; “rua” é o equivalente corrente e claro.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: chamada Direita
  rationale: Mantém a construção de nomeação e o nome tradicionalmente reconhecível da rua, correspondente ao sentido de “reta”.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: Na casa de Judas
  rationale: Expressa naturalmente o local em que Ananias deveria procurar Saulo.
- source_word: ζήτησον
  choice: procure
  rationale: Comunica a ordem de buscar ou perguntar por alguém, sem pressupor antecipadamente que ele já foi encontrado.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: um homem chamado Saulo, natural de Tarso
  rationale: Torna explícita em português a identificação pelo nome e traduz o adjetivo geográfico Ταρσέα como indicação de origem.
- source_word: ἰδοὺ γὰρ
  choice: pois
  rationale: Preserva claramente a função explicativa de γάρ; o valor de chamada de atenção de ἰδού fica implícito para evitar uma expressão artificial no português corrente.
- source_word: προσεύχεται
  choice: ele está orando
  rationale: O presente indica a atividade em andamento naquele momento.
theological_decisions:
- issue: Referente de κύριος
  choice: o Senhor
  alternative: o Senhor Jesus
  rationale: Embora o contexto identifique o Senhor como Jesus, o versículo emprega apenas κύριος; a tradução não acrescenta a identificação nesta oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levante-se” e “procure” mantêm a força dos imperativos sem arcaísmo. A divisão em duas frases dentro da fala favorece a clareza sem alterar as relações sintáticas do grego.
