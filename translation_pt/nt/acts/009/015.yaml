id: ACT.9.15
reference: Acts 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: pt
  text: 'Mas o Senhor lhe disse: “Vá, porque este homem é meu instrumento escolhido para levar o meu nome diante dos gentios[a], dos reis e dos filhos de Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das nações”.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de Israel” é uma expressão bíblica tradicional que designa o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título usual e, neste contexto narrativo, refere-se a Jesus ressuscitado falando com autoridade divina.
- source_word: Πορεύου
  choice: Vá
  rationale: Imperativo natural e direto em português, preservando a força da ordem.
- source_word: σκεῦος ἐκλογῆς
  choice: instrumento escolhido
  rationale: 'Embora σκεῦος possa significar literalmente “vaso” ou “recipiente”, aqui a imagem é metafórica: alguém escolhido como meio para uma missão. “Instrumento escolhido” comunica isso com clareza sem impor uma formulação teológica posterior.'
- source_word: ἐστίν μοι
  choice: é para mim
  rationale: Preserva a relação pessoal expressa pelo dativo μοι e a reivindicação do Senhor sobre o instrumento escolhido.
- source_word: τοῦ βαστάσαι
  choice: para levar
  rationale: Expressa naturalmente a finalidade do infinitivo articular e conserva a ideia de portar o nome em missão.
- source_word: τὸ ὄνομά μου
  choice: o meu nome
  rationale: Mantém literalmente a linguagem bíblica do nome, com suas conotações de autoridade, representação e confissão pública.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente direto e natural que se ajusta ao contexto de testemunho público.
- source_word: ἐθνῶν
  choice: gentios
  rationale: No contraste com os filhos de Israel, designa mais naturalmente os povos não judeus. A alternativa mais literal, “nações”, é registrada em nota.
- source_word: βασιλέων
  choice: reis
  rationale: Tradução literal, clara e adequada; não há razão contextual para generalizar como “governantes”.
- source_word: υἱῶν Ἰσραήλ
  choice: filhos de Israel
  rationale: Preserva a expressão familiar masculina tradicional do texto bíblico, enquanto a nota esclarece seu sentido coletivo.
- source_word: τε ... καὶ ... τε
  choice: dos gentios, dos reis e dos filhos de Israel
  rationale: A coordenação tripla é expressa de maneira idiomática em português sem reproduzir mecanicamente todas as partículas gregas.
theological_decisions:
- issue: Possível leitura doutrinária excessiva de ἐκλογῆς (“escolha/eleição”)
  choice: instrumento escolhido
  alternative: vaso de eleição
  rationale: O versículo afirma claramente a escolha divina de Paulo para uma missão, mas não exige que a tradução introduza terminologia associada a sistemas teológicos posteriores. A formulação conserva a afirmação do texto e sua finalidade missionária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta foi mantida, e as expressões bíblicas “meu nome” e “filhos de Israel” foram preservadas sem arcaísmo desnecessário.
