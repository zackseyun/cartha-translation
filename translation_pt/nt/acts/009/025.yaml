  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: pt
  text: Mas, durante a noite, seus discípulos o baixaram através da muralha num cesto grande[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por uma abertura na muralha». O grego diz literalmente «através da muralha», provavelmente em referência a uma abertura ou janela na muralha da cidade.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega duas expressões relacionadas a baixar ou descer, numa construção vívida que enfatiza o modo da fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: pegaram
  rationale: O particípio aoristo introduz a ação dos discípulos de tomar Saulo consigo para possibilitar a fuga. «Pegaram» é natural e concreto em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação à conspiração anterior.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os discípulos dele
  rationale: Representa tanto μαθηταί quanto o possessivo αὐτοῦ, preservando a surpreendente referência aos discípulos ligados a Saulo sem a suavizar para «os discípulos».
- source_word: νυκτός
  choice: durante a noite
  rationale: Expressa naturalmente o genitivo temporal e mantém explícito que a ação ocorreu à noite.
- source_word: διὰ τοῦ τείχους
  choice: pela muralha
  rationale: διά com genitivo indica passagem através da muralha. «Pela muralha» é idiomático em português e não acrescenta ao texto principal uma abertura ou janela não explicitada no grego.
- source_word: καθῆκαν αὐτόν
  choice: o desceram
  rationale: καθίημι significa aqui baixar ou fazer descer alguém de uma altura.
- source_word: χαλάσαντες
  choice: o desceram
  rationale: O particípio χαλάσαντες especifica o modo da descida e se sobrepõe semanticamente a καθῆκαν. A tradução principal evita uma repetição pouco natural, enquanto a nota registra a construção vívida do grego.
- source_word: ἐν σπυρίδι
  choice: num cesto grande
  rationale: σπυρίς designa um cesto, com frequência grande; o tamanho também é coerente com o transporte de uma pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Os discípulos dele» preserva o possessivo do texto crítico; «pela muralha» mantém a concisão e a ambiguidade concreta do original. As duas marcas de nota aparecem no texto principal.
