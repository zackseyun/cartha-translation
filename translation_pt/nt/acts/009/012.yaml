  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: pt
  text: e viu, numa visão, um homem chamado Ananias entrar e impor-lhe as mãos, para que recuperasse a vista.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltasse a ver”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito em português. O contexto já deixa clara a relevância presente da visão, sem necessidade de alterar o valor temporal do verbo.
- source_word: ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι
  choice: numa visão, um homem chamado Ananias
  rationale: A formulação identifica de modo claro e natural o homem visto e preserva a visão como o âmbito da experiência.
- source_word: εἰσελθόντα
  choice: entrar
  rationale: Depois de “viu”, o infinitivo português expressa com naturalidade a ação do particípio acusativo, sem impor uma sequência temporal mais precisa do que o grego.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: impor-lhe as mãos
  rationale: Preserva a expressão bíblica reconhecível e o ato físico indicado pelo grego, com redação corrente e digna em português.
- source_word: ὅπως ἀναβλέψῃ
  choice: para que recuperasse a vista
  rationale: ὅπως introduz a finalidade, e ἀναβλέπω, neste contexto de cegueira, significa recuperar a capacidade de ver.
theological_decisions:
- issue: Significado teológico da imposição das mãos
  choice: impor-lhe as mãos
  alternative: colocar as mãos sobre ele
  rationale: O texto relata o gesto sem definir aqui se ele tem sentido sacramental, carismático ou institucional. A tradução mantém a expressão bíblica sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Numa” e a construção com infinitivos tornam a frase natural; “impor-lhe as mãos” conserva o conhecido idioma bíblico sem explicar além do texto.
