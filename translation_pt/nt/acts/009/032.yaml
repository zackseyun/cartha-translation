id: ACT.9.32
reference: Acts 9:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: pt
  text: Enquanto Pedro passava por todos eles, desceu também até os santos que moravam em Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: percorria toda a região
  rationale: O grego diz literalmente «passando por todos», mas o referente masculino plural fica implícito. No contexto das comunidades mencionadas em Atos 9:31, a expressão indica o percurso de Pedro por toda a região; esta formulação natural preserva o alcance sem sugerir que ele atravessava pessoas.
- source_word: κατελθεῖν καὶ πρὸς
  choice: desceu também para visitar
  rationale: «Desceu» mantém o verbo de movimento κατέρχομαι; «para visitar» expressa naturalmente o movimento em direção às pessoas indicado por πρὸς, sem acrescentar um propósito alheio ao contexto.
- source_word: τοὺς ἁγίους
  choice: os santos
  rationale: Mantém o termo comunitário cristão e sua dimensão teológica, em vez de substituí-lo por uma paráfrase como «os cristãos».
- source_word: Λύδδα
  choice: Lida
  rationale: Forma portuguesa tradicional e reconhecível do topônimo.
theological_decisions:
- issue: Sentido de «os santos»
  choice: os santos
  alternative: os discípulos / os cristãos
  rationale: A tradução conserva a designação usada pelo texto para os integrantes da comunidade cristã, sem redefini-la segundo uma tradição denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção narrativa evita reproduzir mecanicamente o idiomatismo Ἐγένετο δὲ, que aqui introduz o acontecimento, e mantém a progressão do relato.
