  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: pt
  text: 'Mas Ananias respondeu: “Senhor, ouvi de muitos a respeito deste homem e de todo o mal que ele fez aos teus santos em Jerusalém.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Mas Ananias respondeu
  rationale: δέ introduz aqui uma reação hesitante em contraste com a ordem recebida; “mas” expressa naturalmente essa leve força adversativa, e “respondeu” traduz ἀπεκρίθη.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma portuguesa normal de tratamento direto a Jesus e preserva tanto o respeito quanto o peso teológico do contexto.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: ouvi de muitos
  rationale: O pretérito perfeito é idiomático em português para informação recebida anteriormente e ainda relevante; “de muitos” mantém a concisão e a indefinição do grego.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: a respeito deste homem
  rationale: Reproduz com clareza περί com genitivo e mantém a força demonstrativa de τούτου.
- source_word: ὅσα κακὰ
  choice: todo o mal
  rationale: Expressa de modo natural em português a extensão dos atos maus sem reduzir κακά apenas a dano sofrido nem criar uma enumeração artificial.
- source_word: τοῖς ἁγίοις σου
  choice: aos teus santos
  rationale: “Santos” preserva o termo neotestamentário para os que pertencem a Deus; “teus” conserva explicitamente o possessivo.
- source_word: ἐποίησεν
  choice: ele fez
  rationale: “Fez” é o equivalente amplo e direto de ποιέω e se combina naturalmente com “todo o mal”.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Tradução locativa direta e convencional.
theological_decisions:
- issue: Referente e força de Κύριε no tratamento de Ananias
  choice: Tratamento direto a Jesus como “Senhor”
  alternative: “Mestre” ou um tratamento meramente respeitoso
  rationale: No contexto imediato, Ananias responde ao Jesus ressuscitado numa visão. “Senhor” é adequado ao contexto narrativo e preserva sua relevância teológica sem acrescentar explicações ao versículo.
- issue: Sentido de τοῖς ἁγίοις σου
  choice: “aos teus santos” como designação dos fiéis pertencentes ao Senhor
  alternative: “aos teus consagrados” ou “ao teu povo”
  rationale: “Santos” mantém a terminologia do texto e a relação expressa por “teus”, sem substituir o termo por uma interpretação mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar uma construção pesada, mas todas as relações semânticas do grego foram preservadas. Não há nota textual ou lexical indispensável neste versículo.
