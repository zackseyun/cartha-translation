id: ACT.9.23
reference: Acts 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: pt
  text: Quando já haviam passado muitos dias[b], os judeus[a] conspiraram[c] para matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “os judeus”; neste contexto, a expressão se refere a um grupo específico que se opunha a Saulo, não a todos os judeus sem exceção.
    reason: cultural_note
  - marker: b
    text: 'Ou: “já se haviam cumprido muitos dias” ou “muitos dias haviam se completado”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “planejaram juntos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quando
  rationale: Introduz uma transição temporal; em português corrente, “Quando” expressa naturalmente a relação sem tornar δέ de modo desnecessário.
- source_word: ἐπληροῦντο
  choice: já haviam passado
  rationale: Com “dias” como sujeito, o imperfeito passivo de πληρόω é uma expressão temporal que indica o transcurso ou cumprimento de um período. “Já haviam passado” é natural no contexto narrativo.
- source_word: ἡμέραι ἱκαναί
  choice: muitos dias
  rationale: Aqui ἱκαναί indica uma quantidade considerável, não apenas suficiente; “muitos dias” é claro e idiomático.
- source_word: συνεβουλεύσαντο
  choice: conspiraram
  rationale: O verbo denota deliberação conjunta e, neste contexto, intenção hostil. “Conspiraram” comunica com concisão o planejamento coletivo para matar Saulo.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Preserva a designação explícita do grego sem restringi-la, sem fundamento textual, a líderes ou a judeus da Judeia. Uma nota esclarece o alcance contextual.
- source_word: ἀνελεῖν
  choice: para matá-lo
  rationale: ἀναιρέω significa aqui tirar a vida. “Matar” é direto e não acrescenta uma qualificação jurídica ausente do verbo.
- source_word: αὐτόν
  choice: -lo
  rationale: Pronome acusativo que retoma Saulo no contexto; a forma enclítica é natural depois do infinitivo “matar”.
theological_decisions:
- issue: Sentido de οἱ Ἰουδαῖοι em uma narrativa de oposição
  choice: os judeus
  alternative: os judeus da Judeia; os líderes judeus
  rationale: A tradução mantém a formulação do texto grego e não identifica o grupo mais especificamente do que o versículo permite. A nota impede uma generalização indevida para todo o povo judeu.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça imediatamente junto à expressão correspondente.
