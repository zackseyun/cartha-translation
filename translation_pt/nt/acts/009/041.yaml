source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: pt
  text: Dando-lhe a mão, levantou-a[a]. Em seguida, chamou os santos e as viúvas e a apresentou viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajudou-a a se levantar” ou “fez que ela ficasse em pé”. O verbo grego pode indicar fazer alguém se levantar ou ficar em pé e, neste contexto, também tem ressonância de linguagem de ressurreição.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: dando-lhe a mão
  rationale: Reproduz de modo natural em português o gesto de estender a mão para auxiliar alguém, mantendo-se próximo da construção grega.
- source_word: ἀνέστησεν
  choice: levantou-a
  rationale: Preserva tanto o sentido imediato de fazê-la erguer-se quanto a ressonância, no contexto, da linguagem de ressurreição, sem tornar explícito mais do que o verbo afirma.
- source_word: φωνήσας
  choice: chamou
  rationale: Expressa naturalmente a convocação dos grupos e, na sequência narrativa, a ação anterior a apresentá-la.
- source_word: τοὺς ἁγίους
  choice: os santos
  rationale: É a designação neotestamentária direta para o povo consagrado a Deus; evita substituir o termo por uma interpretação como “os que criam”.
- source_word: τὰς χήρας
  choice: as viúvas
  rationale: Tradução lexical direta que preserva a menção distinta ao grupo destacado no contexto anterior.
- source_word: παρέστησεν
  choice: apresentou
  rationale: Comunica que Pedro a colocou diante dos santos e das viúvas, sem enfraquecer a ação para meramente “mostrou”.
- source_word: ζῶσαν
  choice: viva
  rationale: 'O particípio tem função predicativa: Pedro a apresentou na condição de viva. “Viva” é idiomático e enfático neste contexto.'
theological_decisions:
- issue: Ressonância de ressurreição em ἀνέστησεν
  choice: levantou-a
  alternative: ajudou-a a se levantar; fez que ela ficasse em pé
  rationale: “Levantou-a” abrange a ação física imediata e conserva a possível ressonância de restauração à vida no contexto, sem identificar de maneira indevida o gesto de Pedro como a própria ação anterior de ressuscitá-la.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa fluente e compreensível tanto no Brasil quanto em outros contextos lusófonos. A repetição de conectores foi suavizada sem alterar a sequência das ações.
