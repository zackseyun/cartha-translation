source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: pt
  text: Ele falava e debatia com os helenistas[a], mas eles tentavam matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os judeus de língua grega”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: falava
  rationale: O imperfeito indica ação contínua ou repetida na narrativa; “falava” preserva esse aspecto com naturalidade.
- source_word: τε καὶ
  choice: e
  rationale: Liga os dois verbos coordenados; a conjunção simples é natural em português e transmite adequadamente a conexão.
- source_word: συνεζήτει
  choice: debatia
  rationale: O verbo indica discussão ativa ou controvérsia, não mera conversa; “debatia” convém ao contexto de oposição.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: com os helenistas
  rationale: Com verbo de discussão, πρός expressa interação entre pessoas; “com” é a regência idiomática em português.
- source_word: Ἑλληνιστάς
  choice: helenistas
  rationale: A transliteração preserva a designação sociolinguística específica usada em Atos; a nota explica que se trata dos judeus de língua grega.
- source_word: οἱ δὲ
  choice: mas eles
  rationale: δέ introduz o contraste entre a atividade de Saulo e a reação hostil do grupo.
- source_word: ἐπεχείρουν
  choice: tentavam
  rationale: O imperfeito sugere esforço continuado ou repetido; “tentavam” preserva esse valor aspectual em português corrente.
- source_word: ἀνελεῖν αὐτόν
  choice: matá-lo
  rationale: Neste contexto, ἀναιρέω significa matar ou tirar a vida; “matá-lo” é claro, direto e fiel.
theological_decisions:
- issue: Identidade dos Ἑλληνισταί
  choice: “Helenistas” designa o grupo judaico de língua grega em Jerusalém.
  alternative: Gregos ou pessoas de língua grega em sentido amplo, incluindo gentios.
  rationale: Em Atos, o termo funciona como designação sociolinguística reconhecível, especialmente em Atos 6:1. A tradução preserva o termo e a nota esclarece sua referência sem sugerir que Saulo debatia aqui com gentios em geral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os imperfeitos “falava”, “debatia” e “tentavam” preservam o caráter contínuo ou repetido das ações. “Helenistas” mantém o termo específico, explicado em nota.
