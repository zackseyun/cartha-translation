  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: pt
  text: e lhe pediu cartas para as sinagogas de Damasco, a fim de que, se encontrasse alguns que pertencessem ao Caminho[a], tanto homens como mulheres, os levasse amarrados para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fossem do Caminho” ou “fossem seguidores do Caminho”. O grego emprega uma antiga designação do movimento cristão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: lhe pediu
  rationale: O verbo no aoristo médio, com παρά + genitivo, indica pedir algo a alguém. “Lhe pediu cartas” é natural em português e preserva a relação com a pessoa mencionada no contexto.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: O substantivo significa diretamente “cartas”. Embora o contexto sugira que conferiam autorização, essa informação não é acrescentada ao texto.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: para as sinagogas de Damasco
  rationale: A formulação comunica de modo claro e idiomático que as cartas se destinavam às sinagogas situadas em Damasco.
- source_word: ὅπως ἐάν
  choice: a fim de que, se
  rationale: “A fim de que” preserva a finalidade introduzida por ὅπως, enquanto “se” mantém a contingência expressa por ἐάν com o subjuntivo.
- source_word: τινας τῆς ὁδοῦ ὄντας
  choice: alguns que pertencessem ao Caminho
  rationale: Em uma oração condicional, “alguns que” expressa naturalmente pessoas indefinidas; “pertencessem ao Caminho” preserva a relação genitiva e o título histórico do movimento.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: homens ou mulheres
  rationale: No contexto de quaisquer pessoas que fossem encontradas, “homens ou mulheres” inclui explicitamente ambos os grupos e soa mais natural em português do que uma construção com “tanto... como” dentro da oração condicional.
- source_word: δεδεμένους
  choice: presos
  rationale: O particípio perfeito passivo descreve pessoas mantidas sob restrição. “Presos” comunica naturalmente a captura e condução sob custódia, sem especificar correntes.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: os levasse para Jerusalém
  rationale: O subjuntivo integra a oração de finalidade, e “levasse para Jerusalém” é a forma idiomática em português para o deslocamento ao destino indicado.
theological_decisions:
- issue: Tradução de τῆς ὁδοῦ
  choice: ao Caminho
  alternative: aos seguidores do Caminho
  rationale: “O Caminho” preserva a antiga designação do movimento cristão sem substituí-la por uma paráfrase interpretativa. A inicial maiúscula sinaliza seu uso como título.
- issue: Menção explícita de ἄνδρας τε καὶ γυναῖκας
  choice: homens ou mulheres
  alternative: pessoas
  rationale: A tradução conserva a referência expressa aos dois sexos e, assim, a amplitude da perseguição pretendida por Saulo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “A fim de que” mantém um tom narrativo formal sem arcaísmo; “ao Caminho” conserva a expressão histórica e sua ambiguidade controlada.
