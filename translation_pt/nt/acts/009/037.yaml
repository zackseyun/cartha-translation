  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: pt
  text: Naqueles dias, aconteceu que ela adoeceu e morreu. Depois de a lavarem, colocaram-na num cômodo no andar de cima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num aposento superior”. O grego se refere simplesmente a um cômodo no andar de cima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: aconteceu que
  rationale: A fórmula narrativa introduz o acontecimento de modo natural em português; δέ funciona como conexão leve e não exige uma palavra separada.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Expressão temporal corrente, clara e próxima do grego.
- source_word: ἀσθενήσασαν
  choice: adoeceu
  rationale: O particípio aoristo indica que ela ficou doente antes de morrer; a forma finita é natural em português.
- source_word: ἀποθανεῖν
  choice: morreu
  rationale: O infinitivo dependente de ἐγένετο é vertido naturalmente por verbo finito, preservando o sentido e a sequência.
- source_word: λούσαντες
  choice: depois de a lavarem
  rationale: Expressa com clareza a anterioridade do particípio aoristo sem acrescentar explicitamente “o corpo”, embora o contexto seja posterior à morte.
- source_word: ἔθηκαν αὐτὴν
  choice: colocaram-na
  rationale: τίθημι significa pôr ou colocar; esta escolha é natural e mantém o pronome feminino do texto.
- source_word: ἐν ὑπερῴῳ
  choice: num cômodo no andar de cima
  rationale: ὑπερῷον designa um aposento situado no piso superior. A formulação moderna evita sugerir um recinto específico já conhecido.
theological_decisions:
- issue: Se ὑπερῴῳ deve ser traduzido pela expressão tradicional “cenáculo” ou por uma descrição espacial genérica
  choice: num cômodo no andar de cima
  alternative: num aposento superior; num cenáculo
  rationale: O substantivo grego, aqui sem artigo, indica simplesmente um cômodo no piso superior. “Cenáculo” pode soar técnico ou sugerir indevidamente um lugar específico ligado a outro episódio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a referência pronominal feminina no ritual posterior à morte, sem explicitar “corpo”, palavra não presente no grego.
