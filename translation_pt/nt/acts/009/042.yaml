source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: pt
  text: Isso se tornou conhecido em toda a cidade de Jope, e muitos creram no Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: isso se tornou conhecido
  rationale: A construção impessoal expressa que o acontecimento anterior passou a ser conhecido, sem especificar quem o divulgou. O pronome “isso” retoma naturalmente o episódio narrado.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ é um conectivo leve que dá continuidade à narrativa; “e” é natural e não introduz contraste indevido.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: em toda a cidade de Jope
  rationale: κατά com o genitivo tem sentido distributivo, e ὅλης reforça a abrangência. A explicitação de “cidade” torna a referência geográfica natural em português sem alterar o sentido.
- source_word: Ἰόππης
  choice: Jope
  rationale: “Jope” é a forma tradicional e amplamente reconhecida em português para a cidade do Novo Testamento.
- source_word: ἐπίστευσαν πολλοὶ
  choice: muitos creram
  rationale: A formulação concisa reproduz o adjetivo substantivado πολλοί e o aoristo de πιστεύω, apresentando o ato de passar a crer no curso da narrativa.
- source_word: ἐπὶ τὸν κύριον
  choice: no Senhor
  rationale: Com πιστεύω, ἐπί seguido do acusativo indica aquele em quem se deposita fé ou confiança. “Crer no Senhor” é a expressão idiomática correspondente em português.
- source_word: κύριον
  choice: Senhor
  rationale: “Senhor” preserva tanto o valor de título quanto o peso cristológico do termo no contexto de Atos.
theological_decisions:
- issue: Tradução de πιστεύω + ἐπὶ τὸν κύριον
  choice: creram no Senhor
  alternative: depositaram sua fé no Senhor
  rationale: “Creram no Senhor” preserva de modo direto a ideia de fé ou confiança pessoal sem acrescentar uma formulação doutrinária mais específica do que o texto.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” mantém o título empregado para Jesus e sua relevância cristológica; “Mestre” reduziria a amplitude semântica neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem narrativa e a abrangência de “toda” foram preservadas; não são necessárias notas de rodapé.
