  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: pt
  text: E imediatamente, nas sinagogas, começou a proclamar[a] Jesus, dizendo que ele é o Filho de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «passou a proclamar Jesus» ou «pregava Jesus». O verbo grego indica proclamação pública.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Filho de Deus». O grego traz literalmente «o Filho de Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa de modo claro e digno a prontidão indicada pelo advérbio, preservando a força narrativa.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nas sinagogas
  rationale: Mantém o sentido locativo e o plural do grego em português natural.
- source_word: ἐκήρυσσεν
  choice: começou a proclamar
  rationale: κηρύσσω indica anúncio público. A formulação preserva esse sentido e, no contexto narrativo após «imediatamente», comunica naturalmente o início da atividade, sem reduzi-la a um único ato.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Mantém Jesus como objeto direto de «proclamar», preservando a expressão compacta e cristocêntrica do grego sem acrescentar «a respeito de».
- source_word: ὅτι
  choice: dizendo que
  rationale: Introduz em português natural o conteúdo da proclamação; «dizendo» é uma explicitação mínima da relação de conteúdo.
- source_word: οὗτός
  choice: ele
  rationale: O pronome retoma Jesus com clareza e naturalidade. Embora οὗτός tenha força demonstrativa, «este» poderia soar artificial ou ambíguo neste contexto em português.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Tradução direta e tradicional da expressão titular, preservando seu peso cristológico e a construção definida do grego.
theological_decisions:
- issue: Título cristológico na proclamação de Saulo
  choice: o Filho de Deus
  alternative: o Filho de Deus / Filho de Deus
  rationale: A tradução conserva explicitamente a afirmação cristológica do texto, sem ampliá-la nem reduzi-la.
- issue: Força demonstrativa de οὗτός
  choice: ele
  alternative: este é
  rationale: «Ele» identifica naturalmente Jesus como referente em português. A alternativa «este é» preserva mais visivelmente o demonstrativo, mas tende a soar menos natural fora de uma fala direta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Proclamar» conserva o caráter público do verbo sem restringi-lo ao sentido eclesiástico moderno de «pregar». A ordem foi ajustada para fluência em português, mantendo todos os elementos do grego.
