source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: pt
  text: Todos os que moravam em Lida e em Sarom[a] o viram e se voltaram para o Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na planície de Sarom”.'
    reason: lexical_alternative
  - marker: b
    text: “Voltaram-se para o Senhor” também pode ser entendido como “retornaram para o Senhor” ou, de modo mais interpretativo, “converteram-se ao Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: viram
  rationale: 'O aoristo de ὁράω indica aqui percepção visual simples: os moradores viram Eneias depois de sua cura.'
- source_word: πάντες οἱ κατοικοῦντες
  choice: Todos os que moravam
  rationale: O particípio substantivado designa os residentes; esta formulação é natural em português e preserva o sentido abrangente de πάντες.
- source_word: Λύδδα
  choice: Lida
  rationale: Forma tradicional e corrente em português para o topônimo grego Λύδδα.
- source_word: τὸν Σαρῶνα
  choice: Sarom
  rationale: Forma portuguesa tradicional do nome da região. O artigo grego não precisa ser reproduzido, mas a possibilidade de referência à planície é registrada em nota.
- source_word: οἵτινες
  choice: e
  rationale: A coordenação comunica com naturalidade a progressão narrativa e evita uma oração relativa pesada, sem alterar o referente coletivo.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: se voltaram para o Senhor
  rationale: Preserva a imagem verbal de mudança de direção e sua conotação de fé e arrependimento sem impor o sentido de retorno prévio nem terminologia teológica mais interpretativa.
- source_word: κύριον
  choice: Senhor
  rationale: Equivalente português normal de κύριος como título; mantém a formulação do grego sem acrescentar explicitamente 'Jesus'.
theological_decisions:
- issue: Referente de «o Senhor»
  choice: o Senhor
  alternative: o Senhor Jesus
  rationale: O contexto aponta fortemente para Jesus, mas o texto grego contém apenas τὸν κύριον; a tradução preserva essa forma e sua referência contextual.
- issue: Força de ἐπέστρεψαν
  choice: se voltaram para
  alternative: se converteram a; retornaram para
  rationale: «Se voltaram» conserva tanto a imagem quanto a amplitude do verbo, sem pressupor que antes pertenciam ao Senhor nem substituir a expressão por um termo teológico mais técnico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega «moravam» em vez de «habitavam» para maior naturalidade, mantém o título «Senhor» e conserva a expressão bíblica «se voltaram para».
