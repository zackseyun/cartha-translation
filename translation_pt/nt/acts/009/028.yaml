  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: pt
  text: E ele estava com eles em Jerusalém, entrando e saindo, e falava com ousadia em nome do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: estava com eles
  rationale: Preserva o sentido durativo do imperfeito e a ideia simples de convivência, sem acrescentar a noção mais forte de residência.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: entrando e saindo
  rationale: Reproduz de modo natural o par idiomático, que descreve circulação habitual e convivência aberta.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Neste contexto, a preposição indica a esfera em que ele circulava; a tradução locativa evita sugerir repetidas entradas na cidade.
- source_word: παρρησιαζόμενος
  choice: falava com ousadia
  rationale: Expressa a fala franca, pública e destemida indicada pelo verbo, em linguagem portuguesa corrente.
- source_word: ἐν τῷ ὀνόματι
  choice: em nome de
  rationale: Mantém o idioma bíblico e preserva suas possíveis nuances de autoridade, representação e confissão.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Traduz o título κύριος sem substituí-lo pelo nome do referente, preservando a formulação grega.
theological_decisions:
- issue: Referente de «Senhor»
  choice: Manter «Senhor» como título no texto principal
  alternative: Explicitar «Jesus»
  rationale: Embora o contexto aponte para Jesus, o grego traz κυρίου, não Ἰησοῦ; manter o título evita resolver no texto o que a forma original deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «entrando e saindo» conserva o idioma do original sem soar excessivamente técnica.
