  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: pt
  text: Os homens que viajavam com ele permaneceram de pé, sem conseguir falar, ouvindo a voz[a], mas sem ver ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som”. A palavra grega pode significar tanto “voz” quanto “som”; compare Atos 22:9.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Os homens
  rationale: O sintagma significa diretamente “os homens”. A partícula δέ faz uma transição leve; em português, a progressão narrativa é natural sem acrescentar uma conjunção explícita.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: que viajavam com ele
  rationale: συνοδεύω descreve acompanhar alguém numa viagem; a formulação é clara e natural em português moderno.
- source_word: εἱστήκεισαν
  choice: ficaram parados
  rationale: O mais-que-perfeito de ἵστημι tem aqui força estativa. “Ficaram parados” comunica a posição em que os companheiros permaneceram, sem inferir além do texto.
- source_word: ἐνεοί
  choice: sem conseguir falar
  rationale: ἐνεός indica incapacidade de falar ou estado de mudez, frequentemente ligado ao espanto. A expressão evita a possível ambiguidade de “sem palavras” e soa natural.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: ouvindo a voz[a]
  rationale: φωνή pode designar uma voz ou, mais amplamente, um som. “Voz” é a correspondência mais direta no contexto de alguém falando com Saulo; a nota preserva a alternativa lexical e a tensão com Atos 22:9.
- source_word: μηδένα δὲ θεωροῦντες
  choice: mas sem ver ninguém
  rationale: θεωρέω significa ver ou observar, e μηδένα nega que qualquer pessoa estivesse visível. A construção portuguesa reproduz naturalmente o contraste μὲν...δέ.
theological_decisions:
- issue: Aparente tensão entre Atos 9:7 e Atos 22:9 quanto ao que os companheiros de Saulo ouviram
  choice: Manter “voz” no texto principal e registrar “som” em nota
  alternative: Traduzir φωνή como “som” no texto principal, distinguindo a percepção sonora da compreensão da fala
  rationale: O grego permite ambos os sentidos, mas não declara explicitamente que os homens apenas perceberam um ruído ou que não compreenderam as palavras. “Voz” preserva a referência contextual à fala, enquanto a nota conserva a ambiguidade lexical sem harmonizar silenciosamente os relatos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Sem conseguir falar” explicita de modo natural o valor de ἐνεοί, e a colocação do marcador após “voz” identifica precisamente o termo explicado pela nota.
