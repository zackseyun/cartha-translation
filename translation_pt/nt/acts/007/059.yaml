  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: pt
  text: 'Enquanto apedrejavam Estêvão, ele invocava o Senhor Jesus e dizia: “Senhor Jesus, recebe o meu espírito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: apedrejavam
  rationale: O imperfeito indica uma ação em andamento; em português, o pretérito imperfeito expressa naturalmente esse aspecto durativo.
- source_word: ἐπικαλούμενον
  choice: enquanto ele invocava
  rationale: O particípio pode denotar invocar ou dirigir um apelo em oração. “Invocava” conserva esse sentido explícito e se ajusta à fala dirigida a Jesus.
- source_word: λέγοντα
  choice: e dizia
  rationale: O particípio coordenado é vertido pelo pretérito imperfeito, em harmonia com a ação simultânea e contínua do contexto.
- source_word: Κύριε Ἰησοῦ
  choice: Senhor Jesus
  rationale: Mantém a forma direta de tratamento, a reverência e a identificação inequívoca de Jesus como destinatário da invocação.
- source_word: δέξαι
  choice: recebe
  rationale: O imperativo aoristo de δέχομαι é expresso naturalmente por “recebe”, preservando o tom solene do pedido.
- source_word: τὸ πνεῦμά μου
  choice: o meu espírito
  rationale: “Espírito” é a correspondência clara e tradicional para πνεῦμα neste contexto de morte e entrega pessoal.
theological_decisions:
- issue: Se a tradução deve deixar claro que Estêvão invoca diretamente Jesus
  choice: '“enquanto ele invocava e dizia: ‘Senhor Jesus’”'
  alternative: “enquanto clamava e dizia”
  rationale: O texto apresenta Jesus como destinatário direto do apelo. “Invocava” preserva a força possível de ἐπικαλέομαι sem acrescentar um objeto que não esteja expresso no particípio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial; o uso de “invocava” explicita uma nuance lexical legítima do original.
