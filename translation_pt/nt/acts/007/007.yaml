source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: pt
  text: “E eu julgarei a nação à qual eles servirão como escravos[a]”, disse Deus, “e, depois disso, eles sairão e me adorarão[b] neste lugar”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à qual eles servirão”. O verbo grego significa “servir”, mas, neste contexto, se refere à escravidão dos israelitas no Egito.
    reason: lexical_alternative
  - marker: b
    text: Ou “me prestarão culto” ou “me servirão”. O verbo grego indica serviço religioso prestado a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: nação
  rationale: Refere-se à entidade coletiva e política que escravizaria os descendentes de Abraão, em alusão a Gênesis 15:14; “nação” é claro e natural.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: à qual eles servirão como escravos
  rationale: O dativo relativo indica a nação à qual o serviço será prestado, e o contexto da escravidão no Egito exige que o caráter coercitivo de δουλεύω fique claro em português.
- source_word: κρινῶ
  choice: julgarei
  rationale: Preserva diretamente a linguagem judicial do futuro κρινῶ sem especificar além do texto a forma da punição.
- source_word: ὁ θεὸς εἶπεν
  choice: disse Deus
  rationale: Mantém explícito o sujeito da atribuição de fala e se integra naturalmente à citação em português.
- source_word: μετὰ ταῦτα
  choice: depois disso
  rationale: Expressa com naturalidade a sequência temporal do plural idiomático grego μετὰ ταῦτα.
- source_word: ἐξελεύσονται
  choice: eles sairão
  rationale: Comunica a saída dos descendentes de Abraão da nação opressora e preserva a concisão do verbo grego.
- source_word: λατρεύσουσίν μοι
  choice: me adorarão
  rationale: λατρεύω, quando dirigido a Deus, denota serviço religioso ou culto; “adorarão” comunica esse sentido em português atual.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: neste lugar
  rationale: É a equivalência direta e natural de ἐν τῷ τόπῳ τούτῳ, preservando a referência espacial sem explicá-la indevidamente.
theological_decisions:
- issue: Sentido de δουλεύω no contexto da escravidão
  choice: servirão como escravos
  alternative: servirão
  rationale: Embora “servirão” reproduza formalmente o verbo, em português pode sugerir serviço voluntário. O contexto do cativeiro egípcio torna legítimo explicitar a servidão coercitiva, sem substituir a ação verbal por uma construção puramente passiva.
- issue: Sentido de λατρεύω quando o objeto é Deus
  choice: me adorarão
  alternative: me servirão
  rationale: O verbo descreve serviço religioso prestado a Deus. “Adorarão” distingue esse culto do serviço escravo mencionado anteriormente e evita que a repetição de “servir” apague o contraste do texto.
- issue: Referência de “neste lugar”
  choice: preservar a expressão sem identificação explicativa no texto
  alternative: explicitar Sinai, Canaã ou o templo
  rationale: A formulação de Estêvão ecoa a promessa do Êxodo e, no contexto do discurso, pode produzir tensão geográfica. A tradução não resolve silenciosamente essa questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das citações foi pontuada para deixar clara a inserção “disse Deus”. O texto explicita a servidão coercitiva no primeiro verbo e usa “adorarão” no segundo para preservar o contraste sem eliminar as alternativas lexicais nas notas.
