  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: pt
  text: 'Então o sumo sacerdote perguntou: “Essas coisas são mesmo assim?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É isso mesmo?”; mais explicitamente: “Essas acusações são verdadeiras?”'
    reason: Preserva alternativas legítimas para o plural ταῦτα e para o sentido idiomático de οὕτως ἔχει, deixando claro que “acusações” é uma explicitação contextual.
lexical_decisions:
- source_word: Εἶπεν
  choice: perguntou
  rationale: Embora λέγω signifique normalmente “dizer”, aqui introduz diretamente uma pergunta; “perguntou” é a forma mais natural em português e não altera o conteúdo do ato de fala.
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão narrativa a partir das acusações anteriores; “Então” expressa essa transição com naturalidade.
- source_word: ἀρχιερεύς
  choice: sumo sacerdote
  rationale: É a designação portuguesa consagrada e contextualmente precisa para o sacerdote singular que preside este interrogatório.
- source_word: Εἰ
  choice: interrogação direta
  rationale: Neste uso, εἰ introduz uma pergunta de resposta afirmativa ou negativa; em português, sua força é expressa naturalmente pela construção interrogativa.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo plural retoma as acusações recém-apresentadas sem explicitá-las interpretativamente como “acusações”.
- source_word: οὕτως ἔχει
  choice: são mesmo assim
  rationale: A expressão idiomática significa “ser assim” ou “ser o caso”. “Mesmo” dá naturalidade à verificação da veracidade sem transformar a referência genérica em uma acusação explicitada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a referência genérica do grego no texto principal e registra na nota a explicitação judicial possível.
