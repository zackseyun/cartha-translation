  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: pt
  text: E não lhe deu nela herança alguma, nem sequer um palmo de terra[a]; mas prometeu dar-lha como propriedade, a ele e à sua descendência depois dele, embora não tivesse nenhum filho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem sequer o espaço de um pé”. A expressão grega é um idiomatismo para a menor porção possível de terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando ele não tinha filho”. A construção grega pode ser entendida em sentido temporal, embora o contexto favoreça o sentido concessivo: “embora não tivesse nenhum filho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: herança
  rationale: Preserva o sentido jurídico e pactual de uma porção recebida na terra, mais precisamente do que o termo geral “propriedade”.
- source_word: οὐδὲ βῆμα ποδός
  choice: nem sequer um palmo de terra
  rationale: Expressa de modo natural em português o idiomatismo grego para a menor porção possível de terreno; a nota registra uma forma mais próxima da imagem lexical.
- source_word: ἐπηγγείλατο
  choice: prometeu
  rationale: É a forma direta e idiomática de comunicar o compromisso divino expresso pelo verbo grego.
- source_word: εἰς κατάσχεσιν
  choice: como propriedade
  rationale: Comunica claramente a ideia de posse da terra prometida sem confundi-la com a “herança” que Deus ainda não havia dado.
- source_word: σπέρματι
  choice: descendência
  rationale: Mantém o valor coletivo do singular grego e soa natural no contexto da promessa feita a Abraão.
- source_word: μετ’ αὐτόν
  choice: depois dele
  rationale: Indica diretamente a sucessão temporal da descendência de Abraão.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: embora ele não tivesse filho
  rationale: Torna explícita a força concessiva mais provável no contexto, preservando na nota a leitura temporal gramaticalmente possível.
- source_word: τέκνου
  choice: filho
  rationale: Neste contexto, designa de forma natural a ausência de um descendente de Abraão, sem restringir o termo grego ao sentido biológico de “filho homem” como afirmação lexical geral.
theological_decisions:
- issue: Nuance da ausência de filho quando a promessa foi feita
  choice: embora ele não tivesse filho
  alternative: quando ele não tinha filho
  rationale: O genitivo absoluto pode ser entendido temporalmente, mas o argumento ressalta o contraste entre a promessa de descendência e a ausência presente de um filho. A nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Um palmo de terra” comunica naturalmente a pequenez extrema da porção, enquanto a nota conserva mais de perto a imagem grega. A ordem foi levemente ajustada para evitar ambiguidade quanto ao referente de “depois dele”.
