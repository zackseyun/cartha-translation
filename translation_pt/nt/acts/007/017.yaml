source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: pt
  text: Mas, à medida que se aproximava o tempo da promessa que Deus havia feito a Abraão[a], o povo cresceu e se multiplicou no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a promessa que Deus havia declarado a Abraão” ou “a promessa que Deus havia assegurado a Abraão”. O verbo grego pode indicar um compromisso declarado; “havia feito” segue a expressão natural “fazer uma promessa”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Mas, à medida que
  rationale: Καθώς introduz uma relação temporal progressiva, e δέ marca uma transição leve. A formulação portuguesa preserva ambos sem criar um contraste excessivo.
- source_word: ἤγγιζεν
  choice: se aproximava
  rationale: O imperfeito apresenta a aproximação como processo em curso; “se aproximava” é natural e fiel ao aspecto verbal.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: o tempo do cumprimento da promessa
  rationale: Literalmente, “o tempo da promessa”. Em português, a expansão “do cumprimento” torna explícita a relação temporal implícita no contexto — o tempo em que a promessa se realizaria — sem entender χρόνος como um termo técnico para “tempo determinado”.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: que Deus havia feito a Abraão
  rationale: No contexto de ἐπαγγελία, ὁμολογέω denota assumir ou declarar um compromisso. “Fazer uma promessa” é a colocação portuguesa natural e evita a força adicional de “jurar”.
- source_word: ηὔξησεν ὁ λαὸς
  choice: o povo crescia
  rationale: O imperfeito contextual português acompanha a ação progressiva da oração temporal. “Crescia” expressa aumento do povo como coletividade com naturalidade.
- source_word: καὶ ἐπληθύνθη
  choice: e se multiplicava
  rationale: Mantém a distinção lexical em relação a ηὔξησεν e reproduz a linguagem bíblica do crescimento numérico sem arcaísmo.
- source_word: ἐν Αἰγύπτῳ
  choice: no Egito
  rationale: Tradução locativa direta e forma portuguesa corrente do topônimo.
theological_decisions:
- issue: Sentido de ὡμολόγησεν em relação à promessa de Deus a Abraão
  choice: “havia feito” na expressão “a promessa que Deus havia feito”
  alternative: “havia prometido”, “havia declarado” ou “havia assegurado”
  rationale: A tradução comunica um compromisso divino declarado sem importar a noção mais forte e específica de juramento.
- issue: Relação entre “tempo” e “promessa”
  choice: “o tempo do cumprimento da promessa”
  alternative: “o tempo da promessa”
  rationale: O contexto aponta para a aproximação do período em que a promessa se cumpriria. A expansão esclarece a relação em português, mas a nota registra a forma mais literal para não ocultar a concisão do grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção progressiva “à medida que se aproximava” preserva o aspecto do grego; “crescia e se multiplicava” mantém o paralelismo sem soar excessivamente literal.
