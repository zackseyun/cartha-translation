id: ACT.7.30
reference: Acts 7:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: pt
  text: Quando se completaram quarenta anos[a], um anjo apareceu a ele no deserto do monte Sinai[c], numa chama de fogo que vinha de uma sarça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de transcorridos quarenta anos”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “numa chama de fogo de uma sarça”; isto é, a chama estava associada a uma sarça, em alusão a Êxodo 3:2.
    reason: cross_reference
  - marker: c
    text: Alguns intérpretes relacionam este anjo ao “anjo do SENHOR” de Êxodo 3:2, mas aqui Atos diz simplesmente “um anjo”.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Quando se completaram quarenta anos
  rationale: A oração temporal absoluta indica que o período chegou ao seu término. A formulação conserva a força de πληρόω e permanece natural em português.
- source_word: ὤφθη
  choice: apareceu
  rationale: 'Embora a forma seja passiva, neste contexto de manifestação funciona naturalmente como verbo intransitivo: ''apareceu''.'
- source_word: αὐτῷ
  choice: a ele
  rationale: O dativo retoma Moisés no contexto; 'a ele' explicita de modo natural o destinatário da aparição.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: '''Deserto'' é uma equivalência corrente e clara para ἔρημος no cenário geográfico do êxodo, sem exigir que o termo denote apenas dunas ou completa aridez.'
- source_word: τοῦ ὄρους Σινᾶ
  choice: do monte Sinai
  rationale: É a forma idiomática consagrada em português para o genitivo que identifica o monte.
- source_word: ἄγγελος
  choice: um anjo
  rationale: O contexto indica um mensageiro celestial. O artigo indefinido preserva o fato de que Atos não traz aqui a expressão completa 'o anjo do Senhor'.
- source_word: ἐν φλογὶ πυρὸς
  choice: numa chama de fogo
  rationale: Mantém a imagem enfática e a expressão dupla do grego sem a achatar para apenas 'chama'.
- source_word: βάτου
  choice: que vinha de uma sarça
  rationale: O genitivo é comprimido e associa a chama à sarça. A formulação portuguesa comunica essa relação de origem sem afirmar que a sarça produzia naturalmente o fogo.
theological_decisions:
- issue: Identidade da figura que aparece (ἄγγελος) no contexto teofânico
  choice: um anjo
  alternative: o anjo do Senhor
  rationale: Atos 7:30 diz apenas ἄγγελος. A tradução não acrescenta a identificação mais específica de Êxodo 3:2; a relação canônica é indicada em nota, preservando a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Sarça' foi mantido por sua precisão e forte reconhecimento no relato bíblico, enquanto a sintaxe foi tornada natural. Todos os marcadores de nota aparecem no texto principal.
