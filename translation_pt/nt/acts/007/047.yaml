  text: But Solomon built a house for him[a].
translation:
  language: pt
  text: Mas Salomão construiu uma casa para ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um templo”; em grego, “uma casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve contraposição ou progressão do argumento em relação ao contexto anterior, preservando a conexão com a afirmação seguinte.
- source_word: οἰκοδόμησεν
  choice: construiu
  rationale: Expressa de modo natural e direto a construção concreta de um edifício; o aoristo é adequadamente apresentado pelo pretérito perfeito.
- source_word: αὐτῷ
  choice: para ele
  rationale: O dativo se refere a Deus e indica que a casa foi construída para ele; esta é a formulação idiomática em português.
- source_word: οἶκον
  choice: uma casa
  rationale: Mantém o sentido lexical comum de οἶκος e preserva a tensão do contexto, embora o referente histórico seja o templo.
theological_decisions:
- issue: Traduzir οἶκον literalmente como “casa” ou explicitá-lo como “templo”
  choice: casa
  alternative: templo
  rationale: O texto grego emprega οἶκος, não um termo específico para templo. “Casa” preserva a linguagem de Estêvão e a tensão teológica com a declaração subsequente de que o Altíssimo não habita em construções humanas; “templo” é esclarecido em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A formulação concisa acompanha de perto a estrutura do grego sem sacrificar a fluência.
