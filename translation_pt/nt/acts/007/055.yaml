id: ACT.7.55
reference: Acts 7:55
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: pt
  text: Mas ele, cheio do Espírito Santo, olhou fixamente para o céu[a] e viu a glória de Deus e Jesus em pé à direita de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fitou atentamente o céu».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «à direita de Deus» é um idioma bíblico que indica o lugar de maior honra e autoridade.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: ele, cheio
  rationale: O particípio presente descreve o estado contínuo de Estêvão enquanto ocorre a ação principal. Em português, a construção reduzida «ele, cheio» é natural e evita a formulação pesada «estando ele cheio».
- source_word: πλήρης πνεύματος ἁγίου
  choice: cheio do Espírito Santo
  rationale: Mantém a expressão característica de Lucas-Atos e apresenta o Espírito Santo como referência pessoal divina, em português corrente.
- source_word: ἀτενίσας
  choice: olhou fixamente
  rationale: Expressa o olhar concentrado e intenso indicado pelo verbo, com clareza para o leitor moderno.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: A preposição direcional combina naturalmente com «olhou»; neste contexto visionário, «céu» designa a esfera celestial, não apenas o firmamento visível.
- source_word: εἶδεν
  choice: viu
  rationale: Equivalente direto, claro e atual do aoristo indicativo.
- source_word: δόξαν θεοῦ
  choice: a glória de Deus
  rationale: Preserva de modo transparente a formulação grega e a ideia da manifestação da majestade divina.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome.
- source_word: ἑστῶτα
  choice: em pé
  rationale: Comunica de maneira idiomática a postura descrita pelo particípio perfeito, sem interpretar por que Jesus está nessa posição.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: à direita de Deus
  rationale: Reproduz o conhecido idioma bíblico de posição, honra e autoridade, evitando o literalismo pouco natural «desde a direita».
- source_word: δέ
  choice: Mas
  rationale: Assinala o contraste moderado entre a atitude hostil da multidão no contexto anterior e a experiência de Estêvão.
theological_decisions:
- issue: Referência de πνεύματος ἁγίου
  choice: Espírito Santo
  alternative: espírito santo
  rationale: O uso em Lucas-Atos e o contexto narrativo apontam para o Espírito divino, e não meramente para uma disposição santa; a capitalização comunica isso sem acrescentar uma formulação doutrinária ao texto.
- issue: Posição de Jesus em relação a Deus
  choice: Jesus em pé à direita de Deus
  alternative: Jesus em pé do lado direito de Deus
  rationale: A redação conserva tanto a distinção textual entre Jesus e Deus quanto a imagem bíblica de exaltação. «À direita» preserva o idioma tradicional sem explicar em excesso seu sentido no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem acrescentar Estêvão pelo nome, pois o grego deste versículo mantém o sujeito implícito. A repetição de «Deus» foi preservada por corresponder ao texto e manter clara a relação entre as figuras da visão.
