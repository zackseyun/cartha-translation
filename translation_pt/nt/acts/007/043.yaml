  naturalness: O português é moderno, claro e apropriado. “E eu os deportarei” preserva a coordenação do original e é natural; “para lhes prestar culto” evita uma concordância artificial e mantém a referência aberta aos objetos/deidades idólatras.
  terminology: “Moloque”, “Refã”, “tenda”, “estrela”, “imagens” e “deportarei” são escolhas adequadas. “Babilônia” é aceitável como forma portuguesa para Βαβυλών neste contexto e a nota registra corretamente a diferença com Amós.
