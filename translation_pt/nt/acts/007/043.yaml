language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: pt
  text: E vocês carregaram a tenda de Moloque e a estrela do deus Refã[a], as imagens[c] que fizeram para lhes prestar culto. E eu os deportarei para além da Babilônia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções, refletindo o texto hebraico de Amós 5:26, trazem “do vosso deus Refã”. Aqui, Atos diz “do deus Refã”.
    reason: alternative_reading
  - marker: b
    text: Atos diz “para além da Babilônia”. Em Amós 5:27, a passagem citada é geralmente traduzida como “para além de Damasco”.
    reason: cross_reference
  - marker: c
    text: Ou “figuras” ou “representações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: carregaram
  rationale: No contexto de objetos de culto portáteis, comunica naturalmente a ideia de tomar e levar consigo, sem acrescentar uma interpretação além do grego.
- source_word: σκηνὴν
  choice: tenda
  rationale: Preserva o sentido comum de σκηνή e evita que “tabernáculo” sugira indevidamente o santuário legítimo de Deus.
- source_word: Μολὸχ
  choice: Moloque
  rationale: Forma portuguesa corrente do nome próprio grego, clara para leitores modernos.
- source_word: ἄστρον
  choice: estrela
  rationale: Mantém o valor lexical direto do substantivo, sem explicitar no texto principal que se tratava de um símbolo astral.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: do deus Refã
  rationale: Segue a redação grega de Atos, que apresenta θεοῦ com artigo e não contém o pronome “vosso” encontrado no texto hebraico de Amós.
- source_word: τύπους
  choice: imagens
  rationale: Neste contexto de idolatria, expressa com clareza representações cultuais feitas pelas pessoas, preservando alternativas em nota.
- source_word: προσκυνεῖν αὐτοῖς
  choice: para adorá-las
  rationale: “Adorar” é o equivalente idiomático adequado no contexto religioso; o pronome feminino retoma naturalmente “imagens” em português.
- source_word: μετοικιῶ
  choice: deportarei
  rationale: Expressa de modo conciso e atual a remoção forçada para o exílio indicada pelo futuro grego.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: para além da Babilônia
  rationale: Traduz diretamente a localização de Atos sem harmonizá-la com Amós 5:27; “Babilônia” é natural em português para o destino/região do exílio.
theological_decisions:
- issue: A redação da citação em Atos difere de Amós quanto ao destino do exílio.
  choice: para além da Babilônia
  alternative: para além de Damasco
  rationale: O texto grego de Atos diz explicitamente “Babilônia”. A tradução mantém essa redação e registra em nota a diferença em relação a Amós, sem harmonização.
- issue: Atos identifica Refã como “o deus Refã”, enquanto o hebraico de Amós traz “vosso deus”.
  choice: do deus Refã
  alternative: do vosso deus Refã
  rationale: A redação principal segue o grego de Atos e a diferença relevante da fonte profética é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Moloque” e “Refã” seguem formas portuguesas reconhecíveis; “deportarei” preserva a força judicial do exílio. A conjunção conclusiva “Por isso” torna natural em português a relação da última oração com a acusação precedente, sem alterar seu conteúdo.
