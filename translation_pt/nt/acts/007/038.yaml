id: ACT.7.38
reference: Acts 7:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: pt
  text: Este é aquele que esteve na assembleia[a], no deserto, com o anjo que lhe falava no monte Sinai e com os nossos pais[b]. Ele recebeu oráculos vivos[c] para nos dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “congregação”; tradicionalmente, “igreja no deserto”.
    reason: alternative_reading
  - marker: b
    text: “Nossos pais” refere-se aos antepassados de Israel.
    reason: lexical_alternative
  - marker: c
    text: Ou “palavras vivas”; também pode ser entendido como “oráculos que dão vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assembleia
  rationale: Expressa o sentido básico de um povo reunido e, neste contexto, refere-se a Israel no deserto, sem introduzir indevidamente as associações institucionais posteriores de “igreja”.
- source_word: ἐρήμῳ
  choice: deserto
  rationale: É a forma corrente e natural em português para o cenário das peregrinações de Israel; aqui abrange a região erma, não apenas um deserto arenoso.
- source_word: ἀγγέλου
  choice: anjo
  rationale: No contexto do Sinai e do discurso de Estêvão, trata-se de um ser celestial, e não de um mensageiro humano.
- source_word: λαλοῦντος
  choice: que lhe falava
  rationale: A oração relativa é natural em português e o imperfeito “falava” conserva o aspecto durativo do particípio presente.
- source_word: ὄρει Σινᾶ
  choice: monte Sinai
  rationale: É a forma consagrada e idiomática do nome geográfico em português.
- source_word: πατέρων ἡμῶν
  choice: os nossos pais
  rationale: Mantém a expressão masculina explícita do grego e a identificação de Estêvão e seus ouvintes com os antepassados de Israel.
- source_word: ἐδέξατο
  choice: recebeu
  rationale: Traduz de modo direto Moisés como destinatário da revelação divina.
- source_word: λόγια
  choice: oráculos
  rationale: O termo designa pronunciamentos divinos, não meras palavras comuns; “oráculos” conserva esse caráter sagrado e revelatório.
- source_word: ζῶντα
  choice: vivos
  rationale: Mantém a formulação compacta do grego e sua riqueza teológica, sem decidir se significa inerentemente vivos, eficazes ou doadores de vida.
- source_word: δοῦναι
  choice: para nos dar
  rationale: A construção final expressa naturalmente que Moisés recebeu os oráculos com o propósito de transmiti-los ao povo.
- source_word: ἡμῖν
  choice: nos
  rationale: Conserva a identificação de Estêvão com Israel e com seus ouvintes dentro da história da aliança.
- source_word: ὁ γενόμενος
  choice: aquele que esteve
  rationale: É uma formulação idiomática em português para identificar Moisés como presente naquela assembleia, evitando o literalismo pouco natural “veio a estar”.
theological_decisions:
- issue: Se ἐκκλησίᾳ deve ser traduzido por “igreja” ao se referir a Israel no deserto
  choice: assembleia
  alternative: igreja; congregação
  rationale: O texto fala de Israel reunido no deserto. “Assembleia” preserva o sentido lexical sem impor a conclusão de que se trata da Igreja como instituição da nova aliança.
- issue: Se λόγια ζῶντα deve ser interpretado como “palavras que dão vida”
  choice: oráculos vivos
  alternative: palavras vivas; oráculos que dão vida
  rationale: A expressão grega é concisa e teologicamente aberta. “Oráculos vivos” preserva a imagem e não restringe antecipadamente seu sentido à ideia de apenas comunicar vida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura foi dividida em duas frases para evitar sobrecarga sintática, sem alterar as relações do grego. O artigo em “os nossos pais” é natural no português brasileiro e mantém a referência histórica específica.
