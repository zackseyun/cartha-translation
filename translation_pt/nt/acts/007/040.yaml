source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: pt
  text: 'dizendo a Arão: “Faça para nós deuses[a] que irão adiante de nós, pois esse Moisés[b], que nos tirou da terra do Egito — não sabemos o que aconteceu com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos”. A palavra grega significa literalmente “deuses”, ecoando o relato de Êxodo e preservando a maneira como o povo formulou seu pedido.
    reason: lexical_alternative
  - marker: b
    text: A expressão “esse Moisés” pode sugerir distanciamento ou desprezo.
    reason: discourse_nuance
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: dizendo a Arão
  rationale: O particípio aoristo introduz o conteúdo da fala e mantém sua ligação com a narrativa; em português, “dizendo a Arão” é claro e natural.
- source_word: Ποίησον ἡμῖν
  choice: Faça para nós
  rationale: O imperativo de ποιέω pede que Arão produza ou faça algo para o povo. A forma de tratamento com “faça” é natural e digna em português amplo.
- source_word: θεοὺς
  choice: deuses
  rationale: É o plural lexical de θεός e ecoa a formulação de Êxodo. Embora se trate de idolatria, traduzir por “ídolos” no texto principal substituiria a palavra empregada por uma caracterização interpretativa.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: que vão adiante de nós
  rationale: προπορεύομαι significa ir adiante ou preceder. A tradução conserva o movimento explícito sem acrescentar diretamente a ideia de liderança.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: pois esse Moisés
  rationale: “Pois” expressa a explicação introduzida por γάρ, enquanto “esse Moisés” conserva a topicalização e o possível tom de distanciamento de οὗτος sem tornar a frase artificial.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: que nos tirou da terra do Egito
  rationale: “Tirou” comunica naturalmente o movimento para fora expresso por ἐξάγω, e “da terra do Egito” preserva γῆς.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: não sabemos o que aconteceu com ele
  rationale: É uma formulação portuguesa atual e idiomática para a construção com γίνομαι, preservando o estado presente indicado por “não sabemos”.
theological_decisions:
- issue: Tradução de θεοὺς no contexto de idolatria
  choice: deuses
  alternative: ídolos
  rationale: O discurso do povo usa θεοὺς, não um substantivo distinto que signifique “ídolos”. “Deuses” conserva a alegação dos próprios falantes, o eco de Êxodo e a tensão irônica da apostasia.
- issue: Possível tom depreciativo de οὗτος aplicado a Moisés
  choice: esse Moisés
  alternative: este Moisés
  rationale: “Esse” pode transmitir o distanciamento contextual sugerido pelo demonstrativo, mas sem explicitar no texto principal um desprezo que depende do tom e do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a repetição deliberada de “nós” e o travessão destaca naturalmente a conclusão enfática sem eliminar a ligação explicativa introduzida por γάρ.
