  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: pt
  text: Ele pensava que seus irmãos[a] entendiam que Deus lhes estava dando libertação[b] por meio de sua mão, mas eles não entenderam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” refere-se aos compatriotas israelitas de Moisés; o grego emprega um termo masculino plural de parentesco.
    reason: cultural_note
  - marker: b
    text: Ou “salvação”. O termo grego pode indicar resgate, libertação ou salvação; neste contexto, o sentido imediato é a libertação de Israel por meio de Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: pensava
  rationale: O imperfeito apresenta como pano de fundo a expectativa de Moisés; em português, o imperfeito simples expressa isso com naturalidade.
- source_word: συνιέναι
  choice: entenderiam
  rationale: No discurso indireto dependente de um verbo no passado, o futuro do pretérito comunica naturalmente aquilo que Moisés esperava que seus irmãos percebessem.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: Preserva a linguagem masculina plural de parentesco usada para os compatriotas israelitas de Moisés.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: por meio de sua mão
  rationale: Mantém a imagem grega da mão como instrumento ou agente, sem perder inteligibilidade em português.
- source_word: δίδωσιν
  choice: estava dando
  rationale: Embora o grego use o presente no discurso indireto, a forma progressiva no passado se ajusta ao quadro narrativo e apresenta a ação divina em curso.
- source_word: σωτηρίαν
  choice: libertação
  rationale: No contexto da opressão no Egito, designa concretamente o resgate de Israel, sem eliminar as ressonâncias mais amplas de salvação.
- source_word: οἱ δὲ οὐ συνῆκαν
  choice: mas eles não entenderam
  rationale: Repete o verbo 'entender', como no grego, e destaca o contraste entre a expectativa de Moisés e a reação real dos israelitas.
theological_decisions:
- issue: Sentido de σωτηρία no contexto de Moisés
  choice: libertação
  alternative: salvação
  rationale: A referência imediata é à ação histórica de Deus para livrar Israel por meio de Moisés. 'Libertação' exprime esse sentido concreto, enquanto a nota preserva a alternativa lexical e suas possíveis ressonâncias teológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora da “mão” e a repetição de “entender”, evitando acrescentar um marcador temporal ausente do grego.
