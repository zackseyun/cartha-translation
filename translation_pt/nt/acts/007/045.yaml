source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: pt
  text: a qual também os nossos antepassados, depois de a receberem em sucessão,[a] introduziram com Josué,[b] quando tomaram posse das nações que Deus expulsou de diante dos nossos antepassados, até os dias de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que também os nossos antepassados, por sua vez, introduziram”. O particípio grego ressalta que a tenda foi recebida em sucessão.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, o nome aqui é o mesmo traduzido como “Jesus”; neste contexto, refere-se a Josué, filho de Num.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: a qual
  rationale: Pronome relativo feminino singular que retoma a tenda mencionada no versículo anterior e preserva a ligação sintática.
- source_word: εἰσήγαγον
  choice: introduziram
  rationale: Traduz o aoristo de εἰσάγω como levar ou trazer para dentro, referindo-se à entrada da tenda na terra.
- source_word: διαδεξάμενοι
  choice: tendo-a recebido em sucessão
  rationale: Explicita tanto a recepção quanto a sucessão entre gerações, sentidos presentes no particípio.
- source_word: οἱ πατέρες ἡμῶν
  choice: os nossos antepassados
  rationale: Em português corrente, comunica claramente a referência coletiva às gerações anteriores de Israel sem sugerir apenas pais imediatos.
- source_word: μετὰ Ἰησοῦ
  choice: com Josué
  rationale: Embora a forma grega também corresponda a Jesus, o contexto histórico da entrada na terra identifica Josué, filho de Num.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: ao tomarem posse das terras das nações
  rationale: κατάσχεσις indica tomada de posse ou ocupação. A menção a 'terras' torna idiomática em português a posse das nações, sem substituir as próprias nações como objeto da expulsão na oração seguinte.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: que Deus expulsou
  rationale: Mantém 'nações' como antecedente do relativo e traduz diretamente a ação vigorosa de ἐξωθέω.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: da presença deles
  rationale: Expressa em português natural o idiomatismo semítico 'de diante da face de nossos antepassados'; 'deles' retoma os antepassados e evita repetição pesada.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: até os dias de Davi
  rationale: Preserva a expressão temporal e sua transição para o versículo seguinte.
theological_decisions:
- issue: Referente de Ἰησοῦ
  choice: Josué
  alternative: Jesus
  rationale: A forma nominal grega é ambígua isoladamente, mas o cenário posterior a Moisés e a entrada de Israel na terra identifica Josué, filho de Num. A nota conserva transparência sobre a forma grega.
- issue: Força de διαδεξάμενοι
  choice: Os antepassados receberam a tenda em sucessão e a introduziram na terra
  alternative: Os antepassados, por sua vez, a introduziram
  rationale: A formulação escolhida preserva mais diretamente o componente lexical de recepção sucessiva, sem excluir a continuidade geracional.
- issue: Alcance de ἕως τῶν ἡμερῶν Δαυίδ
  choice: Ela permaneceu ali até os dias de Davi
  alternative: Ligar apenas 'até os dias de Davi' ao verbo 'introduziram'
  rationale: O grego deixa elíptica a relação precisa da expressão temporal. A tradução explicita a permanência da tenda, leitura contextual natural, mas reconhece em nota a construção mais literal e sua possível ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. 'Antepassados' evita a possível leitura restrita de 'pais'. A divisão em duas frases esclarece a elipse final; os marcadores [a] e [b] aparecem imediatamente após os termos pertinentes.
