  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: pt
  text: Quando estava completando quarenta anos, veio-lhe ao coração[a] visitar seus irmãos[b], os filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surgiu em seu coração” ou “ele decidiu”. O grego conserva uma expressão idiomática de propósito interior.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” refere-se aqui aos compatriotas de Moisés, conforme esclarece a expressão seguinte.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os descendentes de Israel”, “o povo de Israel” ou “os israelitas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quando
  rationale: Introduz a transição temporal de modo natural em português; a conjunção δέ liga a frase ao contexto sem exigir um marcador explícito como “então” ou “ora”.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: estava completando quarenta anos
  rationale: Preserva o aspecto progressivo do imperfeito e a ideia idiomática de que o período de quarenta anos chegava ao seu cumprimento, sem reduzir a expressão a uma simples declaração de idade.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: veio-lhe ao coração
  rationale: Mantém a imagem semítica de algo que surge interiormente como propósito ou resolução, em linguagem compreensível e dignificada.
- source_word: ἐπισκέψασθαι
  choice: visitar
  rationale: É a tradução concisa mais natural no contexto, embora o verbo também possa sugerir ir ver a situação de alguém com interesse ou cuidado.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seus irmãos
  rationale: Conserva a linguagem familiar masculina do grego; o aposto seguinte esclarece que se trata de seus compatriotas israelitas.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Reproduz de perto a designação étnica e familiar do texto grego, preservando a expressão bíblica tradicional sem ocultar sua forma.
theological_decisions:
- issue: Linguagem de parentesco e identificação étnica
  choice: seus irmãos, os filhos de Israel
  alternative: seus compatriotas israelitas
  rationale: A formulação escolhida preserva tanto a metáfora familiar quanto o aposto étnico do original. Não restringe a referência apenas a homens, pois a expressão designa coletivamente o povo de Israel.
- issue: Propósito interior de Moisés
  choice: veio-lhe ao coração
  alternative: decidiu
  rationale: A tradução mantém a imagem do original e não determina em excesso se se trata de desejo, intenção ou decisão já plenamente formada.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A construção “veio-lhe ao coração” conserva deliberadamente o caráter idiomático do original; as notas esclarecem seu sentido sem eliminar a ambiguidade entre desejo, propósito e decisão.
