id: ACT.7.10
reference: Acts 7:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: pt
  text: e o livrou de todas as suas aflições[a], dando-lhe favor[b] e sabedoria diante do faraó, rei do Egito, e o constituiu governante sobre o Egito e sobre toda a casa do faraó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todas as suas dificuldades”.'
    reason: lexical_alternative
  - marker: b
    text: “Favor” significa aqui consideração favorável aos olhos do faraó; outra tradução possível é “graça”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e o nomeou governador sobre o Egito e sobre toda a casa do faraó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: livrou
  rationale: O médio de ἐξαιρέω indica libertar alguém de perigo ou sofrimento. “Livrou” é natural em português e se encaixa bem na referência às aflições.
- source_word: θλίψεων
  choice: aflições
  rationale: Abrange as pressões, dificuldades e sofrimentos enfrentados por José, mantendo a gravidade do termo sem restringi-lo a um sentido escatológico.
- source_word: χάριν
  choice: favor
  rationale: No contexto, refere-se à consideração favorável recebida por José diante do faraó, e não necessariamente ao sentido teológico mais amplo de “graça”.
- source_word: σοφίαν
  choice: sabedoria
  rationale: Expressa tanto discernimento quanto capacidade prática, reconhecidos na presença do faraó.
- source_word: ἐναντίον
  choice: diante do
  rationale: Indica presença ou posição aos olhos de alguém; “diante do faraó” é conciso, natural e fiel.
- source_word: κατέστησεν
  choice: nomeou
  rationale: καθίστημι descreve a colocação de alguém numa função de autoridade; “nomeou” comunica claramente essa investidura.
- source_word: ἡγούμενον
  choice: governador
  rationale: Designa quem exerce autoridade governante. “Governador” é natural na narrativa de José e preserva a ideia de administração delegada.
- source_word: ἐπ’ Αἴγυπτον
  choice: sobre o Egito
  rationale: ἐπί com acusativo, após um verbo de nomeação, expressa autoridade sobre um domínio.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: toda a sua casa
  rationale: οἶκος pode abranger a casa real, seus integrantes e sua administração. A formulação mantém essa amplitude e evita reduzi-la apenas à família.
theological_decisions:
- issue: Referente do sujeito dos verbos “livrou” e “deu”
  choice: Deixar Deus como sujeito implícito, em continuidade com Atos 7:9
  alternative: Acrescentar explicitamente “Deus”
  rationale: O grego não repete o nome de Deus, mas os verbos no singular retomam naturalmente o contexto anterior. Preservar o sujeito implícito mantém o estilo e a coesão do original.
- issue: Sujeito de κατέστησεν (“nomeou”)
  choice: Entender o faraó como sujeito de “nomeou”
  alternative: Entender Deus como sujeito de todos os verbos coordenados
  rationale: Embora a coordenação grega permita manter Deus como sujeito gramatical, a narrativa de Gênesis e a proximidade de “faraó, rei do Egito” favorecem a leitura em que o faraó nomeia José. A redação explicita essa relação para soar natural em português, enquanto a nota registra a alternativa formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Faraó” permanece como título em minúscula, seguido da aposição “rei do Egito”. A redação prioriza fluidez narrativa, mas registra em nota a ambiguidade sintática real quanto ao sujeito de κατέστησεν.
