review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a acusação, a metáfora de «dura cerviz», a linguagem pactual de «incircuncisos», a resistência contínua ao Espírito Santo e o paralelo com as gerações anteriores. Contudo, «os seus pais» em português moderno normalmente denota os progenitores imediatos (frequentemente pai e mãe), enquanto οἱ πατέρες, neste contexto, se refere aos antepassados masculinos/gerações precedentes. «Ancestrais» é a opção mais clara no corpo do texto, com nota para a forma literal grega.
  naturalness: «Gente de dura cerviz e incircuncisa de coração e de ouvidos» é gramaticalmente possível, mas a concordância singular feminina de «incircuncisa» com o coletivo «gente» enfraquece a força direta da invectiva plural e soa menos idiomática na fórmula bíblica. «Vocês, de dura cerviz e incircuncisos de coração e de ouvidos» conserva a veemência e é clara para leitores brasileiros e internacionais.
  terminology: «Dura cerviz», «incircuncisos», «Espírito Santo» e «resistem» são escolhas fiéis e adequadas. «Ancestrais» no texto evita que «pais» seja entendido como pai e mãe, sem negar a formulação masculina específica do grego, que a nota registra.
  issues:
  - severity: medium
    issue: «os seus pais» pode ser entendido como os progenitores imediatos, inclusive pai e mãe.
    rationale: No contexto retórico de Estêvão, οἱ πατέρες ὑμῶν aponta para os antepassados/gerações anteriores. A tradução literal «pais» é ambígua em português moderno de modo potencialmente enganoso.
  - severity: low
    issue: A concordância em «gente ... incircuncisa» torna a denúncia menos diretamente plural.
    rationale: Embora seja defensável com o coletivo feminino «gente», a formulação não reproduz tão bem o vocativo plural do grego nem a forma bíblica mais reconhecível «incircuncisos de coração e de ouvidos».
  revised_text: “Vocês, de dura cerviz e incircuncisos de coração e de ouvidos! Vocês sempre resistem ao Espírito Santo; como fizeram os seus ancestrais[a], assim também vocês fazem.”
