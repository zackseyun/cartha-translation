  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: pt
  text: “Vocês, de dura cerviz e incircuncisos de coração e de ouvidos! Vocês sempre resistem ao Espírito Santo; como fizeram os seus ancestrais[a], assim também vocês fazem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “os seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: gente de dura cerviz
  rationale: Preserva a metáfora forte de um pescoço rígido, bem estabelecida na linguagem bíblica, sem reduzi-la simplesmente a “teimosos”.
- source_word: ἀπερίτμητοι
  choice: incircuncisa
  rationale: Mantém o termo literal ligado à aliança e a eco profético de rebeldia interior, em vez de substituí-lo por uma explicação interpretativa.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: de coração e de ouvidos
  rationale: Expressa em português a construção grega de respeito ou esfera e conserva a imagem aplicada tanto à disposição interior quanto à receptividade para ouvir.
- source_word: ἀεὶ
  choice: sempre
  rationale: Comunica diretamente a persistência habitual indicada pelo advérbio grego.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: ao Espírito Santo
  rationale: É a forma contemporânea consagrada para a expressão definida que, no contexto de Atos, designa o Espírito Santo pessoalmente.
- source_word: ἀντιπίπτετε
  choice: resistem
  rationale: Transmite oposição ativa de maneira clara e concisa, sem ampliar indevidamente o sentido.
- source_word: οἱ πατέρες ὑμῶν
  choice: os seus pais
  rationale: Preserva o substantivo masculino e a força familiar e retórica da acusação grega; uma nota registra a alternativa contextual “antepassados”.
- source_word: καὶ ὑμεῖς
  choice: assim também vocês fazem
  rationale: Completa naturalmente em português o paralelo verbal implícito no grego e enfatiza que os ouvintes repetem a conduta dos pais.
theological_decisions:
- issue: Referência de “Espírito Santo”
  choice: Referência pessoal ao Espírito Santo divino
  alternative: “espírito santo” como influência ou disposição divina geral
  rationale: Em Atos, a expressão articulada normalmente se refere pessoalmente ao Espírito Santo. A inicial maiúscula reflete esse referente contextual sem acrescentar conteúdo ao grego.
- issue: Imagem de incircuncisão ligada à aliança
  choice: Preservar “incircuncisa de coração e de ouvidos”
  alternative: Paráfrase como “de coração fechado e surda”
  rationale: A formulação ecoa deliberadamente a linguagem profética da aliança. Manter a metáfora conserva sua tensão e sua continuidade com as Escrituras de Israel.
- issue: Termo ancestral masculino
  choice: “os seus pais” no texto
  alternative: “os seus antepassados”
  rationale: O grego emprega explicitamente o plural masculino “pais”. A tradução o conserva, enquanto a nota esclarece o sentido geracional possível.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Gente de dura cerviz” mantém a imagem bíblica em uma forma vocativa natural; “vocês” oferece tratamento plural amplamente inteligível. A exclamação preserva a veemência da denúncia, e o paralelismo final conserva sua força retórica.
