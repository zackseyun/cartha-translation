revisions:
- from: “Gente de dura cerviz e incircuncisa de coração e de ouvidos! Vocês sempre resistem ao Espírito Santo; como fizeram os seus pais[a], assim também vocês fazem.”
  to: “Vocês, de dura cerviz e incircuncisos de coração e de ouvidos! Vocês sempre resistem ao Espírito Santo; como fizeram os seus ancestrais[a], assim também vocês fazem.”
  rationale: A revisão mantém as imagens e a estrutura acusatória do grego, mas emprega «ancestrais» para comunicar sem ambiguidade o referente geracional de οἱ πατέρες no português atual. A nota preserva a formulação literal «pais». A reformulação inicial restaura a concordância plural explícita com os destinatários e conserva o registro bíblico solene.
