  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: pt
  text: Então José mandou chamar Jacó, seu pai, e todos os seus parentes[a], ao todo setenta e cinco pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas passagens do Antigo Testamento dão o total como «setenta» (por exemplo, o texto hebraico de Gênesis 46:27 e Êxodo 1:5); aqui, Atos diz «setenta e cinco».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: mandou
  rationale: O particípio aoristo indica a ação que antecede o verbo principal. Em conjunto com μετεκαλέσατο, a expressão natural em português é «mandou chamar», sem acrescentar um objeto não expresso no grego.
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão da narrativa; «Então» liga naturalmente este passo ao anterior.
- source_word: μετεκαλέσατο
  choice: chamar
  rationale: O verbo médio significa chamar ou mandar buscar alguém para que venha. Unido a ἀποστείλας, «mandou chamar» transmite o sentido de modo idiomático e claro.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Jacó, seu pai
  rationale: Mantém a aposição do grego e identifica de maneira clara a relação de Jacó com José.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: todos os seus parentes
  rationale: συγγένεια designa o conjunto dos parentes. «Parentes» é atual e mais preciso aqui do que «família», que poderia sugerir um grupo doméstico mais restrito.
- source_word: ἐν ψυχαῖς
  choice: ao todo ... pessoas
  rationale: A expressão, literalmente «em almas», funciona como fórmula de contagem de pessoas. A redação escolhida comunica esse valor idiomático sem sugerir uma afirmação antropológica sobre a alma.
- source_word: ἑβδομήκοντα πέντε
  choice: setenta e cinco
  rationale: Tradução direta do numeral presente no texto grego.
theological_decisions:
- issue: Total numérico da família de Jacó em comparação com tradições textuais de Gênesis e Êxodo
  choice: setenta e cinco pessoas
  alternative: setenta pessoas
  rationale: O texto grego de Atos diz explicitamente «setenta e cinco». A tradução preserva esse número e registra em nota a diferença em relação ao texto hebraico de algumas passagens do Antigo Testamento, sem harmonizá-las.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Mandou chamar» evita uma formulação rígida e reproduz naturalmente a combinação verbal grega; «ao todo» deixa clara a função enumerativa de ἐν ψυχαῖς.
