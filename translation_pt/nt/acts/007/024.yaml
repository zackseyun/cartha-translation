  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: pt
  text: Ao ver alguém ser injustiçado, ele o defendeu e fez justiça em favor do oprimido, golpeando o egípcio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vingou o oprimido, golpeando o egípcio». A expressão grega traduzida como «fez justiça» também pode ter o sentido de vingar ou vindicar; o verbo traduzido como «golpeando» significa literalmente golpear, embora o contexto indique que o golpe foi fatal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Ao ver
  rationale: O particípio aoristo estabelece a circunstância temporal das ações principais; «Ao ver» é natural e conciso em português.
- source_word: τινα
  choice: alguém
  rationale: Preserva a indefinição do pronome grego sem acrescentar «homem».
- source_word: ἀδικούμενον
  choice: sendo injustiçado
  rationale: Expressa tanto a voz passiva quanto a dimensão moral de sofrer uma injustiça.
- source_word: ἠμύνατο
  choice: ele o defendeu
  rationale: O verbo médio indica acudir em defesa de alguém contra quem o agride.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: fez justiça
  rationale: Reproduz de modo natural a expressão grega e mantém sua tensão entre justiça, vindicação e vingança sem reduzi-la a revanche pessoal.
- source_word: τῷ καταπονουμένῳ
  choice: ao oprimido
  rationale: O particípio substantivado designa aquele submetido a tratamento duro; o dativo indica a pessoa em cujo favor se age.
- source_word: πατάξας
  choice: ferindo
  rationale: Mantém o sentido lexical de golpear, sem inserir diretamente «matar», embora o contexto indique resultado fatal.
- source_word: τὸν Αἰγύπτιον
  choice: o egípcio
  rationale: Forma substantivada corrente e fiel ao grego.
theological_decisions:
- issue: Nuance de ἐποίησεν ἐκδίκησιν na ação de Moisés
  choice: fez justiça ao oprimido
  alternative: vingou o oprimido / executou vingança em favor do oprimido
  rationale: A expressão pode transmitir justiça vindicatória ou vingança. A redação escolhida preserva a ação em favor da vítima sem apresentar a frase como aprovação doutrinária da vingança privada; a alternativa é registrada em nota.
- issue: Resultado de πατάξας
  choice: ferindo o egípcio
  alternative: matando o egípcio / abatendo o egípcio
  rationale: O verbo significa primariamente golpear ou ferir. Embora Êxodo 2 deixe claro que o egípcio morreu, a tradução principal evita tornar explícito no verbo mais do que esta forma grega afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português. Uma única nota reúne as duas ambiguidades lexicais relacionadas ao modo como Moisés fez justiça.
