  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: pt
  text: até que se levantou outro rei sobre o Egito[a], que não conhecia José.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegou ao poder sobre o Egito”. O verbo grego significa literalmente “levantou-se”.'
    reason: lexical_alternative
  - marker: b
    text: “Não conhecia José” também pode implicar “não reconhecia José” ou “não levava José em consideração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: até que
  rationale: Expressa de modo natural em português o limite temporal indicado pela locução grega.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Preserva a imagem verbal do grego e, no contexto, refere-se ao surgimento de um novo rei; a alternativa interpretativa é indicada em nota.
- source_word: βασιλεὺς ἕτερος
  choice: outro rei
  rationale: Traduz diretamente o título e distingue esse rei do anterior sem ampliar indevidamente a nuance de ἕτερος.
- source_word: ἐπ’ Αἴγυπτον
  choice: sobre o Egito
  rationale: Com βασιλεύς, a construção indica domínio ou governo sobre o território.
- source_word: οὐκ ᾔδει τὸν Ἰωσήφ
  choice: não conhecia José
  rationale: Mantém o sentido básico de οἶδα e preserva a possível implicação contextual de não reconhecer ou não levar José em consideração.
theological_decisions:
- issue: Sentido de οὐκ ᾔδει aplicado a José
  choice: não conhecia José
  alternative: não reconhecia José / não levava José em consideração
  rationale: A formulação direta preserva a ambiguidade entre desconhecimento pessoal ou histórico e falta de reconhecimento ou consideração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formulação amplamente internacional. A ordem dos marcadores acompanha cada expressão explicada.
