  verdict: revise
  source_fidelity: 'O sentido geral é fiel: a filha de Faraó recolhe Moisés, e depois o cria como filho. Contudo, “deixado ao relento” acrescenta uma circunstância ambiental específica que ἐκτεθέντος não exige; o termo descreve sobretudo a exposição/abandono da criança. “Deixado exposto” preserva melhor o sentido e a ambiguidade.'
