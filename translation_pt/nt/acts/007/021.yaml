  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: pt
  text: Mas, quando ele foi deixado exposto, a filha de Faraó o recolheu[a] e o criou como seu próprio filho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tomou consigo” ou “o tomou”. O verbo grego pode designar o ato de recolher uma criança exposta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para si, como filho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: ter sido deixado ao relento
  rationale: O particípio aoristo passivo indica que o bebê foi posto para fora e deixado exposto. A expressão preserva essa imagem concreta sem afirmar explicitamente uma intenção de abandono.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com contraste entre Moisés ter sido deixado exposto e ser acolhido pela filha de Faraó.
- source_word: ἀνείλατο
  choice: recolheu
  rationale: Neste contexto, o verbo designa tomar consigo uma criança exposta. “Recolheu” é natural em português e não antecipa a condição filial expressa no fim da frase.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: a filha de Faraó
  rationale: Forma natural em português que preserva a relação genitiva do grego.
- source_word: ἀνεθρέψατο
  choice: criou
  rationale: O verbo se refere a alimentar e educar uma criança até que cresça; “criou” comunica isso de modo corrente e conciso.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: como seu próprio filho
  rationale: A combinação do pronome reflexivo com εἰς υἱόν indica que ela o criou para si na condição de filho. A formulação portuguesa expressa naturalmente essa relação, sem reduzir ἀνείλατο a “adotou”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Deixado ao relento” conserva a imagem histórica de exposição de uma criança; “recolheu” distingue o resgate inicial da criação posterior como filho.
