id: ACT.7.19
reference: Acts 7:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: pt
  text: Esse homem[a] usou de astúcia contra o nosso povo e maltratou os nossos antepassados[c], fazendo-os abandonar seus bebês[b], para que não fossem mantidos vivos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiu ardilosamente contra o nosso povo”. O particípio grego indica astúcia, possivelmente com a ideia de engano.
    reason: lexical_alternative
  - marker: b
    text: Isto é, deixá-los expostos e abandonados, uma prática destinada a levá-los à morte.
    reason: cultural_note
  - marker: c
    text: Literalmente, “os nossos pais”. Aqui, a expressão se refere aos antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Esse homem
  rationale: Retoma de modo natural o rei mencionado no versículo anterior e preserva a força demonstrativa do grego.
- source_word: κατασοφισάμενος
  choice: usou de astúcia contra
  rationale: Expressa a ação ardilosa e hostil do rei sem reduzir o termo à mera prudência ou inteligência.
- source_word: τὸ γένος ἡμῶν
  choice: o nosso povo
  rationale: No contexto, γένος designa o povo de Israel; esta formulação é clara e evita as conotações modernas potencialmente enganosas de “raça”.
- source_word: ἐκάκωσεν
  choice: maltratou
  rationale: Comunica de maneira ampla o dano e os maus-tratos expressos pelo verbo.
- source_word: τοὺς πατέρας
  choice: os nossos antepassados
  rationale: Torna explícita a referência histórica aos israelitas de gerações anteriores, em português atual.
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: fazendo-os abandonar seus bebês
  rationale: Reproduz a construção causativa sem acrescentar explicitamente a ideia mais forte de coerção; “abandonar” comunica com clareza a exposição de crianças.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: para que não fossem mantidos vivos
  rationale: Preserva tanto a orientação de propósito ou resultado quanto a forma passiva de ζῳογονεῖσθαι.
theological_decisions:
- issue: Valor de εἰς τό com infinitivo
  choice: para que não fossem mantidos vivos
  alternative: de modo que não sobrevivessem
  rationale: A construção pode apresentar propósito ou resultado. A tradução mantém a formulação final do grego sem decidir de maneira rígida entre intenção e consequência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas segue os termos a que se ligam no texto; a formulação evita arcaísmos e não acrescenta uma coerção mais explícita do que a construção grega exige.
