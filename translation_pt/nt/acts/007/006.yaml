review_pass:
  verdict: approve
  source_fidelity: O texto traduz adequadamente ἐλάλησεν δὲ οὕτως com “Mas Deus falou assim” e mantém a relação de discurso indireto prospectivo em “viveria”. “Descendência” preserva o singular coletivo de σπέρμα, e os pronomes femininos singulares retomam-no corretamente em português. “Viveria como estrangeira numa terra alheia” comunica de modo claro o estado de πάροικον e o caráter não próprio da γῆ ἀλλοτρία. “Escravizariam”, “maltratariam” e “durante quatrocentos anos” correspondem bem a δουλώσουσιν, κακώσουσιν e ἔτη τετρακόσια.
  naturalness: O português é moderno, fluente e apropriado a um registro bíblico digno sem arcaísmo desnecessário. A combinação “viver como estrangeira” torna explícita, de modo natural, a condição residente e não nativa implicada por πάροικον. O sujeito plural “eles” é inevitavelmente genérico, como o sujeito plural não expresso do grego, e funciona bem no contexto.
  terminology: “Descendência” é uma solução sólida para σπέρμα coletivo; “escravizar” preserva corretamente a força de δουλόω. “Terra alheia” é preciso para ἀλλοτρία, pois indica uma terra pertencente a outros, não simplesmente uma terra distante. A nota registra de forma útil a alternativa plural idiomática e explica o singular coletivo sem impor leitura doutrinária.
