  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: pt
  text: 'Mas Deus falou assim: a descendência dele viveria como estrangeira numa terra alheia[a], e eles a escravizariam e a maltratariam durante quatrocentos anos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “os descendentes dele viveriam como estrangeiros numa terra que não era deles, e seriam escravizados e maltratados durante quatrocentos anos”. O grego emprega o singular coletivo: “descendência ... a”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Mas Deus falou assim
  rationale: Mantém δέ como leve contraste ou progressão e expressa οὕτως de modo explícito, em português natural.
- source_word: ἔσται τὸ σπέρμα αὐτοῦ
  choice: a descendência dele viveria
  rationale: “Descendência” comunica o valor coletivo de σπέρμα e permanece no singular; o condicional “viveria” preserva o sentido futuro em relação ao ato passado de falar.
- source_word: πάροικον
  choice: como estrangeira
  rationale: πάροικος designa quem reside fora de sua própria terra, sem plena condição de natural do lugar. A construção com “viveria” comunica esse estado com clareza e naturalidade.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: numa terra alheia
  rationale: “Alheia” preserva a ideia de uma terra pertencente a outros, isto é, não própria da descendência de Abraão.
- source_word: δουλώσουσιν αὐτὸ
  choice: eles a escravizariam
  rationale: “Escravizariam” traduz diretamente δουλόω. O pronome feminino singular retoma gramaticalmente “descendência” e preserva o coletivo singular do grego.
- source_word: κακώσουσιν
  choice: a maltratariam
  rationale: “Maltratar” expressa de forma ampla e atual a imposição de sofrimento indicada por κακόω, sem restringi-la a uma modalidade específica.
- source_word: ἔτη τετρακόσια
  choice: durante quatrocentos anos
  rationale: “Durante” torna explícita, em português idiomático, a duração expressa pelo acusativo grego.
theological_decisions:
- issue: O singular coletivo aplicado à descendência de Abraão
  choice: 'Mantido no texto principal: “a descendência dele ... a escravizariam e a maltratariam”'
  alternative: “os descendentes dele ... os escravizariam e os maltratariam”
  rationale: σπέρμα e αὐτό estão no singular e apresentam a posteridade de Abraão como um coletivo. A formulação principal preserva esse traço, enquanto a nota oferece a alternativa plural mais comum em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “terra alheia” conserva a noção de uma terra pertencente a outros; o singular coletivo é mantido apesar de sua leve estranheza, e a nota apresenta uma formulação plural mais idiomática.
