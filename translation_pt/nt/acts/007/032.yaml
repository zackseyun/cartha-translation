source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: pt
  text: “Eu sou o Deus dos seus pais, o Deus de Abraão, de Isaque e de Jacó.” Então Moisés ficou aterrorizado e não ousava olhar atentamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “examinar” ou “observar de perto”. O verbo grego pode indicar tanto olhar cuidadosamente como considerar com atenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς
  choice: Eu sou o Deus
  rationale: A construção grega é nominal e começa com o pronome enfático Ἐγώ; em português, a cópula “sou” deve ser suprida para formar uma identificação natural e completa.
- source_word: τῶν πατέρων σου
  choice: dos seus pais
  rationale: “Pais” preserva o sentido literal e a ressonância pactual de πατέρων; no contexto, refere-se aos antepassados de Moisés. “Seus” oferece leitura amplamente natural em português brasileiro.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: o Deus de Abraão, de Isaque e de Jacó
  rationale: A repetição de “de” torna explícita e natural em português a relação genitiva implícita nos nomes indeclináveis, mantendo a cadência da identificação divina.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Então Moisés ficou aterrorizado
  rationale: O particípio aoristo indica a entrada de Moisés em um estado intenso de medo. A reformulação com verbo finito é idiomática, e “então” expressa a transição narrativa de δέ sem impor forte contraste.
- source_word: οὐκ ἐτόλμα
  choice: não ousava
  rationale: O imperfeito expressa uma atitude continuada de não se atrever; “não ousava” preserva naturalmente esse aspecto em português.
- source_word: κατανοῆσαι
  choice: olhar atentamente
  rationale: No contexto visual da sarça, κατανοέω indica observar com atenção ou examinar. “Olhar atentamente” mantém o sentido concreto sem excluir a ideia de consideração cuidadosa.
theological_decisions:
- issue: Forma da autoidentificação divina na citação de Êxodo
  choice: Eu sou o Deus dos seus pais
  alternative: Eu, o Deus dos seus pais
  rationale: Embora o grego não apresente cópula expressa, o português normalmente requer “sou”. A formulação preserva a ênfase do pronome e a força declarativa sem acrescentar uma interpretação teológica além da citação.
- issue: Sentido de “pais”
  choice: pais
  alternative: antepassados
  rationale: “Pais” conserva a formulação tradicional e pactual do texto-fonte. O contexto deixa claro que se trata dos antepassados de Moisés, evitando restringir a referência a seus genitores imediatos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fala divina mantém cadência bíblica sem arcaísmos excessivos; a segunda oração é apresentada em ordem narrativa natural. O marcador [a] aparece no texto e esclarece a amplitude lexical de κατανοῆσαι.
