  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: pt
  text: A tenda do testemunho estava com os nossos pais[b] no deserto[a], assim como aquele que falava a Moisés[c] lhe ordenou que a fizesse conforme o modelo que Moisés tinha visto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tabernáculo do testemunho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossos antepassados”. O grego diz “nossos pais”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aquele que falou a Moisés”; pelo contexto, Deus ou o Senhor. O grego não identifica explicitamente quem falava.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ
  choice: A tenda
  rationale: “Tenda” comunica de modo claro e corrente o sentido básico de uma estrutura portátil, sem exigir o termo tradicional e mais especializado “tabernáculo”.
- source_word: τοῦ μαρτυρίου
  choice: do testemunho
  rationale: Mantém de perto a construção genitiva grega e a expressão bíblica ligada ao testemunho divino.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: com os nossos pais
  rationale: O dativo é expresso naturalmente por “com”, e “pais” preserva a formulação masculina explícita do grego; “antepassados” é uma alternativa idiomática.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: É a forma portuguesa natural para a localização geográfica bíblica indicada por ἐν com o dativo.
- source_word: καθὼς
  choice: assim como
  rationale: Marca claramente a correspondência entre a tenda e a instrução recebida por Moisés.
- source_word: διετάξατο
  choice: ordenou
  rationale: Expressa a instrução revestida de autoridade; no contexto, é mais precisa do que uma formulação meramente orientativa.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: aquele que falava a Moisés
  rationale: Preserva o particípio presente substantivado e deixa implícita, como no grego, a identidade de quem falava.
- source_word: ποιῆσαι αὐτὴν
  choice: que a fizesse
  rationale: Construção portuguesa natural para o infinitivo dependente de διετάξατο, com o pronome retomando “tenda”.
- source_word: κατὰ τὸν τύπον
  choice: conforme o modelo
  rationale: “Modelo” comunica naturalmente a ideia de um protótipo mostrado a Moisés; “padrão” também é possível.
- source_word: ὃν ἑωράκει
  choice: que ele tinha visto
  rationale: O mais-que-perfeito composto expressa que a visão do modelo antecedeu a construção.
theological_decisions:
- issue: Identidade de ὁ λαλῶν τῷ Μωϋσῇ
  choice: Mantida implícita em “aquele que falava a Moisés”.
  alternative: “Deus, que falava a Moisés” ou “o Senhor, que falava a Moisés”.
  rationale: Embora o contexto identifique naturalmente o falante como Deus, o grego não o nomeia neste versículo; explicitar “Deus” ou “Senhor” resolveria o que a formulação do texto deixa implícito.
- issue: Referente de “ele” em “que ele tinha visto”
  choice: O pronome é mantido, referindo-se naturalmente a Moisés.
  alternative: “que Moisés tinha visto”.
  rationale: A forma pronominal reproduz a coesão do grego sem introduzir novamente um nome que o texto não repete.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a ordem lógica do grego e sua referência implícita ao falante, evitando vocabulário excessivamente eclesiástico no texto principal.
