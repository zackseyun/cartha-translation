  source_fidelity: A tradução representa adequadamente o grego. “Na segunda vez” transmite ἐν τῷ δευτέρῳ sem introduzir desnecessariamente “visita”. “José foi reconhecido por seus irmãos” preserva a voz passiva de ἀνεγνωρίσθη; a nota registra de modo apropriado a possibilidade contextual de José ter-se dado a conhecer. “A família de José ficou conhecida pelo faraó” comunica bem φανερὸν ἐγένετο τῷ Φαραώ e entende γένος como o grupo familiar de José.
