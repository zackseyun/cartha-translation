source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: pt
  text: Na segunda vez, José foi reconhecido por seus irmãos[a], e a família de José ficou conhecida pelo faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “José se deu a conhecer a seus irmãos”. O verbo grego está na voz passiva, mas, no contexto da narrativa, pode se referir a José revelar sua identidade a eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: na segunda vez
  rationale: O adjetivo substantivado indica a segunda ocasião. A formulação é natural em português e evita acrescentar “visita”, palavra implícita no contexto, mas ausente do grego.
- source_word: ἀνεγνωρίσθη
  choice: foi reconhecido
  rationale: Preserva diretamente a forma passiva do verbo grego. O contexto narrativo também permite entender que José revelou sua identidade, possibilidade registrada em nota.
- source_word: ἀδελφοῖς
  choice: por seus irmãos
  rationale: O referente são os irmãos homens de José na narrativa de Gênesis; a preposição “por” expressa com naturalidade o agente da construção passiva.
- source_word: φανερὸν ἐγένετο
  choice: ficou conhecida
  rationale: Expressa de modo corrente a ideia de algo passar a ser conhecido.
- source_word: γένος
  choice: família
  rationale: Neste contexto, o termo se refere ao grupo familiar ou parentesco de José. “Família” é claro e evita as conotações modernas potencialmente enganosas de “raça”.
- source_word: τῷ Φαραώ
  choice: pelo faraó
  rationale: Na expressão portuguesa “ficar conhecido por alguém”, esta construção comunica naturalmente que o faraó veio a conhecer a família de José.
