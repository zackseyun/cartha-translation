source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: pt
  text: Foi este homem que os conduziu para fora, realizando prodígios e sinais na terra do Egito, no mar Vermelho[a] e no deserto, durante quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar de Juncos”. O texto grego diz “mar Vermelho” (Ἐρυθρὰ Θάλασσα), designação usual no Novo Testamento e na Septuaginta para o lugar da travessia de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Foi este homem que
  rationale: A construção preserva a ênfase demonstrativa de Estêvão ao retomar Moisés e soa natural em português, sem reduzir οὗτος ao simples pronome “ele”.
- source_word: ἐξήγαγεν αὐτούς
  choice: os tirou de lá
  rationale: Exprime de modo idiomático a ação de conduzir o povo para fora do Egito; “de lá” recupera do contexto o ponto de partida sem repetir “Egito” antes da sequência geográfica.
- source_word: ποιήσας
  choice: realizando
  rationale: O gerúndio mantém a relação participial com a ação principal e apresenta os prodígios e sinais como atos realizados por Moisés no curso dessa missão.
- source_word: τέρατα καὶ σημεῖα
  choice: prodígios e sinais
  rationale: 'Preserva a dupla expressão lucana: atos que causam assombro e atos que possuem valor indicativo, sem fundi-los no termo genérico “milagres”.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: na terra do Egito
  rationale: Conserva γῇ e a estrutura geográfica tripla do texto.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: no mar Vermelho
  rationale: É a correspondência direta da designação grega Ἐρυθρὰ Θάλασσα e a forma tradicional e reconhecível em português. A preposição “no” acompanha o grego ἐν sem determinar com precisão se os atos ocorreram dentro do mar ou na região da travessia.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é claro e corrente em português bíblico para a região erma das peregrinações de Israel; não exige que todo o terreno fosse arenoso.
- source_word: ἔτη τεσσεράκοντα
  choice: durante quarenta anos
  rationale: “Durante” explicita naturalmente em português a duração expressa pelo acusativo temporal.
theological_decisions:
- issue: Referência do demonstrativo e agência no êxodo
  choice: O versículo identifica enfaticamente Moisés como o agente humano que tirou Israel do Egito e realizou prodígios e sinais.
  alternative: Usar apenas “Ele os tirou”, enfraquecendo a ênfase retórica; ou reformular para atribuir explicitamente todos os atos diretamente a Deus.
  rationale: O grego atribui gramaticalmente as ações a Moisés, sem afirmar que ele agiu com poder independente de Deus. A tradução mantém essa tensão e não acrescenta uma explicação teológica ao corpo do versículo.
- issue: Localização dos prodígios junto ao mar Vermelho
  choice: Manter “no mar Vermelho”, acompanhando a preposição repetida ἐν.
  alternative: Traduzir “junto ao mar Vermelho” ou “no mar de Juncos”.
  rationale: “No” preserva a forma do grego e deixa aberta a relação exata com o local da travessia. “Mar de Juncos” procede do pano de fundo hebraico, não do sentido lexical direto da expressão grega.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A construção focal “Foi este homem que” conserva a força retórica; “prodígios e sinais” mantém a formulação bíblica sem soar arcaica. O marcador [a] foi colocado diretamente após a expressão a que a nota se refere.
