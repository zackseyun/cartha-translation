id: ACT.7.16
reference: Acts 7:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: pt
  text: e foram levados para Siquém e colocados no túmulo que Abraão tinha comprado por uma quantia em prata dos filhos de Hamor, em Siquém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação de Estêvão reúne detalhes que podem ser comparados com Gênesis 23, onde Abraão compra de Efrom um local de sepultamento em Macpela, e com Gênesis 33:19, onde Jacó compra dos filhos de Hamor um terreno perto de Siquém.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: foram levados
  rationale: O aoristo passivo de μετατίθημι indica a transferência dos restos mortais dos patriarcas. “Foram levados” é claro e natural em português, sem especificar além do texto como ocorreu o traslado.
- source_word: Συχὲμ / Συχέμ
  choice: Siquém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἐτέθησαν
  choice: colocados
  rationale: No contexto de sepultamento, expressa de modo natural que eles foram depositados no túmulo, preservando a voz passiva do grego.
- source_word: μνήματι
  choice: túmulo
  rationale: μνῆμα designa um lugar de sepultamento; “túmulo” é a equivalência portuguesa mais direta neste contexto.
- source_word: ᾧ
  choice: que
  rationale: O pronome relativo retoma “túmulo” e introduz naturalmente, em português, a oração que o modifica.
- source_word: ὠνήσατο
  choice: tinha comprado
  rationale: O verbo significa comprar ou adquirir mediante pagamento. O mais-que-perfeito composto deixa clara a anterioridade da compra em relação ao sepultamento.
- source_word: τιμῆς ἀργυρίου
  choice: por uma quantia em prata
  rationale: A expressão indica um preço pago em prata. A formulação é natural em português e preserva tanto a ideia de valor quanto o material empregado no pagamento.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: dos filhos de Hamor
  rationale: παρά com genitivo indica a fonte de quem o bem foi comprado; “dos filhos de Hamor” reproduz a construção com clareza.
- source_word: ἐν Συχέμ
  choice: em Siquém
  rationale: A expressão final é mantida em sua forma direta. Sua posição conserva alguma abertura quanto à ligação precisa com Hamor, seus filhos ou a transação, sem impor uma solução interpretativa.
theological_decisions:
- issue: Tensão histórica com os relatos de compra e sepultamento em Gênesis
  choice: 'Manter a redação de Estêvão conforme o texto grego: Abraão comprou o túmulo dos filhos de Hamor em Siquém.'
  alternative: Harmonizar com a compra feita por Jacó em Gênesis 33:19 ou com a compra feita por Abraão em Macpela em Gênesis 23.
  rationale: A tradução deve representar o texto grego tal como transmitido, sem corrigir ou harmonizar silenciosamente seus detalhes com os relatos de Gênesis. A nota informa ao leitor os textos relacionados e preserva a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a sequência passiva do grego e evita harmonizar no texto principal os detalhes históricos discutidos.
