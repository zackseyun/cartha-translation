  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: pt
  text: 'Mas o homem que tratava injustamente o seu próximo o empurrou para longe[a], dizendo: “Quem nomeou você governante e juiz sobre nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o repeliu”. O verbo grego pode destacar tanto um empurrão físico enérgico quanto uma rejeição desdenhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: maltratava
  rationale: O particípio presente tem aspecto imperfectivo e descreve a ação injusta em andamento. “Maltratava” comunica com naturalidade que o homem fazia mal ao outro, sem especificar uma forma de dano não expressa no grego.
- source_word: πλησίον
  choice: seu próximo
  rationale: “Próximo” é o equivalente lexical tradicional e atual, preservando a ideia de alguém próximo ou pertencente à mesma comunidade sem explicitar além do texto que se tratava de outro israelita.
- source_word: ἀπώσατο
  choice: o empurrou para longe
  rationale: A forma verbal indica repulsa concreta e enérgica. A expressão preserva tanto o gesto físico quanto seu caráter de rejeição.
- source_word: κατέστησεν
  choice: nomeou
  rationale: No contexto de atribuir autoridade, “nomeou” expressa naturalmente o sentido causativo de estabelecer alguém numa função.
- source_word: ἄρχοντα
  choice: líder
  rationale: “Líder” comunica autoridade de maneira clara e corrente. Evita a possível conotação monárquica de “governante”, embora esta também seja uma alternativa lexical possível.
- source_word: δικαστὴν
  choice: juiz
  rationale: É o equivalente direto e natural para a função de julgar disputas.
- source_word: ἐφ’ ἡμῶν
  choice: sobre nós
  rationale: A preposição com genitivo indica aqui autoridade exercida sobre o grupo; “sobre nós” mantém a formulação e a contestação dessa autoridade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a pergunta desafiadora do grego foram preservadas; “você” favorece naturalidade contemporânea sem tornar o registro informal demais.
