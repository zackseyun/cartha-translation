  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: pt
  text: vocês, que receberam a lei com a mediação de anjos[a] e não a guardaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mediante disposições de anjos” ou “por ordem de anjos”. A expressão grega é difícil, mas indica que a lei foi dada com a mediação de anjos.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: vocês, que
  rationale: Preserva o endereço direto na segunda pessoa e a força acusatória do pronome relativo qualitativo, em concordância com os verbos na segunda pessoa do plural.
- source_word: ἐλάβετε
  choice: receberam
  rationale: Tradução natural do aoristo de λαμβάνω no contexto da recepção da lei, sem sugerir aceitação voluntária além do que o texto afirma.
- source_word: τὸν νόμον
  choice: a lei
  rationale: Refere-se à lei mosaica. A inicial minúscula acompanha o grego e evita impor uma convenção editorial interpretativa.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: por intermédio de determinações de anjos
  rationale: A expressão grega é difícil. Esta formulação conserva a ideia de διαταγαί como determinações, disposições ou ordens e comunica a participação mediadora dos anjos sem definir com precisão um mecanismo que o grego deixa obscuro.
- source_word: ἀγγέλων
  choice: anjos
  rationale: Neste contexto, designa seres celestiais associados à entrega da lei, e não mensageiros humanos.
- source_word: οὐκ ἐφυλάξατε
  choice: não a guardaram
  rationale: φυλάσσω, tendo a lei como objeto, significa guardá-la ou observá-la. O pronome retoma naturalmente 'a lei' em português.
theological_decisions:
- issue: Sentido da mediação angélica em εἰς διαταγὰς ἀγγέλων
  choice: A lei foi recebida por intermédio de determinações de anjos.
  alternative: A lei foi recebida mediante disposições de anjos, ou por ordem de anjos.
  rationale: O texto associa a entrega da lei à atuação de anjos, mas a construção com εἰς e o sentido exato de διαταγαί são debatidos. A tradução mantém essa tensão e a nota apresenta alternativas sem especificar indevidamente a forma da mediação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural explícito “vocês” preserva o confronto direto de Estêvão. “Guardaram” mantém o idioma bíblico corrente, sem perder clareza.
