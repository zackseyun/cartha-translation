  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: pt
  text: 'E disse: “Eis que vejo os céus abertos[a] e o Filho do Homem[b] em pé à direita de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os céus tendo sido abertos”. O grego emprega um particípio perfeito passivo, destacando que, na visão de Estêvão, os céus já haviam sido abertos e permaneciam abertos.'
    reason: lexical_alternative
  - marker: b
    text: “Filho do Homem” é um título messiânico reconhecido, que remete a Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Interjeição de chamada de atenção, no plural, apropriada porque Estêvão se dirige aos presentes; preserva a vivacidade sem recorrer ao arcaizante «Eis».
- source_word: θεωρῶ
  choice: Contemplo
  rationale: Expressa percepção visual atenta e contínua no contexto da visão; mantém um registro digno e evita repetir «vejam... vejo».
- source_word: τοὺς οὐρανοὺς
  choice: os céus
  rationale: Preserva o plural grego e o registro teológico, sem reduzi-lo ao sentido físico de «céu» ou «firmamento».
- source_word: διηνοιγμένους
  choice: abertos
  rationale: Traduz naturalmente o particípio perfeito passivo, apresentando os céus no estado resultante de terem sido abertos.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título cristológico tradicional e sua ressonância com Daniel 7:13.
- source_word: ἐκ δεξιῶν
  choice: à direita
  rationale: Equivalente português natural da expressão que indica posição de honra e autoridade, preservando a linguagem bíblica sem a formulação menos corrente «à mão direita».
- source_word: ἑστῶτα
  choice: em pé
  rationale: Comunica inequivocamente a postura descrita e preserva o contraste textual com passagens em que Cristo aparece sentado.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Tradução direta do genitivo, sem expansão interpretativa.
theological_decisions:
- issue: Título cristológico υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A formulação tradicional reflete de perto o grego e preserva a força messiânica e a ligação intertextual com Daniel 7:13.
- issue: Postura de Jesus exaltado
  choice: em pé à direita de Deus
  alternative: sentado à direita de Deus
  rationale: O texto diz explicitamente que o Filho do Homem está em pé; não se harmoniza esta descrição com outras passagens que o apresentam sentado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vejam!» conserva a força da exclamação; «Contemplo» mantém o caráter visionário. A ordem da frase segue de perto o grego sem soar artificial.
