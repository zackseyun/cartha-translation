  source_fidelity: A tradução preserva adequadamente «os céus», o perfeito passivo («abertos»), o título «Filho do Homem», a postura «em pé» e a expressão «à direita de Deus». Contudo, «Vejam!» transforma Ἰδού, partícula de chamada de atenção, num imperativo plural dirigido aos ouvintes; «Eis que» reproduz a função discursiva sem introduzir essa mudança. «Vejo» é também o equivalente direto e moderno de θεωρῶ.
  naturalness: A redação revista mantém um português claro e solene sem ser arcaico em excesso. «Eis que vejo» é uma formulação bíblica ainda compreensível e evita a alternância algo artificial entre «Vejam!» e «Contemplo».
  terminology: «Filho do Homem», «os céus», «em pé» e «à direita de Deus» são escolhas corretas e consistentes com o registro bíblico e com os termos relevantes do original. A nota sobre Daniel 7:13 é apropriada, mas seu marcador deve ficar junto ao título que explica.
