  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: pt
  text: 'E lhe disse: “Saia da sua terra e dos seus parentes[a] e venha para a terra que eu lhe mostrarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua parentela” ou “da sua família”. O grego συγγένεια se refere ao grupo de parentesco de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: lhe disse
  rationale: Mantém o pronome do grego sem substituir seu referente por Abraão; a construção é natural na narrativa em português.
- source_word: Ἔξελθε
  choice: Saia
  rationale: O imperativo comunica de modo direto o movimento de deixar o lugar de origem, cuja procedência é explicitada pela preposição seguinte.
- source_word: ἐκ τῆς γῆς σου
  choice: da sua terra
  rationale: “Terra” preserva o sentido territorial amplo de γῆ sem sugerir necessariamente um Estado nacional moderno.
- source_word: ἐκ τῆς συγγενείας σου
  choice: dos seus parentes
  rationale: συγγένεια designa coletivamente o grupo de parentesco. “Seus parentes” é claro e atual, sem restringir a expressão à família nuclear.
- source_word: δεῦρο
  choice: venha
  rationale: Preserva a orientação dêitica de δεῦρο, que literalmente convida o destinatário a vir, em vez de nivelá-la para “vá”.
- source_word: εἰς τὴν γῆν
  choice: para a terra
  rationale: Em português, “para” expressa naturalmente o movimento em direção ao destino indicado por εἰς.
- source_word: ἣν ἄν σοι δείξω
  choice: que eu lhe mostrarei
  rationale: A construção com ἄν e o subjuntivo aoristo tem aqui referência futura; o futuro do indicativo comunica isso naturalmente sem sugerir incerteza indevida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Conserva a repetição relacional (“da sua terra e dos seus parentes”) e a orientação de “venha”, sem explicitar além do grego quem é o referente do pronome.
