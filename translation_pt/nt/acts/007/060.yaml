  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: pt
  text: 'Então, ajoelhando-se, clamou em alta voz: “Senhor, não lhes atribuas este pecado[a].” Depois de dizer isso, adormeceu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não lhes imputes este pecado” ou “não leves este pecado em conta contra eles”.'
    reason: lexical_alternative
  - marker: b
    text: O grego usa “adormeceu” como expressão habitual para a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Então, ajoelhando-se
  rationale: A expressão idiomática significa literalmente “tendo posto os joelhos”, isto é, ajoelhar-se. “Ajoelhando-se” comunica a ação com naturalidade, e “Então” representa δέ como progressão narrativa.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: κράζω indica um clamor ou grito forte, e φωνῇ μεγάλῃ explicita a intensidade da voz. A formulação preserva ambos os elementos sem redundância excessiva.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” preserva o vocativo reverente e o uso de κύριος como título de Jesus no contexto imediato.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: não lhes atribuas este pecado
  rationale: 'Neste contexto, ἵστημι tem sentido forense ou contábil: estabelecer, lançar ou levar algo à conta de alguém. “Não lhes atribuas este pecado” é claro em português e mantém explícito o demonstrativo “este”.'
- source_word: καὶ τοῦτο εἰπὼν
  choice: Depois de dizer isso
  rationale: A construção participial indica que o adormecer ocorreu após essas palavras. A oração temporal reproduz essa sequência em português natural.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: O verbo preserva a metáfora convencional do sono para a morte, em vez de substituí-la diretamente por “morreu”.
theological_decisions:
- issue: Metáfora da morte em ἐκοιμήθη
  choice: adormeceu
  alternative: morreu
  rationale: O grego emprega deliberadamente a imagem do sono para a morte de Estêvão. Mantê-la preserva o modo de expressão e o tom teológico do texto sem explicar além do que o versículo afirma.
- issue: Sentido de Κύριε na oração de Estêvão
  choice: Senhor
  alternative: Mestre
  rationale: O contexto anterior identifica Jesus como aquele a quem Estêvão se dirige. “Senhor” conserva o título cristológico normal sem acrescentar interpretação ao texto.
- issue: Sentido forense de μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: não lhes atribuas este pecado
  alternative: não os consideres culpados deste pecado
  rationale: A escolha mantém a imagem de lançar ou registrar o pecado contra alguém, mas evita determinar de modo mais explícito do que o grego a relação entre atribuição, culpa e perdão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa foi suavizada sem perder a sequência do grego. A metáfora final foi mantida, e a nota [a] foi ligada à expressão sobre atribuir o pecado, à qual lexicalmente pertence.
