review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a fuga de Moisés, sua residência como estrangeiro em Midiã e o nascimento de dois filhos. Contudo, λόγῳ está no singular; «dessa palavra» ou «dessa declaração» preserva melhor a formulação do grego do que o plural «dessas palavras». «Tornou-se pai de dois filhos» torna mais explícito o valor ativo de ἐγέννησεν com Moisés como sujeito, sem recorrer a um registro arcaico.
  naturalness: O texto revisto mantém português moderno e claro. «Por causa dessa palavra» é natural no registro bíblico-narrativo; «foi viver como estrangeiro» continua idiomático e acessível.
  terminology: «Estrangeiro» comunica adequadamente πάροικος neste contexto, sem a tecnicidade de «residente estrangeiro». «Terra de Midiã» preserva o elemento γῇ e o topônimo tradicional. A nota deve estar ancorada em «estrangeiro», não em «Midiã», pois explica πάροικος.
  issues:
  - severity: low
    issue: «dessas palavras» pluraliza λόγῳ, que está no singular.
    rationale: Embora o plural possa soar idiomático ao retomar a fala precedente, «dessa palavra» preserva melhor a forma e a ambiguidade da expressão grega.
  - severity: medium
    issue: A âncora da nota está em «Midiã», mas a nota explica «foi viver como estrangeiro»/πάροικος.
    rationale: A âncora deve acompanhar a expressão lexical que a nota esclarece, para não sugerir que a nota trata do topônimo.
  - severity: low
    issue: «teve dois filhos» é natural, mas deixa menos perceptível o valor de ἐγέννησεν com Moisés como sujeito.
    rationale: «Tornou-se pai de dois filhos» explicita de modo natural que Moisés gerou os filhos, sem usar o arcaico «gerou» ou «procriou».
  revised_text: Por causa dessa palavra, Moisés fugiu e foi viver como estrangeiro[a] na terra de Midiã, onde se tornou pai de dois filhos.
  revised_footnotes:
  - marker: a
    text: 'Ou: “tornou-se residente estrangeiro”. A expressão descreve alguém que vive numa terra que não é a sua.'
    reason: lexical_alternative
  revision_rationale: A revisão restaura o singular de λόγῳ, desloca a âncora para a expressão que a nota efetivamente explica e torna a paternidade de Moisés mais explicitamente correspondente ao verbo ativo ἐγέννησεν. Não altera o sentido do versículo nem introduz interpretação doutrinária.
