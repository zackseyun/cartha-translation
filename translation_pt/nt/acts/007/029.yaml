  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para tornar natural a relação entre a fala anterior e a fuga. “Foi viver como estrangeiro” preserva a condição de πάροικος sem recorrer a termos técnicos ou arcaicos.
