  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: pt
  text: Por causa dessa palavra, Moisés fugiu e foi viver como estrangeiro[a] na terra de Midiã, onde se tornou pai de dois filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se residente estrangeiro”. A expressão descreve alguém que vive numa terra que não é a sua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O aoristo de φεύγω indica que Moisés partiu para escapar; “fugiu” é direto, natural e preserva a força do verbo.
- source_word: δὲ
  choice: Por causa dessas palavras
  rationale: A conexão narrativa e causal é expressa em conjunto com ἐν τῷ λόγῳ τούτῳ. Em português, essa formulação comunica naturalmente que a fala anterior motivou a fuga.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: por causa dessas palavras
  rationale: A expressão pode indicar a ocasião ou a causa imediata da fuga. O plural idiomático “palavras” retoma naturalmente o que foi dito no contexto, sem mudar o referente.
- source_word: ἐγένετο πάροικος
  choice: foi viver como estrangeiro
  rationale: πάροικος designa quem reside numa terra que não é a sua. A formulação evita o pouco usual “residente estrangeiro” e comunica com clareza tanto residência quanto condição de forasteiro.
- source_word: ἐν γῇ Μαδιάμ
  choice: na terra de Midiã
  rationale: Mantém explicitamente γῇ e usa a forma portuguesa tradicional e corrente do topônimo.
- source_word: οὗ
  choice: onde
  rationale: O advérbio relativo retoma a terra de Midiã como o lugar do acontecimento seguinte.
- source_word: ἐγέννησεν
  choice: teve
  rationale: Com sujeito masculino e objeto “dois filhos”, o português natural emprega “teve”. Embora menos explícito que “gerou”, comunica adequadamente que Moisés se tornou pai sem soar arcaico ou sugerir que ele deu à luz.
- source_word: υἱοὺς δύο
  choice: dois filhos
  rationale: Equivalência direta, clara e idiomática para o substantivo masculino plural e o numeral.
theological_decisions: []
