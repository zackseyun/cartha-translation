  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: pt
  text: “Certamente vi os maus-tratos sofridos pelo meu povo no Egito[a], ouvi o gemido deles e desci para libertá-los[b]. Agora venha; vou enviá-lo ao Egito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a aflição do meu povo no Egito” ou “a opressão do meu povo no Egito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “resgatá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Certamente vi
  rationale: A combinação do particípio com o verbo finito é enfática e reflete o modo semítico de expressão da Septuaginta em Êxodo 3:7. “Certamente vi” comunica a ênfase em português natural sem reproduzir de modo artificial “vendo, vi”.
- source_word: κάκωσιν
  choice: os maus-tratos sofridos
  rationale: O substantivo denota tratamento cruel, aflição ou opressão. “Maus-tratos” expressa com clareza a ação injusta sofrida pelo povo sem restringir o sentido a uma forma específica de opressão.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: pelo meu povo no Egito
  rationale: Preserva a designação possessiva “meu povo” e apresenta naturalmente a localização indicada pela construção grega.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: o gemido deles
  rationale: Embora o pronome grego esteja no singular e retome coletivamente “povo”, o plural “deles” torna a referência clara em português. “Gemido” mantém a força de στεναγμός e a ligação com o relato do Êxodo.
- source_word: κατέβην
  choice: desci
  rationale: Mantém sem explicação adicional a linguagem antropomórfica da descida divina. O pretérito perfeito corresponde de forma direta ao aoristo grego e se encaixa na sequência narrativa.
- source_word: ἐξελέσθαι
  choice: para libertá-los
  rationale: Neste contexto, o infinitivo médio de ἐξαιρέω significa tirar alguém de uma situação de perigo ou opressão. “Libertar” é atual, claro e adequado ao contexto do êxodo; “resgatar” também é possível.
- source_word: δεῦρο
  choice: venha
  rationale: A partícula funciona aqui como chamado ou ordem para que Moisés se apresente. “Venha” é idiomático e mantém o tom direto.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: vou enviá-lo ao Egito
  rationale: Expressa naturalmente em português a declaração futura de comissionamento. “Ao Egito” indica o destino sem alterar o sentido.
theological_decisions:
- issue: Linguagem antropomórfica da descida divina
  choice: desci
  alternative: vim para intervir
  rationale: A tradução conserva a imagem textual de Deus descendo, sem substituí-la por uma explicação teológica ou metafórica.
- issue: Sentido da libertação em ἐξελέσθαι
  choice: libertá-los
  alternative: resgatá-los
  rationale: “Libertá-los” preserva a ação divina de retirar o povo da aflição sem acrescentar uma teoria específica sobre o modo dessa libertação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento “venha” e o pronome “-lo” mantêm coerência formal; a frase conserva a concisão e a força do discurso divino citado.
