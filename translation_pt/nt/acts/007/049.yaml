id: ACT.7.49
reference: Acts 7:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: pt
  text: O céu é o meu trono, e a terra é o estrado dos meus pés. Que espécie de casa vocês construirão para mim, diz o Senhor, ou qual é o lugar do meu descanso?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: o céu
  rationale: No contraste cósmico com a terra, refere-se ao céu como esfera celestial, e não apenas ao firmamento visível.
- source_word: θρόνος
  choice: trono
  rationale: Equivalente direto e natural que preserva a metáfora da soberania real.
- source_word: γῆ
  choice: a terra
  rationale: O alcance é cósmico, em paralelo com o céu, não o sentido restrito de território ou região.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: o estrado dos meus pés
  rationale: Expressão idiomática e digna em português, próxima da construção grega e com a imagem explícita dos pés preservada.
- source_word: ποῖον
  choice: que espécie de
  rationale: Expressa a pergunta pela natureza ou qualidade da casa, e não simplesmente por sua identidade.
- source_word: οἶκον
  choice: casa
  rationale: Mantém o termo genérico do grego; o contexto permite perceber sua referência ao templo sem explicitá-la na tradução.
- source_word: οἰκοδομήσετέ
  choice: vocês construirão
  rationale: Reproduz diretamente o futuro do indicativo dentro da pergunta retórica e explicita naturalmente o sujeito plural em português.
- source_word: κύριος
  choice: o Senhor
  rationale: Tradução convencional de κύριος na fórmula profética λέγει κύριος.
- source_word: τόπος
  choice: lugar
  rationale: Equivalente direto, corrente e adequado ao paralelismo retórico.
- source_word: καταπαύσεώς
  choice: descanso
  rationale: Preserva a forma nominal e a ressonância teológica da expressão 'lugar do meu descanso', sem convertê-la em mera habitação.
theological_decisions:
- issue: Tradução de κύριος na citação de Isaías em que fala o Deus de Israel
  choice: o Senhor
  alternative: o SENHOR
  rationale: A fonte neotestamentária apresenta κύριος; 'o Senhor' traduz o texto grego sem substituir a forma por uma representação tipográfica do nome divino hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A segunda pessoa do plural foi vertida por 'vocês', forma corrente no Brasil; a sintaxe conserva o paralelismo e a força retórica da citação.
