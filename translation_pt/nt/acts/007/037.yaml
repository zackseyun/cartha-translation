id: ACT.7.37
reference: Acts 7:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: pt
  text: 'Este é aquele Moisés que disse aos filhos de Israel[a]: “Deus levantará para vocês, dentre os seus irmãos[c], um profeta[b] como eu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos israelitas”. O grego diz literalmente “aos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais interpretativo: “o Profeta”, refletindo a conhecida expectativa baseada em Deuteronômio 18:15 e sua aplicação a Jesus em Atos.'
    reason: alternative_reading
  - marker: c
    text: Aqui, “irmãos” se refere aos demais israelitas; o termo grego está no masculino plural.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Este é aquele Moisés
  rationale: Preserva a identificação enfática e contrastiva do grego sem recorrer à construção pouco natural «este é o Moisés».
- source_word: εἴπας
  choice: que disse
  rationale: A oração relativa expressa com naturalidade o particípio aoristo atributivo.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: aos filhos de Israel
  rationale: Mantém a forma lexical masculina υἱοῖς e a expressão tradicional ligada ao contexto da citação veterotestamentária.
- source_word: Προφήτην
  choice: um profeta
  rationale: O substantivo está sem artigo; «um profeta» é a tradução direta e não antecipa no texto principal uma identificação interpretativa como «o Profeta».
- source_word: ἀναστήσει
  choice: levantará
  rationale: Conserva a imagem verbal de Deus fazer surgir um profeta, em correspondência com o uso profético de ἀνίστημι.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Forma portuguesa normal para o sujeito divino definido neste contexto.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa de modo claro e amplamente compreensível o dativo de interesse, evitando formas marcadamente regionais.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: dentre os seus irmãos
  rationale: «Dentre» comunica que o profeta surgiria do interior do próprio povo; «irmãos» preserva o masculino plural e o sentido nacional-familiar.
- source_word: ὡς ἐμέ
  choice: como eu
  rationale: Reproduz diretamente a comparação com Moisés, sem acrescentar uma oração ausente do texto grego.
theological_decisions:
- issue: Citação de Deuteronômio 18:15 e seu significado messiânico
  choice: Traduzir Προφήτην como «um profeta» no texto principal.
  alternative: «o Profeta»
  rationale: Embora Atos aplique a expectativa a Jesus, a forma grega aqui não tem artigo. A tradução mantém a formulação da profecia e deixa que o contexto estabeleça sua significação cristológica, sem a impor por capitalização ou artigo definido.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» como forma plural internacionalmente compreensível. «Aquele Moisés» mantém a ênfase identificadora do artigo grego sem soar tão regional ou artificial quanto «o Moisés». A ordem dos marcadores segue os respectivos termos no texto.
