  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: pt
  text: Mas, quando Jacó ouviu dizer que havia cereal no Egito[a], enviou nossos pais pela primeira vez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provisões no Egito”. O termo grego pode se referir mais amplamente a mantimentos, embora, neste contexto, provavelmente designe cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: quando ... ouviu dizer
  rationale: O particípio aoristo tem valor temporal em relação ao verbo principal; a formulação é natural em português e conserva a sequência narrativa.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição leve na narrativa de Estêvão; “Mas” preserva o movimento discursivo sem sugerir contraste forte.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: que havia cereal no Egito
  rationale: A construção de acusativo com particípio após ἀκούω é vertida naturalmente como discurso indireto. “No Egito” comunica de modo idiomático o sentido locativo de εἰς neste contexto.
- source_word: σιτία
  choice: cereal
  rationale: O plural de σιτίον pode designar cereais ou provisões. No contexto da fome e da história de José, “cereal” é preciso e natural, sem limitar indevidamente a referência a um cereal específico.
- source_word: ἐξαπέστειλεν
  choice: enviou ... para lá
  rationale: A expressão preserva naturalmente a ideia de mandar os irmãos em viagem ao Egito, sem reproduzir de modo artificial o prefixo ἐξ-.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nossos pais
  rationale: Mantém a linguagem familiar masculina do grego, que aqui se refere especificamente aos antepassados homens de Israel, isto é, aos filhos de Jacó.
- source_word: πρῶτον
  choice: pela primeira vez
  rationale: Indica a primeira de mais de uma viagem e antecipa com clareza a segunda visita mencionada na sequência.
theological_decisions:
- issue: Tradução de τοὺς πατέρας ἡμῶν
  choice: nossos pais
  alternative: nossos antepassados; os patriarcas
  rationale: “Nossos pais” conserva a forma familiar e masculina do texto, adequada porque a referência imediata é aos filhos de Jacó. “Antepassados” neutralizaria essa especificidade, e “patriarcas” seria mais interpretativo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. “Ouviu dizer” expressa idiomaticamente a informação recebida por Jacó; “para lá” torna explícito em português o destino já indicado pelo Egito, sem acrescentar conteúdo substantivo.
