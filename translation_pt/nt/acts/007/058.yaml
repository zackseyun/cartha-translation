  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: pt
  text: Depois de expulsá-lo da cidade, estavam apedrejando-o. As testemunhas deixaram seus mantos[a] aos pés de um jovem chamado Saulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas vestes” ou “suas capas”; o termo grego designa de modo amplo a roupa externa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: depois de expulsá-lo
  rationale: O particípio aoristo indica uma ação anterior à ação verbal principal. A formulação expressa a expulsão forçada e mantém clara a sequência narrativa.
- source_word: ἔξω τῆς πόλεως
  choice: da cidade
  rationale: Com “expulsá-lo”, a preposição portuguesa “de” comunica naturalmente o movimento do interior para fora da cidade.
- source_word: ἐλιθοβόλουν
  choice: ficaram apedrejando-o
  rationale: A construção perifrástica preserva o aspecto durativo do imperfeito grego, apresentando o apedrejamento como ação em andamento.
- source_word: οἱ μάρτυρες
  choice: as testemunhas
  rationale: No contexto judicial, o termo designa os que prestaram testemunho, não “mártires” no sentido cristão posterior.
- source_word: ἀπέθεντο
  choice: deixaram
  rationale: O verbo descreve o ato de tirar ou depositar as vestes. “Deixaram ... aos pés” é claro e idiomático em português.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: seus mantos
  rationale: Ἱμάτια refere-se de modo amplo a peças de roupa externas. “Mantos” é conciso e adequado ao contexto, enquanto a nota registra alternativas lexicalmente possíveis.
- source_word: παρὰ τοὺς πόδας
  choice: aos pés de
  rationale: É a expressão portuguesa natural para objetos depositados junto aos pés de alguém, possivelmente sob seus cuidados.
- source_word: νεανίου
  choice: um jovem
  rationale: Νεανίας denota um homem relativamente jovem; “um jovem” é atual, natural e não sugere idade excessivamente baixa.
- source_word: καλουμένου Σαύλου
  choice: chamado Saulo
  rationale: Reproduz de maneira direta e idiomática o particípio grego, preservando a apresentação inicial do personagem.
theological_decisions:
- issue: Sentido de μάρτυρες no contexto da execução
  choice: testemunhas, em sentido judicial
  alternative: mártires
  rationale: O contexto apresenta pessoas que haviam testemunhado e participavam da execução. Traduzir por “mártires” importaria um sentido eclesiástico posterior que não cabe nesta narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das ações e o aspecto contínuo do apedrejamento foram preservados sem tornar a frase excessivamente literal.
