lexical_decisions:
- source_word: κράξαντες
  choice: gritaram
  rationale: O particípio aoristo indica um grito forte ligado às ações seguintes. Em português, a coordenação com verbo finito produz uma narrativa mais natural sem alterar a sequência dos atos.
- source_word: δὲ
  choice: Mas
  rationale: Marca a virada contrastante entre a visão de Estêvão e a reação hostil dos ouvintes.
- source_word: φωνῇ μεγάλῃ
  choice: bem alto
  rationale: Equivalente idiomático e claro para a expressão que indica grande volume de voz.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: taparam os ouvidos
  rationale: Expressa naturalmente o gesto deliberado de impedir que continuassem ouvindo.
- source_word: ὥρμησαν
  choice: avançaram
  rationale: Comunica o movimento súbito e decidido em direção a Estêvão; o contexto e a preposição deixam clara a hostilidade sem acrescentar um advérbio de intensidade.
- source_word: ὁμοθυμαδὸν
  choice: todos juntos
  rationale: Preserva tanto a ação coletiva quanto a unidade de propósito, em linguagem portuguesa corrente.
- source_word: ἐπ’ αὐτόν
  choice: contra ele
  rationale: Com um verbo de movimento e em contexto hostil, traduz naturalmente a direção do avanço contra uma pessoa.
