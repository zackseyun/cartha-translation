  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: pt
  text: E Jacó desceu ao Egito. Ele e nossos pais morreram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”. O grego diz “nossos pais”, referindo-se aos antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: desceu
  rationale: Preserva a nuance direcional de καταβαίνω e a expressão geográfica tradicional para a viagem ao Egito.
- source_word: Ἰακώβ
  choice: Jacó
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: εἰς Αἴγυπτον
  choice: ao Egito
  rationale: Expressa naturalmente em português o movimento para o interior do território indicado por εἰς.
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: Equivalente moderno, claro e direto do verbo grego, sem recorrer a eufemismo.
- source_word: αὐτός
  choice: ele
  rationale: Mantém o pronome explícito e a estrutura enfática que associa Jacó aos pais de Israel.
- source_word: οἱ πατέρες ἡμῶν
  choice: os nossos pais
  rationale: Conserva o termo masculino e familiar do grego, que neste contexto se refere aos antepassados patriarcais de Israel.
theological_decisions:
- issue: Tradução de πατέρες na história ancestral de Israel
  choice: os nossos pais
  alternative: os nossos antepassados
  rationale: A expressão identifica os patriarcas de Israel, não apenas ancestrais de modo genérico. A tradução principal preserva a linguagem familiar e histórico-pactual do texto, enquanto a nota esclarece o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação concisa do grego foi preservada sem suavizar a repetição deliberada de “ele e os nossos pais”.
