  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: pt
  text: Não foi a minha mão que fez todas estas coisas?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais dinâmica: «Não fui eu que fiz todas estas coisas?»'
    reason: lexical_alternative
  - marker: b
    text: Esta frase ecoa Isaías 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Não foi... que fez?
  rationale: οὐχί introduz uma pergunta retórica que espera resposta afirmativa. A construção enfática com «não foi... que» transmite essa força de modo natural em português.
- source_word: ἡ χείρ μου
  choice: a minha mão
  rationale: Mantém a imagem concreta e antropomórfica do grego e da citação de Isaías 66:2, em vez de substituí-la por uma abstração como «meu poder».
- source_word: ἐποίησεν
  choice: fez
  rationale: ποιέω indica aqui fazer ou trazer à existência. «Fez» é corrente, digno e adequado ao contexto da criação.
- source_word: ταῦτα πάντα
  choice: todas estas coisas
  rationale: Preserva tanto a abrangência de πάντα quanto a força demonstrativa de ταῦτα.
theological_decisions:
- issue: Linguagem antropomórfica a respeito de Deus
  choice: Conservar «a minha mão» como expressão da ação criadora divina
  alternative: Traduzir dinamicamente como «Não fui eu que fiz todas estas coisas?» ou interpretativamente como «Não foi o meu poder que fez todas estas coisas?»
  rationale: A formulação ecoa Isaías 66:2 e emprega deliberadamente a imagem da mão de Deus. Preservá-la mantém a ligação intertextual e a força retórica sem impor uma paráfrase teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção «Não foi a minha mão que fez...» preserva a imagem do original e soa clara e digna, embora a nota ofereça uma formulação mais dinâmica.
