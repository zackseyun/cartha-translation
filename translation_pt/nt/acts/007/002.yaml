id: ACT.7.2
reference: Acts 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: pt
  text: 'E ele disse: “Irmãos e pais, escutem! O Deus da glória apareceu ao nosso pai Abraão quando ele estava na Mesopotâmia, antes de morar em Harã.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes de se estabelecer em Harã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: E ele disse
  rationale: δέ tem aqui força conectiva leve; a formulação mantém a continuidade narrativa sem introduzir contraste indevido.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Irmãos e pais
  rationale: Forma de tratamento solene e explicitamente masculina. Em português, “irmãos e pais” expressa naturalmente a relação com o auditório, sem uma tradução artificial e redundante de ἄνδρες como termo separado.
- source_word: ἀκούσατε
  choice: escutem
  rationale: Imperativo direto que solicita atenção; “escutem” é corrente, claro e natural em português.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: O Deus da glória
  rationale: Preserva a construção genitiva e sua possível ressonância bíblica, em vez de reduzi-la ao adjetivo “glorioso”.
- source_word: ὤφθη
  choice: apareceu
  rationale: Em contexto de manifestação divina, o passivo de ὁράω tem naturalmente o sentido de “apareceu”; “revelou-se” seria mais interpretativo.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: ao nosso pai Abraão
  rationale: Mantém a identificação comunitária expressa por “nosso pai” e segue uma ordem natural em português.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: quando ele estava na Mesopotâmia
  rationale: Explicita de modo natural o valor temporal/circunstancial do particípio.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: antes de morar em Harã
  rationale: κατοικέω pode significar morar, habitar ou estabelecer-se. “Morar” é acessível e evita pressupor, no texto principal, a nuance mais específica de fixação permanente.
theological_decisions:
- issue: Forma masculina de tratamento do auditório
  choice: Irmãos e pais
  alternative: Homens, irmãos e pais
  rationale: A tradução conserva os termos relacionais masculinos e o caráter formal do tratamento, mas não verte ἄνδρες separadamente, pois nessa fórmula sua força já está incorporada à interpelação em português.
- issue: Título divino θεὸς τῆς δόξης
  choice: O Deus da glória
  alternative: O Deus glorioso
  rationale: A construção com “da glória” preserva a forma do grego e possíveis ecos intertextuais, sem resolver a relação genitiva por meio de uma paráfrase adjetival.
- issue: Nuance de κατοικέω em Harã
  choice: morar em Harã
  alternative: estabelecer-se em Harã
  rationale: O verbo admite ambas as nuances. O texto principal usa a opção mais geral e a nota registra a possibilidade de residência estabelecida, preservando a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala mantém solenidade por meio de “Irmãos e pais” e “O Deus da glória”, sem arcaísmos como “ouvi” ou “habitar”.
