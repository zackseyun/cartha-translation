  source_fidelity: 'A versão verte adequadamente κύριος, o imperativo Λῦσον, γάρ e γῆ ἁγία. Contudo, o texto grego de SBLGNT traz τὸ ὑπόδημα no singular; «as sandálias» harmoniza indevidamente o texto com formulações mais familiares. Além disso, «onde você está» deixa implícita a postura expressa por ἕστηκας, cujo perfeito tem aqui sentido de estado presente: «está em pé».'
  naturalness: «Então o Senhor lhe disse» e «pois» são naturais, claros e adequados ao registro bíblico moderno. «Tire a sandália dos seus pés» conserva o singular da fonte; embora menos idiomática que o plural em português contemporâneo, é compreensível e justificada pela fidelidade ao texto-base.
  terminology: «Senhor» é apropriado para κύριος, sem introduzir «SENHOR», que não está no grego. «Terra santa» é uma boa equivalência contextual para γῆ ἁγία e não exige o sentido geográfico de uma região.
