  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: pt
  text: 'Então o Senhor lhe disse: “Tire a sandália dos seus pés, pois o lugar onde você está em pé é terra santa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título reverente normalmente usado para κύριος e segue diretamente o texto grego, sem introduzir a forma “SENHOR” associada ao tetragrama no Antigo Testamento.
- source_word: Λῦσον
  choice: Tire
  rationale: Embora o verbo signifique literalmente “solte” ou “desamarre”, no contexto do calçado a ordem idiomática é removê-lo; “tire” é natural e claro em português moderno.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: as sandálias dos pés
  rationale: O grego traz ὑπόδημα no singular coletivo e “pés” no plural. O plural “sandálias” expressa naturalmente em português o calçado usado nos dois pés, sem alterar o sentido da ordem.
- source_word: ὁ γὰρ τόπος ἐφ’ ᾧ ἕστηκας
  choice: pois o lugar onde você está
  rationale: “Pois” preserva o valor explicativo de γάρ. A construção natural “onde você está” comunica o estado presente expresso pelo perfeito ἕστηκας sem a rigidez de “sobre o qual você está em pé”.
- source_word: γῆ ἁγία
  choice: terra santa
  rationale: No contexto local, γῆ designa o solo ou terreno. “Terra santa” é uma expressão portuguesa clara e tradicional, aqui predicativa e sem referência necessária a uma região geográfica.
theological_decisions:
- issue: Tradução de κύριος numa citação teofânica de Êxodo
  choice: Senhor
  alternative: SENHOR
  rationale: Atos 7:33 contém κύριος, não o tetragrama hebraico. “Senhor” respeita a forma do texto grego e mantém a reverência sem inserir uma distinção tipográfica ausente da fonte imediata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para clareza contemporânea e discurso direto natural. O singular morfológico de ὑπόδημα é entendido coletivamente e vertido pelo plural idiomático “sandálias”.
