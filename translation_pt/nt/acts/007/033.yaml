    rationale: O texto crítico fornecido tem «a sandália», não «as sandálias». A tradução deve manter esse singular, ainda que o plural seja mais idiomático e reflita tradições paralelas ou harmonizadas.
  - severity: low
    issue: «onde você está» não explicita a ideia de estar em pé em ἕστηκας.
    rationale: A expressão pode comunicar localização, mas omite a postura que o verbo grego expressa. «Onde você está em pé» preserva o sentido sem artificialidade excessiva.
