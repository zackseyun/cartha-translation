id: ACT.7.39
reference: Acts 7:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: pt
  text: Nossos pais não quiseram tornar-se obedientes a ele, mas o rejeitaram[a] e, em seus corações, voltaram-se para o Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o afastaram”. O verbo grego pode sugerir mais concretamente que Moisés foi empurrado para o lado.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, embora ainda estivessem no deserto, interiormente desejavam voltar ao Egito.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: a ele
  rationale: Pronome relativo no dativo, retomando Moisés; em português, funciona naturalmente como complemento de «obedientes».
- source_word: οὐκ ἠθέλησαν
  choice: não quiseram
  rationale: Expressa recusa deliberada de vontade de modo claro e natural, sem enfraquecer a oposição do texto.
- source_word: ὑπήκοοι γενέσθαι
  choice: tornar-se obedientes
  rationale: Preserva tanto o sentido adjetival de ὑπήκοοι como o valor de mudança expresso por γενέσθαι.
- source_word: οἱ πατέρες ἡμῶν
  choice: nossos pais
  rationale: Mantém a formulação direta e tradicional para os antepassados de Israel, sendo compreensível no contexto.
- source_word: ἀπώσαντο
  choice: o rejeitaram
  rationale: Comunica claramente o repúdio a Moisés; a alternativa mais concreta «o afastaram» é registrada em nota.
- source_word: ἐστράφησαν
  choice: voltaram-se
  rationale: Indica mudança de orientação em direção ao Egito e preserva a força reflexiva da construção.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: no coração
  rationale: Conserva o idioma bíblico referente ao interior, aos desejos e às intenções; o singular distributivo é natural em português.
- source_word: εἰς Αἴγυπτον
  choice: para o Egito
  rationale: Expressa a direção da reorientação interior indicada por εἰς sem acrescentar uma volta física efetiva.
theological_decisions:
- issue: Natureza da volta de Israel ao Egito
  choice: «no coração, voltaram-se para o Egito»
  alternative: «voltaram ao Egito em seu coração»
  rationale: A expressão explícita «no coração» apresenta uma reorientação interior de desejo e lealdade. A tradução preserva a tensão entre a localização física no deserto e o anseio por retornar ao Egito, sem reduzir a frase a uma volta literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Nossos pais» conserva a linguagem de parentesco do grego; «no coração» mantém o conhecido idioma bíblico sem perder clareza.
