  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: pt
  text: E os patriarcas, por inveja de José, venderam-no para o Egito; e Deus estava com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: os patriarcas
  rationale: Designa especificamente os filhos de Jacó como antepassados fundadores de Israel; “patriarcas” é preciso, tradicional e compreensível em português.
- source_word: ζηλώσαντες
  choice: movidos pela inveja contra José
  rationale: O particípio aoristo indica a motivação que levou à venda. A formulação explicita essa relação sem acrescentar conteúdo e traduz naturalmente o sentido negativo de ζηλόω neste contexto.
- source_word: ἀπέδοντο
  choice: venderam-no
  rationale: No contexto da narrativa de José, o verbo se refere concretamente à sua venda, e não apenas a uma entrega genérica.
- source_word: εἰς Αἴγυπτον
  choice: para o Egito
  rationale: Expressa de modo idiomático em português o movimento ou destino indicado por εἰς; evita a formulação menos natural “dentro do Egito”.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Deus estava com ele
  rationale: Preserva a afirmação simples e enfática da presença divina junto de José, mantendo claro o referente do pronome.
theological_decisions:
- issue: A presença divina no sofrimento de José
  choice: mas Deus estava com ele
  alternative: e Deus estava com ele
  rationale: Embora καί costume significar “e”, aqui a conjunção liga a traição dos patriarcas à presença contínua de Deus em uma relação contextual de contraste. “Mas” torna esse contraste natural em português sem ampliar a afirmação para uma explicação da providência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “venderam-no” mantém concisão e elevação moderada; “movidos pela inveja” comunica com clareza a função causal do particípio.
