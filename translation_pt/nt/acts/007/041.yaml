  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: pt
  text: Naqueles dias, fizeram um bezerro[a], ofereceram um sacrifício ao ídolo e se alegravam com as obras de suas mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «moldaram um bezerro».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «celebravam aquilo que suas mãos haviam feito».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: fizeram um bezerro
  rationale: Expressa de modo claro e conciso o ato de fazer ou fabricar um bezerro; a menção seguinte ao «ídolo» deixa evidente sua natureza cultual.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Naqueles dias
  rationale: Mantém a expressão temporal grega em português natural e corrente.
- source_word: ἀνήγαγον θυσίαν
  choice: ofereceram um sacrifício
  rationale: No contexto cultual, o verbo designa a apresentação de uma oferta; esta formulação comunica diretamente o ato sacrificial.
- source_word: τῷ εἰδώλῳ
  choice: ao ídolo
  rationale: O artigo aponta para o bezerro recém-mencionado, e «ídolo» conserva a força crítica de εἴδωλον.
- source_word: εὐφραίνοντο
  choice: se alegravam
  rationale: O pretérito imperfeito preserva o aspecto durativo do imperfeito grego sem acrescentar a ideia mais interpretativa de uma celebração formal.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: com as obras de suas mãos
  rationale: Conserva a imagem bíblica tradicional de algo produzido por mãos humanas, enquanto «com» comunica em português natural o motivo ou objeto da alegria.
theological_decisions:
- issue: Linguagem de idolatria e força retórica
  choice: Traduzir εἴδωλον por «ídolo» e preservar a expressão «obras de suas mãos».
  alternative: «imagem» e «aquilo que suas mãos haviam feito»
  rationale: O discurso de Estêvão denuncia a idolatria de Israel em linguagem que ecoa a crítica bíblica aos objetos feitos por mãos humanas. A tradução mantém essa acusação sem reduzir a expressão a uma referência neutra ao artesanato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo narrativo e emprega o pretérito imperfeito em «se alegravam» para refletir o aspecto verbal grego.
