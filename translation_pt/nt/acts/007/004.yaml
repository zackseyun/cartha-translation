source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: pt
  text: Então, depois de sair da terra dos caldeus, ele se estabeleceu em Harã. E dali, depois que seu pai morreu, ele o fez mudar-se[a] para esta terra em que vocês agora vivem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus o fez mudar-se”. O grego não declara explicitamente o sujeito, embora o contexto aponte para Deus.'
    reason: lexical_alternative
  - marker: b
    text: Estêvão diz que essa mudança ocorreu depois da morte do pai de Abraão. Compare Gênesis 11:32; 12:4 quanto à cronologia relacionada.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal na narrativa de Estêvão.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: depois de sair da terra dos caldeus
  rationale: O particípio aoristo indica ação anterior ao verbo principal; a formulação preserva com clareza a sequência e a expressão geográfica completa.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ele se estabeleceu em Harã
  rationale: “Se estabeleceu” comunica que passou a residir ali; “Harã” é a forma consagrada em português.
- source_word: κἀκεῖθεν
  choice: E dali
  rationale: Representa tanto o elemento conjuntivo καί quanto a ideia de procedência de ἐκεῖθεν.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: depois que seu pai morreu
  rationale: A construção temporal com infinitivo articulado é expressa de modo claro e natural em português.
- source_word: μετῴκισεν αὐτὸν
  choice: Deus o transferiu
  rationale: O verbo é causativo e significa fazer alguém mudar de residência. O sujeito não está expresso no grego, mas o contexto aponta para Deus; a nota preserva a ambiguidade gramatical.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: para esta terra em que vocês agora vivem
  rationale: “Para” exprime o movimento de destino, e “em que vocês agora vivem” verte idiomaticamente a relação locativa do segundo εἰς.
theological_decisions:
- issue: Sujeito não expresso de μετῴκισεν
  choice: Explicitar “Deus” no texto, com nota sobre a ausência de sujeito expresso no grego
  alternative: “ele o transferiu”
  rationale: O contexto imediato apresenta Deus como agente, mas a nota evita ocultar a ambiguidade formal do texto grego.
- issue: Tensão cronológica com Gênesis
  choice: 'Traduzir sem harmonizar: “depois que seu pai morreu”'
  alternative: Reformular a sequência para conciliá-la explicitamente com Gênesis 11:32 e 12:4
  rationale: A tradução deve preservar a sequência narrativa apresentada por Estêvão, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “terra dos caldeus”, evita linguagem arcaica e preserva por nota tanto a ambiguidade do sujeito quanto a tensão cronológica.
