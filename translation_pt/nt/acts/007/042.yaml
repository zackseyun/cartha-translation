  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: pt
  text: 'Mas Deus se afastou deles e os entregou para que prestassem culto ao exército do céu[a], como está escrito no livro dos profetas[b]: “Por acaso vocês me ofereceram animais abatidos e sacrifícios durante quarenta anos no deserto, ó casa de Israel?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «adorassem o exército do céu». A expressão «exército do céu» pode designar os corpos celestes e, por extensão, os poderes celestes associados ao culto idólatra.
    reason: Alternativa lexical e nota cultural.
  - marker: b
    text: Ou «no rolo dos profetas».
    reason: Alternativa lexical e histórica para βίβλος.
  - marker: c
    text: Citação de Amós 5:25.
    reason: Referência cruzada.
lexical_decisions:
- source_word: ἔστρεψεν
  choice: se afastou deles
  rationale: No contexto de juízo, expressa retirada relacional, e não mero movimento físico; o pronome explicita em português o referente já presente no contexto.
- source_word: παρέδωκεν αὐτούς
  choice: os entregou
  rationale: Preserva a ideia forte de abandono ou entrega judicial, sem afirmar que Deus tenha sido o autor da idolatria.
- source_word: λατρεύειν
  choice: prestassem culto
  rationale: Comunica claramente serviço religioso e preserva a dimensão cultual do verbo; a nota registra a alternativa mais direta «adorassem».
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: ao exército do céu
  rationale: Mantém a expressão bíblica coletiva sem restringi-la somente às estrelas, aos astros ou aos anjos.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: no livro dos profetas
  rationale: É uma formulação natural em português; βίβλος também pode designar um rolo, alternativa registrada em nota.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: Foi a mim que vocês ofereceram...?
  rationale: A construção interrogativa com μή espera resposta negativa. A forma focalizada conserva a força retórica e a ênfase do dativo μοι sem converter a pergunta em declaração.
- source_word: σφάγια καὶ θυσίας
  choice: animais abatidos e sacrifícios
  rationale: «Animais abatidos» torna perceptível o sentido de vítimas sacrificiais de σφάγια, enquanto «sacrifícios» traduz naturalmente θυσίας.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: durante quarenta anos no deserto
  rationale: Formulação corrente e clara que conserva tanto a duração quanto o cenário do êxodo.
- source_word: οἶκος Ἰσραήλ
  choice: ó casa de Israel
  rationale: Conserva o vocativo coletivo e a expressão bíblica tradicional, em registro digno.
theological_decisions:
- issue: A ação divina no juízo
  choice: Deus «se afastou deles e os entregou»
  alternative: Deus apenas permitiu a idolatria; ou Deus os fez praticá-la
  rationale: Os verbos coordenados apresentam uma entrega judicial em resposta à rebelião anterior. A tradução mantém essa severidade sem dizer que Deus produziu positivamente o pecado.
- issue: O referente de «exército do céu»
  choice: Expressão ampla para os corpos ou poderes celestes que se tornaram objetos de culto idólatra
  alternative: Somente os anjos; ou especificamente as estrelas
  rationale: O texto não delimita o referente com precisão. A expressão bíblica foi mantida para preservar essa amplitude.
- issue: A pergunta de Amós 5:25
  choice: Pergunta retórica que espera resposta negativa
  alternative: Pergunta neutra; ou afirmação explícita de que nenhum sacrifício foi oferecido
  rationale: A partícula μή sinaliza a resposta esperada, mas a forma interrogativa do original deve ser preservada, inclusive sua tensão com as tradições sobre sacrifícios no deserto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural e conserva «ó casa de Israel» como vocativo bíblico. As notas foram posicionadas junto às expressões a que se referem e todos os marcadores aparecem no texto principal.
