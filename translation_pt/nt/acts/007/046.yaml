  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: pt
  text: o qual encontrou favor diante de Deus e pediu que encontrasse uma morada para o Deus de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um tabernáculo para o Deus de Jacó”.'
    reason: Alternativa lexical para σκήνωμα.
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: encontrou favor
  rationale: A expressão idiomática significa obter favor. “Encontrou favor” é natural em português e mantém o sentido relacional.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: A locução indica estar perante alguém ou à sua vista; “diante de Deus” é conciso e idiomático.
- source_word: ᾐτήσατο
  choice: pediu
  rationale: A forma média expressa a apresentação de um pedido; “pediu” é claro e atual.
- source_word: εὑρεῖν
  choice: para encontrar
  rationale: Preserva o sentido formal do infinitivo grego, sem explicitar como “providenciar” ou “obter” aquilo que o texto deixa implícito.
- source_word: σκήνωμα
  choice: uma morada
  rationale: O substantivo designa um lugar de habitação. “Morada” comunica o sentido amplo sem identificá-lo prematuramente como tabernáculo ou templo.
- source_word: τῷ θεῷ Ἰακώβ
  choice: para o Deus de Jacó
  rationale: O dativo é naturalmente expresso por “para”, e “o Deus de Jacó” preserva a formulação pactual das Escrituras.
theological_decisions:
- issue: A natureza da estrutura solicitada por Davi no resumo histórico de Estêvão
  choice: uma morada para o Deus de Jacó
  alternative: um tabernáculo para o Deus de Jacó
  rationale: 'σκήνωμα é mais amplo que a terminologia técnica para o templo. A tradução mantém a tensão narrativa: Davi deseja uma morada, e no versículo seguinte Salomão constrói a casa.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “pediu para encontrar” preserva deliberadamente a formulação do grego, embora seja menos idiomática que “pediu para providenciar”.
