id: ACT.7.20
reference: Acts 7:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: pt
  text: Naquele tempo, nasceu Moisés, que era belo aos olhos de Deus.[a] Durante três meses, ele foi criado na casa de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “belo para Deus”. O termo grego também pode significar “formoso”, “de boa aparência” ou “excepcional”; a referência a Deus é explícita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Naquele tempo
  rationale: Expressão temporal idiomática em português, preservando a referência ao período mencionado no contexto.
- source_word: ἐγεννήθη Μωϋσῆς
  choice: nasceu Moisés
  rationale: Tradução natural do aoristo passivo de γεννάω no contexto de nascimento, com o nome em sua forma portuguesa consagrada.
- source_word: ἀστεῖος τῷ θεῷ
  choice: belo aos olhos de Deus
  rationale: Preserva tanto o sentido básico de ἀστεῖος quanto a referência explícita à avaliação de Deus expressa pelo dativo τῷ θεῷ, sem definir além do texto se a beleza era física ou uma qualidade excepcional.
- source_word: ὃς ἀνετράφη
  choice: ele foi criado
  rationale: O pronome retoma claramente Moisés, e a voz passiva comunica que ele recebeu cuidados e foi criado.
- source_word: μῆνας τρεῖς
  choice: Durante três meses
  rationale: Forma portuguesa natural de expressar a duração.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: na casa de seu pai
  rationale: Preserva o sentido doméstico e familiar de οἶκος e a referência paterna sem rigidez sintática.
theological_decisions:
- issue: Sentido de ἀστεῖος τῷ θεῷ
  choice: belo aos olhos de Deus
  alternative: belo para Deus; formoso diante de Deus; uma criança extraordinária aos olhos de Deus
  rationale: A tradução mantém explícita a referência a Deus como aquele em cuja avaliação Moisés era belo, mas não transforma a frase em uma afirmação doutrinária mais forte nem elimina sua possível dimensão física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial conserva o vínculo temporal; a segunda oração foi integrada por meio de uma relativa para maior naturalidade. O marcador [a] aparece imediatamente após a expressão que a nota esclarece.
