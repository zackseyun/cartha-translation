  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: pt
  text: Quando ouviram essas coisas[a], enfureceram-se no íntimo e rangeram os dentes contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «foram traspassados no coração»; o verbo grego significa literalmente «ser cortado através de» e descreve intensa agitação interior, aqui expressa como ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ
  choice: Quando ouviram
  rationale: O particípio apresenta a circunstância temporal dos verbos principais. «Quando ouviram» é natural em português; δέ marca a progressão narrativa e não exige aqui um conectivo expresso.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo plural retoma o conteúdo do discurso anterior de Estêvão. «Essas coisas» mantém o plural e soa natural no contexto.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: ficaram enfurecidos no íntimo
  rationale: O verbo, literalmente associado a ser cortado ou serrado por dentro, expressa intensa agitação interior; no contexto hostil, «ficaram enfurecidos» comunica claramente seu valor, enquanto «no íntimo» preserva a esfera indicada por «seus corações».
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: rangeram os dentes
  rationale: Expressão portuguesa corrente que preserva a imagem vívida e indica ira intensa.
- source_word: ἐπ’ αὐτόν
  choice: contra ele
  rationale: Com essa ação hostil, ἐπί indica o alvo da hostilidade; «contra ele» é idiomático e mantém essa direção.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o possível equívoco de «ficaram com o coração cortado», que em português pode sugerir tristeza ou arrependimento, e comunica a ira indicada pelo contexto sem apagar totalmente a dimensão interior da expressão grega.
