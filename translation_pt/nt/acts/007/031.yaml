id: ACT.7.31
reference: Acts 7:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: pt
  text: 'Ao ver aquilo[a], Moisés ficou admirado com a visão. E, quando se aproximava para olhar atentamente, veio uma voz do Senhor[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao ver a visão”. O grego permite relacionar diretamente o ato de ver com “a visão” mencionada em seguida.'
    reason: lexical_alternative
  - marker: b
    text: Alguns podem esperar “SENHOR” por causa da referência a Êxodo 3; aqui, porém, o texto grego diz “Senhor” (κύριος).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Ao ver aquilo
  rationale: O particípio aoristo indica uma ação anterior à principal. A formulação é natural em português, e “aquilo” retoma sem excesso interpretativo o fenômeno visível mencionado a seguir.
- source_word: ἐθαύμασεν
  choice: ficou admirado
  rationale: Expressa espanto e admiração diante do fenômeno, em linguagem corrente e digna.
- source_word: τὸ ὅραμα
  choice: a visão
  rationale: “Visão” preserva a amplitude semântica de ὅραμα, que pode designar tanto uma aparição visível quanto uma visão reveladora, sem decidir além do que o grego permite.
- source_word: προσερχομένου
  choice: quando se aproximava
  rationale: O genitivo absoluto exprime circunstância temporal simultânea; o imperfeito verbal em português preserva o movimento em curso.
- source_word: κατανοῆσαι
  choice: para olhar atentamente
  rationale: Representa o exame visual cuidadoso expresso por κατανοέω e soa natural no contexto.
- source_word: ἐγένετο φωνὴ
  choice: veio uma voz
  rationale: Conserva a construção eventiva do grego sem acrescentar “foi ouvida”, que não está explícito.
- source_word: κυρίου
  choice: do Senhor
  rationale: Traduz κύριος diretamente como “Senhor”; o artigo exigido pela contração portuguesa não implica que o texto grego contenha o Tetragrama.
theological_decisions:
- issue: Tradução de κύριος no contexto de uma teofania
  choice: Senhor
  alternative: SENHOR
  rationale: Embora a cena remeta a Êxodo 3 e, portanto, a YHWH, o texto grego traz κύριος. “Senhor” representa a forma grega sem inserir na tradução o Tetragrama não expresso.
translation_notes:
  register: Português moderno, claro e narrativo, com leve dignidade literária. “Ficou admirado” evita o tom arcaico de “maravilhou-se”; “olhar atentamente” comunica de modo acessível a observação cuidadosa. A ordem das notas foi normalizada conforme sua ocorrência no texto.
