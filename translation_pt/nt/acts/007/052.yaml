    rationale: No discurso de Estêvão, οἱ πατέρες ὑμῶν refere-se aos antepassados de Israel. «Antepassados de vocês» torna esse referente explícito e natural em português, sem eliminar o sentido histórico-coletivo do grego.
  - severity: low
    issue: A nota [a] oferece «do Justo Homem».
    rationale: Essa formulação não é uma alternativa lexical idiomática ou necessária para τοῦ δικαίου; pode sugerir um título ou uma expansão que o grego não exige.
  - severity: low
