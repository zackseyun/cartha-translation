revisions:
- from: Qual dos profetas os pais de vocês não perseguiram? E mataram os que anunciaram de antemão a vinda do Justo[a], de quem agora vocês se tornaram traidores[b] e assassinos.
  to: Qual dos profetas os antepassados de vocês não perseguiram? E eles mataram os que anunciaram de antemão a vinda do Justo, de quem agora vocês se tornaram traidores e assassinos.
  rationale: Substituiu-se «os pais de vocês» por «os antepassados de vocês» para refletir claramente o referente histórico de οἱ πατέρες ὑμῶν no português moderno. Acrescentou-se «eles» para deixar inequívoco que os antepassados são o sujeito de «mataram». Removeram-se notas que não apresentavam uma alternativa lexical portuguesa segura ou que acrescentavam explicação contextual desnecessária. O sentido, a força retórica e a ambiguidade não disputada do texto-fonte foram preservados.
