  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: pt
  text: Qual dos profetas os antepassados de vocês não perseguiram? E eles mataram os que anunciaram de antemão a vinda do Justo, de quem agora vocês se tornaram traidores e assassinos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Qual dos profetas
  rationale: Reproduz naturalmente a construção partitiva e preserva a força da pergunta retórica, cuja resposta implícita é que nenhum profeta escapou da perseguição.
- source_word: ἐδίωξαν
  choice: perseguiram
  rationale: No contexto, o verbo indica perseguição hostil aos profetas; “perseguiram” é claro, corrente e semanticamente preciso.
- source_word: οἱ πατέρες ὑμῶν
  choice: os pais de vocês
  rationale: Mantém a imagem e a formulação mais literal do grego, bem como a continuidade acusatória entre os antepassados e os ouvintes; uma nota registra a alternativa idiomática “antepassados”.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Tradução direta e moderna do aoristo, sem arcaísmo ou intensificação interpretativa.
- source_word: τοὺς προκαταγγείλαντας
  choice: os que anunciaram de antemão
  rationale: Preserva tanto o ato de anunciar quanto a anterioridade expressa pelo prefixo προ-.
- source_word: περὶ τῆς ἐλεύσεως
  choice: a vinda
  rationale: Com o verbo “anunciar de antemão”, esta formulação é natural em português e comunica adequadamente a chegada futura da figura mencionada.
- source_word: τοῦ δικαίου
  choice: do Justo
  rationale: O artigo e o singular conferem à expressão caráter designativo; “o Justo” é conciso, natural e mantém a conexão lexical com justiça, sem acrescentar uma identificação além do contexto.
- source_word: οὗ
  choice: de quem
  rationale: Preserva a ligação genitiva entre “o Justo” e os predicativos “traidores e assassinos”.
- source_word: νῦν
  choice: agora
  rationale: Mantém o contraste temporal entre a conduta dos antepassados e a culpa presente dos ouvintes.
- source_word: προδόται
  choice: traidores
  rationale: Expressa quem entrega ou trai outra pessoa; em português, “traidores” é a forma nominal mais natural, enquanto “os que o traíram” seria mais explicativa.
- source_word: φονεῖς
  choice: assassinos
  rationale: Comunica a acusação moral de homicídio culpável com maior precisão do que o termo genérico “matadores”.
- source_word: ἐγένεσθε
  choice: se tornaram
  rationale: Conserva o valor ingressivo de “tornar-se”; combinado com “agora”, também deixa perceptível o estado resultante.
theological_decisions:
- issue: Valor cristológico de τοῦ δικαίου
  choice: o Justo
  alternative: o Justo Homem; aquele que é justo
  rationale: No discurso, a expressão designa uma figura específica cuja vinda foi anunciada pelos profetas. A forma substantivada e capitalizada preserva a força de título ou designação sem expandir o texto.
- issue: Relação de culpa expressa por προδόται καὶ φονεῖς
  choice: traidores e assassinos
  alternative: os que o traíram e mataram
  rationale: Os substantivos gregos atribuem diretamente essas identidades aos ouvintes. A tradução mantém a severidade da acusação sem reformulá-la como simples descrição verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e o encadeamento por “E” seguem de perto a estrutura grega. Evitou-se “vossos pais”, por soar arcaico, e manteve-se “os pais de vocês”, com a alternativa “antepassados” em nota.
