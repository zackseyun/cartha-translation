review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a pergunta retórica, a perseguição aos profetas, o anúncio prévio da vinda do Justo e a acusação final. Contudo, em português atual, «os pais de vocês» tende a designar os progenitores imediatos e não comunica com suficiente clareza o referente coletivo-histórico de οἱ πατέρες ὑμῶν neste contexto. «Antepassados de vocês» preserva o sentido contextual sem alterar a acusação de Estêvão.
  naturalness: «Antepassados de vocês» é mais claro para leitores contemporâneos. A explicitação de «eles» depois da pergunta evita que o sujeito de «mataram» possa ser momentaneamente associado aos profetas mencionados. O restante tem registro moderno e sóbrio.
  terminology: '«O Justo» preserva adequadamente o uso titular de τοῦ δικαίου. «Traidores e assassinos» é uma boa correspondência para προδόται καὶ φονεῖς. As notas do rascunho não são necessárias: «Justo Homem» não é uma alternativa lexical natural em português para a expressão grega, e a segunda nota introduz uma explicação contextual que vai além de uma alternativa de tradução.'
  issues:
