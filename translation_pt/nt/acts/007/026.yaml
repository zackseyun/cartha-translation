id: ACT.7.26
reference: Acts 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: pt
  text: 'No dia seguinte, ele apareceu a eles enquanto brigavam e tentava reconciliá-los[a], dizendo: “Homens, vocês são irmãos; por que fazem mal um ao outro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procurava levá-los à paz”. O imperfeito grego pode descrever uma ação em andamento; neste contexto, provavelmente apresenta uma tentativa, pois a intervenção de Moisés é rejeitada no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: No dia seguinte
  rationale: Expressa de modo natural o dativo temporal e a sequência narrativa.
- source_word: ὤφθη
  choice: apareceu
  rationale: 'A forma passiva de ὁράω tem aqui sentido intransitivo comum em narrativa: ele se tornou visível ou se apresentou diante deles.'
- source_word: αὐτοῖς μαχομένοις
  choice: a eles enquanto brigavam
  rationale: O particípio no dativo descreve a ação em andamento no momento em que Moisés apareceu.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: tentava reconciliá-los
  rationale: O imperfeito pode indicar uma ação em curso ou uma tentativa; o contexto seguinte mostra que a intervenção não teve êxito. “Reconciliá-los” comunica naturalmente o movimento em direção à paz expresso por εἰς εἰρήνην.
- source_word: Ἄνδρες
  choice: Homens
  rationale: Preserva o vocativo explícito dirigido aos dois homens, sem acrescentar uma nuance de cortesia como “senhores”.
- source_word: ἀδελφοί ἐστε
  choice: vocês são irmãos
  rationale: Mantém o apelo à fraternidade compartilhada, provavelmente como compatriotas israelitas, sem definir além do que o texto afirma.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: por que fazem mal um ao outro?
  rationale: Traduz a pergunta direta e o sentido relacional de ἀδικέω em português corrente; “um ao outro” preserva a reciprocidade de ἀλλήλους.
theological_decisions:
- issue: Natureza da fraternidade em ἀδελφοί
  choice: irmãos
  alternative: compatriotas
  rationale: “Irmãos” conserva a formulação e a possível amplitude do grego, enquanto “compatriotas” resolveria explicitamente a relação como apenas étnica ou nacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita o pouco natural “reconciliá-los à paz”, mas conserva a força conativa provável do imperfeito e o objetivo pacificador da ação.
