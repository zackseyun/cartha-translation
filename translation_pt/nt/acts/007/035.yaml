  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: pt
  text: 'Este Moisés, a quem eles rejeitaram, dizendo: “Quem nomeou você governante e juiz?” — esse Moisés Deus enviou como governante e redentor[a], pela mão do anjo que lhe apareceu na sarça.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertador”. O termo grego designa alguém que realiza libertação ou resgate.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: rejeitaram
  rationale: No contexto, o verbo descreve a recusa da autoridade de Moisés, em alusão a Êxodo 2:14; “rejeitaram” comunica isso com clareza.
- source_word: κατέστησεν
  choice: nomeou
  rationale: A pergunta trata da investidura em autoridade; “nomeou” expressa naturalmente a ideia de estabelecer alguém em uma função.
- source_word: ἄρχοντα
  choice: governante
  rationale: Preserva o sentido de alguém que exerce autoridade e permite manter a repetição retórica do termo no versículo.
- source_word: δικαστήν
  choice: juiz
  rationale: É o equivalente direto, claro e corrente para aquele que julga.
- source_word: λυτρωτὴν
  choice: redentor
  rationale: Mantém a noção forte de alguém que efetua libertação ou resgate, sem reduzir o termo à ideia genérica de auxílio.
- source_word: ἀπέσταλκεν
  choice: enviou
  rationale: O perfeito grego apresenta um envio consumado e relevante; no relato em português, o pretérito perfeito é a forma mais natural.
- source_word: σὺν χειρὶ
  choice: pela mão de
  rationale: Conserva a expressão bíblica de mediação ou agência sem explicitar além do que o grego afirma.
- source_word: ἀγγέλου
  choice: o anjo
  rationale: No relato da sarça, o referente é o ser celestial que apareceu a Moisés; “anjo” é a tradução contextual apropriada.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: que lhe apareceu na sarça
  rationale: O particípio passivo tem sentido idiomático de “aparecer”; “sarça” identifica com precisão o arbusto do relato sem acrescentar “ardente”, ausente deste versículo.
- source_word: Τοῦτον ... τοῦτον
  choice: Este Moisés ... foi este
  rationale: 'Reproduz a repetição enfática do demonstrativo e destaca a ironia: aquele que foi rejeitado é justamente aquele que Deus enviou.'
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: como governante e redentor
  rationale: Expressa as duas funções coordenadas atribuídas por Deus a Moisés em português natural.
theological_decisions:
- issue: Tradução de λυτρωτής no retrato de Moisés como agente divinamente enviado na história da salvação
  choice: redentor
  alternative: libertador
  rationale: “Redentor” preserva a dimensão de resgate e libertação inerente ao termo e seu peso tipológico, sem afirmar uma identificação completa entre Moisés e Cristo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “foi este que” mantém a ênfase do demonstrativo grego sem permitir que “este Deus” seja lido equivocadamente como uma unidade. “Sarça” conserva o registro bíblico tradicional e continua compreensível no contexto.
