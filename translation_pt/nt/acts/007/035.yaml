  to: 'Este Moisés, a quem eles rejeitaram, dizendo: “Quem nomeou você governante e juiz?” — esse Moisés Deus enviou como governante e redentor[a], pela mão do anjo que lhe apareceu na sarça.'
  rationale: 'A revisão limita-se à ordem e à repetição enfática do sujeito/objeto: «esse Moisés Deus enviou» corresponde ao segundo τοῦτον, conserva o contraste intencional do versículo e evita a formulação menos idiomática «foi este que Deus enviou». Não há alteração de sentido, de termos teológicos nem da nota lexical.'
