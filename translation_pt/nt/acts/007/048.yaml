  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: pt
  text: 'Mas o Altíssimo não habita em coisas feitas por mãos humanas[a], como diz o profeta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «em templos feitos por mãos humanas». O grego é mais amplo: «em coisas feitas por mãos humanas», embora o templo seja o contexto imediato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o forte contraste com a afirmação anterior sobre a casa construída por Salomão, de modo natural em português.
- source_word: οὐχ
  choice: não
  rationale: Expressa diretamente a negação do verbo κατοικεῖ.
- source_word: ὁ ὕψιστος
  choice: o Altíssimo
  rationale: Preserva o título divino reconhecido sem acrescentar «Deus», que está implícito, mas não aparece no grego.
- source_word: ἐν χειροποιήτοις
  choice: em coisas feitas por mãos humanas
  rationale: Mantém o sentido plural e abrangente de χειροποίητος, ao mesmo tempo que explicita naturalmente em português que se trata de mãos humanas.
- source_word: κατοικεῖ
  choice: habita
  rationale: É o equivalente corrente e apropriado para a ideia de morada ou presença divina.
- source_word: καθὼς
  choice: como
  rationale: Introduz com naturalidade a confirmação pela citação profética; «assim como» também seria possível, mas é menos fluido aqui.
- source_word: ὁ προφήτης
  choice: o profeta
  rationale: Segue o grego sem inserir o nome de Isaías, embora ele seja a fonte da citação.
- source_word: λέγει
  choice: diz
  rationale: Conserva o presente da fórmula de citação das Escrituras.
theological_decisions:
- issue: Se χειροποιήτοις deve ser limitado a «templos» no texto principal
  choice: Manter a expressão mais ampla «coisas feitas por mãos humanas»
  alternative: «templos feitos por mãos humanas» ou «santuários feitos por mãos humanas»
  rationale: Embora o templo seja o contexto imediato, o adjetivo grego substantivado é mais amplo. A formulação escolhida preserva a força retórica contra aquilo que seres humanos fabricam sem restringir indevidamente o referente.
- issue: Se ὁ ὕψιστος deve ser expandido para «o Deus Altíssimo»
  choice: Traduzir apenas «o Altíssimo»
  alternative: «o Deus Altíssimo»
  rationale: O título refere-se claramente a Deus, mas θεός não está expresso no texto; a tradução evita acrescentá-lo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Habita» preserva o registro bíblico sem soar arcaico; «mãos humanas» torna explícito o agente implícito no composto grego e evita a possível ideia de mãos divinas.
