reference: Acts 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: pt
  text: E Deus lhe deu a aliança da circuncisão. E assim Abraão gerou Isaque e o circuncidou no oitavo dia; Isaque gerou Jacó, e Jacó gerou os doze patriarcas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ
  choice: Deus lhe deu
  rationale: O sujeito de ἔδωκεν está implícito no grego e é Deus, retomado do contexto anterior. Explicitá-lo em português evita uma referência pronominal pouco natural ou ambígua sem acrescentar conteúdo novo.
- source_word: διαθήκην περιτομῆς
  choice: a aliança da circuncisão
  rationale: Neste contexto histórico-bíblico, διαθήκη significa «aliança». O genitivo περιτομῆς define a aliança caracterizada pela circuncisão, com referência específica ao pacto narrado em Gênesis 17.
- source_word: οὕτως
  choice: E assim
  rationale: Preserva a ligação sequencial e inferencial entre a concessão da aliança e o nascimento e a circuncisão de Isaque, em linguagem portuguesa natural.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: No contexto genealógico, γεννάω descreve a geração por um pai. «Gerou» é conciso, preciso e tradicional sem ser obscuro.
- source_word: περιέτεμεν
  choice: circuncidou
  rationale: É o equivalente direto e corrente de περιτέμνω para o ato pactual referido.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: no oitavo dia
  rationale: A expressão no dativo tem valor temporal. A tradução mantém a formulação do grego sem explicitar «depois do nascimento», que está implícito, mas não expresso.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaque / Jacó
  rationale: Empregam-se as formas portuguesas bíblicas consagradas dos nomes próprios.
- source_word: πατριάρχας
  choice: patriarcas
  rationale: «Patriarcas» é o termo histórico-bíblico reconhecido para os antepassados que deram origem às doze tribos de Israel.
theological_decisions:
- issue: Especificidade da aliança dada a Abraão
  choice: a aliança da circuncisão
  alternative: uma aliança de circuncisão
  rationale: O contexto aponta para a aliança específica concedida por Deus a Abraão em Gênesis 17. O artigo definido comunica essa referência identificável sem ampliar sua interpretação teológica.
- issue: Sujeitos elípticos na genealogia
  choice: Explicitar «Abraão» e repetir «gerou»
  alternative: 'Manter as elipses: «e assim gerou Isaque... e Isaque, Jacó; e Jacó, os doze patriarcas»'
  rationale: O grego permite recuperar os sujeitos e verbos pelo contexto. A explicitação torna a sequência natural e inequívoca em português, sem resolver nenhuma questão teológica nem alterar as relações genealógicas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A redação evita arcaísmos como «engendrou» e conserva a concisão genealógica do original.
