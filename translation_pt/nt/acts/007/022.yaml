id: ACT.7.22
reference: Acts 7:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: pt
  text: Moisés foi instruído em toda a sabedoria dos egípcios e era poderoso em suas palavras e obras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no falar e no agir”.'
    reason: Alternativa lexical que expressa λόγοις καὶ ἔργοις de modo mais idiomático, preservando o contraste entre palavra e ação.
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: foi instruído
  rationale: O passivo indica que Moisés recebeu formação ou ensino. “Foi instruído” é claro em português atual e evita que “foi educado” seja entendido apenas como formação de boas maneiras.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: em toda a sabedoria dos egípcios
  rationale: Preserva a amplitude de πάσῃ e apresenta a sabedoria dos egípcios como o conteúdo ou âmbito da instrução.
- source_word: δυνατὸς
  choice: poderoso
  rationale: Conserva a força de δυνατός e combina naturalmente com a expressão seguinte, sem reduzir o sentido a mera competência.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: em suas palavras e obras
  rationale: Mantém o paralelismo conciso entre λόγοις e ἔργοις em linguagem bíblica digna e compreensível; a nota registra uma formulação portuguesa mais idiomática.
- source_word: αὐτοῦ
  choice: suas
  rationale: 'O pronome genitivo se refere naturalmente a Moisés e pode abranger os dois substantivos coordenados: suas palavras e suas obras.'
theological_decisions:
- issue: Alcance da capacidade de Moisés em λόγοις
  choice: “poderoso em suas palavras e obras”, sem harmonização com Êxodo 4:10
  alternative: Interpretar a expressão como mera reputação ou efeito, ou enfraquecê-la para evitar tensão com a declaração de Moisés de que não era eloquente
  rationale: A afirmação de Estêvão deve permanecer em seus próprios termos. A tradução conserva a tensão textual com Êxodo 4:10, sem explicar se o poder estava na formação, na posição pública ou na eficácia das palavras e ações de Moisés.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Foi instruído” comunica formação recebida sem a possível ambiguidade moderna de “educado”; “palavras e obras” preserva o paralelismo do grego e o tom bíblico sem arcaísmo excessivo.
