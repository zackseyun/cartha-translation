  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: pt
  text: Então sobreveio uma fome em todo o Egito e Canaã, e grande aflição; nossos pais[a] não conseguiam encontrar alimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”. O grego diz “nossos pais”, referindo-se aos antepassados de Israel.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: Veio, então
  rationale: O aoristo de ἔρχομαι apresenta a ocorrência da fome, enquanto δέ faz avançar a narrativa; “então” expressa essa progressão sem sugerir forte contraste.
- source_word: λιμὸς
  choice: uma fome
  rationale: No contexto, designa uma escassez generalizada de alimentos; “fome” é a forma portuguesa corrente para essa calamidade.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: sobre todo o Egito e Canaã
  rationale: ἐπί com acusativo indica extensão geográfica. A formulação preserva o alcance total indicado por ὅλην.
- source_word: θλῖψις μεγάλη
  choice: grande aflição
  rationale: Refere-se à grave adversidade causada pela fome, sem impor o sentido técnico ou escatológico que “tribulação” poderia sugerir.
- source_word: οὐχ ηὕρισκον
  choice: não conseguiam encontrar
  rationale: O imperfeito retrata uma dificuldade ou incapacidade persistente durante a crise.
- source_word: χορτάσματα
  choice: alimento
  rationale: O plural pode designar mantimentos ou provisões alimentares; o singular coletivo “alimento” é natural e não restringe indevidamente o referente a cereais ou ração.
- source_word: οἱ πατέρες ἡμῶν
  choice: nossos pais
  rationale: Mantém a expressão masculina e familiar do grego, usada por Estêvão para os antepassados de Israel.
theological_decisions:
- issue: Linguagem ancestral marcada pelo gênero
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O grego diz literalmente “nossos pais” e se refere aos antepassados masculinos de Israel no relato histórico. A tradução preserva essa forma, enquanto a nota esclarece seu referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acompanhada de” torna natural a coordenação elíptica do grego sem reduzir a grande aflição à fome nem acrescentar uma interpretação doutrinária.
