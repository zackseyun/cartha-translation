    issue: “acompanhada de grande aflição” subordina interpretativamente θλῖψις μεγάλη à fome.
    rationale: O texto grego coordena “uma fome” e “grande aflição” sem declarar que a segunda seja apenas um acompanhamento da primeira. Convém preservar a coordenação.
  - severity: low
    issue: A âncora da nota lexical está no fim da frase, não junto de “nossos pais”.
    rationale: A nota explica especificamente οἱ πατέρες ἡμῶν; ancorá-la imediatamente após “pais” melhora a associação e evita ambiguidade.
  revised_text: Então sobreveio uma fome em todo o Egito e Canaã, e grande aflição; nossos pais[a] não conseguiam encontrar alimento.
  revised_footnotes:
