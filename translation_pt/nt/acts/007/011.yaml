- from: Veio, então, uma fome sobre todo o Egito e Canaã, acompanhada de grande aflição, e nossos pais não conseguiam encontrar alimento.[a]
  to: Então sobreveio uma fome em todo o Egito e Canaã, e grande aflição; nossos pais[a] não conseguiam encontrar alimento.
