id: ACT.22.5
reference: Acts 22:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: pt
  text: como também podem testemunhar a meu favor o sumo sacerdote e todo o conselho de anciãos. Deles recebi também cartas dirigidas aos irmãos em Damasco[a], e eu ia para lá a fim de trazer também os que ali se encontravam, presos, para Jerusalém, para que fossem castigados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos irmãos e às irmãs”. O grego diz “irmãos”, mas, em alguns contextos, a palavra pode se referir a uma comunidade mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: como também
  rationale: Introduz a confirmação da declaração anterior por testemunhas, preservando a força comparativa e corroborativa de modo natural em português.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É o título português tradicional e claro para a principal autoridade sacerdotal nesse contexto histórico.
- source_word: μαρτυρεῖ μοι
  choice: podem testemunhar a meu favor
  rationale: O plural em português acomoda naturalmente os dois sujeitos coordenados; “a meu favor” expressa o dativo μοι como testemunho que confirma a afirmação de Paulo.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: todo o conselho de anciãos
  rationale: πρεσβυτέριον designa o corpo ou conselho de anciãos, não apenas pessoas idosas; a formulação evita jargão eclesiástico.
- source_word: παρ’ ὧν
  choice: Deles
  rationale: Retoma coletivamente o sumo sacerdote e o conselho, em formulação concisa e idiomática.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: Mantém o sentido lexical básico; o caráter autorizativo dos documentos pode ser inferido do contexto sem explicitação adicional.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: dirigidas aos irmãos
  rationale: Conserva o masculino plural do grego e a linguagem de identidade do grupo, deixando em nota a possível abrangência comunitária.
- source_word: ἐπορευόμην
  choice: estava indo para lá
  rationale: O imperfeito retrata uma ação passada em andamento, expressa naturalmente pela locução progressiva.
- source_word: ἄξων
  choice: a fim de trazer
  rationale: O particípio futuro após verbo de movimento indica propósito; “a fim de” torna essa relação explícita sem acrescentar conteúdo.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: os que ali se encontravam
  rationale: Representa de forma natural a expressão substantivada referente às pessoas presentes em Damasco.
- source_word: δεδεμένους
  choice: amarrados
  rationale: Preserva o estado resultante expresso pelo particípio perfeito passivo sem especificar correntes, que o grego não menciona.
- source_word: ἵνα τιμωρηθῶσιν
  choice: para que fossem castigados
  rationale: Comunica claramente a finalidade punitiva, sem definir uma pena específica ausente no texto.
theological_decisions:
- issue: Abrangência de ἀδελφοί neste contexto
  choice: aos irmãos
  alternative: aos irmãos e às irmãs; aos compatriotas judeus
  rationale: O texto principal conserva a forma masculina do grego e não determina além do necessário a identidade exata do grupo. A possibilidade de referência a uma comunidade mais ampla é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sumo sacerdote” e “conselho de anciãos” mantêm o contexto histórico sem linguagem excessivamente técnica; “castigados” transmite a intenção punitiva de modo corrente.
