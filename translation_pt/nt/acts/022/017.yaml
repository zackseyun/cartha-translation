id: ACT.22.17
reference: Acts 22:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: pt
  text: Aconteceu que, depois que voltei para Jerusalém, enquanto eu orava no templo[a], entrei em transe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: Literalmente, “vim a estar em transe”; a expressão grega é uma maneira idiomática de indicar a entrada em um estado visionário.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Aconteceu que
  rationale: A fórmula narrativa introduz o acontecimento seguinte no relato de Paulo. Em português, “Aconteceu que” transmite a transição de modo natural; a participação pessoal indicada por μοι fica clara pelo relato em primeira pessoa.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: depois que voltei para Jerusalém
  rationale: O particípio aoristo indica uma ação anterior ao acontecimento principal. A construção explicita essa sequência temporal em português corrente.
- source_word: καὶ προσευχομένου μου
  choice: enquanto eu orava
  rationale: A construção genitiva indica uma ação em andamento simultânea ao acontecimento principal. “Enquanto eu orava” comunica essa simultaneidade com clareza.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo ou recinto do templo, não especificamente o santuário interior. “Templo” é a forma mais corrente e legível, com a precisão registrada em nota.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: entrei em transe
  rationale: A expressão descreve a entrada em um estado visionário. “Entrei em transe” é natural em português e preserva a ideia de mudança de estado sem acrescentar uma explicação não dada pelo texto.
theological_decisions:
- issue: Natureza da experiência de Paulo (ἐκστάσει)
  choice: transe
  alternative: êxtase; estado visionário
  rationale: O versículo relata um estado incomum durante a oração, mas não define seu mecanismo nem desenvolve aqui seu significado teológico. “Transe” preserva a afirmação do texto sem a ampliar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações conserva a sequência temporal do grego sem reproduzir sua sintaxe de forma artificial. A vírgula final foi mantida porque o versículo continua diretamente no discurso do versículo seguinte.
