  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: pt
  text: Os que estavam comigo viram a luz, mas não ouviram a voz[a] daquele que falava comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não entenderam a voz”. Compare Atos 9:7, onde se diz que os companheiros de Paulo ouviram a voz ou o som; a diferença pode estar entre ouvir um som e entender o que era dito.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Os que estavam comigo
  rationale: Reproduz naturalmente a construção participial substantivada, sem acrescentar “homens”, que não está explícito no grego. O δέ é expresso pela progressão e pelo contraste posterior, sem introduzir um marcador temporal inexistente.
- source_word: τὸ μὲν φῶς
  choice: a luz
  rationale: φῶς significa diretamente “luz”. A correlação μέν...δέ estabelece o contraste entre ver a luz e não ouvir a voz; “intensa” ou “brilhante” seria informação contextual, não expressa neste versículo.
- source_word: ἐθεάσαντο
  choice: viram
  rationale: θεάομαι pode significar ver, observar ou contemplar. “Viram” é corrente e fiel, sem sugerir contemplação prolongada ou intenção especial.
- source_word: τὴν δὲ φωνὴν
  choice: a voz
  rationale: Embora φωνή também possa significar “som”, o complemento “daquele que falava comigo” favorece “voz”, por indicar um falante pessoal.
- source_word: οὐκ ἤκουσαν
  choice: não ouviram
  rationale: Mantém o sentido lexical direto de ἀκούω. A possibilidade contextual de “não entenderam” é registrada em nota, sem resolver no texto principal a tensão com Atos 9:7.
- source_word: τοῦ λαλοῦντός μοι
  choice: daquele que falava comigo
  rationale: Preserva a relação genitiva com “voz” e representa o particípio presente como ação em curso. A formulação é natural, clara e digna em português.
theological_decisions:
- issue: Aparente tensão com Atos 9:7 sobre os companheiros de Paulo terem ouvido a voz
  choice: não ouviram a voz daquele que falava comigo
  alternative: não entenderam a voz daquele que falava comigo
  rationale: O texto grego deste versículo favorece diretamente “não ouviram a voz”, mas ἀκούω pode, conforme o contexto, incluir a ideia de compreender. Atos 9:7 afirma que os companheiros ouviram a voz/o som. Mantém-se, portanto, a formulação de superfície no texto e registra-se em nota a possibilidade de terem ouvido um som sem entender a fala.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação evita arcaísmos e acréscimos interpretativos, preservando o contraste do grego e a tensão narrativa com Atos 9:7.
