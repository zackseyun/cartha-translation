  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: pt
  text: 'E ele me disse: “Vá, porque eu o enviarei para longe, aos gentios[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: me disse
  rationale: A construção λέγω com πρός e acusativo introduz fala dirigida a alguém; “me disse” é natural e preserva o estilo narrativo.
- source_word: Πορεύου
  choice: Vá
  rationale: O imperativo presente de πορεύομαι funciona idiomaticamente como ordem para ir ou partir; “Vá” é claro, corrente e direto.
- source_word: ὅτι
  choice: porque
  rationale: Neste contexto, ὅτι apresenta a razão da ordem dada, por isso a tradução causal “porque” é adequada.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito no grego confere alguma ênfase ao sujeito; sua presença em português conserva essa ênfase possível.
- source_word: εἰς ἔθνη
  choice: aos gentios
  rationale: No contexto missionário de Atos, ἔθνη designa os não judeus. “Gentios” comunica de modo conciso essa distinção histórico-religiosa, enquanto a alternativa lexical “nações” é mantida em nota.
- source_word: μακρὰν
  choice: para longe
  rationale: O advérbio destaca distância ou afastamento; “para longe” é uma expressão portuguesa natural e preserva a indeterminação do destino.
- source_word: ἐξαποστελῶ
  choice: enviarei
  rationale: O futuro de ἐξαποστέλλω significa enviar para fora ou para longe. “Enviarei”, em combinação com “para longe”, comunica o sentido sem explicitação excessiva.
- source_word: σε
  choice: o
  rationale: Pronome objeto masculino singular referente a Paulo; “o enviarei” é corrente no registro escrito internacional e dignificado.
theological_decisions:
- issue: Sentido de ἔθνη no contexto da missão apostólica
  choice: gentios
  alternative: nações
  rationale: O contexto é o envio de Paulo aos não judeus, tema central em Atos. “Gentios” preserva essa distinção histórico-teológica sem acrescentar doutrina; “nações” continua disponível em nota como alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal “eu o enviarei” evita regionalismo coloquial e mantém fluidez em discurso solene.
