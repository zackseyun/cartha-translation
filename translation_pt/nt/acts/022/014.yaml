id: ACT.22.14
reference: Acts 22:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: pt
  text: 'E ele disse: “O Deus de nossos pais escolheu você[a] para conhecer a vontade dele, ver o Justo[b] e ouvir uma voz vinda da boca dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “designou você”. O verbo grego pode indicar a escolha ou a designação de alguém para uma tarefa.
    reason: lexical_alternative
  - marker: b
    text: “O Justo” é um título dado a Jesus; também se pode traduzir por “o Reto”.
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: escolheu
  rationale: O verbo προχειρίζομαι indica selecionar ou designar alguém para uma tarefa. “Escolheu” é natural em português e, com os infinitivos seguintes, comunica a finalidade sem introduzir explicitamente uma ideia temporal de predestinação.
- source_word: γνῶναι
  choice: conhecer
  rationale: Traduz diretamente o infinitivo de γινώσκω e mantém com naturalidade a sequência de propósitos.
- source_word: θέλημα
  choice: vontade
  rationale: “Vontade” preserva a amplitude semântica da intenção ou propósito de Deus sem restringi-la por interpretação.
- source_word: ἰδεῖν
  choice: ver
  rationale: É a tradução corrente e direta, adequada ao registro moderno.
- source_word: τὸν δίκαιον
  choice: o Justo
  rationale: A expressão funciona em Atos como título referente a Jesus. “O Justo” preserva o sentido lexical e soa mais natural em português do que alternativas mais expansivas.
- source_word: ἀκοῦσαι φωνὴν
  choice: ouvir uma voz
  rationale: A ausência de artigo em φωνή favorece “uma voz”; a referência à boca indica fala, não mero som.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: vinda da boca dele
  rationale: Mantém a imagem concreta do grego e deixa claro que se trata de fala direta.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: O Deus de nossos pais
  rationale: Preserva a formulação pactual e a referência masculina explícita do grego, mantendo a ligação com a herança de Israel.
theological_decisions:
- issue: Se τὸν δίκαιον deve ser entendido como título cristológico ou simples descrição
  choice: “o Justo”, com inicial maiúscula, como título referente a Jesus
  alternative: “o justo” ou “o Justo e Reto”
  rationale: O uso recorrente em Atos (3:14; 7:52) sustenta a força titular, sem necessidade de acrescentar o nome de Jesus ao texto.
- issue: Se “nossos pais” deve ser tornado neutro quanto ao gênero
  choice: Manter “nossos pais”
  alternative: “nossos antepassados”
  rationale: πατέρων é explicitamente masculino e a expressão possui ressonância bíblica pactual; “antepassados” seria possível, mas menos formalmente correspondente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem dos três infinitivos foi preservada. Emprega-se “você” como forma amplamente compreensível; “dele” evita a possível ambiguidade de “sua vontade” e mantém a referência a Deus.
