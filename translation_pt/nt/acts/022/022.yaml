base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: pt
  text: 'Eles o escutavam até essa declaração. Então levantaram a voz e disseram: “Tirem da terra um homem desses![a] Pois não convém que ele viva!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Fora com um homem desses!”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois ele não deve viver”. Isto é, exigiam a morte dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: escutavam
  rationale: O imperfeito indica uma ação contínua no passado; “escutavam” comunica naturalmente essa duração.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: até essa declaração
  rationale: λόγος se refere aqui ao ponto ou enunciado específico do discurso de Paulo que provocou a reação, e não apenas a uma palavra isolada.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: levantaram a voz
  rationale: Preserva a imagem da expressão grega e, no contexto, comunica um clamor coletivo em voz alta.
- source_word: λέγοντες
  choice: dizendo
  rationale: Representa diretamente o particípio que introduz o conteúdo do clamor.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: Fora da face da terra com um homem desses!
  rationale: Formulação portuguesa idiomática e vigorosa para a ordem hostil de remover Paulo da terra; “um homem desses” preserva o tom depreciativo de τὸν τοιοῦτον.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Ele não merece viver!
  rationale: Expressa em português natural o juízo de que não convinha ou não era admissível que ele vivesse, sem acrescentar um agente responsável por permitir sua vida.
