id: ACT.22.6
reference: Acts 22:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: pt
  text: Aconteceu que, enquanto eu viajava e me aproximava de Damasco, por volta do meio-dia, de repente uma luz intensa[a], vinda do céu, brilhou ao meu redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande luz”. A expressão grega pode destacar a magnitude ou a intensidade da luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Aconteceu que
  rationale: Introduz o acontecimento de modo natural em português; a perspectiva de primeira pessoa indicada por μοι fica expressa nos verbos seguintes, sem o artificialismo de “aconteceu-me”.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: enquanto eu viajava e me aproximava de Damasco
  rationale: Preserva o aspecto contínuo dos particípios e apresenta com clareza tanto a viagem quanto a aproximação do destino.
- source_word: περὶ μεσημβρίαν
  choice: por volta do meio-dia
  rationale: Expressa de maneira corrente a aproximação temporal marcada por περί.
- source_word: ἐξαίφνης
  choice: de repente
  rationale: Mantém a irrupção súbita do acontecimento.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vinda do céu
  rationale: Preserva a indicação de origem e a possível dimensão transcendente de οὐρανός no contexto, em vez de restringi-la ao sentido meteorológico de “firmamento”.
- source_word: περιαστράψαι
  choice: brilhou ao meu redor
  rationale: Comunica que a luz resplandeceu envolvendo Paulo; a ideia de súbito já é explicitada por ἐξαίφνης, evitando sobrecarregar o verbo.
- source_word: φῶς ἱκανὸν
  choice: uma luz intensa
  rationale: ἱκανός pode indicar grandeza ou intensidade; “intensa” é natural em português para caracterizar uma luz e mantém aberta a nuance registrada na nota.
- source_word: περὶ ἐμέ
  choice: ao meu redor
  rationale: Reproduz com naturalidade a relação espacial de περί com o pronome.
theological_decisions:
- issue: Sentido de οὐρανός em ἐκ τοῦ οὐρανοῦ
  choice: vinda do céu
  alternative: vinda do firmamento
  rationale: “Céu” conserva tanto o sentido espacial quanto a provável procedência transcendente no relato, sem acrescentar uma identificação doutrinária explícita.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa adequada a um testemunho oral. A marca da nota foi colocada após “luz intensa”, expressão à qual a alternativa lexical realmente se refere.
