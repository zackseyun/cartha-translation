  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: pt
  text: 'Caí no chão e ouvi uma voz que me dizia: “Saulo, Saulo, por que você me persegue?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Caí
  rationale: O aoristo ativo indicativo de πίπτω descreve o acontecimento de modo direto. “Caí” é natural em português, e o destino da queda vem expresso em seguida.
- source_word: τε
  choice: '[não traduzido separadamente]'
  rationale: A partícula enclítica liga a oração ao contexto anterior; em português, o fluxo narrativo e o “e” seguinte transmitem adequadamente essa ligação sem uma forma adicional.
- source_word: εἰς τὸ ἔδαφος
  choice: no chão
  rationale: Embora a preposição indique movimento em direção a uma superfície, “cair no chão” é a expressão idiomática corrente em português e comunica com precisão o sentido contextual.
- source_word: ἤκουσα
  choice: ouvi
  rationale: O aoristo ativo indicativo de ἀκούω é vertido naturalmente pelo pretérito perfeito.
- source_word: φωνῆς
  choice: uma voz
  rationale: O genitivo após ἀκούω é expresso de modo natural em português como objeto direto. O conteúdo falado confirma que se trata de uma voz.
- source_word: λεγούσης μοι
  choice: que me dizia
  rationale: O particípio presente modifica “voz” e apresenta uma ação simultânea. A oração relativa é natural em português e preserva o destinatário indicado por μοι.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome bíblico, preservando-se a repetição enfática do vocativo.
- source_word: τί
  choice: por que
  rationale: Neste uso interrogativo com um verbo de ação, τί pergunta pela razão e corresponde naturalmente a “por que”.
- source_word: με
  choice: me
  rationale: Preserva sem expansão o pronome de primeira pessoa como objeto direto.
- source_word: διώκεις
  choice: você me persegue
  rationale: Neste contexto, διώκω significa perseguir com hostilidade. O presente “persegue” mantém a ação em curso; “você” oferece clareza e ampla legibilidade brasileira sem perder dignidade.
theological_decisions:
- issue: Relação entre o falante e as ações de Saulo contra os seguidores de Jesus
  choice: Manter a declaração direta “você me persegue”, sem explicação adicional.
  alternative: Expandir para “persegue o meu povo” ou “persegue os meus seguidores”.
  rationale: A força teológica do texto está na identificação direta do falante com aquele que é perseguido. Uma expansão resolveria interpretativamente uma tensão que o texto formula de maneira concisa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Caí no chão” e “ouvi uma voz” são formulações idiomáticas. O discurso direto usa “você”, corrente no português brasileiro; nenhuma nota textual é necessária.
