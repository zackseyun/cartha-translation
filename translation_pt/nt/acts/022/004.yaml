source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: pt
  text: Persegui este Caminho[a] até a morte[b], prendendo e levando para as prisões tanto homens como mulheres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «este caminho» ou «este movimento». Em grego, a expressão significa literalmente «este caminho», mas em Atos frequentemente designa o movimento cristão.
    reason: lexical_alternative
  - marker: b
    text: Ou «até o ponto da morte». A expressão indica que a perseguição se estendia até seu extremo mortal, sem especificar aqui de que modo isso ocorria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: este Caminho
  rationale: ὁδός significa literalmente “caminho”, mas em Atos também funciona como designação reconhecível do movimento cristão. A inicial maiúscula sinaliza esse uso sem substituir a expressão por uma explicação interpretativa.
- source_word: ἐδίωξα
  choice: Persegui
  rationale: Neste contexto, διώκω descreve perseguição hostil, e não uma busca neutra.
- source_word: ἄχρι θανάτου
  choice: até a morte
  rationale: A expressão preserva a ideia de que a perseguição chegava ao extremo da morte, sem afirmar além do texto que Paulo matava pessoalmente cada vítima.
- source_word: δεσμεύων
  choice: prendendo
  rationale: Embora o verbo possa evocar o ato concreto de amarrar, no contexto de entrega ao cárcere “prendendo” comunica de modo natural que as pessoas eram detidas e mantidas sob restrição.
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: entregando às prisões
  rationale: A formulação expressa o ato de entregar pessoas à custódia carcerária e conserva o plural φυλακάς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: tanto homens como mulheres
  rationale: Reproduz a ênfase explícita de que a perseguição alcançava ambos os grupos.
theological_decisions:
- issue: Se ἡ ὁδός deve ser traduzido como substantivo comum ou como uma designação do movimento cristão
  choice: este Caminho
  alternative: este caminho; este movimento
  rationale: Em Atos, “o Caminho” aparece repetidamente como designação da fé e da comunidade cristãs. A tradução mantém a imagem original e deixa claro seu provável uso quase titular.
- issue: Alcance de ἄχρι θανάτου
  choice: até a morte
  alternative: até causar a morte; com intenção de matar
  rationale: A expressão indica o extremo mortal da perseguição, mas não especifica aqui se todas as pessoas presas morreram nem se Paulo executou alguém pessoalmente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Prendendo” evita a rigidez de “atando” ou “amarrando” e se ajusta ao contexto de encarceramento; “às prisões” conserva o plural do grego.
