id: ACT.22.11
reference: Acts 22:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: pt
  text: E, como eu não conseguia ver por causa do brilho daquela luz[a], cheguei a Damasco, guiado pela mão dos que estavam comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “por causa da glória daquela luz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: não conseguia ver
  rationale: No contexto da luz que cegou Paulo, expressa naturalmente a incapacidade resultante de enxergar, e não apenas a impossibilidade de fixar o olhar.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: por causa do brilho daquela luz
  rationale: Aqui δόξα designa a intensa radiância visível da luz. “Brilho” comunica a causa física da cegueira em português corrente; a nota preserva a tradução mais literal “glória”.
- source_word: χειραγωγούμενος
  choice: guiado pela mão
  rationale: Preserva a imagem explícita de condução pela mão e soa natural em português.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: pelos que estavam comigo
  rationale: Reproduz de modo transparente a ideia de pessoas que acompanhavam Paulo, sem lhes atribuir uma condição mais específica.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: cheguei a Damasco
  rationale: Expressa de modo idiomático o movimento até a cidade; neste contexto, ἦλθον com εἰς implica a chegada ao destino.
- source_word: ὡς δὲ
  choice: E, como
  rationale: 'Mantém a continuidade narrativa de δέ e comunica a circunstância causal introduzida por ὡς: por não conseguir ver, Paulo precisou ser conduzido.'
theological_decisions:
- issue: Tradução de δόξα em contexto de manifestação celestial
  choice: brilho
  alternative: glória; esplendor
  rationale: Embora δόξα frequentemente tenha sentido teológico de “glória”, aqui aponta para a radiância visível da luz que impediu Paulo de enxergar. “Brilho” preserva a função imediata no relato sem eliminar a alternativa literal, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção “guiado pela mão” conserva o detalhe vívido do grego sem rigidez excessiva.
