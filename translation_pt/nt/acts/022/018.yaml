id: ACT.22.18
reference: Acts 22:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: pt
  text: 'e o vi dizendo-me: “Depressa! Saia de Jerusalém sem demora, porque eles não aceitarão o seu testemunho a meu respeito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: o vi
  rationale: Embora seja formalmente um infinitivo, a construção narrativa dá continuidade ao relato da visão; a forma finita é natural em português e preserva a percepção visual.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome retoma o Senhor visto na visão no contexto anterior, sem acrescentar ao versículo um título que o grego não explicita aqui.
- source_word: λέγοντά μοι
  choice: dizendo-me
  rationale: Preserva a construção participial ligada ao pronome e introduz diretamente as palavras ouvidas.
- source_word: Σπεῦσον
  choice: Depressa!
  rationale: Expressa com naturalidade a urgência do imperativo aoristo, sem linguagem arcaica.
- source_word: ἔξελθε
  choice: Saia
  rationale: Imperativo corrente e digno que comunica a ordem de partir para fora da cidade.
- source_word: ἐν τάχει
  choice: sem demora
  rationale: Mantém a segunda expressão de urgência do grego sem repetir de modo pesado o advérbio usado na primeira ordem.
- source_word: ἐξ Ἰερουσαλήμ
  choice: de Jerusalém
  rationale: Com o verbo 'sair', a preposição 'de' comunica naturalmente o movimento para fora da cidade.
- source_word: διότι
  choice: porque
  rationale: Introduz de modo claro e moderno a razão da ordem.
- source_word: οὐ παραδέξονταί
  choice: não aceitarão
  rationale: No contexto, παραδέχομαι significa acolher ou receber favoravelmente; 'aceitarão' combina naturalmente com 'testemunho'.
- source_word: σου μαρτυρίαν
  choice: o seu testemunho
  rationale: Preserva o sentido testemunhal e proclamativo de μαρτυρία em linguagem portuguesa corrente.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Expressa com clareza a referência do testemunho e mantém um registro digno e natural.
theological_decisions:
- issue: Referente do pronome αὐτόν no relato da visão
  choice: Manter o pronome em 'o vi', deixando que o contexto anterior identifique o Senhor/Jesus.
  alternative: Substituir o pronome por 'o Senhor' ou 'Jesus'.
  rationale: O contexto identifica o interlocutor, mas este versículo emprega um pronome. Mantê-lo evita inserir no texto uma identificação nominal não expressa aqui.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A dupla urgência do grego é preservada por 'Depressa!' e 'sem demora'. Não se acrescentou nota, pois a alternativa lexical 'receber/acolher o testemunho' não altera substancialmente o sentido e pode ser registrada nas decisões lexicais.
