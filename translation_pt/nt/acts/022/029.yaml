base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: pt
  text: Portanto, os que estavam prestes a interrogá-lo afastaram-se imediatamente dele.[a] O comandante[b] também ficou com medo ao saber que ele era cidadão romano e que o comandante o havia amarrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente neste contexto, «interrogá-lo sob açoites». O verbo grego pode designar um interrogatório oficial, e o versículo anterior esclarece o meio que seria usado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o tribuno militar, oficial romano cujo título indicava o comando de cerca de mil soldados, embora o número efetivo pudesse variar.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Por isso ... imediatamente
  rationale: Preserva tanto a ligação inferencial com o versículo anterior quanto a rapidez da reação, em português natural.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: afastaram-se dele
  rationale: Expressa de modo idiomático que os agentes recuaram e interromperam o procedimento contra Paulo.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: os que estavam prestes a interrogá-lo
  rationale: A construção indica intenção iminente; «interrogar» comunica o exame oficial, enquanto a nota explicita que, no contexto, seria realizado mediante açoites.
- source_word: χιλίαρχος
  choice: comandante
  rationale: Termo claro para leitores atuais; a nota preserva a patente romana específica e sua associação nominal ao comando de mil homens.
- source_word: ἐφοβήθη
  choice: ficou com medo
  rationale: Retrata naturalmente o início da reação de temor do oficial.
- source_word: ἐπιγνοὺς
  choice: ao saber
  rationale: Comunica a percepção adquirida que ocasionou o medo, sem tornar a frase pesada.
- source_word: Ῥωμαῖός ἐστιν
  choice: Paulo era cidadão romano
  rationale: O contexto trata de condição jurídica, não apenas de origem étnica. O nome «Paulo» esclarece o referente em português e evita uma sequência ambígua de pronomes.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: ele o havia amarrado
  rationale: O mais-que-perfeito composto representa o ato anterior e o estado resultante indicado pelo perfeito grego, preservando que o próprio comandante é o sujeito gramatical.
