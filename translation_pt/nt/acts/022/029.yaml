  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Comandante» evita o sentido moderno mais comum de «tribuno», enquanto a nota fornece a precisão histórica. Os marcadores foram colocados imediatamente após as expressões que explicam.
