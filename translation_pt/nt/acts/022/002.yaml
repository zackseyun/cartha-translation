  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: pt
  text: 'Quando ouviram que ele se dirigia a eles em língua hebraica[a], fizeram ainda mais silêncio. E ele disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em aramaico”; o grego diz “em língua hebraica”, expressão que, neste contexto, pode se referir à fala semítica local da Judeia.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quando ouviram
  rationale: O particípio aoristo expressa a circunstância temporal da reação da multidão. Em português, “Quando ouviram” é natural; o valor leve de δέ fica suficientemente marcado pela mudança narrativa, sem exigir um “mas” pouco idiomático neste ponto.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: em língua hebraica
  rationale: Preserva a designação explícita do grego, sem decidir no texto principal se o referente histórico era o hebraico ou o aramaico.
- source_word: προσεφώνει αὐτοῖς
  choice: ele se dirigia a eles
  rationale: O imperfeito indica uma fala em andamento dirigida à multidão. A formulação é clara, atual e adequada ao discurso público.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: fizeram ainda mais silêncio
  rationale: Traduz de modo natural a expressão idiomática grega, preservando a intensificação de μᾶλλον e apresentando o silêncio como reação deliberada da multidão.
- source_word: καὶ φησίν
  choice: 'Então ele disse:'
  rationale: O presente histórico é vertido no passado, forma mais natural na narrativa portuguesa. “Então” marca com clareza a passagem para o início do discurso de Paulo.
theological_decisions:
- issue: Referente de “língua hebraica”
  choice: Manter “hebraica” no texto principal
  alternative: Entender a expressão como referência ao aramaico, idioma semítico local
  rationale: O grego diz literalmente “língua/dialeto hebraico”. Como a identificação histórica exata permanece discutida, o texto principal conserva a forma da fonte, e a nota registra a possibilidade de referência ao aramaico sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Fizeram ainda mais silêncio” soa mais natural do que uma reprodução literal de “proporcionaram silêncio”, e “se dirigia a eles” conserva o caráter formal e contínuo da fala.
