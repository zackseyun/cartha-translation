source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: pt
  text: Homens, irmãos e pais, ouçam agora a defesa que apresento a vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ouçam agora a minha defesa diante de vocês».'
    reason: A construção grega pode ser vertida com a defesa como objeto possuído («minha defesa») e com πρὸς ὑμᾶς indicando a audiência perante a qual ela é feita.
lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Preserva o vocativo masculino explícito ἄνδρες e a forma solene do discurso público, sem substituí-lo pelo mais interpretativo «senhores».
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Reproduz diretamente o vocativo plural e, neste conjunto de formas masculinas de tratamento, mantém a referência contextual aos homens presentes.
- source_word: πατέρες
  choice: pais
  rationale: Conserva a imagem de parentesco e o tratamento respeitoso dirigido aos homens mais velhos ou honrados, sem interpretá-los necessariamente como líderes formais.
- source_word: ἀκούσατέ
  choice: ouçam
  rationale: Imperativo plural natural em português, adequado ao pedido solene para que a audiência preste atenção.
- source_word: μου ... ἀπολογίας
  choice: a defesa que apresento
  rationale: Expressa em português corrente a relação entre o pronome no genitivo e ἀπολογία, isto é, a defesa feita por Paulo, evitando tanto a rigidez de «minha defesa» quanto o sentido moderno de pedido de desculpas associado a «apologia».
- source_word: πρὸς ὑμᾶς
  choice: a vocês
  rationale: Indica que a defesa é dirigida aos ouvintes. A construção foi integrada ao verbo «apresento» para produzir uma frase natural sem resolver além do necessário a relação sintática.
- source_word: νυνὶ
  choice: agora
  rationale: Mantém a ênfase de imediatidade presente na forma enfática νυνί.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento masculinas preservadas por serem explícitas no grego. «Homens, irmãos e pais» mantém a solenidade e a estrutura retórica do vocativo original; «a defesa que apresento a vocês» torna natural a sintaxe da declaração pública.
