  source_fidelity: O texto preserva com precisão a sequência vocativa masculina «Homens, irmãos e pais» (Ἄνδρες, ἀδελφοὶ καὶ πατέρες), o imperativo plural «ouçam», a imediatidade de «agora» (νυνί) e o sentido forense de ἀπολογία como «defesa». «A defesa que apresento a vocês» comunica naturalmente tanto a posse/participação de μου quanto a direção da fala expressa por πρὸς ὑμᾶς, sem introduzir interpretação indevida.
