id: ACT.22.19
reference: Acts 22:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: pt
  text: 'E eu disse: “Senhor, eles mesmos sabem que eu prendia e espancava, de sinagoga em sinagoga,[a] os que creem em ti.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todas as sinagogas”; a expressão grega é distributiva e indica uma ação repetida em várias sinagogas.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que confiam em ti” ou “os que depositam a fé em ti”.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: E eu disse
  rationale: Reproduz naturalmente καὶ ἐγώ e o aoristo de λέγω, mantendo a continuidade narrativa sem acentuar excessivamente o pronome.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva a forma de tratamento dirigida a Jesus e sua possível força cristológica, sem acrescentar uma interpretação além do texto.
- source_word: αὐτοὶ ἐπίστανται
  choice: eles mesmos sabem
  rationale: Mantém a ênfase explícita de αὐτοί e traduz ἐπίστανται de modo claro e corrente.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: eu prendia e espancava
  rationale: O imperfeito perifrástico indica ação passada contínua ou habitual; o imperfeito português comunica bem o caráter reiterado.
- source_word: κατὰ τὰς συναγωγάς
  choice: de sinagoga em sinagoga
  rationale: Expressa idiomaticamente o valor distributivo de κατά com o acusativo, indicando ação repetida em várias sinagogas.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: os que creem em ti
  rationale: Traduz de forma natural o particípio presente e preserva a orientação da fé ou confiança para Jesus.
theological_decisions:
- issue: Tradução de κύριος na fala dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” conserva tanto o tratamento respeitoso quanto a possível força cristológica do contexto, sem a reduzir a uma relação meramente pedagógica.
- issue: Natureza da resposta expressa por πιστεύω ἐπί
  choice: creem em ti
  alternative: confiam em ti
  rationale: “Creem em ti” é natural e preserva a amplitude semântica da expressão; a nota registra a nuance legítima de confiança.
- issue: Aspecto da antiga perseguição praticada por Paulo
  choice: eu prendia e espancava
  alternative: eu costumava prender e espancar
  rationale: O imperfeito português preserva de modo conciso a ação habitual e reiterada indicada pela construção perifrástica grega.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “De sinagoga em sinagoga” explicita naturalmente a distribuição da ação; “espancava” comunica violência física reiterada sem especificar indevidamente um açoitamento judicial.
