source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: pt
  text: E, quando o sangue de Estêvão, tua testemunha[a], estava sendo derramado, eu mesmo estava ali, aprovando e guardando as capas dos que o matavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mártir”. A palavra grega significa “testemunha” e, no uso cristão, passou a ser associada especialmente a quem morre por causa de seu testemunho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: estava sendo derramado
  rationale: O imperfeito passivo expressa uma ação em curso, e “derramado” preserva a imagem vívida do sangue vertido.
- source_word: αἷμα
  choice: sangue
  rationale: Equivalente direto e natural no contexto.
- source_word: μάρτυρός
  choice: testemunha
  rationale: Preserva o sentido lexical primário de alguém que dá testemunho, sem impor no texto principal o sentido cristão posterior de “mártir”.
- source_word: ἐφεστὼς
  choice: estava ali
  rationale: Expressa de modo natural que Paulo estava presente junto à cena; sua participação é explicitada pelos particípios seguintes.
- source_word: συνευδοκῶν
  choice: aprovando
  rationale: Comunica anuência ativa, não mera presença ou concordância passiva.
- source_word: φυλάσσων
  choice: guardando
  rationale: Mantém o sentido concreto de vigiar ou tomar conta das peças de roupa.
- source_word: ἱμάτια
  choice: capas
  rationale: No contexto, refere-se naturalmente às vestes exteriores deixadas de lado pelos executores.
- source_word: ἀναιρούντων
  choice: matavam
  rationale: Verte diretamente o sentido contextual de tirar a vida, sem acrescentar uma qualificação moral ausente do verbo.
- source_word: αὐτὸς
  choice: eu mesmo
  rationale: Conserva a ênfase do pronome grego na participação pessoal de Paulo.
theological_decisions:
- issue: Tradução de μάρτυς com referência a Estêvão
  choice: testemunha
  alternative: mártir
  rationale: “Testemunha” representa o sentido lexical direto e preserva a relação com o testemunho dado por Estêvão. “Mártir” é uma associação cristã legítima e posterior, especialmente pertinente neste contexto de morte, mas não deve substituir silenciosamente a ambiguidade histórica do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção progressiva preserva o aspecto imperfeito; “eu mesmo” mantém a ênfase, e “estava ali” evita uma formulação rígida sem enfraquecer a presença de Paulo na cena.
