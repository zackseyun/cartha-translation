id: ACT.22.15
reference: Acts 22:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: pt
  text: Pois você será testemunha a favor dele[a], diante de todas as pessoas, do que viu e ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para ele». O dativo grego admite mais de uma compreensão estreitamente relacionada neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ou o conteúdo da comissão recebida por Paulo; «pois» conserva essa força e soa natural no contexto.
- source_word: ἔσῃ
  choice: você será
  rationale: Traduz o futuro de εἰμί de forma direta, clara e corrente em português.
- source_word: μάρτυς
  choice: testemunha
  rationale: Designa quem dá testemunho com base no que presenciou ou ouviu; é o equivalente preciso e consagrado em português.
- source_word: αὐτῷ
  choice: a favor dele
  rationale: Expressa o dativo como referência ou interesse da pessoa em favor de quem Paulo dará testemunho, sem explicitar no versículo um referente que o grego deixa pronominal.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: diante de todas as pessoas
  rationale: πρός indica aqui o público perante o qual o testemunho será dado. «Todas as pessoas» comunica o sentido humano genérico de ἀνθρώπους sem restringi-lo aos homens do sexo masculino.
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: do que viu e ouviu
  rationale: O relativo genitivo introduz o conteúdo do testemunho. «Viu» e «ouviu» reproduzem com naturalidade a experiência que fundamentará esse testemunho, sem forçar em português a diferença aspectual entre o perfeito e o aoristo gregos.
theological_decisions:
- issue: Sentido do dativo αὐτῷ na comissão de Paulo
  choice: a favor dele
  alternative: para ele; dele
  rationale: «A favor dele» apresenta Paulo como testemunha em favor do referente do pronome, provavelmente o Senhor/Jesus no contexto, mas mantém o pronome como no original. A nota preserva a possibilidade estreitamente relacionada de entender o dativo como «para ele».
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação evita linguagem exclusivamente masculina para o uso genérico de ἀνθρώπους e conserva em nota a ambiguidade sintática de αὐτῷ.
