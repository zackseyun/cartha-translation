id: ACT.22.30
reference: Acts 22:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: pt
  text: No dia seguinte, querendo saber com certeza de que Paulo era acusado pelos judeus[a], o comandante o soltou e ordenou que os principais sacerdotes e todo o Conselho[b] se reunissem. Então fez Paulo descer e o apresentou diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelas autoridades judaicas” ou “pelos judeanos”. O grego diz “pelos judeus”; neste contexto, a expressão se refere aos acusadores de Paulo, não a todos os judeus sem distinção.
    reason: lexical_alternative
  - marker: b
    text: O “Conselho” era o Sinédrio, o conselho governante judaico em Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressa naturalmente o dativo temporal; δέ marca uma transição narrativa leve, que não exige uma conjunção adversativa explícita em português.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: querendo saber com certeza
  rationale: Preserva tanto a intenção expressa pelo particípio quanto a ideia de informação segura ou certeza.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: de que Paulo era acusado pelos judeus
  rationale: Mantém a construção passiva e o referente lexical explícito Ἰουδαίων, sem ampliar a acusação a todos os judeus indistintamente.
- source_word: ἔλυσεν αὐτόν
  choice: o soltou
  rationale: λύω pode indicar soltar ou desamarrar. Aqui, a formulação concisa preserva a amplitude do verbo sem sugerir necessariamente libertação definitiva da custódia.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: ordenou que ... se reunissem
  rationale: Representa de modo natural em português a ordem oficial expressa por κελεύω com infinitivo.
- source_word: τοὺς ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Evita a possível impressão de vários sumos sacerdotes simultaneamente e designa com clareza as principais autoridades sacerdotais.
- source_word: πᾶν τὸ συνέδριον
  choice: todo o Conselho
  rationale: Traduz συνέδριον por um termo português legível, enquanto a nota identifica a instituição histórica específica.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: fez Paulo descer
  rationale: Preserva o movimento descendente indicado por κατάγω, provavelmente desde a fortaleza até o local da reunião.
- source_word: ἔστησεν εἰς αὐτούς
  choice: o apresentou diante deles
  rationale: Comunica naturalmente o sentido causativo de colocar Paulo em pé perante o grupo em uma audiência oficial.
theological_decisions:
- issue: Sentido contextual de Ἰουδαίων em Atos
  choice: pelos judeus
  alternative: pelos líderes judeus; pelos judeus da Judeia
  rationale: O texto grego usa o termo geral Ἰουδαίων, mas o contexto limita a referência aos acusadores de Paulo. A tradução conserva a forma lexical e esclarece na nota que não se trata de todo judeu sem distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. O sujeito implícito foi explicitado como “o comandante” para evitar ambiguidade em português. As notas foram posicionadas junto aos termos que efetivamente explicam.
