id: ACT.22.16
reference: Acts 22:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: pt
  text: E agora, por que você está esperando? Levante-se, seja batizado e lave os seus pecados, invocando o nome dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Invocando” também pode ser entendido mais explicitamente como “ao invocar” ou “por invocar”; o grego não determina de modo inequívoco a relação exata do particípio com as ordens anteriores.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: por que você está esperando?
  rationale: Neste contexto, a expressão interrogativa funciona como uma exortação a não adiar; esta formulação transmite o sentido idiomático e o tom de urgência em português atual.
- source_word: ἀναστὰς
  choice: Levante-se
  rationale: O particípio aoristo acompanha os imperativos seguintes e pode ser expresso naturalmente como uma ordem, preservando o tom direto.
- source_word: βάπτισαι
  choice: seja batizado
  rationale: O imperativo médio é vertido de modo natural em português pela construção passiva, sem acrescentar uma interpretação sobre quem realiza o batismo.
- source_word: ἀπόλουσαι
  choice: lave
  rationale: Com o objeto 'os seus pecados', o verbo comunica a ideia de lavar ou remover por lavagem; 'lave os seus pecados' mantém a imagem concreta do grego.
- source_word: τὰς ἁμαρτίας σου
  choice: os seus pecados
  rationale: Tradução direta que preserva o sentido comum de ἁμαρτία, sem expansão interpretativa.
- source_word: ἐπικαλεσάμενος
  choice: invocando
  rationale: O gerúndio preserva a ligação do particípio com os imperativos sem determinar rigidamente se ele indica meio, circunstância ou ação concomitante.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o nome dele
  rationale: O texto crítico traz o pronome αὐτοῦ. 'Dele' reproduz essa referência pronominal sem substituir o pronome por um título ausente do versículo.
theological_decisions:
- issue: Relação entre o batismo, a lavagem dos pecados e a invocação do nome
  choice: Preservar a sequência das ordens e o particípio, sem explicitar uma relação sacramental ou causal além da gramática.
  alternative: Traduzir 'invocando' como 'ao invocar' ou 'por invocar', vinculando de forma mais explícita a lavagem dos pecados à invocação; ou formular o batismo como o meio explícito da lavagem.
  rationale: O grego coordena dois imperativos e acrescenta um particípio, mas não obriga a tradução a resolver a controvérsia sobre o papel preciso de cada elemento. A redação mantém a tensão e a ambiguidade genuínas.
- issue: Referente de αὐτοῦ
  choice: Manter a forma pronominal 'dele'.
  alternative: Explicitar 'do Senhor' ou 'de Jesus'.
  rationale: Embora o contexto identifique o referente, o versículo usa um pronome; conservá-lo evita introduzir no texto um título que não consta desta forma no SBLGNT.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se 'você' porque a fala se dirige diretamente a Saulo e essa forma é amplamente compreensível; os imperativos mantêm urgência sem soar arcaicos. A nota registra a ambiguidade sintática relevante sem impor uma conclusão doutrinária.
