  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: pt
  text: 'Então eu disse[a]: “O que devo fazer, Senhor?” E o Senhor me disse: “Levante-se e vá para Damasco. Ali lhe falarão de tudo o que está determinado para você fazer[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que farei, Senhor?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tudo o que foi designado para você fazer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: O que devo fazer
  rationale: O subjuntivo aoristo deliberativo pede orientação quanto à ação seguinte. “Devo fazer” é natural em português moderno e preserva a ideia de dever e direção.
- source_word: κύριε / ὁ ... κύριος
  choice: Senhor / o Senhor
  rationale: No relato do caminho de Damasco, o título se dirige a Jesus e o identifica como Senhor; “senhor” no sentido meramente cortês enfraqueceria essa força cristológica.
- source_word: Ἀναστὰς
  choice: Levante-se
  rationale: O particípio tem força imperativa e antecede o comando de ir. “Levante-se” expressa com clareza a sequência das ações.
- source_word: πορεύου εἰς Δαμασκόν
  choice: vá para Damasco
  rationale: Expressa naturalmente o movimento até a cidade. Em português, “ir para Damasco” é mais idiomático que uma reprodução rígida da preposição grega.
- source_word: κἀκεῖ
  choice: Ali
  rationale: A forma contraída de καὶ ἐκεῖ marca o local em que a revelação posterior ocorrerá. “Ali” mantém a sequência de maneira concisa.
- source_word: λαληθήσεται
  choice: lhe dirão
  rationale: O futuro passivo com σοι pode ser expresso naturalmente por uma construção de sujeito indeterminado em português, sem identificar quem transmitirá a mensagem.
- source_word: περὶ πάντων
  choice: tudo
  rationale: No contexto de λαληθήσεται, “lhe dirão tudo” comunica de modo claro e idiomático todo o conteúdo que será revelado.
- source_word: τέτακταί σοι ποιῆσαι
  choice: foi determinado que você faça
  rationale: O perfeito passivo de τάσσω indica algo estabelecido anteriormente e ainda vigente. “Foi determinado” preserva a ordem divina sem especificar além do texto o agente ou um sistema teológico.
theological_decisions:
- issue: Força de τέτακταί em relação à direção divina e à vocação de Paulo
  choice: foi determinado que você faça
  alternative: foi designado para você fazer
  rationale: A formulação conserva a noção de que as ações futuras de Paulo já foram estabelecidas, sem transformar a frase numa afirmação mais ampla sobre predestinação nem reduzir seu caráter de direção divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por clareza contemporânea, mantém “Senhor” como título e evita passivas excessivamente rígidas, preservando porém a ambiguidade quanto ao agente de λαληθήσεται e τέτακταί.
