  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: pt
  text: Enquanto eles gritavam, atiravam seus mantos[a] e lançavam poeira para o ar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lançavam seus mantos” ou “atiravam seus mantos para longe”. O grego pode referir-se tanto a atirar as vestes para longe quanto a lançá-las de um lado para outro em agitação.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: gritavam
  rationale: O particípio presente descreve uma ação contínua e simultânea às demais; “gritavam” é natural e preserva a intensidade do clamor público.
- source_word: τε
  choice: enquanto
  rationale: A relação coordenada entre os particípios é expressa naturalmente pela abertura temporal “Enquanto”, seguida de ações paralelas ligadas por vírgula e “e”.
- source_word: αὐτῶν
  choice: eles
  rationale: O genitivo plural fornece o sujeito da construção participial; em português, o pronome explícito torna a oração idiomática.
- source_word: ῥιπτούντων
  choice: agitavam
  rationale: O verbo pode indicar lançar, atirar ou mover com ímpeto. No contexto da reação tumultuada da multidão, “agitavam” mantém a ambiguidade entre arremessar e sacudir as roupas sem afirmar que as estavam despindo.
- source_word: τὰ ἱμάτια
  choice: as suas capas
  rationale: ἱμάτια refere-se com frequência a vestes exteriores; “capas” é claro, concreto e adequado ao contexto antigo.
- source_word: κονιορτόν
  choice: poeira
  rationale: Equivalente direto e natural para o substantivo grego.
- source_word: βαλλόντων
  choice: lançavam
  rationale: Expressa o ato deliberado e repetido de jogar poeira, com força suficiente sem exagerar o verbo.
- source_word: εἰς τὸν ἀέρα
  choice: para o ar
  rationale: Formulação idiomática em português que corresponde ao movimento indicado pela preposição grega.
