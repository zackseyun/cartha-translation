  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: pt
  text: 'Mas, quando o estenderam com correias, Paulo perguntou ao centurião que estava ali: “É lícito que vocês açoitem um cidadão romano[a] que não foi condenado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem romano”. Neste contexto jurídico, a expressão se refere ao estatuto de cidadão romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: o estenderam e o prenderam com as correias
  rationale: 'A formulação explicita a preparação física para o açoite: Paulo foi estendido e preso por correias. Evita sugerir que as correias fossem o instrumento do açoite.'
- source_word: ἑστῶτα
  choice: que estava ali
  rationale: Expressa de modo natural a presença próxima do centurião, sem dar destaque indevido à postura física.
- source_word: ἑκατόνταρχον
  choice: centurião
  rationale: É o termo português tradicional, preciso e amplamente compreendido para essa patente militar romana.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: um cidadão romano
  rationale: Embora a expressão seja literalmente 'um homem romano', neste contexto jurídico ela designa a condição protegida de cidadão romano; esta tradução comunica naturalmente o sentido pretendido.
- source_word: ἀκατάκριτον
  choice: sem que ele tenha sido condenado
  rationale: Preserva o sentido jurídico de alguém contra quem ainda não houve condenação, em português claro e idiomático.
- source_word: ἔξεστιν ὑμῖν
  choice: É lícito vocês
  rationale: Mantém a pergunta sobre a legalidade da ação e reproduz o plural ὑμῖν, dirigido aos responsáveis pelo procedimento.
- source_word: μαστίζειν
  choice: açoitar
  rationale: Designa com clareza uma flagelação severa e se ajusta ao registro histórico e jurídico da passagem.
