  verdict: revise
  source_fidelity: A expressão προέτειναν αὐτὸν τοῖς ἱμᾶσιν tem um único verbo e descreve Paulo sendo estendido com correias para a flagelação. «O estenderam e o prenderam» introduz uma segunda ação explícita que o grego não enuncia. «Cidadão romano» comunica corretamente, no contexto jurídico, o estatuto implicado por ἄνθρωπον Ῥωμαῖον, embora «homem romano» seja a formulação literal.
  naturalness: «É lícito vocês açoitar» é compreensível no português brasileiro, mas «É lícito que vocês açoitem» é mais regular e natural em registro público moderno. «Que não foi condenado» reproduz de maneira clara e direta o valor jurídico de ἀκατάκριτον.
  terminology: «Centurião» e «açoitar» são precisos e adequados. «Cidadão romano» é a opção contextual mais inteligível; uma nota registra a formulação literal e evita ocultar a nuance lexical.
