  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: pt
  text: Um certo homem, Ananias, devoto segundo a Lei e de quem todos os judeus[a] que moravam ali davam bom testemunho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeanos”, caso o termo seja entendido em sentido étnico-geográfico, e não religioso-comunitário.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio.
- source_word: δέ
  choice: não expresso por uma conjunção independente
  rationale: Marca uma transição narrativa leve; neste fragmento, a progressão do discurso e a ordem da frase transmitem essa função sem exigir um “então” temporal nem o mais literário “ora”.
- source_word: τις ἀνὴρ
  choice: um homem chamado Ananias
  rationale: A construção apresenta um homem específico ainda não introduzido. Em português corrente, “um homem chamado Ananias” é mais natural que “um certo homem, Ananias”; a aposição grega sustenta o uso de “chamado”.
- source_word: εὐλαβής
  choice: devoto
  rationale: Expressa reverência e prática religiosa cuidadosa em linguagem atual e acessível.
- source_word: κατὰ τὸν νόμον
  choice: segundo a Lei
  rationale: Mantém a relação explícita entre a devoção de Ananias e a Lei mosaica; a inicial maiúscula identifica esse referente no contexto bíblico.
- source_word: μαρτυρούμενος
  choice: de quem ... davam bom testemunho
  rationale: Reproduz o testemunho favorável prestado por outras pessoas e soa natural em português.
- source_word: ὑπὸ πάντων
  choice: todos
  rationale: Preserva a força abrangente de πάντων.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: os judeus que moravam ali
  rationale: Indica a comunidade judaica residente no lugar mencionado pelo contexto, sem inserir explicitamente o nome da cidade.
theological_decisions:
- issue: Sentido de Ἰουδαίων
  choice: os judeus
  alternative: os judeanos
  rationale: O contexto destaca a identidade comunitária e religiosa dos residentes de Damasco, não sua procedência geográfica da Judeia. A alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para o discurso narrativo. O versículo permanece como oração incompleta, encerrada por vírgula, porque sua construção continua no versículo seguinte.
