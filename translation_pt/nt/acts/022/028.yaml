    issue: «Já» em «Eu já nasci com ela»
    rationale: O grego καί não indica primariamente anterioridade temporal. Neste enunciado marca contraste enfático/aditivo, melhor expresso sem «já» ou, de modo mais explícito, por «também»/«até». Além disso, «nasci cidadão» torna idiomaticamente explícita a condição que o grego deixa subentendida.
