  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: pt
  text: 'Mas o comandante respondeu: “Adquiri esta cidadania por uma grande soma de dinheiro.” Porém, Paulo disse: “Eu, porém, nasci cidadão.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Mas eu também nasci”, ficando a cidadania subentendida pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa o oficial militar romano que comandava aproximadamente mil homens. “Comandante” é claro e natural em português; “tribuno militar” seria mais técnico.
- source_word: πολλοῦ κεφαλαίου
  choice: por uma grande soma de dinheiro
  rationale: A expressão genitiva indica um elevado desembolso monetário. A formulação explicita o sentido idiomático sem afirmar além do contexto como a cidadania foi obtida.
- source_word: πολιτείαν
  choice: cidadania
  rationale: Neste contexto, refere-se à condição jurídica de cidadão romano, e não à vida política em sentido geral.
- source_word: ἐκτησάμην
  choice: adquiri
  rationale: O verbo médio significa obter ou adquirir para si. “Adquiri” conserva a amplitude do grego, enquanto “comprei” especificaria em excesso o modo de obtenção.
- source_word: καὶ γεγέννημαι
  choice: já nasci com ela
  rationale: O perfeito passivo indica que Paulo nasceu nessa condição; a cidadania fica subentendida no grego e é retomada pelo pronome em português. “Já” expressa naturalmente o contraste enfático de καί neste contexto.
- source_word: δέ
  choice: mas / porém
  rationale: As duas ocorrências marcam continuidade com contraste. A variação entre “mas” e “porém” evita repetição pesada e mantém a oposição entre as falas.
- source_word: ἔφη
  choice: disse
  rationale: Verbo comum de elocução, traduzido sem acrescentar força retórica ausente do original.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Comandante” foi preferido ao termo histórico mais técnico “tribuno militar”; a fala de Paulo foi tornada idiomática, e a forma mais literal foi preservada em nota.
