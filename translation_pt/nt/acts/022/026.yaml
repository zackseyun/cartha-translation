id: ACT.22.26
reference: Acts 22:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: pt
  text: 'Quando o centurião ouviu isso, foi até o comandante e o informou, dizendo: “O que está prestes a fazer?[a] Pois este homem é cidadão romano.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que pretende fazer?” A expressão grega pode indicar tanto uma ação iminente quanto uma ação pretendida.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “este homem é romano”. Neste contexto, isso significa que ele possui cidadania romana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Quando ... ouviu isso
  rationale: O particípio aoristo apresenta a circunstância anterior à ação principal; a oração temporal é natural em português e preserva essa relação.
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: É o termo português tradicional e preciso para a patente militar romana indicada pelo grego.
- source_word: προσελθὼν
  choice: foi até
  rationale: Expressa de modo natural o movimento de aproximação ao oficial superior.
- source_word: τῷ χιλιάρχῳ
  choice: ao comandante
  rationale: Comunica de modo acessível a função do oficial romano, sem recorrer ao pouco conhecido tecnicismo “quiliarca”.
- source_word: ἀπήγγειλεν
  choice: o informou
  rationale: O verbo indica a comunicação formal de uma informação; o pronome retoma naturalmente o comandante.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva a ligação participial entre o ato de informar e as palavras que se seguem.
- source_word: Τί μέλλεις ποιεῖν;
  choice: O que está prestes a fazer?
  rationale: μέλλω com infinitivo pode indicar ação iminente ou pretendida. A tradução principal destaca a iminência sem acrescentar um pronome de tratamento ausente do grego; a alternativa fica registrada em nota.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Pois este homem
  rationale: Mantém o valor explicativo de γάρ e traduz de maneira direta a referência masculina de ἄνθρωπος neste contexto.
- source_word: Ῥωμαῖός ἐστιν
  choice: é cidadão romano
  rationale: No contexto jurídico, a expressão se refere à posse da cidadania romana, não meramente à origem étnica ou ao local de residência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Evitou-se um pronome explícito de tratamento na pergunta, pois o grego não determina entre formas portuguesas como “você” e “o senhor”.
