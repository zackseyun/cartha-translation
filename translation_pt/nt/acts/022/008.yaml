id: ACT.22.8
reference: Acts 22:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: pt
  text: 'Eu respondi: “Quem és tu, Senhor[a]?” E ele me disse: “Eu sou Jesus, o Nazareno[b], a quem tu persegues.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ser tanto um título quanto uma maneira cortês de se dirigir a alguém.
    reason: alternative_reading
  - marker: b
    text: Ou “Jesus de Nazaré” ou “Jesus, o Nazoreu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: respondi
  rationale: O aoristo de ἀποκρίνομαι indica uma resposta direta; “respondi” é natural e fiel em português.
- source_word: Τίς εἶ
  choice: Quem és tu?
  rationale: Tradução direta da pergunta, mantendo o pronome explícito, que também prepara o contraste enfático com σὺ na fala de Jesus.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva o título usual de κύριος e a tensão narrativa quanto ao grau de reconhecimento de Jesus por Paulo; “senhor” como tratamento respeitoso permanece possível.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: E ele me disse
  rationale: Expressão idiomática em português para λέγω com πρὸς ἐμέ; “e” representa adequadamente a força conectiva de τε.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Mantém a autoidentificação direta e o pronome enfático do grego.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ὁ Ναζωραῖος
  choice: o Nazareno
  rationale: Conserva o epíteto substantivado do grego e é uma forma corrente e inteligível em português.
- source_word: ὃν σὺ διώκεις
  choice: a quem tu persegues
  rationale: διώκω designa aqui perseguição hostil. “Tu” preserva a ênfase explícita de σὺ e concorda naturalmente com “és” e “persegues”.
theological_decisions:
- issue: Sentido de κύριε na pergunta de Paulo
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento
  rationale: O contexto permite tanto um tratamento respeitoso quanto o título “Senhor”. A tradução principal mantém a formulação tradicional e teologicamente significativa, enquanto a nota preserva a ambiguidade sem decidir quanto Paulo já compreendia naquele momento.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular (“és”, “tu”, “persegues”) para preservar a ênfase pronominal e a solenidade do discurso direto. A pontuação favorece leitura fluente, sem acrescentar interpretação.
