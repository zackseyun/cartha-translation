id: ACT.22.3
reference: Acts 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: pt
  text: Eu sou judeu, nascido em Tarso da Cilícia, mas criado nesta cidade aos pés de Gamaliel[a], instruído segundo o rigor da Lei de nossos antepassados[b] e zeloso por Deus, assim como todos vocês são hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão que indica ter sido discípulo de Gamaliel e recebido instrução dele.
    reason: cultural_note
  - marker: b
    text: 'Ou: «da Lei ancestral».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: sou judeu
  rationale: Em português, «sou judeu» expressa de modo natural a identidade masculina judaica indicada no contexto; traduzir ἀνήρ separadamente como «homem» produziria uma formulação marcada e desnecessária.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: nascido em Tarso da Cilícia
  rationale: Mantém de forma concisa o local de nascimento e o qualificativo geográfico do grego.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: mas criado nesta cidade
  rationale: ἀνατρέφω refere-se aqui à criação e formação desde a juventude; «mas» assinala o contraste entre o lugar de nascimento e o de criação.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: aos pés de Gamaliel
  rationale: Preserva a imagem histórica da relação entre discípulo e mestre; uma nota explica o valor idiomático.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: instruído rigorosamente
  rationale: A formulação portuguesa natural comunica tanto a formação recebida quanto seu caráter exato e rigoroso.
- source_word: τοῦ πατρῴου νόμου
  choice: na Lei de nossos antepassados
  rationale: «Antepassados» transmite o sentido ancestral de πατρῷος, enquanto «nossos» torna explícita a solidariedade retórica de Paulo com seus ouvintes, implícita no contexto.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: zeloso por Deus
  rationale: Reproduz a ideia de intenso zelo religioso sem sugerir necessariamente filiação ao movimento político dos zelotes.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: assim como todos vocês são hoje
  rationale: Preserva a comparação direta e a identificação retórica de Paulo com a disposição presente de seus ouvintes.
theological_decisions:
- issue: Como traduzir πατρῴου νόμου e representar a identificação de Paulo com o público judeu
  choice: a Lei de nossos antepassados
  alternative: a Lei ancestral
  rationale: O adjetivo grego significa «ancestral»; o possessivo «nossos», sustentado pela situação retórica, comunica a herança compartilhada sem introduzir uma distinção doutrinária.
- issue: Preservação do idioma παρὰ τοὺς πόδας Γαμαλιήλ
  choice: aos pés de Gamaliel
  alternative: sob a orientação de Gamaliel
  rationale: A expressão literal conserva a imagem mestre-discípulo e continua inteligível em português; a nota evita possível obscuridade.
- issue: Possível sentido técnico de ζηλωτής
  choice: zeloso por Deus
  alternative: um zelote de Deus
  rationale: O contexto descreve fervor por Deus, e não exige identificação com o grupo político dos zelotes; a tradução mantém essa distinção aberta sem importar uma associação partidária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Lei» recebe inicial maiúscula por designar aqui a Lei judaica como corpo reconhecido de instrução. A construção foi organizada em sequência fluente, preservando o contraste entre nascimento em Tarso e criação em Jerusalém, bem como a imagem «aos pés de Gamaliel».
