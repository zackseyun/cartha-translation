id: ACT.22.24
reference: Acts 22:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: pt
  text: O tribuno ordenou que Paulo fosse levado para a fortaleza[a] e mandou que o interrogassem sob açoites[b], a fim de descobrir por que motivo gritavam assim contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para o quartel» ou «para o acampamento». Aqui, o termo se refere às instalações militares romanas em Jerusalém.
    reason: cultural_note
  - marker: b
    text: Ou «o examinassem por meio de flagelação». O grego combina a linguagem de interrogatório com a menção explícita dos açoites como método.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: tribuno
  rationale: Designa aqui o tribuno militar romano; o termo é historicamente específico e inteligível em português.
- source_word: παρεμβολή
  choice: fortaleza
  rationale: No contexto de Jerusalém, refere-se às instalações militares romanas, provavelmente a Fortaleza Antônia; «fortaleza» comunica melhor o local do que o sentido mais geral de «acampamento».
- source_word: εἰσάγεσθαι
  choice: fosse levado para
  rationale: 'Preserva o infinitivo passivo: Paulo seria conduzido ao interior por outros.'
- source_word: εἴπας
  choice: e mandou
  rationale: Embora literalmente seja «dizendo», o particípio introduz uma ordem subordinada à primeira e «mandou» produz uma sequência natural em português.
- source_word: μάστιξιν
  choice: sob açoites
  rationale: O dativo indica o meio coercitivo do interrogatório; «açoites» preserva a severidade de μάστιξ.
- source_word: ἀνετάζεσθαι
  choice: que o interrogassem
  rationale: No contexto judicial, o verbo indica exame ou interrogatório, cujo método é explicitado por «sob açoites».
- source_word: ἐπιγνῷ
  choice: a fim de descobrir
  rationale: Exprime o propósito de averiguar plenamente a causa da reação da multidão.
- source_word: δι’ ἣν αἰτίαν
  choice: por que motivo
  rationale: Mantém a ideia de causa sem introduzir a noção mais técnica de uma acusação formal.
- source_word: οὕτως
  choice: assim
  rationale: Preserva de modo natural a referência à maneira ou intensidade do clamor.
- source_word: ἐπεφώνουν αὐτῷ
  choice: gritavam assim contra ele
  rationale: O imperfeito retrata um clamor contínuo e hostil; «contra ele» explicita essa direção adversa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome «Paulo» explicita o referente pronominal sem alterar o sentido. A formulação «interrogassem sob açoites» preserva tanto o exame quanto o meio coercitivo, evitando suavizar a violência romana.
