    rationale: “Ficando” tende a indicar permanência ou passagem a um estado, enquanto ἐπιστάς (particípio aoristo) apresenta a ação de aproximar-se e colocar-se junto de Paulo. “Pondo-se ao meu lado” preserva melhor essa ação.
