  naturalness: O texto é claro e de registro apropriado. “Pondo-se ao meu lado” é mais idiomático e mais fiel do que “ficando ao meu lado” neste contexto. “Saulo, meu irmão” é uma forma natural de conservar o vocativo fraterno.
  terminology: “Saulo” e “meu irmão” são adequados. “Recupere a visão / recuperei a visão” reproduz coerentemente o sentido contextual de ἀναβλέπω, sem excluir a alternativa lexical indicada na nota.
