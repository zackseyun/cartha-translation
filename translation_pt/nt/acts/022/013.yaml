base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: pt
  text: 'Ele veio até mim e, pondo-se ao meu lado, disse-me: “Saulo, meu irmão, recupere a visão.” Naquela mesma hora, recuperei a visão e olhei para ele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltei a ver” nas duas ocorrências do verbo grego; ele também pode significar “olhar para cima”, mas o contexto de cegueira e cura favorece a ideia de recuperação da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Ele veio até mim
  rationale: Expressa naturalmente o particípio aoristo e preserva o movimento em direção a Paulo.
- source_word: ἐπιστάς
  choice: ficando ao meu lado
  rationale: Comunica que Ananias tomou posição junto de Paulo, sem sobrecarregar a narrativa com uma construção participial rígida.
- source_word: Σαοὺλ ἀδελφέ
  choice: Saulo, meu irmão
  rationale: Usa a forma portuguesa tradicional do nome e traduz o vocativo de modo natural, preservando a relação fraterna indicada por ἀδελφέ.
- source_word: ἀνάβλεψον / ἀνέβλεψα
  choice: recupere a visão / recuperei a visão
  rationale: No contexto imediato de cegueira e cura, ἀναβλέπω indica restauração da capacidade de ver, embora também possa significar levantar os olhos.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: Naquela mesma hora
  rationale: Preserva a ênfase temporal da expressão grega sem reduzi-la simplesmente a 'imediatamente'.
- source_word: εἰς αὐτόν
  choice: olhei para ele
  rationale: Mantém a força direcional de εἰς e descreve o olhar de Paulo dirigido a Ananias após a recuperação da visão.
- source_word: κἀγώ
  choice: recuperei
  rationale: A primeira pessoa já está marcada na flexão verbal portuguesa; um pronome explícito seria desnecessário e artificial neste contexto.
- source_word: εἶπέν μοι
  choice: disse
  rationale: Em português, o destinatário já está inequívoco porque Ananias está ao lado do narrador e o chama diretamente; repetir 'disse-me' seria possível, mas menos fluido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluência brasileira e compreensão internacional. A repetição de 'recupere/recuperei a visão' espelha deliberadamente a repetição do verbo grego. O marcador da nota foi colocado após a frase à qual se aplica.
