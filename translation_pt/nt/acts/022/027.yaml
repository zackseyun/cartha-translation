  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: pt
  text: 'Então o comandante[a] se aproximou dele e lhe disse: “Diga-me: você é romano[b]?” Ele respondeu: “Sim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tribuno militar”. O termo grego χιλίαρχος designa aqui um oficial romano que comandava uma coorte.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “romano” refere-se a alguém que possuía cidadania romana, como deixa claro o contexto ao redor.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: se aproximou
  rationale: Expressa naturalmente o movimento do comandante em direção a Paulo antes de falar, preservando o valor do particípio aoristo.
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão da narrativa, sem exigir uma ideia forte de contraste.
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa aqui o oficial romano que comandava uma coorte. “Comandante” é claro e corrente em português; a nota registra o título histórico mais específico.
- source_word: εἶπεν αὐτῷ
  choice: perguntou
  rationale: Embora literalmente signifique “disse-lhe”, o conteúdo introduzido é uma pergunta; “perguntou” é a forma idiomática em português e mantém a função do enunciado.
- source_word: Λέγε μοι
  choice: Diga-me
  rationale: Equivalente direto e natural do imperativo seguido do pronome no dativo.
- source_word: σὺ
  choice: você
  rationale: O pronome explícito é preservado. Em português moderno, “você” proporciona ampla legibilidade brasileira sem acrescentar a ênfase excessiva de “você mesmo”.
- source_word: Ῥωμαῖος
  choice: cidadão romano
  rationale: O adjetivo substantivado significa literalmente “romano”, mas neste contexto jurídico a pergunta diz respeito à cidadania romana. A explicitação evita que o leitor moderno entenda apenas origem étnica ou geográfica.
- source_word: Ναί
  choice: Sim
  rationale: Reproduz de modo direto a resposta afirmativa breve do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O nome “Paulo” explicita o referente de αὐτῷ para evitar ambiguidade em português. “Cidadão romano” torna explícito o sentido jurídico inequívoco no contexto, enquanto a sintaxe breve conserva o ritmo do diálogo.
