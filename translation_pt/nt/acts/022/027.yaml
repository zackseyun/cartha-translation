    rationale: O contexto jurídico sustenta essa compreensão, mas Ῥωμαῖος é literalmente «romano». Manter «romano» no texto e explicar a cidadania em nota conserva melhor a concisão e a abertura lexical do original.
  - severity: low
    issue: «Perguntou» em lugar de «disse-lhe»
    rationale: A frase é uma pergunta, mas εἶπεν αὐτῷ significa literalmente «disse-lhe». A formulação revista mantém o verbo de fala do grego.
