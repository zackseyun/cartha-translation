id: ACT.18.9
reference: Acts 18:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: pt
  text: 'E o Senhor disse a Paulo, durante a noite, por meio de uma visão[a]: “Não tenha medo; continue falando e não fique calado,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «numa visão». A expressão grega diz literalmente «por meio de uma visão».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título grego e seu peso cristológico sem explicitar «Jesus», identificação que o contexto de Atos sugere, mas que este versículo não declara.
- source_word: ἐν νυκτὶ
  choice: durante a noite
  rationale: Expressa de modo natural e claro o valor temporal da frase grega.
- source_word: δι’ ὁράματος
  choice: por meio de uma visão
  rationale: Reflete o valor instrumental de διά com o genitivo; «numa visão» também é uma tradução possível.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: É a formulação idiomática no português moderno para a proibição grega, sem tom arcaico.
- source_word: ἀλλὰ λάλει
  choice: continue falando
  rationale: Comunica o aspecto contínuo do imperativo presente λάλει melhor do que o simples «fale».
- source_word: καὶ μὴ σιωπήσῃς
  choice: e não fique calado
  rationale: Traduz naturalmente a proibição e mantém o paralelismo enfático com «continue falando».
theological_decisions:
- issue: Referente de «o Senhor»
  choice: Manter «o Senhor» sem identificação adicional.
  alternative: «o Senhor Jesus»
  rationale: Embora em Atos o referente seja naturalmente o Jesus ressuscitado, o grego traz apenas ὁ κύριος. A tradução conserva o título e evita acrescentar uma identificação não expressa no versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Durante a noite» evita a possível leitura espacial de «na noite»; «por meio de» preserva a instrumentalidade; e o tratamento «tenha» segue o uso brasileiro corrente. A vírgula final foi mantida porque o versículo termina com discurso que continua no versículo seguinte.
