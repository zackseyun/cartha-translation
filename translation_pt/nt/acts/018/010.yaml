source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: pt
  text: pois eu estou com você, e ninguém atacará você para lhe fazer mal, porque tenho muitas pessoas nesta cidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tenho muitas pessoas nesta cidade” provavelmente se refere a muitos em Corinto que pertencem ao Senhor, incluindo os que ainda viriam a crer.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: pois / porque
  rationale: As duas ocorrências introduzem causas. “Pois” liga naturalmente o versículo à ordem anterior, enquanto “porque” apresenta a razão da promessa dentro da própria frase.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: eu estou com você
  rationale: Preserva a afirmação direta da presença divina e mantém o pronome explícito “eu”, que recebe ênfase no grego.
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: ninguém o atacará
  rationale: Neste contexto, ἐπιτίθημι com o dativo indica ação hostil contra Paulo. “Atacará” é claro e atual; a formulação mais concreta “porá as mãos em você” é registrada em nota.
- source_word: τοῦ κακῶσαί σε
  choice: para lhe fazer mal
  rationale: Expressa naturalmente a finalidade ou o resultado pretendido da ação hostil, sem limitar o dano ao aspecto físico.
- source_word: λαός ἐστί μοι πολὺς
  choice: tenho muitas pessoas
  rationale: A construção com εἰμί e o dativo μοι expressa posse. Esta formulação preserva a declaração de pertencimento sem explicitar no texto se inclui apenas os que já creem ou também os que ainda crerão.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: nesta cidade
  rationale: Equivalente direto e natural para a referência a Corinto como centro urbano.
theological_decisions:
- issue: Sentido de “muitas pessoas” na cidade
  choice: 'Manter a afirmação aberta: “tenho muitas pessoas nesta cidade”.'
  alternative: Explicitar “há nesta cidade muitos que me pertencem e ainda crerão”.
  rationale: A fala provavelmente se refere aos que pertencem ao Senhor em Corinto, possivelmente incluindo os que ainda viriam a crer. O texto principal preserva a tensão temporal e teológica, sem impor uma explicação doutrinária mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna a fala direta natural; os clíticos “o” e “lhe” evitam repetição excessiva sem elevar indevidamente o registro.
