id: ACT.18.12
reference: Acts 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: pt
  text: Mas, quando Gálio era procônsul da Acaia, os judeus[a] se levantaram de comum acordo contra Paulo e o levaram ao tribunal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “os judeus” se refere ao grupo judeu local que agiu contra Paulo, não a todos os judeus sem exceção.
    reason: cultural_note
  - marker: b
    text: Ou “ao estrado judicial”. O termo grego designa a plataforma oficial onde o magistrado se sentava para julgar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Gálio
  rationale: Forma tradicional e corrente em português para o nome próprio grego.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição narrativa com leve contraste, introduzindo a nova circunstância e a oposição que se segue.
- source_word: ἀνθυπάτου ὄντος
  choice: quando ... era procônsul
  rationale: Expressa naturalmente em português o valor temporal da construção absoluta no genitivo.
- source_word: ἀνθύπατος
  choice: procônsul
  rationale: Preserva o título oficial específico do governador romano da província, em vez de usar o termo genérico “governador”.
- source_word: Ἀχαΐας
  choice: Acaia
  rationale: Forma consagrada em português para o nome da província romana.
- source_word: κατεπέστησαν
  choice: se levantaram ... contra
  rationale: Comunica ação hostil contra Paulo sem acrescentar violência física não explicitada pelo verbo.
- source_word: ὁμοθυμαδὸν
  choice: juntos
  rationale: Expressa de modo claro e atual a ação concertada do grupo.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação explícita do grego sem restringi-la indevidamente a líderes; a nota esclarece o referente local.
- source_word: τῷ Παύλῳ
  choice: contra Paulo
  rationale: Com o verbo de ação hostil, o dativo indica a pessoa contra quem o grupo agiu.
- source_word: ἤγαγον αὐτὸν
  choice: o levaram
  rationale: Verte o sentido comum de conduzir ou levar, adequado ao contexto jurídico, sem intensificá-lo para “arrastaram”.
- source_word: ἐπὶ τὸ βῆμα
  choice: ao tribunal
  rationale: Comunica de forma acessível o local oficial de julgamento associado à plataforma ou cadeira judicial.
theological_decisions:
- issue: Sentido de οἱ Ἰουδαῖοι em uma narrativa de conflito
  choice: os judeus
  alternative: os líderes judeus; os judeus da região
  rationale: O texto diz literalmente “os judeus” e não especifica apenas líderes. Para evitar uma generalização étnica ou religiosa indevida, a nota esclarece que o referente é o grupo judeu local que agiu contra Paulo, e não todos os judeus universalmente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantêm-se os títulos e topônimos históricos precisos; a sintaxe é natural e preserva o movimento narrativo do grego.
