  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: pt
  text: Depois de descer a Cesareia, ele subiu, saudou a igreja[a] e então desceu para Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Provavelmente, a igreja em Jerusalém; muitas traduções tornam Jerusalém explícita aqui, mas a cidade não é mencionada no texto grego.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: depois de descer
  rationale: O particípio aoristo indica uma ação anterior à sequência principal; “descer” preserva a linguagem direcional e topográfica de Lucas.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma portuguesa consagrada do topônimo; pelo contexto, trata-se de Cesareia Marítima, sem necessidade de explicitação no texto.
- source_word: ἀναβὰς
  choice: ele subiu
  rationale: Mantém o sentido direcional sem acrescentar “a Jerusalém”, destino provável, mas não expresso no grego.
- source_word: ἀσπασάμενος
  choice: saudou
  rationale: Equivalente direto e natural para o ato de cumprimentar a comunidade.
- source_word: τὴν ἐκκλησίαν
  choice: a igreja
  rationale: Termo corrente em português para a comunidade cristã no contexto de Atos.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva a linguagem direcional do relato de viagem e o contraste com “subiu”.
- source_word: Ἀντιόχειαν
  choice: Antioquia
  rationale: Forma portuguesa consagrada; o contexto identifica a Antioquia da Síria sem que seja preciso especificá-la.
theological_decisions:
- issue: Identificação do destino implícito em “ele subiu”
  choice: Manter o destino implícito no texto principal
  alternative: Traduzir explicitamente “ele subiu a Jerusalém”
  rationale: A sequência geográfica e a referência a “a igreja” sugerem fortemente Jerusalém, mas o texto grego não nomeia a cidade. A tradução preserva essa implicação sem transformá-la em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva os movimentos topográficos de “descer”, “subir” e “descer”, bem como a concisão narrativa do original.
