  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: pt
  text: E ele argumentava na sinagoga todos os sábados[a] e procurava persuadir judeus e gregos[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dialogava” ou “debatia”. O verbo grego pode indicar diálogo fundamentado ou argumentação.
    reason: lexical_alternative
  - marker: b
    text: Ou “persuadia”. O imperfeito pode destacar uma ação contínua, entendida aqui como “procurava persuadir”.
    reason: lexical_alternative
  - marker: c
    text: Possivelmente, gregos associados à sinagoga; alguns entendem o termo de modo mais amplo como “gentios”.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: argumentava
  rationale: O imperfeito indica atividade habitual e contínua. “Argumentava” comunica um discurso racional e interativo, sem exigir que se trate de uma disputa hostil; a nota preserva as alternativas “dialogava” e “debatia”.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ funciona como conectivo narrativo leve, sem contraste forte.
- source_word: ἐν τῇ συναγωγῇ
  choice: na sinagoga
  rationale: Tradução locativa direta e natural de ἐν com dativo.
- source_word: κατὰ πᾶν σάββατον
  choice: todos os sábados
  rationale: Expressa naturalmente em português o sentido distributivo de κατά com πᾶν e a ação habitual indicada pelo imperfeito.
- source_word: ἔπειθέν
  choice: procurava persuadir
  rationale: O imperfeito apresenta uma atividade contínua. “Procurava persuadir” evita afirmar que todos foram efetivamente convencidos, embora a forma grega também possa ser traduzida simplesmente por “persuadia”.
- source_word: τε
  choice: e
  rationale: Liga de modo fluente a atividade persuasiva ao discurso precedente.
- source_word: Ἰουδαίους
  choice: judeus
  rationale: Designa aqui os judeus como grupo etnorreligioso, não especificamente habitantes da Judeia.
- source_word: Ἕλληνας
  choice: gregos
  rationale: Preserva a designação explícita do texto, sem substituí-la pela categoria mais ampla “gentios” nem acrescentar “tementes a Deus”.
theological_decisions:
- issue: Identidade dos Ἕλληνας no contexto da sinagoga
  choice: gregos
  alternative: gentios; gregos tementes a Deus
  rationale: O texto os chama de “gregos”. É provável que fossem não judeus ligados à sinagoga, mas o versículo não especifica sua condição religiosa; por isso, a tradução não a restringe.
- issue: Resultado da ação expressa por ἔπειθέν
  choice: procurava persuadir
  alternative: persuadia
  rationale: A formulação destaca o esforço contínuo sem pressupor êxito consumado. Como o grego pode ser vertido de forma mais direta, essa alternativa é registrada em nota.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para a fluência natural: “todos os sábados” aparece em posição inicial, sem mudar seu vínculo com a atividade habitual. As notas preservam as ambiguidades lexicais e contextuais genuínas.'
