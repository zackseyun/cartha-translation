  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: pt
  text: 'dizendo: “Este homem está persuadindo as pessoas a adorar a Deus contra a lei.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de modo contrário à lei” ou “violando a lei”.
    reason: lexical_alternative
  - marker: b
    text: Os acusadores provavelmente se referem à lei judaica, embora o grego diga apenas “a lei”.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'dizendo: “...”'
  rationale: O particípio presente introduz o conteúdo da acusação, e ὅτι pode ser representado naturalmente em português por discurso direto após dois-pontos.
- source_word: Παρὰ τὸν νόμον
  choice: de modo contrário à lei
  rationale: παρά com o acusativo expressa aqui contrariedade ou transgressão; a formulação preserva o tom jurídico sem decidir se a acusação implica mera oposição ou violação formal.
- source_word: ἀναπείθει
  choice: está persuadindo
  rationale: O presente pode ter valor progressivo na acusação. “Persuadindo” conserva a ideia de influenciar ou conquistar adeptos sem acrescentar o sentido necessariamente negativo de “enganando”.
- source_word: οὗτος
  choice: Este homem
  rationale: Mantém a força dêitica e algo incisiva do demonstrativo no contexto da acusação, sem recorrer a uma expressão excessivamente pejorativa.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: O plural é genérico e se refere a seres humanos em geral, não apenas a homens do sexo masculino.
- source_word: σέβεσθαι τὸν θεόν
  choice: a adorar a Deus
  rationale: Neste contexto religioso, σέβομαι denota reverência cultual ou adoração; “adorar a Deus” é claro, natural e fiel.
- source_word: τὸν νόμον
  choice: a lei
  rationale: O grego diz apenas “a lei”. A tradução evita inserir “judaica” ou “nossa”, deixando a identificação contextual para a nota.
theological_decisions:
- issue: Referente de “a lei” na acusação
  choice: Manter a expressão genérica “a lei” no texto principal.
  alternative: “a lei judaica” ou “a nossa lei”
  rationale: Embora os acusadores provavelmente se refiram à lei judaica, o texto grego não a qualifica. Preservar a formulação aberta evita incorporar explicação interpretativa ao texto.
- issue: Alcance de ἀνθρώπους
  choice: “as pessoas”
  alternative: “os homens”
  rationale: O substantivo tem sentido humano genérico neste contexto; “as pessoas” comunica esse alcance com precisão no português contemporâneo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada ao uso natural do português, colocando o complemento de modo após “adorar a Deus”. Os marcadores seguem a expressão que esclarecem.
