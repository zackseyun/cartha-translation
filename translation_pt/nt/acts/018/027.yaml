  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: pt
  text: Quando ele quis passar para a Acaia, os irmãos[a] o encorajaram e escreveram aos discípulos para que o acolhessem. Quando chegou, ajudou muito os que haviam crido pela graça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Os irmãos» pode referir-se à comunidade mais ampla dos que haviam crido, incluindo mulheres, embora o grego use a forma masculina.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Pela graça, ajudou muito os que haviam crido». A expressão grega «pela graça» pode referir-se à ajuda prestada por Apolo, em vez de ao fato de essas pessoas terem crido.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Quando ele quis
  rationale: O genitivo absoluto introduz a circunstância relativa à intenção de Apolo. «Quando ele quis» é natural e preserva o sentido volitivo.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: atravessar para a Acaia
  rationale: O verbo pode sugerir a travessia de Éfeso para a região da Acaia; «atravessar para» conserva essa nuance de deslocamento sem tornar a frase excessivamente formal.
- source_word: προτρεψάμενοι
  choice: o encorajaram
  rationale: O particípio expressa incentivo favorável por parte da comunidade. «Encorajaram» é claro, atual e adequado ao contexto.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Mantém a forma masculina do grego, comum como designação comunitária entre os primeiros cristãos, sem excluir por interpretação a possibilidade de referência ao conjunto dos fiéis.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: escreveram aos discípulos
  rationale: Reproduz diretamente o verbo com o destinatário no dativo e preserva «discípulos», termo característico de Atos.
- source_word: ἀποδέξασθαι αὐτόν
  choice: para que o acolhessem
  rationale: No contexto, o verbo indica receber Apolo de modo favorável. «Acolher» comunica naturalmente a ideia de recepção hospitaleira.
- source_word: ὃς παραγενόμενος
  choice: Quando chegou
  rationale: A oração relativa com particípio retoma Apolo e introduz temporalmente sua atuação na Acaia. A formulação é fluente e mantém o valor temporal.
- source_word: συνεβάλετο πολὺ
  choice: ajudou muito
  rationale: O verbo no médio, neste contexto, indica prestar auxílio ou contribuir de maneira considerável. «Ajudou muito» é idiomático e acessível.
- source_word: τοῖς πεπιστευκόσιν
  choice: os que haviam crido
  rationale: O particípio perfeito aponta para pessoas que já tinham chegado à fé, e «haviam crido» preserva essa anterioridade e seu estado resultante.
- source_word: διὰ τῆς χάριτος
  choice: pela graça
  rationale: A expressão é mantida sem acrescentar «de Deus», que não aparece explicitamente no grego. No texto principal, liga-se ao ato de crer, a leitura sintática mais natural.
theological_decisions:
- issue: Ligação sintática de διὰ τῆς χάριτος
  choice: «pela graça» modifica «haviam crido»
  alternative: '«pela graça» modifica a ajuda prestada por Apolo: «pela graça, ajudou muito os que haviam crido»'
  rationale: A posição da expressão admite ambas as ligações. A leitura principal entende que a graça foi o meio pelo qual eles creram, mas a alternativa, segundo a qual Apolo os ajudou pela graça, é genuína e fica preservada em nota.
translation_notes:
  register: Português contemporâneo, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi mantida próxima do grego onde natural, e a ambiguidade real da expressão «pela graça» foi preservada em nota.
