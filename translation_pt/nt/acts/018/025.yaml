id: ACT.18.25
reference: Acts 18:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: pt
  text: Ele havia sido instruído no caminho do Senhor e, fervoroso em espírito[a], falava e ensinava com exatidão as coisas a respeito de Jesus, conhecendo apenas o batismo de João.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fervoroso no Espírito”, entendendo-se como referência ao Espírito Santo, e não ao próprio espírito de Apolo.'
    reason: Leitura alternativa possível para τῷ πνεύματι; a expressão grega pode indicar tanto o espírito de Apolo quanto o Espírito Santo.
lexical_decisions:
- source_word: κατηχημένος
  choice: havia sido instruído
  rationale: O particípio perfeito passivo indica instrução recebida anteriormente com efeito continuado. A expressão é natural em português e evita os sentidos eclesiásticos posteriores que “catequizado” poderia sugerir.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: no caminho do Senhor
  rationale: Preserva a expressão cristã primitiva “o caminho” e traduz κύριος de modo direto como “Senhor”.
- source_word: ζέων τῷ πνεύματι
  choice: fervoroso em espírito
  rationale: ζέων comunica ardor intenso. Esta formulação é digna e compreensível e mantém aberta, com auxílio da nota, a possibilidade de πνεῦμα se referir ao espírito de Apolo ou ao Espírito Santo.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: falava e ensinava
  rationale: Os imperfeitos retratam atividade continuada ou habitual. “Falava” traduz λαλέω sem acrescentar a ideia mais específica de proclamação.
- source_word: ἀκριβῶς
  choice: com exatidão
  rationale: Expressa precisão e correção no ensino, preservando o contraste narrativo entre a exatidão de Apolo e a extensão limitada de seu conhecimento.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: as coisas a respeito de Jesus
  rationale: Mantém amplo o conteúdo de seu ensino, sem especificar aspectos que o grego não explicita.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: conhecendo apenas o batismo de João
  rationale: Reproduz diretamente a construção participial, sem tornar explicitamente concessiva uma relação que o contexto permite perceber.
theological_decisions:
- issue: Referente de τῷ πνεύματι em ζέων τῷ πνεύματι
  choice: espírito humano / fervor interior
  alternative: Espírito Santo
  rationale: O grego admite ambas as interpretações e não contém distinção gráfica de maiúsculas. O texto principal usa “espírito”, enquanto a nota registra claramente a leitura referente ao Espírito Santo, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha de perto o grego, mas com pontuação natural em português. O marcador foi colocado junto a “espírito”, expressão à qual a nota se refere.
