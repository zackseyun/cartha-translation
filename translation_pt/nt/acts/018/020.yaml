  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: pt
  text: Mas, quando lhe pediram que ficasse por mais tempo, ele não concordou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não consentiu» ou «não acedeu ao pedido». O verbo grego significa assentir ou consentir com um pedido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων δὲ αὐτῶν
  choice: Mas, quando lhe pediram
  rationale: O genitivo absoluto com particípio presente é expresso naturalmente por uma oração temporal. O pronome retoma, pelo contexto, as pessoas em Éfeso, e δέ marca uma leve contraposição narrativa.
- source_word: ἐπὶ πλείονα χρόνον
  choice: por mais tempo
  rationale: Expressão portuguesa natural que mantém o sentido comparativo de πλείονα e indica uma permanência prolongada.
- source_word: μεῖναι
  choice: que ficasse
  rationale: O infinitivo aoristo completa o pedido; em português, a oração com subjuntivo é a formulação mais natural neste contexto de viagem.
- source_word: οὐκ ἐπένευσεν
  choice: ele não concordou
  rationale: ἐπινεύω significa assentir ou consentir com um pedido. «Não concordou» é claro e atual, sem intensificar a expressão para uma recusa categórica.
