base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: pt
  text: Depois de passar algum tempo ali, ele partiu, percorrendo sucessivamente a região da Galácia e a Frígia e fortalecendo todos os discípulos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: Depois de passar algum tempo ali
  rationale: A expressão idiomática significa passar algum tempo. “Ali” explicita naturalmente o lugar mencionado no contexto anterior, sem alterar o sentido.
- source_word: ἐξῆλθεν
  choice: ele partiu
  rationale: No contexto de uma narrativa de viagem, o verbo indica a partida do lugar onde Paulo permanecera.
- source_word: διερχόμενος καθεξῆς
  choice: percorreu, de lugar em lugar
  rationale: A combinação expressa deslocamento contínuo e sucessivo por uma área. A formulação portuguesa é natural e conserva a ideia de progressão por etapas.
- source_word: τὴν Γαλατικὴν χώραν καὶ Φρυγίαν
  choice: a região da Galácia e a Frígia
  rationale: “Região” traduz χώρα sem identificar de modo indevido uma delimitação administrativa específica; os nomes geográficos seguem a forma portuguesa corrente.
- source_word: στηρίζων
  choice: fortalecendo
  rationale: O particípio descreve a ação contínua de tornar firmes ou fortalecer os discípulos, sem especificar além do texto a forma desse apoio.
- source_word: πάντας τοὺς μαθητάς
  choice: todos os discípulos
  rationale: Preserva a abrangência de πάντας e emprega o termo consagrado e claro para os seguidores de Jesus em Atos.
