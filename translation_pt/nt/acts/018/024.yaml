  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: pt
  text: Certo judeu chamado Apolo, natural de Alexandria, homem eloquente[a] e com grande domínio das Escrituras, chegou a Éfeso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «erudito»; a palavra grega λόγιος pode indicar tanto eloquência quanto erudição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: judeu
  rationale: No contexto, identifica Apolo por sua pertença étnico-religiosa, não apenas como habitante da Judeia.
- source_word: δέ
  choice: sem equivalente expresso
  rationale: Marca uma transição narrativa leve; em português, o início direto da frase comunica essa passagem com naturalidade, sem introduzir contraste ou temporalidade inexistentes.
- source_word: τις
  choice: certo
  rationale: Preserva a leve indefinição usada para introduzir um novo participante.
- source_word: Ἀπολλῶς ὀνόματι
  choice: chamado Apolo
  rationale: É a forma idiomática e clara de apresentar o nome da pessoa em português.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: natural de Alexandria
  rationale: Expressa de modo natural sua origem, evitando associações modernas inadequadas de termos como «raça».
- source_word: ἀνὴρ λόγιος
  choice: homem eloquente
  rationale: Mantém a referência masculina explícita e adota um dos sentidos bem atestados de λόγιος; o sentido alternativo, «erudito», é preservado em nota.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: chegou a Éfeso
  rationale: Traduz naturalmente a chegada ao destino e conserva a direção expressa pela preposição grega.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: com grande domínio das Escrituras
  rationale: Comunica de forma corrente a elevada capacidade de Apolo no conhecimento e uso das Escrituras, preservando a força de δυνατός sem uma formulação artificial em português.
