  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: pt
  text: Mas, se houver questões sobre uma palavra[a], nomes e a lei de vocês, vocês mesmos as resolverão; eu não quero ser juiz dessas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mensagem”, “um ensino” ou “uma doutrina”. A palavra grega é ampla e pode referir-se ao conteúdo ensinado ou à terminologia em disputa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: questões
  rationale: O termo designa assuntos sujeitos a investigação ou controvérsia. “Questões” conserva o tom processual sem pressupor hostilidade.
- source_word: περὶ λόγου
  choice: sobre uma palavra
  rationale: λόγος tem sentido amplo. A formulação próxima do grego preserva a ambiguidade entre palavra, mensagem, ensino ou doutrina; as principais possibilidades são registradas em nota.
- source_word: ὀνομάτων
  choice: nomes
  rationale: Tradução direta que não especifica se estão em vista nomes próprios, títulos ou designações.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: a lei de vocês
  rationale: Expressa naturalmente que se trata da lei própria dos interlocutores, em contraste com assuntos da jurisdição romana.
- source_word: ὄψεσθε αὐτοί
  choice: resolvam vocês mesmos
  rationale: O futuro médio é idiomático neste contexto e equivale a cuidar ou tratar do assunto. A repetição de “vocês” preserva a ênfase de αὐτοί.
- source_word: κριτὴς
  choice: juiz
  rationale: Mantém o vocabulário judicial e a recusa de Gálio em arbitrar a controvérsia.
- source_word: τούτων
  choice: dessas coisas
  rationale: Retoma de modo amplo as questões mencionadas anteriormente.
- source_word: οὐ βούλομαι εἶναι
  choice: eu não quero ser
  rationale: Representa com naturalidade moderna a vontade ou disposição expressa por βούλομαι, sem intensificá-la como uma recusa formal.
theological_decisions:
- issue: Alcance de λόγος na rejeição de Gálio
  choice: uma palavra
  alternative: uma mensagem; um ensino; uma doutrina
  rationale: O referente exato não é definido no texto. A tradução mantém a amplitude lexical e evita transformar a controvérsia em uma questão doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “A lei de vocês” e “resolvam vocês mesmos” comunicam naturalmente o distanciamento e a recusa jurisdicional de Gálio; a nota preserva a ambiguidade de λόγος.
