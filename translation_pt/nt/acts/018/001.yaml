lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Transição temporal narrativa natural em português, preservando a sequência indicada pelo grego sem a rigidez de “depois dessas coisas”.
- source_word: χωρισθεὶς
  choice: ele partiu
  rationale: O particípio aoristo passivo de χωρίζω tem aqui sentido idiomático de afastar-se ou partir de um lugar; “partiu” é claro, digno e evita um passivo artificial.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: de Atenas
  rationale: A preposição ἐκ marca o ponto de origem; “partiu de Atenas” reproduz isso de modo natural em português.
- source_word: ἦλθεν
  choice: foi
  rationale: Embora o verbo possa ser traduzido por “veio”, “foi” corresponde naturalmente ao deslocamento narrado de Atenas para outra cidade.
- source_word: εἰς Κόρινθον
  choice: para Corinto
  rationale: εἰς indica movimento em direção ao destino; “para Corinto” é a formulação corrente para deslocamento entre cidades.
