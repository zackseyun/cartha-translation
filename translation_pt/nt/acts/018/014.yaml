translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O texto preserva o idioma “abrir a boca” e o vocativo “ó judeus”, enquanto a conclusão usa uma formulação judicial natural. Todos os marcadores aparecem no texto na ordem correspondente.
