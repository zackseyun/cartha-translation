  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: pt
  text: 'Mas, quando Paulo estava prestes a abrir a boca[a], Gálio disse aos judeus: “Se fosse algum delito ou crime perverso[b], ó judeus, com razão eu os toleraria[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava prestes a falar”. O grego diz literalmente “abrir a boca”, expressão que significa começar a falar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ato criminoso e perverso”. A expressão grega combina um termo para conduta criminosa com um adjetivo que significa “mau” ou “perverso”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “seria razoável que eu os suportasse” ou “eu os toleraria com razão”. O verbo grego pode significar suportar, tolerar ou aguentar; no contexto, isso se refere à queixa que lhe apresentavam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: quando Paulo estava prestes a abrir a boca
  rationale: A construção com μέλλω + infinitivo indica uma ação iminente. “Abrir a boca” preserva o idiomatismo grego, compreensível em português como começar a falar.
- source_word: δὲ
  choice: Mas
  rationale: 'Marca uma transição narrativa com leve contraste: Paulo estava para responder, mas Gálio falou antes.'
- source_word: Γαλλίων
  choice: Gálio
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: aos judeus
  rationale: Reproduz diretamente o grupo mencionado no grego sem acrescentar a especificação interpretativa “acusadores”.
- source_word: Εἰ μὲν ἦν
  choice: Se fosse
  rationale: Introduz de modo natural a condição contrária ao caso que Gálio tinha diante de si; μέν não exige representação explícita neste ponto.
- source_word: ἀδίκημά τι
  choice: algum delito
  rationale: No contexto judicial, ἀδίκημα designa uma transgressão ou infração; “delito” conserva essa dimensão legal sem especificá-la em excesso.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: crime perverso
  rationale: A expressão combina uma ação criminosa com qualificação moral negativa. “Crime perverso” preserva ambos os componentes sem suavizar πονηρόν.
- source_word: ὦ Ἰουδαῖοι
  choice: ó judeus
  rationale: Mantém a partícula vocativa e o tom retórico do discurso direto; a construção continua inteligível e digna em português.
- source_word: κατὰ λόγον
  choice: seria razoável
  rationale: A expressão significa “com razão” ou “justificadamente”; ligada à oração seguinte, indica que Gálio teria fundamento legítimo para lhes dar audiência.
- source_word: ἀνεσχόμην ὑμῶν
  choice: que eu os ouvisse com paciência
  rationale: No contexto de um magistrado diante de denunciantes, ἀνέχομαι significa suportar ou tolerar a fala deles. A formulação portuguesa torna explícita a audiência implícita no contexto, preservando o tom de impaciência de Gálio.
