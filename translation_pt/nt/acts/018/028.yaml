id: ACT.18.28
reference: Acts 18:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: pt
  text: Pois refutava vigorosamente os judeus em público, demonstrando pelas Escrituras que Jesus é o Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o Messias é Jesus”. A oração infinitiva grega pode ser representada nas duas ordens.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “o Cristo”; aqui traduzido como “o Messias”, pois o termo funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: vigorosamente
  rationale: Expressa a intensidade e a força persuasiva da argumentação, em português natural.
- source_word: διακατηλέγχετο
  choice: refutava
  rationale: O verbo comunica contestação completa e convincente; o imperfeito é preservado pela forma verbal portuguesa, indicando ação continuada ou repetida.
- source_word: τοῖς Ἰουδαίοις
  choice: os judeus
  rationale: Reprodução direta do grupo designado no texto; no contexto, refere-se aos interlocutores judeus com quem Apolo debatia.
- source_word: δημοσίᾳ
  choice: em público
  rationale: Indica de modo idiomático o cenário público em que ocorria a refutação.
- source_word: ἐπιδεικνὺς
  choice: demonstrando
  rationale: Preserva o caráter argumentativo e fundamentado da exposição e explica como se dava a refutação.
- source_word: διὰ τῶν γραφῶν
  choice: pelas Escrituras
  rationale: 'Comunica o valor instrumental de διά com o genitivo: as Escrituras eram o meio da demonstração.'
- source_word: τὸν χριστὸν
  choice: o Messias
  rationale: Χριστός funciona aqui como título do ungido prometido, dentro de uma argumentação baseada nas Escrituras judaicas.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: que Jesus é o Messias
  rationale: É a ordem mais natural em português e preserva a afirmação identificadora da oração infinitiva grega, sem excluir a formulação inversa possível.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo identifica Jesus como o ungido prometido nas Escrituras, e não funciona primariamente como parte de um nome.
- issue: Ordem da afirmação identificadora
  choice: Jesus é o Messias
  alternative: o Messias é Jesus
  rationale: A construção infinitiva grega admite as duas representações; a escolhida é mais natural em português, enquanto a alternativa é registrada para preservar a ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a força argumentativa do grego e evita linguagem arcaica.
