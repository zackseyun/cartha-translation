id: ACT.18.7
reference: Acts 18:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: pt
  text: E, saindo dali, entrou na casa de um homem chamado Tício Justo, que adorava a Deus[a]. A casa dele ficava ao lado da sinagoga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que temia a Deus” ou “adorador de Deus”. O grego descreve um gentio devotado ao Deus de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “era contígua à sinagoga” ou “dividia um limite com a sinagoga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: saindo dali
  rationale: O particípio aoristo com o advérbio indica a saída do lugar mencionado anteriormente. A formulação preserva a sequência narrativa com naturalidade em português.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: entrou na casa de um homem
  rationale: Reproduz de modo idiomático o verbo de movimento e o pronome indefinido que identifica o proprietário da casa.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: chamado Tício Justo
  rationale: Equivalente corrente da construção grega com ὀνόματι; os nomes são transliterados em forma natural para o português.
- source_word: σεβομένου τὸν θεόν
  choice: que adorava a Deus
  rationale: O particípio descreve a devoção de Tício Justo ao Deus de Israel sem impor no texto principal um rótulo socioreligioso técnico.
- source_word: οὗ ἡ οἰκία
  choice: A casa dele
  rationale: A retomada por uma nova oração evita a sequência pesada de relativos que resultaria de uma reprodução rígida do grego e mantém inequívoca a referência a Tício Justo.
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: ficava ao lado da sinagoga
  rationale: Expressa com clareza que a casa era contígua ou limítrofe à sinagoga, em registro atual e digno.
theological_decisions:
- issue: Descrição de Tício Justo como σεβόμενος τὸν θεόν
  choice: que adorava a Deus
  alternative: que temia a Deus; adorador de Deus
  rationale: A expressão indica um gentio devotado ao Deus de Israel, mas não exige que se introduza no texto principal a categoria semitécnica de “temente a Deus”. A nota preserva essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A longa oração relativa grega foi dividida em duas frases para evitar ambiguidade e tornar a leitura natural, sem perder a ligação entre Tício Justo e a casa. Todos os marcadores de nota aparecem no texto principal.
