  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: pt
  text: 'Mas, como eles se opunham e blasfemavam[a], Paulo sacudiu as vestes e lhes disse: “O sangue de vocês está sobre a cabeça de vocês![b] Estou sem culpa. De agora em diante, irei aos gentios[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falavam de modo insultuoso”. O verbo grego pode indicar fala blasfema ou insultos hostis; aqui o objeto dessa fala não é explicitado.
    reason: lexical_alternative
  - marker: b
    text: “O sangue de vocês está sobre a cabeça de vocês” é uma expressão que atribui a eles a responsabilidade pelas consequências.
    reason: cultural_note
  - marker: c
    text: Ou “às nações”; neste contexto, refere-se aos não judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: se opunham
  rationale: Expressa de modo natural e conciso a oposição ativa deles à mensagem anunciada por Paulo.
- source_word: βλασφημούντων
  choice: blasfemavam
  rationale: Mantém a amplitude e a força do verbo grego sem acrescentar um objeto não explícito; o verbo pode indicar fala blasfema ou insultuosa.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: sacudiu as vestes
  rationale: Preserva o gesto simbólico de dissociação e responsabilidade, com formulação digna e compreensível.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Que o sangue de vocês caia sobre a própria cabeça!
  rationale: Conserva a imagem idiomática e seu tom solene, indicando que a responsabilidade pelas consequências recai sobre os ouvintes.
- source_word: καθαρὸς ἐγώ
  choice: Eu estou inocente
  rationale: Transmite o sentido metafórico de estar livre de culpa ou responsabilidade, em vez do literal potencialmente enganoso 'limpo'.
- source_word: ἀπὸ τοῦ νῦν
  choice: De agora em diante
  rationale: Marca de modo idiomático uma mudança decisiva na direção do ministério de Paulo.
- source_word: εἰς τὰ ἔθνη
  choice: aos gentios
  rationale: No contraste contextual com os ouvintes da sinagoga, refere-se aos não judeus; 'gentios' é claro e tradicional sem perder precisão.
- source_word: πορεύσομαι
  choice: irei
  rationale: Reproduz de forma direta e natural a intenção futura de movimento e missão.
theological_decisions:
- issue: 'Fórmula de responsabilidade: ''o sangue de vocês ... sobre a própria cabeça'''
  choice: Declaração de que os ouvintes são responsáveis pelas consequências de rejeitar a mensagem, e Paulo está livre dessa responsabilidade.
  alternative: Fórmula de maldição em sentido imprecatório mais forte.
  rationale: A expressão ecoa a linguagem bíblica de responsabilidade e funciona como uma solene exoneração de Paulo após seu testemunho; a tradução mantém a imagem sem transformá-la explicitamente em uma maldição.
- issue: Referente de βλασφημούντων
  choice: Não explicitar se a blasfêmia se dirige a Deus, à mensagem ou a Paulo.
  alternative: Traduzir 'o insultavam' ou 'falavam mal dele'.
  rationale: O texto grego não traz objeto expresso. 'Blasfemavam' preserva essa ambiguidade e evita inserir Paulo como objeto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural e mantém a solenidade da declaração. A repetição grega de 'vocês' e 'cabeça de vocês' foi ajustada para 'a própria cabeça', forma portuguesa natural com sentido distributivo. Todos os marcadores de nota aparecem no texto.
