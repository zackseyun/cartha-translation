  text: And he drove them away from the judgment seat[a].
translation:
  language: pt
  text: E os expulsou do tribunal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do estrado judicial” ou “do assento do juiz”; o termo grego βῆμα designa o estrado ou assento oficial de onde o magistrado julgava e, neste contexto, pode referir-se ao tribunal.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples do grego, sem acrescentar uma relação temporal ou causal mais específica.
- source_word: ἀπήλασεν
  choice: expulsou
  rationale: O aoristo de ἀπελαύνω indica afastamento imposto por autoridade e pode sugerir ação enérgica; “expulsou” é natural e mais forte que “dispensou”.
- source_word: αὐτοὺς
  choice: os
  rationale: Retoma contextualmente os acusadores sem explicitar no versículo uma identificação que o pronome grego deixa implícita.
- source_word: ἀπὸ τοῦ βήματος
  choice: do tribunal
  rationale: Neste contexto judicial, βῆμα designa o assento ou a plataforma oficial onde o magistrado julgava e, por extensão, o local da audiência; “do tribunal” comunica naturalmente que foram afastados dali.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação concisa acompanha a estrutura do grego; “tribunal” evita a possível estranheza de uma tradução excessivamente literal, enquanto a nota preserva a imagem concreta do βῆμα.
