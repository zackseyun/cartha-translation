  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: pt
  text: E, por ter o mesmo ofício, ficou com eles e trabalhou, pois tinham como ofício fabricar tendas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “trabalhadores do couro”; o termo grego pode designar, de modo mais amplo, quem fabricava tendas ou exercia um ofício relacionado.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: por exercer a mesma profissão
  rationale: A construção διά com infinitivo articular indica causa. A formulação comunica de modo natural que Paulo tinha o mesmo ofício de Áquila e Priscila.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: ficou com eles
  rationale: O verbo μένω, neste contexto narrativo, indica que Paulo permaneceu ou se hospedou com eles; “ficou com eles” é claro e natural sem estreitar o sentido.
- source_word: ἠργάζετο
  choice: trabalhou
  rationale: ἐργάζομαι se refere aqui ao exercício do trabalho manual. O passado simples produz uma narrativa natural em português, enquanto o contexto preserva a ideia de atividade continuada.
- source_word: σκηνοποιοὶ
  choice: fabricantes de tendas
  rationale: Este é o sentido tradicional e mais provável do termo. A possível referência mais ampla a trabalhadores de couro é preservada em nota.
- source_word: τῇ τέχνῃ
  choice: por profissão
  rationale: τέχνη designa ofício, arte ou profissão. A expressão esclarece que fabricar tendas era a atividade profissional deles.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome “Paulo”, implícito no sujeito verbal e explícito no contexto, foi empregado para evitar ambiguidade em um versículo isolado. A repetição de “profissão” reflete as duas referências gregas ao ofício, embora com leve peso estilístico.
