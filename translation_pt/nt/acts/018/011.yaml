  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: pt
  text: Assim, ele permaneceu ali durante um ano e seis meses, ensinando entre eles a palavra de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: permaneceu ali
  rationale: Embora o verbo signifique literalmente “sentou-se”, neste contexto narrativo tem sentido idiomático de permanecer num lugar por certo período. “Permaneceu ali” comunica isso de modo natural e digno.
- source_word: δὲ
  choice: Assim
  rationale: A partícula é um conectivo leve e aqui liga a permanência de Paulo ao encorajamento divino dos versículos anteriores. “Assim” expressa essa continuidade sem criar um contraste indevido.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: durante um ano e seis meses
  rationale: A expressão está no acusativo de duração. A inclusão de “durante” torna explícita e natural em português a extensão temporal.
- source_word: διδάσκων
  choice: ensinando
  rationale: O particípio presente indica uma atividade contínua e simultânea à permanência de Paulo.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: 'A preposição com o pronome tem aqui sentido locativo e social: Paulo ensinava no meio daquela comunidade.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: A expressão preserva a formulação bíblica consagrada e a ressonância teológica de λόγος como a mensagem procedente de Deus.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação acompanha de perto o grego sem reproduzir literalmente o idiomatismo de ἐκάθισεν.
