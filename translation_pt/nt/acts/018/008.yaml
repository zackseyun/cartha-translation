  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: pt
  text: Mas Crispo, o chefe da sinagoga, creu no Senhor com todos os de sua casa. E muitos dos coríntios que ouviam criam e eram batizados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “muitos dos coríntios, quando ouviram, creram e foram batizados”. As formas verbais gregas retratam a resposta como algo que se desenvolvia.'
    reason: Alternativa lexical e esclarecimento do aspecto verbal.
lexical_decisions:
- source_word: Κρίσπος
  choice: Crispo
  rationale: Adota a forma tradicional e reconhecível do nome próprio em português.
- source_word: ἀρχισυνάγωγος
  choice: chefe da sinagoga
  rationale: Expressa de modo claro e natural a função de principal dirigente ou autoridade da sinagoga, sem definir em excesso suas atribuições administrativas.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: creu no Senhor
  rationale: Traduz diretamente o aoristo de πιστεύω e emprega a regência portuguesa natural. Mantém o título κύριος como “Senhor”, sem explicitar no texto o referente contextual.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: com todos os de sua casa
  rationale: Comunica o sentido social de οἶκος como grupo doméstico, e não como edifício, preservando a abrangência de ὅλος.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: muitos dos coríntios
  rationale: 'Preserva naturalmente o sentido partitivo: muitos dentre os habitantes de Corinto.'
- source_word: ἀκούοντες
  choice: à medida que ouviam
  rationale: Representa o particípio presente como ação concomitante e em desenvolvimento, sem acrescentar um objeto que o grego deixa implícito.
- source_word: ἐπίστευον καὶ ἐβαπτίζοντο
  choice: iam crendo e sendo batizados
  rationale: Reproduz o aspecto progressivo ou reiterado dos dois imperfeitos e conserva a voz passiva de ἐβαπτίζοντο, em português compreensível.
theological_decisions:
- issue: Alcance da fé dos de sua casa
  choice: Manter a declaração coletiva de que Crispo creu “com todos os de sua casa”, sem explicar como cada pessoa participou dessa fé.
  alternative: Afirmar explicitamente que cada integrante professou fé individual, ou tratar a casa apenas como uma unidade corporativa.
  rationale: O texto inclui toda a casa, mas não descreve os pormenores da resposta de cada integrante; a tradução não deve impor uma conclusão denominacional sobre fé ou batismo doméstico.
- issue: Referente de “Senhor”
  choice: Traduzir κύριος simplesmente como “Senhor”.
  alternative: Expandir para “Senhor Jesus”.
  rationale: No contexto de Atos, o referente é Jesus, mas o texto grego deste versículo traz apenas o título κύριος; a formulação preserva essa concisão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção “iam crendo e sendo batizados” preserva o caráter progressivo da narrativa sem recorrer ao potencialmente ambíguo “criam”.
