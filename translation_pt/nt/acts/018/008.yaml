  naturalness: “Crispo, o chefe da sinagoga” e “com todos os de sua casa” são claros e adequados. A redação final deve preferir uma construção portuguesa mais fluente para os imperfeitos, sem perder seu valor descritivo/iterativo.
  terminology: “Crispo”, “chefe da sinagoga”, “Senhor” e “os de sua casa” são escolhas adequadas. A expressão não introduz conclusões sobre a natureza da fé da casa nem amplia “Senhor” para “Senhor Jesus”.
