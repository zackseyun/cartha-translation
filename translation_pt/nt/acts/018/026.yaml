id: ACT.18.26
reference: Acts 18:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: pt
  text: E começou a falar com coragem na sinagoga. Quando Priscila e Áquila o ouviram, levaram-no à parte[a] e lhe explicaram com mais exatidão o caminho de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «levaram-no consigo» ou «o acolheram». O verbo grego pode indicar tanto receber ou acolher alguém como tomá-lo à parte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: E
  rationale: O demonstrativo retoma Apolo no contexto anterior, enquanto τέ dá leve continuidade narrativa. Em português, a elipse natural do pronome evita a forma pesada «este homem».
- source_word: ἤρξατο παρρησιάζεσθαι
  choice: começou a falar com coragem
  rationale: Preserva o aspecto ingressivo de ἤρξατο e o sentido de fala aberta, confiante e destemida de παρρησιάζεσθαι, em linguagem corrente e digna.
- source_word: ἐν τῇ συναγωγῇ
  choice: na sinagoga
  rationale: Tradução locativa direta e consagrada.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Quando Priscila e Áquila o ouviram
  rationale: O particípio tem valor temporal. O desenvolvimento marcado por δέ flui naturalmente sem conjunção adversativa explícita em português.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priscila e Áquila
  rationale: Formas portuguesas usuais dos nomes, mantendo a ordem do texto grego.
- source_word: προσελάβοντο αὐτὸν
  choice: levaram-no à parte
  rationale: No contexto da explicação que se segue, exprime de modo natural uma conversa reservada. Como o verbo também pode significar acolher ou levar consigo, a ambiguidade lexical é registrada em nota.
- source_word: ἀκριβέστερον
  choice: com mais exatidão
  rationale: Mantém a força comparativa e a ideia de maior precisão, sem sugerir que tudo o que Apolo já ensinava fosse falso.
- source_word: ἐξέθεντο
  choice: explicaram
  rationale: O médio de ἐκτίθημι aqui significa expor ou explicar; «explicaram» é claro e atual.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: o caminho de Deus
  rationale: Preserva a expressão genitiva e sua possível função como designação do caminho ou mensagem cristã, sem explicitar além do texto.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo português expressa naturalmente o objeto indireto de «explicaram».
theological_decisions:
- issue: Natureza da ação de Priscila e Áquila em relação a Apolo
  choice: levaram-no à parte para uma explicação mais precisa
  alternative: acolheram-no ou levaram-no consigo
  rationale: A instrução subsequente favorece a ideia de uma conversa reservada, mas o verbo grego comporta também recepção ou acolhimento. A nota preserva essa abertura e o texto não sugere repreensão pública nem define estruturas formais de autoridade.
- issue: Sentido de «o caminho de Deus»
  choice: manter a expressão abrangente do original
  alternative: explicitar como a mensagem cristã completa ou apenas como a conduta moral desejada por Deus
  rationale: No contexto, a expressão provavelmente designa o caminho ou a mensagem cristã, mas o original não delimita seu conteúdo aqui. A tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Falar com coragem» comunica a franqueza confiante do verbo grego sem soar arcaico; «com mais exatidão» conserva a comparação. A colocação pronominal «levaram-no» mantém um registro bíblico moderadamente formal, enquanto «lhe explicaram» é natural no uso brasileiro escrito.
