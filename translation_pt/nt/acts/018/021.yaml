  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: pt
  text: 'mas, depois de se despedir e dizer[a]: “Voltarei outra vez para junto de vocês, se Deus quiser”[b], zarpou de Éfeso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem “e dizer: ‘Voltarei outra vez para junto de vocês, se Deus quiser’”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “se for da vontade de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste com o pedido anterior para que Paulo permanecesse mais tempo; “mas” é o adversativo mais natural em português.
- source_word: ἀποταξάμενος
  choice: depois de se despedir
  rationale: O particípio aoristo médio indica que Paulo se despediu antes de partir; a formulação é natural e mantém a sequência temporal.
- source_word: καὶ εἰπών
  choice: e dizer
  rationale: Preserva o segundo particípio coordenado e se liga naturalmente a “depois de” na construção portuguesa.
- source_word: Πάλιν
  choice: outra vez
  rationale: Expressa claramente a repetição do retorno e soa natural junto de “voltarei”.
- source_word: ἀνακάμψω
  choice: voltarei
  rationale: O futuro indica o propósito de retornar; “voltarei” é claro, digno e adequado ao estilo narrativo.
- source_word: πρὸς ὑμᾶς
  choice: para junto de vocês
  rationale: Expressa a direção pessoal de πρός com o acusativo. “Vocês” oferece leitura brasileira clara sem perder a compreensão internacional.
- source_word: τοῦ θεοῦ θέλοντος
  choice: se Deus quiser
  rationale: O genitivo absoluto expressa a contingência do plano sob a vontade de Deus; esta é a formulação portuguesa mais direta e idiomática.
- source_word: ἀνήχθη
  choice: zarpou
  rationale: No contexto de viagem marítima, ἀνάγω significa partir por mar. “Zarpou” comunica esse sentido de modo conciso.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: de Éfeso
  rationale: Traduz diretamente a origem da partida e emprega a forma portuguesa convencional do nome da cidade.
theological_decisions:
- issue: A vontade divina condiciona o plano de viagem de Paulo
  choice: se Deus quiser
  alternative: se for da vontade de Deus
  rationale: O grego menciona explicitamente Deus, e a tradução mantém a dependência do plano de Paulo em relação à vontade divina, sem substituir “Deus” por “Senhor” nem tornar a condição menos explícita.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade no Brasil e compreensão ampla. “Zarpou” preserva o sentido náutico do verbo, enquanto “para junto de vocês” evita redundância excessiva e mantém explícita a direção pessoal do retorno.
