source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: pt
  text: Paulo permaneceu ainda muitos dias e, depois de se despedir dos irmãos[a], partiu por mar rumo à Síria com Priscila e Áquila. Em Cencreia, cortou o cabelo[b], pois estava sob voto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” provavelmente designa a comunidade dos que criam, incluindo mulheres e homens.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rapou a cabeça”. O verbo grego pode indicar cortar ou tosquiar o cabelo, sem exigir necessariamente uma raspagem completa. Alguns intérpretes entendem que o corte se refere a Áquila, mas a gramática aponta mais naturalmente para Paulo.'
    reason: lexical_and_alternative_reading
  - marker: c
    text: O texto diz apenas “um voto”. Muitos o relacionam a um voto de tipo nazireu, mas isso não é declarado explicitamente.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας
  choice: depois de permanecer
  rationale: O particípio aoristo indica uma ação anterior à partida; a formulação é natural em português e não acrescenta um local que não está expresso.
- source_word: ἔτι ... ἡμέρας ἱκανὰς
  choice: ainda muitos dias
  rationale: Preserva tanto a ideia de continuação em ἔτι quanto a de uma quantidade considerável em ἱκανάς.
- source_word: τοῖς ἀδελφοῖς
  choice: dos irmãos
  rationale: Mantém o termo familiar masculino do grego; uma nota esclarece seu provável sentido comunitário inclusivo.
- source_word: ἀποταξάμενος
  choice: se despediu
  rationale: 'Expressa de modo atual e conciso o sentido do particípio médio: despedir-se ou tomar licença de alguém.'
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: partiu de navio para a Síria
  rationale: Comunica tanto a partida por mar quanto o destino.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: levando consigo Priscila e Áquila
  rationale: Identifica os companheiros de viagem de forma fluente, sem perder a relação expressa por σὺν αὐτῷ.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: mandou cortar bem curto o cabelo
  rationale: κειράμενος pode indicar cortar, tosquiar ou rapar. A formulação evita afirmar com certeza uma raspagem completa, mantém a ação reflexiva/causativa natural em português e explicita idiomaticamente que se trata do cabelo.
- source_word: ἐν Κεγχρεαῖς
  choice: Em Cencreia
  rationale: Emprega a forma portuguesa corrente do topônimo e preserva a indicação de lugar.
- source_word: εἶχεν γὰρ εὐχήν
  choice: pois estava sob um voto
  rationale: Verte o idiomatismo como uma obrigação votiva vigente, sem especificar uma modalidade de voto não declarada pelo texto.
theological_decisions:
- issue: Referente de κειράμενος (“tendo cortado/rapado”)
  choice: A ação é atribuída a Paulo.
  alternative: Alguns entendem que a ação se refere a Áquila.
  rationale: O particípio masculino singular retoma mais naturalmente Paulo, sujeito controlador da oração, embora a proximidade do nome Áquila tenha produzido uma leitura alternativa digna de nota.
- issue: Natureza de εὐχή
  choice: “um voto”, sem qualificação adicional
  alternative: um voto de tipo nazireu
  rationale: O texto não identifica o voto como nazireu; especificá-lo importaria uma conclusão histórica ou ritual não expressa.
- issue: Extensão do corte de cabelo
  choice: “cortar bem curto”, sem afirmar raspagem completa
  alternative: “rapar a cabeça”
  rationale: κείρω pode designar corte ou tosquia e, no contexto, talvez rapagem ritual; a tradução conserva essa margem lexical em vez de eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluência brasileira. A sintaxe foi dividida de modo legível, mantendo a sequência narrativa. Evitou-se acrescentar “ali”, ausente do grego, e preservaram-se em notas as ambiguidades reais relativas ao corte e ao voto.
