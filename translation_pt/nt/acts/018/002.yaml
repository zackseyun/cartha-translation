  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: pt
  text: E encontrou um judeu chamado Áquila, natural do Ponto, que havia chegado recentemente da Itália com sua esposa Priscila, porque Cláudio tinha ordenado que todos os judeus saíssem de Roma[a]; e aproximou-se deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fossem expulsos de Roma”. O grego fala mais literalmente em serem separados de Roma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: encontrou
  rationale: O particípio aoristo introduz uma ação anterior à aproximação de Paulo; “encontrou” é direto e natural no fluxo narrativo.
- source_word: τινα Ἰουδαῖον
  choice: um judeu
  rationale: A expressão identifica um indivíduo por sua identidade étnico-religiosa; “um judeu” é a forma mais direta em português.
- source_word: ὀνόματι Ἀκύλαν
  choice: chamado Áquila
  rationale: Reproduz naturalmente o idioma grego usado para apresentar o nome de uma pessoa.
- source_word: Ποντικὸν τῷ γένει
  choice: natural do Ponto
  rationale: A expressão indica origem geográfica ou lugar de nascimento; “natural do Ponto” é clara e idiomática.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: que havia chegado recentemente da Itália
  rationale: O particípio perfeito indica chegada anterior com relevância presente; a forma verbal portuguesa preserva essa anterioridade.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: com sua esposa Priscila
  rationale: Neste contexto, καί liga Priscila à chegada de Áquila; “com” expressa essa relação com naturalidade em português.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: porque Cláudio tinha ordenado
  rationale: διά com infinitivo articular exprime causa, e διατάσσω designa aqui uma ordem oficial.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: que todos os judeus saíssem de Roma
  rationale: A construção expressa separação de Roma. “Saíssem de Roma” comunica o resultado da ordem sem acrescentar explicitamente a ideia mais forte de expulsão.
- source_word: προσῆλθεν αὐτοῖς
  choice: foi procurá-los
  rationale: προσέρχομαι indica ir ou aproximar-se de alguém. No contexto narrativo, “foi procurá-los” transmite de modo natural a aproximação intencional, sem sugerir apenas um encontro fortuito.
theological_decisions:
- issue: Sentido de Ἰουδαῖον / Ἰουδαίους
  choice: judeu / judeus
  alternative: judeano / judeanos
  rationale: O contexto trata do povo judeu residente em Roma, em sentido étnico-religioso, e não apenas de habitantes da Judeia.
- issue: Força da ordem de Cláudio
  choice: saíssem de Roma
  alternative: fossem expulsos de Roma
  rationale: O grego fala literalmente de serem separados de Roma. A tradução principal preserva esse sentido sem definir se a ordem foi formulada explicitamente como expulsão; a alternativa interpretativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a sequência narrativa e a anterioridade da chegada de Áquila e Priscila, sem tornar a formulação excessivamente literal.
