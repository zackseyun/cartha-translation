revisions:
- from: E encontrou um judeu chamado Áquila, natural do Ponto, que havia chegado recentemente da Itália com sua esposa Priscila, porque Cláudio tinha ordenado que todos os judeus saíssem de Roma[a]. Então foi procurá-los.
  to: E encontrou um judeu chamado Áquila, natural do Ponto, que havia chegado recentemente da Itália com sua esposa Priscila, porque Cláudio tinha ordenado que todos os judeus saíssem de Roma[a]; e aproximou-se deles.
  rationale: A revisão substitui “foi procurá-los” por “aproximou-se deles”, equivalente mais direto de προσῆλθεν αὐτοῖς, e elimina “Então”, que não é necessário para representar a coordenação grega. O restante da tradução e a nota preservam com precisão e naturalidade a ambiguidade da ordem de Cláudio.
