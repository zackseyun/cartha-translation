base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: pt
  text: Chegaram a Éfeso[a], e ele os deixou ali[b]; ele mesmo, porém, entrou na sinagoga e dialogou[c] com os judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alcançaram Éfeso”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, deixou ali seus companheiros, Priscila e Áquila, mencionados no versículo anterior.
    reason: cross_reference
  - marker: c
    text: 'Ou: “conversou de modo argumentativo com” ou “debateu com”. O verbo grego sugere diálogo fundamentado, sem indicar necessariamente uma discussão hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: Chegaram
  rationale: O verbo indica chegar ou alcançar um destino. “Chegaram a Éfeso” é natural em português e preserva o plural do texto-fonte.
- source_word: δὲ … δὲ
  choice: e … porém
  rationale: A primeira ocorrência dá continuidade à narrativa; a segunda assinala o contraste entre os companheiros deixados em Éfeso e a ação pessoal de Paulo.
- source_word: κἀκείνους
  choice: os
  rationale: A forma significa “e aqueles” e retoma os companheiros mencionados no versículo anterior. O pronome evita inserir os nomes no corpo do versículo.
- source_word: κατέλιπεν … αὐτοῦ
  choice: deixou ali
  rationale: A combinação expressa que ele os deixou naquele lugar. “Ali” comunica de modo claro o valor locativo de αὐτοῦ.
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Preserva a ênfase do pronome e o contraste com os companheiros que permaneceram em Éfeso.
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: entrou na sinagoga
  rationale: Converte naturalmente o particípio grego em verbo coordenado sem perder a sequência da ação.
- source_word: διελέξατο
  choice: dialogou com
  rationale: O verbo descreve uma conversa argumentada ou exposição mediante diálogo. “Dialogou” mantém o caráter recíproco e evita o tom necessariamente hostil que “discutiu” pode ter em português.
- source_word: τοῖς Ἰουδαίοις
  choice: os judeus
  rationale: É a tradução direta da designação étnico-religiosa no contexto da sinagoga; especificar “líderes” restringiria indevidamente o referente.
