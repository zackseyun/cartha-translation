id: ACT.18.5
reference: Acts 18:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: pt
  text: Quando, porém, Silas e Timóteo desceram da Macedônia, Paulo se dedicava inteiramente à palavra[a], dando testemunho solene aos judeus de que Jesus é o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era impelido pela palavra” ou “estava absorvido na mensagem”. O verbo grego pode indicar estar tomado, pressionado ou inteiramente dedicado a algo.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo”. Aqui, o termo é um título e significa “Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quando, porém
  rationale: Combina o valor temporal de ὡς com a transição marcada por δέ, em português natural.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: desceram da Macedônia
  rationale: Preserva o verbo de deslocamento κατέρχομαι e o modo lucano de descrever viagens.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas e Timóteo
  rationale: Identifica com clareza os dois integrantes do sujeito conjunto sem tornar a frase pesada.
- source_word: συνείχετο τῷ λόγῳ
  choice: se dedicava inteiramente à palavra
  rationale: Expressa que Paulo estava absorvido ou intensamente ocupado com a proclamação, sem definir de modo indevido se a palavra o impelia ou era a esfera de sua atividade.
- source_word: διαμαρτυρόμενος
  choice: dando testemunho solene
  rationale: Conserva tanto a ideia de testemunho quanto a força enfática ou solene do verbo διαμαρτύρομαι.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: Neste contexto, refere-se diretamente aos judeus como grupo etnorreligioso.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: de que Jesus é o Messias
  rationale: Reproduz a construção predicativa, na qual Χριστός funciona claramente como título messiânico.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: Messias
  alternative: Cristo
  rationale: 'O artigo e a construção predicativa, no contexto da proclamação aos judeus, destacam Χριστός como título: Jesus é o Messias prometido.'
- issue: Força de συνείχετο em relação à palavra
  choice: se dedicava inteiramente à palavra
  alternative: era impelido pela palavra
  rationale: A formulação escolhida mantém a intensidade da atividade de Paulo sem atribuir de forma exclusiva à palavra uma compulsão interna; a alternativa possível é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quando, porém” mantém a transição narrativa; “palavra” preserva o vocabulário lucano, enquanto a nota esclarece que se trata da mensagem proclamada. A ambiguidade de συνείχετο foi mantida por uma formulação não excessivamente interpretativa e registrada em nota.
