source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: pt
  text: Então todos agarraram Sóstenes[a], o dirigente da sinagoga, e o espancavam diante do tribunal. Mas Gálio não se importava com nada disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “todos os gregos”, em vez de simplesmente “todos”. O texto mais antigo é mais curto e não especifica a identidade do grupo.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: agarraram
  rationale: Expressa de modo natural e enérgico o ato hostil de apoderar-se de alguém, sem sugerir necessariamente prisão formal.
- source_word: πάντες
  choice: todos
  rationale: Preserva a força totalizante do grego e deixa sem especificação a identidade do grupo.
- source_word: ἀρχισυνάγωγον
  choice: dirigente da sinagoga
  rationale: Designa com clareza o principal responsável ou oficial da sinagoga em linguagem moderna.
- source_word: ἔτυπτον
  choice: começaram a espancá-lo
  rationale: O imperfeito apresenta a agressão em andamento; esta formulação portuguesa comunica o início seguido de ação continuada sem soar artificial.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: diante do tribunal
  rationale: βῆμα designa aqui a plataforma ou sede judicial do procônsul; 'tribunal' torna claro o contexto jurídico.
- source_word: οὐδὲν τούτων τῷ Γαλλίωνι ἔμελεν
  choice: Gálio não se importava com nada disso
  rationale: Traduz naturalmente a construção idiomática que indica ausência de preocupação ou interesse, mantendo o valor durativo do imperfeito.
- source_word: δέ
  choice: Então
  rationale: Marca a progressão narrativa de forma fluente em português.
- source_word: καί
  choice: Mas
  rationale: Explicita o contraste contextual entre a violência praticada e a indiferença de Gálio.
theological_decisions:
- issue: Identidade de πάντες ('todos')
  choice: A identidade do grupo permanece indeterminada no texto principal.
  alternative: Identificar o grupo como 'todos os gregos' ou como judeus.
  rationale: O texto crítico traz apenas πάντες, sem substantivo que identifique o grupo. A tradução não deve resolver uma ambiguidade que o texto-fonte preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e preserva a indeterminação textual do sujeito de 'todos'.
