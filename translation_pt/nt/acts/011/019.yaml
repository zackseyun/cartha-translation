revisions:
- from: Assim, os que haviam sido dispersos por causa da aflição[a] que surgiu por causa de Estêvão foram até a Fenícia, Chipre e Antioquia. Eles não anunciavam a palavra[b] a ninguém, a não ser somente aos judeus.[c]
  to: Assim, os que haviam sido dispersos por causa da aflição[a] relacionada a Estêvão foram até a Fenícia, Chipre e Antioquia, sem anunciar a palavra[b] a ninguém, mas somente a judeus.[c]
  rationale: A revisão evita atribuir uma causalidade indevida a Estêvão, elimina a repetição de «por causa» e restabelece em português a relação do particípio grego com a ação principal. Mantêm-se as escolhas lexicais centrais e as três âncoras de nota.
