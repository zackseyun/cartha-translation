    issue: A relação com Estêvão é expressa como causalidade direta.
    rationale: Em «a aflição que surgiu por causa de Estêvão», a formulação pode sugerir que Estêvão foi a causa da aflição. O ἐπὶ com dativo indica uma aflição ocorrida em conexão com o caso de Estêvão; «relacionada a Estêvão» preserva essa associação sem especificá-la além do necessário.
  - severity: medium
    issue: O particípio λαλοῦντες foi convertido em oração independente no imperfeito.
    rationale: «Eles não anunciavam» pode ser lido como descrição de hábito ou duração, enquanto o particípio descreve a atividade concomitante daqueles que viajaram. «Sem anunciar» mantém a dependência sintática e o sentido contextual.
