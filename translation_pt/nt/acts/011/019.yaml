  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: pt
  text: Assim, os que haviam sido dispersos por causa da aflição[a] relacionada a Estêvão foram até a Fenícia, Chipre e Antioquia, sem anunciar a palavra[b] a ninguém, mas somente a judeus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perseguição”. O termo grego pode indicar aflição, angústia, dificuldade ou, neste contexto, perseguição.
    reason: lexical_alternative
  - marker: b
    text: “A palavra” refere-se aqui à mensagem proclamada a respeito de Jesus; alternativamente, “a mensagem”.
    reason: lexical_alternative
  - marker: c
    text: 'O grego é enfático: “a não ser somente aos judeus” ou “a não ser aos judeus apenas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν διασπαρέντες
  choice: Assim, os que haviam sido dispersos
  rationale: “Assim” retoma o fio narrativo, e o mais-que-perfeito composto expressa a ação anterior do particípio aoristo passivo sem perder a ideia de dispersão sofrida.
- source_word: ἀπὸ τῆς θλίψεως
  choice: por causa da aflição
  rationale: A preposição indica aqui a circunstância causal da dispersão. “Aflição” mantém a amplitude de θλῖψις, embora o contexto envolva perseguição.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: que surgiu por causa de Estêvão
  rationale: Expressa de modo natural que a hostilidade surgiu em conexão causal com o caso de Estêvão, sem sugerir que Estêvão a provocou intencionalmente.
- source_word: διῆλθον ἕως
  choice: foram até
  rationale: Forma portuguesa natural para o deslocamento cuja extensão alcançou os lugares mencionados.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: a Fenícia, Chipre e Antioquia
  rationale: Emprega as formas geográficas correntes em português; o artigo acompanha naturalmente “Fenícia”, mas não é necessário diante de “Chipre” e “Antioquia” nesta construção.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Eles não anunciavam a palavra a ninguém
  rationale: “Anunciavam” comunica no contexto a fala pública da mensagem, enquanto “a palavra” preserva a expressão temática de Lucas. A oração independente evita um gerúndio pesado ou ambíguo em português.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: a não ser somente aos judeus
  rationale: Preserva a restrição enfática formada por εἰ μή e μόνον, ainda que a combinação seja deliberadamente marcada.
theological_decisions:
- issue: Natureza da hostilidade ligada a Estêvão
  choice: aflição
  alternative: perseguição
  rationale: O contexto descreve perseguição, mas θλῖψις tem sentido mais amplo de aflição, angústia ou tribulação. A tradução principal não restringe indevidamente o termo.
- issue: Sentido de τὸν λόγον em Atos
  choice: a palavra
  alternative: a mensagem
  rationale: “A palavra” preserva a terminologia recorrente de Lucas e sua densidade temática; a nota esclarece seu referente contextual sem inserir a explicação no texto.
- issue: Exclusividade do público judeu
  choice: a não ser somente aos judeus
  alternative: a não ser aos judeus
  rationale: A presença de μόνον acrescenta ênfase explícita à construção exceptiva. A tradução mantém essa ênfase, embora uma forma sem “somente” soe mais idiomática.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A divisão em duas frases favorece clareza sem alterar as relações sintáticas do grego. Mantiveram-se “aflição” e “a palavra” por transparência lexical, com alternativas explicadas em notas.
