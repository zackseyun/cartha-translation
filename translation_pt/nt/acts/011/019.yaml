  verdict: revise
  source_fidelity: A tradução preserva adequadamente a dispersão passiva, a abrangência de θλῖψις, os destinos geográficos e a limitação inicial do anúncio aos judeus. Contudo, a oração independente no imperfeito («Eles não anunciavam») enfraquece a relação participial contemporânea com «foram» e pode sugerir uma ação habitual. «Por causa de Estêvão» também atribui uma causalidade mais direta do que a formulação grega necessariamente especifica.
  naturalness: O texto é claro e contemporâneo, mas a repetição próxima de «por causa» é pesada. A construção revisada mantém uma única frase e torna explícita, de modo natural, a relação entre a viagem e o anúncio.
  terminology: «Aflição» e «a palavra» são escolhas adequadas e transparentes para θλίψις e τὸν λόγον. «Anunciar» é apropriado no contexto de proclamação. «Somente a judeus» conserva de forma idiomática a ênfase restritiva de μόνον.
  issues:
