  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: pt
  text: E eis que, naquele exato momento, três homens chegaram à casa onde estávamos, enviados de Cesareia para mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função discursiva de chamar a atenção para um acontecimento significativo e mantém a vivacidade narrativa, em registro bíblico ainda compreensível.
- source_word: ἐξαυτῆς
  choice: naquele exato momento
  rationale: Expressa a imediatidade e a estreita ligação temporal com a visão precedente, de maneira natural em português.
- source_word: τρεῖς ἄνδρες
  choice: três homens
  rationale: Tradução direta e contextualmente precisa do numeral com ἀνήρ.
- source_word: ἐπέστησαν
  choice: chegaram
  rationale: Neste contexto, o verbo indica que os homens chegaram e se apresentaram no local; 'chegaram' é claro e natural.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: à casa
  rationale: Com o verbo de chegada, indica o destino alcançado e soa idiomático em português.
- source_word: ἐν ᾗ ἦμεν
  choice: onde estávamos
  rationale: Reproduz diretamente a indicação de localização sem acrescentar a ideia não explícita de hospedagem.
- source_word: ἀπεσταλμένοι
  choice: enviados
  rationale: O particípio perfeito passivo indica que eles haviam sido enviados antes de chegar; a forma reduzida em português preserva essa relação de modo natural.
- source_word: ἀπὸ Καισαρείας
  choice: de Cesareia
  rationale: Indica claramente o lugar de origem.
- source_word: πρός με
  choice: até mim
  rationale: Expressa a direção dos enviados para Pedro como destinatário, evitando a possível leitura de que Cesareia os enviou por intermédio dele.
