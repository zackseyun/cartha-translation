  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: pt
  text: 'Então me lembrei da palavra do Senhor, de como ele disse: “João batizou com água, mas vocês serão batizados no Espírito Santo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o Espírito Santo”. A preposição grega pode ser entendida em sentido locativo (“no”) ou instrumental (“com”).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: me lembrei
  rationale: O aoristo de forma passiva/depoente tem sentido ativo neste contexto. “Me lembrei” é natural e direto em português.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ introduz o desenvolvimento seguinte da narrativa, sem indicar contraste forte.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: da palavra do Senhor
  rationale: ῥῆμα designa uma palavra ou declaração falada; “palavra do Senhor” preserva a formulação bíblica natural e o peso de κύριος.
- source_word: ὡς ἔλεγεν
  choice: de como ele disse
  rationale: No contexto de uma declaração específica recordada e citada, o pretérito simples é mais natural em português e não acrescenta a ideia de repetição habitual.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: João ... mas vocês
  rationale: A construção μὲν...δέ estabelece o contraste entre João e os destinatários; “mas” o expressa naturalmente.
- source_word: ἐβάπτισεν ὕδατι
  choice: batizou com água
  rationale: O dativo ὕδατι pode indicar meio ou instrumento, e “com água” é a expressão portuguesa natural.
- source_word: βαπτισθήσεσθε
  choice: serão batizados
  rationale: Reproduz adequadamente o futuro passivo do verbo βαπτίζω.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: “No Espírito Santo” preserva a leitura locativa possível de ἐν e é uma formulação natural em português; a leitura instrumental é registrada em nota.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o uso estabelecido e a autoridade teológica do título, que neste contexto se refere a Jesus.
- issue: Valor da preposição ἐν em ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  alternative: com o Espírito Santo
  rationale: A preposição grega permite uma compreensão locativa ou instrumental. O texto principal mantém “no”, e a nota conserva a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural “vocês” torna explícito em português o valor plural de ὑμεῖς. A pontuação mantém a nota junto à expressão a que se refere.
