id: ACT.11.28
reference: Acts 11:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: pt
  text: Um deles, chamado Ágabo, levantou-se e indicou, pelo Espírito, que uma grande fome estava para vir sobre todo o mundo habitado[a] — e ela ocorreu no tempo de Cláudio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o mundo”; em Lucas–Atos, “mundo habitado” também pode referir-se mais especificamente ao mundo romano.
    reason: Registra a amplitude semântica de οἰκουμένη sem restringir seu alcance no texto principal.
lexical_decisions:
- source_word: ἀναστὰς
  choice: levantou-se
  rationale: Expressa de modo natural a ação do particípio aoristo de ἀνίστημι no contexto da reunião, sem recorrer a uma formulação literária.
- source_word: ἐσήμανεν
  choice: indicou
  rationale: Preserva o sentido de comunicar, assinalar ou dar a conhecer, sem especificar além do texto a forma exata da manifestação profética.
- source_word: διὰ τοῦ πνεύματος
  choice: pelo Espírito
  rationale: διά com genitivo indica meio ou agência. A inicial maiúscula reflete a referência contextual ao Espírito Santo em Atos.
- source_word: λιμὸν μεγάλην
  choice: uma grande fome
  rationale: Reproduz diretamente o substantivo λιμός e o adjetivo μεγάλην, mantendo a formulação do grego em português claro.
- source_word: μέλλειν ἔσεσθαι
  choice: estava para vir
  rationale: Comunica a futuridade esperada ou iminente da construção μέλλω com infinitivo e combina naturalmente com “fome”.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: sobre todo o mundo habitado
  rationale: Mantém o valor lexical de οἰκουμένη sem restringi-lo no texto principal ao Império Romano nem equipará-lo necessariamente ao planeta inteiro no sentido moderno.
- source_word: ἥτις ἐγένετο
  choice: e ela ocorreu
  rationale: Liga a confirmação histórica à fome anunciada em português fluente, traduzindo ἐγένετο como “ocorreu” e tornando explícito o referente feminino do pronome relativo.
- source_word: ἐπὶ Κλαυδίου
  choice: no tempo de Cláudio
  rationale: Representa a expressão cronológica com ἐπί e genitivo de maneira acessível, sem acrescentar no texto principal a palavra “reinado”.
theological_decisions:
- issue: Referência de τοῦ πνεύματος
  choice: Espírito Santo, indicado por “Espírito” com inicial maiúscula
  alternative: uma atuação espiritual em sentido menos específico
  rationale: Nos contextos proféticos de Atos, “o Espírito” normalmente se refere ao Espírito Santo; a tradução preserva essa identificação contextual.
- issue: Alcance de οἰκουμένη
  choice: todo o mundo habitado
  alternative: todo o mundo; todo o mundo romano
  rationale: O termo pode designar amplamente o mundo habitado e, no contexto de Lucas–Atos, pode ter em vista mais especificamente o mundo sob domínio romano. O texto principal mantém a amplitude lexical, e a nota registra as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada levemente para fluência, preservando a sequência narrativa e a ambiguidade quanto ao alcance geográfico da fome. O marcador da nota foi colocado junto a “mundo habitado”, expressão à qual a nota lexical efetivamente se refere.
