source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: pt
  text: Assim, os discípulos decidiram, cada um conforme suas possibilidades,[a] enviar ajuda aos irmãos[b] que moravam na Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à medida que cada um prosperava” ou “conforme o que cada um podia dar”.'
    reason: lexical_alternative
  - marker: b
    text: “Os irmãos” provavelmente se refere aos demais cristãos da Judeia, incluindo mulheres e homens da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: os discípulos
  rationale: Termo consagrado e preciso em Atos para os discípulos ou seguidores de Jesus.
- source_word: καθὼς εὐπορεῖτό τις
  choice: cada um conforme suas possibilidades
  rationale: Expressa naturalmente a contribuição proporcional aos recursos de cada pessoa, em conjunto com ἕκαστος αὐτῶν.
- source_word: ὥρισαν
  choice: decidiram
  rationale: Comunica uma decisão deliberada em português atual, sem formalidade excessiva.
- source_word: ἕκαστος αὐτῶν
  choice: cada um
  rationale: Preserva a força distributiva; “deles” fica claro pelo contexto e pode ser omitido para maior naturalidade.
- source_word: εἰς διακονίαν
  choice: ajuda
  rationale: Neste contexto, διακονία designa assistência prática destinada aos cristãos da Judeia; “ajuda” traduz o sentido contextual sem especificar indevidamente a forma da contribuição.
- source_word: πέμψαι
  choice: enviar
  rationale: Tradução direta do infinitivo; o objeto “ajuda” é fornecido pelo sentido contextual de εἰς διακονίαν.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: que viviam na Judeia
  rationale: Formulação natural em português para a expressão participial, ligada a “irmãos”.
- source_word: ἀδελφοῖς
  choice: aos irmãos
  rationale: Mantém a forma masculina plural do grego e o vocabulário familiar característico da comunidade cristã primitiva; uma nota esclarece seu provável alcance inclusivo.
theological_decisions:
- issue: Alcance do termo familiar masculino ἀδελφοῖς para a comunidade cristã da Judeia
  choice: os irmãos
  alternative: os irmãos e as irmãs; os irmãos na fé
  rationale: O texto grego emprega o masculino plural, que pode abranger uma comunidade mista. A tradução conserva a forma da fonte, enquanto a nota registra o provável sentido comunitário inclusivo sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Conforme suas possibilidades” evita linguagem financeira técnica e preserva a proporcionalidade do grego. Os marcadores foram posicionados junto às expressões que explicam.
