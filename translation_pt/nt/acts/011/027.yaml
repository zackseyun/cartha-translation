base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: pt
  text: Naqueles dias, profetas desceram de Jerusalém para Antioquia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Naqueles dias
  rationale: A expressão estabelece o quadro temporal. O δέ tem leve força conectiva e não precisa ser representado por uma palavra separada em português.
- source_word: προφῆται
  choice: alguns profetas
  rationale: “Profetas” preserva o termo amplo do grego sem definir de modo indevido a natureza exata do ministério. O artigo indefinido plural implícito em “alguns” torna a construção natural em português, sem afirmar que todos os profetas fizeram a viagem.
- source_word: κατῆλθον
  choice: desceram
  rationale: κατέρχομαι indica movimento descendente e pode ser expresso naturalmente por “desceram”; em português, o verbo não exige escolher entre “vieram” e “foram”.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: de Jerusalém
  rationale: 'ἀπό indica a origem do movimento. Embora o topônimo grego tenha forma plural, o nome convencional em português é singular: “Jerusalém”.'
- source_word: εἰς Ἀντιόχειαν
  choice: para Antioquia
  rationale: εἰς indica movimento em direção ao destino; “para Antioquia” é a formulação idiomática em português.
theological_decisions:
- issue: Natureza dos “profetas” no contexto das igrejas de Jerusalém e Antioquia
  choice: Manter simplesmente “profetas”
  alternative: “mestres proféticos” ou “mensageiros inspirados”
  rationale: O grego não delimita aqui a natureza ou a extensão do ministério desses profetas. A tradução evita identificá-los exclusivamente com profetas canônicos ou reduzi-los a pregadores dotados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Desceram” preserva a imagem geográfica e evita uma escolha desnecessária de perspectiva entre “vieram” e “foram”.
