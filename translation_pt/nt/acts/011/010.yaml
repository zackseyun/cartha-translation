  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: pt
  text: Isso aconteceu três vezes, e tudo foi novamente puxado para o céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Isso
  rationale: O demonstrativo retoma o acontecimento visionário descrito anteriormente sem acrescentar explicitamente “visão”, termo não presente no grego.
- source_word: δὲ
  choice: e
  rationale: Funciona como conectivo narrativo leve; em português, a coordenação com “e” produz uma sequência natural.
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Neste contexto, γίνομαι indica que um acontecimento se deu; “aconteceu” é claro e corrente.
- source_word: ἐπὶ τρίς
  choice: três vezes
  rationale: A expressão idiomática indica repetição em três ocasiões.
- source_word: ἀνεσπάσθη
  choice: foi puxado para
  rationale: O passivo de ἀνασπάω expressa movimento para cima causado por uma força externa; “foi puxado” preserva tanto a voz passiva quanto essa imagem.
- source_word: πάλιν
  choice: novamente
  rationale: Indica repetição ou retorno; “novamente” se integra com naturalidade à frase.
- source_word: ἅπαντα
  choice: tudo
  rationale: O neutro plural é abrangente e não identifica especificamente a toalha nem os animais; “tudo” conserva essa amplitude.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: “Para” expressa adequadamente o movimento em direção ao interior ou âmbito do céu, enquanto “céu” corresponde ao contexto visionário.
theological_decisions:
- issue: Referente de ἅπαντα no relato da visão de Pedro
  choice: “tudo”, sem especificar a toalha ou os animais
  alternative: “a coisa toda”, “tudo aquilo” ou “todos os animais”
  rationale: O grego é abrangente, mas não explicita um referente mais restrito. A tradução preserva essa ambiguidade e evita acrescentar uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção passiva conserva a imagem e a indeterminação do agente presentes no grego.
