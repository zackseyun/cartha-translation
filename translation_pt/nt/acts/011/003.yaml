  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: pt
  text: 'dizendo: “Você entrou onde estavam homens incircuncisos[a] e comeu com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, homens que não tinham o sinal da circuncisão; neste contexto, gentios.
    reason: Esclarece a expressão socioreligiosa do original sem substituir sua formulação marcada no texto principal.
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'dizendo:'
  rationale: O particípio liga a acusação ao contexto anterior, e ὅτι introduz aqui discurso direto; os dois-pontos são naturais em português.
- source_word: Εἰσῆλθες πρὸς
  choice: Você entrou na casa de
  rationale: Com referência a pessoas, a construção expressa entrada no espaço ou convívio delas. “Entrou na casa de” comunica naturalmente a acusação sem reduzir πρός a simples companhia.
- source_word: ἄνδρας ἀκροβυστίαν ἔχοντας
  choice: homens incircuncisos
  rationale: Preserva tanto a referência masculina de ἄνδρας quanto a formulação judaica marcada pela circuncisão, em vez de substituí-la interpretativamente por “gentios”.
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: e comeu com eles
  rationale: Tradução direta e idiomática do verbo composto συνεσθίω com seu referente pronominal, mantendo a ideia de compartilhar a mesa.
theological_decisions:
- issue: Traduzir ἀκροβυστίαν ἔχοντας como “incircuncisos” ou interpretá-lo como “gentios”
  choice: incircuncisos
  alternative: gentios
  rationale: A acusação é formulada explicitamente em termos do sinal da aliança e da fronteira social-religiosa. “Incircuncisos” preserva essa tensão e o tom depreciativo contextual sem explicá-lo dentro do texto.
- issue: Explicitar que Pedro entrou na casa desses homens
  choice: entrou na casa de
  alternative: foi ter com / entrou onde estavam
  rationale: O contexto imediato envolve a entrada de Pedro na residência de Cornélio, e a combinação εἰσέρχομαι πρός com pessoas aponta para a entrada no espaço delas. A formulação portuguesa torna a cena inteligível sem apagar a acusação de associação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O singular “você” representa naturalmente a acusação dirigida a Pedro. A exclamação transmite o caráter incisivo da censura, sem acrescentar conteúdo proposicional.
