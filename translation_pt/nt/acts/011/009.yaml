  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: pt
  text: 'Mas uma voz respondeu do céu pela segunda vez: “Não chame de comum[a] aquilo que Deus purificou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não considere impuro” ou “não declare profano”.'
    reason: Alternativas lexicais para κοινόω no contexto das categorias judaicas de pureza.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: O aoristo de ἀποκρίνομαι significa normalmente “responder”; a forma é natural na sequência narrativa.
- source_word: φωνὴ
  choice: uma voz
  rationale: Mantém o sujeito indefinido do grego sem identificar além do texto quem fala.
- source_word: ἐκ δευτέρου
  choice: pela segunda vez
  rationale: Reproduz de modo idiomático a expressão que indica a repetição da voz.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Neste contexto, οὐρανός designa o céu como procedência da voz, não apenas o firmamento visível.
- source_word: Ἃ
  choice: aquilo que
  rationale: O relativo neutro plural grego expressa uma categoria geral; “aquilo que” é idiomático em português e concorda conceitualmente com o objeto mencionado na visão.
- source_word: ἐκαθάρισεν
  choice: purificou
  rationale: καθαρίζω significa limpar ou purificar. “Purificou” preserva claramente o contexto de pureza ritual e o aspecto concluído do aoristo.
- source_word: σὺ μὴ κοίνου
  choice: não chame de comum
  rationale: A formulação conserva o contraste entre o que Deus purificou e a classificação humana como κοινός, sem substituir no texto principal essa categoria por “impuro”.
theological_decisions:
- issue: Nuance da linguagem de pureza em κοινόω
  choice: não chame de comum
  alternative: não considere impuro; não declare profano
  rationale: κοινόω pode indicar tornar ou declarar algo comum/profano e, no contexto judaico de pureza, tratá-lo como impuro. “Comum” preserva a tensão lexical com o ato divino de purificar; as equivalências interpretativas aparecem na nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto para leitores brasileiros quanto para um público lusófono amplo. A ordem da frase preserva a progressão narrativa e a fala direta; a nota esclarece um termo de pureza que pode soar menos transparente no uso corrente.
