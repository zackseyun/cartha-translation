id: ACT.11.5
reference: Acts 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: pt
  text: 'Eu estava na cidade de Jope, orando, e, em transe, vi uma visão: algo[a] descia, semelhante a um grande lençol que era baixado do céu pelas quatro pontas[b], e chegou até mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certo objeto” ou “certo recipiente”; o termo grego pode designar de modo amplo um objeto, utensílio ou recipiente.
    reason: lexical_alternative
  - marker: b
    text: Ou “baixado do céu pelas quatro extremidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην
  choice: Eu estava
  rationale: O pronome explícito confere leve ênfase ao sujeito; “Eu estava” a preserva de modo natural em português, sem intensificá-la com “eu mesmo”.
- source_word: ἐν πόλει Ἰόππῃ
  choice: na cidade de Jope
  rationale: Mantém πόλει (“cidade”) e emprega a forma portuguesa tradicional e reconhecível do topônimo.
- source_word: προσευχόμενος
  choice: orando
  rationale: O particípio presente indica uma ação em curso, simultânea a “estava”; o gerúndio a expressa com naturalidade.
- source_word: ἐν ἐκστάσει
  choice: em transe
  rationale: Descreve um estado visionário alterado. “Transe” é claro no português atual e evita que “êxtase” seja entendido apenas como emoção intensa.
- source_word: ὅραμα
  choice: uma visão
  rationale: É a equivalência corrente e adequada ao contexto revelatório de Atos.
- source_word: καταβαῖνον
  choice: descia
  rationale: Expressa de maneira natural o movimento descendente em andamento visto por Pedro.
- source_word: σκεῦός τι
  choice: algo
  rationale: σκεῦος tem sentido amplo, podendo designar objeto, utensílio ou recipiente, e τι o torna indefinido. “Algo” evita especificar além do texto antes da comparação com o lençol.
- source_word: ὡς ὀθόνην μεγάλην
  choice: semelhante a um grande lençol
  rationale: Reproduz a comparação sem acrescentar um material, como linho, que o grego não explicita.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: pelas quatro pontas
  rationale: Neste quadro, ἀρχαί designa extremidades. “Quatro pontas” comunica naturalmente a imagem de um grande tecido suspenso.
- source_word: καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: que era baixado do céu
  rationale: O particípio passivo feminino concorda gramaticalmente com ὀθόνην (“lençol”) e apresenta o tecido sendo baixado desde o céu.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: chegou até mim
  rationale: Preserva a ideia de movimento até o lugar onde Pedro estava e soa idiomático em português.
theological_decisions:
- issue: Terminologia visionária sem exagerar o caráter místico da experiência
  choice: em transe, vi uma visão
  alternative: em êxtase, vi uma visão
  rationale: 'A formulação mantém distintos os dois elementos gregos: o estado indicado por ἐκστάσει e a visão indicada por ὅραμα. “Transe” evita reduzir a experiência a entusiasmo emocional ou associá-la a uma tradição mística posterior.'
- issue: Agente não expresso de “era baixado”
  choice: manter a voz passiva sem identificar o agente
  alternative: Deus o baixava do céu
  rationale: O grego emprega uma forma passiva e não nomeia quem baixa o lençol. A tradução preserva essa abertura sem inserir explicitamente um agente divino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com escolhas naturais no Brasil e inteligíveis internacionalmente. “Jope” conserva o topônimo bíblico corrente; “orando”, “em transe” e “chegou até mim” evitam tanto arcaísmo quanto coloquialismo excessivo.
