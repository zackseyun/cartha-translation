source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: pt
  text: Ele lhe dirá palavras pelas quais você e toda a sua casa serão salvos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas quais» ou «por meio das quais»; a expressão grega apresenta essas palavras como o meio pelo qual vem a salvação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ele
  rationale: O pronome relativo retoma o homem mencionado no contexto anterior; em português, iniciar uma nova frase com «Ele» é natural e claro.
- source_word: λαλήσει
  choice: dirá
  rationale: Com «palavras» como objeto, «dirá palavras» comunica naturalmente o ato de transmitir a mensagem; «falará palavras» seria menos idiomático em português.
- source_word: ῥήματα
  choice: palavras
  rationale: Preserva o substantivo plural concreto do grego, sem substituí-lo interpretativamente por «mensagem».
- source_word: πρὸς σὲ
  choice: lhe
  rationale: Com verbo de comunicação, πρός + acusativo indica o destinatário. «Lhe dirá» é corrente, conciso e amplamente compreensível.
- source_word: ἐν οἷς
  choice: pelas quais
  rationale: 'Expressa o provável valor instrumental de ἐν: as palavras são o meio pelo qual vem a salvação, preservando em nota as alternativas formais.'
- source_word: σωθήσῃ
  choice: serão salvos
  rationale: Embora σωθήσῃ esteja no singular e concorde primeiro com «você», a coordenação com toda a casa requer o plural em português. «Ser salvos» preserva o sentido soteriológico no contexto de Atos.
- source_word: σὺ
  choice: você
  rationale: Torna explícito o destinatário enfatizado pelo pronome grego e mantém linguagem moderna de ampla legibilidade brasileira.
- source_word: πᾶς ὁ οἶκός σου
  choice: toda a sua casa
  rationale: «Casa» pode designar naturalmente a família ou unidade doméstica, preservando a imagem lexical de οἶκος; o contexto impede que se entenda apenas o edifício.
theological_decisions:
- issue: Sentido da salvação no contexto da casa de Cornélio
  choice: «serão salvos»
  alternative: «serão libertos»
  rationale: O contexto trata da mensagem proclamada e da salvação. A formulação mantém a força soteriológica de σῴζω sem acrescentar uma explicação doutrinária sobre o mecanismo da salvação.
- issue: Alcance de «toda a sua casa»
  choice: Manter a afirmação coletiva sem qualificá-la
  alternative: Explicitar uma condição ou afirmar salvação automática de cada membro
  rationale: O versículo inclui toda a unidade doméstica na promessa, mas não detalha aqui a resposta de cada integrante. A tradução não resolve essa tensão em favor de uma doutrina denominacional.
- issue: Valor de ἐν οἷς
  choice: 'Valor instrumental: «pelas quais»'
  alternative: 'Valor mais formal ou locativo: «nas quais»; também «por meio das quais»'
  rationale: No contexto, as palavras comunicadas funcionam como meio pelo qual a salvação chega. A nota preserva as alternativas possíveis sem obscurecer o texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Você» evita solenidade artificial; «toda a sua casa» conserva a expressão bíblica para a unidade doméstica. O marcador [a] aparece no texto principal e corresponde à nota.
