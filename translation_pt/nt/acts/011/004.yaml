  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: pt
  text: 'Mas Pedro começou a lhes explicar, em ordem[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sequência”, “passo a passo” ou “de modo ordenado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: começou
  rationale: O particípio aoristo médio tem valor adverbial ligado ao verbo principal. Em português corrente, “começou” transmite naturalmente o início da explicação sem produzir uma construção artificial.
- source_word: δὲ
  choice: Mas
  rationale: Marca aqui uma transição com leve contraste entre a acusação anterior e a resposta de Pedro.
- source_word: Πέτρος
  choice: Pedro
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐξετίθετο
  choice: explicar
  rationale: Neste contexto, o verbo significa expor ou explicar um assunto. A locução “começou a lhes explicar” combina o particípio precedente com o aspecto discursivo do imperfeito de modo natural.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo plural refere-se aos interlocutores de Pedro; “lhes” é uma correspondência portuguesa direta e clara.
- source_word: καθεξῆς
  choice: em ordem
  rationale: O advérbio indica sequência ou exposição ordenada. “Em ordem” preserva essa ideia sem interpretar o termo especificamente como “desde o princípio”.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio presente introduz o conteúdo do discurso que vem a seguir; “dizendo” conserva essa ligação sintática.
