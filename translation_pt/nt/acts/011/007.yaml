  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: pt
  text: 'E também ouvi uma voz que me dizia: “Levante-se, Pedro; mate e coma.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: E também ouvi
  rationale: Reproduz a continuação narrativa de δέ e o valor aditivo de καί em português natural.
- source_word: φωνῆς λεγούσης μοι
  choice: uma voz que me dizia
  rationale: Mantém a construção em que a voz dirige as palavras a Pedro; o imperfeito idiomático em português introduz naturalmente a fala ouvida.
- source_word: Ἀναστάς
  choice: Levante-se
  rationale: O particípio aoristo tem força imperatival coordenada com as ordens seguintes; esta é uma formulação moderna e clara.
- source_word: θῦσον
  choice: mate
  rationale: No contexto de animais apresentados para alimentação, expressa diretamente o ato de matar sem introduzir necessariamente uma conotação ritual de sacrifício.
- source_word: φάγε
  choice: coma
  rationale: Imperativo direto e natural correspondente ao aoristo imperativo grego.
theological_decisions:
- issue: Possível sentido sacrificial de θῦσον
  choice: mate
  alternative: sacrifique
  rationale: Embora o verbo possa ser usado para abater ou sacrificar, o contexto imediato enfatiza matar os animais e comê-los; “mate” preserva esse sentido sem sugerir um rito não explicitado.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento coerentes no imperativo (“Levante-se”, “mate”, “coma”). A pontuação preserva a fala direta e a sequência concisa das ordens.
