source:
  edition: SBLGNT
  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: pt
  text: Mas, quando Pedro subiu a Jerusalém, os da circuncisão[a] discutiam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pertencentes à circuncisão”, “o grupo da circuncisão” ou “os crentes circuncidados”. O grego identifica essas pessoas por sua associação com a circuncisão.
    reason: alternativa lexical e preservação da amplitude referencial
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: δέ introduz o desenvolvimento narrativo com leve contraste; “Mas, quando” preserva essa conexão de modo natural em português.
- source_word: ἀνέβη
  choice: subiu
  rationale: ἀναβαίνω significa aqui “subir” e conserva o modo convencional de falar da ida a Jerusalém, ligado à sua localização e importância.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: διεκρίνοντο
  choice: discutiam
  rationale: O imperfeito indica uma contestação em curso; no contexto, o verbo descreve oposição verbal dirigida a Pedro, não mera dúvida interior.
- source_word: πρὸς αὐτόν
  choice: com ele
  rationale: Com um verbo de disputa, πρός com acusativo indica a pessoa com quem se discute; “com ele” evita intensificar desnecessariamente a hostilidade.
- source_word: οἱ ἐκ περιτομῆς
  choice: os da circuncisão
  rationale: A expressão identifica pessoas por sua ligação com a circuncisão. A formulação concisa preserva a ambiguidade entre um grupo caracterizado por essa preocupação e os crentes circuncidados em sentido mais amplo, sem impor a ideia de um partido formal.
theological_decisions:
- issue: Identificação de οἱ ἐκ περιτομῆς
  choice: “os da circuncisão”, expressão que identifica um grupo por sua associação com a circuncisão
  alternative: “o grupo da circuncisão” ou “os crentes circuncidados”
  rationale: O contexto aponta para crentes de Jerusalém que contestaram Pedro por questões relacionadas à circuncisão, mas o grego não define explicitamente um partido formal nem determina com certeza que todos os crentes judeus estejam incluídos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Os da circuncisão” mantém a concisão e a tensão do original; a nota esclarece as principais possibilidades sem transformar o grupo em um partido formal.
