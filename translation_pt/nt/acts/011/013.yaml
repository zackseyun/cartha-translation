  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: pt
  text: 'E ele nos contou como tinha visto o anjo em pé em sua casa, dizendo: “Envie alguém a Jope e mande chamar[a] Simão, chamado Pedro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mande buscar Simão, chamado Pedro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: contou
  rationale: Expressa de modo natural o ato de relatar aos presentes o que havia acontecido, sem tornar o registro excessivamente formal.
- source_word: δὲ
  choice: E
  rationale: Conectivo leve que dá continuidade à narrativa, sem introduzir contraste forte.
- source_word: πῶς εἶδεν
  choice: como tinha visto
  rationale: Preserva o valor de πῶς e usa o mais-que-perfeito composto para indicar que a visão ocorreu antes do relato.
- source_word: τὸν ἄγγελον
  choice: o anjo
  rationale: Mantém o artigo grego e a referência ao anjo específico já identificado pelo contexto narrativo.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: em sua casa
  rationale: Tradução direta e idiomática do local da visão.
- source_word: σταθέντα
  choice: em pé
  rationale: Reproduz naturalmente em português a postura indicada pelo particípio de ἵστημι.
- source_word: εἰπόντα
  choice: dizendo
  rationale: Conserva o fluxo participial do grego e liga a fala ao anjo visto na casa.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Mande alguém a Jope
  rationale: O objeto de ἀπόστειλον está implícito; “alguém” torna a ordem inteligível em português sem especificar “homens”, termo não expresso neste versículo.
- source_word: μετάπεμψαι
  choice: peça que venha
  rationale: Comunica de forma corrente o sentido de mandar buscar ou chamar alguém para que venha.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: Simão, chamado Pedro
  rationale: Identifica Simão pelo nome pelo qual era conhecido, preservando a função atributiva do particípio.
