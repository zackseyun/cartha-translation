  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: pt
  text: E, depois de encontrá-lo, levou-o para Antioquia. Durante um ano inteiro, eles se reuniram com a igreja[a] e ensinaram uma multidão considerável; e foi em Antioquia que os discípulos foram chamados cristãos pela primeira vez.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reuniram-se na igreja”. A expressão pode enfatizar a reunião com a comunidade cristã, e não um encontro dentro de um edifício.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente que os discípulos “foram chamados cristãos pela primeira vez”. O nome pode ter surgido como uma designação pública em Antioquia.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: depois de encontrá-lo
  rationale: O particípio aoristo expressa uma ação anterior à de levar; a oração temporal comunica naturalmente essa sequência em português.
- source_word: ἤγαγεν
  choice: levou-o
  rationale: No contexto, ἄγω indica que Barnabé levou Saulo a Antioquia; esta é a formulação portuguesa mais natural.
- source_word: ἐγένετο δὲ αὐτοῖς καὶ ἐνιαυτὸν ὅλον
  choice: Durante um ano inteiro, eles
  rationale: A construção idiomática introduz a circunstância seguinte e o dativo se refere a Barnabé e Saulo; a tradução evita literalismo pouco natural.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: se reuniram com a igreja
  rationale: A formulação preserva o sentido de reunião em associação com a comunidade cristã e evita sugerir necessariamente um edifício.
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: Em Atos, o termo normalmente designa a comunidade cristã; “igreja” é o equivalente corrente, sem exigir referência a um prédio.
- source_word: διδάξαι
  choice: ensinaram
  rationale: O infinitivo coordenado é expresso como verbo finito para produzir uma frase natural em português.
- source_word: ὄχλον ἱκανόν
  choice: uma multidão considerável
  rationale: ἱκανός indica quantidade substancial; a escolha preserva essa ideia sem a intensificar indevidamente.
- source_word: χρηματίσαι
  choice: foram chamados
  rationale: Neste contexto, o verbo significa receber uma designação ou nome; a construção passiva preserva o sentido do grego.
- source_word: πρώτως
  choice: pela primeira vez
  rationale: Expressa claramente a primeira ocorrência da designação.
- source_word: Χριστιανούς
  choice: cristãos
  rationale: Trata-se de uma designação coletiva já lexicalizada. “Cristãos” é o equivalente convencional e semanticamente adequado em português.
theological_decisions:
- issue: Tradução de Χριστιανούς diante da possibilidade de relacionar o termo diretamente a “Messias”
  choice: cristãos
  alternative: messianistas
  rationale: O termo funciona aqui como nome estabelecido do grupo, não simplesmente como o título Χριστός. “Messianistas” destacaria a etimologia de modo artificial e poderia introduzir uma conotação sectária ausente do uso normal.
- issue: Sentido de ἐν τῇ ἐκκλησίᾳ
  choice: com a igreja
  alternative: na igreja
  rationale: A escolha entende ἐκκλησία principalmente como a comunidade reunida e evita resolver a expressão como referência a um local ou edifício; a alternativa mais formal permanece indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém a sequência narrativa e dá destaque à primeira ocorrência do nome “cristãos”, sem tornar a frase excessivamente literal.
