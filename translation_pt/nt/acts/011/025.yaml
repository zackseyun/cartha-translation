  text: Então ele saiu para Tarso, à procura de Saulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para procurar Saulo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: foi
  rationale: O aoristo de ἐξέρχομαι pode significar literalmente «saiu», mas, com εἰς Ταρσόν indicando destino, «foi a Tarso» comunica de modo natural em português o deslocamento sem sugerir necessariamente que Tarso fosse o ponto imediato da saída.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ é um conectivo leve que faz a narrativa avançar. «Então» mantém a sequência narrativa sem introduzir um contraste indevido.
- source_word: εἰς Ταρσόν
  choice: a Tarso
  rationale: Com verbo de movimento, εἰς marca o destino. «A Tarso» é uma formulação corrente e clara em português.
- source_word: ἀναζητῆσαι
  choice: procurar
  rationale: O infinitivo aoristo expressa propósito. «Procurar» é natural e preserva a ideia de tentar localizar Saulo; «ir em busca de» pode realçar mais explicitamente o esforço sugerido pelo verbo composto.
- source_word: Σαῦλον
  choice: Saulo
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio Σαῦλος.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa acompanha o ritmo narrativo do grego; a nota preserva a possível intensidade de ἀναζητέω.
