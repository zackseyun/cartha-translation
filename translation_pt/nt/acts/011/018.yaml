id: ACT.11.18
reference: Acts 11:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: pt
  text: 'Ao ouvirem essas coisas, eles se aquietaram e glorificaram a Deus, dizendo: “Então, Deus também concedeu aos gentios[a] o arrependimento que conduz à vida[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”. Aqui, “gentios” se refere aos não judeus e corresponde melhor ao contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o arrependimento para a vida” ou “o arrependimento que resulta em vida”. A expressão grega εἰς ζωήν indica direção para a vida ou resultado em vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Ao ouvirem essas coisas
  rationale: O particípio aoristo estabelece a circunstância anterior às ações principais. A construção com “ao” é natural em português e conserva a relação temporal; δέ funciona aqui como conectivo leve e não exige tradução separada.
- source_word: ἡσύχασαν
  choice: eles se aquietaram
  rationale: O verbo indica que cessaram a objeção e ficaram em silêncio. “Se aquietaram” comunica a mudança de atitude sem limitar o sentido ao mero silêncio físico.
- source_word: ἐδόξασαν τὸν θεόν
  choice: glorificaram a Deus
  rationale: Mantém o sentido teológico e a linguagem característica de Lucas-Atos, além de corresponder diretamente ao uso de δοξάζω.
- source_word: λέγοντες
  choice: dizendo
  rationale: Reproduz de modo claro e natural o particípio presente que introduz o conteúdo da fala.
- source_word: Ἄρα
  choice: Então
  rationale: Marca a conclusão inferida do relato de Pedro, em forma idiomática e concisa.
- source_word: καὶ τοῖς ἔθνεσιν
  choice: também aos gentios
  rationale: καί destaca a inclusão, enquanto ἔθνη, neste contexto, designa os não judeus; “gentios” evita a leitura geopolítica de “nações”.
- source_word: τὴν μετάνοιαν
  choice: o arrependimento
  rationale: “Arrependimento” é o equivalente corrente e contextual de μετάνοια em português bíblico moderno, abrangendo mudança interior e reorientação, sem reduzi-la a mera alteração intelectual.
- source_word: εἰς ζωήν
  choice: que conduz à vida
  rationale: A formulação preserva a orientação para a vida e deixa aberta a nuance de finalidade ou resultado presente em εἰς.
- source_word: ἔδωκεν
  choice: concedeu
  rationale: O aoristo é vertido pelo pretérito perfeito, e “concedeu” conserva a apresentação do arrependimento como algo dado por Deus.
theological_decisions:
- issue: O arrependimento como concessão divina
  choice: Deus “concedeu” aos gentios o arrependimento
  alternative: Deus “deu” aos gentios o arrependimento
  rationale: O texto apresenta explicitamente Deus como sujeito de ἔδωκεν e o arrependimento como aquilo que ele concede. A tradução preserva essa afirmação sem definir além do versículo a relação entre ação divina e resposta humana.
- issue: Relação de εἰς ζωήν com μετάνοιαν
  choice: “o arrependimento que conduz à vida”
  alternative: “o arrependimento para a vida” ou “o arrependimento que resulta em vida”
  rationale: “Que conduz à vida” expressa a direção ou o resultado sem decidir de maneira excessivamente rígida entre finalidade e consequência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Gentios” preserva o vocabulário bíblico ainda compreensível; “se aquietaram” expressa tanto o fim da contestação quanto o silêncio resultante. Os marcadores foram posicionados junto às expressões a que as notas efetivamente se referem.
