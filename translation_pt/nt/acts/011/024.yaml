id: ACT.11.24
reference: Acts 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: pt
  text: Pois ele era um homem bom, cheio do Espírito Santo e de fé.[a] E uma multidão considerável foi acrescentada ao Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de fidelidade”. A palavra grega pístis também pode significar “fidelidade” ou “confiança”; aqui, o texto principal traz a tradução habitual “fé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da avaliação anterior de Barnabé e preserva de modo natural a força explicativa do grego.
- source_word: ἀνὴρ ἀγαθὸς
  choice: um homem bom
  rationale: Mantém a referência masculina específica a Barnabé e traduz diretamente sua qualidade moral sem acrescentar uma nuance mais restrita.
- source_word: πλήρης πνεύματος ἁγίου
  choice: cheio do Espírito Santo
  rationale: Expressão corrente e digna em português, entendendo πνεῦμα ἅγιον como referência ao Espírito Santo.
- source_word: πίστεως
  choice: fé
  rationale: É o equivalente padrão de πίστις e se ajusta ao retrato de Barnabé, embora 'fidelidade' também seja lexicalmente possível.
- source_word: προσετέθη
  choice: se uniu
  rationale: O verbo passivo tem sentido de ser agregado ou juntar-se; esta formulação evita o português pouco natural 'foi adicionada' sem mudar o objeto expresso, 'ao Senhor'.
- source_word: ὄχλος ἱκανὸς
  choice: uma multidão considerável
  rationale: ὄχλος indica uma multidão, e ἱκανός assinala aqui quantidade substancial.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Preserva o objeto explícito do texto grego, sem substituí-lo interpretativamente pela igreja ou comunidade.
theological_decisions:
- issue: Sentido de πνεύματος ἁγίου
  choice: Referência ao Espírito Santo
  alternative: um espírito ou uma disposição santa
  rationale: Em Lucas–Atos, a expressão normalmente designa o Espírito Santo, e o contexto descreve Barnabé como discípulo capacitado pelo Espírito.
- issue: Nuance de πίστεως
  choice: fé
  alternative: fidelidade
  rationale: O contexto permite compreender tanto confiança quanto qualidade fiel. A tradução principal mantém o equivalente mais comum, e a nota registra a alternativa genuína.
- issue: Relação expressa por προσετέθη ... τῷ κυρίῳ
  choice: a multidão se uniu ao Senhor
  alternative: a multidão foi acrescentada à igreja ou comunidade
  rationale: O grego nomeia explicitamente o Senhor como o referente da união; a incorporação à comunidade pode estar implícita, mas não deve substituir o que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Se uniu ao Senhor' conserva o sentido do passivo grego em uma construção mais natural do que o calque 'foi adicionada ao Senhor'. O marcador da nota aparece imediatamente após 'fé', termo ao qual se refere.
