id: ACT.11.17
reference: Acts 11:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: pt
  text: Portanto, se Deus deu a eles o mesmo dom que deu também a nós, que cremos[b] no Senhor Jesus, o Messias[a], quem era eu para poder impedir Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Cristo”: grego Χριστόν. Aqui traduzido como “o Messias” porque o sentido de título permanece ativo.'
    reason: alternative_reading
  - marker: b
    text: Ou “a nós, quando cremos no Senhor Jesus, o Messias”. O particípio grego permite essa tradução temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: o mesmo dom
  rationale: ἴσην indica igualdade ou equivalência; “o mesmo dom” expressa de modo natural que Deus concedeu aos gentios aquilo que também concedeu aos crentes judeus.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: que cremos no Senhor Jesus, o Messias
  rationale: O particípio aoristo dativo plural concorda com ἡμῖν e pode descrever “nós” como os que creram. A formulação preserva essa ligação gramatical sem impor uma sequência temporal mais precisa; “crer em” traduz naturalmente πιστεύω ἐπί com acusativo.
- source_word: κύριον
  choice: Senhor
  rationale: Aqui κύριον funciona como título cristológico de Jesus, adequadamente traduzido por “Senhor”.
- source_word: Χριστόν
  choice: o Messias
  rationale: Χριστός mantém força titular no contexto; “o Messias” comunica o sentido do título em português corrente, enquanto “Cristo” permanece como alternativa tradicional em nota.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: quem era eu para poder
  rationale: A expressão retórica enfatiza a incapacidade e a falta de autoridade de Pedro para se opor à ação divina; esta construção é natural em português e conserva δυνατός.
- source_word: κωλῦσαι
  choice: impedir
  rationale: κωλύω significa impedir, obstruir ou proibir. “Impedir Deus” conserva o objeto direto e a força marcante da afirmação.
- source_word: τὸν θεόν
  choice: Deus
  rationale: É o objeto direto de κωλῦσαι; a tradução preserva a ideia deliberadamente forte de que resistir ao acolhimento dos gentios equivaleria a tentar impedir o próprio Deus.
theological_decisions:
- issue: Tradução de Χριστόν no título κύριον Ἰησοῦν Χριστόν
  choice: o Messias
  alternative: Cristo
  rationale: O termo tem aqui sentido titular ativo. “O Messias” explicita esse valor sem introduzir uma interpretação denominacional; “Cristo” é registrado como alternativa tradicional.
- issue: Relação de πιστεύσασιν com ἡμῖν
  choice: 'sentido descritivo: “a nós, que cremos”'
  alternative: 'sentido temporal: “a nós, quando cremos”'
  rationale: O particípio concorda diretamente com ἡμῖν. A tradução descritiva reflete essa relação mais de perto e evita definir além do necessário a relação temporal entre fé e concessão do dom.
- issue: Força de κωλῦσαι τὸν θεόν
  choice: “impedir Deus”
  alternative: “colocar-me no caminho de Deus”
  rationale: 'A construção direta preserva a expressão ousada do grego: opor-se ao que ocorreu com os gentios seria opor-se à própria ação de Deus.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Portanto” expressa οὖν; a repetição elíptica de “deu” torna a comparação clara sem alterar seu conteúdo. As notas mantêm visíveis as alternativas relevantes em Χριστόν e no particípio πιστεύσασιν.
