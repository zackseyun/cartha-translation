  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: pt
  text: E, quando comecei a falar[a], o Espírito Santo desceu sobre eles, assim como também havia descido sobre nós no princípio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto eu começava a falar”. A construção grega pode indicar “quando” ou “enquanto”.
    reason: lexical_alternative
  - marker: b
    text: “No princípio” provavelmente se refere ao início do derramamento do Espírito sobre os discípulos, isto é, ao Pentecostes.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: E, quando comecei a falar
  rationale: A construção ἐν + infinitivo articular indica tempo simultâneo e pode ser traduzida por “quando” ou “enquanto”. “Quando comecei a falar” é natural em português e mantém a ideia de que o acontecimento se deu logo no início da fala de Pedro.
- source_word: ἐπέπεσεν
  choice: desceu sobre
  rationale: O verbo ἐπιπίπτω com ἐπί descreve vividamente a vinda do Espírito sobre alguém. “Desceu sobre” preserva a imagem e soa mais natural em português atual do que a tradução estritamente literal “caiu sobre”.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada, precisa e plenamente compreensível no português contemporâneo.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: assim como havia descido sobre nós
  rationale: “Assim como” expressa a comparação estreita de ὥσπερ, e o verbo subentendido é retomado para produzir uma frase natural. O mais-que-perfeito composto esclarece que a experiência do grupo de Pedro ocorreu antes.
- source_word: ἐν ἀρχῇ
  choice: no princípio
  rationale: Expressa o marco temporal inicial sem identificar explicitamente o acontecimento no corpo do texto. Neste contexto, aponta provavelmente para a primeira efusão do Espírito sobre os discípulos.
theological_decisions:
- issue: Referente de ἐν ἀρχῇ (“no princípio”)
  choice: Manter no texto uma referência temporal ampla, provavelmente alusiva ao Pentecostes
  alternative: Traduzir interpretativamente como “no Pentecostes” ou, de modo mais geral, “no começo”
  rationale: Pedro compara a experiência da casa de Cornélio com a experiência anterior de “nós”. O contexto de Atos favorece uma alusão ao Pentecostes, mas o grego diz apenas “no princípio”; por isso, a tradução preserva essa amplitude e registra a provável referência em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada à sintaxe portuguesa; o paralelismo da ação do Espírito sobre “eles” e sobre “nós” foi preservado.
