source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: pt
  text: Olhei atentamente para dentro dela e, enquanto a examinava, vi os quadrúpedes da terra, os animais selvagens, os animais rastejantes[a] e as aves do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «répteis». O termo grego abrange criaturas que rastejam ou se arrastam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: para dentro dele
  rationale: A expressão retoma o objeto semelhante a um grande lençol; com ἀτενίζω, indica a direção do olhar para o seu interior. O masculino concorda naturalmente com «objeto», implícito pelo contexto.
- source_word: ἀτενίσας
  choice: Olhei atentamente
  rationale: Preserva a ideia de olhar fixo e concentrado em português corrente.
- source_word: κατενόουν
  choice: o examinei
  rationale: Expressa observação atenta e reflexiva sem repetir de modo pesado «olhei atentamente». Embora o imperfeito grego tenha aspecto durativo, a coordenação verbal em português comunica naturalmente a progressão da cena.
- source_word: εἶδον
  choice: vi
  rationale: Tradução direta do aoristo, distinguindo a percepção resultante do exame anterior.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: os quadrúpedes da terra
  rationale: Mantém a categoria zoológica ampla e a expressão «da terra». «Quadrúpedes» é preciso e compreensível, além de evitar a redundância de «animais de quatro patas» seguida de «animais selvagens».
- source_word: τὰ θηρία
  choice: os animais selvagens
  rationale: Distingue esta categoria dos quadrúpedes em geral e usa linguagem natural no português moderno.
- source_word: τὰ ἑρπετά
  choice: os animais rastejantes
  rationale: Preserva a amplitude do termo grego e seus ecos das classificações bíblicas da criação e das leis de pureza, sem restringi-lo aos répteis na acepção zoológica moderna.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: Formulação natural e digna que preserva a classificação concreta das criaturas voadoras.
theological_decisions:
- issue: Amplitude da categoria ἑρπετά nas classificações bíblicas
  choice: animais rastejantes
  alternative: répteis
  rationale: «Répteis» poderia sugerir apenas a classe zoológica moderna; «animais rastejantes» mantém a categoria bíblica mais ampla sem impor uma taxonomia posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno, com leve elevação no catálogo de criaturas. O ponto e vírgula e «então» tornam clara a progressão entre o exame atento e aquilo que Pedro viu.
