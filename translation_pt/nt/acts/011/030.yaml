  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: pt
  text: E foi isso que fizeram, enviando aos presbíteros por meio de Barnabé e Saulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão de Barnabé e Saulo”.
