lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: E foi isso que fizeram
  rationale: A expressão retoma a decisão de enviar ajuda, mencionada no versículo anterior. Esta formulação preserva a referência anafórica e a concisão do grego em português natural.
- source_word: ἀποστείλαντες
  choice: enviando
  rationale: O particípio aoristo indica como eles concretizaram a decisão; o gerúndio expressa com naturalidade essa relação em português.
- source_word: implicit object from context
  choice: a oferta
  rationale: O objeto está implícito no grego, mas é recuperado do contexto anterior. Explicitar 'a oferta' evita a ambiguidade que 'a' ou 'isso' produziria em português e não acrescenta conteúdo estranho ao contexto.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: aos presbíteros
  rationale: '''Presbíteros'' é a designação portuguesa corrente para os líderes reconhecidos da comunidade e mantém a distinção lexical do termo grego.'
- source_word: διὰ χειρὸς
  choice: por meio de
  rationale: 'O idioma grego, literalmente ''pela mão de'', indica agência: Barnabé e Saulo foram os portadores. ''Por meio de'' comunica esse sentido de modo claro e natural.'
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Barnabé e Saulo
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
