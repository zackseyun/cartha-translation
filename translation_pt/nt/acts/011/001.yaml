id: ACT.11.1
reference: Acts 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: pt
  text: Os apóstolos e os irmãos que estavam por toda a Judeia ouviram que também os gentios haviam recebido a palavra de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “irmãos” e pode referir-se de modo mais amplo aos demais fiéis.
    reason: Alternativa lexical que esclarece o possível sentido representativo e inclusivo de ἀδελφοὶ.
lexical_decisions:
- source_word: Ἤκουσαν
  choice: ouviram
  rationale: O aoristo de ἀκούω introduz a notícia recebida; “ouviram” é direto, natural e preserva a formulação do grego.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui δέ funciona como transição narrativa leve. Em português, a continuidade é natural sem acrescentar “então”, “ora” ou “mas”, que poderiam marcar uma relação mais específica do que o contexto exige.
- source_word: οἱ ἀπόστολοι
  choice: os apóstolos
  rationale: Em Atos, o termo designa o grupo apostólico reconhecido; “apóstolos” é a forma consagrada e precisa.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Mantém a forma masculina plural do grego e o modo tradicional de designar os demais membros da comunidade; uma nota esclarece seu possível alcance inclusivo.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: que estavam por toda a Judeia
  rationale: κατά com acusativo tem aqui sentido distributivo. “Por toda a Judeia” comunica que os irmãos se encontravam espalhados pela região.
- source_word: ὅτι καὶ τὰ ἔθνη
  choice: que também os gentios
  rationale: ὅτι introduz o conteúdo ouvido, enquanto καί ressalta a inclusão adicional e surpreendente dos não judeus. Neste contexto, ἔθνη significa “gentios”, não nações políticas.
- source_word: ἐδέξαντο
  choice: haviam recebido
  rationale: δέχομαι descreve a acolhida ou aceitação da mensagem. “Recebido” preserva a expressão bíblica, e o mais-que-perfeito composto deixa clara a anterioridade em relação a “ouviram”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva a expressão cristã primitiva para a mensagem proclamada por Deus, bem como sua ressonância bíblica e teológica.
theological_decisions:
- issue: Alcance de ἀδελφοὶ numa comunidade possivelmente mista
  choice: os irmãos
  alternative: os irmãos e as irmãs; os crentes
  rationale: A tradução principal conserva a forma masculina do texto grego sem decidir que o grupo fosse exclusivamente masculino. A nota registra que o termo pode abranger os fiéis em geral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “por toda a Judeia” preserva o valor distributivo do original, e “haviam recebido” explicita naturalmente em português a anterioridade da recepção da mensagem.
