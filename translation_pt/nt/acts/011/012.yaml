source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: pt
  text: E o Espírito me disse que fosse com eles[a], sem fazer distinção. Estes seis irmãos também vieram comigo, e entramos na casa daquele homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem hesitar” ou “sem duvidar”. O particípio grego pode indicar tanto não fazer distinção como não vacilar.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: o Espírito
  rationale: No contexto de orientação reveladora em Atos, a expressão se refere ao Espírito Santo; a tradução preserva a forma grega sem acrescentar “Santo”.
- source_word: εἶπεν ... μοι
  choice: me disse
  rationale: Tradução natural de λέγω com objeto indireto, introduzindo a instrução dada a Pedro.
- source_word: συνελθεῖν αὐτοῖς
  choice: que fosse com eles
  rationale: O infinitivo denota acompanhar os homens; esta formulação é clara e idiomática em português.
- source_word: μηδὲν διακρίναντα
  choice: sem fazer distinção
  rationale: διακρίνω pode significar distinguir, hesitar ou duvidar. O contexto da transposição da barreira entre judeus e gentios favorece “fazer distinção”, sem eliminar as outras possibilidades.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: estes seis irmãos
  rationale: Preserva o demonstrativo e o referente masculino explícito dos seis acompanhantes.
- source_word: εἰσήλθομεν
  choice: entramos
  rationale: Equivalente direto e natural do aoristo narrativo.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: a casa daquele homem
  rationale: Preserva o substantivo explícito e expressa naturalmente a referência ao homem mencionado no relato.
theological_decisions:
- issue: Sentido de μηδὲν διακρίναντα no relato de Pedro
  choice: sem fazer distinção
  alternative: sem hesitar; sem duvidar
  rationale: O contexto imediato trata da entrada de Pedro na casa de um gentio e de sua defesa perante os crentes judeus, favorecendo a ideia de não estabelecer distinção. Como o particípio grego também pode expressar hesitação ou dúvida, essas leituras são preservadas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe mantém o fluxo narrativo e preserva a ambiguidade lexical relevante por meio da nota.
