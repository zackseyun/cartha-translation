id: ACT.11.21
reference: Acts 11:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: pt
  text: A mão do Senhor estava com eles,[a] e um grande número dos que creram voltou-se para o Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mão do Senhor estava a favor deles”. A expressão bíblica “mão do Senhor” indica seu poder atuante ou seu favor.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser entendido: “um grande número, tendo crido, voltou-se para o Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: a mão do Senhor
  rationale: Preserva a metáfora bíblica para o poder atuante ou o favor do Senhor e mantém sua ressonância intertextual.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título grego sem enfraquecê-lo nem explicitar além do texto se a referência é especificamente a Jesus ou a Deus.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: Μετά com genitivo expressa naturalmente presença e apoio que acompanhavam os anunciadores.
- source_word: πολύς τε ἀριθμός
  choice: um grande número
  rationale: Reproduz de modo natural a expressão quantitativa nominal do grego.
- source_word: ὁ πιστεύσας
  choice: dos que creram
  rationale: O particípio aoristo articular tem sentido coletivo ligado a 'um grande número'; esta formulação é clara e não força uma relação temporal rígida.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: voltou-se para o Senhor
  rationale: Expressa movimento de conversão em direção ao Senhor sem acrescentar explicitamente 'em arrependimento' nem sugerir necessariamente um retorno a uma relação anterior.
theological_decisions:
- issue: Referente de κύριος nas duas ocorrências
  choice: Senhor, sem especificação adicional
  alternative: Jesus explicitamente; ou Deus em sentido mais geral
  rationale: O contexto de Atos pode apontar para Jesus, sobretudo na linguagem de conversão, mas o grego diz apenas 'Senhor'. A tradução conserva essa abertura.
- issue: Relação entre crer e voltar-se para o Senhor
  choice: dos que creram voltou-se
  alternative: tendo crido, voltou-se; creram e se voltaram
  rationale: O particípio aoristo permite uma relação estreita com o verbo principal, mas não exige que a tradução estabeleça uma sequência temporal ou teológica mais precisa do que o original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora tradicional 'mão do Senhor' foi mantida; o reflexivo 'voltou-se' evita que 'voltou' sugira necessariamente retorno a uma condição anterior.
