  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: pt
  text: Mas alguns deles eram homens de Chipre e de Cirene que, ao chegarem a Antioquia, falavam também aos helenistas[a], anunciando as boas-novas a respeito do Senhor Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «gregos» em vez de «helenistas». Se essa for a leitura original, o sentido é que eles falavam a gentios, e não apenas a judeus de língua grega.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: alguns
  rationale: Indica uma parte não especificada do grupo mencionado anteriormente; «alguns» é natural e preciso em português.
- source_word: ἄνδρες
  choice: homens
  rationale: O substantivo grego designa especificamente homens adultos, e não pessoas em sentido genérico.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: de Chipre e de Cirene
  rationale: Os adjetivos pátrios indicam origem; esta formulação é clara e idiomática em português.
- source_word: οἵτινες
  choice: que
  rationale: Introduz uma oração relativa descritiva; a forma simples «que» é suficiente e natural.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: ao chegarem a Antioquia
  rationale: Expressa de modo natural o valor temporal do particípio aoristo.
- source_word: ἐλάλουν
  choice: falavam
  rationale: O pretérito imperfeito preserva o aspecto contínuo ou repetido do verbo grego.
- source_word: καὶ
  choice: também
  rationale: Aqui provavelmente tem valor aditivo, indicando a ampliação do público ao qual se dirigiam.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: aos helenistas
  rationale: Segue a leitura do SBLGNT, que normalmente designa judeus de língua grega, sem substituir silenciosamente essa leitura pela variante «gregos».
- source_word: εὐαγγελιζόμενοι
  choice: anunciando as boas-novas a respeito de
  rationale: Comunica de maneira acessível tanto o ato de proclamar quanto o conteúdo positivo da mensagem.
- source_word: τὸν κύριον Ἰησοῦν
  choice: do Senhor Jesus
  rationale: Preserva «Senhor» como título cristológico e liga naturalmente a expressão ao anúncio das boas-novas.
theological_decisions:
- issue: Identidade de τοὺς Ἑλληνιστάς e variante textual Ἕλληνας
  choice: O texto principal segue «helenistas», conforme o SBLGNT, com a variante «gregos» registrada em nota.
  alternative: «gregos», o que indicaria gentios em vez de judeus de língua grega
  rationale: A diferença textual afeta a identificação dos primeiros destinatários em Antioquia. Seguir o texto-fonte no corpo e conservar a variante em nota preserva a tensão histórica e interpretativa sem resolvê-la indevidamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Helenistas» conserva o termo historicamente relevante, explicado na nota; o pretérito imperfeito mantém a ideia de ação contínua ou repetida.
