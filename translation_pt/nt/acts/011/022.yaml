  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: pt
  text: A notícia a respeito deles chegou aos ouvidos da igreja que estava em Jerusalém[a], e enviaram Barnabé até Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a igreja que estava em Jerusalém ouviu falar deles”; literalmente, “a notícia a respeito deles foi ouvida nos ouvidos da igreja que estava em Jerusalém”.'
    reason: Alternativa lexical e esclarecimento do idioma grego.
lexical_decisions:
- source_word: ἠκούσθη
  choice: chegou
  rationale: Com a expressão εἰς τὰ ὦτα, o passivo grego forma um idioma que indica que uma informação chegou ao conhecimento de alguém. “Chegou aos ouvidos” conserva a imagem e soa natural em português.
- source_word: ὁ λόγος
  choice: a notícia
  rationale: Neste contexto, λόγος se refere à informação sobre as pessoas e os acontecimentos narrados em Antioquia, não a um discurso formal nem especificamente à mensagem proclamada.
- source_word: εἰς τὰ ὦτα
  choice: aos ouvidos
  rationale: A expressão mantém a imagem do idioma grego e é corrente em português para algo que chega ao conhecimento de alguém.
- source_word: ἐκκλησίας
  choice: da igreja
  rationale: Em Atos, o termo designa com frequência a comunidade cristã. “Igreja” é a forma mais reconhecível e adequada ao contexto.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: que estava em Jerusalém
  rationale: A oração explicita naturalmente em português o particípio que identifica a igreja mencionada, sem acrescentar informação.
- source_word: περὶ αὐτῶν
  choice: a respeito deles
  rationale: O pronome masculino plural remete mais naturalmente às pessoas mencionadas no contexto anterior, embora a formulação não elimine por completo a relação com os acontecimentos que as envolviam.
- source_word: ἐξαπέστειλαν
  choice: enviaram
  rationale: O verbo composto significa enviar ou despachar. “Enviaram” é natural na narrativa e a ausência de sujeito expresso preserva a forma plural do grego sem especificar líderes não mencionados.
- source_word: Βαρναβᾶν
  choice: Barnabé
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἕως Ἀντιοχείας
  choice: até Antioquia
  rationale: ἕως com nome de lugar pode indicar extensão ou destino. “Até Antioquia” mantém essa nuance melhor que o simples “a Antioquia” e é idiomático em português.
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: Aqui δέ funciona como conector narrativo leve. A progressão entre as frases já sinaliza essa relação em português; inserir “agora” criaria um valor temporal não expresso pelo grego.
theological_decisions:
- issue: Sujeito de “enviaram”
  choice: Manter o sujeito plural implícito, entendido coletivamente como as pessoas da igreja em Jerusalém
  alternative: Explicitar que os apóstolos, os presbíteros ou outros líderes enviaram Barnabé
  rationale: O antecedente contextual é a igreja em Jerusalém, mas o texto não identifica um grupo dirigente específico. O plural sem sujeito expresso preserva essa indefinição e evita importar uma estrutura eclesiástica.
- issue: Referente de περὶ αὐτῶν (“a respeito deles”)
  choice: Preservar a referência pessoal masculina plural
  alternative: Traduzir como “a respeito dessas coisas” ou “sobre o que havia acontecido”
  rationale: A forma pronominal grega é masculina plural e aponta naturalmente para as pessoas antes mencionadas. A tradução não a converte em referência exclusivamente impessoal aos acontecimentos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Chegou aos ouvidos” conserva a imagem original sem produzir uma construção artificial. O sujeito de “enviaram” permanece implícito, como é natural em português, e “até Antioquia” retém a nuance espacial de ἕως.
