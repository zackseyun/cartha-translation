id: ACT.11.23
reference: Acts 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: pt
  text: Quando ele chegou e viu a graça de Deus[a], alegrou-se e continuou a exortar a todos a permanecerem firmes no Senhor, com firme propósito de coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a graça que vem de Deus». A expressão pode se referir às evidências visíveis da ação graciosa de Deus entre eles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «com propósito de coração, continuarem com o Senhor»; ou «permanecerem fiéis ao Senhor».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: chegou
  rationale: O particípio aoristo indica a chegada de Barnabé ao local; «chegou» é natural e fiel ao sentido do acontecimento.
- source_word: ἰδὼν
  choice: viu
  rationale: Mantém o sentido comum de ὁράω, sem explicitar além do texto que ele percebeu evidências da atuação divina.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: a graça de Deus
  rationale: Preserva o peso teológico de χάρις e deixa em aberto como essa graça se tornou visível entre os fiéis de Antioquia.
- source_word: ἐχάρη
  choice: alegrou-se
  rationale: Equivalente português natural para a forma que expressa ter ficado alegre ou se regozijado.
- source_word: παρεκάλει
  choice: continuou exortando
  rationale: O imperfeito sugere ação continuada ou repetida; «exortando» conserva o caráter de incentivo enfático de παρακαλέω.
- source_word: πάντας
  choice: todos
  rationale: Refere-se a todos os fiéis mencionados no contexto, sem necessidade de explicitação adicional.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: com determinação de coração
  rationale: πρόθεσις comunica propósito ou resolução, e καρδία designa a interioridade, incluindo vontade e intenção; a formulação preserva a construção e permanece compreensível.
- source_word: προσμένειν
  choice: a permanecerem firmes
  rationale: προσμένω com o dativo pode indicar continuar ligado a alguém ou persistir junto dele. «Permanecer firmes» comunica continuidade resoluta sem reduzir a expressão a uma categoria doutrinária posterior.
- source_word: τῷ κυρίῳ
  choice: no Senhor
  rationale: Com «permanecer», a regência idiomática portuguesa favorece «no Senhor»; mantém-se o título κύριος sem explicitar o referente além do grego.
theological_decisions:
- issue: Sentido de «a graça de Deus» no contexto
  choice: Manter a expressão «a graça de Deus», sugerindo sem explicitar sua manifestação observável entre os fiéis
  alternative: Parafrasear como «o que Deus havia feito»
  rationale: O contexto aponta para a ação graciosa de Deus tornada perceptível, mas a tradução literal preserva a amplitude e a tensão teológica da expressão.
- issue: Força de προσμένειν τῷ κυρίῳ
  choice: «permanecerem firmes no Senhor», como continuidade resoluta de vínculo e fidelidade
  alternative: «continuarem com o Senhor» ou «permanecerem fiéis ao Senhor»
  rationale: A escolha comunica perseverança e ligação contínua sem impor uma formulação sistemática mais estreita; a nota registra alternativas lexicalmente possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Continuou exortando» preserva o aspecto durativo do imperfeito; «determinação de coração» mantém a linguagem bíblica sem se tornar arcaica.
