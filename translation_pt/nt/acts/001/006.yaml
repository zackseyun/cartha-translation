  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: pt
  text: 'Assim, quando estavam reunidos, perguntaram-lhe: “Senhor, é neste tempo que restauras o reino a Israel[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Israel”. O dativo grego pode indicar benefício (“para Israel”) ou, mais diretamente, o destinatário da restauração (“a Israel”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Assim, quando estavam reunidos
  rationale: O particípio συνελθόντες estabelece a circunstância temporal, enquanto μὲν οὖν faz a ligação com o discurso anterior. A formulação é natural em português e preserva o avanço narrativo sem traduzir mecanicamente cada partícula.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: perguntaram-lhe
  rationale: O imperfeito ἠρώτων é apresentado como ação narrativa, e λέγοντες introduz o conteúdo da pergunta. Em português, “perguntaram-lhe” seguido de dois-pontos transmite naturalmente ambas as funções, sem o redundante “perguntaram-lhe, dizendo”.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a forma normal de tratamento e o peso titular de κύριος, sem reduzi-lo ao sentido mais restrito de “Mestre”.
- source_word: εἰ ἐν τῷ χρόνῳ τούτῳ
  choice: é neste tempo que
  rationale: εἰ introduz aqui uma pergunta direta de resposta sim ou não. “Neste tempo” conserva a referência a uma ocasião ou período, em vez de restringi-la necessariamente a um instante.
- source_word: ἀποκαθιστάνεις
  choice: restauras
  rationale: O presente do indicativo preserva de perto a forma grega e o sentido de devolver algo a uma condição anterior, sem explicitar indevidamente se a ação é iminente, progressiva ou futura.
- source_word: τὴν βασιλείαν
  choice: o reino
  rationale: Embora βασιλεία também possa significar “reinado” ou “governo”, “reino” preserva aqui a expectativa concreta associada a Israel sem definir se ela é política ou espiritual.
- source_word: τῷ Ἰσραήλ
  choice: a Israel
  rationale: A construção reproduz de modo direto o dativo grego como destinatário da restauração. A possibilidade de entendê-lo como dativo de benefício é preservada em nota.
theological_decisions:
- issue: Natureza da expectativa dos discípulos sobre o reino de Israel
  choice: Apresentar diretamente a pergunta sobre restaurar “o reino a Israel”.
  alternative: “restaurar o reino para Israel” ou “restaurar o reino de Israel”
  rationale: O versículo relata a expectativa dos discípulos, sem ainda indicar em que medida Jesus a confirma, corrige ou redefine. A tradução mantém essa tensão e não qualifica o reino como meramente político nem como exclusivamente espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “perguntaram-lhe” mantém um tom bíblico-literário natural sem arcaísmo excessivo. O marcador [a] foi colocado junto de “Israel”, expressão à qual a nota se refere.
