id: ACT.1.21
reference: Acts 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: pt
  text: Portanto, é necessário que um dos homens que nos acompanharam[a] durante todo o tempo em que o Senhor Jesus entrou e saiu entre nós[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos homens que estiveram conosco”; mais literalmente, “dos homens que se reuniram conosco”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “entrou e saiu entre nós” é uma maneira idiomática de descrever a vida e a atividade públicas de Jesus em companhia dos discípulos.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: é necessário
  rationale: Preserva a força impessoal de necessidade e mantém aberta a conclusão sintática que prossegue no versículo seguinte.
- source_word: οὖν
  choice: Portanto
  rationale: Sinaliza naturalmente a conclusão que Pedro tira do contexto anterior.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: um dos homens que nos acompanharam
  rationale: ἀνδρῶν designa especificamente homens, e o particípio de συνέρχομαι, neste contexto prolongado, comunica associação contínua com o grupo. A expressão “um dos” explicita em português a relação partitiva completada pela continuação da frase no versículo 22.
- source_word: ἐν παντὶ χρόνῳ
  choice: durante todo o tempo
  rationale: Refere-se a todo o período da convivência e atividade pública de Jesus com os discípulos.
- source_word: ᾧ
  choice: em que
  rationale: Reproduz com naturalidade o valor temporal do pronome relativo.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: entrava e saía
  rationale: O imperfeito idiomático em português expressa atividade habitual ao longo do período, preservando ao mesmo tempo a imagem verbal do grego.
- source_word: ἐφ’ ἡμᾶς
  choice: entre nós
  rationale: Expressa a atividade de Jesus no meio e em companhia do grupo.
- source_word: ὁ κύριος Ἰησοῦς
  choice: o Senhor Jesus
  rationale: Mantém o título cristológico κύριος em sua forma portuguesa consagrada e natural.
theological_decisions:
- issue: Sentido cristológico de κύριος
  choice: o Senhor Jesus
  alternative: o Mestre Jesus
  rationale: “Senhor” conserva tanto o valor honorífico quanto o peso teológico habitual do título em Atos, sem reduzi-lo apenas à função de mestre.
- issue: Referência masculina de ἀνδρῶν
  choice: homens
  alternative: pessoas
  rationale: O substantivo grego ἀνήρ é especificamente masculino neste contexto; neutralizá-lo apagaria uma informação explícita do texto.
- issue: Necessidade expressa por δεῖ
  choice: é necessário
  alternative: deve ser
  rationale: A formulação impessoal preserva a necessidade afirmada no texto sem definir aqui, além do que a construção permite, se ela é providencial, escriturística ou meramente prática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula final preserva o fato de que a frase continua no versículo 22. O aspecto habitual de “entrava e saía” comunica melhor, em português, a extensão temporal da expressão grega do que o pretérito perfeito isolado.
