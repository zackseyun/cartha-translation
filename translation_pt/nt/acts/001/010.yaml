  source_fidelity: A tradução preserva bem o olhar atento, «céu», «eis que», «dois homens» e a indeterminação da veste. Contudo, «durante a subida dele» torna mais específico o movimento expresso por πορευομένου αὐτοῦ; o particípio significa simplesmente que ele ia/partia. Além disso, «se puseram ao lado» sugere a ação de se colocar, ao passo que παρειστήκεισαν descreve-os como já presentes ao lado deles.
  naturalness: O texto é claro e de registro apropriado. «Enquanto ele partia» é moderno, idiomático e evita especificar uma «subida». «Estavam ao lado deles» transmite naturalmente a presença dos dois homens.
  terminology: «Céu», «dois homens» e «vestidos de branco» são escolhas adequadas. A nota sobre «céu» deve explicitar de modo direto a alternativa lexical «céu visível»/«firmamento», sem apresentar uma paráfrase excessivamente vaga.
