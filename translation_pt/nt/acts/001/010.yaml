  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: pt
  text: E, enquanto olhavam fixamente para o céu[a], enquanto ele partia, eis que dois homens estavam ao lado deles, vestidos de branco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o céu visível” ou “o firmamento”. A palavra grega pode referir-se tanto ao céu quanto ao espaço visível acima.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em vestes brancas”; o termo grego se refere de modo amplo a roupas ou vestimentas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: olhavam fixamente
  rationale: Expressa um olhar contínuo e atento, mais forte que um simples olhar, em português natural.
- source_word: οὐρανόν
  choice: céu
  rationale: Em português, “céu” preserva naturalmente tanto a dimensão visível quanto a possível referência à morada divina, mantendo a ambiguidade legítima do grego.
- source_word: πορευομένου αὐτοῦ
  choice: durante a subida dele
  rationale: O genitivo absoluto indica ação simultânea. No contexto imediato da ascensão, “subida” comunica o movimento em curso sem explicitar ainda o destino.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém a função de chamar solenemente a atenção para o acontecimento seguinte, sem acrescentar a ideia não expressa de súbito.
- source_word: ἄνδρες δύο
  choice: dois homens
  rationale: Traduz diretamente ἀνήρ e não antecipa a identificação contextual dessas figuras como anjos.
- source_word: παρειστήκεισαν
  choice: se puseram ao lado deles
  rationale: Representa a presença dos homens junto aos discípulos e soa natural na narrativa; não introduz explicitamente a noção de aparecimento sobrenatural.
- source_word: ἐσθήσεσι λευκαῖς
  choice: vestidos de branco
  rationale: É uma formulação portuguesa clara e corrente que mantém genérica a espécie de vestimenta.
theological_decisions:
- issue: Sentido de οὐρανός no contexto da ascensão
  choice: céu
  alternative: firmamento
  rationale: “Céu” é lexicalmente adequado e, em português, conserva melhor a sobreposição entre o espaço acima e a esfera celestial, sem impor uma cosmologia mais específica.
- issue: Identidade dos dois homens
  choice: dois homens
  alternative: dois anjos
  rationale: O versículo os chama explicitamente de homens. A tradução deixa que sua possível identidade angélica seja inferida do contexto, sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva o destaque narrativo do original; “vestidos de branco” evita especificar túnicas ou mantos.
