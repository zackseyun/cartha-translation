    rationale: O grego diz que ele estava indo, sem lexicalizar «subida». Embora o contexto mais amplo seja a ascensão, a formulação deve manter a generalidade verbal do original.
  - severity: low
    issue: «se puseram ao lado deles» é mais ingressivo do que παρειστήκεισαν.
    rationale: A forma verbal grega apresenta os homens como estando presentes ao lado dos discípulos; «estavam ao lado» reproduz isso sem sugerir o ato de se posicionarem.
  - severity: low
    issue: A nota a não enuncia com precisão a alternativa para οὐρανός.
    rationale: Convém indicar explicitamente que a palavra também pode designar o céu visível, ou firmamento.
  revised_text: E, enquanto olhavam fixamente para o céu[a], enquanto ele partia, eis que dois homens estavam ao lado deles, vestidos de branco[b].
