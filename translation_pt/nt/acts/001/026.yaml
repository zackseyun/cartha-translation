source:
  edition: SBLGNT
  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: pt
  text: E lançaram sortes para os dois, e a sorte caiu sobre Matias, que foi contado com os onze apóstolos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: lançaram sortes para os dois
  rationale: A expressão grega significa literalmente que deram sortes a eles. Em português, “lançar sortes” comunica naturalmente o procedimento de seleção; “para os dois” explicita o referente plural no contexto imediato sem alterar o sentido.
- source_word: κλήρους / ὁ κλῆρος
  choice: sortes / a sorte
  rationale: Neste contexto, κλῆρος designa o objeto ou mecanismo usado para decidir entre candidatos, e não uma porção ou herança.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: a sorte caiu sobre Matias
  rationale: Mantém a imagem e a construção idiomática do grego em forma natural e tradicionalmente compreensível em português.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Emprega a forma portuguesa consagrada do nome próprio.
- source_word: συγκατεψηφίσθη
  choice: foi contado com
  rationale: O verbo indica que Matias passou a ser contado ou incluído juntamente com um grupo. A formulação permanece próxima do grego sem afirmar além do relato.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: com os onze apóstolos
  rationale: Traduz diretamente μετά com genitivo e conserva a perspectiva narrativa, segundo a qual Matias foi contado com os onze já existentes.
theological_decisions:
- issue: Se συγκατεψηφίσθη deve ser traduzido de modo a implicar uma nomeação divina ou eclesiológica mais forte
  choice: foi contado com os onze apóstolos
  alternative: foi acrescentado aos onze apóstolos
  rationale: “Foi contado com” relata a inclusão de Matias no grupo após o resultado da sorte, sem acrescentar uma afirmação sobre a natureza ou o agente último de sua nomeação que o verbo, isoladamente, não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A coordenação do grego foi preservada sem produzir uma frase artificial; a última oração foi ligada por pronome relativo para maior fluidez.
