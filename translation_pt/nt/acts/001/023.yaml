base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: pt
  text: 'E apresentaram dois: José, chamado Barsabás[a], que também era chamado Justo, e Matias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “designaram dois” ou “colocaram dois diante do grupo”. O verbo grego pode indicar que pessoas foram postas diante de uma assembleia e, neste contexto, provavelmente se refere à apresentação delas como candidatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: apresentaram
  rationale: No contexto da escolha de um substituto, o verbo indica colocar pessoas diante do grupo, provavelmente como candidatos. “Apresentaram” transmite esse sentido processual sem afirmar que já foram nomeadas formalmente.
- source_word: δύο
  choice: dois
  rationale: Numeral que se refere diretamente aos dois homens apresentados.
- source_word: καλούμενον
  choice: chamado
  rationale: O particípio introduz outro nome pelo qual José era identificado; “chamado” é natural e preserva a formulação do grego.
- source_word: Βαρσαββᾶν
  choice: Barsabás
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: ἐπεκλήθη
  choice: também era chamado
  rationale: A forma passiva introduz mais um nome de José. “Também” explicita naturalmente a relação entre as duas designações, já implícita no contexto.
- source_word: Ἰοῦστος
  choice: Justo
  rationale: Forma portuguesa tradicional do nome latino Justus.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: Mantém tanto a continuação narrativa inicial quanto a coordenação dos dois candidatos.
