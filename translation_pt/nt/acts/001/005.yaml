id: ACT.1.5
reference: Acts 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: pt
  text: Pois João batizou com água, mas vocês serão batizados no Espírito Santo[a] dentro de poucos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o Espírito Santo”. A preposição grega pode ser entendida como “em” ou “com”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ligada à declaração anterior de Jesus; “pois” expressa essa conexão de modo natural em português.
- source_word: ἐβάπτισεν
  choice: batizou
  rationale: Preserva o termo religioso estabelecido e não define de maneira indevida o modo do batismo.
- source_word: ὕδατι
  choice: com água
  rationale: O dativo pode indicar meio ou instrumento; “com água” é idiomático em português e mantém o contraste com o Espírito Santo.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: Representa de forma transparente a preposição ἐν e preserva a possibilidade de sentido espacial ou relacional, sem excluir o sentido instrumental registrado na nota.
- source_word: βαπτισθήσεσθε
  choice: vocês serão batizados
  rationale: Reproduz diretamente o futuro passivo, mantém a ligação verbal com o batismo de João e deixa implícito o agente, como no grego.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: dentro de poucos dias
  rationale: Expressa em português corrente o sentido temporal de que o acontecimento não demoraria muitos dias a partir daquele momento.
theological_decisions:
- issue: Sentido de ἐν na expressão ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  alternative: com o Espírito Santo
  rationale: A preposição grega pode indicar esfera ou meio. O texto principal conserva mais visivelmente a formulação com “em”, enquanto a nota registra a leitura instrumental, sem resolver uma tensão teológica legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” como plural corrente e evita linguagem denominacional. A formulação temporal é idiomática, sem alterar o horizonte imediato do original.
