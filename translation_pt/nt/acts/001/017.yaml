  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: pt
  text: Pois ele estava incluído entre nós e recebeu uma parte deste ministério.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeu a porção que lhe coube neste ministério” ou “obteve a sorte deste ministério”. A palavra grega κλῆρος pode significar “sorte” ou “parte/porção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: No contexto, introduz a explicação dada por Pedro. “Pois” preserva de modo conciso o valor causal ou explicativo.
- source_word: κατηριθμημένος ἦν
  choice: estava contado
  rationale: A construção perifrástica indica que Judas tinha sido incluído e permanecia contado no grupo. A formulação conserva a nuance passiva sem soar excessivamente técnica.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Expressa inclusão no grupo apostólico, não mera proximidade ou associação externa.
- source_word: ἔλαχεν
  choice: recebeu
  rationale: O verbo pode indicar obter ou receber por atribuição ou sorteio. “Recebeu” é natural, enquanto a nuance de atribuição é mantida por “parte” e registrada na nota.
- source_word: τὸν κλῆρον
  choice: uma parte
  rationale: κλῆρος pode designar “sorte” e, por extensão, uma parte ou porção atribuída. “Uma parte” comunica participação real no encargo sem sugerir necessariamente que aqui se narra um sorteio.
- source_word: τῆς διακονίας ταύτης
  choice: neste ministério
  rationale: διακονία refere-se aqui ao serviço ou ministério apostólico. Com “uma parte”, a construção “neste ministério” é clara e idiomática em português.
theological_decisions:
- issue: Natureza da relação de Judas com o ofício apostólico
  choice: O versículo afirma que Judas estava efetivamente incluído entre os apóstolos e participava deste ministério.
  alternative: Entender a expressão de maneira mais fraca, como simples associação externa ao grupo.
  rationale: O grego afirma tanto sua inclusão — “estava contado entre nós” — quanto sua participação — “recebeu uma parte neste ministério”. A tradução mantém essa tensão histórica sem inferir aprovação divina de sua conduta nem resolver questões doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Estava contado entre nós” preserva a inclusão efetiva no grupo; “uma parte neste ministério” soa natural e mantém a amplitude semântica de κλῆρος mediante nota.
