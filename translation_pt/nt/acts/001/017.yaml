  source_fidelity: A tradução preserva corretamente a relação causal de ὅτι, a inclusão de Judas no grupo e sua participação na διακονία. Contudo, «estava contado» é uma formulação pouco idiomática em português moderno para o estado expresso por κατηριθμημένος ἦν; «estava incluído» comunica com mais clareza a inclusão efetiva sem acrescentar implicações doutrinárias.
  naturalness: «Pois ele estava incluído entre nós» é mais natural e claro no português internacional contemporâneo. «Uma parte deste ministério» também se liga mais diretamente ao genitivo τῆς διακονίας ταύτης do que «uma parte neste ministério», mantendo a ideia de porção ou participação.
  terminology: «Ministério» é adequado para διακονία neste contexto apostólico. A nota conserva de modo apropriado a alternativa semântica de κλῆρος, incluindo o sentido de «sorte» e o de «parte/porção».
