    rationale: Embora compreensível e próxima da forma tradicional, a expressão não é a maneira mais corrente de indicar que alguém fazia parte de um grupo. «Estava incluído entre nós» preserva a voz passiva e a inclusão real expressa pelo grego.
  - severity: low
    issue: Regência menos direta em «recebeu uma parte neste ministério».
    rationale: «Uma parte deste ministério» reproduz mais diretamente a relação de κλῆρον com τῆς διακονίας ταύτης e evita sugerir apenas uma atividade realizada dentro do ministério.
  revised_text: Pois ele estava incluído entre nós e recebeu uma parte deste ministério.[a]
