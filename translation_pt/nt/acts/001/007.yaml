id: ACT.1.7
reference: Acts 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Não cabe a vocês saber os tempos ou as épocas[a] que o Pai estabeleceu por sua própria autoridade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “tempos ou momentos determinados” ou “períodos ou ocasiões”. O grego emprega dois termos relacionados: χρόνοι, que pode indicar períodos de tempo, e καιροί, que pode indicar ocasiões oportunas ou determinadas.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em sua própria autoridade”; isto é, no âmbito de sua própria prerrogativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição levemente contrastiva entre a pergunta dos discípulos e a resposta corretiva de Jesus.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Não cabe a vocês saber
  rationale: Expressa com naturalidade que esse conhecimento não pertence à esfera ou prerrogativa dos discípulos, sem acrescentar uma proibição absoluta.
- source_word: χρόνους ἢ καιροὺς
  choice: os tempos ou as épocas
  rationale: Mantém dois termos temporais relacionados, sem impor uma distinção técnica rígida que o contexto não explicita.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: Reproduz o substantivo com artigo e preserva o título usado por Jesus, sem acrescentar o possessivo “meu”.
- source_word: ἔθετο
  choice: estabeleceu
  rationale: Comunica o sentido de fixar ou determinar, preservando a ação deliberada do Pai.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: por sua própria autoridade
  rationale: É uma formulação idiomática em português para a ideia de que tais tempos foram estabelecidos no âmbito da prerrogativa própria do Pai.
theological_decisions:
- issue: Distinção entre χρόνοι e καιροί
  choice: tempos ou épocas
  alternative: tempos ou momentos determinados
  rationale: A tradução conserva a duplicidade lexical e a tensão entre períodos de tempo e ocasiões oportunas ou determinadas, sem construir um esquema escatológico técnico.
- issue: A autoridade própria do Pai
  choice: por sua própria autoridade
  alternative: em sua própria autoridade
  rationale: Preserva a prerrogativa soberana atribuída ao Pai e apresenta o sentido de modo natural, sem importar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para ampla legibilidade brasileira. A expressão “não cabe a vocês” transmite naturalmente o valor idiomático do grego, e as notas preservam as alternativas lexicais relevantes.
