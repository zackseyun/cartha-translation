id: ACT.1.14
reference: Acts 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: pt
  text: Todos eles perseveravam unânimes[a] na oração, junto com as mulheres[b], com Maria, mãe de Jesus, e com os irmãos dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um só propósito” ou “em plena união”; o grego ressalta a unidade de propósito, não apenas o fato de estarem reunidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “com mulheres”. O grego não traz artigo, embora a expressão provavelmente se refira a um grupo conhecido de mulheres ligadas aos discípulos.
    reason: lexical_alternative
  - marker: c
    text: “Irmãos” traduz o grego adelphoi. Alguns entendem o termo aqui em sentido mais amplo, como parentes próximos; o próprio texto não especifica a relação com mais precisão.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Todos eles
  rationale: Preserva tanto a referência demonstrativa a pessoas já mencionadas quanto a abrangência de πάντες, em português natural.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: perseveravam
  rationale: O imperfeito perifrástico expressa ação contínua e persistente; o imperfeito português transmite essa duração, enquanto “perseveravam” retém a ideia de constância.
- source_word: ὁμοθυμαδόν
  choice: unânimes
  rationale: Comunica a união de propósito e disposição do grupo, sem reduzir o termo à mera presença física no mesmo lugar.
- source_word: τῇ προσευχῇ
  choice: na oração
  rationale: Com προσκαρτερέω, o dativo indica a atividade à qual o grupo se dedicava persistentemente. O singular coletivo é preservado de modo idiomático.
- source_word: σὺν γυναιξίν
  choice: junto com as mulheres
  rationale: Embora γυναιξίν não tenha artigo, o contexto favorece um grupo conhecido de mulheres ligadas aos discípulos; “junto com” representa σύν.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: com Maria, mãe de Jesus
  rationale: Usa a forma portuguesa consagrada do nome e conserva de maneira direta a identificação em aposição.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: e com os irmãos dele
  rationale: Mantém o masculino plural de ἀδελφοί e deixa o antecedente humano claro em português, sem definir além do texto a natureza exata do parentesco.
theological_decisions:
- issue: Relação familiar indicada por ἀδελφοί
  choice: os irmãos dele
  alternative: os parentes dele; os irmãos e as irmãs dele
  rationale: ἀδελφοί significa normalmente “irmãos” e está no masculino plural. A tradução conserva essa forma sem decidir se eram irmãos biológicos, meio-irmãos, irmãos por afinidade ou parentes próximos, questão interpretada de modos diferentes nas tradições cristãs.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Perseveravam” evita uma perífrase pesada, mas mantém a ação contínua; “unânimes” preserva a ênfase lucana na unidade. A repetição de “com” torna transparentes os grupos presentes sem produzir uma construção artificial.
