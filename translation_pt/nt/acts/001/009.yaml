  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: pt
  text: Depois de dizer essas coisas, enquanto eles olhavam, ele foi elevado[a], e uma nuvem[b] o tirou da vista deles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi levado para o alto”.'
    reason: lexical_alternative
  - marker: b
    text: A nuvem pode evocar passagens bíblicas em que ela assinala a presença de Deus, embora o versículo não diga isso explicitamente.
    reason: cross_reference
  - marker: c
    text: 'Ou: “uma nuvem o recebeu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Depois de
  rationale: Em ligação com o particípio εἰπών, introduz naturalmente a sequência temporal em português sem acrescentar conteúdo ao relato.
- source_word: ταῦτα εἰπὼν
  choice: de dizer essas coisas
  rationale: Expressa com clareza a anterioridade do particípio aoristo e mantém o plural do demonstrativo, que retoma as palavras anteriores de Jesus.
- source_word: βλεπόντων αὐτῶν
  choice: enquanto eles olhavam
  rationale: Reproduz a circunstância simultânea expressa pelo genitivo absoluto e ressalta que os discípulos presenciaram o acontecimento.
- source_word: ἐπήρθη
  choice: foi elevado
  rationale: Mantém a voz passiva e o movimento para cima indicado pelo verbo, sem identificar explicitamente o agente que o elevou.
- source_word: νεφέλη
  choice: uma nuvem
  rationale: O substantivo singular é anartro; a forma indefinida é direta e não torna explícita no texto principal uma interpretação teofânica.
- source_word: ὑπέλαβεν αὐτόν
  choice: o encobriu
  rationale: No contexto visual, comunica em português natural que a nuvem o retirou da percepção dos observadores. A possibilidade lexical mais literal, 'o recebeu' ou 'o tomou', é preservada em nota.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: tirando-o da vista deles
  rationale: Traduz idiomaticamente a ideia de ser removido do alcance dos olhos deles, evitando a expressão pouco natural 'de seus olhos'.
theological_decisions:
- issue: Se ἐπήρθη deve ser vertido por uma fórmula tradicional da ascensão
  choice: foi elevado
  alternative: foi levado para o alto
  rationale: A opção escolhida conserva o passivo e o movimento visível sem inserir no texto uma formulação doutrinária posterior nem especificar o agente implícito.
- issue: Se a nuvem deve ser identificada explicitamente como sinal da presença de Deus
  choice: uma nuvem
  alternative: a nuvem da presença divina
  rationale: Embora a nuvem possa evocar cenas bíblicas da presença divina, o versículo não explica seu simbolismo e usa νεφέλη sem artigo; a possível ressonância fica em nota.
- issue: Como representar a ação de ὑπέλαβεν sem eliminar sua amplitude lexical
  choice: o encobriu
  alternative: o recebeu
  rationale: A tradução principal comunica naturalmente o resultado visual no contexto, enquanto a nota conserva a leitura lexical alternativa e a ambiguidade entre receber, tomar e ocultar da vista.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o fluxo narrativo grego, e as notas preservam tanto as alternativas lexicais quanto a possível ressonância teológica sem inseri-la no texto principal.
