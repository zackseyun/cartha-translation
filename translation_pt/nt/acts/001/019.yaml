source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: pt
  text: E isso se tornou conhecido por todos os habitantes de Jerusalém, de modo que, em sua própria língua[a], aquele campo foi chamado Aceldamaque[b], isto é, Campo de Sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu próprio dialeto”. A palavra grega διάλεκτος pode se referir a uma variedade regional de fala ou, de modo mais geral, a uma língua.
    reason: lexical_alternative
  - marker: b
    text: A forma grega aqui é Ἁκελδαμάχ. Muitas traduções em português usam a forma tradicional “Aceldama”.
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: isso se tornou conhecido
  rationale: A construção exprime que o fato mencionado anteriormente veio a ser conhecido. “Tornou-se conhecido” preserva o caráter impessoal e o sentido resultante sem ampliar para “tornou-se de conhecimento público”.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: de todos os habitantes de Jerusalém
  rationale: A expressão participial designa os que residiam na cidade. “Habitantes de Jerusalém” é natural, clara e mantém o alcance universal de πᾶσι.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado do conhecimento generalizado, sem transformar a relação em mera inferência lógica.
- source_word: κληθῆναι
  choice: passou a ser chamado
  rationale: No contexto de ὥστε, esta formulação comunica naturalmente o resultado pelo qual o campo veio a receber esse nome.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: aquele campo
  rationale: χωρίον pode designar um terreno ou campo. “Campo” mantém a correspondência lexical com a explicação Χωρίον Αἵματος.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: na língua deles
  rationale: διάλεκτος pode indicar língua ou variedade regional de fala. “Língua” é a opção mais natural no contexto, enquanto a alternativa “dialeto” é preservada em nota.
- source_word: Ἁκελδαμάχ
  choice: Aceldamaque
  rationale: A forma transliterada procura refletir a terminação consonantal da forma grega presente no SBLGNT, em grafia legível para falantes de português. A forma tradicional “Aceldama” é registrada em nota.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: A fórmula introduz diretamente a explicação do nome e é bem representada pela expressão portuguesa concisa “isto é”.
- source_word: Χωρίον Αἵματος
  choice: Campo de Sangue
  rationale: É a tradução explicativa fornecida pelo próprio texto grego; as iniciais maiúsculas assinalam sua função como explicação de um topônimo.
