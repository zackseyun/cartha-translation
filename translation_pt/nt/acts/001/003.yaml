  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: pt
  text: Depois de ter sofrido, ele também se apresentou vivo a eles com muitas provas[a], aparecendo-lhes ao longo de quarenta dias[b] e falando sobre o reino de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de muitas provas” ou “com muitas provas convincentes”. O termo grego indica evidências que estabelecem certeza.
    reason: lexical_alternative
  - marker: b
    text: Ou “durante quarenta dias” ou “por quarenta dias”. A expressão indica aparições ocorridas ao longo desse período.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: a eles
  rationale: O pronome relativo dativo retoma os apóstolos do versículo anterior. “A eles” corresponde ao grego sem acrescentar o substantivo “homens”, que não está explícito.
- source_word: παρέστησεν ἑαυτὸν
  choice: se apresentou
  rationale: A construção com objeto reflexivo expressa que Jesus se apresentou ou se mostrou aos apóstolos. “Se apresentou” conserva a forma reflexiva e combina naturalmente com a afirmação de que estava vivo.
- source_word: ζῶντα
  choice: vivo
  rationale: Particípio predicativo que descreve o estado de Jesus depois do sofrimento; “vivo” é claro e natural no contexto da ressurreição.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: Depois de ter sofrido
  rationale: A construção com μετά e infinitivo articular é temporal. A forma portuguesa marca que o sofrimento ocorreu antes das apresentações.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: com muitas provas
  rationale: τεκμήριον designa evidência que oferece confirmação segura. “Com muitas provas” preserva a força evidencial sem acrescentar um qualificativo interpretativo como “convincentes” ou “infalíveis”.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: ao longo de quarenta dias
  rationale: διά com genitivo indica extensão por um período. A expressão comunica aparições distribuídas nesse intervalo, sem sugerir uma aparição contínua.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: aparecendo-lhes
  rationale: O particípio de ὀπτάνομαι tem aqui o sentido usual de aparecer a alguém, especialmente em relatos de aparições após a ressurreição.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: falando sobre o reino de Deus
  rationale: A expressão τὰ περὶ indica as coisas referentes a um assunto. “Falando sobre” é natural em português e mantém o conteúdo do ensino.
- source_word: βασιλείας τοῦ θεοῦ
  choice: reino de Deus
  rationale: “Reino de Deus” é a tradução consagrada e suficientemente ampla para preservar as associações tanto com o governo real quanto com o domínio de Deus.
theological_decisions:
- issue: Linguagem da ressurreição e força das evidências
  choice: Jesus “se apresentou vivo” depois de sofrer, “com muitas provas”.
  alternative: Jesus “se mostrou vivo” depois de sua paixão, “com muitas provas infalíveis”.
  rationale: O grego afirma claramente que Jesus estava vivo após o sofrimento e que isso foi acompanhado de τεκμήρια. A tradução preserva essa afirmação sem o termo arcaico “paixão” nem o acréscimo interpretativo “infalíveis”.
- issue: Gênero do antecedente de οἷς
  choice: “a eles”
  alternative: “a esses homens”
  rationale: O contexto identifica os referentes como os apóstolos, mas o pronome grego não contém o substantivo “homens”. A forma pronominal portuguesa mantém a referência contextual sem explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no espaço lusófono. A ordem temporal inicial evita uma sequência pesada de complementos e torna explícita, sem ampliar o conteúdo, a anterioridade do sofrimento. “Reino” permanece em minúscula por ser substantivo comum, sem prejuízo da expressão teológica tradicional.
