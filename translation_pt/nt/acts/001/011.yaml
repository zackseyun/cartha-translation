id: ACT.1.11
reference: Acts 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: pt
  text: 'Eles também disseram: “Homens da Galileia, por que vocês estão parados, olhando para o céu? Este Jesus[a], que foi elevado dentre vocês ao céu, virá do mesmo modo como vocês o viram ir para o céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais tradicional: “Este mesmo Jesus”. O grego diz explicitamente “Este Jesus”; “mesmo” é um acréscimo interpretativo que enfatiza sua identidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Homens da Galileia
  rationale: Reproduz o vocativo masculino plural e funciona como forma direta e natural de tratamento em português.
- source_word: τί ἑστήκατε βλέποντες
  choice: por que vocês estão parados, olhando
  rationale: O perfeito ἑστήκατε expressa o estado presente de estar de pé/parado, enquanto βλέποντες descreve a ação simultânea de olhar. A formulação conserva ambos os elementos sem intensificar βλέπω como “contemplar fixamente”.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu / ao céu
  rationale: Neste contexto de ascensão, οὐρανός é adequadamente entendido como “céu”, e a preposição εἰς indica direção ou movimento para ele.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Este Jesus
  rationale: Mantém diretamente o demonstrativo enfático οὗτος sem acrescentar “mesmo”, palavra não expressa no grego.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: que foi elevado de junto de vocês
  rationale: A forma passiva de ἀναλαμβάνω, no contexto da ascensão, indica que Jesus foi elevado; “de junto de vocês” comunica a separação expressa por ἀφ’ ὑμῶν sem sugerir que ele foi escolhido dentre eles.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: virá do mesmo modo como
  rationale: Expressa em português corrente a comparação de maneira formada por οὕτως e ὃν τρόπον, sem redundância excessiva.
- source_word: ἐθεάσασθε
  choice: vocês o viram
  rationale: “Viram” transmite com clareza o testemunho visual; opções como “contemplaram” seriam mais marcadas do que o necessário.
- source_word: πορευόμενον
  choice: ir
  rationale: Representa de modo simples o movimento descrito pelo particípio, sem substituir a expressão do texto por uma interpretação mais específica como “ascender”.
theological_decisions:
- issue: Sentido de οὐρανός no contexto da ascensão e da volta de Jesus
  choice: céu
  alternative: firmamento / céu visível
  rationale: Embora οὐρανός possa designar o céu visível, o contexto narrativo e teológico da ascensão e da prometida volta de Jesus favorece “céu”, sem excluir a dimensão visível da cena.
- issue: Tradução de οὗτος ὁ Ἰησοῦς
  choice: Este Jesus
  alternative: Este mesmo Jesus
  rationale: O grego traz explicitamente o demonstrativo “este”, mas não um termo separado para “mesmo”. A tradução principal preserva a forma mais estrita, e a alternativa tradicional fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. “Estão parados, olhando” conserva a imagem concreta do grego; “de junto de vocês” evita a ambiguidade indesejada de “dentre vocês”.
