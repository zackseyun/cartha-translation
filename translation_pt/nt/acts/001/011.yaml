  terminology: “Céu”, “Este Jesus” e “elevado” são escolhas adequadas ao contexto e ao vocabulário narrativo. A nota sobre “Este mesmo Jesus” informa corretamente que “mesmo” é expansão interpretativa tradicional, não termo expresso no grego.
