  source_fidelity: 'A tradução preserva a estrutura e o sentido central do grego: a interpelação aos galileus, o estado de estarem olhando, a ascensão de Jesus, e a promessa de sua vinda de modo correspondente. Contudo, “de junto de vocês” para ἀφ’ ὑμῶν é pouco idiomático no português atual e soa como uma explicação redacional, não como tradução natural.'
