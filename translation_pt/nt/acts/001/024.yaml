id: ACT.1.24
reference: Acts 1:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: pt
  text: 'E, depois de orarem, disseram: “Tu, Senhor[b], que conheces o coração de todos, mostra[a] qual destes dois escolheste.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “indica” ou “designa”; o verbo pode significar tornar alguém conhecido ou apresentá-lo/designá-lo publicamente.
    reason: lexical_alternative
  - marker: b
    text: O título “Senhor” pode ser entendido aqui como dirigido a Deus em sentido geral ou especificamente a Jesus; o grego não identifica expressamente o referente.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: depois de orarem
  rationale: O particípio aoristo indica naturalmente uma ação anterior à de dizer; a formulação é idiomática e preserva a sequência.
- source_word: Σὺ κύριε
  choice: Tu, Senhor
  rationale: O pronome explícito Σὺ recebe a ênfase devida, e κύριε é mantido como vocativo direto, sem identificar além do que o texto diz.
- source_word: καρδιογνῶστα πάντων
  choice: que conheces o coração de todos
  rationale: Expressa em português natural o título composto καρδιογνώστης e preserva πάντων, entendendo “coração” distributivamente como o interior de cada pessoa.
- source_word: ἀνάδειξον
  choice: mostra
  rationale: No contexto, o pedido é que o Senhor torne conhecida sua escolha. “Mostra” evita especificar que o verbo significa necessariamente a nomeação formal.
- source_word: ὃν ἐξελέξω
  choice: qual ... escolheste
  rationale: A construção identifica qual pessoa já foi escolhida pelo Senhor; o pretérito perfeito simples é natural em português e preserva essa escolha anterior.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: qual destes dois
  rationale: É a forma portuguesa natural de expressar a seleção de um entre os dois, sem acrescentar “homens”, palavra não explícita neste versículo.
theological_decisions:
- issue: Referente de “Senhor” na oração
  choice: Manter apenas o vocativo “Senhor”, sem identificar seu referente.
  alternative: Entender a oração como dirigida a Deus em sentido geral ou, especificamente, a Jesus ressuscitado.
  rationale: O grego não explicita o referente de κύριε neste ponto; a tradução preserva essa ambiguidade teológica legítima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “que conheces o coração de todos” evita o pouco natural “conhecedor dos corações” sem perder o sentido do composto grego. Os marcadores foram colocados junto às palavras a que suas notas efetivamente se referem.
