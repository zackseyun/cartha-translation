id: ACT.1.16
reference: Acts 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: pt
  text: Irmãos,[a] era necessário que se cumprisse a Escritura que o Espírito Santo havia dito de antemão[b] pela boca de Davi a respeito de Judas, que se tornou guia dos que prenderam[c] Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Homens, irmãos”.
    reason: A nota preserva a presença explícita de ἄνδρες, enquanto o texto principal usa a forma vocativa natural em português moderno.
  - marker: b
    text: 'Ou: “havia predito”.'
    reason: προεῖπε pode indicar tanto dizer previamente quanto predizer.
  - marker: c
    text: 'Ou: “agarraram” ou “capturaram”.'
    reason: συλλαμβάνω pode descrever o ato de agarrar ou capturar alguém; neste contexto, trata-se da prisão de Jesus.
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: A expressão é uma fórmula vocativa dirigida ao grupo. “Irmãos” é a forma natural em português moderno; a presença explícita de ἄνδρες é registrada em nota, sem recorrer ao arcaico “varões” nem ampliar o gênero do original.
- source_word: ἔδει
  choice: era necessário
  rationale: Preserva a ideia de necessidade expressa pelo imperfeito impessoal, sem explicar além do texto a natureza dessa necessidade.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: que se cumprisse a Escritura
  rationale: Mantém a linguagem característica de cumprimento das Escrituras e reproduz de modo natural o passivo grego.
- source_word: προεῖπε
  choice: havia dito de antemão
  rationale: Representa diretamente a ideia de dizer previamente, sem impor o sentido mais técnico de “profetizar” ou “predizer”.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada, atual e clara para o agente explícito da fala.
- source_word: διὰ στόματος Δαυὶδ
  choice: pela boca de Davi
  rationale: 'Conserva a imagem concreta e a relação instrumental do grego: o Espírito fala por meio de Davi.'
- source_word: περὶ Ἰούδα
  choice: a respeito de Judas
  rationale: Expressa naturalmente o assunto introduzido por περί com genitivo.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: que se tornou guia
  rationale: Preserva o valor de γίνομαι e não acrescenta ao substantivo uma definitude ausente no grego.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: dos que prenderam Jesus
  rationale: No contexto, συλλαμβάνω descreve a captura de Jesus; “prenderam” comunica com clareza essa ação em português atual.
theological_decisions:
- issue: Natureza da necessidade do cumprimento
  choice: “era necessário”, sem definir a causa ou o mecanismo dessa necessidade
  alternative: Explicitar predestinação divina ou reduzir a necessidade a mera conveniência
  rationale: O versículo afirma a necessidade do cumprimento, mas não resolve aqui a relação entre propósito divino, presciência e responsabilidade humana.
- issue: Agência na inspiração
  choice: O Espírito Santo é apresentado como aquele que falou, e Davi como o agente humano por cuja boca falou
  alternative: Apresentar Davi como agente principal inspirado pelo Espírito ou substituir a fala por uma formulação abstrata sobre autoria
  rationale: A estrutura grega atribui explicitamente a fala ao Espírito Santo e emprega Davi como mediador humano.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase acompanha de perto o grego sem sacrificar a fluidez; “pela boca de Davi” conserva deliberadamente a imagem semítica.
