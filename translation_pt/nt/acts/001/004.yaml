  source_fidelity: A redação transmite adequadamente a ordem de não deixar Jerusalém, a espera da promessa do Pai e a referência ao que os discípulos ouviram de Jesus. «Enquanto permanecia com eles» é uma solução prudente para o particípio συναλιζόμενος, cuja nuance exata é debatida.
  naturalness: O texto é em geral claro e moderno. Contudo, as aspas iniciadas apenas antes de «a qual vocês ouviram de mim» criam uma citação parcial sem introdução nem fechamento e tornam a construção tipograficamente e sintaticamente inadequada. A fala direta deve abranger toda a ordem, ou as aspas devem ser removidas.
