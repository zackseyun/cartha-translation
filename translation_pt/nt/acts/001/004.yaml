  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: pt
  text: E, enquanto permanecia com eles[a], ordenou-lhes que não se afastassem de Jerusalém, mas que esperassem a promessa do Pai, que vocês ouviram de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «enquanto se reunia com eles»; alguns entendem a expressão como «enquanto comia com eles».
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: enquanto permanecia com eles
  rationale: O particípio é lexicalmente difícil, mas indica com segurança que Jesus estava na companhia dos apóstolos. A formulação é natural em português e mantém a leitura geral, enquanto as alternativas mais específicas ficam registradas em nota.
- source_word: παρήγγειλεν
  choice: ordenou-lhes
  rationale: O verbo expressa uma determinação dada com autoridade; «ordenou-lhes» preserva essa força sem suavizá-la para uma simples instrução.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: que não se afastassem de Jerusalém
  rationale: A expressão indica que não deveriam deixar a cidade. «Não se afastassem» comunica naturalmente a separação espacial expressa pelo grego.
- source_word: περιμένειν
  choice: esperassem
  rationale: Expressa espera expectante e é a forma corrente e clara em português.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: a promessa do Pai
  rationale: Mantém de modo direto o genitivo grego, sem explicitar indevidamente se se trata apenas de uma promessa feita pelo Pai ou do seu conteúdo prometido.
- source_word: ἣν ἠκούσατέ μου
  choice: a qual vocês ouviram de mim
  rationale: O pronome genitivo com ἀκούω é traduzido naturalmente por «de mim». O relativo «a qual» retoma com clareza «a promessa» e preserva a mudança para a fala direta de Jesus.
theological_decisions:
- issue: Sentido de συναλιζόμενος na atividade de Jesus após a ressurreição
  choice: enquanto permanecia com eles
  alternative: enquanto se reunia com eles; enquanto comia com eles
  rationale: A tradução principal afirma apenas o sentido contextual seguro de Jesus estar junto dos discípulos, sem transformar em certeza a discutida nuance lexical de reunir-se ou comer com eles. A alternativa específica é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» na fala direta para clareza contemporânea e mantém «promessa do Pai» sem expansão interpretativa.
