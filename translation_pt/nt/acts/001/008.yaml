source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: pt
  text: Mas vocês receberão poder quando o Espírito Santo vier sobre vocês, e serão minhas testemunhas em Jerusalém, em toda a Judeia, em Samaria e até o extremo da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até os confins da terra”. A expressão grega está no singular (“até o extremo da terra”), mas indica de modo idiomático a região mais remota da terra.'
    reason: alternativa lexical e esclarecimento do idioma grego
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a declaração anterior sobre tempos e épocas, de modo natural em português.
- source_word: λήμψεσθε δύναμιν
  choice: vocês receberão poder
  rationale: O futuro de λαμβάνω indica receber o que é concedido; δύναμις designa aqui poder ou capacidade eficaz, sem se limitar a força física.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: quando o Espírito Santo vier sobre vocês
  rationale: A construção absoluta com particípio aoristo é expressa por uma oração temporal idiomática; “vier sobre” preserva o movimento indicado por ἐπί.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: serão minhas testemunhas
  rationale: O genitivo μου associa as testemunhas a Jesus; μάρτυρες designa pessoas que dão testemunho, não necessariamente mártires no sentido posterior do termo.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: em Jerusalém, em toda a Judeia e Samaria
  rationale: Mantém os lugares concretos e a progressão geográfica; a preposição diante de Samaria é subentendida no grego e também pode sê-lo naturalmente em português.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: até o extremo da terra
  rationale: Preserva o singular da expressão grega e comunica a extensão geográfica mais remota; “até os confins da terra” é a alternativa idiomática tradicional.
theological_decisions:
- issue: Referência pessoal de τοῦ ἁγίου πνεύματος
  choice: o Espírito Santo
  alternative: o espírito santo
  rationale: O contexto apresenta o Espírito Santo como o agente divino que vem sobre os discípulos; a capitalização segue o uso cristão corrente sem acrescentar explicação doutrinária ao versículo.
- issue: Natureza de μάρτυρες
  choice: minhas testemunhas
  alternative: testemunhas a meu favor
  rationale: A formulação preserva a relação genitiva direta com Jesus e não antecipa o sentido posterior de “mártir”.
- issue: Alcance da missão de testemunho
  choice: progressão geográfica concreta até o extremo da terra
  alternative: geografia puramente simbólica
  rationale: Os nomes de lugares e a expressão final apresentam uma expansão territorial real, sem exigir que a tradução imponha um esquema eclesiológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμᾶς. A redação conserva a progressão de Jerusalém para Judeia, Samaria e o horizonte mundial. O marcador [a] foi colocado junto à expressão que a nota explica.
