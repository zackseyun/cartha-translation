source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: pt
  text: Escrevi o primeiro relato[a], ó Teófilo, sobre tudo o que Jesus começou a fazer e a ensinar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o relato anterior” ou “o primeiro livro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: No primeiro relato
  rationale: Neste contexto, λόγος designa um relato escrito, isto é, a obra anterior dirigida a Teófilo. “Primeiro” preserva πρῶτον e a relação sequencial com Atos; μέν funciona como elemento de enquadramento discursivo e não exige equivalente isolado em português.
- source_word: ἐποιησάμην
  choice: escrevi
  rationale: Com λόγον, o verbo tem o sentido idiomático de produzir ou compor uma obra escrita. “Escrevi” é claro e natural em português.
- source_word: περὶ πάντων
  choice: sobre tudo
  rationale: περί com genitivo indica o assunto tratado. “Sobre tudo o que” reproduz naturalmente a ligação com o pronome relativo seguinte sem impor uma exaustividade além do escopo narrativo.
- source_word: ὦ Θεόφιλε
  choice: ó Teófilo
  rationale: A interjeição “ó” preserva a marca explícita de vocativo sem acrescentar afeto não expresso no grego.
- source_word: ὧν
  choice: o que
  rationale: Na construção περὶ πάντων ... ὧν, “sobre tudo o que” é a forma idiomática em português de ligar o relativo ao antecedente.
- source_word: ἤρξατο
  choice: começou
  rationale: Preserva o sentido explícito do verbo e sua possível sugestão de continuidade, sem tornar essa implicação mais explícita que o original.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome pessoal.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: a fazer e a ensinar
  rationale: Mantém os dois infinitivos coordenados e a distinção ampla entre as ações e o ensino de Jesus. Em português, a simples coordenação com “e” expressa naturalmente τε καί, sem necessidade de uma construção mais pesada com “tanto... como”.
theological_decisions:
- issue: Implicação de ἤρξατο (“começou”) quanto à continuação da obra de Jesus em Atos
  choice: Manter “começou” no texto sem explicar a continuidade.
  alternative: Traduzir simplesmente “fez e ensinou” ou explicitar “continuou a fazer por meio dos apóstolos”.
  rationale: O grego afirma que Jesus “começou” a fazer e ensinar. A formulação pode sugerir que sua obra continua na narrativa de Atos, mas a tradução deve preservar essa possibilidade e tensão sem resolvê-la por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se “ó Teófilo” para refletir o vocativo grego; a ordem da frase é natural em português e conserva a abertura formal da obra.
