id: ACT.1.13
reference: Acts 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: pt
  text: 'Quando entraram, subiram ao aposento no andar de cima onde estavam hospedados: Pedro, João, Tiago e André; Filipe e Tomé; Bartolomeu e Mateus; Tiago, filho de Alfeu; Simão, o Zelote; e Judas, filho de Tiago.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Judas, irmão de Tiago». O grego diz apenas «Judas de Tiago», deixando implícita a relação exata.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: entraram
  rationale: O aoristo na oração temporal indica a ação anterior à subida; em português, o pretérito perfeito simples expressa naturalmente essa sequência, sem necessidade de mais-que-perfeito.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: subiram ao aposento no andar de cima
  rationale: Preserva tanto o movimento ascendente de ἀνέβησαν quanto o sentido arquitetônico de ὑπερῷον, em linguagem atual e sem associações eclesiais desnecessárias.
- source_word: οὗ ἦσαν καταμένοντες
  choice: onde estavam hospedados
  rationale: Comunica a permanência continuada indicada por ἦσαν καταμένοντες e soa natural para uma estadia temporária.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Tiago, filho de Alfeu
  rationale: O genitivo identifica Tiago por filiação; explicitar «filho de» é natural em português e provável neste contexto.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simão, o Zelote
  rationale: ζηλωτής funciona como epíteto identificador; «Zelote» é a forma tradicional, clara e lexicalmente correspondente.
- source_word: Ἰούδας Ἰακώβου
  choice: Judas, filho de Tiago
  rationale: Em uma lista apostólica, o genitivo é provavelmente patronímico, embora o grego não explicite a relação; a ambiguidade é preservada em nota.
theological_decisions:
- issue: Relação expressa por Ἰούδας Ἰακώβου
  choice: Judas, filho de Tiago
  alternative: Judas, irmão de Tiago
  rationale: O genitivo grego deixa a relação implícita. A identificação patronímica é mais provável no contexto de uma lista de homens, mas a alternativa «irmão de Tiago» permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Aposento no andar de cima» evita a carga tradicional de «cenáculo» e torna transparente o sentido espacial. A pontuação organiza a lista sem reproduzir de modo artificial todos os conectivos gregos.
