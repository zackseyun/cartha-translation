base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: pt
  text: Então eles voltaram para Jerusalém, do monte chamado Monte das Oliveiras, que fica perto de Jerusalém, a uma jornada de sábado de distância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma «jornada de sábado» era a distância que, segundo o costume judaico, se podia percorrer no sábado.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural que dá sequência à narrativa.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: eles voltaram para Jerusalém
  rationale: Expressa de modo corrente o retorno em direção à cidade.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: vindo do monte chamado das Oliveiras
  rationale: Preserva a referência a ὄρος e emprega o nome tradicional e transparente em português, sem recorrer ao pouco comum “Olivete”.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: que fica perto de Jerusalém
  rationale: Formulação simples e natural para a proximidade geográfica.
- source_word: σαββάτου ἔχον ὁδόν
  choice: à distância da caminhada permitida num sábado
  rationale: Torna inteligível a expressão cultural judaica sem convertê-la numa medida moderna exata.
theological_decisions:
- issue: Expressão judaica de distância σαββάτου ἔχον ὁδόν
  choice: à distância da caminhada permitida num sábado
  alternative: à distância de uma jornada de sábado
  rationale: A escolha comunica ao leitor moderno que se trata de uma distância convencional ligada à observância do sábado, preservando seu contexto judaico sem sugerir precisão métrica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Monte das Oliveiras” mantém o nome tradicional reconhecível; a expressão sobre o sábado é explicitada com discrição no texto e esclarecida na nota.
