revisions:
- from: Então eles voltaram para Jerusalém, vindo do monte chamado das Oliveiras, que fica perto de Jerusalém, à distância da caminhada permitida num sábado.[a]
  to: Então eles voltaram para Jerusalém, do monte chamado Monte das Oliveiras, que fica perto de Jerusalém, a uma jornada de sábado de distância.[a]
  rationale: A revisão conserva todos os elementos do grego e o registro narrativo moderno, usa o topônimo português tradicional de modo gramaticalmente claro e deixa a explicação cultural da jornada de sábado na nota, onde ela informa sem sobrecarregar ou interpretar em excesso o texto.
