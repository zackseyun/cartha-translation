review_pass:
  verdict: revise
  source_fidelity: 'O sentido geral está preservado: o retorno a Jerusalém, a procedência do monte, sua proximidade da cidade e a expressão judaica de distância constam na tradução. Contudo, «caminhada permitida» introduz no texto uma explicitação interpretativa que é melhor mantida na nota, enquanto a construção «monte chamado das Oliveiras» não apresenta o nome do lugar de modo idiomático em português.'
  naturalness: «Então eles voltaram para Jerusalém» e «que fica perto de Jerusalém» são naturais. A forma «do monte chamado Monte das Oliveiras» identifica com clareza o topônimo tradicional; «a uma jornada de sábado de distância» é uma formulação mais fluente e próxima da expressão original do que «à distância da caminhada permitida num sábado».
  terminology: «Monte das Oliveiras» é o topônimo português estabelecido e apropriado. «Jornada de sábado» preserva a expressão histórico-cultural sem alegar no texto uma formulação normativa específica.
  issues:
  - severity: medium
    issue: «monte chamado das Oliveiras» é uma nomeação elíptica e pouco idiomática.
    rationale: Em português, «das Oliveiras» isoladamente não funciona bem como o nome pelo qual o monte é chamado. «Monte das Oliveiras» é o topônimo reconhecível e torna explícita a designação do lugar.
  - severity: medium
    issue: «caminhada permitida num sábado» explicita no texto uma interpretação cultural.
    rationale: O grego emprega a expressão idiomática «jornada/caminho de sábado». A noção de distância costumeiramente admitida pode ser explicada em nota, mas inseri-la como «permitida» no texto reduz desnecessariamente a concisão e a forma idiomática da fonte.
  revised_text: Então eles voltaram para Jerusalém, do monte chamado Monte das Oliveiras, que fica perto de Jerusalém, a uma jornada de sábado de distância.[a]
  revised_footnotes:
  - marker: a
    text: Uma «jornada de sábado» era a distância que, segundo o costume judaico, se podia percorrer no sábado.
    reason: cultural_note
