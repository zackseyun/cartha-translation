id: ACT.1.2
reference: Acts 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: pt
  text: até o dia em que, depois de dar ordens por meio do Espírito Santo[a] aos apóstolos que havia escolhido, foi elevado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de dar ordens pelo Espírito Santo”. A expressão grega pode indicar meio ou agência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: até o dia em que
  rationale: Expressa naturalmente em português o limite temporal indicado pela construção grega e mantém sua ligação com o versículo anterior.
- source_word: ἐντειλάμενος
  choice: depois de dar ordens
  rationale: Torna explícita, de modo idiomático, a anterioridade do particípio aoristo em relação ao verbo principal; “ordens” preserva melhor a força de ἐντέλλομαι do que “instruções”.
- source_word: τοῖς ἀποστόλοις
  choice: aos apóstolos
  rationale: “Apóstolos” é o termo estabelecido e adequado em Lucas–Atos para esse grupo escolhido por Jesus.
- source_word: διὰ πνεύματος ἁγίου
  choice: por meio do Espírito Santo
  rationale: διά com genitivo pode indicar meio ou agência; “por meio do” conserva essa nuance sem acrescentar ao texto uma referência explícita ao poder do Espírito.
- source_word: οὓς ἐξελέξατο
  choice: que havia escolhido
  rationale: Identifica os apóstolos como aqueles que Jesus escolhera anteriormente e comunica com naturalidade a anterioridade da escolha.
- source_word: ἀνελήμφθη
  choice: foi elevado
  rationale: Reproduz o sentido passivo do verbo e evita acrescentar “ao céu”, destino que não é expresso neste versículo.
theological_decisions:
- issue: Relação entre as ordens de Jesus e o Espírito Santo
  choice: Jesus deu ordens aos apóstolos por meio do Espírito Santo antes de ser elevado.
  alternative: Jesus deu ordens aos apóstolos pelo Espírito Santo.
  rationale: A sintaxe liga mais naturalmente διὰ πνεύματος ἁγίου a ἐντειλάμενος, indicando meio ou agência. A nota preserva a amplitude possível da construção sem desenvolver uma formulação doutrinária além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o grego sem sacrificar a naturalidade; “foi elevado” mantém o passivo e não explicita um destino ausente do versículo.
