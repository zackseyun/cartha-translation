  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: pt
  text: Assim, esse homem adquiriu um campo com o salário da injustiça[a] e, caindo de cabeça[b], arrebentou-se pelo meio, e todas as suas entranhas se derramaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com a recompensa da maldade”. A expressão grega também pode ser traduzida mais literalmente como “a partir do salário da injustiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficando de bruços” ou “caindo com o rosto no chão”. A expressão provavelmente descreve uma queda de cabeça ou para a frente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Assim, esse homem
  rationale: Retoma Judas e expressa de modo natural a continuidade e a inferência indicadas por μέν οὖν.
- source_word: ἐκτήσατο
  choice: adquiriu
  rationale: Mantém o sentido amplo de obter posse sem afirmar que Judas comprou pessoalmente o campo.
- source_word: χωρίον
  choice: um campo
  rationale: É a tradução direta e corrente para uma área ou parcela de terra neste contexto.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: com o pagamento da injustiça
  rationale: Expressa a origem ou o meio financeiro ligado à injustiça em português natural, preservando a força moral da expressão grega.
- source_word: πρηνὴς γενόμενος
  choice: caindo de cabeça
  rationale: Comunica de forma idiomática a provável ideia de uma queda de cabeça ou para a frente, sem ocultar a alternativa lexical indicada em nota.
- source_word: ἐλάκησεν μέσος
  choice: arrebentou-se pelo meio
  rationale: Reproduz com clareza e vivacidade a ideia de romper-se na parte central.
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: todas as suas entranhas se derramaram
  rationale: Mantém a construção passiva e a descrição concreta; “entranhas” é digna, compreensível e semanticamente mais abrangente que “intestinos”.
theological_decisions:
- issue: Relação de Judas com a aquisição do campo
  choice: Traduzir ἐκτήσατο por “adquiriu”, sem especificar o mecanismo da aquisição.
  alternative: “comprou” pessoalmente o campo; ou o campo foi comprado em seu nome/com o dinheiro ligado a ele.
  rationale: O grego afirma aquisição ou posse, mas não exige uma compra pessoal direta. A formulação preserva a tensão com Mateus 27:5–8 em vez de harmonizá-la dentro da tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas foi regularizada para acompanhar sua ocorrência no texto. “Adquiriu” evita uma harmonização interpretativa; “entranhas” conserva a amplitude de σπλάγχνα sem soar excessivamente técnico.
