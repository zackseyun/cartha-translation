id: ACT.1.20
reference: Acts 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: pt
  text: 'Pois está escrito no livro dos Salmos: “Que a sua morada fique deserta[a], e não haja quem habite nela”[b]; e: “Que outro assuma o seu encargo de supervisão”[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habitação” ou “lugar de moradia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ninguém more nela” ou “não haja nela nenhum habitante”.
    reason: lexical_alternative
  - marker: c
    text: “Encargo de supervisão” traduz ἐπισκοπή. Também pode ser traduzido como “cargo”, “função de supervisor” ou, tradicionalmente, “episcopado”; esta última opção pode sugerir um ofício eclesiástico técnico posterior que o contexto não exige.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula corrente de citação das Escrituras que preserva a força presente do perfeito passivo.
- source_word: βίβλῳ ψαλμῶν
  choice: no livro dos Salmos
  rationale: Identifica a fonte da citação de modo natural, claro e tradicional em português.
- source_word: Γενηθήτω
  choice: Que ... fique
  rationale: Expressa naturalmente em português a força volitiva do imperativo aoristo dentro da citação.
- source_word: ἔπαυλις
  choice: morada
  rationale: Termo amplo para lugar de habitação, adequado ao tom solene do salmo sem especificar indevidamente casa, propriedade ou acampamento.
- source_word: ἔρημος
  choice: deserta
  rationale: No contexto, descreve uma morada deixada sem habitantes e conserva o tom solene da citação.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: não haja quem habite nela
  rationale: Reproduz de maneira idiomática a construção negativa e o particípio substantivado, mantendo a ideia de ausência de qualquer habitante.
- source_word: ἐπισκοπή
  choice: encargo de supervisão
  rationale: Comunica tanto a responsabilidade confiada quanto a noção lexical de supervisão, evitando impor ao contexto um título eclesiástico técnico posterior.
- source_word: λαβέτω ἕτερος
  choice: Que outro assuma
  rationale: Preserva a força do imperativo e expressa naturalmente a transferência do encargo a outra pessoa.
theological_decisions:
- issue: Tradução de ἐπισκοπή no contexto da função deixada por Judas
  choice: encargo de supervisão
  alternative: cargo; função de supervisor; episcopado
  rationale: A expressão mantém a noção de responsabilidade e supervisão sem identificar automaticamente o papel apostólico de Judas com estruturas eclesiásticas técnicas posteriores. As alternativas lexicamente possíveis são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação distingue claramente as duas citações dos Salmos. A formulação conserva o caráter solene e volitivo do texto citado sem arcaísmos desnecessários.
