  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: pt
  text: E, naqueles dias, Pedro se levantou no meio dos irmãos e disse (e o grupo reunido contava com cerca de cento e vinte pessoas):[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, mas, nesta comunidade reunida, o termo pode abranger todos os que criam, inclusive as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo introduz a ação de Pedro antes de falar; a expressão é concreta, natural e adequada à cena.
- source_word: ἐν μέσῳ
  choice: no meio de
  rationale: Preserva a ideia espacial de Pedro estar dentro do grupo reunido, em linguagem portuguesa corrente.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Mantém no texto principal o masculino plural do grego; uma nota registra que, no contexto, a referência pode abranger também as mulheres da comunidade.
- source_word: ὄχλος ὀνομάτων
  choice: o grupo
  rationale: A expressão literalmente ligada a uma 'multidão de nomes' é um modo de contar pessoas. 'O grupo' comunica o sentido idiomático sem produzir em português a formulação obscura 'número de nomes'.
- source_word: ἐπὶ τὸ αὐτό
  choice: reunido
  rationale: Expressa de maneira concisa que as pessoas estavam juntas, sem impor além do necessário a ideia de um local específico.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: cerca de cento e vinte
  rationale: ὡς diante de um número indica aproximação; 'cerca de' é a forma corrente e clara em português.
- source_word: ὀνομάτων
  choice: pessoas
  rationale: No idiomatismo, 'nomes' representa indivíduos contados. 'Pessoas' torna o referente explícito e natural em português.
theological_decisions:
- issue: Referência de gênero em ἀδελφῶν na comunidade reunida
  choice: Traduzir por 'irmãos' no texto principal e indicar em nota a possível abrangência inclusiva.
  alternative: irmãos e irmãs; discípulos; crentes
  rationale: A opção preserva a forma masculina do texto grego sem ocultar que a comunidade reunida, conforme o contexto de Atos 1, incluía mulheres.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada dentro do parêntese para tornar idiomática a expressão grega, mantendo a aproximação numérica e a ideia de reunião.
