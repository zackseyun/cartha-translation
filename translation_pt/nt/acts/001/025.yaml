id: ACT.1.25
reference: Acts 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: pt
  text: para ocupar o lugar deste ministério e apostolado, do qual Judas se desviou[a] para ir para o seu próprio lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se afastou” ou “abandonou”. O verbo grego pode indicar desvio ou afastamento do ministério e apostolado.
    reason: lexical_alternative
  - marker: b
    text: “Seu próprio lugar” pode referir-se simplesmente ao lugar que cabia a Judas ou, de modo mais incisivo, ao lugar de juízo que lhe correspondia.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: ocupar
  rationale: No contexto da escolha de um substituto, o infinitivo indica assumir a função vacante. “Ocupar o lugar” é natural em português e transmite o sentido de tomar para si uma função.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: Mantém a imagem concreta de τόπος aplicada à função e também a correspondência deliberada com “seu próprio lugar” no fim do versículo.
- source_word: διακονίας
  choice: ministério
  rationale: Neste contexto, designa o serviço confiado aos apóstolos; “ministério” é corrente e conserva a noção de serviço comissionado.
- source_word: ἀποστολῆς
  choice: apostolado
  rationale: Expressa a comissão ou função apostólica específica, sem reduzi-la a uma missão genérica.
- source_word: ἀφ’ ἧς
  choice: do qual
  rationale: Retoma conjuntamente o ministério e o apostolado como a função da qual Judas se afastou; o masculino singular concorda naturalmente com o elemento coordenado mais próximo, “apostolado”.
- source_word: παρέβη
  choice: se desviou
  rationale: Preserva a ideia de afastamento ou desvio da função recebida, sem impor o sentido mais específico de transgressão nem uma formulação doutrinária técnica.
- source_word: πορευθῆναι
  choice: para ir
  rationale: Reproduz de modo simples a ideia de movimento expressa pelo infinitivo, deixando aberta a relação precisa de propósito ou resultado.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: para o seu próprio lugar
  rationale: Conserva a formulação breve, enfática e ambígua do grego, sem identificar explicitamente o destino de Judas.
theological_decisions:
- issue: Sentido de “seu próprio lugar” quanto ao destino de Judas
  choice: Manter “seu próprio lugar” no texto principal.
  alternative: Explicitar como morte, sepultura, condenação ou lugar de juízo.
  rationale: A expressão grega não define o destino. A tradução preserva a tensão e evita afirmar mais do que o texto diz.
- issue: Natureza do afastamento de Judas
  choice: Traduzir παρέβη por “se desviou”.
  alternative: “transgrediu”, “abandonou” ou “se afastou”.
  rationale: “Se desviou” comunica o afastamento do ministério e apostolado, mantendo a amplitude lexical do verbo e evitando decidir se a ênfase recai sobre transgressão moral, abandono da função ou queda.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ministério” e “apostolado” preservam o registro eclesial do contexto; a repetição de “lugar” conserva a ligação retórica do grego.
