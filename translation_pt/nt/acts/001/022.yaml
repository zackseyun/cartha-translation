- from: começando com o batismo de João e indo até o dia em que ele foi elevado dentre nós, um destes deve tornar-se conosco testemunha da ressurreição dele.
  to: Desde o batismo de João até o dia em que ele foi levado para cima dentre nós, um destes deve tornar-se, conosco, testemunha da ressurreição dele.
  rationale: A revisão substitui construções portuguesas menos precisas por «desde ... até ...» e esclarece a ascensão passiva e a partida do grupo com «foi levado para cima dentre nós». Mantém-se «deve» por depender de δεῖ no versículo anterior, «um destes» sem suprir «homens», e a relação associativa de σὺν ἡμῖν por meio de «conosco».
