source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: pt
  text: Desde o batismo de João até o dia em que ele foi levado para cima dentre nós, um destes deve tornar-se, conosco, testemunha da ressurreição dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: começando com o batismo de João
  rationale: O particípio abre o intervalo temporal exigido. Em português, “começando com” expressa naturalmente o ponto inicial; “o batismo de João” preserva a construção genitiva sem decidir se se trata do batismo administrado por João ou do batismo dele próprio, embora o contexto favoreça a primeira leitura.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: e indo até o dia em que
  rationale: A inclusão de “indo” torna natural em português a correlação do intervalo iniciado por “começando com”, sem alterar o limite temporal do grego.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: ele foi elevado dentre nós
  rationale: “Foi elevado” conserva a voz passiva e a dimensão vertical associada à ascensão, sem acrescentar explicitamente “ao céu”. “Dentre nós” comunica sua partida do meio do grupo.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: testemunha da ressurreição dele
  rationale: “Testemunha da ressurreição” reproduz com naturalidade o genitivo grego. “Dele” evita a ambiguidade referencial que “sua” poderia criar em português.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: deve tornar-se conosco
  rationale: “Conosco” preserva a associação do novo integrante aos demais testemunhos apostólicos; “deve” recupera a necessidade expressa por δεῖ no versículo anterior, do qual este fragmento depende sintaticamente.
- source_word: ἕνα τούτων
  choice: um destes
  rationale: Segue o texto grego sem repetir “homens”, já expresso no contexto anterior.
theological_decisions:
- issue: Necessidade regente herdada do versículo anterior
  choice: deve tornar-se
  alternative: tornar-se
  rationale: O infinitivo γενέσθαι depende de δεῖ em Atos 1:21. Repor “deve” produz uma frase completa e preserva a força sintática, sem acrescentar uma exigência teológica estranha ao texto.
- issue: Referência à ascensão
  choice: foi elevado
  alternative: foi levado para cima / ascendeu ao céu
  rationale: A formulação mantém o passivo e o movimento vertical do verbo, mas não explicita o agente nem o destino, que não aparecem nesta oração.
- issue: Função da testemunha apostólica
  choice: testemunha da ressurreição dele
  alternative: testemunha a respeito da ressurreição dele
  rationale: A construção conserva o genitivo e sua amplitude, sem restringir o testemunho apenas ao ato de ter visto nem expandi-lo numa formulação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A estrutura conserva a dependência do versículo anterior e evita tanto arcaísmos (“dentre estes”) quanto uma paráfrase doutrinária explícita da ascensão.
