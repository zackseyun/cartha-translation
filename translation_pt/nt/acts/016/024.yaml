id: ACT.16.24
reference: Acts 16:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: pt
  text: Tendo recebido tal ordem, ele os lançou na parte mais interna da prisão e prendeu os pés deles no tronco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «na madeira»; pelo contexto, trata-se de um instrumento de madeira usado para imobilizar os pés, isto é, um tronco ou cepo.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: tal ordem
  rationale: παραγγελία designa uma ordem ou instrução dada por autoridade; «tal ordem» é natural e retoma a determinação do contexto anterior.
- source_word: λαβὼν
  choice: Tendo recebido
  rationale: O particípio aoristo indica uma ação anterior à ação principal e é preservado por uma construção participial natural em português.
- source_word: ἔβαλεν
  choice: lançou
  rationale: βάλλω pode significar simplesmente «pôr» neste contexto, mas «lançou» conserva a força do verbo e a dureza do tratamento sem acrescentar informação.
- source_word: ἐσωτέραν φυλακήν
  choice: a parte mais interna da prisão
  rationale: ἐσωτέραν é comparativo e indica o setor interior, mais protegido, da prisão. A formulação escolhida é clara em português corrente e evita a expressão pouco natural «prisão interior».
- source_word: ἠσφαλίσατο
  choice: prendeu
  rationale: ἀσφαλίζω significa tornar seguro ou fixar firmemente. Com os pés e o instrumento de contenção, «prendeu» comunica a ação de modo direto e idiomático.
- source_word: τοὺς πόδας αὐτῶν
  choice: os pés deles
  rationale: A tradução mantém o sentido direto de πούς e torna inequívoco que os pés pertenciam aos dois prisioneiros.
- source_word: εἰς τὸ ξύλον
  choice: no tronco
  rationale: ξύλον significa literalmente «madeira» ou «objeto de madeira»; neste contexto prisional, designa o instrumento de madeira usado para imobilizar os pés. «Tronco» é o termo bíblico e histórico adequado em português, esclarecido em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e vocabulário de ampla compreensão no Brasil e em outros contextos lusófonos. O pronome «ele» retoma naturalmente o carcereiro mencionado no versículo anterior; não se introduziu nota onde o grego não apresenta ambiguidade relevante.
