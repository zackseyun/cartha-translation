base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: pt
  text: Então vieram e lhes dirigiram um apelo[a]. Depois de conduzi-los para fora, pediam que deixassem a cidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insistiram com eles”, “rogaram-lhes” ou “os exortaram”. O verbo grego também pode significar “consolar” em outros contextos, mas aqui provavelmente tem sentido conciliatório, depois dos maus-tratos infligidos pelos magistrados a Paulo e Silas.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo traduzido como “pediam” está no imperfeito em grego e pode indicar uma solicitação repetida ou continuada: “continuavam pedindo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: vieram
  rationale: O particípio aoristo introduz a ação seguinte dos magistrados; a forma finita é natural em português e mantém a sequência narrativa.
- source_word: παρεκάλεσαν
  choice: procuraram apaziguá-los
  rationale: Neste contexto, παρακαλέω descreve uma abordagem conciliatória dos magistrados após os maus-tratos infligidos a Paulo e Silas. A expressão evita tanto o sentido pastoral de 'consolar' quanto a intensidade possivelmente excessiva de 'implorar'.
- source_word: αὐτούς
  choice: -los
  rationale: O pronome retoma Paulo e Silas e é expresso naturalmente como objeto direto enclítico.
- source_word: ἐξαγαγόντες
  choice: depois de conduzi-los para fora
  rationale: O particípio aoristo indica uma ação anterior ao pedido e ἐξάγω denota conduzir ou levar para fora.
- source_word: ἠρώτων
  choice: pediam
  rationale: O imperfeito de ἐρωτάω é preservado por 'pediam', que pode transmitir uma solicitação continuada ou repetida sem tornar essa nuance obrigatória.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: que deixassem a cidade
  rationale: Expressa idiomaticamente em português o conteúdo do pedido, mantendo o sentido de partir para longe da cidade.
