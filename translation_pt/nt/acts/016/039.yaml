translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases torna a sequência participial grega natural sem apagar a progressão dos acontecimentos. 'Apaziguá-los' explicita com moderação a força conciliatória sugerida pelo contexto; a nota conserva alternativas lexicais legítimas.
