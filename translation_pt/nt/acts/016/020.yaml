  naturalness: O português é claro e de registro adequado. «Depois de levá-los aos magistrados» e «estão perturbando nossa cidade» são naturais, precisos e amplamente compreensíveis. A aposição final «são judeus» preserva, de modo idiomático, a associação abrupta da identidade étnico-religiosa com a acusação, sem inserir explicitamente «porque».
  terminology: «Magistrados» corresponde melhor a στρατηγοί do que a expressão genérica «autoridades da cidade». «Judeus» é a opção contextual mais adequada para Ἰουδαῖοι em Filipos; a nota pode registrar «judeanos» como alternativa lexical. «Pretores» permanece útil como explicação histórica em nota, não como texto principal.
