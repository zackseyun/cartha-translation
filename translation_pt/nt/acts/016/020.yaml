- from: 'Depois de levá-los às autoridades da cidade[a], disseram: “Estes homens estão causando tumulto em nossa cidade; são judeus[b]”'
  to: 'Depois de levá-los aos magistrados[a], disseram: “Estes homens estão perturbando nossa cidade; são judeus[b].”'
  rationale: A revisão substitui a designação genérica por «magistrados», que corresponde mais precisamente a στρατηγοῖς, e verte ἐκταράσσουσιν por «estão perturbando», sem especificar um motim. Mantém-se o ponto e vírgula seguido de «são judeus» para refletir a ligação compacta e possivelmente preconceituosa de ὑπάρχοντες («sendo judeus») sem impor uma relação causal explícita. As notas foram ajustadas para evitar apresentar «magistrados» como alternativa quando ele já está no texto principal.
