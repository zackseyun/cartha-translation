source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: pt
  text: 'Depois de levá-los aos magistrados[a], disseram: “Estes homens estão perturbando nossa cidade; são judeus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pretores”. Em uma colônia romana como Filipos, eram magistrados civis.
    reason: cultural_note
  - marker: b
    text: Ou “judeanos”. O termo grego pode se referir tanto aos judeus em geral quanto aos habitantes da Judeia; aqui, “judeus” se ajusta melhor à acusação étnico-religiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: Depois de levá-los
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; a formulação é natural em português e preserva essa sequência.
- source_word: στρατηγοῖς
  choice: autoridades da cidade
  rationale: Em Filipos, colônia romana, o termo designa os principais magistrados civis. A expressão comunica claramente a função sem impor ao texto um título romano técnico.
- source_word: ἐκταράσσουσιν
  choice: estão causando tumulto
  rationale: O verbo exprime forte perturbação ou agitação; esta tradução preserva a gravidade e o aspecto presente da acusação.
- source_word: ἡμῶν τὴν πόλιν
  choice: nossa cidade
  rationale: Reproduz de modo natural o possessivo enfático e a retórica cívica dos acusadores.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: Neste contexto da diáspora, o termo provavelmente indica a identidade étnico-religiosa de Paulo e Silas, contraposta à identidade cívica romana local.
- source_word: ὑπάρχοντες
  choice: são
  rationale: A oração coordenada com ponto e vírgula transmite de forma natural a circunstância ou fundamento alegado pelos acusadores, sem explicitar uma relação causal além do grego.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Estes homens
  rationale: O masculino plural refere-se especificamente a Paulo e Silas; a tradução é precisa e corrente.
theological_decisions:
- issue: Tradução de Ἰουδαῖοι numa acusação étnico-religiosa hostil
  choice: judeus
  alternative: judeanos
  rationale: “Judeus” corresponde melhor ao sentido étnico-religioso provável em Filipos. A fala pertence aos acusadores e não constitui um juízo do narrador sobre os judeus em geral.
- issue: Relação de ὑπάρχοντες com a acusação principal
  choice: 'preservar uma ligação circunstancial compacta: “; são judeus”'
  alternative: 'explicitar causalidade: “porque são judeus”'
  rationale: O particípio pode sugerir a base preconceituosa da acusação, mas não contém por si só uma conjunção causal explícita; a tradução mantém a tensão sem resolvê-la indevidamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Autoridades da cidade” evita o tecnicismo pouco transparente de “pretores”, apresentado na nota. O ponto e vírgula conserva a ligação abrupta entre a alegação de tumulto e a identidade judaica, sem acrescentar um “porque” interpretativo.
