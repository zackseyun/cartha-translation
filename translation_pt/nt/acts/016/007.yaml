  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: pt
  text: Mas, quando chegaram à região da Mísia[a], tentavam entrar na Bitínia, e o Espírito de Jesus não lhes permitiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto da Mísia” ou “ao longo da Mísia”. A expressão grega provavelmente se refere à chegada à região fronteiriça da Mísia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: quando chegaram
  rationale: O particípio aoristo tem valor temporal no contexto e indica a etapa anterior da sequência narrativa.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao deslocamento narrado anteriormente.
- source_word: κατὰ τὴν Μυσίαν
  choice: à região da Mísia
  rationale: κατά com acusativo, nesta descrição geográfica, provavelmente indica que chegaram à área ou fronteira junto da Mísia. A formulação evita afirmar com excessiva precisão que entraram plenamente na província.
- source_word: ἐπείραζον
  choice: tentavam
  rationale: O imperfeito retrata uma tentativa em andamento, expressa de modo natural em português.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: entrar na Bitínia
  rationale: εἰς indica movimento para dentro da região, e πορεύομαι comunica deslocamento ou viagem.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: não lhes permitiu
  rationale: ἐάω significa permitir ou deixar; a tradução preserva a negação sem intensificá-la como uma proibição explícita.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: o Espírito de Jesus
  rationale: Mantém a expressão cristológica incomum e explícita do grego, sem harmonizá-la com 'Espírito Santo'.
theological_decisions:
- issue: Tradução de τὸ πνεῦμα Ἰησοῦ
  choice: o Espírito de Jesus
  alternative: o Espírito Santo
  rationale: O texto grego especifica 'de Jesus'. Preservar essa formulação mantém a textura cristológica do versículo sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. 'Mísia' e 'Bitínia' seguem as formas geográficas consagradas. A repetição de 'mas... porém' reflete as duas articulações do grego (δὲ... καί) e torna clara a oposição entre a tentativa e o impedimento.
