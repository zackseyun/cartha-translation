id: ACT.16.23
reference: Acts 16:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: pt
  text: Depois de lhes darem muitos golpes[a], lançaram-nos na prisão[b] e ordenaram ao carcereiro que os mantivesse sob rigorosa vigilância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitas chicotadas” ou “muitas pancadas”. O grego fala de numerosos golpes infligidos, sem especificar aqui o instrumento usado.
    reason: lexical_alternative
  - marker: b
    text: Ou “no cárcere”. O termo grego pode designar, de modo geral, um lugar de confinamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: muitos golpes
  rationale: Expressa o grande número de golpes infligidos sem especificar o instrumento nem transformar o termo em referência exclusiva às feridas resultantes.
- source_word: τε
  choice: e
  rationale: Representa de modo natural o valor conectivo da partícula no fluxo da narrativa.
- source_word: ἐπιθέντες
  choice: Depois de lhes darem
  rationale: Com πληγάς, o verbo forma uma expressão idiomática de aplicação de golpes; a construção temporal explicita naturalmente a relação do particípio com o verbo principal.
- source_word: ἔβαλον εἰς φυλακήν
  choice: lançaram-nos na prisão
  rationale: Preserva a força de βάλλω, que sugere uma ação enérgica, e traduz φυλακή como o lugar de confinamento.
- source_word: φυλακήν
  choice: prisão
  rationale: É o termo moderno mais claro e geral para o local de confinamento sob a responsabilidade de um carcereiro.
- source_word: παραγγείλαντες
  choice: ordenaram
  rationale: Comunica a autoridade da instrução dada ao carcereiro e coordena naturalmente a ação com o encarceramento.
- source_word: δεσμοφύλακι
  choice: ao carcereiro
  rationale: Designa de forma concisa e corrente o responsável oficial pela custódia dos presos.
- source_word: ἀσφαλῶς τηρεῖν
  choice: que os mantivesse sob rigorosa vigilância
  rationale: Comunica o sentido custodial de guardá-los de modo seguro, isto é, impedindo sua fuga, e evita a possível leitura de que se tratava de preservar o bem-estar deles.
- source_word: αὐτούς
  choice: os
  rationale: Retoma Paulo e Silas como aqueles que deveriam permanecer sob custódia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lançaram-nos” conserva a vivacidade do original sem soar excessivamente arcaico; “sob rigorosa vigilância” torna claro o sentido de custódia segura.
