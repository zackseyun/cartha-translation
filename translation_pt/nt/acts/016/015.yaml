  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: pt
  text: 'Depois que ela e os de sua casa foram batizados, ela insistiu conosco: “Se vocês me consideram fiel ao Senhor[a], entrem em minha casa e fiquem hospedados.” E ela tanto insistiu conosco que nos convenceu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma crente no Senhor”. O adjetivo grego pode significar “fiel”, “digna de confiança” ou “crente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: Depois que ela e os de sua casa foram batizados
  rationale: Expressa naturalmente a relação temporal e estende o passivo singular a Lídia e ao grupo de sua casa. “Os de sua casa” comunica o sentido social de οἶκος sem confundi-lo com o edifício mencionado depois.
- source_word: παρεκάλεσεν
  choice: ela insistiu conosco
  rationale: O verbo pode indicar pedido, convite ou exortação; o contexto e a insistência posterior favorecem uma formulação mais forte que simplesmente “pediu”.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Se vocês me consideram fiel ao Senhor
  rationale: O perfeito κεκρίκατε aponta para uma avaliação já formada, enquanto πιστή conserva a possível nuance de fidelidade, confiabilidade ou fé.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: entrem em minha casa e fiquem hospedados
  rationale: Converte o particípio em ação coordenada natural em português e explicita pelo contexto que μένω se refere a permanecer como hóspede.
- source_word: παρεβιάσατο ἡμᾶς
  choice: nos convenceu a aceitar
  rationale: Comunica que a insistência dela venceu a resistência do grupo, sem sugerir coerção física.
theological_decisions:
- issue: Possíveis inferências denominacionais a partir do batismo dos de sua casa
  choice: Relatar que Lídia e os de sua casa foram batizados sem definir idade nem condição individual dos integrantes
  alternative: Formular o texto de modo que implique batismo infantil ou somente batismo de pessoas que fizeram profissão pessoal de fé
  rationale: O versículo não descreve a composição da casa nem transforma o episódio em argumento sacramental.
- issue: Sentido de πιστή na fala de Lídia
  choice: fiel ao Senhor
  alternative: crente no Senhor; digna de confiança diante do Senhor
  rationale: “Fiel” mantém aberta a tensão semântica entre fé, lealdade e confiabilidade; a nota registra a principal alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil. “Vocês” evita uma forma regional marcada; “fiquem hospedados” torna natural o sentido de permanência na casa. A distinção entre “os de sua casa” e “minha casa” preserva os sentidos social e físico de οἶκος no contexto.
