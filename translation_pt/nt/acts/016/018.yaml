  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: pt
  text: 'E ela continuou fazendo isso durante muitos dias. Mas Paulo, muito perturbado, voltou-se para o espírito e disse: “Eu lhe ordeno, em nome de Jesus, o Messias,[a] que saia dela.” E ele saiu naquela mesma hora.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O termo grego traduzido como “Messias” é Χριστός, título que também costuma ser transliterado como “Cristo”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o espírito saiu imediatamente; literalmente, “naquela mesma hora”.
    reason: idiom_clarification
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: continuou fazendo isso durante muitos dias
  rationale: O imperfeito ἐποίει apresenta uma ação repetida ou contínua no passado; a formulação portuguesa comunica naturalmente essa persistência.
- source_word: διαπονηθεὶς
  choice: profundamente incomodado
  rationale: O particípio indica forte perturbação, aflição ou desgaste, mais intenso que um incômodo leve, sem exigir que se especifique ira.
- source_word: ἐπιστρέψας
  choice: voltou-se
  rationale: Representa de modo conciso a reorientação física de Paulo antes de falar.
- source_word: τῷ πνεύματι
  choice: para o espírito
  rationale: Preserva o substantivo não qualificado do grego, sem acrescentar 'mau' ou substituí-lo por 'demônio'; o contexto identifica o referente.
- source_word: Παραγγέλλω σοι
  choice: Eu lhe ordeno
  rationale: Expressa em português atual a ordem autoritativa dirigida ao espírito.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: em nome de Jesus, o Messias
  rationale: Mantém Χριστός como título e emprega uma construção portuguesa idiomática que evita tratá-lo como sobrenome.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: que saia dela
  rationale: Construção natural em português para uma ordem de expulsão, transmitindo corretamente o infinitivo dependente de παραγγέλλω.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: ele saiu naquela mesma hora
  rationale: Retoma gramaticalmente 'o espírito' e preserva a expressão temporal enfática, que comunica cumprimento imediato.
theological_decisions:
- issue: Tradução de Χριστοῦ na fórmula de autoridade
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Aqui Χριστός conserva claramente valor titular. 'O Messias' torna esse valor transparente sem alterar a identidade invocada.
- issue: Qualificação do espírito
  choice: o espírito
  alternative: o espírito mau / o demônio
  rationale: O versículo usa πνεῦμα sem qualificativo. A tradução preserva essa forma, deixando que o contexto anterior indique a natureza do espírito.
- issue: Referente do sujeito implícito em ἐξῆλθεν
  choice: ele saiu
  alternative: o espírito saiu / saiu
  rationale: Em português, o pronome masculino retoma naturalmente 'o espírito', sem repetir ou ampliar o texto; a nota esclarece a referência e o valor temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a progressão narrativa do grego; 'lhe ordeno' evita ambiguidade de tratamento, e 'Jesus, o Messias' explicita de forma natural o caráter titular de Χριστός.
