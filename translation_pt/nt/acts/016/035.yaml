source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: pt
  text: 'Quando amanheceu, os magistrados enviaram os portadores de varas[a], dizendo: “Solte aqueles homens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lictores”, assistentes oficiais dos magistrados romanos que levavam varas como símbolos de autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Quando amanheceu
  rationale: A construção genitiva absoluta marca uma transição temporal. “Quando amanheceu” é natural em português e preserva o sentido de chegada do dia; a continuidade narrativa de δέ fica adequadamente expressa pela sequência do relato.
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: Equivalente direto e idiomático do aoristo de ἀποστέλλω neste contexto.
- source_word: οἱ στρατηγοὶ
  choice: os magistrados
  rationale: No contexto colonial romano de Filipos, designa autoridades civis, não generais no sentido militar comum. “Magistrados” comunica a função com precisão e clareza.
- source_word: τοὺς ῥαβδούχους
  choice: os portadores de varas
  rationale: Preserva a imagem concreta do termo grego, que designa os assistentes oficiais dos magistrados romanos. A designação histórica “lictores” é registrada em nota.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém de modo direto o particípio que introduz o conteúdo da mensagem.
- source_word: Ἀπόλυσον
  choice: Solte
  rationale: O imperativo singular dirige ao carcereiro a ordem de libertar os presos. “Solte” é corrente e claro em português, sem perder o sentido custodial.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: aqueles homens
  rationale: A expressão se refere especificamente a Paulo e Silas; “homens” é contextualmente preciso, e o demonstrativo preserva o valor de ἐκείνους.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A tradução mantém a terminologia cívica romana sem recorrer no texto principal ao termo técnico menos conhecido “lictores”.
