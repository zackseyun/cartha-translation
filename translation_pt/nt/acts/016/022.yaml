id: ACT.16.22
reference: Acts 16:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: pt
  text: E a multidão se levantou unida contra eles[a]. Então os magistrados, depois de lhes arrancarem as roupas, mandavam espancá-los com varas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se juntou para atacá-los”. O verbo grego enfatiza a ação hostil coletiva da multidão.'
    reason: lexical_alternative
  - marker: b
    text: Os “magistrados” eram as autoridades civis romanas de Filipos; mais tecnicamente, os “pretores”.
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: se levantou unida contra
  rationale: Expressa tanto a ação coletiva quanto a hostilidade da multidão, em português natural, sem afirmar além do texto que ela chegou a agredi-los fisicamente.
- source_word: ὄχλος
  choice: multidão
  rationale: Equivalente corrente e neutro; evita a carga interpretativa adicional de “turba”.
- source_word: κατ’ αὐτῶν
  choice: contra eles
  rationale: Reproduz o sentido hostil de κατά com o genitivo neste contexto.
- source_word: στρατηγοὶ
  choice: magistrados
  rationale: Designa com clareza as autoridades civis da colônia romana de Filipos, sem recorrer no texto principal ao termo técnico “pretores”.
- source_word: περιρήξαντες
  choice: depois de lhes arrancarem
  rationale: O particípio aoristo indica ação anterior à ordem; “arrancarem” preserva a força do verbo, que descreve rasgar ou retirar violentamente as roupas.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: as roupas
  rationale: Refere-se às roupas de Paulo e Silas; o pronome “lhes” deixa claro que foram arrancadas deles. “Roupas” é atual e amplamente compreensível.
- source_word: ἐκέλευον
  choice: mandavam
  rationale: O imperfeito é preservado por uma forma verbal que apresenta a ordem no desenrolar da cena.
- source_word: ῥαβδίζειν
  choice: espancá-los com varas
  rationale: Torna explícito o instrumento indicado pelo verbo e comunica a severidade do castigo corporal romano.
