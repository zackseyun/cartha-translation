  source_fidelity: 'O texto traduz adequadamente todos os elementos relevantes: a ação coletiva e hostil da multidão (συνεπέστη ... κατ’ αὐτῶν), os στρατηγοί como “magistrados”, a ação antecedente de arrancar-lhes as roupas (περιρήξαντες αὐτῶν τὰ ἱμάτια), o aspecto em curso do imperfeito ἐκέλευον (“mandavam”) e o castigo específico com varas (ῥαβδίζειν). “Espancá-los com varas” comunica corretamente o método de punição sem trocar as varas por chicotes.'
