  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: pt
  text: Depois de saírem da prisão, foram à casa de Lídia e, ao verem os irmãos[a], os encorajaram e partiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”. A palavra grega está no masculino plural, mas pode referir-se a um grupo misto de cristãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Depois de saírem da prisão
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a oração temporal expressa com naturalidade a sequência narrativa. O artigo aponta para a prisão específica do contexto.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: foram até Lídia
  rationale: A construção indica que foram encontrar-se com Lídia. Esta formulação é natural em português e evita acrescentar explicitamente “casa”, termo não presente no texto grego.
- source_word: ἰδόντες
  choice: ao verem
  rationale: O particípio aoristo é vertido como oração temporal concisa, preservando a relação com a ação seguinte.
- source_word: παρεκάλεσαν
  choice: os encorajaram
  rationale: παρακαλέω pode significar encorajar, exortar ou consolar. “Encorajaram” preserva aqui o sentido pastoral amplo sem restringi-lo indevidamente.
- source_word: τοὺς ἀδελφούς
  choice: os irmãos
  rationale: Mantém a forma masculina plural da expressão grega, que neste uso pode designar coletivamente os cristãos, inclusive um grupo misto; essa possibilidade é esclarecida em nota.
- source_word: ἐξῆλθαν
  choice: partiram
  rationale: No encerramento da cena, o verbo indica que foram embora. “Partiram” evita repetição com “saírem” e mantém o movimento narrativo.
theological_decisions:
- issue: Alcance de τοὺς ἀδελφούς em uma reunião cristã possivelmente mista
  choice: os irmãos
  alternative: os irmãos e as irmãs; os crentes
  rationale: A tradução principal conserva a forma masculina plural do grego, enquanto a nota registra seu possível sentido inclusivo sem decidir além do que a expressão exige.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A formulação segue de perto o grego sem tornar explícita a casa de Lídia, que está apenas implícita no contexto.
