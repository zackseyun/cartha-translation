source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: pt
  text: Ele também chegou a Derbe e a Listra. E eis que estava ali[b] certo discípulo chamado Timóteo, filho de uma mulher judia crente[a], mas de pai grego,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mulher judia fiel”. O adjetivo grego pode significar tanto “crente” como “fiel”, embora, em Atos, o sentido “crente” seja mais provável aqui.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “havia ali certo discípulo”.'
    reason: previous_rendering
lexical_decisions:
- source_word: Κατήντησεν
  choice: chegou
  rationale: No relato de viagem, o verbo indica chegar a um lugar. “Chegou” é natural e não acrescenta uma ideia de progressão além do que está expresso.
- source_word: δὲ καὶ
  choice: também
  rationale: Expressa a continuidade narrativa e o valor aditivo da combinação, sem reproduzir mecanicamente os conectivos gregos.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: a Derbe e a Listra
  rationale: A preposição indica destino. A repetição de “a” acompanha a preposição repetida no grego e mantém o ritmo do itinerário.
- source_word: καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama a atenção para a apresentação de Timóteo, mantendo a vivacidade narrativa.
- source_word: μαθητής τις
  choice: certo discípulo
  rationale: “Certo” conserva a indefinição de τις ao apresentar uma pessoa específica ainda não mencionada; “discípulo” é o equivalente usual de μαθητής em Atos.
- source_word: ἦν ἐκεῖ
  choice: estava ali
  rationale: Expressa de modo natural em português a presença de Timóteo naquele local e evita a redundância de uma construção existencial seguida de outro elemento locativo.
- source_word: ὀνόματι Τιμόθεος
  choice: chamado Timóteo
  rationale: É a forma idiomática e clara de traduzir a construção grega com ὀνόματι.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: filho de uma mulher judia crente
  rationale: Mantém os dois qualificadores ligados à mãe e entende πιστή, neste contexto de Atos, principalmente como alguém que crê.
- source_word: πιστῆς
  choice: crente
  rationale: Em Atos, o adjetivo frequentemente identifica alguém que abraçou a fé. A possibilidade lexical de “fiel” é preservada em nota.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: mas de pai grego
  rationale: Reproduz com concisão a construção elíptica e o contraste introduzido por δέ, em português natural.
- source_word: Ἕλληνος
  choice: grego
  rationale: Designa aqui um homem grego em sentido étnico-cultural; “gentio” seria uma categoria mais ampla e menos direta.
theological_decisions:
- issue: Sentido de πιστῆς ao descrever a mãe de Timóteo
  choice: mulher judia crente
  alternative: mulher judia fiel
  rationale: O uso de πιστός em Atos e o contexto cristão favorecem o sentido de alguém que crê, sem eliminar a possibilidade lexical de “fiel”, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a saliência narrativa do original sem excessiva arcaização. A vírgula final foi mantida porque o versículo termina com uma construção que prossegue no contexto seguinte.
