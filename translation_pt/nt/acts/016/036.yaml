base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: pt
  text: 'Então o carcereiro transmitiu estas palavras a Paulo: “Os magistrados mandaram que vocês fossem soltos[a]. Agora, pois, saiam e vão em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os magistrados enviaram uma ordem para que vocês fossem soltos”. O grego não explicita o que os magistrados enviaram; pelo contexto, trata-se de uma mensagem ou ordem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: transmitiu
  rationale: Expressa o ato de comunicar a Paulo uma mensagem oficial recebida, com naturalidade em português.
- source_word: ὁ δεσμοφύλαξ
  choice: o carcereiro
  rationale: Designa especificamente o responsável pela prisão neste contexto.
- source_word: τοὺς λόγους τούτους
  choice: estas palavras
  rationale: Preserva de perto a formulação grega sem deixar de ser compreensível em português.
- source_word: Ἀπέσταλκαν
  choice: mandaram
  rationale: No contexto, o verbo absoluto indica que os magistrados enviaram uma ordem ou mensagem; “mandaram que” comunica naturalmente esse sentido em português.
- source_word: οἱ στρατηγοὶ
  choice: os magistrados
  rationale: Refere-se às autoridades cívicas da colônia romana de Filipos; “magistrados” é claro e historicamente adequado.
- source_word: ἵνα ἀπολυθῆτε
  choice: que vocês fossem soltos
  rationale: A voz passiva indica a libertação da custódia, e o plural “vocês” preserva o número do verbo grego.
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Mantém tanto o valor temporal de νῦν quanto a inferência marcada por οὖν.
- source_word: ἐξελθόντες πορεύεσθε
  choice: saiam e vão
  rationale: Converte naturalmente a sequência formada pelo particípio e pelo imperativo em duas ações coordenadas, preservando sua ordem.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Equivalente idiomático tradicional e natural, que pode envolver tranquilidade e segurança.
theological_decisions: []
