  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: pt
  text: 'Mas Paulo gritou em alta voz: “Não faça nenhum mal a si mesmo, pois estamos todos aqui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: gritou
  rationale: O aoristo de φωνέω descreve aqui uma fala forte e urgente; “gritou” comunica naturalmente essa intensidade.
- source_word: δὲ
  choice: Mas
  rationale: δέ assinala o contraste com a ação que o carcereiro estava prestes a praticar.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressa de modo natural o valor de maneira do dativo e conserva a referência concreta ao volume da voz.
- source_word: λέγων
  choice: ':'
  rationale: Em português, os dois-pontos introduzem diretamente e com naturalidade o conteúdo do grito, sem exigir a reprodução mecânica do particípio grego.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Não faça nenhum mal a si mesmo
  rationale: Preserva a amplitude de μηδὲν...κακόν e a força reflexiva de σεαυτῷ, enquanto o contexto deixa claro que Paulo procura impedir que o carcereiro se fira.
- source_word: ἅπαντες
  choice: todos
  rationale: Mantém a ênfase na totalidade das pessoas presentes.
- source_word: γάρ
  choice: pois
  rationale: Introduz com clareza a razão para o carcereiro não fazer mal a si mesmo.
- source_word: ἐσμεν ἐνθάδε
  choice: estamos todos aqui
  rationale: “Aqui” é o equivalente português mais direto de ἐνθάδε, e a construção resulta natural.
- source_word: ὁ Παῦλος
  choice: Paulo
  rationale: Emprega a forma tradicional e corrente do nome em português.
