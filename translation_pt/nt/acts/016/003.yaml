  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: pt
  text: Paulo quis que ele viajasse com ele[a]. Então o tomou consigo e o circuncidou por causa dos judeus que estavam naquelas regiões[b], pois todos sabiam que seu pai era grego[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “saísse com ele”; a expressão pode se referir a partir em viagem.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “por consideração aos judeus” ou “em razão dos judeus”.
    reason: lexical_alternative
  - marker: c
    text: Grego “grego”; neste contexto, a designação provavelmente destaca que o pai de Timóteo não era judeu.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: ele
  rationale: O demonstrativo acusativo retoma Timóteo, mencionado no contexto anterior. Em português, o pronome evita uma ênfase artificial como “este homem”.
- source_word: ἠθέλησεν
  choice: quis
  rationale: Expressa de modo natural a vontade ou intenção de Paulo, sem intensificá-la.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: que ele viajasse com ele
  rationale: O infinitivo significa literalmente “sair”, mas neste contexto funciona como expressão de partir em viagem. A formulação escolhida comunica com clareza o sentido contextual, enquanto a nota preserva a imagem verbal.
- source_word: λαβὼν
  choice: o tomou consigo
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à circuncisão. “Tomou consigo” mantém o valor concreto do verbo sem tornar a frase excessivamente rígida.
- source_word: περιέτεμεν
  choice: o circuncidou
  rationale: Tradução direta e corrente de περιτέμνω, sem eufemismo.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: por causa dos judeus
  rationale: διά com acusativo indica aqui motivo ou razão. “Por causa de” preserva essa amplitude sem especificar se a ação foi apenas em benefício deles ou para evitar objeções.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: que estavam naquelas regiões
  rationale: Identifica os judeus locais. “Regiões” é mais natural em português neste contexto geográfico do que o formal “lugares”.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: pois todos sabiam
  rationale: “Pois” preserva a função explicativa de γάρ, e “todos” mantém a abrangência enfática de ἅπαντες.
- source_word: Ἕλλην
  choice: grego
  rationale: Mantém a designação étnica e cultural explícita, sem substituí-la interpretativamente por “gentio” ou “não judeu”.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: seu pai era
  rationale: A forma simples e idiomática em português transmite o sentido de ὑπάρχω neste contexto sem acrescentar uma nuance circunstancial desnecessária.
theological_decisions:
- issue: Motivo da circuncisão de Timóteo em relação aos judeus locais
  choice: A ação é apresentada como motivada pela presença dos judeus locais e pelo conhecimento que tinham da origem paterna de Timóteo.
  alternative: Entender o ato como afirmação de que a circuncisão era necessária para a salvação ou, no extremo oposto, qualificá-lo explicitamente como mera estratégia missionária.
  rationale: O texto declara o motivo imediato, mas não formula uma conclusão doutrinária abrangente. A tradução preserva essa explicação narrativa e a tensão com outras passagens, sem resolver o tema além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe foi dividida em duas frases para evitar um período excessivamente longo, sem alterar a sequência narrativa ou a relação causal do grego.
