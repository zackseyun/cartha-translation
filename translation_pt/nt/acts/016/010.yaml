id: ACT.16.10
reference: Acts 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: pt
  text: Depois que ele teve a visão, imediatamente procuramos partir para a Macedônia, concluindo que Deus nos havia chamado para anunciar-lhes as boas-novas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Depois que
  rationale: 'Introduz a sequência temporal de modo natural: a visão antecede a ação do grupo.'
- source_word: τὸ ὅραμα
  choice: a visão
  rationale: Equivalente corrente e preciso para uma experiência visual reveladora.
- source_word: εἶδεν
  choice: ele teve
  rationale: Em português, 'ter uma visão' é idiomático e mantém o sentido de ver a visão sem formulação artificial.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva de forma clara a prontidão expressa pelo advérbio.
- source_word: ἐζητήσαμεν
  choice: procuramos
  rationale: Mantém a ideia de empenhar-se ou buscar fazer algo, sem reduzir o verbo a mera tentativa frustrada.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: partir para a Macedônia
  rationale: Expressa naturalmente em português o movimento de saída rumo ao destino; a formulação literal 'sair para dentro da Macedônia' seria inadequada.
- source_word: συμβιβάζοντες
  choice: concluindo
  rationale: Comunica o processo de reunir os indícios da visão e chegar a uma conclusão.
- source_word: προσκέκληται
  choice: havia chamado
  rationale: O mais-que-perfeito composto situa o chamado divino antes da conclusão narrativa e preserva a força de chamar ou convocar.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta do sujeito definido.
- source_word: εὐαγγελίσασθαι
  choice: anunciar as boas-novas
  rationale: Reproduz de modo acessível a ação verbal de comunicar a boa notícia, sem restringi-la necessariamente à pregação formal.
- source_word: αὐτούς
  choice: lhes
  rationale: Pronome indireto natural com 'anunciar', retomando as pessoas da Macedônia.
theological_decisions:
- issue: Mudança narrativa para a primeira pessoa do plural
  choice: Preservar explicitamente 'procuramos' e 'nos'.
  alternative: Parafrasear de modo impessoal ou evitar implicações sobre a presença do narrador.
  rationale: O grego muda expressamente para a primeira pessoa do plural; a tradução conserva esse dado sem adotar uma teoria específica de autoria.
- issue: Iniciativa divina em προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Deus nos havia chamado
  alternative: Deus estava nos guiando ou Deus nos havia convidado
  rationale: O verbo denota chamar ou convocar; 'chamado' mantém a iniciativa divina e não enfraquece nem amplia a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão do grego sem literalismo artificial. Não são necessárias notas, pois as alternativas lexicais relevantes podem ser representadas adequadamente no texto principal.
