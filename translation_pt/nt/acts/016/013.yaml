  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: pt
  text: No sábado, saímos pelo portão, para junto do rio, onde pensávamos haver um lugar de oração.[a] Depois de nos sentarmos, falávamos com as mulheres que ali se haviam reunido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «onde pensávamos que haveria oração». A palavra grega pode indicar tanto a oração em si como um lugar reservado para orar; neste contexto, o sentido de «lugar de oração» parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: No sábado
  rationale: A expressão é uma forma idiomática do grego coiné para o dia de sábado; a tradução natural evita o literalismo obscuro «no dia dos sábados».
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: saímos para fora da porta da cidade
  rationale: Preserva a ênfase espacial de ἐξήλθομεν ἔξω. «Da cidade» explicita com naturalidade o referente implícito de «porta», sem identificar uma porta específica.
- source_word: παρὰ ποταμόν
  choice: fomos até a margem do rio
  rationale: παρά com acusativo indica movimento para junto do rio. A formulação explicita o movimento já contido no verbo e soa natural em português.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: onde pensávamos haver um lugar de oração
  rationale: νομίζω expressa suposição, e προσευχή pode designar tanto oração quanto um local destinado à oração. O contexto de busca por um ponto de reunião favorece o sentido locativo.
- source_word: καὶ καθίσαντες
  choice: Depois de nos sentarmos
  rationale: O particípio aoristo apresenta normalmente uma ação anterior à do verbo principal, aqui vertida como sequência temporal clara.
- source_word: ἐλαλοῦμεν
  choice: começamos a falar
  rationale: O imperfeito retrata a fala em andamento; em português narrativo, «começamos a falar» introduz naturalmente essa atividade, embora não torne explícita toda a duração aspectual.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: às mulheres que ali se haviam reunido
  rationale: O particípio aoristo indica que as mulheres já tinham se reunido antes da conversa; «ali» retoma naturalmente o local mencionado.
theological_decisions:
- issue: Sentido de προσευχή neste cenário
  choice: lugar de oração
  alternative: oração; sinagoga
  rationale: O contexto junto ao rio e a reunião das mulheres favorecem o sentido de local destinado à oração. «Sinagoga» seria uma identificação institucional além do que o termo grego afirma, enquanto a nota conserva a possibilidade lexical abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para expressar com naturalidade o movimento para fora da porta e até a margem do rio. O marcador [a] aparece imediatamente após a expressão explicada.
