  terminology: “Irmãos” preserva adequadamente ἀδελφῶν e o vocabulário familiar cristão. “Listra” e “Icônio” são formas portuguesas estabelecidas. A nota deve esclarecer a possível abrangência inclusiva sem chamar os membros da comunidade de “demais fiéis”, expressão que pode sugerir um contraste ausente do texto.
