  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: pt
  text: Ele recebia bom testemunho dos irmãos em Listra e Icônio[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”, referindo-se aos fiéis dessas localidades.
    reason: Alternativa lexical que explicita o possível sentido inclusivo de ἀδελφῶν.
lexical_decisions:
- source_word: ὃς
  choice: Ele
  rationale: O pronome relativo retoma Timóteo, mencionado no versículo anterior. Em português, uma nova oração com “Ele” é natural e clara neste contexto.
- source_word: ἐμαρτυρεῖτο
  choice: era bem-conceituado
  rationale: O imperfeito passivo de μαρτυρέω indica que Timóteo recebia testemunho favorável e gozava de boa reputação. “Era bem-conceituado” expressa esse sentido de modo corrente e digno.
- source_word: ὑπὸ
  choice: entre
  rationale: Embora ὑπό com genitivo marque literalmente o agente (“pelos”), em português a expressão idiomática “bem-conceituado entre” comunica naturalmente tanto a reputação quanto o grupo que dava testemunho favorável.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: de Listra e Icônio
  rationale: A construção identifica os irmãos situados nessas duas cidades. Depois de “entre os irmãos”, “de Listra e Icônio” é conciso e natural.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego e o vocabulário cristão de parentesco, sem excluir a possibilidade de referência coletiva aos fiéis de ambos os sexos, esclarecida em nota.
theological_decisions:
- issue: Sentido de ἀδελφῶν aplicado à comunidade cristã
  choice: irmãos
  alternative: irmãos e irmãs; fiéis
  rationale: A tradução principal conserva a forma masculina plural e a metáfora familiar do original. A nota registra que, no uso cristão, o termo pode abranger homens e mulheres da comunidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bem-conceituado” evita a rigidez de “recebia bom testemunho”, preservando a ideia de reputação favorável contínua expressa pelo imperfeito.
