base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: pt
  text: De repente, houve um grande terremoto, de modo que os alicerces da prisão foram abalados. Imediatamente, todas as portas se abriram, e as correntes de todos se soltaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os grilhões de todos foram afrouxados”. O termo grego pode designar correntes, grilhões ou outros meios de contenção; o verbo também pode ser traduzido como “foram afrouxados” ou “foram soltos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: De repente
  rationale: Expressa de modo natural a ocorrência abrupta indicada pelo advérbio grego.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: houve um grande terremoto
  rationale: Reproduz idiomaticamente a construção com γίνομαι e preserva μέγας sem especificá-lo como intensidade ou gravidade.
- source_word: ὥστε σαλευθῆναι
  choice: de modo que ... foram abalados
  rationale: Apresenta o resultado introduzido por ὥστε e mantém o sentido passivo de σαλευθῆναι.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: os alicerces da prisão
  rationale: “Alicerces” é concreto e corrente para os elementos estruturais fundamentais; “prisão” é a designação ampla e natural do lugar de confinamento.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: todas as portas se abriram
  rationale: O passivo grego pode ser expresso naturalmente pelo valor passivo/resultativo da construção pronominal portuguesa, sem indicar no texto quem as abriu.
- source_word: παραχρῆμα
  choice: Imediatamente
  rationale: Comunica que o acontecimento ocorreu naquele mesmo instante, em registro narrativo claro e digno.
- source_word: πάντων
  choice: de todos
  rationale: Preserva a referência abrangente a todas as pessoas presas, sem explicitar “prisioneiros”, termo apenas implícito no contexto.
- source_word: τὰ δεσμὰ ... ἀνέθη
  choice: as correntes ... se soltaram
  rationale: “Correntes” concretiza adequadamente os instrumentos de contenção no contexto; “se soltaram” preserva o resultado de ἀνίημι sem afirmar mais do que o texto.
