  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: pt
  text: e proclamam costumes que não nos é permitido aceitar nem praticar, pois somos romanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sendo romanos” ou “como romanos”. A expressão participial grega apresenta o fato de serem romanos como a razão alegada para rejeitar esses costumes.'
    reason: alternativa lexical e esclarecimento sintático
lexical_decisions:
- source_word: καὶ καταγγέλλουσιν
  choice: e proclamam
  rationale: Mantém o conectivo e traduz o verbo como anúncio público, sem acrescentar a ideia mais interpretativa de defesa ou ensino formal.
- source_word: ἔθη
  choice: costumes
  rationale: Designa costumes ou práticas estabelecidas e se ajusta ao teor cívico da acusação.
- source_word: οὐκ ἔξεστιν ἡμῖν
  choice: não podemos legalmente
  rationale: Expressa a alegada falta de permissão legal em português natural, preservando o tom jurídico sem confirmar que a acusação era juridicamente correta.
- source_word: παραδέχεσθαι
  choice: aceitar
  rationale: Abrange receber ou admitir esses costumes como válidos, sem restringir o sentido a uma adoção formal.
- source_word: οὐδὲ ποιεῖν
  choice: nem praticar
  rationale: Com 'costumes', ποιεῖν tem naturalmente o sentido de pôr em prática ou observar.
- source_word: Ῥωμαίοις οὖσιν
  choice: sendo romanos
  rationale: Preserva de modo conciso a construção participial grega e sua relação circunstancial, sem eliminar sua possível nuance causal.
theological_decisions:
- issue: Natureza da proibição alegada
  choice: Manter a formulação jurídico-cívica como parte da acusação, sem endossá-la.
  alternative: Traduzir de forma mais vaga como 'não é certo para nós'.
  rationale: O narrador relata o argumento dos acusadores; o texto não afirma por si mesmo que tal proibição correspondia corretamente ao direito romano.
- issue: Relação de Ῥωμαίοις οὖσιν com a proibição
  choice: Traduzir literalmente como 'sendo romanos' e explicar a provável função causal em nota.
  alternative: 'Explicitar no texto: ''visto que somos romanos''.'
  rationale: A construção participial pode ser entendida causalmente, mas a forma escolhida conserva sua concisão e a leve ambiguidade circunstancial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem 'nós, sendo romanos' mantém o destaque retórico da cidadania romana; 'legalmente' conserva o teor jurídico da acusação.
