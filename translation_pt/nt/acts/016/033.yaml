source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: pt
  text: E, levando-os consigo naquela hora da noite, lavou-lhes as feridas; e foi batizado imediatamente, ele e todos os de sua casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, todos os que pertenciam à sua casa ou círculo doméstico. O versículo não especifica a idade dessas pessoas.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: levando-os consigo
  rationale: O particípio aoristo introduz uma ação anterior à lavagem. “Levando-os consigo” é natural em português e não especifica destino nem modo além do texto.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: naquela hora da noite
  rationale: Preserva a referência temporal vívida e ressalta que a resposta ocorreu ainda naquela mesma noite.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: lavou-lhes as feridas
  rationale: A construção indica que ele lavou Paulo e Silas em relação aos ferimentos. A formulação idiomática em português comunica isso sem reproduzir literalmente a preposição grega.
- source_word: ἐβαπτίσθη
  choice: foi batizado
  rationale: Mantém a voz passiva e emprega o termo corrente, sem determinar no texto principal um modo específico de batismo.
- source_word: οἱ αὐτοῦ πάντες
  choice: todos os seus
  rationale: A expressão abrange todas as pessoas pertencentes ao círculo doméstico do carcereiro e preserva a amplitude do grego sem restringi-la à família nuclear.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Expressa com clareza e dignidade a ação sem demora enfatizada pelo advérbio.
theological_decisions:
- issue: Alcance de οἱ αὐτοῦ πάντες em relação ao batismo
  choice: “todos os seus”, explicado em nota como todos os de sua casa
  alternative: “toda a sua família” ou “todos os de sua casa” no texto principal
  rationale: O versículo inclui no batismo o carcereiro e todos os pertencentes ao seu círculo doméstico, mas não informa idade, profissão individual de fé nem modo de batismo. A tradução evita decidir debates denominacionais posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa do grego é mantida, e “todos os seus” conserva a amplitude da expressão doméstica sem a restringir à família nuclear.
