  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: pt
  text: Então, depois de pedir luzes, ele irrompeu e, tremendo de medo, caiu diante de Paulo e Silas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão da narrativa, sem exigir contraste forte.
- source_word: αἰτήσας φῶτα
  choice: ele pediu luzes
  rationale: O particípio aoristo indica uma ação anterior à entrada; o plural genérico não especifica se eram lâmpadas ou tochas.
- source_word: εἰσεπήδησεν
  choice: entrou correndo
  rationale: Expressa de modo natural o movimento súbito e impetuoso para dentro, sem sugerir necessariamente um salto literal.
- source_word: ἔντρομος γενόμενος
  choice: tremendo de medo
  rationale: Reproduz em português idiomático tanto o temor quanto sua manifestação física, sentidos reunidos no adjetivo ἔντρομος.
- source_word: προσέπεσεν τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: prostrou-se diante de Paulo e Silas
  rationale: Comunica que o carcereiro caiu diante deles em temor e súplica, sem acrescentar a ideia de adoração.
theological_decisions:
- issue: Natureza do gesto do carcereiro diante de Paulo e Silas
  choice: prostrou-se diante de Paulo e Silas
  alternative: adorou Paulo e Silas; caiu diante de Paulo e Silas
  rationale: O verbo descreve cair diante de alguém em temor, súplica ou deferência, mas não exige que o gesto seja entendido como adoração. A formulação mantém essa abertura sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Luzes” preserva o plural genérico do grego; “entrou correndo” transmite a urgência de εἰσεπήδησεν. A posição da nota após os dois nomes evita separar indevidamente os complementos coordenados.
