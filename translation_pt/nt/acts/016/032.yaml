  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: pt
  text: E falaram a palavra do Senhor[a] a ele e, juntamente com ele, a todos os que estavam em sua casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mensagem acerca do Senhor”. A expressão grega também pode indicar a mensagem pertencente ao Senhor ou proveniente dele.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “junto com todos os de sua casa”. O termo grego pode referir-se tanto à casa quanto ao grupo doméstico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: anunciaram
  rationale: Neste contexto, λαλέω descreve a comunicação da mensagem cristã. “Anunciaram” é natural em português e expressa melhor do que o simples “falaram” que o conteúdo foi comunicado aos ouvintes, sem exigir a nuance pública e formal de “proclamaram”.
- source_word: αὐτῷ
  choice: a ele
  rationale: O dativo singular refere-se ao carcereiro e, com λαλέω, identifica naturalmente o destinatário da comunicação.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: λόγος refere-se aqui à mensagem anunciada. “A palavra” conserva a expressão característica do Novo Testamento e mantém transparente a construção com “do Senhor”.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: 'A forma preserva o genitivo grego e sua possível amplitude: palavra proveniente do Senhor, pertencente a ele ou acerca dele.'
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: bem como a todos os que estavam em sua casa
  rationale: Embora σύν signifique literalmente “com”, o contexto indica que todos os presentes também receberam a mensagem. “Bem como a todos” comunica isso com clareza e naturalidade em português, sem sugerir que apenas acompanharam o carcereiro.
- source_word: οἰκίᾳ
  choice: casa
  rationale: οἰκία pode designar a casa física ou o grupo doméstico. “Os que estavam em sua casa” conserva a imagem concreta e não presume que todos fossem necessariamente membros permanentes da família.
theological_decisions:
- issue: Sentido de “a palavra do Senhor”
  choice: Mantida a expressão “a palavra do Senhor”, sem definir a relação exata do genitivo.
  alternative: “a mensagem acerca do Senhor” ou “a mensagem vinda do Senhor”
  rationale: A construção grega pode indicar uma mensagem proveniente do Senhor, pertencente a ele ou a respeito dele. A tradução principal preserva essa ambiguidade legítima.
- issue: Destinatários da mensagem na casa
  choice: A frase é apresentada como dirigida ao carcereiro e também a todos os presentes em sua casa.
  alternative: “falaram a ele, junto com todos os que estavam em sua casa”
  rationale: A alternativa reproduz σύν mais formalmente, mas pode dar a impressão de que os demais apenas estavam presentes. O sentido contextual favorece que todos ouviram a mensagem como destinatários.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com escolha verbal natural para a comunicação do evangelho. A ordem foi ajustada para clareza: o carcereiro e todos os presentes são entendidos como destinatários. Todos os marcadores de nota aparecem no texto principal.'
