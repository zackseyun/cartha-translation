lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: comunicaram
  rationale: O aoristo indica que transmitiram oficialmente a informação; “comunicaram” é natural no contexto administrativo.
- source_word: στρατηγοῖς
  choice: magistrados
  rationale: Em Filipos, designa os principais dirigentes civis; “magistrados” equilibra precisão histórica e clareza.
- source_word: ῥαβδοῦχοι
  choice: portadores de varas
  rationale: Preserva a imagem concreta do termo grego para os assistentes oficiais, explicada em nota.
- source_word: τὰ ῥήματα ταῦτα
  choice: essas palavras
  rationale: Tradução direta que remete ao que havia acabado de ser dito.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Expressa naturalmente a reação desencadeada pela notícia, sem ampliar sua intensidade.
- source_word: ἀκούσαντες
  choice: ao saber
  rationale: Neste contexto, ouvir a informação equivale a tomar conhecimento dela; a formulação preserva a relação temporal e causal.
- source_word: Ῥωμαῖοί
  choice: romanos
  rationale: Mantém a forma explícita do grego, embora o contexto jurídico destaque a cidadania romana.
