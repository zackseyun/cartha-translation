source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: pt
  text: Depois de levá-los para cima, até sua casa, serviu-lhes uma refeição e alegrou-se muito com todos os de sua casa[a], tendo crido em Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode enfatizar que a alegria abrangia todos os de sua casa; alguns entendem que a frase sugere ainda que todos eles compartilharam da fé.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: Depois de levá-los para cima
  rationale: O particípio aoristo indica a ação anterior e o movimento para um nível superior, da prisão para a casa.
- source_word: εἰς τὸν οἶκον
  choice: à casa
  rationale: Mantém o artigo do grego sem acrescentar explicitamente o possessivo; pelo contexto, trata-se da casa do carcereiro.
- source_word: παρέθηκεν τράπεζαν
  choice: serviu-lhes uma refeição
  rationale: A expressão idiomática significa literalmente pôr uma mesa diante de alguém, isto é, oferecer comida; a formulação escolhida comunica naturalmente a hospitalidade.
- source_word: ἠγαλλιάσατο
  choice: alegrou-se muito
  rationale: Expressa a alegria intensa indicada pelo verbo, em linguagem atual e digna.
- source_word: πανοικεὶ
  choice: com toda a sua família
  rationale: O advérbio abrange todos os da casa. «Família» é natural em português, embora «casa» no contexto antigo possa incluir outros integrantes do lar.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: tendo crido em Deus
  rationale: Reproduz diretamente o particípio perfeito e seu referente masculino singular, preservando tanto o estado resultante da fé quanto a relação sintática sem tornar explícita uma causalidade.
theological_decisions:
- issue: Alcance da alegria e da fé em relação aos integrantes da casa
  choice: O carcereiro alegrou-se com toda a família, tendo ele crido em Deus.
  alternative: Toda a família alegrou-se e também compartilhou da fé em Deus.
  rationale: O particípio singular masculino πεπιστευκώς refere-se mais diretamente ao carcereiro, enquanto πανοικεὶ pode enfatizar a participação de toda a casa na alegria. A nota preserva a possibilidade de uma abrangência maior sem afirmar além da sintaxe explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A locução «à casa» preserva a direção espacial, e «tendo crido» conserva a construção participial e a ambiguidade teológica relevante.
