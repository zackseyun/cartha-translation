  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: pt
  text: Quando o carcereiro acordou e viu abertas as portas da prisão[a], sacou a espada e estava prestes a se matar[b], supondo que os prisioneiros tivessem fugido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “viu que as portas da prisão tinham sido abertas”. O particípio perfeito grego enfatiza o estado aberto das portas.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega μάχαιρα pode designar uma espada ou uma arma de lâmina mais curta, como um punhal; “espada” foi mantida como tradução contextual usual.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: acordou
  rationale: A combinação expressa idiomaticamente a passagem ao estado de vigília; “acordou” é natural e preserva o sentido ingressivo.
- source_word: δεσμοφύλαξ
  choice: carcereiro
  rationale: Designa o responsável pela custódia dos presos, não apenas um guarda em sentido amplo.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: viu abertas as portas da prisão
  rationale: O particípio perfeito passivo destaca o estado resultante das portas, que estavam abertas; a formulação portuguesa preserva esse estado sem determinar explicitamente quem as abriu.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: puxou a espada
  rationale: O verbo no contexto indica sacar ou puxar uma arma; “puxou a espada” é claro e corrente em português amplo.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: estava prestes a se matar
  rationale: A construção indica ação iminente, e ἀναιρεῖν significa aqui matar.
- source_word: νομίζων
  choice: supondo
  rationale: Expressa a inferência do carcereiro diante das portas abertas, sem implicar certeza.
- source_word: ἐκπεφευγέναι
  choice: tivessem fugido
  rationale: O infinitivo perfeito apresenta a fuga como já consumada na suposição do carcereiro; o subjuntivo composto é idiomático após “supondo que”.
- source_word: τοὺς δεσμίους
  choice: os presos
  rationale: No contexto, refere-se diretamente às pessoas mantidas na prisão; “presos” é claro e natural.
