  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: pt
  text: Mas, quando os donos dela viram que a esperança deles de lucro tinha ido embora[a], agarraram Paulo e Silas e os arrastaram até a praça pública, diante das autoridades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a esperança deles de ganho tinha desaparecido”. O grego diz literalmente que a esperança do lucro deles “saiu”, possivelmente retomando a saída do espírito no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “autoridades” é uma designação geral dos governantes civis; o versículo seguinte usa um termo mais específico, muitas vezes traduzido por “magistrados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: os donos dela
  rationale: No contexto, κύριοι designa os homens que exerciam posse e controle econômico sobre a jovem escravizada. “Donos” torna explícita essa relação sem usar “senhores”, que poderia soar como mero título respeitoso.
- source_word: ἐξῆλθεν
  choice: tinha ido embora
  rationale: O mais-que-perfeito composto expressa a perda já consumada quando eles a perceberam. “Ido embora” preserva, de modo natural em português, a imagem de saída presente no verbo grego e sua possível ligação narrativa com a saída do espírito no versículo anterior.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: sua esperança de lucro
  rationale: ἐλπίς é mantido como “esperança”, enquanto ἐργασία, neste contexto de exploração econômica, aponta para rendimento ou lucro, e não apenas para trabalho em sentido abstrato.
- source_word: ἐπιλαβόμενοι
  choice: agarraram
  rationale: O particípio indica que se apoderaram deles fisicamente. “Agarraram” comunica com clareza a ação hostil e conduz naturalmente ao verbo seguinte.
- source_word: εἵλκυσαν
  choice: os arrastaram
  rationale: O verbo descreve puxar à força; “arrastaram” preserva a coerção e a violência pública da ação.
- source_word: ἀγορὰν
  choice: praça pública
  rationale: ἀγορά era o espaço público central de comércio e vida cívica. “Praça pública” comunica melhor ao leitor moderno a função cívica e judicial do local do que a tradução restrita “mercado”.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: para apresentá-los às autoridades
  rationale: ἄρχοντες é um termo geral para governantes ou autoridades cívicas. A formulação explicita o sentido direcional/judicial da preposição sem antecipar o título mais específico empregado no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi mantida, e a imagem de ἐξῆλθεν foi preservada em expressão idiomática. “Praça pública” e “autoridades” refletem o cenário cívico sem introduzir terminologia administrativa mais específica do que o grego deste versículo.
