  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: pt
  text: 'Depois de levá-los para fora, disse: “Senhores[b], o que devo fazer para ser salvo?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que é necessário que eu faça para ser salvo?”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Senhores” traduz o grego kýrioi como forma respeitosa de tratamento, não como o título divino “Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: Depois de levá-los para fora
  rationale: O particípio aoristo indica ação anterior à fala; a formulação preserva a sequência e expressa com naturalidade o movimento para fora.
- source_word: ἔφη
  choice: perguntou
  rationale: Embora φημί signifique literalmente “disse”, a fala introduzida é uma pergunta; “perguntou” é natural em português e mantém a função narrativa.
- source_word: Κύριοι
  choice: Senhores
  rationale: O vocativo plural κύριοι é aqui uma forma respeitosa de tratamento dirigida a Paulo e Silas, não o título divino “Senhor”.
- source_word: τί με δεῖ ποιεῖν
  choice: o que devo fazer
  rationale: δεῖ exprime necessidade. “Devo fazer” comunica essa força de modo claro e idiomático, sem sugerir mera conveniência.
- source_word: ἵνα σωθῶ
  choice: para ser salvo
  rationale: A construção com ἵνα e o subjuntivo passivo expressa finalidade; a tradução concisa conserva tanto a finalidade quanto a voz passiva.
theological_decisions:
- issue: Sentido de σωθῶ na pergunta do carcereiro
  choice: ser salvo
  alternative: ser resgatado / ser libertado
  rationale: σῴζω pode indicar resgate ou salvação. A continuação imediata no versículo 31 favorece o sentido mais pleno de salvação, mas a expressão tradicional “ser salvo” mantém a amplitude do termo sem impor um sistema doutrinário específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi mantida, e a pergunta foi formulada de maneira natural. Os marcadores foram posicionados ao fim da frase por incidirem, respectivamente, sobre a formulação da pergunta e sobre o tratamento “Senhores”.
