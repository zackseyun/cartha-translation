id: ACT.16.14
reference: Acts 16:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: pt
  text: Certa mulher chamada Lídia, comerciante de tecidos de púrpura, da cidade de Tiatira, que adorava a Deus[a], estava ouvindo. O Senhor lhe abriu o coração para que prestasse atenção ao que Paulo dizia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: era temente a Deus. A expressão pode designar uma gentia devota do Deus de Israel.'
    reason: Alternativa lexical e possível nuance socioreligiosa de σεβομένη τὸν θεόν.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: Certa mulher chamada Lídia
  rationale: Preserva a indefinição de τις e introduz Lídia de modo natural em português, sem reproduzir mecanicamente o καί narrativo.
- source_word: πορφυρόπωλις
  choice: comerciante de tecidos de púrpura
  rationale: O termo designa uma mulher que negociava produtos ou tecidos tingidos de púrpura. A formulação é clara e evita especificar indevidamente peças de vestuário.
- source_word: πόλεως Θυατείρων
  choice: da cidade de Tiatira
  rationale: Expressa naturalmente a procedência de Lídia e preserva a menção explícita à cidade.
- source_word: σεβομένη τὸν θεόν
  choice: que adorava a Deus
  rationale: Comunica a devoção de Lídia ao Deus de Israel em linguagem corrente. A possível função da expressão como designação de uma gentia ligada à fé judaica é preservada em nota.
- source_word: ἤκουεν
  choice: estava ouvindo
  rationale: O imperfeito indica uma ação em andamento no cenário narrativo.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Mantém a forma explícita do grego sem identificar de maneira mais estreita o referente.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: lhe abriu o coração
  rationale: Reproduz com naturalidade a imagem grega de tornar interiormente receptiva a pessoa.
- source_word: προσέχειν
  choice: para que prestasse atenção
  rationale: Expressa atenção dirigida ao conteúdo ouvido sem ampliar o sentido para uma resposta ou conversão que o verbo, por si só, não declara.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: ao que Paulo dizia
  rationale: Formulação idiomática que preserva o aspecto contínuo do particípio presente e identifica Paulo como agente da fala.
theological_decisions:
- issue: Referente de ὁ κύριος
  choice: o Senhor
  alternative: o Senhor Jesus; Deus
  rationale: O texto grego traz apenas ὁ κύριος. A tradução mantém essa designação e não resolve além do que está explícito se Lucas se refere especificamente a Jesus ou, de modo mais amplo, ao agente divino.
- issue: Sentido socioreligioso de σεβομένη τὸν θεόν
  choice: que adorava a Deus, com nota explicativa
  alternative: temente a Deus; prosélita
  rationale: A expressão pode caracterizar uma gentia devota do Deus de Israel, mas não afirma que ela fosse prosélita plena. O texto principal permanece natural, e a nota conserva essa possível nuance histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma sequência excessivamente longa, sem alterar as relações do texto grego.
