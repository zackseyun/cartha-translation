  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: pt
  text: Por volta da meia-noite, Paulo e Silas oravam e cantavam hinos a Deus, e os presos os escutavam atentamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Por volta da meia-noite
  rationale: κατά com acusativo temporal indica aproximadamente esse momento; δέ tem força conectiva leve e não exige representação explícita em português.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Paulo e Silas
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: προσευχόμενοι ὕμνουν τὸν θεόν
  choice: oravam e cantavam hinos a Deus
  rationale: A coordenação de dois verbos no imperfeito comunica com naturalidade as ações simultâneas e contínuas; ὑμνέω denota cantar hinos ou louvores.
- source_word: ἐπηκροῶντο
  choice: escutavam atentamente
  rationale: O imperfeito expressa ação contínua, e o verbo composto pode indicar escuta atenta; explicitar essa nuance é natural em português.
- source_word: οἱ δέσμιοι
  choice: os outros presos
  rationale: δέσμιοι designa pessoas presas; 'outros' esclarece naturalmente que se trata dos demais presos, sem incluir Paulo e Silas no sujeito da escuta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção com 'enquanto' torna explícita a simultaneidade já presente nos imperfeitos gregos, sem alterar o sentido.
