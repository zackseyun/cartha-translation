id: ACT.16.12
reference: Acts 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: pt
  text: e dali para Filipos[a], que é uma cidade importante do distrito da Macedônia, uma colônia romana[b]. Permanecemos nessa cidade por alguns dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a primeira cidade do distrito da Macedônia”. A expressão grega é difícil, e “primeira” pode indicar posição, importância ou sequência.'
    reason: alternative_reading
  - marker: b
    text: Isto é, uma cidade que havia recebido o estatuto especial de colônia sob o domínio romano.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: e dali
  rationale: Preserva a ligação com a sequência anterior da viagem sem acrescentar um verbo ausente no grego.
- source_word: εἰς Φιλίππους
  choice: para Filipos
  rationale: A preposição εἰς com nome de cidade indica naturalmente o destino; “Filipos” é a forma portuguesa consagrada.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: uma cidade importante do distrito da Macedônia
  rationale: A expressão é sintática e historicamente difícil. “Importante” comunica o provável sentido de destaque de πρώτη sem afirmar de modo inequívoco primazia administrativa ou ordem geográfica.
- source_word: κολωνία
  choice: uma colônia romana
  rationale: O termo designa o estatuto colonial romano de Filipos; explicitar “romana” torna claro o referente histórico.
- source_word: ἦμεν ... διατρίβοντες
  choice: Permanecemos
  rationale: A construção perifrástica expressa estadia continuada; “permanecemos” é natural e digna em português.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: nessa cidade
  rationale: Retoma de modo natural em português a cidade que acaba de ser mencionada.
- source_word: ἡμέρας τινάς
  choice: por alguns dias
  rationale: Mantém a duração indefinida indicada pelo acusativo de extensão e por τινάς, sem precisão indevida.
theological_decisions:
- issue: Sentido de πρώτη na descrição de Filipos
  choice: uma cidade importante
  alternative: a primeira cidade do distrito da Macedônia
  rationale: A opção evita apresentar como certa uma primazia administrativa ou uma sequência geográfica discutida, mas a nota preserva a tradução mais formal e a ambiguidade do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita tecnicismo no corpo do texto, preservando nas notas a dificuldade histórica e lexical. “Macedônia” segue a grafia corrente no português brasileiro; “nessa cidade” oferece retomada discursiva natural.
