id: ACT.16.6
reference: Acts 16:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: pt
  text: E atravessaram a região da Frígia e da Galácia[b], tendo sido impedidos pelo Espírito Santo de anunciar a palavra na Ásia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, no oeste da Ásia Menor, não o continente asiático moderno.
    reason: cultural_note
  - marker: b
    text: Ou, possivelmente, “a região frígia e galática”. A construção grega pode ser entendida como a designação de uma única região.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: atravessaram
  rationale: O aoristo de διέρχομαι descreve o deslocamento através de uma área; “atravessaram” preserva esse sentido de percurso com naturalidade em português.
- source_word: δὲ
  choice: E
  rationale: δέ funciona como conectivo narrativo leve; “E” dá continuidade ao relato sem acrescentar uma relação lógica mais específica.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: a região da Frígia e da Galácia
  rationale: χώρα significa região ou território. Esta formulação é clara, mas a construção grega também pode designar uma única região caracterizada como frígia e galática; a nota preserva essa possibilidade.
- source_word: κωλυθέντες
  choice: tendo sido impedidos
  rationale: O particípio aoristo passivo de κωλύω indica que lhes foi vedada ou impedida a ação. “Impedidos” expressa a restrição sem especificar além do texto como ela ocorreu.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: pelo Espírito Santo
  rationale: A construção com ὑπό e genitivo apresenta o Espírito Santo como agente da ação; esta é a designação corrente e natural em português.
- source_word: λαλῆσαι
  choice: de anunciar
  rationale: Embora λαλέω signifique literalmente “falar”, neste contexto missionário seu complemento, “a palavra”, indica comunicação pública da mensagem. “Anunciar a palavra” é idiomático em português e evita a expressão pouco natural “falar a palavra”.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: “A palavra” preserva a expressão característica de Lucas-Atos sem explicitar como “evangelho” aquilo que o texto deixa em formulação mais ampla.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: na Ásia
  rationale: Mantém o nome geográfico do texto; a nota esclarece que se trata da província romana, e não do continente moderno.
theological_decisions:
- issue: Agência e identidade do Espírito na proibição
  choice: pelo Espírito Santo
  alternative: pelo espírito santo
  rationale: O sintagma grego em Lucas-Atos refere-se ao Espírito Santo e o apresenta como agente da restrição. A tradução conserva essa agência pessoal sem explicar o modo da orientação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha os termos aos quais se referem no texto. A ambiguidade geográfica da construção grega é preservada em nota, e “impedidos” evita definir o mecanismo pelo qual o Espírito comunicou a proibição.
