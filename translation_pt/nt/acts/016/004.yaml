id: ACT.16.4
reference: Acts 16:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: pt
  text: Enquanto passavam pelas cidades, transmitiam-lhes, para que as observassem, as determinações[a] tomadas pelos apóstolos e presbíteros que estavam em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «decretos». O termo grego se refere às resoluções adotadas em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ διεπορεύοντο τὰς πόλεις
  choice: Enquanto passavam pelas cidades
  rationale: O imperfeito descreve o percurso contínuo por várias cidades; «enquanto» expressa com naturalidade a relação temporal entre a viagem e a transmissão das determinações.
- source_word: παρεδίδοσαν αὐτοῖς
  choice: transmitiam-lhes
  rationale: O verbo indica entregar ou passar adiante algo recebido, aqui decisões dotadas de autoridade. «Transmitiam-lhes» preserva essa ideia e mantém o pronome sem explicitar um referente que o grego deixa implícito.
- source_word: φυλάσσειν
  choice: para que as observassem
  rationale: Neste contexto, o verbo significa guardar no sentido de cumprir ou observar. A construção final explicita naturalmente em português a finalidade indicada pelo infinitivo grego.
- source_word: τὰ δόγματα
  choice: as determinações
  rationale: O termo designa as resoluções formais adotadas no encontro de Jerusalém. «Determinações» comunica autoridade sem sugerir necessariamente o sentido teológico posterior de «dogmas».
- source_word: τὰ κεκριμένα
  choice: tomadas
  rationale: Com «determinações», a expressão idiomática portuguesa «determinações tomadas» representa o particípio perfeito passivo e indica resoluções já estabelecidas e ainda vigentes.
- source_word: ὑπὸ τῶν ἀποστόλων καὶ πρεσβυτέρων
  choice: pelos apóstolos e presbíteros
  rationale: São os termos correntes e contextualmente adequados para os líderes mencionados em Atos, sem acrescentar uma estrutura eclesiástica posterior.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: que estavam em Jerusalém
  rationale: A oração relativa deixa claro que a expressão locativa modifica conjuntamente «apóstolos e presbíteros».
theological_decisions:
- issue: Autoridade das resoluções de Jerusalém
  choice: determinações
  alternative: decretos
  rationale: A escolha preserva o caráter oficial e vinculante das resoluções de Atos 15, sem importar para δόγματα o sentido técnico de formulações dogmáticas desenvolvido posteriormente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Presbíteros» mantém a terminologia bíblica reconhecida; a colocação pronominal em «transmitiam-lhes» preserva um tom formal sem soar arcaica. O marcador foi colocado junto ao termo a que a nota lexical efetivamente se refere.
