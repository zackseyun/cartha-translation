  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: pt
  text: Assim, passando pela Mísia[a], desceram até Trôade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tendo atravessado a Mísia» ou «passando ao largo da Mísia». O particípio grego admite essas traduções próximas; o sentido é que eles seguiram adiante, em vez de permanecer ali.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: passando pela
  rationale: O particípio aoristo de παρέρχομαι, com Μυσίαν no acusativo, indica que seguiram adiante pela região ou junto dela, sem permanecer ali. «Passando pela» é natural em português e conserva a possível amplitude do percurso.
- source_word: δὲ
  choice: Assim,
  rationale: δέ é um conectivo narrativo leve. «Assim» dá continuidade ao relato anterior sem criar um contraste forte.
- source_word: Μυσίαν
  choice: Mísia
  rationale: Forma tradicional e corrente em português para o nome da região.
- source_word: κατέβησαν
  choice: desceram
  rationale: Preserva o sentido direcional de καταβαίνω, provavelmente relacionado ao deslocamento rumo ao litoral ou a uma altitude menor.
- source_word: εἰς
  choice: até
  rationale: Com o destino expresso por uma cidade, «até» comunica naturalmente a chegada a Trôade, embora «para» também seja possível.
- source_word: Τρῳάδα
  choice: Trôade
  rationale: Forma consagrada em português para o nome da cidade e região costeira.
