id: ACT.16.9
reference: Acts 16:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: pt
  text: 'Durante a noite[a], uma visão apareceu a Paulo: certo homem macedônio[b] estava em pé, pedindo-lhe com insistência: “Venha para a Macedônia[c] e ajude-nos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de noite”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um homem da Macedônia”.
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “Tendo atravessado para a Macedônia, ajude-nos”; “Venha para a Macedônia” comunica em português a força idiomática do particípio ligado ao imperativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: visão
  rationale: É o equivalente corrente para uma experiência visual de caráter revelador e corresponde ao uso narrativo do termo em Atos, sem definir a natureza exata da experiência.
- source_word: διὰ νυκτός
  choice: durante a noite
  rationale: Expressa com naturalidade o período em que ocorreu a visão e preserva o cenário noturno.
- source_word: τῷ Παύλῳ ὤφθη
  choice: apareceu a Paulo
  rationale: O passivo de ὁράω com dativo tem aqui o sentido idiomático de aparecer a alguém; esta formulação é natural e não acrescenta detalhes sobre o modo da revelação.
- source_word: ἀνὴρ Μακεδών τις
  choice: certo homem macedônio
  rationale: “Homem” preserva a referência masculina de ἀνήρ; “certo” representa τις, e “macedônio” mantém a identificação regional.
- source_word: ἑστώς
  choice: estava em pé
  rationale: Preserva a postura e o aspecto descritivo da cena, em vez de reduzir a expressão ao pontual “levantou-se”.
- source_word: παρακαλῶν αὐτόν
  choice: pedindo-lhe com insistência
  rationale: Comunica um apelo insistente sem intensificá-lo necessariamente como súplica desesperada.
- source_word: λέγων
  choice: '[expresso pelos dois-pontos antes da fala direta]'
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo do pedido, evitando a repetição pouco fluente de “pedindo... e dizendo”.
- source_word: Διαβὰς εἰς Μακεδονίαν
  choice: Venha para a Macedônia
  rationale: O particípio aoristo ligado ao imperativo comunica movimento prévio ou concomitante; a formulação idiomática em português transmite o convite a atravessar e chegar à Macedônia.
- source_word: βοήθησον ἡμῖν
  choice: ajude-nos
  rationale: Imperativo direto, simples e fiel ao pedido de auxílio.
theological_decisions:
- issue: Natureza da experiência descrita por ὅραμα e ὤφθη
  choice: Apresentar o acontecimento como uma visão que apareceu a Paulo, sem especificar sua fenomenologia.
  alternative: Interpretá-la especificamente como sonho, impressão interior ou aparição objetiva.
  rationale: O texto afirma que uma visão apareceu a Paulo durante a noite, mas não explica de que modo ele a vivenciou. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pedindo-lhe com insistência” preserva a intensidade de παρακαλέω sem exagerá-la; “Venha para a Macedônia” privilegia naturalidade idiomática, com a forma grega explicitada em nota.
