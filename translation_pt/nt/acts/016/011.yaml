  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: pt
  text: Assim, partindo de Trôade, navegamos diretamente para Samotrácia e, no dia seguinte, para Neápolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: partindo
  rationale: No contexto náutico, ἀνάγω significa partir para o mar ou zarpar. “Partindo” comunica naturalmente a saída por mar, explicitada pelo verbo “navegamos” logo em seguida, e preserva a sequência circunstancial do particípio.
- source_word: οὖν
  choice: Assim
  rationale: οὖν assinala a progressão ou consequência narrativa. “Assim” faz a ligação com o contexto anterior de modo natural e digno.
- source_word: ἀπὸ Τρῳάδος
  choice: de Trôade
  rationale: A preposição ἀπό indica o ponto de partida; “Trôade” é a forma portuguesa tradicional e reconhecível do topônimo.
- source_word: εὐθυδρομήσαμεν
  choice: navegamos diretamente
  rationale: O verbo descreve a navegação em curso reto ou direto. A tradução mantém tanto o sentido marítimo quanto a ideia de trajeto direto, em português corrente.
- source_word: εἰς Σαμοθρᾴκην
  choice: para Samotrácia
  rationale: εἰς indica destino, e “Samotrácia” é a forma portuguesa estabelecida do nome geográfico.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: e, no dia seguinte
  rationale: A expressão dativa tem sentido temporal, “no dia seguinte”; δέ continua a sequência do itinerário e é adequadamente representado por “e”.
- source_word: εἰς Νέαν Πόλιν
  choice: para Neápolis
  rationale: Embora o nome signifique literalmente “Cidade Nova”, trata-se de um topônimo. “Neápolis” é sua forma tradicional em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitores brasileiros e compreensão internacional. A elipse de “navegamos” antes de “para Neápolis” acompanha a concisão do grego sem prejudicar a clareza.
