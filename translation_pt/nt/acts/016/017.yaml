id: ACT.16.17
reference: Acts 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are slaves of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: pt
  text: 'Ela vinha seguindo Paulo e a nós, e gritava: “Estes homens são escravos do Deus Altíssimo e proclamam a vocês um caminho de salvação[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o caminho da salvação”. No grego, “caminho” aparece sem artigo; conforme o contexto, a expressão pode ser entendida como indefinida ou definida.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: vinha seguindo
  rationale: O particípio presente, ligado ao imperfeito ἔκραζεν, descreve uma ação contínua. “Vinha seguindo” expressa essa duração de modo natural, sem acrescentar a ideia de perseguição.
- source_word: ἔκραζεν
  choice: gritava
  rationale: O verbo indica fala em voz alta, e o imperfeito apresenta a ação como contínua ou repetida. “Gritava” conserva ambos os aspectos no contexto.
- source_word: δοῦλοι
  choice: escravos
  rationale: O termo expressa pertença e sujeição a um senhor. “Escravos” preserva essa relação com Deus mais diretamente que “servos”.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: do Deus Altíssimo
  rationale: “Deus Altíssimo” é uma forma portuguesa natural e digna para o título divino, mantendo o valor superlativo de ὑψίστου.
- source_word: καταγγέλλουσιν
  choice: proclamam
  rationale: O verbo denota anúncio público. “Proclamam” mantém essa força sem tornar a frase excessivamente técnica.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo identifica os destinatários da proclamação. “A vocês” é claro e amplamente compreensível em português moderno.
- source_word: ὁδὸν σωτηρίας
  choice: um caminho de salvação
  rationale: Como ὁδόν não tem artigo, “um caminho de salvação” conserva na linha principal a possível leitura indefinida; a leitura definida, também possível no grego contextual, é registrada em nota.
theological_decisions:
- issue: Definitude de ὁδὸν σωτηρίας
  choice: um caminho de salvação
  alternative: o caminho da salvação
  rationale: A ausência do artigo permite preservar uma formulação indefinida, sem explicitar neste versículo uma exclusividade além da forma grega. Como substantivos gregos sem artigo também podem ter sentido definido conforme o contexto, a alternativa tradicional é mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. “Vinha seguindo” comunica a ação continuada; “a vocês” evita regionalismo excessivo. A coordenação foi mantida para refletir o fluxo narrativo do grego.
