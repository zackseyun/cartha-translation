  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain slave girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: pt
  text: Aconteceu que, enquanto íamos ao lugar de oração, veio ao nosso encontro uma jovem escrava que tinha um espírito de Píton[a]. Ela dava muito lucro aos seus senhores por meio da adivinhação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um espírito de adivinhação». O grego diz literalmente «um espírito de Píton», expressão culturalmente específica associada à adivinhação oracular.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «predizendo o futuro» ou «praticando adivinhação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Introduz um novo episódio na narrativa de modo natural e atual, sem recorrer à fórmula arcaica «sucedeu que».
- source_word: πορευομένων ἡμῶν
  choice: quando íamos
  rationale: Expressa a ação simultânea e em andamento indicada pelo genitivo absoluto.
- source_word: εἰς τὴν προσευχὴν
  choice: ao lugar de oração
  rationale: Neste contexto de Atos, a expressão provavelmente indica um local reconhecido para oração, não apenas o ato de orar.
- source_word: παιδίσκην τινά
  choice: uma jovem escravizada
  rationale: O contexto de múltiplos senhores que lucravam com ela torna relevante explicitar sua condição servil; «jovem» preserva a nuance etária possível de παιδίσκη.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: que tinha um espírito de Píton
  rationale: Preserva a expressão culturalmente específica do grego, entendendo Πύθων como referência ao Píton ligado à tradição oracular, sem reduzi-la silenciosamente a uma explicação genérica.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: veio ao nosso encontro
  rationale: Transmite com naturalidade o encontro introduzido pelo infinitivo na construção narrativa.
- source_word: ἥτις
  choice: Ela
  rationale: Inicia em português uma nova oração explicativa com clareza, evitando uma sequência relativa pesada.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: dava muito lucro
  rationale: Comunica o benefício econômico substancial e habitual indicado pelo imperfeito.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: aos seus senhores
  rationale: Refere-se aos homens que exerciam domínio sobre a jovem; «senhores» mantém a relação explícita com sua condição escravizada.
- source_word: μαντευομένη
  choice: predizendo o futuro
  rationale: Equivalente corrente e compreensível para a atividade mântica; a alternativa técnica «praticando adivinhação» fica registrada em nota.
theological_decisions:
- issue: Como traduzir πνεῦμα πύθωνα, expressão culturalmente carregada ligada à atividade oracular
  choice: um espírito de Píton
  alternative: um espírito de adivinhação
  rationale: A tradução principal conserva a referência específica presente no grego, enquanto a nota oferece seu sentido funcional sem impor essa interpretação ao texto.
- issue: Se παιδίσκη deve explicitar a condição servil
  choice: jovem escravizada
  alternative: serva
  rationale: A menção a vários senhores e ao lucro que obtinham dela evidencia uma relação de domínio e exploração; «jovem escravizada» torna essa realidade social clara sem apagar a possível nuance de idade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos, preserva a referência cultural específica a Píton e explicita a exploração econômica sugerida pelo contexto.
