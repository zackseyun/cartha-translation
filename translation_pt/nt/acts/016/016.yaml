  to: Aconteceu que, enquanto íamos ao lugar de oração, veio ao nosso encontro uma jovem escrava que tinha um espírito de Píton[a]. Ela dava muito lucro aos seus senhores por meio da adivinhação[b].
  rationale: A revisão preserva as escolhas centrais do texto — especialmente «espírito de Píton» — mas substitui uma formulação socialmente menos natural e evita restringir a atividade mântica a mera predição do futuro. As âncoras das notas permanecem ligadas às expressões a que se referem.
