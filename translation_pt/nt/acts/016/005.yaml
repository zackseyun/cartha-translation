  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: pt
  text: Assim, as igrejas eram fortalecidas na fé[a] e cresciam em número dia após dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em fé”. A expressão grega pode indicar tanto o fortalecimento na fé cristã, como um conjunto compartilhado de crenças e modo de vida, quanto, de modo mais geral, o fortalecimento em fé.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Assim
  rationale: A combinação de partículas introduz um resumo decorrente da narrativa anterior. “Assim” expressa de modo natural a conexão discursiva, sem atribuir a μέν um contraste explícito que o contexto não exige.
- source_word: ἐκκλησίαι
  choice: igrejas
  rationale: Em Atos, o termo designa comunidades cristãs locais. “Igrejas” é a forma corrente, clara e adequada ao contexto.
- source_word: ἐστερεοῦντο
  choice: eram fortalecidas
  rationale: O imperfeito passivo indica uma ação contínua no passado. A formulação preserva tanto o caráter progressivo quanto a voz passiva.
- source_word: τῇ πίστει
  choice: na fé
  rationale: O artigo e o contexto eclesial favorecem a referência à fé cristã compartilhada, embora a expressão grega também possa denotar a fé em sentido mais geral; a nota preserva essa ambiguidade.
- source_word: ἐπερίσσευον
  choice: cresciam
  rationale: O imperfeito apresenta crescimento contínuo. Com “em número”, “cresciam” comunica naturalmente o aumento sem intensificar o verbo para “multiplicavam-se”.
- source_word: τῷ ἀριθμῷ
  choice: em número
  rationale: O dativo indica o aspecto em que ocorria o crescimento; “em número” é uma expressão portuguesa direta e idiomática.
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: A expressão distributiva indica crescimento repetido e contínuo. “Dia após dia” preserva esse valor iterativo.
theological_decisions:
- issue: Sentido de πίστις com artigo
  choice: “na fé”, entendida principalmente como a fé cristã compartilhada pelas igrejas
  alternative: “em fé”, referindo-se mais geralmente à confiança ou fé dos cristãos
  rationale: O artigo e o contexto comunitário favorecem o sentido objetivo ou compartilhado, mas não eliminam completamente o sentido subjetivo. A tradução principal segue a leitura mais provável, e a nota mantém aberta a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo verbal mantém o aspecto contínuo dos dois imperfeitos gregos, e a nota evita resolver indevidamente a ambiguidade de πίστις.
