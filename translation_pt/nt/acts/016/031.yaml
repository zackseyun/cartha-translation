  source_fidelity: 'A tradução representa com precisão a construção grega: “Eles responderam” comunica adequadamente οἱ δὲ εἶπαν no contexto dialógico; “Creia no Senhor Jesus” preserva o imperativo Πίστευσον e seu objeto introduzido por ἐπί; e “você será salvo” traduz de modo direto o futuro passivo σωθήσῃ. A repetição de “você” antes de “e os da sua casa” reproduz de forma apropriada a ênfase explícita de σὺ.'
