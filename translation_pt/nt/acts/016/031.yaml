  terminology: “Senhor Jesus” mantém o título κύριος e o nome de modo tradicional e compreensível. “Salvo” é o termo mais adequado no contexto, sem restringir indevidamente o alcance de σῴζω. A nota sobre “os da sua casa” esclarece corretamente o valor de οἶκος sem introduzir uma interpretação teológica sobre o modo da salvação dos integrantes.
