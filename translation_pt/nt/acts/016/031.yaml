  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: pt
  text: 'Eles responderam: “Creia no Senhor Jesus[a], e você será salvo — você e os da sua casa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Ponha sua fé no Senhor Jesus”.'
    reason: lexical_alternative
  - marker: b
    text: “Os da sua casa” refere-se às pessoas de sua família ou unidade doméstica, não ao edifício.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: No diálogo imediato, εἶπαν introduz a resposta de Paulo e Silas à pergunta do carcereiro. “Responderam” é natural em português e δέ funciona aqui como ligação narrativa leve, sem exigir contraste explícito.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Creia no
  rationale: O imperativo aoristo Πίστευσον pede uma resposta decidida, e ἐπί com acusativo indica aquele em quem a fé é depositada. “Creia no” é a formulação portuguesa direta e idiomática, sem ampliar o sentido interpretativamente.
- source_word: κύριον Ἰησοῦν
  choice: Senhor Jesus
  rationale: “Senhor” conserva a força honorífica e cristológica de κύριος, enquanto “Jesus” segue a forma portuguesa consagrada do nome.
- source_word: σωθήσῃ
  choice: você será salvo
  rationale: O futuro passivo de σῴζω é adequadamente expresso por “será salvo”, que preserva a linguagem de salvação própria do contexto sem reduzi-la a mero livramento físico.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: você e os da sua casa
  rationale: Aqui οἶκος designa as pessoas que compõem a casa do carcereiro, não o edifício. “Os da sua casa” é claro, natural e de ampla compreensão em português.
theological_decisions:
- issue: Alcance da promessa referente ao carcereiro e aos da sua casa
  choice: Preservar a inclusão explícita do carcereiro e de sua casa sem afirmar que a fé de um salva automaticamente os demais.
  alternative: Interpretar a frase como salvação automática da casa inteira pela fé do chefe da família, ou minimizar a dimensão doméstica e torná-la estritamente individual.
  rationale: O grego inclui o carcereiro e seu οἶκος na promessa, mas este versículo isoladamente não explica o modo pelo qual cada integrante participa da salvação. A redação mantém essa tensão sem impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para a segunda pessoa singular. A construção “os da sua casa” comunica naturalmente a unidade doméstica sem o tom mais técnico de “agregado familiar” nem a possível ambiguidade arquitetônica de “casa” isoladamente.
