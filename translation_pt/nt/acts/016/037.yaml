review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a sequência argumentativa, a publicidade da agressão, a condição de cidadãos romanos, a exigência de ação pessoal dos magistrados e a ênfase da recusa. Contudo, «sem condenação» é uma construção nominal pouco natural e menos precisa para o acusativo predicativo ἀκατακρίτους, que descreve Paulo e Silas como não condenados judicialmente. Além disso, «querem nos mandar embora» atenua o presente assertivo ἐκβάλλουσιν.
  naturalness: O registro é moderno, firme e apropriado. «Sem que fôssemos condenados» é mais idiomático e juridicamente claro do que «sem condenação». «Agora nos mandam embora às escondidas?» conserva melhor o tom indignado e a ação presente do grego.
  terminology: «Cidadãos romanos» comunica adequadamente a força cívico-jurídica de Ῥωμαίους no contexto. «Nos conduzam para fora» é uma opção fiel para ἐξαγαγέτωσαν. A nota cultural deve conservar o dado literal de «homens romanos», sem sugerir que a expressão grega, por si, formule uma categoria abstrata de «pessoas».
  issues:
  - severity: medium
    issue: «sem condenação» para ἀκατακρίτους
    rationale: A expressão é menos corrente em português e pode soar como ausência de uma noção abstrata de condenação. O grego afirma que eles não haviam sido judicialmente condenados; «sem que fôssemos condenados» transmite isso de modo natural e direto.
  - severity: low
    issue: «querem nos mandar embora» para ἐκβάλλουσιν
    rationale: «Querem» introduz uma nuance volitiva/incipiente que não está expressa no presente indicativo grego. «Nos mandam embora» preserva a ação presente proposta pelos magistrados, no contexto de uma libertação encoberta.
  - severity: low
    issue: Formulação da nota b
    rationale: A nota pode refletir mais exatamente o literal «homens que são romanos», ao mesmo tempo que explica o sentido de cidadania romana que o contexto exige.
