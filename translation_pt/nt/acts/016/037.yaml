source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: pt
  text: 'Mas Paulo lhes disse: “Depois de nos espancarem em público, sem que fôssemos condenados[a], embora sejamos cidadãos romanos[b], eles nos lançaram na prisão. E agora nos mandam embora às escondidas? De modo nenhum! Que venham eles mesmos e nos conduzam para fora[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem julgamento”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “homens que são romanos”; aqui a expressão se refere à cidadania romana e às proteções legais a ela associadas.
    reason: cultural_note
  - marker: c
    text: Ou “nos levem para fora” ou “nos escoltem para fora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Forma narrativa natural em português para introduzir a fala de Paulo.
- source_word: Δείραντες
  choice: Depois de nos espancarem
  rationale: Expressa a anterioridade do particípio aoristo e mantém a amplitude do verbo, sem especificar indevidamente o instrumento ou método.
- source_word: δημοσίᾳ
  choice: em público
  rationale: Equivalente direto, claro e corrente do advérbio grego.
- source_word: ἀκατακρίτους
  choice: sem condenação
  rationale: Preserva com maior precisão a ideia de que não havia sentença judicial condenatória, sem reduzir necessariamente o termo à ausência de qualquer audiência formal.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: embora sejamos cidadãos romanos
  rationale: Torna natural em português a força circunstancial da frase e explicita seu sentido jurídico-cívico no contexto.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: nos lançaram na prisão
  rationale: Mantém a força de βάλλω, com registro digno e compreensível.
- source_word: λάθρᾳ
  choice: às escondidas
  rationale: Comunica de modo idiomático a ação secreta ou encoberta.
- source_word: ἐκβάλλουσιν
  choice: querem nos mandar embora
  rationale: No contexto, expressa a tentativa presente de dispensá-los secretamente; evita a rigidez pouco natural de uma tradução mecânica.
- source_word: οὐ γάρ
  choice: De modo nenhum!
  rationale: Reproduz a recusa enfática de Paulo em português atual.
- source_word: ἐλθόντες αὐτοὶ
  choice: Que venham eles mesmos
  rationale: Preserva a ênfase do pronome αὐτοὶ na presença pessoal dos magistrados.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: e nos conduzam para fora
  rationale: Mantém o sentido básico de conduzir ou levar para fora, sem acrescentar a formalidade implícita em 'escoltar'.
theological_decisions:
- issue: Força jurídico-cívica da condição romana de Paulo e Silas
  choice: cidadãos romanos
  alternative: romanos; homens romanos
  rationale: O argumento depende das proteções legais ligadas à cidadania romana; a formulação explicita o valor contextual sem introduzir uma interpretação doutrinária.
- issue: Sentido jurídico de ἀκατακρίτους
  choice: sem condenação
  alternative: sem julgamento; sem terem sido condenados
  rationale: A escolha preserva a afirmação estrita de que eles não haviam sido judicialmente condenados. A nota registra formas alternativas legítimas sem resolver além do grego a exata sequência processual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala mantém o tom firme e juridicamente incisivo de Paulo. Empregou-se “sem condenação” no texto principal para conservar a precisão lexical, enquanto a nota apresenta a interpretação processual “sem julgamento”. Todos os marcadores aparecem no texto principal em ordem alfabética.
