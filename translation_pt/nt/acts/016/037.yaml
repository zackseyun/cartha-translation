revisions:
- from: 'Mas Paulo lhes disse: “Depois de nos espancarem em público, sem condenação[a], embora sejamos cidadãos romanos[b], eles nos lançaram na prisão. E agora querem nos mandar embora às escondidas? De modo nenhum! Que venham eles mesmos e nos conduzam para fora[c].”'
  to: 'Mas Paulo lhes disse: “Depois de nos espancarem em público, sem que fôssemos condenados[a], embora sejamos cidadãos romanos[b], eles nos lançaram na prisão. E agora nos mandam embora às escondidas? De modo nenhum! Que venham eles mesmos e nos conduzam para fora[c].”'
