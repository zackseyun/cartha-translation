source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: pt
  text: E, depois que houve uma dissensão e um debate não pequenos entre Paulo e Barnabé e aqueles homens,[a] designaram Paulo, Barnabé e alguns outros dentre eles para subir[b] a Jerusalém, aos apóstolos e aos presbíteros, acerca dessa questão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma dissensão e um debate consideráveis”. O grego diz literalmente “não pequenos”, uma forma de enfatizar a gravidade da controvérsia.'
    reason: lexical_alternative
  - marker: b
    text: “Subir a Jerusalém” conserva a maneira habitual de falar de uma viagem a Jerusalém.
    reason: cultural_note
  - marker: c
    text: 'Ou: “acerca desse assunto” ou “sobre esse ponto em debate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: E, surgindo
  rationale: Reproduz de modo natural a circunstância introduzida pelo genitivo absoluto e mantém a conexão narrativa de δέ.
- source_word: στάσεως καὶ ζητήσεως
  choice: dissensão e debate
  rationale: A combinação distingue o conflito sério (στάσις) da discussão verbal ativa (ζήτησις), sem sugerir violência.
- source_word: οὐκ ὀλίγης
  choice: não pequena
  rationale: Preserva a litotes grega, que enfatiza a intensidade da controvérsia.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: entre Paulo e Barnabé e aqueles homens
  rationale: Identifica naturalmente as partes da disputa; 'aqueles homens' retoma os vindos da Judeia no versículo anterior e evita a possível ambiguidade de 'eles' em português.
- source_word: ἔταξαν
  choice: decidiram que ... subissem
  rationale: Neste contexto, expressa a determinação comunitária de enviar representantes, sem impor uma estrutura institucional mais formal do que o grego exige.
- source_word: ἀναβαίνειν
  choice: subissem
  rationale: Conserva o modo tradicional de descrever a viagem a Jerusalém, cidade situada nas terras altas e concebida como destino ao qual se sobe.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: alguns outros dentre eles
  rationale: Indica que outros delegados foram escolhidos do próprio grupo, sem acrescentar gênero ou função não explicitados.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: os apóstolos e os presbíteros
  rationale: Mantém os títulos reconhecíveis no contexto de Atos; 'presbíteros' é corrente e preciso em português bíblico.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: para tratar dessa questão
  rationale: Expressa o propósito da ida e o assunto controverso indicado por ζήτημα em português claro e atual.
theological_decisions:
- issue: Identificação das partes em conflito
  choice: A dissensão é apresentada entre Paulo e Barnabé e 'aqueles homens', isto é, os homens vindos da Judeia mencionados no versículo anterior.
  alternative: 'Traduzir de modo mais literal e potencialmente ambíguo: ''Paulo e Barnabé com eles''.'
  rationale: A formulação explicita o referente narrativo imediato sem introduzir conclusão doutrinária ou intensificar a hostilidade.
- issue: Nuance institucional de ἔταξαν
  choice: decidiram que ... subissem
  alternative: designaram Paulo e Barnabé; determinaram que subissem
  rationale: A tradução comunica uma decisão comunitária e organizada, mas não especifica quem tomou a decisão nem pressupõe uma forma particular de governo eclesiástico.
- issue: Relação de πρὸς com os apóstolos e presbíteros
  choice: para tratar dessa questão com os apóstolos e os presbíteros
  alternative: aos apóstolos e presbíteros, acerca dessa questão
  rationale: A redação portuguesa torna clara a finalidade da viagem sem afirmar antecipadamente qual autoridade ou procedimento decisório seria empregado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A litotes foi preservada no texto; 'aqueles homens' esclarece o referente contextual; 'presbíteros' mantém a terminologia tradicional sem definir uma estrutura denominacional.
