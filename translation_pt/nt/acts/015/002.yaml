  naturalness: «E, depois que houve...» é mais idiomático e claro em português moderno do que «E, surgindo...», que deixa a abertura excessivamente comprimida. A ordem revista também evita que «com os apóstolos e os presbíteros» pareça alterar a relação sintática da viagem.
  terminology: «Dissensão», «debate», «apóstolos», «presbíteros» e «questão» são adequados, compreensíveis e consistentes com o registro bíblico moderno. «Aqueles homens» retoma de modo legítimo os homens mencionados no versículo anterior, sem acrescentar identificação doutrinária.
