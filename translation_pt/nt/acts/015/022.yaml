  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: pt
  text: 'Então os apóstolos e os presbíteros, juntamente com toda a igreja, acharam por bem escolher dentre eles alguns homens e enviá-los a Antioquia com Paulo e Barnabé: Judas, chamado Barsabás, e Silas, homens que eram líderes entre os irmãos[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” aqui provavelmente se refere de modo mais amplo à comunidade dos fiéis, incluindo as mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: acharam por bem
  rationale: Expressão deliberativa natural em português, que comunica uma avaliação e decisão coletivas sem transformá-la explicitamente em decreto formal.
- source_word: πρεσβυτέροις
  choice: presbíteros
  rationale: Termo corrente e reconhecível no português bíblico para os responsáveis da comunidade; preserva a designação eclesial do grego.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: juntamente com toda a igreja
  rationale: Inclui naturalmente toda a comunidade cristã na deliberação, conforme o valor de σύν, sem impor um modelo específico de governo eclesiástico.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: escolher dentre eles alguns homens
  rationale: Reproduz a escolha de delegados masculinos pertencentes ao próprio grupo; “alguns” torna natural em português o substantivo plural indefinido.
- source_word: πέμψαι
  choice: enviá-los
  rationale: O pronome explicita de modo natural que os homens escolhidos seriam enviados.
- source_word: σὺν τῷ Παύλῳ καὶ Βαρναβᾷ
  choice: com Paulo e Barnabé
  rationale: Expressa diretamente a ideia de acompanhamento.
- source_word: καλούμενον
  choice: chamado
  rationale: Forma concisa e natural para indicar o nome pelo qual Judas era conhecido.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: homens que exerciam liderança entre os irmãos
  rationale: Comunica liderança reconhecida sem converter necessariamente a expressão em título ou cargo formal.
- source_word: ἀδελφοῖς
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; neste uso comunitário, ela provavelmente abrange o conjunto dos fiéis, o que é esclarecido em nota.
theological_decisions:
- issue: Extensão da participação da congregação na decisão
  choice: Toda a igreja aparece juntamente com os apóstolos e os presbíteros na deliberação, escolha e envio.
  alternative: Somente os apóstolos e os presbíteros decidiram formalmente, enquanto a igreja apenas estava presente.
  rationale: A posição e o sentido de σὺν ὅλῃ τῇ ἐκκλησίᾳ favorecem a inclusão de toda a igreja na ação, sem que a tradução determine uma forma particular de governo eclesiástico.
- issue: Alcance de ἀδελφοῖς
  choice: “irmãos” no texto, com explicação do provável sentido comunitário inclusivo em nota.
  alternative: “irmãos e irmãs” ou “fiéis” no texto principal.
  rationale: A tradução preserva a forma masculina do original e, ao mesmo tempo, não oculta que o termo podia designar coletivamente a comunidade cristã.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acharam por bem” preserva o tom deliberativo; “exerciam liderança” evita sugerir um cargo formal não explicitado pelo texto.
