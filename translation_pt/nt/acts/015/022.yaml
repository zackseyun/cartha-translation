  naturalness: O texto é claro, moderno e adequado ao registro bíblico em português. «Homens que eram líderes entre os irmãos» é mais idiomático e direto do que «homens que exerciam liderança», além de evitar o imperfeito, que pode dar uma nuance temporal não marcada no grego. O marcador de nota deve seguir imediatamente «irmãos», antes do ponto final.
  terminology: «Igreja», «presbíteros», «Antioquia», «Barnabé», «Barsabás» e «irmãos» são terminologia e grafias adequadas. A nota preserva, sem alterar o texto principal, o provável emprego comunitário inclusivo de ἀδελφοῖς.
