id: ACT.15.20
reference: Acts 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: pt
  text: mas escrever-lhes que se abstenham das contaminações ligadas aos ídolos[a], da imoralidade sexual[b], do que foi estrangulado[c] e do sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das contaminações causadas pelos ídolos”. Algumas traduções restringem a expressão a “alimentos sacrificados aos ídolos”, mas o grego empregado aqui é mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “da fornicação”. O termo grego pode designar amplamente a imoralidade sexual; alguns o entendem aqui, de modo mais específico, como referência a uniões sexuais proibidas.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “do estrangulado”, isto é, da carne de um animal morto sem que seu sangue fosse devidamente drenado.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: escrever-lhes
  rationale: No contexto da carta decidida pelo concílio de Jerusalém, o infinitivo indica transmitir por escrito uma orientação; “escrever-lhes” é natural e preserva o sentido epistolar.
- source_word: ἀπέχεσθαι
  choice: que se abstenham
  rationale: O uso médio expressa manter-se afastado de algo. “Abster-se” é claro e adequado ao contexto de proibições.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: das contaminações ligadas aos ídolos
  rationale: ἀλίσγημα denota contaminação ou profanação, sobretudo cultual. “Ligadas aos ídolos” expressa naturalmente a relação genitiva sem limitar a expressão apenas a alimentos sacrificados.
- source_word: πορνείας
  choice: da imoralidade sexual
  rationale: A expressão portuguesa é atual e preserva a amplitude lexical de πορνεία, sem restringi-la indevidamente a relações pré-matrimoniais.
- source_word: τοῦ πνικτοῦ
  choice: do que foi estrangulado
  rationale: Mantém a forma substantivada do grego sem inserir “carne” no texto principal; o referente cultural é explicado em nota.
- source_word: τοῦ αἵματος
  choice: do sangue
  rationale: Tradução direta e sucinta, sem explicitar no texto principal uma finalidade ou aplicação que o grego deixa implícita.
theological_decisions:
- issue: Alcance da proibição relacionada aos ídolos
  choice: “contaminações ligadas aos ídolos”
  alternative: “alimentos sacrificados aos ídolos”
  rationale: O grego emprega ἀλισγημάτων τῶν εἰδώλων, expressão mais ampla que o termo específico para alimentos sacrificados a ídolos. A tradução conserva essa amplitude.
- issue: Sentido de πορνεία no decreto apostólico
  choice: “imoralidade sexual” em sentido lexical amplo
  alternative: “relações sexuais proibidas” ou “fornicação”
  rationale: O termo pode designar amplamente a imoralidade sexual, embora alguns o entendam neste contexto como referência mais específica a uniões proibidas. O texto principal não resolve a discussão.
- issue: Natureza e duração das proibições alimentares
  choice: Apresentar simplesmente as abstinências ordenadas
  alternative: Explicitá-las como medidas temporárias de comunhão à mesa ou como mandamentos universais permanentes
  rationale: O versículo apresenta as proibições, mas não define aqui sua duração nem toda a sua fundamentação teológica; a tradução evita impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “contaminações ligadas aos ídolos” evita a estranheza de “contaminações dos ídolos” e conserva a amplitude do original. Os marcadores [a], [b] e [c] aparecem junto aos termos correspondentes no texto.
