source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: pt
  text: homens que arriscaram a própria vida[a] pelo nome de nosso Senhor Jesus, o Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “entregaram a própria vida”; a expressão grega indica que se expuseram a perigo mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: homens
  rationale: O termo se refere especificamente a Barnabé e Paulo no contexto imediato; por isso, “homens” é preciso, e não uma generalização sobre pessoas de ambos os sexos.
- source_word: παραδεδωκόσι
  choice: expuseram ... ao perigo
  rationale: O particípio perfeito de παραδίδωμι significa literalmente “tendo entregado”. Com “vida” e ὑπέρ, comunica que eles se colocaram em risco mortal, sem afirmar que de fato morreram.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: a própria vida
  rationale: Neste contexto, ψυχή significa a vida da pessoa, não uma alma imaterial. O singular distributivo em português é natural para dois homens, cada qual expondo a própria vida.
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Com o genitivo, ὑπέρ indica aqui a causa ou o motivo pelo qual eles enfrentaram perigo.
- source_word: τοῦ ὀνόματος
  choice: do nome
  rationale: Mantém a expressão bíblica, que abrange a pessoa, a autoridade e a honra de Jesus sem reduzir sua amplitude a apenas “reputação” ou “autoridade”.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: “Senhor” preserva o título cristológico e corresponde ao uso consolidado de κύριος no Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui valor titular. “O Messias” traduz o sentido do título de forma idiomática em português; a vírgula deixa clara a aposição, embora o grego não tenha artigo antes de Χριστοῦ.
theological_decisions:
- issue: Sentido do sacrifício expresso por παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: expuseram a própria vida ao perigo
  alternative: entregaram a própria vida
  rationale: O texto aponta para exposição voluntária a perigo mortal, mas não diz que Barnabé e Paulo morreram. A formulação evita transformar risco em morte consumada e preserva a força da expressão.
- issue: Tradução de Χριστοῦ na sequência κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: O termo grego significa “Ungido” e funciona como título de Jesus neste contexto. “Messias” explicita esse sentido sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Expuseram a própria vida ao perigo” é mais natural e semanticamente preciso que o literal “entregaram a vida”, que em português poderia sugerir morte efetiva. A ordem e a solenidade da designação final foram preservadas.
