  text: But[a] it seemed good to Silas to remain there.
translation:
  language: pt
  text: Mas Silas achou melhor permanecer ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles o Papiro 74, do século 3, e os códices Sinaítico e Vaticano, do século 4, nem em antigas traduções coptas. Está presente na tradição majoritária bizantina, em alguns manuscritos alexandrinos e ocidentais posteriores e nas tradições latina e siríaca. É provável que um copista posterior o tenha acrescentado para explicar por que Silas ainda estava em Antioquia e pôde acompanhar Paulo no versículo 40, embora o versículo 33 diga que ele e Judas partiram.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε ... τῷ Σίλᾳ (δοκέω)
  choice: Silas achou melhor
  rationale: A construção impessoal com o dativo expressa que algo pareceu bom a Silas, isto é, que ele considerou melhor agir assim. A formulação conserva o sentido idiomático em português natural sem tornar a decisão mais enfática do que o grego.
- source_word: ἐπιμεῖναι (ἐπιμένω)
  choice: permanecer
  rationale: Indica continuar ou ficar em determinado lugar; «permanecer» é claro, digno e adequado ao contexto.
- source_word: αὐτοῦ
  choice: ali
  rationale: Aqui funciona como advérbio de lugar e retoma Antioquia, o local mencionado no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Achou melhor» reproduz naturalmente o valor idiomático de ἔδοξε sem a rigidez de «pareceu bem a Silas»; «permanecer ali» conserva com precisão o movimento semântico e a referência espacial do original.
