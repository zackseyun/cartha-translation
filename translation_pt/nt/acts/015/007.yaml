source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: pt
  text: 'Depois de muita discussão, Pedro se levantou e lhes disse: “Irmãos[a], vocês sabem que, desde os primeiros dias[b], Deus me escolheu entre vocês para que, por meio da minha boca, os gentios[c] ouvissem a palavra do evangelho e cressem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Homens, irmãos”. O vocativo grego está no masculino plural e era uma forma convencional de se dirigir ao grupo; ele pode representar uma audiência mais ampla.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde dias antigos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “as nações”. Aqui, a expressão se refere aos povos não judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Depois de muita discussão
  rationale: O genitivo absoluto indica uma circunstância anterior. “Discussão” comunica a deliberação controversa do conselho sem necessariamente sugerir hostilidade.
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Reproduz de modo natural e concreto a ação que precede a fala de Pedro.
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: Mantém o tom familiar e a forma masculina plural do vocativo convencional, sem acrescentar uma explicitação inclusiva ausente do grego.
- source_word: ἐπίστασθε
  choice: vocês sabem
  rationale: Expressa diretamente o conhecimento que Pedro atribui aos ouvintes.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: desde os primeiros dias
  rationale: No contexto, aponta para uma fase anterior da missão cristã conhecida pelos ouvintes; esta formulação é natural em português e evita que “dias antigos” sugira uma antiguidade remota.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Deus me escolheu dentre vocês
  rationale: A construção reflete a escolha divina de Pedro no âmbito do grupo. A primeira pessoa está semanticamente especificada pela expressão subsequente “minha boca”.
- source_word: διὰ τοῦ στόματός μου
  choice: por meio da minha boca
  rationale: Preserva a imagem concreta do grego e apresenta Pedro como instrumento da proclamação.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: No contexto do concílio de Jerusalém, designa os povos não judeus, não meramente nações políticas.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: a palavra do evangelho
  rationale: Conserva a textura formal da expressão lucana e permanece compreensível em português moderno.
- source_word: πιστεῦσαι
  choice: cressem
  rationale: Coordena-se com “ouvissem” como finalidade da escolha divina, sem ampliar o verbo com formulação teológica adicional.
theological_decisions:
- issue: Vocativo masculino Ἄνδρες ἀδελφοί em uma assembleia possivelmente representativa
  choice: Irmãos
  alternative: Homens, irmãos; irmãos e irmãs
  rationale: “Irmãos” preserva o gênero gramatical e o tom familiar do original. A possível abrangência convencional do vocativo é informada em nota, sem ser inserida no texto.
- issue: Sentido de τὰ ἔθνη no contexto histórico-salvífico
  choice: os gentios
  alternative: as nações
  rationale: O contexto imediato contrasta judeus e não judeus; “gentios” mantém essa distinção central sem negar o sentido lexical mais amplo de “nações”.
- issue: Relação sintática de ἐν ὑμῖν com a escolha divina
  choice: Deus me escolheu dentre vocês
  alternative: Deus escolheu entre vocês que, por meio da minha boca...
  rationale: A tradução explicita Pedro como o escolhido, leitura naturalmente indicada por “por meio da minha boca”, mas reconhece que a formulação grega é menos explicitamente pessoal.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com legibilidade brasileira. Emprega “vocês” por naturalidade internacional com forte clareza no Brasil. Mantém imagens marcantes do original, como “por meio da minha boca”, e usa notas para alternativas lexicais genuínas.
