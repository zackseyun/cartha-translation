source:
  edition: SBLGNT
  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: pt
  text: Por isso, enviamos Judas e Silas, que eles mesmos lhes comunicarão oralmente[a] as mesmas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «por meio da palavra»; isto é, oralmente, em complemento à carta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: enviamos
  rationale: O perfeito grego apresenta o envio como ação concluída com relevância presente. Em português, o pretérito perfeito simples é a forma epistolar mais natural e pode transmitir essa relação com a situação atual; «temos enviado» sugeriria repetição ou continuidade.
- source_word: οὖν
  choice: Por isso
  rationale: Explicita de maneira natural a conclusão decorrente da decisão e do envio da carta mencionados no contexto.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Judas e Silas
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: αὐτοὺς
  choice: que ... pessoalmente
  rationale: Preserva a ênfase de que os próprios mensageiros confirmarão o conteúdo, sem recorrer à construção pouco natural «eles mesmos» dentro da oração relativa.
- source_word: διὰ λόγου
  choice: pessoalmente
  rationale: No contraste contextual com a carta escrita, indica comunicação oral feita pelos mensageiros presentes. A nota registra a forma mais literal e evita ocultar a expressão grega.
- source_word: ἀπαγγέλλοντας
  choice: comunicarão
  rationale: O particípio descreve o que Judas e Silas farão em decorrência do envio. O futuro finito produz português claro e natural.
- source_word: τὰ αὐτά
  choice: as mesmas coisas
  rationale: Mantém a referência ampla ao conteúdo da carta sem reduzi-la interpretativamente a «a mesma mensagem».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pretérito perfeito simples evita o valor iterativo que «temos enviado» normalmente teria em português. A ênfase de αὐτούς foi incorporada por «pessoalmente»; a nota esclarece a expressão διὰ λόγου.
