  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: pt
  text: Paulo e Barnabé, porém, permaneceram em Antioquia[a], ensinando e anunciando como boa-nova[b] a palavra do Senhor[c], juntamente com muitos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passaram algum tempo em Antioquia”. O verbo grego pode enfatizar que permaneceram ali por certo período.
    reason: lexical_alternative
  - marker: b
    text: Ou “pregando o evangelho”. O verbo grego significa anunciar ou proclamar boas notícias.
    reason: lexical_alternative
  - marker: c
    text: “A palavra do Senhor” é uma expressão comum em Atos para a mensagem do Senhor; “a mensagem do Senhor” é uma tradução possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: permaneceram
  rationale: O imperfeito indica permanência continuada ou tempo passado em determinado lugar. “Permaneceram” é natural, digno e conserva o aspecto durativo; a nota registra a alternativa idiomática.
- source_word: διδάσκοντες
  choice: ensinando
  rationale: Tradução direta do particípio, mantendo a atividade contínua que acompanhava a permanência em Antioquia.
- source_word: εὐαγγελιζόμενοι
  choice: anunciando as boas-novas
  rationale: O verbo designa o anúncio de boas notícias. A formulação é clara em português atual e mantém seu sentido evangelístico sem depender de jargão eclesiástico.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: junto com muitos outros
  rationale: Expressa com naturalidade que muitos outros também participavam dessas atividades; “junto com” comunica a relação de companhia, e o valor aditivo de καί fica implícito no contexto.
- source_word: λόγον
  choice: palavra
  rationale: Embora λόγος também possa significar “mensagem”, “palavra do Senhor” preserva uma expressão recorrente e literariamente significativa em Atos.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém o título κύριος sem explicitar além do que o texto grego afirma.
theological_decisions:
- issue: Referente de “Senhor” em “palavra do Senhor”
  choice: Manter “Senhor” sem especificar o referente
  alternative: “palavra do Senhor Jesus” ou “mensagem divina”
  rationale: Em Atos, o título frequentemente pode apontar em especial para Jesus, mas a expressão grega não explicita o referente. A tradução preserva essa abertura teológica.
- issue: Relação de “a palavra do Senhor” com os dois particípios
  choice: Apresentá-la como conteúdo tanto do ensino quanto do anúncio das boas-novas
  alternative: Ligá-la apenas ao anúncio das boas-novas
  rationale: A posição final do objeto no grego permite entendê-lo naturalmente como conteúdo compartilhado de διδάσκοντες e εὐαγγελιζόμενοι; a redação portuguesa conserva essa leitura sem inserir outro objeto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural sem perder a coordenação das atividades. Empregou-se “boas-novas” para tornar explícito o sentido de εὐαγγελίζομαι, e “palavra do Senhor” foi preservado por sua continuidade literária em Atos.
