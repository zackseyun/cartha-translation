source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: pt
  text: 'Mas alguns que pertenciam ao partido[a] dos fariseus e que haviam crido levantaram-se e disseram: “É necessário circuncidá-los e ordenar-lhes que guardem a Lei de Moisés.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seita dos fariseus”. A palavra grega designa aqui um partido ou uma corrente reconhecida, não necessariamente uma “heresia” no sentido técnico posterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: se levantaram
  rationale: Expressa naturalmente a ação de levantar-se para falar na assembleia, sem acrescentar a ideia mais interpretativa de oposição.
- source_word: τινες
  choice: alguns
  rationale: Equivalente indefinido e natural, sem acrescentar uma referência explícita a homens.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: do partido dos fariseus
  rationale: Aqui αἵρεσις designa um grupo ou corrente reconhecida; “partido” evita o sentido técnico posterior e pejorativo de “heresia”.
- source_word: πεπιστευκότες
  choice: que haviam crido
  rationale: Preserva o valor verbal do particípio perfeito e indica uma ação anterior cujo resultado permanecia, sem apagar a tensão narrativa.
- source_word: λέγοντες
  choice: e disseram
  rationale: Em português narrativo, uma oração coordenada comunica com naturalidade a fala simultânea subsequente, mantendo o tom neutro do particípio.
- source_word: δεῖ
  choice: É necessário
  rationale: Mantém a formulação impessoal e deixa implícita, como no grego, a fonte da necessidade alegada.
- source_word: περιτέμνειν αὐτούς
  choice: circuncidá-los
  rationale: Reproduz de modo direto a construção infinitiva e seu objeto.
- source_word: παραγγέλλειν
  choice: ordenar-lhes
  rationale: Conserva a força de uma determinação autoritativa; o pronome explicita em português o destinatário já presente em αὐτούς.
- source_word: τε τηρεῖν
  choice: que guardem
  rationale: A oração subordinada é a construção portuguesa natural após “ordenar-lhes” e “guardar” é linguagem corrente para observar uma lei.
- source_word: τὸν νόμον Μωϋσέως
  choice: a Lei de Moisés
  rationale: Tradução direta e reconhecível do genitivo, com maiúscula editorial para a designação do corpo legal mosaico.
theological_decisions:
- issue: Sentido de αἵρεσις no contexto de um grupo judaico
  choice: partido
  alternative: seita
  rationale: O termo identifica uma corrente reconhecida dentro do judaísmo, não necessariamente uma heresia no sentido eclesiástico posterior. “Partido” evita esse anacronismo, enquanto “seita” continua sendo alternativa lexical legítima.
- issue: Força de πεπιστευκότες
  choice: que haviam crido
  alternative: que eram crentes
  rationale: A forma verbal apresenta esses fariseus como pessoas que chegaram à fé e ainda assim defendiam a circuncisão e a observância da Lei para os gentios. A tradução conserva essa tensão sem redefinir a condição espiritual deles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reestruturada para soar natural, sem alterar as relações do texto grego.
