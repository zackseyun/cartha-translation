  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: pt
  text: Depois de passarem algum tempo ali, os irmãos os despediram em paz, para junto dos que os tinham enviado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, mas neste contexto provavelmente se refere de modo inclusivo à comunidade dos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Depois de passarem algum tempo ali
  rationale: A expressão idiomática grega significa permanecer ou passar certo período. “Ali” é suprido naturalmente pelo contexto da permanência em Antioquia.
- source_word: δὲ
  choice: Depois de
  rationale: A partícula é um conectivo narrativo brando; em português, a ligação é expressa com naturalidade pela estrutura temporal, sem necessidade de um “e” adicional.
- source_word: ἀπελύθησαν
  choice: foram despedidos
  rationale: No contexto, indica que a comunidade lhes deu licença para partir, não que foram libertados de prisão ou obrigação.
- source_word: μετ’ εἰρήνης
  choice: em paz
  rationale: Preserva a fórmula de despedida e comunica boa vontade, harmonia e bênção na partida.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: pelos irmãos
  rationale: A preposição marca aqui aqueles de quem receberam a despedida. “Irmãos” preserva a forma masculina plural do grego, com nota sobre seu provável alcance comunitário inclusivo.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: e voltaram para os que os tinham enviado
  rationale: O particípio substantivado identifica os que anteriormente os enviaram. “Voltaram” torna explícito em português o movimento de regresso exigido pelo contexto e pela construção de destino, embora o verbo não apareça separadamente no grego.
theological_decisions:
- issue: Alcance inclusivo de ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs; crentes
  rationale: A forma grega é masculina plural, mas provavelmente designa inclusivamente a comunidade cristã. Mantém-se a forma da fonte no texto e esclarece-se o alcance provável em nota, sem implicar uma restrição apenas a homens.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A redação conserva a expressão tradicional “em paz” e evita termos excessivamente formais.
