  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: pt
  text: que se abstenham do que foi sacrificado aos ídolos[a], do sangue, do que foi estrangulado[b] e da imoralidade sexual[c]. Se vocês se guardarem dessas coisas, farão bem. Passem bem[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos alimentos sacrificados aos ídolos».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «da carne de animais estrangulados» ou «das coisas estranguladas».'
    reason: lexical_alternative
  - marker: c
    text: O termo grego traduzido como «imoralidade sexual» pode ser entendido de modo amplo, embora alguns intérpretes o considerem aqui mais específico, à luz das proibições de Levítico.
    reason: alternative_reading
  - marker: d
    text: 'Ou: «Fiquem bem». O grego emprega uma fórmula convencional de encerramento de carta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: que se abstenham
  rationale: O infinitivo expressa o conteúdo da instrução. A construção com «que» se encaixa naturalmente na continuação da carta, e «abster-se» preserva de modo claro e conciso a força do verbo.
- source_word: εἰδωλοθύτων
  choice: do que foi sacrificado aos ídolos
  rationale: O termo designa aquilo que foi oferecido em culto idolátrico, sobretudo alimento ou carne. A formulação mantém a abrangência substantiva do grego sem restringi-la no texto principal.
- source_word: αἵματος
  choice: do sangue
  rationale: Tradução direta do termo grego, conservando a formulação concisa e o contexto proibitivo.
- source_word: πνικτῶν
  choice: do que foi estrangulado
  rationale: O adjetivo substantivado refere-se ao que foi morto por estrangulamento, provavelmente animais cuja carne não teve o sangue devidamente drenado. A tradução preserva a forma abrangente do original.
- source_word: πορνείας
  choice: da imoralidade sexual
  rationale: Expressão moderna e abrangente que evita tanto o arcaísmo quanto a limitação semântica de «fornicação».
- source_word: ἐξ ὧν
  choice: dessas coisas
  rationale: Retoma com clareza e naturalidade os itens da lista anterior.
- source_word: διατηροῦντες ἑαυτούς
  choice: Se vocês se guardarem
  rationale: Embora seja formalmente uma construção participial, seu valor pode ser expresso naturalmente como condição em português. O verbo pronominal preserva a ideia de manter-se afastado ou protegido.
- source_word: εὖ πράξετε
  choice: farão bem
  rationale: Reproduz de maneira idiomática a avaliação positiva da observância dessas instruções sem especificar indevidamente se o sentido é moral, prudencial ou de bem-estar.
- source_word: ἔρρωσθε
  choice: Saudações
  rationale: Neste contexto, o imperativo funciona como fórmula convencional de encerramento epistolar. «Saudações» é natural em português e evita transformar a despedida em uma exortação literal à força.
theological_decisions:
- issue: Sentido de πορνεία no decreto apostólico
  choice: imoralidade sexual
  alternative: fornicação; união ou casamento ilícito à luz das proibições de Levítico 18
  rationale: O termo pode ter sentido amplo ou, segundo alguns intérpretes, referir-se mais especificamente a uniões proibidas no contexto levítico. Como o versículo não explicita tal restrição, o texto principal conserva o valor lexical amplo e a nota registra a alternativa.
- issue: Relação entre sangue e o que foi estrangulado
  choice: manter os dois itens separadamente
  alternative: explicitar que o segundo significa carne da qual o sangue não foi drenado
  rationale: O grego apresenta itens coordenados distintos. A tradução não funde nem explica um pelo outro, preservando a forma e a possível tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento «vocês» é natural nesse registro. A tradução mantém a concisão da lista e usa uma despedida epistolar corrente. Todos os marcadores de nota aparecem no texto principal.
