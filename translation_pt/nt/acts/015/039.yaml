revisions:
- from: E houve uma divergência tão intensa que eles se separaram um do outro[a]. Barnabé levou Marcos consigo e partiu de navio para Chipre,
  to: E houve uma forte desavença, de modo que se separaram um do outro. Barnabé levou Marcos consigo e partiu por mar para Chipre,
  rationale: A revisão substitui uma expressão potencialmente branda por «forte desavença», mais próxima da força contextual de παροξυσμός, e troca a formulação pouco idiomática «partiu de navio» por «partiu por mar». A nota permanece ancorada ao resultado da desavença e conserva alternativas lexicais relevantes. A vírgula final é mantida porque a construção iniciada com Barnabé recebe sua contraparte no versículo seguinte.
