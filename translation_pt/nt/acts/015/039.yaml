base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: pt
  text: E houve uma forte desavença, de modo que se separaram um do outro. Barnabé levou Marcos consigo e partiu por mar para Chipre,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: E houve
  rationale: Introduz naturalmente o novo acontecimento na progressão narrativa, sem exagerar o contraste de δέ.
- source_word: παροξυσμὸς
  choice: divergência tão intensa
  rationale: Expressa um confronto agudo entre Paulo e Barnabé em português atual, preservando a gravidade sem implicar mais do que o termo grego exige.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: que eles se separaram um do outro
  rationale: A construção consecutiva ὥστε com infinitivo é vertida por uma oração finita natural, mantendo a relação entre intensidade e resultado.
- source_word: τόν τε Βαρναβᾶν
  choice: Barnabé
  rationale: τε introduz a primeira ação decorrente da separação, cuja contraparte aparece no versículo seguinte; a estrutura em português não exige um conectivo explícito após o ponto.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: levou Marcos consigo
  rationale: Torna explícito o sentido contextual de levar alguém junto, sem acrescentar a identificação mais completa 'João Marcos', ausente neste versículo.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: partiu de navio para Chipre
  rationale: Preserva tanto a ideia de partida por mar em ἐκπλέω quanto o destino indicado por εἰς.
theological_decisions:
- issue: Retrato narrativo do conflito entre cooperadores apostólicos
  choice: divergência tão intensa
  alternative: forte desavença; conflito tão acirrado
  rationale: Mantém de modo direto a realidade e a intensidade do conflito entre Paulo e Barnabé, sem amenizá-lo, moralizá-lo ou intensificá-lo além da evidência lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação pesada e conserva o fluxo para o versículo seguinte. A vírgula final foi mantida porque o trecho fornecido continua sintaticamente no v. 40.
