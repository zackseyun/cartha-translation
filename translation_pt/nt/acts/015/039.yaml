    issue: «divergência tão intensa» pode atenuar παροξυσμός.
    rationale: No contexto, o termo descreve um embate agudo que resultou na separação. «Forte desavença» comunica esse grau de conflito com maior precisão, sem interpretá-lo como algo além de uma disputa intensa.
  - severity: low
    issue: «partiu de navio» é formulação pouco natural.
    rationale: «Partiu por mar» é idiomático em português moderno e conserva o valor de ἐκπλέω, isto é, partir navegando.
  revised_text: E houve uma forte desavença, de modo que se separaram um do outro. Barnabé levou Marcos consigo e partiu por mar para Chipre,
