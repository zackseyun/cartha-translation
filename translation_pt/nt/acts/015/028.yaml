  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: pt
  text: Pois pareceu bem ao Espírito Santo e a nós não impor a vocês nenhum outro peso, exceto estas coisas necessárias:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi decidido pelo Espírito Santo e por nós”. A expressão grega também pode funcionar como uma fórmula formal de decisão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estas exigências indispensáveis” ou “estas coisas essenciais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: pareceu bem
  rationale: Preserva a fórmula deliberativa grega, que também pode expressar uma decisão formal, sem reduzi-la a mera preferência.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: ao Espírito Santo
  rationale: O dativo completa ἔδοξεν e apresenta o Espírito Santo como agente pessoal na aprovação da decisão.
- source_word: καὶ ἡμῖν
  choice: e a nós
  rationale: Mantém o paralelismo explícito com «ao Espírito Santo».
- source_word: μηδὲν πλέον
  choice: nenhum ... maior
  rationale: Com βάρος, conserva naturalmente o sentido comparativo de não acrescentar um peso maior.
- source_word: ἐπιτίθεσθαι
  choice: impor
  rationale: Expressa de modo corrente e preciso a ação de colocar uma obrigação sobre alguém, preservando a metáfora do peso.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Forma moderna, clara e amplamente compreensível, com referência aos destinatários da obrigação.
- source_word: βάρος
  choice: peso
  rationale: Preserva a metáfora concreta do grego e comunica naturalmente uma obrigação onerosa.
- source_word: πλὴν
  choice: além de
  rationale: Introduz a exceção depois da declaração negativa sem alterar o alcance limitado da decisão.
- source_word: τούτων τῶν ἐπάναγκες
  choice: destas coisas necessárias
  rationale: Mantém a formulação ampla e aponta para as estipulações do versículo seguinte sem definir antecipadamente sua natureza.
theological_decisions:
- issue: Relação do Espírito Santo com a decisão do concílio
  choice: «pareceu bem ao Espírito Santo e a nós»
  alternative: «foi decidido pelo Espírito Santo e por nós»
  rationale: A redação preserva a coordenação grega entre o Espírito Santo e a assembleia, reconhecendo a agência pessoal do Espírito sem eliminar a nuance idiomática e deliberativa de ἔδοξεν.
- issue: Alcance das obrigações impostas aos gentios
  choice: «nenhum peso maior além destas coisas necessárias»
  alternative: Uma rejeição de toda obrigação ou a imposição abrangente da Lei de Moisés
  rationale: A tradução conserva o caráter limitado das exigências mencionadas sem resolver a tensão por meio de um sistema doutrinário posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Pareceu bem» conserva o idioma deliberativo; «impor ... peso» soa natural e mantém a metáfora. Todos os marcadores de nota aparecem no texto principal.
