id: ACT.15.31
reference: Acts 15:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: pt
  text: Depois de lerem a carta, alegraram-se com o encorajamento que ela trazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alegraram-se por causa do encorajamento”. A palavra traduzida como “encorajamento” também pode significar “exortação” ou “consolo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Depois de lerem a carta
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. O objeto não está expresso no grego, mas é claramente a carta mencionada no contexto anterior; explicitá-lo produz português natural.
- source_word: δὲ
  choice: não traduzido separadamente
  rationale: A partícula marca uma transição leve. Em português, a sequência temporal iniciada por “Depois de” já estabelece a ligação sem exigir uma conjunção adicional.
- source_word: ἐχάρησαν
  choice: alegraram-se
  rationale: Preserva o sentido ativo e a força emocional de χαίρω em linguagem atual e digna.
- source_word: ἐπὶ
  choice: com
  rationale: Com o dativo, ἐπί indica aqui a base ou causa da alegria. “Com” é uma formulação portuguesa natural, sem excluir a nuance causal.
- source_word: τῇ παρακλήσει
  choice: o encorajamento que ela trazia
  rationale: παράκλησις pode significar encorajamento, exortação ou consolo. “Encorajamento” abrange bem o efeito fortalecedor da mensagem, enquanto a oração relativa liga naturalmente esse efeito à carta sem sugerir que o possessivo esteja explícito no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A tradução explicita “a carta” a partir do contexto imediato e mantém em nota a amplitude semântica de παράκλησις.
