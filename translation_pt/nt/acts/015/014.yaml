  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: pt
  text: Simeão[a] relatou como, pela primeira vez, Deus visitou os gentios[b] para tomar dentre eles um povo para o seu nome[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Simão». Tiago usa aqui a forma «Simeão».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «dentre as nações».'
    reason: lexical_alternative
  - marker: c
    text: Isto é, um povo que pertence a Deus e é identificado com o seu nome.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simeão
  rationale: Mantém em português a forma específica usada por Tiago neste versículo, sem harmonizá-la com a forma mais conhecida «Simão».
- source_word: ἐξηγήσατο
  choice: relatou
  rationale: O verbo indica expor ou narrar um acontecimento; «relatou» comunica com naturalidade que Simeão acabara de apresentar esse relato à assembleia.
- source_word: καθὼς
  choice: como
  rationale: Depois de um verbo de relato, introduz o conteúdo e o modo da ação narrada; «como» é natural e preserva essa função.
- source_word: πρῶτον
  choice: pela primeira vez
  rationale: Indica o início da ação divina em relação aos gentios; esta formulação é clara em português sem eliminar a ênfase temporal.
- source_word: ἐπεσκέψατο
  choice: visitou
  rationale: Preserva o idioma bíblico de uma visita marcada por atenção e intervenção intencional de Deus, sem reduzir o termo a uma paráfrase interpretativa.
- source_word: λαβεῖν
  choice: para tomar
  rationale: O infinitivo expressa propósito. «Tomar» representa diretamente λαβεῖν e evita acrescentar ideias como reunir ou acolher.
- source_word: ἐξ ἐθνῶν
  choice: dentre os gentios
  rationale: No contexto de Atos 15, ἔθνη designa os não judeus. A construção «dentre eles» no texto traduz a ideia de seleção a partir desse conjunto.
- source_word: λαὸν
  choice: um povo
  rationale: Preserva a ressonância bíblica e pactual de λαός, sem restringir o sentido a uma etnia ou a um grupo sociológico.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: para o seu nome
  rationale: Conserva a expressão bíblica teologicamente significativa, que aponta para um povo pertencente a Deus e associado ao seu nome, sem achatá-la para «para si mesmo».
theological_decisions:
- issue: Traduzir ἐξ ἐθνῶν por «gentios» ou «nações»
  choice: gentios
  alternative: nações
  rationale: O contexto imediato é a inclusão dos não judeus no povo de Deus. «Gentios» torna clara a oposição entre judeus e não judeus que estrutura a discussão, enquanto a nota preserva a alternativa lexical mais literal.
- issue: Parafrasear τῷ ὀνόματι αὐτοῦ como «para si mesmo»
  choice: para o seu nome
  alternative: para si mesmo
  rationale: A expressão contém linguagem bíblica de pertencimento e identificação pactual. Mantê-la preserva sua densidade teológica e não resolve indevidamente tudo o que a metáfora do nome implica.
- issue: Entender ἐπεσκέψατο como simples visita ou intervenção favorável
  choice: visitou
  alternative: voltou sua atenção para
  rationale: «Visitou» mantém a imagem do texto-fonte e sua possível conotação de cuidado e ação divina; a alternativa explicitaria apenas uma dimensão do verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mas foram preservados o idioma bíblico «Deus visitou» e a expressão teologicamente carregada «para o seu nome».
