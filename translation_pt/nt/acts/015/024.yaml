  source_fidelity: A versão comunica adequadamente a relação causal, a origem dos homens no grupo de Jerusalém, a perturbação causada por suas palavras e a negação de que tivessem recebido instruções. Contudo, a nota a chama «desmontando» de tradução literal, o que não é uma glosa lexical segura de ἀνασκευάζοντες. Além disso, a formulação parentética com travessões altera desnecessariamente a forma da oração relativa grega.
  naturalness: «Transtornando o íntimo de vocês» é compreensível, mas soa menos natural do que uma expressão que descreva a desestabilização interior das próprias pessoas. «Aos quais não demos instruções» é claro em português e mantém o referente sem recorrer a travessões.
  terminology: «Instruções» é uma boa tradução moderna de διεστειλάμεθα neste contexto. A nota deve apresentar «almas» como alternativa lexical para ψυχὰς, sem atribuir a ἀνασκευάζω um suposto sentido literal de «desmontar».
  issues:
  - severity: medium
    issue: A nota a contém a alegação «Literalmente, “desmontando as almas de vocês”».
