  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: pt
  text: Visto que soubemos que alguns que saíram do nosso meio perturbaram vocês com palavras[a], desestabilizando vocês por dentro, aos quais não demos instruções[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «perturbando a mente de vocês». Literalmente, «desestabilizando as almas de vocês»; «almas» aqui se refere às pessoas em seu íntimo, não apenas às emoções.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «aos quais não demos ordens».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Visto que
  rationale: Introduz naturalmente, em português, a razão que fundamenta a declaração da carta, preservando o valor causal.
- source_word: ἠκούσαμεν
  choice: soubemos
  rationale: No contexto de uma notícia recebida, «soubemos» é mais idiomático que o literal «ouvimos» e mantém a relevância presente do relato.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: alguns que saíram do nosso meio
  rationale: Mantém unidos a origem no grupo de Jerusalém e o ato de sair, sem afirmar mais do que o texto sobre a condição posterior dessas pessoas.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: perturbaram vocês com palavras
  rationale: Preserva tanto o efeito de inquietação quanto o caráter instrumental de λόγοις, sem especificar indevidamente o conteúdo do discurso.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: transtornando o íntimo de vocês
  rationale: ἀνασκευάζω comunica desestabilização profunda, e ψυχή aqui designa a pessoa em seu interior; a formulação evita sugerir apenas emoções ou uma antropologia técnica.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: e nós não lhes tínhamos dado instrução alguma
  rationale: A construção parentética esclarece em português que «lhes» se refere aos homens mencionados, preservando a negação explícita de qualquer orientação dada por Jerusalém.
theological_decisions:
- issue: Falta de autorização dos perturbadores
  choice: e nós não lhes tínhamos dado instrução alguma
  alternative: aos quais não demos ordem alguma
  rationale: A tradução mantém a afirmação de que eles não agiram segundo uma determinação da comunidade apostólica, mas evita transformar «instrução» em linguagem militar ou acrescentar o termo abstrato «autorização».
- issue: Sentido de ψυχή no contexto
  choice: o íntimo de vocês
  alternative: as almas de vocês
  rationale: O contexto descreve uma desestabilização interior das pessoas, não define uma doutrina sobre partes constitutivas do ser humano. A nota conserva transparência quanto à expressão grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» evita a rigidez regional de «vós». Os travessões marcam a observação parentética final e impedem que o pronome seja associado erroneamente aos destinatários.
