  - severity: low
    issue: A oração final foi convertida em comentário parentético entre travessões.
    rationale: O grego traz uma oração relativa, «aos quais não demos instruções». A forma relativa é natural em português, identifica inequivocamente os homens e evita acrescentar a nuance parentética.
  - severity: low
    issue: «Transtornando o íntimo de vocês» é algo rígido em registro moderno.
    rationale: «Desestabilizando vocês por dentro» preserva o efeito profundo sobre as pessoas indicado por τὰς ψυχὰς ὑμῶν e é mais idiomático, sem impor uma antropologia técnica.
