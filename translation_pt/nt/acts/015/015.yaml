  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: pt
  text: 'E com isso concordam as palavras dos profetas, conforme está escrito:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conectivo normal que introduz o apoio adicional apresentado por Tiago e mantém naturalmente o fluxo do discurso.
- source_word: τούτῳ
  choice: com isso
  rationale: O demonstrativo no dativo retoma de modo amplo o assunto ou a afirmação anterior. Com συμφωνέω, «concordar com isso» é a construção natural em português e preserva a ênfase pela posição inicial.
- source_word: συμφωνοῦσιν
  choice: concordam
  rationale: Presente ativo do indicativo, no plural, com o sentido de estar de acordo ou em harmonia; «concordam» é direto e atual.
- source_word: οἱ λόγοι
  choice: as palavras
  rationale: Refere-se às declarações proféticas preservadas nas Escrituras; «as palavras» é uma tradução formalmente próxima e natural.
- source_word: τῶν προφητῶν
  choice: dos profetas
  rationale: O genitivo indica que as palavras pertencem ou procedem dos profetas; a formulação é idiomática em português.
- source_word: καθὼς
  choice: conforme
  rationale: Introduz a citação bíblica indicando correspondência. «Conforme» comunica essa relação de maneira natural e digna.
- source_word: γέγραπται
  choice: está escrito
  rationale: Perfeito passivo usado como fórmula de citação das Escrituras. «Está escrito» preserva o valor resultativo e é a expressão consagrada e clara em português.
theological_decisions:
- issue: Referente de τούτῳ no discurso de Tiago
  choice: Demonstrativo neutro que retoma amplamente a afirmação ou o acontecimento anterior, traduzido como «isso» sem especificação interpretativa.
  alternative: Explicitar como a conversão dos gentios, a declaração de Pedro ou o propósito de Deus.
  rationale: O grego não nomeia precisamente o referente. A tradução preserva essa amplitude e evita impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «com isso concordam» conserva a ênfase do grego sem soar artificial. Não se acrescentou nota, pois «concordar com isso» reproduz naturalmente em português a construção grega, sem a alternativa idiomática específica exigida pelo inglês.
