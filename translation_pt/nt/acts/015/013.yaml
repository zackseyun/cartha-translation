base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: pt
  text: 'Depois que eles se calaram[a], Tiago respondeu: “Irmãos[b], escutem-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois que eles pararam de falar”. A expressão grega indica o momento posterior ao fim das falas anteriores.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Homens, irmãos”, dois vocativos masculinos em uma fórmula solene de tratamento.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Depois que eles se calaram
  rationale: A construção μετά com infinitivo articular indica tempo posterior, e σιγάω assinala que os oradores anteriores cessaram de falar. A formulação é natural em português e conserva a sequência narrativa.
- source_word: ἀπεκρίθη Ἰάκωβος λέγων
  choice: Tiago tomou a palavra e disse
  rationale: Neste contexto de deliberação pública, ἀπεκρίθη introduz a intervenção de Tiago após o silêncio dos demais. “Tomou a palavra” expressa naturalmente essa resposta discursiva, enquanto “e disse” representa λέγων sem a rigidez de “respondendo, dizendo”.
- source_word: Ἰάκωβος
  choice: Tiago
  rationale: É a forma portuguesa tradicional e amplamente reconhecida para o nome neotestamentário Ἰάκωβος neste personagem.
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: A expressão vocativa literalmente reúne “homens” e “irmãos”, mas funciona como uma fórmula solene de tratamento dirigida aos homens da assembleia. “Irmãos” é natural em português; a forma masculina explícita e a estrutura literal são registradas em nota.
- source_word: ἀκούσατέ μου
  choice: escutem-me
  rationale: O imperativo pede atenção ao que Tiago está prestes a dizer. “Escutem-me” preserva diretamente sua força e é corrente em português.
theological_decisions:
- issue: Tratamento masculino Ἄνδρες ἀδελφοί em discurso público
  choice: Irmãos, com nota explicativa
  alternative: Homens, irmãos
  rationale: Os dois vocativos gregos são masculinos, mas a reprodução literal seria pouco natural em português. O texto principal mantém o tratamento masculino “Irmãos”, e a nota torna explícita a forma original sem ampliar o referente para “irmãos e irmãs” nem decidir além da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A locução “tomou a palavra” evita a construção artificial “respondeu, dizendo” e se ajusta ao contexto deliberativo. Todas as notas possuem marcadores correspondentes no texto.
