lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Barnabé
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: δὲ
  choice: Mas
  rationale: Expressa a leve força adversativa no contexto, introduzindo a preferência de Barnabé em contraste com o rumo proposto por Paulo.
- source_word: ἐβούλετο
  choice: queria
  rationale: Verbo natural em português para expressar a vontade ou intenção de Barnabé, sem exagerar o grau de deliberação.
- source_word: συμπαραλαβεῖν
  choice: levar
  rationale: No contexto, indica incluir alguém como acompanhante do grupo; “levar” comunica isso com naturalidade, enquanto “também” reforça a inclusão.
- source_word: καὶ
  choice: também
  rationale: 'Preserva a força aditiva e enfática ligada ao objeto: Barnabé queria incluir João na viagem.'
- source_word: Ἰωάννην
  choice: João
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: chamado Marcos
  rationale: Reproduz de modo conciso a expressão identificadora, sem acrescentar um segundo “também”, que o grego não exige.
- source_word: Μᾶρκον
  choice: Marcos
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
