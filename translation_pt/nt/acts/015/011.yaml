  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: pt
  text: Mas cremos que seremos salvos pela graça do Senhor Jesus, assim como eles também serão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Mas, pela graça do Senhor Jesus, cremos ser salvos, da mesma maneira que eles também.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com o jugo que nem os antepassados nem a geração presente puderam suportar.
- source_word: διὰ τῆς χάριτος
  choice: pela graça
  rationale: διά com genitivo expressa aqui o meio pelo qual ocorre a salvação; em português, “pela graça” é natural e exato.
- source_word: χάριτος
  choice: graça
  rationale: Preserva o sentido de favor divino como meio ou fundamento da salvação, sem acrescentar formulações doutrinárias.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: O genitivo modifica naturalmente “graça”, indicando a graça que procede do Senhor Jesus.
- source_word: πιστεύομεν
  choice: cremos
  rationale: Tradução corrente e digna de πιστεύω, exprimindo convicção quanto ao conteúdo exposto pelo infinitivo.
- source_word: σωθῆναι
  choice: que somos salvos
  rationale: O infinitivo aoristo passivo não marca por si só tempo futuro. A forma presente em português preserva melhor essa indeterminação e expressa o modo comum de salvação de judeus e gentios.
- source_word: καθ’ ὃν τρόπον
  choice: da mesma maneira que
  rationale: Reproduz claramente a comparação de modo.
- source_word: κἀκεῖνοι
  choice: eles também
  rationale: Representa καὶ ἐκεῖνοι sem inserir um verbo ou tempo ausente no grego; no contexto, refere-se aos gentios.
theological_decisions:
- issue: Direção da comparação na declaração de Pedro
  choice: “nós” somos salvos da mesma maneira que “eles também”
  alternative: Eles serão salvos da mesma maneira que nós
  rationale: A ordem e a construção gregas tomam a salvação dos gentios como termo da comparação para a dos judeus, sublinhando que os gentios não precisam primeiro tornar-se judeus.
- issue: Valor temporal de σωθῆναι
  choice: “somos salvos”
  alternative: “seremos salvos” ou “havemos de ser salvos”
  rationale: O infinitivo aoristo não codifica necessariamente futuro. O presente português preserva a afirmação geral sobre o meio da salvação e evita resolver uma ambiguidade que o original deixa aberta.
- issue: Salvação pela graça
  choice: A salvação ocorre pela graça do Senhor Jesus
  alternative: Expansões como “somente pela graça, mediante a fé somente”
  rationale: O versículo menciona explicitamente a graça e o ato de crer, mas não autoriza inserir fórmulas confessionais mais desenvolvidas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cremos” mantém o registro bíblico sem soar arcaico. A redação conserva a direção incomum e teologicamente relevante da comparação grega.
