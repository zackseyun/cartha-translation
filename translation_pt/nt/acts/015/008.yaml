  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: pt
  text: E Deus, que conhece os corações, testemunhou em favor deles, dando-lhes o Espírito Santo, assim como também a nós,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: que conhece os corações
  rationale: O composto raro designa aquele que conhece o íntimo humano. A oração relativa é natural em português e preserva o atributo divino; o plural «corações» corresponde bem ao sentido geral do termo.
- source_word: θεὸς
  choice: Deus
  rationale: Equivalente padrão neste contexto, com καρδιογνώστης em aposição atributiva.
- source_word: ἐμαρτύρησεν
  choice: deu testemunho a favor deles
  rationale: Preserva o sentido probatório de μαρτυρέω e torna claro que o testemunho divino confirma essas pessoas, sem identificar expressamente o referente além do pronome grego.
- source_word: αὐτοῖς
  choice: a favor deles
  rationale: O dativo indica aqueles em favor de quem Deus testemunhou. No contexto, refere-se aos gentios, mas a tradução mantém o pronome do texto grego.
- source_word: δοὺς
  choice: dando-lhes
  rationale: O particípio aoristo explica o meio pelo qual Deus deu testemunho. A forma gerundiva comunica essa relação com naturalidade e inclui o destinatário exigido em português.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada e contemporânea para o título, adequada à construção grega artigo-substantivo-artigo-adjetivo.
- source_word: καθὼς καὶ ἡμῖν
  choice: assim como também a nós
  rationale: Mantém a comparação elíptica do grego sem repetir o verbo; o ato de dar o Espírito é naturalmente subentendido.
theological_decisions:
- issue: A imparcialidade divina evidenciada pelo dom do Espírito aos gentios
  choice: Manter «deles» e «nós», mostrando que Deus lhes deu o Espírito do mesmo modo que ao grupo de Pedro.
  alternative: Explicitar «aos gentios» no corpo do versículo.
  rationale: αὐτοῖς é apenas um pronome; a identificação com os gentios vem do contexto. Não se acrescentam ao versículo conclusões sobre etnia ou condição pactual.
- issue: Sentido do testemunho de Deus
  choice: Traduzir o dativo como «a favor deles» e apresentar o dom do Espírito como o meio desse testemunho.
  alternative: Traduzir apenas «deu testemunho a eles», o que poderia sugerir que eles receberam uma mensagem verbal.
  rationale: No argumento narrativo, Deus confirmou publicamente a aceitação deles ao lhes dar o Espírito. A formulação preserva o valor evidencial sem ampliar a afirmação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto imediato.
