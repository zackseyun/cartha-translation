  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: pt
  text: Pareceu-nos bem, tendo chegado a um acordo[a], escolher homens[b] e enviá-los a vocês com nossos amados Barnabé e Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo-nos tornado unânimes” ou “de comum acordo”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, delegados do sexo masculino; o grego diz especificamente “homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: Pareceu-nos bem
  rationale: Preserva a fórmula deliberativa e coletiva do grego sem transformá-la numa declaração mais categórica como “decidimos”.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: depois de chegarmos de comum acordo
  rationale: Expressa tanto o processo indicado pelo particípio quanto a unanimidade ou convergência indicada pelo advérbio, em português natural.
- source_word: ἐκλεξαμένοις
  choice: escolher
  rationale: Embora seja formalmente um particípio aoristo, sua relação com πέμψαι pode ser comunicada com naturalidade como a ação coordenada de escolher os homens e enviá-los.
- source_word: ἄνδρας
  choice: alguns homens
  rationale: ἀνήρ designa especificamente homens adultos neste contexto; “alguns” é uma explicitação idiomática não numérica, necessária para evitar em português a impressão de que se tratava de homens em geral.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: enviá-los a vocês
  rationale: O pronome retoma naturalmente “alguns homens”, e “a vocês” comunica o destino pessoal da missão em português corrente e amplamente compreensível.
- source_word: σὺν τοῖς ἀγαπητοῖς ἡμῶν
  choice: com nossos amados
  rationale: Mantém a ideia simples de acompanhamento e o tom afetuoso e digno de ἀγαπητοῖς.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Barnabé e Paulo
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
theological_decisions:
- issue: Tom deliberativo e coletivo da carta de Jerusalém
  choice: Pareceu-nos bem
  alternative: Decidimos; foi nossa decisão
  rationale: A construção com δοκέω exprime aprovação ou juízo coletivo, mas não exige uma formulação mais categórica ou autoritária.
- issue: Natureza da concordância do grupo
  choice: depois de chegarmos de comum acordo
  alternative: sendo unânimes; tendo uma só opinião
  rationale: A tradução preserva a convergência coletiva expressa por ὁμοθυμαδόν sem definir além do texto a natureza teológica ou institucional dessa unidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Vocês” evita uma forma regional ou excessivamente solene; “Pareceu-nos bem” conserva o caráter formal da deliberação.
