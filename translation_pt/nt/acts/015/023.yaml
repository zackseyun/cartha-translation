  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: pt
  text: 'E, por meio deles, escreveram: «Os apóstolos e os presbíteros, irmãos, aos irmãos dentre os gentios em Antioquia, na Síria e na Cilícia: Saudações!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράψαντες
  choice: Escreveram
  rationale: O particípio aoristo depende da ação do versículo anterior. Em português, a forma finita liga-se ao contexto com mais naturalidade e mantém a ação de redigir a mensagem.
- source_word: διὰ χειρὸς αὐτῶν
  choice: por intermédio deles
  rationale: A expressão idiomática indica agência ou transmissão por meio dos delegados. A tradução comunica esse sentido naturalmente; a imagem literal é preservada em nota.
- source_word: ἀπόστολοι
  choice: apóstolos
  rationale: É o termo português tradicional e preciso para os emissários-líderes reconhecidos em Jerusalém.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: irmãos presbíteros
  rationale: Sem um segundo artigo antes de ἀδελφοί, a expressão lê-se naturalmente como um único grupo, no qual ἀδελφοί caracteriza os presbíteros. A formulação portuguesa preserva essa relação sem criar silenciosamente um terceiro grupo.
- source_word: ἀδελφοῖς
  choice: irmãos
  rationale: Mantém a forma masculina plural do texto-fonte. No contexto comunitário, pode abranger também as mulheres crentes, o que é esclarecido em nota.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: dentre os gentios
  rationale: Expressa a origem dos destinatários entre os povos não judeus e reproduz de modo natural a força de ἐξ com o genitivo.
- source_word: χαίρειν
  choice: Saudações
  rationale: Neste início de carta, o infinitivo funciona como fórmula epistolar convencional, não como ordem para se alegrar.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: que estão em Antioquia, na Síria e na Cilícia
  rationale: κατά com acusativo localiza ou distribui os destinatários pelos lugares mencionados. A formulação é clara em português e conserva os três nomes geográficos.
theological_decisions:
- issue: Sentido inclusivo de ἀδελφοί numa comunidade possivelmente mista
  choice: irmãos no texto, com esclarecimento inclusivo em nota
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma lexical masculina plural do grego, enquanto a nota informa que, nesse uso comunitário, o referente pode incluir todos os fiéis, inclusive mulheres.
- issue: Identificação dos remetentes em πρεσβύτεροι ἀδελφοί
  choice: os apóstolos e os irmãos presbíteros
  alternative: os apóstolos, os presbíteros e os irmãos
  rationale: O texto grego fornecido não traz artigo nem conjunção que marquem claramente ἀδελφοί como um terceiro grupo. A tradução escolhida preserva a leitura sintática mais direta, e a alternativa é registrada em nota sem resolver indevidamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da saudação foi mantida próxima da fórmula epistolar grega; «irmãos presbíteros» conserva a ambiguidade sintática relevante sem soar excessivamente técnica.
