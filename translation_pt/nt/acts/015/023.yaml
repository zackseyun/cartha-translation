review_pass:
  verdict: revise
  source_fidelity: A abertura deve conservar o particípio aoristo ligado à ação do contexto imediato e o valor de agência de διὰ χειρὸς αὐτῶν. «Escreveram por intermédio deles» é possível, mas «E, por meio deles, escreveram» representa com mais clareza a sequência e evita sugerir que os delegados foram os autores da carta. A construção πρεσβύτεροι ἀδελφοὶ permanece sintaticamente discutida; «irmãos presbíteros» privilegia uma leitura possível, mas é pouco natural em português e soa como título técnico inexistente.
  naturalness: «Irmãos presbíteros» é marcadamente artificial no português moderno. «Os presbíteros, irmãos» mantém uma leitura appositiva viável e é mais inteligível, enquanto a nota explicita a alternativa «irmãos presbíteros». «que estão em Antioquia, na Síria e na Cilícia» introduz uma cópula ausente e torna Antioquia indevidamente paralela a duas províncias; «em Antioquia, na Síria e na Cilícia» é mais direto.
  terminology: «Apóstolos», «presbíteros», «irmãos», «gentios» e «saudações» são adequados. A nota inclusiva para «irmãos» é apropriada. A nota sobre os remetentes deve apresentar a ambiguidade sem afirmar que uma das leituras é inequivocamente a mais natural.
  issues:
  - severity: medium
    issue: «Irmãos presbíteros» é pouco natural e resolve excessivamente uma construção grega contestada.
    rationale: πρεσβύτεροι ἀδελφοὶ pode ser lido como «os presbíteros, irmãos» (com ἀδελφοί em aposição aos remetentes) ou como «irmãos presbíteros». Uma redação e nota mais neutras preservam a questão textual e produzem português idiomático.
  - severity: low
    issue: «que estão em Antioquia, na Síria e na Cilícia» acrescenta uma cópula e obscurece a distribuição geográfica.
    rationale: O grego endereça os irmãos «em Antioquia, Síria e Cilícia»; a enumeração direta é mais fiel e fluente.
  - severity: low
    issue: A ligação inicial pode refletir melhor o particípio e a agência dos portadores.
    rationale: «E, por meio deles, escreveram» conserva em português a conexão com a decisão/envio do versículo anterior e o sentido de διὰ χειρός.
  revised_text: 'E, por meio deles, escreveram: «Os apóstolos e os presbíteros, irmãos, aos irmãos dentre os gentios em Antioquia, na Síria e na Cilícia: Saudações!»'
  revised_footnotes:
