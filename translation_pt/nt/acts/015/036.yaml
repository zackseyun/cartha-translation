id: ACT.15.36
reference: Acts 15:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: pt
  text: 'Alguns dias depois, Paulo disse a Barnabé: “Voltemos agora para visitar os irmãos[a] em cada cidade onde anunciamos a palavra do Senhor e ver como estão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “irmãos” e pode empregar o termo masculino para representar todo o grupo de fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Alguns dias depois
  rationale: Expressa de modo natural a posterioridade indicada por μετά com acusativo e mantém indefinido o intervalo.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Paulo disse a Barnabé
  rationale: Reproduz com clareza o ato de fala e identifica naturalmente o interlocutor.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Voltemos agora para visitar
  rationale: O particípio e o subjuntivo exortativo formam uma proposta conjunta; esta formulação portuguesa preserva o retorno, a força de δή e a visita interessada na condição das comunidades.
- source_word: τοὺς ἀδελφοὺς
  choice: os irmãos
  rationale: Mantém o termo familiar masculino do grego, que neste contexto pode representar o conjunto dos fiéis; a possível abrangência inclusiva é esclarecida em nota.
- source_word: κατὰ πόλιν πᾶσαν
  choice: em cada cidade
  rationale: Comunica diretamente o sentido distributivo da construção com κατά.
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: onde anunciamos
  rationale: Anunciar expressa a proclamação pública indicada por καταγγέλλω em português corrente e digno.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: Preserva a formulação neotestamentária e a relação do anúncio com o Senhor sem decidir além do que o genitivo permite.
- source_word: πῶς ἔχουσιν
  choice: ver como estão
  rationale: Traduz naturalmente o idioma grego referente à condição ou situação presente dos irmãos.
theological_decisions:
- issue: Abrangência de ἀδελφοί em uma comunidade provavelmente mista
  choice: os irmãos
  alternative: os irmãos e as irmãs; os fiéis
  rationale: O texto principal conserva a forma familiar masculina da fonte, enquanto a nota registra que ela pode abranger todos os fiéis, sem apagar a forma grega nem restringir indevidamente o referente.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: Senhor corresponde ao uso neotestamentário normal de κύριος neste contexto e evita introduzir uma nuance mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Alguns dias depois” é mais idiomático que “Depois de alguns dias”; “em cada cidade” preserva o valor distributivo; a coordenação final mantém a sequência da proposta de Paulo.
