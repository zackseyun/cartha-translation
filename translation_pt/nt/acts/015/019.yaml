  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: pt
  text: Por isso, julgo que não devemos criar dificuldades para os não judeus que estão se voltando para Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para os que, dentre as nações, estão se voltando para Deus”. Aqui, “nações” se refere aos povos não judeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão que Tiago tira do argumento anterior.
- source_word: ἐγὼ κρίνω
  choice: julgo que
  rationale: Preserva a declaração pessoal e ponderada de Tiago; em português, a forma verbal já torna explícita a primeira pessoa.
- source_word: μὴ παρενοχλεῖν
  choice: não devemos criar dificuldades
  rationale: Comunica a ideia de não importunar nem pôr obstáculos, e torna natural a força prática da proposta dirigida à assembleia.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: para os não judeus
  rationale: No contexto judaico-cristão, identifica com clareza as pessoas procedentes das nações, em contraste com os judeus.
- source_word: ἐπιστρέφουσιν
  choice: estão se voltando
  rationale: Conserva a imagem verbal e o aspecto presente de um movimento em curso, sem recorrer a terminologia técnica posterior.
- source_word: ἐπὶ τὸν θεόν
  choice: para Deus
  rationale: Indica naturalmente a direção desse voltar-se.
theological_decisions:
- issue: Se a frase apresenta apenas uma opinião pessoal de Tiago ou uma proposta de decisão coletiva
  choice: julgo que não devemos criar dificuldades
  alternative: julgo não criar dificuldades; é meu parecer que não se criem dificuldades
  rationale: O grego traz κρίνω na primeira pessoa do singular, mas o infinitivo expressa uma decisão prática para a comunidade. A tradução mantém a voz pessoal de Tiago sem reduzir a dimensão coletiva da recomendação.
translation_notes:
  register: Português atual, digno e acessível, com ampla legibilidade brasileira. “Não judeus” é mais imediatamente compreensível do que “gentios”; a nota preserva a formulação mais próxima da expressão grega.
