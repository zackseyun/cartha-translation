  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: pt
  text: Ao chegarem a Jerusalém, eles foram acolhidos pela igreja, pelos apóstolos e pelos anciãos, e relataram tudo o que Deus havia feito com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio deles” ou “entre eles”. O grego diz literalmente “com eles”.
    reason: A expressão grega admite nuances instrumental e locativa, mas sua forma literal preserva uma ambiguidade genuína.
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Ao chegarem a Jerusalém
  rationale: O particípio aoristo apresenta a chegada como circunstância anterior aos verbos principais. A construção temporal é natural em português, e o valor conectivo leve de δέ fica absorvido nela.
- source_word: παρεδέχθησαν
  choice: eles foram acolhidos
  rationale: O passivo indica que a comunidade de Jerusalém os recebeu favoravelmente. “Acolhidos” comunica recepção calorosa em português atual sem reduzir o sentido à mera admissão.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: pela igreja, pelos apóstolos e pelos anciãos
  rationale: Neste passivo, ἀπό assinala quem os recebeu. “Igreja” designa a comunidade cristã, e “anciãos” preserva a função reconhecida de liderança sem recorrer a uma designação denominacional específica.
- source_word: ἀνήγγειλάν τε
  choice: Então relataram
  rationale: O verbo descreve a comunicação de um relato, e τε liga essa ação à recepção anterior. “Então” torna clara a progressão narrativa em português.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: tudo o que Deus havia feito
  rationale: “Tudo o que” representa a abrangência de ὅσα. O mais-que-perfeito composto marca naturalmente que as ações de Deus antecederam o relato.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: μετά com o genitivo significa primariamente “com”. A tradução preserva a formulação aberta do grego, sem defini-la exclusivamente como instrumental ou locativa.
theological_decisions:
- issue: A relação entre Deus e os missionários em μετ’ αὐτῶν
  choice: Deus havia feito com eles
  alternative: Deus havia feito por meio deles; Deus havia feito entre eles
  rationale: “Com eles” mantém Deus como agente principal e associa os missionários à sua obra, sem resolver a expressão como exclusivamente instrumental (“por meio deles”) ou espacial/comunitária (“entre eles”).
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. “Acolhidos” é mais natural que “recebidos” neste contexto, e “anciãos” preserva a categoria de liderança do texto sem impor terminologia denominacional.
