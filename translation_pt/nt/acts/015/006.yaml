  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: pt
  text: Então os apóstolos e os presbíteros se reuniram para examinar essa questão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se ajuntaram” ou “foram reunidos”. O verbo grego está formalmente na voz passiva, mas, neste contexto, pode descrever naturalmente que o grupo se reuniu.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para ver acerca desta palavra”. Aqui, “palavra” significa o assunto ou a questão em discussão.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: se reuniram
  rationale: Embora a forma grega seja passiva, neste contexto o verbo descreve naturalmente o ato de o grupo se reunir. A construção reflexiva é corrente em português e preserva o sentido coletivo.
- source_word: τε
  choice: Então
  rationale: A partícula liga levemente a frase ao contexto anterior e indica o avanço da narrativa. “Então” expressa essa conexão com naturalidade.
- source_word: ἀπόστολοι
  choice: apóstolos
  rationale: Em Atos, o termo designa os líderes apostólicos reconhecidos; “apóstolos” é a tradução tradicional, clara e precisa.
- source_word: πρεσβύτεροι
  choice: presbíteros
  rationale: Aqui o termo indica líderes reconhecidos da comunidade, não apenas homens de mais idade. “Presbíteros” conserva essa função no contexto eclesial sem definir uma estrutura denominacional posterior.
- source_word: ἰδεῖν
  choice: examinar
  rationale: 'O infinitivo significa literalmente “ver”, mas aqui tem sentido deliberativo: analisar ou considerar a questão. “Examinar” comunica esse processo sem antecipar a decisão.'
- source_word: περὶ τοῦ λόγου τούτου
  choice: essa questão
  rationale: Neste contexto, λόγος não designa uma palavra isolada, mas o assunto controverso mencionado anteriormente. “Essa questão” retoma com clareza o debate do versículo precedente.
theological_decisions:
- issue: Nuance institucional de πρεσβύτεροι na reunião de Jerusalém
  choice: Traduzir por “presbíteros”, entendendo-os como líderes reconhecidos da comunidade, sem especificar uma estrutura denominacional posterior.
  alternative: “anciãos”, ou “presbíteros” como título técnico de um sistema eclesiástico posterior.
  rationale: O texto identifica líderes da igreja de Jerusalém, mas não define aqui todos os contornos de seu cargo. A tradução preserva a designação e evita importar uma forma posterior de governo eclesiástico.
- issue: Finalidade deliberativa da reunião
  choice: “para examinar essa questão”
  alternative: “para decidir essa questão” ou, literalmente, “para ver acerca desta palavra”
  rationale: ἰδεῖν apresenta o propósito de tomar o assunto em consideração. “Examinar” não pressupõe que o resultado já estivesse determinado e evita a literalidade obscura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Então” mantém a progressão narrativa; “se reuniram” soa natural; “examinar essa questão” explicita o sentido idiomático sem resolver além do texto. Os marcadores de ambas as notas aparecem no texto principal.
