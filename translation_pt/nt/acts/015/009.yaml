  naturalness: O texto revisto mantém um registro moderno, claro e digno. «Corações» é inteiramente natural neste contexto bíblico, e «tendo purificado» é uma construção fluente que evita sugerir que a purificação estava meramente em andamento.
  terminology: «Distinção», «fé» e «corações» são escolhas estabelecidas e adequadas para διακρίνω, πίστις e καρδία. «Purificado» reflete naturalmente καθαρίζω e preserva a linguagem de purificação do original.
