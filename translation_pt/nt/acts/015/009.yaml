    rationale: O particípio aoristo καθαρίσας é mais bem refletido por «tendo purificado», que conserva a noção de ação cumprida em relação à declaração principal, sem fixar uma cronologia excessiva.
  revised_text: E não fez distinção alguma entre nós e eles, tendo purificado os corações deles pela fé.[a]
