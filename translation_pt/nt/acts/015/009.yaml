  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: pt
  text: E não fez distinção alguma entre nós e eles, tendo purificado os corações deles pela fé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio da fé”. O dativo grego pode indicar meio ou instrumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν ... διέκρινεν
  choice: não fez distinção alguma
  rationale: A combinação idiomática expressa que Deus não diferenciou os dois grupos; esta formulação é natural em português e preserva a força enfática de οὐθέν.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: entre nós e eles
  rationale: Reproduz com clareza os dois grupos contrastados; o par τε ... καί é naturalmente expresso pela conjunção simples em português.
- source_word: τῇ πίστει
  choice: pela fé
  rationale: O dativo pode indicar meio ou instrumento. “Pela fé” é conciso, idiomático e mantém πίστις como “fé” sem especificar além do texto.
- source_word: καθαρίσας
  choice: purificando
  rationale: O particípio aoristo está subordinado ao verbo principal e pode exprimir ação associada ou anterior. O gerúndio preserva essa relação sem impor rigidamente uma sequência temporal.
- source_word: τὰς καρδίας αὐτῶν
  choice: o coração deles
  rationale: Em português, o singular distributivo soa natural quando cada integrante do grupo possui um coração; “coração” conserva a referência bíblica à pessoa interior.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: Neste contexto, “fé” é a correspondência mais direta e tradicional, enquanto “fidelidade” não é exigida pela construção.
- issue: Relação do particípio καθαρίσας com o verbo principal
  choice: purificando
  alternative: depois de purificar; tendo purificado
  rationale: A formulação escolhida mantém aberta a nuance circunstancial do particípio, sem transformar a purificação em uma etapa cronológica rigidamente separada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Distinção alguma” preserva a ênfase; “o coração deles” evita uma construção pouco natural sem alterar o sentido distributivo.
