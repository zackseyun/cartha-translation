  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: pt
  text: Assim, depois de serem enviados[a], eles desceram[b] para Antioquia. Reuniram a multidão[c] e entregaram a carta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de serem despedidos” ou “depois de serem dispensados”. O particípio grego pode indicar que foram formalmente enviados ou liberados para partir.
    reason: lexical_alternative
  - marker: b
    text: “Desceram” preserva o sentido direcional do verbo grego, provavelmente relacionado à viagem desde Jerusalém, situada em maior altitude, até Antioquia.
    reason: cultural_note
  - marker: c
    text: Ou “a assembleia” ou “a congregação”. A expressão se refere ao conjunto de pessoas reunidas em Antioquia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: depois de serem enviados
  rationale: O particípio indica que eles foram formalmente dispensados ou encaminhados para partir. “Enviados” é natural no contexto da missão, sem excluir totalmente a nuance de despedida.
- source_word: κατῆλθον
  choice: desceram
  rationale: Preserva o sentido direcional do verbo, coerente com a descida geográfica de Jerusalém, situada em maior altitude, até Antioquia.
- source_word: συναγαγόντες
  choice: reuniram
  rationale: Expressa de modo natural a ação anterior à entrega da carta; a sequência fica clara pela coordenação das frases.
- source_word: τὸ πλῆθος
  choice: todo o grupo
  rationale: Designa o conjunto reunido em Antioquia. A formulação é clara e corrente, sem impor um sentido técnico como “congregação” nem sugerir uma multidão indistinta.
- source_word: ἐπέδωκαν
  choice: entregaram
  rationale: Comunica a apresentação formal da carta aos reunidos e é idiomático em português.
- source_word: ἐπιστολήν
  choice: a carta
  rationale: É o equivalente moderno e comum, sem o tom eclesiástico desnecessário de “epístola”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A divisão em duas frases evita uma cadeia pesada de particípios, preservando a sequência das ações e as ambiguidades lexicais relevantes em notas.
