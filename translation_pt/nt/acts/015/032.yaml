  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: pt
  text: Judas e Silas, eles próprios profetas, encorajaram os irmãos[a] com muitas palavras e os fortaleceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os irmãos e as irmãs»; o grego diz «irmãos» e pode referir-se a toda a comunidade de crentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: Judas e Silas
  rationale: Emprega as formas tradicionais dos nomes no Novo Testamento em português e traduz a coordenação τε καὶ de maneira natural.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: que também eram profetas
  rationale: A oração explicativa reproduz o valor circunstancial do particípio; «também» reflete καὶ αὐτοὶ, indicando que eles próprios compartilhavam o papel profético.
- source_word: διὰ λόγου πολλοῦ
  choice: com muitas palavras
  rationale: Preserva de modo claro a imagem do grego, indicando uma fala extensa, sem restringi-la a uma única mensagem formal.
- source_word: παρεκάλεσαν
  choice: encorajaram
  rationale: No contexto do ministério profético à comunidade, comunica a ideia de exortação e ânimo em linguagem moderna e acessível.
- source_word: τοὺς ἀδελφοὺς
  choice: os irmãos
  rationale: Mantém a forma masculina plural do grego; uma nota registra que o termo pode abranger toda a comunidade cristã.
- source_word: ἐπεστήριξαν
  choice: os fortaleceram
  rationale: Expressa o sentido de tornar firmes ou fortalecer, preservando a segunda ação como distinta do encorajamento.
theological_decisions:
- issue: Alcance de ἀδελφοὺς numa comunidade possivelmente mista
  choice: os irmãos
  alternative: os irmãos e as irmãs; os crentes
  rationale: O substantivo grego está no masculino plural, mas no uso cristão antigo pode designar coletivamente toda a comunidade de fé. O texto mantém a forma explícita e a nota preserva o provável alcance inclusivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva «profetas», distingue encorajar de fortalecer e evita explicitar além do grego se διὰ λόγου πολλοῦ significa duração, quantidade de palavras ou ambas.
