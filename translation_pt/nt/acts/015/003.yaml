  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: pt
  text: Assim, depois de serem enviados pela igreja para a viagem, passaram tanto pela Fenícia como pela Samaria, relatando detalhadamente a conversão dos gentios[a] e trazendo grande alegria a todos os irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o voltar-se dos gentios”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” provavelmente se refere aos fiéis em geral, incluindo as mulheres.
    reason: inclusive_referent_clarification
lexical_decisions:
- source_word: προπεμφθέντες
  choice: depois de serem encaminhados
  rationale: O verbo προπέμπω pode envolver despedir, ajudar ou acompanhar alguém no início ou na continuação de uma viagem. “Serem encaminhados” conserva essa nuance sem afirmar que houve escolta.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: Em Atos, o termo designa normalmente a comunidade cristã; “igreja” é a forma corrente e contextualmente clara em português.
- source_word: διήρχοντο
  choice: atravessaram
  rationale: O imperfeito descreve o percurso pelas regiões. O pretérito perfeito soa mais natural na sequência narrativa portuguesa, sem negar o caráter progressivo da viagem.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: a Fenícia e a Samaria
  rationale: A correlação τε...καί une estreitamente as duas regiões. Em português, a coordenação simples com os dois artigos expressa isso naturalmente.
- source_word: ἐκδιηγούμενοι
  choice: relatando em detalhes
  rationale: O verbo composto indica uma narração completa ou pormenorizada, nuance mais bem preservada do que por um simples “contando”.
- source_word: ἐπιστροφὴν
  choice: conversão
  rationale: No contexto, refere-se à volta dos gentios para Deus em resposta ao evangelho. “Conversão” comunica com clareza esse sentido religioso, enquanto a alternativa mais literal é registrada em nota.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: Neste debate de Atos 15, ἔθνη se refere aos não judeus que estavam sendo acolhidos no povo de Deus; “gentios” preserva essa distinção contextual.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: trouxeram grande alegria
  rationale: A construção idiomática ποιέω com o substantivo χαρά tem sentido causativo. “Trouxeram grande alegria” é natural em português.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: a todos os irmãos
  rationale: A forma masculina plural é preservada no texto principal. Como provavelmente abrange o conjunto dos fiéis, inclusive mulheres, essa amplitude é esclarecida em nota.
theological_decisions:
- issue: Sentido de ἐπιστροφή na inclusão dos gentios
  choice: conversão
  alternative: volta
  rationale: “Conversão” expressa a mudança religiosa relatada no contexto sem desenvolver uma doutrina técnica posterior. A nota conserva a imagem lexical mais direta de voltar-se.
- issue: Abrangência de ἀδελφοί na comunidade cristã
  choice: irmãos
  alternative: irmãos e irmãs; demais fiéis
  rationale: O masculino gramatical do grego é mantido, sem excluir a provável referência contextual a homens e mulheres da comunidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa foi mantida, e o ponto e vírgula separa com clareza o percurso missionário de seu efeito sobre as comunidades.
