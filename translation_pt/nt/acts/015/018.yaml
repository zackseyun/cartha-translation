  text: known from of old[a].
translation:
  language: pt
  text: conhecidas desde os tempos antigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem uma forma mais extensa: “conhecidas desde a eternidade” ou “que torna conhecidas estas coisas desde os tempos antigos”.'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: conhecidas
  rationale: Adjetivo predicativo numa oração sem verbo expresso. “Conhecidas” reproduz diretamente o sentido, sem acrescentar a ideia verbal de “tornadas conhecidas” nem intensificá-lo como “bem conhecidas”.
- source_word: ἀπ’
  choice: desde
  rationale: Marca aqui o ponto de origem temporal. Em português, “desde” expressa com naturalidade essa relação.
- source_word: αἰῶνος
  choice: os tempos antigos
  rationale: Neste uso temporal, αἰών pode indicar um passado remoto. “Os tempos antigos” é claro e natural, mantendo a formulação breve e evitando impor o sentido mais forte de “eternidade”.
theological_decisions:
- issue: Alcance temporal do conhecimento na oração abreviada
  choice: Traduzir como referência ao conhecimento existente desde tempos antigos, sem ampliar a frase para uma afirmação explícita sobre presciência eterna.
  alternative: “conhecidas desde a eternidade” ou “que torna conhecidas estas coisas desde os tempos antigos”
  rationale: 'O texto do SBLGNT é extremamente conciso: γνωστὰ ἀπ’ αἰῶνος. A tradução preserva essa concisão e não incorpora palavras de tradições textuais mais longas nem uma inferência teológica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O particípio/adjetivo feminino plural acompanha o referente implícito do contexto anterior (“estas coisas”); a formulação preserva o caráter fragmentário do grego.
