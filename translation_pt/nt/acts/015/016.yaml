id: ACT.15.16
reference: Acts 15:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: pt
  text: Depois destas coisas, voltarei e reconstruirei a tenda caída de Davi[a]; reconstruirei as suas ruínas e a restaurarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tabernáculo de Davi”. A palavra grega pode significar “tenda” ou “tabernáculo”.
    reason: lexical_alternative
  - marker: b
    text: “A tenda de Davi” é uma metáfora profética para a restauração ligada à linhagem ou ao reino de Davi.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois destas coisas
  rationale: Preserva o plural do grego e a transição temporal da citação, em linguagem clara e natural.
- source_word: ἀναστρέψω
  choice: voltarei
  rationale: Neste contexto, o verbo exprime o retorno daquele que fala; “voltarei” mantém a promessa divina na primeira pessoa.
- source_word: ἀνοικοδομήσω
  choice: reconstruirei
  rationale: O verbo composto indica construir de novo; “reconstruirei” é conciso e mantém a imagem de restauração.
- source_word: σκηνὴν Δαυὶδ
  choice: a tenda de Davi
  rationale: σκηνή pode designar uma tenda ou um tabernáculo. “Tenda” é a opção mais direta e atual, sem substituir a metáfora pela interpretação “dinastia” ou “reino”.
- source_word: τὴν πεπτωκυῖαν
  choice: caída
  rationale: O particípio perfeito descreve a tenda no estado resultante de sua queda; “caída” reproduz essa condição de modo compacto.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: as suas ruínas
  rationale: O particípio substantivado no plural refere-se ao que foi derrubado ou demolido. “Suas ruínas” comunica naturalmente o sentido coletivo.
- source_word: ἀνορθώσω
  choice: a restaurarei
  rationale: O verbo pode significar pôr de pé, endireitar ou restaurar. No paralelismo sobre a tenda caída, “restaurarei” expressa com naturalidade o resultado sem abandonar a imagem.
theological_decisions:
- issue: Sentido metafórico de “a tenda de Davi”
  choice: Conservar no texto a metáfora “a tenda de Davi”.
  alternative: Traduzir interpretativamente como “a casa de Davi”, “a dinastia caída de Davi” ou “o reino de Davi”.
  rationale: A citação profética aponta para uma restauração ligada à linhagem ou ao reino de Davi, mas o grego mantém a imagem da tenda. Preservar a metáfora evita decidir no corpo do texto mais do que a formulação original declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição de “reconstruirei” preservam o paralelismo enfático do grego. O marcador [a] foi colocado junto a “tenda de Davi”, onde corresponde à alternativa lexical da nota.
