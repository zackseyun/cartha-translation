  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: pt
  text: 'E alguns, tendo descido da Judeia, ensinavam aos irmãos[a]: “Se vocês não forem circuncidados segundo o costume de Moisés, não podem ser salvos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos irmãos e às irmãs”; o grego diz “irmãos” e provavelmente se refere de modo inclusivo à comunidade dos que creem.
    reason: alternativa lexical e esclarecimento do alcance contextual
lexical_decisions:
- source_word: Καί
  choice: E
  rationale: Mantém o conectivo narrativo simples e o fluxo paratático de Lucas.
- source_word: τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: alguns, tendo descido da Judeia
  rationale: “Alguns” representa naturalmente o pronome indefinido sem acrescentar “homens”, que não está expresso como substantivo; o particípio preserva a anterioridade da chegada, e “descido” mantém a perspectiva geográfica convencional.
- source_word: ἐδίδασκον
  choice: ensinavam
  rationale: O imperfeito indica ação contínua ou repetida.
- source_word: τοὺς ἀδελφοὺς
  choice: aos irmãos
  rationale: Preserva o masculino plural do grego; no contexto, pode designar inclusivamente a comunidade de fiéis, esclarecido em nota.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Se vocês não forem circuncidados
  rationale: Forma condicional natural em português, preservando o passivo e sem tornar a exigência mais coloquial.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: segundo o costume de Moisés
  rationale: ἔθος significa costume ou prática estabelecida; “segundo” expressa adequadamente a relação normativa do dativo.
- source_word: οὐ δύνασθε σωθῆναι
  choice: não poderão ser salvos
  rationale: Expressa de modo natural a impossibilidade afirmada e preserva o sentido soteriológico de σωθῆναι no contexto da controvérsia.
theological_decisions:
- issue: Sentido de σωθῆναι na controvérsia
  choice: ser salvos
  alternative: ser libertos
  rationale: O contexto trata da alegada necessidade da circuncisão para a salvação; “ser salvos” conserva essa força sem definir um sistema doutrinário específico.
- issue: Alcance de ἀδελφοὺς
  choice: irmãos, com nota de possível referência comunitária inclusiva
  alternative: irmãos e irmãs; fiéis
  rationale: O texto principal conserva a forma masculina do grego, enquanto a nota reconhece que o termo provavelmente abrange toda a comunidade crente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “vocês” para distinguir naturalmente o plural da segunda pessoa e evita linguagem excessivamente técnica.
