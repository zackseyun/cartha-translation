source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: pt
  text: para que o remanescente da humanidade busque o Senhor, isto é, todos os gentios[a] sobre os quais o meu nome foi invocado[b], diz o Senhor[c], que faz estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as nações”. O grego ἔθνη pode significar “gentios” ou “nações”; neste contexto, “gentios” destaca a inclusão dos não judeus em discussão no concílio de Jerusalém.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “que são chamados pelo meu nome”. Em sentido mais literal, o grego diz: “sobre os quais o meu nome foi invocado”.'
    reason: lexical_alternative
  - marker: c
    text: Esta frase ecoa Amós 9:12 na forma preservada nas Escrituras Gregas, em que a ênfase recai sobre as nações/gentios que levam o nome do Senhor.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: para que
  rationale: Introduz propósito ou resultado com o subjuntivo e soa natural em português.
- source_word: ἐκζητήσωσιν
  choice: busque
  rationale: O subjuntivo corresponde à construção grega; o verbo composto pode sugerir busca intensa, mas explicitar isso sobretraduziria o contexto.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: o restante da humanidade
  rationale: Expressa de modo inclusivo e natural aqueles que restam. Embora κατάλοιποι possa ser traduzido por “remanescente”, “o restante” evita impor uma carga teológica além da formulação da citação.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Forma portuguesa consagrada para κύριος neste contexto de citação profética.
- source_word: πάντα τὰ ἔθνη
  choice: todos os gentios
  rationale: No contexto do concílio de Jerusalém, ἔθνη designa especialmente os não judeus; a possibilidade lexical “nações” é preservada em nota.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: sobre os quais o meu nome foi invocado
  rationale: Mantém a imagem e a forma passiva da expressão grega, que comunica identificação e pertencimento, sem reduzi-la silenciosamente à paráfrase “chamados pelo meu nome”.
- source_word: λέγει κύριος
  choice: diz o Senhor
  rationale: Preserva a fórmula profética e o presente do texto grego.
- source_word: ποιῶν ταῦτα
  choice: que faz estas coisas
  rationale: O particípio presente modifica “Senhor” e expressa sua ação; a oração relativa é clara e fiel em português.
theological_decisions:
- issue: Sentido de ἔθνη na inclusão de judeus e não judeus
  choice: gentios
  alternative: nações
  rationale: O assunto imediato de Atos 15 favorece “gentios”, enquanto “nações” continua sendo um sentido legítimo da palavra e da citação profética; por isso, aparece em nota.
- issue: Sentido da fórmula relativa ao nome divino
  choice: sobre os quais o meu nome foi invocado
  alternative: que são chamados pelo meu nome
  rationale: A versão principal conserva a construção incomum e sua ressonância de pertencimento ao Senhor; a alternativa idiomática é informada em nota, sem resolver a expressão de maneira excessivamente interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem profética foi preservada, e “sim” liga naturalmente a segunda expressão à primeira. As duas informações pertinentes sobre ἔθνη e a citação de Amós foram reunidas na nota [b], sem perder conteúdo relevante.
