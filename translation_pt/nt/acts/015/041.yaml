lexical_decisions:
- source_word: διήρχετο
  choice: percorria
  rationale: O imperfeito indica uma ação em andamento no quadro narrativo, e “percorria” expressa naturalmente o deslocamento pelas regiões sem acrescentar detalhes.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo narrativo leve; “E” dá continuidade ao relato de modo discreto e natural.
- source_word: Συρίαν
  choice: Síria
  rationale: Forma portuguesa consagrada do nome da região.
- source_word: Κιλικίαν
  choice: Cilícia
  rationale: Forma portuguesa consagrada do nome da região.
- source_word: ἐπιστηρίζων
  choice: fortalecendo
  rationale: 'O particípio descreve a ação concomitante à viagem: dar firmeza e apoio às comunidades. “Fortalecendo” preserva essa amplitude sem reduzir o sentido a mero encorajamento emocional.'
- source_word: ἐκκλησίας
  choice: igrejas
  rationale: Em Atos, o termo designa com frequência comunidades cristãs locais; “igrejas” é a forma mais clara, corrente e reconhecível em português.
