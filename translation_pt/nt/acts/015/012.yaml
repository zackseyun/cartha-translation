reference: Acts 15:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: pt
  text: Toda a assembleia se calou e escutava Barnabé e Paulo enquanto eles relatavam todos os sinais e maravilhas que Deus havia realizado entre os gentios[a] por meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre as nações”. Aqui, “gentios” se refere especificamente aos povos não judeus no contexto do concílio de Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: se calou
  rationale: O aoristo apresenta a entrada em silêncio como um acontecimento; “se calou” é natural em português e preserva esse valor ingressivo.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a assembleia
  rationale: No contexto deliberativo da reunião em Jerusalém, “assembleia” comunica melhor o grupo reunido do que “multidão”.
- source_word: ἤκουον
  choice: escutava
  rationale: O imperfeito indica uma ação contínua e atenta; o singular concorda naturalmente com o sujeito coletivo “assembleia”.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Barnabé e Paulo
  rationale: Adotam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: ἐξηγουμένων
  choice: enquanto eles relatavam
  rationale: O particípio descreve o ato de apresentar um relato; “relatavam” evita sugerir mera explicação interpretativa.
- source_word: ὅσα
  choice: todos os
  rationale: Diante de “sinais e maravilhas”, exprime de modo idiomático a totalidade ou extensão dos acontecimentos narrados.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Deus havia realizado
  rationale: Mantém Deus como sujeito e apresenta os feitos como anteriores ao relato de Barnabé e Paulo.
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e maravilhas
  rationale: Preserva a conhecida dupla de termos lucana sem acrescentar explicitamente “milagrosos”, ideia já comunicada pelo contexto.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: No contexto do concílio de Jerusalém, refere-se especificamente aos povos não judeus; a alternativa lexical “nações” é preservada em nota.
- source_word: δι’ αὐτῶν
  choice: por meio deles
  rationale: Expressa a instrumentalidade de διά com genitivo, mantendo Deus como agente principal e Barnabé e Paulo como seus instrumentos.
theological_decisions:
- issue: Agência divina na missão apostólica
  choice: Deus realizou os sinais e maravilhas por meio de Barnabé e Paulo.
  alternative: Barnabé e Paulo realizaram os sinais e maravilhas como agentes principais.
  rationale: A sintaxe grega faz de Deus o sujeito de ἐποίησεν e apresenta Barnabé e Paulo como instrumentos mediante δι’ αὐτῶν; a tradução conserva essa ênfase sem negar a participação real deles.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém o contraste aspectual entre “se calou” e “escutava/relatavam”, além de preservar a agência divina e a alternativa lexical de ἔθνεσιν.
