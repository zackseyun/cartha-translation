source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: pt
  text: Mas Paulo insistia que não levassem consigo aquele homem[a], que havia se afastado deles na Panfília e não os acompanhara no trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que os havia abandonado na Panfília”. O particípio grego pode receber uma tradução mais forte, mas o texto principal mantém a formulação menos interpretativa “havia se afastado deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: insistia
  rationale: O imperfeito, no contexto da divergência, exprime a firme posição de Paulo; “insistia” comunica naturalmente essa força sem converter o verbo em mera preferência.
- source_word: ἀποστάντα
  choice: havia se afastado
  rationale: O particípio de ἀφίσταμαι indica afastamento ou retirada. A formulação preserva o fato e deixa a possível censura implícita, sem intensificá-la no texto principal como “abandonado” ou “desertado”.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: deles na Panfília
  rationale: As expressões indicam separação deles associada à Panfília. Em português, “deles na Panfília” transmite com clareza que o afastamento ocorreu ali, evitando a construção pouco natural “deles desde a Panfília”.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: não os acompanhara
  rationale: No contexto de viagem, συνέρχομαι denota seguir junto ou acompanhar. O mais-que-perfeito liga naturalmente essa ação anterior à avaliação de Paulo.
- source_word: εἰς τὸ ἔργον
  choice: no trabalho
  rationale: “No trabalho” mantém a referência concreta à tarefa empreendida sem introduzir a interpretação mais específica “missão”.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: que não levassem consigo aquele homem
  rationale: A construção expressa aquilo que Paulo julgava que não se devia fazer. “Levar consigo” representa bem o verbo composto, e “aquele homem” conserva a força demonstrativa de τοῦτον em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi ajustada ao uso natural do português, preservando a firmeza da posição de Paulo e a ambiguidade quanto ao grau de censura envolvido no afastamento de João Marcos.
