id: ACT.15.10
reference: Acts 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: pt
  text: Agora, por que vocês põem Deus à prova, colocando sobre o pescoço dos discípulos um jugo[a] que nem os nossos antepassados nem nós fomos capazes de suportar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “jugo” é uma metáfora para uma obrigação imposta; neste contexto, refere-se às exigências que estavam sendo colocadas sobre os discípulos.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Preserva tanto a transição temporal quanto a força conclusiva da expressão grega, em português claro e digno.
- source_word: τί πειράζετε τὸν θεόν
  choice: por que vocês põem Deus à prova
  rationale: Expressa naturalmente a pergunta retórica e o sentido idiomático de πειράζω com Deus como objeto, sem sugerir mera tentativa.
- source_word: ἐπιθεῖναι
  choice: colocando
  rationale: O gerúndio explicita de modo fluente como eles estavam pondo Deus à prova.
- source_word: ζυγὸν
  choice: um jugo
  rationale: Mantém a metáfora concreta do texto em vez de substituí-la por uma interpretação como “obrigação” ou “fardo”.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: sobre o pescoço dos discípulos
  rationale: Reproduz a imagem vívida do original e emprega o termo habitual para μαθητής.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: nem os nossos antepassados nem nós
  rationale: “Antepassados” comunica naturalmente a referência às gerações anteriores de Israel; a correlação “nem... nem” preserva a estrutura grega.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: fomos capazes de suportar
  rationale: Transmite capacidade e conserva a ideia de carregar ou aguentar o jugo, sem reduzir a expressão à força física.
theological_decisions:
- issue: Natureza da metáfora do “jugo”
  choice: Manter “jugo” como metáfora da obrigação imposta aos discípulos, sem identificar no texto principal seu alcance exato.
  alternative: Explicitar o jugo como toda a Lei de Moisés, ou restringi-lo à circuncisão e às exigências associadas.
  rationale: O contexto trata de exigências impostas aos discípulos gentios, mas este versículo não define de modo explícito todo o alcance do jugo. A formulação preserva a imagem e a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o plural de πειράζετε; “antepassados” soa mais natural no português atual do que “pais” ou “antecessores” neste contexto.
