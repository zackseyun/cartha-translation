  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: pt
  text: Pois, desde gerações antigas, Moisés tem, em cada cidade, quem o proclame[a], sendo lido nas sinagogas todos os sábados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Moisés […] quem o proclame […] sendo lido”. “Moisés” representa aqui, por metonímia, os escritos ou a Lei associados a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa tradicional do nome; mantém a referência pessoal e a metonímia do grego.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz naturalmente em português a explicação ou justificativa ligada ao juízo anterior.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: desde gerações antigas
  rationale: Preserva o plural e expressa uma situação duradoura iniciada em tempos remotos.
- source_word: κατὰ πόλιν
  choice: em cada cidade
  rationale: Representa com clareza o valor distributivo de κατά com substantivo no singular.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: quem o proclame
  rationale: Conserva a linguagem de proclamação e o pronome masculino referente metonimicamente a Moisés.
- source_word: ἔχει
  choice: tem
  rationale: Mantém o presente do grego; com 'desde gerações antigas', o português comunica a continuidade da situação até o presente.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nas sinagogas
  rationale: Identifica de modo natural o ambiente habitual da leitura pública.
- source_word: κατὰ πᾶν σάββατον
  choice: todos os sábados
  rationale: Expressão portuguesa corrente para a repetição regular indicada pela construção distributiva.
- source_word: ἀναγινωσκόμενος
  choice: sendo lido
  rationale: Reproduz diretamente o particípio passivo sem explicitar uma relação causal que o grego deixa implícita.
theological_decisions:
- issue: Referência metonímica a Moisés
  choice: Manter 'Moisés', 'o' e 'sendo lido' no texto principal.
  alternative: Explicitar 'a Lei de Moisés' ou 'os escritos de Moisés'.
  rationale: O grego personifica Moisés como aquele que é proclamado e lido. Preservar essa formulação evita substituir a expressão da fonte por uma interpretação explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar a metonímia nem a construção participial do original.
