  source_fidelity: A sequência e os elementos do grego estão presentes. Contudo, «ser entregue à graça» é uma tradução excessivamente literal de παραδοθεὶς e, em português atual, sugere entrega ou rendição, não a recomendação/confiança de alguém ao cuidado divino expressa pela fórmula grega.
  naturalness: «Tendo sido recomendado à graça do Senhor» é natural, mantém a voz passiva e o aspecto anterior do particípio aoristo sem introduzir informação adicional. A posição das chamadas de nota junto às expressões anotadas melhora a legibilidade e a vinculação dos esclarecimentos.
  terminology: «Mas», «escolheu», «Silas», «partiu», «graça do Senhor» e «irmãos» são adequados. «Senhor» preserva corretamente a falta de especificação explícita do referente; «irmãos» pode permanecer no texto principal com nota contextual.
