  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: pt
  text: Mas Paulo escolheu Silas e partiu, tendo sido recomendado à graça do Senhor[a] pelos irmãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo sido confiado à graça do Senhor”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “irmãos” pode designar de modo mais amplo a comunidade dos fiéis, incluindo mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre a decisão de Paulo e a partida de Barnabé no versículo anterior.
- source_word: ἐπιλεξάμενος
  choice: escolheu
  rationale: Expressa de modo natural a escolha pessoal de Silas feita por Paulo antes da partida.
- source_word: Σιλᾶν
  choice: Silas
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἐξῆλθεν
  choice: partiu
  rationale: No contexto de viagem, comunica naturalmente que Paulo saiu para iniciar o percurso.
- source_word: παραδοθεὶς
  choice: depois de ser entregue
  rationale: Preserva o sentido básico e a voz passiva do particípio, sem eliminar a possível nuance de ser confiado ou recomendado ao cuidado da graça divina.
- source_word: τῇ χάριτι
  choice: à graça
  rationale: Mantém o substantivo teológico χάρις e reproduz a construção em que Paulo é entregue ou confiado à graça.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Conserva o título κύριος e não especifica além do que o texto grego declara.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: pelos irmãos
  rationale: Mantém a forma masculina plural do original; uma nota esclarece que, no uso comunitário cristão, o termo pode abranger a comunidade de fiéis.
theological_decisions:
- issue: Referente de «Senhor»
  choice: Senhor, sem identificação adicional
  alternative: Senhor Jesus; Deus
  rationale: O grego emprega κύριος sem explicitar o referente; a tradução preserva essa abertura.
- issue: Sentido de παραδοθεὶς em relação à graça
  choice: ser entregue à graça
  alternative: ser recomendado à graça; ser confiado à graça
  rationale: A formulação preserva a imagem e a amplitude lexical do original, enquanto a nota apresenta alternativas idiomáticas que ressaltam a ideia de cuidado.
- issue: Abrangência de «irmãos»
  choice: irmãos no texto principal
  alternative: irmãos e irmãs; fiéis
  rationale: A tradução conserva a forma gramatical do original, e a nota registra sua possível abrangência comunitária inclusiva.
translation_notes:
  register: 'Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das notas acompanha sua ocorrência textual: a alternativa lexical após a expressão relevante e, em seguida, a explicação comunitária de «irmãos».'
