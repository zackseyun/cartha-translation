source:
  edition: SBLGNT
  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: pt
  text: Pois bem, todos os judeus conhecem a minha maneira de viver[a] desde a juventude, que, desde o princípio, transcorreu entre o meu povo e em Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha vida” ou “meu modo de viver”. O termo grego se refere à maneira como Paulo vivia, não apenas à sua existência.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: maneira de viver
  rationale: O substantivo designa o modo ou curso de vida de Paulo, não apenas sua existência; esta formulação é clara e natural em português.
- source_word: ἐκ νεότητος
  choice: desde a juventude
  rationale: Preserva o ponto inicial indicado pela expressão grega sem tornar necessário repetir o possessivo, já evidente no contexto.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Mantém a expressão temporal e a aparente sobreposição com “desde a juventude”, presente no texto grego.
- source_word: γενομένην
  choice: transcorreu
  rationale: No contexto do curso de vida, comunica naturalmente que ele se desenvolveu nesses lugares, evitando o pouco idiomático “veio a ser”.
- source_word: ἐν τῷ ἔθνει μου
  choice: entre o meu povo
  rationale: Aqui ἔθνος se refere ao povo de origem de Paulo, não a um Estado-nação moderno; “entre” expressa adequadamente o ambiente social.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: e em Jerusalém
  rationale: A coordenação com τε acrescenta Jerusalém ao âmbito anterior de modo natural, sem exigir um “também” enfático.
- source_word: ἴσασι
  choice: conhecem
  rationale: A forma de οἶδα tem sentido presente e estativo neste contexto.
- source_word: πάντες Ἰουδαῖοι
  choice: todos os judeus
  rationale: Reproduz diretamente a formulação abrangente do texto, no contexto dos judeus familiarizados com a trajetória de Paulo.
- source_word: μὲν οὖν
  choice: Pois bem
  rationale: Marca a transição e a continuação da defesa de Paulo em português corrente e digno.
theological_decisions: []
