  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: pt
  text: 'E, depois de todos nós termos caído por terra, ouvi uma voz que me dizia em língua hebraica[a]: “Saulo, Saulo, por que você me persegue? É duro para você dar coices contra os aguilhões[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em aramaico”; a expressão grega diz literalmente “em língua/dialeto hebraico”.
    reason: alternative_reading
  - marker: b
    text: 'Expressão proverbial: resistir só traz dano à própria pessoa, como um animal que dá coices contra os aguilhões usados para conduzi-lo.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: quando todos nós caímos por terra
  rationale: O genitivo absoluto é expresso por uma oração temporal natural em português. “Todos nós” preserva πάντων ἡμῶν, e “por terra” é a forma idiomática de descrever a queda.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: ouvi uma voz que me dizia
  rationale: φωνή designa aqui uma voz articulada, e a oração relativa reproduz com naturalidade o particípio λέγουσαν e o direcionamento πρός με.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: em idioma hebraico
  rationale: Mantém a referência explícita do grego ao hebraico sem decidir no texto principal se o termo abrangia o aramaico no contexto do primeiro século.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Emprega a forma portuguesa tradicional do nome e preserva a repetição enfática do original.
- source_word: τί με διώκεις;
  choice: por que você me persegue?
  rationale: Traduz diretamente o presente διώκεις e conserva a ideia de perseguição hostil, com tratamento corrente e inteligível em português moderno.
- source_word: σκληρόν σοι
  choice: É duro para você
  rationale: Preserva a construção impessoal e a força tanto literal quanto proverbial de σκληρόν, sem reduzi-la apenas a dificuldade ou dor.
- source_word: πρὸς κέντρα λακτίζειν
  choice: dar coices contra os aguilhões
  rationale: 'Reproduz a imagem rural do provérbio: κέντρα são pontas ou varas pontiagudas usadas para conduzir animais, e λακτίζειν descreve o ato de dar coices.'
theological_decisions:
- issue: Sentido de τῇ Ἑβραΐδι διαλέκτῳ
  choice: em idioma hebraico
  alternative: em aramaico
  rationale: O texto principal segue a formulação grega, que nomeia o hebraico. Como a expressão pode ser entendida historicamente como referência ao aramaico, essa possibilidade é registrada em nota, sem resolver uma questão que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Aguilhões” foi mantido por precisão da imagem antiga, enquanto a nota esclarece o provérbio. O tratamento “você” evita o arcaísmo de “tu/ti” em grande parte do português brasileiro sem alterar o sentido.
