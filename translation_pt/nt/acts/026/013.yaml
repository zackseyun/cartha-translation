id: ACT.26.13
reference: Acts 26:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: pt
  text: Ao meio-dia, no caminho, vi, ó rei, uma luz vinda do céu, mais brilhante que o sol, que resplandeceu ao redor de mim e dos que viajavam comigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Ao meio-dia
  rationale: A construção genitiva é uma expressão temporal idiomática para o meio do dia; esta forma é clara, precisa e natural em português.
- source_word: κατὰ τὴν ὁδὸν
  choice: no caminho
  rationale: Indica o lugar ou contexto do deslocamento; a expressão portuguesa preserva de modo natural a imagem da viagem.
- source_word: εἶδον
  choice: vi
  rationale: Tradução direta e suficiente do aoristo de percepção.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: Preserva o vocativo e o tom formal da fala dirigida diretamente a Agripa.
- source_word: οὐρανόθεν
  choice: vinda do céu
  rationale: Expressa a origem celestial da luz e mantém a força narrativa e teológica do advérbio.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: mais brilhante que o sol
  rationale: Comunica naturalmente que a luz excedia o brilho do sol, sem a redundância pouco idiomática de 'mais brilhante que o brilho do sol'.
- source_word: φῶς
  choice: uma luz
  rationale: Introduz naturalmente em português o fenômeno visto por Paulo.
- source_word: περιλάμψαν με ... καὶ τοὺς σὺν ἐμοὶ πορευομένους
  choice: que resplandeceu ao redor de mim e dos que viajavam comigo
  rationale: Mantém tanto a ideia de luz intensa como o sentido circundante do verbo composto, aplicando a ação a Paulo e a seus companheiros.
theological_decisions:
- issue: Sentido de οὐρανόθεν no contexto da visão
  choice: vinda do céu
  alternative: vinda do alto / vinda do firmamento
  rationale: No contexto revelatório de Atos, 'céu' preserva melhor a origem celestial indicada pelo texto sem definir além dele a natureza do fenômeno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a ênfase comparativa e o endereço formal ao rei.
