base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: pt
  text: Então o rei se levantou, bem como o governador, Berenice[a] e os que estavam sentados com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Berenice: também conhecida como “Bernice”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: se levantou
  rationale: O aoristo de ἀνίστημι indica aqui o ato físico de levantar-se do assento; “se levantou” é natural e adequado ao ambiente formal.
- source_word: τε
  choice: Então / e também
  rationale: As duas ocorrências de τε encadeiam a ação à narrativa anterior e coordenam os participantes. Em português, “Então” expressa a progressão narrativa, e “também” torna clara a adição sem imitar mecanicamente as partículas gregas.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: βασιλεύς designa diretamente um rei. Embora se refira a Agripa no contexto, preserva-se o título usado no grego.
- source_word: ὁ ἡγεμὼν
  choice: o governador
  rationale: Em Atos, ἡγεμών designa com frequência o governador provincial romano; “governador” é preciso e corrente.
- source_word: Βερνίκη
  choice: Berenice
  rationale: “Berenice” representa de modo transparente a forma grega Βερνίκη e é uma forma reconhecida em português; a variante tradicional “Bernice” é registrada em nota.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: os que estavam sentados com eles
  rationale: A expressão conserva a imagem concreta de pessoas sentadas junto deles sem acrescentar uma função social não explicitada pelo texto.
- source_word: καὶ
  choice: e
  rationale: As ocorrências de καί coordenam as pessoas e o grupo enumerados, função naturalmente expressa por “e” em português.
