  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: pt
  text: Por causa dessas coisas[a], judeus me agarraram no templo[b] e tentavam me matar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por esse motivo” ou “Foi por isso”.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega traduzida como “templo” se refere ao conjunto do templo, não especificamente ao santuário interior.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Foi por isso
  rationale: A locução introduz a causa ou razão e retoma o testemunho e as ações que Paulo acabou de mencionar. A formulação é natural em português e mantém essa referência retrospectiva.
- source_word: με
  choice: me
  rationale: É o objeto direto de συλλαβόμενοι e corresponde naturalmente ao pronome de primeira pessoa do singular.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: O plural sem artigo identifica judeus envolvidos no episódio, sem afirmar que se tratava de todo o povo judeu. O plural sem artigo em português preserva essa referência contextual e evita uma generalização étnica.
- source_word: συλλαβόμενοι
  choice: me prenderam
  rationale: O particípio indica que agarraram ou detiveram Paulo. “Prenderam” é claro e natural no contexto, sem exigir que a ação tenha sido uma prisão oficialmente autorizada.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o conjunto do templo, não especificamente o santuário interior. “No templo” é a expressão portuguesa mais natural, com a precisão cultural esclarecida em nota.
- source_word: ἐπειρῶντο
  choice: tentavam
  rationale: O imperfeito apresenta a tentativa como ação em curso no passado; “tentavam” preserva esse aspecto.
- source_word: διαχειρίσασθαι
  choice: me matar
  rationale: Neste contexto, o verbo significa matar ou eliminar violentamente. “Matar” comunica o sentido com clareza, sem acrescentar a qualificação jurídica ou moral explícita de “assassinar”.
theological_decisions:
- issue: Referência a “judeus” em contexto polemicamente sensível
  choice: “judeus”, sem artigo, entendido como os judeus específicos que prenderam Paulo
  alternative: “os judeus” ou “alguns judeus”
  rationale: O texto identifica os participantes judeus do episódio, mas não acusa o povo judeu inteiro. O plural sem artigo mantém a referência histórica sem ampliar a afirmação nem inserir o quantificador ausente “alguns”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção enfática “Foi por isso que” reproduz de modo natural a relação causal. O imperfeito “tentavam” conserva a ação em curso, e o plural sem artigo em “judeus” evita transformar os participantes do episódio em uma generalização sobre todo o povo judeu.
