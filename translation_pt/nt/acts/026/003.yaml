  source_fidelity: 'O texto transmite adequadamente a construção dependente do versículo anterior: μάλιστα como intensificação causal (“especialmente porque”), γνώστην ὄντα como conhecimento bem estabelecido, e os dois âmbitos coordenados, costumes e controvérsias. “Por isso” preserva a inferência de διό, e “que me ouças com paciência” reproduz naturalmente δέομαι ... μακροθύμως ἀκοῦσαί μου.'
