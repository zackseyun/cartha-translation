id: ACT.26.3
reference: Acts 26:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: pt
  text: especialmente porque conheces bem todos os costumes e controvérsias entre os judeus.[a] Por isso, peço-te[b] que me ouças com paciência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os costumes judaicos e as controvérsias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rogo-te”; o verbo grego expressa um pedido insistente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: especialmente porque
  rationale: Realça a razão pela qual Paulo considera favorável falar diante de Agripa e expressa com naturalidade a relação causal da construção participial.
- source_word: γνώστην ὄντα σε
  choice: porque conheces bem
  rationale: Transmite conhecimento e familiaridade sem elevar necessariamente Agripa à condição técnica de especialista.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: todos os costumes entre os judeus
  rationale: Preserva a ideia de esfera ou referência de κατὰ Ἰουδαίους; a alternativa 'todos os costumes judaicos' também é possível.
- source_word: τε καὶ
  choice: e
  rationale: Coordena naturalmente as duas categorias em português sem exigir a fórmula mais marcada 'tanto... como'.
- source_word: ζητημάτων
  choice: controvérsias
  rationale: No contexto forense, refere-se a questões debatidas ou disputadas, não apenas a perguntas neutras.
- source_word: διὸ
  choice: Por isso
  rationale: Marca de modo claro a conclusão prática baseada no conhecimento de Agripa.
- source_word: δέομαι
  choice: peço-te
  rationale: Expressa um pedido direto e sério em português atual; a nota registra a possibilidade de explicitar mais fortemente o caráter insistente do verbo.
- source_word: μακροθύμως
  choice: com paciência
  rationale: Reproduz o pedido por uma audiência paciente e tolerante em formulação natural.
- source_word: ἀκοῦσαί μου
  choice: que me ouças
  rationale: Verte a construção infinitiva com objeto no genitivo sem acrescentar a ideia mais específica de ouvir até o fim.
