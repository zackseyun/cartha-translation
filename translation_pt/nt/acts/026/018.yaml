id: ACT.26.18
reference: Acts 26:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: pt
  text: para abrir os olhos deles, a fim de que se voltem das trevas para a luz e da autoridade de Satanás[a] para Deus, para que recebam o perdão dos pecados e uma herança entre os que foram santificados[b] pela fé em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do poder de Satanás” ou “do domínio de Satanás”. O termo grego pode indicar autoridade, poder governante ou domínio.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre os que foram feitos santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: abrir os olhos deles
  rationale: Preserva a imagem concreta do original, que no contexto aponta para percepção espiritual, sem explicá-la excessivamente.
- source_word: τοῦ ἐπιστρέψαι
  choice: a fim de que se voltem
  rationale: Expressa a finalidade do infinitivo articular e conserva a linguagem de mudança de direção, sem impor a formulação mais interpretativa “se convertam”.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: das trevas para a luz
  rationale: Mantém o contraste metafórico do grego em uma forma natural e reconhecível em português.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: da autoridade de Satanás
  rationale: “Autoridade” representa diretamente ἐξουσία, que também pode designar poder governante ou domínio; as alternativas relevantes são registradas em nota.
- source_word: ἐπὶ τὸν θεόν
  choice: para Deus
  rationale: No paralelismo de movimento, indica mudança de orientação ou sujeição e soa natural em português.
- source_word: τοῦ λαβεῖν
  choice: para que recebam
  rationale: Torna clara a segunda finalidade da comissão e preserva a ideia de algo concedido e recebido.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: o perdão dos pecados
  rationale: É a tradução contemporânea mais clara e consagrada para a expressão, sem recorrer ao arcaísmo “remissão”.
- source_word: κλῆρον
  choice: uma herança
  rationale: No contexto salvífico, comunica a porção concedida entre o povo de Deus e preserva a ressonância pactual e escatológica.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: entre os que foram santificados
  rationale: 'Preserva a força verbal do particípio perfeito passivo: pessoas tornadas santas e que permanecem nessa condição.'
- source_word: πίστει τῇ εἰς ἐμέ
  choice: pela fé em mim
  rationale: O dativo é adequadamente expresso de modo instrumental por “pela fé”, e εἰς ἐμέ identifica Jesus como o objeto pessoal dessa fé.
theological_decisions:
- issue: Sentido de πίστις em πίστει τῇ εἰς ἐμέ
  choice: pela fé em mim
  alternative: pela confiança em mim
  rationale: A construção apresenta Jesus como objeto da fé, não sendo a construção genitiva debatida de πίστις Χριστοῦ. “Fé” é natural, tradicional e semanticamente adequada, enquanto “confiança” permanece uma alternativa lexical possível.
- issue: Força de ἐπιστρέψαι na mudança das trevas e da autoridade de Satanás
  choice: se voltem
  alternative: se convertam
  rationale: “Se voltem” preserva a metáfora direcional e a agência expressa no texto, sem definir de modo adicional a mecânica teológica da conversão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de finalidade foi articulada com “a fim de que” e “para que”, evitando uma cadeia pesada de infinitivos. As notas foram posicionadas junto aos termos que efetivamente esclarecem.
