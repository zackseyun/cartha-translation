id: ACT.26.22
reference: Acts 26:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: pt
  text: Portanto, tendo recebido a ajuda que vem de Deus,[a] permaneço de pé até hoje, dando testemunho tanto a pequenos como a grandes,[b] sem dizer nada além do que os profetas e Moisés disseram que haveria de acontecer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo obtido ajuda da parte de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: “Pequenos e grandes” é uma expressão que inclui pessoas de todas as posições sociais.
    reason: cultural_note
  - marker: c
    text: 'Ou: “sem dizer nada fora daquilo que os profetas e Moisés disseram que aconteceria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν
  choice: tendo recebido a ajuda
  rationale: O substantivo indica ajuda ou assistência, e o particípio aoristo de τυγχάνω tem aqui o sentido de obter ou receber. A formulação é natural e mantém a relação participial.
- source_word: τῆς ἀπὸ τοῦ θεοῦ
  choice: que vem de Deus
  rationale: A expressão preposicional atributiva identifica Deus como a fonte da ajuda, sem sugerir um mecanismo além do que o texto afirma.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: até hoje
  rationale: Expressão temporal corrente que preserva o sentido de continuidade até o presente do discurso.
- source_word: ἕστηκα
  choice: permaneço de pé
  rationale: O perfeito expressa um estado presente resultante e contínuo. A tradução conserva a imagem de estar de pé e comunica a permanência de Paulo até aquele momento.
- source_word: μαρτυρόμενος
  choice: dando testemunho
  rationale: Mantém a atividade contínua do particípio e suas ressonâncias tanto públicas quanto jurídicas.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: tanto a pequenos como a grandes
  rationale: Preserva o paralelismo e a linguagem figurada do original, que abrange pessoas de toda posição social.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: sem dizer nada além
  rationale: 'Expressa de modo natural a exclusão enfática: Paulo não anuncia nada que ultrapasse o conteúdo indicado a seguir.'
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: os profetas e Moisés
  rationale: Conserva a ordem grega e a associação coordenada entre os profetas e Moisés.
- source_word: μελλόντων γίνεσθαι
  choice: que haveria de acontecer
  rationale: Expressa a futuridade relativa ao momento em que os profetas e Moisés falaram, sem impor uma ideia específica de iminência.
theological_decisions:
- issue: Alcance da afirmação de Paulo sobre a continuidade com as Escrituras de Israel
  choice: Paulo afirma que não diz nada além do que os profetas e Moisés anunciaram que aconteceria.
  alternative: Paulo reivindica apenas uma concordância geral com as Escrituras, sem afirmar cumprimento profético específico.
  rationale: A construção οὐδὲν ἐκτὸς λέγων apresenta uma forte reivindicação de continuidade. A tradução mantém essa força sem definir neste versículo quais acontecimentos específicos estão em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o argumento grego, mas evita rigidez excessiva; a expressão idiomática “pequenos e grandes” é preservada e explicada em nota.
