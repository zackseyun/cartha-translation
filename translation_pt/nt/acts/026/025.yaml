  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: pt
  text: 'Mas Paulo respondeu: “Não estou louco, excelentíssimo Festo[a]; pelo contrário, estou proferindo palavras verdadeiras e sensatas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Excelentíssimo” era um tratamento formal dado a uma autoridade de alta posição.
    reason: cultural_note
  - marker: b
    text: Ou “palavras de verdade e de sobriedade” ou “palavras verdadeiras e de perfeito juízo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste direto com a acusação de Festo no versículo anterior.
- source_word: μαίνομαι
  choice: não estou louco
  rationale: Traduz de modo natural e direto a negação de insanidade, sem tom arcaico.
- source_word: φησίν
  choice: respondeu
  rationale: O presente histórico grego é vertido no passado, como é natural na narrativa em português; o contexto mostra que Paulo responde à acusação.
- source_word: κράτιστε
  choice: excelentíssimo
  rationale: Preserva o tratamento formal dirigido a uma autoridade de alta posição.
- source_word: ἀληθείας
  choice: verdadeiras
  rationale: O genitivo de qualidade é expresso naturalmente por adjetivo em português, caracterizando as palavras como verdadeiras.
- source_word: σωφροσύνης
  choice: sensatas
  rationale: Comunica sobriedade, sanidade e bom senso, em contraste deliberado com a acusação de loucura.
- source_word: ῥήματα
  choice: palavras
  rationale: Mantém o substantivo plural concreto do texto grego.
- source_word: ἀποφθέγγομαι
  choice: estou proferindo
  rationale: Reproduz a ideia de falar de modo claro ou solene, com mais força que o simples 'dizer', sem exagerar o valor do verbo.
