  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: pt
  text: 'E eu disse: “Quem és tu, Senhor[a]?” E o Senhor disse: “Eu sou Jesus, a quem tu persegues.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem és tu, senhor?” O grego κύριε também pode funcionar como forma respeitosa de tratamento; aqui, “Senhor” é preferido porque aquele que fala na aparição celestial se identifica imediatamente como Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: E eu disse
  rationale: δέ funciona como conectivo narrativo leve; “E” mantém o fluxo sem criar contraste indevido. O pronome explícito ἐγώ é preservado naturalmente por “eu”.
- source_word: Τίς εἶ, κύριε;
  choice: Quem és tu, Senhor?
  rationale: A pergunta é direta, e “Senhor” preserva o valor reverente de κύριε no contexto da aparição celestial, sem eliminar em nota a possibilidade lexical de um tratamento respeitoso.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: E o Senhor disse
  rationale: O artigo identifica o interlocutor já presente na narrativa, e δέ é traduzido como conectivo simples. “Senhor” mantém a correspondência com κύριος.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Eu sou Jesus
  rationale: Reproduz a autoidentificação direta sem acrescentar ênfase ausente, como “o próprio Jesus”.
- source_word: ὃν σὺ διώκεις
  choice: a quem tu persegues
  rationale: διώκω tem aqui o sentido hostil de perseguir. O presente “persegues” expressa a ação em curso, e o pronome “tu” conserva a explicitação de σὺ e combina com a forma verbal amplamente compreensível.
theological_decisions:
- issue: Tradução de κύριε na pergunta de Paulo e de κύριος na identificação narrativa
  choice: Senhor
  alternative: senhor; isto é, tratamento respeitoso equivalente a “senhor” ou “mestre” no vocativo
  rationale: Na aparição celestial, a identificação imediata do interlocutor como Jesus favorece “Senhor” no texto principal. A nota preserva a ambiguidade lexical do primeiro vocativo sem reduzir antecipadamente seu peso cristológico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “Quem és tu” mantém solenidade natural e corresponde de perto ao grego; “a quem tu persegues” evita o relativo excessivamente formal “a quem persegues” sem perder clareza. O marcador [a] aparece junto ao termo a que se refere.
