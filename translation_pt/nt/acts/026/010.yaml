  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: pt
  text: 'E foi isso que fiz em Jerusalém: prendi muitos dos santos[a] nas prisões, depois de receber autoridade dos chefes dos sacerdotes; e, quando eles eram mortos, dei meu voto[b] contra eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “santos” significa os que pertencem ao povo santo de Deus, isto é, os que creem em Jesus; não se refere apenas a pessoas posteriormente canonizadas.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega ψῆφος, palavra que designava uma pedra usada em votação e, por extensão, um voto. A expressão indica que Paulo se pronunciou contra eles, mas não identifica o órgão nem esclarece se a votação era formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: E foi isso que fiz
  rationale: Retoma de modo natural em português a atividade persecutória mencionada anteriormente, preservando a força resumitiva da expressão grega.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Forma corrente do topônimo em português.
- source_word: πολλούς τε τῶν ἁγίων
  choice: muitos dos santos
  rationale: Mantém o termo neotestamentário para os integrantes do povo santo de Deus, sem restringi-lo a uma classe posteriormente canonizada.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: prendi ... nas prisões
  rationale: Expressa com clareza o ato de confinar e conserva o plural explícito de φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: depois de receber autoridade dos chefes dos sacerdotes
  rationale: A locução participial indica a origem da autorização para agir; “chefes dos sacerdotes” comunica o plural ἀρχιερεῖς sem sugerir que houvesse simultaneamente vários sumos sacerdotes em exercício.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: quando eles eram mortos
  rationale: Representa temporalmente o particípio passivo e conserva o sentido de tirar a vida sem acrescentar detalhes sobre o procedimento jurídico.
- source_word: κατήνεγκα ψῆφον
  choice: dei meu voto contra eles
  rationale: Preserva a imagem e o sentido de ψῆφος, “voto” ou “pedra de votação”. “Contra eles” explicita em português a direção inequívoca do voto no contexto, sem definir qual era o órgão deliberativo.
theological_decisions:
- issue: Sentido de ἅγιοι em Atos
  choice: “santos”, entendido como os crentes em Jesus
  alternative: “os que pertencem ao povo santo de Deus” ou “os fiéis”
  rationale: O termo designa a comunidade cristã, não apenas um grupo especial reconhecido depois por canonização. A tradução mantém a terminologia central do Novo Testamento e a nota impede uma leitura anacrônica.
- issue: Força de κατήνεγκα ψῆφον
  choice: participação pessoal expressa como dar voto contra os que eram mortos
  alternative: manifestar aprovação ou consentimento, sem necessariamente participar de uma votação formal
  rationale: A formulação grega emprega ψῆφος, termo concreto para a pedra de votação e, por extensão, para o voto. O texto principal preserva essa força, enquanto a nota reconhece que o contexto não identifica a instituição nem permite reconstruir com certeza o caráter formal do ato.
translation_notes:
  register: 'Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura em duas ações é marcada por ponto e vírgula, sem reproduzir de modo rígido a coordenação grega. “Chefes dos sacerdotes” evita a possível impressão, causada por “sumos sacerdotes” no plural, de vários ocupantes simultâneos do mesmo cargo. Os marcadores foram ligados aos termos que efetivamente explicam: [a] a “santos” e [b] a “voto”.'
