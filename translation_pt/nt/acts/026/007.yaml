  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: pt
  text: à qual nosso povo das doze tribos espera chegar[a], servindo a Deus[b] com dedicação, noite e dia. É por causa dessa esperança que sou acusado por judeus[c], ó rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à qual nossas doze tribos esperam chegar”. O grego emprega um substantivo coletivo no singular para se referir a Israel como o povo das doze tribos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prestar culto a Deus”. O verbo grego pode indicar serviço religioso ou adoração oferecida a Deus.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, por judeus que o acusavam. A expressão descreve os acusadores de Paulo no contexto jurídico, não todos os judeus sem exceção.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: à qual
  rationale: Preserva o sentido direcional de εἰς e remete à promessa mencionada no versículo anterior.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: nossas doze tribos
  rationale: Expressa de forma natural em português o singular coletivo grego que designa Israel como o povo das doze tribos; a nota registra essa nuance.
- source_word: ἐν ἐκτενείᾳ
  choice: com dedicação
  rationale: Comunica a intensidade, o empenho e a constância da expressão grega em linguagem corrente e digna.
- source_word: νύκτα καὶ ἡμέραν
  choice: noite e dia
  rationale: Mantém a ordem grega e o sentido idiomático de serviço contínuo.
- source_word: λατρεῦον
  choice: servindo a Deus
  rationale: O verbo denota serviço religioso ou culto; explicitar Deus como objeto implícito torna a frase clara sem acrescentar uma afirmação teológica nova.
- source_word: ἐλπίζει καταντῆσαι
  choice: esperam chegar
  rationale: καταντάω indica chegar a um alvo; esta formulação é natural e mantém a esperança dirigida ao cumprimento da promessa.
- source_word: περὶ ἧς ἐλπίδος
  choice: por causa dessa esperança
  rationale: No contexto judicial, περί com o genitivo admite sentido causal; a formulação explica por que Paulo é acusado sem definir além do texto o conteúdo da esperança.
- source_word: ἐγκαλοῦμαι
  choice: sou acusado
  rationale: Reproduz diretamente o sentido passivo e jurídico do verbo.
- source_word: ὑπὸ Ἰουδαίων
  choice: por judeus
  rationale: Reflete o grego sem artigo e identifica os acusadores no contexto, sem sugerir todos os judeus indistintamente.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: Preserva o vocativo formal e a força retórica da interpelação direta a Agripa.
theological_decisions:
- issue: Objeto implícito de λατρεῦον
  choice: servindo a Deus
  alternative: servindo; prestando culto
  rationale: Embora Deus não esteja expresso como objeto na oração grega, o contexto da devoção religiosa de Israel o torna implícito. A explicitação favorece a compreensão sem introduzir doutrina alheia ao texto.
- issue: Referência da esperança
  choice: Manter a ligação com a promessa do versículo anterior sem explicitar aqui a ressurreição
  alternative: Explicitar a ressurreição neste versículo; tratar como esperança genérica
  rationale: O contexto mais amplo relaciona a esperança à promessa de Deus e ao tema da ressurreição, mas este versículo não repete esse conteúdo. A tradução preserva a remissão e a tensão contextual.
- issue: Extensão de ὑπὸ Ἰουδαίων
  choice: por judeus, entendido como os acusadores de Paulo
  alternative: pelos judeus, potencialmente entendido como generalização
  rationale: A expressão ocorre em descrição jurídica e não atribui a acusação a todos os judeus. A nota torna explícito esse limite contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “noite e dia” acompanha o grego. “Com dedicação” evita tanto linguagem excessivamente técnica quanto a redução do termo à mera emoção. Os marcadores aparecem no texto junto às expressões pertinentes.
