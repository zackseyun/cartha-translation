base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: pt
  text: 'Então Agripa disse a Paulo: “Você tem permissão para falar em sua própria defesa[a].” Então Paulo estendeu a mão e apresentou sua defesa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falar a seu próprio favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão narrativa de modo natural, sem atribuir ao conectivo uma oposição que o contexto não exige.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: disse a Paulo
  rationale: Expressão idiomática em português para o verbo de fala seguido de πρὸς.
- source_word: Ἐπιτρέπεταί σοι
  choice: Você tem permissão
  rationale: Reproduz com clareza o sentido do presente passivo e mantém o tom formal da audiência.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: falar em sua própria defesa
  rationale: No contexto judicial, ὑπέρ com o pronome reflexivo indica falar em favor de si mesmo; a formulação portuguesa torna explícito esse valor contextual sem ampliar o conteúdo.
- source_word: τότε
  choice: Então
  rationale: Preserva a sequência temporal expressamente marcada no grego.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendeu a mão
  rationale: Tradução direta do gesto físico, sem especificar uma função retórica não declarada no texto.
- source_word: ἀπελογεῖτο
  choice: apresentou sua defesa
  rationale: Expressa o sentido forense do verbo no imperfeito sem acrescentar de modo explícito a nuance incoativa de que Paulo 'começou' a falar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e tom apropriado a uma audiência judicial. “Você” evita a artificialidade regional de “tu” e permanece respeitoso no contexto; “apresentou sua defesa” conserva o valor jurídico de ἀπελογεῖτο.
