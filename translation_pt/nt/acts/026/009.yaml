  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: pt
  text: Assim, eu mesmo pensava que devia fazer muitas coisas contra o nome de Jesus, o Nazareno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o nome de Jesus de Nazaré”.'
    reason: Alternativa lexical para Ἰησοῦ τοῦ Ναζωραίου.
lexical_decisions:
- source_word: Ἐγὼ
  choice: eu mesmo
  rationale: O pronome explícito é enfático no grego; “eu mesmo” preserva a ênfase pessoal da confissão de Paulo.
- source_word: μὲν οὖν
  choice: Assim
  rationale: A combinação dá continuidade ao discurso com valor inferencial e leve ênfase. “Assim” expressa isso naturalmente em português, sem sobrecarregar a frase.
- source_word: ἔδοξα ἐμαυτῷ
  choice: estava convencido
  rationale: A expressão descreve o juízo pessoal de Paulo naquele período. “Estava convencido” comunica de modo natural uma opinião firmemente assumida, enquanto “eu mesmo” retém a força reflexiva.
- source_word: δεῖν
  choice: devia
  rationale: Expressa a necessidade ou obrigação que Paulo julgava existir, sem apresentá-la como necessidade objetiva imposta por Deus.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: fazer muitas coisas contra
  rationale: Preserva tanto a multiplicidade das ações quanto seu caráter adversativo, em linguagem portuguesa clara e corrente.
- source_word: πρὸς τὸ ὄνομα
  choice: contra o nome
  rationale: Com ἐναντία πρᾶξαι, πρός tem força adversativa. A formulação conserva o idioma bíblico “o nome” sem o reduzir a reputação, autoridade ou causa.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jesus, o Nazareno
  rationale: “O Nazareno” mantém o caráter designativo do grego e associa Jesus a Nazaré sem transformar a expressão em mera indicação geográfica.
theological_decisions:
- issue: Sentido de “o nome” em relação a Jesus
  choice: Manter o idioma bíblico “o nome”.
  alternative: “a autoridade de Jesus” ou “a causa de Jesus”
  rationale: O texto pode abranger a pessoa, a reputação, a autoridade e a confissão pública de Jesus. Traduzir apenas uma dessas dimensões estreitaria indevidamente o sentido.
- issue: Natureza da obrigação expressa por δεῖν
  choice: 'Apresentá-la como obrigação percebida por Paulo: “estava convencido de que devia”.'
  alternative: “tinha de” ou uma formulação que sugerisse necessidade objetiva
  rationale: No contexto, Paulo relata sua antiga convicção, não afirma que essa oposição era realmente necessária ou divinamente ordenada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, preservando a ênfase de Ἐγὼ por meio de “eu mesmo” e o idioma teológico “o nome”.
