  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: pt
  text: A respeito de todas as acusações feitas contra mim pelos judeus, rei Agripa, considero-me afortunado por estar hoje prestes a apresentar minha defesa diante do senhor,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν ἐγκαλοῦμαι
  choice: A respeito de todas as acusações feitas contra mim
  rationale: Reformula naturalmente em português a relação entre περί e o verbo forense ἐγκαλοῦμαι, preservando tanto a abrangência de πάντων quanto o sentido jurídico da acusação.
- source_word: ὑπὸ Ἰουδαίων
  choice: pelos judeus
  rationale: ὑπό indica os agentes da acusação. No contexto, a expressão se refere aos acusadores judeus de Paulo, não a todos os judeus indistintamente.
- source_word: βασιλεῦ Ἀγρίππα
  choice: rei Agripa
  rationale: Mantém o título e o vocativo direto em português atual, sem acrescentar uma interjeição arcaizante.
- source_word: ἥγημαι ἐμαυτὸν μακάριον
  choice: considero-me afortunado
  rationale: ἡγέομαι com construção reflexiva significa considerar ou julgar; neste contexto forense, μακάριον comunica uma situação favorável ou privilegiada, mais naturalmente expressa por “afortunado” do que por “feliz” ou “bem-aventurado”.
- source_word: ἐπὶ σοῦ
  choice: diante do senhor
  rationale: No contexto de audiência, ἐπί com genitivo indica comparecer perante alguém. “Diante do senhor” comunica a deferência da fala dirigida ao rei sem atribuir-lhe explicitamente a função de juiz.
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: por hoje poder apresentar minha defesa
  rationale: Expressa de modo natural a perspectiva imediata de μέλλων, conserva σήμερον e traduz o valor forense de ἀπολογεῖσθαι como apresentação da própria defesa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tom respeitoso adequado a uma defesa perante um rei. A ordem foi ajustada para fluidez sem eliminar o alcance abrangente de πάντων nem o caráter jurídico do discurso. A vírgula final foi preservada porque o versículo continua sintaticamente no seguinte.
