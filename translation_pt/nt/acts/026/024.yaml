source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: pt
  text: 'Enquanto Paulo dizia essas coisas em sua defesa, Festo exclamou em alta voz: “Você está louco, Paulo! Seu grande saber está levando você à loucura.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: dizia essas coisas em sua defesa
  rationale: 'O genitivo absoluto indica uma ação simultânea, e ἀπολογέομαι tem aqui sentido forense: Paulo apresentava sua defesa. A formulação preserva tanto o conteúdo mencionado por Ταῦτα quanto o contexto jurídico.'
- source_word: μεγάλῃ τῇ φωνῇ
  choice: em alta voz
  rationale: A expressão dativa indica modo e é vertida por uma construção portuguesa corrente e vívida.
- source_word: φησιν
  choice: exclamou
  rationale: Embora o grego empregue o presente histórico, o pretérito é natural na narrativa portuguesa; “exclamou” comunica a intervenção enfática indicada pela alta voz, sem acrescentar conteúdo ao discurso.
- source_word: Μαίνῃ
  choice: Você está louco
  rationale: μαίνομαι denota estar louco ou fora de si. “Está louco” é direto, atual e preserva a força da acusação.
- source_word: τὰ πολλά ... γράμματα
  choice: seu grande saber
  rationale: γράμματα pode referir-se a letras, escritos ou instrução. Neste contexto, a expressão idiomática aponta para a vasta erudição de Paulo; “grande saber” mantém essa amplitude sem sugerir documentos específicos.
- source_word: εἰς μανίαν
  choice: à loucura
  rationale: A construção com εἰς expressa resultado ou movimento para um estado. Em português, “levar à loucura” preserva naturalmente esse valor resultativo.
- source_word: περιτρέπει
  choice: está levando
  rationale: O verbo descreve a ação de fazer alguém voltar-se ou passar para determinado estado. A locução progressiva comunica a acusação de que a erudição estaria conduzindo Paulo à loucura.
theological_decisions: []
