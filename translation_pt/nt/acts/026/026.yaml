  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: pt
  text: Pois o rei sabe dessas coisas, e falo com franqueza a ele[a]. Pois estou convencido de que nada disso lhe passa despercebido[b], pois isto não foi feito num canto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falo abertamente» ou «falo com ousadia». O termo grego indica uma fala franca, aberta e confiante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «nada disso está oculto para ele» ou «nada disso deixou de ser percebido por ele».'
    reason: lexical_alternative
  - marker: c
    text: «Num canto» é uma expressão que significa que isso não foi feito em segredo nem longe do conhecimento público.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: sabe
  rationale: Expressa conhecimento ou familiaridade; «sabe» é direto, natural e adequado à afirmação sobre o rei.
- source_word: περὶ τούτων
  choice: destas coisas
  rationale: Preserva a referência ampla aos assuntos e acontecimentos em discussão sem restringir seu alcance.
- source_word: παρρησιαζόμενος
  choice: falo com franqueza
  rationale: Comunica fala aberta, confiante e sem reservas; em português corrente, «com franqueza» preserva melhor essa combinação do que apenas «ousadamente».
- source_word: πρὸς ὃν ... λαλῶ
  choice: é a ele que falo
  rationale: Reproduz com naturalidade a ênfase do relativo grego na pessoa a quem Paulo se dirige.
- source_word: λανθάνειν ... αὐτὸν
  choice: lhe passou despercebido
  rationale: Equivalente idiomático claro para algo que não ficou oculto nem deixou de ser percebido por alguém.
- source_word: οὐ πείθομαι οὐθέν
  choice: Estou convencido de que nada disso
  rationale: Expressa a convicção firme de Paulo e verte naturalmente a construção negativa grega sem alterar seu sentido.
- source_word: πεπραγμένον
  choice: aconteceu
  rationale: No contexto de eventos conhecidos, «aconteceu» soa mais natural em português, embora o grego possa ser vertido mais literalmente por «foi feito».
- source_word: ἐν γωνίᾳ
  choice: num canto
  rationale: Mantém a imagem idiomática do grego, esclarecida em nota para evitar que seja tomada apenas em sentido espacial literal.
- source_word: τοῦτο
  choice: isto
  rationale: Conserva a referência deliberadamente ampla do demonstrativo sem definir quais acontecimentos estão incluídos.
theological_decisions:
- issue: Alcance de «isto» e caráter público dos acontecimentos
  choice: Manter «isto» sem especificar o referente e conservar a afirmação de que os fatos eram públicos.
  alternative: Explicitar que se trata somente da morte e ressurreição de Jesus, ou de todo o movimento cristão e do processo de Paulo.
  rationale: O texto aponta para acontecimentos conhecidos publicamente, mas não delimita com precisão o alcance do demonstrativo; especificá-lo resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez e para conservar a ênfase em Agripa. As notas estão vinculadas aos respectivos marcadores no texto e distinguem alternativas lexicais da explicação idiomática.
