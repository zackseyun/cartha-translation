  naturalness: A revisão permanece em português moderno, claro e amplamente internacional. «Falo com franqueza a ele» tem registro digno e natural; «num canto» conserva a imagem idiomática e é adequadamente elucidado pela nota.
  terminology: «Franqueza» representa bem παρρησιαζόμενος sem reduzir o termo a coragem ou publicidade apenas. «Nada disso lhe passa despercebido» é um equivalente idiomático preciso para a construção com λανθάνειν. O demonstrativo «isto» continua amplo, sem definir indevidamente os acontecimentos referidos.
