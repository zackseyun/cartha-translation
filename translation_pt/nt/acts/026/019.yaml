lexical_decisions:
- source_word: Ὅθεν
  choice: Por isso
  rationale: Introduz uma conclusão baseada no relato anterior do encontro e da comissão de Paulo; é uma ligação lógica clara e natural em português.
- source_word: βασιλεῦ Ἀγρίππα
  choice: rei Agripa
  rationale: Reproduz o vocativo e conserva o título honorífico em formulação idiomática moderna.
- source_word: οὐκ ἐγενόμην
  choice: não fui
  rationale: Com o adjetivo predicativo, γίνομαι tem aqui valor idiomático de ser ou mostrar-se; “não fui” é natural e preserva o sentido resultante.
- source_word: ἀπειθὴς
  choice: desobediente
  rationale: No contexto da comissão divina, indica não se recusar a obedecer, mais do que mera falta de convencimento.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: à visão celestial
  rationale: ὀπτασία designa uma visão ou aparição sobrenatural; “visão celestial” preserva de forma concisa a possível referência tanto à origem quanto ao caráter da visão.
theological_decisions:
- issue: Natureza da experiência de Paulo no caminho de Damasco
  choice: visão
  alternative: aparição; revelação vinda do céu
  rationale: “Visão” corresponde diretamente a ὀπτασία sem definir além do texto a natureza da experiência. “Celestial” mantém aberta a nuance de origem ou caráter expressa por οὐρανίῳ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o vocativo direto e a ambiguidade de “celestial” entre origem e caráter.
