id: ACT.26.23
reference: Acts 26:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: pt
  text: que o Messias haveria de sofrer[a] e que, sendo o primeiro a ressuscitar dentre os mortos, proclamaria luz tanto ao povo[b] como aos gentios[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o Cristo». Aqui, o título grego Χριστός é traduzido por «Messias» porque aparece em um contexto profético.
    reason: alternative_reading
  - marker: b
    text: Aqui, «o povo» provavelmente se refere ao povo judeu, em contraste com «os gentios».
    reason: lexical_alternative
  - marker: c
    text: Ou «às nações». Neste contexto, a expressão normalmente se refere aos gentios.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: haveria de sofrer
  rationale: O adjetivo indica que o Messias estava sujeito ou destinado ao sofrimento; a forma verbal é natural em português e se ajusta ao resumo profético.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Neste contexto profético, Χριστός funciona como título do ungido esperado, por isso «Messias» comunica melhor o valor titular.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: o primeiro a ressuscitar dentre os mortos
  rationale: Preserva a afirmação de precedência e a ideia de sair do meio dos mortos, sem acrescentar uma explicação doutrinária não expressa no texto.
- source_word: φῶς
  choice: luz
  rationale: Mantém a metáfora bíblica ampla de revelação, salvação e esperança.
- source_word: μέλλει καταγγέλλειν
  choice: proclamaria
  rationale: No resumo indireto do discurso, o futuro do pretérito expressa de modo natural a ação futura ou destinada, sem sugerir iminência imediata.
- source_word: τῷ τε λαῷ
  choice: ao povo
  rationale: Conserva o termo grego; o contraste com os gentios sugere que se trata do povo judeu.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: No contraste entre Israel e os demais povos, «gentios» torna explícito o sentido contextual usual de ἔθνη.
- source_word: τε ... καὶ
  choice: tanto ... como
  rationale: Representa naturalmente em português a correlação entre os dois destinatários.
theological_decisions:
- issue: Precedência do Messias na ressurreição
  choice: o primeiro a ressuscitar dentre os mortos
  alternative: o primeiro da ressurreição dos mortos
  rationale: A tradução conserva a precedência afirmada pelo grego, mas não define no texto principal em que sentido ela se relaciona com restaurações anteriores à vida ou com a ressurreição final.
- issue: Referente de «o povo»
  choice: ao povo
  alternative: ao povo judeu / a Israel
  rationale: O grego traz λαός sem qualificação; o provável referente judeu é esclarecido em nota, evitando explicitação interpretativa no texto principal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém os dois membros introduzidos por εἰ e preserva a tensão da formulação grega sobre a precedência na ressurreição.
