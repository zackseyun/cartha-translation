  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: pt
  text: 'Depois de se retirarem, conversavam uns com os outros, dizendo: “Este homem não está fazendo nada que mereça morte ou prisão[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morte ou correntes”. A palavra grega traduzida como “prisão” significa literalmente “vínculos” ou “correntes”, mas aqui provavelmente se refere à prisão ou custódia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Depois de se retirarem
  rationale: O particípio aoristo indica que eles se afastaram antes da conversa principal; a formulação é natural e preserva essa sequência.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: conversavam uns com os outros
  rationale: O imperfeito sugere uma conversa em andamento, e a expressão recíproca indica diálogo mútuo entre os presentes.
- source_word: λέγοντες
  choice: dizendo
  rationale: Introduz diretamente o conteúdo da conversa sem acrescentar interpretação.
- source_word: Οὐδὲν ... ἄξιον
  choice: nada que mereça
  rationale: Expressa de modo corrente a ideia de que nenhuma ação praticada justificava as penas mencionadas.
- source_word: θανάτου ἢ δεσμῶν
  choice: morte ou prisão
  rationale: “Morte” preserva a formulação grega no contexto de pena capital; δεσμοί significa literalmente vínculos ou correntes, mas neste contexto judicial aponta para prisão ou custódia.
- source_word: τι πράσσει
  choice: está fazendo nada
  rationale: Mantém o valor presente e a referência ampla à conduta do homem, sem especificar indevidamente um crime.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Este homem
  rationale: Tradução direta, natural e referente especificamente a Paulo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Conversavam” preserva o aspecto contínuo do imperfeito; “prisão” comunica o sentido judicial, enquanto a alternativa literal é registrada em nota.
