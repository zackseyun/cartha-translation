source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: pt
  text: Mas anunciei primeiro aos que estavam em Damasco, depois também em Jerusalém, por toda a região da Judeia e aos gentios[a], que se arrependessem e se voltassem para Deus, praticando obras condizentes com o arrependimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos povos”. Neste contexto, o termo se refere aos povos não judeus; por isso, “gentios” aparece no texto principal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “obras dignas de arrependimento” ou “ações próprias do arrependimento”. A expressão se refere a atos que correspondem adequadamente ao arrependimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste com a afirmação anterior de Paulo e soa natural em português.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: aos que estavam em Damasco
  rationale: Explicita de modo natural que o dativo plural se refere às pessoas presentes em Damasco.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: primeiro aos que estavam em Damasco, depois também em Jerusalém
  rationale: Expressa com clareza a sequência e a adição indicadas pela construção grega, sem sugerir que os dois lugares ocupem igualmente a primeira posição.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: por toda a região da Judeia
  rationale: χώρα designa aqui uma área geográfica; “região” evita restringir o sentido à zona rural.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: No contraste contextual com Jerusalém e a Judeia, o termo designa os povos não judeus; “gentios” preserva essa distinção histórico-religiosa.
- source_word: ἀπήγγελλον
  choice: anunciei
  rationale: No contexto missionário, comunica uma declaração pública e é mais corrente em português do que alternativas excessivamente formais.
- source_word: μετανοεῖν
  choice: que se arrependessem
  rationale: O verbo denota arrependimento diante de Deus, e não mera reconsideração intelectual; a forma subordinada ajusta-se naturalmente ao verbo “anunciei”.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: se voltassem para Deus
  rationale: Preserva a imagem de mudança de direção para Deus sem pressupor que todos estivessem retornando a uma relação anterior.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: obras dignas de arrependimento
  rationale: Mantém a relação lexical entre obras e arrependimento e deixa aberta a natureza exata dessa relação, indicando conduta correspondente.
- source_word: πράσσοντας
  choice: praticando
  rationale: O particípio presente descreve a conduta que acompanha o arrependimento e conserva uma nuance prática e contínua.
theological_decisions:
- issue: Relação entre arrependimento, volta para Deus e obras
  choice: As obras são apresentadas como conduta digna ou correspondente ao arrependimento.
  alternative: Entender as obras como o próprio conteúdo do arrependimento ou como base meritória de aceitação.
  rationale: A sintaxe apresenta arrepender-se e voltar-se para Deus como a resposta proclamada, enquanto o particípio descreve as obras que a acompanham. A tradução preserva essa relação sem definir além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a progressão geográfica e a estrutura teológica do grego. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
