id: ACT.26.16
reference: Acts 26:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: pt
  text: 'Mas levante-se e fique de pé, pois foi para isto que apareci a você: para designar você como servo e testemunha tanto das coisas nas quais você me viu como daquelas nas quais ainda aparecerei a você.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “das coisas nas quais você me viu e daquelas nas quais aparecerei a você”. A construção grega é comprimida; a relação exata entre “as coisas” e as aparições não é explicitada.'
    reason: alternativa lexical e esclarecimento da ambiguidade sintática
lexical_decisions:
- source_word: ἀνάστηθι
  choice: levante-se
  rationale: O imperativo aoristo pede uma ação imediata; “levante-se” é natural, claro e preserva a força da ordem.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: fique de pé
  rationale: Expressa de modo idiomático em português a ordem corporal vívida, sem a redundância pouco natural de “fique sobre os seus pés”.
- source_word: εἰς τοῦτο γὰρ
  choice: pois foi para isto
  rationale: Introduz claramente a finalidade da aparição e mantém a ligação explicativa de γάρ.
- source_word: ὤφθην σοι
  choice: apareci a você
  rationale: Embora a forma grega seja passiva, aqui funciona como fórmula de aparição. A tradução preserva a linguagem objetiva de manifestação sem definir seu modo.
- source_word: προχειρίσασθαί σε
  choice: para designá-lo
  rationale: O infinitivo exprime a finalidade da aparição, e “designar” comunica uma nomeação formal para determinada função.
- source_word: ὑπηρέτην
  choice: servo
  rationale: Designa alguém que atua como agente subordinado ou auxiliar. “Servo” é acessível e solene, sem a conotação eclesiástica moderna de “ministro”.
- source_word: μάρτυρα
  choice: testemunha
  rationale: É o equivalente corrente e preciso para quem dá testemunho do que viu e recebeu por revelação.
- source_word: ὧν τε εἶδές με
  choice: das coisas em que você me viu
  rationale: Mantém a construção relativa comprimida do grego e a presença de με (“me”), sem transformá-la em uma afirmação mais interpretativa sobre o conteúdo visto.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: daquelas em que ainda aparecerei a você
  rationale: Preserva o paralelismo com a primeira oração e traduz o futuro com linguagem de aparição. “Ainda” comunica naturalmente o caráter futuro, sem acrescentar um modo específico de revelação.
theological_decisions:
- issue: Natureza da linguagem revelatória em ὤφθην e ὀφθήσομαί
  choice: 'Traduzir os dois verbos com linguagem de aparição: “apareci” e “aparecerei”.'
  alternative: “fui visto / serei visto” ou “revelei-me / vou revelar-me”
  rationale: A linguagem de aparição preserva a apresentação de Jesus ressuscitado comissionando Paulo pessoalmente, sem reduzir o acontecimento a uma impressão interior nem especificar indevidamente a forma da manifestação.
- issue: Relação entre o testemunho de Paulo e as aparições presentes e futuras
  choice: 'Manter o paralelismo: “das coisas em que você me viu” e “daquelas em que ainda aparecerei a você”.'
  alternative: “do que você viu e do que eu lhe mostrarei”
  rationale: A alternativa é mais fluente, mas elimina a referência explícita a Jesus como aquele que foi visto e que tornará a aparecer. A formulação escolhida conserva a tensão e a compressão do grego.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita formas regionais menos amplamente compreendidas. “Levante-se e fique de pé” conserva as duas ordens gregas de maneira natural. A nota foi colocada junto à oração cuja construção grega ela esclarece.
