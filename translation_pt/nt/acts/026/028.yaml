  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: pt
  text: 'Então Agripa disse a Paulo[a]: “Em pouco tempo você está me persuadindo a tornar-me cristão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quase você me persuade a tornar-me cristão”; possivelmente: “Em tão pouco tempo você pensa que pode fazer de mim um cristão?” A expressão grega pode referir-se a pouco tempo ou a um pequeno grau, e o tom de Agripa pode ser sincero ou irônico.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Então Agripa
  rationale: δέ é um conectivo leve; “Então” expressa com naturalidade a progressão narrativa, sem impor um contraste forte. O artigo diante do nome próprio não é reproduzido.
- source_word: πρὸς τὸν Παῦλον
  choice: disse a Paulo
  rationale: πρός introduz o destinatário, e o verbo de fala está implícito na fórmula. Torná-lo explícito produz português claro e natural.
- source_word: Ἐν ὀλίγῳ
  choice: Em pouco tempo
  rationale: A expressão pode indicar pouco tempo ou pequena medida. A tradução principal conserva diretamente a leitura temporal, enquanto as outras possibilidades são registradas na nota.
- source_word: με πείθεις
  choice: você está me persuadindo
  rationale: O presente πείθεις pode representar uma ação em curso no diálogo. A forma progressiva preserva esse aspecto sem acrescentar a ideia explícita de mera tentativa.
- source_word: Χριστιανὸν
  choice: cristão
  rationale: O substantivo predicativo indica a identidade ou condição resultante; “cristão” é seu equivalente estabelecido em português.
- source_word: ποιῆσαι
  choice: a tornar-me
  rationale: No contexto, ποιῆσαι exprime levar alguém a assumir determinada condição. “Tornar-me cristão” é natural em português e conserva o sentido resultativo, sem a rigidez de “fazer-me cristão”.
theological_decisions:
- issue: Tom e força da resposta de Agripa
  choice: 'Declaração direta: “Em pouco tempo você está me persuadindo a tornar-me cristão.”'
  alternative: “Quase você me persuade a tornar-me cristão” ou “Em tão pouco tempo você pensa que pode fazer de mim um cristão?”
  rationale: O grego não determina se Agripa fala com sinceridade, evasão ou ironia, e Ἐν ὀλίγῳ pode apontar para tempo ou grau. O texto principal mantém a leitura superficial mais direta, e a nota preserva as alternativas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para reproduzir naturalmente a segunda pessoa singular do diálogo, sem criar distância excessiva. A colocação “tornar-me” mantém fluidez formal moderada.
