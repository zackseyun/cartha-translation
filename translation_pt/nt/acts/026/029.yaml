  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: pt
  text: 'Mas Paulo disse: “Eu pediria a Deus que, quer em pouco, quer em muito[a], não só você, mas também todos os que hoje me ouvem se tornassem como eu sou — exceto por estas correntes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em pouco tempo ou em muito tempo”; também pode significar “com pouco ou com muito esforço” ou “quase ou completamente”. A expressão grega é difícil e pode se referir a grau, esforço, tempo ou extensão.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν
  choice: Eu pediria
  rationale: O optativo potencial com ἄν expressa um desejo em forma de oração. Com τῷ θεῷ explícito, “pediria a Deus” é natural em português e mantém o caráter devocional da expressão.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo indica aquele a quem se dirige o pedido ou a oração; “a Deus” é a formulação direta e idiomática.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: em pouco ou em muito
  rationale: A expressão grega é difícil e pode indicar tempo, grau, extensão ou esforço. A tradução relativamente formal evita resolver no texto principal uma ambiguidade genuína e permite esclarecer as possibilidades em nota.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: não somente você, mas também todos os que hoje me ouvem
  rationale: Preserva o contraste enfático e o sentido presente do particípio, em linguagem moderna e amplamente compreensível.
- source_word: γενέσθαι
  choice: se tornassem
  rationale: O infinitivo dependente da expressão de desejo indica o estado resultante desejado; o imperfeito do subjuntivo é idiomático após “pediria... que”.
- source_word: τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: como eu sou
  rationale: Reproduz de modo claro e natural a comparação de Paulo consigo mesmo sem acrescentar uma interpretação.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: exceto por estas correntes
  rationale: παρεκτός introduz uma exceção, e “correntes” comunica concretamente os δεσμοί ligados à condição de prisioneiro de Paulo.
theological_decisions:
- issue: Sentido de ἐν ὀλίγῳ καὶ ἐν μεγάλῳ em resposta à fala anterior de Agripa
  choice: em pouco ou em muito
  alternative: em pouco tempo ou em muito tempo; com pouco ou com muito esforço; quase ou completamente
  rationale: A expressão admite mais de uma análise e não deve ser fixada de modo artificial. O texto principal conserva sua concisão e abertura semântica, enquanto a nota registra interpretações representativas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” corresponde ao singular σέ dirigido a Agripa. A formulação “em pouco ou em muito” preserva deliberadamente a ambiguidade do grego; a nota fornece os principais sentidos possíveis.
