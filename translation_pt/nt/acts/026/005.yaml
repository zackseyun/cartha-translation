review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente o conhecimento prévio, a disposição para dar testemunho, o rigor da corrente farisaica e a identificação de Paulo como fariseu. Contudo, a coordenação «e, se estiverem dispostos a testemunhar, sabem que» desloca a condição: no grego, a disposição condiciona o ato de testemunhar, não o fato de eles conhecerem Paulo. A formulação revista preserva esse escopo.'
  naturalness: «Eles me conhecem desde o princípio» e «vivi como fariseu» são naturais e claras. O uso parentético da condição torna a frase fluente e impede a leitura de que o conhecimento deles dependa da sua disposição de testemunhar.
  terminology: «Seita» pode ser compreendido em português atual com uma conotação mais depreciativa do que αἵρεσις exige neste contexto histórico. «Corrente» designa com neutralidade um grupo reconhecido dentro do judaísmo e é apoiado pela nota lexical. «Fariseu», «religião» e «testemunhar» são adequados.
  issues:
  - severity: medium
    issue: A condição «se estiverem dispostos a testemunhar» foi sintaticamente ligada a «sabem que».
    rationale: O texto grego diz que essas pessoas conhecem Paulo desde o início e, caso queiram, podem dar testemunho desse fato. Não diz que só sabem disso se estiverem dispostas a testemunhar.
  - severity: low
    issue: «Seita» pode sugerir um juízo pejorativo moderno.
    rationale: Embora seja uma possibilidade lexical, «corrente» evita uma conotação que não é exigida por αἵρεσις, preservando o sentido de agrupamento religioso reconhecido.
  revised_text: Eles me conhecem desde o princípio[a] — se estiverem dispostos a testemunhar —, pois vivi como fariseu segundo a corrente[b] mais rigorosa da nossa religião.
