revisions:
- from: Eles me conhecem desde o princípio[a] e, se estiverem dispostos a testemunhar, sabem que vivi como fariseu, segundo a seita[b] mais rigorosa da nossa religião.
  to: Eles me conhecem desde o princípio[a] — se estiverem dispostos a testemunhar —, pois vivi como fariseu segundo a corrente[b] mais rigorosa da nossa religião.
  rationale: A revisão remove «e ... sabem que», que fazia a disposição de testemunhar parecer condição para o conhecimento que essas pessoas tinham de Paulo. Os travessões assinalam que a condição se refere ao testemunho. «Corrente» foi escolhido como equivalente histórico e neutro para αἵρεσις em português contemporâneo, mantendo a alternativa «seita» na nota.
