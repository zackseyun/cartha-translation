source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: pt
  text: Eles me conhecem desde o princípio[a] — se estiverem dispostos a testemunhar —, pois vivi como fariseu segundo a corrente[b] mais rigorosa da nossa religião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desde os primeiros tempos» ou «há muito tempo».'
    reason: lexical_alternative
  - marker: b
    text: O termo grego aqui significa «seita», «partido» ou «corrente», não «heresia» no sentido técnico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: me conhecem
  rationale: O particípio expressa conhecimento anterior que continua relevante no presente; em português, o presente com «desde» comunica isso de modo natural.
- source_word: ἄνωθεν
  choice: desde o princípio
  rationale: Neste contexto, indica o início ou os primeiros tempos da convivência com Paulo, e não «do alto».
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: se estiverem dispostos a testemunhar
  rationale: Preserva a ideia de disposição ou vontade em θέλωσι e o sentido forense de μαρτυρεῖν.
- source_word: ἀκριβεστάτην
  choice: mais rigorosa
  rationale: O superlativo descreve o elevado rigor da corrente religiosa; «mais rigorosa» é claro e idiomático.
- source_word: αἵρεσιν
  choice: seita
  rationale: Designa aqui uma corrente ou grupo reconhecido dentro do judaísmo, sem o sentido técnico posterior de heresia.
- source_word: θρησκείας
  choice: religião
  rationale: Refere-se ao sistema religioso judaico compartilhado por Paulo e seus ouvintes.
- source_word: ἔζησα Φαρισαῖος
  choice: vivi como fariseu
  rationale: Expressa naturalmente tanto a identidade quanto o modo de vida resumido pelo aoristo.
theological_decisions:
- issue: Sentido histórico de αἵρεσις
  choice: seita
  alternative: heresia; partido; corrente
  rationale: «Seita» conserva a referência a um grupo interno do judaísmo. «Heresia» importaria o sentido eclesiástico técnico posterior; «partido» poderia sugerir uma organização predominantemente política.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A oração foi levemente reordenada e «sabem que» foi explicitado para evitar que «testemunhar que vivi» soe como complemento direto obrigatório, sem alterar a afirmação de que as testemunhas conhecem a vida anterior de Paulo.
