  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: pt
  text: Por que vocês consideram inacreditável que Deus ressuscite os mortos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Por que
  rationale: Neste contexto interrogativo, introduz a razão pela qual algo é considerado inacreditável.
- source_word: ἄπιστον
  choice: incrível
  rationale: Aqui significa aquilo em que não se pode crer ou que parece inacreditável, não simplesmente algo surpreendente.
- source_word: κρίνεται
  choice: consideram
  rationale: A forma passiva grega, literalmente 'é julgado', é expressa de modo natural em português com construção ativa, preservando o sentido de avaliação.
- source_word: παρ’ ὑμῖν
  choice: vocês
  rationale: Identifica os ouvintes como aqueles que fazem tal avaliação; a construção ativa incorpora naturalmente o valor de 'por vocês'.
- source_word: εἰ
  choice: que
  rationale: Depois de uma expressão de avaliação, o português idiomático introduz com 'que' o conteúdo considerado incrível; o grego pode ser vertido mais literalmente por 'se'.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Deus ressuscite os mortos
  rationale: Mantém Deus como agente e traduz ἐγείρει pelo verbo português convencional e semanticamente preciso para levantar mortos à vida.
theological_decisions:
- issue: Força de εἰ na pergunta
  choice: que Deus ressuscite os mortos
  alternative: se Deus ressuscita os mortos
  rationale: A frase questiona por que a ressurreição divina é julgada inacreditável, sem sugerir dúvida do narrador sobre o poder de Deus. O subjuntivo português decorre da construção com 'considerar incrível', não de incerteza teológica.
- issue: Aspecto da ação de ἐγείρει
  choice: ressuscite
  alternative: ressuscitou / ressuscitará
  rationale: Preserva a formulação geral do presente grego e evita restringir a pergunta exclusivamente a um evento passado ou futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'vocês' adequado à legibilidade brasileira. A ordem foi naturalizada sem perder a pergunta retórica nem a responsabilidade dos ouvintes por seu julgamento.
