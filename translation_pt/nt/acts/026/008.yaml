  source_fidelity: A pergunta retórica, a avaliação atribuída aos ouvintes, Deus como agente e a ressurreição dos mortos estão preservados. Contudo, «incrível» pode significar apenas extraordinário ou admirável; ἄπιστον neste contexto significa «inacreditável»/«difícil de crer».
  naturalness: A construção ativa com «vocês consideram» é natural em português moderno e comunica adequadamente o passivo grego «é julgado». O subjuntivo em «que Deus ressuscite» é idiomático após «considerar inacreditável».
  terminology: «Ressuscitar os mortos» é a expressão teológica e lexicalmente adequada para ἐγείρει νεκρούς. «Inacreditável» representa melhor ἄπιστον do que «incrível».
