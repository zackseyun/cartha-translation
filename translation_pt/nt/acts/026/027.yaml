  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: pt
  text: Rei Agripa, você crê nos profetas?[a] Eu sei que crê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aceita o testemunho dos profetas” ou “confia nos profetas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: você crê
  rationale: O presente ativo, na segunda pessoa do singular, forma uma pergunta direta. “Crer nos profetas” expressa aceitar como verdadeiro o testemunho deles, sem ampliar o sentido para obediência ou religiosidade genérica.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Rei Agripa
  rationale: O vocativo é vertido pela forma de tratamento natural e digna em português moderno; o nome segue a transliteração portuguesa consagrada.
- source_word: τοῖς προφήταις
  choice: nos profetas
  rationale: Com πιστεύω, o dativo indica aqueles cujo testemunho é crido. A tradução direta preserva a referência aos profetas reconhecidos nas Escrituras.
- source_word: οἶδα
  choice: Eu sei
  rationale: O verbo de forma perfeita tem sentido presente e afirma conhecimento de maneira direta, sem atenuação.
- source_word: ὅτι πιστεύεις
  choice: que crê
  rationale: A repetição de πιστεύεις é preservada lexicalmente. Em português, não há necessidade de acrescentar um auxiliar enfático; a afirmação categórica e o contexto comunicam a ênfase retórica.
theological_decisions:
- issue: Natureza da crença “nos profetas”
  choice: Entendida como crer no testemunho dos profetas
  alternative: aceitar os profetas; confiar nos profetas
  rationale: πιστεύω com dativo, neste contexto, aponta naturalmente para considerar verdadeiro ou aceitar o testemunho profético. A redação não transforma essa crença numa afirmação doutrinária mais abrangente do que o apelo retórico de Paulo permite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Você” torna explícito o singular do grego e soa natural no diálogo; a repetição de “crê” mantém a formulação concisa e retoricamente incisiva.
