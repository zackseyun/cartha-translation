  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: pt
  text: E agora estou sendo julgado por causa da esperança na promessa feita por Deus aos nossos antepassados,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “aos nossos pais”. Aqui se refere aos antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Mantém a ligação com o argumento anterior e introduz naturalmente a situação presente de Paulo.
- source_word: ἐπ’ ἐλπίδι
  choice: por causa da esperança
  rationale: ἐπί com o dativo expressa aqui a base ou causa do julgamento; a formulação é natural em português e preserva esse valor causal.
- source_word: ἐπαγγελίας
  choice: promessa
  rationale: O genitivo depende de ἐλπίδι; “promessa” conserva de modo claro e direto o referente da esperança.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: da promessa ... aos nossos pais
  rationale: A expressão com εἰς indica os destinatários da promessa. “Aos nossos pais” reproduz a relação sem acrescentar uma explicação ao texto principal.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: feita por Deus
  rationale: O particípio com ὑπό e genitivo preserva explicitamente a agência divina; “feita por Deus” é idiomático em português.
- source_word: πατέρας ἡμῶν
  choice: nossos pais
  rationale: Traduz diretamente o masculino plural grego e conserva a linguagem pactual referente aos antepassados de Israel; a possível leitura mais abrangente é indicada em nota.
- source_word: ἕστηκα κρινόμενος
  choice: estou sendo julgado
  rationale: O perfeito ἕστηκα tem força estativa presente, e κρινόμενος descreve a situação judicial em curso. A expressão portuguesa comunica naturalmente que Paulo se encontra submetido a julgamento.
theological_decisions:
- issue: Identidade de “nossos pais”
  choice: os pais de Israel, entendidos no contexto de sua história pactual
  alternative: os antepassados do povo judeu em sentido genérico
  rationale: No discurso diante de Agripa, a expressão remete à história de Israel e aos destinatários ancestrais da promessa divina. O texto principal mantém a expressão formal, sem especificar além do grego.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. “Estou sendo julgado” preserva o cenário judicial em linguagem corrente; “esperança da promessa” mantém a construção genitiva e sua possível tensão sem convertê-la interpretativamente em “esperança na promessa”.
