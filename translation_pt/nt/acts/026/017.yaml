translation:
  language: pt
  text: livrando você do povo e dos gentios[a], aos quais eu envio você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resgatando você do povo judeu e dos gentios”.'
    reason: 'Alternativa lexical e explicitação contextual: ἐξαιρούμενός pode ser traduzido por “resgatando”, e “o povo” refere-se aqui, no contraste com “os gentios”, ao povo judeu.'
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: livrando
  rationale: O particípio presente médio de ἐξαιρέω expressa aqui a ação protetora e contínua de Jesus em relação a Paulo. “Livrando” é natural em português e conserva a ideia de resgate diante de grupos hostis.
- source_word: τοῦ λαοῦ
  choice: do povo
  rationale: No contraste com “os gentios”, λαός se refere contextualmente ao povo judeu ou a Israel. A formulação literal “do povo” preserva o modo de expressão grego e sua perspectiva judaica interna.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: Embora ἔθνη também possa significar “nações”, neste contraste em Atos designa os não judeus; “gentios” comunica com clareza esse sentido contextual.
- source_word: εἰς οὓς
  choice: aos quais
  rationale: Após um verbo de envio, εἰς com o pronome relativo indica os destinatários da missão. “Aos quais” é natural e mantém a referência gramatical aos gentios.
- source_word: ἀποστέλλω
  choice: eu o envio
  rationale: O presente do indicativo apresenta a comissão dada por Jesus. “Eu o envio” é corrente e solene em português, sem exigir uma forma progressiva pouco natural neste contexto.
theological_decisions:
- issue: Referente de “o povo” em contraste com “os gentios”
  choice: Manter “o povo” no texto principal, entendendo-o contextualmente como o povo judeu.
  alternative: Explicitar “o povo judeu” ou “Israel”.
  rationale: O contraste indica claramente judeus e gentios, mas o grego traz apenas “o povo”. A tradução conserva essa forma e registra a explicitação possível em nota, sem eliminar a perspectiva ou a concisão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “você” para o singular dirigido a Paulo e “o” como objeto de “envio”. A pontuação mantém o caráter de trecho contínuo da fala.
