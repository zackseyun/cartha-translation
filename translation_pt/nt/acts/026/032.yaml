  source_fidelity: A tradução preserva com precisão a progressão de δέ (“Então”), a fórmula narrativa ἔφη (“disse”), a possibilidade passada expressa por ἐδύνατο com o infinitivo perfeito passivo ἀπολελύσθαι (“poderia ter sido solto”) e a condição contrafactual introduzida por εἰ μή. “Apelado para César” comunica adequadamente o sentido jurídico de ἐπεκέκλητο Καίσαρα, sem acrescentar a noção mais estreita de absolvição.
