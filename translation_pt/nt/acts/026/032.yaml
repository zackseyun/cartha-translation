  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: pt
  text: 'Então Agripa disse a Festo: “Este homem poderia ter sido solto[a] se não tivesse apelado para César.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “posto em liberdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão narrativa e introduz a observação conclusiva de Agripa de modo natural em português.
- source_word: ἔφη
  choice: disse
  rationale: Embora seja uma forma no imperfeito, φημί funciona aqui como fórmula narrativa de introdução da fala; “disse” é a expressão idiomática adequada.
- source_word: Ἀπολελύσθαι
  choice: ter sido solto
  rationale: O infinitivo perfeito passivo de ἀπολύω indica que o homem poderia ter sido libertado. “Solto” é natural no contexto de custódia e não implica necessariamente uma absolvição formal.
- source_word: ἐδύνατο
  choice: poderia
  rationale: Expressa uma possibilidade passada que não se concretizou; o condicional português, em combinação com a oração seguinte, preserva esse valor contrafactual.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Este homem
  rationale: Preserva tanto a referência masculina específica a Paulo quanto a força demonstrativa de οὗτος.
- source_word: εἰ μὴ
  choice: se não
  rationale: Introduz de maneira clara e natural a condição contrária ao fato.
- source_word: ἐπεκέκλητο
  choice: tivesse apelado
  rationale: No contexto jurídico romano, ἐπικαλέω com César designa formalmente recorrer ao imperador para julgamento.
- source_word: Καίσαρα
  choice: César
  rationale: Mantém o título histórico e a formulação jurídica do texto, sem substituí-lo pela explicação interpretativa “o imperador”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A construção “poderia ter sido solto” conserva a possibilidade passada não realizada, e “apelado para César” comunica com precisão o contexto jurídico romano.
