  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: pt
  text: Nesse contexto[a], quando eu ia para Damasco com autoridade e uma autorização dos principais sacerdotes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Nestas coisas”, retomando as ações e intenções de Paulo mencionadas anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Nessas circunstâncias
  rationale: Retoma de modo natural, em português, as ações e intenções persecutórias mencionadas anteriormente, sem acrescentar a ideia mais específica de uma missão.
- source_word: πορευόμενος
  choice: eu ia
  rationale: O particípio presente indica uma ação em andamento no contexto narrativo; a forma é simples, contemporânea e natural em português.
- source_word: εἰς τὴν Δαμασκὸν
  choice: para Damasco
  rationale: A preposição εἰς com nome de cidade indica naturalmente o destino do deslocamento.
- source_word: μετ’ ἐξουσίας
  choice: com autoridade
  rationale: ἐξουσία designa aqui autoridade delegada, não mero poder ou força.
- source_word: ἐπιτροπῆς
  choice: uma comissão
  rationale: O termo indica um encargo ou autorização oficial confiada a Paulo; “comissão” preserva tanto a autorização quanto a tarefa delegada.
- source_word: τῆς τῶν ἀρχιερέων
  choice: dos chefes dos sacerdotes
  rationale: O genitivo aponta para a origem da autoridade e da comissão; em português, a construção com “dos” é natural e mantém essa relação.
- source_word: ἀρχιερέων
  choice: chefes dos sacerdotes
  rationale: No contexto judaico do período, o plural se refere à liderança sacerdotal superior, e não a vários ocupantes simultâneos do cargo singular de sumo sacerdote.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte. “Nessas circunstâncias” preserva a referência retrospectiva de Ἐν οἷς sem a rigidez de uma tradução estritamente literal.
