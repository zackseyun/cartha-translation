  source_fidelity: A tradução reproduz adequadamente a repetição dos imperfeitos, a coerção tentada, a blasfêmia sem objeto expresso e a hostilidade intensa. Contudo, “até mesmo em cidades de fora” enfraquece o movimento/extensão direcional de ἕως καὶ εἰς. A formulação revista explicita que a perseguição se estendeu até essas cidades, sem definir indevidamente quais eram.
  naturalness: O português é moderno, claro e de registro adequado. A pequena reestruturação final torna a direção geográfica mais nítida e mantém uma cadência natural.
  terminology: “Castigava”, “obrigá-los a blasfemar”, “enfurecido ao extremo” e “persegui-los” são escolhas apropriadas. “Cidades de fora” preserva a abertura geográfica do grego melhor que “cidades estrangeiras”.
