source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: pt
  text: E, em todas as sinagogas, muitas vezes eu os castigava e tentava obrigá-los a blasfemar. Enfurecido ao extremo contra eles, continuei a persegui-los, chegando até mesmo às cidades de fora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até mesmo em cidades de fora”; a expressão provavelmente se refere a cidades além da Judeia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: em todas as sinagogas
  rationale: κατά com acusativo tem sentido distributivo/local, indicando ação repetida nos diversos ambientes das sinagogas. A formulação é natural e preserva a abrangência.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: muitas vezes eu os castigava
  rationale: πολλάκις explicita repetição, e o particípio τιμωρῶν descreve a circunstância ou o meio contemporâneo ao verbo principal. O imperfeito em português comunica ação reiterada.
- source_word: ἠνάγκαζον
  choice: tentava obrigá-los
  rationale: O imperfeito pode retratar coerção repetida ou tentada, sem afirmar que o resultado foi alcançado em todos os casos.
- source_word: βλασφημεῖν
  choice: a blasfemar
  rationale: Mantém o objeto da blasfêmia sem especificação, como no grego, embora o contexto sugira Jesus ou a confissão cristã.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: Enfurecido ao extremo contra eles
  rationale: περισσῶς intensifica a hostilidade furiosa expressa por ἐμμαινόμενος. A escolha evita associações modernas indevidas com doença mental.
- source_word: ἐδίωκον
  choice: continuei a persegui-los
  rationale: O imperfeito indica perseguição contínua ou reiterada; 'continuei a perseguir' preserva essa força aspectual.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: até mesmo em cidades de fora
  rationale: A expressão significa literalmente cidades exteriores ou de fora. Esta opção preserva a relativa abertura geográfica do grego, em vez de fixar necessariamente 'estrangeiras'.
theological_decisions:
- issue: Objeto de βλασφημεῖν na perseguição promovida por Paulo
  choice: blasfemar, sem objeto expresso
  alternative: blasfemar contra Jesus ou renunciar à confissão cristã
  rationale: O contexto favorece essas interpretações, mas o texto grego não declara o objeto; a tradução preserva essa indeterminação.
- issue: Alcance geográfico de τὰς ἔξω πόλεις
  choice: cidades de fora
  alternative: cidades estrangeiras ou cidades fora da Judeia
  rationale: O contexto pode apontar para cidades além da Judeia, mas a expressão grega não nomeia explicitamente a fronteira em questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o longo período grego para maior clareza, sem alterar a progressão do relato.
