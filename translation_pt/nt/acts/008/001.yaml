id: ACT.8.1
reference: Acts 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: pt
  text: Saulo aprovava que ele fosse morto. Naquele dia, levantou-se uma grande perseguição contra a igreja em Jerusalém, e todos foram dispersos pelas regiões da Judeia e de Samaria, com exceção dos apóstolos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal grego.
- source_word: συνευδοκῶν
  choice: aprovava
  rationale: Com ἦν, o particípio indica aprovação contínua ou contemporânea; o imperfeito português expressa isso naturalmente sem sugerir participação direta no ato.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: a morte dele
  rationale: No contexto, ἀναίρεσις se refere ao ato de tirar-lhe a vida. 'A morte dele' é natural em português e evita tanto conferir legitimidade jurídica com 'execução' quanto impor de modo explícito a qualificação jurídico-moral de 'assassinato'.
- source_word: Ἐγένετο
  choice: levantou-se
  rationale: Expressa de maneira idiomática o surgimento da perseguição naquele dia.
- source_word: διωγμὸς μέγας
  choice: uma grande perseguição
  rationale: Preserva diretamente o substantivo e a intensidade indicada por μέγας.
- source_word: ἐπὶ τὴν ἐκκλησίαν
  choice: contra a igreja
  rationale: Neste contexto hostil, 'contra' comunica com clareza a direção da perseguição.
- source_word: τὴν ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Identifica de modo conciso e natural a localização da igreja.
- source_word: πάντες
  choice: todos
  rationale: Mantém a força abrangente do termo, cujo alcance é delimitado logo depois pela exceção dos apóstolos.
- source_word: διεσπάρησαν
  choice: foram dispersos
  rationale: Preserva a voz passiva e comunica uma dispersão causada pela perseguição.
- source_word: κατὰ τὰς χώρας
  choice: pelas regiões
  rationale: Representa naturalmente a distribuição geográfica por diferentes territórios.
- source_word: τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: da Judeia e de Samaria
  rationale: Emprega as formas geográficas convencionais em português.
- source_word: πλὴν τῶν ἀποστόλων
  choice: com exceção dos apóstolos
  rationale: Expressa de forma clara e idiomática a exceção marcada por πλήν.
theological_decisions:
- issue: Sentido de ἀναιρέσει αὐτοῦ em relação à morte de Estêvão
  choice: a morte dele
  alternative: a execução dele; o assassinato dele; o ato de matá-lo
  rationale: A formulação mantém o fato de que Saulo aprovava a morte infligida a Estêvão, sem atribuir ao ato legitimidade jurídica por meio de 'execução' nem acrescentar ao próprio substantivo a classificação explícita de 'assassinato'.
- issue: Alcance de πάντες ('todos')
  choice: todos foram dispersos ... com exceção dos apóstolos
  alternative: todos os fiéis foram dispersos; todos foram dispersos, menos os apóstolos
  rationale: Conserva a formulação abrangente do texto e sua própria ressalva, permitindo que o contexto determine que o referente são os membros da igreja de Jerusalém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial foi vertida sem um marcador temporal inexistente no grego; 'Naquele dia' inicia naturalmente a segunda frase. A tradução evita arcaísmos e explicitações denominacionais.
