  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: pt
  text: 'Mas Simão respondeu: “Orem vocês ao Senhor por mim, para que nada do que disseram venha sobre mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: Mas Simão respondeu
  rationale: A construção idiomática com o particípio ἀποκριθείς e εἶπεν introduz uma resposta; “respondeu” evita duplicação artificial. δέ marca a transição contrastiva após a repreensão de Pedro.
- source_word: Δεήθητε ὑμεῖς
  choice: Orem vocês
  rationale: O imperativo plural pede uma oração ou súplica, e o pronome explícito ὑμεῖς dá ênfase aos interlocutores. A ordem “Orem vocês” preserva essa ênfase em português natural e deixa claro o plural.
- source_word: ὑπὲρ ἐμοῦ
  choice: por mim
  rationale: ὑπέρ com o genitivo expressa intercessão em favor de alguém; “por mim” é a forma corrente e precisa.
- source_word: πρὸς τὸν κύριον
  choice: ao Senhor
  rationale: Após o verbo de oração, πρός indica a pessoa a quem a súplica é dirigida. “Ao Senhor” é idiomático e mantém κύριος sem especificar além do texto.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: para que nada ... venha sobre mim
  rationale: ὅπως introduz o resultado pretendido da oração; ἐπέρχομαι com ἐπί comunica algo que sobrevém à pessoa, aqui com provável sentido de juízo ou adversidade. “Venha sobre mim” preserva essa força solene.
- source_word: ὧν εἰρήκατε
  choice: do que disseram
  rationale: 'O relativo genitivo depende de μηδέν: literalmente, nada dentre aquilo que foi dito. Em português, “nada do que disseram” transmite naturalmente a construção; o contexto mantém a relevância presente do perfeito grego.'
theological_decisions:
- issue: Referente de τὸν κύριον
  choice: o Senhor
  alternative: Deus; o Senhor Jesus
  rationale: O grego diz apenas “o Senhor”. Como κύριος em Atos pode designar Deus ou Jesus conforme o contexto, a tradução conserva o mesmo grau de especificidade e não resolve uma ambiguidade que o versículo mantém.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Orem vocês” preserva tanto o plural quanto a ênfase do pronome grego; evita-se “vós”, que soaria arcaico em grande parte do público-alvo. Não foi incluída nota, pois a possível formulação alternativa do genitivo está adequadamente representada por “nada do que disseram” e não altera o sentido de modo relevante.
