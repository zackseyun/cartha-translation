id: ACT.8.10
reference: Acts 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: pt
  text: 'Todos lhe davam atenção, do menor ao maior, dizendo: “Este homem é o poder de Deus chamado Grande.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o chamado Grande Poder de Deus.” A expressão grega também pode ser traduzida de modo mais compacto, como um título.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: lhe davam atenção
  rationale: O verbo προσέχω expressa atenção dirigida e contínua neste contexto. “Davam atenção” é natural em português e não sugere, além do texto, devoção ou lealdade.
- source_word: πάντες
  choice: Todos
  rationale: Preserva a abrangência explícita do plural grego.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: do menor ao maior
  rationale: Mantém o merismo que abrange todas as camadas ou posições sociais, em formulação corrente e digna.
- source_word: λέγοντες
  choice: dizendo
  rationale: Reproduz o particípio simultâneo sem introduzir uma relação adicional não expressa no grego.
- source_word: Οὗτός
  choice: Este homem
  rationale: O demonstrativo aponta para Simão. A explicitação de “homem” soa natural em português e preserva a referência pessoal.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: o poder de Deus
  rationale: Conserva a estrutura titular da expressão grega e apresenta fielmente a alegação da multidão.
- source_word: ἡ καλουμένη Μεγάλη
  choice: chamado Grande
  rationale: Preserva a ideia passiva de designação e trata “Grande” como o nome ou epíteto atribuído ao poder. A concordância masculina decorre de “poder” em português.
theological_decisions:
- issue: Se a declaração da multidão deve soar como título divino formal ou como descrição de Simão
  choice: 'Manter na fala citada: “Este homem é o poder de Deus chamado Grande.”'
  alternative: “Este é o chamado Grande Poder de Deus.”
  rationale: O narrador relata a alegação feita acerca de Simão sem endossá-la. A redação preserva tanto o conteúdo da atribuição quanto a tensão teológica, sem elevar tipograficamente a expressão a um título confirmado pelo narrador.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção conserva a força da citação e a possível linguagem de título sem recorrer a formulações arcaicas.
