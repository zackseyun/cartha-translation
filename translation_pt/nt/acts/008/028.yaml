  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: pt
  text: Ele estava voltando, sentado em sua carruagem, e lia o profeta Isaías.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, lia o escrito do profeta Isaías. Na antiguidade, a leitura era frequentemente feita em voz alta; portanto, “lia em voz alta” também é possível, embora o verbo grego aqui não diga isso explicitamente.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Ele estava voltando
  rationale: A construção perifrástica ἦν com o particípio presente apresenta uma ação em andamento no passado. “Estava voltando” preserva esse aspecto sem acrescentar um destino não expresso no grego; τέ funciona como conexão leve e não exige tradução separada.
- source_word: καθήμενος
  choice: sentado
  rationale: O particípio descreve a postura dele durante a viagem. “Sentado” é natural em português e mantém o sentido estativo.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: em sua carruagem
  rationale: Embora ἐπί com genitivo possa ter o sentido espacial de “sobre”, em português é mais idiomático dizer que alguém está “em” uma carruagem. “Sua” preserva αὐτοῦ.
- source_word: ἀνεγίνωσκεν
  choice: lia
  rationale: O imperfeito indica uma ação contínua no passado. “Lia” expressa naturalmente esse aspecto; não se acrescenta “em voz alta”, pois isso não é explicitado pelo verbo neste contexto.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: o profeta Isaías
  rationale: A expressão pode designar o profeta ou, por metonímia, seu livro. A ordem “o profeta Isaías” segue de perto a ordem grega e é natural em português.
theological_decisions:
- issue: 'Objeto da leitura: pessoa ou livro profético'
  choice: Manter “lia o profeta Isaías” no texto
  alternative: “lia o livro do profeta Isaías”
  rationale: O grego nomeia literalmente “o profeta Isaías”, usando o autor para se referir ao escrito. Acrescentar “o livro de” esclareceria a metonímia, mas introduziria palavras não expressas no texto; a formulação literal continua compreensível e preserva a concisão do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva as ações simultâneas e o aspecto contínuo do relato, evitando tanto o acréscimo de “para casa” quanto a explicitação não obrigatória de leitura em voz alta.
