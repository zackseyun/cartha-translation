  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: pt
  text: Em sua humilhação, a justiça lhe foi tirada[b]. Quem contará a sua geração[a]? Pois a sua vida é tirada da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus descendentes” ou “seus contemporâneos”; o grego “geração” preserva a ambiguidade da citação de Isaías 53.
    reason: alternative_reading
  - marker: b
    text: Ou “o julgamento lhe foi tirado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: humilhação
  rationale: O substantivo indica rebaixamento ou estado de humilhação. “Humilhação” é natural em português e se ajusta ao contexto do sofrimento injusto sem acrescentar interpretação.
- source_word: κρίσις
  choice: justiça
  rationale: Embora também possa significar “julgamento”, neste contexto judicial a expressão aponta para a privação de tratamento justo. “Justiça” comunica esse sentido, enquanto a alternativa mais formal é preservada em nota.
- source_word: ἤρθη
  choice: foi tirada
  rationale: O aoristo passivo de αἴρω expressa remoção ou privação. “Foi tirada” mantém a imagem e a voz passiva do grego.
- source_word: γενεὰν
  choice: geração
  rationale: γενεά pode referir-se à geração, aos descendentes ou aos contemporâneos. “Geração” conserva no texto a ambiguidade da citação de Isaías 53.
- source_word: διηγήσεται
  choice: contará
  rationale: O verbo significa narrar, relatar ou expor. “Contará” é conciso e preserva a forma retórica, embora a frase continue deliberadamente difícil.
- source_word: αἴρεται
  choice: é tirada
  rationale: O presente passivo produz vivacidade. “É tirada” reproduz a voz e mantém a ligação verbal com ἤρθη.
- source_word: γῆς
  choice: terra
  rationale: “Terra” é a equivalência mais natural na expressão que descreve a retirada da vida terrena.
- source_word: ζωὴ
  choice: vida
  rationale: O sentido direto é a vida, aqui no contexto da morte do servo citado em Isaías.
theological_decisions:
- issue: Sentido de “sua geração”
  choice: Manter “sua geração” no texto principal.
  alternative: “seus descendentes” ou “seus contemporâneos”
  rationale: A expressão de Isaías 53 é interpretativamente difícil. A tradução não decide se ela se refere à descendência, aos contemporâneos ou à geração do personagem; as possibilidades são registradas em nota.
- issue: Sentido de κρίσις
  choice: Traduzir por “justiça”.
  alternative: “julgamento”
  rationale: No contexto, “justiça” expressa que lhe foi negado um processo ou tratamento justo. A alternativa “julgamento” permanece possível e é indicada em nota, sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e as vozes passivas do grego foram mantidas quando naturais; as ambiguidades de γενεά e κρίσις foram preservadas por meio do texto e das notas.
