  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: pt
  text: Quando saíram da água, o Espírito do Senhor arrebatou Filipe,[a] e o eunuco não o viu mais, pois seguiu o seu caminho cheio de alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levou Filipe embora”. O verbo grego pode destacar uma retirada súbita e vigorosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: saíram da água
  rationale: Expressa de modo natural em português o movimento para cima e para fora indicado por ἀναβαίνω com ἐκ, sem especificar além do texto a forma do batismo.
- source_word: πνεῦμα κυρίου
  choice: o Espírito do Senhor
  rationale: No uso de Lucas–Atos, a expressão refere-se naturalmente ao Espírito de Deus como agente divino; as maiúsculas refletem essa leitura contextual.
- source_word: ἥρπασεν
  choice: arrebatou Filipe
  rationale: Ἁρπάζω comunica retirada súbita e vigorosa. “Arrebatou” preserva essa força e o caráter extraordinário da ação, embora seja menos cotidiano; uma alternativa mais simples é registrada em nota.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: não o viu mais
  rationale: 'Reproduz com clareza a negação acompanhada de οὐκέτι: a partir daquele momento, o eunuco deixou de ver Filipe.'
- source_word: ὁ εὐνοῦχος
  choice: o eunuco
  rationale: Mantém a designação explícita do personagem e a continuidade com a narrativa anterior.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: seguiu o seu caminho
  rationale: O imperfeito descreve a continuidade da viagem; esta formulação é natural e preserva a ideia de prosseguir pelo próprio caminho.
- source_word: χαίρων
  choice: cheio de alegria
  rationale: Transmite como circunstância contínua a alegria que acompanhava o prosseguimento da viagem, em linguagem corrente e digna.
theological_decisions:
- issue: Se πνεῦμα κυρίου designa o Espírito Santo ou uma força divina impessoal
  choice: 'Agência divina pessoal: “o Espírito do Senhor”'
  alternative: “um espírito do Senhor” ou uma força procedente do Senhor
  rationale: Em Lucas–Atos, a expressão normalmente designa o Espírito de Deus agindo de maneira pessoal e poderosa. A tradução não acrescenta “Santo”, mas a capitalização manifesta a leitura contextual.
- issue: Se ἥρπασεν deve explicitar uma retirada milagrosa e súbita
  choice: “arrebatou Filipe”
  alternative: “levou Filipe embora”
  rationale: O sujeito divino e a força lexical do verbo indicam uma intervenção extraordinária e repentina. “Arrebatou” preserva isso sem explicar o mecanismo do desaparecimento.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é narrativa e digna; “arrebatou” preserva uma nuance lexical importante, enquanto a nota oferece uma formulação mais cotidiana. O marcador [a] aparece imediatamente após a expressão a que se refere.
