  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: pt
  text: 'Então Filipe correu até ele e o ouviu lendo o profeta Isaías. E perguntou: “Você entende mesmo o que está lendo?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você de fato entende o que está lendo?” As partículas gregas dão ênfase à pergunta de Filipe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: correu até ele
  rationale: O particípio aoristo de προστρέχω expressa movimento rápido em direção ao eunuco e à carruagem; a formulação preserva a vivacidade e explicita naturalmente o alvo já claro no contexto.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ faz a narrativa avançar; “Então” é uma ligação corrente e natural em português.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: o ouviu lendo
  rationale: A construção com ἀκούω e particípio no genitivo indica que Filipe o ouviu enquanto lia. Não se acrescenta “em voz alta”, pois isso é provável no contexto antigo, mas não está explícito no grego.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: o profeta Isaías
  rationale: Esta ordem é mais idiomática em português moderno e preserva integralmente a identificação de Isaías como profeta.
- source_word: εἶπεν
  choice: perguntou
  rationale: Embora λέγω corresponda literalmente a “dizer”, a fala que segue é uma pergunta direta; “perguntou” comunica com naturalidade o ato de fala sem alterar seu conteúdo.
- source_word: Ἆρά γε
  choice: mesmo
  rationale: A combinação de partículas confere ênfase e caráter investigativo à pergunta; “mesmo” reproduz essa força em português corrente sem torná-la excessivamente cética.
- source_word: γινώσκεις
  choice: entende
  rationale: No contexto, γινώσκω se refere à compreensão do sentido do texto, não ao mero conhecimento ou reconhecimento.
- source_word: ἃ ἀναγινώσκεις
  choice: o que está lendo
  rationale: O pronome relativo neutro plural designa o conteúdo lido; a locução progressiva representa naturalmente o presente em curso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a pergunta natural e direta; “mesmo” mantém a ênfase das partículas gregas. A divisão em duas frases evita uma coordenação pesada sem mudar a sequência narrativa.
