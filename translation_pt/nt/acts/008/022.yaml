id: ACT.8.22
reference: Acts 8:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: pt
  text: Portanto, arrependa-se desta sua maldade e suplique ao Senhor para que, talvez, lhe seja perdoada a intenção do seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe seja perdoado o pensamento do seu coração”.'
    reason: ἐπίνοια pode significar tanto “intenção” quanto “pensamento”; a nota preserva a alternativa lexical genuína.
lexical_decisions:
- source_word: μετανόησον
  choice: arrependa-se
  rationale: O imperativo aoristo pede uma resposta decisiva; “arrependa-se” preserva de modo natural a força moral e espiritual.
- source_word: οὖν
  choice: portanto
  rationale: Expressa a conclusão decorrente da repreensão anterior de Pedro.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: desta sua maldade
  rationale: κακία indica aqui maldade moral. A construção com “arrepender-se de” é idiomática em português, e “sua” conserva a ênfase possessiva.
- source_word: δεήθητι
  choice: suplique
  rationale: O verbo denota um pedido insistente; “suplique ao Senhor” comunica essa intensidade melhor que o simples “ore”.
- source_word: τοῦ κυρίου
  choice: ao Senhor
  rationale: Mantém o título κύριος sem definir além do que o contexto exige se a referência é especificamente a Jesus ou a Deus.
- source_word: εἰ ἄρα
  choice: para que, talvez
  rationale: A formulação preserva a contingência e a cautela da expressão grega, sem garantir nem negar o perdão.
- source_word: ἀφεθήσεταί σοι
  choice: lhe seja perdoada
  rationale: A forma passiva mantém Deus como agente implícito do perdão; o subjuntivo português se ajusta naturalmente à ideia de possibilidade.
- source_word: ἡ ἐπίνοια
  choice: a intenção
  rationale: No contexto, refere-se ao propósito interior por trás do pedido de Simão, embora também possa significar “pensamento”.
- source_word: τῆς καρδίας σου
  choice: do seu coração
  rationale: Reproduz o genitivo e conserva a linguagem antropológica bíblica de modo inteligível.
theological_decisions:
- issue: Grau de certeza quanto à possibilidade de perdão
  choice: Pedro ordena que Simão se arrependa e suplique, deixando o perdão expresso de maneira condicional.
  alternative: Traduzir como promessa segura de perdão ou como indicação de que o perdão é improvável ou impossível.
  rationale: εἰ ἄρα introduz uma possibilidade cautelosa. A tradução preserva essa tensão, sem convertê-la em garantia nem em desespero.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arrependa-se” e “suplique” mantêm a solenidade sem arcaísmo; a sintaxe procura conservar a cautela do grego.
