id: ACT.8.11
reference: Acts 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: pt
  text: E davam atenção a ele porque, durante muito tempo, ele os havia deixado maravilhados com suas práticas de magia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com suas feitiçarias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: davam atenção
  rationale: O imperfeito indica uma atitude contínua ou habitual; “davam atenção” é natural em português e expressa que o povo escutava e seguia atentamente Simão.
- source_word: αὐτῷ
  choice: a ele
  rationale: Reproduz naturalmente o objeto dativo exigido por προσέχω.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: porque, durante muito tempo
  rationale: διά com infinitivo articular expressa causa, e ἱκανῷ χρόνῳ indica um período prolongado. A formulação é clara e idiomática.
- source_word: ταῖς μαγείαις
  choice: com suas práticas de magia
  rationale: μαγεία designa práticas mágicas. A expressão evita decidir se eram fraude, atividade oculta ou ambas; “suas” explicita naturalmente que eram práticas de Simão.
- source_word: ἐξεστακέναι
  choice: havia deixado maravilhados
  rationale: O infinitivo perfeito de ἐξίστημι apresenta um efeito anterior e persistente de assombro. A escolha preserva esse aspecto sem sugerir, como “enfeitiçado” poderia fazer, que a magia necessariamente exerceu poder sobrenatural real.
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto que retoma as pessoas mencionadas no contexto.
theological_decisions:
- issue: Natureza das práticas de Simão em μαγείαις
  choice: práticas de magia
  alternative: feitiçarias
  rationale: O versículo descreve as práticas e o assombro que causavam, mas não determina se eram truques fraudulentos, atividade oculta real ou ambas. A tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Davam atenção” preserva a duração do imperfeito; “durante muito tempo” é mais corrente que “por um tempo considerável”. O marcador [a] aparece no texto principal.
