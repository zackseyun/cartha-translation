  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: pt
  text: Mas homens piedosos sepultaram Estêvão[a] e fizeram grande lamentação por ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prepararam Estêvão para o sepultamento” ou “levaram Estêvão para sepultá-lo”; o verbo grego pode enfatizar tanto o cuidado dado ao corpo como o sepultamento propriamente dito.
    reason: lexical_alternative
  - marker: b
    text: “Grande lamentação” pode incluir manifestações audíveis e públicas de luto, não apenas tristeza interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: sepultaram
  rationale: No contexto, o verbo descreve o cuidado dado ao corpo de Estêvão após sua morte e pode abranger recolhê-lo, levá-lo e providenciar seu sepultamento. “Sepultaram” expressa naturalmente o resultado da ação, enquanto a nota preserva a extensão semântica do verbo.
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao relato anterior; “Mas” conserva essa mudança narrativa.
- source_word: ἄνδρες εὐλαβεῖς
  choice: homens piedosos
  rationale: “Homens” preserva o masculino plural explícito de ἄνδρες, e “piedosos” comunica reverência e devoção religiosa em português atual.
- source_word: ἐποίησαν
  choice: fizeram
  rationale: O verbo tem sentido leve e forma, com κοπετόν, uma expressão de luto; “fizeram grande lamentação” mantém de perto a construção grega e é compreensível em registro digno.
- source_word: κοπετὸν μέγαν
  choice: grande lamentação
  rationale: A expressão indica luto intenso, possivelmente acompanhado de manifestações audíveis e públicas; “grande lamentação” preserva a solenidade e a intensidade.
- source_word: ἐπ’ αὐτῷ
  choice: por ele
  rationale: Com linguagem de luto, ἐπί com dativo indica a pessoa por quem se lamenta. “Por ele” é natural em português e evita a construção menos idiomática “sobre ele”.
