  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: pt
  text: Mas Filipe foi encontrado em Azoto[a] e, passando, anunciava as boas-novas em todas as cidades, até chegar a Cesareia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apareceu em Azoto”. Mais literalmente, o grego diz “foi encontrado em Azoto”, expressão que, neste contexto, pode sugerir uma transferência divina repentina sem afirmá-la explicitamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve transição ou contraste com o arrebatamento de Filipe pelo Espírito no versículo anterior, sem tornar a oposição excessivamente forte.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Preserva o passivo do texto grego e não explicita além do que está dito o modo extraordinário pelo qual Filipe chegou a Azoto.
- source_word: εἰς Ἄζωτον
  choice: em Azoto
  rationale: Com εὑρέθη, εἰς indica aqui a localização resultante; 'em Azoto' é natural em português.
- source_word: διερχόμενος
  choice: passando por ali
  rationale: Expressa o particípio simultâneo e o deslocamento de Filipe pela região, em português corrente.
- source_word: εὐηγγελίζετο
  choice: anunciava as boas-novas
  rationale: O imperfeito apresenta uma ação contínua ou repetida; a expressão comunica o sentido verbal sem depender de jargão eclesiástico.
- source_word: τὰς πόλεις πάσας
  choice: em todas as cidades
  rationale: Indica coletivamente as cidades ao longo do percurso; a preposição 'em' torna explícito de modo natural o local onde ele anunciava.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: até chegar
  rationale: Reproduz naturalmente o limite final expresso pela construção grega com ἕως e infinitivo articulado; o sujeito continua sendo Filipe.
- source_word: εἰς Καισάρειαν
  choice: a Cesareia
  rationale: Com o verbo de movimento, exprime o destino de Filipe de maneira idiomática.
theological_decisions:
- issue: Se εὑρέθη deve ser traduzido de modo a interpretar explicitamente a transferência de Filipe como uma aparição milagrosa
  choice: Manter no texto principal a forma neutra 'foi encontrado'
  alternative: '''apareceu em Azoto'''
  rationale: O contexto sugere fortemente uma ação divina extraordinária, mas o verbo grego diz literalmente que Filipe 'foi encontrado'. A tradução conserva essa formulação e deixa que o contexto transmita a implicação, sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Boas-novas' conserva a imagem lexical do verbo grego e evita uma formulação excessivamente técnica; os topônimos seguem as formas portuguesas tradicionais.
