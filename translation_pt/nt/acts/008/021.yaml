  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: pt
  text: Você não tem parte nem participação neste assunto, pois o seu coração não é reto diante de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: parte nem direito
  rationale: Preserva a dupla expressão grega sem recorrer ao pouco natural «parte nem sorte». «Direito» comunica aqui a ideia de participação ou quinhão que cabe a alguém.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: neste assunto
  rationale: Neste contexto, λόγος designa a questão ou atividade em pauta, não necessariamente uma palavra ou discurso.
- source_word: εὐθεῖα
  choice: reto
  rationale: Mantém a metáfora moral do original e corresponde a uma formulação bíblica clara e corrente em português.
- source_word: ἔναντι τοῦ θεοῦ
  choice: diante de Deus
  rationale: Tradução natural que preserva a ideia de estar sob o olhar e a avaliação de Deus.
theological_decisions:
- issue: Natureza da exclusão de Simão
  choice: não tem parte nem direito neste assunto
  alternative: não tem parte nem herança nesta palavra
  rationale: A tradução não define além do texto se a exclusão é eclesial, salvífica ou apenas relativa ao dom e ministério em questão; conserva a censura no âmbito do «assunto» mencionado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enfática «parte nem direito» conserva o paralelismo negativo do grego.
