id: ACT.8.27
reference: Acts 8:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: pt
  text: Ele se levantou e foi. E eis que havia um homem etíope, eunuco[a], alto funcionário de Candace[b], rainha dos etíopes. Ele era encarregado de todo o tesouro dela e tinha ido a Jerusalém para adorar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “funcionário da corte”. O termo grego pode, em certos contextos, designar um oficial real, embora aqui provavelmente tenha o sentido literal de “eunuco”.
    reason: lexical_alternative
  - marker: b
    text: “Candace” talvez fosse um título dinástico da rainha, e não um nome pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Expressa de modo natural a ação anterior do particípio aoristo e preserva a sequência narrativa.
- source_word: ἐπορεύθη
  choice: foi
  rationale: Equivalente direto e corrente para o verbo narrativo de movimento.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Mantém explicitamente o marcador de atenção de Lucas e seu tom narrativo vívido, sem recorrer a linguagem obscura.
- source_word: ἀνὴρ Αἰθίοψ
  choice: um homem etíope
  rationale: Preserva tanto o substantivo ἀνήρ, que especifica um homem, quanto a identificação étnico-geográfica.
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: Adota o sentido lexical primário e preserva a condição social e corporal indicada pelo texto; a acepção mais ampla é registrada em nota.
- source_word: δυνάστης
  choice: alto funcionário
  rationale: Comunica claramente que se tratava de uma pessoa investida de grande autoridade, sem sugerir que fosse um soberano.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: de Candace, rainha dos etíopes
  rationale: Translitera Κανδάκη na forma portuguesa tradicional e acompanha o plural étnico Αἰθιόπων.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: encarregado de todo o tesouro dela
  rationale: Torna explícita a responsabilidade administrativa expressa por ἐπί e preserva o sentido institucional de γάζα.
- source_word: ἐληλύθει
  choice: tinha ido
  rationale: O mais-que-perfeito preserva a anterioridade da viagem em relação ao encontro narrado; em português, 'ir a Jerusalém' é mais natural a partir da perspectiva da cena posterior.
- source_word: προσκυνήσων
  choice: para adorar
  rationale: Traduz naturalmente o particípio futuro de finalidade no contexto de peregrinação religiosa.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: Expressa de maneira idiomática o movimento em direção à cidade.
theological_decisions:
- issue: Se εὐνοῦχος deve ser traduzido literalmente ou generalizado como título de corte
  choice: eunuco no texto principal
  alternative: funcionário da corte
  rationale: O sentido literal é o valor lexical primário e provavelmente é relevante para a identidade do personagem. Além disso, δυνάστης já comunica sua posição oficial; traduzir ambos os termos apenas como funções administrativas apagaria uma distinção presente no grego.
- issue: Se Κανδάκη é nome pessoal ou título dinástico
  choice: Candace no texto principal, sem resolver sua função
  alternative: a candace, título da rainha
  rationale: A transliteração preserva a forma textual e evita decidir no corpo do versículo se o termo é nome próprio ou título dinástico; essa possibilidade histórica é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E eis que” conserva o marcador narrativo de atenção. O longo período grego foi dividido para evitar uma cadeia pesada de orações relativas, sem perder nenhuma informação nem a progressão do relato.
