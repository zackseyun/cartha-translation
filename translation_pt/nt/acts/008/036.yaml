  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: pt
  text: 'Enquanto seguiam pela estrada, chegaram a um lugar onde havia água, e o eunuco diz: “Veja, água! O que me impede de ser batizado?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὴν ὁδόν
  choice: pela estrada
  rationale: Expressa naturalmente o deslocamento ao longo do caminho, sem acrescentar informação.
- source_word: ἐπί τι ὕδωρ
  choice: a um lugar onde havia água
  rationale: O grego indica que chegaram a certa água ou a um ponto com água; esta formulação é natural em português e preserva a indefinição de τι.
- source_word: φησιν
  choice: diz
  rationale: Mantém o presente histórico do grego, que dá vivacidade à narrativa.
- source_word: Ἰδού
  choice: Veja
  rationale: Interjeição corrente que chama a atenção para a presença da água.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: O que me impede de ser batizado?
  rationale: Reproduz diretamente a pergunta e mantém a voz passiva do infinitivo grego.
theological_decisions:
- issue: Condições para o batismo
  choice: Traduzir apenas a pergunta presente no texto crítico
  alternative: Acrescentar a profissão de fé encontrada em algumas tradições manuscritas como Atos 8:37
  rationale: O SBLGNT fornecido não inclui o versículo adicional; não se deve inserir no texto desta unidade uma expansão textual posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico “diz” foi preservado deliberadamente; “eunuco” mantém a designação narrativa do personagem.
