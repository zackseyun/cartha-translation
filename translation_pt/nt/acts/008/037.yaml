base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: pt
  text: 'Filipe[a], porém, disse: “Se você crê de todo o coração, pode.” Ele respondeu: “Creio que Jesus, o Messias, é o Filho de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles papiros do século 3 e os códices Sinaítico e Vaticano, do século 4, nem em antigas traduções coptas. Ele aparece na tradição majoritária bizantina e na tradição latina e foi citado por autores cristãos antigos, como Irineu e Cipriano. Muitos estudiosos o consideram uma antiga fórmula litúrgica batismal que mais tarde foi incorporada ao texto narrativo de Atos.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: pode
  rationale: O verbo impessoal indica que algo é permitido ou admissível. No contexto, “pode” comunica naturalmente que o homem pode ser batizado, sem introduzir tom jurídico desnecessário.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de todo o coração
  rationale: Preserva o conhecido idioma bíblico que expressa fé integral e sincera, em linguagem natural no português moderno.
- source_word: Πιστεύω
  choice: Creio
  rationale: No contexto de uma confissão de fé, “creio” expressa de modo conciso a afirmação da identidade de Jesus.
- source_word: Χριστόν
  choice: o Messias
  rationale: 'Χριστός é um título que significa “Ungido” e corresponde a “Messias”. A forma apositiva “Jesus, o Messias” torna esse valor titular explícito e mantém a relação da frase grega: Jesus, o Messias, é o Filho de Deus.'
theological_decisions:
- issue: Relação entre “Jesus, o Messias” e “o Filho de Deus” na confissão
  choice: “Jesus, o Messias, é o Filho de Deus”
  alternative: “Jesus Cristo é o Filho de Deus”
  rationale: A tradução escolhida preserva Χριστός como título messiânico e mantém “o Filho de Deus” como predicado principal, sem fundir ou reorganizar as duas afirmações.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Porém” reproduz a transição de δέ sem tornar a frase pesada; “Se você crê” usa tratamento corrente e respeitoso. A repetição semítica “respondeu e disse” foi naturalizada como “respondeu”, sem perda de conteúdo.
