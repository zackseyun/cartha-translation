source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: pt
  text: 'Um anjo do Senhor falou a Filipe: “Levante-se e vá em direção ao sul[a], até a estrada que desce de Jerusalém para Gaza.” Essa estrada é deserta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao meio-dia”. A expressão grega pode indicar direção (“sul”) ou tempo (“ao meio-dia”).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Isto é deserto”. A frase grega pode indicar que o trajeto atravessa uma região desértica, em vez de destacar que a própria estrada estava deserta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος
  choice: Um anjo
  rationale: O substantivo singular sem artigo é naturalmente indefinido neste contexto; “anjo” comunica a função de mensageiro celestial indicada pela narrativa.
- source_word: κυρίου
  choice: do Senhor
  rationale: Preserva a designação divina tradicional e natural em português, sem especificar além do que o texto afirma.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: 'falou a Filipe:'
  rationale: A construção introduz discurso direto. Os dois verbos gregos são vertidos de modo idiomático por um verbo seguido de dois-pontos, evitando o pouco natural “falou... dizendo”.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Levante-se e vá
  rationale: Imperativos correntes e diretos que preservam a ordem de ação imediata.
- source_word: κατὰ μεσημβρίαν
  choice: em direção ao sul
  rationale: Com um verbo de movimento, o sentido direcional é provável; a possibilidade temporal, “ao meio-dia”, é genuína e fica registrada em nota.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: até a estrada
  rationale: Expressa naturalmente o movimento em direção a uma rota específica.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: que desce de Jerusalém para Gaza
  rationale: Mantém a linguagem geográfica de descida a partir de Jerusalém e soa natural em português.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Essa estrada é deserta
  rationale: O feminino de αὕτη provavelmente retoma ὁδός, “estrada”. Tornar o referente explícito produz clareza, enquanto a nota preserva a possibilidade de referência à região desértica.
theological_decisions:
- issue: Referente de “Senhor” em “anjo do Senhor”
  choice: A expressão é traduzida literalmente como “um anjo do Senhor”, indicando agência divina sem identificação adicional.
  alternative: “Um anjo enviado por Deus” ou a identificação como uma figura reveladora específica.
  rationale: O texto vincula o mensageiro ao Senhor, mas não define mais precisamente sua identidade; a tradução preserva essa contenção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto é introduzido por dois-pontos para evitar uma reprodução rígida do particípio grego. As notas aparecem junto às expressões a que se referem e preservam as ambiguidades lexical e sintática do original.
