id: ACT.8.25
reference: Acts 8:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: pt
  text: Assim, depois de terem dado testemunho solene e falado a palavra do Senhor, eles voltavam para Jerusalém e anunciavam as boas-novas em muitas aldeias dos samaritanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em muitas aldeias samaritanas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: terem dado testemunho solene
  rationale: Expressa o caráter enfático e sério do verbo sem restringi-lo à ideia de advertência.
- source_word: λαλήσαντες
  choice: falado
  rationale: Mantém o sentido direto de λαλέω diante do objeto expresso, “a palavra do Senhor”, sem acrescentar uma nuance não exigida pelo texto.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: Preserva a formulação tradicional e a ressonância teológica de λόγος e κύριος, mantendo indeterminado o referente de “Senhor” como no grego.
- source_word: ὑπέστρεφον
  choice: voltavam
  rationale: O imperfeito apresenta o retorno como ação em andamento; “voltavam” comunica esse aspecto com naturalidade em português.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: em muitas aldeias dos samaritanos
  rationale: A construção portuguesa explicita naturalmente o âmbito da proclamação e preserva a referência étnica expressa por τῶν Σαμαριτῶν.
- source_word: εὐηγγελίζοντο
  choice: anunciavam as boas-novas
  rationale: Reproduz o sentido verbal de comunicar a boa notícia, evita jargão e mantém o aspecto contínuo do imperfeito.
theological_decisions:
- issue: Identidade do sujeito implícito
  choice: Manter o pronome plural “eles”
  alternative: Explicitar “Pedro e João”
  rationale: Embora o contexto identifique Pedro e João, o versículo grego não repete os nomes; a tradução conserva essa forma sem inserir identificação adicional.
- issue: Relação temporal entre o retorno e a evangelização
  choice: Apresentar as duas ações com verbos no imperfeito coordenados
  alternative: Subordinar a proclamação como “enquanto voltavam” ou “pelo caminho”
  rationale: Os dois imperfeitos gregos indicam ações em curso, mas o texto não explicita com precisão se toda a proclamação ocorreu estritamente durante o trajeto; a coordenação preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” conserva a imagem lexical do verbo grego sem recorrer ao termo mais eclesiástico “evangelizavam”. O paralelismo verbal foi mantido de modo natural.
