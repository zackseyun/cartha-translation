source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: pt
  text: Pois os espíritos impuros saíam de muitos dos que os tinham, gritando em voz alta[a]; e muitos paralíticos e mancos foram curados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego liga mais naturalmente «gritando em voz alta» aos espíritos impuros.
    reason: Esclarece o referente do particípio grego, já que também seria possível entender, pelo contexto, que gritavam as pessoas das quais os espíritos saíam.
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Pois ... de muitos dos que os tinham
  rationale: “Pois” preserva a ligação explicativa de γάρ com o versículo anterior. A construção grega é reorganizada para indicar com clareza, em português natural, que os espíritos saíam de muitas pessoas que os tinham.
- source_word: πνεύματα ἀκάθαρτα
  choice: espíritos impuros
  rationale: “Espíritos impuros” comunica em português atual a impureza associada a esses seres espirituais; “espíritos imundos” seria possível, mas hoje pode soar mais depreciativo ou material.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: gritando em alta voz
  rationale: Mantém tanto a ação de clamar ou gritar quanto a intensidade expressa por φωνῇ μεγάλῃ, ligando o particípio aos espíritos.
- source_word: ἐξήρχοντο
  choice: saíam
  rationale: O imperfeito é preservado, apresentando a saída como ocorrência repetida ou em andamento no cenário narrado.
- source_word: παραλελυμένοι
  choice: paralíticos
  rationale: Expressa de forma breve e corrente a condição resultante indicada pelo particípio perfeito passivo.
- source_word: χωλοὶ
  choice: mancos
  rationale: Termo comum e compreensível para pessoas com dificuldade física para andar, sem ampliar a referência para toda deficiência motora.
- source_word: ἐθεραπεύθησαν
  choice: eram curados
  rationale: O passivo mantém o foco nas pessoas que recebiam a cura; o imperfeito em português acompanha naturalmente a série de acontecimentos, embora o grego use aqui o aoristo.
theological_decisions:
- issue: Quem gritava e saía
  choice: Os espíritos impuros gritavam e saíam das pessoas.
  alternative: As pessoas possuídas gritavam enquanto os espíritos saíam delas.
  rationale: O particípio neutro plural βοῶντα concorda diretamente com πνεύματα ἀκάθαρτα, favorecendo os espíritos como agentes do grito. A ordem foi ajustada em português para tornar essa relação explícita sem alterar o acontecimento narrado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A primeira oração foi reordenada para evitar a construção grega abrupta e esclarecer seus referentes; manteve-se “Pois” para conservar a conexão argumentativa com o contexto.
