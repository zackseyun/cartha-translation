  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: pt
  text: 'Então o eunuco perguntou a Filipe: “Por favor, de quem o profeta está dizendo isso? De si mesmo ou de outra pessoa?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Então ... perguntou
  rationale: A combinação idiomática do particípio de ἀποκρίνομαι com εἶπεν introduz uma resposta em forma de pergunta. Em português, “perguntou” evita a construção redundante “respondeu e disse”, enquanto δέ é representado pela progressão narrativa “Então”.
- source_word: ὁ εὐνοῦχος
  choice: o eunuco
  rationale: Mantém o termo específico de Lucas e a identidade da personagem, sem generalizá-lo para “oficial”.
- source_word: τῷ Φιλίππῳ
  choice: a Filipe
  rationale: O dativo indica o destinatário da fala; “perguntou a Filipe” é natural e claro em português amplo.
- source_word: Δέομαί σου
  choice: Por favor
  rationale: Expressa o pedido respeitoso e potencialmente insistente de δέομαι em linguagem portuguesa atual, sem impor uma intensidade emocional excessiva.
- source_word: περὶ τίνος
  choice: de quem
  rationale: Com verbos de dizer, “dizer isso de alguém” é uma formulação natural em português para indicar a pessoa a quem a afirmação se refere.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: o profeta está dizendo isso
  rationale: O presente progressivo se ajusta naturalmente à referência ao texto que acaba de ser lido e preserva o demonstrativo singular τοῦτο.
- source_word: περὶ ἑαυτοῦ
  choice: De si mesmo
  rationale: Preserva claramente a referência reflexiva ao próprio profeta.
- source_word: περὶ ἑτέρου τινός
  choice: de outra pessoa
  rationale: Traduz naturalmente ἑτέρου τινός e mantém o contraste com “si mesmo”.
theological_decisions:
- issue: Identidade do referente da profecia
  choice: 'Manter a pergunta aberta: “De si mesmo ou de outra pessoa?”'
  alternative: Explicitar já neste versículo uma referência messiânica ou a Jesus
  rationale: O versículo registra a dúvida do eunuco; antecipar a resposta narrativa eliminaria a ambiguidade deliberada e a progressão do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A fala foi formulada como pergunta direta e respeitosa; evitou-se tanto a rigidez de “rogo-te” quanto a possível intensidade excessiva de “imploro-lhe”.
