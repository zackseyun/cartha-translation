  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: pt
  text: 'dizendo: “Deem também a mim esta autoridade[a], para que todo aquele sobre quem eu impuser as mãos receba o Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poder”, em vez de “autoridade”. O termo grego exousía pode indicar autoridade conferida, direito ou poder para agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial com o versículo anterior e introduz naturalmente a fala de Simão.
- source_word: Δότε
  choice: Deem
  rationale: O imperativo aoristo plural de δίδωμι dirige o pedido a mais de uma pessoa; “deem” é direto e natural.
- source_word: κἀμοί
  choice: também a mim
  rationale: 'A crase de καί + ἐμοί expressa inclusão enfática: Simão pede para si aquilo que observou nos apóstolos.'
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Preserva o sentido de autoridade, direito ou capacidade conferida e evita confundi-lo sem necessidade com termos gregos que significam mais diretamente “poder”.
- source_word: ταύτην
  choice: esta
  rationale: Aponta para a autoridade específica que Simão acabara de observar.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo natural a finalidade ou o resultado pretendido.
- source_word: ᾧ ἐὰν
  choice: todo aquele sobre quem
  rationale: Comunica a referência indefinida e geral da construção relativa com ἐάν.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: eu impuser as mãos
  rationale: “Impor as mãos” é a expressão portuguesa corrente e preserva a imagem concreta do grego.
- source_word: λαμβάνῃ
  choice: receba
  rationale: O presente do subjuntivo regido por ἵνα é adequadamente representado pelo subjuntivo português após “para que”.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto de Atos, a expressão designa o Espírito divino; o artigo é natural e necessário em português para essa referência pessoal definida.
theological_decisions:
- issue: Se πνεῦμα ἅγιον, sem artigo no grego, deve ser traduzido indefinidamente
  choice: o Espírito Santo
  alternative: um espírito santo; Espírito Santo
  rationale: O contexto narrativo identifica o referente como o Espírito de Deus. “Um espírito santo” introduziria um sentido alheio ao contexto, enquanto a forma com artigo é a expressão portuguesa mais natural.
- issue: Se ἐξουσία deve ser entendida estritamente como autoridade ou como poder eficaz
  choice: autoridade
  alternative: poder
  rationale: “Autoridade” preserva a amplitude lexical e a distinção em relação a vocábulos gregos que denotam mais diretamente poder. A nota registra a alternativa legítima sem resolver além do texto a relação entre autorização e capacidade eficaz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Deem” explicita corretamente o destinatário plural; “impor as mãos” conserva a expressão bíblica corrente sem soar arcaica.
