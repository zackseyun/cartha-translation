lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: Na construção com o nominativo πολλὴ χαρά, o verbo tem sentido existencial. “Houve” é natural em português e expressa que essa alegria passou a existir ou se manifestou na cidade.
- source_word: δὲ
  choice: E
  rationale: A partícula dá continuidade à narrativa sem exigir contraste forte. “E” preserva com simplicidade a ligação com o versículo anterior.
- source_word: πολλὴ χαρά
  choice: grande alegria
  rationale: Com o substantivo abstrato χαρά, πολλή indica intensidade. “Grande alegria” é uma formulação corrente e mantém a força da expressão grega.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: naquela cidade
  rationale: A expressão localiza a alegria na cidade mencionada no contexto; “naquela” traduz naturalmente o demonstrativo ἐκείνῃ.
