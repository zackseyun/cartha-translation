  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: pt
  text: Mas, quando Simão viu que o Espírito era dado mediante a imposição das mãos dos apóstolos[a], ofereceu-lhes dinheiro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito Santo”. O texto grego diz simplesmente “o Espírito”, mas, pelo contexto, trata-se do Espírito Santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: quando ... viu
  rationale: O particípio aoristo de ὁράω tem valor temporal no contexto; a oração com “quando” é natural em português e preserva a sequência narrativa.
- source_word: δὲ
  choice: Mas
  rationale: δέ assinala um desenvolvimento com leve contraste, introduzindo a reação de Simão ao que acabara de ocorrer.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: mediante a imposição das mãos
  rationale: διά com genitivo expressa meio ou instrumentalidade. “Imposição das mãos” é uma expressão corrente, clara e fiel à construção grega.
- source_word: τῶν ἀποστόλων
  choice: dos apóstolos
  rationale: 'Preserva naturalmente em português a relação genitiva: eram as mãos dos apóstolos.'
- source_word: δίδοται
  choice: era dado
  rationale: O presente passivo grego descreve o que Simão percebeu acontecer; o imperfeito português harmoniza-se com a perspectiva passada de “viu” e apresenta o ato observado sem identificar os apóstolos como fonte última.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Mantém a forma lexical do grego, que diz “o Espírito”, enquanto o contexto identifica o referente como o Espírito Santo.
- source_word: προσήνεγκεν
  choice: ofereceu
  rationale: Neste contexto, προσφέρω indica apresentar ou oferecer algo como pagamento.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo é expresso de modo idiomático como objeto indireto de “ofereceu”.
- source_word: χρήματα
  choice: dinheiro
  rationale: χρήματα designa dinheiro ou recursos monetários; “dinheiro” é a equivalência mais direta e natural.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: o Espírito, referindo-se ao Espírito Santo
  alternative: o Espírito Santo
  rationale: O contexto imediato identifica claramente o referente, mas o texto grego deste versículo traz apenas “o Espírito”. A tradução principal preserva essa forma sem obscurecer a referência teológica.
- issue: Agência na concessão do Espírito
  choice: o Espírito era dado mediante a imposição das mãos dos apóstolos
  alternative: o Espírito Santo era concedido pela imposição das mãos dos apóstolos
  rationale: “Mediante” preserva a noção de meio expressa por διά sem afirmar que os apóstolos eram a fonte última do Espírito nem extrair uma conclusão sacramental ou antissacramental não explicitada no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Imposição das mãos” mantém a expressão bíblica corrente; “mediante” comunica instrumentalidade sem soar excessivamente técnico.
