base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: pt
  text: E as multidões, de comum acordo[b], prestavam muita atenção[a] ao que Filipe dizia, enquanto ouviam Filipe e viam os sinais que ele realizava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficavam atentos” ou “davam atenção”.
    reason: lexical_alternative
  - marker: b
    text: Ou “unanimemente” ou “juntas”; o grego enfatiza uma reação unida e compartilhada.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: prestavam muita atenção
  rationale: Expressa a ideia de dirigir e manter a atenção, e o imperfeito grego sugere uma atitude contínua no cenário narrado.
- source_word: δὲ
  choice: E
  rationale: Funciona aqui como conectivo narrativo leve, sem exigir contraste forte.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Preserva o plural e designa naturalmente os grupos de pessoas reunidos.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: ao que Filipe dizia
  rationale: Transmite de modo natural o conteúdo das coisas ditas e conserva Filipe como agente, sem transformar a expressão em uma paráfrase como “mensagem”.
- source_word: ὁμοθυμαδὸν
  choice: unânimes
  rationale: Comunica a resposta conjunta e concorde das multidões, preservando a ênfase corporativa do advérbio.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: enquanto ouviam e viam
  rationale: A construção é temporal ou circunstancial. O acusativo plural αὐτούς é entendido como sujeito dos infinitivos, isto é, as próprias multidões, evitando introduzir um objeto singular não expresso pela forma grega.
- source_word: τὰ σημεῖα
  choice: os sinais
  rationale: Traduz diretamente σημεῖα sem acrescentar “milagrosos”, embora o contexto mostre que se trata de obras extraordinárias.
- source_word: ἃ ἐποίει
  choice: que ele realizava
  rationale: “Realizava” é natural para sinais, e o imperfeito preserva o caráter continuado das ações de Filipe.
