id: ACT.8.12
reference: Acts 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: pt
  text: Mas, quando deram crédito a Filipe, que anunciava as boas-novas a respeito do reino de Deus e do nome de Jesus, o Messias[a], eram batizados, tanto homens como mulheres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Jesus Cristo». O termo grego Χριστός significa «Messias» e é usado aqui como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: ὅτε introduz a oração temporal, e δέ assinala uma transição com leve contraste em relação ao contexto anterior.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: creram em Filipe
  rationale: O dativo indica que aceitaram Filipe como mensageiro digno de crédito; o contexto deixa claro que não se trata de fé salvífica depositada nele.
- source_word: εὐαγγελιζομένῳ
  choice: que anunciava as boas-novas
  rationale: A oração relativa preserva o valor circunstancial do particípio presente e expressa de modo natural a atividade contínua de Filipe.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: a respeito do reino de Deus
  rationale: περί com genitivo apresenta o assunto da proclamação; a formulação mantém a expressão bíblica reconhecível.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: do nome de Jesus, o Messias
  rationale: Mantém 'nome', que pode abranger identidade, pessoa e autoridade, e traduz Χριστός como o título messiânico, não como sobrenome.
- source_word: ἐβαπτίζοντο
  choice: foram sendo batizados
  rationale: 'A construção portuguesa procura conservar o aspecto imperfeito passivo: pessoas eram batizadas sucessivamente à medida que criam.'
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: tanto homens como mulheres
  rationale: Reproduz naturalmente a coordenação inclusiva τε ... καί e a menção explícita dos dois grupos.
theological_decisions:
- issue: Sentido de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός conserva aqui seu valor de título. 'O Messias' torna esse valor transparente em português sem acrescentar uma interpretação denominacional.
- issue: Sentido de crer com Filipe no dativo
  choice: creram em Filipe
  alternative: creram no que Filipe dizia
  rationale: A tradução mantém a construção centrada na pessoa do mensageiro, enquanto o contexto especifica a mensagem aceita; não sugere que Filipe seja o objeto último da fé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar o contraste narrativo, o valor titular de Χριστός nem o aspecto progressivo do imperfeito.
