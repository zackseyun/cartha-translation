review_pass:
  verdict: revise
  source_fidelity: A construção πιστεύω com dativo (τῷ Φιλίππῳ) indica que os samaritanos creram em Filipe como mensageiro, isto é, deram crédito ao que ele dizia; «creram em Filipe» em português sugere mais naturalmente fé depositada nele. O imperfeito passivo ἐβαπτίζοντο é bem representado por «eram batizados», que conserva o caráter progressivo/reiterado sem a construção pesada «foram sendo batizados».
  naturalness: «Dar crédito a Filipe» é claro, idiomático e evita a ambiguidade teológica de «crer em Filipe». «Eram batizados» é mais natural em português moderno e transmite adequadamente o aspecto imperfeito no contexto de respostas sucessivas à proclamação.
  terminology: «Reino de Deus», «boas-novas», «nome» e «Jesus, o Messias» preservam os termos e a função titular de Χριστός. A nota oferece legitimamente «Jesus Cristo» como tradução alternativa convencional, sem alegar variante textual.
  issues:
  - severity: medium
    issue: «creram em Filipe» para ἐπίστευσαν τῷ Φιλίππῳ
    rationale: Em português, «crer em alguém» tende a comunicar confiança/fé nessa pessoa como objeto. Aqui o dativo de πιστεύω exprime aceitar Filipe como fonte ou mensageiro digno de crédito; o conteúdo aceito é explicitado em seguida.
  - severity: low
    issue: «foram sendo batizados»
    rationale: Embora tente refletir o imperfeito, a perífrase é pouco idiomática e pode soar excessivamente mecânica. «Eram batizados» mantém o imperfeito passivo e a progressão narrativa.
  revised_text: Mas, quando deram crédito a Filipe, que anunciava as boas-novas a respeito do reino de Deus e do nome de Jesus, o Messias[a], eram batizados, tanto homens como mulheres.
