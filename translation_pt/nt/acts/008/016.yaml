  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: pt
  text: Pois o Espírito Santo ainda não havia descido sobre nenhum deles[a]; eles apenas tinham sido batizados em nome do Senhor Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “ainda não havia caído sobre nenhum deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “para o nome do Senhor Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: ainda não
  rationale: Expressa de modo natural em português que a ação não havia ocorrido até aquele momento.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: sobre nenhum deles
  rationale: Preserva a imagem espacial de ἐπί com dativo e a formulação característica de Atos para a vinda do Espírito.
- source_word: ἐπιπεπτωκός
  choice: havia descido
  rationale: No contexto da vinda do Espírito Santo sobre pessoas, “descido” comunica naturalmente a imagem em português; a forma mais literal “caído” é preservada em nota.
- source_word: μόνον
  choice: apenas
  rationale: Marca com clareza a limitação e o contraste entre o batismo já recebido e a vinda do Espírito ainda não ocorrida.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: tinham sido batizados
  rationale: A construção perifrástica descreve um ato anterior com estado resultante; o mais-que-perfeito composto é natural e preciso em português.
- source_word: εἰς τὸ ὄνομα
  choice: em nome
  rationale: É a expressão idiomática corrente em português para o vínculo do batismo com o nome invocado; o valor mais formal de εἰς, “para dentro de”, é registrado em nota.
- source_word: κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Traduz κύριος pelo título cristológico corrente “Senhor” e mantém a expressão nominal de modo natural.
theological_decisions:
- issue: Sujeito implícito de ἐπιπεπτωκός
  choice: Explicitar “o Espírito Santo” com base no antecedente imediato do versículo anterior.
  alternative: Empregar apenas o pronome “ele”.
  rationale: O grego omite o sujeito porque o antecedente está claro no contexto. A explicitação evita ambiguidade em português sem acrescentar uma identificação alheia ao texto.
- issue: Formulação do batismo
  choice: “em nome do Senhor Jesus”
  alternative: “para dentro do nome do Senhor Jesus”
  rationale: A redação principal usa o idioma natural do português, sem decidir debates posteriores sobre fórmula batismal ou teologia sacramental; a força direcional mais literal de εἰς permanece disponível em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. Mantém o contraste entre a ausência da vinda do Espírito e o batismo já realizado, sem harmonização doutrinária.
