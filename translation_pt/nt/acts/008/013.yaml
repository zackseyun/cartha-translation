id: ACT.8.13
reference: Acts 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: pt
  text: O próprio Simão também creu e, depois de ser batizado, continuou junto de Filipe. Ao ver os sinais e as grandes obras de poder[a] que se realizavam, ficava maravilhado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “grandes milagres”. O termo grego pode designar manifestações de poder, inclusive milagres.'
    reason: Alternativa lexical para δυνάμεις, cujo campo semântico inclui feitos ou manifestações de poder e, no contexto, milagres.
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: o próprio Simão também
  rationale: Preserva tanto a ênfase de αὐτός como o sentido aditivo de καί, destacando que até Simão respondeu.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: Verte diretamente o aoristo de πιστεύω sem decidir se a fé de Simão era genuína, superficial ou meramente professada.
- source_word: βαπτισθεὶς
  choice: depois de ser batizado
  rationale: Expressa com naturalidade a anterioridade do particípio aoristo passivo em relação à ação contínua seguinte.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: continuou junto de Filipe
  rationale: Comunica a ação contínua da construção perifrástica no imperfeito e a ligação persistente de Simão a Filipe, sem acrescentar uma ideia devocional não exigida pelo contexto.
- source_word: θεωρῶν
  choice: ao ver
  rationale: Representa a percepção contínua que acompanha e explica o assombro de Simão.
- source_word: σημεῖα
  choice: sinais
  rationale: Mantém a designação habitual e sua possível função reveladora ou comprobatória.
- source_word: δυνάμεις μεγάλας
  choice: grandes obras de poder
  rationale: Conserva a referência explícita a manifestações de poder e evita reduzir necessariamente o termo à categoria interpretativa de milagres.
- source_word: γινομένας
  choice: que se realizavam
  rationale: Exprime os acontecimentos em curso diante de Simão em português natural.
- source_word: ἐξίστατο
  choice: ficava maravilhado
  rationale: O imperfeito indica assombro contínuo; a expressão é clara, natural e suficientemente forte no contexto.
theological_decisions:
- issue: Se a fé de Simão deve ser caracterizada como conversão genuína ou como crença falsa ou superficial
  choice: creu
  alternative: creu de verdade; apenas professou crer; creu superficialmente
  rationale: O texto afirma que Simão creu e foi batizado, enquanto o desenvolvimento narrativo posterior suscita questões interpretativas. A tradução preserva essa tensão sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O próprio Simão também” preserva a ênfase do grego; “continuou junto de Filipe” evita linguagem excessivamente técnica; e a divisão em duas frases melhora a fluidez sem alterar as relações do texto.
