  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: pt
  text: Quando os apóstolos em Jerusalém ouviram que Samaria havia recebido a palavra de Deus, enviaram Pedro e João a eles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quando ... ouviram
  rationale: O particípio aoristo estabelece a circunstância anterior à ação principal. «Quando ... ouviram» é natural em português; δέ funciona aqui como conexão narrativa leve e não exige uma palavra separada.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: os apóstolos que estavam em Jerusalém
  rationale: Identifica os apóstolos por sua localização e evita a possível leitura de que «apóstolos em Jerusalém» designe uma categoria própria.
- source_word: δέδεκται
  choice: havia recebido
  rationale: O perfeito de δέχομαι indica recepção já realizada e com resultado vigente; o mais-que-perfeito harmoniza naturalmente com a sequência narrativa em português.
- source_word: ἡ Σαμάρεια
  choice: Samaria
  rationale: Mantém o topônimo usado metonimicamente no grego para seus habitantes, sem estreitar a referência na tradução.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva a forma lexical e a expressão bíblica corrente, que no contexto designa a mensagem proclamada procedente de Deus.
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: Tradução direta e natural do aoristo simples; o sujeito continua sendo os apóstolos.
- source_word: πρὸς αὐτούς
  choice: até eles
  rationale: Expressa de modo idiomático o movimento em direção às pessoas de Samaria; o pronome masculino plural deixa evidente a referência aos habitantes, e não ao território.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pedro e João
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
theological_decisions:
- issue: Uso metonímico de «Samaria»
  choice: Samaria havia recebido a palavra de Deus
  alternative: os samaritanos haviam recebido a palavra de Deus
  rationale: O texto grego nomeia Samaria coletivamente. A tradução conserva essa formulação e sua amplitude, enquanto o pronome subsequente esclarece que pessoas estão em vista.
- issue: Sentido de λόγος
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: «Palavra» mantém o conhecido idioma bíblico e a ressonância teológica do original sem negar que, neste contexto, se trata da mensagem proclamada.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A oração relativa «que estavam em Jerusalém» favorece clareza. Não se acrescenta marcador como «Ora» ou «Então», pois δέ é apenas uma conexão narrativa leve. A vírgula final é mantida porque o versículo prossegue sintaticamente no versículo 15.
