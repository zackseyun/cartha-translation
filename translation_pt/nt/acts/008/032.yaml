source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: pt
  text: 'A passagem da Escritura que ele estava lendo era esta: “Como ovelha, foi levado para o abate[a]; e, como um cordeiro está calado diante de quem o tosquia[b], assim ele não abre a boca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao abate”.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante do tosquiador”; literalmente, “diante daquele que o tosquia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: a passagem da Escritura
  rationale: No contexto, περιοχή designa uma porção específica do texto sagrado. “Passagem da Escritura” é clara, corrente e preserva o referente reconhecido de γραφή.
- source_word: ἀνεγίνωσκεν
  choice: estava lendo
  rationale: O imperfeito indica uma ação em andamento no passado, expressa naturalmente em português pela locução “estava lendo”.
- source_word: Ὡς πρόβατον
  choice: Como ovelha
  rationale: ὡς introduz uma comparação. A ausência de artigo foi preservada de modo idiomático, sem exigir “uma”.
- source_word: ἐπὶ σφαγὴν ἤχθη
  choice: foi levado para o abate
  rationale: A expressão comunica movimento rumo ao abate, e o passivo de ἄγω é adequadamente representado por “foi levado”.
- source_word: ἀμνὸς
  choice: cordeiro
  rationale: Mantém a distinção lexical entre ἀμνός, “cordeiro”, e πρόβατον, “ovelha”.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: diante de quem o tosquia
  rationale: A formulação preserva o valor verbal do particípio κείραντος e seu objeto, ao mesmo tempo que soa natural em português.
- source_word: ἄφωνος
  choice: fica calado
  rationale: No símile, o sentido é permanecer sem emitir voz. “Fica calado” comunica isso de maneira corrente e digna.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: assim ele não abre a boca
  rationale: Preserva a conclusão comparativa introduzida por οὕτως e mantém o presente vívido de ἀνοίγει.
theological_decisions:
- issue: Citação messiânica de Isaías 53 aplicada a Jesus no contexto
  choice: Manter o símile da citação sem identificar explicitamente o personagem como Jesus neste versículo
  alternative: Inserir uma identificação cristológica explícita do servo sofredor com Jesus
  rationale: O contexto narrativo fornece a aplicação cristológica, mas este versículo apresenta a citação bíblica. A tradução não deve antecipar nem acrescentar a explicação dada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência poética da citação foi preservada sem recorrer a vocabulário arcaico; não se acrescentou um marcador discursivo inicial ausente do grego.
