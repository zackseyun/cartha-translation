  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: pt
  text: os quais desceram e oraram por eles, para que recebessem o Espírito Santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os quais, depois de descerem, oraram»; também se pode traduzir: «quando desceram, oraram».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: os quais
  rationale: Retoma Pedro e João, mencionados no versículo anterior, e introduz naturalmente a oração relativa no contexto fragmentário deste versículo.
- source_word: καταβάντες
  choice: desceram
  rationale: O particípio aoristo indica ação anterior ou estreitamente ligada ao verbo principal; a coordenação «desceram e oraram» é natural em português e mantém a sequência dos acontecimentos.
- source_word: προσηύξαντο
  choice: oraram
  rationale: Tradução direta e idiomática do aoristo de προσεύχομαι, sem acrescentar uma nuance aspectual não exigida pelo grego.
- source_word: περὶ αὐτῶν
  choice: por eles
  rationale: Com o verbo «orar», περί com genitivo expressa aqui intercessão em favor das pessoas.
- source_word: ὅπως
  choice: para que
  rationale: Preserva a força de propósito da oração.
- source_word: λάβωσιν
  choice: recebessem
  rationale: O imperfeito do subjuntivo em português ajusta-se à sequência verbal depois de «oraram» e expressa o propósito sem sugerir incerteza adicional.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto narrativo de Atos, a expressão designa o Espírito divino; o artigo definido é idiomático em português, embora não esteja expresso no grego.
theological_decisions:
- issue: Se πνεῦμα ἅγιον designa genericamente um espírito santo ou o Espírito Santo divino
  choice: o Espírito Santo
  alternative: um espírito santo / espírito santo
  rationale: O contexto imediato de Atos identifica o referente como o Espírito prometido e concedido aos crentes, sem necessidade de ampliação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação verbal evita uma construção participial pesada, enquanto a nota preserva explicitamente a relação temporal possível no grego.
