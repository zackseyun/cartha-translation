  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: pt
  text: Então impunham as mãos sobre eles, e eles recebiam o Espírito Santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os dois verbos gregos estão no imperfeito e apresentam as ações como em curso ou repetidas. Também se pode traduzir de modo mais explícito: «Então iam impondo as mãos sobre eles, e eles iam recebendo o Espírito Santo».'
    reason: alternativa aspectual
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal dos acontecimentos e preserva o avanço da narrativa.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: impunham as mãos sobre eles
  rationale: A expressão portuguesa «impor as mãos sobre» corresponde ao gesto indicado pelo idioma grego. O pretérito imperfeito preserva o aspecto verbal sem tornar a frase artificial.
- source_word: ἐλάμβανον
  choice: recebiam
  rationale: O pretérito imperfeito reproduz de modo natural a apresentação grega da ação em curso ou repetida, sem acrescentar a ideia específica de que «começavam» a receber.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto de Atos, a expressão designa o Espírito divino prometido. O artigo é natural e necessário em português para essa referência definida.
theological_decisions:
- issue: Referência de πνεῦμα ἅγιον
  choice: o Espírito Santo
  alternative: um espírito santo
  rationale: O contexto imediato e o uso em Lucas–Atos identificam o referente como o Espírito divino, não como um espírito indefinido; a tradução não acrescenta afirmações doutrinárias além dessa identificação contextual.
- issue: Valor dos dois verbos no imperfeito
  choice: impunham ... recebiam
  alternative: impuseram ... receberam
  rationale: A tradução mantém o aspecto imperfeito dos dois verbos e deixa aberta a possibilidade de ações em curso ou repetidas, em vez de reduzi-las silenciosamente a eventos pontuais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Impunham as mãos» conserva a expressão bíblica corrente sem arcaísmo excessivo; os dois pretéritos imperfeitos refletem diretamente a forma do grego.
