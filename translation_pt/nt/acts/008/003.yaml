review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a ação contínua e violenta de ἐλυμαίνετο («devastava»), o alcance da ação contra «a igreja», a entrada repetida em casas, o arrastamento de homens e mulheres e o caráter reiterado do encarceramento. «De casa em casa» expressa bem o sentido distributivo de κατὰ τοὺς οἴκους.
  naturalness: O texto é claro e de registro apropriado. Contudo, «entregava-os à prisão» soa pouco idiomático em português, pois uma prisão não é normalmente apresentada como destinatária pessoal de uma entrega. «Os lançava na prisão» é natural, preserva a força do ato e comunica o resultado expresso por εἰς φυλακήν.
  terminology: «Igreja» é a designação contextual e corrente para ἐκκλησία em Atos. «Devastava» preserva legitimamente a força de λυμαίνομαι, sem suavizá-la para «perseguia».
