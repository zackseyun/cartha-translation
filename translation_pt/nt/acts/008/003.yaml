  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: pt
  text: 'Saulo, porém, devastava a igreja: entrava de casa em casa e, arrastando homens e mulheres, os lançava na prisão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: devastava
  rationale: O imperfeito expressa ação contínua ou repetida, e o verbo é mais forte que um simples “perseguia”, comunicando dano violento e sistemático.
- source_word: τὴν ἐκκλησίαν
  choice: a igreja
  rationale: Em Atos, refere-se à comunidade dos que creem; “igreja” é a forma corrente e contextualmente adequada em português.
- source_word: κατὰ τοὺς οἴκους
  choice: de casa em casa
  rationale: Reproduz naturalmente o valor distributivo de κατά com o plural, indicando a entrada repetida em diversas casas.
- source_word: εἰσπορευόμενος
  choice: entrava
  rationale: A forma finita coordenada torna natural em português a ação concomitante descrita pelo particípio grego, preservando também seu caráter reiterado.
- source_word: σύρων
  choice: arrastando
  rationale: Mantém a ideia de remoção à força expressa por σύρω, sem suavizar a violência da cena.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: homens e mulheres
  rationale: Preserva o alcance indiscriminado da ação de Saulo. O português não precisa acrescentar “tanto... como” para comunicar essa abrangência.
- source_word: παρεδίδου
  choice: entregava-os
  rationale: O imperfeito preserva a ação repetida de pôr essas pessoas sob custódia oficial; o pronome retoma homens e mulheres.
- source_word: εἰς φυλακήν
  choice: à prisão
  rationale: Expressa de modo idiomático o destino ou a custódia a que eram entregues.
theological_decisions:
- issue: A severidade das ações de Saulo antes de sua conversão
  choice: devastava a igreja
  alternative: perseguia a igreja
  rationale: “Devastava” reflete melhor a força de λυμαίνομαι e apresenta o dano violento e sistemático descrito no texto, sem acrescentar uma interpretação teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação explicita que as ações seguintes descrevem como Saulo devastava a igreja. Não foram acrescentadas notas, pois “de casa em casa” comunica adequadamente o valor distributivo e não há ambiguidade essencial que exija registro.
