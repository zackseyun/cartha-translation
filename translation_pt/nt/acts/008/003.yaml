  rationale: A única alteração substitui uma construção pouco natural por uma expressão portuguesa idiomática para o encarceramento. Mantêm-se o aspecto imperfeito («devastava», «entrava», «lançava»), a distribuição pelas casas, a violência de σύρων e a inclusão de homens e mulheres. Não é necessária nota, pois não há no texto português uma ambiguidade relevante que exija documentação.
