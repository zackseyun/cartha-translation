  - severity: medium
    issue: “Carro” para ἅρμα
    rationale: Embora possa ter uso histórico, em português moderno “carro” normalmente significa automóvel. “Carruagem” oferece a referência histórica necessária e evita anacronismo percebido, sem especificar indevidamente um carro de guerra.
