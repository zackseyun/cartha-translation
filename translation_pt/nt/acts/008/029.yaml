  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: pt
  text: 'Então o Espírito disse a Filipe: “Aproxime-se e mantenha-se junto desta carruagem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aproxime-se e acompanhe de perto esta carruagem.”'
    reason: Alternativa lexical para κολλήθητι, que pode indicar juntar-se a algo ou manter-se bem perto.
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: O aoristo de λέγω introduz discurso direto e é expresso de modo natural por “disse”.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ faz a narrativa avançar, sem indicar contraste forte; “Então” comunica bem a sequência dos acontecimentos.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: A expressão, sem ἅγιον no texto grego, é mantida literalmente; no contexto de Atos, refere-se naturalmente ao Espírito Santo.
- source_word: τῷ Φιλίππῳ
  choice: a Filipe
  rationale: O dativo marca o destinatário da fala; “Filipe” é a forma portuguesa corrente do nome.
- source_word: Πρόσελθε
  choice: Aproxime-se
  rationale: O imperativo ordena que Filipe se mova em direção ao carro. “Aproxime-se” é claro, natural e não acrescenta uma perspectiva espacial ausente do verbo grego.
- source_word: κολλήθητι
  choice: acompanhe de perto
  rationale: Neste contexto, o imperativo de κολλάομαι indica juntar-se estreitamente ao carro e seguir junto dele. “Acompanhe de perto” preserva tanto a proximidade quanto a ação exigida pela cena.
- source_word: τῷ ἅρματι τούτῳ
  choice: este carro
  rationale: ἅρμα designa aqui o veículo no qual viajava o eunuco; “carro” é uma forma portuguesa natural e historicamente adequada, enquanto τούτῳ é preservado como “este”.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: “o Espírito”, entendido no contexto como o Espírito Santo
  alternative: “o espírito”, como impulso espiritual menos explicitamente pessoal
  rationale: Em Atos, o Espírito dirige pessoalmente os discípulos em diversas ocasiões. A tradução conserva a formulação exata do grego, sem acrescentar “Santo”, mas mantém a inicial maiúscula para comunicar o referente mais provável.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural tanto no Brasil quanto em outros contextos lusófonos. “Carro” foi preferido a “carruagem” ou “carro de guerra” porque o contexto descreve um veículo de viagem, sem indicar necessariamente um veículo militar.
