  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: pt
  text: Assim, os que haviam sido dispersos foram de lugar em lugar anunciando a palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego significa «anunciar boas-novas»; no contexto, «a palavra» refere-se à mensagem sobre Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Portanto, os que
  rationale: “Portanto” preserva a força inferencial de οὖν, ligando a atividade dos dispersos à perseguição narrada anteriormente; μέν funciona aqui sobretudo na organização do discurso e não exige tradução separada.
- source_word: διασπαρέντες
  choice: haviam sido dispersos
  rationale: O particípio aoristo passivo indica uma ação anterior ao verbo principal e retoma os discípulos espalhados pela perseguição. “Dispersos” é natural e mantém a voz passiva.
- source_word: διῆλθον
  choice: iam de um lugar a outro
  rationale: Neste contexto, o verbo descreve deslocamento itinerante, e não apenas uma passagem pontual. A formulação comunica isso naturalmente sem acrescentar uma região não mencionada no grego.
- source_word: εὐαγγελιζόμενοι
  choice: anunciando
  rationale: O particípio descreve a atividade que acompanhava o deslocamento. “Anunciando” é corrente e digno; a conotação específica de comunicar boas-novas é esclarecida na nota.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém a expressão concisa do grego e o vocabulário recorrente de Lucas. No contexto, refere-se à mensagem a respeito de Jesus, sem acrescentar “de Deus”, ausente neste versículo.
theological_decisions:
- issue: Relação entre εὐαγγελιζόμενοι e τὸν λόγον
  choice: anunciando a palavra
  alternative: anunciando a mensagem das boas-novas
  rationale: No grego, “a palavra” é objeto direto do verbo que significa anunciar boas-novas. A tradução principal preserva essa relação sintática e a terminologia lucana, enquanto a nota registra a conotação positiva do verbo sem criar uma construção genitiva artificial.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A construção “iam de um lugar a outro” expressa naturalmente a ação itinerante, e “a palavra” conserva a formulação característica de Atos.
