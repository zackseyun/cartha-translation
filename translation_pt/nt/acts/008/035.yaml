id: ACT.8.35
reference: Acts 8:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: pt
  text: Então Filipe tomou a palavra e, começando por esta passagem das Escrituras, anunciou-lhe as boas-novas a respeito de Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: tomou a palavra
  rationale: A expressão grega é um idiomatismo para começar a falar. “Tomou a palavra” transmite esse sentido em português atual e mantém um tom narrativo digno, sem o caráter pouco natural de uma tradução estritamente literal.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ assinala a progressão da narrativa; “Então” comunica naturalmente a sequência dos acontecimentos.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: começando por esta passagem das Escrituras
  rationale: ἀπό indica o ponto de partida da explicação de Filipe. No contexto, γραφή se refere ao texto bíblico que acabara de ser citado; “passagem das Escrituras” torna o referente claro em português sem perder seu caráter sagrado.
- source_word: εὐηγγελίσατο
  choice: anunciou-lhe as boas-novas
  rationale: O verbo significa anunciar ou proclamar boas notícias. A formulação preserva sua força evangelística e é compreensível para leitores modernos, sem sugerir necessariamente um sermão formal.
- source_word: αὐτῷ
  choice: -lhe
  rationale: O pronome retoma o oficial etíope mencionado no contexto e reproduz de modo conciso o objeto indireto grego.
- source_word: τὸν Ἰησοῦν
  choice: a respeito de Jesus
  rationale: Com εὐαγγελίζομαι, o acusativo expressa o conteúdo ou foco da proclamação. “A respeito de Jesus” explicita essa relação de maneira natural.
theological_decisions:
- issue: Sentido de εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Filipe anunciou ao homem as boas-novas a respeito de Jesus, apresentando Jesus como conteúdo e centro da proclamação.
  alternative: Filipe lhe anunciou Jesus.
  rationale: A construção grega é compacta e admite a tradução mais literal “anunciou-lhe Jesus”. A forma escolhida comunica em português natural que Jesus é o conteúdo das boas-novas, sem acrescentar uma definição doutrinária além da sintaxe contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tomou a palavra” traduz o idiomatismo grego com naturalidade; “boas-novas” preserva a conexão lexical com o anúncio do evangelho. Não foram necessárias notas de rodapé.
