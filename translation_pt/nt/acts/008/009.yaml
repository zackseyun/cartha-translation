  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: pt
  text: Um homem chamado Simão estava havia algum tempo na cidade, praticando magia e causando espanto entre o povo de Samaria[a], dizendo ser ele mesmo alguém grande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “praticando feitiçaria”. O verbo grego se refere ao exercício de artes mágicas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que ele era alguém importante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Um homem
  rationale: Ἀνήρ especifica um homem, e τις lhe dá caráter indefinido. O δέ funciona como transição leve e não exige uma conjunção expressa em português.
- source_word: ὀνόματι Σίμων
  choice: chamado Simão
  rationale: Forma portuguesa natural para o dativo ὀνόματι seguido do nome próprio.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: já estava antes naquela cidade
  rationale: O imperfeito de προϋπάρχω indica que Simão já se encontrava ali antes dos acontecimentos recém-narrados; 'naquela cidade' recupera naturalmente a cidade mencionada no contexto.
- source_word: μαγεύων
  choice: praticando magia
  rationale: Expressa o envolvimento contínuo com artes mágicas sem acrescentar uma explicação sobre sua origem espiritual.
- source_word: ἐξιστάνων
  choice: deixando maravilhado
  rationale: Transmite o sentido causativo de assombrar ou causar grande admiração e preserva a força participial contínua.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: o povo de Samaria
  rationale: Neste contexto, ἔθνος designa coletivamente a população, não necessariamente uma entidade política.
- source_word: λέγων εἶναί τινα ἑαυτὸν μέγαν
  choice: Ele dizia ser alguém importante
  rationale: A construção comunica a alegação de Simão acerca de si mesmo. 'Importante' expressa naturalmente μέγαν como grandeza de posição ou relevância, sem sugerir tamanho físico.
theological_decisions:
- issue: Caracterização da atividade de Simão
  choice: praticando magia
  alternative: praticando feitiçaria
  rationale: O verbo afirma a prática de artes mágicas, mas o versículo não define sua fonte metafísica nem a qualifica com categorias teológicas posteriores.
- issue: Natureza da alegação de Simão
  choice: ser alguém importante
  alternative: ser alguém grande
  rationale: A tradução preserva a autoexaltação sem especificar em que consistia sua suposta grandeza.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma sequência pesada de particípios sem perder as relações do grego. Os marcadores [a] e [b] aparecem no texto principal.
