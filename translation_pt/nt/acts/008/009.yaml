revisions:
- from: Um homem chamado Simão já estava antes naquela cidade, praticando magia e deixando maravilhado o povo de Samaria[a]. Ele dizia ser alguém importante[b].
  to: Um homem chamado Simão estava havia algum tempo na cidade, praticando magia e causando espanto entre o povo de Samaria[a], dizendo ser ele mesmo alguém grande[b].
  rationale: A revisão elimina a redundância temporal, melhora a naturalidade do predicado de espanto e preserva, numa só frase, a sequência de particípios do grego. «Ele mesmo» torna explícita a referência reflexiva de ἑαυτόν, enquanto «alguém grande» mantém a amplitude de μέγαν. As notas permanecem ancoradas nos mesmos pontos e oferecem alternativas lexicais pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:20:50Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a presença prévia de Simão, sua prática de magia, o efeito sobre a população samaritana e sua autoexaltação. Contudo, «já estava antes» é redundante e pouco idiomático para προϋπῆρχεν; «deixando maravilhado o povo» introduz uma concordância problemática, pois «o povo» é coletivo singular, e pode soar como se Simão deixasse o povo maravilhado em vez de causar espanto. A divisão em duas frases também enfraquece ligeiramente a ligação participial de λέγων.
  naturalness: É português compreensível, mas «já estava antes naquela cidade» não soa natural no registro pretendido. «Causando espanto entre o povo de Samaria» é mais fluente e preserva bem o valor causativo e contínuo de ἐξιστάνων. Manter «dizendo ser» numa única frase conserva a progressão do enunciado grego.
  terminology: «Praticando magia» é uma boa equivalência moderna para μαγεύων. «Alguém importante» é possível, mas «alguém grande» representa mais diretamente μέγαν e mantém a formulação deliberadamente ampla do original. Simão e Samaria estão adequadamente grafados.
  issues:
  - severity: medium
    issue: «já estava antes naquela cidade»
    rationale: A expressão duplica a anterioridade («já» + «antes») e é menos natural. «Estava havia algum tempo na cidade» reproduz com clareza a presença anterior/continuada indicada pelo imperfeito de προϋπῆρχεν, sem sobreinterpretar a duração.
  - severity: medium
    issue: «deixando maravilhado o povo de Samaria»
    rationale: Há desconforto de concordância com o coletivo singular «povo» e a formulação é menos idiomática. «Causando espanto entre o povo de Samaria» traduz naturalmente o particípio causativo ἐξιστάνων.
  - severity: low
    issue: «alguém importante» para μέγαν
    rationale: É interpretativamente aceitável, mas estreita «grande» à relevância social. «Alguém grande» preserva a amplitude e a autoglorificação da expressão grega.
  - severity: low
    issue: Nota [b] não corresponde plenamente à alternativa indicada
    rationale: A nota proposta reformula a oração inteira e perde a alternativa lexical direta de «alguém grande». Uma nota que ofereça «que ele era alguém importante» é mais clara e diretamente útil.
  revised_text: Um homem chamado Simão estava havia algum tempo na cidade, praticando magia e causando espanto entre o povo de Samaria[a], dizendo ser ele mesmo alguém grande[b].
