  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: pt
  text: E mandou parar a carruagem. Então ambos desceram para dentro da água[a], tanto Filipe como o eunuco, e Filipe o batizou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a água”. A preposição grega normalmente indica movimento para dentro da água.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: mandou
  rationale: Preserva o sentido de dar uma ordem, em português natural e digno.
- source_word: στῆναι τὸ ἅρμα
  choice: parar a carruagem
  rationale: Com o veículo como objeto, o infinitivo indica fazê-lo parar; esta é a formulação idiomática em português.
- source_word: ἅρμα
  choice: carruagem
  rationale: No contexto narrativo, designa o veículo em que o oficial viajava. “Carruagem” é claro em português e evita sugerir indevidamente um carro de guerra.
- source_word: κατέβησαν
  choice: desceram
  rationale: Reproduz diretamente o movimento descendente expresso por καταβαίνω.
- source_word: ἀμφότεροι
  choice: os dois
  rationale: Mantém a afirmação explícita de que ambos participaram do movimento.
- source_word: εἰς τὸ ὕδωρ
  choice: até entrarem na água
  rationale: Expressa de modo natural a força direcional de εἰς, que normalmente indica movimento para dentro, sem deduzir daí o modo do batismo.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: tanto Filipe como o eunuco
  rationale: Preserva a identificação enfática dos dois participantes após ἀμφότεροι.
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: Mantém o sentido lexical usual e a continuidade da identificação do homem na narrativa.
- source_word: ἐβάπτισεν
  choice: batizou
  rationale: Usa o termo cristão estabelecido sem substituir o verbo por uma interpretação que determine o modo do batismo.
- source_word: αὐτόν
  choice: o
  rationale: O pronome objeto retoma o eunuco de maneira natural em português; a repetição explícita de “Filipe” esclarece o sujeito do verbo.
theological_decisions:
- issue: Se a redação deve determinar o modo do batismo
  choice: Manter o movimento para dentro da água e traduzir βαπτίζω por “batizou”, sem explicar o modo.
  alternative: Traduzir βαπτίζω por “mergulhou” ou enfraquecer εἰς como simples movimento “até a água”.
  rationale: O grego afirma que ambos desceram para dentro da água e que Filipe batizou o eunuco, mas a frase, por si só, não descreve explicitamente como o ato batismal foi realizado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Carruagem” comunica melhor o veículo de viagem neste contexto. A explicitação de “Filipe” antes de “o batizou” evita uma ambiguidade pronominal artificial em português, sem acrescentar conteúdo ao referente claro do grego.
