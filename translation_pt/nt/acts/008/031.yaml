  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: pt
  text: 'Ele respondeu: “Como eu poderia entender, se ninguém me orientar[a]?” Então pediu insistentemente a Filipe que subisse e se sentasse com ele[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me guiar”. O verbo grego pode indicar tanto condução quanto orientação para compreender.
    reason: lexical_alternative
  - marker: b
    text: Ou “convidou Filipe a subir e sentar-se com ele”. O verbo pode descrever um pedido insistente ou um convite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Como eu poderia entender
  rationale: O optativo com ἄν expressa possibilidade condicionada. O verbo não traz explicitamente “entender”, mas o objeto implícito é a passagem lida e a pergunta anterior trata de compreensão; em português, explicitar o verbo evita uma frase truncada e preserva o sentido contextual.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: se ninguém me orientar
  rationale: ὁδηγέω significa guiar ou conduzir e, neste contexto, inclui orientação para compreender a Escritura. “Orientar” conserva a ideia de direção sem reduzir o verbo a mera explicação.
- source_word: παρεκάλεσέν
  choice: convidou insistentemente
  rationale: παρακαλέω pode significar pedir, instar ou convidar. A expressão comunica um convite cortês, mas enfático, sem a intensidade excessiva de “implorou”.
- source_word: τε
  choice: Então
  rationale: A partícula conecta os acontecimentos de modo leve; “Então” expressa naturalmente a progressão narrativa.
- source_word: ἀναβάντα
  choice: a subir
  rationale: Preserva a imagem espacial de subir ao veículo, em vez de substituí-la pela formulação mais interpretativa “entrar”.
- source_word: καθίσαι σὺν αὐτῷ
  choice: sentar-se com ele
  rationale: Traduz diretamente a construção com σύν, sem especificar indevidamente que Filipe se sentou ao lado dele.
- source_word: Φίλιππον
  choice: Filipe
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego.
