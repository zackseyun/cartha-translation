  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: pt
  text: Pois vejo que você está no fel da amargura e no vínculo da injustiça[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na corrente da injustiça» ou «nas amarras da maldade».'
    reason: lexical_alternative
  - marker: b
    text: «O fel da amargura» é uma metáfora vívida, provavelmente um eco da linguagem do Antigo Testamento sobre amargura venenosa (compare Deuteronômio 29:18 na Septuaginta).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: no ... e no
  rationale: Embora εἰς costume indicar movimento para dentro, com ὁρῶ σε ὄντα descreve aqui a condição em que Simão se encontra. A contração portuguesa «no» comunica naturalmente essa esfera metafórica.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão da repreensão anterior de Pedro e mantém de modo claro a ligação argumentativa.
- source_word: χολὴν πικρίας
  choice: o fel da amargura
  rationale: Preserva a metáfora forte e compacta do grego, na qual «fel» pode evocar algo amargo ou venenoso, sem reduzi-la simplesmente a um sentimento de amargura.
- source_word: σύνδεσμον ἀδικίας
  choice: o vínculo da injustiça
  rationale: «Vínculo» conserva a ideia daquilo que prende; «injustiça» mantém a amplitude moral de ἀδικία sem especificá-la apenas como pecado pessoal ou opressão social.
- source_word: ὁρῶ
  choice: vejo
  rationale: É direto e natural em português e pode expressar tanto visão quanto percepção ou discernimento.
- source_word: σε ὄντα
  choice: que você está
  rationale: A construção grega de acusativo com particípio depois de ὁρῶ é expressa naturalmente em português por uma oração introduzida por «que».
theological_decisions:
- issue: Descrição metafórica da condição espiritual de Simão
  choice: Manter «no fel da amargura e no vínculo da injustiça» como duas imagens de sua condição presente.
  alternative: Explicitar interpretativamente como «cheio de veneno amargo e escravizado pelo pecado» ou «preso à maldade».
  rationale: O grego emprega metáforas densas, não uma explicação doutrinária explícita. Conservá-las mantém a severidade e a tensão do texto sem definir além dele a natureza exata da condição de Simão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «você» para clareza direta. As imagens incomuns do original foram preservadas de propósito; as notas esclarecem alternativas sem substituir a ambiguidade do texto.
