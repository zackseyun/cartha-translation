  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: pt
  text: 'Mas Pedro lhe disse: “Que a sua prata pereça com você[a], porque você pensou que poderia adquirir[b] o dom de Deus com dinheiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o seu dinheiro vá para a perdição junto com você”. O grego diz literalmente “prata”, termo comumente usado para se referir a dinheiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “obter” ou “comprar”. A ideia é que Simão tratou o dom de Deus como algo que poderia ser obtido mediante pagamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: prata
  rationale: Preserva a imagem concreta do grego, em que “prata” designa também dinheiro, e evita repetir “dinheiro” na mesma frase.
- source_word: σὺν σοὶ
  choice: com você
  rationale: Expressa de modo direto que a prata e Simão estão unidos no pronunciamento.
- source_word: εἴη εἰς ἀπώλειαν
  choice: Que ... pereça
  rationale: O optativo expressa um desejo ou pronunciamento imprecatório; esta formulação mantém sua severidade sem especificar condenação eterna.
- source_word: δωρεὰν
  choice: dom
  rationale: “Dom” é natural no contexto da dádiva divina e mantém o contraste com algo adquirido mediante pagamento.
- source_word: ἐνόμισας
  choice: você pensou
  rationale: Tradução clara e direta do sentido de pensar ou supor.
- source_word: διὰ χρημάτων
  choice: com dinheiro
  rationale: Expressa naturalmente o meio indicado por διά com o genitivo.
- source_word: κτᾶσθαι
  choice: adquirir
  rationale: Mantém a ideia de obter para si sem tornar o verbo mais explicitamente comercial do que o grego; o uso de dinheiro já fornece essa nuance.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste entre o pedido anterior de Simão e a resposta severa de Pedro.
theological_decisions:
- issue: Força do pronunciamento de Pedro contra Simão e sua prata
  choice: Desejo ou pronunciamento imprecatório de perdição, traduzido por “Que a sua prata pereça com você”
  alternative: Predição declarativa de destruição; ou fórmula explícita de condenação eterna
  rationale: O optativo εἴη favorece um desejo ou pronunciamento, não uma simples previsão. “Pereça” preserva a força de ἀπώλεια sem resolver se a referência é à ruína temporal ou à condenação final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” corresponde ao tratamento direto singular do contexto; “prata” conserva a imagem retórica do original, esclarecida em nota.
