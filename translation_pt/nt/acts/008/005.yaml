  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: pt
  text: Filipe desceu à cidade de Samaria e lhes proclamava o Messias[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a uma cidade da Samaria”. A expressão grega pode ser entendida como referência à cidade de Samaria ou, de modo mais geral, a uma cidade da região samaritana.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “à cidade de Samaria”.'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: e
  rationale: Conjunção narrativa leve, integrada à coordenação em português sem introduzir um contraste forte nem um advérbio temporal ausente do grego.
- source_word: κατελθὼν
  choice: desceu
  rationale: O particípio aoristo indica uma ação anterior à proclamação; a forma verbal finita é natural em português e conserva o sentido direcional de κατέρχομαι.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: à cidade de Samaria
  rationale: Mantém o artigo definido de πόλιν e o genitivo “de Samaria”. Como a expressão pode indicar a cidade chamada Samaria ou uma cidade da região samaritana, a alternativa é registrada em nota.
- source_word: ἐκήρυσσεν
  choice: proclamava
  rationale: “Proclamar” preserva a ideia de anúncio público de κηρύσσω, enquanto o imperfeito português representa o aspecto durativo ou reiterado do imperfeito grego.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo identifica de modo conciso os destinatários da proclamação.
- source_word: τὸν χριστόν
  choice: o Messias
  rationale: Com o artigo e nesse contexto de proclamação, Χριστός funciona como título messiânico; “Messias” traduz o título em vez de tratá-lo como nome próprio.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: A construção articular τὸν χριστόν apresenta o termo como título. “O Messias” preserva sua função e seu contexto judaico, sem transformar prematuramente o título em designação semelhante a nome próprio.
- issue: Identificação da cidade
  choice: à cidade de Samaria
  alternative: a uma cidade da Samaria
  rationale: O artigo definido favorece a tradução principal, mas a sintaxe não elimina a leitura regional e indefinida; essa ambiguidade genuína é mantida em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. “Proclamava” conserva a força pública do verbo grego e seu aspecto imperfeito. Os marcadores [a] e [b] aparecem no texto principal conforme exigido.
