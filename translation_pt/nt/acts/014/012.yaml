  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: pt
  text: E chamavam Barnabé de Zeus, e Paulo, de Hermes, porque era ele quem tomava a frente ao falar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ele era o principal orador” ou “o porta-voz”. O grego diz literalmente “aquele que liderava a fala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: chamavam
  rationale: O imperfeito indica ação em curso ou repetida; o imperfeito português preserva naturalmente esse aspecto.
- source_word: τε
  choice: E
  rationale: A partícula conecta levemente a frase à narrativa anterior; “E” é um elo natural sem acrescentar ênfase indevida.
- source_word: Δία
  choice: Zeus
  rationale: Reproduz o nome grego presente no texto, sem substituí-lo pelo equivalente romano Júpiter.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Reproduz o nome grego presente no texto, sem substituí-lo pelo equivalente romano Mercúrio.
- source_word: ἐπειδὴ
  choice: porque
  rationale: Expressa com clareza a causa da identificação de Paulo com Hermes.
- source_word: αὐτὸς
  choice: era ele quem
  rationale: Conserva a ênfase do pronome e distingue Paulo de Barnabé sem tornar a frase artificial.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: quem tomava a frente ao falar
  rationale: Traduz de modo natural a ideia daquele que liderava ou desempenhava o papel principal no discurso, preservando o caráter verbal da expressão sem convertê-la necessariamente em um título fixo.
theological_decisions:
- issue: Nomes das divindades pagãs
  choice: Zeus e Hermes no texto principal
  alternative: Júpiter e Mercúrio
  rationale: O texto grego emprega os nomes gregos; mantê-los respeita a primazia da fonte e evita importar os equivalentes romanos da tradição latina.
- issue: Sentido de ὁ ἡγούμενος τοῦ λόγου
  choice: quem tomava a frente ao falar
  alternative: o principal orador / o porta-voz
  rationale: A formulação preserva a ideia de liderança na fala sem resolver a expressão apenas como cargo formal; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “chamavam X de Y” é corrente; a repetição de “de” antes de Hermes favorece a clareza. Os nomes gregos são mantidos conforme a fonte.
