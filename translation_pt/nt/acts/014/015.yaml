  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: pt
  text: 'e dizendo: “Homens, por que vocês estão fazendo essas coisas? Nós também somos seres humanos como vocês, sujeitos às mesmas condições[a], e lhes anunciamos as boas-novas para que se afastem dessas coisas inúteis[b] e se voltem para o Deus vivo, que fez o céu[c], a terra, o mar e tudo o que neles existe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da mesma condição que vocês”. A expressão indica que Paulo e Barnabé compartilham a mesma condição e as mesmas limitações humanas de seus ouvintes.'
    reason: lexical_alternative
  - marker: b
    text: “Coisas inúteis” refere-se, neste contexto, ao culto pagão sem proveito, inclusive aos ídolos e aos sacrifícios oferecidos a eles.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os céus”. O grego traz “céu” no singular, numa fórmula tradicional da criação que ecoa a linguagem das Escrituras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Mantém o vocativo masculino plural dirigido à multidão, sem acrescentar a especificação contextual “da Licaônia”, ausente do grego.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: seres humanos como vocês, sujeitos às mesmas condições
  rationale: Expressa tanto a humanidade comum indicada por ἄνθρωποι quanto a condição e as experiências humanas compartilhadas indicadas por ὁμοιοπαθεῖς, evitando a leitura restrita de “mesmos sentimentos”.
- source_word: εὐαγγελιζόμενοι ὑμᾶς
  choice: lhes anunciamos as boas-novas
  rationale: Preserva o sentido verbal de anunciar uma boa notícia em linguagem atual, sem depender do uso eclesiástico de “evangelizar”.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: se afastem dessas coisas inúteis
  rationale: Mantém a expressão ampla e depreciativa do grego. No contexto, ela abrange o culto pagão inútil, inclusive os ídolos, mas o texto não emprega explicitamente o substantivo “ídolos”.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: se afastem ... e se voltem para o Deus vivo
  rationale: 'Torna explícitas em português as duas direções do movimento descrito por ἀπό e ἐπί: deixar as práticas inúteis e voltar-se para o Deus vivo.'
- source_word: ἐποίησεν
  choice: fez
  rationale: Equivalente direto de ποιέω na fórmula de criação, natural em português e sem necessidade de substituir pelo termo mais técnico “criou”.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: o céu, a terra, o mar
  rationale: Conserva o singular de οὐρανός e os três domínios da fórmula bíblica de criação, com artigos naturais em português.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tudo o que neles existe
  rationale: Formulação portuguesa natural e abrangente para tudo o que se encontra no céu, na terra e no mar.
theological_decisions:
- issue: Condição humana de Paulo e Barnabé em contraste com as honras divinas
  choice: Nós também somos seres humanos como vocês, sujeitos às mesmas condições
  alternative: Nós também somos homens da mesma natureza que vocês
  rationale: A tradução rejeita claramente a atribuição de divindade aos apóstolos e preserva a ênfase na condição humana compartilhada, sem reduzir ὁμοιοπαθεῖς a emoções nem sugerir uma definição metafísica técnica de “natureza”.
- issue: Alcance de τὰ μάταια
  choice: coisas inúteis
  alternative: ídolos
  rationale: O contexto inclui ídolos, sacrifícios e culto pagão, mas a expressão grega é mais ampla que um termo explícito para “ídolos”. A formulação principal preserva essa amplitude, e a nota esclarece o referente contextual.
- issue: Contraste entre o Deus vivo e o culto pagão
  choice: o Deus vivo
  alternative: um Deus vivo
  rationale: O grego anartro pode ser definido nesta construção e o discurso identifica o Criador único em contraste com objetos de culto sem vida. “O Deus vivo” reproduz esse contraste sem acrescentar uma formulação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural e “boas-novas” para preservar o caráter verbal e acessível de εὐαγγελίζομαι. A coordenação “se afastem ... e se voltem” comunica naturalmente a mudança de direção sem usar o termo teologicamente mais carregado “convertam-se”.
