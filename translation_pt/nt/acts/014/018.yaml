  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: pt
  text: Mesmo dizendo essas coisas, mal conseguiram impedir que as multidões lhes oferecessem sacrifícios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Mesmo dizendo essas coisas
  rationale: 'Neste contexto, καί tem força intensiva/concessiva: apesar de tudo o que acabavam de dizer, os apóstolos quase não conseguiram deter as multidões.'
- source_word: μόλις κατέπαυσαν
  choice: mal conseguiram impedir
  rationale: μόλις indica grande dificuldade, 'por pouco' ou 'mal'; κατέπαυσαν descreve fazer cessar ou impedir a ação pretendida.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Mantém o plural do texto grego e a referência aos grupos reunidos.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: que as multidões lhes oferecessem sacrifícios
  rationale: Expressa naturalmente a construção grega que indica a ação impedida; αὐτοῖς refere-se aos apóstolos como destinatários dos sacrifícios.
theological_decisions:
- issue: Destinatários dos sacrifícios
  choice: lhes oferecessem sacrifícios
  alternative: sacrificassem para eles
  rationale: A tradução preserva claramente que o povo pretendia oferecer sacrifícios a Paulo e Barnabé, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a ênfase concessiva e a extrema dificuldade indicada pelo grego.
