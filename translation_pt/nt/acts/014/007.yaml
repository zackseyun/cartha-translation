  text: And there they were preaching the good news[a].
translation:
  language: pt
  text: E ali anunciavam as boas-novas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também ali proclamavam o evangelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: E ali
  rationale: A contração de καί com ἐκεῖ pode significar “e ali” ou “também ali”. “E ali” preserva de modo natural a ligação narrativa com o versículo anterior.
- source_word: εὐαγγελιζόμενοι
  choice: anunciando as boas-novas
  rationale: O particípio de εὐαγγελίζω descreve o anúncio de boas notícias, particularmente a mensagem do evangelho. “Anunciando as boas-novas” é claro, atual e preserva o sentido verbal sem depender de terminologia eclesiástica.
- source_word: ἦσαν
  choice: continuavam
  rationale: Em conjunto com o particípio εὐαγγελιζόμενοι, o imperfeito de εἰμί forma uma construção perifrástica que expressa ação passada em andamento. “Continuavam anunciando” comunica essa duração naturalmente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Boas-novas” mantém a transparência lexical do grego; a nota registra a formulação eclesiástica tradicional “evangelho” e a alternativa possível para κἀκεῖ.
