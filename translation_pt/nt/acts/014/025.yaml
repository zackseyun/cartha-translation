  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: pt
  text: E, depois de terem falado a palavra em Perge[a], desceram para Atália,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo falado a palavra em Perge”.'
    reason: Alternativa que reproduz mais de perto o particípio aoristo λαλήσαντες; «falar» preserva o sentido amplo do verbo grego.
lexical_decisions:
- source_word: λαλήσαντες
  choice: depois de anunciarem
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. Em português, “depois de anunciarem” é natural e, no contexto missionário, comunica a transmissão pública da mensagem sem recorrer ao termo mais técnico “proclamar”.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Preserva a expressão cristã recorrente em Atos para a mensagem anunciada, sem acrescentar “do Senhor”, ausente do texto grego.
- source_word: ἐν Πέργῃ
  choice: em Perge
  rationale: A preposição ἐν com o nome da cidade corresponde naturalmente a “em”; “Perge” é a forma portuguesa corrente do topônimo.
- source_word: κατέβησαν
  choice: desceram
  rationale: Traduz diretamente o movimento descendente expresso por καταβαίνω e conserva a possível referência geográfica ao trajeto do interior em direção à costa.
- source_word: εἰς Ἀττάλειαν
  choice: para Atália
  rationale: Com destino geográfico, εἰς é expresso de modo natural por “para”; “Atália” é a forma portuguesa do topônimo.
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão narrativa simples do grego, sem acrescentar uma relação temporal mais explícita do que o texto exige.
