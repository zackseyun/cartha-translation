  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: pt
  text: 'Ele disse em alta voz: “Levante-se e fique de pé, direito!”[a] Então o homem deu um salto e começou a andar.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levante-se ereto sobre os seus pés.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “deu um salto e andava”. O último verbo está no imperfeito e pode destacar a ação contínua ou o começo do ato de andar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: em alta voz
  rationale: A expressão no dativo indica modo; “em alta voz” é natural em português e comunica a intensidade pública e enfática da ordem.
- source_word: Ἀνάστηθι
  choice: Levante-se
  rationale: O imperativo aoristo de ἀνίστημι ordena que o homem se erga, sentido preservado de maneira direta e corrente.
- source_word: ἐπὶ τοὺς πόδας σου ὀρθός
  choice: e fique de pé
  rationale: A formulação portuguesa expressa naturalmente a postura ereta exigida pelo grego, sem recorrer a uma construção excessivamente literal e pouco idiomática.
- source_word: ἥλατο
  choice: deu um salto
  rationale: O verbo ἅλλομαι descreve um movimento súbito e vívido; “deu um salto” preserva essa força narrativa em português atual.
- source_word: περιεπάτει
  choice: começou a andar
  rationale: O imperfeito pode ter valor ingressivo ou durativo. No encadeamento após o salto, “começou a andar” comunica de modo natural o início da ação continuada, sem excluir a alternativa durativa registrada em nota.
theological_decisions:
- issue: Linguagem do milagre e ordem relativa à postura
  choice: Apresentar diretamente a ordem física e a reação imediata do homem
  alternative: Acrescentar uma explicação teológica sobre a causa ou a natureza do milagre
  rationale: O grego narra uma ordem seguida de uma resposta física imediata e visível. A tradução conserva essa concretude sem introduzir explicações doutrinárias ausentes do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O homem” explicita o sujeito da reação para evitar ambiguidade em português; o referente está dado pelo contexto imediato. As notas preservam tanto a forma mais literal da ordem quanto a ambiguidade aspectual do imperfeito.
