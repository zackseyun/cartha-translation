  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: pt
  text: Esse homem ouviu Paulo falar; Paulo, olhando atentamente para ele e vendo que ele tinha fé para ser curado,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo, “para ser salvo”. O verbo grego pode significar “salvar” ou “curar”; aqui, o contexto favorece a cura física.
    reason: alternativa lexical
lexical_decisions:
- source_word: οὗτος
  choice: Esse homem
  rationale: O demonstrativo retoma especificamente o homem aleijado mencionado no versículo anterior; “esse homem” é claro e natural em português.
- source_word: ἤκουσεν
  choice: ouvia
  rationale: No contexto, descreve o homem acompanhando a fala de Paulo. O imperfeito em português expressa com naturalidade essa escuta em andamento, embora o grego use o aoristo.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Paulo falar
  rationale: 'A construção com genitivo e particípio indica o conteúdo percebido: ele ouvia Paulo enquanto este falava.'
- source_word: ἀτενίσας αὐτῷ
  choice: olhando fixamente para ele
  rationale: ἀτενίζω denota dirigir um olhar atento e concentrado; a formulação preserva essa intensidade sem sugerir hostilidade.
- source_word: ἰδὼν
  choice: vendo
  rationale: Mantém a linguagem concreta de percepção, sem explicitar além do texto como Paulo reconheceu a fé do homem.
- source_word: ἔχει πίστιν
  choice: tinha fé
  rationale: Aqui πίστις indica a resposta confiante do homem à mensagem ou ação divina, e não sua fidelidade pessoal.
- source_word: τοῦ σωθῆναι
  choice: para ser curado
  rationale: Embora σῴζω possa significar “salvar”, o contexto imediato é a restauração física do homem aleijado. A alternativa mais ampla é preservada em nota.
theological_decisions:
- issue: Sentido de σωθῆναι no relato de cura
  choice: para ser curado
  alternative: para ser salvo
  rationale: A cura física narrada no versículo seguinte orienta o sentido contextual. A nota conserva a amplitude lexical e a possível ressonância de salvação sem impor essa leitura ao texto principal.
- issue: Relação entre a fé do homem e a cura
  choice: tinha fé para ser curado
  alternative: tinha uma fé que o salvaria
  rationale: A formulação mantém a ligação expressa no grego entre fé e o resultado indicado por σωθῆναι, sem definir mecanismo, mérito ou alcance doutrinário além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Paulo” evita que o pronome relativo grego produza ambiguidade em português sobre quem olhou para o homem. A vírgula final mantém a continuidade sintática com o versículo seguinte.
