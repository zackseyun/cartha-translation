  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: pt
  text: Nas gerações passadas, ele permitiu que todas as nações andassem em seus próprios caminhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permitiu que todos os gentios seguissem os caminhos deles”.'
    reason: Alternativas lexicais para ἔθνη, πορεύεσθαι e αὐτῶν.
lexical_decisions:
- source_word: ὃς
  choice: ele
  rationale: Embora seja literalmente um pronome relativo, retomar o antecedente como “ele” produz uma frase natural em português; o referente é Deus, mencionado no versículo anterior.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Nas gerações passadas
  rationale: Expressa com clareza as gerações que já se foram, em linguagem atual e digna.
- source_word: εἴασεν
  choice: permitiu
  rationale: Comunica permissão ou não impedimento, sem sugerir aprovação moral nem determinação causal.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Preserva o alcance coletivo e etnonacional de ἔθνη; “os gentios” continua sendo uma alternativa possível.
- source_word: πορεύεσθαι
  choice: andassem
  rationale: Mantém a metáfora bíblica de andar como modo de viver, em harmonia com “caminhos”.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: em seus próprios caminhos
  rationale: Preserva a imagem dos caminhos e torna natural em português a força possessiva de αὐτῶν.
theological_decisions:
- issue: Permissão divina versus aprovação
  choice: Deus permitiu que as nações seguissem seus próprios caminhos.
  alternative: Deus aprovou ou determinou os caminhos das nações.
  rationale: O verbo εἴασεν indica permitir. A formulação conserva a tensão entre a soberania divina e a responsabilidade humana, sem transformar permissão em aprovação ou determinação causal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Andassem em seus próprios caminhos” preserva a metáfora do original sem soar excessivamente arcaico.
