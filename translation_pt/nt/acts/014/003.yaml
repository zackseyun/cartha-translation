id: ACT.14.3
reference: Acts 14:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: pt
  text: Assim, permaneceram ali por bastante tempo, falando com ousadia no Senhor[a], que dava testemunho em favor da palavra da sua graça, concedendo que sinais e maravilhas fossem realizados pelas mãos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falando com ousadia pelo Senhor” ou “apoiados no Senhor”. A expressão grega pode indicar que a ousadia deles era exercida em relação ao Senhor ou estava fundamentada nele.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: por bastante tempo
  rationale: A expressão indica uma duração substancial. “Por bastante tempo” é corrente em português e comunica extensão considerável sem precisar demais.
- source_word: διέτριψαν
  choice: permaneceram ali
  rationale: O verbo indica passar tempo ou permanecer num lugar; “permaneceram ali” mantém tanto a ideia locativa quanto a durativa.
- source_word: παρρησιαζόμενοι
  choice: falando com ousadia
  rationale: Expressa fala franca, aberta e destemida; a formulação é clara e natural no contexto da proclamação.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: no Senhor
  rationale: A construção pode indicar esfera, fundamento ou dependência. “No Senhor” preserva essa abertura sem reduzi-la apenas à ideia de falar em favor dele.
- source_word: τῷ κυρίῳ
  choice: o Senhor
  rationale: Mantém o título grego sem acrescentar explicitamente “Jesus”, embora o contexto narrativo possa apontar para o Senhor ressuscitado.
- source_word: τῷ μαρτυροῦντι
  choice: que dava testemunho
  rationale: Conserva o valor testemunhal de μαρτυρέω e o caráter contínuo do particípio presente.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: da palavra da sua graça
  rationale: Preserva a construção genitiva e a linguagem teológica do texto, podendo significar a palavra caracterizada pela graça ou a mensagem a respeito dela.
- source_word: χάριτος
  choice: graça
  rationale: “Graça” mantém o peso teológico habitual de χάρις em Lucas–Atos.
- source_word: διδόντι
  choice: concedendo
  rationale: Apresenta o Senhor como aquele que possibilita ou outorga a realização dos atos, em vez de meramente permitir que ocorram.
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e maravilhas
  rationale: Mantém a conhecida expressão bíblica, que reúne o valor indicativo dos feitos e seu caráter extraordinário.
- source_word: γίνεσθαι
  choice: fossem realizados
  rationale: No contexto dos sinais e maravilhas feitos por meio dos apóstolos, a formulação comunica adequadamente a ocorrência dos atos sem fazer deles sua fonte última.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: pelas mãos deles
  rationale: 'Preserva a imagem concreta e a ideia de instrumentalidade: os feitos acontecem mediante a atuação deles.'
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter apenas “o Senhor”
  alternative: Explicitar “o Senhor Jesus” ou entender de modo mais geral como Deus
  rationale: O grego traz somente τῷ κυρίῳ. A tradução evita acrescentar uma identificação que o versículo não formula expressamente.
- issue: Sentido de ἐπὶ τῷ κυρίῳ
  choice: “no Senhor” no texto principal
  alternative: “pelo Senhor”, “apoiados no Senhor” ou “confiando no Senhor”
  rationale: A preposição pode expressar esfera, base ou dependência. A forma principal mantém a concisão e a ambiguidade do original, enquanto a nota esclarece as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a ligação das ações de testemunhar e conceder ao Senhor, sem explicitar além do texto quem ele é.
