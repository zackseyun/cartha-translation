id: ACT.14.4
reference: Acts 14:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: pt
  text: 'Mas a população da cidade ficou dividida[a]: uns estavam com os judeus, e outros, com os apóstolos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a multidão da cidade se dividiu”.'
    reason: Alternativa lexical mais literal para ἐσχίσθη e τὸ πλῆθος τῆς πόλεως.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: ficou dividida
  rationale: O aoristo passivo de σχίζω indica que a população se dividiu em grupos opostos. “Ficou dividida” é natural em português e preserva tanto o resultado quanto a voz passiva.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: a população da cidade
  rationale: πλῆθος designa aqui o conjunto numeroso dos habitantes, não necessariamente uma multidão reunida num só lugar. “A população da cidade” comunica o alcance coletivo com clareza.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz um contraste moderado com o desenvolvimento anterior; “Mas” sinaliza adequadamente a divisão que surgiu.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: uns ... outros
  rationale: A construção correlativa distingue dois grupos contrapostos. “Uns ... outros” é a forma portuguesa idiomática e concisa.
- source_word: σὺν
  choice: com
  rationale: σύν com o dativo expressa associação. O contexto deixa claro que se trata de alinhamento ou apoio, de modo que “com” basta sem explicitação interpretativa.
- source_word: Ἰουδαίοις
  choice: os judeus
  rationale: Nada no versículo restringe o referente aos líderes judeus. “Os judeus” traduz diretamente o grupo designado no texto, sem substituí-lo por uma categoria mais estreita.
- source_word: ἀποστόλοις
  choice: os apóstolos
  rationale: “Apóstolos” é o termo consagrado e inteligível para ἀπόστολοι. Neste contexto narrativo, refere-se a Barnabé e Paulo, como explicitado em Atos 14:14.
theological_decisions:
- issue: Referência de “os apóstolos”
  choice: Manter “os apóstolos” como designação narrativa de Barnabé e Paulo.
  alternative: Traduzir genericamente como “os enviados” ou “os mensageiros”.
  rationale: Lucas chama explicitamente Barnabé e Paulo de “apóstolos” em Atos 14:14. A tradução direta preserva a terminologia do autor sem impor ao termo uma definição doutrinária mais estreita do que o contexto permite.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A vírgula elíptica em “e outros, com os apóstolos” evita repetição sem perder clareza; a nota preserva a formulação mais literal possível.
