id: ACT.14.27
reference: Acts 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: pt
  text: Quando chegaram e reuniram a igreja, relataram tudo o que Deus havia feito com eles[a] e que havia aberto aos gentios uma porta para a fé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo o que Deus havia feito por meio deles”. O grego diz mais literalmente “com eles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma porta da fé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Quando chegaram
  rationale: Expressa naturalmente em português a circunstância temporal anterior à ação principal indicada pelo particípio aoristo.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: reuniram a igreja
  rationale: Refere-se à convocação da comunidade cristã local; a formulação é clara e idiomática.
- source_word: ἀνήγγελλον
  choice: relataram
  rationale: Adequa-se ao contexto em que Paulo e Barnabé prestam à igreja um relato do trabalho realizado, sem a formalidade excessiva de “anunciaram”.
- source_word: ὅσα
  choice: tudo o que
  rationale: Equivalente português natural do pronome relativo neutro plural que introduz o conteúdo do relato.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: Deus havia feito com eles
  rationale: Preserva o sentido mais direto de μετά com o genitivo e mantém Deus como agente, sem definir a relação como estritamente instrumental.
- source_word: ἤνοιξεν
  choice: havia aberto
  rationale: O mais-que-perfeito composto situa adequadamente a ação divina já concluída antes do relato.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: No contexto de Atos, designa os não judeus, e não nações em sentido geopolítico.
- source_word: θύραν πίστεως
  choice: uma porta para a fé
  rationale: Conserva a metáfora e expressa em português natural a ideia de acesso ou oportunidade para crer, sem eliminar a possível leitura mais literal “porta da fé”.
- source_word: πίστεως
  choice: fé
  rationale: É a correspondência normal de πίστις neste contexto e preserva a linguagem teológica do texto.
theological_decisions:
- issue: Sentido de μετ’ αὐτῶν na descrição da ação de Deus
  choice: Deus havia feito com eles
  alternative: Deus havia feito por meio deles
  rationale: A opção mantém a formulação associativa do grego e evita resolver a relação entre a ação divina e a participação apostólica em termos exclusivamente instrumentais.
- issue: Sentido de ἔθνεσιν
  choice: gentios
  alternative: nações
  rationale: A narrativa destaca a inclusão dos não judeus; “gentios” comunica essa distinção sem sugerir estados ou povos politicamente definidos.
- issue: Relação expressa por θύραν πίστεως
  choice: uma porta para a fé
  alternative: uma porta da fé
  rationale: “Para a fé” torna a metáfora inteligível como abertura de acesso à fé, enquanto a nota conserva a construção genitiva mais literal e sua possível amplitude.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Igreja” e “gentios” preservam o vocabulário bíblico corrente; “relataram” corresponde ao contexto de prestação de contas missionária. As notas mantêm as ambiguidades relevantes de μετά e do genitivo πίστεως.
