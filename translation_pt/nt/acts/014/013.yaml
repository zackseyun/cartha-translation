  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: pt
  text: E o sacerdote de Zeus, cujo templo ficava diante da cidade[a], levou touros e grinaldas[b] até os portões e, junto com as multidões, queria oferecer sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de Zeus, que estava diante da cidade”; provavelmente se refere ao templo ou santuário de Zeus situado diante ou fora da cidade.
    reason: alternative_reading
  - marker: b
    text: Ou “coroas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: E
  rationale: A combinação dá continuidade à narrativa; «E» reproduz essa ligação de modo natural e sem sobrecarregá-la.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: o sacerdote de Zeus
  rationale: Mantém o nome grego da divindade, em vez do equivalente romano Júpiter.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: cujo templo ficava diante da cidade
  rationale: A expressão identifica provavelmente Zeus pela localização de seu local de culto. «Templo» é explicitado para tornar compreensível em português o referente implícito, enquanto «diante da cidade» conserva a formulação espacial do grego.
- source_word: ταύρους
  choice: touros
  rationale: É o equivalente direto e natural no contexto sacrificial.
- source_word: στέμματα
  choice: grinaldas
  rationale: Designa adornos festivos empregados na procissão sacrificial; «grinaldas» é claro em português, com «coroas» registrado como alternativa em nota.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: até os portões
  rationale: Com verbo de movimento, ἐπί indica direção; o plural do substantivo é preservado.
- source_word: ἐνέγκας
  choice: levou
  rationale: O particípio aoristo fornece ação de fundo ligada ao verbo principal; a coordenação verbal é natural em português.
- source_word: σὺν τοῖς ὄχλοις
  choice: junto com as multidões
  rationale: Preserva o plural de ὄχλοις e mostra que o sacerdote pretendia agir em conjunto com o povo reunido.
- source_word: ἤθελεν θύειν
  choice: queria oferecer sacrifícios
  rationale: θέλω com infinitivo expressa desejo ou intenção, e θύω, neste contexto cultual, significa sacrificar/oferecer em sacrifício. O plural idiomático português não determina quantos animais seriam efetivamente sacrificados.
theological_decisions:
- issue: Referente implícito em τοῦ ὄντος πρὸ τῆς πόλεως
  choice: 'A expressão é vertida como referência ao templo de Zeus: «cujo templo ficava diante da cidade».'
  alternative: «de Zeus, que ficava diante da cidade» ou «do Zeus que estava diante da cidade»
  rationale: A construção grega modifica formalmente Zeus, mas provavelmente o identifica por seu santuário situado diante ou fora da cidade. A tradução explicita «templo» para inteligibilidade, e a nota preserva a forma literal e a possível noção de localização fora da cidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ficava» expressa localização habitual; «junto com» é corrente sem perder solenidade. Todos os marcadores de nota aparecem no texto.
