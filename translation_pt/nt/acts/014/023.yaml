id: ACT.14.23
reference: Acts 14:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: pt
  text: Depois de designarem presbíteros para eles em cada igreja[a] e de orarem com jejuns, confiaram-nos ao Senhor[b], em quem haviam crido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de elegerem presbíteros para eles em cada igreja”. O verbo grego pode, em certos contextos, referir-se à escolha por votação ou por mãos levantadas, embora aqui também possa significar simplesmente designar.'
    reason: alternative_reading
  - marker: b
    text: O pronome em “confiaram-nos” pode referir-se aos fiéis das igrejas em geral ou, mais especificamente, aos presbíteros recém-designados.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: depois de designarem
  rationale: O particípio indica escolher ou nomear. “Designarem” comunica a instituição dos líderes sem impor um procedimento específico de votação.
- source_word: κατ’ ἐκκλησίαν
  choice: em cada igreja
  rationale: A construção distributiva com κατά e substantivo singular indica cada congregação local.
- source_word: πρεσβυτέρους
  choice: presbíteros
  rationale: No contexto eclesial, designa líderes reconhecidos da comunidade; “presbíteros” é corrente e preciso em português bíblico.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: e de orarem com jejuns
  rationale: Mantém a coordenação dos particípios e preserva o plural νηστειῶν de modo natural e digno.
- source_word: παρέθεντο
  choice: confiaram
  rationale: Expressa entregar pessoas aos cuidados de alguém, preservando o valor relacional da voz média.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: O dativo identifica aquele a cujos cuidados as pessoas foram confiadas.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: em quem haviam crido
  rationale: “Crer em” é a formulação portuguesa natural para πιστεύω εἰς, e “haviam crido” representa o mais-que-perfeito grego.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: para eles ... confiaram-nos
  rationale: Os pronomes são preservados sem explicitar indevidamente seus referentes; no segundo caso, o referente mais provável são os fiéis, embora possa ser entendido como os presbíteros.
theological_decisions:
- issue: Sentido de χειροτονήσαντες quanto ao governo da igreja
  choice: designarem presbíteros
  alternative: elegerem presbíteros, possivelmente por mãos levantadas
  rationale: O verbo pode ter associação histórica com votação por mãos levantadas, mas neste contexto não especifica inequivocamente o mecanismo. “Designarem” evita impor um modelo denominacional.
- issue: Referente de αὐτοὺς em παρέθεντο αὐτοὺς τῷ κυρίῳ
  choice: manter o pronome, tendo os fiéis das igrejas como referente mais provável
  alternative: os presbíteros recém-designados
  rationale: O contexto mais amplo favorece os discípulos ou comunidades, mas a proximidade de “presbíteros” permite a leitura alternativa; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Presbíteros” preserva o termo eclesial reconhecido; “designarem” evita definir um sistema de governo da igreja. A ordem da frase acompanha a sequência do grego sem produzir construção artificial.
