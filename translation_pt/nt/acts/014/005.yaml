source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: pt
  text: Quando, porém, houve uma tentativa[a] por parte tanto dos gentios como dos judeus[b], junto com seus líderes, de maltratá-los e apedrejá-los,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma investida” ou “um ataque”. A palavra grega ὁρμή pode indicar um movimento violento ou uma ofensiva; “tentativa” foi adotado porque as ações hostis são apresentadas como intenções — maltratá-los e apedrejá-los — e não como atos consumados neste versículo.
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, o termo também pode ser traduzido por “judeus da Judeia”. Aqui, provavelmente se refere aos opositores judeus como grupo, não especificamente a pessoas provenientes da Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mas, quando
  rationale: Introduz um novo acontecimento na narrativa. “Quando” preserva o valor temporal de ὡς, e “mas” representa o contraste leve de δέ com o contexto anterior.
- source_word: ἐγένετο ὁρμὴ
  choice: houve uma tentativa
  rationale: A expressão indica o surgimento de um movimento ou ação hostil. No contexto, “tentativa” comunica que o abuso e o apedrejamento eram ações pretendidas, não declaradas aqui como consumadas.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No contraste com os judeus em Atos, ἔθνη designa os não judeus, e não nações em sentido geopolítico.
- source_word: τε καὶ
  choice: tanto ... como
  rationale: Reproduz a correlação que inclui os dois grupos na ação conjunta.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: Neste contexto, o termo se refere ao grupo de opositores judeus, não especificamente a habitantes da Judeia.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: junto com seus líderes
  rationale: ἄρχοντες designa pessoas com autoridade cívica ou comunitária; “líderes” é claro e natural em português sem especificar uma função não indicada pelo texto.
- source_word: ὑβρίσαι
  choice: de maltratá-los
  rationale: ὑβρίζω abrange tratamento insolente, abusivo ou violento. “Maltratar” mantém essa amplitude sem limitar a ação a insultos verbais.
- source_word: καὶ λιθοβολῆσαι αὐτούς
  choice: e apedrejá-los
  rationale: Traduz diretamente o ato de atacar com pedras, sem acrescentar “até a morte”, resultado que o verbo não explicita por si só.
