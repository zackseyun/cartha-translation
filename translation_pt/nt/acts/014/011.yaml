id: ACT.14.11
reference: Acts 14:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: pt
  text: 'Quando as multidões viram o que Paulo havia feito, levantaram a voz e disseram em língua licaônica[a]: “Os deuses, tornando-se semelhantes a seres humanos[b], desceram até nós!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em licaônico”.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “tendo sido tornados semelhantes a seres humanos”; também se pode traduzir “em forma humana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Quando as multidões viram
  rationale: O particípio aoristo ἰδόντες é naturalmente temporal neste contexto; o plural de ὄχλοι é preservado, e a continuidade narrativa indicada por τε não exige um conectivo explícito em português.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: o que Paulo havia feito
  rationale: O mais-que-perfeito composto esclarece que a ação de Paulo precedeu a reação das multidões e soa natural na narrativa.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: levantaram a voz
  rationale: Preserva a imagem do idioma grego e comunica que falaram em alta voz; o singular coletivo é idiomático em português.
- source_word: Λυκαονιστί
  choice: em língua licaônica
  rationale: Explicita que o advérbio se refere ao idioma falado, sem identificar além do que o texto diz.
- source_word: λέγοντες
  choice: e disseram
  rationale: Integra o particípio de fala à oração principal de maneira fluente, sem intensificação interpretativa desnecessária.
- source_word: Οἱ θεοὶ
  choice: Os deuses
  rationale: Mantém o plural e representa diretamente a interpretação pagã da multidão.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: tornando-se semelhantes a seres humanos
  rationale: Reflete o particípio aoristo passivo de ὁμοιόω e a ideia de semelhança, evitando tanto linguagem excessivamente técnica quanto uma formulação cristológica importada.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: desceram até nós
  rationale: Traduz diretamente o aoristo de καταβαίνω e o movimento expresso por πρὸς, em linguagem natural e vívida.
theological_decisions:
- issue: Representar a interpretação pagã da multidão sem introduzir teologia cristã da encarnação
  choice: Os deuses, tornando-se semelhantes a seres humanos, desceram até nós
  alternative: Os deuses desceram até nós em forma humana
  rationale: A formulação escolhida preserva explicitamente o valor participial e a noção de semelhança em ὁμοιωθέντες, apresentando a crença equivocada da multidão sem transformá-la em afirmação doutrinária cristã.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Seres humanos” expressa o sentido genérico de ἀνθρώποις; “levantaram a voz” mantém a imagem do grego sem soar arcaico.
