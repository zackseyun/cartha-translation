  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: pt
  text: E, em Listra, estava sentado um certo homem, sem força nos pés[a], coxo desde o ventre de sua mãe, que nunca tinha andado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: incapaz de usar os pés. O grego enfatiza primeiro a falta de força ou capacidade e depois afirma explicitamente que ele era coxo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: E
  rationale: Mantém o conectivo narrativo simples que liga esta cena ao contexto anterior.
- source_word: τις ἀνὴρ
  choice: certo homem
  rationale: Preserva tanto a indefinição quanto a referência a um indivíduo específico, embora não identificado.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: sem força nos pés
  rationale: Conserva a ideia básica de falta de força ou capacidade e não a confunde com χωλός, que em seguida declara explicitamente que o homem era coxo.
- source_word: ἐν Λύστροις
  choice: em Listra
  rationale: Emprega a forma consagrada e natural do nome do lugar em português.
- source_word: ἐκάθητο
  choice: estava sentado
  rationale: O imperfeito apresenta uma condição contínua e estabelece a cena.
- source_word: χωλός
  choice: coxo
  rationale: É uma correspondência direta e tradicional para a incapacidade física descrita, sem apagar a formulação distinta que a precede.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: desde o ventre de sua mãe
  rationale: Preserva a expressão concreta do grego, que indica uma condição congênita, em vez de reduzi-la a “desde o nascimento”.
- source_word: οὐδέποτε περιεπάτησεν
  choice: nunca tinha andado
  rationale: O mais-que-perfeito composto expressa naturalmente que, até aquele momento da narrativa, ele jamais havia andado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao grego. “Coxo” e “ventre de sua mãe” preservam a descrição concreta da fonte; “sem força nos pés” mantém a repetição descritiva intencional em vez de fundir as duas expressões.
