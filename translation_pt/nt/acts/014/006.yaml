  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: pt
  text: quando perceberam isso[a], fugiram para as cidades da Licaônia — Listra e Derbe — e para a região ao redor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando se deram conta disso” ou “quando ficaram sabendo disso”. O particípio grego indica que eles tomaram consciência do perigo descrito no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: quando perceberam isso
  rationale: O particípio aoristo de συνοράω indica que eles tomaram consciência da ameaça descrita no versículo anterior. “Perceberam isso” é natural em português e fornece, com base no contexto, o objeto implícito no grego.
- source_word: κατέφυγον
  choice: fugiram
  rationale: καταφεύγω pode incluir a ideia de fugir em busca de refúgio; neste contexto de perigo iminente, “fugiram” expressa de modo direto o movimento urgente.
- source_word: εἰς
  choice: para
  rationale: Com verbo de movimento, εἰς marca o destino; “para” é a forma idiomática em português diante de cidades e regiões.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: as cidades da Licaônia
  rationale: Mantém de forma clara a relação regional do genitivo e introduz naturalmente os nomes das cidades em aposição.
- source_word: Λύστραν καὶ Δέρβην
  choice: Listra e Derbe
  rationale: São as formas tradicionais e reconhecíveis em português para esses topônimos.
- source_word: τὴν περίχωρον
  choice: a região ao redor
  rationale: περίχωρος, usado substantivamente, designa a área circundante. A expressão é clara e suficientemente ampla para abranger os arredores urbanos e rurais.
- source_word: καὶ ... καὶ
  choice: — Listra e Derbe — e para
  rationale: Os travessões deixam claro que “Listra e Derbe” identifica as cidades mencionadas; a repetição de “para” torna natural em português a coordenação com a região circundante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva a dependência contextual de “isso” e usa travessões para sinalizar a aposição dos nomes das cidades.
