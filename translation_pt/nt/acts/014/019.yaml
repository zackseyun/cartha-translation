  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: pt
  text: Mas chegaram judeus de Antioquia e de Icônio e, depois de convencerem as multidões e apedrejarem Paulo, arrastaram-no para fora da cidade, supondo que estivesse morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pensando que ele tinha morrido”. O grego registra a suposição deles, sem afirmar explicitamente que Paulo realmente morreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν
  choice: chegaram
  rationale: O verbo introduz a chegada de opositores vindos de outras cidades. “Chegaram” expressa com naturalidade o deslocamento e a entrada deles na cena.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção assinala uma mudança de rumo com leve contraste em relação à acolhida favorável anterior.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: Em Atos, o termo aqui identifica pessoas judias vindas de Antioquia e Icônio, não especificamente habitantes da Judeia.
- source_word: πείσαντες τοὺς ὄχλους
  choice: depois de convencerem as multidões
  rationale: O particípio aoristo apresenta uma ação anterior à de arrastar Paulo e conserva tanto a sequência quanto a relação causal sem explicá-la em excesso.
- source_word: ὄχλους
  choice: as multidões
  rationale: O plural se refere aos grupos reunidos e é preservado de modo claro e corrente.
- source_word: λιθάσαντες
  choice: apedrejarem Paulo
  rationale: O particípio coordenado com πείσαντες descreve a ação violenta anterior ao ato de arrastá-lo.
- source_word: ἔσυρον
  choice: arrastaram-no
  rationale: Embora o grego use o imperfeito, o pretérito perfeito é a forma narrativa mais natural em português; “arrastaram” comunica claramente a violência da ação.
- source_word: ἔξω τῆς πόλεως
  choice: para fora da cidade
  rationale: A expressão indica o movimento até um lugar exterior aos limites da cidade.
- source_word: νομίζοντες
  choice: supondo
  rationale: A escolha preserva o caráter inferencial da avaliação dos agressores, sem apresentá-la como fato confirmado.
- source_word: τεθνηκέναι
  choice: que estivesse morto
  rationale: O infinitivo perfeito aponta para o estado resultante de morrer; esta formulação portuguesa expressa naturalmente o estado que eles atribuíram a Paulo.
theological_decisions:
- issue: Se Paulo realmente morreu ou se o texto relata apenas a avaliação dos agressores
  choice: “supondo que estivesse morto” relata somente a percepção dos agressores.
  alternative: Alguns entendem que Paulo de fato morreu e depois voltou à vida.
  rationale: O grego afirma explicitamente a suposição deles (νομίζοντες), não a morte efetiva de Paulo. A tradução mantém essa distinção e não resolve além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A próclise foi evitada em “arrastaram-no” para manter fluidez internacional sem tornar o texto excessivamente formal.
