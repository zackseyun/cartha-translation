  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: pt
  text: Mas os judeus que se recusaram a crer incitaram os gentios e envenenaram a mente deles contra os irmãos[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que foram desobedientes”. O grego pode indicar recusa em crer na mensagem e, neste contexto, provavelmente se refere à rejeição do evangelho.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as almas deles”; aqui, o sentido é a disposição interior ou a atitude deles.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “irmãos” provavelmente se refere aos demais fiéis em geral, incluindo as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: que se recusaram a crer
  rationale: No contexto da pregação apostólica, o particípio expressa rejeição deliberada da mensagem, embora também possa significar desobediência.
- source_word: Ἰουδαῖοι
  choice: os judeus
  rationale: Tradução direta; o contexto restringe a referência ao grupo local que se opôs à mensagem, não ao povo judeu em geral.
- source_word: ἐπήγειραν
  choice: incitaram
  rationale: Expressa de modo natural a ação de provocar hostilidade contra os cristãos.
- source_word: ἐκάκωσαν
  choice: envenenaram
  rationale: Com 'a mente' como objeto e 'contra' indicando o alvo, comunica figuradamente a corrupção hostil da disposição interior.
- source_word: τὰς ψυχὰς
  choice: a mente deles
  rationale: Neste contexto, ψυχαί se refere à disposição interior ou atitude, não exige uma afirmação antropológica técnica.
- source_word: τῶν ἐθνῶν
  choice: os gentios
  rationale: No contraste judaico do relato de Atos, designa os não judeus.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: contra os irmãos
  rationale: Mantém a forma masculina plural do grego; no uso comunitário cristão, pode abranger todos os fiéis.
theological_decisions:
- issue: Sentido de ἀπειθήσαντες diante da mensagem apostólica
  choice: que se recusaram a crer
  alternative: que foram desobedientes
  rationale: A formulação escolhida explicita a rejeição deliberada da mensagem sugerida pelo contexto, enquanto a nota preserva a amplitude lexical ligada à desobediência.
- issue: Referência comunitária de ἀδελφῶν
  choice: os irmãos
  alternative: os irmãos e as irmãs; os fiéis
  rationale: A tradução principal conserva a forma masculina do original, e a nota esclarece seu provável alcance coletivo, sem limitar a referência apenas a homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a sequência e o contraste do grego, mas verte idiomaticamente a expressão relativa à disposição interior.
