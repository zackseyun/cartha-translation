id: ACT.14.26
reference: Acts 14:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: pt
  text: E dali navegaram para Antioquia, de onde haviam sido confiados à graça de Deus para a obra que tinham concluído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haviam levado a cabo”.'
    reason: Registra uma tradução alternativa de ἐπλήρωσαν, que aqui expressa a ideia de completar ou realizar plenamente a obra.
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: E dali
  rationale: Preserva tanto a ligação narrativa de καί quanto a referência espacial de ἐκεῖθεν em português natural.
- source_word: ἀπέπλευσαν
  choice: navegaram
  rationale: O verbo indica partida por mar; no contexto, “navegaram” expressa isso de modo claro e idiomático, sem exigir a explicitação redundante de “partiram navegando”.
- source_word: εἰς Ἀντιόχειαν
  choice: para Antioquia
  rationale: Com verbo de movimento, εἰς indica naturalmente o destino; “Antioquia” é a forma portuguesa consagrada do topônimo.
- source_word: ὅθεν
  choice: de onde
  rationale: Retém explicitamente a ideia de origem presente no advérbio relativo, identificando Antioquia como o lugar do qual haviam sido anteriormente enviados ou confiados.
- source_word: ἦσαν παραδεδομένοι
  choice: haviam sido confiados
  rationale: A construção perifrástica comunica uma ação anterior ao retorno. “Confiados” preserva o sentido de serem entregues aos cuidados de outro sem impor terminologia eclesiástica específica.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: à graça de Deus
  rationale: Mantém a construção dativa e o peso teológico da expressão grega, sem substituir “graça” por uma paráfrase interpretativa.
- source_word: εἰς τὸ ἔργον
  choice: para a obra
  rationale: “Obra” é a correspondência direta e contextual para ἔργον, deixando que o contexto defina a natureza do trabalho.
- source_word: ὃ ἐπλήρωσαν
  choice: que tinham concluído
  rationale: Neste contexto, πληρόω indica levar a obra até o fim. “Concluído” comunica claramente a realização completa, enquanto a nota registra uma alternativa mais formal.
theological_decisions:
- issue: Natureza da ação anterior da comunidade em relação a Paulo e Barnabé
  choice: haviam sido confiados à graça de Deus
  alternative: haviam sido entregues à graça de Deus
  rationale: “Confiados” expressa que eles foram postos sob a graça e o cuidado de Deus para a obra, sem transformar o texto numa fórmula denominacional de ordenação ou comissionamento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva “de onde” e “à graça de Deus” para refletir de perto as relações do grego, mas usa “confiados” e “concluído” para manter naturalidade.
