  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: pt
  text: 'Mas, quando os apóstolos Barnabé e Paulo souberam, rasgaram as vestes[a], lançaram-se para o meio da multidão[b] e gritaram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as vestes era um sinal habitual de pesar, horror ou protesto contra uma honra considerada blasfema.
    reason: cultural_note
  - marker: b
    text: 'Ou: saltaram para o meio da multidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quando ... souberam disso
  rationale: O particípio aoristo tem valor temporal e indica a reação ao que estava acontecendo; “souberam disso” retoma naturalmente a tentativa de lhes oferecer sacrifícios.
- source_word: δὲ
  choice: Mas
  rationale: Marca a mudança contrastante entre a ação da multidão e a reação dos apóstolos.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: os apóstolos Barnabé e Paulo
  rationale: Mantém a aposição grega, que identifica diretamente Barnabé e Paulo como apóstolos neste contexto, e usa as formas portuguesas tradicionais dos nomes.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: rasgaram as próprias vestes
  rationale: Preserva o gesto concreto de rasgar as roupas como expressão intensa de horror, pesar ou protesto; “vestes” mantém um registro digno e amplamente compreensível.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: lançaram-se para o meio da multidão
  rationale: Expressa o movimento súbito e enérgico em direção à multidão sem acrescentar um ponto de partida não explicitado pelo grego.
- source_word: κράζοντες
  choice: e gritaram
  rationale: O particípio presente descreve a fala alta que acompanha o movimento; a coordenação é natural em português e introduz diretamente as palavras do versículo seguinte.
theological_decisions:
- issue: Aplicação do título “apóstolos” a Barnabé e Paulo
  choice: Manter “os apóstolos Barnabé e Paulo” sem explicação doutrinária no texto principal.
  alternative: Reformular como “Barnabé e Paulo, os apóstolos” ou interpretar “apóstolos” apenas como “mensageiros”.
  rationale: A aposição grega identifica ambos pelo termo ἀπόστολοι neste contexto. A tradução preserva essa afirmação sem restringir nem ampliar doutrinariamente o alcance do título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a sequência e a intensidade do grego, usando dois-pontos porque a fala direta continua no versículo seguinte.
