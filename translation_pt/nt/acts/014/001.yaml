  verdict: revise
  source_fidelity: O texto principal transmite com precisão a ação conjunta, a entrada na sinagoga, a fala e o resultado de muitos judeus e gregos crerem. A regência portuguesa idiomática «entraram ... na sinagoga» expressa adequadamente o movimento de entrada. Contudo, a nota afirma que o grego diz literalmente «na sinagoga», quando εἰς indica movimento para dentro/para; essa caracterização precisa ser corrigida.
  naturalness: A redação é moderna, clara e natural para leitores brasileiros e internacionais. «Uma grande multidão, tanto de judeus como de gregos, creu» é gramatical e deixa claro que os dois grupos compõem a multidão.
  terminology: «Icônio», «sinagoga», «judeus», «gregos» e «creu» são adequados, consistentes e não introduzem especificações teológicas ausentes do grego.
  issues:
  - severity: low
    issue: A explicação da nota de rodapé chama «na sinagoga dos judeus» de formulação literal do grego.
    rationale: O texto grego tem εἰς, isto é, «para dentro da/à sinagoga dos judeus». Embora «entrar na sinagoga» seja a forma idiomática correta no texto português, a nota deve distinguir essa adaptação de regência da expressão literal.
  revised_text: Em Icônio, os dois entraram juntos na sinagoga dos judeus e falaram de tal maneira que uma grande multidão, tanto de judeus como de gregos, creu.[a]
