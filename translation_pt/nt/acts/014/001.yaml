  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: pt
  text: Em Icônio, os dois entraram juntos na sinagoga dos judeus e falaram de tal maneira que uma grande multidão, tanto de judeus como de gregos, creu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na sinagoga judaica”. O grego diz literalmente: “para dentro da sinagoga dos judeus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[não expresso separadamente]'
  rationale: A construção introduz o acontecimento e funciona como transição narrativa. Em português, a frase finita iniciada por “Em Icônio” transmite isso naturalmente, sem acrescentar um “então” ou “ora” que não corresponde a uma palavra temporal explícita.
- source_word: ἐν Ἰκονίῳ
  choice: Em Icônio
  rationale: Tradução locativa direta, com a forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: κατὰ τὸ αὐτό
  choice: juntos
  rationale: No contexto, a expressão indica a ação conjunta de Paulo e Barnabé. “Juntos” é natural e preserva esse sentido.
- source_word: εἰσελθεῖν αὐτούς
  choice: os dois entraram
  rationale: O infinitivo dependente da construção narrativa é convertido naturalmente em verbo finito. “Os dois” torna explícito que o pronome plural retoma Paulo e Barnabé, sem repetir seus nomes.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: na sinagoga dos judeus
  rationale: Preserva explicitamente o genitivo “dos judeus”. Com o verbo “entrar”, “na” é a regência corrente no português brasileiro, embora “entraram na” corresponda semanticamente ao movimento para dentro.
- source_word: λαλῆσαι
  choice: falaram
  rationale: Tradução direta e não interpretativa do ato de falar; o conteúdo proclamado não é explicitado neste versículo.
- source_word: οὕτως ὥστε
  choice: de tal maneira que
  rationale: Mantém tanto a ideia de modo quanto o resultado produzido, sem reduzir a construção a uma simples finalidade.
- source_word: πιστεῦσαι
  choice: creu
  rationale: O singular concorda com o núcleo coletivo “multidão” e traduz diretamente o verbo πιστεύω, sem explicitar um objeto que o grego deixa implícito.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: tanto de judeus como de gregos
  rationale: Reproduz a correlação τε καὶ e identifica os dois grupos que compunham a multidão.
- source_word: πολὺ πλῆθος
  choice: uma grande multidão
  rationale: Preserva a ênfase no elevado número de pessoas e a imagem coletiva de πλῆθος em linguagem digna e compreensível.
theological_decisions:
- issue: Sentido de πιστεῦσαι no relato da resposta à pregação
  choice: creu
  alternative: passou a crer; veio à fé; creu na mensagem
  rationale: O texto relata a resposta dos ouvintes sem declarar expressamente o objeto da fé. “Creu” mantém a formulação concisa e a abertura do grego, evitando acrescentar “na mensagem” ou uma descrição teológica mais desenvolvida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com naturalidade brasileira. A ordem foi levemente ajustada em “uma grande multidão, tanto de judeus como de gregos” para evitar ambiguidade e manter claro que ambos os grupos formavam a multidão. O marcador de nota [a] aparece no texto principal.
