  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: pt
  text: Contudo, ele não deixou de dar testemunho de si mesmo[a], fazendo o bem, dando a vocês chuvas do céu e tempos frutíferos[b], enchendo os corações de vocês[c] de alimento e alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem testemunho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estações que produzem fruto”.'
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos trazem “nossos corações”; o SBLGNT traz “os corações de vocês”.
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Contudo
  rationale: 'Expressa de modo natural a força concessiva: apesar de Deus ter permitido que as nações seguissem seus próprios caminhos, não ficou sem dar testemunho de si.'
- source_word: ἀμάρτυρον
  choice: sem testemunho
  rationale: Preserva a nuance testemunhal do adjetivo grego, sem ampliar o sentido para a noção mais genérica de mera evidência.
- source_word: αὑτὸν
  choice: a si mesmo
  rationale: Mantém a forma reflexiva e indica que Deus deu testemunho acerca de si próprio.
- source_word: ἀφῆκεν
  choice: não deixou
  rationale: Reproduz o sentido contextual de deixar alguém ou algo permanecer em determinada condição.
- source_word: ἀγαθουργῶν
  choice: pois fez o bem
  rationale: Comunica a ação beneficente de Deus e torna explícita, de modo natural em português, a relação explicativa do particípio com a oração anterior.
- source_word: οὐρανόθεν
  choice: do céu
  rationale: Conserva o idioma bíblico e a origem divina das chuvas, embora no contexto também possa referir-se ao céu visível.
- source_word: ὑετοὺς
  choice: chuvas
  rationale: Mantém o plural grego, que sugere chuvas repetidas e sazonais.
- source_word: διδοὺς
  choice: dando
  rationale: Preserva o particípio que descreve como Deus praticou o bem.
- source_word: καιροὺς καρποφόρους
  choice: tempos frutíferos
  rationale: Mantém o sentido de períodos ou estações que produzem fruto, sem restringir indevidamente a expressão às quatro estações do ano.
- source_word: ἐμπιπλῶν
  choice: enchendo
  rationale: Reproduz diretamente a ação contínua de encher ou satisfazer plenamente.
- source_word: τροφῆς
  choice: alimento
  rationale: É uma tradução clara e digna para comida ou sustento.
- source_word: εὐφροσύνης
  choice: alegria
  rationale: Expressa em português atual a satisfação jubilosa indicada pelo termo grego.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração de vocês
  rationale: Preserva a leitura do SBLGNT, com pronome de segunda pessoa plural, em português natural e amplamente compreensível.
theological_decisions:
- issue: Natureza do testemunho de Deus no versículo
  choice: Deus dá testemunho de si por meio de sua bondade providencial na criação
  alternative: O versículo descreve apenas processos naturais impessoais, sem implicação teológica
  rationale: A expressão reflexiva “a si mesmo”, combinada com “sem testemunho” e com as ações divinas de dar chuvas, fecundidade, alimento e alegria, apresenta essas dádivas como testemunho acerca de Deus, sem desenvolver além do texto uma doutrina mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Vocês” representa claramente a segunda pessoa plural; “tempos frutíferos” evita a possível leitura moderna restrita de “estações”. Os marcadores foram colocados imediatamente após as expressões correspondentes.
