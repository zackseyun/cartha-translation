  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: pt
  text: Mas, depois que os discípulos se reuniram ao redor dele[a], ele se levantou[b] e entrou na cidade. No dia seguinte, saiu com Barnabé para Derbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cercaram” ou “formaram um círculo ao redor dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “se ergueu”. O grego admite essa tradução, mas aqui provavelmente se refere ao ato físico de Paulo se levantar, sem descrever explicitamente uma ressurreição.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: se reuniram ao redor
  rationale: O particípio aoristo de κυκλόω expressa a ação de cercar ou formar um círculo ao redor. Em português atual, “reuniram-se ao redor” preserva a imagem sem sugerir hostilidade.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao apedrejamento e ao abandono de Paulo como morto no versículo anterior.
- source_word: τῶν μαθητῶν
  choice: os discípulos
  rationale: Tradução consagrada e coerente de μαθητής no livro de Atos.
- source_word: ἀναστὰς
  choice: ele se levantou
  rationale: Neste contexto, descreve naturalmente a ação física de Paulo levantar-se, sem afirmar de modo explícito ressurreição ou reanimação milagrosa.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: entrou na cidade
  rationale: Expressa com clareza e naturalidade o movimento indicado por εἰσέρχομαι seguido de εἰς.
- source_word: τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Equivalente português natural da expressão temporal dativa.
- source_word: ἐξῆλθεν
  choice: partiu
  rationale: No contexto de uma viagem com destino declarado, “partiu” comunica naturalmente a saída, embora o verbo grego signifique literalmente “saiu”.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: com Barnabé
  rationale: Traduz de forma direta a ideia de acompanhamento expressa por σύν com o dativo.
- source_word: Δέρβην
  choice: Derbe
  rationale: Forma tradicional do topônimo em português.
theological_decisions:
- issue: Se ἀναστὰς deve sugerir ressurreição ou recuperação milagrosa
  choice: ele se levantou
  alternative: ele ressurgiu; foi levantado
  rationale: Embora a recuperação após o apedrejamento seja extraordinária, o particípio pode designar simplesmente o ato físico de levantar-se. A tradução evita acrescentar uma afirmação milagrosa que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem narrativa foi mantida; “se reuniram ao redor” evita a possível conotação hostil de “cercaram”, e “partiu” torna natural em português o movimento de saída rumo a Derbe.
