lexical_decisions:
- source_word: διέτριβον
  choice: permaneceram
  rationale: O imperfeito de διατρίβω indica uma permanência continuada; “permaneceram” é natural e digno em português e preserva o sentido durativo.
- source_word: δὲ
  choice: E
  rationale: δέ funciona como conectivo narrativo leve; “E” mantém a continuidade simples do relato.
- source_word: χρόνον οὐκ ὀλίγον
  choice: por não pouco tempo
  rationale: A formulação conserva a litotes grega, isto é, a afirmação de uma duração considerável por meio da negação do contrário, sem eliminar seu efeito retórico.
- source_word: σὺν τοῖς μαθηταῖς
  choice: com os discípulos
  rationale: σύν com o dativo significa diretamente “com”; no contexto, “os discípulos” designa naturalmente a comunidade local dos que criam.
