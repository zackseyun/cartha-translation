  text: E permaneceram com os discípulos por bastante tempo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por não pouco tempo”. O grego usa uma litotes, isto é, expressa uma duração considerável pela negação do contrário.
