id: ACT.14.22
reference: Acts 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: pt
  text: fortalecendo os discípulos, encorajando-os a permanecer na fé e dizendo que, por muitas aflições, devemos entrar no reino de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: fortalecendo
  rationale: O particípio presente descreve a ação contínua de tornar firmes os discípulos; “fortalecendo” é natural e preserva o sentido sem sugerir um estabelecimento formal.
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: os discípulos em seu íntimo
  rationale: ψυχή aqui aponta para a pessoa em sua dimensão interior. A formulação evita um dualismo indevido e soa mais natural em português do que “fortalecendo as almas dos discípulos”.
- source_word: παρακαλοῦντες
  choice: encorajando-os
  rationale: No contexto, o verbo combina apoio e exortação. “Encorajando” comunica ambos de modo acessível.
- source_word: ἐμμένειν τῇ πίστει
  choice: permanecer na fé
  rationale: ἐμμένω expressa continuidade firme, e o artigo em τῇ πίστει favorece a referência definida à fé compartilhada pelos discípulos.
- source_word: διὰ πολλῶν θλίψεων
  choice: por muitas aflições
  rationale: A preposição διά com genitivo indica o percurso ou meio pelo qual se passa; θλῖψις designa pressão, sofrimento ou tribulação. “Aflições” preserva a gravidade com linguagem atual.
- source_word: δεῖ ἡμᾶς
  choice: é necessário que passemos
  rationale: A construção impessoal exprime necessidade. Em português, “é necessário que” preserva sua força e liga naturalmente a necessidade ao percurso pelas aflições.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: entrar no Reino de Deus
  rationale: “Entrar no” é a construção idiomática em português e preserva a imagem de ingresso no reino, sem tornar βασιλεία apenas uma noção abstrata de governo.
theological_decisions:
- issue: Sentido de πίστις com artigo
  choice: na fé
  alternative: em fé
  rationale: O artigo grego favorece uma referência definida à fé na qual os discípulos devem permanecer, sem exigir que o termo seja entendido como uma formulação doutrinária técnica posterior.
- issue: Força de δεῖ e relação das aflições com a entrada no Reino
  choice: É necessário que passemos por muitas aflições para entrar no Reino de Deus
  alternative: Temos de entrar no Reino de Deus por meio de muitas aflições
  rationale: A tradução mantém a necessidade afirmada no texto e a ligação entre aflições e entrada, mas não especifica se as aflições são causa meritória, condição salvífica ou apenas o caminho esperado dos discípulos.
- issue: Inclusão de ἡμᾶς
  choice: passemos
  alternative: vocês passem
  rationale: A primeira pessoa do plural inclui os próprios mensageiros com os discípulos e deve ser preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para produzir uma frase natural. As palavras introduzidas após “dizendo” aparecem entre aspas como discurso direto; a pontuação não pretende resolver se a declaração foi pronunciada exatamente nessa forma ou resume a exortação.
