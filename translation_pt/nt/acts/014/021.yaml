source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: pt
  text: Depois de anunciarem as boas-novas naquela cidade e fazerem muitos discípulos, voltaram para Listra, para Icônio e para Antioquia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Depois de anunciarem as boas-novas
  rationale: O particípio aoristo expressa ação anterior ao verbo principal. “Anunciar as boas-novas” comunica de modo claro e natural o sentido evangelístico de εὐαγγελίζω.
- source_word: τε
  choice: incorporado na ligação da frase
  rationale: A partícula liga levemente esta oração ao contexto anterior; em português, a fluidez é melhor preservada sem acrescentar uma conjunção antes de “Depois”.
- source_word: τὴν πόλιν ἐκείνην
  choice: naquela cidade
  rationale: Tradução direta do demonstrativo, que retoma Derbe no contexto.
- source_word: μαθητεύσαντες
  choice: fazerem ... discípulos
  rationale: Preserva o sentido causativo de levar pessoas a se tornarem discípulos, em formulação corrente e inteligível.
- source_word: ἱκανοὺς
  choice: muitos
  rationale: Neste contexto, ἱκανός indica um número considerável de pessoas; “muitos” é conciso e natural.
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: Expressa diretamente o retorno indicado pelo verbo aoristo.
- source_word: εἰς τὴν Λύστραν
  choice: para Listra
  rationale: A preposição indica destino; “para” é a equivalência natural em português.
- source_word: εἰς Ἰκόνιον
  choice: para Icônio
  rationale: Mantém a preposição repetida e usa a forma portuguesa corrente do topônimo.
- source_word: εἰς Ἀντιόχειαν
  choice: para Antioquia
  rationale: Mantém a sequência explícita dos destinos e usa a forma portuguesa tradicional do topônimo.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “para” preserva o ritmo e a clareza geográfica do grego. Não se incluiu nota, pois a alternativa inglesa fornecida parece estar associada ao marcador errado: ela explica εὐαγγελίζω, não μαθητεύω; a tradução portuguesa já torna ambos os verbos claros.'
