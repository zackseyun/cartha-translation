  text: ὃς καὶ τὸ ἱερὸν ἐπείρασεν βεβηλῶσαι, ὃν καὶ ⸀ἐκρατήσαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: pt
  text: Ele até tentou profanar o templo[a], e nós o prendemos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos acrescentam aqui uma leitura mais longa, dizendo, entre outras coisas, que eles queriam julgar Paulo segundo a lei deles e que o comandante Lísias o tirou de suas mãos.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Ele
  rationale: O pronome relativo retoma Paulo. Como o versículo constitui um fragmento da acusação em curso, «Ele» produz uma retomada natural em português sem alterar o referente.
- source_word: καὶ
  choice: até
  rationale: 'Neste contexto acusatório, καὶ intensifica a afirmação: Paulo teria chegado ao ponto de tentar profanar o templo.'
- source_word: τὸ ἱερὸν
  choice: o templo
  rationale: Ἱερόν designa aqui o complexo do templo, não especificamente o santuário interior. «O templo» é a forma corrente e suficientemente abrangente em português.
- source_word: ἐπείρασεν
  choice: tentou
  rationale: O aoristo de πειράζω, seguido do infinitivo, expressa tentativa. «Tentou» é direto e natural.
- source_word: βεβηλῶσαι
  choice: profanar
  rationale: Βεβηλόω significa tornar profano ou violar a santidade de algo. «Profanar» comunica com precisão a acusação referente ao templo e é claro no uso religioso corrente.
- source_word: ὃν
  choice: o
  rationale: O pronome relativo acusativo retoma Paulo como objeto. Na construção portuguesa, o pronome oblíquo «o» é a retomada natural.
- source_word: ἐκρατήσαμεν
  choice: prendemos
  rationale: Κρατέω pode significar agarrar, deter ou prender. Neste contexto de captura, «prendemos» é idiomático e preserva a ideia de terem tomado Paulo sob controle, sem exigir a formalidade jurídica de «prendemos legalmente».
theological_decisions:
- issue: Forma textual de Atos 24:6 em relação à leitura bizantina mais longa
  choice: Traduzir somente a cláusula do SBLGNT, terminando em «e nós o prendemos,»
  alternative: Alguns manuscritos acrescentam que pretendiam julgá-lo segundo a lei deles e que o comandante Lísias o tirou de suas mãos; a redação varia entre as tradições textuais.
  rationale: A tradução segue exatamente o texto grego fornecido, que apresenta a leitura crítica mais curta. A leitura mais longa é registrada em nota para não ser incorporada silenciosamente ao texto principal nem ocultada dos leitores que a conhecem de outras tradições.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Até tentou» conserva a intensificação da acusação; «profanar» mantém o teor religioso de βεβηλόω. A vírgula final reflete a continuação sintática no contexto e a forma curta do texto crítico.
