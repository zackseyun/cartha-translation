base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: pt
  text: Em todos os aspectos e em todos os lugares, reconhecemos isto[a], excelentíssimo Félix, com toda gratidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aceitamos isto» ou «acolhemos isto». O verbo grego pode ter o sentido de aceitar ou acolher, mas aqui provavelmente indica o reconhecimento público dos benefícios atribuídos a Félix.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: de todas as maneiras
  rationale: Expressa abrangência quanto ao modo ou aspecto, em paralelo com o alcance espacial de πανταχοῦ, sem introduzir uma ideia primariamente temporal.
- source_word: τε καὶ
  choice: e
  rationale: Liga naturalmente em português as duas expressões correlatas, πάντῃ e πανταχοῦ.
- source_word: πανταχοῦ
  choice: em todos os lugares
  rationale: Preserva o sentido locativo abrangente e soa natural no registro formal da fala.
- source_word: ἀποδεχόμεθα
  choice: reconhecemos isso
  rationale: No contexto da argumentação elogiosa diante de Félix, o verbo pode indicar aceitar, acolher ou reconhecer publicamente os benefícios alegados. A tradução mantém um objeto implícito recuperado do versículo anterior.
- source_word: κράτιστε
  choice: excelentíssimo
  rationale: É um tratamento honorífico adequado para uma autoridade elevada e corresponde ao superlativo grego sem recorrer à paráfrase 'Vossa Excelência'.
- source_word: Φῆλιξ
  choice: Félix
  rationale: Emprega a forma portuguesa tradicional do nome próprio.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: com toda a gratidão
  rationale: Conserva tanto a atitude de agradecimento quanto a força abrangente de πάσης, em português atual e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, formal e compreensível, apropriado ao discurso forense e elogioso dirigido a uma autoridade. A formulação conserva o paralelismo abrangente do grego e a ambiguidade lexical relevante de ἀποδεχόμεθα por meio da nota.
