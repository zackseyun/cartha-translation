  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: pt
  text: E não me encontraram no templo[a] discutindo com ninguém, nem fazendo uma multidão se reunir[b], nem nas sinagogas nem pela cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debatendo com alguém” ou “conversando com alguém”. O verbo grego pode indicar conversa argumentativa ou debate; neste contexto, também pode ter um sentido contencioso.
    reason: lexical_alternative
  - marker: b
    text: Ou “causando uma aglomeração de pessoas”. A expressão grega pode referir-se a fazer uma multidão se reunir ou a causar uma perturbação pública, sem necessariamente indicar um motim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: templo
  rationale: Em Atos, ἱερόν normalmente designa o complexo do templo, não especificamente o santuário interior. “Templo” é a forma natural em português.
- source_word: εὗρόν με
  choice: me encontraram
  rationale: 'Preserva a formulação forense de Paulo: seus acusadores não o surpreenderam praticando os atos alegados.'
- source_word: πρός τινα διαλεγόμενον
  choice: discutindo com ninguém
  rationale: διαλέγομαι pode indicar conversar, argumentar ou debater. Neste contexto de acusação de agitação pública, “discutindo” mantém tanto a possibilidade de debate quanto o tom potencialmente contencioso.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: provocando a aglomeração de uma multidão
  rationale: A expressão indica fazer uma multidão se ajuntar ou causar um tumulto coletivo, sem exigir a ideia mais forte de motim. A formulação escolhida preserva essa amplitude.
- source_word: ὄχλου
  choice: uma multidão
  rationale: O substantivo é anartro e não requer a noção mais violenta de “turba”; “uma multidão” é natural e semanticamente sóbrio.
- source_word: συναγωγαῖς
  choice: sinagogas
  rationale: Equivalente padrão e claro para συναγωγή neste contexto.
- source_word: κατὰ τὴν πόλιν
  choice: em qualquer parte da cidade
  rationale: κατά com acusativo tem sentido distributivo aqui, negando que tais ações tenham ocorrido em lugar algum da cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção correlativa “quer... quer...” conserva o alcance da negação sobre as sinagogas e toda a cidade.
