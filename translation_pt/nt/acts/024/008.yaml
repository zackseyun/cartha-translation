  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: pt
  text: O senhor mesmo, ao interrogá-lo, poderá obter dele informações sobre todas estas coisas de que nós o acusamos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Depois de interrogá-lo, o próprio senhor poderá apurar dele tudo a respeito destas coisas de que nós o acusamos.”'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos acrescentam, no versículo 7, uma frase dizendo que o comandante Lísias tirou Paulo dali à força e ordenou que os acusadores comparecessem diante de Félix. O texto do SBLGNT não inclui essa frase.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: por meio dele
  rationale: παρά com o genitivo indica aqui a fonte da informação. “Por meio dele” deixa claro, em português natural, que Félix poderia obter do próprio Paulo os esclarecimentos.
- source_word: δυνήσῃ
  choice: o senhor poderá
  rationale: O futuro de δύναμαι expressa capacidade futura. “Poderá” preserva esse valor, e “o senhor” torna explícito o tratamento respeitoso dirigido ao governador sem recorrer ao ambíguo “você”.
- source_word: αὐτὸς
  choice: pessoalmente
  rationale: O pronome é enfático e destaca que o próprio Félix faria o interrogatório. “Pessoalmente” transmite essa ênfase com naturalidade.
- source_word: ἀνακρίνας
  choice: Ao interrogá-lo
  rationale: Em contexto judicial, ἀνακρίνω pode significar examinar ou interrogar. Como a informação seria obtida do acusado, “interrogar” comunica claramente a ação forense, sem excluir uma investigação formal.
- source_word: περὶ πάντων τούτων
  choice: tudo aquilo
  rationale: A expressão se refere ao conjunto das acusações já apresentado. “Tudo aquilo” é corrente e conserva a abrangência de πάντων.
- source_word: ἐπιγνῶναι
  choice: saber
  rationale: O infinitivo significa chegar a saber, conhecer ou averiguar. “Saber” é simples e natural; no contexto, implica tomar conhecimento mediante o interrogatório.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: aquilo de que nós o acusamos
  rationale: A formulação preserva o complemento regido por “acusar de” e mantém o pronome explícito “nós”, correspondente ao enfático ἡμεῖς.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar a construção truncada “dele, interrogando-o” e tornar inequívoco que Paulo é interrogado e serve de fonte da informação. O tratamento “o senhor” é respeitoso e adequado ao governador.
