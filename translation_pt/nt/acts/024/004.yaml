  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: pt
  text: Mas, para não lhe tomar mais tempo, rogo que, em sua benevolência, nos ouça brevemente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Mas, para não
  rationale: Mantém a transição levemente adversativa de δέ e a finalidade negativa expressa por ἵνα μή, em português natural.
- source_word: ἐπὶ πλεῖόν
  choice: mais tempo
  rationale: No contexto da audiência, a expressão idiomática indica prolongamento ou uso adicional do tempo do governador.
- source_word: σε ἐγκόπτω
  choice: lhe tomar ... tempo
  rationale: ἐγκόπτω pode significar impedir, dificultar ou deter. Aqui, a formulação idiomática explicita que o orador não quer ocupar ainda mais o tempo do governador, sem sugerir prisão, sentido que “deter” poderia evocar neste contexto jurídico.
- source_word: παρακαλῶ
  choice: rogo
  rationale: Expressa uma súplica cortês e formal, adequada à retórica forense, sem soar tão coloquial quanto “peço” nem excessivamente emotiva.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: que ... nos ouça
  rationale: Reproduz diretamente o pedido para que o governador escute os acusadores, com sintaxe portuguesa corrente.
- source_word: συντόμως
  choice: brevemente
  rationale: Conserva a ideia de brevidade da exposição ou do tempo requerido.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: por sua benevolência
  rationale: Transmite o apelo deferente à consideração bondosa, moderada e indulgente do governador. A amplitude jurídica e ética de ἐπιείκεια é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tom formal apropriado a uma audiência judicial. “Rogo” preserva a deferência do discurso; “lhe tomar mais tempo” evita a possível leitura policial ou carcerária de “deter” em português.
