  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: pt
  text: Ou que estes homens digam eles mesmos que delito encontraram em mim quando compareci diante do conselho[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante do Sinédrio”. O termo grego συνέδριον se refere ao conselho judaico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz a alternativa seguinte na defesa de Paulo de modo direto e natural.
- source_word: αὐτοὶ οὗτοι
  choice: estes homens mesmos
  rationale: Preserva tanto a referência demonstrativa quanto a ênfase do pronome αὐτοί.
- source_word: εἰπάτωσαν
  choice: que ... digam
  rationale: Expressa naturalmente em português o imperativo de terceira pessoa usado no desafio retórico.
- source_word: τί εὗρον
  choice: que ... encontraram
  rationale: Mantém a pergunta pelo delito específico que os presentes teriam constatado.
- source_word: ἀδίκημα
  choice: delito
  rationale: Adequa-se ao contexto judicial sem limitar o sentido necessariamente a um crime de categoria técnica.
- source_word: στάντος μου
  choice: quando compareci
  rationale: Transmite o valor temporal do particípio e, no contexto jurídico, soa mais natural do que a tradução literal 'quando fiquei em pé'.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: diante do Conselho
  rationale: Indica a apresentação de Paulo perante o conselho judaico; a inicial maiúscula sinaliza a instituição específica, explicada em nota.
