  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: pt
  text: Nessas circunstâncias[a], encontraram-me purificado no templo, sem estar com uma multidão nem em meio a tumulto,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «nas quais me encontraram purificado no templo» ou «durante as quais me encontraram purificado no templo». A expressão grega ἐν αἷς é uma relativa plural que retoma os acontecimentos mencionados anteriormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: Foi nessas circunstâncias que
  rationale: A expressão relativa retoma os acontecimentos mencionados anteriormente. Esta formulação torna a referência anafórica natural em português, enquanto a nota preserva a possibilidade de uma tradução mais formal.
- source_word: εὗρόν με
  choice: me encontraram
  rationale: 'Expressa de modo idiomático o sentido narrativo de εὑρίσκω: os acusadores de Paulo o encontraram no recinto do templo.'
- source_word: ἡγνισμένον
  choice: purificado
  rationale: O particípio perfeito passivo indica um estado resultante de purificação ritual; «purificado» preserva o sentido cultual sem ampliá-lo no corpo do texto.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo do templo, e «templo» é a tradução corrente e natural em português.
- source_word: οὐ μετὰ ὄχλου
  choice: sem multidão
  rationale: Mantém a negação de que Paulo estivesse acompanhado por uma multidão, com formulação concisa e adequada à sua defesa.
- source_word: οὐδὲ μετὰ θορύβου
  choice: e sem tumulto
  rationale: θόρυβος denota barulho, agitação ou desordem pública; «tumulto» transmite bem o sentido forense do contexto.
