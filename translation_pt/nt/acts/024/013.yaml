source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸀παραστῆσαι δύνανταί ⸀σοι περὶ ὧν ⸀νυνὶ κατηγοροῦσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: pt
  text: Também não podem provar diante de você as coisas de que agora me acusam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apresentar diante de você” ou “demonstrar a você”; o verbo grego pode significar apresentar ou estabelecer algo, aqui no sentido de fundamentar uma acusação judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Também não
  rationale: Dá continuidade, de modo natural em português, à negativa da defesa de Paulo no versículo anterior.
- source_word: παραστῆσαι
  choice: provar
  rationale: Embora o verbo possa significar apresentar ou demonstrar, no contexto judicial indica comprovar ou fundamentar uma acusação.
- source_word: δύνανταί
  choice: podem
  rationale: Expressa diretamente a capacidade negada pelo texto grego.
- source_word: σοι
  choice: diante de você
  rationale: Mantém a referência a Félix e comunica naturalmente o cenário judicial; 'a você' também seria possível.
- source_word: περὶ ὧν
  choice: as coisas de que
  rationale: Conserva o referente relativamente amplo do grego sem introduzir explicitamente 'acusações' como substantivo.
- source_word: νυνὶ
  choice: agora
  rationale: Reproduz o advérbio temporal que situa as acusações no processo em curso.
- source_word: κατηγοροῦσίν μου
  choice: me acusam
  rationale: Verte de forma clara e concisa o verbo jurídico e o pronome que identifica Paulo como alvo da acusação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A formulação preserva o caráter judicial do contexto sem recorrer a linguagem técnica excessiva.
