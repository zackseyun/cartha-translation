  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: pt
  text: 'Quando Paulo foi chamado, Tértulo começou a acusá-lo, dizendo: “Por meio de ti desfrutamos de muita paz, e, graças à tua prudente administração, melhorias[a] estão sendo realizadas em benefício desta nação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reformas” ou “medidas corretivas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Quando Paulo foi chamado
  rationale: O genitivo absoluto introduz a circunstância da ação principal. Explicitar Paulo elimina uma ambiguidade pronominal pouco natural em português sem alterar o referente contextual.
- source_word: ἤρξατο κατηγορεῖν
  choice: começou a acusá-lo
  rationale: Preserva diretamente a construção incoativa e o sentido jurídico de κατηγορέω.
- source_word: ὁ Τέρτυλλος
  choice: Tértulo
  rationale: Forma tradicional e natural do nome em português.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: desfrutamos de muita paz
  rationale: Expressa com naturalidade a experiência ou posse de muita paz e mantém o tom lisonjeiro do discurso.
- source_word: διὰ σοῦ
  choice: Por meio de ti
  rationale: Conserva o valor de agência ou mediação de διά com genitivo.
- source_word: διορθωμάτων
  choice: melhorias
  rationale: O termo pode designar melhorias, reformas ou medidas corretivas. “Melhorias” é amplo e natural, sem sugerir necessariamente uma reforma institucional específica.
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: estão sendo realizadas em benefício desta nação
  rationale: Retrata as melhorias que vêm ocorrendo para a nação e verte o dativo como benefício, adequado ao elogio administrativo.
- source_word: διὰ τῆς σῆς προνοίας
  choice: graças à tua prudente administração
  rationale: No contexto, πρόνοια indica previsão, cuidado ou gestão de um governante. A expressão evita a conotação predominantemente divina que “providência” pode ter em português.
theological_decisions:
- issue: Sentido não teológico de πρόνοια
  choice: prudente administração
  alternative: providência; previdência; visão administrativa
  rationale: A fala elogia a atuação governamental de Félix, não atribui a ele providência divina. A tradução preserva o sentido administrativo e a retórica lisonjeira.
translation_notes:
  register: Português moderno, digno e claro, com tratamento por “tu” coerente com a fala formal dirigida ao governador. A formulação mantém a lisonja forense de Tértulo e deixa a oração aberta, pois o discurso continua no versículo seguinte.
