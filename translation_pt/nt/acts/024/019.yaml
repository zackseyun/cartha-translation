  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: pt
  text: Mas alguns judeus da Ásia[a] deveriam ter comparecido diante de você e me acusado[b], se tivessem alguma coisa contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ásia” refere-se aqui à província romana situada na Ásia Menor, não ao continente moderno.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ter apresentado acusações contra mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Mas havia alguns
  rationale: δὲ marca contraste com a declaração anterior, e τινὲς indica um grupo não especificado. “Havia alguns” introduz naturalmente os acusadores ausentes no contexto.
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: judeus da Ásia
  rationale: Reproduz de modo conciso a procedência; “Ásia” designa aqui a província romana, esclarecida em nota.
- source_word: ἔδει ... παρεῖναι
  choice: deveriam ter comparecido
  rationale: Expressa a obrigação passada e não cumprida indicada pelo imperfeito ἔδει; “comparecido” convém ao cenário judicial.
- source_word: ἐπὶ σοῦ
  choice: diante de você
  rationale: No contexto forense, indica comparecimento perante a autoridade que julga.
- source_word: κατηγορεῖν
  choice: me acusado
  rationale: Mantém o sentido forense do verbo em português corrente; a alternativa mais explícita aparece em nota.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: se tivessem alguma coisa contra mim
  rationale: O optativo apresenta a condição de modo potencial; a formulação preserva a amplitude de τι sem restringi-lo a uma acusação formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada ao português, preservando o contraste, o contexto judicial e a obrigação passada não cumprida.
