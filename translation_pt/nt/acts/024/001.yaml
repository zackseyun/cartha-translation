id: ACT.24.1
reference: Acts 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: pt
  text: Cinco dias depois, o sumo sacerdote Ananias desceu com alguns anciãos e um orador chamado Tértulo[a]. Eles apresentaram ao governador acusações contra Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um advogado chamado Tértulo”; a palavra grega pode designar um orador público ou um representante jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Cinco dias depois
  rationale: μετά com o acusativo indica o tempo transcorrido. A formulação é natural em português; δέ exerce aqui uma leve função de progressão narrativa, sem exigir uma conjunção explícita.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva o sentido direcional de καταβαίνω na viagem de Jerusalém para Cesareia.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: o sumo sacerdote Ananias
  rationale: ἀρχιερεύς designa aqui o ofício judaico de sumo sacerdote; o nome segue a forma tradicional em português.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: com alguns anciãos
  rationale: πρεσβύτεροι refere-se a líderes judeus, e τινῶν indica um número indefinido dentre eles.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: um orador chamado Tértulo
  rationale: ῥήτωρ pode designar um orador público ou representante jurídico. “Orador” preserva a amplitude lexical, enquanto a nota registra a alternativa forense; o artigo indefinido comunica naturalmente a indefinição de τινός.
- source_word: οἵτινες ἐνεφάνισαν
  choice: Eles apresentaram ... acusações
  rationale: No contexto judicial, ἐμφανίζω expressa a apresentação formal de uma denúncia ou acusação. O pronome retoma claramente todo o grupo mencionado.
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: ao governador acusações contra Paulo
  rationale: O dativo identifica a autoridade a quem a acusação foi apresentada, e κατά com o genitivo tem sentido judicial adversativo, “contra”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A narrativa foi dividida em duas frases para evitar uma coordenação longa e tornar inequívoco que todo o grupo apresentou as acusações. A nota foi colocada junto a “orador”, termo ao qual se refere.
