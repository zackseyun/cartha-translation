base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: pt
  text: 'Então Paulo respondeu, depois que o governador lhe fez um sinal com a cabeça para que falasse: “Sabendo que há muitos anos você é juiz desta nação, apresento de bom ânimo[a] a minha defesa a respeito de mim mesmo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com confiança”. O advérbio pode expressar prontidão, coragem ou boa disposição, e não apenas alegria.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Então Paulo respondeu
  rationale: ἀποκρίνομαι indica responder, e τε faz uma ligação narrativa leve; “Então” dá progressão natural ao relato sem enfatizar demais a conjunção.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: depois que o governador lhe fez um sinal com a cabeça para que falasse
  rationale: A construção absoluta no genitivo tem valor temporal. “Fez um sinal com a cabeça” preserva o gesto indicado por νεύω, e “para que falasse” expressa o infinitivo λέγειν com naturalidade.
- source_word: ἡγεμόνος
  choice: governador
  rationale: No contexto de Atos, designa a autoridade provincial romana; “governador” é claro, historicamente apropriado e corrente em português.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: há muitos anos
  rationale: A expressão temporal indica uma situação iniciada anos antes e ainda vigente; em português, “há muitos anos” comunica essa duração de modo idiomático.
- source_word: ὄντα σε κριτὴν
  choice: você é juiz
  rationale: Com “há muitos anos”, o presente português expressa naturalmente a continuidade da função até o momento da fala, sem tornar pesada a construção.
- source_word: κριτὴν
  choice: juiz
  rationale: Mantém o sentido jurídico direto de κριτής e se ajusta ao cenário forense, embora a função de Félix também envolvesse administração.
- source_word: τῷ ἔθνει τούτῳ
  choice: desta nação
  rationale: ἔθνος pode significar povo ou nação. “Desta nação” preserva o registro formal e refere-se ao povo judeu sob a jurisdição de Félix.
- source_word: ἐπιστάμενος
  choice: Sabendo
  rationale: Preserva a forma participial e apresenta o conhecimento de Paulo como base para a disposição com que faz sua defesa.
- source_word: εὐθύμως
  choice: de bom ânimo
  rationale: A expressão abrange prontidão, coragem e disposição positiva, evitando reduzir o termo à mera alegria emocional. A alternativa “com confiança” é registrada em nota.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: a respeito de mim mesmo
  rationale: Reproduz o caráter reflexivo e formal da expressão, referindo-se às acusações e questões relacionadas ao próprio Paulo.
- source_word: ἀπολογοῦμαι
  choice: apresento ... a minha defesa
  rationale: Expressa o sentido jurídico-forense do verbo e soa natural no contexto de uma audiência formal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com registro forense moderado. O tratamento “você” favorece ampla legibilidade brasileira; a formulação evita coloquialismo excessivo. A fala permanece aberta neste versículo porque continua no contexto seguinte.
