  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: pt
  text: Então ele ordenou ao centurião que mantivesse Paulo sob custódia, mas lhe desse alguma liberdade[a] e não impedisse nenhum dos seus[b] de prestar-lhe assistência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «algum alívio» ou «certa liberdade». O termo grego pode indicar alívio, comodidade ou uma redução das restrições da custódia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «nenhum dos seus». A expressão provavelmente se refere a companheiros ou pessoas próximas de Paulo autorizadas a ajudá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: Então ele ordenou
  rationale: O particípio aoristo introduz a ordem dada por Félix; a forma verbal finita é natural na narrativa portuguesa, e «Então» mantém a progressão do contexto.
- source_word: τῷ ἑκατοντάρχῃ
  choice: ao centurião
  rationale: Designação precisa e corrente do oficial romano responsável pela custódia.
- source_word: τηρεῖσθαι αὐτόν
  choice: que mantivesse Paulo sob custódia
  rationale: Neste contexto jurídico, τηρέω indica manter alguém detido ou sob guarda. O nome «Paulo» evita ambiguidade pronominal em português.
- source_word: ἔχειν τε ἄνεσιν
  choice: mas lhe desse alguma liberdade
  rationale: ἄνεσις pode indicar alívio, facilidade ou liberdade de restrições. «Alguma liberdade» comunica uma custódia mais branda, sem sugerir soltura completa; «mas» torna natural o contraste contextual entre custódia e concessão.
- source_word: μηδένα κωλύειν
  choice: e não impedisse nenhum
  rationale: Preserva a negação universal e expressa κωλύω de maneira idiomática e clara.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: dos seus
  rationale: A expressão substantivada é deliberadamente ampla e pode abranger pessoas ligadas a Paulo, sem especificá-las como parentes, amigos ou discípulos.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: de prestar-lhe assistência
  rationale: Expressa serviço ou ajuda prática sem as possíveis conotações eclesiásticas de «ministrar» nem restringir a ação apenas a necessidades materiais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva a condição de custódia e, ao mesmo tempo, a medida limitada de liberdade concedida a Paulo. Os marcadores [a] e [b] aparecem no texto principal.
