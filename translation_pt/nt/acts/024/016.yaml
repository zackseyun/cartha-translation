id: ACT.24.16
reference: Acts 24:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: pt
  text: Por isso, também eu me esforço para ter sempre uma consciência irrepreensível diante de Deus e das pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Por isso
  rationale: A expressão retoma a esperança mencionada no contexto anterior e introduz a consequência prática; “Por isso” comunica naturalmente esse valor inferencial.
- source_word: καὶ αὐτὸς
  choice: eu também
  rationale: “Também” preserva a força aditiva de καί, enquanto o pronome explícito “eu” transmite de modo natural a ênfase de αὐτός em português.
- source_word: ἀσκῶ
  choice: me esforço
  rationale: O verbo denota empenho ou prática disciplinada; “me esforço” expressa o esforço moral contínuo sem recorrer ao pouco natural “me exercito”.
- source_word: ἀπρόσκοπον
  choice: limpa
  rationale: No contexto de συνείδησις, indica uma consciência sem motivo de tropeço ou acusação. “Consciência limpa” é uma expressão corrente e clara em português.
- source_word: συνείδησιν
  choice: consciência
  rationale: Equivalente português direto para a percepção moral interior indicada pelo termo grego.
- source_word: ἔχειν
  choice: manter
  rationale: Embora o sentido básico seja “ter”, com o esforço contínuo e διὰ παντός, “manter” comunica naturalmente a meta duradoura da ação.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: diante de Deus e das pessoas
  rationale: πρός expressa aqui relação e responsabilidade. “Diante de” é idiomático, e ἀνθρώπους designa seres humanos em geral, naturalmente traduzido por “pessoas” no português atual.
- source_word: διὰ παντός
  choice: sempre
  rationale: A locução indica continuidade ou ocorrência em todo tempo; “sempre” é o equivalente moderno mais claro.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπους
  choice: pessoas
  alternative: homens
  rationale: O plural ἀνθρώπους refere-se genericamente aos seres humanos, não apenas aos do sexo masculino. “Pessoas” preserva esse alcance no português moderno sem acrescentar uma distinção ausente do contexto.
- issue: Qualidade da consciência em ἀπρόσκοπον
  choice: consciência limpa
  alternative: consciência irrepreensível
  rationale: O adjetivo pode sugerir ausência de tropeço, ofensa ou motivo de acusação. “Limpa” preserva a dimensão moral de maneira natural, sem afirmar perfeição absoluta nem eliminar o caráter relacional diante de Deus e das pessoas.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A ordem foi levemente ajustada para fluência, sem perder a relação causal, o esforço pessoal contínuo nem as dimensões divina e humana da consciência.
