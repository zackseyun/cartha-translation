  to: Por isso, também eu me esforço para ter sempre uma consciência irrepreensível diante de Deus e das pessoas.
  rationale: A revisão mantém o sentido inferencial, a ênfase de Paulo, o esforço permanente e a referência genérica a todos os seres humanos. Substitui «limpa» por «irrepreensível» para refletir com maior precisão ἀπρόσκοπον e usa «ter» como equivalente direto de ἔχειν.
