source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: pt
  text: 'Mas, enquanto Paulo falava sobre a justiça, o domínio próprio e o juízo que viria, Félix ficou com medo e respondeu: “Por enquanto, pode ir. Quando eu tiver uma oportunidade, mandarei chamá-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: falava
  rationale: No contexto, indica que Paulo discorria ou dialogava sobre esses temas; “falava sobre” é natural e não acrescenta formalidade indevida.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Preserva o sentido amplo de retidão/justiça sem restringi-lo a uma formulação doutrinária específica.
- source_word: ἐγκρατείας
  choice: domínio próprio
  rationale: Expressa claramente o controle de si e é uma formulação corrente no português bíblico moderno.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: o juízo que viria
  rationale: Reproduz a ideia do juízo futuro em linguagem natural, mantendo a força escatológica sem explicá-la além do texto.
- source_word: ἔμφοβος γενόμενος
  choice: ficou com medo
  rationale: Tradução direta e acessível da reação de Félix.
- source_word: Τὸ νῦν ἔχον
  choice: Por enquanto
  rationale: Expressa idiomaticamente a ideia de “quanto ao presente/agora”.
- source_word: καιρὸν ... μεταλαβών
  choice: Quando eu tiver uma oportunidade
  rationale: καιρός aqui designa uma ocasião conveniente ou oportuna; a formulação preserva essa nuance.
- source_word: μετακαλέσομαί σε
  choice: mandarei chamá-lo
  rationale: Reflete o sentido de convocar ou mandar buscar alguém, apropriado à posição oficial de Félix.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém a amplitude lexical e a tensão entre conduta justa e realidade teológica, sem impor uma leitura exclusivamente forense ou ética.
- issue: Natureza do juízo futuro
  choice: o juízo que viria
  alternative: o juízo vindouro
  rationale: A tradução afirma apenas que o juízo é futuro, como no grego, sem especificar sua forma, momento ou sujeitos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O sujeito “Paulo” foi explicitado para clareza narrativa, pois o pronome grego retoma Paulo no contexto imediato. A fala de Félix usa tratamento natural e respeitoso, sem arcaísmo.
