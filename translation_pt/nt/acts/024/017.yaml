  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: pt
  text: Depois de vários anos, vim trazer donativos aos necessitados da minha nação e apresentar ofertas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Depois de vários anos
  rationale: διά com genitivo exprime o intervalo transcorrido; πλειόνων, embora comparativo na forma, tem aqui o sentido idiomático de “vários”. O leve valor conectivo de δέ não exige uma palavra adicional em português.
- source_word: ἐλεημοσύνας
  choice: donativos aos necessitados
  rationale: O termo designa dádivas de caridade destinadas a pessoas necessitadas. A formulação é clara e atual, sem recorrer ao menos comum “esmolas”.
- source_word: ποιήσων
  choice: trazer
  rationale: O particípio final indica o propósito da vinda de Paulo. Com ἐλεημοσύνας, ποιέω integra a ideia idiomática de realizar ou conceder ajuda; “trazer” se ajusta ao movimento expresso por παρεγενόμην e ao contexto.
- source_word: εἰς τὸ ἔθνος μου
  choice: da minha nação
  rationale: ἔθνος refere-se aqui ao povo judeu como a nação de Paulo. Com “donativos aos necessitados”, a relação de destinatário é expressa naturalmente por “da minha nação”.
- source_word: παρεγενόμην
  choice: vim
  rationale: παραγίνομαι denota chegar ou comparecer; “vim” é conciso e natural no relato em primeira pessoa.
- source_word: προσφοράς
  choice: apresentar ofertas
  rationale: προσφοράς designa ofertas, possivelmente cultuais, mas o texto não especifica sua natureza. A repetição elíptica do propósito é explicitada com “apresentar” para produzir português natural sem restringir o referente.
theological_decisions:
- issue: Natureza da ajuda levada por Paulo a Jerusalém
  choice: donativos aos necessitados
  alternative: esmolas; donativos de caridade
  rationale: A escolha comunica a finalidade assistencial de ἐλεημοσύνας sem transformar o termo em uma categoria eclesiástica técnica nem resolver além do texto quem eram os beneficiários específicos.
- issue: Natureza das προσφοράς
  choice: ofertas
  alternative: ofertas sacrificiais; ofertas a Deus
  rationale: O grego deixa implícito o tipo exato de oferta. A tradução preserva essa amplitude e permite que o contexto determine seu caráter.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita o arcaísmo relativo de “esmolas” e mantém a distinção entre a ajuda aos necessitados e as ofertas.
