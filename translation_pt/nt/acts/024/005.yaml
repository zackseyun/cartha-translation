source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: pt
  text: Pois constatamos que este homem é uma praga, que provoca tumultos entre todos os judeus por todo o mundo habitado e é também líder da seita dos nazarenos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: uma praga
  rationale: Preserva a metáfora acusatória forte, que caracteriza Paulo como uma influência nociva, sem suavizá-la para um termo meramente descritivo.
- source_word: κινοῦντα στάσεις
  choice: que provoca tumultos
  rationale: Expressa a acusação de fomentar agitações ou distúrbios coletivos; «tumultos» é natural e mantém a gravidade política do contexto judicial.
- source_word: τῇ οἰκουμένῃ
  choice: o mundo habitado
  rationale: Mantém o sentido convencional do termo grego para o mundo conhecido ou habitado, sem restringi-lo explicitamente ao Império Romano.
- source_word: πρωτοστάτην
  choice: um dos principais líderes
  rationale: O termo designa alguém que ocupa posição de destaque ou liderança; a formulação evita sugerir, sem necessidade, que Paulo era o único ou supremo chefe.
- source_word: αἱρέσεως
  choice: seita
  rationale: No contexto da acusação, refere-se a um grupo ou partido religioso distinto; «seita» preserva o tom depreciativo dos acusadores.
- source_word: Ναζωραίων
  choice: nazarenos
  rationale: Reproduz a designação aplicada pelos acusadores aos seguidores de Jesus de Nazaré.
theological_decisions:
- issue: Caracterização do movimento cristão pelos acusadores
  choice: «seita dos nazarenos»
  alternative: «grupo dos nazarenos» ou «partido dos nazarenos»
  rationale: Preserva a linguagem jurídica e polêmica da acusação sem endossá-la como avaliação teológica do narrador.
- issue: Grau de liderança atribuído a Paulo
  choice: «um dos principais líderes»
  alternative: «o principal líder» ou «um líder»
  rationale: Comunica a proeminência inerente a πρωτοστάτης, mas não transforma a acusação em afirmação de liderança única sobre todo o movimento.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A frase conserva o tom formal de uma acusação judicial. Não foram necessárias notas de rodapé.
