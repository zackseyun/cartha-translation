  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: pt
  text: Ao se completarem dois anos, Félix teve Pórcio Festo como sucessor. E, querendo fazer um favor aos judeus[a], Félix deixou Paulo preso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: querendo conquistar o favor dos judeus. A expressão grega pode significar tanto fazer-lhes um favor como procurar obter a boa vontade deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Ao se completarem dois anos
  rationale: A construção temporal preserva o sentido do genitivo absoluto e a ideia de conclusão expressa pelo particípio passivo, em português natural.
- source_word: ἔλαβεν διάδοχον
  choice: teve ... como sucessor
  rationale: Reproduz de modo idiomático a mudança de autoridade sem recorrer à construção menos natural «recebeu como sucessor».
- source_word: Πόρκιον Φῆστον
  choice: Pórcio Festo
  rationale: Emprega as formas tradicionais e correntes desses nomes em português.
- source_word: θέλων
  choice: querendo
  rationale: Mantém a forma participial e apresenta o motivo de Félix sem tornar a relação mais explícita do que no grego.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: fazer um favor aos judeus
  rationale: É uma expressão portuguesa natural para a leitura segundo a qual Félix quis conceder-lhes um favor. Como a locução grega também pode indicar a busca da boa vontade deles, essa alternativa é preservada em nota.
- source_word: κατέλιπε
  choice: deixou
  rationale: Expressa que Félix partiu do cargo mantendo Paulo na condição em que estava.
- source_word: δεδεμένον
  choice: preso
  rationale: Comunica naturalmente em português o estado contínuo de detenção indicado pelo particípio perfeito passivo, sem especificar indevidamente o tipo de amarra ou corrente.
