  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: pt
  text: Ao mesmo tempo, Félix esperava que Paulo lhe desse dinheiro[a]. Por isso, também mandava chamá-lo com mais frequência e conversava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente neste contexto, “esperava receber de Paulo um suborno”. O grego diz simplesmente “dinheiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Ao mesmo tempo
  rationale: Expressa a simultaneidade com a narrativa anterior de modo natural, sem reproduzir mecanicamente ambas as partículas.
- source_word: ἐλπίζων
  choice: Félix esperava
  rationale: O particípio presente indica uma expectativa contínua; o pretérito imperfeito comunica adequadamente essa duração no fluxo narrativo. O nome explicita o sujeito já identificado pelo contexto.
- source_word: χρήματα
  choice: dinheiro
  rationale: Mantém o sentido lexical direto do grego. Embora o contexto sugira suborno, o substantivo empregado significa simplesmente dinheiro.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: que Paulo lhe desse
  rationale: A construção ativa é mais natural em português e conserva Paulo como fonte esperada do dinheiro, bem como a perspectiva futura em relação à esperança de Félix.
- source_word: διὸ καὶ
  choice: Por isso
  rationale: Preserva a relação causal entre a expectativa de receber dinheiro e as repetidas convocações. O valor de καί é adequadamente absorvido pelo encadeamento natural em português.
- source_word: πυκνότερον
  choice: com mais frequência
  rationale: Reproduz claramente o comparativo de frequência em registro atual e digno.
- source_word: μεταπεμπόμενος
  choice: mandava chamá-lo
  rationale: O particípio médio indica que Félix repetidamente providenciava que Paulo fosse chamado; o imperfeito preserva essa ação habitual.
- source_word: ὡμίλει αὐτῷ
  choice: conversava com ele
  rationale: ὁμιλέω indica interação conversacional, não um discurso formal; o imperfeito também comunica repetição ou continuidade.
theological_decisions:
- issue: Explicitar no texto principal que o dinheiro esperado seria um suborno
  choice: Manter “dinheiro” no texto principal e registrar a implicação contextual em nota
  alternative: “esperava receber de Paulo um suborno”
  rationale: A narrativa sugere fortemente um motivo corrupto, mas o grego usa χρήματα, termo não específico para dinheiro. A tradução preserva a formulação da fonte sem eliminar a implicação.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com leitura natural no Brasil. Os imperfeitos “esperava”, “mandava” e “conversava” preservam o caráter contínuo e repetido das ações. A ordem ativa em “Paulo lhe desse” evita rigidez sem alterar os papéis semânticos.
