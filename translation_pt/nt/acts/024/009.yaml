  text: συνεπέθεντο δὲ καὶ οἱ Ἰουδαῖοι φάσκοντες ταῦτα οὕτως ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: pt
  text: Os judeus também se uniram à acusação[a], afirmando que essas coisas eram assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Os judeus também se juntaram, afirmando que essas coisas eram assim».'
    reason: Alternativa lexical que preserva o sentido mais geral de συνεπέθεντο, sem explicitar a natureza judicial da ação.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: se uniram à acusação
  rationale: O verbo pode indicar juntar-se a um ataque ou ação contra alguém. Neste contexto judicial, a expressão comunica que os judeus apoiaram ativamente as acusações apresentadas, sem sugerir agressão física.
- source_word: δὲ καὶ
  choice: também
  rationale: A combinação dá continuidade à narrativa e acrescenta os judeus à ação já iniciada. Em português, «também» expressa isso naturalmente, sem forçar uma ideia de contraste.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a tradução direta e contextualmente adequada, referindo-se ao grupo presente na audiência que apoiava a acusação.
- source_word: φάσκοντες
  choice: afirmando
  rationale: O particípio introduz o que eles declaravam em apoio à acusação. «Afirmando» combina com o contexto jurídico e não acrescenta ceticismo indevido.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo retoma o conjunto das alegações anteriores. A formulação preserva a amplitude do grego, em vez de restringi-lo explicitamente a «acusações».
- source_word: οὕτως ἔχειν
  choice: eram assim
  rationale: A expressão idiomática significa que as coisas eram daquele modo ou correspondiam ao que havia sido declarado. «Eram assim» preserva de modo conciso a forma e o sentido do original.
