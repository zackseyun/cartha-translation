id: ACT.24.24
reference: Acts 24:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: pt
  text: Alguns dias depois, Félix veio com Drusila, sua própria esposa, que era judia, mandou chamar Paulo e o ouviu falar sobre a fé no Messias Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a confiança no Messias Jesus”. A palavra grega também pode ter o sentido de “confiança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Alguns dias depois
  rationale: Expressa naturalmente em português a relação temporal de μετά com o acusativo; o valor conectivo leve de δέ fica implícito no fluxo narrativo.
- source_word: παραγενόμενος
  choice: veio
  rationale: O particípio indica a chegada ou presença de Félix; “veio” é simples e natural no contexto narrativo.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: com Drusila, sua própria esposa
  rationale: σύν indica companhia, e ἰδίᾳ conserva a ênfase possessiva por meio de “própria”.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: que era judia
  rationale: Identifica Drusila como judia em linguagem moderna, direta e não arcaica.
- source_word: μετεπέμψατο τὸν Παῦλον
  choice: mandou chamar Paulo
  rationale: Equivalente idiomático do verbo médio μεταπέμπομαι, que significa enviar alguém para buscar ou chamar uma pessoa.
- source_word: ἤκουσεν αὐτοῦ
  choice: o ouviu falar
  rationale: O genitivo com ἀκούω permite o sentido de ouvir ou escutar alguém; “o ouviu falar” liga naturalmente a ação ao assunto introduzido por περί.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: sobre a fé no Messias Jesus
  rationale: περί introduz o assunto; πίστις com εἰς indica fé dirigida a alguém. O artigo grego é adequadamente representado por “a fé”.
- source_word: Χριστὸν Ἰησοῦν
  choice: Messias Jesus
  rationale: Χριστός mantém força titular e é traduzido como “Messias”; a ordem grega é preservada sem deixar de ser compreensível em português.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus; Jesus, o Messias
  rationale: “Messias” traduz o título Χριστός em vez de apenas transliterá-lo; “Messias Jesus” também preserva a ordem do texto grego.
- issue: Sentido de πίστις em τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: a fé no Messias Jesus
  alternative: a confiança no Messias Jesus
  rationale: A construção πίστις + εἰς + acusativo indica mais naturalmente fé dirigida ao Messias Jesus. A nuance possível de confiança é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente ajustada para evitar uma sequência pesada de orações coordenadas, sem alterar a progressão do grego.
