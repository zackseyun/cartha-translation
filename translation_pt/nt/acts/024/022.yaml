base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: pt
  text: 'Félix, porém, que conhecia com mais exatidão o que dizia respeito ao Caminho[b], adiou o caso deles[a], dizendo: “Quando o comandante Lísias descer, decidirei a causa de vocês.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adiou o julgamento deles”. O verbo grego pode indicar o adiamento de uma decisão ou de um procedimento judicial.'
    reason: lexical_alternative
  - marker: b
    text: “O Caminho” era uma designação antiga do movimento cristão.
    reason: cultural_note
  - marker: c
    text: 'Ou: “decidirei as questões relativas a vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: adiou o caso deles
  rationale: O verbo médio tem sentido judicial de adiar ou protelar. Embora αὐτούς se refira literalmente às pessoas, em português «adiou o caso deles» soa mais natural e preserva o contexto forense sem sugerir que Félix apenas evitou recebê-los.
- source_word: ἀκριβέστερον εἰδὼς
  choice: que conhecia com mais exatidão
  rationale: Preserva a força comparativa de ἀκριβέστερον e apresenta a oração participial de modo claro e natural em português.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: o que dizia respeito ao Caminho
  rationale: Traduz a construção ampla τὰ περὶ e mantém «Caminho» como designação do movimento cristão primitivo, sem acrescentar um demonstrativo ausente no grego.
- source_word: Ὅταν ... καταβῇ
  choice: Quando ... descer
  rationale: Ὅταν com subjuntivo indica uma contingência futura específica neste contexto. «Descer» conserva a expressão geográfica antiga, referente à viagem de Lísias até Cesareia.
- source_word: χιλίαρχος
  choice: comandante
  rationale: Termo claro e acessível para o oficial militar romano; evita tanto a transliteração obscura quanto a explicação excessiva no corpo do texto.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: decidirei a causa de vocês
  rationale: Expressa idiomaticamente o sentido jurídico de determinar uma questão após consideração. «Causa» se ajusta ao registro judicial e τὰ καθ’ ὑμᾶς refere-se às questões concernentes às partes.
theological_decisions:
- issue: Sentido de «o Caminho»
  choice: Manter «Caminho» como designação do movimento cristão
  alternative: Explicitar «a fé cristã» no corpo do texto
  rationale: O grego emprega ἡ ὁδός como designação reconhecível, mas não a explica aqui. A tradução preserva essa forma histórica e deixa a explicação para a nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a relação explicativa entre o conhecimento de Félix e o adiamento. «Causa de vocês» mantém o contexto jurídico; «descer» preserva a perspectiva geográfica do texto antigo.
