  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: pt
  text: Mas[a] o comandante Lísias chegou e, usando muita força, o tirou das nossas mãos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo — juntamente com o final do versículo 6 e o início do versículo 8 — não aparece nos manuscritos gregos mais antigos, entre eles os códices Sinaítico e Vaticano, do século IV, nem em antigas traduções coptas. O trecho foi preservado na tradição bizantina majoritária, na tradição latina e em manuscritos gregos posteriores. Parece ser uma antiga ampliação editorial que relata, diante de Félix, a intervenção do comandante romano.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: chegou
  rationale: O particípio aoristo indica que Lísias chegou ao local; a forma verbal coordenada produz uma narrativa natural em português.
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa um oficial militar romano de alta patente, literalmente ligado ao comando de mil homens. “Comandante” é claro e acessível, sem exigir o termo técnico “tribuno”.
- source_word: μετὰ πολλῆς βίας
  choice: usando muita força
  rationale: Expressa o emprego intenso de força física. A formulação evita atribuir necessariamente crueldade ou violência ilegítima.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: o tirou das nossas mãos
  rationale: Reproduz a imagem concreta do grego e comunica naturalmente que Lísias retirou Paulo do poder ou da custódia dos acusadores.
