source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: pt
  text: 'Mas confesso-lhe isto: segundo o Caminho, que eles chamam de seita[a], é assim que presto culto ao Deus dos nossos antepassados[b], crendo em tudo o que está escrito na Lei e nos Profetas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “partido”. A palavra grega pode designar uma corrente, facção ou seita; aqui, “heresia” teria um sentido posterior e enganoso.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o Deus ancestral”; isto é, o Deus adorado pelos antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ δὲ τοῦτό σοι
  choice: Mas confesso isto ao senhor
  rationale: Preserva o reconhecimento público e solene de Paulo perante Félix. “Ao senhor” comunica com naturalidade o respeito devido ao destinatário no contexto forense, sem fazer da frase uma admissão de culpa.
- source_word: κατὰ τὴν ὁδόν
  choice: segundo o Caminho
  rationale: Mantém “o Caminho” como designação histórica do movimento cristão em Atos e expressa a ideia de conformidade contida em κατά.
- source_word: αἵρεσιν
  choice: seita
  rationale: Neste contexto, o termo designa um grupo ou uma corrente religiosa segundo a classificação dos adversários; “heresia” importaria um sentido doutrinário técnico posterior.
- source_word: οὕτως λατρεύω
  choice: é assim que presto culto
  rationale: Liga explicitamente o modo de culto à expressão anterior e conserva em λατρεύω o sentido de serviço religioso prestado a Deus.
- source_word: τῷ πατρῴῳ θεῷ
  choice: ao Deus dos nossos antepassados
  rationale: Expressa em português natural o Deus ancestral de Israel e a continuidade comunitária reivindicada por Paulo. A nota preserva a forma mais literal do adjetivo grego.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: crendo em tudo o que está escrito
  rationale: Mantém a conexão participial e a abrangência de πᾶσι, referindo-se à totalidade do que permanece registrado nas Escrituras.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: na Lei e nos Profetas
  rationale: Reproduz as designações convencionais dessas divisões das Escrituras de Israel e mantém o paralelismo da frase.
theological_decisions:
- issue: A relação de Paulo com a fé de Israel
  choice: Apresentar o culto segundo o Caminho como continuidade do culto ao Deus ancestral de Israel e da fé na Lei e nos Profetas.
  alternative: Apresentar o Caminho como uma religião separada e oposta ao judaísmo.
  rationale: O próprio versículo une o Caminho, o Deus ancestral e as Escrituras de Israel. A tradução preserva essa continuidade sem impor categorias religiosas posteriores.
- issue: Sentido de αἵρεσις
  choice: seita
  alternative: heresia
  rationale: O contexto trata da classificação de um grupo ou corrente, não formula um juízo técnico posterior sobre erro doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao senhor” reflete o contexto respeitoso do discurso dirigido a Félix. A estrutura foi levemente ajustada com “é assim que” para tornar natural a ligação de οὕτως com o modo de culto, sem eliminar a relação sintática com “segundo o Caminho”.
