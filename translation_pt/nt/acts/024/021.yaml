  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: pt
  text: 'ou a respeito desta única declaração[a] que gritei, quando estava de pé entre eles: “É por causa da ressurreição dos mortos[b] que hoje estou sendo julgado diante de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desta única voz” ou “deste único grito”; o termo grego pode designar tanto o que foi dito quanto a voz ou o grito com que foi proferido.
    reason: lexical_alternative
  - marker: b
    text: Ou “ressurreição dentre os mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: declaração
  rationale: Embora φωνή possa significar “voz”, “som” ou “grito”, aqui περὶ e a oração que explicita o conteúdo apontam para a declaração proferida. “Declaração” é natural no contexto de defesa pública.
- source_word: ἐκέκραξα
  choice: gritei
  rationale: O verbo κράζω indica uma fala em voz alta. “Gritei” conserva a força da manifestação pública sem tornar a frase excessivamente formal.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: estando de pé no meio deles
  rationale: A formulação preserva tanto a circunstância expressa pelo particípio quanto o sentido espacial de ἐν αὐτοῖς.
- source_word: ἀναστάσεως νεκρῶν
  choice: ressurreição dos mortos
  rationale: É a tradução direta e consagrada da construção genitiva, mantendo a referência geral à ressurreição sem restringi-la explicitamente à ressurreição de Jesus.
- source_word: κρίνομαι
  choice: estou sendo julgado
  rationale: O presente passivo indica que Paulo se encontra naquele momento sob julgamento. A escolha preserva a forma verbal e é idiomática em português.
- source_word: ἐφ’ ὑμῶν
  choice: diante de vocês
  rationale: No contexto judicial, a expressão indica comparecimento perante autoridades. “Diante de vocês” evita afirmar de modo indevido que os ouvintes sejam exclusivamente os agentes do julgamento.
- source_word: ἢ
  choice: ou
  rationale: Mantém a ligação com a defesa do versículo anterior sem explicitar além do texto a ideia de exceção.
- source_word: μιᾶς ταύτης
  choice: desta única
  rationale: Preserva a ênfase na singularidade e especificidade daquela declaração.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e natural em português moderno.
theological_decisions:
- issue: Natureza da acusação em discussão
  choice: A questão é apresentada como a ressurreição dos mortos em sentido geral.
  alternative: Entender a frase como referência específica, embora implícita, à ressurreição de Jesus.
  rationale: A expressão grega περὶ ἀναστάσεως νεκρῶν é geral. A tradução mantém essa amplitude e não introduz uma especificação cristológica que, embora compatível com o contexto maior de Atos, não está expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Declaração” se ajusta ao contexto judicial; “gritei” mantém a intensidade da fala. A ordem foi levemente naturalizada sem apagar as relações sintáticas do grego.
