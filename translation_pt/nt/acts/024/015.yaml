  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: pt
  text: tendo esperança em Deus — esperança que estes mesmos também aguardam — de que haverá ressurreição tanto de justos como de injustos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: tendo esperança em Deus
  rationale: Mantém a construção participial e apresenta Deus como o objeto da esperança em português natural.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: esperança que estes mesmos também aguardam
  rationale: Explicita o antecedente do pronome relativo e preserva a ênfase de καὶ αὐτοὶ οὗτοι. “Aguardam” expressa aqui a expectativa compartilhada e corresponde diretamente ao sentido prospectivo de προσδέχονται.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: de que haverá ressurreição
  rationale: Comunica de modo claro a expectativa futura expressa por μέλλειν ἔσεσθαι, sem sugerir necessariamente iminência imediata.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: tanto de justos como de injustos
  rationale: Reproduz a inclusão enfática dos dois grupos marcada por τε καὶ e mantém o contraste moral sem acrescentar explicações doutrinárias.
theological_decisions:
- issue: Abrangência e natureza da ressurreição mencionada por Paulo
  choice: ressurreição tanto de justos como de injustos
  alternative: uma ressurreição geral sem explicitar a distinção moral
  rationale: O grego nomeia expressamente os dois grupos. A tradução preserva essa abrangência sem definir a cronologia, o modo ou a relação entre as ressurreições.
- issue: Sentido de προσδέχονται no contexto da esperança compartilhada
  choice: aguardam
  alternative: aceitam
  rationale: O verbo pode indicar acolhimento ou expectativa. “Aguardam” preserva seu sentido prospectivo natural neste contexto, sem excluir que os interlocutores reconheçam essa esperança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões delimitam a observação parentética sem romper o fluxo da declaração. Não há marcador de nota porque a alternativa lexical foi resolvida no texto principal e nenhuma nota é necessária para esta redação.
