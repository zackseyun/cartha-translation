  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: pt
  text: Você pode verificar que não faz mais de doze dias que subi a Jerusalém para adorar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: como você mesmo pode verificar
  rationale: A construção circunstancial indica que Félix tem condições de apurar os fatos. “Verificar” é natural em português e se ajusta ao contexto forense; “como” preserva a relação circunstancial sem torná-la explicitamente causal.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: não faz mais de doze dias
  rationale: Expressa naturalmente em português o tempo decorrido indicado pela formulação idiomática grega, sem alterar o limite máximo de doze dias.
- source_word: ἀφ’ ἧς
  choice: que
  rationale: Na construção portuguesa “não faz mais de doze dias que”, introduz com naturalidade o acontecimento que marca o início do período.
- source_word: ἀνέβην
  choice: subi
  rationale: Preserva o modo tradicional e geográfico de falar da ida a Jerusalém.
- source_word: προσκυνήσων
  choice: para adorar
  rationale: O particípio futuro expressa finalidade. Não se acrescenta “a Deus”, pois o objeto está implícito no grego.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: É uma expressão portuguesa natural de destino com o verbo “subir” e preserva o movimento em direção à cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao singular dirigido ao governador Félix; “mesmo” realça que ele próprio podia verificar os fatos, sem acrescentar conteúdo teológico.
