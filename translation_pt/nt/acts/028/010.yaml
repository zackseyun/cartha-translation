  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: pt
  text: Eles também nos prestaram muitas honras[a] e, quando estávamos para zarpar[b], puseram a bordo tudo de que precisávamos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «honraram-nos com muitas honras».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «quando estávamos saindo para o mar». O termo grego é usado para o início de uma viagem de navio.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «providenciaram tudo de que precisávamos». Mais literalmente, o grego diz que eles «puseram [a bordo] as coisas para as necessidades».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: prestaram muitas honras
  rationale: Preserva de modo natural a ênfase e a repetição lexical da expressão grega, sem recorrer à formulação pouco idiomática «honraram-nos com muitas honras».
- source_word: ἀναγομένοις
  choice: quando estávamos para zarpar
  rationale: Em contexto náutico, ἀνάγω indica iniciar uma viagem por mar; «zarpar» comunica essa ação de modo claro e conciso.
- source_word: ἐπέθεντο
  choice: puseram a bordo
  rationale: Mantém a ação concreta de colocar os suprimentos no navio, cujo referente está implícito no contexto marítimo.
- source_word: τὰ πρὸς τὰς χρείας
  choice: tudo de que precisávamos
  rationale: Expressa em português natural as coisas destinadas às necessidades dos viajantes, sem a redundância de uma tradução excessivamente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a concretude do gesto dos habitantes e explicita «a bordo» apenas a partir do contexto náutico.
