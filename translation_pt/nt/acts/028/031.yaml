id: ACT.28.31
reference: Acts 28:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: pt
  text: proclamando o Reino de Deus e ensinando a respeito do Senhor Jesus, o Messias, com toda a ousadia, sem impedimento algum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσων
  choice: proclamando
  rationale: O particípio presente resume a atividade contínua de Paulo e conserva o sentido de anúncio público e autorizado.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão consagrada e natural em português, capaz de preservar tanto a dimensão régia quanto a concreta de βασιλεία.
- source_word: διδάσκων
  choice: ensinando
  rationale: Reproduz diretamente o segundo particípio coordenado e descreve a instrução contínua de Paulo.
- source_word: τὰ περὶ
  choice: a respeito de
  rationale: Forma idiomática em português que comunica todo o conteúdo da locução grega sem a rigidez de 'as coisas concernentes a'.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico usual de κύριος neste contexto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa o artigo e a aposição necessários para uma formulação clara e idiomática em português.
- source_word: μετὰ πάσης παρρησίας
  choice: com toda a coragem
  rationale: Comunica a fala franca, destemida e confiante expressa por παρρησία, mantendo πάσης como intensificador.
- source_word: ἀκωλύτως
  choice: sem impedimento algum
  rationale: 'Preserva com naturalidade a ênfase climática do advérbio final: a proclamação prosseguia sem ser impedida.'
theological_decisions:
- issue: Tradução de Χριστός na sequência de títulos cristológicos
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός ainda pode ser entendido como título; 'Messias' explicita seu conteúdo sem negar que 'Cristo' possa funcionar como designação semelhante a nome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação participial e o encerramento enfático do grego foram preservados; a expressão idiomática 'a respeito de' evita formalismo artificial.
