  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: pt
  text: E alguns eram convencidos pelo que se dizia, mas outros não acreditavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não criam”.'
    reason: Alternativa lexical para ἠπίστουν.
lexical_decisions:
- source_word: ἐπείθοντο
  choice: eram persuadidos
  rationale: O imperfeito médio/passivo descreve a resposta em curso dos ouvintes e preserva a ideia de serem convencidos, sem identificar explicitamente essa resposta com a fé salvadora.
- source_word: τοῖς λεγομένοις
  choice: pelo que estava sendo dito
  rationale: O particípio presente passivo substantivado se refere ao conteúdo do discurso e indica que a fala estava em andamento.
- source_word: ἠπίστουν
  choice: não acreditavam
  rationale: Expressa diretamente a falta de crença em contraste com os que eram persuadidos, sem acrescentar a nuance interpretativa mais forte de uma recusa deliberada.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: alguns ... mas outros
  rationale: Reproduz de modo natural a divisão contrastante entre dois grupos.
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples desta afirmação com a narrativa anterior.
theological_decisions:
- issue: Natureza do contraste entre as respostas
  choice: O versículo distingue os que estavam sendo convencidos pela mensagem dos que não acreditavam nela.
  alternative: Entender os primeiros explicitamente como salvos e os demais como pessoas que rejeitaram deliberadamente a fé.
  rationale: O grego descreve as respostas imediatas à mensagem, mas não define neste versículo o estado espiritual final dos indivíduos nem explicita uma recusa deliberada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o aspecto durativo dos dois imperfeitos e evita intensificar ἠπίστουν como uma recusa deliberada.
