id: ACT.28.11
reference: Acts 28:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: pt
  text: Depois de três meses, partimos num navio de Alexandria que havia passado o inverno na ilha e que trazia como insígnia os Dióscuros[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os Dióscuros eram Castor e Pólux, irmãos gêmeos associados a Zeus na mitologia greco-romana.
    reason: Esclarece um nome mitológico provavelmente desconhecido para muitos leitores modernos.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Depois de três meses
  rationale: μετά com acusativo indica tempo após um intervalo; δέ é uma conexão narrativa leve e pode ficar implícita em português natural.
- source_word: ἀνήχθημεν
  choice: partimos
  rationale: No contexto náutico, ἀνάγω significa fazer-se ao mar ou zarpar. “Partimos” comunica naturalmente a saída por mar no contexto imediato.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: num navio de Alexandria
  rationale: πλοῖον designa uma embarcação, aqui adequadamente “navio”; Ἀλεξανδρίνῳ indica origem ou associação com Alexandria.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: que havia passado o inverno na ilha
  rationale: O particípio perfeito de παραχειμάζω indica que o navio permanecera ali durante o inverno; “na ilha” é idiomático em português e o contexto identifica a ilha como Malta.
- source_word: παρασήμῳ Διοσκούροις
  choice: que trazia como insígnia os Dióscuros
  rationale: παράσημος indica a marca, insígnia ou emblema distintivo do navio. “Insígnia” preserva a amplitude do termo sem afirmar com excesso de precisão que se tratava necessariamente de uma figura de proa; “Dióscuros” reproduz o nome próprio grego.
theological_decisions:
- issue: Referência ao emblema pagão Διοσκούροις
  choice: os Dióscuros
  alternative: os deuses gêmeos; Castor e Pólux
  rationale: O texto apenas identifica a insígnia do navio, sem endossar a crença associada. Manter o nome próprio preserva a referência histórica e evita transformar a tradução em paráfrase interpretativa; a nota esclarece o referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Navio de Alexandria” soa mais natural que “navio alexandrino”; “havia passado o inverno” é corrente e preciso. A formulação conserva a sequência narrativa e evita especificar “figura de proa” onde o grego permite o sentido mais amplo de insígnia ou emblema.
