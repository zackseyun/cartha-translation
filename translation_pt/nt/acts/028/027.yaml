  to: Pois o coração deste povo se tornou insensível[a]; com os ouvidos, ouviram mal e fecharam os seus olhos, para que não vejam com os olhos, nem ouçam com os ouvidos, nem entendam com o coração, nem voltem[b], e eu os cure.
