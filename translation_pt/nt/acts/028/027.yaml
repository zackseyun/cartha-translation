id: ACT.28.27
reference: Acts 28:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: pt
  text: Pois o coração deste povo se tornou insensível[a]; com os ouvidos, ouviram mal e fecharam os seus olhos, para que não vejam com os olhos, nem ouçam com os ouvidos, nem entendam com o coração, nem voltem[b], e eu os cure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se tornou grosso”. Aqui a expressão indica insensibilidade ou falta de percepção espiritual.
    reason: metaphor_clarification
  - marker: b
    text: '“Voltem” também pode ser traduzido como “retornem” e, neste contexto, pode ter o sentido de “se arrependam”. A oração iniciada por “para que não” também admite a tradução: “caso contrário, poderiam ver... ouvir... entender... voltar, e eu os curaria”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: se tornou insensível
  rationale: O verbo significa literalmente tornar-se grosso ou gordo e, metaforicamente, tornar-se espiritualmente embotado. “Insensível” comunica essa metáfora com naturalidade em português.
- source_word: καρδία
  choice: coração
  rationale: Preserva o termo antropológico bíblico e sua repetição conceitual em “entendam com o coração”.
- source_word: λαοῦ
  choice: povo
  rationale: É o equivalente corrente e apropriado ao contexto da citação de Isaías.
- source_word: βαρέως ἤκουσαν
  choice: ouviram com dificuldade
  rationale: Expressa de modo natural o sentido de ouvir de maneira pesada, obtusa ou dificultosa, sem transformar o verbo em “escutar”.
- source_word: ἐκάμμυσαν
  choice: fecharam
  rationale: Reproduz de maneira clara e direta a ação deliberada de fechar os olhos.
- source_word: μήποτε
  choice: para que não
  rationale: Mantém a forte possibilidade de valor final ou preventivo da conjunção na citação de Isaías, preservando a tensão do texto grego; a nota registra uma leitura menos final.
- source_word: ἴδωσιν / ἀκούσωσιν / συνῶσιν
  choice: vejam / ouçam / entendam
  rationale: Os subjuntivos coordenados são naturalmente reproduzidos após “para que não”, mantendo o paralelismo entre olhos, ouvidos e coração.
- source_word: ἐπιστρέψωσιν
  choice: voltem
  rationale: Preserva a imagem direcional de voltar ou retornar sem restringi-la ao termo interpretativo “arrependam-se”.
- source_word: ἰάσομαι
  choice: eu os cure
  rationale: O subjuntivo em português integra naturalmente o último elemento ao escopo de “para que não”, embora o grego empregue futuro indicativo; a formulação conserva a relação lógica da citação sem exigir uma perífrase pesada.
theological_decisions:
- issue: Intenção divina na citação de Isaías
  choice: “para que não”, preservando a possível força final de μήποτε
  alternative: “caso contrário” ou “para não acontecer que”
  rationale: O grego sustenta uma tensão entre juízo divino e responsabilidade humana. A tradução principal não enfraquece silenciosamente a força final possível, e a nota registra a alternativa circunstancial.
- issue: Sentido de ἐπιστρέψωσιν
  choice: voltem
  alternative: “retornem”, “se convertam” ou “se arrependam”
  rationale: “Voltem” mantém a amplitude da metáfora e sua implicação de retorno a Deus sem impor terminologia denominacional ou uma explicitação maior que a do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo bíblico de olhos, ouvidos e coração foi preservado. A construção evita arcaísmos como “porventura” e conserva na nota a ambiguidade sintática e teológica de μήποτε.
