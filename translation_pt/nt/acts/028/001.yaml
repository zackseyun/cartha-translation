lexical_decisions:
- source_word: διασωθέντες
  choice: depois de termos chegado a salvo
  rationale: O particípio aoristo passivo indica livramento bem-sucedido do perigo já narrado. A formulação é natural em português e, no contexto do naufrágio, comunica a chegada em segurança sem dar ao verbo um sentido teológico mais específico do que o texto exige.
- source_word: τότε
  choice: então
  rationale: Mantém a sequência temporal entre o livramento e a descoberta do nome da ilha.
- source_word: ἐπέγνωμεν
  choice: soubemos
  rationale: Neste contexto, o verbo indica que os viajantes vieram a saber uma informação que antes desconheciam.
- source_word: Μελίτη
  choice: Malta
  rationale: Emprega a forma portuguesa convencional do nome da ilha tradicionalmente identificada com Malta.
- source_word: ἡ νῆσος
  choice: a ilha
  rationale: Correspondência direta, clara e corrente em português moderno.
- source_word: καλεῖται
  choice: se chama
  rationale: Preserva o presente passivo grego de maneira idiomática em português, como informação ainda válida sobre o nome da ilha.
