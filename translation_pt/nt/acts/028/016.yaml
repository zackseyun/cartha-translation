  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: pt
  text: Quando entramos em Roma, Paulo recebeu permissão para ficar à parte, com o soldado que o guardava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Quando
  rationale: Introduz naturalmente a circunstância temporal da entrada em Roma.
- source_word: δὲ
  choice: —
  rationale: Conectivo discursivo leve, omitido para dar fluência ao português sem perder contraste relevante.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: entramos em Roma
  rationale: Preserva diretamente o sentido de movimento de εἰσέρχομαι com εἰς e mantém a primeira pessoa do plural.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: foi permitido a Paulo
  rationale: Reproduz a construção passiva e a ideia de permissão concedida, em registro digno e compreensível.
- source_word: μένειν
  choice: ficar
  rationale: Equivalente natural no contexto de hospedagem ou permanência sob custódia.
- source_word: καθ’ ἑαυτόν
  choice: por conta própria
  rationale: Expressa que Paulo podia ficar separado dos demais presos sem sugerir isolamento absoluto, pois estava acompanhado por um guarda.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: acompanhado do soldado que o guardava
  rationale: Torna explícito e natural em português o acompanhamento indicado por σύν; o artigo definido reflete o soldado designado para guardá-lo.
