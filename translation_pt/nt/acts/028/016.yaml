  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém a perspectiva narrativa em primeira pessoa e a condição singular de Paulo sob guarda, sem acrescentar detalhes como casa alugada ou prisão domiciliar que não aparecem neste versículo.
