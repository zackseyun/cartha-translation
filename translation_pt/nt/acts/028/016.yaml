  source_fidelity: A primeira pessoa do plural, a entrada em Roma, a permissão concedida a Paulo e a presença do soldado encarregado de guardá-lo estão corretamente representadas. Contudo, «por conta própria» tende a significar independência/autonomia (e, em certos contextos, às próprias custas), o que não exprime com precisão καθ’ ἑαυτόν, isto é, a permanência de Paulo em separado, qualificada pela companhia do guarda.
  naturalness: A redação é clara e de registro adequado, mas «por conta própria, acompanhado do soldado» cria uma tensão semântica desnecessária. «À parte» é uma forma moderna e natural que mantém o sentido de separação sem sugerir independência de custódia.
