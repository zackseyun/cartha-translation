base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: pt
  text: E dali, os irmãos[a], ao ouvirem falar de nós, vieram ao nosso encontro até o Fórum de Ápio e as Três Vendas. Quando Paulo os viu, deu graças a Deus e tomou coragem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os irmãos e as irmãs”. O grego diz “irmãos”, forma comum de se referir aos demais crentes e que, conforme o contexto, pode incluir mulheres.'
    reason: Alternativa lexical que esclarece o possível sentido inclusivo de ἀδελφοί.
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: E dali
  rationale: Mantém a conexão com a narrativa de viagem e a referência espacial de καί + ἐκεῖθεν em português natural.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Conserva a forma masculina plural do grego para os companheiros na fé, sem substituir no texto a expressão original por um coletivo interpretativo; a possível inclusão de mulheres é esclarecida em nota.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: ao ouvirem falar de nós
  rationale: Expressa naturalmente o valor temporal do particípio e o sentido idiomático de τὰ περὶ ἡμῶν, sem acrescentar explicitamente 'notícias'.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: vieram ao nosso encontro
  rationale: Reproduz com naturalidade o idioma grego de ir ou vir encontrar alguém.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: até o Fórum de Ápio e as Três Vendas
  rationale: “Até” preserva a extensão indicada por ἄχρι. “Fórum de Ápio” e “Três Vendas” são formas portuguesas inteligíveis para os topônimos antigos.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Quando Paulo os viu
  rationale: Transforma o particípio em oração temporal natural, mantendo o antecedente plural do pronome relativo.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: deu graças a Deus
  rationale: Preserva a expressão explícita de gratidão dirigida a Deus e seu tom digno.
- source_word: ἔλαβε θάρσος
  choice: se encheu de coragem
  rationale: Comunica o idioma literalmente próximo de 'recebeu coragem' em português corrente, indicando que Paulo ganhou ânimo sem sugerir necessariamente ousadia verbal.
theological_decisions:
- issue: Sentido de ἀδελφοί para um grupo cristão possivelmente misto
  choice: os irmãos
  alternative: os irmãos e as irmãs; os crentes
  rationale: A forma lexical masculina do texto grego é mantida no texto principal, enquanto a amplitude contextual que pode incluir mulheres é registrada em nota, sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção narrativa é fluida sem apagar a sequência e os matizes do grego.
