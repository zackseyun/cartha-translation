id: ACT.28.7
reference: Acts 28:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: pt
  text: Nos arredores daquele lugar havia terras[a] pertencentes ao homem mais importante da ilha[b], chamado Públio. Ele nos acolheu e nos hospedou com bondade durante três dias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “propriedades” ou “fazendas”; o termo grego χωρία se refere a bens fundiários situados nas proximidades.
    reason: lexical_alternative
  - marker: b
    text: Ou “principal homem da ilha”. A expressão grega τῷ πρώτῳ τῆς νήσου provavelmente designa o homem de maior destaque ou posição na ilha, possivelmente como título.
    reason: alternative_reading
  - marker: c
    text: Ou “nos recebeu e, com cordialidade, nos deu hospedagem por três dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Nos arredores daquele lugar
  rationale: Expressa de modo natural a área circundante indicada por περὶ τὸν τόπον; δέ funciona como transição narrativa leve e não exige um advérbio temporal como “então” ou “naquele momento”.
- source_word: ὑπῆρχεν χωρία
  choice: havia terras
  rationale: O uso existencial de ὑπῆρχεν introduz as propriedades existentes nas proximidades, e “terras” preserva o plural e a referência ampla a bens fundiários sem especificar indevidamente seu tipo.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: ao homem mais importante da ilha
  rationale: πρῶτος indica primazia de posição ou status e pode funcionar como designação de liderança. A formulação comunica sua proeminência sem impor um cargo administrativo não explicitado.
- source_word: ὀνόματι Ποπλίῳ
  choice: chamado Públio
  rationale: ὀνόματι com o dativo introduz o nome da pessoa; “Públio” é a forma portuguesa tradicional do nome latino representado por Ποπλίῳ.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: nos acolheu
  rationale: O particípio descreve a recepção favorável dos visitantes; “acolheu” combina naturalidade com o contexto de hospitalidade.
- source_word: τρεῖς ἡμέρας
  choice: durante três dias
  rationale: O acusativo expressa extensão de tempo, vertida idiomaticamente por “durante três dias”.
- source_word: φιλοφρόνως ἐξένισεν
  choice: nos hospedou com bondade
  rationale: ξενίζω denota receber alguém como hóspede, enquanto φιλοφρόνως caracteriza esse cuidado como bondoso, cordial ou atencioso.
theological_decisions:
- issue: O status expresso por τῷ πρώτῳ τῆς νήσου
  choice: homem mais importante da ilha
  alternative: principal autoridade da ilha
  rationale: A tradução preserva a ideia de posição preeminente e a possível força titular, mas evita afirmar como certo um cargo político específico que o texto não identifica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais tanto no Brasil quanto em outros contextos lusófonos. “Terras” mantém a concretude e o plural do original; “homem mais importante” evita o caráter pouco idiomático de “primeiro homem” e não transforma uma designação de status em cargo técnico definido.
