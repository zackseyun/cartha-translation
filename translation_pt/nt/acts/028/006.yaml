  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: pt
  text: Eles esperavam que ele inchasse ou caísse morto de repente. Mas, depois de esperarem por muito tempo e verem que nada de anormal lhe acontecia[a], mudaram de opinião e começaram a dizer que ele era um deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nada fora do comum” ou “nada de errado” lhe acontecia.'
    reason: Alternativas lexicais para μηδὲν ἄτοπον, que pode indicar nada anormal, fora do comum ou errado.
lexical_decisions:
- source_word: προσεδόκων
  choice: esperavam
  rationale: O imperfeito expressa uma expectativa contínua; “esperavam” é natural em português e preserva esse aspecto durativo.
- source_word: μέλλειν
  choice: fosse
  rationale: Com os infinitivos seguintes e após um verbo de expectativa, indica o que se previa que aconteceria; a construção “esperavam que ele fosse...” é idiomática em português.
- source_word: πίμπρασθαι
  choice: inchar
  rationale: No contexto da picada de uma serpente, refere-se ao inchaço corporal, não a queimar-se literalmente.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: cair morto de repente
  rationale: Preserva tanto o colapso quanto o resultado mortal, e “de repente” traduz ἄφνω de modo claro.
- source_word: ἐπὶ πολὺ
  choice: depois de esperarem por muito tempo
  rationale: A expressão indica um período prolongado e se integra naturalmente à construção temporal formada pelos particípios.
- source_word: θεωρούντων
  choice: verem
  rationale: O verbo denota observação atenta que resulta em constatação; “verem” é conciso e natural no contexto.
- source_word: μηδὲν ἄτοπον
  choice: nada de anormal
  rationale: ἄτοπος pode significar estranho, fora do comum ou impróprio. “Nada de anormal” preserva a amplitude sem especificar indevidamente que nada prejudicial aconteceu.
- source_word: μεταβαλόμενοι
  choice: mudaram de opinião
  rationale: O particípio médio indica uma mudança de avaliação ou conclusão; esta formulação deixa clara a reversão.
- source_word: ἔλεγον
  choice: começaram a dizer
  rationale: O imperfeito admite sentido inceptivo ou continuativo; no encadeamento narrativo, “começaram a dizer” comunica naturalmente o início da nova conclusão.
- source_word: θεόν
  choice: um deus
  rationale: No contexto pagão e politeísta, o substantivo sem artigo tem sentido indefinido; “um deus” evita confundi-lo com uma identificação de Paulo com o único Deus.
theological_decisions:
- issue: Como traduzir αὐτὸν εἶναι θεόν sem importar afirmações cristãs posteriores sobre a condição de Paulo
  choice: ele era um deus
  alternative: ele era Deus; ele era divino
  rationale: A narrativa relata a conclusão equivocada dos habitantes da ilha. O contexto politeísta e θεόν sem artigo favorecem a leitura indefinida, sem eliminar a natureza religiosa da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mudaram de opinião” evita a possível informalidade regional de “mudaram de ideia”, e “um deus” preserva o contexto pagão do relato.
