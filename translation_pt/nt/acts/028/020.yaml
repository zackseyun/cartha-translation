id: ACT.28.20
reference: Acts 28:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: pt
  text: Foi por essa razão, portanto, que pedi para vê-los e falar com vocês, pois é por causa da esperança de Israel[a] que trago esta corrente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “a esperança que Israel nutre”; a expressão provavelmente se refere à esperança de Israel ligada às promessas da aliança e à ressurreição, proclamada por Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Foi por essa razão, portanto
  rationale: Mantém tanto a expressão causal quanto a partícula conclusiva, apesar da leve redundância, e explicita com naturalidade a ligação lógica com o contexto anterior.
- source_word: παρεκάλεσα
  choice: pedi
  rationale: No contexto em que Paulo manda chamar os líderes judeus locais, “pedi” expressa de modo natural a solicitação, sem sugerir indevidamente um apelo jurídico.
- source_word: ἰδεῖν
  choice: para vê-los
  rationale: Preserva o sentido direto de “ver” e continua natural em português; “para me encontrar com vocês” seria possível, mas mais interpretativo.
- source_word: προσλαλῆσαι
  choice: falar com vocês
  rationale: Comunica interação pessoal e conversacional, sem reduzir a ação a um discurso unilateral.
- source_word: ἕνεκεν γὰρ
  choice: pois é por causa de
  rationale: Preserva a explicação introduzida por γάρ e a força causal de ἕνεκεν em português corrente.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: da esperança de Israel
  rationale: Mantém compacta e aberta a relação genitiva, sem restringi-la explicitamente à esperança messiânica, à ressurreição ou às promessas da aliança.
- source_word: ἅλυσιν
  choice: corrente
  rationale: Conserva o substantivo no singular e a imagem concreta da restrição sob custódia.
- source_word: περίκειμαι
  choice: trago
  rationale: Expressa de forma natural que a corrente está sobre ou ao redor de Paulo, preservando a imagem física sem substituir o verbo por uma explicação abstrata de seu encarceramento.
theological_decisions:
- issue: Sentido de “a esperança de Israel”
  choice: Manter “a esperança de Israel” sem expansão interpretativa no texto principal.
  alternative: “a esperança prometida a Israel”, “a esperança de Israel na ressurreição” ou “a esperança messiânica de Israel”.
  rationale: A expressão provavelmente evoca a esperança de Israel ligada às promessas divinas, ao Messias e à ressurreição, mas o grego permanece conciso e alusivo. A tradução conserva essa amplitude e tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna natural a referência plural aos líderes judeus; “trago esta corrente” conserva a imagem concreta sem recorrer a uma formulação excessivamente literal ou artificial.
