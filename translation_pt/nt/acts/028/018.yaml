  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: pt
  text: os quais, depois de me interrogarem, queriam me soltar, porque não havia contra mim nenhuma acusação que merecesse a morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: os quais
  rationale: Retoma naturalmente as autoridades romanas do contexto; a nuance qualitativa de ὅστις não precisa ser explicitada.
- source_word: ἀνακρίναντές
  choice: depois de me interrogarem
  rationale: O particípio aoristo indica ação anterior à vontade de soltá-lo, e ἀνακρίνω tem aqui sentido de exame judicial.
- source_word: ἐβούλοντο
  choice: queriam
  rationale: O imperfeito expressa a disposição ou intenção passada das autoridades, de modo claro e natural.
- source_word: ἀπολῦσαι
  choice: me soltar
  rationale: No contexto de custódia judicial, significa pôr em liberdade; esta formulação é corrente e compreensível.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: porque não havia
  rationale: A construção com διά e infinitivo articular expressa a causa.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: nenhuma acusação que merecesse a morte
  rationale: αἰτία pode designar acusação, causa ou fundamento jurídico; com θανάτου, indica uma acusação passível de pena capital, preservando a formulação forense sem restringi-la a uma terminologia técnica específica.
- source_word: ἐν ἐμοί
  choice: contra mim
  rationale: Embora literalmente seja 'em mim', no contexto forense refere-se à inexistência de acusação capital contra Paulo.
