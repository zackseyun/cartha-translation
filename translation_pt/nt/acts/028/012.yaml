  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: pt
  text: E, depois de aportarmos em Siracusa[a], permanecemos ali três dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de desembarcarmos em Siracusa” ou “depois de chegarmos ao porto de Siracusa”. O particípio grego tem sentido náutico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: depois de aportarmos
  rationale: Neste contexto de viagem marítima, o particípio de κατάγω indica chegar a um porto ou aportar. A formulação preserva o sentido náutico em português natural.
- source_word: εἰς Συρακούσας
  choice: em Siracusa
  rationale: Embora εἰς expresse movimento em direção a um lugar, com o verbo náutico “aportar” a regência idiomática em português é “aportar em”.
- source_word: ἐπεμείναμεν
  choice: permanecemos ali
  rationale: O verbo significa permanecer ou ficar. “Permanecemos ali” é claro, digno e torna explícita a referência locativa já implícita no contexto.
- source_word: ἡμέρας τρεῖς
  choice: três dias
  rationale: O acusativo indica extensão de tempo; após “permanecemos”, “três dias” comunica naturalmente a duração.
- source_word: Συρακούσας
  choice: Siracusa
  rationale: É a forma portuguesa tradicional e corrente do nome da antiga cidade siciliana.
