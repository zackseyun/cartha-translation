id: ACT.28.8
reference: Acts 28:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: pt
  text: Aconteceu que o pai de Públio estava de cama, sofrendo de febres e disenteria. Paulo entrou para vê-lo e, depois de orar e impor-lhe as mãos, o curou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Introduz o acontecimento de modo natural em português, sem acrescentar um advérbio temporal ausente do grego.
- source_word: πατέρα τοῦ Ποπλίου
  choice: o pai de Públio
  rationale: Reproduz naturalmente a relação genitiva e conserva a forma tradicional e reconhecível do nome próprio em português.
- source_word: πυρετοῖς
  choice: febres
  rationale: Preserva o plural explícito do grego, que pode sugerir episódios febris recorrentes.
- source_word: δυσεντερίῳ
  choice: disenteria
  rationale: É o equivalente médico direto e continua compreensível no português atual.
- source_word: συνεχόμενον
  choice: sofrendo de
  rationale: Expressa o estado contínuo de estar acometido pelas doenças sem recorrer a formulação excessivamente literal.
- source_word: κατακεῖσθαι
  choice: estava de cama
  rationale: Comunica que ele permanecia deitado por causa da enfermidade, de maneira idiomática e sem afirmar mais do que o contexto permite.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Paulo entrou para vê-lo
  rationale: Torna natural em português o movimento de Paulo para o lugar onde o enfermo estava, sem sugerir que o verbo grego signifique literalmente 'visitar'.
- source_word: προσευξάμενος
  choice: depois de orar
  rationale: Representa com clareza a ação anterior indicada pelo particípio aoristo.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: impor-lhe as mãos
  rationale: Mantém a expressão bíblica corrente e o plural 'mãos', com colocação pronominal natural no registro adotado.
- source_word: ἰάσατο αὐτόν
  choice: o curou
  rationale: Traduz diretamente a ação de restaurar a saúde, sem acrescentar qualificações sobre o modo ou a duração da cura.
theological_decisions:
- issue: Natureza da cura realizada por Paulo
  choice: Apresentar diretamente a sequência de oração, imposição das mãos e cura.
  alternative: Qualificar expressamente a cura como milagrosa, sacramental ou como simples recuperação clínica.
  rationale: O texto narra a cura ligada à ação de Paulo, mas não fornece aqui essas qualificações interpretativas; a tradução preserva a afirmação e sua tensão sem elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. A construção evita literalismo rígido, conserva o plural 'febres' e mantém a sequência narrativa do grego.
