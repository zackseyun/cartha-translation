  source_fidelity: A tradução preserva adequadamente a sequência narrativa, a convocação dos judeus de posição destacada, o tratamento «Irmãos», a construção concessiva e a voz passiva. Contudo, «em Jerusalém» não traduz ἐξ Ἱεροσολύμων («de Jerusalém») e altera a relação de origem expressa pelo texto grego. O possessivo em «nosso povo» também explicita uma relação que não está lexicalmente expressa em τῷ λαῷ.
  naturalness: O português é claro, contemporâneo e adequado ao registro. «Fui entregue como prisioneiro, de Jerusalém, às mãos dos romanos» mantém uma ordem um pouco marcada, mas é compreensível e permite conservar tanto a origem quanto a imagem jurídica idiomática do grego.
  terminology: «Irmãos», «costumes de nossos antepassados», «prisioneiro» e «às mãos dos romanos» são escolhas apropriadas. A nota d deve apresentar uma alternativa de tradução, não «ao poder dos romanos», que interpreta e enfraquece a imagem explícita de «mãos».
  issues:
