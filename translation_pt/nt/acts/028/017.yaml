  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: pt
  text: 'Três dias depois, Paulo convocou os principais líderes dos judeus[a]. Quando eles se reuniram, disse-lhes: “Eu, irmãos[b], embora não tenha feito nada contra o povo nem contra os costumes de nossos antepassados[c], fui entregue como prisioneiro, de Jerusalém, às mãos dos romanos[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os líderes dos judeus” ou “os mais importantes entre os judeus”.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz a forma de tratamento grega ἀδελφοί. Aqui Paulo se dirige aos líderes judeus que havia convocado.
    reason: cultural_note
  - marker: c
    text: Ou “os costumes ancestrais”.
    reason: lexical_alternative
  - marker: d
    text: Ou “fui entregue como prisioneiro, de Jerusalém, aos romanos”. O grego diz literalmente “às mãos dos romanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Três dias depois
  rationale: Expressa de modo natural a transição narrativa e a relação temporal, sem acrescentar um marcador equivalente a “agora” que não está explícito no grego.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: Paulo convocou
  rationale: O infinitivo dependente de ἐγένετο é convertido naturalmente em verbo finito; o nome esclarece o referente do pronome no versículo isolado.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: os principais líderes dos judeus
  rationale: πρώτους indica destaque e posição social. “Principais líderes” comunica que eram representantes proeminentes, não os primeiros em ordem temporal.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Quando eles se reuniram
  rationale: Converte o genitivo absoluto em uma oração temporal corrente em português.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: A forma de tratamento masculina dirige-se aos líderes judeus reunidos e expressa solidariedade. O pronome enfático fica implícito na forma verbal portuguesa, evitando uma construção artificial.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: embora eu não tenha feito nada contra
  rationale: A oração concessiva explicita a relação contextual entre a inocência alegada por Paulo e sua entrega como prisioneiro.
- source_word: τῷ λαῷ
  choice: o nosso povo
  rationale: Embora o grego diga literalmente “o povo”, o possessivo torna explícita em português a solidariedade judaica já presente no contexto e na expressão seguinte.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: os costumes de nossos antepassados
  rationale: “Antepassados” transmite com clareza atual a ideia de práticas herdadas dos pais ou ancestrais.
- source_word: δέσμιος
  choice: como prisioneiro
  rationale: Indica a condição jurídica e custodial de Paulo quando foi entregue.
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: fui entregue como prisioneiro, em Jerusalém, às mãos dos romanos
  rationale: Preserva a imagem idiomática de ser entregue às mãos de uma autoridade. “Em Jerusalém” evita sugerir incorretamente que sua transferência física direta de Jerusalém para Roma seja o ponto central, embora o grego use ἐξ para indicar a origem da entrega.
theological_decisions:
- issue: Forma de tratamento ἀδελφοί
  choice: Irmãos
  alternative: Irmãos e irmãs
  rationale: Os destinatários imediatos são os homens de destaque entre os judeus que Paulo convocou; a forma masculina preserva tanto o referente quanto a solidariedade expressa no grego.
- issue: Valor do particípio οὐδὲν ἐναντίον ποιήσας
  choice: 'concessivo: “embora eu não tenha feito nada contra”'
  alternative: 'circunstancial: “não tendo feito nada contra”'
  rationale: O contexto ressalta o contraste entre a inocência alegada por Paulo e sua entrega à custódia romana, sem decidir além disso qualquer questão jurídica ou doutrinária.
- issue: Agente não expresso de παρεδόθην
  choice: manter a voz passiva sem identificar o agente
  alternative: explicitar “os judeus me entregaram”
  rationale: O grego não nomeia aqui quem efetuou a entrega; preservar a passiva evita atribuir responsabilidade de maneira mais específica do que a fonte.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi descompactada para fluência narrativa, sem perder a transição temporal, a alegação de inocência, a condição de prisioneiro nem a imagem das “mãos” romanas.
