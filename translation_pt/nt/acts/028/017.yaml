    issue: «em Jerusalém» em vez de «de Jerusalém»
    rationale: ἐξ Ἱεροσολύμων exprime origem/procedência. «Em Jerusalém» substitui essa relação por uma simples localização.
  - severity: medium
    issue: «nosso povo» acrescenta um possessivo não expresso
    rationale: τῷ λαῷ é literalmente «o povo». A solidariedade de Paulo é contextual, mas não é necessário explicitá-la no texto principal.
  - severity: medium
    issue: 'Nota d: «ao poder dos romanos»'
    rationale: Não é uma alternativa lexical direta para εἰς τὰς χεῖρας τῶν Ῥωμαίων e introduz uma interpretação institucional. Uma alternativa segura é «fui entregue ... aos romanos».
