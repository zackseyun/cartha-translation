  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: pt
  text: 'dizendo: “Vá a este povo e diga: ‘Vocês certamente ouvirão, mas de modo nenhum entenderão; e, vendo, verão, mas de modo nenhum perceberão.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio presente que introduz e liga a citação à oração precedente.
- source_word: Πορεύθητι
  choice: Vá
  rationale: O imperativo de πορεύομαι expressa movimento e é vertido naturalmente pelo imperativo português “Vá”.
- source_word: λαὸν τοῦτον
  choice: este povo
  rationale: Mantém o sentido coletivo de λαός e o tom profético da citação de Isaías.
- source_word: εἰπόν
  choice: diga
  rationale: Equivalente direto e corrente do imperativo, adequado para introduzir discurso direto.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Vocês ouvirão atentamente
  rationale: A construção cognata de estilo semítico intensifica o ato de ouvir; “atentamente” comunica a ênfase sem reproduzir uma formulação pouco natural em português.
- source_word: οὐ μὴ συνῆτε
  choice: mas de modo nenhum entenderão
  rationale: “De modo nenhum” preserva a forte negação de οὐ μή, enquanto “entenderão” representa diretamente συνίημι.
- source_word: βλέποντες βλέψετε
  choice: olharão atentamente
  rationale: A combinação do particípio com o verbo cognato é enfática e paralela a Ἀκοῇ ἀκούσετε; a formulação comunica observação visual insistente em português natural.
- source_word: οὐ μὴ ἴδητε
  choice: mas de modo nenhum perceberão
  rationale: No contraste contextual entre contato sensorial e compreensão interior, “perceberão” expressa o alcance contextual de ὁράω, sem reduzir a frase à visão física.
theological_decisions:
- issue: Os verbos sensoriais da citação profética também indicam falta de compreensão interior.
  choice: Distinguir “olharão” de “perceberão”, mantendo o contraste entre exposição sensorial e apreensão interior.
  alternative: Repetir “verão” na última oração para conservar mais estritamente o vocabulário visual.
  rationale: O contexto sustenta a dimensão interior de ἴδητε, mas a tradução evita explicar a causa dessa incapacidade ou resolver a tensão profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância brasileira em “vocês”. A repetição cognata grega foi representada por advérbios de intensidade, preservando o paralelismo entre ouvir e olhar. A pontuação mantém a citação inserida na fala iniciada no versículo anterior.
