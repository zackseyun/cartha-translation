  to: 'Mas eles lhe disseram: “Nós não recebemos da Judeia nenhuma carta a seu respeito, nem nenhum dos irmãos[a] que veio relatou ou falou algo de mau sobre você.”'
  rationale: Substituiu-se “qualquer dos irmãos que chegou” por “nenhum dos irmãos que veio”, formulação mais idiomática em português que preserva a negação correlativa e o valor singular distributivo do grego. O restante do texto e a nota foram mantidos, pois refletem adequadamente o original e a ambiguidade contextual.
