  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: pt
  text: 'Mas eles lhe disseram: “Nós não recebemos da Judeia nenhuma carta a seu respeito, nem nenhum dos irmãos[a] que veio relatou ou falou algo de mau sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode referir-se a judeus vindos da Judeia; o texto não os identifica explicitamente como cristãos.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: Mas eles lhe disseram
  rationale: “Mas” expressa a transição levemente contrastiva de δέ na resposta; “lhe disseram” traduz de modo natural πρὸς αὐτὸν εἶπαν.
- source_word: Ἡμεῖς οὔτε γράμματα ... ἐδεξάμεθα
  choice: Nós não recebemos ... nenhuma carta
  rationale: Mantém o pronome explícito e enfático Ἡμεῖς e verte γράμματα pelo sentido contextual de correspondência escrita.
- source_word: περὶ σοῦ
  choice: a seu respeito
  rationale: Expressão portuguesa natural e digna para περί com genitivo neste contexto.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: da Judeia
  rationale: Tradução geográfica direta, sem acrescentar uma designação administrativa ausente do texto.
- source_word: οὔτε παραγενόμενός τις τῶν ἀδελφῶν
  choice: nem qualquer dos irmãos que chegou
  rationale: “Nem qualquer” preserva o segundo membro da negação correlativa; “que chegou” reflete o particípio singular παραγενόμενος sem acrescentar “aqui”, que está apenas implícito.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: relatou ou falou algo
  rationale: Distingue levemente o ato de trazer um relato do ato mais geral de falar, preservando a coordenação do grego.
- source_word: πονηρόν
  choice: de mau
  rationale: No contexto, designa conteúdo desfavorável ou prejudicial dito a respeito de Paulo; “algo de mau” conserva a formulação ampla do original.
theological_decisions:
- issue: Identidade dos “irmãos” (τῶν ἀδελφῶν)
  choice: irmãos
  alternative: compatriotas judeus; irmãos cristãos
  rationale: O contexto favorece a possibilidade de serem judeus vindos da Judeia, mas o texto não identifica explicitamente o grupo como judeus em geral nem como cristãos. A tradução mantém a expressão aberta do grego.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala mantém tom claro e digno, com a negação correlativa e a ambiguidade referencial do original preservadas.
