  source_fidelity: A tradução transmite corretamente a resposta, a dupla negação, a referência geográfica, a distinção leve entre relatar e falar, e o sentido amplo de πονηρόν. Contudo, γράμματα está no plural e é melhor vertido por “cartas”.
  naturalness: “Nem qualquer dos irmãos que chegou” é compreensível, mas soa pouco idiomático no português moderno. “Nem nenhum dos irmãos que veio” é mais natural e mantém o sentido de τις τῶν ἀδελφῶν.
  terminology: “Judeia”, “irmãos”, “relatou”, “falou” e “algo de mau” são adequados. A nota preserva corretamente a ambiguidade de ἀδελφῶν e não identifica indevidamente os irmãos como cristãos.
