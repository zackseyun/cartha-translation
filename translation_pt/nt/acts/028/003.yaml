source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: pt
  text: Quando Paulo juntou um feixe de gravetos e os colocou na fogueira, uma víbora saiu por causa do calor[a] e se prendeu à mão dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “saiu do calor”. A preposição grega pode ser traduzida mais literalmente dessa maneira, embora aqui provavelmente indique a causa: a víbora saiu por causa do calor da fogueira.'
    reason: lexical_alternative
  - marker: b
    text: Ou “agarrou a mão dele” ou “mordeu a mão dele”. O verbo grego tem o sentido mais amplo de prender-se ou apoderar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: juntou
  rationale: O particípio aoristo descreve a ação de Paulo anterior aos demais acontecimentos. No contexto de material para alimentar o fogo, o verbo indica reunir ou ajuntar, não literalmente torcer.
- source_word: φρυγάνων τι πλῆθος
  choice: um feixe de gravetos
  rationale: φρύγανα designa gravetos secos ou mato miúdo usado como combustível, e τι πλῆθος indica uma quantidade indefinida. “Um feixe de gravetos” é concreto e natural em português.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: os colocou na fogueira
  rationale: A expressão indica pôr o material recolhido sobre o fogo. “Fogueira” representa πυρά com clareza neste contexto narrativo.
- source_word: ἔχιδνα
  choice: uma víbora
  rationale: ἔχιδνα designa especificamente uma víbora, não apenas uma serpente genérica.
- source_word: ἀπὸ τῆς θέρμης
  choice: por causa do calor
  rationale: 'Embora ἀπό possa ser traduzido literalmente como “do” ou “desde o”, aqui a construção provavelmente expressa causa: o calor fez a víbora sair.'
- source_word: ἐξελθοῦσα
  choice: saiu
  rationale: O particípio aoristo modifica “víbora” e é expresso naturalmente em português por um verbo finito na sequência narrativa.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: se prendeu à mão dele
  rationale: καθάπτω pode significar prender-se, agarrar ou apoderar-se. A formulação preserva a imagem de a víbora ficar presa à mão sem especificar além do texto que ela a mordeu.
