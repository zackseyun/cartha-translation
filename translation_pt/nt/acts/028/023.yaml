  to: Depois de marcarem um dia com ele, mais pessoas foram até ele, na hospedagem onde estava.[a] Paulo lhes expunha o reino de Deus, dando solene testemunho e procurando convencê-los a respeito de Jesus com base tanto na Lei de Moisés como nos Profetas, desde a manhã até a noite.[b]
  rationale: Substituí “muitos outros” por “mais pessoas” para preservar o sentido comparativo de πλείονες sem acrescentar a noção de “outros”. Reordenei levemente a primeira frase e explicitei Paulo como sujeito da segunda para maior fluidez, sem alterar o sentido. A nota b foi ajustada para apresentar uma alternativa realmente distinta da opção adotada e para não atribuir ao verbo, isoladamente, um resultado persuasivo universal.
