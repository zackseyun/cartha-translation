id: ACT.28.23
reference: Acts 28:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: pt
  text: Depois de marcarem um dia com ele, mais pessoas foram até ele, na hospedagem onde estava.[a] Paulo lhes expunha o reino de Deus, dando solene testemunho e procurando convencê-los a respeito de Jesus com base tanto na Lei de Moisés como nos Profetas, desde a manhã até a noite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram até ele em sua hospedagem”. O termo grego pode indicar hospedagem, alojamento ou o lugar onde alguém está acomodado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “persuadindo-os”. O particípio grego descreve a atividade de persuasão e, por si só, não afirma que todos foram convencidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Depois de marcarem um dia com ele
  rationale: Expressa naturalmente a ideia idiomática de combinar ou fixar a data de um encontro; o dativo αὐτῷ é vertido como “com ele” no contexto.
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: foram até a hospedagem onde ele estava
  rationale: Traduz o movimento em direção a Paulo e torna claro, sem especificação indevida, que ξενία designa sua hospedagem ou acomodação.
- source_word: πλείονες
  choice: muitos outros
  rationale: 'Preserva o valor comparativo: compareceu um grupo maior do que o mencionado anteriormente, e não apenas “muitos” em sentido absoluto.'
- source_word: ἐξετίθετο
  choice: expunha
  rationale: O imperfeito indica exposição contínua; “expunha” é conciso, digno e adequado ao desenvolvimento cuidadoso de um assunto.
- source_word: διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus, dando testemunho solene
  rationale: Mantém a força enfática de διαμαρτύρομαι como testemunho sério e insistente, ligando-o ao reino de Deus.
- source_word: πείθων τε αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: e procurando convencê-los a respeito de Jesus
  rationale: Representa a atividade persuasiva em curso sem afirmar que todos foram efetivamente convencidos.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: com base tanto na Lei de Moisés como nos Profetas
  rationale: ἀπό indica aqui a fonte ou base escriturística da argumentação; a construção “tanto... como...” reflete τε...καί.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: desde a manhã até a noite
  rationale: Reproduz com naturalidade e precisão o período temporal, sem restringir πρωῒ necessariamente ao amanhecer.
theological_decisions:
- issue: Relação entre o reino de Deus e Jesus na exposição de Paulo
  choice: Apresentar ambos como aspectos unidos de uma exposição sustentada a partir da Lei e dos Profetas.
  alternative: Tratá-los como dois temas separados e sem ligação necessária.
  rationale: A sintaxe integra o testemunho sobre o reino e a persuasão a respeito de Jesus na mesma atividade expositiva, sem desenvolver além do texto uma sistematização teológica.
- issue: Resultado da tentativa de persuasão
  choice: “procurando convencê-los”
  alternative: “convencendo-os”
  rationale: O particípio πείθων pode descrever o ato ou esforço de persuadir; o contexto subsequente inclui reações divididas, de modo que a formulação escolhida preserva a ambiguidade quanto ao êxito entre todos os ouvintes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Paulo” explicita o sujeito implícito para evitar a sequência ambígua de pronomes. A ordem foi levemente reorganizada para fluidez, mantendo a ligação entre reino, Jesus e as Escrituras de Israel.
