  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: pt
  text: Então ele sacudiu o animal[a] para dentro do fogo e não sofreu mal algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fera” ou “a criatura”; o termo grego é geral, embora o contexto identifique o animal como uma cobra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Então ele
  rationale: O artigo tem função pronominal e retoma Paulo; μέν com οὖν marca uma transição narrativa leve. “Então ele” transmite essa continuação de modo natural.
- source_word: ἀποτινάξας
  choice: sacudiu
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. Em português, a sequência coordenada “sacudiu... e não sofreu” expressa com naturalidade essa ordem temporal.
- source_word: τὸ θηρίον
  choice: o animal
  rationale: θηρίον é um termo geral para animal, muitas vezes selvagem. O contexto o identifica como a cobra mencionada antes, mas o substantivo deste versículo não é específico; “animal” preserva essa generalidade.
- source_word: εἰς τὸ πῦρ
  choice: para dentro do fogo
  rationale: Reproduz claramente o movimento indicado por εἰς com acusativo e evita que a frase seja entendida apenas como ação realizada junto ao fogo.
- source_word: ἔπαθεν
  choice: sofreu
  rationale: πάσχω significa sofrer ou experimentar; com οὐδὲν κακόν, “não sofreu” forma uma expressão portuguesa idiomática.
- source_word: οὐδὲν κακόν
  choice: mal algum
  rationale: A expressão indica ausência de dano ou efeito nocivo. “Não sofreu mal algum” é clara, concisa e digna.
