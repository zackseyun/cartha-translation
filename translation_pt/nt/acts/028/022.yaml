source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: pt
  text: Mas consideramos apropriado ouvir de você o que pensa, pois, quanto a esta seita[a], sabemos que em toda parte se fala contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grupo”, “partido” ou “movimento”. Aqui, o grego αἵρεσις não significa necessariamente “heresia” no sentido técnico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: consideramos apropriado
  rationale: Expressa uma avaliação cortês de que ouvir Paulo é apropriado, sem sugerir exigência ou mérito.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: ouvir de você
  rationale: Preserva de modo natural a ideia de receber a explicação diretamente de Paulo.
- source_word: ἃ φρονεῖς
  choice: o que pensa
  rationale: Comunica de forma clara e corrente o ponto de vista ou a opinião de Paulo.
- source_word: αἱρέσεως
  choice: seita
  rationale: Designa aqui um grupo religioso reconhecível, sem implicar necessariamente o sentido técnico posterior de heresia; a nota registra alternativas menos carregadas.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: sabemos
  rationale: Reproduz com naturalidade em português o sentido da construção impessoal grega, evitando rigidez desnecessária.
- source_word: πανταχοῦ
  choice: em toda parte
  rationale: Equivalente locativo claro e abrangente.
- source_word: ἀντιλέγεται
  choice: se fala contra ela
  rationale: Mantém tanto a forma passiva/impessoal quanto o componente verbal de oposição expressa em palavras, em vez de reduzi-lo à ideia abstrata de oposição.
theological_decisions:
- issue: Sentido de αἵρεσις
  choice: seita
  alternative: heresia; grupo; partido; movimento
  rationale: No contexto, o termo identifica o movimento cristão visto por pessoas de fora, não uma doutrina formalmente condenada. “Heresia” importaria um sentido eclesiástico posterior; a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o tom cortês e relativamente formal dos interlocutores, enquanto “se fala contra ela” mantém a nuance discursiva de ἀντιλέγεται.
