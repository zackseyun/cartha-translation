  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: pt
  text: Mas, como os judeus se opunham[a][b], fui obrigado a apelar para César — não porque tivesse alguma acusação a fazer contra a minha nação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «enquanto os judeus se opunham a mim»; ou: «como os judeus me contradiziam».'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «os judeus» refere-se aos opositores judeus de Paulo neste contexto jurídico, não a todo o povo judeu de modo geral.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: como ... se opuseram
  rationale: O genitivo absoluto com particípio presente apresenta a circunstância que levou Paulo a agir. Em português, «como» comunica naturalmente o valor causal contextual, e «se opuseram» preserva a ideia de resistência sem limitar o sentido a uma contradição verbal.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste moderado com a declaração anterior e introduz o desenvolvimento seguinte.
- source_word: Ἰουδαίων
  choice: os judeus
  rationale: Reproduz o substantivo do grego sem acrescentar a especificação «líderes». O contexto delimita a referência aos opositores judeus de Paulo, esclarecimento registrado em nota.
- source_word: ἠναγκάσθην
  choice: fui obrigado
  rationale: Preserva a voz passiva e a noção de constrangimento ou necessidade, em linguagem portuguesa corrente e digna.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: apelar para César
  rationale: Expressa a fórmula jurídica de recorrer ao imperador e mantém «César», como no texto grego.
- source_word: οὐχ ὡς
  choice: não porque
  rationale: Introduz com naturalidade a explicação pela qual Paulo nega que sua apelação tivesse intenção acusatória contra seu próprio povo.
- source_word: τοῦ ἔθνους μου
  choice: a minha nação
  rationale: Conserva o sentido nacional e étnico corporativo de ἔθνος e o registro público-jurídico da frase.
- source_word: ἔχων τι κατηγορεῖν
  choice: tivesse alguma acusação a fazer contra
  rationale: Transmite de modo idiomático a construção «ter algo de que acusar», preservando o sentido forense de κατηγορεῖν.
theological_decisions:
- issue: Referência de «os judeus» em uma expressão étnica e religiosa potencialmente sensível
  choice: Manter «os judeus» no texto principal, como tradução direta de τῶν Ἰουδαίων.
  alternative: «os líderes judeus» ou «os judeus da Judeia»
  rationale: O grego não restringe explicitamente a expressão aos líderes nem emprega uma formulação geográfica inequívoca. O contexto, porém, mostra que se trata dos opositores ou acusadores judeus de Paulo, não de todo o povo judeu; a nota esclarece isso sem alterar o texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom jurídico do contexto sem recorrer a formulações excessivamente técnicas. A ordem dos marcadores foi regularizada para [a][b].
