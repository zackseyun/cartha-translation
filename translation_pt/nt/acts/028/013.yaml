    text: 'Ou: “depois de zarparmos”. O particípio grego περιελόντες é náutico e pode se referir especificamente a levantar âncora ou, de modo mais geral, a fazer-se ao mar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: De lá
  rationale: Transição espacial natural em português, preservando a referência ao lugar anterior.
- source_word: περιελόντες
  choice: depois de levantarmos âncora
  rationale: No contexto náutico, o particípio indica soltar ou retirar o que prendia o navio para seguir viagem; a formulação é clara e idiomática.
- source_word: κατηντήσαμεν
  choice: chegamos
  rationale: Expressa diretamente a chegada ao destino e se encaixa naturalmente na narrativa.
- source_word: Ῥήγιον
  choice: Régio
  rationale: Forma portuguesa tradicional do topônimo antigo Rhegium.
- source_word: μετὰ μίαν ἡμέραν
  choice: Um dia depois
  rationale: Equivalência temporal natural e precisa em português moderno.
- source_word: ἐπιγενομένου νότου
  choice: levantou-se um vento sul
  rationale: Reproduz a circunstância expressa pelo genitivo absoluto e usa uma colocação corrente para o surgimento do vento.
- source_word: δευτεραῖοι
  choice: no segundo dia
  rationale: Preserva de modo transparente a indicação de que a chegada ocorreu no segundo dia.
- source_word: ἤλθομεν
  choice: chegamos
  rationale: Com um destino expresso, 'chegamos' comunica naturalmente o movimento concluído.
- source_word: Ποτιόλους
  choice: Putéoli
  rationale: Forma portuguesa tradicional do topônimo, com acento para orientar a pronúncia.
