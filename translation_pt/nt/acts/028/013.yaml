  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: pt
  text: De lá, depois de levantarmos âncora[a], chegamos a Régio. Um dia depois, levantou-se um vento sul, e no segundo dia chegamos a Putéoli,
  philosophy: optimal-equivalence
  footnotes:
