translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa que havia alugado” evita o pouco natural “casa de aluguel”, enquanto as notas preservam a indefinição de μίσθωμα e a nuance espacial de εἰσπορευομένους. A vírgula final foi mantida porque o versículo continua em Atos 28:31.
