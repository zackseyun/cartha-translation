lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: permaneceu
  rationale: Expressa a permanência continuada de Paulo no lugar e mantém o caráter resumitivo do aoristo; é natural e digno em português.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo leve de continuidade narrativa, sem contraste forte.
- source_word: διετίαν ὅλην
  choice: durante dois anos inteiros
  rationale: Preserva tanto a extensão temporal quanto a ênfase de ὅλην na totalidade do período.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: numa casa que havia alugado
  rationale: μίσθωμα designa uma acomodação alugada. A formulação é clara e natural, enquanto ἰδίῳ indica que era mantida por arranjo próprio.
- source_word: ἀπεδέχετο
  choice: recebia com alegria
  rationale: O imperfeito indica uma prática contínua ou habitual; a expressão comunica a acolhida favorável implícita em ἀποδέχομαι sem restringi-la necessariamente à hospitalidade doméstica.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: todos os que iam visitá-lo
  rationale: A expressão torna natural em português o movimento de pessoas que entravam na acomodação para estar com Paulo; a nota preserva a forma mais literal.
