  text: E ele permaneceu por dois anos inteiros em um alojamento alugado por ele[a] e acolhia todos os que vinham até ele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua própria acomodação alugada”. O termo grego μίσθωμα se refere a uma acomodação ou alojamento alugado e não determina com precisão o tipo de moradia.'
