id: ACT.28.2
reference: Acts 28:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: pt
  text: E os habitantes locais nos trataram com uma bondade extraordinária[a][b], pois acenderam uma fogueira e acolheram a todos nós, por causa da chuva que havia começado e por causa do frio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos trataram com uma bondade fora do comum”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido como “habitantes locais” significa literalmente “bárbaros”, isto é, pessoas que não falavam grego; aqui se refere aos habitantes da ilha, sem necessariamente chamá-los de selvagens.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: habitantes locais
  rationale: Aqui, o termo designa os habitantes da ilha que não falavam grego, sem implicar necessariamente falta de civilização. “Habitantes locais” evita o sentido pejorativo moderno de “bárbaros” e o tom potencialmente colonial de “nativos”.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: uma bondade extraordinária
  rationale: A expressão idiomática significa uma bondade fora do comum. A formulação escolhida transmite esse sentido de modo claro e natural.
- source_word: παρεῖχον
  choice: nos trataram com
  rationale: Em combinação com φιλανθρωπίαν, expressa a manifestação concreta de benevolência; “nos trataram com uma bondade” é corrente em português.
- source_word: ἅψαντες πυράν
  choice: acenderam uma fogueira
  rationale: O particípio indica que acenderam o fogo como parte da acolhida. “Fogueira” representa naturalmente πυρά, um fogo aceso ao ar livre para aquecer o grupo.
- source_word: προσελάβοντο
  choice: acolheram
  rationale: O verbo indica que receberam o grupo de modo hospitaleiro, aqui junto à fogueira; “acolheram” preserva essa dimensão sem sugerir necessariamente hospedagem.
- source_word: πάντας ἡμᾶς
  choice: a todos nós
  rationale: Mantém a ênfase inclusiva do grego.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: por causa da chuva que havia começado
  rationale: O particípio perfeito descreve a chuva que sobreviera e continuava presente. A redação comunica o início e a persistência da chuva sem soar artificial.
- source_word: διὰ τὸ ψῦχος
  choice: por causa do frio
  rationale: Tradução direta e natural de ψῦχος.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a conexão narrativa inicial, a hospitalidade oferecida a todo o grupo e as duas causas expressas no grego. Os marcadores foram colocados junto às respectivas expressões: [a] para a formulação idiomática da bondade e [b] para βάρβαροι.'
