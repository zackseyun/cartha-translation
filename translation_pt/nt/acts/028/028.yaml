  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: pt
  text: Portanto, fique claro para vocês que esta salvação de Deus[a] foi enviada aos gentios; eles também ouvirão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta salvação vinda de Deus”. O genitivo grego admite mais de uma relação estreitamente ligada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles também escutarão” ou “darão ouvidos”. O verbo pode indicar tanto ouvir quanto escutar e responder, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Portanto, fique claro para vocês
  rationale: Reproduz a conclusão marcada por οὖν e o tom declarativo da construção imperativa, em português atual e natural.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: No contraste do contexto de Atos, ἔθνη designa os não judeus; “gentios” é mais preciso que “nações”.
- source_word: ἀπεστάλη
  choice: foi enviada
  rationale: O aoristo passivo apresenta o envio como ação realizada; o pretérito perfeito simples é a forma natural em português.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: esta salvação de Deus
  rationale: Mantém σωτήριον como “salvação” e conserva a amplitude do genitivo τοῦ θεοῦ sem reduzi-lo a “mensagem de salvação”.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: eles também ouvirão
  rationale: Preserva o sentido básico e a possível ambiguidade de ἀκούω entre ouvir e escutar com receptividade, enquanto “também” representa καί e a ênfase de αὐτοί.
theological_decisions:
- issue: Sentido de σωτήριον no contexto
  choice: salvação
  alternative: mensagem de salvação
  rationale: O termo grego designa salvação; explicá-lo como mensagem estreitaria indevidamente a amplitude da afirmação.
- issue: Relação expressa por τοῦ θεοῦ
  choice: de Deus
  alternative: vinda de Deus
  rationale: A formulação principal conserva a ambiguidade legítima do genitivo, que pode apontar para origem, pertencimento ou caracterização.
- issue: Força de ἀκούσονται
  choice: ouvirão
  alternative: escutarão / darão ouvidos
  rationale: “Ouvirão” mantém aberta a tensão entre simples audição e recepção obediente; a alternativa contextual é registrada em nota sem impor uma resposta teológica mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha os respectivos termos no texto, e todas as marcas aparecem no corpo do versículo.
