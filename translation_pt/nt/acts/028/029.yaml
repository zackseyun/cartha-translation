  verdict: revise
  source_fidelity: A tradução transmite adequadamente a sequência narrativa e a partida dos judeus. Contudo, «discutindo intensamente» muda a construção nominal grega («tendo muita discussão/debate») e explicita uma intensidade que, embora possível, é menos direta do que «muita discussão entre si».
  naturalness: «Foram embora» é natural em português moderno. «Depois que ele disse» é compreensível, mas «Tendo ele dito estas coisas» ou «Depois de dizer estas coisas» reflete melhor a construção participial sem sacrificar a fluidez. A forma proposta abaixo mantém registro narrativo claro e internacional.
  terminology: «Judeus» deve permanecer em minúscula como designação etnorreligiosa no uso editorial contemporâneo. A nota textual é substantivamente fiel ao registro inglês; «Códices Sinaítico e Vaticano» é mais claro do que empregar apenas os adjetivos como nomes de manuscritos.
  issues:
