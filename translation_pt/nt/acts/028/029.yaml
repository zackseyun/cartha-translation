    issue: «discutindo intensamente» em lugar de uma construção com «muita discussão»
    rationale: πολλὴν ... συζήτησιν é literalmente uma expressão nominal de quantidade. «Muita discussão entre si» conserva melhor a forma e a amplitude sem selecionar antecipadamente o grau de intensidade.
  - severity: low
    issue: «os judeus» com inicial minúscula
    rationale: Em português moderno, «judeus», quando designa o povo ou grupo religioso, normalmente se escreve em minúscula.
  - severity: low
    issue: Identificação abreviada dos manuscritos na nota
    rationale: A explicitação de «Códices Sinaítico e Vaticano» melhora a precisão e a legibilidade da nota, sem alterar sua avaliação crítica.
