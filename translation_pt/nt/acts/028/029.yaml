  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: pt
  text: Depois de ele dizer estas coisas,[a] os judeus foram embora, tendo muita discussão entre si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo inteiro não aparece nos manuscritos gregos mais antigos, incluindo o Papiro 74, do século 3, os Códices Sinaítico e Vaticano, ambos do século 4, nem nas antigas traduções coptas. Está presente na tradição majoritária bizantina, bem como em antigas traduções latinas e siríacas. É provável que seja uma expansão posterior de um copista, acrescentada para completar o relato da partida dos líderes judeus.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: discutindo intensamente
  rationale: O substantivo significa discussão, debate ou disputa. A construção verbal é mais natural em português e, com “intensamente”, preserva a força de πολλήν sem necessariamente sugerir uma briga aberta.
- source_word: ἀπέρχομαι
  choice: foram embora
  rationale: Expressão corrente e digna em português moderno para indicar que eles deixaram o local; evita o tom excessivamente formal de “retiraram-se”.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: Reproduz de modo idiomático a ideia de uma discussão ocorrida no próprio grupo.
