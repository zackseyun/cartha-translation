  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: pt
  text: 'Como estavam em desacordo uns com os outros, começaram a ir embora depois que Paulo disse uma última palavra[a]: “Foi com razão que o Espírito Santo falou por meio do profeta Isaías aos pais de vocês[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma palavra” ou “uma declaração”. O grego diz literalmente “uma palavra”, que aqui funciona como uma observação conclusiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos antepassados de vocês”. O grego diz “aos pais de vocês”, referindo-se aos antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι ... ὄντες πρὸς ἀλλήλους
  choice: como estavam em desacordo uns com os outros
  rationale: Expressa de modo natural o estado de discordância mútua indicado pela construção participial, sem sugerir mero desentendimento unilateral.
- source_word: ἀπελύοντο
  choice: começaram a ir embora
  rationale: A forma imperfeita, neste contexto, retrata o grupo no processo de se dispersar; a formulação comunica essa nuance de início e desenvolvimento.
- source_word: εἰπόντος τοῦ Παύλου
  choice: depois que Paulo disse
  rationale: A construção absoluta no genitivo indica a circunstância temporal anterior à saída, e εἰπόντος corresponde naturalmente a “disse”.
- source_word: ῥῆμα ἓν
  choice: uma última palavra
  rationale: Embora signifique literalmente “uma palavra”, aqui introduz a observação conclusiva de Paulo; “última” explicita essa função discursiva sem alterar seu conteúdo.
- source_word: Καλῶς
  choice: Foi com razão que
  rationale: Transmite a avaliação positiva de καλῶς — que o Espírito falou acertadamente — em português corrente e digno.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: É a designação portuguesa consagrada e preserva a referência pessoal e divina do texto.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: por meio do profeta Isaías
  rationale: Preserva o valor de mediação ou instrumentalidade de διά com o genitivo e mantém o título profético de Isaías.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: aos pais de vocês
  rationale: Mantém o termo masculino concreto πατέρας e a segunda pessoa plural, referindo-se aos antepassados de Israel.
theological_decisions:
- issue: Agência do Espírito Santo na fala profética
  choice: o Espírito Santo falou por meio do profeta Isaías
  alternative: Isaías falou inspirado pelo Espírito Santo
  rationale: A redação conserva a atribuição explícita da fala ao Espírito Santo e Isaías como seu mediador, sem introduzir uma formulação teológica que não esteja lexicalmente no versículo.
- issue: Referência de “pais de vocês”
  choice: aos pais de vocês
  alternative: aos antepassados de vocês
  rationale: A escolha preserva o masculino plural explícito do grego e a linguagem bíblica de continuidade histórica com os pais de Israel; a nota esclarece o sentido coletivo e ancestral.
- issue: Força avaliativa de καλῶς
  choice: Foi com razão que o Espírito Santo falou
  alternative: O Espírito Santo falou bem
  rationale: “Com razão” torna clara a ideia de que a declaração profética foi acertada, sem enfraquecer nem ampliar a afirmação do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura da citação é mantida sem aspas de fechamento porque a fala de Paulo continua no versículo seguinte.
