language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: pt
  text: 'Quando os habitantes da ilha viram o animal pendurado da mão dele[a], disseram uns aos outros: “Com certeza este homem é um assassino. Embora tenha escapado são e salvo do mar, a Justiça não permitiu que ele continuasse vivo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os nativos” ou, mais literalmente, “os bárbaros”, isto é, os habitantes locais que não falavam grego.
    reason: lexical_alternative
  - marker: b
    text: “Justiça” traduz o grego díkē, provavelmente personificado aqui como justiça retributiva; pode haver alusão a uma figura divina na compreensão pagã dos habitantes da ilha.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: os habitantes da ilha
  rationale: No contexto, o termo grego designa os moradores locais que não falavam grego, sem o sentido depreciativo que “bárbaros” costuma ter hoje. “Habitantes da ilha” identifica o referente com clareza.
- source_word: κρεμάμενον
  choice: pendurado
  rationale: Preserva a imagem do animal suspenso ou preso à mão de Paulo sem especificar além do que o particípio afirma.
- source_word: τὸ θηρίον
  choice: o animal
  rationale: O substantivo é genérico. Embora o contexto o identifique como uma serpente venenosa, “animal” evita antecipar uma especificação ausente neste ponto do grego.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: disseram uns aos outros
  rationale: Expressa explicitamente a reciprocidade. O pretérito perfeito é natural em português para introduzir a fala, embora o imperfeito grego possa sugerir fala continuada.
- source_word: Πάντως
  choice: Com certeza
  rationale: Comunica a forte convicção inferencial dos habitantes diante do que observavam.
- source_word: φονεύς
  choice: um assassino
  rationale: É o equivalente português direto para quem comete homicídio intencional.
- source_word: διασωθέντα
  choice: tenha escapado são e salvo
  rationale: Comunica que ele atravessou o perigo e sobreviveu, preservando o valor contextual do verbo sem introduzir conotação soteriológica.
- source_word: ἡ δίκη
  choice: a Justiça
  rationale: A inicial maiúscula sinaliza a personificação da justiça retributiva na visão dos habitantes, sem afirmar explicitamente que se trata do nome formal de uma deusa.
- source_word: ζῆν οὐκ εἴασεν
  choice: não permitiu que ele continuasse vivo
  rationale: Torna explícito o sentido idiomático de não lhe permitir seguir vivendo, em português natural.
- source_word: ἐκ τῆς θαλάσσης
  choice: do mar
  rationale: Traduz diretamente a origem indicada por ἐκ e, em combinação com “escapado são e salvo”, comunica a sobrevivência ao perigo marítimo sem redundância.
theological_decisions:
- issue: Personificação de δίκη
  choice: “a Justiça”, com inicial maiúscula
  alternative: “a justiça”, “a vingança” ou “a deusa Justiça”
  rationale: A formulação preserva a provável personificação da justiça retributiva no entendimento pagão dos habitantes, sem apresentar essa crença como endosso do narrador nem identificar de modo excessivamente específico uma divindade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da segunda frase foi ajustada para soar natural, preservando a concessão e o contraste do grego. Evitou-se “bárbaros” no texto principal por suas conotações depreciativas modernas.
