  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: pt
  text: Ali encontramos irmãos[a] e fomos convidados a ficar com eles sete dias. E assim chegamos a Roma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, mas, neste contexto, o termo provavelmente se refere ao conjunto dos que creem em Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Ali
  rationale: Advérbio relativo locativo que retoma Putéoli, mencionada no versículo anterior; “Ali” é natural em português.
- source_word: εὑρόντες
  choice: encontramos
  rationale: O particípio aoristo tem o mesmo sujeito do verbo principal e é expresso naturalmente como verbo finito, mantendo a sequência narrativa.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: Preserva a forma masculina do grego; neste contexto, o termo provavelmente designa os demais integrantes da comunidade cristã, conforme esclarece a nota.
- source_word: παρεκλήθημεν
  choice: fomos convidados
  rationale: O passivo de παρακαλέω, no contexto de hospitalidade, indica que os cristãos locais lhes fizeram um pedido ou convite para permanecer.
- source_word: παρ’ αὐτοῖς
  choice: com eles
  rationale: παρά com dativo expressa aqui permanência na companhia deles, possivelmente em suas casas.
- source_word: ἐπιμεῖναι
  choice: a ficar
  rationale: No contexto de viagem e hospedagem, “ficar” expressa de modo corrente o sentido de permanecer temporariamente.
- source_word: ἡμέρας ἑπτά
  choice: sete dias
  rationale: O acusativo indica extensão de tempo; em português, a duração fica clara sem preposição adicional.
- source_word: καὶ οὕτως
  choice: E assim
  rationale: Mantém a ligação narrativa e o sentido de progressão ou resultado sem rigidez estilística.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: chegamos a Roma
  rationale: ἔρχομαι com εἰς indica chegada ao destino; “chegamos a Roma” é idiomático e claro em português.
theological_decisions:
- issue: Referente de ἀδελφοὺς
  choice: integrantes da comunidade cristã local, mantendo “irmãos” no texto
  alternative: irmãos biológicos ou compatriotas judeus em sentido amplo
  rationale: Em contextos semelhantes de Atos, “irmãos” normalmente identifica outros cristãos; o convite para a permanência reforça esse sentido, embora o texto principal preserve a expressão lexical sem explicitação excessiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a primeira pessoa plural da narrativa de viagem e a repetição enfática do sujeito implícita na passagem do particípio ao verbo passivo.
