  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: pt
  text: Depois que isso aconteceu, os demais que estavam na ilha e tinham enfermidades também vinham e eram curados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Depois que isso aconteceu
  rationale: A construção genitiva absoluta estabelece a sequência temporal, e δέ marca a transição narrativa; a formulação é natural e mantém a referência ao acontecimento anterior.
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: os demais habitantes da ilha
  rationale: Expressa de modo conciso os outros que se encontravam na ilha, além do caso já narrado, sem sugerir que todos os habitantes estavam enfermos.
- source_word: ἔχοντες ἀσθενείας
  choice: que tinham enfermidades
  rationale: Preserva tanto o particípio de ἔχω, literalmente 'ter', quanto o plural ἀσθενείας, em linguagem digna e compreensível.
- source_word: προσήρχοντο
  choice: vinham
  rationale: O imperfeito retrata pessoas chegando repetidamente no decorrer da ação; não se acrescenta um complemento como 'a Paulo', pois ele não está explícito no grego.
- source_word: καὶ ἐθεραπεύοντο
  choice: também vinham e eram curados
  rationale: O segundo καί relaciona estes casos à cura anterior, enquanto o imperfeito passivo é preservado por 'eram curados'.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A tradução conserva o aspecto iterativo dos imperfeitos com 'vinham e eram curados' e evita explicitar o agente da cura, que não aparece nesta oração.
