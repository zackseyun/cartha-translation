translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas naturais para leitores brasileiros. A ordem foi reorganizada levemente para deixar claro que os três grupos de tropas deveriam seguir até Cesareia. Os marcadores foram colocados junto aos elementos que as respectivas notas explicam.
