source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: pt
  text: 'Então, chamando para junto de si dois dos centuriões, ele disse: “Preparem duzentos soldados, setenta cavaleiros e duzentos lanceiros[a] para seguirem até Cesareia, a partir da terceira hora da noite[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duzentos guardas do lado direito”; o sentido exato do raro termo traduzido como “lanceiros” é incerto.
    reason: lexical_alternative
  - marker: b
    text: Isto é, por volta da terceira hora da noite; numa divisão convencional da noite em doze horas, seria cerca de 21 horas, embora variasse conforme a estação.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: chamando para junto de si
  rationale: 'Expressa naturalmente o sentido do particípio médio: convocar alguém à própria presença, mantendo sua relação circunstancial com o verbo principal.'
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: dois dos centuriões
  rationale: O indefinido τινας não precisa ser reproduzido como “certos” em português; a expressão identifica naturalmente dois integrantes do grupo de centuriões.
- source_word: Ἑτοιμάσατε
  choice: Preparem
  rationale: Imperativo plural dirigido aos dois centuriões, adequado ao contexto de uma ordem militar.
- source_word: στρατιώτας διακοσίους
  choice: duzentos soldados
  rationale: Tradução direta da designação geral das tropas, distinta dos cavaleiros e dos δεξιολάβοι mencionados em seguida.
- source_word: ὅπως πορευθῶσιν
  choice: para seguirem
  rationale: Preserva a ideia de finalidade expressa por ὅπως com o subjuntivo e soa natural em português no contexto do deslocamento ordenado.
- source_word: ἕως Καισαρείας
  choice: até Cesareia
  rationale: Mantém o limite ou destino do percurso indicado por ἕως com genitivo.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: setenta cavaleiros
  rationale: Designa de modo conciso e claro as tropas montadas.
- source_word: δεξιολάβους διακοσίους
  choice: duzentos lanceiros
  rationale: “Lanceiros” é uma identificação militar plausível e compreensível para o termo raro, cuja referência exata permanece incerta; a incerteza é explicitada em nota.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: a partir da terceira hora da noite
  rationale: Conserva o valor básico de ἀπό como ponto inicial e mantém no texto a forma antiga de indicar a hora, esclarecida em nota.
