  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: pt
  text: Mas o filho da irmã de Paulo[a], ao saber da emboscada[b], veio, entrou no quartel[c] e contou isso a Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o sobrinho de Paulo.
    reason: lexical_alternative
  - marker: b
    text: Ou “tocaia”, “plano” ou “conspiração”. O termo grego se refere mais especificamente a uma emboscada, isto é, a ficar à espera para atacar.
    reason: lexical_alternative
  - marker: c
    text: Ou “acampamento”. Neste contexto, o termo provavelmente se refere ao quartel romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: ao saber
  rationale: O particípio aoristo tem valor temporal e indica que ele tomou conhecimento da emboscada antes de entrar no quartel e informar Paulo.
- source_word: δὲ
  choice: Mas
  rationale: 'Marca a mudança narrativa com leve contraste: o plano dos conspiradores passa a ser descoberto.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: o filho da irmã de Paulo
  rationale: Preserva de modo direto a formulação grega e identifica precisamente o parentesco, sem substituí-la no texto pela forma resumida “sobrinho de Paulo”.
- source_word: τὴν ἐνέδραν
  choice: a emboscada
  rationale: ἐνέδρα designa concretamente uma tocaia ou emboscada, sentido mais específico que “plano” ou “conspiração”.
- source_word: παραγενόμενος
  choice: veio
  rationale: O particípio indica que o rapaz chegou ao local antes de entrar; a forma coordenada é natural em português e mantém a sequência das ações.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: entrou no quartel
  rationale: παρεμβολή pode significar acampamento ou quartel. Neste contexto de custódia militar romana em Jerusalém, “quartel” comunica com clareza o referente provável.
- source_word: ἀπήγγειλεν
  choice: contou isso
  rationale: O verbo expressa comunicar ou relatar uma informação; “isso” retoma naturalmente a emboscada já mencionada.
- source_word: τῷ Παύλῳ
  choice: a Paulo
  rationale: Reproduz diretamente o dativo de destinatário.
