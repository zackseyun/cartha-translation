  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: pt
  text: Assim, os soldados, conforme lhes havia sido ordenado[a], tomaram Paulo e o levaram durante a noite[b] até Antípatris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com as ordens que haviam recebido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “pela noite”, isto é, durante a noite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Assim, os soldados
  rationale: οὖν dá continuidade à narrativa e indica o resultado da ordem anterior; μέν prepara o contraste ou a continuação do versículo seguinte, sem exigir tradução explícita em português.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: conforme lhes havia sido ordenado
  rationale: Preserva o sentido passivo do particípio perfeito de διατάσσω e a referência a uma ordem previamente dada, em português natural.
- source_word: ἀναλαβόντες
  choice: tomaram Paulo
  rationale: O particípio aoristo indica uma ação anterior ou associada ao verbo principal. “Tomaram” conserva o sentido básico sem acrescentar explicitamente a ideia de escolta.
- source_word: ἤγαγον
  choice: o levaram
  rationale: ἄγω pode significar conduzir ou levar; com o destino expresso, “levaram” é claro e idiomático.
- source_word: διὰ νυκτός
  choice: durante a noite
  rationale: A construção διά com o genitivo de νύξ expressa o período noturno, sem necessariamente afirmar que a viagem durou a noite inteira.
- source_word: Ἀντιπατρίδα
  choice: Antípatris
  rationale: Transliteração portuguesa corrente do nome da localidade, com acento para orientar a pronúncia.
theological_decisions: []
