  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: pt
  text: Quando amanheceu, os judeus[a] formaram uma conspiração e se colocaram sob maldição[b], declarando que não comeriam nem beberiam até matarem Paulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “os judeus” se refere a um grupo específico de judeus envolvido na conspiração, e não ao povo judeu como um todo.
    reason: cultural_note
  - marker: b
    text: Ou “impuseram a si mesmos uma maldição”. A expressão descreve um compromisso solene no qual invocavam juízo sobre si mesmos caso não o cumprissem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quando amanheceu
  rationale: O genitivo absoluto marca uma transição temporal. A formulação é natural em português e comunica com clareza a chegada do dia.
- source_word: ποιήσαντες συστροφὴν
  choice: formaram uma conspiração
  rationale: A expressão indica articulação coletiva e deliberada de uma trama. “Conspiração” preserva a ideia de coordenação para assassinar Paulo sem sugerir apenas um tumulto popular.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação explícita do texto grego. Uma nota esclarece que, no contexto, ela se refere ao grupo específico envolvido na trama, e não ao povo judeu inteiro.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: se comprometeram sob maldição
  rationale: Expressa um compromisso solene acompanhado de uma maldição invocada contra eles mesmos caso não o cumprissem. Evita o termo pouco transparente “anatematizaram-se”.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: declarando que não comeriam nem beberiam
  rationale: Apresenta naturalmente em português o conteúdo do compromisso e conserva a dupla negação coordenada.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: até matarem Paulo
  rationale: A oração marca o limite temporal do compromisso. O infinitivo flexionado é idiomático em português e preserva a ação pretendida sem acrescentar aspecto não expresso pelo grego.
