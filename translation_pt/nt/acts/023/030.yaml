  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: pt
  text: Quando fui informado de que haveria uma conspiração contra o homem, enviei-o imediatamente a você, ordenando também aos seus acusadores que apresentassem as acusações contra ele diante de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que falassem a ele diante de você”. No contexto judicial, isso significa apresentar acusações contra ele perante você.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Quando fui informado
  rationale: O particípio aoristo passivo em genitivo absoluto é expresso naturalmente como oração temporal, preservando a voz passiva.
- source_word: ἐπιβουλῆς
  choice: uma conspiração
  rationale: O substantivo designa um plano hostil ou uma trama. “Conspiração” é natural no contexto e não restringe o sentido a uma emboscada.
- source_word: εἰς τὸν ἄνδρα
  choice: contra o homem
  rationale: A preposição indica a direção hostil da conspiração, e “o homem” preserva a referência formal do texto a Paulo.
- source_word: ἔσεσθαι
  choice: de que haveria
  rationale: 'O infinitivo futuro comunica o conteúdo da informação recebida: a conspiração estava por ocorrer.'
- source_word: ἐξαυτῆς
  choice: imediatamente
  rationale: O advérbio expressa ação sem demora e combina com o registro oficial da carta.
- source_word: ἔπεμψα πρὸς σέ
  choice: enviei-o ... a você
  rationale: O objeto, Paulo, está implícito no grego e precisa ser explicitado para que a frase seja natural em português.
- source_word: παραγγείλας
  choice: ordenando também
  rationale: O particípio aoristo apresenta uma ação associada ao envio, enquanto καί acrescenta a ordem dada aos acusadores.
- source_word: τοῖς κατηγόροις
  choice: aos acusadores
  rationale: O termo tem sentido jurídico claro e se refere aos que acusavam Paulo.
- source_word: λέγειν πρὸς αὐτὸν
  choice: que apresentassem ... as acusações contra ele
  rationale: No contexto judicial, a expressão literalmente ligada a “falar contra ele” significa formular ou apresentar as acusações.
- source_word: ἐπὶ σοῦ
  choice: diante de você
  rationale: A expressão indica comparecimento perante Félix em sua qualidade de autoridade judicial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tom apropriado a uma carta oficial. A construção jurídica foi tornada explícita sem eliminar da nota a formulação mais literal do grego.
