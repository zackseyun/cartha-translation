revisions:
- from: Este homem foi agarrado pelos judeus[a] e estava prestes a ser morto por eles; então cheguei com a tropa e o resgatei, depois de saber que ele era romano.
  to: Este homem foi agarrado pelos judeus[a] e estava prestes a ser morto por eles; vim com a tropa e o resgatei, tendo sabido que ele é romano.
