  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: pt
  text: Este homem foi agarrado pelos judeus[a] e estava prestes a ser morto por eles; vim com a tropa e o resgatei, tendo sabido que ele é romano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelos habitantes da Judeia». O termo grego pode designar os judeus em sentido étnico-religioso ou os habitantes da Judeia; aqui provavelmente se refere à multidão ou aos opositores judeus em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: foi agarrado
  rationale: O particípio passivo indica que o homem foi apanhado à força. «Agarrado» preserva a ação hostil sem sugerir uma prisão formal.
- source_word: Ἰουδαίων
  choice: os judeus
  rationale: O termo pode designar judeus em sentido étnico-religioso ou habitantes da Judeia. Neste contexto, refere-se ao grupo judeu em Jerusalém que se opunha a Paulo; a alternativa geográfica é registrada em nota.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: estava prestes a ser morto
  rationale: A construção com μέλλω exprime iminência, e ἀναιρέω significa aqui matar. A formulação é clara e não acrescenta a ideia mais específica de assassinato.
- source_word: ἐπιστὰς
  choice: cheguei
  rationale: O particípio comunica chegada súbita e intervenção; «cheguei», unido ao resgate que se segue, preserva naturalmente esse sentido.
- source_word: σὺν τῷ στρατεύματι
  choice: com a tropa
  rationale: στράτευμα denota uma força ou destacamento militar. «A tropa» é natural e evita especificar o tamanho da unidade.
- source_word: ἐξειλάμην
  choice: o resgatei
  rationale: A forma média de ἐξαιρέω significa livrar ou resgatar alguém de um perigo, precisamente o sentido exigido pela ameaça de morte.
- source_word: μαθὼν
  choice: depois de saber
  rationale: O particípio aoristo apresenta o conhecimento como anterior ao resgate na formulação da carta. A tradução mantém essa relação sem corrigir o relato à luz da narrativa anterior.
- source_word: Ῥωμαῖός ἐστιν
  choice: ele era romano
  rationale: Ῥωμαῖος significa «romano» e, no contexto jurídico, implica cidadania romana. O imperfeito em português ajusta a declaração ao discurso epistolar passado sem negar a continuidade dessa condição.
theological_decisions:
- issue: Apresentação histórico-retórica na carta do comandante
  choice: Traduzir diretamente a alegação de que ele resgatou Paulo depois de saber que era romano.
  alternative: Reformular a sequência para harmonizá-la com Atos 21–22 ou sinalizar explicitamente que o comandante favorece a própria conduta.
  rationale: O versículo reproduz as palavras de Cláudio Lísias, cuja carta apresenta sua atuação favoravelmente. A tradução deve preservar a tensão com a narrativa anterior, sem corrigi-la nem explicá-la no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com coordenação natural. O ponto e vírgula organiza a frase longa sem introduzir contraste; «então» explicita apenas a progressão narrativa ligada ao particípio de chegada. A forma «romano» preserva a expressão grega, enquanto o contexto comunica a cidadania.
