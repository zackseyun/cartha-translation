  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: pt
  text: 'Então o comandante o tomou pela mão e, afastando-se com ele em particular, perguntou: “O que você tem para me comunicar?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: o tomou pela mão
  rationale: Expressa de modo natural e concreto o ato de tomar o jovem pela mão, sem sugerir força excessiva.
- source_word: δὲ
  choice: Então
  rationale: Marca com naturalidade a progressão da narrativa, sem impor um contraste forte.
- source_word: ὁ χιλίαρχος
  choice: o comandante
  rationale: Designa com clareza o oficial militar romano e evita termos técnicos pouco conhecidos, como “tribuno” ou “quiliarca”.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: afastando-se com ele em particular
  rationale: Preserva tanto o movimento para longe dos demais quanto o caráter privado da conversa; “com ele” explicita apenas o participante já evidente no contexto e torna a frase natural em português.
- source_word: ἐπυνθάνετο
  choice: perguntou
  rationale: O imperfeito grego pode apresentar o início ou o desenvolvimento da indagação, mas o pretérito perfeito é a forma narrativa mais natural em português, sem perda relevante no contexto.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: O que você tem para me comunicar?
  rationale: Reproduz de modo idiomático a construção grega e mantém em ἀπαγγεῖλαι o sentido de transmitir uma informação, adequado ao contexto oficial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, sem coloquialismo excessivo. Não são necessárias notas, pois as alternativas lexicais não alteram significativamente o sentido.
