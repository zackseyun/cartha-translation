base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: pt
  text: 'Então Paulo chamou um dos centuriões e disse: “Leve este jovem ao comandante, pois ele tem algo para lhe comunicar.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algo para lhe relatar” ou “algo para lhe dizer”. O verbo grego pode significar comunicar, anunciar ou relatar.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamou
  rationale: O particípio aoristo médio indica que Paulo chamou o centurião para junto de si antes de falar; “chamou” é natural e preserva esse sentido sem formalidade excessiva.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá prosseguimento à narrativa, sem marcar contraste forte; “então” expressa bem a sequência dos acontecimentos.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: um dos centuriões
  rationale: “Centurião” é o equivalente histórico consagrado para o posto militar romano ἑκατοντάρχης.
- source_word: ἔφη
  choice: disse
  rationale: Tradução direta e natural do verbo comum de fala φημί.
- source_word: νεανίαν
  choice: jovem
  rationale: νεανίας designa um homem jovem; “jovem” é claro e idiomático, e o demonstrativo masculino “este” torna explícito o referente.
- source_word: ἄπαγε
  choice: Leve
  rationale: O imperativo de ἀπάγω significa conduzir ou levar alguém até outra pessoa; “leve” é a ordem mais natural neste contexto.
- source_word: πρὸς τὸν χιλίαρχον
  choice: ao comandante
  rationale: χιλίαρχος designa aqui o oficial romano que comandava a tropa, tecnicamente um tribuno militar. “Comandante” é preciso no contexto e mais acessível ao leitor comum.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: pois ele tem algo para lhe comunicar
  rationale: A construção ἔχει + infinitivo indica ter algo a fazer ou dizer, e ἀπαγγέλλω pode significar comunicar, anunciar ou relatar. “Comunicar” preserva a amplitude lexical sem pressupor formalidade maior do que o grego exige.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem direta e o vocabulário militar consagrado mantêm a clareza narrativa. O pronome “lhe” retoma o comandante. O marcador da nota aparece imediatamente após a fala a que se refere.
