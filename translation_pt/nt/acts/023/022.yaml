  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: pt
  text: 'Então o comandante dispensou o jovem e lhe ordenou: “Não conte a ninguém que você me informou dessas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa o oficial romano que comandava uma coorte; “comandante” é claro em português atual e preserva sua autoridade sem recorrer ao termo técnico “tribuno”.
- source_word: ἀπέλυσε
  choice: dispensou
  rationale: No contexto, o oficial encerra a entrevista e manda o jovem embora. “Dispensou” evita sugerir que ele estivesse preso.
- source_word: νεανίσκον
  choice: jovem
  rationale: O termo indica um homem jovem. “Jovem” é natural, respeitoso e não especifica uma idade que o grego não determina.
- source_word: παραγγείλας
  choice: lhe ordenou
  rationale: O particípio expressa uma determinação com autoridade. A formulação coordenada soa natural em português e conserva a força da ordem.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Não conte a ninguém
  rationale: Expressa de modo idiomático e direto a proibição de divulgar a informação.
- source_word: ἐνεφάνισας
  choice: informou
  rationale: O verbo significa tornar conhecido, informar ou relatar, inclusive a uma autoridade. “Informou” é natural neste contexto e mantém o sentido sem excessiva tecnicidade.
- source_word: ταῦτα
  choice: dessas coisas
  rationale: Preserva a referência plural às informações que o jovem acabara de comunicar.
- source_word: πρὸς ἐμέ
  choice: me
  rationale: Com o verbo de comunicação, πρός com acusativo indica o destinatário; o pronome átono produz a forma portuguesa mais natural.
