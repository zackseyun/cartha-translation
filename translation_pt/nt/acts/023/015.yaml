source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: pt
  text: Agora, portanto, vocês, juntamente com o Conselho, comuniquem ao comandante para que ele o faça descer até vocês[a], como se estivessem prestes a examinar mais cuidadosamente as questões a respeito dele[b]. Nós, porém, estamos prontos para matá-lo antes que ele se aproxime[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o leve à presença de vocês”. O verbo grego inclui literalmente a ideia de fazê-lo descer.
    reason: lexical_alternative
  - marker: b
    text: Ou “como se fossem investigar o caso dele com maior precisão”. A formulação indica o pretexto de um novo exame judicial.
    reason: lexical_alternative
  - marker: c
    text: Ou “antes que ele chegue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: comuniquem
  rationale: O imperativo pede que o assunto seja formalmente levado ao conhecimento da autoridade. “Comuniquem” é natural e não especifica em excesso que se trata de um pedido, embora o contexto implique isso.
- source_word: χιλιάρχῳ
  choice: comandante
  rationale: Designa o oficial romano que comandava uma coorte. “Comandante” é claro para leitores atuais, sem recorrer ao termo técnico “tribuno”.
- source_word: σὺν τῷ συνεδρίῳ
  choice: juntamente com o Conselho
  rationale: Preserva a ideia de associação expressa por σύν. “Conselho”, com inicial maiúscula, identifica de modo acessível o conhecido órgão governante judaico sem exigir o termo técnico “Sinédrio”.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: ele o faça descer até vocês
  rationale: Mantém a nuance direcional de κατάγω, “fazer descer” ou “levar para baixo”, ao mesmo tempo que soa compreensível em português.
- source_word: ὡς μέλλοντας
  choice: como se pretendessem
  rationale: Expressa a intenção alegada e enganosa apresentada pelos conspiradores, sem explicitar mais do que a construção grega.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: examinar com mais cuidado
  rationale: Comunica uma investigação judicial mais minuciosa. “Com mais cuidado” é idiomático e preserva o valor comparativo de ἀκριβέστερον.
- source_word: τὰ περὶ αὐτοῦ
  choice: os fatos a respeito dele
  rationale: Representa de modo claro a expressão grega relativa às questões ou circunstâncias concernentes a Paulo, sem reduzi-la necessariamente ao termo técnico “caso”.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: antes que ele se aproxime
  rationale: Preserva tanto a anterioridade temporal quanto a nuance espacial de ἐγγίζω, “aproximar-se”.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: para matá-lo
  rationale: ἀναιρέω significa aqui matar ou eliminar. “Matá-lo” é direto e não acrescenta a avaliação explícita contida em “assassiná-lo”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento no plural usa “vocês”, e a sintaxe mantém o tom formal da comunicação dirigida à autoridade sem se tornar técnica. As notas preservam alternativas legítimas e as nuances de direção, pretexto judicial e aproximação.
