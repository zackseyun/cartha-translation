  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: pt
  text: 'Então levantou-se um grande clamor. Alguns escribas do grupo dos fariseus se puseram de pé e discutiam energicamente, dizendo: “Não encontramos mal algum neste homem. Mas, se um espírito[b] ou um anjo lhe falou—”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase termina abruptamente no texto grego: “Mas, se um espírito lhe falou ou um anjo—”.'
    reason: textual_variant
  - marker: b
    text: Ou “o Espírito”. Aqui, porém, o contraste com “um anjo” favorece o sentido mais geral de um ser espiritual.
    reason: alternative_reading
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: um grande clamor
  rationale: Expressa o alvoroço coletivo indicado por κραυγή e preserva a intensidade de μεγάλη em português natural.
- source_word: ἀναστάντες
  choice: se puseram de pé
  rationale: Mantém a ação física e sugere que os escribas tomaram a palavra diante do conselho.
- source_word: τινὲς τῶν γραμματέων
  choice: alguns escribas
  rationale: “Escribas” é o termo direto e reconhecível para especialistas judeus na Lei nesse contexto.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: do grupo dos fariseus
  rationale: μέρος designa aqui uma facção ou grupo dentro do conselho; “grupo” é claro e não sugere necessariamente um partido político moderno.
- source_word: διεμάχοντο
  choice: discutiam energicamente
  rationale: O imperfeito retrata uma disputa em andamento, e o verbo intensivo comunica argumentação vigorosa.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Não encontramos mal algum
  rationale: Preserva a formulação de constatação judicial e o sentido de ausência de culpa ou conduta censurável.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: neste homem
  rationale: Refere-se especificamente a Paulo e mantém a forma concreta do grego.
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Segue de perto a construção condicional e permite conservar a frase inacabada, sem completar o raciocínio dos oradores.
- source_word: πνεῦμα
  choice: um espírito
  rationale: No contraste com “um anjo”, a referência mais provável é a um ser espiritual em sentido geral; a tradução evita identificar o termo de modo categórico com o Espírito Santo.
- source_word: ἐλάλησεν αὐτῷ
  choice: falou com ele
  rationale: Traduz de modo natural o aoristo e preserva a possibilidade de comunicação dirigida a Paulo.
- source_word: ἄγγελος
  choice: um anjo
  rationale: O contexto sobrenatural favorece “anjo”, não o sentido genérico de mensageiro humano.
theological_decisions:
- issue: Sentido de πνεῦμα em contraste com ἄγγελος
  choice: um espírito, entendido de modo geral como ser espiritual
  alternative: o Espírito
  rationale: A coordenação “um espírito ou um anjo” reflete categorias de seres espirituais e não exige uma identificação com o Espírito Santo. A nota conserva a possibilidade discutida sem impô-la ao texto.
- issue: Frase condicional final incompleta
  choice: manter a interrupção com travessão
  alternative: 'completar como pergunta: “E se um espírito ou um anjo falou com ele?”'
  rationale: O texto grego termina abruptamente. Manter o travessão preserva a forma e a tensão do enunciado sem acrescentar uma conclusão implícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Escribas” e “fariseus” preservam os termos históricos conhecidos; “discutiam energicamente” comunica a intensidade sem recorrer a linguagem arcaica. O travessão final reproduz deliberadamente a interrupção do grego.
