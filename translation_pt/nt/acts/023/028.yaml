  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: pt
  text: E, querendo saber de que acusação o acusavam, levei-o para baixo ao conselho deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao Sinédrio deles». O termo grego συνέδριον se refere a um conselho; neste contexto, provavelmente designa o conselho governante judaico em Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: querendo
  rationale: O particípio expressa a intenção de Lísias e liga naturalmente seu desejo de saber à ação seguinte.
- source_word: τε
  choice: E
  rationale: A partícula conecta levemente esta oração ao relato anterior; «E» preserva o fluxo do relatório formal.
- source_word: ἐπιγνῶναι
  choice: saber
  rationale: O infinitivo indica o propósito; «saber» é natural e mantém a ideia de obter conhecimento da questão.
- source_word: τὴν αἰτίαν
  choice: a acusação
  rationale: No contexto jurídico, αἰτία designa a matéria ou fundamento da acusação. «A acusação» evita sugerir uma imputação formal já claramente definida.
- source_word: δι’ ἣν
  choice: pela qual
  rationale: Mantém explícita a relação da oração relativa com «a acusação».
- source_word: ἐνεκάλουν αὐτῷ
  choice: o denunciavam
  rationale: ἐγκαλέω com dativo significa apresentar acusação contra alguém; «denunciavam» comunica o sentido jurídico, enquanto o imperfeito sugere a ação em curso.
- source_word: κατήγαγον
  choice: levei-o para baixo
  rationale: Preserva o detalhe espacial de κατά no verbo, embora sua relevância topográfica exata não seja explicitada.
- source_word: συνέδριον
  choice: conselho
  rationale: Traduz o sentido lexical geral sem impor no texto principal o nome tradicional «Sinédrio»; o contexto aponta para o conselho governante judaico.
- source_word: αὐτῶν
  choice: deles
  rationale: Reproduz diretamente o pronome e associa o conselho aos acusadores mencionados no contexto.
