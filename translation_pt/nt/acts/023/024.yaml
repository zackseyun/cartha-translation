id: ACT.23.24
reference: Acts 23:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: pt
  text: e que providenciassem animais de montaria[a], para pôr Paulo sobre um deles e levá-lo em segurança ao governador Félix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “animais” ou “animais de carga”; o grego não especifica que tipo de animal era.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: animais de montaria
  rationale: O termo designa genericamente animais usados para carga ou montaria, sem especificar cavalos; a expressão é natural em português e evita determinar a espécie.
- source_word: τε
  choice: e
  rationale: Liga esta instrução às ordens anteriores de maneira simples e idiomática.
- source_word: παραστῆσαι
  choice: providenciassem
  rationale: No contexto da ordem, indica fazer com que os animais estivessem disponíveis ou preparados.
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade da providência ordenada, com formulação corrente em português.
- source_word: ἐπιβιβάσαντες
  choice: pôr Paulo sobre um deles
  rationale: O particípio indica fazer Paulo montar. A coordenação com o verbo principal expressa naturalmente a sequência sem perder o valor circunstancial.
- source_word: διασώσωσι
  choice: levá-lo em segurança
  rationale: Expressa tanto o deslocamento até o destino quanto a preservação de Paulo durante o trajeto.
- source_word: πρὸς
  choice: ao
  rationale: Indica movimento em direção a uma pessoa, aqui Félix.
- source_word: ἡγεμόνα
  choice: governador
  rationale: É a designação portuguesa clara e convencional para o oficial que governava a província romana.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Animais de montaria” preserva a generalidade de κτήνη; “sobre um deles” evita sugerir que Paulo seria colocado simultaneamente sobre vários animais, embora o plural indique que mais de um deveria ser disponibilizado.
