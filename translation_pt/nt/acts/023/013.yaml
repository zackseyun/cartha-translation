  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: pt
  text: Eram mais de quarenta os que haviam formado essa conspiração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: mais de quarenta
  rationale: A construção comparativa com o numeral significa idiomaticamente “mais de quarenta”. A formulação é clara e preserva a força quantitativa sem acrescentar um substantivo ausente do grego.
- source_word: συνωμοσίαν
  choice: conspiração
  rationale: O substantivo designa uma conspiração ou acordo secreto. “Conspiração” reproduz com precisão seu sentido formal, sem importar para o termo detalhes do contexto mais amplo.
- source_word: ποιησάμενοι
  choice: haviam formado
  rationale: O particípio aoristo médio de ποιέω, empregado com συνωμοσίαν, expressa os que fizeram ou formaram a conspiração. “Haviam formado” é natural em português e explicita corretamente a anterioridade em relação a ἦσαν.
- source_word: ἦσαν δὲ
  choice: Eram
  rationale: A oração apresenta a quantidade dos integrantes do grupo. “Eram mais de quarenta” é uma construção idiomática em português; a conexão leve de δέ pode permanecer implícita no fluxo narrativo.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: os que haviam formado essa conspiração
  rationale: O artigo com o particípio tem função substantivada, isto é, “aqueles que”. “Os que” conserva essa referência de modo natural e conciso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Eram mais de quarenta os que...” preserva a ênfase quantitativa e soa natural. Não se incluiu nota para “mais de quarenta/mais que quarenta”, pois a alternativa não representa diferença real de sentido em português.
