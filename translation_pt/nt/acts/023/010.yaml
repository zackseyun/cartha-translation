  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: pt
  text: Quando surgiu uma grande discussão[a], o comandante, temendo que Paulo fosse despedaçado por eles[b], ordenou que a tropa descesse, o arrancasse do meio deles e o levasse para o quartel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quando surgiu uma grande dissensão” ou “Quando se levantou um grande tumulto”. A palavra grega pode indicar forte conflito interno e, em outros contextos, agitação civil.
    reason: lexical_alternative
  - marker: b
    text: Ou “fosse rasgado em pedaços por eles”, preservando de modo mais literal a força vívida do grego.
    reason: lexical_alternative
  - marker: c
    text: “Quartel” traduz uma palavra que, mais literalmente, significa “acampamento”; aqui ela se refere às instalações militares romanas em Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: Quando a discussão se tornou intensa
  rationale: O genitivo absoluto introduz a circunstância. στάσις pode indicar dissensão, conflito ou tumulto; no contexto, trata-se de uma disputa interna que se agrava. A formulação preserva πολλῆς sem sugerir necessariamente uma revolta formal.
- source_word: φοβηθεὶς ὁ χιλίαρχος
  choice: o comandante, temendo
  rationale: χιλίαρχος designa o oficial romano que comandava a unidade; “comandante” é claro e acessível. O particípio aoristo expressa o temor que motivou a ordem.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: que Paulo fosse despedaçado por eles
  rationale: διασπάω é uma expressão vívida de separação violenta. “Fosse” mantém o resultado apenas temido, não consumado.
- source_word: τὸ στράτευμα
  choice: a tropa
  rationale: O substantivo coletivo denota o contingente de soldados sob as ordens do comandante; “a tropa” preserva esse valor coletivo.
- source_word: καταβὰν
  choice: descesse
  rationale: Preserva o movimento para baixo, da área da fortaleza até o local onde o conselho estava reunido, e integra naturalmente a sequência de ordens.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: o arrancasse do meio deles
  rationale: ἁρπάζω comunica retirada súbita e à força. “Arrancasse” preserva essa intensidade, adequada ao resgate de Paulo da multidão hostil.
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: e o levasse para o quartel
  rationale: ἄγω indica conduzir ou levar ao destino; παρεμβολή significa literalmente acampamento, mas aqui se refere às instalações militares romanas.
