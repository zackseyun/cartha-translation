  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: pt
  text: Portanto, não se deixe persuadir por eles, pois mais de quarenta homens dentre eles estão à espreita para emboscá-lo. Eles se sujeitaram a uma maldição[a], de não comer nem beber até que o matem. Agora estão prontos, esperando a promessa da sua parte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram um juramento sob pena de maldição”; a expressão grega inclui a ideia de invocarem uma maldição sobre si mesmos caso não cumprissem o compromisso.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, aguardam a sua concordância ou autorização.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: não se deixe persuadir
  rationale: Preserva a forma passiva e a ideia de não permitir que o pedido deles o convença, sem ampliar para o sentido mais interpretativo de simplesmente não lhes dar ouvidos.
- source_word: ἐνεδρεύουσιν
  choice: estão de emboscada
  rationale: Mantém a imagem concreta de homens à espera para um ataque oculto, em vez de reduzir o verbo à ideia geral de conspirar.
- source_word: ἐξ αὐτῶν
  choice: dentre eles
  rationale: Indica que os mais de quarenta homens procedem do grupo anteriormente mencionado.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: mais de quarenta homens
  rationale: Reproduz de maneira natural e precisa o comparativo seguido do numeral.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: se comprometeram sob maldição
  rationale: Expressa tanto o compromisso solene quanto a imprecação contra si mesmos caso não o cumprissem.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: a não comer nem beber
  rationale: Conserva a estrutura correlativa da proibição assumida por eles.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: até que o matem
  rationale: Neste contexto, ἀναιρέω indica matar; a construção portuguesa mantém a orientação futura da cláusula temporal.
- source_word: εἰσιν ἕτοιμοι
  choice: estão prontos
  rationale: Tradução direta, clara e natural da cópula com o adjetivo.
- source_word: προσδεχόμενοι
  choice: esperando
  rationale: Comunica a espera expectante indicada pelo particípio.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: a promessa da sua parte
  rationale: Mantém o sentido lexical comum de ἐπαγγελία e a origem indicada por ἀπὸ σοῦ, deixando a nota esclarecer a referência contextual à concordância ou autorização do comandante.
