  - severity: low
    issue: A nota b usa o pretérito imperfeito (“esperavam”), embora o texto grego e a tradução estejam no presente.
    rationale: 'A nota explicativa deve acompanhar o aspecto temporal do texto: eles estão agora aguardando a concordância ou autorização.'
