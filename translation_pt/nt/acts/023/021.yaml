review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a advertência, o número de homens, a emboscada, o voto de abstinência até matarem Paulo e a expectativa de uma promessa/autorização do comandante. Contudo, “se comprometeram sob maldição” atenua a construção reflexiva ἀνεθεμάτισαν ἑαυτούς, que indica sujeitarem-se a uma maldição caso falhassem.
  naturalness: O texto é claro e de registro apropriado. “Estão à espreita para emboscá-lo” é mais idiomático e explícito em português moderno do que “estão de emboscada contra ele”, sem ultrapassar o sentido do verbo grego.
  terminology: “Sujeitaram-se a uma maldição” preserva melhor o elemento de autoimprecação do que “se comprometeram sob maldição”. “Promessa da sua parte” mantém a ambiguidade lexical de ἐπαγγελία; a nota esclarece o provável referente contextual sem o substituir no texto.
  issues:
