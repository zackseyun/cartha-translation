source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: pt
  text: Pois os saduceus dizem que não há ressurreição, nem anjo nem espírito; os fariseus, porém, reconhecem ambas as coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou pode-se entender: “os fariseus reconhecem as três coisas” — isto é, ressurreição, anjo e espírito. O grego diz “ambas as coisas”, expressão que aponta mais diretamente para “anjo” e “espírito”, embora alguns a entendam de modo mais amplo com base no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: os saduceus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
- source_word: μὲν γὰρ
  choice: Pois
  rationale: Expressa de modo natural o valor explicativo da combinação de partículas no contexto.
- source_word: λέγουσιν μὴ εἶναι
  choice: dizem que não há
  rationale: Construção idiomática em português que preserva a afirmação genérica no presente e a negação de existência.
- source_word: ἀνάστασιν
  choice: ressurreição
  rationale: Refere-se à ressurreição como realidade ou categoria, sem exigir artigo indefinido em português.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: nem anjo nem espírito
  rationale: Preserva a negação correlativa e os substantivos no singular, com formulação compacta e natural.
- source_word: Φαρισαῖοι
  choice: os fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
- source_word: ὁμολογοῦσιν
  choice: reconhecem
  rationale: No contexto, o verbo significa admitir ou afirmar como verdadeiro; “reconhecem” evita sentidos penitenciais que “confessam” poderia sugerir.
- source_word: τὰ ἀμφότερα
  choice: ambas as coisas
  rationale: Reproduz explicitamente o sentido de “ambas”, apontando mais diretamente para o par imediatamente anterior, “anjo” e “espírito”, sem substituir o grego por “as três coisas”.
theological_decisions:
- issue: Alcance de “ambas as coisas” na afirmação dos fariseus
  choice: Manter “ambas as coisas”, permitindo que a referência mais direta seja a anjo e espírito.
  alternative: 'Entender a expressão, de maneira mais ampla, como referência às três realidades mencionadas: ressurreição, anjo e espírito.'
  rationale: O grego traz τὰ ἀμφότερα, literalmente “ambas as coisas”, e não “todas” ou “as três”. O par coordenado imediatamente anterior é “anjo” e “espírito”. Contudo, o contexto e a crença farisaica na ressurreição tornam plausível uma compreensão mais abrangente, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula e a construção deslocada “os fariseus, porém” tornam claro o contraste entre os dois grupos sem acrescentar conteúdo interpretativo.
