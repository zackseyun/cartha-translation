  text: ὁ δὲ ἀρχιερεὺς Ἁνανίας ἐπέταξεν τοῖς παρεστῶσιν αὐτῷ τύπτειν αὐτοῦ τὸ στόμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: pt
  text: Mas o sumo sacerdote Ananias ordenou aos que estavam ao lado dele que batessem na boca de Paulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que dessem uma bofetada na boca de Paulo”. O verbo grego pode indicar um golpe em sentido geral; “dessem uma bofetada” é uma tradução possível, porém mais específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a reação abrupta à declaração anterior de Paulo, com valor adversativo leve, sem exagerar o contraste.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Equivalente português consagrado e preciso para o título singular neste contexto.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Expressa uma ordem dada com autoridade e soa natural no português atual.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: aos que estavam ao lado dele
  rationale: Preserva o sentido espacial de pessoas presentes junto de Ananias sem pressupor uma função oficial de assistentes.
- source_word: τύπτειν
  choice: que batessem
  rationale: Mantém o sentido amplo de golpear, sem especificar indevidamente que se tratava de uma bofetada.
- source_word: αὐτοῦ τὸ στόμα
  choice: na boca de Paulo
  rationale: A explicitação do referente evita a ambiguidade pronominal criada em português pelos dois homens mencionados e comunica de modo idiomático o alvo do golpe.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece próxima do grego, mas explicita Paulo no complemento para eliminar uma ambiguidade referencial não pretendida em português.
