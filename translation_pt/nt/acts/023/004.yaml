  source_fidelity: A tradução transmite adequadamente οἱ δὲ παρεστῶτες, εἶπαν, ἀρχιερέα τοῦ θεοῦ e λοιδορεῖς. «Os que estavam ali» é um equivalente natural para os presentes, embora seja um pouco menos explicitamente espacial que «os que estavam por perto»; não altera o sentido de modo relevante. A pergunta preserva o tom repreensivo do presente grego.
