base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: pt
  text: 'Os que estavam ali disseram: “Você está insultando o sumo sacerdote de Deus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Os que estavam ali
  rationale: O particípio substantivado designa as pessoas presentes junto de Paulo. A formulação é natural em português e mantém a ideia espacial sem acrescentar uma identificação não expressa.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo indicativo faz a narrativa avançar e corresponde naturalmente ao pretérito perfeito em português.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: Neste contexto, ἀρχιερεύς se refere ao sumo sacerdote judeu; “sumo sacerdote” é o equivalente português tradicional, preciso e amplamente compreensível.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: A construção genitiva relaciona o ofício sacerdotal a Deus. “O sumo sacerdote de Deus” preserva de modo direto a forma e a ambiguidade relacional do grego.
- source_word: λοιδορεῖς
  choice: está insultando
  rationale: λοιδορέω denota insultar, injuriar ou dirigir palavras ofensivas a alguém. “Está insultando” é claro, atual e adequado ao tom de repreensão da pergunta.
theological_decisions:
- issue: Força de τοῦ θεοῦ em referência ao sumo sacerdote
  choice: “o sumo sacerdote de Deus”, sem explicitar aprovação divina da conduta pessoal de quem ocupava o cargo
  alternative: “o sumo sacerdote pertencente a Deus” ou uma formulação que implique endosso divino pessoal
  rationale: A expressão relaciona o ofício a Deus, mas o versículo não desenvolve a natureza dessa relação nem declara aprovação da conduta do ocupante. A tradução preserva essa tensão sem interpretação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você”, adequado à legibilidade brasileira e amplamente inteligível. A pergunta mantém o caráter direto e repreensivo do original.
