lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Depois de ler a carta
  rationale: O particípio aoristo indica uma ação anterior; o objeto é a carta mencionada no contexto. Explicitar “a carta” produz clareza natural em português.
- source_word: δὲ
  choice: —
  rationale: Aqui δέ funciona como conectivo discursivo leve; a progressão natural da narrativa em português dispensa uma tradução explícita.
- source_word: καὶ ἐπερωτήσας
  choice: o governador perguntou
  rationale: O particípio aoristo coordenado descreve a ação seguinte. O sujeito “o governador” é explicitado a partir do contexto para evitar ambiguidade, já que “Paulo” também aparece na oração.
- source_word: ἐκ ποίας ἐπαρχείας ἐστὶν
  choice: de que província Paulo era
  rationale: ἐπαρχεία designa uma província administrativa romana. A formulação é corrente em português e conserva esse sentido.
- source_word: καὶ πυθόμενος
  choice: e, ao saber
  rationale: O particípio médio expressa a obtenção da informação; “ao saber” comunica com naturalidade a sequência circunstancial.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: que era da Cilícia
  rationale: ἀπό com o topônimo indica origem. “Ser da Cilícia” é uma expressão direta e idiomática em português.
- source_word: Κιλικίας
  choice: Cilícia
  rationale: Forma portuguesa consagrada do nome da província romana.
