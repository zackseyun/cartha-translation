source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: pt
  text: Enquanto ele dizia isso, surgiu uma controvérsia entre os fariseus e os saduceus, e a assembleia ficou dividida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Enquanto ele dizia isso
  rationale: O genitivo absoluto com particípio presente indica ação contemporânea; “enquanto” preserva claramente esse aspecto em português natural.
- source_word: ἐγένετο
  choice: surgiu
  rationale: Com στάσις, exprime o início ou aparecimento do conflito; “surgiu” é idiomático e adequado à narrativa.
- source_word: στάσις
  choice: controvérsia
  rationale: Neste contexto, denota dissensão ou conflito entre grupos. “Controvérsia” comunica um desacordo aberto sem sugerir necessariamente violência física.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: entre os fariseus e os saduceus
  rationale: A preposição “entre” explicita naturalmente em português que os dois grupos eram as partes opostas na controvérsia.
- source_word: ἐσχίσθη
  choice: ficou dividida
  rationale: O passivo de σχίζω descreve a separação do grupo em facções; “ficou dividida” preserva o sentido e soa natural.
- source_word: τὸ πλῆθος
  choice: a assembleia
  rationale: Refere-se ao corpo reunido no contexto do conselho, não a uma multidão casual; “assembleia” conserva esse caráter coletivo e formal.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a simultaneidade da fala de Paulo e o desenvolvimento em duas etapas: primeiro surge a controvérsia, depois a assembleia se divide.'
