  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: pt
  text: 'Paulo, olhando atentamente para o conselho, disse: “Irmãos, até o dia de hoje tenho vivido[a] diante de Deus com toda a boa consciência.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho me conduzido como cidadão diante de Deus”, preservando a possível nuance cívica do verbo grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: olhando atentamente
  rationale: O particípio aoristo de ἀτενίζω indica um olhar dirigido e firme; a expressão é natural em português e conserva essa intensidade.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui δέ é um conectivo narrativo brando. O português moderno não exige uma conjunção neste ponto, e a transição permanece clara.
- source_word: τῷ συνεδρίῳ
  choice: para o conselho
  rationale: συνέδριον designa neste contexto o conselho dirigente judaico. “Conselho” traduz o substantivo comum sem recorrer à transliteração interpretativa “Sinédrio”.
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: É uma forma convencional de tratamento dirigida a homens. “Irmãos” comunica naturalmente o vocativo, sem a rigidez de “homens irmãos”.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: com a consciência inteiramente limpa
  rationale: A expressão dativa indica modo, e πάσῃ dá força abrangente à afirmação. Em português, “consciência limpa” é idiomático para uma consciência moralmente boa; “inteiramente” conserva a intensificação.
- source_word: πεπολίτευμαι
  choice: tenho vivido
  rationale: O perfeito de πολιτεύομαι descreve a conduta de vida até o presente, embora possa conservar uma nuance cívica. “Tenho vivido” transmite de modo natural o alcance retrospectivo e contínuo sem impor uma leitura política.
- source_word: τῷ θεῷ
  choice: diante de Deus
  rationale: Nesse contexto, o dativo exprime a vida conduzida em relação a Deus e sob seu olhar. “Diante de Deus” é idiomático e se harmoniza com a referência à consciência.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: até o dia de hoje
  rationale: A expressão assinala continuidade do passado até o momento da fala e é clara e natural em português.
theological_decisions:
- issue: Alcance da autodescrição de Paulo em πεπολίτευμαι
  choice: Uma afirmação geral sobre sua conduta de vida diante de Deus, com consciência limpa.
  alternative: Uma referência explícita à conduta como cidadão, ou uma declaração de impecabilidade absoluta.
  rationale: O verbo pode conter ressonância cívica, mas o contexto enfatiza a conduta moral e religiosa avaliada pela consciência diante de Deus. A tradução não transforma a frase nem em reivindicação técnica de cidadania nem em afirmação de perfeição sem pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para fluência natural, e a nuance cívica possível de πολιτεύομαι foi preservada na documentação lexical, sem sobrecarregar o texto principal.
