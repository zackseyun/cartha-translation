  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: pt
  text: No dia seguinte, deixaram que os cavaleiros prosseguissem com ele e voltaram para o quartel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acampamento”. O termo grego pode designar um acampamento ou instalações militares; aqui, provavelmente se refere ao quartel ou à fortaleza romana em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: A expressão temporal significa “no dia seguinte”. O δέ funciona como transição narrativa suave e não precisa ser explicitado por uma conjunção adversativa em português.
- source_word: ἐάσαντες
  choice: deixaram que
  rationale: O particípio aoristo de ἐάω indica permitir que os cavaleiros continuassem; a construção finita é natural e clara em português.
- source_word: τοὺς ἱππεῖς
  choice: os cavaleiros
  rationale: Designa soldados montados. “Cavaleiros” mantém concisão e proximidade lexical sem recorrer ao termo coletivo mais técnico “cavalaria”.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: prosseguissem com ele
  rationale: No contexto da escolta, os cavaleiros continuaram a viagem acompanhando Paulo, enquanto os demais voltaram. “Prosseguissem” comunica esse movimento sem acrescentar um destino não expresso.
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: Expressa diretamente o sentido comum de retornar ou voltar.
- source_word: εἰς τὴν παρεμβολήν
  choice: para o quartel
  rationale: παρεμβολή pode significar acampamento ou instalações militares; neste contexto, refere-se provavelmente ao quartel ou fortaleza romana em Jerusalém. A alternativa lexical é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A relação temporal do particípio é mantida pela sequência verbal, e a ambiguidade de παρεμβολή é registrada em nota.
