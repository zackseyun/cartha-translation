id: ACT.23.5
reference: Acts 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: pt
  text: 'E Paulo disse: “Eu não sabia, irmãos, que ele é o sumo sacerdote, pois está escrito: ‘Não fale mal de um governante do seu povo.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não insulte um governante do seu povo.”'
    reason: Alternativa lexical para οὐκ ἐρεῖς κακῶς, que pode expressar fala injuriosa ou insultante.
lexical_decisions:
- source_word: ἔφη τε
  choice: E Paulo disse
  rationale: τέ funciona como conectivo leve, e ἔφη introduz a fala direta; “E Paulo disse” mantém com naturalidade o fluxo narrativo.
- source_word: Οὐκ ᾔδειν
  choice: Eu não sabia
  rationale: Expressa diretamente a falta de conhecimento indicada por οἶδα nessa forma verbal, sem especificar se Paulo não reconheceu a pessoa ou desconhecia seu cargo.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo masculino plural é apropriado para Paulo se dirigir aos membros do conselho e preserva a forma do texto-fonte.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: que ele é o sumo sacerdote
  rationale: Mantém o presente de ἐστίν e traduz ἀρχιερεύς pelo título convencional e claro “sumo sacerdote”.
- source_word: γέγραπται γὰρ
  choice: pois está escrito
  rationale: É a fórmula portuguesa corrente para introduzir uma citação autoritativa das Escrituras e preserva o valor resultativo do perfeito passivo.
- source_word: Ἄρχοντα
  choice: um governante
  rationale: O substantivo sem artigo tem sentido genérico; “governante” comunica a autoridade civil ou comunitária sem estreitar indevidamente o referente.
- source_word: τοῦ λαοῦ σου
  choice: do seu povo
  rationale: Preserva a linguagem comunitária de λαός e a segunda pessoa singular da citação.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Não fale mal
  rationale: O futuro funciona como proibição. “Não fale mal” é natural e acessível, mantendo a amplitude de κακῶς sem impor necessariamente a ideia mais forte de insulto.
theological_decisions:
- issue: Sentido da declaração de Paulo sobre não saber
  choice: Eu não sabia... que ele é o sumo sacerdote
  alternative: Eu não reconheci... que ele era o sumo sacerdote
  rationale: A tradução preserva a afirmação sem decidir por que Paulo não sabia nem harmonizá-la com hipóteses históricas ou interpretativas; o presente grego também é mantido.
- issue: Forma da citação das Escrituras
  choice: 'pois está escrito: ‘Não fale mal de um governante do seu povo.’'
  alternative: 'pois está escrito: ‘Não insulte um governante do seu povo.’'
  rationale: A fórmula tradicional conserva a autoridade da citação, enquanto “fale mal” reproduz a amplitude semântica de κακῶς; a alternativa mais forte é registrada em nota.
- issue: Referência de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Neste contexto, Paulo se dirige ao conselho governante, composto por homens; a forma masculina é gramatical e contextualmente adequada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e a estrutura da fala foram preservadas, evitando arcaísmos; “sumo sacerdote” e “está escrito” mantêm terminologia bíblica amplamente reconhecida.
