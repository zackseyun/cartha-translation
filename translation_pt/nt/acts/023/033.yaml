  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: pt
  text: Quando entraram em Cesareia e entregaram a carta ao governador, também apresentaram Paulo ao governador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também levaram Paulo à presença do governador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: eles (implícito nas formas verbais)
  rationale: O pronome retoma a escolta do versículo anterior. Em português, o sujeito pode ficar naturalmente implícito em “entraram”, “entregaram” e “apresentaram”.
- source_word: εἰσελθόντες
  choice: quando entraram
  rationale: O particípio aoristo indica ação anterior às ações principais; a oração temporal reproduz essa relação com clareza e naturalidade.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἀναδόντες
  choice: entregaram
  rationale: No contexto do envio de uma comunicação oficial, expressa adequadamente a entrega formal da carta sem tornar a linguagem excessivamente técnica.
- source_word: ἐπιστολήν
  choice: carta
  rationale: Equivalente comum, claro e apropriado para a comunicação escrita oficial mencionada no contexto.
- source_word: ἡγεμόνι
  choice: governador
  rationale: Designação clara e convencional para a autoridade provincial romana aqui mencionada, sem impor um título administrativo mais específico.
- source_word: παρέστησαν
  choice: apresentaram
  rationale: No contexto oficial e judicial, transmite a ideia de fazer Paulo comparecer diante da autoridade.
- source_word: καὶ
  choice: também
  rationale: 'O segundo καί tem valor aditivo: além de entregarem a carta, os homens apresentaram Paulo.'
- source_word: Παῦλον
  choice: Paulo
  rationale: Forma tradicional do nome Παῦλος em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo retoma o governador e combina naturalmente com “apresentaram”, evitando repetição desnecessária.
