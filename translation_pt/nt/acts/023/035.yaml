  source_fidelity: 'O texto traduz adequadamente a declaração judicial de Félix: «Ouvirei o seu caso» transmite de modo idiomático Διακούσομαί σου sem impor a possível nuance de completude; «quando também chegarem os seus acusadores» preserva a contingência futura de ὅταν com subjuntivo, o sentido jurídico de κατήγοροι e o καί. A ordem de manter Paulo sob guarda no pretório de Herodes representa corretamente κελεύσας ... φυλάσσεσθαι αὐτόν. A explicitação de «Paulo» é contextual e não altera o referente de αὐτόν.'
