  register: Português moderno, digno e acessível, com sintaxe narrativa natural. Emprega-se “pretório” no texto e uma nota cultural para explicá-lo; evita-se acrescentar “por completo”, preservando a possível nuance de διακούω sem sobretraduzi-la.
