  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: pt
  text: “Ouvirei o seu caso”, disse ele, “quando também chegarem os seus acusadores”. Então ordenou que Paulo fosse mantido sob guarda no pretório de Herodes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pretório era a residência ou sede oficial do governador romano; aqui, provavelmente se refere ao palácio de Herodes em Cesareia.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Ouvirei o seu caso
  rationale: O verbo διακούω pode indicar ouvir de modo completo; no contexto judicial, “ouvir o seu caso” comunica naturalmente a realização da audiência sem tornar explícito demais o aspecto de completude, cuja força exata permanece discutível.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: quando também chegarem os seus acusadores
  rationale: ὅταν com o subjuntivo expressa uma contingência futura; καί é preservado por “também”, e κατήγοροι designa acusadores em sentido jurídico.
- source_word: κελεύσας
  choice: Então ordenou
  rationale: O particípio aoristo é vertido como verbo finito para produzir narrativa natural em português e indicar a ação subsequente.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: no pretório de Herodes
  rationale: “Pretório” preserva o termo histórico-administrativo para a residência ou sede oficial do governador, aqui associada a Herodes.
- source_word: φυλάσσεσθαι αὐτόν
  choice: que Paulo fosse mantido sob guarda
  rationale: A construção passiva indica custódia contínua. O nome “Paulo”, recuperado do contexto, evita ambiguidade pronominal e é natural em português.
