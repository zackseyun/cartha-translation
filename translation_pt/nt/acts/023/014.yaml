source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: pt
  text: 'Esses homens foram aos principais sacerdotes e aos anciãos e disseram: “Nós nos comprometemos, sob maldição, a não provar nada até matarmos Paulo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Eles
  rationale: O pronome relativo qualitativo retoma os conspiradores do versículo anterior; “Eles” mantém a coesão narrativa em português sem acrescentar um substantivo ausente do grego.
- source_word: προσελθόντες
  choice: foram até
  rationale: O particípio aoristo indica uma ação anterior a “disseram”; “foram até” é natural no contexto narrativo e não pressupõe a posição espacial do narrador.
- source_word: ἀρχιερεῦσιν
  choice: chefes dos sacerdotes
  rationale: Designa o grupo dirigente sacerdotal; esta forma é clara para leitores modernos e evita sugerir a existência simultânea de vários sumos sacerdotes em exercício.
- source_word: πρεσβυτέροις
  choice: líderes do povo
  rationale: Neste contexto institucional, o termo se refere a dirigentes reconhecidos, não apenas a homens de idade avançada; a expressão comunica a função com clareza.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: nos colocamos sob maldição, jurando
  rationale: A construção cognata exprime um juramento autoimprecatório. A formulação preserva tanto a maldição invocada contra si mesmos quanto o caráter solene do compromisso.
- source_word: μηδενὸς γεύσασθαι
  choice: não provar nada
  rationale: Mantém a imagem literal de γεύομαι e a negação enfática, abrangendo a abstinência de alimento.
- source_word: ἕως οὗ ἀποκτείνωμεν
  choice: até matarmos
  rationale: Reproduz de modo natural o limite temporal e o evento pretendido, sem acrescentar uma classificação jurídica como “assassinar”.
- source_word: τὸν Παῦλον
  choice: Paulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome Παῦλος.
theological_decisions:
- issue: Sentido da fórmula de juramento Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: nos colocamos sob maldição, jurando
  alternative: nos obrigamos sob maldição
  rationale: A escolha torna explícito que se trata de um juramento autoimprecatório, sem importar o sentido eclesiástico posterior de “anátema” nem reduzir a frase a um simples voto solene.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada à narrativa portuguesa, preservando a força severa do juramento e a expressão concreta “não provar nada”.
