review_pass:
  verdict: revise
  source_fidelity: A formulação do juramento autoimprecatório e o limite temporal são, em geral, bem transmitidos. Contudo, “líderes do povo” acrescenta “do povo”, elemento que o grego não expressa, e torna menos específico o termo institucional πρεσβυτέροις.
  naturalness: O texto é fluente. “Nós nos comprometemos, sob maldição” é uma forma moderna e natural que conserva a ideia de um compromisso assumido com autopenalidade.
  terminology: “Principais sacerdotes” traduz ἀρχιερεῖς como título coletivo no contexto do templo. “Anciãos” é o equivalente institucional direto de πρεσβυτέροις e evita tanto o acréscimo interpretativo quanto a generalização de “líderes do povo”.
  issues:
  - severity: medium
    issue: “líderes do povo” para πρεσβυτέροις
    rationale: Embora os anciãos fossem líderes, “do povo” não está no texto-fonte, e “líderes” deixa de representar o grupo identificado pelo termo grego. “Anciãos” preserva a designação institucional sem acrescentar conteúdo.
  - severity: low
    issue: “chefes dos sacerdotes” para ἀρχιερεῖς
    rationale: A expressão é compreensível, mas “principais sacerdotes” é uma designação mais estabelecida e diretamente correspondente ao plural coletivo grego, sem sugerir que se trate apenas de chefes funcionais de sacerdotes.
  revised_text: 'Esses homens foram aos principais sacerdotes e aos anciãos e disseram: “Nós nos comprometemos, sob maldição, a não provar nada até matarmos Paulo.”'
