source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: pt
  text: 'Ele disse: “Os judeus combinaram pedir que amanhã você faça Paulo descer ao Sinédrio, como se fossem apurar algo com mais precisão a respeito dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: Ele respondeu
  rationale: Embora o verbo signifique literalmente “disse”, neste diálogo “respondeu” expressa naturalmente a função da fala em português.
- source_word: Οἱ Ἰουδαῖοι
  choice: Os judeus
  rationale: Mantém a forma explícita do grego sem restringi-la a “líderes”; o contexto identifica o grupo envolvido na trama, não todo o povo judeu.
- source_word: συνέθεντο
  choice: combinaram
  rationale: Expressa um acordo ou plano conjunto de modo natural, sem atribuir ao verbo isoladamente uma ideia mais forte de conspiração.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: pedir
  rationale: Neste contexto, ἐρωτάω indica fazer um pedido ao comandante; a construção portuguesa incorpora naturalmente o objeto “você” na oração seguinte.
- source_word: καταγάγῃς
  choice: leve ... para baixo
  rationale: Preserva a força direcional de κατάγω, pois Paulo seria conduzido da fortaleza ao local do conselho.
- source_word: συνέδριον
  choice: Sinédrio
  rationale: O referente é especificamente o conselho dirigente judaico de Jerusalém, para o qual “Sinédrio” é o termo institucional claro e corrente.
- source_word: ὡς
  choice: como se
  rationale: Introduz a aparência ou o pretexto do pedido sem explicitar além do texto a intenção enganosa.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: fossem investigar o caso dele com mais exatidão
  rationale: “Investigar” comunica a obtenção de informação mediante perguntas; “com mais exatidão” conserva o comparativo ἀκριβέστερον, e “o caso dele” verte idiomaticamente τι ... περὶ αὐτοῦ.
theological_decisions:
- issue: Referência de “os judeus” em um contexto narrativo hostil
  choice: Manter “Os judeus” como tradução direta de Οἱ Ἰουδαῖοι
  alternative: Os líderes judeus / os judeus envolvidos na trama
  rationale: O grego não restringe expressamente o referente aos líderes. A tradução preserva essa forma, enquanto o contexto imediato delimita o grupo aos participantes do plano contra Paulo, sem fazer uma afirmação coletiva sobre todos os judeus.
- issue: Caráter fingido da investigação proposta
  choice: como se fossem investigar
  alternative: sob o pretexto de que investigariam
  rationale: “Como se” preserva a sutileza de ὡς e a tensão narrativa, sem transformar a implicação contextual em explicação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Sinédrio” mantém a precisão institucional; “para baixo” preserva o movimento espacial, embora seja menos idiomático que simplesmente “leve”. Não foram necessárias notas de rodapé.
