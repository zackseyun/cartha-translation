  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: pt
  text: 'Então ele o levou ao comandante e disse: “O prisioneiro Paulo me chamou e pediu que eu trouxesse este jovem até o senhor, pois ele tem algo para lhe dizer.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: ele o levou
  rationale: Os dois verbos descrevem a ação de tomar o jovem consigo e conduzi-lo ao destino. Em português, “o levou” expressa naturalmente o movimento sem uma repetição pesada.
- source_word: χιλίαρχον
  choice: comandante
  rationale: Designa o oficial militar romano responsável pela unidade. “Comandante” é claro e atual; “tribuno” seria historicamente específico, mas menos acessível.
- source_word: φησίν
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa portuguesa.
- source_word: δέσμιος
  choice: prisioneiro
  rationale: Refere-se a alguém sob custódia ou preso; “prisioneiro” é direto e adequado ao contexto.
- source_word: προσκαλεσάμενός με
  choice: me chamou
  rationale: Indica que Paulo chamou o oficial para junto de si. A forma concisa é natural em português e o contexto esclarece a direção.
- source_word: ἠρώτησεν
  choice: pediu
  rationale: Aqui ἐρωτάω expressa um pedido, não uma pergunta. “Pediu” comunica essa função com precisão.
- source_word: νεανίαν
  choice: jovem
  rationale: νεανίας designa um homem jovem. “Jovem” é uma forma natural e suficientemente clara no contexto.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: pois ele tem algo para lhe dizer
  rationale: A oração participial caracteriza o jovem e explica o pedido. “Pois” transmite esse valor explicativo sem tornar a causalidade excessivamente rígida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “o senhor/lhe” marca respeito ao superior militar sem recorrer ao formalismo arcaico de “vós”.
