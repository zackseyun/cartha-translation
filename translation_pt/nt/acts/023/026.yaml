  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: pt
  text: 'Cláudio Lísias, ao excelentíssimo governador Félix: saudações.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Cláudio Lísias
  rationale: Nomes pessoais transliterados segundo a forma tradicional e corrente em português.
- source_word: τῷ κρατίστῳ
  choice: ao excelentíssimo
  rationale: O superlativo κρατίστῳ funciona aqui como tratamento honorífico formal. “Excelentíssimo” preserva com naturalidade o tom oficial em português.
- source_word: ἡγεμόνι
  choice: governador
  rationale: No contexto da administração provincial romana, “governador” é o equivalente claro e suficientemente amplo, sem impor um título técnico mais específico do que o grego.
- source_word: Φήλικι
  choice: Félix
  rationale: Emprega-se a forma tradicional do nome em português.
- source_word: χαίρειν
  choice: saudações
  rationale: Na abertura de uma carta, χαίρειν é uma fórmula epistolar convencional; “saudações” comunica sua função idiomática, em vez do sentido literal possível de “alegrar-se”.
