  naturalness: «Uma parte era de saduceus» é compreensível, mas «era composta de» é mais idiomático e claro em português moderno. «A respeito da» expressa naturalmente o valor de περί no contexto judicial. «Homens, irmãos» conserva de modo deliberadamente formal os dois vocativos gregos e pode permanecer.
  terminology: «Conselho», com a alternativa «Sinédrio» em nota, é uma solução apropriada para συνέδριον. Os nomes dos grupos e os termos «esperança», «ressurreição» e «mortos» estão consistentes com o original e com o registro bíblico moderno.
