revisions:
- from: 'Mas Paulo, sabendo que uma parte era de saduceus e a outra, de fariseus, clamou no conselho[a]: “Homens, irmãos, eu sou fariseu, filho de fariseus[b]. É por causa da esperança e da ressurreição dos mortos[c] que estou sendo julgado.”'
  to: 'Mas Paulo, sabendo que uma parte era composta de saduceus e a outra, de fariseus, clamou no conselho[a]: “Homens, irmãos, eu sou fariseu, filho de fariseus[b]. É a respeito da esperança e da ressurreição dos mortos[c] que estou sendo julgado.”'
  rationale: A revisão substitui uma formulação levemente elíptica por uma construção idiomática e ajusta «por causa de» para «a respeito de», que preserva melhor o valor temático de περί e a ambiguidade do original. As notas permanecem ancoradas nos mesmos pontos e continuam registrando as alternativas contextuais e sintáticas relevantes.
