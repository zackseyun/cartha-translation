id: ACT.23.6
reference: Acts 23:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: pt
  text: 'Mas Paulo, sabendo que uma parte era composta de saduceus e a outra, de fariseus, clamou no conselho[a]: “Homens, irmãos, eu sou fariseu, filho de fariseus[b]. É a respeito da esperança e da ressurreição dos mortos[c] que estou sendo julgado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Sinédrio”. A palavra grega pode designar especificamente o conselho governante judaico.
    reason: lexical_alternative
  - marker: b
    text: Ou “filho de pais fariseus” ou “descendente de fariseus”.
    reason: alternative_reading
  - marker: c
    text: Ou “É a respeito da esperança da ressurreição dos mortos que estou sendo julgado”.
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: sabendo
  rationale: O particípio aoristo apresenta a circunstância que motivou a ação de Paulo; “sabendo” preserva de modo conciso a forma participial.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: uma parte ... a outra
  rationale: Mantém a imagem de duas partes dentro do conselho e soa natural em português.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: saduceus / fariseus
  rationale: São as formas tradicionais e amplamente reconhecidas em português para os dois grupos judaicos.
- source_word: ἔκραζεν
  choice: clamou
  rationale: Expressa uma fala pública em voz alta, preservando a força de κράζω sem recorrer a uma formulação excessivamente coloquial.
- source_word: ἐν τῷ συνεδρίῳ
  choice: no conselho
  rationale: Traduz de forma transparente συνέδριον; no contexto, trata-se do conselho governante judaico, possibilidade explicitada em nota.
- source_word: Ἄνδρες ἀδελφοί
  choice: Homens, irmãos
  rationale: Preserva os dois vocativos do grego, embora a formulação seja mais marcada que o simples “Irmãos” em português corrente.
- source_word: Φαρισαῖός εἰμι
  choice: eu sou fariseu
  rationale: Reproduz diretamente a identificação de Paulo no presente.
- source_word: υἱὸς Φαρισαίων
  choice: filho de fariseus
  rationale: Mantém o plural e o idioma familiar do grego sem determinar se a expressão se refere especificamente aos pais ou à ascendência mais ampla.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: por causa da esperança e da ressurreição dos mortos
  rationale: Preserva a coordenação entre “esperança” e “ressurreição” e deixa aberta a possibilidade de serem dois conceitos estreitamente ligados ou uma esperança centrada na ressurreição.
- source_word: κρίνομαι
  choice: estou sendo julgado
  rationale: Conserva o aspecto presente e a voz passiva da situação judicial de Paulo.
theological_decisions:
- issue: Sentido de υἱὸς Φαρισαίων
  choice: filho de fariseus
  alternative: filho de pais fariseus; descendente de fariseus
  rationale: O plural grego admite mais de uma nuance. A tradução mantém o idioma familiar sem impor uma afirmação histórica mais específica que o texto.
- issue: Relação entre “esperança” e “ressurreição”
  choice: a esperança e a ressurreição dos mortos
  alternative: a esperança da ressurreição dos mortos
  rationale: O grego coordena ἐλπίδος e ἀναστάσεως com καί. A tradução principal conserva essa estrutura, enquanto a nota registra a leitura que entende a ressurreição como conteúdo da esperança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as ambiguidades relevantes do grego foram preservadas; “Homens, irmãos” é deliberadamente formal para representar ambos os elementos do vocativo original.
