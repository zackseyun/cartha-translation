source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: pt
  text: 'Então Paulo lhe disse: “Deus está prestes a ferir você[a], parede caiada! E você se senta para me julgar segundo a Lei e, violando a Lei, ordena que me golpeiem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus ferirá você”. O grego diz literalmente: “Deus está prestes a ferir você”, podendo enfatizar a iminência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Deus está prestes a ferir você
  rationale: A construção μέλλει com infinitivo indica ação iminente. “Está prestes a ferir” preserva essa força sem reduzi-la a um futuro simples; “ferir” mantém o sentido de golpe físico de τύπτω.
- source_word: τοῖχε κεκονιαμένε
  choice: parede caiada
  rationale: 'Preserva a metáfora vívida e a forma participial perfeita: uma parede revestida de cal, com aparência exterior limpa. A expressão é tradicional, clara e contundente em português.'
- source_word: κάθῃ
  choice: Você está aí sentado
  rationale: Mantém o verbo concreto “sentar” e o valor presente. “Aí” torna natural em português a força retórica da pergunta sem alterar seu sentido.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: para me julgar segundo a Lei
  rationale: “Segundo a Lei” expressa conformidade com o padrão legal e preserva o contraste deliberado com a violação da mesma Lei.
- source_word: παρανομῶν
  choice: violando a Lei
  rationale: O particípio descreve uma ação contrária à Lei. A formulação mantém o registro jurídico e o contraste verbal com “segundo a Lei”.
- source_word: κελεύεις με τύπτεσθαι
  choice: manda que me firam
  rationale: Traduz κελεύω de modo corrente e preserva a voz passiva do infinitivo τύπτεσθαι, sem identificar quem executaria a ordem.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Então Paulo lhe disse
  rationale: Introdução narrativa direta e natural, sem expansão interpretativa.
theological_decisions:
- issue: Natureza da declaração de Paulo de que Deus ferirá seu interlocutor
  choice: 'Declaração de ação divina iminente: “Deus está prestes a ferir você”'
  alternative: 'Imprecação ou desejo: “Que Deus fira você”'
  rationale: A construção grega μέλλει + infinitivo expressa mais naturalmente uma ação futura iminente, não um desejo. A tradução conserva a força judicial ou profética da fala sem julgar a conduta moral de Paulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “Lei” foi mantida para preservar o contraste retórico do grego. “Você” evita solenidade artificial e deixa claro o confronto direto; “parede caiada” conserva a imagem tradicional sem explicá-la dentro do versículo.
