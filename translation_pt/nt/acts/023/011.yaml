  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: pt
  text: 'Mas, na noite seguinte, o Senhor pôs-se ao lado dele e disse: “Tenha coragem,[a] pois, assim como você testemunhou a meu respeito em Jerusalém, também deve testemunhar[b] em Roma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Anime-se”.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “dar testemunho”. Os dois verbos referentes ao testemunho passado e futuro de Paulo pertencem, em grego, ao mesmo campo lexical de testemunha e testemunho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Mas, na noite seguinte
  rationale: ἐπιούσῃ νυκτί indica a noite seguinte. δέ recebe a conexão narrativa leve “Mas”, sem impor um contraste forte.
- source_word: ἐπιστὰς αὐτῷ
  choice: pôs-se ao lado dele
  rationale: A expressão comunica que o Senhor veio e ficou junto de Paulo. “Pôs-se ao lado dele” preserva tanto a proximidade física quanto o caráter encorajador da presença, sem transformar o verbo em “apareceu”.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Reproduz diretamente o título grego e mantém a identificação contextual sem acrescentar “Jesus” ao texto.
- source_word: Θάρσει
  choice: Tenha coragem
  rationale: O imperativo presente exorta Paulo a recobrar ou manter a coragem. A formulação é clara, atual e digna.
- source_word: διεμαρτύρω
  choice: você testemunhou
  rationale: O verbo pode trazer a ideia de testemunho enfático ou solene, mas o contexto não exige explicitar esse matiz. “Testemunhou” expressa o ato concluído e mantém a ligação lexical com μαρτυρῆσαι.
- source_word: τὰ περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Forma natural de exprimir as coisas concernentes ao Senhor sem a rigidez de “as coisas a meu respeito”.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Embora εἰς costume indicar movimento, com nomes de cidades pode ter sentido locativo no grego koiné; em português, “em Jerusalém” é a forma natural para o testemunho já prestado.
- source_word: οὕτω
  choice: também
  rationale: Dentro da construção correlativa ὡς ... οὕτω, a correspondência é expressa naturalmente em português por “assim como ... também”.
- source_word: σε δεῖ
  choice: você deve
  rationale: δεῖ comunica necessidade, frequentemente associada ao propósito divino em Atos. “Deve” preserva a força da necessidade sem explicitar um mecanismo teológico não declarado no versículo.
- source_word: καὶ εἰς Ῥώμην
  choice: em Roma
  rationale: O valor aditivo de καί já é expresso por “também” na correlação portuguesa, evitando uma repetição artificial.
- source_word: μαρτυρῆσαι
  choice: testemunhar
  rationale: Mantém em português a conexão do campo lexical de testemunho com διεμαρτύρω e exprime de modo claro a futura missão de Paulo.
theological_decisions:
- issue: Identidade de ὁ κύριος
  choice: “o Senhor”, sem expansão no corpo do texto
  alternative: “o Senhor Jesus”
  rationale: No contexto de Atos, aquele que fala de testemunhar “a meu respeito” é o Jesus ressuscitado. Contudo, o grego diz apenas “o Senhor”; a tradução conserva essa redação e deixa a identificação emergir do contexto.
- issue: Força de δεῖ
  choice: “você deve”
  alternative: “é necessário que você” ou “você está destinado a”
  rationale: A formulação comunica necessidade, inclusive sua possível dimensão divina no contexto de Atos, mas não a amplia para uma declaração explícita de destino ou predeterminação.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por “você” torna a fala direta natural; “pôs-se ao lado dele” mantém um tom narrativo digno. A repetição de “testemunhou/testemunhar” é intencional para preservar a ligação lexical do grego.
