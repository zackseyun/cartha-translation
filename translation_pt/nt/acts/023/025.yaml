lexical_decisions:
- source_word: γράψας
  choice: Ele escreveu
  rationale: O particípio aoristo retoma o comandante mencionado no versículo anterior. Em português narrativo, a forma finita é natural e preserva a ação de redigir a carta.
- source_word: ἐπιστολὴν
  choice: uma carta
  rationale: Designa uma comunicação escrita; “carta” é a equivalente atual e natural, sem o tom eclesiástico de “epístola”.
- source_word: ἔχουσαν
  choice: com
  rationale: O particípio presente modifica “carta”. A preposição “com” expressa de modo idiomático que a carta possuía o teor apresentado a seguir.
- source_word: τύπον
  choice: teor
  rationale: Neste contexto, τύπος indica a forma ou formulação geral da carta. “Teor” introduz naturalmente a transcrição de uma comunicação escrita, sem limitar o sentido apenas às palavras exatas.
- source_word: τοῦτον
  choice: seguinte
  rationale: O demonstrativo aponta para a carta transcrita nos versículos seguintes; em português, “o seguinte teor” comunica naturalmente essa referência prospectiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação corrente tanto no Brasil quanto em outros contextos lusófonos. “Com o seguinte teor” é idiomático para introduzir o conteúdo de uma carta; a nota preserva a estrutura mais formal do grego.
