  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: pt
  text: Descobri que ele era acusado por questões relativas à lei deles[a], mas não havia contra ele nenhuma acusação que merecesse a morte ou a prisão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por questões controvertidas da lei deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “nada digno de morte ou de correntes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: Descobri
  rationale: Expressa a conclusão a que o comandante chegou após examinar o caso, preservando o valor do aoristo sem tornar a frase excessivamente técnica.
- source_word: ἐγκαλούμενον
  choice: era acusado
  rationale: Mantém o sentido passivo de acusações apresentadas contra Paulo, sem sugerir que ele já tivesse sido condenado.
- source_word: περὶ ζητημάτων
  choice: por questões relativas a
  rationale: ζητήματα pode indicar questões debatidas ou matérias controvertidas. A formulação é natural em português e deixa o caráter disputado disponível em nota.
- source_word: τοῦ νόμου αὐτῶν
  choice: à lei deles
  rationale: Preserva a perspectiva do oficial romano e o possessivo αὐτῶν.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: nenhuma acusação que merecesse a morte ou a prisão
  rationale: Comunica a avaliação judicial com clareza. 'Prisão' traduz idiomaticamente δεσμῶν neste contexto, enquanto a nota registra o sentido literal de 'correntes'.
- source_word: ἔχοντα ἔγκλημα
  choice: não havia contra ele nenhuma acusação
  rationale: Reproduz a ideia de não existir acusação imputável que justificasse tais penas, evitando 'culpa', que poderia sugerir condenação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. A ordem foi ajustada para soar natural, sem eliminar a distinção entre ser acusado e haver uma acusação merecedora de pena.
