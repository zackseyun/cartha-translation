id: ACT.4.27
reference: Acts 4:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: pt
  text: Pois, de fato, nesta cidade, Herodes e Pôncio Pilatos, juntamente com os gentios e os povos de Israel, reuniram-se contra o teu santo servo Jesus[a], a quem ungiste,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teu santo filho Jesus”. O grego παῖς pode significar “servo” ou “filho”; aqui, “servo” é preferido por causa do provável eco da linguagem do Servo de Isaías.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: reuniram-se
  rationale: Expressa de modo natural em português a reunião efetiva dos diversos grupos em uma coalizão hostil. Embora a forma grega seja passiva, o português pronominal evita uma construção rígida sem determinar explicitamente a agência.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a citação e a oração precedentes.
- source_word: ἐπ’ ἀληθείας
  choice: de fato
  rationale: Locução idiomática corrente que preserva a força afirmativa de 'verdadeiramente' sem soar artificial.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: nesta cidade
  rationale: Preserva a referência contextual a Jerusalém sem explicitá-la além do texto grego.
- source_word: ἐπὶ τὸν
  choice: contra
  rationale: Com o verbo de reunir-se, a preposição tem sentido adversativo e indica oposição dirigida a Jesus.
- source_word: ἅγιον
  choice: santo
  rationale: Preserva a ideia de consagração e pertença especial a Deus, bem como a conotação de santidade.
- source_word: παῖδά σου
  choice: teu santo servo
  rationale: παῖς pode significar servo ou criança/filho, mas o contexto de Atos e o provável eco do Servo de Isaías favorecem 'servo'. 'Filho' seria interpretativo demais para este vocábulo.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa convencional do nome.
- source_word: ὃν ἔχρισας
  choice: a quem ungiste
  rationale: Mantém o sentido literal de χρίω e sua ressonância messiânica e comissionadora, sem substituir o verbo pelo título 'Messias'.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: Herodes e Pôncio Pilatos
  rationale: Usa as formas convencionais dos nomes em português e representa naturalmente a coordenação grega.
- source_word: σὺν ἔθνεσιν
  choice: juntamente com os gentios
  rationale: No contraste com Israel, 'gentios' comunica com clareza a referência aos povos não judeus.
- source_word: λαοῖς Ἰσραήλ
  choice: os povos de Israel
  rationale: Conserva o plural incomum λαοῖς, sem normalizá-lo silenciosamente para o singular.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo
  alternative: criança ou filho
  rationale: O provável pano de fundo do Servo de Isaías e o uso correlato em Atos favorecem 'servo'. A escolha não nega a filiação de Jesus; apenas evita inserir esse conceito onde o termo grego permanece lexicalmente ambíguo.
- issue: Sentido de ἔθνεσιν em contraste com Israel
  choice: gentios
  alternative: nações
  rationale: A coordenação com 'os povos de Israel' sugere principalmente o contraste entre não judeus e Israel. A alternativa lexical é genuína, mas 'gentios' é mais clara neste contexto.
- issue: Plural de λαοῖς
  choice: povos de Israel
  alternative: povo de Israel
  rationale: O texto grego apresenta o plural. Preservá-lo mantém uma particularidade do enunciado, possivelmente influenciada pelo Salmo 2, sem resolver sua tensão por harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'teu' e 'ungiste' por coerência com a oração dirigida diretamente a Deus. Mantém 'povos' no plural por fidelidade ao grego e conserva a ordem geral dos participantes sem rigidez sintática.
