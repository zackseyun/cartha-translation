  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: pt
  text: e Anás, o sumo sacerdote, e Caifás, João, Alexandre e todos os que eram de linhagem de sumos sacerdotes,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da família sumo-sacerdotal” ou “de descendência sumo-sacerdotal”.
    reason: Alternativas lexicais para ἐκ γένους ἀρχιερατικοῦ, expressão que pode destacar família, linhagem ou descendência relacionada ao sumo sacerdócio.
lexical_decisions:
- source_word: Ἅννας
  choice: Anás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio grego.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: Preserva diretamente o título singular atribuído a Anás no texto grego, sem harmonizá-lo com a situação histórica de Caifás.
- source_word: Καϊάφας
  choice: Caifás
  rationale: Forma tradicional do nome próprio em português.
- source_word: Ἰωάννης
  choice: João
  rationale: Forma tradicional portuguesa do nome grego, natural e imediatamente reconhecível.
- source_word: Ἀλέξανδρος
  choice: Alexandre
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: ὅσοι ἦσαν
  choice: todos os que pertenciam
  rationale: Expressa naturalmente em português a totalidade indicada por ὅσοι e, com ἐκ γένους, comunica pertencimento ao grupo familiar; evita a construção menos idiomática 'todos os que eram da família'.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: à família do sumo sacerdote
  rationale: γένος pode designar família, linhagem ou grupo de parentesco; a expressão indica vínculo com a família sacerdotal de alto nível, sem afirmar que todos exerciam o cargo.
theological_decisions:
- issue: O título de Anás diante do fato histórico de Caifás exercer o sumo sacerdócio naquele período
  choice: Anás, o sumo sacerdote
  alternative: Anás, ex-sumo sacerdote; Anás, um dos chefes dos sacerdotes
  rationale: O grego atribui explicitamente a Anás o título ὁ ἀρχιερεύς. A tradução mantém essa formulação e a tensão histórica, sem inserir uma explicação interpretativa no texto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas tradicionais dos nomes bíblicos. A repetição inicial de “e” preserva a continuidade sintática e o caráter enumerativo do grego. A vírgula foi colocada depois do marcador de nota, conforme a convenção gráfica adotada no trecho.
