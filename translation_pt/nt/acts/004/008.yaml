  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: pt
  text: 'Então Pedro, cheio do Espírito Santo, lhes disse: “Governantes do povo e anciãos,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: Πέτρος
  choice: Pedro
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: πλησθεὶς
  choice: cheio
  rationale: Reproduz de modo idiomático o particípio aoristo passivo no contexto; a ideia de que Pedro recebeu essa plenitude permanece implícita na construção.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: Após 'cheio', o português pede naturalmente 'do'; a expressão identifica o Espírito Santo como aquele de cuja presença e poder Pedro está cheio.
- source_word: εἶπεν πρὸς αὐτούς
  choice: lhes disse
  rationale: Equivalente português conciso e natural da fórmula narrativa, preservando os destinatários.
- source_word: Ἄρχοντες
  choice: Governantes
  rationale: Preserva o sentido de pessoas investidas de autoridade pública ou judicial, mais específico que 'líderes'.
- source_word: τοῦ λαοῦ
  choice: do povo
  rationale: Tradução direta que, no contexto, se refere ao povo de Israel sem explicitar no texto mais do que o grego diz.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: Designa membros reconhecidos da liderança comunitária, e não apenas homens de idade avançada.
theological_decisions:
- issue: Referência de πνεύματος ἁγίου
  choice: Espírito Santo
  alternative: espírito santo
  rationale: No contexto de Atos, a expressão se refere ao Espírito Santo divino que capacita Pedro a testemunhar; a capitalização identifica esse referente sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe concisa. A vírgula final permanece dentro da fala porque o versículo termina no meio do pronunciamento, que continua no versículo seguinte.
