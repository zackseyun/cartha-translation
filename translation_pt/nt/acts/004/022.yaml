  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: pt
  text: Pois o homem em quem este sinal de cura havia ocorrido tinha mais de quarenta anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este sinal que consistiu na cura” ou “este milagre de cura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: tinha mais de quarenta anos
  rationale: A construção genitiva com o comparativo πλειόνων expressa idade. Em português corrente, “tinha mais de quarenta anos” comunica o sentido com naturalidade e precisão.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a explicação que sustenta a afirmação anterior. “Pois” preserva de modo conciso essa ligação discursiva.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: Neste contexto, ἄνθρωπος se refere a um indivíduo do sexo masculino já identificado na narrativa; “o homem” é exato e natural.
- source_word: ἐφ’ ὃν
  choice: em quem
  rationale: ἐπί com o acusativo indica aqui a pessoa sobre a qual ou em relação à qual o acontecimento se deu. Com “acontecido”, “em quem” é uma formulação natural em português.
- source_word: γεγόνει
  choice: havia acontecido
  rationale: O mais-que-perfeito de γίνομαι apresenta o acontecimento como anterior ao ponto narrativo. “Havia acontecido” mantém essa relação temporal e não introduz um agente que o grego não explicita.
- source_word: τὸ σημεῖον τοῦτο
  choice: esse sinal
  rationale: σημεῖον é mantido como “sinal” para preservar a ênfase lucana no significado comprobatório do acontecimento, sem reduzi-lo apenas à ideia de prodígio. O demonstrativo “esse” retoma naturalmente o sinal já mencionado.
- source_word: τῆς ἰάσεως
  choice: de cura
  rationale: ἴασις designa cura ou restabelecimento. “De cura” reproduz de forma transparente a relação genitiva e permanece compreensível.
theological_decisions:
- issue: Tradução de σημεῖον em contexto milagroso
  choice: sinal
  alternative: milagre
  rationale: “Sinal” preserva o caráter revelador e comprobatório que o termo possui em Atos. “Milagre” é possível no contexto, mas explicita sobretudo o caráter extraordinário do evento.
- issue: Agência sugerida por γεγόνει
  choice: havia acontecido
  alternative: havia sido realizado
  rationale: O grego emprega γίνομαι e não declara aqui um agente. A formulação escolhida conserva o foco no acontecimento sem negar a agência divina e apostólica indicada pelo contexto mais amplo.
- issue: Relação de τῆς ἰάσεως com σημεῖον
  choice: sinal de cura
  alternative: sinal que consistiu na cura
  rationale: O genitivo pode caracterizar o sinal pela cura ou relacioná-lo ao ato de curar. “Sinal de cura” preserva a concisão e uma medida adequada dessa abertura sem resolver excessivamente a relação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Pois” mantém a conexão explicativa; “havia acontecido” conserva o valor temporal do mais-que-perfeito; e “sinal de cura” retém a terminologia de Lucas sem interpretação excessiva.
