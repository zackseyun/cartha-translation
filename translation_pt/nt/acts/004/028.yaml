id: ACT.4.28
reference: Acts 4:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: pt
  text: para fazerem tudo o que a tua mão e o teu propósito haviam predestinado que acontecesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “haviam determinado de antemão” ou “haviam decidido previamente”. O verbo grego indica determinação anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: para fazerem
  rationale: O infinitivo aoristo depende do contexto anterior e expressa o que Herodes, Pôncio Pilatos, os gentios e os povos de Israel se reuniram para fazer. A flexão no plural torna explícito em português o sujeito já dado pelo contexto, sem acrescentar conteúdo.
- source_word: ὅσα
  choice: tudo o que
  rationale: O relativo neutro plural tem alcance abrangente; “tudo o que” é natural em português e preserva essa abrangência.
- source_word: χείρ
  choice: mão
  rationale: Mantém a imagem bíblica concreta, que metaforicamente comunica o poder e a ação de Deus, sem substituir a figura por uma explicação.
- source_word: βουλή
  choice: propósito
  rationale: Expressa intenção deliberada de modo claro e atual. “Plano” também seria possível, mas “propósito” preserva melhor a nuance de decisão intencional.
- source_word: προώρισεν
  choice: haviam predestinado
  rationale: O verbo προορίζω denota determinar de antemão. O mais-que-perfeito composto marca que essa determinação precedeu os acontecimentos narrados; o plural concorda com o sujeito composto “a tua mão e o teu propósito”.
- source_word: γενέσθαι
  choice: que acontecesse
  rationale: Aqui γίνομαι tem sentido eventivo. A oração finita é mais idiomática em português do que uma construção infinitiva literal e conserva a relação com aquilo que fora determinado.
theological_decisions:
- issue: Tradução de προώρισεν num contexto que envolve a soberania divina e a responsabilidade humana
  choice: haviam predestinado
  alternative: haviam determinado de antemão; haviam decidido previamente
  rationale: “Predestinado” preserva a força da determinação prévia expressa pelo grego. O versículo afirma o propósito anterior de Deus quanto aos acontecimentos da paixão de Jesus, sem explicar como isso se relaciona sistematicamente com a responsabilidade dos agentes humanos; a tradução mantém essa tensão e registra alternativas menos carregadas na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a metáfora “tua mão” e emprega “propósito” para βουλή. A concordância plural em “haviam predestinado” trata “a tua mão e o teu propósito” como sujeito composto, refletindo a sintaxe grega sem resolver a relação conceitual entre poder e propósito.
