  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: pt
  text: 'E, depois de colocá-los no meio[a], começaram a perguntar: “Com que poder ou em que nome vocês fizeram isso?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perguntavam” ou “interrogaram”. O imperfeito grego pode enfatizar um questionamento em andamento, em vez do começo da ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: depois de colocá-los
  rationale: O particípio aoristo circunstancial indica uma ação anterior à pergunta; a formulação explicita com naturalidade essa sequência temporal.
- source_word: ἐν τῷ μέσῳ
  choice: no meio
  rationale: Preserva o sentido espacial da expressão grega sem acrescentar a interpretação mais específica de que estavam diante do conselho.
- source_word: ἐπυνθάνοντο
  choice: começaram a perguntar
  rationale: Expressa a possível nuance ingressiva do imperfeito no contexto narrativo, embora o aspecto contínuo também seja possível e seja registrado em nota.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Com que poder
  rationale: A preposição tem valor instrumental neste contexto, e 'poder' traduz diretamente δύναμις sem substituí-lo pelo conceito próximo de autoridade.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: ou em que nome
  rationale: Mantém o idioma bíblico de agir 'em nome' de alguém, com suas conotações de representação e autoridade.
- source_word: ἐποιήσατε τοῦτο
  choice: vocês fizeram isso
  rationale: O pretérito perfeito simples corresponde naturalmente ao aoristo narrativo, e 'isso' conserva a referência ampla do grego ao ato realizado.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito é representado de modo natural e claro em português; sua posição antes do verbo ajuda a conservar certa ênfase sobre os interrogados.
theological_decisions:
- issue: Se δύναμις deve ser traduzido como 'poder' ou interpretado como 'autoridade'
  choice: poder
  alternative: autoridade
  rationale: δύναμις designa normalmente poder ou capacidade, enquanto a expressão paralela 'em que nome' já comunica a ideia de autoridade representativa. A tradução preserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'No meio' conserva a imagem do cenário de interrogatório; 'vocês' é natural no português brasileiro e distingue claramente os interrogados.
