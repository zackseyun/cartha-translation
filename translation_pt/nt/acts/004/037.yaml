  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: pt
  text: Como possuía um campo[a], vendeu-o, trouxe o dinheiro[b] e o colocou aos pés dos apóstolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como tinha um campo” ou “Tendo um campo”. O grego apresenta essa informação como circunstância de fundo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o valor obtido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Como possuía um campo
  rationale: A construção em genitivo absoluto apresenta a circunstância de fundo. “Possuía” expressa de modo natural em português a relação de posse indicada por ὑπάρχω com o dativo αὐτῷ, sem perder o valor circunstancial.
- source_word: ἀγροῦ
  choice: um campo
  rationale: ἀγρός designa comumente um campo ou terreno. “Campo” é a correspondência mais direta e mantém a amplitude do termo grego.
- source_word: πωλήσας
  choice: vendeu-o
  rationale: O particípio aoristo indica uma ação anterior às ações principais. A forma verbal finita torna a sequência natural em português, e o pronome retoma “campo”.
- source_word: ἤνεγκεν
  choice: trouxe
  rationale: Neste contexto, φέρω significa levar ou trazer algo ao local e entregá-lo; “trouxe” é a opção mais natural em português.
- source_word: τὸ χρῆμα
  choice: o dinheiro
  rationale: χρῆμα refere-se aqui ao dinheiro obtido na venda. “O dinheiro” é claro e direto; “o valor obtido” explicita mais a relação com a venda e fica registrado como alternativa.
- source_word: ἔθηκεν
  choice: colocou
  rationale: τίθημι significa pôr ou colocar. “Colocou” combina naturalmente com a expressão concreta “aos pés” e evita um tom artificial.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: aos pés dos apóstolos
  rationale: A tradução preserva a imagem concreta do grego e permite que o contexto comunique a entrega do dinheiro à administração dos apóstolos, sem substituir a cena por uma explicação.
theological_decisions:
- issue: Preservação da imagem física da apresentação do dinheiro à autoridade apostólica
  choice: “colocou aos pés dos apóstolos”
  alternative: “entregou aos apóstolos”
  rationale: O texto narra um gesto concreto que também sugere que a oferta foi confiada à administração apostólica. Manter a imagem conserva ambas as dimensões sem acrescentar conclusões eclesiológicas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem é natural em português, preservando a sequência da venda, do transporte do dinheiro e de sua colocação aos pés dos apóstolos. Todos os marcadores de notas aparecem no texto principal.
