id: ACT.4.4
reference: Acts 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: pt
  text: Mas muitos dos que tinham ouvido a mensagem[a] creram, e o número dos homens[b] chegou a cerca de cinco mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra”. Aqui, λόγος se refere à proclamação ou mensagem apostólica.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “o número dos homens”, provavelmente indicando uma contagem dos homens, e não de toda a multidão, que também podia incluir mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Preserva a quantidade indefinida do grego sem acrescentar um substantivo ausente no texto.
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com a oposição e a prisão narradas no contexto anterior.
- source_word: ἀκουσάντων τὸν λόγον
  choice: dos que tinham ouvido a mensagem
  rationale: O mais-que-perfeito composto apresenta a audição como anterior ao ato de crer. Neste contexto, λόγος designa a proclamação apostólica; “mensagem” comunica esse sentido com clareza, enquanto “palavra” permanece como alternativa na nota.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: Tradução direta de πιστεύω, sem ampliar a expressão com uma formulação teológica mais específica.
- source_word: ἐγενήθη ὁ ἀριθμός
  choice: o número [...] chegou a
  rationale: Formulação natural em português para o estado numérico resultante expresso por γίνομαι, sem sugerir necessariamente que todos os cinco mil se converteram nessa ocasião.
- source_word: τῶν ἀνδρῶν
  choice: dos homens
  rationale: ἀνήρ normalmente designa homens do sexo masculino, e não pessoas de modo genérico; a tradução conserva essa especificidade.
- source_word: ὡς χιλιάδες πέντε
  choice: cerca de cinco mil
  rationale: ὡς diante de um número indica aproximação, expressa naturalmente por “cerca de”.
theological_decisions:
- issue: Contagem específica de homens em τῶν ἀνδρῶν
  choice: dos homens
  alternative: das pessoas; dos que creram
  rationale: O texto grego emprega ἀνδρῶν, normalmente referente a homens. A tradução conserva o gênero da expressão sem concluir que as mulheres estivessem ausentes da comunidade ou que não tivessem crido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Creram” mantém a concisão do original; “chegou a cerca de” evita a construção pouco idiomática “tornou-se cerca de” e preserva a aproximação numérica.
