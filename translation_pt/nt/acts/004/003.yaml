  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: pt
  text: E lançaram mão deles[a] e os puseram sob custódia[b] até o dia seguinte, pois já era fim de tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os agarraram» ou «os prenderam». A expressão grega significa literalmente «puseram as mãos sobre eles» e é frequentemente usada para uma apreensão hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou «os puseram na prisão» ou «os deixaram sob guarda». O grego indica que foram mantidos sob custódia, sem especificar o tipo exato de instalação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: puseram as mãos neles
  rationale: Preserva a expressão concreta do grego e, no contexto hostil e judicial, comunica a apreensão física sem substituir a imagem por uma explicação.
- source_word: αὐτοῖς
  choice: neles
  rationale: O pronome dativo plural se refere a Pedro e João e se integra naturalmente à expressão portuguesa «puseram as mãos neles».
- source_word: ἔθεντο εἰς τήρησιν
  choice: os mantiveram sob custódia
  rationale: Expressa detenção e vigilância oficiais sem especificar indevidamente que foram colocados numa cadeia ou em outra instalação concreta.
- source_word: εἰς τὴν αὔριον
  choice: até o dia seguinte
  rationale: Reproduz de modo natural o valor temporal da expressão no fluxo da narrativa.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: pois já era noite
  rationale: Explica por que a ação posterior foi adiada. Em português corrente, «já era noite» transmite naturalmente que o período vespertino já havia chegado, sem introduzir a ideia menos precisa de que simplesmente era tarde.
