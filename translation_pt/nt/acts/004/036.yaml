id: ACT.4.36
reference: Acts 4:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: pt
  text: José, chamado Barnabé pelos apóstolos — nome que, traduzido, significa “filho de encorajamento”[a] —, levita, natural de Chipre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho de exortação”, “filho de consolação” ou “filho de conforto”. A palavra grega pode transmitir as ideias de encorajar, exortar ou consolar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição narrativa leve. Como o versículo integra uma frase que continua no versículo seguinte, acrescentar “porém” sugeriria contraste excessivo, e “então” introduziria uma ideia temporal ausente.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: chamado Barnabé pelos apóstolos
  rationale: Expressa com naturalidade tanto a designação recebida por José quanto a origem apostólica desse nome, sem acrescentar a ideia de “também”.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: nome que, traduzido, significa
  rationale: Torna explícito em português que a explicação se refere ao nome Barnabé e preserva a função interpretativa da expressão grega.
- source_word: υἱὸς παρακλήσεως
  choice: filho de encorajamento
  rationale: “Encorajamento” comunica de modo amplo e acessível o campo semântico de παράκλησις, sem restringi-lo apenas a exortação ou consolo.
- source_word: Λευίτης
  choice: levita
  rationale: Equivalente direto e tradicional para a identificação tribal e religiosa.
- source_word: Κύπριος τῷ γένει
  choice: natural de Chipre
  rationale: Expressão idiomática em português para indicar procedência ou origem natal, de acordo com o valor de τῷ γένει.
theological_decisions:
- issue: Amplitude de sentido de παρακλήσεως na explicação do nome Barnabé
  choice: encorajamento
  alternative: exortação, consolação ou conforto
  rationale: O substantivo grego pode abranger estímulo, apelo e consolo. O texto não determina uma nuance única; por isso, o corpo emprega o termo amplo “encorajamento” e a nota preserva as alternativas relevantes.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas correntes (“José”, “Barnabé”, “levita”). Os travessões delimitam a explicação do nome sem romper a frase, que continua no versículo 37. A vírgula final preserva essa continuidade sintática.
