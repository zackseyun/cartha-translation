  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: pt
  text: Ao observarem a ousadia de Pedro e João e perceberem que eram homens sem instrução formal e comuns[a], ficaram admirados e reconheceram que eles haviam estado com Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem formação erudita e leigos”. O grego descreve homens sem instrução acadêmica ou rabínica formal e sem posição profissional ou oficial entre os especialistas religiosos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Ao observarem
  rationale: Exprime uma observação deliberada que leva à reação das autoridades, preservando a relação circunstancial do particípio.
- source_word: παρρησίαν
  choice: coragem
  rationale: No contexto de Atos, denota franqueza pública e destemor ao falar; “coragem” é natural em português e comunica o aspecto central, embora “ousadia” também seja possível.
- source_word: καταλαβόμενοι
  choice: perceberem
  rationale: Indica que chegaram a compreender a condição social e educacional de Pedro e João.
- source_word: ἄνθρωποι
  choice: homens
  rationale: Os referentes são especificamente Pedro e João, ambos do sexo masculino.
- source_word: ἀγράμματοί
  choice: sem instrução formal
  rationale: Evita sugerir analfabetismo absoluto e aponta para a ausência de formação erudita, escribal ou rabínica.
- source_word: ἰδιῶται
  choice: comuns
  rationale: Indica pessoas sem posição profissional ou oficial entre os especialistas religiosos, sem atribuir falta de inteligência.
- source_word: ἐθαύμαζον
  choice: ficaram admirados
  rationale: Comunica de modo corrente a forte reação de surpresa; o contexto narrativo sustenta a duração sugerida pelo imperfeito.
- source_word: ἐπεγίνωσκόν
  choice: reconheceram
  rationale: Expressa identificação ou reconhecimento da associação anterior dos apóstolos com Jesus.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: haviam estado com Jesus
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a convivência com Jesus precedeu esse reconhecimento.
- source_word: δὲ ... τε
  choice: estrutura coordenada sem marcador inicial explícito
  rationale: As partículas organizam o fluxo narrativo; em português, a construção com “Ao...” e a coordenação por “e” reproduzem esse fluxo sem acrescentar um “ora” ou “então” desnecessário.
theological_decisions:
- issue: Caracterização social e educacional de Pedro e João
  choice: “homens sem instrução formal e comuns”
  alternative: “homens iletrados e leigos”
  rationale: A formulação preserva o contraste com autoridades religiosas treinadas sem afirmar que Pedro e João fossem analfabetos, ignorantes ou moralmente inferiores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o contraste social do original e evita conotações modernas enganosas de “analfabetos” ou “ignorantes”.
