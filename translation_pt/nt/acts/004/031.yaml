id: ACT.4.31
reference: Acts 4:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: pt
  text: Depois de orarem, o lugar onde estavam reunidos[a] tremeu, e todos ficaram cheios do Espírito Santo e falavam a palavra de Deus com ousadia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “onde haviam se reunido”. O grego os descreve no estado de estarem reunidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “com coragem”, “com confiança” ou “com franqueza”. O termo indica fala aberta e destemida.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Depois de orarem
  rationale: O genitivo absoluto com particípio aoristo estabelece a circunstância temporal anterior. “Depois de orarem” é natural em português e preserva o caráter comunitário da oração sem recorrer ao menos corrente “fazer súplicas”.
- source_word: ἐσαλεύθη
  choice: tremeu
  rationale: O aoristo passivo indica que o lugar sofreu um abalo. “Tremeu” comunica de modo claro e vigoroso o movimento físico, sem exigir uma passiva pouco natural em português.
- source_word: ὁ τόπος
  choice: o lugar
  rationale: Refere-se ao espaço físico onde o grupo se encontrava; “o lugar” é direto e idiomático.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: onde estavam reunidos
  rationale: A construção perifrástica com ἦσαν e particípio perfeito descreve o grupo no estado resultante de ter sido reunido. A formulação portuguesa preserva esse estado e permanece natural.
- source_word: ἐπλήσθησαν
  choice: ficaram cheios
  rationale: Expressa naturalmente em português o aoristo passivo e conserva o conhecido idioma lucano de enchimento pelo Espírito.
- source_word: ἅπαντες
  choice: todos
  rationale: Transmite a inclusão enfática da totalidade do grupo.
- source_word: τοῦ ἁγίου πνεύματος
  choice: do Espírito Santo
  rationale: O genitivo que complementa “ficaram cheios” indica aquilo de que foram cheios. A capitalização identifica o referente divino pessoal no contexto.
- source_word: ἐλάλουν
  choice: falavam
  rationale: O imperfeito apresenta uma ação em andamento. “Falavam” preserva esse aspecto sem acrescentar a ideia de que apenas começaram a falar.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão lucana consagrada para a mensagem divina proclamada, com sua força bíblica e teológica.
- source_word: μετὰ παρρησίας
  choice: com ousadia
  rationale: No contexto de Atos, παρρησία caracteriza fala pública aberta, franca e destemida. “Com ousadia” transmite essa coragem de modo conciso e corrente.
theological_decisions:
- issue: Linguagem do enchimento pelo Espírito
  choice: todos ficaram cheios do Espírito Santo
  alternative: todos foram cheios pelo Espírito Santo
  rationale: O genitivo após ἐπλήσθησαν é mais naturalmente entendido como o conteúdo do enchimento. A tradução declara a capacitação divina narrada por Lucas sem definir uma doutrina denominacional sobre a sequência ou classificação dessa experiência.
- issue: Aspecto de ἐλάλουν
  choice: falavam
  alternative: falaram; começaram a falar
  rationale: O imperfeito retrata a proclamação em curso. Assim, evita-se reduzir o testemunho a um ato pontual ou introduzir um valor incoativo que o verbo não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o desenvolvimento do grego sem soar rígida. Os marcadores das notas foram colocados junto às expressões a que de fato se referem.
