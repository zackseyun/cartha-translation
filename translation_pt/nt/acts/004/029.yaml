id: ACT.4.29
reference: Acts 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: pt
  text: E agora, Senhor, olha para as ameaças deles e concede aos teus servos[a] que falem a tua palavra com toda a ousadia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «teus escravos». O termo grego pode designar alguém que pertence a um senhor; aqui, «servos» destaca o serviço humilde prestado a Deus no contexto da oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: E agora
  rationale: Expressão adverbial que faz a transição da citação bíblica para o pedido relativo à situação presente; «E agora» é natural e preserva esse movimento da oração.
- source_word: κύριε
  choice: Senhor
  rationale: Vocativo dirigido a Deus em oração; «Senhor» corresponde ao uso neotestamentário corrente e mantém o tom reverente.
- source_word: ἔπιδε ἐπὶ
  choice: olha para
  rationale: O imperativo pede que Deus volte sua atenção às ameaças. A formulação conserva a imagem concreta do grego sem recorrer a linguagem arcaica.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: as ameaças deles
  rationale: Tradução direta e clara do substantivo plural e do pronome possessivo contextual.
- source_word: δὸς
  choice: concede
  rationale: Embora o sentido básico seja «dá», «concede» expressa naturalmente, em uma oração, o pedido de capacitação que introduz a oração completiva.
- source_word: τοῖς δούλοις σου
  choice: aos teus servos
  rationale: δοῦλος pode designar escravo ou servo, alguém pertencente a um senhor. Neste contexto de oração, «servos» comunica com naturalidade a submissão e o serviço a Deus, enquanto a nota preserva a alternativa lexical mais forte.
- source_word: μετὰ παρρησίας πάσης
  choice: com toda a ousadia
  rationale: παρρησία indica franqueza e destemor ao falar; «ousadia» é corrente no contexto de proclamação, e «toda» preserva a intensificação de πάσης.
- source_word: λαλεῖν
  choice: que falem
  rationale: O infinitivo depende de «concede» e indica aquilo que os servos pedem poder fazer. A oração finita é a construção mais natural em português e «falem» preserva o sentido simples do verbo.
- source_word: τὸν λόγον σου
  choice: a tua palavra
  rationale: Mantém o idioma bíblico e a ressonância teológica de λόγος, que neste contexto se refere à mensagem de Deus proclamada.
theological_decisions:
- issue: Tradução de δοῦλος em referência aos que pertencem a Deus
  choice: teus servos
  alternative: teus escravos
  rationale: O contexto destaca a postura humilde de serviço e submissão na oração. «Servos» é natural e adequado no texto principal, sem ocultar que o termo grego também pode expressar a condição mais forte de pertencimento a um senhor; essa possibilidade é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de oração natural tanto no Brasil quanto em outros contextos lusófonos. «Teus» acompanha o tratamento tradicional e reverente dirigido a Deus, sem formas verbais regionais marcadas. O marcador foi colocado junto de «servos», termo ao qual a nota lexical se refere.
