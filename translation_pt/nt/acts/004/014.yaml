  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: pt
  text: E, ao verem o homem que havia sido curado de pé com eles, não tinham nada a dizer em contrário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não tinham nada a contestar» ou «não podiam dizer nada em oposição».
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: E
  rationale: A partícula liga a oração ao desenvolvimento narrativo anterior; a coordenação simples é natural em português e evita sobretradução.
- source_word: ἄνθρωπον
  choice: o homem
  rationale: Refere-se ao indivíduo masculino específico que havia sido curado no contexto anterior.
- source_word: βλέποντες
  choice: vendo
  rationale: O particípio presente indica ação contemporânea à oração principal; o gerúndio preserva essa relação de modo claro e natural.
- source_word: σὺν αὐτοῖς
  choice: junto deles
  rationale: σύν com o dativo indica companhia; «junto deles» comunica proximidade e associação no cenário.
- source_word: ἑστῶτα
  choice: em pé
  rationale: O particípio perfeito de ἵστημι descreve o homem no estado resultante de estar de pé; esta é a expressão idiomática em português.
- source_word: τεθεραπευμένον
  choice: que havia sido curado
  rationale: O particípio perfeito passivo identifica o homem por uma cura concluída com resultado presente, preservando também a voz passiva.
- source_word: οὐδὲν
  choice: nada
  rationale: Expressa ausência total daquilo que poderiam apresentar como resposta contrária.
- source_word: εἶχον ἀντειπεῖν
  choice: nada tinham a dizer em contrário
  rationale: A construção ἔχω + infinitivo indica que não dispunham de resposta ou contestação; «dizer em contrário» preserva a força adversativa de ἀντειπεῖν sem especificar indevidamente se faltava capacidade, fundamento ou conteúdo para contradizer.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. «Em pé junto deles» conserva a força circunstancial da presença visível do homem curado; a nota mantém as possíveis nuances adversativas da expressão final.
