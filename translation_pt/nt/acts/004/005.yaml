  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: pt
  text: No dia seguinte, aconteceu que seus governantes, anciãos e escribas foram reunidos em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se reuniram» ou «se ajuntaram». O verbo grego tem forma passiva («foram reunidos»).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: aconteceu que
  rationale: Preserva a fórmula narrativa que faz o relato avançar, sem recorrer à expressão arcaica «sucedeu».
- source_word: ἐπὶ τὴν αὔριον
  choice: No dia seguinte
  rationale: Expressa de maneira natural em português o sentido temporal de «no dia posterior».
- source_word: συναχθῆναι
  choice: foram reunidos
  rationale: Reflete a forma passiva do infinitivo aoristo e o sentido coletivo do verbo; a nota registra alternativas mais idiomáticas.
- source_word: αὐτῶν
  choice: deles
  rationale: Mantém o pronome relacional grego sem especificar além do texto o seu referente contextual.
- source_word: τοὺς ἄρχοντας
  choice: os governantes
  rationale: Designa de modo amplo as autoridades dirigentes presentes nesse contexto.
- source_word: τοὺς πρεσβυτέρους
  choice: os anciãos
  rationale: Refere-se a líderes comunitários reconhecidos, e não apenas a homens de idade avançada.
- source_word: τοὺς γραμματεῖς
  choice: os escribas
  rationale: Conserva a designação concisa e tradicional da classe de especialistas na Lei e nas Escrituras.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Tradução locativa direta e natural.
theological_decisions:
- issue: Referente de αὐτῶν na descrição das autoridades reunidas
  choice: «deles», preservando o pronome grego sem explicitar seu antecedente
  alternative: Omitir o pronome ou interpretar de modo específico como «os governantes judeus»
  rationale: O antecedente é fornecido pelo contexto, mas não é nomeado no próprio versículo. Preservar «deles» mantém tanto a relação expressa no grego quanto a ambiguidade referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para começar pelo marcador temporal, mais natural em português, e «deles» foi mantido após a série nominal para preservar a relação expressa por αὐτῶν.
