  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: pt
  text: 'Mas, depois de mandarem que eles se retirassem do Conselho[a], começaram a deliberar entre si[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do Sinédrio”. O termo grego συνέδριον pode designar o conselho governante judaico ou a reunião desse conselho.
    reason: lexical_alternative
  - marker: b
    text: Ou “passaram a conversar entre si” ou “estavam discutindo entre si”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: depois de mandarem
  rationale: O particípio aoristo indica uma ordem anterior à ação principal; a formulação é natural em português e preserva a autoridade exercida.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição e a transição do interrogatório público para a deliberação reservada.
- source_word: αὐτοὺς
  choice: eles
  rationale: Retoma Pedro e João sem necessidade de repetir seus nomes.
- source_word: ἔξω τοῦ συνεδρίου
  choice: saíssem da sala do Conselho
  rationale: No contexto, a ordem é para que Pedro e João deixem o local onde o Conselho está reunido. A explicitação de 'sala' evita a impressão de que deveriam sair de uma instituição abstrata, sem perder a referência ao órgão governante.
- source_word: ἀπελθεῖν
  choice: saíssem
  rationale: Com ἔξω, expressa de modo idiomático o movimento para fora e integra naturalmente o complemento de κελεύσαντες.
- source_word: συνέβαλλον
  choice: começaram a deliberar
  rationale: O imperfeito apresenta uma ação em andamento no novo momento narrativo; 'deliberar' comunica uma discussão voltada para uma decisão.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: Expressão recíproca natural em português, indicando que os membros do Conselho discutiam uns com os outros.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Conselho' é grafado com inicial maiúscula por designar o órgão judaico específico; a nota preserva a alternativa tradicional 'Sinédrio'. O dois-pontos final mantém a continuidade sintática e narrativa com o versículo seguinte.
