id: ACT.4.26
reference: Acts 4:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: pt
  text: Os reis da terra tomaram posição, e os governantes se reuniram contra o Senhor e contra o seu Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Cristo». A palavra grega significa «Ungido».
    reason: Registra a tradução alternativa tradicional e esclarece o sentido do título grego.
lexical_decisions:
- source_word: παρέστησαν
  choice: tomaram posição
  rationale: O aoristo de παρίστημι, no eco do Salmo 2:2, indica uma postura deliberada de oposição, não apenas o ato físico de ficar em pé.
- source_word: βασιλεῖς
  choice: reis
  rationale: Preserva o título político específico e o paralelismo da citação do Salmo 2.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Neste contexto, γῆ tem alcance amplo, e «da terra» conserva a expressão bíblica natural em português.
- source_word: ἄρχοντες
  choice: governantes
  rationale: Equivalente moderno e claro que mantém o paralelismo com «reis».
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Expressa naturalmente em português o ajuntamento indicado pela forma passiva grega, sem sugerir necessariamente um agente externo.
- source_word: ἐπὶ τὸ αὐτό
  choice: se reuniram
  rationale: O sentido de estarem juntos é incorporado ao verbo «reuniram», evitando a redundância pouco natural de «se reuniram juntos».
- source_word: κατὰ
  choice: contra
  rationale: Marca diretamente a oposição hostil nas duas ocorrências.
- source_word: κυρίου
  choice: Senhor
  rationale: Na citação escriturística, refere-se a Deus e conserva o peso teológico tradicional de κύριος.
- source_word: χριστοῦ
  choice: Messias
  rationale: Aqui Χριστός funciona como título na citação do Salmo 2; «Messias» preserva seu contexto hebraico e sua função titular.
- source_word: αὐτοῦ
  choice: seu
  rationale: Retoma naturalmente «o Senhor» e preserva a relação expressa pelo pronome genitivo.
theological_decisions:
- issue: Tradução de Χριστός na citação do Salmo 2
  choice: Messias
  alternative: Cristo; Ungido
  rationale: Como título ligado ao Senhor e inserido na citação do Salmo 2:2, «Messias» comunica adequadamente o sentido messiânico. A nota preserva «Cristo» e explicita o sentido literal «Ungido», sem reduzir a tensão entre o contexto veterotestamentário e o uso neotestamentário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético da citação e evita tanto arcaísmo quanto explicitação interpretativa excessiva.
