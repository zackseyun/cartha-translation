id: ACT.4.12
reference: Acts 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: pt
  text: E não há salvação em nenhum outro, pois debaixo do céu não há nenhum outro nome dado entre os seres humanos pelo qual devamos ser salvos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: salvação
  rationale: Mantém tanto a ideia de livramento quanto a força soteriológica da proclamação de Pedro, sem ampliar o texto.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: em nenhum outro
  rationale: Preserva a construção pessoal e exclusiva do grego; em português, a referência a uma pessoa permanece clara pelo contexto imediato.
- source_word: ὄνομα
  choice: nome
  rationale: Conserva a imagem bíblica, que pode abranger identidade, pessoa e autoridade sem explicitar no texto uma interpretação única.
- source_word: ἕτερον
  choice: outro
  rationale: Na construção negativa, “nenhum outro nome” expressa com naturalidade a exclusividade do original.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: debaixo do céu
  rationale: Preserva o idioma bíblico e seu alcance universal, em linguagem corrente e solene.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: dado entre os seres humanos
  rationale: O particípio modifica “nome”, e ἐν favorece o sentido de presença no âmbito da humanidade. “Seres humanos” comunica de modo inequívoco o caráter genérico de ἀνθρώποις.
- source_word: ἐν ᾧ
  choice: pelo qual
  rationale: Expressa naturalmente em português o meio associado ao “nome”, sem reduzir a riqueza relacional da expressão.
- source_word: δεῖ
  choice: devamos
  rationale: A forma verbal dentro da oração relativa comunica a necessidade expressa por δεῖ e concorda com “nós” implícito em ἡμᾶς.
- source_word: σωθῆναι ἡμᾶς
  choice: devamos ser salvos
  rationale: Preserva a voz passiva, a necessidade e a inclusão explícita dos falantes em ἡμᾶς.
theological_decisions:
- issue: Exclusividade da salvação em relação a Jesus
  choice: “não há salvação em nenhum outro”
  alternative: “não há outro caminho de salvação”
  rationale: O grego atribui diretamente a salvação a nenhum outro e fundamenta essa afirmação na inexistência de outro nome; a tradução não suaviza nem expande a declaração.
- issue: Sentido genérico de ἀνθρώποις
  choice: “entre os seres humanos”
  alternative: “entre os homens” ou “à humanidade”
  rationale: A expressão se refere à humanidade em geral. A opção escolhida torna a abrangência explícita e evita que “homens” seja entendido como referência exclusiva ao sexo masculino.
- issue: Força de necessidade em δεῖ
  choice: “devamos ser salvos”
  alternative: “é necessário que sejamos salvos”
  rationale: “Devamos” conserva a necessidade do original de maneira concisa, sem acrescentar uma explicação sobre a origem dessa necessidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência: “debaixo do céu” antecede a oração existencial. Não se acrescentaram notas, pois a formulação inclusiva de ἀνθρώποις já está clara no texto principal.'
