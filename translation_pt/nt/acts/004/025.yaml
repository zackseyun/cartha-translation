  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: pt
  text: 'que[a], por meio do Espírito Santo, pela boca de nosso pai Davi, teu servo, disseste: “Por que se enfureceram as nações e os povos tramaram coisas vãs?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem “nosso pai”. Nesse caso, a introdução seria: “que, por meio do Espírito Santo, pela boca de Davi, teu servo, disseste”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: que
  rationale: O pronome relativo retoma Deus, invocado no versículo anterior, e mantém a ligação sintática de modo natural em português. A expressão textualmente incerta referente a “nosso pai” é preservada em nota.
- source_word: διὰ πνεύματος ἁγίου
  choice: por meio do Espírito Santo
  rationale: διά com genitivo indica meio ou agência; a formulação preserva explicitamente a atuação do Espírito Santo.
- source_word: στόματος Δαυὶδ
  choice: pela boca de Davi
  rationale: Mantém o conhecido idioma bíblico de agência profética sem deixar de ser compreensível em português atual.
- source_word: παιδός σου
  choice: teu servo
  rationale: Embora παῖς também possa significar “filho” ou “criança”, no caso de Davi e nesta fórmula de citação o sentido contextual é “servo”.
- source_word: εἰπών
  choice: disse
  rationale: O particípio aoristo introduz a citação e é vertido naturalmente como verbo finito em português.
- source_word: Ἱνατί
  choice: Por que
  rationale: Equivalente interrogativo direto e natural.
- source_word: ἐφρύαξαν
  choice: se enfureceram
  rationale: Expressa a agitação turbulenta e rebelde do verbo, com forma verbal coerente com o aoristo grego e com a pergunta sobre uma ação ocorrida.
- source_word: ἔθνη
  choice: as nações
  rationale: Refere-se amplamente às nações, preservando o pano de fundo do salmo, e não especificamente aos gentios como categoria religiosa.
- source_word: λαοὶ
  choice: os povos
  rationale: Conserva o plural e o paralelismo poético com “as nações”.
- source_word: ἐμελέτησαν
  choice: tramaram
  rationale: O verbo pode significar meditar, mas, no contexto de oposição hostil, denota conceber ou planejar algo; “tramaram” comunica essa força sem apagar a alternativa lexical, registrada em nota.
- source_word: κενά
  choice: coisas inúteis
  rationale: Comunica tanto a vacuidade quanto a ineficácia daquilo que os povos planejaram, em linguagem atual e clara.
theological_decisions:
- issue: Forma textual da introdução à citação
  choice: O texto principal omite “nosso pai” e liga “que” a Deus como aquele que falou pelo Espírito Santo e pela boca de Davi.
  alternative: 'Alguns manuscritos trazem “nosso pai Davi, teu servo”, permitindo uma introdução como: “que, por meio do Espírito Santo, pela boca de nosso pai Davi, teu servo, disse”.'
  rationale: A expressão τοῦ πατρὸς ἡμῶν é textualmente incerta e sua posição no texto apresentado é difícil. A leitura principal mantém uma construção portuguesa inteligível, enquanto a nota torna auditável a variante sem decidir silenciosamente a questão.
- issue: Sentido de ἐμελέτησαν no salmo citado
  choice: tramaram
  alternative: meditaram em
  rationale: O contexto de oposição favorece o sentido de planejar ou tramar, mas a polissemia real do verbo é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “teu” para harmonizar com a oração dirigida diretamente a Deus e conserva o idioma bíblico “pela boca de Davi”. A ordem dos agentes segue de perto o grego, sem sacrificar a naturalidade.
