  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: pt
  text: 'Mas Pedro e João lhes responderam: “Julguem vocês mesmos se é certo, diante de Deus, ouvir vocês em vez de Deus.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “obedecer a vocês em vez de obedecer a Deus”. O verbo grego significa literalmente “ouvir” ou “escutar”, mas, neste contexto, inclui a ideia de acatar uma autoridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Mas Pedro e João
  rationale: δέ marca aqui o contraste com a ordem das autoridades; “mas” expressa essa virada de modo natural.
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: lhes responderam
  rationale: A construção participial seguida de verbo finito é uma fórmula grega de resposta. Em português atual, “lhes responderam” comunica naturalmente o sentido completo sem a redundância pouco idiomática de “respondendo, disseram-lhes”.
- source_word: δίκαιόν
  choice: certo
  rationale: No contexto, o adjetivo qualifica o que é correto ou justificável perante o juízo de Deus; “certo” é claro, corrente e preserva a dimensão moral.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Expressão natural em português que conserva tanto a ideia de presença quanto a de avaliação perante Deus.
- source_word: ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ
  choice: ouvir vocês em vez de Deus
  rationale: “Ouvir” mantém o valor lexical de ἀκούω, enquanto o contexto permite perceber o sentido de acatar uma autoridade. “Em vez de” expressa com clareza o contraste de μᾶλλον ἢ.
- source_word: κρίνατε
  choice: Julguem vocês mesmos
  rationale: O imperativo plural desafia diretamente os ouvintes a fazer a avaliação; “vocês mesmos” torna explícita essa força discursiva sem alterar o conteúdo.
theological_decisions:
- issue: Se ἀκούειν deve ser traduzido de modo interpretativo como “obedecer” no contraste entre autoridades humanas e Deus
  choice: Manter “ouvir” no texto principal
  alternative: “obedecer a vocês em vez de obedecer a Deus”
  rationale: O contexto envolve obediência, mas o grego emprega o verbo ἀκούω, “ouvir/escutar”. A tradução principal preserva a formulação e a tensão do texto-fonte; a nota esclarece o sentido contextual sem substituir o termo por um verbo mais explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “diante de Deus” mantém a progressão natural da pergunta, e “vocês” evita tanto o regionalismo de “vós” quanto a possível ambiguidade referencial de “lhes” dentro do contraste.
