source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: pt
  text: Então, chamando-os, ordenaram-lhes que de modo nenhum falassem nem ensinassem em nome de Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες
  choice: chamando-os
  rationale: O particípio aoristo indica uma ação anterior à ordem; em português, o gerúndio no contexto transmite naturalmente que os fizeram comparecer antes de lhes dar a ordem.
- source_word: παρήγγειλαν
  choice: ordenaram-lhes
  rationale: O verbo expressa uma determinação dotada de autoridade; “ordenaram” preserva essa força em linguagem atual.
- source_word: τὸ καθόλου
  choice: de modo nenhum
  rationale: A expressão intensifica a proibição e indica sua abrangência total; “de modo nenhum” é claro, enfático e idiomático.
- source_word: μὴ φθέγγεσθαι
  choice: que ... falassem
  rationale: φθέγγομαι significa falar ou proferir; “falassem” conserva o sentido amplo sem restringi-lo à pregação pública.
- source_word: μηδὲ διδάσκειν
  choice: nem ensinassem
  rationale: μηδέ coordena uma segunda atividade proibida; “nem ensinassem” mantém o paralelismo natural em português.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: em nome de Jesus
  rationale: A formulação pode indicar referência ao nome ou atuação sob sua autoridade; a expressão portuguesa tradicional e natural preserva essa amplitude contextual.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Alcance da proibição relativa ao testemunho sobre Jesus
  choice: Uma proibição enfática tanto de falar como de ensinar em nome de Jesus
  alternative: Uma proibição limitada especificamente à proclamação pública
  rationale: A combinação de τὸ καθόλου com μὴ φθέγγεσθαι μηδὲ διδάσκειν apresenta uma proibição abrangente. A tradução não a restringe a uma modalidade pública que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “chamando-os” é concisa e natural; “ordenaram-lhes” preserva o caráter oficial da determinação; “de modo nenhum” comunica a ênfase total da proibição.
