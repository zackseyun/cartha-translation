  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: pt
  text: Pois nós não podemos deixar de falar do que vimos e ouvimos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois não somos capazes de não falar do que vimos e ouvimos.”'
    reason: Registra a forma negativa mais transparente da construção grega, enquanto o texto principal emprega português idiomático.
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: não podemos deixar de falar
  rationale: Expressa naturalmente em português a incapacidade de permanecer calado, preservando a força da construção grega sem recorrer a uma dupla negação pouco idiomática.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do conector, apresentando a razão da declaração anterior.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito conserva a ênfase do grego, embora o português pudesse omiti-lo.
- source_word: ἃ
  choice: do que
  rationale: Retoma de modo natural o conteúdo testemunhado e liga adequadamente 'falar' ao que foi visto e ouvido.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: vimos e ouvimos
  rationale: Os pretéritos perfeitos simples correspondem naturalmente aos aoristos gregos e preservam o caráter de testemunho ocular e auditivo.
- source_word: λαλεῖν
  choice: falar
  rationale: É o equivalente amplo e corrente do verbo no contexto de proclamação; a construção 'falar do que' explicita naturalmente seu conteúdo.
theological_decisions:
- issue: A compulsão apostólica é descrita como incapacidade de permanecer em silêncio, e não apenas como recusa voluntária.
  choice: não podemos deixar de falar
  alternative: não deixaremos de falar
  rationale: A formulação escolhida preserva οὐ δυνάμεθα, que expressa incapacidade, sem reduzir a afirmação a uma simples decisão ou promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva a conexão explicativa, a ênfase em “nós” e a tensão entre incapacidade e obrigação de testemunhar.
