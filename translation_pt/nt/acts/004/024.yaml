  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: pt
  text: 'Ao ouvirem isso, todos juntos[a] ergueram a voz a Deus e disseram: “Soberano[b], tu és aquele que fez o céu, a terra, o mar e tudo o que neles existe,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em comum acordo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Senhor soberano”. O termo grego Δέσποτα enfatiza autoridade absoluta e é distinto de κύριος (“Senhor”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo tem sentido temporal no contexto. “Isso” explicita de modo natural em português o conteúdo ouvido, recuperado do discurso anterior.
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: Expressa de modo corrente a ação unida do grupo, sem sugerir necessariamente uma votação ou decisão formal; a nota preserva a nuance de comum acordo.
- source_word: ἦραν φωνήν
  choice: ergueram a voz
  rationale: Mantém o singular coletivo do grego e corresponde a uma expressão natural em português para uma manifestação vocal conjunta.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: No contexto de oração, indica que a fala foi dirigida a Deus.
- source_word: Δέσποτα
  choice: Soberano
  rationale: Comunica autoridade absoluta e preserva a distinção lexical em relação a κύριος, normalmente traduzido por “Senhor”, sem acrescentar ao texto um segundo título.
- source_word: σὺ ὁ ποιήσας
  choice: tu és aquele que fez
  rationale: Reproduz a ênfase identificadora do pronome seguido do particípio substantivado, em formulação natural e solene.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: o céu, a terra, o mar
  rationale: Mantém a fórmula bíblica de criação e os substantivos singulares do grego, usando coordenação natural em português.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tudo o que neles existe
  rationale: Expressa claramente a totalidade do conteúdo do céu, da terra e do mar, com o pronome plural retomando os três domínios.
theological_decisions:
- issue: Tradução de Δέσποτα como título divino
  choice: Soberano
  alternative: Senhor soberano; Mestre; Senhor
  rationale: “Soberano” ressalta a autoridade absoluta associada a δεσπότης e evita confundi-lo com κύριος (“Senhor”). “Senhor soberano” explicaria bem o sentido, mas acrescentaria um título que não está formalmente presente; “Mestre” poderia soar principalmente pedagógico no português atual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A oração preserva o tom solene sem recorrer a construções arcaicas. Os marcadores foram colocados junto às expressões a que as notas efetivamente se referem.
