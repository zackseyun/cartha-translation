source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: pt
  text: Depois de serem libertados, eles foram para junto dos seus[a] e relataram tudo o que os chefes dos sacerdotes e os anciãos lhes tinham dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus companheiros”; mais literalmente, “dos seus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Depois de serem libertados
  rationale: O particípio aoristo passivo indica uma ação anterior à ida. “Libertados” corresponde ao contexto de detenção e soltura, enquanto a construção temporal é natural em português.
- source_word: δὲ
  choice: incorporado na transição temporal
  rationale: δέ é um conectivo leve; sua função discursiva fica naturalmente expressa pela abertura “Depois de serem libertados”, sem necessidade de uma conjunção adicional.
- source_word: ἦλθον πρὸς
  choice: foram para junto de
  rationale: ἔρχομαι admite “ir” ou “vir” conforme o ponto de vista. Aqui, “foram” é natural na perspectiva narrativa, e “para junto de” expressa πρὸς com referência a pessoas.
- source_word: τοὺς ἰδίους
  choice: os seus
  rationale: A expressão substantivada significa literalmente “os seus” e designa o grupo ou os companheiros aos quais Pedro e João pertenciam. A tradução preserva a concisão e a relativa abertura do grego.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: O verbo descreve a comunicação de informações recebidas ou de acontecimentos, sendo “relataram” preciso neste contexto.
- source_word: ὅσα
  choice: tudo o que
  rationale: A formulação portuguesa comunica naturalmente a abrangência total expressa pelo pronome relativo plural.
- source_word: πρὸς αὐτοὺς
  choice: lhes
  rationale: Com λέγω, πρός mais acusativo indica os destinatários da fala. O pronome “lhes” transmite de modo idiomático “a eles” sem sugerir que a preposição signifique “contra”.
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: A expressão designa as principais autoridades sacerdotais, não vários ocupantes simultâneos do cargo singular de sumo sacerdote. “Chefes dos sacerdotes” é claro e institucionalmente adequado.
- source_word: οἱ πρεσβύτεροι
  choice: os anciãos
  rationale: No contexto do conselho judaico, o termo se refere a líderes reconhecidos, não apenas a homens idosos. “Anciãos” preserva o título tradicional e institucional.
- source_word: εἶπαν
  choice: tinham dito
  rationale: O mais-que-perfeito composto esclarece em português que a fala das autoridades ocorreu antes do relato feito à comunidade.
