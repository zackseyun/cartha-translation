  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: pt
  text: muito perturbados porque eles ensinavam o povo e proclamavam, em Jesus, a ressurreição dentre os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “proclamavam, no caso de Jesus, a ressurreição dentre os mortos”. A expressão grega “em Jesus” pode apontar especificamente para a ressurreição demonstrada pelo fato de o próprio Jesus ter ressuscitado.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: muito perturbados
  rationale: Expressa forte incômodo ou irritação das autoridades sem recorrer a uma formulação coloquial nem definir de modo excessivo a emoção.
- source_word: διὰ τὸ διδάσκειν αὐτοὺς
  choice: porque eles ensinavam
  rationale: διά com infinitivo articular indica causa; a oração finita é natural em português, e “eles” preserva a referência pronominal ao contexto anterior.
- source_word: τὸν λαὸν
  choice: o povo
  rationale: Mantém o sentido coletivo de λαός e é a formulação mais natural e abrangente no contexto.
- source_word: καταγγέλλειν
  choice: proclamavam
  rationale: Comunica anúncio público e solene, adequado à atividade descrita.
- source_word: ἐν τῷ Ἰησοῦ
  choice: em Jesus
  rationale: Tradução direta que preserva a abertura semântica da preposição ἐν, sem decidir se a ressurreição é proclamada por meio de Jesus ou demonstrada no caso dele.
- source_word: τὴν ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: a ressurreição dentre os mortos
  rationale: “Ressurreição” conserva o peso do termo, e “dentre os mortos” explicita que se trata de levantar-se do meio dos que estão mortos, acompanhando de perto ἐκ νεκρῶν.
theological_decisions:
- issue: Sentido de ἐν τῷ Ἰησοῦ na proclamação da ressurreição
  choice: “em Jesus”, preservando a possibilidade de a ressurreição estar centrada nele ou manifestada em sua própria ressurreição
  alternative: “por meio de Jesus” ou “no caso de Jesus”
  rationale: A construção grega admite nuances próximas. O texto principal mantém a formulação transparente, e a nota registra a leitura específica ligada à ressurreição do próprio Jesus.
- issue: Alcance de “a ressurreição dentre os mortos”
  choice: Formulação que permite tanto a referência imediata à ressurreição de Jesus quanto a esperança mais ampla da ressurreição demonstrada nele
  alternative: Referência exclusiva à ressurreição de Jesus ou, inversamente, apenas à ressurreição geral futura
  rationale: O grego não exige que uma dessas dimensões seja excluída; a tradução evita restringir o alcance teológico da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A vírgula em “em Jesus” ajuda a ligar a expressão à proclamação da ressurreição, sem eliminar sua ambiguidade genuína.
