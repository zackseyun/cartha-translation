id: ACT.4.33
reference: Acts 4:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: pt
  text: E com grande poder os apóstolos davam testemunho da ressurreição do Senhor Jesus, e grande favor[a] estava sobre todos eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «grande graça». A palavra grega pode significar «graça» ou «favor»; a expressão pode abranger tanto a presença graciosa de Deus quanto a consideração favorável demonstrada aos que criam.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: com grande poder
  rationale: O dativo expressa modo ou meio. «Poder» é natural em Lucas–Atos e preserva a ideia de eficácia concedida por Deus sem limitar o sentido a milagres.
- source_word: ἀπεδίδουν
  choice: davam
  rationale: O imperfeito indica ação contínua ou repetida; combinado com «testemunho», «davam» produz uma expressão portuguesa clara e idiomática.
- source_word: τὸ μαρτύριον
  choice: testemunho
  rationale: O substantivo designa testemunho ou depoimento. «Dar testemunho» é a formulação portuguesa corrente e não exige acrescentar um possessivo ausente do texto grego.
- source_word: τῆς ἀναστάσεως
  choice: da ressurreição
  rationale: O genitivo indica o conteúdo do testemunho. Em português, «dar testemunho da ressurreição» é natural e mantém proximidade formal com o grego.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Mantém o título κύριος como «Senhor» e identifica Jesus como aquele que ressuscitou.
- source_word: χάρις μεγάλη
  choice: grande favor
  rationale: χάρις pode significar graça ou favor. «Grande favor» funciona no contexto e evita restringir o referente exclusivamente à graça salvífica, embora a alternativa seja registrada em nota.
- source_word: τε
  choice: e
  rationale: A partícula conecta suavemente as orações; «e» reproduz essa função de maneira natural.
- source_word: ἐπὶ πάντας αὐτούς
  choice: estava sobre todos eles
  rationale: Preserva a imagem de algo que repousava ou se estendia sobre toda a comunidade.
theological_decisions:
- issue: Sentido e fonte de χάρις
  choice: favor sobre toda a comunidade, sem especificar sua fonte
  alternative: graça divina em sentido explicitamente teológico ou favor demonstrado pelas pessoas
  rationale: O texto não declara de quem procede a χάρις. A tradução principal e a nota preservam a amplitude lexical e a possível sobreposição entre a ação graciosa de Deus e o favor desfrutado pelos fiéis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «davam testemunho da ressurreição» preserva o aspecto contínuo do imperfeito e soa natural; a nota mantém a ambiguidade de χάρις.
