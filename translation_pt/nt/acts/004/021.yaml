  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: pt
  text: Então, depois de os ameaçarem ainda mais[a], soltaram-nos, pois, por causa do povo, não encontravam como puni-los, visto que todos glorificavam a Deus pelo que havia acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de os ameaçarem novamente” ou “depois de acrescentarem novas ameaças”. O particípio grego προσαπειλησάμενοι indica uma ameaça adicional ou intensificada em relação ao que já havia ocorrido.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: depois de os ameaçarem ainda mais
  rationale: O particípio indica ameaça adicional ou intensificada em relação às ameaças anteriores. A formulação é natural em português e preserva o valor do prefixo.
- source_word: ἀπέλυσαν
  choice: soltaram-nos
  rationale: No contexto de detenção pelas autoridades, o verbo significa pôr em liberdade ou deixar ir. “Soltaram-nos” é claro e corrente.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: pois não encontravam um modo de castigá-los
  rationale: A construção expressa que as autoridades não achavam como ou por que meio aplicar punição. O imperfeito português acompanha naturalmente o particípio circunstancial, e “castigar” comunica a ação punitiva.
- source_word: διὰ τὸν λαόν
  choice: por causa do povo
  rationale: διά com acusativo tem sentido causal. “Povo” representa λαός como a população em geral, cuja reação restringia as autoridades.
- source_word: πάντες
  choice: todos
  rationale: Preserva de modo direto o alcance universal da expressão no contexto.
- source_word: ἐδόξαζον τὸν θεόν
  choice: glorificavam a Deus
  rationale: “Glorificavam” conserva a linguagem de honra dirigida a Deus e o aspecto contínuo do imperfeito grego.
- source_word: ἐπὶ τῷ γεγονότι
  choice: pelo que havia acontecido
  rationale: Expressa de modo idiomático a ocorrência já concluída que servia de motivo para glorificar a Deus.
