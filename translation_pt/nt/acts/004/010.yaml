id: ACT.4.10
reference: Acts 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: pt
  text: Saibam todos vocês e todo o povo de Israel que, em nome de Jesus, o Messias, o Nazareno[a] — a quem vocês crucificaram e a quem Deus ressuscitou dentre os mortos — por esse nome[b], este homem está diante de vocês com saúde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo, o Nazareno”. O título grego Χριστός pode ser traduzido como “Messias” ou, em uso mais próximo de um nome próprio, como “Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou “por meio dele”. A expressão grega pode se referir instrumentalmente ao próprio Jesus ou, mais especificamente, ao nome que acaba de ser mencionado.
    reason: lexical_alternative
  - marker: c
    text: Ou “são” ou “em perfeita saúde”. O termo grego indica integridade física ou saúde restaurada.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: Saibam
  rationale: Expressa de modo natural em português a força imperativa da declaração pública grega, sem perder sua solenidade.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: todos vocês e todo o povo de Israel
  rationale: 'Mantém os dois grupos de destinatários: os ouvintes imediatos e o povo de Israel em sentido mais amplo.'
- source_word: ἐν τῷ ὀνόματι
  choice: em nome de
  rationale: Preserva a expressão grega e sua referência ao poder ou à autoridade eficaz associados ao nome de Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, tornando explícito seu sentido messiânico no discurso dirigido aos líderes de Israel.
- source_word: τοῦ Ναζωραίου
  choice: o Nazareno
  rationale: Reproduz diretamente o gentílico ou epíteto grego, mantendo seu registro identificador.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: a quem vocês crucificaram
  rationale: Preserva a acusação direta e a ênfase explícita no papel dos ouvintes.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: a quem Deus ressuscitou dentre os mortos
  rationale: Mantém a agência divina e a linguagem de ressurreição, com formulação corrente e dignificada em português.
- source_word: ἐν τούτῳ
  choice: por esse nome
  rationale: Retoma o nome mencionado imediatamente antes e comunica a função instrumental da expressão; a possível referência ao próprio Jesus é registrada em nota.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: este homem está diante de vocês
  rationale: Identifica naturalmente o homem presente e comunica o estado atual expresso pelo perfeito grego.
- source_word: ὑγιής
  choice: curado
  rationale: No contexto da cura do homem, comunica claramente a restauração física indicada pelo adjetivo, enquanto alternativas mais literais são preservadas em nota.
theological_decisions:
- issue: Χριστός como título ou elemento semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: O contexto da proclamação diante dos líderes de Israel favorece a força titular de Χριστός; a alternativa tradicional permanece indicada em nota.
- issue: Referente de ἐν τούτῳ
  choice: por esse nome
  alternative: por meio dele
  rationale: A proximidade de ὄνομα favorece a retomada do nome, mas a forma grega também pode apontar para o próprio Jesus; a ambiguidade é preservada por nota.
- issue: Formulação da ressurreição
  choice: a quem Deus ressuscitou dentre os mortos
  alternative: a quem Deus levantou dentre os mortos
  rationale: A tradução conserva a agência explícita de Deus e a afirmação da ressurreição sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural “vocês” evita regionalismo excessivo; a frase conserva o tom público e solene do discurso, bem como a repetição intencional de “nome” no grego.
