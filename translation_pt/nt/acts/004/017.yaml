reference: Acts 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: pt
  text: Mas, para que isso não se espalhe ainda mais entre o povo, vamos ameaçá-los[a] para que não falem mais a ninguém neste nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vamos adverti-los severamente». O verbo grego significa propriamente «ameaçar» e indica intimidação por parte das autoridades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: se espalhe
  rationale: No contexto, o verbo descreve a difusão da notícia ou mensagem entre o povo; «espalhar-se» é natural em português e preserva a imagem de propagação.
- source_word: ἐπὶ πλεῖον
  choice: ainda mais
  rationale: A expressão indica avanço além do alcance já atingido; «ainda mais» conserva sua força comparativa.
- source_word: λαός
  choice: o povo
  rationale: Refere-se à população em geral, especialmente ao público judeu; «o povo» é amplo, natural e adequado ao uso em Atos.
- source_word: ἀπειλησώμεθα
  choice: vamos ameaçá-los
  rationale: O verbo significa propriamente ameaçar e, nesta cena de coerção oficial, a tradução direta comunica melhor sua força do que o mais brando «advertir».
- source_word: μηκέτι λαλεῖν
  choice: para que não falem mais
  rationale: A construção portuguesa preserva a proibição e o sentido temporal de cessação expresso por μηκέτι.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: neste nome
  rationale: Mantém a formulação característica de Atos, sem definir de modo excessivamente estreito se a ideia é autoridade, invocação ou associação com o nome.
- source_word: μηδενὶ ἀνθρώπων
  choice: a ninguém
  rationale: Expressa naturalmente em português o destinatário genérico da fala proibida, sem introduzir marcação de gênero ausente do sentido contextual.
theological_decisions:
- issue: Força coercitiva de ἀπειλησώμεθα na reação do conselho
  choice: Traduzir no texto principal por «vamos ameaçá-los».
  alternative: «vamos adverti-los»
  rationale: A cena é jurídica e coercitiva, e o verbo grego tem força explícita de ameaça. A alternativa mais branda é possível como formulação contextual, mas pode ocultar a intimidação exercida pelas autoridades.
- issue: Sentido de ἐπὶ τῷ ὀνόματι τούτῳ
  choice: Preservar «neste nome».
  alternative: «com base na autoridade deste nome» ou «a respeito deste nome»
  rationale: A expressão pode envolver autoridade, invocação e associação. A tradução formal e natural preserva essa amplitude teológica em vez de resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada à sintaxe natural do português, sem explicitar o referente implícito de «isso». «Neste nome» foi mantido para preservar a formulação e a amplitude do original.
