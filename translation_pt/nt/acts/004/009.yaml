  source_fidelity: A tradução transmite adequadamente o caráter judicial de ἀνακρινόμεθα, a boa ação dirigida a um homem fisicamente debilitado e a cura como sentido contextual de σέσωσται. Contudo, “por causa de” pode sugerir causalidade acusatória mais diretamente do que a ideia grega de assunto/base do exame, e “para saber” introduz uma finalidade que não está expressa no texto.
  naturalness: O texto é claro, mas “a respeito de” é mais idiomático e semanticamente preciso neste contexto jurídico. A formulação revista também elimina a construção algo pesada “para saber por que meio”.
  terminology: “Interrogados”, “boa ação”, “homem enfermo” e “foi curado” são escolhas defensáveis e adequadas ao registro. A nota deve usar “resgate”, não “salvamento”, para o sentido não soteriológico mais natural em português, preservando a amplitude de σῴζω.
