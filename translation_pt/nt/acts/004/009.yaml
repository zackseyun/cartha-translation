    issue: “por causa de” para ἐπὶ εὐεργεσίᾳ
    rationale: A expressão portuguesa pode indicar que a boa ação é a causa de uma acusação ou punição. O grego marca sobretudo o assunto ou a base sobre a qual ocorre o exame. “A respeito de” preserva melhor essa relação sem enfraquecer a ironia do contexto.
  - severity: low
    issue: “para saber” acrescenta uma relação de finalidade
    rationale: O grego apresenta a questão relativa ao meio pelo qual o homem foi curado, mas não exprime explicitamente a finalidade “para saber”. Uma formulação interrogativa indireta sem essa adição é mais próxima da sintaxe e do sentido.
  - severity: low
    issue: “salvamento” na nota
    rationale: Embora compreensível, “resgate” é a designação mais natural em português moderno para o campo semântico não soteriológico de σῴζω, ao lado de “salvação” e “cura”.
