  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: pt
  text: Se hoje estamos sendo interrogados a respeito de uma boa ação feita a um homem enfermo, por qual meio ele foi curado[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi salvo” ou “ficou são”. O verbo grego pode se referir a resgate, salvação ou cura; aqui, o contexto imediato aponta para a cura física.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: estamos sendo interrogados
  rationale: O verbo descreve um questionamento de caráter judicial ou investigativo. “Estamos sendo interrogados” comunica esse contexto com clareza, sem afirmar de modo excessivamente específico que já se trata de um julgamento formal.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: por causa de uma boa ação
  rationale: A construção indica a base ou ocasião do interrogatório, e εὐεργεσία designa um ato benéfico. A formulação preserva a ironia de serem questionados por terem feito o bem.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: feita a um homem enfermo
  rationale: O genitivo identifica o beneficiário da boa ação. No contexto, ἀσθενής se refere a uma limitação física; “enfermo” mantém o sentido amplo sem especificar uma condição além do que o grego declara neste versículo.
- source_word: ἐν τίνι
  choice: por que meio
  rationale: A expressão pode indicar meio ou agência. “Por que meio” conserva a amplitude da pergunta grega, sem antecipar a resposta do versículo seguinte ao traduzi-la diretamente como “por meio de quem”.
- source_word: σέσωσται
  choice: foi curado
  rationale: O perfeito de σῴζω indica o estado resultante da ação. No contexto imediato, trata-se da restauração física do homem anteriormente incapaz de andar; a nota preserva os sentidos mais amplos do verbo.
theological_decisions:
- issue: Sentido de σέσωσται em um contexto de cura
  choice: foi curado
  alternative: foi salvo; ficou são
  rationale: A restauração física é o referente imediato, mas σῴζω também pode expressar salvamento ou salvação. O texto principal comunica o sentido contextual, enquanto a nota mantém a sobreposição lexical e a possível ressonância teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão “para saber” torna explícita em português a relação explicativa entre o interrogatório e a pergunta subsequente, sem alterar seu conteúdo. O travessão final preserva o fato de que a frase continua no versículo seguinte.
