- from: Se hoje estamos sendo interrogados por causa de uma boa ação feita a um homem enfermo, para saber por que meio ele foi curado[a] —
  to: Se hoje estamos sendo interrogados a respeito de uma boa ação feita a um homem enfermo, por qual meio ele foi curado[a]—
