base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: pt
  text: A multidão dos que haviam crido tinha um só coração e uma só alma, e nenhum deles dizia que qualquer bem que possuía era exclusivamente seu, mas tudo lhes era comum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: “eles compartilhavam tudo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: multidão
  rationale: Preserva a ideia de um grande número de pessoas reunidas, com linguagem natural em português.
- source_word: τῶν πιστευσάντων
  choice: dos que haviam crido
  rationale: Torna transparente o valor verbal do particípio aoristo e apresenta a fé como anterior à situação descrita.
- source_word: καρδία καὶ ψυχὴ μία
  choice: tinha um só coração e uma só alma
  rationale: Preserva os dois substantivos e a imagem bíblica de profunda unidade interior e de propósito.
- source_word: οὐδὲ εἷς
  choice: nenhum deles
  rationale: Expressa de maneira clara e enfática que não havia sequer uma exceção.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: qualquer coisa que lhe pertencia
  rationale: Mantém o singular distributivo do grego e o sentido abrangente de bens ou posses pertencentes a cada pessoa.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: dizia que ... era sua
  rationale: Segue de perto a construção grega sem ampliar o sentido para uma reivindicação jurídica explícita.
- source_word: πάντα κοινά
  choice: tudo lhes era comum
  rationale: Preserva a estrutura predicativa e a ideia de bens compartilhados, sem impor um sistema econômico posterior.
theological_decisions:
- issue: Descrição dos bens comuns na igreja de Jerusalém
  choice: O versículo relata que ninguém tratava seus bens como exclusivamente seus e que tudo lhes era comum.
  alternative: Traduzir de modo mais forte, como “possuíam tudo em conjunto”, ou de modo mais fraco, minimizando a comunhão dos bens.
  rationale: A formulação conserva a tensão do texto entre a existência de coisas pertencentes a indivíduos e sua disponibilidade comum, sem transformar a descrição em aprovação de um sistema político, econômico ou eclesiástico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens centrais do grego foram preservadas, evitando literalismo pouco natural. O marcador [a] aparece no texto principal e corresponde à única nota.
