  source_fidelity: A tradução preserva bem a unidade expressa por «um só coração e uma só alma», o caráter distributivo de «nenhum deles» e a descrição de que tudo era comum. Contudo, «qualquer coisa que lhe pertencia era sua» em português soa tautológica e pode obscurecer o sentido de ἴδιον, isto é, tratar um bem como propriedade própria/privada.
  naturalness: O período é claro e de registro adequado. A formulação relativa aos bens, porém, é pouco idiomática; uma redação que explicite «qualquer bem que possuía» e «exclusivamente seu» é mais natural sem ampliar indevidamente o sentido.
  terminology: «Multidão», «haviam crido», «coração», «alma» e «comum» são escolhas adequadas. «Exclusivamente seu» comunica de modo natural o valor de ἴδιον no contraste com «tudo lhes era comum», sem impor um modelo econômico posterior.
