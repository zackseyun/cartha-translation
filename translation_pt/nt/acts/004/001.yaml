id: ACT.4.1
reference: Acts 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: pt
  text: Enquanto eles falavam ao povo, os sacerdotes, o capitão do templo[b] e os saduceus aproximaram-se deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegaram até eles”. O verbo grego pode indicar uma chegada ou aproximação repentina; neste contexto, trata-se de uma interrupção por parte das autoridades.
    reason: lexical_alternative
  - marker: b
    text: O “capitão do templo” era o oficial responsável pela ordem e pela segurança no recinto do templo.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Enquanto eles falavam
  rationale: O genitivo absoluto expressa simultaneidade e é traduzido naturalmente por uma oração temporal. O valor continuativo de δέ é refletido pela progressão narrativa, sem acrescentar um marcador como “então” ou “ora”.
- source_word: πρὸς τὸν λαὸν
  choice: ao povo
  rationale: λαός designa aqui as pessoas reunidas no recinto do templo. “Povo” é preciso e menos interpretativo que “multidão”.
- source_word: ἐπέστησαν αὐτοῖς
  choice: aproximaram-se deles
  rationale: O verbo pode indicar chegada, aproximação ou comparecimento súbito. “Aproximaram-se deles” é natural em português e não impõe por si só uma confrontação hostil, embora o contexto mostre uma interrupção oficial.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: O texto diz ἱερεῖς, não ἀρχιερεῖς; por isso, “sacerdotes” evita introduzir a categoria mais específica de “chefes dos sacerdotes”.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: o capitão do templo
  rationale: στρατηγός indica um oficial com autoridade de comando. A formulação preserva o título de modo conciso, deixando a explicação funcional para a nota.
- source_word: οἱ Σαδδουκαῖοι
  choice: os saduceus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
theological_decisions:
- issue: Possível nuance adversativa na chegada das autoridades
  choice: aproximaram-se deles
  alternative: vieram confrontá-los
  rationale: O contexto posterior evidencia oposição, mas o verbo neste versículo não exige que a hostilidade seja explicitada. A tradução mantém a tensão narrativa sem antecipar uma interpretação mais forte.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Sacerdotes” mantém a precisão do termo grego, e as notas preservam tanto a amplitude lexical do verbo de chegada quanto o contexto histórico do cargo no templo.
