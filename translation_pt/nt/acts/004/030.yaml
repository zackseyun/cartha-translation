  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: pt
  text: enquanto estendes a tua mão para curar, e sinais e maravilhas se realizam por meio do nome do teu santo servo Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do teu santo filho Jesus”. A palavra grega pode significar tanto “servo” como “filho”; aqui, “servo” é preferível porque Atos evoca a linguagem de Isaías a respeito do Servo do Senhor.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: enquanto estendes
  rationale: A construção ἐν τῷ com infinitivo expressa aqui uma circunstância simultânea. “Enquanto estendes” é natural em português e preserva a relação temporal com o pedido do versículo anterior.
- source_word: τὴν χεῖρά σου
  choice: a tua mão
  rationale: A tradução direta preserva a imagem bíblica da mão de Deus como expressão de sua ação e poder, sem acrescentar uma explicação interpretativa.
- source_word: εἰς ἴασιν
  choice: para curar
  rationale: ἴασις denota cura, e εἰς indica finalidade ou resultado. A forma verbal é corrente e clara em português.
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e maravilhas
  rationale: Mantém a conhecida expressão dupla de Atos sem acrescentar “milagrosos”, qualificativo que já está implícito no contexto.
- source_word: γίνεσθαι
  choice: se realizam
  rationale: Neste contexto, γίνομαι descreve sinais e maravilhas que vêm a acontecer. “Se realizam” é digno e natural, além de evitar a impressão de que sejam meros acontecimentos fortuitos.
- source_word: διὰ τοῦ ὀνόματος
  choice: por meio do nome
  rationale: διά com genitivo indica meio ou agência. A tradução conserva “nome” e sua associação bíblica com a pessoa e a autoridade de Jesus sem explicitar além do texto.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: de Jesus, teu santo servo
  rationale: παῖς pode significar “servo” ou “filho/criança”. Em Atos 3–4, a evocação do Servo de Isaías favorece “servo”. A ordem escolhida soa natural em português e mantém a relação de Jesus com Deus.
theological_decisions:
- issue: Tradução de παῖς aplicado a Jesus
  choice: servo
  alternative: filho ou criança
  rationale: Embora παῖς admita ambos os sentidos, o uso de Atos 3:13, 3:26 e 4:27,30 evoca de modo forte a linguagem do Servo de Isaías. “Servo” preserva essa ligação sem negar a filiação de Jesus, expressa em outros contextos por termos distintos. A ambiguidade lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e uso coerente de “tu” na oração dirigida a Deus. A formulação conserva a estrutura circunstancial do grego e evita explicitar “autoridade” onde o texto diz apenas “nome”.
