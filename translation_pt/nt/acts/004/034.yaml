base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: pt
  text: Pois não havia entre eles sequer uma pessoa necessitada, porque todos os que possuíam terras ou casas as vendiam e traziam os valores obtidos com as vendas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “os preços das coisas que eram vendidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Pois não havia... sequer
  rationale: “Pois” preserva a função explicativa de γάρ, enquanto “sequer” expressa naturalmente a ênfase negativa de οὐδέ em português.
- source_word: ἐνδεής
  choice: pessoa necessitada
  rationale: Expressa a condição de quem passa necessidade sem restringir indevidamente o termo a uma categoria social fixa; a inclusão de “pessoa” torna a frase natural.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: havia entre eles... uma pessoa
  rationale: A construção existencial com “havia” é a forma mais natural de reproduzir o sentido do grego em português atual.
- source_word: ὅσοι
  choice: todos os que
  rationale: 'Preserva o alcance distributivo: todos os membros da classe descrita, sem afirmar algo além desse grupo.'
- source_word: κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: possuíam terras ou casas
  rationale: Formulação clara e idiomática que comunica a posse indicada por κτήτορες e ὑπῆρχον. “Terras” representa χωρίων sem limitar a referência a campos cultivados.
- source_word: πωλοῦντες ἔφερον
  choice: as vendiam e traziam
  rationale: A coordenação verbal transmite com naturalidade a relação entre o particípio e o verbo principal; os imperfeitos no contexto indicam uma prática repetida ou contínua.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: os valores obtidos com as vendas
  rationale: Comunica em português natural o dinheiro resultante das vendas, mantendo o plural de τὰς τιμὰς sem a rigidez de uma tradução puramente literal.
