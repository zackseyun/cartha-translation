  source_fidelity: O texto preserva adequadamente a pergunta deliberativa (Τί ποιήσωμεν), o referente masculino específico de «estes homens», a relação explicativa de ὅτι μὲν γάρ, a ocorrência do sinal por meio deles e sua evidência pública em Jerusalém. A reorganização sintática em português — «é evidente ... que ... aconteceu» — comunica com clareza a predicação de φανερόν sem alterar o sentido. «Não podemos negá-lo» retoma legitimamente o sinal, cujo objeto é implícito no grego.
