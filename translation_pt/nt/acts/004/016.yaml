id: ACT.4.16
reference: Acts 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: pt
  text: 'dizendo: “O que devemos fazer com estes homens? Pois é evidente a todos os habitantes de Jerusalém que, por meio deles, aconteceu um sinal bem conhecido[a], e não podemos negá-lo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sinal notável”. O grego γνωστόν pode significar “conhecido” ou “bem conhecido” e, neste contexto, indica um sinal publicamente reconhecido.
    reason: Alternativa lexical que registra a amplitude semântica de γνωστόν.
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz as palavras do conselho e mantém a ligação sintática com o contexto anterior.
- source_word: Τί ποιήσωμεν
  choice: O que devemos fazer
  rationale: O subjuntivo aoristo forma uma pergunta deliberativa; esta formulação é corrente em português e preserva a ideia de deliberação.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: com estes homens
  rationale: Depois de ποιέω, o dativo tem aqui o sentido idiomático de fazer algo com alguém. O contexto identifica especificamente Pedro e João.
- source_word: ὅτι μὲν γὰρ
  choice: Pois
  rationale: Introduz a razão da deliberação. A ênfase do conjunto grego é também comunicada pela construção afirmativa que segue, sem tornar a frase pesada.
- source_word: γνωστὸν σημεῖον
  choice: um sinal bem conhecido
  rationale: γνωστός indica algo conhecido ou publicamente reconhecido; 'bem conhecido' preserva esse sentido sem reduzir σημεῖον a mero milagre.
- source_word: γέγονεν
  choice: aconteceu
  rationale: Expressa a ocorrência já realizada do sinal; o resultado presente fica claro pela notoriedade e pela impossibilidade de negá-lo.
- source_word: δι’ αὐτῶν
  choice: por meio deles
  rationale: διά com genitivo indica mediação ou instrumentalidade e evita atribuir aos apóstolos uma agência independente além do que o texto afirma.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: é evidente a todos os habitantes de Jerusalém
  rationale: Reproduz a relação entre φανερόν e o dativo, em ordem natural no português moderno.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: não podemos negá-lo
  rationale: O pronome retoma naturalmente o sinal ocorrido, objeto deixado implícito no grego.
theological_decisions:
- issue: Sentido de σημεῖον no contexto da cura pública
  choice: sinal
  alternative: milagre
  rationale: '''Sinal'' conserva o vocabulário de Lucas e sua possível dimensão teológica, isto é, um ato que aponta para além de si mesmo, enquanto o caráter milagroso já é dado pelo contexto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem da oração foi ajustada para soar natural em português, preservando a relação lógica e a ênfase do grego.
