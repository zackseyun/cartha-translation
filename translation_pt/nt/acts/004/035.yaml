    rationale: δέ aqui conecta as duas ações, mas não marca necessariamente uma consequência ou sucessão temporal. “Então” acrescenta uma nuance ausente; “e” reproduz melhor a coordenação simples.
  - severity: medium
    issue: “conforme a necessidade de cada pessoa” para καθότι ἄν τις χρείαν εἶχεν
    rationale: O grego diz literalmente, em sentido genérico, “conforme alguém tinha necessidade”. A formulação atual transforma a oração indefinida em uma expressão nominal e pode sugerir que “cada pessoa” é o referente distributivo da necessidade, em vez de preservar a construção aberta do texto.
