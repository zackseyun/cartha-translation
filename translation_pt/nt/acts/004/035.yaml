  source_fidelity: A tradução preserva corretamente os imperfeitos em “colocavam” e “se distribuía”, a imagem concreta de “aos pés dos apóstolos” e a construção passiva/impessoal da distribuição. Contudo, “então” introduz uma sequência temporal que o δέ grego não exige, e “conforme a necessidade de cada pessoa” reformula indevidamente a oração genérica ἄν τις χρείαν εἶχεν.
  naturalness: O português é claro e de registro adequado. “Conforme alguém tinha necessidade” é natural, mantém a generalidade do original e evita sugerir que a necessidade de toda pessoa, sem distinção, seja o critério expresso.
  terminology: “Aos pés dos apóstolos”, “a cada um” e “necessidade” são escolhas adequadas. A nota lexical preserva corretamente a alternativa “diante dos apóstolos” e a imagem do original.
