base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: pt
  text: e os colocavam aos pés dos apóstolos[b][a]; e se distribuía a cada um conforme alguém tinha necessidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante dos apóstolos”. O grego diz literalmente “aos pés dos apóstolos”, preservando a imagem de colocar os valores sob a supervisão deles.'
    reason: lexical_alternative
  - marker: b
    text: 'O objeto de “colocavam” e de “se distribuía” fica implícito e vem do versículo anterior: o valor obtido com o que havia sido vendido.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: colocavam
  rationale: O imperfeito indica uma ação contínua ou repetida; em português, o pretérito imperfeito expressa naturalmente esse aspecto sem exigir uma locução progressiva.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: aos pés dos apóstolos
  rationale: Preserva a imagem concreta do grego e, no contexto, sugere que os valores eram postos sob a supervisão dos apóstolos.
- source_word: διεδίδετο
  choice: se distribuía
  rationale: O imperfeito passivo descreve uma prática contínua ou habitual. A construção pronominal mantém a distribuição impessoal sem identificar um agente não expresso no grego.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Reproduz o sentido distributivo individual do dativo singular.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: conforme a necessidade de cada pessoa
  rationale: Expressa de modo natural a correspondência entre a distribuição e a necessidade, mantendo o valor genérico de τις e evitando linguagem marcada por gênero.
- source_word: χρείαν
  choice: necessidade
  rationale: Equivalente claro e corrente para a ideia de carência ou necessidade concreta.
theological_decisions:
- issue: Explicitação do objeto de “colocavam” e “se distribuía”
  choice: Manter o objeto implícito no corpo do versículo e explicá-lo em nota.
  alternative: Acrescentar “o dinheiro” ou “o valor arrecadado” nas duas orações.
  rationale: O grego depende do contexto do versículo anterior e não nomeia novamente o objeto. Mantê-lo implícito preserva a coesão textual e evita especificidade interpretativa desnecessária.
- issue: Agente da distribuição
  choice: Usar a construção impessoal “se distribuía”, sem identificar quem fazia a distribuição.
  alternative: Traduzir “os apóstolos distribuíam”.
  rationale: O verbo grego está na voz passiva e não declara o agente; atribuir explicitamente a ação aos apóstolos iria além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O pretérito imperfeito preserva o caráter repetido das ações. A ordem dos marcadores [b][a] acompanha a posição relevante após “colocavam aos pés dos apóstolos” e mantém todos os marcadores no texto principal.
