id: ACT.4.11
reference: Acts 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: pt
  text: Ele é a pedra que foi rejeitada por vocês, os construtores, e que se tornou a pedra angular.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a pedra de remate”; mais literalmente: “a cabeça da esquina”.'
    reason: A expressão grega pode designar uma pedra principal na junção arquitetônica, mas o referente estrutural exato é discutido.
lexical_decisions:
- source_word: οὗτός
  choice: Este
  rationale: Preserva a identificação enfática com Jesus no contexto imediato, sem acrescentar seu nome ao texto.
- source_word: λίθος
  choice: pedra
  rationale: É o sentido comum do termo e mantém a imagem e a alusão ao Salmo 118:22.
- source_word: ἐξουθενηθεὶς
  choice: rejeitaram
  rationale: No contexto da construção, expressa naturalmente que os construtores consideraram a pedra sem valor e a descartaram, preservando também a força acusatória do verbo.
- source_word: ὑφ’ ὑμῶν
  choice: vocês
  rationale: Mantém explícita a acusação direta no plural, de modo natural e amplamente compreensível em português moderno.
- source_word: τῶν οἰκοδόμων
  choice: os construtores
  rationale: Conserva a metáfora da citação bíblica e a aposição que identifica os destinatários como aqueles que rejeitaram a pedra.
- source_word: ὁ γενόμενος
  choice: que se tornou
  rationale: Expressa a mudança de condição da pedra rejeitada para sua posição honrada, sem impor ao particípio uma nuance temporal além do contexto.
- source_word: κεφαλὴν γωνίας
  choice: a pedra angular
  rationale: É a formulação portuguesa mais clara e corrente para a expressão idiomática arquitetônica, enquanto a tradução mais literal e a alternativa 'pedra de remate' são preservadas em nota.
theological_decisions:
- issue: Imagem da citação do Salmo 118:22
  choice: pedra angular
  alternative: pedra de remate; literalmente, cabeça do ângulo
  rationale: A tradução identifica Jesus com a pedra rejeitada e depois honrada, sem decidir de modo dogmático qual elemento arquitetônico específico está em vista. A ambiguidade legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada para soar natural, mantendo a acusação direta a “vocês, os construtores” e a metáfora bíblica.
