review_pass:
  verdict: revise
  source_fidelity: A tradução de ἐπέβαλον τὰς χεῖρας ἐπὶ por “agarraram” capta adequadamente, neste contexto hostil, a apreensão dos apóstolos. “Apóstolos” é o equivalente estabelecido de ἀποστόλους. “Custódia” reflete bem τήρησις, mas a combinação “sob custódia pública” não é idiomática em português e pode sugerir uma custódia exposta ao público, em vez de uma detenção em estabelecimento ou custódia oficial pública.
  naturalness: “E agarraram os apóstolos e os colocaram...” é claro e fluente. Contudo, “sob custódia pública” soa calcado e semanticamente ambíguo no português moderno. “Na prisão pública” é a formulação natural para a detenção pública/comum indicada por τηρήσει δημοσίᾳ; a nota preserva a possibilidade mais ampla de custódia ou confinamento.
  terminology: “Apóstolos” está correto e consistente com o uso de Atos. “Prisão pública” mantém o modificador δημοσίᾳ sem convertê-lo interpretativamente em “estatal”. A nota lexical evita afirmar que o grego exija um edifício prisional.
