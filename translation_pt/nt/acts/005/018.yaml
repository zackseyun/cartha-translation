    rationale: No contexto de detenção, τηρήσει δημοσίᾳ designa custódia/prisão pública ou comum. Em português, “na prisão pública” comunica naturalmente a função de detenção, enquanto a nota explicita que o termo grego pode ser mais abrangente do que um edifício prisional.
