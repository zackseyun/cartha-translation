  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: pt
  text: E agarraram os apóstolos e os colocaram na prisão pública.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob custódia pública”. A expressão grega pode indicar custódia ou confinamento de modo mais geral, e não necessariamente um edifício prisional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: agarraram
  rationale: A expressão idiomática significa pôr as mãos sobre alguém de modo hostil, isto é, apanhá-lo ou detê-lo. “Agarraram” comunica essa ação com naturalidade e evita a possível associação de “impor as mãos” com bênção ou comissionamento.
- source_word: ἀποστόλους
  choice: apóstolos
  rationale: Em Atos, o termo designa os emissários comissionados de Jesus, e não simples mensageiros; “apóstolos” preserva esse uso reconhecido.
- source_word: ἔθεντο
  choice: colocaram
  rationale: Verbo simples e natural para τίθημι neste contexto, introduzindo o estado de detenção indicado pela expressão seguinte.
- source_word: ἐν τηρήσει
  choice: sob custódia
  rationale: τήρησις pode indicar guarda, custódia ou confinamento. “Sob custódia” preserva a referência à detenção sem exigir que o termo designe especificamente um edifício prisional.
- source_word: δημοσίᾳ
  choice: pública
  rationale: O adjetivo modifica τηρήσει e caracteriza a detenção como pública ou comum, provavelmente oficial, sem acrescentar a especificação mais interpretativa de “estatal”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Agarraram” transmite a força hostil do idioma grego; “sob custódia pública” mantém a amplitude lexical de τηρήσει δημοσίᾳ. O marcador [a] aparece no texto principal.
