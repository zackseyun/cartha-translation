source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: pt
  text: Ao ouvirem isso, entraram no templo ao amanhecer e ensinavam. Quando, porém, o sumo sacerdote chegou, junto com os que estavam com ele, convocaram o Sinédrio e todo o conselho de anciãos dos filhos de Israel[a] e mandaram à prisão para que eles fossem trazidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “todo o conselho de Israel” ou “todo o corpo de anciãos de Israel”.
    reason: Alternativas lexicais para γερουσία e para a expressão tradicional τῶν υἱῶν Ἰσραήλ.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo tem valor temporal e remete à ordem do anjo no versículo anterior. O pronome “isso”, embora implícito no grego, torna natural em português a referência contextual.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: ao amanhecer
  rationale: Expressão temporal que indica as primeiras horas da alvorada; a formulação é concisa e corrente.
- source_word: ἱερὸν
  choice: templo
  rationale: Ἱερόν designa o complexo do templo, não especificamente o santuário interior. Em português, “templo” comunica naturalmente esse sentido no contexto; “área do templo” seria possível, mas menos fluente.
- source_word: ἐδίδασκον
  choice: ensinavam
  rationale: O imperfeito apresenta o ensino como ação em andamento, preservada pelo pretérito imperfeito português.
- source_word: Παραγενόμενος
  choice: Quando, porém, chegaram
  rationale: O particípio aoristo introduz o acontecimento seguinte. A oração temporal produz uma sequência clara; o plural inclui naturalmente o sumo sacerdote e seus acompanhantes como participantes da chegada.
- source_word: οἱ σὺν αὐτῷ
  choice: os que estavam com ele
  rationale: Tradução direta que não atribui ao grupo uma identidade mais específica do que a indicada pelo grego.
- source_word: συνεκάλεσαν
  choice: convocaram
  rationale: O verbo significa reunir mediante convocação e rege aqui órgãos deliberativos; “convocaram” é preciso e corrente.
- source_word: συνέδριον
  choice: Sinédrio
  rationale: Neste contexto, refere-se ao conselho governante judaico historicamente conhecido como Sinédrio.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: todo o conselho de anciãos dos filhos de Israel
  rationale: Γερουσία designa um conselho ou corpo de anciãos. A tradução preserva tanto esse sentido institucional quanto a expressão nacional-familiar explícita “filhos de Israel”, sem eliminar a possível relação expansiva ou apositiva com “Sinédrio”.
- source_word: δεσμωτήριον
  choice: prisão
  rationale: Equivalente português comum para o lugar de confinamento indicado pelo termo.
- source_word: ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς
  choice: mandaram buscá-los na prisão
  rationale: A formulação idiomática preserva o envio de pessoas à prisão com o propósito de trazer os apóstolos, expresso pelo infinitivo passivo.
theological_decisions:
- issue: Tradução de τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  alternative: de Israel; dos israelitas
  rationale: A expressão familiar-nacional explicitamente presente no grego é mantida no texto principal. Uma forma mais idiomática é registrada em nota, sem neutralizar silenciosamente a formulação da fonte.
- issue: Relação entre συνέδριον e πᾶσαν τὴν γερουσίαν
  choice: o Sinédrio e todo o conselho de anciãos
  alternative: o Sinédrio, isto é, todo o conselho de anciãos
  rationale: O καί pode coordenar ou introduzir uma expressão explicativa, e a relação exata entre os dois grupos não é inteiramente inequívoca. A tradução mantém a coordenação formal do grego e evita resolver a tensão histórica ou institucional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sinédrio” mantém a precisão histórica; “ensinavam” preserva o aspecto contínuo; a colocação da nota junto a “filhos de Israel” corresponde ao conteúdo real da alternativa lexical.
