  terminology: «Sinédrio», «sumo sacerdote», «conselho de anciãos» e «filhos de Israel» são escolhas adequadas. A nota permanece ancorada à expressão inteira e registra alternativas legítimas sem decidir a relação institucional debatida entre συνέδριον e γερουσία.
