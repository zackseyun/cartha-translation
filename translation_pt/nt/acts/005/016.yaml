base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: pt
  text: E também a multidão das cidades ao redor de Jerusalém se reunia[a], trazendo os doentes e os afligidos por espíritos imundos[b], e todos eram curados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinha se reunindo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “atormentados por espíritos imundos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: vinha se reunindo
  rationale: O imperfeito expressa uma ação contínua ou repetida no passado; a formulação preserva esse aspecto de modo natural em português.
- source_word: τὸ πλῆθος
  choice: a multidão
  rationale: Expressa coletivamente um grande número de pessoas e corresponde ao registro narrativo do texto.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: das cidades ao redor de Jerusalém
  rationale: A expressão indica as localidades situadas nas proximidades de Jerusalém; esta construção mantém a relação geográfica sem sugerir que pertenciam à cidade.
- source_word: φέροντες
  choice: trazendo
  rationale: O particípio descreve o que a multidão fazia enquanto se reunia e é a opção contextual mais natural.
- source_word: ἀσθενεῖς
  choice: os doentes
  rationale: No contexto de curas, o adjetivo substantivado se refere naturalmente a pessoas enfermas.
- source_word: ὀχλουμένους
  choice: os atormentados
  rationale: O verbo pode denotar perturbação, aflição ou tormento; aqui, em associação com espíritos impuros, 'atormentados' comunica com clareza a intensidade possível do termo.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: por espíritos impuros
  rationale: '''Impuros'' traduz de modo corrente ἀκαθάρτων e preserva suas conotações morais e religiosas sem reinterpretar os espíritos como fenômenos psicológicos.'
- source_word: οἵτινες
  choice: e todos
  rationale: O relativo retoma os dois grupos mencionados; a coordenação em português evita ambiguidade e conduz naturalmente à afirmação abrangente de ἅπαντες.
- source_word: ἐθεραπεύοντο
  choice: eram curados
  rationale: O imperfeito passivo apresenta as curas como atividade em curso ou repetida e conserva a voz passiva.
- source_word: ἅπαντες
  choice: todos
  rationale: Mantém explicitamente a abrangência total afirmada pelo texto.
theological_decisions:
- issue: Sentido de πνευμάτων ἀκαθάρτων
  choice: espíritos impuros
  alternative: espíritos imundos
  rationale: A expressão é mantida como referência a espíritos pessoais malignos, sem reduzi-la a uma descrição metafórica ou psicológica; 'impuros' é claro e atual.
- issue: Intensidade de ὀχλουμένους
  choice: atormentados
  alternative: perturbados
  rationale: O termo admite diferentes graus de aflição. O texto principal usa a opção mais vívida e natural neste contexto, enquanto a nota registra uma alternativa menos intensa.
- issue: Alcance de ἅπαντες
  choice: todos eram curados
  alternative: cada um deles era curado
  rationale: A tradução mantém a afirmação abrangente acerca dos enfermos e dos afligidos trazidos nessa cena, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O aspecto durativo dos dois imperfeitos gregos é preservado por “vinha se reunindo” e “eram curados”. As notas apresentam alternativas lexicais genuínas sem sobrecarregar o versículo.
