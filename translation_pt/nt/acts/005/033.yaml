  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: pt
  text: Mas, ao ouvirem isso, ficaram furiosos[a] e queriam matá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “foram serrados por dentro” ou “foram feridos no íntimo”, imagem que aqui expressa intensa agitação hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Mas ... eles
  rationale: δέ tem aqui leve força adversativa, marcando a mudança do discurso dos apóstolos para a reação hostil do conselho; o artigo substantivado retoma o grupo já identificado.
- source_word: ἀκούσαντες
  choice: ao ouvirem isso
  rationale: O particípio aoristo é expresso naturalmente como circunstância temporal; “isso” explicita o objeto subentendido pelo contexto.
- source_word: διεπρίοντο
  choice: ficaram furiosos
  rationale: Embora a imagem literal seja a de serem cortados ou serrados por dentro, no contexto o verbo descreve intensa agitação hostil. Esta formulação comunica com clareza a reação, sem sugerir arrependimento ou convicção espiritual.
- source_word: ἐβούλοντο
  choice: queriam
  rationale: O imperfeito expressa uma vontade ou intenção em curso; “queriam” é natural e preserva essa volição sem intensificá-la indevidamente.
- source_word: ἀνελεῖν
  choice: matá-los
  rationale: Neste contexto, ἀναιρέω significa tirar a vida. A forma pronominal portuguesa traduz de modo direto tanto o infinitivo quanto αὐτούς.
- source_word: αὐτούς
  choice: -los
  rationale: O pronome retoma os apóstolos e é incorporado naturalmente ao infinitivo português “matá-los”.
theological_decisions:
- issue: Possível leitura de διεπρίοντο como convicção interior
  choice: ficaram furiosos
  alternative: foram cortados no coração
  rationale: A intenção imediata de matar os apóstolos indica uma reação de fúria hostil. A alternativa mais literal poderia ser entendida em português como arrependimento, resolvendo o sentido na direção errada neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ao ouvirem isso” mantém fluidez narrativa; “ficaram furiosos” transmite o valor idiomático contextual, enquanto a nota preserva a imagem vívida do grego.
