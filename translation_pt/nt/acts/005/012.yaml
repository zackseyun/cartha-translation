source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: pt
  text: Pelas mãos dos apóstolos, muitos sinais e maravilhas eram realizados entre o povo; e todos estavam unidos[a] no Pórtico de Salomão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de comum acordo”. O termo grego ressalta tanto a unidade de propósito como o fato de estarem reunidos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Colunata de Salomão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Pelas mãos dos apóstolos
  rationale: Preserva a expressão concreta grega e comunica meio ou agência de modo natural em português.
- source_word: δὲ
  choice: ; e
  rationale: Marca a progressão narrativa sem introduzir um contraste forte nem acrescentar um advérbio temporal ausente do texto.
- source_word: ἐγίνετο
  choice: eram realizados
  rationale: O imperfeito indica atividade contínua ou repetida no passado; a construção passiva se ajusta naturalmente a 'sinais e maravilhas'.
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e maravilhas
  rationale: Mantém a conhecida combinação lucana sem acrescentar a explicação interpretativa 'miraculosos'.
- source_word: πολλὰ
  choice: muitos
  rationale: Expressa diretamente a quantidade e concorda com os dois substantivos coordenados.
- source_word: ἐν τῷ λαῷ
  choice: entre o povo
  rationale: Representa a esfera em que os atos ocorriam sem especificar além do que o grego afirma.
- source_word: ὁμοθυμαδὸν
  choice: unidos
  rationale: Comunica a unidade de propósito destacada pelo advérbio, enquanto a localização compartilhada é expressa pela frase seguinte.
- source_word: ἅπαντες
  choice: todos
  rationale: Mantém a abrangência do termo e deixa implícito, como no grego, o grupo exato a que se refere.
- source_word: Στοᾷ Σολομῶντος
  choice: Pórtico de Salomão
  rationale: É uma designação arquitetônica clara e tradicional para a galeria coberta; a alternativa 'Colunata' é registrada em nota.
theological_decisions:
- issue: Referente de 'todos'
  choice: Preservar o sujeito implícito, sem identificar expressamente o grupo.
  alternative: Explicitar 'todos os apóstolos' ou 'todos os que criam'.
  rationale: O grego não define de modo explícito o antecedente de ἅπαντες; a tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem inicial preserva a ênfase grega na agência dos apóstolos; o ponto e vírgula evita uma frase excessivamente encadeada. Todos os marcadores de notas aparecem no texto principal.
