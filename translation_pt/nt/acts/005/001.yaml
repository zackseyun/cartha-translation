base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: pt
  text: Mas um homem chamado Ananias, com Safira, sua esposa, vendeu uma propriedade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bem”; o termo grego pode referir-se de modo amplo a uma posse ou a um imóvel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Mas um homem
  rationale: δέ assinala o contraste com o exemplo anterior de Barnabé, enquanto τις funciona naturalmente como indefinido; ἀνήρ designa aqui um homem introduzido na narrativa.
- source_word: Ἁνανίας ὀνόματι
  choice: chamado Ananias
  rationale: A expressão com ὀνόματι significa idiomaticamente “chamado” ou “de nome”; esta forma é natural em português.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: junto com sua mulher, Safira
  rationale: σύν indica acompanhamento, e γυνή, nesta relação possessiva, significa “mulher” no sentido de esposa. A ordem adotada evita uma construção pesada e identifica Safira com clareza.
- source_word: ἐπώλησεν
  choice: vendeu
  rationale: O aoristo de πωλέω relata de modo direto uma ação passada concluída.
- source_word: κτῆμα
  choice: uma propriedade
  rationale: κτῆμα pode designar uma posse ou bem imóvel. “Uma propriedade” é natural e concreto sem especificar indevidamente terreno, campo ou fazenda.
theological_decisions:
- issue: Contraste narrativo com o exemplo anterior de Barnabé
  choice: Traduzir δέ por “Mas”
  alternative: “Então”, “Ora” ou simples continuação com “E”
  rationale: O contexto contrapõe a conduta de Ananias e Safira ao ato de Barnabé. “Mas” conserva a força contrastiva possível de δέ sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Sua mulher” é natural no registro bíblico e identifica explicitamente a relação conjugal; “junto com” preserva o acompanhamento indicado por σύν.
