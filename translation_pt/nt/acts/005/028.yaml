source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: pt
  text: 'dizendo: “Nós lhes ordenamos terminantemente que não ensinassem nesse nome. E vejam: vocês encheram Jerusalém com o ensino de vocês e querem fazer recair sobre nós o sangue desse homem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, “responsabilizar-nos pela morte desse homem”. A expressão grega fala em fazer o sangue desse homem recair sobre nós, uma imagem de culpa de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Nós lhes demos ordens expressas
  rationale: O substantivo no dativo acompanhado do verbo cognato intensifica a ordem. A expressão portuguesa comunica essa ênfase de modo natural, sem reproduzir de forma artificial a construção grega.
- source_word: μὴ διδάσκειν
  choice: para não ensinarem
  rationale: Expressa diretamente o conteúdo da proibição; o grego não exige a interpretação mais específica de que deveriam 'parar de ensinar'.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: nesse nome
  rationale: Preserva a formulação do grego e, no contexto de Atos, pode indicar ensino sob a autoridade ligada ao nome, sem reduzi-la apenas a ensinar 'sobre' alguém.
- source_word: καὶ ἰδοὺ
  choice: Mas vejam
  rationale: Vejam mantém a força de chamar a atenção e o tom de confronto. A conjunção é vertida adversativamente porque, no contexto, contrapõe a ordem dada ao resultado constatado.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: vocês encheram Jerusalém
  rationale: Conserva a metáfora do original. O perfeito grego apresenta a ação como realizada, com resultado ainda evidente; em português, o pretérito perfeito é natural neste contexto.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: com o ensino de vocês
  rationale: A preposição 'com' expressa naturalmente o complemento de 'encher'. 'Ensino' é claro e menos carregado por tradição do que 'doutrina'.
- source_word: βούλεσθε
  choice: querem
  rationale: O verbo expressa vontade ou intenção. 'Querem' é corrente, direto e preserva o caráter acusatório sem intensificá-lo para 'estão determinados'.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: fazer recair sobre nós
  rationale: Reproduz em português natural a imagem de trazer ou fazer vir algo sobre alguém, aqui ligada à atribuição de culpa ou responsabilidade.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: o sangue desse homem
  rationale: Mantém a imagem semítica de sangue e o distanciamento hostil da referência a Jesus como 'esse homem', sem explicitar no corpo do texto a responsabilidade por sua morte.
theological_decisions:
- issue: Sentido de fazer recair 'o sangue desse homem' sobre os líderes
  choice: Manter no texto principal a imagem do sangue recaindo sobre eles.
  alternative: Traduzir interpretativamente como 'responsabilizar-nos pela morte desse homem'.
  rationale: A expressão aponta para culpa de sangue ou responsabilidade pela morte de Jesus, mas a preservação da metáfora mantém a força e a tensão do original. A nota esclarece o sentido idiomático sem substituir a imagem no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento plural 'vocês' evita regionalismo excessivo. 'Nesse nome' e 'o sangue desse homem' preservam imagens e ambiguidades relevantes do grego; a nota explica o idioma de culpa de sangue.
