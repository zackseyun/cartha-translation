  terminology: «Nesse nome», «ensino», «fazer recair sobre nós» e «o sangue desse homem» são escolhas fiéis e naturais. A nota deve conservar o referente de primeira pessoa e explicar «culpa de sangue» como responsabilidade pela morte, sem substituir a imagem no texto principal.
