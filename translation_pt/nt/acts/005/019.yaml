source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: pt
  text: 'Mas, durante a noite, um anjo do Senhor abriu as portas da prisão, levou-os para fora e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: um anjo
  rationale: O substantivo sem artigo é naturalmente apresentado como indefinido; neste contexto de libertação sobrenatural, refere-se a um ser celestial, não apenas a um mensageiro humano.
- source_word: κυρίου
  choice: do Senhor
  rationale: Preserva a expressão bíblica consagrada «anjo do Senhor» e traduz κύριος de modo claro e teologicamente não restritivo.
- source_word: διὰ νυκτός
  choice: durante a noite
  rationale: A construção com διά e genitivo tem sentido temporal; esta formulação é natural em português moderno e mantém a ideia de duração temporal.
- source_word: ἤνοιξε
  choice: abriu
  rationale: Traduz diretamente ἀνοίγω sem acrescentar a ideia específica de destrancar, que o texto não declara.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: as portas da prisão
  rationale: Reproduz com clareza tanto o plural θύρας quanto o sentido de φυλακή neste contexto.
- source_word: ἐξαγαγών
  choice: levou-os para fora
  rationale: Expressa o particípio de ἐξάγω como ação anterior ligada ao verbo principal, sem exigir que o anjo os tenha guiado por um percurso.
- source_word: τε
  choice: e
  rationale: Representa adequadamente a conexão leve entre a ação participial e «disse».
- source_word: εἶπεν
  choice: disse
  rationale: É a tradução narrativa natural de λέγω no aoristo e introduz diretamente as palavras do versículo seguinte.
theological_decisions:
- issue: Natureza de ἄγγελος no contexto
  choice: ser celestial («anjo»)
  alternative: mensageiro humano
  rationale: A abertura extraordinária das portas da prisão e a libertação dos apóstolos indicam, no contexto narrativo, um agente celestial. «Anjo» comunica isso sem especificar além do texto.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano ou Mestre
  rationale: «Senhor» preserva a expressão bíblica reconhecível «anjo do Senhor» e a amplitude referencial do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «durante a noite» foi antecipada para produzir uma frase natural sem alterar seu vínculo semântico com a abertura das portas. O dois-pontos sinaliza que a fala continua no versículo seguinte.
