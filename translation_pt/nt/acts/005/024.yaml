id: ACT.5.24
reference: Acts 5:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: pt
  text: Quando o comandante do templo e os principais sacerdotes ouviram essas palavras, ficaram perplexos com elas, perguntando-se no que aquilo daria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o que viria a acontecer com aquilo». A expressão grega indica incerteza quanto ao desfecho ou resultado da situação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz temporalmente o desenvolvimento seguinte. Em português, «Quando» transmite com naturalidade o valor temporal de ὡς; a leve conexão narrativa de δέ fica implícita no fluxo do relato.
- source_word: ἤκουσαν
  choice: ouviram
  rationale: É o sentido simples e adequado de ἀκούω neste relato no passado.
- source_word: τοὺς λόγους τούτους
  choice: essas palavras
  rationale: Mantém de perto a expressão grega e, no contexto, refere-se à mensagem que os oficiais acabavam de receber.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: o comandante do templo
  rationale: στρατηγός designa o oficial encarregado da segurança e da ordem no templo. «Comandante» comunica claramente sua função ao leitor moderno.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: No plural, a expressão designa a liderança sacerdotal, e não vários sumos sacerdotes simultaneamente em exercício.
- source_word: διηπόρουν
  choice: ficaram perplexos
  rationale: Expressa a forte incerteza de διαπορέω. Embora o grego use o imperfeito, o pretérito perfeito é a forma narrativa mais natural em português para a entrada nesse estado.
- source_word: περὶ αὐτῶν
  choice: com elas
  rationale: Conserva a referência pronominal às «palavras» ou notícias ouvidas sem determinar além do que o grego explicita.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: perguntando-se no que aquilo daria
  rationale: A construção com optativo e ἄν expressa incerteza quanto ao possível desfecho. «No que aquilo daria» é uma expressão portuguesa natural para o resultado futuro de uma situação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Comandante do templo» evita o possível anacronismo ou a ambiguidade de «capitão», e «principais sacerdotes» identifica a liderança sacerdotal sem sugerir vários sumos sacerdotes em exercício.
