source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: pt
  text: O Deus de nossos pais levantou Jesus[a], a quem vocês mataram, pendurando-o num madeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ressuscitou”. O verbo pode referir-se aqui à ressurreição, embora neste versículo o grego não diga explicitamente “dentre os mortos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “numa cruz”. O grego diz literalmente “num madeiro”, provavelmente evocando Deuteronômio 21:23.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: O Deus de nossos pais
  rationale: Preserva a fórmula bíblica e pactual ligada aos patriarcas de Israel, com redação natural em português.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: No contexto imediato de morte e no discurso de Atos, o verbo comunica a ação de Deus ao levantar Jesus; 'ressuscitou' expressa naturalmente esse sentido em português, sem acrescentar aqui a expressão 'dentre os mortos'.
- source_word: διεχειρίσασθε
  choice: mataram
  rationale: O verbo denota ação violenta que resulta em morte; 'mataram' é direto, claro e compatível com a explicação participial seguinte.
- source_word: κρεμάσαντες
  choice: pendurando-o
  rationale: Mantém a relação circunstancial do particípio com o ato de matar, sem impor uma especificação sintática além do grego.
- source_word: ἐπὶ ξύλου
  choice: num madeiro
  rationale: Preserva a escolha lexical de ξύλον e sua provável evocação de Deuteronômio 21:23, ao mesmo tempo que emprega uma expressão bíblica inteligível em português.
theological_decisions:
- issue: Se ἤγειρεν deve ser explicitado como linguagem de ressurreição
  choice: ressuscitou
  alternative: levantou
  rationale: O contexto favorece fortemente a ressurreição, mas a nota registra que o versículo não traz explicitamente 'dentre os mortos', preservando a extensão formal do original.
- issue: Se ξύλον deve ser interpretado diretamente como 'cruz'
  choice: num madeiro
  alternative: numa cruz
  rationale: O grego emprega ξύλον, não σταυρός. 'Madeiro' mantém a imagem e a provável alusão deuteronômica sem negar que a referência histórica seja à crucificação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula 'Deus de nossos pais' e o termo 'madeiro' conservam as ressonâncias bíblicas; as notas esclarecem alternativas sem resolver indevidamente ambiguidades do texto-fonte.
