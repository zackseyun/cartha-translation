  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: pt
  text: Mas nenhum dos outros ousava juntar-se a eles; mas o povo os tinha em alta consideração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: dos outros
  rationale: Preserva a expressão ampla e contextualmente ambígua, sem especificar além do texto quem eram os demais.
- source_word: ἐτόλμα
  choice: ousava
  rationale: Expressa diretamente a ideia de ter coragem ou atrever-se a agir.
- source_word: κολλᾶσθαι
  choice: juntar-se
  rationale: Neste contexto, indica associar-se estreitamente ao grupo; a forma pronominal é natural em português.
- source_word: ἐμεγάλυνεν
  choice: tinha em alta consideração
  rationale: Comunica que o povo os estimava e engrandecia publicamente, sem sugerir adoração.
theological_decisions:
- issue: Identidade de «os outros» e de «eles»
  choice: Manter os referentes implícitos
  alternative: Explicitar «os não crentes» e «os apóstolos»
  rationale: O grego depende do contexto e não identifica expressamente ambos os grupos neste versículo; explicitá-los resolveria uma ambiguidade legítima.
- issue: Relação entre as duas orações com ἀλλά
  choice: «no entanto»
  alternative: «mas» ou «pelo contrário»
  rationale: 'Marca o contraste: embora os demais não ousassem associar-se a eles, o povo os estimava. Evita fazer da segunda oração uma negação absoluta da primeira.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita regionalismos marcados e preserva a concisão e a ambiguidade referencial do grego.
