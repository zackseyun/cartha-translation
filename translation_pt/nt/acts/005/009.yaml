source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: pt
  text: 'Mas Pedro lhe disse: “Por que vocês entraram em acordo[a] para pôr à prova o Espírito do Senhor? Veja! Os pés dos que sepultaram seu marido estão à porta, e eles levarão você para fora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: combinaram entre si; pelo contexto, o acordo envolvia cumplicidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὅτι συνεφωνήθη ὑμῖν
  choice: Por que vocês entraram em acordo
  rationale: A pergunta idiomática introduz uma repreensão, e o passivo de συμφωνέω com ὑμῖν expressa um acordo mútuo. A formulação portuguesa é natural, mantém o plural implícito em ὑμῖν e não intensifica indevidamente o verbo como “conspirar”.
- source_word: πειράσαι
  choice: para pôr à prova
  rationale: πειράζω pode significar tentar ou testar. Como o objeto é o Espírito do Senhor, “pôr à prova” comunica com clareza a tentativa de verificar ou desafiar sua atuação, sem a possível ambiguidade de “tentar” em português.
- source_word: τὸ πνεῦμα κυρίου
  choice: o Espírito do Senhor
  rationale: Reproduz naturalmente a construção genitiva e preserva a provável referência ao Espírito Santo sem acrescentar “Santo”, que não aparece explicitamente no versículo.
- source_word: ἰδοὺ
  choice: Veja!
  rationale: O marcador chama a atenção para a chegada imediata dos que haviam sepultado Ananias. “Veja!” é atual e conserva a vivacidade do enunciado.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: Os pés dos que sepultaram
  rationale: Mantém a imagem concreta e deliberadamente vívida do grego. “Passos” seria mais idiomático, mas alteraria a imagem lexical de “pés”.
- source_word: τὸν ἄνδρα σου
  choice: seu marido
  rationale: No contexto da fala dirigida a Safira sobre Ananias, ἀνήρ tem claramente o sentido de “marido”.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: estão à porta
  rationale: Expressa de modo idiomático a presença imediata junto à entrada.
- source_word: ἐξοίσουσίν σε
  choice: eles levarão você para fora
  rationale: Preserva a formulação direta e sinistra de ἐκφέρω sem explicitar “seu corpo”, informação fortemente implícita, mas não expressa no grego.
theological_decisions:
- issue: Referente de “o Espírito do Senhor”
  choice: Manter “o Espírito do Senhor”, com inicial maiúscula
  alternative: Expandir para “o Espírito Santo” ou entender de modo mais geral como a presença espiritual do Senhor
  rationale: A continuidade com Atos 5:3 aponta fortemente para o Espírito Santo. Ainda assim, a tradução conserva a expressão exata do versículo e evita uma expansão interpretativa.
- issue: Força da acusação de Pedro
  choice: “entraram em acordo”
  alternative: “conspiraram”
  rationale: O contexto torna o acordo moralmente grave, mas συμφωνέω denota primariamente concordar ou combinar. A tradução deixa que o contexto comunique a cumplicidade sem inserir no verbo uma acusação lexical mais forte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” torna explícito que Pedro se refere ao acordo de Safira com Ananias. A imagem literal “os pés” foi preservada por sua força narrativa.
