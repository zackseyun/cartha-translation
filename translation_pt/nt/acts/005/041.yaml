id: ACT.5.41
reference: Acts 5:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: pt
  text: Assim, eles saíram da presença do Conselho, alegrando-se por terem sido considerados dignos de sofrer desonra por causa do Nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa do nome de Jesus”. Em grego, “o Nome”, uma forma reverente de referência cujo complemento fica implícito no texto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: saíram
  rationale: O imperfeito descreve o movimento de afastamento do Conselho; em português narrativo, “saíram” expressa isso naturalmente, sem exigir a construção pouco fluida “iam saindo”.
- source_word: χαίροντες
  choice: alegrando-se
  rationale: O particípio presente indica a atitude simultânea à saída e se liga naturalmente à oração causal seguinte.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: da presença do Conselho
  rationale: Preserva o idioma com πρόσωπον (“presença”) de modo formal, mas compreensível em português.
- source_word: συνεδρίου
  choice: Conselho
  rationale: Traduz o substantivo comum que designa o órgão governante, em vez de empregar a transliteração histórica “Sinédrio”; a inicial maiúscula sinaliza a instituição específica no contexto.
- source_word: κατηξιώθησαν
  choice: terem sido considerados dignos
  rationale: Mantém a voz passiva e a ideia avaliativa de serem julgados ou tidos por dignos.
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Neste contexto, indica a razão ou referência do sofrimento; “por causa de” é natural e não acrescenta a nuance substitutiva que “em favor de” poderia sugerir.
- source_word: τοῦ ὀνόματος
  choice: do Nome
  rationale: Conserva a expressão absoluta e reverente do grego, sem explicitar no texto principal um referente que permanece implícito.
- source_word: ἀτιμασθῆναι
  choice: sofrer desonra
  rationale: Expressa com naturalidade o fato de serem submetidos à desonra e preserva o campo semântico de honra e vergonha.
theological_decisions:
- issue: Uso absoluto de “o Nome”
  choice: Manter “o Nome” sem expansão no texto principal.
  alternative: “o nome de Jesus” ou “o nome dele”
  rationale: O grego traz τοῦ ὀνόματος de forma absoluta. O contexto aponta para Jesus, mas o referente não é explicitado nesta frase; manter a forma abreviada preserva sua reverência e sua tensão literária.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Conselho” evita uma transliteração técnica, enquanto “presença” e “Nome” preservam elementos formais e teológicos do original.
