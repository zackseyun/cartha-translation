  - severity: low
    issue: “Mas” introduz contraste adversativo não expresso.
    rationale: οὐ μετὰ βίας qualifica simplesmente a maneira como os trouxeram. Em português, a vírgula com “sem usar de força” transmite o sentido sem acrescentar oposição.
  revised_text: Então o capitão[a] foi com os guardas e os trouxe, sem usar de força, pois temiam o povo, com receio de serem apedrejados.
  revised_footnotes:
