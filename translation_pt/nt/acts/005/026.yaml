  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: pt
  text: Então o capitão[a] foi com os guardas e os trouxe, sem usar de força, pois temiam o povo, com receio de serem apedrejados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comandante”. O termo grego refere-se aqui ao capitão do templo, o oficial responsável por manter a ordem no recinto do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: capitão
  rationale: Em Atos, designa o oficial responsável pela ordem no templo, não um general romano. “Capitão” preserva de modo conciso sua função de comando; a nota explicita o contexto.
- source_word: ὑπηρέταις
  choice: guardas
  rationale: No contexto, são subordinados que acompanham o capitão para deter e conduzir os apóstolos. “Guardas” é natural e mais específico do que “servidores”, sem introduzir a expressão interpretativa “polícia do templo”.
- source_word: ἤγαγεν αὐτούς
  choice: trouxe os apóstolos
  rationale: ἄγω pode significar conduzir ou trazer. O referente pronominal é explicitado como “os apóstolos” para clareza em português, sem acrescentar um destino não expresso no versículo.
- source_word: οὐ μετὰ βίας
  choice: mas sem usar de força
  rationale: Expressa que a condução ocorreu sem coerção violenta. “Mas” torna natural o contraste implícito com a ação de levá-los.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: pois temiam que o povo os apedrejasse
  rationale: A formulação portuguesa liga naturalmente o temor ao resultado temido explicitado na oração seguinte.
- source_word: μὴ λιθασθῶσιν
  choice: que o povo os apedrejasse
  rationale: Após um verbo de temor, μή com o subjuntivo indica o acontecimento receado. A voz ativa explicita como agente o povo já mencionado, cuja ameaça é inequívoca no contexto imediato.
- source_word: τότε ἀπελθὼν
  choice: Então ... foi
  rationale: O particípio acompanha a ação principal na sequência narrativa; a coordenação verbal é mais natural em português do que uma construção literal como “tendo ido”.
