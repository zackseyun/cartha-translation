- from: Então o capitão[a] foi com os guardas e trouxe os apóstolos, mas sem usar de força, pois temiam que o povo os apedrejasse.
  to: Então o capitão[a] foi com os guardas e os trouxe, sem usar de força, pois temiam o povo, com receio de serem apedrejados.
