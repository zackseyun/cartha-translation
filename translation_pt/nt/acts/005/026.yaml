review_pass:
  verdict: revise
  source_fidelity: A redação preserva a sequência narrativa, o sentido de στρατηγός como oficial do templo e a condução sem violência. Contudo, “que o povo os apedrejasse” transforma a construção grega passiva (μή λιθασθῶσιν) em ativa e explicita o agente; embora seja uma inferência contextual plausível, não é expresso pela forma grega e reduz sua ambiguidade.
  naturalness: O texto é claro e moderno. A substituição de “mas sem usar de força” por “sem usar de força” evita um contraste adversativo que não está marcado no grego. “Com receio de serem apedrejados” é natural em português e reproduz adequadamente o resultado temido.
  terminology: “Capitão” é adequado, desde que identificado na nota como o capitão do templo. “Guardas” é uma opção idiomática e contextual para ὑπηρέταις. A nota lexical está correta e mantém “comandante” como alternativa.
  issues:
