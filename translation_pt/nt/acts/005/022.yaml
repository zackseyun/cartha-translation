  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: pt
  text: 'Mas, quando os guardas chegaram, não os encontraram na prisão; então voltaram e informaram:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: quando ... chegaram
  rationale: Expressa naturalmente em português o valor temporal do particípio aoristo e situa a chegada dos guardas.
- source_word: ὑπηρέται
  choice: guardas
  rationale: No contexto, refere-se aos agentes oficiais enviados pelas autoridades para buscar os apóstolos. “Guardas” é claro e natural, sem especificar além do grego que eram policiais do templo.
- source_word: οὐχ εὗρον
  choice: não ... encontraram
  rationale: Equivalente direto e idiomático para a ação narrativa de procurar sem achar.
- source_word: ἐν τῇ φυλακῇ
  choice: na prisão
  rationale: Preserva a referência à prisão específica já mencionada no contexto.
- source_word: ἀναστρέψαντες
  choice: voltaram
  rationale: Neste contexto, indica que regressaram às autoridades que os haviam enviado.
- source_word: ἀπήγγειλαν
  choice: informaram
  rationale: Comunica de modo natural o ato de transmitir oficialmente o que constataram. Os dois-pontos mantêm a frase aberta para o conteúdo do relato no versículo seguinte.
- source_word: δέ ... δέ
  choice: Mas ... então
  rationale: “Mas” marca o contraste entre a expectativa e a ausência dos apóstolos; “então” apresenta naturalmente a ação subsequente, sem forçar um segundo contraste.
