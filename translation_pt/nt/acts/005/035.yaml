  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: pt
  text: 'E ele lhes disse: “Homens de Israel, tenham cuidado com o que estão prestes a fazer com estes homens.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: E ele disse
  rationale: A partícula τέ faz uma ligação leve com a narrativa anterior; “E” preserva essa continuidade sem tornar explícita uma sequência ou conclusão mais forte.
- source_word: πρὸς αὐτούς
  choice: lhes
  rationale: Com o verbo “dizer”, πρός com acusativo indica os destinatários. O pronome “lhes” é natural e conciso em português.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  rationale: Mantém a forma masculina e solene do vocativo grego, numa expressão clara e tradicionalmente inteligível em português.
- source_word: προσέχετε ἑαυτοῖς
  choice: tenham cuidado
  rationale: O imperativo com dativo reflexivo transmite cautela e vigilância sobre a própria conduta. “Tenham cuidado” comunica naturalmente a advertência, enquanto a oração seguinte explicita quanto à ação pretendida.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: a estes homens
  rationale: A expressão aponta para as pessoas a respeito das quais a ação está sendo considerada. Com “fazer”, “a estes homens” exprime naturalmente a ação dirigida a eles, sem acrescentar a hostilidade mais explícita de “contra”.
- source_word: τί μέλλετε πράσσειν
  choice: o que pretendem fazer
  rationale: μέλλω com infinitivo pode expressar ação iminente ou intenção. Neste contexto deliberativo, “pretendem fazer” preserva o caráter prospectivo sem afirmar que a ação necessariamente ocorrerá.
