translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada de modo natural sem eliminar nenhum elemento relevante do grego; a advertência mantém sua força e não explicita hostilidade além do texto-fonte.
