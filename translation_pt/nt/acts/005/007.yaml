  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: pt
  text: Depois de um intervalo de cerca de três horas, entrou a esposa dele, sem saber o que havia acontecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Depois de
  rationale: A expressão introduz o desenvolvimento seguinte da narrativa. Em português, a oração temporal com “Depois de” comunica naturalmente a progressão, sem reproduzir de modo artificial o idiomatismo Ἐγένετο nem acrescentar um marcador como “ora”.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: um intervalo de cerca de três horas
  rationale: διάστημα indica um espaço ou intervalo de tempo, e ὡς com a medida sugere aproximação; “cerca de” evita precisão indevida.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: a esposa dele
  rationale: No contexto, γυνή designa a esposa de Ananias. “Dele” mantém a referência masculina de forma clara e natural.
- source_word: μὴ εἰδυῖα
  choice: sem saber
  rationale: O particípio descreve a condição simultânea em que ela entrou. “Sem saber” é uma formulação idiomática e fiel em português.
- source_word: τὸ γεγονὸς
  choice: o que havia acontecido
  rationale: O particípio perfeito substantivado se refere ao acontecimento anterior já consumado; o mais-que-perfeito composto exprime adequadamente essa anterioridade.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Traduz diretamente o movimento para dentro do local e soa natural na narrativa portuguesa.
