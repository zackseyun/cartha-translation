source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: pt
  text: “Vão, ponham-se de pé no templo[a][c] e falem ao povo todas as palavras desta vida[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos pátios do templo” ou “no complexo do templo”; o termo grego refere-se a toda a área do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre esta vida” ou “deste modo de vida”. A expressão pode referir-se à vida anunciada no evangelho.
    reason: alternative_reading
  - marker: c
    text: Ou “e, estando de pé no templo, falem”.
    reason: previous_rendering
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Vão
  rationale: Imperativo direto e natural em português, que comunica a ordem de partir e agir.
- source_word: σταθέντες
  choice: apresentem-se
  rationale: O particípio aoristo indica que eles devem tomar seu lugar publicamente no templo antes de falar. “Apresentem-se” expressa essa ação com naturalidade, sem limitar o sentido à mera postura corporal.
- source_word: λαλεῖτε
  choice: falem
  rationale: Reproduz o sentido amplo do imperativo presente sem acrescentar a nuance mais específica de proclamação que haveria em “anunciem”.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Tradução corrente e concisa; neste contexto, ἱερόν designa o complexo do templo, não especificamente o santuário interior, esclarecimento preservado em nota.
- source_word: τῷ λαῷ
  choice: ao povo
  rationale: Equivalência direta que não restringe indevidamente a referência a uma multidão específica nem explicita uma identificação étnica apenas implícita no contexto.
- source_word: πάντα τὰ ῥήματα
  choice: todas as palavras
  rationale: Mantém de modo formal tanto a totalidade expressa por πάντα quanto o substantivo ῥήματα, sem substituir a expressão pela interpretação coletiva “toda a mensagem”.
- source_word: τῆς ζωῆς ταύτης
  choice: desta vida
  rationale: Preserva a construção genitiva compacta e sua abertura semântica, sem decidir se se trata da vida anunciada, da nova vida ou da mensagem que dá vida.
theological_decisions:
- issue: Sentido de τῆς ζωῆς ταύτης (“desta vida”)
  choice: Manter a expressão compacta “desta vida”.
  alternative: “sobre esta vida”, “deste modo de vida” ou “desta nova vida”
  rationale: A expressão provavelmente se refere à vida ligada ao evangelho apostólico e à salvação em Jesus, mas o grego não explicita uma única relação. A tradução conserva essa riqueza e tensão interpretativa.
- issue: Força de σταθέντες
  choice: 'Traduzir como ação coordenada: “apresentem-se”.'
  alternative: “estando de pé” ou “fiquem de pé”
  rationale: O particípio pode indicar circunstância acompanhante da ordem principal. A formulação escolhida conserva a sequência ir, tomar publicamente o lugar e falar, sem impor que a ênfase teológica ou narrativa esteja na postura física.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção mantém o teor direto da ordem e preserva deliberadamente a expressão incomum e teologicamente aberta “todas as palavras desta vida”.
