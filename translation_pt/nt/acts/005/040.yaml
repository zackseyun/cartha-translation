id: ACT.5.40
reference: Acts 5:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: pt
  text: Então chamaram os apóstolos, espancaram-nos, ordenaram-lhes que não falassem em nome de Jesus[a] e os soltaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a respeito do nome de Jesus» ou «com base no nome de Jesus». A expressão grega pode incluir falar a respeito de Jesus e sob a autoridade dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: chamaram
  rationale: O particípio aoristo indica uma ação anterior às demais. Em português, a sequência narrativa com «Então chamaram» comunica isso de modo natural e claro.
- source_word: τοὺς ἀποστόλους
  choice: os apóstolos
  rationale: «Apóstolos» é o termo consagrado e contextualmente preciso para os representantes comissionados mencionados em Atos.
- source_word: δείραντες
  choice: espancaram-nos
  rationale: δείρω significa bater ou espancar. «Espancaram-nos» expressa a violência da ação sem especificar um procedimento judicial de açoites que o verbo, por si só, não exige.
- source_word: παρήγγειλαν
  choice: ordenaram-lhes
  rationale: παραγγέλλω denota dar uma ordem. A construção com «lhes» identifica naturalmente os destinatários em português.
- source_word: μὴ λαλεῖν
  choice: que não falassem
  rationale: μή com o infinitivo apresenta o conteúdo da proibição. A oração finita é a forma mais natural em português depois de «ordenaram-lhes».
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: em nome de Jesus
  rationale: 'Mantém a expressão bíblica familiar e sua amplitude: falar a respeito de Jesus, ligado ao seu nome e sob sua autoridade, sem restringir o sentido a apenas uma dessas nuances.'
- source_word: ἀπέλυσαν
  choice: os soltaram
  rationale: ἀπολύω indica libertar alguém da custódia ou restrição. «Os soltaram» é corrente, claro e adequado à cena.
theological_decisions:
- issue: Sentido da expressão ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: em nome de Jesus
  alternative: a respeito do nome de Jesus; com base no nome de Jesus
  rationale: A formulação grega pode abranger tanto o conteúdo do testemunho sobre Jesus quanto a autoridade associada ao seu nome. A tradução retém essa amplitude, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem dos acontecimentos foi preservada em narrativa fluente; os pronomes distinguem com clareza os apóstolos como destinatários das ações.
