  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: pt
  text: Depois de trazê-los, fizeram-nos comparecer diante do Conselho[a], e o sumo sacerdote os interrogou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Sinédrio». O termo grego se refere ao conselho governante judaico.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Depois de trazê-los
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; esta formulação comunica com naturalidade a sequência temporal.
- source_word: δὲ
  choice: —
  rationale: A partícula funciona como conectivo narrativo leve. Não precisa ser expressa, pois a progressão do relato já fica clara em português.
- source_word: ἔστησαν
  choice: fizeram-nos comparecer diante de
  rationale: O aoristo transitivo de ἵστημι significa fazer ficar de pé ou colocar. No contexto judicial, «fizeram-nos comparecer diante de» preserva a apresentação formal perante o tribunal e soa natural em português.
- source_word: ἐν τῷ συνεδρίῳ
  choice: diante do Conselho
  rationale: συνέδριον designa aqui o conselho governante judaico. «Diante do» combina idiomaticamente com a apresentação dos apóstolos à assembleia, enquanto «Conselho» traduz o substantivo em vez de simplesmente transliterá-lo.
- source_word: ἐπηρώτησεν
  choice: interrogou
  rationale: No contexto de uma audiência judicial, «interrogou» expressa uma inquirição formal sem acrescentar a ideia de violência.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É a designação portuguesa tradicional, precisa e amplamente compreensível para o sacerdote que presidia.
theological_decisions:
- issue: Tradução de συνέδριον
  choice: o Conselho
  alternative: o Sinédrio
  rationale: A tradução no texto principal preserva o sentido lexical do termo grego, enquanto a nota identifica o nome tradicional da instituição judaica sem impor essa transliteração ao texto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com registro judicial claro. A inicial maiúscula em «Conselho» ajuda a indicar a instituição específica, e a nota fornece a designação tradicional.
