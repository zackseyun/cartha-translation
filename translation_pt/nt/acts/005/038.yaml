source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: pt
  text: 'E agora lhes digo: afastem-se destes homens e deixem-nos em paz, pois, se este plano ou esta obra tiver origem humana[a], será desfeita[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de seres humanos”; também pode ser traduzido por “vier dos homens”.
    reason: lexical_alternative
  - marker: b
    text: Ou “será destruída” ou “cairá por terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: agora
  rationale: Expressão temporal idiomática que introduz o conselho presente de Gamaliel; “agora” é natural e preserva a função discursiva.
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: afastem-se destes homens
  rationale: O imperativo pede separação e não envolvimento; a formulação portuguesa é clara e mantém a referência masculina concreta aos apóstolos.
- source_word: ἄφετε αὐτούς
  choice: deixem-nos em paz
  rationale: No contexto, ordena que não interfiram mais com eles; a expressão transmite naturalmente esse sentido.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: se ... tiver origem humana
  rationale: ἐξ indica fonte ou origem. A expressão evita a possível leitura de que a obra procede especificamente dos homens já mencionados e prepara o contraste com Deus no versículo seguinte.
- source_word: βουλή
  choice: plano
  rationale: Comunica de modo claro a ideia de intenção, propósito ou projeto.
- source_word: ἔργον
  choice: obra
  rationale: Preserva o termo amplo para atividade ou empreendimento e sua distinção em relação a “plano”.
- source_word: καταλυθήσεται
  choice: será desfeita
  rationale: Mantém a voz passiva e expressa a ideia de dissolução ou redução a nada sem especificar indevidamente o agente.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπων em ἐξ ἀνθρώπων
  choice: origem humana
  alternative: proceder de seres humanos / vir dos homens
  rationale: A expressão contrasta a procedência humana com a procedência divina no versículo seguinte. “Origem humana” torna esse contraste explícito sem introduzir uma doutrina adicional.
- issue: Alcance de καταλυθήσεται
  choice: será desfeita
  alternative: será destruída / cairá por terra
  rationale: O futuro passivo afirma o fracasso ou dissolução do plano ou obra, mas não identifica o agente nem determina o modo; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “lhes digo” e imperativos no plural, evita construções excessivamente literais e preserva o contraste entre origem humana e divina.
