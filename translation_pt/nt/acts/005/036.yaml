  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: pt
  text: Pois, antes destes dias, surgiu Teudas, alegando ser alguém[a], e cerca de quatrocentos homens se uniram a ele[b]. Ele foi morto, e todos os que tinham sido persuadidos por ele[c] se dispersaram e deram em nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alegando ser alguém importante”. A expressão grega indica que ele se apresentava como uma pessoa de importância.
    reason: lexical_alternative
  - marker: b
    text: Ou “aderiram a ele” ou “se aliaram a ele”.
    reason: lexical_alternative
  - marker: c
    text: Ou “todos os que o seguiam”. Mais literalmente, “todos os que eram persuadidos por ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Pois, antes destes dias
  rationale: Preserva γάρ como ligação explicativa no argumento de Gamaliel e traduz πρό com genitivo como anterioridade temporal, mantendo a expressão demonstrativa do grego.
- source_word: ἀνέστη Θευδᾶς
  choice: surgiu Teudas
  rationale: Neste contexto, ἀνέστη descreve o aparecimento de um líder ou movimento, não ressurreição literal. “Surgiu” é natural e mantém a força narrativa.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: alegando ser alguém importante
  rationale: A expressão idiomática indica que Teudas se apresentava como pessoa de relevância. “Alegando” comunica a autoafirmação sem endossá-la.
- source_word: ᾧ προσεκλίθη ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: e cerca de quatrocentos homens se uniram a ele
  rationale: Expressa com naturalidade a adesão ao líder, conserva o referente masculino de ἀνδρῶν e a aproximação indicada por ὡς.
- source_word: ὃς ἀνῃρέθη
  choice: Ele foi morto
  rationale: ἀναιρέω aqui significa matar ou eliminar; a formulação clara conserva a voz passiva.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: todos os que tinham sido persuadidos por ele
  rationale: Mantém a nuance de pessoas ganhas ou convencidas por Teudas, em vez de reduzir a expressão a um seguimento genérico.
- source_word: διελύθησαν
  choice: se dispersaram
  rationale: Comunica a dissolução do grupo em português atual e natural.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: deram em nada
  rationale: Equivalente idiomático português para o fracasso completo do movimento, preservando o sentido sem tradução rígida.
theological_decisions:
- issue: Relato histórico sobre Teudas no discurso de Gamaliel
  choice: Apresentar a declaração diretamente como parte do argumento de Gamaliel.
  alternative: Introduzir incerteza histórica ou alterar a redação para harmonizá-la com reconstruções históricas externas.
  rationale: A tradução deve representar o texto grego transmitido e sua função no discurso, sem inserir no versículo uma avaliação histórica ou solução harmonizadora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, sem perder as relações argumentativas nem as nuances do grego.
