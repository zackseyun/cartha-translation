  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: pt
  text: Então os mais jovens[a] se levantaram, envolveram-no, levaram-no para fora e o sepultaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os jovens”. A palavra grega νεώτεροι tem forma comparativa e pode significar “os mais jovens” ou, de modo mais geral, “os jovens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: se levantaram
  rationale: O particípio aoristo de ἀνίστημι descreve os homens levantando-se para agir; a forma verbal coordenada produz uma sequência narrativa natural em português.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá prosseguimento à narrativa; “Então” expressa com clareza essa progressão.
- source_word: οἱ νεώτεροι
  choice: os mais jovens
  rationale: νεώτεροι tem forma comparativa e pode distinguir esses homens dos mais velhos presentes. “Os mais jovens” preserva essa nuance sem excluir a leitura mais geral, registrada em nota.
- source_word: συνέστειλαν
  choice: envolveram o corpo
  rationale: Neste contexto, συστέλλω provavelmente indica envolver ou acondicionar o cadáver para removê-lo e sepultá-lo. A explicitação de “o corpo” evita que “envolveram-no” soe obscuro em português, sem acrescentar uma preparação funerária não declarada pelo texto.
- source_word: αὐτὸν
  choice: o corpo / -no
  rationale: O pronome retoma Ananias. Na primeira ocorrência, “o corpo” esclarece o referente no contexto de sua morte; nas ações seguintes, os pronomes mantêm a coesão.
- source_word: ἐξενέγκαντες
  choice: levaram-no para fora
  rationale: O particípio aoristo de ἐκφέρω indica que levaram o corpo para fora do local; esta formulação é clara e idiomática.
- source_word: ἔθαψαν
  choice: o sepultaram
  rationale: θάπτω significa sepultar ou enterrar. “Sepultaram” é corrente, digno e adequado ao contexto funerário.
