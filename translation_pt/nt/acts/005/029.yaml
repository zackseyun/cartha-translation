  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: pt
  text: 'Mas Pedro e os apóstolos responderam: “Devemos obedecer a Deus antes que aos seres humanos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: responderam
  rationale: A combinação do particípio com o verbo finito forma uma expressão narrativa de resposta. O plural português concorda naturalmente com Pedro e os apóstolos e evita a redundância de “respondendo, disseram”.
- source_word: δὲ
  choice: Mas
  rationale: Marca a reação contrastante à exigência das autoridades no contexto anterior.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Pedro e os apóstolos
  rationale: Emprega a forma tradicional do nome próprio e o termo português estabelecido para o grupo apostólico.
- source_word: Πειθαρχεῖν
  choice: obedecer
  rationale: Expressa submissão à autoridade de alguém e é o equivalente português mais claro neste contexto.
- source_word: δεῖ
  choice: Devemos
  rationale: Comunica necessidade ou obrigação; a primeira pessoa do plural explicita o sujeito implícito e corresponde aos falantes.
- source_word: θεῷ
  choice: a Deus
  rationale: O dativo indica aquele a quem se deve obediência.
- source_word: μᾶλλον ἢ
  choice: antes que
  rationale: 'Em português, esta construção expressa de modo natural a prioridade contrastiva: obedecer a Deus em vez de obedecer a seres humanos.'
- source_word: ἀνθρώποις
  choice: aos seres humanos
  rationale: ἄνθρωποι é genérico aqui e contrasta Deus com autoridades humanas em geral; “seres humanos” conserva explicitamente essa abrangência.
theological_decisions:
- issue: Contraste entre Deus e ἀνθρώποις
  choice: Deus ... seres humanos
  alternative: Deus ... homens; Deus ... pessoas
  rationale: O substantivo grego tem referência humana genérica neste contexto. “Seres humanos” mantém o contraste teológico entre a autoridade divina e toda autoridade humana sem restringir o referente ao sexo masculino.
- issue: Natureza da obrigação expressa por δεῖ
  choice: Devemos obedecer
  alternative: É necessário obedecer; é preciso obedecer
  rationale: A primeira pessoa do plural torna natural em português a obrigação assumida pelos próprios falantes, sem acrescentar uma universalização que não esteja exigida pela forma da frase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a concisão e a força proverbial do original; “antes que” é corrente no contraste de prioridade, embora “em vez de” também fosse possível.
