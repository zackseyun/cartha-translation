  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: pt
  text: E nós somos testemunhas dessas coisas[a], e o Espírito Santo também é testemunha, o qual Deus deu aos que lhe obedecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dessas palavras” ou “desses assuntos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: testemunhas
  rationale: É o equivalente português natural e consagrado para aqueles que dão testemunho direto, preservando o teor testemunhal do contexto de Atos.
- source_word: ῥημάτων
  choice: coisas
  rationale: Embora ῥῆμα possa significar “palavra” ou “declaração”, aqui o plural abrange os acontecimentos e fatos anunciados; “coisas” é natural em português e mantém a amplitude contextual.
- source_word: πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma padrão, atual e amplamente inteligível em português para o referente divino em Lucas–Atos.
- source_word: ὃ
  choice: que
  rationale: O pronome relativo português “que” é natural para referente pessoal ou não pessoal e evita introduzir no gênero gramatical uma distinção ausente da forma neutra grega.
- source_word: ἔδωκεν
  choice: deu
  rationale: O pretérito perfeito traduz diretamente o aoristo grego e soa natural em português; o contexto permite que o resultado da dádiva continue vigente sem precisar explicitá-lo verbalmente.
- source_word: πειθαρχοῦσιν
  choice: obedecem
  rationale: Expressa de maneira clara a obediência a alguém investido de autoridade e retoma naturalmente o contraste de Atos 5:29 entre obedecer a Deus e aos seres humanos.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome retoma Deus de modo claro e preserva a coesão pronominal do grego.
theological_decisions:
- issue: O Espírito Santo como testemunha ao lado dos apóstolos
  choice: “e também o Espírito Santo”, entendendo por elipse o predicado “é testemunha” da oração anterior
  alternative: “e o Espírito Santo também é testemunha”
  rationale: A segunda oração grega não repete o verbo nem o predicativo, mas naturalmente os recebe da primeira. A formulação concisa preserva essa elipse e apresenta o Espírito Santo como testemunha juntamente com os apóstolos, sem ampliar a afirmação.
- issue: Referência pronominal ao Espírito Santo
  choice: Usar o relativo português “que”
  alternative: “o qual”
  rationale: “Que” pode ter referente pessoal em português e é a opção mais natural. A escolha respeita o neutro gramatical ligado a πνεῦμα sem transformar gênero gramatical em afirmação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “e também” reproduz de modo natural a força do segundo καί e conserva a elipse grega. Evitou-se uma nota sobre o gênero do pronome relativo porque, em português, “que” não marca gênero e não gera a dificuldade existente em inglês.
