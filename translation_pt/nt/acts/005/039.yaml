  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: pt
  text: Mas, se isso vem de Deus, vocês não conseguirão derrubá-los[a]. Cuidado para que vocês não acabem sendo encontrados lutando contra Deus[b]. E eles foram persuadidos por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «destruí-los» ou «acabar com eles». O pronome se refere mais naturalmente aos apóstolos, embora alguns o entendam de forma mais ampla como referência ao movimento ou à obra deles.
    reason: lexical_and_referential_alternative
  - marker: b
    text: Ou «sejam considerados adversários de Deus»; literalmente, «combatentes contra Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: vem de Deus
  rationale: A preposição ἐκ indica fonte ou origem; «vem de Deus» é natural em português e preserva o critério de origem divina apresentado por Gamaliel.
- source_word: δυνήσεσθε
  choice: conseguirão
  rationale: O futuro de δύναμαι expressa capacidade futura; «não conseguirão» comunica com clareza tanto o tempo quanto a impossibilidade.
- source_word: καταλῦσαι
  choice: derrubar
  rationale: Neste contexto, καταλύω significa levar à ruína ou fazer fracassar. «Derrubar» se aplica naturalmente aos apóstolos e também sugere a tentativa de acabar com sua atuação.
- source_word: αὐτούς
  choice: os
  rationale: O pronome grego está no masculino plural e aponta mais naturalmente para os apóstolos, preservando-se a referência pessoal.
- source_word: μήποτε
  choice: Cuidado para que não
  rationale: μήποτε introduz uma advertência quanto a um possível resultado indesejável; esta construção transmite a cautela de modo natural sem transformar a possibilidade em certeza.
- source_word: θεομάχοι
  choice: lutando contra Deus
  rationale: O termo designa literalmente pessoas que combatem Deus. A formulação verbal é corrente em português e mantém a gravidade teológica.
- source_word: εὑρεθῆτε
  choice: sejam encontrados
  rationale: O passivo de εὑρίσκω comunica que eles poderiam revelar-se ou ser reconhecidos nessa condição; a tradução mantém de perto essa imagem.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: E eles se deixaram persuadir por ele
  rationale: A forma passiva de πείθω indica que aceitaram o conselho de Gamaliel. «Se deixaram persuadir» preserva a passividade e soa natural em português.
theological_decisions:
- issue: Referente de αὐτούς naquilo que o conselho não conseguiria derrubar
  choice: O pronome se refere aos apóstolos, os homens diante do conselho.
  alternative: O pronome pode ser entendido de forma mais ampla como uma referência ao movimento ou à obra mencionada no versículo anterior.
  rationale: O masculino plural grego aponta diretamente para pessoas. A tradução mantém essa referência sem converter a advertência em uma promessa geral sobre todo movimento que alegue origem divina.
- issue: Força da advertência introduzida por μήποτε
  choice: 'Uma possibilidade séria: eles poderiam ser encontrados lutando contra Deus.'
  alternative: 'Uma conclusão mais direta: nesse caso, estariam necessariamente lutando contra Deus.'
  rationale: A construção grega apresenta uma advertência cautelosa, não uma declaração dogmática de que a origem divina já havia sido estabelecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais («vocês», «conseguirão»). A ordem e a pontuação preservam a advertência de Gamaliel e a continuação narrativa do versículo.
