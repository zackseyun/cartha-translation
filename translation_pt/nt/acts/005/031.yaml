id: ACT.5.31
reference: Acts 5:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: pt
  text: Deus exaltou este à sua direita como Líder e Salvador[a], para dar a Israel arrependimento e perdão dos pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus o exaltou por meio de sua mão direita como Líder e Salvador.” A expressão grega também pode indicar o meio pelo qual Deus o exaltou, isto é, a mão direita de Deus, embora aqui provavelmente se refira à posição de máxima honra à direita de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: este
  rationale: O demonstrativo é enfático e aponta especificamente para Jesus; “este” preserva essa força de modo natural no contexto.
- source_word: ἀρχηγὸν
  choice: Líder
  rationale: O termo pode designar quem está à frente, conduz ou dá início. Aqui, em paralelo com “Salvador” e no contexto de exaltação, “Líder” comunica claramente a posição de autoridade.
- source_word: σωτῆρα
  choice: Salvador
  rationale: É a tradução consagrada e adequada neste contexto cristológico, preservando tanto a ideia de libertação quanto a de salvação.
- source_word: ὕψωσεν
  choice: exaltou
  rationale: O verbo indica que Deus elevou Jesus a uma posição de honra e autoridade, não apenas que o ressuscitou ou levantou fisicamente.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: à sua direita
  rationale: A expressão é entendida principalmente como referência à posição de máxima honra e autoridade junto de Deus. A possível leitura instrumental é preservada em nota.
- source_word: τοῦ δοῦναι
  choice: para dar
  rationale: O infinitivo articular expressa propósito; “para dar” torna essa relação explícita e natural em português.
- source_word: μετάνοιαν
  choice: arrependimento
  rationale: “Arrependimento” é a tradução portuguesa corrente e teologicamente abrangente, indicando mudança interior e retorno a Deus, não mera reconsideração mental.
- source_word: τῷ Ἰσραὴλ
  choice: a Israel
  rationale: O dativo identifica Israel como destinatário da dádiva e é vertido diretamente por “a Israel”.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: perdão dos pecados
  rationale: Expressão clara, idiomática e tradicional para a remissão ou liberação da culpa dos pecados.
theological_decisions:
- issue: Sentido da exaltação de Jesus τῇ δεξιᾷ αὐτοῦ
  choice: Deus exaltou Jesus à posição de honra e autoridade à sua direita.
  alternative: Deus exaltou Jesus por meio de sua mão direita.
  rationale: O contexto e o uso neotestamentário da direita de Deus favorecem a leitura locativa de entronização, mas a forma dativa grega também admite valor instrumental; por isso, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a ênfase do demonstrativo, a linguagem de exaltação e a ambiguidade sintática da expressão grega por meio de nota.
