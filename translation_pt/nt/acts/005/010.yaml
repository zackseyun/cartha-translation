- source_word: οἱ νεανίσκοι
  choice: os jovens
  rationale: Mantém o sentido básico do substantivo grego sem acrescentar função ou cargo não expresso no texto.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: ao lado do marido
  rationale: Neste contexto funerário, a preposição indica proximidade junto ao local de sepultamento do marido.
