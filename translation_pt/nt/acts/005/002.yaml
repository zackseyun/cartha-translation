base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: pt
  text: E reteve para si parte do valor da venda,[a] e sua mulher também sabia disso. Depois de trazer uma parte, colocou-a aos pés dos apóstolos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apropriou-se secretamente de parte do valor da venda”. O verbo grego indica reter algo para si de modo desonesto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos pés dos apóstolos”, uma expressão concreta para colocar o dinheiro diante deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: reteve para si
  rationale: O verbo νοσφίζομαι indica apropriar-se ou reter algo para si, com conotação de desonestidade ou ocultação. “Reteve para si” preserva essa força negativa sem impor ao texto uma qualificação jurídica mais específica.
- source_word: ἀπὸ τῆς τιμῆς
  choice: parte do valor da venda
  rationale: Neste contexto, τιμή é o valor recebido pela propriedade vendida. “Valor da venda” é claro e natural em português; “parte” explicita o sentido exigido pelo contexto e pela construção verbal.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: com sua mulher também ciente disso
  rationale: 'A construção genitiva absoluta expressa uma circunstância concomitante: a mulher sabia da retenção. “Também” representa καί, sem afirmar além do texto qual foi o grau de participação dela.'
- source_word: ἐνέγκας μέρος τι
  choice: depois, levou uma parte
  rationale: O particípio aoristo indica uma ação anterior à ação principal. “Uma parte” conserva a quantidade indefinida de μέρος τι, e “depois” torna natural em português a sequência narrativa.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: a colocou aos pés dos apóstolos
  rationale: A tradução conserva a imagem concreta recorrente em Atos para a entrega do dinheiro à disposição e autoridade dos apóstolos.
theological_decisions:
- issue: Força moral da ação de Ananias
  choice: Traduzir ἐνοσφίσατο como retenção para si, preservando sua conotação desonesta.
  alternative: “guardou uma parte” ou “ficou com uma parte”, que poderiam soar moralmente neutros.
  rationale: O verbo e o contexto narrativo indicam retenção dissimulada, não a mera decisão legítima de conservar parte do dinheiro. A formulação mantém essa força sem acrescentar uma acusação jurídica não explicitada.
- issue: Conhecimento da mulher
  choice: Afirmar que ela estava ciente da retenção.
  alternative: Traduzir como se ela tivesse necessariamente planejado ou executado a ação junto com ele.
  rationale: O texto declara seu conhecimento, mas este versículo, por si só, não especifica em que medida ela participou do planejamento. A tradução preserva essa delimitação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência narrativa, sem perder a sequência das ações nem a imagem concreta do original.
