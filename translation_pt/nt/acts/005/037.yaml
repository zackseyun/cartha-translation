base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: pt
  text: Depois disso[a], levantou-se Judas, o Galileu, nos dias do recenseamento[b], e levou pessoas a se afastarem para segui-lo.[c] Ele também pereceu, e todos os que se deixavam convencer por ele foram dispersos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Depois dele”. O pronome pode retomar a pessoa mencionada anteriormente; no contexto, também pode referir-se de modo mais geral ao acontecimento precedente.
    reason: alternativa lexical
  - marker: b
    text: Ou “registro oficial”. O termo grego pode designar um censo populacional ou o processo oficial de registro.
    reason: alternativa lexical
  - marker: c
    text: Ou “fez pessoas desertarem e segui-lo”. O verbo grego pode transmitir a ideia de levar alguém a abandonar uma lealdade ou posição anterior.
    reason: alternativa lexical
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Depois dele
  rationale: A construção temporal com μετά e acusativo indica sucessão e, no contexto, retoma a pessoa mencionada anteriormente. A expressão portuguesa é natural e mantém a referência pessoal; a possível leitura mais geral, “depois disso”, é registrada em nota.
- source_word: ἀνέστη
  choice: levantou-se
  rationale: No contexto, descreve o surgimento de um líder em cena, não ressurreição. “Levantou-se” conserva a vivacidade da expressão grega sem acrescentar que se tratou formalmente de uma revolta.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Judas, o galileu
  rationale: Reproduz o nome e a designação adjetiva em aposição de modo claro e corrente em português.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: nos dias do recenseamento
  rationale: Mantém a forma temporal do grego. ἀπογραφή designa um recenseamento ou registro oficial; “recenseamento” é preciso e amplamente compreensível.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: levou pessoas a se afastarem para segui-lo
  rationale: O causativo ἀπέστησε pode indicar que pessoas foram levadas a abandonar uma posição ou lealdade anterior, enquanto ὀπίσω αὐτοῦ expressa que passaram a segui-lo. “Pessoas” preserva o caráter coletivo e indefinido do substantivo sem artigo.
- source_word: κἀκεῖνος ἀπώλετο
  choice: Ele também pereceu
  rationale: “Também” conserva a força continuativa de κἀκεῖνος, ligando o destino de Judas ao exemplo anterior. “Pereceu” expressa morte ou ruína sem especificar uma causa que o texto não declara.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: todos os que se deixavam convencer por ele
  rationale: A formulação conserva o aspecto imperfeito de pessoas continuamente persuadidas ou conquistadas por Judas e evita reduzir o verbo simplesmente a “seguir”, já expresso na oração anterior.
- source_word: διεσκορπίσθησαν
  choice: foram dispersos
  rationale: Equivalente direto e idiomático do aoristo passivo, indicando que o grupo foi desfeito e espalhado.
theological_decisions:
- issue: Caracterização histórico-política do movimento de Judas
  choice: Descrever que Judas levou pessoas a se afastarem para segui-lo, sem chamá-lo explicitamente de rebelde nem denominar o movimento como revolta.
  alternative: “Liderou uma revolta” ou “levou o povo a se rebelar e segui-lo”.
  rationale: Embora o contexto histórico possa ser associado a insurreição, este versículo não emprega um termo explícito para “revolta”. A tradução preserva a ideia de afastamento de uma lealdade anterior sem acrescentar uma classificação política mais específica que a redação grega.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém a sucessão narrativa e as distinções lexicais do grego, enquanto as notas preservam ambiguidades reais sem sobrecarregar o texto principal.
