id: ACT.5.4
reference: Acts 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: pt
  text: Enquanto permanecia sem ser vendido, não era seu? E, depois de vendido, não estava sob sua autoridade?[a] Por que você decidiu em seu coração fazer isso? Não foi a seres humanos que você mentiu, mas a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não estava à sua disposição?” ou “não estava sob seu controle?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: Enquanto não era vendido, não continuava sendo
  rationale: Preserva a repetição verbal e o aspecto contínuo do grego, expressando naturalmente que a propriedade permanecia com Ananias antes da venda.
- source_word: σοὶ
  choice: seu
  rationale: O dativo indica posse neste contexto; “seu” é a formulação idiomática e direta em português.
- source_word: πραθὲν
  choice: depois de vendido
  rationale: Expressa naturalmente o particípio aoristo passivo e mantém a sequência entre a posse e a venda.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: estava sob sua autoridade
  rationale: Mantém a ideia de direito, poder de decisão e controle legítimo, sem reduzir a expressão à simples posse.
- source_word: τί ὅτι
  choice: Por que
  rationale: Em português corrente, “Por que” comunica de modo claro a pergunta repreensiva do idioma grego, sem produzir uma construção artificial.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: você decidiu em seu coração
  rationale: Comunica a resolução interior sugerida pela expressão, preservando a linguagem do coração sem recorrer ao pouco natural “pôs no coração este assunto”.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: fazer isso
  rationale: O pronome retoma de modo natural o ato em questão; o contexto fornece seu peso moral, sem que a tradução acrescente “plano” ou “fraude”.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Não foi a seres humanos que você mentiu, mas a Deus
  rationale: A construção focal preserva o contraste enfático entre seres humanos e Deus; “seres humanos” transmite o sentido genérico de ἀνθρώποις sem restringi-lo a homens do sexo masculino.
theological_decisions:
- issue: Relação entre mentir ao Espírito Santo em Atos 5:3 e mentir a Deus neste versículo
  choice: Traduzir simplesmente “a Deus”
  alternative: Acrescentar “isto é, ao Espírito Santo”
  rationale: O texto deste versículo diz “a Deus”. A ligação teológica com o Espírito Santo surge do contexto imediato e não deve ser explicitada por uma adição interpretativa.
- issue: Liberdade de Ananias sobre a propriedade e o resultado da venda
  choice: Manter a ideia de que aquilo que fora vendido continuava sob sua autoridade
  alternative: Expressar apenas que permanecia em sua posse
  rationale: 'A formulação conserva o argumento de Pedro: o pecado não consistiu em deixar de entregar tudo, mas no engano praticado apesar de Ananias ter legítimo poder de decisão.'
- issue: Sentido genérico de ἀνθρώποις
  choice: seres humanos
  alternative: homens
  rationale: O substantivo grego designa aqui pessoas em geral. A opção escolhida preserva com precisão o contraste entre a humanidade e Deus, sem sugerir uma referência exclusiva ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “você” por clareza discursiva e “seres humanos” para o plural genérico. A estrutura interrogativa e o contraste final mantêm o tom firme da repreensão de Pedro.
