  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: pt
  text: 'Pedro, porém, respondeu-lhe: “Diga-me: foi por esse valor que vocês venderam o terreno[a]?” Ela respondeu: “Sim, por esse valor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a propriedade” ou “o campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: Pedro, porém, perguntou-lhe
  rationale: A construção introduz a fala dirigida a Safira. Embora ἀπεκρίθη signifique literalmente “respondeu”, em português “perguntou-lhe” expressa com naturalidade a função da fala que vem em seguida, enquanto “porém” marca a mudança narrativa indicada por δέ.
- source_word: Εἰπέ μοι
  choice: Diga-me
  rationale: Reproduz de modo direto e natural o imperativo aoristo de λέγω com o pronome no dativo.
- source_word: εἰ
  choice: foi ... que
  rationale: εἰ introduz aqui uma pergunta de resposta sim ou não. A construção interrogativa “foi por esse valor que...?” é idiomática e mantém o foco sobre o preço.
- source_word: τοσούτου
  choice: por esse valor
  rationale: O termo aponta para a quantia já mencionada. “Por esse valor” é claro, atual e adequado a uma transação comercial; sua repetição preserva a formulação enfática do grego.
- source_word: τὸ χωρίον
  choice: o terreno
  rationale: χωρίον pode designar terreno, propriedade ou campo. “Terreno” preserva a referência a uma porção de terra sem especificar indevidamente seu uso.
- source_word: ἀπέδοσθε
  choice: vocês venderam
  rationale: Em contexto comercial, ἀποδίδωμι pode significar “vender”. A forma verbal está na segunda pessoa do plural, por isso “vocês venderam” inclui Safira e Ananias explicitamente.
- source_word: ἡ δὲ εἶπεν
  choice: Ela respondeu
  rationale: Embora o grego diga literalmente “ela disse”, “respondeu” é a forma natural em português para introduzir a resposta direta à pergunta de Pedro.
- source_word: Ναί
  choice: Sim
  rationale: Equivalente simples e direto da resposta afirmativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Emprega-se “vocês” para tornar visível o plural de ἀπέδοσθε e indicar que a venda foi realizada pelo casal.
