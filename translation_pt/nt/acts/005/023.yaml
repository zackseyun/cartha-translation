  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: pt
  text: 'dizendo: “Encontramos a prisão firmemente trancada[a], e os guardas em pé junto às portas; mas, quando abrimos as portas, não encontramos ninguém dentro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trancada com toda a segurança”. O grego enfatiza que a prisão estava plenamente protegida e fechada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: prisão
  rationale: Designa o local de confinamento; “prisão” é a equivalência corrente e natural neste contexto.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: trancada com toda a segurança
  rationale: O particípio perfeito passivo descreve a prisão no estado de estar fechada ou trancada, e ἐν πάσῃ ἀσφαλείᾳ ressalta que todas as medidas de segurança estavam em vigor.
- source_word: φύλακας ἑστῶτας
  choice: os guardas em pé
  rationale: Preserva tanto a função dos φύλακες no contexto carcerário quanto o detalhe visual de que estavam em sua posição.
- source_word: ἐπὶ τῶν θυρῶν
  choice: junto às portas
  rationale: Expressa proximidade espacial de modo natural em português, apresentando os guardas posicionados nas entradas.
- source_word: ἀνοίξαντες
  choice: quando abrimos
  rationale: Converte naturalmente o particípio aoristo em oração temporal sem acrescentar um objeto explícito que o grego deixa subentendido pelo contexto.
- source_word: ἔσω
  choice: lá dentro
  rationale: Traduz de modo claro e idiomático a referência ao interior da prisão.
- source_word: οὐδένα
  choice: ninguém
  rationale: Equivalente direto e natural do pronome negativo usado como objeto.
- source_word: λέγοντες ὅτι
  choice: 'dizendo:'
  rationale: Mantém a ligação participial com o versículo anterior e introduz em discurso direto o conteúdo do relatório.
