  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: pt
  text: E grande temor veio sobre toda a igreja[a] e sobre todos os que ouviram essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assembleia» ou «congregação» para «igreja» (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: veio sobre
  rationale: Com φόβος como sujeito e ἐπί + acusativo indicando as pessoas afetadas, a expressão idiomática «veio sobre» conserva o caráter súbito do acontecimento e soa natural em português.
- source_word: φόβος μέγας
  choice: grande temor
  rationale: No contexto imediato do juízo sobre Ananias e Safira, φόβος exprime medo reverente e profundo; «grande temor» mantém a intensidade de μέγας e a dignidade do registro bíblico.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: sobre toda a igreja
  rationale: ἐκκλησία designa aqui a comunidade dos que criam. «Igreja» é a equivalência usual e apropriada, enquanto «toda» preserva o alcance abrangente de ὅλην.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: todos os que ouviram falar dessas coisas
  rationale: «Ouviram falar» comunica naturalmente que as pessoas receberam notícia dos acontecimentos; «dessas coisas» preserva o plural de ταῦτα.
theological_decisions:
- issue: Tradução de ἐκκλησία
  choice: igreja
  alternative: assembleia ou congregação
  rationale: Em Atos, o termo refere-se à comunidade cristã. «Igreja» identifica esse referente sem definir uma estrutura eclesiástica específica; a nota registra alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a coordenação repetida «sobre... e sobre...» do grego e preserva o plural «dessas coisas».
