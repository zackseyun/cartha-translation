    issue: «ouviram falar dessas coisas» amplia o sentido de ἀκούοντας ταῦτα.
    rationale: O grego diz literalmente «todos os que ouviam estas coisas», sem o complemento adicional «falar». Embora a expressão portuguesa seja idiomática, ela pode deslocar o foco de ouvir os acontecimentos/palavras para ouvir notícias a respeito deles. «Ouviram essas coisas» mantém a concisão e a ambiguidade do original.
  revised_text: E grande temor veio sobre toda a igreja[a] e sobre todos os que ouviram essas coisas.
