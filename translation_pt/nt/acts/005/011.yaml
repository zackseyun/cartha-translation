  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura principal: «grande temor», o alcance sobre toda a igreja e sobre todos os ouvintes, bem como a repetição de «sobre». Contudo, «ouviram falar dessas coisas» acrescenta o verbo «falar»/a noção de receber notícia, que não está explicitamente em ἀκούοντας ταῦτα («os que ouviam/ouviram estas coisas»).'
  naturalness: «E grande temor veio sobre...» é natural em registro bíblico moderno e compreensível em português internacional. «Todos os que ouviram essas coisas» é igualmente natural e mais direto.
  terminology: «Igreja» é apropriado para ἐκκλησία neste contexto; a nota oferece de modo útil as alternativas lexicais «assembleia» e «congregação». «Grande temor» reproduz bem φόβος μέγας sem especificar indevidamente se o temor é pavor ou reverência.
  issues:
