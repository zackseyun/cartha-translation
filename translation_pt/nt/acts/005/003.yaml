source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: pt
  text: 'Mas Pedro disse: “Ananias, por que Satanás encheu o seu coração a ponto de você mentir ao Espírito Santo[a] e reter para si parte do valor do terreno[b][c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enganar o Espírito Santo”. O verbo grego pode ter o sentido de falar falsamente a alguém; neste contexto, “mentir ao” é a tradução mais direta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “parte do preço de venda” ou “parte do que recebeu pela venda”.'
    reason: lexical_alternative
  - marker: c
    text: “Terreno” também pode ser traduzido por “propriedade” ou “campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Mas Pedro disse
  rationale: δέ é um conectivo leve, aqui naturalmente adversativo, pois introduz a confrontação de Pedro.
- source_word: διὰ τί
  choice: por que
  rationale: Forma interrogativa direta e corrente em português.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Satanás encheu seu coração
  rationale: Preserva a metáfora e mantém Satanás como sujeito, sem acrescentar ideias de possessão, controle total ou ausência de responsabilidade humana.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: levando você a mentir ao Espírito Santo
  rationale: Expressa de modo natural a relação de resultado ou propósito do acusativo com infinitivo, sem eliminar a responsabilidade de Ananias.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Equivalente contemporâneo consagrado e fiel ao referente pessoal do texto.
- source_word: νοσφίσασθαι
  choice: reter para si parte
  rationale: Comunica a retenção secreta, em benefício próprio, de uma parcela do valor, sem recorrer a termos jurídicos mais estreitos.
- source_word: ἀπὸ τῆς τιμῆς
  choice: parte do valor
  rationale: ἀπό com o genitivo indica retirada de um todo; 'parte do valor' torna essa relação explícita e natural.
- source_word: τοῦ χωρίου
  choice: do terreno
  rationale: χωρίον pode designar terreno, campo ou propriedade; 'terreno' se ajusta ao bem imóvel vendido sem estreitar excessivamente o sentido.
theological_decisions:
- issue: A atuação de Satanás no coração de Ananias
  choice: Manter literalmente que Satanás encheu o coração de Ananias.
  alternative: “Por que você deixou Satanás dominar você?”
  rationale: O grego apresenta Satanás como sujeito da ação e, ao mesmo tempo, responsabiliza Ananias. A tradução conserva essa tensão sem definir possessão, coerção irresistível ou controle total.
- issue: A mentira dirigida ao Espírito Santo
  choice: “mentir ao Espírito Santo”
  alternative: “enganar o Espírito Santo”
  rationale: A formulação direta corresponde à construção grega e preserva a referência pessoal ao Espírito Santo, sem inserir explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “levando você a” evita rigidez sintática e conserva a relação entre o enchimento do coração e os infinitivos gregos. Os marcadores aparecem no texto em ordem alfabética.
