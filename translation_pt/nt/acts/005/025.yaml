id: ACT.5.25
reference: Acts 5:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: pt
  text: 'Mas alguém chegou e lhes comunicou: “Vejam! Os homens que vocês puseram na prisão estão no templo[a], em pé, ensinando o povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos pátios do templo”; o termo grego ἱερόν se refere ao complexo do templo, e não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: chegou
  rationale: O particípio aoristo indica a chegada do mensageiro antes de ele comunicar a notícia; “chegou” preserva com naturalidade essa sequência narrativa.
- source_word: δέ
  choice: Mas
  rationale: Assinala uma mudança com leve contraste em relação ao que precede.
- source_word: τις
  choice: alguém
  rationale: Mantém a referência indefinida sem acrescentar identidade ou função não expressa no grego.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: lhes comunicou
  rationale: Expressa o ato de transmitir uma informação às autoridades, preservando o objeto indireto pronominal.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Interjeição que chama a atenção dos vários destinatários para uma notícia surpreendente; o plural concorda com o contexto.
- source_word: οἱ ἄνδρες
  choice: Os homens
  rationale: Tradução direta da expressão definida que retoma os apóstolos presos anteriormente.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: que vocês puseram na prisão
  rationale: Preserva a construção direta de τίθημι e identifica o local conhecido de confinamento de modo natural em português.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo[a]
  rationale: ἱερόν designa o complexo do templo, não especificamente o santuário interior; “no templo” é natural, com a precisão lexical registrada em nota.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: em pé, ensinando o povo
  rationale: Mantém os dois particípios coordenados e explicita a postura indicada por ἑστῶτες sem tornar a frase artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural dos destinatários. A exclamação em “Vejam!” reproduz a força de Ἰδού, e a nota evita que “templo” seja entendido apenas como o recinto sagrado interior.
