id: ACT.5.14
reference: Acts 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: pt
  text: E cada vez mais crentes no Senhor eram acrescentados — multidões tanto de homens como de mulheres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se juntavam” ou “eram adicionados”. O verbo grego descreve um aumento contínuo e pode ter sentido passivo, talvez sugerindo Deus como aquele que os acrescentava.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: cada vez mais
  rationale: Expressa naturalmente o valor comparativo e intensificador do advérbio, indicando crescimento contínuo.
- source_word: δὲ
  choice: E
  rationale: Neste contexto, a conjunção dá continuidade à narrativa, sem contraste forte.
- source_word: προσετίθεντο
  choice: eram acrescentados
  rationale: Preserva a forma passiva e o aspecto contínuo do imperfeito, sem explicitar quem realizava a ação.
- source_word: πιστεύοντες
  choice: crentes
  rationale: O particípio presente tem função substantiva e caracteriza essas pessoas por sua fé.
- source_word: τῷ κυρίῳ
  choice: no Senhor
  rationale: Com o verbo crer, o dativo indica aquele em quem a fé é depositada; a expressão é corrente e natural em português.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título reverencial e cristológico sem substituir o referente por uma explicação interpretativa.
- source_word: πλήθη
  choice: multidões
  rationale: Conserva a ideia enfática de grandes números e sua função explicativa em relação aos crentes acrescentados.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: tanto de homens como de mulheres
  rationale: Reproduz a correlação τε καί e conserva a referência explícita aos dois grupos.
theological_decisions:
- issue: Referente e força de “Senhor”
  choice: Manter “Senhor”, entendendo que no contexto se refere a Jesus e que a fé é dirigida a ele.
  alternative: Entender “Senhor” de modo mais geral como referência a Deus.
  rationale: Nos resumos evangelísticos de Atos, κύριος frequentemente designa Jesus ressuscitado. A tradução conserva o título e não explicita “Jesus” onde o grego não o faz.
- issue: Voz e aspecto de προσετίθεντο
  choice: Usar o passivo contínuo “eram acrescentados”.
  alternative: 'Traduzir com nuance média ou intransitiva: “se juntavam”.'
  rationale: O imperfeito apresenta uma ação contínua, e o passivo pode sugerir Deus como agente sem nomeá-lo. A formulação mantém essa possibilidade e não resolve a ambiguidade no texto principal.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Cada vez mais” comunica progressão; o travessão preserva a aposição enfática de “multidões”.
