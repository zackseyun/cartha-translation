    issue: κἄν traduzido por «ao menos»
    rationale: Embora «ao menos» possa ser defensável contextualmente, κἄν aqui intensifica a expectativa mínima com o sentido de «até mesmo». «Até mesmo a sua sombra» reflete mais diretamente a ênfase grega e o audit trail inglês.
  - severity: low
