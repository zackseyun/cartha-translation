  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: pt
  text: de modo que levavam os doentes até para as ruas[a] e os colocavam em leitos e esteiras[b], para que, quando Pedro passasse, até mesmo a sombra dele cobrisse alguém dentre eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as praças”. A palavra grega pode se referir a ruas largas ou a espaços públicos abertos.
    reason: lexical_alternative
  - marker: b
    text: Ou “camas e catres”. O grego distingue dois tipos de leito ou superfície para deitar.
    reason: lexical_alternative
  - marker: c
    text: 'O versículo relata a intenção das pessoas: elas colocavam os doentes ali para que até mesmo a sombra de Pedro cobrisse alguém dentre eles; não afirma explicitamente que a própria sombra curava.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado do crescimento da influência dos apóstolos no contexto anterior, preservando a força consecutiva.
- source_word: καὶ εἰς τὰς πλατείας
  choice: até para as ruas
  rationale: “Até” comunica a ênfase de καί, enquanto “ruas” é natural no contexto; πλατείας também pode designar praças ou espaços públicos amplos, alternativa registrada em nota.
- source_word: ἐκφέρειν
  choice: levavam ... para
  rationale: Expressa a ação contínua de tirar fisicamente os doentes das casas e levá-los a espaços públicos.
- source_word: τοὺς ἀσθενεῖς
  choice: os doentes
  rationale: Neste contexto de curas, o termo se refere a pessoas enfermas, e não apenas fracas em sentido geral.
- source_word: τιθέναι
  choice: os colocavam
  rationale: Formulação natural e respeitosa para posicionar os doentes sobre superfícies de repouso.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: em leitos e esteiras
  rationale: Mantém a distinção entre dois tipos de superfície para deitar sem impor precisão técnica incerta.
- source_word: ἵνα
  choice: para que
  rationale: Preserva claramente a finalidade ou o resultado pretendido pelo povo.
- source_word: ἐρχομένου Πέτρου
  choice: quando Pedro passasse
  rationale: O genitivo absoluto descreve Pedro em movimento junto aos doentes; “passasse” comunica isso de modo natural.
- source_word: κἂν
  choice: ao menos
  rationale: 'Exprime a esperança de um contato mínimo: que pelo menos a sombra alcançasse algum deles. “Até mesmo” seria também possível.'
- source_word: ἡ σκιὰ
  choice: a sombra dele
  rationale: Referência literal à sombra de Pedro, com o pronome tornando a relação clara em português.
- source_word: ἐπισκιάσῃ
  choice: cobrisse
  rationale: Reproduz de modo idiomático a ideia de a sombra projetar-se sobre alguém, sem afirmar por si só que ela efetuava a cura.
- source_word: τινὶ αὐτῶν
  choice: algum deles
  rationale: 'Preserva o singular indefinido: qualquer indivíduo dentre os doentes reunidos.'
theological_decisions:
- issue: Se o versículo deve afirmar que a sombra de Pedro possuía poder de cura
  choice: A tradução relata apenas a finalidade e a esperança das pessoas, sem declarar que a sombra efetuava a cura.
  alternative: Empregar uma formulação que sugira mais diretamente que a sombra de Pedro curava.
  rationale: ἵνα com o subjuntivo apresenta o propósito da disposição dos doentes. Embora o contexto mais amplo relate curas, este versículo não atribui explicitamente poder curativo à sombra.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “De modo que” mantém a ligação lógica com o contexto; “ao menos” conserva a expectativa mínima expressa por κἂν. Todos os marcadores de nota aparecem no texto principal.
