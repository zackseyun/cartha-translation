  source_fidelity: 'A tradução preserva adequadamente a construção consecutiva (ὥστε), a finalidade expressa por ἵνα e a cautela narrativa: o versículo descreve a intenção das pessoas, não declara que a sombra curou. Contudo, «ao menos» para κἄν enfraquece a ênfase inclusiva de «até mesmo», e «algum deles» pode soar como um subconjunto, enquanto τινὶ αὐτῶν é singular indefinido: qualquer/alguém dentre eles.'
  naturalness: O português é claro, moderno e apropriado. «Levavam os doentes até para as ruas» e «os colocavam» são naturais. «Até mesmo» comunica melhor a ênfase sem prejudicar a fluência; «alguém dentre eles» torna mais nítido o referente singular.
  terminology: «Doentes», «ruas», «leitos» e «esteiras» são escolhas aceitáveis e não impõem uma distinção técnica além do que o grego permite. A nota lexical sobre πλατείας é útil. A nota sobre os dois tipos de superfícies preserva corretamente a distinção lexical. A nota interpretativa deve conservar o singular («a sombra ... cobrisse alguém») e evitar sugerir uma cura explicitamente afirmada no versículo.
  issues:
