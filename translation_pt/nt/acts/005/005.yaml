id: ACT.5.5
reference: Acts 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: pt
  text: Mas, ao ouvir essas palavras, Ananias caiu e morreu.[a] E um grande temor tomou conta de todos os que ouviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “expirou” ou “deu o último suspiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: ao ouvir
  rationale: O particípio presente tem valor temporal neste contexto; “ao ouvir” expressa naturalmente a relação entre as palavras de Pedro e a reação de Ananias.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz o desdobramento narrativo com leve contraste em relação à fala anterior de Pedro.
- source_word: λόγους τούτους
  choice: essas palavras
  rationale: Refere-se diretamente às palavras que Pedro acabara de pronunciar; a expressão é clara e natural em português.
- source_word: πεσὼν
  choice: caiu
  rationale: Preserva a imagem física do particípio aoristo sem acrescentar a interpretação de que Ananias desmaiou ou sofreu um colapso.
- source_word: ἐξέψυξεν
  choice: morreu
  rationale: No contexto, o verbo indica inequivocamente a morte. A formulação mais literal, ligada a exalar o último suspiro, é preservada em nota.
- source_word: ἐγένετο φόβος μέγας
  choice: um grande temor tomou conta
  rationale: Expressa de modo natural o surgimento e a intensidade do temor, em combinação com ἐπί.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: de todos os que ouviram
  rationale: O particípio substantivado designa todos os que ouviram, sem especificar indevidamente se ouviram diretamente as palavras ou posteriormente a notícia.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Natureza da morte de Ananias
  choice: Apresentar diretamente a queda e a morte imediata, sem especificar o mecanismo.
  alternative: Afirmar que ele morreu de choque ou que Deus o feriu diretamente de morte.
  rationale: O grego relata que Ananias caiu e morreu, mas não explicita o mecanismo. A tradução mantém a força narrativa sem resolver além do texto a questão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Temor” preserva a gravidade religiosa e narrativa de φόβος sem reduzir o sentido a mero susto.
