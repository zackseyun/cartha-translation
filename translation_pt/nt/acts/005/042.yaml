  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: pt
  text: E, todos os dias, no templo e de casa em casa, não paravam de ensinar e de anunciar a boa notícia de que Jesus é o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “anunciar a boa notícia a respeito de Jesus, o Messias” ou “anunciar Jesus como o Messias”.
    reason: Alternativa lexical e sintática para τὸν χριστὸν Ἰησοῦν, preservando maneiras plausíveis de relacionar a expressão ao verbo εὐαγγελιζόμενοι.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: E, todos os dias
  rationale: Expressa naturalmente o acusativo de extensão temporal e conserva o sentido habitual e contínuo; “E” representa a ligação narrativa de τε.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Ἱερόν designa o complexo do templo, não especificamente o santuário; “no templo” é claro, conciso e não acrescenta uma delimitação interpretativa como “nos pátios”.
- source_word: κατ’ οἶκον
  choice: de casa em casa
  rationale: Reproduz o valor distributivo de κατά com οἶκον e indica atuação em casas particulares.
- source_word: οὐκ ἐπαύοντο
  choice: não paravam
  rationale: O imperfeito comunica ação contínua; a formulação é atual e preserva a ideia de que continuavam sem cessar.
- source_word: διδάσκοντες
  choice: de ensinar
  rationale: Equivalente comum e direto de διδάσκω; o infinitivo após “não paravam” produz português natural.
- source_word: εὐαγγελιζόμενοι
  choice: de anunciar as boas-novas
  rationale: Conserva o sentido verbal de comunicar uma boa notícia sem depender do termo eclesiástico “evangelizar”.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: de que Jesus é o Messias
  rationale: Explicita em português idiomático o conteúdo da proclamação, enquanto traduz Χριστός como o título “Messias”. A nota preserva outras construções sintáticas possíveis.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona como título e identifica Jesus como o ungido esperado; “Messias” comunica o sentido do título em vez de apenas transliterá-lo.
- issue: Força sintática de τὸν χριστὸν Ἰησοῦν depois de εὐαγγελιζόμενοι
  choice: 'conteúdo da proclamação: “de que Jesus é o Messias”'
  alternative: 'objeto ou expressão apositiva: “Jesus, o Messias” / “Jesus como o Messias”'
  rationale: A formulação escolhida é idiomática e torna clara a afirmação proclamada, mas a construção grega admite representação mais literal; essa ambiguidade é mantida na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” mantém a imagem lexical do anúncio favorável; “de casa em casa” é uma expressão corrente e preserva a distribuição do original.
