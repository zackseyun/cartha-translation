source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: pt
  text: Mas um fariseu chamado Gamaliel, mestre da Lei respeitado por todo o povo, levantou-se no Conselho[a] e ordenou que os homens fossem retirados por um breve tempo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o Sinédrio, o conselho dirigente judaico.
    reason: cultural_note
  - marker: b
    text: Literalmente, “fazer os homens ficar fora por um breve tempo”; a expressão significa mandá-los sair ou retirá-los temporariamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: levantou-se
  rationale: Expressa naturalmente a ação física e pública de Gamaliel ao tomar a palavra na assembleia.
- source_word: δέ
  choice: Mas
  rationale: Marca a leve contraposição e a mudança narrativa para a intervenção de Gamaliel.
- source_word: τις ... Φαρισαῖος
  choice: um fariseu
  rationale: O indefinido τις apresenta um novo participante e é transmitido de modo idiomático pelo artigo indefinido.
- source_word: ἐν τῷ συνεδρίῳ
  choice: no Conselho
  rationale: Traduz diretamente o órgão dirigente judaico, preservando a identificação cultural em nota em vez de inserir o termo técnico no corpo do texto.
- source_word: ὀνόματι Γαμαλιήλ
  choice: chamado Gamaliel
  rationale: Forma corrente e clara em português para a expressão com ὀνόματι.
- source_word: νομοδιδάσκαλος
  choice: mestre da Lei
  rationale: Designa alguém que ensina a Lei; a formulação é concisa, tradicional sem ser arcaica e inteligível.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: respeitado por todo o povo
  rationale: Neste contexto, τίμιος indica estima social; 'respeitado' soa natural em português e não acrescenta uma honra oficial.
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: Mantém a força da instrução autoritativa no contexto judicial.
- source_word: ἔξω ... τοὺς ἀνθρώπους ποιῆσαι
  choice: que os homens fossem retirados
  rationale: Transmite idiomaticamente a construção grega, literalmente 'fazer os homens [ficarem] fora', indicando sua remoção temporária do recinto.
- source_word: βραχύ
  choice: por um breve tempo
  rationale: Preserva o valor adverbial temporal de duração curta.
theological_decisions:
- issue: Referência de gênero em τοὺς ἀνθρώπους
  choice: os homens
  alternative: as pessoas
  rationale: No contexto, o referente são os apóstolos, todos homens, levados perante o Conselho; a tradução mantém a referência contextual específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase foi ajustada para evitar uma abertura pesada, sem alterar as relações sintáticas nem a progressão narrativa do grego.
