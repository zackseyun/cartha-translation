source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: pt
  text: Mas o sumo sacerdote se levantou, e ele e todos os que estavam com ele — isto é, o partido[a] dos saduceus — ficaram cheios de ciúme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seita”. A palavra grega pode designar um partido, uma corrente ou uma seita.
    reason: lexical_alternative
  - marker: b
    text: Ou “inveja”. A palavra grega também pode significar “zelo”, mas aqui o contexto favorece um sentido hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι introduz aqui uma ação decidida do sumo sacerdote. “Se levantou” preserva a imagem e funciona naturalmente na narrativa.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca uma transição com leve contraste em relação à acolhida favorável dos apóstolos no contexto anterior.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: Equivalente corrente e preciso para o ocupante desse ofício judaico.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: todos os que estavam com ele
  rationale: Mantém a ideia de pessoas associadas ou alinhadas ao sumo sacerdote sem especificar indevidamente sua função.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: isto é, o partido dos saduceus
  rationale: A expressão apositiva identifica o grupo ligado ao sumo sacerdote. “Partido” comunica uma corrente organizada dentro do judaísmo e evita o sentido posterior e pejorativo que “heresia” teria.
- source_word: ἐπλήσθησαν
  choice: ficaram cheios
  rationale: Reproduz de modo natural a construção passiva de πίμπλημι com o complemento no genitivo.
- source_word: ζήλου
  choice: ciúme
  rationale: Embora ζῆλος também possa significar zelo, o contexto de oposição hostil aos apóstolos favorece o sentido negativo de ciúme ou inveja.
theological_decisions:
- issue: Sentido de αἵρεσις
  choice: partido
  alternative: seita
  rationale: Neste contexto, o termo designa um grupo ou corrente reconhecível dentro do judaísmo, não “heresia” no sentido doutrinário posterior. A alternativa legítima é preservada em nota.
- issue: Sentido de ζῆλος
  choice: ciúme
  alternative: inveja; zelo
  rationale: O contexto exige uma motivação negativa, mas o substantivo grego possui amplitude semântica. “Ciúme” expressa ressentimento diante da influência dos apóstolos; “inveja” também é possível, enquanto “zelo” conserva o sentido lexical mais amplo, mas é menos provável aqui.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase preserva a ação singular do sumo sacerdote e o verbo plural referente a ele e a seus aliados; os travessões explicitam a aposição presente no grego.
