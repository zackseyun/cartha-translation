  text: ἱκανὸς δὲ ⸂κλαυθμὸς ἐγένετο⸃ πάντων, καὶ ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου κατεφίλουν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/037.yaml
  text: And there was much weeping among them all[a], and falling on Paul's neck, they were kissing him affectionately.
translation:
  language: pt
  text: Houve muito choro entre todos e, lançando-se ao pescoço de Paulo, beijavam-no carinhosamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “continuavam a beijá-lo”; o verbo grego no imperfeito pode destacar uma ação repetida ou prolongada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανὸς
  choice: muito
  rationale: Com κλαυθμός, indica grande quantidade ou intensidade; “chorar muito” é natural e preserva a força emocional.
- source_word: κλαυθμὸς ἐγένετο πάντων
  choice: todos começaram a chorar muito
  rationale: Expressa de modo corrente o início do choro coletivo indicado por ἐγένετο e pelo genitivo πάντων, sem a rigidez de “houve choro de todos”.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: lançando-se ao pescoço de Paulo
  rationale: Mantém a imagem física vívida do grego, que descreve um abraço intenso de despedida.
- source_word: κατεφίλουν αὐτόν
  choice: beijavam-no carinhosamente
  rationale: O imperfeito comunica ação contínua ou repetida, enquanto o verbo composto sugere intensidade ou afeição.
- source_word: δὲ ... καὶ
  choice: Então ... e
  rationale: δέ faz a narrativa avançar sem contraste forte; “Então” liga naturalmente este gesto ao contexto imediato.
