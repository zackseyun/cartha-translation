source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: pt
  text: E agora, eis que vou para Jerusalém, constrangido pelo Espírito[a], sem saber o que me acontecerá ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “constrangido em meu espírito”. A expressão grega pode referir-se ao espírito do próprio Paulo ou ao Espírito Santo. Também pode ser entendida como “impelido pelo Espírito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: vejam
  rationale: Mantém a função discursiva de chamar a atenção dos ouvintes e marcar uma transição enfática, em linguagem portuguesa atual.
- source_word: δεδεμένος
  choice: ligado
  rationale: Preserva a metáfora do perfeito passivo de δέω sem explicá-la antecipadamente como mera compulsão ou obrigação.
- source_word: τῷ πνεύματι
  choice: no Espírito
  rationale: Representa de perto a construção dativa e, no texto principal, aponta para o provável referente em Atos, o Espírito Santo, sem explicitar a agência tanto quanto 'pelo Espírito'.
- source_word: πορεύομαι
  choice: vou
  rationale: Forma natural e direta em português para o presente de movimento, adequado à viagem iminente ou em curso.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: o que me acontecerá ali
  rationale: Comunica de modo idiomático as coisas que encontrarão Paulo em Jerusalém, preservando a referência locativa.
- source_word: μὴ εἰδώς
  choice: sem saber
  rationale: Expressa naturalmente a circunstância participial negativa ligada ao sujeito.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Referente e função de τῷ πνεύματι
  choice: O provável referente é o Espírito Santo, traduzido como 'no Espírito'.
  alternative: Pode referir-se ao espírito do próprio Paulo ('em meu espírito') ou enfatizar agência/impulso ('pelo Espírito' ou 'impelido pelo Espírito').
  rationale: O uso de πνεῦμα em Atos e o contexto seguinte favorecem o Espírito Santo, mas a construção grega não elimina as demais possibilidades. A nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Vejam' reproduz oralmente o chamado de atenção de ἰδοὺ; 'ligado no Espírito' conserva a metáfora e a tensão interpretativa, esclarecida em nota.
