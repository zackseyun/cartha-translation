review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente o movimento para Jerusalém e a incerteza de Paulo quanto ao que o aguardará ali. Contudo, “ligado no Espírito” não expressa com clareza, em português atual, a metáfora de δεδεμένος nem a força constrangedora da expressão. “Constrangido pelo Espírito” representa de modo natural o sentido contextual provável, enquanto a nota preserva a ambiguidade do dativo grego.
  naturalness: “Vejam:” é possível, mas “eis que” é um equivalente mais idiomático e digno para ἰδού neste discurso. “Ligado no Espírito” soa pouco natural e pode sugerir mera ligação ou conexão espiritual; “constrangido pelo Espírito” é claro e adequado ao registro.
  terminology: “Espírito” com maiúscula é apropriado para a leitura principal contextual. A nota deve registrar que a expressão também pode apontar para o próprio espírito de Paulo e que a formulação grega admite a ideia de impulso ou constrangimento pelo Espírito.
  issues:
  - severity: medium
    issue: “ligado no Espírito” é uma construção pouco idiomática e semanticamente imprecisa.
    rationale: Em português, “ligado no Espírito” tende a indicar conexão ou afinidade, não alguém sujeito a uma força constrangedora. δεδεμένος, no contexto, requer uma formulação que comunique vínculo/compulsão, sem ocultar a alternativa textual na nota.
  - severity: low
    issue: “Vejam:” é menos adequado que “eis que” para ἰδού.
    rationale: O imperativo plural introduz uma interpelação mais direta aos ouvintes do que a partícula discursiva grega. “Eis que” conserva melhor a transição enfática e o registro do discurso.
  revised_text: E agora, eis que vou para Jerusalém, constrangido pelo Espírito[a], sem saber o que me acontecerá ali.
