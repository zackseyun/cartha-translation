  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: pt
  text: 'Paulo, porém, desceu, lançou-se sobre ele[a] e, abraçando-o, disse: “Não fiquem alarmados[b], pois a vida dele está nele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deitou-se sobre ele”. A expressão descreve a ação física de Paulo e pode recordar atos semelhantes de profetas nas narrativas de restauração à vida.'
    reason: lexical_alternative
  - marker: b
    text: As palavras de Paulo podem indicar tanto que o jovem não estava morto quanto que sua vida havia sido restaurada; a formulação grega não esclarece explicitamente qual das duas possibilidades se aplica.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: desceu
  rationale: O particípio aoristo indica que Paulo desceu até onde estava o jovem; a forma coordenada é natural em português e mantém o sentido direcional.
- source_word: δὲ
  choice: porém
  rationale: Marca uma leve transição com contraste em relação à queda e à aparente morte relatadas no versículo anterior.
- source_word: ἐπέπεσεν αὐτῷ
  choice: lançou-se sobre ele
  rationale: Expressa claramente a ação física e conserva a possível ressonância das narrativas proféticas de restauração, sem tornar a frase artificial.
- source_word: συμπεριλαβὼν
  choice: abraçando-o
  rationale: Comunica a ideia de envolver ou estreitar alguém nos braços de modo conciso e natural.
- source_word: Μὴ θορυβεῖσθε
  choice: Não fiquem alarmados
  rationale: No contexto, refere-se à agitação e consternação dos presentes; esta formulação comunica bem a força emocional e situacional.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: pois a vida dele
  rationale: ψυχή pode significar vida, pessoa ou alma. Como o contexto trata da condição física do jovem, 'vida' é a opção mais adequada e evita impor um sentido antropológico técnico.
- source_word: ἐν αὐτῷ ἐστιν
  choice: está nele
  rationale: Mantém de perto a formulação grega e não decide se a vida permaneceu nele ou se lhe foi restaurada.
theological_decisions:
- issue: Sentido de ψυχή em contexto de vida e morte
  choice: vida
  alternative: alma
  rationale: O contexto imediato trata de saber se Êutico estava morto ou vivo. 'Vida' reflete o uso contextual do termo sem transformar a declaração em uma afirmação doutrinária sobre a alma.
- issue: Se Êutico nunca morreu ou se foi restaurado à vida
  choice: 'A redação principal permanece neutra: “a vida dele está nele”.'
  alternative: Formulações interpretativas como “ele está vivo” ou “a vida voltou a ele”.
  rationale: O grego afirma que a vida está nele, mas não explica explicitamente se ela permanecera presente ou havia sido restaurada. A tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe coordenada evita rigidez excessiva, enquanto “lançou-se sobre ele” preserva a força da ação. Todos os marcadores de nota aparecem no texto principal.
