  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: pt
  text: 'sofrendo sobretudo por causa do que ele havia dito[a]: que não veriam mais o seu rosto[b]. E o acompanharam até o navio[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “por causa da palavra que ele havia dito”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ver o seu rosto”. A expressão pessoal preserva a referência concreta a ele; “não ... mais” indica que não o veriam de novo.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foram com ele até o navio” ou “o escoltaram até o navio”. O verbo pode descrever o acompanhamento de alguém como gesto de despedida e honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: sofrendo
  rationale: O particípio expressa dor emocional intensa. “Sofrendo” é natural em português e mantém a ligação sintática com a causa introduzida em seguida.
- source_word: μάλιστα
  choice: sobretudo
  rationale: Indica a razão principal da tristeza; “sobretudo” é claro, corrente e digno.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: por causa do que ele havia dito
  rationale: Expressa naturalmente em português a relação causal e o valor anterior do mais-que-perfeito εἰρήκει, sem a construção pouco idiomática “por causa da palavra que havia falado”.
- source_word: οὐκέτι μέλλουσιν
  choice: não veriam mais
  rationale: A combinação comunica o futuro visto a partir daquele momento. “Não veriam mais” é natural e preserva οὐκέτι sem reforçá-lo para “nunca mais”.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: veriam mais o seu rosto
  rationale: Mantém a expressão pessoal e vívida “seu rosto”, em vez de reduzi-la a “vê-lo”.
- source_word: προέπεμπον
  choice: o acompanharam
  rationale: No contexto de despedida, o verbo indica acompanhar alguém em sua partida. O pretérito perfeito produz narrativa portuguesa fluente, embora o grego use o imperfeito.
- source_word: εἰς τὸ πλοῖον
  choice: até o navio
  rationale: Com verbo de acompanhamento, “até o navio” comunica idiomaticamente o destino ou limite do percurso; “navio” convém ao contexto marítimo.
