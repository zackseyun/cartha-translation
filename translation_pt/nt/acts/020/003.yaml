id: ACT.20.3
reference: Acts 20:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: pt
  text: Depois de passar três meses ali, quando os judeus[a] tramaram uma conspiração contra ele, estando ele prestes a zarpar para a Síria, Paulo decidiu voltar pela Macedônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Atos, a expressão “os judeus” muitas vezes se refere, conforme o contexto, a um grupo específico que se opunha a Paulo, e não a todo o povo judeu sem distinção.
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Depois de passar três meses ali
  rationale: Com uma expressão de tempo, ποιέω significa idiomaticamente passar determinado período. “Ali” é uma explicitação natural baseada na permanência de Paulo na Grécia, mencionada no versículo anterior.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: quando ... tramaram contra ele
  rationale: O genitivo absoluto exprime a circunstância temporal que levou à mudança de planos. ἐπιβουλή designa uma trama ou conspiração hostil; a formulação verbal é clara e natural em português.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: os judeus
  rationale: Mantém a designação explícita do texto grego, enquanto a nota esclarece que, no contexto, não se trata de uma generalização sobre todo o povo judeu.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: no momento em que estava prestes a partir de navio para a Síria
  rationale: μέλλω comunica iminência, e ἀνάγω, neste contexto de viagem, indica partir por mar. “Para a Síria” expressa naturalmente o destino.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: Paulo decidiu voltar
  rationale: A expressão idiomática indica chegar a uma decisão. O nome “Paulo”, recuperado do contexto, evita uma sequência ambígua de pronomes em português.
- source_word: διὰ Μακεδονίας
  choice: pela Macedônia
  rationale: διά com o genitivo indica a rota pela qual Paulo voltaria; “pela Macedônia” é conciso e idiomático.
theological_decisions:
- issue: Referência a “os judeus” numa narrativa de conflito
  choice: Conservar “os judeus” no texto principal e esclarecer seu alcance contextual em nota.
  alternative: “alguns judeus” ou “adversários judeus”
  rationale: O grego traz explicitamente τῶν Ἰουδαίων. Acrescentar “alguns” ou “adversários” ao texto principal restringiria de modo interpretativo a formulação original; a nota previne, sem alterar o texto, uma generalização étnica indevida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi reorganizada com orações temporais naturais, sem eliminar a relação causal entre a conspiração e a mudança de itinerário.
