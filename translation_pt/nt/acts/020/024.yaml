  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: pt
  text: 'Mas não considero a minha vida preciosa para mim mesmo[a], contanto que eu complete a minha carreira[b] e o ministério que recebi do Senhor Jesus: testemunhar[c] o evangelho da graça de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não considero a minha alma preciosa para mim mesmo”. Aqui, “vida” é preferível porque o contexto trata da disposição de Paulo para enfrentar a morte a fim de completar sua missão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “minha corrida”. A palavra grega pode designar o percurso ou a corrida levada até o fim.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dar testemunho” ou “testemunhar solenemente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: não considero ... preciosa para mim mesmo
  rationale: Reproduz de modo natural o sentido avaliativo da expressão grega e mantém τιμίαν como “preciosa”, sem sugerir que a vida não tenha valor em si, mas que Paulo não a põe acima de sua missão.
- source_word: ψυχήν
  choice: vida
  rationale: No contexto de sofrimento e possível morte, refere-se à vida terrena de Paulo, não especificamente a uma alma imaterial.
- source_word: ὡς τελειῶσαι
  choice: contanto que eu complete
  rationale: Expressa a preocupação dominante de Paulo e preserva a força condensada da construção, sem reduzi-la a uma simples finalidade.
- source_word: δρόμον
  choice: carreira
  rationale: Mantém a metáfora de um percurso, possivelmente atlético, levado até o fim; em português bíblico corrente, “carreira” comunica bem essa imagem.
- source_word: διακονίαν
  choice: ministério
  rationale: Designa o serviço comissionado que Paulo recebeu de Jesus; “ministério” é claro e adequado ao contexto.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: A preposição com genitivo indica a fonte da comissão, preservada naturalmente em português.
- source_word: διαμαρτύρασθαι
  choice: testemunhar
  rationale: Comunica o ato de dar testemunho; a possível nuance de testemunho solene é registrada em nota.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: o evangelho da graça de Deus
  rationale: 'Preserva a cadeia de genitivos e sua abertura semântica: o evangelho pode ser caracterizado pela graça de Deus e também ter essa graça como conteúdo.'
theological_decisions:
- issue: Sentido de ψυχή na descrição de Paulo
  choice: vida
  alternative: alma
  rationale: O contexto trata da disposição de Paulo para enfrentar a morte a fim de cumprir sua missão; “vida” evita introduzir um contraste antropológico entre corpo e alma que o texto não destaca.
- issue: Força de ὡς τελειῶσαι
  choice: contanto que eu complete
  alternative: para que eu complete
  rationale: A construção expressa a condição ou preocupação suprema de Paulo, embora também possa ser entendida em sentido de finalidade; a tradução mantém essa tensão retórica sem acrescentar doutrina.
- issue: Relação em τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: o evangelho da graça de Deus
  alternative: as boas-novas sobre a graça de Deus
  rationale: A formulação genitiva preserva a possibilidade de a graça caracterizar o evangelho e/ou constituir seu conteúdo, sem estreitar a interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a intensidade pessoal da declaração e a metáfora do percurso, evitando tanto literalismo obscuro quanto explicitação teológica excessiva.
