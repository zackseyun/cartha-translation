id: ACT.20.35
reference: Acts 20:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: pt
  text: 'Em tudo mostrei a vocês que, trabalhando arduamente dessa maneira, é necessário ajudar os fracos[a] e lembrar as palavras do Senhor Jesus, que ele mesmo disse: “É mais feliz dar do que receber.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dar apoio aos fracos”. O verbo grego pode indicar assistência contínua, não apenas uma ajuda momentânea.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Em tudo
  rationale: Entendido adverbialmente com ὑπέδειξα, indicando a abrangência do exemplo de Paulo.
- source_word: ὑπέδειξα
  choice: mostrei
  rationale: Expressa mostrar ou demonstrar, inclusive pelo próprio exemplo, sem explicitar além do texto.
- source_word: οὕτως κοπιῶντας
  choice: trabalhando arduamente dessa maneira
  rationale: Preserva tanto a referência ao modo de agir de Paulo quanto a ideia de esforço intenso do particípio κοπιῶντας.
- source_word: δεῖ
  choice: é necessário
  rationale: Mantém a força de necessidade ou obrigação sem acrescentar um sujeito explícito ausente no grego.
- source_word: ἀντιλαμβάνεσθαι
  choice: ajudar
  rationale: Verbo que neste contexto denota prestar auxílio; a possível nuance de apoio continuado é registrada em nota.
- source_word: τῶν ἀσθενούντων
  choice: os fracos
  rationale: Conserva a amplitude semântica do grego, sem restringir a fraqueza ao âmbito físico, econômico ou espiritual.
- source_word: μνημονεύειν τε
  choice: e lembrar
  rationale: Mantém a coordenação com a obrigação anterior de ajudar.
- source_word: τῶν λόγων
  choice: as palavras
  rationale: Tradução direta para as declarações de Jesus aqui recordadas.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Forma natural e dignificada em português para o título e nome.
- source_word: αὐτὸς εἶπεν
  choice: ele mesmo disse
  rationale: Preserva a ênfase do pronome αὐτός na autoria pessoal da declaração.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Há mais felicidade em dar do que em receber
  rationale: Expressa de forma natural a comparação de μακάριον, entendida como estado favorecido ou feliz, sem reduzir a frase a prazer subjetivo.
theological_decisions:
- issue: Alcance de “os fracos”
  choice: Manter a expressão ampla “os fracos”
  alternative: os pobres; os doentes; os espiritualmente fracos
  rationale: ἀσθενούντων é semanticamente amplo, e o contexto não exige que a fraqueza seja limitada a uma única categoria.
- issue: Sentido de μακάριον
  choice: “Há mais felicidade”
  alternative: “É mais bem-aventurado”; “É mais abençoado”
  rationale: A formulação comunica em português corrente o estado favorável indicado por μακάριον e evita sugerir necessariamente uma bênção conferida como ato, embora as alternativas sejam lexicalmente possíveis.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a necessidade expressa por δεῖ, o esforço de κοπιῶντας e a ambiguidade de “os fracos”.
