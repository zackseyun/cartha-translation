  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: pt
  text: Levaram o rapaz vivo e ficaram muito consolados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não moderadamente”; expressão idiomática que significa “muito” ou “grandemente”.
    reason: esclarecimento_idiomático
lexical_decisions:
- source_word: ἤγαγον
  choice: Levaram
  rationale: O aoristo de ἄγω pode significar conduzir, levar ou trazer. Aqui, “levaram” expressa de modo natural que saíram com o rapaz vivo, sem acrescentar detalhes ausentes do texto.
- source_word: παῖδα
  choice: o rapaz
  rationale: παῖς pode designar criança, rapaz ou servo. Neste contexto, refere-se a Êutico, chamado anteriormente de νεανίας (“jovem”); “rapaz” evita a ideia indevida de servidão.
- source_word: ζῶντα
  choice: vivo
  rationale: O particípio descreve o estado do rapaz quando o levaram. “Vivo” é a formulação portuguesa direta e natural neste contexto.
- source_word: παρεκλήθησαν
  choice: ficaram consolados
  rationale: O passivo de παρακαλέω pode indicar consolo ou encorajamento. Diante da queda e da recuperação de Êutico, “consolados” comunica adequadamente o alívio dos presentes.
- source_word: οὐ μετρίως
  choice: muito
  rationale: A expressão é uma lítotes, literalmente “não moderadamente”, com o sentido idiomático de “muito” ou “grandemente”. A tradução comunica sua força com clareza em português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural para brasileiros. A ordem da frase acompanha o fluxo do grego sem conservar uma lítotes que soaria pouco natural em português.
