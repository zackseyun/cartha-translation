id: ACT.20.28
reference: Acts 20:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: pt
  text: Cuidem de vocês mesmos e de todo o rebanho, no qual o Espírito Santo os constituiu supervisores, para pastorearem a igreja de Deus[a], que ele adquiriu por meio do sangue do seu próprio Filho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “a igreja do Senhor” em vez de “a igreja de Deus”.
    reason: textual_variant
  - marker: b
    text: O grego diz literalmente “por meio do sangue do seu próprio”. A expressão pode ser entendida como “do seu próprio Filho”; tradicionalmente, também é traduzida por “com seu próprio sangue”.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Cuidem
  rationale: O imperativo presente pede atenção e vigilância contínuas; “cuidem de vocês mesmos” é natural em português e, no contexto pastoral, abrange tanto atenção quanto zelo.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: todo o rebanho
  rationale: Preserva a metáfora pastoral coletiva e traduz παντί de modo idiomático.
- source_word: ἐν ᾧ
  choice: no qual
  rationale: Mantém de perto a construção grega e apresenta os supervisores como pessoas colocadas dentro do próprio rebanho.
- source_word: ἔθετο
  choice: constituiu
  rationale: Neste contexto, τίθημι indica designação para uma função; “constituiu” comunica essa nomeação sem exigir uma estrutura eclesiástica posterior.
- source_word: ἐπισκόπους
  choice: supervisores
  rationale: Expressa a função de vigilância e direção sem importar automaticamente as conotações posteriores do título “bispos”.
- source_word: ποιμαίνειν
  choice: para pastorearem
  rationale: Conserva a metáfora verbal ligada ao rebanho e comunica cuidado, condução e alimentação pastoral.
- source_word: ἐκκλησίαν
  choice: igreja
  rationale: Aqui designa a comunidade cristã de Deus; “igreja” é a forma estabelecida, clara e corrente.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Segue o texto principal da SBLGNT; a variante “do Senhor” é registrada em nota.
- source_word: περιεποιήσατο
  choice: adquiriu
  rationale: O verbo médio expressa adquirir para si; “adquiriu” preserva esse sentido sem tornar obrigatória a imagem comercial de uma compra.
- source_word: διὰ τοῦ αἵματος
  choice: por meio do sangue
  rationale: διά com genitivo indica meio ou instrumento e conserva a força sacrificial e redentora.
- source_word: τοῦ ἰδίου
  choice: do seu próprio Filho
  rationale: O adjetivo substantivado pode significar “do seu próprio [ente querido]”, normalmente entendido aqui como o Filho. A explicitação produz português natural; a formulação compacta e a leitura tradicional são preservadas em nota.
theological_decisions:
- issue: Referente e força de τοῦ αἵματος τοῦ ἰδίου
  choice: “por meio do sangue do seu próprio Filho” no texto principal
  alternative: “com seu próprio sangue” ou, mais literalmente, “por meio do sangue do seu próprio”
  rationale: A expressão grega é compacta e permite que ἰδίου seja entendido substantivamente, com referência ao Filho. O texto principal explicita o referente mais provável para evitar uma frase incompleta em português, enquanto a nota preserva a literalidade e a tradicional leitura cristológica sem apagar a tensão exegética.
- issue: Variante entre θεοῦ e κυρίου
  choice: “igreja de Deus”
  alternative: “igreja do Senhor”
  rationale: A tradução segue θεοῦ no texto fornecido da SBLGNT e informa a variante manuscrita relevante em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora do rebanho e do pastoreio foi preservada; “supervisores” evita impor ao texto a forma posterior de um ofício eclesiástico. Os marcadores [a] e [b] aparecem no texto principal.
