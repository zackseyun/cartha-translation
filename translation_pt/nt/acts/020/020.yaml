id: ACT.20.20
reference: Acts 20:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: pt
  text: como não me esquivei de anunciar a vocês nada do que era proveitoso e de ensiná-los publicamente e de casa em casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixei de anunciar a vocês nada do que era benéfico”.'
    reason: Alternativa lexical que explicita o resultado de ὑπεστειλάμην e verte συμφερόντων por “benéfico”.
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz, no contexto, o modo como Paulo viveu e serviu entre os ouvintes, ligando naturalmente o versículo à frase anterior.
- source_word: ὑπεστειλάμην
  choice: não me esquivei
  rationale: O médio de ὑποστέλλω pode indicar recuar ou conter-se diante de uma ação. “Não me esquivei” preserva a ideia de não evitar a responsabilidade, em português atual e natural.
- source_word: τῶν συμφερόντων
  choice: nada do que era proveitoso
  rationale: O particípio substantivado designa aquilo que traz benefício ou vantagem. “Proveitoso” mantém o sentido amplo sem introduzir no texto principal uma especificação doutrinária.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: de anunciar
  rationale: Depois de ὑπεστειλάμην, o infinitivo articular com μή expressa aquilo de que Paulo não se retraiu. A construção portuguesa evita reproduzir de modo artificial a dupla negação grega.
- source_word: ἀναγγεῖλαι
  choice: anunciar
  rationale: O verbo significa anunciar, comunicar ou dar a conhecer. “Anunciar” é claro e distingue essa atividade do ensino mencionado em seguida.
- source_word: διδάξαι
  choice: ensinar
  rationale: Tradução direta de διδάσκω. O infinitivo coordenado com “anunciar” reflete os dois atos governados pela mesma afirmação de que Paulo não se esquivou.
- source_word: δημοσίᾳ
  choice: publicamente
  rationale: O advérbio indica atuação em espaços ou contextos públicos; “publicamente” é a equivalência mais direta e natural.
- source_word: κατ’ οἴκους
  choice: de casa em casa
  rationale: κατά com o acusativo plural tem força distributiva. “De casa em casa” preserva a ideia de atuação repetida em diferentes lares.
theological_decisions:
- issue: Sentido de τῶν συμφερόντων
  choice: aquilo que era proveitoso aos ouvintes, sem especificação adicional
  alternative: aquilo que era espiritualmente benéfico
  rationale: O contexto pastoral sugere benefício espiritual, mas a expressão grega é mais ampla. A tradução conserva essa amplitude e evita inserir uma explicação teológica no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma “a vocês” evita regionalismo excessivo; “não me esquivei” conserva a força idiomática do verbo grego sem soar arcaica. O início em minúscula preserva a continuidade sintática com o contexto anterior.
