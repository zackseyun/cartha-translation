id: ACT.20.21
reference: Acts 20:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: pt
  text: testemunhando solenemente tanto a judeus como a gregos sobre o arrependimento para com Deus e a fé em nosso Senhor Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiança em nosso Senhor Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: testemunhando solenemente
  rationale: O particípio expressa testemunho enfático e solene; a formulação preserva tanto o caráter testemunhal quanto sua seriedade.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: tanto a judeus como a gregos
  rationale: Mantém a dupla abrangência da expressão lucana e preserva Ἕλληνες como “gregos”, sem generalizá-lo silenciosamente para “gentios”.
- source_word: μετάνοιαν
  choice: arrependimento
  rationale: É a tradução corrente e teologicamente adequada, abrangendo a mudança interior e a volta moral e espiritual, sem reduzir o termo a mera mudança de opinião.
- source_word: εἰς θεόν
  choice: para com Deus
  rationale: Com μετάνοια, εἰς indica direção ou orientação; “para com Deus” é uma expressão portuguesa natural nesse contexto e mantém a distinção em relação à fé “em” Jesus.
- source_word: πίστιν
  choice: fé
  rationale: Com Jesus explicitamente como objeto, “fé” é a correspondência mais direta e natural; “confiança” permanece uma alternativa lexical válida.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: em nosso Senhor Jesus
  rationale: Com πίστις, εἰς exprime a pessoa em quem a fé é depositada; “em” é a construção idiomática em português, e “Senhor” preserva o peso cristológico de κύριος.
theological_decisions:
- issue: Tradução de πίστις em uma expressão teologicamente relevante
  choice: fé em nosso Senhor Jesus
  alternative: confiança em nosso Senhor Jesus
  rationale: O texto apresenta Jesus diretamente como objeto da πίστις, não uma construção genitiva ambígua. “Fé em” é adequada no texto principal, enquanto “confiança em” explicita a dimensão relacional sem substituir silenciosamente o termo tradicional.
- issue: Relação entre arrependimento e fé
  choice: 'preservar duas expressões coordenadas: arrependimento para com Deus e fé em nosso Senhor Jesus'
  alternative: entender ambas como uma única resposta de conversão
  rationale: A tradução mantém a coordenação e os objetos distintos do grego, sem separar artificialmente nem fundir teologicamente os dois elementos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção participial foi preservada porque o versículo integra uma frase mais ampla no contexto. “Judeus” e “gregos” aparecem em minúsculas conforme o uso ortográfico moderno para gentílicos.
