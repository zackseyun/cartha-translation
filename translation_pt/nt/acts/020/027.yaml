  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: pt
  text: Pois não me esquivei de lhes anunciar todo o propósito de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o conselho de Deus”, “todo o plano de Deus”, “todo o desígnio de Deus” ou “toda a vontade de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa de γάρ, ligando naturalmente esta afirmação ao contexto anterior.
- source_word: οὐ ὑπεστειλάμην
  choice: não deixei de
  rationale: Em português corrente, exprime que Paulo não recuou nem se omitiu diante da tarefa de anunciar, evitando uma formulação pouco natural como “não me retraí de”.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: anunciar
  rationale: O infinitivo articular completa o sentido de ὑπεστειλάμην; “anunciar” comunica com clareza a ação de dar a conhecer publicamente.
- source_word: πᾶσαν τὴν βουλὴν
  choice: todo o propósito
  rationale: πᾶσαν destaca a totalidade, e βουλή pode designar propósito, plano, desígnio ou vontade. “Todo o propósito” é natural e amplo em português, sem reduzir o termo apenas a conselho dado ou a mandamento moral.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz de modo direto o genitivo, indicando que o propósito pertence a Deus ou procede dele.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Representa o dativo dos destinatários e oferece leitura natural, moderna e amplamente compreensível.
theological_decisions:
- issue: Sentido de βουλὴ τοῦ θεοῦ
  choice: todo o propósito de Deus
  alternative: todo o plano de Deus; todo o desígnio de Deus; toda a vontade de Deus
  rationale: βουλή comporta nuances de propósito, plano, desígnio e vontade. “Propósito” preserva amplitude suficiente no texto principal, enquanto a nota registra alternativas legítimas sem decidir entre decreto divino, intenção salvífica e vontade de Deus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Não deixei de anunciar” soa mais natural do que uma reprodução rígida da metáfora grega, embora torne implícita a ideia de não recuar nem se omitir.
