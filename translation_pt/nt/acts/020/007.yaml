source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: pt
  text: No primeiro dia da semana, quando estávamos reunidos para partir o pão[a], Paulo falava com eles; pois estava prestes a partir no dia seguinte, estendeu sua fala até a meia-noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como «para o partir do pão». Pode se referir a uma refeição compartilhada e também pode ter conotações da Ceia do Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: No primeiro dia da semana
  rationale: A expressão é um idiomatismo temporal comum do grego koiné para o primeiro dia da semana; δέ funciona como conectivo leve e não requer uma palavra explícita em português.
- source_word: συνηγμένων ἡμῶν
  choice: quando estávamos reunidos
  rationale: O genitivo absoluto apresenta a circunstância da ação principal e preserva a perspectiva narrativa da primeira pessoa do plural.
- source_word: κλάσαι ἄρτον
  choice: para partir o pão
  rationale: O infinitivo indica propósito. A formulação conserva o idioma bíblico sem decidir se se trata apenas de uma refeição comunitária ou especificamente da Ceia do Senhor.
- source_word: διελέγετο αὐτοῖς
  choice: falava com eles
  rationale: O imperfeito indica ação contínua, e 'com eles' preserva a possível dimensão interativa de διαλέγομαι sem impor a ideia de um sermão estritamente monológico.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: pois partiria no dia seguinte
  rationale: A construção comunica partida iminente e, no contexto, pode explicar por que Paulo estendeu sua fala. O futuro do pretérito é natural em português dentro da narrativa.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: e prolongou a mensagem
  rationale: παρατείνω significa estender ou prolongar, e λόγος aqui designa a fala ou mensagem de Paulo.
- source_word: μέχρι μεσονυκτίου
  choice: até a meia-noite
  rationale: Expressa diretamente o limite temporal da fala de Paulo.
theological_decisions:
- issue: Sentido de 'partir o pão' na reunião cristã
  choice: Manter o idioma 'partir o pão'
  alternative: celebrar a Ceia do Senhor; compartilhar uma refeição
  rationale: Em Atos, a expressão pode abranger uma refeição compartilhada e também ter conotações da Ceia do Senhor. A tradução não resolve uma nuance que o texto deixa aberta.
- issue: Caráter da fala de Paulo
  choice: falava com eles
  alternative: pregava para eles; discursava para eles
  rationale: A escolha preserva a possível reciprocidade de διαλέγομαι e evita caracterizar a reunião de modo mais específico do que o grego permite.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a expressão bíblica 'partir o pão' e a ambiguidade contextual; evita-se linguagem denominacional.
