review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente a cena, a progressão do sono, a fala prolongada de Paulo, a queda do terceiro andar e a afirmação explícita de que Êutico estava morto. Contudo, “foi levantado morto” é enganoso em português, pois pode sugerir que ele foi erguido ou ressuscitado, em vez de ter sido recolhido após a queda.
  naturalness: O português é moderno e claro em geral. “No vão da janela” é uma opção defensável para a posição de Êutico. A principal dificuldade de naturalidade e clareza está em “foi levantado morto”; “foi recolhido morto” expressa melhor o desfecho narrativo em português.
  terminology: “Êutico”, “Paulo”, “sono profundo”, “terceiro andar” e “morto” são adequados. “Morto” preserva corretamente νεκρός sem introduzir a atenuação interpretativa “aparentemente morto”.
  issues:
  - severity: medium
    issue: “Foi levantado morto” para ἤρθη νεκρός
    rationale: Embora αἴρω possa ter o sentido básico de levantar, nesta narrativa passiva descreve naturalmente que Êutico foi apanhado, recolhido ou levado após a queda. Em português, “foi levantado morto” é semanticamente ambíguo e pode sugerir que ele se levantou ou foi ressuscitado. “Foi recolhido morto” preserva o fato de que foi encontrado/apanhado morto sem antecipar o acontecimento do versículo seguinte.
  revised_text: Um jovem chamado Êutico, sentado no vão da janela, foi caindo num sono profundo enquanto Paulo falava longamente. Vencido pelo sono, caiu do terceiro andar e foi recolhido morto.[a]
