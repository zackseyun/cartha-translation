revisions:
- from: Um jovem chamado Êutico, sentado no vão da janela, foi caindo num sono profundo enquanto Paulo falava longamente. Vencido pelo sono, caiu do terceiro andar e foi levantado morto.[a]
  to: Um jovem chamado Êutico, sentado no vão da janela, foi caindo num sono profundo enquanto Paulo falava longamente. Vencido pelo sono, caiu do terceiro andar e foi recolhido morto.[a]
  rationale: A revisão substitui uma formulação portuguesa potencialmente equívoca por “foi recolhido morto”, que corresponde ao uso narrativo contextual de ἤρθη e mantém a declaração inequívoca de νεκρός. A nota foi ajustada para apresentar uma alternativa portuguesa plausível sem sugerir que o sentido relevante seja uma ressurreição ou um simples ato de erguer-se.
  reviewer_model: gpt-5.6-terra
