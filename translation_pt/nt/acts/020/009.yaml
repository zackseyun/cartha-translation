source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: pt
  text: Um jovem chamado Êutico, sentado no vão da janela, foi caindo num sono profundo enquanto Paulo falava longamente. Vencido pelo sono, caiu do terceiro andar e foi recolhido morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi levado morto”. O verbo grego pode significar “recolher” ou “levar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Um jovem... sentado
  rationale: Expressa de modo natural a introdução indefinida e o particípio que descreve a posição contínua de Êutico; omite-se a tradução explícita de τις como “certo” por soar desnecessária em português atual.
- source_word: ὀνόματι Εὔτυχος
  choice: chamado Êutico
  rationale: Forma idiomática em português para a construção grega com ὀνόματι e nome próprio.
- source_word: ἐπὶ τῆς θυρίδος
  choice: no vão da janela
  rationale: Indica a abertura da janela em que ele estava sentado e torna plausível a queda sem acrescentar um parapeito não explicitado.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: foi caindo num sono profundo
  rationale: Preserva o aspecto progressivo e a imagem de ser levado gradualmente pelo sono.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: enquanto Paulo falava longamente
  rationale: Traduz a construção absoluta e o sentido contextual de discurso prolongado, sem impor a ideia de debate formal.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Vencido pelo sono
  rationale: Marca o momento decisivo em que o sono o domina, retomando e intensificando a descrição anterior.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: caiu do terceiro andar
  rationale: Verte τρίστεγον como o terceiro nível do edifício; o próprio verbo “caiu” já comunica adequadamente o movimento para baixo indicado por κάτω.
- source_word: ἤρθη νεκρός
  choice: foi levantado morto
  rationale: Mantém a voz passiva e o sentido básico de αἴρω, sem suavizar νεκρός; a nota registra uma alternativa contextual natural.
theological_decisions:
- issue: Se νεκρός deve ser suavizado como “aparentemente morto”
  choice: morto
  alternative: aparentemente morto
  rationale: O grego afirma diretamente νεκρός, sem qualquer marcador de aparência ou incerteza. A tradução preserva a declaração narrativa e sua tensão com o que acontece em seguida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vão da janela” esclarece a posição sem excesso explicativo; “falava longamente” conserva o tom narrativo e a duração indicada no grego.
