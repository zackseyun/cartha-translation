id: ACT.20.6
reference: Acts 20:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: pt
  text: Nós, porém, partimos de Filipos de navio depois dos dias dos Pães sem Fermento e, em cinco dias, chegamos até eles em Trôade, onde ficamos sete dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: partimos de navio
  rationale: O verbo ἐκπλέω indica partir navegando. A expressão é natural em português e explicita o meio marítimo sem perder a ideia de partida.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: depois dos dias dos Pães sem Fermento
  rationale: Preserva a formulação temporal do grego e emprega uma designação clara e corrente para o período festivo judaico, sem acrescentar explicitamente 'Festa', ausente no texto.
- source_word: ἀπὸ Φιλίππων
  choice: de Filipos
  rationale: A preposição ἀπό marca o ponto de partida; 'de Filipos' é a forma portuguesa convencional do topônimo e da construção.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: chegamos até eles
  rationale: A combinação de ἔρχομαι com πρός expressa movimento em direção às pessoas mencionadas. 'Chegamos até eles' soa natural no relato de viagem e não acrescenta a noção interpretativa de 'nos reunimos'.
- source_word: εἰς τὴν Τρῳάδα
  choice: em Trôade
  rationale: Com 'chegamos até eles', a localização do destino é expressa naturalmente em português por 'em Trôade'.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: em cinco dias
  rationale: ἄχρι com a medida temporal assinala a duração da viagem até a chegada. 'Em cinco dias' comunica essa duração de modo idiomático, sem sugerir necessariamente que a partida só ocorreu após cinco dias.
- source_word: οὗ
  choice: onde
  rationale: O advérbio relativo retoma Trôade; 'onde' reproduz de forma direta e natural essa referência locativa.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: ficamos sete dias
  rationale: Neste contexto de viagem, διατρίβω significa permanecer ou passar tempo em um lugar. 'Ficamos sete dias' é claro e idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A ordem narrativa e as durações foram preservadas; evitou-se inserir informação não expressa, como chamar explicitamente o período de 'Festa'.
