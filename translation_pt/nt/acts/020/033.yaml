lexical_decisions:
- source_word: ἀργυρίου
  choice: a prata
  rationale: Preserva o sentido concreto de “prata” e o paralelismo com ouro e roupas, todos bens materiais valiosos.
- source_word: χρυσίου
  choice: o ouro
  rationale: Tradução direta do substantivo, coordenado com prata e roupas como objeto da cobiça negada por Paulo.
- source_word: ἱματισμοῦ
  choice: as roupas
  rationale: Expressão natural e atual para vestimentas, sem o tom menos corrente de “vestes”.
- source_word: οὐδενὸς
  choice: de ninguém
  rationale: Explicita de modo idiomático em português que os bens mencionados pertenciam a outras pessoas.
- source_word: ἐπεθύμησα
  choice: cobicei
  rationale: No contexto da defesa da integridade de Paulo, comunica o sentido moralmente negativo de desejar bens alheios.
- source_word: ἢ ... ἢ ... ἢ
  choice: a prata, o ouro nem as roupas
  rationale: Após a negação verbal, a coordenação com vírgula e “nem” é natural em português e conserva os três elementos distintos da lista.
theological_decisions:
- issue: Nuance moral de ἐπιθυμέω em relação aos bens materiais
  choice: Traduzir por “cobicei”, com sentido ético negativo.
  alternative: “desejei”
  rationale: O contexto apresenta a defesa de Paulo contra a ganância e trata do desejo por posses alheias. “Cobicei” preserva essa força provável sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação evita arcaísmos e mantém a concretude da lista grega.
