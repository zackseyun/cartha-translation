id: ACT.20.25
reference: Acts 20:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: pt
  text: E agora, vejam, eu sei que nenhum de vocês, entre os quais andei proclamando o Reino, verá novamente o meu rosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: vejam
  rationale: Mantém a função discursiva de chamar a atenção, em linguagem atual e natural, sem o tom arcaico de “eis”.
- source_word: διῆλθον
  choice: passei
  rationale: Expressa o movimento de Paulo entre aquelas pessoas; “andei” também seria possível, mas “passei” acompanha de perto o sentido contextual.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Preserva a ideia de anúncio público e autorizado, própria do verbo grego.
- source_word: τὴν βασιλείαν
  choice: o Reino
  rationale: Traduz literalmente o objeto definido sem acrescentar “de Deus”, expressão compreensível pelo contexto, mas ausente no texto grego desta edição.
- source_word: ὄψεσθε τὸ πρόσωπόν μου
  choice: verá novamente o meu rosto
  rationale: Conserva a expressão semítica concreta “ver o meu rosto”; “novamente” transmite οὐκέτι de modo idiomático em português.
theological_decisions:
- issue: Identidade do Reino
  choice: o Reino
  alternative: o Reino de Deus
  rationale: O SBLGNT traz apenas τὴν βασιλείαν. A tradução não explicita um complemento teologicamente evidente, mas textualmente ausente.
- issue: Alcance de πάντες com a negação
  choice: nenhum de vocês
  alternative: todos vocês não verão
  rationale: Em português, “nenhum de vocês” comunica com clareza o alcance natural da negação sobre o grupo inteiro, sem sugerir uma negação parcial ambígua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” representa o plural dirigido aos ouvintes; “vocês” evita regionalismo excessivo e mantém naturalidade contemporânea.
