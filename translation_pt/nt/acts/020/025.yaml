  source_fidelity: A tradução transmite corretamente a certeza de Paulo e o alcance coletivo da negação em «nenhum de vocês». «O Reino» preserva com acerto a ausência de um complemento explícito no grego. Contudo, «passei entre os quais» é menos preciso e pode sugerir simplesmente uma passagem, enquanto διῆλθον no contexto descreve a atividade itinerante de Paulo entre eles.
