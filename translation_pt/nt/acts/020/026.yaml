  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: pt
  text: Por isso, hoje declaro solenemente a vocês que sou inocente do sangue de todos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpo do sangue de todos”; a expressão grega significa estar livre de culpa ou responsabilidade com respeito a outros.
    reason: lexical_alternative
  - marker: b
    text: Esta linguagem provavelmente evoca a figura do sentinela em Ezequiel e sua responsabilidade por culpa de sangue (por exemplo, Ez 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Por isso
  rationale: Expressa naturalmente a conclusão que Paulo tira do contexto anterior, sem impor o sentido causal mais estreito de “porque”.
- source_word: μαρτύρομαι
  choice: declaro solenemente
  rationale: Comunica o caráter pessoal, enfático e quase forense do verbo médio, em português corrente e digno.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Reproduz o objeto indireto sem acrescentar uma nuance pública ou judicial não exigida pelo dativo.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: hoje
  rationale: É a forma natural em português para a expressão temporal, enquanto a solenidade é preservada pelo verbo “declaro solenemente”.
- source_word: ὅτι
  choice: que
  rationale: Introduz de modo direto o conteúdo da declaração.
- source_word: καθαρός εἰμι
  choice: sou inocente
  rationale: No idioma ligado ao sangue, καθαρός indica estar livre de culpa ou responsabilidade; “inocente” transmite esse valor melhor que o literal “limpo” no texto principal.
- source_word: ἀπὸ τοῦ αἵματος
  choice: do sangue
  rationale: Preserva o idioma bíblico de culpa de sangue e sua provável ressonância com a figura do sentinela em Ezequiel.
- source_word: πάντων
  choice: de todos
  rationale: Mantém a formulação ampla e concisa do genitivo plural, sem explicitar além do grego “todas as pessoas”.
theological_decisions:
- issue: Sentido de “inocente do sangue de todos”
  choice: Idioma que expressa estar livre de culpa ou responsabilidade pela perdição de outros, porque Paulo cumpriu seu dever de anunciar e advertir.
  alternative: Referência mais estreita à ausência de envolvimento na morte física de alguém.
  rationale: O contexto imediato trata da fidelidade de Paulo em proclamar toda a vontade de Deus, e a expressão provavelmente evoca a responsabilidade do sentinela em Ezequiel. O texto preserva a imagem de sangue em vez de substituí-la por uma explicação.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. “Declaro solenemente” conserva a força testemunhal do verbo; “hoje” evita uma construção temporal artificial. A expressão bíblica “inocente do sangue de todos” foi mantida, com esclarecimento em nota.
