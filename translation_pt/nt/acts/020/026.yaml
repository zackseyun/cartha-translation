  source_fidelity: A tradução preserva adequadamente a progressão inferencial de διότι («Por isso»), o caráter solene e testemunhal de μαρτύρομαι («declaro solenemente»), o marco temporal («hoje») e o idiomatismo de inocência perante «o sangue de todos». «Sou inocente do sangue de todos» mantém a imagem deliberadamente forte do grego sem reduzir o enunciado a uma paráfrase explicativa.
