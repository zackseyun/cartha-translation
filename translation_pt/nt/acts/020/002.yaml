base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: pt
  text: Depois de percorrer aquelas regiões e de encorajá-los com muitas palavras[a], chegou à Grécia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «longamente» ou «com muita exortação»; o grego diz literalmente «com muita palavra».
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Depois de percorrer
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A formulação preserva essa sequência e expressa naturalmente a ideia de viajar por toda uma área.
- source_word: τὰ μέρη ἐκεῖνα
  choice: aquelas regiões
  rationale: μέρη pode designar partes, áreas ou regiões; aqui, o contexto geográfico favorece «regiões».
- source_word: παρακαλέσας
  choice: de encorajá-los
  rationale: παρακαλέω pode significar encorajar, exortar ou consolar. No contexto das visitas de Paulo aos discípulos, «encorajar» mantém a amplitude pastoral do termo sem limitá-lo a uma advertência.
- source_word: αὐτοὺς
  choice: -los
  rationale: O pronome retoma os discípulos ou fiéis das regiões mencionadas no contexto.
- source_word: λόγῳ πολλῷ
  choice: com muitas palavras
  rationale: A expressão significa literalmente «com muita palavra/fala». A tradução conserva a forma marcante do grego, enquanto a nota registra sentidos idiomáticos possíveis.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: chegou à Grécia
  rationale: A construção descreve o movimento de Paulo para a Grécia. «Chegou à» é natural em português e comunica claramente a chegada ao destino.
- source_word: δὲ
  choice: Depois de
  rationale: δέ é um conectivo leve; seu valor de transição é absorvido naturalmente pela oração temporal formada com o particípio anterior.
