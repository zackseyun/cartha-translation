reference: Acts 20:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: pt
  text: E agora eu os confio a Deus e à palavra da sua graça[a], que é capaz de edificar e dar a herança entre todos os que foram santificados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que é capaz”, referindo-se principalmente a Deus, e não à “palavra da sua graça”.'
    reason: Leitura alternativa permitida pela sintaxe grega quanto ao referente de τῷ δυναμένῳ.
lexical_decisions:
- source_word: παρατίθεμαι
  choice: eu os entrego
  rationale: O médio expressa colocar os ouvintes sob o cuidado de outro. “Entrego” é natural em português e, com o complemento “a Deus”, comunica confiar alguém aos seus cuidados.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo indica aquele a quem Paulo entrega os ouvintes.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: à palavra da sua graça
  rationale: Preserva a estrutura genitiva e o peso teológico de λόγος, que neste contexto pode designar a palavra ou mensagem proclamada.
- source_word: τῷ δυναμένῳ
  choice: que é capaz
  rationale: O particípio dativo singular pode retomar “a palavra da sua graça” ou, alternativamente, Deus. O texto principal mantém como referente o antecedente imediato, sem eliminar a outra leitura, registrada em nota.
- source_word: οἰκοδομῆσαι
  choice: edificar
  rationale: Mantém a metáfora de construção usada para o fortalecimento e crescimento espiritual. O objeto pode ser entendido pelo contexto, sem precisar ser acrescentado.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: dar a herança
  rationale: Reproduz diretamente o verbo e seu objeto, deixando implícito, como no grego, quem recebe a herança.
- source_word: κληρονομίαν
  choice: a herança
  rationale: É a correspondência corrente e preserva as ressonâncias bíblico-teológicas da porção concedida por Deus.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: entre todos os que foram santificados
  rationale: A forma verbal conserva o particípio perfeito passivo, indicando uma ação realizada com resultado presente; “entre” expressa naturalmente o sentido associativo ou distributivo de ἐν.
theological_decisions:
- issue: Referente de τῷ δυναμένῳ (“o que/aquele que é capaz”)
  choice: 'No texto principal, a expressão retoma “a palavra da sua graça”: “que é capaz”.'
  alternative: 'A expressão pode referir-se principalmente a Deus: “que é capaz”, com Deus como antecedente.'
  rationale: A sintaxe admite ambas as leituras. “A palavra da sua graça” é o antecedente imediato, e a Escritura pode apresentar a palavra proclamada como eficaz; por outro lado, Deus pode ser entendido como o agente pessoal que edifica e concede a herança. A nota preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém proximidade formal com o grego sem recorrer a linguagem excessivamente arcaica; a nota explicita a ambiguidade sintática e teológica real.
