  naturalness: “Eu os confio a Deus” é idiomático, claro e de registro digno em português moderno. A frase permanece fluente e conserva a concisão do original.
  terminology: '“Palavra da sua graça”, “herança” e “santificados” são escolhas adequadas e consistentes com o vocabulário bíblico. A nota atual, porém, formula de modo inadequado a alternativa: ela parece reordenar os complementos da oração, em vez de apenas indicar o referente alternativo de “que é capaz”.'
