  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: pt
  text: 'Quando chegaram até ele, Paulo lhes disse: “Vocês mesmos sabem como vivi entre vocês[a] durante todo o tempo, desde o primeiro dia em que pisei na Ásia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como estive com vocês durante todo o tempo”. A expressão grega pode destacar tanto a maneira de viver de Paulo como sua presença contínua entre eles.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Ásia” se refere à província romana da Ásia, situada no oeste da Ásia Menor, e não ao continente moderno.
    reason: cultural_note
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: chegaram até ele
  rationale: Expressa de modo natural o movimento dos anciãos em direção a Paulo e sua chegada à presença dele.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Vocês mesmos sabem
  rationale: O pronome grego explícito é enfático; “vocês mesmos” conserva essa ênfase em português corrente.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς
  choice: desde o primeiro dia em que
  rationale: Marca claramente o ponto inicial do período mencionado por Paulo.
- source_word: ἐπέβην εἰς τὴν Ἀσίαν
  choice: pus os pés na Ásia
  rationale: Preserva a imagem vívida de ἐπιβαίνω e soa idiomático em português.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: como vivi entre vocês durante todo o tempo
  rationale: “Vivi entre vocês” comunica naturalmente a maneira de vida de Paulo no meio da comunidade, enquanto “durante todo o tempo” preserva a duração contínua.
theological_decisions:
- issue: Sentido de ἐγενόμην com μεθ’ ὑμῶν
  choice: como vivi entre vocês
  alternative: como estive com vocês
  rationale: O contexto favorece uma referência à conduta ou maneira de vida de Paulo, mas a formulação grega também pode destacar sua presença contínua; a alternativa é registrada sem eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O nome “Paulo” explicita o referente de “ele” na segunda oração para evitar uma sequência pronominal ambígua em português. A ambiguidade lexical de ἐγενόμην é preservada na documentação da decisão tradutória.
