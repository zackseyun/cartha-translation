  source_fidelity: 'A tradução reproduz adequadamente a sequência participial e verbal do grego: subida, partir o pão, comer, conversar longamente até a aurora e partir. «Subiu» é fiel a ἀναβὰς e, à luz do contexto, não exige explicitar «ao andar de cima» nem «voltou a subir». «Partiu o pão» preserva o artigo e não resolve a possível conotação eucarística. «Comeu» é uma boa contextualização de γευσάμενος. A omissão explícita de οὕτως é aceitável em português, pois a progressão narrativa comunica a conclusão.'
  naturalness: O texto é fluente, moderno e apropriado para português internacional com boa legibilidade brasileira. «Foi embora» é natural, embora um pouco mais coloquial que «partiu»; ainda assim, permanece digno e adequado ao registro narrativo.
