  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: pt
  text: Então subiu, partiu o pão e comeu. Depois de conversar por muito tempo, até o amanhecer, foi embora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβὰς
  choice: subiu
  rationale: O particípio aoristo de ἀναβαίνω indica movimento para cima; no contexto, Paulo retorna ao aposento superior depois de ter descido. “Subiu” é natural e não acrescenta ao texto grego a ideia explícita de “voltar”.
- source_word: κλάσας τὸν ἄρτον
  choice: partiu o pão
  rationale: Reproduz a ação concreta e o artigo definido do grego, sem decidir se se trata apenas de uma refeição compartilhada ou também da Ceia do Senhor.
- source_word: γευσάμενος
  choice: comeu
  rationale: Embora γεύομαι possa significar “provar”, em contexto de refeição pode designar comer ou tomar alimento. “Comeu” comunica o sentido natural sem sugerir indevidamente uma prova mínima ou cerimonial.
- source_word: ἐφ’ ἱκανόν
  choice: por muito tempo
  rationale: A expressão indica duração considerável; esta formulação é clara e corrente em português.
- source_word: ὁμιλήσας
  choice: depois de conversar
  rationale: ὁμιλέω sugere fala ou conversa prolongada. “Conversar” preserva melhor o caráter interativo do termo do que uma formulação que implicasse necessariamente um discurso formal.
- source_word: ἄχρι αὐγῆς
  choice: até o amanhecer
  rationale: αὐγή designa a aurora ou o romper do dia; “amanhecer” é idiomático e preciso.
- source_word: οὕτως ἐξῆλθεν
  choice: foi embora
  rationale: Expressa de modo natural o desfecho narrativo. A sequência marcada por οὕτως é comunicada pela ordem das ações, sem a rigidez de “assim saiu”.
theological_decisions:
- issue: Se κλάσας τὸν ἄρτον é uma referência explícita à Ceia do Senhor
  choice: 'Tradução neutra: “partiu o pão”'
  alternative: Explicitar “celebrou a Ceia do Senhor” ou entender apenas como refeição comum
  rationale: A expressão pode ter associações eucarísticas em Atos, mas o versículo não exige inequivocamente essa identificação. A tradução conserva a formulação concreta e a tensão interpretativa sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para tornar clara a sequência de ações. Não se acrescentaram notas porque a tradução direta preserva a ambiguidade relevante sem exigir explicação textual.
