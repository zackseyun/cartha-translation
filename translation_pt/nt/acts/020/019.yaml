source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: pt
  text: servindo ao Senhor com toda a humildade, com lágrimas e com provações que me sobrevieram por causa das ciladas dos judeus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tentações” ou “testes”; aqui, o sentido é de provações externas decorrentes da oposição.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as ciladas de adversários judeus específicos contra Paulo, e não uma afirmação a respeito de todos os judeus.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: servindo
  rationale: O particípio presente descreve a maneira contínua como Paulo exercia seu ministério. “Servindo” é natural em português e preserva a ideia de serviço dedicado, sem enfatizar indevidamente a condição de escravo.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Mantém o título grego sem explicitar além do texto a identidade do referente, embora no contexto de Atos ele seja naturalmente entendido como o Senhor Jesus.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: com toda a humildade
  rationale: Expressa a circunstância ou maneira e conserva a força abrangente de πάσης em português corrente e digno.
- source_word: δακρύων
  choice: lágrimas
  rationale: Preserva literalmente o substantivo concreto no plural e a intensidade emocional do discurso de Paulo.
- source_word: πειρασμῶν
  choice: provações
  rationale: Neste contexto, designa adversidades externas ligadas à oposição e às ciladas, e não atração interior ao pecado.
- source_word: τῶν συμβάντων μοι
  choice: que me sobrevieram
  rationale: A oração relativa identifica as provações como acontecimentos que atingiram Paulo. “Sobrevieram” preserva esse sentido com concisão e dignidade.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: por causa das ciladas
  rationale: ἐν admite aqui valor circunstancial ou causal-instrumental. A formulação comunica com clareza que as ciladas deram origem às provações, sem excluir a ideia de que ocorreram nesse contexto.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: É a correspondência direta do plural grego. O contexto limita a referência aos judeus envolvidos nas ciladas contra Paulo, sem autorizar a substituição por “líderes judeus” nem uma generalização sobre todo o povo judeu.
theological_decisions:
- issue: Possível leitura antijudaica de “dos judeus”
  choice: Manter “dos judeus” no texto, entendendo a expressão contextualmente como referência aos adversários judeus específicos que tramavam contra Paulo.
  alternative: dos líderes judeus; dos judeus da Judeia
  rationale: O grego diz explicitamente τῶν Ἰουδαίων e não restringe lexicalmente o grupo a líderes ou judeus da Judeia. A nota impede uma generalização indevida sem modificar o que o texto afirma.
- issue: Sentido de πειρασμῶν
  choice: provações
  alternative: tentações; testes
  rationale: As ciladas hostis mencionadas no próprio versículo apontam para sofrimentos e adversidades externos. A nota preserva a amplitude lexical possível sem introduzir a ideia de tentação ao pecado no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “com” organiza naturalmente as circunstâncias do serviço de Paulo. “Sobrevieram” é ligeiramente elevado, mas corrente em registro bíblico e mais preciso que uma formulação pesada como “aconteceram comigo”.
