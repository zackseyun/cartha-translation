  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: pt
  text: Nós, porém, tendo ido adiante ao navio, partimos rumo a Assos, para de lá levar Paulo a bordo; pois assim ele havia determinado, pois ele mesmo pretendia seguir por terra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim havia sido combinado”. A forma grega é passiva, embora o contexto provavelmente se refira ao que Paulo havia combinado ou determinado anteriormente.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pretendia ir a pé”. O verbo grego contrasta especificamente o percurso por terra com a viagem do grupo de navio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: fomos na frente
  rationale: O particípio aoristo indica ação anterior à partida e distingue o grupo do narrador de Paulo, que seguiria por terra.
- source_word: ἐπὶ τὸ πλοῖον
  choice: até o navio
  rationale: Com verbo de movimento, a expressão pode indicar ida ao navio ou embarque; a formulação natural em português deixa o embarque implícito na partida subsequente.
- source_word: ἀνήχθημεν
  choice: partimos
  rationale: No contexto náutico, o verbo significa fazer-se ao mar ou zarpar. 'Partimos rumo a' é claro e natural, embora menos marcadamente náutico.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: rumo a Assos
  rationale: Expressa o destino da viagem marítima, preservando a transliteração convencional do topônimo.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: com a intenção de receber Paulo a bordo
  rationale: μέλλω exprime intenção, e ἀναλαμβάνω, neste contexto, significa acolher ou levar alguém no navio.
- source_word: ἐκεῖθεν
  choice: ali
  rationale: Embora a forma possa ser traduzida literalmente por 'de lá', em português 'receber ... a bordo ali' comunica com naturalidade que o embarque ocorreria em Assos.
- source_word: διατεταγμένος ἦν
  choice: Ele havia combinado assim
  rationale: A construção perifrástica passiva aponta para um arranjo anterior. O contexto favorece Paulo como referente, sem apagar em nota a possibilidade formal impessoal/passiva.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: pois pretendia seguir por terra
  rationale: πεζεύω contrasta o deslocamento terrestre de Paulo com a viagem marítima do grupo. O pronome enfático é suficientemente indicado pelo sujeito expresso e pelo contraste contextual.
- source_word: δὲ
  choice: porém
  rationale: Marca o contraste moderado entre o grupo do narrador e Paulo sem sugerir oposição forte.
theological_decisions: []
