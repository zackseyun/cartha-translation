  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: pt
  text: Quando se encontrou conosco em Assos[a], nós o recebemos a bordo e fomos para Mitilene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se juntou a nós em Assos” ou “reuniu-se conosco em Assos”. O verbo grego pode indicar encontrar-se ou reunir-se; aqui, o sentido é que Paulo se juntou ao grupo naquele lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: se encontrou
  rationale: No contexto da viagem, o verbo indica que Paulo se reuniu com o grupo em Assos. “Encontrou-se conosco” é natural em português e não acrescenta a ideia mais específica de um encontro previamente combinado.
- source_word: ἡμῖν
  choice: conosco
  rationale: O dativo plural refere-se ao grupo que viajava de navio e se encaixa naturalmente na construção portuguesa “encontrou-se conosco”.
- source_word: εἰς τὴν Ἆσσον
  choice: em Assos
  rationale: Embora εἰς seja normalmente direcional, com um verbo de encontro o português idiomático localiza o encontro “em Assos”.
- source_word: ἀναλαβόντες
  choice: o recebemos a bordo
  rationale: No contexto náutico, o particípio descreve o ato de acolher Paulo no navio. A formulação torna claro o cenário sem introduzir informação alheia ao contexto.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma Paulo, identificado no contexto anterior.
- source_word: ἤλθομεν
  choice: fomos
  rationale: Em narrativa de deslocamento, “fomos” é a forma portuguesa mais natural a partir da perspectiva do grupo, preservando o valor simples do aoristo.
- source_word: εἰς Μιτυλήνην
  choice: para Mitilene
  rationale: Tradução direcional idiomática da preposição com o nome do destino.
