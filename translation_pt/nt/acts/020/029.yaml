  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: pt
  text: Sei que, depois da minha partida[b], lobos ferozes[a] entrarão entre vocês, sem poupar o rebanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lobos cruéis”. O adjetivo grego pode transmitir a ideia de dureza, opressão ou violência.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “depois da minha chegada” ou “depois da minha vinda”; neste contexto, o sentido é “depois da minha partida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Sei
  rationale: Expressa conhecimento seguro de Paulo, e não mera opinião; “sei” é a forma mais direta e natural em português.
- source_word: εἰσελεύσονται
  choice: entrarão
  rationale: O futuro de εἰσέρχομαι indica entrada na comunidade; “entrarão” preserva de modo claro esse movimento.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: depois da minha partida
  rationale: Embora ἄφιξις normalmente denote chegada ou vinda, o contexto aponta para o período posterior à saída de Paulo. A nota preserva a dificuldade lexical do original.
- source_word: λύκοι βαρεῖς
  choice: lobos ferozes
  rationale: βαρεῖς tem sentido literal de “pesados”, mas aqui comunica severidade, dureza ou violência. “Ferozes” combina naturalmente com a metáfora dos lobos sem identificar de forma indevidamente estreita quem eles representam.
- source_word: εἰς ὑμᾶς
  choice: no meio de vocês
  rationale: A preposição indica intrusão na comunidade. A expressão é natural em português e mantém a imagem de lobos entrando no rebanho.
- source_word: μὴ φειδόμενοι
  choice: sem poupar
  rationale: Mantém de forma concisa a ideia de ação implacável e permanece próxima da construção participial grega.
- source_word: τοῦ ποιμνίου
  choice: o rebanho
  rationale: Preserva a metáfora pastoral aplicada à comunidade e se harmoniza com a imagem dos lobos.
theological_decisions:
- issue: Força metafórica de “lobos”
  choice: Manter “lobos ferozes” no texto principal.
  alternative: Explicitar como “falsos mestres”, “homens destruidores” ou “perseguidores”.
  rationale: O versículo não identifica expressamente os lobos. Preservar a metáfora mantém sua força retórica e evita restringir sua referência a uma única interpretação.
- issue: Sentido contextual de ἄφιξις
  choice: Traduzir como “partida”, com nota indicando o sentido lexical literal.
  alternative: Traduzir como “chegada” ou “vinda”.
  rationale: O discurso trata do que ocorrerá quando Paulo já não estiver presente. “Partida” comunica esse sentido contextual, enquanto a nota conserva a tensão com o valor lexical mais comum do substantivo grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o plural de ὑμᾶς sem regionalismo excessivo; a ordem da frase foi ajustada para fluidez natural, preservando as metáforas e a dificuldade lexical do original.
