  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: pt
  text: Vocês mesmos sabem que estas mãos atenderam às minhas necessidades e às dos que estavam comigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «supriram as minhas necessidades e as dos que estavam comigo». O verbo grego pode destacar o serviço prático que resultava em sustento material.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: vocês mesmos
  rationale: Preserva a ênfase do pronome nominativo expresso junto ao verbo, em português moderno e amplamente compreensível.
- source_word: γινώσκετε
  choice: sabem
  rationale: O presente do indicativo expressa o conhecimento direto que os ouvintes tinham da conduta de Paulo.
- source_word: ταῖς χρείαις μου
  choice: às minhas necessidades
  rationale: χρεία designa necessidades práticas; esta formulação é natural e mantém o sentido material sugerido pelo contexto.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: às dos que estavam comigo
  rationale: Retoma elipticamente «necessidades» e traduz o particípio substantivado sem definir além do texto a relação dessas pessoas com Paulo.
- source_word: ὑπηρέτησαν
  choice: serviram
  rationale: Mantém a imagem vívida das mãos prestando serviço, sem restringir no texto principal o verbo ao sentido interpretativo de sustento material.
- source_word: αἱ χεῖρες αὗται
  choice: estas mãos
  rationale: Reproduz diretamente a construção demonstrativa enfática e a referência de Paulo ao próprio trabalho manual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A construção «às dos que» evita repetição pesada, mas deixa claro que as mãos de Paulo atenderam tanto às necessidades dele quanto às das pessoas que estavam com ele.
