- from: E dentre vocês mesmos surgirão homens que falarão coisas distorcidas, a fim de arrastar os discípulos atrás de si.[a]
  to: E dentre vocês mesmos surgirão homens que falarão coisas distorcidas[a], a fim de desviar os discípulos para que os sigam.
  rationale: A revisão substitui a expressão espacialmente ambígua “atrás de si” por uma construção portuguesa atual que conserva o objetivo dos homens de obter seguidores. “Desviar” expressa de modo natural o afastamento implicado por ἀποσπᾶν, e “para que os sigam” traduz o valor de ὀπίσω ἑαυτῶν. O marcador foi movido para junto do termo objeto da nota.
  reviewer_model: gpt-5.6-terra
