review_pass:
  verdict: revise
  source_fidelity: A redação preserva adequadamente a origem interna da ameaça (ἐξ ὑμῶν αὐτῶν), o referente masculino de ἄνδρες, a fala de conteúdo distorcido e a finalidade expressa por τοῦ + infinitivo. Contudo, “atrás de si” é pouco idiomático no português atual nesse contexto e pode sugerir posição física, em vez de adesão pessoal. A revisão explicita o sentido de seguirem esses homens, inerente a ὀπίσω ἑαυτῶν.
  naturalness: “Dentre vocês mesmos surgirão homens” e “coisas distorcidas” são naturais e claras. A formulação revista torna a oração final mais idiomática para leitores lusófonos, sem perder a imagem de desvio.
  terminology: “Homens” traduz precisamente ἄνδρες; “discípulos” mantém o uso estabelecido em Atos. “Coisas distorcidas” é uma boa opção ampla para διεστραμμένα. A nota lexical deve ficar ancorada imediatamente após essa expressão.
  issues:
  - severity: low
    issue: “atrás de si” é ambíguo e pouco natural neste contexto.
    rationale: ὀπίσω ἑαυτῶν é um idioma de lealdade ou seguimento. Em português moderno, “para que os sigam” comunica esse valor com clareza; “atrás de si” pode ser entendido espacialmente.
  - severity: low
    issue: O marcador da nota está distante da expressão a que se refere.
    rationale: A nota oferece alternativas para “coisas distorcidas”; deve ser colocada logo após essa expressão para uma ancoragem inequívoca.
  revised_text: E dentre vocês mesmos surgirão homens que falarão coisas distorcidas[a], a fim de desviar os discípulos para que os sigam.
