source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: pt
  text: E dentre vocês mesmos surgirão homens que falarão coisas distorcidas[a], a fim de desviar os discípulos para que os sigam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas perversas” ou “coisas deturpadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: dentre vocês mesmos
  rationale: Preserva a ênfase de que a ameaça surgirá de dentro da própria comunidade, em português natural e amplamente compreensível.
- source_word: ἀναστήσονται
  choice: surgirão
  rationale: Expressa o sentido idiomático futuro de homens que se levantarão ou aparecerão no meio da comunidade, sem acrescentar interpretação.
- source_word: ἄνδρες
  choice: homens
  rationale: Mantém o sentido especificamente masculino de ἀνήρ.
- source_word: λαλοῦντες
  choice: que falarão
  rationale: A oração relativa soa mais natural em português do que um particípio literal e preserva a atividade verbal atribuída a esses homens.
- source_word: διεστραμμένα
  choice: coisas distorcidas
  rationale: Comunica ideias desviadas ou deturpadas sem restringir a advertência apenas à perversidade moral.
- source_word: τοῦ ἀποσπᾶν
  choice: a fim de arrastar
  rationale: Preserva tanto a finalidade do infinitivo articular quanto a força da imagem de puxar pessoas para longe.
- source_word: τοὺς μαθητὰς
  choice: os discípulos
  rationale: Mantém o termo estabelecido em Atos para os seguidores de Jesus.
- source_word: ὀπίσω ἑαυτῶν
  choice: atrás de si
  rationale: Conserva o idioma de seguir alguém e indica que esses homens procuram formar um grupo de seguidores em torno de si mesmos.
theological_decisions:
- issue: Natureza da fala dos falsos mestres
  choice: coisas distorcidas
  alternative: coisas perversas; coisas deturpadas
  rationale: O texto denuncia um desvio amplo, possivelmente doutrinário e moral, sem identificar uma heresia específica; a formulação preserva essa abrangência.
- issue: Representação de gênero em ἄνδρες
  choice: homens
  alternative: pessoas
  rationale: O substantivo grego é especificamente masculino, por isso a tradução não o neutraliza.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. “Dentre vocês mesmos” mantém a ênfase interna; “a fim de” marca claramente a finalidade. O marcador [a] foi colocado após a oração, embora a nota se refira especificamente a “coisas distorcidas”.
