  text: E, depois de dizer essas coisas, ele se ajoelhou com todos eles e orou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Depois de
  rationale: A coordenação grega introduz a ação seguinte; em português, a sequência temporal já é expressa naturalmente pela construção participial traduzida como “Depois de dizer”, sem necessidade de um “E” inicial.
- source_word: ταῦτα εἰπὼν
  choice: Depois de dizer essas coisas
  rationale: O particípio aoristo exprime uma ação anterior à oração; esta formulação preserva a sequência e soa natural em português atual.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ele se ajoelhou
  rationale: A expressão, literalmente relacionada a pôr os joelhos, é idiomática para ajoelhar-se. A tradução comunica o gesto sem sugerir uma queda brusca.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: com todos eles
  rationale: σύν com o dativo indica companhia, e πᾶσιν enfatiza que todo o grupo participou.
- source_word: προσηύξατο
  choice: orou
  rationale: É o verbo grego comum para orar; “orou” é direto, digno e natural.
