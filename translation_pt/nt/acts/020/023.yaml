id: ACT.20.23
reference: Acts 20:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: pt
  text: exceto que o Espírito Santo me dá testemunho, de cidade em cidade[a], dizendo que correntes[b] e aflições me aguardam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em cada cidade”. A expressão grega é distributiva e indica um testemunho repetido em cidades sucessivas.
    reason: lexical_alternative
  - marker: b
    text: Ou “prisões”. O termo grego designa literalmente amarras ou correntes e, por extensão, o aprisionamento.
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos apresentam pequena diferença na posição ou presença de “me” junto a “aflições”; o sentido continua sendo que correntes e aflições aguardam Paulo.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: exceto que
  rationale: Introduz a única ressalva ao que Paulo declarou no versículo anterior e preserva a força exceptiva da expressão grega.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma corrente, clara e digna em português para a expressão definida que designa o Espírito divino.
- source_word: κατὰ πόλιν
  choice: de cidade em cidade
  rationale: Reproduz naturalmente o valor distributivo de κατά com substantivo singular, indicando testemunhos repetidos em cidades sucessivas sem afirmar de modo rígido que isso ocorreu em absolutamente todas.
- source_word: διαμαρτύρεταί μοι
  choice: me dá testemunho
  rationale: Preserva a ideia de testemunho enfático dirigido a Paulo. Evita 'me adverte', que restringiria interpretativamente o sentido à advertência.
- source_word: λέγον
  choice: dizendo
  rationale: Introduz de maneira direta o conteúdo do testemunho do Espírito e mantém a forma participial do grego.
- source_word: δεσμὰ
  choice: correntes
  rationale: Conserva a imagem concreta de amarras físicas, embora o termo possa, por extensão, indicar prisão.
- source_word: θλίψεις
  choice: aflições
  rationale: Expressa pressões e sofrimentos graves com linguagem atual e digna, sem a possível especialização de 'tribulações'.
- source_word: με
  choice: me
  rationale: Representa o pronome acusativo presente no texto impresso e explicita que as correntes e aflições aguardam Paulo.
- source_word: μένουσιν
  choice: aguardam
  rationale: Comunica de modo idiomático que essas experiências estão reservadas para Paulo no futuro.
theological_decisions:
- issue: Referência de “o Espírito Santo”
  choice: Agente divino pessoal que dá testemunho a Paulo
  alternative: Uma influência espiritual impessoal
  rationale: O texto atribui ao Espírito Santo o ato de testemunhar e dizer algo, apresentando-o com agência pessoal, sem exigir que a tradução acrescente formulações doutrinárias não expressas no versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível. “Me dá testemunho” mantém o sentido jurídico e solene do verbo sem soar arcaico; “de cidade em cidade” comunica com clareza a repetição distributiva.
