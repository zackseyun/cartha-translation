source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: pt
  text: Pois Paulo havia decidido navegar passando por Éfeso, para não se demorar na Ásia[a], pois se apressava para, se possível, estar em Jerusalém no dia de Pentecostes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Ásia” se refere à província romana da Ásia, no oeste da Ásia Menor, e não ao continente moderno.
    reason: cultural_note
  - marker: b
    text: 'Ou: “chegar a Jerusalém no dia de Pentecostes”. A expressão grega pode destacar tanto estar presente ali nesse dia como chegar ali nessa ocasião.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: havia decidido
  rationale: O mais-que-perfeito grego indica uma decisão já tomada antes do trecho narrado; “havia decidido” expressa isso de modo natural.
- source_word: παραπλεῦσαι
  choice: passar ao largo de
  rationale: Preserva a ideia de passar por Éfeso navegando sem fazer escala, em português corrente e digno.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: para não ter de gastar tempo
  rationale: Reproduz naturalmente a construção idiomática e o propósito de evitar uma demora, sem sugerir necessariamente que Paulo seria detido por terceiros.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: na Ásia
  rationale: Mantém o nome geográfico conciso do texto; uma nota esclarece que se trata da província romana.
- source_word: ἔσπευδεν
  choice: estava com pressa
  rationale: O imperfeito descreve a pressa contínua de Paulo durante a viagem; a expressão é clara e idiomática.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: se possível
  rationale: Expressa de forma concisa a contingência presente no idioma grego.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: no dia de Pentecostes
  rationale: Mantém a referência temporal e o nome tradicionalmente reconhecido da festa.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: estar em Jerusalém
  rationale: Comunica naturalmente o objetivo de encontrar-se em Jerusalém nessa ocasião, preservando em nota a possibilidade de a expressão destacar a chegada.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: πεντηκοστῆς
  choice: Pentecostes
  rationale: Nome estabelecido e amplamente reconhecido da festa no português bíblico moderno.
