  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: pt
  text: De Mileto, mandou a Éfeso chamar os presbíteros da igreja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandou chamar de Éfeso os presbíteros da igreja”. O grego combina o envio a Éfeso com o ato de mandar chamar os presbíteros, sem especificar se enviou uma mensagem ou mensageiros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: De Mileto
  rationale: ἀπό com o genitivo indica o ponto de partida. O δέ é um conectivo leve e pode ficar implícito numa formulação portuguesa fluente, sem criar contraste indevido.
- source_word: πέμψας εἰς Ἔφεσον
  choice: ele mandou uma mensagem a Éfeso
  rationale: O particípio aoristo indica que Paulo enviou a Éfeso uma comunicação ou mensageiros. A explicitação de 'uma mensagem' evita sugerir que ele próprio foi enviado, embora o objeto permaneça implícito no grego.
- source_word: μετεκαλέσατο
  choice: chamando
  rationale: O verbo na voz média significa mandar chamar ou convocar alguém para junto de si. 'Chamando', ligado ao envio da mensagem, comunica isso naturalmente sem o tom potencialmente coercitivo de 'convocando'.
- source_word: τοὺς πρεσβυτέρους
  choice: os presbíteros
  rationale: No contexto de Atos, o termo designa líderes reconhecidos da comunidade cristã, não apenas homens idosos. 'Presbíteros' é corrente em português bíblico e não determina por si só uma estrutura denominacional posterior.
- source_word: τῆς ἐκκλησίας
  choice: da igreja
  rationale: Em Lucas–Atos, ἐκκλησία normalmente designa a comunidade cristã. 'Igreja' é a forma natural e estabelecida em português.
theological_decisions:
- issue: Sentido de πρεσβυτέρους no contexto eclesial
  choice: líderes da igreja designados como 'presbíteros'
  alternative: anciãos da igreja; homens mais velhos da comunidade
  rationale: O contexto apresenta representantes reconhecidos da igreja de Éfeso. A tradução preserva a função eclesial sem impor uma forma posterior específica de governo da igreja.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação torna explícita a comunicação implícita no ato de enviar, enquanto a nota preserva uma tradução mais compacta e formal.
