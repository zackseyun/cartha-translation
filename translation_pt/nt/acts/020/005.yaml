lexical_decisions:
- source_word: οὗτοι
  choice: Estes
  rationale: O pronome demonstrativo masculino plural retoma naturalmente os companheiros mencionados no contexto anterior; em português, “estes” preserva a referência sem precisar acrescentar “homens”.
- source_word: δὲ
  choice: —
  rationale: δέ é um conectivo leve. Aqui, a transição fica natural em português sem uma conjunção expressa.
- source_word: προσελθόντες
  choice: foram adiante
  rationale: Neste contexto de viagem, o particípio indica que o grupo se adiantou em relação ao narrador e seus companheiros. “Foram adiante” comunica isso com clareza e naturalidade.
- source_word: ἔμενον
  choice: ficaram nos esperando
  rationale: O imperfeito indica uma situação contínua; com ἡμᾶς neste contexto, μένω tem o sentido contextual de permanecer à espera da chegada de alguém. A formulação também mantém perceptível a ideia básica de permanência.
- source_word: ἡμᾶς
  choice: nos
  rationale: Pronome da primeira pessoa do plural em função de objeto, expresso de modo idiomático antes do gerúndio.
- source_word: ἐν Τρῳάδι
  choice: em Trôade
  rationale: Tradução locativa direta de ἐν com o nome geográfico no dativo, usando a forma portuguesa tradicional “Trôade”.
