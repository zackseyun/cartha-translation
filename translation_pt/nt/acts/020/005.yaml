  text: Estes foram adiante e ficaram à nossa espera em Trôade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Estes, tendo ido adiante, permaneciam à nossa espera em Trôade.”'
