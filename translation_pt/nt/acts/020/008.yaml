  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: pt
  text: Havia muitas lâmpadas na sala do andar superior onde estávamos reunidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tochas». O termo grego pode designar, de modo mais amplo, luzes portáteis, mas, neste ambiente interno, «lâmpadas» é mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não explicitado
  rationale: Conectivo leve; em português, o fluxo narrativo é natural sem acrescentar «ora» ou sugerir contraste forte.
- source_word: λαμπάδες
  choice: lâmpadas
  rationale: O termo pode designar lâmpadas ou tochas; no ambiente interno de um cenáculo, «lâmpadas» é a opção contextual mais provável.
- source_word: ἱκαναὶ
  choice: muitas
  rationale: Aqui o adjetivo indica uma quantidade considerável e modifica «lâmpadas»; «muitas» é claro e idiomático.
- source_word: ὑπερῴῳ
  choice: cenáculo
  rationale: Designa uma sala na parte superior da casa. «Cenáculo» é uma designação bíblica conhecida em português e permanece compreensível no registro digno da tradução.
- source_word: οὗ
  choice: onde
  rationale: Traduz naturalmente a referência relativa de lugar.
- source_word: συνηγμένοι
  choice: reunidos
  rationale: O particípio perfeito passivo apresenta o grupo no estado resultante de ter se ajuntado; «estávamos reunidos» preserva esse sentido de modo natural.
- source_word: ἦσαν ... ἦμεν
  choice: havia ... estávamos
  rationale: Os dois imperfeitos descrevem a cena em andamento no passado; essas formas são naturais em português.
