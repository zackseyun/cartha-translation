id: ACT.20.31
reference: Acts 20:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: pt
  text: Por isso, mantenham-se vigilantes, lembrando-se de que, durante três anos, noite e dia, não parei de advertir[a] cada um, com lágrimas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “admoestar”. O verbo grego pode indicar tanto orientação corretiva quanto advertência.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Marca a conclusão decorrente da advertência anterior, de modo natural e claro em português.
- source_word: γρηγορεῖτε
  choice: mantenham-se vigilantes
  rationale: O imperativo presente comunica vigilância contínua; a formulação preserva essa duração sem exigir uma tradução literal ligada a estar acordado.
- source_word: μνημονεύοντες
  choice: lembrando-se
  rationale: Mantém a forma participial e liga a vigilância à recordação do exemplo de Paulo.
- source_word: ὅτι
  choice: de que
  rationale: Introduz naturalmente, em português, o conteúdo daquilo que os ouvintes devem lembrar.
- source_word: τριετίαν
  choice: durante três anos
  rationale: Expressa com clareza o acusativo de extensão temporal.
- source_word: νύκτα καὶ ἡμέραν
  choice: noite e dia
  rationale: Preserva a ordem grega e o sentido de atividade constante.
- source_word: οὐκ ἐπαυσάμην
  choice: não parei
  rationale: Formulação idiomática moderna que comunica que Paulo não interrompeu essa atividade.
- source_word: μετὰ δακρύων
  choice: com lágrimas
  rationale: Preserva de maneira concisa a ideia de acompanhamento e a intensidade emocional do ministério de Paulo.
- source_word: νουθετῶν
  choice: advertir
  rationale: Comunica instrução corretiva e alerta moral em português corrente; a nota registra uma alternativa de tom mais formal.
- source_word: ἕνα ἕκαστον
  choice: cada um
  rationale: Conserva a ênfase distributiva no cuidado dirigido individualmente a cada pessoa, sem acrescentar um complemento ausente do grego.
theological_decisions:
- issue: Força pastoral de νουθετῶν
  choice: advertir
  alternative: admoestar
  rationale: “Advertir” preserva o elemento de alerta e correção pessoal sem reduzir a ação a mera transmissão de informação. “Admoestar” abrange nuance semelhante, mas é menos comum no português atual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem “noite e dia” acompanha o grego. O marcador da nota foi colocado junto de “advertir”, termo ao qual a alternativa lexical se refere.
