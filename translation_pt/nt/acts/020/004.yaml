base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: pt
  text: Acompanhava-o Sópatro, filho de Pirro, bereano; dentre os tessalonicenses, Aristarco e Segundo[a]; Gaio, de Derbe, e Timóteo; e, da Ásia, Tíquico e Trófimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “dentre os tessalonicenses”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, da província romana da Ásia, não do continente moderno.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο δὲ αὐτῷ
  choice: Acompanhavam-no
  rationale: O imperfeito de συνέπομαι descreve quem seguia viagem com Paulo. O plural é natural em português porque o restante do versículo enumera todos os acompanhantes, e o pronome mantém a referência contextual sem inserir o nome de Paulo no texto.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sópatro, filho de Pirro, de Bereia
  rationale: O genitivo Πύρρου é entendido naturalmente como patronímico, enquanto Βεροιαῖος indica a procedência de Bereia.
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: Aristarco e Segundo, de Tessalônica
  rationale: O genitivo plural Θεσσαλονικέων agrupa os dois homens como pertencentes ao povo de Tessalônica. A formulação geográfica é mais natural em português, e a nota preserva a expressão mais literal.
- source_word: Γάϊος Δερβαῖος καὶ Τιμόθεος
  choice: Gaio, de Derbe, e Timóteo
  rationale: Δερβαῖος é um qualificativo geográfico aplicado a Gaio; 'de Derbe' é a forma portuguesa corrente.
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: Tíquico e Trófimo, da Ásia
  rationale: Ἀσιανοί identifica os dois como provenientes da Ásia, aqui a província romana. A nota evita a leitura anacrônica como referência ao continente moderno.
- source_word: δέ ... δέ ... δέ
  choice: pontuação coordenativa e repetição de «e»
  rationale: As ocorrências sucessivas de δέ acrescentam grupos à lista. Em português, ponto e vírgula e conjunções coordenativas preservam essa estrutura sem tornar a frase artificial.
