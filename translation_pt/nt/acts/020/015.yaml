base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: pt
  text: E, depois de zarparmos dali, no dia seguinte chegamos em frente a Quios[a]; no dia seguinte, fizemos escala em Samos[b]; e, no dia seguinte, chegamos a Mileto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante de Quios” ou “ao largo de Quios”. O grego indica uma posição em frente da ilha, não necessariamente um desembarque nela.
    reason: lexical_alternative
  - marker: b
    text: Ou “aportamos em Samos”. O verbo é um termo náutico para aproximar ou encostar a embarcação e pode indicar uma parada.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν ἀποπλεύσαντες
  choice: E, partindo dali
  rationale: A forma κἀκεῖθεν reúne καί e ἐκεῖθεν, preservados por “E” e “dali”; o particípio aoristo ἀποπλεύσαντες é expresso naturalmente como circunstância temporal, mantendo o sentido náutico da partida.
- source_word: τῇ ἐπιούσῃ
  choice: no dia seguinte
  rationale: Expressão temporal no dativo que indica o dia imediatamente posterior.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: chegamos diante de Quios
  rationale: καταντάω descreve a chegada ou alcance de um ponto no itinerário, enquanto ἄντικρυς situa o navio em frente à ilha, sem afirmar desembarque.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: no outro dia
  rationale: A expressão assinala a etapa seguinte na sequência dos dias; “no outro dia” é corrente e evita repetição excessiva.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: aportamos em Samos
  rationale: No contexto náutico, παραβάλλω indica aproximar a embarcação, aportar ou fazer escala; “aportamos” comunica esse movimento sem afirmar quanto tempo durou a parada.
- source_word: τῇ δὲ ἐχομένῃ
  choice: no dia seguinte
  rationale: O particípio substantivado indica o dia que vem logo depois na sequência narrativa.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: chegamos a Mileto
  rationale: Em narrativa de viagem, ἔρχομαι com εἰς pode ser vertido naturalmente como chegada ao destino.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Quios / Samos / Mileto
  rationale: Empregam-se as formas portuguesas tradicionais e reconhecíveis desses topônimos gregos.
