  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: pt
  text: Depois que o tumulto cessou, Paulo mandou chamar os discípulos e, depois de encorajá-los e de se despedir deles,[a] partiu para a Macedônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de saudá-los”. O verbo grego pode indicar tanto uma saudação como, em um contexto de partida, uma despedida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: Depois que o tumulto cessou
  rationale: 'A construção com μετά e infinitivo articular estabelece uma relação temporal: a ação seguinte ocorreu após o fim do tumulto. “Tumulto” expressa adequadamente a agitação pública do contexto.'
- source_word: μεταπεμψάμενος
  choice: mandou chamar
  rationale: O particípio médio indica que Paulo enviou alguém para chamar os discípulos até ele. “Mandou chamar” é natural e preciso em português.
- source_word: τοὺς μαθητὰς
  choice: os discípulos
  rationale: Preserva o termo habitual de Lucas para os seguidores de Jesus, sem ampliá-lo para o sentido mais genérico de “crentes”.
- source_word: παρακαλέσας
  choice: depois de encorajá-los
  rationale: παρακαλέω pode envolver exortação, consolo ou ânimo. Neste contexto de despedida após um tumulto, “encorajar” mantém a amplitude pastoral do verbo sem especificar em excesso.
- source_word: ἀσπασάμενος
  choice: de se despedir deles
  rationale: Embora o verbo costume significar “saudar”, em um contexto de partida pode designar o ato de despedir-se. A escolha comunica naturalmente a força contextual, enquanto a nota preserva a alternativa lexical.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: partiu para a Macedônia
  rationale: A combinação apresenta a saída de Paulo com a finalidade ou direção da viagem. “Partiu para a Macedônia” reproduz o sentido de modo conciso e idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa e as relações temporais do grego foram preservadas, evitando formalismo excessivo. A ambiguidade de ἀσπάζομαι foi mantida por meio de nota.
