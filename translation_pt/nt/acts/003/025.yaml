id: ACT.3.25
reference: Acts 3:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: pt
  text: 'Vocês são os filhos dos profetas e da aliança que Deus estabeleceu com os seus antepassados[a], dizendo a Abraão: “E em sua descendência[b] serão abençoadas todas as famílias da terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pais”; aqui, refere-se aos antepassados do povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “semente”. O termo grego pode designar coletivamente os descendentes de Abraão e também admitir um sentido singular representativo.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: filhos
  rationale: Mantém o masculino plural do grego e sua força de pertencimento e herança no contexto da aliança; a nota esclarece que a expressão abrange os participantes e herdeiros das promessas.
- source_word: προφητῶν
  choice: dos profetas
  rationale: Reproduz diretamente o genitivo; a expressão indica os que pertencem à herança das promessas proféticas, não necessariamente descendência biológica.
- source_word: διαθήκης
  choice: aliança
  rationale: É o termo português natural e biblicamente apropriado para o compromisso estabelecido por Deus com Abraão e os antepassados.
- source_word: διέθετο ὁ θεὸς
  choice: Deus estabeleceu
  rationale: No contexto de διαθήκη, o verbo significa estabelecer ou firmar uma aliança; “estabeleceu” é claro e digno em português atual.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: com os seus antepassados
  rationale: “Com” expressa naturalmente a relação envolvida no estabelecimento da aliança; “antepassados” comunica o sentido contextual de πατέρες sem sugerir apenas pais imediatos.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: quando disse a Abraão
  rationale: Converte o particípio em oração temporal natural, preservando sua função de introduzir as palavras da aliança.
- source_word: σπέρματί
  choice: descendência
  rationale: Conserva a possibilidade coletiva do termo e também sua abertura a um representante singular, evitando decidir no texto principal entre esses sentidos.
- source_word: ἐνευλογηθήσονται
  choice: serão abençoadas
  rationale: Traduz diretamente o futuro passivo e preserva a formulação promissória.
- source_word: πατριαὶ
  choice: famílias
  rationale: É o equivalente português mais natural para grupos familiares ou clãs e se ajusta ao alcance universal da promessa.
- source_word: γῆς
  choice: terra
  rationale: O contexto universal da promessa favorece “terra” no sentido do mundo habitado, e não de uma região delimitada.
theological_decisions:
- issue: Masculino representativo em υἱοὶ
  choice: filhos
  alternative: descendentes; herdeiros; filhos e filhas
  rationale: “Filhos” preserva a forma masculina e a linguagem de herança da aliança. A nota explicita o alcance representativo sem neutralizar o texto principal.
- issue: Amplitude semântica de σπέρμα
  choice: descendência
  alternative: semente; descendente
  rationale: “Descendência” mantém a referência coletiva natural e não exclui a possibilidade de um representante singular no desenvolvimento bíblico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” e “seus” para discurso plural natural; conserva a linguagem pactual e registra em notas as ambiguidades relevantes.
