  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: pt
  text: E todos os profetas, desde Samuel e os que vieram depois dele[a], todos os que falaram, também anunciaram estes dias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que se seguiram” ou “os que vieram em sucessão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estes tempos”. “Anunciaram” também pode ser traduzido por “proclamaram” ou, de modo mais interpretativo, “predisseram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: E todos os profetas
  rationale: δέ tem aqui força conectiva leve; “E” mantém a ligação com o contexto sem criar um contraste inexistente.
- source_word: ἀπὸ Σαμουὴλ
  choice: desde Samuel
  rationale: ἀπό marca Samuel como ponto inicial da sequência profética; “desde” expressa isso naturalmente em português.
- source_word: τῶν καθεξῆς
  choice: os que vieram depois dele
  rationale: καθεξῆς indica ordem ou sucessão; a formulação explicita de modo natural a referência aos profetas posteriores a Samuel.
- source_word: ὅσοι ἐλάλησαν
  choice: todos os que falaram
  rationale: ὅσοι tem alcance inclusivo e quantitativo; esta formulação é mais idiomática em português do que “quantos falaram”, sem restringir o sentido.
- source_word: καὶ κατήγγειλαν
  choice: também anunciaram
  rationale: καταγγέλλω significa anunciar ou proclamar; “anunciaram” preserva o sentido básico sem acrescentar explicitamente a ideia interpretativa de predição.
- source_word: τὰς ἡμέρας ταύτας
  choice: estes dias
  rationale: Tradução direta da expressão temporal, preservando sua referência contextual ao período presente de cumprimento no discurso de Pedro.
theological_decisions:
- issue: Referência profética ao momento presente do cumprimento
  choice: estes dias
  alternative: estes tempos
  rationale: A expressão provavelmente aponta para o período de cumprimento messiânico anunciado por Pedro, mas a tradução mantém a imagem temporal do grego sem explicitar além do texto sua dimensão escatológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas emprega formas idiomáticas como “todos os que falaram”. O texto preserva “anunciaram” em vez de tornar explícita a noção de predição.
