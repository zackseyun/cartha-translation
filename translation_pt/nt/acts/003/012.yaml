source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: pt
  text: 'Ao ver isso, Pedro se dirigiu ao povo: “Homens de Israel, por que vocês se admiram com isso? Ou por que nos encaram[a], como se, por nosso próprio poder ou devoção[b], tivéssemos feito este homem andar?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “olham fixamente para nós”. O verbo indica um olhar fixo ou prolongado.
    reason: lexical_alternative
  - marker: b
    text: Ou “piedade”. Pedro nega que a cura do homem tenha resultado da própria religiosidade ou qualidade espiritual dos apóstolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Ao ver isso, Pedro
  rationale: O particípio aoristo ἰδών é expresso como ação temporal anterior à fala. “Isso” explicita de modo natural o objeto subentendido pelo contexto, isto é, a reação da multidão ao homem curado; δέ marca a transição do relato para a resposta de Pedro.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: se dirigiu ao povo
  rationale: Embora ἀποκρίνομαι possa significar “responder”, aqui não há pergunta verbal anterior; Pedro reage à situação. “Se dirigiu ao povo” transmite naturalmente essa função discursiva.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  rationale: Preserva o vocativo masculino explícito ἄνδρες e reproduz em português corrente e digno a forma pública de tratamento.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: por que vocês se admiram com isso?
  rationale: θαυμάζω expressa admiração ou espanto diante do acontecimento. A formulação é clara no português moderno e mantém a referência de ἐπὶ τούτῳ à cura.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: E por que nos encaram
  rationale: ἀτενίζω indica olhar fixo ou prolongado. “Encaram” transmite essa intensidade sem linguagem técnica; “E” liga naturalmente as duas perguntas, onde ἤ introduz a segunda alternativa retórica.
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: como se, por nosso próprio poder
  rationale: ὡς introduz a suposição equivocada que Pedro rejeita, e ἰδίᾳ salienta que o poder seria próprio dos apóstolos.
- source_word: εὐσεβείᾳ
  choice: devoção
  rationale: εὐσέβεια designa reverência, piedade ou devoção religiosa. “Devoção” é natural e compreensível, preservando o sentido religioso sem sugerir uma categoria doutrinária posterior.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: tivéssemos feito este homem andar
  rationale: O particípio perfeito apresenta o resultado consumado que a multidão poderia atribuir aos apóstolos. O mais-que-perfeito do subjuntivo se ajusta à construção portuguesa com “como se”; “este homem” torna explícito o referente de αὐτόν sem ambiguidade.
theological_decisions:
- issue: Se εὐσεβείᾳ deve sugerir que o milagre decorreu de mérito espiritual apostólico
  choice: devoção
  alternative: piedade
  rationale: Pedro nega explicitamente que a cura tenha vindo de uma qualidade religiosa própria dos apóstolos. “Devoção” conserva a dimensão religiosa do termo, sem acrescentar uma doutrina posterior sobre mérito.
- issue: Tratamento masculino em Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  alternative: Israelitas
  rationale: A tradução preserva o vocativo masculino presente no grego, sem afirmar que todo o público fosse necessariamente composto apenas de homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada ao uso natural do português, sem eliminar a força das perguntas retóricas nem a negação de causalidade apostólica.
