source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: pt
  text: E reconheceram que este era o homem que costumava sentar-se à Porta Formosa do templo[a] para pedir esmolas. E ficaram cheios de assombro e perplexidade diante do que lhe havia acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por «templo» refere-se ao complexo do templo em geral, e não especificamente ao santuário interior.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: reconheceram
  rationale: O imperfeito descreve o reconhecimento que se dava entre as pessoas presentes; em narrativa, o pretérito perfeito é a forma mais natural em português para apresentar essa identificação.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ é um conectivo leve que dá continuidade à narrativa, sem contraste forte.
- source_word: οὗτος ἦν
  choice: ele era
  rationale: Identifica enfaticamente o homem curado como o mesmo homem conhecido pelo povo; em português, «ele era o homem» preserva a identificação de modo natural.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: o homem que costumava ficar sentado ... pedindo esmolas
  rationale: A expressão substantivada descreve a prática habitual do homem. «Costumava ficar sentado» explicita esse valor contextual, enquanto «pedindo esmolas» comunica naturalmente a finalidade indicada por πρὸς τὴν ἐλεημοσύνην.
- source_word: ἐλεημοσύνην
  choice: esmolas
  rationale: Designa concretamente as dádivas oferecidas aos pobres; o plural é a forma idiomática em português na expressão «pedir esmolas».
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: junto ao Portão Formoso
  rationale: A preposição indica o local onde ele se sentava. «Portão Formoso» conserva a designação tradicional e funciona naturalmente como nome próprio.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν designa o complexo do templo, não especificamente o santuário interior; «templo» é a tradução corrente, com esclarecimento em nota.
- source_word: ἐπλήσθησαν
  choice: ficaram cheios
  rationale: Preserva a imagem passiva de serem tomados por estados emocionais, em construção clara e natural.
- source_word: θάμβους
  choice: assombro
  rationale: Expressa admiração intensa e atônita, mantendo distinção em relação ao termo seguinte.
- source_word: ἐκστάσεως
  choice: perplexidade
  rationale: No contexto, indica ficar fora de si ou profundamente desconcertado, não êxtase místico. «Perplexidade» mantém a força sem sugerir experiência religiosa extática.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: diante do que lhe havia acontecido
  rationale: O particípio perfeito aponta para um acontecimento passado cujos efeitos permaneciam evidentes; «havia acontecido» expressa essa anterioridade com naturalidade.
