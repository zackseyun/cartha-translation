  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: pt
  text: Ele lhes deu atenção[a], esperando receber deles alguma coisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fixou neles o olhar” ou “olhou atentamente para eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ele
  rationale: O pronome retoma o homem que não podia andar; δέ funciona aqui como conectivo narrativo leve e não precisa ser expresso separadamente em português.
- source_word: ἐπεῖχεν
  choice: deu atenção
  rationale: No contexto, o verbo indica dirigir e manter a atenção voltada para alguém. A forma verbal imperfeita sugere atenção contínua, transmitida naturalmente pela construção no contexto narrativo.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome se refere a Pedro e João e se integra de modo idiomático à expressão portuguesa “dar atenção a alguém”.
- source_word: προσδοκῶν
  choice: esperando
  rationale: O particípio expressa a expectativa que acompanhava a atenção do homem.
- source_word: τι
  choice: alguma coisa
  rationale: Mantém o objeto indefinido e positivo, sem explicitar que se tratava de esmola, algo apenas inferido do contexto.
- source_word: παρ’ αὐτῶν
  choice: deles
  rationale: παρά com o genitivo indica a fonte daquilo que ele esperava receber.
- source_word: λαβεῖν
  choice: receber
  rationale: O infinitivo descreve o conteúdo da expectativa e se ajusta naturalmente ao contexto de alguém que aguarda uma dádiva.
