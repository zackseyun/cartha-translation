  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: pt
  text: Primeiro a vocês, Deus, tendo levantado[a] o seu Servo[b], enviou-o para abençoá-los, ao desviar cada um de vocês de suas maldades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tendo levantado” também pode significar “tendo suscitado” ou “tendo constituído” o seu Servo, e não necessariamente “tendo-o ressuscitado dentre os mortos”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seu filho” ou “sua criança”. O grego παῖς pode significar “servo” ou “filho/criança”, mas “Servo” provavelmente reflete o pano de fundo do Servo de Isaías.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: Primeiro a vocês
  rationale: Preserva a prioridade dirigida ao público judeu de Pedro e a força dativa de destinatário, em formulação natural em português.
- source_word: ἀναστήσας
  choice: tendo levantado
  rationale: Mantém a ambiguidade do grego entre levantar/suscitar o Servo e ressuscitá-lo, sem decidir no texto principal entre essas possibilidades.
- source_word: τὸν παῖδα αὐτοῦ
  choice: o seu Servo
  rationale: “Servo” corresponde melhor ao provável pano de fundo do Servo de Isaías; a inicial maiúscula sinaliza o título cristológico sem substituir o termo por “Filho”.
- source_word: ἀπέστειλεν αὐτόν
  choice: enviou-o
  rationale: Tradução direta e idiomática, que conserva a ação de Deus e seu objeto sem acrescentar a noção mais específica de comissionamento.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: para abençoá-los
  rationale: Expressa em português corrente a finalidade ou o resultado associado ao envio.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: fazendo com que cada um de vocês se afaste
  rationale: Comunica o meio pelo qual a bênção ocorre e preserva a força distributiva de ἕκαστον. A construção não força a conclusão de que “vocês” seja objeto direto de “converter”, questão explicada em nota.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: de suas maldades
  rationale: O plural indica manifestações ou práticas concretas do mal. “Maldades” conserva esse plural e evita restringir o sentido apenas a atos isolados.
theological_decisions:
- issue: Sentido de ἀναστήσας com referência a Jesus
  choice: tendo levantado
  alternative: tendo ressuscitado dentre os mortos; tendo suscitado ou constituído
  rationale: O verbo admite associação com a ressurreição, mas também pode evocar Deus suscitando o profeta ou Servo prometido. A tradução preserva essa tensão.
- issue: Nuance cristológica de παῖς
  choice: Servo
  alternative: servo; criança; filho
  rationale: “Servo” preserva melhor a alusão provável a Isaías e não introduz “Filho”, que corresponderia a uma formulação grega mais explícita e diferente.
- issue: Agência no afastamento do mal
  choice: fazendo com que cada um de vocês se afaste
  alternative: ao converter cada um de vocês; quando cada um de vocês se afasta
  rationale: A sintaxe grega pode ser entendida como Cristo fazendo cada pessoa voltar-se ou como a bênção ocorrendo no afastamento de cada pessoa. A formulação principal conserva a agência divina sem apagar a resposta pessoal, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. “A vocês” evita uma marca regional excessiva; “abençoá-los” mantém concordância formal corrente. A ordem inicial preserva a ênfase de πρῶτον. As duas notas têm seus marcadores correspondentes no texto principal.
