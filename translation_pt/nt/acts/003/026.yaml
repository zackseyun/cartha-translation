  terminology: «Servo» é uma escolha apropriada para παῖς neste contexto, preservando o provável pano de fundo isaiano sem importar «Filho». «Maldades» representa bem o plural πονηριῶν. A nota lexical sobre «filho» ou «criança» deve ficar separada da nota sobre ἀναστήσας e ancorada em «Servo».
