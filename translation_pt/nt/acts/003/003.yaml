  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: pt
  text: Ao ver Pedro e João prestes a entrar no templo[a], pediu que lhe dessem uma esmola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “templo” refere-se ao recinto ou complexo do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδών
  choice: Ao ver
  rationale: O pronome relativo retoma o homem mencionado no versículo anterior, e o particípio aoristo tem valor temporal. A formulação evita uma oração relativa solta e é natural em português.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pedro e João
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes próprios em português.
- source_word: μέλλοντας εἰσιέναι
  choice: prestes a entrar
  rationale: Expressa a iminência indicada por μέλλω com infinitivo no contexto narrativo imediato.
- source_word: εἰς τὸ ἱερόν
  choice: no templo
  rationale: Em português, 'entrar no templo' é a construção idiomática. ἱερόν designa aqui o recinto ou complexo do templo, sentido esclarecido em nota.
- source_word: ἠρώτα
  choice: pediu
  rationale: O verbo indica que ele fez um pedido. Embora o imperfeito grego possa apresentar a ação em curso ou repetida, o pretérito perfeito é natural neste relato e não acrescenta uma ênfase incoativa que o texto não explicita.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: que lhe dessem uma esmola
  rationale: Formulação portuguesa natural que comunica o pedido para receber uma oferta destinada ao necessitado. O pronome 'lhe' preserva o homem como beneficiário, e 'esmola' mantém o sentido contextual de ajuda material aos pobres.
