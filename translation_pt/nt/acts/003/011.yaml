  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: pt
  text: Enquanto ele se mantinha agarrado a Pedro e João[a], todos correram juntos para eles, completamente atônitos, no pórtico chamado de Salomão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enquanto ele se agarrava a Pedro e João”. O verbo grego pode enfatizar o ato de segurar firmemente ou de não largar.'
    reason: lexical_alternative
  - marker: b
    text: O “pórtico” era uma passagem coberta sustentada por colunas no recinto do templo, tradicionalmente conhecida como Pórtico de Salomão.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος ... αὐτοῦ
  choice: Enquanto ele se mantinha agarrado a
  rationale: O genitivo absoluto com particípio presente indica uma ação simultânea. A expressão preserva a ideia de segurar com firmeza ou não largar, sem atribuir explicitamente ao homem uma emoção ou motivação.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Pedro e João
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: συνέδραμεν
  choice: correu até eles
  rationale: O verbo συντρέχω descreve pessoas convergindo depressa, literalmente correndo juntas. Com o sujeito coletivo «todo o povo», esta formulação é natural em português e conserva a rapidez do movimento.
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: Reproduz de perto a expressão grega e se refere às pessoas presentes no recinto do templo, sem restringi-las indevidamente a uma multidão previamente definida.
- source_word: ἐπὶ τῇ στοᾷ
  choice: no pórtico
  rationale: στοά designa uma passagem coberta sustentada por colunas. «Pórtico» é uma designação arquitetônica corrente e adequada ao contexto do templo.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: chamado de Salomão
  rationale: Mantém a designação tradicional do lugar e expressa naturalmente em português o particípio καλουμένῃ.
- source_word: ἔκθαμβοι
  choice: completamente atônito
  rationale: ἔκθαμβος comunica espanto muito intenso. A expressão adverbial portuguesa preserva essa força e concorda com o sujeito coletivo singular «todo o povo».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura segue de perto a progressão do grego, mas evita uma construção artificial. Os marcadores de nota foram colocados junto às expressões que explicam; em particular, a nota cultural sobre o pórtico aparece após «Salomão».
