id: ACT.3.6
reference: Acts 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: pt
  text: 'Mas Pedro disse: “Não tenho prata nem ouro, mas o que tenho, isto lhe dou: em nome de Jesus, o Messias, o Nazareno[a], ande!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Nazaré”. O grego traz, mais literalmente, “o Nazareno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: prata nem ouro
  rationale: Mantém os dois metais explicitamente mencionados e, com a negação portuguesa, emprega a coordenação natural “nem” sem reduzir a expressão ao sentido genérico de dinheiro.
- source_word: οὐχ ὑπάρχει μοι
  choice: não tenho
  rationale: A construção grega expressa posse; “não tenho” é a forma direta e natural em português.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: mas o que tenho, isto lhe dou
  rationale: Preserva o contraste e a ênfase demonstrativa de τοῦτο, mantendo fluidez e dignidade em português.
- source_word: ἐν τῷ ὀνόματι
  choice: em nome de
  rationale: Conserva a formulação grega e sua ressonância de autoridade ou representação sem explicitar apenas uma das nuances possíveis.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, em vez de tratá-lo apenas como parte de um nome, e usa a aposição idiomática portuguesa.
- source_word: τοῦ Ναζωραίου
  choice: o Nazareno
  rationale: Reproduz mais diretamente a forma adjetiva e titular do grego; “de Nazaré” permanece como alternativa explicativa na nota.
- source_word: περιπάτει
  choice: ande
  rationale: Traduz o imperativo presente de modo natural no contexto da cura. “Ande” comunica a ordem de caminhar sem acrescentar explicitamente a nuance ingressiva de “comece a andar”.
theological_decisions:
- issue: Tradução de Χριστοῦ na fórmula de autoridade
  choice: Messias
  alternative: Cristo
  rationale: Neste anúncio de cura, o valor titular de Χριστός continua perceptível. “Messias” preserva o significado do título, enquanto “Cristo” seria a forma tradicional transliterada.
- issue: Força de ἐν τῷ ὀνόματι
  choice: em nome de
  alternative: pela autoridade de
  rationale: A expressão pode comunicar autoridade ou agência, mas a tradução formal preserva a amplitude teológica do original sem escolher exclusivamente uma paráfrase.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em “isto lhe dou” é corrente no Brasil e amplamente inteligível. A pontuação destaca “o Messias” como título em aposição. Não se incluiu nota para “Cristo”, pois o único marcador herdado do inglês estava editorialmente desalinhado; a alternativa é registrada nas decisões teológicas sem criar uma nota desnecessária no texto publicado.
