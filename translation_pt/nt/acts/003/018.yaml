id: ACT.3.18
reference: Acts 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: pt
  text: 'Mas Deus cumpriu assim o que havia anunciado de antemão pela boca de todos os profetas[a]: que o seu Messias sofreria.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de todos os profetas”. O grego diz mais literalmente “pela boca de todos os profetas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “o seu Cristo”; aqui traduzido como “o seu Messias” porque Χριστός funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a ação dos ouvintes mencionada no versículo anterior.
- source_word: προκατήγγειλεν
  choice: havia anunciado de antemão
  rationale: Preserva tanto a anterioridade expressa pelo prefixo quanto o sentido de anúncio público.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: pela boca de todos os profetas
  rationale: Mantém a imagem bíblica concreta do grego, ainda compreensível em português moderno.
- source_word: παθεῖν
  choice: sofreria
  rationale: Expressa naturalmente o conteúdo do anúncio profético sem acrescentar uma modalidade explícita de necessidade.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: o seu Messias
  rationale: Χριστός funciona aqui como título, e αὐτοῦ indica o Messias pertencente a Deus ou por ele designado.
- source_word: ἐπλήρωσεν
  choice: cumpriu
  rationale: É a formulação portuguesa corrente para o cumprimento de algo anteriormente anunciado.
- source_word: οὕτως
  choice: assim
  rationale: Indica a maneira pela qual Deus cumpriu o anúncio, isto é, mediante o sofrimento referido no contexto.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo tem função titular neste contexto e preserva o ambiente messiânico judaico do discurso de Pedro.
- issue: Força de παθεῖν em relação à profecia
  choice: que o seu Messias sofreria
  alternative: que o seu Messias devia sofrer
  rationale: A formulação comunica o conteúdo profético sem tornar explícita uma necessidade modal que o infinitivo, isoladamente, não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada apenas o necessário para produzir sintaxe natural, preservando a expressão bíblica “pela boca de todos os profetas” e a ambiguidade modal de παθεῖν.
