source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: pt
  text: E agora, irmãos[a], sei que vocês agiram por ignorância, assim como também agiram os seus líderes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode usar o termo de modo representativo para se dirigir a um grupo misto mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a conexão com o discurso anterior por meio de καί quanto a transição temporal de νῦν, em português natural.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o sentido lexical direto do vocativo masculino plural. No contexto, pode funcionar como forma representativa de tratamento para um grupo mais amplo, possibilidade indicada em nota.
- source_word: οἶδα
  choice: sei
  rationale: Equivalente direto e idiomático da afirmação de conhecimento feita por Pedro.
- source_word: κατὰ ἄγνοιαν
  choice: por ignorância
  rationale: Expressa que a ação ocorreu em razão ou sob a condição de falta de conhecimento, sem transformar essa ignorância em plena desculpa moral.
- source_word: ἐπράξατε
  choice: vocês agiram
  rationale: Reproduz a referência geral ao que os ouvintes fizeram, sem acrescentar um objeto que não está expresso neste versículo.
- source_word: ὥσπερ καὶ
  choice: assim como também
  rationale: 'Conserva a comparação e o elemento aditivo: tanto os ouvintes quanto seus líderes agiram dessa maneira.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: os seus líderes
  rationale: No contexto de Jerusalém, designa os que exerciam autoridade sobre o povo. “Líderes” é claro e natural em português, sem restringir indevidamente a função deles à esfera política.
theological_decisions:
- issue: Se a referência à ignorância deve ser formulada de modo a desculpar a culpa dos envolvidos
  choice: vocês agiram por ignorância
  alternative: vocês fizeram isso sem saber
  rationale: A formulação reconhece a ignorância como fator real, mas não declara inocência nem elimina a responsabilidade, preservando a tensão com o chamado ao arrependimento no contexto imediato.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa e mantém a concisão e a progressão argumentativa do grego.
