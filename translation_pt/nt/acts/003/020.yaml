id: ACT.3.20
reference: Acts 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: pt
  text: para que venham tempos de alívio vindos da presença do Senhor e para que ele envie o Messias designado[a] para vocês, Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “previamente designado para vocês”; também é possível: “designado a vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: para que
  rationale: Introduz uma oração de finalidade ou resultado ligada ao chamado anterior ao arrependimento; a formulação preserva a dependência sintática sem explicitar uma incerteza maior do que a construção exige.
- source_word: ἔλθωσιν
  choice: venham
  rationale: O subjuntivo após ὅπως ἄν é representado naturalmente pelo presente do subjuntivo em português.
- source_word: καιροὶ
  choice: tempos
  rationale: Mantém a amplitude de καιρός, que pode indicar tempos ou períodos oportunos, sem impor uma cronologia escatológica específica.
- source_word: ἀναψύξεως
  choice: renovação
  rationale: Expressa a ideia de alívio, refrigério ou restauração vivificante em português corrente e digno; outras nuances legítimas são registradas em nota.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: da presença do Senhor
  rationale: Traduz a expressão idiomática literalmente ligada à 'face' como 'presença', seu sentido natural no contexto.
- source_word: ἀποστείλῃ
  choice: ele envie
  rationale: Preserva o subjuntivo e a coordenação com a oração anterior de finalidade ou resultado.
- source_word: προκεχειρισμένον
  choice: designado
  rationale: Comunica a escolha ou nomeação prévia sem tornar obrigatória no texto principal a explicitação temporal do prefixo.
- source_word: ὑμῖν
  choice: para vocês
  rationale: O dativo admite 'para vocês' ou 'a vocês'; a primeira opção comunica naturalmente destinação ou benefício e tem ampla legibilidade.
- source_word: χριστὸν
  choice: Messias
  rationale: Neste contexto funciona como título messiânico, cuja tradução preserva melhor o sentido no ambiente judaico do discurso.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Tradução de χριστὸν como título ou forma tradicional
  choice: Messias
  alternative: Cristo
  rationale: Aqui χριστός funciona como título aplicado a Jesus; 'Messias' torna explícito seu valor semântico sem acrescentar uma interpretação denominacional.
- issue: Sentido de προκεχειρισμένον ὑμῖν
  choice: designado para vocês
  alternative: designado a vocês; previamente designado para vocês
  rationale: A tradução principal preserva a nomeação e a relação dativa sem sobrecarregar a frase. A noção de anterioridade e a alternativa dativa permanecem visíveis na nota.
- issue: Nuance de ἀναψύξεως
  choice: renovação
  alternative: alívio; refrigério
  rationale: O substantivo pode evocar alívio restaurador ou revigoramento. 'Renovação' é claro no português atual, enquanto a nota conserva as demais nuances sem definir indevidamente a natureza dos tempos mencionados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural de segunda pessoa. A ordem da frase acompanha de perto o grego, mas evita o literalismo pouco natural de 'da face do Senhor'. O marcador de nota foi colocado imediatamente após a unidade a que se referem as alternativas.
