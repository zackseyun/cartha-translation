  terminology: «Senhor», «Messias» e «Jesus» estão adequados. «Designado para vocês» representa de modo natural προκεχειρισμένον ὑμῖν; a nota conserva tanto a possível anterioridade de προ- como a alternativa dativa «a vocês», sem impor uma leitura doutrinária.
