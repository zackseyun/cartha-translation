  source_fidelity: 'A construção «tempos de renovação da presença do Senhor» torna ambígua — e tende a inverter — a relação expressa por ἀπὸ προσώπου τοῦ κυρίου: os tempos de ἀνάψυξις procedem da presença do Senhor, não são uma renovação dessa presença. «Alívio» comunica bem ἀνάψυξις no português moderno e, com «vindos da presença», preserva explicitamente a origem indicada por ἀπό.'
