id: ACT.3.16
reference: Acts 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: pt
  text: E, com base na fé em seu nome[a], o próprio nome dele fortaleceu este homem que vocês veem e conhecem; e a fé que vem por meio dele[c] deu a este homem esta plena saúde[b], diante de todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na confiança em seu nome”. A palavra grega também pode significar “confiança” e, em certos contextos, “fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “esta integridade completa” ou “esta saúde perfeita”.
    reason: lexical_alternative
  - marker: c
    text: A expressão grega também pode ser traduzida como “a fé que há por meio dele”. O texto não identifica explicitamente de quem é essa fé.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: com base na fé
  rationale: ἐπί com o dativo pode indicar base ou fundamento. A formulação explicita esse valor sem reduzir a expressão a um sentido meramente instrumental.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: em seu nome
  rationale: Com πίστις, o genitivo é expresso naturalmente em português como “fé em seu nome”. “Nome” conserva a metonímia lucana para a pessoa e a autoridade de Jesus.
- source_word: ἐστερέωσεν
  choice: fortaleceu
  rationale: O verbo indica tornar firme ou forte e, neste contexto, descreve concretamente a restauração física do homem.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: vocês veem e conhecem
  rationale: Mantém tanto a observação direta quanto o conhecimento público da identidade e da condição anterior do homem.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o próprio nome dele
  rationale: Preserva a repetição enfática de “nome” no grego. “Próprio” torna a ênfase deliberada e natural em português sem substituir a metonímia por uma explicação.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: a fé que vem por meio dele
  rationale: A oração relativa dá clareza em português, enquanto “por meio dele” conserva a abertura da expressão grega quanto à mediação ou origem dessa fé.
- source_word: ὁλοκληρίαν
  choice: plena saúde
  rationale: O substantivo denota integridade, condição completa ou perfeito estado físico. “Plena saúde” comunica com clareza a restauração corporal completa neste contexto.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: diante de todos vocês
  rationale: Expressa o caráter público e verificável da cura em português corrente e digno.
theological_decisions:
- issue: A identidade de quem exerce a fé e o sentido de “por meio dele”
  choice: Não identificar explicitamente o sujeito humano da fé e manter Jesus como aquele por meio de quem ela vem.
  alternative: Especificar que se trata da fé do homem curado, da fé dos apóstolos ou de uma fé produzida por Jesus.
  rationale: O versículo relaciona a fé ao nome de Jesus e afirma que ela vem “por meio dele”, mas não declara de modo explícito de quem é essa fé. A tradução preserva essa tensão.
- issue: O “nome” como agente do fortalecimento
  choice: Conservar “o próprio nome dele” como sujeito da oração.
  alternative: Explicitar “o próprio Jesus” ou “o poder do nome dele”.
  rationale: A linguagem de Atos emprega “nome” de modo teologicamente significativo para representar a pessoa e a autoridade de Jesus. Manter a expressão evita reduzir ou explicar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A repetição de “nome” foi mantida por sua força retórica e teológica. “Plena saúde” evita o caráter abstrato de “integridade” e comunica naturalmente a cura física completa.
