  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: pt
  text: E, tomando-o pela mão direita, levantou-o; imediatamente, os pés e os tornozelos dele[a] foram fortalecidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ossos dos tornozelos».'
    reason: Alternativa lexical possível para τὰ σφυδρά, embora «tornozelos» seja mais natural e não exceda a precisão do grego.
lexical_decisions:
- source_word: πιάσας
  choice: segurando
  rationale: Expressa de modo natural o contato físico firme e benevolente que acompanha e precede a ação principal, sem a conotação brusca de «agarrando».
- source_word: τῆς δεξιᾶς χειρός
  choice: pela mão direita
  rationale: Reproduz idiomaticamente a construção genitiva grega após πιάσας, sem acrescentar um possessivo que não está explícito no texto.
- source_word: ἤγειρεν αὐτόν
  choice: levantou-o
  rationale: Preserva a ação física direta de ἐγείρω e o objeto expresso, com linguagem corrente e digna.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Comunica com clareza a ocorrência súbita e instantânea do fortalecimento.
- source_word: ἐστερεώθησαν
  choice: ficaram firmes
  rationale: Transmite o resultado de adquirir firmeza e força para sustentar o corpo, preservando a forma passiva/resultativa sem explicitar um agente.
- source_word: αἱ βάσεις αὐτοῦ
  choice: seus pés
  rationale: No contexto anatômico, βάσεις designa as partes de apoio usadas para ficar em pé; «pés» é a equivalência portuguesa mais natural.
- source_word: τὰ σφυδρά
  choice: tornozelos
  rationale: Designa a região ou as articulações dos tornozelos; a forma comum evita impor a precisão anatômica maior de «ossos dos tornozelos».
theological_decisions:
- issue: Natureza da descrição da cura
  choice: Relatar diretamente que os pés e tornozelos ficaram firmes de imediato, sem explicar o mecanismo da cura nem nomear seu agente nesta oração.
  alternative: Traduzir como «foram curados» ou acrescentar explicitamente a ação divina.
  rationale: O grego descreve concretamente o efeito físico. A formulação conserva essa descrição e deixa que o contexto comunique seu caráter milagroso, sem introduzir uma interpretação ausente da oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Levantou-o» conserva o tom narrativo sem soar excessivamente coloquial; «ficaram firmes» comunica de maneira natural o resultado físico descrito pelo passivo grego.
