    issue: «Embora ele tivesse decidido soltá-lo» explicita uma concessão.
    rationale: O genitivo absoluto grego pode ter valor temporal, circunstancial ou, no contexto, concessivo; não contém um conector concessivo expresso. Como a relação é interpretativamente discutível, a tradução deve evitar fixá-la sem necessidade.
