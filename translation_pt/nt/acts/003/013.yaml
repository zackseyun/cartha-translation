id: ACT.3.13
reference: Acts 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: pt
  text: O Deus de Abraão, de Isaque e de Jacó, o Deus dos nossos pais, glorificou seu servo Jesus[a], a quem vocês entregaram e negaram diante de Pilatos, quando ele havia decidido soltá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu filho Jesus». A palavra grega παῖς pode significar «filho/criança» ou «servo»; aqui, «servo» é preferível por causa da provável evocação da linguagem do Servo de Isaías.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: O Deus de Abraão, de Isaque e de Jacó
  rationale: Preserva a fórmula pactual e sua cadência bíblica, incluindo a repetição da conjunção, mas usa a construção portuguesa natural com repetição de «de».
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: o Deus dos nossos pais
  rationale: Mantém o sentido literal e a ressonância patriarcal da expressão, sendo também clara em português contemporâneo.
- source_word: ἐδόξασεν
  choice: glorificou
  rationale: O pretérito perfeito traduz naturalmente o aoristo e conserva o peso teológico de δοξάζω sem explicitar além do texto o modo da glorificação.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: seu servo Jesus
  rationale: Embora παῖς possa significar «filho/criança» ou «servo», «servo» expressa melhor a provável evocação do Servo de Isaías neste contexto.
- source_word: παρεδώκατε
  choice: vocês entregaram
  rationale: «Entregaram» comunica de modo direto e natural a transferência de Jesus às autoridades, sem acrescentar a nuance mais específica de traição.
- source_word: ἠρνήσασθε
  choice: negaram
  rationale: É a correspondência direta e tradicional para ἀρνέομαι, preservando sua ligação com a linguagem de negação no Novo Testamento.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: diante de Pilatos
  rationale: Verte de forma idiomática a expressão literal «perante a face de Pilatos», mantendo o caráter presencial e público da ação.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: embora ele tivesse decidido soltá-lo
  rationale: A construção concessiva explicita a forte contraposição contextual entre a negação dos ouvintes e a decisão de Pilatos. «Soltar» é português corrente e adequado ao contexto judicial.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo
  alternative: filho ou criança
  rationale: A provável linguagem do Servo de Isaías favorece «servo». A nota preserva a ambiguidade lexical real sem confundir παῖς com o vocabulário neotestamentário mais específico para «Filho».
- issue: Força lógica do genitivo absoluto κρίναντος ἐκείνου ἀπολύειν
  choice: embora ele tivesse decidido soltá-lo
  alternative: quando ele tinha decidido soltá-lo
  rationale: O grego admite uma relação circunstancial não marcada de modo totalmente explícito. A leitura concessiva se ajusta ao contraste narrativo, mas a alternativa temporal continua possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a cadência bíblica da fórmula patriarcal e evita arcaísmos. O marcador [b] deve aparecer após «soltá-lo», pois sua nota registra a alternativa para a relação concessiva escolhida.
