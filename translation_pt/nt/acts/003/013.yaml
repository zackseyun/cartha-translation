  rationale: Substitui-se a construção concessiva por «quando», que representa o genitivo absoluto de modo natural sem impor uma relação lógica que o grego deixa não marcada. Mantêm-se as demais escolhas, inclusive «servo» com nota de alternativa lexical. Não se inclui marcador [b], pois a versão revista não exige nota sobre uma leitura concessiva.
