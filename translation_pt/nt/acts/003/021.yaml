id: ACT.3.21
reference: Acts 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: pt
  text: É necessário que o céu o receba até os tempos da restauração de todas as coisas a respeito das quais Deus falou pela boca de seus santos profetas desde os tempos antigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: É necessário
  rationale: Expressa a necessidade indicada pelo verbo grego, sem especificar além do texto se ela é profética, divina ou lógica.
- source_word: οὐρανὸν ... δέξασθαι
  choice: que o céu o receba
  rationale: Mantém o céu como sujeito e o pronome relativo como objeto, com formulação natural em português.
- source_word: ἄχρι χρόνων
  choice: até os tempos
  rationale: Preserva o plural de χρόνοι e o limite temporal expresso por ἄχρι.
- source_word: ἀποκαταστάσεως πάντων
  choice: da restauração de todas as coisas
  rationale: Reproduz de modo direto a amplitude de πάντων sem definir antecipadamente a natureza ou o alcance teológico da restauração.
- source_word: ἐλάλησεν
  choice: anunciou
  rationale: No contexto da fala profética de Deus, 'anunciou' comunica fala proclamativa de maneira corrente; não acrescenta a ideia específica de cumprimento.
- source_word: διὰ στόματος
  choice: pela boca
  rationale: Conserva a imagem semítica e bíblica do grego, compreensível em português.
- source_word: ἀπ’ αἰῶνος
  choice: desde os tempos antigos
  rationale: Transmite a antiguidade indefinida da expressão idiomática sem sugerir necessariamente eternidade absoluta.
theological_decisions:
- issue: Alcance de 'restauração de todas as coisas'
  choice: Manter 'de todas as coisas' sem explicação restritiva ou universalizante
  alternative: Explicitar como restauração universal de toda a criação ou restringi-la ao que foi profetizado
  rationale: O versículo não define por si só todo o alcance da expressão; a tradução preserva sua amplitude e tensão teológica.
- issue: Relação do pronome ὧν com a fala de Deus
  choice: '''todas as coisas que Deus anunciou'''
  alternative: '''todas as coisas a respeito das quais Deus falou'''
  rationale: A forma grega admite a relação com o conteúdo da fala, e esta redação acompanha a leitura adotada no texto de consulta sem inserir a preposição explicativa 'a respeito de'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a imagem 'pela boca' e o plural 'os tempos', evitando paráfrases doutrinárias.
