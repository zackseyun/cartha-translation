id: ACT.3.15
reference: Acts 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: pt
  text: mas vocês mataram o Autor da vida[a], a quem Deus ressuscitou dentre os mortos; disso nós somos testemunhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Príncipe da vida”, “Líder da vida” ou “Originador da vida”. O termo grego pode envolver as ideias de origem, liderança ou preeminência.
    reason: lexical_alternative
  - marker: b
    text: Ou “de quem nós somos testemunhas”. O grego pode apontar tanto para o próprio Ressuscitado como para o fato de sua ressurreição.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste incisivo entre aquele que é o Autor da vida e o fato de ter sido morto pelos ouvintes, sem tornar a conjunção mais forte do que o contexto permite.
- source_word: ἀρχηγὸν
  choice: Autor
  rationale: ἀρχηγός pode indicar origem, liderança ou preeminência. “Autor da vida” é claro em português, conserva a força titular da expressão e destaca o paradoxo de matarem aquele que está na origem da vida.
- source_word: τῆς ζωῆς
  choice: da vida
  rationale: Reproduz naturalmente o genitivo e mantém a expressão breve e titular.
- source_word: ἀπεκτείνατε
  choice: vocês mataram
  rationale: Traduz de maneira direta o aoristo, sem acrescentar a qualificação jurídica sugerida por “assassinaram”.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: ressuscitou dentre os mortos
  rationale: Expressão portuguesa natural para a ação de Deus, preservando em ἐκ νεκρῶν a ideia de levantar Jesus do meio dos mortos.
- source_word: οὗ
  choice: disso
  rationale: Liga o testemunho apostólico ao fato imediatamente mencionado, a ressurreição, sem esconder em nota a possibilidade gramatical de referência à própria pessoa de Jesus.
- source_word: μάρτυρές ἐσμεν
  choice: nós somos testemunhas
  rationale: Mantém a construção nominal e a ênfase explícita de ἡμεῖς no testemunho dos apóstolos.
theological_decisions:
- issue: Sentido do título cristológico ἀρχηγὸς τῆς ζωῆς
  choice: Autor da vida
  alternative: Príncipe da vida; Líder da vida; Originador da vida
  rationale: O termo reúne possíveis noções de origem, liderança e preeminência. “Autor” comunica bem a relação de Cristo com a origem da vida e o paradoxo do contexto, enquanto a nota preserva a amplitude lexical sem impor uma definição teológica mais estreita.
- issue: Referente de οὗ na declaração sobre as testemunhas
  choice: disso nós somos testemunhas
  alternative: de quem nós somos testemunhas
  rationale: O genitivo relativo pode remeter ao fato da ressurreição ou à pessoa ressuscitada. No fluxo do discurso, “disso” expressa naturalmente o testemunho acerca da ressurreição, e a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. “Vocês” torna explícito o sujeito plural de ἀπεκτείνατε; o ponto e vírgula conserva a unidade da frase grega sem produzir uma sequência excessivamente carregada. Todos os marcadores de nota aparecem no texto.
