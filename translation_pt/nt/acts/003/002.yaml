id: ACT.3.2
reference: Acts 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: pt
  text: Certo homem, que era manco desde o ventre de sua mãe,[a] era levado; todos os dias o colocavam junto à porta do templo chamada Formosa,[b] para pedir esmolas aos que entravam no templo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o nascimento”.'
    reason: lexical_alternative
  - marker: b
    text: O nome da porta significa literalmente “Formosa” ou “Bela”.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “templo” se refere ao complexo ou recinto do templo, e não especificamente ao santuário interior.
    reason: cultural_note
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: certo homem
  rationale: Introduz uma pessoa indefinida, mas particular; “certo homem” preserva essa especificidade narrativa em português natural.
- source_word: χωλὸς
  choice: manco
  rationale: Expressa de modo direto a incapacidade de andar normalmente, sem recorrer ao termo mais duro e hoje inadequado “aleijado”.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: desde o ventre de sua mãe
  rationale: Preserva a imagem concreta do grego; o sentido idiomático “desde o nascimento” é indicado em nota.
- source_word: ὑπάρχων
  choice: que era
  rationale: Torna explícito e natural em português o particípio que descreve a condição contínua do homem.
- source_word: ἐβαστάζετο
  choice: era levado
  rationale: O imperfeito passivo comunica uma ação habitual ou contínua no passado; o contexto não exige especificar quem o carregava.
- source_word: ἐτίθουν
  choice: o colocavam
  rationale: O imperfeito plural indica uma prática habitual, reforçada por “todos os dias”; o sujeito permanece indeterminado como no grego.
- source_word: καθ’ ἡμέραν
  choice: todos os dias
  rationale: Forma corrente e clara de expressar a repetição diária.
- source_word: πρὸς τὴν θύραν τοῦ ἱεροῦ
  choice: junto à porta do templo
  rationale: “Porta” é natural para a entrada arquitetônica, e πρός indica sua posição junto à entrada; “templo” designa aqui o complexo do templo.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: chamada Formosa
  rationale: Mantém o adjetivo como nome tradicional da porta e preserva seu sentido literal, explicado em nota.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: para pedir esmolas
  rationale: A construção infinitiva exprime propósito; o plural “esmolas” é a formulação idiomática em português para donativos aos necessitados.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: aos que entravam no templo
  rationale: “Pedir algo a alguém” é a regência natural em português; o imperfeito se harmoniza com a cena habitual, sem alterar o valor do particípio presente grego.
theological_decisions: []
