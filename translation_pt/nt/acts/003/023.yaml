- from: E acontecerá que toda pessoa que não ouvir aquele profeta será completamente eliminada do meio do povo.[a]
  to: E toda pessoa que não ouvir aquele profeta será totalmente destruída dentre o povo.[a]
  rationale: A revisão substitui uma expressão eufemística e pouco idiomática por «será totalmente destruída», que comunica a força de ἐξολεθρευθήσεται. A formulação direta elimina o pesado «E acontecerá que», conservando o valor futuro do original. A nota mantém alternativas de tradução, incluindo a ideia de exclusão ligada ao pano de fundo de Deuteronômio, sem reduzir o sentido principal a uma modalidade específica de juízo.
