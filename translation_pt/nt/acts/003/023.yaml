  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: pt
  text: E toda pessoa que não ouvir aquele profeta será totalmente destruída dentre o povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será exterminada dentre o povo”; ou, à luz da formulação de Deuteronômio, “será excluída do meio do povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: toda pessoa
  rationale: Embora literalmente seja “toda alma”, ψυχή neste idioma designa cada indivíduo. “Toda pessoa” comunica o sentido com naturalidade e sem sugerir uma antropologia dualista.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: que não ouvir
  rationale: A construção expressa uma referência indefinida, isto é, qualquer pessoa que não ouça. Em português bíblico corrente, “ouvir” pode incluir a ideia contextual de dar atenção e obedecer, preservando a amplitude de ἀκούω sem explicitar demais.
- source_word: τοῦ προφήτου ἐκείνου
  choice: aquele profeta
  rationale: Retoma o profeta semelhante a Moisés mencionado no contexto anterior. A minúscula evita transformar a expressão grega, por convenção editorial, em título formal.
- source_word: ἐξολεθρευθήσεται
  choice: será completamente eliminada
  rationale: O futuro passivo de ἐξολεθρεύω indica destruição ou remoção completa. “Completamente eliminada” preserva a força do verbo e sua ligação com a exclusão do meio do povo, sem definir indevidamente a modalidade do juízo.
- source_word: ἐκ τοῦ λαοῦ
  choice: do meio do povo
  rationale: A preposição ἐκ indica retirada de dentro do povo. A expressão portuguesa é natural e conserva tanto a dimensão comunitária quanto a ideia de remoção.
theological_decisions:
- issue: Natureza do juízo anunciado na citação/alusão a Deuteronômio 18.19
  choice: Expressar o juízo como eliminação completa do meio do povo, sem determinar se é temporal, comunitário ou escatológico.
  alternative: Traduzir especificamente como excomunhão da comunidade da aliança ou como juízo divino final.
  rationale: O texto anuncia um juízo severo contra quem se recusa a ouvir o profeta, mas não define de modo completo sua forma ou seu momento. A tradução mantém tanto a força destrutiva do verbo quanto a dimensão comunitária da frase final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E acontecerá que” conserva a formulação profética de ἔσται δέ; “eliminada” mantém deliberadamente a tensão entre destruição e remoção comunitária.
