id: ACT.3.22
reference: Acts 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: pt
  text: 'Moisés, de fato, disse: “O Senhor Deus levantará para vocês, dentre os seus irmãos, um profeta semelhante a mim.[a] Vocês deverão ouvi-lo em tudo o que ele lhes disser”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentre os seus compatriotas israelitas”. O grego diz literalmente “dentre os seus irmãos”, empregando linguagem masculina de parentesco em sentido representativo dentro da aliança.
    reason: lexical_alternative
  - marker: b
    text: Aqui Atos cita Deuteronômio 18:15 com uma formulação um pouco diferente; em especial, o texto grego de Atos diz “o Senhor Deus”, e não “o Senhor, seu Deus”.
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν ὅτι
  choice: 'Moisés, de fato, disse:'
  rationale: “De fato” preserva a força discursiva e enfática de μέν, enquanto os dois-pontos introduzem naturalmente a citação direta em português.
- source_word: Προφήτην
  choice: um profeta
  rationale: O substantivo sem artigo é adequadamente traduzido de forma indefinida, sem inserir no texto a identificação interpretativa como “o Profeta” ou “o Messias”.
- source_word: ἀναστήσει
  choice: levantará
  rationale: Preserva a imagem verbal e o vínculo com Deuteronômio 18, sem fazer da ressurreição o sentido principal neste contexto.
- source_word: κύριος ὁ θεὸς
  choice: O Senhor Deus
  rationale: Segue literalmente a formulação de Atos; o grego não contém o possessivo “seu”, presente em formas de Deuteronômio 18:15.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: dentre os seus irmãos
  rationale: Expressa naturalmente ἐκ e conserva a linguagem masculina de parentesco empregada em sentido representativo para os israelitas.
- source_word: ὡς ἐμέ
  choice: semelhante a mim
  rationale: Comunica com dignidade e clareza o sentido comparativo de ὡς.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Vocês deverão ouvi-lo
  rationale: O futuro tem força de ordem no contexto da aliança; “deverão ouvi-lo” comunica tanto escuta quanto obediência, sem rigidez arcaica.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: em tudo o que ele lhes disser
  rationale: Formulação natural que preserva a abrangência distributiva da expressão grega.
theological_decisions:
- issue: Citação de Deuteronômio 18 e identificação messiânica
  choice: Traduzir “um profeta” sem inserir “Messias” na citação
  alternative: “o Profeta” ou explicitar “o Messias”
  rationale: Pedro aplica a passagem a Jesus no contexto de Atos, mas a formulação grega deste versículo diz apenas “um profeta”; a tradução preserva essa forma e sua tensão interpretativa.
- issue: Sentido de ἀδελφῶν
  choice: irmãos
  alternative: compatriotas israelitas
  rationale: A escolha mantém a linguagem masculina de parentesco do original, enquanto a nota esclarece seu sentido étnico e representativo.
- issue: Força de αὐτοῦ ἀκούσεσθε
  choice: deverão ouvi-lo
  alternative: o ouvirão
  rationale: A forma futura na citação tem força imperativa e pactual; a tradução comunica obrigação sem transformar a frase em simples previsão.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo; “lhes” mantém clareza referencial. As notas são posicionadas junto às expressões que explicam: [a] após a unidade sobre o profeta e sua origem, e [b] ao fim da citação para a observação textual global.'
