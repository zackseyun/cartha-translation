  text: E todo o povo o viu andando e louvando a Deus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples, preservando o fluxo narrativo sem acrescentar uma força temporal ausente no grego.
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo de ὁράω relata de modo direto a percepção do homem curado pelo povo; “viu” é natural e fiel.
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: A construção com πᾶς, artigo e substantivo singular tem sentido coletivo. “Todo o povo” preserva esse valor melhor que “toda a multidão”.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma o homem curado no contexto anterior.
- source_word: περιπατοῦντα
  choice: andando
  rationale: O particípio presente descreve a ação visível e contínua do homem, salientando a realidade da cura.
- source_word: καὶ αἰνοῦντα
  choice: e louvando
  rationale: αἰνέω expressa louvor, especialmente o reconhecimento reverente dirigido a Deus; “louvando” é claro e idiomático.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Objeto definido do louvor; em português, o nome “Deus” normalmente aparece sem artigo nesta construção, com a preposição exigida por “louvar”.
