id: ACT.3.14
reference: Acts 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: pt
  text: Mas vocês negaram o Santo e Justo e pediram que lhes fosse concedido um assassino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente neste contexto: “que lhes fosse solto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Mas vocês
  rationale: δέ estabelece contraste com o contexto anterior, enquanto o pronome explícito ὑμεῖς dá ênfase aos ouvintes. “Mas vocês” preserva ambos de modo natural em português.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: o Santo e Justo
  rationale: O artigo com os dois adjetivos substantivados designa Jesus. A forma com iniciais maiúsculas comunica o valor titular sem transformar os dois qualificativos em duas pessoas distintas.
- source_word: ἠρνήσασθε
  choice: negaram
  rationale: ἀρνέομαι expressa negar, repudiar ou rejeitar alguém. “Negaram” mantém de modo direto a força relacional e pública do verbo.
- source_word: ᾐτήσασθε
  choice: pediram
  rationale: αἰτέω significa pedir ou solicitar. “Pediram” é corrente e se liga naturalmente à oração infinitiva seguinte.
- source_word: ἄνδρα φονέα
  choice: um assassino
  rationale: Embora ἄνδρα esteja expresso, φονέα identifica o homem como homicida. Em português, “um assassino” representa naturalmente toda a expressão, sem a formulação pesada “um homem assassino”.
- source_word: χαρισθῆναι ὑμῖν
  choice: que lhes fosse concedido
  rationale: O passivo de χαρίζομαι indica conceder alguém como favor. A formulação preserva a amplitude lexical do verbo; no contexto judicial, trata-se concretamente de soltura, explicitada em nota.
theological_decisions:
- issue: Força cristológica de τὸν ἅγιον καὶ δίκαιον
  choice: Tratar “Santo e Justo” como designação titular de Jesus, com maiúsculas
  alternative: Ler como adjetivos meramente descritivos, em minúsculas
  rationale: A construção substantivada identifica Jesus por qualificativos de forte peso moral e teológico. As maiúsculas assinalam esse uso sem acrescentar conteúdo doutrinário alheio ao texto.
- issue: Nuance judicial de χαρισθῆναι
  choice: Traduzir no texto como “fosse concedido”
  alternative: Traduzir contextualmente como “fosse solto” ou “fosse libertado”
  rationale: O verbo tem o sentido mais amplo de conceder por favor, embora o contexto se refira à libertação de Barrabás. A tradução principal mantém a forma lexical, e a nota registra a explicitação contextual.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. “Vocês” evita regionalismo excessivo; “lhes” mantém clareza e um registro moderadamente formal. A vírgula antes de “e” foi omitida por não ser necessária em português.
