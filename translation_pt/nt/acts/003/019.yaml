base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: pt
  text: Portanto, arrependam-se e voltem, para que os seus pecados sejam apagados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: sejam eliminados.'
    reason: Alternativa lexical para ἐξαλειφθῆναι.
lexical_decisions:
- source_word: μετανοήσατε
  choice: arrependam-se
  rationale: O imperativo aoristo convoca a uma resposta decidida. “Arrependam-se” preserva a força moral e relacional do termo sem reduzi-lo a uma simples mudança de opinião.
- source_word: οὖν
  choice: portanto
  rationale: Expressa naturalmente a conclusão decorrente do argumento anterior.
- source_word: ἐπιστρέψατε
  choice: voltem-se para Deus
  rationale: O imperativo ativo indica voltar-se ou retornar. A menção de Deus explicita em português o alvo implícito no contexto, evita a formulação passiva e teologicamente carregada “sejam convertidos” e distingue o verbo de “arrependam-se”.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: para que ... sejam apagados
  rationale: A construção com infinitivo articular admite propósito ou resultado. “Para que” mantém essa relação sem definir um mecanismo doutrinário além do que o texto afirma.
- source_word: ἐξαλειφθῆναι
  choice: sejam apagados
  rationale: Preserva a imagem de apagar completamente algo escrito e comunica de forma clara a remoção dos pecados.
- source_word: ἁμαρτίας
  choice: pecados
  rationale: É a tradução direta, corrente e abrangente do substantivo plural.
theological_decisions:
- issue: Relação entre arrependimento, retorno a Deus e remoção dos pecados
  choice: “para que os seus pecados sejam apagados”
  alternative: “para o apagamento dos seus pecados”
  rationale: A formulação conserva a ligação de propósito ou resultado apresentada pelo texto, sem impor uma explicação denominacional sobre a ordem ou o mecanismo da salvação.
- issue: Sentido de ἐπιστρέψατε
  choice: “voltem-se para Deus”
  alternative: “convertam-se”
  rationale: A opção escolhida preserva a voz ativa e o movimento relacional indicado pelo contexto, sem importar sentidos sistemáticos que a expressão tradicional “convertam-se” pode sugerir.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural, de ampla legibilidade no Brasil e compreensão internacional. O marcador da nota foi colocado após “apagados”, termo ao qual a alternativa lexical se refere.
