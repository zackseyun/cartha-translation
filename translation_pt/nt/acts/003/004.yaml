  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: pt
  text: 'E Pedro, junto com João, fixou os olhos nele e disse: “Olhe para nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: fixou os olhos
  rationale: O particípio aoristo de ἀτενίζω expressa um olhar atento e concentrado. “Fixou os olhos” preserva essa intensidade em português natural, sem sugerir necessariamente hostilidade como poderia ocorrer com “encarou”.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ funciona como conectivo narrativo leve. “Então” dá continuidade ao relato sem introduzir um contraste indevido.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: junto com João
  rationale: σύν com o dativo indica acompanhamento. “Junto com João” conserva de modo explícito a participação de João na ação.
- source_word: εἶπεν
  choice: disse
  rationale: Neste contexto, λέγω é o verbo comum de fala; “disse” é a correspondência direta e natural.
- source_word: Βλέψον
  choice: Olhe
  rationale: O imperativo aoristo pede de forma direta que o homem volte a atenção visual para os apóstolos. “Olhe” é claro, idiomático e amplamente compreensível.
- source_word: εἰς ἡμᾶς
  choice: para nós
  rationale: Com verbo de visão, εἰς indica a direção do olhar. Em português, “olhar para nós” é a construção natural.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com ἀτενίζω, εἰς marca o alvo da atenção concentrada. A expressão portuguesa “fixar os olhos nele” transmite naturalmente essa direção.
theological_decisions: []
