  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: pt
  text: E, dando um salto, pôs-se de pé e começou a andar. Então entrou com eles no templo, andando, saltando e louvando a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: dando um salto
  rationale: Expressa o movimento súbito de saltar para cima e levantar-se, em português natural, sem acrescentar uma ideia ausente do grego.
- source_word: περιεπάτει
  choice: começou a andar
  rationale: O imperfeito, neste contexto ingressivo após ele se pôr de pé, indica o início e a continuidade da ação de andar.
- source_word: τὸ ἱερόν
  choice: o templo
  rationale: Refere-se ao complexo do templo; «templo» é a forma corrente e adequada neste contexto.
- source_word: ἁλλόμενος
  choice: saltando
  rationale: Mantém a ação repetida e jubilosa durante a entrada no templo, distinguindo-a do salto inicial.
- source_word: αἰνῶν τὸν θεόν
  choice: louvando a Deus
  rationale: Tradução direta e idiomática da expressão grega.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. A divisão em duas frases evita uma cadeia excessiva de coordenações sem perder a sequência enfática das ações.
