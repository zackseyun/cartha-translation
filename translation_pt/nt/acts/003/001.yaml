  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: pt
  text: Pedro e João estavam subindo ao templo à hora da oração[a], a hora nona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por volta das três horas da tarde na contagem moderna.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: não traduzido explicitamente
  rationale: Aqui, δέ é um conectivo narrativo leve, sem contraste forte. Em português, a progressão do relato fica natural sem acrescentar «então», termo que poderia sugerir uma relação temporal mais explícita do que há no grego.
- source_word: ἀνέβαινον
  choice: estavam subindo
  rationale: O pretérito imperfeito preserva o aspecto durativo do imperfeito grego, enquanto «subindo» mantém o modo tradicional de descrever a ida a Jerusalém e ao templo.
- source_word: ἱερὸν
  choice: templo
  rationale: Embora ἱερόν possa designar todo o complexo ou recinto do templo, «templo» é a forma corrente e clara em português.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: para a hora da oração
  rationale: Neste contexto de movimento, «para» expressa naturalmente que iam ao templo com vista ao horário estabelecido de oração, sem perder a estrutura básica da expressão grega.
- source_word: τὴν ἐνάτην
  choice: a hora nona
  rationale: Mantém o sistema antigo de contagem das horas e a aposição explicativa do original; a equivalência moderna aparece em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Hora nona» conserva o enquadramento histórico, enquanto a nota esclarece o horário para leitores atuais.
