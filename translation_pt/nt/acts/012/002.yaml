  text: ἀνεῖλεν δὲ Ἰάκωβον τὸν ἀδελφὸν Ἰωάννου μαχαίρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: pt
  text: E matou à espada Tiago[a], irmão de João.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mandou matar” ou “executou”. O grego afirma que Herodes causou a morte de Tiago; o contexto mais amplo pode indicar uma execução oficial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: matou
  rationale: O verbo ἀναιρέω, neste contexto, indica causar a morte. “Matou” é claro e natural, sem acrescentar explicitamente a ideia de um processo judicial; “mandou matar” ou “executou” seriam possíveis à luz do contexto mais amplo, mas são mais específicos.
- source_word: δὲ
  choice: E
  rationale: δέ faz a ligação e dá continuidade à narrativa. “E” conserva esse fluxo simples sem impor um contraste mais forte.
- source_word: Ἰάκωβον
  choice: Tiago
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome bíblico Ἰάκωβος.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: irmão de João
  rationale: A expressão em aposição identifica qual Tiago está em vista. Em português, o artigo pode ser omitido com naturalidade após o nome próprio.
- source_word: μαχαίρῃ
  choice: à espada
  rationale: μάχαιρα designa uma espada, e o dativo indica o instrumento ou meio. A expressão idiomática “matar à espada” preserva a imagem concreta e pode indicar morte por golpe de espada.
theological_decisions:
- issue: Natureza da ação de Herodes
  choice: A ação é apresentada diretamente como matar Tiago, sem especificar no texto principal que houve uma execução judicial.
  alternative: “Mandou matar Tiago” ou “executou Tiago”, ressaltando a provável ação oficial de Herodes.
  rationale: ἀνεῖλεν afirma a morte de Tiago, e μαχαίρῃ especifica o meio. Embora o contexto indique perseguição promovida pelo governante e possa sugerir execução oficial, o versículo não explicita o processo legal nem marca claramente a distinção entre matar pessoalmente e fazer com que alguém seja morto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação concisa acompanha a estrutura narrativa grega; “à espada” mantém a imagem concreta e o tom bíblico sem soar arcaico.
