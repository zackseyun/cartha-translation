translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem temporal foi mantida próxima do grego sem sacrificar a fluidez. A formulação evita acrescentar um marcador discursivo equivalente a “agora”, ausente do texto-fonte.
