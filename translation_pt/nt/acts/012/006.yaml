revisions:
- from: Quando Herodes estava prestes a mandar trazê-lo para fora[a], naquela mesma noite Pedro dormia entre dois soldados, preso com duas correntes, enquanto os guardas diante da porta mantinham a prisão sob vigilância[b].
  to: Quando Herodes estava prestes a levá-lo para fora[a], naquela mesma noite Pedro dormia entre dois soldados, acorrentado com duas correntes, e os guardas diante da porta vigiavam a prisão[b].
  rationale: A revisão elimina o acréscimo de uma ordem explícita por parte de Herodes, preserva a coordenação do texto grego e torna mais preciso o sentido físico de estar preso por duas correntes. As notas mantêm as alternativas lexicais e seus marcadores no ponto pertinente do texto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:20:30Z'
review_pass:
  verdict: revise
  source_fidelity: A formulação «mandar trazê-lo para fora» introduz uma nuance causativa/mandativa que não está expressa em προαγαγεῖν; o verbo apresenta Herodes como aquele que levaria Pedro para fora. «Lev á-lo para fora» traduz diretamente o movimento sem especificar o modo de ação ou sua finalidade. A coordenação final do grego é mais bem mantida por «e» do que por «enquanto».
  naturalness: O texto é claro e de registro adequado. «Lev á-lo para fora» e «vigiavam a prisão» soam naturais em português moderno e conservam uma construção narrativa fluida. «Acorrentado com duas correntes» torna explícita, sem ambiguidade, a restrição física indicada pelo grego.
  terminology: «Herodes», «Pedro», «soldados», «guardas» e «prisão» são adequados. «Acorrentado» corresponde bem a δεδεμένος no contexto específico de ἁλύσεσιν δυσίν.
  issues:
  - severity: medium
    issue: «mandar trazê-lo para fora» acrescenta uma noção causativa.
    rationale: προαγαγεῖν αὐτόν tem Herodes como sujeito do ato de levar Pedro para fora; embora uma ordem de Herodes seja plausível no contexto, ela não é explicitada pelo verbo e não deve ser incorporada à tradução.
  - severity: low
    issue: «enquanto» transforma a coordenação em subordinação temporal.
    rationale: O τε grego une a informação sobre os guardas à descrição de Pedro. A simultaneidade permanece evidente com a coordenação simples por «e», sem impor uma relação sintática adicional.
  revised_text: Quando Herodes estava prestes a levá-lo para fora[a], naquela mesma noite Pedro dormia entre dois soldados, acorrentado com duas correntes, e os guardas diante da porta vigiavam a prisão[b].
