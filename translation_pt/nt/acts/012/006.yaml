source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: pt
  text: Quando Herodes estava prestes a levá-lo para fora[a], naquela mesma noite Pedro dormia entre dois soldados, acorrentado com duas correntes, e os guardas diante da porta vigiavam a prisão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresentá-lo”. O verbo grego pode se referir a conduzir alguém para fora a fim de comparecer em público ou ser julgado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guardavam a prisão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: estava prestes a
  rationale: Expressa com naturalidade a iminência da ação indicada por μέλλω.
- source_word: προαγαγεῖν αὐτόν
  choice: mandar trazê-lo para fora
  rationale: Preserva a ideia de conduzir Pedro para fora da custódia; “mandar” explicita de modo idiomático que Herodes ordenaria a ação, sem definir se seria para julgamento, exposição pública ou execução.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: naquela mesma noite
  rationale: Mantém a referência enfática e específica do demonstrativo ἐκείνῃ.
- source_word: κοιμώμενος
  choice: dormia
  rationale: Reproduz de maneira fluida a ação contínua indicada pelo particípio.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: entre dois soldados
  rationale: Equivalência espacial direta, clara e idiomática.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: preso com duas correntes
  rationale: Comunica o estado resultante do particípio perfeito passivo e conserva a indicação explícita das duas correntes.
- source_word: φύλακές τε πρὸ τῆς θύρας
  choice: enquanto os guardas diante da porta
  rationale: “Guardas” é o termo corrente no contexto prisional, e “diante da porta” preserva a relação espacial de πρό com genitivo. “Enquanto” integra naturalmente a ação simultânea.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: mantinham a prisão sob vigilância
  rationale: Preserva tanto a noção contínua de vigiar quanto o referente “prisão”, evitando a repetição imediata de “guardas/guardavam”.
