  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: pt
  text: Quando viu que isso agradava aos judeus[a], passou também a prender Pedro. (Eram os dias dos Pães sem Fermento[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos judeanos” ou, se o contexto for entendido de modo mais restrito, “aos líderes judeus”. O termo grego pode ter esses sentidos em certos contextos, mas aqui o texto diz simplesmente “aos judeus”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o período festivo associado à Páscoa, caracterizado pelo consumo de pão sem fermento.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quando viu
  rationale: O particípio aoristo tem valor circunstancial temporal e apresenta a percepção de Herodes antes da ação seguinte. “Quando viu” expressa com naturalidade essa sequência; a ligação narrativa de δέ fica suficientemente indicada pelo contexto.
- source_word: ἀρεστόν ἐστιν
  choice: isso agradava
  rationale: A expressão denota o que é agradável ou aceitável. A construção pessoal “isso agradava” é idiomática em português e mantém “isso” como referência à ação narrada anteriormente.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: O texto grego emprega o termo amplo Ἰουδαῖοι sem restringi-lo explicitamente aos líderes nem enfatizar apenas a origem geográfica. A alternativa lexical é registrada em nota.
- source_word: προσέθετο
  choice: tratou de
  rationale: Com infinitivo, προστίθημι pode indicar que alguém passa a realizar outra ação ou prossegue fazendo algo. “Tratou de” comunica esse avanço narrativo sem a tradução rígida “acrescentou” e sem introduzir uma ordem que o grego não explicita.
- source_word: συλλαβεῖν
  choice: prender
  rationale: Neste contexto de ação governamental contra uma pessoa, συλλαμβάνω significa deter ou prender.
- source_word: καὶ Πέτρον
  choice: também Pedro
  rationale: 'καί tem força aditiva: Pedro se torna outro alvo, depois de Tiago.'
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Eram os dias dos Pães sem Fermento
  rationale: A formulação preserva a referência temporal e o nome específico do período festivo judaico, sem substituí-lo por “Páscoa”.
theological_decisions:
- issue: Sentido de Ἰουδαίοις em Atos
  choice: aos judeus
  alternative: aos judeanos; aos líderes judeus
  rationale: O termo pode assumir sentidos mais delimitados conforme o contexto, mas o versículo não restringe expressamente o grupo à liderança nem apenas aos habitantes da Judeia. Mantém-se, portanto, o sentido lexical amplo, com nota que reconhece as alternativas.
- issue: Identificação de τῶν ἀζύμων
  choice: dos Pães sem Fermento
  alternative: da Páscoa
  rationale: O grego nomeia especificamente os dias dos Pães sem Fermento. Embora esse período esteja ligado à Páscoa, substituir o nome por “Páscoa” apagaria uma distinção presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “tratou de prender” preserva o movimento para uma nova ação sem soar excessivamente literal. As maiúsculas em “Pães sem Fermento” assinalam o nome do período festivo. A nota cultural foi posicionada junto à expressão que explica.
