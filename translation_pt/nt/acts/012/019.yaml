  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: pt
  text: Herodes o procurou, mas não o encontrou. Depois de interrogar os guardas, ordenou que fossem levados para serem executados.[a] Em seguida, desceu da Judeia para Cesareia e permaneceu ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ordenou que fossem levados”. Neste contexto, isso provavelmente significa que foram levados para ser executados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: mandou procurá-lo
  rationale: No contexto, Herodes promove uma busca por Pedro; a formulação idiomática em português comunica a busca oficial sem exigir que ele a tenha realizado pessoalmente.
- source_word: μὴ εὑρὼν
  choice: mas não o encontrou
  rationale: Expressa com naturalidade o resultado negativo da busca e preserva a sequência anterior ao interrogatório.
- source_word: ἀνακρίνας
  choice: Depois de interrogar
  rationale: O verbo indica exame ou investigação formal; “interrogar” explicita adequadamente o caráter oficial da apuração feita com os guardas.
- source_word: τοὺς φύλακας
  choice: os guardas
  rationale: Equivalente português claro e corrente para os homens encarregados de custodiar Pedro.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: ordenou que fossem levados para a execução
  rationale: ἀπαχθῆναι significa literalmente ser levado, mas neste contexto provavelmente implica condução à execução. A tradução torna explícito esse sentido provável, enquanto a nota preserva a forma literal e a incerteza lexical.
- source_word: κατελθὼν
  choice: desceu
  rationale: Preserva a linguagem geográfica convencional da viagem da Judeia interior para a Cesareia costeira.
- source_word: ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: da Judeia para Cesareia
  rationale: Emprega as formas geográficas convencionais em português e mantém origem e destino.
- source_word: διέτριβεν
  choice: permaneceu ali
  rationale: O imperfeito indica permanência continuada; “permaneceu ali” é natural, digno e conciso.
theological_decisions:
- issue: Se ἀπαχθῆναι deve permanecer como o literal “ser levados” ou explicitar a pena implícita
  choice: ordenou que fossem levados para a execução
  alternative: ordenou que fossem levados
  rationale: O grego não usa aqui um verbo explícito para matar, mas o contexto judicial dos guardas que perderam o prisioneiro torna a execução muito provável. O texto principal comunica esse sentido contextual, e a nota registra a formulação literal para não ocultar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe participial grega foi dividida em períodos naturais. O marcador [a] aparece no texto principal imediatamente após a expressão esclarecida.
