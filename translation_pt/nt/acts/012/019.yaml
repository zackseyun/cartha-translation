  source_fidelity: A formulação «mandou procurá-lo» introduz uma nuance de ordem/delegação que não está expressa em ἐπιζητήσας, cujo sujeito é o próprio Herodes. «Procurou-o» preserva diretamente a ação atribuída a ele. O restante transmite adequadamente a sequência do grego, inclusive a investigação dos guardas, a ordem de levá-los embora e a ida da Judeia para Cesareia.
  naturalness: A redação é clara e de registro moderno. «Ordenou que fossem levados para serem executados» soa mais idiomático e explicita que a execução é o desfecho inferido, não o destino abstrato «para a execução».
  terminology: «Interrogar os guardas», «Judeia» e «Cesareia» são escolhas adequadas. A nota deve conservar a literalidade de ἀπαχθῆναι e indicar que a execução é uma inferência contextual provável.
