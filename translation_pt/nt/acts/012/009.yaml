id: ACT.12.9
reference: Acts 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: pt
  text: Pedro saiu e seguiu o anjo, mas não sabia que era real o que estava acontecendo por meio do anjo; pensava, porém, estar vendo uma visão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Pedro saiu
  rationale: O particípio aoristo indica uma ação anterior ou concomitante ao verbo principal; em português narrativo, a forma finita coordenada é natural. O nome Pedro é retomado do contexto para evitar ambiguidade sem acrescentar conteúdo.
- source_word: ἠκολούθει
  choice: o seguia
  rationale: O imperfeito descreve a ação em andamento. O pronome objeto explicita naturalmente em português que Pedro seguia o anjo, conforme o contexto imediato.
- source_word: οὐκ ᾔδει
  choice: Não sabia
  rationale: Tradução direta e corrente da ideia de conhecimento ou percepção.
- source_word: ἀληθές
  choice: real
  rationale: No contraste com uma visão, “real” comunica melhor a realidade objetiva do acontecimento do que o mais abstrato “verdadeiro”.
- source_word: τὸ γινόμενον
  choice: o que estava acontecendo
  rationale: Preserva o caráter progressivo do particípio presente substantivado em linguagem portuguesa natural.
- source_word: διὰ τοῦ ἀγγέλου
  choice: por meio do anjo
  rationale: διά com genitivo expressa agência mediada ou instrumentalidade; “por meio de” conserva essa nuance sem atribuir ao anjo uma atuação independente.
- source_word: ἐδόκει
  choice: pensava
  rationale: No contexto, descreve a impressão ou suposição de Pedro; o imperfeito português também mantém o pano de fundo durativo.
- source_word: ὅραμα
  choice: uma visão
  rationale: Equivalente corrente para uma experiência visual extraordinária ou revelatória, sem explicitação além do texto.
- source_word: βλέπειν
  choice: estar vendo
  rationale: Com “pensava”, a locução infinitiva expressa de modo natural a experiência que Pedro julgava estar tendo.
theological_decisions:
- issue: Natureza da ação angelical
  choice: por meio do anjo
  alternative: pelo anjo
  rationale: A formulação preserva a possível nuance de agência mediada de διά com genitivo e evita fazer uma afirmação teológica adicional sobre o poder ou a autonomia do anjo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases reduz a extensão sintática sem alterar a progressão narrativa. Nenhuma nota é necessária, pois “por meio do anjo” preserva diretamente a nuance relevante do grego.
