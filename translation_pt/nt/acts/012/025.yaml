source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: pt
  text: Barnabé e Saulo, porém, voltaram para Jerusalém[a] depois de concluírem o serviço, levando consigo João, chamado Marcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «de Jerusalém» em vez de «para Jerusalém».
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: O aoristo de ὑποστρέφω expressa aqui a ideia comum de retornar; «voltaram» é claro, conciso e natural.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: A preposição εἰς normalmente indica movimento para ou em direção a um lugar. A tradução segue diretamente o texto da SBLGNT fornecido, enquanto registra em nota a variante relevante.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: depois de concluírem o serviço
  rationale: O particípio aoristo indica uma ação concluída antes do retorno. διακονία tem aqui o sentido amplo de serviço prestado; «serviço» evita restringir o texto principal à entrega da ajuda, embora esse seja o contexto.
- source_word: συμπαραλαβόντες
  choice: levando consigo
  rationale: O particípio descreve Barnabé e Saulo tomando João como acompanhante; «levando consigo» é idiomático e mantém essa ação associada.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: João, chamado Marcos
  rationale: A construção passiva identifica João pelo nome pelo qual era chamado. A formulação é direta e não acrescenta explicitamente «também», ausente do grego.
theological_decisions:
- issue: Variante textual quanto ao ponto de chegada ou partida
  choice: para Jerusalém
  alternative: de Jerusalém
  rationale: O texto grego fornecido lê εἰς Ἰερουσαλήμ, «para Jerusalém». Alguns manuscritos apresentam ἐξ Ἰερουσαλήμ, «de Jerusalém», leitura coerente com o contexto narrativo. Segue-se a edição-fonte no texto principal e preserva-se a alternativa em nota, sem resolver silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Serviço» preserva a amplitude de διακονία sem introduzir no texto principal a especificação contextual «missão de ajuda».
