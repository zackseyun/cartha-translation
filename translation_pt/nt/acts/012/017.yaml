base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: pt
  text: 'Mas, fazendo-lhes sinal com a mão para que ficassem em silêncio, ele lhes contou como o Senhor o havia tirado da prisão. E disse: “Contem essas coisas a Tiago e aos irmãos[a].” Então saiu e foi para outro lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos irmãos e às irmãs”. O grego diz “aos irmãos”, expressão que, conforme o contexto, pode se referir à comunidade mais ampla de fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: fazendo-lhes sinal com a mão para que ficassem em silêncio
  rationale: Expressa naturalmente em português o gesto manual e sua finalidade, sem especificar além do grego o movimento exato.
- source_word: διηγήσατο
  choice: contou
  rationale: O verbo descreve a apresentação de um relato; “contou” é claro e corrente, mantendo o sentido narrativo.
- source_word: πῶς
  choice: como
  rationale: Introduz de modo direto o conteúdo do relato de Pedro e preserva a forma do grego.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Mantém o título empregado pelo texto sem determinar explicitamente se a referência é a Jesus em particular ou a Deus de modo mais amplo.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: o havia tirado da prisão
  rationale: Comunica a libertação do confinamento e usa o mais-que-perfeito composto para tornar clara a anterioridade em relação ao relato.
- source_word: Ἀπαγγείλατε
  choice: Contem
  rationale: Imperativo natural em português para transmitir a ordem de comunicar essas informações, sem formalidade excessiva.
- source_word: Ἰακώβῳ
  choice: Tiago
  rationale: Forma tradicional em português para o nome neotestamentário Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: aos irmãos
  rationale: Preserva o substantivo masculino plural do grego; uma possível referência mais ampla à comunidade de fiéis é registrada em nota.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: saiu e foi
  rationale: Preserva os dois movimentos verbais — deixar o local e dirigir-se a outro — de maneira concisa e idiomática.
- source_word: εἰς ἕτερον τόπον
  choice: para outro lugar
  rationale: Mantém a indefinição do destino presente no original.
theological_decisions:
- issue: Referente de κύριος
  choice: o Senhor
  alternative: explicitar “o Senhor Jesus” ou “Deus”
  rationale: O texto não especifica o referente além do título κύριος. A tradução conserva essa ambiguidade e não resolve a tensão teológica.
- issue: Abrangência de τοῖς ἀδελφοῖς
  choice: aos irmãos
  alternative: aos irmãos e às irmãs; aos demais fiéis
  rationale: A forma grega é masculina plural e pode designar homens especificamente ou, conforme o contexto, um grupo mais amplo de fiéis. O texto principal mantém a forma lexical, e a nota registra a possível abrangência inclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e os tempos verbais foram escolhidos para fluidez narrativa sem perder a sequência do grego.
