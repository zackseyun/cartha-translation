  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: pt
  text: 'E eis que um anjo do Senhor apareceu de repente[a], e uma luz brilhou na cela[b]. Ao bater no lado de Pedro, ele o acordou e disse: “Levante-se depressa!” Então as correntes lhe caíram das mãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs-se ao lado dele”. O verbo grego pode ressaltar tanto a presença repentina quanto o fato de ficar próximo.
    reason: lexical_alternative
  - marker: b
    text: Ou “no aposento” ou “no recinto”. O termo grego é mais geral, mas “cela” se ajusta ao contexto da prisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função vívida de chamar a atenção e mantém o caráter elevado, porém compreensível, da narrativa de Lucas.
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: Reproduz naturalmente a construção genitiva e preserva a ideia de um mensageiro pertencente ao Senhor ou enviado por ele.
- source_word: ἐπέστη
  choice: apareceu de repente
  rationale: Expressa a chegada ou presença súbita que o verbo pode indicar; a nota registra a alternativa espacial mais literal.
- source_word: φῶς ἔλαμψεν
  choice: uma luz brilhou
  rationale: Tradução direta e idiomática da combinação de substantivo e verbo.
- source_word: ἐν τῷ οἰκήματι
  choice: na cela
  rationale: Embora οἴκημα seja mais geral, o contexto prisional torna “cela” a designação mais clara do lugar.
- source_word: πατάξας
  choice: tocando com força
  rationale: Mantém a força física de πατάσσω sem sugerir, de modo indevido, uma agressão violenta; no contexto, o ato serve para despertar Pedro.
- source_word: τὴν πλευρὰν τοῦ Πέτρου
  choice: o lado de Pedro
  rationale: Formulação natural em português que conserva a referência anatômica do grego.
- source_word: ἤγειρεν αὐτόν
  choice: ele o despertou
  rationale: O contexto de Pedro adormecido favorece o sentido de acordar, embora o verbo também possa significar levantar.
- source_word: Ἀνάστα ἐν τάχει
  choice: Levante-se depressa!
  rationale: Imperativo atual e claro que comunica tanto a ação quanto a urgência.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: as correntes caíram das mãos de Pedro
  rationale: Preserva a imagem concreta de as correntes caírem das mãos; repetir “Pedro” evita uma sequência ambígua de pronomes em português.
theological_decisions:
- issue: Tradução de κύριος em ἄγγελος κυρίου
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” corresponde ao uso neotestamentário habitual e não acrescenta uma especificação doutrinária ausente da expressão grega.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “E eis que” conserva a vivacidade narrativa de Lucas; “tocando com força” evita tanto enfraquecer πατάξας como sugerir violência excessiva.
