source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: pt
  text: Quando amanheceu, não foi pequena a agitação entre os soldados quanto ao que tinha acontecido com Pedro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quando amanheceu
  rationale: Traduz naturalmente o genitivo absoluto temporal; δέ marca a transição narrativa sem exigir um advérbio explícito como “então” ou “ora”.
- source_word: τάραχος οὐκ ὀλίγος
  choice: não foi pequena a agitação
  rationale: Preserva a lítotes enfática do grego, comunicando uma agitação considerável sem substituir a figura por uma intensificação direta.
- source_word: ἐν τοῖς στρατιώταις
  choice: entre os soldados
  rationale: Mantém o sentido lexical de στρατιώταις e apresenta o grupo no qual surgiu a agitação; “guardas” seria uma especificação contextual.
- source_word: τί ἄρα ὁ Πέτρος ἐγένετο
  choice: que se perguntavam o que teria acontecido com Pedro
  rationale: Expressa em português corrente a pergunta indireta e o tom de perplexidade de τί ἄρα; o condicional composto “teria acontecido” comunica a incerteza dos soldados, enquanto “com Pedro” reproduz o valor idiomático de ἐγένετο aplicado a uma pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “não foi pequena” conserva a retórica do original, e “que se perguntavam” torna explícita, sem resolver, a perplexidade contida na pergunta indireta grega.
