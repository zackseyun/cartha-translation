  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: pt
  text: Mas a palavra de Deus continuava crescendo e se multiplicando[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a mensagem de Deus continuava crescendo e se espalhando».'
    reason: Alternativa lexical que explicita o sentido contextual de λόγος e torna idiomática a expansão da mensagem.
lexical_decisions:
- source_word: λόγος
  choice: palavra
  rationale: Preserva a expressão recorrente em Lucas, «a palavra de Deus», em seu sentido amplo de mensagem proclamada por Deus. «Mensagem» é uma alternativa contextualmente possível e é indicada em nota.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Traduz naturalmente o genitivo, indicando a palavra que pertence a Deus ou procede dele.
- source_word: ηὔξανεν
  choice: continuava crescendo
  rationale: O imperfeito indica ação progressiva; esta formulação comunica sua continuidade em português corrente.
- source_word: ἐπληθύνετο
  choice: se multiplicando
  rationale: Mantém a distinção em relação a «crescendo» e reproduz a imagem de expansão, entendida no contexto como a difusão e o efeito cada vez maiores da palavra.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste narrativo entre a morte de Herodes no contexto anterior e o avanço contínuo da palavra de Deus.
theological_decisions:
- issue: Traduzir «a palavra de Deus» de modo mais dinâmico como «a mensagem de Deus»
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: A opção escolhida preserva a formulação recorrente de Lucas e sua ressonância bíblica e proclamativa, sem excluir o sentido contextual de mensagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção progressiva preserva o aspecto durativo dos dois imperfeitos; a personificação da palavra foi mantida como no grego.
