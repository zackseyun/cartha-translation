  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: pt
  text: Então, ao se dar conta do que havia acontecido, ele foi à casa de Maria, mãe de João, chamado Marcos, onde muitos estavam reunidos e oravam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: ao se dar conta do que havia acontecido
  rationale: O particípio aoristo indica que Pedro compreendeu plenamente sua situação após a partida do anjo. A explicitação contextual é natural em português e evita um pronome sem antecedente claro no versículo isolado.
- source_word: τε
  choice: Então
  rationale: A partícula estabelece uma ligação narrativa suave; “Então” expressa a sequência sem lhe atribuir força excessiva.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: foi à casa
  rationale: A expressão indica movimento em direção ao lugar; “foi à casa” é idiomático e adequado ao ponto de vista narrativo.
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: de Maria, mãe de João
  rationale: Mantém explicitamente a relação familiar que identifica Maria, com formulação natural em português.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: chamado Marcos
  rationale: O particípio passivo identifica João por outro nome, sem exigir que se acrescente “também”.
- source_word: οὗ
  choice: onde
  rationale: O advérbio relativo retoma naturalmente a casa de Maria como local da reunião.
- source_word: ἱκανοὶ
  choice: muitos
  rationale: No plural, o termo denota um número considerável de pessoas; “muitos” é claro e direto.
- source_word: συνηθροισμένοι
  choice: estavam reunidos
  rationale: A construção perifrástica com particípio perfeito descreve o estado resultante de terem se reunido.
- source_word: καὶ προσευχόμενοι
  choice: e oravam
  rationale: O particípio presente apresenta a oração como atividade em andamento enquanto permaneciam reunidos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a sequência narrativa e evita explicações denominacionais. Não há marcador de nota, pois a alternativa “também chamado Marcos” não altera substancialmente o sentido e o grego não contém um elemento correspondente a “também”.
