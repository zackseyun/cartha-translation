reference: Acts 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: pt
  text: Assim, Pedro era mantido na prisão, mas a igreja orava intensamente a Deus por ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fervorosamente” ou “com perseverança”; o advérbio grego pode enfatizar a intensidade ou a persistência da oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: continuava preso
  rationale: O imperfeito passivo indica uma situação contínua de custódia. Em português, “continuava preso” expressa isso com naturalidade, sem especificar além do texto o modo da vigilância.
- source_word: ἐν τῇ φυλακῇ
  choice: preso
  rationale: A expressão situa Pedro na prisão; incorporá-la em “continuava preso” evita a formulação menos natural “era mantido na prisão” sem perder o sentido.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: orava
  rationale: A construção perifrástica descreve uma ação em andamento. O imperfeito português transmite essa continuidade de maneira clara e idiomática.
- source_word: ἐκτενῶς
  choice: intensamente
  rationale: O advérbio comunica intensidade e pode também sugerir persistência. “Intensamente” preserva o núcleo sem impor apenas uma dessas nuances.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: a igreja
  rationale: ἐκκλησία designa aqui a comunidade cristã. A mudança natural da passiva grega para a ativa portuguesa mantém a igreja como agente da oração.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: Com objeto pessoal, πρός indica a direção da oração; “a Deus” é a expressão portuguesa natural.
- source_word: περὶ αὐτοῦ
  choice: por ele
  rationale: No contexto de intercessão, περί com genitivo significa oração em favor de Pedro.
- source_word: μὲν οὖν ... δὲ
  choice: Assim ... mas ...
  rationale: As partículas promovem a narrativa e estabelecem contraste entre a prisão contínua de Pedro e a oração da igreja.
theological_decisions:
- issue: Tradução de ἐκκλησία
  choice: igreja
  alternative: comunidade / assembleia
  rationale: O termo se refere à comunidade cristã que intercedia por Pedro. “Igreja” é corrente e adequado ao contexto, sem exigir uma estrutura institucional ou denominacional posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem ativa para maior naturalidade. A continuidade das duas ações é expressa por “continuava” e pelo imperfeito “orava”; a nota preserva a amplitude semântica de ἐκτενῶς.
