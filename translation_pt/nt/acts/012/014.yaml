  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: pt
  text: Quando reconheceu a voz de Pedro, de alegria não abriu o portão[a]; em vez disso, correu para dentro e informou que Pedro estava diante do portão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entrada” ou “porta externa”; o termo grego se refere ao acesso da rua para a propriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: quando reconheceu
  rationale: O particípio aoristo indica que ela identificou a voz ao ouvi-la; a oração temporal é natural em português e mantém a sequência narrativa.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: a voz de Pedro
  rationale: No contexto, φωνή se refere especificamente à voz de Pedro, não apenas a um som.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: de tanta alegria
  rationale: A expressão indica causa e intensidade emocional; esta formulação corrente explica naturalmente por que ela não abriu o portão.
- source_word: οὐκ ἤνοιξεν
  choice: não abriu
  rationale: Traduz diretamente ἀνοίγω sem acrescentar a ideia não expressa de destrancar.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: o portão / do portão
  rationale: πυλών designa a entrada exterior que dava acesso à propriedade; “portão” é claro e natural no contexto doméstico.
- source_word: εἰσδραμοῦσα
  choice: correu para dentro
  rationale: Preserva tanto o movimento rápido quanto sua direção para o interior.
- source_word: ἀπήγγειλεν
  choice: anunciou
  rationale: ἀπαγγέλλω comunica que ela levou a notícia aos que estavam dentro; “anunciou” mantém o tom narrativo sem excessiva formalidade.
- source_word: ἑστάναι
  choice: estava
  rationale: O infinitivo perfeito tem sentido resultativo ou estativo. Com a indicação de lugar, “estava diante do portão” transmite naturalmente esse estado contínuo; explicitar “em pé” seria possível, mas menos necessário em português.
- source_word: πρὸ τοῦ πυλῶνος
  choice: diante do portão
  rationale: Representa com precisão o sentido espacial de πρό com o genitivo, isto é, em frente à entrada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com ampla legibilidade brasileira. A construção “de tanta alegria” preserva a causa expressa no grego e o ponto cômico da cena. O ponto e vírgula seguido de “em vez disso” reproduz o contraste sem tornar a frase pesada.
