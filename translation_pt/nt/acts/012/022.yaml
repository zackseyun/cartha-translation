  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: pt
  text: 'E a multidão continuava gritando: “Voz de um deus[a], e não de um homem!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Voz de Deus, e não de um homem!” O grego permite essa leitura, mas, no contexto, o sentido mais provável é “de um deus”, refletindo a aclamação pagã dirigida a Herodes.'
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: a multidão
  rationale: No contexto, refere-se à população reunida que aclama Herodes, e não a um órgão político formal. “A multidão” é natural e claro em português.
- source_word: ἐπεφώνει
  choice: continuava gritando
  rationale: O imperfeito grego apresenta a aclamação como ação contínua ou repetida; a expressão preserva esse aspecto.
- source_word: Θεοῦ
  choice: de um deus
  rationale: Embora a forma grega possa também ser entendida como “de Deus”, o contexto pagão da aclamação a Herodes favorece o sentido genérico “de um deus”.
- source_word: φωνὴ
  choice: Voz
  rationale: Preserva a formulação nominal e exclamativa do grego. A ausência de artigo em português produz uma aclamação direta e natural.
- source_word: ἀνθρώπου
  choice: de um homem
  rationale: Mantém o contraste nominal e individual entre deus e homem, sem substituí-lo pela formulação mais interpretativa “humana”.
theological_decisions:
- issue: Se Θεοῦ deve ser traduzido como “de Deus” ou “de um deus”
  choice: de um deus
  alternative: de Deus
  rationale: A multidão pagã está atribuindo caráter divino a Herodes. “De um deus” representa melhor esse ambiente histórico sem sugerir necessariamente uma referência ao Deus de Israel; a leitura alternativa permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Continuava gritando” conserva o valor imperfectivo, e a construção exclamativa sem verbo mantém a concisão do original.
