base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: pt
  text: Quando ele bateu à porta da entrada, uma jovem serva[a] chamada Rode veio atender.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jovem escrava”. O grego παιδίσκη pode designar uma jovem serva ou escrava; o contexto destaca sua função na casa, sem esclarecer sua condição jurídica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Quando ele bateu
  rationale: O particípio aoristo com δέ dá sequência à narrativa e tem valor temporal; “quando ele bateu” é natural em português.
- source_word: θύραν τοῦ πυλῶνος
  choice: à porta da entrada
  rationale: A expressão conserva θύρα como “porta” e representa πυλών como a entrada ou passagem de acesso à casa, sem sugerir indevidamente um portão urbano.
- source_word: προσῆλθε
  choice: veio
  rationale: No contexto doméstico, “veio” expressa de modo idiomático o movimento de aproximação; o infinitivo seguinte indica a finalidade.
- source_word: παιδίσκη
  choice: jovem serva
  rationale: O termo pode designar uma jovem serva ou escrava. “Jovem serva” preserva a ideia de idade e função doméstica sem decidir silenciosamente sua condição jurídica; a alternativa é registrada em nota.
- source_word: ὑπακοῦσαι
  choice: atender
  rationale: Embora o verbo possa significar “ouvir” ou “obedecer”, neste contexto significa responder a quem bate à porta; “atender” é a formulação portuguesa mais natural.
- source_word: ὀνόματι Ῥόδη
  choice: chamada Rode
  rationale: A construção introduz o nome da jovem. “Rode” é a forma tradicional e inteligível do nome em português.
