source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: pt
  text: 'E o anjo lhe disse: “Prenda o cinto[a] e calce as sandálias.” Ele fez isso. Então o anjo lhe diz[b]: “Vista o manto[c] e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cinja-se”. O verbo grego se refere a prender o cinto para estar pronto.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “lhe diz”, no presente histórico, empregado para dar vivacidade à narrativa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Ponha o manto ao redor do corpo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: anjo
  rationale: No contexto de Atos 12, trata-se do ser celestial que apareceu na prisão; “anjo” é a tradução contextual natural, em vez do sentido geral “mensageiro”.
- source_word: Ζῶσαι
  choice: Prenda o cinto
  rationale: O imperativo médio de ζώννυμι indica cingir-se, prendendo o cinto para estar pronto. A formulação é concreta e clara em português atual.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: calce as sandálias
  rationale: “Calçar” expressa de modo idiomático e conciso a ação de pôr as sandálias nos pés.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Ele fez isso
  rationale: οὕτως resume a obediência de Pedro às duas ordens anteriores; a expressão é natural e direta.
- source_word: λέγει
  choice: lhe diz
  rationale: Mantém o presente histórico grego e sua vivacidade narrativa, apesar da mudança de tempo em relação a εἶπεν.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Vista o manto
  rationale: ἱμάτιον designa aqui a veste exterior, e περιβάλλω indica colocá-la ao redor do corpo. “Vista o manto” comunica a ação naturalmente, sem tornar explícito mais do que o necessário.
- source_word: ἀκολούθει μοι
  choice: siga-me
  rationale: Preserva o sentido direto de ἀκολουθέω e sua ligação lexical com o motivo neotestamentário de seguir, embora aqui a ordem também descreva movimento literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Prenda o cinto” e “calce as sandálias” são expressões correntes; “manto” preserva a referência à veste exterior. O presente histórico em “lhe diz” conserva a textura narrativa do grego.
