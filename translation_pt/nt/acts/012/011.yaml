id: ACT.12.11
reference: Acts 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: pt
  text: 'Então Pedro, caindo em si[a], disse: “Agora sei de verdade que o Senhor enviou o seu anjo e me livrou da mão de Herodes[b] e de tudo o que o povo judeu esperava que acontecesse[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltando a si” ou “recobrando os sentidos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “da mão de Herodes” significa do poder ou domínio de Herodes.
    reason: cultural_note
  - marker: c
    text: Mais literalmente, “de toda a expectativa do povo judeu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: caindo em si
  rationale: Expressão idiomática portuguesa que conserva a imagem do grego e indica que Pedro voltou à plena consciência do que estava acontecendo.
- source_word: ἀληθῶς
  choice: de verdade
  rationale: Comunica com naturalidade a certeza enfática de Pedro; evita uma formulação excessivamente solene.
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: Transmite de modo direto e natural o ato de mandar o anjo, sem tornar explícita uma nuance do verbo composto que o contexto não exige.
- source_word: κύριος
  choice: o Senhor
  rationale: Mantém o título não especificado empregado pelo texto grego, sem decidir se a referência direta é a Deus ou ao Jesus ressuscitado.
- source_word: ἄγγελον
  choice: anjo
  rationale: O contexto narrativo indica claramente um ser celestial, não apenas um mensageiro humano.
- source_word: ἐξείλατό με
  choice: me livrou
  rationale: Expressa intervenção salvadora e libertação do perigo em português corrente e digno.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: das mãos de Herodes
  rationale: Preserva a metáfora bíblica da mão como poder ou domínio, usando a forma idiomática natural em português.
- source_word: πάσης τῆς προσδοκίας
  choice: de tudo o que ... esperava que acontecesse
  rationale: Torna explícito apenas o complemento implícito de 'expectativa' necessário para uma frase natural em português, sem especificar qual resultado era esperado.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: o povo judeu
  rationale: Equivalente português natural e preciso para a construção genitiva grega, evitando o artificial 'o povo dos judeus'.
theological_decisions:
- issue: Referente de κύριος
  choice: o Senhor
  alternative: Deus; o Jesus ressuscitado
  rationale: O grego não identifica expressamente o referente. A tradução conserva a ambiguidade e a tensão teológica do texto.
- issue: Conteúdo da expectativa do povo judeu
  choice: tudo o que o povo judeu esperava que acontecesse
  alternative: toda a expectativa do povo judeu
  rationale: A formulação natural mantém sem especificação o desfecho esperado, em vez de afirmar diretamente que o povo desejava a morte de Pedro ou outro resultado particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa foi preservada; as expressões idiomáticas foram vertidas de modo natural, mantendo notas para a imagem grega e para a formulação mais literal.
