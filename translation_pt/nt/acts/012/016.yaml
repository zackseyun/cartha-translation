  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: pt
  text: Mas Pedro continuava batendo[a]. Quando abriram[b], viram-no e ficaram espantados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “persistia em bater”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Tendo aberto, viram-no e ficaram espantados”. O objeto de “abriram”, provavelmente a porta ou o portão, fica implícito no grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: continuava
  rationale: O imperfeito expressa ação prolongada ou repetida; combinado com o particípio, “continuava batendo” comunica isso de modo natural em português.
- source_word: κρούων
  choice: batendo
  rationale: Neste contexto, κρούω se refere a bater à porta. O objeto pode permanecer implícito em português, como no grego, pois o contexto o torna claro.
- source_word: ἀνοίξαντες
  choice: Quando abriram
  rationale: O particípio aoristo é entendido temporalmente e indica a ação anterior a ver Pedro. A formulação evita acrescentar “a porta” ao texto principal, embora esse seja o sentido contextual.
- source_word: εἶδαν αὐτόν
  choice: viram-no
  rationale: Tradução direta e natural da expressão narrativa, sem intensificação interpretativa.
- source_word: ἐξέστησαν
  choice: ficaram espantados
  rationale: Expressa a forte surpresa indicada por ἐξίστημι em linguagem atual e digna.
- source_word: δὲ
  choice: Mas / conexão não explicitada
  rationale: O primeiro δέ marca contraste com a situação anterior e é traduzido por “Mas”; o segundo é representado naturalmente pela passagem à oração temporal, sem conjunção adicional.
- source_word: Πέτρος
  choice: Pedro
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
