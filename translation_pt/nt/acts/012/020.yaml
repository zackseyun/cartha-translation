  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: pt
  text: Herodes estava profundamente irado com os habitantes de Tiro e Sidom[a]. Eles, porém, dirigiram-se a ele de comum acordo e, depois de persuadirem Blasto, o camareiro do rei[b], pediam paz, pois a região deles recebia alimentos dos domínios reais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantinha forte hostilidade contra os habitantes de Tiro e Sidom”. O termo grego expressa ira intensa ou hostilidade.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o encarregado do quarto de dormir do rei”; provavelmente um oficial da corte com acesso aos aposentos privados do rei.
    reason: cultural_note
  - marker: c
    text: 'Ou: “porque o território deles era abastecido de alimentos pelo território real”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: estava profundamente irado com
  rationale: Expressa ira intensa ou hostilidade ativa; a formulação é natural e digna em português sem enfraquecer a força do termo.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: os habitantes de Tiro e Sidom
  rationale: Transmite claramente os gentílicos gregos em forma imediatamente compreensível no português internacional.
- source_word: ὁμοθυμαδόν
  choice: juntos
  rationale: No contexto, indica ação conjunta e propósito comum; a construção preserva essa unidade sem recorrer ao menos corrente 'de comum acordo'.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: foram ... procurá-lo
  rationale: Representa de modo natural a ideia de comparecer ou dirigir-se a alguém.
- source_word: πείσαντες
  choice: depois de conquistarem o apoio de
  rationale: No contexto de acesso político por intermédio de um oficial, 'conquistar o apoio' expressa melhor que uma persuasão meramente intelectual o sentido pragmático do particípio, preservando a anterioridade da ação.
- source_word: Βλάστον
  choice: Blasto
  rationale: Forma tradicional e natural do nome pessoal em português.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: o camareiro do rei
  rationale: Designa concisamente o oficial ligado aos aposentos privados do rei; a nota esclarece a expressão literal e sua provável função.
- source_word: ᾐτοῦντο εἰρήνην
  choice: pediam paz
  rationale: Preserva o aspecto durativo ou reiterado do imperfeito e o sentido diplomático do pedido.
- source_word: διὰ τὸ τρέφεσθαι
  choice: porque ... recebia alimentos
  rationale: Explicita de maneira natural a causa e o suprimento alimentar indicado pelo infinitivo passivo.
- source_word: αὐτῶν τὴν χώραν
  choice: a região deles
  rationale: χώρα pode significar região, território ou país; 'região' evita sugerir um Estado nacional moderno.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: dos domínios do rei
  rationale: O adjetivo substantivado refere-se provavelmente ao território pertencente ao rei; o plural idiomático 'domínios' comunica essa ideia com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O nome 'Herodes', implícito no pronome e recuperável do contexto imediato, foi explicitado para evitar ambiguidade em português. A coordenação adversativa foi preservada, e o aspecto contínuo de ᾐτοῦντο foi representado por 'pediam'.
