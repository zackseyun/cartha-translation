  source_fidelity: A tradução transmite adequadamente a hostilidade intensa de θυμομαχῶν, o pedido contínuo de paz e a dependência alimentar da região em relação aos domínios reais. Contudo, “juntos” reduz a ideia de ação unida/de propósito comum em ὁμοθυμαδόν, e “conquistarem o apoio” interpreta πείσαντες mais especificamente do que o texto, que diz simplesmente que persuadiram Blasto.
  naturalness: O texto é claro e de registro apropriado. “Dirigiram-se a ele de comum acordo” é mais natural no contexto diplomático e representa melhor a unidade indicada pelo grego do que “foram juntos procurá-lo”.
  terminology: “Herodes”, “Tiro”, “Sidom”, “Blasto” e “camareiro” são adequados. “Camareiro” é uma equivalência funcional aceitável, com a nota literal explicativa. “Domínios reais” representa bem a expressão substantivada τῆς βασιλικῆς sem afirmar indevidamente uma delimitação geográfica precisa.
