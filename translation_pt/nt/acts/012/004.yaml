id: ACT.12.4
reference: Acts 12:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: pt
  text: Depois de prendê-lo, colocou-o na prisão e o entregou a quatro grupos de soldados[a] para que o guardassem, com a intenção de apresentá-lo ao povo depois da Páscoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quatro grupos de quatro soldados”, isto é, dezesseis soldados distribuídos em quatro grupos.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Páscoa” se refere à celebração judaica.
    reason: cultural_clarification
lexical_decisions:
- source_word: πιάσας
  choice: depois de prendê-lo
  rationale: O particípio aoristo indica uma ação anterior à principal; a formulação expressa naturalmente a sequência e o ato de pôr Pedro sob custódia.
- source_word: ἔθετο εἰς φυλακήν
  choice: colocou-o na prisão
  rationale: Reproduz com clareza e dignidade a expressão idiomática de encarceramento.
- source_word: παραδοὺς
  choice: o entregou
  rationale: Indica a transferência de Pedro à custódia dos soldados, sem acrescentar conotação teológica indevida.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: a quatro grupos de soldados
  rationale: τετράδιον designa um grupo de quatro. A redação corrente permanece legível, e a composição exata dos grupos é explicitada em nota.
- source_word: φυλάσσειν αὐτόν
  choice: para que o guardassem
  rationale: Expressa o propósito do ato de entregá-lo aos soldados e se ajusta naturalmente à sintaxe portuguesa.
- source_word: βουλόμενος
  choice: com a intenção
  rationale: Comunica propósito deliberado sem intensificar o sentido como desejo emocional.
- source_word: μετὰ τὸ πάσχα
  choice: depois da Páscoa
  rationale: πάσχα designa a Páscoa judaica. Em português, “Páscoa” é a correspondência lexical normal, embora possa também designar a celebração cristã; o contexto determina o referente.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: apresentá-lo ao povo
  rationale: No contexto público e judicial, a expressão indica conduzi-lo para comparecer diante do povo. “Apresentá-lo” é natural e evita afirmar explicitamente uma audiência formal que o grego não especifica.
- source_word: λαῷ
  choice: o povo
  rationale: Mantém o sentido coletivo amplo e o uso corrente de λαός em Atos.
theological_decisions:
- issue: Sentido de πάσχα
  choice: Páscoa, entendida no contexto como a celebração judaica
  alternative: Uma designação cristã posterior da Páscoa
  rationale: O termo grego πάσχα se refere à Páscoa judaica neste contexto. A tradução preserva seu equivalente português normal, e a nota elimina possível ambiguidade cultural sem importar tradição inglesa.
- issue: Natureza da apresentação ao povo
  choice: apresentá-lo ao povo
  alternative: levá-lo a julgamento diante do povo
  rationale: O contexto sugere uma apresentação pública com provável finalidade judicial, mas o versículo não explicita “julgamento”; por isso, a tradução não resolve além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura participial grega foi convertida em sequência verbal natural. Evitou-se “quadrigêmios”, termo técnico e pouco acessível, preservando-se a precisão em nota.
