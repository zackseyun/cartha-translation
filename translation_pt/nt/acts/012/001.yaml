  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: pt
  text: Por volta daquele tempo[a], o rei Herodes lançou mão[b] de alguns da igreja para maltratá-los[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naquele tempo” ou “Por aquela época”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “lançou as mãos sobre”. A expressão indica aqui uma ação hostil contra alguns da igreja.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para lhes causar dano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Por volta daquele tempo
  rationale: κατά com acusativo temporal indica aproximadamente aquele período. A formulação é natural em português e preserva a aproximação temporal; o leve valor de transição de δέ fica implícito no desenvolvimento da narrativa.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: pôs as mãos em
  rationale: Preserva a imagem idiomática grega e, com a finalidade expressa em seguida, comunica uma ação hostil sem restringi-la indevidamente a uma prisão formal.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: o rei Herodes
  rationale: É a ordem idiomática e corrente em português para o título em aposição, sem perda de conteúdo.
- source_word: κακῶσαί
  choice: para maltratá-los
  rationale: O verbo indica causar mal ou tratar de modo cruel. “Maltratar” expressa a hostilidade pessoal sem introduzir necessariamente o sentido mais técnico de “perseguir”.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: alguns membros da igreja
  rationale: A expressão identifica algumas pessoas pertencentes à comunidade cristã. “Membros da igreja” é mais natural em português do que uma reprodução rígida de “alguns dos provenientes da igreja”.
theological_decisions:
- issue: Tradução de ἐκκλησία
  choice: igreja
  alternative: assembleia; comunidade
  rationale: Em Atos, neste contexto, o termo designa a comunidade cristã. “Igreja” é a tradução corrente e reconhecível, sem especificar uma estrutura denominacional.
- issue: Amplitude da ação hostil de Herodes
  choice: pôs as mãos em
  alternative: mandou prender; atacou
  rationale: A expressão mantém a amplitude do idioma grego e deixa o infinitivo de finalidade esclarecer a intenção de causar maus-tratos. “Mandou prender” seria mais específico do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o idioma concreto do grego, enquanto as notas esclarecem suas alternativas temporais e semânticas.
