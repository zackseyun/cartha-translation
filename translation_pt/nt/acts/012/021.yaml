  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: pt
  text: No dia marcado, Herodes vestiu trajes reais e sentou-se na tribuna[a], e dirigia-lhes um discurso público.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tribunal” ou “no estrado oficial”. O termo grego pode designar um assento oficial ou uma plataforma elevada.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: No dia marcado
  rationale: Expressa de modo natural o sentido de um dia fixado ou designado, sem acrescentar um advérbio temporal ausente do grego.
- source_word: ἐνδυσάμενος ἐσθῆτα βασιλικὴν
  choice: vestiu trajes reais
  rationale: Reproduz a ação anterior do particípio aoristo em sequência narrativa natural; 'trajes' mantém o sentido amplo e coletivo de vestimenta régia.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: sentado na tribuna
  rationale: Em português, 'tribuna' comunica com naturalidade o estrado ou assento oficial elevado, sem pressupor que estivesse em curso um julgamento.
- source_word: ἐδημηγόρει
  choice: fazia um discurso público
  rationale: O verbo indica um pronunciamento perante uma assembleia; o imperfeito é preservado por 'fazia', que apresenta a ação em andamento.
- source_word: πρὸς αὐτούς
  choice: diante deles
  rationale: Identifica o grupo como a audiência perante a qual Herodes discursava; é idiomático no contexto de um pronunciamento público.
