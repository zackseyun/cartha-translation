  register: 'Português moderno, claro e digno, com fluidez narrativa. A coordenação dos particípios gregos foi reorganizada sem alterar a sequência: Herodes vestiu os trajes reais, tomou seu lugar e então discursava. O marcador [a] aparece no texto principal.'
