    issue: “Então” para o segundo δέ
    rationale: δέ aqui marca a continuação ou o contraste entre a insistência de Rode e a resposta dos demais, não necessariamente uma progressão temporal. “Mas” é mais próximo e preserva melhor a dinâmica do diálogo.
  - severity: low
    issue: “que era verdade” para οὕτως ἔχειν
    rationale: A expressão significa literalmente que a situação era “assim/desse modo”, isto é, que a afirmação dela correspondia aos fatos. “Que era assim” conserva mais diretamente essa formulação idiomática sem alterar o sentido.
