  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: pt
  text: 'Mas eles lhe disseram: “Você está fora de si.” Ela, porém, continuava insistindo que era assim. Mas eles continuavam dizendo: “É o anjo dele.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o anjo da guarda dele”, “o anjo que o representa” ou, segundo alguns intérpretes, “o espírito/fantasma dele”. O grego diz simplesmente “o anjo dele”.
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Você está fora de si
  rationale: Expressa de modo natural e atual a acusação idiomática de loucura, sem o tom clínico de “insana” nem a possível ambiguidade de “louca”.
- source_word: διϊσχυρίζετο
  choice: continuava insistindo
  rationale: O imperfeito e a força enfática do verbo indicam insistência persistente ou repetida.
- source_word: οὕτως ἔχειν
  choice: que era verdade
  rationale: Traduz naturalmente a expressão idiomática “ser assim / ser esse o caso”, referindo-se à afirmação anterior de Rode.
- source_word: ἔλεγον
  choice: continuavam dizendo
  rationale: O imperfeito sugere fala continuada ou repetida, aspecto preservado na tradução.
- source_word: ἄγγελός
  choice: anjo
  rationale: Neste contexto, o termo provavelmente designa um ser sobrenatural; “anjo” é a tradução usual e preserva a formulação sem explicá-la.
- source_word: αὐτοῦ
  choice: dele
  rationale: O genitivo masculino singular refere-se naturalmente a Pedro e é expresso em português pelo possessivo pós-nominal “dele”.
theological_decisions:
- issue: Sentido de “o anjo dele”
  choice: Manter literalmente “o anjo dele” no texto principal.
  alternative: “seu anjo da guarda”, “seu anjo representante” ou, segundo alguns intérpretes, “seu espírito/fantasma”.
  rationale: O grego diz apenas ὁ ἄγγελος αὐτοῦ e não esclarece a crença pressuposta pelos falantes. A tradução preserva essa ambiguidade e deixa as interpretações possíveis para a nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você está fora de si” reproduz a fala direta com naturalidade; “continuava insistindo” e “continuavam dizendo” preservam o valor durativo dos imperfeitos. A nota mantém aberta a ambiguidade teológica de ὁ ἄγγελος αὐτοῦ.
