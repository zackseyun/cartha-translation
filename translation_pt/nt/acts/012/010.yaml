id: ACT.12.10
reference: Acts 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: pt
  text: Depois de passarem pelo primeiro posto de guarda e pelo segundo, chegaram ao portão de ferro que dava acesso à cidade, que se abriu por si só para eles. Depois de saírem, seguiram por uma rua[a], e imediatamente o anjo se afastou dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode indicar que percorreram a distância de uma rua antes que o anjo o deixasse.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Depois de passarem
  rationale: O particípio aoristo indica uma ação anterior à chegada ao portão; a oração temporal expressa com clareza essa sequência em português.
- source_word: φυλακὴν
  choice: posto de guarda
  rationale: Neste contexto, o termo se refere mais naturalmente aos sucessivos pontos de vigilância pelos quais Pedro e o anjo passaram, e não à prisão em sentido abstrato.
- source_word: ἦλθαν ἐπὶ
  choice: chegaram ao
  rationale: Expressa de modo natural a chegada ao portão, mantendo o movimento da narrativa.
- source_word: πύλην τὴν σιδηρᾶν
  choice: portão de ferro
  rationale: Formulação corrente e clara em português, preservando a indicação do material.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: que dava acesso à cidade
  rationale: O particípio descreve a função ou direção do portão; esta expressão é idiomática e não sugere que o portão se movia.
- source_word: αὐτομάτη
  choice: por si só
  rationale: Comunica que o portão se abriu sem intervenção humana, sem a possível conotação tecnológica moderna de “automaticamente”.
- source_word: ἠνοίγη αὐτοῖς
  choice: se abriu ... para eles
  rationale: Mantém o portão como sujeito do acontecimento e representa naturalmente o dativo αὐτοῖς.
- source_word: ἐξελθόντες
  choice: Depois de saírem
  rationale: A oração temporal preserva a sequência marcada pelo particípio aoristo.
- source_word: προῆλθον ῥύμην μίαν
  choice: avançaram por uma rua
  rationale: Mantém a referência concreta a uma única rua, sem eliminar a possível ideia de extensão percorrida.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente corrente e digno para a rápida sequência do acontecimento.
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: o anjo se afastou dele
  rationale: Reproduz a separação física expressa pelo verbo e pela preposição sem acrescentar explicação.
theological_decisions:
- issue: Natureza da abertura do portão
  choice: o qual se abriu por si só para eles
  alternative: o qual se abriu automaticamente para eles
  rationale: O texto relata o acontecimento extraordinário sem explicar seu mecanismo. “Por si só” conserva essa apresentação e evita uma leitura tecnológica moderna.
- issue: Referência de φυλακή
  choice: primeiro e segundo posto de guarda
  alternative: primeira e segunda guarda
  rationale: O contexto da fuga indica sucessivos pontos de vigilância. “Posto de guarda” torna esse sentido contextual explícito sem introduzir detalhes ausentes do texto.
- issue: Sentido de ῥύμην μίαν
  choice: avançaram por uma rua
  alternative: percorreram a distância de uma rua
  rationale: A construção pode designar uma rua concreta ou a extensão correspondente a uma rua. O texto principal preserva a formulação concreta, e a nota registra a provável nuance de distância.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Posto de guarda” esclarece o cenário; “portão de ferro” e “por si só” evitam tanto arcaísmo quanto linguagem mecanicista. A repetição de “Depois de” mantém transparentes as relações temporais dos particípios gregos.
