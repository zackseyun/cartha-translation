id: ACT.12.23
reference: Acts 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: pt
  text: Imediatamente, um anjo do Senhor o feriu, porque ele não deu a glória a Deus; e, comido por vermes, morreu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “expirou” ou “deu o último suspiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Imediatamente
  rationale: Expressa que a ação ocorreu sem demora e preserva a brusquidão do juízo.
- source_word: ἐπάταξεν
  choice: feriu
  rationale: Traduz o ato de golpear sem antecipar o resultado fatal, que é declarado ao fim do versículo.
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: A construção grega não tem artigo diante de ἄγγελος; a forma indefinida é natural e adequada neste contexto.
- source_word: ἀνθ’ ὧν
  choice: porque
  rationale: Comunica de modo claro e idiomático a relação causal introduzida pela expressão grega.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: não deu a glória a Deus
  rationale: Preserva o artigo de τὴν δόξαν e o sentido de atribuir a Deus a honra que lhe era devida.
- source_word: γενόμενος σκωληκόβρωτος
  choice: comido por vermes
  rationale: Reproduz de modo claro e vívido o estado expresso pelo particípio e pelo adjetivo composto, sem impor uma reconstrução médica.
- source_word: ἐξέψυξεν
  choice: morreu
  rationale: É a forma corrente e direta de expressar o sentido idiomático do verbo; a alternativa literal é registrada em nota.
theological_decisions:
- issue: Natureza e sequência do juízo
  choice: O texto apresenta a morte de Herodes como juízo divino mediado por um anjo, seguido de ele ser comido por vermes e morrer.
  alternative: Entender a descrição como uma morte puramente natural em linguagem religiosa, ou afirmar que a morte ocorreu exatamente no instante em que o anjo o feriu.
  rationale: O grego atribui explicitamente o golpe a um anjo do Senhor e declara como motivo a recusa de dar glória a Deus. A construção participial não permite definir com precisão adicional o mecanismo médico nem o intervalo temporal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação conserva a progressão da frase grega. “Comido por vermes” é mais natural em português atual do que um composto como “roído de vermes”; a nota preserva a alternativa mais literal para ἐξέψυξεν.
