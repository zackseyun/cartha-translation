id: ACT.10.38
reference: Acts 10:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: pt
  text: 'Jesus de Nazaré: Deus o ungiu com o Espírito Santo e com poder; ele andou por toda parte fazendo o bem e curando todos os que eram oprimidos pelo diabo, porque Deus estava com ele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois Deus estava com ele”.'
    reason: Alternativa legítima para ὅτι, mantendo o valor explicativo ou causal com uma ligação discursiva ligeiramente diferente.
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Jesus de Nazaré
  rationale: A expressão identifica Jesus por sua procedência. “De Nazaré” é a forma portuguesa natural e tradicional, sem perder o sentido de ἀπό.
- source_word: ὡς
  choice: como
  rationale: Introduz a explicação narrativa sobre Jesus e sua unção. “Como” conserva o caráter expositivo da construção grega; “que” também é possível, mas torna a formulação mais meramente declarativa.
- source_word: ἔχρισεν
  choice: ungiu
  rationale: Reproduz diretamente χρίω e preserva suas ressonâncias messiânicas e de capacitação divina sem inserir no texto uma explicação doutrinária.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: com o Espírito Santo e com poder
  rationale: O valor instrumental dos dativos é expresso por “com”. A repetição da preposição dá clareza e mantém distintos o Espírito Santo e o poder.
- source_word: διῆλθεν
  choice: andou por toda parte
  rationale: No contexto, o verbo descreve a atividade itinerante de Jesus. A expressão é corrente em português e comunica seu deslocamento de lugar em lugar.
- source_word: εὐεργετῶν
  choice: fazendo o bem
  rationale: Expressa de modo simples e abrangente a ação beneficente indicada pelo particípio.
- source_word: ἰώμενος
  choice: curando
  rationale: É o equivalente direto e natural para a atividade de sanar ou restaurar pessoas.
- source_word: πάντας τοὺς καταδυναστευομένους
  choice: todos os que eram oprimidos
  rationale: A formulação comunica a sujeição contínua a uma dominação severa sem restringir indevidamente a natureza das aflições.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: pelo diabo
  rationale: Aqui διάβολος designa o ser pessoal maligno; “o diabo” é a designação portuguesa clara e convencional.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: porque Deus estava com ele
  rationale: “Porque” torna explícito o valor causal de ὅτι e preserva a explicação dada pelo texto para o ministério eficaz de Jesus.
theological_decisions:
- issue: Relação entre a unção de Jesus e sua identidade e missão
  choice: Manter a linguagem de que Deus “ungiu” Jesus.
  alternative: Expandir para “designou como Messias” ou reduzir a “deu poder”.
  rationale: “Ungiu” preserva a linguagem e as ressonâncias bíblicas do verbo sem acrescentar uma definição doutrinária ausente do versículo.
- issue: Referência ao Espírito Santo
  choice: Entender e traduzir πνεύματι ἁγίῳ como referência pessoal ao Espírito Santo.
  alternative: Traduzir como uma força impessoal ou apenas como “espírito santo”.
  rationale: Em Atos, a expressão regularmente se refere ao Espírito Santo, e o próprio versículo distingue o Espírito Santo do poder.
- issue: Força causal da presença de Deus com Jesus
  choice: Preservar “porque Deus estava com ele” como explicação causal.
  alternative: Usar uma ligação mais vaga, como mera circunstância concomitante.
  rationale: O texto apresenta a presença de Deus com Jesus como fundamento de sua atuação benéfica e curadora, sem que seja necessário extrair da frase conclusões cristológicas além do que ela afirma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação com dois-pontos e ponto e vírgula torna clara a construção grega comprimida sem transformar a unção em comentário parentético. “Diabo” foi grafado em minúscula conforme o uso comum de substantivos designativos em português.
