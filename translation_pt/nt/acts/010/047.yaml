id: ACT.10.47
reference: Acts 10:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: pt
  text: Será que alguém pode impedir que estas pessoas sejam batizadas com água,[a] visto que receberam o Espírito Santo assim como nós?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Será que alguém pode negar a água e impedir que estas pessoas sejam batizadas, elas que receberam o Espírito Santo assim como nós?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Será que alguém pode...?
  rationale: Introduz uma pergunta retórica que espera resposta negativa; esta formulação comunica naturalmente essa expectativa em português.
- source_word: τὸ ὕδωρ
  choice: com água
  rationale: Identifica a água ligada ao batismo. Em português, integrar o termo à expressão «batizadas com água» evita a formulação pouco natural «impedir a água», sem apagar o elemento explícito do texto grego.
- source_word: δύναται κωλῦσαί τις
  choice: alguém pode impedir
  rationale: Preserva tanto a ideia de capacidade quanto a de obstruir ou proibir a ação.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: que estas pessoas sejam batizadas
  rationale: O infinitivo passivo com μή, dependente de κωλῦσαι, expressa impedir que o batismo aconteça. «Estas pessoas» traduz o referente humano sem especificar gênero além do exigido pelo contexto.
- source_word: οἵτινες
  choice: visto que
  rationale: 'Neste argumento, o pronome relativo tem força explicativa ou causal: o recebimento do Espírito fundamenta a pergunta sobre impedir o batismo.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada, atual e transparente em português.
- source_word: ἔλαβον
  choice: receberam
  rationale: O pretérito perfeito expressa naturalmente o evento concluído cuja relevância sustenta o argumento presente.
- source_word: ὡς καὶ ἡμεῖς
  choice: assim como nós
  rationale: Mantém a comparação explícita entre a experiência destas pessoas e a do grupo representado por Pedro.
theological_decisions:
- issue: Relação entre o recebimento do Espírito e o batismo com água
  choice: A tradução afirma que estas pessoas já receberam o Espírito Santo e apresenta esse fato como razão para não impedir seu batismo com água.
  alternative: Uma formulação que deixe obscura a prioridade narrativa do recebimento do Espírito em relação ao batismo.
  rationale: A sequência e o argumento do grego mostram o recebimento do Espírito como fato anterior que fundamenta a admissão ao batismo. A tradução preserva essa tensão narrativa sem impor uma estrutura sacramental denominacional.
- issue: Força causal de οἵτινες
  choice: visto que
  alternative: que
  rationale: A construção não apenas identifica as pessoas, mas destaca a razão pela qual seu batismo não deve ser impedido. A alternativa relativa simples continua lexicalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica preserva a expectativa de resposta negativa. A formulação principal evita o literalismo pouco idiomático «impedir a água», enquanto a nota conserva essa imagem e a possível leitura relativa de οἵτινες.
