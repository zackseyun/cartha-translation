lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Havia ... um homem
  rationale: A construção apresenta um novo personagem indefinido. Em português narrativo, “Havia ... um homem” comunica isso naturalmente; δέ funciona apenas como transição leve e não exige uma conjunção explícita.
- source_word: ἐν Καισαρείᾳ
  choice: em Cesareia
  rationale: Tradução locativa direta, com a forma tradicional portuguesa do topônimo.
- source_word: ὀνόματι Κορνήλιος
  choice: chamado Cornélio
  rationale: Expressão portuguesa natural para o dativo idiomático ὀνόματι seguido do nome próprio.
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: Termo histórico consagrado para um oficial romano dessa patente.
- source_word: ἐκ σπείρης
  choice: da unidade militar
  rationale: σπεῖρα designa aqui uma coorte romana. A formulação genérica no primeiro elemento evita a repetição pouco natural de “coorte ... Coorte” e prepara o nome formal da unidade.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: conhecida como Coorte Italiana
  rationale: καλουμένης indica a designação pela qual a unidade era chamada; “Coorte Italiana” conserva o nome militar histórico.
