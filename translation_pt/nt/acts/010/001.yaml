  text: Havia em Cesareia um homem chamado Cornélio[a], centurião da coorte chamada Italiana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certo homem em Cesareia”. O grego emprega uma expressão indefinida para introduzir um novo personagem.'
