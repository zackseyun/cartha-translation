source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: pt
  text: Ele ficou com muita fome e quis comer[a]. Mas, enquanto preparavam a comida, sobreveio-lhe um êxtase[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quis provar alguma coisa»; o verbo grego pode significar literalmente «provar», mas aqui se refere a comer.
    reason: lexical_alternative
  - marker: b
    text: Ou «um transe»; o termo grego indica aqui um estado alterado associado a uma revelação visionária.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... πρόσπεινος
  choice: ficou com muita fome
  rationale: A construção indica mudança de estado, e πρόσπεινος intensifica a fome. A formulação é natural em português e conserva essa força.
- source_word: ἤθελεν γεύσασθαι
  choice: quis comer
  rationale: Embora γεύομαι possa significar literalmente «provar», aqui designa o ato de comer. «Quis comer» comunica com clareza o sentido contextual.
- source_word: παρασκευαζόντων ... αὐτῶν
  choice: enquanto preparavam a comida
  rationale: O genitivo absoluto exprime ação simultânea. «A comida» explicita de modo natural o objeto implícito, sem restringi-lo a um prato específico.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: sobreveio-lhe
  rationale: A expressão marca o início repentino de uma experiência que se apodera de Pedro. «Sobreveio-lhe» é conciso, narrativo e digno.
- source_word: ἔκστασις
  choice: êxtase
  rationale: O termo descreve aqui um estado alterado ligado à revelação visionária. «Êxtase» preserva mais diretamente o termo grego, enquanto a nota esclarece o sentido contextual.
theological_decisions:
- issue: Natureza do estado visionário de Pedro indicado por ἔκστασις
  choice: êxtase
  alternative: transe; assombro
  rationale: O contexto subsequente mostra que não se trata apenas de espanto, mas de um estado associado a uma visão reveladora. «Êxtase» preserva a forma e a amplitude do termo, sem acrescentar uma explicação psicológica ou mística específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Ficou com muita fome» é idiomático; «sobreveio-lhe» mantém um tom narrativo elevado sem arcaísmo excessivo. Todos os marcadores de nota aparecem no texto.
