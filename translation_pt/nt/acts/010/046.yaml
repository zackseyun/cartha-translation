  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: pt
  text: 'Pois eles os ouviam falar em línguas[a] e engrandecer a Deus. Então Pedro respondeu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em idiomas”. A palavra grega pode se referir a línguas ou idiomas; aqui, a expressão é mantida ampla, sem definir a natureza da fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: ouviam
  rationale: O imperfeito indica ação em andamento; em português, “ouviam” preserva naturalmente esse aspecto.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que precede, com conexão clara e digna.
- source_word: αὐτῶν
  choice: os
  rationale: Retoma as pessoas mencionadas no contexto sem acrescentar uma identificação interpretativa.
- source_word: λαλούντων
  choice: falar
  rationale: Equivalente natural de λαλέω na construção com o verbo ouvir.
- source_word: γλώσσαις
  choice: em línguas
  rationale: Preserva a expressão reconhecível e a amplitude lexical de γλῶσσα, que pode designar línguas como órgão ou idiomas; a alternativa interpretativa é explicada em nota.
- source_word: μεγαλυνόντων
  choice: engrandecer
  rationale: Reproduz de perto a ideia de μεγαλύνω, isto é, declarar ou exaltar a grandeza de Deus.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Objeto direto de μεγαλυνόντων, conforme o uso normal do português.
- source_word: τότε
  choice: Então
  rationale: Marca de modo conciso a sequência dos acontecimentos.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Equivalente direto de ἀποκρίνομαι, mesmo sem uma pergunta explícita imediatamente anterior.
- source_word: Πέτρος
  choice: Pedro
  rationale: Forma portuguesa tradicional e corrente do nome grego.
theological_decisions:
- issue: Sentido de γλώσσαις no contexto do discurso capacitado pelo Espírito
  choice: em línguas
  alternative: em idiomas
  rationale: A expressão grega admite referência a idiomas, mas também se tornou uma formulação reconhecível para esse fenômeno em Atos. O texto principal mantém a expressão ampla, e a nota registra a alternativa sem decidir uma controvérsia teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém a relação explicativa; “ouviam” conserva o aspecto durativo; “engrandecer” preserva a imagem verbal do grego sem soar excessivamente técnico.
