lexical_decisions:
- source_word: εὐσεβὴς
  choice: piedoso
  rationale: Expressa devoção reverente demonstrada na vida religiosa; é corrente e digno em português.
- source_word: φοβούμενος τὸν θεὸν
  choice: temente a Deus
  rationale: Preserva o idioma bíblico e o valor verbal da expressão, sem reduzi-la apenas a respeito.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: com toda a sua casa
  rationale: Em português bíblico corrente, 'casa' pode designar o conjunto doméstico, incluindo família e dependentes; a nota esclarece esse alcance.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: praticava muitas obras de caridade
  rationale: Comunica naturalmente a atividade beneficente repetida, mantendo a pluralidade e a abundância.
- source_word: τῷ λαῷ
  choice: em favor do povo
  rationale: Explicita de modo natural o valor benefactivo do dativo.
- source_word: δεόμενος τοῦ θεοῦ
  choice: orava a Deus
  rationale: No contexto da devoção de Cornélio, traduz com clareza o ato de dirigir súplicas a Deus.
- source_word: διὰ παντός
  choice: continuamente
  rationale: Indica constância habitual sem exigir a ideia de ação literalmente ininterrupta.
theological_decisions:
- issue: Descrição de Cornélio como φοβούμενος τὸν θεόν
  choice: temente a Deus
  alternative: adorador de Deus; que reverenciava a Deus
  rationale: Conserva tanto o sentido comum de reverência quanto a possível ressonância histórica de uma designação reconhecível para um gentio ligado à adoração do Deus de Israel, sem impor tecnicamente essa classificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura descritiva foi convertida em oração verbal natural em português, sem perder o caráter habitual dos particípios gregos.
