  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: pt
  text: Mas, em toda nação, quem o teme e pratica a retidão[a][b] lhe é aceitável[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz o que é justo” / “pratica a justiça”.
    reason: lexical_alternative
  - marker: b
    text: Grego δικαιοσύνην, termo frequentemente traduzido por “retidão” ou “justiça”.
    reason: lexical_alternative
  - marker: c
    text: Ou “é aceito por ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: mas
  rationale: Marca o contraste com a afirmação anterior de que Deus não age com parcialidade; “mas” é o adversativo natural em português.
- source_word: ἐν παντὶ ἔθνει
  choice: em todas as nações
  rationale: Preserva a expressão locativa e o alcance distributivo de παντί sem restringir ἔθνος à noção moderna de etnia.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: quem o teme
  rationale: Expressa naturalmente em português o particípio substantivado, sem impor limitação de gênero, e conserva o sentido bíblico de temor reverente.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: e pratica a justiça
  rationale: “Pratica” comunica conduta ativa e habitual; “justiça” preserva o substantivo δικαιοσύνη e sua amplitude sem recorrer à formulação pouco natural “trabalha justiça”.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: É uma correspondência corrente e digna em português, capaz de abranger retidão moral e conduta justa; a alternativa “o que é justo” explicita de modo idiomático o sentido no contexto.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: é aceitável a ele
  rationale: Reflete de perto a construção com adjetivo predicativo e evita afirmar mais explicitamente uma recepção salvífica ou meritória do que o grego declara.
theological_decisions:
- issue: Se o versículo ensina aceitação meritória por obras ou descreve, sem parcialidade étnica, a pessoa que Deus acolhe
  choice: Manter a afirmação de que quem teme a Deus e pratica a justiça é aceitável a ele, sem acrescentar explicação doutrinária.
  alternative: Traduzir de modo meritório (“conquista a aceitação de Deus”) ou de modo interpretativo (“demonstra fé salvadora”).
  rationale: O grego relaciona temor de Deus, prática da justiça e aceitabilidade diante dele no contexto da ausência de parcialidade entre as nações. A tradução conserva essa tensão sem resolver um debate teológico que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem” evita gênero desnecessário; “pratica a justiça” mantém o teor bíblico e a ação contínua do particípio presente. A formulação “aceitável a ele” é deliberadamente mais formal para preservar a distinção entre o adjetivo δεκτός e a alternativa passiva “aceito por ele”.
