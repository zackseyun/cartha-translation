  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: pt
  text: E os crentes circuncisos[a] que tinham vindo com Pedro ficaram admirados, porque o dom do Espírito Santo havia sido derramado[c] até mesmo sobre os gentios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os crentes da circuncisão”. Literalmente, “os crentes dentre a circuncisão”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “também sobre os gentios”. O grego pode expressar simples adição, mas aqui provavelmente transmite surpresa: “até mesmo sobre os gentios”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “foi derramado”. O perfeito grego destaca uma ação concluída cujo resultado permanece.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: ficaram admirados
  rationale: O aoristo de ἐξίστημι expressa forte surpresa. “Ficaram admirados” é natural em português moderno e mantém essa força sem sugerir perda de controle.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: os crentes circuncisos
  rationale: A expressão identifica os fiéis judeus como integrantes do grupo caracterizado pela circuncisão. A forma escolhida é clara e natural; a construção mais literal é preservada em nota.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: que tinham vindo com Pedro
  rationale: A oração delimita quais crentes circuncisos estavam presentes. O mais-que-perfeito composto expressa naturalmente em português que eles haviam acompanhado Pedro antes da reação narrada.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: até mesmo sobre os gentios
  rationale: Neste contexto, ἔθνη designa os não judeus. O καί tem valor aditivo enfático e, diante da surpresa relatada, “até mesmo” comunica adequadamente sua força.
- source_word: ἡ δωρεὰ
  choice: o dom
  rationale: δωρεά indica algo dado gratuitamente. “Dom” é conciso, corrente no contexto bíblico e não precisa tornar explícita a gratuidade já inerente ao termo.
- source_word: τοῦ ἁγίου πνεύματος
  choice: do Espírito Santo
  rationale: Forma contemporânea, clara e amplamente reconhecida para o genitivo grego.
- source_word: ἐκκέχυται
  choice: havia sido derramado
  rationale: O perfeito passivo apresenta uma ação consumada cujo resultado permanecia evidente. No encadeamento narrativo português, “havia sido derramado” situa naturalmente o derramamento antes da admiração, enquanto a nota registra a alternativa aspectual.
theological_decisions:
- issue: Sentido de ἔθνη no contexto da inclusão dos não judeus
  choice: gentios
  alternative: nações
  rationale: Atos 10 contrasta os crentes judeus com pessoas não judias que recebem o Espírito. “Gentios” identifica esse referente sem alargar indevidamente o sentido para entidades nacionais.
- issue: Valor aspectual de ἐκκέχυται
  choice: havia sido derramado
  alternative: foi derramado / tem sido derramado
  rationale: O perfeito grego une a ação já realizada a seu resultado vigente. A escolha segue a sequência narrativa portuguesa, sem negar a continuidade do resultado; a alternativa mais próxima da forma perfeita é indicada em nota.
- issue: Identidade de οἱ ἐκ περιτομῆς πιστοὶ
  choice: os crentes circuncisos
  alternative: os crentes da circuncisão
  rationale: A expressão se refere aos crentes judeus presentes, mas a tradução evita substituir a linguagem de circuncisão por uma explicação interpretativa. Assim, preserva-se a identidade grupal expressa no grego.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “dom” e “Espírito Santo” por serem formas correntes no registro bíblico contemporâneo. A ordem dos marcadores acompanha as expressões a que cada nota se refere, ainda que resulte em [a], [c], [b].
