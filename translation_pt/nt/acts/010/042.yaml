id: ACT.10.42
reference: Acts 10:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: pt
  text: E ele nos ordenou que proclamássemos ao povo e testemunhássemos solenemente que este é aquele que Deus designou como juiz dos vivos e dos mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que Deus constituiu juiz dos vivos e dos mortos”.'
    reason: Alternativa lexical para ὁ ὡρισμένος, preservando a ideia de nomeação ou determinação divina.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: Expressa uma incumbência dada com autoridade e conserva a força do verbo sem a suavizar como “instruiu” poderia fazer.
- source_word: κηρύξαι
  choice: que proclamássemos
  rationale: Comunica anúncio público e autorizado, evitando limitar o sentido à ideia moderna de pregação em forma de sermão.
- source_word: τῷ λαῷ
  choice: ao povo
  rationale: Mantém a formulação do texto grego sem explicitar “Israel”, embora o contexto indique um ambiente judaico.
- source_word: διαμαρτύρασθαι
  choice: testemunhássemos solenemente
  rationale: Preserva tanto a ideia de dar testemunho quanto o caráter enfático e solene do verbo.
- source_word: οὗτός
  choice: este
  rationale: Conserva a ênfase demonstrativa que aponta para Jesus no contexto imediato.
- source_word: ὁ ὡρισμένος
  choice: aquele que Deus designou
  rationale: O particípio perfeito passivo indica uma designação feita por Deus com validade contínua; “designou” é claro e natural em português.
- source_word: κριτὴς
  choice: juiz
  rationale: Traduz diretamente o predicativo, com formulação idiomática em português.
- source_word: ζώντων καὶ νεκρῶν
  choice: dos vivos e dos mortos
  rationale: Expressão tradicional, clara e fiel, que mantém o alcance universal e solene do juízo.
theological_decisions:
- issue: A designação divina de Jesus para julgar
  choice: Deus designou como juiz dos vivos e dos mortos
  alternative: Deus constituiu como juiz dos vivos e dos mortos
  rationale: A tradução afirma exatamente a designação divina e o alcance universal do juízo atribuídos no versículo, sem desenvolver o enunciado segundo formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção com subjuntivos coordenados é natural após “ordenou que”; “testemunhássemos solenemente” retém a intensidade do original. O marcador [a] aparece no texto principal.
