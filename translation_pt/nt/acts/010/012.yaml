  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: pt
  text: Nele havia todos os animais de quatro patas, os animais rastejantes da terra e as aves do céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo retoma o objeto semelhante a um grande lençol do versículo anterior. “Nele” expressa de modo natural e conciso a relação locativa.
- source_word: ὑπῆρχεν
  choice: havia
  rationale: O imperfeito indica a presença ou existência dos animais dentro do objeto; “havia” preserva esse sentido sem acrescentar a ideia mais forte de que ele os “continha”.
- source_word: πάντα
  choice: todos
  rationale: Mantém a abrangência do grego sem introduzir a interpretação possível, mas não explícita, de “toda espécie de”.
- source_word: τὰ τετράποδα
  choice: os animais de quatro patas
  rationale: É uma formulação clara e corrente em português, mais acessível que o termo técnico “quadrúpedes”.
- source_word: ἑρπετὰ τῆς γῆς
  choice: os animais rastejantes da terra
  rationale: ἑρπετά é uma categoria mais ampla que os répteis na classificação moderna; “animais rastejantes” conserva melhor o sentido de criaturas que rastejam, e “da terra” mantém o genitivo.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: No contexto, πετεινά designa naturalmente as aves; “do céu” é uma expressão portuguesa corrente e preserva a linguagem classificatória do grego.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: As conjunções coordenam as três categorias. Em português, uma enumeração com “e” antes do último elemento transmite a estrutura com naturalidade, sem exigir a repetição de todos os conectivos gregos.
