id: ACT.10.36
reference: Acts 10:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: pt
  text: a mensagem que ele enviou aos filhos de Israel, anunciando a paz por meio de Jesus, o Messias[a] — ele é o Senhor de todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Jesus Cristo”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “este é o Senhor de todos”. O grego emprega um demonstrativo enfático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: a mensagem
  rationale: Neste contexto, λόγος designa o conteúdo comunicado por Deus, e não uma palavra isolada; “mensagem” é natural em português e preserva esse sentido.
- source_word: ὃν ἀπέστειλεν
  choice: que ele enviou
  rationale: Mantém de modo idiomático a oração relativa e o sujeito implícito, Deus, recuperado do contexto maior.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: aos filhos de Israel
  rationale: Reproduz a expressão convencional grega e conserva sua forma, ainda compreensível em português.
- source_word: εὐαγγελιζόμενος
  choice: anunciando
  rationale: Expressa o ato de comunicar boas-novas sem tornar a frase pesada; o conteúdo favorável do anúncio é explicitado pela paz.
- source_word: εἰρήνην
  choice: a paz
  rationale: Equivalente direto que preserva as ideias bíblicas de reconciliação e bem-estar sem ampliá-las no texto.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: “Por meio de” marca adequadamente a mediação de διά; Χριστός é vertido como o título “Messias”, com pontuação natural em português.
- source_word: οὗτός
  choice: ele
  rationale: O pronome é mais natural em português; a referência imediata a Jesus e a construção destacada após o travessão conservam o foco do demonstrativo grego.
- source_word: πάντων κύριος
  choice: o Senhor de todos
  rationale: “Senhor” preserva a força cristológica de κύριος, e “de todos” corresponde diretamente ao genitivo πάντων.
theological_decisions:
- issue: Tradução de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título e identifica Jesus como o Messias; traduzi-lo torna esse valor perceptível ao leitor moderno.
- issue: Tradução de κύριος em πάντων κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” conserva tanto a autoridade quanto o peso teológico da afirmação cristológica, sem restringi-la à soberania política.
- issue: Força de οὗτός ἐστιν πάντων κύριος
  choice: ele é o Senhor de todos
  alternative: este é o Senhor de todos
  rationale: A forma escolhida é idiomática e digna em português. O travessão e a referência imediata preservam o destaque dado a Jesus, enquanto a nota registra a forma demonstrativa explícita do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a estrutura participial do grego foram mantidas tanto quanto possível sem produzir uma frase artificial. O artigo em “o Senhor” é natural em português e não acrescenta uma distinção ausente no original.
