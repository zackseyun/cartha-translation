    issue: A expressão «O anjo lhe respondeu» acrescenta «anjo» ao texto do versículo.
    rationale: O grego traz apenas εἶπεν δὲ αὐτῷ («e ele lhe disse»). Embora o contexto narrativo identifique a figura como um anjo, a tradução deste versículo não deve introduzir esse substantivo ausente da fonte.
