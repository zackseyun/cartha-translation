id: ACT.10.4
reference: Acts 10:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: pt
  text: 'Ele fixou os olhos nele e, tomado de medo, perguntou: “O que é, Senhor?” Ele lhe disse: “Suas orações e suas esmolas[a] subiram como memorial diante de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atos de misericórdia”. O termo grego se refere especialmente a doações caridosas aos necessitados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: fixou os olhos nele
  rationale: Expressa um olhar fixo e atento com uma formulação natural e digna em português.
- source_word: ἔμφοβος γενόμενος
  choice: tomado de medo
  rationale: Preserva a entrada no estado de medo indicada por γενόμενος, sem intensificá-la indevidamente como terror.
- source_word: Τί ἐστιν
  choice: O que é?
  rationale: Reproduz de modo direto e idiomático a pergunta de Cornélio sobre o que estava acontecendo ou sendo requerido.
- source_word: κύριε
  choice: Senhor
  rationale: Mantém a forma reverente de tratamento dirigida ao mensageiro celestial, sem exigir que seja entendida como confissão cristológica.
- source_word: προσευχαί
  choice: orações
  rationale: Equivalente corrente e preciso no contexto.
- source_word: ἐλεημοσύναι
  choice: esmolas
  rationale: Designa especificamente dádivas caridosas aos necessitados e é uma expressão bíblica ainda compreensível em português; a nota esclarece seu sentido.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Preserva a metáfora de movimento ascendente, associada à oração e à linguagem sacrificial.
- source_word: εἰς μνημόσυνον
  choice: como memorial
  rationale: Conserva a linguagem de lembrança diante de Deus e sua possível ressonância cultual sem explicitar além do texto.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: diante de Deus
  rationale: Tradução concisa e natural que comunica presença ou consideração perante Deus.
theological_decisions:
- issue: Sentido de κύριε no modo como Cornélio se dirige à figura celestial
  choice: Senhor
  alternative: senhor; meu senhor
  rationale: A forma reverente preserva a elevação da cena e a correspondência lexical, mas o contexto não obriga a entendê-la como identificação do mensageiro com Jesus nem como confissão cristológica.
- issue: Natureza do memorial diante de Deus
  choice: como memorial diante de Deus
  alternative: para ser lembrado por Deus; como oferta memorial
  rationale: A formulação mantém tanto a imagem de lembrança quanto a possível ressonância sacrificial, sem reduzir a expressão a mero ato mental nem acrescentar explicitamente uma oferta que o grego não nomeia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala permanece direta, e a linguagem de memorial conserva a solenidade e a ambiguidade do original.
