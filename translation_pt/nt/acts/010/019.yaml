  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: pt
  text: 'Enquanto Pedro ainda refletia sobre a visão, o Espírito lhe disse: “Veja! Há homens à sua procura.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão procurando você”.'
    reason: Alternativa lexical direta para ζητοῦντές σε.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ainda refletia
  rationale: O particípio indica reflexão interior continuada. “Refletia” é natural e claro; “ainda” explicita a continuidade da ação no contexto narrativo.
- source_word: περὶ τοῦ ὁράματος
  choice: sobre a visão
  rationale: Mantém explícito o assunto da reflexão de Pedro e reproduz naturalmente a construção grega.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No contexto de Atos 10, trata-se do Espírito divino. A inicial maiúscula identifica o referente sem acrescentar “Santo”, termo ausente neste versículo.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Forma corrente e concisa em português para indicar que o Espírito falou a Pedro.
- source_word: Ἰδοὺ
  choice: Veja!
  rationale: Funciona como marcador de atenção em linguagem moderna, preservando a força de ἰδού sem recorrer ao mais arcaizante “Eis”.
- source_word: ἄνδρες
  choice: homens
  rationale: ἀνήρ designa aqui pessoas adultas do sexo masculino; a tradução conserva essa especificidade.
- source_word: ζητοῦντές σε
  choice: Há homens à sua procura
  rationale: “À sua procura” comunica naturalmente a ação presente de ζητέω em português amplo e evita uma formulação excessivamente literal.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: “o Espírito”, entendido como o Espírito Santo
  alternative: um espírito ou impulso espiritual não especificado
  rationale: O contexto imediato de Atos 10 apresenta o Espírito divino dirigindo Pedro. A tradução conserva “o Espírito” sem inserir o adjetivo “Santo”, que não aparece no grego deste versículo.
- issue: Especificidade de gênero em ἄνδρες
  choice: homens
  alternative: pessoas ou visitantes
  rationale: O substantivo grego é especificamente masculino e se refere aos homens enviados para buscar Pedro; neutralizar o termo apagaria uma informação do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Veja!” preserva o chamado de atenção do original; “à sua procura” é idiomático e compreensível em diferentes variedades do português.
