source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: pt
  text: E ordenou que fossem batizados em nome de Jesus, o Messias[a]. Então lhe pediram que permanecesse por alguns dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais tradicional, “Jesus Cristo”.
    reason: Registra a tradução tradicional de Χριστός ao lado da forma que explicita o sentido do título.
lexical_decisions:
- source_word: προσέταξεν
  choice: ordenou
  rationale: O aoristo de προστάσσω expressa uma instrução dada com autoridade; “ordenou” preserva essa força de modo claro e natural em português.
- source_word: δὲ
  choice: Por isso
  rationale: Aqui δέ promove a narrativa e liga a ordem de Pedro aos acontecimentos anteriores; “Por isso” comunica adequadamente o fluxo resultante, sem sugerir contraste forte.
- source_word: ἐν τῷ ὀνόματι
  choice: em nome
  rationale: A expressão tradicional e natural em português preserva a amplitude do idioma grego, que pode envolver autoridade, identificação e invocação, sem restringi-lo a uma única explicação.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός mantém valor titular e confessional neste contexto. “O Messias” traduz o título, enquanto a vírgula torna a construção idiomática em português.
- source_word: βαπτισθῆναι
  choice: que fossem batizados
  rationale: A oração com verbo finito reproduz naturalmente em português o infinitivo passivo grego e mantém explícito que eles recebem o batismo.
- source_word: τότε
  choice: Então
  rationale: Marca de forma concisa a sequência do acontecimento seguinte.
- source_word: ἠρώτησαν
  choice: pediram
  rationale: Neste contexto, ἐρωτάω significa fazer um pedido. “Pediram” é mais idiomático em português diante de uma oração com “que” e não acrescenta urgência.
- source_word: ἐπιμεῖναι
  choice: que ficasse
  rationale: ἐπιμένω indica permanecer por certo tempo; “ficasse” é corrente e natural em português.
- source_word: ἡμέρας τινάς
  choice: alguns dias
  rationale: Mantém a duração indefinida do grego, sem convertê-la especificamente em poucos ou vários dias.
theological_decisions:
- issue: Tradução de Χριστοῦ na fórmula batismal
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Neste contexto, Χριστός pode ser ouvido como título confessional. Traduzir por “Messias” torna esse sentido transparente, enquanto a forma tradicional “Cristo” é preservada em nota sem tratar uma delas como solução doutrinária exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi naturalizada sem apagar a passividade do batismo nem a duração indefinida da permanência.
