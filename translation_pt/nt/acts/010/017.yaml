  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: pt
  text: Enquanto Pedro refletia, perplexo, sobre o que poderia significar a visão que tivera[a], eis que os homens enviados por Cornélio, depois de perguntarem pela casa de Simão, pararam junto ao portão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que poderia ser a visão que tivera”. Esta é uma tradução mais literal do grego, embora o contexto provavelmente se refira ao sentido ou à importância da visão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à entrada”. O termo grego pode se referir ao portão ou à área de entrada de uma casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Enquanto
  rationale: Introduz a circunstância temporal e mantém a progressão narrativa de modo natural em português.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: se perguntava, perplexo
  rationale: Expressa a reflexão interior e a perplexidade contínua indicada pelo imperfeito, sem recorrer a uma formulação artificial como «perplexo dentro de si».
- source_word: τί ἂν εἴη
  choice: o que poderia significar
  rationale: No contexto, Pedro procura compreender o sentido da visão; a nota preserva a tradução mais literal e a ambiguidade do grego.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: a visão que tivera
  rationale: O mais-que-perfeito situa naturalmente a visão antes da perplexidade de Pedro.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador discursivo que chama atenção para a chegada simultânea dos homens.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: os homens enviados por Cornélio
  rationale: Mantém de maneira concisa tanto a identificação dos homens quanto o sentido passivo do particípio.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: depois de se informarem sobre a casa de Simão
  rationale: Indica que eles fizeram perguntas para localizar a casa antes de chegar, respeitando a anterioridade do particípio aoristo sem acrescentar detalhes indevidos.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: chegaram ao portão
  rationale: No contexto, o verbo descreve a chegada e a presença deles junto à entrada; «chegaram ao portão» é claro e idiomático.
