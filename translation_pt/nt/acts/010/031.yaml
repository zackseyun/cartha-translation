id: ACT.10.31
reference: Acts 10:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: pt
  text: 'E ele disse: “Cornélio, sua oração foi ouvida, e suas esmolas foram lembradas diante de Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησί
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa em português.
- source_word: Κορνήλιε
  choice: Cornélio
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἰσηκούσθη
  choice: foi ouvida
  rationale: Preserva de modo claro o aoristo passivo e indica que a oração recebeu resposta favorável, sem explicitar além do texto.
- source_word: ἡ προσευχὴ
  choice: sua oração
  rationale: Mantém o substantivo no singular e a referência possessiva expressa pelo genitivo σου.
- source_word: αἱ ἐλεημοσύναι
  choice: suas esmolas
  rationale: “Esmolas” é a equivalência portuguesa precisa para ofertas misericordiosas destinadas aos necessitados e preserva o plural do grego.
- source_word: ἐμνήσθησαν
  choice: foram lembradas
  rationale: Mantém o aoristo passivo plural e o importante idioma bíblico da lembrança divina.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Expressão portuguesa natural e formal que conserva a ideia da presença e consideração de Deus.
theological_decisions:
- issue: Sentido das esmolas de Cornélio
  choice: Mantida a referência concreta a “esmolas”.
  alternative: atos de caridade; ofertas aos necessitados
  rationale: O texto afirma que essas ações foram lembradas diante de Deus, mas não define aqui uma doutrina de mérito nem o mecanismo da salvação; a tradução não acrescenta tal conclusão.
- issue: Linguagem da lembrança divina
  choice: foram lembradas diante de Deus
  alternative: Deus tomou conhecimento delas; Deus se lembrou delas
  rationale: A formulação passiva preserva o idioma e a tensão do grego, sem reduzir “lembrar” a mera percepção nem identificar explicitamente o agente da passiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o grego sem soar artificial; “esmolas” mantém precisão lexical e registro bíblico ainda corrente.
