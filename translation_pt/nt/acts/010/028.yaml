source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: pt
  text: 'E lhes disse: “Vocês mesmos sabem que não é permitido a um judeu associar-se com alguém de outro povo ou visitá-lo[a]. Mas Deus me mostrou que não devo chamar pessoa alguma de comum ou impura[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um gentio ou ir até ele”. A expressão grega significa literalmente alguém pertencente a outro povo.
    reason: lexical_alternative
  - marker: b
    text: “Comum” traduz um termo grego distinto de “impura”. Os dois termos pertencem à linguagem de pureza e são mantidos separados no texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: E lhes disse
  rationale: Mantém a conexão narrativa leve de τέ e expressa naturalmente o destinatário plural.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Vocês mesmos sabem
  rationale: O pronome grego explícito é enfático; “vocês mesmos” preserva essa ênfase em português corrente.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: que não é permitido
  rationale: Comunica algo vedado pela norma ou pelo costume reconhecido, sem sugerir necessariamente uma proibição explícita da Torá nem reduzi-lo a mera inconveniência social.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: a um judeu
  rationale: Preserva o singular representativo e o referente masculino de ἀνήρ de forma natural em português.
- source_word: κολλᾶσθαι
  choice: associar-se com
  rationale: Expressa adequadamente a ideia contextual de manter convivência ou ligação social.
- source_word: ἢ προσέρχεσθαι
  choice: ou visitá-lo
  rationale: No contexto da entrada de Pedro na casa de Cornélio, “visitar” transmite com naturalidade o sentido prático de ir até alguém; o pronome retoma “alguém de outro povo”.
- source_word: ἀλλοφύλῳ
  choice: alguém de outro povo
  rationale: Reflete de perto o sentido de uma pessoa pertencente a outro povo, evitando impor como única leitura o termo teológico tradicional “gentio”.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Mas Deus me mostrou
  rationale: “Mas” torna explícito o contraste contextual entre a prática conhecida e a revelação divina, enquanto o pretérito perfeito corresponde naturalmente ao aoristo.
- source_word: μηδένα ... ἄνθρωπον
  choice: pessoa alguma
  rationale: ἄνθρωπος é genérico neste contexto; a expressão portuguesa é inclusiva, idiomática e preserva a negação enfática.
- source_word: κοινὸν
  choice: comum
  rationale: Mantém o vocabulário das categorias de pureza e sua distinção lexical em relação a ἀκάθαρτος, embora o sentido técnico possa exigir esclarecimento.
- source_word: ἢ ἀκάθαρτον
  choice: ou impura
  rationale: “Impura” comunica claramente a categoria de impureza ritual e concorda com “pessoa”, sem fundi-la com κοινός.
theological_decisions:
- issue: Relação entre as barreiras judaicas e a revelação divina
  choice: 'Apresentar a associação com alguém de outro povo como não permitida a um judeu e preservar a correção recebida por Pedro: nenhuma pessoa deve ser chamada de comum ou impura.'
  alternative: Enfraquecer ἀθέμιτον como simples inadequação social, ou reformular a conclusão de modo que se refira apenas a alimentos.
  rationale: O texto contrapõe uma restrição reconhecida por Pedro à aplicação humana da revelação divina. A tradução mantém essa tensão sem atribuir explicitamente a restrição à Torá e sem apagar a referência inequívoca a pessoas.
- issue: Distinção entre κοινός e ἀκάθαρτος
  choice: “comum ou impura”
  alternative: “impura ou imunda”, tratando os termos como sinônimos
  rationale: A formulação conserva duas categorias distintas da linguagem judaica de pureza, sem resolver a diferença entre elas por paráfrase denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura natural no Brasil. A construção evita tanto o juridicismo excessivo de “ilegal” quanto uma paráfrase que atribua a proibição diretamente à Lei de Moisés. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
