  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: pt
  text: Quando o anjo que falava com ele foi embora, Cornélio chamou dois dos servos de sua casa[a] e um soldado devoto dentre os que estavam sempre a seu serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dois dos escravos domésticos”. O termo grego οἰκέται designa pessoas em condição servil ligadas à casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz a circunstância temporal de modo natural, sem atribuir peso excessivo a δέ.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressa em português corrente a partida já concluída do anjo antes de Cornélio chamar seus homens.
- source_word: ὁ ἄγγελος
  choice: o anjo
  rationale: O contexto imediato apresenta um enviado celestial visto por Cornélio, tornando “anjo” mais preciso que o sentido genérico “mensageiro”.
- source_word: ὁ λαλῶν αὐτῷ
  choice: que falava com ele
  rationale: A oração relativa identifica o anjo e preserva naturalmente o aspecto em curso do particípio presente.
- source_word: φωνήσας
  choice: Cornélio chamou
  rationale: O particípio aoristo é vertido como verbo finito para formar uma sequência natural em português. O nome do sujeito, implícito no grego e claro pelo contexto, evita que “ele” seja confundido com o anjo.
- source_word: δύο τῶν οἰκετῶν
  choice: dois dos servos de sua casa
  rationale: Preserva tanto a relação de serviço quanto o ambiente doméstico. Como οἰκέτης pode designar um escravo da casa, essa possibilidade é registrada em nota.
- source_word: στρατιώτην εὐσεβῆ
  choice: um soldado devoto
  rationale: “Soldado” traduz diretamente στρατιώτης, e “devoto” comunica a reverência religiosa de εὐσεβής sem acrescentar a categoria mais específica de “temente a Deus”.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: dentre os que estavam sempre a seu serviço
  rationale: “Dentre” representa a relação partitiva, enquanto “estavam sempre a seu serviço” comunica a ideia de atendimento constante ou dedicado presente em προσκαρτερέω.
theological_decisions:
- issue: Natureza de ἄγγελος no contexto
  choice: anjo
  alternative: mensageiro
  rationale: Em Atos 10, Cornélio acaba de receber em visão um enviado celestial; portanto, o sentido sobrenatural decorre do contexto narrativo, não de uma preferência doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Servos de sua casa” evita o tom burocrático de “servidores domésticos”; a nota preserva a possibilidade socialmente mais específica de escravidão. O nome “Cornélio” foi explicitado para impedir ambiguidade referencial em português.
