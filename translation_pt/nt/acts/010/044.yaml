id: ACT.10.44
reference: Acts 10:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: pt
  text: Enquanto Pedro ainda dizia estas palavras, o Espírito Santo caiu[a] sobre todos os que ouviam a palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veio sobre”.
    reason: Alternativa lexical natural para ἐπέπεσε, com menor preservação da imagem literal.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Enquanto Pedro ainda dizia
  rationale: A oração temporal traduz o genitivo absoluto e preserva a simultaneidade; “ainda” expressa a ação em andamento indicada por ἔτι e pelo particípio presente.
- source_word: τὰ ῥήματα ταῦτα
  choice: estas palavras
  rationale: Tradução direta e natural de ῥήματα no contexto da fala de Pedro.
- source_word: ἐπέπεσε
  choice: caiu sobre
  rationale: Preserva a imagem vívida de ἐπιπίπτω e o modo característico como Lucas descreve, em Atos, a vinda do Espírito sobre pessoas.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada, atual e semanticamente precisa em português.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: sobre todos os que ouviam
  rationale: “Sobre” corresponde naturalmente a ἐπί neste contexto; o imperfeito “ouviam” comunica a ação simultânea do particípio presente.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém correspondência lexical próxima com λόγος e conserva sua possível densidade teológica, sem impedir que o contexto o identifique como a mensagem proclamada.
theological_decisions:
- issue: Descrição da ação do Espírito em ἐπέπεσε
  choice: o Espírito Santo caiu sobre
  alternative: o Espírito Santo veio sobre
  rationale: “Caiu sobre” conserva a metáfora concreta e a força narrativa de Lucas sem definir de modo denominacional a natureza da experiência.
- issue: Sentido de λόγος no contexto da proclamação
  choice: a palavra
  alternative: a mensagem
  rationale: “A palavra” mantém a forma do texto grego e sua ambiguidade legítima entre a fala proclamada e a mensagem nela comunicada.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A estrutura temporal é idiomática, e a repetição de “palavras”/“palavra” acompanha a distinção grega entre ῥήματα e λόγος.
