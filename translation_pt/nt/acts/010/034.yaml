  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: pt
  text: 'Então Pedro tomou a palavra e disse: “Compreendo, de fato, que Deus não trata as pessoas com parcialidade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: tomou a palavra
  rationale: A expressão grega significa literalmente «abrindo a boca», mas funciona como uma introdução formal à fala. «Tomou a palavra» preserva essa função retórica em português natural e digno.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá continuidade à narrativa; «Então» expressa com naturalidade essa progressão.
- source_word: Ἐπ’ ἀληθείας
  choice: de verdade
  rationale: A expressão reforça a autenticidade da constatação de Pedro. «De verdade» é corrente e claro, sem o tom excessivamente solene de «em verdade».
- source_word: καταλαμβάνομαι
  choice: Agora compreendo
  rationale: O verbo indica que Pedro alcança ou reconhece uma realidade. «Compreendo» traduz o sentido básico, e «agora» torna explícito o caráter de descoberta sugerido pelo contexto, embora não corresponda a uma palavra grega independente.
- source_word: προσωπολήμπτης
  choice: trata as pessoas com parcialidade
  rationale: O substantivo descreve quem favorece pessoas com base em sua condição ou aparência. A formulação verbal é clara em português moderno e mantém a referência pessoal do idioma grego.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução portuguesa padrão de θεός; a construção predicativa grega é expressa naturalmente como uma declaração sobre o modo de Deus tratar as pessoas.
theological_decisions:
- issue: Declaração sobre a imparcialidade de Deus sem impor uma sistematização posterior
  choice: Deus não trata as pessoas com parcialidade
  alternative: Deus não faz acepção de pessoas
  rationale: A escolha comunica a afirmação de que Deus não favorece pessoas segundo distinções humanas, sem restringir o alcance do texto a um sistema teológico posterior. A alternativa tradicional é fiel, mas menos transparente para muitos leitores atuais.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno e oralmente natural. A expressão tradicional «abriu a boca» foi vertida idiomaticamente como «tomou a palavra»; «fazer acepção de pessoas» foi evitado por ser menos imediatamente compreensível.
