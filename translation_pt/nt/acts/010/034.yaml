  naturalness: «Então Pedro tomou a palavra e disse» e «Deus não trata as pessoas com parcialidade» são formulações naturais, claras e de registro digno em português moderno. «De fato» reproduz Ἐπ’ ἀληθείας com mais sobriedade e adequação ao enunciado solene do que «de verdade».
  terminology: «Parcialidade» transmite com clareza προσωπολήμπτης e evita o arcaísmo relativo de «acepção de pessoas», sem impor interpretação teológica adicional. «Deus» é a equivalência normal de ὁ θεός.
