id: ACT.10.9
reference: Acts 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: pt
  text: No dia seguinte, enquanto aqueles homens viajavam e se aproximavam da cidade, Pedro subiu ao terraço da casa para orar, por volta da hora sexta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por volta do meio-dia, segundo a contagem judaica das horas do dia.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: A expressão dativa tem sentido temporal. O δέ funciona como conexão narrativa leve e não exige uma palavra separada em português.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: enquanto aqueles homens viajavam
  rationale: O genitivo absoluto indica uma ação simultânea. “Aqueles homens” retoma naturalmente os mensageiros de Cornélio no contexto.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: e se aproximavam da cidade
  rationale: Mantém a segunda ação simultânea e traduz de modo corrente o sentido de ἐγγίζω.
- source_word: ἀνέβη
  choice: subiu
  rationale: Reproduz com concisão o aoristo narrativo e o movimento em direção à parte superior da casa.
- source_word: ἐπὶ τὸ δῶμα
  choice: ao terraço da casa
  rationale: δῶμα designa aqui a cobertura plana e acessível de uma casa. “Terraço da casa” comunica melhor essa realidade arquitetônica ao leitor moderno do que apenas “telhado”.
- source_word: προσεύξασθαι
  choice: para orar
  rationale: O infinitivo expressa a finalidade da subida; a construção portuguesa é natural e direta.
- source_word: περὶ ὥραν ἕκτην
  choice: por volta da hora sexta
  rationale: Preserva a forma antiga de contar as horas e o valor aproximativo de περί; a equivalência moderna é explicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão cultural “hora sexta” foi preservada no texto e esclarecida em nota. O marcador foi colocado após essa expressão, à qual a nota efetivamente se refere.
