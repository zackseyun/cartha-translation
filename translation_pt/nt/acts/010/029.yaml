source:
  edition: SBLGNT
  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: pt
  text: 'Por isso, quando mandaram me chamar, vim sem fazer objeção[a]. Portanto, pergunto: por que razão vocês mandaram me chamar?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem hesitar”. Mais literalmente, “sem objeção” ou “sem contestar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por que vocês me chamaram?”. Mais literalmente, “por que razão vocês mandaram me chamar?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Por isso
  rationale: Expressa naturalmente a inferência em relação à explicação anterior; a leve ênfase de καί é absorvida pelo fluxo da frase.
- source_word: ἀναντιρρήτως
  choice: sem fazer objeção
  rationale: Preserva o sentido de não contradizer, protestar ou resistir verbalmente, sem reduzir o termo apenas à ausência de hesitação.
- source_word: ἦλθον
  choice: vim
  rationale: Tradução direta do aoristo de ἔρχομαι, adequada à perspectiva de quem chegou ao local dos ouvintes.
- source_word: μεταπεμφθείς
  choice: quando mandaram me chamar
  rationale: Comunica em português corrente a ideia passiva de alguém ter sido chamado por meio de mensageiros.
- source_word: πυνθάνομαι οὖν
  choice: Agora pergunto
  rationale: Apresenta com naturalidade a transição conclusiva para a pergunta; “agora” funciona aqui como marcador discursivo, sem impor uma conclusão lógica forte.
- source_word: τίνι λόγῳ
  choice: por que razão
  rationale: Mantém explicitamente a noção de razão ou motivo presente na expressão grega, embora “por quê” também seja possível.
- source_word: μετεπέμψασθέ με
  choice: vocês me chamaram
  rationale: Em português, “chamar” é uma forma natural de expressar o ato de mandar buscar alguém; o contexto já deixa claro que houve mensageiros.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “mandaram me chamar” é corrente no Brasil e preserva a ação de enviar mensageiros; “vocês” corresponde ao sujeito plural do verbo grego.
