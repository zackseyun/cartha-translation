  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: pt
  text: Vocês mesmos sabem o que aconteceu por toda a Judeia[a], começando pela Galileia, depois do batismo que João proclamou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a palavra/mensagem que se espalhou por toda a Judeia”. O termo grego ῥῆμα pode significar “palavra”, “mensagem”, “assunto” ou “acontecimento”.'
    reason: lexical_alternative
  - marker: b
    text: No grego, o particípio traduzido por “começando” tem uma ligação sintática incomum, mas indica claramente que o ponto de partida foi a Galileia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês mesmos
  rationale: O pronome explícito é enfático; “vocês mesmos” preserva essa ênfase de modo natural e amplamente compreensível em português.
- source_word: οἴδατε
  choice: sabem
  rationale: Embora a forma grega seja formalmente perfeita, aqui tem sentido presente; “sabem” é a equivalência natural.
- source_word: τὸ γενόμενον ῥῆμα
  choice: o que aconteceu
  rationale: A construção abrange o acontecimento público e a mensagem a seu respeito. “O que aconteceu” expressa naturalmente a força factual de γενόμενον sem restringir ῥῆμα a uma simples fala; a alternativa lexical é registrada em nota.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: em toda a Judeia
  rationale: κατά com o genitivo indica extensão por toda a região; a formulação portuguesa é corrente e conserva a abrangência de ὅλης.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: começando pela Galileia
  rationale: Preserva a noção de ponto de partida marcada por ἀπό e deixa perceptível a construção participial sintaticamente solta.
- source_word: μετὰ τὸ βάπτισμα
  choice: depois do batismo
  rationale: μετά com acusativo tem sentido temporal; a tradução é direta e natural.
- source_word: βάπτισμα
  choice: batismo
  rationale: É o termo estabelecido, claro e menos interpretativo do que “imersão” neste contexto narrativo.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: que João proclamou
  rationale: κηρύσσω denota anúncio público ou proclamação; “proclamou” conserva essa força sem sugerir exclusivamente uma pregação em ambiente religioso.
theological_decisions:
- issue: Sentido de ῥῆμα no resumo de Pedro
  choice: Traduzido no texto como “o que aconteceu”, abrangendo os acontecimentos públicos e a mensagem ligada a eles.
  alternative: “a palavra” ou “a mensagem”
  rationale: O contexto descreve algo amplamente conhecido na Judeia e iniciado na Galileia. A opção principal favorece o aspecto factual, enquanto a nota preserva a amplitude lexical de ῥῆμα sem impor uma conclusão doutrinária.
- issue: Referente e concordância de ἀρξάμενος
  choice: 'Mantida uma construção participial aberta: “começando pela Galileia”.'
  alternative: Explicitar “isso começou na Galileia” ou associar o particípio diretamente a um referente masculino implícito.
  rationale: O particípio masculino é sintaticamente difícil em relação ao neutro ῥῆμα. A tradução comunica claramente o ponto de partida sem solucionar silenciosamente a irregularidade; a nota informa a dificuldade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Vocês” foi usado por clareza no plural; a ordem e a pontuação mantêm o caráter de continuação do discurso de Pedro.
