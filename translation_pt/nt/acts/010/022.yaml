id: ACT.10.22
reference: Acts 10:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: pt
  text: 'Eles disseram: “Cornélio, um centurião, homem justo e temente a Deus, de quem todo o povo judeu dá bom testemunho, recebeu de um santo anjo a orientação de mandar chamar você à casa dele e ouvir o que você tem a dizer.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: Termo histórico consagrado e preciso para o oficial romano associado ao comando de uma centúria.
- source_word: ἀνὴρ δίκαιος
  choice: homem justo
  rationale: Preserva tanto a referência explícita a Cornélio como o sentido moral e religioso de δίκαιος, sem acrescentar conclusões teológicas.
- source_word: φοβούμενος τὸν θεόν
  choice: temente a Deus
  rationale: Expressão bíblica natural em português, que mantém a força verbal da descrição e sua possível dimensão reconhecível no contexto judaico.
- source_word: μαρτυρούμενος
  choice: de quem ... dá bom testemunho
  rationale: Expressa o particípio passivo como testemunho favorável e boa reputação, de modo idiomático em português.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: todo o povo judeu
  rationale: Comunica que ἔθνος designa aqui o povo judeu, não necessariamente um Estado nacional moderno, e evita uma formulação artificial.
- source_word: ἐχρηματίσθη
  choice: recebeu ... a orientação
  rationale: No contexto, o verbo indica uma comunicação de origem divina; a fonte é explicitada pela expressão seguinte, 'de um santo anjo'.
- source_word: ἀγγέλου ἁγίου
  choice: de um santo anjo
  rationale: Representa explicitamente o adjetivo ἁγιος e preserva a caracterização dada pelo texto.
- source_word: μεταπέμψασθαί σε
  choice: mandar chamar você
  rationale: Equivalente português natural para enviar alguém a fim de buscar ou convocar uma pessoa, sem a redundância de explicitar 'vir'.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: à casa dele
  rationale: Indica naturalmente o destino associado a mandar chamar e preserva o sentido concreto de οἶκος.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: ouvir o que você tem a dizer
  rationale: Equivalência idiomática para 'ouvir palavras de você', sem especificar indevidamente que se trata de sermão ou mensagem formal.
theological_decisions:
- issue: Descrição da piedade de Cornélio sem importar categorias doutrinárias posteriores
  choice: homem justo e temente a Deus
  alternative: homem piedoso; homem justo que reverenciava a Deus
  rationale: Mantém a avaliação moral e religiosa positiva presente no grego, mas não define além do texto sua condição pactual ou salvífica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo todas as afirmações do grego. Não foram necessárias notas, pois as escolhas principais podem ser expressas claramente no corpo do versículo.
