  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: pt
  text: não a todo o povo, mas a testemunhas escolhidas de antemão por Deus[a] — a nós, que comemos e bebemos com ele depois que ele ressuscitou dentre os mortos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “designadas de antemão por Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “depois que ele foi ressuscitado dentre os mortos”. O grego aqui é naturalmente traduzido por “depois que ele ressuscitou dentre os mortos”, embora a formulação passiva apareça em outros lugares do Novo Testamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: não a todo o povo
  rationale: Preserva o contraste entre o povo em geral e o grupo limitado de testemunhas, em português natural.
- source_word: μάρτυσι
  choice: a testemunhas
  rationale: Em Atos, o termo designa aqueles que dão testemunho do que viram; “testemunhas” é a equivalência corrente e clara.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: escolhidas de antemão por Deus
  rationale: O particípio perfeito passivo indica uma escolha divina anterior com relevância contínua. “Escolhidas de antemão” comunica isso de modo claro, sem excluir a alternativa “designadas de antemão”.
- source_word: ἡμῖν
  choice: a nós
  rationale: O dativo está em aposição a “testemunhas”, identificando-as; o travessão torna essa explicação natural em português.
- source_word: οἵτινες
  choice: que
  rationale: Introduz a descrição das testemunhas; a forma simples “que” preserva o sentido com fluidez.
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: comemos e bebemos com ele
  rationale: Mantém o caráter concreto da comunhão à mesa e do encontro corporal posterior à ressurreição.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: depois que ressuscitou dentre os mortos
  rationale: A construção é temporal, e ἀναστῆναι tem aqui sentido intransitivo. “Ressuscitou dentre os mortos” segue naturalmente a forma grega e a expressão neotestamentária.
theological_decisions:
- issue: Formulação da ressurreição em ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: depois que ressuscitou dentre os mortos
  alternative: depois que foi ressuscitado dentre os mortos
  rationale: A forma grega é naturalmente vertida no ativo/intransitivo, “ressuscitou”. Isso não nega a ação divina afirmada em outros textos; apenas preserva a formulação deste versículo. A alternativa passiva é registrada em nota para manter visível a possível formulação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão explicita a aposição sem acrescentar conteúdo. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
