base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: pt
  text: No dia seguinte, ele entrou em Cesareia[a]. Cornélio os esperava e havia convocado seus parentes e amigos próximos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz o verbo no singular, “ele entrou”, mas depois emprega o pronome plural, “os”. Provavelmente, Pedro é destacado como figura principal, enquanto seus acompanhantes estão incluídos entre os que Cornélio esperava.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal idiomática que preserva com naturalidade a sequência narrativa; δέ não exige tradução explícita aqui.
- source_word: εἰσῆλθεν
  choice: ele entrou
  rationale: Mantém o aoristo singular do texto grego, com Pedro em foco como figura principal.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo grego.
- source_word: ὁ δὲ Κορνήλιος
  choice: Cornélio
  rationale: A mudança suave de foco marcada por δέ pode ser comunicada naturalmente pela ordem narrativa, sem acrescentar contraste.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: os esperava
  rationale: Reproduz o sentido durativo da construção perifrástica no imperfeito e conserva o pronome plural, referente a Pedro e seus acompanhantes.
- source_word: συγκαλεσάμενος
  choice: havia reunido
  rationale: Expressa de modo natural a ação anterior de convocar e juntar pessoas antes da chegada esperada.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: seus parentes
  rationale: Equivalente moderno, claro e direto de συγγενεῖς.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: amigos íntimos
  rationale: Neste contexto, ἀναγκαίους qualifica amigos de relação estreita ou íntima, e não amigos 'necessários' em sentido literal.
