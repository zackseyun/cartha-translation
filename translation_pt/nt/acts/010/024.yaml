- from: No dia seguinte, ele entrou em Cesareia.[a] Cornélio os esperava e havia reunido seus parentes e amigos íntimos.
  to: No dia seguinte, ele entrou em Cesareia[a]. Cornélio os esperava e havia convocado seus parentes e amigos próximos.
