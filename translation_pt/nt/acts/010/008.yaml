  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: pt
  text: E, depois de lhes explicar tudo, enviou-os a Jope.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: depois de explicar
  rationale: O particípio aoristo médio indica, neste contexto, uma ação anterior ao verbo principal. “Depois de explicar” expressa naturalmente essa relação temporal e a ideia de expor o assunto de modo completo.
- source_word: ἅπαντα
  choice: tudo
  rationale: 'O neutro plural de ἅπας tem aqui sentido abrangente: “tudo”. A formulação é clara e idiomática em português.'
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome no dativo funciona como objeto indireto de ἐξηγησάμενος; “lhes” mantém essa relação de forma concisa e natural.
- source_word: ἀπέστειλεν
  choice: enviou-os
  rationale: ἀποστέλλω significa enviar. “Enviou-os” é uma tradução direta, clara e sem a possível conotação adicional de urgência presente em alternativas como “despachou-os”.
- source_word: εἰς τὴν Ἰόππην
  choice: a Jope
  rationale: εἰς indica movimento em direção a um destino. “A Jope” é uma forma natural em português, e “Jope” é o nome tradicional e amplamente reconhecido da cidade nas traduções bíblicas em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura fluente e próxima do grego. O pronome enclítico em “enviou-os” preserva a referência explícita aos homens sem tornar a frase pesada.
