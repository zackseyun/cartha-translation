id: ACT.10.43
reference: Acts 10:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: pt
  text: 'Todos os profetas dão testemunho a respeito dele[a]: todo aquele que crê nele recebe, por meio do seu nome, o perdão dos pecados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “testificam acerca dele”.'
    reason: Alternativa lexical para μαρτυροῦσιν e τούτῳ, conservando a imagem de testemunho.
lexical_decisions:
- source_word: τούτῳ
  choice: a respeito dele
  rationale: O dativo demonstrativo ligado a μαρτυροῦσιν indica aquele acerca de quem os profetas testemunham. “A respeito dele” é natural em português e identifica Jesus como o conteúdo do testemunho.
- source_word: πάντες οἱ προφῆται
  choice: Todos os profetas
  rationale: Reproduz diretamente a abrangência universal da expressão e abarca o testemunho profético sem transformar “profetas” em título formal de uma coleção.
- source_word: μαρτυροῦσιν
  choice: dão testemunho
  rationale: Expressão corrente e digna que preserva a força declarativa e comprobatória do verbo grego.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: o perdão dos pecados
  rationale: É a forma portuguesa estabelecida e clara para a expressão neotestamentária, preservando seu sentido relacional e judicial.
- source_word: λαβεῖν
  choice: recebe
  rationale: O infinitivo integra o conteúdo do testemunho profético. A forma finita “recebe” torna a declaração geral natural em português sem alterar sua relação sintática essencial.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: por meio do seu nome
  rationale: Preserva a linguagem bíblica do nome como meio ou agência, sem explicitar como “autoridade” aquilo que o texto deixa implícito.
- source_word: πάντα τὸν πιστεύοντα
  choice: todo aquele que crê
  rationale: A construção participial masculina singular é genérica e distributiva. Esta formulação natural inclui qualquer pessoa que crê, sem restringir o sentido aos homens.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com πιστεύω, εἰς expressa fé ou confiança dirigida a uma pessoa; “crê nele” é o equivalente idiomático adequado em português.
theological_decisions:
- issue: Abrangência e condição do perdão
  choice: O perdão dos pecados é recebido, por meio do nome de Jesus, por todo aquele que crê nele.
  alternative: Expandir a frase com uma formulação doutrinária mais específica sobre o mecanismo da salvação.
  rationale: A tradução conserva a relação explicitamente afirmada entre Jesus, fé e perdão, sem acrescentar uma formulação confessional que ultrapasse o grego.
- issue: Particípio masculino genérico
  choice: todo aquele que crê
  alternative: todo homem que crê
  rationale: O masculino singular grego tem sentido representativo e genérico, não exclusivamente masculino; a escolha comunica com exatidão a abrangência do original.
- issue: Sentido de “nome”
  choice: por meio do seu nome
  alternative: por meio da autoridade do seu nome
  rationale: “Nome” pode envolver a pessoa e a autoridade de Jesus, mas o texto não explicita essa paráfrase. A tradução mantém a amplitude teológica da expressão original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da segunda oração foi levemente ajustada para fluência, mantendo “por meio do seu nome” próximo do verbo “recebe”. “Crê” preserva o registro bíblico corrente sem soar arcaico.
