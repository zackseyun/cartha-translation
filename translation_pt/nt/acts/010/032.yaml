id: ACT.10.32
reference: Acts 10:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: pt
  text: Portanto, envie alguém a Jope e mande chamar Simão[a], que é chamado Pedro. Ele está hospedado[b] na casa de Simão, um curtidor de couro, junto ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mande buscar Simão”; o verbo grego significa providenciar que alguém seja chamado para vir até quem dá a ordem.
    reason: lexical_alternative
  - marker: b
    text: Ou “está alojado”; o grego indica que Pedro está sendo recebido como hóspede.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον
  choice: envie alguém
  rationale: O imperativo pede uma ação direta. Como o grego deixa implícita a pessoa enviada, “alguém” torna a frase natural em português sem especificar além do contexto.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a ligação inferencial com a instrução anterior.
- source_word: εἰς Ἰόππην
  choice: a Jope
  rationale: Expressa de modo idiomático o destino indicado por εἰς.
- source_word: μετακάλεσαι
  choice: mande chamar
  rationale: O verbo médio significa providenciar que alguém seja chamado para vir até quem fala; “mande chamar” conserva esse sentido e a força da ordem.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Simão, que é chamado Pedro
  rationale: Reproduz com clareza a identificação de Simão pelo nome alternativo Pedro, sem acrescentar a ideia de sobrenome.
- source_word: οὗτος
  choice: Ele
  rationale: Retoma naturalmente Simão Pedro em português.
- source_word: ξενίζεται
  choice: está hospedado
  rationale: Comunica que Pedro recebe hospitalidade como hóspede, nuance presente na forma verbal grega.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: na casa de Simão, um curtidor de couro
  rationale: Mantém a referência explícita à casa e identifica em linguagem corrente o ofício de Simão.
- source_word: παρὰ θάλασσαν
  choice: junto ao mar
  rationale: Expressa de forma natural a localização ao lado do mar.
theological_decisions: []
