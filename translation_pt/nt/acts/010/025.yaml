source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: pt
  text: Quando Pedro entrou, Cornélio foi ao encontro dele, prostrou-se aos seus pés e lhe prestou homenagem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorou”. O verbo grego pode indicar tanto adoração quanto um ato de prostração ou homenagem, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Quando Pedro entrou
  rationale: A construção idiomática introduz a circunstância temporal. Esta formulação natural preserva o valor temporal e narrativo sem reproduzir de modo rígido a sintaxe grega.
- source_word: συναντήσας αὐτῷ
  choice: foi ao encontro dele
  rationale: O particípio descreve Cornélio encontrando Pedro; a expressão explicita naturalmente em português o movimento de recepção sugerido pelo contexto.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: prostrou-se aos seus pés
  rationale: A expressão comunica tanto a postura física quanto o gesto de profunda reverência, em linguagem corrente e digna.
- source_word: προσεκύνησεν
  choice: lhe prestou homenagem
  rationale: O verbo pode indicar adoração ou prostração reverente. “Prestou homenagem” conserva a reverência excessiva dirigida a Pedro sem decidir que Cornélio pretendia prestar-lhe culto divino; a alternativa é registrada em nota.
theological_decisions:
- issue: Sentido de προσκυνέω quando dirigido a Pedro
  choice: lhe prestou homenagem
  alternative: o adorou
  rationale: O campo semântico inclui tanto adoração quanto prostração ou homenagem. Como Pedro rejeita imediatamente o gesto no versículo seguinte por também ser humano, o texto principal preserva a gravidade do ato sem impor uma interpretação de culto divino; a ambiguidade lexical genuína permanece visível na nota.
translation_notes:
  register: Português moderno, claro e amplamente internacional, com boa legibilidade brasileira. “Prostrou-se” mantém o tom digno e descreve com precisão o gesto; “foi ao encontro dele” soa natural na narrativa. O marcador foi colocado junto à expressão a que a nota lexical se refere.
