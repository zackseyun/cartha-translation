base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: pt
  text: Então chamaram e perguntaram se Simão, chamado Pedro, estava hospedado ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava alojado ali” ou “estava sendo recebido ali como hóspede”. O verbo grego indica uma estadia como hóspede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: chamaram
  rationale: O particípio aoristo indica a ação que precede a pergunta. “Chamaram” é natural em português e, no contexto de pessoas à porta, comunica que chamaram alguém da casa sem acrescentar a intensidade de “gritaram”.
- source_word: ἐπυνθάνοντο
  choice: perguntaram
  rationale: O imperfeito médio descreve a indagação; “perguntaram” expressa com naturalidade a sequência narrativa, sem sobrecarregar o leve aspecto durativo.
- source_word: εἰ
  choice: se
  rationale: Introduz uma pergunta indireta e corresponde de modo idiomático ao português “se”.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Simão, chamado Pedro
  rationale: Mantém os dois nomes e a função identificadora do particípio ἐπικαλούμενος em formulação clara e concisa.
- source_word: ἐνθάδε
  choice: ali
  rationale: Na perspectiva do narrador e dos homens que perguntam pela casa indicada, “ali” soa mais natural em português; o sentido locativo simples permanece.
- source_word: ξενίζεται
  choice: estava hospedado
  rationale: O verbo indica permanecer na condição de hóspede ou receber hospedagem. “Estava hospedado” preserva essa nuance melhor que o genérico “estava ficando”.
