reference: Acts 10:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: pt
  text: E nós somos testemunhas de tudo o que ele fez, tanto na terra dos judeus como em Jerusalém. Eles o mataram, pendurando-o num madeiro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa árvore” ou, de modo interpretativo, “numa cruz”. O grego diz “madeiro”, provavelmente evocando Deuteronômio 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: testemunhas
  rationale: É a correspondência natural e consagrada em português para o testemunho apostólico baseado no que foi presenciado.
- source_word: πάντων ὧν ἐποίησεν
  choice: de tudo o que ele fez
  rationale: Preserva a abrangência de πάντων e soa natural em português atual.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: tanto na terra dos judeus
  rationale: “Terra” representa χώρα sem restringir indevidamente a expressão à província romana da Judeia; “dos judeus” conserva o genitivo e sua possível dimensão étnico-regional.
- source_word: καὶ Ἰερουσαλήμ
  choice: como em Jerusalém
  rationale: A construção correlativa “tanto... como...” expressa τε...καί, e a repetição de “em” torna a frase clara em português.
- source_word: ἀνεῖλαν
  choice: o mataram
  rationale: Traduz diretamente o sentido de tirar a vida, com linguagem atual e digna, sem acrescentar uma moldura judicial que o verbo, isoladamente, não exige.
- source_word: κρεμάσαντες
  choice: pendurando-o
  rationale: O gerúndio preserva a relação circunstancial entre o particípio e o verbo principal, sem fixá-la exclusivamente como meio ou sequência temporal.
- source_word: ἐπὶ ξύλου
  choice: num madeiro
  rationale: “Madeiro” conserva a referência a madeira/árvore e a ressonância bíblica da execução sem substituir ξύλον pelo termo interpretativo “cruz”.
theological_decisions:
- issue: Sentido de ξύλον no contexto da crucificação
  choice: num madeiro
  alternative: numa árvore; numa cruz
  rationale: O grego emprega ξύλον, não σταυρός. “Madeiro” mantém a escolha lexical e a provável evocação de Deuteronômio 21:23, enquanto o contexto permite reconhecer a crucificação sem explicitá-la além do texto.
- issue: Relação de κρεμάσαντες com ἀνεῖλαν
  choice: o mataram, pendurando-o
  alternative: o mataram ao pendurá-lo; depois de pendurá-lo, mataram-no
  rationale: A formulação conserva alguma abertura circunstancial do particípio grego e evita impor de maneira absoluta uma leitura instrumental ou estritamente temporal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Madeiro” é ligeiramente literário, mas permanece compreensível e preserva melhor a conexão intertextual do que a substituição direta por “cruz”.
