  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: pt
  text: 'Então Pedro desceu até os homens e disse: “Vejam, sou eu quem vocês procuram. Por que vocês estão aqui?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: desceu
  rationale: O particípio aoristo de καταβαίνω indica que Pedro desceu do lugar elevado onde estava; a forma finita é natural em português e preserva o movimento descendente.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ faz avançar a narrativa, sem marcar contraste forte; “Então” expressa bem essa continuidade.
- source_word: πρὸς τοὺς ἄνδρας
  choice: até os homens
  rationale: πρός com acusativo indica movimento em direção aos homens; “até os homens” comunica naturalmente que Pedro foi ao encontro deles.
- source_word: Ἰδοὺ
  choice: Eu sou
  rationale: Neste contexto, ἰδού chama atenção para a identificação enfática de Pedro. Em português corrente, a ênfase pode ser transmitida naturalmente pela declaração direta, sem o pouco idiomático “Olhem”.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: Eu sou quem vocês estão procurando
  rationale: A formulação identifica Pedro como a pessoa procurada e preserva o valor da oração relativa em português natural.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Por que vocês estão aqui?
  rationale: A pergunta idiomática preserva tanto a noção de motivo em αἰτία quanto o estado de presença expresso por πάρεστε.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O plural “vocês” evita uma forma regional ou arcaizante; a fala direta mantém o tom simples da narrativa.
