  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: pt
  text: Ele está hospedado na casa de certo Simão, curtidor de couro, cuja casa fica à beira-mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Ele
  rationale: O pronome retoma Pedro no contexto; “Ele” é a forma natural em português e evita a rigidez de “Este homem”.
- source_word: ξενίζεται
  choice: está hospedado
  rationale: A forma presente de ξενίζω indica que alguém está sendo recebido como hóspede ou permanecendo na casa de outra pessoa. “Está hospedado” preserva esse sentido.
- source_word: παρά τινι Σίμωνι
  choice: na casa de certo Simão
  rationale: παρά com dativo situa Pedro junto de Simão, e τις mantém a referência indefinida. Em português, “na casa de certo Simão” explicita naturalmente a hospedagem sem alterar o sentido.
- source_word: βυρσεῖ
  choice: curtidor de couro
  rationale: βυρσεύς designa quem curte peles para produzir couro. A expressão é clara para leitores modernos e mais precisa que o termo amplo “trabalhador do couro”.
- source_word: ᾧ ἐστιν οἰκία
  choice: cuja casa fica
  rationale: A construção identifica Simão como o proprietário da casa e sua localização. “Cuja casa fica” é conciso e idiomático.
- source_word: παρὰ θάλασσαν
  choice: à beira-mar
  rationale: παρά com acusativo expressa proximidade espacial. “À beira-mar” transmite de modo natural que a casa se localiza junto ao mar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a indefinição de τις em “certo Simão” e o sentido de hospedagem de ξενίζεται.
