  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: pt
  text: 'E uma voz lhe falou de novo, pela segunda vez: “Não considere comum[a] aquilo que Deus purificou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não considere impuro” ou “não trate como impuro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: uma voz
  rationale: O substantivo sem artigo é naturalmente expresso de modo indefinido em português, mantendo o foco na manifestação vocal.
- source_word: πάλιν ἐκ δευτέρου
  choice: de novo, pela segunda vez
  rationale: Preserva os dois elementos, πάλιν e ἐκ δευτέρου, bem como a ênfase algo redundante do grego, em português natural.
- source_word: πρὸς αὐτόν
  choice: lhe falou
  rationale: Integra idiomaticamente o destinatário à expressão verbal em português, sem alterar o sentido de uma voz dirigida a Pedro.
- source_word: Ἃ
  choice: aquilo que
  rationale: Expressa naturalmente o relativo neutro plural empregado em sentido coletivo e geral.
- source_word: ἐκαθάρισεν
  choice: purificou
  rationale: Comunica o ato decisivo de Deus e preserva a ressonância de pureza ritual melhor que uma formulação meramente higiênica como 'limpou'.
- source_word: σὺ μὴ κοίνου
  choice: não considere comum
  rationale: O pronome explícito reforça o contraste com a ação de Deus; 'considere comum' apresenta κοινόω como avaliação ou classificação, preservando o vocabulário específico de pureza.
theological_decisions:
- issue: Linguagem de pureza na visão de Pedro
  choice: “Não considere comum” no texto principal
  alternative: “Não considere impuro” ou “não trate como contaminado”
  rationale: A tradução principal mantém a distinção lexical entre καθαρίζω, 'purificar', e κοινόω, 'considerar comum/profanar'. As alternativas explicam o sentido contextual sem apagar essa tensão terminológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'de novo, pela segunda vez' conserva deliberadamente a repetição enfática do original; 'comum' mantém a categoria ritual antiga, esclarecida pela nota.
