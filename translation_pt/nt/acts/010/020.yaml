  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: pt
  text: Mas levante-se, desça e vá com eles, sem hesitar[a], porque fui eu que os enviei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem fazer distinção”. O particípio grego pode indicar tanto não hesitar quanto não fazer distinção; este último sentido pode ecoar o tema da relação entre judeus e gentios neste capítulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste entre a perplexidade anterior de Pedro e a ordem para agir, em português natural e conciso.
- source_word: ἀναστὰς
  choice: levante-se
  rationale: O particípio aoristo integra a sequência de ordens e pede ação imediata; “levante-se” é claro e corrente.
- source_word: κατάβηθι
  choice: desça
  rationale: Preserva o movimento para baixo desde o terraço onde Pedro estava.
- source_word: πορεύου σὺν αὐτοῖς
  choice: vá com eles
  rationale: Expressa de modo natural tanto o deslocamento quanto o acompanhamento dos mensageiros.
- source_word: μηδὲν διακρινόμενος
  choice: sem hesitar
  rationale: No contexto imediato, Pedro deve acompanhar os homens sem vacilar. A formulação é idiomática e mantém em nota o outro sentido lexical plausível.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão para Pedro obedecer.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: fui eu que os enviei
  rationale: 'A construção destaca o pronome explícito ἐγώ e comunica a ação concluída cujo resultado permanece relevante: os homens estão ali como enviados pelo Espírito.'
theological_decisions:
- issue: Sentido de μηδὲν διακρινόμενος em relação à inclusão dos gentios
  choice: “sem hesitar” no texto principal
  alternative: “sem fazer distinção”
  rationale: O contexto imediato favorece a ordem para Pedro não vacilar diante da visão e da chegada dos mensageiros. Contudo, o sentido de não fazer distinção também é lexicalmente possível e se harmoniza com o tema judeus-gentios no capítulo; por isso, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas imperativas naturais e legibilidade ampla no Brasil. O marcador da nota foi colocado junto à expressão ambígua a que se refere.
