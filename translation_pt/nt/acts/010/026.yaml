  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: pt
  text: 'Mas Pedro o levantou[a], dizendo: “Levante-se[b]. Eu também sou homem[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajudou-o a se levantar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Fique de pé”.
    reason: lexical_alternative
  - marker: c
    text: Ou “Eu mesmo também sou ser humano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: o levantou
  rationale: Preserva o sentido direto de ἐγείρω e indica que Pedro fez Cornélio erguer-se, sem especificar além do texto se o puxou ou apenas o ajudou.
- source_word: Ἀνάστηθι
  choice: Levante-se
  rationale: Imperativo direto e natural em português para mandar Cornélio sair da posição prostrada e ficar de pé.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: Eu também
  rationale: 'Expressa de modo idiomático a inclusão enfática: o próprio Pedro compartilha a mesma condição humana.'
- source_word: ἄνθρωπός εἰμι
  choice: sou homem
  rationale: Tradução concisa e direta da autodeclaração singular de Pedro; evita acrescentar “apenas”, que não está explícito no grego.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre a prostração de Cornélio no versículo anterior e a reação corretiva de Pedro.
theological_decisions:
- issue: A reação de Pedro à prostração reverencial
  choice: Pedro manda Cornélio levantar-se e fundamenta sua reação na humanidade que ambos compartilham.
  alternative: A declaração pode ser entendida de modo mais restrito como simples expressão de humildade pessoal.
  rationale: A formulação conserva o sentido claro da cena sem desenvolver uma doutrina de culto ou veneração que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Levante-se” mantém a fala natural e respeitosa; “sou homem” preserva a formulação direta do grego, enquanto a nota registra a alternativa inclusiva “ser humano”.
