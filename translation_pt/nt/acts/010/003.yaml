base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: pt
  text: 'Ele viu claramente[a], numa visão, por volta da nona hora do dia[b], um anjo de Deus entrar onde ele estava e lhe dizer: “Cornélio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo manifesto”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, por volta das três horas da tarde na contagem moderna.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo de ὁράω descreve diretamente o ato de ver; “viu” é natural e preserva o caráter concreto da experiência visionária.
- source_word: ἐν ὁράματι
  choice: numa visão
  rationale: ὅραμα designa uma visão ou aparição sobrenatural. “Numa visão” é claro, corrente e não define além do texto o estado de Cornélio.
- source_word: φανερῶς
  choice: claramente
  rationale: O advérbio indica que a visão foi distinta e inequívoca. “Claramente” transmite essa ênfase em português atual.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: por volta da nona hora do dia
  rationale: A expressão mantém o modo antigo de contar as horas e traduz a aproximação indicada por ὡσεὶ e περὶ. O equivalente moderno é dado em nota.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: um anjo de Deus
  rationale: No contexto explícito de uma visão, ἄγγελος se refere naturalmente a um ser celestial; “anjo de Deus” é preciso e tradicional sem acrescentar interpretação.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: entrar onde ele estava
  rationale: A formulação preserva o movimento de entrada expresso por εἰσελθόντα e comunica com naturalidade que o anjo entrou na presença de Cornélio.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: e lhe dizer
  rationale: O infinitivo coordenado em português acompanha naturalmente “viu” e reflete os dois particípios acusativos gregos sem criar uma nova oração independente.
- source_word: Κορνήλιε
  choice: Cornélio!
  rationale: Forma portuguesa corrente do nome próprio no vocativo. O ponto de exclamação sinaliza o chamado direto sem alterar seu conteúdo.
theological_decisions:
- issue: Natureza de ἄγγελος no contexto
  choice: ser angelical celestial
  alternative: mensageiro humano
  rationale: A visão e a designação “de Deus” tornam o referente sobrenatural o sentido contextual evidente. A tradução não acrescenta descrição doutrinária além de “anjo”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se “nona hora do dia” para transparência histórica, explicando-se a equivalência moderna em nota. A ordem da frase permanece próxima à grega, mas “entrar onde ele estava” evita uma construção artificial em português.
