source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: pt
  text: 'E Cornélio disse: “Há quatro dias, a esta mesma hora, eu estava orando em minha casa, à hora nona[a], e eis que um homem com roupas resplandecentes se pôs diante de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por volta das três da tarde.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: O aoristo funciona como introdução narrativa direta da fala; “disse” é a forma natural em português.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Há quatro dias, a esta mesma hora
  rationale: A expressão indica o momento correspondente, quatro dias antes. Esta formulação comunica naturalmente em português tanto o intervalo quanto a referência à mesma hora.
- source_word: ἤμην ... προσευχόμενος
  choice: eu estava orando
  rationale: A construção perifrástica no imperfeito apresenta uma ação em andamento no passado.
- source_word: τὴν ἐνάτην
  choice: à hora nona
  rationale: Preserva a designação temporal do contexto antigo; o equivalente moderno aparece em nota.
- source_word: ἐν τῷ οἴκῳ μου
  choice: em minha casa
  rationale: Tradução direta e idiomática da localização física.
- source_word: ἰδοὺ
  choice: quando, de repente
  rationale: No relato, ἰδού introduz com vivacidade o aparecimento inesperado. A formulação evita o arcaísmo pouco natural de “eis que” sem transformar o termo em mero marcador cronológico.
- source_word: ἀνὴρ
  choice: um homem
  rationale: O substantivo designa uma figura apresentada em forma humana masculina, sem explicitar no texto mais do que o grego diz.
- source_word: ἔστη ἐνώπιόν μου
  choice: se pôs diante de mim
  rationale: Expressa que a figura tomou posição diante de Cornélio, preservando o sentido de ἵστημι com ἐνώπιον.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: com roupas resplandecentes
  rationale: ἐσθής denota vestimenta, e λαμπρός sugere brilho ou esplendor; “resplandecentes” conserva a força visual em registro digno e compreensível.
theological_decisions:
- issue: Forma de apresentar a hora indicada por τὴν ἐνάτην
  choice: à hora nona
  alternative: por volta das três da tarde
  rationale: Mantém no texto a forma de contagem do tempo do mundo narrado, enquanto a nota fornece ao leitor o equivalente moderno.
- issue: Identidade da figura descrita como ἀνὴρ
  choice: um homem
  alternative: um anjo
  rationale: Embora o contexto identifique a figura como angelical, este versículo a descreve literalmente como “um homem”; a tradução não antecipa nem explicita essa interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a expressão cultural “hora nona” e sinalizando sua explicação com [a].
