id: ACT.10.33
reference: Acts 10:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: pt
  text: Por isso, mandei chamá-lo imediatamente[a], e você fez bem em vir. Agora, pois, estamos todos aqui diante de Deus para ouvir tudo o que lhe foi ordenado pelo Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem demora”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “Senhor” provavelmente se refere a Jesus, embora alguns entendam a expressão de modo mais geral como referência a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: imediatamente
  rationale: A expressão adverbial indica ação pronta, sem demora; “imediatamente” é clara e natural em português moderno.
- source_word: οὖν
  choice: Por isso
  rationale: No início da fala, a conjunção apresenta a ação de Cornélio como consequência do que ele acaba de relatar.
- source_word: ἔπεμψα πρὸς σέ
  choice: mandei chamá-lo
  rationale: Embora a forma seja literalmente “enviei a você”, o contexto mostra que Cornélio enviou mensageiros para chamar Pedro; esta formulação comunica o sentido idiomático sem explicitação excessiva.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: e você fez bem em vir
  rationale: Reproduz de modo corrente a expressão grega de aprovação e liga a vinda de Pedro ao envio dos mensageiros.
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Marca a transição para o propósito da reunião, conservando tanto a referência ao momento presente quanto a conexão discursiva.
- source_word: πάντες ἡμεῖς
  choice: estamos todos
  rationale: Mantém a ênfase coletiva nos familiares e amigos reunidos com Cornélio.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Preserva a ideia solene de estarem conscientemente na presença de Deus.
- source_word: πάρεσμεν
  choice: estamos todos aqui
  rationale: O verbo significa estar presente; “estamos aqui” é a expressão mais natural em português atual.
- source_word: ἀκοῦσαι
  choice: para ouvir
  rationale: O infinitivo expressa o propósito da reunião de forma direta.
- source_word: πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ κυρίου
  choice: tudo o que lhe foi ordenado pelo Senhor
  rationale: Mantém a totalidade, a força autoritativa do particípio perfeito passivo e o agente expresso no grego, sem identificar além do texto quem é “o Senhor”.
theological_decisions:
- issue: Referente de τοῦ κυρίου (“do Senhor”)
  choice: Senhor
  alternative: Deus; ou “Senhor Jesus” como explicitação interpretativa
  rationale: O texto apresentado diz apenas “o Senhor”. No contexto de Atos 10, a expressão provavelmente se refere a Jesus, mas a formulação também pode ser entendida de modo mais geral como referência a Deus. A tradução conserva a expressão e sua tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna natural a fala direta dirigida a Pedro; “lhe” evita repetição e mantém clareza. A estrutura passiva em “lhe foi ordenado pelo Senhor” preserva de perto a relação gramatical e teológica do grego.
