  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: pt
  text: Isso aconteceu três vezes, e imediatamente o objeto[a] foi levado para o céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lençol”. O termo grego pode significar, de modo amplo, “recipiente”, “utensílio” ou “objeto”, mas o contexto anterior descreve o referente como algo semelhante a um grande lençol.
    reason: lexical_alternative
  - marker: b
    text: Ou “para o firmamento”. A palavra grega pode indicar tanto o céu visível quanto o céu como esfera divina; neste contexto visionário, “céu” parece mais adequado.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: Isso
  rationale: O demonstrativo neutro retoma o acontecimento descrito anteriormente; “Isso” é natural em português e preserva a referência anafórica.
- source_word: δὲ
  choice: —
  rationale: Aqui, δέ funciona como conectivo leve; sua força é absorvida pela fluidez da frase, sem exigir uma palavra separada em português.
- source_word: ἐγένετο
  choice: aconteceu
  rationale: O uso eventivo de γίνομαι é expresso de modo claro e corrente por “aconteceu”.
- source_word: ἐπὶ τρίς
  choice: três vezes
  rationale: Expressão idiomática de repetição; “três vezes” é a formulação moderna e direta.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a ideia de prontidão e a transição repentina da narrativa.
- source_word: ἀνελήμφθη
  choice: foi levado
  rationale: Mantém a voz passiva e, com o complemento “para o céu”, comunica naturalmente o movimento ascendente.
- source_word: τὸ σκεῦος
  choice: o recipiente
  rationale: σκεῦος é um termo amplo para recipiente, utensílio ou objeto. “Recipiente” preserva essa generalidade melhor que “lençol”, que vem do contexto anterior, não deste substantivo em si.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: A preposição εἰς indica direção; “para o céu” é natural em português e se ajusta ao contexto visionário, sem eliminar a possibilidade lexical de “firmamento”.
theological_decisions:
- issue: Referente de οὐρανός na visão de Pedro
  choice: céu
  alternative: firmamento
  rationale: Embora οὐρανός também possa designar o céu visível ou firmamento, o contexto de uma visão em que o objeto desce e retorna favorece “céu”, preservando a dimensão divina da cena sem exceder o texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A ordem narrativa do grego foi preservada sem rigidez, e as ambiguidades relevantes de σκεῦος e οὐρανός foram registradas em notas.
