id: ACT.10.13
reference: Acts 10:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: pt
  text: 'E uma voz lhe disse: “Levante-se, Pedro; mate[a] e coma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifique”. O verbo traduzido como “mate” também pode significar “sacrificar”, mas, no contexto da visão, provavelmente se refere a matar um animal para servir de alimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: disse
  rationale: Com φωνή como sujeito e πρὸς αὐτόν indicando o destinatário, a construção introduz idiomaticamente uma voz que se dirige a Pedro. Em português, “uma voz lhe disse” expressa o acontecimento de modo natural, sem a formulação pouco idiomática “uma voz veio a ele”.
- source_word: φωνὴ
  choice: uma voz
  rationale: No contexto revelatório, refere-se a uma voz articulada, não a um simples som. O substantivo sem artigo é naturalmente traduzido como “uma voz”.
- source_word: πρὸς αὐτόν
  choice: lhe
  rationale: Com um ato de fala, πρός com acusativo indica a pessoa a quem a fala é dirigida. O pronome “lhe” comunica isso de forma concisa e idiomática.
- source_word: Ἀναστάς
  choice: Levante-se
  rationale: O particípio aoristo funciona imperativamente e antecede as ordens seguintes. “Levante-se” é claro, atual e adequado ao registro digno.
- source_word: Πέτρε
  choice: Pedro
  rationale: É o vocativo de Πέτρος; “Pedro” é a forma tradicional e corrente do nome em português.
- source_word: θῦσον
  choice: mate
  rationale: Embora θύω também possa significar “sacrificar”, aqui a ordem está ligada a preparar um animal para comer. “Mate” preserva o sentido prático sem introduzir no texto principal uma referência cultual incerta; a alternativa é registrada em nota.
- source_word: φάγε
  choice: coma
  rationale: Imperativo direto de ἐσθίω. “Coma” é a tradução simples, natural e semanticamente precisa.
- source_word: καὶ
  choice: E / e
  rationale: O primeiro καί dá continuidade à narrativa, e o segundo coordena as duas ordens. “E” preserva ambas as relações sem expansão interpretativa.
theological_decisions:
- issue: Se θῦσον deve ser traduzido com linguagem sacrificial
  choice: “mate” no texto principal
  alternative: “sacrifique”
  rationale: O contexto imediato trata dos animais da visão e da ordem de comer, não de um sacrifício cultual. “Sacrifique” poderia teologizar excessivamente a cena; como a acepção sacrificial pertence ao campo semântico real do verbo, ela é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “uma voz lhe disse” prioriza naturalidade sem perder o caráter eventivo e revelatório da fala.
