  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: pt
  text: 'Mas Pedro disse: “De modo nenhum, Senhor, porque nunca comi coisa alguma comum e impura.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: De modo nenhum
  rationale: Expressa com naturalidade e força a recusa enfática de Pedro.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva a forma direta de tratamento e a ambiguidade contextual quanto à identidade de quem fala.
- source_word: ὅτι
  choice: porque
  rationale: Mantém aqui o valor causal, introduzindo a razão dada por Pedro.
- source_word: κοινὸν
  choice: comum
  rationale: Conserva o termo ritual que designa o que é profanado ou não consagrado, sem fundi-lo com ἀκάθαρτον.
- source_word: ἀκάθαρτον
  choice: impura
  rationale: Representa a categoria de impureza ritual e concorda naturalmente com “coisa”.
- source_word: καὶ
  choice: e
  rationale: 'Preserva a coordenação do texto crítico SBLGNT: “comum e impura”, sem substituí-la por “ou”.'
theological_decisions:
- issue: Relação entre “comum” e “impura”
  choice: comum e impura
  alternative: comum ou impura
  rationale: A tradução mantém a conjunção καί do texto fornecido e não transforma as duas qualificações em categorias alternativas.
- issue: Referente de κύριε
  choice: Senhor
  alternative: senhor
  rationale: A forma tradicional e contextual “Senhor” mantém a reverência do tratamento sem acrescentar uma identificação explícita ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A formulação preserva a distinção lexical e a coordenação do grego.
