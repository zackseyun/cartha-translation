  text: τοῦτον ὁ θεὸς ἤγειρεν ⸀τῇ τρίτῃ ἡμέρᾳ καὶ ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: pt
  text: Esse homem[a], Deus o ressuscitou no terceiro dia e concedeu que ele se tornasse visível[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este” ou “este homem”; o demonstrativo grego é enfático.
    reason: lexical_alternative
  - marker: b
    text: Ou “concedeu que ele aparecesse” ou “fez com que ele se manifestasse”. Literalmente, o grego diz “deu que ele se tornasse visível”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Esse homem
  rationale: O demonstrativo está antecipado e é enfático, retomando Jesus, mencionado no contexto. A construção topicalizada preserva essa ênfase de modo compreensível em português.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: É o sujeito explícito da ação de ressuscitar.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: No contexto da ressurreição, traduz com naturalidade e precisão o sentido de levantar dentre os mortos.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: Expressa naturalmente o dativo temporal sem acrescentar uma forma específica de contagem.
- source_word: ἔδωκεν
  choice: concedeu
  rationale: Preserva a imagem verbal de dar ou conceder, evitando reduzir a construção a uma simples declaração de que Jesus apareceu.
- source_word: αὐτὸν
  choice: ele
  rationale: Retoma Jesus como aquele que se tornou visível; o pronome explícito favorece a clareza em português.
- source_word: ἐμφανῆ
  choice: visível
  rationale: Mantém o sentido de manifesto ou perceptível à vista e conserva a distinção entre a ressurreição e a manifestação posterior.
- source_word: γενέσθαι
  choice: se tornasse
  rationale: Preserva a nuance dinâmica de γίνομαι, em vez de transformá-la numa expressão meramente estática.
theological_decisions:
- issue: Formulação da ressurreição
  choice: Esse homem, Deus o ressuscitou no terceiro dia
  alternative: Deus o ressuscitou no terceiro dia
  rationale: A redação mantém Deus como agente explícito e conserva a ênfase do demonstrativo grego antecipado, sem acrescentar explicação doutrinária.
- issue: Visibilidade depois da ressurreição
  choice: concedeu que ele se tornasse visível
  alternative: fez com que ele aparecesse
  rationale: A escolha preserva tanto o verbo de concessão quanto a ideia de tornar-se visível, mantendo a distinção textual entre ressuscitar e manifestar-se sem definir além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A topicalização com retomada pronominal preserva a ênfase do demonstrativo antecipado; a expressão “concedeu que ele se tornasse visível” é deliberadamente mais formal para conservar a estrutura e a tensão lexical do grego.
