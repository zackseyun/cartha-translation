id: ACT.10.23
reference: Acts 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: pt
  text: Então Pedro os convidou a entrar e lhes deu hospedagem.[a] No dia seguinte, levantou-se e partiu com eles; e alguns dos irmãos de Jope o acompanharam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os hospedou” ou “os recebeu como hóspedes”; o verbo grego se refere aqui a oferecer hospitalidade, dando-lhes pouso.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz o masculino plural grego ἀδελφῶν. No uso cristão antigo, a palavra às vezes pode designar de modo mais amplo outros crentes, isto é, “irmãos e irmãs”; neste contexto, porém, pode referir-se especificamente a homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: convidou a entrar
  rationale: Expressa naturalmente a ação de chamar os homens para dentro e acolhê-los, preservando o valor do particípio médio.
- source_word: οὖν
  choice: Então
  rationale: Marca a consequência narrativa da conversa anterior sem dar ao vínculo uma força lógica excessiva.
- source_word: ἐξένισεν
  choice: deu hospedagem
  rationale: Torna explícito que Pedro lhes ofereceu pouso como ato de hospitalidade, sentido contextual de ξενίζω.
- source_word: Τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: É a formulação temporal corrente e fiel à sequência narrativa.
- source_word: ἀναστὰς
  choice: levantou-se
  rationale: Preserva o movimento simples expresso pelo particípio, sem fundi-lo com a partida subsequente.
- source_word: ἐξῆλθεν
  choice: partiu
  rationale: No contexto de uma viagem, comunica de modo natural que Pedro saiu do lugar, sem precisar reproduzir literalmente 'saiu'.
- source_word: σὺν αὐτοῖς
  choice: com eles
  rationale: Expressa de forma direta o acompanhamento.
- source_word: τινες
  choice: alguns
  rationale: Equivalente português natural do plural indefinido.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Mantém o substantivo masculino plural do grego e seu uso cristão para membros da comunidade, sem neutralizá-lo no texto principal.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: de Jope
  rationale: Identifica de maneira concisa e natural a procedência dos irmãos.
- source_word: συνῆλθον αὐτῷ
  choice: o acompanharam
  rationale: No contexto, o verbo indica que foram junto com Pedro na viagem; 'o acompanharam' é claro e idiomático.
theological_decisions:
- issue: Sentido de ἀδελφῶν em um contexto comunitário potencialmente inclusivo
  choice: irmãos
  alternative: irmãos e irmãs; outros discípulos; outros crentes
  rationale: A forma grega é masculina plural e é mantida no texto. Como o termo no uso cristão antigo pode designar coletivamente os membros da comunidade, a possibilidade mais ampla é registrada em nota, sem resolver além da evidência a composição do grupo.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente naturalizada: a nota [b] foi colocada após a oração sobre os irmãos, junto ao termo que explica. O ponto e vírgula conserva a estreita ligação entre a partida de Pedro e o acompanhamento dos irmãos.'
