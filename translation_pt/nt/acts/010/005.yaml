  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: pt
  text: E agora, envie homens a Jope e mande buscar certo Simão, chamado Pedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “envie homens a Jope e mande chamar um certo Simão, conhecido como Pedro”.'
    reason: Alternativa lexical para “mande buscar” e “chamado Pedro”, preservando os homens como aqueles que são enviados e Simão como a pessoa cuja presença é solicitada.
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação com a fala anterior quanto o valor temporal e discursivo da expressão grega.
- source_word: πέμψον
  choice: envie
  rationale: Imperativo direto e natural em português, correspondente ao aoristo ativo na segunda pessoa do singular.
- source_word: ἄνδρας
  choice: homens
  rationale: Mantém o sentido masculino explícito de ἀνήρ e evita introduzir a interpretação funcional 'mensageiros'.
- source_word: εἰς Ἰόππην
  choice: a Jope
  rationale: Expressão direcional idiomática em português; 'Jope' é a forma tradicional e reconhecível do topônimo.
- source_word: μετάπεμψαι
  choice: mande buscar
  rationale: Expressa naturalmente o imperativo médio de enviar alguém para solicitar a presença de outra pessoa, sem sugerir coerção excessiva.
- source_word: Σίμωνά τινα
  choice: certo Simão
  rationale: Reproduz de modo conciso o valor de τινα, que apresenta uma pessoa específica ainda não identificada ao ouvinte.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: chamado Pedro
  rationale: Comunica de forma natural o nome pelo qual Simão é chamado, sem impor a noção moderna de sobrenome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'mande buscar' é mais corrente do que 'convoque' e conserva a ideia de solicitar a presença de Pedro. O marcador [a] aparece no texto principal.
