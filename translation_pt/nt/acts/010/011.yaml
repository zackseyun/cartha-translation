  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: pt
  text: e vê o céu aberto[a] e algo semelhante a um grande lençol descendo, baixado pelas quatro pontas[b] até a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o céu visível aberto”. A palavra grega também pode se referir ao céu visível.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelos quatro cantos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ao chão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: vê
  rationale: O presente narrativo é mantido, e “vê” comunica de modo natural e imediato a percepção visionária.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: o céu aberto
  rationale: “Céu” preserva em português tanto a referência ao espaço acima quanto a dimensão celestial apropriada ao contexto revelatório; “aberto” reproduz de forma concisa o particípio.
- source_word: καταβαῖνον
  choice: descendo
  rationale: O gerúndio expressa a ação em curso do particípio presente e mantém o movimento descendente.
- source_word: σκεῦός τι
  choice: algo
  rationale: “Algo” preserva a indefinição deliberada da expressão grega sem impor a função de objeto, utensílio ou recipiente.
- source_word: ὡς ὀθόνην μεγάλην
  choice: semelhante a um grande lençol
  rationale: A formulação mantém a comparação introduzida por ὡς e usa um termo corrente para uma grande peça de tecido, sem especificar indevidamente o material.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: pelas quatro pontas
  rationale: ἀρχαί designa aqui as extremidades; “pontas” é natural para um tecido e evita restringir o sentido exclusivamente a cantos geométricos.
- source_word: καθιέμενον
  choice: baixado
  rationale: O particípio passivo indica que o objeto é feito descer; “baixado” conserva essa passividade de modo claro e evita o peso estilístico de “sendo baixado” após “descendo”.
- source_word: ἐπὶ τῆς γῆς
  choice: até a terra
  rationale: Com o movimento descendente, a expressão indica direção ou destino; “até a terra” é idiomático e preserva a amplitude de γῆ.
theological_decisions:
- issue: Sentido de οὐρανός no contexto da visão
  choice: céu
  alternative: firmamento
  rationale: Em português, “céu” abrange naturalmente o céu visível e a esfera celestial, preservando a ambiguidade lexical ao mesmo tempo que se ajusta ao caráter revelatório da cena.
- issue: Agente implícito em καθιέμενον
  choice: manter a forma passiva sem identificar o agente
  alternative: explicitar que Deus o baixava
  rationale: O grego não nomeia quem faz o objeto descer; a tradução não acrescenta uma identificação teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com presente narrativo. A ordem das palavras conserva a unidade de “algo semelhante a um grande lençol” e distingue “descendo” do passivo “baixado”, sem tornar a frase excessivamente literal.
