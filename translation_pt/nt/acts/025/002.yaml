  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: pt
  text: Então os principais sacerdotes e os líderes dos judeus expuseram a ele o caso contra Paulo[a] e insistiam com ele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “informaram-no a respeito de Paulo” ou “apresentaram diante dele uma acusação contra Paulo”. O verbo grego pode significar dar conhecimento de um assunto e, neste contexto, provavelmente tem uma nuance jurídica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: apresentaram ... suas acusações
  rationale: No contexto jurídico diante do governador, o verbo indica levar formalmente um assunto ao conhecimento da autoridade. A formulação comunica a nuance forense sem pressupor uma acusação técnica formal além do que o grego explicita.
- source_word: τέ
  choice: Então
  rationale: Partícula conectiva que liga o versículo ao fluxo narrativo anterior; “Então” produz uma transição natural em português.
- source_word: αὐτῷ
  choice: a ele
  rationale: Pronome dativo que, no contexto, retoma Festo como destinatário da apresentação.
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Designação corrente para a liderança sacerdotal de Jerusalém, clara para leitores modernos e distinta do singular “sumo sacerdote”.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: os principais entre os judeus
  rationale: Preserva a ideia de pessoas social ou politicamente proeminentes e acompanha de perto a construção partitiva grega.
- source_word: κατὰ τοῦ Παύλου
  choice: contra Paulo
  rationale: κατά com genitivo tem aqui sentido adversativo e indica que a apresentação era acusatória.
- source_word: παρεκάλουν
  choice: insistiam com
  rationale: O imperfeito sugere apelo contínuo ou reiterado. “Insistiam com” soa natural no contexto político-jurídico e conserva essa força aspectual.
- source_word: αὐτόν
  choice: ele
  rationale: Pronome acusativo que volta a se referir a Festo, agora como objeto da insistência.
