  - severity: low
    issue: «chefes dos sacerdotes» é terminologicamente menos idiomático
    rationale: Embora inteligível, «principais sacerdotes» é a forma mais estabelecida em português bíblico moderno para o plural οἱ ἀρχιερεῖς.
  - severity: low
    issue: «os principais entre os judeus» soa pouco natural
    rationale: A construção é muito literal e pode sugerir comparação vaga. «Os líderes dos judeus» transmite com clareza o sentido de pessoas proeminentes.
