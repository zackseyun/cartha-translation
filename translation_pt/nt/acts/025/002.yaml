  source_fidelity: A tradução reconhece corretamente o contexto jurídico de ἐνεφάνισαν, o valor adversativo de κατὰ τοῦ Παύλου e o aspecto imperfeito de παρεκάλουν. Contudo, «suas acusações» introduz um plural possessivo que o grego não expressa e torna a formulação mais específica do que o texto. «Expuseram ... o caso contra Paulo» preserva melhor o sentido forense sem pressupor acusações formalmente definidas.
  naturalness: «Chefes dos sacerdotes» é compreensível, mas «principais sacerdotes» é a designação portuguesa mais natural e consolidada para οἱ ἀρχιερεῖς. «Os principais entre os judeus» é pouco idiomático; «os líderes dos judeus» comunica naturalmente a posição social indicada por οἱ πρῶτοι τῶν Ἰουδαίων. «Insistiam com ele» preserva adequadamente a continuidade narrativa e a vírgula final.
  terminology: «Principais sacerdotes» evita confusão com o singular «sumo sacerdote» e é terminologia bíblica portuguesa corrente. «Líderes dos judeus» é uma equivalência clara para os membros proeminentes da população judaica, sem atribuir uma função institucional mais precisa do que a fonte permite.
