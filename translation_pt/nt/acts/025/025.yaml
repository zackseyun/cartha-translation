  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: pt
  text: Mas constatei que ele não havia feito nada que merecesse a morte; e, como ele próprio apelou para o imperador[a], decidi enviá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Augusto”. O título grego Σεβαστός refere-se aqui ao imperador romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: constatei
  rationale: No contexto judicial, expressa a conclusão de Festo após examinar o caso. “Constatei” é natural em português e não exagera o grau de formalidade jurídica.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: nada que merecesse a morte
  rationale: Mantém de modo idiomático a ideia de que nenhum ato praticado justificava a morte, sem explicitar interpretativamente “pena de morte”.
- source_word: αὐτὸν θανάτου πεπραχέναι
  choice: ele não havia feito nada que merecesse a morte
  rationale: Converte naturalmente a construção grega de acusativo com infinitivo em uma oração subordinada portuguesa, preservando o sentido perfeito de πεπραχέναι.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: como ele próprio apelou
  rationale: A oração absoluta indica a circunstância causal da decisão de Festo; “ele próprio” preserva a ênfase de αὐτοῦ ... τούτου.
- source_word: τὸν Σεβαστόν
  choice: o imperador
  rationale: Σεβαστός é o título grego equivalente ao latino Augustus e, aqui, designa o imperador romano. “Imperador” comunica claramente o referente ao leitor moderno.
- source_word: ἔκρινα πέμπειν
  choice: decidi enviá-lo
  rationale: Expressa a decisão oficial de Festo em português atual; o objeto pronominal, implícito no infinitivo grego, é recuperado pelo contexto.
