  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: pt
  text: Festo, então, respondeu que Paulo estava sendo mantido em Cesareia e que ele mesmo partiria em breve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: estava sendo mantido
  rationale: Preserva a forma passiva do infinitivo presente e comunica que Paulo permanecia sob custódia.
- source_word: εἰς Καισάρειαν
  choice: em Cesareia
  rationale: Embora εἰς normalmente indique movimento para um lugar, aqui, com τηρεῖσθαι, tem sentido locativo; a variante é assinalada na edição, mas não exige nota na tradução.
- source_word: μέλλειν ἐν τάχει ἐκπορεύεσθαι
  choice: partiria em breve
  rationale: Expressa de modo natural em português a intenção iminente de Festo de sair e dirigir-se a Cesareia, sem acrescentar um destino que o versículo deixa implícito.
