  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: pt
  text: Portanto, quando eles se reuniram aqui, não fiz demora alguma; no dia seguinte, sentei-me no tribunal[a] e ordenei que o homem fosse trazido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomei assento na cadeira de juiz”. O termo grego βῆμα designa o assento judicial oficial ou o estrado do tribunal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: quando eles se reuniram
  rationale: O particípio aoristo em genitivo forma uma construção absoluta de valor temporal. O sujeito implícito são as partes que vieram apresentar o caso; “eles” preserva essa referência sem acrescentar uma identificação não expressa no versículo.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a conexão inferencial e continuativa no discurso de Festo em registro natural e digno.
- source_word: ἐνθάδε
  choice: aqui
  rationale: Equivalente direto e corrente do advérbio de lugar.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: não fiz demora alguma
  rationale: Reproduz a expressão idiomática de não adiar o procedimento, preservando sua ênfase negativa e seu tom administrativo.
- source_word: τῇ ἑξῆς
  choice: no dia seguinte
  rationale: Expressa naturalmente o valor temporal da construção dativa.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: sentei-me no tribunal
  rationale: Comunica que Festo tomou seu lugar oficial para julgar. A nota registra a referência mais concreta de βῆμα ao assento ou estrado judicial.
- source_word: ἐκέλευσα
  choice: ordenei
  rationale: Reflete uma determinação oficial, apropriada ao contexto judicial.
- source_word: ἀχθῆναι
  choice: que fosse trazido
  rationale: Preserva a voz passiva do infinitivo de ἄγω e evita acrescentar uma ideia equivalente a “para dentro”, ausente do grego.
- source_word: τὸν ἄνδρα
  choice: o homem
  rationale: É a equivalência lexical direta e não acrescenta “acusado”, embora essa condição esteja clara no contexto.
