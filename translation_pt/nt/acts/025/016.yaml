base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: pt
  text: 'A eles respondi que não é costume dos romanos entregar pessoa alguma como favor[a] antes que o acusado tenha seus acusadores diante de si e receba a oportunidade de se defender da acusação.


    [a] Ou: “conceder pessoa alguma como favor”. O verbo grego pode ter o sentido de entregar alguém para atender ao pedido de um acusador.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conceder pessoa alguma como favor”. O verbo grego pode ter o sentido de entregar alguém para atender ao pedido de um acusador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: costume
  rationale: Denota um costume ou uma prática estabelecida; “costume” é natural e adequado ao contexto jurídico-administrativo.
- source_word: Ῥωμαίοις
  choice: dos romanos
  rationale: O dativo plural refere-se aos romanos como povo e corpo jurídico; a formulação expressa naturalmente a prática jurídica romana.
- source_word: χαρίζεσθαί
  choice: entregar ... como favor
  rationale: No contexto, o verbo indica conceder ou entregar alguém para atender ao pedido de outra parte. A expressão conserva tanto o resultado jurídico quanto a nuance de favor presente no verbo.
- source_word: τινα ἄνθρωπον
  choice: pessoa alguma
  rationale: A expressão é singular e genericamente humana no contexto jurídico. “Pessoa alguma” é idiomático em português após a negação e não restringe indevidamente o referente a um homem.
- source_word: ὁ κατηγορούμενος
  choice: o acusado
  rationale: O particípio substantivado designa a pessoa contra quem se apresentou acusação; “o acusado” é conciso e próprio do registro jurídico.
- source_word: κατὰ πρόσωπον
  choice: diante de si
  rationale: O idioma comunica confronto presencial e direto. “Diante de si” é natural no cenário de uma audiência e evita sugerir conversa privada.
- source_word: τόπον ... ἀπολογίας
  choice: a oportunidade de se defender
  rationale: τόπος tem aqui o sentido figurado de oportunidade, e ἀπολογία é a defesa em resposta formal a uma acusação.
- source_word: ἐγκλήματος
  choice: da acusação
  rationale: Designa a imputação ou acusação jurídica; “acusação” é clara, atual e suficientemente formal.
