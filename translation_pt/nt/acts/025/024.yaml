  naturalness: «Apresentou petições a mim» é compreensível, mas pouco idiomático no português moderno. «Me fez pedidos» comunica naturalmente o ato de recorrer formalmente a uma autoridade, sem reduzir a força do contexto jurídico. «Vocês veem» é mais fluente que «vocês estão vendo» nesta fala pública.
  terminology: «Festo», «Rei Agripa», «os judeus», «multidão», «Jerusalém» e «viver» são apropriados. «Multidão» conserva o substantivo coletivo grego e não restringe indevidamente a referência a líderes judeus.
