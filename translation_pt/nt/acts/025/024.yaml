  to: 'E Festo diz: “Rei Agripa e todos os homens presentes conosco, vocês veem este homem, a respeito de quem toda a multidão dos judeus[a] me fez pedidos, tanto em Jerusalém como aqui, gritando que ele não devia mais viver[b].”'
