  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: pt
  text: 'E Festo diz: “Rei Agripa e todos os homens presentes conosco, vocês veem este homem, a respeito de quem toda a multidão dos judeus[a] me fez pedidos, tanto em Jerusalém como aqui, gritando que ele não devia mais viver[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o conjunto dos judeus”. O grego emprega uma expressão coletiva e registra o resumo que Festo faz da oposição, sem necessariamente incluir cada judeu individualmente.
    reason: Alternativa lexical e esclarecimento do alcance coletivo.
  - marker: b
    text: Ou “que ele não vivesse mais”.
    reason: Alternativa lexical para a construção infinitiva grega.
lexical_decisions:
- source_word: φησιν
  choice: diz
  rationale: Mantém o presente histórico do grego e a vivacidade característica da narrativa, de modo aceitável em português.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: homens presentes aqui conosco
  rationale: Conserva a referência masculina de ἄνδρες e expressa naturalmente a presença conjunta indicada pelo particípio.
- source_word: θεωρεῖτε
  choice: vocês estão vendo
  rationale: Reproduz o indicativo presente pelo qual Festo chama a atenção da assembleia para Paulo, sem recorrer ao arcaico “vede”.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: toda a multidão dos judeus
  rationale: Preserva o substantivo coletivo πλῆθος e a formulação retórica de Festo, sem substituir “os judeus” por um grupo mais restrito que o grego não especifica.
- source_word: ἐνέτυχόν μοι
  choice: apresentou petições a mim
  rationale: Expressa o ato de dirigir pedidos formais a uma autoridade e se ajusta ao contexto jurídico; o singular concorda naturalmente em português com o coletivo “multidão”.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: tanto em Jerusalém como aqui
  rationale: Representa claramente a construção correlativa e mantém “aqui” como referência ao local presente, Cesareia.
- source_word: βοῶντες
  choice: gritando
  rationale: Conserva a força audível e insistente do particípio grego em linguagem atual.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: que ele não devia continuar vivo
  rationale: Preserva a ideia de necessidade ou dever alegada pelos acusadores e evita transformar a frase em uma fórmula jurídica mais explícita do que o original.
theological_decisions:
- issue: Referência aos judeus em um contexto jurídico hostil
  choice: Manter “os judeus” e traduzir πλῆθος por um termo coletivo, “multidão”
  alternative: Restringir a referência a “os líderes judeus” ou entender a expressão como cada judeu sem exceção
  rationale: O texto grego nomeia explicitamente “os judeus” e não autoriza restringir a referência aos líderes. Ao mesmo tempo, πλῆθος é coletivo, e a frase é o resumo retórico de Festo, não necessariamente uma afirmação sobre cada indivíduo judeu.
- issue: Força de δεῖν na exigência contra Paulo
  choice: “não devia continuar vivo”
  alternative: “não podia continuar vivo” ou “tinha de morrer”
  rationale: “Devia” mantém a noção de necessidade ou conveniência alegada, sem resolver a expressão como incapacidade nem ampliá-la para uma fórmula explícita de execução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico “diz” preserva a vivacidade narrativa; “vocês estão vendo” evita tanto o arcaísmo de “vede” quanto uma paráfrase imperativa. A formulação conserva o caráter formal da audiência sem soar burocrática em excesso.
