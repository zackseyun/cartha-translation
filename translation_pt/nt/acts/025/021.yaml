- from: Mas, como Paulo apelou para permanecer sob custódia até a decisão do Augusto[a], ordenei que ele fosse mantido sob custódia até que eu o envie a César.
  to: Mas, quando Paulo apelou para que fosse mantido sob custódia para a decisão do Imperador[a], ordenei que ele fosse mantido sob custódia até que eu o enviasse a César.
  rationale: A revisão substitui a relação temporal indevida por «para a decisão», que reproduz a finalidade jurídica de εἰς τὴν ... διάγνωσιν. Também emprega «Imperador» como equivalente idiomático de Σεβαστός no contexto romano e conserva em nota a tradução literal e a explicação histórica do título.
