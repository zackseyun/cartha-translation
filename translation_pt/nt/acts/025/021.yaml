  verdict: revise
  source_fidelity: 'A formulação «até a decisão» altera a relação expressa por εἰς: Paulo apelou para ser mantido sob custódia com vista à decisão/julgamento imperial, não meramente até que essa decisão ocorresse. «Para a decisão» preserva a finalidade jurídica. «Imperador» traduz naturalmente o título Σεβαστός neste contexto; a nota mantém o título grego-literário subjacente.'
  naturalness: A revisão mantém um português moderno e jurídico sem ser excessivamente técnico. «Para que fosse mantido sob custódia» torna explícita, em português, a construção do apelo formal. «Até que eu o enviasse» concorda de modo natural com a narração no passado.
  terminology: «Apelou», «sob custódia», «decisão», «Imperador» e «César» são apropriados ao contexto processual romano. A nota explica que Σεβαστός corresponde ao título imperial Augustus, sem tratar «Augusto» como nome pessoal.
