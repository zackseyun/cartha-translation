source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: pt
  text: Mas, quando Paulo apelou para que fosse mantido sob custódia para a decisão do Imperador[a], ordenei que ele fosse mantido sob custódia até que eu o enviasse a César.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «do Augusto». O grego traz Σεβαστός, título imperial equivalente ao latim Augustus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: apelou
  rationale: No contexto jurídico romano, o particípio médio indica a apresentação de um recurso formal; «apelou» é natural e preciso em português.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: permanecer sob custódia / fosse mantido sob custódia
  rationale: Neste contexto, τηρέω se refere à detenção oficial. As duas formulações preservam o sentido custodial sem repetição excessivamente mecânica.
- source_word: διάγνωσιν
  choice: decisão
  rationale: O substantivo indica uma determinação judicial; «decisão» mantém amplitude suficiente sem sugerir necessariamente condenação nem reduzir o sentido a uma audiência.
- source_word: Σεβαστοῦ
  choice: do Augusto
  rationale: Σεβαστός é aqui o título imperial grego equivalente ao latino Augustus. «Augusto» preserva o título histórico, esclarecido em nota.
- source_word: ἀναπέμψω
  choice: envie
  rationale: No contexto, refere-se a remeter Paulo à autoridade imperial superior; «envie» comunica isso com clareza e naturalidade.
- source_word: πρὸς Καίσαρα
  choice: a César
  rationale: Καίσαρ funciona como título imperial. «César» conserva a formulação histórica e é facilmente compreensível no contexto de Atos.
