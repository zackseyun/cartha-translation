  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: pt
  text: A respeito dele, não tenho nada de preciso para escrever ao meu senhor.[a] Por isso, eu o trouxe à presença de todos vocês e, especialmente, à sua presença, rei Agripa, para que, depois de realizada a investigação,[b] eu tenha algo para escrever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, «ao imperador». O grego diz «ao meu senhor», empregando κύριος como título no contexto imperial.
    reason: alternative_reading
  - marker: b
    text: «Investigação» também pode ser traduzida por «interrogatório», «audiência» ou «exame»; refere-se à apuração judicial do caso de Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: nada de concreto
  rationale: A expressão indica algo seguro, certo ou definido. No contexto administrativo e jurídico, «nada de concreto» comunica naturalmente que Festo não dispõe de uma acusação sólida para registrar.
- source_word: τῷ κυρίῳ
  choice: ao meu senhor
  rationale: Preserva o sentido lexical de κύριος e o caráter formal do título; neste contexto, o referente é o imperador romano, esclarecido em nota.
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo claro e natural a consequência lógica introduzida por διό.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: eu o trouxe à presença de todos vocês
  rationale: Representa o ato de apresentar Paulo diante do grupo e explicita o plural ὑμῶν, distinguindo-o do singular dirigido em seguida a Agripa.
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: e, especialmente, à sua presença
  rationale: Mantém a ênfase particular em Agripa e preserva o contraste entre o grupo e o destinatário singular.
- source_word: βασιλεῦ Ἀγρίππα
  choice: rei Agripa
  rationale: Tradução direta do vocativo, com a forma portuguesa tradicional do nome.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: depois de realizada a investigação
  rationale: Traduz naturalmente o genitivo absoluto em sentido temporal. ἀνάκρισις designa investigação, exame ou audiência de caráter judicial.
- source_word: σχῶ τί γράψω
  choice: eu tenha algo para escrever
  rationale: 'Reproduz de forma idiomática a finalidade: obter matéria concreta para o relatório escrito.'
theological_decisions:
- issue: Sentido de κύριος em contexto imperial não teológico
  choice: meu senhor
  alternative: o imperador
  rationale: Embora o referente seja o imperador, a tradução principal preserva o título κύριος sem substituir sua forma lexical pela identificação do referente; a nota fornece a explicitação histórica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção «todos vocês» preserva o plural antes da referência singular e enfática a Agripa; «à sua presença» evita a ambiguidade regional de «diante de você» sem recorrer a formas excessivamente solenes.
