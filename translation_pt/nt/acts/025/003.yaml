    rationale: Em português, «buscar alguém para Jerusalém» pode ser lido como buscar a pessoa que está em Jerusalém. «Mandasse trazê-lo para Jerusalém» deixa inequívoco que Jerusalém é o destino do traslado.
  - severity: low
