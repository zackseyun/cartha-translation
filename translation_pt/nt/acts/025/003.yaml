  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: pt
  text: 'pedindo-lhe um favor contra ele: que mandasse trazê-lo para Jerusalém[a], enquanto preparavam uma emboscada para matá-lo no caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que mandasse buscá-lo para Jerusalém”. O verbo grego pode significar “mandar buscar” ou “mandar trazer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι
  choice: pedindo-lhe
  rationale: O particípio presente indica uma ação simultânea à ação principal; o pronome dativo explicita naturalmente em português a pessoa a quem o pedido foi dirigido, identificada pelo contexto anterior.
- source_word: χάριν κατ’ αὐτοῦ
  choice: como favor contra ele
  rationale: Preserva tanto o sentido idiomático de pedir um favor ou concessão quanto a força adversativa de κατ’ αὐτοῦ, sem substituir o pronome grego por um nome próprio.
- source_word: ὅπως μεταπέμψηται αὐτὸν
  choice: que mandasse buscá-lo
  rationale: 'Expressa de modo natural o conteúdo e propósito do pedido e o valor causativo contextual do verbo médio μεταπέμπομαι: providenciar que ele fosse trazido.'
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: A preposição εἰς indica o destino do traslado.
- source_word: ἐνέδραν ποιοῦντες
  choice: enquanto preparavam uma emboscada
  rationale: A oração com “enquanto” comunica a ação circunstancial e simultânea do particípio, em português corrente.
- source_word: ἀνελεῖν αὐτόν
  choice: para matá-lo
  rationale: Neste contexto, ἀναιρέω denota matar; a formulação é direta e não acrescenta uma qualificação moral ausente do termo.
- source_word: κατὰ τὴν ὁδόν
  choice: no caminho
  rationale: Equivalente idiomático moderno para a referência ao trajeto onde ocorreria a emboscada.
