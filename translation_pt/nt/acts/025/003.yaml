  source_fidelity: A tradução mantém adequadamente a estrutura participial, o caráter hostil de κατ’ αὐτοῦ, o pedido de transferência para Jerusalém, a emboscada e seu propósito homicida. Contudo, «mandasse buscá-lo para Jerusalém» pode sugerir que o local de busca seja Jerusalém, em vez de indicar com clareza que Paulo seria levado para lá.
  naturalness: «Pedindo-lhe, como favor contra ele» é compreensível, mas a ordem é pouco idiomática e torna a relação entre «favor» e «contra ele» menos fluente. «Pedindo-lhe um favor contra ele» é mais direto em português moderno.
  terminology: «Mandasse trazê-lo para Jerusalém» representa com clareza o sentido contextual causativo de μεταπέμψηται, sem eliminar a alternativa lexical legítima «mandar buscar». A nota deve apresentar essa alternativa sem trocar o significado principal por «convocar», que é possível, mas menos próximo do contraste relevante nesta passagem.
