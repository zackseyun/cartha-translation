    rationale: A intercalação de «como» e a posição de «contra ele» enfraquecem a fluência. Reordenar a expressão preserva o valor adversativo do grego.
  - severity: low
    issue: A nota lexical não explicita adequadamente a alternativa «mandar trazer».
    rationale: A alternativa relevante para μεταπέμπομαι, no contexto, é entre mandar buscar/enviar buscar e providenciar que seja trazido; «convocar» é aceitável, mas menos informativa para a escolha adotada.
  revised_text: 'pedindo-lhe um favor contra ele: que mandasse trazê-lo para Jerusalém[a], enquanto preparavam uma emboscada para matá-lo no caminho.'
