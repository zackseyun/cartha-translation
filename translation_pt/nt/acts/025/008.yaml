  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: pt
  text: 'Paulo apresentou sua defesa: “Não pequei em nada[a] contra a Lei dos judeus, nem contra o templo, nem contra César.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não cometi nenhuma infração contra a Lei dos judeus, nem contra o templo, nem contra César.”'
    reason: Alternativa lexical que explicita o sentido jurídico contextual de ἥμαρτον.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: apresentou sua defesa
  rationale: Expressa com naturalidade o sentido forense de ἀπολογέομαι e enquadra a declaração de Paulo como defesa formal, sem acrescentar a ideia específica de que ele respondeu a uma pergunta.
- source_word: ὅτι
  choice: introdução da fala direta por dois-pontos
  rationale: ὅτι introduz o conteúdo da defesa; em português atual, os dois-pontos e as aspas comunicam naturalmente essa função.
- source_word: νόμον τῶν Ἰουδαίων
  choice: a Lei dos judeus
  rationale: Preserva a construção e o referente religioso-jurídico do grego. A inicial maiúscula em “Lei” ajuda a indicar o corpo normativo judaico, sem especificá-lo além do texto.
- source_word: ἱερόν
  choice: o templo
  rationale: Neste contexto, ἱερόν designa o complexo do templo, e “templo” é a forma corrente e clara em português.
- source_word: Καίσαρά
  choice: César
  rationale: Mantém o título/nome empregado no grego e preserva o contexto político e jurídico romano.
- source_word: τι
  choice: em nada
  rationale: Com a negação e ἥμαρτον, reforça o caráter abrangente da declaração de inocência de Paulo.
- source_word: ἥμαρτον
  choice: não pequei
  rationale: Conserva a ligação lexical com o verbo comum para “pecar”, embora o contexto forense também permita entender “cometer uma infração”.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: nem ... nem ... nem
  rationale: Reproduz de forma idiomática em português a tríplice negação enfática do grego.
theological_decisions:
- issue: Nuance jurídica ou moral de ἥμαρτον
  choice: Não pequei em nada
  alternative: Não cometi nenhuma infração
  rationale: O contexto é judicial, mas o verbo é ἁμαρτάνω. A tradução principal preserva sua dimensão moral e lexical, enquanto a nota registra a leitura jurídica legítima sem reduzir o sentido do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o tom de uma defesa judicial e a repetição enfática da negação, sem perder a nuance moral do verbo grego.
