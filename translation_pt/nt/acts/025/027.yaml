  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: pt
  text: Pois não me parece razoável enviar um prisioneiro sem indicar também as acusações contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “especificar as acusações contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: descabido
  rationale: No contexto administrativo, descreve algo sem razão ou sentido apropriado. “Descabido” soa natural em português e expressa o juízo de Festo sem a conotação filosófica de “irracional” nem a força excessiva de “absurdo”.
- source_word: δοκεῖ μοι
  choice: me parece
  rationale: Preserva tanto a construção impessoal quanto o caráter pessoal e avaliativo da expressão grega.
- source_word: πέμποντα
  choice: enviar
  rationale: O particípio circunstancial é vertido de modo natural pela construção infinitiva ligada a “descabido”, sem alterar sua relação com a ação principal.
- source_word: δέσμιον
  choice: um prisioneiro
  rationale: É o equivalente claro e corrente para uma pessoa mantida sob custódia neste contexto jurídico.
- source_word: μὴ καὶ
  choice: sem também
  rationale: Expressa naturalmente em português a impropriedade de enviar o prisioneiro sem a ação adicional, preservando a força aditiva de καί.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: as acusações contra ele
  rationale: Em contexto judicial, αἰτία designa acusações ou imputações. “Acusações” é claro, corrente e adequado ao procedimento descrito.
- source_word: σημᾶναι
  choice: indicar
  rationale: Reproduz o sentido de tornar conhecido ou assinalar em um contexto administrativo, sem acrescentar o grau de precisão sugerido por “especificar”.
