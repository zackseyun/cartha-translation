source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: pt
  text: 'Então Festo, depois de consultar o conselho, respondeu: “Você apelou para César; para César irá[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perante César irá”. A expressão pode ter o sentido jurídico de comparecer diante do tribunal do imperador depois de apresentar uma apelação.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal e sequencial natural na narrativa, correspondente ao sentido do grego.
- source_word: συλλαλήσας
  choice: depois de consultar
  rationale: O particípio aoristo indica ação anterior à resposta; “consultar” comunica uma conversa deliberativa no contexto jurídico-administrativo.
- source_word: μετὰ τοῦ συμβουλίου
  choice: o conselho
  rationale: Refere-se a um corpo consultivo ou deliberativo. Não se acrescenta “seu”, pois o possessivo não está explícito no grego.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo comum que preserva o tom formal da cena judicial.
- source_word: Καίσαρα
  choice: César
  rationale: Mantém o título/nome romano e o contexto jurídico da apelação ao imperador.
- source_word: ἐπικέκλησαι
  choice: apelou para
  rationale: 'O perfeito médio tem aqui sentido jurídico: invocar a jurisdição de César por meio de apelação. O perfeito é expresso naturalmente em português pelo pretérito perfeito.'
- source_word: ἐπὶ Καίσαρα
  choice: para César
  rationale: Com o verbo de movimento, expressa o destino ligado à autoridade a quem Paulo apelou, sem excluir a nuance de comparecer perante seu tribunal.
- source_word: πορεύσῃ
  choice: irá
  rationale: Futuro de movimento traduzido de modo direto; evita acrescentar a ideia passiva de ser enviado, não explícita no verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem enfática “para César irá” preserva a repetição de Καίσαρα e a força sentenciosa da resposta de Festo.
