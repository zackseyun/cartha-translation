  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: pt
  text: A respeito dele, quando cheguei a Jerusalém, os principais sacerdotes e os anciãos dos judeus informaram-me, pedindo uma condenação contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedindo que ele fosse condenado”; ou: “pedindo um veredito de culpa contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: A respeito dele
  rationale: Retoma Paulo e introduz explicitamente o assunto, preservando a estrutura do grego em português natural.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: quando cheguei a Jerusalém
  rationale: O genitivo absoluto com γίνομαι e destino indica temporalmente a chegada a um lugar.
- source_word: ἐνεφάνισαν
  choice: apresentaram acusações diante de mim
  rationale: No contexto jurídico-administrativo, o verbo descreve a apresentação formal do caso a Festo; o complemento implícito é tornado claro sem eliminar a natureza acusatória do relato.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: Designa as autoridades sacerdotais dirigentes, e não vários sumos sacerdotes em exercício.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: os anciãos dos judeus
  rationale: Mantém o genitivo identificador do grupo e a designação tradicional de seus dirigentes.
- source_word: αἰτούμενοι
  choice: pedindo
  rationale: Expressa a solicitação que acompanhava a apresentação do caso.
- source_word: κατ’ αὐτοῦ
  choice: que ele fosse
  rationale: A direção hostil contra Paulo é expressa naturalmente em português pela oração subordinada ligada à condenação.
- source_word: καταδίκην
  choice: condenado
  rationale: Comunica o sentido de condenação judicial em linguagem corrente; a nota registra alternativas nominais que refletem a forma do grego.
