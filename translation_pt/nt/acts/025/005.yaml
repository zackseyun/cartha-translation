base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: pt
  text: Portanto, que os homens de destaque entre vocês desçam comigo e, se houver algo de errado nesse homem, que o acusem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que entre vocês têm autoridade”, “os que têm influência entre vocês” ou “os que entre vocês são capazes”. A palavra grega pode indicar pessoas capazes, poderosas ou proeminentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que apresentem acusação contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Portanto, que os...
  rationale: οὖν indica continuação ou conclusão; “portanto” mantém essa ligação, enquanto o artigo substantiva o adjetivo seguinte.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: os que entre vocês têm condições
  rationale: δυνατοί pode indicar pessoas capazes, poderosas ou investidas de autoridade. “Têm condições” preserva o sentido básico de capacidade sem decidir indevidamente que se trata apenas dos homens mais influentes.
- source_word: φησίν
  choice: não expresso separadamente
  rationale: É uma observação parentética do narrador, “diz ele”, inserida no discurso. Em português, sua expressão aqui tornaria a frase artificial, e sua função já é comunicada pelo enquadramento narrativo.
- source_word: συγκαταβάντες
  choice: desçam comigo
  rationale: O particípio comunica o deslocamento conjunto para Cesareia; “comigo” representa o elemento σύν, e “desçam” conserva a linguagem geográfica convencional.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: se há algo de errado nesse homem
  rationale: A formulação mantém a condição e a amplitude de ἄτοπον, que significa algo impróprio ou errado, sem intensificá-lo para “crime”.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: que apresentem acusação contra ele
  rationale: O imperativo de terceira pessoa é expresso por “que apresentem”; a formulação torna claro o sentido jurídico de κατηγορέω neste contexto.
