source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: pt
  text: Quando ele chegou, os judeus[a] que tinham descido de Jerusalém ficaram em pé ao redor dele[b], apresentando muitas acusações graves, que não conseguiam provar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os judeus da Judeia”. O termo grego pode ter sentido religioso-étnico ou geográfico; aqui se refere aos acusadores judeus vindos de Jerusalém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o cercaram”. O verbo grego descreve pessoas que ficam em pé ao redor de alguém; no cenário judicial, essa postura também pode sugerir pressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Quando ele chegou
  rationale: A construção de genitivo absoluto indica uma circunstância temporal. “Quando ele chegou” expressa com naturalidade a sequência da narrativa sem tornar explícito um referente além do pronome presente no grego.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: os judeus que tinham descido de Jerusalém
  rationale: Ἰουδαῖοι pode designar “judeus” ou “judeus da Judeia”. Neste contexto, trata-se dos acusadores judeus vindos de Jerusalém; “judeus” é claro e idiomático, enquanto a procedência geográfica já é indicada pela frase seguinte. “Tinham descido” preserva tanto o particípio perfeito quanto o modo tradicional de descrever a viagem desde Jerusalém.
- source_word: περιέστησαν αὐτὸν
  choice: ficaram em pé ao redor dele
  rationale: A expressão preserva a imagem concreta de pessoas postadas ao redor de alguém e evita intensificar automaticamente a ação como um cerco hostil, embora essa nuance seja possível no contexto judicial.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: muitas acusações graves
  rationale: αἰτιώματα indica acusações ou imputações formais, e βαρέα comunica sua gravidade. A formulação é natural em português e adequada ao cenário judicial.
- source_word: καταφέροντες
  choice: apresentando
  rationale: No contexto jurídico, o particípio descreve o ato de formular ou apresentar acusações. “Apresentando” liga-se naturalmente a “acusações” em português.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: que não conseguiam provar
  rationale: ἰσχύω com infinitivo expressa capacidade, e ἀποδείκνυμι significa demonstrar ou provar. O imperfeito é bem refletido por “não conseguiam”, que sugere incapacidade persistente durante o processo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário jurídico acessível. A redação mantém a imagem física da cena e conserva a possível ambiguidade entre simplesmente ficar ao redor e cercar de modo intimidatório.
