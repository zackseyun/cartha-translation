  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: pt
  text: 'Mas Paulo disse: “Estou perante o tribunal de César[a], onde devo ser julgado. Não cometi nenhuma injustiça contra os judeus[b], como você mesmo sabe muito bem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assento judicial de César”. O termo grego βῆμα designa o assento oficial de julgamento e, por extensão, o tribunal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não fiz mal algum aos judeus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: tribunal
  rationale: No contexto, refere-se à instância judicial oficial da autoridade romana. “Tribunal” comunica tanto o foro quanto a autoridade de julgamento em português atual.
- source_word: Καίσαρος
  choice: de César
  rationale: Preserva o título imperial e o contexto histórico-jurídico romano, sem substituí-lo interpretativamente por “imperador”.
- source_word: ἑστώς εἰμι
  choice: Estou diante
  rationale: A construção perifrástica ressalta a posição legal presente de Paulo. Em português, “estou diante do tribunal” é natural e mantém essa ideia, sem sugerir necessariamente apenas a postura física.
- source_word: οὗ με δεῖ κρίνεσθαι
  choice: onde devo ser julgado
  rationale: Expressa de modo claro a necessidade e a jurisdição apropriada que Paulo reivindica, mantendo a voz passiva de κρίνεσθαι.
- source_word: Ἰουδαίους
  choice: aos judeus
  rationale: É a correspondência direta e contextualmente adequada; aqui designa aqueles contra quem Paulo é acusado de ter agido injustamente, sem restringir o termo apenas a autoridades ou habitantes da Judeia.
- source_word: οὐδὲν ἠδίκησα
  choice: Não fiz mal algum
  rationale: Reproduz a negação enfática e abrange tanto a ideia moral de injustiça quanto a jurídica de ofensa.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: como você mesmo sabe muito bem
  rationale: “Você mesmo” expressa a ênfase de καὶ σὺ, enquanto “sabe muito bem” transmite idiomaticamente a força de κάλλιον com ἐπιγινώσκεις.
theological_decisions: []
