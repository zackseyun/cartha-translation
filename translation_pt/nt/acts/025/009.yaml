id: ACT.25.9
reference: Acts 25:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: pt
  text: 'Mas Festo, querendo fazer um favor aos judeus[a], respondeu a Paulo: “Você quer subir a Jerusalém e ali ser julgado diante de mim a respeito destas coisas?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “os judeus” se refere aos acusadores ou líderes judeus que promoviam o processo contra Paulo, não a todos os judeus sem distinção.
    reason: cultural_note
  - marker: b
    text: “Ser julgado diante de mim” também pode ser traduzido como “ser submetido a julgamento diante de mim” ou “ter seu caso ouvido por mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: querendo
  rationale: Preserva o particípio presente que expressa a motivação de Festo e soa natural em português atual.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: Reproduz o termo amplo do grego; o contexto limita a referência aos acusadores ou líderes judeus envolvidos no processo.
- source_word: χάριν καταθέσθαι
  choice: fazer um favor
  rationale: Expressa de modo idiomático a ideia de conceder um favor ou obter boa vontade, sem atribuir a Festo uma intenção manipuladora mais forte do que o grego indica.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: respondeu a Paulo
  rationale: Condensa naturalmente a fórmula narrativa grega, na qual o particípio e o verbo de fala introduzem a pergunta.
- source_word: Θέλεις
  choice: Você quer
  rationale: Formula de modo direto e corrente a pergunta sobre a disposição de Paulo, sem reduzi-la à mera anuência.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: subir a Jerusalém
  rationale: Mantém o uso tradicional e geográfico de ‘subir’ em referência a Jerusalém.
- source_word: περὶ τούτων
  choice: a respeito destas coisas
  rationale: Conserva a referência ampla do grego, sem explicitar ‘acusações’, embora elas estejam implícitas no contexto.
- source_word: κριθῆναι
  choice: ser julgado
  rationale: Mantém a amplitude judicial de κρίνω; no contexto, também pode significar ser submetido a julgamento ou ter o caso ouvido.
- source_word: ἐπ’ ἐμοῦ
  choice: diante de mim
  rationale: Indica a presença ou autoridade de Festo na condução do processo sem afirmar que ele seria necessariamente o único julgador.
theological_decisions:
- issue: Possível leitura antijudaica de ‘aos judeus’
  choice: Manter ‘aos judeus’ no texto e esclarecer contextualmente em nota.
  alternative: Traduzir ‘aos líderes judeus’ ou ‘aos acusadores judeus’.
  rationale: O grego emprega o termo amplo, mas neste episódio ele designa contextualmente os acusadores ou líderes que promoviam o processo contra Paulo, não todos os judeus sem distinção.
- issue: Grau de autoridade expresso por ἐπ’ ἐμοῦ
  choice: diante de mim
  alternative: por mim; sob minha autoridade
  rationale: A formulação preserva a possível tensão entre Festo julgar pessoalmente e presidir oficialmente a audiência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, evitando a redundância pouco idiomática de ‘respondendo, disse’. O tratamento ‘você’ torna a pergunta direta e corrente sem perda de respeito no contexto.
