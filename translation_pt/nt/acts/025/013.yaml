  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: pt
  text: Depois de alguns dias, o rei Agripa e Berenice chegaram a Cesareia para saudar Festo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Depois de alguns dias
  rationale: O genitivo absoluto estabelece o pano de fundo temporal. Em português natural, a formulação concisa comunica que alguns dias haviam transcorrido; δέ tem força conectiva leve e não exige um marcador explícito.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: o rei Agripa
  rationale: A ordem título-nome é idiomática em português e preserva βασιλεύς como título real.
- source_word: Βερνίκη
  choice: Berenice
  rationale: Forma tradicional e amplamente reconhecível em português para o nome grego Βερνίκη.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: chegaram a Cesareia
  rationale: O verbo indica chegar a um destino; a preposição a expressa naturalmente o movimento em português.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: para saudar Festo
  rationale: O particípio aoristo expressa aqui finalidade ou circunstância associada à chegada. “Saudar” mantém o sentido sem acrescentar uma formalidade cortesã não explícita.
- source_word: Φῆστον
  choice: Festo
  rationale: Forma portuguesa tradicional do nome do governador romano.
