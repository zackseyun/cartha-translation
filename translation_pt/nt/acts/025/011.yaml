  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: pt
  text: Se, então, pratico injustiça e tenho cometido algo que merece a morte, não me recuso a morrer. Mas, se não há fundamento nas acusações que estes homens fazem contra mim, ninguém pode me entregar a eles como um favor.[a] Apelo a César.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém pode me entregar a eles para agradá-los”. O verbo grego traz a ideia de conceder ou entregar alguém como favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: estou cometendo alguma injustiça
  rationale: O presente grego sugere uma condição ou conduta atual. A formulação preserva a força moral e jurídica sem especificar um delito além do texto.
- source_word: ἄξιον θανάτου
  choice: que merece a morte
  rationale: Expressa de modo natural a avaliação de que o ato seria passível da pena de morte, sem reduzir a frase a terminologia jurídica moderna.
- source_word: πέπραχά τι
  choice: fiz algo
  rationale: O perfeito aponta para um ato consumado com relevância presente; o indefinido 'algo' corresponde a τι.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: não me recuso a morrer
  rationale: Traduz diretamente a ideia de não rejeitar ou evitar a morte, preservando a aceitação condicional de Paulo.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: não há fundamento nas acusações que estes homens fazem contra mim
  rationale: Comunica que as acusações carecem de substância, sem acrescentar uma conclusão mais categórica do que a construção grega exige.
- source_word: χαρίσασθαι
  choice: me entregar a eles como um favor
  rationale: Preserva tanto o ato judicial de entregar Paulo quanto a nuance de concessão destinada a favorecer ou agradar seus acusadores.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Apelo para César
  rationale: É a forma portuguesa clara e consagrada para o recurso jurídico ao imperador.
- source_word: μὲν οὖν ... δὲ
  choice: Se, de fato, ... Mas, se
  rationale: Mantém os dois ramos contrastantes do argumento condicional e dá expressão natural às partículas discursivas.
theological_decisions:
- issue: Nuance judicial da aceitação da morte e do apelo de Paulo
  choice: Paulo admite, condicionalmente, a morte se tiver cometido um ato que a mereça, mas nega que possa ser entregue aos acusadores quando as acusações não têm fundamento.
  alternative: Entender a fala apenas como recurso retórico, sem qualquer reconhecimento da legitimidade da pena ou do processo.
  rationale: O texto apresenta uma argumentação jurídica condicional. A tradução conserva essa tensão sem transformar o versículo numa afirmação doutrinária geral sobre a pena de morte.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. 'César' preserva o título tradicional e reconhecível; 'como um favor' mantém explícita a nuance política e judicial de χαρίσασθαι.
