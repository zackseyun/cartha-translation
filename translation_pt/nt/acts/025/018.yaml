  text: Quando os acusadores se levantaram para falar a respeito dele, não apresentaram nenhuma acusação sobre os males de que eu suspeitava,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não apresentaram nenhuma acusação sobre os crimes de que eu suspeitava”. O grego diz literalmente “coisas más”, expressão que pode se referir ao mal praticado em sentido mais geral, e não apenas a crimes formalmente definidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: a respeito dele
  rationale: A preposição περί com o genitivo introduz o assunto em questão e remete naturalmente a Paulo.
- source_word: σταθέντες
  choice: quando os acusadores se levantaram para falar
  rationale: O particípio aoristo tem valor temporal no contexto judicial. A expressão explicita de modo natural que eles tomaram a palavra, sem alterar o sentido.
- source_word: οἱ κατήγοροι
  choice: os acusadores
  rationale: Designa aqueles que apresentam acusações num contexto legal; esta é a opção mais direta e amplamente compreensível.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: não apresentaram nenhuma acusação
  rationale: A expressão tem sentido forense de apresentar uma acusação. A formulação conserva o tom jurídico e soa natural em português.
- source_word: ὧν ... πονηρῶν
  choice: pelos males que
  rationale: Mantém a ligação entre a acusação e as coisas más esperadas por Festo, sem restringir o termo grego a crimes formalmente definidos.
- source_word: ἐγὼ ὑπενόουν
  choice: eu suspeitava
  rationale: O imperfeito indica uma suspeita ou expectativa anterior em curso; o imperfeito português preserva essa nuance com naturalidade.
- source_word: πονηρῶν
  choice: males
  rationale: O adjetivo neutro plural pode referir-se genericamente a coisas más ou atos ilícitos. “Males” preserva a amplitude sem especificar indevidamente “crimes”.
