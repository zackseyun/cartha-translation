reference: Acts 25:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: pt
  text: Pelo contrário, eles tinham contra ele algumas controvérsias a respeito de sua própria religião[a] e de certo Jesus que havia morrido, o qual Paulo afirmava estar vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua própria superstição”. O termo grego pode referir-se de modo neutro à religião ou, na fala de alguém de fora, ter sentido mais depreciativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: questões
  rationale: No contexto judicial, indica assuntos controversos ou pontos em disputa. “Questões” soa natural em português e, com “tinham contra ele”, mantém o caráter adversarial sem tornar a expressão mais técnica do que o grego.
- source_word: δέ
  choice: Pelo contrário
  rationale: Marca o contraste corretivo com as acusações criminais que Festo esperava, mas que não foram apresentadas.
- source_word: τινα
  choice: algumas
  rationale: Preserva o caráter indefinido do termo e é mais natural em português corrente do que “certas” neste contexto.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: relacionadas à sua própria religião
  rationale: δεισιδαιμονία pode designar religião de modo relativamente neutro ou superstição com matiz depreciativo. “Religião” evita impor uma censura mais forte do que o contexto exige; a alternativa é registrada em nota.
- source_word: ἰδίας
  choice: sua própria
  rationale: Conserva o distanciamento de Festo, que descreve a religião pertencente aos acusadores, não a si mesmo.
- source_word: εἶχον πρὸς αὐτόν
  choice: tinham contra ele
  rationale: A expressão indica questões ou contendas dirigidas contra Paulo e se encaixa naturalmente no contexto das acusações.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: e a certo Jesus
  rationale: “Certo Jesus” preserva a referência distanciada e aparentemente pouco familiar de Festo.
- source_word: τεθνηκότος
  choice: que havia morrido
  rationale: O particípio perfeito apresenta Jesus como alguém que morreu, formando o contraste com a afirmação de Paulo de que está vivo.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: mas que Paulo afirmava estar vivo
  rationale: “Afirmava” comunica que Festo relata a declaração de Paulo sem endossá-la nem negá-la. O “mas” explicita em português o contraste inerente entre ter morrido e estar vivo.
theological_decisions:
- issue: Tradução de δεισιδαιμονία na fala de Festo
  choice: religião
  alternative: superstição
  rationale: A palavra pode ser neutra ou depreciativa. Como a força exata na fala do oficial romano permanece incerta, o texto usa a opção não pejorativa e registra a alternativa em nota, preservando a ambiguidade.
- issue: Formulação da afirmação sobre Jesus estar vivo
  choice: que Paulo afirmava estar vivo
  alternative: que Paulo dizia estar vivo
  rationale: A frase deve permanecer como relato de Festo sobre a afirmação de Paulo, e não como declaração direta do narrador. “Afirmava” representa adequadamente φάσκω sem julgar aqui a veracidade da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pelo contrário” conserva a ligação contrastiva com o versículo anterior; “certo Jesus” mantém o distanciamento de Festo. A nota retém a ambiguidade semântica de δεισιδαιμονία.
