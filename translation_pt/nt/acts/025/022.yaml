base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: pt
  text: 'Então Agripa disse a Festo: “Eu mesmo[a] gostaria de ouvir o homem.” “Amanhã”, diz ele,[b] “você o ouvirá.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu também gostaria de ouvir o homem.” A expressão grega pode ter sentido aditivo, além de poder enfatizar o sujeito: “eu mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega o presente histórico: “diz ele”. Algumas traduções trazem “disse ele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “você ouvirá o que ele tem a dizer”. A expressão grega indica ouvir a própria pessoa falar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: Então Agripa disse a Festo
  rationale: δέ marca a progressão da narrativa; “então” dá fluidez natural. A construção com πρός é explicitada idiomaticamente pelo verbo “disse”, e os nomes seguem as formas portuguesas consagradas.
- source_word: Ἐβουλόμην καὶ αὐτὸς
  choice: Eu mesmo gostaria
  rationale: “Gostaria” expressa em português natural o desejo formulado com o imperfeito ἐβουλόμην; “eu mesmo” preserva a ênfase possível de καὶ αὐτός, sem eliminar em nota a leitura aditiva.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: de ouvir esse homem
  rationale: ἀκούω com genitivo indica ouvir a pessoa falar. “Esse homem” retoma Paulo de modo natural no diálogo e evita uma formulação excessivamente literal.
- source_word: Αὔριον
  choice: Amanhã
  rationale: Equivalente temporal direto e natural.
- source_word: φησίν
  choice: diz ele
  rationale: Preserva o presente histórico do grego e a vivacidade narrativa, embora “disse ele” seja possível em português.
- source_word: ἀκούσῃ αὐτοῦ
  choice: você o ouvirá
  rationale: Mantém a construção concisa e o sentido de ouvir Paulo falar diretamente; a alternativa “ouvirá o que ele tem a dizer” explicita o idioma.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico foi preservado. A possível força aditiva de καὶ αὐτός também pode ser traduzida por “eu também gostaria”, mas a ênfase reflexiva foi mantida no texto principal.
