  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: pt
  text: Como eu estava em dúvida quanto à investigação dessas questões[a], perguntei se ele queria[b] ir a Jerusalém e ali ser julgado a respeito delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto à controvérsia sobre essas questões”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estava disposto a”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: Como eu estava em dúvida
  rationale: O particípio expressa perplexidade ou incerteza de Festo; a conjunção “como” comunica de modo natural seu valor causal no contexto.
- source_word: ζήτησιν
  choice: investigação
  rationale: No contexto judicial e administrativo, o substantivo designa a averiguação da questão, embora também possa indicar uma controvérsia ou debate.
- source_word: περὶ τούτων
  choice: quanto à investigação dessas questões / a respeito delas
  rationale: As duas ocorrências remetem aos assuntos ou acusações em discussão. A segunda é retomada por pronome para evitar repetição pesada.
- source_word: ἔλεγον
  choice: perguntei
  rationale: Embora o verbo signifique literalmente “eu dizia”, a oração interrogativa indireta introduzida por εἰ mostra que aqui ele relata uma pergunta.
- source_word: εἰ βούλοιτο
  choice: se ele queria
  rationale: Expressa o conteúdo da pergunta de Festo em português corrente, sem excluir a nuance possível de disposição ou consentimento.
- source_word: πορεύεσθαι
  choice: ir
  rationale: É a forma mais natural e suficiente de expressar o deslocamento indicado pelo infinitivo.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: κἀκεῖ
  choice: e ali
  rationale: Preserva a coordenação e a referência enfática ao lugar onde ocorreria o julgamento.
- source_word: κρίνεσθαι
  choice: ser julgado
  rationale: Mantém o sentido judicial amplo do infinitivo passivo sem restringi-lo necessariamente ao ato técnico de ser levado a julgamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o caráter jurídico do relato e a incerteza declarada por Festo, sem transformar o substantivo grego “investigação” em uma construção infinitiva.
