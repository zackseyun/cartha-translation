source:
  edition: SBLGNT
  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: pt
  text: Assim, depois de chegar à província[a], Festo subiu de Cesareia para Jerusalém, três dias mais tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de entrar na província” ou “depois de assumir o governo da província”. O particípio grego pode indicar a chegada de Festo à sua província e, por implicação, o início de sua administração ali.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Marca a progressão narrativa e a ligação com o contexto anterior de modo natural em português.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: depois de chegar à província
  rationale: Preserva o valor temporal do particípio e o sentido básico de entrada ou chegada, sem explicitar como certo que se trate da posse formal do governo.
- source_word: ἐπαρχείᾳ
  choice: província
  rationale: Designa a província administrativa romana e é o equivalente histórico mais direto.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: três dias mais tarde
  rationale: Expressa com clareza a sucessão temporal indicada por μετά com acusativo; evita a possível impressão, em português, de que a viagem necessariamente durou três dias.
- source_word: ἀνέβη
  choice: subiu
  rationale: Conserva a linguagem geográfica convencional de subir a Jerusalém.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: Forma idiomática para indicar o destino.
- source_word: ἀπὸ Καισαρείας
  choice: de Cesareia
  rationale: Traduz diretamente o ponto de partida indicado por ἀπό.
- source_word: Φῆστος
  choice: Festo
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions: []
