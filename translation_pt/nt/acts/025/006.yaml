source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: pt
  text: 'Depois de passar com eles não mais de oito ou dez dias, desceu a Cesareia. No dia seguinte, tomou assento no tribunal[a] e mandou que Paulo fosse trazido.


    [a] Ou “depois de se sentar no tribunal”. O termo grego βῆμα designa a plataforma ou o assento oficial usado em um contexto judicial.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de se sentar no tribunal”. O termo grego βῆμα designa a plataforma ou o assento oficial usado em um contexto judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: Depois de passar
  rationale: O particípio aoristo introduz uma ação anterior. Em português, “passar ... dias” expressa com naturalidade a permanência indicada por διατρίβω.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: Preserva a referência às pessoas anteriormente mencionadas e se ajusta ao contexto social e geográfico.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: não mais de oito ou dez dias
  rationale: Mantém tanto o comparativo negado quanto a formulação aproximativa “oito ou dez”, sem convertê-la em uma contagem exata.
- source_word: καταβὰς
  choice: desceu
  rationale: Conserva a linguagem direcional convencional da viagem de Jerusalém para Cesareia, cuja altitude é menor.
- source_word: Καισάρειαν
  choice: Cesareia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal clara e idiomática para o dia posterior à chegada.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: tomou assento no tribunal
  rationale: Transmite o ato de Festus ocupar oficialmente o lugar de juiz; “tribunal” comunica de modo natural o contexto judicial, enquanto a nota preserva o sentido concreto de βῆμα.
- source_word: ἐκέλευσεν
  choice: mandou
  rationale: Verbo corrente e digno para uma ordem oficial, sem a rigidez excessiva de “comandou” neste contexto judicial.
- source_word: ἀχθῆναι
  choice: que Paulo fosse trazido
  rationale: Reproduz o infinitivo passivo de ἄγω e deixa implícito, como no grego, o agente encarregado de conduzir Paulo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa natural. A sequência de particípios gregos foi convertida em orações finitas e temporais para melhorar a legibilidade, sem alterar a ordem dos acontecimentos. O marcador da nota foi colocado junto a “tribunal”, termo ao qual a explicação lexical efetivamente se refere.
