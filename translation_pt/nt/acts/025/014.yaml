  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: pt
  text: 'Depois de passarem ali muitos dias, Festo expôs ao rei os assuntos relativos a Paulo, dizendo: “Há um certo homem que Félix deixou como prisioneiro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: por muitos dias
  rationale: O comparativo, nessa expressão temporal, tem sentido idiomático de um período de muitos ou vários dias, sem exigir comparação explícita.
- source_word: διέτριβον
  choice: permanecessem ali
  rationale: διατρίβω indica passar algum tempo ou permanecer num lugar; a formulação é natural e preserva o sujeito plural.
- source_word: ἀνέθετο
  choice: apresentou ao rei
  rationale: O verbo médio denota expor um assunto a alguém para consideração, ideia mais específica do que simplesmente informar.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: o caso de Paulo
  rationale: No contexto judicial, a expressão se refere naturalmente à situação ou ao caso relativo a Paulo; esta opção é clara sem acrescentar uma conclusão jurídica.
- source_word: Ἀνήρ τίς ἐστιν
  choice: Há aqui certo homem
  rationale: A expressão introduz um indivíduo específico, ainda indefinido no discurso; “certo homem” conserva essa força, e “aqui” torna explícita de modo natural a situação indicada pelo contexto imediato.
- source_word: καταλελειμμένος ὑπὸ Φήλικος δέσμιος
  choice: que Félix deixou preso
  rationale: A construção portuguesa comunica de forma direta o perfeito passivo e a condição contínua de prisioneiro, sem sugerir abandono emocional.
- source_word: βασιλεῖ
  choice: ao rei
  rationale: Mantém o título usado no grego, sem repetir o nome de Agripa, já conhecido pelo contexto.
