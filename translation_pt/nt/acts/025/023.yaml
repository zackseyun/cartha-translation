id: ACT.25.23
reference: Acts 25:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: pt
  text: Assim, no dia seguinte, Agripa e Berenice chegaram com grande pompa[a] e entraram no salão de audiências, acompanhados dos comandantes militares e dos homens de destaque da cidade[b]. Então, por ordem de Festo, Paulo foi trazido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com grande aparato» ou «com muita ostentação».
    reason: lexical_alternative
  - marker: b
    text: Ou «dos principais homens da cidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Assim, no dia seguinte
  rationale: A expressão dativa é temporal, e «assim» mantém a continuidade narrativa indicada por οὖν sem excessiva formalidade.
- source_word: ἐλθόντος
  choice: chegaram
  rationale: O particípio aoristo da construção absoluta é vertido por verbo finito, de modo natural em português, preservando a ideia de chegada.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Agripa e Berenice
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: μετὰ πολλῆς φαντασίας
  choice: com grande pompa
  rationale: No contexto, φαντασία indica exibição pública vistosa, esplendor ou aparato cerimonial; «grande pompa» é conciso e natural.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: entraram no salão de audiências
  rationale: ἀκροατήριον designa um local destinado a audiências; a escolha comunica claramente o ambiente oficial sem sugerir um auditório moderno comum.
- source_word: σύν τε χιλιάρχοις
  choice: acompanhados dos comandantes militares
  rationale: χιλίαρχοι refere-se a oficiais militares de alta patente. «Comandantes militares» é inteligível sem impor ao leitor conhecimento da nomenclatura romana; τε coordena este grupo com o seguinte, sem exigir uma tradução isolada.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: dos homens de destaque da cidade
  rationale: κατ’ ἐξοχήν expressa distinção ou proeminência, e «homens de destaque» preserva tanto o sentido quanto a referência masculina explícita.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: por ordem de Festo
  rationale: A construção absoluta é expressa idiomaticamente e mantém a autoridade oficial envolvida em κελεύω.
- source_word: ἤχθη ὁ Παῦλος
  choice: Paulo foi trazido
  rationale: O passivo de ἄγω mostra que Paulo foi conduzido ao recinto; «foi trazido» é natural e não acrescenta detalhes sobre a escolta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez narrativa. A longa estrutura grega foi dividida em duas frases para evitar sobrecarga sem alterar a sequência dos acontecimentos.
