id: ACT.13.15
reference: Acts 13:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: pt
  text: 'Depois da leitura da Lei e dos Profetas, os dirigentes da sinagoga mandaram dizer-lhes: “Irmãos[a], se há entre vocês alguma palavra de encorajamento[b] para o povo, falem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “Homens, irmãos”, forma respeitosa e fraternal de tratamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “mensagem de exortação”. A expressão grega pode transmitir tanto encorajamento como exortação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: leitura
  rationale: No contexto da sinagoga, refere-se à leitura pública das Escrituras; “leitura” é natural e mantém o vínculo direto com o ato de ler.
- source_word: νόμου καὶ τῶν προφητῶν
  choice: Lei e Profetas
  rationale: As iniciais maiúsculas indicam as divisões reconhecidas das Escrituras lidas na sinagoga.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς
  choice: mandaram dizer-lhes
  rationale: A construção seguida de discurso direto comunica o envio de um recado, não necessariamente o deslocamento físico dos dirigentes.
- source_word: ἀρχισυνάγωγοι
  choice: dirigentes da sinagoga
  rationale: Designa os responsáveis pela organização e condução da reunião; “dirigentes” evita sugerir autoridade civil.
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: Forma portuguesa natural que preserva o tratamento masculino, respeitoso e fraternal; a expressão grega mais literal é registrada em nota.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: se há entre vocês alguma
  rationale: Preserva a construção relativamente impessoal do grego e soa clara em português corrente.
- source_word: λόγος παρακλήσεως
  choice: palavra de encorajamento
  rationale: Mantém a imagem de λόγος e um sentido legítimo de παράκλησις, sem eliminar a possível nuance de exortação, indicada em nota.
- source_word: πρὸς τὸν λαόν
  choice: para o povo
  rationale: Expressa naturalmente que o povo é o destinatário da mensagem.
- source_word: λέγετε
  choice: falem
  rationale: Imperativo plural que convida Paulo e seus companheiros a se dirigirem à assembleia.
theological_decisions:
- issue: Tratamento masculino no contexto da sinagoga
  choice: Irmãos
  alternative: Irmãos e irmãs
  rationale: O grego Ἄνδρες ἀδελφοί é explicitamente masculino e se dirige aos visitantes que estavam sendo convidados a falar; não se amplia o referente sem apoio textual.
- issue: Amplitude semântica de παράκλησις
  choice: encorajamento, com exortação em nota
  alternative: exortação no texto principal
  rationale: O termo pode envolver tanto consolo ou encorajamento quanto apelo ou exortação. A tradução principal é idiomática e a nota preserva a tensão lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “mandaram dizer-lhes” conserva a comunicação indireta com fluidez. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
