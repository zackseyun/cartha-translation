id: ACT.13.16
reference: Acts 13:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: pt
  text: 'Então Paulo se levantou, fez sinal com a mão e disse: “Homens de Israel e vocês que temem a Deus[a], escutem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tementes a Deus”. A expressão provavelmente se refere a gentios que adoravam o Deus de Israel e estavam ligados à sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι descreve a ação física de Paulo antes de falar. “Se levantou” é natural em português moderno e mantém o sentido concreto.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá prosseguimento à narrativa, sem indicar contraste forte. “Então” expressa com naturalidade essa progressão.
- source_word: κατασείσας τῇ χειρὶ
  choice: fez sinal com a mão
  rationale: A expressão descreve um gesto destinado a chamar a atenção ou pedir silêncio. Esta formulação é idiomática e evita sugerir um aceno agitado.
- source_word: εἶπεν
  choice: disse
  rationale: É a forma narrativa comum para introduzir discurso direto.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Homens de Israel
  rationale: Preserva tanto o vocativo masculino ἄνδρες quanto a identificação israelita, em linguagem clara e digna.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: vocês que temem a Deus
  rationale: Mantém a força verbal do particípio e dirige a fala claramente ao segundo grupo, sem converter a expressão em um rótulo técnico.
- source_word: ἀκούσατε
  choice: escutem
  rationale: O imperativo pede atenção ao que será dito. “Escutem” é direto e natural no português contemporâneo.
theological_decisions:
- issue: A forma de distinguir os israelitas dos demais frequentadores da sinagoga que temiam a Deus
  choice: “Homens de Israel e vocês que temem a Deus”
  alternative: “Homens israelitas e tementes a Deus”
  rationale: O grego distingue os israelitas de um segundo grupo caracterizado por temer a Deus, provavelmente gentios ligados à sinagoga. A tradução conserva essa distinção sem impor ao texto principal um termo técnico.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A colocação do marcador junto a “temem a Deus” vincula corretamente a nota à expressão que ela explica.
