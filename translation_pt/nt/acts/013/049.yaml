  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: pt
  text: E a palavra do Senhor se espalhava por toda a região.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a mensagem do Senhor».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: se espalhava
  rationale: O imperfeito indica uma ação contínua no passado. Embora a forma grega seja passiva, o português idiomático usa naturalmente a construção pronominal «se espalhava», que mantém o sentido de difusão contínua sem sugerir necessariamente que a mensagem agia por si mesma.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo narrativo leve. «E» dá continuidade ao relato sem introduzir um contraste mais forte do que o texto grego.
- source_word: ὁ λόγος
  choice: a palavra
  rationale: «A palavra» preserva a expressão recorrente de Lucas para a mensagem proclamada, enquanto a nota registra a alternativa contextual «a mensagem».
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: «Do Senhor» conserva a formulação teológica e literária de Atos e a ressonância do título κύριος.
- source_word: δι’ ὅλης τῆς χώρας
  choice: por toda aquela região
  rationale: A preposição διά com genitivo expressa extensão por uma área inteira. «Por toda aquela região» é natural em português, comunica a abrangência de ὅλης e entende χώρα como a área geográfica circundante, não como um Estado nacional moderno.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: «Senhor» é a tradução consagrada e adequada ao uso cristológico de κύριος em Atos, sem reduzir o termo à mera ideia de autoridade.
- issue: Sentido de λόγος
  choice: palavra
  alternative: mensagem
  rationale: «Palavra» mantém o idioma literário recorrente de Lucas e sua densidade teológica; «mensagem» esclarece o referente contextual e, por isso, é oferecida em nota sem substituir a formulação principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «se espalhava» soa natural e preserva o aspecto progressivo do imperfeito; «aquela região» explicita de modo idiomático a região em foco no contexto narrativo.
