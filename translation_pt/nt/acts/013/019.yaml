  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: pt
  text: E, depois de destruir sete nações na terra de Canaã, deu a Israel a terra delas como herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repartiu entre eles a terra daquelas nações como herança”. O verbo grego pode enfatizar a distribuição ou atribuição da terra por herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν (καθαιρέω)
  choice: depois de destruir
  rationale: O particípio aoristo descreve a ação de Deus contra as nações cananeias. “Destruir” comunica com clareza a força do verbo no contexto da conquista.
- source_word: ἔθνη ἑπτὰ
  choice: sete nações
  rationale: “Nações” é uma tradução corrente de ἔθνη e se ajusta ao contexto histórico dos povos de Canaã.
- source_word: ἐν γῇ Χανάαν
  choice: na terra de Canaã
  rationale: Preserva o substantivo γῇ, “terra”, expresso no grego.
- source_word: κατεκληρονόμησεν
  choice: deu ... como herança
  rationale: O verbo pode indicar atribuir, repartir ou conceder por herança. A formulação natural preserva o tema da herança sem ocultar a possibilidade de ênfase na distribuição.
- source_word: τὴν γῆν αὐτῶν
  choice: a terra delas
  rationale: O pronome αὐτῶν retoma diretamente as sete nações; “delas” mantém essa referência sem confundi-la com Israel.
theological_decisions:
- issue: Sujeito e destinatário implícito da herança
  choice: Deus é o sujeito das duas ações, e Israel é explicitado como destinatário da terra.
  alternative: “repartiu a terra delas” ou “deu a terra delas como herança”, sem explicitar o destinatário
  rationale: O contexto imediato enumera os atos de Deus em favor de Israel. Embora o objeto indireto não esteja expresso neste versículo grego, Israel é o destinatário historicamente pressuposto. A explicitação evita ambiguidade pronominal em português e não acrescenta uma conclusão doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “terra delas” preserva com precisão o referente de αὐτῶν, enquanto “a Israel” torna explícito o destinatário implícito pelo contexto.
