base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: pt
  text: Quando eles estavam saindo[b][a], pediam insistentemente que essas palavras lhes fossem ditas no sábado seguinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos dizem mais explicitamente: “Quando Paulo e Barnabé estavam saindo, o povo pedia insistentemente que essas palavras lhes fossem ditas no sábado seguinte”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Quando eles estavam indo embora, pediam que essas coisas lhes fossem ditas no sábado que se aproximava”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Quando eles estavam saindo
  rationale: O particípio presente em genitivo absoluto expressa uma circunstância temporal em andamento. “Estavam saindo” preserva esse aspecto e é natural em português.
- source_word: δὲ
  choice: Quando
  rationale: Aqui, δέ é um conectivo leve, naturalmente incorporado à oração temporal, sem exigir uma conjunção separada.
- source_word: αὐτῶν
  choice: eles
  rationale: O pronome grego não identifica expressamente o referente nesta forma do texto. “Eles” mantém a referência pronominal e evita especificar além da evidência textual.
- source_word: παρεκάλουν
  choice: pediam insistentemente
  rationale: O imperfeito indica uma ação em curso, e παρακαλέω neste contexto comunica um pedido enfático. A expressão evita tanto enfraquecer o verbo como dar-lhe o sentido de exortação moral.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: no sábado seguinte
  rationale: A expressão idiomática aponta para o sábado vindouro ou seguinte. Esta formulação é clara e corrente em português.
- source_word: λαληθῆναι
  choice: fossem anunciadas
  rationale: O infinitivo aoristo passivo de λαλέω refere-se a comunicar oralmente as palavras. “Fossem anunciadas” é natural neste contexto público, embora “fossem ditas” seja uma alternativa mais formalmente próxima.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O dativo funciona como objeto indireto do infinitivo e é expresso de modo conciso pelo pronome “lhes”.
- source_word: τὰ ῥήματα ταῦτα
  choice: essas palavras
  rationale: ῥήματα designa palavras ou declarações proferidas. “Essas palavras” preserva a referência ao discurso anterior sem substituí-la pela interpretação mais ampla “mensagem”.
theological_decisions:
- issue: Referentes dos pronomes no versículo
  choice: O texto principal mantém os participantes sem identificação nominal, usando “eles” e o sujeito implícito de “pediam”.
  alternative: Identificar explicitamente o primeiro grupo como Paulo e Barnabé e o segundo como o povo, ou entender os referentes de outra maneira.
  rationale: O texto desta edição apresenta pronomes e sujeito verbal implícito, em meio a uma conhecida dificuldade textual e interpretativa. A tradução não resolve no texto principal aquilo que a fonte não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pediam insistentemente” comunica a força e a duração do pedido sem soar arcaico. A colocação dos marcadores [b][a] acompanha o ponto exato em que incidem as alternativas textual e lexical.
