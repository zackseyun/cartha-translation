source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: pt
  text: E, quando cumpriram tudo o que estava escrito a respeito dele, tiraram-no do madeiro[a] e o colocaram num túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cruz”; o termo grego significa literalmente “madeira”, “madeiro” ou “árvore” e também pode designar o instrumento de execução, possivelmente evocando Deuteronômio 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: E, depois de
  rationale: Introduz o acontecimento seguinte com sentido temporal e mantém com naturalidade o fluxo narrativo.
- source_word: ἐτέλεσαν
  choice: cumprirem
  rationale: Expressa levar a termo ou realizar o que estava escrito, preservando aqui a possível ressonância de cumprimento das Escrituras sem tornar as próprias Escrituras o sujeito da ação.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: tudo o que estava escrito a respeito dele
  rationale: Reproduz de modo claro a abrangência da expressão e o estado anterior e contínuo do que havia sido escrito acerca de Jesus.
- source_word: καθελόντες
  choice: tiraram-no
  rationale: O particípio aoristo indica uma ação anterior à colocação no túmulo; em português, uma forma verbal coordenada comunica naturalmente a sequência.
- source_word: ἀπὸ τοῦ ξύλου
  choice: do madeiro
  rationale: Madeiro conserva a referência a um objeto de madeira usado na execução e a possível ressonância de Deuteronômio 21:23, sem substituir o termo grego pelo mais específico 'cruz'.
- source_word: ἔθηκαν
  choice: o colocaram
  rationale: Verbo natural e digno para a deposição do corpo no lugar de sepultamento.
- source_word: εἰς μνημεῖον
  choice: num túmulo
  rationale: Neste contexto, μνημεῖον designa claramente um túmulo ou sepultura; 'túmulo' é preciso e corrente.
theological_decisions:
- issue: Tradução de ξύλον no contexto da paixão
  choice: madeiro
  alternative: cruz; árvore
  rationale: O grego usa ξύλον, e não σταυρός. 'Madeiro' preserva a imagem do material/instrumento de madeira e a possível alusão bíblica àquele que é pendurado num madeiro, ao mesmo tempo que evita a estranheza contextual de 'árvore'. A alternativa contextual 'cruz' é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a sequência narrativa e conserva no texto principal a escolha lexical distinta de ξύλον.
