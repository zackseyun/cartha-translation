id: ACT.13.21
reference: Acts 13:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: pt
  text: E, depois disso, eles pediram um rei[a], e Deus lhes deu Saul, filho de Quis, homem da tribo de Benjamim, por quarenta anos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, a partir daí, eles pediram um rei”. O termo inicial também pode indicar uma transição no desenrolar da história.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “por quarenta anos” pode suscitar questões cronológicas quando comparada com os dados do Antigo Testamento; a tradução preserva a formulação de Lucas sem tentar harmonizá-la.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: E, depois disso
  rationale: No resumo histórico, o advérbio composto funciona naturalmente como transição sequencial. A expressão evita a ideia pouco natural de deslocamento espacial em português, sem eliminar a possibilidade lexical indicada na nota.
- source_word: ᾐτήσαντο
  choice: eles pediram
  rationale: Expressa de modo natural o pedido feito pelo povo em benefício próprio, sem intensificar o tom como faria «exigiram».
- source_word: βασιλέα
  choice: um rei
  rationale: O substantivo sem artigo designa o tipo de governante solicitado; o artigo indefinido é natural em português.
- source_word: ἔδωκεν
  choice: deu
  rationale: Preserva o sentido comum do verbo e deixa o contexto comunicar que Deus respondeu ao pedido, sem estreitá-lo para «nomeou».
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Mantém o sujeito explícito do texto grego.
- source_word: τὸν Σαοὺλ
  choice: Saul
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: υἱὸν Κίς
  choice: filho de Quis
  rationale: É a forma patronímica corrente em português bíblico moderno; «Quis» é a grafia portuguesa tradicional do nome.
- source_word: ἄνδρα
  choice: homem
  rationale: Identifica Saul como homem adulto e funciona como aposto descritivo, sem exigir artigo em português.
- source_word: ἐκ φυλῆς Βενιαμίν
  choice: da tribo de Benjamim
  rationale: Comunica claramente a origem tribal. «Da tribo» é mais idiomático em português do que «proveniente da tribo», mantendo o sentido de ἐκ.
- source_word: ἔτη τεσσεράκοντα
  choice: por quarenta anos
  rationale: A preposição «por» explicita a duração indicada pelo acusativo e liga naturalmente a expressão ao ato de Deus dar Saul ao povo.
theological_decisions:
- issue: Relação de ἔτη τεσσεράκοντα com a concessão de Saul
  choice: 'A duração é mantida ligada à declaração de que Deus deu Saul ao povo: «por quarenta anos».'
  alternative: Tomar a expressão de modo mais solto dentro do resumo histórico ou harmonizá-la com reconstruções cronológicas do Antigo Testamento.
  rationale: A sintaxe liga mais naturalmente a expressão temporal à oração imediatamente anterior. A tradução conserva a formulação de Lucas e deixa eventual tensão cronológica sem resolução interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A ordem da frase acompanha de perto o grego, mas a transição inicial foi formulada de maneira idiomática. Todos os marcadores de nota aparecem no texto principal.
