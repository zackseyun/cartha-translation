  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: pt
  text: Depois de atravessarem toda a ilha até Pafos, encontraram certo homem, um mago, falso profeta e judeu, chamado Bar-Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome também pode ser escrito «Barjesus». Provavelmente corresponde a um patronímico semítico que significa «filho de Jesus» ou «filho de Josué».
    reason: alternativa lexical e explicação do nome próprio
lexical_decisions:
- source_word: διελθόντες
  choice: Depois de atravessarem
  rationale: O particípio aoristo indica ação anterior ao verbo principal; a construção preserva essa sequência e expressa naturalmente a travessia.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ é um conectivo narrativo leve. Em português, a progressão é natural sem conjunção explícita, evitando um contraste indevido.
- source_word: ὅλην τὴν νῆσον
  choice: toda a ilha
  rationale: Tradução direta e idiomática da extensão geográfica indicada pelo grego.
- source_word: ἄχρι Πάφου
  choice: até Pafos
  rationale: ἄχρι marca o ponto final do percurso; «até» é a formulação geográfica mais natural em português.
- source_word: εὗρον
  choice: encontraram
  rationale: Reproduz de modo simples o aoristo narrativo, sem acrescentar a ideia de procura deliberada.
- source_word: ἄνδρα τινὰ
  choice: certo homem
  rationale: Preserva a força indefinida e levemente individualizadora de τινά.
- source_word: μάγον
  choice: um mago
  rationale: «Mago» é o equivalente tradicional e acessível de μάγος, mantendo alguma amplitude quanto à natureza exata de sua prática; o contexto fornece a avaliação negativa.
- source_word: ψευδοπροφήτην
  choice: falso profeta
  rationale: Equivalente transparente que conserva tanto a pretensão profética quanto sua falsidade.
- source_word: Ἰουδαῖον
  choice: judeu
  rationale: O adjetivo substantivado em aposição identifica o homem como judeu; nada no contexto exige o sentido geográfico mais restrito de «judeano».
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: chamado Bar-Jesus
  rationale: Forma natural em português para indicar o nome próprio. A transliteração com hífen torna visível a estrutura semítica sem traduzir o nome no corpo do texto.
theological_decisions:
- issue: Forma do nome próprio Βαριησοῦ
  choice: Bar-Jesus
  alternative: Barjesus; filho de Jesus; filho de Josué
  rationale: O texto apresenta um nome próprio, não uma afirmação teológica sobre filiação. A transliteração evita escolher entre «Jesus» e «Josué» como explicação do elemento semítico e preserva a função nominal.
- issue: Caracterização de μάγος
  choice: mago
  alternative: feiticeiro
  rationale: «Feiticeiro» explicitaria uma avaliação mais específica do que o substantivo isoladamente requer. «Mago», junto de «falso profeta» e do contexto subsequente, preserva a caracterização negativa sem eliminar a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase mantém a sequência narrativa e as aposições descritivas do grego, com pontuação natural em português.
