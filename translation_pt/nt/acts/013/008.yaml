source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: pt
  text: Mas Elimas, o mago — pois assim se traduz o nome dele —, opunha-se a eles, procurando afastar o procônsul da fé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de crer”. A expressão grega pode indicar tanto afastá-lo especificamente da fé cristã como impedi-lo de responder com fé de modo mais geral.'
    reason: alternative_reading
  - marker: b
    text: O texto explica “Elimas” como um nome traduzido ou interpretado; sua derivação exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: opunha-se
  rationale: O imperfeito indica oposição contínua; “opunha-se” é natural e preserva o sentido adversativo.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a recepção favorável mencionada no contexto anterior.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Mantém o pronome grego, cujo referente contextual são os missionários, sem explicitação desnecessária.
- source_word: Ἐλύμας
  choice: Elimas
  rationale: Transliteração corrente e legível do nome próprio em português.
- source_word: ὁ μάγος
  choice: o mago
  rationale: μάγος pode designar mago, mágico ou feiticeiro; “mago” preserva a amplitude histórica do termo sem acrescentar carga pejorativa indevida.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: pois assim se traduz o nome dele
  rationale: Preserva a explicação parentética e a ideia de tradução ou interpretação do nome, sem afirmar uma etimologia exata.
- source_word: ζητῶν
  choice: procurando
  rationale: Expressa a intenção que acompanhava sua oposição, em linguagem portuguesa natural.
- source_word: διαστρέψαι
  choice: afastar
  rationale: Com uma pessoa como objeto e ἀπό indicando aquilo de que ela seria desviada, o verbo comunica a tentativa de fazê-la voltar-se para longe da fé.
- source_word: τὸν ἀνθύπατον
  choice: o procônsul
  rationale: Conserva o título administrativo romano específico.
- source_word: ἀπὸ τῆς πίστεως
  choice: da fé
  rationale: O artigo e o contexto favorecem a referência à fé cristã, embora a expressão também possa ser entendida de maneira mais geral como resposta de fé.
theological_decisions:
- issue: Sentido de πίστις
  choice: da fé
  alternative: de crer
  rationale: O artigo grego e o contexto apoiam a referência definida à fé cristã. A possibilidade de uma referência mais geral ao ato ou resposta de crer é mantida em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A ordem foi ajustada para que a oração principal soe natural; os travessões preservam a explicação parentética do grego.
