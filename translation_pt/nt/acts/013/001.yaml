id: ACT.13.1
reference: Acts 13:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: pt
  text: 'Na igreja de Antioquia havia profetas e mestres: Barnabé, Simeão, chamado Níger[a], Lúcio, o cireneu[b], Manaém, companheiro de criação de Herodes, o tetrarca[c], e Saulo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Níger» é um nome latino que significa «negro». Aqui ele é mantido como nome próprio, e não traduzido.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Lúcio era de Cirene, no norte da África.
    reason: cultural_note
  - marker: c
    text: Ou «companheiro próximo de Herodes, o tetrarca». O termo grego pode indicar alguém criado junto com outra pessoa, mas a natureza exata da relação não é especificada.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: havia
  rationale: O verbo é existencial, e o leve valor conectivo de δέ pode ficar implícito em português sem sugerir contraste forte nem introduzir um «agora» temporal ausente do grego.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Na igreja de Antioquia
  rationale: Expressa de modo natural a localização dos profetas e mestres na congregação existente em Antioquia, sem reproduzir de forma rígida a construção participial grega.
- source_word: ἐκκλησίαν
  choice: igreja
  rationale: No contexto de Atos, designa a congregação cristã local; «igreja» é a forma corrente e clara em português.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: profetas e mestres
  rationale: Mantém diretamente as duas designações de ministério presentes no texto, sem impor estruturas eclesiásticas posteriores.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simeão, chamado Níger
  rationale: Preserva a forma do nome Simeão e trata Níger como nome ou cognome, em vez de traduzir o seu sentido no corpo do versículo.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lúcio, o cireneu
  rationale: O gentílico identifica Lúcio como natural ou originário de Cirene; a forma é concisa e próxima do grego.
- source_word: Μαναήν
  choice: Manaém
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Herodes, o tetrarca
  rationale: Conserva o título dado pelo texto grego sem acrescentar a identificação histórica «Antipas».
- source_word: σύντροφος
  choice: que havia sido criado com
  rationale: O termo pode indicar alguém criado junto com outra pessoa. Esta formulação conserva essa relação provável sem afirmar especificamente que Manaém era irmão adotivo de Herodes.
theological_decisions:
- issue: Natureza das designações «profetas e mestres»
  choice: Apresentá-las diretamente como funções reconhecidas na igreja de Antioquia.
  alternative: Trat á-las como cargos formais definidos por estruturas eclesiásticas posteriores.
  rationale: O versículo nomeia profetas e mestres, mas não define uma hierarquia institucional posterior; a tradução evita sobreposição denominacional.
- issue: Relação de Manaém com Herodes expressa por σύντροφος
  choice: «que havia sido criado com Herodes»
  alternative: «irmão de criação de Herodes» ou «companheiro íntimo de Herodes»
  rationale: A escolha comunica a provável criação conjunta sem restringir o vínculo a fraternidade adotiva nem reduzir o termo a mera amizade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar a repetição pesada de locativos. Os nomes seguem formas portuguesas consagradas. Todos os marcadores de nota foram colocados junto ao termo que explicam.
