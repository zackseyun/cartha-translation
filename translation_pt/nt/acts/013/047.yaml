    issue: “Para que você leve a salvação” explicita uma agência não expressa no grego.
    rationale: τοῦ εἶναί σε εἰς σωτηρίαν tem como núcleo «para que você seja para salvação», não «para que você leve a salvação». A formulação proposta restringe indevidamente a amplitude da relação entre o destinatário da citação e a salvação.
  revised_text: 'Pois assim o Senhor nos ordenou: “Eu coloquei você como luz para as nações[a], para que você seja para salvação até os confins da terra[b].”'
