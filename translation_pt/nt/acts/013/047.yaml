id: ACT.13.47
reference: Acts 13:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: pt
  text: 'Pois assim o Senhor nos ordenou: “Eu coloquei você como luz para as nações[a], para que você seja para salvação até os confins da terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como luz para os gentios”. A palavra grega pode significar “nações” ou, em muitos contextos, “gentios”.
    reason: lexical_alternative
  - marker: b
    text: Ou “até a extremidade da terra”. O texto grego emprega o singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: Pois assim
  rationale: Expressa de modo natural tanto a fundamentação introduzida por γάρ quanto a referência de οὕτως à maneira estabelecida pela ordem divina.
- source_word: ἐντέταλται ἡμῖν
  choice: nos ordenou
  rationale: O perfeito de ἐντέλλομαι comunica uma ordem dada que continua válida; o pretérito perfeito composto seria menos natural neste contexto em português brasileiro.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Mantém o título divino convencional e a força autoritativa do falante nas Escrituras citadas.
- source_word: Τέθεικά σε
  choice: Eu coloquei você
  rationale: O perfeito de τίθημι indica uma designação estabelecida. “Coloquei” é claro e próximo do sentido, sem explicitar além do texto a identidade do destinatário singular.
- source_word: εἰς φῶς ἐθνῶν
  choice: como luz para as nações
  rationale: O primeiro εἰς tem valor de função ou designação; ἐθνῶν admite tanto “nações” quanto “gentios”. “Nações” conserva melhor a amplitude da citação de Isaías.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: para que você leve a salvação
  rationale: A construção expressa propósito. Em português, “leve a salvação” comunica naturalmente que a pessoa designada serve à extensão da salvação, embora a formulação grega seja mais compacta; a tensão é reconhecida na decisão teológica.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: até os confins da terra
  rationale: Expressão portuguesa corrente e digna para o alcance geográfico máximo indicado pelo singular grego ἐσχάτου; a alternativa singular mais formal é registrada em nota.
theological_decisions:
- issue: Referente e aplicação da citação de Isaías por Paulo e Barnabé
  choice: Manter o destinatário no singular, “você”, sem identificar explicitamente quem ele é nem explicar como a missão do servo se aplica aos mensageiros.
  alternative: Parafrasear a citação como uma ordem diretamente dirigida aos apóstolos ou identificar no texto o servo citado.
  rationale: O grego preserva a citação no singular e deixa implícita a relação teológica entre o texto do servo e a missão apostólica.
- issue: Força de εἰς σωτηρίαν
  choice: Traduzir idiomaticamente como “leve a salvação”.
  alternative: Traduzir mais formalmente “seja para salvação” ou “seja como salvação”.
  rationale: A opção principal evita uma construção pouco natural em português, mas não afirma que o destinatário seja pessoalmente a própria salvação; apresenta-o como agente de sua expansão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala citada mantém o singular “você”, natural no Brasil e semanticamente transparente em contexto internacional. As notas preservam as alternativas lexicais reais sem sobrecarregar o texto principal.
