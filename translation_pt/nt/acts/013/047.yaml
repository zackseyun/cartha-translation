review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a ordem permanente do Senhor, o destinatário singular da citação, a metáfora da luz, o alcance às nações e a extensão geográfica. Contudo, “para que você leve a salvação” torna explicitamente o destinatário um agente que transporta ou anuncia a salvação. O grego τοῦ εἶναί σε εἰς σωτηρίαν diz literalmente que ele seja «para salvação» e permite uma formulação mais aberta quanto à natureza dessa relação.
  naturalness: “Pois assim o Senhor nos ordenou” e “até os confins da terra” são naturais, claras e adequadas ao registro. “Para que você seja para salvação” é mais formal e menos idiomático que a redação original, mas é compreensível em português moderno e é necessário aqui para conservar a concisão e a indeterminação semântica do texto-fonte.
  terminology: “Senhor”, “luz”, “nações” e “gentios” estão bem empregados. “Confins da terra” comunica adequadamente ἕως ἐσχάτου τῆς γῆς; a nota registra de modo útil a forma singular do grego. A alteração de “leve a salvação” para “seja para salvação” evita acrescentar a ideia de mediação ativa.
  issues:
