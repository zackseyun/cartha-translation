revisions:
- from: 'Pois assim o Senhor nos ordenou: “Eu coloquei você como luz para as nações[a], para que você leve a salvação até os confins da terra[b].”'
  to: 'Pois assim o Senhor nos ordenou: “Eu coloquei você como luz para as nações[a], para que você seja para salvação até os confins da terra[b].”'
  rationale: A revisão substitui a paráfrase agentiva “leve a salvação” por “seja para salvação”, preservando a construção e a ambiguidade deliberadamente concisa de εἰς σωτηρίαν. O restante do texto e as notas são mantidos, pois refletem adequadamente o grego e são naturais no português-alvo.
