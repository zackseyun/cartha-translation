id: ACT.13.43
reference: Acts 13:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: pt
  text: Depois que a reunião da sinagoga terminou[a], muitos dos judeus e dos prosélitos devotos seguiram Paulo e Barnabé. Estes, conversando com eles, os exortavam a permanecer na graça de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois que a assembleia foi dissolvida”. O grego se refere ao encerramento das pessoas reunidas na sinagoga, não ao edifício.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “procuravam persuadi-los a continuar na graça de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης δὲ τῆς συναγωγῆς
  choice: Depois que a reunião da sinagoga terminou
  rationale: O genitivo absoluto apresenta uma circunstância anterior. Aqui συναγωγή se refere naturalmente à reunião congregada, e λύω indica seu encerramento; a formulação evita sugerir que o edifício foi dispensado.
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: Verbo direto e natural para o movimento das pessoas que foram atrás de Paulo e Barnabé após a reunião.
- source_word: πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: muitos dos judeus e dos prosélitos devotos
  rationale: Mantém a relação partitiva com os dois grupos. 'Prosélitos' identifica convertidos ao judaísmo, enquanto 'devotos' expressa σεβομένων sem confundi-los com simples simpatizantes gentios.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: conversando com eles
  rationale: Expressa a fala dirigida e continuada de modo idiomático, sem sobrecarregar o prefixo πρός.
- source_word: ἔπειθον αὐτοὺς
  choice: os exortavam
  rationale: O imperfeito indica ação continuada, e o contexto favorece uma insistência de caráter exortativo. A alternativa 'procuravam persuadi-los' é possível, mas menos fluida.
- source_word: προσμένειν τῇ χάριτι τοῦ θεοῦ
  choice: a permanecer na graça de Deus
  rationale: '''Permanecer'' preserva a ideia de continuidade ou persistência de προσμένω, e ''na graça de Deus'' mantém a formulação teologicamente densa e aberta do grego.'
theological_decisions:
- issue: Sentido de 'permanecer na graça de Deus'
  choice: Mantida a expressão sem paráfrase restritiva.
  alternative: continuar sob o favor gracioso de Deus; continuar na mensagem da graça de Deus
  rationale: A expressão grega pode abranger tanto a ação e o favor de Deus quanto a esfera de vida moldada por essa graça. A tradução não escolhe silenciosamente apenas uma dessas dimensões.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases elimina uma relativa potencialmente ambígua e deixa claro que 'Estes' se refere a Paulo e Barnabé.
