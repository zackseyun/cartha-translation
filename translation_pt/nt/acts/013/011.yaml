id: ACT.13.11
reference: Acts 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: pt
  text: 'E agora, veja: a mão do Senhor está sobre você, e você ficará cego, sem ver o sol por algum tempo. Imediatamente, uma névoa e escuridão caíram sobre ele; e, andando de um lado para outro, procurava pessoas que o conduzissem pela mão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: veja
  rationale: Preserva a função de chamar vividamente a atenção em português atual, sem o tom arcaizante de “eis”.
- source_word: χεὶρ κυρίου
  choice: a mão do Senhor
  rationale: Mantém a metáfora bíblica explícita, que no contexto comunica a ação ativa do Senhor em juízo sem substituí-la por uma interpretação.
- source_word: ἔσῃ τυφλὸς
  choice: você ficará cego
  rationale: Expressa naturalmente em português o início do estado de cegueira implicado pelo contexto.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: sem ver o sol
  rationale: Conserva a referência concreta ao sol e reproduz de modo natural a força descritiva do particípio.
- source_word: ἄχρι καιροῦ
  choice: por algum tempo
  rationale: Comunica um período temporário, mas não especificado, sem sugerir uma duração definida.
- source_word: παραχρῆμα
  choice: Imediatamente
  rationale: Transmite com clareza a ocorrência súbita do juízo.
- source_word: ἀχλὺς καὶ σκότος
  choice: uma névoa e escuridão
  rationale: Preserva as duas imagens distintas de obscurecimento presentes no grego.
- source_word: περιάγων
  choice: andando de um lado para outro
  rationale: Representa o movimento expresso pelo particípio sem acrescentar explicitamente a ideia interpretativa de tatear.
- source_word: ἐζήτει χειραγωγούς
  choice: procurava quem o conduzisse pela mão
  rationale: Mantém o sentido concreto de χειραγωγός, uma pessoa que guia outra segurando-lhe a mão.
theological_decisions:
- issue: Natureza da expressão “a mão do Senhor”
  choice: Manter literalmente a metáfora como “a mão do Senhor”.
  alternative: “o juízo do Senhor está sobre você” ou “o Senhor vai ferir você”
  rationale: O contexto indica intervenção divina em juízo, mas a tradução preserva o idioma bíblico e evita explicitar mais do que o texto diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veja” funciona como marcador enfático; “você” é natural no discurso direto. A ordem e as imagens do grego foram preservadas sem rigidez artificial.
