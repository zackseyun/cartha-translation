- from: 'Então Paulo e Barnabé falaram com coragem: “Era necessário que a palavra de Deus fosse anunciada primeiro a vocês. Mas, visto que vocês a rejeitam e julgam a si mesmos indignos da vida eterna, eis que nos voltamos para os gentios.[a]”'
  to: 'Então Paulo e Barnabé falaram com coragem e disseram: “Era necessário que a palavra de Deus fosse anunciada primeiro a vocês. Visto que vocês a rejeitam e julgam a si mesmos indignos da vida eterna, eis que nos voltamos para os gentios.[a]”'
