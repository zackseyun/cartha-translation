  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: pt
  text: 'Então Paulo e Barnabé falaram com coragem e disseram: “Era necessário que a palavra de Deus fosse anunciada primeiro a vocês. Visto que vocês a rejeitam e julgam a si mesmos indignos da vida eterna, eis que nos voltamos para os gentios.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as nações”. Aqui, a expressão se refere aos não judeus em contraste com os ouvintes da sinagoga; por isso, “gentios” aparece no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: falaram com coragem
  rationale: Expressa a fala franca e destemida indicada por παρρησιάζομαι, em português natural, sem acrescentar uma mudança interior não explicitada.
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: Era necessário que ... fosse anunciada primeiro a vocês
  rationale: Preserva a necessidade, a prioridade temporal e o destinatário inicial. “Anunciada” comunica melhor neste contexto a comunicação pública da mensagem, embora λαλέω signifique literalmente “falar”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão bíblica tradicional e inteligível para a mensagem procedente de Deus.
- source_word: ἐπειδὴ ἀπωθεῖσθε αὐτὸν
  choice: visto que vocês a rejeitam
  rationale: O presente expressa a rejeição em curso; o pronome feminino retoma naturalmente “a palavra” em português.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: julgam a si mesmos indignos
  rationale: Conserva tanto a nuance de julgamento de κρίνω quanto a força reflexiva explícita de ἑαυτούς.
- source_word: τῆς αἰωνίου ζωῆς
  choice: da vida eterna
  rationale: Reproduz de modo direto o complemento genitivo de “indignos”.
- source_word: ἰδοὺ στρεφόμεθα
  choice: eis que nos voltamos
  rationale: “Eis que” preserva a função enfática de ἰδού, enquanto “nos voltamos” mantém a imagem verbal e o sentido de mudança de destinatários.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: No contraste imediato com os ouvintes da sinagoga, refere-se aos não judeus; a alternativa literal “as nações” é registrada em nota.
theological_decisions:
- issue: Sentido de τὰ ἔθνη no contexto histórico-redentivo
  choice: os gentios
  alternative: as nações
  rationale: O contraste imediato é entre o público judeu da sinagoga e os não judeus. “Gentios” torna esse contraste explícito sem reduzir a expressão a uma referência meramente geográfica.
- issue: Força de οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: julgam a si mesmos indignos
  alternative: são declarados indignos
  rationale: O grego atribui explicitamente aos próprios ouvintes o ato de julgar. A tradução mantém essa reflexividade e não transforma a frase numa declaração de Paulo sobre uma indignidade objetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “eis que” conserva a ênfase bíblica sem tornar toda a frase arcaica. O marcador [a] aparece no texto principal junto a “gentios”.
