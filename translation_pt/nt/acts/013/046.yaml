    issue: “Mas” não corresponde ao conectivo grego ἐπειδή.
    rationale: 'ἐπειδή introduz a razão para a volta aos gentios: “visto que/pois vocês a rejeitam”. O adversativo pode sugerir uma contraposição independente e acrescenta uma relação discursiva não marcada no texto-fonte.'
  - severity: low
    issue: O verbo principal εἶπαν não está explicitamente traduzido.
    rationale: Os dois-pontos podem introduzir fala direta, mas “falaram com coragem e disseram” reproduz com maior clareza tanto o particípio παρρησιασάμενοι quanto o verbo finito εἶπαν.
