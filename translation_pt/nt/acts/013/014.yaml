base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: pt
  text: Eles, porém, partindo de Perge, chegaram a Antioquia da Pisídia[a]. No sábado, entraram na sinagoga e se sentaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Antioquia na Pisídia”. O grego diz literalmente “Antioquia, a Pisídia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Eles, porém
  rationale: O pronome explícito αὐτοί mantém o foco nos viajantes, enquanto δέ assinala a continuação narrativa com leve contraste. A formulação é natural e digna em português.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: seguiram viagem desde Perge
  rationale: O particípio de διέρχομαι descreve o prosseguimento da viagem a partir de Perge. “Seguiram viagem” comunica esse movimento contínuo com clareza, e “desde” preserva o ponto de partida indicado por ἀπό.
- source_word: παρεγένοντο
  choice: chegaram a
  rationale: Em contexto de viagem, παραγίνομαι indica chegar a determinado lugar. “Chegaram a” é direto e idiomático.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antioquia da Pisídia
  rationale: A expressão distingue essa Antioquia por sua associação geográfica com a Pisídia. A tradução mantém de perto a construção grega e evita confusão com outras cidades chamadas Antioquia.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: entraram na sinagoga
  rationale: O particípio foi coordenado como verbo finito para produzir narrativa natural em português, sem alterar a sequência dos acontecimentos.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: No sábado
  rationale: A expressão grega, embora use a forma plural σαββάτων, é um idiomatismo para o dia semanal de descanso judaico. “No sábado” é a equivalência corrente e clara em português.
- source_word: ἐκάθισαν
  choice: se sentaram
  rationale: O aoristo apresenta simplesmente a ação de tomar assento. “Se sentaram” é natural no português moderno e expressa a ação ingressiva.
