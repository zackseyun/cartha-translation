id: ACT.13.17
reference: Acts 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: pt
  text: O Deus deste povo de Israel escolheu nossos pais[a], engrandeceu o povo durante sua permanência como estrangeiro na terra do Egito[b] e, com braço erguido[c], tirou-os de lá[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nossos antepassados”. Grego: “nossos pais”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que o povo vivia no Egito como estrangeiro residente.
    reason: cultural_note
  - marker: c
    text: Literalmente, “com braço alto”; expressão ligada ao êxodo que retrata a poderosa libertação realizada por Deus.
    reason: cultural_note
  - marker: d
    text: 'Ou: “conduziu-os para fora dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: O Deus deste povo de Israel
  rationale: Preserva a estrutura solene e a relação genitiva do grego, entendendo «Israel» como identificação do povo sem inserir pontuação interpretativa desnecessária.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: Equivalente natural do aoristo médio; o português não precisa explicitar reflexividade ou interesse próprio.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nossos pais
  rationale: Mantém o termo masculino concreto do grego e o tom histórico da fala; «nossos antepassados» é uma alternativa legítima indicada em nota.
- source_word: ὕψωσεν
  choice: engrandeceu
  rationale: Conserva a amplitude semântica entre exaltar, fazer prosperar e aumentar, evitando limitar o sentido exclusivamente ao crescimento numérico.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: durante sua permanência como estrangeiro na terra do Egito
  rationale: Explicita de maneira natural que παροικία é residência em terra estrangeira, preservando também a expressão completa «terra do Egito».
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: com braço erguido
  rationale: Mantém a imagem literal do idioma bíblico do êxodo; uma nota esclarece sua referência ao poder libertador de Deus.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: tirou-os de lá
  rationale: Formulação corrente em português que conserva o movimento para fora e retoma claramente o Egito.
theological_decisions:
- issue: Identidade dos antepassados de Israel
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O grego usa πατέρας, literalmente «pais». A tradução mantém essa forma sem excluir a referência mais ampla aos antepassados históricos.
- issue: Sentido de ὕψωσεν no Egito
  choice: engrandeceu o povo
  alternative: exaltou o povo; fez o povo crescer
  rationale: O verbo admite elevação de condição e aumento. «Engrandeceu» preserva essa tensão sem decidir que se trata apenas de prestígio ou apenas de multiplicação numérica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Permanência como estrangeiro» comunica um termo histórico hoje pouco transparente, enquanto «braço erguido» preserva a metáfora bíblica. A colocação pronominal em «tirou-os» mantém registro escrito digno sem soar excessivamente arcaico.
