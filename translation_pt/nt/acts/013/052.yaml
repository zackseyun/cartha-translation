  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: pt
  text: E os discípulos continuavam cheios de alegria e do Espírito Santo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «eram continuamente cheios de alegria e do Espírito Santo». O verbo grego no imperfeito pode indicar uma condição contínua ou um enchimento repetido.'
    reason: alternativa aspectual
lexical_decisions:
- source_word: οἵ τε
  choice: E
  rationale: A construção liga o versículo à narrativa anterior; «E» preserva essa continuidade de modo natural em português.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: É o equivalente neotestamentário consagrado e, no contexto, designa os que haviam crido.
- source_word: ἐπληροῦντο
  choice: continuavam cheios
  rationale: O imperfeito passivo retrata uma condição contínua no passado. Esta formulação comunica o aspecto durativo com mais naturalidade do que «estavam sendo cheios», sem eliminar o sentido passivo resultante.
- source_word: χαρᾶς
  choice: de alegria
  rationale: Depois de «cheios», o português pede naturalmente a preposição «de»; «alegria» traduz diretamente χαρά.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: Em Atos, a expressão normalmente se refere ao Espírito Santo divino; o artigo e a contração são idiomáticos em português.
theological_decisions:
- issue: Se πνεύματος ἁγίου deve ser entendido pessoalmente como referência ao Espírito Santo ou qualitativamente como «espírito santo»
  choice: do Espírito Santo
  alternative: de espírito santo
  rationale: O uso recorrente em Atos e o contexto da missão da igreja favorecem a referência ao Espírito Santo, sem reduzir a expressão a uma disposição espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita tanto o arcaísmo quanto uma construção excessivamente literal.
