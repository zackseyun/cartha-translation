id: ACT.13.33
reference: Acts 13:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: pt
  text: 'que Deus a cumpriu para nossos filhos[a], ao levantar Jesus[b], como também está escrito no segundo salmo:


    “Tu és meu Filho;

    hoje eu te gerei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a nós, filhos deles”. Alguns manuscritos trazem “a nossos filhos”, enquanto outros apoiam “a nós, filhos deles”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “ao ressuscitar Jesus dentre os mortos”. O grego também pode significar “levantar” no sentido de suscitar ou fazer surgir.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: cumpriu
  rationale: O perfeito grego apresenta a promessa como cumprida, com resultado ainda vigente; “cumpriu” preserva a linguagem bíblica de cumprimento de promessas.
- source_word: ταύτην
  choice: a
  rationale: O pronome retoma a promessa mencionada no contexto anterior. O pronome português evita acrescentar no texto principal um substantivo ausente do grego.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: para nossos filhos
  rationale: Reproduz a leitura do texto-base e expressa naturalmente o dativo de benefício; a variante textual é registrada em nota.
- source_word: ἀναστήσας Ἰησοῦν
  choice: ao levantar Jesus
  rationale: A formulação mantém aberta a possibilidade de referência tanto à ressurreição como ao ato de Deus suscitar ou fazer surgir Jesus, sem resolver a ambiguidade do contexto.
- source_word: γέγραπται
  choice: está escrito
  rationale: É a fórmula portuguesa corrente para introduzir uma citação das Escrituras e comunica a validade duradoura indicada pelo perfeito passivo.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: no segundo salmo
  rationale: Segue de perto a ordem e a forma do grego, em português natural.
- source_word: Υἱός μου εἶ σύ
  choice: Tu és meu Filho
  rationale: A ordem portuguesa é natural e conserva a declaração direta e solene do salmo.
- source_word: σήμερον γεγέννηκά σε
  choice: hoje eu te gerei
  rationale: “Gerei” traduz diretamente γεννάω e preserva o peso intertextual e cristológico do Salmo 2:7 sem inserir uma interpretação explicativa.
theological_decisions:
- issue: Sentido de ἀναστήσας Ἰησοῦν neste contexto
  choice: “ao levantar Jesus”, preservando a ambiguidade entre ressurreição e o ato de Deus suscitar/fazer surgir Jesus
  alternative: “ao ressuscitar Jesus dentre os mortos” ou “ao suscitar Jesus”
  rationale: O parágrafo passa a empregar linguagem explícita de ressurreição, mas Atos também usa ἀνίστημι para Deus suscitar uma pessoa. A tradução principal não deve eliminar essa tensão interpretativa.
- issue: Força cristológica de “hoje eu te gerei”
  choice: manter diretamente a formulação do Salmo 2:7
  alternative: explicá-la como entronização, adoção régia ou vindicação na ressurreição
  rationale: A tradução deve conservar a citação sem decidir no próprio texto entre interpretações teológicas posteriores.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A citação poética conserva “Tu” e “te”, forma solene e natural nesse contexto, enquanto o restante evita arcaísmos. Os marcadores [a] e [b] aparecem junto às expressões a que suas notas se referem.
