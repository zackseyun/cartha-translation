id: ACT.13.35
reference: Acts 13:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: pt
  text: 'Por isso, também diz em outro salmo[a]: “Não permitirás que o teu Santo[b] veja a decomposição[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em outro lugar” ou “em outra passagem”; o grego diz simplesmente “em outro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o teu fiel”.
    reason: lexical_alternative
  - marker: c
    text: Ou “corrupção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Por isso
  rationale: No contexto, introduz uma conclusão ou confirmação baseada no argumento anterior; “Por isso” comunica naturalmente essa força inferencial.
- source_word: καὶ
  choice: também
  rationale: Acrescenta outra testemunha das Escrituras ao argumento de Paulo.
- source_word: ἐν ἑτέρῳ
  choice: em outro salmo
  rationale: O substantivo está elíptico no grego. Como a citação vem do Salmo 16, explicitar “salmo” torna a referência clara sem mudar o sentido.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente característico das fórmulas de citação bíblica e, sem pronome explícito, preserva melhor a indefinição do sujeito no grego.
- source_word: Οὐ δώσεις
  choice: Não permitirás
  rationale: Nesta construção com infinitivo, δίδωμι tem sentido permissivo, não o sentido literal de “dar”.
- source_word: τὸν ὅσιόν σου
  choice: o teu Santo
  rationale: ὅσιος pode expressar santidade, devoção ou fidelidade. “Santo” preserva a formulação bíblica e se ajusta à aplicação explícita a Jesus neste discurso.
- source_word: ἰδεῖν
  choice: veja
  rationale: Conserva a imagem direta do verbo ὁράω, que literalmente significa “ver”.
- source_word: διαφθοράν
  choice: decomposição
  rationale: No argumento sobre morte e ressurreição, refere-se à deterioração do corpo; “decomposição” expressa isso com clareza no português atual.
theological_decisions:
- issue: Referência messiânica ou cristológica da citação do salmo
  choice: “o teu Santo”, com inicial maiúscula
  alternative: “o teu santo” ou “o teu fiel”
  rationale: Em Atos 13, Paulo aplica diretamente a passagem à ressurreição de Jesus. A inicial maiúscula sinaliza esse referente contextual sem eliminar a amplitude lexical de ὅσιος, registrada em nota.
- issue: Substantivo elíptico depois de ἐν ἑτέρῳ
  choice: Explicitar “salmo”
  alternative: “em outro lugar” ou “em outra passagem”
  rationale: A citação é do Salmo 16. A explicitação ajuda o leitor moderno, enquanto a nota preserva a forma menos específica do grego.
- issue: Sujeito implícito de λέγει
  choice: 'Não acrescentar pronome: “também diz”'
  alternative: “ele também diz” ou “também está escrito”
  rationale: O grego não expressa o sujeito, que pode ser entendido como Deus ou como a Escritura. O português permite conservar essa abertura sem uma formulação artificial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “Não permitirás” mantém o tom solene da citação sem recorrer a linguagem arcaica.
