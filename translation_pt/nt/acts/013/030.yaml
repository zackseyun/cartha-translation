  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: pt
  text: Mas Deus o ressuscitou dentre os mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste com a ação humana mencionada no contexto anterior; “Mas” preserva essa força adversativa de modo natural em português.
- source_word: θεὸς
  choice: Deus
  rationale: O substantivo designa diretamente Deus como sujeito da ação.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: No contexto de ressurreição, ἐγείρω significa levantar alguém da morte. “Ressuscitou” expressa com clareza e naturalidade esse sentido em português.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome retoma Jesus no contexto imediato; o pronome oblíquo “o” é a forma portuguesa natural.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: A expressão indica que Jesus foi levantado do meio ou domínio dos mortos. “Dentre os mortos” preserva essa nuance e é uma formulação bíblica clara em português.
theological_decisions:
- issue: Formulação da ressurreição
  choice: Mas Deus o ressuscitou dentre os mortos.
  alternative: Mas Deus o levantou dos mortos.
  rationale: “Ressuscitou” comunica inequivocamente a ação de Deus ao trazer Jesus da morte, sem acrescentar material interpretativo. “Levantou” seria lexicalmente possível, mas em português é menos específico e poderia não indicar claramente a ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção breve conserva o contraste enfático do grego e a formulação tradicional “dentre os mortos” sem soar arcaica.
