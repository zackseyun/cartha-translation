  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: pt
  text: 'Portanto, tenham cuidado para que não lhes sobrevenha o que foi dito nos Profetas[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos profetas”. O grego diz literalmente “nos Profetas”, provavelmente referindo-se aos escritos proféticos como o lugar em que se encontra esta advertência.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: tenham cuidado
  rationale: O imperativo presente na segunda pessoa do plural introduz uma advertência urgente. “Tenham cuidado” é natural, claro e mantém a força preventiva do grego.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão prática decorrente da proclamação e da advertência anteriores.
- source_word: μὴ ἐπέλθῃ
  choice: para que não lhes sobrevenha
  rationale: A construção com μή e o subjuntivo depois do imperativo expressa prevenção diante de um resultado temido. “Sobrevenha” preserva a ideia de algo que vem sobre os ouvintes, especialmente uma advertência de juízo.
- source_word: τὸ εἰρημένον
  choice: o que foi dito
  rationale: Traduz naturalmente o particípio passivo substantivado. O perfeito grego apresenta a palavra proferida como ainda válida, nuance que o contexto preserva mesmo sem uma forma composta mais pesada em português.
- source_word: ἐν τοῖς προφήταις
  choice: nos Profetas
  rationale: Mantém a preposição ἐν e aponta naturalmente para a seção ou coleção das Escrituras proféticas na qual se encontra a advertência que será citada.
theological_decisions:
- issue: Referente de “os Profetas”
  choice: a coleção dos escritos proféticos das Escrituras
  alternative: os profetas humanos como agentes que pronunciaram a mensagem
  rationale: Como Paulo passa a citar Habacuque, a expressão indica principalmente o lugar escritural onde a advertência está registrada. A tradução “nos Profetas” preserva essa leitura sem excluir que as palavras tenham sido pronunciadas por profetas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Nos Profetas” usa inicial maiúscula para sinalizar a coleção escritural, sem eliminar a ambiguidade possível entre escritos e autores proféticos.
