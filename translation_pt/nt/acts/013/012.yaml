  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: pt
  text: Então, ao ver o que havia acontecido[a], o procônsul creu, admirado com o ensino do Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que tinha ocorrido”.
    reason: lexical_alternative
  - marker: b
    text: A construção grega pode significar “o ensino que vem do Senhor” ou “o ensino a respeito do Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo conciso a sequência temporal da narrativa.
- source_word: ἰδὼν
  choice: ao ver
  rationale: Expressa naturalmente em português o particípio aoristo, preservando a ligação temporal e circunstancial com o verbo principal.
- source_word: ὁ ἀνθύπατος
  choice: o procônsul
  rationale: Mantém o título romano específico, em vez do termo mais genérico “governador”.
- source_word: τὸ γεγονός
  choice: o que havia acontecido
  rationale: O particípio perfeito substantivado aponta para o acontecimento já consumado que o procônsul presenciou.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: Preserva a concisão do grego e não acrescenta um objeto explícito ao verbo, embora o contexto indique fé na mensagem proclamada.
- source_word: ἐκπλησσόμενος
  choice: maravilhado
  rationale: Comunica forte admiração e funciona naturalmente como circunstância concomitante em português.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: com o ensino
  rationale: “Com” apresenta o ensino como motivo ou ocasião do assombro, de maneira idiomática em português.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Mantém a construção genitiva ampla do grego e evita decidir no texto principal se o ensino procede do Senhor ou trata a respeito dele.
theological_decisions:
- issue: Sentido de πιστεύω sem objeto expresso
  choice: creu
  alternative: creu no Senhor; creu na mensagem
  rationale: O contexto sugere fé cristã, mas o grego não explicita o objeto. A tradução conserva essa concisão sem inserir uma especificação doutrinária.
- issue: Sentido do genitivo em “ensino do Senhor”
  choice: o ensino do Senhor
  alternative: o ensino a respeito do Senhor
  rationale: A formulação principal preserva a possível relação subjetiva, possessiva ou objetiva do genitivo; a nota registra a leitura temática sem impor uma só interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “ao ver... o procônsul” evita rigidez sem alterar a sequência narrativa; “procônsul” conserva a precisão histórica. Os marcadores foram posicionados junto às expressões às quais as notas efetivamente se referem.
