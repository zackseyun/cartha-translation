  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: pt
  text: E nós anunciamos a vocês a boa notícia da promessa feita aos pais,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos antepassados». O grego diz «aos pais», uma referência aos antepassados de Israel.
    reason: Alternativa lexical que esclarece o referente histórico de πατέρες, preservado literalmente no texto principal.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que mantém a ligação com o argumento anterior sem acrescentar nuance interpretativa.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito recebe representação em português; sua posição após «E» permite leve destaque natural sem o reforço excessivo de «nós mesmos».
- source_word: ὑμᾶς
  choice: a vocês
  rationale: Com εὐαγγελιζόμεθα, identifica naturalmente os destinatários do anúncio. «Vocês» oferece ampla compreensão e boa legibilidade brasileira.
- source_word: εὐαγγελιζόμεθα
  choice: anunciamos ... a boa notícia
  rationale: Expressa o ato de comunicar boas-novas com linguagem corrente, evitando depender do termo eclesiástico «evangelizamos».
- source_word: τὴν ... ἐπαγγελίαν
  choice: da promessa
  rationale: O substantivo designa a promessa de Deus. A construção portuguesa «a boa notícia da promessa» reproduz de modo natural a relação do anúncio com seu conteúdo.
- source_word: πρὸς τοὺς πατέρας
  choice: aos pais
  rationale: Mantém o termo familiar masculino do grego e sua referência histórico-pactual aos antepassados de Israel, sem inserir o possessivo «nossos», ausente no texto.
- source_word: γενομένην
  choice: feita
  rationale: Como particípio atributivo de «promessa», indica a promessa feita aos pais; «cumprida» anteciparia indevidamente a afirmação do versículo seguinte.
theological_decisions:
- issue: Sentido histórico-pactual de πατέρες
  choice: pais
  alternative: antepassados
  rationale: «Pais» preserva a forma masculina e familiar do original, tradicionalmente usada para os patriarcas e antepassados de Israel. A nota registra «antepassados» como alternativa mais explícita sem apagar a formulação grega.
- issue: Ênfase do pronome ἡμεῖς
  choice: nós
  alternative: nós mesmos
  rationale: O pronome explícito foi preservado, mas «nós mesmos» poderia sugerir contraste reflexivo mais forte do que o contexto exige. A tradução mantém a ênfase disponível sem resolvê-la excessivamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «A vocês» evita regionalismo excessivo; «boa notícia» comunica o valor de εὐαγγελίζομαι em linguagem comum.
