  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: pt
  text: Nele, todo aquele que crê é justificado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio deste, todo aquele que crê é justificado”. A expressão grega também pode ser traduzida mais literalmente como “neste/por meio deste”, referindo-se a Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nele
  rationale: O demonstrativo retoma Jesus no contexto imediato. “Nele” é natural em português e preserva a construção pessoal e relacional do grego.
- source_word: πᾶς ὁ πιστεύων
  choice: todo aquele que crê
  rationale: O particípio presente substantivado tem sentido genérico. A formulação é clara e idiomática, preservando a abrangência individual de πᾶς.
- source_word: δικαιοῦται
  choice: é justificado
  rationale: “Justificar” preserva o sentido jurídico-forense do verbo no contraste imediato com a Lei de Moisés, sem reduzi-lo a transformação moral nem ampliá-lo por paráfrase.
theological_decisions:
- issue: Referente de ἐν τούτῳ
  choice: 'Referência pessoal a Jesus: “Nele”'
  alternative: “Por meio deste” ou “neste”
  rationale: O contexto anterior apresenta Jesus como aquele por meio de quem o perdão é anunciado. “Nele” acompanha esse fluxo cristológico, enquanto a nota conserva a possível nuance instrumental da preposição.
- issue: Sentido de δικαιοῦται
  choice: “é justificado” em sentido forense
  alternative: “é declarado justo” ou “é absolvido”
  rationale: A escolha mantém o vocabulário teológico tradicional e o contraste entre a justificação e aquilo de que a Lei de Moisés não podia justificar, sem explicar em excesso a natureza do ato.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Todo aquele que crê” mantém uma cadência bíblica ainda corrente; “Nele” evita a rigidez de “neste” sem apagar a alternativa formal, registrada em nota.
