id: ACT.13.7
reference: Acts 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: pt
  text: que estava com o procônsul Sérgio Paulo, homem inteligente.[a] Este mandou chamar Barnabé e Saulo e procurou ouvir a palavra de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «homem prudente» ou «homem de entendimento».
    reason: lexical_alternative
  - marker: b
    text: Ou «a mensagem de Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: procônsul
  rationale: Designa especificamente o magistrado romano que governava uma província senatorial; «procônsul» preserva o título histórico com precisão.
- source_word: σὺν
  choice: com
  rationale: Expressa de modo natural a associação ou companhia indicada pela preposição grega.
- source_word: ἀνδρὶ συνετῷ
  choice: homem inteligente
  rationale: συνετός caracteriza Sérgio Paulo como alguém dotado de inteligência e discernimento, sem necessariamente lhe atribuir uma virtude moral.
- source_word: οὗτος
  choice: Este
  rationale: Mantém a retomada enfática do demonstrativo depois da descrição intercalada de Sérgio Paulo.
- source_word: προσκαλεσάμενος
  choice: mandou chamar
  rationale: O particípio indica que o procônsul chamou Barnabé e Saulo à sua presença; a expressão é natural em português e condiz com sua posição oficial, sem implicar coerção indevida.
- source_word: ἐπεζήτησεν
  choice: procurou
  rationale: Preserva a ideia de busca ou desejo ativo expressa pelo verbo, completada naturalmente por «ouvir».
- source_word: ἀκοῦσαι
  choice: ouvir
  rationale: Equivalente direto e idiomático do infinitivo grego no contexto de receber uma mensagem proclamada.
- source_word: λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Conserva a forma da expressão grega e a conhecida linguagem bíblica, permitindo que «palavra» denote aqui a mensagem proclamada.
- source_word: Σεργίῳ Παύλῳ
  choice: Sérgio Paulo
  rationale: Segue a forma tradicional e natural dos nomes em português.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabé e Saulo
  rationale: Emprega as formas consagradas e reconhecíveis dos nomes em português.
theological_decisions:
- issue: Sentido de λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: A opção escolhida é formalmente transparente e preserva a expressão bíblica sem acrescentar nuance doutrinária; a nota registra o sentido contextual de «mensagem».
- issue: Nuance de συνετῷ na descrição de Sérgio Paulo
  choice: homem inteligente
  alternative: homem prudente; homem de entendimento
  rationale: A tradução comunica capacidade de compreensão e discernimento sem transformar a descrição em uma afirmação explícita de virtude moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Mandou chamar» soa mais natural do que «convocou» neste contexto e preserva a iniciativa oficial do procônsul. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
