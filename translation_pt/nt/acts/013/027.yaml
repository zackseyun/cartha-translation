id: ACT.13.27
reference: Acts 13:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: pt
  text: Pois os que moram em Jerusalém e seus governantes, por não reconhecerem este[a] e, ao condená-lo, cumpriram as vozes dos profetas[b], que são lidas todos os sábados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a este”. Literalmente, “este”. O demonstrativo grego pode enfatizar a referência do orador a Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ou “as palavras dos profetas”. Literalmente, “as vozes dos profetas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: os que moram em Jerusalém
  rationale: A expressão participial designa um grupo de pessoas. Esta formulação é clara e natural em português moderno, sem perder o sentido de residência habitual.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: seus governantes
  rationale: Preserva a dimensão de autoridade política e judicial de ἄρχοντες neste contexto.
- source_word: τοῦτον
  choice: este homem
  rationale: O demonstrativo grego aponta de modo enfático para Jesus. Em português, acrescentar “homem” torna a referência natural sem eliminar a força demonstrativa; a forma mais literal é registrada em nota.
- source_word: ἀγνοήσαντες
  choice: por não reconhecerem
  rationale: O contexto indica falta de reconhecimento da identidade de Jesus, não simples desconhecimento de sua existência. A construção com “por” exprime adequadamente a força causal do particípio.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: as palavras dos profetas
  rationale: Embora φωνάς signifique literalmente “vozes”, aqui se refere às declarações proféticas preservadas e lidas nas Escrituras. “Palavras” comunica naturalmente essa metonímia em português, enquanto a imagem literal é preservada em nota.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: que são lidas todos os sábados
  rationale: Reproduz claramente a leitura pública habitual das declarações proféticas a cada sábado.
- source_word: κρίναντες
  choice: ao condená-lo
  rationale: Neste contexto judicial, κρίνω tem o sentido específico de pronunciar condenação contra Jesus. “Ao” mostra que foi mediante esse ato que cumpriram a palavra profética.
- source_word: ἐπλήρωσαν
  choice: cumpriram
  rationale: É a forma consagrada e clara para indicar o cumprimento das declarações proféticas.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa deste versículo com a afirmação anterior.
theological_decisions:
- issue: Natureza do desconhecimento a respeito de Jesus
  choice: por não reconhecerem este homem
  alternative: por não o conhecerem
  rationale: A tradução mantém a ideia de uma falha em reconhecer quem Jesus era, sem afirmar que os habitantes e governantes desconheciam por completo sua existência.
- issue: Relação entre a condenação de Jesus e o cumprimento profético
  choice: cumpriram, ao condená-lo, as palavras dos profetas
  alternative: depois de julgá-lo, cumpriram as palavras dos profetas
  rationale: 'A formulação preserva a força instrumental ou circunstancial do particípio κρίναντες: a condenação foi o ato pelo qual as declarações proféticas se cumpriram, sem acrescentar uma interpretação denominacional.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Os que moram” evita solenidade excessiva; “governantes”, “condená-lo” e “cumpriram” preservam a força política, judicial e escriturística do original. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
