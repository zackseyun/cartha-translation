  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: pt
  text: Mas os judeus incitaram as mulheres piedosas e influentes[a] e os homens mais importantes da cidade; promoveram uma perseguição contra Paulo e Barnabé e os expulsaram daquela região.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as mulheres tementes a Deus”. Em Atos, o particípio pode designar mulheres, possivelmente gentias, que adoravam o Deus de Israel e estavam ligadas à sinagoga.
    reason: lexical_alternative
  - marker: b
    text: Ou “de sua região” ou “de seu território”. O termo grego pode indicar tanto as fronteiras quanto a região delimitada por elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mas os judeus
  rationale: δέ introduz um contraste com a recepção positiva narrada anteriormente; “Mas” expressa com naturalidade essa mudança.
- source_word: παρώτρυναν
  choice: incitaram
  rationale: Comunica a instigação ativa das mulheres e dos líderes locais contra os missionários.
- source_word: τὰς σεβομένας γυναῖκας τὰς εὐσχήμονας
  choice: as mulheres piedosas e influentes
  rationale: “Piedosas” preserva a reverência religiosa indicada por σεβομένας sem definir em excesso a condição delas; “influentes” comunica a posição social elevada expressa por εὐσχήμονας.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: os homens mais importantes da cidade
  rationale: A expressão designa homens de posição destacada na vida cívica e mantém a referência masculina explícita do grego.
- source_word: ἐπήγειραν διωγμὸν
  choice: promoveram uma perseguição
  rationale: 'Expressa de modo natural a força causativa da construção: eles fizeram surgir ou desencadearam uma perseguição.'
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: contra Paulo e Barnabé
  rationale: Com διωγμός, ἐπί com acusativo indica a direção hostil da perseguição.
- source_word: ἐξέβαλον αὐτοὺς
  choice: os expulsaram
  rationale: Preserva a ação coercitiva de ἐκβάλλω em português claro e atual.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: daquela região
  rationale: ὅρια pode indicar os limites territoriais ou o território por eles delimitado; “região” é natural no contexto e evita sugerir que foram apenas afastados de uma linha fronteiriça.
theological_decisions:
- issue: Condição religiosa das mulheres descritas por σεβομένας
  choice: mulheres piedosas
  alternative: mulheres tementes a Deus
  rationale: “Piedosas” conserva a ideia de devoção religiosa sem transformar necessariamente a expressão em uma designação técnica de gentias ligadas à sinagoga.
- issue: Referência masculina em τοὺς πρώτους τῆς πόλεως
  choice: os homens mais importantes da cidade
  alternative: os líderes da cidade
  rationale: A tradução mantém a referência masculina explicitada pelo grego e, ao mesmo tempo, comunica de forma natural a posição cívica elevada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma coordenação pesada sem alterar a progressão dos acontecimentos. “Barnabé” segue a forma portuguesa tradicional do nome.
