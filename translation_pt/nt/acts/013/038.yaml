  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: pt
  text: Portanto, irmãos[a], saibam que, por meio dele[b], o perdão dos pecados é anunciado a vocês e que, de tudo aquilo de que vocês não puderam ser justificados[c] pela Lei de Moisés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs», caso o tratamento seja entendido como inclusivo para o público reunido.
    reason: lexical_alternative
  - marker: b
    text: Isto é, por meio de Jesus, mencionado pouco antes.
    reason: cross_reference
  - marker: c
    text: Ou «declarados justos».
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Portanto, saibam
  rationale: Expressa de modo natural em português a construção imperativa impessoal, preservando tanto a inferência marcada por οὖν como a força declarativa.
- source_word: ἄνδρες ἀδελφοί
  choice: irmãos
  rationale: Reproduz a forma masculina plural e o tratamento familiar idiomático, sem a expressão pouco natural «homens irmãos».
- source_word: διὰ τούτου
  choice: por meio dele
  rationale: O demonstrativo masculino retoma Jesus. «Dele» é a referência pessoal mais natural em português; uma nota explicita o antecedente sem acrescentar «homem» ao texto principal.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: o perdão dos pecados
  rationale: É a expressão corrente e clara para a remissão ou liberação dos pecados neste contexto.
- source_word: καταγγέλλεται
  choice: é anunciado
  rationale: Conserva a voz passiva e a ideia de proclamação pública, em linguagem acessível e digna.
- source_word: ἀπὸ πάντων ὧν
  choice: de tudo aquilo de que
  rationale: Preserva a relação preposicional repetida do grego e introduz com clareza a oração relativa.
- source_word: οὐκ ἠδυνήθητε
  choice: vocês não puderam
  rationale: Equivalente direto e idiomático da incapacidade expressa pelo verbo grego.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: pela Lei de Moisés
  rationale: Entende ἐν em sentido instrumental ou esférico junto de δικαιωθῆναι; «pela» é conciso e natural em português.
- source_word: δικαιωθῆναι
  choice: ser justificados
  rationale: Mantém o termo teológico estabelecido e sua possível força forense, sem reduzi-lo a mera transformação moral.
theological_decisions:
- issue: Sentido de δικαιωθῆναι em relação à Lei de Moisés
  choice: ser justificados
  alternative: ser declarados justos
  rationale: «Ser justificados» preserva a densidade jurídica e teológica do verbo; a nota oferece uma formulação explicativa sem decidir além do que o grego permite.
- issue: Alcance do tratamento masculino ἄνδρες ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma masculina do grego, enquanto a nota registra a possível referência inclusiva ao público reunido.
- issue: Limite textual do versículo
  choice: encerrar com vírgula, mantendo a oração incompleta
  alternative: acrescentar «todo aquele que crê é justificado» do versículo 39
  rationale: A fonte grega fornecida para Atos 13:38 termina em δικαιωθῆναι. A sintaxe continua no versículo seguinte, mas não se deve importar essa cláusula para o texto deste versículo.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» evita regionalismo excessivo. A vírgula final é deliberada: o texto grego fornecido para o versículo 38 termina no meio de uma construção que prossegue em Atos 13:39.'
