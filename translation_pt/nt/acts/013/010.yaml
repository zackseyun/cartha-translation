  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: pt
  text: 'E disse: “Você, cheio de todo tipo de engano e de toda espécie de malícia, filho do diabo, inimigo de toda a retidão[a], não vai parar de torcer os caminhos retos do Senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inimigo de toda a justiça”. A palavra grega pode indicar retidão ou justiça, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: cheio de todo tipo de engano
  rationale: πλήρης com genitivo expressa estar cheio ou ser caracterizado por algo; παντός tem força abrangente, vertida de modo idiomático por “todo tipo de”, e δόλος indica engano, dolo ou fraude.
- source_word: πάσης ῥᾳδιουργίας
  choice: de toda espécie de perversidade
  rationale: ῥᾳδιουργία descreve conduta inescrupulosa, fraudulenta ou vil. “Perversidade” conserva a forte censura moral sem se confundir com “engano” e é natural no português atual.
- source_word: υἱὲ διαβόλου
  choice: filho do diabo
  rationale: Mantém literalmente o vocativo υἱέ e o forte idioma bíblico de semelhança moral ou pertencimento.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: inimigo de toda a justiça
  rationale: δικαιοσύνη pode denotar justiça, retidão ou conduta justa. Neste contexto, “justiça” é natural em português e preserva a amplitude moral da acusação; “retidão” permanece como alternativa lexical.
- source_word: οὐ παύσῃ
  choice: você não vai parar
  rationale: O futuro médio indicativo funciona como pergunta retórica de repreensão. A formulação é atual, direta e não acrescenta a intensificação de “nunca”.
- source_word: διαστρέφων
  choice: de torcer
  rationale: διαστρέφω significa desviar, distorcer ou perverter. “Torcer” mantém a imagem de tornar torto aquilo que é reto e combina naturalmente com a expressão seguinte.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: os caminhos retos do Senhor
  rationale: “Caminhos” conserva os sentidos concreto e metafórico de ὁδοί; “retos” reproduz εὐθείας e cria o contraste intencional com “torcer”.
- source_word: Ὦ
  choice: Ó homem
  rationale: Ὦ introduz uma interpelação enfática. “Ó homem” torna o vocativo natural e inteligível em português, sem atribuir identidade adicional além da pessoa diretamente repreendida.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: No português bíblico e corrente, “justiça” pode abranger o que é justo e moralmente correto. Como δικαιοσύνη também admite a nuance de retidão, essa possibilidade é preservada em nota, sem restringir silenciosamente o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de vocativos conserva o tom severo da repreensão. O paralelismo entre “torcer” e “caminhos retos” mantém o jogo metafórico do grego.
