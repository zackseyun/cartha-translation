base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: pt
  text: Mas eles sacudiram o pó dos pés contra eles e foram para Icônio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacudir o pó dos pés era um gesto simbólico de dissociação e de testemunho contra os que haviam rejeitado a mensagem.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: δέ introduz leve contraste ou transição narrativa; o artigo com o particípio substantivado retoma Paulo e Barnabé, representados naturalmente por “eles”.
- source_word: ἐκτιναξάμενοι
  choice: sacudiram
  rationale: O particípio aoristo médio de ἐκτινάσσω descreve o ato vigoroso de sacudir para remover algo. A coordenação com verbo finito produz português natural sem perder a anterioridade lógica da ação.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: o pó dos pés
  rationale: κονιορτός designa pó solto; o genitivo τῶν ποδῶν identifica os pés dos quais ele foi sacudido. A expressão é clara e idiomática em português.
- source_word: ἐπ’ αὐτοὺς
  choice: contra aquelas pessoas
  rationale: ἐπί com acusativo comunica aqui a direção hostil ou testemunhal do gesto. “Contra” preserva essa força sem inserir no texto principal uma interpretação explícita; “aquelas pessoas” evita uma sequência potencialmente ambígua de pronomes.
- source_word: ἦλθον
  choice: foram
  rationale: Embora ἔρχομαι possa significar “vir”, o movimento narrativo rumo a um destino nomeado é expresso naturalmente em português por “foram”.
- source_word: εἰς Ἰκόνιον
  choice: para Icônio
  rationale: εἰς indica movimento em direção à cidade; “para Icônio” é a formulação idiomática em português.
theological_decisions:
- issue: Significado simbólico de sacudir o pó dos pés
  choice: O gesto é apresentado literalmente como feito “contra aquelas pessoas”, sem explicação interpretativa no corpo do versículo.
  alternative: Traduzir “como testemunho contra elas” ou “como sinal de juízo contra elas”.
  rationale: O gesto tem significado bíblico e cultural reconhecível, mas o grego declara apenas a ação e sua direção. A tradução preserva essa concisão e deixa a explicação para a nota, sem decidir se a ênfase recai em dissociação, testemunho ou juízo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Icônio” segue a forma portuguesa tradicional do topônimo. A ordem “contra aquelas pessoas” mantém próxima do gesto a força de ἐπ’ αὐτούς e torna inequívoco que o ato, não o pó, é dirigido contra elas.
