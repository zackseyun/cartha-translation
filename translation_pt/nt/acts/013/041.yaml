id: ACT.13.41
reference: Acts 13:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: pt
  text: “Vejam, vocês que desprezam[a], admirem-se e pereçam[b], porque, nos dias de vocês, eu realizo uma obra — obra em que de modo algum crerão, ainda que alguém a conte em detalhes[c] a vocês.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês que zombam”. O termo grego designa os que tratam algo com desprezo e pode incluir zombaria.
    reason: lexical_alternative
  - marker: b
    text: Ou “desapareçam” ou “sejam destruídos”. A citação segue Habacuque 1:5 em grego e traz uma forte advertência de ruína.
    reason: alternative_reading
  - marker: c
    text: O verbo grego pode significar “relatar plenamente” ou “contar minuciosamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Vejam
  rationale: Imperativo plural que chama a atenção. “Vejam” é atual e natural, sem o tom arcaico de “vede”.
- source_word: καταφρονηταί
  choice: vocês que desprezam
  rationale: Expressa pessoas que tratam algo com desprezo. A construção verbal é mais natural no português atual do que o substantivo “desprezadores” e evita restringir o sentido apenas à zombaria verbal.
- source_word: θαυμάσατε
  choice: admirem-se
  rationale: Preserva o imperativo e a reação de espanto exigida pela citação profética, inclusive sua força irônica no contexto.
- source_word: ἀφανίσθητε
  choice: pereçam
  rationale: Comunica de modo idiomático a forte advertência de ruína contida no contexto, embora o verbo também possa ser traduzido mais literalmente por “desapareçam”.
- source_word: ἔργον
  choice: obra
  rationale: Termo amplo e corrente para uma ação divina significativa, preservando a repetição do grego.
- source_word: ἐργάζομαι ἐγώ
  choice: eu realizo
  rationale: O presente indica a ação em curso, e o pronome explícito preserva a ênfase em quem age. “Realizo uma obra” soa natural em português.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: nos dias de vocês
  rationale: Mantém a referência temporal e a interpelação direta aos ouvintes em português amplamente compreensível.
- source_word: οὐ μὴ πιστεύσητε
  choice: de modo algum crerão
  rationale: A construção reproduz a negação enfática do grego sem recorrer a uma formulação excessivamente rígida.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: ainda que alguém a conte em detalhes a vocês
  rationale: “Conte em detalhes” preserva a nuance de relatar plenamente; “a” retoma com clareza a obra mencionada.
theological_decisions:
- issue: Força judicial da advertência profética citada de Habacuque
  choice: pereçam
  alternative: desapareçam
  rationale: No contexto, a fala adverte solenemente contra rejeitar a obra de Deus. “Pereçam” comunica a ruína implícita sem acrescentar uma explicação doutrinária; a alternativa mais literal é preservada em nota.
- issue: Ênfase da incredulidade anunciada
  choice: de modo algum crerão
  alternative: jamais creriam
  rationale: Mantém a forte negação do texto grego sem transformar a declaração em uma afirmação sobre incapacidade metafísica nem resolver a tensão entre advertência e incredulidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas plurais em “vocês” para ampla legibilidade brasileira. A repetição de “obra” e a sequência de imperativos foram mantidas para preservar a força retórica da citação profética.
