revisions:
- from: 'E quanto ao fato de que ele o ressuscitou dentre os mortos, para nunca mais voltar à decomposição, Deus falou assim: “Eu lhes darei as santas e fiéis bênçãos prometidas a Davi”.[a]'
  to: 'E, quanto ao fato de que Deus o ressuscitou dentre os mortos, não mais para voltar à decomposição, ele falou assim: “Eu lhes darei as santas e fiéis bênçãos de Davi”[a].'
  rationale: A revisão remove a expansão interpretativa “prometidas a Davi” do texto principal e da alternativa tradicional, preservando a relação genitiva de Δαυὶδ (“de Davi”). Também ajusta a oração sobre o retorno à decomposição para refletir mais de perto a construção grega, sem sacrificar a fluência em português. A explicação pactual, que é contextual e útil, permanece apropriadamente na nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:20:35Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a ressurreição e o contraste com a decomposição corporal. Contudo, “prometidas a Davi” explicita uma relação pactual que não está expressa na frase grega, a qual diz literalmente “as coisas santas de Davi, as fiéis”. É mais fiel manter “de Davi” no texto e deixar a explicação na nota.
  naturalness: “Não mais para voltar à decomposição” é uma formulação clara e mais próxima da construção grega do que “para nunca mais voltar”, que pode soar como finalidade e intensifica levemente a formulação. O restante mantém registro moderno e acessível.
  terminology: “Ressuscitou dentre os mortos” e “decomposição” são adequados ao contexto. “Bênçãos” é uma boa explicitação idiomática para o plural elíptico; “santas e fiéis” preserva os dois qualificadores gregos. A nota deve conservar a alternativa tradicional sem introduzir “prometidas a” como se fosse parte da expressão grega.
  issues:
  - severity: medium
    issue: “prometidas a Davi” no texto e na alternativa da nota
    rationale: A expressão grega τὰ ὅσια Δαυὶδ τὰ πιστά qualifica as dádivas/promessas como relacionadas a Davi, mas não contém um verbo ou particípio equivalente a “prometidas”, nem explicita “a Davi” como destinatário. Essa interpretação pode ser explicada na nota, mas não deve substituir a relação genitiva no texto.
  - severity: low
    issue: “para nunca mais voltar”
    rationale: Embora comunique corretamente a consequência da ressurreição, pode ser lido como oração de finalidade e é mais enfático do que μηκέτι μέλλοντα ὑποστρέφειν. “Não mais para voltar” preserva melhor a construção e a nuance prospectiva.
  revised_text: 'E, quanto ao fato de que Deus o ressuscitou dentre os mortos, não mais para voltar à decomposição, ele falou assim: “Eu lhes darei as santas e fiéis bênçãos de Davi”[a].'
  revised_footnotes:
