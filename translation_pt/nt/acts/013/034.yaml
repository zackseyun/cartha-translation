    text: 'Ou, conforme a formulação tradicional: “as fiéis misericórdias de Davi”. A expressão grega ecoa Isaías 55:3 e se refere às santas e confiáveis promessas da aliança associadas a Davi.'
    reason: alternative_reading
  revision_rationale: A revisão remove a expansão interpretativa “prometidas a Davi” do texto principal e da alternativa tradicional, preservando a relação genitiva de Δαυὶδ (“de Davi”). Também ajusta a oração sobre o retorno à decomposição para refletir mais de perto a construção grega, sem sacrificar a fluência em português. A explicação pactual, que é contextual e útil, permanece apropriadamente na nota.
