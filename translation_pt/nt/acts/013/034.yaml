  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: pt
  text: 'E, quanto ao fato de que Deus o ressuscitou dentre os mortos, não mais para voltar à decomposição, ele falou assim: “Eu lhes darei as santas e fiéis bênçãos de Davi”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a formulação tradicional: “as fiéis misericórdias de Davi”. A expressão grega ecoa Isaías 55:3 e se refere às santas e confiáveis promessas da aliança associadas a Davi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: o ressuscitou dentre os mortos
  rationale: No contexto, ἀνίστημι com ἐκ νεκρῶν indica ressurreição. A formulação é natural em português e mantém explícita a ação divina.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: para nunca mais voltar
  rationale: 'Expressa de modo corrente o resultado futuro negado pela construção grega: ele não voltará outra vez. Evita o pouco natural ''não estando mais para voltar''.'
- source_word: διαφθοράν
  choice: decomposição
  rationale: Aqui o termo se refere à deterioração física do corpo, não à corrupção moral. 'Decomposição' torna esse sentido claro.
- source_word: οὕτως εἴρηκεν
  choice: Deus falou assim
  rationale: O sujeito implícito é Deus, agente também de ἀνέστησεν. Torná-lo explícito produz português claro; o perfeito grego apresenta a declaração das Escrituras como vigente.
- source_word: Δώσω ὑμῖν
  choice: Eu lhes darei
  rationale: Reproduz diretamente a promessa futura e usa uma forma pronominal de ampla compreensão em português.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: as santas e fiéis bênçãos prometidas a Davi
  rationale: A expressão elíptica, eco de Isaías 55:3, aponta para benefícios sagrados e confiáveis ligados às promessas davídicas. 'Prometidas a Davi' esclarece a relação do genitivo sem limitar o conteúdo a uma formulação doutrinária específica.
theological_decisions:
- issue: Sentido da citação de Isaías 55:3, τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: as santas e fiéis bênçãos prometidas a Davi
  alternative: as misericórdias fiéis prometidas a Davi
  rationale: A frase grega é elíptica e pode designar as dádivas, misericórdias ou promessas sagradas e confiáveis associadas a Davi. A opção principal comunica o sentido pactual no contexto do argumento sobre a ressurreição, enquanto a nota conserva a formulação tradicional e a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi suavizada sem apagar a conexão lógica com o argumento anterior; a nota registra a alternativa tradicional para a difícil citação de Isaías.
