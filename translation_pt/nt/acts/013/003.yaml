  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: pt
  text: Então[a], depois de jejuarem, orarem e lhes imporem as mãos, deixaram-nos partir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Naquele momento» ou «Assim, então».
    reason: Alternativas lexicais para τότε; «Então» expressa adequadamente a progressão temporal e a sequência narrativa.
  - marker: b
    text: Ou «os despediram» ou «os liberaram». No contexto, o sentido é que Barnabé e Saulo foram autorizados a partir para a missão.
    reason: Alternativas lexicais para ἀπέλυσαν; «deixaram-nos partir» exprime o sentido contextual sem definir de modo excessivo a natureza do envio.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural a sequência em relação à orientação profética anterior.
- source_word: νηστεύσαντες
  choice: depois de jejuar
  rationale: O particípio aoristo indica uma ação preparatória anterior ao verbo principal.
- source_word: προσευξάμενοι
  choice: orar
  rationale: Coordenado com os demais particípios sob a construção «depois de», mantém a sequência concisa e clara.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: impor as mãos sobre eles
  rationale: Preserva a ação concreta e emprega a expressão portuguesa corrente, sem definir seu estatuto sacramental ou eclesiástico.
- source_word: ἀπέλυσαν
  choice: deixaram-nos partir
  rationale: Expressa o sentido contextual de permitir que Barnabé e Saulo partissem, preservando melhor que «enviaram» a amplitude lexical de ἀπολύω.
- source_word: αὐτοῖς
  choice: eles
  rationale: O pronome dativo se refere a Barnabé e Saulo na expressão da imposição das mãos; o mesmo referente é retomado como objeto de «deixaram partir».
theological_decisions:
- issue: Natureza da imposição das mãos
  choice: Descrever simplesmente a ação, sem lhe atribuir uma teologia específica de ordenação ou sacramento.
  alternative: Explicitar «ordenaram», «abençoaram» ou «comissionaram formalmente».
  rationale: O versículo relata jejum, oração, imposição das mãos e partida, mas não define por si só o estatuto eclesiástico ou o significado sacramental do gesto.
- issue: Agência no envio missionário
  choice: Traduzir ἀπέλυσαν por «deixaram-nos partir».
  alternative: «enviaram-nos» ou «despediram-nos».
  rationale: O contexto envolve a partida para a missão, mas «deixaram-nos partir» evita fazer do verbo uma afirmação mais específica sobre comissão eclesial do que o termo grego exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação evita terminologia denominacional. Contudo, a nota [b] precisa ter marcador no texto principal para cumprir a correspondência editorial de notas.
