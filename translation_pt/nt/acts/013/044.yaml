source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: pt
  text: No sábado seguinte[a], quase toda a cidade se reuniu para ouvir a palavra do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No sábado que se aproximava”.
    reason: lexical_alternative
  - marker: b
    text: “A palavra do Senhor” também pode ser entendida como “a mensagem do Senhor” ou, no contexto, “a mensagem sobre o Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: No sábado seguinte
  rationale: A construção no dativo tem valor temporal. “No sábado seguinte” é natural em português e, no contexto, expressa adequadamente o sábado que se aproximava, sem excluir a alternativa mais literal “no sábado que vinha”.
- source_word: σχεδὸν
  choice: quase
  rationale: σχεδόν significa “quase” ou “aproximadamente”; “quase” combina de modo natural com “toda a cidade”.
- source_word: πᾶσα ἡ πόλις
  choice: toda a cidade
  rationale: A expressão designa amplamente a população da cidade, com força retórica, sem exigir que cada indivíduo estivesse presente.
- source_word: συνήχθη
  choice: se reuniu
  rationale: 'Embora a forma seja passiva, aqui tem sentido intransitivo: a população reuniu-se. O singular concorda naturalmente com o coletivo “toda a cidade”.'
- source_word: ἀκοῦσαι
  choice: para ouvir
  rationale: 'O infinitivo indica finalidade: a cidade se reuniu com o propósito de ouvir.'
- source_word: τὸν λόγον
  choice: a palavra
  rationale: λόγος pode significar “palavra” ou “mensagem”. “A palavra” preserva a terminologia recorrente de Lucas para a proclamação do evangelho.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O genitivo é mantido de modo direto, preservando possíveis nuances de origem, pertencimento ou conteúdo sem interpretá-las em excesso.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” é a tradução corrente e adequada de κύριος neste contexto e preserva a linguagem da proclamação cristã primitiva sem estreitar além do texto a identidade do referente.
- issue: Sentido de “a palavra do Senhor”
  choice: Manter a expressão “a palavra do Senhor”
  alternative: “a mensagem do Senhor” ou “a mensagem sobre o Senhor”
  rationale: A construção genitiva admite nuances sobrepostas. A formulação tradicional preserva a concisão e a ambiguidade teológica do grego, em vez de decidir se a mensagem procede do Senhor ou trata dele.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem das notas foi ajustada para que [a] acompanhe a expressão temporal e [b] acompanhe “a palavra do Senhor”.
