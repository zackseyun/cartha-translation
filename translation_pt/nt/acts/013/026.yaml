  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: pt
  text: Irmãos[a], filhos da linhagem de Abraão, e os que, entre vocês, temem a Deus[b], a nós[c] foi enviada a mensagem[d] desta salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Homens, irmãos”. A forma grega é masculina, embora o discurso público possa incluir a assembleia mais ampla.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode aludir aos chamados “tementes a Deus”, gentios ligados à sinagoga que adoravam o Deus de Israel.
    reason: cultural_note
  - marker: c
    text: Alguns manuscritos trazem “a vocês” em vez de “a nós”.
    reason: textual_alternative
  - marker: d
    text: Ou “a palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Irmãos
  rationale: É uma forma vocativa masculina convencional de dirigir-se ao grupo. “Homens, irmãos” seria excessivamente literal em português, enquanto “irmãos e irmãs” explicitaria além da forma grega; a possível abrangência da assembleia fica indicada em nota.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: filhos da linhagem de Abraão
  rationale: “Filhos” preserva υἱοί, e “linhagem” expressa γένος como descendência ou origem familiar, sem o peso moderno e potencialmente enganoso de “raça”.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: vocês que, entre nós, temem a Deus
  rationale: A tradução descritiva conserva o sentido transparente de φοβούμενοι τὸν θεόν e evita transformar necessariamente a expressão em um rótulo técnico. Como Paulo fala na sinagoga, ἐν ὑμῖν é naturalmente entendido como “entre vocês”; em português, porém, após o vocativo inclusivo, “entre nós” evita sugerir que Paulo se exclui da assembleia e mantém o valor situacional.
- source_word: ἡμῖν
  choice: a nós
  rationale: O dativo marca os destinatários do envio. A repetição enfática de “nós” é preservada, embora algumas testemunhas textuais apresentem “vocês”.
- source_word: ὁ λόγος
  choice: a mensagem
  rationale: No contexto de proclamação, λόγος designa a mensagem comunicada; “mensagem” é natural e clara, enquanto “palavra” permanece como alternativa literal em nota.
- source_word: τῆς σωτηρίας ταύτης
  choice: desta salvação
  rationale: Preserva o genitivo ligado a λόγος e o demonstrativo ταύτης, sem resolver excessivamente a relação como apenas “sobre esta salvação”.
- source_word: ἐξαπεστάλη
  choice: foi enviada
  rationale: O aoristo passivo apresenta o envio como fato realizado. O pretérito perfeito simples é idiomático em português e mantém a voz passiva.
theological_decisions:
- issue: Identidade dos que temem a Deus
  choice: 'Traduzir de forma descritiva: “vocês que, entre nós, temem a Deus”.'
  alternative: “os tementes a Deus entre vocês”, entendido como designação semitécnica de gentios ligados à sinagoga.
  rationale: A expressão pode refletir uma categoria histórica, mas também funciona descritivamente. O texto principal preserva essa abertura, e a nota informa o possível pano de fundo.
- issue: Linguagem masculina no vocativo e na descendência
  choice: Manter “Irmãos” e “filhos”.
  alternative: “Irmãos e irmãs” e/ou “descendentes”.
  rationale: As formas gregas são masculinas. A tradução conserva essa forma sem negar que o discurso público talvez alcançasse uma assembleia mais ampla, possibilidade registrada em nota.
- issue: Variante textual no pronome dativo
  choice: 'Seguir o texto apresentado do SBLGNT: ἡμῖν, “a nós”.'
  alternative: ὑμῖν, “a vocês”, leitura encontrada em parte da tradição manuscrita.
  rationale: A tradução parte do texto crítico fornecido e mantém sua ênfase nos destinatários inclusivos da mensagem, sem ocultar a variante relevante.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário de ampla compreensão no Brasil e no mundo lusófono. A ordem final mantém a ênfase de ἡμῖν (“a nós”), e as notas preservam alternativas lexicais, culturais e textuais relevantes.
