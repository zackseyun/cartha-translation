  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: pt
  text: 'Depois de removê-lo, levantou Davi para eles como rei. A respeito de Davi, também deu testemunho, dizendo: “Encontrei Davi, filho de Jessé, homem segundo o meu coração[a], que fará todas as minhas vontades[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “homem conforme o meu coração”. O grego diz literalmente “segundo o meu coração”.'
    reason: lexical_alternative
  - marker: b
    text: 'O substantivo grego está no plural: “vontades”, isto é, os diversos desígnios ou propósitos de Deus. Muitas traduções empregam o singular coletivo: “toda a minha vontade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: depois de removê-lo
  rationale: Expressa a retirada de Saul da realeza sem restringir o sentido à linguagem política mais específica de “depor”.
- source_word: ἤγειρεν
  choice: levantou
  rationale: Preserva o idiomatismo bíblico de fazer surgir ou estabelecer um governante; “como rei” esclarece que aqui não se trata de ressurreição.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: para eles como rei
  rationale: Mantém o valor benefativo do dativo e apresenta de modo natural a função para a qual Davi foi levantado.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: A respeito de Davi, também deu testemunho, dizendo
  rationale: Comunica naturalmente em português que o testemunho divino dizia respeito a Davi. A repetição do nome evita uma sequência pronominal pouco clara.
- source_word: Εὗρον
  choice: Encontrei
  rationale: O pretérito perfeito traduz diretamente o aoristo e soa natural na declaração citada.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: filho de Jessé
  rationale: Explicita o sentido idiomático da construção genitiva grega.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: homem segundo o meu coração
  rationale: Conserva a formulação concreta e a relação de conformidade expressa por κατά, sem reduzir a frase a afinidade emocional.
- source_word: ὃς ποιήσει
  choice: que fará
  rationale: Reproduz de forma simples o futuro de ποιέω.
- source_word: πάντα τὰ θελήματά μου
  choice: todas as minhas vontades
  rationale: Preserva o plural grego θελήματα, entendido como os vários desígnios ou propósitos de Deus, apesar de o singular coletivo ser mais comum em português.
theological_decisions:
- issue: Sentido de “segundo o meu coração”
  choice: homem segundo o meu coração
  alternative: homem conforme o meu coração
  rationale: A redação escolhida permanece próxima da imagem grega e preserva sua tensão sem interpretá-la apenas como aprovação moral completa ou afinidade sentimental.
- issue: Possível leitura de “levantou” como ressurreição
  choice: levantou Davi para eles como rei
  alternative: constituiu Davi rei para eles
  rationale: “Levantou” mantém a continuidade lexical e o idiomatismo bíblico; a expressão “como rei” delimita o sentido no contexto.
- issue: Número gramatical em θελήματα
  choice: todas as minhas vontades
  alternative: toda a minha vontade
  rationale: O plural do texto grego é genuíno e pode apontar para os diversos desígnios de Deus; ele é mantido no texto e explicado em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se o idiomatismo bíblico “levantou” e a imagem “segundo o meu coração”; a construção foi dividida em duas frases para evitar uma cadeia sintática excessivamente pesada. As notas [a] e [b] aparecem junto às expressões que explicam.
