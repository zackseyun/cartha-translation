id: ACT.13.24
reference: Acts 13:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: pt
  text: Antes da chegada dele[a], João havia proclamado a todo o povo de Israel um batismo de arrependimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antes da vinda dele”. A expressão grega diz literalmente “diante da face da entrada dele”, uma forma idiomática de indicar que alguém precede a chegada de outra pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “um batismo para arrependimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: havia proclamado
  rationale: O particípio aoristo indica uma proclamação pública anterior à chegada mencionada. A forma verbal composta expressa com naturalidade essa anterioridade, sem acrescentar 'previamente', já comunicada pelo contexto temporal.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: antes da chegada dele
  rationale: A expressão idiomática significa que João precedeu a chegada da pessoa em vista. 'Antes da chegada dele' é clara e natural, sem reproduzir de modo rígido a formulação literal 'diante da face da sua entrada'.
- source_word: εἰσόδου
  choice: chegada
  rationale: Embora o substantivo possa significar literalmente 'entrada', neste contexto designa a chegada ou vinda de Jesus. 'Chegada' preserva bem a imagem do movimento sem soar artificial.
- source_word: βάπτισμα μετανοίας
  choice: um batismo de arrependimento
  rationale: Mantém de forma direta a construção genitiva e sua conhecida associação lexical com o ministério de João, sem decidir se o genitivo indica conteúdo, finalidade ou relação.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: a todo o povo de Israel
  rationale: Preserva tanto a totalidade expressa por παντί quanto o substantivo coletivo λαῷ, em formulação corrente e dignificada.
- source_word: Ἰωάννου
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Ἰωάννης.
theological_decisions:
- issue: Referente de αὐτοῦ ('dele')
  choice: Manter o pronome, cujo referente contextual é Jesus, o Salvador da descendência de Davi.
  alternative: Explicitar 'antes da chegada de Jesus'.
  rationale: Atos 13:23–25 identifica Jesus como o referente, mas este versículo usa apenas o pronome. Mantê-lo evita inserir no texto um nome ausente do grego e conserva a coesão com o contexto.
- issue: Relação semântica em βάπτισμα μετανοίας
  choice: batismo de arrependimento
  alternative: batismo para arrependimento
  rationale: O genitivo grego permite mais de uma nuance. A tradução escolhida conserva a formulação e evita definir de maneira exclusiva a relação como finalidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade no Brasil. 'Chegada' evita uma tradução excessivamente literal da expressão idiomática; 'havia proclamado' comunica a anterioridade da ação. Todos os marcadores de nota aparecem junto às expressões pertinentes.
