id: ACT.13.28
reference: Acts 13:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: pt
  text: E, embora não encontrassem fundamento algum para uma sentença de morte[a], pediram a Pilatos que ele fosse executado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «acusação que merecesse a morte» ou «base legal para a pena de morte».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «fosse morto».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples com o fluxo narrativo anterior, sem acrescentar uma relação lógica mais específica.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: fundamento algum para uma sentença de morte
  rationale: Neste contexto judicial, αἰτία designa motivo, acusação ou fundamento que justificaria a pena capital. A formulação escolhida comunica esse sentido jurídico em português atual e evita a possível leitura de «causa da morte».
- source_word: εὑρόντες
  choice: embora não encontrassem
  rationale: 'O particípio aoristo é circunstancial e anterior ao verbo principal, mas o contexto evidencia uma relação concessiva: apesar de não acharem fundamento para a condenação, pediram a execução. «Embora» torna essa tensão natural e clara em português.'
- source_word: ᾐτήσαντο
  choice: pediram
  rationale: É a forma corrente e natural de expressar o pedido formal dirigido a Pilatos; o complemento deixa evidente a natureza judicial da solicitação.
- source_word: Πιλᾶτον
  choice: Pilatos
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: que ele fosse executado
  rationale: Aqui ἀναιρέω significa eliminar, matar ou executar. O contexto de julgamento e pena capital favorece «executado», que preserva a dimensão judicial sem recorrer a uma expressão excessivamente literal.
theological_decisions:
- issue: Explicitação do valor concessivo do particípio εὑρόντες
  choice: embora não encontrassem
  alternative: não tendo encontrado / depois de não encontrarem
  rationale: A forma grega não contém uma conjunção concessiva explícita, mas a sequência narrativa ressalta o contraste entre a ausência de fundamento jurídico e o pedido de execução. A tradução torna essa relação contextual explícita sem eliminar a tensão moral do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. «Sentença de morte» e «executado» preservam o cenário judicial; «fundamento algum» evita ambiguidade e mantém a ênfase negativa do grego.
