id: ACT.13.37
reference: Acts 13:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: pt
  text: Mas aquele a quem Deus ressuscitou não viu a decomposição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corrupção”. O termo grego pode indicar a deterioração ou decomposição do corpo; “corrupção” preserva a formulação que ecoa o Salmo 16:10 na Septuaginta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: aquele a quem
  rationale: O pronome relativo retoma a pessoa em discussão, Jesus, e funciona como objeto de ἤγειρεν. A formulação explicita naturalmente o referente sem acrescentar conteúdo.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com Davi no versículo anterior.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Forma idiomática em português para o sujeito definido.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: Neste contexto, o contraste entre a morte e decomposição de Davi e o destino daquele que Deus levantou torna decisivo o sentido de levantar dentre os mortos. “Ressuscitou” comunica isso de modo claro e natural em português.
- source_word: οὐκ εἶδεν
  choice: não viu
  rationale: Preserva a expressão semítica e a ressonância da citação do Salmo 16, em vez de substituí-la por “não sofreu” ou “não experimentou”.
- source_word: διαφθοράν
  choice: decomposição
  rationale: No contexto do corpo morto de Davi, designa deterioração física. “Decomposição” é claro no português atual; “corrupção” permanece na nota por preservar a formulação tradicional e a correspondência lexical com o Salmo grego.
theological_decisions:
- issue: Sentido de ressurreição em ἤγειρεν
  choice: ressuscitou, isto é, Deus levantou Jesus dentre os mortos
  alternative: levantou, no sentido de suscitar ou fazer surgir
  rationale: O contexto imediato contrapõe Davi, que morreu e viu decomposição, àquele que Deus ressuscitou e que não a viu. Assim, o sentido de ressurreição é contextualmente determinante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aquele a quem” mantém a estrutura relativa; “não viu” conserva o eco bíblico, enquanto “decomposição” esclarece o sentido corporal.
