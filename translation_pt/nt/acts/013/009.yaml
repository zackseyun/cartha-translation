  text: Mas Saulo, também chamado Paulo, cheio do Espírito Santo, fixou os olhos nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulo
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição com leve contraste, introduzindo a reação de Saulo ao que precede.
- source_word: ὁ καὶ Παῦλος
  choice: também conhecido como Paulo
  rationale: Expressa de modo natural a aposição que identifica Saulo por seu outro nome, sem sugerir uma mudança de nome.
- source_word: πλησθεὶς
  choice: cheio
  rationale: Reproduz de maneira idiomática o particípio passivo no contexto, mantendo a ideia de Saulo estar tomado ou pleno do Espírito.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: No uso lucano e neste contexto de capacitação divina, a expressão designa o Espírito Santo.
- source_word: ἀτενίσας
  choice: fixou os olhos
  rationale: Comunica o olhar firme e atento expresso pelo verbo grego, em português atual e digno.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com o verbo de olhar fixamente, transmite naturalmente a direção do olhar para Elimas.
theological_decisions:
- issue: Referente de πνεύματος ἁγίου
  choice: do Espírito Santo
  alternative: de um espírito santo
  rationale: O contexto narrativo de Atos e o padrão de uso de Lucas indicam o Espírito divino, não um espírito indefinido.
- issue: Relação entre os nomes Saulo e Paulo
  choice: também conhecido como Paulo
  alternative: que também era Paulo
  rationale: A construção apresenta um nome adicional; a tradução evita pressupor uma conversão ou troca formal de nome que o grego não afirma.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A ordem participial foi preservada sem rigidez excessiva.
