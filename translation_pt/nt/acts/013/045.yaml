id: ACT.13.45
reference: Acts 13:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: pt
  text: Mas, quando os judeus[a] viram as multidões, ficaram cheios de inveja[b] e começaram a contradizer o que Paulo dizia[c], blasfemando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o grupo judeu local que se opunha a Paulo nesta ocasião, não o povo judeu como um todo.
    reason: cultural_note
  - marker: b
    text: Ou “cheios de zelo”; neste contexto, o sentido negativo “inveja” é mais provável.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “o que era dito por Paulo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: O particípio aoristo é expresso naturalmente como oração temporal, preservando sua relação com a ação principal.
- source_word: δὲ
  choice: Mas
  rationale: Marca a mudança contrastante em relação à recepção positiva narrada anteriormente.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação explícita do grego sem restringi-la indevidamente a líderes; a nota esclarece seu alcance narrativo local.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Preserva o plural e comunica de modo natural os grandes grupos reunidos.
- source_word: ἐπλήσθησαν ζήλου
  choice: ficaram cheios de inveja
  rationale: Embora ζῆλος possa significar zelo, a reação hostil motivada pelas multidões favorece aqui inveja.
- source_word: ἀντέλεγον
  choice: começaram a contradizer
  rationale: O imperfeito permite uma leitura ingressiva e apresenta o início de uma oposição continuada.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: o que Paulo dizia
  rationale: Expressa naturalmente o particípio substantivado e seu sentido contínuo, sem perder o foco no conteúdo das palavras de Paulo.
- source_word: βλασφημοῦντες
  choice: com blasfêmias
  rationale: Traduz o particípio como circunstância de modo associada à contradição e preserva a gravidade do termo sem especificar um objeto ausente no grego.
theological_decisions:
- issue: Possível generalização antijudaica de οἱ Ἰουδαῖοι
  choice: os judeus, com nota contextual
  alternative: os líderes judeus / os judeus daquele lugar no corpo do texto
  rationale: O texto grego emprega a designação simples, mas o contexto aponta para o grupo judeu local que se opunha a Paulo, não para todo o povo judeu.
- issue: Sentido de ζῆλος
  choice: inveja
  alternative: zelo
  rationale: A ambiguidade lexical é real e fica registrada em nota; a sequência de oposição e blasfêmia favorece o sentido negativo no contexto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural tanto no Brasil quanto em âmbito lusófono mais amplo. A colocação de “com blasfêmias” junto a “contradizer” deixa clara sua função modal sem determinar contra quem eram dirigidas.
