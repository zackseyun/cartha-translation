id: ACT.13.36
reference: Acts 13:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: pt
  text: Pois Davi, depois de servir ao propósito de Deus em sua própria geração, adormeceu[a], foi reunido a seus antepassados[b] e viu a decomposição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Adormeceu» é um eufemismo bíblico para a morte.
    reason: cultural_note
  - marker: b
    text: Lit. «foi acrescentado a seus pais», expressão de estilo hebraico que significa juntar-se aos antepassados na morte.
    reason: lexical_alternative
  - marker: c
    text: Isto é, seu corpo se decompôs; compare o contraste no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: em sua própria geração
  rationale: O dativo indica naturalmente a esfera temporal e histórica em que Davi serviu; a formulação evita interpretá-lo como beneficiário, como faria «para a sua geração».
- source_word: ὑπηρετήσας
  choice: depois de servir
  rationale: O particípio aoristo apresenta o serviço de Davi como anterior aos verbos principais. «Servir» é claro e não possui a conotação eclesiástica mais estreita de «ministrar».
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: ao propósito de Deus
  rationale: βουλή pode denotar propósito, desígnio ou plano. «Propósito de Deus» é natural, acessível e preserva a intencionalidade divina sem impor um sistema teológico específico.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo bíblico para a morte e a imagem usada no texto, sem reduzi-la simplesmente a «morreu».
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: foi reunido a seus antepassados
  rationale: Expressa em português atual o idiomatismo semítico de juntar-se aos antepassados na morte. «Antepassados» evita que «pais» seja entendido apenas como progenitores imediatos.
- source_word: εἶδεν διαφθοράν
  choice: viu a decomposição
  rationale: Mantém de perto a expressão grega e sua ligação retórica com o contraste do versículo seguinte; no contexto, refere-se à decomposição corporal.
theological_decisions:
- issue: Eufemismo da morte aplicado a Davi
  choice: adormeceu
  alternative: morreu
  rationale: O grego emprega κοιμάομαι. Manter o eufemismo conserva a imagem bíblica sem acrescentar afirmações doutrinárias sobre o estado dos mortos.
- issue: Sentido de βουλή em relação à intenção divina
  choice: propósito de Deus
  alternative: conselho de Deus; plano de Deus; desígnio de Deus
  rationale: «Propósito» comunica a intenção divina de modo atual e amplo, sem estreitar indevidamente o campo semântico.
- issue: Ligação sintática de ἰδίᾳ γενεᾷ
  choice: em sua própria geração
  alternative: para a sua própria geração
  rationale: A construção grega admite discussão quanto à ligação do dativo, mas a leitura temporal/esférica é natural e não transforma a geração explicitamente em beneficiária do serviço.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. Mantêm-se as imagens «adormeceu» e «viu a decomposição» por sua função retórica e bíblica; o idiomatismo semítico é vertido de modo inteligível no texto e explicado em nota.
