  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: pt
  text: Assim, eles, enviados pelo Espírito Santo, desceram a Selêucia e dali navegaram para Chipre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ μὲν οὖν
  choice: Assim, eles
  rationale: O pronome explícito conserva uma leve ênfase nos enviados, enquanto μὲν οὖν assinala a progressão narrativa e a consequência da comissão anterior; “Assim” expressa essa ligação com naturalidade.
- source_word: ἐκπεμφθέντες
  choice: enviados
  rationale: O particípio aoristo passivo indica que o envio precede as ações principais. Em português, a forma reduzida “enviados” preserva a voz passiva e essa relação sem tornar a frase pesada.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: pelo Espírito Santo
  rationale: Ὑπό com genitivo marca o agente do envio. A forma consagrada em português identifica naturalmente o agente divino pessoal no contexto de Atos.
- source_word: κατῆλθον εἰς Σελεύκειαν
  choice: desceram a Selêucia
  rationale: Κατέρχομαι conserva a ideia concreta de descer, apropriada ao deslocamento até a cidade portuária; a preposição “a” indica destino de modo claro e digno.
- source_word: ἐκεῖθέν τε ἀπέπλευσαν εἰς Κύπρον
  choice: e dali navegaram para Chipre
  rationale: “Dali” traduz o ponto de partida, “e” representa τε, e “navegaram para” comunica tanto a partida por mar quanto o destino sem a possível ambiguidade moderna de “partiram para”.
theological_decisions:
- issue: Tradução de ἁγίου πνεύματος
  choice: Espírito Santo
  alternative: espírito santo
  rationale: No contexto de Atos, a expressão designa o agente divino pessoal que envia Barnabé e Saulo. A capitalização é uma convenção editorial natural em português e não acrescenta conteúdo ausente da ação pessoal expressa no texto.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. A construção é concisa e preserva a progressão narrativa, a voz passiva do envio e a imagem geográfica de descer ao porto.
