source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: pt
  text: Por cerca de quatrocentos e cinquenta anos[a]. E, depois dessas coisas, ele deu juízes até Samuel, o profeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em algumas traduções, a referência temporal é ligada de outra maneira: “Ele deu juízes por cerca de quatrocentos e cinquenta anos, até Samuel, o profeta”. O texto grego e sua pontuação neste trecho são debatidos.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: cerca de
  rationale: Diante de um numeral, ὡς indica aproximação, não uma contagem exata.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: quatrocentos e cinquenta anos
  rationale: A expressão no dativo indica duração ou extensão temporal; a forma por extenso é clara e digna em português.
- source_word: καὶ μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Expressa a sequência narrativa e preserva o demonstrativo plural sem tornar a frase artificial.
- source_word: ἔδωκεν
  choice: deu
  rationale: Mantém o sentido básico de δίδωμι e o modo bíblico de descrever a provisão divina, sem explicitar indevidamente 'nomeou'.
- source_word: κριτὰς
  choice: juízes
  rationale: É o termo histórico consagrado para os líderes de Israel no período anterior à monarquia.
- source_word: ἕως
  choice: até
  rationale: Marca diretamente o limite final do período mencionado.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Samuel, o profeta
  rationale: A aposição identifica Samuel por sua função; as vírgulas produzem uma formulação natural em português.
theological_decisions:
- issue: Relação da expressão temporal 'cerca de quatrocentos e cinquenta anos' em um versículo textual e sintaticamente difícil
  choice: Apresentar a expressão como uma declaração temporal independente, seguida por 'Depois dessas coisas, ele lhes deu juízes até Samuel, o profeta', conforme o texto SBLGNT fornecido.
  alternative: Ligar 'cerca de quatrocentos e cinquenta anos' ao período em que Deus deu juízes, até Samuel, ou relacioná-lo mais diretamente à oração precedente, conforme outras decisões de texto e pontuação.
  rationale: A construção de Atos 13:20 é debatida. A tradução segue a disposição do texto grego fornecido e mantém a alternativa em nota, sem harmonização nem resolução dogmática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão 'Depois dessas coisas' preserva a sequência e o plural gregos; 'deu juízes' conserva deliberadamente o idioma bíblico, e 'lhes' explicita em português o destinatário subentendido pelo contexto.
