- source_word: αὐτοὺς
  choice: os
  rationale: Pronome objeto que retoma o povo de Israel.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: Forma corrente e clara em português para a região desabitada onde Israel peregrinou, mantendo a ressonância bíblica.
theological_decisions:
- issue: Sentido da ação de Deus para com Israel no deserto
  choice: ele os suportou
  alternative: ele cuidou deles
  rationale: A leitura do SBLGNT, ἐτροποφόρησεν, favorece «suportou». Uma variante textual próxima, ἐτροφοφόρησεν, sustenta a ideia de cuidar ou alimentar; ela é mantida em nota para não ocultar a diferença da tradição manuscrita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Durante» torna explícita a duração temporal de modo idiomático; «deserto» é mais natural no uso bíblico corrente em português.
