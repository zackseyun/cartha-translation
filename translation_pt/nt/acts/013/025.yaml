base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: pt
  text: 'E, quando João estava completando sua carreira, dizia: “Quem vocês pensam que eu sou? Eu não sou ele.[a] Mas vejam: depois de mim vem aquele de cujos pés não sou digno de desatar as sandálias.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Quem vocês pensam que eu sou? Eu não sou o Messias.” O grego deixa implícita a identidade negada, embora o contexto aponte para o Messias.'
    reason: alternative_reading
  - marker: b
    text: Alguns manuscritos e traduções trazem mais especificamente “desatar a correia das sandálias dele”; porém, o texto grego impresso aqui diz simplesmente “desatar a sandália (ou as sandálias) dos pés dele”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: estava completando sua carreira
  rationale: Expressa o aspecto durativo do imperfeito e preserva a metáfora de δρόμος para a missão ou trajetória designada a João.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito indica fala habitual ou contínua; em português, “dizia” transmite isso naturalmente sem exigir uma perífrase.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Quem vocês pensam que eu sou?
  rationale: Formula de modo natural em português a pergunta sobre a identidade atribuída a João. “Quem” é idiomático para identidade pessoal, embora o grego empregue τί, literalmente “que”. “Vocês” favorece ampla clareza e leitura brasileira.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Eu não sou ele
  rationale: Mantém a elipse e a ênfase do grego sem inserir “o Messias” no texto principal.
- source_word: ἀλλ’ ἰδοὺ
  choice: Mas vejam
  rationale: Conserva a função de ἰδού de chamar a atenção em linguagem moderna; o plural concorda com os ouvintes indicados por “vocês”.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: depois de mim vem aquele
  rationale: Preserva o presente vívido e explicita apenas o sujeito implícito necessário à fluência portuguesa.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: de cujas sandálias ... desatar
  rationale: “Sandálias” é o plural idiomático em português para o singular genérico ὑπόδημα; “desatar” traduz λύω no contexto sem acrescentar “correias”, ausente no texto grego impresso.
- source_word: ἄξιος
  choice: digno
  rationale: Equivalente transparente e tradicional de ἄξιος nesta declaração de humildade.
theological_decisions:
- issue: Identidade negada por João em οὐκ εἰμὶ ἐγώ
  choice: Eu não sou ele
  alternative: Eu não sou o Messias
  rationale: O contexto aponta para o Messias como a identidade negada, mas o grego deixa o referente implícito. A tradução conserva essa elipse e esclarece a interpretação provável em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Carreira” preserva a metáfora sem torná-la excessivamente esportiva; “vejam” evita o arcaísmo de “eis”. Todos os marcadores de nota aparecem no texto principal.
