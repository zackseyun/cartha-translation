id: ACT.13.23
reference: Acts 13:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: pt
  text: 'Da descendência[a] desse homem, Deus, conforme a promessa[b], trouxe a Israel um Salvador: Jesus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da semente”; aqui, a expressão se refere à linhagem de Davi.
    reason: lexical_alternative
  - marker: b
    text: Ou “como havia prometido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: desse homem
  rationale: O demonstrativo no genitivo retoma Davi, mencionado no versículo anterior. “Desse homem” explicita o referente pessoal sem acrescentar informação alheia ao contexto.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: da descendência
  rationale: Embora σπέρμα signifique literalmente “semente”, aqui designa a linhagem ou descendência de Davi. “Descendência” é natural em português e conserva o sentido genealógico.
- source_word: κατ’ ἐπαγγελίαν
  choice: conforme a promessa
  rationale: A expressão indica conformidade com uma promessa anterior. A formulação mantém o singular sem especificar no texto principal qual promessa está em vista.
- source_word: ἤγαγεν
  choice: trouxe
  rationale: O verbo ἄγω significa normalmente “trazer” ou “conduzir”. “Trouxe” é lexicalmente direto e evita a possível associação de “levantou” com a ressurreição.
- source_word: τῷ Ἰσραήλ
  choice: a Israel
  rationale: O dativo é representado de maneira próxima ao grego por “a Israel”, embora também possa ter nuance de benefício.
- source_word: σωτῆρα
  choice: um Salvador
  rationale: “Salvador” preserva o título cristológico e o sentido de σωτήρ, sem reduzi-lo a uma libertação apenas política ou circunstancial.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions:
- issue: Relação de Jesus com a promessa davídica
  choice: O texto apresenta Jesus como vindo da descendência de Davi e trazido por Deus a Israel conforme a promessa.
  alternative: Explicitar “em cumprimento da promessa feita a Davi”.
  rationale: O contexto aponta para a promessa ligada a Davi, mas o grego não traz essa explicitação neste versículo. A tradução conserva a conexão sem ampliar o enunciado.
- issue: Sentido de ἤγαγεν
  choice: trouxe
  alternative: levantou
  rationale: “Trouxe” preserva o sentido normal do verbo e não decide que a expressão aluda à ressurreição.
translation_notes:
  register: Português atual, digno e de compreensão ampla, com boa legibilidade brasileira. A ordem foi ajustada para fluidez, e os dois-pontos antes de “Jesus” identificam naturalmente quem é o Salvador sem acrescentar conteúdo.
