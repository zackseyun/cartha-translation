  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: pt
  text: Quando os gentios ouviram isso, começaram a se alegrar e a glorificar a palavra do Senhor; e creram todos os que haviam sido destinados para a vida eterna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam inclinados para a vida eterna”. O particípio grego é entendido de maneiras diferentes pelos intérpretes, mas o sentido passivo “haviam sido destinados” é o mais direto neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Quando ... ouviram isso
  rationale: O particípio presente é circunstancial. A construção temporal é natural em português, e “isso” explicita pelo contexto o conteúdo ouvido.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Neste contexto de Atos, o termo distingue os não judeus dos judeus; “gentios” comunica essa referência com precisão.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: começaram a se alegrar e a glorificar
  rationale: Os imperfeitos retratam ações em desenvolvimento e admitem aqui uma nuance incoativa; a coordenação preserva a unidade verbal sem tornar a frase artificial.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: “Palavra” preserva a expressão bíblica e sua ressonância, embora no contexto se refira à mensagem proclamada.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: O aoristo indicativo é adequadamente expresso pelo pretérito perfeito simples, sem acréscimo interpretativo.
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa em português natural a força quantitativa do pronome relativo grego.
- source_word: τεταγμένοι
  choice: haviam sido destinados
  rationale: O particípio perfeito passivo de τάσσω indica mais diretamente uma designação ou destinação anterior. A forma passiva e o estado resultante são preservados sem identificar explicitamente o agente.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: “Para” expressa de modo natural a orientação ou finalidade de εἰς nesta construção.
theological_decisions:
- issue: Sentido de τεταγμένοι em relação à designação divina e à resposta humana
  choice: haviam sido destinados para a vida eterna
  alternative: estavam dispostos para a vida eterna
  rationale: A forma perfeita passiva favorece o sentido de terem sido designados ou destinados, mas o versículo não explicita o agente nem desenvolve uma doutrina completa da predestinação. A leitura alternativa debatida é registrada em nota para preservar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Gentios”, “palavra do Senhor” e “vida eterna” mantêm o vocabulário bíblico corrente. O marcador foi colocado após a oração controversa, vinculando claramente a nota a τεταγμένοι.
