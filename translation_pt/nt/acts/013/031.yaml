  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: pt
  text: Ele apareceu durante muitos dias[a] aos que tinham subido com ele da Galileia para Jerusalém. Eles agora são suas testemunhas ao povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi visto durante muitos dias”. O verbo grego pode ser traduzido mais formalmente dessa maneira, especialmente em contextos de aparições após a ressurreição.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “o povo” provavelmente se refere especificamente ao povo judeu, isto é, a Israel.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Ele
  rationale: O pronome relativo retoma Jesus no versículo anterior. Em português, iniciar nova frase com “Ele” é natural e mantém claro o referente.
- source_word: ὤφθη
  choice: apareceu
  rationale: Embora a forma seja passiva, “apareceu” é o uso natural neste contexto de manifestações após a ressurreição; a alternativa formal “foi visto” fica registrada em nota.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: durante muitos dias
  rationale: A preposição com acusativo expressa duração temporal; esta formulação é clara e idiomática.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: aos que tinham subido com ele
  rationale: O particípio indica os que o acompanharam na viagem. “Tinham subido” explicita que essa viagem precedeu as aparições e preserva o sentido de subir a Jerusalém.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: da Galileia para Jerusalém
  rationale: Reproduz diretamente o movimento geográfico indicado no grego.
- source_word: οἵτινες νῦν εἰσὶ
  choice: Eles agora são
  rationale: A retomada por pronome em nova frase comunica naturalmente a identificação enfática do grupo e preserva νῦν, “agora”.
- source_word: μάρτυρες αὐτοῦ
  choice: suas testemunhas
  rationale: 'Mantém a relação expressa pelo genitivo: são testemunhas ligadas a Jesus e que dão testemunho a respeito dele.'
- source_word: πρὸς τὸν λαόν
  choice: diante do povo
  rationale: πρός indica aqui a orientação pública do testemunho. “Diante do povo” expressa o papel testemunhal perante essa audiência sem ampliar explicitamente λαός para Israel.
theological_decisions:
- issue: Natureza da linguagem das aparições após a ressurreição
  choice: Ele apareceu
  alternative: Ele foi visto
  rationale: “Apareceu” comunica de modo natural o emprego contextual de ὤφθη, sem enfraquecer o caráter histórico do testemunho. A forma passiva mais literal é preservada em nota.
- issue: Alcance de “o povo”
  choice: o povo
  alternative: o povo de Israel / o povo judeu
  rationale: O contexto provavelmente aponta para Israel, mas o grego traz apenas λαός. O texto principal preserva essa formulação e a especificidade contextual é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma oração relativa longa, sem alterar as relações do texto. As notas preservam a alternativa formal de ὤφθη e a provável referência contextual de λαός.
