id: ACT.13.2
reference: Acts 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: pt
  text: 'Enquanto serviam ao Senhor e jejuavam[a], o Espírito Santo disse: “Separem para mim Barnabé e Saulo para a obra à qual os chamei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prestavam culto ao Senhor”. O verbo grego pode indicar serviço com conotações de adoração ou liturgia.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: serviam ao Senhor em adoração
  rationale: O particípio denota serviço prestado, aqui com dimensão cultual ou devocional. A formulação natural em português preserva tanto o serviço quanto a adoração, sem limitar o sentido a uma liturgia formal.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: O dativo indica aquele a quem o serviço é dirigido; “ao Senhor” é direto, idiomático e preserva o título κύριος.
- source_word: νηστευόντων
  choice: jejuavam
  rationale: Tradução corrente do particípio, apresentado como atividade simultânea ao serviço de adoração.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma padrão e natural em português moderno, mantendo o Espírito como sujeito pessoal do verbo “disse”.
- source_word: Ἀφορίσατε
  choice: Separem
  rationale: O imperativo expressa separar pessoas para um propósito especial. “Separem” é claro e evita acrescentar a noção técnica de ordenação ou nomeação.
- source_word: δή
  choice: —
  rationale: A partícula dá ênfase ou urgência ao imperativo, força que em português já é transmitida naturalmente pela ordem direta; uma palavra separada como “agora” poderia sugerir uma precisão temporal excessiva.
- source_word: μοι
  choice: para mim
  rationale: Indica aquele para cujo propósito Barnabé e Saulo devem ser separados.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabé e Saulo
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: εἰς τὸ ἔργον
  choice: para a obra
  rationale: “Obra” conserva a amplitude de ἔργον e não antecipa uma categoria técnica como ministério, missão ou ofício.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: à qual os chamei
  rationale: O perfeito grego indica um chamado já realizado e ainda vigente. Em português, o pretérito perfeito comunica isso naturalmente neste contexto, sem a artificialidade de “tenho chamado”.
theological_decisions:
- issue: Sentido de λειτουργούντων no contexto de devoção comunitária e comissionamento
  choice: serviam ao Senhor em adoração
  alternative: prestavam culto ao Senhor; serviam ao Senhor
  rationale: A expressão mantém juntas as dimensões de serviço e adoração sugeridas pelo verbo, sem restringi-lo a uma liturgia institucional nem apagar seus matizes cultuais.
- issue: O Espírito Santo como sujeito que fala
  choice: o Espírito Santo disse
  alternative: —
  rationale: O grego apresenta diretamente o Espírito Santo como sujeito pessoal da fala, e a tradução preserva essa construção sem paráfrase ou despersonalização.
- issue: Natureza da separação para a obra
  choice: Separem para mim ... para a obra
  alternative: Designem ... para o ministério
  rationale: O texto descreve uma separação divina para uma tarefa específica, mas não usa terminologia técnica de ordenação nem define um ofício eclesiástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o grego sem rigidez; “à qual os chamei” é idiomático e conserva a relação explícita entre o chamado e a obra.
