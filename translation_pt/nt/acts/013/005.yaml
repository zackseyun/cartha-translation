  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: pt
  text: Quando chegaram a Salamina, anunciavam a palavra de Deus nas sinagogas dos judeus. Também tinham João como auxiliar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como ajudante” ou “como assistente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Quando chegaram a Salamina
  rationale: A construção participial com ἐν e o nome do lugar indica naturalmente a chegada a Salamina; a oração temporal é clara e idiomática em português.
- source_word: κατήγγελλον
  choice: anunciavam
  rationale: O verbo denota anúncio ou proclamação pública. “Anunciavam” conserva essa amplitude sem restringir a ação à pregação formal.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Expressão consagrada e transparente que preserva a construção genitiva e não reduz λόγος simplesmente a uma mensagem humana.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: nas sinagogas dos judeus
  rationale: Neste contexto, Ἰουδαίων identifica o povo judaico em seu ambiente religioso, não apenas habitantes da Judeia.
- source_word: εἶχον δὲ καὶ
  choice: Também tinham
  rationale: “Também” comunica a força aditiva de καί, enquanto a nova frase reproduz com naturalidade a transição leve marcada por δέ.
- source_word: Ἰωάννην
  choice: João
  rationale: Forma portuguesa tradicional do nome Ἰωάννης.
- source_word: ὑπηρέτην
  choice: auxiliar
  rationale: O termo designa alguém que presta assistência ou serviço subordinado. “Auxiliar” é natural neste contexto de viagem ministerial e evita conotações indevidamente servis.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém o aspecto durativo do imperfeito κατήγγελλον em “anunciavam” e emprega “judeus” no sentido étnico-religioso adequado ao contexto.
