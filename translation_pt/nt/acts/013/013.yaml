  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: pt
  text: Depois de partir de Pafos por mar[a], Paulo e seus companheiros[b] chegaram a Perge, na Panfília. João, porém, separou-se deles e voltou para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de zarpar de Pafos”. O verbo grego descreve a saída para o mar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que estavam ao redor de Paulo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Depois de partir de Pafos por mar
  rationale: Em contexto de viagem, ἀνάγω indica sair ao mar ou zarpar. A formulação explicita naturalmente em português o sentido marítimo do particípio sem sugerir apenas uma partida por terra.
- source_word: οἱ περὶ Παῦλον
  choice: Paulo e seus companheiros
  rationale: A expressão designa o grupo associado a Paulo. Esta formulação é clara e natural, além de refletir que Paulo passa a ser apresentado como figura de referência do grupo.
- source_word: ἦλθον
  choice: chegaram
  rationale: Embora ἔρχομαι possa ser traduzido por “ir” ou “vir”, aqui o destino é especificado; “chegaram” expressa com naturalidade o resultado do deslocamento.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Perge, na Panfília
  rationale: O genitivo localiza Perge na região da Panfília; a construção com “na” é idiomática em português.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: separou-se deles
  rationale: A expressão informa que João se afastou do grupo, sem declarar seu motivo nem acrescentar uma avaliação moral.
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: ὑποστρέφω significa regularmente retornar ou voltar; “voltou” é conciso e natural na narrativa.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
theological_decisions:
- issue: Possível avaliação da partida de João
  choice: separou-se deles
  alternative: abandonou-os
  rationale: O versículo relata a partida de João e seu retorno a Jerusalém, mas não explicita motivo nem avaliação moral. A tradução evita antecipar uma interpretação negativa baseada no contexto posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para produzir uma frase natural, mantendo a sequência narrativa e o contraste introduzido por “porém”.
