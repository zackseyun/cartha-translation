  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: pt
  text: Assim, a palavra do Senhor crescia poderosamente e prevalecia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, a palavra do Senhor crescia e prevalecia com poder”. A expressão grega κατὰ κράτος é idiomática e pode ser traduzida adverbialmente como “poderosamente” ou “com poder”.'
    reason: Esclarece a alternativa lexical de κατὰ κράτος sem sugerir uma ligação sintática que o grego não sustenta.
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Introduz o resultado dos acontecimentos anteriores de modo natural e preserva a força resultativa do advérbio.
- source_word: κατὰ κράτος
  choice: poderosamente
  rationale: A expressão idiomática comunica força ou efeito poderoso. O advérbio liga-se naturalmente ao crescimento da palavra, sem eliminar a ideia de força também expressa pelo verbo seguinte.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Mantém o título grego sem explicitar no texto principal que o referente é Jesus.
- source_word: ὁ λόγος
  choice: a palavra
  rationale: Preserva a expressão recorrente em Atos para a mensagem proclamada, embora 'a mensagem' também seja possível.
- source_word: ηὔξανεν
  choice: crescia
  rationale: O imperfeito indica progresso contínuo; o imperfeito português reproduz esse aspecto com naturalidade.
- source_word: ἴσχυεν
  choice: prevalecia
  rationale: No contexto, o verbo indica que a palavra demonstrava força e avançava eficazmente; 'prevalecia' conserva essa ideia sem reduzir o sentido a mero crescimento numérico.
theological_decisions:
- issue: Referente de τοῦ κυρίου
  choice: Senhor
  alternative: Senhor Jesus
  rationale: O contexto aponta naturalmente para Jesus, mas o grego traz apenas o título 'Senhor'; a tradução mantém a formulação da fonte e não explicita o referente.
- issue: Personificação da palavra em ηὔξανεν καὶ ἴσχυεν
  choice: crescia poderosamente e prevalecia
  alternative: a mensagem se difundia cada vez mais e ganhava força
  rationale: Mantém a imagem concisa do original, na qual a palavra cresce e demonstra força, sem transformá-la em uma explicação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Assim' e os imperfeitos 'crescia' e 'prevalecia' preservam o caráter resumitivo e contínuo do versículo; 'palavra do Senhor' mantém a formulação lucana tradicional.
