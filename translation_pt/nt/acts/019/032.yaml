id: ACT.19.32
reference: Acts 19:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: pt
  text: Então, uns gritavam uma coisa, e outros, outra, pois a assembleia[a] estava em confusão, e a maioria nem sabia por que havia se reunido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reunião” ou “multidão”. A palavra grega é ἐκκλησία, usada aqui para uma assembleia cívica, e não para a igreja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Então, uns gritavam uma coisa, e outros, outra
  rationale: A construção distributiva ἄλλοι... ἄλλο τι é expressa naturalmente por “uns... outros...”. O imperfeito ἔκραζον indica ação contínua no tumulto, bem representada por “gritavam”; οὖν é traduzido por “Então” de modo idiomático.
- source_word: ἐκκλησία
  choice: assembleia
  rationale: Neste contexto cívico e tumultuário, o termo designa a reunião pública, não a igreja cristã. “Assembleia” mantém o sentido institucional amplo e a ligação lexical, enquanto a nota evita leitura eclesial indevida.
- source_word: συγκεχυμένη
  choice: estava em confusão
  rationale: O particípio perfeito descreve o estado resultante de desordem e confusão; a formulação portuguesa é natural e preserva esse valor de estado.
- source_word: οἱ πλείους
  choice: a maioria
  rationale: O comparativo substantivado significa “a maior parte” das pessoas presentes. “A maioria” é claro, corrente e remete naturalmente à assembleia.
- source_word: οὐκ ᾔδεισαν
  choice: nem sabia
  rationale: Com “a maioria” como núcleo singular coletivo, a concordância no singular é natural em português. “Nem” reforça idiomaticamente o caráter surpreendente da ignorância geral sem alterar a negação do grego.
- source_word: τίνος ἕνεκα
  choice: por que
  rationale: A expressão significa “por qual razão”. “Por que” é o equivalente português mais direto e natural.
- source_word: συνεληλύθεισαν
  choice: havia se reunido
  rationale: O mais-que-perfeito grego situa a reunião antes do momento narrado. A forma composta “havia se reunido” preserva essa anterioridade; o singular concorda naturalmente com o coletivo “a maioria”.
theological_decisions:
- issue: Sentido de ἐκκλησία neste versículo
  choice: assembleia cívica ou pública
  alternative: igreja
  rationale: O contexto é o ajuntamento tumultuado em Éfeso, e não uma congregação cristã. Traduzir por “igreja” importaria aqui um sentido eclesial inadequado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A elipse em “e outros, outra” reproduz com concisão o contraste do grego. O marcador [a] aparece imediatamente após “assembleia”.
