  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: pt
  text: Portanto, já que essas coisas são incontestáveis, é necessário que vocês mantenham a calma e não façam nada precipitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: incontestáveis
  rationale: Expressa aquilo que não admite contradição ou contestação; é natural em português e adequado ao tom público e argumentativo do discurso.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão tirada do argumento anterior e preserva claramente a conexão lógica.
- source_word: ὄντων τούτων
  choice: já que essas coisas são
  rationale: Traduz de modo idiomático o genitivo absoluto com valor circunstancial e causal.
- source_word: δέον ἐστίν
  choice: é necessário
  rationale: Conserva o sentido impessoal de necessidade ou obrigação sem acrescentar uma autoridade externa não explicitada.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: que vocês mantenham a calma
  rationale: Retrata um estado contínuo de compostura após a agitação; em português corrente, é mais preciso no contexto do que uma formulação limitada ao silêncio.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: não façam nada precipitado
  rationale: Preserva a advertência contra uma ação impulsiva, apressada ou irrefletida em formulação natural.
