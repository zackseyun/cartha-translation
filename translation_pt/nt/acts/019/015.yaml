  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: pt
  text: 'Mas o espírito maligno lhes respondeu: “Jesus eu conheço, e Paulo eu reconheço[a]; mas vocês, quem são?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e de Paulo eu sei”. O grego emprega dois verbos diferentes: γινώσκω (“conheço”) e ἐπίσταμαι (“reconheço”, “sei de”); a diferença exata de nuance é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: lhes respondeu
  rationale: A construção com particípio e verbo finito introduz idiomaticamente uma resposta. A formulação portuguesa evita a repetição artificial de “respondendo, disse”, preserva os destinatários e soa natural.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição contrastiva entre a tentativa dos exorcistas e a reação do espírito.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: o espírito maligno
  rationale: No contexto, πνεῦμα designa um ser espiritual pessoal, e πονηρός indica seu caráter mau. “Espírito maligno” é claro, corrente e digno em português.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Jesus eu conheço
  rationale: A posição inicial de “Jesus” no grego lhe dá destaque. A ordem escolhida conserva essa ênfase sem perder naturalidade em português.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Paulo eu reconheço
  rationale: O grego emprega um verbo diferente de γινώσκω. “Reconheço” mantém uma distinção lexical possível sem definir excessivamente a natureza desse conhecimento.
- source_word: ὑμεῖς δὲ τίνες ἐστέ;
  choice: mas vocês, quem são?
  rationale: O pronome ὑμεῖς é enfático e plural. “Vocês” torna explícito o plural para leitores brasileiros, enquanto a construção contrastiva preserva o desafio dirigido aos exorcistas.
theological_decisions:
- issue: Distinção entre γινώσκω e ἐπίσταμαι na fala do espírito
  choice: “Jesus eu conheço, e Paulo eu reconheço”
  alternative: “Jesus eu conheço, e de Paulo eu sei” ou “Jesus eu conheço, e Paulo eu conheço”
  rationale: Os dois verbos podem sobrepor-se em sentido, mas a alternância pode ter efeito retórico. A tradução preserva uma diferença possível, e a nota registra alternativas sem transformar a escolha lexical em afirmação doutrinária sobre graus de conhecimento demoníaco.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” explicita o plural de ὑμεῖς. A ordem “Jesus eu conheço” e “Paulo eu reconheço” reproduz a ênfase dos objetos antepostos no grego.
