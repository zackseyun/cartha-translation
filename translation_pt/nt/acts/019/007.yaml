  text: Ao todo, eram cerca de doze homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: eram
  rationale: O verbo εἰμί está no imperfeito e, neste contexto, declara o número dos integrantes do grupo. Em português, a construção com «eram» é natural e preserva o valor verbal do grego.
- source_word: δὲ
  choice: —
  rationale: δέ é um conectivo leve, sem contraste relevante aqui; omiti-lo produz português fluente sem perda de conteúdo.
- source_word: οἱ πάντες
  choice: Ao todo
  rationale: A expressão substantivada resume o conjunto inteiro. «Ao todo» comunica de modo idiomático sua força totalizadora ao apresentar uma contagem.
- source_word: ἄνδρες
  choice: homens
  rationale: ἀνήρ designa especificamente homens, e não pessoas de modo genérico; por isso, mantém-se a referência masculina.
- source_word: ὡσεὶ
  choice: cerca de
  rationale: ὡσεὶ indica aproximação diante de um número. «Cerca de» é uma equivalência clara e corrente.
- source_word: δώδεκα
  choice: doze
  rationale: Correspondência direta do numeral cardinal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem «Ao todo» conserva a força resumitiva de οἱ πάντες, enquanto «cerca de» mantém explicitamente a aproximação do número.
