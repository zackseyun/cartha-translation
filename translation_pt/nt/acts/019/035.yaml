  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: pt
  text: 'Mas o secretário da cidade, depois de acalmar a multidão, disse: “Homens de Éfeso, quem é que não sabe que a cidade dos efésios é guardiã do templo da grande Ártemis[a] e da imagem caída do céu[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “responsável pelo templo da grande Ártemis”. O termo grego descreve uma cidade reconhecida como guardiã de um templo ou culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “do objeto caído do céu”. A palavra grega se refere a algo que se acreditava ter caído do céu; aqui, provavelmente designa a imagem de culto ligada a Ártemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: depois de acalmar
  rationale: O particípio aoristo indica uma ação anterior à fala; a formulação preserva essa sequência de modo natural em português.
- source_word: ὁ γραμματεὺς
  choice: o secretário da cidade
  rationale: Neste contexto cívico, designa um alto funcionário municipal de Éfeso, não um escriba religioso.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Expressão corrente e adequada para o ajuntamento público tumultuado.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Homens de Éfeso
  rationale: Preserva o vocativo masculino e formal do texto grego em português natural.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: quem é que não sabe
  rationale: Reproduz com naturalidade a pergunta retórica, sem acrescentar uma distinção de gênero que o português idiomático não exige aqui.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: a cidade dos efésios
  rationale: Mantém de modo transparente a construção genitiva do original.
- source_word: νεωκόρον
  choice: guardiã do templo
  rationale: Comunica a condição honorífica da cidade como responsável ou custódia reconhecida do templo ou culto, evitando o pouco natural 'guarda-templo'.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: da grande Ártemis
  rationale: Conserva o título cultual com artigo e adjetivo, usando a forma portuguesa corrente do nome.
- source_word: τοῦ διοπετοῦς
  choice: da imagem caída do céu
  rationale: O adjetivo substantivado indica algo tido como caído do céu; 'imagem' explicita o referente provável no contexto, enquanto a nota preserva a formulação mais indeterminada.
theological_decisions:
- issue: A alegação pagã acerca de Ártemis e do objeto διοπετές
  choice: 'Relatar diretamente a afirmação do funcionário: ''da imagem caída do céu''.'
  alternative: '''da coisa caída do céu'' ou ''do objeto caído do céu''.'
  rationale: A fala registra uma crença cívico-religiosa pagã sem endossá-la como verdadeira. A tradução mantém a alegação do orador, e a nota sinaliza a indeterminação lexical do objeto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. 'Secretário da cidade' esclarece a função cívica; 'guardiã do templo' soa natural e mantém o sentido institucional. As notas preservam as alternativas lexicais e a ambiguidade legítima de διοπετές.
