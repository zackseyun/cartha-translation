source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: pt
  text: Mas, se vocês buscam algo mais, isso será resolvido na assembleia[a] legalmente constituída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na assembleia legal» ou «na assembleia regular». O grego refere-se a uma reunião cívica constituída conforme a lei, não à igreja.'
    reason: Alternativas lexicais para ἐννόμῳ ἐκκλησίᾳ e esclarecimento do sentido cívico de ἐκκλησία neste contexto.
lexical_decisions:
- source_word: περαιτέρω
  choice: outra
  rationale: Com τι, indica algo adicional além da questão presente. “Alguma outra coisa” expressa isso de modo natural em português.
- source_word: ἐπιζητεῖτε
  choice: estão buscando
  rationale: Preserva o sentido amplo de procurar ou pleitear algo, sem impor ao verbo um caráter técnico ou agressivo.
- source_word: ἐννόμῳ
  choice: legalmente constituída
  rationale: No contexto cívico, indica uma assembleia realizada ou constituída em conformidade com a lei. A formulação esclarece esse valor sem sugerir apenas que o assunto discutido seja legal.
- source_word: ἐκκλησίᾳ
  choice: assembleia
  rationale: Aqui designa uma reunião cívica de Éfeso, não a comunidade cristã. “Assembleia” mantém o sentido público de um corpo reunido e evita a conotação eclesial de “igreja”.
- source_word: ἐπιλυθήσεται
  choice: será resolvida
  rationale: O futuro passivo indica que a questão receberá resolução pelo procedimento cívico apropriado.
- source_word: τι
  choice: alguma ... coisa
  rationale: O pronome indefinido, dentro da condição, refere-se de maneira aberta a qualquer questão adicional.
theological_decisions:
- issue: Tradução de ἐκκλησία em contexto cívico não cristão
  choice: assembleia
  alternative: igreja; reunião
  rationale: O referente é uma assembleia cívica legalmente constituída em Éfeso, e não a comunidade cristã. “Assembleia” preserva o sentido contextual sem introduzir conotações eclesiais enganosas.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural brasileiro amplamente compreensível. “Assembleia legalmente constituída” comunica o caráter cívico e regular da reunião sem transformar ἐκκλησία em termo judicial técnico.
