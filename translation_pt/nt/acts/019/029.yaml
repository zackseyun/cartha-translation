review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a cidade tomada pela confusão, a corrida coletiva ao teatro, a apreensão violenta de Gaio e Aristarco e a identificação deles como macedônios e companheiros de viagem de Paulo. Contudo, «todos» pode afirmar uma totalidade que o grego não explicita; ὁμοθυμαδόν expressa ação conjunta, não necessariamente que cada habitante participou. «Se precipitaram» representa melhor o ímpeto de ὥρμησαν do que «correram».
  naturalness: O texto é claro e de registro moderno. A revisão mantém a fluência e elimina a possível generalização de «todos».
  terminology: «Confusão», «teatro», «Gaio», «Aristarco», «macedônios» e «companheiros de viagem de Paulo» são escolhas adequadas, naturais e fiéis. «Arrastando consigo» comunica bem a tomada à força e o deslocamento indicado por συναρπάσαντες.
  issues:
