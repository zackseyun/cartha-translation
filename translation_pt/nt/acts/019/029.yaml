  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: pt
  text: E a cidade ficou cheia de confusão, e eles se precipitaram juntos para o teatro, arrastando consigo Gaio e Aristarco, macedônios que eram companheiros de viagem de Paulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: a cidade ficou cheia de confusão
  rationale: Preserva a construção passiva e o sentido de desordem caótica, em português natural.
- source_word: ὥρμησάν τε
  choice: e ... correram
  rationale: Expressa o movimento súbito e impetuoso da multidão sem acrescentar violência além do que o verbo indica.
- source_word: ὁμοθυμαδόν
  choice: todos ... juntos
  rationale: Neste contexto, comunica a ação coletiva da multidão, sem a conotação positiva que 'de comum acordo' poderia sugerir.
- source_word: εἰς τὸ θέατρον
  choice: para o teatro
  rationale: Tradução direta; o termo grego não exige o mais específico 'anfiteatro'.
- source_word: συναρπάσαντες
  choice: arrastando consigo
  rationale: Retrata tanto a apreensão à força quanto o deslocamento de Gaio e Aristarco com a multidão rumo ao teatro.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: Gaio e Aristarco
  rationale: Formas tradicionais e reconhecíveis dos nomes em português.
- source_word: Μακεδόνας
  choice: macedônios
  rationale: Mantém de modo conciso a identificação geográfica dos dois homens.
- source_word: συνεκδήμους Παύλου
  choice: companheiros de viagem de Paulo
  rationale: Expressão idiomática que comunica serem pessoas que viajavam com Paulo fora de sua terra.
