id: ACT.19.17
reference: Acts 19:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: pt
  text: Isso se tornou conhecido de todos os judeus e gregos que moravam em Éfeso. O temor caiu sobre todos eles, e o nome do Senhor Jesus era engrandecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era exaltado” ou “era tido em grande honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Isso
  rationale: O demonstrativo singular retoma o episódio anterior de modo natural em português, sem explicitar além do texto.
- source_word: ἐγένετο γνωστὸν
  choice: se tornou conhecido
  rationale: Reproduz o sentido incoativo da construção com γίνομαι e permanece idiomático em português atual.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: de todos os judeus e gregos
  rationale: Com 'conhecido', o português pede naturalmente a preposição 'de'; a formulação mantém os dois grupos e o alcance de πᾶσιν.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: que moravam em Éfeso
  rationale: Traduz κατοικέω em linguagem corrente e deixa claro que o modificador se aplica aos judeus e aos gregos.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: o temor caiu sobre todos eles
  rationale: Preserva a metáfora vívida de ἐπιπίπτω e traduz φόβος pela opção ampla 'temor', adequada tanto ao medo quanto à reverência solene.
- source_word: ἐμεγαλύνετο
  choice: era engrandecido
  rationale: O imperfeito passivo apresenta uma ação contínua ou reiterada; 'era engrandecido' conserva a imagem verbal sem reduzi-la apenas a reputação.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Mantém o termo expresso no grego e sua ressonância bíblica de honra, autoridade e reputação.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Traduz κύριος como título cristológico por 'Senhor' e preserva a relação genitiva com 'nome'.
theological_decisions:
- issue: Sentido de φόβος na reação dos habitantes
  choice: temor
  alternative: medo; reverência
  rationale: O contexto permite desde medo diante do poder demonstrado até reverência solene. 'Temor' preserva essa amplitude sem decidir indevidamente entre as nuances.
- issue: Tradução de κύριος em referência a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: Neste contexto, κύριος funciona como título cristológico; 'Senhor' preserva seu uso bíblico e teológico sem paráfrase.
- issue: Sentido de τὸ ὄνομα e ἐμεγαλύνετο
  choice: o nome do Senhor Jesus era engrandecido
  alternative: o nome do Senhor Jesus era exaltado; o nome do Senhor Jesus era muito honrado
  rationale: A formulação mantém 'nome' e a metáfora de μεγαλύνω, preservando a dimensão pública de honra sem substituir o texto por uma explicação como 'reputação'.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A divisão em duas frases reduz a extensão sem alterar as relações do grego. 'Moravam' é corrente; 'temor' e 'engrandecido' preservam o registro bíblico sem arcaísmo excessivo.
