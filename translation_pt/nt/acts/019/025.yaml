  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: pt
  text: 'Ele os reuniu, juntamente com os trabalhadores envolvidos em atividades desse tipo, e disse: “Homens, vocês sabem que é deste negócio que vem a nossa prosperidade.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é deste ofício que vem a nossa riqueza”.'
    reason: Registra alternativas legítimas para ἐργασία (“ofício”) e εὐπορία (“riqueza”), preservando a nuance econômica da expressão.
lexical_decisions:
- source_word: οὓς συναθροίσας
  choice: Ele os reuniu
  rationale: O particípio aoristo indica uma ação anterior à fala. A formulação explicita naturalmente o sujeito já presente no contexto e mantém o pronome relativo grego por meio de “os”.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: os trabalhadores envolvidos em atividades desse tipo
  rationale: Mantém o sentido amplo de ἐργάτας e da expressão περὶ τὰ τοιαῦτα, sem limitar indevidamente o grupo apenas a artesãos ou fabricantes de santuários.
- source_word: Ἄνδρες
  choice: Homens
  rationale: Reproduz a forma vocativa masculina de ἀνήρ de maneira direta e compreensível.
- source_word: ἐπίστασθε
  choice: vocês sabem
  rationale: Expressa de modo natural o conhecimento que os ouvintes já possuem.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: é deste negócio que vem
  rationale: Neste contexto comercial, “negócio” comunica melhor a atividade econômica, enquanto a construção enfática preserva a origem indicada por ἐκ.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: a nossa prosperidade
  rationale: εὐπορία denota prosperidade ou boa condição financeira; a expressão possessiva em português representa naturalmente o dativo ἡμῖν.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” evita regionalismo excessivo; “Homens” conserva a forma de tratamento masculina do texto grego.
