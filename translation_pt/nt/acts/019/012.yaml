id: ACT.19.12
reference: Acts 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: pt
  text: de modo que até lenços ou aventais de trabalho eram levados de junto de sua pele aos enfermos, e as doenças os deixavam, e os espíritos malignos saíam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado dos milagres extraordinários mencionados no versículo anterior, preservando o valor consecutivo.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: aos enfermos
  rationale: Expressa de modo conciso e natural o destino dos objetos levados.
- source_word: ἀποφέρεσθαι
  choice: eram levados
  rationale: Preserva o movimento dos objetos desde Paulo até os enfermos sem tornar pesada a expressão em português.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: que haviam tocado sua pele
  rationale: χρώς designa literalmente a pele ou superfície do corpo; a construção explicita de maneira natural em português que os objetos eram retirados do contato com Paulo.
- source_word: σουδάρια
  choice: lenços
  rationale: Designa panos usados para enxugar o rosto ou o suor; 'lenços' é uma equivalência atual e clara.
- source_word: σιμικίνθια
  choice: aventais de trabalho
  rationale: Refere-se a aventais ou peças usadas no trabalho manual; a especificação evita a imagem de um simples avental doméstico.
- source_word: ἀπαλλάσσεσθαι
  choice: os deixavam
  rationale: Com 'doenças' como sujeito, comunica naturalmente a ideia de afastamento ou libertação.
- source_word: νόσους
  choice: doenças
  rationale: Equivalente direto e corrente para enfermidades físicas.
- source_word: πνεύματα τὰ πονηρά
  choice: os espíritos malignos
  rationale: Preserva a referência definida a seres espirituais hostis, em linguagem bíblica natural.
- source_word: ἐκπορεύεσθαι
  choice: saíam
  rationale: É a formulação direta e idiomática para a saída dos espíritos das pessoas afetadas.
theological_decisions:
- issue: Natureza das curas e expulsões de espíritos associadas aos objetos levados de Paulo
  choice: Narrar diretamente o acontecimento sobrenatural, sem explicar o mecanismo.
  alternative: Acrescentar linguagem que sugira veneração de relíquias, eficácia sacramental dos objetos ou mero simbolismo.
  rationale: O texto relata o resultado sem formular uma doutrina sobre os objetos. A tradução não deve ampliar nem atenuar a afirmação narrativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A expressão 'que haviam tocado sua pele' conserva a precisão de χρώς e evita a formulação pouco natural 'levados de sua pele'.
