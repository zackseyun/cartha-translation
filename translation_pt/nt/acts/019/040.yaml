  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: pt
  text: Pois corremos o risco de ser acusados de sedição por causa do que aconteceu hoje[a], já que não há motivo algum que justifique isso, e não poderemos dar explicações sobre este tumulto[b]. Depois de dizer isso, ele dispensou a assembleia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de revolta” ou “de insurreição”. O termo grego pode indicar uma grave agitação civil; neste contexto, trata-se do tumulto público ocorrido naquele dia.
    reason: lexical_alternative
  - marker: b
    text: Ou “aglomeração tumultuada”. O termo grego se refere a esta reunião desordeira e é diferente da palavra mais formal traduzida por “assembleia” no fim do versículo.
    reason: lexical_alternative
  - marker: c
    text: A palavra traduzida por “assembleia” é a mesma frequentemente traduzida por “igreja” em outras passagens, mas aqui designa a assembleia cívica de Éfeso.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: corremos o risco
  rationale: Expressa naturalmente em português o perigo presente indicado pelo verbo no presente.
- source_word: ἐγκαλεῖσθαι
  choice: ser acusados
  rationale: Preserva o sentido jurídico de responder a uma acusação perante as autoridades.
- source_word: στάσεως
  choice: de sedição
  rationale: Mantém a gravidade cívico-jurídica do termo, que pode designar agitação pública ou levante contra a ordem, sem decidir que houve efetivamente uma insurreição.
- source_word: περὶ τῆς σήμερον
  choice: por causa do que aconteceu hoje
  rationale: Torna idiomática a construção grega elíptica e identifica o incidente daquele dia.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: já que não há motivo algum que justifique isso
  rationale: Representa o genitivo absoluto e a ausência de fundamento legítimo para a desordem.
- source_word: ἀποδοῦναι λόγον
  choice: dar explicações
  rationale: Equivalente português natural para a expressão que significa prestar contas ou apresentar uma justificativa.
- source_word: συστροφῆς
  choice: tumulto
  rationale: Designa a aglomeração turbulenta e a desordem resultante, distinguindo-a da assembleia mencionada em seguida.
- source_word: ἐκκλησίαν
  choice: assembleia
  rationale: No contexto, refere-se à reunião cívica em Éfeso, não à igreja.
- source_word: ἀπέλυσεν
  choice: dispensou
  rationale: É a formulação natural para encerrar uma reunião e mandar os presentes embora.
- source_word: καὶ γὰρ
  choice: Pois até
  rationale: Conserva tanto a ligação explicativa quanto a ênfase da combinação grega.
