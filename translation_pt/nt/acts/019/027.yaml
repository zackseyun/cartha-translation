  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: pt
  text: E não somente este nosso ramo de atividade corre o risco de cair em descrédito, mas também o templo da grande deusa Ártemis pode vir a ser considerado como nada, e até a majestade[b] de Ártemis — a quem toda a Ásia e o mundo[a] adoram — pode ser derrubada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mundo habitado”. O termo grego costuma se referir ao mundo povoado, especialmente ao âmbito mais amplo do Império Romano.
    reason: lexical_alternative
  - marker: b
    text: Ou “grandeza” ou “magnificência”. A expressão grega se refere à posição exaltada ou ao esplendor atribuídos a Ártemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: corre o risco
  rationale: Expressa de modo natural o perigo presente indicado pelo verbo, sem tornar o resultado inevitável.
- source_word: τὸ μέρος
  choice: este nosso ramo de atividade
  rationale: No contexto, refere-se ao setor profissional ou econômico dos artesãos, e não a uma parte abstrata.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: cair em descrédito
  rationale: Comunica a passagem a uma condição de reprovação e perda de reputação social e comercial.
- source_word: ἱερὸν
  choice: templo
  rationale: Designa aqui o célebre recinto sagrado de Ártemis em Éfeso; “templo” é claro e corrente.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ser considerado como nada
  rationale: 'Preserva a força avaliativa da expressão: ser tido como sem importância ou valor.'
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: pode ser derrubada
  rationale: Transmite a temida perda iminente de posição e grandeza, mantendo o valor modal do contexto de risco.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: a majestade daquela
  rationale: “Majestade” abrange a grandeza, o esplendor e a posição exaltada atribuídos a Ártemis; a reformulação torna inteligível a construção grega difícil.
- source_word: ὅλη ἡ Ἀσία
  choice: toda a Ásia
  rationale: Preserva a amplitude retórica e se refere à região ou província romana da Ásia.
- source_word: ἡ οἰκουμένη
  choice: o mundo
  rationale: É a forma portuguesa mais natural; a nota registra o sentido mais literal de mundo habitado, frequentemente ligado ao âmbito romano.
- source_word: σέβεται
  choice: adoram
  rationale: No contexto cultual, o verbo indica reverência religiosa ou adoração; o plural concorda naturalmente com o sujeito composto em português.
theological_decisions:
- issue: Linguagem religiosa pagã em discurso relatado
  choice: a grande deusa Ártemis ... que toda a Ásia e o mundo adoram
  alternative: a chamada grande deusa Ártemis ... que toda a Ásia e o mundo veneram
  rationale: O texto relata diretamente as palavras de Demétrio. Não se acrescenta um distanciamento como “chamada”, ausente do grego, nem se suaviza o caráter cultual do verbo.
- issue: Construção difícil sobre a perda da μεγαλειότης de Ártemis
  choice: a majestade ... pode ser derrubada
  alternative: ela pode ser destituída de sua majestade
  rationale: A formulação mantém a majestade ou grandeza como aquilo que sofre rebaixamento, de acordo com a construção transmitida, sem definir além do necessário se o foco é o status, o esplendor ou a própria figura cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a progressão retórica do perigo econômico para o religioso. Os marcadores [a] e [b] aparecem no texto principal e correspondem às respectivas notas.
