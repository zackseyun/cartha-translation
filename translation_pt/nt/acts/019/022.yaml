source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: pt
  text: Assim, depois de enviar à Macedônia dois dos que o serviam — Timóteo e Erasto —, ele próprio permaneceu algum tempo na Ásia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, no oeste da Ásia Menor, e não o continente moderno.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: depois de enviar
  rationale: O particípio aoristo expressa aqui uma ação anterior à do verbo principal; a formulação deixa clara a sequência e soa natural em português.
- source_word: δὲ
  choice: Assim
  rationale: A partícula funciona como conectivo narrativo leve, sem contraste forte; “Assim” dá continuidade natural ao relato.
- source_word: εἰς τὴν Μακεδονίαν
  choice: à Macedônia
  rationale: Com uma região como destino, “à Macedônia” expressa de modo idiomático em português o movimento indicado por εἰς.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: dois dos que o serviam
  rationale: Preserva a ideia verbal de serviço sem transformar os homens em ocupantes de um ofício e sem especificar além do grego a natureza desse serviço.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timóteo e Erasto
  rationale: Emprega as formas tradicionais e amplamente reconhecidas desses nomes em português.
- source_word: αὐτὸς
  choice: ele próprio
  rationale: Mantém a ênfase do pronome explícito e o contraste entre Paulo e os dois homens enviados.
- source_word: ἐπέσχεν χρόνον
  choice: permaneceu algum tempo
  rationale: Expressa naturalmente o sentido idiomático de ficar ou permanecer por certo período.
- source_word: εἰς τὴν Ἀσίαν
  choice: na Ásia
  rationale: 'Embora εἰς costume indicar movimento, com ἐπέσχεν χρόνον a expressão tem sentido locativo: Paulo permaneceu na Ásia.'
