  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: pt
  text: Se, portanto, Demétrio e os artesãos que estão com ele têm alguma queixa contra alguém, realizam-se sessões judiciais[a], e há procônsules[b]; que apresentem acusações uns contra os outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os tribunais estão em sessão”. A expressão grega refere-se a procedimentos judiciais oficialmente convocados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “há procônsules disponíveis/presentes”. O plural pode referir-se de modo geral ao cargo provincial ou à estrutura administrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Portanto, se
  rationale: Expressa de modo natural a transição inferencial de οὖν; μέν fica levemente refletido na estrutura condicional, sem tradução artificial isolada.
- source_word: Δημήτριος
  choice: Demétrio
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: os artesãos que estão com ele
  rationale: τεχνῖται designa trabalhadores especializados; a formulação preserva σὺν αὐτῷ sem tornar a relação mais específica que o grego.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: têm alguma queixa contra alguém
  rationale: O idioma tem sentido jurídico; “queixa” comunica uma reclamação passível de procedimento legal.
- source_word: ἀγοραῖοι ἄγονται
  choice: há sessões dos tribunais
  rationale: Comunica de maneira clara os procedimentos judiciais oficialmente convocados, evitando a tradução literal enganosa ligada a dias de mercado.
- source_word: ἀνθύπατοί εἰσιν
  choice: há procônsules
  rationale: Mantém o plural do texto grego e o título correto dos magistrados provinciais romanos, sem resolver a possível referência institucional.
- source_word: ἐγκαλείτωσαν
  choice: que apresentem acusações
  rationale: Expressa o sentido forense de formular acusações pelos canais jurídicos apropriados.
- source_word: ἀλλήλοις
  choice: uns contra os outros
  rationale: Preserva a reciprocidade e, em combinação com o verbo forense, a força adversativa da ação judicial.
