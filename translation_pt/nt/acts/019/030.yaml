  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: pt
  text: Mas, quando Paulo quis entrar no meio da assembleia[a], os discípulos não o deixaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entrar na assembleia» ou «entrar no meio da multidão». Neste contexto cívico, o grego δῆμος pode se referir ao corpo público reunido.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ
  choice: Mas, quando Paulo
  rationale: O nome é vertido pela forma portuguesa tradicional, e δέ introduz aqui uma leve contraposição em relação à ação da multidão no versículo anterior.
- source_word: βουλομένου
  choice: quis
  rationale: O genitivo absoluto expressa a intenção de Paulo; a construção com «quando» e o pretérito perfeito é natural em português narrativo.
- source_word: εἰσελθεῖν εἰς τὸν δῆμον
  choice: entrar no meio da assembleia
  rationale: εἰσέρχομαι indica entrada, enquanto δῆμος pode designar o corpo público reunido neste contexto cívico. «No meio da assembleia» comunica que Paulo pretendia entrar entre os reunidos.
- source_word: οὐκ εἴων αὐτὸν
  choice: não o deixaram
  rationale: O imperfeito de ἐάω retrata a oposição dos discípulos à tentativa ou intenção de Paulo; esta formulação é clara e idiomática.
- source_word: οἱ μαθηταί
  choice: os discípulos
  rationale: Preserva o sentido direto de μαθηταί sem acrescentar uma relação possessiva ausente do grego.
theological_decisions: []
