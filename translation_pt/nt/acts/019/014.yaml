  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: pt
  text: Havia sete filhos de um judeu chamado Ceva, chefe dos sacerdotes, e eles faziam isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sumo sacerdote». O termo grego pode referir-se ao sumo sacerdote ou, em sentido mais amplo, a um sacerdote principal ou membro da elite sacerdotal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Havia
  rationale: Expressa o imperfeito de εἰμί e introduz a informação de modo natural em português; o valor continuativo de δέ pode ficar implícito no fluxo narrativo, sem criar contraste indevido.
- source_word: τινος Σκευᾶ
  choice: de um judeu chamado Ceva
  rationale: O indefinido τις apresenta uma pessoa não especificada; «chamado Ceva» é idiomático e preserva essa indefinição.
- source_word: Ἰουδαίου
  choice: judeu
  rationale: Neste contexto, designa a identidade étnico-religiosa, não apenas a origem geográfica.
- source_word: ἀρχιερέως
  choice: chefe dos sacerdotes
  rationale: Evita afirmar sem necessidade que Ceva ocupava o cargo singular de sumo sacerdote, mas preserva o sentido possível de integrante ou figura principal da classe sacerdotal superior.
- source_word: ἑπτὰ υἱοὶ
  choice: sete filhos
  rationale: Tradução direta e natural do numeral com o substantivo.
- source_word: τοῦτο ποιοῦντες
  choice: que faziam isso
  rationale: A oração relativa reproduz naturalmente em português a ação contínua do particípio presente e remete ao procedimento descrito no contexto anterior.
theological_decisions:
- issue: Sentido de ἀρχιερεύς aplicado a Ceva
  choice: chefe dos sacerdotes
  alternative: sumo sacerdote
  rationale: O termo grego pode designar o sumo sacerdote ou, de modo mais amplo, um sacerdote principal ou membro da elite sacerdotal. Como Ceva não é conhecido como ocupante do cargo singular, a tradução principal evita uma identificação histórica possivelmente enganosa, enquanto a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Ceva» segue a forma tradicional portuguesa do nome. A colocação de «chefe dos sacerdotes» depois do nome reduz a possível leitura equivocada de que todos os judeus mencionados teriam esse título.
