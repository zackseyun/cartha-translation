id: ACT.19.26
reference: Acts 19:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: pt
  text: E vocês veem e ouvem que, não somente em Éfeso, mas em quase toda a Ásia[a], esse Paulo persuadiu e desviou uma multidão considerável, dizendo que os deuses feitos por mãos humanas[b] não são deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, situada na parte ocidental da atual Turquia.
    reason: Nota geográfica para evitar que “Ásia” seja entendida como o continente inteiro.
  - marker: b
    text: Literalmente, “os que vêm a existir por meio de mãos”; expressão que se refere a ídolos produzidos pelo trabalho humano.
    reason: Nota cultural e lexical que esclarece a expressão idiomática grega.
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: vocês veem e ouvem
  rationale: Mantém o duplo apelo retórico de Demétrio àquilo que seus ouvintes constatam de modo público e imediato.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: não somente em Éfeso, mas em quase toda a Ásia
  rationale: Explicita em português o sentido locativo da construção grega e traduz σχεδόν por “quase”, sem ampliar a afirmação.
- source_word: ὁ Παῦλος οὗτος
  choice: esse Paulo
  rationale: Conserva a força demonstrativa e levemente depreciativa da fala de Demétrio sem acrescentar insulto.
- source_word: πείσας μετέστησεν
  choice: persuadiu e desviou
  rationale: Preserva tanto a ação persuasiva quanto a mudança de posição provocada por Paulo, sem interpretar o verbo como simples engano.
- source_word: ἱκανὸν ὄχλον
  choice: uma multidão considerável
  rationale: Expressa a ideia de um grupo numeroso e significativo, mantendo a imagem coletiva de ὄχλος.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: os deuses feitos por mãos humanas
  rationale: Torna explícito o sentido idiomático de artefatos produzidos pelo trabalho humano, preservando o contraste entre fabricação humana e divindade.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: não são deuses
  rationale: Reproduz diretamente a negação do estatuto divino dos ídolos manufaturados, sem acrescentar qualificadores como “verdadeiros” ou “realmente”.
theological_decisions:
- issue: Negação do caráter divino dos ídolos manufaturados
  choice: os deuses feitos por mãos humanas não são deuses
  alternative: as coisas feitas por mãos humanas não são deuses
  rationale: A formulação escolhida preserva a construção retórica em que aquilo que é chamado de “deuses” tem sua divindade negada, sem ampliar a declaração para além do alvo imediato da fala.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação verbal e a repetição final de “deuses” conservam a contundência retórica do original.
