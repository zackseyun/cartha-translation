  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: pt
  text: 'Paulo disse: “João batizou com um batismo de arrependimento, dizendo ao povo que cressem naquele que viria depois dele, isto é, em Jesus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: batizou com um batismo de arrependimento
  rationale: Mantém de modo natural em português a construção cognata do grego e caracteriza o batismo de João pela relação com o arrependimento, sem acrescentar um efeito não declarado no texto.
- source_word: τῷ λαῷ
  choice: ao povo
  rationale: Reproduz o sentido coletivo de λαός sem especificar além do que a cláusula grega afirma.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio contemporâneo e introduz naturalmente o conteúdo da proclamação de João.
- source_word: ἵνα πιστεύσωσιν
  choice: que cresse
  rationale: No contexto de um verbo de fala, expressa a orientação dada por João; o singular concorda com o coletivo “povo” em português corrente.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: naquele que viria depois dele
  rationale: Com πιστεύω, εἰς indica o objeto da fé. A forma “viria” apresenta a vinda a partir da perspectiva histórica do ministério de João, e “depois dele” comunica sucessão.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Fórmula explicativa direta que identifica aquele que viria depois de João.
- source_word: εἰς τὸν Ἰησοῦν
  choice: em Jesus
  rationale: Retoma de modo idiomático o verbo crer e conserva apenas o nome presente no grego, sem acrescentar um título.
theological_decisions:
- issue: Relação entre o batismo de João e a fé em Jesus
  choice: O batismo de João é descrito como batismo de arrependimento e acompanhado da orientação para crer naquele que viria, identificado como Jesus.
  alternative: Entender que o próprio batismo de João produzia a fé cristã ou deixar sem identificação aquele que viria.
  rationale: A sintaxe distingue o ato de batizar da mensagem que o acompanhava e identifica explicitamente Jesus como aquele que viria depois de João, sem formular uma doutrina adicional sobre a eficácia do batismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção cognata “batizou com um batismo” foi preservada porque é clara em português e mantém a transparência formal do original. Não foram necessárias notas de rodapé.
