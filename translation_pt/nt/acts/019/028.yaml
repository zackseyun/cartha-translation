  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: pt
  text: 'Ao ouvirem isso, ficaram cheios de ira[a] e gritavam: “Grande é Ártemis dos efésios!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cheios de raiva”, “tomados de fúria” ou “furiosos”. A expressão grega significa literalmente “ficarem cheios de θυμός”, termo que indica raiva intensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo apresenta a circunstância anterior à ação principal; “isso” explicita naturalmente o objeto subentendido pelo contexto.
- source_word: δὲ
  choice: e
  rationale: Aqui funciona como conectivo leve, sem contraste forte; a coordenação em português preserva o fluxo da frase.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: ficarem cheios de ira
  rationale: Preserva a construção de tornar-se cheio e comunica a intensidade de θυμός em português natural e digno.
- source_word: θυμοῦ
  choice: ira
  rationale: O termo denota raiva intensa, furor ou cólera; “ira” mantém a força do original sem soar excessivamente coloquial.
- source_word: ἔκραζον
  choice: começaram a gritar
  rationale: No contexto, o imperfeito descreve a gritaria em curso desencadeada pela reação anterior; esta formulação é natural em português, embora não explicite tão diretamente a duração quanto “gritavam”.
- source_word: λέγοντες
  choice: introdução direta da fala após dois-pontos
  rationale: O conteúdo do particípio é expresso idiomaticamente pelos dois-pontos, evitando o redundante “gritar, dizendo”.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Grande é Ártemis dos efésios!
  rationale: Mantém a ordem enfática e o caráter de aclamação, além de reproduzir o genitivo plural que associa a deusa aos efésios.
- source_word: Ἄρτεμις
  choice: Ártemis
  rationale: Forma portuguesa consagrada do nome próprio grego, com acentuação adequada.
- source_word: Ἐφεσίων
  choice: dos efésios
  rationale: Traduz com precisão o adjetivo gentílico no genitivo plural substantivado, em vez de substituir por “de Éfeso”.
theological_decisions:
- issue: Relatar uma aclamação pagã sem sugerir endosso teológico
  choice: “Grande é Ártemis dos efésios!”
  alternative: “Ártemis dos efésios é grande!”
  rationale: A fala é preservada como aclamação direta da multidão, sem atenuar seu conteúdo nem acrescentar qualquer avaliação do tradutor.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Grande é...” conserva o tom enfático de um cântico coletivo. O marcador [a] aparece no texto principal.
