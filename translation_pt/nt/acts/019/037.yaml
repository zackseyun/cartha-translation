  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: pt
  text: Pois vocês trouxeram para cá estes homens, que não são ladrões de templos nem blasfemam contra a nossa deusa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz «nossa deusa»; a expressão refere-se a Ártemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: vocês trouxeram para cá
  rationale: O aoristo de ἄγω apresenta a ação realizada; em português, o pretérito perfeito simples é natural. «Para cá» explicita de modo idiomático o movimento até a assembleia.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a justificativa da declaração anterior e preserva a função explicativa do grego.
- source_word: τοὺς ἄνδρας τούτους
  choice: estes homens
  rationale: ἀνήρ designa aqui homens, e o demonstrativo mantém a referência direta às pessoas presentes.
- source_word: οὔτε ... οὔτε
  choice: não são nem ... nem
  rationale: Reproduz com naturalidade a negação correlativa, ajustada às duas construções predicativas em português.
- source_word: ἱεροσύλους
  choice: ladrões de templos
  rationale: O termo se refere concretamente a quem rouba templos ou bens sagrados; esta formulação é clara e adequada ao contexto jurídico público.
- source_word: βλασφημοῦντας
  choice: blasfemam contra
  rationale: O particípio presente indica a prática ou ação de falar de modo ultrajante contra a divindade; a forma verbal é mais natural em português do que o substantivo «blasfemadores».
- source_word: τὴν θεὸν ἡμῶν
  choice: a nossa deusa
  rationale: Embora θεός tenha a forma lexical usualmente traduzida por «deus», o artigo e o contexto apontam para Ártemis, divindade feminina; «deusa» comunica corretamente o referente em português.
theological_decisions:
- issue: Tradução de θεὸν ἡμῶν em referência a Ártemis
  choice: a nossa deusa
  alternative: o nosso deus
  rationale: O oficial efésio pagão se refere a Ártemis. «Deusa» preserva o sentido contextual e evita sugerir uma referência ao Deus de Israel; trata-se de identificação lexical do referente, não de endosso teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» representa naturalmente a segunda pessoa do plural dirigida à assembleia. A coordenação «não são nem ladrões de templos nem blasfemam» conserva as duas acusações, embora mude de construção nominal para verbal a fim de refletir o particípio grego com naturalidade.
