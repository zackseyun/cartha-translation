  naturalness: «Pois vocês trouxeram para cá estes homens» é natural e adequado ao registro. A coordenação original, «não são nem ladrões de templos nem blasfemam», é compreensível, mas combina de modo um pouco irregular um predicativo nominal com um verbo finito. A revisão torna a estrutura mais fluida sem alterar o sentido.
