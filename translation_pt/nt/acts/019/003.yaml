base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: pt
  text: 'E ele disse: “Então, em que vocês foram batizados?” Eles responderam: “No batismo de João.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: E ele disse
  rationale: λέγω significa diretamente “dizer”, e τε estabelece uma ligação leve com o contexto anterior; “E” conserva essa continuidade narrativa sem dar peso excessivo à conjunção.
- source_word: Εἰς τί
  choice: em que
  rationale: A construção mantém a preposição εἰς e é natural em português no contexto da identificação batismal. Evita reduzi-la a uma pergunta apenas sobre finalidade.
- source_word: οὖν
  choice: então
  rationale: οὖν introduz a consequência lógica da resposta anterior. “Então” expressa essa inferência com naturalidade no diálogo.
- source_word: ἐβαπτίσθητε
  choice: vocês foram batizados
  rationale: Preserva a forma passiva do aoristo de βαπτίζω e usa a expressão corrente e precisa em português.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: No batismo de João
  rationale: “No” é a contração natural de “em o” e corresponde à repetição de εἰς na resposta. O genitivo Ἰωάννου é expresso com clareza por “de João”.
- source_word: βάπτισμα
  choice: batismo
  rationale: É o equivalente estabelecido e adequado para o rito associado a João, sem necessidade de paráfrase interpretativa.
theological_decisions:
- issue: Preservação da repetição de εἰς na pergunta e na resposta
  choice: Traduzir por “em que” e “no batismo de João”
  alternative: 'Traduzir de modo mais livre: “Que batismo vocês receberam?” / “O batismo de João”'
  rationale: A escolha preserva o paralelismo grego e a ideia de identificação envolvida no batismo, sem impor uma interpretação denominacional específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem do diálogo e o paralelismo do original foram preservados.
