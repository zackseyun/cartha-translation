base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: pt
  text: Naquele tempo, surgiu uma agitação nada pequena a respeito do Caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do caminho”. Aqui, a expressão se refere ao movimento cristão, uma designação recorrente em Atos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: surgiu
  rationale: O verbo introduz a ocorrência de um acontecimento; “surgiu” preserva sua força eventiva e soa natural em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ é um conector narrativo leve. A sequência já é natural em português sem acrescentar “então”, “ora” ou “mas”, que poderiam sugerir uma nuance mais forte.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Naquele tempo
  rationale: Expressão temporal clara e corrente, correspondente a “naquele tempo/período”.
- source_word: τάραχος
  choice: agitação
  rationale: Designa perturbação ou tumulto sem antecipar a caracterização mais específica dos acontecimentos como motim ou revolta.
- source_word: οὐκ ὀλίγος
  choice: nada pequena
  rationale: Conserva a litotes de Lucas, em vez de simplificá-la como “grande” ou “considerável”, e concorda naturalmente com “agitação”.
- source_word: περὶ
  choice: a respeito de
  rationale: Com o genitivo, indica o assunto ou motivo em torno do qual ocorreu a agitação.
- source_word: τῆς ὁδοῦ
  choice: do Caminho
  rationale: Em Atos, a expressão funciona repetidamente como designação do movimento cristão; a inicial maiúscula sinaliza esse uso sem acrescentar conteúdo doutrinário.
theological_decisions:
- issue: Tratar τῆς ὁδοῦ como designação do movimento cristão
  choice: do Caminho
  alternative: do caminho
  rationale: O contexto e o uso recorrente em Atos indicam uma designação reconhecível do movimento cristão. A capitalização ajuda o leitor moderno a perceber essa referência, preservando a possibilidade lexical indicada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação preserva a litotes grega e evita intensificar prematuramente τάραχος como “motim” ou “revolta”.
