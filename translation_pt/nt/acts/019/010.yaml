id: ACT.19.10
reference: Acts 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: pt
  text: Isso continuou por dois anos, de modo que todos os que moravam na Ásia[a] ouviram a palavra do Senhor, tanto judeus como gregos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a província romana da Ásia, no oeste da Ásia Menor, e não o atual continente asiático.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Isso continuou
  rationale: Embora a expressão possa significar literalmente «isso aconteceu», o contexto retoma a atividade contínua de ensino do versículo anterior; «continuou» comunica naturalmente sua duração.
- source_word: ἐπὶ ἔτη δύο
  choice: por dois anos
  rationale: ἐπί com acusativo temporal indica duração; esta é a formulação corrente em português.
- source_word: ὥστε
  choice: de modo que
  rationale: Preserva a força resultativa da conjunção sem sugerir necessariamente propósito.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: todos os que moravam na Ásia
  rationale: Reproduz o alcance universal de πάντας e o sentido do particípio substantivado κατοικοῦντας em linguagem natural.
- source_word: ἀκοῦσαι
  choice: ouviram
  rationale: Expressa diretamente o resultado introduzido por ὥστε, sem acrescentar uma nuance como «vieram a ouvir».
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém a terminologia recorrente de Lucas para a mensagem proclamada e sua textura teológica, em vez de explicitar «mensagem».
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O genitivo modifica naturalmente «a palavra»; «Senhor» é a equivalência portuguesa estabelecida para κύριος neste contexto.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: tanto judeus como gregos
  rationale: A construção inclusiva reproduz τε καὶ e preserva a abrangência entre judeus e gregos destacada em Atos.
theological_decisions:
- issue: Sentido de «Ásia»
  choice: A província romana da Ásia, no oeste da Ásia Menor
  alternative: O continente asiático ou uma região continental mais ampla
  rationale: Em Atos, Ἀσία designa regularmente a província romana. O texto mantém o nome próprio, e a nota evita uma leitura anacrônica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Isso continuou» liga o versículo ao ensino descrito anteriormente; «de modo que» conserva a relação de resultado. O marcador [a] foi colocado imediatamente após «Ásia», o termo que a nota esclarece.
