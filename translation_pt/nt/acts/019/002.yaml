base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: pt
  text: 'Então lhes perguntou[a]: “Vocês receberam o Espírito Santo quando creram?” Eles lhe responderam: “Não[b]; nem sequer ouvimos dizer que existe o Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês receberam o Espírito Santo depois de crerem?” O particípio grego pode ser entendido com uma nuance temporal um pouco diferente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem sequer ouvimos dizer se existe o Espírito Santo”; ou, de modo mais interpretativo: “nem sequer ouvimos dizer que o Espírito Santo foi dado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Então lhes perguntou
  rationale: Embora λέγω signifique literalmente “dizer”, o conteúdo é interrogativo, e “perguntou” é a forma natural em português. A partícula τε faz uma ligação leve com a narrativa anterior, aqui expressa por “Então”.
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: Vocês receberam o Espírito Santo quando creram?
  rationale: O particípio aoristo πιστεύσαντες admite nuance temporal sem determinar por si só uma sequência rígida. “Quando creram” preserva essa flexibilidade melhor que “depois de crerem”.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: Neste contexto, a expressão designa o Espírito de Deus. O artigo e as iniciais maiúsculas correspondem ao uso português corrente para a referência pessoal.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Eles lhe responderam
  rationale: O verbo é subentendido no grego a partir da fala anterior. “Responderam” expressa naturalmente a réplica, enquanto δέ marca apenas a progressão ou leve contraste.
- source_word: Ἀλλ’ οὐδ’
  choice: Não; nem sequer
  rationale: A combinação introduz uma negação enfática. Em português, “Não; nem sequer” reproduz com naturalidade a resposta e o reforço negativo.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: nem sequer ouvimos dizer que existe Espírito Santo
  rationale: A construção οὐδὲ εἰ pode ser entendida como “nem sequer que” ou “nem sequer se”. A tradução principal segue a leitura direta sem acrescentar a ideia interpretativa de que o Espírito “foi dado”.
theological_decisions:
- issue: Relação temporal entre crer e receber o Espírito Santo
  choice: “quando creram”
  alternative: “depois de crerem”
  rationale: O particípio πιστεύσαντες estabelece uma relação temporal, mas não define sozinho se o recebimento foi simultâneo ou subsequente. A redação escolhida preserva essa tensão; a alternativa fica registrada em nota.
- issue: Sentido do desconhecimento dos discípulos a respeito do Espírito Santo
  choice: “nem sequer ouvimos dizer que existe Espírito Santo”
  alternative: “nem sequer ouvimos dizer se existe Espírito Santo” ou, interpretativamente, “nem sequer ouvimos dizer que o Espírito Santo foi dado”
  rationale: A frase grega é concisa e admite mais de uma compreensão. A tradução principal mantém o sentido mais direto, sem inserir a noção de concessão ou derramamento, que não está explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural sem regionalismo excessivo. A ordem e a pontuação foram ajustadas à fluidez do diálogo em português, preservando as ambiguidades relevantes em notas.
