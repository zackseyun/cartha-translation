  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: pt
  text: E o homem em quem estava o espírito mau saltou sobre eles[a] e, depois de dominar ambos[b], mostrou-se mais forte do que eles, de modo que fugiram daquela casa nus e feridos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «lançou-se sobre eles» ou «atirou-se sobre eles».
    reason: lexical_alternative
  - marker: b
    text: O grego diz explicitamente «ambos». Embora o contexto mais amplo mencione mais de dois filhos de Ceva, a tradução preserva essa tensão textual.
    reason: textual_or_narrative_tension
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: saltou sobre
  rationale: O particípio descreve um ataque físico súbito, como um salto ou bote; «saltou sobre» preserva a vivacidade e soa natural em português.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: O substantivo é masculino singular e se refere ao indivíduo mencionado no contexto.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: em quem estava o espírito mau
  rationale: Mantém a formulação locativa do grego sem introduzir terminologia técnica posterior.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: o espírito mau
  rationale: «Mau» expressa claramente o caráter maligno do espírito e corresponde de modo direto ao adjetivo grego.
- source_word: κατακυριεύσας
  choice: dominando
  rationale: O verbo indica obter domínio ou controle sobre alguém; «dominando» evita repetir a ideia de força expressa na oração seguinte.
- source_word: ἀμφοτέρων
  choice: ambos
  rationale: O grego afirma explicitamente «ambos», referência a dois, apesar da tensão com o contexto mais amplo.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: mostrou-se mais forte do que eles
  rationale: Expressa de maneira natural a ideia de prevalecer contra eles ou ser mais forte, sem fundi-la com o particípio anterior.
- source_word: γυμνούς
  choice: nus
  rationale: Traduz diretamente o estado resultante indicado pelo adjetivo, sem inferir como perderam as roupas.
- source_word: τετραυματισμένους
  choice: feridos
  rationale: O particípio perfeito indica que foram feridos e permaneceram nessa condição.
- source_word: ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου
  choice: fugiram daquela casa
  rationale: Comunica tanto a fuga quanto a saída da casa em português corrente e conciso.
theological_decisions:
- issue: Linguagem sobre a presença do espírito mau no homem
  choice: o homem em quem estava o espírito mau
  alternative: o homem possuído pelo espírito mau
  rationale: A escolha acompanha a descrição do grego, segundo a qual o espírito estava no homem, sem impor uma expressão técnica não presente no texto.
- issue: Alcance de ἀμφοτέρων diante da menção contextual de vários filhos de Ceva
  choice: ambos
  alternative: todos eles
  rationale: O texto grego disponível diz explicitamente «ambos». A tradução conserva essa dificuldade narrativa em vez de harmonizá-la silenciosamente com o contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos acontecimentos segue o grego, e a repetição semântica entre dominar e mostrar-se mais forte é preservada sem se tornar pesada.
