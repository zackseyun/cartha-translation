  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: pt
  text: E Deus realizava milagres extraordinários pelas mãos de Paulo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “obras de poder que não eram comuns”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: milagres
  rationale: No plural e neste contexto narrativo de Atos, o termo designa feitos concretos de poder; “milagres” comunica esse sentido com clareza em português atual.
- source_word: τε
  choice: E
  rationale: A partícula liga a afirmação à narrativa anterior; a conjunção simples preserva essa continuidade de modo natural.
- source_word: οὐ τὰς τυχούσας
  choice: extraordinários
  rationale: A expressão idiomática significa literalmente “não comuns” ou “não quaisquer”; “extraordinários” transmite sua força enfática sem tornar a frase artificial.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Deus é o sujeito gramatical explícito, e a tradução mantém em destaque sua ação.
- source_word: ἐποίει
  choice: realizava
  rationale: O imperfeito indica ação contínua ou repetida no passado; “realizava” preserva esse aspecto e combina naturalmente com “milagres”.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: pelas mãos de Paulo
  rationale: A expressão preserva o idioma concreto do grego e apresenta Paulo como o instrumento por meio do qual Deus agia.
- source_word: Παύλου
  choice: Paulo
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions:
- issue: Agência na realização dos milagres
  choice: Deus é apresentado como aquele que realizava os milagres, tendo Paulo como instrumento.
  alternative: Paulo realizava os milagres.
  rationale: O grego traz ὁ θεὸς como sujeito de ἐποίει, enquanto διὰ τῶν χειρῶν Παύλου expressa mediação instrumental. A tradução conserva essa distinção sem atribuir a Paulo poder independente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Realizava milagres” soa natural, enquanto “pelas mãos de Paulo” conserva a imagem e a agência mediada do original.
