id: ACT.19.33
reference: Acts 19:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: pt
  text: Alguns da multidão fizeram Alexandre avançar[a], pois os judeus o haviam empurrado para a frente. Então Alexandre, fazendo sinal com a mão, queria apresentar sua defesa diante da assembleia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alguns da multidão apresentaram Alexandre, depois que os judeus o puseram à frente”. O grego usa dois verbos relacionados para descrever Alexandre sendo levado publicamente para a frente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao povo”. O termo grego tem aqui sentido público-cívico e é diferente da palavra traduzida por “multidão” no início do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: fizeram Alexandre avançar
  rationale: No contexto, o verbo descreve Alexandre sendo levado ou feito avançar para fora da multidão, a fim de aparecer publicamente; a formulação é natural em português e evita o sentido inadequado de instruir.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: pois os judeus o haviam empurrado para a frente
  rationale: O genitivo absoluto explica como Alexandre foi destacado. A expressão comunica iniciativa e pressão situacional sem necessariamente sugerir violência física.
- source_word: κατασείσας τὴν χεῖρα
  choice: fazendo sinal com a mão
  rationale: Preserva o gesto destinado a chamar a atenção, sem explicitar que era para pedir silêncio, finalidade provável mas não declarada.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: queria apresentar sua defesa
  rationale: Mantém a intenção não consumada e o caráter público ou formal de ἀπολογεῖσθαι.
- source_word: τῷ δήμῳ
  choice: diante da assembleia
  rationale: Expressa o sentido público-cívico de δῆμος e o distingue de ὄχλος, a multidão mencionada antes.
- source_word: ὄχλου
  choice: multidão
  rationale: É a forma corrente e natural para a massa geral de pessoas, em contraste com a assembleia pública no fim do versículo.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alexandre
  rationale: Emprega a forma portuguesa convencional do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Fizeram Alexandre avançar” e “empurrado para a frente” reproduzem a repetição sem soar excessivamente literal; “assembleia” preserva a distinção lexical e cívica em relação a “multidão”.
