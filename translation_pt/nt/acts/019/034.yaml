  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: pt
  text: 'Mas, quando perceberam que ele era judeu[a], todos gritaram em uma só voz por cerca de duas horas: “Grande é Ártemis dos efésios!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeano”. O termo grego pode designar tanto um judeu como alguém da Judeia; aqui, o sentido étnico-religioso mais amplo é mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: quando perceberam
  rationale: O particípio aoristo indica uma percepção anterior à reação da multidão; a construção temporal é natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca a virada adversativa em relação à tentativa anterior de Alexandre falar.
- source_word: Ἰουδαῖός
  choice: judeu
  rationale: No contexto da diáspora em Éfeso, designa mais provavelmente a identidade étnico-religiosa, não apenas a origem geográfica na Judeia.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: todos começaram a gritar a uma só voz
  rationale: Reproduz de modo idiomático a imagem de uma única voz procedente de todos e comunica a unidade do clamor.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: durante cerca de duas horas
  rationale: ὡς diante de uma medida indica aproximação.
- source_word: κραζόντων
  choice: começaram a gritar ... durante
  rationale: O clamor contínuo expresso pelo particípio presente é comunicado pela combinação do verbo com a indicação de duração.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Grande é Ártemis dos efésios!
  rationale: Mantém a ordem enfática da aclamação e traduz o genitivo como associação com os habitantes de Éfeso.
theological_decisions:
- issue: Sentido de Ἰουδαῖος
  choice: judeu
  alternative: judeano
  rationale: A reação da multidão parece decorrer da identidade étnico-religiosa de Alexandre; ainda assim, a nota preserva a alternativa geográfica possível.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A formulação “a uma só voz” conserva a unidade enfática do clamor sem reproduzir rigidamente o idioma grego.
