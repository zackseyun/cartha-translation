id: ACT.19.21
reference: Acts 19:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: pt
  text: 'Depois que essas coisas se completaram, Paulo resolveu, no Espírito[a], ir a Jerusalém depois de passar pela Macedônia e pela Acaia, dizendo: “Depois que eu estiver lá, preciso também ver Roma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu espírito”. A expressão grega pode se referir tanto à resolução interior do próprio Paulo quanto à orientação do Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: se completaram
  rationale: O passivo indica que os acontecimentos anteriores chegaram à sua conclusão, sem sugerir necessariamente o cumprimento de uma profecia.
- source_word: ἔθετο
  choice: resolveu
  rationale: O uso de τίθημι na voz média expressa uma determinação deliberada tomada pelo próprio Paulo.
- source_word: ἐν τῷ πνεύματι
  choice: no Espírito
  rationale: A forma principal entende a expressão como referência ao Espírito Santo, uso coerente com o papel do Espírito em Lucas–Atos; a ambiguidade do grego é mantida em nota.
- source_word: διελθὼν
  choice: depois de passar
  rationale: O particípio aoristo indica que Paulo passaria pela Macedônia e pela Acaia antes de ir a Jerusalém.
- source_word: πορεύεσθαι
  choice: ir
  rationale: Verbo amplo de deslocamento, traduzido de modo simples e natural.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Depois que eu estiver lá
  rationale: Expressa de modo idiomático a presença de Paulo em Jerusalém antes da etapa seguinte, sem especificar quanto tempo permaneceria ali.
- source_word: δεῖ
  choice: preciso
  rationale: Comunica necessidade ou propósito imperioso; no contexto de Lucas–Atos, essa necessidade pode incluir direção divina sem torná-la explícita além do grego.
- source_word: ἰδεῖν
  choice: ver
  rationale: Preserva o sentido literal, que no contexto de viagem também implica visitar Roma.
theological_decisions:
- issue: Referente de ἐν τῷ πνεύματι
  choice: no Espírito
  alternative: em seu espírito
  rationale: O grego não traz possessivo explícito e permite tanto a orientação do Espírito Santo quanto a resolução interior de Paulo. A tradução principal adota o Espírito Santo, mas a nota preserva a ambiguidade genuína.
- issue: Força de δεῖ
  choice: preciso
  alternative: é necessário que eu
  rationale: A formulação mantém a necessidade enfática sem definir se ela decorre explicitamente de uma ordem divina, de uma vocação providencial ou de uma convicção pessoal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das orações deixa claro que a passagem pela Macedônia e pela Acaia precederia a ida a Jerusalém. A fala direta foi dividida da oração anterior para evitar um período excessivamente longo.
