id: ACT.19.18
reference: Acts 19:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: pt
  text: E muitos dos que haviam crido vinham, confessando e revelando suas práticas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus atos” ou “as coisas que haviam feito”.
    reason: Alternativas lexicais para πράξεις, que pode indicar práticas, atos ou aquilo que foi feito.
lexical_decisions:
- source_word: πολλοί
  choice: muitos
  rationale: Equivalente quantitativo direto, conciso e natural em português.
- source_word: τε
  choice: E
  rationale: Preserva a leve força continuativa que liga a frase à narrativa anterior.
- source_word: τῶν πεπιστευκότων
  choice: dos que haviam crido
  rationale: O particípio perfeito aponta para a fé iniciada anteriormente e ainda relevante, sem transformar a expressão em um rótulo eclesial técnico.
- source_word: ἤρχοντο
  choice: vinham
  rationale: O imperfeito expressa ação em curso ou repetida no passado; “vinham” mantém esse aspecto de modo natural.
- source_word: ἐξομολογούμενοι
  choice: confessando
  rationale: Traduz diretamente a ideia de confessar ou reconhecer, sem especificar além do texto o objeto da confissão.
- source_word: ἀναγγέλλοντες
  choice: revelando
  rationale: Comunica a ideia de dar a conhecer ou trazer à luz e evita repetição semântica excessiva com “confessando”.
- source_word: τὰς πράξεις αὐτῶν
  choice: suas práticas
  rationale: “Práticas” se ajusta ao contexto de atividades anteriores, inclusive mágicas, sem restringir o substantivo grego simplesmente a “pecados”.
theological_decisions:
- issue: Se πεπιστευκότων deve ser traduzido como rótulo coletivo estabelecido ou como ato anterior com estado resultante.
  choice: dos que haviam crido
  alternative: dos crentes; dos que creram
  rationale: A formulação conserva a nuance do perfeito grego e evita importar um título eclesial técnico.
- issue: Se τὰς πράξεις αὐτῶν designa especificamente pecados, práticas mágicas ou atos em sentido mais amplo.
  choice: suas práticas
  alternative: seus atos; as coisas que haviam feito
  rationale: O contexto sugere práticas ligadas à magia, mas o substantivo é mais amplo; a tradução mantém essa tensão sem explicitação indevida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem participial foi preservada sem tornar a frase artificial; “haviam crido” e “vinham” mantêm, respectivamente, as nuances aspectuais do perfeito e do imperfeito gregos.
