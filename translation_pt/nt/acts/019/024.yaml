  register: Português moderno, digno e acessível, com construção natural tanto no Brasil quanto no uso internacional. “Ourives” é corrente e conciso; “santuários” evita especificar indevidamente a forma exata dos objetos. A litotes foi preservada no texto e esclarecida em nota.
