source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: pt
  text: Pois certo homem chamado Demétrio, um ourives que fazia santuários de prata de Ártemis[a], proporcionava aos artesãos não pouco trabalho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templos de prata de Ártemis” ou “modelos de prata do templo de Ártemis”. O grego usa naous (“santuários/templos”), provavelmente referindo-se a pequenos objetos artesanais ligados ao culto de Ártemis.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega “não pouco trabalho” é uma forma de dizer que a atividade comercial — e possivelmente o lucro — era considerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Conserva a função explicativa do conectivo, ligando este versículo ao contexto anterior.
- source_word: Δημήτριος τις ὀνόματι
  choice: um homem chamado Demétrio
  rationale: Introduz de modo natural em português uma pessoa específica ainda não mencionada, transliterando o nome grego.
- source_word: ἀργυροκόπος
  choice: ourives
  rationale: Designa de forma corrente um artífice que trabalha metais preciosos; o contexto e a menção da prata especificam seu ofício.
- source_word: ποιῶν
  choice: que fazia
  rationale: A oração relativa expressa com naturalidade a atividade habitual descrita pelo particípio presente.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: santuários de prata de Ártemis
  rationale: Preserva o sentido de ναός sem determinar além da evidência se eram nichos, miniaturas ou modelos do templo; mantém o nome grego da deusa.
- source_word: παρείχετο
  choice: proporcionava
  rationale: O imperfeito indica uma atividade contínua ou habitual que gerava trabalho ou comércio para os artesãos.
- source_word: τοῖς τεχνίταις
  choice: aos artesãos
  rationale: Refere-se a trabalhadores especializados ligados à produção desses objetos.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: um negócio nada pequeno
  rationale: Mantém a litotes grega e a amplitude de ἐργασία, que neste contexto pode envolver atividade comercial, trabalho e ganho.
