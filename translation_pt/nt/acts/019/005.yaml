  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: pt
  text: Ao ouvirem isso, foram batizados em nome[a] do Senhor Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para dentro do nome”.
    reason: Indica a possível força direcional da preposição grega εἰς, que a expressão portuguesa idiomática “em nome” não explicita.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo tem valor temporal no contexto. O objeto “isso”, embora implícito no grego, retoma naturalmente o que Paulo acabara de dizer.
- source_word: δὲ
  choice: —
  rationale: A partícula é um conectivo narrativo leve. Em português, a progressão é natural sem uma conjunção explícita neste versículo.
- source_word: ἐβαπτίσθησαν
  choice: foram batizados
  rationale: Preserva a voz passiva e expressa de modo claro e corrente a ação concluída.
- source_word: εἰς τὸ ὄνομα
  choice: em nome
  rationale: É a formulação portuguesa natural para esta construção batismal. A força direcional possível de εἰς é preservada em nota, sem tornar o texto principal artificial.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Mantém κύριος como título cristológico e usa a forma portuguesa corrente do nome Ἰησοῦς.
theological_decisions:
- issue: Formulação batismal com εἰς τὸ ὄνομα
  choice: em nome do Senhor Jesus
  alternative: para o nome do Senhor Jesus / para dentro do nome do Senhor Jesus
  rationale: “Em nome” é idiomático e tradicional em português, enquanto εἰς pode conservar uma nuance direcional ou associativa. A nota registra essa possibilidade sem impor uma explicação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A omissão de uma tradução explícita para δέ evita um início pesado; “ao ouvirem isso” liga naturalmente o versículo ao discurso anterior.
