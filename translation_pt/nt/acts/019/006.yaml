id: ACT.19.6
reference: Acts 19:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: pt
  text: E, quando Paulo lhes impôs as mãos, o Espírito Santo veio sobre eles, e eles começaram a falar em línguas[a] e a profetizar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “idiomas”. O termo grego pode significar “línguas” ou “idiomas”; o texto principal preserva essa ambiguidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: quando Paulo lhes impôs as mãos
  rationale: O particípio aoristo em construção genitiva absoluta é expresso naturalmente por uma oração temporal. “Impôs as mãos” preserva a expressão bíblica corrente sem reproduzir de modo artificial a sintaxe grega.
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: veio sobre eles
  rationale: Conserva o sentido direcional de ἔρχομαι com ἐπί e corresponde ao uso narrativo característico de Lucas–Atos.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma padrão, clara e teologicamente precisa no português contemporâneo.
- source_word: ἐλάλουν
  choice: começaram a falar
  rationale: No contexto narrativo, o imperfeito pode apresentar a ação em seu início e desenvolvimento; esta formulação comunica naturalmente o começo da manifestação, sem alterar seu caráter continuado.
- source_word: γλώσσαις
  choice: em línguas
  rationale: A expressão tradicional preserva a amplitude lexical do grego, que pode referir-se a línguas ou idiomas, sem decidir se a fala consistia em idiomas humanos reconhecíveis ou em fala extática.
- source_word: ἐπροφήτευον
  choice: a profetizar
  rationale: Traduz diretamente o verbo que designa a atividade de profetizar e forma uma coordenação natural com “começaram a falar”.
- source_word: τε ... καί
  choice: e ... e
  rationale: A coordenação portuguesa liga de maneira simples e estreita as duas manifestações, como faz a construção grega.
theological_decisions:
- issue: Natureza de γλώσσαις em Atos 19:6
  choice: “línguas” no texto principal, sem especificar a natureza da fala
  alternative: “idiomas”, com ênfase em línguas humanas inteligíveis
  rationale: O termo grego admite ambos os sentidos, e o versículo não resolve por si só a questão interpretativa. A tradução preserva essa tensão em vez de impor uma leitura denominacional.
- issue: A vinda do Espírito Santo
  choice: “o Espírito Santo veio sobre eles”
  alternative: “o Espírito Santo desceu sobre eles”
  rationale: “Veio sobre” reflete de perto a construção grega e relata o acontecimento sem introduzir explicações posteriores sobre sequência, causalidade sacramental ou um esquema doutrinário específico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém expressões bíblicas correntes (“impôs as mãos”, “veio sobre eles”) e evita terminologia confessional específica.
