    reason: lexical_alternative
  revision_rationale: A revisão explicita que os livros foram reunidos, conserva o aspecto em curso da queima indicado pelo imperfeito grego e formula o resultado do cálculo de modo mais próximo de «encontraram», sem identificar uma denominação monetária ausente do texto.
