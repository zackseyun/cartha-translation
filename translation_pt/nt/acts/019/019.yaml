base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: pt
  text: Muitos dos que haviam praticado magia reuniram seus livros e os queimavam diante de todos; calcularam o valor deles e concluíram que era de cinquenta mil peças de prata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cinco miríades de prata”, isto é, cinquenta mil unidades ou peças de prata. O texto não especifica qual era a moeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: Muitos
  rationale: No contexto, indica um número considerável de pessoas; “muitos” é natural e fiel ao sentido.
- source_word: τὰ περίεργα πραξάντων
  choice: dos que haviam praticado magia
  rationale: A expressão idiomática designa práticas mágicas ou ocultas no contexto efésio, e não atividades meramente curiosas.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: trouxeram seus livros
  rationale: Expressa que os praticantes levaram os escritos ao mesmo lugar; “seus” é explicitado naturalmente pelo contexto.
- source_word: κατέκαιον
  choice: os queimaram
  rationale: O imperfeito grego pode retratar a ação em curso, mas o pretérito perfeito é a forma narrativa mais natural em português e não elimina o caráter efetivo da queima pública.
- source_word: ἐνώπιον πάντων
  choice: diante de todos
  rationale: Preserva a ênfase na natureza pública do ato em registro digno e corrente.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: calcularam o valor deles
  rationale: O verbo indica somar ou calcular, e τιμή aqui se refere ao valor monetário dos livros.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: cinquenta mil peças de prata
  rationale: Converte literalmente “cinco miríades” em cinquenta mil, sem especificar uma denominação monetária que o grego não identifica.
theological_decisions:
- issue: Natureza de τὰ περίεργα no contexto de Éfeso
  choice: praticado magia
  alternative: praticado artes ocultas
  rationale: O contexto imediato envolve exorcistas, espíritos malignos e livros de fórmulas mágicas. “Magia” comunica claramente a prática histórico-religiosa sem reduzir a expressão a simples curiosidades nem impor uma categoria denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura evita arcaísmos, mantém a ação pública e não identifica indevidamente a unidade monetária.
