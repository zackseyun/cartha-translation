id: ACT.19.13
reference: Acts 19:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: pt
  text: 'Mas também alguns dos exorcistas judeus itinerantes tentaram invocar o nome do Senhor Jesus sobre os que tinham espíritos malignos, dizendo: “Eu os conjuro por Jesus, a quem Paulo proclama”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os ponho sob juramento por Jesus, a quem Paulo prega”.'
    reason: Registra alternativas legítimas para ὁρκίζω e κηρύσσει sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: tentaram
  rationale: Expressa de modo natural o aoristo de ἐπιχειρέω, indicando que empreenderam a ação sem pressupor seu êxito.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: também alguns dos exorcistas judeus itinerantes
  rationale: Preserva τινες (‘alguns’), o valor aditivo de καί (‘também’) e o sentido de περιέρχομαι como ir de lugar em lugar; ‘itinerantes’ é claro e preciso em português.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: invocar o nome ... sobre
  rationale: No contexto de exorcismo, a construção indica o emprego invocatório do nome, não apenas sua pronúncia.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: os que tinham espíritos malignos
  rationale: Mantém o grau de explicitação do grego, literalmente ‘os que tinham espíritos malignos’, sem impor a formulação mais forte ‘possuídos’.
- source_word: τὰ πνεύματα τὰ πονηρά
  choice: espíritos malignos
  rationale: ‘Malignos’ é uma expressão corrente, digna e inequívoca para πονηρά neste contexto espiritual.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: o nome do Senhor Jesus
  rationale: Reproduz naturalmente a construção genitiva e preserva o peso honorífico e cristológico de κύριος.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Eu os conjuro
  rationale: No uso exorcístico, ὁρκίζω significa obrigar solenemente mediante juramento; ‘conjuro’ conserva o tom formal e é compreensível no contexto.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: por Jesus, a quem Paulo proclama
  rationale: O acusativo após ὁρκίζω identifica aquele por quem se faz a adjuração; κηρύσσει é adequadamente vertido por ‘proclama’, preservando a ideia de anúncio público.
theological_decisions:
- issue: Tradução de κύριος na expressão cristológica τοῦ κυρίου Ἰησοῦ
  choice: Senhor
  alternative: Mestre
  rationale: ‘Senhor’ preserva tanto o sentido honorífico quanto o peso teológico normal do título em Atos, sem reduzir sua amplitude.
- issue: Se deve tornar explícita a possessão demoníaca em τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: os que tinham espíritos malignos
  alternative: os que estavam possuídos por espíritos malignos
  rationale: O grego emprega literalmente ‘ter’; embora o contexto sugira possessão, a redação escolhida evita explicitar mais do que a fonte.
- issue: Força de ὁρκίζω na fórmula dirigida aos espíritos
  choice: Eu os conjuro
  alternative: Eu os ponho sob juramento / Eu lhes ordeno solenemente
  rationale: ‘Conjuro’ comunica a adjuração solene sem transformar o verbo simplesmente em ‘ordenar’, preservando a natureza ritual da fala.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e alcance internacional. ‘Exorcistas judeus itinerantes’ mantém precisão sem soar excessivamente técnico. A ordem da frase acompanha o fluxo do grego, mas foi ajustada à sintaxe natural do português.
