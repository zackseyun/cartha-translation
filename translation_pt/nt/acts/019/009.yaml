source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: pt
  text: Mas, como alguns se endureciam e se recusavam a ser persuadidos[a], falando mal do Caminho[b] diante da multidão, Paulo se afastou deles, separou os discípulos e dialogava diariamente no salão de aulas de Tirano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desobedeciam” ou “recusavam-se a crer”.
    reason: lexical_alternative
  - marker: b
    text: “O Caminho” era uma das primeiras designações do movimento cristão no livro de Atos.
    reason: cultural_note
  - marker: c
    text: Ou “na escola de Tirano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: se endureciam
  rationale: O imperfeito expressa um processo ou estado contínuo de endurecimento; a forma pronominal preserva a possível nuance média sem definir de modo excessivo a agência.
- source_word: ἠπείθουν
  choice: se recusavam a crer
  rationale: ἀπειθέω pode envolver incredulidade, recusa em ser persuadido e desobediência. No contexto da resistência à mensagem, esta formulação natural preserva a dimensão volitiva e recebe nota com alternativas.
- source_word: κακολογοῦντες
  choice: falando mal de
  rationale: Expressa de modo amplo e natural a fala pública hostil, sem impor o sentido jurídico mais estreito de caluniar.
- source_word: τὴν ὁδὸν
  choice: o Caminho
  rationale: Em Atos, a expressão funciona como designação reconhecível do movimento cristão; a inicial maiúscula sinaliza esse uso histórico.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: diante da multidão
  rationale: Mantém de forma concisa o caráter público da oposição.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: Paulo se afastou deles
  rationale: O particípio aoristo indica uma separação decisiva. O nome Paulo explicita o sujeito já presente no contexto, evitando ambiguidade em português.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: separou os discípulos
  rationale: Preserva a ação deliberada de distinguir os discípulos do grupo hostil, sem acrescentar que ele apenas os levou para outro espaço.
- source_word: καθ’ ἡμέραν
  choice: diariamente
  rationale: Comunica com concisão a regularidade cotidiana da atividade.
- source_word: διαλεγόμενος
  choice: passou a dialogar
  rationale: διαλέγομαι denota discurso argumentativo e interativo. 'Dialogar' preserva a troca racional sem sugerir mera palestra nem discussão hostil.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: no salão de aulas de Tirano
  rationale: σχολή neste contexto designa um local de ensino ou palestras. 'Salão de aulas' evita a associação imediata com uma escola moderna; Τύραννος é vertido pela forma portuguesa tradicional 'Tirano'.
theological_decisions:
- issue: Sentido de ἠπείθουν
  choice: se recusavam a crer
  alternative: desobedeciam; recusavam-se a ser persuadidos
  rationale: O verbo reúne nuances de incredulidade e resistência volitiva. A tradução principal mantém ambas de modo idiomático, enquanto a nota registra a amplitude lexical sem resolver indevidamente a tensão.
- issue: O Caminho como designação do movimento
  choice: Caminho, com inicial maiúscula
  alternative: caminho, como referência genérica ao ensino ou modo de vida
  rationale: Em Atos, a expressão é usada como designação reconhecível do movimento ligado a Jesus. A maiúscula ajuda o leitor moderno a perceber esse uso sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, e o sujeito 'Paulo' foi explicitado a partir do contexto. Todas as notas estão marcadas no texto no ponto pertinente.
