id: ACT.19.8
reference: Acts 19:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: pt
  text: Então, ele entrou na sinagoga e, durante três meses, falou com ousadia, dialogando e persuadindo os ouvintes a respeito do Reino de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «procurando persuadir os ouvintes acerca do Reino de Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: entrou
  rationale: O particípio aoristo estabelece a circunstância anterior ou concomitante à ação principal. A coordenação «entrou ... e falou» expressa essa sequência com naturalidade em português.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ é um conectivo narrativo leve; «Então» faz a narrativa avançar sem introduzir contraste indevido.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: O termo designa especificamente o local de reunião judaico; «sinagoga» é a forma estabelecida e precisa.
- source_word: ἐπαρρησιάζετο
  choice: falou com ousadia
  rationale: O imperfeito indica fala aberta e ousada mantida ao longo do período; «durante três meses» deixa clara essa duração.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: durante três meses
  rationale: ἐπί com acusativo expressa duração. Esta formulação é idiomática e clara em português.
- source_word: διαλεγόμενος
  choice: dialogando
  rationale: O verbo envolve exposição, argumentação e intercâmbio com os ouvintes. «Dialogando» preserva seu caráter discursivo sem sugerir hostilidade.
- source_word: πείθων
  choice: persuadindo os ouvintes
  rationale: O particípio descreve a atividade de persuadir. «Os ouvintes» explicita em português o objeto implícito no grego, identificado pelo contexto da sinagoga.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: a respeito do Reino de Deus
  rationale: περί com genitivo significa «a respeito de» ou «acerca de». «Reino de Deus» mantém a expressão neotestamentária reconhecível e pode abranger tanto o domínio quanto o exercício do governo divino.
theological_decisions:
- issue: O objeto de πείθων está implícito no grego.
  choice: «persuadindo os ouvintes»
  alternative: «persuadindo-os» ou simplesmente «persuadindo»
  rationale: O contexto identifica os frequentadores da sinagoga como destinatários. Explicitar «os ouvintes» produz português natural sem acrescentar um novo grupo ao relato.
- issue: πείθων pode descrever a atividade de persuasão sem declarar inequivocamente seu êxito.
  choice: «persuadindo» no texto, com alternativa em nota
  alternative: «procurando persuadir»
  rationale: A forma grega apresenta a ação de persuadir, mas o contexto não exige concluir que todos foram convencidos. A nota conserva essa possível nuance conativa.
- issue: Sentido de βασιλεία τοῦ θεοῦ.
  choice: «Reino de Deus»
  alternative: «governo de Deus» ou «reinado de Deus»
  rationale: «Reino de Deus» é fiel, amplamente reconhecido e não limita βασιλεία a um território; o contexto não exige substituir a expressão tradicional por uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A frase conserva o movimento narrativo, a duração da fala ousada e o caráter dialogal da atividade. O pronome «ele» evita inserir no texto grego deste versículo o nome «Paulo», embora o referente esteja claro no contexto.
