  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: pt
  text: E até alguns dos asiarcas[a], que eram amigos de Paulo, mandaram-lhe uma mensagem e insistiam para que ele não se apresentasse no teatro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os “asiarcas” eram autoridades de destaque ligadas à província romana da Ásia.
    reason: cultural_note
  - marker: b
    text: Ou “não entrasse no teatro” ou “não se arriscasse a ir ao teatro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: E até alguns
  rationale: Mantém a continuidade narrativa de δέ, a indefinição de τινές e a ênfase aditiva de καί em português natural.
- source_word: τῶν Ἀσιαρχῶν
  choice: dos asiarcas
  rationale: Preserva por transliteração o título técnico de dirigentes de destaque ligados à província romana da Ásia; a nota explica seu contexto.
- source_word: ὄντες αὐτῷ φίλοι
  choice: que eram amigos de Paulo
  rationale: Expressa naturalmente a circunstância de fundo indicada pelo particípio e explicita o referente de αὐτῷ para evitar ambiguidade em português.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: mandaram-lhe uma mensagem
  rationale: O objeto do envio está implícito no grego; 'uma mensagem' torna explícito o sentido contextual sem sugerir que os próprios asiarcas foram enviados.
- source_word: παρεκάλουν
  choice: insistiam
  rationale: Comunica a exortação séria de παρακαλέω, enquanto o imperfeito é refletido por uma forma verbal que sugere ação continuada ou reiterada.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: para que ele não se apresentasse no teatro
  rationale: Reproduz a ideia de Paulo colocar-se ou expor-se voluntariamente no local da assembleia, evitando o pouco natural 'dar a si mesmo' e sem eliminar a ambiguidade por meio de uma paráfrase excessivamente interpretativa.
