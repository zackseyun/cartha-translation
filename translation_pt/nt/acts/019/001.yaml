id: ACT.19.1
reference: Acts 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: pt
  text: Aconteceu que, enquanto Apolo estava em Corinto, Paulo atravessou as regiões do interior[a], chegou a Éfeso e encontrou alguns discípulos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as regiões mais altas” ou “as regiões interiores”; a expressão provavelmente se refere à rota pelo interior, através de terras mais elevadas, e não à estrada costeira.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “discípulos” não especifica de quem eles eram discípulos; os versículos seguintes indicam que estavam ligados ao batismo de João.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: A fórmula narrativa introduz o novo episódio. “Aconteceu que” preserva seu valor sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: enquanto Apolo estava em Corinto
  rationale: A construção com infinitivo articular expressa simultaneidade; “enquanto” comunica isso de modo natural em português.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: Paulo atravessou as regiões do interior
  rationale: O particípio indica que Paulo percorreu essas regiões antes de chegar a Éfeso. Embora ἀνωτερικά possa significar literalmente “superiores” ou “mais altas”, no contexto geográfico a expressão provavelmente aponta para a rota interiorana, em contraste com a costeira.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: chegou a Éfeso
  rationale: A formulação expressa com clareza o movimento até a cidade e se encaixa naturalmente na sequência narrativa em português.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: e encontrou alguns discípulos
  rationale: τινας é indefinido, por isso “alguns”; μαθητάς é mantido como “discípulos”, sem determinar antecipadamente a identidade deles.
theological_decisions:
- issue: Identidade de μαθητάς no contexto
  choice: alguns discípulos
  alternative: alguns discípulos de João; alguns discípulos de Jesus
  rationale: O grego não especifica aqui de quem eram discípulos. Os versículos seguintes relacionam esses homens ao batismo de João, por isso o texto principal preserva a indeterminação original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência verbal foi formulada de modo idiomático, preservando a progressão do grego e sua ambiguidade quanto à identidade dos discípulos.
