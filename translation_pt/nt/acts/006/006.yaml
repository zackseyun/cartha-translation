  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: pt
  text: Eles os apresentaram diante dos apóstolos e os apóstolos, depois de orarem, lhes impuseram as mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imposição das mãos pode expressar bênção ou comissionamento público; aqui, o grego menciona o gesto sem definir mais precisamente seu significado eclesial.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων
  choice: Eles foram apresentados aos apóstolos
  rationale: A construção relativa retoma os sete do versículo anterior. A voz passiva em português evita a ordem pouco natural de uma reprodução literal e comunica com clareza que eles foram postos diante dos apóstolos.
- source_word: προσευξάμενοι
  choice: depois de orarem
  rationale: O particípio aoristo indica naturalmente uma ação anterior à imposição das mãos. O sujeito implícito é preservado como os apóstolos pelo contexto e pela estrutura da frase.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: estes lhes impuseram as mãos
  rationale: “Impor as mãos” é a expressão portuguesa tradicional e natural para o gesto descrito. “Estes” esclarece que os apóstolos, e não os sete, realizam a ação, sem definir além do grego seu significado eclesial.
theological_decisions:
- issue: Natureza da imposição das mãos
  choice: Descrição do gesto como “impuseram as mãos”
  alternative: “ordenaram” ou “comissionaram”
  rationale: O grego nomeia o ato ritual, mas não determina aqui todo o seu significado eclesial. A tradução evita impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita o calque pouco natural “estes puseram diante” e usa “estes” apenas para desambiguar o sujeito da oração e da imposição das mãos.
