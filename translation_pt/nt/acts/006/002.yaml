  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: pt
  text: 'Então, os Doze convocaram todo o grupo dos discípulos[a] e disseram: “Não é correto[b] que abandonemos a palavra de Deus para servir às mesas[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a multidão dos discípulos” ou “o conjunto dos discípulos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Não é conveniente” ou “Não é aceitável para nós”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, cuidar da distribuição prática ligada às refeições e aos recursos da comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: reuniram
  rationale: O particípio aoristo médio indica que os Doze convocaram os discípulos para junto de si. “Reuniram” expressa naturalmente, em português, o ato de chamar o grupo para uma assembleia.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ dá continuidade à narrativa e introduz a resposta dos Doze à situação anterior, sem exigir um contraste forte.
- source_word: οἱ δώδεκα
  choice: os Doze
  rationale: Preserva a designação substantivada do grupo apostólico sem acrescentar “apóstolos”, termo que não aparece explicitamente no versículo.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: todo o grupo dos discípulos
  rationale: πλῆθος designa o conjunto ou a assembleia numerosa dos discípulos. A formulação é clara e atual, mantendo a força coletiva da expressão.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Não é correto
  rationale: No contexto, ἀρεστόν exprime o que é aceitável, apropriado ou conveniente. “Não é correto” comunica de modo natural uma avaliação de prioridade e responsabilidade.
- source_word: ἡμᾶς καταλείψαντας
  choice: que abandonemos
  rationale: A construção acusativo-particípio ligada ao infinitivo é vertida de modo idiomático. “Abandonemos” preserva a força de καταλείπω, isto é, deixar para trás, sem reduzi-lo apenas a uma negligência involuntária.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Tradução transparente que conserva a ressonância teológica da expressão e sua referência contextual à mensagem proclamada e ensinada.
- source_word: διακονεῖν
  choice: servir
  rationale: O verbo denota prestação de serviço. “Servir” é direto e evita impor ao texto um sentido eclesiástico técnico posterior.
- source_word: τραπέζαις
  choice: às mesas
  rationale: Mantém a imagem concreta do grego. O contexto aponta para a distribuição prática de provisões da comunidade, mas a tradução não substitui a expressão por uma interpretação mais específica.
theological_decisions:
- issue: A prioridade apostólica em relação ao serviço prático
  choice: 'Apresentar a declaração como questão de responsabilidade e prioridade: “Não é correto que abandonemos a palavra de Deus para servir às mesas”.'
  alternative: “Não nos convém deixar a palavra de Deus para cuidar da distribuição de alimentos.”
  rationale: O texto distingue responsabilidades sem declarar que o serviço prático tenha menor dignidade espiritual. A formulação preserva tanto a seriedade da prioridade dada à palavra de Deus quanto a importância implícita da necessidade que será atendida por outros.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Os Doze” preserva a designação tradicional e concisa; “servir às mesas” mantém a imagem original, enquanto a nota esclarece o contexto prático sem inseri-lo diretamente no texto.
