source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: pt
  text: E todos os que estavam sentados no Conselho[a], fitando-o, viram o seu rosto como o rosto de um anjo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Sinédrio». A palavra grega se refere ao conselho governante judaico.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: olhando fixamente para ele
  rationale: Expressa um olhar atento e contínuo, com intensidade maior que um simples olhar, em português natural.
- source_word: πάντες οἱ καθεζόμενοι
  choice: todos os que estavam sentados
  rationale: Preserva tanto a totalidade indicada por πάντες quanto a descrição circunstancial dos membros sentados.
- source_word: συνεδρίῳ
  choice: Conselho
  rationale: Traduz diretamente a instituição governante judaica; a alternativa tradicional «Sinédrio» é preservada em nota cultural.
- source_word: πρόσωπον
  choice: rosto
  rationale: É o equivalente direto, claro e corrente para a face visível de Estêvão.
- source_word: ὡσεὶ
  choice: como
  rationale: Mantém a comparação sem determinar em que qualidade específica consistia a semelhança.
- source_word: ἀγγέλου
  choice: um anjo
  rationale: Neste contexto, o sentido sobrenatural de ἄγγελος é o mais provável e corresponde à comparação da aparência de Estêvão.
theological_decisions:
- issue: Natureza da comparação «como o rosto de um anjo»
  choice: Uma comparação da aparência de Estêvão com a de um anjo, sem especificar a qualidade exata da semelhança.
  alternative: Uma referência específica ao brilho glorioso, à inocência serena ou à autoridade celestial.
  rationale: O grego afirma semelhança, mas não esclarece se ela consistia em luminosidade, serenidade, majestade ou alguma combinação dessas qualidades; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Conselho» recebe inicial maiúscula por designar aqui uma instituição específica; a ordem da frase foi ajustada levemente para fluidez sem alterar as relações do grego.
