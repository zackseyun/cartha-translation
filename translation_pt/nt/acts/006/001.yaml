id: ACT.6.1
reference: Acts 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: pt
  text: Naqueles dias, à medida que o número dos discípulos aumentava, surgiu uma queixa dos helenistas[a] contra os hebreus, porque as viúvas dos helenistas eram deixadas de lado na distribuição diária.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente judeus de língua grega, em contraste com os “hebreus”, provavelmente judeus de língua aramaica ou hebraica.
    reason: Nota cultural que esclarece a provável distinção entre os dois grupos sem substituir os termos históricos no texto.
  - marker: b
    text: 'Ou: “eram negligenciadas no serviço (ou ministério) diário”.'
    reason: Registra alternativas lexicais legítimas para παρεθεωροῦντο e διακονία.
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Naqueles dias
  rationale: Preserva a referência temporal e permite que a leve função de transição de δέ seja percebida pelo fluxo narrativo, sem acrescentar um advérbio temporal inexistente no grego.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: à medida que o número dos discípulos aumentava
  rationale: Expressa de modo natural a circunstância de fundo do genitivo absoluto e deixa claro que πληθύνω se refere ao crescimento numérico.
- source_word: ἐγένετο γογγυσμός
  choice: surgiu uma queixa
  rationale: Comunica tanto o aparecimento do descontentamento quanto sua expressão concreta, sem recorrer ao pouco natural 'houve uma murmuração'.
- source_word: τῶν Ἑλληνιστῶν
  choice: dos helenistas
  rationale: Mantém a designação histórica do texto grego e evita transformar em certeza, no corpo do texto, sua provável caracterização linguístico-cultural.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: contra os hebreus
  rationale: Aqui πρός indica o alvo da queixa; 'contra' transmite adequadamente a tensão social do contexto.
- source_word: παρεθεωροῦντο
  choice: estavam sendo deixadas de lado
  rationale: Preserva o aspecto contínuo do imperfeito passivo e descreve a omissão sem afirmar necessariamente que ela era deliberada.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: na distribuição diária
  rationale: Embora διακονία possa significar serviço ou ministério, o cuidado material das viúvas e o contexto subsequente favorecem 'distribuição' como sua realização concreta aqui.
- source_word: αἱ χῆραι αὐτῶν
  choice: as viúvas deles
  rationale: Conserva a relação possessiva explícita e seu referente mais natural, os helenistas.
theological_decisions:
- issue: Identidade dos grupos Ἑλληνισταί e Ἑβραῖοι
  choice: Manter 'helenistas' e 'hebreus' no texto, explicando em nota sua provável distinção linguístico-cultural.
  alternative: Traduzir diretamente como 'judeus de língua grega' e 'judeus de língua aramaica ou hebraica'.
  rationale: Os rótulos históricos preservam a forma e a abertura interpretativa do original, enquanto a nota oferece ao leitor a explicação mais provável sem convertê-la em identificação absoluta.
- issue: Sentido contextual de διακονία
  choice: Usar 'distribuição' no texto e registrar 'serviço' ou 'ministério' como alternativas em nota.
  alternative: Traduzir literalmente por 'serviço diário' ou 'ministério diário'.
  rationale: O contexto favorece provisão material, mas a nota conserva a amplitude lexical do termo e evita apagar sua possível conotação mais geral de serviço.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A construção evita arcaísmos como 'murmuração', preserva os rótulos históricos e mantém na nota a amplitude de διακονία.
