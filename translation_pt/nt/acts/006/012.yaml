id: ACT.6.12
reference: Acts 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: pt
  text: Então, eles incitaram o povo, os anciãos e os escribas. Chegando de repente, agarraram Estêvão e o levaram perante o Sinédrio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o conselho”. O termo grego pode designar genericamente um conselho, mas aqui provavelmente se refere ao conselho governante judaico, o Sinédrio.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: incitaram
  rationale: Expressa a ação causativa de agitar e mobilizar pessoas contra Estêvão. Em português atual, é natural e mantém a força do contexto sem afirmar explicitamente violência.
- source_word: τε
  choice: Então
  rationale: Representa a leve conexão narrativa de τέ de modo fluente e sugere continuação ou consequência sem dar ênfase excessiva à partícula.
- source_word: τὸν λαὸν
  choice: o povo
  rationale: É a correspondência mais direta e preserva a amplitude de λαός, sem restringi-lo a uma multidão momentânea.
- source_word: τοὺς πρεσβυτέρους
  choice: os anciãos
  rationale: Designa os líderes judeus reconhecidos no contexto institucional de Jerusalém, e não simplesmente homens idosos.
- source_word: τοὺς γραμματεῖς
  choice: os escribas
  rationale: Preserva o termo histórico para os especialistas reconhecidos nas Escrituras e na lei.
- source_word: ἐπιστάντες
  choice: Chegando de repente
  rationale: Comunica a aproximação súbita sugerida pelo particípio, sem acrescentar detalhes não expressos no grego.
- source_word: συνήρπασαν αὐτὸν
  choice: agarraram Estêvão
  rationale: Transmite a tomada física e coercitiva de συναρπάζω. A repetição explícita do nome, recuperado do contexto, evita uma sequência ambígua de pronomes em português.
- source_word: ἤγαγον
  choice: levaram
  rationale: É uma tradução natural de ἄγω neste contexto; a coerção já está indicada pelo verbo anterior.
- source_word: εἰς τὸ συνέδριον
  choice: perante o Sinédrio
  rationale: O contexto identifica συνέδριον como o conselho governante judaico. 'Perante' expressa idiomaticamente a apresentação de Estêvão ao órgão judicial, embora εἰς literalmente possa indicar movimento para dentro ou até ele.
theological_decisions:
- issue: Identificação de συνέδριον
  choice: o Sinédrio
  alternative: o conselho
  rationale: No cenário de Jerusalém, com anciãos e escribas envolvidos, o referente provável é o conselho governante judaico. A escolha mantém a especificidade histórica sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma longa cadeia coordenada. 'Escribas' e 'Sinédrio' preservam a ambientação histórica; a nota esclarece o termo institucional.
