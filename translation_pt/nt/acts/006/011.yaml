id: ACT.6.11
reference: Acts 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: pt
  text: 'Então, instigaram secretamente alguns homens a dizer[a]: “Nós o ouvimos falar palavras blasfemas contra Moisés e contra Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “subornaram alguns homens para dizer”. O verbo grego indica que eles foram induzidos ou instigados de modo dissimulado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal natural que dá sequência à narrativa.
- source_word: ὑπέβαλον
  choice: instigaram secretamente
  rationale: Expressa tanto o ato de induzir ou instigar quanto o caráter dissimulado sugerido pelo verbo no contexto.
- source_word: ἄνδρας
  choice: alguns homens
  rationale: Preserva a referência masculina de ἀνήρ; “alguns” torna natural em português a introdução de participantes indefinidos.
- source_word: λέγοντας
  choice: a dizer
  rationale: A construção participial é vertida idiomaticamente como complemento do ato de instigar.
- source_word: Ἀκηκόαμεν
  choice: Nós o ouvimos
  rationale: Em português, o pretérito perfeito traduz naturalmente o testemunho alegado, sem exigir uma forma composta que sugeriria ação reiterada.
- source_word: αὐτοῦ λαλοῦντος
  choice: o ouvimos falar
  rationale: Reproduz de modo natural a construção de percepção com o sujeito da fala expresso pelo pronome objeto.
- source_word: ῥήματα βλάσφημα
  choice: palavras blasfemas
  rationale: Mantém a forma lexical e a força jurídico-religiosa da acusação.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: contra Moisés e contra Deus
  rationale: “Contra” expressa a direção hostil da fala; a repetição favorece clareza e cadência em português.
theological_decisions:
- issue: Natureza da acusação contra Estêvão
  choice: Apresentar a alegação como “palavras blasfemas contra Moisés e contra Deus”, sem atenuá-la nem validá-la.
  alternative: “palavras difamatórias contra Moisés e Deus”
  rationale: “Blasfemas” preserva βλάσφημα e a força religiosa e legal da acusação. O contexto narrativo deixa claro que se trata do que homens instigados afirmaram, não de uma confirmação de que a acusação fosse verdadeira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Instigaram secretamente” conserva a nuance encoberta do verbo; a nota registra “subornaram” como alternativa mais específica.
