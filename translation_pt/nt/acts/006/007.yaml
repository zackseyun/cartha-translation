id: ACT.6.7
reference: Acts 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: pt
  text: E a palavra de Deus continuava a crescer, e o número dos discípulos se multiplicava muito em Jerusalém. E uma grande multidão de sacerdotes se tornava obediente à fé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obedecia à fé” ou “passava a obedecer à fé”. A expressão grega pode indicar obediência à mensagem cristã, e não apenas um ato interior de confiança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão bíblica e a amplitude de λόγος, que aqui aponta para a mensagem proclamada sem reduzi-la explicitamente a uma única formulação, como “evangelho”.
- source_word: ηὔξανεν
  choice: continuava a crescer
  rationale: O imperfeito indica desenvolvimento contínuo; a tradução preserva tanto esse aspecto quanto a metáfora de crescimento.
- source_word: ἐπληθύνετο
  choice: se multiplicava
  rationale: Preserva a ideia de aumento numeroso e distingue este verbo de ηὔξανεν, evitando traduzir ambos simplesmente por “crescer”.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: o número dos discípulos
  rationale: Reproduz com clareza a construção grega e conserva “discípulos”, termo importante em Lucas para os seguidores de Jesus.
- source_word: ἐν Ἰερουσαλὴμ
  choice: em Jerusalém
  rationale: Tradução locativa direta e natural.
- source_word: σφόδρα
  choice: muito
  rationale: Expressa a forte intensificação do advérbio em português atual, sem tom arcaico.
- source_word: πολύς τε ὄχλος
  choice: Também uma grande multidão
  rationale: “Grande multidão” conserva o sentido coletivo de ὄχλος; “também” representa a conexão introduzida por τε de modo natural em português.
- source_word: τῶν ἱερέων
  choice: de sacerdotes
  rationale: Tradução direta de ἱερεῖς, referente aos sacerdotes judeus ligados ao templo.
- source_word: ὑπήκουον
  choice: passava a obedecer
  rationale: A expressão comunica o processo em andamento sugerido pelo imperfeito e se ajusta naturalmente ao sujeito coletivo “multidão”.
- source_word: τῇ πίστει
  choice: à fé
  rationale: 'Conserva a formulação concisa e a possível força objetiva de πίστις: a fé ou mensagem cristã à qual os sacerdotes se submetiam, sem eliminar a ressonância de confiança.'
theological_decisions:
- issue: Sentido de πίστις em τῇ πίστει
  choice: à fé
  alternative: à mensagem da fé; à fé cristã
  rationale: O artigo e a construção “obedecer à fé” favorecem um sentido objetivo, referente à mensagem ou confissão cristã, mas o texto não explicita uma paráfrase. A tradução mantém a tensão e a nota esclarece a possibilidade.
- issue: Nuance de ὑπήκουον no contexto da conversão
  choice: passava a obedecer
  alternative: obedecia; tornava-se obediente
  rationale: A escolha representa o aspecto contínuo do imperfeito e a resposta progressiva dos sacerdotes, sem definir se a ênfase recai em submissão exterior, confiança interior ou ambas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa, sem alterar as relações do texto grego. O aspecto contínuo dos três verbos no imperfeito é expresso por “continuava a crescer”, “se multiplicava” e “passava a obedecer”.
