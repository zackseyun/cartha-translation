  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: pt
  text: E eles não conseguiam resistir à sabedoria e ao Espírito pelo qual ele falava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao espírito pelo qual ele falava», caso πνεύματι se refira ao espírito do próprio Estêvão, e não ao Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: não conseguiam
  rationale: O imperfeito expressa incapacidade continuada no confronto; «não conseguiam» é natural em português e preserva o aspecto da cena.
- source_word: ἀντιστῆναι
  choice: resistir
  rationale: No contexto, indica fazer frente ou opor-se eficazmente; «resistir» mantém a construção natural com complemento indireto em português.
- source_word: σοφίᾳ
  choice: à sabedoria
  rationale: O artigo grego aponta para a sabedoria específica manifestada na fala de Estêvão, adequadamente preservada pelo artigo definido.
- source_word: πνεύματι
  choice: ao Espírito
  rationale: O contexto imediato apresenta Estêvão como cheio do Espírito Santo (Atos 6:5), favorecendo essa referência; a inicial maiúscula explicita a interpretação sem ocultar a alternativa.
- source_word: ᾧ ἐλάλει
  choice: pelo qual ele falava
  rationale: O dativo pode indicar o meio ou agente capacitador da fala. «Pelo qual» retém a ligação gramatical com «Espírito», enquanto o imperfeito «falava» comunica a ação em curso.
theological_decisions:
- issue: Se πνεύματι se refere ao Espírito Santo ou ao espírito do próprio Estêvão
  choice: Espírito
  alternative: espírito
  rationale: As referências próximas à plenitude do Espírito Santo em Estêvão e a associação entre sabedoria e Espírito favorecem o Espírito Santo. Como o termo grego não elimina por si só a leitura antropológica, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura coordenada do grego e a ambiguidade interpretativa relevante em nota.
