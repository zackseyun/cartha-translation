source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: pt
  text: Mas alguns dos que eram da sinagoga chamada dos Libertos[a], entre os cireneus e alexandrinos e os da Cilícia e da Ásia[b], levantaram-se e começaram a discutir com Estêvão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos Libertinos”, forma tradicional relacionada ao termo grego. Aqui, porém, a palavra designa libertos — provavelmente antigos escravizados que receberam liberdade ou seus descendentes —, não pessoas de comportamento dissoluto.
    reason: lexical_alternative
  - marker: b
    text: “Ásia” refere-se aqui à província romana no oeste da Ásia Menor, não ao continente asiático no sentido moderno.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: levantaram-se
  rationale: Preserva a imagem concreta de se erguer e, no contexto, sugere o início da oposição sem acrescentar uma intenção não expressa.
- source_word: δέ
  choice: Mas
  rationale: Marca a transição contrastante entre o ministério de Estêvão e a oposição que surge.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: alguns membros da sinagoga
  rationale: 'Expressa naturalmente o genitivo partitivo: eram alguns dentre os que pertenciam à sinagoga.'
- source_word: τῆς λεγομένης Λιβερτίνων
  choice: chamada dos Libertos
  rationale: Λιβερτῖνοι designa libertos, isto é, antigos escravizados que haviam obtido liberdade, ou possivelmente seus descendentes; evita o sentido moderno e enganoso de “libertinos”.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: cireneus e alexandrinos
  rationale: Gentílicos naturais em português para pessoas de Cirene e Alexandria.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: pessoas da Cilícia e da Ásia
  rationale: ἀπό indica procedência. “Pessoas” torna explícito o referente humano elíptico e “Ásia” conserva o nome histórico, esclarecido em nota.
- source_word: συζητοῦντες
  choice: começaram a discutir com
  rationale: No contexto hostil, o verbo descreve contestação verbal, não uma conversa neutra; a construção perifrástica liga naturalmente o particípio ao verbo principal.
- source_word: τῷ Στεφάνῳ
  choice: com Estêvão
  rationale: O dativo com συζητέω indica a pessoa com quem se discute.
theological_decisions:
- issue: Estrutura e número das sinagogas mencionadas
  choice: uma única sinagoga com grupos de várias procedências
  alternative: duas ou mais sinagogas distintas
  rationale: A sintaxe tem συναγωγῆς no singular e pode ser entendida como uma sinagoga denominada “dos Libertos”, composta por cireneus, alexandrinos e pessoas da Cilícia e da Ásia. Como a distribuição dos grupos é discutida, a pontuação organiza a leitura sem transformar a incerteza histórica em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “Libertos” evita o falso cognato “libertinos”; travessões ajudam a delimitar a longa identificação dos opositores sem eliminar a possível ambiguidade sintática do grego.
