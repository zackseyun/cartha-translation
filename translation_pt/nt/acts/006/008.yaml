  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: pt
  text: Estêvão[a], cheio de graça e poder, fazia grandes prodígios e sinais entre o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «cheio de fé e poder» em vez de «cheio de graça e poder».
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: sem conectivo explícito
  rationale: Aqui, δέ é um conectivo narrativo leve. O português flui naturalmente sem acrescentar «então» ou «ora», que poderiam sugerir uma nuance temporal ou retórica mais marcada.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: cheio de graça e poder
  rationale: A expressão com genitivos descreve Estêvão como caracterizado por essas qualidades. «Graça» preserva a amplitude e a ressonância de χάρις; «poder» é a correspondência natural de δύναμις neste contexto de feitos extraordinários.
- source_word: ἐποίει
  choice: fazia
  rationale: O imperfeito apresenta uma ação contínua ou habitual no passado. «Fazia» comunica esse aspecto de modo natural e evita tornar explícito demais o sentido com «realizava».
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: grandes prodígios e sinais
  rationale: '«Prodígios e sinais» mantém os dois termos distintos: τέρατα ressalta o caráter assombroso, e σημεῖα, a função indicativa. «Grandes» modifica naturalmente o conjunto coordenado.'
- source_word: ἐν τῷ λαῷ
  choice: entre o povo
  rationale: A preposição indica o âmbito em que os feitos aconteciam. «Entre o povo» é idiomático e preserva a referência coletiva.
theological_decisions:
- issue: Variante textual χάριτος/πίστεως
  choice: graça
  alternative: fé
  rationale: O texto-fonte SBLGNT traz χάριτος («graça»), adotado no corpo do versículo. A leitura πίστεως («fé»), teologicamente significativa e presente em alguns manuscritos, é preservada em nota sem substituir o texto-base.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico corrente. O nome «Estêvão» segue a forma tradicional e amplamente reconhecida em português. A construção concisa preserva o aspecto verbal e a dupla «prodígios e sinais» sem explicação interpretativa no corpo do texto.
