id: ACT.6.14
reference: Acts 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: pt
  text: Pois nós o ouvimos dizer que este Jesus, o Nazareno,[a] destruirá este lugar[b] e mudará os costumes que Moisés nos transmitiu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «este Jesus de Nazaré».'
    reason: lexical_alternative
  - marker: b
    text: «Este lugar» refere-se ao templo.
    reason: cultural_note
  - marker: c
    text: 'Ou: «as tradições que Moisés nos entregou».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: nós o ouvimos
  rationale: O perfeito de ἀκούω pode indicar resultado presente, mas, nesta acusação sobre algo ouvido diretamente, o pretérito perfeito é natural em português; o pronome explicita αὐτοῦ como objeto de ouvir.
- source_word: γὰρ
  choice: Pois
  rationale: Conserva a função explicativa que liga esta declaração à acusação precedente.
- source_word: αὐτοῦ λέγοντος
  choice: o ouvimos dizer
  rationale: É a construção idiomática em português para alguém ter ouvido diretamente outra pessoa proferir determinada afirmação.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: este Jesus, o Nazareno
  rationale: Mantém a ênfase demonstrativa de οὗτος e a designação ὁ Ναζωραῖος, inclusive o possível tom depreciativo dos acusadores.
- source_word: καταλύσει
  choice: destruirá
  rationale: No contexto de τὸν τόπον τοῦτον, referente ao templo, καταλύω denota destruir ou demolir.
- source_word: τὸν τόπον τοῦτον
  choice: este lugar
  rationale: Traduz literalmente a expressão sem explicitar no corpo do texto que o referente contextual é o templo.
- source_word: ἀλλάξει
  choice: mudará
  rationale: Equivalente direto e natural do futuro de ἀλλάσσω.
- source_word: τὰ ἔθη
  choice: os costumes
  rationale: Expressa práticas e instituições comunitárias herdadas, sem impor a possível conotação técnica de «tradições».
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: que Moisés nos transmitiu
  rationale: «Transmitiu» comunica a entrega de práticas recebidas e preservadas, com naturalidade e dignidade em português.
theological_decisions:
- issue: Referente de «este lugar»
  choice: Manter «este lugar» no texto principal.
  alternative: «este templo» ou «este santuário»
  rationale: Embora o contexto identifique o templo, o grego preserva a formulação «este lugar»; a nota esclarece o referente sem substituir a linguagem da acusação.
- issue: Tom da acusação contra Jesus
  choice: «este Jesus, o Nazareno»
  alternative: «Jesus de Nazaré»
  rationale: A formulação escolhida conserva tanto a força demonstrativa quanto a designação usada pelos acusadores, permitindo que permaneça seu possível tom hostil ou depreciativo.
- issue: Natureza dos ἔθη mosaicos
  choice: «costumes»
  alternative: «tradições» ou «práticas»
  rationale: «Costumes» preserva a amplitude do termo, que pode abranger práticas e observâncias herdadas, sem resolver de modo denominacional sua relação exata com a Lei.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, preservando a ênfase acusatória, a referência implícita ao templo e a linguagem de transmissão dos costumes mosaicos.
