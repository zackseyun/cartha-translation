id: ACT.6.4
reference: Acts 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: pt
  text: Nós, porém, nos dedicaremos à oração e ao ministério da palavra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serviço da palavra”. O termo grego pode significar tanto “serviço” como “ministério”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito tem força enfática e contrastiva; em português, «nós» junto de «porém» transmite naturalmente esse contraste.
- source_word: δὲ
  choice: porém
  rationale: Marca o contraste com a atribuição do serviço das mesas a outros no contexto anterior. «Porém» é claro, atual e digno.
- source_word: τῇ προσευχῇ
  choice: à oração
  rationale: O dativo indica aquilo a que se mantém dedicação constante; a construção «dedicar-se à oração» é idiomática em português.
- source_word: διακονίᾳ
  choice: ministério
  rationale: διακονία pode designar serviço ou ministério. Neste contexto, «ministério» identifica a tarefa ligada à proclamação sem negar seu caráter de serviço; a alternativa é preservada em nota.
- source_word: τοῦ λόγου
  choice: da palavra
  rationale: λόγος refere-se aqui à palavra ou mensagem proclamada. «A palavra» preserva a expressão cristã primitiva e permanece compreensível no contexto.
- source_word: προσκαρτερήσομεν
  choice: nos dedicaremos
  rationale: O futuro expressa compromisso persistente e contínuo. «Nos dedicaremos» comunica esse empenho de modo natural no português moderno.
theological_decisions:
- issue: Tradução de διακονία em contraste com o serviço das mesas no contexto imediato
  choice: ministério da palavra
  alternative: serviço da palavra
  rationale: «Ministério» distingue de modo natural a tarefa apostólica de proclamação, enquanto a nota conserva o sentido igualmente possível de «serviço». A opção não pressupõe uma divisão rígida entre clero e leigos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A colocação «Nós, porém» conserva a ênfase contrastiva do grego; «nos dedicaremos» expressa persistência sem soar arcaico.
