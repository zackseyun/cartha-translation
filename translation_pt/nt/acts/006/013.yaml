  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: pt
  text: 'Também apresentaram falsas testemunhas, que disseram: “Este homem não para de proferir palavras contra este lugar santo[a] e contra a lei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lugar santo”. Neste contexto, a expressão grega se refere especificamente ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: apresentaram
  rationale: No contexto judicial, indica fazer comparecer ou pôr testemunhas diante da assembleia. “Apresentaram” é natural em português e preserva o sentido forense sem acrescentar que foram subornadas.
- source_word: τε
  choice: também
  rationale: Expressa a força aditiva da partícula e liga esta ação às anteriores.
- source_word: μάρτυρας ψευδεῖς
  choice: falsas testemunhas
  rationale: É a expressão jurídica corrente para pessoas que prestam testemunho falso.
- source_word: λέγοντας
  choice: que disseram
  rationale: A oração relativa finita é mais natural em português e mantém a relação entre as testemunhas e sua declaração.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Este homem
  rationale: Reproduz a referência direta e algo depreciativa sem recorrer a uma expressão coloquial mais intensa.
- source_word: οὐ παύεται
  choice: não para de
  rationale: Comunica com clareza atual a ação contínua expressa pelo grego; “não cessa de” seria uma alternativa mais formal.
- source_word: λαλῶν ῥήματα
  choice: proferir palavras
  rationale: Representa o objeto explícito ῥήματα e soa mais idiomático e digno em português do que “falar palavras”, preservando o teor acusatório.
- source_word: κατὰ
  choice: contra
  rationale: No contexto de uma acusação hostil, a preposição com genitivo expressa oposição dirigida ao lugar santo e à lei.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: este lugar santo
  rationale: Embora o grego use artigos, o templo é o lugar localmente presente e saliente; o demonstrativo transmite naturalmente essa referência contextual.
- source_word: νόμου
  choice: a lei
  rationale: Refere-se à lei mosaica no contexto judaico; a forma comum preserva o referente sem explicitação interpretativa.
theological_decisions:
- issue: Referência de “este lugar santo” e “a lei”
  choice: A acusação diz respeito ao templo de Jerusalém e à lei mosaica, sem inserir essas explicações no corpo do versículo.
  alternative: Entender as expressões de modo geral como espaço sagrado e tradição jurídica.
  rationale: O contexto imediato de Atos trata das acusações contra Estêvão relacionadas ao templo e a Moisés. A tradução conserva a formulação dos acusadores e a nota esclarece apenas o referente contextual do lugar.
- issue: Tom da acusação
  choice: Preservar o tom jurídico hostil com “proferir palavras contra”.
  alternative: Empregar termos interpretativos mais fortes, como “blasfemar” ou “difamar”.
  rationale: O grego descreve palavras ditas contra o lugar santo e a lei, mas não usa aqui um verbo específico para blasfemar; por isso, não se intensifica a acusação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apresentaram” mantém o cenário judicial; “proferir palavras” conserva o elemento explícito ῥήματα sem a falta de naturalidade de “falar palavras”. A repetição de “contra” torna clara a relação da preposição com ambos os objetos.
