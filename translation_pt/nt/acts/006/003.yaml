  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: pt
  text: Mas, irmãos[a], escolham dentre vocês sete homens de boa reputação[b], cheios do Espírito[c] e de sabedoria, aos quais designaremos para esta tarefa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega a forma masculina “irmãos”; neste contexto, a maneira de se dirigir ao grupo pode abranger a comunidade mais ampla dos que creem.
    reason: cultural_note
  - marker: b
    text: Ou “dos quais se dê bom testemunho”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cheios do espírito e de sabedoria”. A provável referência é ao Espírito Santo, mas o grego diz literalmente “Espírito”, sem acrescentar “Santo”.
    reason: alternative_reading
  - marker: d
    text: “Esta tarefa” refere-se à necessidade prática da distribuição diária mencionada no contexto imediato.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: escolham
  rationale: O imperativo pede que a comunidade identifique e selecione homens qualificados. “Escolham” é natural em português e comunica a ação deliberada exigida pelo contexto.
- source_word: δέ
  choice: Por isso
  rationale: A partícula faz a transição da explicação dos apóstolos, no versículo anterior, para a providência proposta à comunidade. “Por isso” expressa essa ligação contextual sem introduzir um contraste forte.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego. No contexto, a saudação pode dirigir-se à comunidade mais ampla dos que creem, possibilidade registrada em nota.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: dentre vocês sete homens
  rationale: ἄνδρας especifica homens adultos, e ἐξ ὑμῶν indica que deveriam ser escolhidos no próprio meio da comunidade.
- source_word: μαρτυρουμένους
  choice: de boa reputação
  rationale: O particípio descreve pessoas das quais outros dão testemunho favorável. “De boa reputação” transmite isso de maneira clara e idiomática; a formulação mais literal é indicada em nota.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: cheios do Espírito e de sabedoria
  rationale: Mantém a coordenação entre Espírito e sabedoria e reproduz a ideia de plenitude. A inicial maiúscula sinaliza a provável referência ao Espírito de Deus em Lucas–Atos, sem acrescentar “Santo” ao texto principal.
- source_word: καταστήσομεν ἐπὶ τῆς χρείας ταύτης
  choice: encarregaremos desta tarefa
  rationale: O verbo indica designação para uma responsabilidade, e χρεία, neste contexto, é a tarefa prática que precisava de atenção. A formulação portuguesa é direta e preserva a ideia de incumbência.
theological_decisions:
- issue: Se πνεύματος designa genericamente o espírito ou especificamente o Espírito de Deus
  choice: o Espírito
  alternative: o espírito; o Espírito Santo
  rationale: O uso em Lucas–Atos e o contexto de qualificação para o serviço favorecem a referência ao Espírito de Deus. Como o grego não traz ἁγίου (“Santo”), o texto principal diz apenas “o Espírito”, preservando a forma e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe permanece próxima do encadeamento grego sem soar artificial.
