id: ACT.6.5
reference: Acts 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: pt
  text: A proposta agradou a toda a comunidade, e eles escolheram Estêvão, homem cheio de fé[a] e do Espírito Santo, Filipe, Prócoro, Nicanor, Timão, Pármenas e Nicolau, prosélito[b] de Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. A palavra grega pode indicar fé, confiança ou fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Prosélito era um gentio convertido ao judaísmo.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: a proposta
  rationale: No contexto, refere-se ao que os apóstolos acabavam de propor, não à 'palavra' em sentido abstrato.
- source_word: ἤρεσεν
  choice: agradou
  rationale: Expressa de modo direto e natural que a proposta recebeu aprovação.
- source_word: ἐνώπιον παντὸς τοῦ πλήθους
  choice: a toda a comunidade
  rationale: Com ἀρέσκω, a expressão indica que todo o grupo reunido aprovou a proposta; 'comunidade' é natural sem impor terminologia eclesiástica posterior.
- source_word: ἐξελέξαντο
  choice: eles escolheram
  rationale: Tradução direta e corrente do verbo médio, que indica a escolha feita pelo próprio grupo.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: homem cheio de fé e do Espírito Santo
  rationale: Mantém a caracterização explícita de Estêvão e reproduz naturalmente o sentido da construção grega, apesar da irregularidade de concordância de πλήρης.
- source_word: πίστεως
  choice: fé
  rationale: É a acepção mais provável e natural neste contexto; 'fidelidade' continua possível e é preservada em nota.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: Em Atos, a expressão normalmente designa o Espírito Santo divino.
- source_word: προσήλυτον
  choice: prosélito
  rationale: Termo historicamente preciso para um gentio convertido ao judaísmo; a nota esclarece o sentido.
- source_word: Ἀντιοχέα
  choice: de Antioquia
  rationale: Expressa de forma idiomática a associação de Nicolau com a cidade de Antioquia.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Estêvão, Filipe, Prócoro, Nicanor, Timão, Pármenas e Nicolau
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes em português, apresentando os sete como um único grupo escolhido.
theological_decisions:
- issue: Sentido de πίστις na descrição de Estêvão
  choice: fé
  alternative: fidelidade
  rationale: A palavra pode indicar fé, confiança ou fidelidade. Neste contexto, 'fé' é a leitura mais provável e tradicional, enquanto a alternativa legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. 'Comunidade' comunica naturalmente o grupo inteiro reunido; a lista usa pontuação portuguesa corrente em vez de reproduzir o polissíndeto grego.
