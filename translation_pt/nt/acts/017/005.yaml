  to: Mas os judeus, tomados de inveja, levaram consigo alguns homens perversos da praça do mercado, formaram uma turba e alvoroçavam a cidade; e, chegando à casa de Jasom, procuravam levá-los para fora, diante da assembleia pública[a].
