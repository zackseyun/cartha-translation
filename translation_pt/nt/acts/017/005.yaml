  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: pt
  text: Mas os judeus, tomados de inveja, levaram consigo alguns homens perversos da praça do mercado, formaram uma turba e alvoroçavam a cidade; e, chegando à casa de Jasom, procuravam levá-los para fora, diante da assembleia pública[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do povo reunido”. O termo grego δῆμος se refere ao corpo cívico reunido em público, não simplesmente a uma multidão indefinida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: tomados de ciúme
  rationale: Expressa o motivo que antecede as ações principais e comunica de modo natural o valor contextual de ζηλόω, sem reduzir a ideia a mera irritação.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Reproduz diretamente a designação do texto grego. O contexto limita a referência ao grupo opositor em Tessalônica, mas o léxico não autoriza substituí-la por 'líderes judeus'.
- source_word: προσλαβόμενοι
  choice: levaram consigo
  rationale: Preserva o sentido do particípio médio, segundo o qual eles agregaram outras pessoas ao próprio grupo, sem pressupor recrutamento formal ou pagamento.
- source_word: τῶν ἀγοραίων
  choice: da praça do mercado
  rationale: Mantém a associação dessas pessoas com a ágora, a praça pública e comercial, sem acrescentar a ideia interpretativa de que fossem desocupados.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: alguns homens perversos
  rationale: Conserva tanto a referência específica a homens quanto a avaliação moral negativa de πονηρούς.
- source_word: ὀχλοποιήσαντες
  choice: formaram uma turba
  rationale: Comunica a formação deliberada de uma multidão hostil; 'turba' preserva a conotação de desordem presente no contexto.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: causavam tumulto na cidade
  rationale: O imperfeito é representado por uma ação em andamento, e a formulação transmite claramente a perturbação pública indicada por θορυβέω.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: dirigindo-se à casa de Jasom
  rationale: Representa a chegada hostil ao local sem intensificar o verbo para 'atacar', sentido possível no contexto, mas não lexicalmente necessário.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: Mantém o aspecto durativo do imperfeito e deixa aberta a nuance entre buscar e tentar conseguir o objetivo.
- source_word: αὐτοὺς
  choice: levá-los
  rationale: Preserva o pronome do grego, permitindo que o contexto determine seus referentes, em vez de explicitar interpretativamente Paulo e Silas.
- source_word: προαγαγεῖν
  choice: levá-los para fora
  rationale: Expressa o movimento para fora da casa e em direção à apresentação pública, preservando a orientação espacial do verbo.
- source_word: εἰς τὸν δῆμον
  choice: à assembleia pública
  rationale: δῆμος designa aqui o corpo cívico reunido, não apenas uma multidão indefinida; 'assembleia pública' torna esse sentido institucional acessível ao leitor moderno.
theological_decisions:
- issue: A designação οἱ Ἰουδαῖοι em uma narrativa de conflito
  choice: os judeus
  alternative: os líderes judeus; os judeus da Judeia
  rationale: A tradução acompanha a formulação grega sem restringir o referente a líderes nem transformá-lo em designação geográfica. Pelo contexto, trata-se de um grupo específico de judeus de Tessalônica, e não do povo judeu em geral.
- issue: Natureza do δῆμος diante do qual pretendiam apresentar os missionários
  choice: assembleia pública
  alternative: o povo; a multidão
  rationale: A opção conserva o caráter cívico e público do termo, evitando confundi-lo com a turba que acabara de ser formada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. 'Jasom' segue a forma tradicional e reconhecível do nome bíblico em português. A repetição de ações coordenadas conserva o ritmo cumulativo do grego; os imperfeitos são vertidos como ações em curso. O marcador da nota foi colocado após 'assembleia pública', expressão efetivamente explicada pela nota.
