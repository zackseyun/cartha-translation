  terminology: “Areópago” e “ensino” são escolhas apropriadas. A nota cultural preserva corretamente a ambiguidade entre o monte e o conselho. A alternativa literal da nota lexical é útil, mas a alternativa principal deve evitar intensificar λαλουμένη.
