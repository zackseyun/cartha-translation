  to: 'Então, segurando-o, levaram-no ao Areópago[a] e disseram: “Podemos saber que novo ensino é esse que você está apresentando?[b]”'
  rationale: Substitui-se “anunciando” por “apresentando”, uma formulação portuguesa natural que reproduz de modo mais neutro o sentido de λαλουμένη e mantém a voz ativa idiomática. A nota conserva a formulação passiva mais próxima da estrutura grega e registra uma alternativa corrente. Não se resolve a ambiguidade histórica de “Areópago” nem se intensifica a ação contra Paulo.
