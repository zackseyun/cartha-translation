id: ACT.17.19
reference: Acts 17:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: pt
  text: 'Então, segurando-o, levaram-no ao Areópago[a] e disseram: “Podemos saber que novo ensino é esse que você está apresentando?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Areópago” pode referir-se ao próprio monte ou ao conselho associado a ele. Tradicionalmente, o lugar também é chamado de “Monte de Marte”.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “que está sendo falado por você”; também pode ser traduzido: “que você está ensinando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: segurando-o
  rationale: Preserva a iniciativa física e a possível firmeza do verbo sem exagerá-lo como prisão ou ato necessariamente hostil.
- source_word: τε
  choice: Então
  rationale: Expressa de modo natural a conexão e a progressão narrativa indicada pela partícula.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: ao Areópago
  rationale: Mantém o nome próprio grego e não decide no texto principal se a referência é ao monte, ao conselho associado a ele ou a ambos.
- source_word: ἤγαγον
  choice: levaram-no
  rationale: Equivalente português natural de ἄγω neste contexto de condução a um destino.
- source_word: λέγοντες
  choice: e disseram
  rationale: Converte o particípio contemporâneo em coordenação natural em português, sem alterar a sequência da ação.
- source_word: Δυνάμεθα γνῶναι
  choice: Podemos saber
  rationale: Funciona naturalmente como pedido cortês e conserva a forma interrogativa ligada à capacidade ou possibilidade.
- source_word: καινὴ
  choice: novo
  rationale: Comunica de maneira ampla e corrente a novidade do ensino para os ouvintes.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: que você está anunciando
  rationale: Reproduz em português corrente a ação atribuída a Paulo. 'Anunciando' se ajusta ao contexto de exposição pública sem intensificar o sentido até 'proclamando'; a forma passiva mais literal é registrada em nota.
- source_word: διδαχή
  choice: ensino
  rationale: É claro, moderno e menos técnico ou eclesiástico que 'doutrina'.
theological_decisions:
- issue: Nuance da condução de Paulo ao Areópago
  choice: Acompanhamento físico firme, mas não necessariamente hostil
  alternative: Prisão formal; ou simples convite cortês
  rationale: ἐπιλαμβάνομαι pode indicar que alguém foi agarrado ou segurado, mas o contexto imediato enfatiza curiosidade. A formulação evita tanto apagar o contato físico quanto afirmar uma prisão.
- issue: Sentido de Ἄρειος Πάγος
  choice: Areópago, sem especificar no texto principal se é o monte ou o conselho
  alternative: Monte de Marte; ou conselho do Areópago
  rationale: A expressão grega pode designar o lugar e também o órgão a ele associado. A ambiguidade histórica é preservada.
- issue: Voz de ὑπὸ σοῦ λαλουμένη
  choice: 'Forma ativa idiomática: ''que você está anunciando'''
  alternative: 'Forma passiva mais literal: ''que está sendo falado por você'''
  rationale: A forma ativa comunica naturalmente o mesmo agente e a mesma ação em português; a nota preserva a estrutura formal do grego.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. 'Você' corresponde ao singular σοῦ e soa natural no discurso direto. A ordem foi ajustada para fluência sem eliminar as ambiguidades relevantes do grego.
