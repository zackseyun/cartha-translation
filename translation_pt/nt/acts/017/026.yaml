  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: pt
  text: De um só homem, ele fez todas as nações da humanidade, para que habitassem sobre toda a face da terra[a], tendo determinado os tempos previamente estabelecidos[b] e os limites de suas habitações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «de um só sangue» em vez de «de um só». O texto principal segue a leitura da SBLGNT, «de um só», acrescentando «homem» para deixar claro o referente implícito.
    reason: textual_variant
  - marker: b
    text: 'Ou: «os tempos estabelecidos para elas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: fez
  rationale: Mantém o sentido amplo de ποιέω, apresentando Deus como aquele que deu origem às nações, sem especificar indevidamente o modo desse ato.
- source_word: τε
  choice: '[conexão expressa pela continuidade da frase]'
  rationale: A partícula liga esta afirmação ao argumento anterior; em português, a continuidade pode ser preservada naturalmente sem um conectivo inicial obrigatório.
- source_word: ἐξ ἑνὸς
  choice: de um só homem
  rationale: O grego diz literalmente «de um só». «Homem» explicita o referente humano implícito e produz uma formulação completa e natural em português, sem adotar a variante «sangue».
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: todas as nações da humanidade
  rationale: O singular distributivo πᾶν ἔθνος é expresso naturalmente pelo plural «todas as nações»; «da humanidade» deixa claro que se trata dos diversos povos humanos.
- source_word: κατοικεῖν
  choice: para que habitassem
  rationale: A oração final expressa de modo natural a finalidade ou o resultado do infinitivo grego e conserva a ideia de residência duradoura.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: sobre toda a face da terra
  rationale: Preserva a imagem bíblica de «face da terra», ainda clara e digna em português moderno.
- source_word: ὁρίσας
  choice: tendo determinado
  rationale: O particípio indica o ato divino de definir ou estabelecer; a construção mantém sua relação com o verbo principal sem impor uma sequência temporal excessivamente rígida.
- source_word: προστεταγμένους καιρούς
  choice: os tempos previamente estabelecidos
  rationale: καιροί indica períodos ou épocas significativas, e προστεταγμένους comunica que foram ordenados ou estabelecidos de antemão.
- source_word: ὁροθεσίας
  choice: os limites
  rationale: Expressa de modo direto a ideia de fronteiras ou delimitações territoriais.
- source_word: τῆς κατοικίας αὐτῶν
  choice: do lugar onde habitariam
  rationale: Torna natural em português o singular coletivo κατοικία e mantém a referência aos espaços de habitação das nações.
theological_decisions:
- issue: Explicitação do referente de ἐξ ἑνὸς
  choice: de um só homem
  alternative: de um só; de um só antepassado
  rationale: A leitura da SBLGNT não contém «sangue». A explicitação «homem» identifica o referente humano implícito sem importar a variante textual e preserva a afirmação da origem comum das nações.
- issue: Alcance de πᾶν ἔθνος ἀνθρώπων
  choice: todas as nações da humanidade
  alternative: cada nação humana; todo povo humano
  rationale: A formulação mantém simultaneamente a diversidade das nações e sua pertença à humanidade comum, sem reduzir ἔθνος à humanidade como um todo indiferenciado.
- issue: Natureza dos tempos e limites determinados por Deus
  choice: tempos previamente estabelecidos e limites do lugar onde habitariam
  alternative: tempos estabelecidos para elas e fronteiras de suas habitações
  rationale: A tradução conserva a afirmação de determinação divina, mas não especifica além do texto se os «tempos» são épocas históricas, durações nacionais ou estações, nem define com precisão política os «limites».
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a expressão bíblica «face da terra», evita arcaísmos como «estirpe» e mantém abertas as possíveis referências históricas de καιροί e ὁροθεσίαι.
