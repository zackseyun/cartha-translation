  source_fidelity: A tradução preserva adequadamente a construção temporal de ἐκδεχομένου, o aspecto imperfeito da reação de Paulo, a referência ao seu próprio espírito e a descrição de Atenas como repleta de ídolos. «Ao ver» comunica bem o particípio contemporâneo θεωροῦντος. A força transicional leve de δέ é suficientemente absorvida pela construção portuguesa, sem introduzir um «agora» não expresso.
  naturalness: O texto é claro, fluente e digno em português moderno de ampla compreensão. «Enquanto Paulo os esperava em Atenas» e «ao ver que a cidade estava cheia de ídolos» soam naturais. A formulação «seu espírito se indignava dentro dele» mantém deliberadamente a ênfase interior do original e continua compreensível.
  terminology: «Espírito» é a escolha direta e teologicamente não intrusiva para τὸ πνεῦμα αὐτοῦ. «Ídolos» traduz corretamente εἴδωλα no composto κατείδωλον. A nota oferece uma alternativa lexical legítima sem impor uma leitura doutrinária.
