id: ACT.17.16
reference: Acts 17:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: pt
  text: Enquanto Paulo os esperava em Atenas, seu espírito se indignava dentro dele ao ver que a cidade estava cheia de ídolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estava coberta de ídolos»; o termo grego descreve a cidade como repleta deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: enquanto ... esperava
  rationale: O particípio genitivo fornece a circunstância temporal e apresenta a espera de Paulo como contínua; a formulação é natural em português.
- source_word: παρωξύνετο
  choice: se indignava
  rationale: O imperfeito expressa uma reação interior contínua e intensa. «Indignava-se» comunica agitação provocada pelo que Paulo via, sem reduzir a reação apenas à tristeza.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: seu espírito
  rationale: Mantém a expressão possessiva do grego e aponta para o espírito do próprio Paulo, sem introduzir explicitamente o Espírito Santo.
- source_word: ἐν αὐτῷ
  choice: dentro dele
  rationale: Preserva a ênfase na localização interior da reação de Paulo.
- source_word: θεωροῦντος
  choice: ao ver
  rationale: Expressa de modo conciso e natural a percepção contemporânea à reação interior.
- source_word: κατείδωλον
  choice: cheia de ídolos
  rationale: O adjetivo raro descreve Atenas como repleta de ídolos; esta opção é clara e menos interpretativa que «entregue à idolatria».
- source_word: πόλιν
  choice: a cidade
  rationale: Conserva o substantivo explícito do grego, cujo referente é Atenas.
- source_word: δὲ
  choice: Enquanto
  rationale: O valor transicional leve de δέ não exige uma conjunção portuguesa autônoma; a oração temporal conduz naturalmente a narrativa sem acrescentar um «agora» inexistente no texto.
theological_decisions:
- issue: Referente de «espírito»
  choice: O espírito humano de Paulo
  alternative: Uma referência à atuação ou ao impulso do Espírito Santo
  rationale: O possessivo «seu» e a expressão «dentro dele» apresentam a reação interior de Paulo. A tradução não atribui explicitamente essa reação ao Espírito Santo, pois o versículo não o faz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando o aspecto contínuo da espera e da reação interior. O pronome «os» retém o referente plural fornecido pelo contexto.
