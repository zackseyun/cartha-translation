source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: pt
  text: Os irmãos[a] enviaram imediatamente Paulo e Silas de noite para Bereia. Quando chegaram, entraram na sinagoga dos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «irmãos e irmãs». O grego diz «irmãos», termo que pode abranger a comunidade de fiéis em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Mantém o substantivo masculino plural do grego e sua linguagem familiar para os membros da comunidade cristã; o contexto pode incluir também mulheres.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa com clareza a prontidão da ação.
- source_word: διὰ νυκτός
  choice: durante a noite
  rationale: Reproduz naturalmente o valor temporal da construção grega com διά e genitivo.
- source_word: ἐξέπεμψαν
  choice: enviaram
  rationale: No contexto, o destino e o período noturno deixam claro que Paulo e Silas foram mandados para fora da cidade; acrescentar «embora» ou «às pressas» iria além do texto.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paulo e Silas
  rationale: A coordenação portuguesa identifica naturalmente os dois homens; a força correlativa de τε...καί não exige a formulação mais pesada «tanto Paulo como Silas».
- source_word: Βέροιαν
  choice: Bereia
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português.
- source_word: οἵτινες παραγενόμενοι
  choice: Quando chegaram, eles
  rationale: Converte a construção relativa com particípio em uma oração temporal natural, preservando a sequência narrativa.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: sinagoga dos judeus
  rationale: Preserva de modo transparente a construção genitiva e identifica a sinagoga da comunidade judaica local, sem sentido depreciativo.
- source_word: ἀπῄεσαν
  choice: foram à
  rationale: A combinação com εἰς indica movimento em direção à sinagoga; «foram à» é corrente e digna em português.
theological_decisions:
- issue: Alcance de ἀδελφοὶ numa comunidade que pode incluir homens e mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina do grego sem excluir a possibilidade contextual de referência à comunidade cristã mais ampla; a alternativa inclusiva é registrada em nota.
- issue: Sentido de τῶν Ἰουδαίων
  choice: dos judeus
  alternative: judaica
  rationale: A formulação segue a estrutura do grego e designa a comunidade à qual pertencia a sinagoga, sem formular qualquer avaliação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para evitar ambiguidade e manter «durante a noite» ligado ao envio. O marcador da nota foi colocado junto de «irmãos», seu referente correto.
