id: ACT.17.30
reference: Acts 17:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: pt
  text: Portanto, tendo passado por alto os tempos da ignorância[a], Deus agora ordena que todas as pessoas, em toda parte, se arrependam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tendo passado por cima dos tempos da ignorância». A ideia não é que Deus tenha aprovado essa ignorância, mas que a tolerou sem executar imediatamente o juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: Portanto ... os tempos
  rationale: οὖν assinala a progressão do argumento, enquanto μὲν prepara o contraste entre os tempos anteriores e o agora; em português, a construção participial e o advérbio «agora» preservam esse movimento sem acrescentar uma concessão explícita.
- source_word: τῆς ἀγνοίας
  choice: da ignorância
  rationale: Mantém o substantivo abstrato do grego e evita explicitar «acerca de Deus», ideia contextual que não está lexicalmente expressa.
- source_word: ὑπεριδὼν
  choice: tendo deixado de lado
  rationale: Expressa a ação anterior de Deus sem sugerir aprovação. Preserva alguma abertura semântica entre não levar imediatamente em conta e passar por cima, esclarecida na nota.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente direto do sujeito nominativo.
- source_word: τὰ νῦν
  choice: agora
  rationale: Marca claramente o contraste temporal entre os tempos da ignorância e a situação presente.
- source_word: παραγγέλλει
  choice: ordena
  rationale: Conserva a força autoritativa de παραγγέλλω, mais forte que simplesmente anunciar ou aconselhar.
- source_word: τοῖς ἀνθρώποις πάντας
  choice: que todas as pessoas
  rationale: A construção portuguesa com oração infinitiva comunica naturalmente o destinatário humano genérico e a totalidade indicada por πάντας, sem restringi-la aos homens do sexo masculino.
- source_word: πανταχοῦ
  choice: em toda parte
  rationale: Equivalente idiomático e corrente do advérbio de lugar, ressaltando o alcance universal.
- source_word: μετανοεῖν
  choice: se arrependam
  rationale: «Arrepender-se» é o termo português corrente que preserva as dimensões mental, moral e volitiva do verbo, sem reduzi-lo apenas a mudar de opinião.
theological_decisions:
- issue: Sentido da ação anterior de Deus em relação aos «tempos da ignorância»
  choice: Deus os deixou de lado, no sentido de não os tratar imediatamente segundo o juízo que mereciam, sem indicar aprovação.
  alternative: Deus ignorou ou desculpou completamente a idolatria e o pecado.
  rationale: ὑπεριδών admite a noção de passar por cima ou não levar imediatamente em conta; a ordem presente de arrependimento mantém a responsabilidade humana e impede que a frase seja entendida como aprovação divina.
- issue: Alcance da ordem de arrependimento
  choice: A ordem alcança todas as pessoas, em toda parte.
  alternative: A ordem se limita aos homens do sexo masculino ou somente aos gentios presentes.
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ tem referência humana genérica e abrangente; a tradução mantém explicitamente essa universalidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem «Deus agora ordena» conserva a ênfase temporal. «Todas as pessoas» traduz a referência humana genérica, e «se arrependam» evita reduzir μετανοεῖν a mera mudança intelectual.
