  rationale: O aoristo de ἐξέρχομαι indica sair ou retirar-se. “Saiu” preserva o movimento concreto do verbo e combina naturalmente com a expressão seguinte.
- source_word: ἐκ μέσου αὐτῶν
  choice: do meio deles
  rationale: A expressão indica que Paulo deixou o lugar que ocupava entre os integrantes do grupo. “Do meio deles” mantém a imagem espacial do grego sem perder naturalidade em português.
