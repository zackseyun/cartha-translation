source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: pt
  text: 'Pois, enquanto eu passava e observava atentamente os objetos de culto de vocês, encontrei até mesmo um altar em que estava inscrito: “A um deus desconhecido”.[a] Portanto, aquilo que vocês adoram sem conhecer, isso eu anuncio a vocês.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao deus desconhecido”. O grego não traz artigo; por isso, tanto a forma indefinida quanto a definida são possíveis em português.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquele a quem vocês adoram sem conhecer”. Algumas traduções personalizam o referente, mas o grego usa um pronome relativo neutro, literalmente “aquilo que”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: enquanto eu passava
  rationale: Expressa de modo natural o valor temporal e progressivo do particípio presente no contexto da explicação introduzida por γάρ.
- source_word: ἀναθεωρῶν
  choice: observava atentamente
  rationale: Comunica a ideia de exame cuidadoso, e não de um simples olhar.
- source_word: σεβάσματα
  choice: objetos de culto
  rationale: Mantém a amplitude do termo para coisas religiosas veneradas, sem restringi-lo a templos, santuários ou imagens.
- source_word: βωμόν
  choice: altar
  rationale: Equivalente português usual e preciso para o altar de culto mencionado.
- source_word: ἐπεγέγραπτο
  choice: estava inscrito
  rationale: 'Preserva o sentido passivo e resultativo: a inscrição já se encontrava gravada no altar.'
- source_word: Ἀγνώστῳ θεῷ
  choice: A um deus desconhecido
  rationale: A ausência de artigo no grego permite naturalmente a leitura indefinida, adequada a uma fórmula dedicatória em português.
- source_word: ὃ οὖν
  choice: Portanto, aquilo que
  rationale: Conserva tanto a inferência de οὖν quanto o gênero neutro do pronome relativo ὃ.
- source_word: ἀγνοοῦντες
  choice: sem conhecer
  rationale: Expressa a circunstância modal do culto e mantém o contraste retórico com “desconhecido” sem tornar a frase artificial.
- source_word: εὐσεβεῖτε
  choice: vocês adoram
  rationale: No contexto, comunica com clareza a devoção religiosa dirigida ao objeto indicado pela inscrição.
- source_word: καταγγέλλω
  choice: eu anuncio
  rationale: Transmite a declaração pública de Paulo em português corrente e digno.
theological_decisions:
- issue: Referência do pronome relativo neutro ὃ
  choice: aquilo que vocês adoram sem conhecer
  alternative: aquele a quem vocês adoram sem conhecer
  rationale: O grego emprega um pronome neutro, referindo-se ao objeto de culto indicado pela inscrição. A tradução impessoal preserva a formulação e a tensão retórica do texto, sem personalizar o referente além do que a gramática explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Objetos de culto” evita uma formulação excessivamente técnica e preserva a abrangência do grego; a retomada “aquilo... isso” conserva a ênfase da construção original.
