id: ACT.17.34
reference: Acts 17:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: pt
  text: Mas alguns homens se uniram a ele e creram. Entre eles estavam Dionísio, o areopagita[a], uma mulher chamada Dâmaris e outros com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Areopagita” pode significar membro do Areópago ou alguém ligado a esse conselho.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Mas alguns homens
  rationale: Mantém o contraste leve de δέ com a reação anterior, traduz o indefinido τινές de modo natural e preserva o masculino explícito de ἄνδρες.
- source_word: κολληθέντες αὐτῷ
  choice: se uniram a ele
  rationale: Expressa a ideia de associação pessoal próxima com Paulo sem a estranheza de uma tradução excessivamente literal como “se colaram a ele”.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: Tradução direta que não acrescenta um objeto não expresso nem desenvolve uma fórmula doutrinária além do texto.
- source_word: ἐν οἷς καὶ
  choice: Entre eles estavam
  rationale: Introduz naturalmente, em português, exemplos específicos dentre os que creram; a função aditiva de καί fica clara pela enumeração.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionísio, o areopagita
  rationale: Usa as formas tradicionais e reconhecíveis em português, preservando a designação grega sem decidir além do necessário sua relação exata com o Areópago.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: uma mulher chamada Dâmaris
  rationale: Formulação direta, natural e fiel, com a forma portuguesa consagrada do nome.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: outros com eles
  rationale: Preserva de modo conciso a referência a pessoas adicionais que acompanhavam os dois indivíduos nomeados.
theological_decisions:
- issue: Sentido de ἐπίστευσαν no contexto
  choice: creram
  alternative: vieram a crer
  rationale: “Creram” afirma a resposta de fé relatada pela narrativa sem especificar indevidamente um objeto gramatical ou uma formulação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada em duas frases para evitar um período pesado. A proximidade pessoal sugerida por κολλάομαι é comunicada por “se uniram a ele”; não foi acrescentada nota, pois a expressão é suficientemente clara. O marcador [a] aparece imediatamente após o termo explicado.
