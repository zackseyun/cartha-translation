source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: pt
  text: Estes eram mais nobres de espírito do que os de Tessalônica[a], pois receberam a palavra[b] com todo o entusiasmo, examinando diariamente as Escrituras para ver se essas coisas eram assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais nobres». O grego pode indicar tanto uma disposição mais digna de elogio quanto, com menor probabilidade neste contexto, uma posição social mais elevada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «acolheram a mensagem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: mais nobres de espírito
  rationale: O comparativo pode indicar nobreza social ou, como sugere a explicação que se segue, uma disposição digna de elogio. A expressão conserva a ideia de nobreza sem atribuir necessariamente posição aristocrática.
- source_word: οἵτινες
  choice: pois
  rationale: O pronome relativo introduz uma explicação da avaliação anterior; «pois» expressa naturalmente essa relação em português.
- source_word: ἐδέξαντο τὸν λόγον
  choice: receberam a palavra
  rationale: Mantém o sentido básico do verbo e a ressonância narrativa e teológica de λόγος em Atos, sem reduzir a expressão a uma paráfrase.
- source_word: μετὰ πάσης προθυμίας
  choice: com toda a disposição
  rationale: προθυμία comunica prontidão, boa vontade e entusiasmo; «toda a disposição» preserva também a força intensificadora de πάσης.
- source_word: τὸ καθ’ ἡμέραν
  choice: diariamente
  rationale: A locução funciona adverbialmente e indica prática habitual.
- source_word: ἀνακρίνοντες
  choice: examinando
  rationale: O verbo denota exame ou investigação cuidadosa; «examinando» é claro e preserva essa nuance sem soar excessivamente técnico.
- source_word: τὰς γραφὰς
  choice: as Escrituras
  rationale: No contexto, refere-se às Escrituras sagradas judaicas, conforme o uso de Lucas–Atos.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: para ver se essas coisas eram assim
  rationale: Reproduz de modo idiomático a pergunta indireta e preserva o ato de verificar as afirmações à luz das Escrituras.
theological_decisions:
- issue: Sentido de εὐγενέστεροι no contexto
  choice: disposição digna de elogio («mais nobres de espírito»)
  alternative: maior nobreza de nascimento ou posição social
  rationale: O próprio versículo caracteriza essa nobreza pela recepção pronta da palavra e pelo exame das Escrituras. A tradução principal favorece a leitura contextual sem eliminar a alternativa lexical, registrada em nota.
- issue: Tradução de λόγος
  choice: «a palavra»
  alternative: «a mensagem»
  rationale: «A palavra» permanece compreensível e conserva a continuidade da linguagem bíblica em Atos, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A sintaxe acompanha de perto o argumento grego, mas usa conectores e ordem naturais em português.
