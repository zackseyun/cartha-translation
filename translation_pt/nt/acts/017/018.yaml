source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: pt
  text: 'Alguns filósofos epicureus e estoicos também discutiam com ele[a], e alguns diziam: “O que esse tagarela[b] está querendo dizer?” Outros, porém, diziam: “Parece ser um anunciador de divindades estrangeiras”[c][d], pois ele anunciava as boas-novas a respeito de Jesus e da ressurreição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debatiam com ele” ou “conversavam com ele”; o verbo grego pode indicar conversa ativa, discussão ou debate.
    reason: lexical_alternative
  - marker: b
    text: “Tagarela” traduz um termo depreciativo ligado literalmente a um “catador de sementes”, aplicado a alguém considerado um coletor e repetidor de fragmentos de ideias.
    reason: cultural_note
  - marker: c
    text: Ou “demônios estrangeiros” ou “deuses estranhos”. Aqui, os falantes provavelmente se referem a seres divinos desconhecidos segundo sua própria visão pagã, não necessariamente a espíritos malignos no sentido cristão posterior.
    reason: alternative_reading
  - marker: d
    text: Alguns entendem que os atenienses podem ter confundido “a ressurreição” com o nome de outra divindade, pois Paulo anunciava Jesus e a ressurreição.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: discutiam com ele
  rationale: O verbo indica interação por meio de conversa, discussão ou debate. “Discutiam com ele” se ajusta ao ambiente filosófico sem exigir que a troca fosse necessariamente hostil; a nota preserva as demais nuances.
- source_word: σπερμολόγος
  choice: tagarela
  rationale: O termo é depreciativo e designa, literalmente, alguém que recolhe sementes; por extensão, alguém visto como catador e repetidor de fragmentos de ideias. “Tagarela” transmite o desprezo de modo compreensível, enquanto a imagem cultural é explicada em nota.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: O que esse tagarela está querendo dizer?
  rationale: A construção com optativo e ἄν expressa conjectura, aqui com tom desdenhoso. A formulação portuguesa é idiomática e conserva a ideia de tentativa ou intenção.
- source_word: Ξένων δαιμονίων
  choice: divindades estrangeiras
  rationale: No contexto pagão ateniense, δαιμόνια se refere a seres divinos segundo a perspectiva dos falantes, não necessariamente a espíritos malignos no sentido cristão posterior. “Divindades estrangeiras” representa adequadamente a acusação.
- source_word: καταγγελεὺς
  choice: anunciador
  rationale: O substantivo indica alguém que anuncia ou proclama publicamente. “Anunciador” é claro e preserva a relação lexical com o ato de anunciar mencionado na explicação seguinte.
- source_word: εὐηγγελίζετο
  choice: anunciava as boas-novas
  rationale: O verbo significa anunciar boas notícias. A tradução explícita conserva seu conteúdo próprio, em vez de reduzi-lo ao sentido mais geral de “pregar”.
- source_word: ἀνάστασιν
  choice: a ressurreição
  rationale: A narração de Lucas apresenta o conteúdo da mensagem de Paulo. O substantivo comum em minúscula evita transformar em certeza a possível compreensão ateniense da ressurreição como uma divindade personificada.
- source_word: τινὲς ... καί τινες ... οἱ δέ
  choice: Alguns ... Alguns ... Outros, porém
  rationale: A sequência distingue reações dentro do grupo e preserva com naturalidade o contraste marcado no grego.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: filósofos epicureus e estoicos
  rationale: É a forma natural em português para identificar os filósofos pertencentes às duas escolas mencionadas.
theological_decisions:
- issue: Sentido de δαιμόνια na fala de pagãos atenienses
  choice: divindades estrangeiras
  alternative: demônios estrangeiros; deuses estranhos
  rationale: “Demônios” importaria para a acusação uma conotação cristã posterior que provavelmente não corresponde às categorias religiosas dos falantes. A tradução mantém a perspectiva pagã sem endossá-la.
- issue: Possível personificação de ἀνάστασις
  choice: a ressurreição
  alternative: Ressurreição, entendida como o nome de uma divindade
  rationale: O texto narrativo explica que Paulo anunciava Jesus e a ressurreição, mas não declara explicitamente que os ouvintes tomaram ἀνάστασις como nome próprio. A tradução mantém o substantivo comum e registra a hipótese interpretativa em nota.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário de ampla compreensão e boa legibilidade brasileira. O tom depreciativo da primeira reação e a linguagem religiosa da segunda foram preservados sem acrescentar categorias confessionais.
