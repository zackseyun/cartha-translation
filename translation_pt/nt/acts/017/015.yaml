source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: pt
  text: Os que acompanhavam Paulo o levaram até Atenas[a] e, depois de receberem instruções[b] para Silas e Timóteo irem ao encontro dele o mais depressa possível, partiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Atenas”. A expressão grega ressalta que eles acompanharam Paulo até esse destino.
    reason: lexical_alternative
  - marker: b
    text: Ou “depois de receberem uma ordem”. O termo grego pode designar tanto uma instrução quanto uma ordem de caráter mais autoritativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: acompanhavam
  rationale: No contexto, o particípio descreve os homens que acompanhavam Paulo durante a viagem até seu destino. “Acompanhavam” é natural em português e não acrescenta uma ideia militar que “escoltavam” poderia sugerir.
- source_word: ἤγαγον
  choice: levaram
  rationale: O aoristo apresenta como concluída a ação de conduzir Paulo a Atenas. “Levaram” é a opção mais idiomática em português quando o ponto de referência é o local de partida.
- source_word: ἕως Ἀθηνῶν
  choice: até Atenas
  rationale: ἕως com o nome do lugar indica a extensão do percurso até aquele destino. “Até Atenas” preserva esse valor e soa natural em português.
- source_word: λαβόντες ἐντολήν
  choice: depois de receberem instruções
  rationale: O particípio é expresso naturalmente como uma oração temporal. ἐντολή pode indicar instrução ou ordem; “instruções” se ajusta ao encargo de transmitir a Silas e Timóteo o pedido urgente de Paulo, sem eliminar em nota a possibilidade de um sentido mais forte.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: para Silas e Timóteo
  rationale: πρός assinala os destinatários das instruções. A formulação portuguesa é concisa e deixa claro que elas deveriam ser transmitidas aos dois.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: para Silas e Timóteo irem ao encontro dele o mais depressa possível
  rationale: A oração explicita o conteúdo das instruções. “O mais depressa possível” comunica a urgência de ὡς τάχιστα, e “ao encontro dele” representa naturalmente o movimento indicado por πρὸς αὐτόν.
- source_word: ἐξῄεσαν
  choice: partiram
  rationale: O imperfeito encerra a cena narrando a saída dos acompanhantes. “Partiram” é claro, digno e idiomático no registro narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase mantém a sequência narrativa do grego, enquanto as orações participiais são vertidas de modo natural. Os marcadores [a] e [b] aparecem junto aos trechos pertinentes.
