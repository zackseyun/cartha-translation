id: ACT.17.14
reference: Acts 17:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: pt
  text: Então, os irmãos[a] enviaram Paulo imediatamente para seguir até o mar[b], mas Silas e Timóteo permaneceram ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “irmãos”, termo que pode designar coletivamente os fiéis.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao mar” ou “em direção ao mar”; a expressão grega pode indicar movimento até a costa, sem dar mais detalhes.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa com clareza e naturalidade a prontidão da ação.
- source_word: δὲ τότε
  choice: Então
  rationale: Marca a progressão temporal da narrativa sem tentar representar cada partícula grega por uma palavra distinta.
- source_word: ἐξαπέστειλαν
  choice: enviaram
  rationale: No contexto, indica que fizeram Paulo partir daquele lugar; “enviaram” comunica isso naturalmente em português, com o movimento explicitado pelo infinitivo seguinte.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Mantém a forma masculina plural do grego; no uso comunitário de Atos, o termo pode abranger o conjunto dos fiéis, possibilidade indicada em nota.
- source_word: πορεύεσθαι
  choice: para seguir
  rationale: Exprime o movimento pretendido após o envio e soa mais natural que a repetição “enviaram... para ir”.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: até o mar
  rationale: Preserva a ideia de movimento até a costa sem definir se Paulo seguiria viagem por mar.
- source_word: ὑπέμεινάν
  choice: permaneceram
  rationale: Aqui o verbo significa ficar num lugar, e não suportar uma dificuldade.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas e Timóteo
  rationale: Identifica naturalmente em português os dois que permaneceram; a referência conjunta aos dois fica clara sem exigir a construção mais pesada “tanto... como...”.
- source_word: ἐκεῖ
  choice: ali
  rationale: Equivalente locativo natural, remetendo ao lugar mencionado no contexto.
theological_decisions:
- issue: Sentido comunitário de ἀδελφοί
  choice: os irmãos
  alternative: os irmãos e as irmãs; os fiéis
  rationale: O texto principal conserva a forma lexical masculina do grego, enquanto a nota reconhece que, como designação da comunidade cristã, ela pode incluir homens e mulheres.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluidez narrativa, preservando a sequência temporal, a partida de Paulo, o contraste com a permanência de Silas e Timóteo e a ambiguidade geográfica da expressão referente ao mar.
