  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: pt
  text: Nem é servido por mãos humanas[a], como se precisasse de alguma coisa, pois ele mesmo dá a todos vida, fôlego e tudo o mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é cultuado por mãos humanas”. O verbo grego pode indicar serviço ou assistência prestados em contexto religioso; aqui, o sentido é que Deus não depende de serviços humanos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Nem
  rationale: Dá continuidade natural, em português, à descrição negativa do versículo anterior.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: por mãos humanas
  rationale: Preserva a imagem concreta do grego e sua associação com o serviço religioso prestado por seres humanos.
- source_word: θεραπεύεται
  choice: é servido
  rationale: Neste contexto, o verbo indica receber serviço ou assistência, especialmente em âmbito religioso, e não cura; a formulação mantém a ideia de que Deus não depende de cuidados humanos.
- source_word: προσδεόμενός τινος
  choice: como se precisasse de alguma coisa
  rationale: Expressa a força circunstancial e retórica do particípio sem transformar a frase numa afirmação mais categórica do que sua forma grega.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Conserva a ênfase no próprio Deus como aquele que dá, em contraste com uma divindade supostamente dependente.
- source_word: διδοὺς
  choice: dá
  rationale: A forma finita após 'pois' transmite de modo natural a relação explicativa do particípio grego.
- source_word: πᾶσι
  choice: a todos
  rationale: Mantém o alcance amplo e irrestrito do dativo sem especificar indevidamente apenas os seres humanos.
- source_word: ζωὴν
  choice: vida
  rationale: Equivalente direto e natural, em paralelo com 'respiração'.
- source_word: πνοὴν
  choice: respiração
  rationale: No par com 'vida', refere-se ao fôlego vital; 'respiração' é claro em português e evita a leitura indevida de 'espírito'.
- source_word: καὶ τὰ πάντα
  choice: e tudo o mais
  rationale: Reproduz a ampliação totalizante depois de 'vida' e 'respiração' com uma expressão portuguesa natural, evitando a possível impressão de que esses itens são simplesmente repetidos.
theological_decisions:
- issue: Se θεραπεύεται deve ser traduzido em termos explicitamente cultuais ou como serviço em sentido mais amplo
  choice: é servido
  alternative: é adorado; recebe assistência
  rationale: '''É servido'' abrange o serviço religioso sugerido pelo contexto sem restringir o verbo à adoração interior nem sugerir que Deus necessite de cuidados.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a imagem bíblica de 'mãos humanas', a ênfase de 'ele mesmo' e a tensão lexical de θεραπεύεται por meio de nota.
