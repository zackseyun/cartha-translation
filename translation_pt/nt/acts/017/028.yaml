id: ACT.17.28
reference: Acts 17:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: pt
  text: 'Pois nele vivemos, nos movemos e existimos, como até alguns dos poetas de vocês disseram: “Pois também somos descendência dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva de modo conciso a relação expressa pelo grego, sem explicitar além do texto se a ideia é esfera, dependência ou agência.
- source_word: κινούμεθα
  choice: nos movemos
  rationale: Equivalente natural e direto da forma média/passiva, mantendo o paralelismo com “vivemos” e “existimos”.
- source_word: ἐσμέν
  choice: existimos
  rationale: No primeiro enunciado, “existimos” comunica naturalmente o sentido existencial de εἰμί e evita a formulação portuguesa pouco clara “somos” sem predicativo.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: dos poetas de vocês
  rationale: Expressa em português corrente que se trata de poetas pertencentes ao ambiente cultural dos ouvintes.
- source_word: γένος
  choice: descendência
  rationale: Reproduz a linguagem de origem ou linhagem da citação e evita restringir o termo a “filhos”, que seria mais específico.
theological_decisions:
- issue: Sentido da existência “nele”
  choice: Manter “nele” sem paráfrase explicativa
  alternative: “por meio dele” ou “dependemos dele para viver”
  rationale: O grego permite uma formulação densa sobre a relação de todas as criaturas com Deus; uma paráfrase causal ou instrumental resolveria indevidamente essa amplitude.
- issue: Alcance de “somos descendência dele”
  choice: Conservar a afirmação citada sem qualificá-la
  alternative: Acrescentar uma explicação que a limite à criação ou à filiação espiritual
  rationale: O versículo cita poetas gregos no argumento de Paulo; o texto não explicita aqui a natureza exata dessa descendência, e a tradução não deve impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém o paralelismo retórico e a repetição de “pois” presente no grego, além de aspas para a citação poética.
