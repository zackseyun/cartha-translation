  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: pt
  text: Depois de receberem de Jasom e dos outros uma garantia suficiente[a], eles os soltaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma quantia suficiente”; provavelmente uma caução ou garantia legal destinada a assegurar uma conduta pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Depois de receberem
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. Em português, “depois de receberem” expressa naturalmente essa sequência; “receber” também se ajusta melhor a uma garantia entregue às autoridades.
- source_word: τὸ ἱκανὸν
  choice: uma garantia suficiente
  rationale: A expressão, neste contexto jurídico, provavelmente designa uma caução, fiança ou compromisso de valor adequado. A formulação preserva tanto a ideia de garantia quanto o sentido literal de suficiência, sem impor uma instituição jurídica moderna específica.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: de Jasom e dos outros
  rationale: παρά com genitivo indica a procedência da garantia. “Os outros” refere-se naturalmente às demais pessoas detidas ou envolvidas com Jasom.
- source_word: ἀπέλυσαν
  choice: soltaram
  rationale: No contexto de detenção por autoridades cívicas, o verbo significa liberar ou deixar ir. “Soltaram” é claro, atual e natural em português.
- source_word: αὐτούς
  choice: os
  rationale: Pronome acusativo plural que retoma Jasom e os demais; a colocação proclítica é natural depois do sujeito expresso “eles”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Garantia suficiente” mantém a relativa abertura do grego e evita termos jurídicos excessivamente específicos, como “fiança” ou “caução”, no texto principal.
