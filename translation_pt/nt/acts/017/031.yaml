id: ACT.17.31
reference: Acts 17:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: pt
  text: porque estabeleceu um dia em que julgará o mundo habitado com justiça, por meio de um homem que designou e, ao ressuscitá-lo dentre os mortos, deu a todos uma prova[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu a todos uma garantia”; mais literalmente, “deu fé a todos”. Neste contexto, a expressão grega indica prova ou garantia pública.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: porque
  rationale: Introduz a razão da convocação anterior ao arrependimento e preserva de modo natural a força causal.
- source_word: ἔστησεν ἡμέραν
  choice: estabeleceu um dia
  rationale: Comunica que Deus determinou uma data, com linguagem corrente e solene.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: em que julgará
  rationale: O futuro em português expressa com naturalidade a ação futura determinada; o contexto já comunica intenção e certeza.
- source_word: τὴν οἰκουμένην
  choice: o mundo habitado
  rationale: Preserva o sentido lexical de οἰκουμένη e o alcance humano universal do julgamento.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: No contexto de julgamento, 'com justiça' é a formulação portuguesa mais clara e idiomática, sem perder a ideia de retidão.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: por meio de um homem que designou
  rationale: A locução 'por meio de' exprime a agência de ἐν; 'um homem' preserva o gênero e a forma anartrosa, e 'designou' evita sugerir que o homem foi nomeado para um cargo sem explicitação no verso.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: deu a todos uma prova disso
  rationale: Neste idioma, πίστις significa garantia, certeza ou prova pública, não primariamente a fé subjetiva de cada pessoa.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: ao ressuscitá-lo dentre os mortos
  rationale: Exprime a ressurreição como o meio pelo qual Deus forneceu a prova e mantém a referência aos mortos no plural.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto do julgamento
  choice: com justiça
  alternative: em retidão
  rationale: A ideia pode ser expressa como justiça ou retidão. 'Com justiça' é mais natural em português neste contexto judicial e não restringe o caráter moral do termo.
- issue: Sentido de πίστις em πίστιν παρασχὼν πᾶσιν
  choice: uma prova
  alternative: uma garantia; literalmente, fé
  rationale: A combinação com παρέχω e a ressurreição como fundamento apontam para prova ou garantia pública. A nota preserva a forma mais literal e a alternativa sem impor que todos receberam fé salvadora.
- issue: Forma anartrosa de ἀνδρί
  choice: um homem
  alternative: o homem
  rationale: A tradução mantém a forma indefinida do grego, embora o referente seja identificável pelo contexto cristológico.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases melhora a compreensão sem alterar a relação lógica: a ressurreição é apresentada como a prova dada por Deus. O marcador [a] aparece junto à afirmação que a nota esclarece.'
