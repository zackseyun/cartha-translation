  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: pt
  text: Pois você está trazendo aos nossos ouvidos algumas coisas estranhas.[a] Queremos, portanto, saber o que essas coisas significam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coisas desconhecidas” ou “coisas estrangeiras”. O termo grego pode indicar aquilo que parece estranho por ser novo ou alheio ao ouvinte.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o que essas coisas querem ser”, expressão idiomática com o sentido de “o que essas coisas significam” ou “que importância elas têm”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: algumas coisas estranhas
  rationale: O particípio neutro plural com o pronome indefinido descreve conteúdos percebidos como incomuns, novos ou alheios pelos ouvintes. A formulação mantém tanto a indefinição quanto a reação dos atenienses.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: você está trazendo aos nossos ouvidos
  rationale: Preserva a imagem concreta de introduzir algo aos ouvidos e expressa naturalmente o aspecto contextual do presente em português.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Queremos, portanto, saber
  rationale: Traduz diretamente a vontade expressa por βουλόμεθα, o valor inferencial de οὖν e o infinitivo γνῶναι em português atual e digno.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: o que essas coisas significam
  rationale: A construção idiomática pergunta pelo sentido ou pela importância do que Paulo anuncia, não apenas pela identidade literal das coisas.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a declaração do versículo anterior.
