id: ACT.17.3
reference: Acts 17:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: pt
  text: explicando e demonstrando que o Messias[a] precisava sofrer e ressuscitar dentre os mortos[b], e que este Jesus, que eu anuncio a vocês, é o Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”, nas duas ocorrências de “o Messias”.
    reason: alternative_reading
  - marker: b
    text: Ou “ser ressuscitado dentre os mortos”. O grego emprega aqui um infinitivo ativo, “ressuscitar”, embora em outros textos o Novo Testamento também diga que Jesus foi ressuscitado por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: explicando
  rationale: O particípio descreve o ato de tornar claro o sentido das Escrituras no contexto da argumentação na sinagoga. “Explicando” é natural e inteligível em português atual.
- source_word: παρατιθέμενος
  choice: demonstrando
  rationale: O verbo indica apresentar elementos ou evidências diante dos ouvintes. “Demonstrando” complementa “explicando” sem sugerir uma prova estritamente formal.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: o Messias
  rationale: Nas duas ocorrências, Χριστός funciona claramente como título do ungido esperado, e não como parte de um nome próprio. “Messias” preserva o contexto judaico e escriturístico.
- source_word: ἔδει
  choice: precisava
  rationale: Expressa uma necessidade que, no contexto, decorre do propósito divino revelado nas Escrituras. A forma no passado se ajusta naturalmente ao discurso narrado.
- source_word: παθεῖν
  choice: sofrer
  rationale: Equivalente direto e tradicional, aqui referente aos sofrimentos do Messias.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: ressuscitar dentre os mortos
  rationale: O infinitivo grego está na voz ativa. Em português, “ressuscitar” pode ser empregado intransitivamente e preserva essa forma, enquanto “dentre os mortos” representa o valor de ἐκ νεκρῶν.
- source_word: οὗτός ἐστιν ... Ἰησοῦς
  choice: este Jesus ... é
  rationale: A ordem foi ajustada ao português natural, mantendo a identificação enfática de Jesus como o Messias.
- source_word: καταγγέλλω ὑμῖν
  choice: anuncio a vocês
  rationale: “Anuncio” preserva o sentido de proclamação pública; “a vocês” explicita de modo claro e amplamente compreensível o destinatário plural.
theological_decisions:
- issue: Tradução de Χριστός como título nas duas ocorrências
  choice: Messias
  alternative: Cristo
  rationale: O argumento identifica Jesus com o ungido esperado pelas Escrituras. “Messias” torna explícito o valor titular, enquanto “Cristo” é mantido em nota como alternativa tradicional.
- issue: Nuance de voz em ἀναστῆναι
  choice: ressuscitar dentre os mortos
  alternative: ser ressuscitado dentre os mortos
  rationale: O texto grego emprega um infinitivo ativo, por isso a tradução principal mantém a formulação ativa. A alternativa passiva é teologicamente coerente com outras passagens do Novo Testamento, mas não corresponde tão diretamente à forma verbal deste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional ampla. A repetição de “o Messias” foi preservada por ser central ao argumento do versículo. Os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem.
