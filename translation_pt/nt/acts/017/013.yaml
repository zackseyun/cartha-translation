id: ACT.17.13
reference: Acts 17:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: pt
  text: Mas, quando os judeus de Tessalônica souberam que a palavra de Deus também tinha sido proclamada por Paulo em Bereia[a], foram também para lá, agitando e perturbando as multidões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foi proclamada». O aoristo passivo grego permite que a relação temporal seja expressa em português de modo mais explícito ou mais simples.
    reason: lexical_alternative
  - marker: b
    text: Ou «incitando e causando tumulto entre as multidões». Os dois particípios têm sentidos próximos e, juntos, intensificam o quadro de agitação pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mas, quando
  rationale: Expressa o valor temporal de ὡς e a transição levemente contrastiva de δέ, em continuidade com a recepção positiva anterior em Bereia.
- source_word: ἔγνωσαν
  choice: souberam
  rationale: O aoristo de γινώσκω indica aqui que receberam ou descobriram uma informação; «souberam» é natural em português.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: os judeus de Tessalônica
  rationale: Identifica pelo lugar de origem o grupo específico que se opôs a Paulo, sem generalizar a referência a todos os judeus.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: que ... também ... em Bereia
  rationale: O advérbio «também» assinala Bereia como mais um lugar, além de Tessalônica, onde a mensagem foi proclamada.
- source_word: κατηγγέλη
  choice: tinha sido proclamada
  rationale: O verbo καταγγέλλω descreve anúncio público. A construção passiva com pretérito mais-que-perfeito composto torna clara, em português corrente, a anterioridade em relação a «souberam».
- source_word: ὑπὸ τοῦ Παύλου
  choice: por Paulo
  rationale: ὑπό com genitivo identifica Paulo como agente da construção passiva.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva uma expressão bíblica reconhecível e sua ressonância teológica, sem reduzir λόγος apenas a informação ou discurso.
- source_word: ἦλθον κἀκεῖ
  choice: foram também para lá
  rationale: κἀκεῖ significa «também para lá/lá também»; a formulação portuguesa comunica que eles estenderam sua oposição a Bereia.
- source_word: σαλεύοντες
  choice: agitando
  rationale: No contexto, σαλεύω descreve provocar instabilidade ou agitação entre as pessoas, não um movimento físico literal.
- source_word: καὶ ταράσσοντες
  choice: e perturbando
  rationale: Mantém o segundo particípio e sua nuance de causar perturbação, tumulto ou inquietação, sem fundi-lo com o primeiro.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: ὄχλοι refere-se aos grupos de pessoas reunidas; «multidões» evita a carga excessivamente negativa de «turbas».
theological_decisions:
- issue: Tradução de ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: A opção preserva a expressão teologicamente significativa do texto e, no contexto, continua sendo compreensível como a mensagem divina proclamada, sem impor um sentido técnico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «tinha sido» em vez de «fora» por ser mais corrente, sem perder a sequência narrativa. Conserva os dois particípios gregos para refletir a intensificação do original.
