  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: pt
  text: E, como era seu costume, Paulo entrou para junto deles e, em três sábados[a], dialogou com eles com base nas Escrituras[b].
  philosophy: optimal-equivalence
  footnotes:
