lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: E, como era seu costume, Paulo
  rationale: A construção idiomática expressa uma prática habitual de Paulo. «Como era seu costume» é natural em português e preserva o sentido de hábito estabelecido.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: foi até eles
  rationale: No contexto, εἰσέρχομαι com πρὸς indica que Paulo entrou e se dirigiu ao grupo já mencionado. «Foi até eles» comunica naturalmente o movimento sem explicitar «sinagoga» ou «judeus», substantivos ausentes neste versículo.
- source_word: ἐπὶ σάββατα τρία
  choice: durante três sábados
  rationale: ἐπί com acusativo pode indicar extensão temporal. A formulação preserva a possível ideia de atividade ao longo de três sábados, embora «em três sábados» também seja possível.
- source_word: διελέξατο αὐτοῖς
  choice: dialogou com eles
  rationale: διαλέγομαι descreve aqui exposição argumentada em intercâmbio com os ouvintes. «Dialogou» retém melhor a dimensão recíproca do verbo do que uma formulação puramente unilateral.
- source_word: ἀπὸ τῶν γραφῶν
  choice: com base nas Escrituras
  rationale: ἀπό apresenta as Escrituras como fonte ou ponto de partida da argumentação. «Com base nas Escrituras» expressa isso com clareza e mantém γραφαί como referência aos escritos sagrados reconhecidos.
theological_decisions:
- issue: Referente de αὐτούς / αὐτοῖς
  choice: Manter «eles» sem identificar expressamente o grupo.
  alternative: «entrou na sinagoga» ou «foi aos judeus»
  rationale: Embora o contexto imediato forneça o cenário da sinagoga, o grego deste versículo emprega pronomes. A tradução evita acrescentar uma identificação não expressa no texto.
- issue: Caráter da atividade indicada por διελέξατο
  choice: «dialogou com eles»
  alternative: «argumentou com eles» ou «expôs-lhes argumentos»
  rationale: A escolha preserva o intercâmbio discursivo e não impõe hostilidade ao encontro. A nota registra a alternativa que salienta o raciocínio argumentativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente naturalizada, mantendo os pronomes do original e sem explicitar elementos fornecidos apenas pelo contexto.
