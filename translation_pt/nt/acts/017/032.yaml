  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: pt
  text: 'Quando ouviram falar da ressurreição dos mortos, alguns zombaram, mas outros disseram: “Voltaremos a ouvi-lo a esse respeito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quando ouviram falar
  rationale: O particípio aoristo estabelece a circunstância temporal da reação seguinte. “Ouviram falar” é natural em português quando se ouve a menção de um assunto; δὲ funciona aqui como transição leve e não exige uma palavra separada.
- source_word: ἀνάστασιν νεκρῶν
  choice: da ressurreição dos mortos
  rationale: Expressa de modo claro o conceito anunciado, sem decidir além do grego entre uma formulação geral e a ressurreição de alguém dentre os mortos.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: alguns ... mas outros
  rationale: Preserva o contraste explícito entre os dois grupos de ouvintes em português corrente.
- source_word: ἐχλεύαζον
  choice: zombaram
  rationale: Verbo direto e natural para a reação de escárnio. O imperfeito grego pode apresentar a ação em curso, mas o contexto não exige acrescentar a nuance incoativa “começaram a”.
- source_word: Ἀκουσόμεθά σου
  choice: Voltaremos a ouvi-lo
  rationale: O futuro de ἀκούω com o pronome no genitivo significa ouvir ou escutar a pessoa. “Voltaremos a ouvi-lo” comunica naturalmente a intenção de escutar Paulo em outra ocasião.
- source_word: περὶ τούτου καὶ πάλιν
  choice: a esse respeito
  rationale: περὶ τούτου indica o assunto. A força de πάλιν já está expressa em “voltaremos a ouvir”, evitando repetição artificial sem perder conteúdo.
theological_decisions:
- issue: Sentido da linguagem de ressurreição diante de um público pagão misto
  choice: ressurreição dos mortos
  alternative: ressurreição dentre os mortos
  rationale: A expressão grega apresenta os mortos como a categoria ligada à ressurreição e, neste contexto, não requer uma explicação doutrinária adicional. A tradução mantém a formulação ampla e a tensão do discurso.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase conserva a progressão do grego: assunto ouvido, reação de escárnio e resposta do segundo grupo.'
