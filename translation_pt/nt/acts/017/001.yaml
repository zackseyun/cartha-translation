id: ACT.17.1
reference: Acts 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: pt
  text: Depois de passarem por Anfípolis e Apolônia[a], chegaram a Tessalônica, onde havia uma sinagoga dos judeus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tendo passado por Anfípolis e Apolônia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “onde ficava a sinagoga dos judeus”; no grego, porém, “sinagoga” não vem acompanhada de artigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Depois de passarem por
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal e descreve o percurso através das cidades. A formulação é natural em português e não implica que elas fossem o destino principal.
- source_word: δὲ
  choice: —
  rationale: Aqui, δέ funciona como transição narrativa branda. O português não exige um conectivo explícito neste ponto.
- source_word: Ἀμφίπολιν
  choice: Anfípolis
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico grego.
- source_word: Ἀπολλωνίαν
  choice: Apolônia
  rationale: Forma portuguesa corrente do nome geográfico, com grafia de boa legibilidade brasileira.
- source_word: ἦλθον
  choice: chegaram
  rationale: O aoristo de ἔρχομαι expressa o movimento até Tessalônica. “Chegaram” comunica naturalmente em português a conclusão do percurso, sem acrescentar conteúdo narrativo.
- source_word: εἰς Θεσσαλονίκην
  choice: a Tessalônica
  rationale: εἰς com nome de cidade indica destino. A preposição “a” produz uma construção clara e idiomática em português.
- source_word: ὅπου
  choice: onde
  rationale: Equivalente locativo direto e natural do advérbio relativo grego.
- source_word: συναγωγὴ
  choice: uma sinagoga
  rationale: O substantivo não tem artigo no grego. O artigo indefinido reflete bem essa forma e apresenta a existência de uma sinagoga em Tessalônica.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: O genitivo indica a comunidade à qual a sinagoga estava ligada. A tradução é direta e adequada ao contexto local.
theological_decisions:
- issue: Sentido de Ἰουδαίων no contexto narrativo
  choice: dos judeus
  alternative: do povo judeu; dos judeanos
  rationale: A expressão se refere à comunidade judaica associada à sinagoga de Tessalônica, não especificamente a habitantes da Judeia. “Dos judeus” preserva a designação étnico-religiosa sem ampliar nem restringir indevidamente o referente.
- issue: Definição de συναγωγή sem artigo grego
  choice: uma sinagoga
  alternative: a sinagoga
  rationale: A ausência do artigo favorece a leitura indefinida, embora o português e o contexto possam admitir uma referência definida. A tradução principal mantém a forma mais diretamente apoiada pela sintaxe, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi preservada, e os nomes geográficos seguem formas portuguesas correntes.
