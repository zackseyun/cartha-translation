  text: ἐτάραξαν δὲ τὸν ὄχλον καὶ τοὺς πολιτάρχας ἀκούοντας ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: pt
  text: E perturbaram a multidão e as autoridades da cidade, ao ouvirem essas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “os politarcas”, título cívico macedônio local para autoridades da cidade.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: ficaram agitadas
  rationale: O verbo ταράσσω expressa perturbação ou agitação. A construção portuguesa com sentido resultativo comunica naturalmente o efeito causado pelas acusações sobre a multidão e as autoridades, sem exagerá-lo.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo narrativo leve; “E” dá continuidade natural ao relato.
- source_word: ὄχλον
  choice: multidão
  rationale: ὄχλος designa um grupo reunido. “Multidão” é corrente e neutro, sem a hostilidade adicional que “turba” poderia sugerir.
- source_word: πολιτάρχας
  choice: autoridades da cidade
  rationale: πολιτάρχης era um título cívico macedônio historicamente atestado. “Autoridades da cidade” transmite sua função de modo claro, enquanto o termo técnico é preservado na nota.
- source_word: ἀκούοντας ταῦτα
  choice: ao ouvirem essas coisas
  rationale: O particípio presente tem valor temporal e se refere tanto à multidão quanto às autoridades. A formulação mantém o plural de ταῦτα e é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada para tornar inequívoco que tanto a multidão quanto as autoridades ouviram as acusações; a nota conserva a precisão histórica do título local.
