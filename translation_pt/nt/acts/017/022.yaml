source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: pt
  text: 'Então Paulo, de pé no meio do Areópago, disse: “Homens de Atenas, vejo que, em todos os aspectos, vocês são muito religiosos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “supersticiosos”; ou: “mais religiosos”. A palavra grega pode ser entendida em sentido negativo ou positivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: de pé
  rationale: O particípio aoristo estabelece a postura e a cena. “De pé” é natural em português e evita explicitar uma ação anterior que o grego apenas deixa implícita.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ funciona como transição narrativa suave. “Então” dá continuidade natural ao discurso sem introduzir um contraste forte.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: no meio do Areópago
  rationale: Preserva o sentido locativo direto da expressão grega e não decide se o nome designa, neste ponto, primordialmente o local ou o conselho reunido.
- source_word: Ἀρείου Πάγου
  choice: Areópago
  rationale: Mantém a forma tradicional portuguesa diretamente relacionada ao nome grego, em vez da alternativa culturalmente adaptada “Colina de Marte”.
- source_word: ἔφη
  choice: disse
  rationale: Embora seja imperfeito, φημί funciona aqui como fórmula narrativa de introdução da fala; “disse” é a forma idiomática em português.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Homens de Atenas
  rationale: Conserva o substantivo masculino ἄνδρες e a força formal do vocativo, com formulação clara e natural em português.
- source_word: κατὰ πάντα
  choice: em todos os aspectos
  rationale: Expressa de modo idiomático o alcance distributivo da frase, sem restringi-la a práticas religiosas específicas.
- source_word: ὡς
  choice: que
  rationale: Introduz naturalmente em português o conteúdo da percepção expressa por θεωρῶ.
- source_word: δεισιδαιμονεστέρους
  choice: muito religiosos
  rationale: O comparativo pode ter sentido positivo, neutro ou pejorativo. “Muito religiosos” reproduz o provável valor intensivo de modo natural e preserva o tato retórico da abertura; as leituras “supersticiosos” e “mais religiosos” ficam registradas em nota.
- source_word: θεωρῶ
  choice: vejo
  rationale: Neste contexto, o verbo indica observação ou percepção. “Vejo” é conciso, corrente e adequado ao registro do discurso.
theological_decisions:
- issue: Tom da caracterização da religiosidade ateniense em δεισιδαιμονεστέρους
  choice: Usar a formulação relativamente neutra “muito religiosos” no texto principal.
  alternative: “supersticiosos” ou “mais religiosos”
  rationale: O termo grego admite tanto uma avaliação respeitosa quanto uma crítica e pode ter sido escolhido por sua ambiguidade retórica. A tradução principal não deve resolver antecipadamente o tom; a nota preserva as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a localização, a forma masculina do tratamento e a ambiguidade central do adjetivo grego.
