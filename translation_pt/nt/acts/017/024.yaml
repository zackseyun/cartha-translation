id: ACT.17.24
reference: Acts 17:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: pt
  text: O Deus que fez o mundo e tudo o que nele há, sendo Senhor do céu e da terra, não habita em templos feitos por mãos humanas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “feitos por mãos”. A expressão se refere a templos construídos por seres humanos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: que fez
  rationale: O particípio aoristo modifica “Deus”. “Que fez” é natural em português e reflete diretamente ποιέω sem tornar a construção pesada.
- source_word: κόσμον
  choice: o mundo
  rationale: Neste contexto, κόσμος designa o conjunto do mundo criado. “O mundo” é claro, abrangente e idiomático.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: tudo o que nele há
  rationale: A expressão inclui tudo o que existe no mundo. Esta formulação preserva a força abrangente de πάντα e soa natural em português.
- source_word: ὑπάρχων κύριος
  choice: sendo Senhor
  rationale: O particípio expressa o estado de Deus como Senhor. “Sendo Senhor” conserva a relação sintática sem interpretar o particípio explicitamente como causal.
- source_word: κύριος
  choice: Senhor
  rationale: Aqui, κύριος denota soberania sobre o céu e a terra; “Senhor” preserva esse sentido e o registro bíblico corrente.
- source_word: οὐρανοῦ καὶ γῆς
  choice: do céu e da terra
  rationale: Os genitivos dependem de κύριος. “Céu e terra” é a combinação tradicional e natural, além de refletir o singular οὐρανοῦ.
- source_word: χειροποιήτοις
  choice: feitos por mãos humanas
  rationale: χειροποίητος significa feito por mãos, isto é, construído por seres humanos. A explicitação “humanas” comunica o sentido com clareza e evita uma expressão pouco natural.
- source_word: ναοῖς
  choice: templos
  rationale: ναός designa um templo ou santuário entendido como morada sagrada. “Templos” é o equivalente geral mais claro no contexto ateniense.
- source_word: κατοικεῖ
  choice: habita
  rationale: κατοικέω significa habitar ou residir. “Habita” mantém a imagem de morada ligada aos templos e oferece registro digno e corrente.
theological_decisions:
- issue: Transcendência divina em contraste com a localização em templos
  choice: Afirmar diretamente que o Criador e Senhor do céu e da terra não habita em templos construídos por seres humanos.
  alternative: Parafrasear que Deus não está confinado ou limitado a templos.
  rationale: A redação mantém a afirmação direta do grego e sua tensão própria, sem ampliá-la para uma explicação teológica sobre confinamento que não aparece expressamente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sendo Senhor” preserva deliberadamente a forma participial e sua possível nuance, enquanto “feitos por mãos humanas” torna explícito o referente humano implícito no adjetivo grego.
