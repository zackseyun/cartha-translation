source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: pt
  text: 'Esses homens, a quem Jasão acolheu como hóspedes[a], todos agem contra os decretos[b] de César, dizendo que há outro rei[c]: Jesus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recebeu” ou “hospedou”. O verbo grego pode indicar receber alguém e oferecer-lhe hospitalidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “editos”. O termo se refere a determinações ou ordens oficiais.
    reason: lexical_alternative
  - marker: c
    text: Ou “um rei diferente”. O grego diz “outro rei”, apresentando a acusação como uma reivindicação rival à autoridade de César.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: recebeu como hóspedes
  rationale: Expressa de modo natural a acolhida e hospitalidade indicadas pelo verbo grego no perfeito, cuja consequência permanece relevante para a acusação.
- source_word: ἀπέναντι
  choice: contra
  rationale: Com o genitivo, comunica oposição ou contrariedade; “contra” é claro e idiomático neste contexto acusatório.
- source_word: δογμάτων
  choice: decretos
  rationale: No contexto cívico romano, refere-se a determinações oficiais; “decretos” é acessível e mantém o tom jurídico.
- source_word: πράσσουσι
  choice: agem
  rationale: Preserva a ideia de conduta atribuída continuamente ao grupo, em português direto e natural.
- source_word: βασιλέα ἕτερον
  choice: outro rei
  rationale: Mantém tanto o sentido específico de βασιλεύς quanto a apresentação de Jesus como pretendente distinto e rival na acusação.
- source_word: λέγοντες
  choice: dizendo
  rationale: Introduz com transparência o conteúdo da acusação sem acrescentar um tom de dúvida ou ênfase ausente do termo.
- source_word: εἶναι Ἰησοῦν
  choice: que existe ... Jesus
  rationale: Reestrutura naturalmente a oração infinitiva em português e deixa “Jesus” em posição final enfática.
- source_word: οὗτοι πάντες
  choice: todos eles
  rationale: Preserva o caráter coletivo e abrangente da acusação, retomando com clareza as pessoas acolhidas por Jasão.
theological_decisions:
- issue: Força política da acusação de que Jesus é rei
  choice: Traduzir diretamente a alegação de que existe “outro rei”, Jesus.
  alternative: Atenuar o título como “outro governante” ou entendê-lo explicitamente apenas em sentido espiritual.
  rationale: A ligação com os decretos de César dá à acusação uma dimensão política explícita. “Rei” preserva essa tensão histórica e teológica sem explicá-la segundo uma doutrina particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom de acusação pública e a ênfase final em Jesus, sem suavizar a tensão política do título “rei”.
