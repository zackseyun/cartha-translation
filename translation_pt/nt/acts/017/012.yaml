id: ACT.17.12
reference: Acts 17:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: pt
  text: Assim, muitos deles creram, como também não poucas mulheres gregas de posição social elevada[a] e não poucos homens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “respeitáveis” ou “de destaque”.
    reason: lexical_alternative
  - marker: b
    text: O grego usa a expressão “não poucos”, uma forma enfática de indicar um número considerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Assim, muitos
  rationale: A combinação μὲν οὖν faz a transição e apresenta o resultado da investigação das Escrituras narrada no versículo anterior. “Assim” expressa essa relação de modo natural em português.
- source_word: ἐξ αὐτῶν
  choice: deles
  rationale: Preserva o sentido partitivo e retoma as pessoas mencionadas no contexto anterior sem explicitar além do texto.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: É a correspondência direta e natural de πιστεύω neste contexto, mantendo implícito o objeto da fé, como no grego.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: mulheres gregas
  rationale: Ἑλληνίδων indica mulheres gregas ou gentias; γυναικῶν não requer aqui o sentido de “esposas”.
- source_word: τῶν εὐσχημόνων
  choice: de posição social elevada
  rationale: No contexto, εὐσχήμων aponta para posição reconhecida e respeitabilidade social. A expressão evita que “respeitáveis” seja entendida apenas como avaliação moral.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: e não poucos homens
  rationale: Mantém a litotes lucana οὐκ ὀλίγοι. A repetição de “não poucos” em português torna clara a construção coordenada e evita ambiguidade de concordância.
- source_word: καὶ
  choice: como também
  rationale: Liga outro grupo de pessoas que creram; “como também” soa natural depois da primeira oração e deixa clara a adição.
theological_decisions:
- issue: Se ἐπίστευσαν deve receber uma formulação cristológica ou doutrinária explícita
  choice: creram
  alternative: vieram a crer no Messias; creram na mensagem
  rationale: O objeto é recuperável do contexto, mas não aparece expresso neste versículo. A tradução conserva essa concisão e não acrescenta uma formulação doutrinária.
- issue: Alcance de εὐσχημόνων
  choice: aplicado explicitamente às mulheres gregas
  alternative: aplicado conjuntamente às mulheres e aos homens
  rationale: O artigo feminino plural τῶν antes de εὐσχημόνων liga o qualificativo de modo mais direto a γυναικῶν. A tradução não estende silenciosamente o adjetivo aos homens, embora a redação permita que eles também fossem socialmente destacados.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se a litotes “não poucos”, embora ela seja menos comum na fala cotidiana, por ser compreensível e refletir uma característica expressiva do texto grego.
