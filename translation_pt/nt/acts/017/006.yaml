  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: pt
  text: 'Mas, como não os encontraram, arrastaram Jasom e alguns irmãos[a] para diante das autoridades da cidade[b], gritando: “Esses homens que têm causado tumulto no mundo inteiro[c] também chegaram aqui!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, alguns irmãos na fé. Conforme o contexto, o grupo pode ter incluído mulheres.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “politarcas” (politárchai), título local macedônio dado a autoridades municipais.
    reason: cultural_note
  - marker: c
    text: Ou “no mundo habitado”; a expressão podia designar o mundo civilizado conhecido, muitas vezes o mundo romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: como não os encontraram
  rationale: Expressa de modo natural em português a circunstância anterior indicada pelo particípio aoristo com μή, sem acrescentar uma causa explícita.
- source_word: ἔσυρον
  choice: arrastaram
  rationale: Preserva o sentido físico e coercivo de puxar ou levar alguém à força.
- source_word: τινας ἀδελφοὺς
  choice: alguns irmãos
  rationale: Mantém a forma masculina do grego e o uso comunitário cristão; uma nota esclarece que se trata de irmãos na fé e que o grupo pode ter incluído mulheres.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: para diante das autoridades da cidade
  rationale: Comunica tanto o movimento de levar os acusados quanto a função pública dos magistrados, enquanto a nota preserva o título macedônio específico.
- source_word: βοῶντες
  choice: gritando
  rationale: Reproduz a ideia de clamor público em voz alta que acompanha a ação principal.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: esses homens que têm causado tumulto no mundo inteiro
  rationale: Traduz a acusação de provocar grave agitação sem depender de uma expressão idiomática que poderia sugerir transformação positiva; o perfeito composto português apresenta o impacto continuado da atividade anterior.
- source_word: οἰκουμένην
  choice: mundo inteiro
  rationale: É uma formulação corrente e compreensível; a nota registra o sentido mais literal de mundo habitado e sua possível referência ao mundo romano.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: também chegaram aqui
  rationale: No contexto da denúncia hostil, exprime naturalmente a chegada e presença deles, preservando a força de καί como “também”.
