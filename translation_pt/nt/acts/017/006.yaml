  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue o fluxo narrativo do grego. “Jasom” adota a forma bíblica portuguesa tradicional; “autoridades da cidade” evita um tecnicismo no texto principal, preservado em nota. Todos os marcadores de nota aparecem no texto.
