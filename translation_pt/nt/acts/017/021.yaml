  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: pt
  text: Todos os atenienses e os estrangeiros que ali estavam não se ocupavam de outra coisa senão de dizer ou ouvir algo mais novo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “algo novo”. O grego emprega o comparativo “mais novo”, possivelmente indicando uma busca constante pela última novidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Todos os atenienses
  rationale: πάντες é traduzido diretamente por “todos”. O δέ introduz uma explicação parentética suave; em português, a transição fica natural sem conjunção explícita, evitando atribuir-lhe força adversativa indevida.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: os estrangeiros que estavam de passagem
  rationale: ἐπιδημοῦντες indica pessoas presentes ou temporariamente estabelecidas no lugar; “de passagem” preserva esse caráter não permanente, enquanto ξένοι é vertido por “estrangeiros”.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: não ocupavam o tempo com outra coisa
  rationale: A formulação comunica idiomaticamente a ideia de dedicar ou empregar o tempo, e o imperfeito “ocupavam” mantém o sentido habitual ou contínuo de ηὐκαίρουν.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: senão contar ou ouvir algo
  rationale: A construção negativa seguida de ἢ é expressa naturalmente por “senão”. “Contar” ajusta-se ao objeto indefinido τι e forma um par claro com “ouvir”.
- source_word: καινότερον
  choice: mais novo
  rationale: Preserva o grau comparativo do grego, que pode sugerir a busca constante pela novidade mais recente, em vez de reduzi-lo silenciosamente ao positivo “novo”.
