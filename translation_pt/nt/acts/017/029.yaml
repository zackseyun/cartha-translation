id: ACT.17.29
reference: Acts 17:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: pt
  text: Portanto, visto que somos descendência de Deus, não devemos pensar que a Divindade[a] seja semelhante a ouro, prata ou pedra, uma imagem esculpida[b] pela habilidade e imaginação humana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o Ser Divino», «a natureza divina» ou «o divino». O grego τὸ θεῖον é uma expressão ampla para aquilo que é divino; aqui, no argumento de Paulo, refere-se ao Deus verdadeiro.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma imagem gravada» ou «um objeto entalhado».
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: descendência
  rationale: Expressa origem e parentesco com Deus no contexto da citação anterior, sem sugerir etnia nem filiação biológica em sentido estrito.
- source_word: οὖν
  choice: Portanto
  rationale: Marca claramente a conclusão inferida do argumento anterior.
- source_word: ὑπάρχοντες
  choice: visto que somos
  rationale: Traduz naturalmente o valor causal do particípio no contexto.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Forma natural em português para o genitivo, ligada a «descendência».
- source_word: οὐκ ὀφείλομεν
  choice: não devemos
  rationale: Comunica obrigação moral e impropriedade, sem intensificar para uma proibição absoluta não explicitada.
- source_word: νομίζειν
  choice: pensar
  rationale: Verbo cognitivo corrente e abrangente, adequado à construção infinitiva.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: a ouro, prata ou pedra
  rationale: Conserva os três materiais e a estrutura comparativa do grego em português fluente.
- source_word: χαράγματι
  choice: uma imagem esculpida
  rationale: Indica um objeto produzido por entalhe, gravação ou escultura; a nota preserva alternativas lexicais.
- source_word: τέχνης
  choice: habilidade
  rationale: Comunica a perícia artística ou artesanal envolvida na produção da imagem.
- source_word: ἐνθυμήσεως
  choice: imaginação
  rationale: Expressa a concepção mental ou projeto humano por trás da fabricação do ídolo.
- source_word: ἀνθρώπου
  choice: humana
  rationale: Transmite o singular genérico como referência à humanidade, sem restringi-lo a um indivíduo masculino.
- source_word: τὸ θεῖον
  choice: a Divindade
  rationale: Mantém o registro filosófico amplo do substantivo neutro e, no argumento de Paulo, refere-se ao Deus verdadeiro sem impor terminologia metafísica posterior.
theological_decisions:
- issue: Tradução de τὸ θεῖον em um discurso monoteísta de formulação filosófica
  choice: a Divindade
  alternative: o Ser Divino; a natureza divina; o divino
  rationale: «A Divindade» preserva a amplitude e o registro filosófico da expressão grega. A nota esclarece que, no argumento de Paulo, a referência é ao Deus verdadeiro, sem reduzir a expressão a uma força impessoal nem importar uma formulação doutrinária técnica posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. «Descendência» preserva a ideia de origem e parentesco; «Divindade» mantém o tom filosófico do discurso no Areópago. Os marcadores [a] e [b] aparecem no texto principal.
