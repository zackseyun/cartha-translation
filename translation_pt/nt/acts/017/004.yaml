reference: Acts 17:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: pt
  text: Alguns deles foram persuadidos e se juntaram a Paulo e Silas[a], bem como um grande número de gregos tementes a Deus e não poucas mulheres de destaque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “foram associados a Paulo e Silas”. O verbo grego contém a ideia de serem ligados ou atribuídos a alguém.
    reason: alternativa lexical
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: alguns deles
  rationale: Traduz de modo natural a expressão partitiva e retoma os ouvintes da sinagoga mencionados no contexto anterior.
- source_word: ἐπείσθησαν
  choice: foram persuadidos
  rationale: Preserva o sentido passivo de πείθω e evita substituí-lo por um termo de fé mais explícito, como “creram”, que não aparece no grego.
- source_word: προσεκληρώθησαν
  choice: se juntaram
  rationale: O verbo raro indica que passaram a estar associados a Paulo e Silas. “Se juntaram” comunica essa afiliação com clareza em português atual; a nuance mais literal é registrada em nota.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: a Paulo e Silas
  rationale: A preposição “a” expressa naturalmente em português a relação indicada pelo dativo com προσεκληρώθησαν.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: gregos tementes a Deus
  rationale: Em Atos, a expressão costuma designar gentios ligados ao culto judaico e reverentes ao Deus de Israel. A tradução explicita o objeto da reverência implícito no contexto histórico.
- source_word: πλῆθος πολὺ
  choice: um grande número
  rationale: Expressa de maneira corrente a quantidade considerável indicada pela frase grega.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: mulheres de destaque
  rationale: πρῶτος indica aqui proeminência ou posição social, e não prioridade cronológica.
- source_word: οὐκ ὀλίγαι
  choice: não poucas
  rationale: Mantém a litotes característica de Lucas, sem reduzir sua força retórica a um simples “muitas”.
- source_word: τε ... τε
  choice: bem como ... e
  rationale: Reproduz com fluidez a estrutura aditiva que liga os dois grupos aos que foram persuadidos.
theological_decisions:
- issue: Se ἐπείσθησαν deve ser traduzido com linguagem explicitamente conversional
  choice: foram persuadidos
  alternative: creram
  rationale: Embora o contexto seja a resposta à proclamação apostólica, o texto usa πείθω, não πιστεύω. A escolha preserva essa distinção lexical e não torna a formulação mais explícita do que o original.
- issue: Até que ponto explicitar a identidade religiosa de σεβομένων Ἑλλήνων
  choice: gregos tementes a Deus
  alternative: gregos devotos; gregos que adoravam a Deus
  rationale: A expressão designa, no contexto de Atos, gentios associados ao culto judaico. “Tementes a Deus” preserva esse sentido histórico-religioso sem acrescentar uma identidade denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a voz passiva em “foram persuadidos” e a litotes “não poucas”; a formulação evita linguagem denominacional e não elimina a tensão lexical do original.
