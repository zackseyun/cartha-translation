id: ACT.17.27
reference: Acts 17:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: pt
  text: para que buscassem a Deus e, talvez, tateassem à procura dele e o encontrassem — embora, de fato, ele não esteja longe de cada um de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: para que buscassem
  rationale: O infinitivo depende do contexto anterior e expressa propósito ou resultado. A oração finita com “para que” transmite naturalmente essa relação em português.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Em português, o nome próprio divino normalmente aparece sem artigo neste contexto; a preposição “a” é exigida pelo verbo “buscar”.
- source_word: εἰ ἄρα γε
  choice: quem sabe
  rationale: Expressa de modo natural a contingência e o tom tentativo da combinação de partículas, sem transformar a busca em certeza.
- source_word: ψηλαφήσειαν
  choice: tateassem à procura dele
  rationale: Preserva a imagem concreta de procurar pelo tato, como sob percepção limitada ou na escuridão, e evita o possível sentido indevido de tocar diretamente em Deus.
- source_word: αὐτόν
  choice: dele
  rationale: O pronome retoma Deus de modo pessoal e integra-se naturalmente à locução portuguesa “à procura dele”.
- source_word: καὶ εὕροιεν
  choice: e o encontrassem
  rationale: Mantém a coordenação dos dois optativos; em português, o subjuntivo conserva a modalidade potencial de ambos.
- source_word: καί γε
  choice: embora, de fato
  rationale: 'A locução introduz uma ressalva concessiva enfática: apesar da busca humana incerta, Deus está realmente próximo.'
- source_word: οὐ μακρὰν
  choice: não esteja longe
  rationale: É a formulação direta, corrente e semanticamente fiel em português.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: de cada um de nós
  rationale: Conserva a ênfase distributiva de ἑνὸς ἑκάστου com naturalidade.
- source_word: ὑπάρχοντα
  choice: ele não esteja
  rationale: O particípio predica a proximidade real de Deus; uma forma verbal finita é necessária em português. O subjuntivo é regido por “embora”, sem pôr em dúvida a afirmação, reforçada por “de fato”.
theological_decisions:
- issue: A acessibilidade de Deus e a busca humana
  choice: Preservar tanto a incerteza da busca humana (“quem sabe, tateassem”) quanto a afirmação da proximidade real de Deus (“embora, de fato, ele não esteja longe”).
  alternative: Suavizar a metáfora com “procurassem por ele” ou tornar o possível encontro mais seguro.
  rationale: O grego mantém em tensão a percepção humana limitada e a proximidade objetiva de Deus. A tradução não torna a busca nem confiante demais nem necessariamente inútil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tateassem à procura dele” preserva a metáfora tátil sem a conotação contemporânea potencialmente inadequada de “apalpassem”. Não se acrescentou nota, pois a imagem lexical permanece explícita no texto.
