id: ACT.17.17
reference: Acts 17:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: pt
  text: Por isso, ele dialogava na sinagoga com os judeus e com os que adoravam a Deus[a] e, todos os dias, na praça pública[b], com os que por acaso estavam ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os tementes a Deus», isto é, gentios ligados ao culto judaico.
    reason: lexical_alternative
  - marker: b
    text: A praça pública também era um centro da vida cívica, onde as pessoas se reuniam, e não apenas um lugar de comércio.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: dialogava
  rationale: O imperfeito indica atividade contínua ou repetida, e «dialogava» preserva o caráter interativo de διαλέγομαι sem reduzir a ação a um monólogo nem pressupor um debate hostil.
- source_word: μὲν οὖν
  choice: Por isso
  rationale: A expressão liga a ação de Paulo ao contexto anterior com valor de continuação e inferência; «Por isso» é natural e claro em português.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Neste contexto, designa a instituição e o local de reunião judaicos; o termo tradicional continua claro no português atual.
- source_word: τοῖς Ἰουδαίοις
  choice: os judeus
  rationale: Refere-se à comunidade judaica presente na sinagoga, e não especificamente aos habitantes da Judeia.
- source_word: τοῖς σεβομένοις
  choice: os que adoravam a Deus
  rationale: O particípio designa, no uso de Atos, gentios ligados ao culto judaico. O objeto «a Deus» é explicitado pelo contexto e torna a expressão natural, sem impor ao texto principal um rótulo técnico.
- source_word: ἀγορᾷ
  choice: praça pública
  rationale: A ἀγορά era o espaço público cívico e comercial da cidade. «Praça pública» comunica melhor sua função ampla do que uma expressão limitada ao comércio.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: todos os dias
  rationale: Reproduz de maneira idiomática a ideia de repetição diária.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: com os que por acaso estavam ali
  rationale: Mantém a noção de pessoas encontradas circunstancialmente naquele lugar, sem restringi-las a meros transeuntes.
theological_decisions:
- issue: Identidade de τοῖς σεβομένοις
  choice: os que adoravam a Deus
  alternative: os tementes a Deus
  rationale: A forma descritiva é compreensível ao leitor comum e evita transformar uma designação contextual de gentios associados ao culto judaico em uma categoria teológica mais rígida do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a ação repetida na sinagoga e na praça. Os marcadores aparecem junto aos termos que explicam.
