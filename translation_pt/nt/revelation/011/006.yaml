id: REV.11.6
reference: Revelation 11:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: pt
  text: Estes têm autoridade para fechar o céu, para que não caia chuva durante os dias de sua profecia[a]. Têm também autoridade sobre as águas, para transformá-las em sangue e para ferir a terra com toda espécie de praga, quantas vezes quiserem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante os dias em que profetizam”.
    reason: A construção grega pode designar tanto “sua profecia” quanto, em sentido funcional e temporal, a atividade de profetizar.
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa direito ou jurisdição concedida, e não apenas capacidade ou força, em consonância com a comissão profética do contexto.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: fechar o céu
  rationale: Em português, “céu” designa naturalmente tanto a esfera celeste quanto o céu de onde vem a chuva; o contexto meteorológico torna o sentido claro sem eliminar a amplitude lexical de οὐρανός.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: para que não caia chuva
  rationale: Formulação idiomática que preserva o valor de finalidade ou resultado da construção grega.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: durante os dias de sua profecia
  rationale: Mantém a imagem temporal do original e permite que “profecia” designe o período de sua atividade profética.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: sobre as águas
  rationale: Com ἐξουσίαν, a expressão indica domínio ou jurisdição sobre as águas; o plural do grego foi preservado.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: transformá-las em sangue
  rationale: Transmite com naturalidade a mudança indicada por στρέφω com εἰς e retoma corretamente o plural “águas”.
- source_word: πατάξαι τὴν γῆν
  choice: ferir a terra
  rationale: “Ferir” é atual, digno e apropriado à linguagem bíblica de juízo, sem o tom arcaico de alternativas como “açoitar” ou “fustigar”.
- source_word: ἐν πάσῃ πληγῇ
  choice: com toda espécie de praga
  rationale: Entende ἐν instrumentalmente e exprime o alcance distributivo da formulação sem pressupor uma lista fechada de pragas.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: quantas vezes quiserem
  rationale: Preserva de modo natural o valor iterativo e contingente da construção.
- source_word: οὗτοι
  choice: Estes
  rationale: Conserva o demonstrativo do original sem acrescentar “dois”, embora o referente sejam as duas testemunhas mencionadas no contexto.
theological_decisions:
- issue: Linguagem alusiva que associa as testemunhas aos motivos de Elias e Moisés
  choice: Manter as ações milagrosas em linguagem direta, sem explicação redutiva.
  alternative: Interpretar as ações como simbólicas dentro da própria tradução.
  rationale: O texto apresenta essas ações como parte da autoridade concedida às testemunhas. A tradução preserva a imagética apocalíptica e não decide se seu cumprimento é literal, simbólico ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “autoridade” acompanha a ênfase do grego. “Fechar o céu” é natural em português e conserva a possível ressonância tanto meteorológica quanto celestial.
