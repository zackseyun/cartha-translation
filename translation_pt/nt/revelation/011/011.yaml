id: REV.11.11
reference: Revelation 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: pt
  text: E depois dos três dias e meio, um sopro[a] de vida vindo de Deus entrou neles; eles se puseram de pé, e um grande medo caiu sobre os que os observavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de vida vindo de Deus”; possivelmente, “o Espírito de vida vindo de Deus”. A palavra grega πνεῦμα pode significar sopro, espírito ou Espírito.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: depois dos três dias e meio
  rationale: μετά com acusativo indica sucessão temporal. O artigo é preservado, e a expressão portuguesa comunica naturalmente o período apocalíptico definido.
- source_word: πνεῦμα ζωῆς ἐκ τοῦ θεοῦ
  choice: um sopro de vida vindo de Deus
  rationale: πνεῦμα pode significar sopro, espírito ou Espírito. No contexto de restauração à vida e à luz de Ezequiel 37, “sopro” é adequado; “vindo de Deus” expressa claramente a origem indicada por ἐκ τοῦ θεοῦ sem eliminar as alternativas.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: entrou neles
  rationale: Expressão natural em português para a entrada interior do princípio vivificante, preservando o sentido do verbo e da locução preposicional.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: eles se puseram de pé
  rationale: Equivalente português natural e vívido da ação ingressiva expressa no contexto, sem sugerir apenas que permaneceram parados.
- source_word: φόβος μέγας ἐπέπεσεν ἐπὶ
  choice: um grande medo caiu sobre
  rationale: Mantém a imagem forte de algo que sobrevém às pessoas e preserva φόβος como “medo”, sem intensificá-lo indevidamente para “terror”.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: os que os observavam
  rationale: θεωρέω indica observação contínua ou atenta; “observavam” é claro, atual e compatível com o aspecto do particípio presente.
theological_decisions:
- issue: Se πνεῦμα ζωῆς deve ser entendido como sopro vivificante, espírito ou explicitamente o Espírito Santo
  choice: um sopro de vida vindo de Deus
  alternative: um espírito de vida vindo de Deus; o Espírito de vida vindo de Deus
  rationale: O texto afirma a origem divina, mas não identifica inequivocamente πνεῦμα como o Espírito Santo. A tradução principal preserva a imagem de restauração à vida, enquanto a nota conserva a ambiguidade lexical e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se puseram de pé” é mais natural do que o literal “ficaram sobre os seus pés”; a ordem e a repetição coordenativa do grego são preservadas sem rigidez excessiva.
