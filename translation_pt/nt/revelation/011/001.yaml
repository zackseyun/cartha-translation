id: REV.11.1
reference: Revelation 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: pt
  text: 'E me foi dada uma cana semelhante a uma vara, com estas palavras: “Levante-se e meça o templo[a] de Deus, o altar e os que nele adoram”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuário de Deus”. O termo grego ναός pode designar mais especificamente o santuário interior, e não todo o complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: me foi dada
  rationale: Mantém a construção passiva e o foco do grego naquilo que foi dado, sem identificar quem o deu.
- source_word: κάλαμος
  choice: cana
  rationale: Preserva o sentido básico de uma haste de caniço e mantém distinta a comparação subsequente com uma vara, em vez de antecipar a função de medir.
- source_word: ὅμοιος ῥάβδῳ
  choice: semelhante a uma vara
  rationale: Reproduz diretamente a comparação expressa por ὅμοιος com dativo, sem acrescentar uma interpretação simbólica.
- source_word: λέγων
  choice: com estas palavras
  rationale: Transmite idiomaticamente a introdução da fala sem identificar o falante, que permanece implícito e sintaticamente abrupto no grego.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: Imperativo claro, atual e amplamente compreensível, adequado ao registro digno da visão.
- source_word: μέτρησον
  choice: meça
  rationale: Verbo direto que expressa naturalmente a ordem de medir.
- source_word: ναὸν τοῦ θεοῦ
  choice: o templo de Deus
  rationale: “Templo” é a forma corrente e natural; uma nota conserva o sentido potencialmente mais específico de ναός como santuário interior.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Equivalente normal de θυσιαστήριον, sem decidir se se trata do altar de incenso ou de sacrifícios.
- source_word: τοὺς προσκυνοῦντας
  choice: os que adoram
  rationale: Conserva a força verbal do particípio substantivado e soa natural em português.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém a referência espacial compacta; no contexto, o antecedente mais provável é o templo.
theological_decisions:
- issue: Referência de ναός no contexto apocalíptico
  choice: templo de Deus
  alternative: santuário de Deus
  rationale: O versículo não determina se o referente é um templo terrestre literal, um santuário celestial ou uma realidade simbólica. A tradução evita resolver essa tensão escatológica.
- issue: Identidade do falante implícito em λέγων
  choice: não identificar o falante
  alternative: um anjo dizendo / uma voz dizendo
  rationale: O grego não nomeia o falante; acrescentar “anjo” ou “voz” iria além do texto.
- issue: Identidade específica do altar
  choice: altar
  alternative: altar de incenso / altar de sacrifícios
  rationale: O substantivo grego não especifica qual altar está em vista, e o contexto deste versículo não exige uma identificação.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, sem perder ampla inteligibilidade internacional. “Com estas palavras” evita a construção pouco natural “dizendo” após “foi-me dada uma cana” e conserva a identidade não expressa do falante. A colocação pronominal “me foi dada” favorece a naturalidade brasileira sem comprometer a clareza em outras variedades.
