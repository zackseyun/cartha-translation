id: REV.11.19
reference: Revelation 11:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: pt
  text: E o templo de Deus no céu se abriu[a], e a arca da sua aliança foi vista no seu templo[b]; e houve relâmpagos, vozes[c], trovões, um terremoto e grande granizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «santuário». O termo grego pode destacar o recinto sagrado interior, e não todo o complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou «a arca da aliança»; o grego diz explicitamente «da sua aliança».
    reason: lexical_alternative
  - marker: c
    text: Ou «sons» ou «estrondos». O Apocalipse emprega repetidamente essa expressão em cenas da majestade e do juízo de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: templo
  rationale: “Templo” é natural e claro em português e, no contexto, designa a habitação celestial de Deus; “santuário” é possível e explicita melhor o sentido de ναός como recinto sagrado interior.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Expressão locativa natural em português, ligada a “templo de Deus”, sem acrescentar uma explicação ausente do grego.
- source_word: ἠνοίγη
  choice: se abriu
  rationale: Preserva o caráter passivo/eventivo do aoristo sem nomear o agente implícito; em português, a construção pronominal é mais natural que “foi aberto” neste contexto.
- source_word: ὤφθη
  choice: foi vista
  rationale: Corresponde de perto ao passivo grego e evita decidir se a arca apareceu ativamente ou apenas se tornou visível.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: a arca da sua aliança
  rationale: Mantém explicitamente αὐτοῦ como “sua” e traduz διαθήκη pelo termo bíblico corrente “aliança”.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: no seu templo
  rationale: Mantém tanto a repetição de ναός quanto o possessivo αὐτοῦ, seguindo a estrutura do original.
- source_word: ἐγένοντο
  choice: houve
  rationale: Forma idiomática de apresentar o surgimento dos fenômenos enumerados.
- source_word: ἀστραπαὶ
  choice: relâmpagos
  rationale: Equivalente português natural que comunica adequadamente o plural.
- source_word: φωναὶ
  choice: vozes
  rationale: Tradução lexical direta que preserva a expressão teofânica recorrente do Apocalipse, sem reduzi-la a ruídos meteorológicos.
- source_word: βρονταὶ
  choice: trovões
  rationale: Plural natural em português, adequado à sequência de fenômenos teofânicos.
- source_word: σεισμὸς
  choice: um terremoto
  rationale: Equivalente corrente de σεισμός neste contexto de manifestação e juízo.
- source_word: χάλαζα μεγάλη
  choice: uma forte chuva de granizo
  rationale: Expressão natural em português para uma ocorrência intensa de granizo; comunica o valor de μεγάλη sem sugerir necessariamente pedras individualmente grandes.
theological_decisions:
- issue: Natureza do ναός celestial
  choice: templo
  alternative: santuário
  rationale: “Templo” não impõe uma descrição arquitetônica mais estreita do espaço celestial, enquanto a nota registra o sentido mais específico possível de ναός.
- issue: Sentido de φωναὶ na sequência teofânica
  choice: vozes
  alternative: sons ou estrondos
  rationale: A escolha conserva a dicção característica e a ambiguidade do Apocalipse, sem decidir que se trata somente de fala articulada ou de ruídos.
- issue: Identificação da aliança
  choice: sua aliança
  alternative: a aliança
  rationale: O pronome grego αὐτοῦ identifica explicitamente a aliança como pertencente a Deus; omiti-lo tornaria a formulação mais tradicional, porém menos completa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e a repetição de “templo” acompanham o grego; a pontuação em duas frases evita uma coordenação excessivamente longa sem alterar a progressão do versículo.
