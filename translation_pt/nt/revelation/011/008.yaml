  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: pt
  text: E o cadáver deles[b] ficará na rua da grande cidade[c], que espiritualmente[a] se chama Sodoma e Egito, onde também o Senhor deles foi crucificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “figuradamente” ou “simbolicamente”.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega “cadáver” no singular, provavelmente tratando as duas testemunhas como uma unidade; muitas traduções usam o plural para maior naturalidade.
    reason: alternative_reading
  - marker: c
    text: A expressão “onde também o Senhor deles foi crucificado” aponta para Jerusalém, embora o texto preserve o título simbólico “a grande cidade”.
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: o cadáver deles
  rationale: “Cadáver” expressa de modo direto o corpo morto, e o singular preserva a forma do grego, que apresenta as duas testemunhas como uma unidade coletiva.
- source_word: ἐπὶ τῆς πλατείας
  choice: na rua
  rationale: πλατεῖα pode designar uma rua larga ou uma praça pública. “Na rua” é natural em português e preserva a imagem urbana sem decidir indevidamente entre essas possibilidades.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: da grande cidade
  rationale: Mantém de perto a designação apocalíptica recorrente e teologicamente significativa em Apocalipse.
- source_word: πνευματικῶς
  choice: espiritualmente
  rationale: É o equivalente lexical mais direto e conserva a tensão entre uma designação espiritual e simbólica; “figuradamente” é registrado em nota como alternativa interpretativa.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodoma e Egito
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes próprios em português, sem explicitar no texto as associações simbólicas.
- source_word: ὅπου καὶ
  choice: onde também
  rationale: Preserva tanto o valor locativo de ὅπου quanto a força aditiva de καί.
- source_word: ὁ κύριος αὐτῶν
  choice: o Senhor deles
  rationale: “Senhor” preserva o título cristológico de κύριος, enquanto “deles” mantém a referência às duas testemunhas.
- source_word: ἐσταυρώθη
  choice: foi crucificado
  rationale: Tradução histórica e convencional do aoristo passivo de σταυρόω.
theological_decisions:
- issue: Singular πτῶμα com referente plural
  choice: Manter “o cadáver deles” no singular.
  alternative: “os cadáveres deles”
  rationale: Embora haja duas testemunhas, o substantivo grego está no singular e pode tratá-las coletivamente. A forma singular conserva esse efeito retórico, ainda que seja incomum.
- issue: Sentido de πνευματικῶς
  choice: Traduzir por “espiritualmente” no texto principal.
  alternative: “figuradamente” ou “simbolicamente”
  rationale: A tradução direta evita reduzir a expressão a uma categoria meramente literária; a alternativa mais explicativa é oferecida em nota.
- issue: Identificação da “grande cidade”
  choice: Deixar a identificação implícita.
  alternative: Substituir ou explicar no texto como “Jerusalém”.
  rationale: A referência ao lugar onde o Senhor foi crucificado aponta para Jerusalém, mas o texto mantém deliberadamente a designação apocalíptica “a grande cidade” e os nomes simbólicos “Sodoma e Egito”.
- issue: Verbo subentendido na oração inicial
  choice: Empregar “ficará” para formar uma oração portuguesa natural no fluxo profético.
  alternative: “estará” ou “jaz”
  rationale: O grego apresenta uma construção nominal sem verbo expresso. “Ficará” comunica naturalmente a situação futura no contexto, sem acrescentar a ideia mais específica de que o cadáver “jaz”.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas naturais para leitores brasileiros. Conserva-se o singular deliberadamente incomum em “o cadáver deles” e a tradução direta “espiritualmente”, com esclarecimentos em notas.
