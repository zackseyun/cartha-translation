id: REV.11.17
reference: Revelation 11:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: pt
  text: 'dizendo: “Nós te damos graças, Senhor Deus, o Todo-Poderoso, aquele que é e que era[a], porque tomaste o teu grande poder e começaste a reinar[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e traduções incluem “e que há de vir”; o texto grego aqui adotado não contém essa expressão.
    reason: textual_variant
  - marker: b
    text: Ou “reinaste” ou “te tornaste rei”. O verbo grego pode destacar o início ou o exercício do governo real; aqui, provavelmente ressalta a manifestação pública do reinado de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Particípio presente que introduz o conteúdo da fala dos anciãos e mantém a ligação com o versículo anterior.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Nós te damos graças
  rationale: Expressão natural e solene em português, adequada ao contexto litúrgico de adoração.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Senhor Deus, o Todo-Poderoso
  rationale: Preserva a sequência de títulos divinos e usa a forma bíblica corrente e digna em português.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: aquele que é e que era
  rationale: Conserva os valores temporais do presente e do imperfeito e apresenta a expressão como designação divina, sem acrescentar a fórmula ausente no texto grego.
- source_word: ὅτι
  choice: porque
  rationale: 'Expressa claramente a relação causal: a ação de Deus é o motivo das graças.'
- source_word: εἴληφας
  choice: tomaste
  rationale: O perfeito grego descreve uma ação realizada com relevância presente; o pretérito perfeito português é idiomático e adequado nesse contexto.
- source_word: τὴν δύναμίν σου τὴν μεγάλην
  choice: o teu grande poder
  rationale: Tradução direta, clara e natural que preserva o possessivo e a intensidade do adjetivo.
- source_word: ἐβασίλευσας
  choice: começaste a reinar
  rationale: Representa a possível força ingressiva do aoristo no contexto, enfatizando o início da manifestação decisiva do reinado, sem declarar que Deus antes não possuía soberania.
theological_decisions:
- issue: Fórmula do título divino sem a expressão futura
  choice: aquele que é e que era
  alternative: aquele que é, que era e que há de vir
  rationale: O SBLGNT contém somente ὁ ὢν καὶ ὁ ἦν neste versículo. A tradução não harmoniza a passagem com fórmulas mais longas presentes em outros lugares de Apocalipse.
- issue: Nuance de ἐβασίλευσας em relação ao reinado de Deus
  choice: começaste a reinar
  alternative: reinaste; tornaste-te rei
  rationale: A formulação comunica a manifestação decisiva do governo real de Deus no contexto escatológico. Evita a expressão mais forte “tornaste-te rei”, que poderia sugerir que Deus não era anteriormente soberano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “te damos” é natural; “o Todo-Poderoso” preserva o caráter titular de παντοκράτωρ. Os marcadores foram posicionados exatamente junto às expressões que as notas esclarecem.
