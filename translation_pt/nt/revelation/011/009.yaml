id: REV.11.9
reference: Revelation 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: pt
  text: E alguns dentre os povos, tribos, línguas e nações olham para o cadáver deles durante três dias e meio[a] e não permitem que os corpos deles sejam colocados num túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz primeiro “o cadáver deles” (singular) e depois “os corpos deles” (plural). O singular pode apresentar as duas testemunhas como um só testemunho coletivo antes de voltar a falar dos corpos individualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: olham para
  rationale: Expressa de modo natural a ação visual direta e preserva o presente vívido do grego.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: alguns dentre os povos, tribos, línguas e nações
  rationale: “Alguns dentre” explicita com naturalidade o sentido partitivo de ἐκ, sem sugerir que todos os integrantes desses grupos participam da ação.
- source_word: λαῶν
  choice: povos
  rationale: Mantém o plural coletivo e corresponde à fórmula recorrente de Apocalipse.
- source_word: φυλῶν
  choice: tribos
  rationale: É a equivalência corrente e adequada para grupos de parentesco ou identidade coletiva neste contexto.
- source_word: γλωσσῶν
  choice: línguas
  rationale: Designa comunidades linguísticas e preserva a formulação tradicional de Apocalipse em português moderno.
- source_word: ἐθνῶν
  choice: nações
  rationale: É a tradução mais adequada na sequência etnográfica; “gentios” seria restritivo demais.
- source_word: τὸ πτῶμα αὐτῶν
  choice: o cadáver deles
  rationale: Preserva o substantivo singular do primeiro segmento, embora estejam em vista duas testemunhas, e comunica claramente que se trata de um corpo morto.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: durante três dias e meio
  rationale: Traduz naturalmente o acusativo de duração e mantém com precisão o período apocalíptico.
- source_word: τὰ πτώματα αὐτῶν
  choice: os corpos deles
  rationale: Preserva a mudança para o plural no segundo segmento; o contexto já deixa claro que são corpos mortos.
- source_word: οὐκ ἀφίουσιν
  choice: não permitem
  rationale: Neste contexto, ἀφίημι tem o sentido de permitir, não o de deixar para trás ou perdoar.
- source_word: τεθῆναι εἰς μνῆμα
  choice: sejam colocados num túmulo
  rationale: Reproduz a ideia específica de colocar os corpos em um lugar de sepultamento, em vez de usar o termo mais amplo “sepultar”.
theological_decisions:
- issue: Singular πτῶμα no primeiro segmento e plural πτώματα no segundo
  choice: Manter “o cadáver deles” no singular e “os corpos deles” no plural
  alternative: 'Harmonizar os dois segmentos no plural: “os cadáveres deles” e “os corpos deles”'
  rationale: A variação de número está no texto grego e pode apresentar primeiro as duas testemunhas como um testemunho coletivo, para depois voltar a distingui-las corporalmente. A tradução conserva essa tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sequência “povos, tribos, línguas e nações” preserva a cadência característica de Apocalipse. A construção incomum “o cadáver deles” é mantida deliberadamente e esclarecida em nota.
