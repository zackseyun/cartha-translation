id: REV.11.5
reference: Revelation 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: pt
  text: E, se alguém quer fazer-lhes mal, sai fogo da boca deles[a] e devora os seus inimigos; e, se alguém quiser fazer-lhes mal, assim terá de ser morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «das bocas deles». Em grego, o substantivo está no singular: literalmente, «da boca deles».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: fazer-lhes mal
  rationale: No contexto de hostilidade contra as duas testemunhas, a expressão comunica dano ou agressão de modo natural, sem limitar o verbo a uma forma específica de ataque.
- source_word: πῦρ
  choice: fogo
  rationale: Preserva diretamente a imagem vívida do texto apocalíptico, sem convertê-la em explicação metafórica.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: sai fogo da boca deles
  rationale: Expressão corrente em português que mantém o substantivo grego no singular com possuidor plural.
- source_word: κατεσθίει
  choice: devora
  rationale: Reproduz a força destrutiva e a vivacidade do verbo grego.
- source_word: ἐχθροὺς
  choice: inimigos
  rationale: Equivalente claro e usual para os que se opõem às testemunhas.
- source_word: θέλει / θελήσῃ
  choice: quer / quiser
  rationale: A primeira forma, no indicativo presente, é traduzida por «quer»; a segunda, no subjuntivo aoristo dentro da condição, por «quiser», preservando na medida do possível a diferença verbal do grego.
- source_word: οὕτως
  choice: é assim que
  rationale: Retoma de maneira clara o modo de morte acabado de descrever.
- source_word: δεῖ
  choice: terá de
  rationale: Expressa necessidade ou inevitabilidade sem explicitar indevidamente se ela é profética ou diretamente divina.
- source_word: ἀποκτανθῆναι
  choice: ser morto
  rationale: Mantém a voz passiva e comunica de modo direto o sentido do infinitivo.
theological_decisions:
- issue: Se a imagem do fogo que sai da boca deve ser interpretada na tradução
  choice: 'Manter a imagem concreta: «sai fogo da boca deles».'
  alternative: Explicá-la como palavra ou juízo destrutivo procedente das testemunhas.
  rationale: O texto apresenta a imagem sem explicá-la. Preservá-la deixa em aberto sua leitura literal ou simbólica e evita inserir uma interpretação teológica no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Fazer-lhes mal» é amplamente compreensível; «é assim que terá de ser morto» conserva tanto a referência ao modo descrito quanto a força de necessidade.
