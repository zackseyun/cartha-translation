id: REV.11.12
reference: Revelation 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: pt
  text: 'E eles ouviram uma voz forte do céu, que lhes dizia: “Subam para cá.” E subiram ao céu na nuvem[a], e os inimigos deles os observaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa nuvem”. O grego diz “na nuvem”, expressão que também pode evocar cenas bíblicas da presença e da vindicação divinas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ouviram
  rationale: O aoristo de ἀκούω descreve o acontecimento de ouvir a voz celestial, não uma ação prolongada de escutar.
- source_word: φωνῆς μεγάλης
  choice: uma voz forte
  rationale: Em português, “voz forte” expressa naturalmente a intensidade de μεγάλης neste contexto; “grande voz” seria excessivamente literal.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vinda do céu
  rationale: O contexto visionário e a origem da voz indicam o céu, e a formulação explicita com naturalidade sua procedência.
- source_word: λεγούσης αὐτοῖς
  choice: que lhes dizia
  rationale: A oração relativa liga claramente o particípio à voz e preserva o destinatário expresso por αὐτοῖς.
- source_word: Ἀνάβατε ὧδε
  choice: Subam para cá
  rationale: O imperativo plural mantém a convocação dirigida às duas testemunhas, enquanto “para cá” preserva o ponto de referência de ὧδε junto de quem fala do céu.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: subiram ao céu
  rationale: “Subiram ao céu” transmite de modo corrente o movimento ascendente e o destino marcado por εἰς, sem introduzir terminologia técnica.
- source_word: ἐν τῇ νεφέλῃ
  choice: na nuvem
  rationale: Preserva o artigo grego e a possível evocação bíblica da nuvem associada à presença e à vindicação divinas.
- source_word: ἐθεώρησαν
  choice: ficaram olhando para eles
  rationale: θεωρέω sugere observação atenta; esta formulação comunica melhor esse aspecto do que o simples “viram”.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: os seus inimigos
  rationale: Tradução possessiva natural que mantém explícita a relação dos inimigos com as testemunhas.
theological_decisions:
- issue: Possível alusão na expressão “na nuvem”
  choice: Manter “na nuvem” no texto principal
  alternative: numa nuvem
  rationale: O artigo definido grego pode apontar para o conhecido motivo bíblico da nuvem ligada à presença e à vindicação divinas. A tradução preserva essa possibilidade sem tornar a alusão mais explícita do que o original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural do imperativo foi preservado; evitou-se “vocês” porque a forma verbal já identifica os destinatários. O marcador [a] aparece imediatamente após a expressão comentada.
