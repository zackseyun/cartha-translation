source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: pt
  text: Mas, quanto ao pátio exterior do santuário[a], deixe-o de fora e não o meça, porque foi entregue às nações[b], e elas pisotearão a cidade santa durante quarenta e dois meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pátio exterior do templo”. O grego ναός pode designar mais especificamente o santuário, isto é, o edifício sagrado propriamente dito, ou, em sentido mais amplo, o templo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos gentios”. O termo grego ἔθνεσιν pode significar “nações” ou “gentios”, conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: pátio
  rationale: No contexto do templo, designa a área aberta adjacente ao santuário; “pátio” é claro e natural em português.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: que fica fora do santuário
  rationale: Expressa a localização do pátio em relação ao ναός e preserva a distinção espacial presente no grego.
- source_word: ναός
  choice: santuário
  rationale: Aqui o termo provavelmente indica o edifício sagrado propriamente dito, em contraste com o pátio exterior. “Templo” permanece como alternativa possível em nota.
- source_word: ἔκβαλε ἔξωθεν
  choice: deixe de fora
  rationale: A expressão, ligada à ordem seguinte de não medir, indica exclusão do âmbito da medição, não necessariamente expulsão física.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: não o meça
  rationale: Mantém a proibição direta na segunda pessoa do singular; o pronome retoma naturalmente “pátio” em português.
- source_word: ἐδόθη
  choice: foi entregue
  rationale: Preserva o aoristo passivo e não explicita o agente não mencionado. “Entregue” comunica concessão de domínio ou controle no contexto.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: Preserva o sentido coletivo amplo e o tom profético-apocalíptico, sem eliminar a possível leitura “aos gentios”.
- source_word: πόλιν τὴν ἁγίαν
  choice: a cidade santa
  rationale: É a formulação bíblica convencional e não identifica além do que o próprio versículo declara.
- source_word: πατήσουσιν
  choice: pisarão
  rationale: Conserva a imagem concreta de profanação e domínio hostil, com linguagem natural e digna.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: durante quarenta e dois meses
  rationale: Torna explícito, de modo idiomático em português, o acusativo grego de duração.
theological_decisions:
- issue: Especificidade de ναός na imagem apocalíptica do templo
  choice: “santuário” no texto principal
  alternative: “templo”
  rationale: A oposição entre o pátio exterior e o ναός favorece o sentido mais específico de edifício sagrado ou santuário. A alternativa mais ampla é mantida em nota para preservar a ambiguidade lexical.
- issue: Sentido de ἔθνεσιν
  choice: “às nações” no texto principal
  alternative: “aos gentios”
  rationale: O termo pode designar as nações em geral ou os gentios em contraste com Israel. “Nações” preserva melhor a amplitude e o registro profético, enquanto a nuance étnico-religiosa é registrada em nota.
- issue: Agente implícito de ἐδόθη
  choice: manter a voz passiva sem nomear o agente
  alternative: explicitar que Deus entregou
  rationale: O grego não identifica o agente. A tradução evita resolver se se trata de passivo divino ou de outra forma de concessão dentro da visão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A formulação preserva a sequência imperativa, a voz passiva sem agente explícito e as ambiguidades relevantes de ναός e ἔθνη.
