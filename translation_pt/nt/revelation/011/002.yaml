revisions:
- from: Mas deixe de fora o pátio que fica fora do santuário[a] e não o meça, porque ele foi entregue às nações[b], e elas pisarão a cidade santa durante quarenta e dois meses.
  to: Mas, quanto ao pátio exterior do santuário[a], deixe-o de fora e não o meça, porque foi entregue às nações[b], e elas pisotearão a cidade santa durante quarenta e dois meses.
  rationale: A revisão elimina uma duplicação pouco natural, preservando tanto a identificação do pátio como exterior ao ναός quanto a ordem de excluí-lo da medição. Também ajusta a nota lexical para que ofereça uma alternativa textual completa e emprega “pisotearão” para reproduzir melhor a força do verbo grego.
