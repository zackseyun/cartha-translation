review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de ordens, a voz passiva sem agente expresso, a referência às nações e a duração de quarenta e dois meses. Contudo, a repetição de “de fora ... que fica fora” torna menos clara a construção portuguesa e pode ser substituída por uma formulação que reflita mais diretamente o contraste entre o pátio exterior e o ναός. “Pisotearão” comunica mais plenamente a força de πατήσουσιν do que “pisarão”.
  naturalness: O registro é moderno e apropriado, mas “deixe de fora o pátio que fica fora do santuário” é estilisticamente pesado pela duplicação imediata de “fora”. “Quanto ao pátio exterior do santuário, deixe-o de fora” é natural, claro e mantém a exclusão da medição.
  terminology: “Santuário” é uma escolha defensável para ναός neste contraste espacial; “pátio exterior” representa bem αὐλή ... ἔξωθεν τοῦ ναοῦ. “Nações” mantém a amplitude de ἔθνεσιν, com “gentios” corretamente preservado como alternativa. A nota a deve apresentar uma alternativa completa, e não apenas “fora do templo”, que não corresponde sozinha à expressão traduzida.
  issues:
  - severity: medium
    issue: Redundância e leve aspereza em “deixe de fora o pátio que fica fora do santuário”.
    rationale: Embora os dois elementos espaciais estejam no grego, a repetição literal de “fora” em português prejudica a fluência. “Pátio exterior ... deixe-o de fora” mantém ambos os elementos e a função de exclusão.
  - severity: low
    issue: A nota a oferece “fora do templo” como se fosse uma alternativa autônoma.
    rationale: A alternativa relevante é a designação completa “pátio exterior do templo”, em contraste com “pátio exterior do santuário”; a forma atual não substitui adequadamente o trecho assinalado.
  - severity: low
    issue: “Pisarão” atenua a imagem de πατήσουσιν.
    rationale: No contexto de domínio hostil e profanação, “pisotearão” expressa com maior precisão o ato de calcar sob os pés, sem introduzir interpretação adicional.
