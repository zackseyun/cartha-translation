    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos gentios”. O termo grego ἔθνεσιν pode significar “nações” ou “gentios”, conforme o contexto.'
    reason: alternative_reading
  revision_rationale: A revisão elimina uma duplicação pouco natural, preservando tanto a identificação do pátio como exterior ao ναός quanto a ordem de excluí-lo da medição. Também ajusta a nota lexical para que ofereça uma alternativa textual completa e emprega “pisotearão” para reproduzir melhor a força do verbo grego.
