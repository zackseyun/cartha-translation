id: REV.11.13
reference: Revelation 11:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: pt
  text: E naquela hora houve um grande terremoto, e a décima parte da cidade caiu. Sete mil pessoas[a] foram mortas no terremoto; as demais pessoas ficaram aterrorizadas e deram glória ao Deus do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nomes de pessoas, sete mil” — expressão que designa sete mil pessoas contadas entre os mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: naquela hora
  rationale: Preserva a vivacidade e a proximidade temporal da expressão apocalíptica, sem recorrer ao menos específico «naquele momento».
- source_word: ἐγένετο σεισμὸς μέγας
  choice: houve um grande terremoto
  rationale: Forma natural em português para anunciar a ocorrência do evento, mantendo diretamente o sentido de σεισμός e μέγας.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: a décima parte da cidade
  rationale: Expressa com clareza a relação partitiva e conserva a precisão numérica do grego.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Equivalente direto que não especifica além do texto se essa parte desabou ou foi destruída de outra maneira.
- source_word: ἀπεκτάνθησαν
  choice: morreram
  rationale: No contexto do terremoto, comunica naturalmente o resultado mortal do passivo grego; evita a sugestão, possível em «foram mortos», de agentes humanos executando as vítimas.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: sete mil pessoas
  rationale: Transmite em português corrente o sentido da expressão incomum «nomes de pessoas, sete mil», cuja forma literal é registrada em nota.
- source_word: οἱ λοιποὶ
  choice: as demais
  rationale: Tradução direta e inclusiva em relação a «pessoas», sem introduzir a interpretação mais explícita «os sobreviventes».
- source_word: ἔμφοβοι ἐγένοντο
  choice: ficaram aterrorizadas
  rationale: Preserva tanto a mudança de estado indicada por ἐγένοντο quanto a intensidade de ἔμφοβοι, em linguagem portuguesa natural.
- source_word: ἔδωκαν δόξαν
  choice: deram glória
  rationale: Mantém o conhecido idioma bíblico e não explica antecipadamente a natureza espiritual da reação.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: ao Deus do céu
  rationale: Conserva o título genitivo do original em sua forma bíblica natural em português.
theological_decisions:
- issue: Se a reação das demais pessoas deve ser apresentada como arrependimento genuíno ou fé salvadora
  choice: O texto diz apenas que ficaram aterrorizadas e deram glória ao Deus do céu.
  alternative: Explicitar que se arrependeram de verdade, ou que apenas reconheceram externamente o poder de Deus.
  rationale: O grego declara medo e atribuição de glória a Deus, mas não define a qualidade interior dessa resposta. A tradução preserva essa tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a longa coordenação grega para maior clareza sem alterar sua sequência. A concordância feminina em «as demais ficaram aterrorizadas» retoma naturalmente «pessoas».
