id: REV.11.18
reference: Revelation 11:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: pt
  text: As nações ficaram iradas, e veio a tua ira, e chegou o tempo de os mortos serem julgados, de dar a recompensa aos teus servos[a] — os profetas, os santos e os que temem o teu nome, tanto os pequenos como os grandes — e de destruir os que destroem[b] a terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos”. O grego doulos pode indicar um servo ou um escravo, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “corrompem” ou “arruínam”. O verbo grego também pode expressar a ideia de corromper ou arruinar.
    reason: lexical_alternative
  - marker: c
    text: Ou “terra” no sentido de “região” ou “país”. A palavra grega também pode ter esse sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: nações
  rationale: Em Apocalipse, o termo normalmente designa coletivamente as nações do mundo; “nações” é mais adequado aqui do que “gentios”.
- source_word: ὠργίσθησαν
  choice: ficaram iradas
  rationale: Expressa a entrada num estado de ira sem intensificar indevidamente o verbo e mantém a ligação lexical e retórica com “ira” na oração seguinte.
- source_word: ὀργή
  choice: ira
  rationale: Preserva a força judicial e escatológica da ira divina, além do contraste deliberado com a ira das nações.
- source_word: καιρός
  choice: tempo
  rationale: Designa o momento decisivo e determinado; o caráter escatológico desse tempo fica claro pelo contexto.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: de os mortos serem julgados
  rationale: Reproduz de modo claro e natural a construção passiva e seu sentido judicial.
- source_word: μισθός
  choice: recompensa
  rationale: Comunica a retribuição concedida por Deus sem sugerir necessariamente uma relação salarial ou comercial.
- source_word: δούλοις
  choice: servos
  rationale: Neste contexto, é uma designação honrosa dos que pertencem e servem a Deus; “escravos” continua lexicalmente possível e é registrado em nota.
- source_word: προφήταις
  choice: os profetas
  rationale: Mantém a designação reconhecível do grupo e a articulação presente no grego.
- source_word: ἁγίοις
  choice: os santos
  rationale: É a designação bíblica corrente e inteligível para o povo consagrado a Deus em Apocalipse.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: os que temem o teu nome
  rationale: Preserva o conhecido modo bíblico de expressar temor reverente, sem reduzi-lo interpretativamente a mera reverência.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: tanto os pequenos como os grandes
  rationale: Expressa de forma idiomática a abrangência de todos os níveis de condição ou importância, preservando o par contrastivo.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: destruir os que destroem
  rationale: Conserva a repetição da mesma raiz grega e o efeito de retribuição correspondente.
- source_word: γῆ
  choice: terra
  rationale: O contexto de juízo apocalíptico favorece o alcance mundial, embora o termo também possa designar uma terra ou região.
theological_decisions:
- issue: Sentido de δοῦλος como designação do povo de Deus
  choice: servos
  alternative: escravos
  rationale: A ênfase imediata recai sobre os que pertencem a Deus e recebem recompensa, não especificamente sobre sua condição jurídica; a alternativa mais forte é mantida em nota.
- issue: Alcance de γῆ
  choice: terra, no sentido do mundo terrestre
  alternative: terra ou região
  rationale: O cenário cósmico e escatológico favorece o sentido mais amplo, sem excluir a amplitude lexical do substantivo grego.
- issue: Relação entre os grupos que recebem recompensa
  choice: “os profetas, os santos e os que temem o teu nome” como grupos coordenados sob “teus servos”
  alternative: entender “os santos e os que temem o teu nome” como explicações parcialmente sobrepostas ou abrangentes
  rationale: A tradução mantém a coordenação e a possível sobreposição entre as designações, sem impor categorias mutuamente exclusivas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficaram iradas” e “ira” preservam a correspondência retórica do original. “Bem como” torna natural a coordenação dos dois elementos que chegaram — a ira e o tempo — sem alterar sua relação. Os travessões delimitam com clareza a enumeração ligada a “teus servos”.
