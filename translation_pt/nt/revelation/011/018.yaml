revisions:
- from: As nações ficaram iradas, e chegou a tua ira, bem como o tempo de os mortos serem julgados, de dar a recompensa aos teus servos[a] — os profetas, os santos e os que temem o teu nome, tanto os pequenos como os grandes — e de destruir os que destroem a terra.[b]
  to: As nações ficaram iradas, e veio a tua ira, e chegou o tempo de os mortos serem julgados, de dar a recompensa aos teus servos[a] — os profetas, os santos e os que temem o teu nome, tanto os pequenos como os grandes — e de destruir os que destroem[b] a terra.[c]
  rationale: A revisão elimina a coordenação algo pesada introduzida por «bem como» e, sobretudo, separa as alternativas lexicais que dizem respeito a palavras diferentes. Não altera o sentido, a estrutura da enumeração nem a ambiguidade quanto à relação entre os grupos designados.
