  naturalness: A redação é em geral clara e digna, mas «chegou a tua ira, bem como o tempo» é menos natural e suaviza a sucessão coordenada do grego. Repetir o verbo em «veio a tua ira, e chegou o tempo» é mais fluente e preserva melhor a coordenação.
  terminology: «Nações», «ira», «recompensa», «servos», «profetas», «santos», «os que temem o teu nome» e «terra» são escolhas adequadas. «Pequenos e grandes» preserva bem o par de abrangência. As alternativas de «corrompem/arruínam» e de «terra/região» devem receber âncoras distintas.
