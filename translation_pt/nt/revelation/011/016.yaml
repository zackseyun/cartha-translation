id: REV.11.16
reference: Revelation 11:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: pt
  text: E os vinte e quatro anciãos, que estavam sentados em seus tronos diante de Deus, caíram com o rosto em terra e adoraram a Deus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: Em Apocalipse, o termo designa as figuras do conselho celestial tradicionalmente chamadas de “anciãos”, e não apenas homens idosos.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa a posição e a presença relacional perante Deus de modo natural e digno em português.
- source_word: καθήμενοι
  choice: estavam sentados
  rationale: O particípio descreve a posição contínua dos anciãos e é vertido com fluidez narrativa.
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: em seus tronos
  rationale: Esta é a forma idiomática em português para indicar que ocupavam os próprios tronos.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: prostraram-se com o rosto em terra
  rationale: Reproduz claramente a postura corporal de completa reverência sem recorrer à expressão pouco natural “caíram sobre seus rostos”.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: Como o ato é dirigido explicitamente a Deus na cena celestial, o sentido religioso de adoração é inequívoco.
- source_word: θεῷ / θεοῦ
  choice: Deus
  rationale: Equivalente português padrão de θεός nos dois casos gramaticais.
- source_word: οἱ εἴκοσι τέσσαρες
  choice: os vinte e quatro
  rationale: Mantém o artigo que identifica o grupo conhecido na visão e segue a forma numérica corrente em português.
theological_decisions:
- issue: Sentido de προσκυνέω numa cena litúrgica celestial
  choice: adoraram
  alternative: inclinaram-se; prestaram homenagem
  rationale: O objeto explícito é Deus, e o contexto da sala do trono indica adoração religiosa; a tradução evita enfraquecer o ato sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Prostraram-se com o rosto em terra” preserva a imagem concreta do grego em formulação natural. A ordem foi levemente ajustada para que “diante de Deus” se ligue sem ambiguidade à posição dos anciãos nos tronos.
