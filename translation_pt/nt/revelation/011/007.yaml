id: REV.11.7
reference: Revelation 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: pt
  text: Quando terminarem o seu testemunho, a besta que sobe do abismo fará guerra contra eles[a], os vencerá e os matará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «fará guerra com eles».
    reason: alternativa lexical
lexical_decisions:
- source_word: τελέσωσιν
  choice: terminarem
  rationale: 'O aoristo do subjuntivo depois de ὅταν expressa uma eventualidade futura: «quando terminarem». A forma é natural e comunica a conclusão do testemunho.'
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: «Testemunho» conserva tanto o ato de dar testemunho quanto o conteúdo testemunhal, sem restringir indevidamente o sentido.
- source_word: θηρίον
  choice: besta
  rationale: «Besta» é uma tradução direta e reconhecível no contexto apocalíptico de Apocalipse.
- source_word: ἀναβαῖνον
  choice: que sobe
  rationale: A oração relativa reproduz naturalmente o particípio presente e mantém a imagem vívida do movimento para cima.
- source_word: ἀβύσσου
  choice: abismo
  rationale: «Abismo» corresponde diretamente ao termo grego e evita a interpretação adicional de «poço sem fundo».
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: fará guerra contra eles
  rationale: Embora μετά com o genitivo tenha formalmente o sentido de «com», a expressão indica hostilidade; «fazer guerra contra» é clara e idiomática em português. A forma mais literal é registrada em nota.
- source_word: νικήσει
  choice: os vencerá
  rationale: «Vencer» preserva a linguagem de conflito e também a conexão lexical com o tema recorrente de vencer em Apocalipse.
- source_word: ἀποκτενεῖ
  choice: os matará
  rationale: «Matar» é o equivalente moderno mais direto, sem o tom arcaizante de alternativas como «trucidar» ou «dar morte».
theological_decisions:
- issue: Relação hostil em ποιήσει μετ’ αὐτῶν πόλεμον
  choice: fará guerra contra eles
  alternative: fará guerra com eles
  rationale: A preposição grega pode ser reproduzida formalmente por «com», mas, nesta expressão, os verbos seguintes deixam inequívoca a hostilidade. «Contra» oferece em português atual o sentido contextual sem alterar a imagem, enquanto a nota preserva a construção formal.
translation_notes:
  register: Português moderno, claro e digno, com ordem verbal fluente. O sujeito de «terminarem» permanece implícito, como é natural em português; os pronomes masculinos «eles/os» refletem as formas masculinas do texto grego e permitem ligação com o referente do contexto.
