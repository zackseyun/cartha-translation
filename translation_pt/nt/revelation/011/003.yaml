  terminology: “Testemunhas” é o equivalente correto de μάρτυς neste contexto e conserva seu sentido jurídico-testemunhal sem identificar as figuras. “Pano de saco” é uma expressão estabelecida para σάκκους e mantém a imagem sem interpretá-la no texto.
