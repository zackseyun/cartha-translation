id: REV.11.3
reference: Revelation 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: pt
  text: E darei às minhas duas testemunhas[a], e elas profetizarão durante mil duzentos e sessenta dias, vestidas de pano de saco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “darei às minhas duas testemunhas”. O grego não declara o que lhes será dado; o contexto sugere uma capacitação, autoridade ou missão para profetizar.
    reason: lexical_alternative
  - marker: b
    text: O pano de saco era associado ao luto, ao arrependimento e à lamentação profética.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: darei
  rationale: Mantém o sentido básico de “dar” e preserva a omissão do objeto no grego, sem especificar como “autoridade”, “poder” ou “missão” aquilo que é dado.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: aos meus dois testemunhos
  rationale: Tradução direta e natural do dativo com possessivo; “testemunhos” preserva o sentido testemunhal de μάρτυς sem definir a identidade das figuras.
- source_word: προφητεύσουσιν
  choice: eles profetizarão
  rationale: Equivalente direto e corrente de προφητεύω, mantendo distinta a segunda oração coordenada.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: durante mil duzentos e sessenta dias
  rationale: O acusativo indica duração; “durante” expressa essa função com clareza em português moderno.
- source_word: περιβεβλημένοι
  choice: vestidos
  rationale: O particípio perfeito descreve o estado em que os dois testemunhos se encontram, isto é, trajando determinada roupa.
- source_word: σάκκους
  choice: de pano de saco
  rationale: Expressão portuguesa reconhecível para a veste áspera ligada, no mundo bíblico, ao luto, ao arrependimento e à lamentação profética.
theological_decisions:
- issue: Objeto implícito de δώσω
  choice: 'Preservar na oração principal a omissão do objeto: “darei aos meus dois testemunhos”.'
  alternative: “Darei autoridade aos meus dois testemunhos” ou “encarregarei meus dois testemunhos de profetizar”.
  rationale: O grego não declara o que será dado. O contexto sugere capacitação, autoridade ou comissão para profetizar, mas inserir uma dessas opções no texto principal resolveria uma ambiguidade genuína.
- issue: Valor simbólico do pano de saco
  choice: Conservar a imagem concreta “vestidos de pano de saco”.
  alternative: “vestidos em sinal de luto” ou “com roupas de penitência”.
  rationale: A imagem pode evocar luto, arrependimento e lamentação profética, mas o versículo não explicita apenas um desses sentidos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A elipse depois de “darei” é incomum, mas foi mantida de propósito para preservar a forma e a ambiguidade do texto grego; a nota esclarece a dificuldade sem impor uma interpretação no texto principal.
