id: REV.11.4
reference: Revelation 11:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: pt
  text: Estes são as duas oliveiras e os dois candelabros que estão diante do Senhor da terra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Zacarias 4, onde as imagens das oliveiras e do candelabro representam servos designados por Deus e capacitados pelo Espírito.
    reason: cross_reference
  - marker: b
    text: 'Ou: “que permanecem diante do Senhor da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Estes
  rationale: Pronome demonstrativo masculino plural que retoma as duas testemunhas no contexto, sem inserir explicitamente “testemunhas” neste versículo.
- source_word: ἐλαῖαι
  choice: oliveiras
  rationale: Designa aqui as árvores, preservando a imagem apocalíptica e a alusão a Zacarias 4.
- source_word: λυχνίαι
  choice: candelabros
  rationale: Refere-se aos suportes de lâmpadas, não às próprias lâmpadas; “candelabros” mantém a terminologia temática de Apocalipse.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa posição na presença de alguém de modo conciso, natural e fiel.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título reverencial e sua força teológica.
- source_word: γῆς
  choice: terra
  rationale: O alcance cósmico de Apocalipse favorece “terra”, em vez de “região” ou “país”.
- source_word: ἑστῶτες
  choice: que estão
  rationale: O particípio perfeito descreve a condição de permanecerem diante do Senhor. A oração relativa é natural em português e também preserva a possível ligação gramatical com os referentes masculinos.
theological_decisions:
- issue: Relação das imagens com Zacarias 4 e identidade das duas testemunhas
  choice: 'Manter diretamente a identificação metafórica: “as duas oliveiras e os dois candelabros”, sem explicar o simbolismo no texto principal.'
  alternative: 'Explicitar: “Estas duas testemunhas são como as duas oliveiras e os dois candelabros”.'
  rationale: O grego identifica as testemunhas por meio das imagens apocalípticas, sem introduzir uma comparação explícita. A tradução preserva a tensão teológica e a ressonância intertextual.
- issue: Referente de ἑστῶτες
  choice: Traduzir por “que estão”, permitindo que a concordância conceitual remeta às duas testemunhas representadas pelas imagens.
  alternative: Usar uma construção estritamente ligada aos substantivos imagéticos, como “postos diante do Senhor”.
  rationale: O particípio grego é masculino plural, embora “oliveiras” e “candelabros” formem um conjunto de gêneros mistos em português. A oração relativa comunica naturalmente que são os referentes pessoais, isto é, as testemunhas, que estão diante do Senhor, sem resolver além do necessário a construção figurada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Candelabros” preserva a terminologia bíblica usual para λυχνίαι; “que estão” evita uma construção pesada e conserva a referência pessoal sugerida pelo particípio masculino plural.
