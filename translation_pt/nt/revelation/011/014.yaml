id: REV.11.14
reference: Revelation 11:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: pt
  text: O segundo ai passou; eis que o terceiro ai vem rapidamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em breve”. O grego ταχύ pode enfatizar tanto a proximidade temporal quanto a rapidez.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: ai
  rationale: “Ai” é a expressão tradicional e direta de lamento ou calamidade iminente e, como substantivo numerado neste contexto, preserva a força apocalíptica e intertextual do termo.
- source_word: δευτέρα
  choice: segundo
  rationale: O ordinal modifica diretamente “ai” e é traduzido de modo simples e natural.
- source_word: ἀπῆλθεν
  choice: passou
  rationale: Embora o verbo signifique literalmente “foi embora” ou “partiu”, “passou” comunica com naturalidade que o segundo ai terminou.
- source_word: ἰδού
  choice: eis que
  rationale: A expressão chama solenemente a atenção para o que vem a seguir e combina com o registro profético do Apocalipse.
- source_word: τρίτη
  choice: terceiro
  rationale: O ordinal modifica diretamente “ai” e é traduzido de forma direta.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente conserva a vivacidade do grego e expressa a aproximação do acontecimento sem acrescentar uma afirmação mais forte de iminência.
- source_word: ταχύ
  choice: rapidamente
  rationale: O advérbio pode indicar rapidez ou proximidade temporal. “Rapidamente” preserva a ideia de urgência sem fixar um cronograma escatológico; a alternativa “em breve” é registrada em nota.
theological_decisions:
- issue: Sentido de ταχύ em contexto escatológico
  choice: rapidamente
  alternative: em breve
  rationale: O termo grego pode enfatizar tanto a rapidez ou súbita ocorrência quanto a proximidade temporal. O texto principal mantém a primeira nuance, enquanto a nota preserva a alternativa legítima sem resolver indevidamente a tensão escatológica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” mantém o tom profético sem tornar a frase obscura; “ai”, usado como substantivo, preserva a terminologia recorrente da sequência de juízos no Apocalipse.
