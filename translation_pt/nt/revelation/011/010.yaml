id: REV.11.10
reference: Revelation 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: pt
  text: E os que habitam na terra[a] se alegram por causa deles e festejam[b]. Enviarão presentes uns aos outros, porque esses dois profetas atormentaram os que habitam na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes da terra”. Em Apocalipse, esta expressão recorrente muitas vezes designa o mundo humano em rebelião contra Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “se entregam à alegria”. O verbo grego ressalta uma celebração festiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: os que habitam na terra
  rationale: Mantém a forma verbal da expressão recorrente em Apocalipse e a repete de modo idêntico nas duas ocorrências, com formulação natural em português.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: se alegram por causa deles
  rationale: Expressa a alegria motivada pelo que aconteceu aos dois profetas sem acrescentar explicitamente uma referência à morte, que vem do contexto.
- source_word: εὐφραίνονται
  choice: festejam
  rationale: Distingue este verbo de χαίρουσιν e comunica seu sentido de alegria festiva em linguagem atual.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: enviarão presentes uns aos outros
  rationale: Preserva o futuro de πέμψουσιν e a reciprocidade de ἀλλήλοις sem substituir a ação por uma paráfrase como “trocarão presentes”.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: esses dois profetas
  rationale: A forma demonstrativa retoma naturalmente, em português, os dois profetas já mencionados no contexto.
- source_word: ἐβασάνισαν
  choice: atormentaram
  rationale: Conserva a intensidade de βασανίζω, sem suavizá-la para “afligiram” ou “incomodaram”.
theological_decisions:
- issue: A expressão recorrente de Apocalipse para a humanidade ligada à terra e hostil a Deus
  choice: os que habitam na terra
  alternative: os habitantes da terra
  rationale: A tradução preserva a construção verbal e sua repetição, sem inserir no texto principal a interpretação de que todos os habitantes do planeta estejam necessariamente em vista.
- issue: A intensidade do efeito dos dois profetas sobre os habitantes da terra
  choice: atormentaram
  alternative: afligiram
  rationale: O verbo grego é forte. A tradução mantém essa tensão e não explica além do texto se o tormento decorre da mensagem, dos sinais ou dos juízos dos profetas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “os que habitam na terra” foi mantida para refletir a formulação enfática do original. A divisão em duas frases evita uma sequência excessivamente longa sem alterar as relações sintáticas.
