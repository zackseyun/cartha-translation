id: REV.11.15
reference: Revelation 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: pt
  text: 'Então o sétimo anjo tocou a trombeta[a], e houve vozes fortes no céu, que diziam: “O reino do mundo passou a pertencer ao nosso Senhor e ao seu Messias[b], e ele reinará para todo o sempre[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem “os reinos do mundo passaram a pertencer” ou “o reino deste mundo passou a pertencer”. O texto do SBLGNT traz o singular: “o reino do mundo”.'
    reason: textual_variant
  - marker: b
    text: Ou “seu Cristo”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu sentido titular.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para os séculos dos séculos”, expressão idiomática que indica duração sem fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: O verbo σαλπίζω significa soar ou tocar uma trombeta. Em português, “tocou a trombeta” explicita naturalmente o instrumento implícito no verbo.
- source_word: φωναὶ μεγάλαι
  choice: fortes vozes
  rationale: Como o particípio seguinte introduz fala articulada, φωναί refere-se a vozes; μεγάλαι indica sua grande intensidade, expressa naturalmente por “fortes”.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto de Apocalipse, οὐρανός designa o âmbito celestial, e “no céu” é a formulação portuguesa corrente.
- source_word: λέγοντες
  choice: que diziam
  rationale: A construção comunica o conteúdo proclamado pelas vozes. “Que diziam” é natural em português e evita reproduzir de forma artificial a discordância gramatical notável do grego.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: O reino do mundo passou a pertencer
  rationale: O substantivo βασιλεία está no singular no SBLGNT. No contexto, ἐγένετο seguido dos genitivos indica mudança de domínio; “passou a pertencer” comunica isso com clareza, sem acrescentar “deste” ao texto.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ao nosso Senhor
  rationale: O genitivo indica a quem o reino passou a pertencer. “Senhor” mantém a designação tradicional e titular de κύριος.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: ao seu Messias
  rationale: Χριστός funciona aqui como título, especialmente na expressão possessiva “seu Χριστός”; “Messias” preserva esse sentido.
- source_word: καὶ βασιλεύσει
  choice: e ele reinará
  rationale: O verbo está no futuro singular. O pronome singular preserva a forma do grego sem explicitar além do texto a identidade precisa do referente.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: A expressão idiomática literalmente relacionada às “eras das eras” comunica duração sem fim. “Para todo o sempre” é uma equivalência portuguesa natural e solene.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo é claramente titular na relação “seu Χριστός”. “Messias” torna transparente esse valor sem tratar o título como simples nome próprio.
- issue: Sujeito de βασιλεύσει
  choice: ele reinará
  alternative: eles reinarão; o Senhor e seu Messias reinarão
  rationale: O grego apresenta verbo singular. A tradução mantém o singular e deixa seu antecedente compacto, preservando a tensão do texto em vez de determinar explicitamente se a referência recai sobre o Senhor, sobre o Messias ou sobre a unidade do reinado proclamado.
- issue: Natureza da mudança expressa por ἐγένετο
  choice: passou a pertencer
  alternative: tornou-se o reino de
  rationale: A formulação escolhida expressa a transferência ou manifestação de domínio indicada pela construção, sem sugerir que o “reino do mundo” se transformou ontologicamente em outra realidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos, mantém o singular de “reino” e “reinará” e preserva a ambiguidade do referente do verbo final.
