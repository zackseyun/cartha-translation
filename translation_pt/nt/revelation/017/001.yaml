id: REV.17.1
reference: Revelation 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: pt
  text: 'Então veio um dos sete anjos que tinham as sete taças e falou comigo, dizendo: “Venha, eu lhe mostrarei o julgamento[a] da grande prostituta[b] que está sentada sobre muitas águas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a condenação” ou “a punição”.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “a grande meretriz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: Expressa de modo natural a progressão narrativa, sem perder a função conectiva do grego.
- source_word: ἦλθεν
  choice: veio
  rationale: Traduz diretamente o aoristo narrativo de ἔρχομαι.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: um dos sete anjos
  rationale: É a forma portuguesa idiomática para a construção partitiva grega.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: que tinham as sete taças
  rationale: Identifica os anjos mencionados anteriormente; “taças” preserva a imagem recorrente de φιάλαι no Apocalipse.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: falou comigo, dizendo
  rationale: Mantém o valor de μετά com genitivo e reproduz de maneira clara a introdução grega da fala.
- source_word: Δεῦρο
  choice: Venha
  rationale: É um chamado direto e natural em português; o uso da terceira pessoa evita regionalizar excessivamente o tratamento.
- source_word: δείξω σοι
  choice: eu lhe mostrarei
  rationale: Preserva diretamente o futuro indicativo e harmoniza com o tratamento “Venha”.
- source_word: τὸ κρίμα
  choice: o julgamento
  rationale: Mantém a amplitude semântica de κρίμα, que pode abranger a sentença condenatória e sua execução.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: da grande prostituta
  rationale: Traduz de modo contemporâneo e preciso a metáfora forte de πόρνη, sem arcaísmo nem identificação doutrinária adicional.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: que está sentada sobre muitas águas
  rationale: Conserva a postura e a imagem espacial do texto, cuja interpretação simbólica aparece depois no capítulo.
theological_decisions:
- issue: Sentido judicial de κρίμα no contexto apocalíptico
  choice: julgamento
  alternative: condenação; punição
  rationale: “Julgamento” preserva a tensão entre veredito e consequência punitiva, sem reduzir antecipadamente o alcance do termo.
- issue: Designação metafórica πόρνη aplicada à mulher/Babilônia
  choice: grande prostituta
  alternative: grande meretriz
  rationale: “Prostituta” comunica em linguagem atual a metáfora profética sexual e política, sem importar uma identificação confessional específica de Babilônia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “Venha... lhe” é natural e evita uma mistura pronominal. A ordem e as imagens apocalípticas foram preservadas sem explicá-las no corpo do versículo.
