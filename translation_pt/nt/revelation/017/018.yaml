- from: E a mulher que você viu é a grande cidade que exerce domínio sobre os reis da terra.[a]
  to: E a mulher que você viu é a grande cidade que tem domínio sobre os reis da terra.[a]
  rationale: A revisão substitui «exerce domínio» por «tem domínio», correspondendo mais diretamente a ἔχουσα («tendo»), sem alterar a compreensão de βασιλεία como autoridade soberana no contexto. A nota foi ajustada para explicitar a construção literal e manter as alternativas lexicais.
  reviewer_model: gpt-5.6-terra
