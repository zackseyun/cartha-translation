review_pass:
  verdict: revise
  source_fidelity: A identificação direta «a mulher ... é a grande cidade» reproduz fielmente ἡ γυνὴ ... ἔστιν ἡ πόλις ἡ μεγάλη. «Sobre os reis da terra» preserva adequadamente ἐπὶ τῶν βασιλέων τῆς γῆς. Contudo, «exerce domínio» explicita o exercício da autoridade, enquanto ἔχουσα («tendo/que tem») expressa primariamente posse; «tem domínio» conserva melhor a construção e o sentido, sem perder a força contextual.
  naturalness: O texto é claro e de registro apropriado. «A mulher que você viu» é natural e especialmente legível para leitores brasileiros. «Tem domínio sobre» é igualmente idiomático e mais próximo da forma grega.
  terminology: «Mulher», «grande cidade», «domínio», «reis» e «terra» são escolhas adequadas. A nota deve refletir com precisão que a alternativa literal é «tem um reino» e que βασιλεία pode designar reino, governo ou realeza.
  issues:
  - severity: low
    issue: «exerce domínio» é levemente mais interpretativo que ἔχουσα βασιλείαν.
    rationale: O particípio ἔχουσα significa «tendo» ou «que tem». Embora o contexto sustente autoridade sobre reis, «tem domínio» preserva tanto a posse expressa no grego quanto a leitura contextual de βασιλεία como domínio.
  revised_text: E a mulher que você viu é a grande cidade que tem domínio sobre os reis da terra.[a]
  revised_footnotes:
