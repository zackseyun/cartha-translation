id: REV.17.18
reference: Revelation 17:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: pt
  text: E a mulher que você viu é a grande cidade que tem domínio sobre os reis da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tem um reino sobre os reis da terra”. A expressão grega diz literalmente “tendo reino” e também pode ser entendida como “que possui governo real” ou “realeza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mulher
  rationale: No contexto da visão, refere-se à figura feminina simbólica; “mulher” é a tradução natural, sem introduzir o sentido contextual de “esposa”.
- source_word: ἣν εἶδες
  choice: que você viu
  rationale: Traduz diretamente a oração relativa e identifica a figura vista por João, em português atual e claro.
- source_word: πόλις ἡ μεγάλη
  choice: a grande cidade
  rationale: Correspondência direta e natural, preservando a identificação apocalíptica sem paráfrase interpretativa.
- source_word: ἔχουσα βασιλείαν
  choice: que exerce domínio
  rationale: A expressão literalmente envolve “ter reino/realeza”; neste contexto, com autoridade sobre reis, indica posse e exercício de poder soberano.
- source_word: ἐπὶ τῶν βασιλέων
  choice: sobre os reis
  rationale: Com o genitivo, ἐπί expressa aqui autoridade ou supremacia sobre os reis.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Preserva o alcance amplo e apocalíptico habitual de γῆ em Apocalipse, sem restringi-lo a uma região.
theological_decisions:
- issue: Natureza da identificação entre a mulher e a cidade
  choice: “a mulher ... é a grande cidade”
  alternative: “a mulher ... representa a grande cidade”
  rationale: O grego emprega a cópula simples ἔστιν (“é”). A tradução mantém a identificação simbólica tal como formulada, sem resolvê-la por meio de uma paráfrase explicativa.
- issue: Sentido de βασιλείαν na relação com os reis
  choice: “exerce domínio”
  alternative: “tem um reino”
  rationale: O contexto favorece a noção de autoridade soberana sobre os reis, mas a nota preserva a formulação mais literal e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna a referência singular explícita e natural. A formulação conserva o “é” do grego e registra em nota a amplitude semântica de βασιλεία.
