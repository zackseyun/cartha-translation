  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: pt
  text: E ele me levou, no Espírito,[a] para um lugar deserto. E vi uma mulher sentada sobre uma besta escarlate, cheia de nomes blasfemos e com sete cabeças e dez chifres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em espírito”. A expressão grega pode indicar um estado espiritual ou que ele foi levado pelo Espírito; em Apocalipse, ela costuma introduzir uma experiência visionária.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: me levou
  rationale: O aoristo de ἀποφέρω descreve transporte para outro lugar. “Me levou” é natural em português moderno e comunica o deslocamento sem acrescentar detalhes ausentes do grego.
- source_word: εἰς ἔρημον
  choice: para um lugar deserto
  rationale: Ἔρημος pode indicar deserto, região erma ou lugar desolado. “Um lugar deserto” preserva o sentido indefinido da forma sem artigo e evita sugerir necessariamente um deserto arenoso.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: Em Apocalipse, a expressão costuma introduzir uma experiência visionária profética. A forma escolhida indica a provável ação do Espírito, enquanto a leitura “em espírito” é mantida em nota.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: uma mulher sentada sobre uma besta escarlate
  rationale: A tradução conserva a imagem apocalíptica e a relação espacial expressa por ἐπί. “Besta” é o equivalente consagrado de θηρίον em Apocalipse, e “escarlate” traduz com precisão o vermelho vivo de κόκκινον.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: cheia de nomes blasfemos
  rationale: Γέμοντα significa “cheia”, e o genitivo βλασφημίας caracteriza os nomes como blasfemos. A concordância no feminino segue “besta” em português, embora o grego concorde no neutro com θηρίον.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: com sete cabeças e dez chifres
  rationale: “Com” reproduz naturalmente a função descritiva do particípio ἔχων e preserva sem explicação adicional os números e a imagética apocalíptica.
theological_decisions:
- issue: Sentido de ἐν πνεύματι
  choice: no Espírito
  alternative: em espírito
  rationale: A expressão recorrente em Apocalipse provavelmente indica experiência visionária sob a ação do Espírito. Como os manuscritos gregos não distinguem maiúsculas de modo equivalente ao português moderno, a alternativa menos específica é registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lugar deserto” é mais abrangente que “deserto” e representa melhor a amplitude semântica de ἔρημος. O segundo período mantém o encadeamento visual do grego sem explicar os símbolos.
