  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: pt
  text: E vi a mulher embriagada com o sangue dos santos e com o sangue das testemunhas de Jesus[a]. Ao vê-la, fiquei muito admirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos mártires de Jesus”. A palavra grega pode significar “testemunhas” ou “mártires”; aqui, a menção do sangue torna especialmente apropriado o sentido de pessoas mortas por seu testemunho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: embriagada com o sangue
  rationale: A construção descreve o estado da mulher e a causa figurada de sua embriaguez. Em português, “embriagada com o sangue” é natural e mantém a imagem chocante do grego.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Em Apocalipse, o termo designa o povo consagrado a Deus. “Santos” é conciso, tradicional e amplamente compreensível.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: das testemunhas de Jesus
  rationale: μάρτυς tem como sentido lexical básico “testemunha”, embora neste contexto o sangue indique testemunhas mortas por seu testemunho. “De Jesus” conserva a concisão e a possível amplitude do genitivo grego.
- source_word: ἰδὼν αὐτὴν
  choice: Ao vê-la
  rationale: A oração reduzida expressa naturalmente em português a relação temporal do particípio aoristo com o verbo principal.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: fiquei profundamente admirado
  rationale: O acusativo cognato intensifica o verbo. A formulação comunica grande assombro em português atual sem reproduzir de modo artificial a repetição lexical grega.
theological_decisions:
- issue: Sentido de μάρτυρες no contexto de perseguição apocalíptica
  choice: testemunhas de Jesus
  alternative: mártires de Jesus
  rationale: A tradução principal preserva o sentido de testemunho, importante em Apocalipse, enquanto a menção explícita ao sangue torna também presente a ideia desenvolvida de martírio. A nota mantém essa alternativa sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. Mantém a imagem forte da embriaguez de sangue e preserva a ambiguidade contextual de μάρτυρες por meio de nota.
