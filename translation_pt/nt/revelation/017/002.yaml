  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: pt
  text: com quem os reis da terra cometeram imoralidade sexual[a][b], e os que habitam na terra[c] embriagaram-se com o vinho da imoralidade sexual dela.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com ela”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, a linguagem de “imoralidade sexual” provavelmente simboliza uma aliança corrupta, idólatra ou infiel, mas conserva a força da metáfora sexual.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os habitantes da terra”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “da prostituição dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: com quem
  rationale: Preserva a construção relativa grega e retoma diretamente a mulher mencionada no versículo anterior.
- source_word: ἐπόρνευσαν
  choice: praticaram imoralidade sexual
  rationale: Mantém a força da metáfora sexual e, ao mesmo tempo, a amplitude semântica do verbo, sem reduzi-lo no texto principal a idolatria ou aliança política.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: os reis da terra
  rationale: Conserva a expressão recorrente de Apocalipse e o sentido amplo de γῆ neste contexto.
- source_word: ἐμεθύσθησαν
  choice: se embriagaram
  rationale: Expressa de modo natural em português o ingresso no estado de embriaguez indicado pelo aoristo passivo, sem tornar explícito um agente não mencionado.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: os que habitam na terra
  rationale: Preserva a forma verbal e a expressão característica e recorrente de Apocalipse.
- source_word: ἐκ τοῦ οἴνου
  choice: com o vinho
  rationale: Em português, “embriagar-se com o vinho” comunica naturalmente o meio ou a causa que ἐκ assinala, mantendo intacta a imagem.
- source_word: τῆς πορνείας αὐτῆς
  choice: da imoralidade sexual dela
  rationale: Mantém a correspondência com o verbo cognato ἐπόρνευσαν e conserva tanto a imagem sexual quanto sua possível dimensão simbólica.
theological_decisions:
- issue: Se πορνεύω/πορνεία deve ser explicitado como idolatria ou infidelidade político-religiosa no texto principal
  choice: Manter a imagem de imoralidade sexual sem paráfrase interpretativa
  alternative: Traduzir como “adultério espiritual” ou explicitar uma aliança idólatra e corrupta
  rationale: A linguagem de Apocalipse opera simultaneamente no plano sexual e simbólico. Preservar a metáfora mantém a ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo entre o verbo e o substantivo gregos e evita linguagem excessivamente técnica ou denominacional.
