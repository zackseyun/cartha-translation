id: REV.17.15
reference: Revelation 17:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: pt
  text: 'E ele me diz: “As águas que você viu, onde a prostituta está sentada, são povos, multidões, nações e línguas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄχλοι
  choice: multidões
  rationale: Expressa grupos humanos numerosos e corresponde naturalmente ao plural grego, sem reduzir o sentido a ajuntamentos ocasionais.
- source_word: γλῶσσαι
  choice: línguas
  rationale: Preserva a imagem e a formulação convencional de Apocalipse para comunidades diferenciadas pelo idioma.
- source_word: πόρνη
  choice: prostituta
  rationale: Termo atual, claro e não eufemístico para a figura simbólica designada pelo substantivo grego.
- source_word: κάθηται
  choice: está sentada
  rationale: Mantém o aspecto presente e a postura concreta da personagem sobre as águas.
theological_decisions:
- issue: Identificação simbólica das águas
  choice: Preservar a declaração direta de que as águas são povos, multidões, nações e línguas.
  alternative: Explicitar que as águas 'representam' esses grupos.
  rationale: O grego emprega εἰσίν, 'são'; a tradução conserva a força identificadora da linguagem visionária sem acrescentar uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da enumeração e a repetição de “e” refletem o ritmo do original. “Você” comunica naturalmente o singular μοι no português brasileiro contemporâneo.
source_grounding:
  english_pob_role: consult_only
