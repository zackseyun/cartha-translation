source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: pt
  text: A mulher estava vestida de púrpura e escarlate, adornada com ouro, pedras preciosas e pérolas, segurando na mão um cálice de ouro cheio de abominações e das coisas impuras de sua imoralidade sexual.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostituição” ou “fornicação”. No Apocalipse, o termo grego pode ter sentido tanto literal quanto metafórico.
    reason: Alternativas lexicais e preservação da dupla força possível de πορνεία.
lexical_decisions:
- source_word: περιβεβλημένη
  choice: estava vestida
  rationale: O particípio perfeito com ἦν descreve o estado resultante da mulher; a expressão mantém o sentido passivo e soa natural em português.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: de púrpura e escarlate
  rationale: Preserva as cores ligadas ao luxo e à ostentação, com termos tradicionais ainda compreensíveis no português moderno.
- source_word: κεχρυσωμένη
  choice: adornada
  rationale: Expressa ornamentação luxuosa sem restringir o ouro a revestimento ou joias específicas.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: com ouro, pedras preciosas e pérolas
  rationale: Reproduz a série de adornos de modo idiomático; o singular coletivo λίθῳ τιμίῳ é naturalmente vertido no plural genérico.
- source_word: ποτήριον χρυσοῦν
  choice: um cálice de ouro
  rationale: Cálice é natural para um recipiente de beber neste registro e mantém a imagem solene; de ouro evita qualquer ambiguidade cromática.
- source_word: γέμον
  choice: cheio de
  rationale: Equivalente direto e natural do particípio que descreve o conteúdo do cálice.
- source_word: βδελυγμάτων
  choice: abominações
  rationale: Conserva a forte carga moral e cultual do termo no contexto apocalíptico.
- source_word: τὰ ἀκάθαρτα
  choice: as impurezas
  rationale: O substantivo abstrato em português comunica a impureza moral e cultual do neutro plural grego com maior naturalidade do que uma tradução rígida como 'as coisas impuras'.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Mantém a amplitude semântica do termo e permite tanto sua força sexual literal quanto sua dimensão metafórica no Apocalipse.
theological_decisions:
- issue: Sentido de πορνεία na figura apocalíptica da mulher
  choice: imoralidade sexual
  alternative: prostituição; fornicação
  rationale: A imagem pode reunir conduta sexual literal e infidelidade idólatra metafórica. 'Imoralidade sexual' preserva essa tensão melhor que 'prostituição', mais específica, ou 'fornicação', menos corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda oração foi iniciada por 'Na mão' para evitar uma cadeia excessivamente longa de particípios sem alterar a relação sintática ou a imagem do original.
