revisions:
- from: A mulher estava vestida de púrpura e escarlate e adornada com ouro, pedras preciosas e pérolas. Na mão, segurava um cálice de ouro cheio de abominações e das impurezas de sua imoralidade sexual.[a]
  to: A mulher estava vestida de púrpura e escarlate, adornada com ouro, pedras preciosas e pérolas, segurando na mão um cálice de ouro cheio de abominações e das coisas impuras de sua imoralidade sexual.[a]
  rationale: A revisão mantém todas as escolhas lexicais centrais do rascunho, mas restaura numa única cadeia sintática a descrição da mulher e sua posse do cálice, conforme o particípio grego ἔχουσα. «Coisas impuras» traduz mais diretamente τὰ ἀκάθαρτα e mantém a ambiguidade moral, cultual e figurativa do contexto.
