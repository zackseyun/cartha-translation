review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente as imagens e os principais termos do grego. Contudo, a divisão em duas frases e a construção «Na mão, segurava» enfraquecem desnecessariamente a ligação do particípio ἔχουσα («tendo/segurando») com a mulher. «Coisas impuras» representa de forma mais direta o substantivo plural τὰ ἀκάθαρτα do que o abstrato «impurezas».
  naturalness: O texto é compreensível e de registro apropriado, mas uma única frase com «segurando na mão» é mais fluente, explícita e próxima da progressão imagética do original. «Cálice» é natural neste contexto solene.
  terminology: «Púrpura», «escarlate», «ouro», «pedras preciosas», «pérolas», «cálice», «abominações» e «imoralidade sexual» são escolhas adequadas. A nota preserva apropriadamente a amplitude literal e metafórica possível de πορνεία, sem impor uma interpretação.
  issues:
  - severity: low
    issue: A oração final foi separada e reformulada como «Na mão, segurava».
    rationale: Embora o sujeito permaneça recuperável, o grego mantém a mulher como referente explícito por meio de ἔχουσα. «Segurando na mão» conserva melhor essa relação e evita uma construção elíptica algo abrupta.
  - severity: low
    issue: «Impurezas» traduz τὰ ἀκάθαρτα de modo mais abstrato que o original.
    rationale: O grego usa um plural substantivado, «as coisas impuras». Esta formulação conserva a concretude e a força cultual-moral sem perda de naturalidade.
  revised_text: A mulher estava vestida de púrpura e escarlate, adornada com ouro, pedras preciosas e pérolas, segurando na mão um cálice de ouro cheio de abominações e das coisas impuras de sua imoralidade sexual.[a]
