id: REV.17.14
reference: Revelation 17:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: pt
  text: Estes guerrearão contra o Cordeiro[a], e o Cordeiro os vencerá, porque é Senhor dos senhores e Rei dos reis; e os que estão com ele são chamados, escolhidos e fiéis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “guerrearão com o Cordeiro”; neste contexto, a expressão significa guerrear contra ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Estes
  rationale: Preserva a força demonstrativa e remete aos reis mencionados no contexto anterior.
- source_word: μετὰ τοῦ ἀρνίου
  choice: contra o Cordeiro
  rationale: Embora μετά com genitivo normalmente signifique “com”, junto de πολεμέω indica aqui o adversário contra quem se guerreia; “com o Cordeiro” sugeriria aliança.
- source_word: ἀρνίον
  choice: Cordeiro
  rationale: É o título cristológico característico de Apocalipse; a forma portuguesa consagrada comunica o título sem tentar reproduzir artificialmente a nuance diminutiva.
- source_word: πολεμήσουσιν
  choice: guerrearão
  rationale: Expressa de modo conciso a ação militar e mantém o registro elevado e apocalíptico.
- source_word: νικήσει
  choice: vencerá
  rationale: Conserva o verbo temático de Apocalipse e soa mais natural em português neste contexto do que “conquistará”.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da vitória do Cordeiro.
- source_word: κύριος κυρίων
  choice: Senhor dos senhores
  rationale: Mantém o título superlativo de autoridade suprema e a forma tradicional inteligível em português.
- source_word: βασιλεὺς βασιλέων
  choice: Rei dos reis
  rationale: Preserva o título real superlativo e seu paralelismo com “Senhor dos senhores”.
- source_word: οἱ μετ’ αὐτοῦ
  choice: os que estão com ele
  rationale: É uma formulação portuguesa natural para os companheiros ou aliados do Cordeiro.
- source_word: κλητοὶ
  choice: chamados
  rationale: Preserva a amplitude teológica e lexical de κλητός sem decidir se a ênfase recai em convite ou convocação eficaz.
- source_word: ἐκλεκτοὶ
  choice: escolhidos
  rationale: É mais acessível que “eleitos” e evita inserir terminologia sistemática posterior.
- source_word: πιστοί
  choice: fiéis
  rationale: Abrange fidelidade, lealdade e constância, adequando-se à tríade descritiva.
theological_decisions:
- issue: O título do Cordeiro e a linguagem de vitória
  choice: “o Cordeiro” e “vencerá”
  alternative: “o cordeirinho” e “triunfará sobre”
  rationale: A tradução conserva o título cristológico distintivo e o verbo temático de Apocalipse, sem acrescentar conteúdo doutrinário.
- issue: A relação adversativa em μετὰ τοῦ ἀρνίου
  choice: “contra o Cordeiro” no texto, com nota sobre a forma grega
  alternative: “com o Cordeiro”
  rationale: O contexto bélico exige sentido adversativo, mas a nota preserva a peculiaridade literal da construção grega.
- issue: A tríade κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: “chamados, escolhidos e fiéis”
  alternative: “chamados, eleitos e fiéis”
  rationale: Mantém os três qualificativos sem resolver debates sobre vocação e eleição nem importar um sistema denominacional.
- issue: Relação sintática dos que estão com o Cordeiro
  choice: Manter a frase nominal “os que estão com ele são chamados, escolhidos e fiéis”
  alternative: Acrescentar que eles também vencerão
  rationale: O grego identifica os companheiros do Cordeiro por três qualificativos, mas não fornece explicitamente um segundo verbo de vitória; a tradução evita suprir essa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Guerrearão” preserva o tom apocalíptico sem arcaísmo excessivo; a conjunção “mas” explicita o contraste discursivo entre o ataque e a vitória, embora o grego use καί. O ponto e vírgula separa a afirmação sobre o Cordeiro da identificação dos que estão com ele, sem eliminar a ambiguidade sintática do final.
