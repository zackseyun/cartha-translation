id: REV.17.11
reference: Revelation 17:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: pt
  text: E a besta que era e não é é, ela própria, um oitavo[a] e vem dos sete[b], e vai para a destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela própria é um oitavo rei”. O substantivo “rei” é sugerido pelo contexto, mas não aparece no grego.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “é um dos sete”. Mais literalmente, o grego diz “dos sete”, expressão que pode indicar origem, pertença ou relação estreita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: besta
  rationale: Em Apocalipse, “besta” é o termo apocalíptico consagrado para o poder monstruoso que se opõe a Deus e preserva sua força simbólica e intertextual.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: que era e não é
  rationale: Mantém o paralelismo verbal incisivo do grego e o eco da fórmula recorrente no capítulo, sem explicar em excesso sua dimensão temporal.
- source_word: αὐτὸς
  choice: ela mesma
  rationale: Preserva a ênfase do pronome grego e concorda naturalmente, em português, com o substantivo feminino “besta”.
- source_word: ὄγδοός
  choice: uma oitava
  rationale: O adjetivo ordinal não traz substantivo expresso. A formulação conserva a concisão e deixa implícita a categoria indicada pelo contexto.
- source_word: ἐκ τῶν ἑπτά
  choice: procede das sete
  rationale: Expressa a ideia básica de origem ou derivação de ἐκ sem reduzi-la necessariamente à identificação mais específica “uma das sete”.
- source_word: εἰς ἀπώλειαν
  choice: para a destruição
  rationale: Comunica de modo claro e solene a ruína ou condenação escatológica indicada por ἀπώλεια, sem recorrer a linguagem arcaica.
- source_word: ὑπάγει
  choice: vai
  rationale: Reproduz de maneira direta e idiomática o presente vívido do verbo grego.
theological_decisions:
- issue: Se deve ser explicitado o substantivo implícito em ὄγδοός como “oitavo rei”
  choice: Manter “uma oitava” no texto principal, sem acrescentar “rainha” ou reformular como “oitavo rei”.
  alternative: “um oitavo rei”
  rationale: Embora o contexto imediato trate de reis, βασιλεύς não aparece neste versículo. A tradução principal preserva a construção elíptica e a ambiguidade simbólica, enquanto a nota apresenta a expansão contextual possível.
- issue: Se ἐκ τῶν ἑπτά deve ser interpretado especificamente como pertença
  choice: Traduzir como “procede das sete”.
  alternative: “é uma das sete”
  rationale: A preposição pode indicar origem, pertença ou relação estreita. “Procede das sete” preserva a noção de derivação sem resolver indevidamente a identificação simbólica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição simples “era e não é” conserva o caráter solene e enigmático do original. “Uma oitava” é deliberadamente incomum para reproduzir a elipse grega; a nota esclarece a leitura contextual sem inseri-la no texto.
