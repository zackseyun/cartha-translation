source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: pt
  text: 'Aqui está a mente que tem sabedoria: as sete cabeças são sete montes sobre os quais a mulher está sentada[a]; também são sete reis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete colinas”. A palavra grega pode referir-se a montes ou colinas; “montes” é a tradução mais direta.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν
  choice: Aqui é preciso ter uma mente que possua sabedoria
  rationale: Expressa naturalmente em português a introdução ao discernimento exigido, preservando νοῦς como “mente” e σοφία como “sabedoria”, sem substituir a expressão por uma interpretação específica.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: as sete cabeças
  rationale: Mantém sem explicação adicional o elemento simbólico do texto.
- source_word: ἑπτὰ ὄρη
  choice: sete montes
  rationale: “Montes” traduz diretamente ὄρη e, no português corrente, pode designar elevações de diferentes portes; a alternativa “colinas” é registrada em nota para não impor a identificação tradicional com Roma.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: sobre os quais a mulher está sentada
  rationale: Evita a redundância pouco natural de uma reprodução estrita de ὅπου ... ἐπ’ αὐτῶν, ao mesmo tempo que conserva claramente a relação espacial e o valor do presente.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: e são sete reis
  rationale: Preserva a construção elíptica e a identificação simbólica das cabeças também com sete reis, sem acrescentar um referente histórico.
theological_decisions:
- issue: Identificação simbólica das sete cabeças
  choice: Manter no texto as correspondências com sete montes e sete reis sem determinar seu referente histórico.
  alternative: Identificar explicitamente os montes com Roma e os reis com imperadores, governantes ou reinos específicos.
  rationale: O versículo apresenta as correspondências simbólicas, mas não resolve por si só qual esquema histórico deve ser adotado; a tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aqui é preciso” torna natural a fórmula introdutória, enquanto “mente que possua sabedoria” conserva a linguagem deliberadamente incomum do original. O ponto e vírgula antes de “e são sete reis” ajuda a mostrar a segunda identificação das sete cabeças.
