id: REV.17.16
reference: Revelation 17:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: pt
  text: E os dez chifres que você viu, e a besta — estes odiarão a prostituta, a deixarão desolada e nua[a], comerão a carne dela[b] e a queimarão completamente no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “despida”. O grego diz literalmente “nua”, com a ideia de exposição e humilhação pública.
    reason: lexical_alternative
  - marker: b
    text: “Carne” é literal aqui; nas imagens apocalípticas de Apocalipse, a expressão retrata destruição total e violenta.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: chifres
  rationale: Preserva o símbolo apocalíptico empregado no grego, sem substituí-lo por sua interpretação como reis ou poderes.
- source_word: θηρίον
  choice: besta
  rationale: É a forma consagrada e clara em português para a figura apocalíptica, mantendo sua força ameaçadora.
- source_word: πόρνην
  choice: prostituta
  rationale: Equivalente moderno, direto e não arcaico, sem acrescentar carga pejorativa além da exigida pelo termo grego.
- source_word: μισήσουσι
  choice: odiarão
  rationale: Traduz diretamente o futuro de μισέω e se ajusta à sequência violenta que vem a seguir.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: a deixarão desolada
  rationale: 'Expressa de modo natural em português a construção resultativa: eles farão com que ela fique desolada ou devastada.'
- source_word: γυμνήν
  choice: nua
  rationale: É o equivalente lexical direto, preservando a imagem de exposição e humilhação pública sem incorporá-la como explicação no texto principal.
- source_word: σάρκας
  choice: a carne dela
  rationale: Mantém a imagem concreta e violenta do plural grego, vertido idiomaticamente pelo coletivo singular em português.
- source_word: φάγονται
  choice: comerão
  rationale: Reproduz o sentido básico de ἐσθίω sem intensificá-lo interpretativamente como “devorarão”.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: a queimarão completamente no fogo
  rationale: “Completamente” comunica a força intensiva de κατακαίω, e “no fogo” verte naturalmente ἐν πυρί.
- source_word: οὗτοι
  choice: estes
  rationale: Conserva o pronome resumptivo enfático, retomando coletivamente os dez chifres e a besta antes dos verbos no plural.
theological_decisions:
- issue: Referente e concordância de “os dez chifres ... e a besta” com os verbos no plural
  choice: 'Manter o sujeito coletivo seguido pelo pronome resumptivo enfático: “os dez chifres ... e a besta — estes odiarão...”'
  alternative: Suavizar a construção para “os dez chifres que você viu e a besta odiarão...” ou entender a besta como aposto dos chifres.
  rationale: O grego reúne as figuras em um sujeito composto e as retoma com οὗτοι e verbos no plural. A formulação preserva essa estrutura incomum de maneira compreensível e apresenta os agentes como aliados na ação contra a prostituta.
- issue: Natureza das imagens da destruição da prostituta
  choice: Preservar sem suavização a metáfora apocalíptica de nudez, consumo da carne e destruição pelo fogo.
  alternative: Identificar diretamente a prostituta como uma cidade ou um sistema no texto principal.
  rationale: O versículo emprega linguagem simbólica e violenta de julgamento. A tradução não deve resolver a identidade do símbolo nem substituir as imagens por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a repetição estrutural e o pronome enfático do grego, mas a sequência verbal foi formulada com sintaxe natural em português. Os marcadores de nota foram posicionados junto às expressões que explicam.
