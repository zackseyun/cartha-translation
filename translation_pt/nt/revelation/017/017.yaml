id: REV.17.17
reference: Revelation 17:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: pt
  text: Pois Deus pôs no coração deles realizar o propósito dele, agir com um só propósito[a] e entregar o reino deles à besta, até que se cumpram as palavras de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ter um só pensamento” ou “ter um só propósito”. O grego diz literalmente algo próximo de “fazer um só propósito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que as palavras de Deus sejam completadas” ou “se realizem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: pôs no coração deles
  rationale: Reproduz de modo natural em português a expressão idiomática e sua metáfora de influência interior, sem reduzi-la a mera permissão.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: realizar o propósito dele
  rationale: γνώμη aqui indica propósito ou intenção deliberada; “realizar” comunica a execução desse propósito. O pronome “dele” evita a possível ambiguidade de “seu” em português.
- source_word: ποιῆσαι μίαν γνώμην
  choice: agir com um só propósito
  rationale: A expressão grega é condensada, literalmente próxima de “fazer um propósito”. A tradução comunica a intenção unificada dos reis e conserva a dimensão prática da ação.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: entregar o reino deles
  rationale: “Entregar” expressa naturalmente a transferência à besta, enquanto “o reino deles” preserva o singular grego com possuidor plural.
- source_word: τῷ θηρίῳ
  choice: à besta
  rationale: Mantém a imagem característica e a coerência terminológica de Apocalipse.
- source_word: ἄχρι τελεσθήσονται
  choice: até que se cumpram
  rationale: O futuro passivo de τελέω aponta para as palavras alcançarem seu cumprimento; esta formulação é natural no registro profético português.
- source_word: οἱ λόγοι τοῦ θεοῦ
  choice: as palavras de Deus
  rationale: Preserva a amplitude de λόγοι e o tom profético sem especificar indevidamente se são ditos, declarações ou mensagens.
theological_decisions:
- issue: Soberania divina e ação humana nas decisões dos reis
  choice: Afirmar que Deus pôs o propósito no coração deles e, ao mesmo tempo, descrever os reis como agentes que agem e entregam seu reino.
  alternative: Enfraquecer a ação divina para “permitiu”, ou ampliar o texto com uma formulação determinista mais forte.
  rationale: O grego apresenta tanto a iniciativa causativa de Deus quanto as ações reais dos governantes. A tradução conserva essa tensão sem resolvê-la em favor de um sistema teológico.
- issue: Referente de αὐτοῦ em “seu propósito”
  choice: 'Entender αὐτοῦ como referência a Deus: “o propósito dele”.'
  alternative: Entender o pronome como referência a outro agente no contexto.
  rationale: A estrutura da oração, cujo sujeito é Deus, favorece claramente a referência ao propósito divino; “dele” torna isso inteligível em português sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a metáfora do coração, o paralelismo dos infinitivos e o vocabulário profético de Apocalipse. Os marcadores [a] e [b] aparecem no texto principal.
