reference: Revelation 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: pt
  text: 'E na testa dela estava escrito um nome: Mistério[a], Babilônia, a Grande, a mãe das prostitutas e das abominações da terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava escrito um nome, um mistério: Babilônia, a Grande, a mãe das prostitutas e das abominações da terra”, entendendo “mistério” como introdução ao significado simbólico do nome, e não como parte da própria inscrição.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: na testa dela
  rationale: Expressa naturalmente em português a localização da inscrição, preservando a imagem do texto grego.
- source_word: ὄνομα γεγραμμένον
  choice: estava escrito um nome
  rationale: Mantém o sentido passivo e resultativo do particípio perfeito γεγραμμένον em uma construção natural em português.
- source_word: μυστήριον
  choice: Mistério
  rationale: É tratado no texto principal como parte do nome inscrito. A inicial maiúscula assinala essa função titular sem eliminar a alternativa sintática registrada na nota.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babilônia, a Grande
  rationale: Emprega a forma portuguesa tradicional do nome próprio e conserva ἡ μεγάλη como título apositivo, deixando clara a estrutura do grego.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Reproduz o artigo e a função apositiva da expressão.
- source_word: τῶν πορνῶν
  choice: das prostitutas
  rationale: Traduz diretamente πόρνη em linguagem atual, preservando a imagem sexual e moral sem recorrer a um termo arcaico ou excessivamente insultuoso.
- source_word: τῶν βδελυγμάτων
  choice: das abominações
  rationale: Preserva o forte registro bíblico de βδέλυγμα e suas associações com aquilo que é religiosa ou moralmente detestável.
- source_word: τῆς γῆς
  choice: da terra
  rationale: No horizonte universal e apocalíptico de Apocalipse, 'terra' é preferível a 'região' ou 'país' e conserva a construção genitiva.
theological_decisions:
- issue: Se μυστήριον faz parte da inscrição ou introduz o significado simbólico do nome
  choice: 'Incluí-lo na inscrição: “Mistério, Babilônia, a Grande...”'
  alternative: 'Entendê-lo como uma indicação narrativa: “estava escrito um nome, um mistério: Babilônia, a Grande...”'
  rationale: A pontuação não fazia parte do texto grego original, e a sequência permite ambas as leituras. O texto principal segue a leitura em que μυστήριον integra o nome, enquanto a nota preserva a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o caráter solene e apocalíptico do versículo; “Babilônia, a Grande” explicita a aposição grega, e “abominações” conserva a ressonância bíblica.
