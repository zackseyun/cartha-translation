  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: pt
  text: Cinco caíram[a], um existe, e o outro ainda não veio; quando vier, deve permanecer por pouco tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito no contexto: «Cinco reis caíram, um rei existe, e o outro rei ainda não veio».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Cinco
  rationale: O artigo remete aos sete reis do versículo anterior, mas o português dispensa sua repetição diante do numeral neste enunciado elíptico.
- source_word: ἔπεσαν
  choice: já caíram
  rationale: O perfeito português expressa a queda consumada com relevância presente; «já» torna natural a sequência temporal sem explicitar além do grego.
- source_word: ὁ εἷς ἔστιν
  choice: um existe
  rationale: Preserva a formulação concisa de ἔστιν e evita interpretar o verbo como «reina» ou «permanece».
- source_word: ὁ ἄλλος
  choice: o outro
  rationale: Marca o último membro da sequência em contraste com os cinco e com aquele que existe.
- source_word: οὔπω ἦλθεν
  choice: ainda não veio
  rationale: Forma idiomática em português para uma chegada esperada que até o presente não ocorreu.
- source_word: ὅταν ἔλθῃ
  choice: quando vier
  rationale: O futuro do subjuntivo traduz naturalmente a contingência futura indicada por ὅταν com o subjuntivo aoristo.
- source_word: ὀλίγον
  choice: por pouco tempo
  rationale: O neutro adverbial indica duração breve; a expressão é clara e direta em português.
- source_word: αὐτὸν δεῖ μεῖναι
  choice: deverá permanecer
  rationale: Comunica a necessidade expressa por δεῖ e a duração de μεῖναι, com referência masculina ao rei mencionado no contexto.
theological_decisions:
- issue: Especificidade interpretativa da imagem dos sete reis
  choice: Manter no texto principal a formulação elíptica, sem identificar os reis nem inserir um esquema histórico.
  alternative: Explicitar «Cinco reis já caíram, um rei existe, e o outro rei ainda não veio» ou identificar os referentes como imperadores específicos.
  rationale: O contexto imediato identifica os referentes como reis, mas o versículo é deliberadamente conciso. A tradução conserva essa tensão apocalíptica, enquanto a nota esclarece o referente contextual sem decidir identidades históricas debatidas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a concisão solene do texto apocalíptico e evita regionalismos e especificações interpretativas indevidas.
