id: REV.17.13
reference: Revelation 17:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: pt
  text: Eles têm um só propósito[a] e dão à besta o poder e a autoridade que possuem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm o mesmo pensamento”. A expressão grega diz literalmente que eles “têm uma só opinião” e pode indicar opinião, resolução ou propósito comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Eles
  rationale: O pronome retoma naturalmente os dez reis mencionados no contexto; em português, “eles” evita a rigidez de “estes” sem perder a referência.
- source_word: μίαν γνώμην ἔχουσιν
  choice: têm um só propósito
  rationale: A expressão indica unidade de pensamento, resolução ou propósito. “Têm um só propósito” é clara e natural no contexto de ação política conjunta, enquanto a nota preserva a forma mais literal.
- source_word: δύναμιν
  choice: poder
  rationale: Designa capacidade ou força efetiva e mantém o termo distinto de ἐξουσίαν.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa autoridade ou prerrogativa de governo, preservando a distinção em relação ao poder efetivo.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: o seu poder e a sua autoridade
  rationale: A repetição do possessivo soa natural e digna em português e deixa nítida a transferência de ambos os elementos.
- source_word: τῷ θηρίῳ
  choice: à besta
  rationale: “A besta” é a designação estabelecida da figura apocalíptica em Apocalipse; a contração traduz naturalmente artigo e dativo.
- source_word: διδόασιν
  choice: dão
  rationale: Mantém o presente do discurso visionário e traduz diretamente a ação de entregar ou conceder.
theological_decisions:
- issue: Sentido de μίαν γνώμην ἔχουσιν no contexto político-apocalíptico
  choice: têm um só propósito
  alternative: são de uma só opinião; têm o mesmo pensamento
  rationale: O contexto aponta para resolução e objetivo comuns, mas a nota registra a amplitude da expressão grega sem reduzir sua possível referência a pensamento, decisão ou propósito compartilhado.
- issue: Distinção entre δύναμις e ἐξουσία
  choice: poder e autoridade
  alternative: força e autoridade; poder e direito de governar
  rationale: 'A tradução conserva os dois conceitos relacionados, mas não idênticos: capacidade efetiva e autoridade de governo.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Um só propósito” comunica de modo natural a unidade dos reis, e a nota preserva o caráter idiomático e a amplitude semântica do grego.
