id: REV.17.7
reference: Revelation 17:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: pt
  text: 'E o anjo me disse: “Por que você ficou admirado? Eu lhe direi o mistério da mulher e da besta que a carrega[a] e que tem as sete cabeças e os dez chifres.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sustenta”.'
    reason: Alternativa lexical para βαστάζοντος, que pode indicar tanto carregar quanto sustentar.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: ficou tão admirado
  rationale: Expressa espanto ou assombro, e não mera curiosidade. O uso de “tão” torna natural em português a pergunta sobre a intensidade da reação, sem alterar o sentido.
- source_word: μυστήριον
  choice: mistério
  rationale: Preserva o sentido apocalíptico de uma realidade antes oculta que agora será revelada, em vez de sugerir apenas um enigma.
- source_word: γυναικός
  choice: mulher
  rationale: O contexto apresenta uma figura feminina simbólica, sem indicar aqui uma relação conjugal.
- source_word: θηρίου
  choice: besta
  rationale: Mantém o termo apocalíptico recorrente em Apocalipse e suas conotações monstruosas e hostis.
- source_word: βαστάζοντος
  choice: carrega
  rationale: É uma tradução clara e natural para a imagem da besta levando a mulher; a alternativa “sustenta” permanece possível.
- source_word: ἔχοντος
  choice: que tem
  rationale: A oração relativa é natural em português e deixa claro que a descrição se refere à besta.
- source_word: κεφαλάς
  choice: cabeças
  rationale: Preserva literalmente a imagem central da visão.
- source_word: κέρατα
  choice: chifres
  rationale: Mantém a imagem simbólica característica da literatura apocalíptica.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo direto e idiomático em português.
- source_word: ἐρῶ σοι
  choice: Eu lhe direi
  rationale: Expressa naturalmente a promessa do anjo de revelar ou explicar o significado da visão.
theological_decisions:
- issue: Referente da descrição “que tem as sete cabeças e os dez chifres”
  choice: Vincular a descrição à besta
  alternative: Deixar a relação sintática menos explícita, como se pudesse descrever a mulher ou o mistério em conjunto
  rationale: Os particípios gregos τοῦ βαστάζοντος e τοῦ ἔχοντος concordam com θηρίου, não com γυναικός. A tradução reflete essa clareza gramatical sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “que a carrega e que tem” preserva a ligação das duas descrições com a besta e evita ambiguidade artificial.
