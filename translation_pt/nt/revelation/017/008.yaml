id: REV.17.8
reference: Revelation 17:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: pt
  text: A besta que você viu era e não existe; está prestes a subir do abismo e segue para a destruição. Os habitantes da terra, cujo nome não foi escrito no livro da vida desde a fundação do mundo, ficarão maravilhados quando virem a besta, porque ela era, não existe e estará presente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto à construção final: “... ficarão maravilhados ao verem a besta, que era, não existe e estará presente”. O grego pode apresentar a cláusula final como a causa do espanto (“porque”) ou como seu conteúdo (“que”); “estará presente” traduz mais literalmente o futuro do verbo grego que significa “estar presente”.'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: besta
  rationale: Termo apocalíptico consagrado e claro, que preserva a força monstruosa e simbólica do grego melhor do que o genérico “animal”.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: existia e não existe
  rationale: Mantém o contraste temporal abrupto. “Existia” soa mais natural em português do que “era” quando se fala da existência da besta.
- source_word: μέλλει ἀναβαίνειν
  choice: está prestes a subir
  rationale: Expressa a iminência de μέλλει e conserva o movimento ascendente de ἀναβαίνειν.
- source_word: ἄβυσσος
  choice: abismo
  rationale: Equivalente direto e tradicional no contexto apocalíptico, sem acrescentar a interpretação de um poço literalmente sem fundo.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: segue para a destruição
  rationale: Preserva o presente de ὑπάγει e o movimento rumo à ruína final, com linguagem portuguesa natural e digna.
- source_word: θαυμασθήσονται
  choice: ficarão maravilhados
  rationale: Comunica espanto intenso sem sugerir necessariamente aprovação, como poderia ocorrer com “admirarão”.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: os habitantes da terra
  rationale: Forma natural que mantém a expressão recorrente de Apocalipse como designação coletiva.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: cujo nome não foi escrito
  rationale: Conserva o singular coletivo τὸ ὄνομα e representa o perfeito grego como uma ação concluída com relevância presente.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: no livro da vida
  rationale: Em português, nomes são escritos “no” livro; a formulação idiomática comunica corretamente o sentido de ἐπί neste contexto.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: Mantém a referência temporal e sua ligação sintática imediata com o registro do nome no livro da vida.
- source_word: βλεπόντων
  choice: quando virem
  rationale: Explicita de modo natural o valor temporal do particípio genitivo.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: porque ela existia, não existe e estará presente
  rationale: Toma ὅτι em sentido causal, adequado ao motivo do espanto, e traduz παρέσται segundo seu sentido básico de presença futura, sem impor a ideia mais específica de ressurreição.
theological_decisions:
- issue: Alcance temporal de “desde a fundação do mundo”
  choice: A expressão modifica “não foi escrito no livro da vida”.
  alternative: Entender a expressão à luz de construções diferentes em outras passagens ou inserir uma explicação doutrinária sobre eleição.
  rationale: A ordem e a sintaxe deste versículo ligam diretamente a expressão temporal ao registro do nome. A tradução preserva essa ligação sem desenvolver um sistema teológico além do que o texto afirma.
- issue: Sentido de παρέσται
  choice: estará presente
  alternative: virá; aparecerá
  rationale: O futuro de πάρειμι denota presença ou chegada. “Estará presente” conserva o contraste com “não existe” e evita tornar explícita uma ideia de retorno ou ressurreição que a palavra, isoladamente, não exige.
- issue: Valor de ὅτι na cláusula final
  choice: porque
  alternative: que
  rationale: A leitura causal explica por que os habitantes da terra ficam maravilhados, mas a nota preserva a possibilidade de a cláusula indicar o conteúdo do espanto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a solenidade apocalíptica sem arcaísmos desnecessários. Emprega “você” no singular por corresponder ao referente singular do grego, e mantém “cujo nome” no singular coletivo conforme o texto-fonte.
