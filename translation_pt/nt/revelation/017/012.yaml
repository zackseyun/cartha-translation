id: REV.17.12
reference: Revelation 17:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: pt
  text: E os dez chifres que você viu são dez reis, que ainda não receberam um reino, mas recebem autoridade como reis durante uma hora[a], juntamente com a besta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “por breve tempo”. Na linguagem apocalíptica, a expressão “uma hora” provavelmente representa um período curto e limitado.
    reason: Registra o provável sentido figurado da expressão temporal sem substituí-la no texto principal.
lexical_decisions:
- source_word: κέρατα
  choice: chifres
  rationale: Mantém literalmente a imagem apocalíptica; o próprio versículo identifica simbolicamente os chifres como reis.
- source_word: βασιλεῖς
  choice: reis
  rationale: É o sentido lexical direto e preserva a tensão entre a designação explícita e seu contexto simbólico.
- source_word: βασιλείαν
  choice: um reino
  rationale: Expressa de modo natural o reino ou domínio que eles ainda não receberam e mantém a distinção em relação a ἐξουσίαν.
- source_word: οὔπω ἔλαβον
  choice: ainda não receberam
  rationale: Comunica com clareza a negação temporal e a relevância presente do aoristo no contexto da visão.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Indica poder ou direito de governar e evita confundi-lo com o reino mencionado anteriormente.
- source_word: ὡς βασιλεῖς
  choice: como reis
  rationale: Reproduz diretamente a maneira ou condição em que recebem autoridade, sem decidir se são monarcas literais ou governantes simbólicos.
- source_word: μίαν ὥραν
  choice: durante uma hora
  rationale: Preserva a expressão temporal concreta do grego, deixando para a nota a provável ideia figurada de um período breve e limitado.
- source_word: λαμβάνουσιν
  choice: recebem
  rationale: Mantém o presente grego e o estilo vívido da narrativa apocalíptica, sem convertê-lo explicitamente em futuro.
- source_word: μετὰ τοῦ θηρίου
  choice: juntamente com a besta
  rationale: Expressa com naturalidade a associação com a besta e evita uma leitura meramente espacial.
- source_word: θηρίου
  choice: a besta
  rationale: É a forma consagrada e exata para a figura recorrente de θηρίον em Apocalipse.
theological_decisions:
- issue: Se os dez reis devem ser apresentados como monarcas literais ou como governantes ou poderes simbólicos
  choice: Manter “dez reis” no texto principal.
  alternative: “dez governantes” ou “dez poderes”.
  rationale: O grego os chama explicitamente de reis, enquanto o gênero apocalíptico permite valor simbólico. A tradução conserva essa tensão sem impor uma identificação histórica ou política.
- issue: Se μίαν ὥραν deve ser interpretado no texto principal como uma hora literal ou como um breve período figurado
  choice: Traduzir “durante uma hora” no texto principal.
  alternative: “por breve tempo” ou “por pouco tempo”.
  rationale: A formulação literal preserva a imagem temporal do original; a nota registra sua provável função figurada sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna a fala dirigida ao vidente natural para leitores atuais; “juntamente com” explicita associação sem acrescentar interpretação doutrinária. O marcador [a] foi colocado junto à expressão que a nota explica.
