id: REV.12.12
reference: Revelation 12:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: pt
  text: Por isso, alegrem-se, ó céus, e vocês que neles habitam! Ai da terra[a] e do mar, pois o diabo desceu até vocês com grande furor[b], sabendo que tem pouco tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da terra firme”. O termo grego γῆ pode designar tanto a terra em sentido amplo quanto uma região terrestre; aqui, o contraste cósmico com os céus favorece “terra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com grande ira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão decorrente da vitória celestial narrada anteriormente.
- source_word: εὐφραίνεσθε
  choice: alegrem-se
  rationale: Mantém a força imperativa e soa natural no português atual, sem perder o tom elevado.
- source_word: οἱ οὐρανοὶ
  choice: ó céus
  rationale: O nominativo funciona como vocativo; “ó céus” torna explícita a interpelação direta e preserva o registro solene.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: vocês que neles habitam
  rationale: Comunica o sentido contextual de residir nos céus. Uma tradução como “armam sua tenda” seria excessivamente literal e pouco clara aqui.
- source_word: οὐαὶ
  choice: Ai de
  rationale: É a fórmula portuguesa corrente de lamento e advertência profética.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: da terra e do mar
  rationale: No contraste cósmico com os céus e na associação com o mar, “terra” representa melhor o alcance amplo de γῆ, embora “solo” ou “região terrestre” também sejam possíveis conforme o contexto.
- source_word: κατέβη
  choice: desceu
  rationale: Reproduz diretamente o movimento do céu para o âmbito terrestre; o pretérito perfeito português expressa com naturalidade a ação concluída.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: É o título tradicional e imediatamente compreensível para o personagem identificado no contexto, sem substituir o título por sua etimologia, “caluniador”.
- source_word: πρὸς ὑμᾶς
  choice: até vocês
  rationale: Preserva a ideia básica de movimento em direção aos destinatários. A hostilidade fica clara pelo contexto e pelo “grande furor”, sem ser acrescentada à preposição.
- source_word: ἔχων θυμὸν μέγαν
  choice: com grande furor
  rationale: “Furor” transmite a intensidade de θυμός de maneira vívida, digna e corrente.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Conserva a construção participial e sua relação explicativa com a ação anterior.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: tem pouco tempo
  rationale: Segue de perto a expressão grega e mantém a ideia de um período restante limitado, sem explicitar além do texto.
theological_decisions:
- issue: Referente de “vocês” em “o diabo desceu até vocês”
  choice: Mantém-se o pronome plural ligado gramaticalmente à terra e ao mar recém-mencionados, sem inserir “habitantes”.
  alternative: Explicitar “até os habitantes da terra e do mar” ou entender que o pronome ainda se dirige aos céus e a seus habitantes.
  rationale: A sequência mais natural faz o pronome retomar, por personificação ou metonímia, a terra e o mar, em contraste com os céus. A tradução preserva a forma retórica e não resolve explicitamente quem está incluído nesses domínios.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O vocativo “ó céus” preserva o tom poético de Apocalipse; “vocês” evita uma forma excessivamente regional ou arcaizante. A pontuação destaca o contraste dramático entre a alegria celestial e o ai dirigido à terra e ao mar.
