id: REV.12.9
reference: Revelation 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: pt
  text: E o grande dragão foi lançado para baixo — a antiga serpente[a], aquele que é chamado Diabo e Satanás, que engana o mundo inteiro[b]. Ele foi lançado à terra, e seus anjos foram lançados com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “antiga serpente” retoma a imagem da serpente de Gênesis 3.
    reason: cross_reference
  - marker: b
    text: 'Ou: “toda a terra habitada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: foi lançado para baixo / foram lançados
  rationale: O passivo de βάλλω expressa expulsão forçada. A primeira ocorrência explicita o movimento descendente; as seguintes preservam a repetição enfática do verbo com formulação natural em português.
- source_word: δράκων ὁ μέγας
  choice: o grande dragão
  rationale: Mantém de modo direto a imagem apocalíptica e a força simbólica de δράκων.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: a antiga serpente
  rationale: “Serpente” conserva a dicção bíblica e a alusão a Gênesis 3; “antiga” traduz ἀρχαῖος sem impor a interpretação mais específica “primordial”.
- source_word: ὁ καλούμενος
  choice: aquele que é chamado
  rationale: A construção introduz os nomes ou títulos pelos quais o dragão é identificado e soa clara na sequência de apostos.
- source_word: Διάβολος
  choice: Diabo
  rationale: Neste contexto funciona como nome ou título reconhecido, não meramente como o substantivo comum “caluniador”.
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Emprega a transliteração portuguesa tradicional do nome ou título sem acrescentar interpretação.
- source_word: ὁ πλανῶν
  choice: que engana
  rationale: πλανάω pode significar enganar, desviar ou desencaminhar. “Engana” é conciso e natural, mantendo a ideia de levar ao erro.
- source_word: τὴν οἰκουμένην ὅλην
  choice: o mundo inteiro
  rationale: Comunica naturalmente o alcance universal da expressão; a nuance literal de “mundo habitado” é preservada em nota.
- source_word: εἰς τὴν γῆν
  choice: à terra
  rationale: O contexto contrasta a esfera celestial com a terrestre; portanto, γῆ significa aqui “terra”, e não uma região ou território.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: seus anjos
  rationale: No cenário apocalíptico, ἄγγελοι designa seres celestiais associados ao dragão, não mensageiros humanos.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Traduz diretamente a ideia de acompanhamento, com formulação idiomática em português.
theological_decisions:
- issue: Identificação do dragão por Διάβολος e Σατανᾶς
  choice: aquele que é chamado Diabo e Satanás
  alternative: aquele que é chamado o Caluniador e o Adversário
  rationale: A sequência grega apresenta esses termos como nomes ou títulos identificadores. As formas convencionais em português preservam essa identificação sem inserir explicações doutrinárias.
- issue: Alcance de οἰκουμένη
  choice: o mundo inteiro
  alternative: toda a terra habitada
  rationale: A opção principal expressa com naturalidade o alcance global da afirmação no contexto apocalíptico, enquanto a nota conserva a nuance lexical mais estrita.
- issue: Força descendente de ἐβλήθη
  choice: foi lançado para baixo na primeira ocorrência
  alternative: foi expulso
  rationale: A tradução explicita o movimento da expulsão sem substituir a imagem concreta de ser lançado nem diluir a repetição verbal do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem em aposição e a repetição de “foi lançado” preservam a ênfase do grego; “para baixo” explicita na primeira ocorrência o movimento implícito no contexto. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
