id: REV.12.13
reference: Revelation 12:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: pt
  text: E, quando o dragão viu que havia sido lançado à terra, perseguiu[a] a mulher que tinha dado à luz o menino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego pode indicar tanto ir no encalço de alguém como persegui-lo de modo hostil; neste contexto, os dois sentidos provavelmente estão presentes.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «o macho». O contexto indica uma criança do sexo masculino; por isso, traduz-se «o menino».
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: dragão
  rationale: Preserva a imagem apocalíptica específica do substantivo grego, sem harmonizá-la com «serpente».
- source_word: ἐβλήθη
  choice: havia sido lançado
  rationale: Expressa o aoristo passivo como expulsão forçada e deixa clara, em português natural, a anterioridade em relação ao momento em que o dragão percebe isso.
- source_word: εἰς τὴν γῆν
  choice: à terra
  rationale: No cenário cósmico de Apocalipse, γῆ designa naturalmente a terra em contraste com o céu.
- source_word: ἐδίωξεν
  choice: perseguiu
  rationale: «Perseguir» preserva em português tanto a ideia concreta de ir no encalço quanto a de hostilizar, mantendo a amplitude semântica de διώκω.
- source_word: τὴν γυναῖκα
  choice: a mulher
  rationale: Tradução direta que mantém a figura simbólica sem identificar interpretativamente quem ela representa.
- source_word: ἥτις ἔτεκεν
  choice: que tinha dado à luz
  rationale: Formulação natural que comunica o parto e sua anterioridade em relação à perseguição.
- source_word: τὸν ἄρσενα
  choice: o menino
  rationale: O grego diz literalmente «o macho», com uso substantivado e referência contextual ao filho varão de 12:5. «O menino» é natural em português; a nota preserva a forma marcada do original.
theological_decisions:
- issue: Identidade simbólica da mulher e do menino
  choice: Manter as imagens «a mulher» e «o menino» sem explicação interpretativa no texto.
  alternative: Identificar a mulher como Maria, Israel ou o povo de Deus/a igreja, e o menino explicitamente como uma figura teológica determinada.
  rationale: O texto apresenta simbolismo apocalíptico cuja identificação admite interpretações distintas. A tradução não deve resolver além do que o grego afirma.
- issue: Amplitude de διώκω
  choice: Usar «perseguiu», permitindo simultaneamente os sentidos de ir no encalço e hostilizar.
  alternative: Restringir a tradução a «foi atrás de» ou «oprimiu».
  rationale: A narrativa sugere perseguição concreta e hostil; «perseguiu» conserva naturalmente essa tensão em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e as imagens apocalípticas foram mantidas, evitando linguagem arcaica e expansões denominacionais.
