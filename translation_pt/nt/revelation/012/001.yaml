id: REV.12.1
reference: Revelation 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: pt
  text: 'E apareceu no céu um grande sinal: uma mulher vestida do sol, com a lua debaixo dos pés e, sobre a cabeça, uma coroa[a] de doze estrelas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinalda” ou “coroa de vencedor”. A palavra grega é στέφανος, distinta de um diadema real.
    reason: Alternativa lexical que esclarece a espécie de coroa indicada pelo termo grego.
lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: Em Apocalipse, o termo frequentemente designa um sinal simbólico contemplado em visão; “sinal” preserva esse sentido sem interpretar a figura.
- source_word: μέγα
  choice: grande
  rationale: “Grande” expressa naturalmente tanto a magnitude quanto a relevância do sinal no estilo apocalíptico.
- source_word: ὤφθη
  choice: apareceu
  rationale: Embora a forma grega seja passiva (“foi visto”), “apareceu” é natural em português para o relato de uma manifestação visionária.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: No cenário visionário de Apocalipse, “céu” é mais adequado que “firmamento” ou “céus” e mantém a amplitude semântica do original.
- source_word: γυνή
  choice: mulher
  rationale: O texto apresenta uma figura feminina simbólica sem identificá-la especificamente como esposa.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: vestida do sol
  rationale: A expressão reproduz de modo claro e digno a imagem de estar revestida ou envolta pelo sol.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: com a lua debaixo dos pés
  rationale: A formulação preserva a relação espacial da imagem e soa natural em português; o possessivo é dispensável porque a referência é inequívoca.
- source_word: στέφανος
  choice: coroa
  rationale: “Coroa” é o termo mais claro no texto principal; uma nota preserva a nuance de grinalda ou coroa concedida ao vencedor, distinta do diadema real.
- source_word: ἀστέρων δώδεκα
  choice: de doze estrelas
  rationale: A construção conserva de forma concisa a relação genitiva sem acrescentar detalhes interpretativos.
theological_decisions:
- issue: Identidade simbólica da mulher
  choice: Não identificar a mulher, mas descrevê-la apenas como parte do sinal visionário.
  alternative: Identificá-la como Israel, Maria, o povo de Deus ou a igreja.
  rationale: O versículo não identifica explicitamente a mulher. A tradução mantém a ambiguidade e evita introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A ordem foi levemente ajustada para fluidez, mantendo a sequência e o caráter solene das imagens. O marcador da nota foi colocado após “coroa”, o termo a que a nota lexical se refere.
