  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: pt
  text: E ele se pôs de pé sobre a areia do mar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “E eu me pus de pé sobre a areia do mar.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples que liga a frase à narrativa anterior.
- source_word: ἐστάθη
  choice: ele se pôs de pé
  rationale: A forma aorista passiva de ἵστημι tem aqui sentido intransitivo. O pronome explicita em português o sujeito masculino singular, que no contexto se refere naturalmente ao dragão; “se pôs de pé” também pode sugerir que ele tomou posição.
- source_word: ἐπὶ
  choice: sobre
  rationale: Com o acusativo neste contexto, indica a posição alcançada; “sobre” combina naturalmente com a ação de se pôr de pé.
- source_word: τὴν ἄμμον
  choice: a areia
  rationale: Mantém o sentido concreto de ἄμμος, sem generalizá-lo como “praia” ou “costa”.
- source_word: τῆς θαλάσσης
  choice: do mar
  rationale: Preserva a construção genitiva e a imagem específica da areia associada ao mar.
theological_decisions:
- issue: Identificação do sujeito e variante textual do verbo
  choice: 'O texto principal segue ἐστάθη, na terceira pessoa: “ele se pôs de pé”, com referência contextual mais natural ao dragão.'
  alternative: 'Alguns manuscritos trazem ἐστάθην, na primeira pessoa: “eu me pus de pé”.'
  rationale: A edição SBLGNT imprime a terceira pessoa. A variante de primeira pessoa é relevante para a identificação do sujeito e, por isso, é preservada em nota, sem substituir a leitura do texto-base.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A formulação preserva a imagem concreta do grego e explicita apenas o sujeito exigido pela naturalidade do português.
