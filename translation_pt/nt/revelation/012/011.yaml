id: REV.12.11
reference: Revelation 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: pt
  text: Eles o venceram[a] por causa do sangue do Cordeiro e por causa da palavra do seu testemunho; e não amaram a própria vida[b] até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “derrotaram”.
    reason: lexical_alternative
  - marker: b
    text: Ou “alma”; o termo grego pode significar “vida”, “ser” ou “alma”. Aqui se refere à vida que eles não procuraram preservar, mesmo ao custo da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: venceram
  rationale: O aoristo ativo indica que eles obtiveram vitória sobre o acusador. “Venceram” preserva a imagem de conflito recorrente em Apocalipse e soa natural em português.
- source_word: διὰ τὸ αἷμα
  choice: por causa do sangue
  rationale: διά com acusativo expressa aqui fundamento ou causa. A formulação atribui a vitória ao sangue sacrificial do Cordeiro sem acrescentar uma explicação doutrinária ausente do versículo.
- source_word: ἀρνίου
  choice: Cordeiro
  rationale: Em Apocalipse, ἀρνίον funciona como título cristológico. A inicial maiúscula deixa clara a referência a Jesus e preserva a imagem sacrificial e apocalíptica.
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: a palavra do testemunho que deram
  rationale: A tradução conserva tanto λόγος (“palavra”, no sentido de mensagem proclamada) quanto μαρτυρία (“testemunho”). A oração “que deram” esclarece de modo natural que o testemunho era deles, sem alterar seu conteúdo.
- source_word: οὐκ ἠγάπησαν
  choice: não amaram
  rationale: Mantém a correspondência transparente com ἀγαπάω e evita substituir o verbo por uma interpretação como “não se apegaram”.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: a própria vida
  rationale: No contexto de martírio e morte, ψυχή se refere à vida terrena. “A própria vida” reproduz naturalmente o singular distributivo grego.
- source_word: ἄχρι θανάτου
  choice: mesmo diante da morte
  rationale: Expressa em português corrente a disposição de não preservar a vida quando confrontados com a morte. Evita o pouco natural “até a morte” depois de “não amaram a própria vida”.
theological_decisions:
- issue: Como a vitória se relaciona com o sangue do Cordeiro
  choice: A vitória ocorreu “por causa do sangue do Cordeiro”, preservando o valor causal de διά com acusativo.
  alternative: “Por meio do sangue do Cordeiro”, entendendo a expressão de maneira instrumental.
  rationale: A construção grega favorece causa ou fundamento. A tradução não desenvolve uma teoria da expiação, mas mantém a afirmação do texto de que a vitória dos fiéis se fundamenta no sangue do Cordeiro.
- issue: Sentido de ψυχή no contexto do martírio
  choice: “Vida”, referindo-se à vida terrena que eles aceitaram perder.
  alternative: “Alma”.
  rationale: A proximidade de θάνατος indica que está em vista a entrega da vida. “Alma” poderia sugerir uma distinção metafísica entre corpo e alma que o versículo não exige.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Palavra do testemunho que deram” mantém a densidade do original sem soar excessivamente literal; “mesmo diante da morte” comunica de forma idiomática o limite extremo expresso por ἄχρι θανάτου.
