    issue: «a palavra do testemunho que deram» explicita desnecessariamente a relação possessiva.
    rationale: O grego diz literalmente «a palavra do testemunho deles». A oração «que deram» não chega a alterar o sentido, mas é uma expansão interpretativa dispensável e menos próxima da construção original.
