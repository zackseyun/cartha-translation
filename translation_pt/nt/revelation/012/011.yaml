  source_fidelity: A tradução transmite adequadamente a vitória sobre o acusador, o sangue do Cordeiro, o testemunho dos fiéis e sua disposição diante da morte. Contudo, «mesmo diante da morte» atenua o limite expresso por ἄχρι θανάτου («até a morte / até morrer»), que indica fidelidade mesmo ao custo da própria morte. A formulação revista preserva esse limite de modo mais direto.
  naturalness: «Eles o venceram» e «por causa do sangue do Cordeiro» são claros e naturais. «A palavra do testemunho que deram» é compreensível, mas introduz uma oração explicativa desnecessária; «a palavra do seu testemunho» mantém melhor a estrutura e o tom solene do texto. «Não amaram a própria vida até a morte» é uma formulação bíblica corrente e inteligível.
  terminology: «Cordeiro», «venceram», «testemunho» e «vida» são escolhas apropriadas. «Vida» para ψυχή evita impor uma leitura antropológica de «alma» e corresponde ao contexto de morte. «Por causa de» preserva legitimamente a força causal/fundamental de διά com acusativo, sem excluir que o contexto apresente o sangue e o testemunho como bases da vitória.
