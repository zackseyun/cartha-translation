review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a gravidez, as dores de parto, a intensidade do sofrimento e o parto iminente. Contudo, o presente grego κράζει é melhor mantido pelo presente vívido português «grita», em vez do imperfeito «gritava».
  naturalness: «Ela estava grávida e grita...» é compreensível no registro visionário, mas «Ela estava grávida e gritava» é mais linear em português narrativo. A opção pelo presente, porém, reproduz de modo mais próximo a vivacidade do original. A colocação da nota de «atormentada» deve acompanhar essa palavra, não «dar à luz».
  terminology: «Grávida», «dores de parto», «atormentada» e «dar à luz» são modernos, claros e preservam a força sem interpretar a figura da mulher. Para a alternativa de βασανιζομένη, «em agonia» é mais diretamente equivalente do que «atormentada com o parto».
  issues:
  - severity: low
    issue: Tempo verbal de κράζει
    rationale: O grego usa o presente indicativo («grita»), com efeito vívido na cena visionária. «Gritava» é possível como ajuste narrativo, mas reduz esse efeito e não corresponde ao tempo verbal escolhido no texto de partida.
  - severity: low
    issue: Âncora da nota c
    rationale: A nota c oferece alternativa para «sendo atormentada» (βασανιζομένη), mas está ancorada em «dar à luz» (τεκεῖν). A âncora deve ser deslocada para «atormentada».
  - severity: low
    issue: Redação da nota c
    rationale: «Atormentada com o parto» é uma paráfrase menos direta e pode tornar a relação sintática menos precisa. «Em agonia» oferece uma alternativa lexical natural para o sofrimento intenso.
  revised_text: Ela estava grávida[a] e grita, sofrendo dores de parto[b] e sendo atormentada[c] para dar à luz.
