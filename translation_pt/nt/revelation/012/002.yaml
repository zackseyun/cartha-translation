  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: pt
  text: Ela estava grávida[a] e grita, sofrendo dores de parto[b] e sendo atormentada[c] para dar à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um filho no ventre”; literalmente, “tendo no ventre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em trabalho de parto”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em agonia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: estava grávida
  rationale: A expressão significa literalmente “tendo no ventre” e é uma forma idiomática de indicar gravidez. “Estava grávida” é natural, atual e fiel ao sentido.
- source_word: κράζει
  choice: gritava
  rationale: O imperfeito em português apresenta vividamente o grito em curso dentro da cena visionária e se harmoniza com “estava” sem reduzir sua intensidade.
- source_word: ὠδίνουσα
  choice: sofrendo dores de parto
  rationale: O particípio descreve a experiência dolorosa do trabalho de parto. A formulação mantém explícita tanto a dor quanto sua natureza.
- source_word: βασανιζομένη
  choice: sendo atormentada
  rationale: O particípio passivo comunica sofrimento intenso. “Sendo atormentada” preserva a força da expressão grega sem explicar a identidade simbólica da mulher.
- source_word: τεκεῖν
  choice: para dar à luz
  rationale: A construção expressa o parto em vista, e “dar à luz” é a formulação portuguesa corrente e precisa.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A repetição das conjunções conserva o caráter cumulativo e vívido da descrição grega.
theological_decisions:
- issue: Intensidade e natureza do sofrimento da mulher na visão
  choice: Traduzir βασανιζομένη de modo forte como “sendo atormentada”, sem interpretar a identidade da mulher.
  alternative: Empregar uma formulação mais suave, como “em agonia” ou “aflita”.
  rationale: O versículo retrata intensamente o sofrimento da mulher, mas não identifica aqui seu significado simbólico. A tradução preserva a força do grego e evita impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a sequência cumulativa do grego sem soar artificial; o imperfeito descreve naturalmente a ação em curso na visão.
