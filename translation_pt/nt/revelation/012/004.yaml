review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a alternância inicial entre o presente σύρει («arrasta») e o aoristo ἔβαλεν («lançou»), bem como a imagem e a fração. Contudo, «a mulher que estava para dar à luz» desloca sem apoio o particípio presente μελλούσης para o passado. A construção final também fica temporalmente desalinhada: τέκῃ e καταφάγῃ são subjuntivos na cláusula de propósito/contingência, adequadamente expressos em português por «quando ela der à luz, devore».'
  naturalness: «Está de pé diante» é compreensível e mantém a posição deliberada do dragão. «Para que, quando ela der à luz, devore...» é natural em registro bíblico atual e torna explícita a relação sintática do grego sem acrescentar interpretação.
  terminology: «Dragão», «mulher», «dar à luz», «filho» e «estrelas do céu» são escolhas adequadas. «A terça parte» é correto, embora «um terço» também fosse possível; não há necessidade de alterá-lo.
  issues:
  - severity: medium
    issue: Tempo de «estava para dar à luz»
    rationale: μελλούσης é particípio presente e qualifica a mulher diante da qual o dragão «está de pé»; o imperfeito português introduz uma anterioridade que o grego não expressa.
  - severity: medium
    issue: Modo e referência temporal da oração final
    rationale: «quando ela o desse à luz» usa imperfeito do subjuntivo e torna «o» potencialmente ambíguo. O grego traz τέκῃ e καταφάγῃ em formulação de propósito voltada ao evento de dar à luz; «quando ela der à luz, devore o filho dela» conserva melhor a relação.
  revised_text: A cauda dele arrasta a terça parte das estrelas do céu e as lançou sobre a terra.[a] O dragão está de pé diante da mulher que está para dar à luz, para que, quando ela der à luz, devore o filho dela.
  revised_footnotes:
