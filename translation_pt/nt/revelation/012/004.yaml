revisions:
- from: A cauda dele arrasta a terça parte das estrelas do céu e as lançou sobre a terra.[a] O dragão está de pé diante da mulher que estava para dar à luz, a fim de devorar o filho dela quando ela o desse à luz.
  to: A cauda dele arrasta a terça parte das estrelas do céu e as lançou sobre a terra.[a] O dragão está de pé diante da mulher que está para dar à luz, para que, quando ela der à luz, devore o filho dela.
  rationale: A revisão limita-se a corrigir o deslocamento indevido para o passado na descrição da mulher e a reproduzir com maior precisão a construção final de propósito e contingência. Mantêm-se a alternância verbal visionária, a ambiguidade simbólica das estrelas e a nota sobre a mudança de tempo.
