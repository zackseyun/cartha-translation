    reason: A nota esclarece uma mudança verbal marcante e potencialmente estranha em português sem a corrigir silenciosamente.
  revision_rationale: A revisão limita-se a corrigir o deslocamento indevido para o passado na descrição da mulher e a reproduzir com maior precisão a construção final de propósito e contingência. Mantêm-se a alternância verbal visionária, a ambiguidade simbólica das estrelas e a nota sobre a mudança de tempo.
