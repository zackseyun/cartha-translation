source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: pt
  text: A cauda dele arrasta a terça parte das estrelas do céu e as lançou sobre a terra.[a] O dragão está de pé diante da mulher que está para dar à luz, para que, quando ela der à luz, devore o filho dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego muda aqui do presente («arrasta») para o passado («lançou»).
    reason: A nota esclarece uma mudança verbal marcante e potencialmente estranha em português sem a corrigir silenciosamente.
lexical_decisions:
- source_word: σύρει
  choice: arrasta
  rationale: Preserva o presente do verbo grego e a imagem vigorosa da cauda que arrasta as estrelas.
- source_word: τὸ τρίτον
  choice: a terça parte
  rationale: Expressa com clareza a fração indicada pelo grego.
- source_word: ἔβαλεν
  choice: lançou
  rationale: Mantém o aoristo grego, inclusive sua mudança de tempo em relação ao presente anterior.
- source_word: ἕστηκεν
  choice: está de pé
  rationale: 'Representa o perfeito grego como um estado presente resultante: o dragão tomou posição e permanece diante da mulher.'
- source_word: καταφάγῃ
  choice: devorar
  rationale: Conserva a força do verbo, que indica consumir por completo.
theological_decisions:
- issue: Identidade simbólica das estrelas
  choice: Manter apenas «estrelas», sem identificar seus referentes
  alternative: Explicá-las como anjos ou outro grupo específico
  rationale: O versículo não explicita aqui a identidade simbólica das estrelas; identificá-las resolveria indevidamente uma ambiguidade do texto.
- issue: Mudanças de tempo verbal na visão
  choice: Preservar «arrasta», «lançou» e «está de pé»
  alternative: Uniformizar toda a narração no passado ou no presente
  rationale: A sequência grega alterna presente, aoristo e perfeito; preservar essa tensão evita apagar a forma visionária da narrativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas as imagens e as mudanças de tempo verbal do grego foram preservadas.
