id: REV.12.6
reference: Revelation 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: pt
  text: E a mulher fugiu para o deserto, onde tem um lugar preparado por Deus, para que ali a alimentem[a] durante mil duzentos e sessenta dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que ela seja alimentada ali durante mil duzentos e sessenta dias”. O grego emprega um verbo na terceira pessoa do plural sem sujeito especificado; literalmente, “para que ali a alimentem”.'
    reason: Registra a alternativa passiva natural em português e esclarece a construção ativa indefinida do texto grego.
lexical_decisions:
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O aoristo de φεύγω expressa fuga ou retirada; “fugiu” é direto, vívido e não acrescenta detalhes ausentes do texto.
- source_word: ἔρημον
  choice: deserto
  rationale: Ἔρημος pode indicar deserto ou região erma. “Deserto” é a forma bíblica corrente em português e mantém a ideia de um lugar desolado sem explicação adicional.
- source_word: ἔχει ἐκεῖ τόπον
  choice: onde tem um lugar
  rationale: A tradução conserva o presente de ἔχει e o sentido simples de τόπος. O advérbio ἐκεῖ reaparece naturalmente como “ali” na oração de propósito, evitando uma redundância pouco idiomática em português.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: preparado por Deus
  rationale: O particípio perfeito passivo indica que o lugar já foi preparado; ἀπό introduz aqui o agente pessoal, traduzido naturalmente por “por Deus”.
- source_word: ἵνα
  choice: para que
  rationale: “Para que” expressa de modo natural a finalidade introduzida por ἵνα.
- source_word: τρέφωσιν αὐτὴν
  choice: a alimentem
  rationale: Τρέφω significa alimentar, nutrir ou sustentar. A terceira pessoa do plural sem sujeito expresso é preservada em português, sem identificar quem realiza a ação.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: durante mil duzentos e sessenta dias
  rationale: O acusativo indica extensão de tempo. “Durante” comunica essa duração com clareza, e o número por extenso se integra à prosa bíblica.
theological_decisions:
- issue: Sujeito não especificado de τρέφωσιν
  choice: 'Manter a construção ativa indefinida: “a alimentem”.'
  alternative: “ela seja alimentada ali” ou “Deus a alimente ali”
  rationale: O grego emprega a terceira pessoa do plural na voz ativa sem declarar o sujeito. A tradução passiva apagaria essa forma indefinida, enquanto nomear Deus como agente acrescentaria uma identificação que o versículo não faz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para evitar redundância locativa artificial, sem eliminar o destaque dado a “ali”. O sujeito indefinido do verbo final foi preservado.
