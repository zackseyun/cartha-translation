id: REV.12.5
reference: Revelation 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: pt
  text: E ela deu à luz um filho, um menino, que está para pastorear todas as nações com uma vara de ferro[a]; e o filho dela foi arrebatado para junto de Deus e para junto do seu trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que governará todas as nações com uma vara de ferro”. O verbo grego significa literalmente “pastorear”, mas aqui ecoa o Salmo 2 e também expressa autoridade régia.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: deu à luz
  rationale: Expressão natural e atual em português que preserva a imagem concreta do parto.
- source_word: υἱόν, ἄρσεν
  choice: um filho, um menino
  rationale: Mantém os dois termos gregos e sua ênfase apositiva, sem produzir uma formulação excessivamente artificial em português.
- source_word: μέλλει ποιμαίνειν
  choice: está para pastorear
  rationale: Preserva a orientação futura de μέλλει com o infinitivo e deixa aberta a nuance entre iminência e ação destinada.
- source_word: ποιμαίνειν
  choice: pastorear
  rationale: Conserva a metáfora de ποιμαίνω; neste contexto, ela também comunica autoridade régia por alusão ao Salmo 2.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Representa o alcance mundial da expressão e corresponde naturalmente à alusão ao Salmo 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: com uma vara de ferro
  rationale: Preserva o valor instrumental da preposição e a imagem do texto-fonte em português claro.
- source_word: ἡρπάσθη
  choice: foi arrebatado
  rationale: Comunica a retirada súbita e vigorosa indicada pelo passivo de ἁρπάζω, bem como o movimento para junto de Deus.
- source_word: τὸ τέκνον αὐτῆς
  choice: o filho dela
  rationale: Embora τέκνον seja mais geral que υἱός, 'filho' é natural no contexto e evita a possível ambiguidade de gênero de 'a criança' ao retomar o menino já mencionado.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: para junto de Deus e para junto do seu trono
  rationale: A repetição de 'para junto de' reflete os dois usos de πρὸς e expressa movimento em direção tanto a Deus quanto ao trono.
theological_decisions:
- issue: Alusão messiânica ao Salmo 2 em ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ
  choice: Manter 'pastorear' no texto principal e explicar em nota seu sentido régio contextual.
  alternative: governar todas as nações com uma vara de ferro
  rationale: A passagem aponta para a autoridade régia do Messias, mas o verbo grego é literalmente 'pastorear'; preservar a metáfora evita substituir o texto por uma interpretação.
- issue: Força de μέλλει
  choice: está para pastorear
  alternative: pastoreará; há de pastorear; está destinado a pastorear
  rationale: A formulação mantém visível a orientação futura e não decide de modo rígido se a ênfase recai sobre iminência ou destino profético.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A sintaxe mantém o paralelismo e a solenidade apocalíptica sem recorrer a formas arcaicas. O marcador [a] foi colocado após a oração relevante.
