id: REV.12.15
reference: Revelation 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: pt
  text: E a serpente lançou água como um rio da boca, atrás da mulher[a], para fazê-la ser arrastada pelo rio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em perseguição à mulher”. A expressão grega pode indicar posição atrás dela ou movimento em sua perseguição.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para fazê-la ser levada pelo rio”. A expressão indica ser carregada ou arrastada pela correnteza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: lançou
  rationale: Traduz naturalmente o aoristo de βάλλω e conserva a ação hostil e vigorosa sem acrescentar intensidade não expressa de modo explícito.
- source_word: ὁ ὄφις
  choice: a serpente
  rationale: Preserva a designação bíblica e simbólica de ὄφις, mais adequada ao contexto do que 'cobra'.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: da boca
  rationale: Em português, 'lançou da boca' expressa de forma concisa e vívida a origem da água; o possuidor é claro pelo sujeito.
- source_word: ὀπίσω τῆς γυναικός
  choice: atrás da mulher
  rationale: Mantém o valor espacial básico de ὀπίσω com genitivo e também permite, no contexto, a noção de perseguição, sem resolver totalmente a ambiguidade.
- source_word: ὕδωρ ὡς ποταμόν
  choice: água como um rio
  rationale: Preserva tanto a comparação introduzida por ὡς quanto a imagem explícita de ποταμός, sem substituí-la interpretativamente por 'inundação' ou 'torrente'.
- source_word: ἵνα
  choice: para
  rationale: Expressa de maneira natural em português a finalidade pretendida pela serpente.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: fazê-la ser arrastada pelo rio
  rationale: Reproduz a construção causativa com ποιέω e o sentido raro de ποταμοφόρητος, 'levada ou carregada por um rio', sem acrescentar a ideia específica de afogamento.
theological_decisions:
- issue: Imagem simbólica e apocalíptica do ataque da serpente
  choice: Conservar literalmente as imagens de água e rio no texto.
  alternative: Interpretar a água como exércitos, perseguição, mentiras ou caos.
  rationale: O texto apresenta a imagem sem decodificá-la; traduzi-la diretamente evita impor uma interpretação teológica específica.
- issue: Finalidade ou resultado em ἵνα
  choice: 'Traduzir como finalidade: ''para fazê-la''.'
  alternative: 'Traduzir como mero resultado: ''de modo que ela fosse''.'
  rationale: A ação deliberada da serpente e a construção com ἵνα favorecem a intenção, embora finalidade e resultado possam se aproximar no contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem foi levemente ajustada ao português, sem eliminar a ambiguidade de ὀπίσω nem interpretar o simbolismo apocalíptico.
