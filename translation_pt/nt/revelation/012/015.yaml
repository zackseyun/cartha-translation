    rationale: Em português, «lançou água como um rio da boca, atrás da mulher» (ou formulação equivalente) torna imediatamente claro o objeto lançado e sua origem, sem alterar o valor espacial/direcional de ὀπίσω.
  - severity: low
    issue: Nota b contém formulação gramaticalmente inadequada.
    rationale: «Para fazê-la levada pelo rio» deve ser «para fazê-la ser levada pelo rio». A revisão mantém a explicação do composto ποταμοφόρητον e da construção causativa com ποιήσῃ.
  revised_text: E a serpente lançou água como um rio da boca, atrás da mulher[a], para fazê-la ser arrastada pelo rio[b].
