- from: E foram dadas à mulher as duas asas da grande águia, para que voasse para o deserto, para o lugar dela, onde é sustentada por um tempo, tempos e metade de um tempo, longe da presença da serpente.
  to: E foram dadas à mulher as duas asas da grande águia, para que voasse para o deserto, para o seu lugar, onde ali é sustentada por um tempo, tempos e metade de um tempo, longe da presença da serpente.
  rationale: Acrescentado «ali» para representar ἐκεῖ, preservando a repetição locativa presente no grego sem converter a fórmula temporal em uma duração cronológica interpretada. Ajustado «o lugar dela» para «o seu lugar», forma mais natural em português sem alteração de sentido.
