  source_fidelity: A tradução reproduz adequadamente a construção principal, a imagem da grande águia, a finalidade do voo, a fórmula temporal não interpretada e o afastamento da serpente. Contudo, omite ἐκεῖ («ali/lá») após ὅπου τρέφεται; embora redundante em relação a «onde», o termo está no texto grego da SBLGNT e deve ser representado.
  naturalness: O registro é claro e digno. «Onde ali é sustentada» conserva a ênfase locativa do grego, ainda que a combinação seja levemente marcada em português, o que é justificável pela repetição enfática do original.
  terminology: «Asas», «grande águia», «deserto», «sustentada», «um tempo, tempos e metade de um tempo» e «serpente» são escolhas adequadas. «Sustentada» preserva de modo apropriado a amplitude de τρέφεται.
  issues:
