id: REV.12.14
reference: Revelation 12:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: pt
  text: E foram dadas à mulher as duas asas da grande águia, para que voasse para o deserto, para o seu lugar, onde ali é sustentada por um tempo, tempos e metade de um tempo, longe da presença da serpente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: as duas asas da grande águia
  rationale: Mantém a imagem definida e enfática do grego, com ordem natural em português.
- source_word: ἵνα πέτηται
  choice: para que voasse
  rationale: Expressa a finalidade e o valor verbal dependente do aoristo passivo anterior em português corrente.
- source_word: εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς
  choice: para o deserto, para o lugar dela
  rationale: Preserva a repetição de εἰς e a aposição explicativa, sem identificar além do texto quem determinou ou possui esse lugar.
- source_word: ὅπου τρέφεται
  choice: onde é sustentada
  rationale: O passivo τρέφεται pode envolver alimentação e cuidado/provisão; “é sustentada” conserva essa amplitude no contexto.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: um tempo, tempos e metade de um tempo
  rationale: Mantém a fórmula simbólica e sua indeterminação, sem convertê-la interpretativamente em anos.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: longe da presença da serpente
  rationale: Reproduz o sentido idiomático de afastamento da face/presença, sem perder a referência pessoal da expressão.
theological_decisions:
- issue: Duração do período simbólico
  choice: um tempo, tempos e metade de um tempo
  alternative: três anos e meio
  rationale: O texto grego emprega uma fórmula alusiva e não explicita a conversão cronológica; a tradução preserva a tensão interpretativa.
- issue: Natureza da provisão à mulher
  choice: é sustentada
  alternative: é alimentada
  rationale: “Sustentada” inclui alimento sem limitar τρέφεται apenas ao ato de comer, evitando especificar o agente que o passivo não nomeia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva as imagens apocalípticas, as repetições relevantes e a ambiguidade temporal do original.
