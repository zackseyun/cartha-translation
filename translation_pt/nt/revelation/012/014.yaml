    rationale: O texto-fonte diz literalmente «onde é sustentada ali». A redundância locativa tem valor enfático/estilístico e é também mantida no texto inglês de auditoria («where she is nourished there»). A versão portuguesa deve incluir «ali» ou equivalente.
