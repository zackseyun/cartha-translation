id: REV.12.7
reference: Revelation 12:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: pt
  text: 'E irrompeu uma guerra no céu[a]: Miguel e os seus anjos lutaram contra o dragão.[b] E o dragão e os seus anjos lutaram,[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “houve guerra no céu” ou “surgiu uma guerra no céu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Miguel e os seus anjos para lutar contra o dragão”; o grego emprega um infinitivo articulado numa construção sintaticamente condensada para expressar a ação ou finalidade.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “E o dragão lutou, e os seus anjos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: irrompeu uma guerra
  rationale: A construção indica o surgimento de um acontecimento. “Irrompeu uma guerra” comunica naturalmente o valor ingressivo, sem reduzir a expressão ao mais estático “houve guerra”.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto apocalíptico, οὐρανός designa o domínio celestial, e não simplesmente o céu visível.
- source_word: Μιχαὴλ
  choice: Miguel
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome pessoal, sem acrescentar título ou identificação interpretativa.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: os seus anjos
  rationale: O possessivo expressa de modo claro e natural a associação dos anjos primeiro com Miguel e depois com o dragão.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: lutaram contra o dragão
  rationale: A construção comprimida com infinitivo articular é explicitada como oração verbal em português. “Contra” expressa a relação hostil indicada pelo contexto, enquanto “lutaram” preserva o sentido de πολεμέω.
- source_word: δράκοντος / δράκων
  choice: o dragão
  rationale: A tradução direta preserva a figura apocalíptica do texto e sua identificação no contexto imediato.
- source_word: ἐπολέμησεν
  choice: lutaram
  rationale: Embora o verbo grego esteja no singular antes do sintagma coordenado, o português natural emprega o plural para o dragão e seus anjos. Evita-se “revidaram”, que tornaria explícita uma reação apenas sugerida pela sequência narrativa.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: e os seus anjos
  rationale: A formulação mantém o paralelismo entre Miguel com seus anjos e o dragão com os seus.
theological_decisions:
- issue: Identidade e posição de Miguel
  choice: Manter apenas o nome “Miguel”, sem explicação interpretativa.
  alternative: Acrescentar “o arcanjo” ou identificar Miguel com uma figura cristológica.
  rationale: O versículo nomeia Miguel, mas aqui não declara sua posição nem o identifica com Cristo. A tradução não deve resolver uma questão que o próprio texto deixa sem explicação.
- issue: Relação dos anjos com Miguel e com o dragão
  choice: Traduzir simetricamente “os seus anjos” nos dois casos.
  alternative: Explicar a natureza, origem ou lealdade desses anjos.
  rationale: O texto apresenta dois grupos associados às respectivas figuras, mas não desenvolve neste versículo a natureza dessa associação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Irrompeu” conserva a força ingressiva sem soar coloquial. A segunda oração permanece simples e próxima do grego, sem acrescentar “revidaram” ou “contra-atacaram”. Todos os marcadores de nota aparecem no texto principal.
