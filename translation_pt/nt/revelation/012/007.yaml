  terminology: «Miguel», «anjos», «dragão» e «céu» são escolhas tradicionais, inteligíveis e semanticamente adequadas. A tradução não acrescenta título, identidade ou interpretação doutrinária a Miguel. As notas preservam alternativas relevantes e explicam a construção grega sem impor uma leitura teológica.
