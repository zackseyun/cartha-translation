id: REV.12.10
reference: Revelation 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: pt
  text: 'E ouvi uma voz forte no céu, que dizia: “Agora vieram a salvação, o poder e o reino do nosso Deus, e a autoridade do seu Messias[a], porque foi lançado para baixo o acusador dos nossos irmãos[b], aquele que os acusa diante do nosso Deus dia e noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego Χριστός (Christós) significa “Ungido” e corresponde a “Messias”.
    reason: alternative_reading
  - marker: b
    text: “Irmãos” pode designar coletivamente os demais fiéis, incluindo tanto mulheres como homens.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: uma voz forte
  rationale: Em associação com φωνή, μεγάλη indica intensidade ou volume; “voz forte” é natural em português e mantém o tom solene.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Refere-se ao âmbito celestial; “no céu” é a forma idiomática em português.
- source_word: Ἄρτι
  choice: Agora
  rationale: Marca o momento decisivo anunciado pela voz celestial.
- source_word: ἐγένετο
  choice: vieram
  rationale: Expressa a chegada ou manifestação efetiva das realidades enumeradas. O plural é natural em português diante do sujeito composto, embora o grego empregue o verbo no singular.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: a salvação, o poder e o reino
  rationale: Preserva os três conceitos distintos e a força retórica da enumeração grega, com coordenação natural em português.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: o reino do nosso Deus
  rationale: βασιλεία pode designar reino ou reinado; “reino” preserva a linguagem régia e apocalíptica sem excluir a ideia do governo divino.
- source_word: ἡ ἐξουσία
  choice: a autoridade
  rationale: Distingue o direito ou poder legítimo de governar da δύναμις mencionada anteriormente.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: do seu Messias
  rationale: Χριστός funciona aqui como título do Ungido de Deus; “Messias” comunica esse sentido titular em português.
- source_word: ἐβλήθη
  choice: foi lançado para baixo
  rationale: Mantém a imagem espacial e a ação forçada do passivo de βάλλω no contexto da expulsão celestial.
- source_word: ὁ κατήγωρ
  choice: o acusador
  rationale: O substantivo raro designa aquele que apresenta acusações; “acusador” é claro e preserva o cenário judicial.
- source_word: ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός
  choice: diante do nosso Deus dia e noite
  rationale: Reproduz de modo direto a acusação contínua perante Deus.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste sintagma, a palavra funciona explicitamente como título do governante ungido pertencente a Deus. “Messias” torna o valor do título transparente, enquanto a nota registra a alternativa tradicional.
- issue: Alcance de ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: “Irmãos” corresponde formalmente ao masculino plural grego e pode ter sentido coletivo; a nota esclarece que o grupo pode incluir mulheres, sem ampliar silenciosamente o texto principal.
- issue: Valor de βασιλεία
  choice: reino
  alternative: reinado
  rationale: Ambas as acepções são possíveis. “Reino” preserva a formulação bíblica corrente e o registro apocalíptico, sem negar que esteja em vista o governo régio de Deus.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A cadência da proclamação foi preservada sem arcaísmos; as repetições conceituais do grego foram mantidas.
