  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: pt
  text: Mas ele não foi forte o bastante[a], nem se encontrou mais lugar para eles no céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não prevaleceu”. O verbo grego pode indicar ser forte, ser capaz ou prevalecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mas
  rationale: No contexto da batalha narrada no versículo anterior, a conjunção introduz um resultado adversativo; “Mas” comunica essa relação com naturalidade em português.
- source_word: οὐκ ἴσχυσεν
  choice: ele não foi forte o bastante
  rationale: O verbo ἰσχύω pode expressar força, capacidade ou prevalência. A tradução preserva a imagem de força no contexto de combate, enquanto a nota registra a alternativa “não prevaleceu”.
- source_word: οὐδὲ
  choice: nem
  rationale: Coordena naturalmente a segunda oração negativa com a primeira e conserva a força negativa do grego.
- source_word: τόπος
  choice: lugar
  rationale: É o equivalente direto e natural para a localização ou posição no âmbito celestial.
- source_word: εὑρέθη
  choice: se encontrou
  rationale: A construção impessoal com “se” preserva de modo idiomático o sentido passivo de “foi encontrado”.
- source_word: αὐτῶν
  choice: para eles
  rationale: A expressão portuguesa transmite naturalmente que já não havia lugar destinado ao dragão e aos seus anjos.
- source_word: ἔτι
  choice: mais
  rationale: 'Em contexto negativo, indica que algo deixou de existir ou de ocorrer: “não... mais”.'
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto de Apocalipse, οὐρανός designa o âmbito celestial, não apenas o céu visível.
theological_decisions:
- issue: Referente do verbo singular ἴσχυσεν
  choice: O sujeito é singular (“ele”) e retoma o dragão do versículo anterior; “eles” inclui o dragão e os seus anjos.
  alternative: 'Traduzir coletivamente no plural: “eles não foram fortes o bastante”.'
  rationale: O singular do verbo grego mantém o dragão como sujeito da primeira oração, enquanto o pronome plural da segunda se refere ao grupo inteiro. Preservar essa mudança acompanha mais de perto a gramática e o fluxo do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Forte o bastante” é corrente e mantém a nuance de força; “nem se encontrou mais lugar” preserva a estrutura negativa e o valor passivo do original sem soar excessivamente literal.
