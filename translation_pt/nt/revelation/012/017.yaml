id: REV.12.17
reference: Revelation 12:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: pt
  text: O dragão ficou furioso com a mulher e partiu para guerrear contra os demais descendentes dela, os que guardam os mandamentos de Deus e têm o testemunho de Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o testemunho a respeito de Jesus”; também pode significar “o testemunho dado por Jesus”. O genitivo grego admite mais de uma interpretação.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou furioso
  rationale: Expressa a mudança de estado indicada pelo aoristo de ὀργίζομαι e a intensidade da reação hostil no contexto apocalíptico.
- source_word: δράκων
  choice: dragão
  rationale: É a correspondência direta e consagrada para a figura simbólica já apresentada no capítulo.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Preserva o movimento narrativo de afastar-se ou partir, em linguagem portuguesa natural.
- source_word: ποιῆσαι πόλεμον μετὰ
  choice: para guerrear contra
  rationale: Traduz idiomaticamente a expressão 'fazer guerra com'; em português, 'guerrear contra' explicita a relação adversativa já implícita na construção.
- source_word: τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: o restante da descendência dela
  rationale: Mantém o valor coletivo de σπέρμα e a ideia dos demais pertencentes à descendência da mulher, sem recorrer ao pouco natural 'semente'.
- source_word: τηρούντων τὰς ἐντολὰς
  choice: guardam os mandamentos
  rationale: τηρέω indica observância fiel; 'guardar os mandamentos' é claro, conciso e conserva a ressonância bíblica.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: têm o testemunho de Jesus
  rationale: Mantém o sentido básico de ἔχω e preserva em português a ambiguidade do genitivo Ἰησοῦ.
theological_decisions:
- issue: Sentido do genitivo em τὴν μαρτυρίαν Ἰησοῦ
  choice: o testemunho de Jesus
  alternative: o testemunho a respeito de Jesus; o testemunho dado por Jesus
  rationale: O genitivo grego pode ser objetivo, indicando testemunho acerca de Jesus, ou subjetivo, indicando testemunho dado por Jesus. A formulação principal conserva essa tensão interpretativa, e a nota apresenta as duas possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A locução explicativa “isto é” esclarece que os guardadores dos mandamentos são o restante da descendência, sem alterar a relação sintática. O marcador da nota foi colocado junto à expressão ambígua a que se refere.
