revisions:
- from: O dragão ficou furioso com a mulher e foi embora para guerrear contra o restante da descendência dela, isto é, contra os que guardam os mandamentos de Deus e têm o testemunho de Jesus.[a]
  to: O dragão ficou furioso com a mulher e partiu para guerrear contra os demais descendentes dela, os que guardam os mandamentos de Deus e têm o testemunho de Jesus[a].
  rationale: A revisão elimina uma glosa explicativa desnecessária, torna a referência aos membros da descendência mais natural em português e desloca a âncora da nota para a expressão cujo genitivo é ambíguo. Não altera o sentido do versículo nem resolve a ambiguidade de μαρτυρία Ἰησοῦ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:38:38Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica com precisão a ira do dragão, seu movimento para combater e a identificação dos demais descendentes da mulher. Contudo, a locução explicativa “isto é” é desnecessária e torna mais pesada uma construção que o grego apresenta diretamente por meio de particípios. O sentido adversativo de μετὰ no contexto de fazer guerra é adequadamente expresso por “contra”.
  naturalness: “Ficou furioso”, “guardam os mandamentos” e “têm o testemunho” são naturais e adequados ao registro. “Os demais descendentes dela” é mais fluente e pessoalmente explícito do que “o restante da descendência dela”, e a remoção de “isto é” melhora o ritmo.
  terminology: “Dragão”, “mulher”, “mandamentos de Deus” e “testemunho de Jesus” preservam a terminologia estabelecida e o registro bíblico. “Testemunho de Jesus” mantém, como o grego, a ambiguidade do genitivo; a nota deve permanecer ancorada imediatamente nessa expressão.
  issues:
  - severity: low
    issue: A expressão “isto é” introduz uma explicação não necessária.
    rationale: Os particípios τῶν τηρούντων ... καὶ ἐχόντων caracterizam diretamente “os demais”/“o restante”; a explicitação é interpretativamente aceitável, mas estilisticamente dispensável e menos próxima da concisão sintática do original.
  - severity: low
    issue: O marcador da nota está no fim do versículo, não junto à expressão ambígua.
    rationale: A nota trata especificamente de “o testemunho de Jesus”; o marcador deve seguir essa expressão para oferecer uma âncora clara.
  revised_text: O dragão ficou furioso com a mulher e partiu para guerrear contra os demais descendentes dela, os que guardam os mandamentos de Deus e têm o testemunho de Jesus[a].
  revised_footnotes:
  - marker: a
    text: Ou “o testemunho a respeito de Jesus”; também pode significar “o testemunho dado por Jesus”. O genitivo grego admite mais de uma interpretação.
    reason: alternative_reading
  revision_rationale: A revisão elimina uma glosa explicativa desnecessária, torna a referência aos membros da descendência mais natural em português e desloca a âncora da nota para a expressão cujo genitivo é ambíguo. Não altera o sentido do versículo nem resolve a ambiguidade de μαρτυρία Ἰησοῦ.
