  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: pt
  text: E a terra ajudou a mulher[a], e a terra abriu a boca e engoliu o rio que o dragão havia lançado de sua boca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o solo ajudou a mulher» ou «a terra ajudou a mulher», no sentido de território. O grego γῆ pode significar «terra», «solo» ou «território».
    reason: lexical_alternative
  - marker: b
    text: Ou «o rio que o dragão lançou para fora de sua boca» ou «o rio que o dragão fez sair de sua boca».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: ajudou
  rationale: Equivalente direto e natural de βοηθέω, preservando a força narrativa simples do aoristo.
- source_word: ἡ γῆ
  choice: a terra
  rationale: γῆ pode significar «terra», «solo» ou «região»; «a terra» combina melhor com a amplitude cósmica da cena apocalíptica.
- source_word: τῇ γυναικί
  choice: a mulher
  rationale: Tradução direta do dativo com βοηθέω, sem explicar a identidade simbólica da figura.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: abriu a boca
  rationale: Mantém a personificação vívida da terra. A repetição do sujeito pode ser omitida naturalmente em português sem perder a referência.
- source_word: κατέπιεν
  choice: engoliu
  rationale: Equivalente direto de καταπίνω, sem intensificação desnecessária.
- source_word: τὸν ποταμόν
  choice: o rio
  rationale: ποταμός significa normalmente «rio»; evita interpretar a imagem como «torrente» ou «inundação».
- source_word: ὃν ἔβαλεν
  choice: que ... havia lançado
  rationale: «Lançado» preserva a ação vigorosa de βάλλω; o mais-que-perfeito composto explicita naturalmente que essa ação antecedeu o ato de engolir.
- source_word: ὁ δράκων
  choice: o dragão
  rationale: Equivalente estabelecido de δράκων no Apocalipse.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sua boca
  rationale: Forma concisa e idiomática de expressar a origem indicada por ἐκ; a nota registra a alternativa mais explícita.
theological_decisions:
- issue: Personificação da terra na imagem apocalíptica
  choice: Conservar a terra como agente que ajuda, abre a boca e engole o rio.
  alternative: Interpretar a terra como população, território ou meio providencial de livramento.
  rationale: O texto apresenta a ação em linguagem visionária e não identifica seu referente simbólico; a tradução preserva essa tensão sem impor uma explicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a imagem apocalíptica e a ambiguidade lexical relevante sem expansão interpretativa.
