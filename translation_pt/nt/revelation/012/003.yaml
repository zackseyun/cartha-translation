source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: pt
  text: 'E apareceu outro sinal no céu: eis um grande dragão vermelho como fogo, com sete cabeças e dez chifres; e sobre suas cabeças havia sete diademas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coroas”. O grego diz mais especificamente “diademas”, faixas ou insígnias régias, distintas da coroa concedida a um vencedor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu
  rationale: O aoristo passivo de ὁράω funciona idiomaticamente como “apareceu” no relato visionário; “foi visto” seria mais formalmente literal, porém menos natural.
- source_word: ἄλλο σημεῖον
  choice: outro sinal
  rationale: Em Apocalipse, σημεῖον designa um sinal visionário e simbólico; “sinal” é claro e preserva essa função sem explicá-la.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Embora οὐρανός também possa significar “firmamento”, o contexto da visão apocalíptica favorece “céu”, sem excluir a dimensão visual.
- source_word: ἰδοὺ
  choice: eis
  rationale: “Eis” conserva a função de chamar subitamente a atenção e combina com o registro elevado da visão.
- source_word: δράκων μέγας πυρρός
  choice: um grande dragão vermelho como fogo
  rationale: “Grande dragão” preserva μέγας e δράκων; “vermelho como fogo” expressa de modo natural a tonalidade ígnea de πυρρός, sem reduzi-la ao simples “vermelho”.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: com sete cabeças e dez chifres
  rationale: A construção com “com” reproduz naturalmente em português a descrição participial introduzida por ἔχων, mantendo intactos os elementos da visão.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: sobre as cabeças, havia sete diademas
  rationale: “Sobre” preserva a relação espacial de ἐπί. “Diademas” mantém a distinção lexical entre διάδημα, insígnia régia, e στέφανος, coroa ou grinalda de vitória.
theological_decisions:
- issue: Sentido do descritor de cor πυρρός
  choice: vermelho como fogo
  alternative: vermelho; cor de fogo
  rationale: A expressão mantém a associação lexical com fogo e a vivacidade da imagem, sem atribuir ao vermelho um simbolismo teológico não explicitado neste versículo.
- issue: Referência possessiva de αὐτοῦ
  choice: omissão natural do possessivo em “sobre as cabeças”
  alternative: sobre suas cabeças; sobre as cabeças dele
  rationale: Em português, o referente permanece inequívoco sem possessivo. A formulação evita a possível ambiguidade de “suas” e não enfraquece a caracterização pessoal da figura.
- issue: Valor de διάδημα
  choice: diademas
  alternative: coroas
  rationale: “Diademas” preserva a referência específica a insígnias régias e evita apagar uma distinção lexical relevante no Apocalipse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação organiza a longa sequência grega sem eliminar seu impacto visionário. “Eis” mantém o tom apocalíptico elevado; “com” é mais natural que o decalque “tendo”. O marcador [a] aparece no texto e corresponde à única nota.
