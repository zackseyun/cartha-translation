  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a sequência e os elementos centrais do grego: o rolo, os quatro seres viventes, os vinte e quatro anciãos, a prostração diante do Cordeiro, a distribuição de harpa e taças, e a identificação direta final. O relativo feminino plural αἵ retoma gramaticalmente «taças» (φιάλας), não «incenso» (θυμιαμάτων, neutro), de modo que essa referência deve permanecer explícita ou inequivocamente feminina plural.'
  naturalness: O registro é claro, moderno e apropriado. Contudo, separar «Cada um segurava...» em nova frase enfraquece levemente sua ligação participial com a prostração; «cada um com...» conserva melhor a construção e é muito natural em português. A nota b não oferece uma alternativa lexical idiomática equivalente a «santos».
  terminology: «Rolo», «seres viventes», «anciãos», «Cordeiro», «harpa», «taças de ouro», «incenso» e «santos» são escolhas adequadas e consistentes com o registro de Apocalipse. «Lira» é uma alternativa lexical pertinente para κιθάρα. Para ἅγιοι, «pessoas santas» é uma alternativa possível, embora menos tradicional e menos concisa que «santos».
  issues:
  - severity: low
    issue: A nota b formula a alternativa como «os que são santos».
    rationale: Essa formulação é circular e não constitui uma alternativa lexical natural para ἅγιοι. «Pessoas santas» comunica a alternativa sem alterar o sentido.
  - severity: low
    issue: A frase independente «Cada um segurava...» torna menos visível sua relação com os grupos que se prostram.
    rationale: O particípio ἔχοντες acompanha a ação de «caíram/prostraram-se». A construção «cada um com» preserva essa ligação de modo fluente.
