source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: pt
  text: E, quando ele tomou o rolo, os quatro seres viventes e os vinte e quatro anciãos prostraram-se diante do Cordeiro, cada um com uma harpa[a] e taças de ouro cheias de incenso; essas taças são as orações dos santos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma lira”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as orações das pessoas santas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: rolo
  rationale: No cenário de Apocalipse, refere-se a um documento escrito em forma de rolo, não necessariamente a um livro no formato moderno.
- source_word: ζῷα
  choice: seres viventes
  rationale: Designa os seres celestiais ao redor do trono; evita o sentido pejorativo de “animais” ou “bestas” e mantém a ênfase de que são seres vivos.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: É a designação natural e tradicional dos vinte e quatro personagens celestiais, sem impor terminologia de um ofício eclesiástico posterior.
- source_word: ἔπεσαν ἐνώπιον τοῦ ἀρνίου
  choice: prostraram-se diante do Cordeiro
  rationale: “Prostraram-se” expressa naturalmente a queda reverente em adoração, e “Cordeiro” preserva o título cristológico de Apocalipse.
- source_word: ἔχοντες ἕκαστος
  choice: Cada um segurava
  rationale: Preserva a força distributiva de ἕκαστος e apresenta a construção participial em português corrente. A formulação não restringe silenciosamente os objetos apenas aos anciãos.
- source_word: κιθάραν
  choice: uma harpa
  rationale: O termo indica um instrumento de cordas. “Harpa” é a forma convencional e amplamente compreendida, enquanto “lira” continua sendo uma alternativa lexical possível e consta em nota.
- source_word: φιάλας χρυσᾶς γεμούσας θυμιαμάτων
  choice: taças de ouro cheias de incenso
  rationale: φιάλη é uma taça ou vasilha rasa, não um frasco moderno; “incenso” traduz naturalmente o plural grego como substantivo de massa.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: essas taças são as orações dos santos
  rationale: O pronome relativo feminino plural αἵ retoma gramaticalmente φιάλας (“taças”). A explicitação por “essas taças” preserva essa concordância do grego e a identificação direta feita pelo texto.
theological_decisions:
- issue: Referente da identificação simbólica
  choice: “essas taças são as orações dos santos”
  alternative: “o incenso são as orações dos santos” ou “essas taças representam as orações dos santos”
  rationale: No grego, αἵ é feminino plural e retoma “taças”, enquanto “incenso” está no neutro plural. Além disso, εἰσιν faz uma identificação direta; traduzir por “representam” enfraqueceria e interpretaria a metáfora.
- issue: Sentido de ἅγιοι
  choice: santos
  alternative: os que são santos; povo santo
  rationale: “Santos” conserva o termo teológico para pessoas consagradas a Deus sem restringi-lo a uma classe posteriormente canonizada. A nota esclarece esse uso.
- issue: Distribuição dos instrumentos e das taças
  choice: Manter “cada um” após mencionar os dois grupos
  alternative: Restringir os objetos somente aos vinte e quatro anciãos
  rationale: A construção grega não explicita uma restrição apenas aos anciãos. A tradução preserva a abrangência e a possível tensão sintática, sem resolver interpretativamente quem portava cada objeto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente reconhecível no mundo lusófono. “Seres viventes”, “anciãos” e “Cordeiro” mantêm o registro solene e o vocabulário recorrente de Apocalipse sem recorrer a formas arcaicas. A segunda frase evita um particípio pesado e torna explícito o referente feminino plural do texto grego.
