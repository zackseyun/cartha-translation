id: REV.5.12
reference: Revelation 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: pt
  text: 'dizendo em alta voz: “Digno é o Cordeiro que foi morto[a] de receber o poder, a riqueza[b], a sabedoria, a força[c], a honra, a glória e a bênção.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que foi imolado”. O particípio grego pode ser traduzido de modo mais gráfico e sacrificial, mas “que foi morto” é mais imediatamente compreensível e preserva o tom elevado da adoração.
    reason: lexical_alternative
  - marker: b
    text: Ou “as riquezas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o vigor”. “Força” distingue este termo do anterior, traduzido por “poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o particípio presente ligado à multidão celestial do versículo anterior, sem transformar desnecessariamente a construção em uma oração independente.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressão idiomática, clara e concreta em português, preservando a imagem da proclamação sonora.
- source_word: Ἄξιόν ἐστιν
  choice: Digno é
  rationale: A ordem marcada preserva a ênfase inicial do grego e combina com o tom elevado da aclamação.
- source_word: τὸ ἀρνίον
  choice: o Cordeiro
  rationale: Tradução consagrada do título cristológico usado em Apocalipse; a inicial maiúscula indica seu emprego titular no contexto.
- source_word: τὸ ἐσφαγμένον
  choice: que foi morto
  rationale: Comunica de modo natural e digno o particípio perfeito passivo de σφάζω, sem ocultar a morte violenta; “imolado” permanece uma alternativa sacrificial possível.
- source_word: λαβεῖν
  choice: de receber
  rationale: Completa naturalmente a expressão portuguesa “digno de” e representa a concessão dos atributos na aclamação, sem impor o sentido mais forte de “tomar”.
- source_word: δύναμιν
  choice: o poder
  rationale: Equivalente direto e corrente para δύναμις, primeiro elemento da série de sete atribuições.
- source_word: πλοῦτον
  choice: a riqueza
  rationale: Termo moderno e claro para abundância de recursos; “as riquezas” também é possível.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: Equivalente direto e natural.
- source_word: ἰσχὺν
  choice: a força
  rationale: Distingue ἰσχύς de δύναμις, aqui traduzido por “poder”, preservando a variedade retórica da lista.
- source_word: τιμὴν
  choice: a honra
  rationale: Equivalente corrente em contexto de reconhecimento e reverência.
- source_word: δόξαν
  choice: a glória
  rationale: Tradução bíblica padrão e apropriada ao contexto de adoração.
- source_word: εὐλογίαν
  choice: a bênção
  rationale: Preserva o sentido nominal de εὐλογία na aclamação; no contexto, pode envolver palavras de louvor, mas “bênção” evita reduzir a amplitude do termo.
theological_decisions:
- issue: Título cristológico e uso de maiúscula
  choice: o Cordeiro
  alternative: o cordeiro
  rationale: Em Apocalipse, ἀρνίον funciona no contexto como título do Jesus exaltado e morto. A maiúscula sinaliza esse uso sem acrescentar conteúdo doutrinário alheio ao texto.
- issue: Linguagem da morte sacrificial
  choice: que foi morto
  alternative: que foi imolado
  rationale: A formulação principal é imediatamente compreensível e mantém a ligação entre a dignidade do Cordeiro e sua morte. A nota conserva a alternativa “imolado”, que torna mais explícita a nuance sacrificial e gráfica de σφάζω sem impor uma explicação específica da expiação.
- issue: Sentido de εὐλογία na doxologia
  choice: a bênção
  alternative: o louvor
  rationale: “Bênção” mantém a correspondência lexical e a possível amplitude do termo. “Louvor” é contextualmente plausível, mas explicita apenas um aspecto do ato de bendizer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Digno é” conserva a ênfase e o caráter litúrgico do grego. Os artigos na enumeração tornam a série natural em português e preservam suas sete atribuições.
