  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: pt
  text: e fizeste deles um reino[a] e sacerdotes para o nosso Deus; e eles reinam[b] na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «reis» em vez de «um reino».
    reason: textual_variant
  - marker: b
    text: Alguns manuscritos trazem «reinarão» em vez de «reinam».
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: fizeste
  rationale: O aoristo ativo indicativo é vertido naturalmente pelo pretérito perfeito; a segunda pessoa do singular preserva a forma direta do cântico dirigido ao Cordeiro.
- source_word: αὐτοὺς
  choice: deles
  rationale: Na construção idiomática portuguesa «fazer deles», o pronome identifica as pessoas constituídas como reino e sacerdotes.
- source_word: τῷ θεῷ ἡμῶν
  choice: para o nosso Deus
  rationale: O dativo expressa a relação de serviço ou pertença; «para o nosso Deus» é natural em português e não força uma distinção teológica além do texto.
- source_word: βασιλείαν
  choice: um reino
  rationale: O substantivo acusativo singular designa coletivamente os redimidos como reino, em contraste com a variante «reis».
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: É o equivalente corrente e mantém a associação bíblica entre reino e sacerdócio.
- source_word: βασιλεύουσιν
  choice: reinam
  rationale: A forma apresentada no SBLGNT é presente do indicativo ativo, portanto o texto principal mantém o presente, sem convertê-lo em futuro.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Reproduz de modo natural ἐπί com genitivo. No contexto de «reinar», pode conservar a tensão entre localização e âmbito do reinado sem especificar um esquema escatológico.
theological_decisions:
- issue: Identidade dos redimidos como βασιλείαν
  choice: um reino
  alternative: reis
  rationale: O texto grego fornecido traz o singular βασιλείαν («reino»). A variante «reis», influente na tradição, é registrada em nota sem substituir o texto adotado.
- issue: Tempo do reinado
  choice: eles reinam
  alternative: eles reinarão
  rationale: βασιλεύουσιν, no texto grego fornecido, é presente. A tradução preserva essa forma e registra a leitura futura em nota, sem resolver por tradução questões escatológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Fizeste» preserva a segunda pessoa singular do original e o tom solene do cântico. O ponto e vírgula separa com clareza os dois predicados coordenados. Os marcadores foram colocados junto às expressões efetivamente afetadas pelas variantes.
