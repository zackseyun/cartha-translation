  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: pt
  text: E ele veio e tomou o rolo da mão direita daquele que está sentado no trono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: veio
  rationale: O aoristo de ἔρχομαι narra o movimento do Cordeiro em direção àquele que está no trono. “Veio” conserva o verbo simples do grego sem acrescentar a nuance interpretativa de “aproximou-se”.
- source_word: εἴληφεν
  choice: tomou o rolo
  rationale: O perfeito de λαμβάνω integra a sequência narrativa e pode ser expresso naturalmente pelo pretérito perfeito em português. O objeto, omitido no grego mas evidente pelo contexto imediato, é explicitado como “o rolo” para clareza.
- source_word: ἐκ
  choice: da
  rationale: 'A preposição indica a origem do objeto: o Cordeiro o toma da mão direita. A contração “da” é a forma idiomática em português.'
- source_word: τῆς δεξιᾶς
  choice: mão direita
  rationale: Neste contexto, δεξιά designa concretamente a mão direita, não apenas o lado direito, preservando a imagem da visão.
- source_word: τοῦ καθημένου
  choice: daquele que estava sentado
  rationale: O particípio substantivado identifica a figura entronizada. “Estava sentado” é natural na narrativa visionária e preserva a distinção entre essa figura e o Cordeiro.
- source_word: ἐπὶ τοῦ θρόνου
  choice: no trono
  rationale: A expressão tem sentido locativo. Em português, “sentado no trono” é a formulação atual e idiomática.
theological_decisions:
- issue: Objeto direto implícito de εἴληφεν
  choice: Explicitado como “o rolo”, com base no contexto imediato.
  alternative: “E ele veio e tomou da mão direita...” ou “tomou-o...”
  rationale: O grego deixa o objeto implícito por ele ser evidente no contexto. Em português, nomeá-lo evita uma construção truncada; “o rolo” retoma diretamente o objeto apresentado no versículo 1 sem acrescentar conteúdo novo.
- issue: Identificação da figura entronizada
  choice: “daquele que estava sentado no trono”
  alternative: “daquele que se assenta no trono”
  rationale: A tradução mantém a figura sem nomeá-la nem inserir explicação doutrinária, preservando a distinção narrativa entre o Cordeiro e aquele que está no trono.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Rolo” é preferido a “livro” porque corresponde ao objeto físico descrito no contexto de Apocalipse 5.
