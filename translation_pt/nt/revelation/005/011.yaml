source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: pt
  text: E olhei[a] e ouvi a voz de muitos anjos ao redor do trono, dos seres viventes e dos anciãos. O número deles era de miríades de miríades e milhares de milhares[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vi”.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “miríades de miríades e milhares de milhares”, expressão que indica uma multidão imensa; alternativamente, “dezenas de milhares de dezenas de milhares e milhares de milhares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: olhei
  rationale: No contexto da progressão visionária, indica que João dirige a atenção para a cena antes de relatar o que ouviu. “Vi” também é uma tradução legítima e é registrada em nota.
- source_word: ἤκουσα
  choice: ouvi
  rationale: Equivalente narrativo direto e natural do aoristo de ἀκούω.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: a voz de muitos anjos
  rationale: Preserva o singular coletivo φωνή e identifica naturalmente os que produzem a voz, sem transformar o termo em “som”.
- source_word: κύκλῳ
  choice: ao redor
  rationale: Expressa de modo conciso e natural a disposição espacial dos anjos em torno do trono, dos seres viventes e dos anciãos.
- source_word: ζῴων
  choice: seres viventes
  rationale: Mantém a identidade distintiva dessas figuras visionárias no Apocalipse e evita a associação indevida com animais comuns.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Tradução corrente de πρεσβύτεροι nas cenas celestiais do Apocalipse.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: O número deles era de
  rationale: Formulação portuguesa natural que preserva a declaração explícita acerca do número.
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: miríades de miríades e milhares de milhares
  rationale: Conserva a repetição enfática e a grandiosidade da expressão grega sem a reduzir a um número exato nem explicá-la dentro do texto.
theological_decisions:
- issue: Designação dos seres da sala do trono (ζῷα)
  choice: seres viventes
  alternative: criaturas viventes; seres vivos
  rationale: “Seres viventes” distingue essas figuras apocalípticas de animais comuns sem definir além do que o texto afirma; a decisão é lexical, não uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sequência “olhei e ouvi” preserva a progressão da visão; a expressão numérica mantém deliberadamente o caráter elevado e repetitivo do original.
