id: REV.5.5
reference: Revelation 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: pt
  text: 'E um dos anciãos me diz: “Não chore. Veja: o Leão da tribo de Judá, a Raiz de Davi, venceu[a] para abrir o rolo e os seus sete selos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conquistou”. O verbo grego é um termo-chave em Apocalipse para vencer ou obter vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Em Apocalipse, o termo designa um grupo celestial reconhecido, não apenas homens de idade avançada.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente narrativo grego e sua vivacidade, de modo natural em português.
- source_word: Μὴ κλαῖε
  choice: Não chore
  rationale: Expressão corrente e solene para a proibição de continuar chorando, sem tornar explícita uma nuance aspectual discutível.
- source_word: ἰδοὺ
  choice: Veja
  rationale: Marcador de atenção natural no português atual, com força suficiente e sem arcaísmo excessivo.
- source_word: ἐνίκησεν
  choice: venceu
  rationale: Mantém o motivo central de vitória associado a νικάω em Apocalipse; a nota registra uma alternativa que ressalta mais a conquista.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: o Leão da tribo de Judá
  rationale: Forma portuguesa natural e tradicional que conserva a identificação messiânica e a relação de origem expressa por ἐκ.
- source_word: ἡ ῥίζα Δαυίδ
  choice: a Raiz de Davi
  rationale: Conserva diretamente o título messiânico e sua imagem veterotestamentária; a inicial maiúscula assinala seu uso titular no contexto.
- source_word: ἀνοῖξαι
  choice: para abrir
  rationale: Reproduz de maneira concisa a construção infinitiva, preservando a possível relação de propósito, resultado ou qualificação sem explicitar capacidade ou dignidade que não aparecem lexicalmente no versículo.
- source_word: τὸ βιβλίον
  choice: o rolo
  rationale: No cenário do texto, trata-se de um rolo escrito e selado, não de um livro em formato de códice.
- source_word: σφραγῖδας
  choice: selos
  rationale: Equivalente padrão e contextual para os dispositivos que mantêm fechado o rolo.
- source_word: αὐτοῦ
  choice: os seus
  rationale: O possessivo retoma naturalmente o rolo em português.
theological_decisions:
- issue: Títulos reais e messiânicos aplicados a Jesus
  choice: 'Manter diretamente os dois títulos: “o Leão da tribo de Judá, a Raiz de Davi”.'
  alternative: Substituir um ou ambos por paráfrases explicativas.
  rationale: A acumulação dos títulos é intencional e evoca as Escrituras de Israel; preservá-los mantém sua força cristológica sem acrescentar explicação doutrinária.
- issue: Força de ἀνοῖξαι depois de ἐνίκησεν
  choice: Traduzir concisamente como “venceu para abrir”.
  alternative: “venceu, de modo que pode abrir” ou “venceu e pode abrir”.
  rationale: A construção mantém a ligação entre a vitória e a abertura do rolo, mas não resolve além do necessário se o infinitivo expressa propósito, resultado ou qualificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente narrativo foi mantido. “Veja” evita o tom arcaizante de “Eis” sem perder a função de chamar a atenção; “rolo” esclarece o objeto antigo. A sintaxe “venceu para abrir” preserva a concisão e a ambiguidade legítima do infinitivo grego.
