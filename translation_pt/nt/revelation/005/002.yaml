source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: pt
  text: 'E vi um anjo poderoso proclamando em alta voz: “Quem é digno de abrir o rolo[a] e romper os seus selos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livro”. A palavra grega βιβλίον pode designar, de modo geral, um documento escrito, mas aqui “rolo” combina melhor com um objeto fechado com vários selos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: um anjo poderoso
  rationale: ἰσχυρός expressa força ou poder. “Poderoso” é natural em português e mantém a intensidade aplicada ao ser celestial.
- source_word: κηρύσσοντα
  choice: proclamando
  rationale: κηρύσσω descreve um anúncio público feito como por um arauto. “Proclamando” preserva o caráter solene e público da declaração.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: A expressão idiomática indica fala forte e audível. “Em alta voz” é corrente e digna em português.
- source_word: Τίς ἄξιος
  choice: Quem é digno
  rationale: ἄξιος indica dignidade ou aptidão para realizar uma tarefa solene. “Digno” preserva tanto o sentido direto quanto a relevância teológica do contexto.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: abrir o rolo
  rationale: βιβλίον pode designar um documento escrito; neste cenário, o objeto fechado com vários selos é mais naturalmente entendido como um rolo.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: romper os seus selos
  rationale: λύω significa soltar, desfazer ou liberar. Em relação a selos, “romper” comunica a ação concreta necessária para abrir o rolo sem reduzir a expressão a uma paráfrase.
theological_decisions:
- issue: Tradução de βιβλίον na visão da sala do trono
  choice: rolo
  alternative: livro
  rationale: O objeto escrito fechado com vários selos, no contexto material do primeiro século e da imagem apocalíptica, é mais naturalmente um rolo. Trata-se de uma decisão lexical e histórica, não doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a sequência narrativa do grego, emprega “em alta voz” como expressão idiomática natural e conserva a imagem concreta dos selos sendo rompidos.
