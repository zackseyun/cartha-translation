  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: pt
  text: "E eles cantam um cântico novo, dizendo:\n\n“Digno és de tomar o rolo\n e de abrir os seus selos,\npois foste imolado\n e, com o teu sangue,[a] compraste para Deus pessoas[b]\n de toda tribo, língua, povo e nação.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio do teu sangue”.
    reason: lexical_alternative
  - marker: b
    text: No grego, o objeto de “compraste” fica implícito; literalmente, “compraste para Deus, com o teu sangue, de toda tribo, língua, povo e nação”.
    reason: textual_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: cantam
  rationale: O presente do indicativo mantém a vivacidade da cena; não é necessário acrescentar “louvores”, ideia que o verbo sozinho não explicita.
- source_word: ᾠδὴν καινὴν
  choice: um cântico novo
  rationale: “Cântico” é natural neste contexto solene e preserva o motivo bíblico do cântico novo.
- source_word: Ἄξιος εἶ
  choice: Digno és
  rationale: A ordem marcada conserva o caráter de aclamação e continua clara em português, sem alterar o sentido para uma declaração indireta.
- source_word: τὸ βιβλίον
  choice: o rolo
  rationale: O referente é um documento antigo selado e enrolado; “rolo” comunica melhor o objeto concreto do que o moderno “livro”.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: abrir os seus selos
  rationale: Mantém a expressão condensada do grego. “Romper os selos” seria português mais habitual, mas explicitaria a ação de modo interpretativo.
- source_word: ἐσφάγης
  choice: foste morto
  rationale: Expressa de forma clara a morte violenta do Cordeiro. “Foste imolado” realçaria mais a associação sacrificial, mas é menos corrente e pode antecipar uma interpretação cultual do verbo.
- source_word: ἠγόρασας
  choice: compraste
  rationale: Preserva o sentido comercial básico do verbo. “Redimiste” seria teologicamente possível no contexto, mas é uma formulação mais interpretativa.
- source_word: τῷ θεῷ
  choice: para Deus
  rationale: O dativo indica naturalmente o beneficiário ou aquele a quem pertencem os comprados. “A Deus” seria possível, mas menos idiomático nesta construção em português.
- source_word: ἐν τῷ αἵματί σου
  choice: com o teu sangue
  rationale: Conserva a imagem concreta do sangue como meio ou preço da compra; a ambiguidade instrumental é indicada em nota.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: de toda tribo, língua, povo e nação
  rationale: Reproduz a fórmula quádrupla e seu alcance mundial, usando termos naturais no português atual.
theological_decisions:
- issue: O objeto direto de “compraste” não está expresso no texto grego apresentado
  choice: suprir “pessoas” no texto e registrar a elipse em nota
  alternative: 'deixar o objeto implícito: “compraste para Deus, de toda tribo...”'
  rationale: A sintaxe portuguesa requer normalmente um objeto neste contexto. “Pessoas” torna explícito apenas o referente humano indicado pela sequência “de toda tribo, língua, povo e nação”, sem restringi-lo a uma categoria doutrinária mais específica.
- issue: Linguagem expiatória de “com o teu sangue”
  choice: manter a referência concreta ao sangue sem ampliá-la em fórmula doutrinária
  alternative: parafrasear como “por tua morte”
  rationale: O versículo atribui expressamente a compra ao sangue do Cordeiro. A tradução preserva essa linguagem sacrificial e evita explicar além do que o texto afirma.
- issue: Nuance sacrificial de ἐσφάγης
  choice: traduzir por “foste morto”
  alternative: “foste imolado”
  rationale: “Morto” é claro e não elimina o contexto sacrificial fornecido pela identidade do Cordeiro e pela menção do sangue; “imolado” tornaria essa nuance mais explícita, porém com registro menos acessível.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Digno és” e “cântico” mantêm o tom litúrgico da aclamação; “rolo” esclarece o objeto antigo. A disposição em versos acompanha a forma de cântico sem acrescentar estrutura ao conteúdo.
