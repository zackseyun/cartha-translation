source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: pt
  text: E vi, na mão direita daquele que está sentado no trono, um rolo[a] escrito por dentro e no verso[b], selado com sete selos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livro”. Neste contexto, a palavra grega provavelmente se refere a um rolo, e não a um livro em formato de códice.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por dentro e por trás”. Algumas traduções expressam a segunda parte de modo mais geral como “por fora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω funciona como verbo narrativo simples; “vi” é direto e natural.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: na mão direita
  rationale: Embora ἐπί com o acusativo possa significar “sobre”, neste contexto a expressão indica de modo natural a localização do rolo na mão direita da figura entronizada.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: daquele que estava sentado no trono
  rationale: Mantém a descrição substantivada da figura sem acrescentar um nome ou explicitar sua identidade.
- source_word: βιβλίον
  choice: rolo
  rationale: No contexto do primeiro século e desta imagem, o objeto provavelmente é um rolo, não um livro em formato de códice; a alternativa tradicional é registrada em nota.
- source_word: γεγραμμένον
  choice: escrito
  rationale: O particípio perfeito passivo descreve o rolo em seu estado resultante; “escrito” comunica isso com naturalidade.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: por dentro e no verso
  rationale: ἔσωθεν indica a parte interior, e ὄπισθεν, neste contexto, a face posterior ou o verso do rolo. A formulação preserva a imagem física sem generalizá-la desnecessariamente como “por fora”.
- source_word: κατεσφραγισμένον
  choice: selado
  rationale: O particípio perfeito passivo indica um estado completo de selamento; “selado” é claro e não força uma tradução separada do valor intensivo do prefixo κατα-.
- source_word: σφραγῖσιν ἑπτά
  choice: com sete selos
  rationale: O dativo instrumental é expresso naturalmente em português por “com sete selos”.
theological_decisions:
- issue: Identidade da figura entronizada
  choice: daquele que estava sentado no trono
  alternative: de Deus, que estava sentado no trono
  rationale: O grego descreve a figura sem nomeá-la explicitamente. A tradução conserva a apresentação literária e evita inserir no texto uma identificação teológica que, embora contextual, não está lexicalmente expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Rolo”, “verso” e “selos” preservam a imagem concreta do texto sem linguagem excessivamente técnica.
