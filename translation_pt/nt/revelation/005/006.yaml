id: REV.5.6
reference: Revelation 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: pt
  text: E vi, no meio do trono e dos quatro seres viventes, e no meio dos anciãos, um Cordeiro em pé, como se tivesse sido morto[a]. Ele tinha sete chifres e sete olhos, os quais são os sete Espíritos de Deus[b], enviados para toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “como morto”; também se pode traduzir “como que abatido”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “os sete Espíritos de Deus” foi mantida como está escrita; alguns a entendem como uma forma simbólica de falar do Espírito Santo em sua plenitude sétupla.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: no meio de ... e no meio de
  rationale: Preserva a repetição espacial do grego e a disposição em camadas da cena visionária, sem reduzir as duas expressões a uma só.
- source_word: ζῴων
  choice: seres viventes
  rationale: Neste contexto, designa os seres da sala do trono, não animais comuns. A formulação é reconhecível, digna e distinta de outros seres chamados de bestas.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: O termo funciona aqui como título de um grupo celestial reconhecido, e não apenas como indicação de idade.
- source_word: ἀρνίον
  choice: Cordeiro
  rationale: Mantém a imagem sacrificial e messiânica sem forçar o valor diminutivo da forma grega. A inicial maiúscula sinaliza o uso titular no contexto de Apocalipse.
- source_word: ἑστηκὸς
  choice: em pé
  rationale: 'Expressa naturalmente em português o estado resultante indicado pelo particípio perfeito: o Cordeiro aparece vivo e de pé.'
- source_word: ὡς ἐσφαγμένον
  choice: como se tivesse sido morto
  rationale: Conserva a comparação ou aparência marcada por ὡς e o resultado duradouro de uma morte já ocorrida, mantendo o paradoxo do Cordeiro morto que está em pé.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: Ele tinha sete chifres e sete olhos
  rationale: Mantém literalmente os elementos da visão, mas converte o particípio em oração finita para produzir português atual e claro.
- source_word: οἵ εἰσιν
  choice: os quais são
  rationale: Mantém explícita a ligação da oração relativa com o antecedente mais próximo, os sete olhos, sem excluir por paráfrase outras discussões sintáticas.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: os sete Espíritos de Deus
  rationale: Reproduz a expressão grega sem substituí-la interpretativamente por 'o Espírito em sua plenitude'. A maiúscula indica a natureza divina e revelatória da designação, sem resolver sua interpretação.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: enviados por toda a terra
  rationale: Preserva o particípio passivo plural e apresenta de modo natural o alcance mundial do envio.
theological_decisions:
- issue: Referente de οἵ εἰσιν, 'os quais são os sete Espíritos de Deus'
  choice: A oração relativa identifica primariamente os sete olhos com os sete Espíritos de Deus.
  alternative: Entender a oração de maneira mais ampla como referência conjunta aos chifres e aos olhos.
  rationale: Os 'sete olhos' são o antecedente imediato e fornecem a ligação mais coerente com a imagem profética evocada. A tradução conserva essa ligação gramatical sem acrescentar uma explicação doutrinária ao texto.
- issue: Identidade dos 'sete Espíritos de Deus'
  choice: Manter literalmente a expressão plural 'os sete Espíritos de Deus'.
  alternative: Parafrasear como 'o Espírito de Deus em sua plenitude' ou 'o Espírito sétuplo de Deus'.
  rationale: A expressão é teologicamente densa e sua interpretação é debatida. Preservar o plural do texto evita resolver silenciosamente a tensão e não exclui uma possível referência simbólica ao Espírito Santo em plenitude.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a repetição solene de “no meio” e o vocabulário visionário tradicional, enquanto a construção participial de ἔχων é vertida como oração finita para maior naturalidade. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
