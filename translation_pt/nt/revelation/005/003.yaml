id: REV.5.3
reference: Revelation 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: pt
  text: E ninguém, nem no céu, nem sobre a terra, nem debaixo da terra, podia abrir o rolo nem olhar para ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o livro”. A palavra grega pode designar, de modo geral, um documento escrito, mas neste cenário “rolo” corresponde melhor à imagem antiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente português direto e natural do pronome indefinido negativo, apropriado ao tom solene.
- source_word: ἐδύνατο
  choice: podia
  rationale: O imperfeito de δύναμαι indica capacidade negada no quadro narrativo; “podia” é natural e preserva o aspecto verbal.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Forma idiomática em português, mantendo o singular e a localização celeste.
- source_word: οὐδὲ ἐπὶ τῆς γῆς οὐδὲ ὑποκάτω τῆς γῆς
  choice: nem sobre a terra, nem debaixo da terra
  rationale: Preserva a tríade espacial cósmica e a repetição negativa do grego; “sobre a terra” distingue claramente este domínio de “debaixo da terra”.
- source_word: ἀνοῖξαι
  choice: abrir
  rationale: Infinitivo simples e direto, dependente de “podia”, sem expansão interpretativa.
- source_word: τὸ βιβλίον
  choice: o rolo
  rationale: No cenário visionário de Apocalipse, refere-se mais naturalmente a um rolo escrito do que a um livro em formato de códice.
- source_word: οὔτε βλέπειν αὐτό
  choice: nem olhar para ele
  rationale: Mantém a coordenação negativa de οὔτε e traduz βλέπειν de modo natural, sem acrescentar o intensificador “sequer”, que não está explicitamente expresso.
theological_decisions:
- issue: Alcance cósmico dos seres incapazes de abrir o rolo
  choice: 'Manter literalmente a linguagem em três níveis: “no céu, sobre a terra, debaixo da terra”.'
  alternative: Generalizar como “em lugar algum da criação”.
  rationale: A tríade enfatiza a incapacidade universal e preserva a textura apocalíptica, sem reduzir a imagem a uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “nem” conserva a estrutura enfática do original sem soar artificial. O marcador [a] aparece no texto principal.
