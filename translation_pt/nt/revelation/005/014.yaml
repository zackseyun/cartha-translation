source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: pt
  text: 'E os quatro seres viventes diziam: “Amém.” E os anciãos caíram por terra e adoraram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos acrescentam, depois de “adoraram”, um objeto explícito, como “aquele que vive para todo o sempre” ou “a ele”. O texto principal segue a leitura mais curta do SBLGNT, que deixa o objeto implícito no contexto.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: seres viventes
  rationale: Em Apocalipse, o termo designa os seres celestiais ao redor do trono, em alusão à visão de Ezequiel; “seres viventes” evita a ideia de simples animais e mantém essa conexão.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego apresenta a aclamação como ação em curso ou repetida; o imperfeito português preserva naturalmente esse aspecto.
- source_word: Ἀμήν
  choice: Amém
  rationale: A transliteração tradicional preserva a fórmula litúrgica reconhecível e seu sentido de confirmação solene.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: No contexto de Apocalipse, o termo identifica o grupo celestial conhecido como os anciãos, não apenas homens de idade avançada.
- source_word: ἔπεσαν
  choice: caíram por terra
  rationale: A expressão comunica com clareza o gesto corporal de prostração no contexto de adoração, sem confundi-lo com uma queda acidental.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: No cenário celestial diante do trono, o verbo expressa reverência cultual; “adoraram” transmite sua força religiosa sem acrescentar um objeto não expresso.
theological_decisions:
- issue: Objeto da adoração deixado implícito
  choice: Manter “adoraram” sem objeto explícito.
  alternative: “o adoraram”, “adoraram a Deus” ou “adoraram aquele que vive para todo o sempre”
  rationale: O texto do SBLGNT termina com προσεκύνησαν sem declarar o objeto. O português permite preservar esse uso absoluto; acrescentar um objeto adotaria linguagem de outras tradições manuscritas ou resolveria pelo contexto algo que o texto grego deixa implícito.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla compreensão no Brasil e em outros contextos lusófonos. “Seres viventes” mantém a linguagem característica das visões do trono; “caíram por terra” explicita de modo idiomático a postura de prostração, e a coordenação simples preserva o ritmo solene do grego.
