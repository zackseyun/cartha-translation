id: REV.5.13
reference: Revelation 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: pt
  text: 'E ouvi toda criatura[a] que há no céu, na terra, debaixo da terra e no mar, e tudo o que há neles, dizer: “Àquele que está sentado no trono e ao Cordeiro sejam a bênção, a honra, a glória e o domínio para todo o sempre.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda coisa criada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pelos séculos dos séculos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: toda criatura
  rationale: κτίσμα designa um ser ou uma coisa criada. Neste cenário de louvor universal e audível, “toda criatura” é natural em português e conserva a força distributiva de πᾶν.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: que há no céu, na terra, debaixo da terra e no mar, e tudo o que há neles
  rationale: A enumeração abrange todos os âmbitos da criação. “Tudo o que há neles” mantém a referência coletiva aos âmbitos mencionados e o alcance universal da expressão.
- source_word: ἤκουσα λέγοντας
  choice: ouvi ... dizer
  rationale: O infinitivo depois de “ouvi” é idiomático em português. Embora λέγοντας esteja no plural por concordância semântica com o coletivo, “toda criatura ... dizer” preserva naturalmente o sentido.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Àquele que está sentado no trono
  rationale: A expressão substantivada identifica o ocupante do trono. A formulação é atual, reverente e mantém o aspecto presente do particípio.
- source_word: τῷ ἀρνίῳ
  choice: ao Cordeiro
  rationale: “Cordeiro” preserva o título cristológico estabelecido em Apocalipse e sua imagem sacrificial e régia.
- source_word: ἡ εὐλογία
  choice: a bênção
  rationale: No contexto doxológico, εὐλογία é uma bênção atribuída em louvor; “bênção” é transparente e mantém a formulação nominal do grego.
- source_word: ἡ τιμή
  choice: a honra
  rationale: “Honra” expressa adequadamente a estima tributada em contexto de adoração.
- source_word: ἡ δόξα
  choice: a glória
  rationale: “Glória” é a equivalência consagrada e semanticamente apropriada em uma aclamação de culto.
- source_word: τὸ κράτος
  choice: o domínio
  rationale: κράτος indica força efetiva ou poder soberano. “Domínio” se ajusta ao contexto régio e distingue o termo de uma referência genérica a poder.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: A expressão idiomática comunica duração sem fim. “Para todo o sempre” é clara e natural, enquanto a forma literal é registrada em nota.
theological_decisions:
- issue: Doxologia conjunta dirigida a Deus e ao Cordeiro
  choice: Manter uma única aclamação dirigida “Àquele que está sentado no trono e ao Cordeiro”.
  alternative: Explicitar ou repetir separadamente a atribuição para cada destinatário.
  rationale: O grego apresenta uma só atribuição doxológica aos dois destinatários, sem explicação adicional. A tradução preserva o paralelismo e a tensão cristológica do texto.
- issue: Referente de κτίσμα na cena de louvor cósmico
  choice: Traduzir como “toda criatura”.
  alternative: “Toda a criação” ou “toda coisa criada”.
  rationale: A cena retrata os habitantes de todos os âmbitos pronunciando louvor. “Toda criatura” conserva tanto o caráter pessoal e vocal quanto a abrangência universal.
- issue: Verbo subentendido na aclamação nominal
  choice: Suprir “sejam” para formar uma doxologia natural em português.
  alternative: 'Manter apenas a sequência nominal: “a bênção, a honra...”'
  rationale: O grego omite a cópula, como é comum em aclamações. “Sejam” torna a construção clara em português sem determinar além do texto a natureza da atribuição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem cósmica e a estrutura solene da doxologia foram preservadas sem arcaísmos desnecessários. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
