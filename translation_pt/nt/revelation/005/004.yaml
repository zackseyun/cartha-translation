id: REV.5.4
reference: Revelation 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: pt
  text: E eu chorava muito, porque ninguém foi encontrado digno de abrir o rolo nem de olhar para ele.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livro”. A palavra grega pode designar ambos, mas, neste contexto, “rolo” corresponde melhor à forma antiga do documento e à imagem de abri-lo.
    reason: lexical_alternative
  - marker: b
    text: Ou “examinar seu conteúdo”. A expressão pode significar simplesmente olhar para o rolo, embora o contexto também possa sugerir olhar para seu conteúdo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: E eu
  rationale: Preserva a ligação narrativa de καί e o pronome explícito ἐγώ, sem acrescentar uma ênfase excessiva.
- source_word: ἔκλαιον
  choice: chorava
  rationale: O imperfeito indica ação contínua no passado; em português, o pretérito imperfeito expressa isso de maneira natural.
- source_word: πολὺ
  choice: muito
  rationale: O acusativo adverbial intensifica o choro sem especificar que fosse alto ou amargo.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto e natural para a ausência de qualquer pessoa que satisfizesse a condição.
- source_word: ἄξιος
  choice: digno
  rationale: Mantém o peso moral e de condição ou status próprio do termo no contexto celestial, melhor que alternativas como 'apto' ou 'qualificado'.
- source_word: εὑρέθη
  choice: foi considerado
  rationale: Expressa idiomaticamente o resultado da avaliação ou busca implícita no passivo de εὑρίσκω, sem identificar o agente; a alternativa mais formal é 'foi achado'.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: abrir o rolo
  rationale: ἀνοῖξαι significa 'abrir'; no cenário antigo e na imagem de Apocalipse 5, βιβλίον designa mais naturalmente um rolo, embora também possa ser traduzido por 'livro'.
- source_word: οὔτε βλέπειν αὐτό
  choice: nem de olhar para ele
  rationale: Preserva a coordenação negativa e o sentido lexical direto de βλέπειν αὐτό, sem resolver além do texto se está em vista apenas contemplar o rolo ou examinar seu conteúdo.
theological_decisions:
- issue: Natureza de ἄξιος na cena da sala do trono
  choice: digno
  alternative: apto; qualificado
  rationale: 'O contexto envolve mais que capacidade funcional: trata-se de dignidade para executar o propósito divino associado ao rolo. ''Digno'' mantém essa gravidade sem ampliar o texto.'
- issue: Forma física indicada por βιβλίον
  choice: rolo
  alternative: livro
  rationale: A imagem antiga de um documento que deve ser aberto favorece 'rolo'; a nota conserva a amplitude lexical do termo.
- issue: Alcance de βλέπειν αὐτό
  choice: olhar para ele
  alternative: examinar seu conteúdo; olhar dentro dele
  rationale: O grego admite o sentido simples de ver ou olhar. O contexto pode sugerir acesso ao conteúdo, mas a tradução principal preserva a formulação menos interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pretérito imperfeito 'chorava' preserva a ação contínua; 'muito' evita acrescentar nuances como chorar alto ou amargamente. As notas mantêm abertas as ambiguidades legítimas de βιβλίον e βλέπειν.
