id: REV.7.15
reference: Revelation 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: pt
  text: Por isso, eles estão diante do trono de Deus e lhe prestam culto dia e noite no seu santuário. E aquele que está sentado no trono estenderá sua tenda sobre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “habitará sobre eles” ou “os abrigará”. O verbo grego está ligado à imagem de uma tenda ou do tabernáculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Por isso
  rationale: Retoma de modo natural, claro e causal a explicação anterior, preservando a ligação inferencial explícita.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa de forma concisa tanto a posição perante o trono quanto a presença diante de Deus.
- source_word: λατρεύουσιν
  choice: prestam culto
  rationale: No contexto do santuário, comunica o serviço sagrado dirigido a Deus sem restringi-lo apenas a louvor verbal.
- source_word: ἡμέρας καὶ νυκτός
  choice: dia e noite
  rationale: Mantém a expressão concreta e inteligível que sugere serviço incessante.
- source_word: ναῷ
  choice: santuário
  rationale: ναός designa mais precisamente o santuário, e não todo o complexo do templo; a escolha é natural em português e adequada ao cenário celestial.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: aquele que está sentado no trono
  rationale: Preserva a força de título da expressão participial em linguagem portuguesa atual e digna.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: estenderá sua tenda sobre eles
  rationale: Conserva a imagem de tenda ou tabernáculo e a noção de presença protetora associada a ἐπί, sem reduzir a metáfora a uma explicação abstrata.
theological_decisions:
- issue: Sentido de σκηνώσει na imagem da presença divina
  choice: estenderá sua tenda sobre eles
  alternative: habitará sobre eles; os abrigará
  rationale: A formulação preserva simultaneamente a imagem do tabernáculo, a presença divina e sua dimensão protetora, sem impor uma interpretação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Prestar culto” explicita o caráter sagrado de λατρεύω; “santuário” preserva a precisão de ναός. A metáfora final foi mantida no texto e esclarecida em nota.
