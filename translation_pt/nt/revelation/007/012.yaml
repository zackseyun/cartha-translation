  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: pt
  text: 'dizendo: “Amém! A bênção, a glória, a sabedoria, a ação de graças, a honra, o poder e a força sejam ao nosso Deus[b] para todo o sempre.[a] Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para os séculos dos séculos”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego não traz verbo nesta frase; literalmente, a lista de aclamações é seguida por “ao nosso Deus”. Também se pode entender: “pertencem ao nosso Deus”.'
    reason: translation_clarity
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz diretamente o conteúdo da aclamação; “dizendo” conserva de modo natural e conciso essa ligação com o contexto anterior.
- source_word: Ἀμήν / ἀμήν
  choice: Amém
  rationale: Em contexto litúrgico e doxológico, a transliteração tradicional “Amém” é mais adequada que “Verdadeiramente”; a repetição emoldura a aclamação.
- source_word: ἡ εὐλογία
  choice: a bênção
  rationale: Conserva o substantivo e o artigo da enumeração solene, sem reduzi-lo a “louvor”, embora esse sentido possa estar implicado na atribuição dirigida a Deus.
- source_word: ἡ δόξα
  choice: a glória
  rationale: Equivalente corrente e apropriado em linguagem doxológica; mantém o artigo e o ritmo da série.
- source_word: ἡ σοφία
  choice: a sabedoria
  rationale: Preserva o substantivo abstrato e a estrutura articulada da enumeração grega.
- source_word: ἡ εὐχαριστία
  choice: a ação de graças
  rationale: Expressão portuguesa natural para o ato ou conteúdo de agradecer, mantendo a forma substantiva e o tom de culto.
- source_word: ἡ τιμή
  choice: a honra
  rationale: Neste contexto, designa a honra atribuída a Deus, não valor ou preço.
- source_word: ἡ δύναμις
  choice: o poder
  rationale: É o equivalente português mais direto para capacidade ou poder e permite distingui-lo do termo seguinte.
- source_word: ἡ ἰσχύς
  choice: a força
  rationale: Mantém a acumulação de termos próximos sem fundi-lo com δύναμις; “força” é atual, clara e digna em português.
- source_word: τῷ θεῷ ἡμῶν
  choice: ao nosso Deus
  rationale: Preserva o dativo de destinatário ou atribuição. A forma “sejam ao nosso Deus” mantém o caráter doxológico sem transformar explicitamente a construção em posse.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: É uma expressão portuguesa idiomática para duração ilimitada e reproduz o tom solene da fórmula grega.
theological_decisions:
- issue: Suprimento do verbo na doxologia nominal
  choice: sejam ao nosso Deus
  alternative: pertencem ao nosso Deus; sejam dados ao nosso Deus
  rationale: O grego não contém verbo depois da lista de substantivos. “Sejam ao nosso Deus” supre apenas o necessário para a sintaxe portuguesa e conserva a força de atribuição cultual; “pertencem” enfatizaria posse, e “sejam dados” introduziria de modo mais explícito a ideia de oferta.
- issue: Distinção entre δύναμις e ἰσχύς
  choice: o poder e a força
  alternative: o poder e o vigor; a força e o poder
  rationale: A sequência grega reúne quase sinônimos para intensificar o louvor. Dois termos portugueses distintos preservam essa plenitude retórica sem impor uma separação técnica entre os conceitos.
- issue: Sentido de εὐλογία na aclamação dirigida a Deus
  choice: a bênção
  alternative: o louvor
  rationale: “Bênção” preserva a correspondência lexical e a tensão bíblica de uma bênção atribuída a Deus; “louvor” explicitaria uma nuance contextual, mas estreitaria o campo semântico.
translation_notes:
  register: Português moderno, claro e solene, com cadência litúrgica. Os artigos foram repetidos para conservar a enumeração enfática do grego. “Ação de graças” é amplamente compreensível no português internacional e natural para leitores brasileiros. A formulação preserva a ausência de verbo no original por meio de um suprimento mínimo, documentado em nota.
