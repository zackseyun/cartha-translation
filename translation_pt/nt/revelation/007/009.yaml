id: REV.7.9
reference: Revelation 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: pt
  text: Depois destas coisas, olhei, e eis uma grande multidão que ninguém podia contar, de toda nação, tribos, povos e línguas[a], em pé diante do trono e diante do Cordeiro, vestidos de vestes brancas, com ramos de palmeira nas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluente: “de toda nação, tribo, povo e língua”. O texto principal preserva a mudança do grego do singular “nação” para os termos seguintes no plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois destas coisas
  rationale: Preserva o plural ταῦτα e a sequência característica das visões de Apocalipse, em português claro e solene.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: olhei, e eis
  rationale: “Olhei” funciona naturalmente na introdução da cena visionária, enquanto “e eis” conserva ἰδού como marcador enfático de atenção.
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: Expressa uma assembleia numerosa e mantém o registro elevado adequado ao contexto apocalíptico.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: que ninguém podia contar
  rationale: Tradução idiomática que preserva a incapacidade expressa por οὐδεὶς ἐδύνατο, sem reproduzir a construção grega redundante de modo artificial.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: de toda nação, tribos, povos e línguas
  rationale: Mantém a mudança do singular ἔθνους para os plurais φυλῶν, λαῶν e γλωσσῶν. Uma nota oferece a formulação distributiva mais fluente em português.
- source_word: ἑστῶτες
  choice: em pé
  rationale: Comunica de modo natural o estado indicado pelo particípio, concordando pelo sentido com a multidão composta de pessoas.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: diante do trono e diante do Cordeiro
  rationale: A repetição de “diante” reflete a repetição de ἐνώπιον e preserva a cadência solene.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: vestida com túnicas brancas
  rationale: “Vestida com” traduz naturalmente o particípio; “túnicas” comunica vestes longas sem usar o potencialmente ambíguo “roupões”.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: com ramos de palmeira nas mãos
  rationale: No contexto, φοίνικες designa ramos de palmeira. A formulação preserva a imagem sem acrescentar uma ação não expressa.
theological_decisions:
- issue: Tradução de ἀρνίον como título cristológico
  choice: o Cordeiro
  alternative: o cordeirinho
  rationale: Em Apocalipse, ἀρνίον funciona como título cristológico estabelecido. “O Cordeiro” conserva seu reconhecimento e peso teológico sem impor em português um diminutivo inadequado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a fórmula visionária “e eis”, a repetição solene de “diante” e a irregularidade numérica da enumeração grega, explicada em nota.
