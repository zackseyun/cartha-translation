  source_fidelity: A tradução transmite adequadamente a sequência visionária, a multidão incontável, a enumeração das origens, a posição diante do trono e do Cordeiro e os ramos de palmeira. Contudo, os particípios gregos ἑστῶτες e περιβεβλημένους estão no plural e descrevem os integrantes da multidão; «vestida», no singular, perde essa concordância semântica.
