  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: pt
  text: da tribo de Simeão[a], doze mil; da tribo de Levi, doze mil; da tribo de Issacar, doze mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre a tribo de Simeão... dentre a tribo de Levi... dentre a tribo de Issacar”.'
    reason: Alternativa lexical que explicita o possível valor partitivo de ἐκ.
lexical_decisions:
- source_word: ἐκ
  choice: da
  rationale: A contração de “de” + “a” expressa naturalmente origem ou procedência em português e conserva a fórmula repetida do grego.
- source_word: φυλῆς
  choice: tribo
  rationale: Neste contexto genealógico israelita, φυλή designa uma divisão tribal; “tribo” é o equivalente corrente e preciso.
- source_word: Συμεὼν
  choice: Simeão
  rationale: Forma consagrada em português para o nome pessoal e tribal.
- source_word: δώδεκα χιλιάδες
  choice: doze mil
  rationale: A expressão numérica é escrita por extenso para manter a fluidez literária e reproduzir diretamente a quantidade indicada no texto.
- source_word: Λευὶ
  choice: Levi
  rationale: Forma consagrada em português. A inclusão de Levi é mantida sem explicação interpretativa, pois está explícita no grego.
- source_word: Ἰσσαχὰρ
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
theological_decisions:
- issue: Sintaxe repetitiva da lista tribal
  choice: Manter, para cada tribo, a fórmula repetida “da tribo de..., doze mil”.
  alternative: Condensar como “das tribos de Simeão, Levi e Issacar, doze mil de cada uma”.
  rationale: O grego repete a fórmula em cada item. Essa cadência integra a enumeração apocalíptica e não deve ser apagada por condensação.
- issue: Inclusão de Levi na enumeração tribal
  choice: Traduzir “Levi” sem explicação adicional no texto principal.
  alternative: Acrescentar uma explicação sobre a inclusão incomum de Levi.
  rationale: O versículo simplesmente inclui Levi na lista; explicar essa inclusão no corpo do texto introduziria interpretação não expressa pela fonte.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de uso bíblico consolidado. A repetição e a pontuação preservam o ritmo solene da lista.
