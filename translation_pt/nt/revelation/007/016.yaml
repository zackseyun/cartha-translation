base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: pt
  text: Nunca mais terão fome, nem terão sede; o sol jamais os atingirá, nem calor escaldante algum os atingirá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nem o sol cairá sobre eles, nem calor escaldante algum». O grego emprega aqui uma negação enfática (οὐδὲ μὴ πέσῃ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσουσιν
  choice: terão fome
  rationale: O futuro de πεινάω é expresso de modo natural em português por «terão fome», mantendo a declaração concreta e a correspondência com «terão sede».
- source_word: ἔτι
  choice: nunca mais
  rationale: Sob negação, ἔτι indica que a condição não voltará a ocorrer. «Nunca mais» comunica com clareza essa cessação definitiva e pode reger naturalmente os dois primeiros verbos.
- source_word: οὐδὲ
  choice: nem
  rationale: «Nem» coordena de forma natural as negações cumulativas do versículo.
- source_word: διψήσουσιν
  choice: terão sede
  rationale: O futuro de διψάω é traduzido pela expressão portuguesa corrente «terão sede», em paralelo com «terão fome».
- source_word: οὐδὲ μὴ πέσῃ
  choice: jamais os atingirá
  rationale: A construção οὐδὲ μή com o subjuntivo aoristo expressa uma negação futura enfática. «Jamais» preserva essa força, enquanto «atingirá» comunica idiomaticamente o efeito do sol sobre as pessoas; a imagem mais formal de «cair sobre» é registrada em nota.
- source_word: ἐπ’ αὐτούς
  choice: os
  rationale: O pronome objeto em «os atingirá» expressa com naturalidade em português as pessoas sobre as quais o sol não incidirá de modo nocivo.
- source_word: ὁ ἥλιος
  choice: o sol
  rationale: Correspondência lexical direta e natural.
- source_word: πᾶν καῦμα
  choice: calor escaldante algum
  rationale: καῦμα designa calor ardente ou abrasador; «escaldante» preserva essa intensidade. Em contexto negativo, πᾶν é naturalmente expresso por «algum» após o substantivo.
theological_decisions:
- issue: Alusão a Isaías 49:10 e linguagem de restauração escatológica
  choice: Manter as imagens concretas de fome, sede, sol e calor escaldante como promessa de restauração.
  alternative: Interpretar fome e sede principalmente como metáforas de anseio espiritual.
  rationale: O contexto oferece consolo escatológico e ecoa a linguagem profética de restauração. A tradução conserva as imagens do texto sem impor uma leitura exclusivamente literal ou exclusivamente metafórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. «Nunca mais» foi colocado no início para abranger com fluidez fome e sede; «jamais» marca a negação especialmente enfática da oração seguinte. A elipse em «nem calor escaldante algum» preserva a concisão e o paralelismo do grego.
