  terminology: «Anciãos», «seres viventes» e «adoraram a Deus» são escolhas adequadas e consistentes. A nota alternativa deve evitar justificar «criaturas» por uma afirmação interpretativa sobre serem criados; basta apresentá-la como alternativa lexical.
