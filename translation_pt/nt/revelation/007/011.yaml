id: REV.7.11
reference: Revelation 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: pt
  text: E todos os anjos estavam de pé ao redor do trono, dos anciãos e dos quatro seres viventes[a], e caíram diante do trono, com o rosto em terra, e adoraram a Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quatro criaturas viventes”.
    reason: Alternativa lexical para ζῴων.
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: todos os anjos
  rationale: Tradução direta e natural do plural articular com πάντες; “anjos” é o equivalente corrente de ἄγγελοι no Apocalipse.
- source_word: εἱστήκεισαν
  choice: estavam de pé
  rationale: O mais-que-perfeito com valor estativo descreve a posição em que se encontravam, e não simplesmente o ato de se levantar.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: ao redor do trono, dos anciãos e dos quatro seres viventes
  rationale: κύκλῳ com genitivos coordenados indica que os anjos circundavam o conjunto mencionado. A formulação preserva essa relação espacial sem explicitação interpretativa.
- source_word: τῶν πρεσβυτέρων
  choice: dos anciãos
  rationale: “Anciãos” é a designação estabelecida e contextualmente adequada para esse grupo celestial no Apocalipse.
- source_word: τῶν τεσσάρων ζῴων
  choice: dos quatro seres viventes
  rationale: ζῷα designa aqui os seres animados da sala do trono, não meros animais. “Seres viventes” evita uma conotação zoológica inadequada e preserva a imagem apocalíptica.
- source_word: ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: se prostraram com o rosto em terra
  rationale: A expressão grega descreve uma queda deliberada em prostração. Esta formulação idiomática em português comunica claramente tanto o movimento quanto a postura.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: diante do trono
  rationale: Equivalente espacial natural e digno para ἐνώπιον neste contexto.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: adoraram a Deus
  rationale: Como Deus é o objeto explícito e a prostração física já foi descrita, προσκυνέω expressa aqui adoração, não apenas reverência corporal.
theological_decisions:
- issue: Designação dos seres celestiais ζῷα
  choice: seres viventes
  alternative: criaturas viventes; seres vivos
  rationale: A escolha preserva a identidade não especificada desses seres da visão e evita reduzi-los a animais ou identificá-los por meio de uma interpretação teológica externa.
- issue: Sentido de προσκυνέω quando dirigido a Deus
  choice: adoraram a Deus
  alternative: curvaram-se diante de Deus
  rationale: A prostração já aparece na oração anterior; aqui o verbo indica o significado religioso do ato, dirigido explicitamente a Deus.
- issue: Relação espacial de κύκλῳ com os três genitivos coordenados
  choice: os anjos estavam ao redor do trono, dos anciãos e dos quatro seres viventes
  alternative: os anjos estavam ao redor do trono, juntamente com os anciãos e os quatro seres viventes
  rationale: A sintaxe grega coordena o trono, os anciãos e os quatro seres viventes como complementos de κύκλῳ. A alternativa mudaria os anciãos e os seres viventes para o grupo que circunda o trono.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Estavam de pé” conserva o aspecto estativo; “se prostraram com o rosto em terra” verte naturalmente o gesto completo. Mantém-se a vírgula final por o versículo continuar sintaticamente no seguinte.
