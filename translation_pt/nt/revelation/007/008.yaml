  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: pt
  text: da tribo de Zebulom, doze mil; da tribo de José, doze mil; da tribo de Benjamim, doze mil, tendo sido selados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “selados” ou “os quais foram selados”. O particípio grego no fim resume os grupos enumerados.
    reason: alternativa lexical e esclarecimento sintático
lexical_decisions:
- source_word: ἐκ
  choice: da
  rationale: A contração de “de” com o artigo expressa naturalmente origem ou procedência e preserva a fórmula repetida da lista.
- source_word: φυλῆς
  choice: tribo
  rationale: No contexto genealógico de Israel, designa uma divisão tribal; “tribo” é o equivalente corrente e preciso em português.
- source_word: Ζαβουλών
  choice: Zebulom
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: δώδεκα χιλιάδες
  choice: doze mil
  rationale: Tradução numérica direta que mantém a contagem e a estrutura formal do grego.
- source_word: Ἰωσήφ
  choice: José
  rationale: Preserva exatamente o nome presente no texto, sem substituí-lo por Efraim ou Manassés com base em harmonizações genealógicas.
- source_word: Βενιαμίν
  choice: Benjamim
  rationale: Emprega-se a forma convencional do nome bíblico em português.
- source_word: ἐσφραγισμένοι
  choice: tendo sido selados
  rationale: O particípio perfeito passivo indica uma ação recebida cujos efeitos permanecem. A formulação mantém a voz passiva e funciona como resumo dos grupos enumerados.
theological_decisions:
- issue: Referente e força do particípio final ἐσφραγισμένοι
  choice: Manter no fim da enumeração a expressão “tendo sido selados”, aplicável aos três grupos mencionados.
  alternative: Traduzir de modo mais conciso como “selados” ou mais explícito como “os quais haviam sido selados”.
  rationale: A posição final conserva o efeito resumidor do grego e evita definir além do texto a natureza ou o significado teológico do selo.
translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos convencionais e paralelismo preservado. A estrutura fragmentária da enumeração foi mantida por se tratar da continuação direta do versículo anterior.
