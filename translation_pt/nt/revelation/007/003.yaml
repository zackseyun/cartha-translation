source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the slaves of our God on their foreheads.”
translation:
  language: pt
  text: 'dizendo: “Não causem dano à terra, nem ao mar, nem às árvores, até que tenhamos selado os escravos[a] do nosso Deus na testa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega pode designar pessoas que pertencem a um senhor; “escravos” preserva aqui essa ideia de pertencimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio que introduz diretamente a fala, de modo natural em português narrativo.
- source_word: ἀδικήσητε
  choice: causem dano
  rationale: Com terra, mar e árvores como objetos, o verbo indica dano físico, não injustiça moral; a locução é clara e abrangente.
- source_word: γῆν
  choice: terra
  rationale: Na tríade cósmica com mar e árvores, “terra” comunica melhor o alcance da cena do que “solo” ou “região”.
- source_word: θάλασσαν
  choice: mar
  rationale: Equivalente direto e natural no contexto.
- source_word: δένδρα
  choice: árvores
  rationale: Equivalente direto e corrente para o plural.
- source_word: ἄχρι
  choice: até que
  rationale: Marca o limite temporal da proibição e introduz a ação que deve ocorrer antes do dano.
- source_word: σφραγίσωμεν
  choice: tenhamos selado
  rationale: O pretérito perfeito composto do subjuntivo após “até que” expressa naturalmente a conclusão da ação requerida.
- source_word: δούλους
  choice: escravos
  rationale: Preserva a ideia de pessoas pertencentes a um senhor, especialmente relevante aqui, onde o selo assinala pertencimento e lealdade; uma alternativa mais branda é registrada em nota.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: do nosso Deus
  rationale: Reproduz a relação de pertencimento e conserva o pronome inclusivo do texto grego.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: na testa
  rationale: É a formulação idiomática em português para o lugar onde o selo é posto; o singular distributivo evita a rigidez de “nas testas deles” sem alterar o sentido.
theological_decisions:
- issue: Tradução de δοῦλος no contexto apocalíptico de pertencimento
  choice: escravos
  alternative: servos
  rationale: O selo identifica essas pessoas como pertencentes a Deus, tornando saliente a força de sujeição e pertencimento de δοῦλος. “Servos” é mais tradicional e menos áspero, mas pode atenuar essa força; por isso aparece como alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “nem... nem...” reproduz com naturalidade a proibição aplicada aos três elementos. O marcador [a] aparece imediatamente após o termo a que se refere.
