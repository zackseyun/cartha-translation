id: REV.7.6
reference: Revelation 7:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: pt
  text: da tribo de Aser[a], doze mil; da tribo de Naftali, doze mil; da tribo de Manassés, doze mil;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido dado pelo contexto: «da tribo de Aser, doze mil foram selados» (e da mesma forma quanto às tribos seguintes). O grego deste versículo não repete o verbo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: da
  rationale: A preposição indica origem ou procedência. Na fórmula desta lista, a contração portuguesa «da» expressa naturalmente «de + a», isto é, pessoas provenientes de cada tribo.
- source_word: φυλῆς
  choice: tribo
  rationale: Neste contexto genealógico israelita, φυλή designa uma divisão tribal de Israel; «tribo» é o equivalente português corrente e preciso.
- source_word: Ἀσὴρ
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio da tribo.
- source_word: δώδεκα χιλιάδες
  choice: doze mil
  rationale: O numeral e o substantivo plural indicam diretamente a quantidade. Não se acrescenta no texto principal «foram selados», pois o verbo não aparece no grego deste versículo e é recuperado do contexto.
- source_word: Νεφθαλὶμ
  choice: Naftali
  rationale: Forma portuguesa moderna e reconhecível do nome tribal, próxima da forma grega e do nome hebraico subjacente.
- source_word: Μανασσῆ
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio da tribo.
theological_decisions:
- issue: Acrescentar ou não um verbo implícito como «foram selados» a partir do contexto anterior
  choice: Não acrescentar o verbo no texto principal; conservar a enumeração sem verbo explícito.
  alternative: «da tribo de Aser, doze mil foram selados; da tribo de Naftali, doze mil; da tribo de Manassés, doze mil»
  rationale: O contexto anterior estabelece a ideia do selamento, mas o grego deste versículo contém apenas expressões preposicionais repetidas e os números. A forma concisa preserva a estrutura do texto-fonte sem impedir que o leitor recupere o verbo pelo contexto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas onomásticas correntes no uso bíblico em português. A pontuação mantém o ritmo enumerativo do original; a inicial minúscula reflete a continuação sintática da lista iniciada no versículo anterior.
