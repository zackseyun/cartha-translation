id: REV.7.1
reference: Revelation 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: pt
  text: Depois disso, vi quatro anjos em pé nos quatro cantos da terra[a], segurando os quatro ventos da terra, para que nenhum vento soprasse sobre a terra, nem sobre o mar, nem sobre árvore alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os quatro cantos da terra” é uma expressão convencional para os extremos da terra ou as quatro direções.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Depois disso
  rationale: Expressa com naturalidade em português a sequência da visão; a forma grega mais literal seria “Depois destas coisas”.
- source_word: εἶδον
  choice: vi
  rationale: Traduz diretamente o aoristo de ὁράω como percepção visionária, sem acrescentar a ideia de que João primeiro olhou.
- source_word: τέσσαρας ἀγγέλους ἑστῶτας
  choice: quatro anjos em pé
  rationale: Preserva tanto o numeral e o substantivo quanto o estado ou postura indicado pelo particípio perfeito, sem intensificá-lo para “posicionados” ou “de guarda”.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: nos quatro cantos da terra
  rationale: Mantém a imagem apocalíptica convencional; “nos” é a regência portuguesa natural para a localização.
- source_word: κρατοῦντας
  choice: segurando
  rationale: O verbo pode significar segurar ou conter. “Segurando”, em conexão com a oração final que explica que os ventos não soprariam, preserva a imagem e deixa o sentido de contenção claro pelo contexto.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: os quatro ventos da terra
  rationale: Reproduz a expressão apocalíptica para os ventos associados às quatro direções e mantém o alcance cósmico da cena.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: para que nenhum vento soprasse
  rationale: A construção com ἵνα e subjuntivo indica finalidade ou resultado pretendido; “nenhum vento” comunica naturalmente em português a negação genérica.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: sobre a terra, nem sobre o mar, nem sobre árvore alguma
  rationale: Conserva a coordenação negativa dos três âmbitos. “Árvore alguma”, após a negação, expressa de modo idiomático o valor distributivo de πᾶν δένδρον.
theological_decisions:
- issue: Alcance de γῆ na visão apocalíptica
  choice: terra
  alternative: região; solo
  rationale: Os quatro cantos, os quatro ventos, o mar e todas as árvores formam uma cena de alcance cósmico; uma opção como “região” estreitaria indevidamente a referência.
- issue: Natureza da linguagem cosmológica “quatro cantos da terra”
  choice: Preservar literalmente a expressão figurada
  alternative: os quatro extremos da terra; as quatro direções da terra
  rationale: A formulação mantém a imagem visionária convencional sem transformá-la em explicação interpretativa nem atribuir ao texto uma afirmação científica que ultrapasse o caráter idiomático da frase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha a progressão da visão grega, mas evita construções excessivamente literais. Não se acrescentou nota para Μετὰ τοῦτο porque “Depois disso” traduz plenamente o marcador sequencial, e a alternativa formal não altera o sentido.
