id: REV.7.2
reference: Revelation 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: pt
  text: 'E vi outro anjo subindo do leste,[a] tendo o selo do Deus vivo. Ele clamou em alta voz aos quatro anjos a quem havia sido concedido causar dano à terra e ao mar:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do nascente do sol”.
    reason: Preservar a imagem literal da expressão direcional grega.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: outro anjo
  rationale: Expressa naturalmente um anjo adicional, distinto dos quatro já mencionados.
- source_word: ἀναβαίνοντα
  choice: subindo
  rationale: Preserva o movimento ascendente do particípio e soa natural na descrição da visão.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: do leste
  rationale: Comunica de modo claro o valor direcional da expressão; a imagem literal é preservada em nota.
- source_word: ἔχοντα σφραγῖδα
  choice: tendo o selo
  rationale: Mantém o sentido simples de posse de ἔχω sem especificar se o anjo segura ou porta fisicamente o selo.
- source_word: θεοῦ ζῶντος
  choice: do Deus vivo
  rationale: É a formulação bíblica natural em português e preserva a força atributiva da expressão grega.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: Reproduz a intensidade do verbo e da expressão instrumental em linguagem digna e corrente.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: aos quatro anjos
  rationale: Corresponde diretamente ao objeto indireto no dativo.
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: a quem havia sido concedido
  rationale: Reflete a construção passiva sem acrescentar um substantivo como 'poder' nem identificar explicitamente quem concedeu.
- source_word: ἀδικῆσαι
  choice: causar dano
  rationale: No contexto, indica infligir dano à criação, e não principalmente praticar injustiça em sentido abstrato.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: à terra e ao mar
  rationale: Preserva a abrangência cósmica da cena e o par recorrente em Apocalipse.
theological_decisions:
- issue: Natureza da concessão expressa por ἐδόθη
  choice: a quem havia sido concedido causar dano
  alternative: que haviam recebido poder para causar dano
  rationale: A forma passiva sugere permissão ou autoridade delegada, mas o texto não traz um objeto equivalente a 'poder'; a tradução mantém essa abertura e não identifica o agente da concessão.
- issue: Valor da expressão ἀπὸ ἀνατολῆς ἡλίου
  choice: do leste no texto principal
  alternative: do nascente do sol
  rationale: A tradução principal comunica o sentido direcional corrente, enquanto a nota conserva a imagem concreta do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação divide o longo período grego para maior naturalidade; os dois-pontos mantêm a frase aberta para a fala que começa no versículo seguinte.
