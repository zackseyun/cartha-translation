  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: pt
  text: 'E eu lhe disse: “Meu senhor, tu sabes”. Então ele me disse: “Estes são os que vêm da grande tribulação[a]. Lavaram suas vestes e as tornaram brancas no sangue do Cordeiro[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da grande aflição” ou “da grande angústia”. O termo grego pode indicar pressão, aflição, angústia ou tribulação.
    reason: lexical_alternative
  - marker: b
    text: A expressão “no sangue do Cordeiro” foi mantida intencionalmente. O grego também pode ser entendido em sentido instrumental (“pelo sangue”), mas esta tradução preserva a imagem paradoxal de purificação em Apocalipse.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: disse
  rationale: Embora a forma grega seja perfeita, aqui ela funciona naturalmente como introdução narrativa de fala; o pretérito perfeito é a forma idiomática em português.
- source_word: Κύριέ μου
  choice: Meu senhor
  rationale: A fala se dirige a um dos anciãos celestiais, não explicitamente a Deus ou ao Messias. A inicial minúscula preserva o tratamento respeitoso sem sugerir uma identificação cristológica.
- source_word: σὺ οἶδας
  choice: tu sabes
  rationale: O pronome explícito conserva a leve ênfase do grego e expressa o reconhecimento respeitoso de que o ancião conhece a resposta.
- source_word: οἱ ἐρχόμενοι
  choice: os que vêm
  rationale: O particípio presente apresenta uma ação em curso ou característica. Com o complemento “da grande tribulação”, “os que vêm” é natural em português e evita reduzi-la a um passado simples.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: da grande tribulação
  rationale: “Tribulação” preserva o sentido reconhecível de θλῖψις, bem como o peso interpretativo da expressão, sem decidir entre leituras escatológicas concorrentes.
- source_word: ἔπλυναν
  choice: Lavaram
  rationale: O aoristo apresenta a ação como um todo completo, adequadamente expresso pelo pretérito perfeito.
- source_word: στολάς
  choice: vestes
  rationale: στολή designa uma veste longa ou solene. “Vestes” conserva o registro elevado e é mais natural no português bíblico contemporâneo do que uma descrição excessivamente específica.
- source_word: ἐλεύκαναν
  choice: as tornaram brancas
  rationale: A formulação preserva claramente o sentido causativo de “fazer ficar branco” e o referente pronominal, sem recorrer ao menos corrente “alvejaram”.
- source_word: ἐν τῷ αἵματι
  choice: no sangue
  rationale: A preposição “em/no” mantém a imagem paradoxal de vestes embranquecidas no sangue. Embora um valor instrumental seja possível, não é imposto no texto principal.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: Em Apocalipse, “Cordeiro” funciona como título cristológico; a inicial maiúscula sinaliza esse uso sem alterar o sentido lexical.
theological_decisions:
- issue: Forma de tratamento κύριος dirigida ao ancião
  choice: Meu senhor
  alternative: Meu Senhor; Senhor; meu caro senhor
  rationale: O contexto identifica o destinatário como um ancião celestial. “Meu senhor” mantém reverência, mas evita atribuir-lhe indevidamente um título divino ou cristológico.
- issue: Referência da expressão “a grande tribulação”
  choice: da grande tribulação
  alternative: da grande aflição; da grande angústia
  rationale: A tradução lexical preserva a tensão entre possíveis referências — um período escatológico específico, o sofrimento dos fiéis em sentido amplo, ou ambos — sem adotar um esquema denominacional.
- issue: Valor de ἐν na purificação pelo sangue
  choice: no sangue do Cordeiro
  alternative: pelo sangue do Cordeiro; com o sangue do Cordeiro
  rationale: “No sangue” conserva deliberadamente a imagem paradoxal do texto e sua formulação espacial, sem excluir a possível nuance instrumental.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O uso de “tu sabes” mantém a ênfase do pronome grego e um tratamento digno; “vestes” preserva o caráter elevado da cena sem soar excessivamente arcaico. Os marcadores de nota foram colocados junto às expressões que explicam.
