id: REV.7.17
reference: Revelation 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: pt
  text: porque o Cordeiro que está no meio do trono[a] os pastoreará e os guiará[b] às fontes da água da vida[c]; e Deus enxugará dos olhos deles toda lágrima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que está no centro do trono”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os conduzirá”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “às fontes de águas vivas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: o Cordeiro
  rationale: Preserva o título cristológico característico de Apocalipse e suas ressonâncias sacrificiais e messiânicas, sem dar ao diminutivo um tom trivial.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: no meio do trono
  rationale: Mantém a imagem espacial vívida e a formulação natural em português, sem definir além do grego a relação precisa com o trono.
- source_word: ποιμανεῖ
  choice: os pastoreará
  rationale: Conserva a imagem intencional e paradoxal do Cordeiro que atua como pastor; o contexto de condução às águas favorece o sentido pastoral, não simplesmente régio.
- source_word: ὁδηγήσει
  choice: os guiará
  rationale: Equivalente natural de ὁδηγέω que se distingue de 'pastoreará' e preserva a ideia de orientação.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: às fontes da água da vida
  rationale: Toma ζωῆς como qualificando naturalmente a água, mantém a imagem de fontes naturais e traduz ἐπί com movimento de modo idiomático.
- source_word: ἐξαλείψει
  choice: enxugará
  rationale: No contexto de lágrimas, 'enxugará' é a expressão portuguesa mais natural e terna, preservando a ação concreta.
- source_word: πᾶν δάκρυον
  choice: toda lágrima
  rationale: Reproduz a totalidade expressa pelo singular com πᾶν e mantém o caráter individualizante da imagem.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: dos olhos deles
  rationale: Forma idiomática e clara em português, preservando a origem das lágrimas indicada por ἐκ.
theological_decisions:
- issue: Paradoxo cristológico do Cordeiro como pastor
  choice: 'Mantido literalmente em sentido imagético: ''o Cordeiro... os pastoreará'''
  alternative: '''o Cordeiro... cuidará deles'' ou ''governará sobre eles'''
  rationale: A formulação preserva a imagem deliberada do Cordeiro que é também pastor, bem como suas ressonâncias bíblicas, sem suavizar a tensão teológica.
- issue: Relação entre Deus e o Cordeiro na oração final
  choice: Mantido 'Deus' como sujeito explícito de 'enxugará'
  alternative: Tratar a oração como continuação implícita da ação do Cordeiro
  rationale: O grego explicita ὁ θεός como sujeito, de modo que a tradução conserva a distinção apresentada na visão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Pastoreará' é menos frequente na fala cotidiana, mas é transparente e necessário para preservar o paradoxo central da imagem. Os marcadores foram posicionados junto às expressões a que se referem e ordenados sequencialmente.
