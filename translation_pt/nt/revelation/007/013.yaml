id: REV.7.13
reference: Revelation 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: pt
  text: 'Então um dos anciãos respondeu-me: “Estes que estão vestidos com túnicas brancas, quem são eles e de onde vieram?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: Funciona como conectivo que faz a visão avançar; “Então” é natural em português e preserva a progressão narrativa.
- source_word: ἀπεκρίθη
  choice: tomou a palavra
  rationale: O verbo pode introduzir uma fala em resposta à situação, mesmo sem pergunta anterior explícita. “Tomou a palavra” evita a impressão moderna de que o ancião responde a uma pergunta não registrada.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: um dos anciãos
  rationale: Expressão portuguesa natural para a construção partitiva e coerente com a terminologia de Apocalipse.
- source_word: λέγων μοι
  choice: e me perguntou
  rationale: Integra o particípio à oração principal de modo idiomático; como a fala direta é interrogativa, “perguntou” comunica com clareza o ato de fala sem alterar seu conteúdo.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: estes vestidos
  rationale: 'Preserva o demonstrativo e o estado expresso pelo particípio perfeito: eles aparecem revestidos dessas roupas.'
- source_word: τὰς στολὰς τὰς λευκὰς
  choice: com as túnicas brancas
  rationale: στολή designa uma veste longa ou solene; “túnicas” é claro, digno e preserva a imagem recorrente no livro.
- source_word: τίνες εἰσὶν
  choice: Quem são
  rationale: Forma interrogativa natural em português, com “estes” funcionando como sujeito posposto.
- source_word: πόθεν ἦλθον
  choice: de onde vieram
  rationale: Expressa diretamente a procedência perguntada por πόθεν e o passado do aoristo ἦλθον, sem acrescentar nuance aspectual inexistente na forma portuguesa.
theological_decisions:
- issue: Valor discursivo de ἀπεκρίθη sem pergunta anterior explícita
  choice: tomou a palavra
  alternative: respondeu
  rationale: A formulação escolhida preserva a função de introduzir uma fala relacionada à cena sem criar, para o leitor moderno, uma pergunta anterior implícita. Não envolve decisão doutrinária.
- issue: Aspecto e tempo de ἦλθον
  choice: de onde vieram
  alternative: de onde têm vindo
  rationale: O pretérito perfeito é a correspondência portuguesa mais natural para o aoristo neste contexto. A alternativa pode sugerir movimento repetido ou continuado e, por isso, estreitaria indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem da pergunta foi naturalizada sem apagar o demonstrativo enfático “estes”. O marcador [a] aparece no texto principal.
