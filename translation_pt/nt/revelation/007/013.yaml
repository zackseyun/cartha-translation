  source_fidelity: A pergunta é transmitida corretamente em linhas gerais, incluindo o grupo em vestes brancas e sua procedência. Contudo, “tomou a palavra e me perguntou” substitui e funde ἀπεκρίθη e λέγων μοι. Embora seja fluente, “tomou a palavra” deixa de representar explicitamente que o ancião respondeu; uma formulação que conserve “respondeu” é mais fiel sem ser artificial.
  naturalness: O texto é claro e natural. “Então um dos anciãos respondeu-me” mantém um registro digno e atual; a pergunta direta permanece inteiramente idiomática. “Estes que estão vestidos com túnicas brancas” explicita de forma natural o particípio perfeito em seu valor de estado presente.
  terminology: '“Anciãos” é adequado para πρεσβύτεροι em Apocalipse. “Túnicas brancas” traduz satisfatoriamente στολὰς λευκάς, preservando a imagem de vestes longas/solenes. A nota proposta, porém, não é necessária: “de onde chegaram?” tende a deslocar o foco da procedência para o ponto de chegada e não oferece uma alternativa textual ou lexical de valor equivalente.'
