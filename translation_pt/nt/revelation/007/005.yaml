id: REV.7.5
reference: Revelation 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: pt
  text: da tribo de Judá, doze mil foram selados[a]; da tribo de Rúben, doze mil; da tribo de Gade, doze mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «da tribo de Judá, doze mil selados». O grego emprega um particípio passivo («selados») depois da primeira contagem tribal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: da
  rationale: A preposição grega indica origem ou proveniência. Na fórmula repetida com φυλῆς, a contração portuguesa «da» é natural e exata.
- source_word: φυλῆς
  choice: tribo
  rationale: Em uma enumeração genealógica de Israel, «tribo» é o equivalente estabelecido e preserva a estrutura tribal; «clã» indicaria uma subdivisão menor.
- source_word: Ἰούδα
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: δώδεκα χιλιάδες
  choice: doze mil
  rationale: Tradução numérica direta. O português permite que a expressão funcione substantivamente sem acrescentar «pessoas» ou «homens», termos ausentes do grego.
- source_word: ἐσφραγισμένοι
  choice: foram selados
  rationale: O particípio perfeito passivo, no masculino plural, caracteriza os integrantes desse grupo como já selados. A forma verbal explícita produz português natural, enquanto a nota registra a construção mais formal.
- source_word: Ῥουβὴν
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: Γὰδ
  choice: Gade
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
theological_decisions:
- issue: Força e alcance de ἐσφραγισμένοι na enumeração das tribos
  choice: Explicitar «foram selados» na primeira cláusula e manter a elipse nas cláusulas paralelas seguintes.
  alternative: 'Traduzir de modo mais formal: «da tribo de Judá, doze mil selados»; ou repetir «foram selados» depois de cada tribo.'
  rationale: O grego coloca o particípio passivo depois da primeira contagem. Ele descreve os contados e, pelo paralelismo e pelo contexto, aplica-se à enumeração que continua. A tradução explicita sua força verbal somente onde aparece, sem preencher excessivamente as cláusulas seguintes nem decidir além do texto como deve ser entendida a identidade dos selados.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas correntes dos nomes tribais. A repetição «da tribo de» conserva o ritmo da enumeração grega. O ponto e vírgula distingue a primeira cláusula verbalmente completa das duas cláusulas elípticas.
