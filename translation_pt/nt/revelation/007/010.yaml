id: REV.7.10
reference: Revelation 7:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: pt
  text: 'E clamam em alta voz, dizendo: “A salvação[a] pertence ao nosso Deus, que está sentado no trono, e ao Cordeiro!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “A salvação ao nosso Deus, que está sentado no trono, e ao Cordeiro!”'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: κράζουσι
  choice: clamam
  rationale: O presente do indicativo transmite uma ação vívida na cena. “Clamam” preserva a força de um brado público e solene, sem reduzir o verbo a “dizem”.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: A expressão dativa indica modo e é traduzida por uma formulação natural e corrente em português, preservando a imagem da voz elevada.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz diretamente o conteúdo do clamor.
- source_word: Ἡ σωτηρία
  choice: A salvação pertence
  rationale: A aclamação grega não contém verbo expresso. “Pertence” torna explícito, em português natural, o sentido atributivo dos dativos sem restringir o significado de σωτηρία a “vitória”.
- source_word: τῷ θεῷ ἡμῶν
  choice: ao nosso Deus
  rationale: O dativo identifica aquele a quem a salvação é atribuída; com “pertence”, a regência natural em português é “ao nosso Deus”.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: que está sentado no trono
  rationale: A oração relativa comunica com clareza a função apositiva do particípio e mantém a cena presente diante do leitor.
- source_word: τῷ ἀρνίῳ
  choice: ao Cordeiro
  rationale: “Cordeiro” preserva o título joanino de Jesus e sua imagem sacrificial e messiânica; a inicial maiúscula sinaliza seu uso titular no Apocalipse.
theological_decisions:
- issue: Relação da salvação com Deus e com o Cordeiro
  choice: 'Traduzir como atribuição conjunta: “A salvação pertence ao nosso Deus ... e ao Cordeiro!”'
  alternative: 'Traduzir de modo mais literal: “A salvação ao nosso Deus ... e ao Cordeiro!”'
  rationale: A construção atribui a salvação conjuntamente a Deus e ao Cordeiro. A tradução mantém essa tensão cristológica e a força litúrgica sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Clamam” preserva a solenidade e intensidade do original; “em alta voz” é idiomático. A nota registra a forma nominal e sem verbo da aclamação grega.
