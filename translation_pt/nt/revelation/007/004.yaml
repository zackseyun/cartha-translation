id: REV.7.4
reference: Revelation 7:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: pt
  text: 'E ouvi o número dos que tinham sido selados: cento e quarenta e quatro mil, selados de cada tribo dos filhos de Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Israel”. O grego diz literalmente “filhos de Israel”, preservando a linguagem masculina e genealógica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ouvi
  rationale: O aoristo de ἀκούω, neste relato, indica de modo direto que João ouviu a informação.
- source_word: τὸν ἀριθμὸν
  choice: o número
  rationale: Expressa naturalmente o total anunciado, preservando a formulação do grego.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: dos que tinham sido selados / selados
  rationale: O particípio perfeito passivo indica uma ação já realizada cujo resultado permanece. A repetição de 'selados' conserva a repetição do original.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: cento e quarenta e quatro mil
  rationale: É a forma corrente e clara de expressar o numeral em português.
- source_word: ἐκ πάσης φυλῆς
  choice: de todas as tribos
  rationale: 'A expressão tem sentido distributivo: os selados procedem de cada uma das tribos. Em português, ''de todas as tribos'' é natural e mantém esse alcance no contexto da lista que segue.'
- source_word: υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva o substantivo masculino e a linguagem genealógica e tribal do grego, além de corresponder a uma expressão bíblica bem reconhecida em português.
theological_decisions:
- issue: Sentido de υἱῶν Ἰσραήλ no contexto da lista tribal
  choice: filhos de Israel
  alternative: descendentes de Israel; povo de Israel
  rationale: A tradução mantém a formulação masculina e genealógica do texto sem decidir se a descrição deve ser entendida de maneira estritamente literal ou simbólica no contexto apocalíptico.
- issue: Natureza do número cento e quarenta e quatro mil
  choice: manter o numeral sem explicação interpretativa no texto
  alternative: explicitar uma leitura literal ou simbólica
  rationale: O versículo anuncia o número, mas não resolve por si só seu valor interpretativo; a tradução não deve impor um sistema escatológico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da frase e a repetição de 'selados' acompanham de perto o grego sem soar artificial. O marcador de nota foi colocado após a expressão a que se refere.
