  terminology: «Seres viventes» evita reduzir ζῷα a animais comuns; «Senhor Deus» e «Todo-Poderoso» são equivalentes estáveis e adequados dos títulos κύριος, ὁ θεός e ὁ παντοκράτωρ. A nota assinalada em «vem» apresenta legitimamente a alternativa tradicional «há de vir», sem impor essa interpretação ao texto principal.
