id: REV.4.8
reference: Revelation 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: pt
  text: 'E os quatro seres viventes, cada um deles com seis asas, estão cheios de olhos ao redor e por dentro; e não têm descanso, dia e noite, dizendo: “Santo, santo, santo é o Senhor Deus, o Todo-Poderoso, aquele que era, que é e que vem[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais tradicional: “aquele que era, que é e que há de vir”.'
    reason: Registra a formulação tradicional e idiomática para ὁ ἐρχόμενος, enquanto o texto principal preserva mais diretamente o particípio presente, “que vem”.
lexical_decisions:
- source_word: ζῷα
  choice: seres viventes
  rationale: Designa seres celestiais animados na visão, não meramente animais; a expressão preserva a imagem apocalíptica e evita a conotação moderna de irracionalidade.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: cada um deles
  rationale: Reproduz naturalmente o sentido distributivo, deixando claro que a descrição se aplica individualmente aos quatro seres.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: com seis asas
  rationale: Construção portuguesa concisa e natural que atribui seis asas a cada ser sem perder o valor do particípio grego.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: ao redor e por dentro
  rationale: 'Preserva as duas dimensões espaciais da imagem: exteriormente em toda a volta e também no interior.'
- source_word: γέμουσιν ὀφθαλμῶν
  choice: estão cheios de olhos
  rationale: Traduz diretamente γέμω com genitivo e mantém a imagem visionária vívida.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: não têm descanso
  rationale: Mantém o sentido literal de ausência de descanso ou repouso, sem reduzi-lo apenas à ideia interpretativa de não cessar de falar.
- source_word: ἡμέρας καὶ νυκτός
  choice: dia e noite
  rationale: Equivalente adverbial corrente que comunica continuidade.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a neutralidade do particípio e introduz diretamente o conteúdo da proclamação, sem acrescentar intensidade ausente do verbo.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Santo, santo, santo
  rationale: Preserva exatamente a repetição tríplice, de grande importância retórica e teológica.
- source_word: κύριος, ὁ θεός
  choice: o Senhor Deus
  rationale: Emprega os equivalentes portugueses naturais dos títulos divinos e conserva sua combinação no texto.
- source_word: ὁ παντοκράτωρ
  choice: o Todo-Poderoso
  rationale: Título divino tradicional, claro e semanticamente adequado para aquele que detém todo o poder e governa sobre tudo.
- source_word: ὁ ἐρχόμενος
  choice: aquele que vem
  rationale: O particípio presente substantivado apresenta Deus como o que vem; a formulação preserva mais diretamente seu aspecto do que uma expressão meramente futura.
theological_decisions:
- issue: Tradução da fórmula temporal divina ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: aquele que era, que é e que vem
  alternative: aquele que era, que é e que há de vir
  rationale: “Que vem” reflete o particípio presente ἐρχόμενος e preserva a força dinâmica da vinda. A formulação tradicional “que há de vir” é legítima e idiomática, mas explicita um valor futuro mais do que a forma grega; por isso aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Seres viventes” conserva o tom bíblico sem sugerir simples animais; “Todo-Poderoso” mantém um título divino estabelecido. A pontuação favorece leitura pública e preserva a solenidade litúrgica.
