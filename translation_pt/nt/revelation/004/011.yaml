source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: pt
  text: Tu és digno[a], nosso Senhor e Deus, de receber a glória, a honra e o poder, porque tu criaste todas as coisas, e por causa da tua vontade[b] elas existiam e foram criadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Digno és tu”. No grego, “digno” aparece no início da frase para receber ênfase.'
    reason: ordem_das_palavras
  - marker: b
    text: 'Ou: “pela tua vontade”. A expressão grega pode ser entendida em sentido causal (“por causa da”) ou, com menor probabilidade, instrumental (“por meio da”).'
    reason: alternativa_lexical
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Tu és digno
  rationale: Expressa de modo natural em português o adjetivo predicativo com εἶ e mantém a segunda pessoa singular da aclamação. A nota registra a ênfase produzida pela posição inicial de Ἄξιος.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: nosso Senhor e Deus
  rationale: A sequência com artigo funciona como vocativo no contexto de adoração. A formulação portuguesa mantém os dois títulos e entende ἡμῶν como ligado ao conjunto.
- source_word: λαβεῖν
  choice: de receber
  rationale: Depois de «digno», o infinitivo indica aquilo que o destinatário merece receber; «receber» é claro e adequado ao contexto de adoração.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: a glória, a honra e o poder
  rationale: Conserva os três substantivos distintos, seus artigos e a cadência solene da aclamação, sem tornar a coordenação artificial em português.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: porque criaste todas as coisas
  rationale: ὅτι apresenta a razão da dignidade proclamada; «todas as coisas» preserva o alcance abrangente de τὰ πάντα e o registro elevado.
- source_word: διὰ τὸ θέλημά σου
  choice: por causa da tua vontade
  rationale: διά com acusativo tem aqui, mais provavelmente, valor causal. A expressão explicita essa relação sem transformar a vontade divina em mero instrumento; a alternativa mais fluida e potencialmente instrumental é registrada em nota.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: elas existiam e foram criadas
  rationale: Mantém distintos o imperfeito de εἰμί e o aoristo passivo de κτίζω. A formulação preserva a tensão da sequência grega, em vez de reduzir ambos os verbos a uma única ideia de origem.
theological_decisions:
- issue: Forma de tratamento dos títulos divinos
  choice: nosso Senhor e Deus
  alternative: Senhor e Deus nosso
  rationale: O contexto exige leitura vocativa. A opção escolhida é natural em português e aplica o possessivo à expressão coordenada sem acrescentar conteúdo doutrinário.
- issue: Relação entre a vontade divina e a existência da criação
  choice: por causa da tua vontade
  alternative: pela tua vontade
  rationale: A tradução principal conserva a nuance causal mais comum de διά com acusativo. A alternativa pode ser entendida tanto causal quanto instrumentalmente e, por isso, aparece em nota, sem resolver além do texto a relação metafísica entre vontade e criação.
- issue: Relação entre «existiam» e «foram criadas»
  choice: preservar os dois verbos e seus aspectos
  alternative: vieram a existir e foram criadas
  rationale: A redação mantém a estranheza e a tensão da formulação grega, evitando harmonizar silenciosamente existência e ato criador.
translation_notes:
  register: Português moderno, solene e apropriado ao contexto litúrgico, com leitura natural para brasileiros e ampla inteligibilidade internacional. Emprega «tu» em concordância plena («és», «criaste», «tua»). O ponto e vírgula organiza a longa aclamação sem romper sua unidade.
