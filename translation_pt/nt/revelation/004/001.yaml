revisions:
- from: 'Depois destas coisas, olhei[a], e eis uma porta aberta no céu. E a primeira voz[b] que eu tinha ouvido, semelhante a uma trombeta falando comigo[c], disse: “Suba até aqui, e eu lhe mostrarei o que deve acontecer depois destas coisas.”'
  to: 'Depois destas coisas, vi, e eis uma porta aberta no céu; e a primeira voz que eu tinha ouvido, falando comigo como uma trombeta, disse: “Suba até aqui, e eu lhe mostrarei o que deve acontecer depois destas coisas.”'
  rationale: 'A revisão substitui «olhei» por «vi», correspondendo diretamente a εἶδον, e reformula a comparação para uma sintaxe portuguesa natural: a voz falava com João como uma trombeta. O ponto e vírgula conserva a continuidade da frase grega. As notas permanecem pertinentes e seus marcadores devem ser posicionados, respectivamente, após «vi», «voz» e «trombeta».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:41:12Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a repetição de «Depois destas coisas», o estado resultante de «porta aberta», o cenário celestial e a promessa do que deve acontecer. Contudo, «olhei» traduz mais propriamente um ato de olhar, ao passo que εἶδον significa «vi»; a opção inglesa do audit trail não deve sobrepor-se ao sentido lexical direto do grego. Além disso, a construção «semelhante a uma trombeta falando comigo» pode sugerir de modo desajeitado que uma trombeta fala. Uma formulação em que a voz fala «como uma trombeta» conserva a comparação e produz português mais claro.
  naturalness: O registro é adequado, solene sem ser arcaico, e «eis», «Suba até aqui» e «lhe mostrarei» são claros para leitores brasileiros e internacionais. «Vi, e eis» é um pouco mais formal que «olhei», mas é natural no registro bíblico e corresponde diretamente ao original. «Falando comigo como uma trombeta» evita a personificação sintaticamente estranha da trombeta.
  terminology: «Céu», «porta aberta», «primeira voz», «trombeta» e «deve acontecer» são escolhas apropriadas. A nota sobre a provável retomada de Apocalipse 1:10 mantém corretamente a identificação fora do texto principal e não impõe uma interpretação.
  issues:
  - severity: medium
    issue: «olhei» para εἶδον
    rationale: εἶδον é aoristo de ὁράω e significa primariamente «vi». Embora «olhei» possa introduzir uma visão em português, perde a afirmação explícita de percepção visual presente no texto-fonte.
  - severity: low
    issue: Construção da comparação com a trombeta
    rationale: «Semelhante a uma trombeta falando comigo» é gramaticalmente possível, mas soa como se a trombeta fosse o sujeito de «falando». «Falando comigo como uma trombeta» comunica com mais naturalidade que a voz falava de modo comparável a uma trombeta, sem resolver além do necessário a sintaxe condensada do grego.
  revised_text: 'Depois destas coisas, vi, e eis uma porta aberta no céu; e a primeira voz que eu tinha ouvido, falando comigo como uma trombeta, disse: “Suba até aqui, e eu lhe mostrarei o que deve acontecer depois destas coisas.”'
  revised_footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Depois disso... o que deve acontecer depois disso”. O grego repete a expressão plural “depois destas coisas” no início e no fim do versículo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “a primeira voz” provavelmente retoma a voz que João ouviu antes (ver Apocalipse 1:10).
    reason: cross_reference
  - marker: c
    text: Também se pode traduzir “falando para mim”. O grego diz mais literalmente “falando comigo”.
    reason: lexical_alternative
  revision_rationale: 'A revisão substitui «olhei» por «vi», correspondendo diretamente a εἶδον, e reformula a comparação para uma sintaxe portuguesa natural: a voz falava com João como uma trombeta. O ponto e vírgula conserva a continuidade da frase grega. As notas permanecem pertinentes e seus marcadores devem ser posicionados, respectivamente, após «vi», «voz» e «trombeta».'
