id: REV.4.1
reference: Revelation 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: pt
  text: 'Depois destas coisas, vi, e eis uma porta aberta no céu; e a primeira voz que eu tinha ouvido, falando comigo como uma trombeta, disse: “Suba até aqui, e eu lhe mostrarei o que deve acontecer depois destas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois destas coisas
  rationale: Preserva o plural do grego e a repetição deliberada da expressão no início e no fim do versículo, sem definir se a sequência é apenas visionária, literária ou histórico-escatológica.
- source_word: εἶδον
  choice: olhei
  rationale: No contexto da introdução de uma nova cena visionária, “olhei” evita a sequência menos natural “vi, e eis” e continua expressando percepção visual.
- source_word: ἰδοὺ
  choice: e eis
  rationale: Mantém o marcador de atenção súbita e o tom elevado próprio da visão apocalíptica, numa forma ainda reconhecível em português moderno.
- source_word: θύρα ἠνεῳγμένη
  choice: uma porta aberta
  rationale: 'O particípio perfeito passivo descreve o estado resultante: a porta se encontra aberta. Em português, “uma porta aberta” comunica esse estado com naturalidade.'
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: O contexto aponta para o domínio celestial, e não meramente para o céu visível.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: a primeira voz
  rationale: Conserva a formulação do grego e permite que o leitor perceba a provável referência à voz ouvida anteriormente, sem tornar essa identificação explícita no corpo do texto.
- source_word: ἣν ἤκουσα
  choice: que eu tinha ouvido
  rationale: O mais-que-perfeito composto deixa clara a anterioridade dessa audição em relação ao novo ato de fala.
- source_word: ὡς σάλπιγγος
  choice: semelhante a uma trombeta
  rationale: Expressa comparação, e não identidade, preservando a imagem sonora sem acrescentar “som”, palavra não explícita no grego.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: falando comigo
  rationale: Reflete de perto μετά com genitivo (“comigo”) e é também idiomático em português.
- source_word: λέγων
  choice: disse
  rationale: Transforma o particípio introdutor do discurso direto em verbo finito, ajuste natural em português. Embora a forma grega seja masculina, a tradução não força uma explicação para essa irregularidade de concordância.
- source_word: Ἀνάβα ὧδε
  choice: Suba até aqui
  rationale: Reproduz o chamado para que João suba ao lugar de onde fala a voz; “suba até aqui” é claro, natural e mantém a perspectiva espacial do falante.
- source_word: δείξω σοι
  choice: eu lhe mostrarei
  rationale: Expressa diretamente a promessa futura, com tratamento respeitoso e amplamente compreensível em português.
- source_word: ἃ δεῖ γενέσθαι
  choice: o que deve acontecer
  rationale: Comunica a necessidade expressa por δεῖ sem especificar indevidamente a natureza dessa necessidade.
theological_decisions:
- issue: Força temporal da expressão repetida μετὰ ταῦτα
  choice: As duas ocorrências foram traduzidas por “depois destas coisas”.
  alternative: Traduzir idiomaticamente por “depois disso” ou “depois disto”.
  rationale: A repetição e o plural foram mantidos para não decidir se a sequência é literária, visionária ou parte de um esquema escatológico específico.
- issue: Identidade da “primeira voz”
  choice: A identificação permanece implícita no texto, com remissão em nota a Apocalipse 1:10.
  alternative: Explicitar no corpo do versículo que é a voz ouvida anteriormente.
  rationale: O texto provavelmente retoma a voz de 1:10, mas não a identifica novamente de maneira explícita; a tradução preserva essa medida de ambiguidade.
- issue: Imagem da trombeta
  choice: A voz é descrita como semelhante a uma trombeta.
  alternative: Parafrasear como “semelhante ao som de uma trombeta”.
  rationale: A paráfrase explicaria corretamente a natureza sonora da comparação, mas a forma escolhida preserva mais diretamente a imagem condensada do grego.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “E eis” preserva o tom visionário sem recorrer a linguagem excessivamente arcaica. A colocação pronominal e o tratamento por “lhe” evitam regionalismos marcados.
