source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: pt
  text: Do trono saem relâmpagos, sons[a] e trovões; e diante do trono ardem sete tochas de fogo[b], que são os sete espíritos de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vozes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sete lâmpadas de fogo ardendo diante do trono”.'
    reason: lexical_alternative
  - marker: c
    text: Muitos entendem “os sete espíritos de Deus” como uma maneira simbólica de falar da plenitude do único Espírito Santo; o texto grego, porém, diz literalmente “sete espíritos”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: saem
  rationale: Expressa de modo natural o movimento dos fenômenos que procedem do trono e mantém o presente do grego.
- source_word: ἀστραπαὶ
  choice: relâmpagos
  rationale: O plural português é natural e comunica ocorrências repetidas de relâmpago.
- source_word: φωναὶ
  choice: sons
  rationale: φωνή pode significar tanto voz quanto som. No conjunto com relâmpagos e trovões, “sons” evita especificar fala pessoal; “vozes” permanece na nota.
- source_word: βρονταί
  choice: trovões
  rationale: Plural corrente em português, preservando a repetição e a força sonora da cena.
- source_word: λαμπάδες πυρὸς
  choice: tochas de fogo
  rationale: λαμπάς designa com frequência uma tocha; a construção mantém de perto o genitivo πυρός e produz uma imagem clara em português.
- source_word: καιόμεναι
  choice: ardem
  rationale: A forma verbal natural em português comunica a ação contínua do particípio presente grego sem uma construção pesada.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: diante do trono
  rationale: Equivalente espacial tradicional, claro e natural.
- source_word: ἅ εἰσιν
  choice: que são
  rationale: Reproduz diretamente a identificação simbólica introduzida pelo pronome relativo neutro plural.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: os sete espíritos de Deus
  rationale: Mantém o plural explícito do texto grego, sem transformar a tradução numa interpretação teológica.
theological_decisions:
- issue: Interpretação de τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: Traduzir literalmente como “os sete espíritos de Deus” no texto principal.
  alternative: “o Espírito sétuplo de Deus” ou uma referência simbólica à plenitude do único Espírito Santo.
  rationale: O grego diz explicitamente “sete espíritos”. A tradução conserva essa forma e sua tensão teológica; a interpretação possível é registrada em nota, sem ser imposta ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem perder a progressão da cena nem a identificação simbólica. Todas as notas têm marcadores correspondentes no texto principal.
