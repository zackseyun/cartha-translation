source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: pt
  text: Imediatamente, encontrei-me no Espírito[a], e eis que um trono estava colocado no céu, e sobre o trono, alguém sentado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em espírito”. A expressão grega não tem artigo e pode indicar tanto o Espírito Santo como um estado espiritual ou visionário.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Imediatamente
  rationale: Marca a transição súbita da experiência de João e é natural em português moderno.
- source_word: ἐγενόμην
  choice: fui tomado
  rationale: O aoristo de γίνομαι indica aqui a entrada em um estado profético ou visionário; esta formulação comunica a transição de modo natural, sem reduzi-la a uma condição meramente estática.
- source_word: ἐν πνεύματι
  choice: pelo Espírito
  rationale: No Apocalipse, a expressão funciona como marcador de experiência profética. A formulação escolhida expressa o provável agente divino, enquanto a leitura mais geral é preservada em nota.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função de chamar a atenção e o tom elevado da visão apocalíptica.
- source_word: θρόνος
  choice: um trono
  rationale: O substantivo sem artigo introduz um novo elemento da visão; o artigo indefinido é natural em português.
- source_word: ἔκειτο
  choice: havia
  rationale: O imperfeito de κεῖμαι descreve o trono situado ou estabelecido no céu. 'Havia' transmite sua presença de modo idiomático, sem sugerir que estivesse deitado.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Refere-se ao âmbito celestial, não ao céu atmosférico.
- source_word: καθήμενος
  choice: alguém estava sentado
  rationale: Torna explícito em português o particípio substantivado sem identificar a pessoa além do que o grego afirma.
theological_decisions:
- issue: Se ἐν πνεύματι se refere ao Espírito Santo ou a um estado espiritual/visionário
  choice: pelo Espírito
  alternative: em espírito
  rationale: O uso recorrente da expressão no Apocalipse favorece uma experiência profética produzida pelo Espírito. Como o grego não traz artigo e admite uma descrição mais geral do estado visionário, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Eis que' conserva o tom apocalíptico; a divisão em duas frases evita uma construção truncada sem apagar a sequência visual do original.
