  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: pt
  text: Ao redor do trono havia vinte e quatro tronos, e, sobre os tronos, estavam sentados vinte e quatro anciãos, vestidos com vestes brancas e com coroas de ouro[a] sobre a cabeça deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinaldas de ouro”; a palavra grega pode designar uma coroa concedida como sinal de honra ou vitória, e não apenas uma coroa régia.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: ao redor
  rationale: Expressa de modo natural a disposição circular em torno do trono central.
- source_word: θρόνοι
  choice: tronos
  rationale: Preserva a repetição do mesmo substantivo grego usado para o trono central e mantém a imagem régia ou judicial, sem reduzi-los a meros assentos.
- source_word: εἴκοσι τέσσαρες
  choice: vinte e quatro
  rationale: Forma numeral padrão em português.
- source_word: ἐπὶ τοὺς θρόνους
  choice: neles
  rationale: Retoma naturalmente os tronos e evita uma repetição pesada, preservando a localização dos anciãos sobre eles.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: É o título tradicional e contextualmente adequado para esse grupo celestial, sem definir sua identidade além do que o texto diz.
- source_word: καθημένους
  choice: estavam sentados
  rationale: Transforma o particípio em construção verbal natural em português e comunica claramente a postura dos anciãos.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: vestidos de branco
  rationale: Reproduz de maneira fluente o estado de estarem trajados com vestes brancas, sem especificar indevidamente o tipo de roupa.
- source_word: στεφάνους χρυσοῦς
  choice: coroas de ouro
  rationale: É uma formulação clara e idiomática; a nota preserva a possível nuance de grinaldas concedidas por honra ou vitória.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: na cabeça
  rationale: Expressão idiomática em português; o singular distributivo indica que cada ancião tinha uma coroa sobre a própria cabeça.
theological_decisions:
- issue: Natureza dos vinte e quatro θρόνοι ao redor do trono central
  choice: tronos
  alternative: assentos
  rationale: O grego repete θρόνος, por isso a tradução mantém a ligação lexical e a imagem régia ou judicial. Isso não atribui aos anciãos soberania igual à daquele que ocupa o trono central.
- issue: Identidade dos vinte e quatro anciãos
  choice: anciãos, sem explicação interpretativa
  alternative: representantes da igreja, seres angelicais ou representantes de Israel e dos apóstolos
  rationale: O versículo nomeia o grupo, mas não explica sua identidade; a tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi levemente reorganizada para fluência, sem perder os elementos visuais nem a relação entre o trono central e os vinte e quatro tronos. O marcador da nota foi colocado após “coroas de ouro”, termo ao qual a alternativa lexical se refere.
