  source_fidelity: A tradução preserva a disposição ao redor do trono, os vinte e quatro tronos, os anciãos sentados e as coroas de ouro. Contudo, “vestidos de branco” torna implícito o substantivo ἱματίοις (“vestes/roupas”), enquanto o grego o explicita. Além disso, “na cabeça” com singular distributivo é possível, mas “sobre a cabeça deles” reproduz de modo mais direto o plural αὐτῶν e mantém a imagem visual.
  naturalness: O texto é claro e moderno. A repetição de “tronos” é justificada pela repetição deliberada de θρόνοι. “Vestidos com vestes brancas” é natural em registro bíblico contemporâneo e evita a elipse de “branco”.
  terminology: “Tronos”, “anciãos” e “coroas de ouro” são escolhas adequadas. A nota sobre στεφάνους é fiel e não impõe interpretação. “Grinaldas” é uma alternativa possível; a formulação da nota comunica apropriadamente o contraste com uma coroa régia.
