  - severity: low
    issue: “Na cabeça” usa singular distributivo onde o grego traz plural explícito.
    rationale: Não chega a alterar o sentido, mas “sobre a cabeça deles” reflete mais diretamente ἐπὶ τὰς κεφαλὰς αὐτῶν e evita qualquer ambiguidade de referência.
