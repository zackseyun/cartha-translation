id: REV.4.10
reference: Revelation 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: pt
  text: 'os vinte e quatro anciãos se prostrarão diante daquele que está sentado no trono e adorarão aquele que vive para todo o sempre[a]. Eles lançarão suas coroas diante do trono[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “pelos séculos dos séculos”.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega traduzida por “coroas” também pode designar grinaldas de vitória concedidas como sinal de honra.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: se prostrarão
  rationale: No contexto de adoração, expressa naturalmente em português o ato reverente de cair diante de alguém, sem sugerir uma queda involuntária.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: os vinte e quatro anciãos
  rationale: “Anciãos” é a forma bíblica corrente e acessível para πρεσβύτεροι neste cenário de corte celestial.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente conciso e natural, adequado às duas ocorrências.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: daquele que está sentado no trono
  rationale: Preserva a descrição substantivada e o estado contínuo de entronização sem identificar explicitamente o referente.
- source_word: προσκυνήσουσιν
  choice: adorarão
  rationale: No contexto divino do Apocalipse, comunica a devoção religiosa, não apenas o gesto físico de inclinar-se.
- source_word: τῷ ζῶντι
  choice: aquele que vive
  rationale: Mantém a forma descritiva do particípio substantivado em linguagem portuguesa natural.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Expressão portuguesa clara e consagrada para duração sem fim; a forma mais literal é registrada em nota.
- source_word: βαλοῦσιν
  choice: lançarão
  rationale: Preserva a vivacidade e solenidade de βάλλω melhor do que “colocarão” ou “depositarão”.
- source_word: τοὺς στεφάνους
  choice: suas coroas
  rationale: “Coroas” é natural no cenário régio e apocalíptico, enquanto a nota conserva a nuance histórica de coroas ou grinaldas de vitória.
- source_word: λέγοντες
  choice: dizendo
  rationale: Introduz de modo direto e natural a fala que vem no versículo seguinte.
theological_decisions:
- issue: Identidade daquele que está sentado no trono e vive para sempre
  choice: 'Manter os títulos descritivos: “aquele que está sentado no trono” e “aquele que vive para todo o sempre”.'
  alternative: Identificá-lo explicitamente como Deus Pai.
  rationale: Embora o contexto aponte para Deus entronizado, o grego deste versículo não faz essa identificação explícita; a tradução preserva a formulação e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se prostrarão” evita a possível impressão de queda acidental; “para todo o sempre” é idiomático sem perder a nota literal. Todos os marcadores aparecem no texto.
