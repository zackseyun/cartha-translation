source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: pt
  text: Diante do trono havia algo semelhante a um mar de vidro[a], como cristal. E, no meio do trono e ao redor do trono[b], havia quatro seres viventes[c], cheios de olhos na frente e atrás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “um mar vítreo”. O grego apresenta uma comparação: “algo semelhante a um mar de vidro”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “no meio do trono e ao redor do trono” é espacialmente difícil; pode refletir a perspectiva da visão e foi mantida intencionalmente próxima do grego.
    reason: alternative_reading
  - marker: c
    text: Ou “quatro criaturas viventes”. A palavra grega não designa as “bestas” hostis mencionadas mais adiante em Apocalipse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa naturalmente a relação espacial com o trono e mantém o tom digno da cena visionária.
- source_word: ὡς
  choice: algo semelhante a
  rationale: Marca comparação, não identificação estrita, tornando explícito o caráter aproximativo da visão.
- source_word: θάλασσα ὑαλίνη
  choice: um mar de vidro
  rationale: Preserva a imagem vívida do sintagma grego; a nota registra a alternativa adjetival.
- source_word: ὁμοία κρυστάλλῳ
  choice: parecido com cristal
  rationale: Mantém a segunda comparação de modo natural e sem especificar além do texto se a ênfase recai na transparência ou no brilho.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: no meio do trono e ao redor do trono
  rationale: Conserva a difícil descrição espacial da visão, sem impor uma geometria harmonizada.
- source_word: ζῷα
  choice: seres viventes
  rationale: Designa seres animados e evita a associação hostil que “bestas” teria nas passagens posteriores de Apocalipse.
- source_word: γέμοντα ὀφθαλμῶν
  choice: cheios de olhos
  rationale: Reproduz de forma clara e idiomática a construção participial grega.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: na frente e atrás
  rationale: Par adverbial natural em português, preservando a distribuição espacial dos olhos.
theological_decisions:
- issue: Tradução de ζῷα na visão celestial do trono
  choice: seres viventes
  alternative: criaturas viventes; seres vivos; bestas
  rationale: A escolha preserva o sentido de seres animados junto ao trono e a ligação com a visão de Ezequiel, sem importar as conotações negativas das bestas hostis mencionadas depois em Apocalipse.
- issue: Tensão espacial em ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: manter “no meio do trono e ao redor do trono”
  alternative: harmonizar como “ao redor do trono, junto ao centro” ou interpretar como “entre o trono e o círculo ao redor dele”
  rationale: A formulação grega é espacialmente difícil e pode refletir a perspectiva visionária; a tradução preserva essa tensão em vez de resolvê-la por interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue sua ocorrência no texto. A formulação conserva as duas comparações e a dificuldade espacial do original.
