id: REV.4.9
reference: Revelation 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: pt
  text: E, sempre que os seres viventes derem glória, honra e ações de graças àquele que está sentado no trono, àquele que vive para todo o sempre[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para os séculos dos séculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: sempre que
  rationale: A expressão introduz uma circunstância temporal indefinida ou recorrente. “Sempre que” comunica melhor essa repetição do que o simples “quando”.
- source_word: δώσουσιν
  choice: derem
  rationale: O futuro do subjuntivo é a construção portuguesa natural depois de “sempre que” para uma ação projetada ou repetida, sem tentar reproduzir a irregularidade formal do futuro indicativo grego.
- source_word: τὰ ζῷα
  choice: os seres viventes
  rationale: No contexto de Apocalipse, o termo designa os seres junto ao trono, e não animais em geral. “Seres viventes” é claro, digno e não acrescenta aqui o número quatro, ausente deste versículo.
- source_word: δόξαν
  choice: glória
  rationale: “Glória” é o equivalente direto no contexto de adoração e preserva a distinção entre aquilo que é atribuído ao entronizado e o ato de louvar.
- source_word: τιμήν
  choice: honra
  rationale: “Honra” traduz diretamente o termo e forma uma tríade natural com “glória” e “ações de graças”.
- source_word: εὐχαριστίαν
  choice: ações de graças
  rationale: A expressão portuguesa corrente indica gratidão expressa em adoração e mantém o valor nominal do grego.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: àquele que está sentado no trono
  rationale: A formulação preserva a imagem de entronização e o valor descritivo do particípio, em português natural.
- source_word: τῷ ζῶντι
  choice: àquele que vive
  rationale: A repetição de “àquele” conserva a aposição enfática do grego e liga naturalmente o particípio à expressão de duração eterna.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Esta expressão idiomática portuguesa comunica duração sem fim com naturalidade e solenidade, enquanto a forma mais literal é registrada em nota.
theological_decisions:
- issue: Identificação daquele que está no trono sem explicitação ausente do texto
  choice: àquele que está sentado no trono, àquele que vive para todo o sempre
  alternative: a Deus, que está sentado no trono e vive para todo o sempre
  rationale: O texto grego identifica o referente por sua entronização e vida eterna, mas não insere explicitamente “Deus”. A tradução mantém os dois títulos em aposição e evita acrescentar uma identificação teológica não expressa neste versículo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. O futuro do subjuntivo depois de “sempre que” é idiomático em português. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
