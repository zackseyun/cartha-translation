id: REV.4.7
reference: Revelation 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: pt
  text: E o primeiro ser vivente era semelhante a um leão; o segundo ser vivente, semelhante a um novilho; o terceiro ser vivente tinha o rosto como o de um homem[a]; e o quarto ser vivente era semelhante a uma águia voando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um rosto humano”. O grego diz literalmente: “o rosto como o de um homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: ser vivente
  rationale: Expressa naturalmente um ser dotado de vida e distingue estes seres junto ao trono das bestas hostis designadas por θηρίον mais adiante em Apocalipse.
- source_word: ὅμοιον
  choice: semelhante a
  rationale: Preserva a ideia de semelhança, não de identidade, com formulação digna e corrente em português.
- source_word: λέοντι
  choice: leão
  rationale: Equivalente direto e natural do termo grego.
- source_word: μόσχῳ
  choice: novilho
  rationale: O termo designa um bovino jovem; “novilho” evita a possível associação moderna de “bezerro” apenas a um animal muito pequeno e não impõe conotação sacrificial.
- source_word: ἔχων
  choice: tinha
  rationale: Converte o particípio grego em verbo finito para produzir uma oração natural em português, mantendo sua força descritiva.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: o rosto como o de um homem
  rationale: Mantém πρόσωπον como “rosto” e preserva a comparação marcada por ὡς, sem reduzi-la à identificação simples “rosto humano”.
- source_word: ἀετῷ
  choice: águia
  rationale: É o equivalente usual e o que melhor se ajusta à imagem visionária, embora o termo possa designar uma grande ave de rapina em certos contextos.
- source_word: πετομένῳ
  choice: voando
  rationale: Traduz diretamente o particípio que descreve a águia em pleno ato de voar.
theological_decisions:
- issue: Sentido de ἀνθρώπου na descrição do terceiro ser vivente
  choice: o rosto como o de um homem
  alternative: um rosto humano
  rationale: A tradução principal preserva tanto o substantivo masculino singular quanto a relação comparativa do grego. A alternativa mais genérica é registrada em nota sem eliminar a forma concreta da fonte.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “ser vivente” acompanha a estrutura visionária do original; ponto e vírgula organiza as quatro descrições coordenadas.
