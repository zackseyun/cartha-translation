id: REV.4.3
reference: Revelation 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: pt
  text: E aquele que está sentado era semelhante, em aparência, a uma pedra de jaspe e a uma cornalina; e, ao redor do trono, havia um arco-íris[a] semelhante, em aparência, a uma esmeralda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um halo»; o termo grego pode indicar um resplendor semelhante a um arco-íris.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: aquele que estava sentado
  rationale: O particípio substantivado refere-se à figura entronizada e descreve sua postura contínua de modo natural em português.
- source_word: ὅμοιος ὁράσει
  choice: tinha aparência semelhante a / com aparência semelhante a
  rationale: Preserva o sentido de semelhança visual, sem afirmar que a figura ou o arco-íris fossem literalmente constituídos das pedras mencionadas.
- source_word: λίθῳ ἰάσπιδι
  choice: uma pedra de jaspe
  rationale: Mantém tanto o substantivo 'pedra' quanto a identificação tradicional e inteligível do jaspe.
- source_word: σαρδίῳ
  choice: uma cornalina
  rationale: Cornalina é uma designação moderna e compreensível da pedra avermelhada indicada pelo termo grego, preferível ao opaco 'sárdio'.
- source_word: ἶρις
  choice: arco-íris
  rationale: É o equivalente mais direto neste contexto visionário; uma irradiação semelhante a um halo continua possível e é registrada em nota.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: ao redor do trono
  rationale: Expressa claramente a posição circundante indicada por κυκλόθεν.
- source_word: σμαραγδίνῳ
  choice: à esmeralda
  rationale: Equivalente natural da referência à tonalidade ou aparência de esmeralda, dentro de uma comparação visual.
theological_decisions:
- issue: Descrição da figura entronizada por meio de comparação, não de identificação material
  choice: Manter explicitamente a linguagem de aparência e semelhança
  alternative: Dizer que a figura era de jaspe e cornalina ou que emitia as cores dessas pedras
  rationale: O grego emprega linguagem comparativa e visionária; a tradução não deve transformar semelhança visual em composição física nem resolver a transcendência da cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'aparência semelhante' reflete a estrutura comparativa do grego sem tornar a frase excessivamente literal.
