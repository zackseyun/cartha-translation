id: REV.6.9
reference: Revelation 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: pt
  text: Quando ele abriu o quinto selo, vi, debaixo do altar, as almas dos que haviam sido imolados[a] por causa da palavra de Deus e por causa do testemunho[b] que tinham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “massacrados”. O verbo grego indica morte violenta e pode ter ressonância sacrificial.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode referir-se ao ato de testemunhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: abriu
  rationale: Tradução direta e natural de ἀνοίγω na sequência da abertura dos selos.
- source_word: σφραγῖδα
  choice: selo
  rationale: Termo consagrado e preciso para σφραγίς na imagem apocalíptica.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: debaixo do altar
  rationale: Preserva a relação espacial e a imagem cultual sem especificar além do texto a natureza do altar.
- source_word: ψυχὰς
  choice: almas
  rationale: Mantém a forma específica da visão, na qual João vê os mortos sob o altar, sem converter a expressão em uma afirmação antropológica mais ampla.
- source_word: ἐσφαγμένων
  choice: haviam sido imolados
  rationale: σφάζω indica morte violenta e pode evocar abate sacrificial; “imolados” conserva essa ressonância, reforçada pela presença do altar.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: por causa da palavra de Deus
  rationale: διά com acusativo expressa aqui a causa; a formulação é clara e natural em português.
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: Preserva o sentido confessional e a possível referência tanto ao conteúdo testemunhado quanto ao ato de testemunhar.
- source_word: ἣν εἶχον
  choice: que tinham
  rationale: Segue de perto o imperfeito de ἔχω e evita acrescentar ideias como perseverar ou proclamar, que não estão explicitadas.
theological_decisions:
- issue: Natureza de ψυχὰς na cena visionária
  choice: Traduzir como “almas”.
  alternative: “vidas” ou “pessoas”
  rationale: “Almas” preserva a imagem apresentada na visão sem impor uma conclusão doutrinária sobre o estado dos mortos para além desta cena.
- issue: Força de ἐσφαγμένων
  choice: Usar “haviam sido imolados”.
  alternative: “haviam sido massacrados” ou “haviam sido mortos”
  rationale: A opção principal conserva tanto a violência do verbo quanto sua ressonância sacrificial em associação com o altar; a nota registra uma alternativa que enfatiza a violência sem explicitar o aspecto sacrificial.
- issue: Sentido de μαρτυρία
  choice: Manter “testemunho” sem decidir entre conteúdo testemunhado e ato de testemunhar.
  alternative: “testemunho que davam”
  rationale: A formulação mais literal preserva a ambiguidade do grego e evita transformar a posse do testemunho explicitamente em atividade de proclamação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A repetição de “por causa de” foi mantida para refletir a estrutura enfática do grego.
