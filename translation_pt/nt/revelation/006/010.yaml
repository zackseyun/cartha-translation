- from: 'E clamaram em alta voz: “Até quando, Soberano, santo e verdadeiro, deixarás de julgar e de vingar o nosso sangue dos que habitam sobre a terra?”'
  to: 'E clamaram em alta voz: “Até quando, Soberano, santo e verdadeiro, te absterás de julgar e de vingar o nosso sangue dos que habitam sobre a terra?”'
  rationale: Substitui-se «deixarás de julgar e de vingar» por «te absterás de julgar e de vingar» para evitar a leitura de que Deus cessaria uma ação já em curso. A revisão mantém a pergunta de lamento sobre a demora, a força judicial-retributiva de ἐκδικεῖς e a relação expressa por ἐκ com «dos que habitam sobre a terra».
