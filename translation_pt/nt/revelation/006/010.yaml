review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o clamor, o tratamento divino distinto de κύριος, os adjetivos «santo e verdadeiro» e o pedido explícito de julgamento e retribuição. Contudo, «deixarás de julgar» pode ser entendido, em português, como cessar um julgamento que já ocorre, invertendo ou ao menos obscurecendo a queixa sobre a demora da ação divina.
  naturalness: «Clamaram em alta voz» e «Soberano» são naturais e adequados ao registro. «Até quando ... deixarás de julgar» é menos claro no português atual; «te absterás de julgar» expressa de modo inequívoco a continuação da demora questionada no grego.
  terminology: «Soberano» representa adequadamente δεσπότης sem acrescentar «Senhor». «Vingar o nosso sangue dos que habitam sobre a terra» conserva tanto a imagem bíblica quanto a formulação temática de Apocalipse.
  issues:
  - severity: medium
    issue: Ambiguidade aspectual em «deixarás de julgar e de vingar»
    rationale: Em uso normal, «deixar de + infinitivo» tende a significar interromper uma ação. No contexto, pode ser recuperado como «continuar sem», mas não é a formulação mais segura para οὐ κρίνεις καὶ ἐκδικεῖς após Ἕως πότε, que pergunta pela demora do julgamento e da retribuição.
  revised_text: 'E clamaram em alta voz: “Até quando, Soberano, santo e verdadeiro, te absterás de julgar e de vingar o nosso sangue dos que habitam sobre a terra?”'
