id: REV.6.10
reference: Revelation 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: pt
  text: 'E clamaram em alta voz: “Até quando, Soberano, santo e verdadeiro, te absterás de julgar e de vingar o nosso sangue dos que habitam sobre a terra?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: clamaram
  rationale: O aoristo de κράζω indica um clamor intenso e urgente; “clamaram” mantém a força e o registro digno.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressa naturalmente em português a maneira do clamor, preservando a imagem concreta da voz.
- source_word: Ἕως πότε
  choice: Até quando
  rationale: Fórmula idiomática tradicional e atual de lamento diante de uma ação esperada que tarda.
- source_word: δεσπότης
  choice: Soberano
  rationale: δεσπότης ressalta autoridade absoluta e difere de κύριος; “Soberano” preserva essa nuance sem recorrer ao menos natural “Mestre” como tratamento dirigido a Deus neste contexto.
- source_word: ἅγιος καὶ ἀληθινός
  choice: santo e verdadeiro
  rationale: Tradução direta que preserva tanto a santidade quanto a veracidade, autenticidade e confiabilidade atribuídas a Deus.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: deixarás de julgar e de vingar
  rationale: No apelo introduzido por “Até quando”, o presente grego com οὐ pergunta pela demora da ação. Esta formulação comunica em português a expectativa de que Deus finalmente julgue e vingue, sem converter a pergunta em simples declaração futura.
- source_word: τὸ αἷμα ἡμῶν
  choice: o nosso sangue
  rationale: Conserva a expressão bíblica concreta para a vida violentamente tirada e evita explicar em excesso o martírio.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: dos que habitam sobre a terra
  rationale: O ἐκ pode assinalar aqueles de quem se exige a vingança ou contra quem ela recai. “Dos” conserva essa relação de modo natural e mantém a expressão temática de Apocalipse.
theological_decisions:
- issue: Tratamento divino δεσπότης
  choice: Soberano
  alternative: Senhor soberano; Mestre; Senhor
  rationale: A opção conserva a ênfase em autoridade absoluta e mantém a distinção lexical em relação a κύριος, sem acrescentar “Senhor” ao termo grego.
- issue: Força do pedido dos mártires por justiça
  choice: julgar e vingar o nosso sangue
  alternative: julgar e fazer justiça por causa do nosso sangue
  rationale: O texto pede explicitamente julgamento e retribuição divina pelo sangue derramado. “Vingar” preserva a tensão judicial-retributiva, sem atribuir aos mártires a execução de vingança pessoal.
- issue: Valor da pergunta οὐ κρίνεις καὶ ἐκδικεῖς após Ἕως πότε
  choice: Até quando ... deixarás de julgar e de vingar
  alternative: Até quando não julgarás nem vingarás; Até quando te absterás de julgar e vingar
  rationale: A construção é uma queixa sobre a demora da intervenção divina. A tradução escolhida reproduz esse sentido em português natural sem apagar a forma interrogativa e sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Clamaram” e “Soberano” mantêm o tom solene sem arcaísmo excessivo; “os que habitam sobre a terra” preserva a formulação recorrente de Apocalipse.
