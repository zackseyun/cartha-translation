id: REV.6.7
reference: Revelation 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: pt
  text: 'Quando ele abriu o quarto selo, ouvi a voz do quarto ser vivente dizer: “Venha.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Vá”. O grego diz mais literalmente “Venha”, mas há divergência sobre se a ordem é dirigida a João ou ao cavaleiro.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: abriu
  rationale: Equivalente natural do aoristo de ἀνοίγω e formulação adequada para a abertura dos selos do rolo em Apocalipse 6.
- source_word: σφραγῖδα
  choice: selo
  rationale: Termo corrente e preciso para o selo do rolo que é aberto nesta sequência visionária.
- source_word: τετάρτην / τετάρτου
  choice: quarto
  rationale: Os dois ordinais são traduzidos de modo direto e coerente.
- source_word: φωνὴν
  choice: a voz
  rationale: Embora φωνή não tenha artigo no grego, a expressão é definida pelo genitivo ‘do quarto ser vivente’; ‘a voz’ é natural em português.
- source_word: ζῴου
  choice: ser vivente
  rationale: Designa os seres da sala do trono e evita confusão com θηρίον, normalmente traduzido como ‘besta’. ‘Ser vivente’ é claro e digno em português.
- source_word: λέγοντος
  choice: dizer
  rationale: Depois de ‘ouvi a voz’, o infinitivo ‘dizer’ reproduz naturalmente a construção participial grega.
- source_word: Ἔρχου
  choice: Venha
  rationale: O imperativo de ἔρχομαι significa mais diretamente ‘venha’. A tradução não explicita o destinatário, preservando a ambiguidade do texto.
theological_decisions:
- issue: Destinatário do imperativo Ἔρχου
  choice: Traduzir apenas como “Venha”, sem identificar o destinatário.
  alternative: Entender a ordem como dirigida a João ou ao cavaleiro e vertê-la interpretativamente como “Saia” ou “Avance”.
  rationale: O grego não identifica expressamente o destinatário. A ordem isolada conserva a tensão narrativa e evita decidir uma questão interpretativa na tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem principal é natural em português, e a nota preserva a alternativa contextual sem substituir o sentido lexical mais direto.
