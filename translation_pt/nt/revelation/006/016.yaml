id: REV.6.16
reference: Revelation 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: pt
  text: 'e dizem aos montes e às rochas: “Caiam sobre nós e escondam-nos da face daquele que está sentado no trono e da ira do Cordeiro,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: dizem
  rationale: O presente do indicativo mantém o presente vívido da narrativa apocalíptica, sem convertê-lo desnecessariamente em passado.
- source_word: ὄρεσιν
  choice: aos montes
  rationale: ὄρος designa normalmente um monte ou uma montanha; “montes” é natural em português e preserva a força da imagem.
- source_word: πέτραις
  choice: às rochas
  rationale: πέτρα indica rocha ou massa rochosa; “rochas” é claro, corrente e adequado ao paralelismo com “montes”.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Caiam sobre nós
  rationale: O imperativo aoristo plural expressa uma ordem urgente e direta; “caiam sobre nós” reproduz naturalmente a construção grega.
- source_word: κρύψατε ἡμᾶς
  choice: escondam-nos
  rationale: A forma conserva o imperativo plural e comunica de maneira direta o pedido para serem ocultados.
- source_word: ἀπὸ προσώπου
  choice: da face de
  rationale: πρόσωπον significa literalmente “face”. A expressão é compreensível em português e preserva a imagem vívida do encontro pessoal, embora “presença” seja uma interpretação contextual possível.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: daquele que está sentado no trono
  rationale: A expressão representa com clareza o particípio substantivado e o estado contínuo daquele que ocupa o trono.
- source_word: ὀργῆς
  choice: ira
  rationale: Em contexto de juízo, ὀργή tem força maior que simples irritação ou raiva; “ira” conserva a gravidade escatológica.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: ἀρνίον funciona em Apocalipse como título cristológico estabelecido; “Cordeiro” preserva o paradoxo entre sacrifício e autoridade judicial.
theological_decisions:
- issue: Os agentes divino e messiânico no juízo apocalíptico
  choice: Manter distintamente “daquele que está sentado no trono” e “da ira do Cordeiro” como expressões coordenadas.
  alternative: Reduzir ambas as referências a uma menção geral a Deus ou suavizar “ira do Cordeiro”.
  rationale: O grego apresenta duas expressões coordenadas regidas por ἀπό, uma referente ao entronizado e outra ao Cordeiro. A tradução preserva a tensão teológica intencional de que o Cordeiro sacrificial também exerce juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o presente vívido e a imagem literal “da face”, sem acrescentar nota porque o texto fornecido atribui a nota inglesa a um marcador posicionado após “rocks”, embora seu conteúdo trate de “face/presence”; para não introduzir um marcador incoerente, a alternativa foi registrada na decisão lexical.
