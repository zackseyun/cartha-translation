    rationale: Embora ὡς καὶ αὐτοί elida «mortos» no grego, «tinham sido» em português requer complemento e fica gramatical e estilisticamente incompleto. «Assim como eles próprios foram mortos» explicita apenas o verbo elidido, sem acrescentar interpretação.
  - severity: low
    issue: «Se completassem» enfraquece a voz passiva de πληρωθῶσιν
    rationale: A forma pronominal pode ser lida como reflexiva ou incoativa. «Fossem completados» conserva de modo mais transparente o passivo grego, mantendo indeterminado em que sentido o grupo é completado.
  - severity: low
    issue: Âncoras das notas ao fim do versículo
    rationale: A nota sobre πληρωθῶσιν deve seguir «completados», e a nota sobre ἀδελφοί deve seguir «irmãos», para que cada esclarecimento tenha referente imediato.
