  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow slaves and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: pt
  text: E foi dada a cada um deles uma veste branca, e lhes foi dito que descansassem ainda por pouco tempo, até que também fossem completados[a] os seus coescravos e os seus irmãos[b] que estavam para ser mortos, assim como eles próprios foram mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que também fossem cumpridos os seus coescravos e os seus irmãos”; também se pode entender: “até que se completasse o número dos seus coescravos e irmãos”. O grego diz apenas que eles seriam “completados” ou “cumpridos”, sem empregar a palavra “número”.'
    reason: Preservar a ambiguidade de πληρωθῶσιν e registrar a interpretação numérica comum sem inseri-la no texto principal.
  - marker: b
    text: Aqui, “irmãos” pode designar de modo mais amplo os demais fiéis, incluindo mulheres, embora o grego use o substantivo masculino plural ἀδελφοί.
    reason: Esclarecer o possível alcance inclusivo do termo sem alterar sua forma na tradução principal.
lexical_decisions:
- source_word: στολὴ λευκή
  choice: uma veste branca
  rationale: στολή designa uma veste longa ou solene; “veste” é natural e digna em português, enquanto λευκή significa diretamente “branca”.
- source_word: ἑκάστῳ
  choice: a cada um deles
  rationale: Reproduz o valor distributivo do dativo singular e deixa claro que cada pessoa recebeu uma veste.
- source_word: ἐρρέθη αὐτοῖς
  choice: lhes foi dito
  rationale: Preserva a construção passiva do grego sem tornar a frase artificial em português.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: descansassem ainda por pouco tempo
  rationale: “Descansar” conserva o sentido de cessar da atividade ou do sofrimento, e “ainda por pouco tempo” expressa a força temporal de ἔτι χρόνον μικρόν.
- source_word: πληρωθῶσιν
  choice: se completassem
  rationale: Mantém a ideia passiva e ampla de completar ou levar à plenitude, sem inserir explicitamente “número”, palavra ausente do grego.
- source_word: σύνδουλοι
  choice: coescravos
  rationale: O termo indica pessoas que são escravas juntamente com outras, sob o mesmo senhor. “Coescravos” preserva de modo conciso tanto a condição de escravidão quanto a relação compartilhada.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do texto grego; o possível uso representativo para toda a comunidade cristã é esclarecido em nota.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: que estavam para ser mortos
  rationale: Expressa a ação futura ou iminente sem introduzir uma noção mais forte de destino predeterminado.
- source_word: ὡς καὶ αὐτοί
  choice: assim como eles próprios tinham sido
  rationale: Retoma de maneira clara a morte dos que estavam debaixo do altar; “próprios” comunica a ênfase do pronome, e o verbo subentendido é suprido naturalmente em português.
theological_decisions:
- issue: Sentido de πληρωθῶσιν aplicado aos coescravos e irmãos
  choice: se completassem
  alternative: até que se completasse o número dos seus coescravos e irmãos
  rationale: O contexto permite entender a conclusão do número de mártires, mas o grego não traz a palavra “número”. A formulação escolhida preserva a ambiguidade entre completar o grupo e cumprir aquilo que lhes caberia.
- issue: Abrangência de ἀδελφοί
  choice: irmãos, com nota sobre possível referência inclusiva
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural da fonte, sem negar que, no uso cristão antigo, ela possa abranger mulheres.
- issue: Força social e teológica de σύνδουλοι
  choice: coescravos
  alternative: companheiros de serviço
  rationale: A imagem de pessoas pertencentes ao mesmo senhor é relevante no Apocalipse; “serviço” suavizaria a condição expressa pela família lexical de δοῦλος.
translation_notes:
  register: Português moderno, corrente e solene, com boa legibilidade brasileira. “Coescravos” é menos frequente no uso cotidiano, mas foi mantido por precisão lexical e pela importância da imagem de pertencimento ao mesmo senhor. A sintaxe de “se completassem” é deliberadamente pouco interpretativa para conservar a tensão do original.
