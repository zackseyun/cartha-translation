revisions:
- from: E foi dada a cada um deles uma veste branca, e lhes foi dito que descansassem ainda por pouco tempo, até que também se completassem os seus coescravos e os seus irmãos que estavam para ser mortos, assim como eles próprios tinham sido.[a][b]
  to: E foi dada a cada um deles uma veste branca, e lhes foi dito que descansassem ainda por pouco tempo, até que também fossem completados[a] os seus coescravos e os seus irmãos[b] que estavam para ser mortos, assim como eles próprios foram mortos.
  rationale: A revisão explicita «mortos» na comparação final, pois essa é a elipse exigida pelo contexto e pelo particípio «os que estavam para ser mortos». Também substitui a construção pronominal por um passivo explícito para refletir πληρωθῶσιν e reposiciona as âncoras das notas junto às expressões explicadas. Nenhuma dessas alterações especifica que se trata do «número» dos mártires.
