  naturalness: O registro é apropriado e «coescravos» é defensável neste contexto. A oração final precisa explicitar «mortos» para ser idiomática e clara. A posição das notas também deve ficar junto dos termos a que se referem.
  terminology: «Veste branca», «coescravos», «irmãos» e «descansassem ainda por pouco tempo» são escolhas adequadas. «Fossem completados» preserva a voz passiva e a ambiguidade de πληρωθῶσιν melhor que uma expansão interpretativa com «número».
