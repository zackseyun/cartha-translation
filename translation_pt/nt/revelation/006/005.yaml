id: REV.6.5
reference: Revelation 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: pt
  text: 'E, quando ele abriu o terceiro selo, ouvi o terceiro ser vivente dizer: “Venha.”[a] Então olhei, e eis um cavalo preto; e aquele que estava montado nele tinha na mão uma balança.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venha até aqui”. A ordem pode ser entendida como dirigida a João ou como uma convocação ao cavalo e àquele que o monta.'
    reason: alternative_reading
  - marker: b
    text: O termo grego também pode significar “jugo”; neste contexto, provavelmente se refere a uma balança usada para pesar alimentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: abriu
  rationale: Tradução direta e natural de ἀνοίγω no contexto da abertura de um selo.
- source_word: σφραγῖδα τὴν τρίτην
  choice: o terceiro selo
  rationale: Preserva diretamente a ordem da sequência visionária.
- source_word: ζῴου
  choice: ser vivente
  rationale: Distingue esses seres da sala do trono de animais comuns e corresponde ao uso de ζῷον em Apocalipse.
- source_word: Ἔρχου
  choice: Venha
  rationale: Mantém o imperativo breve e não explicita seu destinatário, que permanece ambíguo no grego.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: olhei, e eis
  rationale: Reproduz a progressão vívida da visão sem a repetição pouco natural de 'vi, e eis'.
- source_word: ἵππος μέλας
  choice: um cavalo preto
  rationale: Tradução literal que preserva a cor relevante para o simbolismo da visão.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: aquele que estava montado nele
  rationale: Reflete a expressão participial grega com clareza e naturalidade em português, sem reduzi-la simplesmente a 'cavaleiro'.
- source_word: ζυγὸν
  choice: uma balança
  rationale: Embora o termo também possa significar 'jugo', o contexto imediato de pesagem e racionamento de alimentos em 6.6 favorece uma balança.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: na mão
  rationale: Forma portuguesa direta e idiomática; o possuidor fica claro pelo sujeito da oração.
theological_decisions:
- issue: Destinatário do imperativo Ἔρχου
  choice: 'O destinatário não é especificado: “Venha”.'
  alternative: Pode ser um chamado dirigido a João ou uma convocação ao cavalo e a quem o monta.
  rationale: O grego deixa implícito o destinatário; a tradução preserva essa ambiguidade em vez de impor uma interpretação.
- issue: Sentido de ζυγός
  choice: balança
  alternative: jugo
  rationale: O campo lexical permite ambos, mas a fala sobre preços e medidas no versículo seguinte torna 'balança' a leitura contextual mais provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o tom visionário por meio de “e eis” e mantém as ambiguidades reais do texto grego.
