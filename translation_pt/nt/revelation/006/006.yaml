id: REV.6.6
reference: Revelation 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: pt
  text: 'E ouvi algo como uma voz no meio dos quatro seres viventes, dizendo: “Um litro[a] de trigo por um denário[b], e três litros de cevada por um denário; e não cause dano[c] ao azeite nem ao vinho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego χοῖνιξ designa uma medida seca de aproximadamente um litro, muitas vezes entendida como a ração diária de cereal de uma pessoa.
    reason: cultural_note
  - marker: b
    text: Um denário correspondia, em geral, ao salário de um dia de trabalho; os preços anunciados aqui retratam uma escassez severa.
    reason: cultural_note
  - marker: c
    text: 'Ou: “não danifique” ou “não prejudique”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: algo como uma voz
  rationale: Expressa a percepção comparativa ou aproximativa marcada por ὡς, sem afirmar além do texto a identidade exata de quem fala.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: no meio dos quatro seres viventes
  rationale: Preserva a localização espacial e distingue esses seres do trono das figuras hostis posteriormente chamadas de bestas em Apocalipse.
- source_word: λέγουσαν
  choice: dizendo
  rationale: Reproduz naturalmente o particípio presente que concorda com “voz” e introduz a fala direta.
- source_word: χοῖνιξ
  choice: litro
  rationale: A χοῖνιξ era uma medida seca de aproximadamente um litro. O equivalente arredondado torna a quantidade imediatamente compreensível, enquanto a nota esclarece seu caráter antigo e aproximado.
- source_word: σίτου
  choice: trigo
  rationale: É o sentido adequado no contraste explícito com a cevada.
- source_word: δηναρίου
  choice: por um denário
  rationale: Traduz naturalmente o genitivo de preço e mantém a moeda histórica, cujo valor econômico é explicado em nota.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: três litros de cevada
  rationale: Mantém a correspondência quantitativa com a primeira medida e traduz κριθή como “cevada”.
- source_word: μὴ ἀδικήσῃς
  choice: não cause dano
  rationale: No contexto de produtos agrícolas, ἀδικέω admite o sentido de prejudicar ou danificar. A formulação preserva a amplitude do verbo e a proibição na segunda pessoa do singular.
- source_word: τὸ ἔλαιον
  choice: o azeite
  rationale: No contexto mediterrâneo, ἔλαιον se refere normalmente ao azeite de oliva; “azeite” é a forma corrente e clara em português.
- source_word: τὸν οἶνον
  choice: o vinho
  rationale: Correspondência direta e usual de οἶνος.
theological_decisions:
- issue: Designação dos ζῷα na visão do trono
  choice: seres viventes
  alternative: animais; bestas
  rationale: “Seres viventes” representa a natureza visionária dessas figuras e evita confundi-las com as bestas hostis que aparecem mais adiante em Apocalipse.
- issue: Representação da medida antiga χοῖνιξ e da moeda δηνάριον
  choice: converter aproximadamente χοῖνιξ em litro e conservar denário
  alternative: transliterar ambos os termos; usar “medida” sem equivalência; converter também a moeda
  rationale: A solução comunica o volume ao leitor moderno sem substituir a moeda histórica por um valor monetário moderno, necessariamente instável e impreciso. As notas preservam o contexto de ração diária e salário.
- issue: Alcance da ordem relativa ao azeite e ao vinho
  choice: não cause dano
  alternative: não danifique; não prejudique
  rationale: A tradução não especifica se o dano é físico, agrícola ou econômico, preservando a abertura semântica de ἀδικέω e a tensão da cena.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Algo como uma voz” conserva a cautela perceptiva do grego; “azeite” é preferido a “óleo” por clareza contextual. A coordenação negativa “nem” é idiomática em português.
