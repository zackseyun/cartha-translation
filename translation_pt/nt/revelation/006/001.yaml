id: REV.6.1
reference: Revelation 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: pt
  text: 'E vi, quando o Cordeiro abriu um dos sete selos, e ouvi um dos quatro seres viventes dizer, com voz como de trovão: “Venha!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Avance!”, caso a ordem seja entendida como dirigida ao cavaleiro, e não a João.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: o Cordeiro
  rationale: Em Apocalipse, o diminutivo funciona como título cristológico; “o Cordeiro” é a forma consagrada e natural em português, sem impor uma nuance diminutiva desnecessária.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: um dos sete selos
  rationale: Expressão partitiva vertida de modo idiomático, preservando a referência a um único selo entre os sete.
- source_word: ζῴων
  choice: seres viventes
  rationale: No contexto da sala do trono, refere-se a seres celestiais, não a animais comuns; “seres viventes” evita uma associação meramente zoológica.
- source_word: ὡς φωνῇ βροντῆς
  choice: com voz como de trovão
  rationale: Mantém explicitamente a comparação da voz com o trovão em linguagem clara e digna.
- source_word: Ἔρχου
  choice: Venha!
  rationale: O imperativo significa mais diretamente “venha”; a forma não identifica expressamente o destinatário, e a alternativa interpretativa é preservada em nota.
- source_word: ὅτε
  choice: quando
  rationale: Representa diretamente o valor temporal da conjunção.
- source_word: εἶδον
  choice: vi
  rationale: Tradução simples do aoristo narrativo, sem acrescentar um verbo como “olhei” que não está no grego.
- source_word: ἤκουσα
  choice: ouvi
  rationale: Equivalente português direto e natural no encadeamento narrativo.
- source_word: λέγοντος
  choice: dizer
  rationale: A construção infinitiva portuguesa após “ouvi” expressa naturalmente o particípio grego sem intensificar indevidamente o modo da fala.
theological_decisions:
- issue: Referente e força da ordem Ἔρχου
  choice: Traduzir como “Venha!”, sem identificar o destinatário no texto principal.
  alternative: “Avance!”, caso a ordem seja entendida como dirigida ao cavaleiro, e não a João.
  rationale: O grego traz simplesmente o imperativo “venha” e não explicita o destinatário. O texto principal preserva essa abertura, enquanto a nota registra a interpretação alternativa conhecida.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecível. “Seres viventes” mantém o caráter exaltado das figuras; “Venha!” preserva a ambiguidade do destinatário.
