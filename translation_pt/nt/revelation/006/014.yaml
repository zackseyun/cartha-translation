id: REV.6.14
reference: Revelation 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: pt
  text: O céu se afastou, como um rolo que se enrola[a][b], e todo monte e toda ilha foram deslocados de seus lugares[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi separado” ou “se retirou”; o verbo grego pode indicar separação ou afastamento.
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere a um rolo escrito, não a um livro moderno encadernado.
    reason: cultural_note
  - marker: c
    text: 'Também se pode traduzir distributivamente: “cada um do seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: céu
  rationale: No contexto da visão, designa a expansão celeste visível. “Céu” é a forma portuguesa natural e mantém a amplitude que o termo grego pode ter sem afirmar que a morada de Deus deixou de existir.
- source_word: ἀπεχωρίσθη
  choice: se afastou
  rationale: O verbo indica separação ou retirada. “Se afastou” preserva esse campo sem reduzir a imagem ao simples desaparecimento nem especificar de que modo o céu se separou.
- source_word: βιβλίον
  choice: rolo
  rationale: Trata-se de um suporte escrito enrolável do mundo antigo, não de um livro moderno encadernado; a ação seguinte confirma essa imagem.
- source_word: ἑλισσόμενον
  choice: que se enrola
  rationale: Expressa de modo claro e natural a ação contínua do particípio, mantendo a comparação visual.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: todo monte e toda ilha
  rationale: A repetição de “todo/toda” comunica naturalmente em português a força distributiva do grego com substantivos no singular.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: de seus lugares
  rationale: Mantém o plural do grego e indica que montes e ilhas foram retirados de suas respectivas posições.
- source_word: ἐκινήθησαν
  choice: foram deslocados
  rationale: No contexto, o movimento é para fora do lugar, não apenas uma agitação ou tremor; “deslocados” torna essa mudança de posição explícita.
theological_decisions:
- issue: Alcance de οὐρανός na imagem apocalíptica
  choice: Traduzir por “céu” no sentido da expansão celeste visível
  alternative: Entender como referência direta à morada de Deus
  rationale: A cena descreve uma perturbação cósmica visível. A tradução não deve acrescentar uma afirmação sobre a morada divina que o contexto não exige.
- issue: Natureza da ação atribuída ao céu
  choice: Preservar a ideia de afastamento ou retirada
  alternative: Traduzir exclusivamente como “desapareceu” ou como “foi rasgado”
  rationale: O verbo permite separação ou retirada, enquanto a comparação com o rolo não define com precisão o mecanismo. A formulação escolhida conserva essa tensão imagética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a intensidade da visão apocalíptica, evita vocabulário técnico e conserva as ambiguidades relevantes do verbo ἀπεχωρίσθη.
