id: REV.6.15
reference: Revelation 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every slave and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: pt
  text: E os reis da terra, os grandes, os comandantes, os ricos, os poderosos, e todos, tanto escravos como livres, esconderam-se nas cavernas e entre as rochas das montanhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: reis da terra
  rationale: Em Apocalipse, a expressão recorrente tem alcance mundial e, neste contexto de juízo cósmico, γῆ é mais bem traduzido por “terra” do que por “região”.
- source_word: μεγιστᾶνες
  choice: os grandes
  rationale: Designa pessoas de alta posição ou proeminência. “Os grandes” preserva a concisão e evita restringir o sentido à nobreza hereditária.
- source_word: χιλίαρχοι
  choice: os comandantes
  rationale: Embora o termo designe literalmente comandantes de mil, “comandantes” comunica de modo natural a categoria militar sem impor uma equivalência moderna exata de patente.
- source_word: πλούσιοι
  choice: os ricos
  rationale: O adjetivo substantivado é vertido de forma direta, concisa e corrente.
- source_word: ἰσχυροὶ
  choice: os poderosos
  rationale: Neste catálogo de grupos sociais, “poderosos” expressa naturalmente força e influência; “fortes” poderia sugerir sobretudo vigor físico.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: todos, tanto escravos como livres
  rationale: A formulação preserva o contraste explícito de condição social e a força representativa da dupla masculina singular, abrangendo as pessoas de ambas as categorias sem restringi-las aos homens.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: esconderam-se
  rationale: Equivalência reflexiva direta e idiomática em português.
- source_word: εἰς τὰ σπήλαια
  choice: nas cavernas
  rationale: Depois de “esconderam-se”, o português emprega naturalmente a localização com “em”, embora εἰς possa também indicar movimento para dentro.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: entre as rochas das montanhas
  rationale: “Entre as rochas” comunica de modo idiomático o esconderijo em formações ou fendas rochosas das montanhas, evitando o pouco natural “para dentro das rochas”.
theological_decisions:
- issue: Tradução de δοῦλος no contraste escravo/livre
  choice: escravos
  alternative: servos
  rationale: O contraste imediato com ἐλεύθερος torna explícita a condição jurídica e social de escravidão; “escravos” preserva essa força melhor que “servos”.
- issue: Representação de gênero em πᾶς δοῦλος καὶ ἐλεύθερος
  choice: todos, tanto escravos como livres
  alternative: todo escravo e todo homem livre
  rationale: Embora os termos gregos estejam no masculino singular, a dupla social tem força representativa e abrange todas as pessoas; a redação escolhida mantém isso sem acrescentar especificidade masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém o ritmo cumulativo do grego sem repetir a conjunção antes de cada grupo, o que seria pesado em português. Não foram necessárias notas textuais ou lexicais no versículo.
