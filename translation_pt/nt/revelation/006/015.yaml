  source_fidelity: 'O texto preserva com precisão a sequência das categorias sociais e de poder: reis, pessoas proeminentes, comandantes, ricos, poderosos e a dupla abrangente escravos/livres. «Terra» corresponde adequadamente a γῆ no horizonte cósmico de Apocalipse, e «esconderam-se» traduz o reflexivo ἔκρυψαν ἑαυτούς. «Nas cavernas e entre as rochas das montanhas» é idiomático e mantém o sentido dos dois destinos introduzidos por εἰς.'
