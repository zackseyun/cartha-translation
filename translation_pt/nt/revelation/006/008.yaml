id: REV.6.8
reference: Revelation 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: pt
  text: E olhei, e eis um cavalo verde-pálido,[a] e o nome daquele que estava montado nele era Morte, e o Hades o seguia. Foi-lhes dada autoridade sobre a quarta parte da terra, para matar pela espada, pela fome, pela peste[b] e pelas feras da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cavalo pálido”. O grego χλωρός indica literalmente uma cor verde ou esverdeada e, neste contexto, sugere uma palidez doentia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, literalmente: “pela morte”. Aqui, “peste” reflete o sentido contextual de θάνατος numa conhecida lista de juízos que ecoa Ezequiel 14.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: verde-pálido
  rationale: Preserva a tonalidade esverdeada expressa pelo termo grego e, ao mesmo tempo, sua associação contextual com uma palidez doentia ou cadavérica.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: aquele que estava montado nele
  rationale: Expressa naturalmente em português a figura sentada sobre o cavalo, sem substituir a construção por um título interpretativo.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: o nome daquele que estava montado nele era Morte
  rationale: Mantém explícita a fórmula de nomeação e a personificação presente no grego.
- source_word: Θάνατος
  choice: Morte
  rationale: A inicial maiúscula sinaliza que a morte aparece personificada como o nome daquele que monta o cavalo.
- source_word: ᾅδης
  choice: Hades
  rationale: Translitera o termo que designa o domínio dos mortos, evitando identificá-lo indevidamente com o inferno do juízo final.
- source_word: ἠκολούθει μετ’ αὐτοῦ
  choice: o seguia
  rationale: Em português, esta formulação transmite com naturalidade que o Hades acompanhava aquele que montava o cavalo; a combinação grega de 'seguir' com 'com ele' não deve ser reproduzida de modo artificial.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: Foi-lhes dada autoridade
  rationale: Preserva o plural, a ideia de autoridade delegada e o passivo característico do texto.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: sobre a quarta parte da terra
  rationale: Representa diretamente a fração e mantém o alcance amplo de γῆ neste cenário de juízo.
- source_word: ἐν ῥομφαίᾳ
  choice: pela espada
  rationale: Traduz o instrumento ou meio de morte de maneira idiomática e solene.
- source_word: ἐν λιμῷ
  choice: pela fome
  rationale: No contexto da lista de juízos, designa a fome coletiva ou escassez; 'pela fome' é mais corrente em português do que 'pela carestia'.
- source_word: ἐν θανάτῳ
  choice: pela peste
  rationale: Na fórmula tradicional de juízos que ecoa Ezequiel, θάνατος pode representar a peste; a leitura literal permanece em nota.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: pelas feras da terra
  rationale: Preserva a mudança de construção grega e identifica animais selvagens como agentes da morte.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: inferno; morada dos mortos
  rationale: O texto distingue a Morte personificada do Hades que a acompanha. 'Inferno' poderia importar a noção específica de punição final, enquanto a transliteração conserva a distinção do original.
- issue: Sentido de ἐν θανάτῳ na lista de juízos
  choice: pela peste
  alternative: pela morte
  rationale: A lista evoca a linguagem dos juízos de Ezequiel, na qual 'morte' pode ter o sentido contextual de peste. A alternativa literal é registrada para não ocultar a ambiguidade.
- issue: Referente plural de αὐτοῖς
  choice: Foi-lhes dada autoridade
  alternative: Foi-lhe dada autoridade
  rationale: O texto crítico apresentado traz o pronome plural, que atribui a autoridade à Morte e ao Hades conjuntamente, embora a cena destaque o cavaleiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a abertura visionária, a personificação de Morte, o termo distinto Hades e a ambiguidade lexical relevante por meio de notas.
