id: REV.6.13
reference: Revelation 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: pt
  text: e as estrelas do céu caíram sobre a terra, como a figueira deixa cair seus figos verdes[a] quando é sacudida por um vento forte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “figos de inverno”, “figos ainda não maduros” ou “figos tardios”; o termo grego se refere a figos imaturos que caem antes de amadurecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: estrelas
  rationale: É o sentido comum do termo e preserva a imagem apocalíptica sem identificar interpretativamente as estrelas com anjos, governantes ou outros referentes.
- source_word: τοῦ οὐρανοῦ
  choice: do céu
  rationale: Mantém o registro cósmico e elevado da passagem, ao mesmo tempo que permite a imagem visual de estrelas caindo do firmamento.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: caíram sobre a terra
  rationale: Expressa naturalmente em português o movimento e o impacto na terra indicados por εἰς, sem enfraquecer a cena dramática.
- source_word: ὡς
  choice: como
  rationale: Introduz de modo natural a comparação.
- source_word: συκῆ
  choice: figueira
  rationale: É o equivalente português corrente e preciso.
- source_word: βάλλει
  choice: deixa cair
  rationale: No contexto do fruto que se desprende de uma árvore, esta formulação é idiomática e comunica o resultado de βάλλω sem o artificialismo de 'lança'.
- source_word: ὀλύνθους
  choice: figos verdes
  rationale: O termo designa figos imaturos ou fora de tempo, suscetíveis de cair antes de amadurecer. 'Figos verdes' é claro e natural; a nota preserva alternativas lexicais.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: por um vento forte
  rationale: Comunica em português atual a grande força do vento de modo mais natural que a tradução formal 'grande vento'.
- source_word: σειομένη
  choice: quando é sacudida
  rationale: Reproduz naturalmente a força circunstancial do particípio presente passivo que modifica a figueira.
theological_decisions:
- issue: Imagem apocalíptica das estrelas caindo
  choice: Manter a imagem lexical de que 'as estrelas do céu caíram sobre a terra', sem explicação interpretativa.
  alternative: Interpretar as estrelas como seres angelicais, governantes ou outros referentes simbólicos.
  rationale: Embora a imagem possa ter valor simbólico, o texto não explicita aqui seu referente. A tradução preserva a ambiguidade e a tensão teológica em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva o fluxo da frase grega e o tom cósmico da visão, usando formulações idiomáticas como 'deixa cair' e 'vento forte'.
