id: REV.6.2
reference: Revelation 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: pt
  text: E olhei, e eis um cavalo branco. Aquele que estava montado nele[b] tinha um arco; foi-lhe dada uma coroa[a], e ele saiu vencendo e para vencer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma coroa de vencedor”. O grego στέφανος muitas vezes designa uma coroa ou grinalda associada à vitória, e não um diadema real.
    reason: lexical_alternative
  - marker: b
    text: O texto não declara a identidade daquele que monta o cavalo. As interpretações variam amplamente.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: olhei
  rationale: Embora o aoristo de ὁράω possa significar “vi”, “olhei” combina naturalmente com ἰδού e conserva a sequência visionária.
- source_word: ἰδοὺ
  choice: eis
  rationale: “Eis” preserva a força de chamada de atenção e o tom vívido da visão apocalíptica, mantendo registro digno e compreensível.
- source_word: ἵππος λευκός
  choice: um cavalo branco
  rationale: Tradução direta da expressão nominal, que introduz uma nova figura na visão.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: aquele que estava montado nele
  rationale: Expressa com naturalidade em português o particípio substantivado e a posição do personagem sobre o cavalo, sem substituir a construção por uma identificação interpretativa.
- source_word: ἔχων τόξον
  choice: tinha um arco
  rationale: Formulação idiomática em português que traduz adequadamente a posse indicada pelo particípio ἔχων.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: foi-lhe dada uma coroa
  rationale: Mantém a voz passiva e traduz στέφανος pelo termo português mais natural, deixando em nota sua associação frequente com vitória.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Tradução direta e natural do movimento expresso por ἐξέρχομαι no fluxo narrativo.
- source_word: νικῶν
  choice: vencendo
  rationale: O particípio presente comunica ação concomitante e contínua; “vencendo” preserva a repetição lexical com νικήσῃ.
- source_word: ἵνα νικήσῃ
  choice: para vencer
  rationale: Expressa de forma natural a finalidade da construção ἵνα com subjuntivo e preserva o paralelismo “vencendo e para vencer”.
theological_decisions:
- issue: Identidade daquele que monta o cavalo branco
  choice: A tradução não identifica o personagem.
  alternative: Cristo ou uma figura semelhante a Cristo; um governante ou império conquistador; o anticristo ou um conquistador enganador.
  rationale: O texto grego descreve sua aparência, seus objetos e sua ação, mas não declara sua identidade. A tradução mantém essa tensão interpretativa sem impor uma leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis” conserva o tom apocalíptico elevado; a repetição “vencendo e para vencer” reproduz a ênfase lexical do grego. Todos os marcadores de nota aparecem no texto.
