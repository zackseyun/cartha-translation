id: REV.6.12
reference: Revelation 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: pt
  text: 'E vi quando ele abriu o sexto selo: houve um grande terremoto; o sol ficou negro como pano de saco feito de pelos[a], e a lua inteira ficou como sangue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como tecido áspero feito de pelos»; trata-se de pano de saco, um tecido grosseiro geralmente associado ao luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω introduz a percepção visionária de João; «vi» é direto e natural em português.
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: quando ele abriu o sexto selo
  rationale: Preserva a relação temporal e traduz de modo claro a ação de abrir o selo, sem explicitar um sujeito que o grego deixa apenas na forma verbal.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: houve um grande terremoto
  rationale: σεισμός, neste contexto, é naturalmente «terremoto»; «houve» expressa de modo idiomático o valor eventivo de ἐγένετο.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: o sol ficou negro
  rationale: μέλας significa especificamente «negro»; «ficou» comunica a mudança de estado de maneira natural.
- source_word: ὡς σάκκος τρίχινος
  choice: como tecido de saco feito de pelos
  rationale: σάκκος designa o tecido grosseiro usado para fazer sacos, e τρίχινος indica que era feito de pelos. A formulação evita sugerir apenas um saco comum e preserva a descrição do material.
- source_word: ἡ σελήνη ὅλη
  choice: a lua inteira
  rationale: Representa explicitamente a ênfase de ὅλη sobre a totalidade da lua.
- source_word: ἐγένετο ὡς αἷμα
  choice: ficou como sangue
  rationale: Mantém ὡς como comparação e não afirma que a lua se transformou literalmente em sangue.
theological_decisions:
- issue: Natureza dos sinais cósmicos
  choice: Apresentar diretamente as imagens visionárias e suas comparações, sem definir se os fenômenos são literais, simbólicos ou ambos.
  alternative: Interpretar os sinais como catástrofes astronômicas estritamente literais ou como símbolos de julgamento e convulsão política.
  rationale: O grego descreve a visão com comparações vívidas, mas não resolve no próprio versículo a natureza última dos sinais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação organiza a sequência visionária sem eliminar sua cadência. «Tecido de saco» esclarece o referente antigo, enquanto a nota registra uma alternativa tradicional.
