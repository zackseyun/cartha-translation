  source_fidelity: A tradução preserva corretamente a sequência da visão, os dois passivos de ἐδόθη sem explicitar o agente, a retirada da paz e a grande espada. Contudo, «matassem» enfraquece σφάξουσιν no corpo do texto; a força violenta do verbo deve estar presente na tradução, não apenas na nota. «Ao que estava montado nele» também é menos preciso e menos natural do que uma formulação que reflita «o que estava sentado sobre ele».
  naturalness: O português é em geral claro e de registro apropriado. «Ao que estava montado nele» soa algo pesado e pode sugerir apenas a ação de montar; «ao que estava sentado sobre ele» é mais natural e acompanha melhor a construção grega. «Para que se massacrem uns aos outros» comunica a reciprocidade sem acrescentar o substantivo «pessoas».
  terminology: «Vermelho como fogo», «paz», «terra» e «grande espada» são escolhas adequadas. «Terra» preserva a possível amplitude de γῆ. A nota sobre γῆ deve evitar apresentar «terra habitada» como alternativa lexical direta, pois essa expressão introduz uma especificação ausente do termo grego neste versículo.
  issues:
  - severity: medium
    issue: σφάξουσιν foi traduzido por «matassem» no texto principal.
    rationale: σφάζω denota matar de modo violento, frequentemente com a ideia de chacina ou degola. A nota reconhece essa intensidade, mas a equivalência principal deve também conservá-la. «Se massacrem uns aos outros» é idiomático e mantém a violência recíproca.
  - severity: low
    issue: «Ao que estava montado nele» é uma formulação imprecisa e pouco fluida.
    rationale: O particípio καθημένῳ significa «ao que estava sentado», e ἐπ’ αὐτόν localiza essa pessoa sobre o cavalo. «Ao que estava sentado sobre ele» é mais fiel à forma e mais natural em português.
  - severity: low
    issue: A nota b oferece «da terra habitada» como se fosse alternativa lexical.
    rationale: γῆ pode significar «terra», «solo», «região» ou «país/terra», conforme o contexto, mas «terra habitada» acrescenta uma delimitação que não está expressa. A nota deve limitar-se à alternativa «terra/país» ou «terra/região» e explicar a opção contextual.
