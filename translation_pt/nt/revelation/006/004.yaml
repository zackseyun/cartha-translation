  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: pt
  text: E saiu outro cavalo, vermelho como fogo[a]. Ao que estava sentado sobre ele foi dado tirar a paz da terra[b], para que se massacrem uns aos outros[c]; e foi-lhe dada uma grande espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cavalo vermelho». O adjetivo grego descreve mais especificamente um vermelho semelhante ao fogo.
    reason: lexical_alternative
  - marker: b
    text: Ou «do país» ou «da região». A palavra grega pode designar tanto a terra em sentido amplo como uma região; neste contexto, «terra» preserva o possível alcance mundial da visão.
    reason: lexical_alternative
  - marker: c
    text: O verbo grego é mais forte que o termo genérico «matar» e sugere matança violenta ou degola.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος πυρρός
  choice: outro cavalo, vermelho como fogo
  rationale: ἄλλος marca um cavalo distinto e subsequente; πυρρός designa um vermelho semelhante ao fogo. A formulação preserva a imagem vívida e soa natural em português.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: ao que estava montado nele
  rationale: Mantém a construção participial referente à pessoa sobre o cavalo, sem substituir o texto pelo substantivo interpretativo «cavaleiro».
- source_word: ἐδόθη αὐτῷ
  choice: foi dado / foi-lhe dada
  rationale: A voz passiva é preservada nas duas ocorrências, sem identificar o agente nem acrescentar «autoridade», mantendo o estilo e a tensão do texto.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: tirar a paz da terra
  rationale: Reproduz de modo idiomático a ideia de remover a paz; «terra» conserva o alcance potencialmente amplo de γῆ no contexto apocalíptico.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: para que as pessoas matassem umas às outras
  rationale: A oração preserva a relação de finalidade ou resultado de ἵνα. «Matassem» é natural no texto principal, enquanto a nota registra a intensidade sangrenta de σφάζω.
- source_word: μάχαιρα μεγάλη
  choice: uma grande espada
  rationale: «Espada» é a equivalência portuguesa mais clara para μάχαιρα nesta imagem apocalíptica, e «grande» conserva μεγάλη sem precisar definir o tipo exato da arma.
theological_decisions:
- issue: Passivo nas duas ocorrências de ἐδόθη
  choice: Manter «foi dado» e «foi-lhe dada», sem nomear quem concede
  alternative: «Deus lhe deu» ou «foi-lhe dada autoridade»
  rationale: O texto não declara o agente nem contém o substantivo «autoridade». Preservar o passivo mantém a soberania implícita e a tensão teológica sem explicá-las dentro da tradução.
- issue: Valor de ἵνα após a retirada da paz
  choice: «para que», preservando abertura entre finalidade e resultado
  alternative: «de modo que», explicitando resultado
  rationale: ἵνα pode carregar finalidade ou consequência neste contexto. «Para que» acompanha a forma do original sem eliminar completamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas as repetições passivas, a sequência da visão e a força das imagens foram preservadas. Todos os marcadores de nota aparecem no texto principal.
