id: REV.6.17
reference: Revelation 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: pt
  text: porque chegou o grande dia da ira deles[a], e quem é capaz de permanecer de pé?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções interpretativas trazem «ira dele»; o grego diz «ira deles», referindo-se conjuntamente ao que está sentado no trono e ao Cordeiro.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa do terror descrito no versículo anterior; «porque» é o conector causal mais claro e natural em português.
- source_word: ἦλθεν
  choice: chegou
  rationale: O aoristo de ἔρχομαι anuncia a chegada já realizada desse dia, com consequências presentes; «chegou» é direto e idiomático.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: o grande dia
  rationale: Reproduz naturalmente a construção atributiva grega e conserva seu peso solene e escatológico.
- source_word: τῆς ὀργῆς
  choice: da ira
  rationale: «Ira» preserva melhor que «raiva» o caráter intenso e judicial de ὀργή neste contexto de juízo.
- source_word: αὐτῶν
  choice: deles
  rationale: Mantém o pronome plural explícito no grego, que remete ao que está sentado no trono e ao Cordeiro, mencionados no versículo anterior.
- source_word: τίς
  choice: quem
  rationale: Traduz de modo simples e natural o pronome interrogativo que introduz a pergunta retórica.
- source_word: δύναται
  choice: é capaz
  rationale: Expressa claramente a ideia de capacidade e mantém o tom solene da pergunta.
- source_word: σταθῆναι
  choice: permanecer de pé
  rationale: Neste contexto de juízo, a expressão comunica de modo natural não apenas ficar em posição ereta, mas subsistir ou resistir diante da ira, sem tornar explícito mais do que o grego permite.
theological_decisions:
- issue: Pronome plural ligado à ira do que está sentado no trono e do Cordeiro
  choice: Conservar a expressão plural «ira deles»
  alternative: Traduzir «ira dele», assimilando a ação judicial a um agente singular
  rationale: O texto grego traz explicitamente αὐτῶν, «deles», retomando as duas figuras de Apocalipse 6:16. A tradução preserva essa tensão gramatical e teológica, sem harmonizá-la ou resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Chegou» e «é capaz de permanecer de pé» soam naturais sem perder a solenidade apocalíptica. O plural teologicamente marcante é preservado no texto principal.
