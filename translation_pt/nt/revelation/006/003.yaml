id: REV.6.3
reference: Revelation 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: pt
  text: 'E, quando ele abriu o segundo selo[a], ouvi o segundo ser vivente dizer: “Venha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá.” Alguns entendem que a ordem é dirigida ao cavaleiro, em vez de ser um chamado para que alguém se aproxime.'
    reason: Registra a alternativa contextual para Ἔρχου e preserva a ambiguidade quanto ao destinatário da ordem.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Conjunção narrativa padrão, mantida para preservar a continuidade com o versículo anterior.
- source_word: ὅτε
  choice: quando
  rationale: Introduz o momento do acontecimento seguinte de modo natural e fiel.
- source_word: ἤνοιξεν
  choice: ele abriu
  rationale: Traduz diretamente ἀνοίγω, sem substituir pelo mais interpretativo “rompeu”.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: o segundo selo
  rationale: Formulação natural em português que conserva a identificação ordinal.
- source_word: ἤκουσα
  choice: ouvi
  rationale: Equivalente direto e natural do aoristo narrativo de ἀκούω.
- source_word: τοῦ δευτέρου ζῴου
  choice: o segundo ser vivente
  rationale: No Apocalipse, ζῷον designa os seres junto ao trono, não um animal comum; “ser vivente” evita essa associação indevida e mantém o caráter da expressão.
- source_word: λέγοντος
  choice: dizer
  rationale: Expressa naturalmente em português o particípio dependente de “ouvi”.
- source_word: Ἔρχου
  choice: Venha
  rationale: É o sentido lexical mais direto do imperativo de ἔρχομαι. A possibilidade contextual de “Vá” é preservada em nota.
theological_decisions:
- issue: Sentido de Ἔρχου na fórmula da abertura dos selos
  choice: Venha
  alternative: Vá
  rationale: “Venha” preserva o sentido lexical normal do verbo. Como o contexto permite discussão sobre o destinatário da ordem, a alternativa é registrada em nota sem resolver além do que o texto grego permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção “ouvi... dizer” evita rigidez, enquanto “ser vivente” mantém a referência apocalíptica sem sugerir um animal comum.
