id: REV.10.4
reference: Revelation 10:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: pt
  text: 'E, quando os sete trovões falaram, eu estava prestes a escrever. Então ouvi uma voz vinda do céu, que dizia: “Sele o que os sete trovões falaram e não escreva essas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: falaram
  rationale: O verbo λαλέω significa comumente “falar” ou “proferir”. “Falaram” é natural em português e mantém a personificação dos trovões.
- source_word: αἱ ἑπτὰ βρονταί
  choice: os sete trovões
  rationale: βροντή significa “trovão”. O plural “trovões” preserva a imagem apocalíptica em que eles agem como seres que falam.
- source_word: ἤμελλον γράφειν
  choice: eu estava prestes a escrever
  rationale: 'μέλλω com infinitivo expressa iminência: João estava a ponto de escrever quando foi interrompido.'
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: uma voz vinda do céu
  rationale: A formulação identifica a origem celestial da voz sem identificar quem fala.
- source_word: Σφράγισον
  choice: Sele
  rationale: O imperativo aoristo ordena uma ação decisiva. No contexto revelatório, “selar” comunica que o conteúdo deve ser mantido oculto e não divulgado.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: o que os sete trovões falaram
  rationale: O relativo neutro plural ἃ designa o conteúdo falado. Em português, “o que” expressa esse conteúdo de modo natural e fiel.
- source_word: μὴ αὐτὰ γράψῃς
  choice: não escreva essas coisas
  rationale: O pronome neutro plural αὐτά retoma as coisas ditas pelos trovões. “Essas coisas” preserva explicitamente o plural e soa natural em português.
theological_decisions:
- issue: Identidade da voz celestial
  choice: uma voz vinda do céu
  alternative: a voz de Deus vinda do céu
  rationale: O grego informa apenas a procedência da voz, não a identidade de quem fala. A tradução mantém essa indeterminação.
- issue: Sentido de selar o que foi falado
  choice: Sele o que os sete trovões falaram
  alternative: Mantenha em segredo o que os sete trovões falaram
  rationale: A tradução conserva a metáfora explícita de σφραγίζω, sem reduzi-la apenas a uma interpretação de segredo ou ocultação.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação foi ajustada à fluidez do português: a segunda ocorrência de καί foi vertida por “Então”, indicando a progressão narrativa sem acrescentar conteúdo causal.'
