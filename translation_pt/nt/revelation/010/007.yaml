id: REV.10.7
reference: Revelation 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own slaves, the prophets.
translation:
  language: pt
  text: mas, nos dias da voz do sétimo anjo, quando ele estiver prestes a tocar a trombeta, então se cumprirá[b] o mistério de Deus, assim como ele anunciou as boas-novas aos seus próprios escravos[a], os profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega pode significar “servos” ou “escravos”; aqui, “seus próprios” ressalta que eles pertencem a Deus.
    reason: lexical_alternative
  - marker: b
    text: O grego usa uma forma verbal que, mais literalmente, seria “cumpriu-se” ou “foi cumprido”. No contexto futuro, ela pode apresentar o cumprimento como certo e consumado.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: mas
  rationale: Conjunção adversativa simples e natural, que liga a declaração ao contraste com a demora mencionada antes.
- source_word: ἐν ταῖς ἡμέραις
  choice: nos dias
  rationale: Mantém a expressão temporal solene e o registro apocalíptico sem soar arcaica.
- source_word: τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: da voz do sétimo anjo
  rationale: Preserva φωνή como “voz”, sem identificá-la antecipadamente apenas com o toque da trombeta.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: quando ele estiver prestes a tocar a trombeta
  rationale: A construção μέλλῃ com infinitivo indica iminência; “tocar a trombeta” explicita em português o instrumento implícito no verbo.
- source_word: καὶ ἐτελέσθη
  choice: então se cumprirá
  rationale: No contexto de uma oração temporal futura, comunica a realização futura do plano divino. A nota preserva a forma aorista do grego e sua possível apresentação proléptica como fato consumado.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: o mistério de Deus
  rationale: Conserva o termo teológico tradicional μυστήριον sem reduzi-lo por paráfrase a um plano ou segredo específico.
- source_word: ὡς εὐηγγέλισεν
  choice: assim como ele anunciou as boas-novas
  rationale: Mantém o sentido verbal de proclamar uma notícia boa e evita transformar o verbo automaticamente no substantivo técnico “evangelho”.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: aos seus próprios escravos
  rationale: “Escravos” preserva a relação de pertencimento expressa por δοῦλος, reforçada por ἑαυτοῦ (“seus próprios”); a alternativa corrente “servos” é registrada em nota.
- source_word: τοὺς προφήτας
  choice: os profetas
  rationale: Mantém explicitamente o aposto que identifica os escravos de Deus mencionados na frase.
theological_decisions:
- issue: Sentido temporal de ἐτελέσθη no contexto futuro
  choice: se cumprirá
  alternative: cumpriu-se / foi cumprido
  rationale: A oração introduzida por ὅταν aponta para o momento futuro do toque da trombeta, enquanto o aoristo pode apresentar o cumprimento como certo ou consumado. O texto principal torna clara a sequência futura, e a nota conserva a tensão gramatical.
- issue: Tradução de δοῦλος em referência aos profetas de Deus
  choice: escravos
  alternative: servos
  rationale: A presença de ἑαυτοῦ salienta que eles pertencem a Deus. “Escravos” conserva essa relação forte, sem negar que, em português bíblico corrente, “servos” também seja uma tradução possível.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens apocalípticas do grego foram preservadas, inclusive “a voz do sétimo anjo”; notas breves registram as ambiguidades relevantes sem impor um sistema escatológico.
