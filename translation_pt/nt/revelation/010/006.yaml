id: REV.10.6
reference: Revelation 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: pt
  text: e jurou por aquele que vive para todo o sempre, que criou o céu e tudo o que nele há, a terra e tudo o que nela há, e o mar e tudo o que nele há, que já não haverá demora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, «já não haverá tempo». Neste contexto, χρόνος pode ter o sentido de «demora» ou «prazo de espera»: chegou ao fim a espera pela ação decisiva de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: jurou
  rationale: O aoristo de ὀμνύω indica prestar juramento; «jurou» é conciso, natural e mantém a solenidade da cena.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: por aquele que vive para todo o sempre
  rationale: O dativo identifica aquele por quem se jura; o particípio substantivado é expresso naturalmente por «aquele que vive», e a expressão idiomática denota duração sem fim.
- source_word: ἔκτισεν
  choice: criou
  rationale: κτίζω, nesta fórmula cósmica, designa o ato criador e é melhor representado por «criou».
- source_word: τὸν οὐρανὸν
  choice: o céu
  rationale: No conjunto cósmico céu–terra–mar, οὐρανός se refere ao domínio celeste.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: tudo o que nele/nela há
  rationale: Expressa de modo natural em português o conteúdo de cada domínio e preserva a estrutura tríplice, sem acrescentar categorias não presentes no texto.
- source_word: γῆν
  choice: a terra
  rationale: Na tríade cósmica, γῆ significa a terra, e não uma região ou território local.
- source_word: θάλασσαν
  choice: o mar
  rationale: Mantém o singular e a formulação cósmica do grego.
- source_word: ὅτι
  choice: que
  rationale: Depois do verbo de juramento, introduz o conteúdo do juramento.
- source_word: χρόνος οὐκέτι ἔσται
  choice: já não haverá demora
  rationale: No contexto imediato, χρόνος aponta provavelmente para o prazo ou demora antes da consumação anunciada no versículo seguinte, não para a extinção do tempo; a nota preserva a tradução mais literal e a ambiguidade histórica.
theological_decisions:
- issue: Sentido de χρόνος na declaração do juramento
  choice: «já não haverá demora»
  alternative: «já não haverá tempo» / «o tempo não existirá mais»
  rationale: O versículo seguinte anuncia a consumação do mistério de Deus, favorecendo o sentido de que terminou o período de espera. A redação principal evita afirmar que a própria temporalidade deixará de existir, enquanto a nota registra de forma transparente a leitura literal alternativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Para todo o sempre» conserva o caráter litúrgico da fórmula sem soar arcaico. A repetição céu–terra–mar foi mantida, e «tudo o que ... há» torna natural a construção grega em português.
