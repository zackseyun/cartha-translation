  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: pt
  text: E o anjo que vi em pé sobre o mar e sobre a terra[a] levantou a mão direita em direção ao céu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a terra firme”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para o céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: anjo
  rationale: Em Apocalipse, o referente é um ser celestial; “anjo” é a tradução natural e contextualmente específica.
- source_word: ἑστῶτα
  choice: em pé
  rationale: O particípio perfeito descreve o estado ou a postura presente do anjo; “em pé” é natural em português.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sobre o mar
  rationale: Preserva a imagem vívida e o valor espacial de ἐπί com o genitivo.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: No contraste imediato com o mar, “terra” designa a porção seca e mantém uma formulação natural e ampla em português.
- source_word: ἦρεν
  choice: levantou
  rationale: Expressa de modo claro e idiomático o gesto solene indicado por αἴρω.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: a mão direita
  rationale: Reproduz de forma idiomática a especificação explícita da mão direita.
- source_word: εἰς τὸν οὐρανόν
  choice: em direção ao céu
  rationale: Torna explícito o sentido direcional de εἰς sem sugerir que a mão chegou ao céu; “céu” preserva o registro teológico do contexto.
theological_decisions:
- issue: Sentido de γῆ em contraste com θάλασσα
  choice: terra
  alternative: terra firme
  rationale: “Terra” conserva a amplitude lexical de γῆ e, em oposição a “mar”, é naturalmente entendida como a porção seca, sem impor uma leitura cosmológica.
- issue: Sentido de οὐρανός
  choice: céu
  alternative: firmamento
  rationale: O gesto introduz o juramento pelo Criador no versículo seguinte; “céu” preserva esse peso teológico e não reduz a referência ao espaço atmosférico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial; “em direção ao céu” comunica com clareza o movimento direcional.
