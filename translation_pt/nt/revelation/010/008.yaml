id: REV.10.8
reference: Revelation 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: pt
  text: 'E a voz que ouvi do céu falou comigo novamente e disse: “Vá, pegue o rolo[a] que está aberto na mão do anjo que está em pé sobre o mar e sobre a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, à luz do contexto próximo, “pequeno rolo” ou “livrinho”; neste versículo, porém, o grego traz βιβλίον, “rolo”, sem o diminutivo usado em versículos próximos.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ
  choice: voz
  rationale: No contexto, trata-se de uma voz celestial que fala de modo inteligível, não de um som indistinto.
- source_word: πάλιν λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: falou comigo novamente e disse
  rationale: Expressa a repetição indicada por πάλιν, preserva o sentido relacional de μετά e apresenta os particípios gregos em português natural.
- source_word: Ὕπαγε λάβε
  choice: Vá, pegue
  rationale: Mantém os dois imperativos diretos e a sequência da ordem sem acrescentar nuances ausentes do grego.
- source_word: βιβλίον
  choice: rolo
  rationale: No cenário histórico e literário de Apocalipse, o objeto é um rolo, não necessariamente um livro em formato de códice; o substantivo deste versículo não está no diminutivo.
- source_word: ἠνεῳγμένον
  choice: que está aberto
  rationale: O particípio perfeito passivo descreve o estado presente resultante de o rolo ter sido aberto.
- source_word: ἐν τῇ χειρὶ
  choice: na mão
  rationale: Conserva a localização expressa por ἐν; a ideia de tirá-lo da mão é inferida do comando, mas não substitui a preposição no texto.
- source_word: ἑστῶτος
  choice: que está em pé
  rationale: Comunica o estado contínuo de estar de pé indicado pelo particípio perfeito.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: sobre o mar e sobre a terra firme
  rationale: A repetição de “sobre” acompanha a estrutura grega, enquanto “terra firme” torna claro o contraste espacial com o mar.
theological_decisions:
- issue: Sentido de γῆ na imagem apocalíptica
  choice: terra firme
  alternative: terra
  rationale: A cena descreve a posição do anjo sobre o mar e seu correspondente terrestre. “Terra firme” explicita esse contraste sem impor uma afirmação cosmológica; “terra” continua sendo uma possibilidade lexical.
- issue: Relação entre βιβλίον e o diminutivo usado no contexto próximo
  choice: rolo
  alternative: pequeno rolo; livrinho
  rationale: Este versículo traz βιβλίον, sem forma diminutiva. A tradução principal evita harmonizá-lo silenciosamente com βιβλαρίδιον nos versículos próximos, mas registra a possibilidade contextual em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Falou comigo novamente e disse” mantém a progressão do grego sem soar artificial; “Vá, pegue” apresenta a ordem de modo direto. As notas foram colocadas junto às palavras a que efetivamente se referem.
