  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: pt
  text: e tinha na mão um pequeno rolo[a] que havia sido aberto. Ele pôs o pé direito sobre o mar e o esquerdo sobre a terra firme[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pequeno livro”. O termo grego βιβλαρίδιον é um diminutivo que pode designar um pequeno rolo ou livreto.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre a terra”. A palavra grega γῆ pode significar “terra”, “solo” ou “terra firme”; aqui, “terra firme” destaca o contraste com o mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: tinha
  rationale: O particípio presente descreve o que o anjo trazia consigo. “Tinha” é natural em português, mantém a ligação com a descrição do versículo anterior e evita sugerir que ele apenas segurava o objeto naquele instante.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: na mão
  rationale: Equivalência direta e natural; o singular explícito no grego foi preservado.
- source_word: βιβλαρίδιον
  choice: um pequeno rolo
  rationale: O diminutivo designa um rolo ou livreto pequeno. “Pequeno rolo” preserva melhor a imagem antiga do objeto escrito sem excluir totalmente a alternativa lexical indicada em nota.
- source_word: ἠνεῳγμένον
  choice: que havia sido aberto
  rationale: 'O particípio perfeito passivo aponta para uma abertura já realizada cujo resultado permanece: o rolo está aberto.'
- source_word: ἔθηκεν
  choice: pôs
  rationale: Expressa de modo corrente e digno a ação deliberada de colocar o pé em determinada posição.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: o pé direito
  rationale: Reproduz com clareza a referência explícita ao pé direito.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sobre o mar
  rationale: “Sobre” comunica a posição incomum e vívida do anjo em relação ao mar.
- source_word: τὸν δὲ εὐώνυμον
  choice: e o esquerdo
  rationale: O substantivo “pé” pode ser omitido naturalmente na segunda parte da construção paralela, como também fica subentendido no grego.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra firme
  rationale: No contraste imediato com o mar, γῆ denota a parte seca, isto é, a terra firme. A alternativa mais ampla, “terra”, é preservada em nota.
theological_decisions:
- issue: Sentido de γῆ no contraste com θάλασσα
  choice: terra firme
  alternative: terra
  rationale: A cena apresenta um pé sobre o mar e o outro sobre a porção seca. “Terra firme” torna claro o contraste espacial sem impor um sentido cosmológico mais amplo; a polissemia de γῆ é registrada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “e” foi moderada no início da segunda oração para evitar rigidez, sem alterar a sequência narrativa. Os marcadores foram associados aos termos efetivamente explicados: [a] ao pequeno rolo e [b] à terra firme.'
