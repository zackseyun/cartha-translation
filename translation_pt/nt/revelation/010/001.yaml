id: REV.10.1
reference: Revelation 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: pt
  text: E vi outro anjo poderoso[a] descendo do céu, revestido de uma nuvem. Sobre a cabeça dele estava o arco-íris[b]; seu rosto era como o sol, e seus pés, como colunas de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outro anjo forte”.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega geralmente significa “arco-íris”, mas também pode descrever uma auréola ou um halo radiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: outro anjo
  rationale: Embora ἄγγελος também possa significar “mensageiro”, a descida do céu e o contexto visionário do Apocalipse favorecem “anjo”.
- source_word: ἰσχυρὸν
  choice: poderoso
  rationale: Expressa força e poder excepcionais em português atual e natural; “forte” também seria possível, mas é menos marcante neste contexto apocalíptico.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: descendo do céu
  rationale: Preserva de modo conciso o movimento descendente expresso pelo particípio e sua origem celestial.
- source_word: περιβεβλημένον νεφέλην
  choice: revestido de uma nuvem
  rationale: Mantém a metáfora de vestimenta de περιβάλλω e a imagem bíblica da nuvem, sem reduzi-la apenas à ideia de estar cercado.
- source_word: ἡ ἶρις
  choice: o arco-íris
  rationale: É o sentido usual de ἶρις e corresponde à imagem já encontrada em Apocalipse 4:3, embora uma auréola ou um halo radiante seja lexicalmente possível.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sobre a cabeça dele
  rationale: Comunica naturalmente a posição do arco-íris acima ou sobre a cabeça, sem especificar se ele a tocava.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: seu rosto era como o sol
  rationale: A cópula acrescentada torna a comparação natural em português sem alterar o sentido do grego.
- source_word: οἱ πόδες αὐτοῦ
  choice: seus pés
  rationale: Traduz diretamente πόδες e preserva a forma tradicional e visual da descrição.
- source_word: στῦλοι πυρός
  choice: colunas de fogo
  rationale: “Colunas” é uma tradução clara e corrente de στῦλοι e mantém intacta a construção metafórica com fogo.
theological_decisions:
- issue: Identidade do anjo poderoso
  choice: Manter “outro anjo poderoso”, sem identificar a figura além do que o texto declara.
  alternative: Interpretá-lo explicitamente como um anjo criado ou como uma manifestação de Cristo.
  rationale: O grego chama a figura simplesmente de ἄλλον ἄγγελον ἰσχυρόν. Como sua identidade é disputada, a tradução preserva a tensão interpretativa e não impõe uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa, sem desfazer a progressão visual do original. Os marcadores [a] e [b] foram posicionados junto aos termos a que suas notas efetivamente se referem.
source_grounding:
  english_pob_role: consult_only
