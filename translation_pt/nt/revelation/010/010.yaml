  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: pt
  text: E tomei o pequeno rolo[a] da mão do anjo e o comi; na minha boca, ele era doce como mel; e, quando o comi, meu estômago ficou amargo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pequeno livro”. O termo grego é um diminutivo e pode designar um pequeno documento escrito; “pequeno rolo” corresponde melhor à provável forma antiga.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu ventre ficou amargo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: pequeno rolo
  rationale: O diminutivo designa um documento escrito pequeno; “rolo” corresponde melhor à forma provável do documento antigo do que “livro”.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: da mão do anjo
  rationale: Formulação direta e natural que preserva a imagem concreta do texto grego.
- source_word: κατέφαγον
  choice: o comi
  rationale: “Comi” expressa naturalmente o ato simbólico sem acrescentar a intensidade potencial de “devorei”, que poderia exagerar o tom.
- source_word: ὡς μέλι γλυκύ
  choice: doce como mel
  rationale: Reproduz de modo idiomático a comparação explícita introduzida por ὡς.
- source_word: ὅτε ἔφαγον αὐτό
  choice: depois que o comi
  rationale: 'Torna clara em português a sequência narrativa: a amargura se manifesta após ele comer o rolo, sem atribuir ao aoristo uma distinção temporal indevida.'
- source_word: ἐπικράνθη
  choice: ficou amargo
  rationale: Expressa de maneira natural a mudança de estado indicada pela forma passiva, cujo uso aqui pode ter sentido intransitivo.
- source_word: κοιλία
  choice: estômago
  rationale: É o termo corporal moderno mais claro no contexto; “ventre” também é possível, mas menos específico e mais literário.
theological_decisions:
- issue: Ato simbólico de comer o rolo
  choice: Manter literalmente as imagens da doçura na boca e da amargura no estômago, sem explicá-las.
  alternative: Explicitar na tradução que a doçura e a amargura representam alegria, juízo ou sofrimento profético.
  rationale: O versículo não interpreta de modo explícito todos os elementos do símbolo; explicá-los no texto resolveria uma tensão que o original preserva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação inicial preserva o fluxo narrativo do grego; a divisão em duas frases e o uso de “mas” tornam natural o contraste já presente entre doçura e amargura.
