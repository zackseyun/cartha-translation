source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: pt
  text: E ele clamou em alta voz, como ruge um leão. E, quando clamou, os sete trovões falaram com suas próprias vozes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sete trovões proferiram suas próprias vozes”. A formulação grega é incomum e personifica vividamente os trovões, atribuindo-lhes fala e vozes próprias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: clamou
  rationale: O aoristo de κράζω indica um brado forte. “Clamou” conserva a intensidade e se ajusta ao registro elevado da visão sem sugerir necessariamente aflição.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: A expressão preserva o substantivo φωνή e comunica de modo natural a força sonora indicada pelo adjetivo μεγάλῃ.
- source_word: ὥσπερ λέων μυκᾶται
  choice: como ruge um leão
  rationale: “Como” introduz claramente a comparação, e “ruge” é o verbo natural em português para a voz do leão.
- source_word: ὅτε
  choice: quando
  rationale: Mantém a relação temporal sem transformá-la indevidamente em sequência posterior ou relação causal.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: os sete trovões
  rationale: Conserva o referente visionário definido e sua personificação na linguagem apocalíptica.
- source_word: ἐλάλησαν τὰς ἑαυτῶν φωνάς
  choice: falaram com suas próprias vozes
  rationale: Preserva tanto o ato de falar expresso por λαλέω quanto a ênfase reflexiva de ἑαυτῶν. A formulação incomum reflete a imagem deliberadamente marcante do grego.
theological_decisions:
- issue: Personificação dos sete trovões
  choice: Manter “os sete trovões falaram com suas próprias vozes”
  alternative: “os sete trovões soaram” ou “emitiram suas mensagens”
  rationale: O grego atribui explicitamente fala e vozes aos trovões. Preservar essa personificação evita reduzir a visão a um simples efeito sonoro ou interpretar as vozes especificamente como mensagens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamou” mantém o tom visionário sem arcaísmo excessivo; a construção incomum sobre as vozes foi preservada por corresponder à personificação enfática do original.
