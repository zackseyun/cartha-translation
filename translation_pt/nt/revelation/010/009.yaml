id: REV.10.9
reference: Revelation 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: pt
  text: 'Então fui até o anjo e lhe disse que me desse o pequeno rolo[a]. E ele me diz[b]: “Pegue-o e coma-o por inteiro. Ele tornará amargo o seu estômago[c], mas, na sua boca, será doce como mel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrinho”. O termo grego é diminutivo e pode indicar um pequeno rolo ou livreto.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele me disse”. O grego emprega o presente histórico (“diz”) para dar vivacidade à narrativa.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu ventre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: fui até o anjo
  rationale: Expressa naturalmente em português o movimento de João em direção ao anjo, sem o sentido excessivamente literal de ‘fui embora’.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: lhe disse que me desse
  rationale: Preserva o conteúdo da fala expresso pelo particípio com infinitivo, sem acrescentar uma ideia de pedido cortês que o grego não explicita.
- source_word: βιβλαρίδιον
  choice: pequeno rolo
  rationale: Mantém a nuance diminutiva e a forma material mais provável do documento no contexto antigo; ‘livrinho’ continua possível.
- source_word: λέγει μοι
  choice: ele me diz
  rationale: Conserva o presente histórico do grego e sua vivacidade narrativa.
- source_word: Λάβε
  choice: Pegue-o
  rationale: Traduz diretamente o imperativo; o pronome deixa claro em português que o objeto é o pequeno rolo.
- source_word: κατάφαγε αὐτό
  choice: coma-o por inteiro
  rationale: Comunica a força intensiva do verbo composto sem recorrer ao potencialmente dramático ‘devore-o’.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: tornará amargo o seu estômago
  rationale: Mantém a construção causativa e o sentido corporal concreto adequado ao contexto de comer e digerir.
- source_word: γλυκὺ ὡς μέλι
  choice: doce como mel
  rationale: Reproduz de modo natural e direto a comparação do grego.
theological_decisions:
- issue: Ato simbólico de comer o rolo
  choice: Manter a ordem concreta ‘Pegue-o e coma-o por inteiro’ sem explicar o símbolo.
  alternative: Explicitar que comer significa assimilar ou interiorizar a mensagem de Deus.
  rationale: O texto apresenta uma ação profética simbólica, mas não a interpreta neste versículo; uma explicação inserida na tradução eliminaria a abertura da imagem.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O presente histórico foi preservado; ‘por inteiro’ transmite a intensidade de κατεσθίω sem tornar a imagem excessivamente interpretativa.
