  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: pt
  text: 'E me dizem: “É necessário que você profetize novamente acerca de povos, nações, línguas e muitos reis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῖ σε
  choice: É necessário que você
  rationale: Expressa a necessidade ou obrigação indicada por δεῖ, preservando a ênfase do original sem tornar a frase excessivamente coloquial.
- source_word: πάλιν προφητεῦσαι
  choice: profetize novamente
  rationale: Mantém o sentido direto de voltar a exercer o ato profético.
- source_word: ἐπὶ
  choice: acerca de
  rationale: Neste contexto, indica o assunto ou alvo da profecia. “Acerca de” preserva a amplitude sem decidir se João profetiza diante desses grupos, contra eles ou a respeito deles.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: muitos povos, nações, línguas e reis
  rationale: Reproduz a enumeração e associa naturalmente πολλοῖς ao conjunto coordenado, como permite a posição do adjetivo no grego.
theological_decisions:
- issue: Alcance de ἐπὶ na missão profética de João
  choice: acerca de
  alternative: contra / diante de / sobre
  rationale: A preposição admite nuances contextuais. “Acerca de” mantém aberta a relação exata entre a profecia e os povos, nações, línguas e reis, sem impor uma leitura exclusivamente judicial ou geográfica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. O presente “dizem” conserva o presente histórico do texto grego; o sujeito plural permanece implícito, como no original.
