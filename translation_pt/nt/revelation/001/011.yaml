id: REV.1.11
reference: Revelation 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: pt
  text: 'que dizia: “O que você vê, escreva num livro[a] e envie-o às sete igrejas: para Éfeso, para Esmirna, para Pérgamo, para Tiatira, para Sardes, para Filadélfia e para Laodiceia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num rolo”; o grego βιβλίον pode designar um livro, rolo ou documento escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: que dizia
  rationale: Particípio presente feminino no genitivo, ligado à voz mencionada no contexto anterior. “Que dizia” dá continuidade natural à frase sem identificar além do que o grego explicita.
- source_word: Ὃ βλέπεις
  choice: O que você vê
  rationale: Reproduz de modo idiomático o pronome relativo neutro e o presente verbal, mantendo amplo o alcance do conteúdo visionário.
- source_word: γράψον
  choice: escreva
  rationale: Imperativo aoristo de γράφω; “escreva” é direto, corrente e preserva a força da ordem.
- source_word: εἰς βιβλίον
  choice: num livro
  rationale: βιβλίον pode designar livro, rolo ou documento escrito. “Livro” é claro no português atual, enquanto “rolo” é preservado em nota por refletir o suporte material comum no século I.
- source_word: πέμψον
  choice: envie-o
  rationale: Imperativo aoristo de πέμπω. O pronome retoma naturalmente o escrito ordenado na oração anterior.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: às sete igrejas
  rationale: Aqui ἐκκλησία se refere a comunidades cristãs concretas. “Igrejas” é a tradução corrente e não impõe uma estrutura denominacional específica.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: para Éfeso ... para Laodiceia
  rationale: A repetição de “para” acompanha a repetição distributiva de εἰς e torna claros os destinos individuais; os topônimos seguem as formas portuguesas correntes.
theological_decisions:
- issue: Sentido de ἐκκλησίαις em Apocalipse 1:11
  choice: igrejas
  alternative: assembleias
  rationale: O contexto aponta para comunidades cristãs locais específicas. “Igrejas” comunica esse referente eclesial no português comum sem acrescentar distinções denominacionais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para o singular explícito e natural no Brasil, evitando formas verbais hoje percebidas como arcaizantes por muitos leitores. Mantém a repetição retórica dos destinos, mas usa as formas portuguesas consagradas dos nomes das cidades.
