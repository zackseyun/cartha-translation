  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: pt
  text: 'João, às sete igrejas na Ásia: Graça e paz a vocês, da parte daquele que é, que era e que vem[a], e da parte dos sete espíritos que estão diante do seu trono[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais tradicional: “daquele que é, que era e que há de vir”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “os sete espíritos” pode referir-se simbolicamente à plenitude do Espírito Santo ou a sete espíritos celestiais; o texto grego diz literalmente “sete espíritos”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Ἰωάννης.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ
  choice: às sete igrejas que estão na Ásia
  rationale: “Igrejas” é o sentido natural de ἐκκλησίαις neste contexto epistolar cristão. A oração “que estão” representa o artigo e a expressão locativa, enquanto “Ásia” preserva a designação antiga da província romana.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Graça e paz a vocês
  rationale: Formulação corrente e natural em português, com o destinatário plural de ὑμῖν expresso por “a vocês”.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: da parte daquele que é, que era e que vem
  rationale: “Da parte de” é idiomático em saudações portuguesas e traduz ἀπό. A formulação mantém a sequência temporal e o valor verbal presente de ὁ ἐρχόμενος, sem corrigir interpretativamente a solenidade do título divino.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: dos sete espíritos
  rationale: Preserva o plural explícito do grego e evita substituir a tradução por uma interpretação como “Espírito em sua plenitude”.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: que estão diante do seu trono
  rationale: “Diante de” corresponde naturalmente a ἐνώπιον. O verbo “estão”, implícito no grego, é necessário para uma frase portuguesa clara.
theological_decisions:
- issue: Identidade daquele “que é, que era e que vem”
  choice: 'Manter a expressão como título pessoal e divino: “daquele que é, que era e que vem”.'
  alternative: “daquele que é, que era e que há de vir”
  rationale: “Que vem” representa mais diretamente o particípio presente ὁ ἐρχόμενος; a alternativa tradicional é registrada sem ser imposta ao texto principal.
- issue: Identidade dos “sete espíritos”
  choice: Conservar literalmente o plural “os sete espíritos”.
  alternative: Uma referência simbólica à plenitude do Espírito Santo, ou sete espíritos celestiais.
  rationale: A expressão grega é plural, e sua identificação é debatida. A tradução preserva essa tensão teológica, deixando as principais interpretações para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A vocês” evita regionalismo excessivo; “da parte de” mantém a naturalidade da saudação. As vírgulas distinguem os três elementos solenes do título divino sem tornar a frase artificial.
