  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: pt
  text: No dia do Senhor[a], eu estava no Espírito[b] e ouvi atrás de mim uma voz forte, como uma trombeta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, «no Dia do Senhor», em sentido escatológico. Aqui o grego diz κυριακῇ ἡμέρᾳ, literalmente «dia pertencente ao Senhor», e não emprega a expressão mais comum para o «Dia do Senhor» escatológico.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, «vim a estar no Espírito»; ou «em espírito». A expressão pode indicar que João estava sob a influência profética do Espírito Santo; o texto não diz explicitamente que ele entrou em transe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην ἐν πνεύματι
  choice: fui tomado pelo Espírito
  rationale: Expressa de modo natural em português o ingresso no estado de inspiração profética indicado pela construção, sem acrescentar a ideia explícita de transe. A nota preserva a possibilidade de uma tradução mais formal.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: No dia do Senhor
  rationale: O adjetivo κυριακός indica um dia pertencente ao Senhor. Em português, a forma é natural, embora possa coincidir verbalmente com a expressão escatológica; a nota esclarece a diferença no grego.
- source_word: ἤκουσα
  choice: ouvi
  rationale: Equivalente direto e idiomático do aoristo de ἀκούω, que aqui descreve percepção auditiva.
- source_word: ὀπίσω μου
  choice: atrás de mim
  rationale: Preserva claramente o sentido espacial exigido pelo contexto.
- source_word: φωνὴν μεγάλην
  choice: uma voz forte
  rationale: Em associação com φωνή, μεγάλη indica grande volume ou potência; 'forte' é natural e digno em português.
- source_word: ὡς σάλπιγγος
  choice: como o som de uma trombeta
  rationale: Torna explícito que a comparação auditiva recai sobre a voz, sem introduzir a noção adicional de toque ou toque prolongado.
theological_decisions:
- issue: Se ἐν πνεύματι designa a atuação do Espírito Santo, o espírito humano ou um transe
  choice: fui tomado pelo Espírito
  alternative: vim a estar em espírito; entrei em transe
  rationale: O uso visionário em Apocalipse favorece a referência ao Espírito Santo, mas o original não emprega um termo específico para 'transe'. A tradução principal comunica inspiração profética, e a nota preserva a formulação mais literal e sua ambiguidade.
- issue: Se κυριακῇ ἡμέρᾳ indica um dia semanal pertencente ao Senhor ou o Dia escatológico do Senhor
  choice: dia do Senhor
  alternative: Dia do Senhor em sentido escatológico
  rationale: A tradução segue o valor possessivo do adjetivo κυριακός sem identificar expressamente qual dia da semana se tem em vista. A nota informa que a construção grega difere da expressão escatológica habitual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para maior naturalidade. 'Fui tomado pelo Espírito' evita o pouco idiomático 'vim a estar', enquanto a nota registra a forma e a ambiguidade do grego. Como 'dia do Senhor' em português pode soar escatológico, a nota distingue cuidadosamente as construções gregas.
