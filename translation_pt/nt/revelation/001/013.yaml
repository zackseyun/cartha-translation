id: REV.1.13
reference: Revelation 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: pt
  text: e, no meio dos candelabros, alguém semelhante a um filho de homem[a], vestido com uma túnica que chegava aos pés e cingido à altura do peito com uma faixa de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém semelhante ao Filho do Homem”. A expressão grega ecoa Daniel 7:13 e aqui é aplicada ao Jesus exaltado.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: no meio de
  rationale: Preserva o sentido espacial da construção grega e soa natural no estilo visionário.
- source_word: λυχνιῶν
  choice: candelabros
  rationale: λυχνία designa o suporte da lâmpada, não a própria lâmpada; “candelabros” é a forma bíblica corrente e mantém a coerência com a explicação da imagem no contexto.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: alguém semelhante a um filho de homem
  rationale: Reflete a ausência de artigo em grego, preserva a alusão a Daniel 7:13 e evita transformar silenciosamente a expressão em título definido.
- source_word: ἐνδεδυμένον
  choice: vestido com
  rationale: Expressa naturalmente o estado resultante indicado pelo particípio perfeito médio.
- source_word: ποδήρη
  choice: uma túnica que chegava aos pés
  rationale: Comunica de modo claro o sentido literal de uma veste que alcança os pés, sem recorrer a vocabulário especializado.
- source_word: περιεζωσμένον
  choice: cingido
  rationale: Mantém a imagem de uma faixa envolvendo o corpo e o registro solene da visão.
- source_word: πρὸς τοῖς μαστοῖς
  choice: à altura do peito
  rationale: Indica com naturalidade que a faixa estava na parte alta do torso, preservando a referência anatômica sem uma formulação pouco idiomática.
- source_word: ζώνην χρυσᾶν
  choice: com uma faixa de ouro
  rationale: ζώνη pode indicar cinto ou faixa; “faixa” combina melhor com sua colocação no peito e com a descrição visionária.
theological_decisions:
- issue: Força cristológica de ὅμοιον υἱὸν ἀνθρώπου
  choice: “alguém semelhante a um filho de homem” no texto principal
  alternative: “alguém semelhante ao Filho do Homem”
  rationale: A opção principal acompanha a forma anarticulada do grego e conserva a alusão a Daniel 7 sem impor uma forma titular mais explícita do que a sintaxe imediata. A leitura cristológica tradicional permanece registrada em nota, pois a visão se aplica ao Jesus exaltado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Cingido” conserva o tom solene sem tornar a frase obscura; “faixa de ouro” e “à altura do peito” tornam clara a disposição da vestimenta.
