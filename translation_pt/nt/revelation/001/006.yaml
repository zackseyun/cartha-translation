id: REV.1.6
reference: Revelation 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: pt
  text: e fez de nós um reino[a], sacerdotes para o seu Deus e Pai — a ele sejam a glória e o domínio para todo o sempre[b]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos posteriores trazem «reis e sacerdotes» em vez de «um reino, sacerdotes». O texto principal segue a leitura grega aqui adotada.
    reason: textual_variant
  - marker: b
    text: Mais literalmente, «pelos séculos dos séculos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: fez de nós
  rationale: 'O aoristo é vertido pelo pretérito perfeito simples. A construção idiomática portuguesa «fez de nós» expressa com clareza o duplo acusativo grego: ele constituiu «nós» como «um reino».'
- source_word: βασιλείαν
  choice: um reino
  rationale: O substantivo singular significa «reino» ou «reinado», não «reis». A escolha preserva a identidade coletiva do povo e a provável alusão a Êxodo 19:6.
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: Tradução direta do plural, preservando a linguagem cultual e pactual do texto.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: para o seu Deus e Pai
  rationale: «Para» comunica a orientação e o serviço sacerdotal expressos pelo dativo. «Seu» se refere naturalmente a Jesus no contexto e modifica a expressão coordenada «Deus e Pai».
- source_word: αὐτῷ
  choice: a ele sejam
  rationale: A fórmula portuguesa completa de modo natural a doxologia nominal grega. «Sejam» deixa claro que glória e domínio são atribuídos a ele, sem alterar o referente.
- source_word: δόξα
  choice: glória
  rationale: Equivalente consagrado e natural em contexto doxológico.
- source_word: κράτος
  choice: domínio
  rationale: Expressa poder soberano e efetivo, sentido apropriado de κράτος nesta doxologia, com maior precisão que o termo genérico «poder».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente português claro e idiomático para duração sem fim; a forma mais literal é registrada em nota.
- source_word: ἀμήν
  choice: Amém
  rationale: Forma litúrgica tradicional e plenamente corrente em português.
theological_decisions:
- issue: Referente de «seu Deus e Pai»
  choice: 'A expressão se refere a Jesus Cristo: os fiéis foram constituídos reino e sacerdotes para o Deus e Pai dele.'
  alternative: Reformular como «para Deus, seu Pai», suavizando a coordenação grega.
  rationale: O antecedente contextual é Jesus Cristo nos versículos 5–6. A tradução preserva a formulação relacional e a distinção presentes no grego, sem harmonização doutrinária.
- issue: Natureza da condição da comunidade
  choice: Manter «um reino, sacerdotes».
  alternative: «reis e sacerdotes».
  rationale: O texto grego fornecido traz βασιλείαν, «reino», no singular, seguido de ἱερεῖς, «sacerdotes». A tradução conserva a identidade corporativa em vez de adotar uma variante textual posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe doxológica natural. «Para todo o sempre» favorece compreensão imediata, enquanto a nota conserva a forma semítica mais literal. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
