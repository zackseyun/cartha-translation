id: REV.1.2
reference: Revelation 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: pt
  text: que deu testemunho da palavra de Deus e do testemunho de Jesus, o Messias[a], de tudo o que viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o testemunho dado por Jesus, o Messias” ou “o testemunho a respeito de Jesus, o Messias”. O grego permite ambas as leituras.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: deu testemunho
  rationale: Preserva o campo semântico forense de μαρτυρέω e a relação lexical com μαρτυρίαν, em português natural e digno.
- source_word: λόγον
  choice: palavra
  rationale: “Palavra de Deus” preserva a formulação bíblica consolidada e o sentido de comunicação ou revelação divina.
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: Mantém a relação cognata com “deu testemunho” e traduz naturalmente o substantivo grego.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa a aposição idiomática em português para explicitar esse valor titular.
- source_word: ὅσα εἶδεν
  choice: tudo o que viu
  rationale: Reproduz o sentido abrangente de ὅσα e funciona como resumo do conteúdo testemunhado.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: da palavra de Deus e do testemunho de Jesus, o Messias
  rationale: Conserva os dois objetos coordenados e mantém, por meio de “de”, a ambiguidade do genitivo ligado ao testemunho.
theological_decisions:
- issue: Ambiguidade do genitivo em μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: o testemunho de Jesus, o Messias
  alternative: o testemunho dado por Jesus, o Messias; o testemunho a respeito de Jesus, o Messias
  rationale: O genitivo grego pode indicar tanto a origem do testemunho quanto seu objeto. A redação principal preserva essa ambiguidade genuína, e a nota explicita as duas leituras.
- issue: Valor titular de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva valor titular; “Messias” comunica esse sentido diretamente, sem tratá-lo apenas como parte de um nome próprio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A oração relativa “que deu testemunho” mantém a ligação sintática com o versículo anterior. A repetição “deu testemunho… testemunho” é deliberada para refletir a relação lexical do grego.
