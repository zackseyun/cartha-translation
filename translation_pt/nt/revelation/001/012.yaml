id: REV.1.12
reference: Revelation 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: pt
  text: E me voltei para ver a voz que falava comigo[a]. Ao me voltar, vi sete candelabros de ouro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que falava para mim”. O grego diz literalmente “que falava comigo”.'
    reason: Registra a alternativa contextual para μετά com o genitivo, enquanto esclarece que o texto principal preserva mais de perto a forma grega.
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: me voltei
  rationale: O aoristo de ἐπιστρέφω descreve aqui o ato físico de virar-se. “Me voltei” é natural, preciso e não acrescenta a ideia mais específica de dar uma volta completa.
- source_word: βλέπειν
  choice: para ver
  rationale: O infinitivo expressa a finalidade do movimento. A formulação preserva a imagem intencionalmente incomum de ver a voz, sem substituí-la por uma explicação do seu sentido.
- source_word: τὴν φωνὴν
  choice: a voz
  rationale: No contexto de fala, φωνή designa a voz, não apenas um som. A estranheza da expressão “ver a voz” pertence ao texto e deve ser mantida.
- source_word: ἥτις ἐλάλει μετ’ ἐμοῦ
  choice: que falava comigo
  rationale: O imperfeito indica ação em curso, e μετά com o genitivo exprime associação. “Falava comigo” preserva de modo natural a construção grega; “falava para mim” continua possível como sentido contextual.
- source_word: ἐπιστρέψας εἶδον
  choice: Ao me voltar, vi
  rationale: A oração temporal comunica com fluidez que o ato de voltar-se antecede imediatamente a visão, sem a rigidez de um particípio reproduzido literalmente.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: sete candelabros de ouro
  rationale: λυχνία é o suporte de uma lâmpada, não a própria lâmpada. “Candelabros” é uma designação portuguesa corrente para esses objetos no contexto bíblico, e “de ouro” comunica claramente o material indicado pelo adjetivo χρυσᾶς.
theological_decisions:
- issue: Identificação do objeto simbólico λυχνίας
  choice: candelabros
  alternative: lâmpadas
  rationale: O referente concreto deve permanecer distinto das lâmpadas que ele sustenta, pois Apocalipse 1:20 interpreta simbolicamente os sete candelabros. Traduzir por “lâmpadas” confundiria os elementos da imagem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se deliberadamente a expressão incomum “ver a voz”, por ser uma característica significativa do original. A divisão em duas frases evita uma coordenação pesada, sem alterar a sequência narrativa.
