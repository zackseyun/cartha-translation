id: REV.1.16
reference: Revelation 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: pt
  text: Ele tinha sete estrelas na mão direita, e de sua boca saía uma espada afiada de dois gumes[a], e sua aparência era como o sol quando brilha com toda a sua força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma espada afiada de duplo gume”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “brilha em sua força”.
    reason: literal_rendering
lexical_decisions:
- source_word: ἔχων
  choice: Ele tinha
  rationale: O particípio integra a descrição contínua da visão. A forma verbal finita é natural em português e mantém o valor descritivo.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: na mão direita
  rationale: Mantém χείρ, explicitamente presente no grego, e expressa δεξιᾷ de modo idiomático em português.
- source_word: ἀστέρας ἑπτά
  choice: sete estrelas
  rationale: Tradução direta, com a ordem natural do português.
- source_word: ῥομφαία
  choice: espada
  rationale: Embora possa designar uma espada grande, “espada” é claro e evita especificar além do necessário o tipo de arma na imagem visionária.
- source_word: δίστομος
  choice: de dois gumes
  rationale: O sentido literal é “de duas bocas”, mas a expressão idiomática descreve uma lâmina cortante dos dois lados. “De dois gumes” é corrente e preserva a metáfora tradicional.
- source_word: ὀξεῖα
  choice: afiada
  rationale: Conserva a indicação explícita de que a espada é cortante, sem confundi-la com a referência separada aos dois gumes.
- source_word: ἐκπορευομένη
  choice: saía
  rationale: O imperfeito apresenta naturalmente em português a espada que procede continuamente da boca no quadro visionário.
- source_word: ἡ ὄψις αὐτοῦ
  choice: sua aparência
  rationale: ὄψις indica o aspecto visível e não precisa ser limitado ao rosto; “aparência” preserva essa amplitude.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: como o sol quando brilha
  rationale: Forma comparativa natural em português que preserva o brilho ativo do sol.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: com toda a sua força
  rationale: Neste contexto, δύναμις descreve a intensidade plena do brilho solar. A formulação comunica esse sentido com naturalidade; a tradução mais formal é registrada em nota.
theological_decisions:
- issue: Natureza da imagem da espada que sai da boca
  choice: Manter a metáfora visionária sem explicação interpretativa
  alternative: Explicitar que a espada representa a palavra ou o juízo de Cristo
  rationale: O versículo apresenta a imagem, mas não oferece aqui sua interpretação. Explicá-la no texto resolveria indevidamente o simbolismo apocalíptico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “e” conserva o encadeamento da descrição grega, enquanto as formas verbais finitas tornam a frase natural. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
