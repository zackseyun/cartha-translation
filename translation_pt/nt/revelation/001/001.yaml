  to: Revelação de Jesus, o Messias[a], que Deus lhe deu para mostrar aos seus escravos o que deve acontecer em breve[b], e ele a deu a conhecer, enviando-a por meio do seu anjo ao seu escravo João[d],
  rationale: A revisão limita-se a ἐσήμανεν e à nota correspondente. «Deu a conhecer» reproduz o sentido central do verbo sem eliminar sua possível associação com comunicação por sinais, que é devidamente mantida como alternativa em nota. As demais escolhas do rascunho são fiéis ao grego e naturais em português moderno.
