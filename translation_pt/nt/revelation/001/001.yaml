id: REV.1.1
reference: Revelation 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his slaves what must happen soon, and he made it known by sending it through his angel to his slave John[d][c][b],
translation:
  language: pt
  text: Revelação de Jesus, o Messias[a], que Deus lhe deu para mostrar aos seus escravos o que deve acontecer em breve[b], e ele a deu a conhecer, enviando-a por meio do seu anjo ao seu escravo João[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «Revelação vinda de Jesus, o Messias» ou «Revelação a respeito de Jesus, o Messias». O genitivo grego admite mais de um sentido.
    reason: alternative_reading
  - marker: b
    text: Ou «rapidamente». A expressão pode indicar que essas coisas acontecerão em breve ou que acontecerão com rapidez quando começarem.
    reason: lexical_alternative
  - marker: d
    text: 'Outra forma de traduzir a sequência é: «Revelação de Jesus, o Messias, que Deus lhe deu para mostrar aos seus escravos o que deve acontecer em breve, e ele a comunicou por sinais, enviando-a por meio do seu anjo ao seu escravo João».'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Revelação
  rationale: Expressa o desvelamento ou a divulgação de algo antes oculto e preserva a forma tradicional e natural do início do livro.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: Traduz Χριστός como título, «o Messias». A construção com «de» conserva a possível referência tanto à origem quanto ao conteúdo da revelação.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: que Deus lhe deu
  rationale: Mantém a oração relativa e a distinção textual entre Deus e Jesus, sem acrescentar explicação doutrinária.
- source_word: δεῖξαι
  choice: para mostrar
  rationale: Transmite de modo direto o infinitivo de propósito e se ajusta ao contexto visionário.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: aos seus escravos
  rationale: Preserva a relação de pertencimento e sujeição expressa por δοῦλος, mais forte que «servo» neste contexto.
- source_word: ἃ δεῖ γενέσθαι
  choice: o que deve acontecer
  rationale: Formulação portuguesa natural que mantém a ideia de necessidade expressa por δεῖ.
- source_word: ἐν τάχει
  choice: em breve
  rationale: Comunica a provável proximidade temporal, sem apagar em nota a possibilidade de rapidez na execução.
- source_word: ἐσήμανεν
  choice: a comunicou por sinais
  rationale: Torna explícita, em português natural, a possível nuance de comunicação mediante sinais, especialmente pertinente ao caráter simbólico do livro.
- source_word: ἀποστείλας
  choice: enviando-a
  rationale: Representa o particípio como ação instrumental associada à comunicação da revelação.
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: por meio do seu anjo
  rationale: Preserva o sentido de mediação de διά com o genitivo.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: ao seu escravo João
  rationale: Mantém coerência na tradução de δοῦλος e identifica João como destinatário da comunicação.
theological_decisions:
- issue: Sentido do genitivo em Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: «Revelação de Jesus, o Messias», sem limitar «de» a um único sentido
  alternative: «Revelação vinda de Jesus, o Messias» ou «revelação a respeito de Jesus, o Messias»
  rationale: O genitivo grego pode indicar origem, conteúdo ou uma relação mais ampla. A redação escolhida preserva essa ambiguidade genuína.
- issue: Tradução de δοῦλος
  choice: «escravo/escravos»
  alternative: «servo/servos»
  rationale: Neste contexto, o termo destaca pertencimento e submissão a Deus ou a Jesus; «escravo» conserva melhor essa força, sem transformar a relação em mero serviço voluntário.
- issue: Relação entre Deus e Jesus na cadeia da revelação
  choice: «que Deus lhe deu»
  alternative: Explicitar teologicamente a relação entre ambos
  rationale: A tradução mantém a distinção e a sequência enunciadas no texto — Deus dá a revelação a Jesus — sem harmonização ou elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a forma nominal do início, sem acrescentar «Esta é». A pontuação com ponto e vírgula esclarece a longa cadeia sintática sem dividir o versículo em afirmações independentes; a vírgula final acompanha a continuidade da frase no versículo seguinte.
