    reason: alternative_reading
  revision_rationale: A revisão torna mais direta a relação expressa por ἐπ’ αὐτόν, sem definir a natureza do lamento, e ajusta a nota para refletir a alternativa semântica de γῆ sem acrescentar “Israel” ao texto. “Eis que” preserva de modo idiomático e solene o chamamento de atenção de Ἰδοὺ.
