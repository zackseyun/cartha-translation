id: REV.1.7
reference: Revelation 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: pt
  text: Eis que ele vem com as nuvens, e todo olho o verá, até mesmo aqueles que o traspassaram; e todas as tribos da terra lamentarão por ele.[a] Sim, amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as tribos do país lamentarão por ele”. A frase pode ecoar Zacarias 12:10-12, onde “país” é contextualmente possível.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Convoca vividamente os ouvintes a prestar atenção. O imperativo plural é natural no português moderno e evita o arcaísmo de “Eis”, embora explicite o público implícito na interjeição grega.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente grego tem força vívida e prospectiva. “Vem” mantém essa forma e é idiomático em português.
- source_word: μετὰ τῶν νεφελῶν
  choice: com as nuvens
  rationale: Preserva o artigo, a imagem concreta e a provável alusão a Daniel 7:13.
- source_word: ὄψεται αὐτὸν πᾶς ὀφθαλμός
  choice: todo olho o verá
  rationale: Mantém a expressão concreta e distributiva do grego, bem como o futuro, em formulação natural e solene.
- source_word: καὶ οἵτινες αὐτὸν ἐξεκέντησαν
  choice: até mesmo aqueles que o traspassaram
  rationale: “Até mesmo” torna explícita a força inclusiva contextual de καί; “traspassaram” preserva a ligação verbal com Zacarias 12:10 e João 19:37.
- source_word: κόψονται
  choice: lamentarão
  rationale: Expressa luto e lamentação sem impor um gesto físico específico não exigido no contexto.
- source_word: ἐπ’ αὐτόν
  choice: por causa dele
  rationale: Preserva a ambiguidade entre lamentar a respeito dele e lamentar em decorrência de sua vinda, sem sugerir necessariamente pesar compassivo “por ele”.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: todas as tribos da terra
  rationale: “Tribos” conserva a especificidade de φυλαί, e “terra” admite naturalmente tanto alcance mundial quanto, conforme o contexto, referência à terra de Israel.
- source_word: ναί, ἀμήν
  choice: Sim, amém
  rationale: Mantém a dupla afirmação enfática e seu peso litúrgico.
theological_decisions:
- issue: Alcance de τῆς γῆς em πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: “todas as tribos da terra” no texto principal, com possível sentido mundial
  alternative: “todas as tribos da terra de Israel” ou “todas as tribos do país”
  rationale: A visibilidade universal de “todo olho” favorece o alcance mundial, mas a alusão a Zacarias 12:10-12 permite referência à terra de Israel. Como “terra” em português também comporta alguma ambiguidade, a nota preserva explicitamente a alternativa.
- issue: Sentido de ἐπ’ αὐτόν na lamentação
  choice: “por causa dele”
  alternative: “por ele” ou “a respeito dele”
  rationale: A preposição pode relacionar o lamento à pessoa vista ou à sua vinda. A tradução escolhida evita decidir se o lamento é compassivo, penitencial ou aterrorizado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantêm-se as imagens bíblicas concretas (“nuvens”, “todo olho”, “tribos”) e a cadência solene. O marcador [a] aparece no texto principal junto à oração à qual a nota se refere.
