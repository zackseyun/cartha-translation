revisions:
- from: Vejam! Ele vem com as nuvens, e todo olho o verá, até mesmo aqueles que o traspassaram; e todas as tribos da terra lamentarão por causa dele.[a] Sim, amém.
  to: Eis que ele vem com as nuvens, e todo olho o verá, até mesmo aqueles que o traspassaram; e todas as tribos da terra lamentarão por ele.[a] Sim, amém.
  rationale: A revisão torna mais direta a relação expressa por ἐπ’ αὐτόν, sem definir a natureza do lamento, e ajusta a nota para refletir a alternativa semântica de γῆ sem acrescentar “Israel” ao texto. “Eis que” preserva de modo idiomático e solene o chamamento de atenção de Ἰδοὺ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:40:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a estrutura e as imagens centrais do grego: a vinda com as nuvens, a visão universal, os que o traspassaram, as tribos e a dupla afirmação final. Contudo, “por causa dele” para ἐπ’ αὐτόν inclina o sentido para causalidade e se afasta da relação mais direta de lamento “por ele/sobre ele”, além de enfraquecer a ressonância de Zacarias 12.'
  naturalness: O texto é claro, solene e de leitura natural em português contemporâneo. “Vejam!” é possível, mas “Eis que” reproduz melhor a função anunciativa de Ἰδοὺ em registro bíblico moderno e evita introduzir desnecessariamente um imperativo plural dirigido aos leitores.
  terminology: “Nuvens”, “todo olho”, “traspassaram”, “tribos da terra” e “amém” são escolhas adequadas. A nota deve apresentar a alternativa “terra”/“país” sem ampliar o texto para “terra de Israel”, expressão que não está no grego e é mais interpretativa do que a alternativa indicada no audit trail.
  issues:
  - severity: medium
    issue: “por causa dele” para ἐπ’ αὐτόν
    rationale: A formulação privilegia “em decorrência dele” e pode sugerir que o lamento é somente uma reação à sua vinda. “Por ele” mantém mais diretamente a construção de lamento em referência à pessoa e deixa aberto se o lamento é de pesar, arrependimento ou terror.
  - severity: medium
    issue: A nota introduz “terra de Israel”
    rationale: γῆ pode significar “terra” ou “país/terra”, e a alusão a Zacarias torna uma referência local possível; porém “Israel” não é expresso no texto. A nota deve preservar a alternativa sem especificação interpretativa adicional.
  revised_text: Eis que ele vem com as nuvens, e todo olho o verá, até mesmo aqueles que o traspassaram; e todas as tribos da terra lamentarão por ele.[a] Sim, amém.
  revised_footnotes:
