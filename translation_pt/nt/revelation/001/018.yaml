id: REV.1.18
reference: Revelation 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: pt
  text: e o Vivente — estive morto[a], e eis que estou vivo para todo o sempre[b] — e tenho as chaves da morte e do Hades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “tornei-me morto”; o verbo grego ressalta a passagem para a morte.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “pelos séculos dos séculos”, expressão idiomática que indica duração sem fim.
    reason: lexical_alternative
  - marker: c
    text: “Hades” designa o domínio dos mortos, não especificamente o lugar de punição final.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: o Vivente
  rationale: O particípio presente com artigo funciona como título. “O Vivente” conserva essa força titular e a ligação com a autodescrição divina, em registro elevado mas compreensível.
- source_word: ἐγενόμην νεκρός
  choice: estive morto
  rationale: É a forma mais natural em português para expressar a realidade passada da morte em contraste com a vida presente. A nuance literal de transição expressa por ἐγενόμην é preservada em nota.
- source_word: ἰδού
  choice: eis que
  rationale: Mantém a força enfática e demonstrativa da interjeição grega, adequada ao registro solene do Apocalipse.
- source_word: ζῶν εἰμι
  choice: estou vivo
  rationale: Expressa naturalmente em português o estado presente indicado pelo particípio com εἰμί e preserva o contraste com “estive morto”.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente idiomático e enfático de duração sem fim, mais claro no português atual do que o calque “pelos séculos dos séculos”.
- source_word: κλεῖς
  choice: chaves
  rationale: Equivalente lexical direto; no contexto, a imagem comunica autoridade e controle.
- source_word: τοῦ θανάτου
  choice: da morte
  rationale: Reproduz diretamente o genitivo e evita impor uma personificação que o grego não exige.
- source_word: τοῦ ᾅδου
  choice: do Hades
  rationale: Translitera o termo para distingui-lo tanto da sepultura física quanto do lugar de punição final, sem apagar sua especificidade conceitual.
theological_decisions:
- issue: Sentido de ᾅδης no contexto escatológico
  choice: Hades
  alternative: sepultura; morada dos mortos; inferno
  rationale: “Hades” preserva a distinção presente no texto entre a morte e o domínio dos mortos. “Inferno” poderia importar a ideia específica de punição final, enquanto “sepultura” reduziria o termo ao local físico de sepultamento.
- issue: Força titular de ὁ ζῶν
  choice: o Vivente
  alternative: aquele que vive; o que vive
  rationale: A forma substantivada funciona como título e pode ecoar a identidade divina. A tradução mantém essa força sem desenvolver explicitamente uma interpretação teológica além do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “O Vivente” conserva o caráter titular do grego; “eis que” mantém a ênfase apocalíptica sem recorrer a linguagem excessivamente arcaica. A pontuação apresenta as afirmações em sequência natural, e todos os marcadores estão ligados aos termos que explicam.
