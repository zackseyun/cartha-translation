id: REV.1.8
reference: Revelation 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: pt
  text: “Eu sou o Alfa e o Ômega”, diz o Senhor Deus, “aquele que é, que era e que vem[a], o Todo-Poderoso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que há de vir”.'
    reason: Alternativa lexical tradicional para ὁ ἐρχόμενος, que pode salientar a vinda futura.
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Reproduz de modo natural a autodeclaração enfática; o pronome explícito preserva em português a ênfase do grego.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: o Alfa e o Ômega
  rationale: Mantém os nomes das letras gregas e sua força simbólica, além da expressão já consagrada no uso bíblico em português.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente da fórmula declarativa com a opção mais direta e natural em português.
- source_word: κύριος, ὁ θεός
  choice: o Senhor Deus
  rationale: Traduz os títulos divinos em aposição de forma direta, corrente e solene.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: aquele que é, que era e que vem
  rationale: Conserva a estrutura tríplice e traduz o particípio presente ἐρχόμενος com valor ativo e iminente, sem convertê-lo apenas em futuro.
- source_word: ὁ παντοκράτωρ
  choice: o Todo-Poderoso
  rationale: Equivalente bíblico claro e estabelecido em português, comunicando domínio e poder soberanos sem recorrer a uma formulação artificial.
theological_decisions:
- issue: A autodesignação divina e a relação entre existência eterna e vinda futura
  choice: aquele que é, que era e que vem
  alternative: aquele que é, que era e que há de vir
  rationale: “Que vem” reflete mais diretamente o particípio presente grego e preserva a ideia de movimento escatológico ativo. “Que há de vir” é uma leitura tradicional e legítima, mantida em nota sem eliminar a tensão do original.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A pontuação distingue a fórmula introdutória da fala divina, e os títulos tradicionais são mantidos sem linguagem denominacional.
