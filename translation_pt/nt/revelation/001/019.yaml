  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: pt
  text: Portanto, escreva o que você viu, o que é e o que está para acontecer depois destas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que acontecerá depois destas coisas”. Em alguns contextos, o verbo pode ter valor próximo ao futuro simples, embora muitas vezes indique aquilo que está para ocorrer.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: escreva
  rationale: Imperativo aoristo ativo na segunda pessoa do singular; “escreva” transmite diretamente a ordem, sem acrescentar a ideia de registrar ou anotar.
- source_word: οὖν
  choice: portanto
  rationale: Mantém a força inferencial e de continuidade com a visão e a comissão anteriores.
- source_word: ἃ εἶδες
  choice: o que você viu
  rationale: Expressa de modo natural o conteúdo da visão já recebido por João, sem impor ao aoristo uma nuance temporal adicional.
- source_word: ἃ εἰσὶν
  choice: o que é
  rationale: O neutro plural grego pode ser expresso em português pelo coletivo singular idiomático, preservando a referência às realidades presentes.
- source_word: μέλλει γίνεσθαι
  choice: está para acontecer
  rationale: Preserva a noção frequente de iminência ou ação pendente em μέλλω com infinitivo, sem convertê-la silenciosamente em mero futuro.
- source_word: μετὰ ταῦτα
  choice: depois destas coisas
  rationale: Reflete tanto o sentido temporal quanto o plural do demonstrativo e conserva uma formulação recorrente em Apocalipse.
theological_decisions:
- issue: Força temporal de μέλλει no contexto apocalíptico
  choice: 'Traduzir com sentido de iminência: “está para acontecer”'
  alternative: 'Traduzir como futuro simples: “acontecerá”'
  rationale: A construção grega frequentemente indica algo iminente ou prestes a ocorrer. A tradução principal mantém essa tensão temporal sem decidir debates escatológicos mais amplos; a nota registra a possibilidade de uso próximo ao futuro simples.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o destinatário singular indicado pelo verbo grego. A coordenação tripla e a expressão “depois destas coisas” preservam a estrutura do original.
