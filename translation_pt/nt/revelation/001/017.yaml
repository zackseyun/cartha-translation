id: REV.1.17
reference: Revelation 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: pt
  text: 'Quando o vi, caí aos seus pés como morto.[a] Então ele pôs a mão direita sobre mim e disse: “Não tenha medo.[b] Eu sou o Primeiro e o Último,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivesse morto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não tema”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: Quando o vi
  rationale: Expressa com naturalidade a relação temporal de ὅτε e mantém a continuidade narrativa de καί sem exigir um “E” inicial, que seria menos fluente em português atual.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: caí aos seus pés
  rationale: É a forma idiomática e fiel de descrever a queda diante dele, preservando tanto a ação quanto a posição indicada pelo grego.
- source_word: ὡς νεκρός
  choice: como morto
  rationale: Mantém a comparação explícita introduzida por ὡς e não afirma que João tenha morrido literalmente.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: ele pôs a mão direita sobre mim
  rationale: “Pôs” comunica naturalmente a ação de τίθημι; “mão” está implícita no substantivo feminino “direita”, e “sobre mim” preserva a ideia de contato.
- source_word: λέγων
  choice: e disse
  rationale: Converte o particípio contemporâneo em uma oração coordenada idiomática, sem alterar a sequência da ação.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Forma corrente, clara e digna em português para a proibição no singular; evita a ambiguidade regional que “não tema” pode apresentar quanto ao tratamento.
- source_word: ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva o pronome explícito e a força enfática da autoidentificação que introduz os títulos seguintes.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: o Primeiro e o Último
  rationale: Os adjetivos com artigo funcionam como títulos. As iniciais maiúsculas sinalizam esse uso sem acrescentar conteúdo ao grego.
theological_decisions:
- issue: Valor titular de ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: o Primeiro e o Último
  alternative: o primeiro e o último
  rationale: No contexto, a expressão é uma autodesignação solene do Cristo exaltado e ecoa linguagem divina de Isaías. A capitalização indica a função titular, sem resolver além do texto as implicações teológicas desse eco.
- issue: Força de ἐγώ εἰμι
  choice: Eu sou
  alternative: Sou eu
  rationale: A construção introduz uma autoidentificação formal seguida de títulos; “Eu sou” retém sua ênfase e seu peso literário sem afirmar uma alusão específica que o versículo, isoladamente, não explicita.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe foi levemente naturalizada (“Então... e disse”), preservando a progressão narrativa. A vírgula final após a fala foi mantida porque a declaração continua no versículo seguinte.
