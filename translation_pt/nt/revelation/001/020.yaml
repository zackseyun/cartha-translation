id: REV.1.20
reference: Revelation 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: pt
  text: 'Quanto ao mistério das sete estrelas que você viu na minha mão direita e dos sete candelabros de ouro: as sete estrelas são os anjos[a] das sete igrejas, e os sete candelabros são as sete igrejas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiros das sete igrejas”. A palavra grega pode se referir tanto a anjos como a mensageiros humanos.
    reason: Leitura alternativa que preserva a ambiguidade lexical de ἄγγελοι.
lexical_decisions:
- source_word: μυστήριον
  choice: mistério
  rationale: Mantém o termo apocalíptico e teológico, que aqui aponta para o significado revelado da visão, sem reduzi-lo a uma simples explicação simbólica.
- source_word: ἀστέρων / ἀστέρες
  choice: estrelas
  rationale: Tradução direta da imagem visionária, cujo referente é explicado na própria frase.
- source_word: οὓς εἶδες
  choice: que você viu
  rationale: Formulação natural no português moderno, preservando a oração relativa que modifica “estrelas”.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: na minha mão direita
  rationale: Expressa naturalmente em português a localização das estrelas na mão direita, em continuidade com a imagem do contexto imediato.
- source_word: λυχνίας
  choice: candelabros
  rationale: Designa suportes para lâmpadas, não as próprias lâmpadas; “candelabros” é uma forma bíblica conhecida e compreensível em português.
- source_word: χρυσᾶς
  choice: de ouro
  rationale: Forma corrente e precisa para indicar o material dos candelabros.
- source_word: ἄγγελοι
  choice: anjos
  rationale: O termo grego pode significar seres celestiais ou mensageiros humanos. “Anjos” se ajusta ao uso frequente em Apocalipse, enquanto a alternativa é preservada em nota.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: igrejas
  rationale: Termo padrão e contextualmente apropriado para as comunidades às quais o Apocalipse se dirige.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Quanto ao mistério ... e ...:'
  rationale: Reproduz de modo natural a construção tópica grega, que apresenta os elementos da visão antes de explicar sua identidade.
theological_decisions:
- issue: Referente de ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: anjos das sete igrejas
  alternative: mensageiros das sete igrejas
  rationale: Ἄγγελος admite ambos os sentidos. Como Apocalipse usa frequentemente o termo para seres celestiais e o versículo não identifica explicitamente líderes humanos, “anjos” permanece no texto principal; a nota conserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o caráter visionário e explicativo do original sem eliminar sua ambiguidade teológica.
