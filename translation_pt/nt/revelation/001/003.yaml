id: REV.1.3
reference: Revelation 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: pt
  text: Feliz é aquele que lê em voz alta[a], e os que ouvem as palavras desta profecia e guardam o que nela está escrito, pois o tempo está próximo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que lê”; o grego provavelmente se refere a um leitor público na assembleia, daí “lê em voz alta”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pois o tempo determinado está próximo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: É a fórmula tradicional e natural das bem-aventuranças em português bíblico, comunicando a condição favorecida por Deus, e não apenas uma emoção passageira.
- source_word: ὁ ἀναγινώσκων
  choice: aquele que lê em voz alta
  rationale: O particípio singular, em contraste com os ouvintes no plural, provavelmente indica o leitor público na assembleia; a formulação torna explícito esse contexto oral provável.
- source_word: οἱ ἀκούοντες
  choice: os que ouvem
  rationale: Preserva o sentido direto de recepção oral e corresponde naturalmente à leitura pública mencionada antes.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: as palavras desta profecia
  rationale: Mantém λόγους como “palavras”, sem generalizá-lo para “mensagem”; “desta” identifica naturalmente a profecia contida no livro.
- source_word: τηροῦντες
  choice: guardam
  rationale: “Guardar” preserva o campo semântico de conservar, observar e obedecer fielmente, sem reduzir o termo à mera observância de regras.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: o que nela está escrito
  rationale: Expressão idiomática em português que representa naturalmente o particípio perfeito passivo e mantém a referência à profecia.
- source_word: ὁ γὰρ καιρὸς
  choice: pois o tempo
  rationale: “O tempo” conserva a amplitude de καιρός, que pode designar um momento decisivo ou determinado, sem impor essa explicitação no corpo do texto.
- source_word: ἐγγύς
  choice: está próximo
  rationale: Forma clara e atual que preserva a afirmação de proximidade temporal sem linguagem arcaica.
theological_decisions:
- issue: Contexto de leitura pública sugerido pelo leitor singular e pelos ouvintes plurais
  choice: Traduzir ἀναγινώσκων como “aquele que lê em voz alta”.
  alternative: “aquele que lê”, sem explicitar o aspecto oral
  rationale: A distinção entre um leitor e vários ouvintes sugere fortemente uma leitura congregacional. A nota preserva a alternativa lexical mais estrita.
- issue: Força escatológica de καιρός ἐγγύς
  choice: Traduzir como “o tempo está próximo”, sem definir uma cronologia de cumprimento.
  alternative: “o tempo determinado está próximo”
  rationale: O texto afirma proximidade, mas não especifica um esquema escatológico; a tradução mantém essa tensão sem favorecer uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “feliz” antes do grupo plural explicita em português o alcance coordenado da bem-aventurança grega. Os marcadores aparecem no texto junto às expressões correspondentes.
