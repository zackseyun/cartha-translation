id: REV.1.15
reference: Revelation 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: pt
  text: e os seus pés eram semelhantes a bronze reluzente[a], como que refinado numa fornalha, e a sua voz era como o som de muitas águas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O raro termo grego traduzido como “bronze reluzente” pode designar uma liga metálica muito refinada ou incandescente; outras traduções possíveis são “latão fino” ou “bronze polido”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “como a voz de muitas águas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: pés
  rationale: É o equivalente direto e normal de πούς e preserva a descrição corporal da visão.
- source_word: ὅμοιοι
  choice: eram semelhantes a
  rationale: Expressa claramente a comparação de ὅμοιος em português natural, com o verbo de ligação subentendido no grego.
- source_word: χαλκολιβάνῳ
  choice: bronze reluzente
  rationale: O termo é raro e seu referente metalúrgico exato é incerto; a expressão comunica um metal brilhante, provavelmente bronze ou uma liga semelhante, sem especificar demais sua composição.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: como que refinado numa fornalha
  rationale: Preserva a força comparativa de ὡς e a imagem de metal submetido a fogo intenso numa fornalha; “refinado” é natural no contexto metalúrgico, embora o particípio também possa sugerir aquecimento ou incandescência.
- source_word: φωνή
  choice: voz
  rationale: Na primeira ocorrência, o referente pessoal exige naturalmente “voz”.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: como o som de muitas águas
  rationale: A segunda ocorrência de φωνή pode significar “som”; esta escolha produz português idiomático e mantém a imagem bíblica formal de “muitas águas”, sem reduzi-la a ondas, cachoeiras ou mar.
theological_decisions:
- issue: Tradução da repetição de φωνή na comparação final
  choice: a sua voz era como o som de muitas águas
  alternative: a sua voz era como a voz de muitas águas
  rationale: “Som” torna a comparação auditiva natural em português, enquanto “muitas águas” conserva a imagem majestosa e sua ressonância bíblica. A repetição mais literal de “voz” permanece na nota para não ocultar a formulação grega.
- issue: Natureza do metal indicado por χαλκολίβανον
  choice: bronze reluzente
  alternative: latão fino; bronze polido; liga metálica brilhante
  rationale: A identificação exata do termo raro é incerta. A tradução preserva o brilho e o aspecto metálico da visão sem impor uma composição metalúrgica específica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Numa” é corrente e natural sem baixar o registro. Os marcadores foram ligados às notas correspondentes: [a] ao metal raro e [b] à tradução de φωνή.'
