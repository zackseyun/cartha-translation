id: REV.1.9
reference: Revelation 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: pt
  text: Eu, João, irmão de vocês e companheiro de vocês na tribulação, no reino e na perseverança em Jesus, estava na ilha chamada Patmos por causa da palavra de Deus e do testemunho de Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do testemunho a respeito de Jesus». O genitivo grego pode indicar tanto o testemunho dado por Jesus quanto o testemunho a respeito de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: companheiro
  rationale: Expressa participação solidária de João com seus leitores nas realidades mencionadas, de modo natural em português e sem conotação comercial.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: na tribulação, no reino e na perseverança
  rationale: Mantém os três substantivos coordenados e o peso apocalíptico de θλῖψις; a repetição de «no/na» torna a relação sintática clara e natural em português.
- source_word: ἐν Ἰησοῦ
  choice: em Jesus
  rationale: Preserva a expressão teológica compacta do grego e a liga naturalmente à tríade precedente, sem acrescentar «Cristo» ou explicitar «união».
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: estava na ilha
  rationale: Traduz o uso idiomático de γίνομαι no contexto sem sugerir uma forma de chegada que o texto não declara.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: chamada Patmos
  rationale: É a formulação corrente e transparente para o particípio em aposição a «ilha».
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: por causa da palavra de Deus
  rationale: διά com acusativo indica causa; a tradução deixa em aberto se essa causa envolvia proclamação, fidelidade ou perseguição relacionada à palavra de Deus.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: do testemunho de Jesus
  rationale: Mantém a ambiguidade real do genitivo grego entre o testemunho dado por Jesus e o testemunho a respeito dele.
- source_word: ἀδελφὸς ὑμῶν
  choice: irmão de vocês
  rationale: Comunica diretamente a solidariedade familiar de João com os destinatários e oferece boa legibilidade brasileira sem alterar o referente masculino singular.
theological_decisions:
- issue: Ambiguidade do genitivo em μαρτυρίαν Ἰησοῦ
  choice: «o testemunho de Jesus» no texto principal
  alternative: «o testemunho a respeito de Jesus»
  rationale: O genitivo pode ser subjetivo ou objetivo. A formulação principal conserva a tensão exegética do original, enquanto a nota registra explicitamente a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» evita o regionalismo de «vós»; «companheiro» é natural sem diluir a ideia de participação compartilhada. A coordenação foi pontuada para mostrar que «em Jesus» se relaciona à tribulação, ao reino e à perseverança.
