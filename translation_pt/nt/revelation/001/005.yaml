id: REV.1.5
reference: Revelation 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: pt
  text: e da parte de Jesus, o Messias[a], a testemunha fiel, o primogênito dos mortos e o soberano dos reis da terra. Àquele que nos ama e nos libertou dos nossos pecados por meio do seu sangue[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus, o Cristo”. O termo grego é um título que significa “Messias”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “nos lavou dos nossos pecados com seu sangue” em vez de “nos libertou dos nossos pecados por meio do seu sangue”.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός funciona como título; “o Messias” traduz seu sentido e, com o artigo, soa natural em português.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: a testemunha fiel
  rationale: μάρτυς designa aqui quem dá testemunho, não necessariamente quem morre por ele; πιστός preserva a ideia de fidelidade e confiabilidade.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: o primogênito dos mortos
  rationale: Mantém a metáfora bíblica de πρωτότοκος e a construção genitiva do grego sem explicar no texto se o foco recai sobre prioridade, preeminência ou ambas.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: o soberano dos reis da terra
  rationale: “Soberano” comunica com clareza a autoridade de ἄρχων sobre os reis, enquanto “da terra” corresponde ao alcance amplo de γῆ no contexto de Apocalipse.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Àquele que nos ama
  rationale: O presente ἀγαπῶντι indica ação contínua; o presente simples em português a expressa naturalmente.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: nos libertou dos nossos pecados
  rationale: λύω significa soltar ou libertar, e ἐκ indica separação; a formulação preserva a imagem de libertação.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: por meio do seu sangue
  rationale: Interpreta ἐν em sentido instrumental e explicita de modo natural em português que o sangue é o meio da libertação, sem eliminar a linguagem sacrificial.
theological_decisions:
- issue: Variante textual no particípio depois de “nos ama”
  choice: λύσαντι — “nos libertou”
  alternative: λούσαντι — “nos lavou”
  rationale: O texto-base SBLGNT traz λύσαντι. A variante λούσαντι, conhecida e teologicamente relevante, é registrada em nota sem substituir a leitura do texto-base.
- issue: Tradução do título Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O termo funciona como título neste contexto. “Messias” comunica seu valor titular em português, enquanto a alternativa tradicional é preservada em nota.
- issue: Sentido de πρωτότοκος τῶν νεκρῶν
  choice: o primogênito dos mortos
  alternative: o primeiro a ressuscitar dentre os mortos
  rationale: A tradução mantém a metáfora e a possível associação entre prioridade e preeminência, evitando reduzir a expressão a uma paráfrase exclusivamente cronológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura “da parte de” expressa a procedência indicada por ἀπό; a sequência de títulos conserva o paralelismo do grego. O travessão final mantém a continuidade sintática e doxológica com o versículo seguinte.
