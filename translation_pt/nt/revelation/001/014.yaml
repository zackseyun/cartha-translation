  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: pt
  text: A cabeça e os cabelos dele eram brancos[a], como lã branca, como a neve; e os olhos dele eram como chama de fogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a cabeça e os cabelos dele eram brancos como lã branca, como a neve”.'
    reason: lexical_alternative
  - marker: b
    text: A imagem remete a Daniel 7:9 e ressalta o caráter visionário da descrição.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: Conectivo leve que dá continuidade à descrição; em português, a progressão é natural sem introduzir um marcador temporal ou discursivo artificial.
- source_word: κεφαλὴ
  choice: cabeça
  rationale: Equivalente anatômico direto, apropriado à descrição visionária.
- source_word: τρίχες
  choice: cabelos
  rationale: O plural coletivo é idiomático em português e preserva a referência aos fios da cabeça.
- source_word: λευκαὶ
  choice: brancos
  rationale: Mantém o sentido básico de cor e concorda naturalmente com os dois substantivos coordenados.
- source_word: ὡς ἔριον λευκόν
  choice: como lã branca
  rationale: Preserva a comparação explícita e a repetição enfática da brancura.
- source_word: ὡς χιών
  choice: como a neve
  rationale: Conserva a segunda comparação cumulativa em formulação natural em português.
- source_word: ὀφθαλμοὶ
  choice: olhos
  rationale: Equivalente anatômico padrão.
- source_word: ὡς φλὸξ πυρός
  choice: como chama de fogo
  rationale: Reproduz de perto a construção grega e conserva a imagem apocalíptica sem explicá-la no corpo do texto.
theological_decisions:
- issue: Descrição simbólica do Filho do Homem exaltado
  choice: Manter literalmente as imagens visionárias, sem interpretar seu simbolismo no texto principal.
  alternative: Acrescentar linguagem explicativa que associe a brancura ou o fogo a pureza, eternidade ou juízo.
  rationale: O versículo apresenta comparações visuais, não uma explicação doutrinária explícita; manter as imagens preserva sua abertura e tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação com ponto e vírgula separa as duas partes da descrição sem romper sua unidade. Os marcadores [a] e [b] aparecem no texto principal.
