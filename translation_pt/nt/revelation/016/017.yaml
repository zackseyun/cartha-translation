- from: 'E o sétimo derramou a sua taça no ar. Então saiu do santuário, vindo do trono, uma voz forte, que dizia: “Está feito”.[a]'
  to: 'E o sétimo derramou a sua taça no ar, e saiu do santuário, do trono, uma voz forte, dizendo: “Está feito”.[a]'
  rationale: A revisão retira a inferência temporal acrescentada por «Então», restaura numa única frase a coordenação do original e reproduz de modo mais claro as duas indicações de origem («do santuário, do trono»). Mantém «Está feito», uma tradução legítima e natural do perfeito resultativo Γέγονεν, e ajusta a nota para alternativas idiomáticas.
