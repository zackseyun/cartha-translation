reference: Revelation 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: pt
  text: 'E o sétimo derramou a sua taça no ar, e saiu do santuário, do trono, uma voz forte, dizendo: “Está feito”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aconteceu” ou “Está concluído”.'
    reason: alternativa lexical para o perfeito Γέγονεν
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: o sétimo
  rationale: 'Mantém a elipse do grego: pelo contexto, trata-se do sétimo anjo, mas o substantivo não é expresso neste versículo.'
- source_word: ἐξέχεεν
  choice: derramou
  rationale: Equivalente natural de ἐκχέω e coerente com a fórmula repetida das taças neste capítulo.
- source_word: φιάλην
  choice: taça
  rationale: Representa um recipiente largo e evita termos que sugiram um pequeno frasco.
- source_word: ἐπὶ τὸν ἀέρα
  choice: no ar
  rationale: Expressão natural em português depois de “derramou”; comunica o âmbito ou alvo do derramamento sem o artificialismo de “sobre o ar”.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: saiu ... uma voz forte
  rationale: Preserva o movimento de ἐξῆλθεν; “voz forte” expressa naturalmente a intensidade de μεγάλη.
- source_word: ἐκ τοῦ ναοῦ
  choice: do santuário
  rationale: ναός designa especificamente o santuário, em contraste com um termo que abrangeria todo o complexo do templo.
- source_word: ἀπὸ τοῦ θρόνου
  choice: vindo do trono
  rationale: Mantém a segunda indicação de origem e deixa claro, em português natural, que a voz procede tanto do santuário quanto do trono.
- source_word: λέγουσα
  choice: que dizia
  rationale: Retoma gramaticalmente “voz” e traduz de modo corrente o particípio feminino.
- source_word: Γέγονεν
  choice: Está feito
  rationale: 'Expressa concisamente o valor perfeito e resultativo: algo chegou à sua realização e permanece concluído.'
theological_decisions:
- issue: Sentido de ναός na cena celestial
  choice: santuário
  alternative: templo
  rationale: A opção preserva a especificidade lexical do termo grego sem ampliar a imagem para todo o complexo do templo.
- issue: Força resultativa de Γέγονεν
  choice: Está feito
  alternative: Aconteceu / Chegou a acontecer
  rationale: “Está feito” comunica conclusão com resultado presente, sem especificar além do texto o que foi consumado; a nota conserva a possibilidade mais estritamente eventiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi dividida em duas frases para evitar uma sequência pesada, sem alterar a progressão do grego. O único marcador de nota, [a], aparece no texto principal.
