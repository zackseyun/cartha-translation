  - severity: low
    issue: Alternativa de nota pouco idiomática
    rationale: «Chegou a acontecer» não é uma alternativa natural em português moderno para Γέγονεν. «Aconteceu» é claro; «Está concluído» pode registrar a nuance resultativa.
