id: REV.16.14
reference: Revelation 16:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: pt
  text: Pois são espíritos de demônios[a] que realizam sinais e saem ao encontro dos reis de todo o mundo[b], a fim de reuni-los para a batalha do grande dia do Deus Todo-Poderoso—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espíritos demoníacos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de todo o mundo habitado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: espíritos de demônios
  rationale: Mantém de perto a construção genitiva do grego e sua possível nuance descritiva, sem decidir além do texto se são espíritos pertencentes a demônios ou caracterizados como demoníacos.
- source_word: ποιοῦντα σημεῖα
  choice: que realizam sinais
  rationale: A expressão é natural em português e preserva σημεῖα como “sinais”, sem classificá-los como simples truques nem equipará-los explicitamente aos milagres divinos.
- source_word: ἃ ἐκπορεύεται
  choice: e saem
  rationale: Embora o verbo grego esteja formalmente no singular, o pronome relativo plural retoma os espíritos. O plural em português transmite com clareza o sentido da construção.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: ao encontro dos reis
  rationale: Com verbo de movimento, ἐπί indica aqui direção aos reis. “Ao encontro dos reis” expressa esse movimento sem sugerir prematuramente hostilidade contra eles.
- source_word: τῆς οἰκουμένης ὅλης
  choice: de todo o mundo
  rationale: Expressa naturalmente o alcance global e político de οἰκουμένη, deixando em nota a formulação mais literal “mundo habitado”.
- source_word: συναγαγεῖν
  choice: a fim de reuni-los
  rationale: Torna explícita, de modo natural, a finalidade do infinitivo grego.
- source_word: εἰς τὸν πόλεμον
  choice: para a batalha
  rationale: 'No contexto, εἰς tem força final: os reis são reunidos para o conflito. “Batalha” preserva o evento singular em vista.'
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: do grande dia
  rationale: Reproduz de forma idiomática e solene a cadeia genitiva que associa a batalha ao grande dia.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: do Deus Todo-Poderoso
  rationale: “Todo-Poderoso” é a forma portuguesa tradicional, clara e digna do título divino παντοκράτωρ.
theological_decisions:
- issue: Natureza dos sinais realizados pelos espíritos
  choice: Traduzir simplesmente como “sinais”, apresentando-os como atos atribuídos a espíritos de demônios sem explicar seu mecanismo.
  alternative: Chamados de truques aparentes ou, no extremo oposto, explicitamente de milagres equivalentes aos atos divinos.
  rationale: O termo σημεῖα não resolve se os atos são prodígios sobrenaturais reais, sinais falsificados ou enganos de outra natureza; a tradução preserva essa tensão.
- issue: Relação expressa por δαιμονίων
  choice: “espíritos de demônios”
  alternative: “espíritos demoníacos”
  rationale: A forma escolhida conserva a estrutura genitiva e a ambiguidade relacional do original, evitando reduzir o sentido a um simples adjetivo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene e apocalíptico. O travessão final foi mantido porque a frase continua no contexto imediato.
