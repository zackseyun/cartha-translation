id: REV.16.16
reference: Revelation 16:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: pt
  text: E os reuniu[a] no lugar que, em hebraico, se chama Armagedom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «reuniu-os», com verbo no singular e sem declarar o sujeito. O agente pode ser uma figura singular implícita; porém, nos versículos 13–14, são os espíritos impuros que saem para reunir os reis.
    reason: alternative_reading
  - marker: b
    text: Ou «na língua hebraica/aramaica». Em Apocalipse, «em hebraico» indica a forma semítica do nome, sem necessariamente estabelecer uma distinção estrita entre hebraico e aramaico.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: os reuniu
  rationale: A forma verbal grega está no singular e não traz sujeito expresso. A construção portuguesa sem pronome explícito preserva essa característica e evita transformar o agente em plural com base apenas no contexto anterior.
- source_word: αὐτούς
  choice: os
  rationale: Pronome acusativo masculino plural, retomando no contexto os reis reunidos para a batalha.
- source_word: εἰς τὸν τόπον
  choice: no lugar
  rationale: Embora εἰς costume marcar movimento para um destino, com o verbo reunir o português idiomático usa «reunir no lugar», exprimindo adequadamente o ponto para o qual são congregados.
- source_word: τὸν καλούμενον
  choice: que ... se chama
  rationale: O particípio passivo é expresso por uma oração relativa natural em português, mantendo o sentido de denominação.
- source_word: Ἑβραϊστί
  choice: em hebraico
  rationale: É a tradução direta e convencional. Uma nota registra que, no uso joanino, a expressão pode abranger a forma linguística semítica, inclusive o aramaico.
- source_word: Ἁρμαγεδών
  choice: Armagedom
  rationale: Transliteração tradicional e amplamente reconhecida em português do nome próprio grego.
theological_decisions:
- issue: Agente da reunião
  choice: 'Manter o sujeito singular implícito: «os reuniu»'
  alternative: «eles os reuniram» ou «ele os reuniu»
  rationale: συνήγαγεν é inequivocamente singular, mas o sujeito não está expresso. Não se deve converter a forma em plural apenas porque os espíritos impuros aparecem como agentes nos versículos 13–14; tampouco se deve inserir «ele» e identificar mais explicitamente um agente. A nota conserva a tensão entre a gramática singular e o contexto plural.
translation_notes:
  register: Português moderno, digno e conciso, com boa legibilidade brasileira. A ordem «E os reuniu» é natural e preserva o sujeito não expresso do grego. «Armagedom» segue a forma consagrada em português.
