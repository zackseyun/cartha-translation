id: REV.16.4
reference: Revelation 16:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: pt
  text: E o terceiro derramou a sua taça nos rios e nas fontes das águas, e as águas se transformaram em sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «e tornou-se sangue». O verbo singular pode resumir coletivamente as águas dos rios e das fontes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: o terceiro
  rationale: Preserva a elipse do grego, no qual o substantivo é subentendido pelo contexto imediato; não é necessário acrescentar «anjo».
- source_word: ἐξέχεεν
  choice: derramou
  rationale: Equivalente corrente e preciso de ἐκχέω no contexto do derramamento da taça.
- source_word: φιάλην
  choice: taça
  rationale: φιάλη designa um recipiente largo e pouco fundo; «taça» é a equivalência tradicional e natural em português, sem a ideia moderna de um pequeno frasco.
- source_word: εἰς τοὺς ποταμούς
  choice: nos rios
  rationale: Em português, «derramar nos rios» expressa naturalmente o movimento indicado por εἰς, sem exigir a forma menos fluida «para dentro dos rios».
- source_word: πηγὰς τῶν ὑδάτων
  choice: fontes das águas
  rationale: Mantém a construção genitiva e o sentido de πηγή como nascente ou fonte de água, em linguagem bíblica ainda compreensível.
- source_word: ἐγένετο αἷμα
  choice: tudo se transformou em sangue
  rationale: A forma singular resume coletivamente as águas dos rios e das fontes. «Tudo» torna esse referente coletivo natural em português e conserva claramente a ideia de transformação.
theological_decisions:
- issue: Referente implícito do singular ἐγένετο
  choice: As águas dos rios e das fontes, tomadas coletivamente, transformaram-se em sangue
  alternative: Os rios e as fontes se transformaram em sangue
  rationale: O verbo grego está no singular, embora venha depois de dois substantivos plurais. A tradução com «tudo» preserva a sumarização coletiva e a transformação, sem limitar indevidamente o referente nem converter o verbo em plural.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A elipse «o terceiro» foi mantida; «fontes das águas» conserva a imagem do original, e «tudo se transformou» comunica de modo natural o singular coletivo da oração final.
