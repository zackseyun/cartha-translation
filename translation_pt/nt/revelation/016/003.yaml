id: REV.16.3
reference: Revelation 16:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: pt
  text: E o segundo derramou a sua taça no mar, e o mar se transformou em sangue como o de um morto; e morreu todo ser vivente que havia no mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: o segundo
  rationale: Mantém a elipse do grego; o contexto identifica o referente como o segundo anjo, sem inserir aqui um substantivo que não está expresso.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: É a forma natural e fiel de expressar ἐκχέω no contexto das taças de julgamento.
- source_word: φιάλην
  choice: taça
  rationale: Representa um recipiente largo e pouco profundo, evitando termos como “frasco”, que sugerem formato inadequado.
- source_word: εἰς τὴν θάλασσαν
  choice: no mar
  rationale: Em português, “derramar no mar” expressa naturalmente o movimento indicado por εἰς.
- source_word: ἐγένετο αἷμα
  choice: o mar se transformou em sangue
  rationale: Explicita o referente do sujeito implícito e preserva a afirmação forte de transformação, não mera aparência.
- source_word: ὡς νεκροῦ
  choice: como o de um morto
  rationale: Conserva a comparação elíptica do grego, entendendo “o” como “sangue”, e preserva o singular νεκροῦ sem especificar sexo desnecessariamente.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: todo ser vivente
  rationale: Transmite a expressão semítica referente a seres vivos e evita o sentido antropológico moderno de “alma”.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Correspondência direta e sóbria ao verbo grego.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: que havia no mar
  rationale: Liga naturalmente a expressão aos seres vivos mencionados e comunica que estavam no mar.
theological_decisions:
- issue: Natureza da imagem da praga
  choice: Afirmar que o mar se transformou em sangue dentro da visão
  alternative: Dizer apenas que o mar parecia sangue
  rationale: O grego declara que ele se tornou sangue e só então compara esse sangue ao de um morto; a tradução preserva a força do juízo visionário sem atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida por “e” preserva o ritmo narrativo do grego. Não há nota, pois “como o de um morto” comunica no corpo do texto a comparação literal sem exigir alternativa lexical.
