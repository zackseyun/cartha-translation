id: REV.16.18
reference: Revelation 16:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: pt
  text: Houve relâmpagos, vozes[a] e trovões, e ocorreu um grande terremoto, como nunca havia ocorrido desde que os seres humanos passaram a existir na terra — tão grande foi aquele terremoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sons».
    reason: φωναί pode indicar vozes ou sons; o contexto de relâmpagos e trovões permite o sentido não pessoal.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: relâmpagos
  rationale: O plural comunica as manifestações repetidas e é a forma natural em português.
- source_word: φωναὶ
  choice: vozes
  rationale: Preserva o sentido básico e a ambiguidade de φωνή dentro da fórmula apocalíptica recorrente; a alternativa contextual «sons» é indicada em nota.
- source_word: βρονταί
  choice: trovões
  rationale: Plural natural que representa as manifestações repetidas do trovão.
- source_word: σεισμὸς
  choice: terremoto
  rationale: Equivalente corrente e preciso no contexto.
- source_word: μέγας
  choice: grande
  rationale: Mantém o registro elevado e a repetição enfática do texto grego sem acrescentar uma avaliação estranha ao texto.
- source_word: οἷος οὐκ ἐγένετο
  choice: como nunca havia ocorrido
  rationale: Expressa de modo natural a comparação com todos os terremotos anteriores e seu caráter sem precedente.
- source_word: ἀφ’ οὗ
  choice: desde que
  rationale: Representa diretamente a relação temporal.
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: os seres humanos passaram a existir na terra
  rationale: ἄνθρωποι designa aqui a humanidade em geral; «seres humanos» evita uma leitura exclusivamente masculina, e «passaram a existir» conserva a força de ἐγένοντο.
- source_word: τηλικοῦτος ... οὕτω μέγας
  choice: tão grande foi aquele terremoto
  rationale: Reproduz a intensificação conclusiva e enfática em português claro e digno.
theological_decisions:
- issue: Sentido genérico de ἄνθρωποι na comparação histórica apocalíptica
  choice: os seres humanos
  alternative: os homens
  rationale: A referência é a toda a humanidade presente na terra, não especificamente a pessoas do sexo masculino; a escolha comunica esse alcance sem alterar o conteúdo teológico.
- issue: Possível caráter pessoal ou não pessoal de φωναί
  choice: vozes
  alternative: sons
  rationale: «Vozes» mantém aberta a possibilidade de emissões pessoais ou celestes e corresponde ao uso recorrente da fórmula em Apocalipse; a nota registra a leitura não pessoal adequada ao cenário de tempestade e teofania.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção final com travessão conserva a ênfase e a repetição deliberada do terremoto presentes no grego.
