id: REV.16.7
reference: Revelation 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: pt
  text: 'E ouvi o altar dizer[a]: “Sim, Senhor Deus, o Todo-Poderoso, verdadeiros e justos são os teus juízos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouvi, vindo do altar, alguém dizer”. O grego pode indicar a fonte do que João ouviu, embora a redação apresente mais naturalmente o altar personificado como quem fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ouvi
  rationale: O aoristo de ἀκούω indica de modo natural um acontecimento passado simples; “ouvi” não acrescenta a ideia de atenção deliberada presente em “escutei”.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: o altar dizer
  rationale: Embora o genitivo com ἤκουσα possa indicar a fonte do som, o particípio λέγοντος apresenta mais naturalmente o próprio altar como quem fala. A formulação preserva a personificação vívida do texto sem acrescentar “voz”.
- source_word: Ναί
  choice: Sim
  rationale: Partícula afirmativa forte, aqui com valor responsivo; “Sim” é claro e natural em português.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Senhor Deus, o Todo-Poderoso
  rationale: Mantém os três elementos da invocação divina e conserva o artigo diante de παντοκράτωρ numa formulação portuguesa natural e solene.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: verdadeiros e justos
  rationale: Os adjetivos predicativos qualificam κρίσεις. “Verdadeiros” comunica confiabilidade e conformidade com a verdade; “justos” preserva o peso judicial e moral.
- source_word: αἱ κρίσεις σου
  choice: os teus juízos
  rationale: “Juízos” expressa adequadamente decisões e atos judiciais, preservando o registro forense e a concisão do grego.
theological_decisions:
- issue: Personificação do altar como falante
  choice: “ouvi o altar dizer”
  alternative: “ouvi, vindo do altar, alguém dizer” ou “ouvi uma voz do altar dizer”
  rationale: O grego permite entender o genitivo como fonte do que foi ouvido, mas associa diretamente ao altar o particípio “dizer”. A opção principal conserva a personificação apocalíptica e evita inserir “voz”, palavra ausente no texto.
- issue: Forma da invocação divina
  choice: “Senhor Deus, o Todo-Poderoso”
  alternative: “Senhor, Deus Todo-Poderoso”
  rationale: A tradução escolhida representa distintamente κύριε, ὁ θεός e ὁ παντοκράτωρ, sem fundir os títulos nem diminuir a força da aposição.
- issue: Ordem predicativa dos adjetivos
  choice: “verdadeiros e justos são os teus juízos”
  alternative: “os teus juízos são verdadeiros e justos”
  rationale: A ordem marcada preserva a ênfase inicial do grego sobre a verdade e a justiça dos juízos, permanecendo clara e digna em português.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Emprega “teus” em discurso direto a Deus, forma amplamente compreensível e adequada ao registro bíblico, sem arcaísmos desnecessários.
