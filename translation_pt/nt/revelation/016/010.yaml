  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: pt
  text: O quinto derramou sua taça sobre o trono da besta, e o reino dela ficou escurecido; eles roíam as próprias línguas por causa da dor,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: o quinto
  rationale: Mantém o ordinal substantivado do grego sem acrescentar “anjo”, termo apenas implícito pelo contexto da série.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: derramou sua taça
  rationale: “Derramar” é o equivalente natural de ἐκχέω neste contexto, e “taça” comunica melhor que “frasco” o recipiente largo indicado por φιάλη.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: sobre o trono da besta
  rationale: Reproduz diretamente a relação espacial expressa por ἐπί e preserva a imagem apocalíptica tradicional de θηρίον.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: o reino dela
  rationale: “Reino” traduz diretamente βασιλεία como domínio real; “dela” retoma de modo claro e natural “a besta” em português.
- source_word: ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη
  choice: o reino dela ficou coberto de trevas
  rationale: “Ficou” expressa o início do estado resultante, enquanto “coberto de trevas” comunica naturalmente o valor passivo e resultativo de ἐσκοτωμένη.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: mordiam a própria língua
  rationale: O imperfeito “mordiam” preserva a ação contínua; o singular distributivo “a própria língua” é idiomático em português e deixa claro que cada pessoa mordia a sua.
- source_word: ἐκ τοῦ πόνου
  choice: por causa da dor
  rationale: Expressa com clareza o valor causal de ἐκ neste contexto.
theological_decisions:
- issue: Referente do pronome em ἡ βασιλεία αὐτοῦ
  choice: o reino dela
  alternative: seu reino
  rationale: O referente contextual é a besta. “Dela” evita a ambiguidade que “seu” poderia criar em português, sem acrescentar uma interpretação teológica.
- issue: Intensidade da imagem do juízo de escuridão
  choice: ficou coberto de trevas
  alternative: foi mergulhado em trevas
  rationale: A opção escolhida conserva o estado passivo resultante sem acrescentar a imagem mais intensa de ser “mergulhado”, ausente do verbo grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação do grego foi preservada sem tornar o período pesado; a vírgula final foi mantida porque o versículo continua na unidade sintática seguinte.
