  to: O quinto derramou sua taça sobre o trono da besta, e o reino dela ficou escurecido; eles roíam as próprias línguas por causa da dor,
  rationale: A revisão substitui o acréscimo imagético “coberto de trevas” por “escurecido”, correspondente direto de ἐσκοτωμένη, e “mordiam a própria língua” por “roíam as próprias línguas”, que preserva melhor o sentido durativo e intensivo de ἐμασῶντο e o plural do original. As notas foram removidas porque não acrescentam informação necessária ao leitor e a nota sobre “escurecido” se torna redundante.
