review_pass:
  verdict: revise
  source_fidelity: A estrutura principal, o ordinal sem acrescentar “anjo”, “taça”, “trono da besta”, o reino da besta e a causa da dor estão bem representados. Contudo, “mordiam” é menos específico que ἐμασῶντο, que descreve roer/mascar repetidamente; e “coberto de trevas” acrescenta a imagem de cobertura, enquanto ἐσκοτωμένη afirma que o reino se tornou escurecido.
  naturalness: O português é claro e de registro adequado. “Roíam as próprias línguas” é uma formulação deliberadamente forte, mas natural o bastante no contexto visionário e preserva melhor tanto o plural grego quanto a ação durativa.
  terminology: “Besta”, “taça”, “trono” e “reino” são escolhas estabelecidas e adequadas. “Escurecido” corresponde diretamente ao particípio passivo resultativo. Não é necessária nota para “dela”, pois o referente já está inequívoco no texto português.
  issues:
  - severity: medium
    issue: “Mordiam a própria língua” enfraquece ἐμασῶντο τὰς γλώσσας αὐτῶν.
    rationale: O verbo grego denota roer ou mascar, não apenas morder. Além disso, o plural “línguas” deve ser preservado sem dificuldade em português.
  - severity: low
    issue: “Ficou coberto de trevas” é mais imagético que ἐσκοτωμένη.
    rationale: A expressão pode sugerir uma cobertura externa; o grego descreve o reino como tornado escurecido. “Ficou escurecido” mantém a força passiva/resultativa sem expansão.
  - severity: low
    issue: As duas notas não são necessárias após a revisão.
    rationale: O pronome “dela” já retoma claramente “a besta”, e a formulação principal “ficou escurecido” traduz diretamente o particípio grego.
