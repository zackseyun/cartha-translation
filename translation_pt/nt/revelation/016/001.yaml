id: REV.16.1
reference: Revelation 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: pt
  text: 'E ouvi uma voz forte, vinda do santuário[a], que dizia aos sete anjos: “Vão e derramem sobre a terra as sete taças da ira de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo”. O termo grego ναός pode designar mais especificamente o santuário interior, e não todo o complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: uma voz forte
  rationale: Em associação com φωνή, μέγας indica volume elevado; “voz forte” é natural em português e conserva a intensidade da expressão.
- source_word: ναοῦ
  choice: santuário
  rationale: ναός costuma designar especificamente o recinto sagrado ou santuário interior, em contraste com o complexo mais amplo do templo; “santuário” preserva essa especificidade no cenário celestial de Apocalipse.
- source_word: λεγούσης
  choice: que dizia
  rationale: O particípio presente concorda com “voz”; a oração relativa é idiomática em português e mantém a voz como agente da fala.
- source_word: Ὑπάγετε
  choice: Vão
  rationale: O imperativo plural ordena aos sete anjos que partam para cumprir a ação; “Vão” é direto e natural.
- source_word: ἐκχέετε
  choice: derramem
  rationale: O verbo retrata o esvaziamento do conteúdo das taças e mantém a imagem recorrente de juízo.
- source_word: φιάλας
  choice: taças
  rationale: φιάλη designa um recipiente largo e raso, não um frasco; “taças” é a forma bíblica corrente e compreensível em português.
- source_word: θυμοῦ
  choice: ira
  rationale: No contexto apocalíptico, θυμός expressa a intensa reação judicial de Deus; “ira” preserva a gravidade sem acrescentar conteúdo ao texto.
- source_word: εἰς τὴν γῆν
  choice: sobre a terra
  rationale: Com ἐκχέω, εἰς indica movimento dirigido à superfície ou ao domínio terrestre; “sobre a terra” é claro, natural e adequado ao alcance cósmico do contexto.
theological_decisions:
- issue: Sentido de ναός no cenário celestial
  choice: santuário
  alternative: templo
  rationale: “Santuário” mantém a referência provável ao recinto sagrado propriamente dito, sem ampliar automaticamente o termo para todo o complexo do templo.
- issue: Sentido de θυμός τοῦ θεοῦ
  choice: a ira de Deus
  alternative: a fúria de Deus; a indignação de Deus
  rationale: “Ira” comunica de modo solene a reação judicial divina contra o mal, preservando a formulação do texto sem resolver além dele questões doutrinárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “Vão e derramem”, concordando com os sete anjos, e “taças” em vez do tradicional e inexato “frascos”. O conectivo Καί foi vertido por “Então” para marcar naturalmente a progressão narrativa.
