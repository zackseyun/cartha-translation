id: REV.16.21
reference: Revelation 16:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: pt
  text: E cai do céu sobre as pessoas uma forte chuva de granizo, com pedras de cerca de um talento cada[a]. E as pessoas blasfemaram contra Deus por causa da praga do granizo, pois essa praga é extremamente severa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, cada pedra pesava aproximadamente um talento. O peso exato de um talento variava, mas correspondia a várias dezenas de quilogramas; o grego indica aproximação, não uma medida exata.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois a sua praga é muito grande”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: uma forte chuva de granizo
  rationale: A expressão portuguesa é natural e conserva o sentido coletivo do singular grego, enquanto o contexto e a indicação de peso mostram que se trata de pedras enormes.
- source_word: ὡς ταλαντιαία
  choice: com pedras de cerca de um talento cada
  rationale: Explicita de modo idiomático que o talento indica o peso aproximado de cada pedra. “Cerca de” preserva a comparação de ὡς, sem sugerir medida exata.
- source_word: καταβαίνει
  choice: caiu
  rationale: Embora o grego use o presente vívido, o pretérito é mais natural na sequência narrativa em português e comunica claramente a ação da queda.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: “Céu” preserva tanto a origem acima da terra quanto o registro teológico e apocalíptico de Apocalipse.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: sobre as pessoas
  rationale: ἄνθρωποι é genérico, não especificamente masculino; “as pessoas” é claro, inclusivo e natural em português moderno.
- source_word: ἐβλασφήμησαν
  choice: blasfemaram contra
  rationale: Quando o objeto é Deus, “blasfemar contra” preserva diretamente a gravidade religiosa do verbo grego.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: por causa da praga do granizo
  rationale: ἐκ tem valor causal, e “praga” mantém a terminologia recorrente dos juízos em Apocalipse.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: pois essa praga era extremamente severa
  rationale: “Extremamente severa” transmite a forte intensificação de μεγάλη ... σφόδρα em português atual, e “essa” retoma sem ambiguidade a praga causada pelo granizo.
theological_decisions:
- issue: Sentido de οὐρανός no contexto do juízo apocalíptico
  choice: do céu
  alternative: do firmamento
  rationale: “Do céu” conserva a possível referência atmosférica e, ao mesmo tempo, o enquadramento teológico do juízo que procede do alto, sem resolver indevidamente a amplitude do termo.
- issue: Referência genérica de ἄνθρωποι
  choice: as pessoas
  alternative: os seres humanos
  rationale: O substantivo abrange seres humanos em geral. “As pessoas” evita uma leitura exclusivamente masculina e mantém linguagem comum e digna.
- issue: Relação causal entre a praga e a blasfêmia
  choice: por causa da praga ... pois essa praga era extremamente severa
  alternative: por causa da praga ... porque a praga era muito grande
  rationale: Mantém as duas expressões causais do grego e não elimina a tensão teológica de pessoas que respondem ao juízo com blasfêmia, em vez de arrependimento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom solene sem arcaísmo. “Chuva de granizo” torna idiomático o coletivo grego; “pedras” explicita apenas o que a referência ao peso individual já implica no contexto.
