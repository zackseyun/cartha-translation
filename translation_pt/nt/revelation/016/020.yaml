id: REV.16.20
reference: Revelation 16:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: pt
  text: E toda ilha fugiu[a], e os montes não foram encontrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desapareceu”. O verbo grego significa literalmente “fugiu”, preservando a personificação vívida do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: toda ilha
  rationale: 'Com o substantivo no singular, πᾶσα tem sentido distributivo: cada ilha, sem exceção. “Toda ilha” conserva essa construção de modo natural e solene em português.'
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O verbo φεύγω significa literalmente “fugir”. A opção preserva a personificação vívida da ilha e não reduz a imagem apocalíptica a uma explicação como “desapareceu”.
- source_word: ὄρη
  choice: os montes
  rationale: ὄρη é o plural de ὄρος, “monte” ou “montanha”. “Montes” é corrente na linguagem bíblica em português, e o artigo torna a frase natural sem alterar a referência.
- source_word: οὐχ εὑρέθησαν
  choice: não foram encontrados
  rationale: A tradução reproduz diretamente a negação e o aoristo passivo de εὑρίσκω, sem acrescentar explicitamente ideias como “já não existiam” ou “desapareceram”.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: A repetição mantém a coordenação cumulativa e o estilo paratático do texto grego.
theological_decisions:
- issue: Se a linguagem cósmica apocalíptica deve ser explicada como desaparecimento literal ou como imagem simbólica
  choice: 'Manter a imagem concreta e personificada: “toda ilha fugiu”'
  alternative: Interpretar no próprio texto como “toda ilha desapareceu”
  rationale: O grego apresenta a cena sem definir se seu referente deve ser entendido literal ou simbolicamente. A tradução preserva essa tensão e deixa sua interpretação em aberto.
translation_notes:
  register: Português moderno, claro e digno, com cadência próxima da construção grega. “Montes” favorece a legibilidade bíblica ampla; a formulação passiva preserva a estrutura da fonte.
