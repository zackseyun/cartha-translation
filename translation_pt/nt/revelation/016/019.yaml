id: REV.16.19
reference: Revelation 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: pt
  text: E a grande cidade foi dividida em três partes, e as cidades das nações caíram. A grande Babilônia foi lembrada diante de Deus[a], para que ele lhe desse o cálice do vinho do furor da sua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «veio à lembrança diante de Deus». Esta expressão bíblica indica que Babilônia chegou à atenção de Deus para receber juízo.
    reason: alternativa lexical e explicação de um idiomatismo bíblico
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: foi dividida em três partes
  rationale: 'A construção indica o estado resultante: a cidade passou a estar em três partes. A forma passiva natural em português comunica claramente esse resultado sem acrescentar a causa da divisão.'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: a grande cidade
  rationale: Tradução direta que preserva a imagem urbana e a designação recorrente no Apocalipse.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: as cidades das nações
  rationale: Neste contexto de juízo de alcance mundial, «nações» representa naturalmente ἔθνη sem restringir o sentido a uma categoria religiosa.
- source_word: ἔπεσαν
  choice: caíram
  rationale: Mantém a linguagem vívida e concisa do texto grego; «desabaram» explicitaria uma forma específica de ruína que o verbo não exige.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: a grande Babilônia
  rationale: Forma idiomática em português que conserva o título apocalíptico e a ênfase do adjetivo.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: foi lembrada diante de Deus
  rationale: Preserva de perto o idiomatismo bíblico segundo o qual Babilônia chega à atenção judicial de Deus, sem substituí-lo por uma paráfrase interpretativa.
- source_word: δοῦναι αὐτῇ
  choice: para que ele lhe desse
  rationale: Explicita de modo natural em português o sujeito divino implícito do infinitivo e comunica sua nuance de propósito ou resultado.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: o cálice do vinho
  rationale: «Cálice» preserva a metáfora bíblica de uma porção destinada, especialmente no contexto de juízo, e mantém a cadeia genitiva.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: do furor da sua ira
  rationale: Emprega dois termos distintos para conservar a intensificação produzida por θυμός e ὀργή, sem fundi-los numa única expressão.
theological_decisions:
- issue: O idiomatismo judicial ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: foi lembrada diante de Deus
  alternative: Deus se lembrou dela para julgá-la
  rationale: A opção escolhida conserva o idioma e a tensão do original. O contexto e a nota esclarecem que não se trata de Deus ter esquecido Babilônia, mas de ela chegar à sua atenção para receber juízo.
- issue: A distinção entre θυμός e ὀργή
  choice: o furor da sua ira
  alternative: a sua ira furiosa
  rationale: A tradução retém dois substantivos relacionados, acompanhando a intensificação retórica do grego e evitando reduzir os dois termos a um só.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Conservam-se a concisão e as imagens apocalípticas do grego. O marcador foi colocado junto à expressão a que a nota efetivamente se refere.
