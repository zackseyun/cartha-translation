id: REV.16.8
reference: Revelation 16:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: pt
  text: E o quarto derramou a sua taça sobre o sol, e foi-lhe dado abrasar as pessoas com fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “abrasar as pessoas em fogo”. O pronome traduzido por “lhe” provavelmente se refere ao sol.'
    reason: Alternativa lexical e esclarecimento do referente pronominal.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: o quarto
  rationale: O adjetivo substantivado remete ao quarto anjo da sequência, mas mantém a concisão do grego sem acrescentar “anjo”.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: É a tradução natural de ἐκχέω no contexto das taças de juízo e preserva a fórmula repetida no capítulo.
- source_word: φιάλην
  choice: taça
  rationale: “Taça” é corrente em português e corresponde ao recipiente largo indicado por φιάλη, além de conservar a imagem cultual e judicial de Apocalipse.
- source_word: ἐπὶ τὸν ἥλιον
  choice: sobre o sol
  rationale: ἐπί com acusativo indica aqui o alvo do derramamento; “sobre o sol” é claro e idiomático.
- source_word: ἐδόθη αὐτῷ
  choice: foi-lhe dado
  rationale: Mantém a construção passiva, sem explicitar o agente divino, e permite que o pronome retome naturalmente “o sol”.
- source_word: καυματίσαι
  choice: abrasar
  rationale: Exprime causar calor intenso ou queimadura; “abrasar” preserva a força da imagem solar em linguagem digna e compreensível.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: O substantivo refere-se genericamente aos seres humanos, não apenas a homens do sexo masculino.
- source_word: ἐν πυρί
  choice: com fogo
  rationale: A preposição pode indicar meio ou maneira; “com fogo” é natural em português, enquanto a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Agência divina implícita em ἐδόθη
  choice: Conservar “foi-lhe dado”, sem nomear quem concedeu.
  alternative: Deus lhe deu poder; foi-lhe permitido
  rationale: A passiva preserva a forma típica de Apocalipse, que sugere a soberania divina sem declarar explicitamente o agente nem acrescentar “poder”.
- issue: Referente de αὐτῷ
  choice: Entender o pronome como referência ao sol.
  alternative: O quarto anjo; um agente não especificado
  rationale: “Sol” é o antecedente gramatical mais próximo, e abrasar pessoas corresponde naturalmente à ação atribuída ao sol; a forma “foi-lhe dado” preserva essa leitura sem explicação intrusiva no texto.
- issue: Sentido genérico de ἀνθρώπους
  choice: Traduzir por “as pessoas”.
  alternative: Os homens; a humanidade
  rationale: O termo grego é genérico, e “as pessoas” comunica isso de modo natural e sem restringir a referência ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase e a passiva preservam de perto a estrutura grega, enquanto “taça”, “abrasar” e “as pessoas” oferecem naturalidade sem eliminar a ambiguidade pertinente.
