id: REV.16.12
reference: Revelation 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: pt
  text: E o sexto derramou a sua taça sobre o grande rio Eufrates, e as suas águas secaram, para que fosse preparado o caminho dos reis que vêm do nascente do sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais simples, «do oriente». Literalmente, «do nascente do sol».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: o sexto
  rationale: Mantém a elipse do grego, que traz apenas o ordinal substantivado e remete ao contexto, sem acrescentar «anjo».
- source_word: ἐξέχεεν
  choice: derramou
  rationale: É a forma corrente e natural para o ato de verter o conteúdo da taça, preservando a imagem de juízo recorrente no Apocalipse.
- source_word: φιάλην
  choice: taça
  rationale: Designa naturalmente em português um recipiente aberto e evita a ideia moderna de um pequeno frasco sugerida por «frasco» ou «ampola».
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: sobre o grande rio Eufrates
  rationale: Preserva a construção apositiva e exprime com naturalidade o alvo do derramamento.
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: as suas águas secaram
  rationale: O plural idiomático «águas» soa natural para o conteúdo de um rio. «Secaram» comunica adequadamente o passivo intransitivo grego em português corrente sem especificar o agente.
- source_word: ἵνα ἑτοιμασθῇ
  choice: para que fosse preparado
  rationale: Mantém tanto a finalidade introduzida por ἵνα quanto a voz passiva do verbo.
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: o caminho dos reis
  rationale: Conserva a relação genitiva e deixa em aberto os matizes literais e simbólicos de ὁδός.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: que vêm do nascente do sol
  rationale: Torna explícita apenas a relação de procedência inerente à expressão, preservando a imagem vívida do lugar onde o sol nasce em vez de reduzi-la simplesmente a «oriente».
theological_decisions:
- issue: Explicitar que «o sexto» é um anjo
  choice: Mantido «o sexto», sem acrescentar «anjo».
  alternative: o sexto anjo
  rationale: Embora o contexto identifique como anjos os que derramam as taças, o versículo não repete o substantivo. A tradução preserva a elipse do original.
- issue: Interpretar simbolicamente o Eufrates seco e a aproximação dos reis
  choice: A imagem foi traduzida diretamente, sem explicação interpretativa.
  alternative: Paráfrases que apresentem a cena como invasão ou reunião escatológica
  rationale: O próprio versículo não define todo o significado da imagem apocalíptica; explicá-la no texto resolveria uma tensão que o original deixa aberta.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Taça», «Eufrates» e «nascente do sol» preservam o tom apocalíptico sem arcaísmo excessivo. O marcador [a] aparece no texto principal junto à expressão que esclarece.
