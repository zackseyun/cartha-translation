id: REV.16.9
reference: Revelation 16:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: pt
  text: As pessoas foram abrasadas por um calor intenso e blasfemaram o nome de Deus, que tem autoridade sobre essas pragas, e não se arrependeram para lhe dar glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: foram abrasadas
  rationale: O aoristo passivo de καυματίζω descreve pessoas queimadas ou chamuscadas pelo calor. “Foram abrasadas” é claro, forte e adequado ao contexto da praga, sem sugerir necessariamente destruição total pelo fogo.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: Embora a forma grega seja masculina plural, o referente é humano em sentido geral, não especificamente homens do sexo masculino. “As pessoas” comunica esse alcance inclusivo em português natural.
- source_word: καῦμα μέγα
  choice: um calor intenso
  rationale: A expressão indica a grande intensidade do calor. “Calor intenso” soa mais natural no português atual do que a reprodução literal “grande calor” e preserva a severidade da cena.
- source_word: ἐβλασφήμησαν
  choice: blasfemaram
  rationale: Quando o objeto é o nome de Deus, βλασφημέω tem o sentido religioso específico de falar de modo ímpio e ultrajante; “blasfemaram” conserva essa força.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: o nome de Deus
  rationale: A formulação mantém o conhecido idioma bíblico no qual o nome representa a identidade, a honra e a reputação revelada de Deus.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: que tem autoridade sobre essas pragas
  rationale: O particípio presente ἔχοντος sustenta “tem”, e ἐξουσία expressa autoridade ou poder legítimo. A formulação conserva diretamente a afirmação do texto.
- source_word: πληγὰς
  choice: pragas
  rationale: Em Apocalipse, πληγή designa repetidamente os juízos em forma de praga e evoca as pragas do Êxodo; “pragas” preserva essa ressonância.
- source_word: οὐ μετενόησαν
  choice: não se arrependeram
  rationale: No contexto de juízo, μετανοέω denota arrependimento moral e espiritual, não apenas mudança de opinião.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: para lhe dar glória
  rationale: A tradução preserva a construção infinitiva e o idioma bíblico concreto “dar glória”, recorrente na linguagem de adoração do Apocalipse.
theological_decisions:
- issue: Alcance de οἱ ἄνθρωποι
  choice: 'Referência inclusiva à humanidade: “as pessoas”'
  alternative: “os homens”
  rationale: O contexto não restringe o juízo aos homens do sexo masculino. A tradução comunica o referente humano geral sem criar uma limitação inexistente no grego.
- issue: Soberania divina em τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: Deus é apresentado como tendo autoridade sobre as pragas
  alternative: Deus está apenas associado às pragas
  rationale: O texto atribui expressamente a Deus ἐξουσία sobre essas pragas. A tradução mantém essa afirmação sem atenuá-la nem ampliá-la além do que o versículo diz.
- issue: Relação entre arrependimento e glorificação em δοῦναι αὐτῷ δόξαν
  choice: 'Preservar a finalidade ou consequência esperada: “não se arrependeram para lhe dar glória”'
  alternative: “não se arrependeram nem lhe deram glória”
  rationale: A alternativa explicita duas ações coordenadas, enquanto o grego subordina δοῦναι a μετενόησαν. A formulação escolhida preserva a ligação sintática e sua tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Abrasadas” preserva a vividez do juízo; “calor intenso” evita literalismo pouco idiomático. A divisão em duas frases melhora a clareza sem alterar a sequência lógica, e “Contudo” explicita a forte oposição já sugerida pelo último καί no contexto.
