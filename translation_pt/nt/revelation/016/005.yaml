  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: pt
  text: 'E ouvi o anjo das águas dizer: “Justo és tu, aquele que é e que era, o Santo[a], porque julgaste estas coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem um título mais extenso, como “aquele que é, que era e que há de vir”, provavelmente em harmonização com fórmulas semelhantes em outras passagens de Apocalipse. O texto aqui seguido diz: “aquele que é e que era, o Santo”.'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: o anjo das águas
  rationale: Preserva de modo natural a construção genitiva grega. No contexto, pode indicar o anjo associado às águas ou encarregado delas, sem tornar explícita uma função que o grego apenas sugere.
- source_word: Δίκαιος
  choice: Justo
  rationale: No contexto de julgamento, “justo” expressa com clareza tanto a retidão moral de Deus quanto a justiça de seus atos, mantendo o tom solene da proclamação.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: aquele que é e que era
  rationale: Reproduz de perto a designação divina substantivada e preserva a diferença intencional entre o presente e o passado no texto grego.
- source_word: ὁ ὅσιος
  choice: o Santo
  rationale: É uma designação portuguesa clara e digna para ὅσιος, que aqui comunica santidade e retidão moral ou pactual.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão pela qual Deus é declarado justo.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo amplo do grego sem substituir seu referente por “estes julgamentos”, embora sejam os juízos do contexto.
- source_word: ἔκρινας
  choice: julgaste
  rationale: O pretérito perfeito simples traduz naturalmente o aoristo como ato concluído e se ajusta ao registro solene da fala dirigida a Deus.
theological_decisions:
- issue: Título divino sem o elemento futuro esperado
  choice: aquele que é e que era, o Santo
  alternative: aquele que é, que era e que há de vir
  rationale: Segue o texto impresso do SBLGNT, ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος, em vez de harmonizá-lo com fórmulas mais longas encontradas em outras passagens de Apocalipse. A variante é registrada em nota.
- issue: Relação sintática de ὁ ὅσιος
  choice: o Santo como título divino em aposição
  alternative: Ó Santo, tu que és e que eras
  rationale: A tradução conserva a sequência e a aposição mais diretas do grego, sem eliminar a possibilidade de entender a expressão de maneira mais vocativa.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A inversão “Justo és tu” preserva o destaque dado a Δίκαιος e o caráter litúrgico da proclamação. O marcador de nota foi colocado após a frase a que se refere.
