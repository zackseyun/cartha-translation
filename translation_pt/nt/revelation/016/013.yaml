source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: pt
  text: E vi sair da boca do dragão, da boca da besta e da boca do falso profeta três espíritos imundos, semelhantes a rãs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vi três espíritos imundos, semelhantes a rãs, saírem da boca do dragão, da boca da besta e da boca do falso profeta.” O grego coloca as expressões repetidas que indicam a origem antes de “três espíritos imundos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω funciona como verbo narrativo simples no relato da visão; “vi” é direto e natural em português.
- source_word: ἐκ τοῦ στόματος
  choice: sair da boca
  rationale: A construção com ἐκ expressa origem ou movimento para fora. O infinitivo “sair” ligado a “vi” torna essa relação clara e idiomática sem acrescentar conteúdo à imagem.
- source_word: δράκοντος
  choice: dragão
  rationale: Preserva a figura simbólica já estabelecida no Apocalipse.
- source_word: θηρίου
  choice: besta
  rationale: É a tradução tradicional e contextual de θηρίον no Apocalipse, mantendo o simbolismo apocalíptico.
- source_word: ψευδοπροφήτου
  choice: falso profeta
  rationale: Equivalente natural do substantivo composto, preservando seu caráter de designação reconhecível.
- source_word: πνεύματα
  choice: espíritos
  rationale: No contexto, refere-se a entidades espirituais; “espíritos” mantém a formulação do versículo sem antecipar a explicação do versículo seguinte.
- source_word: τρία ἀκάθαρτα
  choice: três espíritos impuros
  rationale: “Impuros” comunica a falta de pureza ritual e moral-espiritual de ἀκάθαρτα em linguagem portuguesa atual; a concordância e a posição do adjetivo são naturais.
- source_word: ὡς βάτραχοι
  choice: semelhantes a rãs
  rationale: ὡς estabelece comparação, não identidade. “Semelhantes a rãs” preserva explicitamente a símile e soa dignificado e natural.
theological_decisions:
- issue: Natureza dos πνεύματα ἀκάθαρτα na imagem apocalíptica
  choice: “três espíritos impuros, semelhantes a rãs”
  alternative: “três espíritos demoníacos parecidos com rãs”
  rationale: O texto deste versículo diz apenas “espíritos impuros” e os compara a rãs. A identificação explícita como espíritos de demônios ocorre no versículo seguinte e não deve ser antecipada.
- issue: Relação sintática entre as três expressões de origem e os espíritos
  choice: Manter as expressões de origem antes de “três espíritos impuros”
  alternative: “vi três espíritos impuros, semelhantes a rãs, saírem da boca...”
  rationale: A ordem escolhida acompanha de perto a progressão retórica do grego, com a repetição de “da boca”, sem tornar o português obscuro. A nota registra a alternativa mais corrente.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com registro digno. A repetição “da boca” foi preservada por seu efeito retórico, e a ordem grega foi mantida por ser compreensível em português. A nota oferece a reestruturação sintática mais idiomática como alternativa.
