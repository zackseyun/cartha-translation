base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: pt
  text: porque derramaram o sangue dos santos e dos profetas[a], e tu lhes deste sangue para beber; eles são dignos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “verteram o sangue dos santos e dos profetas”. O verbo grego significa literalmente “derramar” e ecoa as taças de juízo derramadas no contexto.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “são dignos” significa que merecem esse juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa da declaração do anjo no versículo anterior, de maneira clara e natural em português.
- source_word: αἷμα
  choice: sangue
  rationale: Mantém literalmente as duas ocorrências e a correspondência retributiva enfatizada pelo texto.
- source_word: ἁγίων
  choice: santos
  rationale: Designa o povo santo de Deus, como é comum em Apocalipse, sem implicar apenas pessoas posteriormente canonizadas.
- source_word: προφητῶν
  choice: profetas
  rationale: Equivalente direto e natural, coordenado com “santos” para identificar as vítimas.
- source_word: ἐξέχεαν
  choice: derramaram
  rationale: Preserva tanto a expressão portuguesa “derramar sangue” quanto a imagem verbal de derramar, que ecoa as taças derramadas no contexto.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Representa naturalmente o objeto indireto, referindo-se aos responsáveis pelo derramamento de sangue.
- source_word: δέδωκας
  choice: deste
  rationale: Expressa em português uma ação divina concluída cujos efeitos permanecem no contexto; “tens dado” poderia sugerir repetição e soar menos natural aqui.
- source_word: πιεῖν
  choice: para beber
  rationale: Traduz naturalmente o infinitivo que completa o sentido de “deste”.
- source_word: ἄξιοί εἰσιν
  choice: eles são dignos
  rationale: Mantém a formulação avaliativa e solene do grego sem acrescentar no texto principal um objeto que está apenas implícito.
theological_decisions:
- issue: Linguagem de justiça retributiva
  choice: Manter a declaração direta de que Deus lhes deu sangue para beber e de que “eles são dignos”.
  alternative: 'Explicitar: “eles merecem esse castigo”.'
  rationale: O texto apresenta o juízo divino em termos severos e proporcionais. A redação principal preserva essa força e a concisão do original, enquanto a nota esclarece que “dignos” indica merecimento do juízo, não excelência moral.
- issue: Referente de “santos”
  choice: Usar “santos” no sentido bíblico amplo do povo santo de Deus.
  alternative: Usar “os que pertencem a Deus” ou “os santos de Deus”.
  rationale: “Santos” conserva o termo recorrente em Apocalipse sem introduzir uma categoria eclesiástica posterior nem uma explicação ausente do grego.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e a repetição de “sangue” preservam o paralelismo judicial do original. O pronome “tu” mantém a referência direta a Deus já estabelecida no contexto.
