- from: O primeiro foi e derramou a sua taça sobre a terra; então surgiu uma ferida maligna e dolorosa nas pessoas que tinham a marca da besta e adoravam a imagem dela.
  to: O primeiro foi e derramou a sua taça sobre a terra; então sobreveio uma ferida nociva e grave às pessoas que tinham a marca da besta e adoravam a imagem dela.
  rationale: A revisão substitui dois adjetivos que restringiam ou especificavam indevidamente o sentido da dupla κακὸν καὶ πονηρόν. «Nociva e grave» preserva a intensificação e a amplitude sem sugerir câncer ou limitar a lesão à dor. Também ajusta a expressão da aflição que recai sobre as pessoas para uma construção portuguesa mais natural, sem alterar o sentido.
