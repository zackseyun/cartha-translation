id: REV.16.2
reference: Revelation 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: pt
  text: O primeiro foi e derramou a sua taça sobre a terra; então sobreveio uma ferida nociva e grave às pessoas que tinham a marca da besta e adoravam a imagem dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo ocorre na sequência narrativa; «foi» expressa naturalmente o movimento sem acrescentar a ênfase de «partiu» ou «foi embora».
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: O adjetivo substantivado remete ao primeiro dos sete anjos mencionados no contexto. Mantém-se a formulação grega sem inserir «anjo» no versículo.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: Expressa com clareza a ação de verter o conteúdo da taça e corresponde à fórmula recorrente dos juízos das taças em Apocalipse.
- source_word: φιάλην
  choice: taça
  rationale: Designa um recipiente largo e raso; «taça» é corrente, digna e tradicionalmente inteligível em português, ao contrário de «frasco», que sugeriria outro formato.
- source_word: εἰς τὴν γῆν
  choice: sobre a terra
  rationale: A preposição indica a terra como alvo do derramamento. «Sobre a terra» é idiomático e preserva a provável dimensão ampla de γῆ sem restringi-la a uma região.
- source_word: ἐγένετο
  choice: surgiu
  rationale: 'Introduz o resultado da ação: a ferida passou a existir ou se manifestou. «Surgiu» produz uma sequência natural em português.'
- source_word: ἕλκος
  choice: ferida
  rationale: O termo denota uma lesão ulcerosa. «Ferida» é amplamente compreensível e evita tanto o tecnicismo de «úlcera» quanto a especificidade excessiva de «furúnculo».
- source_word: κακὸν
  choice: maligna
  rationale: No contexto de uma lesão, «maligna» comunica seu caráter nocivo e grave sem soar tão genérico quanto «má».
- source_word: πονηρὸν
  choice: dolorosa
  rationale: O adjetivo pode indicar algo penoso, aflitivo ou nocivo. «Dolorosa» distingue sua contribuição da de κακόν e descreve naturalmente uma ferida severa.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: nas pessoas
  rationale: ἄνθρωποι refere-se a seres humanos, sem especificação de sexo. «Nas pessoas» é natural com «surgiu uma ferida» e preserva o alvo da praga.
- source_word: τοὺς ἔχοντας
  choice: que tinham
  rationale: A oração relativa traduz naturalmente o particípio presente e indica que essas pessoas possuíam a marca quando o juízo as atingiu.
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: a marca da besta
  rationale: É a correspondência transparente e estabelecida para uma expressão central de Apocalipse.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: adoravam a imagem dela
  rationale: προσκυνέω neste contexto denota culto prestado à imagem. «Dela» retoma claramente «a besta» e evita a ambiguidade de gênero que «sua» poderia criar em português.
theological_decisions:
- issue: Os dois adjetivos κακὸν καὶ πονηρὸν que qualificam ἕλκος
  choice: «uma ferida maligna e dolorosa»
  alternative: «uma ferida má e terrível»; «uma úlcera nociva e penosa»
  rationale: O grego acumula dois adjetivos negativos para intensificar a gravidade da praga. A tradução conserva ambos e diferencia suas nuances, sem atribuir necessariamente maldade moral à lesão.
- issue: Identidade das pessoas atingidas
  choice: «as pessoas que tinham a marca da besta e adoravam a imagem dela»
  alternative: «os homens que tinham...»; «os que tinham... e adoravam...»
  rationale: O texto delimita expressamente a praga aos que se identificam com a besta por sua marca e pelo culto à sua imagem. «Pessoas» representa o sentido inclusivo de ἄνθρωποι sem ampliar nem restringir o grupo.
- issue: Sujeito implícito em «o primeiro»
  choice: Manter «o primeiro» sem acrescentar «anjo»
  alternative: «o primeiro anjo»
  rationale: O contexto identifica o referente, mas o grego emprega apenas o adjetivo substantivado. A tradução evita explicitar no texto o que está apenas contextualmente subentendido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção mantém a progressão narrativa do grego e evita vocabulário excessivamente clínico. Não há marcadores de nota porque nenhuma nota foi julgada necessária; a ambiguidade lexical dos adjetivos foi preservada no corpo por dois qualificativos distintos.
