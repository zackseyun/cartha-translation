revisions:
- from: “Eis que venho como ladrão. Feliz aquele que permanece acordado[a] e guarda as suas vestes, para que não ande nu e vejam a sua vergonha[b]—”
  to: “Eis que venho como ladrão. Bem-aventurado é aquele que permanece acordado[a] e guarda suas vestes, para que não ande nu e não vejam sua vergonha[b]—”
  rationale: A revisão corrige o alcance da negação na oração final e emprega «Bem-aventurado» para refletir de modo mais fiel μακάριος. Mantêm-se a comparação «como ladrão», a forma singular representativa, a imagem das vestes e da nudez, o sujeito indefinido de «vejam» e o travessão final do texto-fonte.
