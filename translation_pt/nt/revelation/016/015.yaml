id: REV.16.15
reference: Revelation 16:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: pt
  text: “Eis que venho como ladrão. Bem-aventurado é aquele que permanece acordado[a] e guarda suas vestes, para que não ande nu e não vejam sua vergonha[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se mantém vigilante” ou “vigia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua indecência”; o termo grego pode indicar exposição vergonhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém a força de uma chamada solene à atenção, adequada ao discurso apocalíptico, sem recorrer a uma formulação obscura.
- source_word: ἔρχομαι
  choice: venho
  rationale: O presente vívido pode ter força iminente ou futura; “venho” preserva essa vivacidade e deixa que o contexto comunique a iminência.
- source_word: ὡς κλέπτης
  choice: como ladrão
  rationale: Expressa naturalmente a comparação e aponta para o caráter inesperado da vinda, sem sugerir equivalência moral.
- source_word: μακάριος
  choice: Feliz
  rationale: É uma formulação clara e corrente de bem-aventurança em português moderno, sem reduzir o sentido a uma emoção passageira.
- source_word: ὁ γρηγορῶν
  choice: aquele que permanece acordado
  rationale: Conserva a imagem concreta da vigília e permite que seu sentido metafórico de vigilância permaneça perceptível.
- source_word: τηρῶν
  choice: guarda
  rationale: Abrange os sentidos de conservar, proteger e manter, sendo especialmente natural com “vestes”.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: as suas vestes
  rationale: “Vestes” preserva o registro elevado e a possível ressonância simbólica da imagem em Apocalipse.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Reproduz de modo natural a relação de finalidade negativa.
- source_word: γυμνὸς περιπατῇ
  choice: não ande nu
  rationale: Mantém a imagem concreta de caminhar exposto, em português claro e conciso.
- source_word: βλέπωσιν
  choice: vejam
  rationale: Preserva o sujeito indefinido da terceira pessoa do plural, sem especificar “pessoas” ou “outros”.
- source_word: ἀσχημοσύνην αὐτοῦ
  choice: a sua vergonha
  rationale: Comunica tanto a exposição vergonhosa quanto a desonra resultante, sem limitar o termo apenas à nudez física.
theological_decisions:
- issue: Força metafórica das vestes e da nudez no contexto apocalíptico
  choice: Manter as imagens concretas de vestes, nudez e vergonha sem explicação alegórica no texto principal.
  alternative: Interpretar explicitamente as vestes como prontidão moral ou atos justos, e a nudez como desonra escatológica.
  rationale: Embora as imagens provavelmente tenham ressonância simbólica em Apocalipse, o grego as apresenta concretamente; a tradução não deve resolver o simbolismo por interpretação.
- issue: Referência masculina singular de ὁ γρηγορῶν e dos pronomes
  choice: Usar “aquele” e “suas”, conservando a construção representativa no singular.
  alternative: Reformular no plural com “aqueles que” e “suas vestes”.
  rationale: O grego emprega uma construção participial masculina singular com valor representativo; o português permite preservá-la com naturalidade.
- issue: Alcance da negação em ἵνα μὴ ... καὶ βλέπωσιν
  choice: 'Preservar a coordenação compacta: “para que não ande nu e vejam”.'
  alternative: 'Explicitar uma segunda negação: “para que não ande nu nem vejam”.'
  rationale: A negação grega introduz a sequência coordenada, mas sua forma sintática compacta admite certa tensão na leitura. A redação escolhida acompanha essa estrutura sem acrescentar uma segunda negação ausente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” e “vestes” sustentam o tom elevado do Apocalipse sem tornar a frase arcaica. O travessão final foi mantido por constar no texto-fonte fornecido.
