    rationale: 'Em português, «para que não ande nu e vejam a sua vergonha» tende a ser lido como finalidade mista: evitar a nudez, mas permitir que vejam a vergonha. A construção grega μή ... καὶ ... expressa que se evitem ambas as situações; «e não vejam» torna isso inequívoco.'
  - severity: low
    issue: «Feliz» é menos preciso para μακάριος em uma fórmula de bem-aventurança.
    rationale: Embora possível em português corrente, «Feliz» pode reduzir a declaração de favor/bem-aventurança a felicidade subjetiva. «Bem-aventurado» conserva melhor a função e o registro do termo.
