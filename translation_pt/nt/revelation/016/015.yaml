  verdict: revise
  source_fidelity: 'A revisão é necessária porque, na redação atual, «para que não ande nu e vejam a sua vergonha» pode comunicar que outras pessoas de fato vejam a vergonha. Em grego, μή introduz a finalidade negativa e alcança os dois verbos coordenados: que ele não ande nu e que não vejam sua exposição vergonhosa. A revisão explicita a segunda negação sem alterar o sentido. «Bem-aventurado» representa melhor μακάριος no registro de uma bem-aventurança do que «Feliz», que pode sugerir primariamente um estado emocional.'
  naturalness: «Eis que venho como ladrão» é natural e preserva o tom solene. «Permanece acordado», «guarda suas vestes» e «não ande nu e não vejam sua vergonha» são claros em português moderno de ampla compreensão, com boa legibilidade brasileira.
  terminology: «Bem-aventurado» é o termo consagrado e adequado para μακάριος neste gênero discursivo. «Vestes», «nu» e «vergonha» preservam as imagens concretas e a ressonância apocalíptica sem lhes impor explicação doutrinária. O plural indefinido em «não vejam» mantém a indefinição de βλέπωσιν.
