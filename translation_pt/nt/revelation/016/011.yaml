id: REV.16.11
reference: Revelation 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: pt
  text: E blasfemaram contra o Deus do céu por causa de suas dores e de suas feridas[a], e não se arrependeram de suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chagas» ou «úlceras».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: blasfemaram contra
  rationale: Preserva a força religiosa específica de falar de modo irreverente e ofensivo contra Deus; a preposição «contra» torna o alvo natural em português.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: o Deus do céu
  rationale: Reproduz diretamente o título bíblico e mantém seu tom solene e apocalíptico.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: por causa de suas dores
  rationale: Neste contexto, ἐκ tem valor causal, e πόνοι se refere a dores ou sofrimentos intensos.
- source_word: ἑλκῶν
  choice: feridas
  rationale: ἕλκος pode indicar ferida, chaga ou úlcera; «feridas» é claro e corrente, sem impor precisão médica indevida.
- source_word: μετενόησαν
  choice: se arrependeram
  rationale: Em Apocalipse, μετανοέω expressa arrependimento moral e religioso, não apenas mudança de opinião.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: de suas obras
  rationale: A construção indica aquilo de que deveriam afastar-se mediante o arrependimento; «arrepender-se de» é idiomático, enquanto «obras» conserva a amplitude de ἔργα.
theological_decisions:
- issue: Valor das três construções com ἐκ
  choice: As pessoas blasfemam por causa das dores e feridas e não se arrependem de suas obras.
  alternative: Traduzir mais literalmente como «a partir de suas dores e feridas» e «não se afastaram de suas obras».
  rationale: Nas duas primeiras ocorrências, o contexto favorece valor causal; com μετανοέω, a última indica afastamento das ações anteriores. A tradução conserva o contraste entre sofrimento, blasfêmia e ausência de arrependimento sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Blasfemaram contra» e «Deus do céu» preservam o tom bíblico; «feridas» evita linguagem excessivamente técnica. Todos os marcadores de notas aparecem no texto principal.
