- from: 'Por estas três pragas foi morta a terça parte da humanidade: pelo fogo, pela fumaça e pelo enxofre[a] que saíam da boca deles.'
  to: 'Por estas três pragas foi morta a terça parte da humanidade: pelo fogo, pela fumaça e pelo enxofre que saía das bocas deles.'
  rationale: A revisão restringe corretamente a oração relativa ao «enxofre», preserva o plural «bocas» do grego e remove uma nota lexicalmente inexata. Não altera o sentido nem identifica além do texto os seres a que «deles» se refere.
  reviewer_model: gpt-5.6-terra
