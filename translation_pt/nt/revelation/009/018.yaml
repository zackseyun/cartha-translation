source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: pt
  text: 'Por estas três pragas foi morta a terça parte da humanidade: pelo fogo, pela fumaça e pelo enxofre que saía das bocas deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Por estas três pragas
  rationale: Neste contexto, ἀπό indica causa ou meio. “Por” expressa naturalmente que as três pragas causaram as mortes, enquanto “estas” preserva o demonstrativo τούτων.
- source_word: ἀπεκτάνθησαν
  choice: foi morta
  rationale: Preserva a voz passiva do aoristo. O singular concorda naturalmente em português com o núcleo coletivo “a terça parte”.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: a terça parte da humanidade
  rationale: A expressão é partitiva e indica um terço. ἄνθρωποι designa aqui os seres humanos em geral, não especificamente os homens do sexo masculino; “humanidade” é claro, abrangente e adequado ao registro solene.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: pelo fogo, pela fumaça e pelo enxofre
  rationale: ἐκ assinala aqui a fonte ou agência das mortes. A repetição de “pelo/pela” mantém a distinção enfática dos três elementos com fluência em português. “Enxofre” é o termo moderno para θεῖον.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: que saíam da boca deles
  rationale: “Saíam” comunica de modo vívido e natural o particípio presente ἐκπορευομένου. Embora στόματα seja plural no grego, o singular distributivo “da boca deles” é idiomático e indica a boca de cada criatura, sem sugerir que cada uma tivesse várias bocas.
theological_decisions:
- issue: Alcance de ἀνθρώπων no juízo apocalíptico
  choice: humanidade
  alternative: seres humanos; pessoas
  rationale: O substantivo inclui os seres humanos em geral. “Humanidade” preserva o sentido coletivo e solene sem restringi-lo ao sexo masculino nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a voz passiva, a tríade enfática das pragas e a imagem concreta de sua procedência. O sinal de dois-pontos explicita a relação explicativa já presente na repetição grega, sem resolver além do texto a identidade ou a natureza dos agentes.
