id: REV.9.10
reference: Revelation 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: pt
  text: Elas têm caudas como as dos escorpiões e ferrões; e é nas suas caudas que está o poder que têm de ferir as pessoas durante cinco meses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: caudas
  rationale: Termo anatômico direto; mantém o plural e a imagem da visão.
- source_word: ὁμοίας σκορπίοις
  choice: semelhantes às dos escorpiões
  rationale: O adjetivo ὅμοιος com dativo expressa semelhança. Em português, a elipse «às dos escorpiões» deixa claro que são as caudas que estão sendo comparadas, sem alterar a imagem.
- source_word: κέντρα
  choice: ferrões
  rationale: No contexto da imagem de escorpiões, designa concretamente as pontas usadas para ferroar; «ferrões» é natural e preciso.
- source_word: ἐξουσία
  choice: poder
  rationale: Aqui indica capacidade efetiva de causar dano, embora o termo também possa significar autoridade.
- source_word: ἀδικῆσαι
  choice: ferir
  rationale: No contexto da praga apocalíptica, o verbo se refere a causar dano físico ou sofrimento; «ferir» preserva esse sentido concreto.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: ἄνθρωποι tem referência genérica à humanidade neste contexto; «as pessoas» é a forma natural e inclusiva em português contemporâneo.
- source_word: μῆνας πέντε
  choice: durante cinco meses
  rationale: O acusativo marca duração; «durante» explicita naturalmente a extensão temporal em português.
theological_decisions:
- issue: Sentido de ἐξουσία na imagem da praga apocalíptica
  choice: poder
  alternative: autoridade
  rationale: O foco imediato é a capacidade operante de causar dano por meio das caudas. «Poder» comunica isso sem negar que, no conjunto da visão, tal ação seja permitida ou limitada.
- issue: Referência de τοὺς ἀνθρώπους
  choice: as pessoas
  alternative: os seres humanos
  rationale: O substantivo grego masculino plural é genérico neste contexto, não restrito a homens do sexo masculino. «As pessoas» transmite a referência com naturalidade e sem impor uma distinção ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A comparação foi formulada como «caudas semelhantes às dos escorpiões» para evitar a possível leitura de que os seres inteiros se assemelham a escorpiões. A construção enfática grega «nas suas caudas está o poder» foi preservada por meio de «é nas suas caudas que está o poder».
