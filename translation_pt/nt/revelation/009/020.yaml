id: REV.9.20
reference: Revelation 9:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: pt
  text: E o restante da humanidade[a], que não foi morto por essas pragas, nem sequer se arrependeu das obras de suas mãos[b], para que não adorasse[c] os demônios e os ídolos de ouro, de prata, de bronze, de pedra e de madeira, que não podem ver, nem ouvir, nem andar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as demais pessoas”. O termo grego refere-se genericamente aos seres humanos.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não se arrependeu para fora das obras de suas mãos”; no contexto, a expressão se refere especialmente ao que essas pessoas haviam fabricado e adoravam.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de modo que não adorasse”. A construção grega pode indicar propósito ou resultado pretendido.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: o restante da humanidade
  rationale: Expressa o grupo humano remanescente de modo coletivo e inclusivo; ἀνθρώπων designa seres humanos em geral, não especificamente homens.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: não foi morto por essas pragas
  rationale: Mantém a voz passiva de ἀποκτείνω e entende ἐν, no contexto, como o meio ou âmbito em que as mortes ocorreram.
- source_word: οὐδὲ μετενόησαν
  choice: nem sequer se arrependeu
  rationale: “Nem sequer” comunica a força cumulativa e enfática de οὐδέ após a afirmação de que esse grupo sobreviveu às pragas.
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: das obras de suas mãos
  rationale: Em português, “arrepender-se de” é idiomático, enquanto a expressão concreta “obras de suas mãos” preserva a imagem bíblica e sua ligação contextual com os ídolos fabricados.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: para que deixasse de adorar
  rationale: 'Apresenta de maneira natural o propósito ou resultado pretendido do arrependimento: cessar a adoração idólatra. A nota registra uma forma mais literal e a possível nuance de resultado.'
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: É o termo português corrente para os seres espirituais hostis designados por δαιμόνια no Novo Testamento.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: os ídolos de ouro, de prata, de bronze, de pedra e de madeira
  rationale: “Ídolos” preserva o sentido cultual de εἴδωλα, e a sequência dos materiais conserva a acumulação retórica do grego em português natural.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: que não podem ver, nem ouvir, nem andar
  rationale: Mantém a tríade que ressalta a impotência dos ídolos e traduz περιπατεῖν literalmente como “andar”.
theological_decisions:
- issue: Sentido coletivo e genérico de ἀνθρώπων
  choice: o restante da humanidade
  alternative: as demais pessoas
  rationale: A formulação escolhida mantém o alcance coletivo e não restringe o referente ao sexo masculino.
- issue: Relação entre arrependimento e abandono da idolatria em ἵνα μὴ προσκυνήσουσιν
  choice: para que deixasse de adorar
  alternative: de modo que não adorasse
  rationale: A tradução apresenta o abandono da adoração a demônios e ídolos como propósito ou resultado pretendido do arrependimento, sem definir além do texto uma teoria teológica específica sobre o arrependimento.
- issue: Força de οὐδέ
  choice: nem sequer se arrependeu
  alternative: também não se arrependeu
  rationale: “Nem sequer” preserva a ênfase de que, apesar de ter sobrevivido às pragas, o restante da humanidade não se arrependeu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular coletivo de “o restante da humanidade” é mantido de modo coerente ao longo da frase; a enumeração conserva o ritmo solene e cumulativo do original.
