  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: pt
  text: Tinham cabelos como os de mulheres, e seus dentes eram como dentes de leões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: Tinham
  rationale: O imperfeito de ἔχω integra a descrição contínua da visão; em português, o pretérito imperfeito preserva naturalmente esse valor descritivo.
- source_word: τρίχας
  choice: cabelos
  rationale: Embora o grego use o plural, “cabelos” é a forma idiomática em português para os fios da cabeça neste tipo de descrição.
- source_word: ὡς τρίχας γυναικῶν
  choice: como cabelos de mulheres
  rationale: ὡς introduz uma comparação. A formulação conserva explicitamente tanto o elemento comparado quanto o plural γυναικῶν, sem interpretar a imagem.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: seus dentes
  rationale: A construção possessiva portuguesa traduz naturalmente o artigo, o substantivo e o pronome possessivo gregos.
- source_word: ὡς λεόντων
  choice: como dentes de leões
  rationale: O substantivo “dentes” é retomado para explicitar a elipse grega e evitar que os próprios dentes pareçam ser comparados a leões inteiros.
- source_word: ἦσαν
  choice: eram
  rationale: O pretérito imperfeito corresponde ao valor descritivo do imperfeito de εἰμί no relato visionário.
theological_decisions:
- issue: Natureza da imagem na descrição apocalíptica
  choice: Manter diretamente as comparações com cabelos de mulheres e dentes de leões.
  alternative: Acrescentar linguagem interpretativa que explique o possível simbolismo.
  rationale: O grego apresenta as comparações sem explicar seu significado. A tradução preserva a imagem e sua tensão interpretativa, sem impor uma leitura simbólica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “cabelos” e “dentes” preserva a estrutura enfática das duas comparações e evita ambiguidades.
