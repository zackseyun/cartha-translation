source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: pt
  text: 'E foi assim que vi, na visão, os cavalos e os que estavam sentados sobre eles: tinham couraças cor de fogo, de jacinto e de enxofre[a]. As cabeças dos cavalos eram como cabeças de leões, e das bocas deles saem fogo, fumaça e enxofre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “couraças ígneas, de cor jacintina e sulfurosas”. O “jacinto” antigo era associado a uma tonalidade azulada ou azul-violeta; os termos gregos, porém, não especificam aqui os nomes modernos exatos das cores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: foi assim que
  rationale: Expressa de modo natural a maneira como João viu a cena, preservando a força demonstrativa do advérbio.
- source_word: ἐν τῇ ὁράσει
  choice: na visão
  rationale: No contexto apocalíptico, ὅρασις designa uma experiência visionária, não apenas uma aparência visual.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: os que estavam sentados sobre eles
  rationale: Mantém explícita a construção participial grega e a relação espacial com os cavalos, sem reduzi-la simplesmente a 'cavaleiros'.
- source_word: θώρακας
  choice: couraças
  rationale: É o equivalente corrente e concreto para a peça de armadura que protege o tronco.
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: cor de fogo, de jacinto e de enxofre
  rationale: A formulação comunica a aparência visual das três couraças sem fixar tonalidades exatas que o grego não explicita; 'jacinto' conserva a imagem antiga, esclarecida em nota.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: como cabeças de leões
  rationale: Reproduz diretamente a comparação introduzida por ὡς e mantém os plurais do texto grego.
- source_word: ἐκπορεύεται
  choice: saem
  rationale: 'O presente preserva a vivacidade da visão. Em português, o plural concorda naturalmente com o sujeito composto posposto: fogo, fumaça e enxofre.'
- source_word: θεῖον
  choice: enxofre
  rationale: É o termo moderno e preciso para a substância designada, sem recorrer ao tradicionalismo menos transparente 'brimstone' de outras línguas.
theological_decisions:
- issue: Sentido dos três adjetivos que descrevem as couraças
  choice: Entendê-los como descrições visuais — 'cor de fogo, de jacinto e de enxofre' — sem especificar vermelho, azul ou amarelo.
  alternative: Traduzir formalmente como 'ígneas, jacintinas e sulfurosas', ou explicitar as cores como vermelho-fogo, azul-jacinto e amarelo-enxofre.
  rationale: O contexto visionário favorece uma descrição da aparência, mas os adjetivos gregos preservam associações com fogo, jacinto e enxofre, sem nomear diretamente tonalidades modernas exatas. A tradução mantém essa abertura imagética.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa natural. Conservou-se o presente 'saem' após os verbos passados para refletir o presente vívido do grego. A repetição de 'cabeças' e os plurais foram mantidos por fidelidade à imagem visionária.
