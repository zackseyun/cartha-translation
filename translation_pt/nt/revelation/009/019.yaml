id: REV.9.19
reference: Revelation 9:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: pt
  text: Pois o poder dos cavalos está na boca e na cauda deles; porque as caudas deles são semelhantes a serpentes, têm cabeças e com elas causam dano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: poder
  rationale: No contexto da visão, indica a capacidade efetiva dos cavalos de causar dano, mais que autoridade ou jurisdição delegada.
- source_word: στόματι ... οὐραῖς
  choice: na boca e na cauda deles ... as caudas deles
  rationale: A primeira expressão conserva os singulares distributivos do grego; a retomada usa o plural explícito de οὐραί.
- source_word: ὅμοιαι ὄφεσιν
  choice: semelhantes a serpentes
  rationale: Preserva a comparação explícita e o tom solene da imagem apocalíptica, sem interpretá-la alegoricamente.
- source_word: ἔχουσαι κεφαλάς
  choice: têm cabeças
  rationale: Expressa de modo natural em português o particípio que descreve as caudas.
- source_word: ἀδικοῦσιν
  choice: causam dano
  rationale: Neste contexto, o verbo denota ferir ou prejudicar, não uma injustiça abstrata.
- source_word: ἐν αὐταῖς
  choice: com elas
  rationale: Transmite o provável valor instrumental da preposição e preserva a referência pronominal feminina plural sem explicitar além do grego se o foco recai nas caudas ou nas cabeças.
- source_word: γὰρ ... γὰρ
  choice: Pois ... porque
  rationale: As duas partículas introduzem explicações; a variação evita repetição pesada em português sem alterar a relação discursiva.
theological_decisions:
- issue: Imagem apocalíptica das caudas semelhantes a serpentes e dotadas de cabeças
  choice: Traduzir a descrição de forma direta, sem identificar seus elementos com realidades teológicas específicas
  alternative: Interpretar as caudas como falso ensino, agentes demoníacos ou outro símbolo determinado
  rationale: O versículo apresenta a imagem visionária, mas não fornece aqui sua interpretação; a tradução deve preservar essa abertura.
- issue: Referente de «com elas»
  choice: Manter o pronome feminino plural do grego
  alternative: Explicitar «com as caudas» ou «com as cabeças»
  rationale: Tanto «caudas» quanto «cabeças» são femininos plurais no contexto, e explicitar um único referente eliminaria uma ambiguidade genuína da formulação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «deles» mantém os referentes claros; «serpentes» preserva o tom visionário e literário.
