id: REV.9.12
reference: Revelation 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: pt
  text: O primeiro ai passou.[a] Eis que ainda vêm dois ais depois dessas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O ai, o único, passou”; a expressão grega tem literalmente o sentido de “o ai, o um”, mas, no contexto, refere-se ao primeiro de uma série.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ai
  rationale: Preserva a fórmula solene de lamento e juízo do Apocalipse, em vez de reduzi-la a um simples rótulo como “desastre”.
- source_word: ἡ μία
  choice: o primeiro
  rationale: Embora a expressão diga literalmente “o um”, o contexto da série de três ais lhe confere valor ordinal; “o primeiro” é natural e claro em português.
- source_word: ἀπῆλθεν
  choice: já passou
  rationale: Expressa de modo idiomático a conclusão do primeiro ai; “já” reforça a transição para os dois que ainda virão.
- source_word: ἰδού
  choice: Eis que
  rationale: Mantém a função enfática de chamar a atenção e combina com o registro profético e apocalíptico sem soar excessivamente arcaico.
- source_word: ἔτι δύο οὐαὶ ἔρχεται
  choice: ainda vêm outros dois ais
  rationale: “Ainda” traduz ἔτι, e “outros” torna natural em português a ideia de dois ais adicionais. O verbo no plural segue a concordância normal do português, embora o grego tenha verbo singular com sujeito plural.
- source_word: μετὰ ταῦτα
  choice: depois dessas coisas
  rationale: Conserva o plural do demonstrativo e a linguagem sequencial recorrente no Apocalipse.
theological_decisions:
- issue: Sequência apocalíptica dos três ais
  choice: O versículo assinala que o primeiro ai anunciado terminou e que outros dois ainda virão.
  alternative: Traduzir οὐαί apenas como “desastre” ou “juízo”, sem preservar a fórmula repetida.
  rationale: A repetição de “ai” mantém a estrutura literária e a progressão dos juízos na visão, sem acrescentar identificação doutrinária aos acontecimentos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leve elevação adequada ao gênero profético. “Eis que” preserva a ênfase de ἰδού, e “ai/ais” mantém a fórmula apocalíptica tradicional.
