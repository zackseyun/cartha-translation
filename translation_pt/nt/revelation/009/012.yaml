review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente οὐαί como “ai” e reconhece a sequência de três ais. Contudo, “já” não é explicitamente expresso pelo aoristo ἀπῆλθεν, e “outros” acrescenta uma nuance que, embora inferível do contexto, não está formulada no grego. A ordem de “depois dessas coisas” também pode refletir mais diretamente a posição final de μετὰ ταῦτα.
  naturalness: “O primeiro ai passou. Eis que ainda vêm dois ais depois dessas coisas.” é natural em português atual, mantém o registro profético e dá a ἰδού uma ênfase clara sem construções desnecessariamente marcadas.
  terminology: “Ai/ais” é a opção apropriada para conservar a fórmula solene e apocalíptica de οὐαί. “Eis que” é uma boa equivalência para ἰδού. A nota deve evitar apresentar “o um” como se fosse uma formulação portuguesa natural; a alternativa “o único” comunica melhor o valor literalmente não ordinal da expressão.
  issues:
  - severity: low
    issue: “já” em “já passou”
    rationale: O aoristo ἀπῆλθεν afirma que o primeiro ai passou, mas não exige o advérbio “já”. A retirada evita acrescentar ênfase temporal não lexicalizada.
  - severity: low
    issue: “outros dois ais”
    rationale: O grego diz “ainda vêm dois ais”; serem adicionais é claro pelo contexto, mas “outros” não está no texto e pode ser omitido sem perda.
  - severity: low
    issue: Formulação da nota sobre ἡ μία
    rationale: A explicação “o grego diz literalmente ‘o um’” é pouco precisa em português, pois μία é feminino e concorda com οὐαί. Uma nota com “o único” como alternativa portuguesa e explicação da expressão grega é mais clara.
  revised_text: O primeiro ai passou.[a] Eis que ainda vêm dois ais depois dessas coisas.
  revised_footnotes:
  - marker: a
    text: Ou “O ai, o único, passou”; a expressão grega tem literalmente o sentido de “o ai, o um”, mas, no contexto, refere-se ao primeiro de uma série.
    reason: lexical_alternative
  revision_rationale: A revisão elimina acréscimos dispensáveis (“já” e “outros”), conserva a sequência e a ênfase do grego e torna a nota lexical mais precisa e legível em português.
