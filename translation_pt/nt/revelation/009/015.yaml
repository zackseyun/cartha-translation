id: REV.9.15
reference: Revelation 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: pt
  text: E foram soltos os quatro anjos que estavam preparados para a hora, o dia, o mês e o ano[a], a fim de matar um terço da humanidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para esta hora, dia, mês e ano”. O grego pode enfatizar um momento precisamente determinado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um terço dos seres humanos”. O termo grego se refere às pessoas em geral, não apenas aos homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: foram soltos
  rationale: O aoristo passivo de λύω retoma naturalmente os anjos antes mantidos presos e preserva a voz passiva em português atual.
- source_word: ἄγγελοι
  choice: anjos
  rationale: No contexto apocalíptico de Apocalipse, trata-se claramente de seres sobrenaturais, não de mensageiros humanos.
- source_word: ἡτοιμασμένοι
  choice: estavam preparados
  rationale: O particípio perfeito passivo descreve um estado de prontidão resultante de preparação anterior; esta formulação é natural e mantém esse valor resultativo.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: para a hora, o dia, o mês e o ano
  rationale: Mantém a sequência cumulativa dos marcadores temporais e não decide indevidamente entre um instante precisamente designado e uma leitura de duração.
- source_word: ἵνα
  choice: a fim de
  rationale: Expressa com clareza a força de propósito da conjunção no contexto.
- source_word: ἀποκτείνωσιν
  choice: matar
  rationale: Equivalente contemporâneo e direto para a ação pretendida expressa pelo subjuntivo aoristo sob ἵνα.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: um terço da humanidade
  rationale: A construção é partitiva, e ἀνθρώπων designa os seres humanos em geral, não especificamente pessoas do sexo masculino.
theological_decisions:
- issue: Referência e força da expressão temporal “a hora, o dia, o mês e o ano”
  choice: Preservar a sequência como referência a um tempo especificamente determinado.
  alternative: Entender a expressão como um período total de um ano, um mês, um dia e uma hora.
  rationale: O grego reúne os marcadores temporais sob um só artigo e sugere precisão, mas a tradução evita transformar essa sugestão em um esquema cronológico explícito.
- issue: Alcance de ἀνθρώπων
  choice: humanidade
  alternative: seres humanos; pessoas
  rationale: O substantivo tem referência humana genérica. “Humanidade” comunica o sentido coletivo sem restringi-lo aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada de modo natural, sem perder a progressão temporal nem a finalidade explícita do texto.
