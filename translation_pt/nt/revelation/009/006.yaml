id: REV.9.6
reference: Revelation 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: pt
  text: E, naqueles dias, as pessoas[a] buscarão a morte e de modo nenhum a encontrarão; desejarão morrer, mas a morte foge delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seres humanos”; o grego ἄνθρωποι refere-se aqui às pessoas em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Expressão temporal direta e natural, preservando a referência dêitica de ἐκείναις.
- source_word: ζητήσουσιν
  choice: buscarão
  rationale: Mantém a ideia de procura intencional e a gravidade do contexto apocalíptico.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: Neste contexto, ἄνθρωποι tem referência genérica à humanidade; “as pessoas” comunica isso com clareza no português contemporâneo sem restringir o sentido aos homens.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: de modo nenhum a encontrarão
  rationale: A construção οὐ μή com o futuro constitui negação enfática. O pronome “a” retoma corretamente “a morte” em português.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: desejarão morrer
  rationale: Reproduz de modo natural o desejo intenso expresso por ἐπιθυμέω seguido do infinitivo.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: a morte foge delas
  rationale: Preserva tanto a personificação da morte quanto o presente vívido de φεύγει, em contraste com os futuros anteriores.
theological_decisions:
- issue: Personificação da morte no juízo apocalíptico
  choice: a morte foge delas
  alternative: elas não conseguirão morrer
  rationale: O grego apresenta explicitamente a morte como sujeito de φεύγει. A tradução mantém a imagem apocalíptica sem reduzir sua tensão a uma explicação.
- issue: Sentido genérico de οἱ ἄνθρωποι
  choice: as pessoas
  alternative: os homens
  rationale: Embora o substantivo grego esteja no masculino plural, ele designa aqui seres humanos em geral. “As pessoas” é preciso e abrangente no português atual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o encadeamento solene, a negação enfática e o presente vívido da personificação final.
