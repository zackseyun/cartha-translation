id: REV.9.3
reference: Revelation 9:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: pt
  text: Da fumaça saíram gafanhotos para a terra, e lhes foi dada autoridade[a], assim como os escorpiões da terra têm autoridade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poder”. A palavra grega pode indicar autoridade, direito ou poder; “autoridade” ressalta aqui que essa capacidade lhes foi concedida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: Da fumaça
  rationale: A preposição ἐκ indica procedência a partir do interior; “da fumaça” expressa de modo natural a origem do movimento em português.
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Mantém explicitamente o movimento de saída indicado por ἐξέρχομαι e combina de modo vívido com “da fumaça”.
- source_word: ἀκρίδες
  choice: gafanhotos
  rationale: É o equivalente comum e preciso para ἀκρίδες no contexto bíblico e apocalíptico.
- source_word: εἰς τὴν γῆν
  choice: para a terra
  rationale: Preserva a direção expressa por εἰς, enquanto γῆ é entendido aqui em seu sentido amplo de “terra”.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: lhes foi dada autoridade
  rationale: Conserva a construção passiva e não identifica explicitamente quem concede. “Autoridade” ressalta a capacidade ou permissão concedida, sem excluir a nuance de poder.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: assim como ... têm autoridade
  rationale: Reproduz diretamente a comparação introduzida por ὡς e mantém a repetição de ἐξουσία presente no grego.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: os escorpiões da terra
  rationale: Mantém de forma direta o genitivo e o contraste imagético com os gafanhotos que saem da fumaça.
theological_decisions:
- issue: Natureza da capacidade concedida aos gafanhotos
  choice: Traduzir ἐξουσία por “autoridade” e conservar a passiva “lhes foi dada”, sem explicitar o agente.
  alternative: Traduzir por “poder” ou identificar explicitamente Deus como aquele que o concede.
  rationale: A formulação preserva a ideia de capacidade ou permissão delegada e mantém a reserva do texto grego quanto à identidade do agente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase conserva o movimento da fumaça para a terra e a repetição deliberada de “autoridade”, sem tornar explícito o agente da passiva.
