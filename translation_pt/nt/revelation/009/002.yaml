  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: pt
  text: E ele abriu o poço do abismo[a], e do poço subiu fumaça como a fumaça de uma grande fornalha; e o sol e o ar foram escurecidos pela fumaça do poço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a abertura do abismo”; tradicionalmente: “o poço sem fundo”.'
    reason: Registra alternativas de tradução para φρέαρ τῆς ἀβύσσου e distingue a formulação lexical da expressão tradicional.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: abriu
  rationale: Equivalente direto e natural do aoristo de ἀνοίγω, sem especificar indevidamente o modo de abertura.
- source_word: φρέαρ
  choice: poço
  rationale: φρέαρ pode designar poço ou abertura profunda. Em português, “poço” preserva a imagem de uma abertura vertical que dá acesso ao abismo, sem identificá-la com o próprio abismo.
- source_word: ἀβύσσου
  choice: do abismo
  rationale: “Abismo” reflete diretamente ἄβυσσος e evita a expressão tradicional, porém mais interpretativa, “poço sem fundo”.
- source_word: ἀνέβη
  choice: subiu
  rationale: Expressa de modo conciso e natural o movimento ascendente indicado por ἀναβαίνω.
- source_word: καπνὸς
  choice: fumaça
  rationale: Equivalente lexical corrente, mantido nas três ocorrências para preservar a repetição do texto grego.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: como a fumaça de uma grande fornalha
  rationale: Mantém a comparação introduzida por ὡς, a imagem de κάμινος e a força de μεγάλης.
- source_word: ἐσκοτώθη
  choice: escureceram
  rationale: O singular grego concorda com o primeiro elemento de um sujeito composto; o plural é natural em português. A forma verbal comunica o resultado de ficarem escuros, embora torne menos explícita a morfologia passiva.
- source_word: ὁ ἥλιος
  choice: o sol
  rationale: Equivalente direto.
- source_word: ὁ ἀὴρ
  choice: o ar
  rationale: Traduz diretamente a atmosfera indicada por ἀήρ; “céu” alteraria a imagem.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: por causa da fumaça do poço
  rationale: Comunica naturalmente o valor causal de ἐκ e conserva a relação da fumaça com o poço.
theological_decisions:
- issue: Terminologia do cenário apocalíptico sem introduzir linguagem interpretativa tradicional
  choice: “o poço do abismo”
  alternative: “o poço sem fundo” ou “a abertura do abismo”
  rationale: A formulação preserva a distinção entre φρέαρ, a abertura ou poço de acesso, e ἄβυσσος, o abismo, sem acrescentar explicitamente a ideia de ausência de fundo. “Abertura” seria possível, mas perderia parte da imagem concreta de φρέαρ.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “poço” e “fumaça” foi preservada por refletir a coesão enfática do grego. O ponto e vírgula organiza o período longo sem enfraquecer sua sequência narrativa.
