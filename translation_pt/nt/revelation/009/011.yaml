  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: pt
  text: Têm como rei sobre si o anjo do abismo.[a] Seu nome, em hebraico, é Abadom,[b] e, em grego, ele tem o nome Apoliom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poço sem fundo”.
    reason: alternative_reading
  - marker: b
    text: Abadom é um nome hebraico associado à destruição.
    reason: lexical_alternative
  - marker: c
    text: Apoliom é um nome grego que significa “Destruidor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Eles têm sobre si, como rei
  rationale: Preserva a construção grega com ἔχω e ἐπί, bem como a imagem concreta de βασιλεύς, em português natural e claro.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: o anjo do abismo
  rationale: “Anjo” é o sentido contextual de ἄγγελος, e “abismo” traduz ἄβυσσος de modo direto, sem acrescentar a ideia interpretativa de ausência de fundo.
- source_word: Ἑβραϊστὶ Ἀβαδδών
  choice: em hebraico é Abadom
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada, enquanto sua associação semântica com destruição é registrada em nota.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων
  choice: e, em grego, ele tem o nome Apoliom
  rationale: Mantém a repetição e a construção do grego, usando a transliteração portuguesa do nome próprio; seu significado é indicado em nota.
theological_decisions:
- issue: Traduzir ou transliterar Ἀβαδδών e Ἀπολλύων
  choice: Transliterar como “Abadom” e “Apoliom” no texto principal.
  alternative: Traduzir como “Destruição” e “Destruidor”.
  rationale: As formas funcionam como nomes próprios no versículo. A transliteração preserva essa função, e as notas comunicam o conteúdo semântico relevante.
- issue: Sentido de ἀβύσσου
  choice: abismo
  alternative: poço sem fundo
  rationale: “Abismo” é a correspondência lexical mais direta e preserva a imagem sem impor a interpretação tradicional de que o lugar seja literalmente sem fundo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a construção “têm sobre si” nem a repetição estilística relativa ao nome.
