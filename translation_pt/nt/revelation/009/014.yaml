id: REV.9.14
reference: Revelation 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: pt
  text: 'dizendo ao sexto anjo, aquele que tinha a trombeta: “Solte os quatro anjos que estão presos[a] junto ao grande rio Eufrates.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que foram presos” ou “que haviam sido presos”; o particípio perfeito grego destaca o estado de restrição resultante de terem sido presos anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: dizendo
  rationale: O particípio presente retoma a voz procedente do altar no versículo anterior e conserva a continuidade da ação verbal.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: ao sexto anjo
  rationale: Expressa diretamente o objeto indireto no dativo, em ordem natural no português.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: aquele que tinha a trombeta
  rationale: A expressão participial com artigo identifica, em aposição, o anjo a quem a ordem é dirigida; “tinha” comunica posse de modo natural no contexto narrativo.
- source_word: Λῦσον
  choice: Solte
  rationale: O imperativo aoristo de λύω ordena a remoção da restrição; “solte” é claro, atual e natural em português.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: os quatro anjos
  rationale: Tradução direta do objeto com numeral, sem acrescentar uma identificação moral ou teológica.
- source_word: τοὺς δεδεμένους
  choice: que estão presos
  rationale: O particípio perfeito passivo salienta o estado presente resultante de uma ação anterior; a formulação portuguesa preserva esse estado de restrição.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: junto ao ... rio
  rationale: Com o dativo, ἐπί tem sentido locativo. “Junto ao” exprime proximidade ou localização relativa ao rio sem sugerir que estejam sobre suas águas.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: ao grande rio Eufrates
  rationale: Preserva o epíteto e o nome próprio em uma construção portuguesa natural e reconhecível.
theological_decisions:
- issue: Identidade e condição moral dos quatro anjos
  choice: “os quatro anjos”, sem qualificá-los moralmente
  alternative: “os quatro anjos caídos” ou “os quatro anjos designados para o juízo”
  rationale: O versículo os identifica apenas como anjos presos junto ao Eufrates. Acrescentar “caídos” ou outra qualificação resolveria uma questão que o texto mantém em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a ligação participial com o versículo anterior e a aposição que identifica o sexto anjo.
