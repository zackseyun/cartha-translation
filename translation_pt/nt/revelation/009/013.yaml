id: REV.9.13
reference: Revelation 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: pt
  text: E o sexto anjo tocou a trombeta; e ouvi uma só voz[a] que vinha dos chifres do altar de ouro que está diante de Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma única voz”. O grego enfatiza que era uma só voz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: O verbo significa tocar ou fazer soar uma trombeta. Em português, a explicitação do objeto implícito é natural e adequada à sequência das trombetas.
- source_word: φωνὴν μίαν
  choice: uma só voz
  rationale: Preserva a ênfase de μίαν na singularidade da voz, sem identificar quem fala.
- source_word: ἐκ τῶν κεράτων
  choice: vindo dos chifres
  rationale: ἐκ indica origem, e κεράτων designa as projeções em forma de chifre nos cantos do altar. O particípio 'vindo' torna clara a relação da voz com sua origem.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: altar de ouro
  rationale: É uma expressão portuguesa natural para o altar caracterizado como sendo de ouro e preserva a imagem do santuário.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: que está diante de Deus
  rationale: Mantém a ideia espacial e relacional de ἐνώπιον sem acrescentar que o altar esteja de pé.
- source_word: ἄγγελος
  choice: anjo
  rationale: No contexto visionário de Apocalipse, refere-se claramente a um ser angelical.
theological_decisions:
- issue: Identidade da voz
  choice: uma só voz
  alternative: a voz de Deus; a voz de um anjo; uma voz associada ao altar
  rationale: O grego não identifica quem fala; a tradução mantém essa ambiguidade em vez de resolvê-la interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “e” preserva o encadeamento narrativo do grego. O marcador da nota foi colocado junto de “uma só voz”, expressão à qual a nota lexical efetivamente se refere.
source_grounding:
  english_pob_role: consult_only
