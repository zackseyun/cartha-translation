id: REV.9.7
reference: Revelation 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: pt
  text: Os gafanhotos tinham aparência de cavalos preparados para a batalha; sobre suas cabeças havia como que coroas semelhantes a ouro[a], e seus rostos eram como rostos de seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinaldas de vitória”; o grego στέφανοι pode designar coroas em forma de grinalda associadas a honra ou conquista.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “rostos de seres humanos”; a expressão grega é genérica, não especificamente masculina.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: Os gafanhotos tinham aparência
  rationale: ὁμοίωμα pode indicar forma, semelhança ou aparência. A construção portuguesa comunica com naturalidade a impressão visual da visão sem identificar literalmente os gafanhotos com cavalos.
- source_word: ἀκρίδων
  choice: gafanhotos
  rationale: É o equivalente comum de ἀκρίς e preserva a imagem básica do texto.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: de cavalos preparados para a batalha
  rationale: Preserva a comparação e o estado de prontidão expresso pelo particípio perfeito passivo ἡτοιμασμένοις. “Preparados para a batalha” é natural em português e mantém a imagem militar.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: sobre a cabeça deles
  rationale: Expressa de modo direto a relação espacial. O singular coletivo “a cabeça deles” é idiomático e não altera a referência distributiva.
- source_word: ὡς στέφανοι
  choice: como que coroas
  rationale: “Como que” preserva o caráter aparente e comparativo de ὡς na descrição visionária, sem afirmar que eram literalmente coroas.
- source_word: στέφανοι
  choice: coroas
  rationale: στέφανος designa coroa ou grinalda, muitas vezes ligada a honra ou vitória. “Coroas” é a opção geral mais clara; a nuance alternativa é registrada em nota.
- source_word: ὅμοιοι χρυσῷ
  choice: semelhantes a ouro
  rationale: O dativo com ὅμοιοι indica semelhança, não necessariamente composição. A formulação evita afirmar que as coroas eram feitas de ouro.
- source_word: τὰ πρόσωπα αὐτῶν
  choice: seus rostos
  rationale: πρόσωπον se refere aqui ao rosto visível; “rostos” é concreto, atual e natural.
- source_word: πρόσωπα ἀνθρώπων
  choice: rostos de seres humanos
  rationale: ἄνθρωπος é genérico neste contexto. “Seres humanos” evita restringir indevidamente a imagem a pessoas do sexo masculino.
theological_decisions:
- issue: Linguagem de comparação na visão apocalíptica
  choice: Manter os sucessivos sinais de aparência e semelhança
  alternative: Apresentar cavalos, coroas de ouro e rostos humanos como características literais
  rationale: O texto emprega repetidamente ὅμοια e ὡς. “Tinham aparência”, “como que”, “semelhantes” e “como” preservam a natureza fenomenológica da visão sem determinar a ontologia das figuras descritas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação por ponto e vírgula organiza a longa descrição sem enfraquecer sua continuidade. Os marcadores de nota foram colocados junto às expressões que explicam.
