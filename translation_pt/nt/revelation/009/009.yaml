  naturalness: «Couraças» e «som das suas asas» são naturais em registro bíblico moderno. «Carros puxados por muitos cavalos correndo» é compreensível, mas momentaneamente pode fazer «correndo» parecer ligado a «carros» ou ao conjunto inteiro. «Muitos cavalos que corriam» resolve a leitura sem tornar a frase pesada.
  terminology: «Couraças» corresponde bem a θώρακες. «Carros puxados por muitos cavalos» comunica corretamente ἁρμάτων ἵππων πολλῶν e evita que «carros» seja entendido como veículos modernos pelo contexto explícito dos cavalos e da batalha. Não é necessário interpretar a imagem visionária.
