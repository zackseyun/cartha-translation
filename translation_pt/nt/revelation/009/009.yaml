  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: pt
  text: Tinham couraças semelhantes a couraças de ferro, e o som das suas asas era como o som de carros puxados por muitos cavalos que corriam para a batalha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “como o som de carros de muitos cavalos correndo para a batalha”.'
    reason: A construção grega reúne vários genitivos e deixa compacta a relação entre os carros, os muitos cavalos e o ato de correr.
lexical_decisions:
- source_word: θώρακας
  choice: couraças
  rationale: O termo designa a armadura que protege o peito ou o torso; “couraças” é preciso, tradicional e compreensível em português.
- source_word: ὡς θώρακας σιδηροῦς
  choice: semelhantes a couraças de ferro
  rationale: Mantém explicitamente a comparação introduzida por ὡς e reproduz de modo natural a repetição de θώρακας.
- source_word: φωνὴ
  choice: som
  rationale: Neste contexto, φωνή designa o efeito audível das asas e dos carros, não uma voz articulada.
- source_word: πτερύγων
  choice: asas
  rationale: Equivalente direto de πτέρυγες; o genitivo forma naturalmente “o som das suas asas”.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: carros puxados por muitos cavalos
  rationale: Conserva expressamente tanto os carros quanto os muitos cavalos e torna inteligível em português a relação genitiva compacta do grego, sem transformar a imagem em máquinas modernas.
- source_word: τρεχόντων εἰς πόλεμον
  choice: correndo para a batalha
  rationale: “Correndo” preserva o sentido básico de τρέχω, enquanto “para a batalha” expressa naturalmente o movimento marcial indicado por εἰς πόλεμον.
theological_decisions:
- issue: Natureza da imagem na visão de João
  choice: Apresentar a descrição diretamente como uma série de comparações visionárias
  alternative: Identificar os seres como máquinas, demônios ou um exército histórico específico
  rationale: O texto emprega ὡς, “como/semelhante a”, e não determina aqui o referente final da imagem apocalíptica; a tradução preserva essa abertura interpretativa.
- issue: Relação sintática entre carros, cavalos e o particípio “correndo”
  choice: Associar naturalmente a corrida aos muitos cavalos que puxam os carros
  alternative: Entender o conjunto dos carros e cavalos como aquilo que avança velozmente
  rationale: A concordância genitiva plural de τρεχόντων permite ligação com ἵππων, mas a construção é compacta e pode evocar todo o conjunto em movimento; a nota preserva uma forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Couraças” mantém a precisão histórica; “carros” deve ser entendido no contexto antigo de carros de guerra. A repetição “couraças semelhantes a couraças” foi preservada por refletir a ênfase do original.
