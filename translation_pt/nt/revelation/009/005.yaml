  verdict: approve
  source_fidelity: A tradução preserva o passivo impessoal de ἐδόθη αὐτοῖς em «foi-lhes dado», mantém a dupla construção final/de conteúdo introduzida por ἵνα e traduz adequadamente a duração «durante cinco meses». «Fossem atormentados» exprime de modo natural o resultado pretendido da construção grega. «Quando pica uma pessoa» é uma contextualização lexical legítima de παίσῃ para a ação de um escorpião e conserva o valor genérico de ἄνθρωπον.
  naturalness: O texto é fluente, claro e digno em português moderno de ampla compreensão. A colocação pronominal em «foi-lhes dado» e a cadência da frase são naturais tanto para leitores brasileiros quanto internacionais.
  terminology: «Atormentados» / «tormento» conserva a repetição da família βασαν- sem impor o sentido mais restrito de tortura. «O tormento que causavam» explicita uma leitura contextual muito provável do genitivo αὐτῶν, isto é, o tormento infligido pelos agentes, e evita uma ambiguidade portuguesa que poderia sugerir que eles mesmos sofriam.
