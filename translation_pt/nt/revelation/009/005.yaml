id: REV.9.5
reference: Revelation 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: pt
  text: E foi-lhes dado que não os matassem, mas que fossem atormentados durante cinco meses; e o tormento que causavam era como o tormento de um escorpião quando pica uma pessoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: foi-lhes dado
  rationale: Preserva o passivo e o dativo do texto grego, sem explicitar quem concede a permissão ou autoridade.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: que não os matassem
  rationale: Expressa naturalmente em português o conteúdo ou propósito daquilo que lhes foi dado.
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: mas que fossem atormentados
  rationale: A construção grega incomum aponta para o resultado pretendido; o subjuntivo em português mantém o paralelismo com a oração anterior.
- source_word: μῆνας πέντε
  choice: durante cinco meses
  rationale: Traduz claramente o acusativo de duração.
- source_word: βασανισθήσονται / βασανισμός
  choice: fossem atormentados / tormento
  rationale: Mantém a repetição lexical da família βασαν- e comunica sofrimento intenso sem restringi-lo a tortura judicial.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: o tormento que causavam
  rationale: No contexto, o genitivo refere-se naturalmente ao tormento infligido pelos agentes semelhantes a gafanhotos; a explicitação evita que o português sugira que eles próprios sofriam o tormento.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: como o tormento de um escorpião
  rationale: Conserva a comparação e a repetição de 'tormento', sem substituir a imagem por uma paráfrase.
- source_word: ὅταν παίσῃ
  choice: quando pica
  rationale: Embora παίω signifique literalmente golpear ou atingir, no caso de um escorpião 'picar' comunica em português a ação contextual pretendida.
- source_word: ἄνθρωπον
  choice: uma pessoa
  rationale: ἄνθρωπος tem aqui sentido humano genérico; 'uma pessoa' reproduz esse alcance de modo natural e exato em português.
theological_decisions:
- issue: Passivo divino no juízo apocalíptico
  choice: Manter 'foi-lhes dado' sem nomear o agente.
  alternative: Deus lhes deu autoridade; foi-lhes permitido.
  rationale: O grego não identifica expressamente quem concede; preservar o passivo mantém a tensão entre soberania divina e ação de agentes intermediários.
- issue: Relação do genitivo em ὁ βασανισμὸς αὐτῶν
  choice: Entender como o tormento que eles causavam.
  alternative: O tormento deles, deixando aberta a possibilidade de ser o tormento sofrido por eles.
  rationale: O contexto imediato compara o efeito desses agentes à picada de um escorpião. A redação escolhida torna inteligível essa relação em português sem acrescentar uma doutrina.
- issue: Sentido genérico de ἄνθρωπον
  choice: uma pessoa
  alternative: um homem; alguém
  rationale: Neste contexto, o substantivo designa genericamente um ser humano, não especificamente um indivíduo do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o tom apocalíptico e o passivo do original, mas evita construções artificiais. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
