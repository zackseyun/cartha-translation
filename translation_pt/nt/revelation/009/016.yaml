  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: pt
  text: O número das tropas da cavalaria era de duzentos milhões[a]; ouvi o número delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «duas miríades de miríades» (isto é, duzentos milhões).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: número
  rationale: Equivalente direto e natural, repetido no fim do versículo para acompanhar a repetição grega.
- source_word: στρατευμάτων
  choice: tropas
  rationale: Expressa os contingentes ou corpos militares e combina naturalmente com o coletivo «cavalaria».
- source_word: ἱππικοῦ
  choice: cavalaria
  rationale: O termo substantivado designa a força montada coletivamente, não apenas cavaleiros individuais.
- source_word: δισμυριάδες μυριάδων
  choice: duzentos milhões
  rationale: A expressão indica duas miríades de miríades, isto é, 200.000.000; a forma numérica é clara no português moderno, enquanto a formulação literal fica registrada em nota.
- source_word: ἤκουσα
  choice: ouvi
  rationale: Tradução direta do aoristo narrativo na primeira pessoa.
- source_word: αὐτῶν
  choice: deles
  rationale: Retoma os integrantes das tropas da cavalaria; «deles» é idiomático e mantém a referência sem repetir o substantivo.
theological_decisions: []
