id: REV.9.4
reference: Revelation 9:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: pt
  text: E foi-lhes dito que não causassem dano à erva da terra, nem a qualquer coisa verde, nem a árvore alguma, mas somente às pessoas que não têm o selo de Deus na testa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: foi-lhes dito
  rationale: Preserva a construção passiva e mantém implícito quem falou, sem transformar a instrução em uma ordem explicitamente atribuída a Deus.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: que não causassem dano
  rationale: Neste contexto de juízo, ἀδικέω indica causar dano; a formulação portuguesa comunica naturalmente a instrução negativa.
- source_word: τὸν χόρτον τῆς γῆς
  choice: à erva da terra
  rationale: χόρτος designa erva ou vegetação rasteira, e a construção conserva a relação genitiva e o alcance terrestre da visão.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: nem a qualquer coisa verde
  rationale: O adjetivo substantivado χλωρόν significa literalmente algo verde. A tradução evita restringi-lo indevidamente a uma categoria botânica mais estreita.
- source_word: οὐδὲ πᾶν δένδρον
  choice: nem a árvore alguma
  rationale: Tradução direta e idiomática de πᾶν δένδρον dentro da série negativa.
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: mas somente às pessoas
  rationale: εἰ μή introduz aqui a única exceção permitida, e ἄνθρωποι se refere genericamente a seres humanos, não apenas a homens do sexo masculino.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: o selo de Deus
  rationale: Mantém o termo apocalíptico σφραγίς e sua relação com Deus, evocando identificação, pertença e proteção sem explicá-las no corpo do texto.
- source_word: ἐπὶ τῶν μετώπων
  choice: na testa
  rationale: Em português, o singular distributivo é a forma mais natural para indicar que cada pessoa traz ou não o selo na própria testa.
theological_decisions:
- issue: Identidade de quem deu a instrução
  choice: Manter o agente implícito
  alternative: Explicitar que Deus ordenou
  rationale: A voz passiva do grego não identifica diretamente quem falou. Embora o contexto sugira autoridade divina, a tradução não deve acrescentar um sujeito ausente.
- issue: Alcance de τοὺς ἀνθρώπους
  choice: pessoas em sentido humano genérico
  alternative: homens, entendido como indivíduos do sexo masculino
  rationale: O contraste é entre a vegetação e os seres humanos sem o selo de Deus; nada no versículo limita o grupo aos homens.
- issue: Sentido do selo de Deus
  choice: Preservar a expressão sem explicação interpretativa no texto
  alternative: Parafrasear como sinal de proteção ou propriedade divina
  rationale: O símbolo pode envolver identificação, pertença e proteção. Manter 'selo de Deus' conserva essa densidade teológica e sua conexão com o contexto do Apocalipse.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva a solenidade narrativa sem arcaísmos; 'coisa verde' retém a amplitude lexical do grego, e 'na testa' emprega o singular distributivo idiomático.
