id: REV.9.1
reference: Revelation 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: pt
  text: O quinto anjo tocou a trombeta, e vi uma estrela que havia caído do céu para a terra[a][b]. Foi-lhe dada a chave do poço do abismo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir de forma mais compacta: “uma estrela caída do céu para a terra”. O particípio perfeito provavelmente indica que a queda já havia acontecido quando João viu a estrela.'
    reason: lexical_alternative
  - marker: b
    text: A “estrela” pode simbolizar um ser pessoal, pois a narrativa prossegue dizendo que lhe foi dada uma chave; o versículo, porém, não identifica essa figura.
    reason: alternative_reading
  - marker: c
    text: 'Também: “fosso do abismo”. A forma tradicional “poço sem fundo” interpreta o sentido de “abismo” em vez de reproduzir separadamente os dois termos gregos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: O verbo significa fazer soar uma trombeta. A expressão é natural em português e mantém explícita a imagem do instrumento.
- source_word: ἀστέρα
  choice: estrela
  rationale: Preserva a imagem apocalíptica do grego sem identificar interpretativamente a estrela como anjo, Satanás ou outro ser pessoal.
- source_word: πεπτωκότα
  choice: que havia caído
  rationale: O particípio perfeito apresenta a queda como já ocorrida, com a estrela no estado resultante quando João a vê.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: do céu sobre a terra
  rationale: Mantém o contraste cósmico entre céu e terra; “sobre a terra” expressa com naturalidade o destino da queda indicado por εἰς.
- source_word: ἐδόθη αὐτῷ
  choice: Foi-lhe dada
  rationale: Conserva a construção passiva e não identifica o agente que concede a chave. O pronome “lhe” também evita impor em português um gênero interpretativo à figura da estrela.
- source_word: ἡ κλεὶς
  choice: a chave
  rationale: Reproduz de modo direto o substantivo definido do texto grego.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: do poço do abismo
  rationale: “Poço” representa φρέαρ como abertura ou acesso, enquanto “abismo” preserva ἄβυσσος como termo distinto, sem expandi-lo interpretativamente para “sem fundo”.
theological_decisions:
- issue: Identidade da estrela
  choice: Manter “estrela” sem identificar a figura
  alternative: Traduzir como anjo, ser demoníaco ou Satanás
  rationale: O texto usa a imagem de uma estrela e não declara sua identidade. A concessão da chave pode sugerir uma figura pessoal, mas a tradução não deve resolver essa ambiguidade.
- issue: Agente da concessão da chave
  choice: 'Manter a voz passiva: “Foi-lhe dada”'
  alternative: 'Explicitar: “Deus lhe deu”'
  rationale: Embora o contexto possa sugerir permissão divina, o grego não nomeia quem dá a chave; a formulação passiva preserva essa reserva.
- issue: Gênero da referência à estrela
  choice: Usar o pronome sem marca de gênero “lhe”
  alternative: Usar “a ele” e tornar explícita uma referência masculina pessoal
  rationale: αὐτῷ é masculino em concordância possível com ἀστήρ, que também é masculino em grego. Como “estrela” é feminina em português, “lhe” preserva melhor a ambiguidade entre concordância gramatical e simbolismo pessoal.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A coordenação inicial foi suavizada sem eliminar a progressão narrativa. “Foi-lhe dada” mantém a passiva característica de Apocalipse e evita marcar desnecessariamente o gênero da figura simbólica.
