id: REV.9.21
reference: Revelation 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: pt
  text: E não se arrependeram dos seus assassinatos, nem das suas feitiçarias[a], nem da sua imoralidade sexual, nem dos seus furtos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «práticas de magia»; o termo grego também pode estar associado a poções ou venenos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: se arrependeram
  rationale: No contexto moral, μετανοέω indica arrependimento e abandono do pecado, não apenas mudança de opinião.
- source_word: ἐκ
  choice: de/dos/das
  rationale: Com «arrepender-se», a regência idiomática em português é «de», preservando a ideia de afastar-se dos pecados enumerados.
- source_word: φόνων
  choice: assassinatos
  rationale: φόνος denota mortes intencionais e culpáveis; «assassinatos» comunica com clareza a força moral e criminosa do termo.
- source_word: φαρμάκων
  choice: feitiçarias
  rationale: Neste catálogo de vícios e no contexto do Apocalipse, o sentido mais provável é o de práticas mágicas ou ocultistas; a nota preserva a associação lexical possível com poções e venenos.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: πορνεία possui alcance amplo no campo da conduta sexual; a expressão moderna evita restringi-lo a uma única prática.
- source_word: κλεμμάτων
  choice: furtos
  rationale: κλέμμα pode indicar aquilo que foi roubado ou um ato de roubo; no catálogo de vícios, «furtos» é uma forma plural natural e concisa.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: nem ... nem ... nem
  rationale: A repetição de «nem» reproduz de modo natural em português a coordenação negativa enfática do grego.
theological_decisions:
- issue: Amplitude semântica de φαρμάκων em um catálogo apocalíptico de vícios
  choice: feitiçarias
  alternative: práticas de magia; uso de poções ou venenos
  rationale: Os termos cognatos no Apocalipse estão ligados sobretudo à magia e ao engano ocultista. «Feitiçarias» preserva esse sentido contextual sem reduzir anacronicamente o termo a medicamentos modernos; a nota registra sua amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de «seus/suas» acompanha o grego e mantém a responsabilidade pessoal enfatizada pelo versículo. O marcador foi colocado após «feitiçarias», termo ao qual a nota lexical se refere.
