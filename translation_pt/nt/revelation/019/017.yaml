  source_fidelity: 'A tradução preserva os elementos centrais do grego: o anjo está «no sol», dirige-se a todas as aves e as convoca para «a grande ceia de Deus». Contudo, a coordenação explícita do original («e ele gritou») é mais bem preservada sem dividir a frase em duas orações independentes.'
