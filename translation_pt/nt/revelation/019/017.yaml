id: REV.19.17
reference: Revelation 19:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: pt
  text: 'E vi um anjo em pé no sol, e ele gritou em alta voz, dizendo a todas as aves que voavam no meio do céu[a]: “Venham! Reúnam-se para a grande ceia de Deus,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no alto do céu”. O termo grego μεσουράνημα é uma expressão apocalíptica distintiva usada em Apocalipse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: um anjo
  rationale: Embora ἕνα tenha forma numeral, aqui pode funcionar naturalmente como o indefinido; “um anjo” preserva tanto a forma quanto a fluência em português, sem enfatizar indevidamente “um só anjo”.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: em pé no sol
  rationale: Preserva a imagem apocalíptica vívida de ἐν τῷ ἡλίῳ, sem suavizá-la para “diante do sol”; “em pé” exprime com naturalidade o particípio perfeito ἑστῶτα.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: gritou com voz forte
  rationale: Comunica a força de κράζω e da expressão φωνῇ μεγάλῃ em português atual e digno.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: a todas as aves
  rationale: ὄρνεον designa aves em geral; a ideia de aves carniceiras decorre do contexto seguinte e não deve ser inserida no substantivo.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: que voavam no meio do céu
  rationale: Traduz de modo claro o termo apocalíptico μεσουράνημα como a região central ou elevada do céu, evitando o pouco natural “meio-céu”.
- source_word: Δεῦτε
  choice: Venham!
  rationale: Reproduz a convocação direta e enfática do imperativo, com plural adequado aos destinatários.
- source_word: συνάχθητε
  choice: Reúnam-se
  rationale: Expressa idiomaticamente o imperativo aoristo com sentido de congregar-se, sem forçar uma passiva explícita.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: para a grande ceia de Deus
  rationale: “Ceia” mantém a ligação lexical com δεῖπνον e com a ceia das bodas no contexto; a ordem conserva explicitamente o genitivo “de Deus”.
theological_decisions:
- issue: Imagem espacial apocalíptica
  choice: em pé no sol
  alternative: em pé diante do sol
  rationale: A construção grega apresenta uma imagem deliberadamente extraordinária. A tradução mantém essa tensão visual em vez de explicar ou atenuar a cena.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso direto usa imperativos claros e vigorosos; a imagem apocalíptica e a terminologia de “ceia” são preservadas sem paráfrase denominacional.
