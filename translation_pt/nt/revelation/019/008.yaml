id: REV.19.8
reference: Revelation 19:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: pt
  text: E foi-lhe dado vestir-se de linho fino, brilhante e limpo, pois o linho fino são os atos justos[a] dos santos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ações justas”. Em outros contextos, a palavra grega também pode significar “exigências justas”, mas aqui se refere mais naturalmente aos atos justos dos santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: foi-lhe dado
  rationale: Mantém a construção passiva e deixa implícito quem dá, como no grego, ao mesmo tempo que exprime naturalmente o dativo αὐτῇ.
- source_word: ἵνα περιβάληται
  choice: vestir-se
  rationale: O infinitivo expressa de modo natural a finalidade da concessão, e a forma reflexiva preserva o valor médio do verbo.
- source_word: βύσσινον
  choice: linho fino
  rationale: Designa tecido de linho fino e valioso; a mesma expressão é repetida para preservar a explicação simbólica do original.
- source_word: λαμπρὸν καθαρόν
  choice: brilhante e limpo
  rationale: Conserva as duas qualidades visuais do tecido sem transformar prematuramente καθαρόν em uma abstração moral.
- source_word: τὸ γὰρ βύσσινον
  choice: pois o linho fino representa
  rationale: γάρ introduz a explicação do símbolo. O verbo 'representa' torna idiomática em português a identificação metafórica feita por ἐστίν sem mudar seu sentido.
- source_word: τὰ δικαιώματα
  choice: os atos justos
  rationale: Neste contexto e no plural, a expressão se refere mais naturalmente às ações justas, embora o termo também possa designar exigências ou determinações justas em outros contextos.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: É a designação neotestamentária tradicional e concisa para o povo santo de Deus, compreensível no contexto.
theological_decisions:
- issue: Sentido de δικαιώματα em relação à veste da noiva
  choice: A veste representa os atos justos dos santos.
  alternative: A veste representa as exigências justas referentes aos santos ou sua condição/vindicação justa.
  rationale: O plural e a explicação simbólica favorecem ações concretas. A tradução mantém a tensão entre a veste que lhe é dada e os atos justos dos santos, sem explicar como esses dois aspectos se relacionam teologicamente.
- issue: Agente da forma passiva ἐδόθη
  choice: 'O agente permanece implícito: ''foi-lhe dado''.'
  alternative: Deus lhe deu.
  rationale: Embora a forma possa ser entendida como passivo divino, o texto grego não identifica expressamente quem dá; a tradução preserva essa reserva.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A colocação 'foi-lhe dado' conserva concisão e solenidade sem soar arcaica; 'vestir-se' preserva a nuance reflexiva. O marcador [a] aparece imediatamente após a expressão comentada.
