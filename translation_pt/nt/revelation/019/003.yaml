source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: pt
  text: 'E disseram pela segunda vez: “Aleluia!” E a fumaça dela sobe para todo o sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “para os séculos dos séculos”, expressão idiomática que indica duração sem fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: pela segunda vez
  rationale: O acusativo adverbial indica repetição com força sequencial; esta formulação é natural em português e preserva explicitamente que se trata da segunda ocorrência.
- source_word: εἴρηκαν
  choice: disseram
  rationale: Embora seja a forma perfeita de λέγω, o pretérito perfeito é a forma narrativa mais natural em português; evita acrescentar a intensidade que verbos como “clamaram” ou “gritaram” introduziriam.
- source_word: Ἁλληλουϊά
  choice: Aleluia
  rationale: Mantém a fórmula litúrgica tradicional, reconhecível em português, em vez de explicitar interpretativamente “Louvem a Yah” ou “Louvem o Senhor”.
- source_word: ὁ καπνὸς αὐτῆς
  choice: a fumaça dela
  rationale: O pronome feminino retoma Babilônia, retratada no contexto como cidade e mulher. “Dela” conserva essa referência personificada sem a possível rigidez de “sua fumaça”.
- source_word: ἀναβαίνει
  choice: sobe
  rationale: O presente preserva a imagem vívida e contínua do grego em linguagem direta e corrente.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: É uma equivalência portuguesa consagrada e natural para o idiomatismo grego que expressa duração sem fim; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Duração expressa por εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  alternative: pelos séculos dos séculos
  rationale: Neste contexto de juízo final, a expressão idiomática comunica duração interminável. A tradução mantém essa força sem suavizá-la, enquanto a nota oferece transparência quanto à forma grega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aleluia” preserva o registro litúrgico; “para todo o sempre” é idiomático sem perder a solenidade. O marcador da nota foi colocado após a expressão que ela explica.
