id: REV.19.11
reference: Revelation 19:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: pt
  text: Então vi o céu aberto, e eis um cavalo branco. Aquele que estava sentado sobre ele é chamado Fiel e Verdadeiro e, com justiça,[a] julga e guerreia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em justiça».'
    reason: Alternativa formal para ἐν δικαιοσύνῃ, preservando a construção e a amplitude semântica do original.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: aberto
  rationale: O particípio perfeito passivo descreve o céu no estado resultante de ter sido aberto; «aberto» preserva esse sentido de modo natural em português.
- source_word: ἰδοὺ
  choice: e eis
  rationale: Mantém a vivacidade visionária e a força apresentativa do grego, em registro bíblico ainda compreensível.
- source_word: ἵππος λευκός
  choice: um cavalo branco
  rationale: Tradução direta e idiomática da expressão nominal.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Aquele que estava montado nele
  rationale: Expressa naturalmente em português a pessoa sentada sobre o cavalo, sem reduzir a construção ao substantivo interpretativo «cavaleiro».
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: é chamado Fiel e Verdadeiro
  rationale: Trata os adjetivos como designações do personagem, conforme a construção com καλούμενος e o contexto imediato.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: Em português atual, «com justiça» comunica com clareza a maneira justa pela qual ele julga e guerreia; a alternativa mais formal «em justiça» é preservada em nota.
- source_word: κρίνει
  choice: julga
  rationale: Preserva de maneira direta o presente ativo, sem acrescentar qualificação além da frase preposicional.
- source_word: πολεμεῖ
  choice: guerreia
  rationale: Verbo conciso que mantém a força militar de πολεμέω e o paralelismo com «julga».
theological_decisions:
- issue: Apresentação das designações do que monta o cavalo
  choice: Fiel e Verdadeiro, com iniciais maiúsculas
  alternative: fiel e verdadeiro, como simples adjetivos descritivos
  rationale: No contexto literário, os termos funcionam como designações do personagem. As maiúsculas sinalizam esse uso titular sem identificar explicitamente o personagem além do que o versículo declara.
- issue: Sentido de δικαιοσύνη
  choice: com justiça
  alternative: em justiça; com retidão
  rationale: Aqui o termo caracteriza o julgamento e a guerra como justos. «Justiça» preserva a dimensão judicial especialmente saliente no contexto, enquanto a nota registra uma forma mais próxima da estrutura grega.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. «E eis» conserva o tom apocalíptico; a divisão em duas frases evita uma sequência excessiva de coordenações. O marcador [a] aparece imediatamente após a expressão a que se refere.
