review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz a visão do céu aberto, a apresentação do cavalo branco, os títulos «Fiel e Verdadeiro» e a dupla ação de julgar e guerrear. Contudo, «estava montado nele» é menos fiel à imagem expressa pelo particípio «o que está/estava sentado sobre ele» e soa menos natural do que «estava sentado sobre ele».
  naturalness: O português é claro, solene sem ser arcaizante, e «e eis» preserva adequadamente o efeito visionário de ἰδού. «Com justiça, julga e guerreia» é fluente. A revisão pontual melhora a naturalidade e a proximidade sintática da descrição do personagem.
  terminology: «Fiel e Verdadeiro» preserva bem o caráter designativo dos adjetivos e a capitalização titular é justificável no contexto. «Justiça» é uma tradução contextual legítima de δικαιοσύνη; a nota «em justiça» preserva uma alternativa mais formal e a amplitude da expressão. «Guerreia» mantém a força de πολεμεῖ sem atenuação.
  issues:
