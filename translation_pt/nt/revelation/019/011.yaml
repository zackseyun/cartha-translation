    issue: «Aquele que estava montado nele»
    rationale: A construção grega diz literalmente «o que estava sentado sobre ele». Embora «montado» identifique corretamente a relação com o cavalo, «sentado sobre ele» reflete melhor o particípio e a preposição, além de evitar a formulação um pouco menos idiomática «montado nele».
