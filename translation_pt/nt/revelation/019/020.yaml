id: REV.19.20
reference: Revelation 19:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: pt
  text: E a besta foi capturada, e com ela[a] o falso profeta que havia realizado os sinais diante dela, por meio dos quais enganou os que tinham recebido a marca da besta e os que adoravam a imagem dela. Os dois foram lançados vivos no lago de fogo que arde com enxofre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui e nas expressões seguintes pronomes que retomam “a besta”, substantivo neutro em grego; em português, “ela/dela” concorda naturalmente com o substantivo feminino “besta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιάσθη
  choice: foi capturada
  rationale: O aoristo passivo de πιάζω indica que a besta foi agarrada ou feita prisioneira. “Foi capturada” é natural em português e preserva a voz passiva.
- source_word: θηρίον
  choice: besta
  rationale: Termo consagrado para a figura apocalíptica em Apocalipse, preservando sua imagem simbólica.
- source_word: μετ’ αὐτοῦ
  choice: com ela
  rationale: O pronome retoma τὸ θηρίον. Em português, a concordância natural com o substantivo feminino “besta” exige “ela”, sem decidir se a figura deve ser entendida como pessoal ou impessoal.
- source_word: ψευδοπροφήτης
  choice: falso profeta
  rationale: Tradução direta e corrente do substantivo composto.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: que havia realizado os sinais
  rationale: A forma participial descreve uma ação anterior à captura. “Sinais” conserva o valor indicativo de σημεῖα, sem reduzi-los genericamente a milagres.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dela
  rationale: Expressa que os sinais foram realizados na presença da besta e mantém a referência pronominal clara em português.
- source_word: ἐν οἷς
  choice: por meio dos quais
  rationale: 'Torna explícito o valor instrumental da expressão: os sinais foram o meio empregado para enganar.'
- source_word: ἐπλάνησεν
  choice: enganou
  rationale: πλανάω pode significar enganar ou desviar. “Enganou” é conciso e adequado ao papel do falso profeta neste contexto.
- source_word: τοὺς λαβόντας
  choice: os que tinham recebido
  rationale: O mais-que-perfeito composto comunica naturalmente que o recebimento da marca precedeu a cena de julgamento.
- source_word: χάραγμα
  choice: marca
  rationale: É o equivalente corrente e exato para a impressão ou sinal identificador ligado à besta em Apocalipse.
- source_word: προσκυνοῦντας
  choice: adoravam
  rationale: No contexto de Apocalipse, προσκυνέω indica devoção cultual, não apenas o ato físico de se prostrar.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Os dois foram lançados vivos
  rationale: Preserva tanto a passiva quanto a ênfase de que ambos foram lançados enquanto ainda estavam vivos.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: o lago de fogo que arde com enxofre
  rationale: Mantém literalmente a imagem concreta do julgamento apocalíptico e usa “enxofre”, o termo moderno comum para θεῖον.
theological_decisions:
- issue: Referência pronominal à besta
  choice: Usar “ela/dela”, em concordância gramatical com “besta”
  alternative: Usar formas masculinas para personalizar a figura
  rationale: O grego emprega pronomes que retomam θηρίον, substantivo neutro; o português exige concordância feminina com “besta”. Essa solução é natural e não impõe uma conclusão sobre a natureza pessoal da figura.
- issue: Imagem do julgamento final
  choice: Preservar “lago de fogo que arde com enxofre”
  alternative: Parafrasear como inferno ou tormento eterno
  rationale: O versículo apresenta uma imagem apocalíptica concreta. Mantê-la evita acrescentar formulações doutrinárias que não aparecem explicitamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a progressão narrativa do grego sem rigidez artificial; termos tradicionais da linguagem apocalíptica, como “besta”, “marca” e “lago de fogo”, foram mantidos.
