reference: Revelation 19:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: pt
  text: 'E os vinte e quatro anciãos e os quatro seres viventes prostraram-se e adoraram a Deus, aquele que está sentado no trono, dizendo: “Amém! Aleluia![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Louvem o SENHOR!” Aclamação litúrgica hebraica; literalmente, “Louvem Yah!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: prostraram-se
  rationale: No contexto de adoração, o aoristo de πίπτω descreve o ato reverente de lançar-se ao chão; “prostraram-se” expressa isso com clareza e naturalidade em português.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: os vinte e quatro anciãos
  rationale: “Anciãos” é a tradução bíblica corrente de πρεσβύτεροι e preserva sua função no cenário apocalíptico sem recorrer ao termo técnico “presbíteros”.
- source_word: τὰ τέσσαρα ζῷα
  choice: os quatro seres viventes
  rationale: ζῷα designa aqui os seres exaltados junto ao trono, não meros animais. “Seres viventes” mantém essa distinção e é claro em português.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: Tendo Deus como objeto, o verbo indica adoração, e não apenas reverência ou homenagem.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo grego é expresso naturalmente com a preposição “a” após “adoraram” em português.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: aquele que está sentado no trono
  rationale: A expressão identifica Deus por meio de uma fórmula recorrente em Apocalipse e conserva o valor presente do particípio em linguagem natural.
- source_word: λέγοντες
  choice: dizendo
  rationale: O gerúndio liga diretamente a adoração à aclamação pronunciada, refletindo o particípio grego.
- source_word: Ἀμήν
  choice: Amém
  rationale: A transliteração consagrada preserva a função de aclamação litúrgica do termo.
- source_word: Ἁλληλουϊά
  choice: Aleluia
  rationale: “Aleluia” é a forma litúrgica tradicional e plenamente naturalizada em português; a nota explicita o sentido hebraico subjacente.
theological_decisions:
- issue: Tradução de Ἁλληλουϊά, aclamação litúrgica hebraica incorporada ao texto grego
  choice: Aleluia
  alternative: Louvem o SENHOR!; Louvem Yah!
  rationale: A transliteração preserva o caráter de aclamação fixa e sua forma reconhecida no culto cristão, sem decidir no texto principal como representar o elemento abreviado do nome divino. A nota conserva o significado e a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prostraram-se” evita a possível impressão de queda acidental; “seres viventes” distingue as figuras do trono de animais comuns. A ordem e a coordenação do grego foram preservadas sem rigidez artificial.
