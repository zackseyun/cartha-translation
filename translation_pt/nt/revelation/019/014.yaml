id: REV.19.14
reference: Revelation 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: pt
  text: E os exércitos que estavam no céu o seguiam montados em cavalos brancos, vestidos de linho fino, branco e puro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατεύματα
  choice: exércitos
  rationale: O plural designa forças militares organizadas; “exércitos” é direto, natural e adequado ao cenário de guerra apocalíptica.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: que estavam no céu
  rationale: A expressão é locativa e identifica onde se encontravam os exércitos, sem transformar a localização em uma caracterização interpretativa.
- source_word: ἠκολούθει αὐτῷ
  choice: o seguiam
  rationale: O pretérito imperfeito preserva a ação em andamento retratada pelo imperfeito grego.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: montados em cavalos brancos
  rationale: “Montados em” expressa de modo claro e idiomático que os integrantes dos exércitos acompanhavam a figura cavalgando.
- source_word: ἐνδεδυμένοι
  choice: vestidos
  rationale: Forma corrente e digna que descreve o estado resultante de estarem trajados.
- source_word: βύσσινον
  choice: linho fino
  rationale: Designa tecido de linho fino e valioso, preservando a imagem recorrente no Apocalipse.
- source_word: λευκὸν καθαρόν
  choice: branco e puro
  rationale: Os dois adjetivos qualificam o linho; “branco” conserva a qualidade visual, e “puro” comunica aqui a condição imaculada expressa por καθαρόν sem sugerir apenas limpeza física.
theological_decisions:
- issue: Identidade dos exércitos no céu
  choice: Descrevê-los apenas como “os exércitos que estavam no céu”
  alternative: Identificá-los como anjos, santos glorificados ou ambos
  rationale: O versículo informa sua localização e suas vestes, mas não define explicitamente sua identidade; a tradução preserva essa abertura interpretativa.
- issue: Relação de λευκὸν καθαρόν com o linho fino
  choice: Traduzir como “branco e puro”
  alternative: “branco e limpo” ou “resplandecente e puro”
  rationale: A formulação mantém os dois qualificativos sem converter λευκόν em “resplandecente” nem reduzir καθαρόν necessariamente à limpeza material.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. A estrutura “que estavam no céu” explicita naturalmente o valor locativo do grego, e “montados em” evita uma construção ambígua ou excessivamente literal.
