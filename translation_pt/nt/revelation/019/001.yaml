id: REV.19.1
reference: Revelation 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: pt
  text: 'Depois dessas coisas, ouvi como uma voz forte de uma grande multidão no céu, que dizia: “Aleluia![a] A salvação, a glória e o poder pertencem ao nosso Deus,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Louvem a Yah” ou “Louvem o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva o demonstrativo plural e a progressão temporal da visão, em português natural.
- source_word: ἤκουσα
  choice: ouvi
  rationale: O aoristo de ἀκούω integra a sequência narrativa e é adequadamente expresso pelo pretérito perfeito.
- source_word: ὡς
  choice: algo como
  rationale: Mantém a ideia de semelhança ou aproximação perceptiva própria da descrição apocalíptica, sem identificar rigidamente o som.
- source_word: φωνὴν μεγάλην
  choice: a voz forte
  rationale: Com φωνή, μεγάλην indica sobretudo intensidade sonora. “Voz forte” é idiomático e preserva a imagem de uma voz coletiva.
- source_word: ὄχλου πολλοῦ
  choice: de uma grande multidão
  rationale: “Multidão” comunica bem a vasta assembleia celestial, enquanto “grande” representa πολλοῦ.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto, οὐρανός designa a esfera celestial, e não simplesmente o firmamento.
- source_word: λεγόντων
  choice: que dizia
  rationale: O particípio plural concorda em sentido com os integrantes da multidão; o português pode tratar “multidão” como coletivo singular, produzindo uma frase natural sem alterar a atribuição da aclamação.
- source_word: Ἁλληλουϊά
  choice: Aleluia
  rationale: A forma litúrgica tradicional em português preserva a exclamação hebraica incorporada ao texto grego; seu sentido é indicado em nota.
- source_word: ἡ σωτηρία
  choice: A salvação
  rationale: Expressa a libertação salvadora atribuída a Deus. O artigo preserva a forma definida da aclamação grega e soa natural na enumeração portuguesa.
- source_word: ἡ δόξα
  choice: a glória
  rationale: “Glória” é o equivalente consagrado e contextual de δόξα na adoração.
- source_word: ἡ δύναμις
  choice: o poder
  rationale: “Poder” representa de modo amplo e natural a força divina indicada por δύναμις.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: pertencem ao nosso Deus
  rationale: Explicita naturalmente em português o genitivo de posse ou atribuição sem acrescentar conteúdo teológico.
theological_decisions:
- issue: Forma da aclamação Ἁλληλουϊά
  choice: Aleluia
  alternative: Louvem a Yah / Louvem o SENHOR
  rationale: A transliteração tradicional preserva o caráter litúrgico e intertextual da expressão hebraica presente no grego. A nota registra seu significado sem substituir no texto a fórmula reconhecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a aproximação perceptiva de ὡς e a cadência solene da aclamação celestial.
