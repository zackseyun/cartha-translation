id: REV.19.9
reference: Revelation 19:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: pt
  text: 'E ele me disse: “Escreva: Felizes os que foram convidados para a ceia das bodas do Cordeiro.[a]” E ele me disse: “Estas são as verdadeiras palavras de Deus.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que foram chamados para a ceia das bodas do Cordeiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Estas são as palavras dignas de confiança de Deus”. O termo grego afirma que essas palavras são verdadeiras e confiáveis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: Escreva
  rationale: O imperativo aoristo singular é reproduzido de modo direto e natural, sem acrescentar conteúdo.
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em português bíblico corrente, “felizes” comunica a condição favorecida declarada pela bem-aventurança, sem reduzi-la a uma emoção passageira.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: os que foram convidados para a ceia
  rationale: O particípio perfeito passivo descreve pessoas que permanecem na condição de chamadas ou convidadas. No contexto de uma refeição nupcial, “convidados” expressa naturalmente o sentido, enquanto a alternativa mais literal é preservada em nota.
- source_word: δεῖπνον
  choice: ceia
  rationale: Designa a refeição principal, frequentemente à noite; “ceia” preserva a formulação bíblica conhecida e se combina naturalmente com a imagem nupcial.
- source_word: γάμου
  choice: bodas
  rationale: No sintagma relativo a uma ceia, “bodas” comunica a celebração nupcial de modo idiomático, solene e conciso.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: Mantém o título cristológico central de Apocalipse e suas ressonâncias sacrificiais e messiânicas.
- source_word: Οὗτοι οἱ λόγοι
  choice: Estas são as ... palavras
  rationale: Reproduz naturalmente em português a construção demonstrativa nominal grega com a cópula expressa.
- source_word: ἀληθινοὶ
  choice: verdadeiras
  rationale: É a correspondência mais direta e preserva tanto a veracidade quanto, por implicação, a confiabilidade das palavras.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém o genitivo sem especificar além do texto se a ênfase recai sobre autoria, origem ou pertencimento.
theological_decisions:
- issue: Sentido de κεκλημένοι no banquete escatológico
  choice: convidados
  alternative: chamados
  rationale: No contexto de uma ceia, “convidados” transmite o uso idiomático de καλέω sem introduzir uma afirmação doutrinária sobre a natureza do chamado. A opção mais literal permanece em nota.
- issue: Forma da imagem nupcial em δεῖπνον τοῦ γάμου
  choice: ceia das bodas
  alternative: ceia do casamento
  rationale: “Ceia das bodas” é natural em registro bíblico digno e representa a refeição festiva ligada às núpcias, sem resolver além do grego a relação exata entre casamento, festa e refeição.
- issue: Valor de ἀληθινοί aplicado às palavras de Deus
  choice: verdadeiras
  alternative: dignas de confiança
  rationale: “Verdadeiras” segue mais de perto o adjetivo grego e permite que a afirmação abranja tanto a verdade quanto a confiabilidade, sem substituir uma dimensão pela outra.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira e tom solene. “E acrescentou” evita a repetição pouco natural de “e ele me disse” sem alterar o sujeito nem a progressão do discurso. Os marcadores aparecem imediatamente após as expressões às quais se referem.
