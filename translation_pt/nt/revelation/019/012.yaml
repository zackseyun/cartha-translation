reference: Revelation 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: pt
  text: Seus olhos eram uma chama de fogo, e sobre a sua cabeça havia muitos diademas. Ele tinha um nome escrito que ninguém conhece, a não ser ele mesmo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: Seus olhos
  rationale: O possessivo é a forma natural em português de expressar o substantivo articulado com o pronome no genitivo; δέ funciona como conexão leve e não precisa de equivalente explícito.
- source_word: φλὸξ πυρός
  choice: uma chama de fogo
  rationale: Preserva a construção nominal e a imagem direta do grego, sem acrescentar uma comparação explícita ausente no texto.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sobre a cabeça
  rationale: Expressa com clareza a relação espacial indicada por ἐπί com acusativo.
- source_word: διαδήματα πολλά
  choice: muitos diademas
  rationale: διάδημα designa especificamente a insígnia régia, distinguindo-se de στέφανος; 'diademas' é compreensível em português e conserva essa precisão.
- source_word: ἔχων
  choice: ele tinha
  rationale: Transforma o particípio em oração finita para obter uma descrição natural em português sem alterar sua referência ao cavaleiro.
- source_word: ὄνομα γεγραμμένον
  choice: um nome escrito
  rationale: Conserva o sentido resultativo do particípio perfeito passivo e permanece próximo da ordem e da imagem do grego.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: que ninguém conhece
  rationale: οἶδεν, embora formalmente perfeito, tem valor presente; 'conhece' é natural para o conhecimento de um nome misterioso.
- source_word: εἰ μὴ αὐτός
  choice: a não ser ele mesmo
  rationale: Preserva tanto a exclusividade da exceção quanto a ênfase do pronome αὐτός.
theological_decisions:
- issue: Referência da cláusula de conhecimento exclusivo
  choice: O próprio cavaleiro é o único que conhece o nome escrito.
  alternative: Entender a frase sobretudo como uma afirmação geral da incompreensibilidade do nome.
  rationale: A redação mantém a declaração explícita do grego — ninguém conhece a não ser ele mesmo — sem explicar a natureza do nome nem ampliar suas implicações cristológicas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. 'Diademas' mantém a precisão régia do termo grego. A metáfora nominal 'uma chama de fogo' foi preservada sem inserir 'como'. A divisão em duas frases evita uma sequência excessiva de coordenações e conserva o fluxo descritivo.
