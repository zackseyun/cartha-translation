id: REV.19.18
reference: Revelation 19:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and slave, and small and great.
translation:
  language: pt
  text: para comerem a carne de reis, a carne de comandantes militares, a carne de poderosos, a carne de cavalos e dos que estão montados neles[a], e a carne de todos, livres e escravos, pequenos e grandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais concisa: “dos seus cavaleiros”.'
    reason: Alternativa lexical para a expressão que significa literalmente os que estão sentados ou montados sobre os cavalos.
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: para comerem
  rationale: A construção final com ἵνα e o subjuntivo expressa o propósito da convocação dirigida às aves no versículo anterior. A forma infinitiva flexionada é natural em português e mantém o referente plural.
- source_word: σάρκας
  choice: a carne
  rationale: Refere-se literalmente à carne dos corpos no cenário de juízo. A repetição foi preservada para conservar a força retórica do grego.
- source_word: βασιλέων
  choice: de reis
  rationale: Mantém a referência específica a monarcas, sem ampliá-la para governantes em geral.
- source_word: χιλιάρχων
  choice: de comandantes militares
  rationale: Designa oficiais militares, historicamente associados ao comando de mil homens. A explicitação de 'militares' evita a ambiguidade de 'comandantes' isoladamente.
- source_word: ἰσχυρῶν
  choice: de poderosos
  rationale: O adjetivo substantivado pode indicar pessoas fortes ou poderosas; 'poderosos' é conciso e adequado ao catálogo de figuras de poder.
- source_word: ἵππων
  choice: de cavalos
  rationale: Referência literal aos cavalos na imagem de batalha.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: dos que estão montados neles
  rationale: Reproduz a imagem de pessoas assentadas sobre os cavalos, em português natural, sem reduzi-la no texto principal ao substantivo 'cavaleiros'.
- source_word: πάντων
  choice: de todos
  rationale: Resume de modo abrangente os grupos sociais mencionados em seguida.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: livres e escravos
  rationale: Preserva o contraste de condição social entre pessoas livres e pessoas submetidas à escravidão.
- source_word: μικρῶν καὶ μεγάλων
  choice: pequenos e grandes
  rationale: Mantém o merismo tradicional que abrange pessoas de todas as posições ou níveis de importância.
theological_decisions:
- issue: Tradução de δοῦλος no contraste de condição social
  choice: escravos
  alternative: servos
  rationale: O contraste explícito com os livres torna central a condição de sujeição; 'escravos' comunica essa realidade com maior precisão do que 'servos'.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a repetição enfática de “a carne” e a cadência dos pares sociais do original.
