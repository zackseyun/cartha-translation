id: REV.19.16
reference: Revelation 19:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: pt
  text: 'E ele tem, sobre o seu manto e sobre a sua coxa, um nome escrito: Rei dos reis e Senhor dos senhores.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um nome gravado». O grego diz literalmente «um nome escrito».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: tem
  rationale: O presente do indicativo preserva o presente vívido da visão; evita a forma interpretativa «traz».
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: sobre o seu manto
  rationale: «Manto» comunica com naturalidade a veste no contexto régio e guerreiro; «seu» explicita em português a relação possessiva implícita no contexto.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: sobre a sua coxa
  rationale: Traduz diretamente μηρός e mantém a segunda localização sem explicar como ela se relaciona com o manto.
- source_word: ὄνομα γεγραμμένον
  choice: um nome escrito
  rationale: Preserva a formulação simples do grego e o sentido resultante do particípio perfeito passivo, sem especificar indevidamente o modo da escrita.
- source_word: Βασιλεὺς βασιλέων
  choice: Rei dos reis
  rationale: Reproduz a construção genitiva e sua força régia superlativa em forma tradicional e clara.
- source_word: κύριος κυρίων
  choice: Senhor dos senhores
  rationale: Mantém o título κύριος e o paralelismo exaltado da expressão grega.
theological_decisions:
- issue: Forma do título régio e cristológico
  choice: Rei dos reis e Senhor dos senhores
  alternative: Rei supremo e Senhor supremo
  rationale: A tradução literal conserva o paralelismo, a ressonância teológica e a força do título sem recorrer a uma paráfrase interpretativa.
- issue: Relação espacial entre o manto e a coxa
  choice: sobre o seu manto e sobre a sua coxa
  alternative: no manto, na parte que cobre a coxa
  rationale: O grego apresenta duas expressões com ἐπί; mantê-las separadas preserva a imagem e não resolve uma questão espacial que o texto deixa em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «sobre» preserva a estrutura e as duas localizações do original; as maiúsculas nos títulos destacam sua função nominal e régia.
