id: REV.19.19
reference: Revelation 19:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: pt
  text: E vi a besta, os reis da terra e os exércitos deles, reunidos[a] para fazer guerra contra[b] aquele que está sentado sobre o cavalo e contra o seu exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agrupados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “fazer guerra com”; neste contexto, o sentido é hostil: “fazer guerra contra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: a besta
  rationale: Em Apocalipse, o termo tem força simbólica e ameaçadora; “besta” é a tradução consagrada e preserva melhor essa carga do que “animal”.
- source_word: βασιλεῖς τῆς γῆς
  choice: os reis da terra
  rationale: Embora γῆ também possa significar “país” ou “território”, o horizonte apocalíptico e abrangente da passagem favorece “terra”.
- source_word: στρατεύματα αὐτῶν
  choice: os exércitos deles
  rationale: O contexto de πόλεμος é explicitamente militar; “exércitos” expressa com naturalidade o plural grego.
- source_word: συνηγμένα
  choice: reunidos
  rationale: O particípio perfeito passivo descreve os reis e seus exércitos no estado resultante de terem sido congregados. “Reunidos” é claro e mantém essa ideia.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: para fazer guerra
  rationale: A expressão reproduz de modo natural e relativamente formal o idioma grego de entrar em guerra, sem reduzir o sentido a uma única batalha.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: contra aquele que estava sentado sobre o cavalo
  rationale: Embora μετά com genitivo normalmente signifique “com”, a construção “fazer guerra com” tem aqui sentido hostil. “Contra” deixa essa relação clara, enquanto “aquele que estava sentado” conserva a forma descritiva do grego.
- source_word: ἐπὶ τοῦ ἵππου
  choice: sobre o cavalo
  rationale: “Sobre” preserva diretamente a relação locativa expressa por ἐπί e soa dignificado no contexto.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: contra o seu exército
  rationale: O contexto bélico dá a μετά sentido adversativo, e o singular coletivo στρατεύματος corresponde naturalmente a “exército”.
theological_decisions:
- issue: Identidade daquele que estava sentado sobre o cavalo
  choice: Manter a expressão descritiva do versículo, sem substituí-la por um título cristológico explícito.
  alternative: Traduzir interpretativamente como “contra o Messias” ou “contra Cristo”.
  rationale: O contexto imediato permite identificar a figura, mas este versículo emprega uma descrição participial. Preservá-la respeita a formulação do texto e evita inserir um título ausente no grego.
- issue: Sentido de μετά nas duas expressões ligadas à guerra
  choice: Traduzir como “contra”.
  alternative: Traduzir formalmente como “com”.
  rationale: 'O idioma ποιῆσαι τὸν πόλεμον μετά indica hostilidade no contexto: a besta, os reis e seus exércitos se reúnem para combater o cavaleiro e seu exército. A nota conserva a forma mais literal.'
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A ordem acumulativa do grego foi preservada, mas a pontuação portuguesa esclarece que reis e exércitos estão reunidos. Empregou-se “deles” para evitar a possível ambiguidade de “seus exércitos” e “seu exército” na mesma frase.
