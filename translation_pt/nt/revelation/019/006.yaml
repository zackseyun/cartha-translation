language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: pt
  text: 'E ouvi algo como a voz de uma grande multidão, como a voz de muitas águas e como a voz de fortes trovões, dizendo: “Aleluia! Pois o Senhor, o Deus, o Todo-Poderoso, reina.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o Senhor nosso Deus, o Todo-Poderoso”. O verbo grego também pode ser entendido como “reinou”, “passou a reinar” ou “começou a reinar”, celebrando a manifestação decisiva do reinado de Deus.
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: E ouvi
  rationale: O aoristo indicativo de ἀκούω descreve diretamente o que João ouviu na sequência da visão.
- source_word: ὡς φωνὴν ὄχλου πολλοῦ
  choice: algo como a voz de uma grande multidão
  rationale: A expressão preserva o valor comparativo de ὡς e o caráter visionário, sem afirmar uma identificação além do texto.
- source_word: ὡς φωνὴν ὑδάτων πολλῶν
  choice: como a voz de muitas águas
  rationale: Mantém a repetição retórica e a imagem bíblica tradicional de um som majestoso e avassalador.
- source_word: ὡς φωνὴν βροντῶν ἰσχυρῶν
  choice: como a voz de fortes trovões
  rationale: ἰσχυρός expressa força ou potência; “fortes trovões” é claro, vívido e natural em português.
- source_word: λεγόντων
  choice: dizendo
  rationale: Tradução direta do particípio que introduz o conteúdo da aclamação; sua forma plural concorda semanticamente com as vozes da multidão.
- source_word: Ἁλληλουϊά
  choice: Aleluia
  rationale: Forma litúrgica consagrada em português para a transliteração neotestamentária da expressão hebraica.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da aclamação e preserva o tom doxológico elevado.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: o Senhor, o Deus, o Todo-Poderoso
  rationale: Segue de perto o texto impresso do SBLGNT, inclusive sua construção aposicional, sem acrescentar o possessivo “nosso”, ausente desta forma textual.
- source_word: ἐβασίλευσεν
  choice: reina
  rationale: No contexto da aclamação, o aoristo celebra de modo decisivo o reinado de Deus. O presente português comunica naturalmente a proclamação sem impor que Deus apenas começou a reinar; alternativas possíveis são registradas em nota.
theological_decisions:
- issue: Sentido temporal e aspectual de ἐβασίλευσεν
  choice: reina
  alternative: reinou; passou a reinar; começou a reinar
  rationale: “Reina” expressa com naturalidade a aclamação da soberania divina manifestada decisivamente na cena. A nota preserva as possibilidades do aoristo sem decidir que a soberania de Deus teve início nesse momento.
- issue: Forma do título divino e variante com ἡμῶν
  choice: o Senhor, o Deus, o Todo-Poderoso
  alternative: o Senhor nosso Deus, o Todo-Poderoso; o Senhor Deus, o Todo-Poderoso
  rationale: A redação principal prioriza o SBLGNT fornecido, que não contém ἡμῶν (“nosso”). A forma variante é relevante e permanece documentada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência elevada adequada à aclamação apocalíptica. A repetição de “como a voz” preserva o paralelismo sonoro do grego; a construção “o Senhor, o Deus, o Todo-Poderoso” é deliberadamente formal por refletir a aposição do texto-fonte.
