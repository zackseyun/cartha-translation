id: REV.19.2
reference: Revelation 19:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his slaves from her hand.
translation:
  language: pt
  text: porque verdadeiros e justos são os seus julgamentos; porque ele julgou a grande prostituta, que corrompeu a terra com a sua imoralidade sexual, e vingou o sangue dos seus escravos da mão dela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo grego doulos pode significar “servo” ou “escravo”; “escravos” preserva aqui o sentido mais forte de pertencimento a um senhor.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: verdadeiros e justos
  rationale: Mantém os dois predicativos e o sentido de que os julgamentos de Deus correspondem à verdade e à justiça.
- source_word: κρίσεις
  choice: julgamentos
  rationale: Preserva o campo judicial e escatológico do plural grego em linguagem portuguesa corrente.
- source_word: ἔκρινεν
  choice: julgou
  rationale: O pretérito perfeito traduz naturalmente o aoristo e mantém o verbo mais amplo, sem explicitar além do texto a ideia de condenação.
- source_word: πόρνην τὴν μεγάλην
  choice: a grande prostituta
  rationale: É uma tradução moderna e direta de πόρνη, preservando a força da imagem sem recorrer a termos arcaicos ou mais vulgares.
- source_word: ἔφθειρεν
  choice: corrompeu
  rationale: No contexto da imoralidade sexual, exprime adequadamente a corrupção moral da terra, sem limitar o verbo à destruição física.
- source_word: τὴν γῆν
  choice: a terra
  rationale: Corresponde ao alcance cósmico habitual de γῆ em Apocalipse e evita uma localização indevida.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: com a sua imoralidade sexual
  rationale: Comunica o valor sexual de πορνεία em português atual e ainda permite sua dimensão metafórica no contexto do livro.
- source_word: ἐξεδίκησεν
  choice: vingou
  rationale: Expressa a execução de justiça em favor das vítimas, sem enfraquecer o sentido retributivo do verbo.
- source_word: τὸ αἷμα τῶν δούλων αὐτοῦ
  choice: o sangue dos seus escravos
  rationale: Escravos preserva o sentido forte de pertencimento a um senhor presente em δοῦλος; a alternativa mais branda é registrada em nota.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: das mãos dela
  rationale: Conserva o idioma bíblico da mão como agência ou responsabilidade, com ordem ajustada para clareza em português.
theological_decisions:
- issue: Tradução de δοῦλοι para os que pertencem a Deus
  choice: seus escravos
  alternative: seus servos
  rationale: A opção principal preserva a condição de pertencimento e sujeição expressa por δοῦλος, sem transformar o termo em uma designação meramente funcional; a alternativa idiomática é mantida em nota.
- issue: Dimensão literal e simbólica de πορνεία
  choice: imoralidade sexual
  alternative: prostituição
  rationale: A tradução mantém o referente sexual do termo sem decidir se a imagem deve ser entendida somente de modo literal ou como símbolo de infidelidade idólatra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “porque” reproduz a estrutura causal enfática do grego; “das mãos dela” conserva deliberadamente o idioma bíblico de agência e responsabilidade.
