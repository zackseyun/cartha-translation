id: REV.19.10
reference: Revelation 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow slave with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: pt
  text: 'E caí aos pés dele para adorá-lo. Mas ele me diz: “Não faça isso! Sou escravo como você e como seus irmãos[b][c], que têm o testemunho de Jesus[a]. Adore a Deus, pois o testemunho de Jesus é o espírito da profecia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “o testemunho de Jesus” pode significar “o testemunho a respeito de Jesus” ou “o testemunho dado pelo próprio Jesus”. A mesma ambiguidade se aplica à ocorrência no fim do versículo.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seus irmãos e irmãs”; aqui, “irmãos” pode representar o conjunto dos demais fiéis.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Sou seu conservo e conservo de seus irmãos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: me prostrei aos pés dele
  rationale: A expressão idiomática portuguesa comunica com naturalidade a postura física de prostração diante dos pés dele, sem tornar a frase artificial.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: para adorá-lo / Adore a Deus
  rationale: Neste contexto, o ato é recusado pelo anjo e dirigido exclusivamente a Deus; “adorar” expressa melhor a força religiosa de προσκυνέω do que apenas “inclinar-se”.
- source_word: Ὅρα μή
  choice: Não faça isso!
  rationale: A formulação breve e enfática reproduz a proibição abrupta do grego em português corrente.
- source_word: σύνδουλός
  choice: escravo junto com você
  rationale: Mantém a ideia de condição comum de escravidão e subordinação a Deus, evitando o pouco usual “coescravo” no texto principal.
- source_word: ἀδελφῶν σου
  choice: seus irmãos
  rationale: Preserva a forma masculina plural do texto grego; no contexto, ela pode representar o conjunto dos demais fiéis.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: que têm o testemunho de Jesus
  rationale: Traduz ἔχω diretamente por “ter” e mantém sem resolução a ambiguidade do genitivo Ἰησοῦ.
- source_word: μαρτυρία Ἰησοῦ
  choice: o testemunho de Jesus
  rationale: A expressão portuguesa, como a grega, permite tanto “testemunho a respeito de Jesus” quanto “testemunho dado por Jesus”; a mesma formulação é mantida nas duas ocorrências.
- source_word: πνεῦμα τῆς προφητείας
  choice: o espírito da profecia
  rationale: Preserva o termo teologicamente significativo πνεῦμα e evita reduzi-lo interpretativamente a “essência” ou “sentido” da profecia.
theological_decisions:
- issue: Sentido do genitivo em “o testemunho de Jesus”
  choice: Manter “o testemunho de Jesus” nas duas ocorrências
  alternative: “o testemunho a respeito de Jesus” ou “o testemunho dado por Jesus”
  rationale: O genitivo grego Ἰησοῦ admite genuinamente leitura objetiva ou subjetiva. A tradução principal conserva essa tensão, e a nota apresenta as duas possibilidades.
- issue: Tradução de σύνδουλος
  choice: “escravo junto com você”
  alternative: “seu conservo” ou “seu coescravo”
  rationale: A fala ressalta que o anjo está subordinado a Deus juntamente com João e os demais fiéis, não sendo objeto legítimo de adoração. “Escravo” preserva essa relação forte, enquanto a construção escolhida permanece natural em português.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O presente narrativo de λέγει foi mantido em “ele me diz”. A ordem e a concisão da repreensão foram preservadas, enquanto expressões pouco naturais como “diante dos pés” e “coescravo” foram evitadas no texto principal.
