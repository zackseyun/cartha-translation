id: REV.19.5
reference: Revelation 19:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his slaves, and those who fear him[b], the small and the great.”
translation:
  language: pt
  text: 'E do trono saiu uma voz, dizendo: “Louvem o nosso Deus, todos os seus escravos[a] e os que o temem[b], tanto os pequenos como os grandes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus servos”. A palavra grega δοῦλοι pode designar servos ou escravos, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que o reverenciam”. Nesse contexto, “temê-lo” expressa temor reverente e lealdade a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: uma voz
  rationale: Como a voz é apresentada como falando (λέγουσα), “voz” é a opção natural e contextual, em vez do sentido mais amplo “som”.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: do trono saiu
  rationale: Preserva tanto a origem indicada por ἀπό como o movimento expresso por ἐξέρχομαι, mantendo a imagem de uma voz que procede do trono.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Louvem o nosso Deus
  rationale: O imperativo plural é vertido diretamente por “Louvem”; em português, “louvar” rege objeto direto, sem necessidade de explicitar a preposição representada pelo dativo grego.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: todos os seus escravos
  rationale: “Escravos” conserva a força de δοῦλοι como pessoas pertencentes plenamente a Deus, enquanto a nota registra a alternativa contextual mais branda “servos”.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: os que o temem
  rationale: Mantém o idioma bíblico e sua tensão entre temor, reverência e lealdade, sem reduzi-lo apenas a respeito.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: tanto os pequenos como os grandes
  rationale: Reproduz a abrangência social do par grego em uma formulação portuguesa clara e natural.
theological_decisions:
- issue: Sentido de δοῦλοι no contexto de adoração e pertença a Deus
  choice: escravos
  alternative: servos
  rationale: A opção principal preserva a ideia forte de pertença e sujeição presente no termo grego. A alternativa “servos” é legítima em certos contextos, mas pode atenuar essa dimensão.
- issue: Sentido de temer a Deus
  choice: os que o temem
  alternative: os que o reverenciam
  rationale: A tradução principal conserva o idioma bíblico e sua amplitude sem resolver a tensão em favor de uma simples reverência; a nota esclarece o valor reverencial possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “E do trono saiu uma voz” conserva a ligação narrativa e destaca a origem da proclamação. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
