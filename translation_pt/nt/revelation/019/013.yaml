id: REV.19.13
reference: Revelation 19:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: pt
  text: Está vestido com um manto tingido de sangue[a], e o nome pelo qual é chamado é a Palavra de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manchado de sangue”. O verbo grego significa mais literalmente “mergulhar” ou “tingir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: está vestido com
  rationale: O particípio perfeito descreve o estado presente do personagem; a formulação é natural em português e preserva esse valor resultativo.
- source_word: ἱμάτιον
  choice: manto
  rationale: Designa uma veste exterior; “manto” combina com o contexto elevado e régio-guerreiro sem especificar excessivamente a peça.
- source_word: βεβαμμένον αἵματι
  choice: tingido de sangue
  rationale: O particípio de βάπτω traz a ideia básica de mergulhar ou tingir. “Tingido de sangue” preserva a imagem intensa e funciona naturalmente em português; a alternativa contextual “manchado de sangue” consta em nota.
- source_word: κέκληται
  choice: é chamado
  rationale: O perfeito passivo de καλέω expressa o nome pelo qual ele é conhecido; “é chamado” comunica de modo idiomático o estado resultante.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o nome pelo qual
  rationale: Integrado à construção “é chamado”, evita a formulação pouco natural “seu nome é chamado” e mantém explícita a referência ao nome.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: a Palavra de Deus
  rationale: Λόγος funciona aqui como título pessoal do cavaleiro, não apenas como “mensagem”; a inicial maiúscula sinaliza seu uso titular.
theological_decisions:
- issue: Título cristológico λόγος
  choice: a Palavra de Deus
  alternative: a mensagem de Deus
  rationale: O contexto apresenta ὁ Λόγος τοῦ Θεοῦ como nome ou título pessoal do cavaleiro. “A Palavra de Deus” conserva essa força e a provável ressonância joanina sem desenvolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar o pouco idiomático “seu nome é chamado”, sem eliminar a ênfase explícita no nome.
