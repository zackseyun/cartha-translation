source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: pt
  text: E os demais foram mortos pela espada daquele que está sentado no cavalo[a], a espada que saiu da sua boca[b]; e todas as aves se fartaram da carne deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram abatidos”.'
    reason: lexical_alternative
  - marker: b
    text: A espada que saiu da boca dele faz parte da linguagem figurada apocalíptica; compare Apocalipse 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: os demais
  rationale: Expressa naturalmente o grupo restante após o destino da besta e do falso profeta no contexto anterior.
- source_word: ἀπεκτάνθησαν
  choice: foram mortos
  rationale: Preserva a voz passiva do aoristo e emprega linguagem moderna e direta.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: pela espada
  rationale: Comunica o valor instrumental de ἐν com o dativo e mantém a imagem concreta recorrente em Apocalipse.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: daquele que estava montado no cavalo
  rationale: Representa claramente a construção participial e identifica de modo natural o cavaleiro sem substituir a formulação por uma interpretação.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: a espada que saía da sua boca
  rationale: Explicita que o particípio modifica 'espada' e conserva a vívida imagem apocalíptica; o imperfeito português descreve a característica apresentada pelo particípio.
- source_word: πάντα τὰ ὄρνεα
  choice: todas as aves
  rationale: Traduz o termo geral sem acrescentar 'de rapina', embora o contexto indique aves que comem carne.
- source_word: ἐχορτάσθησαν
  choice: se fartaram
  rationale: Transmite a ideia de comer até ficar plenamente satisfeito e é mais idiomático neste contexto do que uma tradução mecânica como 'foram enchidas'.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: da carne deles
  rationale: O singular coletivo 'carne' é natural em português, enquanto 'da' preserva adequadamente a relação de fonte ou alimento expressa por ἐκ.
theological_decisions:
- issue: Natureza da espada que sai da boca do cavaleiro
  choice: Conservar no texto a imagem concreta da espada que saía da sua boca.
  alternative: Interpretar explicitamente a espada como sua palavra ou seu juízo.
  rationale: O texto apresenta simbolismo apocalíptico sem explicá-lo aqui; a tradução preserva a imagem e a tensão interpretativa, em vez de definir seu significado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Os demais', 'foram mortos' e 'se fartaram' evitam tanto arcaísmo excessivo quanto paráfrase interpretativa. O ponto e vírgula separa com clareza a morte dos demais e o resultado para as aves.
