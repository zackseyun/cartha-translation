id: REV.19.7
reference: Revelation 19:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: pt
  text: Alegremo-nos e exultemos, e demos[a] glória a ele, pois chegou o casamento do Cordeiro, e a sua noiva[b] se preparou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e daremos glória a ele”. A forma grega está no futuro, embora aqui provavelmente tenha força exortativa, em paralelo com “alegremo-nos” e “exultemos”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “esposa”. A palavra grega γυνή pode significar “mulher”, “esposa” ou, em contexto de casamento, “noiva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: Alegremo-nos
  rationale: O presente do subjuntivo na primeira pessoa do plural tem força exortativa; a forma escolhida expressa naturalmente um chamado coletivo à alegria.
- source_word: ἀγαλλιῶμεν
  choice: exultemos
  rationale: Preserva a intensidade jubilosa do verbo e o distingue de χαίρωμεν, sem reduzir os dois termos a mera repetição.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: demos glória a ele
  rationale: Embora δώσομεν seja formalmente futuro do indicativo, o paralelismo com os dois subjuntivos exortativos favorece aqui a leitura como convocação litúrgica. A alternativa formal é registrada em nota.
- source_word: δόξαν
  choice: glória
  rationale: É a equivalência consagrada e semanticamente adequada no contexto de louvor e honra prestados a Deus.
- source_word: ἦλθεν
  choice: chegou
  rationale: O aoristo apresenta a chegada como fato consumado na proclamação visionária; o pretérito perfeito português comunica isso de modo direto.
- source_word: γάμος
  choice: casamento
  rationale: O termo pode designar casamento, cerimônia nupcial ou festa de casamento. “Casamento” mantém a amplitude básica sem antecipar a ceia mencionada no versículo seguinte.
- source_word: ἀρνίου
  choice: Cordeiro
  rationale: Mantém o título cristológico característico de Apocalipse, com inicial maiúscula por funcionar como designação titular.
- source_word: γυνὴ αὐτοῦ
  choice: a sua noiva
  rationale: γυνή pode significar mulher, esposa ou noiva. No contexto da chegada do casamento e da preparação nupcial, “noiva” é a opção mais natural, enquanto “esposa” permanece lexicalmente possível.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: se preparou
  rationale: Expressa com clareza e concisão o sentido reflexivo, preservando a participação da própria noiva em sua preparação.
theological_decisions:
- issue: Tradução de γυνὴ αὐτοῦ na imagem do casamento
  choice: a sua noiva
  alternative: a sua esposa
  rationale: A cena destaca a preparação para o casamento, o que favorece “noiva”. Como γυνή também pode significar “esposa”, a alternativa é preservada em nota, sem resolver além do necessário a tensão da imagem escatológica.
- issue: Força de δώσομεν na sequência exortativa
  choice: demos glória a ele
  alternative: daremos glória a ele
  rationale: A coordenação com “alegremo-nos” e “exultemos” sugere uma convocação unificada ao louvor. Como a forma grega é literalmente futura, a leitura preditiva é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. “Exultemos” conserva o tom elevado e jubiloso; “casamento” evita introduzir explicitamente a ideia de banquete antes do versículo seguinte. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
