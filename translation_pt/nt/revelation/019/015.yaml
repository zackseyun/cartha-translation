id: REV.19.15
reference: Revelation 19:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: pt
  text: E da sua boca sai uma espada afiada, para com ela ferir as nações; ele mesmo as pastoreará com uma vara de ferro[a]; e ele mesmo pisa o lagar do vinho do furor da ira de Deus, o Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as governará com uma vara de ferro”. O verbo grego significa literalmente “pastorear”, mas aqui também comunica governo régio, em alusão ao Salmo 2.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: sai
  rationale: Preserva o presente vívido e expressa naturalmente em português a ideia de algo que procede da boca.
- source_word: ῥομφαία ὀξεῖα
  choice: uma espada afiada
  rationale: Mantém a imagem clara e direta sem especificar além do necessário o tipo de espada.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: para com ela ferir
  rationale: Expressa a finalidade de ἵνα, o valor instrumental de ἐν αὐτῇ e o sentido judicial de πατάξῃ, sem acrescentar a ideia não explícita de derrubar.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Refere-se coletivamente às nações e evita restringir o termo aos gentios em contraste com os judeus.
- source_word: ποιμανεῖ
  choice: pastoreará
  rationale: Preserva a metáfora explícita do verbo grego e, ao mesmo tempo, sua força régia no contexto da alusão ao Salmo 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: com uma vara de ferro
  rationale: Traduz naturalmente o instrumental ἐν e conserva a formulação tradicional e reconhecível da imagem.
- source_word: πατεῖ
  choice: pisa
  rationale: Mantém o presente vívido e a ação própria da imagem do lagar.
- source_word: τὴν ληνὸν
  choice: o lagar
  rationale: Lagar é o termo português preciso e consagrado para a instalação onde uvas são pisadas ou prensadas.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: do vinho do furor da ira
  rationale: Conserva os genitivos acumulados e distingue os dois termos próximos, θυμός e ὀργή, preservando a intensidade retórica.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: de Deus, o Todo-Poderoso
  rationale: Trata παντοκράτωρ como título divino e reproduz claramente a aposição marcada pelos artigos gregos.
theological_decisions:
- issue: Sentido de ποιμανεῖ na alusão régia ao Salmo 2 em contexto de juízo
  choice: pastoreará
  alternative: governará
  rationale: O verbo significa literalmente pastorear, embora aqui inclua autoridade régia e judicial. A tradução conserva a tensão entre cuidado pastoral e governo coercivo; a alternativa interpretativa é registrada em nota.
- issue: Expressão intensificada θυμοῦ τῆς ὀργῆς
  choice: furor da ira
  alternative: ira ardente
  rationale: A opção principal mantém distintos os dois substantivos gregos e preserva a construção enfática, em vez de reduzi-los a uma única ideia.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e a repetição enfática de “ele mesmo” foram preservadas; “lagar” mantém a imagem profética tradicional sem arcaísmo excessivo.
