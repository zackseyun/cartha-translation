id: REV.21.19
reference: Revelation 21:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: pt
  text: 'Os fundamentos da muralha da cidade estavam adornados com toda espécie de pedra preciosa[a]: o primeiro fundamento era jaspe; o segundo, safira; o terceiro, calcedônia[b]; o quarto, esmeralda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com toda pedra preciosa”. A expressão grega pode ser entendida distributivamente, daí “toda espécie de pedra preciosa”.'
    reason: lexical_alternative
  - marker: b
    text: “Calcedônia” é a tradução tradicional do termo grego; a identificação exata de algumas pedras preciosas da Antiguidade é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ θεμέλιοι
  choice: os fundamentos
  rationale: O plural designa os fundamentos da muralha. “Os fundamentos” é natural em português e evita acrescentar a ideia mais específica de pedras individuais.
- source_word: τοῦ τείχους τῆς πόλεως
  choice: da muralha da cidade
  rationale: “Muralha” expressa com naturalidade o muro defensivo que circunda uma cidade, enquanto “cidade” é o equivalente corrente de πόλις neste contexto.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: com toda espécie de pedra preciosa
  rationale: A formulação comunica de modo natural a possível força distributiva da expressão grega, sem excluir na nota a leitura mais literal “com toda pedra preciosa”.
- source_word: κεκοσμημένοι
  choice: estavam adornados
  rationale: O particípio perfeito passivo descreve o estado resultante dos fundamentos, já embelezados; “estavam adornados” preserva esse aspecto e o tom elevado.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: o primeiro fundamento
  rationale: Mantém o substantivo singular da enumeração sem tornar explícita a interpretação mais específica “pedra de fundamento”.
- source_word: ἴασπις
  choice: jaspe
  rationale: É o equivalente tradicional e lexicalmente estabelecido em português.
- source_word: σάπφιρος
  choice: safira
  rationale: É o equivalente português corrente do nome da pedra.
- source_word: χαλκηδών
  choice: calcedônia
  rationale: Forma tradicional em português para o termo grego, cuja identificação mineralógica antiga não é inteiramente segura.
- source_word: σμάραγδος
  choice: esmeralda
  rationale: É o equivalente tradicional e mais provável do termo grego.
theological_decisions:
- issue: Interpretação simbólica da lista de pedras na descrição apocalíptica
  choice: Traduzir diretamente os nomes das pedras, sem explicar no texto principal qualquer simbolismo.
  alternative: Relacionar explicitamente cada pedra às tribos de Israel, aos apóstolos ou às vestes sacerdotais.
  rationale: O versículo apresenta as pedras como adornos, mas não interpreta seu significado. A tradução preserva a imagem e evita introduzir um esquema teológico não expresso no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Muralha” foi preferido a “muro” por se ajustar naturalmente à fortificação de uma cidade. Os pontos e vírgulas tornam clara a enumeração sem alterar sua estrutura.
