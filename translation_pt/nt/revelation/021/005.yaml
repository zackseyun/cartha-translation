source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: pt
  text: 'E aquele que está sentado no trono disse: “Eis que faço novas todas as coisas.” E disse: “Escreva, pois estas palavras são dignas de confiança e verdadeiras.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: aquele que estava sentado no trono
  rationale: Preserva a identificação do falante pela imagem de entronização e traduz o particípio de modo natural em português, no quadro narrativo introduzido pelo aoristo εἶπεν.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém a força solene de chamada à atenção própria do discurso apocalíptico, sem recorrer ao mais coloquial “Veja”.
- source_word: καινὰ ποιῶ πάντα
  choice: faço novas todas as coisas
  rationale: Conserva a ordem predicativa e a abrangência de πάντα, enquanto “faço” traduz o presente sem decidir indevidamente entre ação em curso e declaração de validade geral.
- source_word: Γράψον
  choice: Escreva
  rationale: Reproduz diretamente o imperativo aoristo sem acrescentar um objeto ausente no grego.
- source_word: ὅτι
  choice: pois
  rationale: Exprime naturalmente em português a relação explicativa ou causal entre a ordem de escrever e a confiabilidade das palavras.
- source_word: οὗτοι οἱ λόγοι
  choice: estas palavras
  rationale: Tradução direta e corrente para a mensagem ou as declarações mencionadas no contexto.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: dignas de confiança e verdadeiras
  rationale: “Dignas de confiança” expressa de modo idiomático πιστοί quando qualifica palavras; “verdadeiras” preserva diretamente ἀληθινοί e a dupla afirmação do original.
theological_decisions:
- issue: Escopo e natureza da renovação escatológica em καινὰ ποιῶ πάντα
  choice: faço novas todas as coisas
  alternative: estou fazendo tudo novo
  rationale: A formulação mantém a abrangência total e não decide se a novidade consiste em transformação, renovação ou substituição. O presente “faço” também preserva a ambiguidade aspectual possível em português.
- issue: Identidade do falante divino
  choice: aquele que estava sentado no trono
  alternative: o que está sentado no trono
  rationale: Identifica o falante somente pela imagem do trono fornecida pelo texto, sem acrescentar uma especificação doutrinária.
- issue: Valor de ὅτι após o imperativo
  choice: pois
  alternative: porque
  rationale: “Pois” permite a leitura explicativa ou causal e evita tornar a relação lógica mais estreita do que o grego exige.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a dignidade apocalíptica sem arcaísmos desnecessários. Não foram incluídas notas porque as alternativas relevantes podem ser registradas nas decisões editoriais sem exigir marcador no texto.
