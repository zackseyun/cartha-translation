id: REV.21.1
reference: Revelation 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: pt
  text: E vi um novo céu e uma nova terra, pois o primeiro céu e a primeira terra[a] passaram, e o mar já não existe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o céu anterior e a terra anterior”. O grego diz literalmente “o primeiro céu e a primeira terra”, expressão que pode indicar a ordem anterior em contraste com a nova.
    reason: lexical_alternative
  - marker: b
    text: A afirmação pode ser entendida literalmente. No Apocalipse, porém, o mar também pode evocar caos, perigo ou separação.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo indicativo de ὁράω funciona aqui como verbo narrativo simples; “vi” é direto, natural e fiel.
- source_word: οὐρανὸν ... γῆν
  choice: céu ... terra
  rationale: No contexto cósmico da visão, o par designa a ordem criada, e não apenas o céu visível e o solo.
- source_word: καινὸν ... καινήν
  choice: novo ... nova
  rationale: Preserva a ideia de novidade sem decidir se se trata de substituição completa ou de transformação da criação.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: o primeiro céu e a primeira terra
  rationale: “Primeiro” reproduz diretamente πρῶτος e mantém o contraste com a nova ordem; “anterior” seria possível, mas mais interpretativo.
- source_word: ἀπῆλθαν
  choice: passaram
  rationale: Neste contexto, o verbo indica que a ordem anterior deixou de estar presente. “Passaram” é idiomático e conserva a imagem sem explicá-la em excesso.
- source_word: ἡ θάλασσα
  choice: o mar
  rationale: É o equivalente concreto e direto de θάλασσα; possíveis associações simbólicas pertencem à nota, não ao texto principal.
- source_word: οὐκ ἔστιν ἔτι
  choice: já não existe
  rationale: Expressa com clareza a negação presente acompanhada de ἔτι, isto é, que o mar não existe mais.
theological_decisions:
- issue: Natureza do novo céu e da nova terra
  choice: Traduzir καινός por “novo” sem definir o modo dessa novidade.
  alternative: Explicitar uma substituição total ou uma renovação da criação existente.
  rationale: O versículo afirma a novidade da criação, mas não resolve por si só se ela ocorre por substituição ou transformação.
- issue: Sentido da inexistência do mar
  choice: Manter a referência concreta ao mar no texto principal.
  alternative: Interpretá-la explicitamente como eliminação do caos, do mal, do perigo ou da separação.
  rationale: A imagem pode ter ressonâncias simbólicas no Apocalipse, mas o texto não as explicita nesta frase; a tradução deve preservar tanto a leitura literal quanto a possibilidade simbólica.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa direta. “Já não existe” evita uma formulação excessivamente literária e comunica naturalmente o valor de οὐκ ἔστιν ἔτι. Os marcadores foram colocados junto às expressões que as notas explicam.
