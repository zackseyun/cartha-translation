id: REV.21.16
reference: Revelation 21:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: pt
  text: 'A cidade tem forma quadrada[b], e seu comprimento é igual à sua largura. Ele mediu a cidade com a vara de medir[c]: doze mil estádios[a]. Seu comprimento, sua largura e sua altura são iguais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um estádio era uma antiga unidade de distância. Doze mil estádios correspondem aproximadamente a 2.220 quilômetros, dependendo do valor exato atribuído ao estádio.
    reason: cultural_note
  - marker: b
    text: Ou, de modo mais interpretativo, «a cidade é um cubo perfeito». O grego declara diretamente que seu comprimento, sua largura e sua altura são iguais.
    reason: alternative_reading
  - marker: c
    text: Ou «com a cana». O termo grego pode significar «cana», mas aqui se refere a um instrumento de medição.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετράγωνος
  choice: tem forma quadrada
  rationale: Expressa claramente a forma de quatro lados iguais em português atual, preservando a descrição arquitetônica sem antecipar a inferência tridimensional de um cubo.
- source_word: κεῖται
  choice: tem forma
  rationale: No contexto da configuração da cidade, a expressão portuguesa comunica de modo natural como ela se apresenta ou está disposta, evitando o pouco idiomático «jaz quadrada».
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: seu comprimento é igual à sua largura
  rationale: ὅσον indica igualdade de extensão; esta formulação é clara, direta e idiomática.
- source_word: ἐμέτρησεν
  choice: mediu
  rationale: Verte diretamente o aoristo narrativo; o sujeito masculino é recuperado do contexto imediato.
- source_word: τῷ καλάμῳ
  choice: com a vara de medir
  rationale: Embora κάλαμος possa significar «cana», aqui designa um instrumento de medição; a tradução explicita sua função sem alterar o referente.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: doze mil estádios
  rationale: Apresenta o resultado da medição de modo idiomático e conserva tanto o número quanto a antiga unidade do texto grego.
- source_word: στάδιος
  choice: estádios
  rationale: É a forma portuguesa tradicional e transparente para a antiga unidade de distância, preferível a uma conversão aproximada no corpo do texto.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Seu comprimento, sua largura e sua altura são iguais
  rationale: Mantém a afirmação explícita do grego sobre a igualdade das três dimensões, sem substituí-la pela interpretação geométrica «cubo».
theological_decisions:
- issue: Conservar a unidade antiga ou convertê-la no texto principal
  choice: Conservar «doze mil estádios»
  alternative: Cerca de 2.220 quilômetros
  rationale: O texto grego apresenta a medida em estádios; equivalentes modernos são aproximados e dependem do valor atribuído ao estádio, por isso ficam em nota.
- issue: Explicitar a forma tridimensional da cidade
  choice: Afirmar que comprimento, largura e altura são iguais
  alternative: A cidade é um cubo perfeito
  rationale: A forma cúbica é uma inferência legítima, mas o grego enuncia diretamente apenas a igualdade das três dimensões. A tradução preserva essa formulação e deixa a interpretação em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vara de medir» mantém o caráter concreto do instrumento; «estádios» conserva a unidade histórica, explicada em nota. Os marcadores foram colocados junto aos termos ou afirmações a que suas respectivas notas se referem.
