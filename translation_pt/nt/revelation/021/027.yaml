review_pass:
  verdict: revise
  source_fidelity: A tradução conserva a negação enfática de οὐ μή («jamais»), a referência à cidade («nela»), a dupla abrangência de πᾶν κοινόν e do particípio substantivado ποιῶν, e a exceção exclusiva para os registrados no livro da vida do Cordeiro. «Ou» é uma formulação portuguesa natural para as categorias coordenadas por καί neste contexto, sem eliminar nenhuma delas.
  naturalness: «Coisa alguma impura» é compreensível, mas «nada impuro» é mais corrente no português moderno. Sobretudo, «os que estão escritos» soa semanticamente anômalo em português, pois pessoas não são normalmente descritas como “escritas”; «os inscritos» é idiomático e mantém o sentido passivo de registro sem acrescentar explicitamente «nomes».
  terminology: «Impuro», «abominável», «falso», «livro da vida» e «Cordeiro» são escolhas adequadas e consistentes com o registro apocalíptico. A nota b deve corrigir «pratique», que tem forma de subjuntivo/imperativo e não representa literalmente o particípio grego; «que pratica» é apropriado.
  issues:
  - severity: medium
    issue: «os que estão escritos»
    rationale: Embora siga superficialmente o particípio γεγραμμένοι, a expressão é pouco idiomática e semanticamente estranha em português. «Os inscritos» traduz naturalmente o estado de terem sido registrados, sem introduzir «nomes».
  - severity: low
    issue: Redação da nota b
    rationale: «Pratique» não é uma citação literal adequada do particípio ποιῶν. A nota deve dizer «que pratica abominação e falsidade».
  - severity: low
    issue: «coisa alguma impura»
    rationale: A construção é possível, mas «nada impuro» é mais natural e igualmente abrangente para πᾶν κοινόν.
