id: REV.21.27
reference: Revelation 21:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: pt
  text: E jamais entrará nela nada impuro[a], nem ninguém que pratique o que é abominável ou falso[b], mas somente os inscritos no livro da vida do Cordeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «profano» ou «contaminado», para «impuro» (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «que pratica abominação e falsidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: jamais entrará
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação enfática; «jamais entrará» comunica com naturalidade a exclusão absoluta e a perspectiva futura.
- source_word: αὐτὴν
  choice: nela
  rationale: O pronome retoma a cidade, a Nova Jerusalém. «Nela» é natural em português e não força personificação adicional.
- source_word: πᾶν κοινὸν
  choice: coisa alguma impura
  rationale: O neutro singular com πᾶν tem sentido abrangente, «nada/coisa alguma». Neste contexto, κοινός designa o que é impuro, profanado ou impróprio diante de Deus.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: quem pratique o que é abominável ou falso
  rationale: O particípio substantivado aponta para a pessoa caracterizada por tais atos. A formulação idiomática preserva as duas categorias do grego sem o português pouco natural «fazer abominação e falsidade».
- source_word: εἰ μὴ
  choice: mas somente
  rationale: A expressão introduz a única exceção à exclusão anterior; «mas somente» torna claro o contraste restritivo.
- source_word: οἱ γεγραμμένοι
  choice: os que estão escritos
  rationale: O particípio perfeito passivo indica o estado resultante de terem sido registrados. Mantém-se a formulação do grego sem acrescentar explicitamente «nomes».
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς
  choice: no livro da vida
  rationale: É uma tradução exata e consagrada de βιβλίον neste contexto apocalíptico.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: Preserva o genitivo e o título cristológico central do Apocalipse; a construção portuguesa também permite a ligação direta com «livro da vida».
theological_decisions:
- issue: Alcance da exclusão da Nova Jerusalém
  choice: Distinguir «coisa alguma impura» de «quem pratique o que é abominável ou falso».
  alternative: Entender a primeira expressão apenas como impureza impessoal e a segunda como referência separada a pessoas.
  rationale: O grego combina uma expressão neutra abrangente com um particípio substantivado referente a pessoas; a tradução conserva ambas as dimensões sem as fundir.
- issue: Objeto implícito de «escritos»
  choice: Traduzir «os que estão escritos», sem inserir «nomes».
  alternative: «aqueles cujos nomes estão escritos»
  rationale: A imagem do livro implica o registro de nomes, mas «nomes» não aparece explicitamente neste versículo; a tradução preserva a concisão e a ambiguidade formal do original.
- issue: Relação de «do Cordeiro»
  choice: Manter «no livro da vida do Cordeiro».
  alternative: «no livro do Cordeiro, o livro da vida»
  rationale: A sequência portuguesa acompanha a cadeia genitiva grega sem decidir além do necessário se «do Cordeiro» qualifica mais diretamente «livro» ou a expressão inteira «livro da vida».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Jamais entrará» preserva a ênfase; «coisa alguma» evita uma leitura exclusivamente pessoal da primeira expressão; «pratique» comunica ação habitual ou caracterizadora sem linguagem excessivamente técnica.
