revisions:
- from: E jamais entrará nela coisa alguma impura[a], nem quem pratique o que é abominável ou falso[b], mas somente os que estão escritos no livro da vida do Cordeiro.
  to: E jamais entrará nela nada impuro[a], nem ninguém que pratique o que é abominável ou falso[b], mas somente os inscritos no livro da vida do Cordeiro.
  rationale: A revisão melhora a idiomaticidade do português sem alterar o alcance da exclusão nem explicitar indevidamente o objeto implícito do registro. Também corrige a forma verbal da nota literal para refletir o particípio grego.
