  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: pt
  text: E levarão para dentro dela a glória e a honra das nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἴσουσιν
  choice: levarão
  rationale: O futuro ativo de φέρω indica transportar algo para dentro da cidade. Em português, “levarão para ela” expressa naturalmente esse movimento em direção ao referente já mencionado.
- source_word: δόξαν
  choice: glória
  rationale: “Glória” preserva tanto o sentido honorífico quanto a ressonância bíblico-teológica de δόξα, sem restringi-lo ao esplendor visual.
- source_word: τιμὴν
  choice: honra
  rationale: “Honra” é o equivalente direto e forma com “glória” um par natural, mantendo aberta a possibilidade contextual de homenagem, estima ou tributo.
- source_word: τῶν ἐθνῶν
  choice: das nações
  rationale: “Nações” representa o sentido amplo de ἔθνη neste cenário e evita introduzir uma oposição específica entre judeus e gentios.
- source_word: εἰς αὐτήν
  choice: para ela
  rationale: A preposição εἰς marca movimento para dentro ou em direção à cidade. “Para ela” é idiomático em português e conserva o pronome feminino, apropriado tanto ao substantivo “cidade” quanto à personificação da Nova Jerusalém.
- source_word: καὶ
  choice: E
  rationale: A conjunção liga o versículo à descrição anterior. O segundo καί é expresso naturalmente pela coordenação “glória e honra”.
theological_decisions:
- issue: Referente e personificação de αὐτήν
  choice: “Para ela”, referindo-se à Nova Jerusalém, preserva o feminino do texto grego e soa natural porque “cidade” também é feminino em português.
  alternative: “Para dentro dela”, tornando mais explícito o movimento para o interior da cidade.
  rationale: O português permite manter a referência feminina sem estranheza. A formulação escolhida preserva a personificação da cidade, mas não exige que ela seja interpretada além de seu referente gramatical e contextual.
- issue: Sentido da “glória e honra das nações”
  choice: A expressão permanece ampla, sem definir se denota riquezas, esplendor cultural, características redimidas ou tributo.
  alternative: “O esplendor e as riquezas das nações” ou “a honra prestada pelas nações”.
  rationale: A expressão grega admite várias nuances, e o contexto não obriga a escolher uma interpretação escatológica específica. A tradução literal e natural preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para “levarão para ela”, evitando a possível leitura momentânea de que a glória e a honra seriam levadas para outro lugar, sem perder o sentido de movimento de εἰς.
