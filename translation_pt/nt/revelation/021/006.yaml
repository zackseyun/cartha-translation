id: REV.21.6
reference: Revelation 21:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: pt
  text: 'E ele me disse: “Estas coisas se cumpriram.[a] Eu sou o Alfa e o Ômega, o princípio e o fim. A quem tem sede darei gratuitamente[b] da fonte da água da vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente, “Está feito”. O verbo grego está no plural: “elas aconteceram” ou “estas coisas se cumpriram”.'
    reason: alternative_reading
  - marker: b
    text: Ou “sem custo” ou “como presente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Estas coisas se cumpriram
  rationale: O perfeito ativo plural de γίνομαι pede uma formulação que preserve a pluralidade. “Estas coisas” explicita o sujeito implícito, e “se cumpriram” expressa que as realidades anunciadas chegaram à concretização, sem reduzi-las ao singular tradicional.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: o Alfa e o Ômega
  rationale: Mantém os nomes das letras gregas como títulos simbólicos já estabelecidos em Apocalipse; a expressão seguinte esclarece seu alcance.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: o princípio e o fim
  rationale: Tradução direta e natural que conserva tanto a dimensão temporal quanto a possível dimensão de origem e finalidade, sem resolver a tensão por paráfrase.
- source_word: τῷ διψῶντι
  choice: a quem tem sede
  rationale: Forma idiomática e inclusiva em português para o particípio substantivado singular, preservando o caráter pessoal da promessa.
- source_word: δώσω
  choice: darei
  rationale: Reproduz diretamente o futuro da promessa.
- source_word: ἐκ τῆς πηγῆς
  choice: da fonte
  rationale: “Fonte” é natural em português e descreve adequadamente uma nascente ou manancial de água.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: da água da vida
  rationale: Preserva a construção genitiva e a imagem bíblica tradicional sem convertê-la em paráfrase explicativa.
- source_word: δωρεάν
  choice: gratuitamente
  rationale: Comunica com clareza que a dádiva é concedida sem pagamento; a nota registra a alternativa idiomática “como presente”.
theological_decisions:
- issue: Declaração divina Γέγοναν e sua forma plural
  choice: Estas coisas se cumpriram
  alternative: Está feito
  rationale: A forma verbal grega é plural e aponta para as realidades anunciadas que se concretizaram. A tradução escolhida preserva esse dado, em vez de nivelá-lo à fórmula singular tradicional.
- issue: Manutenção da imagem Alfa e Ômega como título divino
  choice: o Alfa e o Ômega
  alternative: o A e o Z
  rationale: Conservar os nomes das letras gregas preserva a imagem própria de Apocalipse e sua ressonância canônica, enquanto “o princípio e o fim” fornece a explicação no próprio texto.
- issue: Caráter gratuito da água da vida
  choice: gratuitamente
  alternative: como presente
  rationale: A opção principal ressalta a ausência de custo sem definir além do texto a natureza teológica da dádiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada em “A quem tem sede darei” para soar natural e manter em destaque o beneficiário da promessa. Os marcadores de nota aparecem imediatamente após as expressões pertinentes.
