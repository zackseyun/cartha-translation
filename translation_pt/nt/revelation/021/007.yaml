  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: pt
  text: Quem vencer herdará estas coisas[a], e eu serei o seu Deus, e ele será meu filho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem conquistar”. O verbo grego νικάω é recorrente no Apocalipse para indicar vencer ou prevalecer com fidelidade.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega o termo masculino “filho”. O masculino provavelmente tem aqui força representativa, mas a tradução preserva a linguagem filial do texto-fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Quem vencer
  rationale: O particípio presente substantivado designa a pessoa caracterizada por vencer ou permanecer vitoriosa. “Quem vencer” é natural em português e mantém a linguagem recorrente de νικάω no Apocalipse.
- source_word: κληρονομήσει
  choice: herdará
  rationale: Preserva diretamente a ideia de receber por herança e suas ressonâncias familiares e pactuais, reforçadas pela relação entre Deus e filho na segunda oração.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Representa com precisão o demonstrativo neutro plural, remetendo ao conteúdo da visão precedente sem o ampliar explicitamente para “tudo isto”.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: eu serei o seu Deus
  rationale: Expressa de modo idiomático em português a força relacional do dativo αὐτῷ e preserva a fórmula pactual.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: ele será meu filho
  rationale: É a formulação portuguesa mais natural para a construção grega e mantém tanto a relação pessoal quanto a imagem filial ligada à herança.
- source_word: υἱός
  choice: filho
  rationale: Conserva o substantivo masculino singular da fonte e a imagem bíblica de filiação e herança; sua possível força representativa é esclarecida em nota, sem neutralizar o texto principal.
theological_decisions:
- issue: Linguagem filial masculina numa promessa formulada genericamente para quem vence
  choice: Manter “filho” no texto principal
  alternative: filho ou filha; descendente; criança
  rationale: O grego emprega explicitamente υἱός, “filho”, e a imagem masculina se relaciona à linguagem de herança. Embora provavelmente tenha força representativa, substituí-la por um termo neutro reduziria a precisão e enfraqueceria a imagem filial.
- issue: Eco da fórmula pactual
  choice: “eu serei o seu Deus, e ele será meu filho”
  alternative: “eu lhe serei Deus, e ele me será filho”
  rationale: A opção escolhida preserva a relação pactual e filial em português atual e natural, sem acrescentar uma interpretação doutrinária ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe mantém o paralelismo solene do original, enquanto “Quem vencer” evita uma formulação excessivamente arcaica.
