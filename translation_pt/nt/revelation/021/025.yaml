id: REV.21.25
reference: Revelation 21:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: pt
  text: E os seus portões jamais se fecharão de dia, pois ali não haverá noite.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «os seus portões de modo algum se fecharão de dia». O grego emprega uma negação enfática.'
    reason: lexical_alternative
  - marker: b
    text: A razão apresentada é que «ali não haverá noite».
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que liga o versículo à descrição anterior da cidade.
- source_word: οἱ πυλῶνες αὐτῆς
  choice: os seus portões
  rationale: No contexto urbano, πυλῶνες designa os portões ou complexos de entrada da cidade. O possessivo mantém a referência natural à Nova Jerusalém sem introduzir personificação desnecessária.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: jamais se fecharão
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa uma negação futura enfática; «jamais» comunica essa força em português atual.
- source_word: ἡμέρας
  choice: de dia
  rationale: O genitivo tem valor adverbial temporal. «De dia» é natural e preserva o contraste explícito com a noite.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: pois ali não haverá noite
  rationale: «Pois» preserva a função explicativa de γάρ, e «não haverá noite» transmite naturalmente o sentido existencial de οὐκ ἔσται.
theological_decisions:
- issue: Grau de personificação da Nova Jerusalém
  choice: Usar «os seus portões», com referência gramatical à cidade sem personificação marcada.
  alternative: «os portões dela» ou uma formulação que destaque a cidade como figura feminina
  rationale: αὐτῆς concorda com o substantivo grego feminino referente à cidade, mas isso não exige acentuar aqui a imagem nupcial. O foco da frase é a abertura permanente dos portões e a inexistência da noite.
- issue: Relação lógica entre a abertura dos portões e a ausência de noite
  choice: Traduzir γάρ por «pois», apresentando a ausência de noite como razão explicativa.
  alternative: Usar apenas uma justaposição ou travessão, sem traduzir explicitamente γάρ.
  rationale: A partícula grega introduz de modo explícito a explicação para os portões nunca serem fechados; «pois» preserva essa relação sem ampliar sua interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Jamais se fecharão» conserva a ênfase da negação grega sem soar excessivamente técnico; «ali» evita a repetição menos fluida de «lá» e mantém a referência à cidade.
