  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: pt
  text: No lado leste[a], três portões; e no lado norte, três portões; e no lado sul, três portões; e no lado oeste, três portões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Do leste... do norte... do sul... do oeste”. Aqui, a expressão foi traduzida de modo idiomático para indicar o lado em que os portões estão localizados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: no lado leste
  rationale: A preposição ἀπό é literalmente “de”, mas, nesta descrição esquemática, a expressão indica o lado da cidade onde ficam os portões. “No lado leste” comunica essa localização com naturalidade em português.
- source_word: πυλῶνες
  choice: portões
  rationale: πυλών pode designar um portão ou uma entrada monumental. “Portões” é claro, concreto e adequado às entradas da muralha da cidade.
- source_word: τρεῖς
  choice: três
  rationale: Tradução direta do numeral cardinal, repetido em cada direção para conservar a simetria medida do texto grego.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: no lado norte / no lado sul / no lado oeste
  rationale: As expressões são vertidas de modo uniforme como indicações da localização dos portões nos quatro lados da cidade.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: estrutura coordenada repetitiva, com “e” antes do último membro
  rationale: A repetição dos quatro segmentos e de “três portões” preserva o ritmo enumerativo e a simetria do original; o uso português de “e” no último segmento mantém a coordenação sem produzir artificialidade.
theological_decisions:
- issue: Descrição espacial dos portões da Nova Jerusalém
  choice: Enumeração arquitetônica direta de três portões em cada um dos quatro lados
  alternative: Explicitar possíveis alusões simbólicas à disposição das tribos de Israel ou à cidade-templo de Ezequiel
  rationale: O versículo apenas distribui os portões pelas quatro direções. A tradução deixa possíveis associações canônicas abertas à interpretação, sem inseri-las no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura concisa e repetitiva conserva o caráter solene, ordenado e simétrico do original.
