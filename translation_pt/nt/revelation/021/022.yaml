id: REV.21.22
reference: Revelation 21:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: pt
  text: E não vi templo algum nela[a], pois o Senhor Deus, o Todo-Poderoso, é o templo dela, e o Cordeiro também.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuário”. O termo grego ναός pode referir-se mais especificamente ao santuário interior do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: templo
  rationale: “Templo” é a tradução mais clara e natural no contexto, preservando o contraste entre a ausência de um edifício cultual na cidade e o próprio Deus, juntamente com o Cordeiro, como seu templo. O termo grego pode designar mais especificamente o santuário interior.
- source_word: οὐκ εἶδον
  choice: não vi ... algum
  rationale: Expressa diretamente a negação com o aoristo de ὁράω e ressalta, em português natural, a ausência completa de templo.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome retoma a cidade, palavra feminina tanto em grego como em português; “nela” é natural e mantém a referência explícita.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: o Senhor Deus, o Todo-Poderoso
  rationale: Mantém os títulos divinos e sua sequência apositiva. “Todo-Poderoso” é a forma consagrada e inteligível para παντοκράτωρ.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: é o templo dela
  rationale: Preserva o verbo singular do grego e deixa inequívoco que o templo pertence à cidade, evitando a possível ambiguidade de “seu templo” em português.
- source_word: καὶ τὸ ἀρνίον
  choice: e o Cordeiro também
  rationale: O acréscimo de “também” torna natural em português a coordenação elíptica, deixando subentendido “é o templo dela” sem transformar o verbo grego singular em plural.
theological_decisions:
- issue: Relação sintática entre “o Senhor Deus, o Todo-Poderoso” e “o Cordeiro” como templo da cidade
  choice: 'Manter o predicado singular expresso com Deus e coordenar elipticamente o Cordeiro: “é o templo dela, e o Cordeiro também”'
  alternative: 'Empregar sujeito composto e verbo plural: “o Senhor Deus, o Todo-Poderoso, e o Cordeiro são o templo dela”'
  rationale: O grego traz ἐστιν no singular antes do acréscimo καὶ τὸ ἀρνίον. A formulação escolhida conserva essa estrutura marcada, ao mesmo tempo que comunica que o Cordeiro também é o templo da cidade, sem diluir a força coordenativa de καί nem impor uma reformulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Templo algum” reforça naturalmente a ausência; “dela” retoma a cidade com clareza. A elipse final preserva a sintaxe e a tensão teológica do grego sem soar arcaica.
