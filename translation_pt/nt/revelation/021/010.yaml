id: REV.21.10
reference: Revelation 21:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: pt
  text: E ele me levou, no Espírito[a], a um monte grande e alto, e me mostrou a cidade santa, Jerusalém, descendo do céu, da parte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em espírito”. A expressão grega pode indicar um estado visionário; em Apocalipse, ela costuma introduzir uma visão profética.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: me levou
  rationale: No contexto visionário, o aoristo de ἀποφέρω descreve o transporte de João para outro ponto de observação. “Me levou” é natural em português e mantém a ideia de deslocamento sem sugerir necessariamente transporte físico.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: Em Apocalipse, a expressão introduz repetidamente uma experiência profética visionária. A inicial maiúscula expressa a provável ação do Espírito Santo, enquanto a nota preserva a possibilidade lexical de “em espírito”.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: a um monte grande e alto
  rationale: ἐπί com acusativo indica aqui movimento para um lugar. A construção é idiomática em português e conserva os dois adjetivos distintos, μέγα e ὑψηλόν.
- source_word: ἔδειξέν μοι
  choice: me mostrou
  rationale: Tradução direta e natural de δείκνυμι, sem acrescentar uma noção explicativa de revelação que o verbo não exige por si só.
- source_word: τὴν πόλιν τὴν ἁγίαν
  choice: a cidade santa
  rationale: Mantém a identificação e a qualificação da cidade em linguagem bíblica corrente e clara.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Adota a forma portuguesa convencional do nome geográfico, em aposição a “a cidade santa”.
- source_word: καταβαίνουσαν
  choice: descendo
  rationale: O particípio presente apresenta a cidade durante o movimento de descida. “Descendo” preserva de modo conciso essa simultaneidade e imagem dinâmica.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Expressa a origem da descida indicada por ἐκ de modo natural em português.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: da parte de Deus
  rationale: Indica Deus como fonte ou origem, preservando a distinção em relação a ἐκ τοῦ οὐρανοῦ e evitando a repetição pouco elegante de “de”.
theological_decisions:
- issue: Referente de πνεῦμα na fórmula visionária ἐν πνεύματι
  choice: “no Espírito”, entendendo como provável referência à atuação do Espírito Santo
  alternative: “em espírito”, indicando de modo não específico um estado espiritual ou o espírito de João
  rationale: O uso recorrente da fórmula em Apocalipse favorece a ação do Espírito na experiência profética. A tradução principal sinaliza essa leitura provável, mas a nota mantém aberta a ambiguidade genuína do grego, sem parafrasear como “pelo Espírito Santo”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o movimento da visão; “monte grande e alto” conserva ambos os qualificativos, e “da parte de Deus” distingue naturalmente as duas expressões gregas de origem.
