id: REV.21.4
reference: Revelation 21:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: pt
  text: E ele enxugará dos olhos deles toda lágrima[a]. A morte já não existirá; não haverá mais luto, nem clamor[b], nem dor. As coisas anteriores passaram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “todas as lágrimas”. O singular grego tem sentido distributivo: “toda lágrima”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “grito”. A palavra grega pode indicar um grito ou forte clamor.
    reason: lexical_alternative
  - marker: c
    text: Ou “As primeiras coisas passaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: enxugará
  rationale: Com lágrimas como objeto, ἐξαλείφω indica removê-las dos olhos; “enxugará” é natural, pessoal e preserva a imagem concreta.
- source_word: πᾶν δάκρυον
  choice: toda lágrima
  rationale: O singular com πᾶν tem sentido distributivo, destacando cada lágrima individualmente.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: dos olhos deles
  rationale: Expressa de modo idiomático em português a remoção das lágrimas a partir dos olhos, sem alterar o referente plural.
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: A morte já não existirá
  rationale: Comunica a cessação completa e definitiva da morte, mantendo a força categórica da construção grega.
- source_word: πένθος
  choice: luto
  rationale: Designa pesar ou lamentação, especialmente diante da morte; “luto” é conciso e adequado à sequência.
- source_word: κραυγή
  choice: clamor
  rationale: Preserva a ideia de grito ou brado audível melhor que uma formulação restrita ao ato de chorar, sem definir se se trata de protesto ou lamentação.
- source_word: πόνος
  choice: dor
  rationale: É o equivalente mais direto no contexto da eliminação definitiva do sofrimento e pode abranger dor física e aflição.
- source_word: τὰ πρῶτα
  choice: as coisas anteriores
  rationale: O neutro plural substantivado aponta para as realidades da ordem precedente; a tradução evita limitar o sentido a eventos cronologicamente “primeiros”.
- source_word: ἀπῆλθαν
  choice: passaram
  rationale: O aoristo apresenta como consumada a partida das realidades anteriores; “passaram” mantém a declaração breve e solene.
theological_decisions:
- issue: O sujeito de ἐξαλείψει está implícito e vem do contexto anterior.
  choice: E ele enxugará
  alternative: E Deus enxugará
  rationale: O versículo não repete explicitamente o substantivo “Deus”; o pronome preserva a coesão com Apocalipse 21:3 sem inserir no texto uma identificação que, embora contextual, está implícita.
- issue: Alcance da eliminação da morte, do luto, do clamor e da dor.
  choice: 'Linguagem absoluta: “já não existirá” e “não haverá mais”.'
  alternative: Formulações que indiquem apenas redução ou interrupção temporária
  rationale: As construções com οὐκ ... ἔτι exprimem cessação categórica, de modo que não se acrescentam qualificações que diminuam sua finalidade escatológica.
- issue: Referência de τὰ πρῶτα.
  choice: as coisas anteriores
  alternative: as primeiras coisas
  rationale: Ambas são possíveis, mas “anteriores” comunica com maior naturalidade a ordem precedente sem resolver além do texto exatamente tudo o que ela abrange.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “dos olhos deles toda lágrima” conserva a relação de remoção expressa pelo grego e mantém “toda lágrima” em posição enfática. A segunda ocorrência de οὐκ ἔσται ἔτι foi vertida naturalmente por “não haverá mais”, aplicando-se à série inteira.
