source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: pt
  text: Tinha uma muralha grande e alta, com doze portões; junto aos portões, doze anjos; e nomes inscritos, que eram os das doze tribos dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «descendentes de Israel».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: Tinha
  rationale: O particípio feminino singular retoma a cidade do versículo anterior. Em português, a forma finita evita uma construção participial pouco natural e mantém a descrição.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: uma muralha grande e alta
  rationale: Preserva separadamente os dois adjetivos e usa «muralha», termo natural para a fortificação de uma cidade.
- source_word: πυλῶνας δώδεκα
  choice: doze portões
  rationale: «Portões» expressa naturalmente as grandes entradas da cidade e combina com a imagem arquitetônica.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: junto aos portões
  rationale: A preposição com dativo tem sentido locativo; «junto aos» preserva isso sem sugerir que os anjos estivessem fisicamente em cima dos portões.
- source_word: ἀγγέλους δώδεκα
  choice: doze anjos
  rationale: Correspondência lexical direta e natural.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: estavam inscritos nomes
  rationale: «Inscritos» comunica escrita aposta a uma estrutura monumental, mais especificamente que o genérico «escritos».
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: os nomes das doze tribos
  rationale: Explicita em português o predicado nominal implícito na identificação dos nomes, sem acrescentar conteúdo referencial.
- source_word: υἱῶν Ἰσραήλ
  choice: filhos de Israel
  rationale: Mantém o termo masculino e a designação familiar do grego; a alternativa tradicional mais abrangente aparece em nota.
theological_decisions:
- issue: Sentido corporativo de υἱῶν Ἰσραήλ
  choice: filhos de Israel
  alternative: descendentes de Israel
  rationale: O texto grego diz literalmente «filhos». A tradução principal preserva essa forma familiar e pactual, enquanto a nota esclarece o sentido corporativo possível sem neutralizá-lo no texto.
- issue: Referente de ἐπὶ τοῖς πυλῶσιν na sequência
  choice: Neles estavam inscritos nomes
  alternative: Havia nomes inscritos
  rationale: O masculino plural «neles» retoma naturalmente os portões, refletindo a localização sugerida pelo contexto. A formulação não determina em que parte de cada portão se encontrava a inscrição.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi levemente reorganizada para fluência, preservando a enumeração visual do grego e a ligação com a cidade mencionada no versículo anterior.
