  source_fidelity: A tradução preserva os elementos principais, mas «Neles estavam inscritos nomes» introduz uma referência locativa explícita («neles», isto é, nos portões) que o grego não declara de modo inequívoco. A construção ὀνόματα ἐπιγεγραμμένα apenas menciona nomes inscritos; a relação espacial com os portões pode ser inferida do contexto, mas não deve ser fixada no texto português.
  naturalness: «Tinha uma muralha grande e alta» é natural como continuação do versículo anterior. A enumeração com ponto e vírgula e ponto melhora a legibilidade. «Nomes inscritos» é idiomático e adequado ao registro.
  terminology: '«Muralha», «portões», «anjos», «tribos» e «filhos de Israel» são escolhas adequadas. A nota atual é internamente contraditória: apresenta «descendentes de Israel» como alternativa e depois chama «filhos de Israel» de tradicional, embora esta seja a leitura do texto principal.'
