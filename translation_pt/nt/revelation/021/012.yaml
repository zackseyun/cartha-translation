    rationale: 'O texto principal já traz «filhos de Israel», mas a nota afirma «Tradicionalmente: “filhos de Israel”». A nota deve apresentar apenas uma alternativa real, como «descendentes de Israel», ou uma formulação tradicional distinta.'
  revised_text: Tinha uma muralha grande e alta, com doze portões; junto aos portões, doze anjos; e nomes inscritos, que eram os das doze tribos dos filhos de Israel.[a]
