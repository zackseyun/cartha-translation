  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: pt
  text: O material da sua muralha era jaspe[a], e a cidade era de ouro puro, semelhante a vidro puro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A construção da sua muralha era de jaspe». O termo grego pode indicar a construção, a estrutura ou o material daquilo que foi construído.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como «vidro límpido» ou «vidro transparente». A comparação ressalta a clareza radiante da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: material
  rationale: O substantivo pode designar a construção, a estrutura ou aquilo de que algo é construído. Como o predicativo é «jaspe» e a frase seguinte também destaca a substância da cidade, «material» comunica bem o sentido no contexto.
- source_word: τεῖχος
  choice: muralha
  rationale: Refere-se à parede defensiva de uma cidade; «muralha» é mais preciso e natural neste contexto do que o termo genérico «parede».
- source_word: ἴασπις
  choice: jaspe
  rationale: Mantém o nome tradicional da pedra preciosa, sem pressupor que ela corresponda exatamente ao mineral hoje assim denominado.
- source_word: χρυσίον καθαρόν
  choice: ouro puro
  rationale: A expressão descreve ouro como matéria e qualifica sua pureza; «ouro puro» é literal, idiomático e claro.
- source_word: ὅμοιον
  choice: semelhante a
  rationale: Introduz explicitamente uma comparação e mantém um registro digno e natural.
- source_word: ὑάλῳ καθαρῷ
  choice: vidro puro
  rationale: Reproduz de modo próximo a repetição de καθαρός no grego («ouro puro... vidro puro»), preservando a imagem incomum; a nota esclarece a possível ênfase em limpidez ou transparência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com «muralha» para a fortificação urbana. Conserva-se o paralelismo «ouro puro... vidro puro» e explica-se em nota a possível nuance visual de transparência.
