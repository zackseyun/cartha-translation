id: REV.21.3
reference: Revelation 21:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: pt
  text: 'E ouvi uma voz forte, vinda do trono, que dizia: “Eis que a morada[a] de Deus está com os seres humanos! Ele habitará[b] com eles, eles serão os seus povos[c], e o próprio Deus estará com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tenda de Deus” ou “o tabernáculo de Deus”. A palavra grega σκηνή evoca a imagem da tenda sagrada em que Deus habitava no meio de seu povo.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego está ligado à palavra traduzida por “morada”; mais literalmente, “armará sua tenda” ou “acampará” com eles.
    reason: lexical_alternative
  - marker: c
    text: O texto grego traz “povos”, no plural; alguns testemunhos textuais apresentam “povo”, no singular.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: uma voz forte
  rationale: Em combinação com φωνή, μεγάλη indica intensidade ou volume. “Voz forte” é uma expressão natural em português e mantém a solenidade da proclamação.
- source_word: ἐκ τοῦ θρόνου
  choice: vinda do trono
  rationale: Expressa com naturalidade a origem indicada por ἐκ, preservando a imagem do trono característica de Apocalipse.
- source_word: Ἰδού
  choice: Eis que
  rationale: Mantém a força solene de chamada à atenção de ἰδού sem recorrer a uma formulação excessivamente coloquial.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: a morada de Deus
  rationale: σκηνή designa literalmente uma tenda ou tabernáculo e, neste contexto, a habitação de Deus. “Morada” comunica o sentido principal em português corrente; a imagem concreta da tenda é preservada em nota.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: com os seres humanos
  rationale: ἄνθρωποι abrange aqui a humanidade em geral. “Seres humanos” é inclusivo, preciso e permite que os pronomes plurais seguintes mantenham o encadeamento do grego.
- source_word: σκηνώσει
  choice: habitará
  rationale: O verbo σκηνόω significa morar ou acampar e retoma σκηνή. “Habitará” é claro e digno no texto principal; a ligação com a imagem da tenda é explicitada em nota.
- source_word: λαοὶ αὐτοῦ
  choice: os seus povos
  rationale: A edição SBLGNT traz λαοί no plural. “Povos” preserva essa forma significativa, em vez de harmonizá-la com o singular tradicional.
- source_word: αὐτὸς ὁ θεός
  choice: o próprio Deus
  rationale: “O próprio Deus” comunica a ênfase de αὐτός na presença direta de Deus.
- source_word: μετ’ αὐτῶν ἔσται
  choice: estará com eles
  rationale: Tradução natural da expressão futura, preservando a fórmula de presença divina.
theological_decisions:
- issue: Plural λαοί em contraste com o singular tradicional “povo”
  choice: eles serão os seus povos
  alternative: eles serão o seu povo
  rationale: O texto crítico fornecido lê o plural λαοί. A tradução mantém essa pluralidade e não decide além do texto como ela se relaciona com a unidade da comunidade redimida.
- issue: Imagem da tenda/tabernáculo em σκηνή e σκηνόω
  choice: a morada de Deus ... ele habitará
  alternative: a tenda de Deus ... ele armará sua tenda
  rationale: O texto principal prioriza clareza e naturalidade, enquanto as notas conservam a imagem concreta e a repetição lexical, importantes para o tema bíblico da presença de Deus.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva o tom proclamativo; “seres humanos” evita o uso genérico potencialmente ambíguo de “homens”. As notas preservam tanto a imagem do tabernáculo quanto a variante entre plural e singular.
