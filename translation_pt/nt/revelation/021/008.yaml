id: REV.21.8
reference: Revelation 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: pt
  text: Mas, quanto aos covardes, aos incrédulos[a], aos abomináveis, aos assassinos, aos sexualmente imorais, aos praticantes de feitiçaria, aos idólatras e a todos os mentirosos, a parte deles será no lago que arde com fogo e enxofre, que é a segunda morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “infiéis”.
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: covardes
  rationale: O termo indica medo moralmente condenável ou falta de coragem, não o medo comum; “covardes” preserva essa força na lista de vícios.
- source_word: ἀπίστοις
  choice: incrédulos
  rationale: No contexto desta lista de pessoas sujeitas ao juízo, o sentido mais direto é o de quem não crê; a possível nuance de infidelidade é preservada em nota.
- source_word: ἐβδελυγμένοις
  choice: abomináveis
  rationale: O particípio perfeito caracteriza pessoas marcadas pelo que é repugnante ou detestável. “Abomináveis” conserva a intensidade e é corrente no registro bíblico moderno.
- source_word: φονεῦσι
  choice: assassinos
  rationale: Designa especificamente homicidas, e não todos os que causam uma morte; “assassinos” expressa essa culpabilidade.
- source_word: πόρνοις
  choice: sexualmente imorais
  rationale: O termo abrange pessoas que praticam imoralidade sexual; a expressão é clara, ampla e evita o sentido moderno mais restrito de “fornicadores”.
- source_word: φαρμάκοις
  choice: praticantes de feitiçaria
  rationale: Neste contexto apocalíptico, refere-se a quem pratica artes mágicas ou ocultas, não a farmacêuticos nem simplesmente a envenenadores. A locução é mais transparente internacionalmente que “feiticeiros”.
- source_word: εἰδωλολάτραις
  choice: idólatras
  rationale: Equivalente direto e natural para os que adoram ídolos.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: todos os mentirosos
  rationale: O adjetivo substantivado designa pessoas falsas ou mentirosas; esta formulação é idiomática e adequada à lista.
- source_word: τὸ μέρος αὐτῶν
  choice: a parte deles será
  rationale: μέρος indica a parte, porção ou destino que lhes cabe. O futuro “será” torna natural em português a oração nominal grega sem alterar seu sentido.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: no lago que arde com fogo e enxofre
  rationale: A oração relativa reproduz com naturalidade o particípio atributivo καιομένῃ; “enxofre” é o equivalente moderno e direto de θεῖον.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: que é a segunda morte
  rationale: Mantém a construção explicativa e identifica o lago descrito anteriormente como a segunda morte.
theological_decisions:
- issue: Sentido de ἄπιστος na lista de julgamento
  choice: incrédulos
  alternative: infiéis
  rationale: O contexto favorece a falta de fé ou crença, mas o termo também pode caracterizar quem é infiel. A nota conserva essa ambiguidade sem decidir em favor de uma leitura exclusivamente cognitiva ou pactual.
- issue: Referente de ὅ em “ὅ ἐστιν ὁ θάνατος ὁ δεύτερος”
  choice: que é a segunda morte
  alternative: isto é a segunda morte
  rationale: A forma relativa mantém a conexão gramatical com a imagem precedente sem explicitar além do grego se a identificação recai estritamente sobre o lago ou sobre o destino nele descrito.
- issue: Imagem de θεῖον
  choice: enxofre
  alternative: brimstone (equivalente tradicional em inglês, sem correspondente distinto necessário em português)
  rationale: “Enxofre” traduz diretamente o referente material e preserva a imagem de juízo sem recorrer a vocabulário arcaico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “aos” sustenta o paralelismo da enumeração grega; “quanto aos” introduz naturalmente o contraste marcado por δέ. Evitou-se linguagem arcaica e também qualquer especificação denominacional do juízo descrito.
