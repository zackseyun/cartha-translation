id: REV.21.21
reference: Revelation 21:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: pt
  text: E os doze portões eram doze pérolas; cada um dos portões era feito de uma só pérola. E a rua da cidade era de ouro puro[a], como vidro transparente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a rua larga da cidade” ou “a praça da cidade”.
    reason: Alternativas lexicais possíveis para πλατεῖα.
lexical_decisions:
- source_word: πυλῶνες
  choice: portões
  rationale: No contexto arquitetônico da Nova Jerusalém, designa portões ou estruturas de entrada; “portões” é natural e preserva a imagem.
- source_word: μαργαρῖται / μαργαρίτου
  choice: pérolas / pérola
  rationale: O termo denota diretamente pérola; mantém-se a alternância plural-singular do grego.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: cada um
  rationale: 'Expressa com naturalidade a forte distribuição individual: um para cada portão.'
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: era feito de uma só pérola
  rationale: ἐξ indica aqui matéria ou origem; “feito de” torna explícita a relação material implícita no contexto, e “uma só” conserva a ênfase de ἑνός.
- source_word: πλατεῖα
  choice: rua
  rationale: Pode designar uma rua larga ou espaço público aberto; “rua” é claro e natural, enquanto as alternativas legítimas são registradas em nota.
- source_word: χρυσίον καθαρὸν
  choice: ouro puro
  rationale: Equivalência direta, idiomática e tradicional para ouro caracterizado por pureza.
- source_word: ὡς ὕαλος διαυγής
  choice: como vidro transparente
  rationale: Preserva a comparação e expressa a clareza ou transparência indicada por διαυγής.
theological_decisions:
- issue: Configuração urbana representada por πλατεῖα
  choice: rua da cidade
  alternative: rua larga da cidade; praça da cidade
  rationale: A escolha preserva a descrição visionária no singular sem impor um traçado urbano específico; a ambiguidade lexical genuína permanece acessível na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida por “E” conserva o andamento do grego; “uma só pérola” mantém a ênfase distributiva.
