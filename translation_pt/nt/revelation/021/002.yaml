id: REV.21.2
reference: Revelation 21:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: pt
  text: E vi a cidade santa, a nova Jerusalém, que descia do céu, da parte de Deus, preparada como uma noiva adornada para o seu marido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: a cidade santa
  rationale: Preserva a imagem concreta da cidade e a força teológica de ἁγίαν em linguagem bíblica natural.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: a nova Jerusalém
  rationale: Traduz καινήν e translitera o nome. Em português, o artigo torna a aposição natural; a inicial minúscula em “nova” conserva seu valor descritivo sem impor que toda a expressão seja um título formal.
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω é expresso diretamente, sem acréscimo interpretativo.
- source_word: καταβαίνουσαν
  choice: que descia
  rationale: Forma corrente e clara para o particípio, mantendo a cidade como referente e o movimento descendente da visão.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Em português, “descia do céu” comunica naturalmente tanto a procedência quanto o movimento para fora indicado por ἐκ.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: da parte de Deus
  rationale: Distingue com naturalidade a origem divina da expressão anterior “do céu”, sem acrescentar a ideia não explícita de “presença”.
- source_word: ἡτοιμασμένην
  choice: preparada
  rationale: O particípio perfeito passivo descreve a cidade em estado de prontidão resultante de preparação já realizada.
- source_word: ὡς νύμφην
  choice: como uma noiva
  rationale: Mantém a comparação introduzida por ὡς e não transforma a imagem em identificação explícita.
- source_word: κεκοσμημένην
  choice: adornada
  rationale: Conserva o tom elevado e a imagem de ornamentação nupcial de κοσμέω.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: para o seu marido
  rationale: No contexto nupcial, ἀνήρ significa naturalmente “marido”; “noivo” traduziria um termo mais específico que não aparece no grego.
theological_decisions:
- issue: Se “nova Jerusalém” deve ser tratada como título formal
  choice: nova Jerusalém
  alternative: Nova Jerusalém
  rationale: O grego apresenta Jerusalém qualificada por καινήν. A minúscula preserva a força descritiva do adjetivo; a capitalização seria uma decisão editorial e interpretativa, não exigida pelo texto.
- issue: Se a imagem da noiva deve ser explicitamente identificada com a igreja
  choice: manter apenas a comparação “como uma noiva”
  alternative: explicitar “como a igreja, noiva do Cordeiro”
  rationale: O versículo formula uma comparação e não faz essa identificação de modo explícito nesta oração. A tradução evita importar uma interpretação teológica para o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada de modo natural sem apagar a aposição “a nova Jerusalém” nem a distinção entre a procedência celestial e a origem divina.
