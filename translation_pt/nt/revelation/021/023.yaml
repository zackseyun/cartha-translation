id: REV.21.23
reference: Revelation 21:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: pt
  text: A cidade não precisa do sol nem da lua para brilharem sobre ela[a], pois a glória de Deus a iluminou, e a sua lâmpada é o Cordeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para lhe darem luz”. O grego diz literalmente “para brilharem para/sobre ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: cidade
  rationale: Sentido direto no contexto da Nova Jerusalém; forma natural e corrente em português.
- source_word: οὐ χρείαν ἔχει
  choice: não precisa
  rationale: Expressa de modo natural em português atual o idioma grego que, literalmente, significa 'não tem necessidade'.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: do sol nem da lua
  rationale: Preserva a construção correlativa negativa e a relação com 'não precisa'.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: para brilharem sobre ela
  rationale: Com o sol e a lua como sujeitos, φαίνω significa naturalmente 'brilhar'; 'sobre ela' representa o dativo αὐτῇ sem confundi-lo com o verbo posterior de iluminar.
- source_word: δόξα
  choice: glória
  rationale: Equivalente tradicional, claro e teologicamente significativo no contexto apocalíptico.
- source_word: ἐφώτισεν
  choice: a iluminou
  rationale: Verte diretamente a ação concreta de dar luz e mantém distinção lexical em relação a 'brilharem'.
- source_word: λύχνος
  choice: lâmpada
  rationale: O termo designa uma lâmpada, não a luz em sentido genérico nem um candelabro.
- source_word: ἀρνίον
  choice: Cordeiro
  rationale: Em Apocalipse, funciona como título cristológico; a inicial maiúscula sinaliza esse uso em português.
theological_decisions:
- issue: Relação metafórica em 'a sua lâmpada é o Cordeiro'
  choice: Manter diretamente a metáfora com 'lâmpada'.
  alternative: O Cordeiro é a sua luz.
  rationale: O grego emprega λύχνος, 'lâmpada', e não um termo genérico para 'luz'. A formulação preserva também a distinção entre a glória de Deus, que ilumina a cidade, e o Cordeiro, que é sua lâmpada.
- issue: Imagem da iluminação divina
  choice: Traduzir a afirmação sem acrescentar explicação escatológica.
  alternative: Expandir o texto para dizer que Deus substitui todas as luzes criadas.
  rationale: O versículo declara apenas que a cidade não precisa do sol nem da lua, pois a glória de Deus a iluminou e o Cordeiro é sua lâmpada; a tradução não amplia essa afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Não precisa' evita rigidez desnecessária; 'brilharem sobre ela' preserva a imagem e a ambiguidade relacional do dativo grego. O pronome possessivo em 'a sua lâmpada' retoma claramente 'a cidade'.
