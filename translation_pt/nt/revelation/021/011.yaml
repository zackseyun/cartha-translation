id: REV.21.11
reference: Revelation 21:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: pt
  text: tendo a glória de Deus. Seu resplendor era semelhante a uma pedra preciosíssima, como pedra de jaspe[a], cristalina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O jaspe antigo podia designar uma pedra diferente da variedade opaca hoje conhecida; aqui a comparação enfatiza seu caráter preciosíssimo e cristalino.
    reason: historical_lexical_clarification
  - marker: b
    text: Ou «que cintilava como cristal» ou «transparente como cristal».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: tendo
  rationale: Preserva o particípio presente que modifica a cidade mencionada no versículo anterior e mantém a ligação sintática sem reduzir a ideia a mero acompanhamento.
- source_word: δόξαν
  choice: glória
  rationale: É a correspondência consagrada e semanticamente ampla para δόξα, preservando tanto a manifestação visível quanto o peso teológico da majestade divina.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: seu resplendor
  rationale: No contexto da aparência luminosa da cidade, «resplendor» comunica de modo natural o brilho visível; φωστήρ também pode designar sua luz ou fonte luminosa.
- source_word: ὅμοιος
  choice: era semelhante a
  rationale: Expressa claramente a comparação e supre de maneira idiomática a cópula ausente na oração grega.
- source_word: λίθῳ τιμιωτάτῳ
  choice: uma pedra preciosíssima
  rationale: Mantém λίθος como «pedra» e expressa a força superlativa de τιμιώτατος de maneira natural em português.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: como pedra de jaspe
  rationale: Conserva a repetição de λίθος e identifica o material comparado sem tornar a formulação artificial.
- source_word: κρυσταλλίζοντι
  choice: cristalina
  rationale: Reproduz concisamente a qualidade semelhante ao cristal atribuída ao jaspe, sem decidir de forma excessiva entre transparência, luminosidade e cintilação.
theological_decisions:
- issue: Sentido de δόξα τοῦ θεοῦ na descrição apocalíptica
  choice: a glória de Deus
  alternative: o esplendor de Deus
  rationale: «Glória» preserva a ressonância bíblico-teológica da presença e majestade divinas, sem limitar a expressão ao aspecto visual.
- issue: Relação entre a glória divina e o φωστήρ da cidade
  choice: manter «glória» e «resplendor» como expressões distintas
  alternative: verter ambas com termos de brilho ou luz
  rationale: A distinção lexical evita identificar sem explicação a glória de Deus com o fenômeno luminoso da cidade, embora o contexto os relacione estreitamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Preciosíssima» conserva a intensidade superlativa; «cristalina» mantém a concisão e parte da ambiguidade de κρυσταλλίζοντι. Todos os marcadores de notas aparecem no texto principal.
