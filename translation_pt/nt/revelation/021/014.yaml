id: REV.21.14
reference: Revelation 21:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: pt
  text: A muralha da cidade tinha doze fundamentos[a], e sobre eles estavam os doze nomes dos doze apóstolos do Cordeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “doze pedras de alicerce”. O termo grego pode se referir aos fundamentos ou às pedras que servem de alicerce numa construção.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: muralha
  rationale: No contexto de uma cidade, τεῖχος designa especialmente a muralha que a cerca. “Muralha” é mais preciso em português do que o termo genérico “parede”.
- source_word: πόλεως
  choice: da cidade
  rationale: O genitivo indica a muralha pertencente à cidade e é traduzido de modo direto e natural.
- source_word: ἔχων
  choice: tinha
  rationale: Embora o grego empregue um particípio presente, a forma verbal finita “tinha” produz uma descrição natural em português e concorda semanticamente com “muralha”.
- source_word: θεμελίους δώδεκα
  choice: doze fundamentos
  rationale: θεμέλιος pode indicar fundamentos ou pedras de alicerce. “Doze fundamentos” preserva a formulação mais direta, enquanto a alternativa arquitetônica é registrada em nota.
- source_word: ἐπ’ αὐτῶν
  choice: sobre eles
  rationale: ἐπί com o genitivo expressa posição sobre os fundamentos; “sobre eles” mantém o referente e a relação espacial sem acrescentar explicações.
- source_word: δώδεκα ὀνόματα
  choice: os doze nomes
  rationale: O texto diz literalmente “doze nomes”; não se acrescenta a ideia de inscrições, embora ela possa estar implícita na imagem.
- source_word: ἀποστόλων
  choice: apóstolos
  rationale: “Apóstolos” é o termo português estabelecido para este grupo específico e preserva seu sentido neotestamentário.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: Em Apocalipse, ἀρνίον funciona como título cristológico recorrente. “Cordeiro”, com inicial maiúscula, preserva essa função titular.
theological_decisions:
- issue: Título cristológico ἀρνίου
  choice: Cordeiro
  alternative: cordeiro
  rationale: A inicial maiúscula sinaliza que o termo é usado como título reconhecido de Jesus em Apocalipse, sem inserir conteúdo ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Muralha” comunica naturalmente a estrutura defensiva de uma cidade; “fundamentos” mantém a imagem arquitetônica e a ambiguidade lexical é preservada em nota.
