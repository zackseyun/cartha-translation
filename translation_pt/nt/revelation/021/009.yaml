id: REV.21.9
reference: Revelation 21:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: pt
  text: 'Então veio um dos sete anjos que tinham as sete taças cheias das sete últimas pragas e falou comigo, dizendo: “Venha! Eu lhe mostrarei a noiva, a esposa do Cordeiro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: Expressa de modo natural a progressão narrativa, sem perder a função conectiva do grego.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: que tinham as sete taças
  rationale: A oração identifica os anjos pela posse das taças; “taças” representa melhor o recipiente largo indicado por φιάλη do que “frascos” ou “vasos”.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: cheias das sete últimas pragas
  rationale: Preserva a ideia de que as taças estavam cheias, bem como o caráter sequencial e culminante de ἐσχάτων.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: falou comigo
  rationale: Mantém a construção relacional de μετά com o genitivo, sem reduzi-la simplesmente a “falou-me”.
- source_word: Δεῦρο
  choice: Venha!
  rationale: Imperativo idiomático em português brasileiro contemporâneo, com a força de convite ou chamado presente no contexto.
- source_word: δείξω σοι
  choice: Eu lhe mostrarei
  rationale: Reproduz diretamente o futuro do indicativo e explicita o pronome sujeito para dar clareza e solenidade à declaração.
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: a noiva, a esposa do Cordeiro
  rationale: 'Conserva os dois substantivos em aposição: νύμφη como “noiva” e γυνή, neste contexto conjugal, como “esposa”.'
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: Mantém a designação cristológica característica do Apocalipse, com inicial maiúscula por funcionar como título.
theological_decisions:
- issue: Relação entre νύμφην e γυναῖκα
  choice: a noiva, a esposa do Cordeiro
  alternative: a noiva-esposa do Cordeiro
  rationale: A tradução conserva explicitamente as duas imagens nominais em aposição, sem fundi-las nem enfraquecer a metáfora nupcial.
- issue: Uso de ἀρνίον como título cristológico
  choice: Cordeiro
  alternative: cordeiro
  rationale: No Apocalipse, o termo funciona como designação titular de Jesus; a inicial maiúscula sinaliza esse uso sem acrescentar explicação doutrinária ao versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Falou comigo, dizendo” preserva de perto a estrutura grega, enquanto “Venha” e “Eu lhe mostrarei” mantêm fluência natural. Não foram necessárias notas de rodapé.
