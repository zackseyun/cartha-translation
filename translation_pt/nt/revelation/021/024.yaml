source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: pt
  text: As nações andarão à luz dela[a], e os reis da terra levarão a sua glória para dentro dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da luz dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o seu esplendor” ou “a sua honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: andarão
  rationale: Preserva a imagem concreta de caminhar, adequada à cena da cidade iluminada, sem reduzi-la ao sentido abstrato de “viver” ou “proceder”.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Expressa o sentido coletivo de povos ou nações e mantém a ressonância profética do Antigo Testamento.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: à luz dela
  rationale: É uma formulação natural em português para indicar que a luz da cidade orienta o caminhar das nações. A nota preserva a possibilidade mais instrumental de διά com o genitivo.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: os reis da terra
  rationale: Mantém a expressão apocalíptica recorrente para os governantes terrenos.
- source_word: φέρουσιν
  choice: levam
  rationale: Conserva o presente do texto grego, após o futuro “andarão”. Esse presente pode tornar a visão mais vívida ou ter força futurística, mas a tradução não elimina silenciosamente a mudança de tempo verbal.
- source_word: τὴν δόξαν αὐτῶν
  choice: a sua glória
  rationale: “Glória” preserva a amplitude de δόξα e sua ressonância bíblica, podendo abranger honra, esplendor e riqueza régia.
- source_word: εἰς αὐτήν
  choice: para dentro dela
  rationale: Torna explícito o movimento para o interior da cidade indicado por εἰς. Em português, o pronome feminino é natural porque “cidade” é feminino.
theological_decisions:
- issue: Glória dos reis levada para a nova Jerusalém
  choice: Manter “glória” sem especificar se significa honra, esplendor ou riqueza.
  alternative: Traduzir como “esplendor” ou “honra”.
  rationale: O termo pode reunir essas ideias e evoca a linguagem profética sobre as nações trazendo sua glória à cidade; uma escolha mais estreita resolveria indevidamente essa amplitude.
- issue: Mudança do futuro para o presente no texto grego
  choice: Traduzir περιπατήσουσιν no futuro e φέρουσιν no presente.
  alternative: 'Uniformizar ambos no futuro: “andarão” e “levarão”.'
  rationale: A alternância é genuína no texto fornecido. O presente pode funcionar como presente visionário ou com referência futura, mas mantê-lo permite ao leitor perceber a tensão verbal em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “À luz dela” evita rigidez excessiva, enquanto “para dentro dela” conserva o sentido espacial. O feminino “dela” refere-se naturalmente à cidade em português, não exigindo nota gramatical.
