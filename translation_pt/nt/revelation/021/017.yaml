id: REV.21.17
reference: Revelation 21:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: pt
  text: 'E ele mediu a muralha da cidade: 144 côvados, segundo a medida humana, que é também a do anjo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a medida de um homem, isto é, de um anjo”. O grego pode enfatizar tanto que o anjo usou uma unidade humana de medida quanto que, neste caso, a medida humana e a angélica correspondem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: mediu
  rationale: O aoristo ativo de μετρέω indica diretamente o ato de medir; “mediu” é claro e natural em português.
- source_word: τὸ τεῖχος αὐτῆς
  choice: a muralha da cidade
  rationale: τεῖχος designa a muralha defensiva de uma cidade. Explicitar “da cidade” torna inequívoco o referente de αὐτῆς e soa mais natural do que “a muralha dela” neste contexto.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 côvados
  rationale: Mantém a antiga unidade de medida usada no texto, sem introduzir uma conversão moderna discutível; os algarismos favorecem a leitura imediata.
- source_word: μέτρον ἀνθρώπου
  choice: segundo a medida humana
  rationale: ἀνθρώπου tem sentido genérico, não especificamente masculino. A formulação indica um padrão de medida humano e preserva a construção concisa do grego.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: que é também a do anjo
  rationale: O grego é elíptico; “a” retoma “medida”, e “também” expressa a correspondência sugerida entre a medida humana e a do anjo sem expandir excessivamente o texto.
theological_decisions:
- issue: Sentido de μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: A medida é apresentada como humana e, ao mesmo tempo, como a medida do anjo.
  alternative: A expressão pode significar que o anjo usou uma unidade humana ou que “medida de homem” identifica especificamente a medida própria do anjo.
  rationale: A sintaxe grega é compacta e admite mais de uma ênfase. O texto principal conserva a equivalência, enquanto a nota registra a ambiguidade sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Muralha” distingue a fortificação urbana de uma parede comum; a unidade antiga “côvados” foi preservada. A nota mantém a ambiguidade real da expressão final.
