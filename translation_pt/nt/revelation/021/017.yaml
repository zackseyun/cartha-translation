  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: o ato de medir, a muralha pertencente à cidade, o número e a unidade («144 côvados») e a qualificação final da medida. «A muralha da cidade» explicita de modo legítimo o antecedente de αὐτῆς no contexto imediato, sem alterar o sentido. «Segundo a medida humana, que é também a do anjo» preserva a relação explicativa e elíptica de μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου sem resolver indevidamente a ambiguidade.'
