id: REV.21.15
reference: Revelation 21:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: pt
  text: E aquele que falava comigo tinha uma vara de medir de ouro[a], para medir a cidade, seus portões e sua muralha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cana de medir feita de ouro”. O grego usa κάλαμος, literalmente “cana”, para uma haste usada na medição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: aquele que falava comigo
  rationale: Reproduz naturalmente o particípio substantivado e seu valor descritivo contínuo, sem acrescentar a identificação como anjo, ausente neste versículo.
- source_word: εἶχεν
  choice: tinha
  rationale: É o sentido direto do imperfeito de ἔχω e evita especificar, além do texto, que o objeto estava sendo segurado.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: uma vara de medir de ouro
  rationale: Expressa com clareza a função do instrumento. κάλαμος significa literalmente 'cana', mas aqui designa uma haste empregada para medir; a alternativa literal é preservada em nota.
- source_word: ἵνα μετρήσῃ
  choice: para medir
  rationale: A construção portuguesa com 'para' comunica de modo natural e inequívoco a finalidade expressa por ἵνα com o subjuntivo aoristo.
- source_word: πόλιν
  choice: a cidade
  rationale: Correspondência direta e natural; o contexto identifica a cidade, mas não é necessário explicitar seu nome no versículo.
- source_word: πυλῶνας
  choice: portões
  rationale: πυλών pode indicar portão ou entrada monumental. 'Portões' é claro, idiomático e apropriado à descrição arquitetônica da cidade.
- source_word: τεῖχος
  choice: muralha
  rationale: No contexto urbano, 'muralha' comunica com maior precisão uma parede defensiva ou delimitadora que circunda a cidade.
theological_decisions:
- issue: Identificação explícita daquele que falava com João
  choice: aquele que falava comigo
  alternative: o anjo que falava comigo
  rationale: Embora o contexto mais amplo identifique a figura como um dos anjos, o grego deste versículo emprega apenas uma descrição participial. A tradução não acrescenta uma identificação que o próprio versículo não enuncia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Aquele que falava comigo' conserva a descrição do original; 'vara de medir' torna transparente a função do objeto, e a nota registra a imagem literal da cana.
