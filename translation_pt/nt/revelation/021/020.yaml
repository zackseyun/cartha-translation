source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: pt
  text: o quinto, sardônica; o sexto, sárdio[a]; o sétimo, crisólito; o oitavo, berilo; o nono, topázio; o décimo, crisópraso; o décimo primeiro, jacinto[b]; o décimo segundo, ametista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cornalina”; a identificação exata dessa pedra antiga é incerta.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “jacinto” designa uma pedra preciosa, não a flor.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: sardônica
  rationale: Emprega o nome tradicional e corrente em português para essa pedra, preservando sua distinção em relação a σάρδιον.
- source_word: σάρδιον
  choice: sárdio
  rationale: Mantém o termo tradicional para a pedra antiga; sua identificação mineralógica exata é incerta, e 'cornalina' permanece uma alternativa plausível.
- source_word: χρυσόλιθος
  choice: crisólito
  rationale: Usa o equivalente gemológico tradicional em português, sem substituir a pedra antiga por uma identificação moderna incerta.
- source_word: βήρυλλος
  choice: berilo
  rationale: Equivalente português estabelecido para o nome da pedra.
- source_word: τοπάζιον
  choice: topázio
  rationale: Equivalente português corrente, embora nomes antigos de gemas nem sempre correspondam exatamente às classificações mineralógicas modernas.
- source_word: χρυσόπρασος
  choice: crisópraso
  rationale: Nome português estabelecido da gema; uma tradução etimológica literal seria obscura e inadequada ao contexto.
- source_word: ὑάκινθος
  choice: jacinto
  rationale: Conserva o nome tradicional da pedra em listas bíblicas; aqui o termo designa uma gema, não a flor.
- source_word: ἀμέθυστος
  choice: ametista
  rationale: Equivalente português direto e amplamente reconhecido.
theological_decisions: []
