id: REV.20.4
reference: Revelation 20:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: pt
  text: E vi tronos, e sentaram-se neles, e foi-lhes dado julgamento. Vi também as almas dos que tinham sido decapitados por causa do testemunho de Jesus[a] e por causa da palavra de Deus, e os que não tinham adorado a besta nem a sua imagem e não tinham recebido a marca na testa nem na mão. Eles voltaram à vida e reinaram com o Messias[b] por mil anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode significar “por causa do testemunho a respeito de Jesus” ou “por causa do testemunho dado por Jesus”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “com o Cristo”. O título grego Χριστός significa “Messias”, isto é, “Ungido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: tronos
  rationale: Correspondência concreta e direta, natural no registro visionário e apocalíptico.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: alguns se sentaram neles
  rationale: O verbo é ativo e o sujeito plural está implícito. “Alguns” evita um pronome sem antecedente claro em português, sem identificar interpretativamente quem ocupou os tronos.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: lhes foi dado o julgamento
  rationale: Preserva a formulação ampla de κρίμα, sem decidir entre o ato de julgar, uma sentença e a autoridade judicial.
- source_word: ψυχὰς
  choice: as almas
  rationale: Mantém a imagem apocalíptica e a distinção narrativa entre a morte anterior e a volta à vida.
- source_word: πεπελεκισμένων
  choice: haviam sido decapitados
  rationale: Expressa de modo idiomático e preciso a execução por decapitação, sem acrescentar desnecessariamente o instrumento.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: por causa do testemunho de Jesus
  rationale: διά com acusativo indica causa; a construção “de Jesus” preserva a ambiguidade entre o testemunho dado por Jesus e o testemunho a respeito dele.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: por causa da palavra de Deus
  rationale: Tradução causal direta e expressão consagrada, clara no português atual.
- source_word: οἵτινες
  choice: daqueles que
  rationale: Identifica qualitativamente o grupo e mantém aberta sua relação sintática com as almas dos decapitados.
- source_word: προσεκύνησαν
  choice: não haviam adorado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da recusa em relação à volta à vida; “adorado” comunica a força religiosa do verbo.
- source_word: θηρίον
  choice: a besta
  rationale: Termo apocalíptico estabelecido e equivalente lexical direto.
- source_word: εἰκόνα
  choice: imagem
  rationale: Tradução direta que conserva as ressonâncias internas de Apocalipse; “ídolo” seria mais interpretativo.
- source_word: χάραγμα
  choice: a marca
  rationale: Forma clara e convencional no contexto de Apocalipse.
- source_word: ἔζησαν
  choice: voltaram à vida
  rationale: Comunica a força ingressiva/eventiva no contexto sem especificar além do texto a natureza da ressurreição.
- source_word: χριστοῦ
  choice: Messias
  rationale: Χριστός funciona aqui como título; “Messias” torna explícito seu valor titular.
- source_word: χίλια ἔτη
  choice: mil anos
  rationale: Correspondência numérica e temporal direta.
theological_decisions:
- issue: Sujeito implícito de ἐκάθισαν e destinatários do julgamento
  choice: Mantida a referência indefinida com “alguns” e “lhes”, sem identificar os ocupantes dos tronos.
  alternative: Identificá-los como os mártires, todos os santos, os apóstolos ou integrantes de um conselho celestial.
  rationale: O grego não nomeia o sujeito. Uma identificação específica resolveria uma questão interpretativa que o versículo deixa aberta.
- issue: Sentido de κρίμα ἐδόθη αὐτοῖς
  choice: “lhes foi dado o julgamento”
  alternative: “foi-lhes dada autoridade para julgar” ou “foi-lhes dado o direito de julgar”
  rationale: A formulação escolhida conserva a amplitude de κρίμα e evita limitar o sentido à autoridade judicial.
- issue: Relação entre os decapitados e os que não adoraram a besta
  choice: Preservada uma formulação que pode apresentar grupos coordenados ou uma descrição ampliada do mesmo conjunto.
  alternative: Transformar explicitamente todos em um único grupo ou separá-los de maneira categórica.
  rationale: A coordenação grega admite debate sintático; a tradução não deve decidir silenciosamente a composição exata do grupo.
- issue: Sentido de διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: “por causa do testemunho de Jesus”, com alternativa em nota.
  alternative: “por causa do testemunho que deram a respeito de Jesus” ou “por causa do testemunho dado por Jesus”
  rationale: O genitivo pode ser objetivo ou subjetivo. O texto principal mantém a ambiguidade e a nota registra as leituras possíveis.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo tem função titular no contexto; a nota oferece a forma tradicional “Cristo”.
- issue: Tradução de ἔζησαν
  choice: “voltaram à vida”
  alternative: “viveram” ou “reviveram”
  rationale: A escolha expressa o início de uma nova condição de vida no fluxo da visão sem impor uma construção escatológica denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada com “Vi também” para evitar uma sequência truncada de objetos após “vi”, sem apagar a coordenação visionária. Empregaram-se “na testa” e “na mão”, formas naturais em português, para as construções gregas com ἐπί.
