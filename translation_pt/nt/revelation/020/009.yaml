  naturalness: “Subiram pela vasta extensão da terra” é claro em português atual, conserva um tom narrativo apropriado a Apocalipse e evita a formulação menos natural “sobre a largura da terra” no texto principal. A coordenação com “E desceu” acompanha de perto a sequência paratática grega.
  terminology: “Acampamento dos santos”, “cidade amada”, “céu” e “consumiu” são escolhas fiéis, naturais e terminologicamente consistentes. A nota sobre a cidade amada preserva corretamente a não identificação explícita do referente.
