  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: pt
  text: Eles subiram pela vasta extensão da terra[a] e cercaram[b] o acampamento dos santos e a cidade amada[c]. E desceu fogo do céu e os consumiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre a largura da terra”; a expressão indica uma vasta extensão.
    reason: lexical_alternative
  - marker: b
    text: Ou “rodearam”.
    reason: lexical_alternative
  - marker: c
    text: O texto não identifica expressamente “a cidade amada”; ela costuma ser entendida como Jerusalém ou, em sentido mais amplo, como a cidade de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: avançaram
  rationale: O aoristo de ἀναβαίνω pode significar subir, ir para cima ou avançar. Neste contexto de forças que atravessam a terra para cercar um acampamento, “avançaram” comunica naturalmente o movimento sem impor uma geografia específica.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: por toda a extensão da terra
  rationale: πλάτος designa largura ou vasta extensão. A formulação preserva a imagem de uma área ampla e evita acrescentar “planície”, termo ausente do grego.
- source_word: ἐκύκλευσαν
  choice: cercaram
  rationale: O verbo significa rodear ou circundar. “Cercaram” é claro, natural e adequado ao contexto de cerco.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: παρεμβολή denota acampamento, muitas vezes militar. “Acampamento” mantém a imagem sem explicitação interpretativa adicional.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: “Santos” é a forma tradicional e ainda corrente para os que pertencem a Deus, preservando a continuidade terminológica de Apocalipse.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: a cidade amada
  rationale: A expressão mantém o particípio passivo ἠγαπημένην sem explicitar quem ama a cidade nem identificar qual cidade é.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: desceu fogo do céu
  rationale: Tradução direta e natural que conserva tanto o movimento descendente quanto a origem celestial do fogo.
- source_word: κατέφαγεν αὐτούς
  choice: os consumiu
  rationale: Com fogo como sujeito, “consumiu” expressa de modo idiomático o sentido de devorar por completo de κατεσθίω.
theological_decisions:
- issue: Identidade e força teológica de “a cidade amada”
  choice: Manter “a cidade amada” sem identificá-la no texto principal.
  alternative: Identificá-la como Jerusalém ou como a cidade/o povo escatológico de Deus.
  rationale: O texto grego não nomeia a cidade. Preservar a expressão genérica mantém a ambiguidade e evita inserir uma conclusão interpretativa.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Então” articula naturalmente a sequência narrativa sem alterar a relação entre as orações. Os marcadores seguem imediatamente as expressões a que se referem.
