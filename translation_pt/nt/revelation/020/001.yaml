id: REV.20.1
reference: Revelation 20:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: pt
  text: E vi um anjo descendo do céu, com a chave do abismo[a] e uma grande corrente na mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poço sem fundo”. O grego traz “abismo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo simples e o fluxo paratático característico da sequência visionária de Apocalipse.
- source_word: εἶδον
  choice: vi
  rationale: Traduz diretamente o aoristo de ὁράω na narrativa visionária, sem ampliação interpretativa.
- source_word: ἄγγελον
  choice: um anjo
  rationale: O contexto aponta para um ser celestial, tornando “anjo” mais adequado que o sentido geral “mensageiro”.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: descendo do céu
  rationale: Expressão natural em português que preserva tanto a ação em curso do particípio quanto sua origem celestial.
- source_word: ἔχοντα
  choice: com
  rationale: Em português, “com” expressa de modo fluente que o anjo traz consigo a chave e a corrente, sem sugerir necessariamente que ambos estejam agarrados da mesma maneira.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: a chave do abismo
  rationale: Preserva naturalmente a construção genitiva e a associação específica entre a chave e o abismo.
- source_word: ἅλυσιν μεγάλην
  choice: uma grande corrente
  rationale: Mantém o substantivo e a dimensão ou imponência indicada por μεγάλην, em registro digno e corrente.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: na mão
  rationale: É a formulação idiomática em português para a imagem de algo carregado ou sustentado à mão; o referente masculino já está claro em “um anjo”.
theological_decisions:
- issue: Tradução de ἄβυσσος no contexto apocalíptico
  choice: abismo
  alternative: poço sem fundo
  rationale: “Abismo” representa diretamente o termo grego e preserva sua imagem sem acrescentar explicitamente a ideia de ausência de fundo, que não está lexicalizada no vocábulo deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com fluência natural para leitores brasileiros e ampla compreensão internacional. A coordenação simples preserva o ritmo visionário do original.
