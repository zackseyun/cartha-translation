id: REV.20.6
reference: Revelation 20:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: pt
  text: Feliz e santo é aquele que participa da primeira ressurreição. Sobre esses, a segunda morte não tem autoridade, mas eles serão sacerdotes de Deus e do Messias[a] e reinarão com ele durante mil anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Deus e de Cristo”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu sentido titular.'
    reason: Registra a alternativa tradicional para Χριστός e explica a escolha lexical sem alterar o sentido da frase.
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: É a forma tradicional e natural das bem-aventuranças em português, indicando a condição favorecida por Deus, não apenas uma emoção passageira.
- source_word: ἅγιος
  choice: santo
  rationale: Preserva tanto a ideia de consagração a Deus quanto a dimensão moral do termo.
- source_word: ὁ ἔχων μέρος
  choice: aquele que participa
  rationale: Expressa em português corrente a ideia de ter parte ou participação, preservando a forma singular representativa do grego.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: da primeira ressurreição
  rationale: Com o verbo 'participa', a preposição 'de' é idiomática em português e comunica com clareza a participação na primeira ressurreição.
- source_word: ἐπὶ τούτων
  choice: Sobre esses
  rationale: Mantém a imagem de domínio ou jurisdição e retoma os participantes da primeira ressurreição.
- source_word: ὁ δεύτερος θάνατος
  choice: a segunda morte
  rationale: Preserva literalmente a expressão apocalíptica recorrente.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: não tem autoridade
  rationale: Traduz a nuance de jurisdição ou direito de domínio de ἐξουσία, em vez de reduzi-la a mera capacidade ou força.
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: Equivalente direto que conserva a imagem cultual e sacerdotal.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: de Deus e do Messias
  rationale: Entende Χριστός em seu sentido titular, mantendo a distinção entre Deus e o Messias sem explicar além do texto.
- source_word: βασιλεύσουσιν
  choice: reinarão
  rationale: Equivalente direto e natural que preserva a participação régia.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Preserva a associação no reinado; no contexto imediato, o pronome retoma o Messias.
- source_word: χίλια ἔτη
  choice: durante mil anos
  rationale: Explicita de modo idiomático a duração indicada pelo acusativo temporal, sem impor uma interpretação escatológica.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona claramente como título na expressão paralela 'de Deus e do Messias'. A nota registra a alternativa tradicional sem resolver qualquer questão além da lexical.
- issue: Natureza da primeira ressurreição
  choice: primeira ressurreição
  alternative: interpretação espiritual ou corporal explicitada
  rationale: A tradução conserva a expressão sem definir sua natureza, pois o versículo não resolve por si só o debate interpretativo.
- issue: Duração milenar
  choice: durante mil anos
  alternative: leitura simbólica ou estritamente cronológica explicitada
  rationale: Mantém a duração declarada no texto sem importar um sistema milenar específico.
- issue: Referência coletiva após o singular
  choice: Sobre esses ... eles
  alternative: Sobre tal pessoa ... ela
  rationale: O singular representativo inicial passa naturalmente ao plural τούτων e aos verbos plurais no original; a tradução preserva essa mudança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva o tom solene da bem-aventurança e a terminologia apocalíptica, evitando arcaísmos e interpretações milenaristas acrescentadas.
