source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: pt
  text: Quando se completarem os mil anos, Satanás será solto da sua prisão,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal com o subjuntivo τελεσθῇ e aponta para um momento futuro esperado, sem acrescentar a ideia de repetição ou de sequência além do que o grego expressa.
- source_word: τελεσθῇ
  choice: se completarem
  rationale: O aoristo passivo de τελέω indica que o período definido chegará à sua conclusão. A construção portuguesa é natural e preserva o sentido de conclusão, embora empregue a forma pronominal idiomática.
- source_word: τὰ χίλια ἔτη
  choice: os mil anos
  rationale: O artigo definido retoma o período já mencionado no contexto. A tradução direta evita interpretar se os anos são literais ou simbólicos.
- source_word: λυθήσεται
  choice: será solto
  rationale: Preserva claramente o futuro passivo de λύω e, no contexto de encarceramento, comunica a retirada da restrição sem a conotação favorável que 'será libertado' poderia sugerir.
- source_word: ὁ Σατανᾶς
  choice: Satanás
  rationale: É a forma tradicional e amplamente compreendida em português para o nome ou título pessoal.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: da sua prisão
  rationale: φυλακή designa aqui o lugar de confinamento. A contração 'da' exprime naturalmente a saída 'de dentro de', e 'sua' preserva o possessivo sem sugerir propriedade, mas a prisão em que ele está confinado.
theological_decisions:
- issue: Natureza dos mil anos
  choice: Traduzir diretamente como 'os mil anos', sem definir se o período é literal ou simbólico.
  alternative: Explicitar um reinado literal de mil anos ou um longo período simbólico.
  rationale: O versículo menciona um período definido, mas não decide por si só entre os diferentes sistemas milenaristas; a tradução mantém essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Quando se completarem' é idiomático e mantém a relação temporal; 'será solto' transmite de modo simples o passivo futuro e combina naturalmente com 'prisão'.
