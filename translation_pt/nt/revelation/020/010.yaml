id: REV.20.10
reference: Revelation 20:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: pt
  text: E o diabo, que os enganava, foi lançado no lago de fogo e enxofre, onde também estão[a] a besta e o falso profeta; e eles serão atormentados dia e noite para todo o sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não traz verbo expresso nesta oração; “estão” é suprido pelo contexto.
    reason: grammatical_clarification
  - marker: b
    text: 'Mais literalmente: “para os séculos dos séculos”, expressão grega enfática de duração sem fim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: o diabo
  rationale: Em Apocalipse, funciona como designação pessoal estabelecida de Satanás. “O diabo” é a forma corrente e reconhecível em português.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: que os enganava
  rationale: O particípio presente substantivado caracteriza o diabo por sua atividade contínua; o imperfeito em português preserva esse aspecto durativo dentro da sequência narrativa.
- source_word: ἐβλήθη
  choice: foi lançado
  rationale: O passivo de βάλλω expressa aqui a ação de lançar alguém à força para o lugar de juízo. “Foi lançado” é natural e mantém essa força.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: lago de fogo e enxofre
  rationale: θεῖον significa “enxofre”. A formulação é clara e atual, preservando a imagem concreta sem recorrer ao termo menos acessível “pez” ou a formas arcaizantes.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: onde também estão a besta e o falso profeta
  rationale: A oração grega não contém verbo expresso. “Estão” completa naturalmente a frase e corresponde à presença continuada indicada pelo contexto de Apocalipse 19:20.
- source_word: θηρίον
  choice: a besta
  rationale: Equivalente consagrado e contextualmente estabelecido para a figura apocalíptica.
- source_word: ψευδοπροφήτης
  choice: o falso profeta
  rationale: Equivalente lexical direto e designação estabelecida no contexto de Apocalipse.
- source_word: βασανισθήσονται
  choice: serão atormentados
  rationale: No contexto de juízo, o verbo denota sofrimento intenso. “Atormentados” preserva o sentido sem especificar além do texto o modo do tormento.
- source_word: ἡμέρας καὶ νυκτός
  choice: dia e noite
  rationale: Reproduz a expressão idiomática de continuidade incessante em português natural.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: É uma expressão portuguesa natural e enfática para a duração sem fim comunicada pelo idiomatismo grego; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Duração do castigo final expressa por εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  alternative: pelos séculos dos séculos
  rationale: A tradução mantém a força máxima e natural do idiomatismo grego, sem atenuar sua apresentação de duração interminável nem extrapolar o que este versículo afirma.
- issue: Verbo implícito em ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: onde também estão a besta e o falso profeta
  alternative: onde também estavam a besta e o falso profeta
  rationale: Como o grego omite o verbo, o português exige uma complementação. O presente “estão” se harmoniza melhor com o contexto, no qual essas figuras já foram lançadas no lago e ali permanecem, sem transformar essa necessidade gramatical em afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os títulos apocalípticos tradicionais e a intensidade judicial do original, evitando arcaísmos desnecessários.
