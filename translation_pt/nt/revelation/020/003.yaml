id: REV.20.3
reference: Revelation 20:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: pt
  text: Ele o lançou no abismo[a], fechou o abismo e o selou por cima dele, para que não enganasse mais as nações[b], até que se completassem os mil anos. Depois disso, ele deve ser solto por pouco tempo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poço sem fundo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que não desencaminhasse mais as nações”.
    reason: lexical_alternative
  - marker: c
    text: Ou “deve ser libertado por um breve período”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: lançou
  rationale: O aoristo de βάλλω descreve uma colocação enérgica no abismo. “Lançou” conserva essa força e é corrente em português.
- source_word: ἄβυσσον
  choice: abismo
  rationale: Em Apocalipse, ἄβυσσος funciona como termo apocalíptico de lugar. “Abismo” preserva o conceito sem acrescentar a interpretação tradicional “poço sem fundo” ao texto principal.
- source_word: ἔκλεισεν
  choice: fechou o abismo
  rationale: κλείω significa fechar. A repetição explícita de “o abismo” evita que, em português, o pronome seja entendido como referência ao dragão, sem acrescentar a ideia não expressa de trancar.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: o selou por cima dele
  rationale: “Selou” representa diretamente σφραγίζω, e “por cima dele” conserva a relação espacial de ἐπάνω αὐτοῦ. O pronome “o” retoma “o abismo”, enquanto “dele” retoma o ser lançado nele.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: para que não enganasse mais as nações
  rationale: “Enganar” comunica o sentido comum de πλανάω neste contexto; “não... mais” representa ἔτι, e “as nações” traduz τὰ ἔθνη sem interpretação adicional.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: até que se completassem os mil anos
  rationale: A construção expressa o limite temporal até a conclusão do período. “Se completassem” mantém a voz não agentiva e soa natural em português.
- source_word: μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal do grego, com dignidade e clareza.
- source_word: δεῖ
  choice: deve
  rationale: “Deve” preserva a necessidade indicada por δεῖ sem explicar sua origem ou mecanismo.
- source_word: λυθῆναι αὐτὸν
  choice: ele deve ser solto
  rationale: O passivo de λύω indica ser desatado ou libertado da restrição. “Ser solto” combina naturalmente com o aprisionamento descrito no contexto.
- source_word: μικρὸν χρόνον
  choice: por pouco tempo
  rationale: A expressão é um acusativo de duração e indica um período limitado; “por pouco tempo” é conciso e corrente.
theological_decisions:
- issue: Natureza dos “mil anos”
  choice: Traduzir diretamente como “os mil anos”, sem qualificação interpretativa.
  alternative: Explicitar um milênio literal ou um longo período simbólico.
  rationale: O grego não resolve no próprio enunciado a disputa entre leituras literais e simbólicas; a tradução preserva essa abertura.
- issue: Força de δεῖ no contexto apocalíptico
  choice: Traduzir por “deve”, mantendo a ideia de necessidade.
  alternative: Explicar a necessidade como decreto divino ou como simples inevitabilidade narrativa.
  rationale: O termo exprime necessidade, mas o versículo não especifica sua natureza; “deve” conserva a tensão sem importar um sistema teológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “o abismo” é deliberada para evitar ambiguidade pronominal. A ordem e as relações temporais do grego foram preservadas sem resolver questões milenaristas.
