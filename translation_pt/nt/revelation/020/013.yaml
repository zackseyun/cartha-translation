reference: Revelation 20:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: pt
  text: E o mar entregou os mortos que nele estavam, e a Morte e o Hades[a] entregaram os mortos que neles estavam; e cada um foi julgado de acordo com as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a morada dos mortos”. O termo grego é ᾅδης (Hades), distinto de outros termos muitas vezes traduzidos como “inferno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: entregou / entregaram
  rationale: Neste contexto, δίδωμι descreve o mar, a Morte e o Hades cedendo os mortos para o julgamento. “Entregar” é natural em português e preserva a ideia de dar ou liberar sem acrescentar uma explicação ausente do grego.
- source_word: ἡ θάλασσα
  choice: o mar
  rationale: Equivalente corrente e direto para θάλασσα, com o artigo definido preservado.
- source_word: τοὺς νεκρούς
  choice: os mortos
  rationale: O adjetivo substantivado é expresso de modo idiomático e digno em português.
- source_word: τοὺς ἐν αὐτῇ
  choice: que nele estavam
  rationale: A oração relativa explicita naturalmente em português quais mortos são mencionados, preservando a referência singular ao mar.
- source_word: ὁ θάνατος
  choice: a Morte
  rationale: A inicial maiúscula sinaliza a personificação apocalíptica de θάνατος ao lado do Hades, sem transformá-lo em um nome próprio no texto grego.
- source_word: ὁ ᾅδης
  choice: o Hades
  rationale: A transliteração mantém a identidade lexical de ᾅδης e evita confundi-lo com termos associados ao castigo final. O artigo é natural em português.
- source_word: τοὺς ἐν αὐτοῖς
  choice: que neles estavam
  rationale: O plural retoma corretamente a Morte e o Hades.
- source_word: ἐκρίθησαν ἕκαστος
  choice: cada um foi julgado
  rationale: A formulação distributiva singular é natural em português e preserva a individualização expressa por ἕκαστος, embora o verbo grego esteja no plural.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: de acordo com as suas obras
  rationale: “Obras” preserva o valor lexical de ἔργα e a expressão bíblica recorrente do julgamento segundo as obras. “Suas” mantém a referência coletiva no contexto, enquanto “cada um” distribui o julgamento individualmente.
theological_decisions:
- issue: Tradução de ᾅδης no contexto do julgamento escatológico
  choice: Hades
  alternative: morada dos mortos; inferno
  rationale: “Hades” preserva a distinção entre ᾅδης e a imagem posterior do lago de fogo no contexto imediato. “Inferno” importaria associações teológicas não exigidas pelo termo grego; “morada dos mortos” é uma alternativa explicativa legítima, registrada em nota.
- issue: Personificação de θάνατος
  choice: Morte
  alternative: morte
  rationale: A inicial maiúscula torna perceptível a personificação da imagem apocalíptica, na qual a Morte age juntamente com o Hades, sem acrescentar uma definição doutrinária.
- issue: Critério do julgamento em κατὰ τὰ ἔργα αὐτῶν
  choice: de acordo com as suas obras
  alternative: segundo os seus atos; com base no que fizeram
  rationale: A formulação mantém a afirmação do texto e sua tensão teológica sem explicar como as obras se relacionam com outras afirmações bíblicas sobre salvação e julgamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida do grego foi preservada, mas empregou-se ponto e vírgula antes da conclusão para facilitar a leitura. O marcador [a] aparece imediatamente após “Hades”, que é o termo explicado pela nota.
