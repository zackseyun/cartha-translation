id: REV.20.11
reference: Revelation 20:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: pt
  text: E vi um grande trono branco e aquele que estava sentado nele, de cuja presença[a] fugiram a terra e o céu, e não se achou lugar para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “de cujo rosto fugiram a terra e o céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: um grande trono branco
  rationale: Conserva a sequência descritiva do grego em português natural; “grande” comunica tanto magnitude quanto majestade.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: aquele que estava sentado nele
  rationale: Mantém a identidade da figura entronizada sem especificá-la além do texto e soa natural no contexto de um trono.
- source_word: οὗ ἀπὸ τοῦ προσώπου
  choice: de cuja presença
  rationale: Expressa idiomaticamente o sentido de fugir de diante da pessoa entronizada, enquanto a nota registra a imagem literal de “rosto”.
- source_word: ἔφυγεν
  choice: fugiram
  rationale: Preserva a imagem vívida de φεύγω e concorda naturalmente com o sujeito composto “a terra e o céu”.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: a terra e o céu
  rationale: Reproduz os dois substantivos definidos e usa “céu”, mais apropriado que “firmamento” ou “atmosfera” neste contexto apocalíptico.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: não se achou lugar para eles
  rationale: Mantém a construção passiva e o tom solene do grego, com referência clara à terra e ao céu.
theological_decisions:
- issue: Identidade daquele que está sentado no trono
  choice: Mantida implícita em “aquele que estava sentado nele”
  alternative: Identificá-lo explicitamente como Deus, o Pai, o Messias ou o Juiz divino
  rationale: O versículo não nomeia a figura entronizada; a formulação descritiva preserva a tensão teológica e evita acrescentar uma identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se achou lugar” preserva a solenidade bíblica sem recorrer a linguagem arcaica; a nota mantém visível a metáfora literal de πρόσωπον.
