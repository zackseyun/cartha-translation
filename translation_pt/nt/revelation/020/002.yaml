  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: pt
  text: Ele agarrou o dragão — a antiga serpente[a], que é o Diabo e Satanás — e o amarrou por mil anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a serpente antiga» ou «aquela serpente de outrora».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: agarrou
  rationale: Expressa a ação vigorosa de apoderar-se ou segurar, preservando a vivacidade do aoristo de κρατέω em português natural.
- source_word: δράκοντα
  choice: dragão
  rationale: Equivalente consagrado de δράκων no contexto apocalíptico e coerente com a imagética interna de Apocalipse.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: a antiga serpente
  rationale: Preserva a identificação apositiva e os artigos gregos em uma formulação clara e natural; a alternativa «a serpente antiga» também é possível.
- source_word: Διάβολος
  choice: o Diabo
  rationale: Mantém o título reconhecível e emprega o artigo exigido pelo uso idiomático do português nesta construção.
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Forma tradicional portuguesa do nome ou título semítico transliterado.
- source_word: ἔδησεν
  choice: prendeu
  rationale: Comunica o ato concreto de amarrar ou pôr sob restrição sem especificar indevidamente o modo; no contexto, soa mais natural do que «atou».
- source_word: χίλια ἔτη
  choice: por mil anos
  rationale: Representa diretamente o acusativo de duração, sem decidir se o período deve ser entendido literal ou simbolicamente.
theological_decisions:
- issue: Natureza dos mil anos
  choice: Traduzir χίλια ἔτη diretamente como «mil anos».
  alternative: Interpretar explicitamente o período como literal ou simbólico.
  rationale: O texto declara a duração sem explicar aqui sua natureza; a tradução preserva essa tensão interpretativa.
- issue: Identificação do dragão
  choice: 'Manter toda a cadeia de identificações: o dragão, a antiga serpente, o Diabo e Satanás.'
  alternative: Resumir ou fundir os títulos em uma única designação.
  rationale: A própria frase grega apresenta todas essas designações, que devem permanecer distintas e completas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam a identificação apositiva sem alterar a sintaxe do versículo.
