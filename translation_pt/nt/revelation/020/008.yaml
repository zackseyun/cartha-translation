id: REV.20.8
reference: Revelation 20:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: pt
  text: e sairá para enganar[a] as nações que estão nos quatro cantos da terra — Gogue e Magogue[b] — e para reuni-las para a guerra[c]. O número delas é como a areia do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desviar».'
    reason: lexical_alternative
  - marker: b
    text: «Gogue e Magogue» remete a Ezequiel 38–39 e pode funcionar aqui como uma designação tipológica das nações reunidas na rebelião final.
    reason: cross_reference
  - marker: c
    text: 'Ou: «para a batalha». O termo grego pode significar «guerra» ou «batalha».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: sairá
  rationale: Futuro de ἐξέρχομαι; conserva a imagem de movimento e, pelo contexto do v. 7, tem Satanás como sujeito implícito.
- source_word: πλανῆσαι
  choice: enganar
  rationale: Equivalente corrente e natural de πλανάω no contexto; a alternativa «desviar» é registrada em nota.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Representa grupos humanos coletivamente e evita restringir o sentido a gentios em contraste com judeus.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: que estão nos quatro cantos da terra
  rationale: Mantém a expressão figurada tradicional para os extremos do mundo habitado, em português natural.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gogue e Magogue
  rationale: Emprega as formas portuguesas tradicionais dos nomes e preserva sua função apositiva em relação às nações.
- source_word: συναγαγεῖν
  choice: reuni-las
  rationale: Expressa a finalidade coordenada e explicita por pronome o objeto feminino plural, as nações.
- source_word: εἰς τὸν πόλεμον
  choice: para a guerra
  rationale: Preserva o sentido amplo de πόλεμος sem decidir se se trata especificamente de uma única batalha.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: O número delas
  rationale: Converte a construção relativa redundante do grego em uma frase portuguesa clara, mantendo o referente nas nações reunidas.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: é como a areia do mar
  rationale: Conserva a comparação bíblica de incontável multidão e sua ressonância intertextual.
theological_decisions:
- issue: Referente do sujeito implícito de «sairá»
  choice: Satanás, retomado do versículo anterior, permanece implícito.
  alternative: Repetir explicitamente «Satanás».
  rationale: A continuidade gramatical com Apocalipse 20:7 identifica o sujeito; não é necessário acrescentar um nome ausente deste versículo.
- issue: Função de «Gogue e Magogue»
  choice: Identificação apositiva das nações enganadas.
  alternative: Entender os nomes apenas como dois indivíduos ou definir de modo estrito sua referência geográfica ou simbólica.
  rationale: A redação preserva a alusão a Ezequiel 38–39 sem resolver se os nomes têm sentido simbólico, tipológico ou etnogeográfico estrito.
- issue: Sentido de πόλεμος
  choice: «guerra»
  alternative: «batalha»
  rationale: Ambos são lexicalmente possíveis; «guerra» mantém o sentido mais amplo e evita antecipar uma especificidade não exigida pelo versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a coordenação do grego são preservadas sem produzir uma frase artificial; a construção relativa final foi dividida em nova oração para maior clareza.
