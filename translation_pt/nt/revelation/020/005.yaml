  source_fidelity: A tradução preserva com precisão o contraste de οἱ λοιποὶ τῶν νεκρῶν (“Os demais mortos”), o sentido ingressivo contextual de οὐκ ἔζησαν (“não voltaram à vida”), o limite temporal de ἄχρι τελεσθῇ e a declaração final sem restringir o referente de αὕτη. “Até que se completassem os mil anos” é uma reprodução fiel e idiomática do subjuntivo temporal grego.
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. “Os demais mortos” e “voltaram à vida” soam naturais neste registro bíblico sem serem excessivamente formais.
  terminology: “Ressurreição” é o equivalente estabelecido e apropriado para ἀνάστασις. A opção “voltaram à vida” comunica o uso de ζάω no contexto imediato sem impor uma interpretação escatológica específica. A nota lexical oferece de modo adequado a alternativa mais literal “não viveram”.
