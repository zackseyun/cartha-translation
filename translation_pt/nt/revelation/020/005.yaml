id: REV.20.5
reference: Revelation 20:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: pt
  text: Os demais mortos não voltaram à vida até que se completassem os mil anos.[a] Esta é a primeira ressurreição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não viveram até que se completassem os mil anos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: os demais mortos
  rationale: Expressa de modo natural o grupo restante, em contraste com os mencionados anteriormente, e mantém o sentido coletivo de νεκροί.
- source_word: οὐκ ἔζησαν
  choice: não voltaram à vida
  rationale: Neste contexto de ressurreição, o aoristo de ζάω tem sentido ingressivo. “Voltaram à vida” é claro em português e não acrescenta uma explicação doutrinária.
- source_word: ἄχρι τελεσθῇ
  choice: até que se completassem
  rationale: Preserva o limite temporal introduzido por ἄχρι e o caráter passivo e completivo de τελεσθῇ; o subjuntivo imperfeito é natural após uma oração principal no passado.
- source_word: τὰ χίλια ἔτη
  choice: os mil anos
  rationale: Tradução direta da expressão definida, que remete ao período já mencionado no contexto.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: Esta é a primeira ressurreição
  rationale: Mantém o demonstrativo sem estreitar seu referente e traduz ἀνάστασις e o adjetivo atributivo πρώτη de maneira direta e consagrada.
theological_decisions:
- issue: Referente de “Esta é a primeira ressurreição”
  choice: O demonstrativo permanece amplo e aponta para a realidade descrita no contexto, sem especificar um sistema milenar.
  alternative: Restringi-lo aos mártires do versículo 4, ampliá-lo a todos os justos mortos ou interpretá-lo explicitamente como ressurreição espiritual.
  rationale: O grego não resolve essas propostas interpretativas; a tradução deve conservar a tensão escatológica do texto.
- issue: Sentido de ἔζησαν no contexto
  choice: “voltaram à vida”, como linguagem de revivificação no contexto imediato de ressurreição
  alternative: “viveram” ou uma formulação que explicite vida espiritual
  rationale: O contexto favorece o sentido ingressivo, mas a tradução evita desenvolver uma doutrina além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita terminologia confessional e preserva a ambiguidade do referente de “Esta”.
