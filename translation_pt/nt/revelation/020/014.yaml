source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: pt
  text: E a Morte e o Hades[a] foram lançados no lago de fogo. Esta é a segunda morte, o lago de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sepultura”. O termo grego é “Hades”, aqui distinto do “lago de fogo”; por isso, “inferno”, embora usado em algumas traduções, pode ser enganoso neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: Morte / morte
  rationale: Na primeira oração, a inicial maiúscula sinaliza a personificação apocalíptica ao lado do Hades; em “segunda morte”, a minúscula preserva a expressão que designa o juízo ou estado.
- source_word: ᾅδης
  choice: Hades
  rationale: A transliteração preserva o termo grego e sua distinção contextual em relação ao lago de fogo, sem o confundir com “inferno” nem o reduzir simplesmente à sepultura.
- source_word: ἐβλήθησαν
  choice: foram lançados
  rationale: Reproduz de modo natural e digno o aoristo passivo de βάλλω e comunica a consignação forçada.
- source_word: λίμνη τοῦ πυρός
  choice: lago de fogo
  rationale: Tradução transparente da construção genitiva, preservando a imagem apocalíptica estabelecida e sua repetição no versículo.
- source_word: οὗτος
  choice: Esta é
  rationale: Mantém explicitamente a afirmação identificadora do demonstrativo, com concordância natural com “morte” em português.
- source_word: θάνατος ὁ δεύτερος
  choice: a segunda morte
  rationale: Forma portuguesa natural para a expressão grega articulada, preservando a designação apocalíptica.
theological_decisions:
- issue: Tradução de ᾅδης no contexto do juízo escatológico
  choice: Hades
  alternative: sepultura; inferno
  rationale: O próprio versículo distingue o Hades do lago de fogo. “Inferno” poderia fundir imagens distintas, enquanto “sepultura” estreitaria indevidamente o alcance possível do termo.
- issue: Personificação de θάνατος
  choice: “Morte” com maiúscula na primeira oração e “morte” com minúscula em “segunda morte”
  alternative: minúscula ou maiúscula em ambas as ocorrências
  rationale: A primeira ocorrência apresenta a Morte ao lado do Hades como entidade submetida à ação; a segunda integra uma expressão que designa uma realidade de juízo. A diferenciação conserva a força literária sem impor uma doutrina adicional.
- issue: Relação entre “a segunda morte” e “o lago de fogo”
  choice: aposição com vírgula
  alternative: dois-pontos ou “isto significa”
  rationale: A vírgula preserva a aposição do grego e sua possível força identificadora sem tornar a explicação mais explícita do que o texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “Hades” como termo técnico explicado em nota, a personificação de “Morte” e a repetição enfática de “lago de fogo” do grego.
