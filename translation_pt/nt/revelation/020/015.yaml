  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: pt
  text: E, se alguém não foi encontrado inscrito no livro[c] da vida[a], foi lançado no lago de fogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no rolo da vida”. A palavra grega pode designar um livro ou um rolo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “essa pessoa foi lançada no lago de fogo”. O grego emprega aqui formas masculinas no singular com sentido representativo.'
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos omitem “no livro”.
    reason: textual_variant
lexical_decisions:
- source_word: εἴ τις
  choice: se alguém
  rationale: Expressa de modo natural em português a condição indefinida e geral do grego.
- source_word: οὐχ εὑρέθη
  choice: não foi encontrado
  rationale: Mantém o aoristo passivo e o caráter judicial ou revelador da constatação, sem acrescentar interpretação.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: no livro da vida
  rationale: É uma tradução direta e consagrada da expressão; βίβλος também pode designar um rolo, possibilidade registrada em nota.
- source_word: γεγραμμένος
  choice: inscrito
  rationale: Em português, “encontrado inscrito no livro” comunica com clareza o estado resultante expresso pelo particípio perfeito passivo, de maneira mais idiomática do que “encontrado escrito”.
- source_word: ἐβλήθη
  choice: foi lançado
  rationale: Preserva o passivo e a ideia de lançamento forçado, em linguagem atual e digna.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: no lago de fogo
  rationale: “Lançar em/no” é idiomático em português, e “lago de fogo” preserva sem explicação adicional a imagem apocalíptica.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: alguém ... inscrito ... foi lançado
  rationale: Conserva o referente individual indefinido e a concordância masculina singular representativa do grego, sem inserir um pronome desnecessário em português.
theological_decisions:
- issue: Masculino singular representativo
  choice: alguém ... inscrito ... foi lançado
  alternative: essa pessoa ... inscrita ... foi lançada
  rationale: A formulação principal acompanha as formas masculinas singulares do grego e é natural em português; a alternativa torna explícito o referente de modo lexicalmente inclusivo, sem mudar seu caráter individual.
- issue: Imagem do juízo final
  choice: lago de fogo
  alternative: lago ardente
  rationale: A tradução mantém a imagem apocalíptica estabelecida no texto e evita definir, além do que o versículo diz, a natureza do castigo final.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas “inscrito” evita a construção pouco natural “encontrado escrito”. Os marcadores [a] e [b] aparecem no texto principal.
