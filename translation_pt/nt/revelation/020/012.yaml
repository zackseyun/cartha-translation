id: REV.20.12
reference: Revelation 20:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: pt
  text: E vi os mortos, os grandes e os pequenos, em pé diante do trono. Abriram-se livros; e abriu-se outro livro, que é o livro da vida. Os mortos foram julgados com base no que estava escrito nos livros[a], segundo as suas obras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Livros” também pode ser traduzido por “rolos”, refletindo o suporte escrito usado na Antiguidade.
    reason: cultural_note
  - marker: b
    text: 'Ou: “segundo os seus atos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: os mortos
  rationale: Adjetivo substantivado que designa coletivamente as pessoas falecidas; a formulação é idiomática, concisa e solene em português.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: os grandes e os pequenos
  rationale: Preserva o merismo grego que abrange pessoas de toda posição social, sem explicitar interpretativamente 'importantes' e 'insignificantes'.
- source_word: ἑστῶτας
  choice: em pé
  rationale: Expressa com naturalidade o estado resultante do particípio perfeito de ἵστημι e a postura dos mortos diante do trono.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: diante do trono
  rationale: Tradução direta de ἐνώπιον, sem transformar interpretativamente θρόνος em 'tribunal'.
- source_word: βιβλία
  choice: livros
  rationale: Equivalente amplo e tradicional; no contexto antigo, o termo também pode designar rolos, possibilidade registrada em nota.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: abriram-se / abriu-se
  rationale: A construção pronominal conserva o sentido passivo dos aoristos e soa natural em português narrativo.
- source_word: ἄλλο βιβλίον
  choice: outro livro
  rationale: Apresenta um livro adicional e distinto dos anteriormente mencionados.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: que é o livro da vida
  rationale: Repõe 'livro', subentendido na expressão grega elíptica, para produzir português claro.
- source_word: ἐκρίθησαν
  choice: foram julgados
  rationale: Mantém o sentido judicial de κρίνω sem antecipar o resultado como condenação.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: com base no que estava escrito nos livros
  rationale: Comunica que o conteúdo registrado constitui a base do julgamento e preserva o estado resultante expresso pelo particípio perfeito.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: segundo as suas obras
  rationale: Mantém a formulação explícita e ampla do grego, bem como suas ressonâncias bíblicas, sem reduzi-la a atos isolados.
theological_decisions:
- issue: Julgamento segundo as obras
  choice: segundo as suas obras
  alternative: segundo o que tinham feito
  rationale: O texto declara diretamente que o julgamento ocorre segundo as obras. A tradução preserva essa tensão teológica sem harmonizá-la com uma síntese doutrinária externa.
- issue: Sentido de κρίνω
  choice: foram julgados
  alternative: foram condenados
  rationale: O verbo especifica o ato judicial, não necessariamente um veredito particular; 'condenados' resolveria além do que esta oração afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do original foram preservadas quando naturais; a pontuação foi ajustada para fluidez. Os marcadores [a] e [b] aparecem no texto junto aos termos que efetivamente explicam.
