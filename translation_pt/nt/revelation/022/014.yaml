id: REV.22.14
reference: Revelation 22:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: pt
  text: Felizes os que lavam suas vestes[a][b], para que tenham direito à árvore da vida e entrem na cidade pelos portões[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Felizes os que cumprem os seus mandamentos”, ou “guardam os seus mandamentos”, em vez de “lavam suas vestes”.'
    reason: textual_variant
  - marker: b
    text: A imagem de lavar as vestes retoma Apocalipse 7:14, onde elas são lavadas e branqueadas no sangue do Cordeiro.
    reason: cross_reference
  - marker: c
    text: 'Ou: “através dos portões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Felizes
  rationale: Fórmula natural e reconhecível das bem-aventuranças em português; comunica a condição favorecida por Deus sem reduzi-la a um sentimento passageiro.
- source_word: πλύνοντες
  choice: os que lavam
  rationale: Preserva a imagem concreta do verbo e o valor caracterizador do particípio presente, sem substituir o ato por uma interpretação como 'purificam'.
- source_word: στολὰς
  choice: vestes
  rationale: Termo corrente, digno e apropriado à indumentária simbólica das visões de Apocalipse; é mais amplamente natural em português do que 'túnicas'.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a relação de propósito ou resultado, preservando a conexão entre as duas partes do versículo.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: tenham direito
  rationale: Formulação idiomática em português para a ideia de acesso legítimo. O subjuntivo após 'para que' representa naturalmente a construção grega com ἵνα e futuro.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: à árvore da vida
  rationale: Com ἐξουσία, a preposição indica direito de acesso, não domínio sobre a árvore. 'Árvore da vida' é a expressão bíblica consagrada e adequada a ξύλον neste contexto.
- source_word: τοῖς πυλῶσιν
  choice: pelos portões
  rationale: O dativo indica o caminho ou meio de entrada. 'Pelos portões' é natural e mantém a referência às entradas monumentais da cidade.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: entrem na cidade
  rationale: Tradução direta e idiomática do aoristo subjuntivo dependente de ἵνα.
theological_decisions:
- issue: Variante textual na primeira oração
  choice: 'Traduzir a leitura do SBLGNT: ''os que lavam suas vestes''.'
  alternative: '''os que cumprem os seus mandamentos'' ou ''os que guardam os seus mandamentos'''
  rationale: O texto grego fornecido traz πλύνοντες τὰς στολὰς αὐτῶν. A variante tradicional é teologicamente relevante e, por isso, é registrada em nota, mas não substitui a leitura da edição-fonte no texto principal.
- issue: Relação entre lavar as vestes e o acesso à vida
  choice: Manter a relação afirmada pelo versículo sem explicar no texto principal o mecanismo teológico.
  alternative: Interpretar explicitamente o lavar como obra meritória ou acrescentar no texto principal que as vestes são lavadas no sangue do Cordeiro.
  rationale: O versículo associa os que lavam suas vestes ao direito à árvore da vida e à entrada na cidade, mas não desenvolve aqui como isso ocorre. A tradução preserva essa tensão, e uma nota aponta o paralelo de Apocalipse 7:14.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ''Felizes'' mantém a fórmula das bem-aventuranças; ''vestes'', ''árvore da vida'' e ''portões'' preservam a linguagem visionária sem arcaísmo excessivo. Os marcadores foram colocados junto aos elementos que explicam: [a] e [b] após ''vestes'', e [c] após ''portões''.'
