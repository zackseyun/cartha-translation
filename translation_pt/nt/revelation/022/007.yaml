id: REV.22.7
reference: Revelation 22:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: pt
  text: E eis que venho em breve.[a] Feliz aquele que guarda as palavras da profecia deste livro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rapidamente”. O grego pode destacar tanto a proximidade temporal (“em breve”) quanto a rapidez ou subitaneidade da vinda.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “deste rolo”.'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função dêitica e enfática do marcador, chamando solenemente a atenção sem recorrer a uma formulação excessivamente arcaica.
- source_word: ἔρχομαι
  choice: venho
  rationale: O presente grego tem força futura no contexto. O presente português comunica de modo natural uma vinda anunciada como iminente.
- source_word: ταχύ
  choice: em breve
  rationale: No contexto, expressa mais naturalmente proximidade temporal. A possibilidade de indicar rapidez ou subitaneidade é preservada em nota.
- source_word: μακάριος
  choice: Feliz
  rationale: Formulação clara e corrente para uma bem-aventurança, indicando a condição favorecida da pessoa, e não apenas uma emoção passageira.
- source_word: ὁ τηρῶν
  choice: aquele que guarda
  rationale: Reproduz o particípio substantivado de modo genérico e preserva o campo semântico de conservar, observar e pôr em prática, sem reduzi-lo somente a obedecer.
- source_word: τοὺς λόγους
  choice: as palavras
  rationale: Mantém o plural concreto do grego; “mensagem” resumiria de forma interpretativa o conteúdo da profecia.
- source_word: τῆς προφητείας
  choice: da profecia
  rationale: Conserva a categoria profética e a relação genitiva direta do texto.
- source_word: τοῦ βιβλίου τούτου
  choice: deste livro
  rationale: É a forma moderna e idiomática para a autorreferência da obra, embora βιβλίον também possa designar um rolo no contexto antigo.
theological_decisions:
- issue: Identidade de quem diz “venho em breve”
  choice: Não acrescentar um nome ao sujeito implícito da primeira pessoa
  alternative: Explicitar “Jesus” no corpo do versículo
  rationale: O grego traz apenas a fala em primeira pessoa. A identidade do falante deve ser reconhecida pelo contexto literário, sem que a tradução insira um nome ausente do versículo.
- issue: Sentido de τηρέω em relação à profecia
  choice: “guarda”, preservando uma gama que inclui conservar, observar e cumprir
  alternative: “obedece”, que explicita apenas a dimensão de cumprimento
  rationale: A opção evita estreitar a exortação e mantém a amplitude lexical e teológica do verbo grego.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Eis que” conserva o tom proclamativo do texto apocalíptico; “Feliz” evita arcaísmo desnecessário, mantendo a forma de bem-aventurança. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
