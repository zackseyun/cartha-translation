id: REV.22.17
reference: Revelation 22:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: pt
  text: 'E o Espírito e a noiva dizem: “Venha!” E quem ouve diga: “Venha!”[a] Que quem tem sede venha; e quem deseja receba de graça a água da vida.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois primeiros chamados — “Venha!” — são frequentemente entendidos como um apelo pela vinda do Senhor; a partir da frase seguinte, o convite é dirigido a quem tem sede e deseja receber vida.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “gratuitamente” ou “como dádiva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Neste contexto de Apocalipse, a expressão com artigo refere-se mais naturalmente ao Espírito Santo. A inicial maiúscula indica essa referência em português, sem corresponder a uma distinção gráfica no grego.
- source_word: ἡ νύμφη
  choice: a noiva
  rationale: Preserva a imagem simbólica de Apocalipse sem substituí-la por uma identificação interpretativa, como igreja, povo de Deus ou nova Jerusalém.
- source_word: λέγουσιν
  choice: dizem
  rationale: O presente do indicativo é expresso pelo presente simples, natural em português e adequado à proclamação viva do texto.
- source_word: Ἔρχου
  choice: Venha!
  rationale: Traduz o imperativo singular como um chamado direto. “Venha” tem ampla legibilidade no português moderno e evita restringir o texto a regiões onde “vem” é a forma habitual de tratamento.
- source_word: ὁ ἀκούων
  choice: quem ouve
  rationale: Expressão genérica, concisa e natural para o particípio substantivado, sem marcar gênero.
- source_word: εἰπάτω
  choice: diga
  rationale: O imperativo de terceira pessoa é traduzido de modo direto e idiomático.
- source_word: ὁ διψῶν
  choice: quem tem sede
  rationale: Preserva a metáfora da sede e exprime naturalmente o particípio substantivado.
- source_word: ἐρχέσθω
  choice: Que ... venha
  rationale: A construção com “que” deixa clara a força do imperativo de terceira pessoa e distingue sintaticamente esta convocação dos dois chamados diretos anteriores.
- source_word: ὁ θέλων
  choice: quem deseja
  rationale: Reflete o querer ou desejar expresso por θέλω sem acrescentar um objeto que não aparece explicitamente no grego.
- source_word: λαβέτω
  choice: receba
  rationale: λαμβάνω pode significar tomar ou receber. “Receba” é natural em português no contexto de uma dádiva oferecida gratuitamente e mantém a força imperativa.
- source_word: ὕδωρ ζωῆς
  choice: a água da vida
  rationale: Reproduz diretamente a construção genitiva e preserva a expressão joanina, sem alterá-la para “água viva”.
- source_word: δωρεάν
  choice: de graça
  rationale: Expressão corrente e clara para algo dado sem custo, adequada ao registro acessível e digno do versículo.
theological_decisions:
- issue: Identidade do destinatário de “Venha!”
  choice: Os dois primeiros chamados permanecem sem objeto explícito; a cláusula seguinte passa a convidar quem tem sede.
  alternative: Explicitar que os dois primeiros chamados são dirigidos ao Senhor, ou entender todos os chamados como convite ao sedento.
  rationale: O grego repete o imperativo de segunda pessoa sem nomear o destinatário e depois muda para imperativos de terceira pessoa. A tradução preserva essa tensão literária e teológica.
- issue: Referente simbólico de “a noiva”
  choice: Manter a imagem “a noiva” sem explicação no texto principal.
  alternative: Traduzir interpretativamente como “a igreja”, “o povo de Deus” ou “a nova Jerusalém”.
  rationale: A imagem em Apocalipse reúne associações que não devem ser reduzidas a uma única identificação na tradução.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. O texto mantém solenidade sem arcaísmos, usa construções genéricas inclusivas (“quem ouve”, “quem tem sede”, “quem deseja”) e preserva a concisão e o paralelismo do grego.
