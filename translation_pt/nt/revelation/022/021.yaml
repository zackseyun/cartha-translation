  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: pt
  text: A graça do Senhor Jesus esteja com todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “A graça do Senhor Jesus esteja com todos os santos”; outros: “com todos vocês”.'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado no Novo Testamento para a benevolência e o favor divinos; numa bênção final, preserva sua ressonância relacional e salvífica sem paráfrase.
- source_word: κυρίου
  choice: Senhor
  rationale: Título cristológico estabelecido e adequado para κύριος neste contexto.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Transliteração portuguesa tradicional do nome próprio.
- source_word: μετὰ
  choice: esteja com
  rationale: O grego não traz verbo expresso; em português, a fórmula de bênção pede naturalmente o subjuntivo “esteja”, uma complementação mínima indicada pelo contexto.
- source_word: πάντων
  choice: todos
  rationale: Mantém o sentido amplo e não qualificado do texto do SBLGNT, sem acrescentar “vocês” nem “os santos”.
theological_decisions:
- issue: Se devem ser especificados os destinatários implícitos da bênção
  choice: 'Manter o objeto implícito: “com todos”'
  alternative: “com todos vocês” ou “com todos os santos”
  rationale: O texto grego adotado termina apenas com πάντων, “todos”. Especificar “vocês” resolveria uma referência que permanece implícita, enquanto “os santos” pertence a uma variante textual. A tradução preserva a amplitude da leitura adotada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão da bênção grega foram preservadas; “esteja” foi suprido por exigência idiomática do português.
