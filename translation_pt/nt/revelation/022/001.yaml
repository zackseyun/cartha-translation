source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: pt
  text: E ele me mostrou um rio de água da vida, brilhante como cristal, fluindo do trono de Deus e do Cordeiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: me mostrou
  rationale: Expressa diretamente o aoristo de δείκνυμι com o dativo μοι, preservando a cena visionária em português natural.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: um rio da água da vida
  rationale: Mantém a imagem e a cadeia genitiva do grego. O artigo indefinido corresponde naturalmente ao substantivo anartro ποταμόν, sem transformar a expressão em paráfrase interpretativa.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: brilhante como cristal
  rationale: λαμπρός indica brilho ou luminosidade, e ὡς introduz uma comparação. A tradução evita substituir o brilho por uma ideia explícita de transparência.
- source_word: ἐκπορευόμενον
  choice: que fluía
  rationale: O particípio presente descreve o rio em movimento contínuo; “fluía” é vívido e idiomático no contexto de um rio.
- source_word: ἐκ τοῦ θρόνου
  choice: do trono
  rationale: Expressa a origem indicada por ἐκ de modo natural em português.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: de Deus e do Cordeiro
  rationale: Preserva os dois genitivos coordenados e mantém “Cordeiro” como título cristológico central em Apocalipse.
theological_decisions:
- issue: A imagem de um trono compartilhado por Deus e pelo Cordeiro
  choice: do trono de Deus e do Cordeiro
  alternative: dos tronos de Deus e do Cordeiro
  rationale: O grego emprega “trono” no singular com dois genitivos coordenados. A tradução conserva essa formulação e sua força teológica sem explicá-la nem convertê-la em plural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura permanece próxima do grego sem rigidez excessiva.
