  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: pt
  text: No meio da rua da cidade e, de um lado e do outro do rio, estava a árvore da vida[a], produzindo doze frutos[b] e dando o seu fruto a cada mês.[c] As folhas da árvore servem para a cura das nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A descrição é condensada: o texto grego fala de uma única árvore situada no meio da rua e «de um lado e do outro» do rio, sem explicar como visualizar essa disposição.'
    reason: syntactical_ambiguity
  - marker: b
    text: Ou, possivelmente, «doze tipos de fruto». O grego diz literalmente «doze frutos».
    reason: lexical_alternative
  - marker: c
    text: A imagem retoma a árvore da vida de Gênesis 2:9 e a árvore que dá fruto todos os meses em Ezequiel 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: No meio da rua da cidade
  rationale: πλατεία designa uma rua larga ou espaço público urbano. “Rua” é natural no contexto da cidade; “da cidade” explicita apenas o referente contextual de αὐτῆς e evita a ambiguidade pouco natural de “sua rua” em português.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: de um lado e do outro do rio
  rationale: Reproduz a expressão espacial distributiva e preserva a imagem de ambos os lados sem transformar o singular ξύλον em plural.
- source_word: ξύλον ζωῆς
  choice: a árvore da vida
  rationale: Embora ξύλον também possa significar madeira, a referência à árvore do Éden e o uso no Apocalipse favorecem claramente “árvore”. O artigo definido identifica a conhecida árvore da vida.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: que produzia doze frutos
  rationale: Mantém o plural literal “doze frutos” sem acrescentar “tipos”, ideia possível, mas não expressa diretamente pelo grego.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: e dava o seu fruto a cada mês
  rationale: Expressa de modo natural a produção regular e distributiva indicada por κατὰ μῆνα ἕκαστον e o sentido agrícola de ἀποδίδωμι.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: para a cura das nações
  rationale: Preserva a finalidade indicada por εἰς, o substantivo θεραπεία e o alcance coletivo de ἔθνη, sem restringi-lo aos gentios em contraste com os judeus.
theological_decisions:
- issue: Descrição espacial comprimida da árvore em relação à rua e ao rio
  choice: Manter uma única “árvore da vida” situada no meio da rua e de um lado e do outro do rio.
  alternative: Traduzir no plural, “árvores da vida”, ou reorganizar a geografia da visão para torná-la mais concreta.
  rationale: O grego emprega o singular ξύλον e apresenta uma imagem apocalíptica deliberadamente condensada. A tradução conserva tanto o singular ligado a Gênesis quanto a tensão espacial, sem impor uma explicação geográfica.
- issue: Sentido dos “doze frutos”
  choice: Conservar a formulação literal “doze frutos” e registrar a amplitude possível em nota.
  alternative: Traduzir “doze tipos de fruto” ou “doze colheitas”.
  rationale: O texto não contém uma palavra específica para “tipos” ou “colheitas”. A recorrência mensal pode sugerir essas ideias, mas não exige que uma delas seja incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o caráter visionário e a ambiguidade espacial do original, evitando arcaísmos e explicações doutrinárias no corpo do versículo.
