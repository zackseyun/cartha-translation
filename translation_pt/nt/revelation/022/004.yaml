  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: pt
  text: e verão o seu rosto,[a][b] e o seu nome estará na testa deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «contemplarão o seu rosto».'
    reason: lexical_alternative
  - marker: b
    text: Os pronomes no singular traduzidos por «seu» podem se referir a Deus ou refletir o reinado divino compartilhado de Deus e do Cordeiro no contexto imediato.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: verão
  rationale: Futuro de ὁράω com sentido direto. «Verão» é natural e atual; «contemplarão» é possível, mas acrescenta um tom mais elevado ou intensivo que o grego não exige.
- source_word: πρόσωπον
  choice: rosto
  rationale: Preserva o sentido concreto principal no objeto de ὄψονται e a força relacional e visual da expressão.
- source_word: ὄνομα
  choice: nome
  rationale: Equivalente direto que não explicita no texto ideias associadas, como identidade, pertencimento ou caráter.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: na testa deles
  rationale: ἐπί com genitivo indica localização. O grego usa o plural «testas», mas o singular distributivo «na testa deles» é a formulação mais natural em português e mantém o sentido de que o nome estará na testa de cada um.
- source_word: καὶ
  choice: e
  rationale: As duas ocorrências são traduzidas por coordenação simples, preservando a estrutura aditiva do grego.
- source_word: αὐτοῦ
  choice: seu
  rationale: Mantém o pronome masculino singular do grego sem substituir seu referente por «Deus» ou «o Cordeiro».
theological_decisions:
- issue: Referente de «seu» em «seu rosto» e «seu nome»
  choice: Manter o pronome «seu» sem identificar expressamente o referente.
  alternative: Explicitar «de Deus» ou entender a formulação à luz do reinado compartilhado de Deus e do Cordeiro no contexto imediato.
  rationale: O contexto imediato aproxima Deus e o Cordeiro (Ap 22.3), enquanto o grego emprega pronomes no singular. A tradução preserva essa ambiguidade e tensão teológica, sem resolvê-la de modo mais estreito que o texto-fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Na testa deles» evita o mais solene «sobre as testas deles» e usa o singular distributivo idiomático. Os marcadores seguem imediatamente a expressão relevante.
