id: REV.22.20
reference: Revelation 22:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: pt
  text: 'Aquele que dá testemunho destas coisas diz: “Sim, venho em breve[a].” Amém. Vem, Senhor Jesus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “venho rapidamente”. O advérbio grego pode enfatizar tanto a proximidade no tempo quanto a rapidez da chegada ou da ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: diz
  rationale: O presente do indicativo funciona naturalmente como introdução direta da fala em português.
- source_word: ὁ μαρτυρῶν
  choice: Aquele que dá testemunho
  rationale: O particípio substantivado identifica Jesus como quem testemunha continuamente acerca do conteúdo da revelação; a expressão preserva a nuance testemunhal de μαρτυρέω.
- source_word: ταῦτα
  choice: destas coisas
  rationale: O demonstrativo plural remete ao conteúdo da revelação precedente.
- source_word: Ναί
  choice: Sim
  rationale: Reproduz de modo direto e natural a afirmação enfática, sem acrescentar solenidade interpretativa.
- source_word: ἔρχομαι
  choice: venho
  rationale: Neste contexto, o presente grego tem orientação futura. Em português, “venho” é conciso, natural e conserva a declaração de chegada iminente.
- source_word: ταχύ
  choice: em breve
  rationale: No contexto da promessa escatológica, expressa naturalmente proximidade temporal; a possível nuance de rapidez é preservada em nota.
- source_word: Ἀμήν
  choice: Amém
  rationale: Mantém a resposta litúrgica e a expressão de assentimento sem paráfrase.
- source_word: ἔρχου
  choice: Vem
  rationale: O imperativo direto preserva a brevidade e a urgência da súplica. “Vem” é amplamente compreensível e tradicional neste contexto.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva o título reverente dirigido a Jesus e o uso consolidado de κύριος no Novo Testamento.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Sentido de ταχύ na promessa da vinda de Cristo
  choice: em breve
  alternative: rapidamente
  rationale: ταχύ pode indicar proximidade temporal ou rapidez da chegada/ação. “Em breve” se ajusta melhor à promessa e à súplica responsiva neste contexto, enquanto a alternativa relevante é explicitada em nota para não eliminar a tensão escatológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e a estrutura responsiva do grego. A pontuação exclamativa nas duas respostas finais comunica seu caráter de assentimento e súplica sem alterar o conteúdo lexical.
