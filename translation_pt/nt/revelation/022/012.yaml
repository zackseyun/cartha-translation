  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: pt
  text: “Eis que venho em breve[a], e a minha recompensa está comigo, para retribuir a cada um conforme a sua obra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “venho rapidamente”. O grego ταχύ pode destacar tanto a proximidade (“em breve”) quanto a rapidez ou o caráter súbito da vinda (“rapidamente”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva a fórmula solene de chamada à atenção própria do registro profético e apocalíptico, sem soar obscura em português bíblico corrente.
- source_word: ἔρχομαι
  choice: venho
  rationale: O presente grego tem força de chegada futura e iminente; «venho» é natural, conciso e mantém a vivacidade do original.
- source_word: ταχύ
  choice: em breve
  rationale: Neste contexto escatológico, comunica naturalmente a proximidade temporal. A possibilidade de rapidez ou súbito cumprimento é preservada em nota.
- source_word: ὁ μισθός μου
  choice: a minha recompensa
  rationale: μισθός pode indicar salário, pagamento ou recompensa; «recompensa» é natural no contexto de retribuição divina e evita uma conotação excessivamente comercial.
- source_word: μετ’ ἐμοῦ
  choice: está comigo
  rationale: Explicita em português a cópula subentendida na oração nominal grega.
- source_word: ἀποδοῦναι
  choice: para retribuir
  rationale: O infinitivo expressa finalidade e o verbo comunica dar a cada pessoa o que corresponde às suas obras, sem restringir o resultado a prêmio positivo.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Mantém o sentido distributivo singular e a ênfase na responsabilidade individual.
- source_word: ὡς
  choice: conforme
  rationale: Introduz de modo idiomático o critério ou padrão da retribuição.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: a sua obra
  rationale: Preserva o substantivo singular ἔργον. Em português, «conforme a sua obra» transmite de maneira natural a relação expressa pela oração grega, embora não reproduza separadamente a cópula.
theological_decisions:
- issue: Representação de gênero em ἑκάστῳ ... αὐτοῦ
  choice: a cada um conforme a sua obra
  alternative: a cada pessoa conforme as suas obras
  rationale: «Cada um» conserva a forma masculina singular representativa do grego e continua sendo compreensível em português. O possessivo «sua» concorda naturalmente com esse referente sem acrescentar exclusão de mulheres.
- issue: Natureza da linguagem de retribuição
  choice: recompensa ... retribuir a cada um conforme a sua obra
  alternative: recompensa ... dar a cada um segundo as suas obras
  rationale: Mantém a afirmação de retribuição individual segundo a obra sem definir, além do texto, como essa afirmação se relaciona com a base da salvação final. «Retribuir» também permite resultado favorável ou desfavorável conforme o contexto.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e compreensão internacional. «Eis que» preserva o tom profético de Apocalipse; a estrutura permanece próxima do grego sem sacrificar a naturalidade.
