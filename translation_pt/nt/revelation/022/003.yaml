id: REV.22.3
reference: Revelation 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his slaves will worship him[d][c][b],
translation:
  language: pt
  text: E não haverá mais maldição alguma[a]. O trono de Deus e do Cordeiro estará nela, e os escravos dele o adorarão[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «coisa alguma amaldiçoada» ou «nenhuma coisa amaldiçoada».'
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega formas no singular: «o trono» de «Deus e do Cordeiro» e, depois, «os escravos dele o adorarão». Assim, preserva tanto a distinção entre Deus e o Cordeiro quanto o governo compartilhado por eles.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: «servos» ou «servos sujeitos a um senhor».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: «o servirão» ou «lhe prestarão culto».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: maldição alguma
  rationale: A construção transmite de modo natural a negação abrangente do grego. Neste contexto, «maldição» evoca adequadamente o fim da maldição na nova criação, sem excluir a possibilidade concreta de «coisa amaldiçoada», registrada em nota.
- source_word: οὐκ ἔσται ἔτι
  choice: não haverá mais
  rationale: Expressão idiomática em português que preserva o valor existencial futuro e o sentido de ἔτι, «ainda/mais».
- source_word: θρόνος
  choice: trono
  rationale: Equivalente usual, mantendo o singular significativo do texto grego.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: de Deus e do Cordeiro
  rationale: Mantém explicitamente os dois genitivos e conserva «Cordeiro», imagem sacrificial e messiânica característica de Apocalipse.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome feminino singular retoma a cidade, também feminina em português, permitindo preservar de modo natural o gênero e a referência locativa.
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva o sentido forte de pertencimento e sujeição de δοῦλοι. «Servos» seria mais convencional, mas pode atenuar a força lexical.
- source_word: λατρεύσουσιν
  choice: o adorarão
  rationale: No contexto do trono e do serviço sagrado prestado a Deus, «adorarão» comunica claramente a dimensão cultual de λατρεύω; outras possibilidades são registradas em nota.
- source_word: αὐτοῦ ... αὐτῷ
  choice: dele ... o
  rationale: Mantém os pronomes no singular depois de «Deus e do Cordeiro», preservando a tensão gramatical do original entre a distinção dos referentes e o governo compartilhado.
theological_decisions:
- issue: Um trono atribuído a Deus e ao Cordeiro, seguido de pronomes no singular
  choice: 'Manter os singulares: «os escravos dele o adorarão»'
  alternative: Empregar plurais, como «os escravos deles os adorarão», ou reformular para evitar a tensão
  rationale: O grego distingue Deus e o Cordeiro, mas fala de um único trono e usa αὐτοῦ e αὐτῷ no singular. A tradução conserva essa tensão sem a resolver por meio de formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Nela» retoma naturalmente a cidade. A formulação «os escravos dele o adorarão» é deliberadamente marcada para conservar os singulares gregos; as notas esclarecem tanto essa tensão quanto as principais alternativas lexicais.
