  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow slave with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: pt
  text: 'E ele me diz: “Não faça isso![a] Sou escravo juntamente com você,[b] com seus irmãos, os profetas, e com os que guardam as palavras deste livro. Adore a Deus.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é elíptica, literalmente algo como “Veja, não!”. Neste contexto, significa “Não faça isso!”, referindo-se à tentativa de João de adorar o anjo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Sou servo juntamente com você”. O termo grego indica que o anjo e João compartilham a condição de subordinados ao mesmo Senhor; por isso, o anjo não deve ser adorado.'
    reason: lexical_alternative
  - marker: c
    text: 'Compare Apocalipse 19:10, onde o anjo dá a mesma correção: “Adore a Deus”.'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Não faça isso!
  rationale: A expressão é uma proibição abrupta e elíptica. O contexto deixa claro que se refere à tentativa de João de adorar o anjo; explicitar a ação implícita produz português natural sem alterar o sentido.
- source_word: σύνδουλός
  choice: escravo como você
  rationale: O termo designa alguém que compartilha com outro a condição de escravo sob o mesmo senhor. Esta formulação é mais natural do que “coescravo” e preserva a força da subordinação comum a Deus.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: seus irmãos, os profetas
  rationale: A aposição identifica os irmãos de João aqui mencionados como profetas, sem transformar a expressão em uma categoria mais ampla do que o grego afirma.
- source_word: τηρούντων
  choice: guardam
  rationale: τηρέω pode abranger guardar, observar e obedecer. “Guardam” conserva a formulação joanina e sugere preservação fiel e prática, sem reduzir o sentido a apenas uma dessas nuances.
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: as palavras deste livro
  rationale: Tradução direta que mantém o vocabulário recorrente do Apocalipse; “livro” é claro ao leitor moderno, embora o objeto antigo pudesse ter a forma de rolo.
- source_word: τῷ θεῷ προσκύνησον
  choice: Adore a Deus
  rationale: No contexto, προσκυνέω descreve a reverência cultual indevidamente dirigida ao anjo e que deve ser dirigida somente a Deus.
- source_word: λέγει μοι
  choice: ele me diz
  rationale: Mantém o presente histórico do texto grego, aceitável e vívido em português narrativo.
theological_decisions:
- issue: Tradução da linguagem de escravidão em σύνδουλος
  choice: Sou escravo como você
  alternative: Sou servo como você
  rationale: A identificação do anjo como alguém submetido ao mesmo Senhor sustenta sua recusa em receber adoração. “Escravo” preserva essa condição de sujeição mais explicitamente que “servo”, sem inserir uma doutrina adicional.
- issue: Explicitação da proibição elíptica Ὅρα μή
  choice: Não faça isso!
  alternative: Cuidado, não!
  rationale: A ação implícita é a tentativa de João de adorar o anjo. Explicitá-la comunica em português a força pragmática da expressão grega sem resolver qualquer ambiguidade teológica.
- issue: Relação entre “irmãos” e “profetas”
  choice: seus irmãos, os profetas
  alternative: seus irmãos que são profetas
  rationale: 'A construção conserva a leitura appositiva mais direta: os irmãos mencionados são identificados como profetas. A pontuação evita ampliar silenciosamente o grupo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a coordenação do grego. “Escravo como você” evita o termo pouco corrente “coescravo”, mas conserva a relação de sujeição comum. O presente histórico “diz” foi mantido.
