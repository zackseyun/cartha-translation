id: REV.22.5
reference: Revelation 22:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: pt
  text: Não haverá mais noite, e eles não precisarão da luz de uma lâmpada nem da luz do sol, porque o Senhor Deus os iluminará[a], e eles reinarão para todo o sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará sua luz brilhar sobre eles”.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “pelos séculos dos séculos”, expressão que indica duração sem fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: noite
  rationale: É o sentido lexical básico; sem artigo, a forma simples “noite” é natural em português.
- source_word: οὐκ ἔσται ἔτι
  choice: não haverá mais
  rationale: Expressa de maneira natural e solene que a noite deixará de existir.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: eles não precisarão
  rationale: Embora ἔχουσιν esteja no presente, o contexto é orientado para o futuro e contém vários verbos no futuro; a formulação portuguesa mantém a coerência temporal.
- source_word: φωτὸς λύχνου
  choice: da luz de uma lâmpada
  rationale: Preserva claramente a construção “luz de lâmpada” e evita reduzir a expressão a um composto menos corrente em português internacional.
- source_word: φῶς ἡλίου
  choice: da luz do sol
  rationale: Equivalente direto, claro e idiomático da expressão grega.
- source_word: κύριος ὁ θεός
  choice: o Senhor Deus
  rationale: Representa naturalmente o título divino e o artigo grego, sem introduzir uma distinção denominacional.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: os iluminará
  rationale: Comunica com naturalidade que Deus lhes dará luz; uma nota preserva a imagem direcional da construção com ἐπί.
- source_word: βασιλεύσουσιν
  choice: reinarão
  rationale: É o equivalente português direto do verbo que significa reinar ou exercer governo régio.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: É uma expressão portuguesa corrente e solene para a duração enfaticamente ilimitada indicada pelo idioma grego.
theological_decisions:
- issue: Referência temporal de οὐκ ἔχουσιν χρείαν no contexto da visão futura
  choice: 'Traduzir no futuro: “eles não precisarão”.'
  alternative: 'Traduzir formalmente no presente: “eles não precisam”.'
  rationale: O presente grego pode tornar vívida uma descrição profética, mas os futuros explícitos do versículo enquadram a cena como realidade vindoura. O futuro em português preserva o sentido e melhora a coerência.
- issue: Imagem de φωτίσει ἐπ’ αὐτούς
  choice: Usar no texto “os iluminará”, com a imagem mais literal em nota.
  alternative: “Fará sua luz brilhar sobre eles” ou “brilhará sobre eles”.
  rationale: “Os iluminará” é claro e natural, enquanto a nota conserva a direção sugerida por ἐπί sem acrescentar ao texto principal um substantivo possessivo que não aparece explicitamente no grego.
- issue: Duração de εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: Traduzir idiomaticamente como “para todo o sempre”.
  alternative: Traduzir de modo mais formal como “pelos séculos dos séculos”.
  rationale: A fórmula grega intensifica uma duração sem fim; a tradução escolhida comunica isso diretamente, e a nota registra sua forma literal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A redação evita arcaísmos desnecessários, preserva o paralelismo entre a luz da lâmpada e a luz do sol e mantém em notas as formas gregas mais literais relevantes.
