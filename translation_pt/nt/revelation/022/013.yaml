id: REV.22.13
reference: Revelation 22:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: pt
  text: Eu sou o Alfa e o Ômega, o Primeiro e o Último, o Princípio e o Fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Origem e o Alvo”.'
    reason: Alternativa lexical para ἡ ἀρχὴ καὶ τὸ τέλος, preservando as nuances possíveis de fonte/origem e objetivo/consumação.
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito dá ênfase à autodeclaração. Em português, “Eu sou” preserva essa força de modo natural e solene.
- source_word: τὸ Ἄλφα
  choice: o Alfa
  rationale: Mantém o nome da primeira letra do alfabeto grego e o título simbólico consagrado no Apocalipse, sem o reduzir à letra portuguesa “A”.
- source_word: τὸ Ὦ
  choice: o Ômega
  rationale: Mantém o nome da última letra do alfabeto grego e sua função como título simbólico correspondente a “o Alfa”.
- source_word: ὁ πρῶτος
  choice: o Primeiro
  rationale: Equivalente direto do adjetivo substantivado; a inicial maiúscula sinaliza seu uso como título nesta série de autodesignações.
- source_word: ὁ ἔσχατος
  choice: o Último
  rationale: Equivalente natural e direto, preservando o paralelismo com “o Primeiro”.
- source_word: ἡ ἀρχὴ
  choice: o Princípio
  rationale: Preserva a formulação compacta e o paralelismo tradicional com “o Fim”. “Princípio” pode indicar começo e, em certos contextos, origem, sem forçar aqui uma única nuance.
- source_word: τὸ τέλος
  choice: o Fim
  rationale: É o par natural de “o Princípio” e preserva a simetria da declaração. τέλος também pode envolver a ideia de objetivo ou consumação, registrada em nota.
theological_decisions:
- issue: A tríade de títulos pode expressar abrangência soberana, eternidade e consumação sem que o tradutor defina além do texto a relação metafísica entre essas ideias.
  choice: Eu sou o Alfa e o Ômega, o Primeiro e o Último, o Princípio e o Fim.
  alternative: Eu sou o Alfa e o Ômega, o Primeiro e o Último, a Origem e o Alvo.
  rationale: A tradução principal mantém as três duplas paralelas e deixa a elevada autodeclaração falar por si, sem acrescentar uma explicação doutrinária. A nota conserva a possibilidade lexical de ἀρχή e τέλος como “origem” e “alvo”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantêm-se os títulos tradicionais “Alfa e Ômega” e o paralelismo retórico do grego. As iniciais maiúsculas nos seis títulos destacam sua função titular sem acrescentar conteúdo ao texto.
