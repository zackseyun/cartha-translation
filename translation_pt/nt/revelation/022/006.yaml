id: REV.22.6
reference: Revelation 22:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his slaves what must happen soon.”
translation:
  language: pt
  text: 'E ele me disse: “Estas palavras são dignas de confiança e verdadeiras, e o Senhor, o Deus dos espíritos dos profetas, enviou o seu anjo para mostrar aos seus escravos[b] o que deve acontecer em breve[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rapidamente”. A expressão grega pode enfatizar tanto a proximidade no tempo (“em breve”) quanto a rapidez com que os acontecimentos ocorrerão (“rapidamente”).
    reason: alternative_reading
  - marker: b
    text: Ou “servos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: dignas de confiança
  rationale: No par predicativo que descreve ‘palavras’, comunica de modo natural que a mensagem é confiável, sem reduzir o termo apenas à ideia de fidelidade pessoal.
- source_word: ἀληθινοί
  choice: verdadeiras
  rationale: É a correspondência direta e idiomática neste contexto, preservando a veracidade e a autenticidade das palavras.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título divino tradicional e sua relação de aposição com ‘o Deus dos espíritos dos profetas’.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: o Deus dos espíritos dos profetas
  rationale: Mantém a estrutura genitiva e a ambiguidade quanto à relação exata de Deus com os espíritos, sem substituí-la por uma paráfrase interpretativa sobre inspiração.
- source_word: ἄγγελον
  choice: anjo
  rationale: O contexto visionário e apocalíptico favorece a referência a um ser angelical, e não simplesmente a um mensageiro humano.
- source_word: δούλοις
  choice: escravos
  rationale: Preserva a força de pertencimento e sujeição própria de δοῦλος. Como ‘servos’ é uma alternativa tradicional e mais branda, ela é registrada em nota.
- source_word: δεῖξαι
  choice: mostrar
  rationale: É uma tradução direta de δείκνυμι e se ajusta ao contexto de revelação visionária sem acrescentar interpretação.
- source_word: ἃ δεῖ γενέσθαι
  choice: o que deve acontecer
  rationale: Expressa em português natural tanto a necessidade indicada por δεῖ quanto a ocorrência dos acontecimentos.
- source_word: ἐν τάχει
  choice: em breve
  rationale: Expressa a proximidade temporal que o contexto enfatiza, preservando em nota a possibilidade de rapidez na realização.
- source_word: Καὶ εἶπέν μοι
  choice: E ele me disse
  rationale: Reflete o conectivo simples καί sem transformá-lo em uma transição temporal mais específica.
theological_decisions:
- issue: Sentido de ἐν τάχει no contexto escatológico
  choice: em breve
  alternative: rapidamente
  rationale: A expressão pode indicar proximidade temporal ou rapidez de execução. O texto principal comunica iminência, enquanto a nota preserva a outra possibilidade sem resolver indevidamente a tensão escatológica.
- issue: Força de δοῦλοι como designação do povo de Deus
  choice: escravos
  alternative: servos
  rationale: ‘Escravos’ preserva com maior precisão a ideia de pertencimento e sujeição a Deus; ‘servos’, embora tradicional e possível, atenua essa força e por isso aparece em nota.
- issue: Relação expressa por ‘Deus dos espíritos dos profetas’
  choice: estrutura genitiva preservada
  alternative: o Deus que inspira os profetas
  rationale: A formulação literal permite que a frase denote soberania, origem ou relação com os espíritos dos profetas sem impor exclusivamente uma interpretação sobre inspiração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a estrutura teológica do grego foram mantidas sempre que naturais em português. Os marcadores foram colocados junto às expressões a que suas notas correspondem.
