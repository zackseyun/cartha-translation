id: REV.22.19
reference: Revelation 22:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: pt
  text: E, se alguém tirar das palavras do livro desta profecia, Deus tirará a parte que lhe cabe da árvore da vida[a] e da cidade santa, que estão registradas neste livro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “livro da vida” em vez de “árvore da vida”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: tirar / tirará
  rationale: Mantém a correspondência verbal deliberada entre o ato humano e a resposta divina, além de soar natural em português.
- source_word: λόγων
  choice: palavras
  rationale: Refere-se ao conteúdo verbal da profecia e preserva a formulação direta e solene da advertência.
- source_word: βιβλίου
  choice: livro
  rationale: É a tradução convencional e claramente compreensível de βιβλίον neste contexto.
- source_word: προφητείας
  choice: profecia
  rationale: Preserva a designação do gênero e a solenidade do texto sem paráfrase desnecessária.
- source_word: μέρος
  choice: a parte que lhe cabe
  rationale: Expressa com clareza contemporânea a ideia de participação ou porção atribuída, sem pressupor mais do que o grego afirma.
- source_word: ξύλου τῆς ζωῆς
  choice: árvore da vida
  rationale: Corresponde ao referente apocalíptico evidente e ao contexto imediato de Apocalipse 22.
- source_word: πόλεως τῆς ἁγίας
  choice: cidade santa
  rationale: Formulação portuguesa consagrada que preserva a designação definida do original.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: descritas neste livro
  rationale: O particípio plural retoma naturalmente tanto a árvore da vida quanto a cidade santa; 'descritas' comunica em português corrente que ambas figuram no livro.
theological_decisions:
- issue: Variante textual entre 'árvore da vida' e 'livro da vida'
  choice: árvore da vida
  alternative: livro da vida
  rationale: O texto fornecido do SBLGNT traz ξύλου τῆς ζωῆς, leitura bem sustentada e coerente com o contexto imediato. A variante tradicionalmente conhecida é registrada em nota, sem substituir o texto-base.
- issue: Sentido de μέρος αὐτοῦ
  choice: a parte que lhe cabe
  alternative: a sua parte
  rationale: A formulação preserva a noção de porção ou participação sem resolver a advertência segundo uma doutrina específica sobre salvação, perda ou herança.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de 'tirar' preserva a reciprocidade retórica do grego. O marcador [a] aparece imediatamente após a expressão afetada pela variante.
