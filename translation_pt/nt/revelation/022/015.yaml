id: REV.22.15
reference: Revelation 22:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: pt
  text: Do lado de fora estão os cães[b], os feiticeiros, os que praticam imoralidade sexual, os assassinos, os idólatras e todo aquele que ama e pratica a falsidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ama e pratica uma mentira”.'
    reason: lexical_alternative
  - marker: b
    text: “Cães” provavelmente é uma metáfora de exclusão e impureza moral; alguns intérpretes entendem o termo de maneira mais específica.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: Do lado de fora estão
  rationale: Expressa a exclusão da cidade no contexto e mantém em destaque a posição exterior.
- source_word: κύνες
  choice: os cães
  rationale: Preserva a imagem concreta e metafórica do grego, sem impor uma identificação específica debatida.
- source_word: φάρμακοι
  choice: os feiticeiros
  rationale: No contexto do Apocalipse, designa praticantes de feitiçaria ou artes mágicas; esta formulação é concisa e corrente.
- source_word: πόρνοι
  choice: os que praticam imoralidade sexual
  rationale: Comunica a amplitude ética do termo em linguagem moderna, sem restringi-lo a uma única forma de conduta sexual.
- source_word: φονεῖς
  choice: os assassinos
  rationale: Equivalente direto e natural para os que cometem homicídio.
- source_word: εἰδωλολάτραι
  choice: os idólatras
  rationale: Tradução compacta e consagrada, adequada ao ritmo da lista.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: todo aquele que ama e pratica a falsidade
  rationale: Traduz os particípios como conduta característica; 'pratica' soa natural com 'falsidade' e abrange tanto a mentira quanto a adesão ao que é falso.
theological_decisions:
- issue: Se κύνες deve ser interpretado no texto principal como um grupo específico.
  choice: Manter a imagem literal “cães”.
  alternative: impuros; desavergonhados; prostitutos cultuais ou masculinos
  rationale: O termo concreto sustenta a força simbólica da visão e evita transformar uma interpretação discutida em tradução.
- issue: Se ψεῦδος deve ser entendido como uma mentira individual ou como falsidade em sentido amplo.
  choice: Traduzir por “a falsidade”.
  alternative: uma mentira
  rationale: O paralelismo entre amar e praticar sugere uma orientação habitual, mas o sentido mais específico continua lexicalmente possível e é preservado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva o tom solene da lista de vícios e a metáfora apocalíptica sem explicá-la dentro do texto principal.
