  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: pt
  text: Quem pratica a injustiça continue a praticar a injustiça; quem é impuro continue a ser contaminado[a]; quem é justo continue a praticar a justiça[b]; e quem é santo continue a ser santificado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem é impuro continue impuro”. O verbo grego está na voz passiva e pode ser traduzido como “seja contaminado” ou, mais literalmente, “seja tornado impuro”; em português, também pode ser expresso como uma condição persistente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “continue a praticar a retidão”. A palavra grega δικαιοσύνη pode indicar justiça ou retidão.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “continue a ser feito santo”. “Ser santificado” significa ser feito ou consagrado como santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: Quem pratica a injustiça continue praticando a injustiça
  rationale: O particípio substantivado designa genericamente a pessoa que age injustamente, e o imperativo aoristo com ἔτι exige que se preserve tanto a força imperativa quanto a ideia de persistência, sem transformar a frase em mera predição.
- source_word: ὁ ῥυπαρὸς
  choice: quem é impuro
  rationale: O adjetivo substantivado tem conotações de impureza moral e contaminação. “Impuro” é claro, digno e mais natural em português do que “imundo” neste paralelismo.
- source_word: ῥυπαρευθήτω ἔτι
  choice: continue sendo tornado impuro
  rationale: A formulação conserva explicitamente a voz passiva do verbo grego e deixa implícito o agente, embora produza de propósito uma expressão forte e pouco comum.
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: quem é justo continue praticando a justiça
  rationale: “Praticar a justiça” expressa naturalmente a conduta ativa indicada por ποιέω com δικαιοσύνη, preservando também a repetição imperativa de ἔτι.
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: quem é santo continue sendo santificado
  rationale: “Ser santificado” conserva a voz passiva e o sentido de ser feito ou mantido santo, deixando a agência sem especificação.
theological_decisions:
- issue: Força dos imperativos em um contexto de fixação moral final
  choice: Traduzir os quatro imperativos por construções com “continue”
  alternative: 'Traduzir como futuros ou declarações preditivas: “continuará...”'
  rationale: As formas gregas são imperativos de terceira pessoa. A tradução mantém sua força retórica e judicial, sem sugerir aprovação moral do mal nem reduzir a tensão a simples previsão.
- issue: Voz de ῥυπαρευθήτω e ἁγιασθήτω
  choice: 'Preservar a voz passiva: “sendo tornado impuro” e “sendo santificado”'
  alternative: 'Empregar formas estativas ou intransitivas: “continue impuro” e “continue santo”'
  rationale: Os dois verbos estão na voz passiva. Manter essa forma deixa a agência implícita e preserva a tensão teológica do texto, em vez de resolvê-la silenciosamente.
- issue: δικαιοσύνη como justiça ou retidão
  choice: justiça
  alternative: retidão
  rationale: No contexto ético e em contraste direto com ἀδικία, “justiça” reproduz o vínculo lexical e o paralelismo. “Retidão” continua sendo uma alternativa legítima.
translation_notes:
  register: Português moderno, internacional e de boa legibilidade brasileira. A repetição de “continue” reproduz o ἔτι presente em cada oração. O paralelismo foi preservado com “quem...”, e as passivas deliberadamente incomuns mantêm a ambiguidade de agência do grego.
