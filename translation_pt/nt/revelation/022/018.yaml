id: REV.22.18
reference: Revelation 22:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: pt
  text: 'Eu testemunho a todo aquele que ouve as palavras da profecia deste livro: se alguém acrescentar algo a elas, Deus lhe acrescentará as pragas escritas neste livro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rolo”, aqui e na ocorrência anterior de “livro”; βιβλίον pode designar o suporte físico antigo em forma de rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Eu testemunho
  rationale: Preserva a linguagem solene de testemunho de μαρτυρέω, sem reduzi-la a uma advertência genérica.
- source_word: παντὶ τῷ ἀκούοντι
  choice: a todo aquele que ouve
  rationale: Expressa naturalmente em português a construção participial dativa e mantém o alcance individual e universal.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: as palavras da profecia
  rationale: Mantém a referência direta ao conteúdo verbal e sua natureza profética.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: deste livro / neste livro
  rationale: Livro é a forma moderna mais natural para βιβλίον; a repetição é preservada, assim como no grego.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: se alguém acrescentar algo a elas
  rationale: Acrescentar traduz o sentido contextual de ἐπιτίθημι; algo torna a construção portuguesa completa e natural sem alterar o sentido.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Deus lhe acrescentará
  rationale: Repete acrescentar para conservar a correspondência retórica deliberada entre a ação humana e a resposta divina.
- source_word: τὰς πληγὰς τὰς γεγραμμένας
  choice: as pragas escritas
  rationale: Pragas mantém a ressonância dos juízos ao longo de Apocalipse; escritas comunica de modo conciso aquilo que permanece registrado.
theological_decisions:
- issue: Testemunho ou advertência
  choice: Eu testemunho
  alternative: Eu advirto
  rationale: O verbo grego pertence à linguagem de testemunho. A força de advertência decorre da condição e do juízo que seguem, sem precisar substituir o sentido lexical.
- issue: Correspondência entre a adição humana e a ação divina
  choice: acrescentar... acrescentará
  alternative: acrescentar... imporá
  rationale: A repetição do mesmo verbo preserva a simetria e a gravidade da formulação grega, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a repetição lexical e a força testemunhal do original.
