source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: pt
  text: E eu, João, sou quem ouve e vê estas coisas. E, quando ouvi e vi, prostrei-me para adorar[a] diante dos pés do anjo que me mostrava estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para me curvar diante dele” ou “para lhe prestar homenagem”. O verbo grego pode indicar prostração ou reverência; aqui foi traduzido por “adorar” por sua força habitual em Apocalipse e pela repreensão que vem em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: E eu
  rationale: Preserva tanto a conexão de καί quanto a ênfase do pronome explícito ἐγώ, com formulação natural em português.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: sou quem ouve e vê
  rationale: Mantém os particípios presentes substantivados e seu aspecto presente sem produzir uma construção excessivamente artificial.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Conserva o demonstrativo plural nas duas ocorrências e remete ao conteúdo das visões narradas.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: Quando ouvi e vi
  rationale: Traduz ὅτε temporalmente sem impor a ideia de posterioridade de 'depois de'; os aoristos são vertidos pelo pretérito perfeito.
- source_word: ἔπεσα προσκυνῆσαι
  choice: prostrei-me para adorar
  rationale: Expressa o movimento físico implícito na queda e conserva a força cultual de προσκυνέω no contexto de Apocalipse.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: diante dos pés
  rationale: Preserva a preposição e a menção explícita aos pés, embora 'aos pés' fosse mais idiomático.
- source_word: τοῦ ἀγγέλου
  choice: do anjo
  rationale: O contexto identifica um ser celestial, tornando 'anjo' mais apropriado que o sentido genérico 'mensageiro'.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: que me mostrava estas coisas
  rationale: O imperfeito português representa adequadamente o aspecto contínuo do particípio presente no contexto narrativo passado.
theological_decisions:
- issue: Natureza de προσκυνέω dirigido ao anjo
  choice: adorar
  alternative: prostrar-se diante de; prestar homenagem a
  rationale: Embora o verbo possa indicar prostração ou homenagem, em Apocalipse ele frequentemente tem força de adoração. A repreensão no versículo seguinte preserva a tensão e mostra que o ato dirigido ao anjo é impróprio, sem que a tradução o suavize antecipadamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “estas coisas” e a construção enfática “E eu, João” preservam traços relevantes do grego. O marcador foi colocado após a oração pertinente para não interromper o fluxo.
