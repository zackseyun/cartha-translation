id: REV.22.16
reference: Revelation 22:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: pt
  text: Eu, Jesus, enviei o meu anjo para lhes dar testemunho destas coisas para as igrejas[a]. Eu sou a raiz e o descendente de Davi[b], a brilhante estrela da manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas igrejas» ou «a respeito das igrejas». A expressão grega ἐπὶ ταῖς ἐκκλησίαις admite mais de uma nuance.
    reason: lexical_alternative
  - marker: b
    text: Ou «a raiz e a descendência de Davi».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Eu, Jesus,
  rationale: O pronome explícito seguido do nome próprio expressa autoidentificação enfática. A aposição com vírgulas é natural em português e evita acrescentar um verbo inexistente nesta oração.
- source_word: ἔπεμψα
  choice: enviei
  rationale: O aoristo indica o ato realizado de enviar. O pretérito perfeito português comunica naturalmente uma ação concluída com relevância para o discurso presente.
- source_word: τὸν ἄγγελόν μου
  choice: o meu anjo
  rationale: No contexto de Apocalipse, ἄγγελος designa naturalmente um ser angelical; «anjo» preserva esse sentido e a relação possessiva expressa por μου.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: para lhes dar testemunho destas coisas
  rationale: O infinitivo exprime finalidade. «Dar testemunho» preserva a ideia de testemunho de μαρτυρέω, enquanto «lhes» representa o dativo plural ὑμῖν e «destas coisas» mantém a referência plural de ταῦτα.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: para as igrejas
  rationale: A expressão com ἐπί e dativo admite mais de uma nuance. «Para as igrejas» comunica de modo natural que o testemunho se destina a elas, sem eliminar em nota as possibilidades de esfera ou referência.
- source_word: ἡ ῥίζα
  choice: a raiz
  rationale: A tradução literal preserva a imagem messiânica de origem ou fonte sem explicá-la além do texto.
- source_word: τὸ γένος Δαυίδ
  choice: o descendente de Davi
  rationale: Neste predicado singular sobre Jesus, γένος indica linhagem ou descendência. «Descendente» é claro e natural, enquanto «descendência» permanece uma alternativa possível.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: a brilhante estrela da manhã
  rationale: A formulação reúne em português natural os descritores articulados do grego, preservando tanto o brilho quanto a referência matutina e mantendo a força do título.
theological_decisions:
- issue: Autoidentificação messiânico-davídica
  choice: a raiz e o descendente de Davi
  alternative: a fonte e a descendência de Davi
  rationale: A tradução conserva a tensão do texto, no qual Jesus se apresenta ao mesmo tempo como raiz de Davi e pertencente à sua descendência, sem resolver ou explicar o paradoxo.
- issue: Título cristológico «estrela da manhã»
  choice: a brilhante estrela da manhã
  alternative: a estrela, a brilhante, a matutina
  rationale: A expressão é mantida como autodesignação direta de Jesus, com linguagem portuguesa natural e sem acrescentar elaboração doutrinária externa ao versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível. A construção «Eu, Jesus» conserva a ênfase da autoidentificação, e as imagens «raiz» e «estrela da manhã» permanecem vívidas e literais.
