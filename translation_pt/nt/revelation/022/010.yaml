id: REV.22.10
reference: Revelation 22:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: pt
  text: 'E ele me diz: “Não sele as palavras da profecia deste livro[a], pois o tempo está próximo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Compare Daniel 12:4, em que se ordena que a profecia seja selada; aqui, a ordem é oposta. “Não sele” também pode ser entendido como “não mantenha em segredo”.
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Ou “pois o tempo determinado está próximo”. O grego καιρός pode indicar um momento decisivo ou determinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: ele me diz
  rationale: Preserva o presente narrativo grego e sua vivacidade, de modo natural em português.
- source_word: Μὴ σφραγίσῃς
  choice: Não sele
  rationale: Mantém a imagem profética de selar uma revelação, isto é, fechá-la ou retê-la, sem substituir a metáfora por uma explicação.
- source_word: τοὺς λόγους
  choice: as palavras
  rationale: Reproduz diretamente o plural concreto λόγους, sem o generalizar como “mensagem”.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: da profecia deste livro
  rationale: Expressa naturalmente em português a cadeia de genitivos e mantém “livro” como equivalente moderno de βιβλίον.
- source_word: ὁ καιρὸς
  choice: o tempo
  rationale: É a formulação concisa e natural; καιρός também pode indicar um tempo decisivo ou determinado, nuance registrada em nota.
- source_word: ἐγγύς ἐστιν
  choice: está próximo
  rationale: Comunica claramente a proximidade afirmada pelo grego, sem amenizar nem explicar a tensão escatológica.
theological_decisions:
- issue: Linguagem de iminência no contexto apocalíptico
  choice: pois o tempo está próximo
  alternative: pois o tempo determinado está próximo
  rationale: Conserva a afirmação de proximidade sem impor um cronograma escatológico nem reinterpretar seu sentido.
- issue: Contraste profético com Daniel 12:4
  choice: Não sele
  alternative: Não mantenha em segredo
  rationale: Preserva a metáfora de selar e deixa perceptível o contraste com a ordem dada em Daniel, sem transformar a alusão em paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente narrativo foi mantido; a metáfora profética de selar e a linguagem de proximidade foram preservadas sem explicação denominacional.
