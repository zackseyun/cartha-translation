id: REV.13.5
reference: Revelation 13:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: pt
  text: E foi-lhe dada uma boca que proferia grandes coisas[a] e blasfêmias; e foi-lhe dada autoridade para agir durante quarenta e dois meses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “grandes coisas” tem provavelmente o sentido de palavras arrogantes ou presunçosas neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos e traduções trazem: “para continuar durante quarenta e dois meses”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐδόθη
  choice: foi-lhe dada
  rationale: Preserva o passivo e a ideia de que a besta recebe, em vez de possuir por si mesma, tanto a boca quanto a autoridade. A repetição também reproduz a estrutura enfática do grego.
- source_word: στόμα
  choice: uma boca
  rationale: Mantém a imagem apocalíptica concreta do original, sem reduzi-la a 'fala' ou 'capacidade de falar'.
- source_word: λαλοῦν
  choice: que proferia
  rationale: Expressa naturalmente em português o particípio que modifica 'boca' e combina bem com o conteúdo verbal subsequente.
- source_word: μεγάλα
  choice: grandes coisas
  rationale: Conserva a amplitude da expressão grega. No contexto, ela sugere palavras arrogantes ou presunçosas, mas isso não é explicitado lexicalmente pelo adjetivo sozinho.
- source_word: βλασφημίας
  choice: blasfêmias
  rationale: Mantém o plural e o caráter religioso da fala ofensiva, confirmado pelo contexto imediato.
- source_word: ἐξουσία
  choice: autoridade
  rationale: Comunica autoridade ou permissão delegada melhor que 'poder', que poderia sugerir sobretudo força inerente.
- source_word: ποιῆσαι
  choice: para agir
  rationale: O infinitivo é amplo, com o sentido básico de fazer ou atuar. 'Agir' funciona naturalmente com a indicação de duração e evita importar um objeto não expresso.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: durante quarenta e dois meses
  rationale: Traduz naturalmente o acusativo de extensão temporal e preserva o período apocalíptico especificado.
theological_decisions:
- issue: Sentido de μεγάλα na descrição da fala da besta
  choice: grandes coisas
  alternative: palavras arrogantes; grandes arrogâncias
  rationale: Embora o contexto indique fala arrogante e presunçosa, a tradução principal preserva a formulação mais ampla do grego e deixa que 'blasfêmias' e o contexto determinem seu caráter.
- issue: Sentido de ποιῆσαι com uma expressão de duração
  choice: para agir durante quarenta e dois meses
  alternative: para continuar durante quarenta e dois meses
  rationale: A tradução principal segue ποιῆσαι no texto da SBLGNT. 'Continuar' está ligado a uma variante textual e a uma tradição de tradução, por isso é registrado em nota, não incorporado ao texto principal.
- issue: Origem da autoridade da besta
  choice: manter a construção passiva 'foi-lhe dada' sem identificar explicitamente o agente
  alternative: explicitar Deus como aquele que concede ou permite
  rationale: O grego não nomeia o agente nesta frase. Preservar o passivo mantém a ambiguidade textual e evita tornar explícita uma inferência teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a repetição de “foi-lhe dada” e a vívida imagem de “uma boca”.
