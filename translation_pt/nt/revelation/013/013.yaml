id: REV.13.13
reference: Revelation 13:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: pt
  text: E realiza grandes sinais[a], de modo que até faz descer fogo do céu à terra diante das pessoas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandes milagres” ou “grandes maravilhas”; em grego, “sinais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à vista das pessoas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: realiza
  rationale: Com σημεῖα, “realiza sinais” é uma formulação natural em português e comunica a produção de atos extraordinários sem reduzir o verbo ao sentido genérico de “fazer”.
- source_word: σημεῖα μεγάλα
  choice: grandes sinais
  rationale: “Sinais” preserva a nuance joanina e apocalíptica de atos portentosos com significado, inclusive em contexto de engano, enquanto “grandes” traduz diretamente μεγάλα.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: de modo que até faz descer fogo
  rationale: “De modo que” expressa o valor resultativo da oração com ἵνα neste contexto, e “até” conserva a força intensificadora de καί. A ideia de fazer o fogo descer é completada naturalmente pelo infinitivo καταβαίνειν.
- source_word: πῦρ
  choice: fogo
  rationale: Tradução direta exigida pelo contexto, mantendo a possível evocação de manifestações proféticas de fogo vindo do céu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: “Céu” mantém o registro apocalíptico e a possível conotação de origem celestial, sem restringir οὐρανός ao sentido físico de “firmamento”.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: descer ... à terra
  rationale: “Descer” representa claramente o movimento de καταβαίνειν, e “à terra” conserva o destino expresso por εἰς τὴν γῆν em português corrente e digno.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: A expressão comunica que o ato acontece publicamente, perante observadores. “Pessoas” traduz o uso genérico de ἀνθρώπων sem sugerir apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Natureza da realização dos sinais
  choice: Descrever sinais publicamente observáveis sem definir se são sobrenaturais em sua origem ou enganosos em seu mecanismo.
  alternative: Usar “milagres” para pressupor uma obra sobrenatural, ou empregar linguagem que os trate explicitamente como ilusão.
  rationale: O versículo afirma que a besta realiza grandes sinais e faz fogo descer diante das pessoas, mas não explica aqui o mecanismo ou a natureza metafísica do fenômeno. “Sinais” preserva essa tensão.
- issue: Valor da oração com ἵνα
  choice: 'Traduzir com valor resultativo: “de modo que”.'
  alternative: 'Traduzir com valor estritamente final: “para que”, ou de maneira explicativa: “a saber, faz até”.'
  rationale: No fluxo da frase, a descida do fogo apresenta o alcance impressionante da atividade de realizar sinais. A formulação resultativa é natural em português sem excluir inteiramente a noção de intenção associada a ἵνα.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o tom solene do Apocalipse sem arcaísmos. O sujeito permanece implícito, como no grego, e é recuperável pelo contexto.
