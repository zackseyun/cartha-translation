  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: pt
  text: E uma de suas cabeças parecia ter sido abatida mortalmente[a], mas sua ferida mortal foi curada. E toda a terra ficou maravilhada e seguiu a besta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava como que abatida até a morte”. O grego usa uma expressão de comparação, que pode indicar aparência ou semelhança, e não necessariamente uma afirmação direta de morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “toda a região”, embora, neste contexto apocalíptico, “toda a terra” seja mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: uma de suas cabeças
  rationale: A construção partitiva μίαν ἐκ com genitivo plural é expressa naturalmente em português por “uma de suas cabeças”.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: parecia ter sido morta até a morte
  rationale: “Parecia” preserva o valor comparativo ou aparente de ὡς; “morta até a morte” mantém a formulação enfática e incomum de σφάζω com εἰς θάνατον, sem reduzir a imagem a uma simples ferida.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: sua ferida mortal
  rationale: É uma formulação portuguesa clara e compacta para a construção genitiva, comunicando uma ferida caracterizada pela morte.
- source_word: ἐθεραπεύθη
  choice: foi curada
  rationale: O passivo de θεραπεύω indica aqui que a ferida foi sarada ou restaurada; “foi curada” é direto e natural.
- source_word: ἐθαυμάσθη ὅλη ἡ γῆ
  choice: toda a terra ficou maravilhada
  rationale: O passivo expressa o assombro que tomou toda a terra; a formulação preserva a reação sem definir se ela é positiva ou negativa.
- source_word: ὀπίσω τοῦ θηρίου
  choice: seguiu a besta
  rationale: No contexto, ὀπίσω com genitivo comunica seguir atrás e também aderir; “seguiu a besta” é natural em português e mantém essa abertura contextual.
- source_word: θηρίου
  choice: a besta
  rationale: “Besta” é o equivalente tradicional e reconhecível de θηρίον na imagética apocalíptica; não se emprega inicial maiúscula porque o grego não o apresenta como nome próprio.
theological_decisions:
- issue: Natureza da aparente morte e recuperação da besta
  choice: Apresentar a cabeça como parecendo ter sido morta e a ferida mortal como curada, sem definir a natureza do acontecimento.
  alternative: Morte e ressurreição literais; recuperação simbólica de um império ou governante; morte apenas encenada como engano.
  rationale: O grego emprega ὡς, que introduz semelhança ou aparência, e afirma a cura da ferida, mas não resolve se a cena representa ressurreição literal, recuperação política simbólica ou imitação enganosa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. A formulação incomum “morta até a morte” preserva deliberadamente a intensidade do original; a nota oferece uma alternativa mais formal. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
