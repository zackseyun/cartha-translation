id: REV.13.2
reference: Revelation 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: pt
  text: E a besta que vi era semelhante a um leopardo[a]; seus pés eram como os de um urso, e sua boca, como a boca de um leão. E o dragão deu à besta seu poder, seu trono e grande autoridade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As imagens do leopardo, do urso e do leão fazem eco às visões das feras em Daniel 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: besta
  rationale: Em Apocalipse, o termo designa uma figura monstruosa e simbólica; “besta” preserva melhor essa força apocalíptica do que “animal” ou “criatura”.
- source_word: ὅμοιον παρδάλει
  choice: semelhante a um leopardo
  rationale: Expressa diretamente a relação de semelhança indicada por ὅμοιος com dativo, em português natural e digno.
- source_word: πόδες ... ὡς ἄρκου
  choice: pés ... como os de um urso
  rationale: Mantém o sentido comum de πόδες e explicita naturalmente em português a comparação elíptica do grego, sem substituir “pés” por “patas”.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: boca ... como a boca de um leão
  rationale: Preserva a repetição explícita de στόμα e o equilíbrio vívido da descrição.
- source_word: δράκων
  choice: dragão
  rationale: É a correspondência direta e consagrada para a figura apocalíptica de Apocalipse.
- source_word: ἔδωκεν
  choice: deu
  rationale: Traduz diretamente δίδωμι, sem acrescentar a nuance institucional que “concedeu” poderia sugerir.
- source_word: δύναμιν
  choice: poder
  rationale: Indica capacidade ou força operante e permanece distinto de ἐξουσία, traduzido por “autoridade”.
- source_word: θρόνον
  choice: trono
  rationale: Preserva a imagem régia e governamental explícita no texto.
- source_word: ἐξουσίαν μεγάλην
  choice: grande autoridade
  rationale: Expressa autoridade ou direito de governar, mantendo a distinção lexical em relação a δύναμις, “poder”.
- source_word: αὐτοῦ
  choice: seu
  rationale: O possessivo português é natural e mantém a referência ao dragão, embora sua forma isolada possa ser ambígua; o contexto imediato esclarece o referente.
theological_decisions:
- issue: Relação entre o dragão e a besta nos pronomes e possessivos
  choice: Usar “lhe” para a besta e “seu” para aquilo que pertence ao dragão.
  alternative: Repetir “do dragão” em cada elemento ou usar “dele”.
  rationale: A construção segue de perto o encadeamento grego e é natural em português. O contexto identifica o dragão como possuidor do poder, do trono e da autoridade, sem acrescentar uma interpretação sobre a natureza pessoal das figuras.
- issue: Imagem composta dos animais
  choice: Manter diretamente as comparações com leopardo, urso e leão, deixando a alusão a Daniel 7 para a nota.
  alternative: Inserir no texto principal uma explicação da relação com Daniel 7.
  rationale: O texto grego apresenta as imagens sem interpretá-las; a tradução conserva essa abertura e evita importar uma identificação teológica no corpo do versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno, claro e levemente formal. A elipse “e sua boca, como...” evita repetição verbal pesada, mas preserva a repetição lexical de “boca” presente no grego.
