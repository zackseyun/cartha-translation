id: REV.13.18
reference: Revelation 13:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: pt
  text: 'Aqui está a sabedoria: quem tem entendimento calcule o número da besta, pois é número de um homem[a]; e o seu número é seiscentos e sessenta e seis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois é um número humano”.'
    reason: A construção grega pode indicar o número de um homem ou caracterizá-lo como humano.
  - marker: b
    text: Alguns manuscritos trazem 616 em vez de 666.
    reason: Variante textual antiga no valor do número.
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Aqui está a sabedoria
  rationale: Mantém a força demonstrativa de ὧδε e introduz de modo natural, solene e direto o ponto em que se requer sabedoria.
- source_word: ὁ ἔχων νοῦν
  choice: quem tem entendimento
  rationale: Reproduz a expressão substantivada e o sentido de discernimento de νοῦς, evitando reduzir o termo à mera faculdade mental.
- source_word: ψηφισάτω
  choice: calcule
  rationale: O imperativo pede que se determine o valor numérico; “calcule” comunica esse sentido com precisão em português atual.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: o número da besta
  rationale: Tradução direta e consagrada no contexto apocalíptico de Apocalipse.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: pois é número de um homem
  rationale: Preserva o singular de ἀνθρώπου e permite a referência a um homem sem identificar quem seja. A possível leitura qualitativa ou genérica é registrada em nota.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: e o seu número
  rationale: Retoma naturalmente “a besta” em português. O possessivo evita uma formulação pesada, sem decidir além do texto a natureza pessoal ou simbólica da besta.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: seiscentos e sessenta e seis
  rationale: Forma numeral padrão e natural em português.
theological_decisions:
- issue: Sentido de ἀνθρώπου em ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: “número de um homem” no texto principal
  alternative: “número humano”
  rationale: O genitivo singular pode apontar para um homem, para a humanidade ou para a qualidade humana do número. O texto principal conserva a forma pessoal singular, enquanto a nota mantém aberta a leitura qualitativa, sem resolver uma conhecida tensão interpretativa.
- issue: Valor numérico do número da besta
  choice: 666 no texto principal
  alternative: '616'
  rationale: A leitura 666 possui forte apoio textual e corresponde ao texto principal da edição indicada; a variante antiga 616 é relevante e, por isso, aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe concisa conserva o tom sapiencial e exortativo do original; o ponto e vírgula separa a identificação do tipo de número da declaração de seu valor.
