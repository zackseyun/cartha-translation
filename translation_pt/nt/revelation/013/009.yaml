  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: pt
  text: Se alguém tem ouvidos, ouça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: Se alguém
  rationale: Preserva diretamente a construção condicional e o alcance genérico do pronome indefinido.
- source_word: ἔχει
  choice: tem
  rationale: Equivalente simples e idiomático do presente indicativo de posse.
- source_word: οὖς
  choice: ouvidos
  rationale: Embora o grego use o singular, em português a fórmula proverbial é natural e consagrada no plural, sem alterar o sentido de capacidade para ouvir e acolher.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O presente do subjuntivo com valor imperativo traduz naturalmente o imperativo grego de terceira pessoa e conserva a concisão e a força solene da exortação.
theological_decisions:
- issue: Forma genérica da exortação
  choice: ouça
  alternative: que ele ouça
  rationale: Em português, “alguém” seguido de “ouça” é genérico e não exige pronome masculino explícito; mantém o singular do grego sem introduzir uma especificação de gênero ausente do referente.
- issue: Força idiomática da fórmula de audição
  choice: manter “ouça”
  alternative: escute; entenda
  rationale: “Ouça” preserva a fórmula profética e apocalíptica, inclusive sua ideia de recepção atenta, sem restringi-la interpretativamente a mera compreensão.
translation_notes:
  register: Português moderno, conciso e digno, com ampla legibilidade brasileira. A formulação preserva o caráter proverbial e solene do original.
source_grounding:
  english_pob_role: consult_only
