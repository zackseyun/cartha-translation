revisions:
- from: Então vi outra besta que subia da terra[a]. Ela tinha dois chifres semelhantes aos de um cordeiro, mas falava como dragão.
  to: E vi outra besta que subia da terra[a]. Ela tinha dois chifres semelhantes aos de um cordeiro e falava como dragão.
  rationale: A revisão substitui “Então” por “E”, aproximando-se da coordenação narrativa do grego, e substitui “mas” por “e”, preservando o καί sem acrescentar uma relação adversativa explícita. Mantêm-se a imagem, os termos apocalípticos e a nota lexical.
  reviewer_model: gpt-5.6-terra
