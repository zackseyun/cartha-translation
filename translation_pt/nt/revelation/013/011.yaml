id: REV.13.11
reference: Revelation 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: pt
  text: E vi outra besta que subia da terra[a]. Ela tinha dois chifres semelhantes aos de um cordeiro e falava como dragão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que subia do solo”. A palavra grega γῆ pode significar “terra” ou “solo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: outra besta
  rationale: “Besta” preserva o termo apocalíptico já estabelecido para um poder hostil e mantém sua força simbólica e intertextual; ἄλλο corresponde naturalmente a “outra”.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: que subia da terra
  rationale: O particípio presente retrata a besta no ato de emergir. “Subia da terra” é natural em português e conserva o movimento vívido; γῆ admite tanto “terra” quanto “solo”.
- source_word: εἶχεν κέρατα δύο
  choice: tinha dois chifres
  rationale: O imperfeito tem aqui valor descritivo, expresso naturalmente por “tinha”; “dois chifres” mantém a imagem apocalíptica de poder e autoridade.
- source_word: ὅμοια ἀρνίῳ
  choice: semelhantes aos de um cordeiro
  rationale: O neutro plural ὅμοια concorda com “chifres”. A formulação explicita de modo idiomático que os chifres se pareciam com os de um cordeiro, sem alterar a comparação.
- source_word: ἐλάλει ὡς δράκων
  choice: mas falava como dragão
  rationale: “Falava” reflete o aspecto descritivo e contínuo do imperfeito. “Como dragão” preserva a comparação sem transformar semelhança em identidade. A conjunção “mas” expressa em português o contraste contextual entre aparência e fala veiculado pelo segundo καί.
theological_decisions:
- issue: Tradução de ἀρνίον em uma passagem que pode evocar a figura do Cordeiro em Apocalipse
  choice: cordeiro
  alternative: cordeirinho
  rationale: “Cordeiro” preserva a provável alusão à figura do Cordeiro sem identificar a besta com ele; “cordeirinho” introduziria uma nuance afetiva ou diminutiva inadequada ao português corrente.
- issue: Sentido de γῆ
  choice: terra
  alternative: solo
  rationale: “Terra” mantém a amplitude semântica do grego e a provável contraposição cósmica à besta que sobe do mar, sem restringir a imagem a um território específico. A nota registra a alternativa concreta “solo”.
- issue: Relação entre a aparência de cordeiro e a fala de dragão
  choice: mas falava como dragão
  alternative: e falava como dragão
  rationale: O grego usa καί, que pode ser aditivo ou assumir força contrastiva conforme o contexto. “Mas” torna natural em português o contraste evidente, sem resolver além do texto a identidade simbólica da besta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção conserva o tom visionário e a imagética apocalíptica, evitando vocabulário excessivamente técnico ou arcaico.
