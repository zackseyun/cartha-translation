id: REV.13.8
reference: Revelation 13:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: pt
  text: E todos os que habitam sobre a terra o adorarão — todos aqueles cujo nome não está escrito no livro da vida do Cordeiro que foi morto desde a fundação do mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos aqueles cujo nome não está escrito, desde a fundação do mundo, no livro da vida do Cordeiro que foi morto”. No grego, “desde a fundação do mundo” pode estar ligado tanto a “foi morto” quanto a “não está escrito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: o adorarão
  rationale: Em Apocalipse, προσκυνέω normalmente expressa homenagem religiosa e culto; “adorarão” preserva essa força e o contraste entre a adoração a Deus e ao Cordeiro e a adoração à besta.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: os que habitam sobre a terra
  rationale: Preserva a formulação recorrente de Apocalipse e sua possível caracterização dos habitantes do mundo rebelde, sem recorrer ao pouco natural “terráqueos”.
- source_word: οὗ ... τὸ ὄνομα αὐτοῦ
  choice: todos aqueles cujo nome
  rationale: O relativo genitivo com o pronome possessivo é expresso naturalmente em português por “cujo nome”; a retomada por “todos aqueles” esclarece a transição do plural coletivo para a referência distributiva singular.
- source_word: οὐ γέγραπται
  choice: não está escrito
  rationale: O perfeito grego apresenta uma inscrição anterior com estado resultante; “não está escrito” comunica de modo natural esse estado presente sem eliminar a ideia de registro.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: livro da vida
  rationale: É a expressão bíblica estabelecida e inteligível em português para a imagem apocalíptica, embora βιβλίον também possa designar um rolo.
- source_word: τοῦ ἀρνίου
  choice: do Cordeiro
  rationale: “Cordeiro”, com inicial maiúscula como título cristológico, conserva a imagem sacrificial e messiânica característica de Apocalipse.
- source_word: τοῦ ἐσφαγμένου
  choice: que foi morto
  rationale: O verbo σφάζω implica morte violenta e pode ter ressonância sacrificial. “Foi morto” é atual, claro e digno; alternativas como “foi imolado” explicitariam mais fortemente uma nuance sacrificial que o termo não exige em todos os contextos.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: “Desde” expressa naturalmente o valor temporal de ἀπό com genitivo, enquanto “fundação do mundo” preserva a formulação e a ressonância bíblica.
theological_decisions:
- issue: Ligação sintática de “desde a fundação do mundo”
  choice: Ligada, no texto principal, a “o Cordeiro que foi morto”
  alternative: 'Ligada à inscrição do nome: “todos aqueles cujo nome não está escrito, desde a fundação do mundo, no livro da vida do Cordeiro que foi morto”'
  rationale: A ordem das palavras no grego permite ligar a expressão temporal ao particípio imediatamente anterior, “morto”. Contudo, Apocalipse 17:8 favorece fortemente a ligação com a inscrição dos nomes. Como a sintaxe é genuinamente ambígua e teologicamente significativa, a leitura mais imediata permanece no texto e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “habitam sobre a terra” mantém a fórmula recorrente de Apocalipse; “foi morto” evita linguagem excessivamente arcaica. O travessão organiza a explicação distributiva sem alterar a relação sintática.
