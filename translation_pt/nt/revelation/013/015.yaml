id: REV.13.15
reference: Revelation 13:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: pt
  text: E foi-lhe concedido dar sopro à imagem da besta[a], para que a imagem da besta até falasse e fizesse[b] com que todos os que não adorassem a imagem da besta fossem mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dar espírito” ou “dar vida” à imagem da besta.
    reason: lexical_alternative
  - marker: b
    text: Ou “e fizesse de modo que todos os que não adorassem a imagem da besta fossem mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: foi-lhe concedido
  rationale: Mantém o recebedor explícito por meio de “lhe” e não identifica quem concedeu a capacidade. “Concedido” comunica, em português natural, a ideia de permissão ou capacidade delegada presente no passivo grego.
- source_word: δοῦναι πνεῦμα
  choice: dar sopro
  rationale: “Sopro” preserva o sentido concreto de πνεῦμα no contexto da animação de uma imagem para que fale, sem afirmar necessariamente que ela recebeu verdadeira vida ou um espírito pessoal.
- source_word: εἰκών
  choice: imagem
  rationale: Termo amplo e corrente que não restringe indevidamente a referência a uma estátua.
- source_word: θηρίον
  choice: besta
  rationale: Equivalente tradicional e adequado no contexto apocalíptico, sem a carga interpretativa adicional de “monstro”.
- source_word: ἵνα καὶ λαλήσῃ
  choice: para que ... até falasse
  rationale: “Para que” expressa propósito ou resultado, e “até” comunica o caráter surpreendente de a imagem falar.
- source_word: ποιήσῃ ἵνα
  choice: fizesse com que
  rationale: Reproduz de modo natural em português a força causativa da construção grega ποιέω seguida de oração com ἵνα.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: todos os que não adorassem
  rationale: Expressa naturalmente a construção relativa indefinida e a recusa prevista no cenário descrito.
- source_word: προσκυνήσωσιν
  choice: adorassem
  rationale: Em Apocalipse, o verbo normalmente denota culto religioso, sobretudo quando dirigido à besta ou à sua imagem.
- source_word: ἀποκτανθῶσιν
  choice: fossem mortos
  rationale: Preserva a voz passiva e usa linguagem moderna, clara e digna.
theological_decisions:
- issue: Sentido de πνεῦμα na animação da imagem da besta
  choice: sopro
  alternative: espírito; vida
  rationale: “Sopro” mantém a ambiguidade lexical e a imagem concreta de animação ligada à fala, sem decidir que se trata de um espírito pessoal nem afirmar plenamente a concessão de vida.
- issue: Agente do passivo ἐδόθη
  choice: agente não explicitado
  alternative: identificar Deus ou Satanás como aquele que concedeu
  rationale: O texto grego não nomeia o agente. A tradução conserva essa indeterminação em vez de resolver uma questão teológica por inferência contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita identificar o referente de “lhe” além do que o contexto estabelece e conserva o tom apocalíptico sem arcaísmos desnecessários.
