id: REV.13.16
reference: Revelation 13:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the slaves—to be given a mark on their right hand or on their forehead,
translation:
  language: pt
  text: E faz com que todos — os pequenos e os grandes, os ricos e os pobres, os livres e os escravos — recebam uma marca[a] na mão direita ou na testa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para que lhes deem uma marca”. A construção grega é incomum neste contexto; o texto principal expressa o sentido de forma idiomática.
    reason: alternativa lexical e preservação de uma dificuldade do texto grego
lexical_decisions:
- source_word: ποιεῖ
  choice: faz com que
  rationale: Com ἵνα e o subjuntivo, ποιεῖ expressa causação. “Faz com que” comunica a atuação eficaz da besta sem acrescentar explicitamente a ideia de coerção.
- source_word: πάντας
  choice: todos
  rationale: O termo abrange todas as pessoas enumeradas nas três duplas seguintes; “todos” é direto e natural em português.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: os pequenos e os grandes
  rationale: A tradução próxima do grego preserva a fórmula abrangente e a cadência retórica, referindo-se a pessoas de menor e maior posição.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: os ricos e os pobres
  rationale: É o contraste socioeconômico convencional e inequívoco.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: os livres e os escravos
  rationale: O contraste explícito com “livres” mostra que δοῦλοι designa pessoas em condição de escravidão, não meramente servidores.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: recebam uma marca
  rationale: A forma grega atestada diz literalmente “para que deem a eles uma marca”, construção de referência pouco clara neste contexto. “Recebam uma marca” expressa de modo natural o acontecimento descrito, enquanto a forma mais literal é preservada em nota.
- source_word: χάραγμα
  choice: marca
  rationale: “Marca” abrange adequadamente a ideia de sinal, gravação ou impressão identificadora e mantém a terminologia recorrente de Apocalipse.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: na mão direita
  rationale: O singular distributivo é natural em português e corresponde ao substantivo singular grego; “na” é a forma idiomática para indicar a localização da marca.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: ou na testa
  rationale: O singular distributivo mantém proximidade com o grego e soa natural em português.
theological_decisions:
- issue: Tradução de δοῦλος no contraste de condição social
  choice: escravos
  alternative: servos
  rationale: A oposição direta entre livres e δοῦλοι destaca a condição jurídica e social de escravidão. “Servos” enfraqueceria esse contraste.
- issue: Expressão da oração difícil ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: recebam uma marca
  alternative: para que deem a eles uma marca
  rationale: A redação principal comunica de modo claro o evento exigido pelo contexto sem definir quem aplica a marca nem acrescentar uma explicação teológica. A dificuldade e a forma mais literal do grego são mantidas em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As três duplas paralelas e os travessões preservam a cadência abrangente do grego. O versículo mantém a vírgula final por continuar sintaticamente no versículo seguinte.
