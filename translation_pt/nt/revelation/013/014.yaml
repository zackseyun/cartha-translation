    issue: Tempo verbal de «tinha»
    rationale: O relativo ὃς ἔχει está no presente. Embora uma adaptação ao passado narrativo seja possível em algumas línguas, «tem» reproduz diretamente a forma e mantém a identificação presente da besta no enunciado.
  - severity: low
    issue: Acréscimo de «mesmo assim»
    rationale: O contraste entre ferida e vida é contextual, mas καί é simplesmente coordenativo. «E viveu» preserva o efeito sem explicitar uma relação adversativa.
