  source_fidelity: A tradução preserva bem a estrutura, a passiva não especificada em «lhe foi dado», a repetição temática e o dativo em «imagem para a besta». Contudo, o texto grego da SBLGNT traz ἔχει no presente («tem»), não um pretérito («tinha»).
  naturalness: O português é moderno, claro e adequado ao registro apocalíptico. «Os que habitam sobre a terra» mantém de modo útil a formulação recorrente de Apocalipse. A coordenação final permanece natural com «tem ... e viveu».
  terminology: «Engana», «sinais», «besta», «imagem» e «espada» são escolhas fiéis e consistentes. «Mesmo assim» é interpretativamente plausível pelo contexto, mas não é necessário para traduzir καί; omiti-lo preserva maior contenção textual.
  issues:
