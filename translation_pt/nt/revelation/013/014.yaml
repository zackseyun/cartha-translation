id: REV.13.14
reference: Revelation 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: pt
  text: E ela engana[a] os que habitam sobre a terra por causa dos sinais que lhe foi dado realizar na presença da besta, dizendo aos que habitam sobre a terra que façam uma imagem para a besta[b], a qual tem a ferida da espada e viveu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desencaminha os que habitam sobre a terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma imagem da besta”; mais literalmente, o grego diz “uma imagem para a besta”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “tem a ferida da espada e voltou a viver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: engana
  rationale: Expressa com clareza o sentido causativo de induzir ao erro; “desencaminha” permanece como alternativa legítima.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: os que habitam sobre a terra
  rationale: Mantém a forma verbal e a expressão temática recorrente em Apocalipse, sem reduzi-la a uma simples indicação geográfica.
- source_word: διὰ τὰ σημεῖα
  choice: por causa dos sinais
  rationale: Preserva a força causal-instrumental de διά com acusativo sem decidir de modo excessivamente rígido entre causa e meio.
- source_word: σημεῖα
  choice: sinais
  rationale: Traduz o substantivo sem acrescentar “miraculosos”, qualificativo sugerido pelo contexto, mas não expresso lexicalmente.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: lhe foi dado realizar
  rationale: Conserva a voz passiva e não identifica explicitamente quem concedeu essa capacidade ou permissão.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: na presença da besta
  rationale: Forma natural em português que preserva o sentido espacial e relacional.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a forma participial e introduz naturalmente o conteúdo dirigido aos habitantes da terra, sem intensificá-lo como ordem explícita.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: que façam uma imagem para a besta
  rationale: O dativo favorece “para a besta”, indicando referência ou dedicação; “da besta” é possível por implicação, mas não reproduz diretamente a construção grega.
- source_word: εἰκόνα
  choice: imagem
  rationale: Preserva a amplitude semântica, inclusive a possibilidade de uma representação cultual, sem restringi-la a “estátua”.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: a qual tinha a ferida da espada
  rationale: A relativa identifica a besta por sua ferida. O pretérito harmoniza a descrição com o acontecimento anterior sem eliminar a formulação característica do texto.
- source_word: μάχαιρα
  choice: espada
  rationale: É a equivalência convencional e suficientemente precisa no contexto de Apocalipse.
- source_word: καὶ ἔζησεν
  choice: e, mesmo assim, viveu
  rationale: Comunica o contraste contextual entre a ferida e a continuidade ou restauração da vida sem impor explicitamente uma ressurreição.
theological_decisions:
- issue: Implicação da passiva em ἐδόθη
  choice: Manter “lhe foi dado” sem nomear o agente.
  alternative: “Deus lhe concedeu” ou “foi-lhe permitido”.
  rationale: A passiva apocalíptica pode sugerir permissão sob soberania divina, mas explicitar Deus como agente excederia a formulação do versículo.
- issue: Sentido de ἔζησεν depois da ferida
  choice: Traduzir “e, mesmo assim, viveu”.
  alternative: “e voltou a viver” ou “e reviveu”.
  rationale: A tradução conserva o efeito surpreendente de vida após a ferida sem transformar a frase numa afirmação inequívoca de ressurreição.
- issue: Referente e personificação de ὃς
  choice: Usar “a qual” para retomar “a besta”.
  alternative: Reformular como “que tinha...”.
  rationale: O relativo grego trata a besta de modo personificado; em português, a concordância feminina é exigida pelo substantivo “besta”, sem resolver a identidade simbólica da figura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “os que habitam sobre a terra” foi mantida por seu valor temático em Apocalipse. A construção passiva e as ambiguidades relativas aos sinais, à imagem e à vida da besta foram preservadas.
