id: REV.13.10
reference: Revelation 13:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: pt
  text: Se alguém está destinado ao cativeiro, para o cativeiro vai[a]; se alguém deve ser morto à espada, à espada deve ser morto[b]. Aqui está a perseverança e a fé[c] dos santos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se alguém vai para o cativeiro, para o cativeiro vai”. A frase também pode ser entendida como declaração de um destino determinado, e não como ordem.'
    reason: alternative_reading
  - marker: b
    text: 'Alguns manuscritos ou formas do texto trazem uma redação diferente nesta oração, inclusive: “Se alguém matar à espada, à espada deve ser morto”. Aqui se segue o texto adotado, mas a variante é importante para a interpretação.'
    reason: textual_variant
  - marker: c
    text: 'Ou: “fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Se alguém
  rationale: Expressão condicional indefinida que apresenta um princípio geral; esta formulação é natural e mantém a referência aberta.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: está destinado ao cativeiro, para o cativeiro vai
  rationale: Mantém a repetição enfática de εἰς αἰχμαλωσίαν e explicita ὑπάγει. “Está destinado” comunica a construção elíptica e proverbial, enquanto a nota preserva outra análise possível.
- source_word: αἰχμαλωσία
  choice: cativeiro
  rationale: Designa a condição de quem é levado cativo e conserva o tom solene de juízo e a provável alusão bíblica.
- source_word: ἐν μαχαίρῃ
  choice: à espada
  rationale: Expressão portuguesa idiomática para o uso instrumental da espada, adequada à linguagem bíblica de juízo.
- source_word: ἀποκτανθῆναι
  choice: ser morto
  rationale: Reproduz com clareza o infinitivo aoristo passivo sem recorrer ao mais literário “ser imolado”.
- source_word: αὐτὸν
  choice: deve ser morto
  rationale: A construção grega é abrupta; esta formulação produz uma oração portuguesa coerente, mantém a voz passiva e comunica o destino inevitável sugerido pelo contexto.
- source_word: ὧδέ ἐστιν
  choice: Aqui estão
  rationale: Chama a atenção para as qualidades mencionadas a seguir e concorda naturalmente com os dois substantivos coordenados.
- source_word: ὑπομονή
  choice: perseverança
  rationale: Expressa constância paciente em meio ao sofrimento e é uma tradução corrente e natural no contexto de Apocalipse.
- source_word: πίστις
  choice: fé
  rationale: Preserva o sentido lexical central e a formulação teológica tradicional, sem excluir a nuance contextual de fidelidade, registrada em nota.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Forma concisa e tradicional para o povo santo de Deus, amplamente compreensível em português.
theological_decisions:
- issue: 'Sentido das duas primeiras orações: destino judicial descritivo ou ordem prescritiva'
  choice: Destino ou necessidade determinada, expressa por “está destinado” e “deve ser morto”
  alternative: Uma ordem para não resistir à violência; ou um princípio retributivo segundo o qual quem leva outros ao cativeiro ou mata será tratado do mesmo modo
  rationale: Na forma textual adotada, o grego é conciso e difícil, mas aponta mais naturalmente para uma declaração proverbial do que está determinado. A tradução não transforma o versículo numa doutrina explícita de pacifismo nem de retaliação.
- issue: Sentido de πίστις na oração final
  choice: fé
  alternative: fidelidade
  rationale: “Fé” preserva o valor lexical principal; como o contexto de perseverança sob opressão permite entender a palavra também como “fidelidade”, essa nuance é mantida em nota.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A repetição retórica do original foi preservada; evitou-se linguagem excessivamente arcaica e também uma explicação doutrinária além do que o texto afirma.
