id: REV.13.1
reference: Revelation 13:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: pt
  text: E vi uma besta que subia do mar, com dez chifres e sete cabeças. Sobre os seus chifres havia dez diademas, e sobre as suas cabeças, nomes de blasfêmia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nomes blasfemos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω é expresso naturalmente pelo pretérito perfeito, sem acrescentar que se tratava de uma visão.
- source_word: ἐκ τῆς θαλάσσης
  choice: do mar
  rationale: Com o verbo de movimento 'subia', 'do mar' comunica de modo natural a procedência desde o interior do mar e preserva a imagem de emergência.
- source_word: θηρίον
  choice: besta
  rationale: '''Besta'' é a designação tradicional e inteligível no contexto apocalíptico, preservando a figura simbólica sem identificá-la interpretativamente.'
- source_word: ἀναβαῖνον
  choice: que subia
  rationale: O particípio presente retrata a ação em andamento observada por João; a oração relativa é idiomática em português.
- source_word: ἔχον
  choice: com
  rationale: '''Com'' apresenta de modo claro e natural as características da besta, sem perder o valor descritivo do particípio.'
- source_word: κέρατα δέκα
  choice: dez chifres
  rationale: Tradução direta que mantém intacta a imagem simbólica.
- source_word: κεφαλὰς ἑπτά
  choice: sete cabeças
  rationale: Tradução direta que não interpreta o símbolo no corpo do texto.
- source_word: διαδήματα
  choice: diademas
  rationale: διάδημα designa especificamente um emblema de realeza. 'Diademas' é compreensível em português e distingue este termo de στέφανος, também empregado no Apocalipse.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: sobre os seus chifres
  rationale: A expressão traduz naturalmente a localização dos diademas sobre os chifres.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: sobre as suas cabeças
  rationale: Preserva a relação locativa e a repetição estrutural do grego.
- source_word: ὀνόματα βλασφημίας
  choice: nomes de blasfêmia
  rationale: Mantém a construção genitiva e sua solenidade apocalíptica; a possível leitura atributiva é registrada em nota.
theological_decisions:
- issue: Imagens simbólicas apocalípticas
  choice: Manter literalmente 'besta', 'chifres', 'cabeças', 'diademas' e 'nomes de blasfêmia'.
  alternative: Identificar a besta ou seus elementos como império, reino, governante ou agente satânico no próprio texto.
  rationale: O versículo apresenta símbolos sem explicá-los aqui; interpretá-los na tradução imporia uma leitura escatológica específica.
- issue: Valor do genitivo em ὀνόματα βλασφημίας
  choice: nomes de blasfêmia
  alternative: nomes blasfemos
  rationale: A formulação principal preserva a estrutura e a ambiguidade do genitivo grego, enquanto a nota oferece a leitura atributiva natural.
- issue: Distinção entre διάδημα e στέφανος
  choice: diademas
  alternative: coroas
  rationale: O termo português mais específico preserva a conotação régia e a distinção lexical existente no Apocalipse, sem explicar o simbolismo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases favorece a clareza sem alterar a sequência da visão. O marcador [a] aparece imediatamente após a expressão à qual se refere.
