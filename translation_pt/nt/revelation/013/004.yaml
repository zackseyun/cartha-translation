source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: pt
  text: 'E adoraram o dragão, porque ele havia dado autoridade à besta, e adoraram também a besta, dizendo: “Quem é semelhante à besta?[a][b] E quem pode fazer guerra contra ela?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem pode ser comparado à besta?”'
    reason: lexical_alternative
  - marker: b
    text: Esta aclamação provavelmente ecoa a linguagem do Antigo Testamento sobre a incomparabilidade de Deus (por exemplo, Êx 15:11; Sl 35:10), aqui aplicada de forma blasfema à besta.
    reason: cross_reference
  - marker: c
    text: 'Ou: “E quem é capaz de travar guerra contra ela?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: Em Apocalipse, προσκυνέω normalmente expressa veneração religiosa. “Adoraram” comunica com clareza a força idólatra do ato, sem reduzi-lo a uma simples reverência física.
- source_word: δράκοντι
  choice: dragão
  rationale: Tradução direta e consagrada de δράκων no imaginário apocalíptico, sem interpretar o símbolo dentro do versículo.
- source_word: ὅτι
  choice: porque
  rationale: 'A conjunção apresenta a razão pela qual adoraram o dragão: ele havia concedido autoridade à besta.'
- source_word: ἔδωκεν
  choice: havia dado
  rationale: 'O mais-que-perfeito composto torna natural em português a sequência implícita: a concessão da autoridade precedeu a adoração descrita.'
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: ἐξουσία denota autoridade ou poder de governo, particularmente uma autoridade concedida; “autoridade” preserva melhor essa nuance do que o termo mais amplo “poder”.
- source_word: θηρίῳ
  choice: besta
  rationale: “Besta” é a tradução tradicional e adequada de θηρίον na linguagem simbólica de Apocalipse.
- source_word: λέγοντες
  choice: dizendo
  rationale: Introduz diretamente o conteúdo da aclamação e corresponde de modo natural ao particípio grego.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Quem é semelhante à besta?
  rationale: Mantém a forma retórica e a provável evocação de fórmulas bíblicas sobre a incomparabilidade de Deus, sem explicá-la no corpo do texto.
- source_word: δύναται
  choice: pode
  rationale: “Pode” expressa de forma direta e natural a capacidade indicada por δύναμαι.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: guerrear contra ela
  rationale: “Guerrear” conserva o sentido militar de πολεμέω, enquanto “contra ela” expressa naturalmente em português o confronto hostil indicado por μετά com o genitivo neste contexto.
theological_decisions:
- issue: Gênero do pronome que retoma a besta
  choice: Usar “ela”, de acordo com o gênero gramatical feminino de “besta” em português.
  alternative: Usar uma construção sem pronome, como “guerrear contra a besta”, para evitar qualquer possível leitura de personificação.
  rationale: O grego retoma o substantivo neutro θηρίον com αὐτοῦ. Em português, a concordância normal exige “ela” para retomar “besta”; isso não decide se a figura simbólica deve ser entendida como impessoal ou pessoal.
- issue: Eco da linguagem sobre a incomparabilidade divina
  choice: Conservar “Quem é semelhante à besta?” e explicar a provável alusão em nota.
  alternative: Expandir a tradução para tornar explícita a paródia blasfema da linguagem aplicada a Deus.
  rationale: A formulação grega provavelmente ecoa aclamações veterotestamentárias da singularidade de Deus. Preservar a frase sem expansão mantém a alusão e a tensão teológica sem impor a interpretação ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Adoraram também” evita uma repetição pesada sem omitir o segundo καί. A pontuação preserva as duas perguntas retóricas, e todos os marcadores de nota aparecem junto às expressões que explicam.
