id: REV.13.7
reference: Revelation 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: pt
  text: E foi-lhe dado fazer guerra contra os santos e vencê-los, e foi-lhe dada autoridade sobre toda tribo, povo, língua e nação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: foi-lhe dado / foi-lhe dada
  rationale: 'Preserva nas duas ocorrências a construção passiva e não identifica quem concede, mantendo a contenção e a tensão do texto grego. A concordância varia naturalmente em português conforme o complemento: “dado” antes do infinitivo e “dada” com “autoridade”.'
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: fazer guerra contra os santos
  rationale: “Fazer guerra” reproduz de modo natural a expressão grega; no contexto bélico, μετά indica confronto hostil, por isso “contra”. “Santos” é a designação bíblica corrente para o povo santo de Deus.
- source_word: νικῆσαι αὐτούς
  choice: vencê-los
  rationale: “Vencer” é natural em português e preserva o motivo recorrente de νικάω em Apocalipse, sem explicar além do que o texto afirma.
- source_word: ἐξουσία
  choice: autoridade
  rationale: Expressa direito ou jurisdição concedida, em harmonia com a voz passiva, sem reduzir o termo a mera força.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: sobre toda tribo, povo, língua e nação
  rationale: Mantém a abrangência da fórmula quádrupla em português claro. “Língua” é a forma bíblica e ainda corrente para um idioma, preservando a imagem lexical de γλῶσσα.
theological_decisions:
- issue: Passivo sem agente nas duas ocorrências de ἐδόθη
  choice: Manter “foi-lhe dado” e “foi-lhe dada”, sem nomear o doador.
  alternative: Explicitar a ideia como “foi-lhe permitido” ou identificar implicitamente Deus como aquele que permitiu.
  rationale: O grego não nomeia o agente. A forma passiva conserva a tensão entre a ação do mal e a autoridade que lhe é concedida, sem resolver interpretativamente a questão da soberania divina.
- issue: Alcance de νικῆσαι sobre os santos
  choice: Traduzir literalmente como “vencê-los”.
  alternative: Suavizar para “prevalecer temporariamente contra eles” ou limitar explicitamente a vitória ao plano físico.
  rationale: O versículo afirma que a besta vence os santos, mas não qualifica aqui a natureza ou a duração dessa vitória. Acrescentar tais limites importaria uma harmonização teológica para o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal “foi-lhe” preserva concisão e solenidade sem soar arcaica; a coordenação e a repetição do passivo acompanham de perto a estrutura grega.
