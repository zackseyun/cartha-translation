source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: pt
  text: E ela abriu a boca para proferir blasfêmias contra Deus, para blasfemar o nome dele e a sua habitação[b], os que habitam no céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os que habitam no céu”, entendendo a frase final como um terceiro objeto de “blasfemar”, em vez de uma explicação de “a sua habitação”.'
    reason: alternative_reading
  - marker: b
    text: “Habitação” também pode ser traduzida por “tabernáculo” ou “tenda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: ela abriu a boca
  rationale: Mantém a imagem vívida do grego. O pronome feminino retoma naturalmente “a besta” em português, sem transformar o referente em pessoa humana.
- source_word: εἰς βλασφημίας
  choice: para proferir blasfêmias
  rationale: A formulação comunica em português corrente a finalidade ou o conteúdo da abertura da boca e preserva o plural βλασφημίας, que sugere manifestações blasfemas múltiplas.
- source_word: πρὸς τὸν θεόν
  choice: contra Deus
  rationale: No contexto de fala hostil, πρός tem força adversativa, expressa naturalmente por “contra”.
- source_word: βλασφημῆσαι
  choice: para blasfemar
  rationale: O infinitivo é mantido como expressão de propósito, preservando a repetição retórica da raiz de “blasfêmias”.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o nome dele
  rationale: Preserva literalmente “nome”, incluindo suas conotações bíblicas de identidade revelada e honra. “Dele” deixa claro que o referente é Deus.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: a sua habitação
  rationale: σκηνή pode significar tenda, tabernáculo ou habitação. “Habitação” é acessível e digna, sem impor ao contexto uma associação cultual específica.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: os que habitam no céu
  rationale: Traduz naturalmente o particípio presente e conserva a ligação semântica entre σκηνή e σκηνοῦντας por meio de “habitação” e “habitam”.
theological_decisions:
- issue: Relação entre “a sua habitação” e “os que habitam no céu”
  choice: 'Apresentar a frase final como aposição explicativa direta: “a sua habitação, os que habitam no céu”.'
  alternative: 'Entender “os que habitam no céu” como terceiro objeto coordenado de “blasfemar”: “e os que habitam no céu”.'
  rationale: A aposição explica a habitação de Deus em termos dos que habitam no céu e respeita a proximidade lexical entre σκηνή e σκηνοῦντας. Como a coordenação também é gramaticalmente plausível, ela é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição “blasfêmias… blasfemar” reproduz deliberadamente a repetição do grego. A aposição é mantida sem acrescentar “isto é”, preservando a concisão e a ambiguidade sintática do texto-fonte.
