id: REV.13.12
reference: Revelation 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: pt
  text: E ela exerce toda a autoridade da primeira besta na presença da primeira besta[a]. E faz com que a terra e os que nela habitam adorem a primeira besta, cuja ferida mortal foi curada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dela”. A expressão pode destacar que a segunda besta age sob o olhar da primeira besta ou em sua presença imediata.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cuja ferida de morte foi curada”, isto é, “cuja ferida mortal foi curada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: O termo indica autoridade, direito ou poder exercido, não apenas força bruta; “autoridade” preserva melhor essa nuance.
- source_word: πᾶσαν
  choice: toda
  rationale: Expressa a abrangência completa da autoridade da primeira besta exercida pela segunda.
- source_word: ποιεῖ (primeira ocorrência)
  choice: exerce
  rationale: Na expressão ποιεῖ τὴν ἐξουσίαν, “exerce a autoridade” é natural em português e comunica a ideia de colocá-la em ação.
- source_word: ἐνώπιον αὐτοῦ
  choice: na presença dela
  rationale: Preserva o sentido espacial e relacional de agir diante da primeira besta ou sob seu olhar, sem definir mais precisamente a relação.
- source_word: ποιεῖ (segunda ocorrência)
  choice: faz com que
  rationale: Com os objetos e a oração introduzida por ἵνα, o verbo tem força causativa. A formulação não acrescenta um grau de coerção que o grego não explicita.
- source_word: τὴν γῆν
  choice: a terra
  rationale: Em Apocalipse, γῆ costuma designar a terra em perspectiva ampla, frequentemente em contraste com o céu ou o mar.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: os que nela habitam
  rationale: Mantém a forma verbal e a expressão recorrente de Apocalipse para os habitantes da terra.
- source_word: ἵνα προσκυνήσουσιν
  choice: adorem
  rationale: Depois da construção causativa “faz com que”, o subjuntivo português expressa de modo natural a ação pretendida ou produzida.
- source_word: θηρίον
  choice: besta
  rationale: É a tradução direta e tradicional de θηρίον neste contexto apocalíptico.
- source_word: ἐθεραπεύθη
  choice: foi curada
  rationale: O passivo de θεραπεύω denota cura; a escolha preserva o motivo da recuperação extraordinária.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: sua ferida mortal
  rationale: A construção caracteriza a ferida como causadora de morte. “Ferida mortal” é idiomático em português e mantém esse sentido.
theological_decisions:
- issue: Força da ação da segunda besta sobre os habitantes da terra
  choice: faz com que ... adorem
  alternative: obriga ... a adorar
  rationale: A construção grega é causativa e afirma que a segunda besta produz essa adoração, mas o versículo não especifica por si só o grau exato de coerção. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ela” retoma a segunda besta do contexto, e “dela” retoma a primeira besta. A segunda conjunção grega foi representada por uma nova oração para evitar repetição pesada sem perder a progressão do versículo.
