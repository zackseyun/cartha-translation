reference: Revelation 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: pt
  text: E para que ninguém possa comprar ou vender, a não ser quem tiver a marca, o nome da besta ou o número do nome dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o número do nome dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: para que ninguém possa
  rationale: ἵνα introduz propósito ou resultado, μή τις expressa um sujeito indefinido negativo e δύνηται indica capacidade ou possibilidade. A formulação é natural em português e preserva a força da oração.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: comprar ou vender
  rationale: Os infinitivos designam as atividades comerciais comuns e formam em português o par mais direto e natural.
- source_word: εἰ μὴ ὁ ἔχων
  choice: a não ser quem tiver
  rationale: εἰ μή introduz a única exceção, e o particípio substantivado ὁ ἔχων significa genericamente “quem tem”. O futuro do subjuntivo é idiomático em português nesta condição e não restringe indevidamente a referência por gênero.
- source_word: τὸ χάραγμα
  choice: a marca
  rationale: χάραγμα pode indicar marca, selo impresso ou inscrição; “a marca” é claro, tradicional e adequado ao contexto apocalíptico.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: o nome da besta
  rationale: A expressão reproduz diretamente a construção genitiva e mantém o paralelismo com a frase seguinte.
- source_word: θηρίου
  choice: besta
  rationale: Em Apocalipse, θηρίον funciona como designação simbólica do antagonista apocalíptico; “besta” é a tradução portuguesa estabelecida neste contexto.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: ou o número do nome dela
  rationale: O antecedente imediato de αὐτοῦ é “a besta”. Em português, o pronome retoma naturalmente o gênero gramatical feminino de “besta”, sem decidir se a figura deve ser entendida como pessoal.
theological_decisions:
- issue: Expressão genericamente inclusiva em ὁ ἔχων
  choice: a não ser quem tiver
  alternative: a não ser aquele que tiver
  rationale: Embora o grego use artigo e particípio no masculino singular, a expressão é substantivada e genérica. “Quem tiver” preserva essa abrangência com naturalidade, sem introduzir uma limitação masculina ausente do sentido.
- issue: Referência de αὐτοῦ depois de θηρίου
  choice: do nome dela
  alternative: do nome dele
  rationale: “Dela” concorda naturalmente com o substantivo português feminino “besta”. “Dele” continua possível se a besta for apresentada explicitamente como agente pessoal; a nota conserva essa alternativa sem resolver além do texto.
- issue: Relação entre “marca”, “nome” e “número”
  choice: manter a sequência separada por vírgula
  alternative: usar travessão ou explicitação appositiva
  rationale: A sequência acusativa grega permite perceber os termos seguintes como identificação ou especificação da marca, mas não explicita rigidamente essa relação. A vírgula preserva a tensão sintática sem impor uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A não ser quem tiver” evita rigidez artificial e comunica corretamente a exceção genérica. A pontuação mantém aberta a relação sintática entre a marca, o nome e o número.
