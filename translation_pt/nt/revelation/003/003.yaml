  naturalness: O texto é geralmente claro e moderno. A segunda ocorrência de «Portanto» antes de «se» é gramatical, mas soa pesada; «Se, portanto,» preserva a inferência grega com melhor fluidez. «Manter-se vigilante» é mais natural do que «permanecer acordado» neste contexto exortativo, embora conserve a imagem de vigilância.
  terminology: «Arrependa-se», «guarde isso» e «como um ladrão» são escolhas adequadas e não impõem uma leitura doutrinária. A nota a deve manter o destinatário no singular («você recebeu e ouviu»), em concordância com o texto e com o grego.
