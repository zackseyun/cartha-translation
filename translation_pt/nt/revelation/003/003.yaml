  to: Portanto, lembre-se de como você recebeu e ouviu[a]; guarde isso e arrependa-se. Se, portanto, você não se mantiver vigilante[b], virei como um ladrão[c], e você certamente não saberá a que hora virei contra você.
  rationale: A revisão melhora a idiomaticidade portuguesa e corrige a incoerência de pessoa na nota, preservando a ambiguidade de πῶς e o caráter não especificado da vinda. «Contra você» expressa de modo natural a advertência de ἐπὶ σέ sem impor uma interpretação escatológica ou histórica determinada.
