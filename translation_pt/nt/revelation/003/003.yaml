id: REV.3.3
reference: Revelation 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: pt
  text: Portanto, lembre-se de como você recebeu e ouviu[a]; guarde isso e arrependa-se. Se, portanto, você não se mantiver vigilante[b], virei como um ladrão[c], e você certamente não saberá a que hora virei contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «lembre-se do que você recebeu e ouviu». O grego diz «como», o que pode enfatizar a maneira pela qual você recebeu e ouviu, embora alguns entendam a expressão como referência à própria mensagem.'
    reason: alternative_reading
  - marker: b
    text: «Manter-se vigilante» também pode ser traduzido por «ficar acordado» ou «ficar atento».
    reason: lexical_alternative
  - marker: c
    text: A advertência «virei como um ladrão» evoca linguagem de uma visitação súbita e inesperada. O versículo não especifica se se refere ao juízo final ou a uma ação disciplinar mais imediata.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: lembre-se
  rationale: O imperativo presente pede lembrança contínua; «lembre-se» é natural, direto e preserva a força da exortação.
- source_word: οὖν
  choice: portanto
  rationale: Marca uma conclusão baseada na repreensão anterior. A repetição no versículo reflete as duas ocorrências gregas, embora o segundo uso também possa ser entendido como «assim».
- source_word: πῶς
  choice: como
  rationale: Preserva o advérbio grego e sua possível ênfase na maneira da recepção, sem reduzi-lo ao conteúdo recebido.
- source_word: εἴληφας
  choice: você recebeu
  rationale: Em português, o pretérito perfeito simples expressa naturalmente a recepção passada ainda relevante no contexto; uma forma composta sugeriria repetição ou continuidade indevida.
- source_word: ἤκουσας
  choice: ouviu
  rationale: Expressa de modo direto o ato anterior de ouvir, conforme o aoristo grego.
- source_word: τήρει
  choice: guarde isso
  rationale: τηρέω pode envolver conservar, observar e obedecer. «Guarde» mantém essa amplitude; «isso» explicita em português o objeto implícito, remetendo ao que foi recebido e ouvido.
- source_word: μετανόησον
  choice: arrependa-se
  rationale: É a formulação neotestamentária corrente para a convocação a abandonar o pecado e mudar de direção.
- source_word: γρηγορήσῃς
  choice: permanecer acordado
  rationale: Conserva a metáfora de vigília e liga-se naturalmente à imagem do ladrão, admitindo também o sentido de manter-se vigilante.
- source_word: ἥξω ὡς κλέπτης
  choice: virei como um ladrão
  rationale: Mantém a comparação e a ideia de chegada súbita e inesperada sem definir a natureza dessa visitação.
- source_word: οὐ μὴ γνῷς
  choice: você certamente não saberá
  rationale: A construção οὐ μή com subjuntivo traz negação enfática; «certamente não» comunica essa força em português atual.
- source_word: ποίαν ὥραν
  choice: a que hora
  rationale: Preserva a referência específica à «hora» e soa natural em português.
- source_word: ἐπὶ σέ
  choice: sobre você
  rationale: Mantém o movimento dirigido ao destinatário e o tom solene, sem decidir entre simples visitação e ação de juízo.
theological_decisions:
- issue: Sentido de πῶς εἴληφας καὶ ἤκουσας
  choice: «lembre-se de como você recebeu e ouviu»
  alternative: «lembre-se do que você recebeu e ouviu»
  rationale: O texto grego traz πῶς, «como», que aponta mais diretamente para a maneira da recepção. A nota registra a leitura funcional referente ao conteúdo sem substituir a ambiguidade do original.
- issue: Natureza da vinda «como um ladrão»
  choice: A advertência permanece indefinida quanto ao tipo de visitação.
  alternative: Identificá-la explicitamente com a vinda final de Cristo ou com um juízo histórico e disciplinar imediato.
  rationale: O próprio versículo destaca o caráter inesperado da vinda, mas não determina seu alcance. A tradução evita impor uma conclusão doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» por ser natural para o destinatário singular e evita formas compostas pouco idiomáticas para os tempos perfeitos gregos. Mantém «sobre você» para preservar a solenidade e a abertura semântica de ἐπὶ σέ.
