source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: pt
  text: Desperte e fortaleça o que resta, que estava para morrer, pois não achei completas as suas obras diante do meu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Desperte
  rationale: A expressão exorta a sair da falta de vigilância. “Desperte” comunica naturalmente a imagem de acordar e permanecer alerta, especialmente adequada ao contexto de Sardes.
- source_word: στήρισον
  choice: fortaleça
  rationale: Expressa firmar, sustentar ou tornar forte aquilo que ainda resta.
- source_word: τὰ λοιπὰ
  choice: o que resta
  rationale: Mantém o sentido coletivo e indefinido do neutro plural grego em português natural.
- source_word: ἔμελλον ἀποθανεῖν
  choice: estava para morrer
  rationale: Preserva a ideia de morte iminente sem afirmar que ela já ocorreu.
- source_word: πεπληρωμένα
  choice: completas
  rationale: Indica obras não levadas à plenitude ou conclusão; “completas” conserva essa amplitude sem acrescentar uma avaliação denominacional específica.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: diante do meu Deus
  rationale: Reproduz de modo direto a perspectiva de avaliação na presença de Deus e preserva “meu Deus”.
theological_decisions:
- issue: Estado daquilo que ainda resta
  choice: “estava para morrer”
  alternative: “está a ponto de morrer”
  rationale: O imperfeito ἔμελλον apresenta a condição constatada como iminente; a formulação escolhida conserva o aspecto do texto sem decidir se a ameaça já avançou desde então.
- issue: Avaliação das obras
  choice: “não achei completas as suas obras”
  alternative: “não achei perfeitas as suas obras”
  rationale: “Completas” representa melhor a ideia de obras não cumpridas ou levadas à plenitude, evitando sugerir necessariamente perfeição moral absoluta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A frase mantém a urgência da advertência e a imagem de despertar, sem explicitar além do grego o referente de “o que resta”.
