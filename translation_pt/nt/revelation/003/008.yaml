  naturalness: O português é claro, moderno e adequado ao registro de Apocalipse. «Eis» funciona bem como sinal de chamada de atenção e evita que «Veja» soe como uma ordem coloquial dirigida ao destinatário.
  terminology: «Obras», «porta aberta», «pouca força», «minha palavra» e «meu nome» são escolhas precisas, naturais e teologicamente não interpretativas. A nota de «Eis» preserva uma alternativa moderna legítima.
