source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: pt
  text: 'Conheço as suas obras. Eis[a]: coloquei diante de você uma porta aberta, que ninguém pode fechar, porque você tem pouca força, e guardou a minha palavra, e não negou o meu nome.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Veja”. A expressão grega chama a atenção para o que vem a seguir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Conheço as suas obras
  rationale: οἶδα tem forma perfeita, mas sentido presente; “conheço” reproduz naturalmente o valor do verbo. “Obras” preserva o substantivo plural e a fórmula recorrente em Apocalipse.
- source_word: ἰδοὺ
  choice: Veja
  rationale: É um marcador discursivo que chama a atenção. “Veja” é atual, digno e mais natural em português amplo do que o arcaizante “eis” ou “eis que” neste contexto.
- source_word: δέδωκα ἐνώπιόν σου
  choice: coloquei diante de você
  rationale: Embora δέδωκα signifique literalmente “dei”, com “porta” e “diante de você” o sentido idiomático é colocar ou dispor a porta diante do destinatário. O pretérito perfeito é natural em português e mantém o resultado presente pelo contexto.
- source_word: θύραν ἠνεῳγμένην
  choice: uma porta aberta
  rationale: 'A expressão é natural em português e comunica o estado resultante indicado pelo particípio perfeito passivo: a porta foi aberta e permanece aberta.'
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: que ninguém pode fechar
  rationale: “Pode” expressa diretamente a capacidade indicada por δύναται, e “fechar” é a combinação idiomática com “porta”.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: porque você tem pouca força
  rationale: ὅτι é entendido causalmente, e “pouca força” preserva a ideia de capacidade limitada sem especificar a sua natureza.
- source_word: καὶ ἐτήρησάς μου τὸν λόγον
  choice: mas guardou a minha palavra
  rationale: “Guardar” conserva a amplitude de τηρέω, que pode envolver obedecer, preservar e permanecer fiel. O “mas” traduz o valor adversativo que o primeiro καί assume naturalmente após a concessão implícita “embora tenha pouca força”.
- source_word: καὶ οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: e não negou o meu nome
  rationale: A formulação mantém literalmente a linguagem de lealdade e identificação representada pelo “nome”, sem a substituir por uma interpretação.
theological_decisions:
- issue: Sentido da imagem da porta aberta
  choice: Manter a imagem como “uma porta aberta”, sem explicar o seu referente.
  alternative: Interpretá-la como oportunidade missionária, acesso ao Reino ou oportunidade providencial.
  rationale: O versículo não identifica explicitamente o referente da metáfora; especificá-lo na tradução eliminaria uma ambiguidade genuína.
- issue: Relação entre a pouca força e a fidelidade da igreja
  choice: Usar “porque você tem pouca força, mas guardou...”
  alternative: 'Coordenar todas as orações com “e”: “porque você tem pouca força, e guardou...”'
  rationale: 'O grego emprega καί, mas a sequência sugere naturalmente um contraste: apesar da força limitada, a comunidade guardou a palavra e não negou o nome. “Mas” explicita em português essa relação discursiva sem transformar “pouca força” em mérito.'
- issue: Valor aspectual das formas perfeitas
  choice: Empregar formas portuguesas naturais cujo resultado presente seja claro pelo contexto.
  alternative: 'Usar sistematicamente o pretérito perfeito composto: “tenho colocado”, “tem guardado”.'
  rationale: O pretérito perfeito composto em português costuma indicar ação repetida ou continuada, não sendo equivalente direto do perfeito grego. “Coloquei” apresenta uma ação concluída cujo efeito permanece; “guardou” e “não negou” descrevem a fidelidade demonstrada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “você” no singular porque a mensagem se dirige ao anjo/representante da igreja em forma singular. Evita construções lusitanas ou arcaicas e preserva a metáfora sem interpretação denominacional.
