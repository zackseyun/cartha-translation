id: REV.3.18
reference: Revelation 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: pt
  text: Aconselho você a comprar de mim ouro refinado pelo fogo[a], para que se torne rico, e vestes brancas[b], para que se vista e a vergonha da sua nudez não fique exposta, e colírio[c] para aplicar nos seus olhos, a fim de que veja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “purificado pelo fogo” ou “provado no fogo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “roupas brancas”; em certos contextos, “mantos brancos”.
    reason: lexical_alternative
  - marker: c
    text: O termo se refere a uma preparação medicinal aplicada aos olhos.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: Aconselho
  rationale: O presente do indicativo em primeira pessoa expressa uma recomendação direta e autorizada. “Aconselho” é natural em português e preserva o peso da exortação.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: comprar de mim
  rationale: 'O infinitivo mantém a metáfora comercial, e παρά com genitivo indica a fonte: aquilo que deve ser comprado procede do próprio locutor.'
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: ouro refinado pelo fogo
  rationale: A formulação conserva a imagem metalúrgica de ouro submetido ao fogo e já refinado, expressa pelo particípio perfeito passivo.
- source_word: ἵνα πλουτήσῃς
  choice: para que se torne rico
  rationale: “Torne-se rico” representa adequadamente a possível força ingressiva do aoristo subjuntivo, isto é, a entrada em uma condição de riqueza.
- source_word: ἱμάτια λευκά
  choice: vestes brancas
  rationale: “Vestes” é amplo o suficiente para o termo grego e mantém o registro digno e a imagem recorrente do Apocalipse sem restringi-la especificamente a mantos.
- source_word: ἵνα περιβάλῃ
  choice: para que se vista
  rationale: A forma média é expressa naturalmente de modo reflexivo em português, indicando que o destinatário põe as vestes em si mesmo.
- source_word: μὴ φανερωθῇ
  choice: não fique exposta
  rationale: A tradução mantém a voz passiva e se ajusta naturalmente ao contexto de nudez e vergonha, no qual tornar-se visível equivale a ficar exposto.
- source_word: ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: a vergonha da sua nudez
  rationale: A construção genitiva é preservada sem interpretar além do texto; “vergonha” é o equivalente corrente e adequado para αἰσχύνη.
- source_word: κολλούριον
  choice: colírio
  rationale: Em português moderno, “colírio” comunica com clareza uma preparação medicinal destinada aos olhos e evita um tecnicismo desnecessário.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: para passar nos olhos
  rationale: O verbo denota aplicar ou esfregar uma substância. “Passar nos olhos” descreve a ação de modo claro e natural, sem introduzir conotação sacramental indevida.
- source_word: ἵνα βλέπῃς
  choice: a fim de que veja
  rationale: A oração final é mantida de forma direta, preservando a imagem da recuperação da visão sem explicitar no texto principal o seu referente espiritual.
theological_decisions:
- issue: Sentido simbólico do ouro, das vestes brancas e do colírio
  choice: Manter literalmente as três imagens, sem identificar no corpo do versículo seus possíveis referentes espirituais.
  alternative: Explicar o ouro como riqueza espiritual, as vestes como justiça ou pureza e o colírio como discernimento espiritual.
  rationale: O contexto convida a uma leitura simbólica, mas este versículo não define explicitamente cada símbolo. A tradução conserva a abertura interpretativa do texto.
- issue: Possíveis conotações religiosas de ἐγχρῖσαι
  choice: Traduzir a ação medicinal como “passar nos olhos”.
  alternative: Usar “ungir os olhos”, preservando mais diretamente a ideia de aplicar por unção.
  rationale: Embora “ungir” seja lexicalmente possível, no português atual pode sugerir um rito religioso que o contexto imediato não afirma. “Passar” comunica a aplicação do colírio e não elimina a dimensão metafórica do conjunto.
- issue: Força da exortação de συμβουλεύω
  choice: Usar “Aconselho”, mantendo a forma de recomendação autorizada.
  alternative: Usar uma ordem direta, como “Compre de mim”.
  rationale: O grego apresenta explicitamente o verbo “aconselhar”. Transformá-lo em imperativo apagaria a forma retórica escolhida pelo texto, ainda que a fala tenha autoridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura paralela dos três produtos foi realçada por ponto e vírgula. “Vestes” preserva o tom imagético do Apocalipse, enquanto “passar nos olhos” evita uma formulação artificial ou indevidamente ritual.
