id: REV.3.21
reference: Revelation 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: pt
  text: Ao que vencer, concederei sentar-se comigo no meu trono[a], assim como eu também venci e me sentei com meu Pai no trono dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego, o singular masculino é representativo: a promessa se dirige a toda pessoa que vencer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Ao que vencer
  rationale: O particípio presente substantivado descreve, em singular representativo, aquele que alcança a vitória. A construção portuguesa é natural no contexto de uma promessa e mantém o motivo recorrente de vitória em Apocalipse.
- source_word: δώσω αὐτῷ καθίσαι
  choice: darei o direito de se sentar
  rationale: Embora δίδωμι signifique literalmente “dar”, com o infinitivo expressa a concessão de um privilégio. Esta formulação comunica o valor idiomático sem explicar além do texto.
- source_word: μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου
  choice: comigo no meu trono
  rationale: “Comigo” preserva a associação expressa por μετά; “no meu trono” é a forma idiomática em português para participação na entronização.
- source_word: ὡς κἀγὼ
  choice: assim como eu também
  rationale: Preserva tanto a comparação introduzida por ὡς quanto a força aditiva de καί em κἀγώ.
- source_word: ἐνίκησα
  choice: venci
  rationale: Repete a mesma raiz lexical de νικῶν por meio do verbo “vencer”, conservando a ligação retórica e o tema da vitória.
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου
  choice: me sentei com meu Pai
  rationale: Tradução direta e natural do aoristo e da associação com o Pai, mantendo a relação filial.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: no trono dele
  rationale: Expressão idiomática portuguesa para a posição de entronização; “dele” evita possível ambiguidade gráfica de “seu” e aponta claramente para o Pai.
theological_decisions:
- issue: Singular masculino representativo na promessa
  choice: Manter o singular em “Ao que vencer”, com nota explicativa
  alternative: Usar “Àquele que vencer” ou uma formulação plural inclusiva
  rationale: O grego emprega particípio e pronome masculinos singulares com alcance representativo. A tradução conserva o número e a forma da promessa sem restringi-la aos homens; a nota torna explícito esse alcance.
- issue: Relação entre o vencedor e o trono de Cristo, e entre Cristo e o trono do Pai
  choice: Traduzir o paralelo diretamente, sem atenuá-lo nem explicá-lo
  alternative: Qualificar a participação como meramente simbólica ou acrescentar distinções doutrinárias ao texto
  rationale: O versículo estabelece deliberadamente um paralelo forte entre a participação prometida ao vencedor e a entronização vitoriosa de Jesus com o Pai. A tradução preserva essa tensão e não acrescenta uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao que vencer” soa mais corrente que “Àquele que vencer”, enquanto “darei o direito” explicita de modo natural o sentido concessivo da construção grega. O marcador [a] aparece no texto principal.
