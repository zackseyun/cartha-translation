  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: pt
  text: 'Veja[a]: estou dando alguns da sinagoga de Satanás — os que dizem ser judeus, mas não são; ao contrário, mentem. Veja: farei com que venham e se prostrem diante dos seus pés[b], e saberão que eu amei você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis”. O grego também pode ser entendido mais literalmente como “Veja, estou dando da sinagoga de Satanás”; “alguns” foi acrescentado para deixar claro em português que se trata de pessoas provenientes desse grupo.'
    reason: alternativa lexical e esclarecimento da construção partitiva
  - marker: b
    text: 'Ou: “venham e adorem diante dos seus pés”. O verbo grego pode significar tanto prostrar-se em homenagem quanto adorar; “se prostrem” evita afirmar além do necessário que os fiéis recebem adoração divina.'
    reason: alternativa de tradução
lexical_decisions:
- source_word: ἰδοὺ
  choice: Veja
  rationale: Interjeição contemporânea que chama a atenção, preservando a repetição enfática do grego sem recorrer ao mais solene e menos corrente “eis”.
- source_word: διδῶ
  choice: estou entregando
  rationale: Preserva o presente do verbo e sua ideia concreta de dar ou pôr pessoas à disposição; “entregando” torna a construção partitiva mais inteligível em português.
- source_word: ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: alguns da sinagoga de Satanás
  rationale: '“Alguns” é suprido para explicitar em português a força partitiva de ἐκ: estão em vista pessoas provenientes desse grupo, sem afirmar necessariamente que seja o grupo inteiro.'
- source_word: συναγωγῆς
  choice: sinagoga
  rationale: Mantém o termo historicamente preciso para a comunidade judaica mencionada no contexto.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: os que dizem ser judeus
  rationale: Reproduz de modo natural a afirmação reflexiva de identidade, sem acrescentar uma interpretação étnica ou teológica.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: e não são, mas mentem
  rationale: Preserva a antítese incisiva e o sentido verbal de ψεύδονται, sem suavizá-lo como mera falsidade abstrata.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: farei com que venham
  rationale: Expressa naturalmente em português a construção causativa seguida do resultado pretendido.
- source_word: προσκυνήσουσιν
  choice: se prostrem
  rationale: O verbo pode denotar adoração ou o gesto de prostração e homenagem. Aqui, diante dos pés de uma pessoa, “se prostrem” conserva o gesto sem sugerir necessariamente culto divino prestado aos cristãos.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: diante dos seus pés
  rationale: Correspondência próxima e natural para a expressão espacial do grego.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: saberão que eu amei você
  rationale: Mantém o aoristo ἠγάπησα como passado simples, preservando sua forma e a ênfase explícita do pronome ἐγώ em “eu”.
theological_decisions:
- issue: Sentido de “os que dizem ser judeus e não são”
  choice: Manter a afirmação polêmica exatamente como juízo do texto sobre a identidade alegada pelo grupo.
  alternative: Explicá-la como redefinição puramente espiritual de “judeu” ou como negação explícita da etnia judaica.
  rationale: O versículo não explica em que sentido eles “não são”. A tradução preserva a tensão sem ampliar a declaração para uma tese antijudaica nem impor uma definição confessional de identidade de aliança.
- issue: Força de προσκυνήσουσιν diante dos pés dos fiéis
  choice: “se prostrem”, indicando o gesto de submissão ou homenagem.
  alternative: “adorem” ou “prestem culto”.
  rationale: Embora προσκυνέω possa significar adorar, o contexto permite o sentido corporal de prostração. Esta escolha evita afirmar que os fiéis recebem adoração divina, mas a nota conserva a amplitude lexical.
- issue: Aspecto de ἠγάπησα
  choice: “amei”, preservando formalmente o aoristo.
  alternative: “tenho amado” ou “amo”.
  rationale: O passado é gramaticalmente direto e deixa aberta a relação entre o ato de amor já demonstrado e sua continuidade, sem resolver a nuance por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você/seus” no singular para o destinatário da carta. A pontuação com travessões conserva a longa intercalação do grego, e a repetição de “veja” mantém a ênfase retórica do original.
