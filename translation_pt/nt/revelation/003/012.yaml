id: REV.3.12
reference: Revelation 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: pt
  text: Aquele que vencer[a], eu o farei coluna no santuário do meu Deus, e ele nunca mais sairá dali[b]. Escreverei sobre ele o nome do meu Deus, o nome da cidade do meu Deus — a nova Jerusalém, que desce do céu, da parte do meu Deus — e o meu novo nome[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Aquele que superar». O verbo grego traduzido por «vencer» é um termo recorrente em Apocalipse para a vitória alcançada pela fidelidade.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega aqui uma negação enfática: «certamente nunca mais sairá».'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: «o meu nome, o novo»; a construção grega dá destaque ao fato de o nome ser novo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Aquele que vencer
  rationale: 'A fórmula portuguesa é natural e preserva o motivo recorrente de νικάω em Apocalipse: vencer mediante fidelidade. O singular representativo acompanha a forma grega.'
- source_word: ποιήσω αὐτὸν στῦλον
  choice: eu o farei coluna
  rationale: Mantém tanto a ação futura quanto a imagem arquitetônica de permanência e honra, sem explicar a metáfora.
- source_word: ἐν τῷ ναῷ
  choice: no santuário
  rationale: ναός designa mais especificamente o santuário, e não todo o complexo do templo. Em português, «santuário» preserva essa precisão e funciona naturalmente na imagem.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: ele nunca mais sairá dali
  rationale: «Nunca mais» comunica a negação enfática e definitiva; «dali» explicita com naturalidade o lugar implícito no contexto.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: Escreverei sobre ele
  rationale: Reproduz diretamente a imagem de escrever ou marcar algo sobre a pessoa, sem tornar explícito um sentido teológico específico.
- source_word: τὸ ὄνομα τοῦ θεοῦ μου
  choice: o nome do meu Deus
  rationale: Preserva literalmente a linguagem de nome, com suas associações de identidade e pertencimento deixadas implícitas.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: o nome da cidade do meu Deus
  rationale: Mantém o paralelismo das três referências a «nome».
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: a nova Jerusalém
  rationale: Tradução direta e corrente da expressão grega, mantendo «nova» como qualificação da cidade.
- source_word: ἡ καταβαίνουσα
  choice: que desce
  rationale: A oração relativa transmite com naturalidade o particípio presente atributivo e seu caráter descritivo.
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: do céu, da parte do meu Deus
  rationale: A formulação distingue de modo legível a procedência espacial indicada por ἐκ e a fonte pessoal indicada por ἀπό.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: o meu novo nome
  rationale: É a ordem natural em português e preserva a referência inequívoca ao nome novo do próprio falante, sem especular sobre seu conteúdo.
theological_decisions:
- issue: Singular masculino na fórmula de promessa
  choice: «Aquele que vencer», seguido de «o», «ele» e «sobre ele»
  alternative: «Quem vencer», com retomada neutra ou plural
  rationale: O grego emprega formas masculinas singulares com valor representativo. A tradução preserva essa forma sem restringir a promessa a um grupo específico.
- issue: Repetição de «meu Deus» na fala de Jesus exaltado
  choice: Preservar as quatro ocorrências
  alternative: Reduzir a repetição por razões estilísticas
  rationale: A repetição é explícita e teologicamente significativa. Mantê-la conserva a tensão cristológica do texto sem a explicar ou harmonizar.
- issue: Expressão final sobre o nome novo
  choice: «o meu novo nome»
  alternative: «o meu próprio nome novo» ou «o meu nome, o novo»
  rationale: A opção escolhida é portuguesa corrente, mantém a ênfase por meio do artigo e da estrutura paralela e não acrescenta uma interpretação sobre qual seja o nome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e as repetições do grego; os travessões delimitam a explicação de «a cidade do meu Deus» sem alterar sua relação gramatical.
