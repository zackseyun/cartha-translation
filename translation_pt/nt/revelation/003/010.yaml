id: REV.3.10
reference: Revelation 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: pt
  text: Porque você guardou a minha palavra de perseverança[a], eu também guardarei você da hora da provação[b] que está para vir sobre todo o mundo habitado, a fim de pôr à prova os que habitam sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra sobre a minha perseverança” ou “a minha mensagem que chama à perseverança”. A expressão grega pode ser entendida de mais de uma maneira estreitamente relacionada.
    reason: lexical_alternative
  - marker: b
    text: Ou “preservarei você durante a hora da provação” ou “manterei você fora da hora da provação”. O grego emprega “guardar” com a preposição “de” e, por si só, não resolve debates teológicos posteriores sobre como essa proteção ocorrerá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: guardou
  rationale: O aoristo indica a fidelidade já demonstrada pelo destinatário. “Guardou” pertence ao campo semântico de τηρέω e conserva em português a ligação verbal com τηρήσω (“guardarei”) na oração seguinte.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: a minha palavra de perseverança
  rationale: 'A formulação relativamente literal preserva a ambiguidade do genitivo: pode ser a palavra caracterizada pela perseverança, a palavra a respeito da perseverança de Jesus ou a mensagem que chama à perseverança.'
- source_word: κἀγώ
  choice: eu também
  rationale: 'Expressa a ênfase e a correspondência entre a fidelidade do destinatário e a promessa de Cristo: porque você guardou, eu também guardarei.'
- source_word: τηρήσω ἐκ
  choice: guardarei você da
  rationale: Reproduz diretamente τηρέω + ἐκ e mantém o vínculo com “guardou”, sem decidir se a proteção envolve isenção, afastamento ou preservação durante a provação.
- source_word: ὥρας
  choice: hora
  rationale: Mantém o termo apocalíptico ὥρα, aqui empregado para um período determinado.
- source_word: πειρασμοῦ
  choice: provação
  rationale: πειρασμός pode indicar prova, provação ou tentação. “Provação” comunica tanto o caráter aflitivo do período quanto sua função de pôr pessoas à prova, sem restringi-lo à tentação moral.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: que está para vir
  rationale: Expressa de modo natural a força prospectiva e possivelmente iminente de μέλλω + infinitivo.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: sobre todo o mundo habitado
  rationale: οἰκουμένη designa o mundo habitado; a tradução conserva essa nuance e a abrangência indicada por ὅλης.
- source_word: πειράσαι
  choice: a fim de pôr à prova
  rationale: Explicita naturalmente a finalidade do infinitivo e mantém a conexão lexical com πειρασμός (“provação”).
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: os que habitam sobre a terra
  rationale: Preserva a forma verbal e a expressão recorrente de Apocalipse, em vez de comprimi-la para “os habitantes da terra”.
theological_decisions:
- issue: Sentido de τηρήσω ἐκ no contexto escatológico
  choice: guardarei você da
  alternative: preservarei você durante a; manterei você fora da
  rationale: A tradução mantém a construção grega sem impor um esquema escatológico. Por si só, a expressão não resolve se a promessa descreve retirada anterior, proteção durante o período ou isenção de seus efeitos.
- issue: Sentido do genitivo em τὸν λόγον τῆς ὑπομονῆς μου
  choice: a minha palavra de perseverança
  alternative: a palavra sobre a minha perseverança; a minha mensagem que chama à perseverança
  rationale: O genitivo grego admite sentidos próximos, e a redação principal conserva essa tensão em vez de selecionar uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” representa o destinatário singular da mensagem. A repetição “guardou/guardarei” e as expressões apocalípticas “hora” e “os que habitam sobre a terra” foram mantidas por sua relevância literária e intertextual.
