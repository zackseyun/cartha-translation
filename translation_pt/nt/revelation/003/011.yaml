id: REV.3.11
reference: Revelation 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: pt
  text: Venho em breve[a]. Segure firme o que você tem, para que ninguém tome a sua coroa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rapidamente”. O advérbio grego pode enfatizar tanto a proximidade no tempo quanto a rapidez da ação.'
    reason: alternative_reading
  - marker: b
    text: A palavra grega se refere a uma coroa de vitória ou de honra, não especificamente a um diadema real.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Venho
  rationale: O presente tem força iminente ou futura no contexto. “Venho” é natural e conciso em português e mantém a chegada anunciada sem acrescentar um auxiliar ausente do grego.
- source_word: ταχύ
  choice: em breve
  rationale: O advérbio pode indicar proximidade temporal ou rapidez de ação. “Em breve” comunica de modo natural a iminência contextual, enquanto a alternativa é preservada em nota.
- source_word: κράτει
  choice: Segure firme
  rationale: O imperativo de κρατέω exige retenção resoluta e perseverante. “Segure firme” é atual, claro e mantém a força da exortação.
- source_word: ὃ ἔχεις
  choice: o que você tem
  rationale: Mantém o objeto sem especificação, como no grego, deixando que o contexto determine seu referente.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: para que ninguém tome
  rationale: Expressa de maneira natural a finalidade ou o resultado que deve ser evitado, preservando o subjuntivo após ἵνα com a negação μηδείς.
- source_word: τὸν στέφανόν σου
  choice: a sua coroa
  rationale: “Coroa” é a equivalência acessível tradicional; o sentido específico de στέφανος como coroa de honra ou vitória, e não propriamente diadema real, é esclarecido em nota.
theological_decisions:
- issue: Nuance de ταχύ na promessa da vinda de Cristo
  choice: em breve
  alternative: rapidamente
  rationale: O texto pode enfatizar tanto a proximidade temporal quanto a rapidez da ação. O corpo do versículo usa a leitura temporal mais natural neste contexto, sem eliminar a outra possibilidade, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” torna natural o singular da exortação dirigida ao mensageiro ou à comunidade personificada; a construção preserva a concisão e a urgência do grego.
