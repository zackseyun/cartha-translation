  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: pt
  text: Eu repreendo e disciplino[c] todos os que amo[a]. Portanto, seja zeloso[b] e arrependa-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem quer que eu ame”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seja fervoroso” ou “empenhe-se de verdade”.'
    reason: lexical_alternative
  - marker: c
    text: “Disciplinar” aqui inclui correção e formação, não apenas castigo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase do grego sem recorrer à formulação contrastiva e menos natural “Quanto a mim”.
- source_word: ὅσους ἐὰν
  choice: todos os que
  rationale: A construção relativa indefinida abrange a totalidade das pessoas a quem se aplica a declaração; “todos os que” é claro e natural em português.
- source_word: φιλῶ
  choice: amo
  rationale: Expressa plenamente o amor e o afeto indicados por φιλέω, sem enfraquecê-los nem impor uma distinção técnica em relação a outros verbos gregos para amar.
- source_word: ἐλέγχω
  choice: repreendo
  rationale: No contexto, indica correção direta que visa mudança moral; “repreendo” é atual, claro e mais adequado que termos de sentido meramente expositivo ou jurídico.
- source_word: παιδεύω
  choice: disciplino
  rationale: Abrange correção e formação, e não apenas castigo. “Disciplino” preserva as duas dimensões em português corrente.
- source_word: ζήλευε
  choice: seja zeloso
  rationale: Conserva a intensidade do imperativo e corresponde diretamente à ideia de zelo ardente, sem reduzi-la a mera emoção.
- source_word: οὖν
  choice: Portanto
  rationale: 'Explicita a inferência: a repreensão e a disciplina motivadas pelo amor exigem uma resposta.'
- source_word: μετανόησον
  choice: arrependa-se
  rationale: É a expressão estabelecida e adequada para a mudança moral e espiritual exigida por μετανοέω neste contexto.
theological_decisions:
- issue: Natureza do amor expresso por φιλῶ em relação à correção divina
  choice: “amo”, sem atenuar o termo para simples afeição
  alternative: “tenho afeição por”
  rationale: A repreensão e a disciplina são fundamentadas em amor genuíno. A tradução evita tanto enfraquecer esse amor quanto criar uma distinção teológica técnica entre φιλέω e ἀγαπάω que o contexto não exige.
- issue: Sentido de παιδεύω
  choice: “disciplino”, incluindo correção formativa
  alternative: “castigo”, “educo” ou “corrijo”
  rationale: O verbo inclui treinamento corretivo, não somente punição nem mera instrução. “Disciplino” mantém essa amplitude sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “Eu” no início preserva de modo natural a ênfase do pronome grego. Os imperativos no singular mantêm a interpelação direta ao destinatário representativo da igreja.
