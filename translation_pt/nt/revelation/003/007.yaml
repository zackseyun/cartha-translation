id: REV.3.7
reference: Revelation 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: pt
  text: '“E ao anjo[a] da igreja em Filadélfia, escreva: Assim diz o Santo, o Verdadeiro, aquele que tem a chave de Davi[b], que abre e ninguém fechará, e que fecha e ninguém abre:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”; a palavra grega ἄγγελος pode ter os dois sentidos.
    reason: alternative_reading
  - marker: b
    text: “A chave de Davi” provavelmente faz alusão a Isaías 22:22, onde representa autoridade real para abrir e fechar.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: O termo pode designar um anjo celestial ou um mensageiro humano. “Anjo” preserva a formulação tradicional das mensagens às sete igrejas sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: Neste contexto, refere-se à comunidade cristã reunida; “igreja” é o equivalente mais claro e natural em português.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Mantém a cadência solene da fórmula profética e é mais natural em português do que uma reprodução rígida do demonstrativo grego.
- source_word: ὁ ἅγιος
  choice: o Santo
  rationale: O adjetivo substantivado com artigo funciona como título do locutor.
- source_word: ὁ ἀληθινός
  choice: o Verdadeiro
  rationale: Preserva a forma titular e o sentido joanino de alguém verdadeiro, genuíno e real, sem restringi-lo apenas à veracidade de suas palavras.
- source_word: κλεῖν Δαυίδ
  choice: a chave de Davi
  rationale: Reproduz diretamente a imagem grega e conserva a alusão à autoridade davídica de Isaías 22:22.
- source_word: ἀνοίγων
  choice: que abre
  rationale: A oração relativa expressa naturalmente em português o particípio presente que continua a série de títulos e descrições.
- source_word: κλείσει
  choice: fechará
  rationale: Mantém o futuro do indicativo grego e a ideia de que ninguém poderá fechar aquilo que ele abre.
- source_word: κλείων
  choice: que fecha
  rationale: A oração relativa traduz de modo natural o particípio presente e mantém o paralelismo.
- source_word: ἀνοίγει
  choice: abre
  rationale: 'Conserva o presente do indicativo e o contraste deliberado com o futuro anterior: ele abre e ninguém fechará; ele fecha e ninguém abre.'
theological_decisions:
- issue: Títulos cristológicos ὁ ἅγιος e ὁ ἀληθινός
  choice: “o Santo, o Verdadeiro”, como títulos diretos do Cristo ressuscitado
  alternative: “aquele que é santo e verdadeiro”, como descrição adjetival
  rationale: As construções com artigo e adjetivo substantivado funcionam como títulos solenes. A tradução mantém a elevada apresentação cristológica do texto sem acrescentar explicações doutrinárias.
- issue: Alusão presente em “a chave de Davi”
  choice: Manter a imagem bíblica no texto e explicar a provável alusão em nota
  alternative: Expandir como “a autoridade sobre o reino de Davi”
  rationale: A expressão provavelmente remete a Isaías 22:22 e comunica autoridade real, mas a tradução não deve substituir a imagem do texto por uma interpretação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Assim diz” preserva a ressonância profética em forma idiomática. Os presentes e o futuro do grego foram mantidos, apesar da leve alternância temporal, e a ambiguidade de ἀγγέλῳ foi preservada por meio de nota.
