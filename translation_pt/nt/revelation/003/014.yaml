source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: pt
  text: 'E escreva ao anjo da igreja em Laodiceia: Isto diz o Amém, a testemunha fiel e verdadeira, o princípio da criação de Deus[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a origem da criação de Deus”, “a fonte da criação de Deus” ou “o governante sobre a criação de Deus”. A palavra grega archē pode significar “princípio”, “origem” ou “governante”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: É a tradução consagrada e mais natural na fórmula repetida das mensagens às sete igrejas; “mensageiro” continua sendo uma possibilidade lexical e é indicado em nota.
- source_word: Τάδε λέγει
  choice: Estas coisas diz
  rationale: Preserva de modo claro e digno a fórmula profética grega, sem transformá-la numa paráfrase interpretativa.
- source_word: ὁ Ἀμήν
  choice: o Amém
  rationale: Mantém o título cristológico distintivo e sua ressonância hebraica de certeza, fidelidade e verdade.
- source_word: ὁ μάρτυς ὁ πιστὸς καὶ ἀληθινός
  choice: a testemunha fiel e verdadeira
  rationale: Reproduz naturalmente os sentidos testemunhal, pessoal e qualitativo dos termos gregos.
- source_word: ἡ ἀρχὴ
  choice: o princípio
  rationale: É a correspondência lexical mais direta e preserva a ambiguidade entre começo, origem e autoridade, sem resolver no texto principal uma questão teologicamente disputada.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: da criação de Deus
  rationale: Traduz diretamente a construção genitiva grega, mantendo sua concisão e sua abertura interpretativa.
theological_decisions:
- issue: Sentido de ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ como título cristológico
  choice: o princípio da criação de Deus
  alternative: a origem/fonte da criação de Deus; o soberano sobre a criação de Deus
  rationale: “Princípio” é a tradução lexical mais direta de ἀρχή e preserva a tensão do original. A nota registra sentidos contextualmente possíveis sem impor ao texto principal uma conclusão cristológica específica.
- issue: Identidade do ἀγγέλῳ da igreja
  choice: anjo
  alternative: mensageiro
  rationale: “Anjo” corresponde ao uso estabelecido na estrutura das sete mensagens de Apocalipse, mas o grego também pode designar um mensageiro humano; por isso, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a formulação preservam o tom solene da proclamação profética. Os marcadores foram colocados imediatamente após os termos a que se referem; sua ordem segue a ocorrência no material de consulta, embora [b] apareça antes de [a] no versículo.
