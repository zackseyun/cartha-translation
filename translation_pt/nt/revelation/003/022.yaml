  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: pt
  text: Quem tem ouvidos, ouça o que o Espírito diz às igrejas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que tem um ouvido, ouça.” O grego usa o singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: A construção substantivada singular significa literalmente “aquele que tem ouvido”, mas a expressão idiomática portuguesa corrente usa o plural “ouvidos”. “Quem” conserva o caráter representativo e abrangente da exortação.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo aoristo ativo na terceira pessoa do singular é expresso naturalmente pelo subjuntivo exortativo “ouça”, preservando a força do mandamento.
- source_word: τί
  choice: o que
  rationale: Introduz o conteúdo que deve ser ouvido e é a formulação natural em português.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No refrão das mensagens às igrejas, o referente contextual é o Espírito Santo; a inicial maiúscula sinaliza essa identificação sem acrescentar palavras ao texto.
- source_word: λέγει
  choice: diz
  rationale: Traduz diretamente o presente indicativo e soa natural nesta fórmula recorrente.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: O dativo indica as destinatárias da mensagem; “igrejas” é a tradução estabelecida e apropriada para as comunidades de Apocalipse 2–3.
theological_decisions:
- issue: Expressão representativa no singular
  choice: Quem tem ouvidos, ouça
  alternative: Aquele que tem ouvido, ouça
  rationale: “Quem” e o verbo singular preservam a referência representativa do grego, enquanto o plural idiomático “ouvidos” evita uma formulação pouco natural em português sem restringir a exortação a um gênero.
- issue: Referente de τὸ πνεῦμα
  choice: o Espírito
  alternative: o espírito
  rationale: O contexto do refrão dirigido às igrejas identifica o falante como o Espírito Santo; a capitalização torna explícita essa referência contextual.
translation_notes:
  register: Português moderno, claro e digno, com formulação idiomática amplamente compreensível no Brasil e em outras comunidades lusófonas. Mantém o ritmo proverbial da exortação e registra em nota a forma singular do grego.
