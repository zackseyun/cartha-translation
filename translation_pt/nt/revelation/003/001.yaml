id: REV.3.1
reference: Revelation 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: pt
  text: 'Escreva ao anjo[a] da igreja em Sardes: Assim diz[b] aquele que tem os sete espíritos de Deus[c] e as sete estrelas: Conheço as suas obras; você tem fama[d] de estar vivo, mas está morto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mensageiro». A palavra grega pode designar tanto um anjo como um mensageiro; neste contexto apocalíptico, «anjo» parece mais natural.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, «Estas coisas diz». A expressão é uma fórmula profética que também pode ser traduzida por «Isto é o que diz».
    reason: lexical_alternative
  - marker: c
    text: A expressão «os sete espíritos de Deus» foi mantida literalmente. Pode simbolizar a plenitude do Espírito Santo, embora também seja entendida como referência a sete espíritos celestiais.
    reason: alternative_reading
  - marker: d
    text: Mais literalmente, «você tem um nome de que vive». A expressão significa que a pessoa tem fama ou reputação de estar viva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: Preserva o sentido lexical mais natural no cenário apocalíptico de Apocalipse, sem excluir a possibilidade de um mensageiro ou representante.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: É o termo corrente e contextualmente adequado para a comunidade cristã reunida em Sardes.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Reproduz com naturalidade e dignidade a fórmula oracular grega, evitando a construção pouco idiomática «Estas coisas diz».
- source_word: ὁ ἔχων
  choice: aquele que tem
  rationale: Expressa naturalmente o particípio substantivado e mantém sua força presente.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: os sete espíritos de Deus
  rationale: Mantém o plural explícito do grego e não resolve na tradução a identidade teologicamente debatida desses espíritos.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: as sete estrelas
  rationale: Tradução direta que preserva a imagem simbólica sem antecipar aqui sua interpretação.
- source_word: Οἶδά
  choice: Conheço
  rationale: Forma concisa e idiomática que se ajusta ao refrão de avaliação das igrejas em Apocalipse.
- source_word: τὰ ἔργα
  choice: as suas obras
  rationale: Preserva a correspondência lexical com a fórmula repetida em Apocalipse e permanece compreensível em português atual.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: você tem fama de estar vivo
  rationale: Transmite em português natural o valor idiomático de «ter um nome» como reputação pública, mantendo o contraste com a condição real.
- source_word: νεκρὸς εἶ
  choice: está morto
  rationale: Conserva a força direta do veredito e o contraste com «estar vivo», sem atenuar sua dimensão metafórica.
theological_decisions:
- issue: Identidade dos «sete espíritos de Deus»
  choice: Manter literalmente «os sete espíritos de Deus» no texto principal.
  alternative: Interpretar como a plenitude do Espírito Santo ou como sete espíritos celestiais diante de Deus.
  rationale: O grego emprega o plural e não explicita aqui qual interpretação simbólica deve prevalecer; a tradução preserva essa tensão.
- issue: Referente de ἀγγέλῳ na saudação
  choice: Traduzir por «anjo» no texto principal.
  alternative: «mensageiro» ou representante humano da igreja.
  rationale: «Anjo» corresponde ao sentido mais natural no ambiente apocalíptico do livro, enquanto a alternativa lexical é reconhecida em nota sem decidir indevidamente o referente.
translation_notes:
  register: Português atual, digno e claro, com legibilidade brasileira e vocabulário amplamente compreensível. «Você» torna direta a interpelação singular sem recorrer a formas arcaicas; «Assim diz» conserva o tom profético. A ordem e o contraste incisivo do original foram preservados.
