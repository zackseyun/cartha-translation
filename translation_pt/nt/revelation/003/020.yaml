  source_fidelity: 'O sentido central está bem preservado: a posição contínua à porta, o ato de bater, a condição aberta, a entrada e a refeição recíproca correspondem ao grego. Contudo, “entrareI para junto dessa pessoa” é uma construção pouco idiomática em português e tenta explicitar de modo excessivo a força pessoal de πρὸς αὐτόν.'
  naturalness: “Veja” é possível, mas soa como uma interpelação direta e um tanto deslocada neste enunciado solene. “Eis que” mantém o valor chamativo de ἰδού em registro bíblico moderno. A sequência “dessa pessoa / ela” é gramaticalmente defensável, porém pesada; “essa pessoa” repetido no paralelismo final fica mais claro e natural sem introduzir gênero.
  terminology: “À porta”, “bato”, “ouvir a minha voz”, “cearei” e a formulação não doutrinariamente restritiva da nota sobre a refeição são adequados. “Cearei” conserva bem δειπνήσω e seu tom de comunhão à mesa.
