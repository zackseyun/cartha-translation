  to: Eis que estou à porta e bato. Se alguém ouvir a minha voz e abrir a porta, entrarei e cearei com essa pessoa, e essa pessoa comigo.
  rationale: A revisão melhora o registro e a fluência sem alterar o sentido. “Eis que” corresponde naturalmente à partícula ἰδού. A remoção de “para junto” evita uma construção artificial; a relação pessoal indicada por πρὸς αὐτόν continua refletida pela refeição compartilhada e é documentada na nota lexical. As notas foram preservadas e ajustadas para corresponder ao texto revisado.
