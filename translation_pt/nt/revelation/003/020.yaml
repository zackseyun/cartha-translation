id: REV.3.20
reference: Revelation 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: pt
  text: Eis que estou à porta e bato. Se alguém ouvir a minha voz e abrir a porta, entrarei e cearei com essa pessoa, e essa pessoa comigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Veja
  rationale: Partícula que chama a atenção. “Veja” comunica de modo natural e imediato o valor de ἰδοὺ em português moderno, sem o tom arcaizante de “Eis”.
- source_word: ἕστηκα
  choice: estou
  rationale: 'O perfeito de ἵστημι tem aqui força estativa presente: descreve a posição atual e contínua junto à porta. Em português, “estou à porta” expressa esse estado com naturalidade.'
- source_word: ἐπὶ τὴν θύραν
  choice: à porta
  rationale: Expressão idiomática portuguesa para indicar posição diante ou junto da entrada, evitando o literalismo inadequado de “sobre a porta”.
- source_word: κρούω
  choice: bato
  rationale: O presente indica ação em curso; coordenado com “estou à porta”, “bato” preserva a vivacidade e a continuidade implícita da cena.
- source_word: ἐάν τις
  choice: Se alguém
  rationale: Mantém a condição aberta e inclusiva expressa pelo pronome indefinido τις.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: ouvir a minha voz
  rationale: Traduz diretamente φωνή como “voz” e preserva a forma condicional sem acrescentar a ideia interpretativa de obedecer.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: abrir a porta
  rationale: Equivalência direta, clara e idiomática para o aoristo subjuntivo na oração condicional.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: entrarei para junto dessa pessoa
  rationale: “Entrarei” traduz εἰσελεύσομαι, enquanto “para junto dessa pessoa” preserva a direção pessoal e relacional de πρὸς αὐτόν, sem reduzir a expressão à entrada em um lugar. “Dessa pessoa” retoma naturalmente o inclusivo “alguém”.
- source_word: δειπνήσω
  choice: cearei
  rationale: δειπνέω designa participar da refeição principal, frequentemente à noite. “Cearei” conserva a imagem de comunhão à mesa com dignidade e concisão.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: com ela, e ela comigo
  rationale: Preserva a elipse e a reciprocidade enfática do grego. O pronome feminino concorda gramaticalmente com “pessoa”, sem atribuir gênero ao referente.
theological_decisions:
- issue: Sentido da imagem da refeição compartilhada
  choice: Manter a imagem como comunhão pessoal e recíproca à mesa, sem especificar sua aplicação doutrinária.
  alternative: Entendê-la especificamente como alusão à Ceia do Senhor, à conversão inicial ou à restauração da comunhão com um crente ou uma igreja.
  rationale: O texto expressa claramente proximidade e comunhão mútua, mas não identifica de modo explícito a refeição com um sacramento nem limita a promessa a uma única aplicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação inclusiva “dessa pessoa/com ela” evita o masculino genérico sem perder a referência individual. “Cearei” mantém a imagem concreta da refeição e o tom solene, sem explicá-la dentro do versículo.
