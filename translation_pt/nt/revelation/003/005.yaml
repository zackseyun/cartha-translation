  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: pt
  text: Aquele que vencer será assim vestido de roupas brancas[a], e de modo nenhum apagarei o seu nome do livro da vida[b][c]; também reconhecerei[d] o seu nome diante de meu Pai e diante dos anjos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que superar”. O verbo também pode ser traduzido por “superar”, mas “vencer” preserva o tema da vitória em Apocalipse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “jamais apagarei o seu nome do livro da vida”. O grego emprega uma negação enfática.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, o registro celestial daqueles que pertencem a Deus e herdam a vida.
    reason: cultural_note
  - marker: d
    text: 'Ou: “confessarei o seu nome”. Compare Mateus 10:32.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Aquele que vencer
  rationale: O particípio presente substantivado caracteriza quem alcança a vitória e persevera nela. Em português bíblico corrente, “aquele que vencer” é natural e mantém o motivo da vitória em Apocalipse; “aquele que superar” seria possível, mas menos adequado ao campo imagético do livro.
- source_word: οὕτως
  choice: assim
  rationale: Mantém a correspondência indicada pelo advérbio com a promessa e o contexto anteriores, sem explicitação indevida.
- source_word: περιβαλεῖται
  choice: será vestido
  rationale: A forma futura média/passiva é expressa naturalmente como passiva em português, comunicando a investidura prometida sem impor uma leitura reflexiva.
- source_word: ἱματίοις λευκοῖς
  choice: com roupas brancas
  rationale: “Roupas” traduz de forma clara e ampla ἱμάτια, sem especificá-las como mantos ou túnicas; “brancas” preserva literalmente a imagem simbólica.
- source_word: οὐ μὴ ἐξαλείψω
  choice: de modo nenhum apagarei
  rationale: A combinação οὐ μή com o futuro constitui negação enfática. “De modo nenhum apagarei” preserva sua força e se ajusta naturalmente à imagem de um nome registrado num livro.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o seu nome
  rationale: Mantém o singular masculino representativo da construção grega sem convertê-lo em plural neutro.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: do livro da vida
  rationale: Expressão bíblica estabelecida e clara; embora βίβλος também possa designar um rolo, aqui a metáfora é a de um registro celestial.
- source_word: ὁμολογήσω
  choice: reconhecerei
  rationale: No contexto, o verbo significa reconhecer ou declarar publicamente alguém. “Reconhecerei” evita a possível compreensão moderna de “confessarei” como admissão de culpa e preserva a relação conceitual com Mateus 10:32.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Tradução direta, concisa e natural nas duas ocorrências.
- source_word: τοῦ πατρός μου
  choice: meu Pai
  rationale: Preserva diretamente a relação filial expressa no texto.
- source_word: τῶν ἀγγέλων αὐτοῦ
  choice: dos anjos dele
  rationale: O pronome remete mais naturalmente ao Pai, antecedente imediato. “Dele” reduz em português a possível leitura equivocada de “seus” como referente ao vencedor.
theological_decisions:
- issue: Implicação da promessa de não apagar o nome do livro da vida nos debates sobre perseverança e apostasia
  choice: Traduzir como promessa enfática dirigida àquele que vencer, sem deduzir no texto uma conclusão sistemática sobre a possibilidade ou impossibilidade de perda final da salvação.
  alternative: Ler a frase exclusivamente como garantia da perseverança dos santos ou exclusivamente como advertência de possível perda da salvação.
  rationale: O versículo afirma uma promessa vigorosa mediante a imagem de um registro celestial, mas não resolve por si só todo o debate teológico mais amplo.
- issue: Gênero da construção singular masculina
  choice: Manter “o seu nome”, acompanhando a forma singular representativa do grego.
  alternative: Empregar uma formulação plural neutra, como “os nomes dessas pessoas”.
  rationale: A redação singular preserva a forma e o efeito retórico do original sem restringir a promessa apenas a homens.
- issue: Sentido de ὁμολογήσω diante do Pai e dos anjos
  choice: Usar “reconhecerei” no sentido de reconhecimento público e favorável.
  alternative: Usar “confessarei” ou “declararei”.
  rationale: “Reconhecerei” comunica com clareza a declaração pública de pertencimento, sem introduzir a conotação corrente de confissão de pecado; a nota registra a alternativa mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e as repetições de “diante de” acompanham a solenidade e o paralelismo do grego. “Roupas” foi preferido a “vestes” por maior transparência contemporânea, sem perda da elevação do conjunto.
