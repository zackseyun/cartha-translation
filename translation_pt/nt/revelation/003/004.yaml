id: REV.3.4
reference: Revelation 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: pt
  text: Mas você tem, em Sardes, alguns nomes[a] que não mancharam suas vestes, e eles andarão comigo vestidos de branco,[b] porque são dignos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente “alguns nomes”. Ou: “algumas pessoas”.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego é conciso: “em branco”, provavelmente no sentido de usar vestes brancas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com a repreensão anterior e é o adversativo mais natural e conciso em português.
- source_word: ἔχεις
  choice: você tem
  rationale: Preserva o tratamento direto, na segunda pessoa do singular, dirigido à igreja em Sardes.
- source_word: ὀλίγα ὀνόματα
  choice: alguns nomes
  rationale: Mantém a metonímia marcante do grego, em vez de substituí-la silenciosamente por “algumas pessoas”; a oração seguinte deixa claro que se trata de pessoas.
- source_word: ἐν Σάρδεσιν
  choice: em Sardes
  rationale: Forma locativa corrente do nome da cidade em português.
- source_word: ἃ
  choice: que
  rationale: O pronome relativo português serve naturalmente ao antecedente “nomes” e ao referente pessoal sem exigir reformulação.
- source_word: οὐκ ἐμόλυναν
  choice: não mancharam
  rationale: “Manchar” preserva de modo acessível a imagem concreta das roupas e sua dimensão simbólica de impureza moral; “contaminar” é uma alternativa possível.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: suas vestes
  rationale: “Vestes” conserva o registro elevado e simbólico de Apocalipse sem especificar indevidamente o tipo de roupa.
- source_word: περιπατήσουσιν
  choice: andarão
  rationale: Preserva a imagem literal do caminhar, que também pode sugerir comunhão e honra junto de Cristo.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Expressa diretamente a ideia de companhia, sem expansão interpretativa.
- source_word: ἐν λευκοῖς
  choice: vestidos de branco
  rationale: Torna natural em português a expressão elíptica grega “em branco”, cujo sentido provável, no contexto das vestes, é estar usando roupas brancas.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da promessa em português contemporâneo.
- source_word: ἄξιοί εἰσιν
  choice: são dignos
  rationale: Reproduz diretamente a afirmação do texto sobre dignidade, sem amenizá-la nem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Traduzir ὀνόματα literalmente como “nomes” ou idiomaticamente como “pessoas”
  choice: Manter “alguns nomes” no texto principal
  alternative: “algumas pessoas”
  rationale: A formulação incomum pode ser intencional e destacar indivíduos conhecidos e identificáveis dentro da igreja; a nota esclarece a metonímia sem apagá-la.
- issue: Expressar a imagem moral de μολύνω aplicada às vestes
  choice: “não mancharam suas vestes”
  alternative: “não contaminaram suas vestes”
  rationale: “Manchar” conserva a metáfora visual em linguagem clara, enquanto a alternativa explicita mais fortemente a ideia de contaminação ou profanação.
- issue: Interpretar a expressão elíptica ἐν λευκοῖς
  choice: “vestidos de branco”
  alternative: “de branco” ou, mais literalmente, “em branco”
  rationale: O contexto imediato das vestes sustenta a elipse “vestes brancas”; a tradução explicita apenas o necessário para soar natural, e a nota registra a concisão do original.
- issue: Possível implicação meritória de ἄξιοί εἰσιν
  choice: Traduzir diretamente como “são dignos”
  alternative: “são merecedores” ou “estão aptos”
  rationale: A tradução deve preservar a tensão da declaração textual em relação à fidelidade dessas pessoas, sem importar nem negar qualquer sistema soteriológico mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” preserva o singular do destinatário coletivo; “vestes” mantém o tom simbólico de Apocalipse. A construção “vestidos de branco” evita o pouco natural “em branco” em português, e “alguns nomes” conserva a formulação distintiva do original.
