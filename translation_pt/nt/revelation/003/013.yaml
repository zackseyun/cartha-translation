source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: pt
  text: Quem tem ouvidos, ouça[a] o que o Espírito diz às igrejas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Quem tem ouvido, ouça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “assembleias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: A construção com particípio substantivado designa qualquer pessoa que se enquadre na condição. Embora οὖς esteja no singular, a expressão idiomática portuguesa «quem tem ouvidos» comunica naturalmente o apelo proverbial à escuta atenta; a forma singular mais literal é preservada em nota.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo aoristo ativo na terceira pessoa do singular é expresso com o presente do subjuntivo em construção imperativa portuguesa. «Ouça» preserva a fórmula bíblica e pode abranger escutar, acolher e atender.
- source_word: τί
  choice: o que
  rationale: Introduz o conteúdo daquilo que é dito; «o que» é a forma corrente e exata em português.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No refrão das mensagens às igrejas em Apocalipse, o referente mais provável é o Espírito Santo. A inicial maiúscula sinaliza esse referente sem acrescentar uma designação ausente do grego.
- source_word: λέγει
  choice: diz
  rationale: Traduz de modo natural o presente do indicativo e mantém a formulação direta do texto.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: O dativo identifica as destinatárias. «Igrejas» é a tradução corrente e contextualmente adequada para as comunidades de Apocalipse 2–3; «assembleias» continua sendo uma alternativa lexical possível.
theological_decisions:
- issue: Referente de «o Espírito»
  choice: o Espírito Santo que fala às igrejas
  alternative: um espírito humano ou o espírito de profecia entendido de modo impessoal
  rationale: No refrão repetido das mensagens de Apocalipse, «o Espírito» é mais naturalmente entendido como o Espírito Santo dirigindo-se às igrejas por meio da mensagem profética. A tradução mantém apenas «o Espírito», como no grego, e evita explicitar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação idiomática «Quem tem ouvidos, ouça» conserva o caráter proverbial e conhecido da exortação; notas registram tanto o singular grego quanto a alternativa lexical para ἐκκλησίαις.
