  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: pt
  text: Quem tem ouvidos[a], ouça o que o Espírito diz às igrejas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego, «ouvido» está no singular: “Quem tem ouvido, ouça”. O português normalmente usa o plural nesta expressão. A construção é uma exortação genérica dirigida a qualquer pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: A construção substantivada introduz uma exortação dirigida genericamente a qualquer pessoa. Embora οὖς esteja no singular, a expressão portuguesa corrente e natural é “ter ouvidos”, no plural; a nota registra a forma grega.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo aoristo na terceira pessoa do singular é bem representado pelo presente do subjuntivo com valor imperativo em português, preservando a força direta da exortação.
- source_word: τί
  choice: o que
  rationale: Introduz naturalmente em português o conteúdo daquilo que é dito.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No refrão recorrente de Apocalipse 2–3, o referente contextual mais provável é o Espírito Santo; a inicial maiúscula sinaliza essa leitura.
- source_word: λέγει
  choice: diz
  rationale: Equivalente natural do presente indicativo na fórmula, podendo expressar fala atual ou característica.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: Traduz de modo natural o dativo plural e mantém o sentido eclesial estabelecido de ἐκκλησίαι no contexto das sete igrejas.
theological_decisions:
- issue: Referente de “o Espírito”
  choice: o Espírito Santo
  alternative: um espírito
  rationale: No refrão repetido de Apocalipse 2–3, “o Espírito” é mais provavelmente o Espírito Santo falando às igrejas por meio da mensagem profética.
- issue: Singular genérico da exortação
  choice: Quem tem ouvidos, ouça
  alternative: Aquele que tem ouvido, ouça
  rationale: “Quem” e o verbo no singular mantêm o alcance individual e genérico do grego sem restringir a exortação a homens; o plural idiomático “ouvidos” evita uma formulação pouco natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência proverbial da exortação e usa o plural idiomático “ouvidos”, explicando em nota o singular do original.
