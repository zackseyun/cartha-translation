id: REV.3.16
reference: Revelation 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: pt
  text: Assim, porque você é morno e não é nem quente nem frio, estou prestes a vomitar você para fora da minha boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “expelir você da minha boca”. O verbo grego significa mais literalmente “vomitar” e apresenta uma imagem mais forte do que “cuspir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Introduz a consequência da declaração anterior, preservando a força conclusiva de modo natural e digno em português.
- source_word: ὅτι
  choice: porque
  rationale: Expressa aqui a causa do juízo anunciado.
- source_word: χλιαρός
  choice: morno
  rationale: É o equivalente corrente e preciso para a imagem de temperatura, sem interpretá-la além do texto.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: não é nem quente nem frio
  rationale: Mantém o contraste duplo do grego em formulação clara e natural.
- source_word: μέλλω
  choice: estou prestes a
  rationale: Preserva a ideia de ação iminente presente na construção com o infinitivo.
- source_word: ἐμέσαι
  choice: vomitar
  rationale: Traduz diretamente o verbo grego e conserva a força deliberadamente chocante da imagem; 'cuspir' a enfraqueceria.
- source_word: ἐκ τοῦ στόματός μου
  choice: da minha boca
  rationale: Expressa naturalmente a origem da expulsão em português e preserva a vívida imagem corporal.
theological_decisions:
- issue: Força da imagem de juízo em ἐμέσαι
  choice: Conservar a imagem gráfica com “vomitar”.
  alternative: “Cuspir” ou “expelir”.
  rationale: O texto apresenta uma imagem intencionalmente forte de rejeição; suavizá-la reduziria a força retórica e teológica da advertência.
- issue: Força temporal de μέλλω
  choice: Traduzir a iminência por “estou prestes a”.
  alternative: “Vou” ou “vomitarei”.
  rationale: A formulação grega aponta para uma ação iminente, mantendo a urgência da advertência sem transformá-la numa afirmação temporalmente genérica.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com legibilidade brasileira. O pronome “você” segue o registro contemporâneo dirigido ao destinatário singular; a ordem “nem quente nem frio” acompanha o grego. A nota oferece uma alternativa menos gráfica sem substituir no texto principal a força lexical do original.
