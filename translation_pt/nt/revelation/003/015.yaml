  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: pt
  text: 'Conheço as suas obras: você não é nem frio nem quente. Quem dera você fosse frio ou quente!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: Conheço
  rationale: οἶδα tem força estativa presente; “Conheço” é natural em português e mantém o tom direto de avaliação.
- source_word: σου τὰ ἔργα
  choice: as suas obras
  rationale: Preserva a formulação recorrente de avaliação em Apocalipse e o peso moral de ἔργα, sem recorrer à paráfrase “o que você faz”.
- source_word: ψυχρὸς
  choice: frio
  rationale: Mantém literalmente a metáfora de temperatura e o contraste com ζεστός.
- source_word: ζεστός
  choice: quente
  rationale: É o equivalente corrente e direto no contraste de temperatura com “frio”, sem interpretar a imagem como fervor espiritual.
- source_word: ὄφελον
  choice: Quem dera
  rationale: Expressa com naturalidade um desejo contrário à situação presente e conserva a intensidade do grego.
- source_word: ἢ
  choice: ou
  rationale: Reproduz de modo simples e idiomático a disjunção entre “frio” e “quente”.
theological_decisions:
- issue: Sentido da metáfora de temperatura (“frio” e “quente”)
  choice: Manter a metáfora literal sem explicar os termos no corpo do versículo.
  alternative: Interpretar “frio” como indiferença ou incredulidade e “quente” como fervor espiritual; ou entender ambos como temperaturas benéficas, refrescante e terapêutica.
  rationale: O versículo não decodifica explicitamente a metáfora. A tradução preserva sua abertura interpretativa e evita inserir uma leitura teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” torna a interpelação singular explícita e natural. “Quem dera” conserva a força emotiva de ὄφελον sem soar excessivamente arcaico; o ponto de exclamação comunica a intensidade do desejo.
