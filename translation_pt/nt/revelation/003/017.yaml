id: REV.3.17
reference: Revelation 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: pt
  text: 'pois você diz: “Sou rico, enriqueci e não preciso de nada”; mas não sabe que é você o miserável[a], digno de compaixão, pobre, cego e nu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você é miserável”. O grego emprega o artigo e dá ênfase especial à descrição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι λέγεις
  choice: pois você diz
  rationale: O primeiro ὅτι tem força causal no contexto, e λέγεις dirige a acusação diretamente à comunidade.
- source_word: Πλούσιός εἰμι
  choice: Sou rico
  rationale: Reproduz de modo direto a afirmação de riqueza e prepara o contraste irônico com πτωχός.
- source_word: πεπλούτηκα
  choice: enriqueci
  rationale: O perfeito expressa a aquisição de riqueza com resultado presente; “enriqueci” preserva o processo sem repetir simplesmente “sou rico”.
- source_word: οὐδὲν χρείαν ἔχω
  choice: não preciso de nada
  rationale: Expressão corrente e clara em português que conserva a negação abrangente de οὐδέν.
- source_word: οὐκ οἶδας
  choice: não sabe
  rationale: Mantém o sentido cognitivo explícito do verbo, sem substituí-lo pela interpretação “não percebe”.
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: é você o miserável
  rationale: A construção ressalta o pronome σὺ e conserva, em português natural, o caráter incisivo do adjetivo articulado ὁ ταλαίπωρος.
- source_word: ἐλεεινός
  choice: digno de compaixão
  rationale: Expressa alguém que inspira compaixão e evita fundir este termo com ταλαίπωρος.
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: pobre, cego e nu
  rationale: Mantém as imagens simples e fortes do grego, sem acrescentar qualificadores interpretativos.
theological_decisions:
- issue: Explicitar que pobreza, cegueira e nudez são espirituais
  choice: Manter as imagens sem o acréscimo de “espiritualmente”
  alternative: “espiritualmente pobre, cego e nu”
  rationale: O próprio contraste retórico comunica o sentido figurado; explicá-lo no texto resolveria uma tensão que o original deixa ao leitor.
- issue: Representar a ênfase de σὺ e do artigo em ὁ ταλαίπωρος
  choice: “é você o miserável”
  alternative: “você é miserável”
  rationale: A formulação escolhida preserva a acusação enfática e pessoal sem introduzir uma categoria doutrinária ou uma identidade permanente além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação separa claramente a autodeclaração da avaliação contrastante. “Você” torna explícita a interpelação singular do texto e “é você” preserva a ênfase do pronome grego.
