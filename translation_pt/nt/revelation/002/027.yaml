  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: pt
  text: e ele os pastoreará com uma vara de ferro[a], como vasos de barro são despedaçados[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os governará com uma vara de ferro». O verbo significa literalmente «pastorear», mas, nesta alusão ao Salmo 2, também expressa governo régio.'
    reason: alternative_reading
  - marker: b
    text: Alusão ao Salmo 2:9, onde as nações são quebradas como vasos de oleiro.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação do versículo com a promessa iniciada no contexto anterior.
- source_word: ποιμανεῖ
  choice: pastoreará
  rationale: Preserva a imagem explícita de ποιμαίνω, que significa cuidar ou conduzir como pastor, sem apagar o sentido de governo régio presente na alusão ao Salmo 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: com uma vara de ferro
  rationale: «Vara de ferro» é natural e compreensível em português e conserva tanto a imagem pastoral quanto a força e a autoridade régia do texto.
- source_word: ὡς
  choice: como
  rationale: Introduz naturalmente a comparação com o destino dos vasos de barro.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: os vasos de barro
  rationale: «Vasos de barro» é uma expressão corrente, digna e fiel à ideia de recipientes cerâmicos frágeis.
- source_word: συντρίβεται
  choice: são despedaçados
  rationale: Exprime a quebra violenta indicada por συντρίβω. O plural português concorda naturalmente com «vasos», enquanto o singular grego segue a concordância comum de verbo singular com sujeito neutro plural.
theological_decisions:
- issue: Alusão régio-messiânica ao Salmo 2:9 em ποιμανεῖ e na vara de ferro
  choice: Conservar «pastoreará» no texto principal, mantendo juntas as ideias de pastoreio e autoridade régia.
  alternative: Traduzir «governará» ou «regerá» para tornar explícito o domínio real.
  rationale: O grego emprega ποιμαίνω, verbo de pastoreio, e não um verbo genérico de governo. A alusão ao Salmo 2 acrescenta a dimensão de domínio e juízo; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pastoreará» preserva a metáfora original; «vara de ferro» e «vasos de barro» mantêm a linguagem bíblica sem soar arcaica. A pontuação final conserva a continuidade sintática com os versículos adjacentes.
