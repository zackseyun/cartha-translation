  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: pt
  text: 'Conheço as suas obras: o seu amor, a sua fé[a], o seu serviço, a sua perseverança e as suas obras mais recentes, que superam as primeiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. Neste contexto, a palavra grega pode significar tanto fé como fidelidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Conheço
  rationale: O verbo οἶδα tem força presente e estativa. “Conheço” reproduz de modo natural a fórmula recorrente de avaliação das igrejas em Apocalipse.
- source_word: ἔργα
  choice: obras
  rationale: “Obras” preserva a repetição do termo grego e seu sentido de ações concretas avaliadas por Cristo.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente direto e corrente de ἀγάπη neste catálogo de virtudes cristãs.
- source_word: πίστιν
  choice: fé
  rationale: “Fé” mantém o sentido usual de πίστις e não elimina a possibilidade contextual de “fidelidade”, registrada em nota.
- source_word: διακονίαν
  choice: serviço
  rationale: Neste contexto, διακονία indica serviço prático. “Serviço” é claro e evita sugerir necessariamente um cargo ou ministério formal.
- source_word: ὑπομονήν
  choice: perseverança
  rationale: Expressa a constância resistente sob pressão característica de ὑπομονή em Apocalipse, em português natural e acessível.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: as suas obras mais recentes
  rationale: O sentido é temporal e contrasta as obras posteriores com as primeiras. “Mais recentes” evita que “últimas” seja entendido como obras finais ou derradeiras.
- source_word: πλείονα τῶν πρώτων
  choice: são mais numerosas do que as primeiras
  rationale: πλείονα indica que as obras posteriores são mais em número ou extensão. A formulação preserva a comparação explícita sem substituí-la por um elogio qualitativo genérico.
theological_decisions:
- issue: Sentido de πίστις na lista de virtudes
  choice: fé
  alternative: fidelidade
  rationale: O termo pode designar confiança em Deus ou fidelidade demonstrada na conduta. O texto principal conserva “fé”, enquanto a nota mantém aberta a alternativa lexical legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “obras” foi mantida por corresponder à estrutura enfática do grego; o ponto e vírgula organiza a longa enumeração sem alterar suas relações.
