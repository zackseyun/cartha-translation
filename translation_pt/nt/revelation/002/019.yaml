    issue: «e sei que» acrescenta uma nova formulação verbal não explicitada no texto grego.
    rationale: O segundo καί coordena «as suas obras mais recentes» aos elementos já conhecidos por Cristo. Em português, uma construção relativa permite preservar essa relação sem tornar a frase artificial.
  - severity: medium
    issue: «São mais numerosas» limita o comparativo πλείονα à quantidade numérica.
    rationale: πλείονα pode indicar que as obras posteriores são mais, maiores ou mais amplas; «superam» preserva a comparação sem impor apenas o sentido numérico.
