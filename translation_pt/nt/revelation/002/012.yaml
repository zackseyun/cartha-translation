id: REV.2.12
reference: Revelation 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: pt
  text: 'E ao anjo da igreja em Pérgamo escreva: Assim diz aquele que tem a espada afiada de dois gumes:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”, em vez de “anjo”. Há diferentes interpretações sobre se a referência é a um ser celestial ou a um representante humano da igreja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: O termo pode designar um anjo celestial ou um mensageiro humano. “Anjo” é a forma consagrada e natural neste contexto, ao mesmo tempo que a nota preserva a possível referência humana.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: No contexto cristão de Apocalipse, designa a comunidade cristã; “igreja” é o equivalente português mais claro e corrente.
- source_word: Περγάμῳ
  choice: Pérgamo
  rationale: É a forma portuguesa moderna e estabelecida do nome da cidade.
- source_word: γράψον
  choice: escreva
  rationale: O imperativo aoristo é vertido diretamente por um imperativo natural em português; o conteúdo a escrever vem na declaração seguinte.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Fórmula solene e idiomática em português para introduzir uma declaração profética ou régia, preservando seu caráter formal sem produzir uma construção artificial.
- source_word: ὁ ἔχων
  choice: aquele que tem
  rationale: Reproduz de modo natural o particípio substantivado e conserva sua força de título descritivo.
- source_word: ῥομφαίαν
  choice: espada
  rationale: Embora possa indicar uma espada grande ou pesada, “espada” evita especificação indevida e permite que os modificadores transmitam a imagem.
- source_word: δίστομον
  choice: de dois gumes
  rationale: Equivalente português tradicional e claro para o sentido idiomático de “duas bocas”, isto é, uma lâmina cortante dos dois lados.
- source_word: ὀξεῖαν
  choice: afiada
  rationale: Expressa diretamente a qualidade cortante da espada em português natural.
theological_decisions:
- issue: Identidade do “anjo” da igreja
  choice: Manter “anjo” no texto principal sem definir se a referência é celestial ou humana.
  alternative: “mensageiro”, entendido possivelmente como representante ou dirigente humano da igreja
  rationale: ἄγγελος admite ambas as possibilidades, e o versículo não decide entre elas. A tradução e a nota preservam essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim diz” mantém a solenidade da fórmula, e “espada afiada de dois gumes” conserva a imagem vívida e a ordem descritiva natural em português.
