id: REV.2.22
reference: Revelation 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: pt
  text: 'Vejam: eu a lanço numa cama[a], e lanço em grande aflição[b] os que cometem adultério com ela, a menos que se arrependam das obras dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num leito de doença”. O grego diz literalmente “numa cama”; neste contexto, muitos entendem que se trata de uma cama de sofrimento ou doença como juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “em grande tribulação”. Aqui, a expressão indica sofrimento ou angústia intensos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Interjeição corrente que chama a atenção dos ouvintes; evita o tom arcaico de “eis”. O plural é natural no discurso dirigido à comunidade.
- source_word: βάλλω
  choice: eu a lanço / lanço
  rationale: O presente vívido comunica ação iminente de juízo. A repetição do verbo na segunda oração, implícito no grego, torna a coordenação natural e clara em português.
- source_word: αὐτὴν εἰς κλίνην
  choice: a lanço numa cama
  rationale: κλίνη significa literalmente “cama” ou “leito”. A tradução principal não acrescenta “de doença”, deixando essa interpretação contextual para a nota.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: os que cometem adultério com ela
  rationale: Preserva o sentido lexical concreto de μοιχεύω e permite que uma possível dimensão simbólica ou espiritual seja percebida pelo contexto.
- source_word: εἰς θλῖψιν μεγάλην
  choice: em grande aflição
  rationale: “Aflição” expressa sofrimento e angústia intensos sem restringir a expressão a uma leitura escatológica técnica.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: a menos que se arrependam
  rationale: Representa de modo claro e idiomático a condição negativa do grego.
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: das obras dela
  rationale: Com “arrepender-se”, “das” é idiomático em português e conserva a referência explícita às obras que pertencem a ela ou são promovidas por ela.
theological_decisions:
- issue: Se κλίνη deve ser explicitada como cama de doença ou sofrimento
  choice: Manter “cama” no texto principal
  alternative: “leito de doença”
  rationale: Embora o contexto de juízo sugira doença ou sofrimento e possa criar uma reversão irônica da imoralidade, κλίνη por si só significa simplesmente “cama/leito”. A nota preserva a interpretação sem inseri-la no texto.
- issue: Se μοιχεύοντας descreve adultério sexual literal, infidelidade espiritual metafórica ou ambos
  choice: Traduzir pelo sentido lexical “cometem adultério”
  alternative: “praticam imoralidade sexual” ou “são infiéis”
  rationale: O termo grego denota diretamente adultério. A formulação concreta preserva a força da imagem e não elimina sua possível dimensão simbólica no Apocalipse.
- issue: A referência do sujeito em μετανοήσωσιν e do possessivo em αὐτῆς
  choice: “se arrependam das obras dela”
  alternative: 'Leitura variante: “se arrependa das obras dela”'
  rationale: O texto da SBLGNT apresentado traz o verbo no plural, referindo-se aos que cometem adultério, enquanto αὐτῆς atribui as obras a ela. A tradução conserva essa distinção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” funciona como chamado direto de atenção; “cama” preserva a concretude e a ambiguidade do original. Os marcadores [a] e [b] aparecem no texto principal.
