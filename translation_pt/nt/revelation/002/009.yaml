id: REV.2.9
reference: Revelation 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: pt
  text: Conheço a sua aflição e a sua pobreza — mas você é rico — e a calúnia[a] que vem dos que dizem ser judeus e não são, mas são uma sinagoga de Satanás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “blasfêmia”. Aqui, o sentido é de fala hostil e difamatória contra os fiéis; por isso, usa-se “calúnia” no texto principal.
    reason: lexical_alternative
  - marker: b
    text: A expressão “sinagoga de Satanás” foi mantida literalmente. “Sinagoga” também pode significar “assembleia” ou “reunião”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: aflição
  rationale: Expressa sofrimento, pressão ou opressão de modo natural e digno, sem os possíveis sentidos escatológicos técnicos de “tribulação”.
- source_word: πτωχείαν
  choice: pobreza
  rationale: É a correspondência direta e idiomática para a condição material indicada pelo termo.
- source_word: πλούσιος
  choice: rico
  rationale: Preserva o contraste incisivo com “pobreza” e deixa implícita, como no grego, a natureza dessa riqueza.
- source_word: βλασφημίαν
  choice: calúnia
  rationale: No contexto, refere-se a fala hostil e difamatória contra os fiéis; “calúnia” comunica esse sentido em português atual, enquanto “blasfêmia” costuma sugerir ofensa direta a Deus.
- source_word: ἐκ τῶν λεγόντων
  choice: dos que dizem
  rationale: Reproduz de forma natural a origem da calúnia indicada por ἐκ e o valor substantivado do particípio.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: ser judeus
  rationale: É uma formulação portuguesa natural que preserva a afirmação explícita do grego sem acrescentar qualificadores interpretativos.
- source_word: συναγωγὴ
  choice: sinagoga
  rationale: Mantém a especificidade lexical e histórica, bem como a força irônica da caracterização; o termo também pode designar uma assembleia ou reunião.
- source_word: τοῦ Σατανᾶ
  choice: de Satanás
  rationale: Traduz diretamente o genitivo e conserva a força contundente da expressão sem ampliá-la.
theological_decisions:
- issue: Como traduzir a expressão polêmica sobre os que dizem ser judeus e não são
  choice: Manter literalmente “judeus” e o contraste enunciado, sem negar explicitamente a etnia nem inserir “verdadeiros”.
  alternative: “os que afirmam ser o povo de Deus e não são” ou “os que dizem ser verdadeiros judeus e não são”
  rationale: Ἰουδαίους é explícito. A tradução deve conservar a tensão retórica do texto sem suavizá-la nem intensificá-la mediante qualificações ausentes do grego.
- issue: Se deve explicitar que “rico” tem sentido espiritual
  choice: Deixar “mas você é rico” sem qualificação.
  alternative: “mas você é espiritualmente rico”
  rationale: O contexto sugere riqueza não material, mas o predicado grego não a qualifica; explicitá-la resolveria uma implicação que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no singular por naturalidade contemporânea e preserva os travessões que destacam o paradoxo entre pobreza e riqueza. Os marcadores aparecem após a oração completa, em ordem alfabética, e correspondem às alternativas lexicais pertinentes.
