  source_fidelity: 'A tradução reproduz bem os elementos centrais do grego: θλῖψις/πτωχεία como “aflição” e “pobreza”, o paradoxo não qualificado de “você é rico”, βλασφημία no sentido contextual de fala difamatória, e a expressão polêmica relativa aos que dizem ser judeus. Contudo, ἐκ τῶν λεγόντων expressa mais claramente a procedência da calúnia, e συναγωγὴ é predicativo singular indefinido (“uma sinagoga”).'
  naturalness: O registro é moderno, claro e adequado. “Calúnia dos que” pode ser entendido em português como genitivo subjetivo, mas permanece menos explícito que o grego quanto à origem; “calúnia que vem dos que” elimina essa ambiguidade. “São uma sinagoga” é mais natural e gramaticalmente completo em português contemporâneo do que “são sinagoga”.
  terminology: “Aflição”, “pobreza”, “rico”, “calúnia”, “judeus”, “sinagoga” e “Satanás” são escolhas apropriadas. As notas preservam corretamente “blasfêmia” e “assembleia/reunião” como alternativas, sem impor uma leitura teológica adicional.
  issues:
  - severity: medium
    issue: A procedência indicada por ἐκ fica pouco explícita em “a calúnia dos que”.
    rationale: Embora o genitivo português possa ter valor subjetivo, também pode ser lido de outras maneiras. “A calúnia que vem dos que” comunica de modo inequívoco que a fala hostil procede dessas pessoas, como ἐκ τῶν λεγόντων.
  - severity: low
    issue: Falta o artigo indefinido em “mas são sinagoga de Satanás”.
    rationale: A construção grega usa συναγωγὴ como predicativo singular indefinido. “Mas são uma sinagoga de Satanás” é mais idiomático em português e conserva a força do original.
  - severity: low
    issue: Os marcadores das notas aparecem ambos apenas no final do versículo.
    rationale: A nota sobre “calúnia” deve ancorar-se a esse termo, e a nota sobre “sinagoga” à expressão correspondente. Reposicioná-los melhora a associação sem alterar o sentido.
