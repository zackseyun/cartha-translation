revisions:
- from: Conheço a sua aflição e a sua pobreza — mas você é rico — e a calúnia dos que dizem ser judeus e não são, mas são sinagoga de Satanás.[a][b]
  to: Conheço a sua aflição e a sua pobreza — mas você é rico — e a calúnia[a] que vem dos que dizem ser judeus e não são, mas são uma sinagoga de Satanás.[b]
  rationale: A revisão explicita a relação de origem marcada por ἐκ (“que vem dos”), verte o predicativo singular συναγωγή com artigo indefinido (“uma sinagoga”) e coloca cada marcador junto ao termo que sua nota esclarece. Mantêm-se a formulação polêmica do original e a riqueza não qualificada, sem introduzir explicações doutrinárias.
