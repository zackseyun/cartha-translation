  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: pt
  text: assim como eu também recebi de meu Pai, e eu lhe darei a estrela da manhã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a estrela da aurora”. A expressão pode aludir a imagens régias e messiânicas e também pode antecipar Apocalipse 22:16, onde Jesus se identifica como “a brilhante estrela da manhã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: assim como
  rationale: Expressa de modo natural a comparação com a promessa anterior, preservando a correspondência indicada pelo grego.
- source_word: κἀγὼ
  choice: eu também
  rationale: A crase de καὶ ἐγώ combina o pronome enfático com a ideia aditiva; “eu também” conserva ambos os elementos sem exagerar a ênfase.
- source_word: εἴληφα
  choice: recebi
  rationale: Em português, o pretérito perfeito traduz naturalmente uma ação concluída cujo resultado permanece no contexto; “tenho recebido” sugeriria repetição ou continuidade indevida.
- source_word: παρὰ τοῦ πατρός μου
  choice: de meu Pai
  rationale: παρά com o genitivo indica aqui fonte ou origem. A formulação preserva diretamente a relação filial expressa no texto.
- source_word: καὶ δώσω αὐτῷ
  choice: e eu lhe darei
  rationale: Mantém o futuro e o referente singular retomado do contexto anterior. O pronome explícito “eu” preserva a correspondência enfática com κἀγώ.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: a estrela da manhã
  rationale: É a expressão portuguesa corrente para a imagem grega e mantém a metáfora sem explicá-la no corpo do texto.
theological_decisions:
- issue: Identidade e significado da “estrela da manhã”
  choice: Manter a expressão metafórica sem defini-la no texto principal.
  alternative: Explicá-la como Cristo, como símbolo régio-messiânico ou como recompensa e glória escatológica.
  rationale: O versículo não identifica explicitamente o símbolo. A tradução preserva sua riqueza e ambiguidade, enquanto a nota registra alusões plausíveis.
- issue: Relação cristológica em “de meu Pai”
  choice: Traduzir diretamente a linguagem de recepção e filiação.
  alternative: Acrescentar uma explicação sobre autoridade delegada ou sobre a economia da redenção.
  rationale: O texto afirma que o Filho recebeu algo do Pai, mas não desenvolve aqui a natureza dessa relação; uma explicação adicional seria interpretação, não tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula sinaliza que a primeira oração conclui a comparação iniciada no contexto anterior, enquanto a segunda apresenta uma promessa adicional. A marca da nota foi colocada após “estrela da manhã”, termo ao qual seu conteúdo se refere.
