id: REV.2.8
reference: Revelation 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: pt
  text: 'E ao anjo[a] da igreja em Esmirna escreva: “Isto diz o Primeiro e o Último, aquele que esteve morto e voltou a viver[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente, “viveu”. Também se pode traduzir: “aquele que morreu e tornou a viver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: Em Apocalipse, o contexto visionário favorece o sentido de ser celestial; “mensageiro” continua lexicalmente possível e é registrado em nota.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: Aqui designa a comunidade cristã de Esmirna; “igreja” transmite naturalmente esse sentido religioso e comunitário.
- source_word: Τάδε λέγει
  choice: Isto diz
  rationale: Preserva de modo solene e compreensível a fórmula profética recorrente, sem expandi-la para uma paráfrase.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: o Primeiro e o Último
  rationale: A expressão funciona como título cristológico; as iniciais maiúsculas sinalizam esse uso sem acrescentar explicação ao texto.
- source_word: ἐγένετο νεκρὸς
  choice: esteve morto
  rationale: Formulação portuguesa natural que expressa o estado real de morte. Embora ἐγένετο tenha nuance eventiva, “tornou-se morto” seria pouco idiomático.
- source_word: ἔζησεν
  choice: voltou a viver
  rationale: Comunica naturalmente o contraste com a morte e a referência contextual à ressurreição; a alternativa mais literal é preservada em nota.
theological_decisions:
- issue: Título cristológico e linguagem de morte e ressurreição
  choice: “o Primeiro e o Último, aquele que esteve morto e voltou a viver”
  alternative: “o primeiro e o último, que se tornou morto e viveu”
  rationale: Mantém o título elevado e afirma claramente a morte e o retorno à vida de Jesus, sem importar explicações doutrinárias. A redação portuguesa evita literalismo artificial, mas conserva a tensão entre morte real e vida restaurada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Escreva” é usado como imperativo natural; a fórmula “Isto diz” mantém a cadência solene do original. Os marcadores [a] e [b] aparecem no texto principal junto aos termos pertinentes.
