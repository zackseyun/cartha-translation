id: REV.2.7
reference: Revelation 2:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: pt
  text: Quem tem ouvido, ouça o que o Espírito diz às igrejas. Àquele que vencer[a], darei de comer da árvore da vida, que está no paraíso de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Àquele que superar”.'
    reason: Alternativa lexical para νικάω.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvido
  rationale: Mantém o singular de οὖς e expressa de modo idiomático o particípio substantivado, com sentido representativo e geral.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo na terceira pessoa é traduzido diretamente por uma exortação natural em português.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Na fórmula repetida de Apocalipse 2–3, o referente contextual é o Espírito Santo; a inicial maiúscula indica essa identificação.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: diz às igrejas
  rationale: O presente simples preserva o aspecto da declaração, e “igrejas” é o equivalente contextual de ἐκκλησίαις.
- source_word: τῷ νικῶντι
  choice: Àquele que vencer
  rationale: “Vencer” comunica diretamente a ideia de νικάω e preserva a imagem de vitória característica de Apocalipse. O futuro do subjuntivo é a forma portuguesa natural para a pessoa que vier a vencer.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: darei de comer
  rationale: A expressão portuguesa é natural e conserva tanto o verbo “dar” quanto o sentido concreto de comer, sem introduzir explicitamente conceitos como direito ou permissão.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: da árvore da vida
  rationale: Neste contexto, ξύλον designa uma árvore, e a preposição “de” expressa naturalmente a origem daquilo que será comido.
- source_word: παραδείσῳ
  choice: paraíso
  rationale: “Paraíso” preserva o peso escatológico e intertextual de παράδεισος, em vez de reduzi-lo a um jardim comum.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Traduz de forma direta e concisa o genitivo grego.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: o Espírito Santo
  alternative: um espírito em sentido genérico
  rationale: A fórmula reiterada nas mensagens às igrejas apresenta uma voz divina que se dirige a elas; a inicial maiúscula reflete essa identificação contextual sem ampliar o texto.
- issue: Sentido de νικάω na fórmula da promessa
  choice: vencer
  alternative: superar
  rationale: “Vencer” preserva com clareza a linguagem de conflito e vitória de Apocalipse, enquanto “superar” continua sendo uma alternativa lexical possível.
- issue: Valor de δώσω αὐτῷ φαγεῖν
  choice: darei de comer
  alternative: darei o direito de comer
  rationale: A redação escolhida preserva a linguagem de dádiva e evita explicitar como “direito” aquilo que o grego deixa implícito na construção com infinitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o singular “ouvido” do grego e a fórmula solene da exortação; “darei de comer” evita uma paráfrase teológica desnecessária.
