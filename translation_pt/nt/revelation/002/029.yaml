  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: pt
  text: Quem tem ouvidos, ouça o que o Espírito diz às igrejas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: A construção substantivada singular significa literalmente “aquele que tem ouvido”. Em português, a fórmula proverbial natural e consagrada emprega “quem tem ouvidos”, preservando a ideia de capacidade e disposição para ouvir sem produzir uma frase artificial.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo aoristo na terceira pessoa do singular é reproduzido diretamente pelo presente do subjuntivo com valor imperativo em português. “Ouça” mantém a força solene da convocação.
- source_word: τί
  choice: o que
  rationale: Introduz o conteúdo da fala e é a correspondência natural e precisa em português.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No refrão de Apocalipse 2–3, o referente é o Espírito divino que fala às igrejas. A inicial maiúscula identifica esse referente sem acrescentar explicação ao texto.
- source_word: λέγει
  choice: diz
  rationale: O presente indica fala atual ou característica. “Diz” é direto, natural e adequado à fórmula repetida.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: No contexto, ἐκκλησίαι designa as comunidades cristãs destinatárias. “Igrejas” é a tradução corrente e contextualmente precisa; a contração “às” expressa naturalmente o dativo.
theological_decisions:
- issue: Referente de “o Espírito”
  choice: o Espírito Santo que fala às igrejas
  alternative: um espírito humano ou o espírito/a mensagem de Jesus
  rationale: O refrão repetido em Apocalipse 2–3 apresenta o Espírito como o falante divino que dirige as mensagens a todas as igrejas. A tradução “o Espírito” preserva essa identificação sem inserir “Santo”, palavra não expressa no grego deste versículo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A expressão idiomática “Quem tem ouvidos, ouça” prioriza naturalidade sem perder a estrutura proverbial nem a força imperativa do grego.
