id: REV.2.11
reference: Revelation 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: pt
  text: Quem tem ouvidos, ouça o que o Espírito diz às igrejas. Quem vencer de modo nenhum será prejudicado pela segunda morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: A construção participial substantivada tem sentido representativo. Embora o grego use o singular «ouvido», o plural é a forma idiomática consagrada e natural em português, sem mudar o sentido.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O imperativo aoristo na terceira pessoa do singular é expresso naturalmente pelo presente do subjuntivo com valor imperativo em português.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Na fórmula repetida de Apocalipse 2–3, trata-se do agente divino que fala às igrejas; a inicial maiúscula indica esse referente provável sem ampliar lexicalmente o texto.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: No contexto, ἐκκλησίαις designa as comunidades cristãs destinatárias; «igrejas» é a equivalência corrente e clara.
- source_word: ὁ νικῶν
  choice: Quem vencer
  rationale: O particípio presente substantivado descreve aquele que vence ou persevera vitoriosamente. «Quem vencer» é natural em português e preserva a metáfora de vitória.
- source_word: οὐ μὴ
  choice: certamente não
  rationale: A combinação οὐ μή com o subjuntivo constitui uma negação enfática; «certamente não» comunica essa força sem linguagem arcaica.
- source_word: ἀδικηθῇ
  choice: sofrerá dano algum
  rationale: O passivo de ἀδικέω, neste contexto, indica ser prejudicado ou sofrer dano. A expressão portuguesa transmite o efeito adverso e combina naturalmente com a negação enfática.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: por causa da segunda morte
  rationale: Com o passivo, ἐκ pode marcar a fonte da qual procede o dano. «Por causa de» expressa essa relação de modo natural, sem afirmar de forma rígida uma agência instrumental.
theological_decisions:
- issue: Referente de «o Espírito»
  choice: O Espírito como agente divino que fala às igrejas
  alternative: O espírito profético em sentido mais geral
  rationale: A fórmula recorrente nas mensagens às igrejas apresenta «o Espírito» como falante divino. A maiúscula registra esse referente contextual provável sem inserir «Santo», ausente no grego.
- issue: Sentido de «a segunda morte»
  choice: Preservar a expressão sem explicação interpretativa
  alternative: Explicitá-la como condenação eterna ou juízo final
  rationale: A expressão possui peso teológico próprio e é esclarecida em outros trechos de Apocalipse; expandi-la aqui resolveria interpretativamente algo que o versículo deixa condensado.
- issue: Força da promessa ao vencedor
  choice: 'Negação enfática: «certamente não sofrerá dano algum»'
  alternative: 'Negação simples: «não sofrerá dano»'
  rationale: A construção grega οὐ μή exige que se conserve a forte certeza da promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a fórmula exortativa e a imagem apocalíptica, evitando arcaísmos e expansões doutrinárias.
