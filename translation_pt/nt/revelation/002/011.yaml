review_pass:
  verdict: revise
  source_fidelity: A primeira frase traduz adequadamente a fórmula grega, com o plural idiomático «ouvidos» em português. «Quem vencer» representa de modo aceitável o particípio presente substantivado ὁ νικῶν, e «segunda morte» preserva a expressão apocalíptica sem explicação doutrinária. Contudo, «por causa da segunda morte» tende a indicar causa ou motivo, enquanto ἐκ, com o passivo ἀδικηθῇ, aponta para a fonte ou o agente do dano. Uma formulação com «pela» comunica melhor essa relação.
  naturalness: O texto é claro, moderno e de registro apropriado. «Quem tem ouvidos, ouça» é uma fórmula natural e estabelecida. «Será prejudicado pela segunda morte» é ligeiramente mais direto e idiomático do que «sofrerá dano algum por causa da segunda morte», além de refletir melhor a voz passiva grega.
  terminology: «O Espírito», «igrejas», «vencer» e «segunda morte» são escolhas consistentes com o contexto de Apocalipse. A maiúscula em «Espírito» é contextual e não introduz a palavra «Santo».
  issues:
  - severity: medium
    issue: «por causa da segunda morte» para ἐκ τοῦ θανάτου τοῦ δευτέρου
    rationale: A locução causal pode sugerir que a segunda morte é apenas o motivo ou a circunstância do dano. No grego, ἐκ nesse contexto expressa mais naturalmente a origem ou a relação de agente/fonte do dano. «Pela segunda morte» preserva melhor essa nuance.
  revised_text: Quem tem ouvidos, ouça o que o Espírito diz às igrejas. Quem vencer de modo nenhum será prejudicado pela segunda morte.
  revised_footnotes: []
