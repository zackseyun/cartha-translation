revisions:
- from: Quem tem ouvidos, ouça o que o Espírito diz às igrejas. Quem vencer certamente não sofrerá dano algum por causa da segunda morte.
  to: Quem tem ouvidos, ouça o que o Espírito diz às igrejas. Quem vencer de modo nenhum será prejudicado pela segunda morte.
  rationale: A revisão limita-se à relação expressa por ἐκ e à forma de conservar em português a negação enfática οὐ μή. «De modo nenhum será prejudicado pela segunda morte» mantém a promessa forte, a voz passiva e a segunda morte como fonte/agente do dano, sem expandir seu sentido teológico.
