id: REV.2.21
reference: Revelation 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: pt
  text: E dei a ela tempo para se arrepender, mas ela não quer se arrepender da sua imoralidade sexual.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não quer se arrepender, afastando-se da sua imoralidade sexual”.'
    reason: A preposição grega ἐκ significa literalmente «de dentro de/para fora de» e aqui pode destacar o afastamento da conduta, embora «arrepender-se de» seja a forma idiomática em português.
lexical_decisions:
- source_word: ἔδωκα
  choice: dei
  rationale: O aoristo indicativo apresenta como fato a concessão de tempo; o pretérito perfeito simples é natural e preciso em português.
- source_word: αὐτῇ
  choice: a ela
  rationale: O dativo feminino singular retoma a mulher simbolicamente chamada Jezabel no contexto. A construção «dei a ela» é clara e amplamente compreensível.
- source_word: χρόνον
  choice: tempo
  rationale: χρόνος designa tempo ou um período de tempo; «tempo» preserva a formulação sem explicitar além do texto a ideia de oportunidade.
- source_word: ἵνα μετανοήσῃ
  choice: para se arrepender
  rationale: ἵνα com o subjuntivo expressa finalidade; esta construção transmite isso de forma natural em português.
- source_word: οὐ θέλει
  choice: não quer
  rationale: θέλω expressa vontade. «Não quer» preserva diretamente a falta de disposição sem intensificá-la para «recusa-se».
- source_word: μετανοῆσαι
  choice: se arrepender
  rationale: O infinitivo complementa θέλει, e a repetição conserva a ênfase do grego.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: da sua imoralidade sexual
  rationale: πορνεία é traduzido de modo concreto como «imoralidade sexual». Com «arrepender-se», a regência portuguesa natural é «de», embora ἐκ expresse literalmente afastamento ou saída.
theological_decisions:
- issue: Sentido de πορνεία em uma repreensão apocalíptica
  choice: imoralidade sexual
  alternative: imoralidade; prostituição; infidelidade espiritual
  rationale: A tradução mantém o sentido lexical concreto sem decidir se, no contexto simbólico, também há conotações de idolatria ou infidelidade espiritual.
- issue: Força de οὐ θέλει
  choice: não quer
  alternative: não está disposta; recusa-se
  rationale: A escolha preserva a dimensão volitiva do original sem reforçá-la como uma recusa categórica além do que a expressão exige.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de «se arrepender» acompanha a ênfase do original.
