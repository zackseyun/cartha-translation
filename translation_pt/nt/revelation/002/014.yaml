id: REV.2.14
reference: Revelation 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: pt
  text: 'Mas tenho algumas coisas contra você: há aí pessoas que se apegam ao ensino de Balaão, o qual ensinava Balaque a pôr uma pedra de tropeço diante dos filhos de Israel[a], para que comessem alimentos sacrificados a ídolos e praticassem imoralidade sexual.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas” ou “do povo de Israel”. O grego diz literalmente “dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: algumas coisas
  rationale: O adjetivo neutro plural é usado substantivamente; “algumas coisas” explicita de modo natural em português o objeto implícito.
- source_word: κρατοῦντας
  choice: pessoas que se apegam
  rationale: Neste contexto, κρατέω indica adesão persistente a um ensino, não ação física; “apegar-se” conserva essa força.
- source_word: τὴν διδαχὴν
  choice: o ensino
  rationale: “Ensino” é atual, claro e menos marcado por jargão eclesiástico que “doutrina”.
- source_word: Βαλαάμ / Βαλὰκ
  choice: Balaão / Balaque
  rationale: Empregam-se as formas tradicionalmente consagradas dos nomes em português.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: ensinava Balaque
  rationale: O imperfeito é preservado naturalmente em português, sem forçar a ideia de uma única ação pontual.
- source_word: βαλεῖν σκάνδαλον
  choice: pôr uma pedra de tropeço
  rationale: Mantém a metáfora moral e espiritual do grego em uma expressão bíblica ainda compreensível em português.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente direto e natural que combina com a metáfora de pôr um obstáculo no caminho de alguém.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva a formulação masculina explícita e convencional do texto grego; uma alternativa coletiva mais idiomática é registrada em nota.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: a comer alimentos sacrificados a ídolos
  rationale: Explicita de forma clara e atual o sentido cultual de εἰδωλόθυτα.
- source_word: πορνεῦσαι
  choice: a praticar imoralidade sexual
  rationale: Abrange a conduta sexual ilícita indicada pelo verbo sem restringi-la indevidamente a uma categoria específica.
theological_decisions:
- issue: Formulação de τῶν υἱῶν Ἰσραήλ
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A tradução principal conserva a expressão do grego e sua forma bíblica tradicional, enquanto a nota oferece equivalentes coletivos naturais sem alterar o referente.
- issue: Grau de literalidade de σκάνδαλον
  choice: pedra de tropeço
  alternative: armadilha / ocasião para pecar
  rationale: A metáfora é inteligível em português e preserva a tensão entre obstáculo, sedução e causa de queda, sem reduzir o termo a uma interpretação única.
- issue: Relação sintática dos infinitivos φαγεῖν e πορνεῦσαι
  choice: levando-os a comer... e a praticar...
  alternative: para que comessem... e praticassem...
  rationale: O acréscimo idiomático “levando-os” torna explícito que a pedra de tropeço resultava nessas ações, sem atribuir a Balaão ou Balaque o ato de comer; a relação exata dos infinitivos continua sendo causal-final no contexto.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. Mantêm-se as formas bíblicas tradicionais “Balaão”, “Balaque” e “pedra de tropeço”, mas evita-se sintaxe artificial. O singular “você” corresponde ao destinatário singular do contexto imediato.
