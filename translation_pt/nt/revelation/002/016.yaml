id: REV.2.16
reference: Revelation 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: pt
  text: Portanto, arrependa-se. Caso contrário, venho a você sem demora e guerrearei contra eles com a espada da minha boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “espada da minha boca” é uma imagem apocalíptica da palavra judicial de Cristo, isto é, de sua declaração de juízo.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: arrependa-se
  rationale: O imperativo aoristo pede uma resposta decidida. “Arrependa-se” preserva de modo conciso a força moral e espiritual do verbo.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão decorrente da repreensão anterior e mantém a conexão lógica e o tom solene.
- source_word: εἰ δὲ μή
  choice: caso contrário
  rationale: Expressa naturalmente em português a fórmula condicional de advertência e seu contraste enfático.
- source_word: ἔρχομαί σοι
  choice: venho a você
  rationale: Conserva o presente com força iminente e distingue a vinda dirigida à igreja da guerra especificada contra “eles”.
- source_word: ταχύ
  choice: sem demora
  rationale: Comunica prontidão e iminência sem decidir rigidamente entre proximidade temporal e rapidez da ação.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: guerrearei contra eles
  rationale: Preserva a severidade militar de πολεμέω; neste contexto, μετά com o verbo de guerra tem sentido adversativo.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: com a espada
  rationale: Expressa de modo natural o valor instrumental da preposição e mantém a imagem apocalíptica.
- source_word: τοῦ στόματός μου
  choice: da minha boca
  rationale: Reproduz o genitivo e conserva a imagem joanina sem reduzi-la interpretativamente a “minha palavra”.
theological_decisions:
- issue: A ação ameaçada de Cristo em relação à igreja e aos que sustentam o falso ensino
  choice: A vinda é dirigida à igreja no singular (“a você”), enquanto a guerra é dirigida a “eles”.
  alternative: Entender que Cristo vem indistintamente contra toda a igreja, ou que sua vinda diz respeito somente aos falsos mestres.
  rationale: A tradução mantém lado a lado o destinatário corporativo singular e o alvo plural da ação hostil, sem eliminar a tensão do texto.
- issue: O instrumento do juízo na imagem apocalíptica
  choice: Manter “a espada da minha boca”.
  alternative: Parafrasear como “minha palavra” ou “o poder da minha fala”.
  rationale: A metáfora explícita do original possui peso literário e teológico próprio e não deve ser achatada em uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O tratamento singular “você” explicita o destinatário corporativo sem arcaísmo. “Sem demora” evita a possível rigidez cronológica de “em breve”, e “guerrearei” retém a intensidade marcial do original.
