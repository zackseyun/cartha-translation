id: REV.2.5
reference: Revelation 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: pt
  text: Portanto, lembre-se de onde você caiu[a], arrependa-se e faça as obras que fazia no princípio. Caso contrário, venho a você e removerei o seu candelabro do lugar dele[b], a menos que você se arrependa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de que altura você caiu”. O grego diz literalmente “de onde você caiu”; alguns entendem que há uma metáfora implícita de altura.'
    reason: lexical_alternative
  - marker: b
    text: Em Apocalipse 1:20, o “candelabro” representa uma igreja.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: lembre-se
  rationale: O imperativo presente chama a uma lembrança contínua; “lembre-se” é natural em português e preserva a força da ordem.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão decorrente da repreensão anterior e mantém clara a conexão lógica.
- source_word: πόθεν πέπτωκας
  choice: de onde você caiu
  rationale: Reproduz a expressão grega sem acrescentar explicitamente a ideia de “altura”; o perfeito indica uma queda já ocorrida com resultado presente.
- source_word: μετανόησον / μετανοήσῃς
  choice: arrependa-se / se arrependa
  rationale: “Arrepender-se” é a formulação corrente e adequada para a mudança moral e espiritual exigida no contexto.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: faça as obras que fazia no princípio
  rationale: Expressa de modo natural que se trata das ações características do período inicial, sem reduzir ἔργα a sentimentos ou intenções.
- source_word: εἰ δὲ μή
  choice: caso contrário
  rationale: Comunica com clareza e concisão a condição negativa que introduz a advertência.
- source_word: ἔρχομαί σοι
  choice: venho a você
  rationale: Preserva o presente vívido do grego e evita acrescentar “contra”, ideia plausível no contexto, mas não expressa lexicalmente.
- source_word: κινήσω
  choice: removerei
  rationale: Embora o verbo possa significar literalmente “mover”, a construção “do lugar dele” comunica a retirada do candelabro de sua posição.
- source_word: τὴν λυχνίαν σου
  choice: o seu candelabro
  rationale: λυχνία designa um suporte para lâmpadas, não a própria lâmpada; “candelabro” é a imagem bíblica tradicional e inteligível em português.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: do lugar dele
  rationale: Formulação natural que conserva a imagem espacial da retirada.
theological_decisions:
- issue: Natureza da advertência sobre o candelabro
  choice: Manter a imagem simbólica da remoção do candelabro da igreja sem definir uma consequência sistemático-teológica específica.
  alternative: Explicitar como perda do testemunho coletivo, extinção ou perda de status da igreja, ou perda da salvação.
  rationale: Apocalipse 1:20 identifica os candelabros com as igrejas, mas este versículo não explica a ameaça em termos da salvação individual nem limita seu sentido à eficácia do testemunho. A tradução preserva a imagem e sua tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O singular “você” preserva a interpelação à igreja como uma unidade. “No princípio” mantém a referência temporal aos primeiros atos, e “venho” conserva a vivacidade do presente grego.
