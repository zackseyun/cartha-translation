id: REV.2.10
reference: Revelation 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: pt
  text: Não tenha medo do que você está prestes a sofrer. Eis que o diabo está prestes a lançar alguns de vocês na prisão, para que sejam postos à prova[a], e vocês terão tribulação durante dez dias. Seja fiel até a morte[b], e eu lhe darei a coroa da vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que sejam testados” ou “para que sejam tentados”; o verbo grego pode indicar prova, teste ou tentação, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: “Até a morte” também pode significar “até o ponto da morte”, indicando fidelidade mesmo que o martírio seja exigido.
    reason: alternative_reading
  - marker: c
    text: A palavra grega traduzida por “coroa” (stephanos) refere-se à grinalda ou ao prêmio de um vencedor, não a um diadema real.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Não tenha medo
  rationale: Expressa de modo natural em português a proibição enfática de temer, sem a rigidez de “Nada tema”.
- source_word: ἃ μέλλεις πάσχειν
  choice: do que você está para sofrer
  rationale: Preserva tanto o conteúdo do sofrimento quanto a iminência indicada por μέλλω.
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Mantém a função de chamar solenemente a atenção e se ajusta ao registro digno do texto.
- source_word: μέλλει βάλλειν
  choice: está para lançar
  rationale: Conserva a iminência de μέλλω e a força concreta de βάλλω.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: Neste contexto, o termo designa o adversário pessoal, para o qual “o diabo” é a forma estabelecida em português.
- source_word: ἐξ ὑμῶν
  choice: alguns de vocês
  rationale: Explicita naturalmente em português que se trata de uma parte do grupo.
- source_word: εἰς φυλακήν
  choice: na prisão
  rationale: Comunica o resultado de serem lançados para dentro da prisão com formulação idiomática.
- source_word: ἵνα πειρασθῆτε
  choice: para que sejam provados
  rationale: “Provados” abrange a ideia de serem postos à prova em meio à perseguição, mantendo em nota as possibilidades “testados” e “tentados”.
- source_word: ἕξετε θλῖψιν
  choice: vocês terão tribulação
  rationale: Preserva o peso de θλῖψις e sua ressonância no Apocalipse.
- source_word: ἡμερῶν δέκα
  choice: durante dez dias
  rationale: Traduz naturalmente o genitivo de duração.
- source_word: γίνου πιστός
  choice: Seja fiel
  rationale: Imperativo claro e natural que inclui a permanência no estado de fidelidade.
- source_word: ἄχρι θανάτου
  choice: até a morte
  rationale: Mantém a formulação aberta do grego, que pode indicar fidelidade até o fim da vida ou mesmo ao ponto de morrer.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: a coroa da vida
  rationale: Preserva a expressão metafórica e sua ambiguidade relacional, explicando em nota o tipo de coroa referido.
theological_decisions:
- issue: Sentido de πειρασθῆτε no contexto de perseguição promovida pelo diabo
  choice: sejam provados
  alternative: sejam testados; sejam tentados
  rationale: A prisão e o sofrimento funcionam como prova da fidelidade, mas o verbo também pode assumir o sentido de tentação; a nota conserva essa amplitude sem resolver indevidamente a tensão.
- issue: Alcance de ἄχρι θανάτου
  choice: até a morte
  alternative: até o ponto de morrer; mesmo que isso leve à morte
  rationale: A tradução direta admite tanto perseverança até o fim da vida quanto fidelidade diante do martírio, sem limitar a frase a apenas uma dessas leituras.
- issue: Imagem de στέφανος
  choice: coroa
  alternative: grinalda de vencedor; prêmio
  rationale: “Coroa” mantém a imagem tradicional e textual, enquanto a nota esclarece que se trata da coroa honorífica concedida ao vencedor, não de um diadema real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. “Eis que” conserva a solenidade do chamado de atenção sem tornar o restante do versículo arcaico. Os marcadores foram posicionados imediatamente após as expressões que explicam.
