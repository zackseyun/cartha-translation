id: REV.2.24
reference: Revelation 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: pt
  text: 'Mas aos demais que estão em Tiatira, a todos os que não têm este ensinamento e que não conheceram as coisas profundas de Satanás[a], como eles as chamam, digo: não ponho sobre vocês outro fardo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as profundezas de Satanás”. A expressão grega pode ecoar uma alegação de acesso a conhecimento espiritual “profundo”, aqui rejeitada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: a vocês, os demais que estão em Tiatira
  rationale: Expressa de modo natural o contraste entre os membros restantes da comunidade e os adeptos do ensinamento censurado, preservando a referência geográfica.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: seguem este ensinamento
  rationale: Neste contexto, ἔχω indica adesão ou compromisso com um ensinamento; “seguem” comunica isso com clareza sem a formulação pouco natural “têm este ensinamento”.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: não conheceram
  rationale: Mantém o aoristo de γινώσκω e deixa em aberto se o conhecimento mencionado seria intelectual, iniciático ou experiencial.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: as coisas profundas de Satanás
  rationale: Reproduz de forma transparente o neutro plural substantivado βαθέα e preserva a possível alusão irônica a pretensões de conhecimento espiritual profundo.
- source_word: ὡς λέγουσιν
  choice: como eles dizem
  rationale: Mantém a formulação compacta e a indefinição do referente de “eles”, sem decidir se a expressão é um lema dos falsos mestres ou uma caracterização polêmica.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: não ponho sobre vocês nenhum outro fardo
  rationale: Verte naturalmente o idioma βάλλω ἐπί, preserva a imagem de βάρος como obrigação imposta e evita linguagem arcaica.
theological_decisions:
- issue: Sentido e referente de “as coisas profundas de Satanás, como eles dizem”
  choice: Conservar a expressão como designação relatada e possivelmente irônica, sem identificar de modo explícito quem a formulou.
  alternative: Explicitar que os falsos mestres chamavam seu ensino de “coisas profundas”, enquanto João atribuía essas coisas a Satanás.
  rationale: O grego é sintaticamente compacto e permite mais de uma compreensão da intenção polêmica. A tradução preserva essa ambiguidade e sua tensão retórica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” evita regionalismo excessivo; “fardo” conserva a metáfora bíblica sem soar arcaico. A repetição de “a vocês, ... a todos os que” reflete a retomada explicativa do grego.
