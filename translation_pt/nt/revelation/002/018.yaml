reference: Revelation 2:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: pt
  text: 'E ao anjo[a] da igreja em Tiatira, escreva: “Assim diz o Filho de Deus, aquele que tem os olhos como chama de fogo e os pés semelhantes ao bronze polido[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”.
    reason: alternative_reading
  - marker: b
    text: O termo grego traduzido como “bronze polido” é raro e pode designar, de modo mais geral, um metal ou uma liga refinada e reluzente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: No contexto das mensagens às sete igrejas do Apocalipse, “anjo” é o sentido mais provável e tradicional; “mensageiro” continua sendo lexicalmente possível e é registrado em nota.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: Designa aqui a comunidade cristã local e é a forma natural e reconhecível em português moderno.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Preserva de modo natural e digno a fórmula solene de proclamação, sem exigir o mais rígido “Estas coisas diz”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Reproduz diretamente o título cristológico explícito do grego.
- source_word: ὁ ἔχων
  choice: aquele que tem
  rationale: Mantém a força identificadora do particípio substantivado e liga a descrição à identidade do falante.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: os olhos como chama de fogo
  rationale: Conserva a comparação e a imagem apocalíptica de forma concisa e próxima do grego.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: os pés semelhantes ao bronze polido
  rationale: “Bronze polido” comunica a aparência brilhante de um metal refinado, sem ocultar em nota a incerteza quanto ao termo grego raro.
theological_decisions:
- issue: Título cristológico na autoidentificação direta
  choice: o Filho de Deus
  alternative: nenhuma paráfrase funcional
  rationale: O texto identifica explicitamente o falante como Filho de Deus; a tradução preserva a formulação sem atenuá-la nem expandi-la doutrinariamente.
- issue: Referente de ἀγγέλῳ na mensagem a Tiatira
  choice: anjo
  alternative: mensageiro
  rationale: “Anjo” se ajusta ao contexto apocalíptico e à fórmula repetida das sete mensagens, mas a possível referência a um mensageiro humano permanece aberta na nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A fórmula “Assim diz” preserva o tom profético; as imagens permanecem concretas, e as ambiguidades lexicais relevantes são mantidas em notas.
