id: REV.2.17
reference: Revelation 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: pt
  text: Quem tem ouvidos, ouça o que o Espírito diz às igrejas. Ao que vencer[a], darei do maná escondido. Também lhe darei uma pedra branca[b], e sobre a pedra estará escrito um nome novo[c], que ninguém conhece, a não ser quem o recebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao que superar”.'
    reason: lexical_alternative
  - marker: b
    text: A “pedra branca” pode evocar um seixo de votação, um sinal de absolvição ou uma senha de entrada; o texto não especifica qual dessas associações está em vista.
    reason: cultural_note
  - marker: c
    text: 'Mais literalmente: “e, sobre a pedra, um nome novo escrito”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Quem tem ouvidos
  rationale: Embora o grego use o singular idiomático, a fórmula portuguesa consagrada e natural emprega o plural “ouvidos”, sem mudar o sentido universal da exortação.
- source_word: ἀκουσάτω
  choice: ouça
  rationale: O presente do subjuntivo com valor imperativo reproduz de modo natural e digno a força do imperativo grego.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Mantém a designação do texto grego sem explicitar “Santo”, embora o contexto identifique o Espírito divino.
- source_word: ταῖς ἐκκλησίαις
  choice: às igrejas
  rationale: “Igrejas” é a tradução corrente e contextualmente apropriada para as comunidades destinatárias do Apocalipse.
- source_word: τῷ νικῶντι
  choice: Ao que vencer
  rationale: Expressa de modo idiomático a pessoa que alcança vitória ou persevera vitoriosamente; a alternativa “superar” é registrada em nota.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: do maná escondido
  rationale: O genitivo depois de “darei” indica participação ou porção do maná, e “escondido” preserva o estado resultante do particípio perfeito.
- source_word: ψῆφον λευκήν
  choice: uma pedra branca
  rationale: Traduz o objeto sem decidir qual possível uso cultural da pequena pedra está em vista.
- source_word: ἐπὶ τὴν ψῆφον
  choice: sobre a pedra
  rationale: Representa claramente a localização da inscrição e evita um pronome potencialmente ambíguo.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: estará escrito um nome novo
  rationale: A construção portuguesa explicita naturalmente o estado da inscrição, preservando “nome novo” e o resultado duradouro do perfeito grego.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: que ninguém conhece, a não ser quem o recebe
  rationale: Mantém “conhece” no presente e conserva a ambiguidade contextual do referente recebido, sem acrescentar uma identificação que o grego não explicita.
theological_decisions:
- issue: Valor de τῷ νικῶντι
  choice: Ao que vencer
  alternative: Àquele que superar
  rationale: A opção escolhida preserva a imagem de vitória característica de νικάω no Apocalipse, sem especificar indevidamente o objeto ou o modo dessa vitória.
- issue: Identidade e simbolismo da ψῆφος λευκή
  choice: uma pedra branca
  alternative: uma pedra de absolvição, uma senha de entrada ou um seixo de votação
  rationale: O texto não explica a referência cultural precisa; a tradução mantém o símbolo aberto e transfere as principais propostas para a nota.
- issue: Referente de ὃ e do objeto implícito em ὁ λαμβάνων
  choice: Tratar a oração relativa como referente ao “nome” e traduzir o objeto recebido apenas por “o”
  alternative: Explicitar “quem recebe a pedra” ou “quem recebe o nome”
  rationale: O neutro ὃ concorda com ὄνομα, mas o objeto de “recebe” não aparece expresso. A tradução evita resolver além do texto se o recebimento se refere ao nome, à pedra ou ao conjunto simbólico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “Quem tem ouvidos, ouça” privilegia o uso bíblico natural em português. A segunda frase foi dividida para evitar encadeamento pesado, e “estará escrito” fornece uma estrutura verbal idiomática sem eliminar a relação estreita entre a pedra e o nome.
