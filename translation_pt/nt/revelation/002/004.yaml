  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: pt
  text: 'Mas tenho contra você o seguinte: você abandonou o seu primeiro amor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você deixou o seu primeiro amor”. A expressão pode se referir ao amor que tinham no princípio, seja pelo Senhor, uns pelos outros, ou por ambos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que marca forte contraste com o elogio anterior; “Mas” é natural e direto em português.
- source_word: ἔχω κατὰ σοῦ
  choice: tenho contra você o seguinte
  rationale: A construção idiomática expressa uma acusação ou queixa contra alguém. A formulação preserva a força de repreensão e prepara naturalmente a explicação que segue.
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo da queixa. Os dois-pontos representam essa função com clareza, sem impor a leitura causal de “porque”.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente direto e estabelecido de ἀγάπη, adequado ao contexto.
- source_word: τὴν πρώτην
  choice: primeiro
  rationale: Preserva a formulação concisa do grego e sua abertura entre o amor inicial, anterior ou prioritário, sem explicitar uma interpretação.
- source_word: ἀφῆκες
  choice: abandonou
  rationale: Neste contexto, ἀφίημι comunica deixar para trás ou abandonar. “Abandonou” transmite com naturalidade a seriedade da repreensão; “deixou” permanece uma alternativa possível.
theological_decisions:
- issue: Sentido de “seu primeiro amor”
  choice: Manter literalmente “seu primeiro amor”, sem identificar o objeto desse amor.
  alternative: “o amor que você tinha no princípio”, “seu amor inicial” ou “seu amor por mim no princípio”
  rationale: A expressão grega não especifica se se trata principalmente do amor pelo Senhor, pelos outros crentes ou de ambos. A tradução preserva essa abertura e a tensão interpretativa do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” corresponde ao destinatário singular representativo da igreja; a nota usa o plural “tinham” ao explicar a possível referência à comunidade.
