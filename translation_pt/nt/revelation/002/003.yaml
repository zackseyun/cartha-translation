id: REV.2.3
reference: Revelation 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: pt
  text: Você tem perseverança, suportou por causa do meu nome[a] e não se cansou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo meu nome” ou “por amor ao meu nome”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não ficou exausto”; o verbo também pode referir-se ao trabalho árduo, permitindo o sentido “não se fatigou no trabalho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: perseverança
  rationale: Expressa constância firme em meio a provações. Em português corrente, “perseverança” comunica melhor que uma paciência meramente passiva a continuidade elogiada no contexto.
- source_word: ἔχεις
  choice: você tem
  rationale: Mantém o presente e a forma direta da declaração dirigida ao destinatário singular.
- source_word: ἐβάστασας
  choice: suportou
  rationale: βαστάζω pode significar carregar ou suportar. Aqui, sem objeto expresso e no contexto de provação, “suportou” comunica naturalmente a ideia de aguentar dificuldades, sem repeti-la com o mesmo termo usado para ὑπομονή.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: διά com acusativo pode indicar causa ou finalidade. “Por causa do meu nome” é natural e preserva a associação das dificuldades com a lealdade ao nome de Jesus; outras nuances possíveis são registradas em nota.
- source_word: οὐ κεκοπίακες
  choice: não se cansou
  rationale: κοπιάω pode indicar cansar-se ou trabalhar arduamente. No paralelismo com perseverança e suportar, “não se cansou” expressa de modo claro a ideia de não sucumbir ao desgaste, enquanto a nota preserva a possível relação com trabalho árduo.
theological_decisions:
- issue: Alcance da linguagem de perseverança e sofrimento
  choice: O versículo elogia a perseverança contínua e o suportar de dificuldades por causa do nome de Jesus, sem especificar a natureza dessas dificuldades.
  alternative: 'A cláusula final pode ser entendida mais especificamente em relação ao trabalho árduo: “não se fatigou no trabalho”.'
  rationale: O contexto favorece resistência sob desgaste, mas o texto não define uma forma específica de perseguição, serviço ou trabalho; a tradução evita acrescentar essa especificidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação foi levemente simplificada em português, sem perder as três afirmações do grego. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
