  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: pt
  text: Assim, você também tem os que se apegam igualmente ao ensino dos nicolaítas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo semelhante” ou “do mesmo modo”. O grego pode destacar que eles se apegam a esse ensino de maneira comparável às pessoas mencionadas no versículo anterior.'
    reason: alternativa lexical e ambiguidade sintática
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Introduz a comparação com a repreensão do versículo anterior e preserva de modo natural a força comparativa ou inferencial do grego.
- source_word: ἔχεις
  choice: você tem
  rationale: Mantém a forma direta do verbo grego; no contexto, indica que essas pessoas se encontram no meio da comunidade.
- source_word: καὶ σὺ
  choice: você também
  rationale: 'Preserva a ênfase comparativa: a comunidade de Pérgamo também tem pessoas que seguem esse ensino.'
- source_word: κρατοῦντας
  choice: os que se apegam
  rationale: Expressa a ideia de sustentar ou manter firmemente um ensino, em linguagem atual e clara.
- source_word: διδαχὴν
  choice: ensino
  rationale: É uma tradução natural e acessível, menos técnica que “doutrina”, sem perder o sentido do conteúdo ensinado.
- source_word: Νικολαϊτῶν
  choice: nicolaítas
  rationale: Emprega a forma tradicional e reconhecível em português para o nome desse grupo.
- source_word: ὁμοίως
  choice: igualmente
  rationale: Conserva a força comparativa do advérbio e, por sua posição, permite relacioná-lo tanto ao modo de apego ao ensino quanto à comparação mais ampla com o versículo anterior.
theological_decisions:
- issue: Relação de ὁμοίως com a oração
  choice: “igualmente” junto de “se apegam”, sem explicar no texto principal exatamente qual é o termo de comparação
  alternative: “Do mesmo modo, você também tem...” ou “se apegam do mesmo modo...”
  rationale: A construção grega admite alguma incerteza quanto a o advérbio modificar diretamente o ato de se apegar ou retomar de forma mais ampla a situação descrita no versículo 14. A tradução mantém essa tensão em vez de fixar uma única relação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” conserva o destinatário singular do grego; “se apegam” comunica adesão persistente sem recorrer a vocabulário excessivamente técnico.
