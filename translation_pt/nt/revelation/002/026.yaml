id: REV.2.26
reference: Revelation 2:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: pt
  text: E ao que vencer e guardar até o fim as minhas obras, eu lhe darei autoridade sobre as nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As minhas obras” pode indicar obras que pertencem a Jesus ou estão de acordo com ele — seus atos, seus propósitos ou as obras que ele requer; o grego não especifica mais precisamente essa relação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ao que vencer
  rationale: O particípio substantivado descreve aquele que vence. “Vencer” conserva a imagem ativa de conflito recorrente em Apocalipse e soa natural em português.
- source_word: ὁ τηρῶν
  choice: guardar
  rationale: τηρέω pode significar guardar, observar ou cumprir. “Guardar” preserva a amplitude do termo sem reduzi-lo apenas a obedecer.
- source_word: ἄχρι τέλους
  choice: até o fim
  rationale: Expressão temporal direta que comunica perseverança até o ponto final.
- source_word: τὰ ἔργα μου
  choice: as minhas obras
  rationale: Mantém a formulação incomum e a relação genitiva não especificada pelo grego, sem explicá-la como mandamentos ou obras feitas para Jesus.
- source_word: δώσω αὐτῷ
  choice: eu lhe darei
  rationale: Reproduz o futuro de δίδωμι e o referente singular de αὐτῷ de modo idiomático em português.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa autoridade ou direito delegado para governar, mais precisamente do que o termo amplo “poder”.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: sobre as nações
  rationale: No contexto de Apocalipse, ἔθνη designa naturalmente as nações ou povos do mundo, e ἐπί com genitivo indica domínio sobre eles.
theological_decisions:
- issue: Linguagem masculina singular representativa
  choice: Manter “ao que” e “lhe” no singular no texto principal
  alternative: “à pessoa que” / construção plural inclusiva
  rationale: O grego emprega particípios e pronome no masculino singular de maneira representativa. A tradução conserva a forma singular sem afirmar exclusão das mulheres.
- issue: Sentido de “as minhas obras”
  choice: Preservar literalmente “as minhas obras”
  alternative: “as obras que exijo” / “o que ordenei”
  rationale: O texto não especifica se são obras realizadas por Jesus, pertencentes a ele, conformes ao seu exemplo ou requeridas por ele; preservar a expressão mantém essa ambiguidade teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A construção “ao que vencer” preserva o singular representativo e a linguagem tradicional sem recorrer a arcaísmos excessivos. A única nota explica a ambiguidade real de “minhas obras”; alternativas meramente sinonímicas foram resolvidas no texto principal.
