id: REV.2.6
reference: Revelation 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: pt
  text: 'Mas isto você tem: odeia as obras dos nicolaítas[a], as quais eu também odeio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ações» ou «práticas». O termo grego se refere ao que eles faziam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a repreensão anterior de modo conciso e natural.
- source_word: τοῦτο ἔχεις
  choice: você tem isto a seu favor
  rationale: Preserva o sentido de algo positivo que a comunidade ainda possui, enquanto a expressão «a seu favor» torna o idioma natural em português sem transformar a frase numa declaração de mérito.
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo de «isto» com clareza e naturalidade.
- source_word: μισεῖς
  choice: odeia
  rationale: Mantém a força direta de μισέω e permite repetir o mesmo verbo na fala de Jesus.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: É lexicalmente transparente e mantém as ações ou práticas, não as pessoas, como objeto do ódio.
- source_word: τῶν Νικολαϊτῶν
  choice: dos nicolaítas
  rationale: Emprega a transliteração tradicional e amplamente reconhecível em português.
- source_word: ἃ
  choice: as quais
  rationale: Retoma inequivocamente «as obras», evitando que a oração relativa pareça referir-se aos nicolaítas.
- source_word: κἀγὼ
  choice: eu também
  rationale: Expressa καὶ ἐγώ e preserva o alinhamento explícito do falante com a rejeição dessas obras.
- source_word: μισῶ
  choice: odeio
  rationale: Repete o verbo usado antes, como faz o grego, sem suavizar sua força.
theological_decisions:
- issue: Objeto do ódio
  choice: As obras dos nicolaítas são explicitamente o objeto do ódio.
  alternative: Uma formulação menos precisa poderia sugerir ódio aos próprios nicolaítas.
  rationale: τὰ ἔργα é o objeto direto, e o relativo neutro plural ἃ retoma essas obras. «As quais» conserva essa relação de forma inequívoca.
- issue: Alinhamento do falante com a igreja
  choice: «as quais eu também odeio»
  alternative: «que eu igualmente detesto»
  rationale: A formulação mantém a força de μισέω e a correspondência entre μισεῖς e μισῶ, apresentando Jesus como alguém que compartilha a rejeição dessas práticas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Você» dirige-se à comunidade de Éfeso coletivamente, conforme o singular do grego. A colocação «a seu favor» comunica o valor contextual de τοῦτο ἔχεις de maneira idiomática; «as quais» evita ambiguidade quanto ao antecedente.
