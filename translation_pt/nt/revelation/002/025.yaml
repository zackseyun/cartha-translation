  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: pt
  text: No entanto[a], conservem firmemente o que vocês têm, até que eu venha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Apenas conservem firmemente o que vocês têm, até que eu venha».'
    reason: Alternativa lexical para πλὴν, que pode introduzir uma restrição com o sentido de «apenas».
lexical_decisions:
- source_word: πλὴν
  choice: No entanto
  rationale: Expressa de modo natural a força adversativa ou restritiva que introduz uma ressalva após o contexto anterior, sem eliminar a possível nuance de «apenas».
- source_word: ὃ ἔχετε
  choice: ao que vocês têm
  rationale: Reproduz de forma idiomática o relativo neutro com ἔχετε e deixa em aberto o conteúdo exato daquilo que os destinatários possuem.
- source_word: κρατήσατε
  choice: apeguem-se firmemente
  rationale: Transmite a ordem de conservar com firmeza aquilo que já possuem; o plural concorda com os destinatários coletivos.
- source_word: ἄχρι οὗ ἂν
  choice: até que
  rationale: Marca naturalmente em português o limite temporal futuro da exortação.
- source_word: ἥξω
  choice: eu venha
  rationale: Comunica a vinda ou chegada do próprio falante e preserva a ressonância escatológica sem definir a natureza ou o momento dessa vinda.
theological_decisions:
- issue: Se a declaração de Jesus se refere especificamente à sua vinda escatológica final ou, de modo mais geral, à sua vinda em juízo ou visitação a essa igreja
  choice: até que eu venha
  alternative: até que eu venha em juízo; até a minha vinda final
  rationale: O grego não especifica a natureza nem o momento da vinda. A tradução mantém essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Apeguem-se firmemente» preserva a força exortativa sem recorrer ao pouco natural «reter firmemente»; «vocês» torna explícito o plural presente no imperativo grego.
