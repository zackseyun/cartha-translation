id: REV.2.2
reference: Revelation 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: pt
  text: Conheço as suas obras, o seu trabalho árduo e a sua perseverança, e sei que não pode tolerar pessoas más[a]. Pôs à prova os que se dizem apóstolos[b], mas não são, e constatou que são falsos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não consegue suportar pessoas más”. O verbo grego significa mais literalmente “suportar”, mas aqui tem o sentido de não as tolerar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que afirmam ser apóstolos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Conheço
  rationale: Expressa diretamente o estado presente de conhecimento e preserva a força pessoal e avaliativa da fala.
- source_word: τὰ ἔργα σου
  choice: as suas obras
  rationale: “Obras” mantém o sentido amplo de ações e atividades e corresponde bem ao uso joanino.
- source_word: τὸν κόπον
  choice: o seu trabalho árduo
  rationale: κόπος denota trabalho cansativo e esforço intenso; “trabalho árduo” comunica esse aspecto com naturalidade no português atual.
- source_word: τὴν ὑπομονήν σου
  choice: a sua perseverança
  rationale: No contexto, ὑπομονή indica persistência firme sob pressão; “perseverança” é clara, digna e corrente.
- source_word: οὐ δύνῃ βαστάσαι
  choice: não pode tolerar
  rationale: Embora βαστάζω tenha o sentido básico de “suportar” ou “carregar”, aqui a construção se refere à recusa ou incapacidade de admitir pessoas más; “tolerar” torna o sentido contextual claro.
- source_word: κακούς
  choice: pessoas más
  rationale: O adjetivo masculino plural é substantivado e se refere a pessoas. A formulação evita restringir sem necessidade o referente a homens.
- source_word: ἐπείρασας
  choice: pôs à prova
  rationale: Comunica o exame da autenticidade das alegações de autoridade apostólica e preserva a ideia de teste.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: os que se dizem apóstolos
  rationale: 'Preserva de modo natural a força reflexiva: essas pessoas atribuem a si mesmas o título.'
- source_word: ἀποστόλους
  choice: apóstolos
  rationale: Neste contexto eclesial, o termo provavelmente designa a função reconhecida de apóstolo, não apenas mensageiros em sentido genérico.
- source_word: ψευδεῖς
  choice: falsos
  rationale: Mantém o adjetivo predicativo grego e deixa aberta a nuance entre falsidade pessoal e falsidade da alegação apostólica, sem intensificá-lo automaticamente para “mentirosos”.
theological_decisions:
- issue: Sentido de ἀποστόλους
  choice: apóstolos
  alternative: mensageiros
  rationale: O contexto trata da verificação de pessoas que reivindicam autoridade nas igrejas. “Apóstolos” preserva o provável sentido técnico sem acrescentar uma teoria institucional posterior.
- issue: Referente de κακούς
  choice: pessoas más
  alternative: homens maus
  rationale: O masculino plural grego funciona substantivamente para pessoas; a tradução escolhida representa o referente sem transformar gênero gramatical em limitação semântica.
- issue: Natureza da falsidade indicada por ψευδεῖς
  choice: são falsos
  alternative: são mentirosos
  rationale: “Falsos” conserva a formulação adjetival e a tensão entre serem pessoas falsas e serem falsos pretendentes ao apostolado; “mentirosos” definiria mais precisamente a natureza moral da acusação do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento implícitas para manter boa legibilidade no Brasil sem recorrer a regionalismos marcados. A repetição de conjunções do grego foi parcialmente reorganizada em três frases para fluidez, sem alterar a sequência lógica. Os marcadores [a] e [b] aparecem junto às expressões a que suas notas se referem.
