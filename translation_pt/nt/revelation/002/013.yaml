id: REV.2.13
reference: Revelation 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: pt
  text: Sei onde você mora — onde está o trono de Satanás. Mesmo assim, você se apega firmemente ao meu nome e não negou a fé em mim[a], nem mesmo nos dias de Antipas, minha testemunha[b], aquele que me é fiel, que foi morto entre vocês, onde Satanás mora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “minha fé”. A expressão grega também pode ser entendida como “minha fidelidade”.
    reason: alternative_reading
  - marker: b
    text: Ou “meu mártir”. A palavra grega significa “testemunha”, mas, em um contexto de sofrimento e morte, também pode ter o sentido de “mártir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Sei
  rationale: O perfeito grego tem sentido presente; “sei” é direto, natural e fiel.
- source_word: κατοικεῖς
  choice: você mora
  rationale: κατοικέω indica morar ou habitar num lugar. “Mora” é corrente no português moderno.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: onde está o trono de Satanás
  rationale: Preserva sem explicação adicional a forte imagem apocalíptica e expressa naturalmente o genitivo.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: você se apega firmemente ao meu nome
  rationale: κρατέω comunica adesão firme; a formulação mantém “meu nome” e torna explícita em português a constância sugerida pelo verbo.
- source_word: οὐκ ἠρνήσω
  choice: não negou
  rationale: Equivalente direto do aoristo de ἀρνέομαι, sem acrescentar a nuance mais forte de renúncia formal.
- source_word: τὴν πίστιν μου
  choice: a fé em mim
  rationale: No contexto, expressa de modo natural a lealdade de fé dirigida a Cristo. A forma grega compacta admite outras relações do genitivo, preservadas em nota.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: nos dias de Antipas
  rationale: Reprodução clara e idiomática da expressão temporal, sem expansão interpretativa.
- source_word: ὁ μάρτυς μου
  choice: minha testemunha
  rationale: μάρτυς significa fundamentalmente “testemunha”. O possível sentido de “mártir”, especialmente neste contexto de morte, é registrado em nota.
- source_word: ὁ πιστός μου
  choice: meu fiel
  rationale: Mantém a expressão appositiva separada e evita acrescentar “servo” ou fundi-la silenciosamente com “testemunha”.
- source_word: ἀπεκτάνθη
  choice: foi morto
  rationale: Tradução direta da forma passiva de ἀποκτείνω, sem acrescentar a qualificação jurídica de assassinato.
- source_word: παρ’ ὑμῖν
  choice: entre vocês
  rationale: παρά com dativo aqui indica presença ou localização no meio da comunidade; não implica que ela tenha matado Antipas.
theological_decisions:
- issue: Sentido de τὴν πίστιν μου
  choice: a fé em mim
  alternative: “minha fé” ou “minha fidelidade”
  rationale: O genitivo μου é semanticamente compacto e pode indicar o objeto da fé, posse ou fidelidade atribuída a Cristo. O texto principal adota a leitura contextualmente natural, enquanto a nota preserva a ambiguidade real.
- issue: Sentido de μάρτυς no contexto da morte de Antipas
  choice: testemunha
  alternative: mártir
  rationale: “Testemunha” preserva o sentido lexical básico; “mártir” é contextualmente possível, mas pode soar como um título técnico posterior e, por isso, fica na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular “você” corresponde ao destinatário singular do verbo grego. O travessão conserva a ênfase da localização do trono de Satanás. A expressão deliberadamente incomum “meu fiel” preserva a aposição do original sem acrescentar “servo” nem eliminar sua estrutura.
