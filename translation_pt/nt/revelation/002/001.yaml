id: REV.2.1
reference: Revelation 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: pt
  text: 'Ao anjo[a] da igreja em Éfeso, escreva: Assim diz aquele que segura as sete estrelas na mão direita e que anda entre os sete candelabros de ouro:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”.
    reason: Preservar a ambiguidade lexical e interpretativa de ἀγγέλῳ.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anjo
  rationale: O termo pode designar um anjo celestial ou um mensageiro humano. “Anjo” preserva melhor o cenário apocalíptico e o uso tradicional; a alternativa é mantida em nota.
- source_word: ἐκκλησίας
  choice: igreja
  rationale: Neste contexto de comunidade cristã, “igreja” é a forma natural e consagrada em português.
- source_word: γράψον
  choice: escreva
  rationale: Reproduz com clareza o imperativo aoristo dirigido a João, em registro moderno e digno.
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Mantém o tom solene e profético da fórmula grega de introdução.
- source_word: κρατῶν
  choice: segura
  rationale: Expressa posse firme e controle sem acrescentar uma intensidade não explicitada no texto.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: na mão direita
  rationale: Preserva a imagem concreta e seu possível valor simbólico de autoridade e proteção.
- source_word: περιπατῶν ἐν μέσῳ
  choice: anda entre
  rationale: Formulação natural em português que conserva a imagem vívida de movimento no meio dos candelabros.
- source_word: λυχνιῶν
  choice: candelabros
  rationale: Refere-se aos suportes de lâmpadas, não às próprias lâmpadas; “candelabros” é uma tradução bíblica clara e reconhecível em português.
- source_word: χρυσῶν
  choice: de ouro
  rationale: Expressa de modo natural em português o material indicado pelo adjetivo grego.
theological_decisions:
- issue: Referente de “o anjo da igreja”
  choice: Manter “anjo” no texto principal
  alternative: mensageiro
  rationale: Ἄγγελος admite ambas as interpretações. O gênero apocalíptico favorece “anjo”, mas a identidade do referente continua debatida; por isso, a alternativa é preservada em nota sem resolver a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo “escreva” evita solenidade artificial, enquanto “Assim diz” preserva o tom profético. A pontuação mantém os dois particípios gregos coordenados como descrições daquele que fala.
