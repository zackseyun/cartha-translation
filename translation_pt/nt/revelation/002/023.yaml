id: REV.2.23
reference: Revelation 2:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: pt
  text: E matarei os filhos dela com a morte[a], e todas as igrejas saberão que eu sou aquele que sonda os rins e os corações[b], e darei a cada um de vocês segundo as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com peste”. O grego diz literalmente “com a morte”, expressão que pode intensificar o juízo ou retomar a linguagem de juízo do Antigo Testamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “rins e corações”, expressão bíblica que se refere ao íntimo da pessoa, incluindo motivos, pensamentos e desejos.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: É o equivalente natural de τέκνα e mantém em aberto se a referência é literal ou figurada, isto é, aos seguidores dela.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: matarei ... com a morte
  rationale: Preserva a formulação enfática e incomum do grego, bem como sua possível ressonância com a linguagem veterotestamentária de juízo; a interpretação por 'peste' fica na nota.
- source_word: ἐκκλησίαι
  choice: igrejas
  rationale: Designa adequadamente as comunidades cristãs no contexto de Apocalipse e é a forma corrente em português.
- source_word: ὁ ἐραυνῶν
  choice: aquele que sonda
  rationale: '''Sondar'' exprime uma investigação profunda e contínua, apropriada ao tom solene e judicial do particípio substantivado.'
- source_word: νεφροὺς καὶ καρδίας
  choice: os rins e os corações
  rationale: Mantém a ordem e a imagem antropológica bíblica do original; uma nota explica ao leitor moderno que se trata da interioridade, incluindo motivos, pensamentos e desejos.
- source_word: δώσω ὑμῖν ἑκάστῳ
  choice: darei a cada um de vocês
  rationale: Reproduz o verbo simples 'dar' e o sentido distributivo de ἑκάστῳ dentro do grupo indicado por ὑμῖν.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: segundo as suas obras
  rationale: Mantém a fórmula bíblica de retribuição e o equivalente tradicional e transparente de ἔργα.
theological_decisions:
- issue: Identidade do que sonda a interioridade humana
  choice: 'Manter a autoidentificação em primeira pessoa: ''eu sou aquele que sonda os rins e os corações''.'
  alternative: Atenuar para uma paráfrase como 'eu conheço os pensamentos e sentimentos'.
  rationale: O grego atribui ao Cristo ressuscitado conhecimento judicial penetrante; a tradução preserva esse peso teológico sem explicá-lo além do texto.
- issue: Sentido de 'os filhos dela'
  choice: Preservar a expressão sem definir se são filhos biológicos ou seguidores.
  alternative: Traduzir explicitamente por 'seguidores' ou interpretar como filhos biológicos.
  rationale: O contexto admite sentido figurado, mas o substantivo grego não obriga a resolver essa ambiguidade.
- issue: Sentido de 'com a morte'
  choice: Preservar no texto a expressão incomum e explicar a possibilidade de 'peste' em nota.
  alternative: Adotar diretamente 'com peste'.
  rationale: A tradução literal conserva a intensidade e a alusão bíblica, enquanto a nota registra uma interpretação lexical contextual plausível sem torná-la exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se deliberadamente a expressão marcada 'com a morte' e a imagem bíblica 'rins e corações', ambas esclarecidas por notas. 'Vocês' representa naturalmente o plural ὑμῖν, enquanto 'suas obras' retoma o mesmo grupo sem ambiguidade relevante.
