id: REV.2.20
reference: Revelation 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my slaves to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: pt
  text: 'Mas tenho isto contra você: você tolera a mulher Jezabel[a], que chama a si mesma de profetisa[b], e ensina e engana[c] os meus escravos, levando-os a praticar imoralidade sexual e a comer alimentos sacrificados a ídolos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «tua mulher Jezabel» em vez de «a mulher Jezabel».
    reason: textual_variant
  - marker: b
    text: 'Ou: «que afirma ser profetisa».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «desencaminha».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Introduz de modo natural o forte contraste com o elogio anterior.
- source_word: ἔχω κατὰ σοῦ
  choice: tenho isto contra você
  rationale: Expressa em português corrente a ideia idiomática de acusação ou queixa.
- source_word: ἀφεῖς
  choice: você tolera
  rationale: No contexto, indica permitir de forma culpável que uma prática nociva continue.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: a mulher Jezabel
  rationale: Preserva a leitura do texto principal sem incorporar a variante textual «tua mulher Jezabel».
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: que chama a si mesma de profetisa
  rationale: Mantém tanto o caráter autodeclarado da condição quanto o substantivo feminino explícito no grego.
- source_word: διδάσκει καὶ πλανᾷ
  choice: ensina e engana
  rationale: Conserva os dois verbos coordenados; «engana» comunica claramente a ação de induzir ao erro, enquanto a nota registra a nuance de desencaminhar.
- source_word: τοὺς ἐμοὺς δούλους
  choice: os meus escravos
  rationale: Preserva a força de pertencimento e sujeição de δοῦλος, salientada pelo possessivo «meus», sem suavizá-la para «servos».
- source_word: πορνεῦσαι
  choice: levando-os a praticar imoralidade sexual
  rationale: A construção com «levando-os a» torna natural em português o resultado dos verbos anteriores, e «imoralidade sexual» expressa a amplitude de πορνεύω.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: a comer alimentos sacrificados a ídolos
  rationale: Forma clara e idiomática para alimentos ligados a sacrifícios idólatras.
theological_decisions:
- issue: Identidade de «Jezabel»
  choice: Manter «Jezabel» sem definir se é nome pessoal literal ou designação simbólica.
  alternative: Explicitar que se trata de uma mulher literalmente chamada Jezabel ou de um título alusivo à Jezabel do Antigo Testamento.
  rationale: O versículo não resolve a identidade da figura; a tradução preserva essa ambiguidade.
- issue: Sentido de δοῦλος
  choice: os meus escravos
  alternative: os meus servos
  rationale: O possessivo destaca pertencimento a Cristo, tornando apropriado conservar a força social e teológica de «escravos».
- issue: Relação entre ensino, engano e as práticas condenadas
  choice: Usar «levando-os a» para ligar as ações de ensinar e enganar às práticas resultantes.
  alternative: 'Traduzir de modo mais formal e menos idiomático: «ensina e engana os meus escravos a praticarem...»'
  rationale: A formulação escolhida preserva a relação causal expressa pelos infinitivos sem criar uma construção pouco natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. O tratamento «você» explicita o singular de σοῦ e mantém leitura corrente.
