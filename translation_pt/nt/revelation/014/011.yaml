  source_fidelity: A tradução preserva adequadamente as imagens e os termos centrais do grego. Contudo, em português, «do nome dela» tende a retomar a antecedente feminina mais próxima («imagem»), enquanto αὐτοῦ, no grego, é masculino e retoma «a besta». Além disso, a reprodução literal de «e, se alguém recebe» deixa uma oração condicional sem conclusão sintática em português.
  naturalness: «E, se alguém recebe...» ao fim da frase é excessivamente truncado em português atual e resulta em construção incompleta. É possível refletir a mudança abrupta do grego por meio de nota, sem manter uma frase portuguesa agramatical.
  terminology: «Fumaça», «tormento», «para todo o sempre», «descanso», «besta», «imagem» e «marca» são escolhas adequadas, claras e consistentes com o registro de Apocalipse. «Nome da besta» elimina uma ambiguidade pronominal introduzida pelo português.
