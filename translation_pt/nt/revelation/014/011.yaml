id: REV.14.11
reference: Revelation 14:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: pt
  text: E a fumaça do tormento deles sobe para todo o sempre[a], e eles não têm descanso nem de dia nem de noite — os que adoram a besta e a sua imagem, e todo aquele que recebe a marca do nome da besta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “pelos séculos dos séculos”.'
    reason: lexical_alternative
  - marker: b
    text: O grego termina de modo abrupto com “e, se alguém recebe a marca do nome dele”, provavelmente ampliando a descrição dos que estão sob juízo. A tradução regulariza a frase como “e todo aquele que recebe”.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: fumaça
  rationale: Equivalente concreto e natural, preservando sem expansão a imagem apocalíptica.
- source_word: βασανισμοῦ
  choice: tormento
  rationale: Expressa sofrimento doloroso no contexto de juízo sem especificar indevidamente o método, como faria “tortura”.
- source_word: εἰς αἰῶνας αἰώνων
  choice: para todo o sempre
  rationale: Expressão portuguesa idiomática que comunica a força duradoura da fórmula apocalíptica; a forma mais literal é registrada em nota.
- source_word: ἀναβαίνει
  choice: sobe
  rationale: Preserva o presente vívido e a imagem contínua da fumaça que se eleva.
- source_word: ἀνάπαυσιν
  choice: descanso
  rationale: Equivalente direto, mantendo a ligação lexical com repouso sem interpretar como simples alívio temporário.
- source_word: ἡμέρας καὶ νυκτός
  choice: nem de dia nem de noite
  rationale: Na construção negativa, esta formulação portuguesa expressa de modo natural a ausência contínua de descanso.
- source_word: προσκυνοῦντες
  choice: adoram
  rationale: Em Apocalipse, o verbo denota homenagem cultual e lealdade religiosa, adequadamente expressas por “adoram”.
- source_word: θηρίον
  choice: besta
  rationale: Termo consagrado e preciso para esta figura da imagética apocalíptica.
- source_word: εἰκόνα
  choice: imagem
  rationale: Equivalente amplo e direto, sem restringir o referente a uma estátua.
- source_word: εἴ τις λαμβάνει
  choice: se alguém recebe
  rationale: Segue de perto a mudança abrupta do particípio plural para a condição indefinida singular, preservando uma irregularidade real do grego.
- source_word: χάραγμα
  choice: marca
  rationale: Equivalente padrão e suficientemente amplo para o sinal identificador em Apocalipse.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: do nome dela
  rationale: Preserva a construção genitiva grega; “dela” retoma naturalmente “a besta” em português.
theological_decisions:
- issue: Duração do juízo em εἰς αἰῶνας αἰώνων
  choice: para todo o sempre
  alternative: pelos séculos dos séculos
  rationale: A fórmula em Apocalipse comunica a expressão mais forte de duração contínua. A tradução mantém essa força, enquanto a nota conserva a transparência formal sem impor uma elaboração doutrinária além do texto.
- issue: Sintaxe e referente da cláusula final
  choice: os que adoram... e, se alguém recebe...
  alternative: os que adoram... e quem recebe...
  rationale: O grego passa abruptamente de uma descrição participial no plural para uma construção condicional indefinida no singular. A tradução conserva essa tensão sintática, e a nota explica a forma em vez de a harmonizar silenciosamente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. O travessão sinaliza que “os que adoram...” identifica aqueles que não têm descanso, enquanto a vírgula após “e” ajuda a tornar legível a mudança sintática abrupta preservada na cláusula final.
