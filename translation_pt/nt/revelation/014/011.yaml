  - severity: medium
    issue: Oração final condicional sintaticamente incompleta em português.
    rationale: Embora o grego apresente uma mudança abrupta para εἴ τις λαμβάνει, «e, se alguém recebe...» fica sem apódose em português. Uma coordenação com «todo aquele que recebe» torna o versículo legível; a nota conserva e explica a forma abrupta do grego.
