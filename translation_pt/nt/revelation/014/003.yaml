id: REV.14.3
reference: Revelation 14:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: pt
  text: E eles cantam como que um cântico novo diante do trono e diante dos quatro seres vivos e dos anciãos.[a] Ninguém conseguia aprender o cântico, a não ser os cento e quarenta e quatro mil, os que foram comprados da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um cântico novo” ou “algo que parecia um cântico novo”. O grego emprega linguagem de comparação ou percepção comum nas visões de Apocalipse.
    reason: lexical_alternative
  - marker: b
    text: Ou “resgatados da terra”. O verbo grego significa literalmente “comprar”.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: cantam
  rationale: O presente do indicativo é mantido como presente vívido, natural na narração visionária de Apocalipse.
- source_word: ὡς ᾠδὴν καινὴν
  choice: como que um cântico novo
  rationale: “Como que” preserva o valor comparativo ou perceptivo de ὡς sem afirmar que o cântico apenas parecia novo; “cântico novo” é uma expressão bíblica clara e digna.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente conciso e natural que conserva a ideia espacial de estar na presença do trono e dos seres da corte celestial.
- source_word: τῶν τεσσάρων ζῴων
  choice: dos quatro seres vivos
  rationale: No contexto de Apocalipse, ζῷα designa os seres celestiais ao redor do trono; “seres vivos” evita a conotação de animais comuns.
- source_word: τῶν πρεσβυτέρων
  choice: dos anciãos
  rationale: “Anciãos” funciona como designação reconhecível desse grupo na corte celestial e preserva o uso substantivado do grego.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: ninguém conseguia aprender
  rationale: O imperfeito ἐδύνατο é expresso naturalmente por “conseguia”, mantendo a capacidade continuada no cenário narrado.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Depois da negação, a expressão tem força exceptiva; “a não ser” é idiomático e claro em português.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: os cento e quarenta e quatro mil
  rationale: O número é escrito por extenso para fluidez literária, e o artigo definido é preservado.
- source_word: οἱ ἠγορασμένοι
  choice: os que foram comprados
  rationale: Mantém diretamente a metáfora comercial de ἀγοράζω, sem substituí-la no texto principal pelo termo teologicamente mais interpretativo “resgatados”.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Tradução direta e deliberadamente aberta de ἀπό com γῆ, preservando a concisão e a possível ideia de procedência ou separação.
theological_decisions:
- issue: Valor de ὡς na descrição visionária
  choice: “como que um cântico novo”
  alternative: “como um cântico novo” ou “algo que parecia um cântico novo”
  rationale: A formulação conserva a linguagem de percepção ou comparação típica das visões de Apocalipse sem decidir que o cântico não era realmente novo.
- issue: Sentido de οἱ ἠγορασμένοι
  choice: “os que foram comprados”
  alternative: “os que foram resgatados”
  rationale: O texto emprega explicitamente a linguagem de compra. “Resgatados” comunica uma implicação teológica plausível, mas reduz a metáfora lexical e por isso fica na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Como que” conserva a nuance visionária sem soar excessivamente técnica; “seres vivos” distingue as figuras celestiais de animais comuns. A repetição de “diante” foi evitada em português porque a coordenação comunica naturalmente que os três grupos compartilham a mesma relação preposicional, sem perda de sentido.
