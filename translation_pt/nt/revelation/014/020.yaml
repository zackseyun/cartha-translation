id: REV.14.20
reference: Revelation 14:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: pt
  text: E o lagar foi pisado fora da cidade, e do lagar saiu sangue até a altura dos freios dos cavalos, por mil e seiscentos estádios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um estádio era uma antiga unidade de distância; mil e seiscentos estádios correspondem a cerca de 296 quilômetros.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπατήθη
  choice: foi pisado
  rationale: O passivo de πατέω indica que o lagar foi pisado. A formulação preserva tanto a ação literal quanto a imagem tradicional do processamento das uvas.
- source_word: ληνός / ληνοῦ
  choice: lagar
  rationale: Termo português corrente na linguagem bíblica para a instalação onde uvas são pisadas ou prensadas; conserva a imagem apocalíptica da vindima e do juízo.
- source_word: ἔξωθεν τῆς πόλεως
  choice: fora da cidade
  rationale: Expressão espacial direta, natural em português e próxima da forma grega.
- source_word: ἐξῆλθεν αἷμα
  choice: saiu sangue
  rationale: Traduz diretamente ἐξέρχομαι sem acrescentar ao verbo a noção contextualmente plausível, mas não explícita, de fluir.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: até a altura dos freios dos cavalos
  rationale: Explicita de modo natural em português a extensão vertical sugerida pela imagem, sem alterar seu caráter vívido.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: por mil e seiscentos estádios
  rationale: Mantém a antiga unidade de distância e expressa a extensão espacial indicada pela construção grega, evitando uma conversão excessivamente precisa no texto principal.
theological_decisions:
- issue: Preservar ou explicar a imagem apocalíptica hiperbólica
  choice: Manter concretamente o sangue, os freios dos cavalos e os mil e seiscentos estádios.
  alternative: Parafrasear a cena como símbolo de um juízo esmagador.
  rationale: O texto apresenta deliberadamente uma imagem gráfica. A tradução deve conservar sua força e sua abertura simbólica, sem resolver no próprio versículo o modo de interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lagar” preserva o vocabulário bíblico estabelecido; “até a altura” torna clara a dimensão vertical da imagem. A alternativa “do lagar fluiu sangue” é possível pelo contexto, mas o texto principal segue mais de perto o verbo grego “sair”.
