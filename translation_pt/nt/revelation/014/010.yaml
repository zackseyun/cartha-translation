id: REV.14.10
reference: Revelation 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: pt
  text: ele também beberá do vinho do furor de Deus, preparado sem diluição[a] no cálice da sua ira, e será atormentado com fogo e enxofre diante dos santos anjos e diante do Cordeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega combina as ideias de vinho preparado ou misturado e de vinho não diluído, isto é, servido em toda a sua força.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: ele também
  rationale: O pronome é enfático e retoma a pessoa mencionada no contexto anterior; “ele também” preserva de modo natural tanto a referência pessoal quanto a ideia aditiva.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: beberá do vinho
  rationale: A forma futura é expressa naturalmente por “beberá”, e “do vinho” reproduz de maneira idiomática o valor de ἐκ na imagem de beber dessa porção ou fonte.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: do furor de Deus
  rationale: Em contexto de juízo, θυμός indica ira intensa. “Furor” mantém essa força e permite distingui-lo de ὀργή mais adiante.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: preparado sem diluição
  rationale: A expressão reúne a ideia de vinho preparado ou misturado com a de vinho não diluído. Esta formulação comunica que o vinho foi preparado, mas não enfraquecido, sem produzir em português uma contradição desnecessariamente opaca.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: no cálice da sua ira
  rationale: “No cálice” preserva o valor locativo normal de ἐν e a imagem bíblica do cálice pertencente à ira de Deus.
- source_word: βασανισθήσεται
  choice: será atormentado
  rationale: O futuro passivo descreve sofrimento punitivo intenso; “será atormentado” é claro, atual e não enfraquece o termo.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: com fogo e enxofre
  rationale: “Enxofre” é o equivalente moderno e direto de θεῖον; “com” expressa naturalmente o meio ou âmbito do tormento.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: diante dos santos anjos e diante do Cordeiro
  rationale: A repetição de “diante” preserva a repetição enfática de ἐνώπιον, e o artigo em português apresenta os anjos santos como o grupo celestial conhecido no contexto.
theological_decisions:
- issue: Distinção entre θυμός e ὀργή no mesmo versículo
  choice: Traduzir θυμός por “furor” e ὀργή por “ira”
  alternative: Traduzir ambos por “ira”
  rationale: Os dois termos relacionados aparecem muito próximos. Manter alguma distinção lexical respeita a força retórica do grego sem impor uma diferença técnica rígida.
- issue: Força da expressão τοῦ κεκερασμένου ἀκράτου
  choice: “preparado sem diluição”
  alternative: “misturado puro” ou “misturado sem diluição”
  rationale: A expressão deliberadamente combina preparação ou mistura com ausência de diluição, salientando o juízo em plena força. A tradução mantém os dois componentes sem resolver a tensão por meio de uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Furor” e “ira” preservam a distinção entre os dois termos gregos de juízo; “Cordeiro” conserva a designação cristológica tradicional e transparente.
