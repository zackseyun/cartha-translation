  to: 'E outro anjo saiu do altar, aquele que tem autoridade sobre o fogo, e clamou em alta voz ao que tinha a foice afiada: “Envia a tua foice afiada[a] e colhe os cachos da videira da terra[b], pois as suas uvas estão maduras.”'
