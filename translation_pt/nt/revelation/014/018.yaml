  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: pt
  text: 'E outro anjo saiu do altar, aquele que tem autoridade sobre o fogo, e clamou em alta voz ao que tinha a foice afiada: “Envia a tua foice afiada[a] e colhe os cachos da videira da terra[b], pois as suas uvas estão maduras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mete a tua foice afiada”. O verbo grego significa literalmente “enviar”, mas, nesta imagem de colheita, pode ser expresso de modo idiomático como “meter a foice”.'
    reason: lexical_alternative
  - marker: b
    text: “A videira da terra” é uma imagem apocalíptica. O texto não identifica expressamente seu referente neste ponto, embora o contexto ao redor seja de juízo.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: outro anjo
  rationale: Em cenas visionárias de Apocalipse, ἄγγελος normalmente designa um ser angelical; ἄλλος mantém a sequência narrativa.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: saiu do altar
  rationale: Preserva o movimento de procedência indicado por ἐκ e traduz θυσιαστήριον pelo termo corrente e preciso “altar”.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: aquele que tem autoridade sobre o fogo
  rationale: Mantém o particípio presente como descrição identificadora e expressa ἐξουσία como autoridade, sem definir além do texto a natureza desse domínio.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: Expressão digna e natural em português bíblico contemporâneo, preservando explicitamente φωνή e a intensidade de μεγάλῃ.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: ao que tinha a foice afiada
  rationale: A forma narrativa “tinha” identifica naturalmente o destinatário; “foice afiada” traduz os dois elementos e permite conservar sua repetição enfática.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Lança a tua foice afiada
  rationale: “Lança” conserva o sentido básico de enviar ou fazer avançar expresso por πέμπω e é inteligível na imagem da colheita; a nota registra uma alternativa idiomática.
- source_word: τρύγησον τοὺς βότρυας
  choice: colhe os cachos
  rationale: τρυγάω se refere especificamente à colheita de uvas, e βότρυες são cachos; a combinação é clara e natural em português.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: da videira da terra
  rationale: Conserva a cadeia de genitivos e a imagem apocalíptica sem identificar de modo interpretativo o referente da videira.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: as suas uvas amadureceram
  rationale: O perfeito é representado por uma ação concluída com resultado presente; “amadureceram” comunica que as uvas atingiram o ponto da colheita sem acrescentar “completamente”.
theological_decisions:
- issue: Identidade da “videira da terra” na metáfora apocalíptica
  choice: Manter literalmente “a videira da terra” no texto principal.
  alternative: Explicitar a videira como a humanidade ímpia ou como os habitantes da terra.
  rationale: Embora o contexto seguinte seja de juízo, o versículo apresenta a imagem sem identificar expressamente seu referente. A tradução preserva essa tensão e deixa a explicação contextual para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição de “foice afiada”, a metáfora vitícola e a estrutura visionária, evitando tanto arcaísmos desnecessários quanto explicitação doutrinária no texto principal.
