  naturalness: «Envia a tua foice afiada» é compreensível em registro bíblico moderno e é apoiado pela nota idiomática. «As suas uvas estão maduras» é natural e evita a leve mudança aspectual de «amadureceram».
  terminology: «Altar», «autoridade», «fogo», «foice», «videira», «cachos» e «juízo» são adequados. «Videira da terra» preserva corretamente a construção e a indeterminação apocalíptica, sem impor uma identificação teológica.
