id: REV.14.6
reference: Revelation 14:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: pt
  text: E vi outro anjo voando no meio do céu[a], tendo um evangelho eterno para anunciar aos que habitam sobre a terra[b], e a cada nação, tribo, língua e povo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no alto do céu” ou “em pleno céu”; o termo grego é uma expressão apocalíptica característica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos que estão sentados sobre a terra”; em Apocalipse, a expressão funciona idiomaticamente para os habitantes da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: outro anjo
  rationale: Preserva a sequência narrativa e, no contexto apocalíptico de Apocalipse, identifica naturalmente um ser angelical celestial.
- source_word: πετόμενον
  choice: voando
  rationale: O particípio presente retrata o anjo em movimento; esta é a forma direta e natural em português.
- source_word: ἐν μεσουρανήματι
  choice: no meio do céu
  rationale: Expressa de modo claro a região central ou elevada do céu visível, preservando a imagem apocalíptica sem recorrer ao pouco corrente 'meio-céu'.
- source_word: ἔχοντα
  choice: tendo
  rationale: Reproduz diretamente o particípio, sem especificar indevidamente se o evangelho era segurado como objeto ou possuído como mensagem.
- source_word: εὐαγγέλιον αἰώνιον
  choice: um evangelho eterno
  rationale: Mantém a ressonância cristã de εὐαγγέλιον, traduz αἰώνιον de forma direta e não torna definida uma expressão grega sem artigo.
- source_word: εὐαγγελίσαι
  choice: para anunciar
  rationale: Explicita naturalmente a ideia de finalidade do infinitivo e evita a repetição artificial de 'evangelho' e 'evangelizar'.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: aos que habitam sobre a terra
  rationale: Comunica o valor idiomático da expressão para os habitantes da terra, enquanto 'sobre a terra' conserva algo da formulação espacial recorrente no livro.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: cada nação, tribo, língua e povo
  rationale: '''Cada'' distribui o alcance de πᾶν por toda a fórmula e a enumeração mantém seu ritmo universal sem repetir conjunções de modo pouco natural em português.'
theological_decisions:
- issue: Caráter definido ou indefinido de εὐαγγέλιον αἰώνιον
  choice: um evangelho eterno
  alternative: o evangelho eterno / as boas-novas eternas
  rationale: A expressão grega não tem artigo. A opção escolhida preserva essa indefinição formal e a ressonância canônica de 'evangelho', sem impor uma identificação doutrinária além do texto.
- issue: Sentido da expressão τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: aos que habitam sobre a terra
  alternative: aos que estão sentados sobre a terra / aos que vivem na terra
  rationale: Embora καθημένους signifique literalmente 'sentados', a expressão funciona em Apocalipse como designação dos habitantes da terra. A tradução evita uma imagem postural enganosa sem apagar a fórmula apocalíptica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a coordenação do grego e a vírgula final indica que a frase continua no versículo seguinte.
