id: REV.14.12
reference: Revelation 14:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: pt
  text: Aqui está a perseverança dos santos, os que guardam os mandamentos de Deus e a fé de Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fé em Jesus”; alternativamente, “a fidelidade de Jesus”. A expressão grega é ambígua.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Aqui está
  rationale: A expressão dêitica introduz onde ou em que situação se evidencia a perseverança; “Aqui está” preserva a força retórica e soa natural em português.
- source_word: ὑπομονὴ
  choice: perseverança
  rationale: Denota constância firme em meio à provação. “Perseverança” é corrente, digna e comunica melhor a persistência ativa do que uma mera espera paciente.
- source_word: ἁγίων
  choice: santos
  rationale: É a designação neotestamentária tradicional e reconhecível para o povo santo de Deus, sem implicar aqui uma classe especial de cristãos.
- source_word: τηροῦντες
  choice: guardam
  rationale: No contexto, refere-se a observar fielmente os mandamentos. “Guardam” conserva tanto a ideia de obediência quanto a de preservação cuidadosa.
- source_word: ἐντολὰς
  choice: mandamentos
  rationale: Expressa ordens divinas e mantém a ressonância bíblica habitual da expressão “mandamentos de Deus”.
- source_word: πίστιν
  choice: fé
  rationale: Mantém o valor lexical central de πίστις e evita resolver antecipadamente se a construção indica fé dirigida a Jesus ou fidelidade associada a ele.
- source_word: Ἰησοῦ
  choice: de Jesus
  rationale: Representa diretamente o genitivo grego e preserva na linha principal sua ambiguidade, explicada na nota.
theological_decisions:
- issue: Sentido de τὴν πίστιν Ἰησοῦ
  choice: a fé de Jesus
  alternative: a fé em Jesus; a fidelidade de Jesus
  rationale: 'O genitivo grego admite mais de uma relação semântica: fé dirigida a Jesus ou fé/fidelidade pertencente ou associada a Jesus. A tradução principal permanece formalmente próxima do grego e a nota registra as leituras interpretativas.'
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com legibilidade brasileira. A vírgula mantém a construção apositiva do grego. O marcador foi colocado após “santos”, acompanhando o ponto em que a continuação explicativa culmina na expressão ambígua.
