id: REV.14.14
reference: Revelation 14:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: pt
  text: Olhei, e eis uma nuvem branca; sentado sobre a nuvem estava alguém semelhante a um filho de homem[a], com uma coroa de ouro[b] na cabeça e uma foice afiada na mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém semelhante ao Filho do Homem”. A expressão faz eco a Daniel 7:13 e é comumente entendida como um título messiânico, embora aqui o grego não use artigo: “semelhante a um filho de homem”.'
    reason: alternative_reading
  - marker: b
    text: A palavra grega traduzida por “coroa” é stéphanos, que muitas vezes designa a coroa ou grinalda concedida ao vencedor, e não um diadema real.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis
  rationale: Preserva a força vívida do recurso que chama a atenção para uma nova cena na visão. Embora tenha tom levemente elevado, é claro e apropriado ao contexto apocalíptico.
- source_word: νεφέλη λευκή
  choice: uma nuvem branca
  rationale: Traduz diretamente o substantivo e o adjetivo, mantendo a cor e sua possível ressonância simbólica sem ampliá-la interpretativamente para “luminosa”.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: sentado sobre a nuvem
  rationale: Expressão natural e digna em português que conserva a posição indicada pelo particípio grego.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: alguém semelhante a um filho de homem
  rationale: “Alguém semelhante” expressa ὅμοιον de modo natural. Como a expressão grega não traz artigo antes de υἱὸν, “um filho de homem” preserva sua forma indefinida e a alusão a Daniel 7:13 sem convertê-la silenciosamente em título explícito.
- source_word: στέφανον χρυσοῦν
  choice: uma coroa de ouro
  rationale: É uma tradução clara e natural. A possível nuance de στέφανος como coroa ou grinalda de vencedor é registrada em nota, sem sobrecarregar o texto principal.
- source_word: δρέπανον ὀξύ
  choice: uma foice afiada
  rationale: Tradução comum e transparente, adequada à imagem da colheita no contexto imediato.
theological_decisions:
- issue: Se υἱὸν ἀνθρώπου deve ser traduzido como título cristológico explícito
  choice: alguém semelhante a um filho de homem
  alternative: alguém semelhante ao Filho do Homem
  rationale: A ausência de artigo no grego favorece a forma indefinida no texto principal. A forte alusão a Daniel 7:13 e a interpretação messiânica comum são preservadas na nota, mantendo a tensão entre a forma gramatical e a identificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação apropriada à narrativa visionária. A ordem foi ajustada para fluidez em português sem perder os elementos da sequência grega. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
