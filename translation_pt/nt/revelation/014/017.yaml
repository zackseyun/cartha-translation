id: REV.14.17
reference: Revelation 14:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: pt
  text: E outro anjo saiu do templo que está no céu[a], tendo também ele uma foice afiada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do santuário que está no céu”. O grego ναός pode referir-se mais especificamente ao recinto interior do templo, isto é, ao santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: outro anjo
  rationale: É a forma natural em português e mantém a sequência de figuras angelicais da visão.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Expressa de modo direto o movimento de dentro para fora indicado por ἐξέρχομαι.
- source_word: ναοῦ
  choice: templo
  rationale: É a tradução corrente e clara; o termo grego pode designar mais especificamente o santuário interior, alternativa registrada em nota.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: que está no céu
  rationale: Torna explícita e natural em português a relação atributiva que localiza o templo no céu.
- source_word: ἔχων καὶ αὐτὸς
  choice: tendo também ele
  rationale: Preserva a construção participial e a ênfase de que este anjo, assim como a figura anterior, também possui uma foice.
- source_word: δρέπανον
  choice: foice
  rationale: É o equivalente português habitual para o instrumento de colheita retratado no texto.
- source_word: ὀξύ
  choice: afiada
  rationale: Concorda naturalmente com “foice” e mantém a imagem vívida da lâmina cortante.
theological_decisions:
- issue: Natureza da imagem do templo celestial
  choice: Traduzir ναός diretamente como “templo”, sem ampliação interpretativa.
  alternative: Usar “santuário” para salientar o recinto interior, ou parafrasear como uma habitação celestial simbólica.
  rationale: O texto apresenta a imagem apocalíptica sem explicar se ela deve ser entendida em sentido arquitetônico, simbólico ou litúrgico. A tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação conserva a estrutura encadeada do grego sem soar arcaica.
