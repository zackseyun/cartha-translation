  naturalness: O texto é claro, moderno e de registro apropriado. «E eis que» preserva adequadamente a ênfase visionária de ἰδού. «Em suas testas» continua natural em português amplamente compreensível.
  terminology: «Cordeiro», «Sião» e «Pai» são apropriados. «O nome dele e o nome de seu Pai» preserva a coordenação de dois nomes do texto-base sem impor interpretação teológica.
