id: REV.14.1
reference: Revelation 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: pt
  text: Então olhei e eis que o Cordeiro estava em pé sobre o monte Sião. Com ele estavam cento e quarenta e quatro mil, que tinham o nome dele e o nome de seu Pai escritos em suas testas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem apenas: “o nome de seu Pai escrito em suas testas”.'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Então olhei
  rationale: Expressa com naturalidade a progressão da visão indicada por καί seguido de εἶδον, sem perder o encadeamento narrativo.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador enfático de atenção e o tom elevado próprio da linguagem visionária de Apocalipse.
- source_word: τὸ ἀρνίον
  choice: o Cordeiro
  rationale: Mantém o título cristológico consagrado em Apocalipse sem explicitar sentidos sacrificiais que não aparecem lexicalmente neste versículo.
- source_word: ἑστὸς
  choice: estava em pé
  rationale: O particípio perfeito apresenta o Cordeiro em estado de pé; a locução portuguesa comunica com clareza esse valor resultante e estático.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: sobre o monte Sião
  rationale: Tradução natural da localização, mantendo a forma tradicional e reconhecível do topônimo Sião.
- source_word: μετ’ αὐτοῦ
  choice: Com ele estavam
  rationale: Torna explícita em português a predicação subentendida antes do grupo numerado e produz uma frase fluente.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: cento e quarenta e quatro mil
  rationale: Reproduz exatamente o número em sua forma idiomática no português moderno.
- source_word: ἔχουσαι
  choice: que tinham
  rationale: Converte o particípio em oração relativa natural, conservando sua relação com os cento e quarenta e quatro mil.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o nome dele
  rationale: O possessivo preposicionado evita possível ambiguidade de 'seu' e aponta claramente para o Cordeiro.
- source_word: καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: e o nome de seu Pai
  rationale: Preserva a coordenação de dois nomes e a relação do Pai com o Cordeiro; 'Pai' recebe maiúscula por funcionar como designação divina.
- source_word: γεγραμμένον
  choice: escritos
  rationale: O particípio perfeito passivo indica que os nomes já se encontravam escritos. O plural em português concorda naturalmente com os dois nomes coordenados.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: na testa
  rationale: Usa a expressão coletiva idiomática em português para uma marca situada na testa de cada integrante do grupo, sem alterar a imagem.
theological_decisions:
- issue: Identidade de τὸ ἀρνίον
  choice: o Cordeiro
  alternative: o Cordeiro sacrificial
  rationale: O contexto de Apocalipse identifica o Cordeiro com Cristo, mas a tradução mantém apenas o título expresso no texto e não acrescenta uma interpretação sacrificial.
- issue: Relação entre os dois nomes
  choice: o nome dele e o nome de seu Pai
  alternative: o nome dele, isto é, o nome de seu Pai
  rationale: O grego coordena dois objetos distintos; a tradução conserva tanto a distinção entre o Cordeiro e o Pai quanto sua estreita associação, sem transformar a expressão em aposição.
- issue: Variante textual da inscrição
  choice: incluir no texto principal o nome do Cordeiro e o nome de seu Pai
  alternative: mencionar somente o nome de seu Pai
  rationale: Segue-se o texto do SBLGNT. A leitura que omite o primeiro nome altera materialmente a expressão e, por isso, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'e eis que' conserva deliberadamente o tom visionário elevado; o restante segue sintaxe corrente. O marcador [a] aparece no texto principal junto à expressão afetada pela variante.
