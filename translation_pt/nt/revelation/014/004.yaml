  source_fidelity: O texto traduz com precisão as três declarações enfáticas do grego. «Não se contaminaram com mulheres» preserva a formulação concreta e a voz de sentido reflexivo natural em português; «virgens» mantém παρθένοι sem reduzir a expressão a uma interpretação simbólica. «Seguem o Cordeiro aonde quer que ele vá» transmite adequadamente o particípio presente e o valor indefinido de ὅπου ἂν ὑπάγῃ. «Foram comprados dentre a humanidade, como primeiros frutos para Deus e para o Cordeiro» conserva tanto a metáfora de compra quanto a imagem cultual de ἀπαρχή e a referência inclusiva de ἀνθρώπων.
