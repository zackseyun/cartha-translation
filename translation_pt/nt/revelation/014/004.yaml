id: REV.14.4
reference: Revelation 14:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: pt
  text: Estes são os que não se contaminaram com mulheres[a], pois são virgens. São eles os que seguem o Cordeiro aonde quer que ele vá. Estes foram comprados dentre a humanidade, como primeiros frutos para Deus e para o Cordeiro[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, esta imagem indica pureza espiritual ou ausência de contaminação pela idolatria, e não apenas abstinência sexual em sentido literal.
    reason: alternative_reading
  - marker: b
    text: Isto é, dentre os seres humanos em geral; o termo grego não se refere especificamente apenas aos homens do sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: não se contaminaram
  rationale: O verbo μολύνω expressa contaminação ou profanação, com possíveis matizes morais e cultuais. A construção pronominal é natural em português e comunica adequadamente o estado descrito no contexto.
- source_word: μετὰ γυναικῶν
  choice: com mulheres
  rationale: μετά com genitivo significa normalmente «com». O plural γυναικῶν é aqui mais bem traduzido por «mulheres», pois o texto não restringe explicitamente a referência a esposas.
- source_word: παρθένοι
  choice: virgens
  rationale: παρθένοι significa diretamente «virgens». A escolha preserva a imagem concreta do texto sem decidir se seu alcance é literal, simbólico ou ambos.
- source_word: ἀκολουθοῦντες
  choice: seguem
  rationale: O particípio presente descreve uma ação contínua e característica; o presente simples em português a expressa de modo natural.
- source_word: ἀρνίῳ
  choice: o Cordeiro
  rationale: Em Apocalipse, ἀρνίον funciona como título e imagem cristológica. «O Cordeiro» conserva as associações sacrificiais e apocalípticas.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: aonde quer que ele vá
  rationale: ὅπου ἄν com o subjuntivo expressa lugar indefinido, «onde quer que». «Aonde» combina naturalmente com o verbo de movimento «vá».
- source_word: ἠγοράσθησαν
  choice: foram comprados
  rationale: ἀγοράζω significa literalmente comprar. «Foram comprados» preserva a metáfora comercial-redentora sem substituí-la pelo termo mais interpretativo «foram redimidos».
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: dentre a humanidade
  rationale: ἄνθρωποι refere-se aqui aos seres humanos em geral, não apenas aos homens do sexo masculino. «Dentre a humanidade» preserva tanto a abrangência quanto a ideia de separação de um conjunto.
- source_word: ἀπαρχὴ
  choice: como primeiros frutos
  rationale: ἀπαρχή designa a primeira porção oferecida a Deus. «Primeiros frutos» conserva a imagem agrícola e cultual; «como» torna clara em português a relação predicativa sem eliminar a metáfora.
theological_decisions:
- issue: Se a descrição de não se contaminar com mulheres e ser virgens deve ser interpretada literalmente ou metaforicamente no texto principal
  choice: 'Manter a formulação concreta: «não se contaminaram com mulheres, pois são virgens»'
  alternative: Traduzir interpretativamente como pureza espiritual ou ausência de contaminação idólatra
  rationale: O grego emprega linguagem concreta, enquanto o gênero apocalíptico permite possível força simbólica. A tradução preserva essa tensão e a nota registra a alternativa sem impô-la ao texto principal.
- issue: A relação dos comprados com Deus e o Cordeiro
  choice: «como primeiros frutos para Deus e para o Cordeiro»
  alternative: «como primeira oferta dedicada a Deus e ao Cordeiro»
  rationale: A formulação escolhida mantém a metáfora bíblica dos primeiros frutos e a dupla referência explícita do grego, sem desenvolver além do texto a natureza dessa dedicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se as imagens concretas e cultuais do original. A repetição de «Estes» e «São eles» acompanha a estrutura enfática grega sem tornar a frase excessivamente rígida.
