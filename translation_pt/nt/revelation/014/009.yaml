id: REV.14.9
reference: Revelation 14:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: pt
  text: 'E outro anjo, o terceiro, os seguiu, dizendo em alta voz: “Se alguém adora a besta e a sua imagem[a] e recebe uma marca na testa ou na mão[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prostra diante da besta e da sua imagem”. O verbo grego pode indicar prostração, mas aqui envolve adoração e lealdade.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “na testa dele ou na mão dele”. O pronome masculino singular grego retoma genericamente “alguém”.'
    reason: translation_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: outro anjo, o terceiro
  rationale: Preserva tanto ἄλλος (‘outro’) quanto τρίτος (‘terceiro’) e expressa com naturalidade a ordem dos anjos na visão.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: os seguiu
  rationale: Reproduz diretamente a sequência narrativa indicada pelo aoristo de ἀκολουθέω e retoma os anjos anteriores.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: dizendo em alta voz
  rationale: Formulação portuguesa natural que mantém o caráter público e enfático da proclamação.
- source_word: Εἴ τις
  choice: Se alguém
  rationale: Expressa de modo genérico e singular a condição aberta do grego.
- source_word: προσκυνεῖ
  choice: adora
  rationale: No contexto de Apocalipse, o verbo denota reverência religiosa e lealdade idólatra, embora também possa descrever o ato de prostrar-se.
- source_word: τὸ θηρίον
  choice: a besta
  rationale: Equivalente tradicional, claro e contextualmente estabelecido para a figura apocalíptica.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: a sua imagem
  rationale: Em português, ‘sua’ concorda com ‘imagem’ e remete naturalmente à besta, sem acrescentar gênero pessoal não explicitado pelo substantivo grego neutro.
- source_word: λαμβάνει χάραγμα
  choice: recebe uma marca
  rationale: ‘Recebe’ comunica aceitação ou obtenção, e ‘uma marca’ preserva a forma sem artigo de χάραγμα sem perder sua identificação contextual.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: na testa ou na mão
  rationale: Transmite com naturalidade a localização. A omissão do possessivo evita um masculino genérico desnecessário em português sem alterar o referente a ‘alguém’.
theological_decisions:
- issue: Força religiosa de προσκυνέω em relação à besta
  choice: adora
  alternative: se prostra diante de
  rationale: O contexto envolve devoção e lealdade idólatra, não apenas postura corporal; a nota preserva a alternativa lexical concreta.
- issue: Pronome singular masculino αὐτοῦ com τις
  choice: na testa ou na mão
  alternative: na sua testa ou na sua mão
  rationale: O português permite omitir o possessivo quando a relação corporal é clara. Isso conserva o singular genérico de ‘alguém’ sem introduzir gênero masculino nem mudar para o plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece formalmente próxima do grego, mas emprega expressões idiomáticas como ‘em alta voz’ e ‘na testa ou na mão’. Os marcadores de nota foram colocados junto aos elementos que explicam.
