id: REV.14.16
reference: Revelation 14:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: pt
  text: E aquele que estava sentado sobre a nuvem lançou sua foice sobre a terra,[a] e a terra foi ceifada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs sua foice em ação sobre a terra”. O verbo grego significa literalmente “lançou”, mas, neste contexto de colheita, descreve o uso da foice para ceifar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi colhida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: lançou
  rationale: Preserva o sentido concreto de βάλλω (“lançar”) e a imagem vigorosa do juízo, sem substituir o verbo por uma explicação interpretativa como “brandiu” ou “passou”.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: aquele que estava sentado sobre a nuvem
  rationale: Reproduz a expressão substantivada de modo natural em português e não identifica a figura além do que o próprio versículo afirma.
- source_word: τῆς νεφέλης
  choice: a nuvem
  rationale: O artigo definido e o contexto imediato apontam para a nuvem já mencionada no versículo anterior.
- source_word: τὸ δρέπανον
  choice: sua foice
  rationale: “Foice” é o equivalente português corrente para o instrumento de ceifa e mantém a imagem agrícola e judicial.
- source_word: ἐπὶ τὴν γῆν
  choice: sobre a terra
  rationale: Expressa a direção da ação contra ou para a superfície da terra, preservando a construção e sua imagem sem especificar mecanicamente o movimento.
- source_word: ἐθερίσθη
  choice: foi ceifada
  rationale: Mantém a voz passiva e corresponde diretamente ao verbo θερίζω no contexto de colheita.
- source_word: ἡ γῆ
  choice: a terra
  rationale: No cenário cósmico de Apocalipse, “terra” é preferível a “região” ou “solo”; a repetição também é preservada.
theological_decisions:
- issue: Identidade daquele que está sentado sobre a nuvem
  choice: Manter a descrição do versículo sem nomear a figura.
  alternative: Identificá-lo explicitamente como o Filho do Homem/Messias ou como um agente angelical.
  rationale: Embora o contexto anterior favoreça frequentemente a identificação com o Filho do Homem, este versículo diz apenas “aquele que estava sentado sobre a nuvem”. A tradução não deve resolver no texto principal uma questão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe conserva a repetição enfática de “a terra” e o caráter conciso da frase grega.
