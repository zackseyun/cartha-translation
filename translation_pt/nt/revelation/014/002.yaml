id: REV.14.2
reference: Revelation 14:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: pt
  text: E ouvi um som[a] vindo do céu, como o som de muitas águas[b] e como o som de um forte trovão; e o som que ouvi era como o de harpistas tocando suas harpas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voz” em cada ocorrência de “som”; a palavra grega φωνή pode ter ambos os sentidos, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: “Muitas águas” é uma imagem bíblica de um ruído vasto e avassalador; compare Ezequiel 43:2.
    reason: cross_reference
  - marker: c
    text: A κιθάρα grega era um antigo instrumento de cordas, mais próximo da lira; tradicionalmente é traduzida por “harpa”.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: som
  rationale: As três ocorrências descrevem um fenômeno auditivo comparado a águas, trovão e música instrumental. “Som” preserva essa ênfase acústica sem pressupor fala, embora “voz” também seja lexicalmente possível.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vindo do céu
  rationale: O contexto do Apocalipse aponta para o âmbito celestial; esta formulação é natural em português e conserva a ideia de origem.
- source_word: ὡς
  choice: como
  rationale: Introduz claramente as sucessivas comparações do versículo.
- source_word: ὑδάτων πολλῶν
  choice: muitas águas
  rationale: Mantém a imagem bíblica tradicional e sua ressonância intertextual, sem explicá-la no corpo do texto.
- source_word: βροντῆς μεγάλης
  choice: forte trovão
  rationale: Expressa de modo natural a grande intensidade indicada por μεγάλης.
- source_word: κιθαρῳδῶν
  choice: harpistas
  rationale: O substantivo designa músicos ligados à κιθάρα; o particípio seguinte explicita que estão tocando. “Harpistas” é conciso e reconhecível na tradição do Apocalipse.
- source_word: κιθαριζόντων
  choice: tocando
  rationale: Verte diretamente a ação de executar música no instrumento sem acrescentar a técnica usada.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: suas harpas
  rationale: Em português, “tocar suas harpas” é idiomático; “harpa” preserva o equivalente tradicional, com a precisão histórica indicada em nota.
theological_decisions:
- issue: Natureza do fenômeno auditivo celestial
  choice: Traduzir φωνή por “som” nas três ocorrências.
  alternative: Traduzir por “voz” em todas as ocorrências, ou alternar entre “voz” e “som”.
  rationale: As comparações com águas, trovão e instrumentos destacam a qualidade acústica. “Som” evita identificar implicitamente um falante que o texto não especifica, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição de “som” conserva a coesão do grego; o ponto e vírgula organiza o período sem eliminar seu paralelismo. As imagens “muitas águas” e “harpas” mantêm a linguagem bíblica tradicional, acompanhadas de notas esclarecedoras.
