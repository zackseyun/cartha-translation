id: REV.14.13
reference: Revelation 14:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: pt
  text: 'E ouvi uma voz vinda do céu, que dizia: “Escreva: ‘Felizes são os mortos que, desde agora, morrem no Senhor.’” “Sim”, diz o Espírito, “para que descansem de suas fadigas, pois suas obras os acompanham.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: uma voz vinda do céu, que dizia
  rationale: Mantém φωνή como “voz” e expressa de modo natural a origem indicada por ἐκ τοῦ οὐρανοῦ; “que dizia” preserva o particípio introdutor da fala.
- source_word: Γράψον
  choice: Escreva
  rationale: Imperativo aoristo singular direto, sem acrescentar objeto ausente no grego.
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em português bíblico atual, “felizes” comunica naturalmente a declaração de condição favorecida própria das bem-aventuranças, sem reduzi-la a uma emoção passageira.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: os mortos que morrem no Senhor
  rationale: Preserva tanto a expressão substantivada “os mortos” quanto a linguagem teologicamente ampla ἐν κυρίῳ, sem explicá-la além do texto.
- source_word: ἀπ’ ἄρτι
  choice: desde agora
  rationale: Equivalente temporal claro e idiomático, que marca o ponto a partir do qual a declaração se aplica.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “Sim”, diz o Espírito
  rationale: Conserva a afirmação enfática ναί e o Espírito como sujeito explícito da confirmação.
- source_word: ἵνα ἀναπαήσονται
  choice: para que descansem
  rationale: “Para que” preserva a nuance possível de propósito ou resultado de ἵνα; o presente do subjuntivo é a forma portuguesa natural exigida pela construção, embora o grego apresente futuro indicativo.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: de suas fadigas
  rationale: κόπος designa trabalho penoso, esforço ou desgaste; “fadigas” abrange tanto o labor quanto o sofrimento extenuante sem limitar indevidamente o sentido.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: pois suas obras
  rationale: “Obras” mantém a amplitude moral e prática de ἔργα e suas conexões lexicais no Apocalipse.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: os acompanham
  rationale: Expressa idiomaticamente a ideia de seguir junto com eles, incluindo a força de μετά sem produzir a construção pouco natural “seguem com eles”.
theological_decisions:
- issue: Sentido de “no Senhor” em relação aos mortos
  choice: os mortos que morrem no Senhor
  alternative: os mortos que morrem fiéis ao Senhor / pertencendo ao Senhor
  rationale: A formulação relativamente literal preserva as possíveis ideias de união, pertencimento e fidelidade, sem escolher uma explicação doutrinária mais estreita.
- issue: Força de ἵνα ἀναπαήσονται
  choice: para que descansem
  alternative: de modo que descansarão / isto é, descansarão
  rationale: A tradução mantém aberta a nuance de propósito ou resultado, em vez de resolver uma construção grega incomum de maneira categórica.
- issue: Relação das obras com os mortos declarados felizes
  choice: suas obras os acompanham
  alternative: suas obras conquistam sua recompensa / suas obras são apenas lembradas
  rationale: O texto afirma que as obras vão com eles, mas não define aqui se ou como isso se relaciona a mérito, recompensa ou testemunho; a tradução não acrescenta essa definição.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “Felizes” à fórmula mais marcada “Bem-aventurados”; “fadigas” conserva o sentido de esforço penoso. Não há notas, portanto não são necessários marcadores no texto.
