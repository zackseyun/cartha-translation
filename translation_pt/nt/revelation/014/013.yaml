  source_fidelity: 'O conteúdo corresponde bem ao grego: mantém a voz celestial, a ordem de escrever, a bem-aventurança dos mortos que morrem no Senhor, o marco temporal, a confirmação do Espírito, o descanso das fadigas e as obras que os acompanham. A formulação proposta para ἵνα ἀναπαήσονται preserva adequadamente a nuance de propósito/resultado sem a resolver de modo indevido.'
  naturalness: O texto é em geral claro e atual. Contudo, “Felizes os mortos” soa elíptico e um tanto abrupto em português corrente; “Felizes são os mortos” conserva a concisão solene e é mais natural. A pontuação também deve distinguir a ordem “Escreva” da declaração que deve ser escrita.
  terminology: “No Senhor”, “o Espírito”, “fadigas” e “obras” são escolhas adequadas, fiéis e de registro bíblico moderno. “Felizes” é uma opção defensável para μακάριοι em português contemporâneo e não exige substituição por “Bem-aventurados”.
