  - severity: low
    issue: A ordem de escrever e o conteúdo a ser escrito não estão tipograficamente separados.
    rationale: Γράψον introduz a bem-aventurança como texto a registrar. Aspas internas após os dois-pontos tornam essa estrutura mais clara em português.
