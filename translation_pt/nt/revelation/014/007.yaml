id: REV.14.7
reference: Revelation 14:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: pt
  text: 'dizendo em alta voz: “Temam a Deus[a] e deem-lhe glória, pois chegou a hora do seu julgamento. Adorem aquele que fez o céu, a terra, o mar e as fontes de água[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Reverenciem a Deus”. O verbo grego pode indicar tanto temor reverente quanto temor diante do julgamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fontes de águas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: dizendo em alta voz
  rationale: Mantém a ligação participial com o contexto anterior e traduz de modo natural a expressão grega, preservando a ideia de proclamação audível e enfática.
- source_word: Φοβήθητε
  choice: Temam
  rationale: Preserva a amplitude de φοβέομαι, que neste contexto reúne temor reverente e temor diante do juízo, sem reduzi-lo a simples respeito nem a mero pavor.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: Tradução direta e idiomática do objeto do imperativo.
- source_word: δότε αὐτῷ δόξαν
  choice: deem-lhe glória
  rationale: Conserva a expressão bíblica concreta e mantém a referência pronominal de maneira natural em português.
- source_word: ὅτι ἦλθεν ἡ ὥρα
  choice: pois chegou a hora
  rationale: Expressa o valor causal de ὅτι e preserva a imagem apocalíptica de uma hora determinada que já chegou.
- source_word: τῆς κρίσεως αὐτοῦ
  choice: do seu julgamento
  rationale: 'Mantém a concisão e a possível relação de pertencimento ou origem: o julgamento que pertence a Deus ou é exercido por ele.'
- source_word: προσκυνήσατε
  choice: Adorem
  rationale: No contexto religioso de Apocalipse, o verbo indica adoração, não apenas inclinação corporal ou homenagem.
- source_word: τῷ ποιήσαντι
  choice: aquele que fez
  rationale: Representa naturalmente o particípio substantivado e preserva sua força verbal.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν
  choice: o céu, a terra, o mar
  rationale: Preserva a linguagem tradicional da criação, com coordenação natural em português.
- source_word: πηγὰς ὑδάτων
  choice: fontes de água
  rationale: Usa a forma corrente em português para nascentes ou fontes naturais, enquanto uma nota registra o plural literal do grego.
theological_decisions:
- issue: Sentido de Φοβήθητε τὸν θεόν
  choice: Temam a Deus
  alternative: Reverenciem a Deus
  rationale: O contexto une temor, glória, adoração e juízo. “Temam” preserva a tensão entre reverência e receio diante do Deus Criador e Juiz, em vez de resolver o sentido como simples respeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural (“temam”, “deem”, “adorem”) naturais para leitores brasileiros. A pontuação favorece clareza oral, e a linguagem mantém o tom solene da proclamação apocalíptica.
