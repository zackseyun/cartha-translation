  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: pt
  text: E na boca deles não se achou mentira; são irrepreensíveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem defeito” ou “sem culpa”; o termo grego pode evocar tanto a pureza sacrificial quanto a integridade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: na boca deles
  rationale: Mantém o singular coletivo de στόματι e a imagem concreta da boca como lugar da fala, em formulação natural e compreensível em português.
- source_word: οὐχ εὑρέθη
  choice: não se achou
  rationale: Preserva o aoristo passivo e o foco do grego na ausência constatada da mentira, sem transformar a frase numa paráfrase ativa.
- source_word: ψεῦδος
  choice: mentira
  rationale: É o equivalente direto e corrente para a falsidade expressa na fala; evita ampliar o sentido para um traço geral de caráter, como poderia ocorrer com “engano”.
- source_word: ἄμωμοί
  choice: irrepreensíveis
  rationale: Comunica integridade moral em português atual e digno sem afirmar explicitamente impecabilidade absoluta; a possível imagem de pureza sacrificial é preservada em nota.
- source_word: καὶ
  choice: E
  rationale: Conserva a ligação do versículo com a descrição anterior.
theological_decisions:
- issue: Traduzir ἄμωμοί preservando a linguagem de santidade sem impor a ideia de ausência absoluta de pecado
  choice: irrepreensíveis
  alternative: sem defeito; sem culpa
  rationale: O termo pode indicar tanto ausência de defeito, com possível ressonância sacrificial, quanto integridade moral. “Irrepreensíveis” expressa bem o sentido ético no texto principal, enquanto a nota mantém abertas as demais nuances legítimas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem e as imagens do grego foram preservadas sempre que soam naturais. O marcador foi colocado junto de “irrepreensíveis”, termo ao qual a nota lexical se refere.
