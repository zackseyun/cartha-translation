id: REV.14.19
reference: Revelation 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: pt
  text: E o anjo passou a sua foice sobre a terra, colheu a videira da terra e a lançou no grande lagar da ira de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: passou a sua foice sobre a terra
  rationale: No contexto da colheita, descreve o movimento da foice, evitando o sentido inadequado de que o anjo simplesmente a arremessou no chão.
- source_word: ἐτρύγησεν
  choice: colheu
  rationale: Verbo próprio da vindima; em conjunto com 'a videira', comunica de modo natural a colheita das uvas sem acrescentar um objeto ausente do grego.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: a videira da terra
  rationale: Preserva a imagem singular e a repetição de 'da terra' presentes no texto-fonte.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: no grande lagar
  rationale: Ληνός designa o lagar onde as uvas são pisadas; a colocação portuguesa integra naturalmente o adjetivo 'grande'.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: da ira de Deus
  rationale: Expressão tradicional, clara e semanticamente adequada para a ira judicial divina retratada pela imagem do lagar.
theological_decisions:
- issue: Força da imagem do juízo divino
  choice: ira de Deus
  alternative: furor de Deus
  rationale: Mantém a linguagem explícita do texto sem atenuá-la; 'ira' é natural e suficientemente forte, enquanto 'furor' pode sugerir perda de controle não exigida pelo grego.
translation_notes:
  register: Português moderno, digno e acessível. A coordenação repetida do grego foi preservada em parte, mas a segunda ocorrência de 'e' foi omitida para dar fluidez natural à sequência verbal. 'Passou a sua foice sobre a terra' expressa o gesto da ceifa sem reproduzir literalmente um hebraísmo/uso contextual de βάλλω que soaria como arremesso da ferramenta.
