id: REV.14.15
reference: Revelation 14:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: pt
  text: 'E outro anjo saiu do santuário, clamando em alta voz ao que estava sentado sobre a nuvem: “Lance a sua foice e faça a colheita, pois chegou a hora de colher, porque a seara da terra está madura.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: santuário
  rationale: Distingue o recinto sagrado central do termo mais amplo para o templo e corresponde naturalmente ao contexto celestial de Apocalipse.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Lance a sua foice
  rationale: Preserva a imagem concreta e a força imperativa de πέμψον sem recorrer ao pouco natural “envie a sua foice”.
- source_word: θέρισον
  choice: faça a colheita
  rationale: Expressa de modo claro e natural a ordem de ceifar, evitando a possível leitura de simplesmente cortar algo.
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: a seara da terra está madura
  rationale: No contexto agrícola, o aoristo passivo de “secar” descreve a plantação que atingiu o ponto de colheita; “está madura” comunica esse sentido idiomaticamente sem intensificá-lo como “madura demais”.
theological_decisions:
- issue: Natureza da colheita da terra
  choice: Manter apenas a imagem agrícola, sem identificar explicitamente a colheita como salvação ou juízo.
  alternative: Explicitar que se trata de colheita para salvação ou para juízo.
  rationale: O versículo não resolve por si só a função teológica precisa da colheita; a tradução preserva essa tensão no contexto imediato.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. “Ao que estava sentado” conserva a referência do particípio grego sem acrescentar uma identificação ausente no versículo.
source_grounding:
  english_pob_role: consult_only
