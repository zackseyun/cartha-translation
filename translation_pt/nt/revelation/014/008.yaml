id: REV.14.8
reference: Revelation 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: pt
  text: 'E outro anjo, o segundo, veio em seguida, dizendo: “Caiu! Caiu a grande Babilônia, ela que fez todas as nações beberem[c] do vinho do furor[a] da sua imoralidade sexual[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da ira” ou “da paixão ardente”. A palavra grega θυμός pode indicar ira, fúria ou uma paixão intensa.'
    reason: lexical_alternative
  - marker: b
    text: A “imoralidade sexual” de Babilônia provavelmente representa, de modo figurado, sua influência corruptora, idólatra e infiel; o texto, porém, não restringe a imagem a apenas um desses sentidos.
    reason: cultural_note
  - marker: c
    text: 'Ou: “embriagou todas as nações”. O grego diz literalmente que ela “fez todas as nações beberem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: outro anjo, o segundo
  rationale: Preserva tanto ἄλλος (“outro”) como δεύτερος (“segundo”), usando uma aposição natural em português.
- source_word: ἠκολούθησεν
  choice: veio em seguida
  rationale: Expressa com clareza a sequência da cena visionária; “seguiu” poderia sugerir em português um objeto pessoal não explicitado.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial do grego com a ação do anjo.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Caiu! Caiu
  rationale: Conserva a repetição enfática e o caráter solene da proclamação profética.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: a grande Babilônia
  rationale: Forma natural e reconhecível em português, preservando o nome próprio e o qualificativo.
- source_word: ἣ
  choice: ela que
  rationale: Torna explícita a personificação feminina de Babilônia sem acrescentar uma interpretação à imagem.
- source_word: ἐκ τοῦ οἴνου
  choice: do vinho
  rationale: Em português, “beber do vinho” comunica naturalmente a ideia de beber a partir dessa fonte, correspondente a ἐκ.
- source_word: τοῦ θυμοῦ
  choice: do furor
  rationale: “Furor” preserva a intensidade de θυμός e deixa em aberto sua nuance entre ira destrutiva e paixão ardente; alternativas são registradas em nota.
- source_word: τῆς πορνείας αὐτῆς
  choice: da sua imoralidade sexual
  rationale: Expressão moderna e abrangente que mantém a imagem sexual e não a reduz especificamente a prostituição, idolatria ou infidelidade política.
- source_word: πεπότικεν
  choice: fez … beberem
  rationale: Preserva o sentido causativo de ποτίζω. O pretérito perfeito português expressa adequadamente a ação consumada, cujo efeito permanece no contexto.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Refere-se amplamente aos povos ou nações, sem restringir o sentido a gentios em contraste com judeus.
theological_decisions:
- issue: Força metafórica de πορνεία aplicada a Babilônia
  choice: imoralidade sexual
  alternative: prostituição; idolatria; infidelidade
  rationale: A tradução mantém a imagem concreta usada pelo texto, enquanto a nota indica sua provável dimensão simbólica sem identificar a metáfora exclusivamente com uma única realidade.
- issue: Sentido de θυμός em relação à imoralidade sexual de Babilônia
  choice: furor
  alternative: ira; paixão ardente
  rationale: A construção grega admite intensidade passional e conotações de ira ou destruição. “Furor” conserva essa tensão melhor do que uma escolha que fixe apenas uma dessas nuances.
- issue: Personificação de Babilônia
  choice: ela que
  alternative: a qual
  rationale: O feminino do pronome relativo e a apresentação posterior de Babilônia como mulher favorecem conservar a personificação, sem definir aqui a identidade simbólica da cidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A pontuação enfática em “Caiu! Caiu” reproduz a força retórica da proclamação; as notas preservam ambiguidades lexicais e simbólicas genuínas.
