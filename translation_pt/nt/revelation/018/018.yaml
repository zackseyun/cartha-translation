id: REV.18.18
reference: Revelation 18:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: pt
  text: 'E eles clamaram ao ver a fumaça do incêndio dela, dizendo: “Que cidade é semelhante à grande cidade?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: clamaram
  rationale: O aoristo de κράζω indica um brado forte; “clamaram” preserva a intensidade com registro digno e natural.
- source_word: βλέποντες
  choice: ao ver
  rationale: O particípio presente é contemporâneo ao verbo principal; “ao ver” expressa essa relação temporal de modo conciso.
- source_word: καπνὸν τῆς πυρώσεως αὐτῆς
  choice: a fumaça do incêndio dela
  rationale: “Fumaça” traduz diretamente καπνός; “incêndio” comunica a queima destrutiva expressa por πύρωσις, e “dela” mantém a referência feminina à cidade personificada.
- source_word: λέγοντες
  choice: dizendo
  rationale: Tradução direta e natural do particípio que introduz o discurso.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Que cidade é semelhante à grande cidade?
  rationale: A frase grega é elíptica, sem cópula expressa. “Que cidade” explicita naturalmente o termo comparado, e o presente “é” reproduz a formulação retórica sem impor uma referência temporal ausente no grego.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: à grande cidade
  rationale: Tradução direta da construção articulada, mantendo o título contextual da cidade.
theological_decisions:
- issue: Personificação de Babilônia/a cidade
  choice: Manter a referência feminina por meio de “dela”
  alternative: Usar “do seu incêndio” ou reformular sem pronome feminino
  rationale: Apocalipse personifica consistentemente Babilônia como mulher e cidade; “dela” preserva essa imagem literária sem acrescentar interpretação.
- issue: Tempo da cópula implícita na pergunta
  choice: Usar o presente “é”
  alternative: Usar o passado “era” ou “foi”
  rationale: O grego não traz cópula expressa. O presente mantém a força proverbial e retórica da comparação, ao passo que o passado resolveria uma ambiguidade temporal que o texto não resolve.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Clamaram” conserva a força do brado; “incêndio” evita a construção menos idiomática “fumaça da queima”. A elipse grega é explicitada apenas na medida necessária para uma pergunta natural em português.
