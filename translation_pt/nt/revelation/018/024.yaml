id: REV.18.24
reference: Revelation 18:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: pt
  text: Nela[c] foi encontrado o sangue dos profetas, dos santos[a] e de todos os que foram massacrados na terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que pertencem a Deus” ou “do povo santo de Deus”, em vez de “dos santos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os que foram mortos na terra”. O verbo grego é mais forte do que um termo genérico para matar e pode significar “massacrados”.
    reason: lexical_alternative
  - marker: c
    text: “Nela” refere-se a Babilônia, retratada como mulher na visão que a cerca.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome feminino retoma Babilônia, apresentada como cidade personificada em forma de mulher; “nela” preserva essa imagem sem tornar o referente impessoal.
- source_word: αἷμα
  choice: sangue
  rationale: É o sentido direto e natural, mantendo também no contexto a ideia judicial de culpa pelo derramamento de sangue.
- source_word: προφητῶν
  choice: profetas
  rationale: Equivalente corrente e exato de προφῆται neste contexto.
- source_word: ἁγίων
  choice: santos
  rationale: Em Apocalipse, o termo designa com frequência o povo consagrado a Deus. “Santos” é conciso, tradicional e amplamente compreensível, sem exigir uma interpretação denominacional.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Reproduz naturalmente o aoristo passivo e preserva o sentido de descoberta ou constatação judicial.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: todos os que foram massacrados
  rationale: σφάζω é mais forte do que um verbo genérico para matar e comunica morte violenta. O particípio perfeito é expresso de modo natural em português pelo passado passivo, sem perder o estado resultante pressuposto no contexto.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: No horizonte apocalíptico do livro, γῆ tem aqui alcance amplo, referindo-se à terra, e não necessariamente a uma região ou território específico.
theological_decisions:
- issue: Referente e extensão da culpa de Babilônia
  choice: A acusação atribui a Babilônia responsabilidade pelo sangue dos profetas, dos santos e de todos os massacrados na terra, mantendo a abrangência da linguagem apocalíptica e judicial.
  alternative: A frase final pode ser entendida como linguagem hiperbólica sobre todo derramamento de sangue que Babilônia representa, ou de maneira mais estritamente universal dentro do simbolismo da visão.
  rationale: O grego apresenta a acusação abrangente sem explicar de que modo o símbolo corresponde à história. A tradução conserva essa tensão e não restringe o alcance da afirmação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e as relações genitivas do grego foram preservadas sem produzir uma construção artificial. “Massacrados” mantém a força da imagem violenta, enquanto as notas registram alternativas legítimas.
