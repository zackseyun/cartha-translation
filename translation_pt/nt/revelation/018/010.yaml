id: REV.18.10
reference: Revelation 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: pt
  text: 'de pé, à distância, por medo do tormento dela, dizendo: “Ai! Ai! A grande cidade, Babilônia, a cidade poderosa! Pois, em uma só hora, chegou o seu julgamento.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: ficando de longe
  rationale: A expressão combina a postura contínua indicada pelo particípio perfeito com a distância espacial; em português, “ficando de longe” comunica naturalmente que permanecem afastados.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: por medo do tormento dela
  rationale: διά com acusativo expressa causa. “Tormento” preserva a intensidade de βασανισμός sem especificar indevidamente o meio do sofrimento.
- source_word: λέγοντες
  choice: e dizendo
  rationale: O particípio introduz o discurso direto e se coordena naturalmente com a expressão participial anterior em português.
- source_word: Οὐαὶ οὐαί
  choice: Ai! Ai
  rationale: A interjeição portuguesa “ai” pode expressar tanto lamentação quanto anúncio de desgraça e mantém a repetição enfática do grego.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: a grande cidade
  rationale: Reprodução natural em português da construção atributiva enfática do grego.
- source_word: Βαβυλὼν
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: a cidade poderosa
  rationale: ἰσχυρά pode indicar força, poder ou potência; “poderosa” é idiomático para uma cidade e preserva esse campo sem sugerir apenas robustez física.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da lamentação e conserva o tom elevado sem soar arcaico.
- source_word: μιᾷ ὥρᾳ
  choice: em uma só hora
  rationale: Expressa o intervalo temporal e destaca a rapidez e a brusquidão do julgamento.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: chegou o seu julgamento
  rationale: O aoristo apresenta a chegada do julgamento como fato consumado. O pretérito perfeito é natural no discurso direto português e preserva a imagem verbal de algo que chegou.
theological_decisions:
- issue: Sentido da interjeição apocalíptica οὐαί
  choice: Ai! Ai
  alternative: Pobre! Pobre! / Que desgraça! Que desgraça!
  rationale: “Ai” mantém aberta a tensão entre lamento e anúncio profético de calamidade, sem reduzir a expressão exclusivamente à compaixão ou à condenação.
- issue: Referente do pronome em τοῦ βασανισμοῦ αὐτῆς
  choice: tormento dela
  alternative: tormento que ela sofre
  rationale: A forma pronominal preserva a concisão e a personificação feminina de Babilônia no contexto, sem acrescentar uma explicação ausente do texto.
- issue: Valor temporal e aspectual de ἦλθεν
  choice: chegou
  alternative: veio / chegou agora
  rationale: O pretérito perfeito apresenta o julgamento como já ocorrido no cenário visionário. Evita acrescentar “agora”, que não está expresso, e não impõe uma leitura cronológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação separa a dupla exclamação para reproduzir sua força oral. “Poderosa” soa mais natural para uma cidade do que “forte”, enquanto “em uma só hora” ressalta a súbita queda sem alterar o sentido temporal.
