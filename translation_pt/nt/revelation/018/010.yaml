    issue: “ficando de longe” para ἀπὸ μακρόθεν ἑστηκότες
    rationale: O particípio perfeito ἑστηκότες descreve pessoas que estão/de pé, não meramente que ficam ou permanecem longe. A formulação também enfraquece a imagem espacial e corporal do original.
  - severity: low
    issue: Pontuação e vinculação de “Ai! Ai da grande cidade”
    rationale: A sequência pode ser lida em português como “ai da cidade”, enquanto o grego repete a exclamação de lamento e então nomeia a cidade. Separar as duas exclamações preserva melhor a força retórica e a estrutura do enunciado.
  revised_text: 'de pé, à distância, por medo do tormento dela, dizendo: “Ai! Ai! A grande cidade, Babilônia, a cidade poderosa! Pois, em uma só hora, chegou o seu julgamento.”'
