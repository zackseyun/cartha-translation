review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a distância, o temor do tormento, o lamento sobre Babilônia e a chegada súbita do julgamento. Contudo, “ficando de longe” não representa com precisão ἑστηκότες (“estando/de pé”); além disso, a pontuação de “Ai! Ai da...” pode fazer “ai” soar como uma exclamação seguida de complemento, em vez da dupla lamentação dirigida à cidade.
  naturalness: “De pé, à distância” é claro, idiomático e preserva a imagem do original. A repetição “Ai! Ai!” seguida da identificação da cidade mantém um registro apocalíptico natural e inteligível em português moderno.
  terminology: “Tormento”, “Babilônia”, “cidade poderosa”, “uma só hora” e “julgamento” são escolhas fiéis e adequadas. “Poderosa” comunica bem ἰσχυρά no contexto.
  issues:
