id: REV.18.7
reference: Revelation 18:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: pt
  text: 'Na mesma medida em que ela glorificou a si mesma e viveu no luxo[a], deem-lhe tormento e luto. Pois ela diz em seu coração: “Estou sentada como rainha, não sou viúva e certamente jamais verei luto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “viveu de maneira autocomplacente” ou “viveu sensualmente”. O verbo grego pode indicar uma vida luxuosa, desenfreada e voltada à satisfação dos próprios desejos.
    reason: lexical_alternative
  - marker: b
    text: A expressão “certamente jamais verei luto” emprega uma negação enfática no grego e expressa a forte confiança de que o luto nunca virá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Na mesma medida em que ...
  rationale: Preserva a correlação proporcional do grego, indicando retribuição correspondente, em português natural.
- source_word: ἐδόξασεν αὑτὴν
  choice: ela glorificou a si mesma
  rationale: Mantém explícita a reflexividade e a ideia central de autoexaltação.
- source_word: ἐστρηνίασεν
  choice: viveu no luxo
  rationale: Comunica com clareza uma vida luxuosa e autocomplacente, sem restringir indevidamente o verbo a sensualidade sexual.
- source_word: δότε αὐτῇ
  choice: deem-lhe
  rationale: Imperativo direto, natural e compatível com os objetos 'tormento e luto'.
- source_word: βασανισμὸν
  choice: tormento
  rationale: Preserva a severidade do juízo sem limitá-lo necessariamente a tortura física.
- source_word: πένθος
  choice: luto
  rationale: Expressa a aflição ligada à perda e mantém a repetição temática nas duas ocorrências.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: ela diz em seu coração
  rationale: Conserva o conhecido idioma bíblico de convicção interior e autoconfiança.
- source_word: Κάθημαι βασίλισσα
  choice: Estou sentada como rainha
  rationale: Preserva a imagem presente de posição régia e segurança, com formulação compreensível em português.
- source_word: χήρα οὐκ εἰμί
  choice: não sou viúva
  rationale: Tradução direta que mantém a imagem de suposta imunidade à perda e ao desamparo.
- source_word: οὐ μὴ ἴδω
  choice: certamente jamais verei
  rationale: Representa a negação grega enfática e a certeza presunçosa da personagem.
theological_decisions:
- issue: Personificação da Babilônia como mulher, rainha e viúva
  choice: Manter a personificação feminina em toda a passagem.
  alternative: Converter a imagem em referência impessoal a uma cidade ou sistema econômico.
  rationale: O grego sustenta consistentemente a figura feminina, essencial à retórica profética e ao contraste entre autoexaltação e juízo.
- issue: Linguagem de juízo em βασανισμός
  choice: Usar 'tormento'.
  alternative: Usar 'tortura' ou 'dor'.
  rationale: '''Tormento'' preserva a severidade da retribuição judicial sem especificar um mecanismo mais estreito do que o texto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a personificação feminina, a proporção da retribuição, o idioma bíblico do coração e a força da negação enfática.
