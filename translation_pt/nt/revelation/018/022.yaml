id: REV.18.22
reference: Revelation 18:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: pt
  text: E nunca mais se ouvirá em você o som de harpistas, músicos, flautistas[a] e trompetistas; nunca mais se encontrará em você nenhum artesão de qualquer ofício; e nunca mais se ouvirá em você o som de moinho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere a tocadores do aulós, antigo instrumento de sopro que não era idêntico à flauta moderna; também poderia ser traduzido por “tocadores de flauta” ou “tocadores de pífano”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o som de uma pedra de moinho”; o termo grego pode indicar mais especificamente o aparato de moagem, mas “moinho” preserva a imagem mais ampla dessa atividade.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: o som
  rationale: Neste contexto, refere-se a um som audível, não à fala; a escolha também preserva a repetição entre a música e o moinho.
- source_word: κιθαρῳδῶν
  choice: harpistas
  rationale: Designa executantes ligados à kithara; “harpistas” é uma equivalência tradicional, clara e natural, sem recorrer a uma transliteração obscura.
- source_word: μουσικῶν
  choice: músicos
  rationale: É o termo abrangente mais natural em português para os que se dedicam à execução musical.
- source_word: αὐλητῶν
  choice: flautistas
  rationale: Comunica de modo acessível os tocadores do aulós, embora o instrumento antigo não fosse idêntico à flauta moderna; a nota preserva essa precisão.
- source_word: σαλπιστῶν
  choice: trompetistas
  rationale: Equivalente direto e conciso para os que tocam a trombeta.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: nunca mais se ouvirá
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática, e ἔτι indica a cessação definitiva do que antes ocorria.
- source_word: ἐν σοὶ
  choice: em você
  rationale: Mantém o tratamento direto à Babilônia personificada como cidade, em português corrente e amplamente compreensível.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: nenhum artesão de qualquer ofício
  rationale: Preserva a abrangência da expressão grega e soa mais natural em português do que uma repetição como “artesão de qualquer arte”.
- source_word: οὐ μὴ εὑρεθῇ ... ἔτι
  choice: nunca mais se encontrará
  rationale: Expressa enfaticamente a ausência futura e definitiva, preservando a forma passiva do grego.
- source_word: μύλου
  choice: de moinho
  rationale: Refere-se ao moinho ou aparato de moagem e, por metonímia, ao ruído da atividade de moer; “moinho” conserva a amplitude da imagem.
theological_decisions:
- issue: Imagem do juízo sobre Babilônia
  choice: Preservar a declaração tríplice de que cessarão completamente a música, o trabalho especializado e a atividade cotidiana de moagem na cidade julgada.
  alternative: Tratar os elementos apenas como detalhes ornamentais, sem peso na imagem de desolação.
  rationale: A fórmula repetida οὐ μή ... ἔτι comunica desolação completa e definitiva. A tradução mantém as imagens concretas sem lhes impor uma alegorização específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A coordenação foi pontuada com ponto e vírgula para tornar clara a estrutura tríplice, e a repetição de “nunca mais” preserva a força retórica e a finalidade enfática do grego.
