  source_fidelity: A lista de mercadorias é reproduzida com precisão em quase todos os itens, e «carruagens» é uma boa opção contextual para ῥεδῶν. Contudo, «vidas humanas» para ψυχὰς ἀνθρώπων deixa de representar o termo ψυχαί («almas») e atenua o paralelismo deliberado com «corpos».
  naturalness: O português é claro, moderno e apropriado ao registro solene de Apocalipse. «Corpos e almas humanas» é natural em português e conserva a força chocante da enumeração comercial.
  terminology: «Olíbano», «azeite de oliva», «farinha fina», «especiaria aromática» e «carruagens» são escolhas adequadas. A nota sobre «corpos» deve abranger a expressão inteira, pois o sentido contextual de pessoas escravizadas decorre de «corpos e almas humanas», não somente de σώματα isoladamente.
