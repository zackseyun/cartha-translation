id: REV.18.13
reference: Revelation 18:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and slaves, that is[b], human souls.
translation:
  language: pt
  text: canela, especiaria aromática[a], incenso, perfume, olíbano, vinho, azeite de oliva, farinha fina, trigo, gado, ovelhas, cavalos, carruagens, corpos[b] e almas humanas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amomo”, uma especiaria aromática cara.
    reason: lexical_alternative
  - marker: b
    text: No contexto, “corpos e almas humanas” refere-se a pessoas vendidas como escravas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: canela
  rationale: Equivalente comum e preciso para a mercadoria aromática importada.
- source_word: ἄμωμον
  choice: especiaria aromática
  rationale: Comunica de modo natural uma planta aromática valiosa cuja identificação exata como amomo é incerta ou pouco conhecida; a alternativa específica fica em nota.
- source_word: θυμιάματα
  choice: incenso
  rationale: No catálogo comercial, designa substâncias aromáticas queimadas, não o ato ritual de oferecê-las.
- source_word: μύρον
  choice: perfume
  rationale: Expressa naturalmente o unguento ou óleo perfumado de alto valor.
- source_word: λίβανον
  choice: olíbano
  rationale: Designa especificamente a resina aromática também conhecida como franquincenso, distinta do termo mais geral para incenso.
- source_word: ἔλαιον
  choice: azeite de oliva
  rationale: Explicita o referente normal do termo no contexto mediterrâneo e evita a imprecisão de 'óleo'.
- source_word: σεμίδαλιν
  choice: farinha fina
  rationale: Denota farinha refinada de alta qualidade.
- source_word: σῖτον
  choice: trigo
  rationale: É o sentido específico mais provável neste catálogo de mercadorias.
- source_word: κτήνη
  choice: gado
  rationale: Designa animais domésticos de maior porte e mantém a distinção em relação às ovelhas mencionadas em seguida.
- source_word: πρόβατα
  choice: ovelhas
  rationale: Equivalente direto e corrente.
- source_word: ῥεδῶν
  choice: carruagens
  rationale: Refere-se a veículos de quatro rodas, provavelmente carruagens de transporte ou luxo, e não necessariamente carros de guerra.
- source_word: σωμάτων
  choice: corpos
  rationale: Preserva a formulação literal e o efeito chocante da redução de seres humanos a mercadoria; a nota esclarece o sentido escravista.
- source_word: ψυχὰς ἀνθρώπων
  choice: vidas humanas
  rationale: ψυχή pode significar vida ou pessoa; 'vidas humanas' mantém o contraste retórico com 'corpos' sem impor uma dicotomia metafísica entre corpo e alma.
theological_decisions:
- issue: Relação entre σωμάτων e ψυχὰς ἀνθρώπων
  choice: corpos e vidas humanas
  alternative: escravos, isto é, seres humanos
  rationale: A tradução conserva a linguagem concreta e desumanizadora do comércio de 'corpos', enquanto 'vidas humanas' comunica o clímax da lista. Evita transformar a expressão em afirmação doutrinária sobre duas partes constitutivas da pessoa e deixa a relação sintática deliberadamente compacta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura de catálogo foi mantida sem repetir todas as conjunções gregas, como é natural em português. 'Olíbano' distingue a resina específica do incenso genérico; 'carruagens' reflete o provável veículo civil ou luxuoso.
