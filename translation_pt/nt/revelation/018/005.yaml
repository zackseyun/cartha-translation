id: REV.18.5
reference: Revelation 18:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: pt
  text: pois os pecados dela se amontoaram até o céu[a], e Deus se lembrou dos atos injustos dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram unidos até o céu”. O verbo grego significa literalmente “colar”, “unir” ou “aderir” e, aqui, retrata os pecados acumulados como uma enorme pilha.'
    reason: lexical_alternative
  - marker: b
    text: 'Neste contexto, Deus “se lembrar” tem sentido judicial: ele não ignorou os atos injustos dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão da ordem do versículo anterior e preserva de modo natural a força causal.
- source_word: ἐκολλήθησαν
  choice: se amontoaram
  rationale: Embora o verbo signifique literalmente unir, colar ou aderir, neste contexto descreve metaforicamente pecados acumulados numa massa que chega ao céu.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: Correspondência padrão e clara para ἁμαρτίαι.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: até o céu
  rationale: Preserva diretamente a ideia de extensão vertical e corresponde de perto à construção grega.
- source_word: ἐμνημόνευσεν
  choice: se lembrou
  rationale: Mantém o verbo do texto grego e sua ambiguidade bíblica, sem explicitar na tradução a ação judicial que o contexto sugere.
- source_word: ὁ θεός
  choice: Deus
  rationale: Correspondência direta e convencional.
- source_word: ἀδικήματα
  choice: atos injustos
  rationale: Preserva a distinção em relação a ἁμαρτίαι e comunica atos de injustiça ou transgressão sem restringi-los ao sentido penal de crimes.
theological_decisions:
- issue: Distinção entre ἁμαρτίαι e ἀδικήματα
  choice: 'Traduzir por termos distintos: “pecados” e “atos injustos”'
  alternative: Traduzir ambos por “pecados” ou “iniquidades”
  rationale: O grego emprega dois substantivos relacionados, mas diferentes; manter a variação respeita a plenitude retórica sem impor uma distinção teológica rígida.
- issue: Força da lembrança de Deus
  choice: Traduzir literalmente como “Deus se lembrou”
  alternative: “Deus os levou a juízo” ou “Deus os chamou a prestar contas”
  rationale: No contexto, a lembrança divina tem consequência judicial, mas o texto usa o verbo “lembrar”; a tradução preserva essa tensão em vez de explicitá-la por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a ligação causal com o contexto; “se amontoaram até o céu” conserva a imagem vertical; “atos injustos” distingue os dois termos gregos sem soar excessivamente técnico.
