    issue: Acréscimo em «as pragas que virão sobre ela»
    rationale: O grego diz literalmente que os destinatários não recebam «das pragas dela» (ἐκ τῶν πληγῶν αὐτῆς). Embora o contexto posterior associe as pragas ao juízo de Babilônia, «que virão sobre ela» explicita uma relação temporal e direcional ausente do versículo e reduz a abertura sintática da expressão.
  revised_text: 'E ouvi outra voz vinda do céu, que dizia: “Saiam dela, povo meu, para que vocês não participem dos pecados dela e para que não recebam nenhuma das pragas dela.”'
