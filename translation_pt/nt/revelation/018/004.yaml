  verdict: revise
  source_fidelity: A tradução reproduz bem a voz adicional vinda do céu, o apelo imperativo, a participação nos pecados e a dupla construção final com ἵνα. Contudo, «que virão sobre ela» introduz explicitamente a ideia de futuro e de incidência das pragas sobre Babilônia, elementos que não são expressos nesta frase grega. O genitivo «das pragas dela» deve permanecer sem essa explicitação adicional.
  naturalness: O texto é claro, atual e apropriado ao português internacional com boa legibilidade brasileira. «Saiam dela, povo meu» e o uso de «vocês» soam naturais. «Nenhuma das pragas dela» é igualmente idiomático no contexto e evita o acréscimo interpretativo.
  terminology: «Céu», «pecados», «pragas» e a referência feminina por «dela» preservam adequadamente o vocabulário e a personificação apocalíptica. «Pragas» mantém o sentido de juízos/flagelos característico de Apocalipse sem impor uma leitura denominacional.
  issues:
