  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: pt
  text: 'E ouvi outra voz vinda do céu, que dizia: “Saiam dela, povo meu, para que vocês não participem dos pecados dela e para que não recebam nenhuma das pragas dela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: outra voz
  rationale: Expressa naturalmente uma voz adicional e distinta, sem tornar explícita uma diferença além da indicada pelo grego.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vinda do céu
  rationale: Identifica a origem da voz no âmbito celestial e se liga de modo natural a “voz” em português.
- source_word: Ἐξέλθατε
  choice: Saiam
  rationale: O imperativo aoristo plural é uma convocação direta para deixar Babilônia. “Saiam” é atual, claro e não impõe no português a perspectiva espacial sugerida por “venham”.
- source_word: ὁ λαός μου
  choice: povo meu
  rationale: Conserva a força vocativa e pactual da expressão, com ordem idiomática e digna em português.
- source_word: ἐξ αὐτῆς
  choice: dela
  rationale: Mantém a referência feminina a Babilônia, personificada no contexto como mulher e cidade.
- source_word: ἵνα μὴ συγκοινωνήσητε
  choice: para que vocês não participem
  rationale: συγκοινωνέω indica compartilhar ou tomar parte; “participem” comunica claramente a ideia de envolvimento e cumplicidade.
- source_word: ταῖς ἁμαρτίαις αὐτῆς
  choice: dos pecados dela
  rationale: É uma correspondência direta que preserva tanto o conteúdo moral e teológico de ἁμαρτίαις quanto a personificação feminina.
- source_word: ἐκ τῶν πληγῶν αὐτῆς
  choice: nenhuma das pragas que virão sobre ela
  rationale: Com λαμβάνω, ἐκ indica receber uma parte dentre as pragas destinadas a Babilônia. A formulação esclarece em português que o povo não deve sofrer nenhuma delas, sem sugerir que as receba da própria Babilônia.
- source_word: πληγῶν
  choice: pragas
  rationale: No Apocalipse, o termo designa com frequência flagelos de juízo divino e preserva as ressonâncias bíblicas desse vocabulário.
- source_word: ἵνα μὴ λάβητε
  choice: para que não recebam
  rationale: A segunda construção com ἵνα e subjuntivo é mantida como advertência coordenada, e “recebam” exprime naturalmente ficar sujeito a esses juízos.
theological_decisions:
- issue: Referente e imagem de αὐτῆς
  choice: Manter a referência feminina com “dela” e “sobre ela”.
  alternative: Empregar formas neutras como “disso” ou explicitar “da cidade”.
  rationale: Babilônia é simultaneamente cidade e figura feminina no contexto. O feminino preserva a personificação apocalíptica sem reduzir a imagem a uma interpretação específica.
- issue: Força das duas orações com ἵνα
  choice: Traduzir ambas como finalidades ou advertências coordenadas com “para que ... e para que ...”.
  alternative: Usar “para não ... nem ...” ou uma construção com “a fim de que”.
  rationale: A repetição conserva a estrutura e a ênfase retórica do grego, sem decidir rigidamente entre propósito e resultado pretendido.
- issue: Relação entre os pecados e as pragas de Babilônia
  choice: Distinguir participação nos pecados de recebimento das pragas destinadas a ela.
  alternative: Traduzir literalmente “recebam das pragas dela”, deixando a relação sintática mais aberta.
  rationale: O contexto associa as pragas ao juízo que recai sobre Babilônia. A tradução evita a leitura enganosa de que Babilônia seja a fonte das pragas, sem identificar em detalhe sua natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o número do imperativo e dos subjuntivos. Preserva-se a personificação feminina de Babilônia e a repetição das duas advertências.
