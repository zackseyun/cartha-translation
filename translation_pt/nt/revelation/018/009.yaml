    issue: Escopo de «com ela» e âncora da nota b
    rationale: Na redação atual, «com ela» segue imediatamente «viveram no luxo» e é lido naturalmente como complemento apenas desse verbo. Além disso, a nota b, que explica a expressão sexual e sua associação com ela, está ancorada em «incêndio». A expressão deve ser posicionada e ancorada junto às duas ações que qualifica.
  - severity: low
    issue: «por causa dela» para ἐπ’ αὐτήν
    rationale: A construção grega apresenta Babilônia como aquela por quem/por cuja ruína se lamenta. «Por ela» preserva essa relação de objeto de lamento; «por causa dela» pode deslocar o sentido para uma causa do sofrimento.
  - severity: low
    issue: Alternativa da nota a
    rationale: «Se baterão de pesar» não é a formulação portuguesa mais natural para o gesto de luto evocado por κόψονται. «Baterão no peito» comunica melhor a alternativa imagética sem sugerir automutilação.
