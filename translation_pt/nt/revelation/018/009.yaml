source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: pt
  text: Os reis da terra que, com ela[b], cometeram imoralidade sexual e viveram no luxo chorarão e se lamentarão por ela[a], quando virem a fumaça do seu incêndio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “baterão no peito”. O verbo grego evoca uma lamentação intensa e demonstrativa.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “cometeram imoralidade sexual com ela” provavelmente participa da imagem recorrente do Apocalipse para alianças corruptas e idólatras, sem perder a linguagem sexual do grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: chorarão
  rationale: Expressa de modo natural o choro audível e a lamentação indicados pelo futuro de κλαίω.
- source_word: κόψονται
  choice: se lamentarão
  rationale: No contexto de luto, o verbo descreve uma manifestação intensa de pesar; a formulação evita sugerir que o foco seja ferir-se literalmente.
- source_word: ἐπ’ αὐτὴν
  choice: por causa dela
  rationale: Com verbos de lamentação, ἐπί com acusativo apresenta aquela cuja desgraça provoca o lamento. Esta opção é clara em português e mantém a relação causal e objetiva.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: os reis da terra
  rationale: É a expressão apocalíptica corrente para os governantes do mundo e corresponde ao alcance do contexto.
- source_word: μετ’ αὐτῆς
  choice: com ela
  rationale: Preserva diretamente a associação expressa por μετά com genitivo. Sua posição após os verbos coordenados permite que se relacione naturalmente com ambos.
- source_word: πορνεύσαντες
  choice: cometeram imoralidade sexual
  rationale: Mantém a imagem sexual explícita de πορνεύω sem reduzi-la antecipadamente a uma interpretação apenas política ou religiosa.
- source_word: στρηνιάσαντες
  choice: viveram no luxo
  rationale: Comunica em linguagem atual a vida luxuosa, indulgente e excessiva indicada pelo verbo.
- source_word: ὅταν βλέπωσιν
  choice: quando virem
  rationale: Reproduz naturalmente em português a contingência futura de ὅταν com o subjuntivo presente.
- source_word: τὸν καπνὸν
  choice: a fumaça
  rationale: Equivalente direto e idiomático no português moderno.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: do seu incêndio
  rationale: πύρωσις designa a queima ou conflagração. “Incêndio” comunica de modo natural a destruição pelo fogo sem importar a linguagem específica de versículos próximos.
theological_decisions:
- issue: Natureza da imagem de imoralidade sexual da Babilônia
  choice: Manter “cometeram imoralidade sexual” no texto principal, com nota sobre sua provável dimensão metafórica.
  alternative: Traduzir de modo abstrato como “foram infiéis” ou “praticaram corrupção com ela”.
  rationale: Apocalipse emprega repetidamente a prostituição e a imoralidade sexual como imagens de alianças idólatras e corruptas. Preservar a terminologia sexual mantém a metáfora profética e sua tensão interpretativa.
- issue: Sentido de κόψονται
  choice: Traduzir pelo sentido idiomático “se lamentarão”.
  alternative: “Baterão no peito” ou, de modo excessivamente literal, “se cortarão”.
  rationale: Neste contexto, o verbo indica luto demonstrativo. Uma tradução corporal rígida poderia levar o leitor a entender que a automutilação, e não a lamentação, é o ponto central.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem dos elementos foi ajustada para fluência, preservando a coordenação grega e a ambiguidade metafórica.
