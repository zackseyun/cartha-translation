review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os verbos futuros, a dupla ação de chorar e lamentar, os reis da terra e a fumaça do incêndio. Contudo, a posição de «com ela» após «viveram no luxo» tende, em português, a vinculá-lo somente a este último verbo, enquanto μετ’ αὐτῆς se associa às duas ações coordenadas no grego. «Por ela» representa melhor o objeto do lamento em ἐπ’ αὐτήν do que «por causa dela», que pode sugerir uma causa distinta do sofrimento dos reis.
  naturalness: O registro é moderno e claro. A antecipação de «com ela», entre vírgulas, torna o escopo da expressão inequívoco sem sacrificar fluência. «Baterão no peito» é uma alternativa idiomática e mais precisa para a expressão de luto do que «se baterão de pesar».
  terminology: «Imoralidade sexual», «viveram no luxo», «reis da terra» e «incêndio» são escolhas adequadas. A nota sobre a metáfora mantém, apropriadamente, a imagem sexual sem fixar uma interpretação confessional.
  issues:
