revisions:
- from: Os reis da terra que cometeram imoralidade sexual e viveram no luxo com ela chorarão e se lamentarão por causa dela[a] quando virem a fumaça do seu incêndio.[b]
  to: Os reis da terra que, com ela[b], cometeram imoralidade sexual e viveram no luxo chorarão e se lamentarão por ela[a], quando virem a fumaça do seu incêndio.
  rationale: A revisão torna explícito que «com ela» se relaciona tanto a «cometeram imoralidade sexual» quanto a «viveram no luxo», reposiciona a nota interpretativa junto à expressão que explica e ajusta «por ela» ao uso de ἐπί com acusativo em contexto de lamento. A nota lexical de κόψονται foi formulada em português mais idiomático.
