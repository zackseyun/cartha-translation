source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: pt
  text: pois, em uma só hora, tamanha riqueza foi devastada. E todo capitão de navio, todos os que navegam para algum destino[a], os marinheiros e todos os que trabalham no mar ficaram à distância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que navegam para um lugar”; possivelmente, “todos os que navegam para um porto”. A expressão grega é idiomática e pode referir-se de modo amplo aos que viajam por mar para diferentes destinos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a explicação ou o conteúdo do lamento anterior, mantendo uma ligação natural com o contexto.
- source_word: μιᾷ ὥρᾳ
  choice: em uma só hora
  rationale: Expressa o dativo temporal e ressalta a rapidez repentina da devastação sem decidir se a hora deve ser entendida de modo estritamente literal.
- source_word: ἠρημώθη
  choice: foi devastada
  rationale: Comunica a ideia de arruinar e deixar desolado em português atual e digno.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: tamanha riqueza
  rationale: Preserva de modo conciso a intensidade de τοσοῦτος e o tom de assombro do lamento.
- source_word: πᾶς κυβερνήτης
  choice: todo capitão de navio
  rationale: No contexto marítimo, designa quem dirige ou governa a embarcação; a explicitação de 'navio' evita a ambiguidade moderna de 'capitão'.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: todos os que navegam para algum destino
  rationale: Mantém a referência explícita ao deslocamento marítimo para um lugar sem restringir indevidamente o grupo a passageiros, mercadores ou a um porto específico.
- source_word: ναῦται
  choice: os marinheiros
  rationale: Equivalente moderno, claro e direto para os trabalhadores que tripulam embarcações.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: todos os que trabalham no mar
  rationale: Preserva uma categoria mais ampla que a dos marinheiros e mantém a imagem concreta do trabalho ligado ao mar.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: ficaram de longe
  rationale: Traduz a posição assumida a distância em português natural; o contexto comunica que permaneceram afastados.
theological_decisions:
- issue: Abrangência dos grupos marítimos no lamento pela queda de Babilônia
  choice: Manter distintos o capitão, os viajantes por mar, os marinheiros e todos os que trabalham no mar
  alternative: Fundir a enumeração em uma categoria geral, como 'todos os navegantes', ou identificar os viajantes especificamente como passageiros ou mercadores
  rationale: O grego coordena grupos diferentes para retratar a amplitude da perda econômica. Preservar a enumeração evita acrescentar uma identificação não explícita e conserva a força retórica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'tamanha riqueza' para conservar a intensidade retórica e mantém a enumeração marítima sem arcaísmos. A nota registra a ambiguidade da expressão ἐπὶ τόπον sem estreitar seu sentido.
