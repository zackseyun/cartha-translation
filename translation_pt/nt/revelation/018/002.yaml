reference: Revelation 18:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: pt
  text: 'E ele clamou com voz poderosa, dizendo: “Caiu, caiu Babilônia, a Grande! Ela se tornou morada de demônios, prisão[a] de todo espírito imundo, prisão de toda ave imunda e prisão de toda fera imunda e odiada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “covil”. A palavra grega traduzida como “prisão” também pode indicar um lugar habitado ou frequentado; o mesmo vale para as outras duas ocorrências de “prisão” neste versículo.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem “e prisão de toda fera imunda e odiada”.
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν
  choice: clamou
  rationale: Expressa um brado forte e solene, adequado ao registro apocalíptico, sem recorrer a uma formulação coloquial.
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: com voz poderosa
  rationale: Preserva a ideia de força de ἰσχυρᾷ e traduz naturalmente o valor de modo ou instrumento da expressão.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Caiu, caiu
  rationale: Mantém a repetição enfática, a forma verbal finita e a cadência profética do anúncio de juízo.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babilônia, a Grande
  rationale: Conserva a estrutura apositiva e o caráter de designação recorrente no Apocalipse.
- source_word: ἐγένετο
  choice: se tornou
  rationale: Comunica tanto a mudança quanto o estado resultante descrito depois da queda.
- source_word: κατοικητήριον
  choice: morada
  rationale: É uma palavra atual, clara e digna para um lugar de habitação.
- source_word: δαιμονίων
  choice: demônios
  rationale: Traduz diretamente o substantivo grego, sem ampliá-lo para a categoria mais geral de espíritos malignos.
- source_word: φυλακὴ
  choice: prisão
  rationale: Preserva o sentido de lugar de confinamento ou guarda; como o termo também pode indicar um lugar ocupado ou frequentado, a alternativa é registrada em nota.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: todo espírito impuro
  rationale: Mantém a terminologia bíblica e cultual de ἀκάθαρτος sem substituir a expressão por uma interpretação.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: toda ave impura
  rationale: Traduz ὄρνεον de modo geral, sem especificar aves de rapina ou necrófagas, o que o grego não explicita.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: toda fera impura e odiada
  rationale: Aqui θηρίον é um nome comum dentro de uma série de criaturas, e não o título do antagonista apocalíptico. “Odiada” conserva o valor passivo e resultativo do particípio perfeito μεμισημένου.
theological_decisions:
- issue: Se θηρίου deve ser entendido como o título apocalíptico “a Besta” ou como nome comum
  choice: nome comum, “fera”
  alternative: “Besta”, como título do antagonista apocalíptico
  rationale: O substantivo é regido por παντός e aparece numa série com espírito e ave; a sintaxe favorece uma referência genérica a criaturas, sem identificação com a Besta de outras passagens.
- issue: Sentido de φυλακή na cena de juízo
  choice: “prisão” no texto, com alternativa em nota
  alternative: “covil”, “refúgio” ou “lugar frequentado”
  rationale: “Prisão” deixa visível o sentido de confinamento ou guarda, enquanto a nota preserva a possibilidade contextual de um lugar habitado ou frequentado por seres impuros.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “prisão” reproduz a estrutura retórica grega. A vírgula em “Babilônia, a Grande” sinaliza a aposição, e “fera” permanece em minúscula para evitar uma identificação indevida com a Besta apocalíptica.
