id: REV.18.12
reference: Revelation 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: pt
  text: carga de ouro, prata, pedras preciosas, pérolas, linho fino, tecido púrpura, seda e tecido escarlate, e todo tipo de madeira de tuia[a], todo tipo de objeto de marfim, todo tipo de objeto feito de madeira preciosíssima, bronze, ferro e mármore,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira aromática”; a identificação exata da árvore é incerta. Tradicionalmente, o termo também é transliterado como “madeira tíina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: carga
  rationale: Designa a carga ou mercadoria transportada por um navio; o singular coletivo é natural em português e dá continuidade à lista comercial do versículo anterior.
- source_word: λίθου τιμίου
  choice: pedras preciosas
  rationale: Embora o grego tenha o singular, ele funciona coletivamente; o plural é a forma idiomática em português nesta enumeração.
- source_word: μαργαριτῶν
  choice: pérolas
  rationale: Equivalente lexical direto, preservando o plural grego.
- source_word: βυσσίνου
  choice: linho fino
  rationale: Expressa o tecido fino e luxuoso designado por βύσσινος de modo claro e tradicional.
- source_word: πορφύρας
  choice: tecido púrpura
  rationale: No contexto de mercadorias, explicita naturalmente que se trata de material têxtil, sem restringir a palavra a corante ou vestimenta.
- source_word: σιρικοῦ
  choice: seda
  rationale: Forma portuguesa corrente para o tecido ou produto de seda referido pelo termo grego.
- source_word: κοκκίνου
  choice: tecido escarlate
  rationale: No paralelismo com πορφύρας, identifica com clareza a mercadoria têxtil de cor escarlate.
- source_word: πᾶν ξύλον θύϊνον
  choice: todo tipo de madeira de tuia
  rationale: θύϊνος designa uma madeira aromática e valiosa, provavelmente da árvore hoje associada à tuia; a transliteração adaptada evita a identificação potencialmente enganosa com madeira de cidreira.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: todo tipo de objeto de marfim
  rationale: σκεῦος é amplo e pode indicar utensílio, recipiente ou artigo; 'objeto' conserva essa abrangência melhor que 'vaso'.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: todo tipo de objeto feito de madeira preciosíssima
  rationale: Mantém a repetição de σκεῦος e representa a forma superlativa τιμιωτάτου, ainda que ela também possa ter força intensiva.
- source_word: χαλκοῦ
  choice: bronze
  rationale: χαλκός pode designar cobre ou bronze; 'bronze' é a opção mais provável e corrente para artigos antigos nesta lista de materiais.
- source_word: σιδήρου
  choice: ferro
  rationale: Equivalente lexical direto.
- source_word: μαρμάρου
  choice: mármore
  rationale: Equivalente lexical direto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece como fragmento de uma lista que continua o versículo anterior, por isso começa com minúscula e termina em vírgula. 'Objeto' foi preferido a 'vaso' para preservar a amplitude de σκεῦος.
