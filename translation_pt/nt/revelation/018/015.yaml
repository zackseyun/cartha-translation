id: REV.18.15
reference: Revelation 18:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: pt
  text: Os comerciantes dessas coisas[a], que enriqueceram às custas dela, ficarão à distância, por medo do tormento dela, chorando e lamentando,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dessas mercadorias” ou “desses produtos”; a expressão retoma os artigos de luxo enumerados no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: comerciantes
  rationale: Designa pessoas envolvidas no comércio; “comerciantes” é corrente, claro e adequado ao contexto econômico.
- source_word: τούτων
  choice: dessas coisas
  rationale: O demonstrativo no genitivo retoma os artigos de luxo enumerados no contexto, sem tornar explícito mais do que o grego.
- source_word: πλουτήσαντες
  choice: que enriqueceram
  rationale: Expressa de modo natural a riqueza adquirida anteriormente pelos comerciantes.
- source_word: ἀπ’ αὐτῆς
  choice: por causa dela
  rationale: Neste contexto, ἀπό indica que a mulher/cidade foi a fonte ou base do enriquecimento; a expressão portuguesa evita sugerir que receberam diretamente a riqueza das mãos dela.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressão natural para a distância espacial deliberadamente mantida pelos comerciantes.
- source_word: στήσονται
  choice: ficarão
  rationale: No contexto, comunica que permanecerão posicionados à distância; soa mais natural em português do que “estarão de pé”.
- source_word: διὰ τὸν φόβον
  choice: com medo
  rationale: Comunica com clareza a causa de manterem distância, em construção portuguesa corrente.
- source_word: βασανισμοῦ
  choice: tormento
  rationale: Preserva a intensidade do sofrimento punitivo no juízo apocalíptico sem restringi-lo à noção moderna de tortura.
- source_word: κλαίοντες
  choice: chorando
  rationale: Representa o choro audível e mantém um registro natural e digno.
- source_word: πενθοῦντες
  choice: lamentando
  rationale: Preserva a ideia de luto e pesar, distinguindo-a do ato de chorar expresso pelo particípio anterior.
theological_decisions:
- issue: Natureza de βασανισμός na linguagem apocalíptica de juízo
  choice: tormento
  alternative: castigo; aflição
  rationale: O contexto imediato descreve o juízo da Babilônia, e “tormento” conserva a gravidade do sofrimento punitivo sem acrescentar uma doutrina detalhada sobre o castigo final.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo solene de Apocalipse e preserva a referência feminina à cidade personificada. A vírgula final foi mantida por o versículo continuar sintaticamente no seguinte.
