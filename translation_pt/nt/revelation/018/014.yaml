id: REV.18.14
reference: Revelation 18:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: pt
  text: O fruto que a sua alma desejava se afastou de você, e todas as coisas luxuosas e esplêndidas se perderam para você; nunca mais serão encontradas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nunca mais as encontrarão”; o sujeito do verbo grego não é expresso.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: fruto
  rationale: Designa fruto, especialmente fruto maduro ou tardio; mantém a imagem concreta no contexto da lista de mercadorias e luxos.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: que a sua alma desejava
  rationale: Expressa de modo natural a cadeia de genitivos, preservando tanto a ideia de desejo intenso quanto a referência explícita à alma.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: foi embora de você
  rationale: Reproduz o afastamento indicado pelo verbo e pela preposição em linguagem atual, com ênfase no estado de perda resultante.
- source_word: πάντα τὰ λιπαρὰ
  choice: todas as coisas requintadas
  rationale: No contexto comercial, λιπαρά indica abundância, luxo ou suntuosidade, não apenas alimentos gordurosos.
- source_word: τὰ λαμπρὰ
  choice: esplêndidas
  rationale: Comunica brilho, magnificência e ostentação no contexto dos bens luxuosos.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: desapareceram de você
  rationale: O singular neutro com sujeito composto coletivo admite tradução plural em português; 'desapareceram' comunica a perda dos bens sem sugerir necessariamente destruição física.
- source_word: οὐκέτι οὐ μὴ
  choice: nunca mais
  rationale: Transmite de forma idiomática a negação grega fortemente enfática e definitiva.
- source_word: αὐτὰ εὑρήσουσιν
  choice: serão encontradas
  rationale: A forma ativa na terceira pessoa do plural tem sujeito não expresso e pode ter sentido indefinido. A formulação passiva em português evita acrescentar agentes concretos.
theological_decisions:
- issue: Sujeito implícito de εὑρήσουσιν
  choice: 'Sentido indefinido expresso passivamente: ''serão encontradas'''
  alternative: '''não mais as encontrarão'', com sujeito humano indefinido'
  rationale: O grego não identifica quem procuraria ou encontraria essas coisas. A passiva preserva essa indeterminação e destaca a irrevogabilidade da perda sem introduzir um agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Requintadas' evita limitar λιπαρά a comida e comunica luxo; 'esplêndidas' conserva o caráter vistoso de λαμπρά. A colocação do marcador ao fim vincula a nota à oração sobre encontrar os bens.
