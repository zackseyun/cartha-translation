review_pass:
  verdict: revise
  source_fidelity: 'O sentido geral está bem preservado: ὀπώρα é corretamente traduzido por “fruto”; a referência à alma e ao seu desejo é mantida; os bens luxuosos e vistosos são contemplados; e a negação enfática final é adequadamente expressa por “nunca mais”. A passiva portuguesa em “serão encontradas” comunica de modo aceitável o valor indefinido da terceira pessoa plural grega, embora a alternativa ativa mereça nota.'
  naturalness: “Foi embora de você” é muito coloquial para o lamento solene e elevado de Apocalipse. “Desapareceram de você” também é menos idiomático para a perda definitiva de bens. Uma formulação como “se afastou de você” e “se perderam para você” mantém clareza moderna e registro digno, sem arcaísmo.
  terminology: “Requintadas e esplêndidas” é defensável, mas “luxuosas e esplêndidas” comunica mais diretamente o campo semântico de λιπαρά no contexto de bens de opulência. “Alma” é corretamente preservado.
  issues:
  - severity: medium
    issue: Registro excessivamente coloquial em “foi embora de você”.
    rationale: Embora transmita a ideia básica de ἀπῆλθεν ἀπὸ σοῦ, “foi embora” destoa do tom de lamento profético e solene do contexto.
  - severity: low
    issue: “Desapareceram de você” é uma construção pouco natural para ἀπώλετο ἀπὸ σοῦ.
    rationale: O grego exprime perda irreversível dos bens em relação a Babilônia. “Se perderam para você” torna essa relação mais idiomática em português e conserva a ideia de perda.
  revised_text: O fruto que a sua alma desejava se afastou de você, e todas as coisas luxuosas e esplêndidas se perderam para você; nunca mais serão encontradas.[a]
  revised_footnotes:
