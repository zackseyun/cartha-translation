  to: O fruto que a sua alma desejava se afastou de você, e todas as coisas luxuosas e esplêndidas se perderam para você; nunca mais serão encontradas.[a]
  rationale: A revisão eleva o registro da primeira oração e torna mais natural a expressão da perda dos bens, preservando o sentido do grego e a indeterminação do sujeito na oração final. “Luxuosas” explicita de maneira mais transparente o valor contextual de λιπαρά.
