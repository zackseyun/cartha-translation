id: REV.18.16
reference: Revelation 18:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: pt
  text: 'dizendo: “Ai, ai da grande cidade, vestida de linho fino, púrpura e escarlate, e adornada com ouro, pedras preciosas e pérolas!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente ativo plural introduz a fala de lamentação e mantém a ligação sintática com o versículo anterior sem explicitar novamente o sujeito.
- source_word: Οὐαὶ οὐαί
  choice: Ai! Ai
  rationale: A interjeição portuguesa preserva tanto o lamento quanto a tonalidade profética de juízo; a repetição mantém a intensidade do grego.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: a grande cidade
  rationale: Forma natural em português para a construção grega com artigo repetido, preservando a ênfase na grandeza da cidade.
- source_word: περιβεβλημένη
  choice: vestida de
  rationale: O particípio perfeito descreve o estado luxuoso da cidade personificada; a expressão é clara, natural e digna em português.
- source_word: βύσσινον
  choice: linho fino
  rationale: Designa tecido de linho fino e valioso, elemento importante da imagem de luxo.
- source_word: πορφυροῦν
  choice: púrpura
  rationale: Conserva a cor associada à riqueza e à realeza e funciona naturalmente na enumeração de tecidos ou cores.
- source_word: κόκκινον
  choice: escarlate
  rationale: Termo preciso e tradicional para a cor intensa presente na imagética apocalíptica, sem reduzi-la ao genérico 'vermelho'.
- source_word: κεχρυσωμένη
  choice: adornada com
  rationale: Como o particípio rege uma lista que inclui ouro, pedra preciosa e pérola, 'adornada com' expressa melhor a ornamentação luxuosa do que uma referência estrita a douramento.
- source_word: χρυσίῳ
  choice: ouro
  rationale: Tradução direta do material empregado na ornamentação.
- source_word: λίθῳ τιμίῳ
  choice: pedras preciosas
  rationale: Embora o grego use o singular, este pode ter valor coletivo; o plural é mais natural em português numa enumeração de materiais luxuosos.
- source_word: μαργαρίτῃ
  choice: pérolas
  rationale: O singular grego pode funcionar coletivamente; o plural comunica naturalmente a ornamentação abundante em português.
theological_decisions:
- issue: Tom do lamento pela queda da Babilônia
  choice: Traduzir οὐαί por “Ai” para preservar simultaneamente lamento e juízo
  alternative: “Que tristeza” ou “Lamentável” para destacar sobretudo a dor
  rationale: No contexto do oráculo de juízo de Apocalipse, “Ai” mantém a força profético-apocalíptica e não reduz a exclamação a mero pesar.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem arcaísmo. A pontuação separa as duas exclamações para reproduzir a intensidade da repetição; o fechamento exclamativo abrange a fala de lamentação.
