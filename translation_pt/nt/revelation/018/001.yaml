id: REV.18.1
reference: Revelation 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: pt
  text: Depois dessas coisas, vi outro anjo descendo do céu[a], com grande autoridade; e a terra foi iluminada por sua glória.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descendo desde o céu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “a terra foi iluminada a partir de sua glória”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva o plural ταῦτα e a sequência das visões, em português natural.
- source_word: εἶδον
  choice: vi
  rationale: Traduz diretamente o aoristo de ὁράω, sem acrescentar nuances ausentes no texto.
- source_word: ἄλλον ἄγγελον
  choice: outro anjo
  rationale: Expressa naturalmente ἄλλον no contexto da sequência visionária.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: descendo do céu
  rationale: O particípio presente descreve a ação vista em andamento; «do céu» comunica com naturalidade a origem expressa por ἐκ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Ele tinha grande autoridade
  rationale: ἐξουσία indica autoridade, direito ou poder conferido, e não apenas força; a oração independente favorece a clareza em português.
- source_word: ἡ γῆ
  choice: a terra
  rationale: A imagem de iluminação abrangente favorece o sentido cósmico de γῆ, não o de uma região localizada.
- source_word: ἐφωτίσθη
  choice: foi iluminada
  rationale: Mantém a voz passiva e o tom elevado da cena.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: por sua glória
  rationale: Traduz de modo idiomático ἐκ como fonte ou causa da iluminação, preservando em nota a forma mais literal.
theological_decisions:
- issue: Natureza da glória e da autoridade do anjo
  choice: O texto atribui ao anjo grande autoridade e uma glória que ilumina a terra, sem identificá-lo como divino.
  alternative: A intensidade da descrição pode levar a uma leitura especialmente elevada da figura angélica.
  rationale: A tradução conserva sem atenuação tanto «grande autoridade» quanto «sua glória», mas não acrescenta uma identificação teológica que o grego não faz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma cadeia participial pesada sem alterar as relações do grego.
