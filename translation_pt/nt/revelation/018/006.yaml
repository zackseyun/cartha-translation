  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: pt
  text: Retribuam-lhe como ela mesma retribuiu[a] e deem-lhe o dobro conforme as suas obras; no cálice em que ela misturou a bebida[b], misturem para ela uma porção dupla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dupliquem as coisas duplas”; a expressão grega é enfática e condensada e pode destacar uma retribuição intensificada.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o cálice cuja bebida ela preparou ao misturá-la; a imagem provavelmente evoca uma bebida de juízo preparada.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Retribuam a ela
  rationale: O imperativo pede retribuição judicial. A formulação é natural em português e mantém o sentido de dar em retorno segundo os atos praticados.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: como ela mesma retribuiu
  rationale: “Ela mesma” preserva a ênfase de αὐτή, enquanto o pretérito perfeito expressa a ação anterior que fundamenta a ordem.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: deem-lhe em dobro
  rationale: A expressão grega é comprimida e enfática. Esta tradução comunica a retribuição duplicada sem reproduzir uma construção pouco natural em português; a alternativa mais literal é registrada em nota.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: conforme as suas obras
  rationale: Preserva o valor lexical de ἔργα e o tom judicial de retribuição correspondente às ações dela.
- source_word: ποτηρίῳ
  choice: cálice
  rationale: Termo tradicional e ainda compreensível, adequado à imagem simbólica recorrente do cálice no Apocalipse e nos profetas.
- source_word: ἐκέρασεν
  choice: preparou a mistura
  rationale: κεράννυμι designa misturar ou preparar uma bebida mediante mistura. A expressão torna a ação clara sem reduzi-la simplesmente a “derramar”.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: preparem para ela uma porção dobrada
  rationale: Retoma a imagem da preparação do cálice e expressa de modo idiomático a medida duplicada indicada por διπλοῦν.
theological_decisions:
- issue: Natureza da ordem de retribuição em dobro
  choice: Manter a imagem de retribuição judicial e intensificada, sem determinar que o dobro seja uma fórmula matemática estrita.
  alternative: Interpretar “em dobro” como penalidade quantitativa literal ou diluir a expressão numa afirmação genérica de justiça.
  rationale: A linguagem apocalíptica apresenta o juízo contra Babilônia por meio de retribuição e de um cálice em medida dobrada. A tradução conserva tanto a severidade quanto a tensão entre proporcionalidade (“conforme as suas obras”) e intensificação (“em dobro”).
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural dos imperativos reproduz a forma grega. “Retribuam” mantém o tom judicial; “cálice” preserva a imagem bíblica; as notas conservam a força e a ambiguidade da formulação grega.
