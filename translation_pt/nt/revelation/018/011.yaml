id: REV.18.11
reference: Revelation 18:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: pt
  text: E os comerciantes da terra[a] choram e pranteiam por ela, porque ninguém mais compra a carga deles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da região”. O termo grego pode significar tanto “terra” em sentido amplo como “região” ou “país”. Em Apocalipse, a expressão frequentemente tem alcance mundial.
    reason: lexical_alternative
  - marker: b
    text: Ou “as mercadorias deles”. O termo grego pode designar a carga de um navio ou, por extensão, bens comerciais; “carga” ressalta o contexto marítimo e mercantil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: comerciantes
  rationale: “Comerciantes” é a designação corrente e abrangente para pessoas envolvidas no comércio, adequada ao contexto econômico e marítimo de Apocalipse 18.
- source_word: τῆς γῆς
  choice: da terra
  rationale: γῆ pode significar “terra” ou “região”. Neste contexto de juízo apocalíptico, “da terra” preserva melhor o horizonte amplo da expressão sem excluir a alternativa local.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: choram e pranteiam
  rationale: 'A formulação mantém distintos os dois verbos e sua intensificação retórica: κλαίω indica chorar, enquanto πενθέω indica prantear ou estar de luto.'
- source_word: ἐπ’ αὐτήν
  choice: por ela
  rationale: Com verbos de lamento, ἐπί com acusativo pode indicar a pessoa ou realidade pela qual se lamenta. “Por ela” é natural em português e conserva a personificação feminina de Babilônia.
- source_word: γόμον
  choice: carga
  rationale: γόμος designa uma carga transportada, especialmente a carga de um navio. “Carga” é precisa no contexto comercial e marítimo e prepara a lista de bens dos versículos seguintes.
- source_word: αὐτῶν
  choice: deles
  rationale: O pronome genitivo indica que a carga pertence aos comerciantes. “Deles” evita a possível ambiguidade de “sua” em português.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: ninguém mais compra
  rationale: A expressão comunica de modo idiomático o presente de ἀγοράζει e a cessação indicada por οὐκέτι.
theological_decisions:
- issue: Referente e personificação de Babilônia
  choice: Manter a referência feminina em “por ela”
  alternative: Empregar uma referência neutra ou impessoal, como “por isso”
  rationale: Apocalipse apresenta Babilônia como mulher e cidade personificadas. A referência feminina preserva essa imagem literária e teológica sem identificar além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Pranteiam” conserva a distinção entre os dois verbos de lamento sem tornar a frase excessivamente arcaica. Os marcadores de nota foram colocados junto aos termos a que efetivamente se referem.
