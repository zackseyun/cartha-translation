id: REV.18.20
reference: Revelation 18:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: pt
  text: Alegre-se por causa dela, ó céu; alegrem-se também vocês, santos, apóstolos e profetas, porque Deus julgou a causa de vocês contra ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é condensado: literalmente, “Deus julgou o julgamento de vocês dela”. A expressão pode ser entendida como “Deus pronunciou julgamento contra ela em favor de vocês”, “Deus decidiu a causa de vocês contra ela” ou, mais interpretativamente, “Deus vingou vocês contra ela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Alegre-se
  rationale: Preserva a força do imperativo singular dirigido ao céu personificado, em linguagem atual e digna.
- source_word: ἐπ’ αὐτῇ
  choice: por causa dela
  rationale: Com um verbo de alegria, ἐπί com dativo pode indicar o objeto ou a ocasião da alegria; esta formulação é natural em português e mantém a referência à queda da Babilônia.
- source_word: οὐρανέ
  choice: ó céu
  rationale: Mantém o vocativo singular e a personificação do céu.
- source_word: οἱ ἅγιοι
  choice: santos
  rationale: É a forma concisa e tradicional para os integrantes do povo santo de Deus, sem acrescentar uma explicação ao texto.
- source_word: οἱ ἀπόστολοι
  choice: apóstolos
  rationale: O sentido técnico é o mais provável neste contexto, sobretudo em paralelo com os profetas.
- source_word: οἱ προφῆται
  choice: profetas
  rationale: Equivalente corrente e direto do termo grego.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da ordem para que se alegrem.
- source_word: ἔκρινεν
  choice: julgou
  rationale: Reproduz o verbo judicial κρίνω e mantém sua ligação lexical com κρίμα.
- source_word: τὸ κρίμα ὑμῶν
  choice: o julgamento de vocês
  rationale: Conserva a expressão nominal comprimida e o cognato de 'julgou', sem substituí-la no texto principal por 'vingou' ou 'defendeu a causa'.
- source_word: ἐξ αὐτῆς
  choice: contra ela
  rationale: No contexto judicial, comunica de modo inteligível que o julgamento é cobrado da Babilônia; a nota registra a construção grega incomum e outras possibilidades interpretativas.
theological_decisions:
- issue: Até que ponto explicitar que a ação judicial de Deus vindica os santos contra a Babilônia
  choice: Manter no texto principal a repetição judicial 'julgou ... o julgamento de vocês', com 'contra ela'.
  alternative: Deus a julgou por causa de vocês; Deus vingou vocês nela; Deus decidiu a causa de vocês contra ela.
  rationale: O grego emprega κρίνω e κρίμα, não um verbo explícito de vingança. A redação conserva essa ligação lexical e parte da compressão da frase, enquanto a nota esclarece os sentidos prováveis sem transformar um deles na única leitura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O vocativo 'ó céu' preserva o tom elevado; 'vocês' torna explícito o plural dos grupos convocados sem recorrer a formas regionais como 'vós'.
