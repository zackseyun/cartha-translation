review_pass:
  verdict: revise
  source_fidelity: A redação preserva corretamente os interlocutores e o motivo judicial da celebração, mas «julgou contra ela o julgamento de vocês» é sintaticamente pouco natural em português e torna a construção grega mais opaca do que necessário. «Julgou a causa de vocês contra ela» mantém o campo judicial e exprime de modo fiel a ação de Deus em favor dos destinatários contra Babilônia, sem substituir o julgamento por uma afirmação explícita de vingança.
  naturalness: «Alegre-se por causa dela, ó céu, e também vocês...» combina um imperativo singular com destinatários plurais sem articulação suficientemente clara. A repetição de imperativos em português torna explícita a dupla convocação, preservando o singular dirigido ao céu e o plural dirigido aos demais grupos. «A causa de vocês» é uma expressão jurídica moderna e natural.
  terminology: «Santos», «apóstolos», «profetas» e «ó céu» são adequados. «Causa» para κρίμα, em conjunto com «julgou», conserva o registro forense e evita tanto o literalismo ininteligível «julgou o julgamento» quanto a interpretação mais carregada «vingou».
  issues:
  - severity: medium
    issue: Construção judicial pouco natural no texto principal
    rationale: «Deus julgou contra ela o julgamento de vocês» não é uma colocação idiomática em português. «Deus julgou a causa de vocês contra ela» comunica o sentido jurídico provável de τὸ κρίμα ὑμῶν ἐξ αὐτῆς sem fazer da vingança a única leitura.
  - severity: low
    issue: Articulação do imperativo singular e dos destinatários plurais
    rationale: O grego inicia com um imperativo singular para o céu e coordena os demais convocados. Em português atual, explicitar «alegrem-se também vocês» evita que «alegre-se» pareça reger inadequadamente toda a lista plural.
