id: REV.18.23
reference: Revelation 18:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: pt
  text: E a luz de uma lamparina nunca mais brilhará em você, e a voz do noivo e da noiva nunca mais será ouvida em você; pois os seus mercadores eram os poderosos da terra[a], porque, por meio da sua feitiçaria[b], todas as nações foram desencaminhadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os grandes da terra» ou «os magnatas da terra». O termo grego se refere a pessoas de grande destaque ou poder.
    reason: lexical_alternative
  - marker: b
    text: Ou «artes mágicas». O termo grego φαρμακεία se refere à feitiçaria ou a práticas mágicas usadas para enganar.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: a luz de uma lamparina
  rationale: Reproduz naturalmente a construção genitiva e mantém a imagem de uma pequena lâmpada doméstica do mundo antigo.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: nunca mais brilhará
  rationale: A combinação οὐ μή com o subjuntivo expressa negação enfática; «nunca mais» comunica em português tanto a força da negação como a cessação indicada por ἔτι.
- source_word: ἐν σοὶ
  choice: em você
  rationale: Preserva a interpelação direta à Babilônia personificada, sem substituir a imagem por uma explicação como «em seu meio».
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: a voz do noivo e da noiva
  rationale: Mantém o sentido básico de φωνή e o eco da linguagem profética de juízo, em formulação clara e atual.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: nunca mais será ouvida
  rationale: Conserva a voz passiva e traduz a negação enfática de modo idiomático.
- source_word: οἱ ἔμποροί σου
  choice: os seus mercadores
  rationale: Expressa adequadamente os comerciantes envolvidos no cenário econômico de Apocalipse 18.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: os poderosos da terra
  rationale: Comunica posição elevada, influência e poder sem restringir o termo a nobres hereditários ou magnatas econômicos.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: por meio da sua feitiçaria
  rationale: φαρμακεία designa práticas mágicas ou feitiçaria; a formulação evita a associação moderna indevida com produtos farmacêuticos.
- source_word: ἐπλανήθησαν
  choice: foram desencaminhadas
  rationale: Preserva a forma passiva e a ideia de levar ao erro ou desviar, sem reduzir necessariamente o verbo a engano intelectual.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: É a equivalência coletiva mais natural neste contexto mundial de Apocalipse.
theological_decisions:
- issue: Sentido de φαρμακεία no juízo contra Babilônia
  choice: feitiçaria
  alternative: artes mágicas
  rationale: «Feitiçaria» mantém o sentido religioso e moral amplo de práticas mágicas usadas para seduzir ou enganar, sem introduzir uma referência anacrônica a medicamentos.
- issue: Força das duas construções com οὐ μή
  choice: nunca mais
  alternative: de modo algum ... daqui em diante
  rationale: «Nunca mais» comunica com naturalidade a ênfase e a finalidade irreversível do juízo, sem tornar explícito além do texto como essa finalidade deve ser entendida teologicamente.
- issue: Identidade dos μεγιστᾶνες
  choice: poderosos
  alternative: grandes
  rationale: O termo indica pessoas de grande destaque ou poder; «poderosos» evita decidir se a proeminência é especificamente política, aristocrática ou econômica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «em você» e «nunca mais» foi mantida para preservar a personificação de Babilônia, o paralelismo e a solenidade enfática do grego.
