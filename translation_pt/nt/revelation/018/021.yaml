id: REV.18.21
reference: Revelation 18:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: pt
  text: 'Então um anjo poderoso levantou uma pedra semelhante a uma grande pedra de moinho e a lançou ao mar, dizendo: “Assim, com ímpeto[a], será lançada Babilônia, a grande cidade, e nunca mais será encontrada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com força”, “com violência” ou “num ímpeto”. O termo grego indica movimento súbito e vigoroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: levantou
  rationale: O aoristo de αἴρω descreve o anjo erguendo a pedra para realizar a ação simbólica; “levantou” é natural e preserva o movimento deliberado.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: um anjo poderoso
  rationale: Em português, “um” expressa naturalmente a apresentação de uma única figura; “poderoso” comunica a força de ἰσχυρός em registro apocalíptico atual e digno.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: uma pedra semelhante a uma grande pedra de moinho
  rationale: Preserva ὡς como comparação, sem identificar rigorosamente a pedra como uma pedra de moinho, e mantém a imagem de grande peso.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: a lançou ao mar
  rationale: “Lançou” conserva a ação vigorosa de βάλλω e é expressão corrente e digna em português.
- source_word: Οὕτως
  choice: Assim
  rationale: Introduz de modo conciso a interpretação do ato simbólico e corresponde diretamente ao valor demonstrativo do grego.
- source_word: ὁρμήματι
  choice: com ímpeto
  rationale: A expressão preserva a ideia de movimento súbito e vigoroso sem limitar o termo apenas à violência destrutiva; as alternativas são registradas em nota.
- source_word: βληθήσεται
  choice: será lançada
  rationale: Mantém o futuro passivo e a repetição lexical de βάλλω, fazendo a queda de Babilônia corresponder ao lançamento da pedra.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Babilônia, a grande cidade
  rationale: A pontuação explicita em português a aposição presente no grego e preserva a designação apocalíptica.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: nunca mais será encontrada
  rationale: “Nunca mais” comunica de maneira idiomática a negação enfática οὐ μή juntamente com ἔτι, preservando a finalidade do juízo.
theological_decisions:
- issue: Natureza da imagem da destruição de Babilônia
  choice: O juízo é apresentado como súbito, vigoroso e definitivo, sem definir se Babilônia é literal, simbólica ou ambas.
  alternative: Interpretar explicitamente Babilônia como cidade histórica, sistema mundial contrário a Deus ou símbolo apocalíptico composto.
  rationale: O próprio versículo oferece um ato simbólico e um anúncio de queda. A tradução preserva a imagem e sua tensão teológica sem impor um esquema escatológico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno, mas corrente; conserva a comparação da pedra, o eco do verbo “lançar” e a negação enfática do original.
