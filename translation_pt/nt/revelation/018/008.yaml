id: REV.18.8
reference: Revelation 18:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: pt
  text: 'Por isso, em um só dia virão as pragas dela: morte, luto e fome; e ela será completamente queimada pelo fogo, porque poderoso é o Senhor Deus que a julgou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: num só dia
  rationale: Expressa com naturalidade a unidade e a rapidez temporal indicadas pelo grego.
- source_word: πληγαὶ
  choice: pragas
  rationale: Preserva o termo apocalíptico usual para golpes ou calamidades de juízo.
- source_word: πένθος
  choice: luto
  rationale: Equivalente direto e corrente para a aflição associada à morte.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: será completamente queimada pelo fogo
  rationale: O verbo intensivo κατακαίω indica queimar por completo; a voz passiva é preservada.
- source_word: ἰσχυρός
  choice: forte
  rationale: Tradução direta que conserva a formulação enfática do original, sem substituí-la por uma interpretação mais específica.
- source_word: ὁ κρίνας αὐτήν
  choice: que a julgou
  rationale: Preserva o particípio aoristo e seu referente feminino, sem explicitar além do texto a execução da sentença.
theological_decisions:
- issue: Relação causal introduzida por ὅτι
  choice: porque
  alternative: pois
  rationale: Mantém explicitamente que a força do Senhor Deus fundamenta a certeza do juízo anunciado.
- issue: Valor temporal do particípio ὁ κρίνας
  choice: que a julgou
  alternative: que a julga
  rationale: O aoristo é mantido em forma passada, como no texto-fonte, sem harmonização temporal interpretativa.
- issue: Agente implícito da queima
  choice: voz passiva sem agente expresso
  alternative: Deus a queimará
  rationale: O grego não explicita o agente nessa oração; preservar a passiva evita acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem marcada em “forte é o Senhor Deus” preserva a ênfase do predicativo grego e o tom solene do anúncio.
