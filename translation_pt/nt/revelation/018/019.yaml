id: REV.18.19
reference: Revelation 18:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: pt
  text: 'E lançaram pó sobre a cabeça e clamaram[a], chorando e lamentando: “Ai! Ai da grande cidade, em que todos os que tinham navios no mar enriqueceram com a sua opulência[b]! Pois em uma só hora ela foi devastada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gritaram”. O verbo grego indica um clamor forte.
    reason: lexical_alternative
  - marker: b
    text: Ou “com o seu luxo dispendioso” ou “com o seu esplendor”. O termo grego pode indicar opulência, alto valor ou magnificência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: lançaram pó sobre a cabeça
  rationale: Preserva de modo natural a imagem do gesto público de luto; o singular distributivo “a cabeça” é idiomático em português.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: clamavam, chorando e lamentando
  rationale: “Clamavam” comunica o brado intenso, enquanto “chorando” e “lamentando” mantêm distintas as duas expressões complementares de dor.
- source_word: Οὐαὶ οὐαί
  choice: Ai! Ai
  rationale: Em português, “Ai!” funciona naturalmente como brado de lamento e também pode conservar, neste contexto apocalíptico, a gravidade do anúncio de juízo.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: a grande cidade
  rationale: Equivalente português direto e idiomático da expressão grega.
- source_word: ἐν ᾗ
  choice: em que
  rationale: Mantém a forma locativa e a ambiguidade relacional do grego sem explicitar indevidamente um sentido instrumental.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: todos os que tinham navios no mar
  rationale: Segue de perto o particípio grego sem restringir “tinham” necessariamente à propriedade jurídica dos navios.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: com a sua opulência
  rationale: “Opulência” abrange riqueza, luxo dispendioso e magnificência, adequando-se ao contexto comercial sem reduzir o termo apenas a dinheiro.
- source_word: ὅτι μιᾷ ὥρᾳ ἠρημώθη
  choice: Pois em uma só hora ela foi devastada
  rationale: “Uma só hora” realça a rapidez repentina; “foi devastada” preserva a voz passiva e expressa claramente a desolação resultante.
theological_decisions:
- issue: Valor do brado Οὐαὶ οὐαί como lamento e fórmula profética de juízo
  choice: Ai! Ai
  alternative: Ai de você! Ai de você!; Que desgraça! Que desgraça!
  rationale: A interjeição repetida preserva a concisão do grego e permite que coexistam lamento e juízo, sem acrescentar um destinatário pronominal ausente do texto.
- issue: Relação expressa por ἐν ᾗ entre a cidade e o enriquecimento marítimo
  choice: em que
  alternative: por meio da qual
  rationale: 'A tradução formalmente locativa preserva a ambiguidade da preposição: a cidade pode ser entendida como esfera ou contexto comercial, sem excluir uma nuance de meio.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mantendo a imagem concreta do luto, a repetição enfática e a voz passiva do original.
