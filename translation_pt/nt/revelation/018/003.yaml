id: REV.18.3
reference: Revelation 18:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: pt
  text: Pois todas as nações caíram[a] por causa do vinho do furor da imoralidade sexual dela[b]; os reis da terra cometeram imoralidade sexual com ela[c], e os comerciantes da terra enriqueceram graças ao poder do luxo desenfreado dela[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Há uma variante textual antiga: “beberam”. Essa leitura produz: “todas as nações beberam do vinho...”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “do vinho da paixão da imoralidade sexual dela”. A sequência de genitivos gregos admite mais de uma relação entre os termos, e θυμός pode significar “furor”, “ira” ou “paixão intensa”.'
    reason: lexical_alternative
  - marker: c
    text: Aqui, a linguagem de imoralidade sexual provavelmente funciona como metáfora de alianças idólatras, corruptas e exploradoras; o texto mantém, porém, a imagem sexual do grego.
    reason: alternative_reading
  - marker: d
    text: O termo grego indica luxo arrogante, autoindulgente e excessivo, não apenas conforto material.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a causa da declaração anterior sobre a queda da Babilônia e mantém uma ligação natural com o contexto.
- source_word: ἐκ τοῦ οἴνου
  choice: por causa do vinho
  rationale: Com πέπτωκαν no texto fornecido, ἐκ expressa a causa ou fonte da queda; a formulação preserva a imagem do vinho sem acrescentar o ato de beber ao texto principal.
- source_word: θυμοῦ
  choice: furor
  rationale: O termo pode indicar ira ou paixão intensa. “Furor” conserva a força destrutiva da imagem e sua possível associação tanto com ira quanto com paixão.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Mantém explicitamente a imagem sexual do grego sem restringi-la à prostituição comercial, permitindo também seu uso metafórico no contexto.
- source_word: πέπτωκαν
  choice: caíram
  rationale: Traduz diretamente o perfeito de πίπτω conforme o texto grego fornecido. O pretérito perfeito é natural em português e apresenta a queda como acontecimento consumado com relevância presente.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Refere-se coletivamente aos povos sob a influência da Babilônia, sem introduzir um contraste específico entre judeus e gentios.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: cometeram imoralidade sexual com ela
  rationale: Preserva a imagem sexual e a ligação lexical com πορνεία, sem resolver a metáfora como exclusivamente religiosa, política ou econômica.
- source_word: ἔμποροι
  choice: comerciantes
  rationale: É a designação portuguesa corrente e adequada para os agentes do comércio no contexto econômico do capítulo.
- source_word: ἐκ τῆς δυνάμεως
  choice: graças ao poder
  rationale: Expressa a fonte eficaz do enriquecimento e conserva a noção de força ou poder, em vez de reduzi-la simplesmente a riqueza.
- source_word: στρήνους
  choice: luxo desenfreado
  rationale: O termo denota luxo arrogante, excessivo e autoindulgente; “desenfreado” comunica essa nuance melhor do que “luxo” isoladamente.
- source_word: ἐπλούτησαν
  choice: enriqueceram
  rationale: Forma idiomática e concisa que comunica o resultado econômico do aoristo.
theological_decisions:
- issue: Se πορνεία e πορνεύω devem ser interpretados diretamente como idolatria, infidelidade espiritual ou alianças corruptas
  choice: Manter a linguagem de “imoralidade sexual” no texto principal
  alternative: Traduzir como “idolatria”, “adultério espiritual” ou “aliança corrupta”
  rationale: O Apocalipse emprega deliberadamente uma imagem sexual capaz de abranger infidelidade religiosa, corrupção política e exploração econômica. A tradução conserva essa tensão sem escolher uma única interpretação.
- issue: Se πέπτωκαν deve ser harmonizado com a conhecida imagem das nações bebendo o vinho
  choice: Traduzir o texto fornecido como “caíram”
  alternative: “beberam” conforme uma variante textual
  rationale: A forma πέπτωκαν no texto apresentado deriva de πίπτω, “cair”. A variante que significa “beberam” é relevante e consta em nota, mas não deve substituir silenciosamente a leitura fornecida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Luxo desenfreado” evita que στρῆνος soe como simples prosperidade, enquanto “imoralidade sexual” preserva a imagem recorrente sem o tom arcaico de “fornicação”.
