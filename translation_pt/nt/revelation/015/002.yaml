id: REV.15.2
reference: Revelation 15:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: pt
  text: E vi algo como um mar de vidro misturado com fogo, e os que haviam obtido vitória[a] sobre a besta, sobre a imagem dela e sobre o número do nome dela, em pé sobre o mar de vidro, segurando harpas de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “os que vencem da besta, da imagem dela e do número do nome dela”. A construção grega pode enfatizar tanto a vitória sobre esses poderes quanto o afastamento ou a libertação de seu domínio.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as harpas pertencentes a Deus”. A expressão também pode indicar harpas dadas por Deus ou dedicadas a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: algo como um mar de vidro
  rationale: ὡς introduz uma comparação visionária, sem identificar de modo estrito o que João viu. “Algo como” preserva essa cautela, enquanto “mar de vidro” mantém a imagem concreta e sua repetição no versículo.
- source_word: μεμιγμένην πυρί
  choice: misturado com fogo
  rationale: O particípio perfeito descreve o mar como estando mesclado com fogo. A formulação preserva a imagem incomum sem explicar se o fogo estava dentro dele ou apenas fazia parte de sua aparência.
- source_word: τοὺς νικῶντας
  choice: os que tinham alcançado vitória
  rationale: A expressão identifica essas pessoas como vencedoras. A forma escolhida comunica naturalmente o resultado vitorioso no contexto da visão sem reduzir νικάω a uma conquista militar.
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: sobre a besta, sobre a imagem dela e sobre o número do nome dela
  rationale: Com νικάω, o ἐκ repetido pode expressar vitória sobre poderes hostis, embora conserve uma possível noção de saída ou libertação do domínio deles. A repetição de “sobre” mantém a estrutura tríplice; a ambiguidade relevante é registrada em nota.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: estavam em pé sobre o mar de vidro
  rationale: ἐπί com acusativo admite aqui o sentido espacial de estar sobre. A tradução mantém a imagem visionária marcante e evita enfraquecê-la para “junto ao mar”.
- source_word: κιθάρας τοῦ θεοῦ
  choice: harpas de Deus
  rationale: A construção com genitivo é mantida porque pode indicar posse, origem ou dedicação. “Harpas de Deus” é natural, solene e não resolve indevidamente a relação exata.
theological_decisions:
- issue: A relação dos vencedores com a besta, expressa pelo ἐκ repetido depois de νικῶντας
  choice: Apresentá-los como os que alcançaram vitória sobre a besta, sua imagem e o número de seu nome.
  alternative: Entender que eles saíram do domínio da besta ou foram libertos de seu poder.
  rationale: O uso de νικάω favorece o tema de vencer poderes hostis, recorrente em Apocalipse. Contudo, como ἐκ normalmente expressa origem ou saída, a nota preserva a possibilidade de que a construção também destaque a libertação ou a emergência para fora do poder da besta.
- issue: O sentido do genitivo em κιθάρας τοῦ θεοῦ
  choice: Preservar a expressão aberta “harpas de Deus”.
  alternative: Especificar “harpas pertencentes a Deus”, “harpas dadas por Deus” ou “harpas dedicadas a Deus”.
  rationale: O texto não define se o genitivo indica posse, origem ou dedicação; explicitar apenas uma dessas opções acrescentaria uma precisão ausente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A primeira oração preserva a linguagem comparativa da visão. A frase longa foi dividida após a identificação dos vencedores para melhorar a compreensão sem alterar as relações sintáticas centrais. “Imagem dela” e “nome dela” evitam a possível ambiguidade de gênero de “sua” no português corrente. Todos os marcadores aparecem junto às expressões que suas notas explicam.
