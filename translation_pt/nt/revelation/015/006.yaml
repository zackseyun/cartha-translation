id: REV.15.6
reference: Revelation 15:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: pt
  text: E os sete anjos que tinham as sete pragas saíram do santuário[a], vestidos de linho puro e resplandecente[b], e cingidos ao redor do peito com faixas de ouro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo”. A palavra grega ναός costuma se referir especificamente ao santuário, e não a todo o complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “linho limpo e brilhante”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cinturões de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι indica movimento para fora; “saíram” é a forma mais natural em português sem impor o ponto de vista do observador.
- source_word: ἄγγελοι
  choice: anjos
  rationale: No contexto da visão celestial do Apocalipse, trata-se claramente de seres angelicais, não de mensageiros humanos.
- source_word: πληγάς
  choice: pragas
  rationale: No Apocalipse, o termo designa golpes ou juízos enviados por Deus; “pragas” é a tradução consagrada e adequada ao contexto.
- source_word: ναοῦ
  choice: santuário
  rationale: ναός costuma designar o recinto sagrado interior, em contraste com o complexo mais amplo do templo; “santuário” preserva essa especificidade.
- source_word: ἐνδεδυμένοι
  choice: vestidos
  rationale: O particípio perfeito descreve o estado em que os anjos se encontravam; “vestidos” é corrente, claro e digno.
- source_word: λίνον
  choice: linho
  rationale: O substantivo designa linho; não se acrescenta “fino”, pois o grego não contém aqui um termo separado com esse sentido.
- source_word: καθαρὸν
  choice: puro
  rationale: καθαρός admite “limpo” ou “puro”. Em relação ao linho celestial e em coordenação com “resplandecente”, “puro” é natural e preserva as possíveis conotações ritual e moral.
- source_word: λαμπρὸν
  choice: resplandecente
  rationale: λαμπρός expressa brilho ou esplendor; “resplandecente” comunica melhor a qualidade luminosa da veste do que o mais genérico “brilhante”.
- source_word: περιεζωσμένοι
  choice: cingidos
  rationale: O particípio de περιζώννυμι significa prender ou envolver algo ao redor do corpo. “Cingidos” conserva com precisão a imagem e o registro solene, sem ser obscuro.
- source_word: περὶ τὰ στήθη
  choice: ao redor do peito
  rationale: A expressão situa as faixas na região do peito, e não na cintura. O singular coletivo “peito” é idiomático em português com sujeito plural.
- source_word: ζώνας χρυσᾶς
  choice: faixas de ouro
  rationale: ζώνη pode indicar cinto, faixa ou cinturão. Como estão ao redor do peito, “faixas” representa a imagem com mais naturalidade do que “cintos”.
theological_decisions:
- issue: Sentido de ναός no cenário celestial
  choice: santuário
  alternative: templo
  rationale: “Santuário” mantém o sentido mais específico do recinto sagrado interior sem definir além do texto a natureza da realidade celestial descrita.
- issue: Nuance de καθαρόν na descrição do linho
  choice: puro
  alternative: limpo
  rationale: Ambas as acepções são possíveis. “Puro” soa mais natural para uma veste celestial e deixa perceptíveis as dimensões visual, ritual e moral sem tornar uma delas exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem acompanha o grego sem rigidez. “Cingidos” preserva a imagem corporal e o tom apocalíptico; “faixas de ouro” evita sugerir incorretamente cintos usados na cintura. Todos os marcadores de nota aparecem no texto principal em ordem alfabética.
