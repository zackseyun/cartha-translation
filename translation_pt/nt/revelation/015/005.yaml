id: REV.15.5
reference: Revelation 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: pt
  text: 'E, depois dessas coisas, vi: abriu-se no céu o santuário[a] da tenda do testemunho[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo”. Aqui, ναός pode enfatizar o recinto sagrado interior, e não todo o complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: “Tenda do testemunho” retoma a linguagem do santuário do Antigo Testamento, especialmente a tenda do deserto associada ao testemunho da aliança de Deus.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: E, depois dessas coisas
  rationale: Preserva a ligação narrativa introduzida por Καί e o plural de ταῦτα, mantendo a fórmula sequencial característica das visões do Apocalipse.
- source_word: εἶδον
  choice: vi
  rationale: Expressa diretamente a percepção visionária indicada pelo aoristo de ὁράω, sem transformá-la no ato deliberado de olhar.
- source_word: ἠνοίγη
  choice: abriu-se
  rationale: O aoristo passivo indica que o santuário foi aberto. A construção pronominal é natural em português e mantém o agente implícito, como no grego.
- source_word: ὁ ναὸς
  choice: o santuário
  rationale: Neste contexto cultual, ναός designa propriamente o recinto sagrado ou parte interior, e não todo o complexo do templo. “Santuário” comunica essa precisão em português; “templo” permanece uma alternativa possível.
- source_word: τῆς σκηνῆς
  choice: da tenda
  rationale: Σκηνή evoca a tenda sagrada do período do deserto. “Tenda” é claro e atual, preservando a imagem concreta sem recorrer ao termo menos corrente “tabernáculo”.
- source_word: τοῦ μαρτυρίου
  choice: do testemunho
  rationale: Na expressão cultual, μαρτύριον remete ao testemunho da aliança associado ao santuário israelita. A tradução literal preserva a alusão bíblica e sua densidade teológica.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Localiza o santuário na esfera celestial e corresponde à forma idiomática em português.
theological_decisions:
- issue: Imagem cultual do santuário celestial
  choice: santuário da tenda do testemunho no céu
  alternative: santuário celestial; templo no céu, isto é, a tenda do testemunho
  rationale: A cadeia de genitivos no grego reúne as imagens do santuário, da tenda e do testemunho. A tradução conserva essa formulação densa, sem reduzi-la a uma paráfrase que determine antecipadamente a relação entre as imagens.
- issue: Agente da abertura
  choice: abriu-se
  alternative: Deus abriu; foi aberto por um agente celestial
  rationale: O grego emprega voz passiva sem nomear quem abre o santuário. A tradução mantém essa indeterminação em vez de introduzir um agente por inferência teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Os dois-pontos após “vi” evitam uma coordenação pouco natural em português, ao mesmo tempo que preservam a progressão visionária do grego. “Tenda” foi preferido a “tabernáculo” por ser mais transparente ao leitor comum, com a alusão cultual explicada em nota.
