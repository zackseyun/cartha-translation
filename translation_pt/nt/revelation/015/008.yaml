id: REV.15.8
reference: Revelation 15:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: pt
  text: E o santuário foi cheio de fumaça proveniente da glória de Deus e do seu poder, e ninguém podia entrar no santuário até que se completassem as sete pragas dos sete anjos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo” em vez de “santuário” (grego ναός); o termo muitas vezes se refere mais especificamente ao espaço sagrado interno do que ao complexo mais amplo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: santuário
  rationale: Em Apocalipse, ναός frequentemente designa mais especificamente a habitação santa interior, e não todo o complexo do templo. “Santuário” comunica essa especificidade em português natural.
- source_word: ἐγεμίσθη
  choice: ficou cheio
  rationale: Representa com naturalidade o aoristo passivo e destaca o estado resultante produzido pela fumaça.
- source_word: καπνοῦ
  choice: de fumaça
  rationale: O genitivo após γεμίζω indica aquilo de que o santuário ficou cheio; “fumaça” é o sentido contextual na imagem teofânica.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: que vinha da glória de Deus
  rationale: 'Torna explícita em português a relação de origem marcada por ἐκ sem alterar a imagem: a fumaça procede da glória de Deus.'
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: e do seu poder
  rationale: Mantém a coordenação e a ideia de origem expressa pelo segundo ἐκ; δύναμις é traduzido diretamente por “poder”.
- source_word: οὐδεὶς ἐδύνατο
  choice: ninguém podia
  rationale: Expressa de modo corrente e digno a incapacidade indicada pelo imperfeito ἐδύνατο.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν
  choice: entrar no santuário
  rationale: Reproduz claramente o infinitivo de entrada e mantém a tradução consistente de ναός.
- source_word: ἄχρι τελεσθῶσιν
  choice: até que se completassem
  rationale: Preserva o limite temporal e o valor passivo/resultativo do aoristo subjuntivo, em construção portuguesa natural.
- source_word: πληγαὶ
  choice: pragas
  rationale: Em Apocalipse, o termo designa regularmente calamidades de juízo; “pragas” é preciso e reconhecível.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: dos sete anjos
  rationale: Mantém a associação genitiva entre as sete pragas e os sete anjos sem especificar além do que o grego afirma se eles as portam ou executam.
theological_decisions:
- issue: Sentido de ναός no contexto apocalíptico da habitação celestial de Deus
  choice: santuário
  alternative: templo
  rationale: “Santuário” favorece o sentido mais específico da habitação santa interior e evita sugerir necessariamente todo o recinto do templo, sem acrescentar uma definição doutrinária não expressa pelo texto.
- issue: Relação das pragas com os sete anjos
  choice: dos sete anjos
  alternative: trazidas pelos sete anjos
  rationale: O genitivo associa as pragas aos anjos, mas não explicita sozinho a natureza exata dessa relação; a formulação literal preserva essa abertura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem recorrer a formas arcaicas. A repetição de “santuário” acompanha deliberadamente as duas ocorrências de ναός.
