reference: Revelation 15:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: pt
  text: E um dos quatro seres viventes deu aos sete anjos sete taças de ouro[a], cheias da ira de Deus, que vive para todo o sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete tigelas de ouro” ou “sete bacias de ouro”; a palavra grega designa um recipiente largo, semelhante a uma taça.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para as eras dos eras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: um dos quatro seres viventes
  rationale: Em Apocalipse, ζῷον designa os seres junto ao trono; “seres viventes” os distingue da “besta” (θηρίον) e preserva sua caracterização como seres vivos.
- source_word: ἔδωκεν
  choice: deu
  rationale: Equivalente direto e natural do aoristo de δίδωμι, sem acrescentar nuances interpretativas.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: aos sete anjos
  rationale: No contexto apocalíptico, ἄγγελος refere-se naturalmente a anjos celestiais.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: sete taças de ouro
  rationale: φιάλη indica um recipiente largo e pouco profundo; “taças” é claro em português, e “de ouro” expressa naturalmente o material indicado por χρυσᾶς.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: cheias da ira de Deus
  rationale: O particípio γεμούσας rege o genitivo e descreve as taças como cheias; “ira” preserva a força solene e judicial de θυμός neste contexto.
- source_word: τοῦ ζῶντος
  choice: que vive
  rationale: O particípio substantivado modifica Deus; a oração relativa é natural em português e mantém a afirmação de que Deus vive.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Expressão portuguesa idiomática para duração sem fim, preservando a força da fórmula grega.
theological_decisions:
- issue: Terminologia da ira divina
  choice: a ira de Deus
  alternative: a fúria de Deus; a cólera de Deus
  rationale: “Ira” conserva o caráter solene do juízo escatológico sem reduzir a expressão a mero estado emocional nem intensificá-la indevidamente.
- issue: A vida eterna de Deus
  choice: Deus, que vive para todo o sempre
  alternative: o Deus vivente pelos séculos dos séculos
  rationale: A formulação liga claramente τοῦ ζῶντος a Deus e εἰς τοὺς αἰῶνας τῶν αἰώνων à duração de sua vida, sem acrescentar uma interpretação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. “Seres viventes” mantém a distinção terminológica entre ζῷον e θηρίον em Apocalipse; “taças de ouro” evita o tradicional “frascos”, que sugere um formato inadequado.
