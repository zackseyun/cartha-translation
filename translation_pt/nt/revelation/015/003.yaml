id: REV.15.3
reference: Revelation 15:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the slave of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: pt
  text: 'E cantam o cântico de Moisés, o escravo de Deus, e o cântico do Cordeiro, dizendo:


    “Grandes e maravilhosas são as tuas obras,

    Senhor Deus, o Todo-Poderoso!

    Justos e verdadeiros são os teus caminhos,

    ó Rei dos séculos[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “ó Rei das nações” em vez de “ó Rei dos séculos”.
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: cantam
  rationale: O presente do indicativo é vertido como presente vívido, natural no relato da visão.
- source_word: ᾠδὴν
  choice: cântico
  rationale: “Cântico” é corrente no registro bíblico e solene em português, sem restringir indevidamente o termo a uma forma litúrgica específica.
- source_word: δούλου
  choice: escravo
  rationale: Preserva a força de pertencimento e sujeição de δοῦλος, sem suavizá-la para “servo”; aqui integra o título solene de Moisés como alguém pertencente a Deus e por ele comissionado.
- source_word: ἀρνίου
  choice: Cordeiro
  rationale: Em Apocalipse, o termo funciona como título cristológico; a inicial maiúscula preserva esse uso reconhecível e a imagem sacrificial.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: Grandes e maravilhosas
  rationale: Mantém os dois predicativos e o tom elevado de louvor, com concordância natural com “obras”.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Senhor Deus, o Todo-Poderoso
  rationale: Conserva os três elementos da designação divina em formulação clara e idiomática em português.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: Justos e verdadeiros
  rationale: “Justos” comunica retidão e justiça; “verdadeiros” preserva a afirmação de veracidade e autenticidade dos caminhos de Deus.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: ó Rei dos séculos
  rationale: Segue o texto da SBLGNT, αἰώνων, e preserva sua referência às eras ou séculos sem substituí-la pela variante “nações”.
theological_decisions:
- issue: Sentido de δοῦλος no título de Moisés
  choice: escravo de Deus
  alternative: servo de Deus
  rationale: A opção principal retém a noção forte de pertencimento e submissão presente no termo grego, apesar de “servo” ser mais tradicional e suave em português.
- issue: Forma textual do título divino no fim do versículo
  choice: Rei dos séculos
  alternative: Rei das nações
  rationale: A tradução segue αἰώνων no texto grego fornecido; a variante significativa ἐθνῶν é registrada em nota, sem resolver silenciosamente a diferença textual.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas realça o caráter poético do cântico. O marcador da nota foi colocado junto à expressão a que a variante textual se refere.
