id: REV.15.1
reference: Revelation 15:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: pt
  text: 'E vi no céu outro sinal, grande e admirável: sete anjos com as sete últimas pragas, pois nelas se completou a ira de Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: É o equivalente mais transparente e habitual em Apocalipse para um fenômeno visível de caráter simbólico.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: No cenário apocalíptico, refere-se naturalmente ao âmbito celestial, não apenas ao céu visível.
- source_word: μέγα καὶ θαυμαστόν
  choice: grande e admirável
  rationale: Preserva a grandeza e o assombro da expressão grega em português atual e digno.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: sete anjos com as sete últimas pragas
  rationale: A construção com «com» expressa naturalmente em português a relação participial de ἔχοντας, sem perder que os anjos têm consigo as pragas finais.
- source_word: ὅτι
  choice: pois
  rationale: Introduz de modo claro e natural a razão pela qual essas pragas são as últimas.
- source_word: ἐν αὐταῖς
  choice: nelas
  rationale: Mantém diretamente a preposição ἐν e retoma sem ambiguidade as sete pragas.
- source_word: ἐτελέσθη
  choice: se completou
  rationale: Expressa que a ira chega à sua consumação nessas pragas, preservando a nuance télica do verbo sem ampliar a afirmação.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: a ira de Deus
  rationale: Conserva a força solene da linguagem de juízo divino em Apocalipse sem suavizá-la nem intensificá-la indevidamente.
theological_decisions:
- issue: Linguagem do juízo divino no contexto apocalíptico
  choice: a ira de Deus
  alternative: a cólera de Deus; o furor de Deus
  rationale: «Ira» preserva o peso solene e judicial de θυμός, sem a possível conotação excessivamente emocional de outras opções.
- issue: Alcance de ἐτελέσθη em relação à ira divina
  choice: se completou
  alternative: chegou ao fim; se consumou
  rationale: A formulação indica que a ira de Deus alcança sua conclusão nessas pragas, sem inferir além do versículo que todo e qualquer juízo possível termina aqui.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A abertura «E vi» conserva a continuidade narrativa; «admirável» mantém um tom elevado sem arcaísmo. Não se acrescentaram notas, pois as alternativas lexicais não são necessárias para preservar uma ambiguidade relevante neste versículo.
