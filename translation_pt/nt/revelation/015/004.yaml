id: REV.15.4
reference: Revelation 15:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: pt
  text: Quem não te temerá, Senhor, e não glorificará o teu nome? Pois só tu és santo. Todas as nações virão e adorarão diante de ti, porque os teus atos justos[a] se tornaram manifestos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus julgamentos justos”. O termo grego também pode se referir a decisões judiciais ou ordenanças; aqui, provavelmente aponta para as ações justas de Deus que agora se tornaram visíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Quem não te temerá
  rationale: A pergunta retórica com οὐ μή espera a resposta “ninguém” e tem orientação futura; “Quem não te temerá” preserva ambas.
- source_word: κύριε
  choice: Senhor
  rationale: O vocativo de κύριος é traduzido pela forma portuguesa natural e tradicional “Senhor”.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: não glorificará o teu nome
  rationale: A repetição de “não”, natural em português na coordenação, explicita que ambos os verbos estão sob o alcance da pergunta retórica; “glorificar o nome” preserva o idioma bíblico.
- source_word: μόνος ὅσιος
  choice: só tu és santo
  rationale: ὅσιος, nesta doxologia, descreve a santidade e retidão moral singulares de Deus; a cópula e o pronome são supridos para produzir português natural.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém o sentido coletivo e universal de ἔθνη e sua ressonância com a linguagem bíblica sobre a adoração das nações.
- source_word: ἥξουσιν
  choice: virão
  rationale: Expressa de modo direto o futuro profético de ἥκω.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: adorarão diante de ti
  rationale: No contexto litúrgico de Apocalipse, προσκυνέω indica adoração; “diante de ti” representa explicitamente ἐνώπιόν σου.
- source_word: τὰ δικαιώματά σου
  choice: os teus atos justos
  rationale: δικαιώματα pode indicar feitos justos, decisões judiciais ou ordenanças. “Atos justos” preserva a amplitude e se ajusta ao contexto em que a justiça divina se torna visível.
- source_word: ἐφανερώθησαν
  choice: se tornaram manifestos
  rationale: Representa o aoristo passivo e a ideia de algo que veio a ser publicamente visível, sem reduzir o verbo apenas à comunicação de uma revelação.
theological_decisions:
- issue: Sentido de ὅσιος na doxologia dirigida a Deus
  choice: santo
  alternative: fiel; piedoso
  rationale: “Santo” comunica melhor, neste contexto de adoração, a singular pureza e retidão de Deus, sem restringir o termo apenas à fidelidade pactual.
- issue: Sentido de δικαιώματα no contexto dos juízos apocalípticos
  choice: atos justos
  alternative: julgamentos justos; ordenanças
  rationale: O cântico celebra manifestações concretas da justiça de Deus. “Atos justos” mantém a referência ampla, enquanto a nota registra a possível nuance judicial.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a estrutura retórica, o paralelismo e a linguagem de adoração do texto grego, evitando arcaísmos desnecessários.
