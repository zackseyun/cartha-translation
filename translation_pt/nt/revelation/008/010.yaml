- from: E o terceiro anjo tocou a trombeta. Então caiu do céu[a] uma grande estrela, ardendo como uma tocha[b]; e ela caiu sobre um terço dos rios e sobre as fontes das águas.[c]
  to: E o terceiro anjo tocou a trombeta; e uma grande estrela[c] caiu do céu[a], ardendo como uma tocha[b], e caiu sobre um terço dos rios e sobre as fontes das águas.
  rationale: A revisão substitui a inferência temporal «Então» pela coordenação «e», preserva a sequência e a repetição de ἔπεσεν em uma única frase coordenada e reposiciona a nota interpretativa junto a «estrela». A nota lexical sobre οὐρανός foi ajustada para uma alternativa portuguesa mais natural e diretamente pertinente.
