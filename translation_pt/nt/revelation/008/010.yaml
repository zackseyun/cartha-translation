reference: Revelation 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: pt
  text: E o terceiro anjo tocou a trombeta; e uma grande estrela[c] caiu do céu[a], ardendo como uma tocha[b], e caiu sobre um terço dos rios e sobre as fontes das águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do céu visível». A palavra grega pode referir-se ao céu como domínio celestial ou ao céu visível.
    reason: lexical_alternative
  - marker: b
    text: Ou «como uma lamparina». A palavra grega pode designar uma tocha ou uma lamparina; «tocha» corresponde melhor à imagem de algo intensamente ardente.
    reason: lexical_alternative
  - marker: c
    text: A «estrela» é mantida como imagem, sem identificação interpretativa. Pode ser entendida como um ser angelical, um objeto semelhante a um meteoro ou um poder simbólico.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: Expressa de modo natural em português o ato de soar a trombeta e explicita o instrumento implícito no verbo grego.
- source_word: ἀστὴρ μέγας
  choice: uma grande estrela
  rationale: Mantém diretamente a imagem e a amplitude sem decidir se se trata de um ser, objeto ou poder simbólico.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Preserva o sentido primário de οὐρανός e combina com o cenário visionário; em português, «céu» também pode abranger o espaço celeste visível.
- source_word: καιόμενος ὡς λαμπάς
  choice: ardendo como uma tocha
  rationale: Reproduz o particípio e a comparação; «tocha» comunica melhor a imagem de fogo intenso, embora λαμπάς também possa designar uma lamparina.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: caiu ... e ela caiu
  rationale: Conserva a repetição enfática do verbo grego e deixa claro que a estrela é o sujeito da segunda ocorrência.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: sobre um terço dos rios
  rationale: Verte de maneira idiomática e quantitativamente precisa a expressão recorrente τὸ τρίτον.
- source_word: πηγὰς τῶν ὑδάτων
  choice: as fontes das águas
  rationale: Mantém a construção genitiva e o registro solene; «fontes» aqui designa nascentes ou mananciais.
theological_decisions:
- issue: Referente da estrela que cai
  choice: Mantida literalmente como «uma grande estrela»
  alternative: Um ser angelical, um objeto semelhante a um meteoro ou um poder simbólico
  rationale: O versículo apresenta a figura como estrela sem identificar explicitamente seu referente; a tradução não resolve a imagem em favor de uma interpretação particular.
translation_notes:
  register: Português moderno, claro e digno, com ritmo narrativo próximo ao grego. A repetição de «caiu» foi preservada por sua função enfática, e o simbolismo apocalíptico não foi explicado dentro do texto.
