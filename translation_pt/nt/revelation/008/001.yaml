id: REV.8.1
reference: Revelation 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: pt
  text: E, quando abriu o sétimo selo[a], houve silêncio no céu por cerca de meia hora.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando rompeu o sétimo selo”. O grego diz simplesmente “abriu o sétimo selo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fez-se silêncio no céu por cerca de meia hora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Embora ὅταν possa ter sentido indefinido ou reiterativo, aqui introduz um acontecimento singular na sequência narrativa; “quando” expressa naturalmente seu valor temporal.
- source_word: ἤνοιξεν
  choice: abriu
  rationale: ἀνοίγω significa “abrir”. A forma simples “abriu” preserva o valor lexical sem acrescentar a ideia mais interpretativa de romper o selo.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: o sétimo selo
  rationale: σφραγίς é o termo comum para “selo”, e o adjetivo ordinal identifica este como o sétimo na sequência do livro.
- source_word: ἐγένετο σιγὴ
  choice: houve silêncio
  rationale: A construção apresenta o surgimento de um estado. “Houve silêncio” é idiomático em português e mantém a força solene de σιγή.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto, οὐρανός designa o âmbito celestial; “no céu” é a formulação natural em português.
- source_word: ὡς ἡμιώριον
  choice: por cerca de meia hora
  rationale: ὡς indica aproximação diante de uma medida temporal, enquanto ἡμιώριον designa o período de meia hora. A preposição “por” explicita naturalmente a duração em português.
theological_decisions:
- issue: Referente do sujeito implícito de ἤνοιξεν
  choice: 'Manter o sujeito não expresso: “quando abriu”'
  alternative: Explicitar “quando ele abriu” ou “quando o Cordeiro abriu”
  rationale: O grego traz um verbo na terceira pessoa do singular sem nomear novamente o sujeito. Como o português permite sujeito oculto, a tradução conserva essa característica e deixa que o contexto anterior identifique o Cordeiro, sem inserir uma identificação ausente deste versículo.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A coordenação inicial com “E” preserva Καί e a continuidade narrativa; o sujeito oculto soa natural em português e acompanha de perto a forma grega.
