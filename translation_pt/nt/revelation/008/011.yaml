  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: pt
  text: E o nome da estrela é Absinto[a]. Um terço das águas se tornou absinto, e muitas pessoas morreram por causa das águas[b], porque elas tinham sido tornadas amargas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma planta conhecida pelo sabor extremamente amargo. O mesmo termo grego designa a estrela e aquilo em que as águas se tornaram.
    reason: lexical_explanation
  - marker: b
    text: Literalmente, “morreram das águas”. O texto não diz explicitamente que morreram por bebê-las.
    reason: translation_clarification
lexical_decisions:
- source_word: ὄνομα
  choice: nome
  rationale: Equivalente direto e natural para a designação da estrela.
- source_word: ἀστέρος
  choice: estrela
  rationale: Tradução direta de ἀστήρ, adequada à imagem apocalíptica.
- source_word: λέγεται
  choice: é
  rationale: Em português, na fórmula «o nome ... é», o sentido de «é chamado» fica expresso de maneira natural, sem reproduzir uma redundância pouco idiomática.
- source_word: Ἄψινθος / ἄψινθον
  choice: Absinto / absinto
  rationale: «Absinto» é o nome português corrente da planta amarga. A inicial maiúscula identifica o nome próprio da estrela, e a repetição em minúscula preserva o vínculo lexical com as águas.
- source_word: ἐγένετο ... εἰς
  choice: se tornou
  rationale: Expressa transformação ou resultado e mantém concreta a imagem de as águas se tornarem absinto.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: um terço das águas
  rationale: Forma quantitativa idiomática em português, preservando a construção partitiva.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: muitos seres humanos
  rationale: Abrange pessoas em geral, sem restringir o sentido a homens do sexo masculino; a naturalidade portuguesa dispensa reproduzir rigidamente o partitivo.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: morreram por causa das águas
  rationale: ἐκ marca aqui origem ou causa. A formulação evita acrescentar que beberam as águas, algo implícito, mas não declarado.
- source_word: ὅτι ἐπικράνθησαν
  choice: porque elas se tornaram amargas
  rationale: O pronome retoma explicitamente «as águas». A formulação comunica o resultado passivo sem a rigidez de «foram amargadas».
theological_decisions:
- issue: Referente de ἐπικράνθησαν
  choice: O verbo se refere às águas.
  alternative: O verbo poderia ser entendido como referente às pessoas, que teriam ficado amarguradas ou adoecido.
  rationale: «Águas» é o antecedente plural mais próximo e a sequência causal indica que as mortes ocorreram porque as águas se tornaram amargas. A nota preserva clareza sobre a referência sem introduzir uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Absinto» preserva o nome da planta sem sugerir primariamente a bebida. A repetição «Absinto/absinto» reproduz a ligação deliberada do grego, e «seres humanos» evita ambiguidade de gênero.
