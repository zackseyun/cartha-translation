id: REV.8.4
reference: Revelation 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: pt
  text: E, da mão do anjo, a fumaça do incenso subiu[a] com as orações dos santos diante de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “elevou-se” ou “ascendeu”.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “com as orações dos santos”; a formulação associa a fumaça do incenso às orações, sem identificá-las explicitamente neste versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: O aoristo de ἀναβαίνω descreve movimento para cima. “Subiu” é natural e concreto em português, preservando a imagem sem a solenidade adicional de “ascendeu”.
- source_word: καπνὸς
  choice: fumaça
  rationale: É o sentido comum do termo e conserva a imagem concreta da visão apocalíptica.
- source_word: θυμιαμάτων
  choice: do incenso
  rationale: θυμίαμα designa normalmente incenso. Embora a forma grega esteja no plural, o substantivo massivo singular “incenso” é a expressão idiomática em português e mantém o sentido cultual.
- source_word: ταῖς προσευχαῖς
  choice: com as orações
  rationale: O dativo associa a fumaça às orações sem definir com precisão se o incenso as simboliza, acompanha ou transporta. “Com” preserva essa abertura interpretativa.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: ἅγιοι é uma designação bíblica habitual para o povo consagrado a Deus. “Santos” mantém o registro de Apocalipse sem restringir a expressão a pessoas posteriormente canonizadas.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: da mão do anjo
  rationale: A formulação conserva a imagem concreta da mão do anjo como ponto de origem, seguindo de perto a estrutura grega.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Expressão concisa e idiomática para presença perante Deus, adequada ao cenário cultual da visão.
theological_decisions:
- issue: Relação entre o incenso e as orações
  choice: “a fumaça do incenso subiu com as orações dos santos”
  alternative: “a fumaça do incenso, isto é, as orações dos santos, subiu” ou “a fumaça subiu em favor das orações dos santos”
  rationale: A construção grega associa a fumaça às orações, mas não as identifica explicitamente neste versículo. A tradução mantém a tensão da imagem sem impor uma interpretação simbólica específica.
- issue: Referente de “santos”
  choice: “santos”, entendido no contexto como o povo consagrado a Deus
  alternative: “povo santo” ou “os que pertencem a Deus”
  rationale: A escolha preserva a terminologia bíblica e não limita o referente a uma categoria denominacional ou ao sentido posterior de pessoas canonizadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “da mão do anjo” foi antecipada para reduzir a impressão de que apenas “os santos” se ligariam à expressão, mantendo ao mesmo tempo a imagem e as relações do grego.
