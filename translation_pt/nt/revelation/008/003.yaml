id: REV.8.3
reference: Revelation 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: pt
  text: E veio outro anjo e ficou de pé junto ao altar, segurando um incensário de ouro.[a] Foi-lhe dado muito incenso para que o oferecesse com as orações de todos os santos,[b] sobre o altar de ouro que está diante do trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um queimador de incenso de ouro”.'
    reason: Alternativa lexical para λιβανωτός.
  - marker: b
    text: 'Literalmente: “para que o desse às orações de todos os santos”. No contexto, o incenso é apresentado com as orações ou acrescentado a elas.'
    reason: A construção dativa do grego é incomum e admite uma tradução mais literal.
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: outro anjo
  rationale: ἄλλος indica mais um anjo na sequência, e não um ser de natureza diferente.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: ficou de pé junto ao altar
  rationale: A expressão comunica que o anjo tomou posição junto ao altar, sem sugerir que estivesse em cima dele.
- source_word: λιβανωτὸν χρυσοῦν
  choice: um incensário de ouro
  rationale: λιβανωτός designa aqui o recipiente usado para queimar ou transportar incenso; “incensário” é preciso, conciso e corrente no registro bíblico.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: Foi-lhe dado muito incenso
  rationale: Preserva a voz passiva do grego e trata naturalmente o incenso como nome incontável em português.
- source_word: ἵνα δώσει
  choice: para que o oferecesse
  rationale: A construção indica finalidade; no contexto do altar e do incenso, δίδωμι tem o sentido contextual de apresentar ou oferecer.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: com as orações de todos os santos
  rationale: O dativo é sintaticamente condensado. “Com” expressa que o incenso acompanha as orações, sem desenvolver além do texto a natureza dessa relação.
- source_word: ἅγιοι
  choice: santos
  rationale: Em Apocalipse, o termo designa o povo consagrado a Deus; “santos” é a tradução tradicional, direta e compreensível.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: sobre o altar de ouro
  rationale: Com acusativo e no contexto da oferta, ἐπί aponta para o lugar sobre o qual o incenso é apresentado.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: que está diante do trono
  rationale: Torna explícita em português a relação atributiva e preserva o sentido espacial de ἐνώπιον.
theological_decisions:
- issue: Relação do incenso com as orações dos santos
  choice: O incenso é oferecido juntamente com as orações de todos os santos.
  alternative: O incenso é literalmente “dado às orações” de todos os santos.
  rationale: A sintaxe grega é compacta e permite conservar alguma tensão. O contexto cultual favorece a ideia de acompanhamento ou associação, mas a nota registra a formulação literal e evita impor uma doutrina específica de mediação angélica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Incensário” preserva o vocabulário cultual sem arcaísmo excessivo; a ordem das frases segue o movimento da visão e mantém a voz passiva do original.
