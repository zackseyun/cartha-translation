id: REV.8.2
reference: Revelation 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: pt
  text: E vi os sete anjos que estão de pé diante de Deus[a], e lhes foram dadas sete trombetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que permanecem de pé diante de Deus” ou “que têm estado de pé diante de Deus”; o verbo grego no perfeito enfatiza que essa posição é um estado contínuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: vi
  rationale: O aoristo de ὁράω, no relato de uma visão, é expresso de modo natural e direto por “vi”.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: os sete anjos
  rationale: O artigo com o numeral identifica um grupo definido; “os sete anjos” preserva essa referência sem explicar além do texto.
- source_word: ἀγγέλους
  choice: anjos
  rationale: No cenário celestial de Apocalipse, o termo designa seres celestiais, não mensageiros humanos.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Expressão corrente e digna que conserva o sentido espacial e relacional do grego.
- source_word: ἑστήκασιν
  choice: estão
  rationale: O perfeito de ἵστημι enfatiza um estado vigente. Em português, “estão diante de Deus” comunica naturalmente essa condição contínua; a nota registra alternativas mais explícitas.
- source_word: ἐδόθησαν αὐτοῖς
  choice: lhes foram dadas
  rationale: Mantém a voz passiva e deixa implícito quem deu as trombetas, como no grego.
- source_word: σάλπιγγες
  choice: trombetas
  rationale: É a tradução tradicional e contextualmente apropriada para o instrumento associado ao anúncio e ao juízo na visão apocalíptica.
theological_decisions:
- issue: Identidade e posição dos sete anjos
  choice: “os sete anjos que estão diante de Deus” sem especificar categoria ou posição hierárquica
  alternative: “os sete arcanjos” ou uma identificação explícita com tradições posteriores
  rationale: O texto grego apresenta um grupo definido de sete anjos diante de Deus, mas não os chama de arcanjos nem especifica sua categoria. A tradução evita importar uma identificação posterior.
translation_notes:
  register: Português moderno, claro e solene, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A coordenação iniciada por “E” preserva o fluxo narrativo do original.
