id: REV.8.7
reference: Revelation 8:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: pt
  text: O primeiro tocou a trombeta, e houve granizo e fogo misturados com sangue; isso foi lançado sobre a terra[a]. Um terço da terra foi queimado, um terço das árvores foi queimado, e toda a erva verde foi queimada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra” no sentido de solo ou região. A palavra grega pode referir-se tanto à terra em sentido amplo quanto a uma porção de terra; neste contexto apocalíptico, “terra” preserva melhor o alcance possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: Mantém a elipse do grego; o contexto identifica o referente como o primeiro dos sete anjos, sem inserir aqui o substantivo “anjo”.
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: Expressa em português corrente o sentido de σαλπίζω e explicita o instrumento já estabelecido pelo contexto.
- source_word: ἐγένετο
  choice: houve
  rationale: Introduz de modo natural o aparecimento do fenômeno na narrativa apocalíptica.
- source_word: χάλαζα καὶ πῦρ
  choice: granizo e fogo
  rationale: Preserva diretamente os dois elementos concretos da imagem.
- source_word: μεμιγμένα ἐν αἵματι
  choice: misturados com sangue
  rationale: Reproduz a associação dos dois elementos com sangue sem explicar nem suavizar a imagem apocalíptica.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: isso foi lançado sobre a terra
  rationale: O demonstrativo retoma coletivamente o fenômeno de granizo e fogo e preserva o verbo passivo singular do grego; “sobre” comunica o movimento em direção à superfície.
- source_word: τὸ τρίτον τῆς γῆς
  choice: um terço da terra
  rationale: É a forma idiomática natural em português para a expressão partitiva.
- source_word: κατεκάη
  choice: foi queimado/foi queimada
  rationale: Traduz o verbo intensivo κατακαίω de maneira clara; no contexto, o resultado destrutivo já é inequívoco.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: um terço das árvores
  rationale: Mantém o paralelismo quantitativo do texto.
- source_word: πᾶς χόρτος χλωρός
  choice: toda a erva verde
  rationale: “Erva” abrange capim e vegetação herbácea e conserva a imagem concreta, enquanto “verde” representa χλωρός.
theological_decisions:
- issue: Alcance de γῆ na imagem do juízo apocalíptico
  choice: terra
  alternative: região terrestre/solo
  rationale: “Terra” mantém o possível alcance amplo do cenário cósmico sem eliminar a possibilidade lexical de referência ao terreno ou à região atingida; a nota registra essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “foi queimado” preserva o ritmo cumulativo do grego. Os marcadores das notas fornecidas em inglês pareciam deslocados; a alternativa referente a γῆ foi colocada junto de “terra”, e não se criou uma nota meramente estilística para “misturados”.
