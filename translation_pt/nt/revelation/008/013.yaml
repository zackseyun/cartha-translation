id: REV.8.13
reference: Revelation 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: pt
  text: 'E vi e ouvi uma águia[a] voando no meio do céu[b] e proclamando em alta voz: “Ai, ai, ai dos que habitam sobre a terra, por causa dos outros toques de trombeta dos três anjos que estão prestes a tocar!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “um anjo” em vez de “uma águia”.
    reason: textual_variant
  - marker: b
    text: Ou “no alto do céu”; o termo grego se refere ao ponto mais alto do céu ou ao céu aberto acima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: águia
  rationale: É o sentido normal do substantivo e se ajusta à imagem visionária; “abutre” não é exigido pelo contexto.
- source_word: μεσουρανήματι
  choice: no meio do céu
  rationale: Expressão clara e digna para o céu aberto em seu ponto mais alto, preservando o registro cósmico do Apocalipse.
- source_word: λέγοντος φωνῇ μεγάλῃ
  choice: proclamando em alta voz
  rationale: Transmite de modo natural tanto o ato de falar quanto a força pública e solene do anúncio.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Ai, ai, ai
  rationale: Mantém a repetição tripla e sua intensidade profética.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: dos que habitam sobre a terra
  rationale: Preserva a formulação recorrente no Apocalipse e a preposição do grego sem reduzir a expressão a um simples gentílico.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: por causa dos outros toques de trombeta
  rationale: O contexto favorece valor causal para ἐκ; “toques de trombeta” traduz idiomaticamente os sons ainda por vir.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: que estão prestes a tocar
  rationale: Preserva a ideia de iminência de μέλλω e deixa “a trombeta” subentendida de modo natural em português.
theological_decisions:
- issue: Identidade do arauto que voa
  choice: uma águia
  alternative: um anjo
  rationale: O texto principal segue ἀετοῦ na SBLGNT. A leitura variante “anjo” é registrada em nota, sem substituir o texto-fonte adotado.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição profética foi mantida, assim como a expressão recorrente “os que habitam sobre a terra”. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
