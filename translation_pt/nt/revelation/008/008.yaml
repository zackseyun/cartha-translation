reference: Revelation 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: pt
  text: E o segundo anjo tocou a trombeta; e algo semelhante a uma grande montanha em chamas[a] foi lançado ao mar, e um terço do mar se tornou sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como uma grande montanha em chamas»; o grego indica semelhança, não necessariamente identidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: O verbo significa tocar ou soar uma trombeta. Em português, «tocou a trombeta» expressa de forma natural o objeto implícito no verbo e se ajusta à sequência das trombetas.
- source_word: ὡς
  choice: algo semelhante a
  rationale: A conjunção marca comparação ou aparência, sem identificar necessariamente o objeto como uma montanha literal. Esta formulação preserva a indeterminação da visão.
- source_word: ὄρος μέγα
  choice: uma grande montanha
  rationale: Tradução direta que conserva o tom elevado e a força da imagem apocalíptica.
- source_word: πυρὶ καιόμενον
  choice: em chamas
  rationale: Expressa naturalmente a imagem de algo ardendo com fogo, sem acrescentar uma identificação vulcânica, meteórica ou simbólica.
- source_word: ἐβλήθη
  choice: foi lançado
  rationale: O aoristo passivo indica que o objeto foi atirado ou lançado. «Foi lançado» é atual e digno, sem intensificar indevidamente a ação.
- source_word: εἰς τὴν θάλασσαν
  choice: ao mar
  rationale: Neste contexto, «lançado ao mar» comunica de modo idiomático o movimento para dentro do mar indicado por εἰς.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: um terço do mar
  rationale: Forma quantitativa natural em português, preservando o motivo recorrente de juízo parcial em Apocalipse.
- source_word: αἷμα
  choice: sangue
  rationale: Tradução direta do substantivo, sem explicar se a transformação deve ser entendida literal ou simbolicamente.
theological_decisions:
- issue: Natureza do objeto semelhante a uma montanha
  choice: Manter a linguagem comparativa sem identificar o objeto além do que o grego afirma.
  alternative: Entendê-lo explicitamente como montanha literal, meteoro ou símbolo de juízo.
  rationale: O uso de ὡς indica semelhança e deixa em aberto a natureza exata daquilo que João vê; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa foi mantida, enquanto «então» evita uma sequência pesada de conjunções. O marcador da nota foi colocado após a frase à qual a observação comparativa se refere.
