id: REV.8.5
reference: Revelation 8:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: pt
  text: O anjo pegou o incensário, encheu-o com fogo do altar e o lançou sobre a terra. Então houve estrondos de trovão, sons[a], clarões de relâmpagos e um terremoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vozes”. O termo grego pode indicar tanto vozes articuladas como sons ou ruídos em um cenário de manifestação divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: pegou
  rationale: Embora a forma grega seja perfeita, no encadeamento narrativo de Apocalipse ela apresenta a ação de modo vívido; o pretérito perfeito é a forma natural em português junto aos aoristos seguintes.
- source_word: λιβανωτόν
  choice: incensário
  rationale: Neste contexto de culto, designa o recipiente usado para queimar incenso e transportar brasas; “incensário” é o equivalente português tradicional, claro e conciso.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: encheu-o com fogo do altar
  rationale: Expressa naturalmente que o incensário foi enchido com fogo proveniente do altar, mantendo explícita a origem simbolicamente importante.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: Equivalente padrão para o altar no imaginário cultual e apocalíptico.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: o lançou sobre a terra
  rationale: “Lançou” conserva a força dramática de βάλλω, e “sobre a terra” comunica o alcance mais amplo de γῆ neste cenário de juízo cósmico.
- source_word: ἐγένοντο
  choice: houve
  rationale: Forma idiomática em português para indicar o surgimento repentino dos fenômenos.
- source_word: βρονταὶ
  choice: estrondos de trovão
  rationale: Comunica de maneira natural a pluralidade de trovões ou estampidos indicada pelo substantivo grego plural.
- source_word: φωναὶ
  choice: sons
  rationale: φωνή pode indicar vozes articuladas ou sons. Como nenhum falante é identificado, “sons” mantém aberta a natureza do fenômeno; “vozes” é preservado em nota.
- source_word: ἀστραπαὶ
  choice: clarões de relâmpagos
  rationale: Expressão portuguesa natural que preserva a pluralidade e o aspecto visual dos relâmpagos.
- source_word: σεισμός
  choice: um terremoto
  rationale: Tradução direta e idiomática do substantivo singular.
theological_decisions:
- issue: Sentido de γῆ no contexto de juízo apocalíptico
  choice: terra
  alternative: chão; região
  rationale: A cena emprega imagens de juízo de alcance cósmico. “Terra” corresponde melhor ao uso mais amplo do termo em Apocalipse, sem restringi-lo ao solo ou a uma região específica.
- issue: Sentido de φωναί na fórmula teofânica
  choice: sons
  alternative: vozes
  rationale: A lista reúne fenômenos auditivos e visuais, sem identificar quem estaria falando. “Sons” evita introduzir fala explícita, enquanto a nota conserva a leitura possível “vozes”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação foi levemente ajustada para fluidez narrativa, sem eliminar nenhum elemento do grego. O pronome “o” antes de “lançou” retoma claramente o incensário.
