source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: pt
  text: E os sete anjos que tinham as sete trombetas se prepararam para tocá-las.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazê-las soar”. O verbo grego significa tocar ou fazer soar uma trombeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: anjos
  rationale: No cenário apocalíptico de Apocalipse 8, o termo se refere naturalmente a seres celestiais; “anjos” é claro e preserva o uso tradicional.
- source_word: ἔχοντες
  choice: que tinham
  rationale: A oração relativa traduz o particípio de modo natural em português e expressa que as trombetas estavam em poder deles.
- source_word: σάλπιγγας
  choice: trombetas
  rationale: É o equivalente corrente de σάλπιγξ e preserva as ressonâncias bíblicas, cultuais e apocalípticas do objeto.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: se prepararam
  rationale: Mantém a ideia reflexiva explícita de que os próprios anjos se aprontaram, em linguagem natural e digna.
- source_word: ἵνα σαλπίσωσιν
  choice: para tocá-las
  rationale: O infinitivo introduzido por “para” comunica naturalmente a finalidade de ἵνα; o pronome retoma as sete trombetas, e “tocar” é o verbo idiomático em português para fazer soar esse instrumento.
theological_decisions:
- issue: Natureza de ἄγγελοι no contexto apocalíptico
  choice: anjos celestiais
  alternative: mensageiros humanos
  rationale: O cenário celestial e a entrega das sete trombetas favorecem fortemente seres celestiais, sem acrescentar afirmações doutrinárias além do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se prepararam” conserva a reflexividade; “tocá-las” evita repetição sem perder o referente imediato.
