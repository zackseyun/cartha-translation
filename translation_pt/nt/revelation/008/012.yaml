id: REV.8.12
reference: Revelation 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: pt
  text: E o quarto anjo tocou a trombeta, e foram atingidas a terça parte do sol, a terça parte da lua e a terça parte das estrelas, para que se escurecesse a terça parte deles, e o dia não brilhasse durante um terço dele, e a noite do mesmo modo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que a terça parte deles se escureceu, o dia não brilhou durante um terço dele, e a noite do mesmo modo”. A construção grega com “para que” também pode salientar o resultado.'
    reason: alternativa sintática
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: tocou a trombeta
  rationale: Em português, esta é uma forma natural e clara de expressar o ato de fazer soar a trombeta, explicitando o instrumento implícito no verbo grego.
- source_word: ἐπλήγη
  choice: foi atingida
  rationale: Preserva a voz passiva e a imagem de juízo do verbo grego, sem recorrer a linguagem arcaica.
- source_word: τὸ τρίτον
  choice: a terça parte
  rationale: Expressa com precisão a proporção repetida no grego e soa digna e corrente em português bíblico contemporâneo.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: sol / lua / estrelas
  rationale: Tradução direta dos termos referentes aos corpos celestes.
- source_word: ἵνα
  choice: para que
  rationale: Preserva mais explicitamente a possível nuance de propósito do grego, sem excluir a leitura consecutiva de resultado.
- source_word: σκοτισθῇ
  choice: se escurecesse
  rationale: A construção pronominal comunica naturalmente em português o escurecimento sofrido pelos astros e mantém o subjuntivo regido por 'para que'.
- source_word: αὐτῶν
  choice: deles
  rationale: Mantém a referência plural coletiva ao sol, à lua e às estrelas.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: o dia não brilhasse
  rationale: No contexto do escurecimento cósmico, 'brilhar' comunica melhor a emissão ou manifestação de luz do que o sentido mais genérico de 'aparecer'.
- source_word: τὸ τρίτον αὐτῆς
  choice: durante a terça parte dele
  rationale: Torna claro que a limitação se aplica a uma fração da duração do dia, preservando a referência pronominal do grego.
- source_word: ἡ νὺξ ὁμοίως
  choice: e a noite, do mesmo modo
  rationale: Mantém a formulação compacta do original e indica que a mesma limitação se aplica à noite.
theological_decisions:
- issue: Natureza da imagem do juízo cósmico
  choice: Apresentar diretamente o escurecimento dos corpos celestes como linguagem de juízo apocalíptico, sem definir se o acontecimento é literal, simbólico ou ambos.
  alternative: Interpretar explicitamente o fenômeno como evento astronômico estritamente literal ou como simbolismo exclusivamente político e cósmico.
  rationale: O versículo descreve o juízo e sua extensão, mas não determina no próprio enunciado qual esquema interpretativo deve ser adotado.
- issue: Nuance de ἵνα
  choice: Usar 'para que', preservando a nuance possível de propósito.
  alternative: Usar 'de modo que' ou uma formulação indicativa que destaque sobretudo o resultado.
  rationale: A construção grega admite propósito ou resultado; a tradução principal mantém a forma mais próxima, e a nota registra a alternativa consecutiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “a terça parte” preserva o ritmo enfático do original. O pronome “deles” mantém a referência plural aos três grupos de corpos celestes.
