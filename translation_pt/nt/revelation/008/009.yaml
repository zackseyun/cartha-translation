source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: pt
  text: E morreu um terço das criaturas que estavam no mar, as que tinham vida[a], e um terço dos navios foi destruído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinham almas” ou “eram seres vivos”. Em grego, “as que tinham almas/vidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: morreu
  rationale: O aoristo de ἀποθνῄσκω expressa diretamente a morte; “morreu” é natural e preserva o singular determinado por “um terço”.
- source_word: τὸ τρίτον
  choice: um terço
  rationale: Expressão quantitativa idiomática em português, repetida nas duas partes do versículo.
- source_word: κτισμάτων
  choice: criaturas
  rationale: Embora κτίσμα possa significar “coisa criada”, a qualificação seguinte indica seres animados do mar.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: que estavam no mar
  rationale: Explicita naturalmente em português a localização expressa pelo grego.
- source_word: τὰ ἔχοντα ψυχάς
  choice: as que tinham vida
  rationale: Neste contexto, ψυχή caracteriza criaturas animadas. “Tinham vida” comunica o sentido sem sugerir indevidamente uma afirmação técnica sobre a alma dos animais; a nota preserva a forma lexical alternativa.
- source_word: πλοίων
  choice: navios
  rationale: Equivalente claro e corrente de πλοῖον no contexto marítimo.
- source_word: διεφθάρησαν
  choice: foi destruído
  rationale: O passivo de διαφθείρω indica ruína destrutiva. O singular concorda naturalmente com “um terço”, embora o grego use o plural conforme “navios”.
theological_decisions:
- issue: Sentido de ψυχάς aplicado às criaturas marinhas
  choice: tinham vida
  alternative: tinham almas viventes; eram seres vivos
  rationale: A expressão grega denota aqui vida animada, sem necessariamente formular uma antropologia dos animais. A tradução principal mantém a referência à vida, e a nota registra a expressão mais literal e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita uma formulação artificial, mas conserva em nota a amplitude de ψυχή. O singular verbal acompanha idiomaticamente “um terço” em ambas as orações.
