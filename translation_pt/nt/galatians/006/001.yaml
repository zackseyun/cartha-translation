id: GAL.6.1
reference: Galatians 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: pt
  text: Irmãos[a], mesmo que alguém seja apanhado em alguma transgressão[b], vocês, que são espirituais, restaurem essa pessoa com espírito de mansidão[c]. Cada um cuide de si mesmo, para que também não seja tentado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode dirigir-se a um grupo misto de irmãos e irmãs na fé.
    reason: lexical_alternative
  - marker: b
    text: Ou “seja alcançado por alguma transgressão” ou “seja surpreendido em alguma transgressão”.
    reason: alternative_reading
  - marker: c
    text: A expressão também pode evocar a mansidão produzida pelo Espírito; o grego não exige que se escolha exclusivamente entre a disposição humana e a ação do Espírito.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Irmãos
  rationale: O vocativo masculino plural é a forma direta e tradicional em português e, no contexto, pode abranger toda a comunidade de fiéis; a nota esclarece esse alcance sem tornar o texto principal pesado.
- source_word: ἐὰν καὶ
  choice: mesmo que
  rationale: Expressa com naturalidade a força condicional e concessiva da construção grega.
- source_word: προλημφθῇ
  choice: seja apanhado
  rationale: Mantém aberta a possibilidade de a pessoa ser encontrada na transgressão ou ser dominada por ela; uma nota registra alternativas relevantes.
- source_word: ἄνθρωπος
  choice: alguém
  rationale: Aqui o substantivo singular é genericamente humano, sem indicação contextual de que se trate especificamente de um homem; “alguém” reproduz o referente singular de modo natural e exato em português.
- source_word: ἔν τινι παραπτώματι
  choice: em alguma transgressão
  rationale: “Transgressão” comunica a gravidade moral de παράπτωμα, enquanto “alguma” representa τινι.
- source_word: οἱ πνευματικοὶ
  choice: vocês, que são espirituais
  rationale: Preserva a formulação ampla de Paulo sem especificar se a ênfase recai sobretudo na maturidade espiritual ou na vida orientada pelo Espírito.
- source_word: καταρτίζετε
  choice: restaurem
  rationale: O imperativo indica trazer a pessoa de volta a uma condição correta, e “restaurar” transmite tanto correção quanto recuperação.
- source_word: τὸν τοιοῦτον
  choice: essa pessoa
  rationale: Retoma com clareza e naturalidade a pessoa mencionada na oração condicional.
- source_word: ἐν πνεύματι πραΰτητος
  choice: com espírito de mansidão
  rationale: Preserva a possível referência à disposição humana e sua ressonância com a ação do Espírito, além de manter “mansidão” como virtude moral sem reduzi-la a mera delicadeza.
- source_word: σκοπῶν σεαυτόν
  choice: Cada um cuide de si mesmo
  rationale: Torna natural em português a mudança do plural para o singular presente no grego e ressalta a responsabilidade individual de quem restaura.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: para que também não seja tentado
  rationale: No contexto moral, “tentado” é o sentido mais provável; “também” conserva o alerta de que quem restaura compartilha a mesma vulnerabilidade.
theological_decisions:
- issue: Alcance de Ἀδελφοί
  choice: Manter “Irmãos” no texto e esclarecer em nota que o vocativo pode incluir irmãos e irmãs.
  alternative: “Irmãos e irmãs”
  rationale: A opção conserva a forma gramatical da fonte, enquanto a nota evita que leitores modernos entendam a exortação como dirigida exclusivamente a homens.
- issue: Identidade dos οἱ πνευματικοὶ
  choice: “vocês, que são espirituais”
  alternative: “vocês, que são guiados pelo Espírito”
  rationale: A formulação escolhida não decide se Paulo se refere especificamente aos maduros, aos que vivem pelo Espírito, ou a ambos.
- issue: Sentido de προλημφθῇ
  choice: “seja apanhado”
  alternative: “seja dominado” ou “seja surpreendido”
  rationale: O verbo admite a ideia de ser encontrado numa falta, alcançado por ela ou pego de surpresa. O texto principal permanece conciso, e a nota preserva essa amplitude.
- issue: Referência de πνεύματι em ἐν πνεύματι πραΰτητος
  choice: “com espírito de mansidão”
  alternative: “com a mansidão produzida pelo Espírito”
  rationale: A ausência de artigo e a construção permitem entender “espírito” como disposição humana, sem excluir uma ressonância com o Espírito e com o fruto citado em Gálatas 5:23; a tradução não força uma única leitura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas naturais para leitores brasileiros. “Mansidão” e “transgressão” mantêm o tom moral e pastoral do texto sem recorrer a linguagem excessivamente arcaica. A divisão em duas frases torna clara a mudança do chamado coletivo para a vigilância individual.
