  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: pt
  text: Pois cada um levará a sua própria carga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregará o seu próprio fardo”. Aqui, o grego usa φορτίον (“carga”), termo diferente de βάρη (“fardos”) no versículo 2.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva o sentido distributivo singular, destacando cada pessoa individualmente, em português natural.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa do conectivo e liga o versículo ao contexto anterior sem explicação excessiva.
- source_word: τὸ ἴδιον
  choice: a sua própria
  rationale: Expressa com clareza aquilo que pertence especificamente a cada pessoa; a construção retoma naturalmente o singular de “cada um”.
- source_word: φορτίον
  choice: carga
  rationale: Designa algo que se leva e permite preservar a distinção lexical em relação a βάρη (“fardos”) no versículo 2.
- source_word: βαστάσει
  choice: levará
  rationale: Reproduz o futuro ativo e combina de modo corrente e concreto com “carga”.
theological_decisions:
- issue: Relação de Gálatas 6:5 com 6:2
  choice: Preservar a distinção entre “fardos” no versículo 2 e “carga” neste versículo, sem eliminar a tensão entre ajuda mútua e responsabilidade individual.
  alternative: Traduzir os dois substantivos por “fardo” ou explicitar aqui uma prestação de contas escatológica.
  rationale: O texto grego emprega substantivos diferentes no contexto imediato. A tradução mantém essa diferença sem impor uma harmonização nem uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Pois” conserva a ligação argumentativa; “cada um” mantém a força singular sem tornar a frase artificial.
