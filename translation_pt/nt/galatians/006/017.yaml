source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: pt
  text: De agora em diante, ninguém me cause incômodo, pois trago no meu corpo as marcas[a] de Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marcas de propriedade”; o termo pode se referir a marcas no corpo que identificam pertencimento ou lealdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: De agora em diante
  rationale: Expressão temporal idiomática que indica o período a partir deste momento; é natural e clara em português moderno.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: ninguém me cause incômodo
  rationale: Na construção κόπους παρέχειν, κόπους não se refere simplesmente a trabalhos, mas a transtorno, aborrecimento ou incômodo causado a alguém. A forma imperativa negativa é preservada de modo natural.
- source_word: στίγματα
  choice: marcas
  rationale: O termo designa marcas corporais, inclusive marcas de identificação ou de propriedade. “Marcas” mantém a amplitude sem restringir o sentido a cicatrizes ou tatuagens.
- source_word: τοῦ Ἰησοῦ
  choice: de Jesus
  rationale: 'O genitivo permanece deliberadamente aberto: pode indicar marcas associadas a Jesus ou marcas que identificam Paulo como pertencente a ele.'
- source_word: ἐν τῷ σώματί μου
  choice: no meu corpo
  rationale: “No meu corpo” é idiomático em português e conserva adequadamente a localização corporal expressa por ἐν.
- source_word: βαστάζω
  choice: trago
  rationale: βαστάζω significa carregar ou trazer. “Trago” soa natural para marcas presentes no corpo e preserva o tom solene sem sugerir apenas suportar sofrimento.
theological_decisions:
- issue: Natureza dos στίγματα de Paulo
  choice: “as marcas de Jesus”, sem especificar a natureza delas
  alternative: cicatrizes literais de perseguição; marcas de propriedade ou lealdade; metáfora do sofrimento apostólico e da identificação com Jesus
  rationale: O termo provavelmente evoca marcas físicas resultantes do sofrimento e, ao mesmo tempo, identificação ou pertencimento a Jesus. O texto não obriga a escolher apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Incômodo” comunica o valor idiomático de κόπους sem tornar a exortação excessivamente coloquial. A nota preserva a nuance cultural de marcas identificadoras.
