  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: pt
  text: 'Não se enganem: de Deus não se zomba, pois aquilo que uma pessoa semear, isso também colherá.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Não se enganem
  rationale: Preserva o imperativo presente na segunda pessoa do plural e o sentido passivo ou reflexivo idiomático da advertência, em português natural e direto.
- source_word: θεὸς
  choice: Deus
  rationale: Equivalente padrão de θεός neste enunciado sobre o único Deus.
- source_word: οὐ μυκτηρίζεται
  choice: de Deus não se zomba
  rationale: A formulação impessoal é idiomática em português, mantém o sentido de zombar ou tratar com desprezo e conserva a força proverbial da declaração.
- source_word: ὃ γὰρ ἐὰν
  choice: pois aquilo que
  rationale: Expressa de modo natural a relação indefinida e geral introduzida pela construção grega.
- source_word: σπείρῃ
  choice: semear
  rationale: Mantém literalmente a metáfora agrícola e sua correspondência com a colheita.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste contexto, ἄνθρωπος designa genericamente qualquer ser humano, não especificamente um homem do sexo masculino; 'uma pessoa' transmite esse referente geral com clareza em português.
- source_word: τοῦτο καὶ θερίσει
  choice: isso também colherá
  rationale: Preserva o demonstrativo enfático τοῦτο e o καί, salientando que se colherá precisamente o que foi semeado.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος
  choice: uma pessoa
  alternative: um homem
  rationale: Embora o substantivo grego esteja no singular e tenha gênero gramatical masculino, seu referente aqui é o ser humano em geral. A tradução inclusiva comunica o alcance universal do princípio sem acrescentar uma restrição sexual ausente do contexto.
- issue: Força de οὐ μυκτηρίζεται
  choice: de Deus não se zomba
  alternative: Deus não é ridicularizado / Deus não se deixa zombar
  rationale: 'A escolha preserva a afirmação categórica e sua tensão: os seres humanos podem tentar tratar Deus com desprezo, mas não o fazem impunemente nem frustram sua ordem moral. Evita explicar essa implicação dentro do texto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A inversão 'de Deus não se zomba' é corrente e dá à sentença a concisão proverbial do grego. Mantêm-se as metáforas paralelas de semear e colher.
