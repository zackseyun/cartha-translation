id: GAL.6.10
reference: Galatians 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: pt
  text: Portanto, enquanto temos oportunidade[a], façamos o bem a todos, especialmente aos que pertencem à família da fé[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto temos tempo”. O termo grego καιρός enfatiza um tempo oportuno ou apropriado, e não meramente o tempo em geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos membros da casa da fé”. O grego emprega linguagem de casa ou família para falar dos que pertencem à comunidade dos que creem.
    reason: lexical_alternative
  - marker: c
    text: “Fé” também pode ser entendida como “a fé”, no sentido da confissão cristã compartilhada.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão decorrente do argumento anterior. “Portanto” expressa essa força inferencial de modo natural e conciso em português.
- source_word: ὡς καιρὸν ἔχομεν
  choice: enquanto temos oportunidade
  rationale: καιρός indica aqui uma ocasião apropriada ou favorável, não simplesmente o tempo em sentido cronológico. A expressão escolhida conserva tanto a dimensão temporal quanto a ocasião para agir.
- source_word: ἐργαζώμεθα
  choice: façamos
  rationale: O subjuntivo presente tem força exortativa e convoca a comunidade a uma prática contínua. “Façamos” combina naturalmente com τὸ ἀγαθόν em português.
- source_word: τὸ ἀγαθὸν
  choice: o bem
  rationale: O adjetivo neutro substantivado designa aquilo que é bom. “O bem” é uma formulação clara, corrente e moralmente abrangente em português.
- source_word: πρὸς πάντας
  choice: a todos
  rationale: πρός com acusativo indica as pessoas em direção às quais a ação é realizada. “A todos” comunica com naturalidade o alcance universal da exortação.
- source_word: μάλιστα δὲ
  choice: especialmente
  rationale: μάλιστα estabelece uma prioridade particular dentro do mandamento geral, sem excluir os demais. “Especialmente” preserva essa ênfase.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: aos que pertencem à família da fé
  rationale: οἰκεῖοι designa pessoas pertencentes a uma casa ou família. A tradução conserva a metáfora familiar e evita restringi-la indevidamente a uma estrutura institucional.
- source_word: πίστεως
  choice: fé
  rationale: O genitivo identifica a fé como esfera ou característica dessa família. “Fé” mantém a formulação ampla do texto e não decide de forma excessiva entre a confiança crente e a fé compartilhada como confissão.
theological_decisions:
- issue: Alcance e prioridade da prática do bem
  choice: A exortação abrange todas as pessoas e confere prioridade especial aos membros da comunidade de fé.
  alternative: Limitar a prática do bem apenas aos cristãos, ou negar qualquer prioridade particular à comunidade de fé.
  rationale: πρὸς πάντας estabelece o alcance universal, enquanto μάλιστα introduz uma ênfase especial. A tradução mantém os dois elementos sem fazer um anular o outro.
- issue: Sentido de τῆς πίστεως
  choice: Manter “fé” como a característica que identifica a família.
  alternative: Traduzir explicitamente como “a fé”, em sentido confessional, ou como “fidelidade”.
  rationale: O contexto favorece a comunidade constituída pela fé, mas a expressão também pode evocar a fé compartilhada. A formulação principal preserva essa abertura sem impor uma leitura denominacional ou institucional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Família da fé” preserva a metáfora doméstica de modo mais natural do que uma reprodução rígida de “casa”, enquanto as notas registram as alternativas lexicais e a possível leitura confessional de πίστεως.
