id: GAL.6.3
reference: Galatians 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: pt
  text: Pois, se alguém pensa ser alguma coisa, não sendo nada, engana a si mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ilude a si mesmo”.'
    reason: Alternativa lexical para φρεναπατᾷ, que enfatiza o engano ocorrido na própria mente.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Mantém tanto a força explicativa de γάρ, ligando a afirmação à exortação anterior, quanto o sentido condicional de εἰ, em português natural.
- source_word: δοκεῖ
  choice: pensa
  rationale: Neste contexto, δοκέω descreve a avaliação que a pessoa faz de si mesma, não a aparência que apresenta aos outros.
- source_word: τις
  choice: alguém
  rationale: Expressa de modo natural o caráter genérico do pronome indefinido τις.
- source_word: εἶναί τι
  choice: ser alguma coisa
  rationale: Preserva a formulação concisa e o contraste deliberado entre considerar-se 'alguma coisa' e não ser 'nada', sem explicitar demais a ideia de importância.
- source_word: μηδὲν ὤν
  choice: não sendo nada
  rationale: Reproduz de perto a construção participial e evita decidir entre uma relação meramente circunstancial e uma concessiva mais marcada.
- source_word: φρεναπατᾷ
  choice: engana
  rationale: Comunica claramente a ideia de iludir ou desencaminhar a própria mente; a alternativa 'ilude' é registrada em nota.
- source_word: ἑαυτόν
  choice: a si mesmo
  rationale: Retoma de forma reflexiva o sujeito genérico singular, preservando o número e a concordância masculina do grego.
theological_decisions:
- issue: Referência masculina genérica
  choice: alguém / a si mesmo
  alternative: a pessoa / a si mesma; alguém / a si próprio
  rationale: O grego apresenta um sujeito indefinido singular e formas masculinas singulares em sentido representativo. A tradução mantém esse perfil gramatical sem restringir a aplicação aos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'não sendo nada' preserva a concisão e a tensão retórica do original; 'alguma coisa' evita reduzir o sentido apenas a status ou importância.
