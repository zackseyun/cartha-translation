id: GAL.6.8
reference: Galatians 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: pt
  text: Pois quem semeia para a sua própria carne[a] colherá da carne corrupção[b]; mas quem semeia para o Espírito[c] colherá do Espírito a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a sua própria natureza pecaminosa”. A palavra grega traduzida como “carne” pode indicar o corpo físico ou, nos contrastes éticos de Paulo, a orientação humana caída que se opõe ao Espírito.
    reason: lexical_alternative
  - marker: b
    text: Ou “ruína” ou “deterioração”. A palavra grega pode se referir a corrupção, destruição ou decomposição.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o Espírito Santo. Alguns traduzem “espírito” com inicial minúscula, mas, em Gálatas, esse contraste normalmente se refere ao Espírito de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: No contexto, introduz a razão que fundamenta a exortação anterior; “Pois” conserva com naturalidade a força explicativa.
- source_word: ὁ σπείρων
  choice: quem semeia
  rationale: O particípio presente substantivado tem sentido genérico. “Quem semeia” reproduz de modo natural a formulação proverbial.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: para a sua própria carne
  rationale: Com σπείρω, εἰς indica a esfera ou o alvo do semear. “Carne” preserva o vocabulário paulino e ἑαυτοῦ é expresso por “sua própria”.
- source_word: ἐκ τῆς σαρκὸς
  choice: da carne
  rationale: ἐκ marca a fonte de onde procede a colheita e mantém o paralelismo com “do Espírito”.
- source_word: θερίσει
  choice: colherá
  rationale: Mantém a imagem agrícola e forma, com “semeia”, um par verbal corrente em português.
- source_word: φθοράν
  choice: corrupção
  rationale: O termo pode designar corrupção, deterioração ou ruína. “Corrupção” conserva sua amplitude moral, física e escatológica sem restringi-lo a uma única nuance.
- source_word: ὁ δὲ σπείρων
  choice: mas quem semeia
  rationale: δέ estabelece contraste, e a repetição de “quem semeia” preserva a antítese equilibrada do grego.
- source_word: εἰς τὸ πνεῦμα
  choice: para o Espírito
  rationale: No contraste carne/Espírito em Gálatas, πνεῦμα refere-se mais provavelmente ao Espírito de Deus; a inicial maiúscula explicita esse referente contextual.
- source_word: ἐκ τοῦ πνεύματος
  choice: do Espírito
  rationale: ἐκ indica fonte, em paralelismo direto com “da carne”.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa consagrada, natural e semanticamente adequada para a vida pertencente à era vindoura e sem fim.
theological_decisions:
- issue: Sentido de σάρξ no contraste ético paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: Embora o contexto tenha sentido ético, “carne” preserva o termo característico de Paulo e sua tensão sem transformá-lo numa paráfrase interpretativa.
- issue: Referente de πνεῦμα
  choice: Espírito
  alternative: espírito
  rationale: O contraste recorrente entre carne e Espírito em Gálatas aponta mais naturalmente para o Espírito Santo, embora a escrita grega antiga não distinguisse maiúsculas e minúsculas como o português moderno.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura antitética e a metáfora agrícola do original foram preservadas. Empregou-se “carne” no texto principal para manter o vocabulário paulino, com esclarecimento em nota.
