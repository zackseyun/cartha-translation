id: GAL.6.18
reference: Galatians 6:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: pt
  text: A graça de nosso Senhor Jesus, o Messias,[a] esteja com o espírito de vocês, irmãos.[b] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, na forma mais tradicional, “Jesus Cristo”. O título grego Χριστός significa “Messias”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se dirige à comunidade dos que creem e pode incluir tanto homens quanto mulheres; alternativamente, “irmãos e irmãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado nas bênçãos paulinas; preserva tanto o sentido de favor concedido quanto seu peso teológico.
- source_word: κυρίου
  choice: Senhor
  rationale: Equivalente natural e tradicional de κύριος neste contexto confessional.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e torna explícito seu sentido, sem tratá-lo apenas como parte do nome.
- source_word: μετὰ
  choice: esteja com
  rationale: A fórmula grega não tem verbo expresso; 'esteja' completa naturalmente a bênção em português.
- source_word: πνεύματος ὑμῶν
  choice: o espírito de vocês
  rationale: Preserva o singular 'espírito' e o referente plural de ὑμῶν, dirigindo a bênção à comunidade.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego; uma nota esclarece que, neste uso comunitário, o termo pode abranger homens e mulheres.
- source_word: ἀμήν
  choice: Amém
  rationale: Forma litúrgica convencional em português para a conclusão da bênção.
theological_decisions:
- issue: Tradução de Χριστός na bênção final paulina
  choice: Messias
  alternative: Cristo
  rationale: Χριστός conserva aqui seu valor titular. 'Messias' comunica o significado do título; a forma tradicional 'Cristo' é registrada em nota.
- issue: Alcance de ἀδελφοί ao se dirigir à comunidade cristã
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural do grego, enquanto a nota explicita que o uso pode incluir toda a comunidade, homens e mulheres.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A expressão 'o espírito de vocês' mantém a combinação grega de substantivo singular com pronome plural; as vírgulas em torno de 'o Messias' apresentam o termo como título explicativo.
