id: GAL.6.14
reference: Galatians 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: pt
  text: Mas, quanto a mim, que eu jamais me glorie, a não ser na cruz de nosso Senhor Jesus, o Messias, por meio da qual o mundo foi crucificado para mim, e eu para o mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de quem”, se o pronome relativo for entendido como referência ao Senhor Jesus, o Messias, e não à cruz.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: que eu jamais me orgulhe
  rationale: A construção optativa expressa forte repúdio pessoal. Em português atual, a formulação com “jamais” preserva a intensidade e se integra naturalmente ao infinitivo dependente.
- source_word: καυχᾶσθαι
  choice: me orgulhe
  rationale: No contexto, o verbo indica gloriar-se ou orgulhar-se de algo como fundamento de honra. “Orgulhar-se” é claro e atual, sem perder o contraste retórico paulino.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Marca a única exceção admitida e soa natural no português contemporâneo.
- source_word: σταυρῷ
  choice: cruz
  rationale: É o equivalente convencional e contextualmente adequado no uso paulino relativo à morte de Jesus.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico consagrado e corresponde ao uso contextual de κύριος.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: 'Traduz o conteúdo titular de Χριστός em vez de apenas transliterá-lo; o artigo torna a expressão idiomática em português: “Jesus, o Messias”.'
- source_word: δι’ οὗ
  choice: por meio da qual
  rationale: O pronome relativo masculino singular tem como antecedente gramatical mais próximo σταυρῷ, também masculino singular. A expressão comunica adequadamente o valor instrumental.
- source_word: κόσμος
  choice: o mundo
  rationale: Mantém a amplitude da expressão grega e evita explicar no corpo do texto, de maneira interpretativa, o mundo como ordem presente alienada de Deus.
- source_word: ἐσταύρωται
  choice: foi crucificado
  rationale: Preserva a metáfora da crucificação. Embora o perfeito grego destaque um ato consumado com efeito presente, o pretérito perfeito português é a forma mais natural aqui; o estado resultante decorre do contexto.
- source_word: κἀγὼ κόσμῳ
  choice: e eu para o mundo
  rationale: Mantém a elipse verbal do grego e o paralelismo compacto; “fui crucificado” é compreendido a partir da oração anterior.
theological_decisions:
- issue: Tradução de Χριστοῦ na designação Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Aqui Χριστός conserva conteúdo titular. Traduzir por “o Messias” torna esse sentido transparente sem introduzir uma particularidade denominacional.
- issue: Antecedente de δι’ οὗ
  choice: 'a cruz: “por meio da qual”'
  alternative: 'Jesus, o Messias: “por meio de quem”'
  rationale: A cruz é o antecedente mais próximo e apresenta concordância gramatical com o pronome. Como a forma grega também pode ser relacionada à pessoa mencionada na expressão anterior, a alternativa é registrada em nota para preservar a ambiguidade possível.
- issue: Força da crucificação recíproca
  choice: 'manter a imagem: “o mundo foi crucificado para mim, e eu para o mundo”'
  alternative: explicitar como ruptura ou morte mútua
  rationale: A metáfora deliberadamente forte de Paulo deve permanecer sem ser reduzida a uma paráfrase teológica sobre separação, valores ou influência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quanto a mim” dá naturalidade ao ἐμοὶ δέ e reforça o contraste pessoal. A vírgula em “Jesus, o Messias” apresenta “o Messias” como título explicativo. A elipse final foi mantida para conservar o paralelismo do original.
