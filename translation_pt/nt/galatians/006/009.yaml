id: GAL.6.9
reference: Galatians 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: pt
  text: E não desanimemos de fazer o bem[a], pois, no tempo próprio[b], colheremos, se não nos deixarmos vencer pelo cansaço[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de fazer o que é bom”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no devido tempo”.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “não desfalecendo” ou “não ficando exaustos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: de fazer o bem
  rationale: O adjetivo neutro substantivado com ποιέω forma uma expressão que significa praticar o que é bom ou nobre. “Fazer o bem” é natural em português e mantém o sentido ético e a ação contínua.
- source_word: μὴ ἐγκακῶμεν
  choice: não desanimemos
  rationale: O verbo expressa perder o ânimo ou a coragem e, por consequência, deixar de perseverar. “Não desanimemos” comunica diretamente essa exortação sem confundi-la por completo com a imagem de exaustão no fim do versículo.
- source_word: καιρῷ ... ἰδίῳ
  choice: no tempo próprio
  rationale: καιρός indica a ocasião apropriada, e ἴδιος reforça a ideia do tempo que lhe é próprio. A formulação conserva essa nuance sem especificar quem determina o tempo.
- source_word: θερίσομεν
  choice: colheremos
  rationale: O futuro mantém a metáfora agrícola do contexto. “Colheremos” é corrente em português e pode referir-se tanto à colheita literal quanto ao resultado figurado.
- source_word: μὴ ἐκλυόμενοι
  choice: se não nos deixarmos vencer pelo cansaço
  rationale: O particípio pode descrever quem se enfraquece, desfalece ou fica exausto. A construção condicional em português explicita a relação natural com “colheremos” e preserva a distinção retórica em relação a “não desanimemos”.
theological_decisions:
- issue: Relação entre as duas expressões de perseverança (ἐγκακῶμεν / ἐκλυόμενοι)
  choice: Distinguir as expressões como “não desanimemos” e “se não nos deixarmos vencer pelo cansaço”.
  alternative: Empregar termos mais próximos ou repetidos, como “não nos cansemos” e “se não desanimarmos”.
  rationale: Paulo usa verbos relacionados, mas não idênticos. A diferenciação preserva tanto a perda de ânimo quanto o esgotamento que pode levar alguém a desistir, sem acrescentar uma conclusão doutrinária que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase conserva a metáfora da colheita, evita linguagem excessivamente eclesiástica e diferencia as duas expressões gregas ligadas ao desânimo e ao esgotamento.
