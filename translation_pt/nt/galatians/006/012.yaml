source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: pt
  text: Todos os que querem causar boa impressão na carne[a] são justamente os que obrigam vocês a serem circuncidados, somente para que não sejam perseguidos por causa da cruz do Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “causar boa impressão exteriormente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “da cruz de Cristo”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅσοι
  choice: Todos os que
  rationale: Expressa de modo natural e abrangente a classe de pessoas indicada pelo relativo quantitativo.
- source_word: θέλουσιν
  choice: querem
  rationale: Comunica diretamente a vontade ou intenção expressa pelo presente do indicativo.
- source_word: εὐπροσωπῆσαι
  choice: causar boa impressão
  rationale: Reproduz o sentido de apresentar uma aparência favorável ou obter aprovação, sem reduzir a expressão simplesmente a 'parecer bem'.
- source_word: ἐν σαρκί
  choice: na carne
  rationale: Mantém o termo paulino σάρξ e sua tensão semântica, enquanto a nota esclarece sua provável referência à aparência exterior e corporal.
- source_word: οὗτοι
  choice: são justamente os que
  rationale: 'Preserva a ênfase demonstrativa: essas mesmas pessoas são as responsáveis pela pressão.'
- source_word: ἀναγκάζουσιν
  choice: pressionam
  rationale: No contexto, indica coerção para aceitar a circuncisão; 'pressionam' soa natural e evita sugerir necessariamente força física consumada.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: vocês a serem circuncidados
  rationale: Preserva o sentido passivo do infinitivo e identifica claramente a prática em questão.
- source_word: μόνον ἵνα
  choice: apenas para
  rationale: Expressa de modo conciso tanto a limitação do motivo quanto a finalidade da ação.
- source_word: τῷ σταυρῷ
  choice: por causa da cruz
  rationale: Torna explícito o valor causal ou referencial provável do dativo com o verbo 'perseguir'.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título neste genitivo, preservando seu conteúdo messiânico.
- source_word: μὴ διώκωνται
  choice: não serem perseguidos
  rationale: A construção final com subjuntivo passivo indica que o objetivo deles é evitar a perseguição.
theological_decisions:
- issue: Sentido de ἐν σαρκί
  choice: na carne
  alternative: exteriormente; no que é exterior
  rationale: A tradução principal conserva a linguagem teologicamente carregada de Paulo e sua possível amplitude, enquanto a nota oferece o sentido contextual ligado à exibição externa, sobretudo à circuncisão.
- issue: Tradução de Χριστοῦ em τῷ σταυρῷ τοῦ Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Aqui Χριστός permanece inteligível como título daquele cuja cruz provoca perseguição; a forma tradicional é registrada em nota.
- issue: Relação do dativo τῷ σταυρῷ com διώκωνται
  choice: por causa da cruz
  alternative: pela cruz; em razão da cruz
  rationale: O português explícito comunica a relação causal mais provável sem acrescentar um agente não presente no grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com 'vocês' para o plural de segunda pessoa. A ordem foi ajustada à sintaxe natural do português, preservando a ênfase de οὗτοι por meio de 'justamente'. Mantém-se 'carne' no texto para conservar a tensão paulina, com esclarecimento em nota.
