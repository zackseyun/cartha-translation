id: GAL.6.4
reference: Galatians 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: pt
  text: Mas cada um examine a sua própria obra, e então terá motivo para se gloriar somente em relação a si mesmo, e não em relação a outra pessoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργον
  choice: obra
  rationale: “Obra” preserva a amplitude do termo grego, abrangendo aquilo que a pessoa faz e sua conduta, sem restringi-lo a um ato isolado.
- source_word: δοκιμαζέτω
  choice: examine
  rationale: O imperativo pede uma avaliação pessoal da qualidade da própria obra; “examine” é natural em português e não pressupõe que o resultado seja positivo.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a força distributiva e a construção singular do grego.
- source_word: ἑαυτοῦ
  choice: a sua própria
  rationale: Expressa claramente o reflexivo, vinculando a obra à própria pessoa que a examina.
- source_word: καύχημα
  choice: motivo para se gloriar
  rationale: O substantivo pode indicar tanto aquilo em que alguém se gloria quanto a base para isso; esta formulação comunica naturalmente a ideia de fundamento sem transformar o termo em “orgulho”.
- source_word: εἰς ἑαυτὸν μόνον
  choice: apenas em relação a si mesmo
  rationale: Preserva o foco reflexivo e a força restritiva de μόνον, preparando o contraste com a comparação interpessoal.
- source_word: τὸν ἕτερον
  choice: outra pessoa
  rationale: Torna explícito que ἕτερον designa outra pessoa em contraste com o próprio sujeito.
- source_word: δέ
  choice: Mas
  rationale: Sinaliza a leve contraposição com o contexto anterior.
theological_decisions:
- issue: Sentido de καύχημα no contexto paulino
  choice: “motivo para se gloriar”
  alternative: “glória”, “orgulho” ou “razão para se orgulhar”
  rationale: A tradução conserva a possibilidade de o termo indicar a base ou matéria do gloriar-se, sem atribuir-lhe automaticamente o sentido moderno positivo ou negativo de “orgulho”.
- issue: Natureza do contraste introduzido por εἰς... καὶ οὐκ εἰς
  choice: Explicitar como avaliação de si sem comparação com outra pessoa
  alternative: 'Forma estritamente literal: “em si mesmo... e não no outro”'
  rationale: No contexto, as expressões preposicionais contrapõem o exame da própria obra à obtenção de glória mediante outra pessoa. A formulação portuguesa esclarece essa relação sem decidir qual seria o resultado do exame.
- issue: Masculino singular genérico
  choice: “cada um... sua... si mesmo”
  alternative: “cada pessoa... sua... si mesma” ou construção plural neutra
  rationale: “Cada um” reproduz naturalmente em português o singular distributivo e o masculino genérico do texto, sem sugerir exclusão das mulheres.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita o anglicismo “ter seu motivo” e emprega “gloriar-se”, termo corrente no registro bíblico, mas ainda inteligível. Não são necessárias notas, pois “outra pessoa” e “em comparação” tornam explícitas no corpo do texto as relações semânticas relevantes.
