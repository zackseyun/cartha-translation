  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: pt
  text: Vejam com que letras grandes escrevi a vocês de próprio punho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam como é longa a carta que escrevi a vocês de próprio punho.”'
    reason: Leitura alternativa de πηλίκοις γράμμασιν como referência à extensão da carta, não ao tamanho dos caracteres.
lexical_decisions:
- source_word: Ἴδετε
  choice: Vejam
  rationale: O imperativo aoristo plural funciona como chamado direto à atenção; “Vejam” é natural, conciso e preserva o plural.
- source_word: πηλίκοις
  choice: com que ... grandes
  rationale: No contexto de γράμμασιν, indica mais provavelmente o tamanho dos caracteres escritos, sem eliminar a leitura alternativa referente à extensão da carta.
- source_word: γράμμασιν
  choice: letras
  rationale: Aqui designa naturalmente letras ou caracteres da escrita, especialmente por estar ligado à menção da própria mão de Paulo.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo funciona como objeto indireto de ἔγραψα; “a vocês” oferece ampla legibilidade no português moderno.
- source_word: ἔγραψα
  choice: escrevi
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito português, podendo apontar para o trecho que Paulo escreve pessoalmente.
- source_word: τῇ ἐμῇ χειρί
  choice: de próprio punho
  rationale: Expressão portuguesa idiomática que comunica o valor instrumental e a ênfase de que Paulo escreveu pessoalmente.
theological_decisions:
- issue: Interpretação de πηλίκοις γράμμασιν
  choice: tamanho físico das letras
  alternative: extensão da carta
  rationale: γράμματα, junto da referência à própria mão, favorece a ideia de caracteres grandes. Como πηλίκος pode expressar tamanho ou grandeza e a leitura referente a uma carta extensa tem apoio histórico, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “a vocês” para compreensão internacional e boa legibilidade brasileira. “De próprio punho” é idiomático e mantém a ênfase na escrita pessoal de Paulo.
