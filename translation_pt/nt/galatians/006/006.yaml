source:
  edition: SBLGNT
  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: pt
  text: Aquele que está sendo instruído na palavra compartilhe todas as coisas boas com aquele que o instrui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “participe de todas as coisas boas com aquele que o instrui”; a expressão provavelmente inclui sustento material.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: compartilhe
  rationale: O imperativo presente pede uma prática contínua. “Compartilhe” preserva a amplitude de κοινωνέω, que aqui aponta para participação prática, provavelmente incluindo sustento material.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ marca uma transição leve. Em português, a ligação com o contexto pode ficar implícita sem introduzir contraste ou temporalidade indevidos.
- source_word: ὁ κατηχούμενος
  choice: aquele que está sendo instruído
  rationale: O particípio presente passivo designa quem recebe instrução. A forma evita o sentido eclesiástico técnico posterior de “catecúmeno”.
- source_word: τὸν λόγον
  choice: na palavra
  rationale: Neste contexto, λόγος se refere à mensagem cristã ensinada. “A palavra” mantém a expressão paulina conhecida sem a restringir a “doutrina” ou “mensagem”.
- source_word: τῷ κατηχοῦντι
  choice: com aquele que o instrui
  rationale: O particípio presente ativo identifica quem ministra a instrução; “o instrui” torna explícita em português a relação entre aluno e instrutor já presente no grego.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: todas as coisas boas
  rationale: A expressão é ampla e provavelmente inclui bens materiais e apoio prático. Como complemento de “compartilhe”, esta construção é mais natural em português do que o decalque “em todas as coisas boas”.
theological_decisions:
- issue: Natureza do compartilhamento ordenado
  choice: O instruído deve compartilhar todas as coisas boas com quem o instrui, provavelmente incluindo sustento material.
  alternative: A passagem trataria apenas de comunhão espiritual geral, sem referência a apoio material.
  rationale: A combinação de κοινωνέω, o destinatário no dativo e ἐν πᾶσιν ἀγαθοῖς favorece o compartilhamento prático, mas a redação permanece ampla e não o reduz exclusivamente a dinheiro.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção conserva o paralelismo entre quem recebe e quem ministra instrução, sem empregar terminologia eclesiástica técnica. O marcador da nota aparece no texto principal.
