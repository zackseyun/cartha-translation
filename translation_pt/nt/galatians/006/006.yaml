  source_fidelity: A tradução reproduz adequadamente a exortação imperativa contínua de κοινωνείτω. “Aquele que está sendo instruído na palavra” corresponde ao particípio passivo ὁ κατηχούμενος e a τὸν λόγον; “com aquele que o instrui” representa naturalmente o particípio ativo no dativo. “Compartilhe todas as coisas boas” mantém a amplitude de ἐν πᾶσιν ἀγαθοῖς, sem limitar indevidamente a ordem a dinheiro ou a mera comunhão espiritual.
  naturalness: O texto é claro, moderno e fluente para leitores brasileiros e internacionais. “Está sendo instruído” é um pouco mais explícito do que formas mais literais, mas é natural e comunica bem o aspecto em curso. A construção imperativa “compartilhe” é idiomática e preserva o tom exortativo.
  terminology: “Palavra” preserva a formulação paulina sem impor uma interpretação confessional estreita. Evitar “catecúmeno” é apropriado, pois essa opção teria conotações eclesiásticas posteriores. A nota apresenta “participe” como alternativa sem alterar o sentido principal e corretamente indica que o compartilhamento provavelmente abrange sustento material.
