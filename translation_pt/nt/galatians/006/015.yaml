id: GAL.6.15
reference: Galatians 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: pt
  text: Pois nem a circuncisão tem valor algum[a], nem a incircuncisão; o que importa é uma nova criação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “é alguma coisa”; também se pode traduzir por “conta para alguma coisa”.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “nova criação”; menos provavelmente neste contexto, “uma nova criatura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Pois nem
  rationale: “Pois” conserva a função explicativa de γάρ, e “nem” inicia naturalmente a correlação negativa οὔτε... οὔτε em português.
- source_word: περιτομή
  choice: circuncisão
  rationale: É o equivalente direto e corrente, preservando tanto o rito físico quanto sua relevância identitária no argumento paulino.
- source_word: τί ἐστιν
  choice: tem valor algum
  rationale: A expressão idiomática indica que algo não possui valor ou importância decisiva. Esta formulação é natural em português e mantém a concisão do contraste.
- source_word: οὔτε ἀκροβυστία
  choice: nem a incircuncisão
  rationale: Mantém o substantivo paralelo a “circuncisão” e expressa a condição gentílica de não circuncidado, sem recorrer ao sentido anatômico inadequado ao contexto.
- source_word: ἀλλὰ
  choice: o que importa é
  rationale: 'Explicita em português a elipse verbal do contraste adversativo grego sem acrescentar uma ideia alheia: aquilo que não tem valor é contraposto ao que é decisivo.'
- source_word: καινὴ κτίσις
  choice: uma nova criação
  rationale: “Nova criação” preserva a amplitude de κτίσις e a novidade qualitativa indicada por καινή, sem limitar a expressão apenas ao indivíduo.
theological_decisions:
- issue: Sentido do contraste entre circuncisão, incircuncisão e nova criação
  choice: Nenhuma das duas condições rituais ou identitárias possui valor decisivo diante da realidade da nova criação.
  alternative: As duas condições seriam caminhos igualmente válidos, ou Paulo trataria apenas de marcadores sociais sem implicação mais ampla.
  rationale: O grego nega que qualquer das duas condições seja “alguma coisa” e contrapõe ambas à nova criação. A tradução mantém esse contraste sem definir além do texto a natureza exata dessa criação.
- issue: Alcance de κτίσις
  choice: criação
  alternative: criatura
  rationale: “Criação” permite tanto uma realidade renovada mais ampla quanto sua manifestação na pessoa, preservando a tensão sem reduzir o sentido ao indivíduo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Incircuncisão” é mantido como termo bíblico preciso e como paralelo formal de “circuncisão”; a elipse final do grego é desdobrada de modo natural em “o que importa é”.
