id: GAL.6.2
reference: Galatians 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: pt
  text: Levem as cargas uns dos outros e, desse modo, cumprirão a lei do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a lei de Cristo”.'
    reason: Registra a tradução tradicional alternativa de Χριστός sem substituir no texto principal o sentido titular “Messias”.
lexical_decisions:
- source_word: ἀλλήλων
  choice: uns dos outros
  rationale: Pronome recíproco que expressa mutualidade dentro da comunidade; esta é uma formulação natural e clara em português.
- source_word: τὰ βάρη
  choice: as cargas
  rationale: Mantém a imagem concreta de pesos carregados e, no contexto, comunica também dificuldades e pressões suportadas pelas pessoas.
- source_word: βαστάζετε
  choice: Levem
  rationale: Imperativo presente plural; conserva a ordem dirigida à comunidade e combina naturalmente com “cargas”.
- source_word: οὕτως
  choice: desse modo
  rationale: Liga diretamente a ação ordenada ao resultado descrito na oração seguinte.
- source_word: ἀναπληρώσετε
  choice: cumprirão
  rationale: Reproduz o futuro indicativo do texto da SBLGNT e é a combinação idiomática mais adequada com “lei”.
- source_word: τὸν νόμον
  choice: a lei
  rationale: Preserva o sentido normal de νόμος e sua força ética, sem reduzi-lo a mero princípio.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título; “Messias” explicita seu sentido e preserva o contexto messiânico judaico.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: A forma grega é um título em construção genitiva. “Messias” traduz o conteúdo do título; “Cristo” é a forma tradicional e igualmente possível, registrada em nota.
- issue: Relação entre levar as cargas e cumprir a lei
  choice: e, desse modo, cumprirão
  alternative: e assim cumpram
  rationale: O texto adotado traz futuro indicativo, não um segundo imperativo. A tradução conserva a ação ordenada seguida de seu resultado, sem definir mais precisamente a natureza teológica da “lei do Messias”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Levem as cargas” preserva a metáfora do original; “desse modo” torna explícita, sem ampliar o conteúdo, a ligação lógica entre as duas orações.
