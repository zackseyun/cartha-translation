  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: pt
  text: Pois nem mesmo os que são circuncidados guardam eles mesmos a Lei,[a] mas querem que vocês sejam circuncidados para se gloriarem na carne de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os circuncidados”. O grego usa um particípio substantivado: “os que estão sendo circuncidados / os que são circuncidados”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Pois nem mesmo
  rationale: Preserva tanto a ligação explicativa de γάρ quanto a negação enfática de οὐδέ, em português natural.
- source_word: οἱ περιτεμνόμενοι
  choice: os que são circuncidados
  rationale: Reproduz o particípio presente substantivado sem o transformar interpretativamente em “os que defendem a circuncisão”.
- source_word: αὐτοὶ νόμον φυλάσσουσιν
  choice: guardam a Lei
  rationale: “Guardar a Lei” é uma formulação bíblica clara para observar ou obedecer à Lei; o valor enfático de αὐτοί é comunicado no contexto por “nem mesmo os que...”.
- source_word: ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι
  choice: mas querem que vocês sejam circuncidados
  rationale: Expressa diretamente a vontade dos agentes e conserva a forma passiva do infinitivo.
- source_word: ἵνα ... καυχήσωνται
  choice: para poderem se gloriar
  rationale: Comunica a finalidade indicada por ἵνα e o sentido paulino de καυχάομαι com linguagem digna e corrente.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: na carne de vocês
  rationale: Mantém a imagem concreta da carne marcada pela circuncisão, sem substituí-la por uma interpretação abstrata.
theological_decisions:
- issue: Sentido de σάρξ neste contexto
  choice: “carne” em sentido corporal literal
  alternative: “natureza pecaminosa” em sentido metafórico
  rationale: A referência imediata à circuncisão indica o corpo físico como lugar da marca em que os adversários pretendem se gloriar.
- issue: Força de περιτεμνόμενοι
  choice: 'descrição: “os que são circuncidados”'
  alternative: “os que promovem a circuncisão” ou “os que se fazem circuncidar”
  rationale: O particípio identifica o grupo por sua circuncisão; embora o contexto mostre que eles a promovem, a tradução não deve incorporar essa inferência ao texto.
- issue: Valor de νόμος
  choice: “a Lei”, com inicial maiúscula
  alternative: “lei” em sentido genérico
  rationale: No contexto da controvérsia sobre a circuncisão, trata-se da Lei mosaica, mas a tradução preserva a formulação concisa do grego.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. “Gloriar-se” preserva o vocabulário paulino; “carne” conserva a imagem corporal explícita. A vírgula antes do marcador mantém a nota ligada à expressão precedente, conforme a camada inglesa fornecida.
