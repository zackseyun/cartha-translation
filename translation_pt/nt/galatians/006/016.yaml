  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: pt
  text: E todos os que seguirem esta norma[a] — paz e misericórdia estejam sobre eles, e sobre o Israel de Deus[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todos os que viverem segundo este padrão». O verbo grego transmite a ideia de andar em linha ou manter o passo de acordo com uma norma.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão «o Israel de Deus» é debatida: pode referir-se aos judeus que creem, a toda a igreja ou ao povo de Deus em sentido mais amplo. A tradução conserva a formulação grega sem decidir a questão.'
    reason: alternative_reading
  - marker: c
    text: O último «e» pode acrescentar outro grupo («e sobre o Israel de Deus») ou retomar o mesmo grupo em sentido explicativo («até mesmo sobre o Israel de Deus»).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa naturalmente em português a abrangência distributiva do pronome relativo, sem perder o sentido inclusivo.
- source_word: κανόνι
  choice: norma
  rationale: Neste contexto, κανών designa o padrão ou princípio que orienta a conduta. “Norma” é clara, digna e menos propensa que “regra” a sugerir uma prescrição isolada.
- source_word: στοιχήσουσιν
  choice: seguirem
  rationale: O verbo indica andar alinhado, manter-se em conformidade ou pautar a vida por um padrão. “Seguirem” comunica o sentido de modo natural; a metáfora literal é registrada em nota.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente habitual de εἰρήνη e adequado à fórmula de bênção.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente habitual de ἔλεος, preservando sua associação com “paz” na bênção.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: sobre eles, e sobre
  rationale: Preserva a repetição da preposição ἐπί e o tom solene da bênção, embora “a eles” fosse mais coloquial.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: o Israel de Deus
  rationale: Reprodução transparente da construção grega que não decide quem constitui esse grupo.
theological_decisions:
- issue: Referente de “o Israel de Deus”
  choice: Manter literalmente “o Israel de Deus”, sem identificar explicitamente o grupo.
  alternative: Judeus que creem; toda a igreja; ou o povo de Deus em sentido mais amplo.
  rationale: A expressão é debatida, e o grego não obriga a tradução a resolver seu alcance referencial.
- issue: Valor do καί final
  choice: Traduzir por “e”, preservando a coordenação.
  alternative: Entendê-lo em sentido explicativo, como “isto é” ou “a saber”, identificando o Israel de Deus com o grupo anterior.
  rationale: A conjunção admite leitura aditiva ou explicativa no contexto. “E” mantém aberta a tensão sintática e teológica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem “paz e misericórdia estejam sobre eles” explicita em português o caráter de bênção da frase nominal grega sem alterar seu conteúdo. As notas seguem a ordem dos marcadores no texto.
