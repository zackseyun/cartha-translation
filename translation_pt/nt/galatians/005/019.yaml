id: GAL.5.19
reference: Galatians 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: pt
  text: 'As obras da carne[a] são evidentes: imoralidade sexual, impureza, libertinagem,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “natureza pecaminosa”. A palavra grega é literalmente “carne” (σάρξ), usada aqui por Paulo como metáfora para os desejos e a orientação da humanidade caída.'
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: evidentes
  rationale: Expressa aquilo que é manifesto ou claramente reconhecível, em linguagem natural e digna.
- source_word: δέ
  choice: não explicitado
  rationale: Marca uma transição leve no discurso; em português, a passagem para a lista já comunica essa função sem exigir um conectivo que possa acentuar demais o contraste.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Preserva a formulação paulina e o contraste lexical, no contexto, entre as obras da carne e o fruto do Espírito.
- source_word: τῆς σαρκός
  choice: da carne
  rationale: Mantém a metáfora teologicamente carregada de Paulo sem reduzi-la a uma única interpretação; uma explicação alternativa é dada em nota.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente a lista em português, sem a repetição menos fluida de 'as quais são'.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Abrange condutas sexuais ilícitas e é mais clara e ampla no português atual do que termos como 'fornicação'.
- source_word: ἀκαθαρσία
  choice: impureza
  rationale: Conserva o sentido ético de impureza moral em linguagem corrente.
- source_word: ἀσέλγεια
  choice: libertinagem
  rationale: Comunica conduta desenfreada e descaradamente indulgente, muitas vezes sexual, melhor do que 'sensualidade', que pode ser neutra em português moderno.
theological_decisions:
- issue: Sentido de σάρξ no contexto ético paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” preserva a metáfora e a tensão do contraste entre carne e Espírito. “Natureza pecaminosa” explicita uma interpretação possível, mas pode sugerir um conceito mais sistematizado do que o próprio termo grego; por isso, aparece apenas na nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação conserva a estrutura concisa de uma lista de vícios e termina com vírgula porque a enumeração continua nos versículos seguintes.
