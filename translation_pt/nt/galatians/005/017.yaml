id: GAL.5.17
reference: Galatians 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: pt
  text: Pois a carne[a] deseja o que é contrário ao Espírito[b], e o Espírito, o que é contrário à carne; pois eles se opõem um ao outro, para que vocês não façam aquilo que querem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “natureza pecaminosa”. A palavra grega σάρξ (sarx), “carne”, tem aqui um sentido ético mais amplo que o mero corpo físico.
    reason: lexical_alternative
  - marker: b
    text: Ou “espírito”, se a referência for ao espírito humano, e não ao Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: σάρξ
  choice: carne
  rationale: Mantém a metáfora e o vocabulário característico de Paulo. Neste contexto, o termo tem sentido ético mais amplo que o mero corpo físico, mas traduzi-lo diretamente como “natureza pecaminosa” resolveria antecipadamente a imagem.
- source_word: ἐπιθυμεῖ
  choice: deseja
  rationale: Expressa de modo natural o impulso ou desejo indicado pelo verbo, sem restringi-lo a conotações sexuais. A direção hostil é comunicada por “o que é contrário a”.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: o que é contrário ao Espírito / o que é contrário à carne
  rationale: A formulação idiomática conserva a força adversativa de κατά com o genitivo e torna explícito em português o complemento implícito do desejo.
- source_word: πνεῦμα
  choice: Espírito
  rationale: O contexto imediato de Gálatas 5 favorece a referência ao Espírito Santo, em contraste com a carne; a alternativa “espírito” permanece registrada em nota.
- source_word: ἀλλήλοις ἀντίκειται
  choice: se opõem um ao outro
  rationale: Reproduz com clareza e concisão a oposição recíproca entre a carne e o Espírito.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Preserva formalmente a construção grega e sua tensão entre propósito e resultado, sem transformar a oposição em mera incapacidade psicológica.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: façam aquilo que querem
  rationale: Representa de modo claro a construção relativa indefinida e mantém o verbo ποιέω no sentido simples de “fazer”, sem acrescentar a ideia de prática habitual.
theological_decisions:
- issue: Sentido de σάρξ no contexto ético paulino
  choice: Manter “carne” no texto principal.
  alternative: natureza pecaminosa
  rationale: “Carne” preserva a metáfora teológica de Paulo e a amplitude do termo, enquanto “natureza pecaminosa” é uma paráfrase interpretativa possível, mas mais restritiva.
- issue: Referente de πνεῦμα
  choice: Usar “Espírito”, entendendo a referência mais provável como o Espírito Santo.
  alternative: espírito humano
  rationale: O contexto próximo contrasta repetidamente a carne com a atuação e a direção do Espírito. Como o grego não distingue por maiúsculas, a alternativa é documentada.
- issue: Força de ἵνα μὴ
  choice: Traduzir “para que ... não”.
  alternative: de modo que ... não
  rationale: A construção pode ser percebida em termos de propósito ou resultado. A redação principal acompanha de perto a forma grega sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A elipse em “e o Espírito, o que é contrário à carne” é natural em português e conserva o paralelismo do original. Os marcadores foram colocados imediatamente após os termos a que suas notas se referem.
