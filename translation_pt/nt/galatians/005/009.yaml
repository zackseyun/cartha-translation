  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: pt
  text: Um pouco de fermento leveda toda a massa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um pouco de fermento faz fermentar toda a massa.”'
    reason: Alternativa lexical que emprega uma construção verbal mais corrente, sem alterar o sentido.
lexical_decisions:
- source_word: μικρὰ
  choice: um pouco de
  rationale: O adjetivo indica pequena quantidade de fermento; a formulação é natural em português e mantém a concisão proverbial.
- source_word: ζύμη
  choice: fermento
  rationale: Designa o agente fermentador usado na massa. “Fermento” é claro no português atual e preserva tanto a imagem concreta quanto sua ressonância metafórica.
- source_word: ὅλον
  choice: toda a
  rationale: Expressa a totalidade do efeito sobre a massa e concorda de modo idiomático com o substantivo feminino singular.
- source_word: φύραμα
  choice: massa
  rationale: Refere-se à massa misturada ou amassada. “Massa” comunica diretamente a imagem culinária sem a estranheza que “torrão” ou “pedaço” teria neste contexto.
- source_word: ζυμοῖ
  choice: leveda
  rationale: Verte diretamente o verbo causativo ligado ao fermento e conserva a forma compacta do provérbio. Embora menos frequente que uma paráfrase como “faz fermentar”, é correto, inteligível e estilisticamente digno.
theological_decisions:
- issue: Força metafórica do provérbio
  choice: Manter a imagem concreta do fermento e da massa sem explicitar sua aplicação implícita.
  alternative: Um pouco de ensino falso se espalha por toda a comunidade.
  rationale: No contexto, o provérbio adverte sobre uma influência corruptora, mas o próprio versículo apresenta apenas a imagem proverbial. Explicá-la no texto resolveria indevidamente sua aplicação e reduziria sua força retórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo lexical entre “fermento” e “leveda” e o caráter breve e proverbial do grego.
