source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: pt
  text: Mas o fruto do Espírito é amor, alegria, paz, paciência, amabilidade, bondade, fé[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. A palavra grega pistis pode indicar fé, confiança ou a qualidade de ser fiel e digno de confiança.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com as obras da carne enumeradas nos versículos anteriores.
- source_word: καρπὸς
  choice: fruto
  rationale: Preserva a metáfora paulina e o singular, que apresenta as qualidades como resultado conjunto da atuação do Espírito.
- source_word: τοῦ πνεύματός
  choice: do Espírito
  rationale: O contexto imediato contrasta a carne com o Espírito; a inicial maiúscula indica a referência ao Espírito Santo.
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente atual, amplo e natural para a virtude designada por ἀγάπη.
- source_word: χαρά
  choice: alegria
  rationale: Equivalente direto e corrente no contexto de uma lista de virtudes.
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém sem restringir as possíveis dimensões interior, relacional e comunitária do termo.
- source_word: μακροθυμία
  choice: paciência
  rationale: Comunica em linguagem moderna a disposição de suportar demora ou provocação sem recorrer a uma expressão arcaica.
- source_word: χρηστότης
  choice: amabilidade
  rationale: Distingue esta qualidade da bondade mencionada logo depois e expressa uma disposição benévola e gentil para com os outros.
- source_word: ἀγαθωσύνη
  choice: bondade
  rationale: Representa a qualidade moral ampla de fazer e promover o bem.
- source_word: πίστις
  choice: fé
  rationale: Preserva o equivalente principal e tradicional de πίστις sem eliminar a leitura contextual igualmente possível de fidelidade.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: Espírito Santo
  alternative: espírito humano
  rationale: O contraste imediato com a carne e o argumento mais amplo de Gálatas favorecem a atuação do Espírito Santo nos que creem.
- issue: Sentido de πίστις na lista de virtudes
  choice: fé
  alternative: fidelidade
  rationale: O termo grego admite fé, confiança ou fidelidade. Mantém-se “fé” no texto, enquanto a nota preserva “fidelidade”, leitura especialmente plausível em uma lista de qualidades de caráter.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amabilidade” evita o tom arcaico de “benignidade” e permite distingui-la de “bondade”. A conjunção “e” antes do último item torna a enumeração natural em português; a vírgula final indica que a lista prossegue no versículo seguinte.
