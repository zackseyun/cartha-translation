  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: pt
  text: Pois vocês, irmãos[a], foram chamados à liberdade. Somente não façam da liberdade uma oportunidade[b] para a carne[c]; pelo contrário, por meio do amor, sirvam[d] uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz um termo grego masculino plural que, nesta carta, se dirige a toda a comunidade de fiéis, incluindo as mulheres.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma ocasião”; a palavra pode indicar uma base ou um ponto de partida para a ação.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “a carne” não se refere apenas ao corpo físico, mas aos impulsos humanos voltados para o pecado. Algumas traduções trazem “a natureza pecaminosa”.
    reason: alternative_reading
  - marker: d
    text: O verbo traduzido por “sirvam” está relacionado à palavra grega para “escravo” e transmite a ideia forte de colocar-se a serviço dos outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vocês
  rationale: O pronome explícito e plural dá destaque aos destinatários. “Vocês” é natural no português moderno e preserva o número plural.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa do versículo em relação ao argumento anterior sem impor uma causalidade mais rígida.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: à liberdade
  rationale: Expressa de modo natural o alvo ou estado para o qual os destinatários foram chamados; “para a liberdade” também seria possível.
- source_word: ἐκλήθητε
  choice: foram chamados
  rationale: Preserva a voz passiva e a linguagem paulina do chamado sem definir no texto uma teoria teológica específica sobre sua operação.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do termo grego, enquanto uma nota esclarece que, neste endereço comunitário, ele inclui também as mulheres.
- source_word: μόνον
  choice: somente
  rationale: Introduz com clareza a ressalva que limita um possível uso equivocado da liberdade.
- source_word: μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν
  choice: não façam da liberdade uma oportunidade
  rationale: Explicita naturalmente em português a construção elíptica grega. “Oportunidade” preserva a ideia de ocasião ou ponto de partida.
- source_word: τῇ σαρκί
  choice: para a carne
  rationale: Mantém o termo teologicamente carregado de Paulo, em vez de substituí-lo por uma interpretação como “natureza pecaminosa”.
- source_word: διὰ τῆς ἀγάπης
  choice: por meio do amor
  rationale: Preserva o valor instrumental de διά com o genitivo e traduz ἀγάπη pela expressão comum e transparente “amor”.
- source_word: δουλεύετε
  choice: sirvam
  rationale: É a forma imperativa idiomática no contexto. Uma nota conserva a imagem mais forte de prestar serviço como escravo presente no verbo.
- source_word: ἀλλήλοις
  choice: uns aos outros
  rationale: Equivalente recíproco natural e claro no português contemporâneo.
theological_decisions:
- issue: Alcance de ἀδελφοί numa comunidade composta de homens e mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal preserva a forma masculina plural do grego; a nota esclarece seu alcance comunitário inclusivo sem apagar a forma do texto-fonte.
- issue: Sentido de σάρξ no contexto ético paulino
  choice: a carne
  alternative: a natureza pecaminosa
  rationale: “Carne” preserva a metáfora e sua amplitude teológica. O contexto ultrapassa o corpo físico, mas substituir o termo por “natureza pecaminosa” resolveria interpretativamente uma expressão que Paulo mantém carregada de tensão.
- issue: Força servil de δουλεύετε
  choice: sirvam uns aos outros
  alternative: sejam escravos uns dos outros
  rationale: “Sirvam” comunica a exortação com naturalidade, enquanto a nota registra que o verbo pertence ao campo semântico da escravidão. A alternativa literal poderia sugerir uma relação coercitiva que não é a ênfase desta ordem recíproca e amorosa.
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência por formas amplamente compreensíveis e boa legibilidade brasileira. “Vocês” evita regionalismos verbais; “por meio do amor” conserva a relação instrumental; a divisão em duas frases reduz o peso sintático sem alterar a progressão argumentativa.
