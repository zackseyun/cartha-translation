  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: pt
  text: Os que pertencem ao Messias crucificaram a carne com suas paixões e seus desejos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que pertencem a Cristo”.'
    reason: alternative_reading
  - marker: b
    text: Aqui, “carne” se refere à natureza humana caída em oposição ao Espírito; algumas traduções dizem “natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: os que pertencem ao Messias
  rationale: A construção com genitivo identifica pessoas como pertencentes ao Χριστός. “Pertencem a” é natural em português e preserva o sentido relacional; “Messias” mantém o valor titular do termo.
- source_word: δὲ
  choice: sem equivalente expresso
  rationale: Aqui δέ assinala uma transição ou contraste leve. Em português, inserir “mas”, “ora” ou “agora” daria ao vínculo uma força maior do que a necessária; a relação discursiva permanece clara no contexto.
- source_word: σάρκα
  choice: a carne
  rationale: O termo tem sentido metafórico no contraste paulino com o Espírito. “Carne” preserva o vocabulário e a tensão teológica do texto, enquanto a explicação interpretativa fica na nota.
- source_word: ἐσταύρωσαν
  choice: crucificaram
  rationale: O aoristo apresenta uma ação decisiva. O pretérito perfeito simples é a forma portuguesa natural, e “crucificaram” preserva a referência explícita à cruz.
- source_word: σὺν
  choice: com
  rationale: Expressa acompanhamento ou associação. “Com” é conciso e natural em português.
- source_word: παθήμασιν
  choice: paixões
  rationale: Neste contexto ético, o termo designa impulsos ou afeições intensas ligados à carne, e não sofrimentos.
- source_word: ἐπιθυμίαις
  choice: desejos
  rationale: “Desejos” preserva a amplitude do termo, que frequentemente tem conotação moral negativa no contexto, sem restringi-lo indevidamente ao sentido sexual.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo pode ser entendido como título messiânico ou como designação quase própria. O texto principal mantém “Messias”, enquanto a alternativa tradicional “Cristo” é registrada em nota.
- issue: Sentido de σάρξ no contraste ético paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” conserva a formulação paulina e sua tensão sem transformar uma metáfora teológica em explicação. “Natureza pecaminosa” é uma interpretação possível, oferecida na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pretérito perfeito simples evita o sentido iterativo que o pretérito perfeito composto costuma ter em português. A repetição de “suas” torna explícita a ligação das paixões e dos desejos com a carne sem acrescentar uma interpretação nova.
