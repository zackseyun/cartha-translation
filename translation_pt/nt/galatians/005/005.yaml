  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: pt
  text: Pois nós, pelo Espírito[a], com base na fé[b], aguardamos com viva expectativa a esperança da justiça[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito”. O dativo grego pode indicar tanto o meio pelo qual se espera como a esfera em que essa espera acontece.'
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “a partir da fé”. Conforme o contexto, a palavra grega também pode ter o sentido de “confiança” ou “fidelidade”.
    reason: lexical_alternative
  - marker: c
    text: A palavra grega também pode ser traduzida por “retidão”; “justiça” preserva em português tanto a dimensão de ser justo como a de agir justamente.
    reason: alternative_reading
  - marker: d
    text: 'Ou: “a justiça esperada”. A construção grega não explicita se a justiça é o objeto da esperança ou se está relacionada a ela de outra maneira.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito tem leve ênfase no grego; mantê-lo em português, embora o verbo já indique a pessoa, preserva essa ênfase.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que sustenta a afirmação anterior e mantém com naturalidade o fluxo argumentativo de Paulo.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: O dativo pode indicar meio ou esfera. No contexto de Gálatas 5, provavelmente se refere ao Espírito Santo; “pelo Espírito” expressa o sentido instrumental sem excluir totalmente a noção de esfera.
- source_word: ἐκ πίστεως
  choice: com base na fé
  rationale: A preposição ἐκ indica origem ou fundamento. Esta formulação é natural em português e conserva melhor essa força do que um simples “pela fé”.
- source_word: ἐλπίδα
  choice: a esperança
  rationale: É o objeto de ἀπεκδεχόμεθα. O artigo torna a expressão idiomática em português sem acrescentar uma distinção ausente do grego.
- source_word: δικαιοσύνης
  choice: da justiça
  rationale: “Justiça” é a correspondência portuguesa tradicional e semanticamente ampla para δικαιοσύνη, podendo abranger condição justa, retidão e ação justa.
- source_word: ἀπεκδεχόμεθα
  choice: aguardamos com viva expectativa
  rationale: O verbo comunica espera perseverante e intensa. A expressão evita a possível conotação negativa de “ansiosamente” e mantém a ideia de expectativa ardente.
theological_decisions:
- issue: Referente de πνεύματι
  choice: Espírito Santo
  alternative: espírito humano
  rationale: O contraste entre Espírito, carne e lei no contexto imediato favorece fortemente a referência ao Espírito Santo; a inicial maiúscula indica essa leitura contextual.
- issue: Função do dativo πνεύματι
  choice: 'meio: “pelo Espírito”'
  alternative: 'esfera: “no Espírito”'
  rationale: As duas análises gramaticais são possíveis. A tradução principal adota o meio instrumental, enquanto a nota preserva a leitura locativa ou esférica.
- issue: Sentido de ἐλπίδα δικαιοσύνης
  choice: “a esperança da justiça”
  alternative: “a justiça esperada”
  rationale: 'A construção portuguesa conserva a relação genitiva e sua tensão: pode apontar para a justiça aguardada ou para a esperança associada à justiça, sem impor uma paráfrase teológica.'
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade ou confiança
  rationale: “Fé” é a leitura mais provável neste contexto paulino, mas a amplitude lexical de πίστις é reconhecida em nota sem decidir indevidamente entre todas as nuances possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com viva expectativa” comunica intensidade sem sugerir inquietação emocional. A ordem da frase mantém juntos o Espírito e a fé como qualificadores da espera, sem reproduzir de modo rígido uma ordem grega pouco natural em português.
