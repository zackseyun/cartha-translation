  terminology: “Presunçosos” é uma opção moderna e idiomática para κενόδοξοι, sem reduzir o termo a simples vaidade superficial. A nota oferece de forma útil a alternativa mais próxima da imagem lexical de “glória vazia”. “Provocando” e “invejando” são escolhas semanticamente amplas e adequadas.
