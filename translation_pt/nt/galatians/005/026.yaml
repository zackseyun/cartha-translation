  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: pt
  text: Não nos tornemos presunçosos[a], provocando uns aos outros e invejando uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ávidos de glória vazia”. O termo grego se refere à busca de glória sem fundamento ou a um senso vazio de importância pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Não nos tornemos
  rationale: μή com o subjuntivo presente na primeira pessoa do plural expressa uma exortação negativa. “Não nos tornemos” preserva tanto o caráter exortativo quanto a ideia de vir a ser presente em γίνομαι.
- source_word: κενόδοξοι
  choice: presunçosos
  rationale: κενόδοξος descreve quem busca glória vazia ou alimenta uma importância pessoal sem fundamento. “Presunçosos” é natural e compreensível em português moderno; a nota registra o sentido mais literal.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: uns aos outros
  rationale: Expressão recíproca idiomática que preserva a mutualidade das duas ações.
- source_word: προκαλούμενοι
  choice: provocando
  rationale: O particípio pode indicar desafiar ou incitar outras pessoas. “Provocando” mantém essa amplitude e evita reduzi-lo à mera irritação.
- source_word: φθονοῦντες
  choice: invejando
  rationale: φθονέω significa sentir inveja de alguém. “Invejando” é conciso e mantém o paralelismo participial com “provocando”.
theological_decisions:
- issue: Relação dos particípios com a exortação principal
  choice: 'Os particípios são mantidos como descrições concomitantes: “provocando uns aos outros e invejando uns aos outros”.'
  alternative: Entendê-los como expansões quase imperativas ou como indicação do meio pelo qual alguém se torna presunçoso.
  rationale: A estrutura grega apresenta κενόδοξοι como predicativo principal de γινώμεθα, enquanto os particípios descrevem ações associadas. A formulação portuguesa preserva a relação sintática sem definir além do necessário sua lógica exata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção exortativa e o paralelismo do grego foram preservados sem rigidez excessiva.
