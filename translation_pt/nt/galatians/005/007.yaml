base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: pt
  text: Vocês estavam correndo bem. Quem os impediu de obedecer à verdade?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem os impediu de serem persuadidos pela verdade?” O verbo grego pode significar tanto “obedecer” como “ser persuadido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Vocês estavam correndo
  rationale: O imperfeito indica uma ação contínua no passado. “Estavam correndo” preserva a metáfora atlética sem acrescentar “a corrida”, que não está explícito no grego.
- source_word: καλῶς
  choice: bem
  rationale: O advérbio modifica “estavam correndo”; “bem” é natural em português e expressa progresso adequado.
- source_word: τίς
  choice: Quem
  rationale: O pronome interrogativo pergunta pela pessoa responsável por criar o impedimento.
- source_word: ἐνέκοψεν
  choice: impediu
  rationale: O verbo denota interromper ou obstruir o avanço e pode evocar alguém que corta o caminho de um corredor. “Impediu” comunica o sentido com clareza, enquanto a metáfora permanece no verbo “correndo”.
- source_word: τῇ ἀληθείᾳ
  choice: à verdade
  rationale: O dativo se liga naturalmente a πείθεσθαι. O artigo definido aponta para “a verdade”, provavelmente a verdade do evangelho já recebida pelos gálatas.
- source_word: μὴ πείθεσθαι
  choice: de obedecer
  rationale: πείθομαι pode significar “obedecer” ou “deixar-se persuadir”. Neste contexto, “obedecer” expressa a resposta prática à verdade; a alternativa semanticamente legítima é preservada em nota.
theological_decisions:
- issue: Sentido de πείθεσθαι com ἀληθείᾳ
  choice: obedecer à verdade
  alternative: deixar-se persuadir pela verdade
  rationale: O contexto trata da resposta dos gálatas ao evangelho e de seu afastamento dele. “Obedecer” preserva a dimensão de resposta concreta sem impor uma interpretação denominacional; a possibilidade de “deixar-se persuadir” é mantida em nota para não eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e sintaxe natural de ampla compreensão. A metáfora atlética é mantida sem expansão explicativa no texto principal.
