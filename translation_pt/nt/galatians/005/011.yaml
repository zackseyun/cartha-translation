id: GAL.5.11
reference: Galatians 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: pt
  text: Mas eu, irmãos[a], se ainda prego a circuncisão, por que ainda sou perseguido? Nesse caso, o escândalo da cruz[b] foi eliminado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “irmãos e irmãs”; o termo grego traduzido por “irmãos” pode dirigir-se a um grupo misto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o motivo de tropeço da cruz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Vocativo plural masculino e forma tradicional, natural e digna de dirigir-se à comunidade; no contexto, pode incluir homens e mulheres, esclarecimento preservado em nota.
- source_word: περιτομήν
  choice: circuncisão
  rationale: Equivalente direto e corrente; no contexto de Gálatas, designa também a prática exigida como sinal de observância da Lei, sem que isso precise ser explicitado no texto.
- source_word: ἔτι
  choice: ainda
  rationale: 'Preserva nas duas ocorrências a força temporal e argumentativa: a alegação de que Paulo continuaria pregando a circuncisão entra em conflito com a perseguição que ele ainda sofre.'
- source_word: κηρύσσω
  choice: prego
  rationale: Presente do indicativo com sentido contínuo; 'pregar' comunica naturalmente a proclamação pública no contexto paulino.
- source_word: διώκομαι
  choice: sou perseguido
  rationale: Preserva a voz passiva e o sentido de hostilidade sofrida por causa da mensagem proclamada.
- source_word: ἄρα
  choice: Nesse caso
  rationale: Expressa com clareza a conclusão inferencial que decorre da condição anterior.
- source_word: κατήργηται
  choice: foi eliminado
  rationale: Traduz o perfeito passivo como uma ação consumada cujo resultado permanece, isto é, o caráter ofensivo da cruz teria sido neutralizado.
- source_word: σκάνδαλον
  choice: escândalo
  rationale: Mantém a força provocadora do termo grego e sua conhecida ressonância teológica em português; a alternativa mais concreta, 'motivo de tropeço', é registrada em nota.
- source_word: σταυροῦ
  choice: cruz
  rationale: Equivalente direto e consagrado de σταυρός no uso paulino, sem acrescentar interpretação.
theological_decisions:
- issue: Alcance de ἀδελφοί ao dirigir-se à comunidade
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma masculina do original é preservada no texto, enquanto a nota esclarece que o vocativo grego pode abranger uma comunidade mista.
- issue: Sentido de σκάνδαλον τοῦ σταυροῦ
  choice: o escândalo da cruz
  alternative: o motivo de tropeço da cruz
  rationale: A tradução principal preserva a tensão de que a cruz provoca rejeição; a nota oferece a imagem concreta de obstáculo sem resolver indevidamente a amplitude semântica do termo.
translation_notes:
  register: Português atual, amplamente internacional e de leitura natural no Brasil. O período mantém a estrutura argumentativa concisa de Paulo, com vocabulário digno e acessível.
