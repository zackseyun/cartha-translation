  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: pt
  text: Vocês que procuram ser justificados pela lei[b] ficaram separados do Messias[c][a]; caíram da graça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram alienados do Messias” ou “foram cortados do Messias”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “estão sendo justificados pela lei”. O presente passivo grego admite essa tradução; no contexto, a expressão se refere aos que procuram obter justificação com base na lei.
    reason: lexical_alternative
  - marker: c
    text: Ou “de Cristo”. O grego Christós pode ser traduzido como “Cristo” ou, quando funciona como título, “Messias”.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθητε
  choice: foram desligados
  rationale: Com ἀπὸ Χριστοῦ, o verbo indica separação ou rompimento de vínculo. “Foram desligados” conserva a força relacional e severa da expressão sem definir, por si só, todas as consequências teológicas.
- source_word: ἀπὸ Χριστοῦ
  choice: do Messias
  rationale: ἀπό marca separação. Neste contexto, Χριστός funciona como título, por isso “Messias” comunica naturalmente “o Ungido”; a alternativa tradicional “Cristo” é registrada em nota.
- source_word: οἵτινες
  choice: Vocês que
  rationale: Identifica diretamente, entre os destinatários, aqueles a quem a advertência se aplica, preservando a força da segunda pessoa do plural.
- source_word: ἐν νόμῳ
  choice: pela lei
  rationale: A expressão indica a base ou o meio alegado para a justificação. “Pela lei” é a formulação portuguesa natural no argumento paulino.
- source_word: δικαιοῦσθε
  choice: procuram ser justificados
  rationale: Embora a forma seja presente passiva, o contexto se refere aos que buscam obter justificação com base na lei. A formulação deixa claro esse propósito sem afirmar que a justificação pela lei esteja de fato ocorrendo; a tradução mais formal é preservada em nota.
- source_word: τῆς χάριτος
  choice: da graça
  rationale: O genitivo regido por ἐκπίπτω é expresso idiomaticamente em português por “cair da graça”.
- source_word: ἐξεπέσατε
  choice: caíram
  rationale: Mantém a metáfora forte e o aspecto decisivo do aoristo, sem acrescentar uma explicação doutrinária ao que significa cair da graça.
theological_decisions:
- issue: Se a advertência deve resolver o debate sobre perda da salvação ou afastamento da graça como base da justificação
  choice: 'Manter a linguagem direta: “foram desligados do Messias; caíram da graça”.'
  alternative: Atenuar para “ficaram afastados” ou interpretar como “abandonaram o princípio da graça”.
  rationale: O grego emprega imagens severas de separação do Messias e queda da graça, mas não apresenta neste versículo uma formulação sistemática de todas as consequências. A tradução preserva essa tensão sem impor uma conclusão denominacional.
- issue: Se δικαιοῦσθε afirma justificação efetiva pela lei
  choice: “procuram ser justificados”, com a forma mais literal em nota.
  alternative: “estão sendo justificados” ou “são justificados”.
  rationale: No fluxo do argumento, Paulo não reconhece a lei como meio eficaz de justificação; ele caracteriza a pretensão ou busca dos destinatários. A nota permite ao leitor ver a forma passiva mais direta do original.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, de ampla legibilidade brasileira. “Desligados” preserva a imagem relacional forte sem soar excessivamente técnica; “caíram da graça” mantém a concisão e a expressão tradicionalmente reconhecível.
