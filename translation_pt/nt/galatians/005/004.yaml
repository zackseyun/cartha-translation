revisions:
- from: Vocês que procuram ser justificados pela lei[b] foram desligados do Messias[a][c]; caíram da graça.
  to: Vocês que procuram ser justificados pela lei[b] ficaram separados do Messias[c][a]; caíram da graça.
  rationale: A revisão limita-se a substituir uma expressão portuguesa potencialmente técnica e ambígua por uma formulação relacional clara para κατηργήθητε ἀπὸ Χριστοῦ. Mantém-se “procuram ser justificados”, que, no contexto polêmico de Gálatas, comunica adequadamente a pretensão ou busca sem afirmar que a justificação pela lei esteja ocorrendo de fato; a tradução passiva mais formal permanece em nota. A linguagem severa do versículo é preservada sem resolver debates confessionais acerca de suas implicações sistemáticas.
