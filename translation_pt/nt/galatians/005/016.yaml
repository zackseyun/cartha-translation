id: GAL.5.16
reference: Galatians 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: pt
  text: 'Mas eu digo: andem pelo Espírito e certamente não realizarão o desejo da carne[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da natureza pecaminosa”. A palavra grega é “carne”, termo que, em Paulo, pode indicar a condição humana caída em oposição ao Espírito.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: Mas eu digo
  rationale: δέ marca aqui uma transição levemente adversativa em relação ao contexto anterior; “Mas eu digo” conserva a virada retórica de Paulo sem intensificar demais o contraste.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: O dativo pode indicar meio ou esfera. No contexto de Gálatas 5, a referência mais provável é o Espírito Santo; “pelo Espírito” expressa de modo natural sua atuação orientadora.
- source_word: περιπατεῖτε
  choice: andem
  rationale: Mantém a metáfora paulina de caminhar como modo habitual de viver e é corrente e compreensível em português.
- source_word: ἐπιθυμίαν
  choice: o desejo
  rationale: O termo pode designar desejo em sentido amplo; aqui o complemento “da carne” lhe confere sentido negativo. “Desejo” evita restringi-lo indevidamente a desejo sexual.
- source_word: σαρκὸς
  choice: da carne
  rationale: Conserva a categoria antropológica e teológica de Paulo e sua tensão com o Espírito, sem substituí-la no texto por uma interpretação como “natureza pecaminosa”.
- source_word: οὐ μὴ τελέσητε
  choice: de modo nenhum, realizarão
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação enfática. “De modo nenhum” preserva essa força, enquanto “realizarão” comunica a ideia de levar o desejo à prática.
theological_decisions:
- issue: Referente de πνεύματι
  choice: Espírito Santo
  alternative: espírito humano ou princípio espiritual
  rationale: O contraste imediato entre Espírito e carne em Gálatas 5 favorece a referência ao Espírito Santo. A inicial maiúscula torna explícito esse juízo contextual sem acrescentar uma ideia estranha ao discurso.
- issue: Sentido de σάρξ
  choice: carne
  alternative: natureza pecaminosa
  rationale: Embora o termo tenha aqui sentido moral negativo, “carne” preserva a formulação de Paulo e não reduz sua amplitude a uma única explicação antropológica. A alternativa interpretativa aparece em nota.
- issue: Relação entre o imperativo e a negação enfática
  choice: ordem seguida de resultado ou garantia enfática
  alternative: 'duas ordens coordenadas: “andem... e não realizem”'
  rationale: 'A forma οὐ μὴ τελέσητε é mais naturalmente entendida como uma negação enfática voltada ao futuro: ao andar pelo Espírito, os destinatários certamente não levarão à prática o desejo da carne. A tradução preserva a força sem transformar a frase numa promessa de impecabilidade abstrata.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “andem” é natural no tratamento coletivo. A metáfora “andar” e o termo teológico “carne” foram preservados; a pontuação destaca a negação enfática sem tornar a frase artificial.
