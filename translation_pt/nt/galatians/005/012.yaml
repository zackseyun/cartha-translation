  text: ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: pt
  text: Quem dera que os que estão perturbando vocês até se mutilassem[a][b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “se amputassem”. No contexto, Paulo provavelmente quer dizer que fossem além da circuncisão, chegando à automutilação ou à castração.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que estão causando agitação entre vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Quem dera
  rationale: Expressa de modo natural e enfático o desejo introduzido pela partícula grega, preservando sua força sem recorrer a linguagem arcaica.
- source_word: καὶ
  choice: até
  rationale: 'Tem valor intensificador neste contexto: Paulo deseja que os agitadores não parem na circuncisão, mas levem o ato de cortar ainda mais longe.'
- source_word: ἀποκόψονται
  choice: se mutilar
  rationale: Preserva o sentido reflexivo e a forte imagem de corte ligada à controvérsia sobre a circuncisão, sem especificar como certeza que se trata de castração; a nota registra o sentido mais literal e a provável alusão.
- source_word: οἱ ἀναστατοῦντες
  choice: os que estão perturbando
  rationale: Comunica claramente a ação contínua daqueles que causam agitação e desordem entre os gálatas.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa com clareza o pronome de segunda pessoa do plural, com ampla legibilidade no português contemporâneo.
theological_decisions:
- issue: Sentido do desejo retórico de Paulo no contexto da circuncisão
  choice: Paulo deseja, com ironia contundente, que os defensores da circuncisão levem o corte ainda mais longe e se mutilem.
  alternative: Paulo deseja apenas que eles se afastem ou sejam excluídos da comunidade.
  rationale: A controvérsia imediata sobre a circuncisão favorece o jogo de palavras relacionado ao corte. A formulação mantém a força retórica, enquanto a nota preserva a alternativa lexical mais literal e evita transformar a provável referência à castração em uma especificação inequívoca.
translation_notes:
  register: Português contemporâneo, digno e incisivo, com legibilidade brasileira e compreensão internacional. “Quem dera” conserva a intensidade do desejo; “chegassem até a” torna natural em português o valor intensificador de καί. A tradução mantém a linguagem forte de Paulo sem tornar explícita no texto principal uma interpretação anatômica mais específica do que o verbo, isoladamente, exige.
