  source_fidelity: A tradução reproduz bem a construção enfática inicial, o título «o Messias», a inferência de οὖν, a exortação contínua de στήκετε e a metáfora de «jugo de escravidão». Contudo, «não se deixem novamente prender a um jugo» torna os destinatários sobretudo pacientes de uma ação externa e soa menos idiomático com «jugo». No imperativo médio ἐνέχεσθε, o sentido é mais naturalmente o de sujeitar-se/ficar submetido a algo.
