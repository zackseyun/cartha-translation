  terminology: «Messias», «liberdade», «jugo» e «escravidão» são escolhas corretas e preservam tanto o título Χριστός quanto a imagem e o contraste social de δουλεία. A nota sobre a expressão dativa inicial preserva apropriadamente a alternativa interpretativa.
