  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: pt
  text: Foi para a liberdade que o Messias nos libertou[a]. Portanto, permaneçam firmes e não se submetam novamente a um jugo de escravidão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na liberdade, o Messias nos libertou”. A expressão inicial no grego é condensada e admite mais de uma compreensão estreitamente relacionada.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não se deixem novamente prender a um jugo de escravidão”. O verbo grego pode transmitir a ideia de ficar sujeito ou preso a algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Foi para a liberdade
  rationale: Entende o dativo como expressão de propósito ou resultado e preserva a formulação enfática e condensada de Paulo; a nota registra a alternativa locativa/instrumental.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz Χριστός como título, preservando seu significado e contexto messiânico judaico, em vez de tratá-lo apenas como nome próprio.
- source_word: ἠλευθέρωσεν
  choice: nos libertou
  rationale: Verte diretamente ἐλευθερόω e mantém em português a repetição retórica entre liberdade e libertar.
- source_word: στήκετε
  choice: permaneçam firmes
  rationale: Expressa a exortação contínua do imperativo presente em linguagem portuguesa natural, atual e digna.
- source_word: οὖν
  choice: Portanto
  rationale: Marca claramente a inferência entre a declaração sobre a liberdade e a exortação que se segue.
- source_word: πάλιν
  choice: novamente
  rationale: Indica o retorno a uma condição anterior, com colocação natural na frase portuguesa.
- source_word: ζυγῷ δουλείας
  choice: um jugo de escravidão
  rationale: Preserva a metáfora concreta do jugo e a força social e teológica de δουλεία como escravidão.
- source_word: ἐνέχεσθε
  choice: se deixem ... prender
  rationale: Comunica a ideia de tornar-se sujeito ou ficar preso a algo, combina naturalmente com a metáfora do jugo e preserva a força proibitiva da forma verbal.
theological_decisions:
- issue: Se Χριστός deve ser traduzido como título ou como forma tradicional semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, a tradução do título explicita seu sentido messiânico sem acrescentar uma doutrina denominacional.
- issue: Força semântica de δουλεία
  choice: escravidão
  alternative: servidão
  rationale: “Escravidão” mantém com maior clareza e intensidade o contraste de Paulo entre liberdade e sujeição.
- issue: Sentido da expressão dativa inicial τῇ ἐλευθερίᾳ
  choice: Foi para a liberdade
  alternative: Na liberdade
  rationale: A leitura de propósito ou resultado se ajusta bem à ênfase retórica, mas a construção grega é condensada; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno de ampla compreensão, com boa legibilidade brasileira. A construção “Foi para a liberdade que...” preserva a ênfase do original sem soar artificial; “permaneçam firmes” mantém tom exortativo digno. As duas ambiguidades relevantes são registradas em notas, e todos os marcadores aparecem no texto principal.
