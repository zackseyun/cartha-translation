  naturalness: O português é moderno, claro e apropriado a leitores brasileiros e internacionais. “Vejam” funciona idiomaticamente como chamado enfático dirigido ao grupo, apesar de ἴδε ter formalmente singular no grego. “Não lhes trará benefício algum” é natural e comunica bem a ausência total de proveito.
