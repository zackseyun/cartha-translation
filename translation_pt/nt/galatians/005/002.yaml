id: GAL.5.2
reference: Galatians 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: pt
  text: 'Vejam: eu, Paulo, digo a vocês que, se forem circuncidados[a], o Messias[b] não lhes trará benefício algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “se vocês se deixarem circuncidar” ou “se receberem a circuncisão”.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo”; traduzido aqui como “o Messias” porque Χριστός funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Vejam:'
  rationale: Funciona como partícula enfática que chama a atenção. Embora a forma grega seja singular, o discurso se dirige a vários destinatários; “Vejam” comunica naturalmente a advertência enfática em português.
- source_word: ἐγὼ Παῦλος
  choice: eu, Paulo,
  rationale: Mantém o pronome explícito e o nome em aposição, preservando a ênfase retórica da autoidentificação de Paulo.
- source_word: λέγω ὑμῖν
  choice: digo a vocês
  rationale: Correspondência direta e natural para o verbo com o pronome dativo, adequada ao português internacional com boa legibilidade brasileira.
- source_word: ἐὰν περιτέμνησθε
  choice: se forem circuncidados
  rationale: Preserva a forma passiva e condicional sem explicitar além do grego se os destinatários apenas consentem com o rito ou o procuram ativamente.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Neste contexto, Χριστός conserva força titular; “o Messias” torna explícito esse sentido em português, sem tratá-lo apenas como nome próprio.
- source_word: οὐδὲν ὠφελήσει
  choice: não lhes trará benefício algum
  rationale: Expressa de modo atual e enfático a ausência total de benefício indicada por οὐδέν, evitando uma formulação comercial ou antiquada.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A função titular permanece relevante no argumento sobre o valor salvífico reivindicado para a circuncisão; “o Messias” preserva esse conteúdo sem acrescentar uma interpretação denominacional.
- issue: Alcance da advertência sobre a circuncisão
  choice: Manter a afirmação direta de que, se os destinatários forem circuncidados, o Messias não lhes trará benefício algum.
  alternative: Explicitar no corpo do versículo que se trata apenas da circuncisão adotada como requisito para justificação.
  rationale: O contexto da carta esclarece a controvérsia, mas o versículo não inclui essa qualificação de forma expressa. A tradução evita tanto ampliar a condenação para todo uso médico ou étnico quanto inserir no texto uma explicação contextual.
translation_notes:
  register: Português moderno, digno e direto, de alcance internacional e leitura natural no Brasil. A abertura “Vejam” conserva o tom enfático; a construção passiva evita resolver indevidamente a nuance de consentimento ou iniciativa envolvida na circuncisão.
