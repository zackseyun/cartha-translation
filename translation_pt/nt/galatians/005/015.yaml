id: GAL.5.15
reference: Galatians 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: pt
  text: Mas, se vocês mordem e devoram uns aos outros, tenham cuidado para não serem consumidos uns pelos outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: A conjunção εἰ introduz a condição, e δέ marca uma transição levemente contrastiva. “Mas, se” é natural em português e preserva esse movimento.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: O pronome recíproco descreve ações mútuas dentro da comunidade; a expressão escolhida é clara e corrente em português.
- source_word: δάκνετε
  choice: mordem
  rationale: Mantém o sentido literal e a imagem animal deliberadamente forte. O presente simples pode expressar uma conduta em curso ou característica sem explicitar em excesso o aspecto verbal.
- source_word: κατεσθίετε
  choice: devoram
  rationale: 'Preserva a intensificação da imagem: não se trata apenas de comer, mas de devorar. A escolha combina naturalmente com “mordem”.'
- source_word: βλέπετε
  choice: tenham cuidado
  rationale: Como imperativo, o verbo transmite uma advertência urgente. “Tenham cuidado” é moderno, claro e digno, sem a formalidade menos corrente de “acautelai-vos”.
- source_word: μὴ
  choice: para não
  rationale: Com o subjuntivo passivo, μή introduz o resultado negativo que deve ser evitado. “Para não” comunica essa advertência de modo idiomático.
- source_word: ὑπ’ ἀλλήλων
  choice: uns pelos outros
  rationale: Ὑπό com genitivo indica o agente da forma passiva. A formulação mantém tanto a reciprocidade quanto a ironia da destruição mútua.
- source_word: ἀναλωθῆτε
  choice: serem consumidos
  rationale: O verbo indica ser consumido por completo e, no contexto, levado à ruína. “Consumidos” mantém a metáfora predatória e distingue este verbo de “devoram”.
theological_decisions:
- issue: Violência metafórica dentro da comunidade cristã
  choice: Manter literalmente as imagens de morder, devorar e ser consumido.
  alternative: Explicitar a interpretação com termos gerais como “ferir” e “destruir”.
  rationale: A linguagem de Paulo é intencionalmente vívida e comunica a gravidade da autodestruição comunitária. Suavizá-la reduziria sua força e acrescentaria interpretação desnecessária.
translation_notes:
  register: 'Português moderno de ampla compreensão, com legibilidade brasileira. O plural “vocês” torna explícito o referente comunitário já indicado pelas formas gregas no plural. A frase conserva o paralelismo e a progressão da metáfora: morder, devorar e acabar sendo consumido.'
