id: GAL.5.6
reference: Galatians 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: pt
  text: Pois, no Messias Jesus[a], nem a circuncisão nem a incircuncisão têm valor algum, mas, sim, a fé[b] que atua por meio do amor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu significado como título.
    reason: alternative_reading
  - marker: b
    text: A palavra grega πίστις também pode significar “fidelidade” ou “confiança”; o texto principal emprega “fé”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a fé que se torna ativa por meio do amor”, “a fé que se expressa por meio do amor” ou “a fé que se torna eficaz por meio do amor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém ἐν como “em”, preservando a linguagem paulina de união e esfera, e traduz Χριστός como o título “Messias”. A contração “no” é natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz de modo conciso a explicação que fundamenta o argumento anterior.
- source_word: περιτομή
  choice: circuncisão
  rationale: É o equivalente lexical corrente e preserva tanto o sentido literal quanto sua função de marcador de identidade.
- source_word: τι ἰσχύει
  choice: têm valor algum
  rationale: Expressa relevância ou eficácia, e não apenas força física. O verbo no plural segue a concordância natural em português com os dois termos coordenados.
- source_word: ἀκροβυστία
  choice: incircuncisão
  rationale: Preserva o paralelismo nominal com “circuncisão” e a oposição entre as duas condições identitárias.
- source_word: ἀλλὰ
  choice: mas, sim
  rationale: Marca com clareza o contraste forte entre aquilo que não tem valor e aquilo que importa.
- source_word: πίστις
  choice: fé
  rationale: É o equivalente principal e tradicional, sem eliminar em nota as nuances possíveis de confiança e fidelidade.
- source_word: δι’ ἀγάπης
  choice: por meio do amor
  rationale: Torna explícito e natural em português o valor instrumental de διά com genitivo, sem especificar além do texto como fé e amor se relacionam.
- source_word: ἀγάπης
  choice: amor
  rationale: Equivalente corrente de ἀγάπη neste contexto.
- source_word: ἐνεργουμένη
  choice: que atua
  rationale: Conserva o caráter presente e operativo da fé em formulação natural, sem decidir de modo rígido entre as possíveis nuances média e passiva do particípio.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Aqui o termo preserva sua força titular. A alternativa tradicional é registrada para leitores habituados a “Cristo Jesus”.
- issue: Tradução de πίστις
  choice: fé
  alternative: fidelidade; confiança
  rationale: “Fé” permanece a leitura principal, enquanto a nota conserva o campo semântico mais amplo sem resolver indevidamente a nuance teológica.
- issue: Voz e sentido de ἐνεργουμένη
  choice: que atua
  alternative: que se torna ativa; que se expressa; que se torna eficaz
  rationale: A forma grega permite nuances média e passiva. O texto principal usa uma formulação concisa, e a nota preserva a ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário de circulação internacional. “Incircuncisão” é menos frequente na fala cotidiana, mas preserva com precisão o paralelismo técnico e retórico do original.
