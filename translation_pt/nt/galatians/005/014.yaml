source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: pt
  text: 'Pois toda a lei se cumpre em uma só declaração[a]: “Ame o seu próximo como a si mesmo”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em uma só palavra”. No grego, a expressão significa literalmente “em uma só palavra/declaração”, isto é, em um único dito ou mandamento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “foi cumprida” ou, de modo interpretativo, “se resume”. O verbo grego está no perfeito passivo: significa “está cumprida” ou “tem sido cumprida” e pode também sugerir que a intenção da lei chega à sua plena expressão nesse mandamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Pois
  rationale: γάρ apresenta a razão ou explicação da exortação anterior; “pois” é um conector natural e conciso em português.
- source_word: πᾶς νόμος
  choice: toda a lei
  rationale: Com o artigo e νόμος no singular, a expressão trata a lei em sua totalidade; “toda a lei” preserva essa abrangência.
- source_word: ἐν ἑνὶ λόγῳ
  choice: em uma só declaração
  rationale: λόγος pode significar “palavra”, “declaração” ou “dito”. Como introduz uma ordem citada, “declaração” evita sugerir que se trata de um único vocábulo e “uma só” preserva a ênfase de ἑνί.
- source_word: πεπλήρωται
  choice: se cumpre
  rationale: O perfeito passivo de πληρόω expressa o estado resultante do cumprimento. “Se cumpre” preserva a ideia de cumprimento sem reduzi-la à noção interpretativa de mero resumo.
- source_word: ἐν τῷ
  choice: em
  rationale: A construção apresenta aquilo em que o cumprimento ocorre; em português, a preposição já aparece em “em uma só declaração”, e os dois-pontos introduzem naturalmente a citação.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: O futuro indicativo da citação de Levítico 19:18 tem força de mandamento. O imperativo “Ame” comunica essa função de modo natural e inequívoco no português atual.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: Neste contexto ético, πλησίον designa o próximo; a formulação também mantém a linguagem reconhecível da citação de Levítico 19:18.
- source_word: ὡς σεαυτόν
  choice: como a si mesmo
  rationale: Expressa diretamente a comparação do texto grego e é uma formulação natural em português.
theological_decisions:
- issue: Sentido da afirmação de Paulo sobre a relação entre a lei e o mandamento do amor
  choice: A lei inteira encontra cumprimento no mandamento de amar o próximo.
  alternative: A lei é apenas resumida por esse mandamento, ou somente suas partes éticas estão em vista.
  rationale: πληρόω indica mais diretamente cumprimento do que simples resumo. A tradução conserva essa formulação mais forte, sem extrair dela uma conclusão doutrinária sobre a abolição da lei. “Lei” permanece sem qualificação porque o grego não limita explicitamente sua referência, embora o contexto imediato seja ético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ame” evita a forma lusitana “amarás” e comunica com clareza a força de mandamento. Os marcadores foram colocados junto às expressões que explicam.
