id: GAL.5.10
reference: Galatians 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: pt
  text: 'Estou confiante no Senhor quanto a vocês: vocês não pensarão de outro modo.[a] Mas aquele que está perturbando vocês arcará com o julgamento, seja ele quem for.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês não adotarão outra opinião”. O verbo grego pode se referir tanto ao ato de pensar quanto a manter determinada disposição, opinião ou avaliação.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “quem quer que ele seja” ou “não importa quem ele seja”.
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: Estou confiante
  rationale: O perfeito de πείθω expressa aqui um estado firme e presente de confiança. “Estou confiante” é natural em português e preserva essa força.
- source_word: εἰς ὑμᾶς
  choice: quanto a vocês
  rationale: Com πέποιθα, a expressão indica as pessoas a respeito das quais Paulo tem confiança. “Quanto a vocês” evita sugerir que a confiança tenha neles sua base.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação paulina e apresenta o Senhor como a esfera ou fundamento da confiança, sem decidir além do que o texto afirma.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: vocês não pensarão de outro modo
  rationale: Reproduz a negação de uma disposição ou conclusão diferente em português corrente, sem limitar φρονέω a mera atividade intelectual.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Mas aquele que está perturbando vocês
  rationale: O particípio presente retrata alguém que está causando agitação entre os gálatas. “Perturbando” conserva a força sem acrescentar uma modalidade específica de influência.
- source_word: βαστάσει
  choice: arcará com
  rationale: No contexto de κρίμα, βαστάζω indica levar ou suportar a consequência do julgamento. “Arcará com” comunica esse peso de modo natural, sem especificar a pena.
- source_word: τὸ κρίμα
  choice: o julgamento
  rationale: κρίμα pode indicar julgamento, veredito ou sua consequência. “O julgamento” preserva essa amplitude e não o identifica automaticamente com condenação eterna.
- source_word: ὅστις ἐὰν ᾖ
  choice: seja ele quem for
  rationale: A construção relativa indefinida destaca que a identidade ou posição do perturbador não altera a advertência.
theological_decisions:
- issue: Natureza da confiança de Paulo quanto aos gálatas
  choice: A confiança relativa à resposta futura deles está situada ou fundamentada no Senhor.
  alternative: Uma garantia incondicional da perseverança de todos, ou mero otimismo pessoal de Paulo.
  rationale: A tradução mantém juntos o caráter pessoal da confiança, sua referência explícita ao Senhor e a expectativa futura, sem transformar a frase numa definição de como essa expectativa se cumprirá.
- issue: Sentido de τὸ κρίμα
  choice: Julgamento cuja forma e alcance não são especificados no versículo.
  alternative: Condenação eterna especificamente, ou apenas consequências sociais e disciplina comunitária.
  rationale: O substantivo tem alcance semântico mais amplo que “condenação”, e o contexto imediato não define a natureza exata do julgamento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi ajustada para soar natural sem perder a relação entre a confiança, os gálatas e o Senhor. Os marcadores [a] e [b] aparecem junto às expressões que esclarecem.
