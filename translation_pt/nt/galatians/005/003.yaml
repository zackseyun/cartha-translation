  naturalness: A versão é clara e de registro apropriado. «E declaro mais uma vez» é moderno, solene sem soar excessivamente formal, e mais direto que «volto a declarar solenemente».
  terminology: «Lei» é apropriado neste contexto para νόμος, e «cumprir toda a Lei» comunica idiomaticamente ποιῆσαι ὅλον τὸν νόμον. «Está obrigado» expressa com precisão o sentido não financeiro de ὀφειλέτης.
