  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: pt
  text: E declaro mais uma vez a todo homem que recebe a circuncisão que ele está obrigado a cumprir toda a Lei.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a toda pessoa». A expressão grega diz literalmente «a todo homem», em sentido representativo e genérico.
    reason: lexical_alternative
  - marker: b
    text: Ou «que é circuncidado» ou «que se deixa circuncidar». O particípio grego admite essas traduções próximas; o contexto favorece a ideia de alguém que se submete à circuncisão nessa controvérsia.
    reason: alternative_reading
  - marker: c
    text: Literalmente, «é devedor», isto é, está sob obrigação.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: volto a declarar solenemente
  rationale: O verbo expressa uma afirmação enfática ou atestação solene. Em português, «declarar solenemente» preserva essa força melhor do que «testemunhar», que poderia sugerir apenas relato de fatos.
- source_word: δὲ πάλιν
  choice: E volto a
  rationale: δέ estabelece continuidade moderada com o versículo anterior, e πάλιν indica repetição ou ênfase renovada. A construção é natural em português.
- source_word: παντὶ ἀνθρώπῳ
  choice: a todo homem
  rationale: A expressão grega está no masculino singular e tem sentido distributivo e representativo. A tradução mantém essa forma, enquanto a nota esclarece que o alcance é genérico.
- source_word: περιτεμνομένῳ
  choice: que se deixa circuncidar
  rationale: O particípio presente, no contexto da controvérsia, aponta para quem se submete à circuncisão, não simplesmente para alguém circuncidado na infância. A formulação preserva a participação voluntária sem explicitar um motivo ausente do grego.
- source_word: ὀφειλέτης ἐστίν
  choice: fica obrigado
  rationale: O substantivo ὀφειλέτης significa literalmente «devedor», mas aqui indica alguém sujeito a uma obrigação. «Fica obrigado» comunica também a consequência de se submeter à circuncisão no argumento de Paulo.
- source_word: ὅλον τὸν νόμον
  choice: toda a Lei
  rationale: A expressão enfatiza a totalidade. A inicial maiúscula identifica naturalmente a Lei mosaica no contexto, sem acrescentar uma qualificação ao texto.
- source_word: ποιῆσαι
  choice: cumprir
  rationale: Embora o sentido básico seja «fazer», com νόμος o português idiomático pede «cumprir» ou «observar». «Cumprir» comunica a obediência integral exigida.
theological_decisions:
- issue: Alcance da declaração de Paulo sobre circuncisão e obrigação para com a Lei
  choice: A declaração se dirige a toda pessoa que se submete à circuncisão no contexto da controvérsia na Galácia, ficando assim obrigada a cumprir a Lei inteira.
  alternative: A declaração se refere indistintamente a qualquer homem circuncidado, inclusive judeus circuncidados na infância.
  rationale: O particípio presente περιτεμνομένῳ, ligado ao contexto imediato de Gálatas 5:2, favorece a referência a quem está aceitando a circuncisão nessa controvérsia. A tradução não acrescenta explicitamente o motivo religioso, preservando o que o grego deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a solenidade da declaração, o singular distributivo e a força integral de «toda a Lei», sem resolver além do necessário a nuance do particípio referente à circuncisão.
