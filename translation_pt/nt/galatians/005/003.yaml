    rationale: A formulação pode sugerir que o texto afirma explicitamente o momento em que a obrigação passa a vigorar. O grego diz literalmente que tal pessoa «é devedora», isto é, está sob obrigação. Embora o contexto sustente uma consequência argumentativa, «está obrigado» evita acrescentar aspecto ingressivo.
