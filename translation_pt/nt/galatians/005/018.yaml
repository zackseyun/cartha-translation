  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: pt
  text: Mas, se vocês são guiados pelo Espírito,[a] não estão sob a lei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vocês estão sendo guiados pelo Espírito”.'
    reason: lexical_alternative
  - marker: b
    text: “Sob a lei” refere-se a estar sob a autoridade ou jurisdição da lei; compare Gálatas 5:23.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: se
  rationale: Introduz diretamente a condição expressa pela oração.
- source_word: δὲ
  choice: mas
  rationale: Expressa o contraste moderado com a discussão anterior sobre a carne e o Espírito.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: O dativo indica o agente pelo qual os destinatários são guiados; no contexto de Gálatas 5, refere-se ao Espírito Santo.
- source_word: ἄγεσθε
  choice: vocês são guiados
  rationale: Preserva a voz passiva do presente grego em português natural, sem tornar explícito demais o aspecto contínuo.
- source_word: οὐκ ἐστὲ
  choice: não estão
  rationale: Tradução direta da expressão copulativa negada, concordando naturalmente com “vocês”.
- source_word: ὑπὸ νόμον
  choice: debaixo da lei
  rationale: Mantém a metáfora paulina de estar sob a autoridade ou jurisdição da lei e soa natural no uso bíblico em português.
theological_decisions:
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: o espírito humano
  rationale: O contexto imediato de Gálatas 5:16–25 contrapõe a carne ao Espírito como agente divino. A tradução “pelo Espírito” conserva essa referência sem acrescentar uma explicação doutrinária ao versículo.
- issue: Sentido de ὑπὸ νόμον
  choice: debaixo da lei, isto é, sob sua autoridade ou jurisdição
  alternative: debaixo de lei em sentido geral
  rationale: Em Gálatas, a expressão aponta contextualmente para a lei mosaica como regime governante. A formulação preserva a expressão de Paulo, enquanto a nota esclarece seu sentido sem desenvolver um sistema doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. “São guiados” é idiomático e preserva a passiva; “debaixo da lei” mantém a imagem e a tensão teológica da expressão paulina.
