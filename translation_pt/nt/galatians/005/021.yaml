  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: pt
  text: 'invejas, bebedeiras, festas desregradas[a] e coisas semelhantes a essas. Eu os advirto a respeito delas, como já os adverti: os que praticam tais coisas não herdarão o Reino de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “farras” ou “folias desenfreadas”. O termo grego se refere a festejos marcados por excesso e desordem, muitas vezes associados à bebida.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: invejas
  rationale: O plural preserva a forma da lista e expressa o ressentimento diante do bem alheio; evita confusão com o termo anterior de Gálatas 5:20.
- source_word: μέθαι
  choice: bebedeiras
  rationale: Designa episódios ou práticas de embriaguez; “bebedeiras” é corrente, concreto e adequado ao plural grego.
- source_word: κῶμοι
  choice: festas desregradas
  rationale: Comunica festejos marcados por excesso e comportamento desenfreado, frequentemente associados à bebida, sem restringir indevidamente o termo a atividade sexual.
- source_word: τὰ ὅμοια τούτοις
  choice: coisas semelhantes a essas
  rationale: Mantém o caráter aberto da lista e soa natural em português contemporâneo.
- source_word: ἃ προλέγω ὑμῖν
  choice: Eu os advirto a respeito delas
  rationale: Neste contexto moral, προλέγω tem força de advertência antecipada; a retomada pronominal torna clara a relação com as práticas enumeradas.
- source_word: καθὼς προεῖπον
  choice: como já os adverti
  rationale: Indica que a advertência havia sido feita anteriormente e conserva a repetição retórica do mesmo verbo.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: os que praticam tais coisas
  rationale: “Praticam” expressa conduta característica ou reiterada sugerida pelo particípio presente, sem acrescentar uma qualificação doutrinária ausente do texto.
- source_word: βασιλείαν θεοῦ
  choice: o Reino de Deus
  rationale: Forma consagrada, clara e fiel à expressão teológica do texto grego.
- source_word: οὐ κληρονομήσουσιν
  choice: não herdarão
  rationale: Preserva diretamente a linguagem futura de herança e sua força escatológica.
theological_decisions:
- issue: Se a advertência diz respeito a atos isolados ou a uma prática característica
  choice: os que praticam tais coisas
  alternative: os que fazem tais coisas
  rationale: O particípio presente com πράσσω favorece a ideia de conduta praticada, mas a tradução não define além do texto a frequência exata nem resolve como a advertência se relaciona com arrependimento, perseverança ou salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bebedeiras” e “festas desregradas” mantêm a concretude da lista; a divisão em duas frases evita uma construção relativa pesada e preserva a progressão da advertência.
