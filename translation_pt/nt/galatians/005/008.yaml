id: GAL.5.8
reference: Galatians 5:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: pt
  text: Essa persuasão não vem daquele que chama vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Essa influência não vem daquele que chama vocês”.'
    reason: Alternativa lexical para πεισμονή, destacando o efeito persuasivo exercido sobre os gálatas.
lexical_decisions:
- source_word: πεισμονὴ
  choice: persuasão
  rationale: O substantivo raro pode indicar persuasão ou o efeito de alguém ter sido persuadido. “Persuasão” preserva sua forma abstrata e, no contexto, aponta para a influência exercida sobre os gálatas sem explicitar além do grego.
- source_word: ἐκ
  choice: vem de
  rationale: A preposição indica fonte ou origem. Em português, “não vem de” expressa isso de modo mais natural do que a formulação estática “não é de”.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: daquele que chama vocês
  rationale: O particípio presente substantivado é mantido como expressão verbal, preservando tanto seu aspecto presente quanto a forma indireta pela qual Paulo identifica o agente.
- source_word: οὐκ
  choice: não
  rationale: Reproduz diretamente a negação enfática da origem dessa persuasão.
theological_decisions:
- issue: Identidade daquele que chama os gálatas
  choice: “daquele que chama vocês”, sem acrescentar “Deus”
  alternative: “de Deus, que chama vocês”
  rationale: O contexto de Gálatas aponta naturalmente para Deus, mas o texto grego não traz o substantivo θεός. A tradução conserva a formulação participial de Paulo e deixa o referente ser inferido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμᾶς; “essa” retoma a situação mencionada no contexto imediato. A nota preserva a amplitude do substantivo grego raro.
