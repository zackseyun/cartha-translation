  text: εἰδωλολατρία, φαρμακεία, ἔχθραι, ⸂ἔρις, ζῆλος⸃, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: pt
  text: idolatria, feitiçaria, inimizades, discórdia, ciúme, acessos de ira, ambições egoístas, divisões, facções[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seitas”; no uso eclesiástico posterior, “heresias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: idolatria
  rationale: Termo português corrente e preciso para o culto ou serviço prestado a ídolos.
- source_word: φαρμακεία
  choice: feitiçaria
  rationale: Neste catálogo de vícios, designa práticas mágicas ou ocultas, não o uso comum de medicamentos.
- source_word: ἔχθραι
  choice: inimizades
  rationale: O plural expressa relações ou manifestações persistentes de hostilidade.
- source_word: ἔρις
  choice: discórdia
  rationale: Comunica conflito contencioso de modo natural e conciso em português.
- source_word: ζῆλος
  choice: ciúme
  rationale: O contexto negativo favorece o sentido de rivalidade ciumenta, e não o de zelo positivo.
- source_word: θυμοί
  choice: acessos de ira
  rationale: O plural sugere manifestações repetidas e explosivas de ira.
- source_word: ἐριθεῖαι
  choice: ambições egoístas
  rationale: Expressa a busca interesseira de vantagem ou projeção pessoal; o plural acompanha a forma grega e a estrutura da lista.
- source_word: διχοστασίαι
  choice: divisões
  rationale: Designa separações e antagonismos dentro de uma comunidade.
- source_word: αἱρέσεις
  choice: facções
  rationale: Preserva o sentido contextual de grupos ou partidos divisivos sem impor o sentido eclesiástico posterior de heresias.
theological_decisions:
- issue: Tradução de αἱρέσεις
  choice: facções
  alternative: seitas; em uso eclesiástico posterior, heresias
  rationale: O contexto imediato reúne vícios relacionais e comunitários. Portanto, o sentido social de agrupamentos divisivos é primário, embora a nota preserve as alternativas lexicais e históricas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém a concisão do grego e termina com vírgula porque o versículo continua no item seguinte. A nota foi colocada apenas em αἱρέσεις; a alternativa de φαρμακεία já coincide com a tradução principal portuguesa (“feitiçaria”), por isso não requer nota.
