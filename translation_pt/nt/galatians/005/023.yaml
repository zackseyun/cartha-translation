id: GAL.5.23
reference: Galatians 5:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: pt
  text: mansidão, domínio próprio; contra essas coisas[a] não há lei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra pessoas assim”; aqui, porém, a expressão provavelmente se refere às qualidades enumeradas.'
    reason: lexical_alternative
  - marker: b
    text: Também é possível entender “a Lei”, com referência mais específica à Lei mosaica.
    reason: theological_ambiguity
lexical_decisions:
- source_word: πραΰτης
  choice: mansidão
  rationale: No contexto da lista de virtudes, designa uma disposição branda, humilde e não agressiva. “Mansidão” é a expressão portuguesa tradicional e ainda compreensível, sem sugerir fraqueza moral.
- source_word: ἐγκράτεια
  choice: domínio próprio
  rationale: Expressa o governo dos próprios desejos e impulsos. “Domínio próprio” comunica de modo natural e abrangente o sentido ético do termo.
- source_word: κατὰ τῶν τοιούτων
  choice: contra essas coisas
  rationale: Embora τοιούτων possa referir-se a pessoas ou coisas, o contexto aponta mais naturalmente para as qualidades que compõem o fruto do Espírito.
- source_word: νόμος
  choice: lei
  rationale: A ausência de artigo no grego favorece a formulação ampla “lei”, sem excluir o pano de fundo da Lei mosaica no argumento de Gálatas.
theological_decisions:
- issue: Alcance de νόμος na afirmação de Paulo
  choice: “lei”, em sentido amplo
  alternative: “a Lei”, como referência específica à Lei mosaica
  rationale: A formulação grega sem artigo tem força proverbial e declara que nenhuma lei se opõe a tais virtudes, ao mesmo tempo que preserva a possível relação com a Lei mosaica no contexto da carta.
- issue: Referente de τῶν τοιούτων
  choice: as qualidades anteriormente enumeradas
  alternative: as pessoas que manifestam essas qualidades
  rationale: A forma grega permite ambas as referências, mas a proximidade da lista do fruto do Espírito torna a referência às qualidades mais provável; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Mansidão” preserva a linguagem ética bíblica sem arcaísmo excessivo; “domínio próprio” é corrente e claro. A pontuação mantém a conclusão enfática do versículo.
source_grounding:
  english_pob_role: consult_only
