  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: pt
  text: Se vivemos pelo Espírito[a], sigamos também o passo do Espírito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se vivemos no Espírito, sigamos também em sintonia com o Espírito.”'
    reason: Preserva a alternativa legítima para o valor do dativo πνεύματι e uma formulação menos imagética para a nuance de alinhamento expressa por στοιχῶμεν.
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Preserva a forma condicional grega e a lógica exortativa de Paulo, sem explicitar o valor contextual possível de “já que”.
- source_word: ζῶμεν
  choice: vivemos
  rationale: Equivalente natural do presente de ζάω; no contexto, indica a vida que procede do Espírito.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: Expressa adequadamente o provável valor instrumental do dativo. O contexto do contraste entre carne e Espírito indica o Espírito Santo.
- source_word: καὶ
  choice: também
  rationale: 'Comunica a força de correspondência: à vida pelo Espírito deve corresponder a conduta guiada por ele.'
- source_word: στοιχῶμεν
  choice: andemos em sintonia
  rationale: O subjuntivo exortativo pede “andemos”. A expressão “em sintonia” conserva a ideia específica de manter-se alinhado, seguir a mesma direção ou acompanhar o passo, sem reduzir o verbo ao sentido genérico de caminhar.
theological_decisions:
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: o espírito humano
  rationale: O contraste recorrente entre carne e Espírito em Gálatas 5 favorece claramente a referência ao Espírito Santo; a inicial maiúscula comunica essa leitura contextual.
- issue: Valor semântico do dativo πνεύματι
  choice: 'instrumental ou de fonte: “pelo Espírito”'
  alternative: 'esfera ou associação: “no Espírito”'
  rationale: “Pelo Espírito” ressalta que a vida procede da atuação do Espírito, mas o grego admite a nuance de viver na esfera do Espírito; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Andemos em sintonia” é natural e conserva melhor que o simples “andemos” a noção de alinhamento presente em στοιχέω; a nota registra uma formulação mais literal da imagem de acompanhar o passo.
