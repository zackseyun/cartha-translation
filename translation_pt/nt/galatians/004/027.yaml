source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: pt
  text: 'Pois está escrito: “Alegre-se, mulher estéril, que não dá à luz; irrompa em gritos e clame, você que não sente dores de parto, porque os filhos da mulher abandonada[a] são mais numerosos do que os daquela que tem marido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação de Isaías 54:1. “Mulher abandonada” também pode ser traduzido como “mulher desolada” ou “mulher deixada só”.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada para introduzir uma citação das Escrituras; o perfeito grego aponta para algo escrito que continua válido.
- source_word: Εὐφράνθητι
  choice: Alegre-se
  rationale: Imperativo natural em português que preserva o tom jubiloso e profético.
- source_word: στεῖρα
  choice: mulher estéril
  rationale: O adjetivo funciona como substantivo em vocativo; explicitar “mulher” torna a referência clara e natural.
- source_word: ἡ οὐ τίκτουσα
  choice: você que não dá à luz
  rationale: Expressa de modo direto o particípio presente e mantém a imagem da ausência de parto.
- source_word: ῥῆξον καὶ βόησον
  choice: irrompa em gritos de alegria
  rationale: Reproduz a ideia idiomática de romper subitamente em clamor; “de alegria” é inferido pelo paralelismo com Εὐφράνθητι e torna a expressão natural em português.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: você que não sente dores de parto
  rationale: ὠδίνω denota sofrer as dores do parto; esta formulação preserva a imagem materna com clareza.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: os filhos ... são mais numerosos do que
  rationale: Torna explícita e idiomática em português a comparação quantitativa do grego.
- source_word: τῆς ἐρήμου
  choice: da mulher abandonada
  rationale: No contexto figurado da citação de Isaías, ἔρημος pode caracterizar alguém desolada, deixada só ou abandonada; “abandonada” comunica claramente a dimensão relacional do contraste.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: daquela que tem marido
  rationale: Preserva de perto a formulação grega e o contraste com a mulher abandonada, sem reduzi-la simplesmente a “casada”.
theological_decisions:
- issue: Citação de Isaías 54:1 no contexto alegórico de Gálatas 4
  choice: Traduzir diretamente as imagens proféticas da citação, sem inserir no versículo a identificação alegórica desenvolvida pelo contexto.
  alternative: Explicitar na própria citação uma referência a Sara ou à Jerusalém do alto.
  rationale: Paulo apresenta o texto como citação das Escrituras e deixa que o argumento ao redor estabeleça sua aplicação; a tradução não deve antecipar nem estreitar essa interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência adequada a uma citação profética. Empregou-se “você” para tornar naturais as orações participiais dirigidas à mulher, e manteve-se a metáfora matrimonial e materna do original.
