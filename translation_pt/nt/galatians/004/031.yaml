id: GAL.4.31
reference: Galatians 4:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the slave woman[b], but of the free woman.
translation:
  language: pt
  text: Portanto, irmãos[a], não somos filhos da escrava[b], mas da mulher livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz literalmente “irmãos”, termo que pode dirigir-se de modo representativo a um grupo misto.
    reason: lexical_alternative
  - marker: b
    text: Ou “serva”; o termo grego designa uma escrava ou serva, aqui em referência a Agar e em contraste com Sara na alegoria de Paulo (Gl 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Portanto
  rationale: Introduz a conclusão inferida da argumentação alegórica anterior e preserva com naturalidade a força lógica do grego.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o vocativo masculino plural do grego, que pode representar uma comunidade composta de homens e mulheres; essa abrangência é esclarecida em nota.
- source_word: οὐκ ἐσμὲν
  choice: não somos
  rationale: Reproduz diretamente a negação no presente, sem acrescentar uma ideia temporal como “já não”.
- source_word: παιδίσκης
  choice: da escrava
  rationale: O termo designa uma mulher em condição servil. “Escrava” preserva o contraste central entre escravidão e liberdade no argumento de Paulo.
- source_word: τέκνα
  choice: filhos
  rationale: Neste contexto figurado de pertencimento e descendência, “filhos” é a forma portuguesa natural e pode abranger ambos os sexos, embora “crianças” ou “descendentes” sejam alternativas semanticamente possíveis.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa de modo simples e idiomático o contraste adversativo entre as duas identidades.
- source_word: τῆς ἐλευθέρας
  choice: da mulher livre
  rationale: O artigo e o adjetivo femininos substantivados remetem a Sara; explicitar “mulher” torna o referente claro e mantém o paralelo com “escrava”.
theological_decisions:
- issue: Como expressar o contraste alegórico entre Agar e Sara
  choice: “da escrava” e “da mulher livre” no texto principal
  alternative: “da serva” e “da livre”
  rationale: A argumentação de Gálatas 4:21–31 depende do contraste entre escravidão e liberdade. A formulação escolhida preserva essa tensão sem acrescentar conclusões doutrinárias que o versículo não explicita.
- issue: Como traduzir ἀδελφοί diante de uma comunidade possivelmente mista
  choice: “irmãos” no texto principal, com nota sobre seu alcance representativo
  alternative: “irmãos e irmãs”
  rationale: A opção conserva a forma masculina do original e informa em nota que ela pode incluir as mulheres da comunidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa acompanha o caráter conclusivo do versículo. “Filhos” é mais natural do que “crianças” para identidade e descendência figuradas; “mulher livre” explicita o substantivo implícito no feminino grego.
