  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: pt
  text: Temo que, de algum modo, eu tenha trabalhado em vão por vocês[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho receio de que, de algum modo, eu tenha trabalhado em vão em favor de vocês.”'
    reason: Alternativa lexical que explicita a relação de εἰς ὑμᾶς com o trabalho de Paulo, dirigido aos gálatas.
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: Temo por vocês
  rationale: O presente φοβοῦμαι expressa a apreensão atual de Paulo, e o acusativo ὑμᾶς indica aqueles por cuja situação ele está preocupado. Em português, “temo por vocês” comunica preocupação com o bem deles, não medo deles.
- source_word: μή πως
  choice: que, de algum modo
  rationale: Introduz o conteúdo temido com nuance de possibilidade apreensiva, preservada de maneira natural em português.
- source_word: εἰκῇ
  choice: em vão
  rationale: Expressa a ideia de esforço sem resultado ou sem propósito alcançado.
- source_word: κεκοπίακα
  choice: eu tenha trabalhado
  rationale: O perfeito indica trabalho já realizado com relevância presente. O subjuntivo composto é natural em português depois de “temo que” e não transforma a forma grega em uma afirmação independente de potencialidade.
- source_word: εἰς ὑμᾶς
  choice: por vocês
  rationale: A preposição apresenta os gálatas como destinatários ou beneficiários do trabalho de Paulo. “Por vocês” é idiomático e preserva essa direção do esforço.
theological_decisions:
- issue: Natureza da preocupação de Paulo
  choice: Apreensão pastoral de que seu trabalho entre os gálatas tenha sido infrutífero
  alternative: Mera ansiedade pessoal sem destaque para a possível frustração de seu trabalho apostólico
  rationale: A construção φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα vincula explicitamente o temor à possibilidade de o esforço já despendido não produzir o resultado esperado.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “vocês” mantém claras as duas relações distintas do grego: os destinatários da preocupação e os destinatários do trabalho.'
