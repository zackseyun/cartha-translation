id: GAL.4.9
reference: Galatians 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: pt
  text: Mas agora que conheceram a Deus — ou melhor, que foram conhecidos por Deus —, como podem voltar novamente aos elementos fracos e pobres[a], dos quais querem ser escravos mais uma vez, desde o começo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espíritos elementares”, “princípios básicos” ou “coisas elementares”.
    reason: στοιχεῖα possui uma amplitude semântica debatida neste contexto, que a tradução principal não deve resolver de modo indevido.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: depois de conhecerem a Deus
  rationale: O particípio aoristo indica a entrada no conhecimento de Deus e mantém sua relação circunstancial com a pergunta principal. A formulação é natural em português sem acrescentar conteúdo ao verbo.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: ou melhor, de serem conhecidos por Deus
  rationale: “Ou melhor” expressa a correção enfática de μᾶλλον δέ, e a voz passiva permanece explícita, preservando a primazia atribuída à ação de Deus.
- source_word: πῶς
  choice: como podem
  rationale: Na pergunta retórica, comunica a surpresa e a censura de Paulo de maneira idiomática.
- source_word: ἐπιστρέφετε πάλιν
  choice: voltar outra vez
  rationale: Preserva tanto o movimento de retorno quanto a repetição enfatizada por πάλιν.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: os elementos fracos e pobres
  rationale: “Elementos” mantém aberta a referência debatida de στοιχεῖα melhor que uma interpretação mais específica. “Fracos e pobres” traduz diretamente os dois adjetivos em linguagem atual.
- source_word: δουλεύειν
  choice: servir como escravos
  rationale: Retém a imagem explícita de escravidão presente em δουλεύω, evitando o sentido enfraquecido de simplesmente “servir”.
- source_word: πάλιν ἄνωθεν
  choice: mais uma vez, começando tudo de novo
  rationale: A expressão comunica tanto repetição quanto reinício, reproduzindo a força intensificadora da combinação grega.
- source_word: θέλετε
  choice: querem
  rationale: Expressa de modo claro e contemporâneo a vontade ou intenção indicada por θέλω.
theological_decisions:
- issue: Sentido de στοιχεῖα em Gálatas 4:9
  choice: elementos
  alternative: espíritos elementares; princípios básicos; coisas elementares
  rationale: O termo pode designar componentes ou princípios básicos e, possivelmente, poderes cósmicos ligados à antiga ordem. “Elementos” conserva essa abertura sem impor uma leitura exclusivamente pedagógica ou demonológica; as possibilidades principais aparecem na nota.
- issue: Força de “conhecidos por Deus”
  choice: A formulação corrige e aprofunda o conhecimento humano de Deus, destacando o conhecimento da parte de Deus.
  alternative: Uma ênfase apenas relacional, sem qualquer prioridade da ação divina.
  rationale: μᾶλλον δέ introduz uma correção real. A tradução mantém a passiva e a iniciativa gramatical de Deus, mas não acrescenta um sistema doutrinário ao que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões marcam naturalmente a autocorreção de Paulo. A expressão “servir como escravos” conserva a metáfora de escravidão sem recorrer a vocabulário arcaico.
