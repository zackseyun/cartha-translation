id: GAL.4.2
reference: Galatians 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: pt
  text: mas está sob a autoridade de tutores e administradores[a] até o tempo determinado pelo pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregados da casa”; o termo grego se refere a pessoas que administravam uma casa, seus bens ou uma propriedade.
    reason: lexical_alternative
  - marker: b
    text: Ou “até o tempo determinado do pai”, expressão que também pode ser entendida como “até o tempo que o pai determinou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Conjunção adversativa que contrasta a condição jurídica do herdeiro com sua sujeição prática enquanto menor.
- source_word: ὑπὸ
  choice: sob a autoridade de
  rationale: Com acusativo, expressa sujeição à autoridade ou supervisão; a formulação explicita naturalmente esse sentido em português.
- source_word: ἐπιτρόπους
  choice: tutores
  rationale: Designa pessoas encarregadas de cuidar e supervisionar um menor; “tutores” é preciso e corrente no contexto jurídico-familiar.
- source_word: ἐστὶ
  choice: está
  rationale: O sujeito subentendido é o herdeiro mencionado no versículo anterior; não é necessário repeti-lo em português.
- source_word: καὶ
  choice: e
  rationale: Coordena de modo simples as duas categorias de responsáveis.
- source_word: οἰκονόμους
  choice: administradores
  rationale: Refere-se a pessoas que administravam uma casa, seus bens ou uma propriedade; “administradores” é claro no português atual.
- source_word: ἄχρι
  choice: até
  rationale: Marca o limite temporal desse regime de supervisão.
- source_word: τῆς προθεσμίας
  choice: o tempo determinado
  rationale: Indica um momento previamente fixado; esta opção preserva a ideia de determinação anterior com linguagem natural.
- source_word: τοῦ πατρός
  choice: pelo pai
  rationale: O genitivo é entendido contextualmente como aquele que determina o tempo, sem acrescentar ao texto uma identificação teológica.
theological_decisions:
- issue: Sentido do genitivo em τοῦ πατρός
  choice: pelo pai
  alternative: do pai
  rationale: Na analogia doméstica, o pai é provavelmente quem fixa o momento; a nota preserva a possibilidade da formulação genitiva mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tutores” mantém a dimensão do cuidado do menor, enquanto “administradores” distingue a gestão patrimonial. A repetição do sujeito foi evitada por ser desnecessária em português.
