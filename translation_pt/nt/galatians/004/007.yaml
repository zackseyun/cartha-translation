  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a slave but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: pt
  text: Portanto, você já não é escravo, mas filho[a]; e, se é filho, também é herdeiro por meio de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho ou filha”. O grego diz “filho”, preservando a lógica de adoção e herança da passagem, embora Paulo aplique essa condição a todos os que pertencem a Cristo.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “herdeiro de Deus por meio de Cristo” (ou “por meio do Messias”), em vez de “herdeiro por meio de Deus”.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão lógica do argumento anterior de modo claro e natural.
- source_word: οὐκέτι εἶ
  choice: você já não é
  rationale: Expressa diretamente a mudança de condição indicada pela negação temporal e pelo presente do verbo ser.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva o sentido forte de sujeição e o contraste jurídico e social com a condição filial.
- source_word: ἀλλὰ υἱός
  choice: mas filho
  rationale: Mantém o contraste e a linguagem masculina singular ligada, no contexto, à adoção e ao direito de herança.
- source_word: εἰ δὲ υἱός
  choice: e, se é filho
  rationale: Dá continuidade natural à inferência sem acrescentar conteúdo ausente do grego.
- source_word: καὶ κληρονόμος
  choice: também é herdeiro
  rationale: Explicita em português a cópula subentendida e preserva a progressão da filiação para a herança.
- source_word: διὰ θεοῦ
  choice: por meio de Deus
  rationale: Traduz de maneira direta διά com genitivo e segue a leitura adotada pelo SBLGNT.
theological_decisions:
- issue: Linguagem filial de υἱός
  choice: filho
  alternative: filho ou filha; criança
  rationale: “Filho” preserva a formulação do grego e a lógica jurídica de adoção e herança do contexto. A nota esclarece que essa condição é concedida a todos os que pertencem a Cristo, sem apagar a imagem empregada por Paulo.
- issue: Leitura textual no final do versículo
  choice: por meio de Deus
  alternative: herdeiro de Deus por meio de Cristo; herdeiro de Deus por meio do Messias
  rationale: O texto principal segue διὰ θεοῦ no SBLGNT. A variante mais longa é relevante e fica registrada em nota, sem substituir a leitura da edição-fonte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O singular “você” reproduz o tratamento individual do grego; “por meio de Deus” mantém a formulação da edição-fonte.
