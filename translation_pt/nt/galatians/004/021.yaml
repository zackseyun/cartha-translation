base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: pt
  text: 'Digam-me: vocês que querem estar debaixo da lei, não ouvem a lei?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não escutam a lei?” O verbo grego pode significar “ouvir” ou “escutar com atenção”; aqui, “a lei” provavelmente se refere à Lei mosaica, especialmente ao relato das Escrituras que Paulo cita em seguida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Digam-me
  rationale: O imperativo presente plural introduz um desafio direto aos destinatários. “Digam-me” é natural em português e preserva a força imperativa.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: vocês que querem estar debaixo da lei
  rationale: A construção com particípio articulado caracteriza o grupo por esse desejo. “Debaixo da lei” conserva a imagem jurídica e pactual de Paulo em linguagem reconhecível.
- source_word: νόμον / τὸν νόμον
  choice: lei / a lei
  rationale: A repetição de “lei” preserva o jogo retórico entre desejar estar debaixo da lei e prestar atenção à própria lei. A minúscula evita limitar antecipadamente o sentido, embora o contexto aponte para a Lei mosaica e seu texto.
- source_word: οὐκ ἀκούετε
  choice: não ouvem o que ... diz?
  rationale: ἀκούω pode significar tanto ouvir quanto escutar com atenção. A formulação portuguesa comunica a atenção ao testemunho da lei e funciona naturalmente com a narrativa bíblica citada em seguida, sem eliminar a alternativa mais literal, registrada em nota.
theological_decisions:
- issue: Referência e função de “lei”
  choice: Manter “lei” em minúscula nas duas ocorrências, permitindo que o contexto indique tanto a ordem pactual mosaica quanto a Escritura que fala.
  alternative: Usar “Lei” com maiúscula para identificar explicitamente a Torá mosaica.
  rationale: 'O argumento de Paulo explora νόμος em sentidos estreitamente relacionados: a esfera sob a qual alguns desejam estar e o texto da Lei que deveriam ouvir. A tradução mantém essa tensão sem resolvê-la cedo demais.'
- issue: Sentido de ἀκούω
  choice: Expressar a ideia contextual de ouvir atentamente mediante “não ouvem o que a lei diz?”.
  alternative: Traduzir de modo mais formal como “não ouvem a lei?” ou com ênfase na obediência como “não dão ouvidos à lei?”.
  rationale: A pergunta prepara a citação narrativa seguinte. “O que a lei diz” torna clara essa função discursiva sem importar explicitamente a ideia mais forte de obedecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A expressão tradicional “debaixo da lei” foi mantida por preservar a metáfora paulina; a segunda oração foi levemente explicitada para soar natural e apontar para o texto que será citado.
