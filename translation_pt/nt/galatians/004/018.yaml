  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: pt
  text: Mas é bom ser procurado com zelo[a] por uma boa causa[b], sempre, e não somente quando estou presente com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser zeloso” ou “mostrar zelo”. O infinitivo grego ζηλοῦσθαι pode ser entendido de maneiras diferentes, mas o sentido passivo se ajusta ao contraste imediato com aqueles que procuram conquistar os gálatas no versículo anterior.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “em algo bom”. A expressão provavelmente indica bons motivos ou uma boa causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: é bom
  rationale: Adjetivo predicativo usado de modo impessoal com o infinitivo; em português, “é bom” expressa o sentido com naturalidade.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com os motivos reprováveis mencionados no versículo anterior.
- source_word: ζηλοῦσθαι
  choice: ser procurado com zelo
  rationale: Preserva a forma passiva do infinitivo e a ideia de interesse intenso; no contexto, contrapõe a procura por bons motivos à atuação interessada descrita no versículo 17.
- source_word: ἐν καλῷ
  choice: por um bom propósito
  rationale: Expressa de modo natural a qualidade moral ou a boa motivação da procura, embora o grego diga literalmente “em algo bom”.
- source_word: πάντοτε
  choice: em todo o tempo
  rationale: Mantém a abrangência temporal e prepara o contraste com “não somente quando”.
- source_word: καὶ μὴ μόνον
  choice: e não somente
  rationale: Reprodução direta da coordenação e da limitação presentes no grego.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: quando estou presente com vocês
  rationale: O infinitivo articular com ἐν tem valor temporal; a formulação é clara e preserva a ênfase na presença de Paulo.
theological_decisions:
- issue: Voz e sentido de ζηλοῦσθαι
  choice: 'Passivo: ser procurado com zelo'
  alternative: Ser zeloso / mostrar zelo
  rationale: A forma é passiva e o contexto imediato repete o verbo para descrever pessoas que procuram conquistar os gálatas. A leitura passiva mantém a ligação entre os versículos 17 e 18, sem ocultar a alternativa possível.
- issue: Sentido de ἐν καλῷ
  choice: Por um bom propósito
  alternative: Em algo bom / de modo bom
  rationale: A expressão pode indicar esfera, motivo ou finalidade. “Por um bom propósito” comunica a provável oposição contextual entre motivos bons e maus, enquanto a nota preserva a formulação mais literal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Vocês” evita regionalismo excessivo. A ordem dos marcadores [b][a] acompanha as expressões a que se referem no texto e preserva ambos os esclarecimentos.
