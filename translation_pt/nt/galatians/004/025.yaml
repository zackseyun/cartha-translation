  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: pt
  text: Agar é o monte Sinai, na Arábia[a], e corresponde à Jerusalém atual, pois ela vive na escravidão com seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ora, esta Agar é o monte Sinai, na Arábia». O grego traz um artigo antes de «Agar», formando uma construção sintaticamente difícil que algumas traduções procuram reproduzir de modo mais explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Agar
  rationale: O artigo neutro antes do nome próprio cria uma construção grega difícil. O texto principal usa a forma natural em português e registra em nota a alternativa mais explícita; δέ funciona como transição leve, sem exigir «Ora».
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: é o monte Sinai, na Arábia
  rationale: Preserva a identificação direta e a localização geográfica, com pontuação natural que evita sugerir que «na Arábia» qualifique Agar em vez do monte Sinai.
- source_word: συστοιχεῖ
  choice: corresponde a
  rationale: Expressa a ideia de estar na mesma série ou coluna da comparação alegórica sem introduzir a formulação interpretativa «representa».
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: à Jerusalém atual
  rationale: Mantém o contraste temporal com a «Jerusalém lá de cima» do versículo seguinte; «atual» é claro e idiomático.
- source_word: δουλεύει
  choice: vive na escravidão
  rationale: Torna explícita a condição de escravidão central ao contraste do contexto, em linguagem natural e sem reduzi-la a serviço genérico.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: com seus filhos
  rationale: Preserva tanto a associação indicada por μετά como a relação familiar e alegórica de τέκνα.
theological_decisions:
- issue: Identificação alegórica de Agar com Sinai e correspondência com Jerusalém
  choice: 'Manter a afirmação direta: «Agar é o monte Sinai [...] e corresponde à Jerusalém atual».'
  alternative: 'Traduzir interpretativamente: «Agar representa o monte Sinai».'
  rationale: O grego emprega linguagem equacional direta e depois o verbo de correspondência. A tradução conserva a força retórica de Paulo sem explicar além do que o texto afirma.
- issue: Escravidão de Jerusalém e de seus filhos
  choice: «ela vive na escravidão com seus filhos»
  alternative: «ela é escrava juntamente com seus filhos»
  rationale: A formulação escolhida preserva a condição contínua expressa pelo verbo e a tensão escravidão/liberdade do contexto, sem especificar além do texto quem exerce o domínio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a pontuação são naturais, enquanto a identificação alegórica direta e a linguagem de escravidão permanecem intactas.
