  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: pt
  text: 'Tornem-se como eu[a], pois eu também me tornei como vocês[c], irmãos[b]. Eu lhes peço: vocês não me fizeram mal algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como eu sou”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se dirige à comunidade dos que creem e provavelmente inclui tanto homens quanto mulheres.
    reason: cultural_note
  - marker: c
    text: 'Ou: “pois eu também sou como vocês”. O grego não expressa o verbo nesta oração; “me tornei” foi suprido conforme o sentido provável no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: Tornem-se
  rationale: O imperativo presente de γίνομαι pede que os destinatários assumam uma condição ou postura; “tornem-se” preserva melhor esse caráter dinâmico do que “sejam”.
- source_word: ὡς ἐγώ
  choice: como eu
  rationale: Expressa de modo natural a comparação de ὡς com ἐγώ, sem explicitar além do grego o estado subentendido.
- source_word: ὅτι
  choice: pois
  rationale: Introduz naturalmente a razão do apelo. “Porque” também seria possível, mas “pois” evita uma sequência pesada e mantém o tom argumentativo.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: eu também me tornei como vocês
  rationale: A oração é elíptica e não repete um verbo finito. Retomar contextualmente γίνομαι como passado comunica a identificação anterior de Paulo com os gálatas, sem ocultar em nota a alternativa mais estritamente elíptica.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o vocativo masculino plural do texto grego; neste endereço comunitário, o termo provavelmente inclui homens e mulheres, o que é esclarecido em nota.
- source_word: δέομαι ὑμῶν
  choice: Eu lhes peço
  rationale: Transmite um pedido insistente e pessoal em português atual. “Eu lhes imploro” seria mais intenso, mas pode soar excessivo neste contexto.
- source_word: οὐδέν με ἠδικήσατε
  choice: vocês não me fizeram mal algum
  rationale: Reproduz a negação enfática de οὐδέν e o objeto pessoal με em linguagem portuguesa idiomática; o pretérito perfeito corresponde adequadamente ao aoristo no contexto.
theological_decisions:
- issue: Força inclusiva de ἀδελφοί na comunidade da Galácia
  choice: “irmãos” no texto principal, com nota explicando a provável inclusão de homens e mulheres
  alternative: “irmãos e irmãs”
  rationale: A forma grega é masculina plural, mas o uso vocativo comunitário provavelmente abrange toda a comunidade. A tradução preserva a forma lexical e esclarece seu alcance sem impor uma expansão no texto.
- issue: Verbo subentendido em κἀγὼ ὡς ὑμεῖς
  choice: suprir “me tornei”
  alternative: “eu também sou como vocês”
  rationale: O grego é elíptico e permite mais de uma explicitação. “Me tornei” se ajusta ao contexto da identificação de Paulo com os gentios, enquanto a nota preserva a possibilidade de leitura no presente.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis e boa legibilidade brasileira. “Vocês” representa o plural de segunda pessoa; “lhes” evita repetição pouco natural. A pontuação separa o apelo da afirmação seguinte e mantém o tom pastoral.
