id: GAL.4.1
reference: Galatians 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a slave, though he is lord of all[b],
translation:
  language: pt
  text: Digo, porém, que, enquanto o herdeiro é menor de idade[a], em nada difere de um escravo, embora seja senhor de tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criança”. A palavra grega pode designar uma criança pequena ou alguém que ainda não atingiu a idade para exercer plenamente seus direitos; neste contexto, destaca a condição de menoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Digo, porém
  rationale: O presente λέγω introduz a explicação, e δέ funciona como conectivo leve. “Digo, porém” preserva a transição sem acrescentar uma ideia temporal ausente no grego.
- source_word: ἐφ’ ὅσον χρόνον
  choice: enquanto
  rationale: A expressão indica duração até certo limite; “enquanto” é natural, conciso e adequado ao contexto da menoridade.
- source_word: ὁ κληρονόμος
  choice: o herdeiro
  rationale: κληρονόμος designa quem recebe uma herança; “herdeiro” é o equivalente corrente e exato.
- source_word: νήπιός
  choice: menor de idade
  rationale: Embora νήπιος possa significar criança pequena, nesta analogia jurídica o ponto central é que o herdeiro ainda não atingiu a idade em que assume seus direitos. “Menor de idade” comunica essa função contextual sem especificar uma idade.
- source_word: οὐδὲν διαφέρει
  choice: em nada difere
  rationale: A formulação conserva a força absoluta da expressão grega e permanece idiomática em português.
- source_word: δούλου
  choice: um escravo
  rationale: δοῦλος indica aqui uma pessoa em condição de escravidão. A comparação depende de sua falta de autonomia, de modo que “escravo” preserva melhor a força retórica que “servo”.
- source_word: κύριος πάντων ὤν
  choice: embora seja senhor de tudo
  rationale: O particípio tem sentido concessivo no contexto. κύριος se refere à condição de proprietário ou titular, não a um título divino; “senhor de tudo” preserva a ironia da afirmação.
theological_decisions:
- issue: Tradução de δοῦλος na analogia de Paulo
  choice: escravo
  alternative: servo
  rationale: A condição de sujeição é essencial ao contraste entre a posição jurídica futura do herdeiro e sua falta temporária de autonomia. “Escravo” exprime essa condição de modo transparente e não suaviza a comparação.
- issue: Sentido de κύριος πάντων
  choice: senhor de tudo
  alternative: dono de tudo
  rationale: “Senhor de tudo” mantém a amplitude e a tensão da expressão grega. Neste contexto, descreve a titularidade do herdeiro, sem tratar κύριος como título divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a estrutura argumentativa de Paulo e explicita apenas o valor concessivo naturalmente implicado pelo particípio grego.
