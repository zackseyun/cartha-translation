  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: pt
  text: 'Essas coisas são interpretadas alegoricamente[a], pois essas mulheres são duas alianças: uma, procedente do monte Sinai, gera filhos para a escravidão[b]; ela é Agar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são apresentadas em sentido alegórico” ou “constituem uma alegoria”. A expressão grega indica que Paulo usa o relato anterior de maneira alegórica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “gera filhos que entram em escravidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Essas coisas
  rationale: Retoma de modo natural, em português, o relato precedente sobre Agar e Sara, preservando a referência anafórica do neutro plural.
- source_word: ἀλληγορούμενα
  choice: são interpretadas alegoricamente
  rationale: Expressa o uso interpretativo e retórico do relato por Paulo, sem afirmar que as pessoas históricas sejam irreais; a nota registra alternativas possíveis.
- source_word: αὗται
  choice: essas mulheres
  rationale: O demonstrativo feminino plural aponta para as duas mulheres mencionadas anteriormente; explicitar “mulheres” torna o referente claro em português.
- source_word: διαθῆκαι
  choice: alianças
  rationale: É o termo bíblico corrente e adequado ao contexto paulino e à referência ao Sinai.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: Uma delas, procedente do monte Sinai
  rationale: Preserva a ideia de origem e o primeiro elemento do contraste iniciado por μέν, que prossegue no contexto.
- source_word: γεννῶσα
  choice: gera filhos
  rationale: Mantém a imagem materna da aliança personificada por Agar e soa natural em português.
- source_word: εἰς δουλείαν
  choice: para a escravidão
  rationale: Comunica o resultado ou destino indicado por εἰς e conserva a força de δουλεία; a alternativa mais direcional é registrada em nota.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: ela é Agar
  rationale: Preserva com clareza a identificação alegórica, usando o pronome feminino exigido pela figura da mulher personificada.
theological_decisions:
- issue: Natureza do uso paulino do relato de Sara e Agar
  choice: O relato é interpretado alegoricamente por Paulo.
  alternative: “Essas coisas são uma alegoria” ou uma formulação que possa sugerir que o relato não tenha referência histórica.
  rationale: O particípio passivo ἀλληγορούμενα indica um modo de interpretação ou apresentação. A tradução conserva essa nuance sem decidir a questão da historicidade das personagens.
- issue: Sentido de δουλεία
  choice: escravidão
  alternative: servidão ou sujeição
  rationale: Neste contraste entre as duas alianças, a condição de escravização é central; “escravidão” preserva melhor a força do termo grego.
- issue: Relação entre as mulheres e as alianças
  choice: “representam duas alianças”
  alternative: “são duas alianças”
  rationale: “Representam” explicita em português a identificação figurada introduzida pela interpretação alegórica, sem confundir literalmente as mulheres com as alianças.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Monte Sinai”, “alianças” e “escravidão” preservam o registro bíblico corrente sem arcaísmo. A divisão em duas frases melhora a clareza, mantendo a conexão lógica do grego.
