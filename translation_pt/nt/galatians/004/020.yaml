id: GAL.4.20
reference: Galatians 4:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: pt
  text: Mas eu gostaria de estar com vocês agora e mudar o meu tom de voz[a], pois estou perplexo quanto a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mudar a minha voz”; no contexto, provavelmente significa mudar o tom ou a maneira de falar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: eu gostaria
  rationale: O imperfeito de θέλω expressa aqui um desejo presente de modo atenuado. “Eu gostaria” soa natural em português e não acrescenta explicitamente uma impossibilidade que o grego apenas sugere pelo contexto.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição levemente contrastiva em relação ao apelo anterior.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: estar com vocês
  rationale: Transmite de forma idiomática a presença pessoal de Paulo junto aos gálatas.
- source_word: ἄρτι
  choice: agora
  rationale: Preserva a referência temporal imediata de ἄρτι em português claro e corrente.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: mudar o meu tom de voz
  rationale: Embora φωνή signifique literalmente “voz”, no contexto a expressão provavelmente diz respeito à maneira ou ao tom com que Paulo lhes falaria. “Tom de voz” mantém a ligação com o termo literal e comunica o sentido contextual.
- source_word: ὅτι
  choice: pois
  rationale: Introduz naturalmente a razão do desejo expresso por Paulo, em registro digno e corrente.
- source_word: ἀποροῦμαι
  choice: estou perplexo
  rationale: Preserva a ideia de perplexidade, incerteza e falta de saber como proceder, sem determinar em excesso a emoção de Paulo.
- source_word: ἐν ὑμῖν
  choice: quanto a vocês
  rationale: Expressa de modo idiomático a referência da perplexidade de Paulo, sem reproduzir literalmente o pouco natural “em vocês”.
theological_decisions:
- issue: Sentido de φωνή no contexto
  choice: A expressão se refere provavelmente ao tom ou à maneira de Paulo falar.
  alternative: A expressão pode ser entendida literalmente como uma mudança em sua voz.
  rationale: O contexto de repreensão e preocupação pastoral favorece uma mudança na maneira de se dirigir aos leitores; a nota preserva a formulação literal e a possível ambiguidade.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Vocês” evita regionalismo excessivo; “quanto a vocês” conserva um tom formal moderado. A tradução mantém a tensão entre o desejo de presença e a perplexidade de Paulo.
