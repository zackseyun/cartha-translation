source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: pt
  text: E, embora minha condição física tenha sido uma provação para vocês[a], vocês não me trataram com desprezo nem com repulsa[b]; pelo contrário, me acolheram como um anjo de Deus, como o Messias Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a provação de vocês em minha carne”. O texto e a relação sintática entre essas palavras são difíceis.'
    reason: alternative_reading
  - marker: b
    text: A expressão traduzida por “nem com repulsa” significa literalmente “nem cuspiram para fora” e comunica aversão ou rejeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: provação
  rationale: No contexto, indica uma circunstância difícil ou teste causado pela condição física de Paulo, não uma incitação ao pecado.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: minha condição física tenha sido uma provação para vocês
  rationale: Expressa em português natural a relação difícil entre o genitivo ὑμῶν e a condição corporal de Paulo, sem interpretar σάρξ como natureza pecaminosa; a formulação mais literal é preservada em nota.
- source_word: ἐξουθενήσατε
  choice: trataram com desprezo
  rationale: Comunica a ideia de menosprezar ou considerar alguém sem valor.
- source_word: ἐξεπτύσατε
  choice: repulsa
  rationale: Transmite o sentido figurado de rejeição marcada por aversão; a imagem literal de cuspir é registrada em nota.
- source_word: ἐδέξασθέ με
  choice: me acolheram
  rationale: Reflete a recepção pessoal e calorosa indicada pelo contexto.
- source_word: ἄγγελον θεοῦ
  choice: um anjo de Deus
  rationale: Preserva o sentido elevado da comparação e a acepção comum de ἄγγελος neste paralelismo.
- source_word: Χριστὸν Ἰησοῦν
  choice: o Messias Jesus
  rationale: Χριστός tem força titular na comparação; o artigo em português torna a expressão mais natural sem constar explicitamente do grego.
theological_decisions:
- issue: Sentido de σάρξ
  choice: condição física de Paulo
  alternative: natureza pecaminosa
  rationale: O contexto trata de enfermidade, fraqueza ou limitação corporal; uma leitura moral não é sustentada aqui.
- issue: Comparação “como um anjo de Deus, como o Messias Jesus”
  choice: modo extraordinariamente honroso como os gálatas acolheram Paulo
  alternative: identificação ontológica de Paulo com Cristo
  rationale: As duas construções com ὡς descrevem a maneira da recepção, sem identificar Paulo com Jesus.
- issue: Relação sintática de ὑμῶν com πειρασμὸν e ἐν τῇ σαρκί μου
  choice: a condição física de Paulo constituiu uma provação para os gálatas
  alternative: “a provação de vocês em minha carne”
  rationale: A sintaxe e a evidência textual são difíceis; a leitura escolhida produz sentido contextual claro, enquanto a alternativa formal é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Condição física” evita a ambiguidade moral de “carne”; “provação” preserva o sentido de teste ou dificuldade. A ordem das notas segue a ocorrência dos marcadores no texto.
