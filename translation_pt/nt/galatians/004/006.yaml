id: GAL.4.6
reference: Galatians 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: pt
  text: 'E porque vocês são filhos[a], Deus enviou o Espírito de seu Filho para dentro de nossos corações[b], clamando: “Aba[c], Pai!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos” preserva aqui a linguagem de Paulo sobre filiação e herança; a referência abrange todos os que creem, não apenas os homens.
    reason: cultural_note
  - marker: b
    text: Alguns manuscritos dizem “para dentro dos corações de vocês” em vez de “para dentro de nossos corações”.
    reason: textual_variant
  - marker: c
    text: Aba é uma forma aramaica de se dirigir ao pai, mantida aqui para preservar a expressão original.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: E, porque
  rationale: ὅτι apresenta a razão ou explicação, enquanto δέ mantém uma leve conexão com o argumento anterior. A formulação conserva ambas as funções em português corrente.
- source_word: ἐστε
  choice: vocês são
  rationale: O presente de εἰμί descreve o estado atual dos destinatários, no qual Paulo fundamenta a ação divina mencionada em seguida.
- source_word: υἱοί
  choice: filhos
  rationale: O masculino plural está ligado, no contexto de Gálatas 3–4, à condição filial e ao direito de herança. Em português, “filhos” preserva essa linguagem e pode abranger todos os que creem, não apenas homens.
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: O aoristo apresenta a ação divina como realizada. “Enviou” é natural e transmite adequadamente ἐξαποστέλλω sem rigidez desnecessária.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: o Espírito de seu Filho
  rationale: Mantém a relação genitiva e o peso teológico da expressão grega, com clareza em português.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: aos nossos corações
  rationale: Reproduz a preposição de movimento e o plural do texto grego, preservando também o termo antropológico bíblico “corações”.
- source_word: κρᾶζον
  choice: clamando
  rationale: O particípio presente concorda com “Espírito” e retrata seu clamor. “Clamando” preserva a forma participial e a intensidade do verbo sem explicitar além do texto.
- source_word: Αββα
  choice: Aba
  rationale: A forma aramaica inserida no texto grego é transliterada segundo o uso consolidado em português, preservando o modo original de tratamento.
- source_word: ὁ πατήρ
  choice: Pai
  rationale: Embora tenha artigo em grego, a expressão está em aposição a “Aba” e tem sentido vocativo; “Pai” é a forma natural de tratamento direto em português.
theological_decisions:
- issue: Tradução de υἱοί no contexto de filiação e herança
  choice: filhos
  alternative: filhos e filhas; crianças; descendentes
  rationale: O argumento de Paulo depende da condição jurídica e familiar de filho-herdeiro. “Filhos” conserva essa ligação sem limitar a referência aos homens, como esclarece a nota.
- issue: Variante textual no pronome possessivo ligado a “corações”
  choice: nossos corações
  alternative: corações de vocês
  rationale: O texto fornecido do SBLGNT traz ἡμῶν, “nossos”. A variante conhecida ὑμῶν, “de vocês”, é registrada em nota para transparência textual.
- issue: Quem clama “Aba, Pai”
  choice: o Espírito é quem clama
  alternative: os crentes clamam por meio do Espírito
  rationale: Gramaticalmente, o particípio neutro singular κρᾶζον concorda com τὸ πνεῦμα, fazendo do Espírito o agente explícito do clamor, sem excluir a participação dos crentes por meio dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “vocês” evita regionalismo excessivo; “filhos”, “corações” e “clamando” conservam as imagens e relações gramaticais centrais do original.
