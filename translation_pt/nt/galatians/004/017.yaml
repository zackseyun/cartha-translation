id: GAL.4.17
reference: Galatians 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: pt
  text: Eles demonstram grande interesse por vocês[a], mas não de modo correto. Pelo contrário, querem excluir vocês[b], para que vocês demonstrem grande interesse por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles têm zelo por vocês, mas não de modo honroso”. O verbo grego também pode ter o sentido de procurar conquistar a atenção ou a afeição de alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “deixar vocês de fora”. É provável que queiram isolá-los de Paulo e de seus colaboradores, para que vocês passem a procurar a aprovação deles.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε (ζηλόω)
  choice: demonstram grande interesse / demonstrem grande interesse
  rationale: O verbo pode expressar zelo, forte interesse ou empenho em conquistar a atenção de alguém. A repetição preserva o paralelismo retórico do grego e comunica em português atual o interesse aparentemente favorável, mas manipulador, dos adversários, sem impor uma conotação romântica.
- source_word: οὐ καλῶς
  choice: não com boa intenção
  rationale: No contexto, a expressão qualifica negativamente o interesse dos adversários, sobretudo quanto à sua motivação, que a oração seguinte explicita. A formulação é natural e evita o sentido moderno possivelmente ambíguo de 'não de uma boa maneira'.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca a forte correção e introduz a explicação do propósito indevido dos adversários.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: afastar vocês
  rationale: O infinitivo significa excluir ou deixar de fora. 'Afastar vocês' expressa naturalmente a provável manobra relacional, sem especificar de quem ou de quê seriam afastados, algo que o texto grego deixa implícito.
- source_word: θέλουσιν
  choice: querem
  rationale: Equivalente corrente e direto do verbo de vontade.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a finalidade da tentativa de afastamento.
- source_word: ὑμᾶς / αὐτούς
  choice: vocês / eles
  rationale: Mantém a distinção entre os destinatários plurais e os adversários, com pronomes naturais no português de ampla legibilidade brasileira.
theological_decisions:
- issue: De quem ou de quê os adversários querem afastar os gálatas
  choice: Deixar o complemento implícito, como no grego, sugerindo apenas uma ruptura relacional destinada a redirecionar a lealdade dos gálatas.
  alternative: Explicitar que querem afastá-los de Paulo e de seus colaboradores, da igreja ou da bênção de Deus.
  rationale: O contexto favorece o afastamento de Paulo e de seu círculo, mas o versículo não nomeia o âmbito da exclusão. A tradução preserva essa abertura e a nota apresenta a inferência contextual sem transformá-la em texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A repetição de “demonstram/demonstrem grande interesse” conserva o jogo verbal do original; “vocês” torna inequívoco o plural. As notas preservam as alternativas lexicais e evitam inserir no corpo do texto um complemento ausente no grego.
