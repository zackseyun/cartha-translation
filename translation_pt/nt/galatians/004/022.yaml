source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the slave woman and one by the free woman.
translation:
  language: pt
  text: 'Pois está escrito que Abraão teve dois filhos: um da escrava e outro da mulher livre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada e natural em português para introduzir uma referência às Escrituras, preservando a força do perfeito passivo grego.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o argumento anterior de Paulo de modo conciso e natural.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo do que está escrito.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: δύο υἱοὺς
  choice: dois filhos
  rationale: υἱούς designa especificamente filhos do sexo masculino; a tradução preserva essa precisão.
- source_word: ἔσχεν
  choice: teve
  rationale: Expressa de modo idiomático a relação de paternidade sem acrescentar a nuance mais interpretativa de 'gerou'.
- source_word: ἕνα ... καὶ ἕνα
  choice: um ... e outro
  rationale: Reproduz com naturalidade em português a estrutura correlativa e o contraste entre os dois filhos.
- source_word: ἐκ
  choice: da
  rationale: No contexto genealógico, 'da escrava' e 'da mulher livre' expressam naturalmente a origem materna indicada por ἐκ.
- source_word: παιδίσκης
  choice: escrava
  rationale: O termo pode indicar serva ou escrava; 'escrava' torna explícito o estatuto de sujeição que Paulo contrapõe à liberdade no argumento circundante.
- source_word: ἐλευθέρας
  choice: mulher livre
  rationale: O adjetivo substantivado indica uma mulher de condição livre e mantém claramente o paralelo social com 'escrava'.
theological_decisions:
- issue: Contraste de condição social central à alegoria de Paulo
  choice: escrava / mulher livre
  alternative: serva / mulher livre
  rationale: A argumentação do contexto depende do contraste entre escravidão e liberdade. 'Escrava' preserva esse contraste sem acrescentar uma conclusão doutrinária ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão e o paralelismo do grego. Não foi incluída nota lexical porque 'escrava' representa adequadamente o sentido contextual de παιδίσκη; 'serva' continua sendo uma alternativa lexical possível, mas enfraquece o contraste explícito com a mulher livre.
