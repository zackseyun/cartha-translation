  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: pt
  text: Mas a Jerusalém do alto é livre e é nossa mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a qual é nossa mãe».'
    reason: Alternativa mais formal para o pronome relativo grego ἥτις.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a Jerusalém atual mencionada no contexto anterior.
- source_word: ἄνω
  choice: do alto
  rationale: Preserva a imagem espacial e o contraste com a Jerusalém terrena sem explicitar além do texto como «celestial».
- source_word: ἐλευθέρα
  choice: livre
  rationale: Mantém o adjetivo predicativo e a ligação com o contraste entre escravidão e liberdade no trecho.
- source_word: ἥτις
  choice: e é
  rationale: Expressa com naturalidade a continuação explicativa; o gênero feminino de «Jerusalém» sustenta a personificação materna sem exigir a repetição do pronome.
- source_word: μήτηρ ἡμῶν
  choice: nossa mãe
  rationale: Reproduz diretamente a metáfora materna central à alegoria.
theological_decisions:
- issue: Personificação e relação da «Jerusalém do alto» com os leitores
  choice: «e é nossa mãe»
  alternative: «a qual é nossa mãe»
  rationale: A formulação natural preserva a personificação feminina e a identificação materna, sem acrescentar uma interpretação eclesiológica ou escatológica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Jerusalém do alto» preserva a metáfora original; a coordenação evita uma construção relativa pesada.
