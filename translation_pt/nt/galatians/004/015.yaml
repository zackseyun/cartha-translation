  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: pt
  text: Que foi feito, então, da felicidade de vocês?[a] Pois lhes dou testemunho de que, se fosse possível, vocês teriam arrancado os próprios olhos e os dado a mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da bem-aventurança de vocês” ou “da bênção de vocês”. O termo grego pode indicar a condição de ser feliz ou abençoado, bem como a declaração dessa condição.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tendo arrancado os olhos de vocês”. A expressão pode ser hiperbólica, enfatizando a antiga dedicação deles; alguns entendem que também pode aludir à condição física de Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Onde está, então
  rationale: Mantém a forma da pergunta retórica e a força inferencial de οὖν, sugerindo que a antiga atitude dos gálatas já não é evidente.
- source_word: ὁ μακαρισμὸς ὑμῶν
  choice: a satisfação que vocês expressavam
  rationale: μακαρισμός pode indicar tanto a condição de ser considerado feliz ou abençoado quanto a expressão dessa avaliação. No contexto, aponta para a satisfação antes manifestada pelos gálatas ao receber Paulo, sem reduzi-la simplesmente a alegria.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Pois dou testemunho
  rationale: Conserva o tom solene e comprobatório de μαρτυρῶ, em português atual e digno.
- source_word: ὅτι
  choice: de que
  rationale: Introduz o conteúdo do testemunho de Paulo.
- source_word: εἰ δυνατὸν
  choice: se fosse possível
  rationale: Expressa naturalmente em português a condição irreal ou contrária ao fato sugerida pelo contexto, sem desenvolver além do grego conciso.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: vocês teriam arrancado os próprios olhos
  rationale: Preserva a imagem concreta e extrema de ἐξορύσσω. 'Os próprios olhos' torna natural em português a relação possessiva expressa no grego.
- source_word: ἐδώκατέ μοι
  choice: e os dado a mim
  rationale: Traduz diretamente o verbo principal e explicita com o pronome 'os' que o objeto são os olhos.
theological_decisions:
- issue: Sentido de μακαρισμός
  choice: Manter no texto a ideia da satisfação ou avaliação positiva anteriormente expressa pelos gálatas.
  alternative: Traduzir como 'felicidade', 'bem-aventurança' ou 'bênção'.
  rationale: O termo admite estado e declaração de felicidade ou bênção. A formulação escolhida se ajusta ao contexto relacional sem identificar a expressão exclusivamente com uma bênção recebida nem com mera emoção.
- issue: Possível alusão dos 'olhos' a uma enfermidade de Paulo
  choice: Conservar literalmente a imagem de arrancar os olhos, sem explicar sua causa no texto.
  alternative: Generalizar como 'vocês teriam me dado qualquer coisa' ou interpretar como referência direta a uma doença ocular.
  rationale: O grego menciona explicitamente os olhos e usa uma imagem vívida, mas não declara que Paulo tivesse uma enfermidade ocular. A tradução preserva tanto a hipérbole de devoção quanto a possibilidade de uma alusão física.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por 'vocês' evita regionalismo; o tom permanece solene sem recorrer a construções arcaicas. As notas conservam a ambiguidade lexical e interpretativa do original.
