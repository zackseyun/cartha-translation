source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: pt
  text: Assim também nós, quando éramos menores, estávamos escravizados sob os princípios elementares do mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os espíritos elementares do mundo”; o termo grego pode se referir tanto a princípios ou elementos básicos quanto a poderes espirituais cósmicos.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Preserva de modo natural e conciso a analogia com o herdeiro menor de idade nos versículos anteriores.
- source_word: ἡμεῖς
  choice: nós
  rationale: Mantém o pronome explícito e sua ênfase no grego.
- source_word: ὅτε ἦμεν νήπιοι
  choice: quando éramos menores
  rationale: No contexto da ilustração jurídica do herdeiro, νήπιοι indica pessoas ainda sem maioridade, não necessariamente crianças pequenas; “menores” comunica essa condição sem excessivo tecnicismo.
- source_word: ὑπὸ
  choice: sob
  rationale: Conserva a metáfora recorrente de sujeição e domínio.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: os princípios elementares do mundo
  rationale: Mantém a amplitude de στοιχεῖα sem decidir no texto principal se a expressão designa princípios básicos, elementos ou poderes espirituais.
- source_word: ἤμεθα δεδουλωμένοι
  choice: estávamos escravizados
  rationale: Expressa naturalmente a construção passiva perifrástica e preserva a força da linguagem de escravidão.
theological_decisions:
- issue: Sentido de τὰ στοιχεῖα τοῦ κόσμου
  choice: “os princípios elementares do mundo” no texto principal
  alternative: “os espíritos elementares do mundo” ou “os elementos básicos do mundo”
  rationale: A expressão paulina é discutida e pode apontar para princípios ou elementos básicos, ou para poderes cósmicos. A tradução principal não a personaliza, enquanto a nota preserva explicitamente a alternativa espiritual.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Menores” retoma a condição do herdeiro ainda sem maioridade; “estávamos escravizados” mantém a linguagem forte e saliente do original.
