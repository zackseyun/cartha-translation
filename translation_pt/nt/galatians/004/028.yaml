  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: pt
  text: Vocês, porém, irmãos[a], à semelhança de Isaque, são filhos da promessa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz aqui uma forma masculina plural de tratamento, provavelmente dirigida à congregação toda, incluindo homens e mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: Pronome explícito de segunda pessoa do plural, preservado por sua ênfase e vertido de modo natural e amplamente compreensível em português.
- source_word: δέ
  choice: porém
  rationale: Marca uma transição com leve contraste em relação ao argumento anterior; “porém” preserva essa função sem acrescentar valor temporal.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Vocativo masculino plural, usado de modo representativo para se dirigir à congregação; a provável inclusão de homens e mulheres é esclarecida em nota.
- source_word: κατὰ Ἰσαὰκ
  choice: à semelhança de Isaque
  rationale: κατά indica aqui correspondência ou padrão. A expressão apresenta Isaque como o modelo comparativo e evita a rigidez de “segundo Isaque”.
- source_word: ἐπαγγελίας
  choice: da promessa
  rationale: O genitivo modifica “filhos”; a formulação preserva a expressão paulina e sua ressonância teológica.
- source_word: τέκνα
  choice: filhos
  rationale: τέκνα é um substantivo plural sem marcação masculina no grego e expressa relação filial. Em português bíblico corrente, “filhos da promessa” preserva com naturalidade o sentido relacional e a expressão paulina, sem restringir a referência a homens.
- source_word: ἐστέ
  choice: são
  rationale: Presente do indicativo na segunda pessoa do plural, em concordância natural com o pronome brasileiro “vocês”.
theological_decisions:
- issue: Identificação dos destinatários com Isaque no argumento alegórico de Paulo
  choice: “à semelhança de Isaque, são filhos da promessa”
  alternative: “são filhos prometidos, como Isaque”
  rationale: A tradução mantém Isaque como padrão de comparação e “filhos da promessa” como predicativo, preservando a estrutura e a tensão teológica do grego sem transformar a expressão em uma paráfrase doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência brasileira em “vocês”. “À semelhança de” comunica com clareza a relação de correspondência expressa por κατά. A colocação de “porém” preserva o leve contraste de δέ.
