  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: pt
  text: Meus filhos, por quem novamente sofro dores de parto, até que o Messias seja formado em vocês[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo seja formado em vocês”. “Messias” traduz o título grego Χριστός; “Cristo” é a forma tradicional e familiar.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seja formado entre vocês”, destacando o possível sentido comunitário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Meus filhos
  rationale: Vocativo plural afetuoso e natural em português; evita acrescentar a ideia diminutiva de “filhinhos”, não explicitada pelo substantivo.
- source_word: οὓς
  choice: por quem
  rationale: Integra naturalmente o pronome relativo à metáfora das dores de parto, preservando sua relação com os destinatários.
- source_word: πάλιν ὠδίνω
  choice: novamente sofro dores de parto
  rationale: Mantém tanto a repetição indicada por πάλιν quanto a vívida imagem materna de ὠδίνω, em linguagem clara e digna.
- source_word: μέχρις οὗ
  choice: até que
  rationale: Expressa de modo direto e idiomático o limite temporal ou objetivo da metáfora.
- source_word: μορφωθῇ
  choice: seja formado
  rationale: Preserva a voz passiva e a imagem de formação, sem convertê-la em explicação doutrinária.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título Χριστός pelo seu sentido, “Messias”, mantendo “Cristo” como alternativa familiar em nota.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Representa diretamente ἐν com o plural ὑμῖν e permite tanto uma dimensão interior nos fiéis quanto a possível nuance comunitária.
theological_decisions:
- issue: Sentido de o Messias ser formado nos destinatários
  choice: Preservar a metáfora de formação “em vocês” sem definir seu mecanismo doutrinário.
  alternative: Entender a expressão principalmente como formação do Messias entre vocês, no âmbito da comunidade.
  rationale: O plural ὑμῖν e a preposição ἐν permitem nuances pessoais e corporativas. A formulação principal mantém a leitura mais direta, enquanto a nota registra a possibilidade comunitária.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A expressão “dores de parto” conserva a força da metáfora sem soar técnica; “vocês” comunica claramente o plural de ὑμῖν.
