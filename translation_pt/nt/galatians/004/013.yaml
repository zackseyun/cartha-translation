id: GAL.4.13
reference: Galatians 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: pt
  text: Mas vocês sabem que foi por causa de uma enfermidade física[a] que lhes anunciei as boas-novas pela primeira vez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa de uma fraqueza corporal”. Em grego, literalmente, “por causa de uma fraqueza/enfermidade da carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: vocês sabem
  rationale: O perfeito οἶδα tem sentido presente; a expressão apela naturalmente ao conhecimento prévio dos gálatas.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao argumento anterior.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que os gálatas sabem.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: por causa de uma enfermidade física
  rationale: διά com acusativo indica causa. ἀσθένεια pode significar fraqueza ou enfermidade, e σάρξ aqui aponta para a condição corporal de Paulo. A formulação natural comunica o sentido provável sem eliminar a alternativa, registrada em nota.
- source_word: εὐηγγελισάμην
  choice: anunciei as boas-novas
  rationale: Expressa a proclamação evangelística em linguagem atual e compreensível, preservando a força verbal do grego.
- source_word: ὑμῖν
  choice: lhes
  rationale: Reproduz de modo natural o objeto indireto plural em português.
- source_word: τὸ πρότερον
  choice: pela primeira vez
  rationale: No contexto, indica a ocasião inicial em que Paulo evangelizou os gálatas, embora a expressão também possa ter o sentido mais geral de 'anteriormente'.
theological_decisions:
- issue: Sentido de σάρξ em ἀσθένειαν τῆς σαρκὸς
  choice: 'sentido corporal: “enfermidade física”'
  alternative: “fraqueza da carne” ou “fraqueza corporal”
  rationale: O contexto trata das circunstâncias da presença anterior de Paulo entre os gálatas e favorece uma condição corporal, não a ideia ética de natureza pecaminosa. A nota preserva a amplitude lexical sem impor um diagnóstico específico.
- issue: Força de τὸ πρότερον
  choice: “pela primeira vez”
  alternative: “anteriormente”
  rationale: A expressão provavelmente remete à primeira ocasião da evangelização dos gálatas. Como há alguma possibilidade de referência apenas a um tempo anterior, essa ambiguidade é reconhecida na análise, sem sobrecarregar o versículo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Vocês” torna explícito o plural; “lhes” evita repetição. “Enfermidade física” é mais natural do que o literal “enfermidade da carne”, enquanto a nota preserva a forma e a ambiguidade do original.
