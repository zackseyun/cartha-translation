id: GAL.4.10
reference: Galatians 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/010.yaml
  text: You are carefully observing days and months and seasons and years.
translation:
  language: pt
  text: Vocês observam cuidadosamente dias, meses, épocas e anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês observam dias, meses, tempos determinados e anos”. A lista se refere a observâncias de calendário; “tempos determinados” é uma tradução possível de “épocas” (καιρούς).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: dias
  rationale: Tradução direta do acusativo plural; o contexto indica observâncias de calendário, sem necessidade de acrescentar “especiais” ao substantivo.
- source_word: παρατηρεῖσθε
  choice: observam cuidadosamente
  rationale: O presente indica prática em curso, e o verbo pode expressar observância atenta ou meticulosa. A formulação conserva essa nuance sem explicitar uma avaliação teológica além do texto.
- source_word: μῆνας
  choice: meses
  rationale: Equivalente direto, mantido como parte da sequência de unidades do calendário.
- source_word: καιρούς
  choice: épocas
  rationale: Preserva o sentido amplo de períodos ou tempos determinados sem especificá-los prematuramente como festas religiosas.
- source_word: ἐνιαυτούς
  choice: anos
  rationale: Equivalente direto que completa a progressão temporal da lista.
- source_word: καὶ
  choice: e
  rationale: A conjunção final é mantida; nas ocorrências intermediárias, a coordenação cumulativa grega é expressa naturalmente em português por enumeração com vírgulas.
theological_decisions:
- issue: Explicitar que se trata de observâncias judaicas ou religiosas
  choice: Manter na tradução principal apenas os termos temporais, sem acrescentar “sagrados”, “religiosos” ou “festivos”.
  alternative: Vocês observam cuidadosamente dias sagrados, meses, festas e anos.
  rationale: O contexto aponta para observâncias de calendário, mas os substantivos gregos não recebem esses qualificadores. A tradução evita introduzir uma identificação mais específica do que o texto diz.
- issue: Nuance de καιρούς
  choice: épocas
  alternative: tempos determinados
  rationale: “Épocas” mantém a categoria temporal e a ambiguidade do termo; “tempos determinados” explicita uma nuance lexical possível e consta da nota.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. “Observam cuidadosamente” comunica a atenção meticulosa possível em παρατηρεῖσθε; “épocas” evita restringir καιρούς a festas específicas.
