id: GAL.4.4
reference: Galatians 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: pt
  text: Mas, quando chegou a plenitude do tempo[a], Deus enviou seu Filho, nascido de mulher[b], nascido sob a lei[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a medida completa do tempo” ou “o tempo determinado se completou”.
    reason: lexical_alternative
  - marker: b
    text: Ou “vindo de uma mulher”. A expressão destaca o nascimento verdadeiramente humano do Filho.
    reason: lexical_alternative
  - marker: c
    text: Isto é, sujeito à jurisdição da Lei de Moisés.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: Expressa ὅτε como marcador temporal e δέ como transição levemente contrastiva, em continuidade com o contexto anterior.
- source_word: ἦλθεν
  choice: chegou
  rationale: O aoristo de ἔρχομαι indica que o momento decisivo se completou; em português, “quando chegou” é natural e mantém a sequência temporal.
- source_word: τὸ πλήρωμα τοῦ χρόνου
  choice: a plenitude do tempo
  rationale: Preserva a imagem de um tempo que alcança sua medida completa ou momento determinado, sem explicitar além do grego quem o determinou.
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: O composto ἐξαποστέλλω pode sugerir envio para fora ou em missão, mas “enviou” é a forma natural em português e não perde a ação central.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu Filho
  rationale: Equivalente português natural do objeto com possessivo; a inicial maiúscula identifica o título cristológico no contexto.
- source_word: γενόμενον ἐκ γυναικός
  choice: nascido de mulher
  rationale: Neste contexto, γενόμενον expressa nascimento humano, e ἐκ indica origem. A formulação concisa preserva o paralelismo e afirma a humanidade real do Filho.
- source_word: γενόμενον ὑπὸ νόμον
  choice: nascido sob a lei
  rationale: Repete “nascido” para conservar o paralelismo dos dois particípios; “sob a lei” mantém a expressão paulina compacta.
theological_decisions:
- issue: A humanidade real do Filho em γενόμενον ἐκ γυναικός
  choice: nascido de mulher
  alternative: vindo de mulher; feito de mulher
  rationale: “Nascido” comunica com naturalidade um nascimento humano real, enquanto o envio do Filho por Deus no mesmo enunciado permanece intacto, sem resolver além do texto a relação entre preexistência e encarnação.
- issue: Referência de νόμος em ὑπὸ νόμον
  choice: sob a lei, com nota indicando a provável referência à Lei de Moisés
  alternative: sob a Lei de Moisés; sob lei em sentido geral
  rationale: O contexto de Gálatas favorece a Lei mosaica, mas o texto grego conserva a expressão breve e sem artigo. A tradução mantém essa concisão, e a nota esclarece a referência contextual sem incorporá-la como expansão no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a formulação tradicional inteligível “plenitude do tempo”, evita explicações doutrinárias no corpo do texto e conserva o paralelismo “nascido... nascido...”. A vírgula final reflete que o versículo continua sintaticamente em Gálatas 4:5.
