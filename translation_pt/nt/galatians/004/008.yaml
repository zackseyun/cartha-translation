source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: pt
  text: Mas, naquele tempo[a], quando vocês não conheciam Deus, eram escravos daqueles que, por natureza, não são deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antigamente, por não conhecerem Deus, vocês serviam àqueles que, na realidade, não são deuses”.'
    reason: Alternativa lexical e sintática para τότε μὲν, o particípio οὐκ εἰδότες e ἐδουλεύσατε.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a argumentação anterior de modo natural e suficientemente forte.
- source_word: τότε μὲν
  choice: naquele tempo
  rationale: Aponta para o período anterior da vida dos gálatas; μέν prepara o contraste desenvolvido no versículo seguinte.
- source_word: οὐκ εἰδότες θεὸν
  choice: quando vocês não conheciam Deus
  rationale: A construção participial tem sentido temporal no contexto. “Conheciam” preserva a dimensão relacional do uso paulino.
- source_word: ἐδουλεύσατε
  choice: eram escravos
  rationale: Mantém o sentido forte de sujeição de δουλεύω e a linguagem de escravidão e liberdade central em Gálatas.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: daqueles que ... não são deuses
  rationale: Preserva o referente indeterminado do grego, sem introduzir “ídolos” ou “demônios”.
- source_word: φύσει μὴ
  choice: por natureza, não
  rationale: Expressa a negação quanto ao que esses referentes são em realidade, e não apenas quanto à maneira como são chamados.
- source_word: θεοῖς
  choice: deuses
  rationale: O plural em minúscula mantém o contraste com o Deus verdadeiro e traduz diretamente o substantivo grego.
theological_decisions:
- issue: Natureza dos antigos objetos de culto
  choice: “daqueles que, por natureza, não são deuses” como negação ontológica
  alternative: “daqueles que, na realidade, não são deuses” ou “dos seres falsamente chamados deuses”
  rationale: φύσει μὴ οὖσι θεοῖς nega que esses referentes sejam deuses por sua própria natureza. A tradução não decide se Paulo se refere a ídolos, poderes espirituais ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” apropriado ao plural dirigido às comunidades da Galácia. A formulação conserva a força da metáfora de escravidão e a indefinição dos antigos objetos de culto.
