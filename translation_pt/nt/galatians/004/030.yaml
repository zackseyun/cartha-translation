id: GAL.4.30
reference: Galatians 4:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the slave woman and her son[c][b][a], for the son of the slave woman will certainly not inherit with the son of the free woman.”
translation:
  language: pt
  text: Mas o que diz a Escritura? “Expulse a escrava[a] e o filho dela[b], pois o filho da escrava de modo nenhum[c] herdará com o filho da livre.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serva”. O termo grego designa uma mulher em condição de escravidão ou servidão; aqui, “escrava” ressalta o contraste entre escravidão e liberdade, central à passagem.
    reason: lexical_alternative
  - marker: b
    text: A citação retoma Gênesis 21:10.
    reason: cross_reference
  - marker: c
    text: 'O grego emprega uma negação enfática: “de modo nenhum”; também se pode traduzir “certamente não” ou “jamais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca a transição contrastiva em relação ao argumento anterior de forma natural e direta.
- source_word: τί λέγει ἡ γραφή
  choice: o que diz a Escritura?
  rationale: Preserva o presente do verbo e a fórmula que apresenta a Escritura como voz autorizada.
- source_word: Ἔκβαλε
  choice: Expulse
  rationale: O imperativo comunica a ação enérgica de mandar para fora, sem suavizá-la como faria uma expressão como “mande embora”.
- source_word: παιδίσκην
  choice: a escrava
  rationale: O termo designa uma mulher em condição servil; “escrava” torna explícito o contraste entre escravidão e liberdade central ao contexto.
- source_word: υἱὸν αὐτῆς
  choice: o filho dela
  rationale: Reproduz com clareza a construção possessiva, evitando uma formulação potencialmente ambígua como “seu filho”.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: pois ... de modo nenhum herdará
  rationale: A combinação enfática οὐ μή com o futuro expressa uma negação categórica; “de modo nenhum” conserva essa força em português atual e digno.
- source_word: κληρονομήσει
  choice: herdará
  rationale: É o equivalente normal no contexto familiar e jurídico da participação na herança.
- source_word: μετὰ τοῦ υἱοῦ
  choice: com o filho
  rationale: μετά com o genitivo indica associação ou participação conjunta na herança; “com” expressa isso concisamente.
- source_word: τῆς ἐλευθέρας
  choice: da livre
  rationale: Mantém a forma substantivada do adjetivo grego e o contraste direto “escrava/livre” já estabelecido no contexto.
theological_decisions:
- issue: Tradução de παιδίσκη na alegoria de Sara e Agar
  choice: escrava
  alternative: serva; mulher escravizada
  rationale: O argumento de Paulo depende do contraste entre escravidão e liberdade. “Escrava” preserva de modo explícito a condição jurídica e social indicada pelo termo, sem acrescentar uma interpretação denominacional.
- issue: Força da exclusão em οὐ γὰρ μὴ κληρονομήσει
  choice: de modo nenhum herdará
  alternative: certamente não herdará; jamais herdará
  rationale: A tradução mantém a negação enfática e categórica do grego sem ampliar a afirmação para além da citação.
- issue: Forma substantivada τῆς ἐλευθέρας
  choice: da livre
  alternative: da mulher livre
  rationale: “Da livre” conserva a formulação concisa e o paralelismo contextual com “a escrava”; “da mulher livre” seria uma explicitação legítima, mas não necessária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Expulse” conserva a força do imperativo sem soar arcaico. “O filho dela” evita a ambiguidade pronominal comum em português. A construção “da livre” mantém o paralelismo teológico e retórico do contexto.
