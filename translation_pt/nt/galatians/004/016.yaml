  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: pt
  text: Então, tornei-me inimigo de vocês por lhes dizer a verdade?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por falar a verdade a vocês”. O particípio grego ἀληθεύων pode significar “falar com verdade” ou “dizer a verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Então
  rationale: Introduz uma conclusão inferida do contexto anterior e mantém, em português corrente, a força da transição retórica.
- source_word: ἐχθρὸς ὑμῶν
  choice: inimigo de vocês
  rationale: ἐχθρός funciona de modo predicativo e designa alguém considerado inimigo; o genitivo ὑμῶν é expresso naturalmente por “de vocês”.
- source_word: γέγονα
  choice: tornei-me
  rationale: O perfeito de γίνομαι indica uma mudança que resultou na situação presente. “Tornei-me” comunica de modo conciso essa passagem a ser considerado inimigo.
- source_word: ἀληθεύων ὑμῖν
  choice: por lhes dizer a verdade
  rationale: O particípio pode indicar o meio ou a causa percebida da hostilidade e, com o dativo ὑμῖν, refere-se à comunicação verdadeira dirigida aos gálatas. A formulação é natural e preserva a relação retórica da pergunta.
theological_decisions:
- issue: Sentido de ἀληθεύων na argumentação de Paulo
  choice: Paulo pergunta se dizer a verdade diretamente aos gálatas fez com que passassem a considerá-lo inimigo.
  alternative: Paulo pergunta se sua conduta verdadeira ou sincera para com eles o tornou inimigo deles.
  rationale: O contexto imediato favorece o sentido comunicativo de falar a verdade, mas a nota preserva a amplitude lexical do particípio sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A pergunta mantém o tom direto e retórico do original.
