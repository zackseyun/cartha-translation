id: GAL.4.23
reference: Galatians 4:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the slave woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: pt
  text: Mas o filho da escrava nasceu segundo a carne[a], enquanto o filho da mulher livre nasceu por meio da promessa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, pelo modo humano natural de geração; grego: «segundo a carne».'
    reason: lexical_alternative
  - marker: b
    text: Ou «pela promessa». A expressão indica que esse nascimento ocorreu em cumprimento da promessa de Deus, e não apenas por meios humanos naturais.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: escrava
  rationale: Preserva a condição de sujeição que é central ao contraste social e ao argumento de Paulo, sem suavizá-la como faria «serva».
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém o termo paulino σάρξ e a tensão com «por meio da promessa»; neste contexto, refere-se ao modo humano natural de geração, não a uma natureza pecaminosa.
- source_word: γεγέννηται
  choice: nasceu
  rationale: É a forma natural em português para expressar aqui o perfeito passivo grego, sem recorrer ao menos corrente «foi gerado».
- source_word: ἐλευθέρα
  choice: mulher livre
  rationale: Traduz o adjetivo substantivado e mantém claramente o contraste jurídico e social com a escrava.
- source_word: δι’ ἐπαγγελίας
  choice: por meio da promessa
  rationale: Expressa o valor instrumental de διά e torna natural em português a referência contextual à promessa divina, embora o grego não tenha artigo.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: o filho ... enquanto o filho
  rationale: Explicita o referente subentendido nas duas orações e comunica com clareza o contraste correlativo grego.
theological_decisions:
- issue: Contraste entre κατὰ σάρκα e δι’ ἐπαγγελίας
  choice: Conservar «segundo a carne» em contraste com «por meio da promessa».
  alternative: Traduzir interpretativamente «de modo puramente humano» e «como resultado da promessa».
  rationale: O contexto contrasta a geração humana comum com o nascimento ocorrido em cumprimento da promessa de Deus, sem afirmar que a corporeidade ou a procriação sejam pecaminosas. A formulação principal preserva a linguagem paulina e as notas esclarecem seu sentido contextual.
- issue: Artigo em «a promessa»
  choice: Usar «da promessa» em português.
  alternative: Usar «de promessa», seguindo mais formalmente a ausência de artigo no grego.
  rationale: Embora ἐπαγγελίας seja anartro, o contexto identifica uma promessa divina específica; o artigo é idiomático em português e não elimina a possibilidade de entender a promessa como meio ou fundamento do nascimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Escrava» e «mulher livre» preservam o contraste social; «segundo a carne» mantém deliberadamente a terminologia paulina, esclarecida em nota.
