  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: pt
  text: Mas, assim como naquele tempo aquele que nasceu segundo a carne[a] perseguia aquele que nasceu segundo o Espírito[b], assim também acontece agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que nasceu por meios humanos comuns”; literalmente, “aquele que nasceu segundo a carne”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquele segundo o Espírito”. A expressão “que nasceu” é retomada da primeira parte da frase para deixar explícito o paralelismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Introduz de modo natural e conciso o contraste com a explicação anterior.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: assim como naquele tempo ... assim também acontece agora
  rationale: Preserva a estrutura correlativa e o contraste temporal; “acontece” explicita de modo idiomático a elipse grega.
- source_word: ὁ ... γεννηθεὶς
  choice: aquele que nasceu
  rationale: Expressa claramente o particípio passivo substantivado em português moderno.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém a formulação paulina e o contraste com o Espírito sem reduzir a expressão apenas ao meio instrumental.
- source_word: ἐδίωκε
  choice: perseguia
  rationale: O imperfeito retrata a ação passada em seu curso ou como padrão contínuo, e “perseguia” comunica a hostilidade do verbo.
- source_word: τὸν κατὰ πνεῦμα
  choice: aquele que nasceu segundo o Espírito
  rationale: Repete “nasceu”, implícito no grego, para tornar claro o paralelismo em português, sem alterar o sentido.
- source_word: πνεῦμα
  choice: Espírito
  rationale: No contexto de Gálatas, a referência mais provável é ao Espírito Santo, associado à promessa.
- source_word: νῦν
  choice: agora
  rationale: Reproduz diretamente a referência ao tempo presente de Paulo.
theological_decisions:
- issue: Sentido de κατὰ σάρκα no contraste entre Ismael e Isaque
  choice: Nascimento segundo a carne, isto é, por meios humanos comuns
  alternative: Nascimento segundo uma natureza pecaminosa ou de maneira mundana
  rationale: O contexto imediato contrasta o nascimento natural de Ismael com o nascimento de Isaque ligado à promessa e ao Espírito; não exige atribuir aqui a σάρξ o sentido de natureza pecaminosa.
- issue: Referente de πνεῦμα
  choice: O Espírito Santo
  alternative: O espírito humano ou um princípio espiritual
  rationale: A relação contextual entre promessa, filiação e Espírito em Gálatas favorece a referência ao Espírito divino, embora a formulação “segundo o Espírito” preserve a concisão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores foi normalizada para [a][b], fazendo cada nota seguir a expressão pertinente. A tradução conserva “carne” e “Espírito”, mas esclarece em nota a provável nuance de nascimento por meios humanos comuns.
