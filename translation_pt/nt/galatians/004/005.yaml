  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: pt
  text: a fim de resgatar os que estavam sob a Lei, para que recebêssemos a adoção como filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplesmente, “a adoção”. O termo grego significa literalmente “adoção como filhos” e destaca a plena condição filial e os direitos de herança; aqui ele inclui todos os que creem, tanto mulheres como homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: a fim de / para que
  rationale: As duas expressões preservam a força de finalidade das orações, evitando repetição rígida e mantendo o português natural.
- source_word: τοὺς ὑπὸ νόμον
  choice: os que estavam debaixo da Lei
  rationale: A expressão substantivada designa pessoas sujeitas à Lei; o contexto imediato aponta principalmente para a Lei mosaica. O imperfeito contextual em português combina naturalmente com a ação histórica de resgate.
- source_word: νόμον
  choice: Lei
  rationale: A inicial maiúscula sinaliza a referência contextual à Lei mosaica, embora o grego não tenha artigo na expressão.
- source_word: ἐξαγοράσῃ
  choice: resgatar
  rationale: Expressa de modo claro tanto o pano de fundo de libertação mediante pagamento quanto o uso teológico paulino, sem tornar explícita uma imagem além do texto.
- source_word: τὴν υἱοθεσίαν
  choice: a adoção como filhos
  rationale: Preserva o componente filial masculino de υἱοθεσία e sua associação histórica com plena condição e direitos de herança, sem excluir as mulheres abrangidas pelo referente.
- source_word: ἀπολάβωμεν
  choice: recebêssemos
  rationale: Traduz naturalmente o aoristo subjuntivo regido por ἵνα; neste contexto, o sentido simples de receber é preferível a 'receber de volta'.
theological_decisions:
- issue: Linguagem de gênero em υἱοθεσία
  choice: adoção como filhos
  alternative: adoção; condição de filhos
  rationale: A formulação conserva a imagem específica de filiação e herança presente no termo grego. A nota esclarece que a condição concedida inclui igualmente mulheres e homens.
- issue: Referente de τοὺς ὑπὸ νόμον
  choice: pessoas debaixo da Lei mosaica
  alternative: pessoas sujeitas à lei em sentido universal
  rationale: Em Gálatas 4:4–5, a repetição de 'debaixo da Lei' aponta mais naturalmente para a ordem da Torá, embora o alcance da adoção na argumentação da carta inclua todos os que creem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela de finalidade foi mantida, com variação idiomática entre “a fim de” e “para que”.
