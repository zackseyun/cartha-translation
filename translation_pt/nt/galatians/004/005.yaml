review_pass:
  verdict: revise
  source_fidelity: A dupla oração final com ἵνα está bem preservada por “a fim de ... para que”. “Resgatar” traduz adequadamente ἐξαγοράσῃ, e “a adoção como filhos” mantém a imagem filial e de herança de υἱοθεσία. Contudo, “os que estavam debaixo da Lei” introduz um imperfeito (“estavam”) que não está expresso no grego, cuja expressão substantivada designa simplesmente “os que estão/sob a Lei” no âmbito da ação de resgatar.
  naturalness: “Sob a Lei” é mais idiomático e amplamente compreensível em português moderno do que “debaixo da Lei” neste registro. A construção final continua fluente com “a fim de” e “para que”.
  terminology: “Lei” com maiúscula é justificável no contexto da Lei mosaica. “Adoção como filhos” é uma solução fiel para υἱοθεσία; a nota explica apropriadamente que o referente abrange mulheres e homens.
  issues:
  - severity: low
    issue: O imperfeito em “os que estavam debaixo da Lei” não é marcado no texto grego.
    rationale: τοὺς ὑπὸ νόμον não contém verbo nem explicita aspecto imperfeito. “Os que estavam sob a Lei” pode ser inferido pelo contexto histórico, mas acrescenta uma nuance temporal desnecessária. “Os que estavam sob a Lei” seria ainda temporal; “os que estavam” deve ser evitado em favor de uma formulação sem esse acréscimo.
  - severity: low
    issue: “Debaixo da Lei” é menos natural que “sob a Lei” no português moderno.
    rationale: “Sob a Lei” comunica com clareza sujeição à Lei e corresponde ao uso bíblico-teológico corrente sem alterar o sentido.
