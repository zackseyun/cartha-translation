lexical_decisions:
- source_word: χάρις
  choice: Graça
  rationale: Preserva a fórmula epistolar e a ressonância teológica característica de Paulo.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa naturalmente o dativo dos destinatários em português de ampla compreensão, com boa legibilidade brasileira.
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém tanto o pano de fundo da saudação judaica quanto a profundidade teológica do termo.
- source_word: ἀπό
  choice: da parte de
  rationale: Marca a fonte da graça e da paz de maneira idiomática na fórmula de saudação em português.
- source_word: θεοῦ πατρὸς
  choice: Deus, nosso Pai
  rationale: Entende ἡμῶν com πατρός e comunica de forma clara e natural a relação expressa pela cadeia genitiva.
- source_word: κυρίου
  choice: Senhor
  rationale: Conserva a força titular e cristológica usual de κύριος no Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e acrescenta o artigo exigido pelo português idiomático, sem sugerir que 'Messias' seja mero sobrenome.
theological_decisions:
- issue: Se Χριστοῦ deve ser traduzido como título ou mantido na forma tradicional 'Cristo'
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Neste contexto, Χριστός conserva força de designação messiânica. A tradução principal torna o título transparente, enquanto a nota preserva a forma tradicional legítima.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A pontuação em “Deus, nosso Pai” e “Jesus, o Messias” explicita aposição natural em português; a formulação mantém o caráter solene de bênção epistolar.
