  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: pt
  text: que se entregou por nossos pecados, a fim de nos resgatar da presente era má[a], segundo a vontade de nosso Deus e Pai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deste mundo atual e mau”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: se entregou
  rationale: A expressão comunica em português natural a ação voluntária de dar a si mesmo; evita sugerir que ele foi entregue contra a própria vontade.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: por nossos pecados
  rationale: “Por” preserva a amplitude redentora e representativa de ὑπέρ sem impor ao versículo uma teoria específica da expiação.
- source_word: ἐξέληται
  choice: resgatar
  rationale: O verbo indica retirar de uma situação de perigo ou domínio. “Resgatar” é claro e corrente, conservando a força libertadora do termo.
- source_word: αἰῶνος
  choice: era
  rationale: αἰών designa primariamente uma era ou época, com dimensão temporal e cósmica, e não o mundo físico.
- source_word: ἐνεστῶτος πονηροῦ
  choice: presente e má
  rationale: A formulação mantém a caracterização temporal e moral da era, em português natural, sem transformar “presente” em advérbio.
- source_word: κατὰ τὸ θέλημα
  choice: segundo a vontade
  rationale: Expressa conformidade com o propósito de Deus de modo preciso e idiomático.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: de nosso Deus e Pai
  rationale: Preserva a referência a uma só pessoa e segue de perto a estrutura grega em português claro.
theological_decisions:
- issue: Sentido expiatório de ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: por nossos pecados
  alternative: por causa de nossos pecados; em favor de nossos pecados
  rationale: A tradução mantém a força sacrificial e redentora da frase sem definir além do texto o mecanismo da expiação.
- issue: Tradução de αἰών
  choice: era presente e má
  alternative: mundo mau atual
  rationale: “Era” conserva melhor o sentido temporal-cósmico do termo paulino; a alternativa tradicional “mundo” é registrada em nota para preservar a possibilidade lexical reconhecida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Se entregou” soa mais natural que “deu a si mesmo” e explicita apenas a reflexividade voluntária já presente no grego. A ordem “era presente e má” mantém ambos os qualificadores sem sugerir que somente o presente, em sentido abstrato, seja mau.
