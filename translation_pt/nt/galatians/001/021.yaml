lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Marca a sequência temporal no relato de Paulo de maneira natural e clara em português.
- source_word: ἦλθον
  choice: fui
  rationale: Embora o verbo possa ser vertido formalmente como “vim”, o contexto narra o deslocamento de Paulo para outro lugar; “fui” é a forma idiomática em português.
- source_word: εἰς
  choice: para
  rationale: Expressa naturalmente a direção do deslocamento para uma região; “às” também seria possível, mas pode sugerir apenas destino sem destacar tão claramente a extensão regional.
- source_word: κλίματα
  choice: regiões
  rationale: Designa áreas geográficas ou distritos, não uma cidade específica; “regiões” é claro, corrente e digno.
- source_word: Συρίας
  choice: Síria
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: Κιλικίας
  choice: Cilícia
  rationale: Forma portuguesa consagrada do nome geográfico.
