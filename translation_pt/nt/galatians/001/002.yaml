  language: pt
  text: 'e todos os irmãos[a] que estão comigo, às igrejas da Galácia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”. O grego diz “irmãos”, mas pode incluir os demais fiéis, tanto homens como mulheres.
    reason: alternativa_lexical
lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: e todos os irmãos que estão comigo
  rationale: Mantém a ligação com o versículo anterior e traduz naturalmente a expressão grega. «Irmãos» preserva o masculino plural do texto, embora, no uso comunitário, possa abranger homens e mulheres.
- source_word: ἐκκλησίαις
  choice: igrejas
  rationale: «Igrejas» é o equivalente português corrente e adequado para as comunidades cristãs às quais Paulo se dirige.
- source_word: τῆς Γαλατίας
  choice: da Galácia
  rationale: Reproduz de modo direto o genitivo grego e soa natural na fórmula de destinatário.
theological_decisions:
- issue: Possível abrangência inclusiva de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma masculina plural do grego. Como o termo pode designar coletivamente os fiéis de ambos os sexos, essa possibilidade é registrada em nota sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com continuidade epistolar em relação ao versículo anterior. A construção «que estão comigo» explicita de forma natural σὺν ἐμοί. O marcador de nota foi colocado junto ao termo relevante.
