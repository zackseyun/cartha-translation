  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: pt
  text: 'Pois vocês ouviram falar da minha antiga maneira de viver no judaísmo[a]: eu perseguia a igreja de Deus de modo extremo[b] e a devastava[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na religião judaica”.
    reason: lexical_alternative
  - marker: b
    text: Ou “excessivamente” ou “além de toda medida”.
    reason: lexical_alternative
  - marker: c
    text: Ou “procurava destruí-la” ou “a destruía”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: como eu vivia anteriormente
  rationale: Expressa de modo natural tanto a maneira de viver ou conduta (ἀναστροφή) quanto a referência ao período anterior (ποτε), sem reduzir o sentido a atos isolados.
- source_word: Ἰουδαϊσμῷ
  choice: judaísmo
  rationale: É o equivalente português direto e estabelecido para a identidade, prática e sistema religioso judaico aqui referido.
- source_word: καθ’ ὑπερβολὴν
  choice: de modo extremo
  rationale: Conserva a forte intensificação da expressão grega em português corrente e digno.
- source_word: ἐδίωκον
  choice: eu perseguia
  rationale: O pretérito imperfeito representa adequadamente a ação contínua ou habitual indicada pelo imperfeito grego.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: a igreja de Deus
  rationale: “Igreja” é o termo mais reconhecível para a comunidade dos seguidores do Messias neste contexto, embora “assembleia” seja lexicalmente possível.
- source_word: ἐπόρθουν
  choice: procurava destruí-la
  rationale: O verbo denota devastar ou destruir. Esta formulação preserva a violência e pode representar o caráter conativo do imperfeito sem afirmar que Paulo efetivamente destruiu a comunidade.
theological_decisions:
- issue: Tradução de ἐκκλησία como “igreja” ou “assembleia”
  choice: a igreja de Deus
  alternative: a assembleia de Deus
  rationale: No contexto, trata-se da comunidade identificável dos seguidores do Messias. “Igreja” comunica esse referente com clareza no português moderno sem acrescentar uma definição eclesiológica específica.
- issue: Força aspectual de ἐπόρθουν
  choice: procurava destruí-la
  alternative: a devastava
  rationale: O imperfeito admite uma leitura de esforço contínuo ou tentativa. A tradução escolhida evita sugerir que a destruição foi consumada, enquanto a nota preserva a alternativa mais diretamente progressiva.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O pretérito imperfeito preserva a continuidade das duas ações passadas; as notas mantêm alternativas lexicais genuínas.
