source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: pt
  text: 'Assim como já dissemos antes, agora digo novamente: se alguém anuncia a vocês um evangelho contrário ao que receberam,[a] que seja amaldiçoado.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além do que receberam”; a expressão pode indicar um desvio da mensagem recebida.
    reason: lexical_alternative
  - marker: b
    text: Ou “que fique debaixo de maldição”; em grego, anáthema éstō.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Como já dissemos
  rationale: Expressa de modo natural que isso foi dito anteriormente e continua relevante no presente.
- source_word: ἄρτι πάλιν λέγω
  choice: agora digo novamente
  rationale: Preserva tanto a referência ao momento presente em ἄρτι quanto a ideia de repetição em πάλιν.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: se alguém anuncia a vocês um evangelho
  rationale: Mantém a força verbal de proclamar boas-novas e, no contexto de Gálatas, a referência específica à mensagem do evangelho.
- source_word: παρ’ ὃ
  choice: contrário ao que
  rationale: Neste contexto, παρά com o pronome relativo indica desvio da mensagem recebida. A nota preserva a possibilidade lexical de entender a expressão como “além do que”.
- source_word: παρελάβετε
  choice: receberam
  rationale: Traduz naturalmente παραλαμβάνω no sentido de receber uma mensagem ou tradição transmitida.
- source_word: ἀνάθεμα ἔστω
  choice: que seja amaldiçoado
  rationale: Conserva a força solene da fórmula grega sem recorrer ao empréstimo pouco transparente “anátema” nem explicitar quem aplica a maldição.
theological_decisions:
- issue: Força da condenação em ἀνάθεμα ἔστω
  choice: que seja amaldiçoado
  alternative: que fique debaixo de maldição; que seja anátema
  rationale: A tradução mantém a severidade da advertência de Paulo, sem acrescentar ao texto uma especificação doutrinária sobre o agente ou o alcance da maldição.
- issue: Relação do evangelho anunciado com a mensagem recebida em παρ’ ὃ
  choice: contrário ao que receberam
  alternative: além do que receberam; diferente do que receberam
  rationale: O contexto favorece a ideia de oposição ou desvio, mas a nota registra a amplitude semântica da preposição sem resolver além da evidência a nuança exata.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. “A vocês” evita regionalismo excessivo; “amaldiçoado” preserva a solenidade e a dureza do original. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
