id: GAL.1.11
reference: Galatians 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: pt
  text: Pois quero que vocês saibam, irmãos[a], que o evangelho anunciado por mim não é de origem humana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: irmãos e irmãs.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: não é segundo o homem; a expressão também pode significar “não segue critérios humanos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: quero que vocês saibam
  rationale: A expressão introduz uma declaração importante. Esta forma idiomática comunica com naturalidade o sentido de “faço saber a vocês”, sem acrescentar conteúdo.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa e causal que liga esta afirmação ao argumento anterior.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do grego e o modo tradicional de tratamento; no uso paulino, pode abranger toda a comunidade cristã, como indicado na nota.
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: É o termo português consagrado e adequado ao sentido específico que a palavra tem no argumento de Paulo.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: anunciado por mim
  rationale: Expressa de modo natural a proclamação pública do evangelho e preserva explicitamente Paulo como agente.
- source_word: κατὰ ἄνθρωπον
  choice: de origem humana
  rationale: No contexto imediato, Paulo nega ter recebido ou aprendido o evangelho de uma pessoa (1.12), favorecendo a ideia de procedência humana. A formulação grega mais literal e a possível referência a critérios humanos são preservadas em nota.
theological_decisions:
- issue: Se κατὰ ἄνθρωπον indica principalmente origem humana ou conformidade com padrões humanos
  choice: de origem humana
  alternative: segundo o homem; segundo critérios humanos
  rationale: O versículo seguinte desenvolve a questão da fonte do evangelho, pois Paulo afirma que não o recebeu nem o aprendeu de ser humano algum. Ainda assim, a construção grega permite uma formulação mais ampla, preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Vocês” evita a rigidez regional de “vós”; “Pois” mantém a ligação argumentativa. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
