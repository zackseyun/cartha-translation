id: GAL.1.19
reference: Galatians 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: pt
  text: Mas não vi nenhum dos outros apóstolos, a não ser Tiago[a], irmão do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não vi nenhum outro apóstolo — somente Tiago, irmão do Senhor.” Alguns entendem essa formulação sem considerar Tiago um apóstolo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: nenhum dos outros
  rationale: Na construção partitiva com τῶν ἀποστόλων, indica outro membro do grupo; combinado com a negação, a formulação portuguesa natural é “nenhum dos outros”.
- source_word: δέ
  choice: Mas
  rationale: Marca contraste leve com o relato imediatamente anterior e é bem representado por “Mas”.
- source_word: ἀποστόλων
  choice: apóstolos
  rationale: É o termo português estabelecido para o círculo apostólico reconhecido neste contexto paulino.
- source_word: οὐκ εἶδον
  choice: não vi nenhum
  rationale: Preserva a negação e o aoristo indicativo em português corrente, em ligação natural com a expressão partitiva.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Funciona aqui como locução de exceção, não como condição; “a não ser” conserva com naturalidade a relação sintática e sua possível ambiguidade.
- source_word: Ἰάκωβον
  choice: Tiago
  rationale: Forma tradicional e amplamente reconhecida em português para o nome bíblico Ἰάκωβος.
- source_word: ἀδελφὸν
  choice: irmão
  rationale: É o sentido comum e direto; o contexto não exige o termo mais amplo “parente”.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Mantém o título κύριος como “Senhor” e produz a expressão portuguesa natural “irmão do Senhor”.
theological_decisions:
- issue: Se Tiago é contado entre “os apóstolos” nesta construção
  choice: 'O texto principal mantém a leitura sintática mais natural: Paulo não viu nenhum dos outros apóstolos, a não ser Tiago, o que o inclui na exceção.'
  alternative: A frase pode ser entendida como afirmando que Paulo não viu outro apóstolo além de Pedro, mas viu também Tiago, sem necessariamente classificar Tiago como apóstolo.
  rationale: εἰ μὴ introduz mais naturalmente uma exceção a “nenhum dos outros apóstolos”. A nota preserva a interpretação alternativa sem resolver no texto uma tensão genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A não ser” soa natural e preserva a estrutura de exceção; “Tiago” segue o uso bíblico português estabelecido.
