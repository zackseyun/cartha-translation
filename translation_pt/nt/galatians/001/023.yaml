  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: pt
  text: 'Eles apenas ouviam dizer: “Aquele que antes nos perseguia agora anuncia a fé que antes devastava.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: apenas
  rationale: 'Expressa a limitação do conhecimento que tinham: este chegava a eles somente por relatos.'
- source_word: ἀκούοντες ἦσαν
  choice: ouviam dizer
  rationale: A construção perifrástica no imperfeito indica recepção contínua ou repetida de uma notícia; a expressão é natural em português para relatos indiretos.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: aquele que antes nos perseguia
  rationale: Preserva o particípio substantivado e identifica Paulo por sua antiga atividade persecutória.
- source_word: νῦν εὐαγγελίζεται
  choice: agora anuncia
  rationale: Traduz a linguagem de proclamação da boa notícia de modo claro, sem inserir um objeto diferente do expresso no grego.
- source_word: τὴν πίστιν
  choice: a fé
  rationale: Mantém o equivalente direto e, neste contexto, designa mais naturalmente a fé cristã como mensagem ou conteúdo proclamado.
- source_word: ἣν ποτε ἐπόρθει
  choice: que antes procurava destruir
  rationale: Comunica de maneira idiomática a ação hostil e destrutiva de πορθέω, sem sugerir que a destruição foi consumada.
theological_decisions:
- issue: Sentido de τὴν πίστιν
  choice: “a fé” como a mensagem ou fé cristã que Paulo agora anuncia
  alternative: “a boa notícia” ou a fé entendida como ato subjetivo de crer
  rationale: O artigo e o contraste entre a perseguição anterior e a proclamação atual favorecem o sentido objetivo da fé como mensagem confessada, embora a formulação grega seja preservada sem substituí-la por “evangelho”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ouviam dizer” reproduz naturalmente a ideia de notícia recebida repetidamente; “procurava destruir” expressa a força de πορθέω sem afirmar êxito. Não se acrescentou nota, pois “a fé” preserva diretamente a formulação grega e funciona com clareza no contexto.
