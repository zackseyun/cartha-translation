  source_fidelity: A tradução preserva adequadamente a limitação de μόνον, a notícia recebida no imperfeito, a identificação do antigo perseguidor e o sentido objetivo de «a fé». Contudo, «procurava destruir» introduz sobretudo a noção de tentativa, enquanto ἐπόρθει descreve a ação hostil continuada de devastar/assolar; o imperfeito não exige que se a apresente como mera tentativa.
