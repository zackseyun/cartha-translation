id: GAL.1.17
reference: Galatians 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: pt
  text: Também não subi a Jerusalém para ir aos apóstolos que já o eram antes de mim; mas parti para a Arábia e voltei de novo a Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Também não
  rationale: Retoma e amplia a negação do contexto anterior de modo natural em português.
- source_word: ἀνῆλθον εἰς Ἱεροσόλυμα
  choice: subi a Jerusalém
  rationale: Preserva a maneira convencional e geográfica de falar da viagem a Jerusalém.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: para encontrar os que já eram apóstolos antes de mim
  rationale: Em contexto de viagem, πρός indica dirigir-se a pessoas; “para encontrar” expressa essa finalidade naturalmente. “Já eram... antes de mim” mantém a prioridade temporal sem sugerir superioridade hierárquica.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Marca com clareza o contraste enfático entre não ir a Jerusalém e partir para a Arábia.
- source_word: ἀπῆλθον
  choice: parti
  rationale: Comunica o movimento de afastamento contido no verbo sem tornar a frase pesada.
- source_word: Ἀραβίαν
  choice: Arábia
  rationale: Forma portuguesa consagrada do nome regional, sem delimitar uma extensão territorial que o texto não especifica.
- source_word: πάλιν ὑπέστρεψα
  choice: depois voltei
  rationale: “Voltei” preserva a ideia de retorno; “depois” torna natural a sequência narrativa, embora πάλιν também possa ser vertido por “novamente”.
- source_word: Δαμασκόν
  choice: Damasco
  rationale: Forma portuguesa consagrada do nome da cidade.
theological_decisions:
- issue: Sentido de “antes de mim” a respeito dos apóstolos
  choice: 'prioridade temporal: pessoas que já eram apóstolos antes de Paulo'
  alternative: superioridade de posição ou autoridade em relação a Paulo
  rationale: πρὸ ἐμοῦ indica naturalmente anterioridade temporal. A redação evita transformar essa anterioridade numa afirmação de hierarquia que o versículo não faz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a sequência autobiográfica e o contraste do grego sem excessiva literalidade.
