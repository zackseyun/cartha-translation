id: GAL.1.16
reference: Galatians 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: pt
  text: revelar seu Filho em mim[a], para que eu o anunciasse entre os gentios, não consultei imediatamente carne e sangue[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mim” ou “por meio de mim”.
    reason: alternative_reading
  - marker: b
    text: “Carne e sangue” é uma expressão idiomática que significa um ser humano ou seres humanos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: revelar
  rationale: Mantém o sentido de desvelamento ou manifestação divina e liga-se naturalmente, como infinitivo, ao contexto sintático do versículo anterior.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu Filho
  rationale: É a formulação portuguesa natural que preserva o título filial e sua força cristológica.
- source_word: ἐν ἐμοὶ
  choice: em mim
  rationale: Reproduz formalmente a preposição grega e preserva a ambiguidade entre revelação interior, revelação dirigida a Paulo e revelação por meio dele; as alternativas são registradas em nota.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: para que eu o anunciasse
  rationale: O verbo indica anunciar boas-novas, mas o pronome αὐτόν é objeto direto; “o anunciasse” preserva a formulação marcante de que o próprio Filho é anunciado sem acrescentar “a respeito dele”.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: No contexto paulino, refere-se naturalmente aos povos não judeus; “gentios” comunica esse sentido com precisão.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente corrente e digno para a ideia temporal de algo feito sem demora.
- source_word: οὐ προσανεθέμην
  choice: não consultei
  rationale: O verbo médio expressa consultar ou conferir com alguém; “consultei” é claro no português atual e se ajusta ao complemento seguinte.
- source_word: σαρκὶ καὶ αἵματι
  choice: carne e sangue
  rationale: Conserva a expressão idiomática vívida do grego, enquanto a nota esclarece que ela se refere a seres humanos.
theological_decisions:
- issue: Sentido de ἐν ἐμοὶ na revelação do Filho
  choice: Manter “em mim” no texto principal
  alternative: “a mim” ou “por meio de mim”
  rationale: A construção pode indicar revelação interior, revelação concedida a Paulo ou revelação realizada por meio dele. A tradução não resolve silenciosamente essa tensão, mas conserva a forma mais literal e registra as principais possibilidades em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a pontuação mantêm o caráter de continuação do período iniciado no versículo anterior. A expressão “carne e sangue” e a ambiguidade de “em mim” foram preservadas, com esclarecimentos em notas.
