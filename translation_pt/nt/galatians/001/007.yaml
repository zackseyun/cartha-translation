  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: pt
  text: que não é outro evangelho; mas há algumas pessoas que estão perturbando vocês e querem distorcer[b] o evangelho do Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Cristo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “perverter”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: outro evangelho
  rationale: Embora ἄλλο não repita o substantivo, o referente εὐαγγέλιον vem do contexto imediato. Explicitar “evangelho” torna a frase clara em português sem acrescentar uma nova ideia.
- source_word: εἰ μή
  choice: O que há é
  rationale: Neste contexto, εἰ μή introduz uma ressalva explicativa, não uma condição estrita. A formulação comunica naturalmente que não existe outro evangelho, mas existem pessoas que causam perturbação.
- source_word: ταράσσοντες
  choice: estão perturbando
  rationale: Preserva a ação contínua do particípio e expressa tanto inquietação quanto confusão, em linguagem corrente.
- source_word: θέλοντες
  choice: querem
  rationale: Expressa de modo direto e natural a intenção dos agentes, sem intensificá-la indevidamente.
- source_word: μεταστρέψαι
  choice: distorcer
  rationale: O verbo indica transformar ou alterar algo em sentido corruptor. “Distorcer” é atual, claro e suficientemente forte; “perverter” permanece como alternativa em nota.
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: “Evangelho” é o termo português estabelecido e preserva o sentido técnico da palavra no contexto paulino.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός mantém força titular. “Messias” conserva o enquadramento messiânico judaico da expressão; “Cristo” é indicado como alternativa tradicional.
theological_decisions:
- issue: Χριστοῦ como título ou forma semelhante a nome próprio
  choice: do Messias
  alternative: de Cristo
  rationale: A expressão pode designar o evangelho pertencente ao Messias ou a mensagem a respeito dele. A tradução mantém a força titular sem resolver a ambiguidade do genitivo.
- issue: Relação do genitivo em τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: o evangelho do Messias
  alternative: o evangelho a respeito do Messias
  rationale: O genitivo grego pode indicar origem, pertencimento ou conteúdo. A construção portuguesa “do Messias” preserva essa amplitude em vez de escolher apenas uma relação.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa, de ampla legibilidade brasileira. A ressalva foi reformulada como “O que há é” para evitar uma construção rígida e pouco natural com “a não ser que”, preservando o contraste do grego.
