  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: pt
  text: E glorificavam a Deus por minha causa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «em mim».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples que dá continuidade à narrativa de Paulo.
- source_word: ἐδόξαζον
  choice: glorificavam
  rationale: O verbo δοξάζω significa dar glória ou honra. O pretérito imperfeito português preserva naturalmente o aspecto contínuo ou repetido do imperfeito grego.
- source_word: ἐν ἐμοὶ
  choice: por minha causa
  rationale: 'Embora ἐν signifique literalmente «em», neste contexto a expressão indica a razão da glorificação: as igrejas davam glória a Deus em resposta ao que havia acontecido com Paulo. A alternativa mais literal é preservada em nota.'
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Objeto direto de ἐδόξαζον; esta é a tradução portuguesa habitual e exata.
theological_decisions:
- issue: Sentido de ἐν ἐμοὶ
  choice: 'Sentido causal ou associativo: «por minha causa»'
  alternative: 'Sentido mais literal, locativo ou instrumental: «em mim»'
  rationale: O contexto imediato descreve a reação das igrejas à conversão e ao ministério de Paulo. «Por minha causa» comunica com clareza que glorificavam a Deus em razão do que souberam a respeito dele, enquanto a nota preserva a formulação grega e sua possível amplitude.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O imperfeito «glorificavam» reproduz adequadamente a nuance aspectual do grego.
