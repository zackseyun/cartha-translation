id: GAL.1.15
reference: Galatians 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: pt
  text: Mas, quando aprouve àquele que me separou desde o ventre de minha mãe[a] e me chamou por meio de sua graça
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o nascimento”; compare a linguagem de vocação profética em Jeremias 1:5 e Isaías 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: Preserva o valor temporal de ὅτε e a transição levemente contrastiva de δέ, com formulação natural em português.
- source_word: εὐδόκησεν
  choice: se agradou
  rationale: Expressa a boa vontade ou o beneplácito divino sem reduzir o verbo a uma simples decisão; a oração permanece incompleta porque o período continua no versículo seguinte.
- source_word: ὁ ἀφορίσας με
  choice: aquele que me separou
  rationale: Reproduz o particípio substantivado e o sentido de distinguir ou reservar para uma finalidade, sem explicitar uma doutrina além do texto.
- source_word: ἐκ κοιλίας μητρός μου
  choice: desde o ventre de minha mãe
  rationale: Mantém a imagem concreta e o eco da linguagem de vocação profética. “Desde” comunica bem o ponto de origem indicado por ἐκ neste contexto.
- source_word: καλέσας
  choice: me chamou
  rationale: É a tradução corrente e contextual de καλέω, preservando sem expansão as possíveis dimensões vocacional e salvífica do chamado divino.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: por meio de sua graça
  rationale: Torna explícito e natural o valor instrumental de διά com o genitivo, apresentando a graça como o meio do chamado.
theological_decisions:
- issue: Se ἀφορίσας deve ser traduzido com terminologia que imponha uma doutrina específica de eleição ou predestinação
  choice: me separou
  alternative: me escolheu; me designou
  rationale: O grego apresenta Deus distinguindo ou reservando Paulo, em linguagem que evoca vocações proféticas, mas não exige que se introduza aqui uma formulação doutrinária mais específica.
- issue: Sentido temporal de ἐκ κοιλίας μητρός μου
  choice: desde o ventre de minha mãe
  alternative: desde o nascimento; antes de eu nascer
  rationale: 'A formulação conserva a imagem do original e sua tensão: pode indicar uma separação vinculada à vida desde o ventre, sem definir de modo mais estreito o momento exato.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção termina em “se agradou” porque Gálatas 1:15 continua sintaticamente no versículo 16. O marcador [a] aparece imediatamente após a expressão à qual a nota se refere.
