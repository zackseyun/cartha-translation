- from: Mas, quando aquele que me separou desde o ventre de minha mãe[a] e me chamou por meio de sua graça se agradou
  to: Mas, quando aprouve àquele que me separou desde o ventre de minha mãe[a] e me chamou por meio de sua graça
  rationale: Substituiu-se «aquele que ... se agradou» por «aprouve àquele que...» para refletir com maior precisão e naturalidade a construção de εὐδόκησεν, cuja ação é completada no versículo 16. Não houve alteração de sentido nos demais elementos, nem na nota e em seu marcador.
