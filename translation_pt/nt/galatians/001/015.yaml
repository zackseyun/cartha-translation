review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a progressão temporal-contrastiva de ὅτε δέ, o particípio substantivado, a imagem de ἐκ κοιλίας μητρός μου, o chamado e o valor instrumental de διὰ τῆς χάριτος αὐτοῦ. Contudo, «se agradou» fica sintaticamente pouco natural neste recorte e é menos idiomático para a construção que se completa no versículo 16; «aprouve àquele que...» reproduz bem εὐδόκησεν e prepara diretamente o infinitivo subsequente («revelar»).
  naturalness: «Mas, quando aprouve àquele que...» é uma formulação formal, clara e reconhecível em português bíblico moderno. Embora «aprouve» tenha registro elevado, é mais natural e preciso neste período do que deixar «aquele que ... se agradou» antes da continuação sintática no versículo seguinte.
  terminology: «Me separou», «desde o ventre de minha mãe», «me chamou» e «por meio de sua graça» são adequados e não impõem uma leitura doutrinária além do texto. A nota mantém corretamente a alternativa mais interpretativa («desde o nascimento») distinta da imagem concreta do texto.
  issues:
  - severity: medium
    issue: «se agradou» é uma realização pouco idiomática de εὐδόκησεν neste período interrompido pela divisão de versículos.
    rationale: O verbo grego introduz o que Deus se agradou de fazer, completado pelo infinitivo no v. 16. Em português, «aprouve àquele que...» preserva essa estrutura e evita a impressão de que falta um complemento obrigatório ou de que «se agradou» seja meramente reflexivo.
  revised_text: Mas, quando aprouve àquele que me separou desde o ventre de minha mãe[a] e me chamou por meio de sua graça
  revised_footnotes:
