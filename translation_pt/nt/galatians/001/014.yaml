  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: pt
  text: E progredia no judaísmo mais do que muitos dos meus contemporâneos entre o meu povo, sendo muito mais zeloso pelas tradições dos meus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέκοπτον
  choice: progredia
  rationale: O imperfeito indica progresso contínuo no passado; “progredia” conserva o sentido sem acrescentar a ideia de êxito excepcional.
- source_word: Ἰουδαϊσμῷ
  choice: judaísmo
  rationale: É a forma concisa e corrente para o sistema religioso e modo de vida judaico mencionado no contexto.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: mais do que muitos dos meus contemporâneos
  rationale: ὑπέρ tem valor comparativo, e συνηλικιώτας designa pessoas da mesma faixa etária; a formulação é clara e natural em português.
- source_word: ἐν τῷ γένει μου
  choice: entre o meu povo
  rationale: γένος pode indicar povo, grupo étnico ou nação; “meu povo” comunica a referência étnico-social sem as ambiguidades modernas de “raça”.
- source_word: περισσοτέρως
  choice: muito mais
  rationale: Preserva a intensificação comparativa do zelo de Paulo em português idiomático.
- source_word: ζηλωτὴς ὑπάρχων
  choice: sendo muito mais zeloso
  rationale: Mantém a construção participial e o sentido de dedicação fervorosa, sem sugerir necessariamente filiação ao movimento político dos zelotes.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: pelas tradições dos meus antepassados
  rationale: πατρικός refere-se ao que vem dos pais ou ancestrais; “antepassados” preserva o caráter herdado das tradições em linguagem moderna e inclusiva quanto às gerações ancestrais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha de perto o grego, mas evita rigidez; “judaísmo” mantém a amplitude contextual do termo sem explicação interpretativa no corpo do versículo.
