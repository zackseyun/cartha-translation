  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: pt
  text: Mas eu não era conhecido pessoalmente[a] pelas igrejas da Judeia que estão no Messias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não era conhecido de vista” ou “não me conheciam pessoalmente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em Cristo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao que vem antes; “Mas” reproduz naturalmente esse movimento.
- source_word: ἤμην … ἀγνοούμενος
  choice: eu não era conhecido
  rationale: A construção perifrástica indica que Paulo permanecia desconhecido, sem acrescentar ao texto a ideia explícita de “ainda”.
- source_word: τῷ προσώπῳ
  choice: pessoalmente
  rationale: O dativo é idiomático e indica falta de contato ou reconhecimento pessoal; “pessoalmente” comunica isso em português natural.
- source_word: ἐκκλησίαις
  choice: igrejas
  rationale: No contexto paulino, refere-se às comunidades cristãs; “igrejas” é a forma corrente e clara em português.
- source_word: Ἰουδαίας
  choice: Judeia
  rationale: Emprega o nome geográfico tradicional e amplamente reconhecido em português.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός conserva aqui sua força de título, e a expressão identifica as igrejas por sua relação e união com o Messias.
theological_decisions:
- issue: Tradução de Χριστῷ em ἐν Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: “Messias” torna audível o valor titular de Χριστός sem explicar além do texto. “Cristo” é mantido em nota como a tradução tradicional possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita o literalismo pouco natural “desconhecido de rosto”, mas preserva em nota a nuance visual ou presencial da expressão grega. A vírgula final acompanha a continuidade sintática do versículo no contexto.
