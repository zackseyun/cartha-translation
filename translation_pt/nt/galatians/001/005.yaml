id: GAL.1.5
reference: Galatians 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/005.yaml
  text: to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: a quem seja a glória para todo o sempre. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: a quem
  rationale: O pronome relativo no dativo introduz naturalmente a doxologia e retoma o antecedente imediato, «nosso Deus e Pai», no versículo anterior.
- source_word: ἡ δόξα
  choice: a glória
  rationale: «Glória» é a tradução consagrada e adequada ao contexto doxológico, preservando a dignidade e a amplitude do termo grego.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: A expressão idiomática grega intensifica a ideia de duração sem fim; «para todo o sempre» comunica isso de modo natural, solene e amplamente compreensível em português.
- source_word: ἀμήν
  choice: Amém
  rationale: A transliteração tradicional funciona em português como afirmação solene que encerra a doxologia.
theological_decisions:
- issue: Sentido verbal implícito na doxologia
  choice: a quem seja a glória
  alternative: a quem pertence a glória; a quem é a glória
  rationale: O grego não traz verbo expresso. «Seja» preserva a força volitiva e litúrgica da doxologia sem transformar explicitamente a frase numa afirmação de posse, embora essa possibilidade esteja implícita.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formulação doxológica tradicional. A escolha «para todo o sempre» evita o literalismo pouco idiomático de «pelos séculos dos séculos» sem enfraquecer a ideia de eternidade.
