  verdict: revise
  source_fidelity: A construção condicional e a inclusão enfática de «nós mesmos» são bem preservadas. Contudo, em Gl 1:8, παρ’ ὃ, no contexto da advertência de Paulo, comunica mais claramente oposição/desvio em relação à mensagem anteriormente anunciada do que mera diferença neutra. «Contrárias ao que» traduz melhor essa força, mantendo «além do que» como alternativa em nota.
  naturalness: «Mas, ainda que nós mesmos ou um anjo vindo do céu...» é natural e solene. A revisão mantém leitura brasileira ampla e melhora a relação entre a mensagem anunciada e a mensagem anterior. «Sob maldição» é mais idiomático do que «debaixo de maldição» na nota.
  terminology: «Boas-novas» representa de modo transparente o verbo εὐαγγελίζομαι, e «seja amaldiçoado» preserva a gravidade de ἀνάθεμα ἔστω sem impor o sentido técnico posterior de excomunhão.
  issues:
