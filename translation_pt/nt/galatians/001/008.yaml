    issue: «diferentes daquelas que lhes anunciamos» enfraquece a força contextual de παρ’ ὃ.
    rationale: Embora παρά possa admitir a noção de diferença ou de ir além, nesta advertência polêmica o sentido de oposição à mensagem antes anunciada é o mais adequado como texto principal. As demais nuances podem ser preservadas em nota.
  - severity: low
    issue: A alternativa «fique debaixo de maldição» é pouco idiomática.
    rationale: «Fique sob maldição» é formulação portuguesa mais natural, sem mudança de sentido.
