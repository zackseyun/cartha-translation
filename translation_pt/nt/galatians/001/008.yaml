id: GAL.1.8
reference: Galatians 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: pt
  text: Mas, ainda que nós mesmos ou um anjo vindo do céu anuncie a vocês boas-novas contrárias ao que lhes anunciamos, seja amaldiçoado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “boas-novas diferentes das que lhes anunciamos” ou “boas-novas além do que lhes anunciamos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seja anátema” ou “fique sob maldição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Mas, ainda que
  rationale: Preserva a força adversativa de ἀλλά, a ênfase de καί e o caráter condicional de ἐάν em português natural.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: nós mesmos ou um anjo vindo do céu
  rationale: “Nós mesmos” explicita a ênfase do pronome grego, enquanto “vindo do céu” comunica naturalmente a origem expressa por ἐξ οὐρανοῦ.
- source_word: εὐαγγελίζηται
  choice: anuncie ... boas-novas
  rationale: Traduz o verbo grego de maneira transparente, sem substituí-lo necessariamente pelo substantivo técnico “evangelho”.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Forma amplamente compreensível no português moderno e de leitura natural no Brasil.
- source_word: παρ’ ὃ
  choice: diferentes daquelas que
  rationale: Preserva a amplitude de παρά, que neste contexto pode indicar diferença, desvio ou oposição, sem limitar a formulação principal ao sentido mais estrito de contrariedade.
- source_word: εὐηγγελισάμεθα
  choice: lhes anunciamos
  rationale: Mantém a ligação lexical com o primeiro verbo, evitando em português a repetição pesada de “anunciar boas-novas” duas vezes.
- source_word: ἀνάθεμα ἔστω
  choice: seja amaldiçoado
  rationale: Comunica com clareza e solenidade a fórmula de maldição, sem impor o sentido eclesiástico técnico que “anátema” pode adquirir.
theological_decisions:
- issue: Sentido da fórmula ἀνάθεμα ἔστω
  choice: seja amaldiçoado
  alternative: seja anátema; fique debaixo de maldição
  rationale: A tradução conserva a força real e judicial da declaração de Paulo, sem reduzi-la a uma fórmula técnica de excomunhão nem acrescentar explicitamente quem executa a maldição.
- issue: Relação entre a mensagem alternativa e a mensagem apostólica
  choice: boas-novas diferentes daquelas que lhes anunciamos
  alternative: boas-novas contrárias às que lhes anunciamos; boas-novas além daquilo que lhes anunciamos
  rationale: παρά admite nuances contextuais de diferença, desvio e oposição. A redação principal preserva essa abertura, e a nota registra alternativas mais específicas.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. “Boas-novas” mantém transparência em relação ao verbo grego; “nós mesmos” conserva a ênfase paulina; as notas preservam as ambiguidades lexicais relevantes de παρά e ἀνάθεμα.
