  source_fidelity: 'O texto traduz com precisão a negação dupla: Paulo não recebeu a mensagem de fonte humana nem a aprendeu por instrução humana. “Por meio de uma revelação” reproduz adequadamente o valor instrumental de διὰ ἀποκαλύψεως. A repetição de “o recebi” torna explícito em português o objeto que permanece implícito na última oração grega, sem alterar o sentido.'
  naturalness: O português é moderno, claro e natural para leitura internacional com boa legibilidade brasileira. “Não o recebi de nenhum ser humano” é uma construção negativa idiomática; “nem me foi ensinado” mantém uma formulação direta e digna. A repetição verbal final é ligeiramente mais explícita que o grego, mas evita uma oração adversativa elíptica e pouco fluente em português.
  terminology: “Jesus, o Messias” traduz Ἰησοῦ Χριστοῦ de modo apropriado, tratando Messias como título. A formulação “revelação de Jesus, o Messias” conserva, na medida do possível em português, a abertura do genitivo grego. A nota apresenta de modo equilibrado as leituras de conteúdo e de fonte, sem impor uma decisão teológica.
