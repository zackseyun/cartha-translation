id: GAL.1.12
reference: Galatians 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: pt
  text: Pois eu não o recebi de nenhum ser humano, nem me foi ensinado, mas o recebi por meio de uma revelação de Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de uma revelação a respeito de Jesus, o Messias”. A expressão também pode indicar uma revelação vinda de Jesus, o Messias.'
    reason: O genitivo grego pode designar tanto o conteúdo da revelação quanto sua fonte.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: de nenhum ser humano
  rationale: O singular genérico ἀνθρώπου nega qualquer origem ou mediação humana. A formulação é natural em português e não sugere um indivíduo específico.
- source_word: παρέλαβον
  choice: recebi
  rationale: O verbo descreve o recebimento de algo transmitido, aqui o evangelho mencionado no contexto. “Recebi” mantém o sentido e a ligação pronominal com o antecedente.
- source_word: ἐδιδάχθην
  choice: me foi ensinado
  rationale: A construção conserva a voz passiva e expressa com clareza que Paulo não aprendeu a mensagem por instrução recebida de outra pessoa.
- source_word: δι’ ἀποκαλύψεως
  choice: por meio de uma revelação
  rationale: διά com o genitivo indica o meio pelo qual Paulo recebeu a mensagem; “uma revelação” também preserva o caráter concreto do acontecimento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: A preposição portuguesa “de” acompanha de perto o genitivo grego e evita decidir no texto principal se Jesus é a fonte ou o conteúdo da revelação. “O Messias” traduz Χριστός como título de modo idiomático.
theological_decisions:
- issue: Valor do genitivo em ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: “uma revelação de Jesus, o Messias”, preservando no texto a abertura do genitivo
  alternative: “uma revelação a respeito de Jesus, o Messias” ou “uma revelação vinda de Jesus, o Messias”
  rationale: O genitivo pode indicar que Jesus concede a revelação ou que ele é o conteúdo revelado. O contexto ressalta a origem não humana do evangelho, mas a gramática não elimina a leitura objetiva; por isso, o texto mantém a formulação aberta e a nota explicita a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “o recebi” na oração final torna explícito o objeto elíptico do grego e evita que “mas por meio” soe fragmentário em português.
