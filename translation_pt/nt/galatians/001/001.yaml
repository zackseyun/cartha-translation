id: GAL.1.1
reference: Galatians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: pt
  text: Paulo, apóstolo — não da parte de seres humanos nem por meio de um ser humano, mas por meio de Jesus, o Messias,[a] e de Deus Pai, que o ressuscitou dentre os mortos —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”.'
    reason: Alternativa lexical tradicional para Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o título reconhecido de alguém comissionado e seu peso no modo como Paulo se apresenta, sem reduzi-lo ao sentido genérico de mensageiro.
- source_word: ἀπ’ ἀνθρώπων
  choice: da parte de seres humanos
  rationale: A preposição ἀπό com o genitivo indica origem ou procedência. A formulação mantém o plural e o contraste retórico com o singular seguinte, sem restringir desnecessariamente o termo grego a pessoas do sexo masculino.
- source_word: δι’ ἀνθρώπου
  choice: por meio de um ser humano
  rationale: διά com o genitivo indica mediação ou agência. O singular foi mantido para preservar o contraste deliberado com o plural anterior.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: A repetição de διά contrapõe a mediação verdadeira de Jesus à agência humana negada. O aposto com artigo torna natural em português o valor titular de Χριστός.
- source_word: θεοῦ πατρὸς
  choice: Deus Pai
  rationale: É a forma titular corrente, clara e digna em português, coordenada com Jesus como agente da comissão apostólica.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: que o ressuscitou dentre os mortos
  rationale: A oração relativa modifica Deus Pai. “Ressuscitou dentre os mortos” expressa de modo idiomático tanto o ato de levantar Jesus como sua saída do domínio dos mortos.
theological_decisions:
- issue: Sentido de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Neste contexto, Χριστός conserva valor titular perceptível. A tradução principal explicita esse valor, enquanto a forma tradicional é registrada em nota sem eliminar a alternativa lexical legítima.
- issue: Agência expressa por διά na comissão de Paulo
  choice: por meio de Jesus, o Messias, e de Deus Pai
  alternative: por Jesus, o Messias, e por Deus Pai
  rationale: “Por meio de” conserva a noção de mediação ou agência e sua coordenação com Deus Pai, sem transformar a frase em uma afirmação mais específica sobre a relação interna entre ambos.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Os travessões refletem a interrupção enfática da saudação e deixam o versículo aberto para sua continuação. “Seres humanos” preserva o sentido amplo de ἄνθρωπος e mantém o contraste plural–singular.
