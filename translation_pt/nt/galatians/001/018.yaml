source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: pt
  text: Depois, passados três anos, subi a Jerusalém para conhecer pessoalmente Cefas[a], e permaneci com ele quinze dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cefas é o nome aramaico de Pedro.
    reason: identificação do nome
lexical_decisions:
- source_word: Ἔπειτα
  choice: Depois
  rationale: Marca o acontecimento seguinte na sequência narrativa de Paulo de modo natural em português.
- source_word: μετὰ ἔτη τρία
  choice: passados três anos
  rationale: Expressa com clareza o intervalo temporal e preserva a relação com o acontecimento anterior, sem determinar de modo indevido a forma de contagem dos anos.
- source_word: ἀνῆλθον
  choice: subi
  rationale: Preserva a ideia de subida associada à viagem a Jerusalém e é uma formulação bíblica natural em português.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: Emprega a forma corrente do nome da cidade e expressa o destino do movimento.
- source_word: ἱστορῆσαι
  choice: para conhecer pessoalmente
  rationale: O verbo raro indica contato pessoal para conhecer alguém, sentido mais específico que uma visita casual; a formulação permanece natural e evita sugerir uma investigação formal.
- source_word: Κηφᾶν
  choice: Cefas
  rationale: Conserva o nome aramaico empregado por Paulo, em vez de harmonizá-lo silenciosamente com Pedro.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: permaneci com ele
  rationale: Comunica a permanência junto de Cefas durante o período indicado, em registro digno e claro.
- source_word: ἡμέρας δεκαπέντε
  choice: quinze dias
  rationale: O acusativo grego indica duração; em português, o sentido fica claro com o verbo 'permaneci'.
theological_decisions:
- issue: Identidade de Cefas
  choice: Manter 'Cefas' no texto e esclarecer sua identidade em nota
  alternative: Substituir por 'Pedro' no texto
  rationale: Paulo usa especificamente Κηφᾶς; preservar essa forma evita harmonização e a nota fornece ao leitor a identificação necessária.
- issue: Finalidade da ida de Paulo a Jerusalém
  choice: Traduzir ἱστορῆσαι como 'conhecer pessoalmente'
  alternative: '''visitar'' ou ''obter informações de'''
  rationale: A escolha preserva o encontro pessoal indicado pelo verbo sem afirmar que Paulo foi receber instrução doutrinária de Cefas nem reduzir o sentido a uma visita social.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada à fluência do português, mantendo a sequência e as nuances do grego. O único marcador de nota aparece imediatamente após 'Cefas'.
