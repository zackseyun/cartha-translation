id: GAL.1.6
reference: Galatians 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: pt
  text: Espanta-me que vocês estejam abandonando tão depressa aquele que os chamou na graça do Messias, em favor de um evangelho diferente.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela graça do Messias”. A preposição grega pode indicar esfera ou meio.'
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Cristo”; aqui traduzido como “Messias” porque o termo funciona como título.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para outro evangelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Estou admirado
  rationale: Expressa em português atual a forte surpresa e desaprovação de Paulo, sem recorrer a uma formulação excessivamente rara.
- source_word: οὕτως ταχέως
  choice: tão depressa
  rationale: Preserva a ênfase na rapidez surpreendente da mudança dos gálatas.
- source_word: μετατίθεσθε
  choice: estejam abandonando
  rationale: O presente sugere um processo em curso, e o contexto indica deserção relacional, não apenas mudança intelectual.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: aquele que os chamou
  rationale: Mantém implícita a identidade de quem chamou, como no grego, e conserva a referência ao chamado anterior.
- source_word: ἐν χάριτι Χριστοῦ
  choice: na graça do Messias
  rationale: Representa de modo transparente ἐν com o dativo e preserva a possibilidade de esfera ou meio.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o conteúdo titular de Χριστός em linguagem clara, em vez de apenas transliterá-lo como nome.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: voltando-se para um evangelho diferente
  rationale: Torna natural em português o movimento expresso por εἰς e distingue ἕτερον como algo de caráter diferente, antecipando o contraste do versículo seguinte.
theological_decisions:
- issue: Identidade daquele que chamou os gálatas
  choice: aquele que os chamou
  alternative: Deus, que os chamou; Cristo, que os chamou
  rationale: O sujeito permanece implícito no texto grego; a tradução evita resolver no corpo do versículo uma questão que o original deixa aberta.
- issue: Relação expressa por ἐν em ἐν χάριτι Χριστοῦ
  choice: na graça do Messias
  alternative: pela graça do Messias
  rationale: A formulação principal preserva a noção de esfera, enquanto a nota registra a leitura instrumental legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “estou admirado” preserva o tom de choque, e “voltando-se” explicita naturalmente a direção de εἰς sem suavizar a acusação de abandono.
