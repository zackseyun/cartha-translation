  source_fidelity: A tradução representa adequadamente o espanto de Paulo, a rapidez da mudança, a deserção daquele que chamou os destinatários, a expressão ambígua «na graça do Messias» e o movimento para um evangelho diferente. «Voltando-se» comunica bem εἰς, mas a construção atual acrescenta uma segunda ação coordenada onde o grego emprega um único verbo de mudança/deserção orientado para outro evangelho.
  naturalness: «Estou admirado de que» é compreensível, mas soa menos idiomático e pode sugerir admiração positiva. «Espanta-me que» é uma formulação moderna, natural e preserva melhor o tom de censura e perplexidade. A reformulação também integra a direção expressa por εἰς sem duplicar verbalmente a ação.
  terminology: «Messias» preserva com acerto o valor titular de Χριστός, conforme a política fornecida. «Evangelho diferente» traduz bem ἕτερον e deixa para o versículo seguinte o desenvolvimento do contraste. As notas são pertinentes e seus marcadores permanecem corretamente ancorados.
