  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: pt
  text: Quanto ao que estou escrevendo a vocês, eis que, diante de Deus, não estou mentindo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ δὲ
  choice: Quanto ao que
  rationale: A expressão introduz como tópico o conteúdo escrito e comunica a transição leve de δέ sem criar um contraste forte nem acrescentar uma referência temporal.
- source_word: γράφω ὑμῖν
  choice: estou escrevendo a vocês
  rationale: O presente progressivo é natural no contexto da carta, e «a vocês» identifica claramente os destinatários em português moderno de ampla compreensão.
- source_word: ἰδοὺ
  choice: afirmo[a]
  rationale: A partícula chama atenção e dá ênfase solene à declaração. Neste contexto, «afirmo» transmite essa força com naturalidade, enquanto a nota registra a forma mais literal.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Preserva de modo conciso a ideia de estar na presença de Deus e de responder perante ele.
- source_word: ὅτι οὐ ψεύδομαι
  choice: que não estou mentindo
  rationale: ὅτι introduz o conteúdo da afirmação, e a forma progressiva comunica de maneira direta a negação presente de Paulo.
theological_decisions:
- issue: Força do apelo de Paulo a Deus
  choice: A frase é apresentada como uma afirmação solene feita diante de Deus.
  alternative: Entendê-la apenas como ênfase retórica, sem sentido de prestação de contas perante Deus.
  rationale: ἐνώπιον τοῦ θεοῦ reforça a veracidade da declaração ao colocar Paulo diante de Deus, mas a tradução evita transformá-la numa fórmula explícita de juramento que o grego não enuncia.
translation_notes:
  register: Português moderno, digno e claro, com «a vocês» para ampla legibilidade brasileira. «Afirmo» evita o tom arcaico de «eis» no texto principal, enquanto a nota preserva a forma e a força da partícula grega.
