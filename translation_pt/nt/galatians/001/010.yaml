id: GAL.1.10
reference: Galatians 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s slave.
translation:
  language: pt
  text: Pois será que agora estou persuadindo pessoas[a] ou Deus? Ou procuro agradar às pessoas? Se eu ainda agradasse às pessoas, não seria escravo do Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou agora buscando a aprovação das pessoas ou a de Deus?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo de Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: agora
  rationale: Expressa de modo natural a situação presente de Paulo, em possível contraste com sua conduta anterior.
- source_word: πείθω
  choice: estou persuadindo
  rationale: Mantém o sentido lexical direto de persuadir, embora a construção com Deus seja incomum; a nota registra a alternativa contextual ligada à busca de aprovação.
- source_word: ἀνθρώπους
  choice: as pessoas
  rationale: Refere-se aos seres humanos em geral, sem limitar o sentido ao sexo masculino.
- source_word: ζητῶ
  choice: procuro
  rationale: Forma atual e natural que preserva a ideia de empenhar-se em alcançar determinado objetivo.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: agradar / agradasse
  rationale: Reproduz diretamente o verbo grego e mantém a ligação verbal entre a pergunta e a condição posterior.
- source_word: εἰ ἔτι
  choice: Se eu ainda
  rationale: Preserva tanto a condição contrária ao fato sugerida pelo contexto quanto a ideia de continuidade de uma conduta anterior.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o título Χριστός por seu sentido, destacando a identidade e autoridade messiânicas daquele a quem Paulo pertence.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a força de pertencimento, submissão e lealdade exclusiva expressa por δοῦλος no contraste com agradar às pessoas.
theological_decisions:
- issue: Sentido de πείθω na pergunta retórica
  choice: estou persuadindo as pessoas ou a Deus?
  alternative: estou buscando a aprovação das pessoas ou a de Deus?
  rationale: A tradução principal conserva o valor verbal mais direto e a tensão da construção grega; a nota oferece o sentido contextual possível sem decidir silenciosamente entre as leituras.
- issue: Tradução de Χριστοῦ δοῦλος
  choice: escravo do Messias
  alternative: servo de Cristo
  rationale: A formulação principal preserva tanto o valor titular de Χριστός quanto a ideia forte de pertencimento em δοῦλος; a alternativa mais tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A primeira pergunta conserva deliberadamente a formulação incomum do grego, enquanto a nota esclarece a principal alternativa contextual.
