  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: pt
  text: Portanto, os que são da fé são abençoados juntamente com Abraão, o fiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abraão, o que crê” ou “Abraão, o crente”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior.
- source_word: οἱ ἐκ πίστεως
  choice: os que são da fé
  rationale: Preserva a construção grega e sua força de caracterização, sem reduzi-la simplesmente a uma ação pontual de crer.
- source_word: πίστεως
  choice: fé
  rationale: Neste contexto, designa a fé que caracteriza esse grupo e corresponde ao eixo do argumento sobre Abraão.
- source_word: εὐλογοῦνται
  choice: são abençoados
  rationale: Mantém a voz passiva e o presente, destacando a bênção recebida.
- source_word: σὺν
  choice: juntamente com
  rationale: Comunica claramente a participação conjunta na bênção.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Abraão, o fiel
  rationale: Conserva no texto principal o sentido possível de fidelidade e reproduz com clareza a qualificação articulada do nome, enquanto a nota registra a leitura contextual ligada ao ato de crer.
theological_decisions:
- issue: Sentido de πιστός aplicado a Abraão em um contexto centrado na fé
  choice: Abraão, o fiel
  alternative: Abraão, o que crê; Abraão, o crente
  rationale: πιστός pode indicar tanto alguém fiel quanto alguém que crê. O contexto imediato favorece uma associação com a fé de Abraão, mas a tradução principal não elimina a nuance de fidelidade; a alternativa é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém deliberadamente a repetição conceitual entre “fé” e a descrição de Abraão, bem como a ambiguidade de πιστός.
