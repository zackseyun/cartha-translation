id: GAL.3.11
reference: Galatians 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: pt
  text: É evidente que ninguém é justificado diante de Deus pela lei, pois “o justo viverá pela fé”[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o justo viverá pela fidelidade”.'
    reason: lexical_alternative
  - marker: b
    text: Paulo cita Habacuque 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: É evidente que
  rationale: O δέ marca uma transição leve no argumento; em português, o fluxo é natural sem um conectivo inicial explícito, enquanto ὅτι introduz a afirmação ligada a δῆλον.
- source_word: ἐν νόμῳ
  choice: pela lei
  rationale: Neste argumento jurídico, ἐν pode indicar meio ou esfera; “pela lei” comunica com clareza o meio pelo qual ninguém é justificado.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Preserva de modo natural a negação universal.
- source_word: δικαιοῦται
  choice: é justificado
  rationale: Mantém o sentido forense paulino e a terminologia bíblica corrente, sem transformar a tradução em explicação.
- source_word: παρὰ τῷ θεῷ
  choice: diante de Deus
  rationale: Expressa a posição da pessoa perante o juízo de Deus e conserva a nuance jurídica.
- source_word: δῆλον
  choice: É evidente
  rationale: Representa adequadamente o predicativo impessoal e o tom argumentativo.
- source_word: Ὁ δίκαιος
  choice: o justo
  rationale: É a forma substantivada natural em português e preserva a concisão da citação.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: É uma tradução idiomática e tradicional de πίστις neste contexto; a possibilidade lexical “fidelidade” é preservada em nota.
- source_word: ζήσεται
  choice: viverá
  rationale: Reproduz diretamente o futuro e soa natural no português contemporâneo.
theological_decisions:
- issue: Sentido e ligação sintática de Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: “o justo viverá pela fé”
  alternative: “o justo viverá pela fidelidade” ou “aquele que é justo pela fé viverá”
  rationale: O texto principal conserva a leitura mais direta e tradicional sem decidir silenciosamente todas as possibilidades de πίστις ou da ligação de ἐκ πίστεως; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi ajustada para que a nota de referência acompanhe “lei” conforme o material fornecido, enquanto a alternativa lexical acompanha diretamente “fé”.
