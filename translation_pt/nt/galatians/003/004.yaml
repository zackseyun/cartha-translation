id: GAL.3.4
reference: Galatians 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: pt
  text: Vocês sofreram tantas coisas em vão? Se é que realmente foi em vão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês experimentaram tantas coisas em vão?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: tantas coisas
  rationale: Preserva o neutro plural e abrange de modo natural tudo o que os gálatas haviam enfrentado.
- source_word: ἐπάθετε
  choice: sofreram
  rationale: Embora o verbo também possa significar de modo mais amplo “experimentaram”, “sofreram” expressa melhor seu sentido provável no contexto; a alternativa é registrada em nota.
- source_word: εἰκῇ
  choice: em vão
  rationale: Expressa com precisão a ideia de inutilidade ou falta de resultado e permite conservar a repetição retórica.
- source_word: εἴ γε
  choice: se é que
  rationale: Mantém a qualificação cautelosa e retórica de Paulo sem transformar a condição em afirmação definitiva.
- source_word: καὶ
  choice: realmente
  rationale: Neste contexto, reforça idiomaticamente a ressalva; “realmente” transmite essa ênfase em português natural.
theological_decisions:
- issue: A ressalva final sobre a possível inutilidade do sofrimento
  choice: Se é que realmente foi em vão
  alternative: se de fato foi mesmo em vão
  rationale: 'A formulação conserva a tensão do grego: Paulo levanta a possibilidade de inutilidade, mas a ressalva sugere que ele não a considera necessariamente consumada.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O pronome “vocês” explicita o sujeito plural. A repetição de “em vão” preserva a força retórica do original.
