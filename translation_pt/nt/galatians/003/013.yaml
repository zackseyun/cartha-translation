id: GAL.3.13
reference: Galatians 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: pt
  text: 'O Messias nos resgatou da maldição da lei, tornando-se maldição por nós[a], pois está escrito: “Maldito todo aquele que é pendurado numa árvore.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em nosso favor”; possivelmente “em nosso lugar”.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega pode significar “madeira”, “objeto de madeira” ou “árvore”. Aqui, “árvore” preserva a linguagem da citação bíblica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: O Messias
  rationale: Traduz o título grego em vez de apenas transliterá-lo; neste contexto, sua força titular permanece perceptível.
- source_word: ἐξηγόρασεν
  choice: resgatou
  rationale: Expressa libertação mediante preço e soa natural em português, preservando a dimensão comercial e salvífica do verbo.
- source_word: κατάρας
  choice: maldição
  rationale: Mantém de modo direto o peso jurídico e pactual do substantivo grego.
- source_word: τοῦ νόμου
  choice: da lei
  rationale: Reproduz naturalmente o genitivo; o contexto aponta para a lei mosaica, sem que seja necessário explicitar isso no texto.
- source_word: γενόμενος
  choice: tornando-se
  rationale: Preserva a relação participial e permite compreender o ato como o meio pelo qual o resgate ocorreu, sem tornar essa relação mais explícita do que o grego.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Conserva a amplitude de ὑπέρ, podendo comunicar benefício, representação e, conforme o contexto, substituição, sem impor apenas uma dessas nuances.
- source_word: κατάρα
  choice: maldição
  rationale: Preserva a formulação forte e surpreendente de Paulo, em vez de suavizá-la com o adjetivo 'amaldiçoado'.
- source_word: ὅτι γέγραπται
  choice: pois está escrito
  rationale: Introduz naturalmente a fundamentação escriturística; pode ter valor explicativo ou causal no contexto.
- source_word: Ἐπικατάρατος
  choice: Maldito
  rationale: Equivalente corrente e forte, adequado à linguagem de uma citação bíblica.
- source_word: κρεμάμενος
  choice: é pendurado
  rationale: A forma passiva é idiomática em português e se ajusta ao sentido do texto citado, referente a alguém suspenso num suporte de madeira.
- source_word: ξύλου
  choice: madeiro
  rationale: Designa aqui um objeto de madeira e preserva a formulação tradicional da citação de Deuteronômio, além de sua associação contextual com a execução de Jesus.
theological_decisions:
- issue: Alcance de ὑπὲρ ἡμῶν na linguagem da expiação
  choice: por nós
  alternative: em nosso favor; em nosso lugar
  rationale: A expressão afirma benefício e representação, mas ὑπέρ, por si só, não exige que a tradução principal escolha exclusivamente um modelo substitutivo. 'Por nós' preserva a tensão e a amplitude.
- issue: Sentido de γενόμενος κατάρα
  choice: tornando-se maldição
  alternative: tornando-se maldito
  rationale: O grego usa um substantivo predicativo, não um adjetivo. A tradução mantém deliberadamente a força da afirmação sem explicar de que modo Cristo se tornou 'maldição'.
- issue: Relação lógica de ὅτι γέγραπται com a afirmação anterior
  choice: pois está escrito
  alternative: porque está escrito
  rationale: '''Pois'' permite que a citação funcione como fundamento explicativo sem fixar de modo excessivo uma causalidade estrita.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'O Messias' torna o título inteligível; 'resgatou' evita um tecnicismo desnecessário; 'madeiro' conserva o tom escriturístico e a conexão intertextual sem empregar uma formulação artificial.
