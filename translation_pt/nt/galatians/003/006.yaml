  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: pt
  text: Assim como Abraão creu em Deus, e isso lhe foi atribuído como justiça[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: Alternativa lexical para δικαιοσύνη; “justiça” e “retidão” ressaltam aspectos sobrepostos do termo grego.
lexical_decisions:
- source_word: καθὼς
  choice: Assim como
  rationale: Introduz a comparação com Abraão e preserva a força argumentativa da expressão grega.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: creu em Deus
  rationale: Expressa de modo natural em português que Abraão aceitou como verdadeiro o que Deus lhe disse, sem ampliar o texto com uma explicação interpretativa.
- source_word: ἐλογίσθη αὐτῷ
  choice: isso lhe foi atribuído
  rationale: A voz passiva e o dativo são preservados; “atribuído” comunica com clareza a ideia de considerar ou creditar algo a alguém.
- source_word: εἰς δικαιοσύνην
  choice: como justiça
  rationale: Mantém a formulação concisa e a ambiguidade teológica do termo paulino δικαιοσύνη, sem especificar indevidamente se se trata de condição, reconhecimento ou resultado.
theological_decisions:
- issue: Sentido de δικαιοσύνη na citação paulina
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é a correspondência portuguesa mais direta e tradicional para δικαιοσύνη e preserva a amplitude forense, relacional e ética do termo. “Retidão” é registrada como alternativa lexical possível.
- issue: Referente implícito de ἐλογίσθη
  choice: isso lhe foi atribuído
  alternative: a fé lhe foi atribuída
  rationale: O grego não declara explicitamente o sujeito do verbo passivo. “Isso” retoma o ato de crer sem inserir no corpo do texto o substantivo “fé”, que não aparece neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o raciocínio continua sintaticamente no versículo seguinte.
