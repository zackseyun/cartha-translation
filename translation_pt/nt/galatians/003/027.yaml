  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: pt
  text: Pois todos vocês que foram batizados em Cristo se revestiram de Cristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Messias [...] do Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: todos vocês que
  rationale: Expressa naturalmente em português a abrangência correlativa de ὅσοι e torna explícita a referência aos destinatários, já indicada pela segunda pessoa do plural.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior.
- source_word: εἰς
  choice: em
  rationale: Na expressão portuguesa consagrada «batizados em Cristo», preserva a ideia relacional e incorporativa de εἰς sem impor uma explicação doutrinária adicional.
- source_word: Χριστόν
  choice: Cristo
  rationale: «Cristo» é o título bíblico corrente e amplamente compreensível em português; mantém a mesma forma nas duas ocorrências para preservar a repetição enfática do grego.
- source_word: ἐβαπτίσθητε
  choice: foram batizados
  rationale: Conserva a voz passiva e evita definir um modo específico de batismo.
- source_word: ἐνεδύσασθε
  choice: se revestiram de
  rationale: Reproduz com naturalidade e dignidade a metáfora de vestir-se, bem como a forma média do verbo grego.
theological_decisions:
- issue: Se a formulação batismal deve implicar uma teologia sacramental ou um modo específico de batismo.
  choice: foram batizados em Cristo
  alternative: foram imersos em Cristo; foram batizados com referência a Cristo
  rationale: A formulação conserva a relação incorporativa expressa pelo grego, mas não decide debates posteriores sobre eficácia sacramental ou modo físico.
- issue: Como representar Χριστός neste contexto.
  choice: Cristo
  alternative: Messias
  rationale: Em português, «Cristo» funciona naturalmente como título e designação reconhecida; a nota registra «Messias» como equivalente sem alterar a repetição do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de «Cristo» e a metáfora de revestir-se foram preservadas; evitou-se linguagem que determinasse uma doutrina batismal específica.
