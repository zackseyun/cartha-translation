id: GAL.3.25
reference: Galatians 3:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: pt
  text: Mas, agora que a fé chegou[a], já não estamos sob um guardião[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agora que veio a fé”.'
    reason: alternative_reading
  - marker: b
    text: O termo grego se refere a um guardião ou supervisor doméstico de um menor, não principalmente a um professor.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: agora que ... chegou
  rationale: O particípio aoristo em genitivo absoluto é expresso naturalmente por uma oração temporal, preservando a chegada concluída e sua relevância presente.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre o período anterior sob o guardião e a nova situação.
- source_word: πίστεως
  choice: a fé
  rationale: Mantém o sentido usual de πίστις e, com o artigo definido natural em português, permite tanto a referência à fé quanto sua dimensão histórico-salvífica no contexto.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de modo idiomático a cessação do estado anterior.
- source_word: ὑπὸ
  choice: sob a autoridade de
  rationale: Torna clara a ideia de sujeição e supervisão contida na metáfora, sem reduzir o παιδαγωγός a um professor.
- source_word: παιδαγωγόν
  choice: guardião
  rationale: Designa adequadamente o responsável doméstico pela supervisão de um menor no mundo greco-romano, e não principalmente um mestre de sala de aula.
- source_word: ἐσμεν
  choice: estamos
  rationale: Tradução direta e idiomática do presente de εἰμί.
theological_decisions:
- issue: Sentido da chegada da fé no contexto
  choice: a fé chegou
  alternative: chegou a era da fé; veio a fidelidade
  rationale: A formulação preserva a linguagem de Paulo e a tensão entre a fé como realidade vivida e a transição histórico-salvífica descrita no contexto, sem explicitar na tradução uma interpretação única.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Já não estamos” é natural e direto; “sob a autoridade de” esclarece a relação de supervisão sem perder a metáfora social antiga.
