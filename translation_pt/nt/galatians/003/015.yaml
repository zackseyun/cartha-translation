id: GAL.3.15
reference: Galatians 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: pt
  text: 'Irmãos[a], falo em termos humanos: mesmo uma aliança ratificada por um homem[b], ninguém a anula nem lhe acrescenta nada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural grego adelphoi; Paulo provavelmente se dirige aos fiéis em geral, incluindo mulheres.
    reason: cultural_note
  - marker: b
    text: 'Ou: “testamento”. O termo grego também pode ter esse sentido jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Irmãos
  rationale: O vocativo masculino plural é preservado de modo formal e natural em português; uma nota esclarece que Paulo provavelmente se dirige ao conjunto dos fiéis, incluindo mulheres.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: falo em termos humanos
  rationale: Expressão idiomática que introduz uma analogia tirada da experiência humana comum; a formulação é clara e conserva o contraste implícito.
- source_word: ὅμως
  choice: mesmo
  rationale: 'Neste contexto, reforça o exemplo: até no caso de uma aliança humana vigora o princípio mencionado.'
- source_word: ἀνθρώπου
  choice: por um homem
  rationale: Mantém o genitivo singular concreto do grego, em vez de convertê-lo numa abstração como “humana”.
- source_word: κεκυρωμένην
  choice: ratificada
  rationale: O particípio perfeito passivo descreve algo formalmente confirmado e ainda em vigor; “ratificada” preserva o teor jurídico.
- source_word: διαθήκην
  choice: aliança
  rationale: No argumento imediato sobre Abraão e a promessa divina, “aliança” mantém a continuidade contextual, embora o termo também possa designar um testamento.
- source_word: ἀθετεῖ
  choice: anula
  rationale: Expressa com clareza a ideia jurídica de invalidar ou tornar sem efeito.
- source_word: ἐπιδιατάσσεται
  choice: lhe acrescenta nada
  rationale: Transmite a ideia de acrescentar disposições posteriores; “nada” torna a construção idiomática em português sem alterar o sentido.
theological_decisions:
- issue: 'Sentido de διαθήκη: “aliança” ou “testamento”'
  choice: aliança
  alternative: testamento
  rationale: O contexto de Gálatas 3 trata da promessa e da aliança de Deus com Abraão, favorecendo “aliança”. A possível acepção jurídica “testamento” é genuína e fica registrada em nota, sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem argumentativa e a terminologia jurídica do grego foram preservadas sem rigidez excessiva.
