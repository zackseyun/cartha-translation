  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: pt
  text: 'Mas a lei não vem da fé; pelo contrário: “Quem praticar essas coisas viverá por elas[a]”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viverá nelas”.'
    reason: lexical_alternative
  - marker: b
    text: Citação de Levítico 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: lei
  rationale: Mantém a expressão paulina sem acrescentar uma especificação ausente no grego; o contexto conserva em vista a lei mosaica.
- source_word: ἐκ πίστεως
  choice: vem da fé
  rationale: Reproduz de modo natural a ideia de origem ou princípio expressa por ἐκ, sem explicá-la como “basear-se” ou “operar segundo”.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Marca com clareza o contraste forte e introduz naturalmente a citação bíblica.
- source_word: ὁ ποιήσας
  choice: quem praticar
  rationale: Expressa o valor genérico do particípio substantivado e, no contexto de mandamentos, “praticar” soa mais natural e preciso que o simples “fazer”.
- source_word: αὐτά
  choice: essas coisas
  rationale: Preserva o pronome neutro plural e sua referência contextual aos preceitos da lei, sem tornar o objeto mais explícito do que no grego.
- source_word: ζήσεται
  choice: viverá
  rationale: Representa diretamente o futuro grego em linguagem moderna e digna.
- source_word: ἐν αὐτοῖς
  choice: por elas
  rationale: 'Comunica o provável valor instrumental da expressão no contexto: viver mediante a prática dessas coisas. A tradução mais formal “nelas” é preservada em nota.'
theological_decisions:
- issue: Contraste de Paulo entre lei e fé
  choice: “a lei não vem da fé”
  alternative: “a lei não se baseia na fé” ou “a lei não opera segundo o princípio da fé”
  rationale: A formulação mantém a antítese e a tensão teológica do grego, sem explicar de modo excessivo em que sentido a lei não é ἐκ πίστεως.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vem da fé” evita tanto a rigidez pouco natural de “é da fé” quanto uma paráfrase teológica excessivamente explicativa. A citação mantém o singular genérico por meio de “quem”.
