  terminology: '“Judeu”, “grego”, “escravo” e “livre” refletem os termos gregos sem eufemismo ou ampliação indevida. “Messias” para Χριστός respeita seu valor titular. As notas estão corretamente ancoradas: [a] esclarece o terceiro par, e [b] explica “Messias”.'
