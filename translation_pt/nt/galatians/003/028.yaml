  source_fidelity: A tradução preserva com precisão a tríplice negação existencial (οὐκ ἔνι), os pares contrastivos judeu/grego e escravo/livre, e a distinção formal do terceiro par, em que o grego usa καὶ (“e”), não οὐδέ (“nem”). “Homem e mulher” é uma tradução contextual defensável de ἄρσεν καὶ θῆλυ; a nota informa de modo adequado a formulação mais estritamente lexical e a provável alusão a Gênesis 1:27. “Todos vocês são um” conserva a unidade corporativa expressa por εἷς, sem extrapolar seu alcance.
