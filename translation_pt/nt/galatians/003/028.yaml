id: GAL.3.28
reference: Galatians 3:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no slave or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: pt
  text: Não há judeu nem grego, não há escravo nem livre, não há homem e mulher[a]; pois todos vocês são um no Messias Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “macho e fêmea” e usa “e”, não “nem”, provavelmente retomando Gênesis 1:27.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “em Cristo Jesus”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: não há
  rationale: Equivalente existencial natural em português, repetido para preservar a ênfase e o paralelismo de Paulo.
- source_word: Ἰουδαῖος / Ἕλλην
  choice: judeu / grego
  rationale: Mantém o contraste étnico-religioso concreto do grego, sem ampliar Ἕλλην para “gentio”.
- source_word: δοῦλος / ἐλεύθερος
  choice: escravo / livre
  rationale: Expressa diretamente o contraste de condição social; “escravo” comunica melhor a condição de sujeição indicada por δοῦλος.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homem e mulher
  rationale: Formulação digna e compreensível em português para o par sexuado, preservando a conjunção “e” e a provável alusão a Gênesis 1:27; a precisão literal é registrada em nota.
- source_word: πάντες ὑμεῖς
  choice: todos vocês
  rationale: Preserva tanto a totalidade quanto o pronome explícito de segunda pessoa, com clareza internacional e boa legibilidade brasileira.
- source_word: εἷς ἐστε
  choice: vocês são um
  rationale: Mantém o singular predicativo e a afirmação concisa de unidade, sem expandi-la para “uma só pessoa” ou simplesmente “unidos”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título messiânico e preserva a construção relacional com ἐν.
theological_decisions:
- issue: A mudança de οὐδὲ para καὶ no terceiro par
  choice: não há homem e mulher
  alternative: não há homem nem mulher
  rationale: A escolha conserva a diferença formal do grego e a provável evocação da expressão de Gênesis 1:27, ainda que a construção seja menos idiomática.
- issue: O alcance de εἷς ἐστε
  choice: todos vocês são um
  alternative: todos vocês estão unidos
  rationale: A formulação mínima afirma a unidade no Messias sem decidir se, ou em que sentido, as distinções mencionadas continuam existindo.
- issue: O valor de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo conserva força titular; “Messias” explicita essa função sem tratá-lo apenas como nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com escolhas naturais para leitores brasileiros. A repetição “não há” preserva a cadência retórica; “homem e mulher” evita o tom zoológico que “macho e fêmea” pode adquirir no uso corrente, enquanto a nota conserva a forma literal e a possível alusão bíblica.
