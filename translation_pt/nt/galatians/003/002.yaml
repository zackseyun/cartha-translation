id: GAL.3.2
reference: Galatians 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: pt
  text: 'Quero saber de vocês apenas isto: vocês receberam o Espírito pelas obras da lei ou por ouvirem com fé?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ouvirem a mensagem com fé”; a expressão também pode ser entendida como “pela audição da fé”.'
    reason: alternative_reading
  - marker: b
    text: “Fidelidade” é uma nuance menos provável para “fé” aqui, mas às vezes é considerada por causa da construção grega condensada.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: apenas isto
  rationale: Preserva a ênfase inicial de Paulo em uma formulação natural e incisiva em português.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: Quero saber de vocês
  rationale: Expressa de modo idiomático o desejo de obter deles a resposta, sem perder o tom pessoal e interrogativo.
- source_word: ἐξ ἔργων νόμου
  choice: pelas obras da lei
  rationale: Mantém a expressão paulina tradicional e representa o valor de meio ou fundamento indicado por ἐξ.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: O contexto aponta para o Espírito de Deus; a inicial maiúscula explicita esse referente sem acrescentar 'Santo', ausente no grego.
- source_word: ἐλάβετε
  choice: vocês receberam
  rationale: O pretérito perfeito traduz naturalmente o aoristo na pergunta sobre a experiência passada dos gálatas.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: por ouvirem com fé
  rationale: Formulação natural que preserva a concisão da construção grega e o contraste entre obras e uma escuta caracterizada pela fé, sem eliminar suas possíveis relações sintáticas.
- source_word: πίστεως
  choice: fé
  rationale: É o sentido mais provável de πίστις neste contexto; 'fidelidade' permanece possível, mas menos provável.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: o Espírito, isto é, o Espírito de Deus recebido pelos fiéis
  alternative: uma experiência ou um poder espiritual em sentido mais geral
  rationale: O contexto imediato de Gálatas 3 trata da dádiva divina do Espírito, favorecendo o referente pessoal divino.
- issue: Relação em ἀκοῆς πίστεως
  choice: ouvir acompanhado de fé
  alternative: ouvir a mensagem da fé, ou a audição que procede da fé
  rationale: A construção genitiva é condensada e permite mais de uma relação; o texto principal oferece português claro, enquanto a nota conserva a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural é explicitado por “vocês”. A ordem foi ajustada para fluidez, preservando a ênfase em “apenas isto” e o contraste retórico entre os dois meios apresentados.
