id: GAL.3.14
reference: Galatians 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: pt
  text: para que a bênção de Abraão chegasse aos gentios[a] no Messias Jesus[b], a fim de que recebêssemos, por meio da fé, a promessa do Espírito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «às nações».'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: «em Cristo Jesus».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «recebêssemos o Espírito prometido».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que / a fim de que
  rationale: Mantém as duas orações de finalidade do grego, com variação natural em português para evitar repetição pesada sem apagar o paralelismo.
- source_word: εἰς τὰ ἔθνη
  choice: aos gentios
  rationale: No contexto paulino, designa mais naturalmente os não judeus; a alternativa literal «às nações» é preservada em nota.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: a bênção de Abraão
  rationale: Reproduz de modo direto a expressão genitiva e sua ligação com a promessa abraâmica.
- source_word: γένηται
  choice: chegasse
  rationale: Expressa idiomaticamente que a bênção alcança os gentios, respeitando o valor subjuntivo na oração de finalidade.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título e conserva a fórmula paulina com ἐν, sem reduzir a expressão a mero instrumento.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: a promessa do Espírito
  rationale: Preserva a forma genitiva e sua ambiguidade, em vez de decidir no texto principal que o Espírito é necessariamente o conteúdo prometido.
- source_word: λάβωμεν
  choice: recebêssemos
  rationale: O imperfeito do subjuntivo português se ajusta à finalidade dependente do enquadramento verbal do contexto e soa natural nesta oração.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Representa claramente o valor instrumental de διά com genitivo e mantém πίστις como «fé».
theological_decisions:
- issue: Χριστῷ como título ou forma tradicional transliterada
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste argumento sobre Abraão, bênção e promessa, o sentido titular permanece saliente; «Messias» torna esse valor explícito, enquanto a forma tradicional é registrada em nota.
- issue: Sentido do genitivo τοῦ πνεύματος
  choice: a promessa do Espírito
  alternative: o Espírito prometido
  rationale: A redação principal mantém a estrutura genitiva grega e não elimina sua tensão interpretativa; a leitura contextual mais explícita fica em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a dupla finalidade do original. O marcador [a] foi colocado junto de «gentios», [b] junto de «Messias Jesus» e [c] junto de «promessa do Espírito».
