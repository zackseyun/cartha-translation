id: GAL.3.5
reference: Galatians 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: pt
  text: Portanto, aquele que lhes concede o Espírito e realiza milagres entre vocês[a] faz isso pelas obras da lei ou por ouvirem com fé?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vocês”.'
    reason: Alternativa lexical para ἐν ὑμῖν.
  - marker: b
    text: 'Ou: “pela audição da fé” ou “pela mensagem ouvida com fé”.'
    reason: A construção ἀκοῆς πίστεως admite relações sintáticas mais de uma leitura plausível.
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: concede
  rationale: Expressa a provisão contínua e generosa do Espírito em português natural, sem acrescentar uma intensidade que o contexto não exige.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Mantém a referência definida do grego e o uso paulino, sem explicitar “Santo”, ausente do texto.
- source_word: ἐνεργῶν δυνάμεις
  choice: realiza milagres
  rationale: Traduz de modo claro e idiomático a atuação de feitos poderosos, evitando o pouco natural “opera poderes”.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: É a leitura contextual mais natural para atos poderosos manifestados na comunidade; “em vocês” continua lexicalmente possível.
- source_word: ἐξ ἔργων νόμου
  choice: pelas obras da lei
  rationale: Preserva a expressão paulina tradicional e comunica naturalmente a base ou o meio em contraste com ouvir com fé.
- source_word: ἀκοῆς πίστεως
  choice: por ouvirem com fé
  rationale: Reproduz em português corrente o contraste entre obras da lei e uma escuta acompanhada de fé, preservando em nota outras relações possíveis entre os substantivos.
- source_word: πίστεως
  choice: fé
  rationale: É o equivalente mais direto neste contraste paulino; “fidelidade” é menos provável no contexto.
theological_decisions:
- issue: A relação sintática em ἀκοῆς πίστεως é compacta e admite mais de uma compreensão.
  choice: por ouvirem com fé
  alternative: por ouvirem a mensagem da fé; pela mensagem ouvida com fé
  rationale: A opção principal comunica com clareza uma escuta acompanhada de fé, sem eliminar as outras análises plausíveis, registradas na nota.
- issue: O alcance de ἐν ὑμῖν pode ser comunitário ou interior.
  choice: entre vocês
  alternative: em vocês
  rationale: O contexto favorece milagres realizados no meio das comunidades, mas a formulação grega também pode apontar para atuação neles; a alternativa é preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A pergunta retórica foi mantida. “Portanto” representa οὖν e liga explicitamente o versículo ao argumento anterior.
