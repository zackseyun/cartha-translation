  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: pt
  text: 'O que quero dizer é isto: a lei, que veio quatrocentos e trinta anos depois, não invalida[a] uma aliança previamente ratificada por Deus, de modo a anular[b] a promessa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “revoga”.
    reason: lexical_alternative
  - marker: b
    text: Ou “torna sem efeito” ou “deixa de lado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: O que quero dizer é isto
  rationale: Introduz naturalmente a explicação de Paulo, preservando a força discursiva da expressão sem acrescentar um advérbio temporal inexistente no grego.
- source_word: διαθήκην
  choice: uma aliança
  rationale: No contexto de Gálatas 3, refere-se ao compromisso pactual de Deus ligado à promessa feita a Abraão; “aliança” é claro e teologicamente não restritivo.
- source_word: προκεκυρωμένην
  choice: previamente ratificada
  rationale: Preserva tanto a ideia de confirmação formal quanto a anterioridade expressa pelo prefixo e pelo particípio perfeito.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: Tradução direta da expressão que identifica Deus como agente da ratificação, sem acrescentar ênfase.
- source_word: ὁ ... γεγονὼς νόμος
  choice: a lei, que veio
  rationale: Expressa em português corrente a entrada posterior da lei na história, em contraste cronológico com a aliança já ratificada.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: quatrocentos e trinta anos depois
  rationale: Comunica claramente o intervalo cronológico e a relação de posterioridade.
- source_word: οὐκ ἀκυροῖ
  choice: não invalida
  rationale: Mantém a força jurídica de ἀκυρόω e se ajusta naturalmente à relação entre lei e aliança.
- source_word: εἰς τὸ καταργῆσαι
  choice: de modo a anular
  rationale: “De modo a” permite a nuance de propósito ou resultado da construção, enquanto “anular” comunica a ideia de tornar a promessa inoperante.
- source_word: τὴν ἐπαγγελίαν
  choice: a promessa
  rationale: É a tradução direta e contextualmente precisa no argumento de Paulo sobre a promessa feita a Abraão.
theological_decisions:
- issue: Sentido de διαθήκη no argumento de Paulo
  choice: aliança
  alternative: testamento; disposição legal
  rationale: O contexto trata da promessa de Deus a Abraão e de sua prioridade em relação à lei. “Aliança” preserva esse argumento histórico-salvífico sem impor a imagem específica de um testamento.
- issue: Força de εἰς τὸ καταργῆσαι
  choice: de modo a anular
  alternative: com o resultado de tornar sem efeito; a fim de anular
  rationale: A formulação mantém aberta a possível relação de propósito ou resultado, sem decidir além do que a construção grega exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “lei” em minúscula para não acrescentar ao texto uma distinção tipográfica interpretativa. A estrutura é natural em português, mas conserva a sequência lógica entre aliança, lei e promessa.
