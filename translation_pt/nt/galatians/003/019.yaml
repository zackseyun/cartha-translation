id: GAL.3.19
reference: Galatians 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: pt
  text: Então, para que serve a lei? Ela foi acrescentada por causa das transgressões[b], até que viesse o descendente[a] a quem a promessa havia sido feita. A lei foi estabelecida[c] por meio de anjos, pela mão de um mediador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente”; também pode ser traduzido como “descendência”.
    reason: lexical_alternative
  - marker: b
    text: “Por causa das transgressões” pode significar para tratar delas, expô-las ou contê-las; o grego não especifica o sentido mais precisamente.
    reason: alternative_reading
  - marker: c
    text: Ou “ordenada” ou “disposta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Então, para que serve a lei?
  rationale: Explicita em português natural a pergunta elíptica sobre a finalidade da lei, de acordo com o fluxo do argumento, sem tratá-la como uma pergunta sobre a essência da lei.
- source_word: τῶν παραβάσεων χάριν
  choice: por causa das transgressões
  rationale: Preserva a amplitude causal ou final de χάριν com o genitivo, sem decidir se a lei visava conter, expor ou tratar das transgressões.
- source_word: προσετέθη
  choice: foi acrescentada
  rationale: Reproduz diretamente o passivo e comunica o caráter suplementar da lei no argumento.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: até que viesse
  rationale: O pretérito imperfeito do subjuntivo é a construção portuguesa natural depois de uma oração principal no passado e mantém o evento futuro a partir daquele ponto de vista.
- source_word: τὸ σπέρμα
  choice: o descendente
  rationale: No português atual, “descendente” comunica naturalmente o sentido humano e singular exigido pelo contexto; a alternativa literal “semente” é registrada em nota para preservar a ligação lexical do argumento.
- source_word: ᾧ ἐπήγγελται
  choice: a quem a promessa havia sido feita
  rationale: Torna explícita a promessa pressuposta no verbo e representa o perfeito como promessa anterior com validade contínua.
- source_word: διαταγεὶς
  choice: foi estabelecida
  rationale: Expressa a instituição ou disposição formal da lei em português claro; a oração independente evita uma sequência participial pesada.
- source_word: δι’ ἀγγέλων
  choice: por meio de anjos
  rationale: Conserva a ideia de agência intermediária indicada por διά com o genitivo.
- source_word: ἐν χειρὶ μεσίτου
  choice: pela mão de um mediador
  rationale: Mantém a imagem concreta do idioma grego, que permanece compreensível em português, em vez de reduzi-la simplesmente a “por um mediador”.
theological_decisions:
- issue: Sentido de “por causa das transgressões”
  choice: Mantida a formulação ampla “por causa das transgressões”.
  alternative: “para conter as transgressões”, “para expor as transgressões” ou “com respeito às transgressões”.
  rationale: A frase grega é concisa e não especifica qual relação funcional a lei tem com as transgressões; a tradução não resolve essa tensão.
- issue: Tradução de σπέρμα no argumento paulino
  choice: “descendente” no texto, com “semente” e “descendência” em nota.
  alternative: “semente” no texto principal.
  rationale: “Descendente” é natural, inteligível e permite a referência singular no português moderno, enquanto a nota conserva a metáfora e a ligação verbal com a promessa abraâmica.
- issue: Agência na entrega da lei
  choice: A lei foi estabelecida por meio de anjos, pela mão de um mediador.
  alternative: A lei foi ordenada por anjos por intermédio de um mediador.
  rationale: A redação conserva os dois níveis de mediação sem identificar o mediador nem desenvolver uma doutrina além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta inicial foi tornada idiomática; a metáfora de σπέρμα e as ambiguidades de χάριν e διαταγεὶς foram preservadas por notas. Todos os marcadores aparecem junto às expressões pertinentes no texto.
