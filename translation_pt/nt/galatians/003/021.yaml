id: GAL.3.21
reference: Galatians 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: pt
  text: Então, a lei é contrária às promessas de Deus? De modo nenhum! Pois, se tivesse sido dada uma lei capaz de dar vida, a justiça[a] realmente viria da lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: Alternativa lexical para δικαιοσύνη, preservando sua amplitude sem impor no texto principal uma interpretação mais estreita.
lexical_decisions:
- source_word: νόμος
  choice: lei
  rationale: Mantém o sentido geral de lei como categoria no argumento hipotético, sem excluir a ressonância da Lei mosaica; a inicial minúscula evita restringir o termo silenciosamente.
- source_word: κατὰ
  choice: contrária a
  rationale: Com o genitivo, expressa oposição. “Contrária às promessas” é claro e natural em português.
- source_word: ἐπαγγελιῶν
  choice: promessas
  rationale: Preserva explicitamente o plural grego e a referência às promessas divinas mencionadas no contexto.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Reproduz com força e naturalidade a fórmula enfática de repúdio usada por Paulo.
- source_word: ἐδόθη
  choice: tivesse sido dada
  rationale: O mais-que-perfeito composto do subjuntivo se ajusta naturalmente à condição irreal introduzida por εἰ no contexto.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: capaz de dar vida
  rationale: Expressa a capacidade atribuída hipoteticamente à lei e conserva o sentido vivificador de ζῳοποιέω em português corrente.
- source_word: ὄντως
  choice: realmente
  rationale: Mantém a ênfase do advérbio na conclusão da condição.
- source_word: ἐκ νόμου
  choice: viria da lei
  rationale: “Da lei” preserva o valor de origem ou procedência de ἐκ; “viria” produz uma conclusão condicional natural sem transformar a relação em mero instrumento.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: “Justiça” é o equivalente português amplo e tradicional, capaz de abranger tanto a condição de estar em relação correta com Deus quanto a dimensão ética ou judicial; a alternativa “retidão” é registrada em nota.
theological_decisions:
- issue: Alcance de δικαιοσύνη no argumento paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude do termo grego e não decide entre uma qualidade moral, uma condição correta diante de Deus e a ação justa. “Retidão” é possível, mas pode estreitar o sentido, por isso aparece apenas como alternativa em nota.
- issue: Referência de νόμος
  choice: lei, com inicial minúscula
  alternative: Lei, como designação específica da Lei mosaica
  rationale: A construção hipotética fala de uma lei capaz de dar vida e, assim, trata a lei como categoria, embora a Lei mosaica permaneça no horizonte contextual. A tradução evita resolver essa tensão em favor de apenas uma referência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura retórica de pergunta e repúdio foi preservada, assim como o caráter hipotético da segunda frase.
