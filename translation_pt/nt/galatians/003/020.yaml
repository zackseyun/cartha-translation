id: GAL.3.20
reference: Galatians 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: pt
  text: O mediador, porém, não é de um só[a], mas Deus é um[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido explicativo, “um mediador não atua em favor de um só” ou “não é para uma só parte”. A expressão grega é breve e ambígua.
    reason: alternative_reading
  - marker: b
    text: “Deus é um” provavelmente retoma a confissão da unidade de Deus; compare Deuteronômio 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: mediador
  rationale: “Mediador” é o equivalente português corrente e preciso para quem atua entre partes, preservando o possível contexto jurídico e pactual sem acrescentar uma interpretação.
- source_word: ἑνὸς
  choice: de um só
  rationale: A expressão mantém a construção genitiva, breve e ambígua, do grego. Em contexto, pode indicar que o mediador não pertence, não serve ou não atua em relação a apenas uma parte, mas o texto não explicita qual dessas nuances deve prevalecer.
- source_word: οὐκ ἔστιν
  choice: não é
  rationale: A tradução direta conserva a formulação comprimida e enigmática de Paulo, sem substituir o verbo por “representa”, “serve” ou “pertence a”.
- source_word: δὲ
  choice: porém / mas
  rationale: O primeiro δέ é expresso por “porém”, marcando a relação com o argumento anterior sem sentido temporal; o segundo é traduzido por “mas”, preservando o contraste interno do versículo.
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: Deus é um
  rationale: Tradução simples e direta que conserva a afirmação enfática da unidade de Deus e sua provável ressonância com a confissão de Deuteronômio 6:4.
theological_decisions:
- issue: O sentido da afirmação comprimida sobre o mediador
  choice: Manter “não é de um só” no texto principal
  alternative: “não atua em favor de uma só parte” ou “não é para uma só parte”
  rationale: Gálatas 3:20 admite numerosas interpretações. A formulação mais literal preserva a tensão do texto e evita identificar implicitamente as partes ou resolver o argumento em favor de uma leitura específica da lei, da promessa, de Moisés ou de Cristo.
- issue: A afirmação “Deus é um”
  choice: Preservar a formulação sem paráfrase
  alternative: “há um só Deus” ou “Deus é um só”
  rationale: “Deus é um” acompanha de perto a sintaxe grega e mantém aberta a função exata dessa afirmação no argumento, além da provável alusão monoteísta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum “de um só” é mantida deliberadamente por refletir a concisão e a ambiguidade genuínas do original; a nota oferece as principais explicitações possíveis sem impor uma delas.
