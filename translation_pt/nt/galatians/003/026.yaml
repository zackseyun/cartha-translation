  source_fidelity: A tradução preserva adequadamente πάντες com «todos vocês», γάρ com «Pois», υἱοὶ θεοῦ com «filhos de Deus» e διά com genitivo em «por meio da fé». «No Messias Jesus» é uma leitura sintaticamente possível de ἐν Χριστῷ Ἰησοῦ como complemento de «fé», e a nota registra de modo apropriado a possível ligação com a condição filial/união com ele.
