  terminology: «Filhos de Deus» mantém a forma masculina plural e a nuance de filiação/status presente em υἱοί, sem excluir mulheres no referente coletivo. «Messias» traduz semanticamente Χριστός, e a nota fornece a forma tradicional «Cristo Jesus». As notas são pertinentes e os seus marcadores estão corretamente ancorados.
