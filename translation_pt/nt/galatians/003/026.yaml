  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: pt
  text: Pois todos vocês são filhos de Deus por meio da fé no Messias Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “filhos”, termo que aqui abrange todos os que creem, homens e mulheres, e ressalta sua condição filial e sua herança.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois, no Messias Jesus, todos vocês são filhos de Deus por meio da fé”. A expressão “no Messias Jesus” pode indicar a união com ele. Tradicionalmente, “em Cristo Jesus”.'
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: todos vocês
  rationale: Com o verbo na segunda pessoa do plural, explicita que Paulo inclui todo o grupo a quem se dirige.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa e fundamentadora da conjunção em relação ao contexto anterior.
- source_word: υἱοὶ θεοῦ
  choice: filhos de Deus
  rationale: Preserva o termo masculino plural do grego e sua nuance paulina de condição filial e herança, sem excluir o alcance representativo às mulheres do grupo.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Expressa naturalmente o meio ou instrumento indicado por διά com genitivo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título e conserva a preposição ἐν, importante para a linguagem paulina de união com o Messias.
theological_decisions:
- issue: Linguagem filial marcada por gênero
  choice: filhos de Deus
  alternative: filhos e filhas de Deus; crianças de Deus
  rationale: O grego emprega υἱοί, termo que ressalta a condição jurídica e hereditária de filhos; em português, o plural masculino pode abranger o grupo inteiro. A nota esclarece o alcance inclusivo sem apagar a forma e a nuance do original.
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Χριστός funciona como título; “Messias” comunica seu conteúdo semântico, enquanto a nota registra a forma tradicional portuguesa.
- issue: Relação de ἐν com fé e identidade filial
  choice: por meio da fé no Messias Jesus
  alternative: por meio da fé, no Messias Jesus
  rationale: A redação portuguesa permite a leitura natural de fé dirigida ao Messias, mas o grego também pode associar “no Messias Jesus” à condição de filhos. A nota preserva essa ambiguidade sintática e a dimensão de união com ele.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Todos vocês” torna explícita a segunda pessoa plural; “por meio da fé” é corrente e preserva a relação instrumental. As notas conservam tanto a nuance filial de υἱοί quanto a possível ligação sintática de ἐν Χριστῷ Ἰησοῦ.
