  source_fidelity: 'O texto traduz adequadamente a estrutura argumentativa do grego: a herança é contrastada como procedente da lei ou da promessa, e Deus é apresentado como quem a concedeu graciosamente a Abraão por meio da promessa. “Já não” expressa bem οὐκέτι, e “deu graciosamente” conserva a nuance de favor de κεχάρισται. O pretérito perfeito simples é idiomático em português neste enunciado sobre a concessão divina realizada.'
