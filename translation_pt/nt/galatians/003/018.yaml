  terminology: “Herança”, “lei”, “promessa” e “Abraão” são escolhas estabelecidas e apropriadas ao vocabulário paulino. “Por meio da promessa” reproduz adequadamente o valor instrumental de δι’ ἐπαγγελίας, sem confundi-lo com a formulação de origem nas orações anteriores.
