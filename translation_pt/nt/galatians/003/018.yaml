id: GAL.3.18
reference: Galatians 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: pt
  text: Pois, se a herança vem da lei, já não vem da promessa; mas Deus a deu graciosamente a Abraão por meio da promessa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas Deus a concedeu a Abraão mediante uma promessa”.'
    reason: Alternativa lexical e sintática para κεχάρισται e δι’ ἐπαγγελίας.
lexical_decisions:
- source_word: κληρονομία
  choice: herança
  rationale: É o equivalente paulino natural para aquilo que se recebe como herdeiro e preserva a ligação com o argumento sobre a promessa feita a Abraão.
- source_word: ἐκ νόμου
  choice: vem da lei
  rationale: Expressa de modo natural a ideia de fonte ou fundamento indicada por ἐκ e mantém o contraste paralelo com a promessa.
- source_word: ἐξ ἐπαγγελίας
  choice: vem da promessa
  rationale: Repete a estrutura da primeira oração para deixar claro o contraste de origem entre lei e promessa.
- source_word: οὐκέτι
  choice: já não
  rationale: 'Comunica com clareza a exclusão lógica: se a herança procede da lei, deixa de proceder da promessa.'
- source_word: δι’ ἐπαγγελίας
  choice: por meio da promessa
  rationale: Preserva o valor instrumental de διά sem confundir esta expressão com a formulação de origem usada anteriormente.
- source_word: κεχάρισται
  choice: deu graciosamente
  rationale: Conserva tanto o aspecto resultante do perfeito quanto a nuance de favor gratuito presente em χαρίζομαι.
- source_word: τῷ ... Ἀβραὰμ
  choice: a Abraão
  rationale: Identifica naturalmente Abraão como o destinatário da dádiva divina.
theological_decisions:
- issue: Explicitação da nuance de graça em κεχάρισται
  choice: deu graciosamente
  alternative: concedeu / deu
  rationale: A formulação retém a nuance lexical de favor gratuito e o contraste de Paulo entre lei e promessa, sem acrescentar uma formulação doutrinária externa ao texto.
- issue: Relação entre lei e promessa como fontes da herança
  choice: manter o paralelismo “vem da lei / vem da promessa”
  alternative: “baseia-se na lei / baseia-se na promessa”
  rationale: O paralelismo preserva a força de ἐκ nas duas expressões e evita explicar além do que o grego afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome “a” retoma “a herança”; o marcador foi colocado na oração à qual a variante realmente se refere.
