id: GAL.3.16
reference: Galatians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: pt
  text: 'As promessas foram feitas a Abraão e à sua descendência.[a] Não diz: “E às descendências”,[b] como se falasse de muitas, mas de uma só: “E à sua descendência”, que é o Messias.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente” em todo este versículo; o grego emprega um substantivo coletivo no singular, central ao argumento de Paulo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “E às sementes”; Paulo ressalta a forma plural em contraste com o singular.
    reason: lexical_alternative
  - marker: c
    text: Ou “Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: foram feitas
  rationale: Embora o verbo seja literalmente “foram ditas”, em português a colocação natural é “promessas foram feitas”; isso preserva o caráter verbal e o sentido sem resultar em formulação artificial.
- source_word: ἐπαγγελίαι
  choice: promessas
  rationale: Equivalente padrão e claro para as promessas divinas no contexto paulino.
- source_word: σπέρμα / σπέρματι
  choice: descendência
  rationale: “Descendência” é um substantivo coletivo singular natural em português e preserva a forma central ao argumento de Paulo; a nota registra a alternativa mais literal “semente”.
- source_word: τοῖς σπέρμασιν
  choice: descendências
  rationale: O plural pouco usual deve permanecer perceptível, pois Paulo fundamenta seu argumento no contraste gramatical entre plural e singular.
- source_word: ὡς ἐπὶ πολλῶν
  choice: como se falasse de muitas
  rationale: Expressa com naturalidade que a formulação não se refere a uma pluralidade de descendências.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: mas de uma só
  rationale: Mantém o contraste enfático com “muitas” e concorda com o substantivo feminino “descendência”.
- source_word: Χριστός
  choice: o Messias
  rationale: Neste enunciado de identificação, o sentido titular de Χριστός está ativo; “o Messias” torna explícito o significado de ungido esperado.
theological_decisions:
- issue: Identificação de Χριστός na fórmula ὅς ἐστιν Χριστός
  choice: que é o Messias
  alternative: que é Cristo
  rationale: A construção identifica a descendência prometida com o ungido esperado. “O Messias” comunica o valor titular, enquanto a nota preserva a tradução tradicional “Cristo”.
- issue: Força do singular coletivo σπέρμα
  choice: descendência
  alternative: semente
  rationale: “Descendência” mantém a possibilidade coletiva normal do termo e, ao mesmo tempo, permite que o leitor acompanhe a interpretação singular que Paulo explicita, sem resolver a tensão além do próprio texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação “promessas foram feitas” é idiomática; “descendências” conserva deliberadamente a estranheza necessária ao contraste gramatical. Não se acrescentou um marcador equivalente a “agora”, ausente do grego.
