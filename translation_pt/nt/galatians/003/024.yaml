  naturalness: O texto é claro, moderno e de registro apropriado. “Guardião” é uma solução natural e suficientemente precisa, desde que a nota explique sua função histórica. “Para que sejamos justificados pela fé” é mais fluente e coerente com “a lei se tornou”.
