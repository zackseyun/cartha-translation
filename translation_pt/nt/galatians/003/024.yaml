source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: pt
  text: Assim, a lei se tornou nosso guardião[a] até o Messias[b], para que sejamos justificados pela fé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “responsável”; tradicionalmente, “tutor”. O termo grego παιδαγωγός designava o guardião ou supervisor doméstico de um menor, não principalmente um professor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em direção ao Messias”; a expressão também pode ser entendida como “conduzindo ao Messias”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz a conclusão inferida do argumento anterior de modo natural e claro em português.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se à lei mosaica como categoria reconhecível no contexto de Gálatas; o artigo grego é preservado naturalmente.
- source_word: παιδαγωγὸς
  choice: guardião
  rationale: No mundo greco-romano, designava o responsável doméstico que supervisionava um menor, não principalmente um professor. “Guardião” comunica melhor essa função em português atual.
- source_word: ἡμῶν
  choice: nosso
  rationale: O genitivo indica a relação da lei com o grupo representado por Paulo.
- source_word: γέγονεν
  choice: se tornou
  rationale: Expressa a situação resultante indicada pelo perfeito grego, sem reduzir a forma a um simples passado.
- source_word: εἰς Χριστόν
  choice: até o Messias
  rationale: No contexto, εἰς apresenta o Messias como alvo ou termo da função temporária da lei. A ambiguidade direcional é preservada em nota.
- source_word: Χριστόν
  choice: o Messias
  rationale: Traduz Χριστός como título, em linguagem portuguesa natural.
- source_word: ἵνα
  choice: para que
  rationale: Introduz com clareza a finalidade expressa pela oração grega.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: Comunica de forma idiomática o meio ou a base expressos pela construção paulina.
- source_word: δικαιωθῶμεν
  choice: fôssemos justificados
  rationale: Preserva a voz passiva, o valor subjuntivo e a linguagem jurídico-forense do verbo.
theological_decisions:
- issue: Sentido de εἰς Χριστόν em relação à função da lei
  choice: até o Messias
  alternative: em direção ao Messias; conduzindo-nos ao Messias
  rationale: O contexto destaca a função temporária da lei antes da vinda da fé, mas εἰς também pode indicar direção ou alvo. A tradução principal expressa o termo temporal e a nota mantém aberta a dimensão direcional, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Guardião” evita a ideia anacrônica de um professor particular, e “justificados” conserva a formulação teológica e forense de Paulo.
