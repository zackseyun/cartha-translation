id: GAL.3.22
reference: Galatians 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: pt
  text: Mas a Escritura encerrou tudo sob o pecado[b], para que a promessa, mediante a fé em Jesus, o Messias,[a] fosse dada aos que creem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mediante a fidelidade de Jesus, o Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “aprisionou todas as coisas sob o pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: encerrou
  rationale: Expressa a ideia de fechar ou confinar sob restrição, preservando a metáfora paulina em português natural; a alternativa mais explícita aparece em nota.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Mantém o singular com artigo e a personificação da Escritura como testemunho unificado.
- source_word: τὰ πάντα
  choice: tudo
  rationale: Preserva o alcance amplo do neutro plural sem restringi-lo apenas às pessoas.
- source_word: ὑπὸ ἁμαρτίαν
  choice: sob o pecado
  rationale: Conserva a metáfora de sujeição sem acrescentar no texto principal expressões interpretativas como 'poder' ou 'domínio'.
- source_word: ἡ ἐπαγγελία
  choice: a promessa
  rationale: É a correspondência direta e natural do substantivo grego, sem especificar indevidamente o conteúdo prometido.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: mediante a fé em Jesus, o Messias
  rationale: Adota no texto principal a leitura do genitivo objetivo, comum e clara em português, preservando em nota a leitura subjetiva genuinamente possível.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Representa Χριστός como título associado a Jesus e torna essa função explícita pela aposição portuguesa.
- source_word: δοθῇ
  choice: fosse dada
  rationale: O subjuntivo passivo depois de ἵνα é expresso naturalmente por uma oração de finalidade com 'para que' e imperfeito do subjuntivo.
- source_word: τοῖς πιστεύουσιν
  choice: aos que creem
  rationale: Preserva o sentido verbal do particípio e descreve a resposta ativa de crer, em vez de reduzi-la a um rótulo.
theological_decisions:
- issue: Genitivo em πίστεως Ἰησοῦ Χριστοῦ
  choice: fé em Jesus, o Messias (genitivo objetivo)
  alternative: fidelidade de Jesus, o Messias (genitivo subjetivo)
  rationale: A construção admite discussão real entre a fé dirigida a Jesus e a fidelidade exercida por Jesus. O texto principal segue a leitura objetiva comum, enquanto a nota conserva a alternativa sem apagar a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a abrangência de τὰ πάντα nem a ambiguidade de πίστις Ἰησοῦ Χριστοῦ.
