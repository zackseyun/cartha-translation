source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: pt
  text: E, se vocês pertencem ao Messias[a], então são semente de Abraão[b], herdeiros conforme a promessa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pertencem a Cristo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “descendência de Abraão”. No grego, “semente” está no singular e retoma a formulação usada anteriormente por Paulo neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: pertencem ao Messias
  rationale: O genitivo indica pertencimento. “Pertencem ao Messias” expressa isso naturalmente em português, enquanto “Messias” preserva o valor titular de Χριστός.
- source_word: σπέρμα
  choice: semente
  rationale: Mantém o singular coletivo e a ligação verbal com o argumento anterior de Paulo sobre a “semente” de Abraão, embora “descendência” fosse mais corrente.
- source_word: κληρονόμοι
  choice: herdeiros
  rationale: É o equivalente português natural no contexto familiar e pactual.
- source_word: κατ’ ἐπαγγελίαν
  choice: conforme a promessa
  rationale: Preserva de modo conciso a relação indicada por κατά sem decidir em excesso entre norma, fundamento ou correspondência.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: E, se vocês ... então
  rationale: Conserva tanto a conexão leve de δέ quanto a estrutura condicional e inferencial do grego.
theological_decisions:
- issue: Preservar o singular e o vínculo lexical de σπέρμα com o argumento messiânico anterior ou usar um coletivo mais idiomático.
  choice: semente
  alternative: descendência
  rationale: “Semente” deixa visível a repetição deliberada do termo empregado anteriormente no capítulo e não resolve a tensão entre seu sentido coletivo aqui e o uso singular destacado em Gálatas 3:16.
- issue: Traduzir Χριστός como título ou como forma mais próxima de nome próprio.
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o título e a identidade messiânica permanecem salientes; a alternativa tradicional é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação “pertencem ao Messias” evita o pouco natural “são do Messias”; “semente” é deliberadamente mais formal para conservar a conexão argumentativa do capítulo.
