id: GAL.3.8
reference: Galatians 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: pt
  text: 'E a Escritura, prevendo que Deus justifica as nações[a] pela fé, anunciou de antemão as boas-novas[b] a Abraão: “Em você serão abençoadas todas as nações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gentios”. A palavra grega pode significar “nações” ou “gentios”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pregou de antemão o evangelho a Abraão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: prevendo
  rationale: Expressa de modo natural a percepção antecipada indicada pelo particípio aoristo, sem perder o sentido temporal.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Mantém o artigo e a personificação paulina da Escritura como sujeito que prevê e anuncia.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: Formulação portuguesa clara e tradicional que comunica a fé como meio ou base, sem ampliar a expressão grega.
- source_word: δικαιοῖ
  choice: justifica
  rationale: Preserva o termo paulino conciso e seu sentido declarativo, evitando transformar a tradução em explicação.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: as nações ... todas as nações
  rationale: Conserva a repetição lexical e torna transparente a ligação entre a afirmação de Paulo e a promessa abraâmica; a alternativa 'gentios' é registrada em nota.
- source_word: προευηγγελίσατο
  choice: anunciou de antemão as boas-novas
  rationale: Reproduz tanto a ideia de anúncio antecipado quanto o componente de boas-novas presente no verbo εὐαγγελ-.
- source_word: τῷ Ἀβραὰμ
  choice: a Abraão
  rationale: Representa naturalmente em português o objeto indireto no dativo.
- source_word: Ἐνευλογηθήσονται
  choice: serão abençoadas
  rationale: Mantém diretamente o futuro passivo da promessa, sem especificar além do texto quem realiza a bênção.
- source_word: ἐν σοὶ
  choice: Em você
  rationale: Preserva a formulação representativa e pactual da citação de Gênesis sem decidir entre sentidos possíveis como 'por meio de você' ou 'em união com você'.
theological_decisions:
- issue: Se ἔθνη deve ser traduzido por 'nações' ou 'gentios'
  choice: '''nações'' nas duas ocorrências'
  alternative: '''gentios'' na primeira ocorrência e ''nações'' na citação, ou ''gentios'' em ambas'
  rationale: A repetição de 'nações' conserva o vínculo verbal e teológico entre a justificação pela fé e a promessa feita a Abraão, enquanto a nota mantém visível a alternativa lexical legítima.
- issue: Como representar a personificação de ἡ γραφή
  choice: manter 'a Escritura' como sujeito de 'prevendo' e 'anunciou'
  alternative: explicitar Deus como aquele que prevê ou anuncia por meio da Escritura
  rationale: A sintaxe de Paulo personifica a Escritura; explicitar outro sujeito resolveria uma tensão retórica que o original preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Boas-novas' mantém o conteúdo lexical do verbo grego; 'em você' conserva a concisão e a ambiguidade legítima da promessa citada.
