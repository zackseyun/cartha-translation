id: GAL.3.23
reference: Galatians 3:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: pt
  text: Mas, antes que viesse a fé[a], éramos mantidos sob a Lei[b], confinados[c] até que fosse revelada a fé que estava para ser revelada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que viesse fé”. O grego usa o artigo e pode apontar para a era da fé inaugurada com Cristo. πίστις também pode significar “fidelidade” ou “confiança”, embora “fé” se ajuste melhor ao contexto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “éramos guardados sob a Lei” ou “éramos mantidos em custódia sob a Lei”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “encerrados” ou “aprisionados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: antes que viesse
  rationale: A construção temporal com πρό e infinitivo articulado é expressa com naturalidade em português e mantém a anterioridade da ação.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado com o argumento anterior.
- source_word: τὴν πίστιν
  choice: a fé
  rationale: O artigo grego é preservado; no contexto, a expressão pode apontar tanto para a fé quanto para sua chegada como realidade histórico-salvífica.
- source_word: ὑπὸ νόμον
  choice: sob a Lei
  rationale: Expressa estar sob a autoridade ou o regime da Lei mosaica; a inicial maiúscula esclarece o referente contextual sem ampliar o texto.
- source_word: ἐφρουρούμεθα
  choice: éramos mantidos
  rationale: O imperfeito passivo indica uma condição contínua no passado. 'Mantidos' é natural e não antecipa por si só se a custódia era protetora ou restritiva.
- source_word: συγκλειόμενοι
  choice: confinados
  rationale: Preserva a ideia de encerramento ou restrição acrescentada pelo particípio.
- source_word: εἰς
  choice: até que
  rationale: No contexto, comunica a orientação temporal da custódia para a futura revelação da fé, sem recorrer a uma formulação portuguesa artificial.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: até que fosse revelada a fé que havia de vir
  rationale: Mantém tanto a revelação futura quanto a noção de que a fé estava por vir, evitando fazer de 'fé' o sujeito de 'revelar' e 'vir' simultaneamente de modo pouco natural.
theological_decisions:
- issue: Se πίστις designa o ato humano de crer ou uma realidade histórico-salvífica inaugurada com Cristo
  choice: a fé
  alternative: fé; a fidelidade
  rationale: A tradução conserva o artigo e a tensão do contexto. Não identifica explicitamente a fé com um sistema religioso nem reduz a expressão à experiência individual.
- issue: Nuance da função da Lei antes da revelação da fé
  choice: éramos mantidos sob a Lei, confinados
  alternative: éramos guardados sob a Lei, encerrados
  rationale: A combinação preserva tanto a possível ideia de custódia quanto a força restritiva inequívoca do particípio, sem decidir se a ação deve ser entendida apenas como proteção ou punição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o contraste e a progressão temporal do grego. 'Lei' recebe inicial maiúscula por se referir contextualmente à Lei mosaica; os marcadores aparecem imediatamente após as expressões relevantes.
