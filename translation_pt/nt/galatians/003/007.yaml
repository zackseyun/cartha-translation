  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: pt
  text: Saibam, portanto, que os que são da fé — estes são filhos de Abraão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: Saibam
  rationale: O imperativo presente é expresso de modo natural e direto em português; no contexto, convoca os leitores a reconhecer uma conclusão.
- source_word: ἄρα
  choice: portanto
  rationale: Preserva a inferência em relação ao argumento precedente.
- source_word: οἱ ἐκ πίστεως
  choice: os que são da fé
  rationale: Mantém a construção caracteristicamente paulina e sua possível amplitude, sem reduzi-la apenas a 'os que creem' ou explicá-la como origem, pertença ou princípio de vida.
- source_word: οὗτοι
  choice: estes
  rationale: Retém a retomada enfática do demonstrativo grego.
- source_word: υἱοί
  choice: filhos
  rationale: É o equivalente natural no contexto de filiação e pertencimento à descendência de Abraão, sem necessidade de nota.
- source_word: Ἀβραάμ
  choice: Abraão
  rationale: Forma portuguesa consagrada do nome bíblico.
theological_decisions:
- issue: Sentido de οἱ ἐκ πίστεως
  choice: os que são da fé
  alternative: os que creem
  rationale: A formulação escolhida preserva a expressão paulina e evita decidir além do texto se ela destaca origem, pertença, identidade ou vida baseada na fé.
- issue: Ênfase de οὗτοι
  choice: — estes são filhos de Abraão
  alternative: são filhos de Abraão
  rationale: 'A manutenção de ''estes'' e do travessão reproduz a identificação enfática: são precisamente os que são da fé que pertencem à família de Abraão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com forma verbal plural adequada ao discurso dirigido aos gálatas. A ordem e a ênfase do grego foram preservadas sem tornar a frase artificial.
