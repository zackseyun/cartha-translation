id: GAL.3.3
reference: Galatians 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: pt
  text: Vocês são tão insensatos assim? Tendo começado pelo Espírito[a], agora estão sendo aperfeiçoados[c] pela carne[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Espírito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo esforço humano”; também possivelmente “pela natureza pecaminosa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “estão sendo completados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: tão ... assim
  rationale: Na pergunta retórica, expressa de modo natural o grau da insensatez e preserva a ênfase da repreensão.
- source_word: ἀνόητοί
  choice: insensatos
  rationale: Comunica falta de entendimento e discernimento sem recorrer a um termo moderno excessivamente insultuoso.
- source_word: ἐναρξάμενοι
  choice: tendo começado
  rationale: Representa a ação antecedente do particípio aoristo e mantém o contraste entre o início e o que ocorre agora.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: O contexto imediato trata do Espírito Santo recebido pela fé; a preposição “pelo” expressa a provável função instrumental do dativo, sem excluir a alternativa locativa indicada em nota.
- source_word: νῦν
  choice: agora
  rationale: Mantém de forma breve e enfática o contraste temporal.
- source_word: σαρκὶ
  choice: pela carne
  rationale: Preserva o termo paulino e sua tensão sem reduzi-lo apenas a esforço humano ou a natureza pecaminosa.
- source_word: ἐπιτελεῖσθε
  choice: estão sendo aperfeiçoados
  rationale: Reflete a forma presente médio-passiva como um processo passivo e conserva a ideia de avançar rumo à perfeição ou conclusão.
theological_decisions:
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: o espírito humano ou um princípio espiritual
  rationale: Gálatas 3 fala de receber o Espírito e da atuação divina entre os gálatas, favorecendo a referência ao Espírito Santo.
- issue: Sentido de σάρξ no contraste com o Espírito
  choice: carne
  alternative: esforço humano ou natureza pecaminosa
  rationale: O vocábulo paulino pode reunir a ideia de recursos humanos, existência meramente humana e inclinação pecaminosa; a tradução literal preserva essa amplitude.
- issue: Voz e sentido de ἐπιτελεῖσθε
  choice: estão sendo aperfeiçoados
  alternative: estão sendo completados ou estão terminando
  rationale: A forma pode ser entendida como média ou passiva. A formulação escolhida acompanha a leitura passiva provável, enquanto a nota preserva a nuance de conclusão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Insensatos” preserva a força retórica sem soar vulgar; “carne” mantém deliberadamente a terminologia e a ambiguidade teológica paulinas.
