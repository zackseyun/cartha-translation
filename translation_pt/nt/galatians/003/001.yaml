  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: pt
  text: Ó gálatas insensatos! Quem enfeitiçou vocês,[a] diante de cujos olhos Jesus, o Messias,[b] foi publicamente retratado como crucificado?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enganou vocês?”. O verbo evoca literalmente enfeitiçar ou lançar um feitiço.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Jesus Cristo”. Aqui, “Messias” explicita o sentido do título grego Christós.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foi claramente apresentado como crucificado” ou “foi exposto publicamente como crucificado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: insensatos
  rationale: Expressa a repreensão pela falta de entendimento sem intensificá-la para uma condenação moral mais forte.
- source_word: Γαλάται
  choice: gálatas
  rationale: Forma portuguesa consagrada para o povo ou os habitantes da Galácia; no vocativo, mantém a referência regional do texto.
- source_word: ἐβάσκανεν
  choice: enfeitiçou
  rationale: Preserva a metáfora vívida de encantamento ou influência nociva, em vez de reduzi-la simplesmente a engano.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: diante de cujos olhos
  rationale: Reproduz a imagem de algo colocado diretamente diante dos olhos dos destinatários e conserva a ligação relativa da frase grega.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título significativo, em português idiomático, em vez de tratá-lo como parte opaca do nome.
- source_word: προεγράφη
  choice: foi publicamente retratado
  rationale: Comunica a apresentação aberta e vívida evocada pelo verbo, sem limitar indevidamente a imagem a um cartaz literal.
- source_word: ἐσταυρωμένος
  choice: como crucificado
  rationale: 'Reflete o particípio predicativo: Jesus foi apresentado em seu estado de crucificado.'
theological_decisions:
- issue: Sentido metafórico de βασκαίνω
  choice: enfeitiçou
  alternative: enganou
  rationale: A opção principal mantém a força retórica da imagem sem afirmar que ocorreu literalmente uma prática mágica; a alternativa mais geral é registrada em nota.
- issue: Tradução de Χριστός na expressão Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Mantém audível o valor titular de Χριστός e evita tratá-lo apenas como um nome próprio, ao mesmo tempo que registra a forma tradicional em nota.
- issue: Natureza da apresentação de Jesus crucificado
  choice: publicamente retratado como crucificado
  alternative: claramente apresentado como crucificado; exposto publicamente como crucificado
  rationale: A formulação conserva a amplitude de προγράφω entre apresentação vívida, exposição pública e possível imagem de anúncio afixado, sem escolher de modo excessivamente estreito entre essas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura brasileira natural. A construção “diante de cujos olhos” é deliberadamente mais formal, pois preserva a estrutura relativa e a imagem visual do grego. A exclamação inicial conserva a intensidade do vocativo, e a pergunta permanece uma única unidade retórica.
