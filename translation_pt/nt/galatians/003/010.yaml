id: GAL.3.10
reference: Galatians 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: pt
  text: 'Pois todos os que se baseiam nas obras da Lei[a] estão sob maldição, porque está escrito: “Maldito todo aquele que não persevera em todas as coisas escritas no livro da Lei, para praticá-las.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são das obras da Lei”.'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “não permanece em todas as coisas escritas no livro da Lei, para fazê-las”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Pois todos os que
  rationale: Preserva tanto o alcance plural e geral de ὅσοι quanto a função explicativa de γάρ.
- source_word: ἐξ ἔργων νόμου
  choice: são das obras da Lei
  rationale: Mantém de modo relativamente formal a expressão paulina e evita transformar no texto principal a relação ambígua em uma explicação como “apoiam-se nas obras da Lei”.
- source_word: ὑπὸ κατάραν
  choice: debaixo de maldição
  rationale: Expressão portuguesa clara para sujeição a uma maldição, sem especificá-la indevidamente como “a maldição”.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula portuguesa consagrada de citação das Escrituras, que reflete o perfeito passivo grego.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Maldito todo aquele que
  rationale: Comunica naturalmente tanto a condição de maldito quanto o alcance universal da declaração.
- source_word: ἐμμένει
  choice: persevera em
  rationale: Expressa adesão contínua e duradoura, sentido contextual de ἐμμένω, em português atual e digno.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: em todas as coisas escritas
  rationale: Conserva explicitamente a totalidade indicada por πᾶσιν e a estrutura do particípio passivo.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: no livro da Lei
  rationale: “Livro” é natural no registro bíblico moderno; “Lei” identifica adequadamente a Torá nesse contexto.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: para praticá-las
  rationale: Comunica a finalidade ou resultado de obedecer concretamente às coisas escritas, evitando o pouco natural “para fazê-las” no texto principal.
theological_decisions:
- issue: Sentido de ἐξ ἔργων νόμου
  choice: “são das obras da Lei” no texto principal
  alternative: “se apoiam nas obras da Lei”
  rationale: A formulação relativamente literal preserva a tensão teológica da expressão paulina sem definir no próprio texto se ela denota dependência, identidade, esfera ou fundamento; a interpretação idiomática é registrada em nota.
- issue: Abrangência da obediência exigida na citação
  choice: “em todas as coisas escritas”
  alternative: “em tudo o que está escrito”
  rationale: A redação escolhida conserva de forma visível a abrangência total de πᾶσιν sem enfraquecer a exigência apresentada pela citação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “Lei” com inicial maiúscula para a Torá no contexto paulino. A construção deliberadamente formal “são das obras da Lei” preserva a ambiguidade do original, enquanto as notas oferecem formulações mais interpretativas ou literais.
