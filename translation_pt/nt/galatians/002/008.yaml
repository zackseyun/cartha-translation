  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: pt
  text: Pois aquele que atuou por meio de Pedro no apostolado aos circuncidados[a] também atuou por meu intermédio entre os gentios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para o apostolado da circuncisão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as nações” ou “os povos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: atuou / atuou
  rationale: Mantém a repetição deliberada do mesmo verbo grego e comunica a ação eficaz sem explicitar além do texto como ela ocorreu.
- source_word: Πέτρῳ / ἐμοὶ
  choice: por meio de Pedro / por meu intermédio
  rationale: Interpreta os dativos como instrumentais no contexto do ministério apostólico. A pequena variação idiomática evita a formulação pouco natural “por meio de mim” sem perder o paralelismo de sentido.
- source_word: εἰς ἀποστολὴν
  choice: no apostolado
  rationale: Preserva o sentido formal de ἀποστολή como encargo ou ministério apostólico, em português corrente e digno.
- source_word: τῆς περιτομῆς
  choice: aos circuncidados
  rationale: Expressa a metonímia paulina pela qual “circuncisão” designa o povo judeu, mantendo visível o contraste com os gentios.
- source_word: εἰς τὰ ἔθνη
  choice: entre os gentios
  rationale: No contraste contextual com os circuncidados, ἔθνη se refere aos povos não judeus. “Entre” expressa de modo natural o campo em que o apostolado de Paulo se exercia.
theological_decisions:
- issue: Se o sujeito implícito deve ser explicitado como Deus
  choice: aquele que atuou
  alternative: Deus, que atuou
  rationale: O grego emprega um particípio substantivado, “aquele que atuou”, sem nomear explicitamente Deus neste versículo. A tradução conserva essa forma e deixa que o contexto identifique o referente.
- issue: Relação da ação divina com Pedro e Paulo
  choice: por meio de Pedro / por meu intermédio
  alternative: em Pedro / em mim
  rationale: A leitura instrumental se ajusta ao contexto dos respectivos ministérios apostólicos, sem transformar a frase numa afirmação restrita à ação interior neles.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Apostolado” preserva o vocabulário teológico do original; “aos circuncidados” e “gentios” mantêm o contraste histórico de Paulo. A repetição de “atuou” reproduz o paralelismo grego.
