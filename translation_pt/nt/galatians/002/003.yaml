  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: pt
  text: Mas nem mesmo Tito, que estava comigo, embora fosse grego[a][b], foi obrigado a circuncidar-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “sendo grego”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “grego” implica que Tito não era circuncidado; o texto, porém, diz especificamente “grego”, e não apenas “gentio”.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com o contexto anterior de modo conciso e natural.
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: Preserva a negação enfática concentrada em Tito.
- source_word: Τίτος
  choice: Tito
  rationale: Segue a forma tradicional e corrente do nome em português.
- source_word: ὁ σὺν ἐμοί
  choice: que estava comigo
  rationale: Reproduz com clareza a expressão descritiva sem acrescentar a ideia específica de companheiro ou colaborador.
- source_word: Ἕλλην ὤν
  choice: embora fosse grego
  rationale: Exprime naturalmente o valor concessivo sugerido pelo contexto, mantendo em nota a formulação participial mais literal.
- source_word: Ἕλλην
  choice: grego
  rationale: Mantém o termo étnico-cultural específico do texto, em vez de substituí-lo pela categoria interpretativa mais ampla 'gentio'.
- source_word: ἠναγκάσθη
  choice: foi obrigado
  rationale: Comunica a pressão ou coerção externa indicada pelo passivo, em linguagem portuguesa atual.
- source_word: περιτμηθῆναι
  choice: a circuncidar-se
  rationale: É uma formulação direta e idiomática para o infinitivo passivo no português moderno.
theological_decisions:
- issue: Termo étnico específico ou categoria religiosa interpretativa em Ἕλλην
  choice: grego
  alternative: gentio
  rationale: O texto identifica Tito especificamente como grego. Embora isso implique, no contexto, que ele não era circuncidado e pertencia aos povos não judeus, a tradução conserva a formulação da fonte.
- issue: Valor circunstancial de Ἕλλην ὤν
  choice: embora fosse grego
  alternative: sendo grego
  rationale: O contexto favorece uma relação concessiva, mas a construção participial grega não contém uma conjunção concessiva explícita; a alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “foi obrigado a circuncidar-se” evita solenidade excessiva e mantém o sentido de coerção do original.
