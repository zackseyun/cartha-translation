  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: pt
  text: Mas, pelo contrário, quando viram que me havia sido confiado o evangelho para os incircuncisos, assim como havia sido confiado a Pedro para os circuncisos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o evangelho da incircuncisão ... da circuncisão”, isto é, o evangelho confiado em relação a cada um desses grupos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Mas, pelo contrário
  rationale: Reproduz a forte oposição do grego de modo natural e digno em português.
- source_word: ἰδόντες
  choice: quando viram
  rationale: Explicita o valor circunstancial do particípio aoristo sem alterar sua relação com a oração principal.
- source_word: πεπίστευμαι
  choice: me havia sido confiado
  rationale: O perfeito passivo de πιστεύω tem aqui o sentido de receber algo em confiança; o mais-que-perfeito harmoniza naturalmente com a percepção passada expressa por 'viram'.
- source_word: τὸ εὐαγγέλιον
  choice: o evangelho
  rationale: Termo corrente e teologicamente adequado para εὐαγγέλιον no contexto paulino.
- source_word: τῆς ἀκροβυστίας
  choice: para os incircuncisos
  rationale: Expressa o grupo ao qual se dirige a incumbência, preservando a designação baseada na circuncisão sem substituí-la interpretativamente por 'gentios'.
- source_word: καθὼς
  choice: assim como
  rationale: Mantém com clareza o paralelo entre as incumbências de Paulo e Pedro.
- source_word: Πέτρος τῆς περιτομῆς
  choice: a Pedro para os circuncisos
  rationale: A construção portuguesa completa naturalmente o paralelo elíptico do grego e preserva a designação usada no texto-fonte.
theological_decisions:
- issue: Se ἀκροβυστία e περιτομή devem ser vertidos como designações étnicas ou segundo os marcadores pactuais empregados no grego.
  choice: incircuncisos / circuncisos
  alternative: gentios / judeus; incircuncisão / circuncisão
  rationale: A escolha mantém a formulação paulina e evita reduzir silenciosamente as expressões a equivalentes puramente étnicos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula antes da nota pertence ao fluxo do versículo, que continua sintaticamente no contexto.
