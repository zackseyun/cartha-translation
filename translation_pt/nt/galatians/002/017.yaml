review_pass:
  verdict: revise
  source_fidelity: 'O texto reproduz adequadamente a estrutura condicional e retórica do grego: o particípio ζητοῦντες é bem expresso por “ao procurarmos”; δικαιωθῆναι mantém a voz passiva em “ser justificados”; “no Messias” preserva ἐν Χριστῷ e o uso titular de Χριστός; e “fomos achados pecadores” conserva a passiva de εὑρέθημεν e a ênfase de “nós mesmos também”. “Servo do pecado” é uma equivalência fiel e não força a ideia de que o Messias seja a causa do pecado. “De modo nenhum!” comunica apropriadamente μὴ γένοιτο.'
  naturalness: A redação é clara, moderna e apropriada ao registro epistolar. Apenas a vírgula logo após “Mas” é desnecessária na construção “Mas, se...”; sua retirada torna o fluxo mais natural e segue a pontuação portuguesa usual.
  terminology: “Messias” segue a decisão lexical fornecida para Χριστός como título. “Justificados”, “pecadores”, “servo do pecado” e “De modo nenhum!” são termos claros, estáveis e adequados. A nota lexical está corretamente ancorada na primeira ocorrência e informa a alternativa tradicional sem interferir no texto.
  issues:
