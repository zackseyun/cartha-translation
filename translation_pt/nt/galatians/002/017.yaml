id: GAL.2.17
reference: Galatians 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: pt
  text: Mas, se, ao procurarmos ser justificados no Messias[a], nós mesmos também fomos achados pecadores, será então o Messias servo do pecado? De modo nenhum!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Messias: tradicionalmente traduzido por “Cristo” aqui e na ocorrência seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: ao procurarmos
  rationale: Expressa o particípio circunstancial como ação simultânea à oração principal, de maneira natural em português.
- source_word: δικαιωθῆναι
  choice: ser justificados
  rationale: Preserva o termo paulino consagrado e a forma passiva do grego, sem explicitar além do texto se o sentido é declarativo ou transformador.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém Χριστός como título e conserva a amplitude relacional da expressão ἐν Χριστῷ sem acrescentar uma explicação interpretativa.
- source_word: εὑρέθημεν
  choice: fomos achados
  rationale: Conserva a voz passiva e a força retórica do original, sem determinar quem constata essa condição.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: nós mesmos também fomos achados pecadores
  rationale: “Nós mesmos” reproduz a ênfase de αὐτοὶ, enquanto “também” representa καί e “pecadores” mantém o predicativo de modo direto.
- source_word: ἁμαρτίας διάκονος
  choice: servo do pecado
  rationale: “Servo” comunica serviço ou agência sem sugerir necessariamente um cargo religioso formal.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Reproduz com clareza e vigor a enfática rejeição paulina em português contemporâneo.
theological_decisions:
- issue: Se a pergunta retórica deve dar a entender que o Messias causa o pecado.
  choice: será então o Messias servo do pecado?
  alternative: será então o Messias ministro do pecado?
  rationale: A tradução preserva a acusação hipotética que Paulo rejeita, sem convertê-la em afirmação doutrinária nem explicar antecipadamente sua lógica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção deliberadamente conserva a tensão e a forma retórica do grego.
