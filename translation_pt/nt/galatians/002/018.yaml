source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: pt
  text: Pois, se volto a construir as coisas que derrubei[a], mostro que sou transgressor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruí” ou “desmontei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “demonstro que sou transgressor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Preserva tanto a ligação explicativa de γάρ com o argumento anterior quanto a força condicional de εἰ, em português natural.
- source_word: ἃ ... ταῦτα
  choice: aquilo que
  rationale: Reproduz de modo idiomático a estrutura correlativa grega sem perder a referência ao que havia sido derrubado.
- source_word: κατέλυσα
  choice: derrubei
  rationale: Mantém a metáfora de construção em paralelo direto com οἰκοδομῶ; alternativas como “destruí” ou “desmontei” também são possíveis.
- source_word: πάλιν οἰκοδομῶ
  choice: volto a construir
  rationale: Expressa claramente πάλιν e o presente οἰκοδομῶ, preservando a ideia de tornar a edificar.
- source_word: παραβάτην
  choice: transgressor
  rationale: Conserva a nuance moral e jurídica do termo sem especificar indevidamente qual norma foi transgredida.
- source_word: ἐμαυτὸν συνιστάνω
  choice: mostro que sou
  rationale: Transmite naturalmente a ideia de apresentar ou demonstrar a si mesmo como algo, preservando a força reflexiva.
theological_decisions:
- issue: O objeto metafórico que Paulo volta a construir
  choice: Mantido de forma não especificada como “aquilo que”
  alternative: Explicitar “a Lei”, “o sistema da Lei” ou “as barreiras entre judeus e gentios”
  rationale: O versículo não nomeia diretamente o referente; explicitá-lo resolveria uma ambiguidade que deve ser interpretada a partir do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Volto a construir” é mais natural aqui do que “reconstruo” e deixa explícito o valor de πάλιν. A ordem dos marcadores segue sua posição no texto português.
