  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: pt
  text: Nós somos judeus de nascimento[b] e não pecadores de origem gentia[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pecadores gentios”.'
    reason: lexical_alternative
  - marker: b
    text: “De nascimento” traduz uma expressão que significa literalmente “por natureza” e que aqui se refere à origem étnica.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Nós
  rationale: Mantém o pronome explícito e sua leve ênfase, sem acrescentar uma intensificação ausente do texto.
- source_word: φύσει
  choice: de nascimento
  rationale: Neste contraste, indica origem étnica natural, não constituição moral; a expressão é clara e corrente em português.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: É a forma nominal natural em português e preserva o contraste de identidade étnica.
- source_word: ἐξ ἐθνῶν
  choice: dentre os gentios
  rationale: Preserva tanto a preposição ἐξ quanto o sentido contextual de ἔθνη em oposição a judeus.
- source_word: ἁμαρτωλοί
  choice: pecadores
  rationale: Conserva o termo paulino convencional e a formulação direta do contraste presente no grego.
theological_decisions:
- issue: Se a frase deve soar como afirmação de superioridade moral judaica sobre os gentios
  choice: Preservar o contraste étnico formulado de maneira direta, sem transformá-lo em afirmação de justiça moral inerente aos judeus.
  alternative: Traduzir interpretativamente como “não considerados pecadores como os gentios”.
  rationale: O grego apresenta o contraste de modo breve e incisivo. O contexto posterior o qualifica, mas essa explicação não deve ser inserida neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Gentios” é mantido por ser o termo bíblico corrente para os povos não judeus; “dentre” conserva com naturalidade a relação expressa por ἐξ.
