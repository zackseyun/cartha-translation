id: GAL.2.16
reference: Galatians 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: pt
  text: Contudo, sabendo que uma pessoa não é justificada por obras da lei, mas somente por meio da fé em Jesus, o Messias[a], também nós cremos em Jesus, o Messias, para sermos justificados pela fé no Messias[b], e não por obras da lei, porque por obras da lei nenhuma carne[c] será justificada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da fidelidade de Jesus, o Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pela fidelidade do Messias”.'
    reason: alternative_reading
  - marker: c
    text: Isto é, nenhum ser humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: é justificada / sermos justificados / será justificada
  rationale: Mantém de modo coerente o termo paulino de caráter judicial, sem reduzi-lo a uma paráfrase mais estreita como “declarar justa” ou “considerar justa”.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Expressa naturalmente em português o singular genérico do grego, cujo referente é qualquer ser humano.
- source_word: ἐξ ἔργων νόμου
  choice: por obras da lei
  rationale: Preserva a formulação paulina reconhecível e evita ampliá-la indevidamente para “boas obras” ou reduzi-la a uma paráfrase.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: por meio da fé em Jesus, o Messias
  rationale: Adota no texto principal a leitura objetiva do genitivo, enquanto a leitura subjetiva, genuinamente possível, é preservada em nota.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: cremos no Messias Jesus
  rationale: Traduz πιστεύω com εἰς de maneira idiomática, mantendo a ordem titular do grego e o sentido de uma fé assumida pelos próprios falantes.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: pela fé no Messias
  rationale: Mantém coerência com a construção anterior de πίστις Χριστοῦ e registra em nota a alternativa “fidelidade do Messias”.
- source_word: Χριστός
  choice: Messias
  rationale: Traduz o título grego em vez de apenas transliterá-lo; em “Jesus, o Messias”, o artigo e a vírgula tornam o título natural e claro em português.
- source_word: πᾶσα σάρξ
  choice: nenhuma carne
  rationale: Conserva no texto a expressão bíblica concreta e seu eco escriturístico, com nota explicando seu sentido humano coletivo.
- source_word: εἰδότες δὲ
  choice: Contudo, sabendo
  rationale: Conserva a ligação participial e a leve força adversativa de δέ no contexto.
- source_word: ἐὰν μὴ
  choice: mas somente
  rationale: No contraste οὐ ... ἐὰν μὴ, comunica em português corrente a força exceptiva da construção sem sugerir que as obras da lei contribuam ao lado da fé.
theological_decisions:
- issue: Sentido de πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ
  choice: fé em Jesus, o Messias / fé no Messias
  alternative: fidelidade de Jesus, o Messias / fidelidade do Messias
  rationale: O genitivo pode ser entendido objetiva ou subjetivamente. O texto principal adota a leitura tradicional objetiva, mas as notas preservam a ambiguidade real sem apagar a possível referência à fidelidade do Messias.
- issue: Relação expressa por οὐ ... ἐὰν μὴ
  choice: não ... mas somente por meio de
  alternative: não ... a não ser por meio de
  rationale: A formulação escolhida torna claro o contraste entre obras da lei e fé, sem interpretar além do que a construção grega exige.
- issue: Alcance de πᾶσα σάρξ
  choice: nenhuma carne
  alternative: nenhum ser humano
  rationale: A expressão literal preserva a ressonância bíblica; a nota esclarece que o referente são os seres humanos, não a matéria corporal em abstrato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o encadeamento argumentativo de Paulo sem soar excessivamente mecânica. “Messias” traduz Χριστός de forma consistente; “nenhuma carne” preserva o idioma bíblico e recebe esclarecimento em nota.
