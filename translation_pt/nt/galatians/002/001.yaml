  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: pt
  text: Depois, passados catorze anos, subi novamente a Jerusalém com Barnabé, levando também Tito comigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Depois
  rationale: Marca de modo natural a continuação e a sequência do relato de Paulo.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: passados catorze anos
  rationale: Expressa idiomaticamente o intervalo decorrido indicado por διά com o genitivo, sem especificar a partir de qual acontecimento os anos são contados.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva a ideia de repetição da ida a Jerusalém em registro corrente e digno.
- source_word: ἀνέβην
  choice: subi
  rationale: Mantém a linguagem convencional de subir a Jerusalém, coerente com a geografia e com o modo de expressão da fonte.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: É a construção portuguesa natural para indicar esse destino após o verbo “subir”.
- source_word: μετὰ Βαρναβᾶ
  choice: com Barnabé
  rationale: Traduz diretamente a relação de acompanhamento.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: levando também Tito comigo
  rationale: O gerúndio representa a ação concomitante do particípio, “também” conserva a força aditiva de καί, e “comigo” explicita de maneira natural o componente associativo do verbo composto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a ambiguidade do texto quanto ao ponto inicial dos catorze anos e evita identificar esta viagem com qualquer episódio de Atos.
