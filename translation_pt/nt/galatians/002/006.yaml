  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: pt
  text: Quanto aos que eram tidos como importantes — o que quer que tenham sido no passado não faz diferença para mim[a]; Deus não trata ninguém com parcialidade[b] —, eles nada me acrescentaram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quaisquer que eles fossem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Deus não recebe o rosto de um ser humano”, expressão que significa que Deus não mostra favoritismo nem parcialidade.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “não me impuseram mais nada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: os que eram tidos como importantes / esses homens de prestígio
  rationale: Expressa reputação e posição reconhecida, preservando o tom levemente distanciado de Paulo sem insinuar que a liderança deles era ilegítima.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: o que quer que tenham sido no passado
  rationale: Comunica que a posição ou condição anterior deles não altera a avaliação de Paulo; “no passado” representa naturalmente ποτε no contexto.
- source_word: οὐδέν μοι διαφέρει
  choice: não faz diferença para mim
  rationale: Equivalente idiomático claro e direto, mantendo explícita a perspectiva pessoal de Paulo.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Deus não trata ninguém com parcialidade
  rationale: Traduz o sentido do idioma sem reproduzir literalmente uma expressão obscura em português e sem restringir ἄνθρωπος ao sexo masculino.
- source_word: ἐμοὶ γὰρ
  choice: esses homens de prestígio ... me
  rationale: A retomada após o comentário parentético torna explícita a relação com Paulo; a estrutura portuguesa preserva a ênfase do dativo sem forçar uma tradução isolada de γάρ.
- source_word: οὐδὲν προσανέθεντο
  choice: nada me acrescentaram
  rationale: Mantém a formulação concisa e a possível referência ao conteúdo da mensagem ou à contribuição dos líderes, sem decidir de modo indevido entre “acrescentar” e “impor algo adicional”.
theological_decisions:
- issue: Se a fala de Paulo manifesta desprezo pelos líderes de Jerusalém ou independência em relação ao prestígio deles
  choice: 'Preservar um distanciamento retórico moderado: “tidos como importantes” e “homens de prestígio”.'
  alternative: “Os líderes reconhecidos” suavizaria o tom; “os que pareciam ser alguma coisa” poderia soar mais depreciativo.
  rationale: O argumento é que a posição deles não determinava a verdade do evangelho de Paulo, não necessariamente que a liderança deles fosse falsa.
- issue: Se os líderes nada acrescentaram à mensagem de Paulo ou nada adicional lhe impuseram
  choice: Manter no texto a expressão ampla “nada me acrescentaram”.
  alternative: “Não me impuseram mais nada” explicitaria uma possível leitura contextual.
  rationale: O verbo admite nuances de acrescentar, comunicar ou impor algo adicional. A redação principal preserva essa abertura, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os travessões preservam a interrupção parentética do grego; evitou-se tanto a expressão tradicional menos transparente “fazer acepção de pessoas” quanto uma paráfrase que eliminasse a ambiguidade de προσανέθεντο.
