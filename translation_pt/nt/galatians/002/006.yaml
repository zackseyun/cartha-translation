  rationale: A revisão elimina a caracterização adicional “homens de prestígio” e retoma o grupo já mencionado com “eles”. Isso mantém a referência ampla do grego, evita marcar desnecessariamente o grupo como masculino e conserva tanto o tom moderadamente distanciado quanto a estrutura parentética do versículo. As notas permanecem fiéis e adequadamente ancoradas.
