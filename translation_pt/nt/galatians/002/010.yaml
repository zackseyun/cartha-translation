  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: pt
  text: Somente nos pediram que nos lembrássemos dos pobres, justamente o que também me empenhei em fazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Somente
  rationale: Marca a única condição ou solicitação ligada ao acordo mencionado no contexto anterior.
- source_word: τῶν πτωχῶν
  choice: dos pobres
  rationale: Mantém o sentido comum de πτωχός, referindo-se a pessoas em situação de pobreza, sem restringi-lo a uma categoria mais específica.
- source_word: ἵνα μνημονεύωμεν
  choice: que nos lembrássemos
  rationale: Depois de μόνον, a construção com ἵνα expressa o conteúdo do pedido. Em português, o pretérito imperfeito do subjuntivo se ajusta naturalmente ao discurso indireto após o contexto passado; “lembrar” preserva a formulação grega e sugere cuidado concreto sem explicitá-lo além do texto.
- source_word: ὃ
  choice: o que
  rationale: Retoma como um todo o pedido de lembrar-se dos pobres e estabelece uma ligação natural em português.
- source_word: ἐσπούδασα
  choice: me empenhei
  rationale: Expressa dedicação zelosa e esforço ativo, preservando tanto a disposição quanto a ação sugeridas por σπουδάζω.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: justamente o que também me empenhei em fazer
  rationale: “Justamente” comunica a ênfase de αὐτὸ τοῦτο, enquanto “fazer” mantém explícito o caráter prático da resposta de Paulo.
theological_decisions:
- issue: O alcance prático de “lembrar-se dos pobres”
  choice: Preservar a expressão “lembrar-se”, sem substituir por “ajudar” ou “dar dinheiro”.
  alternative: Traduzir de modo explícito como “ajudar os pobres”.
  rationale: No contexto, a lembrança certamente envolve cuidado concreto, mas o grego emprega μνημονεύω. A tradução conserva essa formulação e evita definir além do texto a forma específica da assistência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A inclusão de “nos pediram” torna natural a construção elíptica do grego no contexto do acordo descrito no versículo anterior, sem alterar o conteúdo da única solicitação. “Me empenhei” evita uma formulação excessivamente literal e comunica prontidão acompanhada de esforço.
