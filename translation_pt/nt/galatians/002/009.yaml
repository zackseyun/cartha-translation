id: GAL.2.9
reference: Galatians 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: pt
  text: e, reconhecendo a graça que me havia sido dada, Tiago, Cefas e João, considerados colunas, deram a mim e a Barnabé a mão direita em sinal de comunhão[a], para que nós fôssemos aos gentios, e eles, aos circuncidados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deram a mim e a Barnabé as mãos direitas de comunhão”.
    reason: A nota preserva o plural δεξιὰς e a construção compacta do grego, enquanto o texto principal usa a expressão idiomática natural em português.
  - marker: b
    text: Literalmente, “à circuncisão”, isto é, aos judeus.
    reason: Esclarece a metonímia do original sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: γνόντες
  choice: reconhecendo
  rationale: O particípio introduz a base da ação seguinte e expressa tanto percepção quanto reconhecimento público.
- source_word: χάριν
  choice: graça
  rationale: Mantém o termo característico de Paulo para o favor divino atuante em seu chamado e ministério, sem restringi-lo a uma comissão específica.
- source_word: δοθεῖσάν μοι
  choice: que me havia sido dada
  rationale: Expressa naturalmente em português a anterioridade dessa dádiva em relação ao gesto de comunhão.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Translitera o nome empregado no texto grego, sem substituí-lo por Pedro.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: considerados colunas
  rationale: Comunica a posição reconhecida desses homens sem atribuir tom depreciativo às palavras de Paulo.
- source_word: δεξιὰς ... κοινωνίας
  choice: a mão direita em sinal de comunhão
  rationale: Reproduz em português natural o gesto formal de reconhecimento e participação comum; uma nota preserva a forma plural e a construção literal do grego.
- source_word: ἔθνη
  choice: gentios
  rationale: No contexto, refere-se aos não judeus, e não principalmente a nações em sentido político.
- source_word: περιτομήν
  choice: circuncidados
  rationale: Explicita a metonímia pela qual 'circuncisão' designa o povo judeu, preservando o contraste com os gentios.
theological_decisions:
- issue: Sentido de κοινωνίας no gesto de dar a mão direita
  choice: comunhão
  alternative: parceria
  rationale: Comunhão preserva a amplitude relacional e missional de κοινωνία; a expressão 'em sinal de' esclarece que o gesto formalizava reconhecimento e cooperação, sem reduzir o termo apenas a uma divisão administrativa do trabalho.
- issue: Referente de περιτομήν
  choice: os circuncidados
  alternative: a circuncisão / os judeus
  rationale: A forma escolhida mantém a imagem do original e torna inteligível sua referência coletiva, sem substituir diretamente a metonímia por uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem dos nomes e o contraste missionário foram preservados; o verbo 'fôssemos' explicita naturalmente a elipse do grego.
