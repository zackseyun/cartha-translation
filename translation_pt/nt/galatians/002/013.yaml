  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «hipocrisia» foi mantida por refletir a ênfase do texto grego; «se deixou levar» reproduz com naturalidade a influência social expressa pelo passivo.
