source:
  edition: SBLGNT
  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: pt
  text: E os demais judeus também se uniram a ele nessa hipocrisia[a], de modo que até Barnabé se deixou levar pela hipocrisia deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «também agiram hipocritamente com ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: se uniram a ele nessa hipocrisia
  rationale: Expressa a participação conjunta no comportamento hipócrita e preserva a força associativa do prefixo σύν-, em português natural.
- source_word: αὐτῷ
  choice: a ele
  rationale: O dativo indica associação com a conduta de Pedro; a construção «se uniram a ele» torna explícita essa relação.
- source_word: λοιποὶ
  choice: demais
  rationale: Indica os membros restantes do grupo já mencionado, mantendo o contraste com Pedro; «demais» é claro e corrente.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: Neste contexto paulino, refere-se ao grupo étnico-religioso judeu, e não apenas a habitantes da Judeia.
- source_word: συναπήχθη
  choice: se deixou levar
  rationale: Comunica de modo natural a ideia passiva de ser arrastado pela influência coletiva, sem eliminar a responsabilidade de Barnabé sugerida pelo contexto.
- source_word: ὑποκρίσει
  choice: hipocrisia
  rationale: Designa a dissimulação coletiva em questão e mantém a repetição enfática de Paulo nas duas ocorrências.
theological_decisions: []
