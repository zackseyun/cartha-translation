id: GAL.2.20
reference: Galatians 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: pt
  text: Já não sou eu quem vive, mas o Messias vive em mim. E a vida que agora vivo na carne, vivo pela fé no Filho de Deus[a], que me amou e se entregou por mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vivo pela fidelidade do Filho de Deus”.'
    reason: A construção grega também pode apresentar o Filho de Deus como sujeito da fé/fidelidade, e não como objeto da fé.
lexical_decisions:
- source_word: Χριστός
  choice: o Messias
  rationale: Traduz o título grego, em vez de apenas transliterá-lo. O artigo é natural e necessário em português quando “Messias” funciona como título definido neste contexto.
- source_word: ὃ δὲ νῦν ζῶ
  choice: a vida que agora vivo
  rationale: A construção grega com pronome relativo neutro é elíptica; explicitar “a vida” produz português natural sem acrescentar conteúdo interpretativo indevido.
- source_word: σάρξ
  choice: carne
  rationale: Preserva o termo paulino e, neste contexto, indica a existência humana presente e corpórea, sem o interpretar como “natureza pecaminosa”.
- source_word: πίστις
  choice: fé
  rationale: Mantém o sentido lexical usual, enquanto a ambiguidade da construção genitiva é preservada em nota.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: no Filho de Deus
  rationale: A leitura objetiva, “fé no Filho de Deus”, é clara e amplamente compreensível; a leitura subjetiva possível é registrada em nota.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: se entregou por mim
  rationale: Expressa de modo natural em português tanto a entrega voluntária de si mesmo quanto o sentido vicário de ὑπέρ.
theological_decisions:
- issue: Sentido de πίστις na expressão τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: pela fé no Filho de Deus
  alternative: pela fidelidade do Filho de Deus
  rationale: O genitivo pode ser entendido objetivamente, como a fé dirigida ao Filho, ou subjetivamente, como a fidelidade do Filho. A leitura objetiva fica no texto principal, e a alternativa legítima é preservada em nota para não eliminar a tensão exegética.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Carne” conserva a terminologia paulina; “se entregou” evita a rigidez de “entregou a si mesmo” sem perder a ideia de autodoação.
