  source_fidelity: A tradução transmite adequadamente a construção de contraste e reprovação de Paulo. “Não procediam de modo coerente com a verdade do evangelho” expressa de forma fiel o sentido figurado de ὀρθοποδοῦσιν πρὸς, e a nota preserva a imagem de caminhar reto. “Cefas” corresponde ao nome grego Κηφᾷ. O paralelismo entre viver como gentio/judeu e a força coercitiva de ἀναγκάζεις são mantidos; “como é que” traduz bem πῶς como pergunta de incongruência prática.
  naturalness: O português é moderno, claro e apropriado a uma tradução bíblica de registro digno. O uso de “você” no discurso direto é natural e legível para leitores brasileiros e internacionais. “Procediam de modo coerente” é levemente mais formal, mas permanece idiomático e compreensível.
  terminology: “Evangelho”, “Cefas”, “judeu” e “gentio” estão bem empregados. “Viver como judeus” comunica Ἰουδαΐζειν sem impor um sentido técnico posterior; a nota com “judaizar” preserva a alternativa tradicional. As âncoras das notas correspondem corretamente aos termos comentados.
