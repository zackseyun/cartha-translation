id: GAL.2.14
reference: Galatians 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: pt
  text: 'Mas, quando vi que eles não procediam de modo coerente com a verdade do evangelho[a], disse a Cefas diante de todos: “Se você, embora seja judeu, vive como gentio, e não como judeu, como é que obriga os gentios a viver como judeus[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não caminhavam em linha reta segundo a verdade do evangelho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a judaizar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: procediam de modo coerente
  rationale: O verbo evoca literalmente caminhar em linha reta, mas aqui descreve uma conduta que não corresponde à verdade do evangelho. A formulação escolhida comunica essa conformidade ética em português natural, enquanto a metáfora literal é preservada em nota.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: com a verdade do evangelho
  rationale: Neste contexto, πρός indica conformidade com um padrão, e não apenas direção. A preposição “com” se integra naturalmente à expressão “procediam de modo coerente”.
- source_word: Κηφᾷ
  choice: Cefas
  rationale: Preserva o nome empregado no texto grego, em sua forma tradicionalmente transliterada em português, em vez de substituí-lo por Pedro.
- source_word: ἐθνικῶς
  choice: como gentio
  rationale: O advérbio descreve uma maneira de viver. “Como gentio” é claro e preserva o contraste étnico e social do contexto.
- source_word: Ἰουδαϊκῶς
  choice: como judeu
  rationale: Mantém o paralelismo antitético com “como gentio” e expressa a maneira de viver indicada pelo advérbio.
- source_word: ἀναγκάζεις
  choice: obriga
  rationale: Expressa de maneira clara e corrente a pressão coercitiva indicada pelo verbo, sem suavizá-la para uma simples influência.
- source_word: Ἰουδαΐζειν
  choice: a viver como judeus
  rationale: Comunica em linguagem atual a adoção de práticas distintivamente judaicas. O termo mais formal “judaizar” é preservado em nota.
- source_word: πῶς
  choice: como é que
  rationale: Traduz diretamente a pergunta sobre a incoerência da conduta de Cefas, sem introduzir a ideia de capacidade que poderia surgir com “como pode”.
theological_decisions:
- issue: Como traduzir Ἰουδαΐζειν sem importar polêmicas doutrinárias posteriores
  choice: a viver como judeus
  alternative: a judaizar; a adotar costumes judaicos
  rationale: O contexto imediato trata da convivência à mesa e de práticas que distinguiam judeus de gentios. A tradução mantém essa tensão social e religiosa sem transformar o verbo em um termo técnico de sistemas teológicos posteriores.
- issue: Natureza da acusação expressa por πῶς ἀναγκάζεις
  choice: como é que obriga
  alternative: como pode obrigar
  rationale: A forma escolhida apresenta a pergunta direta de Paulo sobre a incoerência prática de Cefas, sem interpretá-la como uma questão de possibilidade ou capacidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no discurso direto por naturalidade contemporânea, conserva “Cefas” conforme o grego e usa “gentio” e “judeu” em minúsculas como designações de grupos. A tradução principal privilegia clareza idiomática, e as notas preservam a metáfora de ὀρθοποδεῖν e o termo tradicional ligado a Ἰουδαΐζειν.
