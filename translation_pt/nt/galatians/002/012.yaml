id: GAL.2.12
reference: Galatians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: pt
  text: Pois, antes de chegarem alguns da parte de Tiago[a], ele costumava comer com os gentios; mas, quando chegaram, começou a se afastar e a se separar, por medo dos da circuncisão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguns ligados a Tiago”. O grego não especifica por si só se Tiago os enviou formalmente.
    reason: alternative_reading
  - marker: b
    text: Ou “o grupo da circuncisão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: Pois, antes de chegarem
  rationale: Expressa de modo natural a construção temporal com πρό e infinitivo articular, preservando também a ligação explicativa de γάρ.
- source_word: τινας ἀπὸ Ἰακώβου
  choice: alguns da parte de Tiago
  rationale: Mantém a indefinição de τινας e traduz ἀπό com uma expressão que pode indicar procedência ou associação, sem afirmar explicitamente que Tiago os enviou ou aprovou sua conduta.
- source_word: μετὰ τῶν ἐθνῶν
  choice: com os gentios
  rationale: Em Paulo, ἔθνη normalmente designa os não judeus; não se acrescenta 'cristãos' ou 'convertidos', termos ausentes do grego.
- source_word: συνήσθιεν
  choice: costumava comer
  rationale: O imperfeito indica uma prática habitual anterior.
- source_word: ὑπέστελλεν
  choice: começou a se afastar
  rationale: Comunica o movimento de recuo ou retirada e representa adequadamente o aspecto progressivo ou incoativo do imperfeito no contexto.
- source_word: ἀφώριζεν ἑαυτόν
  choice: a se separar
  rationale: Preserva a força reflexiva e a separação social indicada pelo verbo, sem acrescentar uma explicação não expressa.
- source_word: φοβούμενος
  choice: por medo
  rationale: Torna explícita em português natural a provável relação causal do particípio, sem ampliar seu conteúdo.
- source_word: τοὺς ἐκ περιτομῆς
  choice: os da circuncisão
  rationale: Reproduz a identificação concisa do grupo pela circuncisão sem introduzir no texto principal a noção mais específica de um partido formal.
theological_decisions:
- issue: Se ἀπὸ Ἰακώβου implica que Tiago enviou ou endossou essas pessoas
  choice: da parte de Tiago
  alternative: enviados por Tiago; ligados a Tiago
  rationale: A expressão grega indica origem ou associação, mas não especifica por si só autorização formal. A nota preserva essa ambiguidade e evita atribuir a Tiago mais responsabilidade do que o texto declara.
- issue: Se τοὺς ἐκ περιτομῆς designa formalmente um partido
  choice: os da circuncisão
  alternative: o grupo da circuncisão; o partido da circuncisão
  rationale: O grego identifica pessoas por sua relação com a circuncisão, sem empregar um termo explícito para facção ou partido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o caráter habitual de συνήσθιεν, o recuo progressivo de ὑπέστελλεν e as ambiguidades relativas à ligação com Tiago e à identidade dos 'da circuncisão'.
