review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente a negação enfática («nem por um momento»), a recusa de ceder «em submissão», a finalidade introduzida por ἵνα e «a verdade do evangelho». «Com vocês» é uma possibilidade contextual legítima para πρὸς ὑμᾶς e evita tornar o português dependente de um uso pouco idiomático de «permanecer para».
  naturalness: «A eles não cedemos em submissão» é compreensível, mas a ordem «Não cedemos a eles» é mais corrente no português moderno. Sobretudo, «permanecesse para vocês» soa pouco natural em português; «permanecesse com vocês» conserva a ambiguidade relacional da preposição e lê-se fluentemente.
  terminology: «Evangelho», «verdade» e «submissão» são termos adequados, estáveis e não confessionais neste contexto. A nota literal sobre «hora» é apropriada.
  issues:
  - severity: medium
    issue: «permanecesse para vocês» é uma construção pouco idiomática em português para διαμείνῃ πρὸς ὑμᾶς.
    rationale: Embora «para vocês» procure expressar benefício ou referência, em português «permanecer para alguém» tende a sugerir reserva ou posse, não presença/continuidade relacional. «Com vocês» representa uma alternativa semanticamente defensável, melhora a fluência e mantém a alternativa «para vocês» em nota.
  - severity: low
    issue: A ordem «A eles não cedemos em submissão» é levemente marcada.
    rationale: A antecipação de «A eles» pode refletir a ênfase grega, mas «Não cedemos a eles em submissão» é mais natural sem perda relevante de ênfase, já reforçada por «nem por um momento».
