source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: pt
  text: Não cedemos a eles em submissão nem por um momento[a], para que a verdade do evangelho permanecesse com vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nem por uma hora”, expressão que aqui significa “nem por um momento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “permanecesse para vocês” ou “permanecesse entre vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: A eles
  rationale: O pronome relativo no dativo retoma os homens mencionados no versículo anterior; “a eles” preserva essa referência com naturalidade em português.
- source_word: οὐδὲ πρὸς ὥραν
  choice: nem por um momento
  rationale: A expressão significa não ceder sequer por um breve período; a tradução comunica o valor idiomático sem sugerir necessariamente sessenta minutos.
- source_word: εἴξαμεν
  choice: não cedemos
  rationale: O verbo indica ceder ou dar lugar. “Não cedemos” mantém a recusa ativa e não o confunde com o substantivo seguinte.
- source_word: τῇ ὑποταγῇ
  choice: em submissão
  rationale: O dativo descreve a maneira ou esfera em que Paulo e seus companheiros não cederam. A formulação preserva a construção compacta e sua amplitude.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade da recusa e é a forma portuguesa natural de conservar essa relação.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: a verdade do evangelho
  rationale: Mantém a formulação paulina e o sentido reconhecível de εὐαγγέλιον sem paráfrase expansiva.
- source_word: διαμείνῃ
  choice: permanecesse
  rationale: Expressa a continuação ou preservação pretendida da verdade do evangelho; o subjuntivo é exigido naturalmente por “para que”.
- source_word: πρὸς ὑμᾶς
  choice: para vocês
  rationale: Preserva a provável orientação ou benefício referente aos gálatas, embora a construção também possa ser entendida como permanência entre eles.
theological_decisions:
- issue: Alcance da recusa de Paulo diante dos opositores
  choice: Paulo declara que ele e seus companheiros não cederam a eles de modo algum, para preservar a verdade do evangelho.
  alternative: A frase poderia ser delimitada à submissão pessoal ou a uma concessão institucional específica.
  rationale: O grego fala amplamente de não ceder “em submissão” e não obriga a restringir a declaração ao âmbito exclusivamente pessoal ou institucional.
- issue: Sentido de πρὸς ὑμᾶς
  choice: “para vocês”, destacando a orientação ou o benefício da preservação da verdade para os destinatários.
  alternative: “entre vocês” ou “com vocês”, destacando a presença contínua dessa verdade no meio deles.
  rationale: A preposição admite nuance relacional ou direcional neste contexto. O texto principal segue a leitura provável sem ocultar a alternativa legítima, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; a ordem direta conserva a ênfase da negação sem tornar a frase artificial.
