base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: pt
  text: Pois, por meio da lei, morri para a lei, a fim de viver para Deus. Fui crucificado com o Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e preserva de modo natural o encadeamento argumentativo.
- source_word: διὰ νόμου
  choice: por meio da lei
  rationale: Expressa o valor instrumental de διά com o genitivo. Embora νόμος não tenha artigo no grego, o contexto favorece a referência à lei.
- source_word: νόμῳ
  choice: para a lei
  rationale: Mantém a formulação paulina compacta de morrer para a lei, indicando o rompimento da relação com seu domínio sem explicar além do texto.
- source_word: ἀπέθανον
  choice: morri
  rationale: O pretérito perfeito português apresenta adequadamente o acontecimento decisivo expresso pelo aoristo.
- source_word: ἵνα θεῷ ζήσω
  choice: a fim de viver para Deus
  rationale: Comunica claramente a finalidade e preserva a orientação relacional do dativo θεῷ.
- source_word: Χριστῷ
  choice: com o Messias
  rationale: Traduz Χριστός como título messiânico e emprega o artigo exigido pelo uso natural do português.
- source_word: συνεσταύρωμαι
  choice: Fui crucificado com
  rationale: O pretérito perfeito passivo comunica naturalmente em português o ato passado; o contexto imediato sustenta sua relevância presente, própria do perfeito grego.
theological_decisions:
- issue: Se a relação entre a lei e a morte de Paulo deve ser explicitada
  choice: Manter a formulação compacta “por meio da lei, morri para a lei”
  alternative: “pela condenação da lei, morri para a lei” ou “por meio da lei, deixei de estar sujeito à observância legal”
  rationale: O grego é conciso e teologicamente denso. Uma expansão resolveria uma tensão que o próprio texto deixa aberta.
- issue: Como representar o perfeito συνεσταύρωμαι
  choice: “Fui crucificado com o Messias”
  alternative: “Estou crucificado com o Messias” ou “Tenho sido crucificado com o Messias”
  rationale: “Estou crucificado” pode reduzir o verbo a um estado, enquanto “tenho sido crucificado” sugere repetição ou continuidade inadequadas. O pretérito perfeito é a forma natural de apresentar o acontecimento consumado em português, sem negar seu resultado permanente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição deliberada de “lei” e a expressão “morri para a lei” preservam a concisão e a tensão do original.
