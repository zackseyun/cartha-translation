  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: pt
  text: Mas subi em resposta a uma revelação[a] e lhes expus o evangelho que proclamo entre os gentios, mas em privado aos que eram considerados influentes[b], para não correr o risco de estar correndo ou de ter corrido em vão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de uma revelação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos que tinham reputação”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para que eu não estivesse correndo nem tivesse corrido em vão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: subi
  rationale: Preserva o sentido simples de ir para um lugar geograficamente mais alto, sem acrescentar o destino implícito no contexto.
- source_word: κατὰ ἀποκάλυψιν
  choice: em resposta a uma revelação
  rationale: Expressa de modo natural que a revelação motivou a viagem, preservando a possível nuance causal indicada em nota.
- source_word: ἀνεθέμην
  choice: expus a eles
  rationale: Comunica a apresentação do evangelho para consideração sem sugerir necessariamente submissão formal ou dependência doutrinária.
- source_word: τὸ εὐαγγέλιον
  choice: o evangelho
  rationale: É a formulação corrente e concisa no contexto paulino.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: Neste contexto, refere-se aos não judeus, e não a nações em sentido geopolítico.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Indica que a exposição aos líderes ocorreu em âmbito privado, em contraste com uma apresentação pública.
- source_word: τοῖς δοκοῦσιν
  choice: aos que eram considerados influentes
  rationale: Preserva a nuance de reputação ou reconhecimento social sem afirmar de maneira absoluta nem depreciar a posição dessas pessoas.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: para não acontecer que eu estivesse correndo ou tivesse corrido em vão
  rationale: Mantém a imagem da corrida, o temor de trabalho infrutífero e a distinção aspectual entre a atividade em curso e a já realizada.
theological_decisions:
- issue: Se a apresentação privada do evangelho implica que Paulo o submeteu à correção ou aprovação apostólica
  choice: A tradução diz que Paulo “expôs” o evangelho, sem indicar subordinação doutrinária formal.
  alternative: “submeti a eles” ou uma formulação que exclua qualquer possibilidade de avaliação
  rationale: O verbo grego indica apresentação para consideração, mas não determina por si só nem submissão formal nem simples comunicação sem componente avaliativo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A construção preserva o movimento argumentativo e a tensão do original sem explicitar Jerusalém nem definir em excesso a autoridade dos líderes.
