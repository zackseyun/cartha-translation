revisions:
- from: Mas subi em resposta a uma revelação[a] e expus a eles o evangelho que proclamo entre os gentios — mas, em particular, aos que eram considerados influentes[b] —, para não acontecer que eu estivesse correndo ou tivesse corrido em vão[c].
  to: Mas subi em resposta a uma revelação[a] e lhes expus o evangelho que proclamo entre os gentios, mas em privado aos que eram considerados influentes[b], para não correr o risco de estar correndo ou de ter corrido em vão[c].
  rationale: A revisão substitui «em particular» por «em privado», que traduz explicitamente κατ’ ἰδίαν, e troca a construção pouco idiomática «para não acontecer que» por «para não correr o risco de», preservando a força de preocupação de μή πως e a distinção entre o esforço atual e o já realizado. As notas foram mantidas, com a nota c ajustada para apresentar uma alternativa portuguesa direta.
