    issue: «Em particular» não traduz claramente a privacidade de κατ’ ἰδίαν.
    rationale: Em português, «em particular» pode indicar seleção ou ênfase (‘especialmente’), ao passo que o grego indica uma comunicação em âmbito privado.
  - severity: medium
    issue: «Para não acontecer que eu estivesse correndo» é pouco natural.
    rationale: A construção é gramaticalmente possível, mas soa pesada e não exprime tão diretamente a apreensão de Paulo de que seu trabalho pudesse ser inútil.
