id: GAL.2.4
reference: Galatians 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: pt
  text: Mas, por causa dos falsos irmãos[a] introduzidos às escondidas, que se infiltraram para espionar a liberdade que temos no Messias Jesus[b], a fim de nos escravizar—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Falsos irmãos” preserva o termo familiar usado por Paulo; a expressão se refere a pessoas que se apresentavam como irmãos na fé.
    reason: cultural_note
  - marker: b
    text: Ou “Cristo Jesus”.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: introduzidos às escondidas
  rationale: Preserva a ideia de pessoas trazidas para dentro de modo clandestino e distingue o adjetivo do verbo seguinte.
- source_word: ψευδαδέλφους
  choice: falsos irmãos
  rationale: Mantém a linguagem familiar e a força polêmica de Paulo, em vez de substituí-la por uma paráfrase como “falsos crentes”.
- source_word: παρεισῆλθον
  choice: se infiltraram
  rationale: Expressa de modo natural em português a entrada clandestina e hostil sugerida pelo verbo.
- source_word: κατασκοπῆσαι
  choice: para espionar
  rationale: Conserva o sentido de observação secreta com intenção hostil.
- source_word: ἐλευθερίαν
  choice: liberdade
  rationale: É o equivalente contemporâneo mais direto e preserva a força social e teológica do termo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título, deixando audível a identificação de Jesus como o Messias.
- source_word: καταδουλώσουσιν
  choice: nos escravizar
  rationale: Reproduz claramente a ideia de reduzir alguém à escravidão, sem amenizar a metáfora.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: a fim de nos escravizar
  rationale: Exprime naturalmente a finalidade pretendida; o infinitivo português evita impor uma nuance modal não explicitada pelo contexto.
theological_decisions:
- issue: Χριστῷ como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto, a força titular de Χριστός continua inteligível. A alternativa tradicional é registrada em nota sem transformar a opção principal em afirmação denominacional.
- issue: Identidade dos ψευδαδέλφοι
  choice: falsos irmãos
  alternative: falsos crentes
  rationale: A tradução preserva a designação familiar usada por Paulo e não resolve além do texto se essas pessoas eram de fato crentes; a nota esclarece apenas que se apresentavam como membros da comunidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência “introduzidos às escondidas… se infiltraram” mantém a distinção entre os dois termos gregos e sua repetição enfática. O travessão final preserva a construção suspensa do versículo, que continua no v. 5.
