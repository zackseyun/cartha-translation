revisions:
- from: Mas, quando Cefas chegou a Antioquia[a], eu me opus a ele face a face, porque ele estava condenado[b].
  to: Quando, porém, Cefas chegou a Antioquia[a], eu me opus a ele diretamente, porque ele estava condenado[b].
  rationale: A revisão substitui uma expressão pouco idiomática por «diretamente», que comunica o sentido de κατὰ πρόσωπον αὐτῷ com clareza e registro adequado. Também ajusta a transição inicial para uma formulação portuguesa mais fluida. Mantêm-se «Cefas», o passivo «estava condenado» e as notas, preservando tanto a forma do nome no grego quanto a ambiguidade de κατεγνωσμένος ἦν.
