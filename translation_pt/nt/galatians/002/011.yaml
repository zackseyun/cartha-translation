source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: pt
  text: Quando, porém, Cefas chegou a Antioquia[a], eu me opus a ele diretamente, porque ele estava condenado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cefas é o nome aramaico de Pedro.
    reason: cross_reference
  - marker: b
    text: 'Ou: “porque ele estava claramente errado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Mas, quando
  rationale: Preserva a transição temporal e o contraste moderado de δέ em português natural.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Translitera a forma do nome presente no texto grego, sem substituí-la por Pedro; a identificação é esclarecida em nota.
- source_word: ἦλθεν
  choice: chegou
  rationale: No contexto de deslocamento a uma cidade, expressa naturalmente a chegada de Cefas a Antioquia.
- source_word: εἰς Ἀντιόχειαν
  choice: a Antioquia
  rationale: Forma idiomática em português para movimento em direção a uma cidade.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: a ele face a face
  rationale: Mantém a imagem enfática de confronto pessoal e direto, embora a expressão grega também possa ser vertida como 'na cara' ou 'diretamente' em registros diferentes.
- source_word: ἀντέστην
  choice: eu me opus
  rationale: Comunica de modo claro e digno a resistência aberta de Paulo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz diretamente a razão da oposição de Paulo.
- source_word: κατεγνωσμένος ἦν
  choice: ele estava condenado
  rationale: Preserva a voz passiva e o estado resultante da construção perifrástica, sem identificar explicitamente quem o condenava.
theological_decisions:
- issue: Identidade e forma de Κηφᾶς
  choice: Manter 'Cefas' no texto principal
  alternative: Usar 'Pedro' por ser mais familiar aos leitores
  rationale: O grego traz Κηφᾶς; preservar Cefas mantém a forma da fonte, enquanto a nota informa sua identificação tradicional com Pedro.
- issue: Sentido de κατεγνωσμένος ἦν
  choice: ele estava condenado
  alternative: ele estava claramente errado
  rationale: A opção principal mantém a forma passiva e a tensão sobre a fonte ou natureza da condenação; a alternativa explicita o sentido contextual possível sem ser imposta ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Face a face' conserva a vivacidade do confronto sem recorrer ao coloquial 'na cara'. A formulação 'estava condenado' preserva a ambiguidade teológica e gramatical do passivo grego.
