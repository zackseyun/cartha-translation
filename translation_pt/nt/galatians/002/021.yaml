  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: pt
  text: Não anulo a graça de Deus, pois, se a justiça[a] vem por meio da lei, então o Messias[b] morreu em vão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: Christós, isto é, “o Ungido”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “morreu para nada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: anulo
  rationale: Expressa tornar sem efeito ou invalidar, preservando a força do argumento de Paulo; “rejeito” seria possível, mas menos diretamente ligado à consequência lógica apresentada.
- source_word: χάριν
  choice: graça
  rationale: É a tradução corrente e adequada de χάρις neste contexto, mantendo tanto o sentido de favor divino quanto sua ressonância teológica.
- source_word: διὰ νόμου
  choice: por meio da lei
  rationale: Reproduz naturalmente em português a ideia instrumental de διά com genitivo, sem acrescentar um agente ou mecanismo não expresso.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: “Justiça” é o equivalente português tradicional e amplo, capaz de abranger a qualidade ou condição de estar em conformidade com o que é justo diante de Deus; a alternativa explicativa é preservada em nota.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Aqui Χριστός conserva força de título; “o Messias” comunica em português o sentido de “o Ungido” sem tratá-lo apenas como nome próprio.
- source_word: δωρεὰν
  choice: em vão
  rationale: No argumento condicional, o advérbio indica que a morte do Messias teria sido inútil ou sem necessidade; “em vão” é natural, digno e mantém essa força.
theological_decisions:
- issue: A relação entre justiça e lei no argumento de Paulo
  choice: A frase afirma condicionalmente que, se a justiça viesse por meio da lei, a morte do Messias teria sido em vão.
  alternative: Entender δικαιοσύνη com ênfase mais judicial ou pactual, como a condição de ser declarado justo diante de Deus.
  rationale: A tradução não especifica como a justiça seria obtida nem amplia “lei” para “obras da lei”; assim, preserva a formulação concisa e a tensão teológica do grego.
- issue: Valor titular de Χριστός
  choice: Traduzir como “o Messias”.
  alternative: Transliterar como “Cristo”.
  rationale: O artigo natural em português e o termo “Messias” deixam claro o caráter titular de Χριστός neste argumento, sem inserir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta e legibilidade brasileira. Mantém “lei” em minúscula para não decidir tipograficamente além do grego se a referência é exclusivamente à Lei mosaica. A ordem lógica e a concisão do período grego foram preservadas.
