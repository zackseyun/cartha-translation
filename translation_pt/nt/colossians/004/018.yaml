  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: pt
  text: Esta saudação foi escrita por mim, Paulo, de próprio punho.[a] Lembrem-se das minhas correntes.[b] A graça esteja com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a saudação final foi escrita pessoalmente por Paulo, com sua própria letra.
    reason: esclarecimento_epistolar
  - marker: b
    text: Ou “da minha prisão” ou “dos meus grilhões”. Literalmente, “das minhas correntes”.
    reason: alternativa_lexical
lexical_decisions:
- source_word: ἀσπασμός
  choice: saudação
  rationale: No contexto epistolar, refere-se à saudação final escrita pelo próprio Paulo; “saudação” é natural, corrente e preserva o sentido do termo grego.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: é de próprio punho — de mim, Paulo
  rationale: A expressão dativa identifica a caligrafia do próprio Paulo na conclusão. A formulação portuguesa torna explícita a elipse grega sem perder a ênfase pessoal.
- source_word: μνημονεύετέ
  choice: Lembrem-se
  rationale: O imperativo presente exorta os destinatários a manter Paulo e sua situação em mente; o imperativo simples é idiomático em português e não força uma nuance aspectual.
- source_word: μου τῶν δεσμῶν
  choice: das minhas correntes
  rationale: Preserva a imagem concreta de δεσμοί, que também funciona como metonímia da prisão de Paulo.
- source_word: ἡ χάρις
  choice: A graça
  rationale: Mantém o artigo presente no grego e a concisão da bênção paulina, sem acrescentar de quem procede a graça.
- source_word: μεθ’ ὑμῶν
  choice: esteja com vocês
  rationale: Supre naturalmente o verbo ausente na bênção grega; “vocês” oferece ampla legibilidade brasileira e representa o plural.
theological_decisions:
- issue: Bênção final paulina sem verbo explícito
  choice: A graça esteja com vocês
  alternative: A graça com vocês
  rationale: O grego é nominal e não traz verbo, mas o português corrente pede uma forma verbal. “Esteja” expressa a bênção sem acrescentar conteúdo teológico.
- issue: Referente não explicitado de “a graça”
  choice: A graça
  alternative: A graça de Deus / A graça do Senhor Jesus
  rationale: O texto grego não identifica explicitamente a fonte da graça neste versículo; a tradução preserva essa concisão e evita importar uma identificação.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. “De próprio punho” conserva o caráter pessoal da assinatura, e “correntes” mantém a imagem vívida do original.
