  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: pt
  text: 'Foi exatamente para isso que eu o enviei a vocês: para que saibam como estamos[a] e para que ele encoraje os corações de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “para que saibamos como vocês estão”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: o
  rationale: Pronome relativo acusativo masculino singular que retoma Tíquico; em português natural, o pronome oblíquo ligado a «enviei» expressa claramente a referência.
- source_word: ἔπεμψα
  choice: enviei
  rationale: O aoristo indicativo é adequadamente expresso pelo pretérito perfeito simples, sem acrescentar nuance aspectual indevida.
- source_word: πρὸς ὑμᾶς
  choice: a vocês
  rationale: Com verbo de envio, πρός com acusativo indica direção a pessoas. «A vocês» é claro, corrente e amplamente compreensível.
- source_word: εἰς αὐτὸ τοῦτο
  choice: justamente com este propósito
  rationale: A formulação preserva a ênfase de αὐτὸ τοῦτο e comunica naturalmente a finalidade específica da missão.
- source_word: ἵνα
  choice: para que
  rationale: Introduz de modo claro a oração de propósito e permite conservar o paralelismo das duas finalidades.
- source_word: γνῶτε
  choice: saibam
  rationale: O subjuntivo sob ἵνα exprime finalidade; «saibam» é a equivalência portuguesa natural e suficientemente ampla.
- source_word: τὰ περὶ ἡμῶν
  choice: como estamos
  rationale: A expressão se refere à situação de Paulo e seus companheiros. «Como estamos» preserva o caráter pessoal e evita uma formulação excessivamente abstrata.
- source_word: παρακαλέσῃ
  choice: encoraje
  rationale: No contexto da missão informativa e pastoral de Tíquico, «encoraje» abrange fortalecimento e consolo sem restringir o verbo apenas a exortação ou conforto.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração de vocês
  rationale: Mantém a imagem antropológica bíblica. O singular coletivo «o coração de vocês» é idiomático em português e representa naturalmente o plural grego.
theological_decisions:
- issue: Variação textual na direção do conhecimento na oração de propósito
  choice: 'Seguir o texto do SBLGNT: «para que saibam como estamos» (γνῶτε τὰ περὶ ἡμῶν).'
  alternative: «para que saibamos como vocês estão» (γνῶμεν τὰ περὶ ὑμῶν, ou variantes semelhantes).
  rationale: O texto principal segue a edição grega fornecida. Como a variante inverte quem recebe notícias sobre quem, ela é registrada em nota para preservar transparência textual e a diferença real de sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Vocês» evita regionalismo excessivo; «justamente com este propósito» preserva a ênfase sem rigidez; o paralelismo «para que... e para que...» torna explícitas as duas finalidades presentes no grego.
