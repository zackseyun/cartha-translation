id: COL.4.7
reference: Colossians 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow slave in the Lord[c][b], will make known to you everything about me.
translation:
  language: pt
  text: Tíquico, o irmão amado, ministro fiel[b] e conservo[c] no Senhor, dará a conhecer a vocês tudo o que diz respeito a mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as coisas a meu respeito” ou “todas as minhas circunstâncias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo fiel”. O grego διάκονος pode significar “ministro”, “servo” ou, em certos contextos, o ofício eclesiástico de “diácono”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “companheiro de serviço”; mais literalmente, “coescravo”. O grego σύνδουλος designa alguém que compartilha a condição de δοῦλος, isto é, de servo ou escravo sob um mesmo senhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: tudo o que diz respeito a mim
  rationale: A expressão abrange a situação, os assuntos e as circunstâncias de Paulo sem restringir o sentido a apenas um desses aspectos; πάντα é preservado por “tudo”.
- source_word: γνωρίσει ὑμῖν
  choice: dará a conhecer a vocês
  rationale: Reproduz o sentido futuro de γνωρίζω, “tornar conhecido, informar”, e explicita naturalmente o destinatário plural indicado por ὑμῖν.
- source_word: Τυχικὸς
  choice: Tíquico
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: o irmão amado
  rationale: Preserva tanto a linguagem familiar cristã de ἀδελφός quanto o afeto expresso por ἀγαπητός.
- source_word: πιστὸς διάκονος
  choice: ministro fiel
  rationale: διάκονος descreve aqui o serviço confiável de Tíquico, sem indicar inequivocamente o ofício eclesiástico posterior de diácono; “ministro” mantém essa amplitude funcional.
- source_word: σύνδουλος
  choice: conservo
  rationale: O composto designa alguém que compartilha com Paulo a condição de servo sob o mesmo Senhor. “Conservo” é conciso e preserva a ideia de serviço compartilhado, enquanto a nota registra explicitamente a força de δοῦλος.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a fórmula paulina e sua abertura relacional, espiritual e teológica, sem reduzi-la a “a serviço do Senhor”.
theological_decisions:
- issue: Força da linguagem de σύνδουλος / δοῦλος
  choice: conservo
  alternative: companheiro de escravidão; companheiro de serviço
  rationale: “Conservo” comunica a condição compartilhada de submissão e serviço ao Senhor sem resolver a metáfora apenas como atividade ministerial. Como o termo grego se apoia em δοῦλος e pode evocar serviço escravizado, essa força lexical é preservada em nota, evitando também impor ao texto todas as associações da escravidão racial moderna.
- issue: Sentido de ἐν κυρίῳ
  choice: no Senhor
  alternative: a serviço do Senhor
  rationale: A tradução formal preserva a tensão e a amplitude da expressão paulina, que pode indicar esfera de vida, união, pertencimento e serviço, em vez de selecionar somente uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A vocês” deixa claro o plural de ὑμῖν sem recorrer a regionalismos. A ordem dos qualificativos acompanha de perto o grego, e as notas preservam as principais alternativas sem sobrecarregar o texto principal.
