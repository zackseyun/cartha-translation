id: COL.4.15
reference: Colossians 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: pt
  text: Saúdem os irmãos que estão em Laodiceia, bem como Ninfa e a igreja que se reúne na casa dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Ninfas e a igreja que se reúne na casa dele”; outros, “na casa deles”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo aoristo médio, na segunda pessoa do plural, transmite uma ordem direta para comunicar saudações. “Saúdem” é natural, atual e preserva a força imperativa.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: os irmãos que estão em Laodiceia
  rationale: “Irmãos” conserva a forma masculina plural do grego, que no uso paulino pode abranger os cristãos de ambos os sexos. A oração “que estão” expressa com clareza a construção grega sem alterar seu referente.
- source_word: Νύμφαν
  choice: Ninfa
  rationale: O texto da SBLGNT traz Νύμφαν, forma acusativa normalmente entendida como o nome feminino Ninfa. A variante masculina é registrada em nota.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: a igreja que se reúne na casa dela
  rationale: A expressão idiomática κατ’ οἶκον designa uma comunidade cristã reunida numa casa. A explicitação “que se reúne” produz português natural e evita sugerir que o edifício em si seja a igreja; “dela” traduz αὐτῆς.
- source_word: ἐκκλησίαν
  choice: igreja
  rationale: No contexto paulino, ἐκκλησία designa a comunidade cristã reunida. “Igreja” é a tradução portuguesa corrente e apropriada.
theological_decisions:
- issue: Identidade ou gênero de Νύμφαν e pronome correspondente
  choice: Ninfa ... a igreja que se reúne na casa dela
  alternative: Ninfas ... a igreja que se reúne na casa dele; ou a igreja que se reúne na casa deles
  rationale: O texto crítico impresso traz o nome entendido como feminino e αὐτῆς, “dela”. Como há variantes manuscritas que apoiam formas masculina e plural, a tradução principal segue a SBLGNT e registra as demais leituras em nota, sem resolver silenciosamente a questão textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Bem como” liga naturalmente os destinatários, e “que se reúne” esclarece o sentido idiomático de uma igreja doméstica sem acrescentar conteúdo teológico.
