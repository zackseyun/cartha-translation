  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/004.yaml
  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: pt
  text: para que eu o torne conhecido[a], como devo falar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o revele” ou “o manifeste”. O pronome “o” se refere ao mistério mencionado no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “como é necessário que eu fale” ou “como tenho de falar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade do pedido de oração e preserva naturalmente a força final em português.
- source_word: φανερώσω
  choice: eu o torne conhecido
  rationale: Expressa a ideia de manifestar ou dar a conhecer o mistério por meio da fala, sem limitar o sentido apenas à clareza da exposição.
- source_word: αὐτὸ
  choice: o
  rationale: Mantém o pronome grego e retoma, no contexto, o mistério mencionado no versículo anterior.
- source_word: ὡς
  choice: como
  rationale: Introduz a maneira ou o padrão segundo o qual Paulo deve falar.
- source_word: δεῖ
  choice: devo
  rationale: Comunica de forma natural a necessidade ou obrigação expressa pelo verbo impessoal grego, preservando a possibilidade mais forte em nota.
- source_word: με
  choice: eu
  rationale: Embora esteja no acusativo como sujeito do infinitivo em grego, a construção idiomática portuguesa exige a primeira pessoa indicada pela flexão verbal.
- source_word: λαλῆσαι
  choice: falar
  rationale: É o equivalente amplo e direto do infinitivo, sem acrescentar a especificidade de 'proclamar'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação concisa. A ordem da frase segue de perto o grego sem soar artificial; as notas preservam a amplitude lexical de φανερόω e a força de necessidade de δεῖ.
