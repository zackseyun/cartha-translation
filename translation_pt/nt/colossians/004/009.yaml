lexical_decisions:
- source_word: σὺν
  choice: junto com
  rationale: Marca acompanhamento e liga Onésimo a Tíquico, mencionado no versículo anterior, em português natural.
- source_word: Ὀνησίμῳ
  choice: Onésimo
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: πιστῷ
  choice: fiel
  rationale: Preserva o sentido ético e relacional de alguém digno de confiança e constante na fé, sem explicitação indevida.
- source_word: ἀγαπητῷ
  choice: amado
  rationale: Mantém o afeto e o tom comunitário cristão do adjetivo grego.
- source_word: ἀδελφῷ
  choice: irmão
  rationale: Reproduz diretamente a linguagem familiar usada para um companheiro de fé.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: que é um de vocês
  rationale: Expressão portuguesa idiomática que comunica pertencimento à comunidade, preservando também a possível ideia de procedência.
- source_word: γνωρίσουσιν
  choice: contarão
  rationale: Verbo corrente e claro para o ato de informar ou dar a conhecer; o plural retoma Tíquico e Onésimo.
- source_word: πάντα ... τὰ ὧδε
  choice: tudo o que se passa por aqui
  rationale: Comunica naturalmente os assuntos ou a situação do lugar onde Paulo se encontra, embora a formulação grega seja mais compacta.
theological_decisions:
- issue: Sentido eclesial de ἀδελφῷ
  choice: irmão
  alternative: irmão na fé
  rationale: O contexto indica um companheiro cristão, mas a tradução conserva a forma simples do texto sem acrescentar uma explicação.
- issue: Força de ἐξ ὑμῶν
  choice: que é um de vocês
  alternative: que é dentre vocês / que vem do meio de vocês
  rationale: A redação destaca a identificação de Onésimo com os colossenses sem importar para o versículo afirmações sociais derivadas de Filemom.
- issue: Referência de τὰ ὧδε
  choice: tudo o que se passa por aqui
  alternative: todas as coisas daqui
  rationale: A expressão provavelmente abrange as circunstâncias e assuntos no local de Paulo; a nota registra uma tradução mais formal para não ocultar a concisão e abrangência do grego.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vocês” representa o plural ὑμῶν; “lhes” evita repetição pesada. A ordem e o vínculo com o versículo anterior foram preservados.
