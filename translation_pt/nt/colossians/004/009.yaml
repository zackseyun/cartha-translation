  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: pt
  text: junto com Onésimo, o fiel e amado irmão, que é um de vocês.[a] Eles lhes contarão tudo o que se passa por aqui.[b]
  philosophy: optimal-equivalence
  footnotes:
