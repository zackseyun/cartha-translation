  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: pt
  text: E, quando esta carta tiver sido lida entre vocês, providenciem para que ela também seja lida na igreja dos laodicenses; e vocês também leiam a de Laodiceia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “a carta de Laodiceia”. A identidade dessa carta é incerta; a expressão pode referir-se a uma carta que estava em Laodiceia ou que vinha de lá, sem necessariamente ter sido escrita para aquela igreja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: tiver sido lida / leiam
  rationale: ἀναγινώσκω significa “ler” e, neste contexto comunitário, provavelmente envolve leitura pública. “Ler” mantém naturalidade e não torna explícito o que o verbo apenas sugere pelo contexto.
- source_word: παρ’ ὑμῖν
  choice: entre vocês
  rationale: A construção com παρά e dativo tem aqui sentido locativo e social, referindo-se à leitura no meio da comunidade colossense, e não apenas à agência dos destinatários.
- source_word: ἡ ἐπιστολή
  choice: esta carta
  rationale: O artigo aponta para a carta presente, enviada aos colossenses. O demonstrativo deixa essa referência clara em português corrente.
- source_word: ποιήσατε ἵνα
  choice: providenciem para que
  rationale: A expressão introduz uma ordem para garantir que a ação seguinte aconteça. Esta formulação conserva a força imperativa de modo natural.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: na igreja dos laodicenses
  rationale: Mantém ἐκκλησία como “igreja” no contexto paulino e preserva a construção que identifica a comunidade formada pelos laodicenses.
- source_word: τὴν ἐκ Λαοδικείας
  choice: a que vem de Laodiceia
  rationale: O substantivo “carta” está subentendido no grego. A formulação portuguesa conserva essa elipse e traduz ἐκ em seu sentido normal de procedência, sem decidir a identidade ou o destino original da carta.
theological_decisions:
- issue: Identidade da carta relacionada a Laodiceia
  choice: Traduzir de maneira neutra como “a que vem de Laodiceia”
  alternative: Identificá-la como uma carta de Paulo dirigida aos laodicenses, como uma carta enviada de Laodiceia ou como uma carta circular possivelmente conhecida por outro nome
  rationale: O grego indica procedência ou relação de origem com Laodiceia, mas não identifica o documento nem afirma que ele tenha sido originalmente endereçado àquela igreja. A tradução preserva essa incerteza.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Providenciem para que” comunica a ordem sem rigidez excessiva; “laodicenses” segue o gentílico bíblico corrente.
