id: COL.4.12
reference: Colossians 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a slave of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: pt
  text: Epafras, que é um de vocês, os saúda. Ele é escravo do Messias e está sempre lutando por vocês em suas orações, para que estejam firmes, maduros e plenamente convictos[a] em toda a vontade de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “plenamente firmados” ou “plenamente seguros”. O termo grego pode indicar tanto plena convicção quanto uma condição de firme estabelecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: saúda
  rationale: Expressa de modo conciso e natural o sentido epistolar comum do verbo.
- source_word: ὁ ἐξ ὑμῶν
  choice: que é um de vocês
  rationale: Indica naturalmente que Epafras pertence à comunidade colossense.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a ideia forte de pertencimento e submissão total presente no termo grego, sem reduzi-la ao serviço voluntário.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o sentido titular de Χριστός sem acrescentar o nome Jesus, ausente neste versículo.
- source_word: ἀγωνιζόμενος
  choice: lutando
  rationale: Conserva a intensidade e a imagem de esforço árduo do particípio grego.
- source_word: ἐν ταῖς προσευχαῖς
  choice: em suas orações
  rationale: Identifica Epafras como aquele que ora e comunica a ideia de intercessão reiterada.
- source_word: ἵνα σταθῆτε
  choice: para que permaneçam
  rationale: Em português corrente, transmite a ideia contextual de manter-se ou continuar em determinada condição, sem tornar a construção artificial.
- source_word: τέλειοι
  choice: maduros
  rationale: Neste contexto paulino, o termo aponta para maturidade ou integridade espiritual, não necessariamente para perfeição sem pecado.
- source_word: πεπληροφορημένοι
  choice: plenamente convictos
  rationale: Expressa o estado de plena certeza indicado pelo particípio perfeito, mantendo em nota a possibilidade de uma nuance de firme estabelecimento.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: em toda a vontade de Deus
  rationale: Mantém a amplitude e a relativa abertura da expressão grega, sem decidir se ela indica esfera, conteúdo ou conformidade.
theological_decisions:
- issue: Sentido de Χριστοῦ em δοῦλος Χριστοῦ
  choice: escravo do Messias
  alternative: escravo de Cristo
  rationale: A opção traduz o título Χριστός e preserva sua referência messiânica, sem acrescentar “Jesus”, que não aparece no texto grego deste versículo.
- issue: Força de δοῦλος
  choice: escravo
  alternative: servo
  rationale: “Escravo” retém a força de pertencimento e sujeição total; “servo” seria mais suave e poderia obscurecer essa dimensão.
- issue: Sentido de πεπληροφορημένοι
  choice: plenamente convictos
  alternative: plenamente firmados
  rationale: A leitura principal ressalta plena certeza, mas a forma grega também pode ser entendida como condição plenamente estabelecida; a nota conserva essa tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases evita uma sequência pesada de apostos sem alterar as relações do texto. “Messias” preserva o valor do título; “escravo” mantém deliberadamente a força do vínculo expresso por δοῦλος.
