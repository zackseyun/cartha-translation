  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: pt
  text: Que a fala de vocês seja sempre cheia de graça[a], temperada com sal[b], para que saibam como devem responder a cada pessoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amável”. A expressão “cheia de graça” pode indicar uma fala marcada por bondade, amabilidade ou favor.
    reason: lexical_alternative
  - marker: b
    text: “Temperada com sal” é uma metáfora para uma fala apropriada, cativante e sábia, não insípida nem nociva.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: a palavra de vocês
  rationale: Neste contexto de exortação, λόγος se refere à fala ou conversa dos cristãos. “A palavra de vocês” preserva a forma singular do grego e é uma expressão natural em português para o modo de falar.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente temporal direto e natural, preservando o alcance abrangente do original.
- source_word: ἐν χάριτι
  choice: cheia de graça
  rationale: Expressa uma fala caracterizada pela graça e pela bondade, sem eliminar a ressonância teológica mais ampla de χάρις. A nota registra uma alternativa mais explicitamente interpessoal.
- source_word: ἅλατι ἠρτυμένος
  choice: temperada com sal
  rationale: Preserva a metáfora culinária e comunica uma qualidade resultante da fala. A concordância no feminino acompanha “palavra” em português.
- source_word: εἰδέναι
  choice: para que saibam
  rationale: O infinitivo tem ligação sintática difícil com a exortação anterior. A formulação de finalidade ou resultado produz português claro sem apresentar como indiscutível uma análise excessivamente específica.
- source_word: δεῖ
  choice: devem
  rationale: Comunica aquilo que é necessário ou apropriado no contexto, com força pastoral natural em português.
- source_word: ἑνὶ ἑκάστῳ
  choice: a cada pessoa
  rationale: Preserva a força distributiva da expressão, destacando que a resposta deve considerar cada indivíduo.
- source_word: ἀποκρίνεσθαι
  choice: responder
  rationale: Equivalente direto e idiomático para dar uma resposta em contexto de conversa.
