source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: pt
  text: 'Aristarco, meu companheiro de prisão, manda saudações a vocês, bem como Marcos, primo[a] de Barnabé (a respeito de Marcos vocês receberam instruções: se ele for até vocês, acolham-no[b]),'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma tradição antiga de tradução: “sobrinho”. No grego koiné, porém, o termo significa mais precisamente “primo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “recebam-no”. O verbo grego pode se referir a receber alguém com hospitalidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: manda saudações a vocês
  rationale: A forma verbal é típica das saudações epistolares. A expressão é natural em português atual e comunica claramente que Aristarco envia suas saudações aos destinatários.
- source_word: συναιχμάλωτός
  choice: companheiro de prisão
  rationale: O substantivo composto designa alguém preso ou cativo junto com outra pessoa. A formulação preserva o sentido direto sem acrescentar uma explicação espiritual ausente do versículo.
- source_word: ἀνεψιὸς
  choice: primo
  rationale: No grego koiné, ἀνεψιός designa mais precisamente um primo. Algumas tradições antigas usam 'sobrinho', alternativa registrada em nota por sua presença na história da tradução.
- source_word: ἐλάβετε ἐντολάς
  choice: vocês receberam instruções
  rationale: ἐντολή pode indicar ordem ou instrução. Neste contexto de viagem e acolhimento, 'instruções' mantém o caráter diretivo sem sugerir uma dureza maior que a expressa pelo grego.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: se ele for até vocês
  rationale: A construção com ἐάν e subjuntivo apresenta uma condição futura. Esta formulação é clara, natural e evita a ambiguidade que 'vier a vocês' poderia causar em parte do mundo lusófono.
- source_word: δέξασθε αὐτόν
  choice: acolham-no
  rationale: No contexto de visita e hospitalidade, δέχομαι pode significar receber favoravelmente ou acolher. 'Acolham-no' expressa essa dimensão relacional em português contemporâneo.
theological_decisions:
- issue: Natureza da relação de Paulo com Aristarco em συναιχμάλωτός μου
  choice: companheiro de prisão
  alternative: companheiro de cativeiro no Senhor; companheiro de trabalho em meio ao sofrimento
  rationale: A tradução mantém o sentido lexical sem decidir se a prisão deve ser entendida literalmente ou como imagem ligada ao serviço cristão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “vocês” para o plural e “manda saudações” como fórmula epistolar natural. A repetição de “Marcos” dentro do parêntese esclarece o referente de “quem” sem alterar o conteúdo. A vírgula final preserva o fato de que a frase prossegue no versículo seguinte.
