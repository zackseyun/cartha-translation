id: COL.4.1
reference: Colossians 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your slaves with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: pt
  text: Senhores, deem aos seus escravos o que é justo e equitativo[a], sabendo que vocês também têm um Senhor no céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é justo e a igualdade”. O termo grego traduzido como “equitativo” também pode significar “igualdade” ou “equidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Senhores
  rationale: No código doméstico, refere-se aos senhores humanos em relação aos escravos. “Senhores” mantém a correspondência lexical com κύριον mais adiante, enquanto o contexto distingue claramente os senhores terrenos do Senhor celestial.
- source_word: τὸ δίκαιον
  choice: o que é justo
  rationale: O adjetivo substantivado designa aquilo que é justo ou correto; esta formulação é natural, clara e preserva sua força ética.
- source_word: τὴν ἰσότητα
  choice: equitativo
  rationale: Ἰσότης pode expressar equidade, imparcialidade ou igualdade. “Equitativo” se encaixa naturalmente na exigência de tratamento justo, sem eliminar a possibilidade lexical de “igualdade”, registrada em nota.
- source_word: τοῖς δούλοις
  choice: aos seus escravos
  rationale: A relação social de escravidão é explícita pela contraposição com οἱ κύριοι; “escravos” evita suavizar o estatuto de sujeição indicado por δοῦλοι.
- source_word: παρέχεσθε
  choice: deem
  rationale: O imperativo pede que os senhores concedam ou proporcionem determinado tratamento. “Deem” é direto, corrente e funciona naturalmente com “o que é justo e equitativo”.
- source_word: εἰδότες
  choice: sabendo
  rationale: Preserva a construção participial e deixa aberta sua nuance de circunstância ou fundamento da ordem.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: Mantém a ênfase de que os próprios senhores humanos estão igualmente debaixo de autoridade.
- source_word: κύριον
  choice: um Senhor
  rationale: “Senhor” preserva o peso teológico do título e, pela repetição lexical, ressalta que os senhores terrenos também estão sujeitos a um Senhor.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: É a forma idiomática e clara de traduzir a expressão locativa no singular.
theological_decisions:
- issue: Tradução de δοῦλοι no código doméstico
  choice: escravos
  alternative: servos
  rationale: Como a relação entre senhores e pessoas escravizadas está explicitamente em foco, “escravos” representa com maior precisão a realidade social, sem atenuá-la.
- issue: Tradução de ἰσότητα
  choice: equitativo
  alternative: igualdade
  rationale: O contexto favorece a ideia de tratamento equitativo, mas o termo também pode significar “igualdade”. A tradução principal comunica o mandamento naturalmente, e a nota preserva a alternativa relevante sem resolver indevidamente a amplitude lexical.
- issue: Relação entre κύριοι e κύριον
  choice: Senhores / Senhor
  alternative: donos / Senhor
  rationale: 'A repetição de “Senhor” conserva o jogo lexical e a tensão teológica: aqueles que exercem senhorio terreno reconhecem um Senhor no céu. O contexto e a capitalização distinguem os referentes.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “vocês” torna explícito o plural; “deem” mantém a ordem direta. A nota conserva a ambiguidade significativa de ἰσότης.
