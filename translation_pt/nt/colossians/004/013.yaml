source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: pt
  text: Pois dou testemunho a respeito dele de que se esforça muito por vocês, pelos que estão em Laodiceia e pelos que estão em Hierápolis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalha arduamente”, “tem grande preocupação” ou “sofre profunda angústia”. A expressão grega pode indicar labor penoso e, por extensão neste contexto, intensa preocupação.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: dou testemunho
  rationale: Mantém a afirmação direta, no presente, de que Paulo atesta pessoalmente o que diz sobre Epafras, sem acrescentar uma nuance modal como em “posso testemunhar”.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com o versículo anterior em linguagem portuguesa corrente e digna.
- source_word: αὐτῷ
  choice: a respeito dele
  rationale: Com μαρτυρέω, o dativo identifica a pessoa acerca de quem se dá testemunho. “A respeito dele” é natural em português e evita atribuir ao texto uma conotação jurídica forte, embora “a favor dele” também seja possível.
- source_word: ὅτι
  choice: de que
  rationale: Introduz naturalmente, após “dou testemunho a respeito dele”, o conteúdo do testemunho.
- source_word: ἔχει πολὺν πόνον
  choice: se esforça muito
  rationale: Expressa em português natural a ideia de esforço intenso contida literalmente em “tem muito labor”, evitando uma construção pouco idiomática. Não restringe πόνος apenas a preocupação emocional nem apenas a trabalho físico.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: ὑπέρ indica esforço em benefício dos destinatários. “Por vocês” é conciso e deixa clara a referência plural no português de ampla legibilidade brasileira.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: pelos que estão em Laodiceia
  rationale: Reproduz de modo claro e paralelo a referência às pessoas, provavelmente os fiéis, naquela cidade, sem inserir explicitamente “irmãos” ou “crentes”.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: pelos que estão em Hierápolis
  rationale: Mantém o paralelismo sintático e usa a forma portuguesa corrente do nome da cidade.
theological_decisions:
- issue: Sentido de πόνος no ministério de Epafras
  choice: se esforça muito
  alternative: tem grande preocupação; sofre profunda angústia; trabalha arduamente
  rationale: O contexto imediato menciona a luta de Epafras em oração, o que permite uma dimensão afetiva, mas πόνος denota primariamente labor, esforço, fadiga ou aflição. A formulação escolhida conserva a amplitude do termo sem decidir que se trata exclusivamente de trabalho ministerial, preocupação ou angústia.
- issue: Função do dativo αὐτῷ
  choice: a respeito dele
  alternative: a favor dele
  rationale: O dativo pode marcar a pessoa em favor de quem ou acerca de quem se testemunha. No contexto, Paulo apresenta uma atestação positiva sobre Epafras; “a respeito dele” comunica isso sem impor uma cena formal de defesa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção “se esforça muito” prioriza naturalidade sem apagar a amplitude semântica do grego. O marcador [a] aparece no texto principal e remete às alternativas lexicais genuínas.
