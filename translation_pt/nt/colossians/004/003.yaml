  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: pt
  text: enquanto também oram por nós, para que Deus nos abra uma porta para a palavra[a], a fim de falarmos o mistério do Messias[b], por causa do qual também estou preso[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma porta para a mensagem”; isto é, uma oportunidade para a palavra.
    reason: Alternativa lexical e esclarecimento da metáfora.
  - marker: b
    text: 'Grego: “do Cristo”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: Registra a forma grega e a alternativa tradicional sem ocultar o valor titular.
  - marker: c
    text: Ou “por causa do qual também estou acorrentado”.
    reason: Alternativa que torna mais explícita a imagem de prisão em δέδεμαι.
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: enquanto oram também por nós
  rationale: Mantém a ligação participial com a exortação do versículo anterior, comunica simultaneidade e adição sem reproduzir de modo rígido a sequência grega ἅμα καὶ, e verte περί naturalmente como “por” no contexto de oração.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: para que Deus nos abra
  rationale: Expressa o conteúdo e a finalidade da oração; “nos abra” é uma formulação corrente em português e conserva o caráter de pedido do subjuntivo.
- source_word: θύραν τοῦ λόγου
  choice: uma porta para a palavra
  rationale: Preserva a metáfora da porta e a referência paulina à palavra proclamada, sem reduzi-la no texto principal à paráfrase interpretativa “oportunidade para anunciar a mensagem”.
- source_word: λαλῆσαι
  choice: a fim de falarmos
  rationale: O infinitivo indica a finalidade da porta aberta. “Falarmos” conserva o sentido direto de λαλέω e torna explícito em português que a ação se refere ao grupo indicado por “nos”.
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: o mistério do Messias
  rationale: “Mistério” mantém o vocabulário paulino para o propósito divino antes oculto e agora revelado. “Messias” comunica o valor titular de Χριστός neste contexto.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: pelo qual também estou preso
  rationale: “Pelo qual” preserva a relação causal e sua referência mais natural ao mistério mencionado. “Estou preso” expressa o estado presente resultante indicado pelo perfeito passivo, sem exigir que a metáfora de estar amarrado seja entendida literalmente.
theological_decisions:
- issue: Valor de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Χριστός funciona aqui como título semanticamente relevante. “Messias” torna esse valor transparente, enquanto a nota registra a forma grega e a alternativa tradicional.
- issue: Metáfora de θύραν τοῦ λόγου
  choice: porta para a palavra
  alternative: oportunidade para a mensagem
  rationale: A imagem paulina é mantida no texto, sem decidir por completo se a “porta” representa oportunidade, acesso ou receptividade para a proclamação.
- issue: Referente de δι’ ὃ
  choice: pelo qual
  alternative: por causa do qual
  rationale: A forma relativa conserva a coesão com “mistério”, seu antecedente gramatical mais próximo, e evita ampliar o texto para uma explicação doutrinária da causa da prisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção inicial permanece subordinada ao versículo anterior, e a vírgula final conserva a continuidade sintática com o versículo seguinte. Evitaram-se tanto o decalque rígido “ao mesmo tempo também” quanto uma paráfrase que eliminasse as imagens de “porta” e de estar “preso”.
