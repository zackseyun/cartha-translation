  text: Dediquem-se à oração, mantendo-se vigilantes nela com ações de graças,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: à oração
  rationale: O dativo com artigo apresenta a oração como prática contínua; em português, a construção natural com «dedicar-se» pede «à oração».
- source_word: προσκαρτερεῖτε
  choice: Dediquem-se
  rationale: O imperativo presente transmite compromisso persistente e contínuo. «Dediquem-se» preserva a força exortativa em português atual e natural.
- source_word: γρηγοροῦντες
  choice: mantendo-se vigilantes
  rationale: 'O particípio descreve a maneira de perseverar na oração: com atenção contínua. A formulação evita a leitura excessivamente literal de permanecer fisicamente acordado.'
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome retoma naturalmente «oração» e conserva a estrutura anafórica do grego sem repetição desnecessária.
- source_word: ἐν εὐχαριστίᾳ
  choice: com gratidão
  rationale: A expressão indica a atitude que acompanha a vigilância na oração. «Com gratidão» é clara, digna e natural em português contemporâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural «dediquem-se» corresponde ao imperativo plural grego; «mantendo-se vigilantes» conserva a relação circunstancial do particípio com a ordem principal. A vírgula final foi mantida porque o versículo integra uma frase que prossegue no contexto imediato.
