id: COL.4.17
reference: Colossians 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: pt
  text: 'E digam a Arquipo: “Cuide do ministério que você recebeu no Senhor,[a] para que o cumpra plenamente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “que você recebeu da parte do Senhor”.
    reason: Registra a possível nuance de origem em ἐν κυρίῳ sem eliminar do texto principal o sentido mais formal “no Senhor”.
lexical_decisions:
- source_word: εἴπατε
  choice: digam
  rationale: O imperativo aoristo plural dirige a ordem à comunidade. “Digam” preserva de modo natural e direto tanto o número plural quanto a força imperativa.
- source_word: Ἀρχίππῳ
  choice: Arquipo
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Βλέπε
  choice: Cuide
  rationale: O imperativo presente singular pede atenção contínua à responsabilidade confiada. “Cuide do” comunica essa vigilância de modo atual e natural, sem arcaísmo.
- source_word: διακονίαν
  choice: ministério
  rationale: O termo pode designar serviço, tarefa ou encargo ministerial. “Ministério” expressa aqui um serviço cristão confiado sem especificar indevidamente um cargo eclesiástico.
- source_word: παρέλαβες
  choice: recebeu
  rationale: Preserva a ideia de que Arquipo recebeu um encargo, em vez de o assumir por iniciativa própria.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Reproduz de perto a preposição ἐν e mantém aberta a nuance de esfera, relação ou associação com o Senhor, sem convertê-la silenciosamente em uma indicação inequívoca de origem.
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a finalidade da exortação.
- source_word: πληροῖς
  choice: cumpra plenamente
  rationale: O verbo neste contexto envolve levar o ministério à plena execução ou conclusão. “Cumpra plenamente” torna essa amplitude mais clara do que apenas “cumpra”.
theological_decisions:
- issue: Nuance de ἐν κυρίῳ
  choice: no Senhor
  alternative: da parte do Senhor
  rationale: Embora a expressão possa ser entendida por implicação como indicação de que o ministério veio do Senhor, o texto grego usa ἐν. A tradução principal preserva a formulação e sua abertura relacional, enquanto a nota registra a possibilidade de origem.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O tratamento por “você” acompanha o singular dirigido a Arquipo; “digam” deixa claro que a ordem inicial é dada à comunidade.
