id: COL.4.11
reference: Colossians 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: pt
  text: e Jesus, chamado Justo. Esses são os únicos dentre os da circuncisão que colaboram comigo em favor do Reino de Deus[a] e se tornaram um consolo para mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esses são os únicos colaboradores em favor do Reino de Deus que são da circuncisão”. A expressão “os da circuncisão” refere-se aqui a pessoas de origem judaica.'
    reason: Preserva uma possibilidade sintática alternativa e esclarece a expressão identitária sem substituir sua forma no texto principal.
  - marker: b
    text: 'Ou: “e foram um consolo para mim” ou “e foram um encorajamento para mim”.'
    reason: Registra alternativas naturais para a construção ἐγενήθησαν μοι παρηγορία, incluindo as nuances de consolo e encorajamento.
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: Jesus, chamado Justo
  rationale: Mantém a forma neotestamentária reconhecível do nome Ἰησοῦς e apresenta Ἰοῦστος como o nome pelo qual ele era chamado, em português natural e conciso.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: dentre os da circuncisão
  rationale: Preserva a metáfora identitária do grego e evita substituir no texto principal a expressão por uma interpretação como 'judeus' ou 'cristãos de origem judaica'.
- source_word: οὗτοι μόνοι
  choice: Esses são os únicos
  rationale: Conserva a ênfase de exclusividade e, com 'dentre', deixa claro que a restrição se aplica ao grupo anteriormente identificado.
- source_word: συνεργοὶ
  choice: trabalham comigo
  rationale: Expressa com naturalidade a ideia relacional de colaboradores de Paulo, sem o peso corporativo que 'colegas de trabalho' pode ter no português atual.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: em favor do Reino de Deus
  rationale: Representa o sentido de serviço ou finalidade de εἰς ligado a συνεργοί e mantém a expressão bíblica estabelecida 'Reino de Deus'.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: têm sido um consolo para mim
  rationale: Verte idiomaticamente a construção com γίνομαι e o substantivo παρηγορία, comunicando a experiência de consolo recebida por Paulo sem forçar apenas o aspecto ingressivo 'tornaram-se'.
theological_decisions:
- issue: Identidade dos 'da circuncisão'
  choice: Manter a designação metafórica 'os da circuncisão' no texto principal
  alternative: Explicitar 'os judeus', 'os cristãos de origem judaica' ou 'o partido da circuncisão'
  rationale: No contexto, a expressão provavelmente identifica colaboradores de origem judaica, mas o texto não define se a referência deve ser entendida como simples origem étnico-religiosa ou como rótulo mais restrito. A formulação conserva essa tensão.
- issue: Alcance de μόνοι ('únicos')
  choice: Os únicos colaboradores de Paulo dentre os da circuncisão
  alternative: Os únicos colaboradores de Paulo em sentido absoluto
  rationale: A ordem e a estrutura do grego primeiro delimitam o grupo 'os da circuncisão' e então afirmam que estes são os únicos, evitando a leitura de que Paulo não tinha quaisquer outros colaboradores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construção natural no Brasil. 'Reino de Deus' recebe maiúscula por convenção editorial. A coordenação foi ajustada para evitar repetição pesada de orações relativas, mantendo a lógica do grego.
