  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: pt
  text: Lucas, o médico amado, e Demas enviam saudações a vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: enviam saudações
  rationale: A fórmula epistolar significa saudar ou transmitir saudações. Embora o grego tenha verbo singular antes de um sujeito composto, o português natural emprega o plural com “Lucas ... e Demas”.
- source_word: ὑμᾶς
  choice: a vocês
  rationale: O pronome é plural e se refere coletivamente aos destinatários colossenses; “a vocês” torna explícito esse número em português amplamente compreensível.
- source_word: Λουκᾶς
  choice: Lucas
  rationale: Forma portuguesa tradicional e corrente do nome próprio grego.
- source_word: ἰατρὸς
  choice: médico
  rationale: Equivalente direto, atual e historicamente apropriado para ἰατρός.
- source_word: ἀγαπητὸς
  choice: amado
  rationale: Preserva a afeição e a estima expressas pelo adjetivo, com tom digno e natural.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga Demas a Lucas como remetentes das saudações.
- source_word: Δημᾶς
  choice: Demas
  rationale: Transliteração tradicional e corrente do nome próprio.
theological_decisions:
- issue: Alcance do qualificativo “amado”
  choice: “o médico amado” qualifica somente Lucas.
  alternative: Entender ou pontuar a frase de modo que haja ambiguidade quanto ao alcance do qualificativo.
  rationale: A construção grega ὁ ἰατρὸς ὁ ἀγαπητός está em aposição direta a Λουκᾶς e atribui a Lucas tanto a profissão quanto o qualificativo afetivo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Enviam saudações a vocês” reproduz naturalmente a fórmula epistolar e explicita o plural dos destinatários.
