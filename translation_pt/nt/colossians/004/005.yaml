  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: pt
  text: Vivam com sabedoria para com os de fora[a], aproveitando ao máximo a oportunidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aqueles que estão de fora”, isto é, fora da comunidade dos que creem.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “resgatando o tempo” ou “comprando-o”; o sentido é aproveitar plenamente a ocasião favorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: com sabedoria
  rationale: Expressa de modo natural em português a maneira ou esfera da conduta, preservando o substantivo σοφία e seu peso ético.
- source_word: περιπατεῖτε
  choice: vivam
  rationale: O verbo é usado metaforicamente para o modo de viver. Embora “andem” preserve a imagem grega, “vivam” comunica com mais naturalidade o sentido corrente em português moderno.
- source_word: πρὸς τοὺς ἔξω
  choice: em relação aos de fora
  rationale: Mantém a orientação relacional de πρός e a expressão comunitária οἱ ἔξω sem transformar explicitamente o grupo em “não crentes”, formulação mais interpretativa.
- source_word: τὸν καιρόν
  choice: cada oportunidade
  rationale: Neste contexto, καιρός indica ocasião favorável, não o tempo abstrato. “Cada oportunidade” torna esse valor contextual claro em português idiomático.
- source_word: ἐξαγοραζόμενοι
  choice: aproveitando ao máximo
  rationale: O particípio tem aqui o sentido idiomático de tirar pleno proveito de uma ocasião. A escolha evita sugerir, indevidamente, a doutrina da redenção, enquanto a metáfora comercial é registrada em nota.
theological_decisions:
- issue: Possível leitura teológica excessiva de ἐξαγοραζόμενοι
  choice: Exortação a aproveitar plenamente as oportunidades no relacionamento com pessoas de fora da comunidade cristã
  alternative: “Remindo o tempo”, expressão mais literal que pode evocar linguagem de redenção espiritual
  rationale: No contexto, o verbo descreve o aproveitamento diligente de ocasiões oportunas, não a redenção expiatória. A tradução preserva o sentido contextual sem introduzir uma afirmação doutrinária ausente do versículo.
- issue: Identidade de τοὺς ἔξω
  choice: “os de fora”, com explicação em nota
  alternative: “os não crentes” ou “os que não pertencem à igreja”
  rationale: A expressão grega define o grupo por sua posição fora da comunidade, sem especificar aqui todos os critérios dessa condição. A formulação escolhida preserva essa perspectiva e evita estreitar o sentido no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vivam” comunica naturalmente a metáfora ética de περιπατεῖτε; “os de fora” conserva a linguagem relacional do original, e a nota esclarece seu referente. A ordem dos marcadores segue sua ocorrência no texto.
