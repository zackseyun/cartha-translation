  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow slave, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: pt
  text: assim como aprenderam de Epafras, nosso amado coescravo[a], que é fiel ministro do Messias[b] em nosso favor[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso amado companheiro de serviço”. O termo grego σύνδουλος designa literalmente alguém escravizado juntamente com outra pessoa sob o mesmo senhor.
    reason: lexical_alternative
  - marker: b
    text: Grego Χριστοῦ; também pode ser traduzido por “de Cristo”.
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos trazem “em favor de vocês”. A expressão “em nosso favor” também pode ser traduzida por “por nós”.
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Preserva a ligação comparativa com a afirmação anterior de modo natural em português.
- source_word: ἐμάθετε ἀπὸ
  choice: aprenderam de
  rationale: O aoristo aponta para o recebimento anterior da mensagem, e ἀπό identifica Epafras como a fonte humana desse aprendizado.
- source_word: Ἐπαφρᾶ
  choice: Epafras
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀγαπητοῦ συνδούλου ἡμῶν
  choice: nosso amado coescravo
  rationale: Mantém tanto o afeto expresso por ἀγαπητός como a imagem de pessoas escravizadas sob o mesmo senhor presente em σύνδουλος.
- source_word: πιστὸς ... διάκονος
  choice: fiel ministro
  rationale: Comunica serviço confiável sem tratar necessariamente διάκονος como o título técnico de um cargo eclesiástico.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Expressa o conteúdo titular de Χριστός, isto é, o Ungido, em vez de reduzir o termo a uma forma semelhante a nome próprio.
- source_word: ὑπὲρ ἡμῶν
  choice: em nosso favor
  rationale: Preserva a ideia de benefício ou representação indicada por ὑπέρ com o genitivo, em português natural.
theological_decisions:
- issue: Linguagem de σύνδουλος
  choice: coescravo
  alternative: companheiro de serviço
  rationale: A escolha preserva a relação comum de sujeição a um mesmo senhor, sem suavizar a metáfora de escravidão do grego.
- issue: Sentido de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste sintagma, o termo pode ser ouvido como título; “Messias” torna explícito seu conteúdo sem acrescentar uma interpretação denominacional.
- issue: Referente de ὑπὲρ ἡμῶν
  choice: em nosso favor
  alternative: em favor de vocês
  rationale: O texto adotado pelo SBLGNT traz ἡμῶν (“nosso”), mas há uma variante textual antiga e relevante com ὑμῶν (“de vocês”), que deve permanecer visível ao leitor.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Coescravo” é deliberadamente mais marcado do que “companheiro de serviço”, pois conserva a força de σύνδουλος; a nota oferece a alternativa mais idiomática. A pontuação final mantém a continuidade sintática do contexto maior.
