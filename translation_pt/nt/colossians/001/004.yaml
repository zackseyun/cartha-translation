id: COL.1.4
reference: Colossians 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: pt
  text: tendo ouvido falar da fé de vocês no Messias Jesus e do amor que vocês têm por todos os santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da fidelidade de vocês no Messias Jesus” ou “da confiança de vocês no Messias Jesus”. O substantivo grego pístis pode ter esses sentidos relacionados, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: tendo ouvido falar
  rationale: O particípio aoristo liga a informação à oração anterior e apresenta o que foi ouvido como motivo da ação ali mencionada. “Ouvir falar de” é a formulação idiomática natural em português.
- source_word: πίστιν ὑμῶν
  choice: da fé de vocês
  rationale: “Fé” é a equivalência principal de πίστις neste contexto, enquanto “de vocês” expressa o pronome possessivo plural sem ambiguidade regional.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a preposição relacional ἐν e traduz Χριστός como o título “Messias”, preservando Ἰησοῦ como nome pessoal.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente corrente, claro e estável de ἀγάπη.
- source_word: ἣν ἔχετε
  choice: que vocês têm
  rationale: Representa explicitamente a oração relativa presente no texto grego e soa natural em português contemporâneo.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: por todos os santos
  rationale: Com ἀγάπη, εἰς indica a direção ou os destinatários do amor; “por” é idiomático em português. “Santos” preserva a designação paulina dos fiéis.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto, Χριστός acompanha o nome pessoal Jesus e conserva sua força titular; “Messias” traduz o título em vez de apenas transliterá-lo.
- issue: Amplitude semântica de πίστις
  choice: fé
  alternative: fidelidade ou confiança
  rationale: A relação expressa por ἐν Χριστῷ Ἰησοῦ favorece “fé” como leitura principal, mas πίστις também pode denotar confiança ou fidelidade; essas possibilidades são preservadas em nota sem decidir além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A construção participial foi mantida para preservar a ligação sintática com o versículo anterior; “santos” conserva o termo característico de Paulo.
