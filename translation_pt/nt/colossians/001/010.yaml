id: COL.1.10
reference: Colossians 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: pt
  text: para viverem de modo digno do Senhor, agradando-lhe em tudo[a], dando fruto em toda boa obra e crescendo no conhecimento de Deus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “para todo agrado”, sem declarar quem deve ser agradado; pelo contexto, o referente é o Senhor.
    reason: lexical_alternative
  - marker: b
    text: Ou “crescendo no pleno conhecimento de Deus”. O termo grego pode transmitir a ideia de um conhecimento mais pleno ou profundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: viverem
  rationale: O verbo significa literalmente “andar”, mas aqui funciona como metáfora comum para a maneira de viver. “Viverem” comunica essa ideia com naturalidade em português e mantém a ligação com a oração do versículo anterior.
- source_word: ἀξίως τοῦ κυρίου
  choice: de modo digno do Senhor
  rationale: Expressa conduta condizente com o Senhor sem sugerir que alguém conquista dignidade ou mérito diante dele.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: agradando-lhe em tudo
  rationale: Formulação natural em português que expressa o propósito ou resultado indicado por εἰς e o alcance amplo de πᾶσαν. O pronome explicita o Senhor como referente implícito no contexto; a nota registra a forma menos explícita do grego.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: em toda boa obra
  rationale: Preserva a construção preposicional e a força distributiva de παντί.
- source_word: καρποφοροῦντες
  choice: dando fruto
  rationale: Mantém a metáfora agrícola e sua provável ligação com Colossenses 1:6.
- source_word: αὐξανόμενοι
  choice: crescendo
  rationale: Reproduz o particípio presente paralelo a “dando fruto” e conserva a imagem orgânica.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: no conhecimento de Deus
  rationale: Toma o dativo como esfera ou aspecto do crescimento. “Conhecimento” é claro e evita impor em todas as ocorrências a possível nuance intensiva de ἐπίγνωσις.
theological_decisions:
- issue: Referente implícito de ἀρεσκείαν
  choice: Explicitar o Senhor por meio de “lhe” em “agradando-lhe em tudo”
  alternative: para todo agrado; visando a todo agrado
  rationale: Embora o grego não expresse um objeto, o Senhor é o referente imediato e inequívoco no contexto. A explicitação produz português natural sem introduzir um referente teológico novo, enquanto a nota preserva a estrutura e a ambiguidade formal do original.
- issue: Nuance de ἐπίγνωσις
  choice: conhecimento
  alternative: pleno conhecimento; conhecimento profundo
  rationale: O substantivo pode sugerir conhecimento mais pleno ou profundo, mas essa nuance não precisa ser lexicalizada de forma rígida. A tradução principal permanece acessível, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Viverem” traduz naturalmente a metáfora de “andar”; os particípios “agradando”, “dando fruto” e “crescendo” preservam o movimento da frase grega. A pontuação final mantém a continuidade sintática com o contexto maior.
