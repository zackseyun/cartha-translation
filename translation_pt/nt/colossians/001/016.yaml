id: COL.1.16
reference: Colossians 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: pt
  text: Pois nele foram criadas todas as coisas[a], nos céus e na terra[b], as visíveis e as invisíveis, sejam tronos, sejam domínios[c], sejam principados, sejam autoridades; todas as coisas foram criadas por meio dele e para ele[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque nele foram criadas todas as coisas”.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz o plural “nos céus”; também se pode traduzir a expressão inteira como “no céu e na terra”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “senhorios”. Os termos desta lista provavelmente designam categorias de poderes ou autoridades criados.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “com destino a ele”. A expressão indica que ele é o alvo ou fim da criação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz de modo natural, em português, a razão da afirmação anterior, preservando a força causal sem tornar a oração subordinada.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém o valor de ἐν e sua distinção em relação a δι’ αὐτοῦ, que aparece depois; evita reduzir antecipadamente a expressão a simples agência.
- source_word: ἐκτίσθη τὰ πάντα
  choice: foram criadas todas as coisas
  rationale: Expressa naturalmente em português o aoristo passivo e conserva o alcance abrangente de τὰ πάντα.
- source_word: ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς
  choice: nos céus e na terra
  rationale: Preserva o plural grego de οὐρανοῖς e apresenta com clareza a abrangência cósmica da expressão.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: as visíveis e as invisíveis
  rationale: Os adjetivos substantivados retomam naturalmente 'todas as coisas' em português, mantendo o contraste conciso.
- source_word: εἴτε ... εἴτε ... εἴτε ... εἴτε
  choice: sejam ... sejam ... sejam ... sejam
  rationale: A repetição é natural e solene em português e conserva a estrutura enumerativa do grego.
- source_word: θρόνοι
  choice: tronos
  rationale: Tradução direta que preserva a imagem e não determina se a referência é exclusivamente espiritual ou terrena.
- source_word: κυριότητες
  choice: domínios
  rationale: Termo tradicional e conciso para uma categoria de autoridade; uma nota registra a alternativa mais formal 'senhorios'.
- source_word: ἀρχαί
  choice: principados
  rationale: Mantém a distinção em relação a ἐξουσίαι e é uma designação reconhecível de poderes governantes, sem especificar sua natureza.
- source_word: ἐξουσίαι
  choice: autoridades
  rationale: Equivalente claro e direto no campo semântico do poder legítimo ou exercido.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: por meio dele e para ele
  rationale: Distingue a mediação expressa por διά da direção ou finalidade expressa por εἰς, em linguagem portuguesa natural.
theological_decisions:
- issue: Relação do Filho com a criação nas expressões ἐν αὐτῷ, δι’ αὐτοῦ e εἰς αὐτόν
  choice: nele ... por meio dele ... para ele
  alternative: por ele ... por meio dele ... com destino a ele
  rationale: A redação conserva as três preposições distintas e, assim, não reduz a relação do Filho com a criação a uma única categoria explicativa.
- issue: Natureza dos 'tronos', 'domínios', 'principados' e 'autoridades'
  choice: Manter as designações sem explicar a que tipo de seres ou estruturas se referem
  alternative: Identificá-las explicitamente como ordens angelicais ou como poderes políticos humanos
  rationale: O versículo inclui todas essas categorias na ordem criada, mas não define aqui se são exclusivamente celestiais, espirituais ou terrenas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece em uma só frase, unida por ponto e vírgula, e conserva as distinções preposicionais e a enumeração do grego sem impor uma identificação doutrinária específica às categorias de autoridade.
