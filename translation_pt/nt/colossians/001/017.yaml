  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: pt
  text: E ele é antes de todas as coisas[b], e nele todas as coisas se mantêm unidas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nele todas as coisas subsistem»; ou: «nele todas as coisas têm consistência».'
    reason: lexical_alternative
  - marker: b
    text: «Antes de todas as coisas» também pode sugerir supremacia sobre todas elas, mas a expressão grega indica primariamente anterioridade.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: ele
  rationale: O pronome tem posição enfática no grego. Em português, «ele» preserva a referência clara a Cristo sem uma expansão interpretativa como «ele mesmo».
- source_word: πρὸ πάντων
  choice: antes de todas as coisas
  rationale: πρό com genitivo exprime primariamente anterioridade. A formulação natural em português preserva essa prioridade, sem reduzi-la apenas a superioridade de posição.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: A expressão é abrangente e mantém a repetição do contexto imediato, sem restringi-la explicitamente à criação.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém a preposição ἐν e a relação de esfera ou sustentação, evitando substituí-la por opções mais interpretativas como «por meio dele».
- source_word: συνέστηκεν
  choice: subsistem
  rationale: 'O perfeito grego descreve um estado presente resultante: todas as coisas permanecem constituídas e coesas nele. «Subsistem» é conciso, digno e suficientemente corrente, enquanto a nota registra alternativas mais explícitas.'
theological_decisions:
- issue: Relação de Cristo com a criação em πρὸ πάντων
  choice: 'Prioridade temporal: «antes de todas as coisas»'
  alternative: 'Supremacia de posição: «acima de todas as coisas»'
  rationale: A construção grega exprime primariamente anterioridade. No contexto, ela contribui para a elevada cristologia da passagem, mas a tradução não explicita além do que o texto diz.
- issue: Força de συνέστηκεν
  choice: 'Continuidade e coesão cósmica: «todas as coisas subsistem»'
  alternative: «todas as coisas se mantêm unidas» ou «têm sua consistência»
  rationale: A forma perfeita aponta para o estado contínuo da totalidade criada nele. «Subsistem» preserva tanto a ideia de permanência quanto a possível dimensão de coesão, sem definir de modo excessivamente estreito a relação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Existe antes» evita que «é antes» soe pouco natural, sem ampliar a afirmação para uma formulação doutrinária. Os marcadores aparecem junto às expressões a que se referem.
