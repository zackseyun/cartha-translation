revisions:
- from: E ele existe antes de todas as coisas[b], e nele todas as coisas subsistem[a].
  to: E ele é antes de todas as coisas[b], e nele todas as coisas se mantêm unidas[a].
  rationale: A revisão conserva a anterioridade temporal de πρὸ πάντων e a preposição «em» de ἐν αὐτῷ. Ela substitui uma formulação que pode sugerir apenas existência contínua por «se mantêm unidas», expressão moderna que comunica mais diretamente a coesão e o estado resultante do perfeito συνέστηκεν, sem ampliar o sentido do texto.
