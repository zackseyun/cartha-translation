id: COL.1.8
reference: Colossians 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: pt
  text: o qual também nos deu a conhecer o amor que vocês têm no Espírito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em espírito”, isto é, o amor espiritual de vocês.'
    reason: Leitura alternativa de ἐν πνεύματι, que pode ser entendido como referência ao Espírito Santo ou à esfera ou qualidade espiritual desse amor.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: o qual ... nos deu a conhecer
  rationale: 'O artigo com o particípio aoristo tem função substantivada e retoma Epafras no versículo anterior. A oração relativa preserva essa ligação, e “deu a conhecer” comunica naturalmente o sentido de δηλόω neste contexto: informar ou tornar conhecido.'
- source_word: καὶ
  choice: também
  rationale: καί acrescenta outra ação de Epafras à descrição anterior. “Também” expressa com clareza essa força aditiva.
- source_word: ἡμῖν
  choice: nos
  rationale: 'O dativo funciona como objeto indireto: Epafras comunicou a Paulo e seus companheiros o amor dos colossenses.'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: o amor que vocês têm
  rationale: ἀγάπη corresponde a “amor”. A construção com oração relativa torna natural em português a relação expressa pelo genitivo ὑμῶν, sem alterar o sentido de “o amor de vocês”.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: Embora a expressão seja ambígua, o uso paulino e o contexto favorecem uma referência ao Espírito Santo. “No Espírito” preserva essa leitura provável sem explicação interpretativa excessiva; a alternativa menos específica é registrada em nota.
theological_decisions:
- issue: Referente de πνεύματι
  choice: 'Espírito Santo: “no Espírito”'
  alternative: “em espírito”, isto é, o amor espiritual de vocês
  rationale: A ausência de artigo não exclui uma referência ao Espírito Santo em Paulo. Como a expressão também pode indicar a esfera ou qualidade espiritual do amor, a tradução principal adota a leitura provavelmente paulina, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita a ambiguidade regional de “vós”, enquanto “o qual” mantém de modo claro a referência a Epafras no contexto imediatamente anterior.
