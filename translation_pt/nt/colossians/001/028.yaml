id: COL.1.28
reference: Colossians 1:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: pt
  text: É a ele que proclamamos, advertindo cada pessoa e ensinando cada pessoa com toda a sabedoria, a fim de apresentarmos cada pessoa madura em Cristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: proclamamos
  rationale: Expressa o anúncio público e enfático do verbo grego, em linguagem natural e digna.
- source_word: νουθετοῦντες
  choice: advertindo
  rationale: Preserva o sentido de alertar e corrigir mediante instrução, sem restringi-lo a uma admoestação meramente severa.
- source_word: πάντα ἄνθρωπον
  choice: cada pessoa
  rationale: A repetição distributiva destaca cada indivíduo; “pessoa” comunica de modo inclusivo o referente humano genérico de ἄνθρωπον.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: com toda a sabedoria
  rationale: Reproduz de modo claro a abrangência de πάσῃ e mantém aberta a relação da expressão com o ato de ensinar e advertir.
- source_word: τέλειον
  choice: madura
  rationale: No contexto de formação cristã, indica plenitude ou maturidade, não impecabilidade absoluta.
- source_word: ἐν Χριστῷ
  choice: em Cristo
  rationale: Mantém a fórmula paulina e sua possível amplitude relacional e incorporativa, sem explicá-la além do texto.
theological_decisions:
- issue: Sentido de τέλειον
  choice: madura
  alternative: perfeita
  rationale: “Madura” comunica melhor aqui o objetivo de levar cada pessoa à plenitude em Cristo, evitando sugerir perfeição sem pecado, embora o termo grego possa também ter o sentido de completo.
- issue: Título Χριστός
  choice: Cristo
  alternative: Messias
  rationale: “Cristo” preserva a formulação paulina convencional em português e funciona naturalmente na expressão “em Cristo”; não nega o sentido messiânico do título.
- issue: Alcance da repetição de πάντα ἄνθρωπον
  choice: Repetir “cada pessoa” três vezes
  alternative: Reduzir a repetição por estilo
  rationale: A repetição enfática do original ressalta a abrangência universal e individual do ministério descrito e deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem marcada “É a ele que proclamamos” conserva a ênfase inicial do pronome relativo grego. A repetição intencional de “cada pessoa” segue o recurso retórico do original.
