  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: pt
  text: Agora, porém, vocês foram reconciliados no corpo de carne dele, por meio da morte,[a] para apresentá-los santos, sem defeito[b] e irrepreensíveis diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agora, porém, ele reconciliou vocês no corpo de carne dele, por meio da morte”. O verbo grego está na voz passiva e não declara expressamente o agente.'
    reason: alternative_reading
  - marker: b
    text: “Sem defeito” também pode ser traduzido como “sem mancha”; o termo grego pode evocar a linguagem sacrificial de uma oferta sem defeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Agora, porém
  rationale: Mantém tanto a referência temporal quanto o contraste com a condição anterior descrita no versículo 21, em português atual e digno.
- source_word: ἀποκατηλλάγητε
  choice: vocês foram reconciliados
  rationale: Conserva a voz passiva do texto grego e evita explicitar no verbo um agente que a forma verbal não nomeia.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: em seu corpo de carne
  rationale: Preserva a ênfase concreta na existência corporal real, sem atribuir a σάρξ o sentido metafórico de natureza pecaminosa.
- source_word: διὰ τοῦ θανάτου
  choice: por meio da morte
  rationale: Expressa a função instrumental de διά com o genitivo sem acrescentar ao texto grego um possessivo explícito.
- source_word: παραστῆσαι
  choice: para que ele os apresente
  rationale: Comunica de modo natural a finalidade do infinitivo e mantém o ato de colocar os destinatários diante de alguém para avaliação.
- source_word: ἁγίους
  choice: santos
  rationale: Preserva a noção estabelecida de consagração e pureza.
- source_word: ἀμώμους
  choice: sem defeito
  rationale: Retém a possível ressonância sacrificial do termo e o distingue de ἀνεγκλήτους.
- source_word: ἀνεγκλήτους
  choice: irrepreensíveis
  rationale: É uma formulação portuguesa natural para a condição de não estar sujeito a acusação ou censura, sem duplicar 'sem defeito'.
- source_word: κατενώπιον αὐτοῦ
  choice: diante dele
  rationale: Mantém a referência pronominal do grego sem decidir expressamente se o referente é Deus ou Cristo.
theological_decisions:
- issue: Agência em ἀποκατηλλάγητε
  choice: 'Manter a voz passiva: “vocês foram reconciliados”'
  alternative: “ele reconciliou vocês”
  rationale: A forma grega é passiva e deixa o agente implícito. A tradução conserva essa característica, enquanto a nota registra a possibilidade de explicitar o agente pressuposto pelo contexto.
- issue: Sentido de σάρξ
  choice: 'Sentido físico e literal: “carne”'
  alternative: “natureza pecaminosa”
  rationale: A expressão se refere ao corpo no qual ocorreu a morte; o sentido moral metafórico não é exigido pelo contexto.
- issue: Distinção entre ἀμώμους e ἀνεγκλήτους
  choice: “sem defeito e irrepreensíveis”
  alternative: “inculpáveis e acima de qualquer acusação”
  rationale: A formulação escolhida preserva, respectivamente, a ressonância de integridade sacrificial e a ausência de fundamento para censura ou acusação, sem reduzir os dois termos a sinônimos.
- issue: Referente de αὐτοῦ em κατενώπιον αὐτοῦ
  choice: 'Preservar o pronome: “diante dele”'
  alternative: Explicitar “diante de Deus” ou “diante de Cristo”
  rationale: O grego usa um pronome, e a explicitação resolveria uma referência que o versículo não torna inequívoca por si só.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A construção conserva a concretude de “corpo de carne”, a passiva grega e a ambiguidade do pronome final, usando vocabulário digno sem arcaísmos.
