id: COL.1.18
reference: Colossians 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: pt
  text: E ele é a cabeça do corpo, a igreja. Ele é o princípio[a], o primogênito dentre os mortos, para que ele mesmo venha a ter a primazia em todas as coisas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a origem” ou “o governante”.
    reason: lexical_alternative
  - marker: b
    text: Ou “venha a ocupar o primeiro lugar em tudo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: ele / ele mesmo
  rationale: Na primeira ocorrência, “ele” é natural em português e recebe destaque pelo contexto; na oração final, “ele mesmo” preserva a ênfase explícita do pronome grego.
- source_word: κεφαλή
  choice: cabeça
  rationale: Mantém a metáfora direta e sua riqueza sem reduzi-la exclusivamente às ideias de autoridade ou de origem.
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente habitual e preserva a imagem corporativa em correspondência com “cabeça”.
- source_word: ἐκκλησία
  choice: igreja
  rationale: É a forma consagrada e contextualmente adequada para a comunidade do povo de Deus neste uso paulino.
- source_word: ἀρχή
  choice: princípio
  rationale: A associação imediata com “primogênito dentre os mortos” favorece a noção de início da nova ordem da ressurreição, embora “origem” e “governante” sejam possibilidades lexicais.
- source_word: πρωτότοκος
  choice: primogênito
  rationale: Preserva a forma lexical e suas ressonâncias bíblicas, que podem envolver tanto precedência quanto posição superior.
- source_word: ἐκ τῶν νεκρῶν
  choice: dentre os mortos
  rationale: Expressão portuguesa natural para a ressurreição que conserva o sentido de sair do meio dos mortos.
- source_word: ἵνα γένηται
  choice: para que ... venha a ter
  rationale: Expressa a relação de propósito ou resultado e reflete o valor de γίνομαι sem tornar a frase artificial.
- source_word: ἐν πᾶσιν
  choice: em todas as coisas
  rationale: Mantém o provável sentido neutro e a abrangência cósmica do contexto; “em tudo” seria uma alternativa mais concisa.
- source_word: πρωτεύων
  choice: ter a primazia
  rationale: Comunica naturalmente em português a ideia de ocupar o primeiro lugar, sem ampliar o termo para uma abstração doutrinária.
theological_decisions:
- issue: Sentido de κεφαλή na metáfora de Cristo e o corpo
  choice: Manter “cabeça” sem especificar se o foco é autoridade ou origem.
  alternative: “líder” ou “fonte”
  rationale: A metáfora grega comporta nuances debatidas; sua preservação evita resolver na tradução uma tensão que o texto não explicita.
- issue: Sentido de ἀρχή no contexto da ressurreição
  choice: “princípio”
  alternative: “origem” ou “governante”
  rationale: O paralelo com “primogênito dentre os mortos” favorece “princípio”, mas a nota registra a amplitude lexical do termo.
- issue: Força de πρωτότοκος ἐκ τῶν νεκρῶν
  choice: “primogênito dentre os mortos” como linguagem de prioridade e primazia na ressurreição
  alternative: “o primeiro a ressuscitar dentre os mortos”
  rationale: A tradução conserva a expressão bíblica e não reduz πρωτότοκος apenas à sequência temporal; a oração seguinte explicita a primazia de Cristo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A aposição “o corpo, a igreja” preserva a estrutura e a identificação do grego sem acrescentar uma oração explicativa. “Dentre os mortos” mantém a imagem da ressurreição, e “venha a ter a primazia” equilibra precisão e naturalidade.
