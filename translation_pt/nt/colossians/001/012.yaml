lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: dando graças
  rationale: Mantém o particípio presente e a continuidade sintática com o contexto anterior, em expressão natural e digna em português.
- source_word: τῷ πατρὶ
  choice: ao Pai
  rationale: Traduz diretamente o título relacional definido, sem acrescentar “Deus”, ausente no texto grego deste versículo.
- source_word: τῷ ἱκανώσαντι
  choice: que tornou vocês aptos
  rationale: 'Expressa o sentido causativo do aoristo de ἱκανόω: fazer alguém suficiente, idôneo ou apto, sem reduzir a ideia a mera permissão.'
- source_word: ὑμᾶς
  choice: vocês
  rationale: Segue a leitura do SBLGNT e usa uma forma de segunda pessoa plural amplamente compreensível em português moderno; a variante “nós” é registrada em nota.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: para participar da herança
  rationale: Comunica naturalmente a entrada ou habilitação para uma porção na herança, preservando no termo “herança” o pano de fundo de uma parte atribuída por sorteio.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Preserva o termo paulino tradicional para o povo consagrado de Deus sem explicitação interpretativa adicional.
- source_word: ἐν τῷ φωτί
  choice: na luz
  rationale: Mantém a metáfora e sua ligação possível com a herança ou com os santos, sem definir além do que a sintaxe permite.
theological_decisions:
- issue: Variante textual no pronome objeto
  choice: vocês
  alternative: nós
  rationale: O texto-base fornecido lê ὑμᾶς (“vocês”); a leitura ἡμᾶς (“nós”), presente em alguns manuscritos, é preservada em nota.
- issue: Relação entre μερίς e κλῆρος
  choice: participar da herança
  alternative: receber a porção que cabe aos santos na luz
  rationale: A formulação principal oferece português natural e conserva a participação numa herança; a nota explicita a imagem grega de uma porção atribuída sem impor uma única análise lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A redação conserva a estrutura participial do contexto e evita linguagem excessivamente técnica; a vírgula final indica a continuidade da frase no versículo seguinte.
