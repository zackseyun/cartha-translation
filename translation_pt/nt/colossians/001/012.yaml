  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: pt
  text: dando graças ao Pai[a], que tornou vocês aptos a receber uma parte da herança dos santos na luz[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “nós” em vez de “vocês”.
