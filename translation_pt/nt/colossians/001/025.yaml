  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: pt
  text: da qual me tornei servo, conforme a incumbência[a] que Deus me confiou em favor de vocês, a fim de levar à plenitude a palavra de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “responsabilidade”, “encargo” ou “administração”.'
    reason: alternativas lexicais para οἰκονομία
  - marker: b
    text: 'Ou: “a fim de tornar plenamente conhecida a palavra de Deus”, “completar a palavra de Deus” ou “cumprir a palavra de Deus”.'
    reason: a expressão grega preserva mais de uma possível nuance
lexical_decisions:
- source_word: ἧς
  choice: da qual
  rationale: O pronome relativo feminino retoma “igreja” no versículo anterior. “Da qual” preserva essa referência direta.
- source_word: ἐγενόμην
  choice: me tornei
  rationale: Expressa naturalmente a entrada de Paulo nessa função, sem transformar o verbo em uma nomeação passiva explícita.
- source_word: διάκονος
  choice: servo
  rationale: Indica alguém que serve, sem importar o sentido posterior de um cargo eclesiástico específico associado a “diácono”.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: conforme a responsabilidade que Deus me confiou
  rationale: No contexto, οἰκονομία é uma responsabilidade ou incumbência recebida de Deus. A formulação portuguesa é clara e mantém a ideia de algo confiado a Paulo.
- source_word: εἰς ὑμᾶς
  choice: em favor de vocês
  rationale: Comunica que a responsabilidade de Paulo se dirige aos leitores e visa ao benefício deles.
- source_word: πληρῶσαι
  choice: levar à plenitude
  rationale: Preserva a noção de plenitude presente no verbo sem decidir se Paulo fala especificamente de cumprir, completar ou proclamar plenamente.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão bíblica tradicional e sua amplitude como mensagem ou revelação procedente de Deus.
theological_decisions:
- issue: Sentido de πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: levar à plenitude a palavra de Deus
  alternative: tornar plenamente conhecida a palavra de Deus; completar a palavra de Deus; cumprir a palavra de Deus
  rationale: 'A expressão admite mais de uma nuance: plena proclamação, plena realização ou conclusão. O texto principal conserva essa tensão, e a nota registra as leituras mais específicas.'
- issue: Relação de τοῦ θεοῦ com οἰκονομία e δοθεῖσάν
  choice: a responsabilidade que Deus me confiou
  alternative: a administração de Deus que me foi dada
  rationale: A construção pode ser entendida como uma incumbência procedente de Deus e dada a Paulo. A tradução escolhida torna essa relação natural em português sem sugerir que Paulo administra o próprio Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A construção evita jargão eclesiástico e mantém a ambiguidade teológica da frase final.
