source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: pt
  text: Para isso também trabalho arduamente[a], lutando[b] segundo a atuação dele[c], que atua em mim com poder[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com esse objetivo” ou “para o que”.
    reason: lexical_alternative
  - marker: b
    text: Ou “esforçando-me intensamente”.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “dele”, sem explicitar se o referente é Deus ou o Messias.
    reason: alternative_reading
  - marker: d
    text: Ou “que atua poderosamente em mim” ou “que está atuando em mim em poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Para isso
  rationale: Retoma o objetivo ministerial exposto no contexto anterior. É uma formulação natural em português e preserva tanto a referência retrospectiva quanto a possível ideia de finalidade.
- source_word: καὶ
  choice: também
  rationale: Expressa o valor aditivo de καί, ligando o esforço de Paulo ao que ele acabou de declarar.
- source_word: κοπιῶ
  choice: trabalho arduamente
  rationale: Comunica trabalho intenso e cansativo de modo claro e atual; apenas “trabalho” poderia atenuar a força de κοπιάω.
- source_word: ἀγωνιζόμενος
  choice: lutando
  rationale: Preserva a imagem de esforço intenso ou combate presente no verbo, sem exigir uma formulação técnica.
- source_word: κατὰ
  choice: segundo
  rationale: 'Mantém a relação de conformidade ou medida: o esforço de Paulo corresponde à atuação que opera nele, não sendo apresentado como esforço meramente autônomo.'
- source_word: ἐνέργειαν
  choice: atuação
  rationale: Designa poder em operação ou atividade eficaz. “Atuação” evita a conotação científica moderna de “energia” e permite ecoar o verbo cognato seguinte.
- source_word: αὐτοῦ
  choice: dele
  rationale: Conserva o pronome masculino do grego sem explicitar se o referente é Deus ou o Messias.
- source_word: τὴν ἐνεργουμένην
  choice: que atua
  rationale: Expressa a atividade contínua do particípio presente e reproduz, por meio de “atuação/atua”, a repetição da raiz grega.
- source_word: ἐν ἐμοὶ
  choice: em mim
  rationale: É a correspondência mais direta para ἐν ἐμοί e preserva a tensão entre capacitação interior e efeito ministerial exterior.
- source_word: ἐν δυνάμει
  choice: com poder
  rationale: É português natural, mantém a força nominal de δύναμις e apresenta o poder como modo ou esfera dessa atuação.
theological_decisions:
- issue: Referente de αὐτοῦ (“dele”)
  choice: Manter o pronome “dele”, sem identificar expressamente o referente.
  alternative: “atuação de Deus” ou “atuação do Messias”
  rationale: O versículo não nomeia explicitamente o antecedente. O contexto permite considerar Deus ou o Messias, e a tradução não deve resolver uma ambiguidade que o grego preserva.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. “Trabalho arduamente” evita que a intensidade de κοπιῶ se perca; “atuação/atua” conserva de forma natural a repetição cognata do original. A ordem dos marcadores acompanha os elementos correspondentes no texto.
