id: COL.1.24
reference: Colossians 1:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: pt
  text: Agora me alegro nos sofrimentos por vocês e, na minha carne, completo o que falta das aflições do Messias em favor do seu corpo, que é a igreja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “completo o que falta das aflições do Messias” não indica que a obra expiatória do Messias tenha sido insuficiente. Paulo fala de sua participação, em seu próprio corpo, nos sofrimentos ligados ao Messias, à missão e ao corpo dele, a igreja. Também se pode traduzir: “preencho o que resta das aflições do Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Agora
  rationale: Marcador temporal natural e conciso, que introduz a situação presente de Paulo.
- source_word: χαίρω
  choice: me alegro
  rationale: Preserva o presente indicativo e expressa de modo idiomático a atitude atual de Paulo.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: nos sofrimentos por vocês
  rationale: O contexto identifica os sofrimentos como os de Paulo; 'por vocês' conserva o sentido benefactivo de ὑπέρ sem tornar a frase pesada.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: completo o que falta
  rationale: Mantém a força da imagem grega e sua tensão, sem inserir na tradução uma explicação teológica.
- source_word: τῶν θλίψεων τοῦ Χριστοῦ
  choice: das aflições do Messias
  rationale: '''Aflições'' distingue θλίψεις do termo anterior para ''sofrimentos''; ''Messias'' comunica a força titular de Χριστός.'
- source_word: ἐν τῇ σαρκί μου
  choice: na minha carne
  rationale: Tradução transparente de σάρξ neste contexto de existência física e corporal, sem sugerir 'natureza pecaminosa'.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: em favor do seu corpo
  rationale: Expressa claramente o sentido benefactivo de ὑπέρ e conserva a metáfora do corpo.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: que é a igreja
  rationale: Identifica diretamente o corpo do Messias com a igreja, como no grego.
theological_decisions:
- issue: Sentido de 'o que falta das aflições do Messias'
  choice: Manter no texto a afirmação forte de que Paulo completa, em sua carne, o que falta dessas aflições, entendida como participação nos sofrimentos ligados ao Messias, à missão e à igreja.
  alternative: Entender que os sofrimentos de Paulo completam uma deficiência na obra redentora do Messias, ou que se trata exclusivamente de uma quantidade predeterminada de aflições escatológicas.
  rationale: A tradução não deve apagar a tensão do original. Ao mesmo tempo, o contexto — especialmente 'em favor do seu corpo, que é a igreja' — aponta para a participação ministerial e eclesial de Paulo nos sofrimentos messiânicos, não para insuficiência da morte expiatória do Messias.
- issue: Força de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva força titular; 'Messias' torna essa dimensão explícita sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a metáfora de 'carne' e 'corpo', distingue 'sofrimentos' de 'aflições' e mantém a tensão teológica do original. O pronome 'vocês' favorece naturalidade internacional com clara legibilidade no Brasil.
