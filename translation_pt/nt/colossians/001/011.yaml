id: COL.1.11
reference: Colossians 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: pt
  text: sendo fortalecidos com todo o poder, segundo a força da sua glória[a], para toda perseverança e paciência, com alegria,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo o seu poder glorioso”. O grego diz mais literalmente: “segundo a força da sua glória”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: com todo o poder
  rationale: O uso de ἐν com o dativo pode ser instrumental ou esférico. “Com todo o poder” é natural em português e comunica a amplitude do fortalecimento.
- source_word: δυναμούμενοι
  choice: sendo fortalecidos
  rationale: O particípio presente passivo descreve um processo contínuo, cujo agente implícito é Deus. A formulação é clara e adequada ao contexto da oração.
- source_word: κατὰ τὸ κράτος
  choice: segundo a força
  rationale: κατά com o acusativo indica padrão ou medida. “Segundo” preserva essa relação, e “força” distingue κράτος de δύναμις sem recorrer ao pouco corrente “poderio”.
- source_word: τῆς δόξης αὐτοῦ
  choice: da sua glória
  rationale: Mantém a construção genitiva do grego e a associação direta entre a força e a glória de Deus, sem reduzi-la silenciosamente ao adjetivo “gloriosa”.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: para toda perseverança
  rationale: εἰς expressa propósito ou resultado. “Perseverança” comunica a firme constância sob provações, enquanto “toda” conserva a abrangência de πᾶσαν.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Termo atual e acessível, que pode indicar disposição paciente, especialmente em relação às pessoas. Permanece distinto de ὑπομονή, traduzido como “perseverança”.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Tradução direta que preserva o substantivo χαρά e não decide além do necessário a ligação sintática exata da expressão.
theological_decisions:
- issue: Relação entre o fortalecimento divino e os atributos de Deus
  choice: “segundo a força da sua glória”
  alternative: “segundo o seu poder glorioso”
  rationale: A opção principal preserva a formulação densa e a construção genitiva de Paulo, mantendo a glória como qualidade ou fonte associada à força sem introduzir uma paráfrase doutrinária.
- issue: Ligação sintática de “com alegria”
  choice: Manter a expressão no fim, permitindo sua associação natural à perseverança e à paciência
  alternative: Pontuar de modo que “com alegria” introduza explicitamente o ato de dar graças no versículo seguinte
  rationale: O grego admite discussão sobre a ligação da expressão com o que precede ou com o que segue. Como o recorte fornecido termina aqui, a tradução evita resolver de forma categórica essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a acumulação paulina de termos ligados a poder e força, bem como a cadência participial do contexto maior.
