id: COL.1.20
reference: Colossians 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: pt
  text: e, por meio dele, reconciliar consigo todas as coisas[b], tendo feito a paz pelo sangue da sua cruz — por meio dele[d] —, tanto as que estão sobre a terra como as que estão nos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Todas as coisas” permanece abrangente, de acordo com o grego e com a expressão seguinte, “tanto as que estão sobre a terra como as que estão nos céus”. O próprio versículo não especifica como essa reconciliação se relaciona com a salvação final.
    reason: alternative_reading
  - marker: c
    text: No grego, “céus” está no plural.
    reason: lexical_alternative
  - marker: d
    text: Alguns manuscritos omitem a segunda ocorrência de “por meio dele”.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com o genitivo indica meio ou agência. “Por meio dele” é natural em português e preserva a ênfase mediadora do Filho.
- source_word: ἀποκαταλλάξαι
  choice: reconciliar
  rationale: O infinitivo expressa reconciliação ou restauração de uma relação. Evita-se acrescentar “completamente”, pois isso tornaria explícita uma possível força intensiva do prefixo que o contexto não exige lexicalizar.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém a abrangência do neutro plural grego e sua ligação com o contexto da criação nos versículos anteriores, sem restringi-lo a pessoas nem defini-lo como salvação universal.
- source_word: εἰς αὐτόν
  choice: consigo
  rationale: No encadeamento sintático, Deus é entendido como aquele que reconcilia por meio do Filho. “Consigo” expressa naturalmente em português a relação reflexiva, embora dependa do contexto anterior para identificar o referente.
- source_word: εἰρηνοποιήσας
  choice: tendo feito a paz
  rationale: Preserva o particípio aoristo e sua relação circunstancial com a reconciliação, sem transformá-lo desnecessariamente em verbo finito.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: pelo sangue da sua cruz
  rationale: Mantém literalmente “sangue” e “cruz”, imagens concretas e teologicamente significativas, enquanto “pelo” comunica de modo idiomático o meio.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: por meio dele
  rationale: A repetição é mantida como retomada enfática e isolada por travessões; sua incerteza textual é indicada em nota.
- source_word: εἴτε ... εἴτε
  choice: tanto ... como
  rationale: Esta correlação é idiomática em português e apresenta com clareza os dois âmbitos abrangidos.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: as que estão sobre a terra
  rationale: O pronome retoma “todas as coisas”; “sobre a terra” preserva a preposição grega e o contraste cosmológico.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: as que estão nos céus
  rationale: Preserva o plural οὐρανοῖς, comum na linguagem cosmológica bíblica.
theological_decisions:
- issue: Alcance da reconciliação em τὰ πάντα
  choice: “Todas as coisas”, em sentido amplo e não delimitado no próprio versículo.
  alternative: “Todas as pessoas” ou “todo o universo salvo”.
  rationale: A formulação cósmica inclui o que está na terra e nos céus. A tradução conserva essa amplitude sem decidir de que maneira a reconciliação se relaciona com a salvação final de seres pessoais.
- issue: Referente de εἰς αὐτόν
  choice: “Consigo”, entendendo Deus como aquele que reconcilia por meio do Filho.
  alternative: O Messias reconciliando todas as coisas consigo mesmo.
  rationale: A construção continua o pensamento do versículo 19, no qual a vontade divina é o referente mais provável. A escolha mantém a reflexividade sem acrescentar uma explicação doutrinária ao texto.
- issue: Sentido de “sangue da sua cruz”
  choice: Manter a linguagem concreta de sangue e cruz.
  alternative: Parafrasear como “sua morte na cruz”.
  rationale: O grego menciona expressamente ambos os termos. Preservá-los conserva sua força sacrificial e histórica sem impor uma teoria específica da expiação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha a continuidade da frase iniciada no versículo anterior. Optou-se por “por meio dele” em vez de “através dele”, por ser mais preciso para meio ou agência. Não foi criada a nota [a] da camada inglesa porque, em português, “por ele” não oferece uma alternativa relevante sem possível ambiguidade; todos os marcadores efetivamente usados aparecem no texto.
