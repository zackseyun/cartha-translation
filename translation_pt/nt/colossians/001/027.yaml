  terminology: “Mistério”, “gentios”, “o Messias” e “a esperança da glória” são escolhas consistentes com o contexto e com a força titular de Χριστός. “Vocês” oferece legibilidade ampla, especialmente brasileira, sem prejuízo de compreensão internacional.
