id: COL.1.27
reference: Colossians 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: pt
  text: A eles, Deus quis dar a conhecer qual é a riqueza da glória deste mistério entre os gentios. Esse mistério é o Messias em vocês[a], a esperança da glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre vocês”. A expressão grega pode indicar o Messias presente nos que creem ou presente entre eles como comunidade, especialmente entre os gentios.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: A eles
  rationale: O pronome relativo dativo retoma os santos mencionados no versículo anterior e funciona como objeto indireto de γνωρίσαι. “A eles” é claro e natural em português.
- source_word: ἠθέλησεν
  choice: quis
  rationale: θέλω expressa aqui a vontade ou decisão deliberada de Deus. “Quis” preserva o sentido sem acrescentar a ideia mais específica de eleição que “escolheu” poderia sugerir.
- source_word: γνωρίσαι
  choice: dar a conhecer
  rationale: Representa diretamente o sentido de γνωρίζω, isto é, tornar algo conhecido, mantendo o registro digno do contexto.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: qual é a riqueza da glória
  rationale: O singular português “riqueza” corresponde ao substantivo grego singular πλοῦτος e conserva a construção densa do original sem a dificuldade gramatical encontrada em inglês.
- source_word: μυστηρίου
  choice: mistério
  rationale: No uso paulino, refere-se ao propósito divino antes oculto e agora dado a conhecer, não a um enigma impossível de compreender.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: No contexto, ἔθνη designa os povos não judeus. “Gentios” preserva essa distinção, importante no argumento da passagem.
- source_word: ὅ ἐστιν
  choice: Esse mistério é
  rationale: A retomada explícita de “mistério” torna clara em português a identificação introduzida pelo pronome relativo grego, sem alterar seu conteúdo.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Aqui Χριστός conserva força titular ao identificar o conteúdo do mistério. “O Messias” comunica essa função mais claramente do que o uso quase nominal de “Cristo”.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: É a tradução gramaticalmente direta e preserva a possibilidade da presença do Messias nos destinatários, sem excluir o sentido corporativo indicado em nota.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: a esperança da glória
  rationale: Mantém a concisão e a relação genitiva do grego, deixando aberta a nuance entre a glória esperada e a glória que fundamenta a esperança.
theological_decisions:
- issue: Sentido de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A expressão identifica o conteúdo do mistério e apresenta Χριστός com força de título; por isso, “o Messias” é preferível, sem negar que “Cristo” seja uma tradução tradicional possível.
- issue: Sentido de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: O grego permite tanto uma leitura interior ou participativa quanto uma leitura corporativa da presença do Messias entre o povo gentio. A tradução principal segue a correspondência mais direta, e a nota preserva a alternativa.
- issue: Relação de ἡ ἐλπὶς τῆς δόξης
  choice: a esperança da glória
  alternative: a esperança de alcançar a glória
  rationale: A forma compacta evita definir de modo excessivo a relação do genitivo e conserva a densidade teológica da expressão paulina.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formas de ampla compreensão e boa legibilidade brasileira. “Dar a conhecer” mantém a solenidade sem arcaísmo excessivo; “vocês” evita a ambiguidade regional de outras formas de segunda pessoa plural.
