base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: pt
  text: E vocês, que antes estavam afastados e eram hostis em sua maneira de pensar, praticando obras más[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega é compacta. Também pode ser traduzida mais literalmente: “eram inimigos em sua maneira de pensar, em obras más”. O grego não explicita plenamente a relação entre a hostilidade interior e as obras más.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: E vocês
  rationale: Mantém a ligação com a frase anterior e inclui os leitores no alcance da reconciliação descrita a seguir.
- source_word: ποτε ὄντας
  choice: que antes estavam
  rationale: Transforma o particípio grego em uma oração relativa natural em português e marca com clareza a condição passada dos leitores.
- source_word: ἀπηλλοτριωμένους
  choice: afastados
  rationale: Expressa o estado de separação e distanciamento relacional indicado pelo particípio perfeito passivo, em linguagem comum e digna.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: hostis na mente
  rationale: Comunica a hostilidade interior de modo natural, sem eliminar por completo a formulação compacta do grego, que literalmente emprega o substantivo 'inimigos'.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: em suas obras más
  rationale: Conserva a preposição grega e evita impor uma relação estritamente causal ou meramente coordenada entre a disposição interior e a conduta exterior.
- source_word: ἔργοις
  choice: obras
  rationale: Equivalente direto e corrente de ἔργα; neste contexto se refere aos atos ou à conduta, sem depender de um sentido teológico técnico.
- source_word: πονηροῖς
  choice: más
  rationale: Transmite de forma direta a avaliação moral negativa do adjetivo grego.
theological_decisions:
- issue: Relação entre a hostilidade interior e as obras más
  choice: Preservar a construção 'hostis na mente, em suas obras más'.
  alternative: Explicitar como 'hostis na mente, praticando obras más' ou 'hostis na mente por causa de suas obras más'.
  rationale: A preposição ἐν pode indicar esfera, manifestação ou associação, mas o texto não define inequivocamente uma relação causal. A tradução principal mantém essa tensão, e a nota registra uma formulação portuguesa mais explicativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O travessão final foi mantido porque o versículo é sintaticamente concluído no seguinte. A formulação principal permanece deliberadamente próxima da construção compacta e ambígua do grego.
