  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: pt
  text: Paulo, apóstolo de Jesus, o Messias[a], pela vontade de Deus, e Timóteo, nosso irmão[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de Cristo Jesus». O título grego Χριστός pode ser traduzido por «Cristo»; aqui, «Messias» preserva seu sentido de título.
    reason: alternative_reading
  - marker: b
    text: Literalmente, «o irmão»; «nosso irmão» expressa de forma natural em português a relação comunitária indicada nesta abertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Παῦλος.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o título reconhecido no contexto paulino, em vez de reduzi-lo ao sentido genérico de mensageiro ou enviado.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: O genitivo liga o apostolado de Paulo ao Messias Jesus; «Messias» conserva aqui o valor titular de Χριστός, enquanto «Jesus» translitera o nome.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Expressão portuguesa natural que comunica que o apostolado de Paulo decorre da determinação ou iniciativa divina.
- source_word: Τιμόθεος
  choice: Timóteo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Τιμόθεος.
- source_word: ὁ ἀδελφὸς
  choice: nosso irmão
  rationale: Embora o grego diga literalmente «o irmão», o possessivo explicita de modo natural em português a relação comunitária pressuposta na abertura da carta.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste título associado a Jesus, «Messias» mantém perceptível o sentido de ungido esperado, sem negar que «Cristo» seja a forma tradicional portuguesa.
- issue: Força relacional de ὁ ἀδελφός
  choice: nosso irmão
  alternative: o irmão
  rationale: A formulação natural em português explicita a relação fraterna compartilhada sem transformar o termo em uma designação mais interpretativa, como «companheiro de fé».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém a estrutura da saudação e sua vírgula final, pois a frase prossegue no versículo seguinte.
