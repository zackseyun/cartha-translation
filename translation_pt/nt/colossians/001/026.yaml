id: COL.1.26
reference: Colossians 1:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: pt
  text: o mistério[a] que estava oculto desde as eras e desde as gerações, mas agora foi revelado aos seus santos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «segredo». Em Paulo, «mistério» costuma indicar um propósito divino antes oculto e agora revelado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, aos que pertencem a Deus e foram separados para ele; também se pode traduzir por «aos seus consagrados».
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mistério
  rationale: 'Preserva o uso paulino estabelecido: um propósito divino antes oculto e agora revelado, e não algo necessariamente esotérico.'
- source_word: ἀποκεκρυμμένον
  choice: que estava oculto
  rationale: Expressa com naturalidade o estado resultante indicado pelo particípio perfeito passivo, sem tornar a construção excessivamente formal.
- source_word: ἀπὸ τῶν αἰώνων
  choice: desde as eras
  rationale: Mantém a força temporal de ἀπό e entende αἰῶνες como eras ou épocas, não como a noção abstrata de eternidade.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: e desde as gerações
  rationale: Conserva a repetição de ἀπό e o paralelismo deliberado do grego, sem acrescentar a ideia de 'todas'.
- source_word: νῦν δὲ
  choice: mas agora
  rationale: Reproduz de modo conciso e natural o forte contraste entre o ocultamento anterior e a revelação presente.
- source_word: ἐφανερώθη
  choice: foi revelado
  rationale: Representa claramente o aoristo passivo e usa a formulação mais corrente em português.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: aos seus santos
  rationale: Preserva o termo paulino para os que pertencem a Deus e foram separados para ele; a nota evita restringi-lo a uma classe posterior de pessoas canonizadas.
theological_decisions:
- issue: Sentido e referente de «seus santos»
  choice: Refere-se ao povo santo de Deus, a comunidade dos que creem, sem limitar o termo a uma classe de indivíduos canonizados.
  alternative: «aos seus santos» pode ser vertido como «aos seus santos» no sentido mais explícito de «aos seus consagrados» ou «ao seu povo santo».
  rationale: No uso paulino, ἅγιοι designa normalmente os que foram separados para Deus. A tradução mantém a terminologia teológica e a nota esclarece seu alcance comunitário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção preserva o paralelismo temporal e o contraste do grego sem sacrificar a fluidez.
