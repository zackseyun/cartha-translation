id: COL.1.14
reference: Colossians 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: pt
  text: nele temos a redenção[a], o perdão dos pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertação”; tanto “redenção” como “perdão” podem transmitir a ideia de soltura. Aqui, Paulo provavelmente usa “o perdão dos pecados” para especificar em que consiste essa redenção.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐν ᾧ
  choice: nele
  rationale: O pronome relativo masculino singular retoma o Filho amado do versículo anterior. “Nele” preserva de modo natural em português o sentido pessoal e relacional da expressão.
- source_word: ἔχομεν
  choice: temos
  rationale: O presente do indicativo expressa a posse atual desse benefício; “temos” é direto e fiel.
- source_word: ἀπολύτρωσιν
  choice: redenção
  rationale: “Redenção” é o equivalente consagrado e preserva o sentido de libertação associado ao termo no uso paulino, sem reduzir sua densidade teológica.
- source_word: ἄφεσιν
  choice: perdão
  rationale: Neste contexto moral, “perdão” é o equivalente português mais claro. O termo também pode denotar soltura ou libertação, possibilidade registrada em nota.
- source_word: τῶν ἁμαρτιῶν
  choice: dos pecados
  rationale: O genitivo plural indica aquilo que é perdoado; “dos pecados” é a formulação idiomática e precisa em português.
theological_decisions:
- issue: Relação entre “redenção” e “perdão dos pecados”
  choice: 'Manter a segunda expressão em aposição: “a redenção, o perdão dos pecados”.'
  alternative: Explicitar a relação com “a redenção, isto é, o perdão dos pecados”.
  rationale: O grego apresenta τὴν ἄφεσιν τῶν ἁμαρτιῶν em aposição a τὴν ἀπολύτρωσιν. A pontuação preserva essa identificação sem acrescentar uma fórmula explicativa ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no uso brasileiro. “Nele” mantém a ligação com o Filho amado no contexto anterior; a aposição concisa acompanha a estrutura grega.
