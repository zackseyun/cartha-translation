  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: pt
  text: Ele nos resgatou da autoridade das trevas e nos transferiu para o reino de seu Filho amado,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Filho a quem ele ama”; literalmente, “o Filho do seu amor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: ῥύομαι indica livrar ou resgatar de perigo ou poder hostil. “Resgatou” comunica uma intervenção decisiva em português atual sem acrescentar terminologia teológica ausente do texto.
- source_word: ἐξουσίας
  choice: autoridade
  rationale: ἐξουσία denota autoridade, direito ou poder governante. “Autoridade” é o equivalente lexical mais direto e preserva a personificação do domínio exercido pelas trevas.
- source_word: σκότους
  choice: trevas
  rationale: σκότος significa escuridão ou trevas. “Trevas” é natural no registro bíblico português e deixa implícitas, como no grego, as conotações morais e espirituais.
- source_word: μετέστησεν
  choice: transferiu
  rationale: μεθίστημι descreve a mudança de uma esfera, condição ou domínio para outro. “Transferiu” preserva o movimento formal entre dois poderes governantes.
- source_word: βασιλείαν
  choice: reino
  rationale: βασιλεία pode designar reinado ou reino. Com εἰς e a imagem de transferência, “reino” expressa naturalmente a entrada na esfera governada pelo Filho, sem excluir a ideia de seu reinado.
- source_word: υἱοῦ
  choice: Filho
  rationale: υἱός significa “filho”. A inicial maiúscula identifica o referente cristológico no contexto sem alterar o sentido lexical.
- source_word: ἀγάπης
  choice: amor
  rationale: ἀγάπη é traduzido diretamente por “amor”, preservando-se na expressão principal a construção genitiva do grego.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: o Filho do seu amor
  rationale: A formulação conserva de perto a estrutura genitiva grega, literalmente “o Filho do amor dele”. “Do seu amor” é compreensível e digna em português; interpretações mais idiomáticas aparecem na nota.
theological_decisions:
- issue: Interpretação da expressão genitiva τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: o Filho do seu amor
  alternative: seu Filho amado; o Filho a quem ele ama
  rationale: A expressão aponta para o amor especial de Deus pelo Filho, mas sua forma exata admite uma tradução estrutural e formulações idiomáticas. O texto principal preserva a textura do grego, e a nota registra as interpretações naturais sem decidir além do que a construção exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “autoridade das trevas” e “Filho do seu amor” para preservar a estrutura e a tensão metafórica do original; a nota oferece equivalentes idiomáticos.
