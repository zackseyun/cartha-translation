  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: pt
  text: Ele é a imagem do Deus invisível, o primogênito[a] de toda a criação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o primogênito sobre toda a criação”. “Primogênito” pode expressar posição, primazia e direito de herança, e não necessariamente origem temporal; compare os versículos 16–17.'
    reason: A construção grega admite discussão quanto a “de” ou “sobre”, e a nota preserva a leitura de primazia sugerida pelo contexto imediato.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Ele é
  rationale: O pronome relativo retoma o Filho mencionado no versículo anterior. Em português, iniciar uma nova frase com “Ele é” é natural e mantém explícita a referência.
- source_word: εἰκὼν
  choice: imagem
  rationale: “Imagem” é a correspondência direta e tradicional, preservando tanto a ideia de representação quanto a de manifestação, sem definir além do que o texto diz.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: do Deus invisível
  rationale: A construção genitiva e o adjetivo atributivo são reproduzidos de modo claro e idiomático em português.
- source_word: πρωτότοκος
  choice: primogênito
  rationale: Preserva a metáfora bíblica e suas possíveis associações com precedência, posição e herança, sem substituí-la por uma interpretação como “supremo”.
- source_word: πάσης κτίσεως
  choice: de toda a criação
  rationale: Reproduz de perto o genitivo grego e preserva sua tensão interpretativa. A possibilidade contextual de relação de primazia ou autoridade é registrada na nota.
theological_decisions:
- issue: Sentido de πρωτότοκος πάσης κτίσεως na relação entre Cristo e a criação
  choice: o primogênito de toda a criação
  alternative: o primogênito sobre toda a criação
  rationale: A tradução principal conserva a forma genitiva do grego em vez de resolver no texto a questão como domínio ou posição. A nota apresenta a leitura contextual de primazia, relevante diante dos versículos 16–17, sem afirmar que “primogênito” descreva necessariamente origem temporal.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico amplamente compreensível. A ordem é natural em português e mantém o paralelismo conciso da afirmação cristológica.
