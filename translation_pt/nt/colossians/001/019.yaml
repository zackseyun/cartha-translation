id: COL.1.19
reference: Colossians 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: pt
  text: Pois toda a plenitude achou por bem habitar nele.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque toda a plenitude achou por bem habitar nele”. A conjunção pode ser entendida de mais de uma maneira explicativa neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Muitas traduções tornam explícito um sujeito entendido: “Pois Deus achou por bem que toda a sua plenitude habitasse nele” ou “Pois o Pai achou por bem…”. O grego não menciona diretamente Deus ou o Pai nesta frase.'
    reason: alternative_reading
  - marker: c
    text: “Toda a plenitude” é frequentemente entendida como a plenitude de Deus; compare Colossenses 2:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: No contexto, a conjunção introduz a razão das afirmações anteriores sobre o Filho. “Pois” comunica essa força explicativa com naturalidade, sem excluir a alternativa “porque”.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: O pronome retoma o Filho no contexto imediato. “Nele” preserva a forma pronominal do grego sem inserir aqui os títulos “Cristo” ou “Messias”.
- source_word: εὐδόκησεν
  choice: achou por bem
  rationale: A expressão comunica agrado e propósito favorável, mantendo a plenitude como possível sujeito gramatical e evitando acrescentar “Deus” ou “o Pai”, que não aparecem expressamente no texto grego.
- source_word: πᾶν τὸ πλήρωμα
  choice: toda a plenitude
  rationale: A tradução conserva tanto a abrangência de πᾶν quanto o substantivo definido πλήρωμα, sem acrescentar “de Deus”, embora esse sentido seja fortemente sugerido pelo contexto e por Colossenses 2:9.
- source_word: κατοικῆσαι
  choice: habitar
  rationale: O infinitivo descreve residência ou permanência. “Habitar” é claro, conciso e mantém o tom elevado da passagem.
theological_decisions:
- issue: Sujeito de εὐδόκησεν
  choice: Manter “toda a plenitude” como sujeito possível e não inserir “Deus” ou “o Pai” no texto principal.
  alternative: 'Pois Deus achou por bem que toda a sua plenitude habitasse nele; ou: Pois o Pai achou por bem que toda a plenitude habitasse nele.'
  rationale: A forma neutra πᾶν τὸ πλήρωμα pode ser entendida sintaticamente como sujeito de εὐδόκησεν, enquanto uma leitura tradicional entende Deus como sujeito implícito e “toda a plenitude” como sujeito do infinitivo. A tradução principal segue de perto a estrutura expressa e a nota registra a leitura com sujeito suprido.
- issue: Referente de “toda a plenitude”
  choice: Conservar “toda a plenitude” sem expandir para “toda a plenitude de Deus”.
  alternative: toda a plenitude de Deus; toda a sua plenitude
  rationale: O contexto, especialmente Colossenses 2:9, sustenta fortemente a referência à plenitude divina, mas o versículo não contém um genitivo explícito. A formulação não expandida preserva a densidade e a abertura da expressão original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Achou por bem” preserva o sentido volitivo e favorável de εὐδοκέω sem soar excessivamente coloquial nem obrigar a inserção de um sujeito não expresso. A ordem final “habitar nele” é natural em português e mantém a ênfase no ato de habitar.
