id: COL.1.5
reference: Colossians 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: pt
  text: por causa da esperança reservada para vocês nos céus,[a] da qual vocês já tinham ouvido falar[b] na mensagem da verdade,[c] o evangelho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “no céu”. O grego emprega o plural: “nos céus”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “da qual vocês ouviram falar antes” ou “da qual vocês tinham ouvido falar de antemão”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “na palavra da verdade”. “O evangelho” está em aposição, identificando essa palavra ou mensagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: por causa da esperança
  rationale: διά com acusativo expressa mais naturalmente a causa ou o fundamento no contexto. “Esperança” preserva o termo paulino sem reduzi-lo a mero otimismo subjetivo.
- source_word: ἀποκειμένην ὑμῖν
  choice: reservada para vocês
  rationale: ἀπόκειμαι indica algo guardado ou posto em reserva; “reservada” é natural em português e mantém a ideia de algo destinado em benefício dos leitores. “Vocês” deixa claro o plural de ὑμῖν.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural do grego e é uma formulação bíblica compreensível em português atual.
- source_word: ἣν προηκούσατε
  choice: da qual vocês já tinham ouvido falar
  rationale: O pronome relativo feminino retoma “esperança”. A construção “ouvir falar de” é a forma idiomática em português para ter recebido notícia de algo, e “já tinham” comunica a anterioridade presente no composto προακούω.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: na mensagem da verdade
  rationale: λόγος aqui designa a palavra ou mensagem proclamada. “Mensagem” evita uma formulação rígida sem eliminar a relação genitiva com “verdade”.
- source_word: τοῦ εὐαγγελίου
  choice: o evangelho
  rationale: O genitivo é apresentado como aposição que identifica a “mensagem da verdade”. “Evangelho” é corrente, conciso e amplamente compreendido.
theological_decisions:
- issue: Referente da oração relativa
  choice: “da qual” retoma diretamente “esperança”
  alternative: Entender a oração de modo mais amplo como referência à mensagem do evangelho em geral
  rationale: O pronome relativo feminino singular ἣν concorda diretamente com ἐλπίδα. A tradução conserva esse vínculo gramatical e a ênfase de que os colossenses já tinham ouvido falar dessa esperança.
- issue: Número de οὐρανοῖς
  choice: Manter o plural “nos céus”
  alternative: Usar o singular idiomático “no céu”
  rationale: O plural reproduz a forma grega sem impor uma harmonização com a expressão portuguesa mais habitual.
- issue: Relação entre “mensagem da verdade” e “evangelho”
  choice: Conservar “o evangelho” em aposição
  alternative: Explicitar a relação com “isto é, o evangelho” ou entender o genitivo como “a verdade do evangelho”
  rationale: A aposição identifica a mensagem da verdade como o evangelho e preserva a estrutura compacta e a possível tensão sintática do original, sem acrescentar um conector interpretativo ao texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção usa “vocês” para tornar explícito o plural e prefere “mensagem” no texto principal por naturalidade, registrando a forma mais literal em nota. A pontuação mantém “o evangelho” como aposição sem acrescentar uma explicação interpretativa.
