id: COL.1.3
reference: Colossians 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: pt
  text: Sempre damos graças a Deus, o Pai de nosso Senhor Jesus, o Messias[a], quando oramos por vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a forma tradicional, “Jesus Cristo”.
    reason: Registra a tradução tradicional de Χριστός, cuja forma portuguesa também pode funcionar como elemento fixo do nome-título.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: damos graças
  rationale: Expressa de modo natural e digno o sentido de manifestar gratidão, além de conservar a formulação típica das ações de graças epistolares.
- source_word: θεῷ πατρὶ
  choice: a Deus, o Pai
  rationale: 'Os dois dativos são entendidos em aposição: Deus é identificado como o Pai. A vírgula torna essa relação clara em português.'
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente português consagrado e adequado para o título κύριος nesta construção.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui força titular; a forma com artigo é idiomática em português e explicita o significado do título sem tratá-lo como sobrenome.
- source_word: πάντοτε
  choice: Sempre
  rationale: Transmite diretamente a ideia de continuidade ou regularidade e, nesta posição, liga-se naturalmente à ação principal de dar graças.
- source_word: περὶ ὑμῶν
  choice: por vocês
  rationale: Com o verbo de oração, περί com genitivo indica aqueles em favor de quem se ora; “por vocês” é a expressão idiomática em português.
- source_word: προσευχόμενοι
  choice: quando oramos
  rationale: A oração temporal natural em português expressa a circunstância simultânea do particípio presente em relação à ação de graças.
theological_decisions:
- issue: Tradução de Χριστός no contexto da ação de graças paulina
  choice: Messias
  alternative: Cristo
  rationale: O termo ainda pode ser compreendido como título, e “Messias” comunica seu conteúdo lexical. A forma tradicional “Cristo” é preservada em nota, sem excluir essa leitura consagrada.
- issue: Relação entre Deus e Pai em θεῷ πατρὶ
  choice: Deus, o Pai
  alternative: Deus Pai
  rationale: A aposição identifica Deus como o Pai de nosso Senhor Jesus; a pontuação evita transformar desnecessariamente a expressão em um título composto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e sintaxe fluente. “Damos graças” preserva o tom epistolar. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
