id: COL.1.9
reference: Colossians 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: pt
  text: Por essa razão, também nós, desde o dia em que ouvimos, não cessamos de orar por vocês e de pedir que sejam cheios do conhecimento[a] da vontade dele, com toda sabedoria e compreensão espirituais[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pleno conhecimento”. A palavra grega pode transmitir a ideia de um conhecimento mais completo ou profundo.'
    reason: lexical_alternative
  - marker: b
    text: “Espirituais” pode indicar que a sabedoria e a compreensão têm caráter espiritual ou que são dadas pelo Espírito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por essa razão
  rationale: Expressa a relação causal e inferencial com o relato anterior sobre a fé e o amor dos colossenses, em português natural.
- source_word: καὶ ἡμεῖς
  choice: também nós
  rationale: Mantém a ênfase inclusiva do pronome grego e o valor aditivo de καί.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: desde o dia em que ouvimos
  rationale: Indica o ponto inicial da oração contínua e soa idiomático em português.
- source_word: οὐ παυόμεθα
  choice: não cessamos
  rationale: Preserva o aspecto contínuo da ação até o presente sem tornar a frase excessivamente coloquial.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: Expressa de modo claro e corrente o benefício ou a representação dos destinatários na oração.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: orar por vocês e de pedir
  rationale: Conserva a distinção entre a oração em geral e a petição específica, com paralelismo natural em português.
- source_word: ἵνα πληρωθῆτε
  choice: que sejam cheios
  rationale: Mantém a imagem de plenitude e a voz passiva, deixando implícito o agente, como no grego.
- source_word: τὴν ἐπίγνωσιν
  choice: do conhecimento
  rationale: Traduz o substantivo sem impor no texto principal a possível nuance intensiva de conhecimento pleno; essa alternativa é registrada em nota.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: da vontade dele
  rationale: Reproduz a construção genitiva de modo claro; o pronome remete a Deus no contexto sem inserir o nome no texto.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: com toda sabedoria e compreensão espirituais
  rationale: Entende ἐν como circunstância ou modo acompanhante e faz “espirituais” qualificar naturalmente tanto “sabedoria” quanto “compreensão”.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: Equivalente corrente que abrange conhecimento aplicado e discernimento prático.
- source_word: συνέσει
  choice: compreensão
  rationale: Comunica a capacidade de entender e relacionar ideias, distinguindo-se de “sabedoria” sem recorrer a linguagem técnica.
theological_decisions:
- issue: Força de ἐπίγνωσις na oração de Paulo
  choice: conhecimento
  alternative: pleno conhecimento
  rationale: O termo pode ter sentido intensificado, mas “pleno conhecimento” no texto principal poderia destacar uma interpretação não exigida pela sintaxe. A nota preserva essa possibilidade lexical.
- issue: Referência de πνευματικῇ
  choice: “espirituais” qualificando sabedoria e compreensão, sem nomear explicitamente o Espírito Santo
  alternative: sabedoria e compreensão dadas pelo Espírito
  rationale: O adjetivo pode indicar caráter espiritual ou origem no Espírito. A tradução mantém a formulação compacta e aberta do grego, enquanto a nota registra a possível relação explícita com o Espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “não cessamos” preserva o tom elevado sem arcaísmo. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
