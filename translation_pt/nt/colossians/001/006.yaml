  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: pt
  text: que chegou até vocês[a] e que, assim como também em todo o mundo[b], está dando fruto e crescendo, tal como também entre vocês[c], desde o dia em que ouviram e conheceram a graça de Deus em verdade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que está presente entre vocês” ou “que chegou ao meio de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por todo o mundo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em vocês”; o grego pode se referir à comunidade como um todo ou à atuação do evangelho em seu interior.
    reason: lexical_alternative
  - marker: d
    text: Ou “verdadeiramente” ou “na verdade”.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: que chegou até vocês
  rationale: O particípio articular retoma “o evangelho” do versículo anterior. A formulação comunica sua chegada e atual presença entre os colossenses sem tornar explícito apenas um desses aspectos.
- source_word: καθὼς καὶ
  choice: assim como / tal como também
  rationale: As duas formulações naturais preservam a estrutura comparativa repetida e o valor inclusivo de καί, ligando a experiência dos colossenses à expansão mais ampla do evangelho.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: em todo o mundo
  rationale: Mantém a linguagem universal e enfática do grego sem especificar além do texto a extensão geográfica pretendida.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: está dando fruto e crescendo
  rationale: A forma progressiva expressa a ação contínua da construção perifrástica grega e conserva a metáfora agrícola.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: tal como também entre vocês
  rationale: “Entre vocês” é natural em português para a atuação do evangelho no âmbito da comunidade, enquanto a nota preserva a possibilidade mais literal de uma atuação “em vocês”.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: desde o dia
  rationale: Marca com clareza o início temporal da atuação frutífera do evangelho entre eles.
- source_word: ἠκούσατε
  choice: ouviram
  rationale: Traduz diretamente o aoristo sem acrescentar “pela primeira vez”, ideia possível pelo contexto, mas não expressa no verbo.
- source_word: ἐπέγνωτε
  choice: conheceram
  rationale: Expressa o reconhecimento real da graça sem impor ao verbo a noção discutível de conhecimento completo ou exaustivo.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: a graça de Deus
  rationale: Preserva a expressão paulina central com clareza e peso teológico.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: A formulação formal preserva a abertura semântica entre modo (“verdadeiramente”) e esfera ou conteúdo (“na verdade”).
theological_decisions:
- issue: Alcance de “todo o mundo”
  choice: Manter a formulação universal do grego como descrição ampla da expansão do evangelho.
  alternative: Entender a expressão como afirmação geográfica estritamente exaustiva, abrangendo naquele momento cada região e indivíduo do planeta.
  rationale: A tradução não restringe nem amplia interpretativamente a expressão; conserva a retórica universal de Paulo e deixa seu alcance ser determinado pelo contexto.
- issue: Nuance de ἐν ἀληθείᾳ
  choice: “em verdade”, preservando a ambiguidade entre modo e esfera ou conteúdo.
  alternative: “verdadeiramente” ou “na verdade”.
  rationale: As opções são semanticamente próximas, mas cada uma torna explícita uma nuance que o grego não exige que seja isolada.
- issue: Âmbito de ἐν ὑμῖν
  choice: “entre vocês”, destacando a atuação do evangelho na comunidade.
  alternative: “em vocês”, que pode indicar sua atuação interior ou corporativa.
  rationale: A opção principal é mais natural no contexto comunitário, enquanto a nota mantém aberta a leitura mais literal e interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural da segunda pessoa. A estrutura longa e encadeada conserva a continuidade sintática com o versículo anterior, enquanto pequenas variações (“assim como” e “tal como”) evitam rigidez sem apagar a repetição retórica.
