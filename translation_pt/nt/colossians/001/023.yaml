id: COL.1.23
reference: Colossians 1:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: pt
  text: se é que vocês permanecem na fé, alicerçados e firmes, sem se afastarem da esperança do evangelho que ouviram, o qual foi proclamado em toda a criação[a] debaixo do céu e do qual eu, Paulo, me tornei servo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a toda criatura debaixo do céu”; κτίσις pode significar “criação” ou, em certos contextos, “criatura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ministro”; o grego διάκονος pode designar um servo ou ministro, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: se é que
  rationale: Preserva a força condicional de εἰ e a ênfase de γε em uma expressão natural em português, sem transformar a condição em certeza nem insinuar dúvida maior do que o grego expressa.
- source_word: ἐπιμένετε τῇ πίστει
  choice: vocês permanecem na fé
  rationale: O presente indica continuidade, e “permanecem” expressa de modo natural a ideia de persistir. “Na fé” mantém a formulação aberta entre a fé dos leitores e a fé como esfera ou conteúdo cristão.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: alicerçados e firmes
  rationale: “Alicerçados” conserva a metáfora de fundamento e o resultado estável sugerido pelo particípio perfeito passivo; “firmes” comunica a estabilidade de ἑδραῖοι com clareza.
- source_word: μὴ μετακινούμενοι
  choice: sem se afastarem
  rationale: Expressa a continuidade negativa e a imagem de não sair de uma posição estabelecida, em português corrente e digno.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: da esperança do evangelho
  rationale: 'Mantém a relação genitiva deliberadamente ampla: a esperança anunciada, suscitada ou associada ao evangelho.'
- source_word: τοῦ κηρυχθέντος
  choice: o qual foi proclamado
  rationale: “Proclamado” preserva a ideia de anúncio público sem restringi-la à linguagem eclesiástica; o relativo retoma “evangelho”.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: em toda a criação debaixo do céu
  rationale: Conserva a formulação abrangente e cósmica do grego. A nota registra a alternativa lexical de κτίσις como “criatura”.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: do qual eu, Paulo, me tornei servo
  rationale: O relativo retoma naturalmente “evangelho”; “me tornei” representa ἐγενόμην, e “servo” evita acrescentar um cargo eclesiástico não explicitado por διάκονος.
theological_decisions:
- issue: Força condicional de εἴ γε e perseverança
  choice: se é que vocês permanecem
  alternative: visto que vocês permanecem; contanto que vocês permaneçam
  rationale: A tradução mantém uma condição real ligada à continuidade na fé, sem decidir por conta própria debates sobre apostasia, segurança ou perseverança garantida.
- issue: Sentido de πίστις em τῇ πίστει
  choice: na fé
  alternative: na confiança; na fidelidade
  rationale: “Fé” é o sentido mais provável no contexto e preserva a possibilidade de referência tanto ao ato de crer quanto à fé cristã, sem impor “fidelidade”.
- issue: Alcance de ἐν πάσῃ κτίσει
  choice: em toda a criação
  alternative: a toda criatura
  rationale: A leitura principal conserva a dimensão abrangente da expressão sem resolver a força retórica da afirmação nem restringi-la exclusivamente a cada indivíduo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural, evita jargão institucional desnecessário e preserva a metáfora do fundamento, a condição do período e as ambiguidades lexicais relevantes.
