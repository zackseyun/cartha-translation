  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: pt
  text: 'Aos irmãos santos e fiéis[a][b] no Messias[c] que estão em Colossos: graça e paz a vocês, da parte de Deus, nosso Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que creem”; o grego πιστοῖς pode descrever os que creem ou os que são fiéis.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” corresponde à forma grega; neste contexto, Paulo provavelmente se dirige a toda a comunidade, incluindo as mulheres.
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “em Cristo”. O título grego Χριστός significa “Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: que estão em Colossos
  rationale: Expressa de modo natural em português a localização dos destinatários indicada por ἐν com o nome da cidade.
- source_word: ἁγίοις
  choice: santos
  rationale: Mantém o sentido adjetival de pessoas separadas ou consagradas a Deus, sem recorrer a uma designação eclesiástica posterior.
- source_word: πιστοῖς
  choice: fiéis
  rationale: É uma descrição natural da fidelidade dos destinatários; a possível nuance de pessoas que creem é preservada em nota.
- source_word: ἀδελφοῖς
  choice: irmãos
  rationale: Reproduz o plural masculino do grego; a provável inclusão de mulheres na comunidade é esclarecida em nota.
- source_word: ἐν Χριστῷ
  choice: em Messias
  rationale: Traduz Χριστός como título e conserva a linguagem paulina de pertencimento ou união expressa por ἐν.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: graça e paz a vocês
  rationale: Verte a fórmula de saudação de Paulo em português corrente e digno, preservando seus dois elementos principais.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: da parte de Deus, nosso Pai
  rationale: Entende πατρὸς ἡμῶν como aposição a θεοῦ e evita inserir uma conjunção ausente no grego.
theological_decisions:
- issue: Sentido de πιστοῖς
  choice: fiéis
  alternative: os que creem; crentes
  rationale: O adjetivo pode indicar tanto fidelidade quanto fé. O texto principal usa a opção mais natural como descrição, sem eliminar a outra possibilidade, registrada em nota.
- issue: Alcance de ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, mas neste tipo de endereço paulino provavelmente abrange toda a comunidade, inclusive as mulheres; a nota conserva ambos os dados.
- issue: Tradução do título Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Χριστός conserva aqui seu valor titular. “Messias” comunica o significado do título, enquanto a forma tradicional “Cristo” é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem foi ajustada com moderação para evitar uma construção artificial, mantendo as relações sintáticas e as ambiguidades relevantes do grego.
