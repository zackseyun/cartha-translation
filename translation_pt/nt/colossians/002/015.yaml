id: COL.2.15
reference: Colossians 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: pt
  text: Ele despojou os principados e as autoridades e os expôs publicamente, triunfando sobre eles nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio dele”. O referente de “nele” pode ser Cristo; alguns entendem a expressão como referência à cruz mencionada no versículo anterior.'
    reason: A expressão grega ἐν αὐτῷ é ambígua quanto ao referente e ao valor instrumental ou locativo.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: despojou
  rationale: O particípio pode significar retirar, despir ou despojar. Aqui, com os poderes como objeto e no contexto de triunfo, “despojou” preserva a imagem de privar inimigos derrotados de suas armas ou insígnias sem reduzir o sentido apenas a “desarmou”.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: os principados e as autoridades
  rationale: Mantém a distinção tradicional e semanticamente possível entre duas categorias de poderes, entendidas no contexto como forças supra-humanas.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: os expôs publicamente
  rationale: Expressa de modo natural a ideia de exibição aberta e pública associada à humilhação dos vencidos.
- source_word: θριαμβεύσας αὐτοὺς
  choice: triunfando sobre eles
  rationale: Preserva a metáfora do cortejo triunfal e o domínio sobre os poderes derrotados.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Reproduz a forma pronominal masculina/neutra do grego e conserva a ambiguidade do referente, em vez de decidir silenciosamente entre Cristo, a cruz ou outro antecedente.
theological_decisions:
- issue: Sujeito das ações verbais
  choice: Deus, implícito pela continuidade com Colossenses 2:13-14
  alternative: Cristo
  rationale: O grego não explicita o sujeito neste versículo. A continuidade sintática favorece Deus como sujeito, mas a tradução mantém apenas “Ele”, sem inserir um nome interpretativo.
- issue: Referente de ἐν αὐτῷ
  choice: “nele”, preservando a referência pronominal
  alternative: “nela” (na cruz) ou “por meio dele” (Cristo)
  rationale: O referente é discutido. A formulação literal conserva a tensão exegética presente no texto grego e corresponde à revisão inglesa auditada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. “Principados” mantém a linguagem bíblica reconhecível, enquanto “expôs publicamente” comunica com clareza a imagem de humilhação pública. O marcador [a] aparece no texto principal.
