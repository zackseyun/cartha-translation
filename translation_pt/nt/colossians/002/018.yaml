source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: pt
  text: Que ninguém desqualifique vocês, comprazendo-se na humildade e no culto aos anjos[a], detendo-se no que viu[b], inflado sem motivo pela mente de sua carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na religião dos anjos” ou “no culto com os anjos”. A expressão grega pode ser entendida de mais de uma maneira.
    reason: alternative_reading
  - marker: b
    text: O verbo grego é raro e difícil; também pode ser traduzido como “entrando no que viu”. Alguns manuscritos trazem “no que não viu”, resultando em um sentido como “detendo-se no que não viu”.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: desqualifique
  rationale: Preserva a imagem de uma decisão adversa que exclui alguém do prêmio e soa natural no contexto da advertência.
- source_word: θέλων ἐν
  choice: tendo prazer em
  rationale: Neste contexto, o particípio provavelmente expressa gosto ou satisfação nas práticas mencionadas, e não mera vontade.
- source_word: ταπεινοφροσύνῃ
  choice: humildade
  rationale: Mantém o sentido lexical sem inserir no texto principal a interpretação de humildade fingida ou de mortificação ascética.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: culto aos anjos
  rationale: Adota no texto principal a leitura objetiva, isto é, culto dirigido aos anjos, preservando em nota a ambiguidade real do genitivo.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: detendo-se no que viu
  rationale: O verbo é raro e difícil; esta formulação comunica envolvimento insistente com experiências vistas sem especificar excessivamente seu sentido.
- source_word: εἰκῇ
  choice: inutilmente
  rationale: Expressa que esse orgulho é vazio, sem fundamento ou propósito válido.
- source_word: φυσιούμενος
  choice: cheio de orgulho
  rationale: Comunica de modo corrente a metáfora de estar inflado pela arrogância.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: pela mente de sua carne
  rationale: Mantém tanto 'mente' quanto 'carne', preservando a formulação tensa e teologicamente significativa de Paulo sem substituí-la por uma paráfrase doutrinária.
theological_decisions:
- issue: Sentido de θρησκείᾳ τῶν ἀγγέλων
  choice: culto dirigido aos anjos
  alternative: religião dos anjos; culto praticado com os anjos
  rationale: O genitivo admite mais de uma análise. O texto principal segue a leitura objetiva mais comum, enquanto a nota preserva as alternativas.
- issue: Sentido de σάρξ em τῆς σαρκὸς αὐτοῦ
  choice: carne
  alternative: natureza pecaminosa
  rationale: A tradução literal evita impor uma explicação teológica sistematizada e conserva a tensão antropológica paulina.
- issue: Variante textual em ἃ ἑόρακεν
  choice: no que viu
  alternative: no que não viu
  rationale: O texto da SBLGNT sustenta a leitura sem negação; a variante com 'não' é relevante e fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção deliberadamente incomum “mente de sua carne” preserva a tensão do grego; as ambiguidades do culto aos anjos, do verbo raro e da variante textual são explicitadas em notas.
