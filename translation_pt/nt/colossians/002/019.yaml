id: COL.2.19
reference: Colossians 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: pt
  text: e não se apegando à Cabeça[a], da qual todo o corpo, suprido e mantido unido por meio das juntas e dos ligamentos[b], cresce com o crescimento de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segurando-se firmemente à Cabeça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nutrido e bem unido por meio das juntas e dos ligamentos”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cresce o crescimento de Deus”; a expressão provavelmente significa o crescimento que vem de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: apegando-se
  rationale: Expressa vínculo firme e contínuo, não mero contato físico; encaixa-se naturalmente na metáfora da união com a Cabeça.
- source_word: κεφαλήν
  choice: Cabeça
  rationale: Mantém a metáfora anatômica e a referência contextual a Cristo; a inicial maiúscula sinaliza o referente sem acrescentar um título ausente do grego.
- source_word: ἐξ οὗ
  choice: da qual
  rationale: Em português, o relativo concorda gramaticalmente com «Cabeça» e indica que dela procede o sustento e a coesão de todo o corpo.
- source_word: πᾶν τὸ σῶμα
  choice: todo o corpo
  rationale: Forma idiomática que preserva a totalidade do único corpo retratado no texto.
- source_word: ἁφῶν
  choice: juntas
  rationale: No contexto anatômico, designa pontos de contato ou articulação; «juntas» é claro e corrente.
- source_word: συνδέσμων
  choice: ligamentos
  rationale: Designa aquilo que liga e mantém unido, preservando com precisão a imagem corporal.
- source_word: ἐπιχορηγούμενον
  choice: suprido
  rationale: Conserva o sentido amplo de receber provisão ou sustento sem restringi-lo apenas à nutrição.
- source_word: συμβιβαζόμενον
  choice: mantido unido
  rationale: Comunica coesão estrutural e unidade de modo natural, preservando a voz passiva do particípio.
- source_word: αὔξει
  choice: cresce
  rationale: Continua de modo vívido e idiomático a metáfora do corpo.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: com o crescimento de Deus
  rationale: Reproduz a construção genitiva compacta do grego e deixa a nota esclarecer que o sentido contextual provável é o crescimento que procede de Deus.
theological_decisions:
- issue: Valor do genitivo em τὴν αὔξησιν τοῦ θεοῦ
  choice: manter no texto «o crescimento de Deus»
  alternative: «o crescimento que vem de Deus» ou «o crescimento que Deus dá»
  rationale: A formulação principal preserva a concisão e a ambiguidade formal do genitivo grego; a nota evita a leitura equivocada de que Deus cresce e registra a interpretação contextual mais provável, sem torná-la a única possibilidade gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a metáfora corporal, evita terminologia confessional e conserva no texto a tensão do genitivo grego, esclarecida em nota.
