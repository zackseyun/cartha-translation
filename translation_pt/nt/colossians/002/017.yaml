  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: pt
  text: Essas coisas são uma sombra das coisas que estão por vir, mas o corpo é do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas a realidade pertence ao Messias”.'
    reason: Esclarece o possível sentido metafórico de “corpo” no contraste com “sombra”, sem substituir no texto principal a imagem do original.
lexical_decisions:
- source_word: ἅ
  choice: Essas coisas
  rationale: O pronome relativo neutro plural retoma os assuntos mencionados no versículo anterior. Em português, “Essas coisas” torna essa referência clara e natural.
- source_word: σκιὰ
  choice: uma sombra
  rationale: Mantém a imagem literal de algo que delineia antecipadamente outra realidade e preserva o contraste com “corpo”.
- source_word: τῶν μελλόντων
  choice: das coisas que estão por vir
  rationale: O particípio substantivado expressa aquilo que há de vir. A formulação conserva a orientação futura sem definir além do texto a natureza dessas coisas.
- source_word: δὲ
  choice: mas
  rationale: Expressa adequadamente o contraste entre “sombra” e “corpo”.
- source_word: σῶμα
  choice: o corpo
  rationale: É a tradução direta do termo grego e preserva a metáfora e sua possível tensão interpretativa, em vez de substituí-la no texto por “realidade” ou “substância”.
- source_word: τοῦ Χριστοῦ
  choice: é do Messias
  rationale: O genitivo indica relação ou posse na oração elíptica, e “Messias” preserva Χριστός como título.
theological_decisions:
- issue: Sentido de σῶμα no contraste com σκιά
  choice: “corpo”, mantendo a imagem formal do grego
  alternative: “realidade” ou “substância”, entendendo σῶμα como aquilo que corresponde à sombra
  rationale: O contraste sugere a realidade sólida em oposição à sombra, mas “corpo” conserva a expressão concreta do original e evita decidir silenciosamente como a metáfora deve ser interpretada.
- issue: Relação expressa por τοῦ Χριστοῦ
  choice: “é do Messias”
  alternative: “pertence ao Messias” ou “é a realidade encontrada no Messias”
  rationale: A construção grega é concisa e elíptica. A forma escolhida preserva essa concisão e o paralelismo com o verbo “são”, sem acrescentar uma explicação teológica ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “coisas” foi mantida para explicitar o referente plural e conservar a generalidade da expressão grega.
