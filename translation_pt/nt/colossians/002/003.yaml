id: COL.2.3
reference: Colossians 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: pt
  text: em quem estão ocultos todos os tesouros da sabedoria e do conhecimento[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no qual”, caso se entenda que o antecedente é, de modo mais amplo, o mistério de Deus, e não Cristo pessoalmente.
    reason: alternative_reading
  - marker: b
    text: Ou “guardados” ou “mantidos em reserva”; o adjetivo grego pode indicar algo oculto ou conservado em reserva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: em quem
  rationale: O pronome relativo no dativo singular refere-se mais naturalmente ao referente pessoal imediatamente anterior, Cristo (2:2). “Em quem” preserva tanto a referência pessoal quanto a força de ἐν; a possível referência mais ampla ao mistério de Deus é registrada em nota.
- source_word: πάντες οἱ θησαυροὶ
  choice: todos os tesouros
  rationale: O artigo com o substantivo plural favorece um sentido coletivo definido. A formulação preserva a abrangência da afirmação de Paulo sem parafraseá-la.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: da sabedoria e do conhecimento
  rationale: Mantém distintos os dois termos gregos relacionados, σοφία e γνῶσις, e reproduz diretamente os genitivos coordenados.
- source_word: ἀπόκρυφοι
  choice: ocultos
  rationale: “Ocultos” expressa de modo natural e digno o sentido de algo escondido ou encoberto, sem decidir se a ênfase recai sobre inacessibilidade ou conservação em reserva.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: estão ocultos
  rationale: A construção com o verbo εἰμί e o adjetivo predicativo é vertida naturalmente em português como “estão ocultos”, preservando a afirmação do grego.
theological_decisions:
- issue: Se ἀπόκρυφοι implica segredo esotérico ou localização segura em Cristo
  choice: “ocultos”, sem especificar por que ou para quem estão ocultos
  alternative: “guardados” ou “mantidos em reserva”, enfatizando conservação e disponibilidade; “secretos”, enfatizando ocultação de pessoas de fora
  rationale: O contexto pode confrontar pretensões de conhecimento especial, mas o adjetivo não resolve por si só a natureza dessa ocultação. A tradução preserva essa tensão teológica.
- issue: Antecedente de ἐν ᾧ
  choice: 'Referência principal a Cristo: “em quem”'
  alternative: 'Referência mais ampla ao mistério de Deus: “no qual”'
  rationale: Cristo é o referente pessoal mais imediato em 2:2, mas a forma relativa permite relacioná-la mais amplamente ao “mistério”; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ocultos” é corrente e formal sem ser arcaico; a ordem da frase acompanha de perto o grego sem soar artificial.
