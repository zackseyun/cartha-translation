id: COL.2.12
reference: Colossians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: pt
  text: tendo sido sepultados com ele no batismo[a], no qual vocês também foram ressuscitados com ele, por meio da fé na atuação de Deus[b], que o ressuscitou dentre os mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em quem”, se o pronome relativo for entendido como referência ao Messias, e não ao batismo.
    reason: alternative_reading
  - marker: b
    text: Ou “por meio da confiança”. A palavra grega também pode ter o sentido de “fidelidade” em alguns contextos, mas aqui “fé” é a tradução adotada no texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες
  choice: tendo sido sepultados com
  rationale: O particípio aoristo passivo indica uma ação consumada ligada ao verbo principal; “com” expressa o prefixo συν- e preserva o tema da união com o Messias.
- source_word: αὐτῷ
  choice: ele
  rationale: O pronome dativo retoma o Messias no contexto; o pronome é natural em português e evita repetição desnecessária.
- source_word: ἐν τῷ βαπτισμῷ
  choice: no batismo
  rationale: Mantém a preposição ἐν e sua possível sobreposição locativa e instrumental sem definir uma teoria sacramental específica.
- source_word: ἐν ᾧ
  choice: no qual
  rationale: O antecedente sintaticamente mais próximo é βαπτισμῷ; a formulação mantém essa ligação, enquanto uma nota registra a possível referência ao Messias.
- source_word: συνηγέρθητε
  choice: vocês também foram ressuscitados com ele
  rationale: O aoristo passivo na segunda pessoa do plural é expresso de modo claro, e “com ele” torna explícito o valor do prefixo συν- no contexto.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Expressa o meio indicado por διά com genitivo. “Fé” é a leitura principal mais provável neste contexto, sem excluir em nota a nuance de confiança.
- source_word: τῆς ἐνεργείας
  choice: na atuação
  rationale: ἐνέργεια designa atividade ou poder em ação. “Atuação” é atual e inteligível, destacando a ação eficaz de Deus sem reduzi-la a poder abstrato.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: O genitivo identifica Deus como aquele de quem procede a atuação.
- source_word: τοῦ ἐγείραντος αὐτὸν
  choice: que o ressuscitou
  rationale: A oração relativa traduz naturalmente o particípio articular que caracteriza Deus.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressão portuguesa natural para a ressurreição, preservando a ideia de sair do meio dos mortos.
theological_decisions:
- issue: Referente de ἐν ᾧ
  choice: 'Referência ao batismo: “no qual”'
  alternative: 'Referência implícita ao Messias: “em quem”'
  rationale: O antecedente gramatical imediato é βαπτισμῷ, e o relativo dativo o retoma naturalmente. A alternativa permanece possível e é registrada em nota.
- issue: Sentido da linguagem batismal
  choice: Preservar a ligação estreita entre batismo, sepultamento e ressurreição com o Messias, juntamente com a fé
  alternative: Definir a passagem segundo uma leitura fortemente sacramental ou puramente simbólica
  rationale: O versículo associa diretamente essas realidades, mas não resolve por si só debates confessionais posteriores sobre a eficácia sacramental. A tradução conserva a tensão sem acrescentar uma conclusão denominacional.
- issue: Valor de πίστις
  choice: fé
  alternative: confiança; em outros contextos, fidelidade
  rationale: Aqui, “fé” é a tradução contextual principal e se encaixa como o meio pelo qual se participa da atuação ressuscitadora de Deus; a nuance de confiança é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” explicita a segunda pessoa do plural. A construção mantém o encadeamento do grego e sua linguagem forte de participação com o Messias, sem impor uma interpretação sacramental denominacional.
