id: COL.2.11
reference: Colossians 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: pt
  text: Nele vocês também foram circuncidados com uma circuncisão não feita por mãos, no despojamento do corpo da carne[a], na circuncisão do Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na remoção do corpo da carne”. “Carne” também pode ser entendida, de modo mais interpretativo, como “natureza pecaminosa”; aqui, porém, o termo grego é mantido de forma mais literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela circuncisão do Messias” ou “na própria circuncisão do Messias”. O grego pode indicar uma circuncisão efetuada pelo Messias, pertencente a ele ou associada a ele.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo retoma o Messias no contexto anterior. “Nele” é natural em português e preserva a ideia de união com ele.
- source_word: περιετμήθητε
  choice: vocês também foram circuncidados
  rationale: Reproduz o aoristo passivo como ação sofrida e concluída, mantendo a metáfora explícita da circuncisão.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: com uma circuncisão não feita por mãos humanas
  rationale: O dativo admite valor instrumental ou associativo. A formulação conserva o contraste bíblico entre ação humana e ação de origem não humana, ao mesmo tempo que soa clara em português moderno.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: ao se despirem
  rationale: O substantivo ἀπέκδυσις denota despojamento ou remoção. A construção verbal preserva a imagem de tirar uma vestimenta e oferece português mais natural.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: do corpo da carne
  rationale: Mantém de perto a difícil estrutura genitiva grega, sem decidir se Paulo se refere ao corpo físico, ao corpo caracterizado pela carne ou à antiga existência carnal.
- source_word: σαρκός
  choice: carne
  rationale: Preserva a terminologia paulina e evita a interpretação mais restrita “natureza pecaminosa”.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: na circuncisão do Messias
  rationale: A repetição de ἐν é mantida, e o genitivo “do Messias” continua aberto quanto a circuncisão efetuada por ele, pertencente a ele ou associada a ele.
theological_decisions:
- issue: Sentido de “a circuncisão do Messias”
  choice: 'Genitivo intencionalmente aberto: “na circuncisão do Messias”'
  alternative: “pela circuncisão realizada pelo Messias”, “na própria circuncisão do Messias” ou “na circuncisão que pertence ao Messias”
  rationale: τοῦ Χριστοῦ é gramaticalmente ambíguo. A tradução não determina qual relação genitiva Paulo pretende, preservando a tensão do texto.
- issue: Sentido de “corpo da carne”
  choice: Mantida a expressão literal “corpo da carne”
  alternative: “corpo carnal”, “corpo dominado pela carne” ou “natureza pecaminosa”
  rationale: A expressão grega é interpretativamente difícil. A versão evita inserir uma antropologia específica ou uma expansão presente em testemunhos textuais posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Mãos humanas” explicita o valor idiomático de “mãos” sem perder o contraste com a ação divina. “Ao se despirem” torna natural a metáfora de ἀπέκδυσις; as ambiguidades centrais de “corpo da carne” e “circuncisão do Messias” são preservadas e explicadas em notas.
