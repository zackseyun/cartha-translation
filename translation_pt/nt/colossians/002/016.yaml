id: COL.2.16
reference: Colossians 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: pt
  text: Portanto, ninguém julgue vocês[a] em questões de comida ou bebida[b], ou em relação a uma festa, lua nova ou sábados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «profira julgamento contra vocês».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, em questões de alimentação e bebida. Os termos gregos também podem significar «comer» e «beber».
    reason: cultural_note
  - marker: c
    text: 'A sequência «festa, lua nova e sábados» evoca o calendário sagrado judaico: celebrações anuais, mensais e semanais.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Portanto, ninguém
  rationale: οὖν assinala a conclusão decorrente do argumento anterior; μή com o imperativo e o sujeito indefinido τις forma naturalmente a proibição «ninguém».
- source_word: ὑμᾶς κρινέτω
  choice: julgue vocês
  rationale: κρίνω aqui se refere a avaliar ou pronunciar julgamento contra os destinatários por suas práticas. A formulação é direta, atual e preserva o foco do texto no ato de julgar.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: por causa de comida ou bebida
  rationale: βρῶσις e πόσις podem designar tanto o ato de comer e beber quanto comida e bebida. No contexto da lista de práticas, os sentidos categoriais são mais prováveis; a nota preserva a alternativa lexical.
- source_word: ἐν μέρει ἑορτῆς
  choice: com respeito a uma festa
  rationale: ἐν μέρει é idiomático e significa «com respeito a» ou «em matéria de», enquanto ἑορτή designa uma festa religiosa.
- source_word: νουμηνίας
  choice: à lua nova
  rationale: O termo se refere à observância mensal da lua nova. O artigo definido produz em português uma referência natural à instituição calendárica.
- source_word: σαββάτων
  choice: aos sábados
  rationale: O plural grego integra a conhecida sequência calendárica de festas, luas novas e sábados. O plural foi mantido sem especificar além do que o texto afirma.
theological_decisions:
- issue: Natureza das práticas enumeradas
  choice: A tradução proíbe que outros julguem os fiéis em questões alimentares e calendáricas, sem declarar neste versículo que tais práticas são intrinsecamente inválidas.
  alternative: Entender o versículo como abolição absoluta de todas essas observâncias, ou como referência exclusiva a regras ascéticas e humanas.
  rationale: O grego concentra-se no julgamento feito «com respeito a» essas matérias. Uma formulação mais forte resolveria um debate teológico que este versículo, isoladamente, não resolve.
- issue: Referência dos «sábados»
  choice: Manter o plural geral «aos sábados».
  alternative: Especificar «dias de sábado» ou restringir a expressão a sábados cerimoniais específicos.
  rationale: σαββάτων está no plural e faz parte da tríade calendárica, mas o versículo não explicita uma subdivisão teológica entre tipos de sábado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A sintaxe permanece próxima do grego sem reproduzir de modo artificial a repetição da preposição ἐν. «Festa», «lua nova» e «sábados» preservam a progressão anual, mensal e semanal.
