  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: pt
  text: pois nele habita corporalmente toda a plenitude da divindade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque nele habita corporalmente a plenitude inteira da divindade”.'
    reason: Alternativa lexical e sintática que explicita de outra maneira a totalidade de πᾶν τὸ πλήρωμα e a força causal de ὅτι.
lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão que fundamenta a advertência anterior e conserva de modo natural a força causal no contexto.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Reproduz diretamente a expressão locativa referente a Cristo, sem acrescentar uma ideia de exclusividade ausente do grego.
- source_word: κατοικεῖ
  choice: habita
  rationale: Expressa presença estável e contínua, preservando o peso do verbo κατοικέω e sendo natural no registro bíblico moderno.
- source_word: πᾶν τὸ πλήρωμα
  choice: toda a plenitude
  rationale: Comunica a totalidade indicada por πᾶν com o substantivo articulado, em formulação idiomática em português.
- source_word: τῆς θεότητος
  choice: da divindade
  rationale: Em português, “divindade” pode designar a condição ou natureza de Deus e preserva aqui a força de θεότης, mais forte que uma referência genérica a qualidades divinas.
- source_word: σωματικῶς
  choice: corporalmente
  rationale: É a correspondência adverbial mais direta e concisa, mantendo aberta a extensão exata da afirmação cristológica sem a parafrasear como mera aparência ou presença abstrata.
theological_decisions:
- issue: Força cristológica de θεότης e σωματικῶς
  choice: O texto afirma que toda a plenitude da divindade habita em Cristo corporalmente.
  alternative: Entender a expressão apenas como qualidades divinas ou como uma presença de Deus em Cristo sem afirmação da plena divindade.
  rationale: θεότης designa a condição ou realidade de ser Deus, e σωματικῶς qualifica esse habitar como corporal. A tradução conserva a elevada afirmação cristológica do grego sem desenvolver uma interpretação adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Habita” e “corporalmente” preservam a concisão e a densidade do original; a ordem escolhida soa natural sem enfraquecer a ênfase em toda a plenitude.
