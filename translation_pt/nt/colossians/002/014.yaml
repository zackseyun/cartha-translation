id: COL.2.14
reference: Colossians 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: pt
  text: tendo apagado o documento de dívida[a] contra nós, expresso em decretos[b], o qual nos era contrário, ele o retirou do caminho, pregando-o na cruz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certificado de dívida”, “reconhecimento de dívida” ou “registro escrito”. O termo grego pode designar um documento manuscrito que registra uma dívida ou obrigação legal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “com os decretos” ou “constituído por decretos”. A relação gramatical da expressão grega é discutida: ela pode indicar que a dívida estava registrada, definida ou contida em decretos.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: tendo apagado
  rationale: Preserva a imagem de eliminar o que estava escrito e mantém a forma participial do aoristo, indicando ação anterior ou concomitante à retirada do documento.
- source_word: χειρόγραφον
  choice: documento de dívida
  rationale: Comunica tanto o caráter escrito do termo quanto sua associação usual com uma obrigação ou reconhecimento de dívida, sem impor uma forma jurídica excessivamente específica.
- source_word: καθ’ ἡμῶν
  choice: contra nós
  rationale: É a equivalência direta e natural para a ideia de algo que pesa ou se apresenta contra alguém.
- source_word: τοῖς δόγμασιν
  choice: expresso em decretos
  rationale: Entende o dativo como descrição do conteúdo ou da forma do documento. A formulação é legível, não identifica os decretos especificamente com a Lei mosaica e a nota preserva outras relações sintáticas possíveis.
- source_word: ὑπεναντίον
  choice: nos era contrário
  rationale: Mantém a força adversa do termo sem intensificá-la para 'hostil'. O singular deixa claro que o antecedente é o documento.
- source_word: ἦρκεν
  choice: ele o retirou
  rationale: Expressa a remoção efetiva do documento. O pronome sujeito torna explícito o agente exigido pelo português, apontado pelo contexto mais amplo como Deus.
- source_word: ἐκ τοῦ μέσου
  choice: do caminho
  rationale: Equivalente idiomático em português para a retirada de algo que estava no meio ou constituía um impedimento.
- source_word: προσηλώσας
  choice: pregando-o
  rationale: O gerúndio expressa naturalmente o meio ou a circunstância concomitante da retirada e preserva a metáfora concreta.
- source_word: τῷ σταυρῷ
  choice: na cruz
  rationale: Forma consagrada e clara em português para o instrumento referido neste contexto; com 'pregar', a regência idiomática portuguesa favorece 'na cruz'.
theological_decisions:
- issue: Sentido de χειρόγραφον τοῖς δόγμασιν
  choice: um documento de dívida expresso em decretos, que pesava contra nós
  alternative: a própria Lei mosaica; uma confissão de dívida pelos pecados; uma acusação jurídica; um documento acompanhado de decretos ou constituído por eles
  rationale: A redação conserva a metáfora documental e jurídica, mas não identifica sem apoio explícito o documento com uma doutrina específica da Lei, do pecado ou da aliança. A nota registra a dificuldade sintática do dativo.
- issue: Sujeito de ἦρκεν
  choice: ele, isto é, Deus no contexto da frase mais ampla
  alternative: manter o agente apenas implícito
  rationale: O português natural pede um sujeito para o verbo finito. A explicitação pronominal acompanha o contexto sem inserir o nome de Deus no corpo deste segmento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura participial foi mantida porque o versículo integra uma frase iniciada anteriormente. Evitaram-se tanto o arcaísmo “cédula” quanto uma identificação denominacional dos “decretos”.
