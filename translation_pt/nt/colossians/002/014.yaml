  source_fidelity: 'A tradução preserva adequadamente a sequência e as relações do grego: o apagamento do documento, seu caráter contrário a nós, sua remoção e o ato de pregá-lo na cruz. “Documento de dívida” transmite bem χειρόγραφον sem identificar indevidamente o referente com a Lei mosaica, os pecados ou uma acusação específica. “Expresso em decretos” é uma leitura possível e cautelosa de τοῖς δόγμασιν; a nota registra de modo apropriado a incerteza sintática.'
