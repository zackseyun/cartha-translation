  terminology: '“Documento de dívida”, “decretos”, “contrário”, “retirou” e “cruz” são escolhas terminológicas adequadas e não confessionais. As notas são úteis, proporcionais e estão ancoradas nos pontos relevantes: [a] em χειρόγραφον e [b] em τοῖς δόγμασιν.'
