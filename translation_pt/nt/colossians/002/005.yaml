id: COL.2.5
reference: Colossians 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: pt
  text: Pois, embora eu esteja ausente no corpo, estou com vocês em espírito, alegrando-me ao ver a boa ordem que há entre vocês e a firmeza da fé que vocês têm no Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a estabilidade da fidelidade de vocês para com o Messias”.'
    reason: Preserva as nuances lexicais possíveis de στερέωμα (“estabilidade”) e πίστις (“fidelidade”), bem como o valor direcional de εἰς (“para com”).
lexical_decisions:
- source_word: τῇ σαρκί
  choice: no corpo
  rationale: No contraste com τῷ πνεύματι, refere-se à ausência física de Paulo. Em português atual, “no corpo” comunica esse sentido com mais naturalidade que o literalismo “na carne”, sem sugerir a acepção ética de natureza pecaminosa.
- source_word: τῷ πνεύματι
  choice: em espírito
  rationale: O contraste imediato favorece a presença não física do próprio Paulo. A forma “em espírito”, sem maiúscula, preserva a possibilidade interpretativa sem afirmar explicitamente uma referência ao Espírito Santo.
- source_word: χαίρων καὶ βλέπων
  choice: alegrando-me ao ver
  rationale: Os particípios presentes descrevem ações simultâneas. A ligação idiomática “alegrando-me ao ver” é natural em português e mantém tanto a alegria quanto a percepção de Paulo.
- source_word: τὴν τάξιν
  choice: a boa ordem que há entre vocês
  rationale: τάξις indica organização ou conduta ordeira digna de elogio. “Boa ordem” preserva esse valor positivo sem impor uma imagem estritamente militar.
- source_word: τὸ στερέωμα
  choice: a firmeza
  rationale: O substantivo expressa solidez, estabilidade ou constância. “Firmeza” combina naturalmente com fé e conserva a imagem de algo sólido.
- source_word: τῆς ... πίστεως ὑμῶν
  choice: da fé que vocês têm
  rationale: πίστις é vertido prioritariamente como “fé”. A construção relativa evita a repetição pesada de possessivos e prepara de modo claro o complemento “no Messias”.
- source_word: εἰς Χριστόν
  choice: no Messias
  rationale: εἰς marca aqui o objeto ou a direção da fé. Χριστός mantém valor titular, por isso “Messias” é adequado; em português, “fé ... no Messias” é a formulação idiomática.
theological_decisions:
- issue: Referente de πνεύματι no contraste entre corpo e espírito
  choice: Presença não física de Paulo, expressa por “em espírito”
  alternative: Presença com eles por meio do Espírito Santo
  rationale: A antítese com sua ausência corporal favorece a referência ao espírito do próprio Paulo. A grafia sem maiúscula evita decidir além do que a forma grega exige.
- issue: Valor de Χριστόν
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona como título daquele em quem a fé é depositada; “Messias” torna explícito esse valor titular.
- issue: Sentido de πίστις
  choice: fé no Messias
  alternative: fidelidade para com o Messias
  rationale: “Fé” é a leitura mais natural com εἰς Χριστόν. Como πίστις também pode carregar a nuance de fidelidade, a alternativa é preservada em nota.
- issue: Relação de χαίρων com βλέπων
  choice: “alegrando-me ao ver”
  alternative: “alegrando-me e vendo”
  rationale: A coordenação grega permite uma versão formal com dois particípios, mas em português a alegria é compreendida com naturalidade como resposta ao que Paulo vê. A tradução não altera o conteúdo afirmado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. Preferiu-se “no corpo” a “na carne” para evitar uma associação ética ausente do contexto. A sintaxe foi levemente naturalizada sem eliminar a oposição entre ausência corporal e presença em espírito nem as nuances de fé/fidelidade.
