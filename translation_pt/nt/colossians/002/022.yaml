  source_fidelity: A tradução representa adequadamente ἅ ἐστιν πάντα como «Todas essas coisas estão», εἰς φθορὰν como «destinadas a perecer» e τῇ ἀποχρήσει como «pelo uso». «Conforme mandamentos e ensinamentos humanos» preserva a origem humana indicada por τῶν ἀνθρώπων, sem introduzir interpretação confessional. O ponto de interrogação reflete corretamente a continuação da pergunta de 2:20 e a pontuação interrogativa da edição apresentada.
