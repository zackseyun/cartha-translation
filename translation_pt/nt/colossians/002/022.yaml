  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: pt
  text: Todas essas coisas estão destinadas a perecer pelo uso[a], conforme mandamentos e ensinamentos humanos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Todas essas coisas se acabam com o uso». A expressão grega ressalta que as coisas reguladas são temporárias e consumíveis.'
    reason: lexical_alternative
  - marker: b
    text: A expressão «mandamentos e ensinamentos humanos» provavelmente faz alusão a Isaías 29:13. A pergunta começou no versículo 20.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Todas essas coisas estão
  rationale: O pronome relativo neutro plural retoma as coisas abrangidas pelas proibições do versículo anterior. A formulação com «essas coisas» torna a referência clara em português.
- source_word: εἰς φθοράν
  choice: destinadas a perecer
  rationale: 'A expressão indica o destino das coisas mencionadas: deterioração, consumo ou destruição. «Destinadas a perecer» conserva a força direcional de εἰς sem sugerir necessariamente condenação eterna.'
- source_word: τῇ ἀποχρήσει
  choice: pelo uso
  rationale: ἀπόχρησις designa uso até o consumo ou esgotamento. A construção breve comunica que essas coisas perecem justamente ao serem usadas.
- source_word: κατὰ
  choice: conforme
  rationale: Introduz a norma segundo a qual tais prescrições são formuladas.
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: mandamentos e ensinamentos
  rationale: Mantém o caráter regulador de ἐντάλματα e o sentido não técnico de διδασκαλίας, além de preservar a provável ressonância de Isaías 29:13.
- source_word: τῶν ἀνθρώπων
  choice: humanos
  rationale: O genitivo caracteriza a origem dos mandamentos e ensinamentos. «Humanos» inclui as pessoas em geral e exprime naturalmente o contraste implícito com aquilo que vem de Deus.
theological_decisions:
- issue: Relação da oração com as regras ascéticas
  choice: As coisas sujeitas às proibições são perecíveis, e as regras são caracterizadas como humanas.
  alternative: A ênfase pode recair mais diretamente na inutilidade das próprias regras, por tratarem de coisas consumíveis.
  rationale: A tradução conserva como referente imediato as coisas mencionadas, sem definir além do grego se a crítica incide principalmente sobre os objetos regulados ou sobre os regulamentos.
- issue: Alcance da interrogação iniciada no contexto anterior
  choice: Manter o ponto de interrogação da edição grega, entendendo o versículo como continuação da pergunta iniciada em Colossenses 2:20.
  alternative: Pontuar o versículo como uma afirmação parentética independente.
  rationale: Na SBLGNT, o ponto e vírgula grego ao final funciona como ponto de interrogação. A pontuação escolhida conserva essa leitura contextual sem alterar o conteúdo da oração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. «Humanos» evita o masculino potencialmente restritivo sem apagar o contraste entre origem humana e divina. O ponto de interrogação segue a pontuação da fonte grega e o fluxo sintático do contexto.
