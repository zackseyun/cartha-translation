  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: pt
  text: Essas coisas, de fato, têm aparência de sabedoria em culto autoimposto[a], humildade e severidade para com o corpo[b], mas não têm valor algum contra a satisfação da carne.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “religiosidade voluntária” ou “culto imposto pela própria vontade”; tradicionalmente, “culto voluntário”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida por “tratamento severo do corpo”, “rigor para com o corpo” ou “privação do corpo”.
    reason: lexical_alternative
  - marker: c
    text: 'A cláusula final é difícil. Outras possibilidades: “não em honra alguma para a satisfação da carne” ou “sem honra alguma contra a satisfação da carne”.'
    reason: alternative_reading
  - marker: d
    text: “Carne” pode referir-se aqui aos desejos humanos corrompidos; compare o uso contextual desse termo por Paulo em outros textos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Essas coisas
  rationale: Retoma naturalmente as proibições dos versículos 21–22 e preserva a força anafórica do pronome.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: de fato, têm aparência de sabedoria
  rationale: 'Expressa o valor idiomático de λόγον ἔχειν e a concessão marcada por μέν: tais práticas parecem sábias, mas não são eficazes.'
- source_word: ἐθελοθρησκίᾳ
  choice: religião inventada
  rationale: O termo raro descreve uma prática religiosa produzida pela própria vontade, em vez de ordenada por Deus. A formulação é clara e conserva a nuance crítica.
- source_word: ταπεινοφροσύνῃ
  choice: humildade
  rationale: Mantém o sentido lexical habitual sem explicitar como falsa ou fingida uma humildade cuja avaliação irônica decorre do contexto.
- source_word: ἀφειδίᾳ σώματος
  choice: tratamento severo do corpo
  rationale: Comunica a ideia de rigor ascético e de não poupar o corpo, em português natural e digno.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: não têm valor algum
  rationale: Interpreta τιμή como valor ou proveito no contexto, estabelecendo o contraste entre aparência de sabedoria e falta de eficácia.
- source_word: πρὸς πλησμονὴν
  choice: contra a satisfação dos desejos
  rationale: Na leitura contextual adotada, πρός introduz aquilo que as práticas não conseguem conter, e πλησμονή aponta para saciedade ou gratificação. A inclusão de 'dos desejos' torna essa relação inteligível sem substituir σάρξ por uma paráfrase.
- source_word: τῆς σαρκός
  choice: da carne
  rationale: Preserva o termo teologicamente carregado e sua tensão sem reduzi-lo a 'natureza pecaminosa'; a nota esclarece a provável referência contextual.
theological_decisions:
- issue: Sentido da cláusula difícil οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: As práticas ascéticas não têm valor para conter a satisfação dos desejos da carne.
  alternative: Elas não honram o corpo e servem para a satisfação da carne; ou não conferem honra alguma, embora visem conter a saciedade da carne.
  rationale: 'A sintaxe grega é condensada e admite mais de uma análise. A leitura escolhida acompanha o fluxo do argumento: as regras parecem sábias, porém não têm poder real contra os impulsos da carne. A nota conserva alternativas genuínas e evita apresentar a interpretação como linguisticamente incontestável.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva tom formal e digno, mas evita construções excessivamente literais. Os marcadores aparecem junto às expressões pertinentes; as notas c e d acompanham a cláusula final e o termo “carne”.
