  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: pt
  text: Pois quero que vocês saibam como é grande a luta que tenho por vocês, pelos que estão em Laodiceia e por todos os que não viram o meu rosto pessoalmente,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em pessoa” ou “fisicamente”. O grego diz literalmente “meu rosto na carne”, referindo-se aqui à presença física.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Pois quero que vocês saibam
  rationale: “Pois” mantém a ligação explicativa de γάρ com o contexto anterior; a construção com θέλω e o infinitivo é expressa de modo direto e natural em português.
- source_word: ἡλίκον ἀγῶνα ἔχω ὑπὲρ ὑμῶν
  choice: como é grande a luta que tenho por vocês
  rationale: ἡλίκον destaca a grandeza ou intensidade, e ἀγών indica esforço árduo ou luta, não necessariamente uma competição literal. “Por vocês” conserva o sentido de atuação em favor deles.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: pelos que estão em Laodiceia
  rationale: O artigo com a expressão preposicional designa as pessoas que se encontram em Laodiceia; a formulação é clara e corrente.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: todos os que não viram
  rationale: “Todos os que” preserva a abrangência inclusiva de ὅσοι. O perfeito grego descreve a condição presente resultante de nunca terem visto Paulo; em português, o pretérito perfeito é a forma mais natural neste contexto.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: o meu rosto em carne e osso
  rationale: A expressão mantém a imagem concreta de “rosto” e comunica de modo idiomático que essas pessoas não haviam visto Paulo fisicamente, em pessoa.
theological_decisions:
- issue: Sentido de σάρξ em ἐν σαρκί
  choice: em carne e osso
  alternative: em pessoa; fisicamente; na carne
  rationale: Aqui σάρξ não designa natureza pecaminosa, mas presença física e corporal. “Em carne e osso” conserva a dimensão concreta da expressão grega sem introduzir uma leitura moral de “carne”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A ordem e a repetição de “por” preservam a progressão dos grupos mencionados. A vírgula final segue a continuidade sintática do versículo no contexto; em apresentação isolada, pode ser substituída por ponto.
