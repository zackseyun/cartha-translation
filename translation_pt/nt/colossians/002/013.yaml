id: COL.2.13
reference: Colossians 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: pt
  text: E a vocês, que estavam mortos nas suas transgressões[a] e na incircuncisão da carne de vocês[b], ele deu vida juntamente com ele, tendo-nos perdoado todas as nossas transgressões[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas suas ofensas”.'
    reason: lexical_alternative
  - marker: b
    text: “Incircuncisão da carne de vocês” refere-se mais diretamente ao estado corporal de não circuncidados, embora, no contexto, também tenha significado espiritual.
    reason: cultural_note
  - marker: c
    text: 'O grego passa de “vocês” para “nós”: “tendo-nos perdoado todas as nossas transgressões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: que estavam mortos
  rationale: A oração relativa é natural em português e conserva o estado de morte expresso pelo particípio, sem explicitar uma causa não marcada no grego.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: nas suas transgressões
  rationale: Mantém a preposição ἐν e a imagem de uma condição situada no âmbito das ofensas; “transgressões” é claro e digno no português atual.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: na incircuncisão da carne de vocês
  rationale: “Incircuncisão” preserva a referência concreta ao estado corporal, enquanto “carne” mantém a possível ressonância espiritual sem convertê-la em “natureza pecaminosa”.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: ele deu vida [a vocês] juntamente com ele
  rationale: Reproduz a ação de dar vida em associação com o referente masculino do contexto e conserva o pronome grego, sem inserir “Cristo” no texto principal.
- source_word: χαρισάμενος
  choice: tendo-nos perdoado
  rationale: A construção participial conserva a ligação estreita com o verbo principal e expressa o sentido de perdão gracioso sem acrescentar uma explicação teológica.
- source_word: ἡμῖν
  choice: nos
  rationale: Preserva a mudança textual da segunda pessoa (“vocês”) para a primeira pessoa do plural (“nós”).
- source_word: πάντα τὰ παραπτώματα
  choice: todas as nossas transgressões
  rationale: Mantém a totalidade indicada por πάντα e repete o mesmo termo usado anteriormente para παράπτωμα.
theological_decisions:
- issue: Sentido de σάρξ em τῆς σαρκὸς ὑμῶν
  choice: “carne” em sentido corporal, com possível ressonância espiritual
  alternative: “natureza pecaminosa”
  rationale: O contexto imediato de circuncisão favorece a referência corporal. Traduzir por “natureza pecaminosa” resolveria uma tensão que o texto mantém.
- issue: Referente de αὐτῷ em σὺν αὐτῷ
  choice: manter o pronome “ele” no texto principal
  alternative: explicitar “Cristo”
  rationale: O contexto aponta para Cristo, mas o grego usa um pronome; mantê-lo evita substituir a expressão original por uma identificação interpretativa.
- issue: Mudança de ὑμᾶς para ἡμῖν
  choice: preservar “vocês” e depois “nos/nossas”
  alternative: harmonizar tudo como “vocês” ou tudo como “nós”
  rationale: A mudança de pessoa está no texto grego e pode indicar uma ampliação dos destinatários para incluir Paulo e outros fiéis; não deve ser apagada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção inicial “E a vocês” marca naturalmente o objeto antecipado do grego. Conservam-se a repetição de “transgressões”, a linguagem concreta de “carne” e a mudança de pessoa gramatical.
