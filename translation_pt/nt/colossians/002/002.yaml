  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: pt
  text: para que seus corações sejam encorajados[a], e eles, unidos em amor[b], alcancem toda a riqueza da plena certeza do entendimento, para o pleno conhecimento[c] do mistério de Deus, o Messias[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “sejam consolados” ou “sejam fortalecidos”. O verbo grego pode abranger encorajamento, consolo e fortalecimento interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “estreitamente unidos em amor”. O verbo pode indicar pessoas reunidas ou ligadas umas às outras.
    reason: lexical_alternative
  - marker: c
    text: Ou simplesmente “conhecimento”. O termo grego ἐπίγνωσις pode, em certos contextos, ter o sentido intensificado de conhecimento pleno ou aprofundado.
    reason: lexical_alternative
  - marker: d
    text: 'A expressão grega é concisa e de interpretação difícil: “o mistério de Deus, Messias”. Esta tradução entende “o Messias” como aposto: o mistério de Deus é identificado com o Messias.'
    reason: alternative_reading
  - marker: e
    text: Alguns manuscritos apresentam uma forma mais longa, como “o mistério de Deus, o Pai, e do Messias”. A tradução segue a leitura mais curta do texto grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: sejam encorajados
  rationale: No contexto, o verbo abrange ânimo, consolo e fortalecimento interior. “Encorajados” conserva essa amplitude sem restringir o sentido apenas à consolação.
- source_word: καρδίαι
  choice: corações
  rationale: Preserva a imagem antropológica do grego, que se refere ao centro interior da pessoa, sem reduzi-la apenas à mente ou às emoções.
- source_word: συμβιβασθέντες
  choice: estando eles unidos
  rationale: O particípio masculino plural se refere às pessoas, não gramaticalmente aos “corações”. Neste contexto relacional, seguido de “em amor”, o sentido de reunir ou unir estreitamente é o mais provável.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Mantém a expressão concisa e apresenta o amor como a esfera ou vínculo dessa união.
- source_word: εἰς πᾶν πλοῦτος
  choice: para que alcancem toda a riqueza
  rationale: Expressa em português natural o movimento em direção a um resultado indicado por εἰς, preservando πλοῦτος como o singular coletivo “riqueza”.
- source_word: πληροφορίας τῆς συνέσεως
  choice: da plena certeza que vem do entendimento
  rationale: Torna clara a relação entre a certeza plena e o entendimento, evitando uma sequência nominal pouco natural em português.
- source_word: ἐπίγνωσιν
  choice: conhecimento pleno
  rationale: O termo pode sugerir conhecimento aprofundado ou completo. “Conhecimento pleno” comunica essa possível intensificação, sem transformá-lo em mera informação intelectual.
- source_word: μυστηρίου
  choice: mistério
  rationale: É o termo paulino apropriado para um propósito divino antes oculto e agora revelado; “segredo” seria semanticamente mais estreito e teologicamente mais raso.
- source_word: θεοῦ, Χριστοῦ
  choice: de Deus, o Messias
  rationale: A formulação entende Χριστοῦ como aposto que identifica o mistério de Deus. O artigo português torna a construção inteligível, enquanto a nota preserva a concisão e a dificuldade do grego.
theological_decisions:
- issue: Relação apositiva em τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: “do mistério de Deus, o Messias”, entendendo o Messias como identificação apositiva do mistério
  alternative: Manter a formulação comprimida “do mistério de Deus, Messias”, ou adotar a leitura manuscrita mais longa “de Deus, o Pai, e do Messias”
  rationale: O texto grego fornecido apresenta Χριστοῦ sem uma conjunção que introduza um segundo objeto. A aposição é uma leitura sintaticamente plausível e coerente com o contexto de Colossenses, mas a nota registra que o original é conciso e admite discussão.
- issue: Força de ἐπίγνωσις
  choice: “conhecimento pleno”
  alternative: “conhecimento”
  rationale: A tradução torna perceptível a possível força intensiva do substantivo, mas a nota reconhece que nem todo uso exige que essa intensidade seja explicitada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura final conserva a progressão do grego, mas explicita o valor de finalidade de εἰς por meio de “para que alcancem”. O título Χριστός é traduzido como “o Messias”, não tratado como nome próprio.
