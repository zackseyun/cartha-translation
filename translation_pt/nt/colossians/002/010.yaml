  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: pt
  text: e, nele, vocês foram levados à plenitude[a], que é a cabeça de todo principado e autoridade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram cheios” ou “foram levados à plena realização”.
    reason: lexical_alternative
  - marker: b
    text: “Cabeça” preserva a metáfora grega; aqui, o sentido é que Cristo é supremo sobre todo principado e autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação direta com o argumento do versículo anterior.
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: vocês foram levados à plenitude
  rationale: Expressa o estado presente resultante da ação indicada pelo particípio perfeito passivo e conserva o tema da plenitude, com formulação natural em português.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva a linguagem paulina compacta de participação e união com Cristo sem explicá-la excessivamente.
- source_word: ὅς ἐστιν
  choice: Ele é
  rationale: Evita uma oração relativa pesada ou ambígua em português e deixa claro que o referente é Cristo.
- source_word: ἡ κεφαλή
  choice: a cabeça
  rationale: Conserva a metáfora grega; neste contexto, ela comunica a supremacia de Cristo sem substituir a imagem por uma interpretação.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: de todo principado e autoridade
  rationale: ‘Principado’ preserva a ideia de poder governante e a associação tradicional com poderes cósmicos; ‘autoridade’ traduz naturalmente ἐξουσία. O singular distributivo ‘todo’ acompanha os dois termos coordenados.
theological_decisions:
- issue: A plenitude dos que estão em Cristo
  choice: Afirmar que, nele, os destinatários foram levados à plenitude
  alternative: ‘estão completos nele’ ou ‘foram preenchidos nele’
  rationale: A tradução mantém a voz passiva, o resultado presente e a ligação com a plenitude de Cristo em 2.9, sem restringir a frase a uma doutrina técnica de perfeição sem pecado nem defini-la apenas em termos jurídicos.
- issue: Sentido de κεφαλή em relação aos poderes
  choice: Manter a metáfora ‘cabeça’, entendida contextualmente como supremacia
  alternative: Traduzir diretamente como ‘governante’ ou entender como ‘fonte’
  rationale: O contexto dos poderes cósmicos favorece a supremacia de Cristo, mas o texto principal deve preservar a imagem e não apagar sua amplitude semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural ‘vocês’ torna explícito o destinatário plural. A divisão em duas frases evita que o relativo pareça retomar ‘plenitude’ e melhora a clareza sem alterar a relação lógica.
