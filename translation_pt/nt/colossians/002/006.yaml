id: COL.2.6
reference: Colossians 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: pt
  text: Portanto, assim como vocês receberam o Messias Jesus[a], o Senhor, andem nele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”.
    reason: Registra a forma tradicional alternativa para Χριστὸν Ἰησοῦν.
lexical_decisions:
- source_word: Ὡς
  choice: assim como
  rationale: Introduz a comparação entre a maneira como os colossenses receberam Jesus e sua conduta contínua; a expressão é clara e natural em português.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém explicitamente a inferência que liga esta exortação ao argumento anterior.
- source_word: παρελάβετε
  choice: receberam
  rationale: Preserva a amplitude do verbo, que pode envolver tanto o acolhimento da mensagem transmitida quanto o recebimento da própria pessoa anunciada, sem restringi-lo a uma única nuance.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: o Messias Jesus
  rationale: Traduz Χριστός como título e translitera Ἰησοῦς como nome. A formulação conserva a ordem e a força titular da expressão grega.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Mantém o título cristológico estabelecido e a aposição do texto grego.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva de modo conciso a linguagem paulina de esfera, relação e união, sem explicá-la de forma excessivamente restritiva.
- source_word: περιπατεῖτε
  choice: andem
  rationale: Conserva a metáfora paulina do caminhar como modo de vida e expressa naturalmente o imperativo dirigido à comunidade.
theological_decisions:
- issue: Tradução de Χριστός na sequência titular paulina
  choice: o Messias Jesus
  alternative: Cristo Jesus
  rationale: O artigo e a construção apositiva permitem reconhecer a força titular de Χριστός. A tradução principal comunica o sentido do título; a forma tradicional é registrada em nota.
- issue: Linguagem paulina de união em ἐν αὐτῷ
  choice: nele
  alternative: em união com ele
  rationale: A forma concisa mantém a riqueza e a ambiguidade da expressão grega, sem resolver sua dimensão teológica por meio de uma paráfrase.
- issue: Metáfora de conduta em περιπατεῖτε
  choice: andem
  alternative: vivam
  rationale: A opção mantém a imagem do original, enquanto “vivam” tornaria explícito apenas seu sentido figurado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O pronome “vocês” torna explícito o sujeito plural já marcado pelos verbos. A metáfora “andem nele” foi mantida por sua importância no discurso paulino.
