  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: pt
  text: Tenham cuidado para que ninguém os leve cativos por meio da filosofia e do engano vazio, segundo a tradição humana, segundo os elementos do mundo[a], e não segundo o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os princípios elementares do mundo” ou “os espíritos elementares do mundo”. A expressão grega pode designar elementos ou princípios básicos e também poderes espirituais cósmicos.
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Cristo”; aqui traduzido como “Messias” porque o sentido de título está em destaque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Tenham cuidado para que ninguém
  rationale: O imperativo presente plural introduz uma advertência. A formulação é natural em português e mantém a força exortativa da construção com μή τις.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: os leve cativos
  rationale: A perífrase futura aponta para o risco de alguém capturá-los; συλαγωγέω evoca levar pessoas como despojo. A tradução conserva essa metáfora sem tornar a frase pesada.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: por meio da filosofia e do engano vazio
  rationale: διά com genitivo indica o meio. Mantêm-se os dois substantivos coordenados, sem decidir que 'engano vazio' seja necessariamente uma explicação de 'filosofia'.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: segundo a tradição humana
  rationale: κατά expressa norma ou padrão; 'humana' transmite o sentido genérico de ἀνθρώπων e contrasta essa tradição com o padrão do Messias.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: segundo os elementos do mundo
  rationale: A expressão στοιχεῖα τοῦ κόσμου é semanticamente disputada. 'Elementos do mundo' permanece próxima do grego e preserva melhor a abertura entre componentes, princípios rudimentares e poderes cósmicos; a nota explicita as principais possibilidades.
- source_word: οὐ κατὰ Χριστόν
  choice: e não segundo o Messias
  rationale: Χριστός é aqui um título e funciona como o padrão em contraste com a tradição humana e os στοιχεῖα do mundo; 'Messias' torna explícito seu valor titular.
theological_decisions:
- issue: Sentido de στοιχεῖα τοῦ κόσμου
  choice: os elementos do mundo
  alternative: os princípios elementares do mundo; os espíritos elementares do mundo
  rationale: O uso paulino admite mais de uma compreensão, incluindo estruturas ou ensinamentos rudimentares e poderes cósmicos. O texto principal evita escolher silenciosamente uma delas, e a nota preserva as alternativas relevantes.
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contraste, o título funciona como a norma pessoal à qual o ensino deve corresponder. 'Messias' conserva de modo transparente o sentido titular, sem negar que 'Cristo' seja a forma tradicional em português.
translation_notes:
  register: Português atual, digno e de leitura ampla, com forma plural brasileira ('os'). A repetição de 'segundo' preserva a estrutura retórica do grego. 'Engano vazio' mantém a imagem de algo destituído de conteúdo ou valor, embora 'engano sem fundamento' fosse mais idiomático e mais interpretativo.
