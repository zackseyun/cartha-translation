lexical_decisions:
- source_word: Μὴ ἅψῃ
  choice: Não pegue
  rationale: A construção com μή e o subjuntivo aoristo expressa proibição. ἅψῃ pode significar “tocar” ou “pegar”; “pegue” distingue este primeiro verbo do posterior θίγῃς, traduzido por “toque”.
- source_word: μηδὲ
  choice: nem
  rationale: A conjunção negativa repetida liga cumulativamente as três proibições; “nem” reproduz essa coordenação de modo natural em português.
- source_word: γεύσῃ
  choice: prove
  rationale: γεύομαι significa literalmente “provar” ou “experimentar o sabor”; “prove” mantém o sentido direto no contexto de regras ascéticas.
- source_word: θίγῃς
  choice: toque
  rationale: θιγγάνω significa “tocar” ou “entrar em contato com”; “toque” é a correspondência portuguesa mais direta e preserva a distinção em relação a ἅψῃ.
theological_decisions:
- issue: Natureza das proibições no contexto
  choice: Manter a série nua e abrupta de regras em forma de citação, sem acrescentar objetos ou explicações.
  alternative: Expandir como “Não pegue isto, não prove aquilo, não toque” ou ligar explicitamente as ordens a regulamentos humanos.
  rationale: O grego deste versículo contém apenas três proibições concisas. Acrescentar referentes ou explicações importaria elementos interpretativos do contexto para dentro do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão retórica do grego. O travessão final sinaliza a continuidade sintática da citação no contexto imediato.
