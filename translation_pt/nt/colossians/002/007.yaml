source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: pt
  text: tendo sido enraizados e sendo edificados nele, e sendo firmados na fé[a], assim como foram ensinados, transbordando de gratidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na confiança”; alternativamente, “na fidelidade”. O termo grego pístis pode significar fé, confiança ou fidelidade, embora aqui “a fé” provavelmente se refira à fé que lhes foi ensinada.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: tendo sido enraizados
  rationale: O particípio perfeito expressa uma ação concluída cujos efeitos permanecem. A formulação preserva tanto esse aspecto quanto a metáfora agrícola.
- source_word: ἐποικοδομούμενοι
  choice: sendo edificados
  rationale: O particípio presente indica um processo contínuo. “Edificados” mantém a metáfora de construção sem introduzir um fundamento não expresso.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: O pronome retoma Cristo no contexto imediato; a tradução mantém o pronome em vez de substituí-lo pelo nome ou título.
- source_word: βεβαιούμενοι
  choice: sendo firmados
  rationale: Expressa o processo de tornar-se firme, seguro ou bem estabelecido. É natural em português e não restringe o sentido a mero fortalecimento.
- source_word: τῇ πίστει
  choice: na fé
  rationale: O artigo e a referência ao ensino recebido favorecem o sentido definido da fé ou mensagem crida, embora o termo também possa indicar confiança ou fidelidade.
- source_word: καθὼς ἐδιδάχθητε
  choice: assim como foram ensinados
  rationale: Preserva a força comparativa de καθώς e a voz passiva do verbo, com formulação clara e corrente.
- source_word: περισσεύοντες
  choice: transbordando
  rationale: Mantém vividamente a ideia de abundância do particípio presente e sua natureza contínua.
- source_word: ἐν εὐχαριστίᾳ
  choice: de gratidão
  rationale: “Transbordando de gratidão” é idiomático em português e comunica o sentido de εὐχαριστία sem a rigidez de uma reprodução literal da preposição.
theological_decisions:
- issue: Sentido de τῇ πίστει
  choice: “na fé”, provavelmente a fé ou mensagem recebida por ensino
  alternative: “na confiança” ou “na fidelidade”
  rationale: O artigo definido e a oração “assim como foram ensinados” apontam para o conteúdo ou âmbito da fé ensinada. A nota conserva outros sentidos lexicalmente possíveis sem resolver além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e sem regionalismos marcados. As metáforas agrícola e arquitetônica foram preservadas, assim como a progressão aspectual entre o enraizamento já realizado e a edificação contínua.
