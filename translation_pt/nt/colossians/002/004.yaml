  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: pt
  text: Digo isso para que ninguém engane vocês com argumentação persuasiva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com argumentação plausível” ou “por meio de discurso plausível”.
    reason: alternativa lexical
lexical_decisions:
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo neutro singular retoma naturalmente a declaração ou linha de raciocínio anterior sem especificar em excesso seu alcance.
- source_word: λέγω
  choice: Digo
  rationale: O presente do indicativo é expresso de modo direto e natural em português.
- source_word: ἵνα
  choice: para que
  rationale: Preserva com clareza o valor de finalidade da conjunção.
- source_word: μηδεὶς
  choice: ninguém
  rationale: Equivalente corrente e digno para o sujeito indefinido negativo.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Explicita o plural da segunda pessoa e oferece leitura natural, especialmente no português brasileiro.
- source_word: παραλογίζηται
  choice: engane
  rationale: O verbo denota induzir ao erro, particularmente por raciocínio falho ou enganoso; “engane” comunica o sentido com clareza sem acrescentar um alvo doutrinário específico.
- source_word: ἐν πιθανολογίᾳ
  choice: com argumentação persuasiva
  rationale: A preposição indica meio ou maneira, e πιθανολογία se refere a fala ou argumentação capaz de persuadir ou parecer plausível, sem implicar que seja verdadeira.
theological_decisions:
- issue: Natureza da advertência em παραλογίζηται ἐν πιθανολογίᾳ
  choice: Advertência geral contra ser enganado por argumentação persuasiva ou plausível.
  alternative: Advertência específica contra uma filosofia falsa ou apenas contra eloquência verbal.
  rationale: O versículo não identifica por si só um sistema doutrinário específico. A tradução mantém a advertência em termos gerais e deixa que o contexto esclareça a ameaça.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Argumentação persuasiva” preserva o caráter retórico do perigo sem sugerir que o argumento seja verdadeiro.
