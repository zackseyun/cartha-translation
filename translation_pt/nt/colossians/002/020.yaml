source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: pt
  text: 'Se vocês morreram com o Messias para os princípios elementares do mundo[a], por que, como se vivessem no mundo, vocês se submetem a regulamentos[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os espíritos elementares do mundo”; alternativamente, “os elementos básicos do mundo”.
    reason: alternative_reading
  - marker: b
    text: Ou “por que vocês se deixam sujeitar a decretos?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Se
  rationale: Preserva a forma condicional grega, embora o contexto provavelmente pressuponha como verdadeira a morte dos leitores com o Messias.
- source_word: ἀπεθάνετε
  choice: vocês morreram
  rationale: O aoristo indica o acontecimento decisivo passado, expresso naturalmente pelo pretérito perfeito em português.
- source_word: σὺν Χριστῷ
  choice: com o Messias
  rationale: Traduz Χριστός como título e preserva seu sentido messiânico, sem tratá-lo apenas como nome próprio.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: para os princípios elementares do mundo
  rationale: Na construção portuguesa 'morrer para', a preposição 'para' expressa de modo natural o afastamento e a ruptura indicados por ἀπό. 'Princípios elementares' mantém aberta a discussão sobre sistemas rudimentares, elementos ou poderes espirituais.
- source_word: τί
  choice: por que
  rationale: Expressa de maneira idiomática a força da pergunta retórica.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: como se ainda vivessem no mundo
  rationale: Preserva a comparação hipotética de ὡς com o particípio; 'ainda' torna explícito o contraste contextual sem mudar sua lógica.
- source_word: δογματίζεσθε
  choice: vocês se submetem a regulamentos
  rationale: A forma médio-passiva admite tanto participação reflexiva quanto sujeição passiva. A formulação principal comunica naturalmente a participação dos leitores, enquanto a alternativa passiva é registrada em nota.
theological_decisions:
- issue: Sentido de στοιχεῖα no uso paulino
  choice: princípios elementares
  alternative: espíritos elementares; elementos básicos
  rationale: O termo pode designar fundamentos rudimentares, componentes do cosmos ou poderes cósmicos. A opção principal conserva parte dessa amplitude, e a nota registra as leituras concorrentes sem impor uma cosmologia específica.
- issue: Voz de δογματίζεσθε
  choice: vocês se submetem a regulamentos
  alternative: vocês se deixam sujeitar a decretos
  rationale: A forma pode ser entendida reflexiva ou passivamente. O texto principal destaca a adesão prática dos leitores; a nota preserva a alternativa passiva.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para o plural. A expressão idiomática 'morrer para' comunica separação. A pergunta termina com ponto de interrogação neste versículo, embora seu conteúdo seja desenvolvido pelas proibições do versículo seguinte.
