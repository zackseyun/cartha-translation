  terminology: «Messias», «princípios elementares do mundo» e «regulamentos» são escolhas apropriadas. A nota sobre «espíritos elementares» e «elementos básicos» preserva de modo útil a amplitude debatida de στοιχεῖα. A nota lexical deve estar ancorada no termo que ela explica.
