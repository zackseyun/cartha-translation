id: COL.3.11
reference: Colossians 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, slave, free, but Messiah is all[c][b], and in all.
translation:
  language: pt
  text: onde não há grego nem judeu, circuncisão nem incircuncisão, bárbaro, cita, escravo ou livre; mas o Messias[b] é tudo e está em todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega, concisa, pode ser entendida como «em todos» ou «em tudo». O contexto imediato trata dos integrantes da comunidade renovada.
    reason: alternative_reading
  - marker: b
    text: Grego Christós, título que significa «Messias». Tradicionalmente, «Cristo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Retoma o âmbito da nova humanidade mencionada no contexto anterior, preservando o sentido locativo de modo natural em português.
- source_word: οὐκ ἔνι
  choice: não há
  rationale: Expressa de forma idiomática a ausência dessas distinções no âmbito descrito.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: grego nem judeu
  rationale: Mantém os grupos específicos do grego; “nem” é a coordenação portuguesa natural sob a negação “não há”.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: circuncisão nem incircuncisão
  rationale: Conserva os substantivos abstratos usados como marcas de identidade religiosa e social.
- source_word: βάρβαρος
  choice: bárbaro
  rationale: Preserva a força histórica do termo que, no mundo greco-romano, designava quem era visto como culturalmente estrangeiro.
- source_word: Σκύθης
  choice: cita
  rationale: Emprega a forma portuguesa estabelecida para esse etnônimo antigo.
- source_word: δοῦλος
  choice: escravo
  rationale: O contraste explícito com ἐλεύθερος exige o sentido de condição servil, não o mais brando “servo”.
- source_word: ἐλεύθερος
  choice: livre
  rationale: É o equivalente direto e natural no contraste social com “escravo”.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca a forte contraposição entre as distinções enumeradas e a realidade centrada no Messias.
- source_word: τὰ πάντα
  choice: é tudo
  rationale: Preserva a formulação abrangente e concisa sem especificar além do que o texto afirma.
- source_word: ἐν πᾶσιν
  choice: está em todos
  rationale: Torna explícita em português a cópula subentendida e conserva a referência contextual aos integrantes da comunidade renovada, registrando em nota a concisão e a amplitude possíveis do grego.
- source_word: Χριστός
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός neste enunciado teológico; a forma tradicional “Cristo” é registrada em nota.
theological_decisions:
- issue: Alcance de ἐν πᾶσιν
  choice: está em todos
  alternative: está em tudo; em todos
  rationale: O contexto imediato aponta para as pessoas da comunidade renovada, mas a expressão grega é concisa. A nota preserva sua possível amplitude sem impor uma leitura metafísica ao texto principal.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Aqui o termo funciona de maneira claramente titular. “Messias” comunica seu conteúdo sem negar o uso tradicional de “Cristo”, indicado em nota.
- issue: Sentido de δοῦλος
  choice: escravo
  alternative: servo
  rationale: A oposição direta a “livre” torna saliente a condição social e jurídica de escravidão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A coordenação negativa usa “nem”, e o ponto e vírgula separa com clareza a lista de distinções da afirmação culminante sobre o Messias.
