  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: pt
  text: Pois quem pratica a injustiça receberá de volta o mal que praticou[a], e não há parcialidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “receberá o que merece pelo mal que praticou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “favoritismo”. O termo grego refere-se a julgar ou tratar alguém com base em sua aparência ou posição social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Pois quem pratica a injustiça
  rationale: O particípio presente substantivado tem sentido genérico e descreve qualquer pessoa que age injustamente. “Pois” preserva a função explicativa de γάρ.
- source_word: κομίσεται
  choice: receberá de volta
  rationale: O futuro de κομίζω expressa receber em retorno aquilo que corresponde à própria conduta; a formulação mantém a reciprocidade sem explicitar além do grego quem executa a retribuição.
- source_word: ὃ ἠδίκησεν
  choice: o mal que praticou
  rationale: O pronome relativo retoma aquilo que a pessoa fez injustamente. “O mal” evita a repetição pouco natural de “injustiça” e conserva o sentido moral de ἀδικέω.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: não há parcialidade
  rationale: προσωπολημψία indica tratamento parcial ou favorecimento baseado na posição ou aparência da pessoa. “Parcialidade” é atual, digna e abrangente.
theological_decisions:
- issue: Natureza da retribuição e da imparcialidade
  choice: A tradução apresenta um princípio geral de retribuição imparcial, sem determinar explicitamente seu agente, momento ou mecanismo.
  alternative: Restringir a declaração ao juízo escatológico ou somente às relações sociais imediatas entre escravos e senhores.
  rationale: O texto formula a advertência de maneira ampla. Preservar essa amplitude evita resolver uma tensão que o versículo não especifica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “quem pratica” comunica adequadamente o masculino singular genérico do grego sem introduzir gênero não exigido pelo sentido.
