source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: pt
  text: e, tendo-se revestido do novo ser humano[a], que está sendo renovado para o conhecimento[b], conforme a imagem daquele que o criou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do novo homem”. A expressão grega contrasta com o “velho homem” ou “velho ser humano” no contexto imediato.
    reason: lexical_alternative
  - marker: b
    text: Ou “para o pleno conhecimento”. A palavra grega pode transmitir a ideia de um conhecimento mais pleno ou profundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: se revestiram
  rationale: O particípio aoristo médio retoma a metáfora de vestir e se coordena com o contexto anterior. A forma verbal finita soa natural em português na continuação da frase e comunica a ação já realizada.
- source_word: τὸν νέον
  choice: o novo ser humano
  rationale: O adjetivo substantivado retoma, por elipse, a ideia de ἄνθρωπος no contraste contextual com o velho ser humano. A expressão preserva o sentido antropológico sem sugerir que a referência se limite ao sexo masculino.
- source_word: ἀνακαινούμενον
  choice: que está sendo renovado
  rationale: O particípio presente passivo indica um processo contínuo sofrido pelo novo ser humano; a tradução mantém tanto o aspecto progressivo quanto a voz passiva.
- source_word: εἰς ἐπίγνωσιν
  choice: para o conhecimento
  rationale: A preposição εἰς indica direção ou resultado do processo de renovação. ἐπίγνωσις pode ter a nuance de conhecimento pleno ou profundo, mas “conhecimento” evita tornar explícita no texto principal uma intensidade que permanece lexicalmente discutível.
- source_word: κατ’ εἰκόνα
  choice: conforme a imagem
  rationale: κατά com acusativo expressa padrão ou conformidade. “Conforme a imagem” é corrente em português e preserva a provável ressonância da linguagem da criação em Gênesis.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: daquele que o criou
  rationale: A expressão identifica o Criador como referência da renovação. O pronome masculino “o” concorda naturalmente com “o novo ser humano” e mantém a estrutura pessoal do grego.
theological_decisions:
- issue: Sentido antropológico de τὸν νέον
  choice: o novo ser humano
  alternative: o novo homem; a nova pessoa
  rationale: A tradução conserva o contraste entre a antiga e a nova humanidade ou identidade sem restringir o referente a homens. A alternativa tradicional é registrada em nota porque também reproduz de perto a elipse grega.
- issue: Intensidade semântica de ἐπίγνωσις
  choice: conhecimento
  alternative: pleno conhecimento; conhecimento mais profundo
  rationale: Embora o termo possa sugerir conhecimento pleno ou aprofundado, explicitar essa nuance no texto principal poderia resolver em excesso a amplitude lexical. A nota preserva a alternativa.
- issue: Força de εἰς em εἰς ἐπίγνωσιν
  choice: para o conhecimento
  alternative: no conhecimento
  rationale: “Para” preserva a ideia de direção ou resultado do processo de renovação. “No conhecimento” é português mais idiomático em algumas leituras, mas reduz a força direcional possível da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Revestiram” mantém a metáfora do vestuário; “novo ser humano” evita uma leitura exclusivamente masculina. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
