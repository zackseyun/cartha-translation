  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: pt
  text: Pais, não irritem seus filhos, para que eles não desanimem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não percam o ânimo”.'
    reason: Alternativa lexical que explicita a ideia de perda de coragem presente em ἀθυμέω.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Pais
  rationale: O substantivo πατέρες designa aqui especificamente os pais do sexo masculino, em harmonia com a distribuição de papéis no código doméstico; em português, “pais” pode ser formalmente ambíguo no plural, mas neste contexto corresponde naturalmente a “fathers”, não ao sentido genérico de “pais e mães”.
- source_word: μὴ ἐρεθίζετε
  choice: não irritem
  rationale: ἐρεθίζω indica provocar ou estimular negativamente. “Não irritem” é natural em português e comunica a conduta contínua que desperta uma reação prejudicial nos filhos.
- source_word: τὰ τέκνα ὑμῶν
  choice: seus filhos
  rationale: τέκνα é um termo inclusivo para a descendência; “filhos” é a forma portuguesa corrente que abrange filhos e filhas no contexto.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Preserva de modo claro a força de propósito ou resultado pretendido da construção grega.
- source_word: ἀθυμῶσιν
  choice: desanimem
  rationale: ἀθυμέω descreve perder o ânimo ou a coragem. “Desanimem” é conciso, atual e mantém o efeito interior causado pela provocação.
theological_decisions:
- issue: Alcance de πατέρες na instrução doméstica
  choice: Dirigido especificamente aos pais do sexo masculino
  alternative: Dirigido genericamente a pais e mães
  rationale: O grego diz explicitamente πατέρες, “pais”. Embora o princípio possa ter aplicação mais ampla, a tradução preserva o destinatário específico sem generalizá-lo para “pais e mães”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a concisão do grego e sua relação direta de causa e efeito.
