id: COL.3.23
reference: Colossians 3:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: pt
  text: Tudo o que fizerem, trabalhem de todo o coração,[a] como para o Senhor[b] e não para pessoas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a partir da alma”; também pode ser traduzido por “de coração” ou “com toda a alma”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto doméstico, “Senhor” também pode trazer a nuance de “senhor” ou “mestre”.
    reason: alternative_reading
  - marker: c
    text: O termo grego se refere aqui genericamente a seres humanos, em contraste com o Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Tudo o que fizerem
  rationale: A construção relativa indefinida exprime abrangência geral. “Tudo o que fizerem” é natural em português e preserva o sentido de “qualquer coisa que façam”.
- source_word: ἐκ ψυχῆς
  choice: de todo o coração
  rationale: Embora literalmente signifique “a partir da alma”, a expressão idiomática indica sinceridade interior e empenho integral. “De todo o coração” comunica esse sentido com naturalidade, enquanto a nota preserva a imagem lexical do grego.
- source_word: ἐργάζεσθε
  choice: trabalhem
  rationale: O imperativo presente exorta a uma atuação contínua e empenhada. “Trabalhem” é direto, natural e adequado ao contexto das instruções domésticas.
- source_word: ὡς
  choice: como para
  rationale: A partícula apresenta a perspectiva ou orientação com que o trabalho deve ser realizado. “Como para” reproduz essa comparação sem acrescentar a ideia contrafactual de “como se fosse”.
- source_word: τῷ κυρίῳ
  choice: o Senhor
  rationale: κύριος funciona naturalmente como título cristológico neste contexto. “Senhor” mantém esse valor, embora “senhor” no sentido de “dono” ou “mestre” também ecoe no contexto doméstico.
- source_word: ἀνθρώποις
  choice: pessoas
  rationale: O plural ἀνθρώποις designa seres humanos genericamente, em contraste com o Senhor. “Pessoas” expressa com clareza essa referência não restrita ao sexo masculino.
theological_decisions:
- issue: Sentido de κύριος no contexto de instruções a escravizados
  choice: Senhor
  alternative: senhor ou mestre
  rationale: A referência mais provável é ao Senhor exaltado, mas o contexto de relações domésticas permite ouvir também a nuance de autoridade de um senhor ou mestre. A tradução principal conserva o título cristológico e a nota registra a ressonância contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita linguagem excessivamente literal no corpo do texto, mas preserva em nota a imagem de ψυχή. “Pessoas” representa o valor humano genérico de ἀνθρώποις sem sugerir uma referência exclusivamente masculina.
