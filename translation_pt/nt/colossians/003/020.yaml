id: COL.3.20
reference: Colossians 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: pt
  text: Filhos, obedeçam aos seus pais em tudo, pois isso é agradável no Senhor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aceitável no Senhor”.'
    reason: lexical_alternative
  - marker: b
    text: “No Senhor” também pode ser entendido como aquilo que é agradável no âmbito da relação da pessoa com o Senhor, e não simplesmente como “agradável ao Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Filhos
  rationale: τέκνα designa os filhos de ambos os sexos. Em português, “filhos” é a forma coletiva natural e inclusiva neste contexto familiar.
- source_word: ὑπακούετε
  choice: obedeçam
  rationale: O imperativo de ὑπακούω expressa obedecer ou atender à autoridade; “obedeçam” comunica diretamente essa força no contexto da relação entre filhos e pais.
- source_word: τοῖς γονεῦσιν
  choice: aos seus pais
  rationale: γονεῦσιν significa “pais”. O possessivo “seus”, embora implícito no grego, é natural e necessário para uma formulação idiomática em português.
- source_word: κατὰ πάντα
  choice: em tudo
  rationale: A expressão indica extensão ou abrangência, “em tudo”, e não primariamente frequência temporal como “sempre”.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma a obediência ordenada na oração anterior. “Isso” preserva a referência de modo natural em português.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a razão da exortação; “pois” mantém com clareza essa relação explicativa.
- source_word: εὐάρεστόν ἐστιν
  choice: é agradável
  rationale: εὐάρεστος descreve aquilo que agrada ou é aceitável. “É agradável” conserva o sentido avaliativo sem recorrer a uma expressão arcaica.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: A tradução preserva a construção paulina e sua possível noção relacional ou de esfera, sem reduzi-la à interpretação mais estreita “ao Senhor”.
theological_decisions:
- issue: Alcance de “em tudo” em relação a “no Senhor”
  choice: Manter as duas expressões sem acrescentar uma ressalva explícita, apresentando a obediência abrangente no contexto da relação com o Senhor.
  alternative: Entender “no Senhor” como limitação direta da obediência ao que estiver de acordo com a vontade do Senhor, ou traduzir a frase como “isso agrada ao Senhor”.
  rationale: O grego não inclui uma cláusula explícita de exceção, e ἐν κυρίῳ se liga mais naturalmente à afirmação sobre o que é agradável. A redação preserva a tensão e a amplitude do texto sem introduzir na tradução uma qualificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Filhos” funciona como plural coletivo para filhos e filhas; “obedeçam aos seus pais” é idiomático e mantém a força do imperativo. As notas foram colocadas após a expressão final a que se referem.
