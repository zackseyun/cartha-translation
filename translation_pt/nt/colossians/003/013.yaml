  source_fidelity: A tradução transmite adequadamente os dois particípios exortativos de ἀνεχόμενοι e χαριζόμενοι, a reciprocidade expressa por ἀλλήλων e ἑαυτοῖς, a condição genérica relativa à queixa e a comparação com o perdão do Senhor. “Façam vocês também o mesmo” supre de modo idiomático a elipse final (οὕτως καὶ ὑμεῖς), sem introduzir indevidamente um modal de obrigação.
  naturalness: O português é moderno, claro e apropriado ao registro exortativo da carta. “Suportem uns aos outros” e “perdoem-se mutuamente” formam um paralelismo compreensível; “queixa contra outra pessoa” é natural e preserva o caráter interpessoal e genérico de μομφή.
  terminology: “Senhor” mantém corretamente o título κύριος sem especificar além do texto grego. “Perdoar/perdoou” preserva a correspondência lexical e semântica entre χαριζόμενοι e ἐχαρίσατο. A nota explica com precisão a elipse grega e está ancorada no final da frase, onde ela ocorre.
