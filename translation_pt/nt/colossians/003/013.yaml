reference: Colossians 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: pt
  text: Suportem uns aos outros e perdoem-se mutuamente, caso alguém tenha queixa contra outra pessoa. Assim como o Senhor perdoou vocês, façam vocês também o mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, a frase termina literalmente com “assim também vocês”; a ação de perdoar fica subentendida pelo contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: Suportem
  rationale: O verbo expressa tolerância paciente e contínua nas relações. A forma imperativa torna natural em português a força exortativa do particípio dentro da sequência de instruções.
- source_word: ἀλλήλων
  choice: uns aos outros
  rationale: Equivalente recíproco corrente e claro em português.
- source_word: χαριζόμενοι
  choice: perdoem-se
  rationale: Neste contexto, χαρίζομαι significa perdoar uma ofensa; a forma pronominal conserva a ação recíproca e mantém, na medida do possível, a relação lexical com ἐχαρίσατο.
- source_word: ἑαυτοῖς
  choice: mutuamente
  rationale: Embora formalmente reflexivo, aqui tem sentido recíproco dentro da comunidade. “Mutuamente” evita a repetição imediata de “uns aos outros”.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: caso alguém tenha queixa contra outra pessoa
  rationale: Mantém a condição genérica e indefinida. “Queixa” comunica motivo de censura ou ressentimento sem transformar a expressão em acusação formal.
- source_word: καθὼς καὶ
  choice: Assim como
  rationale: Preserva a comparação que fundamenta o perdão mútuo no perdão anterior do Senhor.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Conserva o título cristológico tradicional sem explicitar no texto mais do que o grego afirma.
- source_word: ἐχαρίσατο
  choice: perdoou
  rationale: É o equivalente direto e idiomático no contexto, além de repetir semanticamente o verbo anterior.
- source_word: οὕτως καὶ ὑμεῖς
  choice: façam vocês também o mesmo
  rationale: Explicita de modo natural a ação elíptica exigida em português, sem acrescentar modalidade de obrigação que não está lexicalmente expressa na frase final.
theological_decisions:
- issue: Referente de ὁ κύριος
  choice: Manter “o Senhor”, entendido mais naturalmente no contexto paulino como Cristo
  alternative: Entender “o Senhor” de modo mais geral como Deus
  rationale: O contexto de Colossenses favorece a referência a Cristo, mas a tradução conserva apenas o título do grego e não fecha a questão por explicitação.
- issue: Elipse na oração final
  choice: Explicitar a ação por meio de “façam vocês também o mesmo”
  alternative: Manter uma formulação elíptica ou repetir diretamente “perdoem”
  rationale: O grego omite o verbo final, recuperado do contexto. A expressão portuguesa completa a frase com naturalidade, remete claramente ao perdão e evita inserir um modal como “devem”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Suportem” evita o tom depreciativo de “aguentem”, e “queixa” mantém a amplitude da ofensa interpessoal. A pontuação divide a exortação e seu fundamento para facilitar a leitura.
