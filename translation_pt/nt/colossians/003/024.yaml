base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: pt
  text: sabendo que receberão do Senhor a recompensa da herança. Vocês servem[b] ao Senhor Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “ao Senhor Cristo”.
    reason: alternative_reading
  - marker: b
    text: 'O verbo grego está no indicativo: “vocês servem”; no contexto exortativo, também se pode entender: “Sirvam ao Senhor Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sabendo
  rationale: Mantém a forma participial e sua ligação com a exortação do versículo anterior, sem definir de modo explícito se a relação é causal.
- source_word: ἀπὸ κυρίου
  choice: do Senhor
  rationale: A contração portuguesa comunica naturalmente a origem indicada por ἀπό com genitivo; “Senhor” preserva o título cristológico.
- source_word: ἀπολήμψεσθε
  choice: receberão
  rationale: Reproduz o futuro indicativo de maneira clara; a ideia de recebimento em retribuição é expressa pelo substantivo “recompensa”.
- source_word: ἀνταπόδοσιν
  choice: a recompensa
  rationale: É uma expressão corrente e compreensível para a retribuição positiva indicada no contexto.
- source_word: τῆς κληρονομίας
  choice: da herança
  rationale: Conserva a expressão genitiva compacta do grego sem decidir expressamente se a herança constitui a recompensa ou está ligada a ela de outro modo.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: ao Senhor Messias
  rationale: O dativo marca aquele a quem se presta serviço. “Messias” torna perceptível o valor titular de Χριστός, enquanto “Senhor” preserva κύριος.
- source_word: δουλεύετε
  choice: Vocês servem
  rationale: Reproduz o presente do indicativo, segunda pessoa do plural, evitando convertê-lo silenciosamente em uma ordem direta. “Servem” é mais natural em português do que uma formulação literal com “ser escravo de”.
theological_decisions:
- issue: Valor de Χριστῷ na expressão τῷ κυρίῳ Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título cristológico. “Messias” evidencia esse valor, enquanto a alternativa tradicional “Cristo” é registrada em nota.
- issue: Força verbal de δουλεύετε
  choice: 'indicativo: “Vocês servem”'
  alternative: 'imperativo: “Sirvam”'
  rationale: A forma grega é presente ativo do indicativo, embora a tradição de tradução e o contexto exortativo possam favorecer em português uma leitura semelhante a uma ordem. O texto principal preserva a morfologia, e a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “vocês” para a segunda pessoa do plural. A ordem das palavras foi ajustada à fluência do português, mas a relação genitiva em “recompensa da herança” e o indicativo de δουλεύετε foram preservados para não eliminar ambiguidades do grego.
