id: COL.3.18
reference: Colossians 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: pt
  text: Esposas, sujeitem-se[a] aos seus maridos, como convém[b] no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estejam sujeitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como era conveniente no Senhor”; embora o verbo grego esteja no imperfeito, neste contexto provavelmente expressa aquilo que é conveniente de modo geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: Esposas
  rationale: No contexto das instruções domésticas e em correlação com ἀνδράσιν, refere-se especificamente a mulheres casadas, não às mulheres em geral.
- source_word: ὑποτάσσεσθε
  choice: sujeitem-se
  rationale: O imperativo presente médio/passivo expressa colocar-se sob determinada ordem na relação indicada. A forma pronominal portuguesa preserva bem essa nuance sem sugerir que terceiros imponham a sujeição.
- source_word: ἀνδράσιν
  choice: aos seus maridos
  rationale: Em paralelo com γυναῖκες neste contexto doméstico, ἀνήρ significa “marido”. O possessivo torna explícita, de modo natural em português, a relação indicada pelo contexto.
- source_word: ὡς
  choice: como
  rationale: Introduz o padrão segundo o qual a ação é apropriada, e não necessariamente uma causa.
- source_word: ἀνῆκεν
  choice: convém
  rationale: 'Embora a forma grega seja morfologicamente imperfeita, nesta exortação ela pode ter sentido geral presente: aquilo que é conveniente ou apropriado. “Convém” é conciso e natural.'
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a expressão grega e situa o que é conveniente no âmbito da relação com o Senhor, sem ampliar ou restringir indevidamente seu sentido.
theological_decisions:
- issue: Alcance e fundamento da exortação
  choice: “como convém no Senhor” mantém a instrução qualificada pela relação com o Senhor.
  alternative: Ler a instrução como norma social absoluta e sem qualificação teológica, ou ligar “no Senhor” somente às esposas.
  rationale: A formulação grega associa ἐν κυρίῳ à declaração sobre o que convém. A tradução conserva essa qualificação e a tensão do texto sem acrescentar conclusões doutrinárias não expressas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Esposas” e “maridos” explicitam a relação conjugal presente no contexto; “sujeitem-se” preserva a forma pronominal e “no Senhor” mantém a qualificação teológica sem paráfrase.
