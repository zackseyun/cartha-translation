id: COL.3.14
reference: Colossians 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: pt
  text: Acima de tudo isso, porém, revistam-se do amor, que é o vínculo da perfeição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o vínculo da completude» ou «o vínculo da maturidade».
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Acima de tudo isso, porém
  rationale: 'Preserva a ênfase e a metáfora do vestuário do contexto: o amor é colocado acima das demais virtudes. «Porém» representa δέ sem criar contraste excessivo.'
- source_word: τὴν ἀγάπην
  choice: do amor
  rationale: «Amor» é o equivalente natural e direto de ἀγάπη; a contração «do» decorre da expressão portuguesa «revestir-se de».
- source_word: '[verbo implícito retomado do contexto]'
  choice: revistam-se
  rationale: O acusativo τὴν ἀγάπην depende do imperativo ἐνδύσασθε no v. 12. Repetir «revistam-se» produz uma frase completa em português e mantém a metáfora de vestir.
- source_word: ὅ
  choice: que
  rationale: O relativo neutro pode comentar o amor enquanto conceito ou resumir a exortação precedente. «Que» mantém a formulação compacta sem determinar de modo indevido o antecedente conceitual.
- source_word: σύνδεσμος
  choice: vínculo
  rationale: Expressa aquilo que liga ou mantém unido e é natural em português neste contexto; evita a conotação excessivamente anatômica de «ligamento».
- source_word: τῆς τελειότητος
  choice: da perfeição
  rationale: Mantém a concisão e a amplitude do genitivo grego, que pode envolver perfeição, completude ou maturidade, sem resolver sua relação exata com «vínculo».
theological_decisions:
- issue: Sentido de σύνδεσμος τῆς τελειότητος
  choice: «vínculo da perfeição»
  alternative: «vínculo da completude» ou «vínculo da maturidade»
  rationale: A expressão pode indicar o vínculo que pertence à perfeição, que une tudo em completude ou que conduz à maturidade. A tradução compacta preserva essa tensão em vez de escolher uma relação causal específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural «revistam-se» mantém a exortação coletiva e a metáfora iniciada no v. 12.
