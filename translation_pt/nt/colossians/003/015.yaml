  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: pt
  text: E que a paz do Messias[a] governe os corações de vocês[b], para a qual, de fato, vocês foram chamados em um só corpo[c]. E sejam gratos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a paz de Cristo”. O título grego Χριστός significa “Ungido” e pode ser traduzido por “Messias”.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode significar “arbitre” ou “decida”, evocando a atuação de um árbitro; assim, a paz do Messias é apresentada como aquilo que deve ter a palavra decisiva na vida interior da comunidade.
    reason: lexical_alternative
  - marker: c
    text: Ou, possivelmente, “para um só corpo”, ressaltando a incorporação em um único corpo coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: paz
  rationale: É o equivalente natural no contexto paulino e comunica tanto a paz relacional quanto a comunitária resultante da obra salvadora de Deus.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός conserva aqui seu valor de título, “o Ungido”; “Messias” expressa esse sentido em português, enquanto a forma tradicional “Cristo” é registrada em nota.
- source_word: βραβευέτω
  choice: governe
  rationale: O verbo evoca a ação de arbitrar ou decidir. “Governe” transmite com naturalidade a função determinante da paz na vida interior e comunitária.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: o coração de vocês
  rationale: “Coração” designa a vida interior, incluindo disposições, vontade e afetos. O singular distributivo é corrente em português com “de vocês” e evita uma formulação pesada, sem eliminar a dimensão comunitária.
- source_word: εἰς ἣν
  choice: para a qual
  rationale: Retoma “paz” e a apresenta como alvo ou realidade para a qual os destinatários foram chamados.
- source_word: καὶ ἐκλήθητε
  choice: de fato, vocês foram chamados
  rationale: Neste contexto, καί reforça a afirmação em vez de apenas coordená-la; “de fato” comunica essa ênfase.
- source_word: ἐν ἑνὶ σώματι
  choice: em um só corpo
  rationale: Mantém diretamente a construção com ἐν e a metáfora corporativa paulina, sem explicá-la no corpo do texto.
- source_word: εὐχάριστοι γίνεσθε
  choice: sejam agradecidos
  rationale: A forma imperativa expressa a disposição contínua de gratidão; “sejam agradecidos” é clara, natural e concisa em português.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: O termo funciona como título e “Messias” preserva explicitamente o sentido de “Ungido”; a alternativa tradicional permanece indicada sem acrescentar conteúdo doutrinário.
- issue: Sentido de “um só corpo”
  choice: manter a metáfora corporativa sem explicá-la
  alternative: explicitar “a igreja” ou traduzir “para formar um só corpo”
  rationale: A imagem provavelmente aponta para a unidade eclesial, mas o texto não identifica nem desenvolve aqui o referente; preservar a metáfora evita resolver além do que o grego diz.
- issue: Função de βραβευέτω
  choice: governe
  alternative: arbitre ou decida
  rationale: “Governe” comunica a autoridade reguladora da paz, enquanto a nota preserva a imagem mais específica de um árbitro, sem impor uma leitura exclusivamente individual ou institucional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a concisão exortativa, a imagem do corpo e a possível nuance arbitral do verbo por meio de nota. Todos os marcadores de nota aparecem no texto principal.
