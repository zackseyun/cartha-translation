id: COL.3.5
reference: Colossians 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: pt
  text: 'Portanto[a], façam morrer os membros que estão sobre a terra: imoralidade sexual, impureza, paixão, desejo mau e ganância[b], que é idolatria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, pois”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cobiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: façam morrer
  rationale: Preserva a força do imperativo aoristo, que exige ação decisiva, em linguagem atual e clara.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a inferência a partir do argumento anterior.
- source_word: μέλη
  choice: os membros
  rationale: Mantém a metáfora corporal explícita no grego sem acrescentar um possessivo ausente do texto-fonte.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: que estão sobre a terra
  rationale: Conserva a imagem espacial e a ambiguidade da expressão grega, em vez de substituí-la por uma abstração interpretativa.
- source_word: πορνείαν
  choice: imoralidade sexual
  rationale: Equivalente amplo, corrente e apropriado para o campo semântico de πορνεία.
- source_word: ἀκαθαρσίαν
  choice: impureza
  rationale: Expressa naturalmente a impureza moral indicada pelo termo paulino.
- source_word: πάθος
  choice: paixão
  rationale: Equivalente direto que não acrescenta uma qualificação ausente no original.
- source_word: ἐπιθυμίαν κακήν
  choice: desejo mau
  rationale: Reproduz de modo conciso tanto o substantivo quanto sua qualificação moral explícita.
- source_word: πλεονεξίαν
  choice: ganância
  rationale: Termo moderno e acessível para o desejo ávido de possuir ou obter mais.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: que é idolatria
  rationale: Preserva a identificação enfática e liga naturalmente a oração relativa ao substantivo feminino singular imediatamente anterior.
theological_decisions:
- issue: Referente de “que é idolatria”
  choice: A oração se refere especificamente à ganância.
  alternative: A oração resume toda a lista anterior como idolatria.
  rationale: O pronome relativo feminino singular ἥτις concorda mais naturalmente com πλεονεξίαν, o antecedente feminino singular mais próximo.
- issue: Sentido de “os membros que estão sobre a terra”
  choice: Manter no texto principal a metáfora dos membros do corpo.
  alternative: Traduzir interpretativamente como “tudo o que em vocês é terreno” ou “a natureza terrena”.
  rationale: O grego diz literalmente “os membros que estão sobre a terra”; conservar a imagem evita resolver silenciosamente sua tensão e permite que a lista seguinte a especifique.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção deliberadamente incomum “os membros que estão sobre a terra” conserva a metáfora e a ambiguidade do original; as notas oferecem alternativas lexicais sem substituir essa imagem por uma interpretação.
