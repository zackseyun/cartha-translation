  naturalness: O português é moderno, claro e apropriado ao registro epistolar. “Os membros que estão sobre a terra” é propositalmente incomum, mas é inteligível e conserva a imagem espacial e a ambiguidade do original; uma paráfrase como “natureza terrena” seria mais fluente, porém interpretativa demais para o texto principal.
