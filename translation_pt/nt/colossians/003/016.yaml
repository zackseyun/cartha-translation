id: COL.3.16
reference: Colossians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: pt
  text: Que a palavra do Messias habite ricamente em vocês[a], em toda sabedoria, ensinando e admoestando uns aos outros com salmos, hinos e cânticos espirituais, cantando a Deus com graça[b] em seus corações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre vocês”. O pronome grego está no plural e pode destacar a palavra habitando na comunidade como um todo ou no interior de cada pessoa que crê.
    reason: alternative_reading
  - marker: b
    text: Ou “com gratidão”. A expressão grega ἐν χάριτι pode indicar graça, graciosidade ou gratidão neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος
  choice: a palavra
  rationale: “Palavra” preserva a amplitude de λόγος e seu uso paulino, sem restringi-lo apenas à proclamação ou a uma mensagem específica.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica seu sentido e preserva o vínculo com a esperança messiânica judaica.
- source_word: ἐνοικείτω
  choice: habite
  rationale: Mantém a metáfora de residência interior e, na construção exortativa “que ... habite”, expressa adequadamente o imperativo presente.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Traduz diretamente a preposição e o pronome plural, permitindo tanto a dimensão comunitária quanto a presença interior nos indivíduos.
- source_word: πλουσίως
  choice: ricamente
  rationale: Equivalente direto que comunica plenitude e abundância sem desfazer a imagem do texto.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: em toda a sabedoria
  rationale: Preserva de modo próximo a formulação e a abertura sintática do grego, que pode se relacionar com o habitar da palavra e/ou com o ensino e a admoestação.
- source_word: διδάσκοντες καὶ νουθετοῦντες
  choice: ensinando e admoestando
  rationale: “Ensinando” é claro e direto; “admoestando” retém o componente corretivo de νουθετέω melhor que termos mais genéricos.
- source_word: ἑαυτούς
  choice: uns aos outros
  rationale: Embora formalmente reflexivo, o plural tem aqui sentido recíproco e descreve a ação mútua dentro da comunidade.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: com salmos, hinos e cânticos espirituais
  rationale: Mantém distintos os três termos musicais e traduz o dativo com valor instrumental por “com”.
- source_word: ἐν χάριτι
  choice: com graça
  rationale: Conserva a forma lexical e a abertura semântica entre graça, graciosidade e gratidão; a alternativa contextual é registrada em nota.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nos corações de vocês
  rationale: Reproduz o plural do grego e mantém a interioridade da ação de cantar.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Expressa naturalmente em português o destinatário do canto indicado pelo dativo.
theological_decisions:
- issue: Sentido titular de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: A tradução pelo título “Messias” torna explícito o valor de Χριστός sem tratá-lo automaticamente como nome próprio.
- issue: Dimensão comunitária ou individual de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: “Em vocês” acompanha mais diretamente o grego e permanece compatível com uma leitura tanto coletiva quanto individual; a dimensão comunitária é indicada em nota.
- issue: Sentido de ἐν χάριτι
  choice: com graça
  alternative: com gratidão
  rationale: A expressão grega admite mais de uma nuance. O texto principal conserva “graça”, enquanto a nota registra a leitura de gratidão sem eliminar a tensão lexical.
- issue: Relação sintática de ἐν πάσῃ σοφίᾳ
  choice: manter a expressão junto da sequência verbal sem explicitar um único vínculo
  alternative: com toda a sabedoria, ensinem e admoestem
  rationale: A pontuação e a formulação evitam decidir de modo rígido se a expressão modifica o habitar da palavra, o ensino e a admoestação, ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se termos bíblicos correntes como “Messias”, “salmos”, “hinos” e “cânticos”, e a sintaxe permanece deliberadamente aberta onde o grego admite mais de uma relação.
