id: COL.3.1
reference: Colossians 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: pt
  text: Se, portanto, vocês foram ressuscitados com o Messias, busquem as coisas do alto, onde o Messias está, sentado à direita de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Se, portanto
  rationale: Preserva tanto a forma condicional de εἰ quanto a força inferencial de οὖν, sem converter implicitamente a condição em afirmação causal.
- source_word: συνηγέρθητε
  choice: vocês foram ressuscitados
  rationale: Reflete o aoristo passivo na segunda pessoa do plural e apresenta Deus como agente implícito; a associação expressa pelo prefixo συν- é completada por 'com o Messias'.
- source_word: τῷ Χριστῷ
  choice: com o Messias
  rationale: 'O dativo expressa associação: os fiéis foram ressuscitados juntamente com o Ungido. ''Messias'' preserva aqui a força titular de Χριστός.'
- source_word: τὰ ἄνω
  choice: as coisas do alto
  rationale: Reproduz de modo natural o neutro plural substantivado e mantém a amplitude da expressão sem explicá-la como simplesmente 'coisas celestiais'.
- source_word: ζητεῖτε
  choice: busquem
  rationale: Traduz diretamente o presente imperativo, cuja orientação contínua é comunicada naturalmente pelo contexto, sem precisar acrescentar 'continuem buscando'.
- source_word: οὗ
  choice: onde
  rationale: Mantém a referência locativa ao âmbito 'do alto' e introduz com naturalidade a oração relativa.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Mantém o valor de título de Χριστός neste contexto de exaltação.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: à direita de Deus
  rationale: É a formulação portuguesa natural e tradicional para a imagem régia de honra e autoridade.
- source_word: καθήμενος
  choice: sentado
  rationale: Expressa a posição atual do Messias sem tornar explícita, como faria 'entronizado', uma implicação contextual que não está lexicalmente formulada.
theological_decisions:
- issue: Força de Χριστός no contexto paulino
  choice: Messias
  alternative: Cristo
  rationale: Neste versículo, o título do Ungido continua semanticamente relevante, especialmente na referência à sua exaltação; 'Messias' torna essa força visível.
- issue: Força da condição introduzida por Εἰ
  choice: Preservar a forma condicional com 'Se, portanto'
  alternative: Portanto, já que vocês foram ressuscitados
  rationale: Embora a condição provavelmente pressuponha como verdadeira a ressurreição dos destinatários com o Messias, o grego conserva a forma condicional. A tradução mantém essa tensão em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para a segunda pessoa do plural e mantém a estrutura argumentativa concisa do grego.
