  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: pt
  text: E tudo o que fizerem, em palavra ou em ação[a], façam tudo em nome do Senhor Jesus[b], dando graças a Deus Pai por meio dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no que dizem ou no que fazem”.'
    reason: lexical_alternative
  - marker: b
    text: “Em nome do” também pode significar “sob a autoridade do Senhor Jesus” ou “como seus representantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: tudo o que fizerem
  rationale: A construção indefinida e abrangente expressa totalidade aberta. “Tudo o que fizerem” é natural em português e preserva essa abrangência.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: seja em palavra, seja em ação
  rationale: O par abrange tanto a expressão verbal quanto a conduta prática. A estrutura correlativa torna clara e fluente a alternativa no português moderno.
- source_word: πάντα
  choice: façam tudo
  rationale: Retoma e resume de modo enfático a expressão anterior. A repetição de “tudo” conserva a força totalizante do grego.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: em nome do Senhor Jesus
  rationale: Preserva o conhecido idioma bíblico e sua amplitude semântica, que pode envolver autoridade, representação e identificação.
- source_word: κυρίου
  choice: Senhor
  rationale: Neste contexto cristológico, κύριος funciona como título; “Senhor” preserva o uso neotestamentário e seu peso teológico.
- source_word: εὐχαριστοῦντες
  choice: dando graças
  rationale: O particípio presente indica uma atitude concomitante ao agir ordenado no versículo. “Dando graças” preserva naturalmente essa relação e seu caráter contínuo.
- source_word: τῷ θεῷ πατρὶ
  choice: a Deus Pai
  rationale: πατρί está em aposição a θεῷ. “Deus Pai” é uma formulação clara e natural em português, sem acrescentar uma conjunção ausente do grego.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: O pronome remete naturalmente ao antecedente próximo, o Senhor Jesus. “Por meio dele” preserva a ideia de mediação sem substituir o pronome pelo nome.
theological_decisions:
- issue: Sentido de “em nome do Senhor Jesus”
  choice: Manter o idioma “em nome do Senhor Jesus” no texto principal.
  alternative: “sob a autoridade do Senhor Jesus” ou “como representantes do Senhor Jesus”
  rationale: A expressão possui amplitude bíblica e pode incluir autoridade, representação e identificação. Explicitar apenas um desses sentidos estreitaria indevidamente a formulação.
- issue: Referente de “por meio dele”
  choice: O pronome se refere ao Senhor Jesus como aquele por meio de quem se dão graças a Deus Pai.
  alternative: Entender o pronome de maneira genérica, sem realce específico da mediação de Jesus.
  rationale: O antecedente mais próximo é “Senhor Jesus”, e essa leitura segue naturalmente a sintaxe, sem acrescentar formulação além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição enfática de “tudo”, mantém o idioma bíblico “em nome do” e usa “ação” em vez do mais formal “obra” para comunicar naturalmente a conduta prática.
