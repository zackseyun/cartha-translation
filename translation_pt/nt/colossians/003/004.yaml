source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: pt
  text: Quando o Messias[a], que é a vida de vocês[b], for revelado, então vocês também serão revelados com ele em glória.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O título grego Χριστός pode ser traduzido das duas maneiras; “Messias” expressa o significado do título.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “o Messias, a vida de vocês”.
    reason: lexical_alternative
  - marker: c
    text: Ou “então vocês também aparecerão com ele em glória”. A mesma raiz verbal grega é usada nas duas partes do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quando
  rationale: Introduz uma oração temporal referente a um acontecimento futuro esperado; “quando” é natural e preserva essa orientação.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Traduz o sentido do título grego, enquanto a alternativa tradicional “o Cristo” é registrada em nota.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: for revelado / serão revelados
  rationale: Mantém a voz passiva e repete a mesma raiz em português, preservando o paralelo entre a revelação do Messias e a dos fiéis.
- source_word: ἡ ζωὴ ὑμῶν
  choice: que é a vida de vocês
  rationale: Explicita em português a relação apositiva do grego, identificando o Messias como a vida dos destinatários sem acrescentar uma interpretação teológica.
- source_word: τότε καὶ ὑμεῖς
  choice: então vocês também
  rationale: Preserva tanto a sequência temporal de τότε quanto a inclusão enfática expressa por καί e pelo pronome explícito.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Expressa de modo natural a associação e participação indicadas por σύν.
- source_word: ἐν δόξῃ
  choice: em glória
  rationale: Preserva a concisão e a possível ideia de esfera ou modo da manifestação, sem reduzi-la apenas a um advérbio.
theological_decisions:
- issue: Χριστός como título traduzido ou forma tradicional transliterada
  choice: o Messias
  alternative: o Cristo
  rationale: O artigo e o uso cristológico favorecem a leitura titular. “Messias” comunica o significado do título, enquanto a forma tradicional é preservada em nota.
- issue: Relação apositiva entre o Messias e “a vida de vocês”
  choice: que é a vida de vocês
  alternative: o Messias, a vida de vocês
  rationale: A oração relativa torna a aposição inteligível em português corrente sem explicar ou suavizar a forte identificação teológica do texto.
- issue: Valor de φανερόω nas duas ocorrências
  choice: ser revelado
  alternative: aparecer
  rationale: A tradução passiva conserva a forma grega e o paralelismo verbal; a alternativa idiomática permanece indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμῶν/ὑμεῖς. A formulação conserva o paralelismo do original e evita linguagem excessivamente técnica.
