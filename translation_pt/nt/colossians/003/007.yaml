  text: In these things you too once walked[a], when you were living in them.
translation:
  language: pt
  text: Nessas coisas vocês também andaram[a] no passado, quando viviam nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nas quais vocês também andaram no passado, quando viviam nelas.” O pronome relativo grego pode ser traduzido mais literalmente por “nas quais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Nessas coisas
  rationale: O pronome relativo retoma, no contexto imediato, as práticas pecaminosas mencionadas anteriormente. A forma demonstrativa explicita o referente e soa natural em português, sem perder a ideia de esfera expressa por ἐν.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: καί, junto do pronome enfático ὑμεῖς, ressalta que os próprios colossenses anteriormente participavam desse modo de vida.
- source_word: περιεπατήσατε
  choice: andaram
  rationale: Mantém a metáfora paulina de περιπατέω para a maneira de viver e a distingue de ἐζῆτε, empregado mais adiante no versículo.
- source_word: ποτε
  choice: no passado
  rationale: Expressa de modo claro e corrente a referência indefinida a um período anterior; evita que “uma vez” seja entendido como frequência.
- source_word: ὅτε
  choice: quando
  rationale: Reproduz diretamente a ligação temporal entre a antiga conduta e a antiga esfera de vida.
- source_word: ἐζῆτε
  choice: viviam
  rationale: O imperfeito apresenta uma condição contínua no passado. “Viviam” conserva o sentido de ζάω e não repete a metáfora de “andaram”.
- source_word: ἐν τούτοις
  choice: nelas
  rationale: Retoma as práticas já mencionadas, evita repetição pesada de “nessas coisas” e preserva a ideia de viver inserido nessa esfera.
theological_decisions:
- issue: Relação entre “andaram” e “viviam” na descrição ética de Paulo
  choice: Distinguir a antiga conduta (“andaram”) da esfera ou condição em que levavam a vida (“viviam nelas”).
  alternative: Traduzir ambos os verbos como formas de “viver”.
  rationale: A distinção corresponde aos verbos gregos περιπατέω e ζάω e preserva as duas camadas da descrição de Paulo sem acrescentar uma conclusão doutrinária.
- issue: Referente de ἐν οἷς
  choice: Entendê-lo como referência às práticas pecaminosas do contexto anterior.
  alternative: Manter a construção relativa mais literal, “nas quais”, ou entender o pronome como referência a pessoas, “entre os quais”.
  rationale: A retomada por ἐν τούτοις no fim do versículo favorece a referência às práticas. A nota conserva a construção relativa do grego, sem sobrecarregar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a metáfora paulina “andar” e evita-se “uma vez”, que em português pode sugerir uma única ocorrência em vez de um período anterior.
