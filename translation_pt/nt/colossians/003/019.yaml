  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: pt
  text: Maridos, amem suas esposas e não sejam ásperos com elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se amargurem contra elas”. O verbo grego pode referir-se a tornar-se amargo ou ressentido; neste contexto, descreve também um tratamento áspero ou hostil para com a esposa.
    reason: alternativa lexical
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Maridos
  rationale: Embora ἀνήρ possa significar “homem” ou “marido”, o contexto das instruções domésticas e a referência correlata às esposas exigem aqui o sentido conjugal.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Equivalente direto e natural do imperativo presente de ἀγαπάω, preservando a ordem contínua de amar sem paráfrase desnecessária.
- source_word: τὰς γυναῖκας
  choice: suas esposas
  rationale: γυνή pode significar “mulher” ou “esposa”; neste contexto conjugal, “esposas” é o sentido adequado. “Suas” explicita em português a relação indicada pelo contexto.
- source_word: μὴ πικραίνεσθε
  choice: não se tornem amargos
  rationale: A forma médio-passiva pode exprimir tornar-se amargo ou deixar-se amargurar. A tradução conserva a metáfora lexical e a possível dimensão interior da atitude, sem restringi-la apenas ao comportamento áspero.
- source_word: πρὸς αὐτάς
  choice: com elas
  rationale: πρός com acusativo indica aqui a direção da atitude em relação às esposas. “Com elas” é idiomático em português após “tornar-se amargo”; “contra elas” também é possível e é registrado na nota.
theological_decisions:
- issue: Endereço conjugal e marcado por gênero
  choice: Manter “Maridos” e “esposas”
  alternative: Traduzir de modo mais amplo como “homens” e “mulheres”
  rationale: O contexto imediato é explicitamente conjugal, de modo que os sentidos relacionais de ἀνήρ e γυνή devem ser preservados.
- issue: Amargura interior ou tratamento áspero
  choice: Preservar no texto a imagem de tornar-se amargo
  alternative: Traduzir diretamente como “não sejam ásperos” ou “não as tratem com dureza”
  rationale: O verbo grego contém a noção de amargura e pode abranger tanto ressentimento interior quanto sua expressão em tratamento duro. A formulação escolhida mantém essa tensão, enquanto a nota esclarece a implicação relacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos naturais no plural. “Esposas” favorece legibilidade brasileira e continua inteligível internacionalmente. A metáfora da amargura foi mantida no texto para preservar a amplitude do original.
