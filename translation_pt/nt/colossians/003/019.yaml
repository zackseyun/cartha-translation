review_pass:
  verdict: revise
  source_fidelity: «Maridos» e «suas esposas» refletem corretamente os sentidos conjugais de οἱ ἄνδρες e τὰς γυναῖκας no contexto. «Amem» transmite adequadamente o imperativo presente ἀγαπᾶτε. Para μὴ πικραίνεσθε πρὸς αὐτάς, a formulação principal deve expressar de modo mais direto a atitude/tratamento hostil dirigido às esposas, sem atribuir ao grego uma construção causativa que ele não exige.
  naturalness: «Não se tornem amargos com elas» é compreensível, mas soa menos idiomático e pode concentrar-se numa alteração emocional interna, deixando pouco explícita a força relacional de πρὸς αὐτάς. «Não sejam ásperos com elas» é natural em português moderno e corresponde bem ao sentido contextual.
  terminology: A terminologia conjugal e o registro estão adequados. A alternativa lexical deve conservar a possibilidade de «amargurar-se/ser amargo» sem a paráfrase «deixem-se amargurar», que sugere uma causação externa não explicitada pelo texto grego.
  issues:
  - severity: medium
    issue: A tradução principal de μὴ πικραίνεσθε como «não se tornem amargos com elas» é menos clara quanto ao tratamento dirigido às esposas.
    rationale: No contexto, πικραίνεσθε πρὸς αὐτάς descreve uma atitude amarga, ressentida ou áspera para com elas. «Não sejam ásperos com elas» comunica esse valor relacional de forma mais natural, enquanto uma nota pode preservar a imagem de amargura.
  - severity: medium
    issue: A nota propõe «não se deixem amargurar contra elas».
    rationale: Essa redação introduz a ideia de que uma causa externa amargura os maridos, nuance que não é necessária nem clara no grego. Uma alternativa simples como «não se amargurem contra elas» preserva melhor a possibilidade lexical.
