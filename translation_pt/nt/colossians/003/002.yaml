  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: pt
  text: Mantenham a mente voltada para as coisas do alto[a], não para as coisas sobre a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham em mente as coisas do alto”. O verbo grego inclui não só pensar, mas também orientar a mente, a disposição e os interesses para algo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as coisas da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: as coisas do alto
  rationale: A construção neutra plural com ἄνω funciona substantivamente e aponta para as realidades ou questões do âmbito celestial, preservando o contraste espacial com as coisas da terra.
- source_word: φρονεῖτε
  choice: Mantenham o pensamento em
  rationale: φρονέω abrange pensamento, disposição e orientação interior; esta formulação comunica uma atitude contínua, coerente com o imperativo presente, sem reduzi-la a um ato intelectual momentâneo.
- source_word: μὴ
  choice: não
  rationale: A partícula nega, por contraste, o segundo objeto da exortação; a forma simples e direta preserva essa oposição.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: as coisas da terra
  rationale: Mantém a construção substantiva e o paralelismo com 'as coisas do alto', em português natural, sem explicitar além do grego o caráter moral dessas coisas.
- source_word: γῆς
  choice: terra
  rationale: No contraste cósmico com 'o alto', γῆ designa a terra, e não uma região ou território específico.
theological_decisions:
- issue: Amplitude da exortação em φρονεῖτε
  choice: Orientar de modo contínuo o pensamento, a disposição e os interesses para as realidades do alto
  alternative: Apenas pensar intelectualmente sobre o céu
  rationale: O campo semântico de φρονέω é mais amplo que a simples atividade intelectual. 'Mantenham o pensamento' preserva a orientação contínua da mente sem acrescentar uma formulação doutrinária específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O plural do imperativo torna explícito o destinatário coletivo já indicado pela forma verbal grega. A ordem e o contraste conciso do original foram preservados.
