  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: pt
  text: Pois vocês morreram, e a vida de vocês está escondida[b] com o Messias[a] em Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou “Cristo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “foi escondida e permanece assim”. O perfeito grego indica um estado presente resultante de uma ação concluída.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: vocês morreram
  rationale: O aoristo indicativo aponta para a morte decisiva dos destinatários no passado; o pretérito perfeito simples é natural em português e preserva essa referência.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém de modo conciso a ligação explicativa.
- source_word: ἡ ζωὴ ὑμῶν
  choice: a vida de vocês
  rationale: Tradução direta e clara para leitores de diferentes regiões; o contexto define a natureza dessa vida sem exigir explicitação no texto.
- source_word: κέκρυπται
  choice: está escondida
  rationale: O perfeito passivo descreve um estado presente decorrente de uma ação anterior; esta formulação é natural em português e mantém em foco o estado resultante.
- source_word: σὺν τῷ Χριστῷ
  choice: com o Messias
  rationale: σύν expressa associação ou união; Χριστός é vertido como título, preservando o sentido de 'Ungido'.
- source_word: ἐν τῷ θεῷ
  choice: em Deus
  rationale: Preserva o sentido locativo ou esférico de ἐν e a formulação teológica compacta do grego.
theological_decisions:
- issue: Χριστῷ como título ou forma semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva força titular; 'Messias' comunica seu significado, enquanto 'Cristo' é uma alternativa tradicional legítima.
- issue: Relação entre a vida dos fiéis, o Messias e Deus
  choice: com o Messias em Deus
  alternative: junto com o Messias, escondida em Deus
  rationale: A redação mantém as duas relações preposicionais do grego sem explicar além do que o texto afirma, preservando sua densidade e possível ambiguidade estrutural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para a segunda pessoa do plural e conserva a concisão e a ordem argumentativa do original.
