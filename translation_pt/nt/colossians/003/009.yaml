  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: pt
  text: Não mintam uns aos outros, pois vocês se despiram[a] do velho homem[b], juntamente com as práticas dele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo-se despido” ou “depois de se despirem”. O particípio grego pode ser traduzido mais formalmente, mas aqui provavelmente indica a razão da ordem.
    reason: lexical_alternative
  - marker: b
    text: Ou “velho eu”. Literalmente, “velho homem”, expressão que preserva o contraste de Paulo com o “novo homem” no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Não mintam
  rationale: O imperativo presente com μή expressa aqui uma proibição. “Não mintam” é direto, natural e não pressupõe que a conduta já esteja ocorrendo.
- source_word: εἰς ἀλλήλους
  choice: uns aos outros
  rationale: A expressão indica reciprocidade entre os destinatários; “uns aos outros” é a formulação portuguesa corrente.
- source_word: ἀπεκδυσάμενοι
  choice: pois vocês se despiram
  rationale: O particípio aoristo médio retém a metáfora de tirar uma roupa e, no contexto, provavelmente apresenta a razão que fundamenta a proibição. “Despiram-se” seria mais compacto, mas “vocês se despiram” oferece clareza ampla e leitura natural.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: o velho homem
  rationale: A tradução formal conserva o singular masculino e a correspondência com o “novo homem” do versículo seguinte. A alternativa interpretativa “velha natureza” ou “velho eu” reduziria a amplitude antropológica da expressão.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: juntamente com as práticas dele
  rationale: “Juntamente com” explicita o acompanhamento indicado por σύν. “Práticas” comunica ações e padrões habituais de conduta; “dele” retoma de modo claro o masculino singular “velho homem”.
theological_decisions:
- issue: Sentido de τὸν παλαιὸν ἄνθρωπον
  choice: o velho homem
  alternative: a velha natureza; o velho eu
  rationale: A formulação preserva a imagem paulina e sua contraposição ao “novo homem”, sem decidir se a expressão deve ser reduzida ao eu individual, à natureza moral ou à humanidade representativa.
- issue: Relação sintática de ἀπεκδυσάμενοι com a proibição
  choice: relação causal, expressa por “pois”
  alternative: particípio circunstancial, “tendo-se despido”; relação temporal, “depois de se despirem”
  rationale: O contexto favorece a compreensão de que a mudança já realizada fundamenta a ordem de não mentir. A nota mantém visíveis as outras maneiras legítimas de representar o particípio grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “vocês” torna explícito o sujeito já indicado pela flexão grega. A vírgula final preserva a continuidade sintática com Colossenses 3:10.
