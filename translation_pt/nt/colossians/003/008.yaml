review_pass:
  verdict: revise
  source_fidelity: 'O sentido central e a enumeração são bem preservados. «Ira» e «fúria» mantêm adequadamente os dois termos gregos ὀργή e θυμός, sem lhes atribuir uma distinção doutrinária rígida; «maldade» representa bem κακία. «Calúnia» é possível para βλασφημία neste contexto, embora o grego possa abranger fala injuriosa de modo mais amplo. A principal dificuldade está em ἐκ τοῦ στόματος ὑμῶν: a formulação atual soa como se qualificasse a origem da linguagem de modo pouco idiomático em português.'
  naturalness: «Linguagem obscena da boca de vocês» é pouco natural e cria uma ligação sintática áspera. Explicitar que essa fala «sai da boca» preserva a imagem do texto e torna a frase fluente. «Todas essas coisas» também reproduz de modo mais claro o alcance de τὰ πάντα no início da lista.
  terminology: «Linguagem indecente» comunica αἰσχρολογία de forma ampla, atual e digna, sem restringi-la a obscenidade sexual. «Calúnia» é mantida como opção contextual aceitável para βλασφημία, em consonância com a trilha inglesa, embora não esgote todas as nuances possíveis do termo.
  issues:
  - severity: medium
    issue: Construção pouco idiomática de «linguagem obscena da boca de vocês».
    rationale: O grego liga ἐκ τοῦ στόματος ὑμῶν à fala vergonhosa. Em português, «da boca de vocês» após «linguagem obscena» é truncado; «que sai da boca de vocês» expressa naturalmente a mesma relação sem alterar o sentido.
  - severity: low
    issue: «Tudo isso» torna menos explícito o plural abrangente τὰ πάντα.
    rationale: «Todas essas coisas» é mais transparente numa lista de vícios e conserva o valor inclusivo de «todas».
  revised_text: 'Mas agora vocês também devem abandonar todas essas coisas: ira, fúria, maldade, calúnia e linguagem indecente que sai da boca de vocês.'
