id: COL.3.8
reference: Colossians 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: pt
  text: 'Mas agora vocês também devem abandonar todas essas coisas: ira, fúria, maldade, calúnia e linguagem indecente que sai da boca de vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: abandonar
  rationale: O imperativo aoristo médio transmite a ideia figurada de pôr de lado ou livrar-se de práticas; “abandonar” é natural e mantém a força da ordem.
- source_word: ὀργήν
  choice: ira
  rationale: Designa ira ou indignação, frequentemente entendida como uma disposição mais persistente; “ira” distingue-se adequadamente de θυμός.
- source_word: θυμόν
  choice: fúria
  rationale: Expressa uma explosão intensa de ira; “fúria” preserva o contraste lexical com ὀργή.
- source_word: κακίαν
  choice: maldade
  rationale: Termo amplo para malícia ou disposição perversa; “maldade” conserva essa abrangência no contexto de vícios.
- source_word: βλασφημίαν
  choice: calúnia
  rationale: No contexto das relações humanas e da fala prejudicial, refere-se a difamação ou fala insultuosa; “calúnia” comunica esse sentido sem inserir aqui a acepção especificamente religiosa de blasfêmia.
- source_word: αἰσχρολογίαν
  choice: linguagem obscena
  rationale: Indica fala vergonhosa, indecente ou vulgar; “linguagem obscena” é clara e digna em português contemporâneo.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: da boca de vocês
  rationale: Mantém a imagem concreta e a ênfase da expressão grega, com forma natural e amplamente compreensível.
theological_decisions:
- issue: Relação entre ὀργή e θυμός
  choice: ira, fúria
  alternative: raiva, indignação
  rationale: A tradução conserva dois termos distintos sem impor uma diferenciação teológica rígida; o par sugere ira e sua manifestação intensa.
- issue: Sentido de βλασφημία neste catálogo de vícios
  choice: calúnia
  alternative: blasfêmia
  rationale: Embora o termo possa indicar blasfêmia contra Deus em outros contextos, sua posição entre males interpessoais e pecados da fala favorece “calúnia”; a tradução não exclui toda fala injuriosa.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira e compreensão internacional. A estrutura enumerativa e a metáfora da boca foram preservadas.
