id: COL.3.22
reference: Colossians 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Slaves[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: pt
  text: Escravos[a], obedeçam em tudo aos seus senhores segundo a carne[b], não apenas quando estão sendo observados[c], como quem procura agradar às pessoas, mas com sinceridade de coração, temendo o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode ser traduzido como “servos”, mas aqui normalmente designa pessoas escravizadas sob a autoridade de um senhor.
    reason: lexical_alternative
  - marker: b
    text: “Segundo a carne” pode ser entendido como “terrenos” ou “humanos”, indicando a esfera limitada da autoridade desses senhores.
    reason: lexical_alternative
  - marker: c
    text: Isto é, não trabalhar somente para parecer obediente quando o senhor está olhando.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Escravos
  rationale: No código doméstico, δοῦλοι designa pessoas escravizadas sob a autoridade de senhores; “escravos” preserva claramente essa realidade histórica, sem suavizá-la como relação de emprego.
- source_word: ὑπακούετε κατὰ πάντα
  choice: obedeçam em tudo
  rationale: O imperativo ὑπακούετε pede obediência, e κατὰ πάντα mantém o alcance abrangente da expressão grega.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: aos seus senhores segundo a carne
  rationale: “Senhores” expressa a autoridade humana sobre escravos, enquanto “segundo a carne” preserva o qualificativo paulino e o contraste com “o Senhor” no fim do versículo.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: não apenas quando estão sendo observados
  rationale: A rara expressão indica serviço prestado para parecer obediente sob o olhar do senhor; a formulação natural em português comunica o sentido melhor que um decalque como “serviço aos olhos”.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: como quem procura agradar às pessoas
  rationale: Expressa de modo atual e claro a ideia pejorativa de agir visando à aprovação humana.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: mas com sinceridade de coração
  rationale: Neste contexto, ἁπλότης denota integridade, franqueza e ausência de duplicidade, e não simplicidade intelectual.
- source_word: φοβούμενοι τὸν κύριον
  choice: temendo o Senhor
  rationale: Preserva a linguagem bíblica do temor do Senhor e distingue o Senhor divino dos senhores humanos mencionados antes.
theological_decisions:
- issue: Instrução ética no contexto da escravidão antiga
  choice: Traduzir diretamente a realidade social como “escravos” e “senhores”, sem transformar a relação em emprego moderno.
  alternative: “Servos” e “patrões” ou “empregadores”.
  rationale: O grego descreve escravidão, não trabalho assalariado. A tradução mantém a tensão histórica e ética do texto sem acrescentar aprovação da instituição.
- issue: Relação entre os senhores humanos e o Senhor
  choice: Manter “segundo a carne” e reservar “Senhor” para a referência divina final.
  alternative: Traduzir κατὰ σάρκα apenas como “terrenos”.
  rationale: 'A formulação preserva o contraste paulino: a autoridade dos senhores pertence à esfera humana, enquanto o temor último se dirige ao Senhor.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva “segundo a carne” para manter o contraste paulino, enquanto a expressão rara ὀφθαλμοδουλίαις é traduzida pelo sentido e esclarecida em nota.
