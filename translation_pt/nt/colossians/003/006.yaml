base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: pt
  text: Por causa dessas coisas, a ira de Deus vem sobre os filhos da desobediência[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos antigos não incluem “sobre os filhos da desobediência”. “Filhos da desobediência” é uma expressão que significa pessoas caracterizadas pela desobediência.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: Por causa dessas coisas
  rationale: διά com o acusativo ἃ exprime causa. A formulação aponta naturalmente para os vícios mencionados no versículo anterior e preserva a referência plural.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente de ἔρχομαι é mantido de modo direto e natural em português; no contexto, pode ter força presente e escatológica sem que a tradução precise explicitar apenas uma dessas nuances.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: a ira de Deus
  rationale: ὀργή designa aqui a ira divina em seu aspecto judicial. A construção preserva o peso teológico e a relação genitiva do grego.
- source_word: ἐπὶ
  choice: sobre
  rationale: Com o acusativo, ἐπί indica o alvo sobre o qual vem a ira; “sobre” é natural no registro bíblico português e mantém essa direção.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: os filhos da desobediência
  rationale: A expressão semítica caracteriza pessoas pela desobediência. A tradução mantém a imagem e o masculino lexical de υἱούς, esclarecendo seu sentido em nota.
theological_decisions:
- issue: Manter ou interpretar dinamicamente a expressão idiomática “filhos da desobediência”
  choice: Manter “filhos da desobediência” no texto principal
  alternative: “os desobedientes” ou “as pessoas caracterizadas pela desobediência”
  rationale: A forma preserva a textura e a tensão retórica do original sem acrescentar uma interpretação denominacional; a nota explica que se trata de pessoas marcadas pela desobediência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão idiomática do grego foi preservada. O presente “vem” evita definir excessivamente se a referência é iminente, contínua ou estritamente futura.
