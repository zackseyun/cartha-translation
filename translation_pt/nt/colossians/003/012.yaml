id: COL.3.12
reference: Colossians 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: pt
  text: Portanto, como escolhidos de Deus, santos e amados, revistam-se de profunda compaixão[a], bondade, humildade, mansidão[b] e paciência[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entranhas de compaixão”, expressão grega que indica misericórdia ou compaixão sentida no íntimo.
    reason: lexical_alternative
  - marker: b
    text: Ou “gentileza”.
    reason: lexical_alternative
  - marker: c
    text: Ou “longanimidade”, isto é, disposição de suportar por longo tempo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: revistam-se de
  rationale: Preserva a metáfora do vestir e a voz média do imperativo, em português natural e digno.
- source_word: οὖν
  choice: Portanto
  rationale: Explicita a inferência em relação à exortação anterior sem perder a conexão discursiva.
- source_word: ὡς
  choice: como
  rationale: Mantém a relação entre a conduta ordenada e a identidade dos destinatários, sem transformá-la explicitamente em causa.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: escolhidos de Deus
  rationale: Conserva a iniciativa divina e a linguagem de identidade sem recorrer ao termo mais sistematicamente carregado “eleitos”.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: santos e amados
  rationale: Reproduz os qualificativos do texto grego; “amados” comunica tanto a relação afetiva quanto o estado resultante do particípio perfeito passivo.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: profunda compaixão
  rationale: Expressa de modo idiomático a compaixão localizada figuradamente nas partes íntimas, preservando sua intensidade sem introduzir “coração” no texto principal.
- source_word: χρηστότητα
  choice: bondade
  rationale: Termo corrente que comunica a disposição benigna e sua expressão prática; “gentileza” poderia se sobrepor semanticamente a πραΰτητα.
- source_word: ταπεινοφροσύνην
  choice: humildade
  rationale: Equivalente moderno e direto para a atitude de mente humilde.
- source_word: πραΰτητα
  choice: mansidão
  rationale: Termo bíblico português reconhecível que preserva a força ética de uma disposição branda e não agressiva, sem significar fraqueza.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Comunica naturalmente a disposição de suportar por longo tempo, especialmente no trato com outras pessoas.
theological_decisions:
- issue: Linguagem da escolha divina em ἐκλεκτοὶ τοῦ θεοῦ
  choice: escolhidos de Deus
  alternative: eleitos de Deus
  rationale: O versículo afirma que Deus os escolheu, mas não explica aqui a mecânica ou a ordem dessa escolha. A formulação preserva a afirmação sem impor um sistema teológico posterior.
- issue: Valor de ὡς diante dos qualificativos de identidade
  choice: como escolhidos de Deus, santos e amados
  alternative: visto que são escolhidos de Deus, santos e amados
  rationale: “Como” conserva a possível nuance identificadora/comparativa do grego e evita resolver o vínculo como exclusivamente causal.
- issue: Sentido ético de πραΰτης
  choice: mansidão
  alternative: gentileza
  rationale: “Mansidão” mantém o termo ético distinto de bondade e não deve ser entendido como passividade ou fraqueza; a nota oferece a alternativa moderna.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem foi levemente ajustada para fluência, mantendo a metáfora do revestimento, a lista de virtudes e a ambiguidade de ὡς. Pontuação final encerrada como frase completa.
