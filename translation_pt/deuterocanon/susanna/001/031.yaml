  text: A mulher era extremamente delicada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muito refinada», «muito suave» ou «muito bela em sua delicadeza»; o adjetivo grego pode sugerir suavidade ou delicadeza refinada, sem implicar necessariamente fraqueza moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: era
  rationale: O δέ é um conectivo narrativo brando, sem contraste forte; em português, o fluxo do contexto permite não o explicitar, evitando acrescentar um marcador temporal inexistente no grego.
- source_word: ἡ γυνή
  choice: a mulher
  rationale: γυνή pode significar «mulher» ou «esposa». Aqui, a descrição recai sobre a própria Susana, sem destacar sua relação conjugal, por isso «a mulher» preserva melhor o foco imediato.
- source_word: τρυφερὰ
  choice: delicada
  rationale: O adjetivo pode indicar suavidade, delicadeza ou refinamento. «Delicada» conserva essa amplitude e não sugere necessariamente fraqueza moral ou indulgência.
- source_word: σφόδρα
  choice: extremamente
  rationale: O advérbio intensifica fortemente o adjetivo; «extremamente» comunica essa ênfase em linguagem atual e digna.
