  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: pt
  text: 'Depois de afastá-lo, mandou que trouxessem o outro. E lhe disse: “Semente de Canaã, e não de Judá! A beleza enganou você, e o desejo perverteu seu coração.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστήσας
  choice: Depois de afastá-lo
  rationale: Expressa a retirada do primeiro ancião antes do interrogatório do outro, sem especificar um lugar não indicado pelo grego.
- source_word: ἐκέλευσεν προσαγαγεῖν
  choice: mandou que trouxessem
  rationale: Reproduz com naturalidade a ordem para que o outro ancião fosse apresentado.
- source_word: τὸν ἕτερον
  choice: o outro
  rationale: Identifica de modo conciso o outro dos dois anciãos, sem acrescentar um substantivo ausente da expressão grega.
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  choice: Semente de Canaã, e não de Judá
  rationale: Mantém a metáfora genealógica e a forte contraposição entre Canaã e Judá presentes na denúncia.
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: A beleza enganou você
  rationale: Verte diretamente κάλλος e ἐξαπατάω em linguagem atual, deixando que o contexto indique a natureza da atração.
- source_word: ἐπιθυμία
  choice: desejo
  rationale: Preserva a amplitude lexical do termo grego; o contexto deixa claro que se trata de desejo ilícito.
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: perverteu seu coração
  rationale: Comunica a deformação moral interior indicada por διαστρέφω de modo claro e digno em português contemporâneo.
theological_decisions:
- issue: Força da denúncia “Semente de Canaã, e não de Judá”
  choice: Conservar literalmente a linguagem de descendência
  alternative: Você age como um cananeu, não como alguém de Judá
  rationale: O grego formula uma acusação direta em termos genealógicos. A tradução literal preserva a tensão retórica e identitária sem reduzi-la a uma simples comparação comportamental.
- issue: Nuance moral de ἐπιθυμία
  choice: desejo
  alternative: luxúria
  rationale: Embora o contexto seja de desejo sexual ilícito, o substantivo grego é semanticamente mais amplo. “Desejo” preserva essa amplitude, enquanto a frase deixa evidente sua perversidade.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é direta e judicial; “você” evita a artificialidade de “tu” para grande parte do público brasileiro, mantendo dignidade. A metáfora “Semente de Canaã” foi preservada por sua força textual.
