base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: pt
  text: 'Daniel, porém, disse-lhe: “Você também mentiu com acerto; isso se volta contra a sua própria cabeça, pois o anjo de Deus está à espera, com a espada na mão, para serrar você ao meio, a fim de destruir vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome «vocês» está no plural no texto grego. A destruição anunciada alcança os dois anciãos, não somente aquele a quem Daniel está falando.
    reason: Esclarecer a mudança significativa do singular para o plural no discurso.
lexical_decisions:
- source_word: Ὀρθῶς
  choice: com acerto
  rationale: 'Preserva a ironia incisiva do advérbio: a mentira do ancião foi formulada de modo a fazer a sentença recair precisamente sobre ele. A expressão é mais natural em português do que o literalismo “corretamente”.'
- source_word: ἔψευσαι
  choice: mentiu
  rationale: O aoristo é vertido pelo pretérito perfeito simples, forma natural para a acusação direta em português.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: contra a própria cabeça
  rationale: Mantém a imagem concreta do grego e comunica que a mentira faz a culpa e a condenação recaírem sobre o próprio mentiroso.
- source_word: μένει
  choice: está à espera
  rationale: Neste contexto, μένω apresenta o anjo permanecendo pronto para executar a sentença; “está à espera” expressa essa prontidão sem introduzir deslocamento.
- source_word: ὁ ἄγγελος τοῦ θεοῦ
  choice: o anjo de Deus
  rationale: Correspondência direta, clara e solene.
- source_word: τὴν ῥομφαίαν ἔχων
  choice: com a espada na mão
  rationale: Expressão portuguesa natural que conserva a imagem do anjo portando a arma; “espada” evita especificar além do necessário o tipo exato de lâmina.
- source_word: πρίσαι σε μέσον
  choice: serrar você ao meio
  rationale: πρίζω significa literalmente “serrar”; a formulação preserva a violência e a precisão da imagem, enquanto μέσον é expresso naturalmente por “ao meio”.
- source_word: ἐξολεθρεύσῃ
  choice: destruir
  rationale: Verbo forte e digno que comunica a eliminação completa indicada pelo grego.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome grego é plural e amplia explicitamente a ameaça do ancião interpelado para os dois anciãos; o português permite conservar essa mudança de número no texto.
theological_decisions:
- issue: Alcance do pronome plural final ὑμᾶς
  choice: traduzir explicitamente por “vocês” e explicar que abrange os dois anciãos
  alternative: manter “você” no singular e registrar o plural apenas em nota
  rationale: Daniel fala diretamente a um ancião, mas o plural final estende a destruição aos dois. Preservar a mudança de número evita resolver ou ocultar uma distinção presente no texto grego.
- issue: Força irônica de Ὀρθῶς
  choice: “mentiu com acerto”
  alternative: “mentiu corretamente” ou “mentiu muito bem”
  rationale: 'A escolha mantém a tensão retórica: Daniel não aprova moralmente a mentira, mas declara que ela acertou o próprio mentiroso, trazendo condenação sobre sua cabeça.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você/vocês” torna audível a mudança de número do grego. “Serrar você ao meio” conserva deliberadamente a imagem forte do verbo πρίζω, e “com acerto” mantém a ironia sem soar excessivamente arcaico.
