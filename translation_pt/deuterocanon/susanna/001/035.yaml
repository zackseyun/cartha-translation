  text: Mas ela, chorando, ergueu os olhos para o céu, pois seu coração confiava no Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίουσα
  choice: chorando
  rationale: O particípio presente indica uma ação ou condição simultânea e contínua; “chorando” preserva essa nuance com naturalidade.
- source_word: ἀνέβλεψεν
  choice: ergueu os olhos
  rationale: Com εἰς τὸν οὐρανόν, a expressão indica olhar para cima; “ergueu os olhos para o céu” é natural, digna e fiel ao gesto narrado.
- source_word: οὐρανόν
  choice: céu
  rationale: No contexto de confiança religiosa, “céu” abrange tanto a direção do olhar quanto sua conotação espiritual.
- source_word: καρδία
  choice: coração
  rationale: Mantém a imagem bíblica do centro interior da confiança, da vontade e das disposições pessoais.
- source_word: πεποιθυῖα
  choice: confiava
  rationale: O particípio perfeito expressa um estado consolidado resultante da confiança; o imperfeito português comunica naturalmente esse estado contínuo no momento narrado, sem sugerir que já tivesse cessado.
- source_word: ἐπὶ Κυρίῳ
  choice: no Senhor
  rationale: Com o verbo “confiar”, “no Senhor” é a construção portuguesa idiomática e preserva o objeto pessoal da confiança.
theological_decisions:
- issue: Tradução de Κύριος em uma narrativa grega deuterocanônica, em contexto explícito de confiança religiosa
  choice: Senhor
  alternative: SENHOR
  rationale: O testemunho grego traz Κυρίῳ e não apresenta, neste contexto imediato, uma forma distinta do nome divino hebraico. “Senhor” traduz diretamente o termo sem introduzir uma distinção tipográfica ausente na fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o contraste inicial, o choro simultâneo, o movimento do olhar e o estado duradouro de confiança.
