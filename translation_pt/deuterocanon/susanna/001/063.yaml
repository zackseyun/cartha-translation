  rationale: Remove-se “a Deus” e a nota correspondente, pois o objeto de ᾔνεσαν permanece não expresso no grego. “A respeito de sua filha” reproduz a função de περὶ τῆς θυγατρὸς αὐτῶν sem transformar a filha no objeto direto do louvor nem especificar indevidamente seu destinatário. “E” representa adequadamente o δέ narrativo sem a inferência temporal mais forte de “Então”.
