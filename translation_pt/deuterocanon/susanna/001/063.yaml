  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: pt
  text: E Helquias e sua mulher louvaram a respeito de sua filha, juntamente com Joaquim, marido dela, e todos os parentes, porque nela não se encontrou nenhum ato vergonhoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χελκίας
  choice: Helquias
  rationale: Forma portuguesa tradicional e reconhecível do nome bíblico representado no grego por Χελκίας.
- source_word: ᾔνεσαν
  choice: louvaram a Deus
  rationale: O verbo significa “louvaram”; o objeto não está expresso no grego. Em contexto bíblico, Deus é o referente implícito mais provável. A explicitação torna a frase natural em português, e a nota registra a forma literalmente aberta do original.
- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  choice: por causa de sua filha
  rationale: περί com genitivo pode indicar o assunto ou motivo. Aqui, “por causa de sua filha” comunica naturalmente que a vindicação dela motivou o louvor, sem fazer da filha o objeto direto do verbo.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: juntamente com Joaquim, marido dela
  rationale: μετά expressa acompanhamento; a aposição identifica Joaquim de modo claro e natural.
- source_word: τῶν συγγενῶν πάντων
  choice: todos os parentes
  rationale: συγγενεῖς designa parentes ou membros da parentela; a formulação evita acrescentar um possessivo cujo referente o grego não especifica.
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: nela não se encontrou
  rationale: Mantém a construção passiva e o sabor judicial da constatação, preservando de perto a expressão grega.
- source_word: αἰσχρὸν πρᾶγμα
  choice: nenhum ato vergonhoso
  rationale: αἰσχρός indica o que é vergonhoso ou desonroso, e πρᾶγμα, neste contexto, um ato ou feito. “Ato vergonhoso” conserva as dimensões moral e forense.
theological_decisions:
- issue: Objeto implícito do verbo ᾔνεσαν
  choice: “louvaram a Deus”, com nota textual
  alternative: “louvaram”; ou “elogiaram sua filha”
  rationale: O texto grego não nomeia quem recebe o louvor. Deus é o objeto implícito mais provável no contexto religioso da libertação de Susana, mas essa inferência não deve ser ocultada. Por isso, a tradução explicita “a Deus” para fluência e registra em nota a abertura formal do original. Fazer da filha o objeto direto seria menos fiel à construção com περί.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos familiares ao leitor lusófono. A ordem da frase preserva o grupo que participa do louvor e a conclusão de caráter judicial.
