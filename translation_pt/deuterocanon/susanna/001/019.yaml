base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/019.yaml
  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
translation:
  language: pt
  text: 'E ela disse às criadas[a]: “Tragam-me óleo e unguentos, e fechem as portas do jardim, para que eu me banhe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovens servas”. O termo grego pode designar meninas ou jovens do sexo feminino; neste contexto, refere-se às auxiliares domésticas de Susana.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  choice: criadas
  rationale: O diminutivo κοράσιον pode designar meninas ou jovens, mas neste contexto refere-se às auxiliares domésticas de Susana. “Criadas” expressa naturalmente a função delas sem acrescentar uma condição não indicada pelo texto.
- source_word: Ἐνέγκατε δή μοι
  choice: Tragam-me
  rationale: O imperativo aoristo de φέρω, reforçado por δή, comunica uma ordem ou solicitação direta; “Tragam-me” é corrente e preserva esse tom.
- source_word: ἔλαιον
  choice: óleo
  rationale: O grego diz apenas “óleo”. Embora provavelmente fosse azeite usado no banho ou na unção, especificar “azeite” acrescentaria algo não expresso.
- source_word: σμήγματα
  choice: unguentos
  rationale: σμήγματα designa substâncias usadas para friccionar, limpar ou ungir o corpo, especialmente no banho. “Unguentos” mantém essa amplitude melhor que opções mais específicas como “perfumes” ou “cosméticos”.
- source_word: θύρας τοῦ παραδείσου
  choice: as portas do jardim
  rationale: παράδεισος designa aqui um jardim cercado ou reservado. θύρας significa literalmente “portas”, embora “portões” também seja possível no contexto.
- source_word: κλείσατε
  choice: fechem
  rationale: O verbo significa fechar. “Fechem” é natural em português; “tranquem” pressuporia o uso de fechadura ou tranca, não explicitado no grego.
- source_word: ὅπως λούσωμαι
  choice: para que eu me banhe
  rationale: A forma média de λούω indica que Susana pretende banhar-se. A formulação preserva a oração final expressa por ὅπως.
