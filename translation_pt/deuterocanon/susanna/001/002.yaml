  text: And he took a wife whose name was Susanna[a], the daughter of Hilkiah, beautiful,
translation:
  language: pt
  text: E ele tomou por esposa uma mulher chamada Susana, filha de Hilquias, bela,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é condensado: literalmente, «bela», em continuação com a descrição no versículo seguinte. Também se pode traduzir mais idiomaticamente: «Ele se casou com uma mulher chamada Susana, filha de Hilquias, que era bela.»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβε γυναῖκα
  choice: tomou por esposa uma mulher
  rationale: A expressão grega significa literalmente que ele “tomou uma mulher”, mas, neste contexto, indica casamento. “Tomou por esposa” preserva a forma da fonte e deixa explícito o sentido marital.
- source_word: ᾗ ὄνομα Σουσάννα
  choice: chamada Susana
  rationale: A construção relativa grega, literalmente “cujo nome era Susana”, é expressa de modo natural e claro em português.
- source_word: θυγάτηρ Χελκίου
  choice: filha de Helcias
  rationale: O patronímico é direto. “Helcias” é a forma tradicional portuguesa do nome bíblico representado pelo grego Χελκίου.
- source_word: καλή
  choice: bela
  rationale: Neste contexto, καλή descreve a beleza física de Susana. “Bela” é conciso, digno e corresponde bem ao grego.
