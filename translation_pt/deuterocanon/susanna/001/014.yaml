lexical_decisions:
- source_word: ἕτερος τῷ ἑτέρῳ
  choice: um disse ao outro
  rationale: A expressão elíptica grega indica reciprocidade no diálogo; em português, é natural explicitar o verbo de fala exigido pelo contexto da citação.
- source_word: Πορευθῶμεν δὴ εἰς οἶκον
  choice: Vamos para casa agora
  rationale: O subjuntivo exortativo Πορευθῶμεν é bem representado por “Vamos”; δὴ acrescenta imediatismo ou ênfase, expresso por “agora”; εἰς οἶκον significa naturalmente “para casa”.
- source_word: ἀρίστου
  choice: almoço
  rationale: ἄριστον designa a refeição tomada durante o dia, aqui idiomaticamente “almoço”, sem necessidade de uma formulação mais técnica como “refeição do meio-dia”.
- source_word: ὥρα ἐστίν
  choice: está na hora
  rationale: Equivalente idiomático e direto da construção grega que indica ter chegado o momento apropriado.
