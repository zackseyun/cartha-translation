base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: pt
  text: 'Então Susana clamou em alta voz e disse: “Ó Deus eterno, conhecedor das coisas ocultas[a], que sabes todas as coisas antes que venham a existir[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conhecedor dos segredos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “antes de sua existência” ou “antes que aconteçam”. O grego pode referir-se, de modo amplo, às coisas antes que venham a existir ou ocorram.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: clamou
  rationale: Expressa um brado intenso e, no contexto de oração, soa mais digno e natural do que “gritou”.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Reproduz naturalmente a expressão idiomática grega e preserva a ideia concreta de voz forte.
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: Ó Deus eterno
  rationale: O nominativo funciona como vocativo na invocação; “Ó” torna explícito o endereço direto sem alterar o sentido.
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: conhecedor das coisas ocultas
  rationale: Mantém a amplitude de κρυπτά, que pode abranger tudo o que está oculto, não apenas segredos em sentido estrito.
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: que sabes todas as coisas
  rationale: A oração relativa verte o particípio com naturalidade e conserva a abrangência de τὰ πάντα.
- source_word: πρὶν γενέσεως αὐτῶν
  choice: antes que venham a existir
  rationale: Preserva a referência ampla ao conhecimento anterior ao surgimento, existência ou acontecimento das coisas, sem restringir indevidamente o sentido.
theological_decisions:
- issue: Linguagem de presciência divina em πρὶν γενέσεως αὐτῶν
  choice: antes que venham a existir
  alternative: antes de sua existência; antes que aconteçam
  rationale: A formulação afirma o conhecimento divino anterior ao surgimento das coisas, mas evita impor ao texto uma elaboração doutrinária além do que o grego declara.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Clamou em alta voz” preserva a solenidade e a intensidade da oração; a segunda pessoa singular (“sabes”) mantém a invocação direta a Deus.
