base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/021.yaml
  text: And it happened[a], when the maids had gone out, that the two elders rose up and rushed at her.
translation:
  language: pt
  text: E aconteceu que, quando as moças[a] saíram, os dois anciãos se levantaram e avançaram impetuosamente contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovens” ou “criadas”. O termo grego pode designar jovens do sexo feminino em geral; neste contexto doméstico, provavelmente se refere às moças que serviam Susana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa grega de transição de modo natural no português atual.
- source_word: ὡς
  choice: quando
  rationale: Introduz aqui a circunstância temporal que antecede a ação principal.
- source_word: ἐξήλθοσαν
  choice: saíram
  rationale: O pretérito perfeito expressa com clareza a ação concluída no contexto da oração temporal, sem exigir uma construção pesada.
- source_word: τὰ κοράσια
  choice: as moças
  rationale: κοράσια designa jovens do sexo feminino; “moças” preserva essa amplitude, enquanto o contexto doméstico permite entendê-las como ajudantes ou criadas.
- source_word: ἀνέστησαν
  choice: se levantaram
  rationale: Reproduz o início súbito da ação dos anciãos sem arcaísmo.
- source_word: οἱ δύο πρεσβῦται
  choice: os dois anciãos
  rationale: “Anciãos” preserva a função social reconhecida dessas personagens, não apenas sua idade.
- source_word: ἐπέδραμον
  choice: avançaram impetuosamente contra
  rationale: Expressa o movimento súbito e agressivo indicado pelo verbo, evitando afirmar uma agressão física já consumada.
- source_word: αὐτῇ
  choice: ela
  rationale: Com a preposição exigida pela expressão portuguesa, representa naturalmente o objeto dativo feminino.
