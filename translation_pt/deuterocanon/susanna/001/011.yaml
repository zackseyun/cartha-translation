base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: pt
  text: E, quando amanhecia, eles vinham às escondidas, escondendo-se um do outro[a], apressando-se para ver qual deles apareceria primeiro diante dela e falaria com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz, de modo muito literal, algo como “furtavam um ao outro”. A expressão é idiomática e seu sentido exato é incerto; provavelmente indica que vinham furtivamente e separadamente, ocultando-se um do outro, cada qual tentando chegar primeiro até Susana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: quando amanhecia
  rationale: O imperfeito ἐγίνετο apresenta uma situação recorrente, e ὄρθρος indica o romper do dia. “Quando amanhecia” comunica com naturalidade tanto o momento quanto o aspecto habitual.
- source_word: ἐρχόμενοι
  choice: eles vinham
  rationale: O particípio, em combinação com o imperfeito ἔκλεπτον, integra uma ação repetida. O imperfeito português “vinham” preserva esse valor habitual.
- source_word: ἔκλεπτον ἀλλήλους
  choice: às escondidas um do outro
  rationale: Neste contexto, κλέπτω não descreve furto literal, mas conduta furtiva ou dissimulada em relação recíproca. A expressão portuguesa conserva o sigilo sem definir além do necessário se eles se escondiam, se enganavam ou chegavam furtivamente.
- source_word: σπεύδοντες
  choice: apressando-se
  rationale: σπεύδω expressa pressa e pode também sugerir empenho. O contexto competitivo favorece “apressando-se”.
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: para ver qual deles apareceria primeiro diante dela
  rationale: φανήσεται tem sentido intransitivo de aparecer ou mostrar-se. “Diante dela” exprime naturalmente o dativo αὐτῇ, e “para ver” torna explícita em português a relação deliberativa implícita na pergunta indireta.
- source_word: λαλήσει πρὸς αὐτήν
  choice: falaria com ela
  rationale: λαλέω com πρός indica fala dirigida a alguém. “Falaria com ela” é corrente e mantém a dimensão interpessoal da ação.
