  source_fidelity: O aspecto habitual de ὡς ἐγίνετο ὄρθρος e ἐρχόμενοι é bem expresso por “quando amanhecia” e “vinham”. “Apressando-se” traduz adequadamente σπεύδοντες. “Apareceria primeiro diante dela e falaria com ela” preserva satisfatoriamente a sequência τίς φανήσεται αὐτῇ πρότερος καὶ λαλήσει πρὸς αὐτήν. A expressão ἔκλεπτον ἀλλήλους é difícil e idiomática; a tradução deve conservar sua furtividade e reciprocidade sem alegar furto literal.
  naturalness: “Às escondidas um do outro” não é uma construção portuguesa natural nem suficientemente clara sem pontuação e explicitação verbal. “Escondendo-se um do outro” é idiomático, conserva a relação recíproca e deixa a nota registrar a incerteza lexical.
  terminology: Não há termos teológicos técnicos neste versículo. “Susana” é a forma portuguesa estabelecida. A nota deve evitar apresentar “roubavam um ao outro” como literal inequívoco, pois isso sugere em português um sentido de furto que o contexto não sustenta.
