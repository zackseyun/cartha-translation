base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: pt
  text: Depois de voltarem, chegaram ao mesmo lugar[a] e, ao se questionarem mutuamente sobre o motivo, confessaram o desejo que sentiam[b]. Então, juntos, combinaram uma ocasião em que poderiam encontrá-la sozinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reuniram-se”. A expressão grega também pode enfatizar que eles se reuniram, e não especificamente que chegaram ao mesmo lugar.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “desejo” se refere a um desejo sexual ilícito; uma tradução mais explícita seria “a cobiça sexual que sentiam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: Depois de voltarem
  rationale: O particípio indica que eles retornaram ou voltaram atrás; a formulação conserva a sequência narrativa de modo natural em português.
- source_word: ἐπὶ τὸ αὐτό
  choice: ao mesmo lugar
  rationale: Neste contexto, a expressão indica mais provavelmente que ambos convergiram novamente para o mesmo local, embora também possa ressaltar que se reuniram.
- source_word: ἀνετάζοντες ἀλλήλους
  choice: ao interrogarem um ao outro
  rationale: O verbo significa examinar ou questionar de maneira insistente. “Interrogar” preserva essa força sem necessariamente sugerir um procedimento judicial formal.
- source_word: τὴν αἰτίαν
  choice: sobre o motivo
  rationale: αἰτία designa aqui a razão ou causa pela qual cada um havia voltado; “motivo” é claro e idiomático.
- source_word: ὡμολόγησαν
  choice: confessaram
  rationale: O verbo expressa reconhecimento aberto; “confessaram” mantém o peso moral da revelação no contexto.
- source_word: τὴν ἐπιθυμίαν αὐτῶν
  choice: o desejo que sentiam
  rationale: ἐπιθυμία pode indicar desejo em sentido amplo, mas neste relato é ilícito e sexual. A escolha preserva a relativa amplitude lexical, deixando o contexto comunicar sua natureza.
- source_word: κοινῇ συνετάξαντο
  choice: combinaram entre si
  rationale: κοινῇ ressalta a ação conjunta, e o verbo médio indica que estabeleceram um plano de comum acordo. A expressão é natural e comunica a conivência.
- source_word: καιρόν
  choice: uma ocasião
  rationale: καιρός pode ser um tempo determinado ou uma oportunidade propícia. “Ocasião” expressa adequadamente o momento oportuno que pretendiam criar ou aproveitar.
- source_word: δυνήσονται εὑρεῖν
  choice: poderiam encontrá-la
  rationale: A construção exprime capacidade futura vista a partir de uma narrativa passada; o condicional português é natural nesse discurso indireto.
- source_word: μόνην
  choice: sozinha
  rationale: O adjetivo indica que ela estaria desacompanhada; “sozinha” é direto e corrente.
