base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
translation:
  language: pt
  text: 'E eis que ela caminhava, como de costume, e um dos anciãos já tinha chegado, e eis que o outro apareceu, e ele interrogou o outro,[a] dizendo: “Por que você saiu tão cedo sem me levar junto?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego muda rapidamente entre “um”, “o outro” e “ele”, produzindo uma sequência narrativa um tanto abrupta. A tradução preserva essa forma sem identificar explicitamente qual dos dois anciãos fez a pergunta.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva, nas duas ocorrências, o marcador discursivo vívido do grego e mantém o tom narrativo digno.
- source_word: κατὰ τὸ εἰωθὸς
  choice: como de costume
  rationale: Expressa de modo natural a ação habitual indicada pelo idioma grego.
- source_word: περιεπάτει
  choice: caminhava
  rationale: O imperfeito indica ação em curso; o contexto não exige explicitar movimento de um lado para outro.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Preserva tanto a idade quanto a posição reconhecida desses homens na comunidade.
- source_word: ἐλληλύθει
  choice: já tinha chegado
  rationale: O mais-que-perfeito marca uma chegada anterior à do segundo ancião; “já” torna clara essa relação temporal.
- source_word: παρεγένετο
  choice: apareceu
  rationale: Indica que o segundo homem chegou à cena; “apareceu” distingue naturalmente este verbo da chegada anterior.
- source_word: ἀνέκρινε
  choice: interrogou
  rationale: Mantém o tom incisivo de examinar ou questionar sem necessariamente pressupor um procedimento judicial formal.
- source_word: ὄρθρου
  choice: tão cedo
  rationale: No contexto da pergunta, comunica naturalmente a referência à madrugada ou ao início da manhã.
- source_word: παραλαβὼν με
  choice: sem me levar junto
  rationale: Expressa a ideia de levar alguém consigo como acompanhante.
