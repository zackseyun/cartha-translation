  terminology: “Anciãos” preserva bem o estatuto social dos πρεσβύτεροι; “interrogou” é uma opção defensável para ἀνέκρινε e não impõe uma leitura teológica ou doutrinária. “Apareceu” comunica de forma idiomática a chegada do segundo ancião.
