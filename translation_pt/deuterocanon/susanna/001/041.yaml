  yaml_path: translation/deuterocanon/susanna/001/041.yaml
  text: And the whole assembly believed them[a], since they were elders and judges of the people.
translation:
  language: pt
  text: E toda a assembleia acreditou neles[a], pois eram anciãos e juízes do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda a congregação». A palavra grega se refere à comunidade reunida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστευσεν αὐτοῖς
  choice: acreditou neles
  rationale: Com o dativo αὐτοῖς, o verbo indica que a assembleia aceitou como verdadeiro o testemunho dos homens. «Acreditou neles» é direto e natural em português.
- source_word: ἡ συναγωγὴ πᾶσα
  choice: toda a assembleia
  rationale: Neste contexto, συναγωγή designa a comunidade reunida, não um edifício ou uma instituição posterior. «Assembleia» preserva o sentido coletivo sem introduzir associações anacrônicas.
- source_word: ὡς
  choice: pois
  rationale: Aqui introduz a razão pela qual a assembleia acreditou nos homens. «Pois» expressa de modo natural essa relação causal.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: O termo se refere a líderes reconhecidos da comunidade, e não apenas a homens idosos. «Anciãos» preserva essa função social.
- source_word: κριτῶν
  choice: juízes
  rationale: O termo indica pessoas que exerciam autoridade judicial entre o povo; «juízes» é o equivalente claro e habitual.
- source_word: τοῦ λαοῦ
  choice: do povo
  rationale: A expressão se refere à comunidade ou população sobre a qual os homens exerciam autoridade; a tradução direta é natural em português.
theological_decisions:
- issue: Tradução de συναγωγή em uma narrativa judaica pré-cristã
  choice: assembleia
  alternative: congregação; sinagoga
  rationale: O grego aponta para a comunidade reunida. «Assembleia» evita tanto a possível conotação eclesiástica de «congregação» quanto a leitura institucional ou arquitetônica de «sinagoga».
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. Conserva a ordem lógica e a concisão do grego.
