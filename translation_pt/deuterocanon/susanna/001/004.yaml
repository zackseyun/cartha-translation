base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
translation:
  language: pt
  text: Joaquim[a] era muito rico e tinha um jardim[b] junto à sua casa; e os judeus[c] costumavam ir até ele, porque era mais estimado que todos os outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome também aparece tradicionalmente como “Joakim” ou “Joachim”; o grego traz Ἰωακείμ.
    reason: lexical_alternative
  - marker: b
    text: Ou “parque” ou “pomar”; o termo grego pode indicar uma propriedade cultivada ou um jardim fechado para recreação.
    reason: lexical_alternative
  - marker: c
    text: Ou “os judeanos”, caso o termo seja entendido geograficamente, e não como designação étnica ou religiosa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακείμ
  choice: Joaquim
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do nome grego, sem alterar sua identidade.
- source_word: πλούσιος σφόδρα
  choice: muito rico
  rationale: Preserva a forte intensificação de σφόδρα em português natural; “extremamente rico” seria possível, mas menos fluente no registro narrativo.
- source_word: παράδεισος
  choice: jardim
  rationale: No contexto, designa um jardim ou propriedade cultivada junto à residência, e não o “paraíso” em sentido teológico.
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: junto à sua casa
  rationale: Expressa com clareza a proximidade ou contiguidade indicada pelo particípio, em linguagem corrente e digna.
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: costumavam ir até ele
  rationale: Transmite a ação habitual do imperfeito e a aproximação das pessoas a Joaquim. A forma grega admite uma leitura mais passiva, mas o contexto favorece a aproximação habitual.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Neste contexto narrativo, refere-se mais naturalmente à comunidade judaica; a possibilidade geográfica “os judeanos” é registrada em nota.
- source_word: ἐνδοξότερον πάντων
  choice: mais estimado que todos os outros
  rationale: Representa o comparativo e o sentido de reputação ou consideração social, evitando sugerir superioridade moral ou espiritual.
theological_decisions:
- issue: Natureza da proeminência de Joaquim em ἐνδοξότερον πάντων
  choice: mais estimado que todos os outros
  alternative: mais glorioso que todos
  rationale: A frase explica por que as pessoas iam até ele e aponta para reputação e posição social, sem fazer uma afirmação sobre santidade ou superioridade espiritual.
- issue: Sentido de παράδεισος
  choice: jardim
  alternative: paraíso
  rationale: O contexto doméstico e patrimonial exige o sentido concreto de jardim ou propriedade ajardinada; verter “paraíso” introduziria indevidamente uma conotação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A construção “costumavam ir” explicita o valor habitual do imperfeito sem tornar a frase excessivamente formal.
