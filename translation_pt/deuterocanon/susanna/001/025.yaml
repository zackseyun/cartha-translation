base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: pt
  text: Para mim, é preferível cair nas mãos de vocês sem fazer isso do que pecar diante do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não o tendo feito”. O grego deixa o ato implícito, remetendo à exigência dos anciãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: Para mim, é preferível
  rationale: Expressa a avaliação pessoal e o sentido comparativo de algo que deve ser escolhido entre duas alternativas, em português natural.
- source_word: μὴ πράξασαν
  choice: sem fazer isso
  rationale: Mantém implícito o ato exigido pelos anciãos, como no grego, acrescentando apenas o pronome necessário para a clareza em português.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: cair nas mãos de vocês
  rationale: Preserva a metáfora grega de ficar sob o poder de alguém e usa uma formulação corrente e amplamente compreensível.
- source_word: ἢ
  choice: do que
  rationale: Na construção comparativa, introduz naturalmente a alternativa rejeitada.
- source_word: ἁμαρτεῖν
  choice: pecar
  rationale: É o equivalente direto e adequado no contexto de responsabilidade perante Deus.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: Conserva a ideia de agir na presença e sob o juízo de Deus, além do título reverencial.
theological_decisions:
- issue: Explicitação do ato não nomeado exigido pelos anciãos
  choice: Manter o ato implícito como “fazer isso”
  alternative: Explicitar como “ceder a vocês” ou “cometer esse pecado”
  rationale: O grego remete ao contexto sem nomear o ato. A tradução preserva essa contenção e evita acrescentar uma interpretação mais específica do que a forma do texto exige.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” reproduz claramente o plural de ὑμῶν; “diante do Senhor” mantém o registro bíblico sem arcaísmo excessivo.
