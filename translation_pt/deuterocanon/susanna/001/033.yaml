  text: And all those with her were weeping[a], and all who knew her were weeping.
translation:
  language: pt
  text: E todos os que estavam com ela choravam[a], e todos os que a conheciam também choravam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que eram de sua casa”; a expressão grega pode referir-se amplamente às pessoas que estavam em sua companhia ou que faziam parte de sua casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: choravam
  rationale: O imperfeito grego apresenta o choro como ação em curso; o imperfeito português preserva naturalmente esse aspecto durativo.
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  choice: todos os que estavam com ela
  rationale: A expressão designa de modo amplo as pessoas que se encontravam em sua companhia, sem restringi-las a criados, assistentes ou familiares.
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  choice: todos os que a conheciam
  rationale: Traduz diretamente a referência à totalidade das pessoas que tinham conhecimento ou convivência com Susana.
- source_word: πάντες ... πάντες
  choice: todos ... todos
  rationale: Mantém a repetição enfática do grego e a amplitude coletiva do lamento.
