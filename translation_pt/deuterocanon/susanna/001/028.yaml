base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: pt
  text: Mas os homens que agiam contra a lei voltaram, proferindo ameaças entre si e armando uma emboscada para matá-la. Quando chegaram à assembleia da cidade, não se ausentaram[a], e todos os filhos de Israel[b] que ali estavam se reuniram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é difícil; provavelmente indica que eles estiveram presentes na assembleia da cidade, em vez de se ausentarem dela.
    reason: textual_variant
  - marker: b
    text: 'Ou: «os israelitas». Grego: «os filhos de Israel».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράνομοι
  choice: os homens que violavam a lei
  rationale: Preserva a força jurídica e moral do adjetivo sem recorrer ao pouco natural «homens sem lei» nem reduzi-lo ao sentido genérico de «maus».
- source_word: ἀπέστρεψαν
  choice: voltaram
  rationale: Expressa de modo direto o movimento de retorno indicado pelo verbo, sem especificar uma direção não declarada.
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: proferindo ameaças entre si
  rationale: Mantém a referência à comunicação interna entre os homens e conserva a estranheza moderada da expressão grega sem transformá-la simplesmente em «tramando».
- source_word: ἐνεδρεύοντες
  choice: preparando uma emboscada
  rationale: Conserva a imagem concreta de ação hostil oculta presente no particípio, em vez de reduzi-la a um plano genérico.
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: para matá-la
  rationale: Reproduz com clareza a finalidade da emboscada. O contexto judicial não exige ampliar o verbo para «condená-la à morte».
- source_word: συναγωγή
  choice: assembleia
  rationale: No contexto, designa a reunião cívica ou judicial da cidade, não necessariamente um edifício de sinagoga.
- source_word: οὐ παρῴκουν
  choice: não ficaram de fora
  rationale: A cláusula é semanticamente difícil; esta formulação natural comunica a provável ideia contextual de que eles não se ausentaram da assembleia, sem apresentar a interpretação como inteiramente certa.
- source_word: συνήδρευσαν
  choice: se reuniram
  rationale: Traduz o ato de congregar-se em sessão com linguagem portuguesa corrente e digna.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar masculina explícita do grego; «os israelitas» é uma alternativa idiomática indicada em nota.
theological_decisions:
- issue: Designação étnica com forma familiar masculina
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: O grego emprega explicitamente a expressão οἱ υἱοὶ Ἰσραήλ. A tradução conserva essa forma tradicional e semítica, enquanto a nota registra a equivalência étnica natural.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita tecnicismos confessionais, preserva a força jurídica de παράνομοι e sinaliza em nota a incerteza real de οὐ παρῴκουν. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
