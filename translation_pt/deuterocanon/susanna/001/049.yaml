  text: Return to the court, for these men have borne false witness against her.
translation:
  language: pt
  text: Voltem ao tribunal, pois estes homens deram falso testemunho contra ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: Voltem
  rationale: O imperativo aoristo plural ordena ao grupo que retorne ao lugar ou procedimento judicial; “Voltem” é direto, natural e preserva o valor de retorno.
- source_word: κριτήριον
  choice: tribunal
  rationale: No contexto, designa o foro ou local em que se realiza o julgamento. “Tribunal” comunica com clareza o cenário judicial em português moderno.
- source_word: ψευδῆ
  choice: falso
  rationale: Em combinação com o verbo de testemunhar, caracteriza como mentiroso o depoimento prestado; integra-se naturalmente à expressão “dar falso testemunho”.
- source_word: κατεμαρτύρησαν
  choice: deram falso testemunho
  rationale: O verbo indica testemunhar contra alguém. Com ψευδῆ, a locução portuguesa preserva tanto o sentido jurídico quanto o peso moral da acusação.
- source_word: αὐτῆς
  choice: contra ela
  rationale: O genitivo com καταμαρτυρέω identifica a pessoa contra quem foi dado o testemunho; “contra ela” reproduz essa força adversativa e jurídica.
theological_decisions:
- issue: Expressão judicial para depoimento falso
  choice: deram falso testemunho contra ela
  alternative: testemunharam falsamente contra ela
  rationale: A formulação escolhida mantém o caráter forense e a ressonância bíblica da acusação sem deixar de ser clara em português atual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural de “Voltem” corresponde ao imperativo dirigido ao grupo; não se acrescenta sujeito explícito ausente no grego.
