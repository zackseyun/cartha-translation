base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: pt
  text: E aconteceu que, enquanto eles vigiavam à espera de um dia oportuno, ela entrou certo dia, como no dia anterior e dois dias antes,[a] acompanhada apenas por duas jovens servas, e quis banhar-se no jardim, pois fazia calor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «como nos dias anteriores». A expressão grega compara literalmente essa visita com «o dia anterior e dois dias antes».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa grega em português atual e digno, sem recorrer ao arcaico «sucedeu».
- source_word: παρατηρεῖν
  choice: aguardavam
  rationale: No contexto, o verbo indica observação atenta em busca do momento apropriado. «Aguardavam» funciona naturalmente com «uma ocasião favorável», embora deixe a vigilância implícita.
- source_word: ἡμέραν εὔθετον
  choice: uma ocasião favorável
  rationale: O sentido é de um dia ou momento adequado ao propósito deles. «Ocasião favorável» comunica a oportunidade calculada sem sugerir aprovação moral.
- source_word: εἰσῆλθέν ποτε
  choice: ela entrou certo dia
  rationale: Expressa de modo idiomático a entrada ocorrida em uma ocasião específica da narrativa.
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: como no dia anterior e dois dias antes
  rationale: Mantém a formulação temporal incomum do grego sem reduzi-la silenciosamente a «como nos dias anteriores»; a nota registra a alternativa idiomática.
- source_word: μετὰ δύο μόνων κορασίων
  choice: acompanhada apenas por duas jovens servas
  rationale: κοράσια pode designar moças jovens e, no contexto doméstico, criadas. A formulação conserva tanto a juventude quanto a função delas.
- source_word: ἐπεθύμησε
  choice: quis
  rationale: Aqui o verbo exprime vontade ou intenção de banhar-se, não necessariamente desejo intenso; «quis» é natural e preciso.
- source_word: λούσασθαι
  choice: banhar-se
  rationale: O infinitivo médio indica que Susana pretendia tomar banho.
- source_word: ἐν τῷ παραδείσῳ
  choice: no jardim
  rationale: Neste contexto, παράδεισος é o jardim ou parque fechado da propriedade, não o Paraíso em sentido teológico.
- source_word: ὅτι καῦμα ἦν
  choice: pois fazia calor
  rationale: Tradução portuguesa idiomática da oração causal que explica o desejo de banhar-se.
