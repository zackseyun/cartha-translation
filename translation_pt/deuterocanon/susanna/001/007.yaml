base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: pt
  text: Esses homens viram uma mulher de bela aparência, esposa de um dos irmãos deles dentre os filhos de Israel[a], chamada Susana, filha de Helcias e esposa de Joaquim, caminhando ao entardecer no jardim de seu marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “esposa de um irmão deles dentre os filhos de Israel”. A construção é incomum e pode indicar que ela era esposa de um compatriota israelita, sem necessariamente falar de um irmão biológico.'
    reason: Leitura alternativa e esclarecimento de uma construção grega sintaticamente difícil.
lexical_decisions:
- source_word: οὗτοι
  choice: Esses homens
  rationale: O demonstrativo retoma os homens mencionados no contexto. A explicitação de “homens” evita uma formulação truncada em português sem acrescentar informação nova.
- source_word: ἰδόντες
  choice: viram
  rationale: O particípio aoristo tem força narrativa; o pretérito perfeito produz uma frase natural em português e corresponde ao ato de ver no relato.
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: uma mulher de bela aparência
  rationale: ἀστεῖος, qualificado por τῷ εἴδει, descreve a beleza ou atratividade exterior. “De bela aparência” é claro, digno e próximo do grego.
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: esposa de um dos irmãos deles dentre os filhos de Israel
  rationale: A redação grega é sintaticamente difícil. A tradução conserva tanto a linguagem de fraternidade quanto a identificação com os filhos de Israel, sem reduzir silenciosamente a expressão a “uma israelita”.
- source_word: ὄνομα Σουσάνναν
  choice: chamada Susana
  rationale: É a forma idiomática e concisa de transmitir a fórmula de nomeação em português.
- source_word: θυγατέρα Χελκίου
  choice: filha de Helcias
  rationale: Tradução genealógica direta, com a forma portuguesa tradicional do nome grego Χελκίας.
- source_word: γυναῖκα Ἰωακείμ
  choice: esposa de Joaquim
  rationale: O genitivo expressa a relação conjugal. “Joaquim” é a forma portuguesa corrente correspondente a Ἰωακείμ.
- source_word: περιπατοῦσαν
  choice: caminhando
  rationale: O particípio descreve o movimento de Susana no jardim; “caminhando” é neutro e transparente.
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: no jardim de seu marido
  rationale: Neste contexto, παράδεισος designa um jardim ou recinto ajardinado, não o Paraíso em sentido teológico.
- source_word: τὸ δειλινόν
  choice: ao entardecer
  rationale: A expressão temporal indica o período vespertino, possivelmente próximo do crepúsculo; “ao entardecer” preserva essa nuance com naturalidade.
theological_decisions:
- issue: Sentido da expressão γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: esposa de um dos irmãos deles dentre os filhos de Israel
  alternative: esposa de um companheiro israelita deles
  rationale: A construção transmitida é difícil e pode sugerir fraternidade comunitária dentro de Israel, sem necessariamente indicar um irmão biológico. O texto principal mantém de perto a linguagem grega, enquanto a nota registra a dificuldade e evita resolver a ambiguidade de modo dogmático.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluidez, sem apagar a dificuldade da expressão de parentesco.
