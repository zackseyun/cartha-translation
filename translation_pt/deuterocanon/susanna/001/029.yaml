  source_fidelity: 'A tradução acompanha adequadamente a sequência e os elementos centrais do grego: a reunião do povo junto a Joaquim, a vinda dos dois anciãos, o propósito contrário à lei dirigido contra Susana, a finalidade de matá-la e a ordem de chamá-la. Contudo, “cheios de sua intenção” é pouco idiomático e deixa a referência possessiva menos clara em português.'
  naturalness: O registro é geralmente claro e apropriado. A expressão “cheios de um propósito ilegal de matar Susana” é mais natural que “cheios de sua intenção contrária à lei contra Susana, a fim de levá-la à morte”, sem perda relevante de conteúdo.
  terminology: “Anciãos”, “Joaquim”, “Susana” e “Hilquias” são escolhas adequadas. “Propósito ilegal” transmite de modo natural ἀνόμου ἐννοίας; a nota preserva alternativas úteis. “Mandem buscar” corresponde bem à ordem de enviar alguém para trazê-la.
