base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: pt
  text: 'No dia seguinte, quando o povo se reuniu junto de Joaquim, marido de Susana, chegaram os dois anciãos, cheios de um propósito ilegal de matar Susana. Diante do povo, eles disseram: “Mandem buscar Susana, filha de Hilquias e esposa de Joaquim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal direta e natural em português moderno; mantém a sequência narrativa sem reproduzir mecanicamente o semitismo καὶ ἐγένετο.
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: o povo se reuniu junto de Joaquim, marido de Susana
  rationale: “Reuniu-se” preserva a ação coletiva; “junto de” mantém o valor relacional de πρός sem afirmar que a reunião ocorreu na casa dele. A explicitação de Susana evita a possível ambiguidade de “marido dela” no início do versículo.
- source_word: οἱ δύο πρεσβῦται
  choice: os dois anciãos
  rationale: No contexto, o termo designa homens de reconhecida autoridade comunitária e judicial, não apenas homens idosos.
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  choice: cheios de sua intenção contrária à lei
  rationale: ἐννοία indica pensamento, desígnio ou intenção interior, enquanto ἄνομος lhe dá caráter contrário à lei. A formulação preserva tanto o aspecto interior como o jurídico.
- source_word: κατὰ Σουσάννης
  choice: contra Susana
  rationale: 'κατά com genitivo tem aqui sentido adversativo: o desígnio dos anciãos se dirige contra ela.'
- source_word: τοῦ θανατῶσαι αὐτήν
  choice: a fim de levá-la à morte
  rationale: O infinitivo articular exprime finalidade. “Levá-la à morte” conserva o contexto de condenação pública e evita reduzir a expressão a um ato genérico de matar.
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: Mandem buscar Susana
  rationale: A expressão ordena que alguém seja enviado para trazê-la; esta é a formulação idiomática correspondente em português.
- source_word: θυγατέρα Χελκίου
  choice: filha de Hilquias
  rationale: Identificação patronímica normal; “Hilquias” é a forma bíblica portuguesa tradicional e amplamente reconhecida para o nome.
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: esposa de Joaquim
  rationale: γυνή significa claramente “esposa” neste contexto; a forma nominal concisa mantém a identificação pública e formal.
theological_decisions:
- issue: Sentido de πρεσβῦται na cena judicial
  choice: anciãos
  alternative: homens idosos
  rationale: A narrativa os apresenta como autoridades reconhecidas diante do povo reunido. “Anciãos” preserva sua função social e judicial sem limitar o termo à idade.
- issue: Relação entre a intenção ilícita, Susana e sua morte
  choice: “intenção contrária à lei contra Susana, a fim de levá-la à morte”
  alternative: “intenção criminosa de matar Susana”
  rationale: A redação escolhida mantém separadamente o caráter ilícito da intenção (ἀνόμου ἐννοίας), sua direção contra Susana (κατὰ Σουσάννης) e a finalidade de levá-la à morte (τοῦ θανατῶσαι αὐτήν), sem fundir elementos distintos do grego.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar um período excessivamente pesado, sem alterar a progressão narrativa. Os nomes foram vertidos nas formas bíblicas portuguesas correntes: Susana, Joaquim e Hilquias.'
