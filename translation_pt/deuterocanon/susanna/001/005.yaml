base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: pt
  text: 'E naquele ano, dois anciãos dentre o povo foram nomeados juízes, a respeito dos quais o Soberano[a] tinha falado: “A transgressão da lei saiu da Babilônia, de anciãos que eram juízes e pareciam governar o povo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor” ou “Mestre”. O grego usa δεσπότης, título que enfatiza autoridade soberana, e não o termo mais comum κύριος.
    reason: lexical_alternative
  - marker: b
    text: A construção grega no fim do versículo é condensada. “Pareciam governar o povo” também pode ser entendido como “eram considerados governantes do povo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: foram nomeados
  rationale: Com o predicativo κριταί e em contexto de função pública, o verbo indica designação para um cargo, não mera exibição.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: O termo designa provavelmente líderes reconhecidos da comunidade, e não apenas homens idosos.
- source_word: κριταὶ
  choice: juízes
  rationale: Expressa diretamente a função judicial atribuída aos dois anciãos.
- source_word: δεσπότης
  choice: o Soberano
  rationale: Preserva a força de δεσπότης como título de autoridade absoluta e evita identificá-lo automaticamente com κύριος; em português, “Soberano” é mais natural e digno que “Mestre” neste enunciado divino.
- source_word: ἀνομία
  choice: transgressão da lei
  rationale: Torna explícita a ideia etimológica de violação da lei e se ajusta ao contexto de corrupção judicial.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Mantém de modo natural a imagem da transgressão procedendo da Babilônia.
- source_word: ἐκ Βαβυλῶνος
  choice: da Babilônia
  rationale: Forma idiomática em português para indicar a origem expressa por ἐκ.
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: e pareciam governar o povo
  rationale: “Pareciam” conserva a ambiguidade entre aparência e reputação, bem como a possível ironia do texto; “governar” representa adequadamente κυβερνᾷν.
theological_decisions:
- issue: Tradução de δεσπότης como título divino
  choice: o Soberano
  alternative: o Senhor; o Dono; o Mestre
  rationale: “O Soberano” comunica autoridade absoluta em registro digno e preserva alguma distinção lexical em relação a κύριος, sem impor uma formulação denominacional.
- issue: Valor de ἐδόκουν na descrição dos dirigentes
  choice: pareciam governar o povo
  alternative: eram considerados governantes do povo
  rationale: A opção principal preserva a tensão entre a posição pública dos anciãos e sua verdadeira corrupção, sem excluir totalmente a ideia de reputação social.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Anciãos” mantém o sentido institucional; “transgressão da lei” evita o tom excessivamente arcaico de “iniquidade”. A pontuação divide o período longo sem apagar a relação entre a nomeação dos juízes e a declaração citada.
