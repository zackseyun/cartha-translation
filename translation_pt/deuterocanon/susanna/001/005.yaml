  source_fidelity: A tradução transmite adequadamente a nomeação dos dois anciãos como juízes, a declaração a respeito deles e a origem da ἀνομία em Babilônia. A formulação final preserva bem a ambiguidade de ἐδόκουν («pareciam»). Convém, porém, manter mais diretamente a ligação sintática entre «a respeito dos quais» e «tinha falado», em vez de transformar ἐλάλησεν em uma introdução de fala direta («disse»).
  naturalness: O português é moderno, claro e de registro apropriado. «O Soberano», «anciãos» e «transgressão da lei» são escolhas naturais e inteligíveis. A revisão proposta apenas melhora a fluidez e a proximidade com a construção do grego.
  terminology: «Anciãos» representa bem πρεσβύτεροι no seu provável sentido institucional; «juízes» corresponde a κριταί; «o Soberano» é uma forma adequada para δεσπότης e conserva a distinção em relação a κύριος. «Transgressão da lei» explicita de modo aceitável ἀνομία, sem impor leitura doutrinária.
