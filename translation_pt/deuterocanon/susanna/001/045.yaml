base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/045.yaml
  text: And as she was being led away to be put to death, God stirred up the holy spirit of a younger boy whose name was Daniel.
translation:
  language: pt
  text: E, enquanto ela era levada para ser morta, Deus despertou o espírito santo de um rapaz mais jovem, chamado Daniel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: enquanto ela era levada para ser morta
  rationale: Reproduz com naturalidade a construção grega e mantém explícito que a conduziam para a morte.
- source_word: ἐξήγειρεν
  choice: despertou
  rationale: Expressa diretamente a ação divina de suscitar ou pôr em atividade o espírito do rapaz.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o espírito santo
  rationale: Mantém a construção definida do grego sem decidir além do texto se se trata do Espírito Santo como designação pessoal ou do espírito santificado/inspirado do rapaz.
- source_word: παιδαρίου νεωτέρου
  choice: um rapaz mais jovem
  rationale: Preserva tanto a juventude indicada por παιδάριον quanto o valor comparativo de νεώτερος.
- source_word: ᾧ ὄνομα Δανιήλ
  choice: chamado Daniel
  rationale: Forma portuguesa corrente e fiel para a expressão idiomática grega 'cujo nome era Daniel'.
theological_decisions:
- issue: Identidade de τὸ πνεῦμα τὸ ἅγιον
  choice: espírito santo em minúsculas
  alternative: Espírito Santo
  rationale: O grego pode ser entendido como o espírito santo do rapaz ou como referência ao Espírito Santo. A minúscula, em ligação com 'de um rapaz', preserva a sintaxe e evita resolver silenciosamente a ambiguidade em favor de uma leitura pessoal trinitária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A formulação evita arcaísmos e preserva o comparativo 'mais jovem' presente no grego.
