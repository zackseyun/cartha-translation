  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: pt
  text: E, quando nos aproximamos, nós a reconhecemos; mas o jovem fugiu coberto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: nós a reconhecemos
  rationale: O verbo ἐπιγινώσκω, neste contexto, indica identificação ou reconhecimento da mulher, não apenas o ato de vê-la.
- source_word: νεανίσκος
  choice: o jovem
  rationale: Tradução natural e abrangente para um homem jovem, sem acrescentar precisão etária ausente no grego.
- source_word: συγκεκαλυμμένος
  choice: com o rosto coberto
  rationale: O particípio significa estar coberto ou velado; a explicitação de 'rosto' comunica em português a ideia contextual de ocultação da identidade, sem indicar quem o teria coberto.
