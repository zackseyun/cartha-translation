translation_notes:
  register: Português moderno, claro e digno. A fala acusatória dos anciãos é preservada sem validar sua veracidade. A repetição enfática do pronome em 'nós a reconhecemos' ajuda a transmitir a alegação de identificação expressa por ἐπέγνωμεν.
