base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/040.yaml
  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: pt
  text: 'Depois de agarrá-la, nós a interrogamos: “Quem era o homem?” Mas ela não nos disse quem ele era. Damos testemunho destas coisas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estas coisas testemunhamos.”'
    reason: Alternativa de ordem e formulação para ταῦτα μαρτυροῦμεν, preservando o plural demonstrativo e o registro forense.
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: depois de agarrá-la
  rationale: O particípio aoristo de ἐπιλαμβάνομαι indica que os anciãos a pegaram fisicamente. “Agarrá-la” conserva essa força sem soar excessivamente técnico.
- source_word: ἐπηρώτωμεν
  choice: nós a interrogamos
  rationale: O imperfeito de ἐπερωτάω descreve o ato de questioná-la. “Interrogamos” combina com o contexto judicial e é mais forte que o simples “perguntamos”, sem acrescentar coerção não expressa no grego.
- source_word: Τίς ὁ ἄνθρωπος;
  choice: Quem é o homem?
  rationale: A pergunta direta grega identifica o suposto homem. O presente conserva a forma e a vivacidade do discurso direto, sem ajustar silenciosamente o tempo verbal à narração retrospectiva.
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: ela não nos disse
  rationale: Neste contexto, ἀπαγγέλλω se refere a comunicar ou revelar a identidade. “Não nos disse” é natural e mantém o sentido sem impor a ideia explícita de recusa.
- source_word: τίς ἦν
  choice: quem ele era
  rationale: A oração trata da identidade do homem, e não de seu caráter ou tipo.
- source_word: ταῦτα μαρτυροῦμεν
  choice: Damos testemunho dessas coisas
  rationale: A formulação preserva tanto o demonstrativo plural ταῦτα quanto o valor forense de μαρτυρέω, em português natural e solene.
theological_decisions:
- issue: Registro forense da acusação dos anciãos
  choice: Manter a linguagem explícita de testemunho na frase final
  alternative: É esse o nosso testemunho
  rationale: A cena apresenta uma acusação judicial. “Damos testemunho” conserva o ato verbal e a força forense do grego, sem transformar a fala em simples comentário narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “nós” foi mantido para dar clareza ao sujeito coletivo da acusação. A nota foi vinculada à oração final, à qual de fato corresponde a alternativa lexical.
