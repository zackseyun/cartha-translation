  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: pt
  text: 'Mas, depois que foram separados um do outro, ele chamou um deles e lhe disse: “Você, que envelheceu em dias maus[a], agora chegaram os pecados que você cometia anteriormente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais compacto: “Velho de dias maus”. A expressão grega é uma repreensão e pode ser entendida como referência a uma vida marcada pelo mal ou a dias maus.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego extraído termina em τὸ, aparentemente o início da expressão τὸ πρότερον (“anteriormente”, “antes”), que continua além da divisão do versículo. A tradução reflete esse sentido provável.
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: os separaram
  rationale: O aoristo passivo indica que os dois anciãos foram separados; a construção com sujeito indeterminado é natural em português e preserva o sentido passivo.
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: um do outro
  rationale: Expressa de modo idiomático que os dois foram isolados entre si para serem interrogados separadamente.
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: chamou um deles
  rationale: Mantém o sentido comum de καλέω e a referência a apenas um dos dois.
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: Você, que envelheceu em dias maus
  rationale: Preserva a força participial e a expressão ἡμερῶν κακῶν sem decidir se os dias eram maus por causa da conduta do ancião ou por causa do tempo em que viveu.
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: agora chegaram os pecados
  rationale: Traduz literalmente a imagem de ἥκασιν, segundo a qual os pecados passados chegam ao ancião no momento do juízo.
- source_word: ἃς ἐποίεις
  choice: que você cometia
  rationale: O imperfeito sugere conduta repetida ou contínua no passado; em português, 'cometia' combina naturalmente com 'pecados'.
- source_word: τὸ
  choice: anteriormente
  rationale: O texto extraído termina no artigo τὸ, aparentemente o início da locução τὸ πρότερον, que atravessa a divisão do versículo; 'anteriormente' traduz o sentido provável sem ocultar a questão textual.
theological_decisions:
- issue: Força moral da repreensão dirigida ao ancião
  choice: A fala é apresentada como denúncia de uma vida marcada pelo mal, mediante 'envelheceu em dias maus'.
  alternative: “Velho, envelhecido no mal.”
  rationale: O contexto judicial e o vocativo grego têm força condenatória, mas a formulação escolhida mantém a ambiguidade compacta do genitivo ἡμερῶν κακῶν sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega 'você' na fala direta para reproduzir o vocativo sem arcaísmo; mantém a imagem de os pecados 'chegarem' e conserva a ambiguidade da expressão grega sobre os 'dias maus'.
