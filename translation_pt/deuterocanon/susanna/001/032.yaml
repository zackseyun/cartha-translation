base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: pt
  text: E os homens sem lei ordenaram que ela fosse descoberta, para saciarem o desejo pela beleza dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para que fossem cheios de desejo pela beleza dela”; também pode ser traduzido por “para se fartarem de desejo pela beleza dela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξαν
  choice: ordenaram
  rationale: O aoristo de προστάσσω expressa uma ordem dada com autoridade; “ordenaram” preserva essa força em português natural.
- source_word: οἱ παράνομοι
  choice: os homens sem lei
  rationale: παράνομος descreve quem age contra a lei. A expressão mantém tanto a censura moral quanto a conotação jurídica; “homens” explicita os referentes masculinos indicados pelo contexto.
- source_word: ἀποκαλύψαι αὐτήν
  choice: que ela fosse descoberta
  rationale: ἀποκαλύπτω significa tirar a cobertura ou pôr à mostra. A formulação passiva acompanha naturalmente a construção dependente de “ordenaram” e evita especificar mais do que o grego.
- source_word: ἵνα ἐμπλησθῶσιν
  choice: para saciarem
  rationale: ἐμπίμπλημι significa encher ou satisfazer. Neste contexto, “saciarem” comunica de modo idiomático a busca de satisfação do desejo ao contemplarem a beleza dela.
- source_word: τοῦ κάλλους
  choice: pela beleza
  rationale: κάλλος designa beleza ou formosura física. “Beleza” é direto, atual e adequado ao registro.
- source_word: ἐπιθυμίας αὐτῆς
  choice: o desejo pela beleza dela
  rationale: ἐπιθυμία pode indicar desejo, anseio ou cobiça. O contexto revela seu caráter sexual e ilícito, mas “desejo” preserva a amplitude lexical sem atenuar o sentido contextual.
theological_decisions:
- issue: Caracterização moral de οἱ παράνομοι
  choice: os homens sem lei
  alternative: os perversos; os transgressores
  rationale: A tradução conserva simultaneamente a condenação moral e a dimensão jurídica do termo, sem acrescentar uma classificação teológica não expressa no texto.
- issue: Intensidade de ἐπιθυμία
  choice: desejo
  alternative: cobiça; desejo lascivo
  rationale: Embora o contexto torne evidente que se trata de desejo sexual corrupto, o substantivo grego possui alcance mais amplo. A escolha mantém essa tensão lexical e deixa o contexto determinar o caráter do desejo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “fosse descoberta” preserva a relativa indeterminação do grego quanto ao que exatamente lhe seria retirado, enquanto o contexto aponta para uma cobertura ou véu. A nota registra a imagem literal de serem “cheios” sem impor essa formulação menos natural ao texto principal.
