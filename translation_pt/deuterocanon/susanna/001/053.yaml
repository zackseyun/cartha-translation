  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
translation:
  language: pt
  text: 'No passado[a], você proferia sentenças injustas, condenando os inocentes, mas soltando os culpados, embora o Senhor diga[b]: “Não matarás o inocente e o justo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “julgando julgamentos injustos”. O grego repete palavras da mesma raiz para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'A citação retoma a linguagem jurídica de Êxodo 23:7 na tradição grega: não matar o inocente e o justo.'
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: antes
  rationale: Advérbio temporal que aponta para a conduta anterior do ancião; “antes” é natural e preserva a força retrospectiva.
- source_word: κρίνων κρίσεις ἀδίκους
  choice: quando você proferia sentenças injustas
  rationale: No contexto judicial, a expressão comunica o ato de emitir decisões injustas. A formulação evita a repetição pouco natural “julgar julgamentos”, cuja forma literal é registrada em nota.
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: condenando os inocentes
  rationale: ἀθῷος designa quem está livre de culpa, e κατακρίνω, em ambiente judicial, significa condenar.
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: e soltando os culpados
  rationale: ἀπολύω pode significar soltar ou absolver; “soltando” conserva a amplitude do verbo sem pressupor uma absolvição formal. αἴτιος indica quem é culpado.
- source_word: λέγοντος τοῦ κυρίου
  choice: embora o Senhor diga
  rationale: A construção introduz a ordem divina contrariada pela conduta descrita; “embora” torna explícita a relação concessiva indicada pelo contexto.
- source_word: Ἀθῷον καὶ δίκαιον
  choice: o inocente e o justo
  rationale: Mantém distintos os dois qualificativos da linguagem jurídica da citação.
- source_word: οὐκ ἀποκτενεῖς
  choice: não matarás
  rationale: O verbo significa matar ou levar à morte. Nesta formulação legal, “não matarás” é conciso e preserva a segunda pessoa singular do grego.
theological_decisions:
- issue: Tradução de κύριος em citação das Escrituras
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto-fonte grego traz κύριος. “O Senhor” é a representação direta e não introduz no texto grego a forma tipográfica associada ao nome divino hebraico.
- issue: Força de λέγοντος τοῦ κυρίου
  choice: embora o Senhor diga
  alternative: como diz o Senhor
  rationale: O contexto contrasta a corrupção judicial do ancião com a ordem divina. “Embora” expressa essa força concessiva sem alterar o conteúdo da ordem.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe judicial foi naturalizada sem apagar a repetição do original, preservada na nota; manteve-se a tensão entre a conduta do juiz e a ordem do Senhor.
