base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: pt
  text: Era assim que vocês agiam com as filhas de Israel, e elas, por medo, se associavam a vocês[a]; mas uma filha de Judá não suportou a iniquidade de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «conviviam com vocês» ou «mantinham trato com vocês». O grego diz que elas se associavam aos anciãos porque tinham medo. O contexto coercivo sugere mais do que simples convivência social, mas o verbo empregado é menos explícito do que uma referência direta a relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: Era assim que vocês agiam
  rationale: O imperfeito sugere conduta repetida ou habitual. A formulação comunica essa continuidade com naturalidade e mantém o tom acusatório.
- source_word: θυγατράσιν Ἰσραήλ
  choice: as filhas de Israel
  rationale: Preserva o idioma bíblico e o contraste retórico com «uma filha de Judá» no fim do versículo.
- source_word: φοβούμεναι
  choice: por medo
  rationale: 'Expressa com clareza o valor causal do particípio: o medo motivava a ação seguinte.'
- source_word: ὡμίλουν ὑμῖν
  choice: se relacionavam com vocês
  rationale: ὁμιλέω pode indicar convívio, associação ou trato com alguém. No contexto, há uma conotação coerciva e possivelmente sexual, mas o verbo grego não é sexual de modo explícito; a escolha conserva essa ambiguidade.
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: mas uma filha de Judá não
  rationale: Mantém o singular sem artigo como referência representativa a Susana e conserva o contraste com o plural «filhas de Israel».
- source_word: ὑπέμεινεν
  choice: não suportou
  rationale: Representa o sentido de permanecer sob, aguentar ou suportar, sem explicitar além do texto se a ideia principal é tolerância ou submissão.
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: a iniquidade de vocês
  rationale: «Iniquidade» preserva a força moral e legal de ἀνομία e soa mais natural em português bíblico atual do que uma tradução rígida como «ausência de lei».
theological_decisions:
- issue: Singular representativo em «filha de Judá»
  choice: uma filha de Judá
  alternative: nenhuma filha de Judá; as filhas de Judá
  rationale: A tradução conserva o singular grego e permite que Susana apareça como representante de Judá, sem ampliar a afirmação para todas as mulheres de Judá.
- issue: Força moral e legal de ἀνομία
  choice: iniquidade
  alternative: maldade; injustiça; transgressão da lei
  rationale: «Iniquidade» mantém juntas as dimensões moral e legal do termo, sem restringi-lo apenas à injustiça judicial ou à imoralidade privada.
- issue: Grau de explicitação da coerção sexual
  choice: se relacionavam com vocês
  alternative: conviviam com vocês; cediam a vocês; tinham relações sexuais com vocês
  rationale: O contexto indica abuso coercivo, reforçado por «por medo», mas ὁμιλέω é lexicalmente menos explícito que um verbo sexual direto. A tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural dirigido aos dois anciãos. Mantém o paralelismo bíblico entre «filhas de Israel» e «uma filha de Judá», além da ambiguidade deliberada do verbo ὁμιλέω.
