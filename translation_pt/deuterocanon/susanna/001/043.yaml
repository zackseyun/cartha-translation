base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: pt
  text: Tu sabes que eles deram falso testemunho contra mim; e eis que estou morrendo, sem ter feito nada daquilo que estes homens tramaram perversamente contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sem ter feito nada do que estes homens tramaram contra mim». O verbo grego pode enfatizar tanto a trama perversa quanto a ação maliciosa dirigida contra Susana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: tu sabes
  rationale: Expressa diretamente o conhecimento de Deus no contexto da oração; «tu sabes» é natural, solene e claro.
- source_word: ψευδῆ ... κατεμαρτύρησαν
  choice: deram falso testemunho contra mim
  rationale: Preserva o sentido forense da expressão grega e explicita que se trata de depoimento acusatório falso.
- source_word: ἰδοὺ
  choice: agora
  rationale: Neste contexto, a partícula chama a atenção para a situação presente e iminente de Susana; «agora» transmite essa urgência em português atual sem o arcaísmo de «eis».
- source_word: ἀποθνῄσκω
  choice: estou morrendo
  rationale: O presente grego comunica morte iminente ou já em curso; a forma progressiva preserva a urgência.
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: sem ter feito nada daquilo que
  rationale: Reproduz de modo natural a construção participial negativa e afirma integralmente a inocência de Susana sem acrescentar uma relação concessiva explícita.
- source_word: ἐπονηρεύσαντο
  choice: tramaram perversamente
  rationale: Mantém tanto a ideia de maquinação dirigida contra Susana quanto a avaliação moral negativa contida no verbo.
- source_word: κατ᾽ ἐμοῦ
  choice: contra mim
  rationale: No contexto judicial, κατά com genitivo tem força adversativa.
theological_decisions:
- issue: Sentido da oração participial μὴ ποιήσασα μηδὲν ὧν οὗτοι ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: sem ter feito nada daquilo que estes homens tramaram perversamente contra mim
  alternative: embora eu não tenha feito nada do que estes homens alegaram maldosamente contra mim
  rationale: A formulação escolhida preserva a inocência de Susana e a malícia dos acusadores, sem definir em excesso se o verbo se refere especificamente à invenção das acusações ou, de modo mais amplo, à trama perversa contra ela.
- issue: Referente de οὗτοι
  choice: estes homens
  alternative: estes
  rationale: O demonstrativo aponta para os acusadores do contexto; «estes homens» torna o referente claro em português sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento «tu» foi mantido por se tratar de uma oração direta a Deus e por conservar solenidade sem recorrer a formas arcaicas. A colocação do marcador ao fim da frase vincula a nota à alternativa para toda a oração final.
