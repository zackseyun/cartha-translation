  yaml_path: translation/deuterocanon/susanna/001/009.yaml
  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: pt
  text: Eles perverteram a própria mente[a] e desviaram os olhos, para não olhar para o céu nem se lembrar de juízos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “distorceram a própria mente”. O verbo grego pode indicar tanto deformação quanto corrupção moral.
    reason: lexical_alternative
  - marker: b
    text: Também “julgamentos justos” ou “decisões justas”. A expressão provavelmente se refere aos atos ou padrões justos de Deus, embora o grego não traga um possessivo explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: perverteram
  rationale: O verbo indica desvio ou deformação, inclusive no sentido moral. “Perverteram” conserva essa força no contexto, sem reduzir a ação a uma simples mudança de opinião.
- source_word: τὸν νοῦν αὐτῶν
  choice: a própria mente
  rationale: νοῦς designa a faculdade interior de pensamento e percepção moral. O singular coletivo do grego é mantido de modo natural em português, e “própria” explicita o valor reflexivo do possessivo sem acrescentar um novo referente.
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: desviaram os olhos
  rationale: A expressão preserva a imagem concreta de afastar deliberadamente o olhar e soa natural em português atual.
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανόν
  choice: para não olhar para o céu
  rationale: O infinitivo articular com μή expressa propósito ou resultado pretendido. “Para não” comunica com clareza a recusa deliberada, e “olhar para o céu” reproduz a orientação do olhar sem explicitar Deus.
- source_word: μηδὲ μνημονεύειν
  choice: nem se lembrar
  rationale: μηδέ coordena a segunda ação negativa, e μνημονεύειν significa lembrar ou conservar na memória. A forma pronominal é idiomática em português.
- source_word: κριμάτων δικαίων
  choice: juízos justos
  rationale: κρίματα pode indicar juízos, decisões judiciais ou normas; δίκαια qualifica-os como justos. “Juízos justos” mantém a dimensão judicial e a ressonância bíblica, sem inserir um possessivo divino ausente no grego.
theological_decisions:
- issue: Referente de “céu” e de “juízos justos”
  choice: Manter “céu” e “juízos justos” sem acrescentar “Deus” ou “de Deus”.
  alternative: “para não olhar para Deus no céu nem se lembrar dos justos juízos de Deus”
  rationale: O contexto sugere uma orientação para Deus e para seus juízos, mas o grego não traz um possessivo nem nomeia Deus nesta oração. A tradução conserva a implicação sem transformá-la em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Juízos” preserva o teor judicial e bíblico do original; as notas registram alternativas correntes e mantêm explícita a ambiguidade quanto ao referente divino.
