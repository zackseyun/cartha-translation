translation:
  language: pt
  text: Havia um homem que morava na Babilônia, e seu nome era Joaquim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ΚΑΙ
  choice: '[sem equivalente explícito no início]'
  rationale: O καί inicial dá continuidade à narrativa; em português moderno, iniciar diretamente com “Havia” comunica com naturalidade a apresentação do personagem sem acrescentar um marcador temporal inexistente no grego.
- source_word: ἦν ἀνὴρ
  choice: Havia um homem
  rationale: A construção apresenta um novo personagem na narrativa. “Havia um homem” reproduz de modo idiomático esse valor apresentativo.
- source_word: οἰκῶν
  choice: que morava
  rationale: O particípio indica residência habitual. “Morava” é natural e claro em português, sem o tom mais solene ou antiquado de “habitava”.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: É a forma locativa corrente em português e usa o nome tradicionalmente estabelecido da cidade.
- source_word: καὶ ὄνομα αὐτῷ
  choice: e seu nome era
  rationale: Conserva o segundo καί e traduz de maneira idiomática a fórmula grega de identificação nominal.
- source_word: Ἰωακείμ
  choice: Joaquim
  rationale: “Joaquim” é a forma portuguesa corrente e reconhecível do nome representado pelo grego Ἰωακείμ.
theological_decisions:
- issue: Forma do nome próprio Ἰωακείμ
  choice: Joaquim
  alternative: Ioakim / Joakim
  rationale: A forma portuguesa estabelecida preserva a identidade do nome grego e evita uma transliteração estrangeirizante, sem introduzir interpretação teológica.
translation_notes:
  register: Narrativa simples, digna e atual, com vocabulário amplamente compreensível em português internacional e leitura natural no Brasil. A coordenação do grego foi preservada onde soa natural; o καί inicial não recebeu equivalente explícito.
