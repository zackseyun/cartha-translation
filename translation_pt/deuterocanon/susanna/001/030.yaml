  text: Então mandaram chamá-la, e ela veio com seus pais, seus filhos e todos os seus parentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: mandaram chamá-la
  rationale: No contexto, o verbo indica que enviaram alguém para convocar Susana; esta formulação expressa esse sentido de modo natural em português.
- source_word: ἦλθεν
  choice: veio
  rationale: Equivalente direto e natural do aoristo narrativo.
- source_word: γονεῖς
  choice: pais
  rationale: Em português, “pais” designa naturalmente os genitores, sem acrescentar a explicitação “pai e mãe”.
- source_word: τέκνα
  choice: filhos
  rationale: Neste contexto familiar, é o equivalente corrente e abrangente; o gênero gramatical masculino funciona como forma não marcada no plural.
- source_word: συγγενεῖς
  choice: parentes
  rationale: Expressa relações familiares em sentido amplo, com linguagem atual.
- source_word: πάντες
  choice: todos
  rationale: Preserva a inclusão da totalidade dos parentes mencionados.
- source_word: οἱ δὲ
  choice: Então
  rationale: δέ marca aqui a progressão narrativa, sem exigir contraste forte; “Então” liga naturalmente a ação ao contexto anterior.
