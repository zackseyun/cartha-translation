translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois bem” evita uma transição excessivamente literal; “você os surpreendeu” torna explícito o objeto já presente no grego e preserva o sentido judicial de flagrar. A marca de nota foi colocada junto de “azinheira”, termo ao qual a variante lexical se refere.
