  text: 'Now then[a], tell me: under what tree did you catch them talking with one another? And he said, “Under a holm oak.”'
translation:
  language: pt
  text: 'Pois bem, diga-me: debaixo de que árvore você os surpreendeu conversando entre si? Ele respondeu: “Debaixo de uma azinheira[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais geral, “carvalho”. O grego usa o nome de uma espécie específica de carvalho (πρῖνος).
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Pois bem
  rationale: Introduz de modo natural a pergunta imediata e conclusiva de Daniel, preservando a força de transição sem rigidez literal.
- source_word: λέγε μοι
  choice: diga-me
  rationale: O imperativo pede uma resposta direta; “diga-me” é claro, corrente e mantém a força da ordem.
- source_word: Ὑπὸ τί δένδρον
  choice: debaixo de que árvore
  rationale: Reproduz diretamente a pergunta pela árvore específica sob a qual o fato alegado teria ocorrido.
- source_word: κατέλαβες
  choice: você os surpreendeu
  rationale: No contexto do interrogatório, o verbo indica encontrar ou apanhar pessoas em determinada situação, não necessariamente agarrá-las fisicamente; “surpreendeu” comunica bem a ideia de flagrá-las.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: conversando entre si
  rationale: Expressa de forma natural tanto a atividade verbal quanto a reciprocidade indicada pelo grego.
- source_word: πρῖνον
  choice: azinheira
  rationale: O termo grego designa uma espécie específica de carvalho, geralmente identificada como azinheira. A precisão é mantida porque a espécie da árvore é relevante para o interrogatório.
