base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/026.yaml
  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
translation:
  language: pt
  text: Mas, quando as pessoas da casa ouviram o grito no jardim, entraram correndo pela porta lateral[a] para ver o que havia acontecido com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “portão lateral”; o grego pode designar uma entrada lateral, sem especificar sua forma arquitetônica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: grito
  rationale: Expressa um clamor alto e urgente, adequado ao alarme público da cena, em linguagem portuguesa natural.
- source_word: παράδεισος
  choice: jardim
  rationale: Neste contexto, refere-se ao jardim cercado ligado à casa, não ao sentido teológico de “paraíso”.
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: as pessoas da casa
  rationale: Mantém a referência ampla a pessoas ligadas à casa ou provenientes dela, sem identificá-las especificamente como familiares ou servos.
- source_word: εἰσεπήδησαν
  choice: entraram correndo
  rationale: Comunica o movimento súbito e urgente para dentro de modo claro e idiomático.
- source_word: πλαγία θύρα
  choice: porta lateral
  rationale: É a equivalência mais direta no cenário de casa e jardim; “portão lateral” também é possível, pois θύρα não determina com precisão a estrutura da entrada.
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: o que havia acontecido com ela
  rationale: Reproduz naturalmente o particípio perfeito e conserva a relação do acontecimento com Susana expressa pelo dativo αὐτῇ.
