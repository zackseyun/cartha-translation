translation:
  language: pt
  text: ao próximo, para fazer-lhe o que a Lei de Moisés determina; e os mataram. E, naquele dia, o sangue inocente foi poupado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ πλησίον
  choice: ao próximo
  rationale: Mantém de forma compacta o dativo grego e a ligação sintática com o versículo anterior. No fluxo completo da frase, o sentido é fazer ao próximo aquilo que os anciãos haviam tramado.
- source_word: ποιῆσαι
  choice: para agir
  rationale: O infinitivo exprime ação a ser realizada; “agir” soa mais natural em português junto à fórmula jurídica seguinte sem acrescentar conteúdo.
- source_word: κατὰ τὸν νόμον Μωϋσῆ
  choice: segundo a Lei de Moisés
  rationale: Equivalente corrente e claro da expressão jurídica grega, preservando a referência explícita à Lei mosaica.
- source_word: ἀπέκτειναν αὐτούς
  choice: os mataram
  rationale: Traduz diretamente o verbo “matar”. Embora o contexto seja judicial, “executaram” poderia introduzir uma tecnicidade moderna maior do que a do grego.
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: o sangue inocente foi poupado
  rationale: Preserva a expressão bíblica “sangue inocente” e comunica naturalmente que se evitou uma morte injusta; “foi salvo” seria mais literal, porém menos idiomático com “sangue” em português.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: Forma temporal idiomática e fiel ao grego.
theological_decisions:
- issue: Nuance judicial de ἀπέκτειναν
  choice: os mataram
  alternative: os executaram
  rationale: O contexto envolve aplicação da Lei de Moisés, mas o verbo grego designa genericamente matar ou dar morte. A tradução escolhida conserva essa amplitude sem impor terminologia penal moderna.
- issue: Sentido de ἐσώθη αἷμα ἀναίτιον
  choice: o sangue inocente foi poupado
  alternative: o sangue inocente foi salvo
  rationale: A frase descreve a prevenção de derramamento injusto de sangue. “Foi poupado” torna o idioma bíblico inteligível sem reduzir sua gravidade teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O início fragmentário foi preservado porque o texto grego deste versículo depende sintaticamente do anterior; a nota esclarece a construção sem reconstruí-la silenciosamente.
