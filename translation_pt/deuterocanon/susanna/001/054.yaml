  yaml_path: translation/deuterocanon/susanna/001/054.yaml
  text: 'Now then[a], if you saw this woman, tell us: under what tree did you see them talking with each other? And he said, “Under a mastic tree.”'
translation:
  language: pt
  text: 'Agora, pois, se de fato você viu esta mulher, diga: debaixo de que árvore você os viu conversando entre si? Ele respondeu: “Debaixo de um lentisco.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego σχῖνος designa o lentisco, também chamado aroeira-mástica.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Preserva a transição imediata e inferencial do grego em português natural e digno.
- source_word: ταύτην
  choice: esta mulher
  rationale: Explicita o referente feminino indicado pelo demonstrativo, sem acrescentar informação além do contexto.
- source_word: εἴπερ εἶδες
  choice: se de fato você viu
  rationale: Mantém a força enfática e desafiadora de εἴπερ, importante no interrogatório.
- source_word: εἰπὸν
  choice: diga
  rationale: Reproduz diretamente o imperativo singular sem inserir um objeto indireto ausente no grego.
- source_word: Ὑπὸ τί δένδρον
  choice: debaixo de que árvore
  rationale: Equivalente locativo claro e corrente em português.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: conversando um com o outro
  rationale: Expressa tanto a interação verbal de ὁμιλέω quanto a reciprocidade de ἀλλήλοις.
- source_word: σχῖνον
  choice: um lentisco
  rationale: Lentisco é o nome português específico de Pistacia lentiscus, também conhecida como aroeira-mástica, e preserva a identificação botânica relevante ao jogo de palavras subsequente.
