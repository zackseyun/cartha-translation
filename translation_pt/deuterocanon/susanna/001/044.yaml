translation:
  language: pt
  text: E o Senhor ouviu a voz dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: ouviu
  rationale: O verbo pode incluir a ideia de ouvir favoravelmente uma súplica, mas “ouviu” preserva a simplicidade narrativa e não antecipa a forma da resposta divina.
- source_word: Κύριος
  choice: Senhor
  rationale: Traduz diretamente o título divino grego, sem adotar a convenção “SENHOR”, que poderia sugerir uma representação explícita do nome divino hebraico.
- source_word: φωνῆς αὐτῆς
  choice: a voz dela
  rationale: Mantém o sentido concreto e a estrutura do grego. “Clamor” ou “súplica” explicitariam o contexto, mas seriam menos formais.
theological_decisions:
- issue: Se deve ser explicitado que Deus respondeu favoravelmente à oração de Susana
  choice: O Senhor ouviu a voz dela
  alternative: O Senhor respondeu ao clamor dela
  rationale: Embora εἰσακούω possa implicar acolhimento favorável, o versículo afirma diretamente que o Senhor a ouviu, sem ainda especificar como respondeu.
- issue: Forma portuguesa do título divino Κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: Como o testemunho-fonte é grego e traz Κύριος, “Senhor” evita insinuar uma correspondência textual explícita com o tetragrama hebraico.
translation_notes:
  register: Português moderno, natural e digno, com sintaxe simples. A formulação conserva a coordenação inicial do grego e a expressão literal “a voz dela”.
