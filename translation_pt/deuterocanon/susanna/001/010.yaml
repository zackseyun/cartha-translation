base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
translation:
  language: pt
  text: Ambos estavam tomados de desejo por ela[a], e nenhum revelava ao outro o mal que os dominava em relação a ela[b]; a mulher não sabia deste fato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “traspassados” ou “pungidos” em relação a ela; aqui, a imagem indica que estavam profundamente tomados de desejo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o desejo mau que os dominava em relação a ela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμφότεροι
  choice: Ambos
  rationale: Retoma de modo natural e explícito os dois anciãos já mencionados.
- source_word: κατανενυγμένοι
  choice: estavam tomados de desejo
  rationale: O particípio perfeito passivo evoca literalmente terem sido traspassados ou pungidos; no contexto, descreve uma forte fixação erótica. A formulação comunica tanto a intensidade quanto o estado persistente.
- source_word: περὶ αὐτῆς
  choice: por ela
  rationale: Com a expressão de desejo, esta é a construção idiomática natural em português.
- source_word: ἕτερος τῷ ἑτέρῳ οὐ προσεποιεῖτο
  choice: nenhum revelava ao outro
  rationale: Explicita naturalmente a reciprocidade sob negação e entende o verbo, neste contexto, como dar a conhecer ou admitir.
- source_word: τὸ κακὸν
  choice: o mal
  rationale: Preserva a formulação ampla e a avaliação moral explícita do grego, sem definir além do necessário se se trata do desejo, da intenção ou de ambos.
- source_word: τὸ ἔχον αὐτοὺς
  choice: que os dominava
  rationale: Expressa a imagem do mal que os tinha sob seu poder; é mais natural em português do que a reprodução literal 'que os tinha'.
- source_word: περὶ αὐτῆς
  choice: por causa dela
  rationale: Liga o mal à fixação deles em Susana sem repetir mecanicamente 'por ela' e sem acrescentar que ela fosse moralmente responsável.
- source_word: ἡ γυνή
  choice: a mulher
  rationale: Mantém a designação narrativa genérica do texto grego para Susana.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: nada disso
  rationale: Equivalente português corrente de 'não conhecia esta questão/coisa', preservando a ignorância dela quanto à situação oculta.
theological_decisions:
- issue: Caracterização moral do desejo oculto dos anciãos
  choice: Traduzir τὸ κακὸν como 'o mal'
  alternative: '''a paixão perversa'' ou ''o desejo mau'''
  rationale: O grego qualifica moralmente aquilo que os dominava, mas deixa o substantivo relativamente aberto. 'O mal' conserva essa amplitude e evita resolver se o foco recai apenas no desejo ou também na intenção que dele surgia.
- issue: Força idiomática de κατανενυγμένοι no contexto erótico
  choice: Traduzir como 'tomados de desejo'
  alternative: '''traspassados por causa dela'' ou ''inflamados de desejo por ela'''
  rationale: A tradução comunica a força erótica indicada pelo contexto e o estado de sujeição dos anciãos, enquanto uma nota preserva a imagem lexical literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita linguagem excessivamente técnica e preserva, em 'o mal', a amplitude moral do original.
