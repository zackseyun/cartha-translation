base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: pt
  text: 'Então Daniel disse: “Você mentiu muito bem[a] contra a sua própria cabeça, pois um anjo de Deus já recebeu de Deus a sentença[b] e o partirá ao meio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você mentiu corretamente contra a sua própria cabeça”. A expressão provavelmente é irônica: o falso testemunho fez o juízo recair sobre o próprio mentiroso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a decisão” ou “a ordem”. O termo grego pode indicar uma declaração oral ou um pronunciamento judicial; neste contexto, “sentença” exprime bem o sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  choice: muito bem
  rationale: 'Em português, “mentiu muito bem” soa natural e conserva a ironia cortante: a mentira volta-se precisamente contra quem a proferiu. A nota registra uma alternativa mais literal.'
- source_word: ἔψευσαι
  choice: você mentiu
  rationale: O aoristo é vertido de modo direto e idiomático, adequado à acusação judicial imediata.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: contra a sua própria cabeça
  rationale: Mantém a imagem concreta do grego e expressa que a culpa e suas consequências recaem sobre o próprio falso acusador.
- source_word: ἤδη
  choice: já
  rationale: Preserva a noção de que o juízo divino já foi posto em andamento.
- source_word: ἄγγελος τοῦ θεοῦ
  choice: um anjo de Deus
  rationale: A ausência de artigo diante de ἄγγελος favorece a forma indefinida.
- source_word: λαβὼν φάσιν παρὰ τοῦ θεοῦ
  choice: recebeu de Deus a sentença
  rationale: A construção participial é reorganizada em português para maior naturalidade. No contexto judicial, φάσις designa adequadamente uma sentença, embora também possa significar decisão ou ordem.
- source_word: σχίσει σε μέσον
  choice: o partirá ao meio
  rationale: Reproduz com clareza e dignidade a imagem severa de ser dividido pelo meio.
theological_decisions:
- issue: Natureza da ação do anjo
  choice: O anjo de Deus é apresentado concretamente como executor da sentença recebida de Deus.
  alternative: Entender a referência de modo mais geral como simples anúncio do juízo divino.
  rationale: O grego nomeia explicitamente um anjo de Deus, que recebe de Deus uma decisão e executa o castigo; a tradução não reduz essa agência a uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala direta conserva a ironia e a violência da imagem grega sem suavizar a função judicial do anjo.
