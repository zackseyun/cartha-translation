  text: greatly[a], and fearing the Lord; and her parents were righteous, and they taught their daughter according to the law of Moses.
translation:
  language: pt
  text: muito[a] e temente ao Senhor; seus pais eram justos e ensinaram sua filha segundo a Lei de Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “muito”; o advérbio completa a descrição de Susana iniciada na oração anterior.
    reason: A divisão do versículo separa o advérbio da qualidade que ele intensifica; a nota esclarece a ligação sem inserir no texto uma palavra ausente deste trecho grego.
lexical_decisions:
- source_word: σφόδρα
  choice: muito
  rationale: O advérbio intensifica a qualidade expressa na oração anterior. A tradução preserva essa ligação sem acrescentar ao versículo o adjetivo subentendido.
- source_word: φοβουμένη
  choice: temente
  rationale: O particípio descreve temor reverente diante de Deus. “Temente ao Senhor” é natural no registro bíblico português e mantém o valor religioso do verbo.
- source_word: κύριον
  choice: Senhor
  rationale: Em referência ao Deus de Israel, “Senhor” traduz diretamente κύριος sem pressupor no texto grego a presença explícita do nome divino hebraico.
- source_word: γονεῖς
  choice: pais
  rationale: O substantivo plural designa coletivamente o pai e a mãe de Susana; “pais” é a forma corrente em português.
- source_word: δίκαιοι
  choice: justos
  rationale: Preserva o sentido moral e religioso de δίκαιοι e é a formulação bíblica natural em português.
- source_word: ἐδίδαξαν
  choice: ensinaram
  rationale: Equivalente direto e corrente para a ação de instruir.
- source_word: θυγατέρα
  choice: filha
  rationale: Mantém explicitamente a relação familiar indicada pelo grego.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: segundo a Lei de Moisés
  rationale: Κατά com acusativo indica conformidade com uma norma. “Segundo” expressa isso de modo conciso e natural; a maiúscula em “Lei” assinala o corpo normativo mosaico.
theological_decisions:
- issue: Tradução de κύριος em referência a Deus
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz κύριος, não o nome divino hebraico; “Senhor” mantém a primazia da evidência grega e a referência reverente.
- issue: Caracterização dos pais por δίκαιοι
  choice: justos
  alternative: retos
  rationale: “Justos” conserva melhor o peso moral e religioso do termo no uso bíblico, sem restringi-lo a um sentido meramente jurídico.
- issue: Sentido religioso de φοβουμένη
  choice: temente ao Senhor
  alternative: que reverenciava o Senhor
  rationale: “Temente” preserva a imagem lexical do temor reverente sem reduzir o termo apenas a respeito ou devoção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. Conserva-se a abertura fragmentária causada pela divisão do versículo e evita-se repetir o adjetivo presente na oração anterior. O segundo “e” grego não foi reproduzido antes de “seus pais”, pois o ponto e vírgula já expressa naturalmente a coordenação em português.
