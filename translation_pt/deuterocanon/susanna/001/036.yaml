  yaml_path: translation/deuterocanon/susanna/001/036.yaml
  text: But the two elders said[a], “We were walking in the garden of her husband,”
translation:
  language: pt
  text: 'Mas os dois anciãos disseram: “Nós estávamos andando no jardim[a] do marido dela,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode designar um pomar ou parque cercado; aqui se refere ao jardim particular ligado à casa do marido dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  choice: Mas os dois anciãos
  rationale: “Anciãos” preserva a função reconhecida de autoridade comunitária e judicial, sem reduzir o termo apenas à idade dos homens. “Mas” marca a transição narrativa introduzida por δέ.
- source_word: εἶπαν
  choice: disseram
  rationale: Equivalente direto e natural para o verbo que introduz a fala, sem acrescentar a ideia de resposta ou declaração solene.
- source_word: Ἡμεῖς
  choice: Nós
  rationale: O pronome explícito conserva a ênfase presente no grego e soa natural no início da declaração.
- source_word: περιεπατοῦμεν
  choice: estávamos andando
  rationale: A construção progressiva preserva o aspecto contínuo do imperfeito grego, sem acrescentar a conotação de lazer de “passeando”.
- source_word: ἐν τῷ παραδείσῳ
  choice: no jardim
  rationale: Neste contexto, παράδεισος designa uma área privada, cultivada e possivelmente cercada, ligada à residência; “jardim” é o equivalente moderno mais claro, enquanto “paraíso” seria enganoso.
- source_word: τοῦ ἀνδρὸς αὐτῆς
  choice: do marido dela
  rationale: Neste contexto, ἀνήρ significa “marido”, e o genitivo expressa de modo conciso a relação do jardim com ele.
