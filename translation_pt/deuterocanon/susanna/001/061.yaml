base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: pt
  text: Então se levantaram contra os dois anciãos, pois Daniel havia demonstrado, pelas palavras deles mesmos, que eram falsas testemunhas.[a] E fizeram com eles o que maldosamente haviam planejado fazer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Daniel havia exposto, com base no próprio testemunho deles, que eram falsas testemunhas”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final expressa justiça retributiva: os anciãos receberam a pena que perversamente haviam pretendido impor a Susana.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: se levantaram contra
  rationale: Preserva a imagem do verbo e o sentido hostil e judicial da expressão com ἐπί.
- source_word: πρεσβύτας
  choice: anciãos
  rationale: Indica não apenas idade, mas a posição reconhecida de autoridade comunitária e judicial desses homens.
- source_word: συνέστησεν
  choice: havia demonstrado
  rationale: No contexto, Daniel estabeleceu a falsidade do testemunho por meio das contradições dos próprios acusadores; a formulação mantém o valor probatório sem tornar o verbo mais técnico do que o grego exige.
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: pelas palavras deles mesmos
  rationale: Comunica naturalmente em português que a própria declaração oral dos anciãos forneceu a prova contra eles, sem reproduzir de modo artificial o singular idiomático στόματος.
- source_word: ψευδομάρτυρας ὄντας
  choice: que eram falsas testemunhas
  rationale: Mantém o sentido forense específico de ψευδομάρτυρας, em vez do sentido genérico de mentirosos.
- source_word: ἐποίησαν αὐτοὶ οὗν τὸν τρόπον
  choice: fizeram com eles o que
  rationale: Expressa de forma natural a correspondência entre o mal pretendido e a medida aplicada aos próprios anciãos.
- source_word: ἐπονηρεύσαντο
  choice: maldosamente haviam planejado fazer
  rationale: Torna claro o desígnio perverso sugerido pela forma verbal média e pelo contexto narrativo.
theological_decisions:
- issue: Reciprocidade judicial na fórmula de punição
  choice: Explicitar que os anciãos receberam aquilo que haviam planejado fazer
  alternative: “fizeram com eles conforme haviam agido perversamente”
  rationale: A redação comunica o princípio narrativo de punição recíproca aplicado à falsa testemunha, sem acrescentar nesta frase a identidade da vítima nem formular explicitamente a pena.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Anciãos” preserva o papel comunitário; “pelas palavras deles mesmos” evita um decalque pouco natural de “da boca deles” sem perder a força do testemunho autoincriminador.
