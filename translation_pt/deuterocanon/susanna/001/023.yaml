base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: pt
  text: Mas, se não, testemunharemos contra você[a], dizendo que um jovem estava com você e que, por isso, você mandou as jovens criadas[b] embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: «deporemos contra você». O verbo grego tem sentido forense.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega significa literalmente «as moças»; aqui, refere-se às jovens que serviam e acompanhavam Susana.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Mas, se não
  rationale: Preserva a condição elíptica e a força abrupta da ameaça, sem explicitar indevidamente a exigência feita no contexto anterior.
- source_word: καταμαρτυρήσομέν σου
  choice: testemunharemos contra você
  rationale: Mantém o tom forense do verbo composto e é mais fiel do que o mais interpretativo «acusaremos você».
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: dizendo que um jovem estava com você
  rationale: «Um jovem» traduz naturalmente νεανίσκος; «dizendo que» torna idiomática em português a introdução do conteúdo do falso testemunho.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa com clareza e concisão a relação causal alegada pelos anciãos.
- source_word: ἐξαπέστειλας
  choice: você mandou ... embora
  rationale: Reproduz o sentido direto de enviar para longe, sem a formalidade adicional de «dispensou».
- source_word: τὰ κοράσια
  choice: as jovens criadas
  rationale: O substantivo pode significar «moças», mas, neste contexto, refere-se às jovens que serviam e acompanhavam Susana.
- source_word: ἀπὸ σοῦ
  choice: embora
  rationale: Com o verbo «mandar», «embora» comunica de modo natural em português o afastamento indicado pela expressão grega.
theological_decisions:
- issue: Natureza da declaração dos anciãos
  choice: Apresentá-la como ameaça de testemunho judicial contra Susana
  alternative: Traduzir de modo mais geral como «acusaremos você»
  rationale: O grego emprega linguagem forense; preservá-la mantém a gravidade narrativa e moral da ameaça de falso testemunho.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção elíptica «se não» foi mantida para preservar a tensão coerciva do original; «testemunharemos contra você» conserva o registro judicial.
