base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: pt
  text: 'E eles disseram: “Veja, as portas do jardim[a] estão fechadas, ninguém nos vê, e estamos cheios de desejo por você. Portanto, ceda a nós e fique conosco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego παράδεισος significa aqui um jardim ou parque cercado, não o “Paraíso” no sentido teológico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Funciona como chamado de atenção direto e natural em português moderno, sem o tom arcaico de “Eis”.
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: as portas do jardim
  rationale: Neste contexto narrativo, παράδεισος designa um jardim ou parque cercado, não o Paraíso em sentido teológico posterior.
- source_word: κέκλεινται
  choice: estão fechadas
  rationale: Reproduz naturalmente o estado presente resultante expresso pelo perfeito passivo grego.
- source_word: οὐδεὶς θεωρεῖ ἡμᾶς
  choice: ninguém nos vê
  rationale: Tradução direta e idiomática do ato de ver ou observar, sem intensificar para “vigiar”.
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: estamos cheios de desejo por você
  rationale: Preserva a construção de forte desejo e sua conotação sexual no contexto, sem acrescentar a intensidade metafórica de “arder”.
- source_word: διὸ
  choice: Portanto
  rationale: Mantém claramente a inferência usada pelos homens para passar das circunstâncias à exigência.
- source_word: συγκατάθου ἡμῖν
  choice: consinta conosco
  rationale: Conserva a ideia de assentir ou aquiescer à exigência, sem suavizar sua natureza coercitiva nem explicitar além do grego.
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: fique conosco
  rationale: Expressa de modo natural o convite sexual implícito, deixando que o contexto forneça essa implicação.
theological_decisions:
- issue: Sentido de παράδεισος em contexto narrativo não escatológico
  choice: jardim
  alternative: Paraíso
  rationale: Na história de Susana, o termo indica o jardim cercado onde ocorre a cena. “Paraíso” introduziria uma associação teológica ou escatológica ausente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala mantém sua lógica predatória e coercitiva sem ampliar nem suavizar o texto grego. O marcador da nota foi colocado junto a “jardim”, termo ao qual a explicação se refere.
