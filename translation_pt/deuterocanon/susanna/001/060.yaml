base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/060.yaml
  text: And the whole assembly cried out with a loud voice[a], and they blessed God, who saves those who hope in him.
translation:
  language: pt
  text: E toda a assembleia clamou em alta voz e bendisse a Deus, que salva os que esperam nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que confiam nele». O verbo grego refere-se mais literalmente a esperar, mas, no uso bíblico, também pode envolver confiança e dependência de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: clamou
  rationale: Expressa uma exclamação forte e audível, com dignidade narrativa e sem recorrer a uma formulação coloquial.
- source_word: πᾶσα ἡ συναγωγή
  choice: toda a assembleia
  rationale: No contexto, designa a comunidade reunida, não a instituição posterior chamada sinagoga.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Reproduz de modo natural em português o idioma grego que indica fala ou clamor intenso.
- source_word: εὐλόγησαν
  choice: bendisse
  rationale: Preserva o sentido lexical e o registro bíblico de bendizer a Deus; o singular concorda com o núcleo coletivo «assembleia».
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: 'É o complemento dativo de εὐλόγησαν: a assembleia bendiz a Deus.'
- source_word: τῷ σώζοντι
  choice: que salva
  rationale: Traduz o particípio atributivo presente como ação característica de Deus, sem limitar o sentido a um único ato passado.
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: os que esperam nele
  rationale: Mantém o sentido primário de ἐλπίζω, esperança dirigida a Deus, embora no uso bíblico também inclua confiança e dependência.
theological_decisions:
- issue: Tradução de εὐλόγησαν τῷ θεῷ
  choice: bendisse a Deus
  alternative: louvou a Deus
  rationale: «Bendizer a Deus» conserva com transparência o verbo grego εὐλογέω e é um idioma bíblico compreensível em português.
- issue: Tradução de ἐλπίζοντας como esperança ou confiança
  choice: os que esperam nele
  alternative: os que confiam nele
  rationale: O grego emprega explicitamente o campo lexical da esperança. A tradução principal preserva esse dado, enquanto a nota registra a sobreposição possível com confiança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Assembleia» evita o anacronismo institucional de «sinagoga»; «em alta voz» mantém a imagem concreta do grego. O marcador foi colocado após «esperam nele», expressão à qual a nota lexical se refere.
