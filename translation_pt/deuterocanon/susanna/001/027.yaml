base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
translation:
  language: pt
  text: Mas, quando os anciãos fizeram suas declarações[a], os servos ficaram profundamente envergonhados, porque nunca se havia dito coisa semelhante a respeito de Susana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disseram suas palavras” ou “fizeram suas afirmações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: Mas, quando
  rationale: ἡνίκα introduz a oração temporal, e δέ marca a progressão narrativa com leve contraste; a formulação é natural em português e preserva ambas as funções.
- source_word: οἱ πρεσβῦται
  choice: os anciãos
  rationale: No contexto, πρεσβῦται designa homens idosos que também exercem autoridade comunitária e judicial; “anciãos” preserva essas duas dimensões.
- source_word: τοὺς λόγους αὐτῶν
  choice: suas declarações
  rationale: λόγοι refere-se ao que os anciãos disseram. “Declarações” é natural no contexto de um depoimento acusatório sem especificar além do grego que se tratava de acusações formais.
- source_word: κατῃσχύνθησαν οἱ δοῦλοι σφόδρα
  choice: os servos ficaram profundamente envergonhados
  rationale: κατῃσχύνθησαν expressa terem ficado envergonhados, e σφόδρα intensifica essa reação. “Servos” se ajusta aos empregados da casa neste contexto, sem exigir que o texto destaque sua condição jurídica.
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: porque nunca se havia dito
  rationale: A oração explica a reação dos servos; πώποτε com a negação significa “nunca”, e a construção impessoal passiva preserva o sentido do grego.
- source_word: λόγος τοιοῦτος
  choice: coisa semelhante
  rationale: Embora λόγος possa significar “palavra” ou “declaração”, aqui a expressão idiomática portuguesa “coisa semelhante” comunica naturalmente a ideia de uma alegação dessa natureza, sem defini-la mais estreitamente.
- source_word: περὶ Σουσάννης
  choice: a respeito de Susana
  rationale: περί com genitivo significa basicamente “a respeito de” ou “acerca de”; evita-se “contra”, que tornaria explícita uma força hostil apenas inferida do contexto.
