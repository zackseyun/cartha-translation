base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: pt
  text: 'E eles não sabiam que estávamos ali de pé. Então avançamos juntos[a], dizendo: “Vamos descobrir quem são estes homens[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega inclui literalmente o recíproco “uns aos outros”, mas sua relação com o verbo é incomum. Pode indicar um avanço conjunto; o texto não exige que tenham avançado uns contra os outros.
    reason: source_ambiguity
  - marker: b
    text: Literalmente, “quem são estes”; “homens” é suprido pelo contexto imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  choice: não sabiam
  rationale: Expressa de modo direto e natural o sentido passado de οἶδα no contexto narrativo.
- source_word: εἰστήκειμεν
  choice: estávamos ali
  rationale: O mais-que-perfeito de ἵστημι indica uma posição ou presença já estabelecida. Em português, “estávamos ali” comunica naturalmente essa presença anterior; explicitar “em pé” soaria desnecessariamente rígido no contexto.
- source_word: συνεπιτάμεθα ἀλλήλοις
  choice: avançamos juntos
  rationale: O verbo composto descreve um movimento conjunto e repentino. A construção com o recíproco ἀλλήλοις é incomum e não deve ser transformada sem segurança em “uns contra os outros”; a nota registra sua forma literal e a dificuldade sintática.
- source_word: Μάθωμεν
  choice: Vamos descobrir
  rationale: O subjuntivo aoristo tem força exortativa; esta formulação é corrente e preserva o sentido investigativo.
- source_word: τίνες εἰσὶν οὗτοι
  choice: quem são estes homens
  rationale: “Homens” explicita o referente masculino indicado pelo contexto imediato, sem alterar o sentido; a forma mais literal é registrada em nota.
