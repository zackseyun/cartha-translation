lexical_decisions:
- source_word: ἀναστάντες
  choice: se levantaram
  rationale: O particípio aoristo introduz uma ação anterior e ligada à seguinte; a forma verbal coordenada é natural em português e preserva a sequência narrativa.
- source_word: οἱ πρεσβύτεροι
  choice: os anciãos
  rationale: No contexto, o termo designa líderes reconhecidos da comunidade, não apenas homens idosos.
- source_word: κριταὶ
  choice: os juízes
  rationale: Designa diretamente aqueles que exerciam função judicial.
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν
  choice: puseram as mãos
  rationale: Reproduz de modo claro o gesto físico expresso por ἐπιτίθημι com χεῖρας, sem acrescentar conotação sacramental.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: sobre a cabeça dela
  rationale: É uma tradução espacial direta, natural e inequívoca; «dela» evita a possível ambiguidade de «sua» em português.
theological_decisions:
- issue: Possíveis conotações rituais ou sacramentais do gesto de impor as mãos
  choice: puseram as mãos sobre a cabeça dela
  alternative: impuseram as mãos sobre a cabeça dela
  rationale: O grego descreve um gesto concreto no processo judicial. «Puseram as mãos» preserva o ato físico sem sugerir indevidamente um rito eclesial posterior.
