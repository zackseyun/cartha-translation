base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: pt
  text: 'Elas fizeram como ela havia dito: fecharam as portas do jardim[a] e saíram pelas portas laterais para trazer o que lhes havia sido ordenado. Não viram os anciãos, pois eles estavam escondidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, a palavra grega παράδεισος designa um jardim ou parque cercado, não o “paraíso” no sentido teológico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: Elas fizeram como ela havia dito
  rationale: O sujeito feminino plural é recuperado do contexto narrativo, e o mais-que-perfeito composto expressa naturalmente em português a instrução anterior de Susana.
- source_word: ἀπέκλεισαν τὰς θύρας
  choice: fecharam as portas
  rationale: ἀποκλείω indica fechar ou impedir a passagem; “fecharam” preserva o sentido sem acrescentar que as portas foram trancadas.
- source_word: τοῦ παραδείσου
  choice: do jardim
  rationale: Neste contexto, παράδεισος designa um jardim ou parque cercado, não o paraíso em sentido teológico posterior.
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: pelas portas laterais
  rationale: κατά com o acusativo indica aqui o caminho ou a via de saída; “pelas” é idiomático e “portas laterais” mantém a repetição lexical de θύρας.
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: para trazer o que lhes havia sido ordenado
  rationale: O infinitivo expressa finalidade, e o particípio perfeito passivo aponta para ordens já dadas, sem especificar além do texto quais objetos deveriam ser trazidos.
- source_word: οὐκ εἴδοσαν τοὺς πρεσβυτέρους
  choice: Não viram os anciãos
  rationale: Mantém o sentido direto de “ver” e traduz πρεσβύτεροι segundo o papel social e judicial desses homens na narrativa.
- source_word: ἦσαν κεκρυμμένοι
  choice: eles estavam escondidos
  rationale: A construção perifrástica com particípio perfeito descreve o estado de ocultação já existente.
