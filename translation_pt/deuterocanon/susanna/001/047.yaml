  text: Then all the people turned to him and said[a], “What is this word that you have spoken?”
translation:
  language: pt
  text: 'Então todo o povo se voltou para ele e disse: “Que palavra[a] é essa que você falou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Que declaração é essa que você fez?” O termo grego λόγος pode significar “palavra”, “declaração” ou “assunto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν ... πρὸς αὐτόν
  choice: se voltou para ele
  rationale: Expressa naturalmente o redirecionamento da atenção do povo para Daniel, sem sugerir que o grupo havia partido e retornado.
- source_word: πᾶς ὁ λαός
  choice: o povo inteiro
  rationale: Preserva a abrangência de πᾶς e trata o povo reunido como um conjunto, em português corrente.
- source_word: εἶπαν
  choice: perguntou
  rationale: Embora o verbo grego signifique literalmente “disseram”, ele introduz aqui uma pergunta direta; “perguntou” produz português natural e concorda com o sujeito coletivo singular.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Que palavra é essa
  rationale: Mantém de perto λόγος e a forma interrogativa grega, deixando em aberto os sentidos possíveis de “palavra”, “declaração” ou “assunto”.
- source_word: λελάληκας
  choice: você proferiu
  rationale: Reflete o perfeito grego e o sentido de λαλέω, indicando algo que Daniel acaba de declarar e que permanece em foco.
