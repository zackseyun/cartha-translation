base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/050.yaml
  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: pt
  text: 'Então todo o povo voltou depressa. E os anciãos lhe disseram[a]: “Venha, sente-se no meio de nós e diga-nos, pois Deus lhe concedeu a dignidade de ancião.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a condição de ancião”, “a preeminência” ou “a posição de ancião”. O termo grego denota senioridade ou posição honrosa; aqui se refere à autoridade reconhecida, não à idade literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: voltou
  rationale: No contexto, indica que o povo inverteu o rumo e retornou; “voltou” é natural e preserva o sentido direcional.
- source_word: μετὰ σπουδῆς
  choice: depressa
  rationale: A expressão pode indicar pressa, empenho ou zelo; aqui modifica o movimento imediato do povo, favorecendo o sentido de rapidez.
- source_word: οἱ πρεσβύτεροι
  choice: os anciãos
  rationale: No cenário comunitário e judicial, designa líderes reconhecidos, não apenas homens idosos.
- source_word: Δεῦρο
  choice: Venha
  rationale: Funciona como convocação imperativa direta; “Venha” é corrente e digno em português.
- source_word: ἐν μέσῳ ἡμῶν
  choice: no meio de nós
  rationale: Preserva tanto a dimensão espacial quanto a inclusão de Daniel no centro da assembleia.
- source_word: ἀνάγγειλον ἡμῖν
  choice: diga-nos
  rationale: Expressa de modo natural a ordem para comunicar ou declarar algo à assembleia.
- source_word: τὸ πρεσβεῖον
  choice: a dignidade de ancião
  rationale: O termo denota senioridade, posição honrosa ou prerrogativa ligada aos anciãos. Como Daniel é jovem, a expressão comunica autoridade reconhecida sem sugerir idade avançada nem impor um cargo formal rígido.
theological_decisions:
- issue: Sentido de Deus conceder a Daniel τὸ πρεσβεῖον
  choice: Deus lhe concedeu a dignidade e autoridade próprias de um ancião reconhecido pela assembleia.
  alternative: Deus lhe concedeu a condição de ancião; Deus lhe concedeu preeminência.
  rationale: A formulação preserva a tensão narrativa de um jovem receber de Deus posição e autoridade associadas aos anciãos, sem converter a expressão em idade literal ou definir excessivamente um ofício institucional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Então” dá continuidade narrativa sem rigidez excessiva; o tratamento na terceira pessoa mantém naturalidade respeitosa.
