lexical_decisions:
- source_word: Διαχωρίσατε
  choice: Separem
  rationale: O imperativo plural ordena a separação física dos dois anciãos; “separem” é direto, natural e preserva o contexto judicial.
- source_word: ἀπ᾽ ἀλλήλων
  choice: um do outro
  rationale: A expressão recíproca indica que os dois devem ser mantidos separados entre si.
- source_word: μακράν
  choice: bem longe
  rationale: O advérbio reforça a distância exigida; “bem longe” comunica de modo natural que não deveriam conseguir combinar seus depoimentos.
- source_word: ἀνακρινῶ
  choice: interrogarei
  rationale: No contexto judicial, ἀνακρίνω designa examinar por meio de perguntas. “Interrogarei” expressa claramente esse procedimento sem acrescentar uma conclusão sobre culpa.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
