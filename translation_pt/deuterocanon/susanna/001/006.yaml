  text: and legal cases came to them from other cities[a].
translation:
  language: pt
  text: e causas judiciais vinham de outras cidades até eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e julgamentos vinham de outras cidades até eles”. O grego κρίσεις pode indicar decisões judiciais ou causas levadas a julgamento; aqui foi traduzido por “causas judiciais” para tornar claro o contexto forense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  choice: vinham
  rationale: O imperfeito de ἔρχομαι indica ação contínua ou habitual no passado; “vinham” preserva naturalmente esse aspecto em português.
- source_word: κρίσεις
  choice: causas judiciais
  rationale: No contexto, o termo designa questões ou processos levados a juízo, e não apenas decisões já proferidas. “Causas judiciais” explicita o sentido forense sem restringi-lo indevidamente.
- source_word: ἐξ ἄλλων πόλεων
  choice: de outras cidades
  rationale: Reproduz de modo direto e natural a ideia de procedência expressa pela preposição ἐκ.
- source_word: πρὸς αὐτούς
  choice: até eles
  rationale: Preserva a noção de movimento em direção às pessoas indicada por πρός com acusativo; “a eles” também seria possível, mas é menos idiomático com “vinham”.
