lexical_decisions:
- source_word: οὐκ ἦν οὐδεὶς
  choice: não havia ninguém
  rationale: A dupla negação grega expressa de modo enfático que nenhuma outra pessoa estava presente; esta formulação é natural em português.
- source_word: πλὴν
  choice: exceto
  rationale: Marca diretamente a exceção à afirmação anterior.
- source_word: οἱ δύο πρεσβύτεροι
  choice: os dois anciãos
  rationale: No contexto, refere-se aos anciãos investidos de posição reconhecida na comunidade, e não apenas a dois homens idosos.
- source_word: κεκρυμμένοι
  choice: estavam escondidos
  rationale: O particípio perfeito descreve o estado resultante de já terem se ocultado.
- source_word: παρατηροῦντες αὐτήν
  choice: a observavam
  rationale: Expressa a vigilância atenta dirigida a Susana sem tornar explícita, no texto principal, a nuance furtiva ou hostil que o verbo pode assumir no contexto.
