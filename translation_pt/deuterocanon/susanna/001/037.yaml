  yaml_path: translation/deuterocanon/susanna/001/037.yaml
  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: pt
  text: E, enquanto dávamos a volta pelo jardim cercado, vimos esta mulher deitada com um homem; então paramos e ficamos observando os dois conversarem um com o outro,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: enquanto dávamos a volta pelo jardim cercado
  rationale: O particípio indica uma ação em andamento. Neste contexto, στάδιον designa o recinto ajardinado; “jardim cercado” comunica naturalmente a ideia espacial sem confundi-lo com uma unidade de medida ou pista esportiva.
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: deitada com um homem
  rationale: ἀναπαύομαι pode significar descansar ou reclinar-se. “Deitada com” preserva a sugestão acusatória do depoimento sem afirmar explicitamente uma relação sexual que o grego não declara.
- source_word: στάντες ἐθεωροῦμεν
  choice: então paramos e ficamos observando
  rationale: Reproduz a sequência do particípio aoristo e o aspecto durativo do imperfeito ἐθεωροῦμεν.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: conversarem um com o outro
  rationale: ὁμιλέω aqui denota conversar ou falar em companhia; evita atribuir ao verbo, por si só, um sentido sexual.
theological_decisions:
- issue: Natureza do encontro alegado
  choice: Manter a insinuação em “deitada com um homem”, mas traduzir ὁμιλοῦντας como “conversarem”.
  alternative: Explicitar adultério ou relação sexual.
  rationale: O testemunho é acusatório, porém o verso descreve postura e conversa; não convém transformar a insinuação narrativa numa afirmação mais explícita do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação mantém a continuidade sintática do depoimento para o versículo seguinte.
