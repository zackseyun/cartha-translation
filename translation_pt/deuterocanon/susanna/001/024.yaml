base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: pt
  text: 'Susana gemeu e disse: “Estou encurralada por todos os lados.[a] Pois, se eu fizer isso, será a morte para mim; mas, se não fizer, não escaparei das mãos de vocês.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estou em aperto por todos os lados.”'
    reason: lexical_alternative
  - marker: b
    text: A expressão “das mãos de vocês” indica estar sob o poder ou domínio deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: gemeu
  rationale: O verbo expressa um suspiro profundo ou gemido de aflição; “gemeu” conserva o peso emocional da cena.
- source_word: Στενά μοι πάντοθεν
  choice: Estou encurralada por todos os lados
  rationale: A expressão comunica que Susana está sem saída, pressionada de todas as direções. A formulação é natural em português e preserva a imagem de confinamento.
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: Pois, se eu fizer isso
  rationale: Mantém o demonstrativo sem explicitar além do que o grego afirma e reproduz diretamente o primeiro lado do dilema.
- source_word: θάνατός μοί ἐστιν
  choice: será a morte para mim
  rationale: Preserva a formulação nominal, abrupta e enfática do grego, ao mesmo tempo que o futuro soa natural como consequência da condição em português.
- source_word: ἐὰν μὴ πράξω
  choice: mas, se não fizer
  rationale: Repete o verbo da primeira condição, como no grego, sem acrescentar a ideia interpretativa de recusa.
- source_word: οὐκ ἐκφεύξομαι
  choice: não escaparei
  rationale: Conserva o valor futuro e a afirmação direta de que ela não conseguirá livrar-se deles.
- source_word: τὰς χεῖρας ὑμῶν
  choice: das mãos de vocês
  rationale: Mantém a metáfora concreta do texto grego, compreensível em português como referência ao poder ou domínio dos interlocutores.
theological_decisions:
- issue: Representação do dilema de Susana sem atenuar o contexto coercitivo
  choice: Conservar a alternativa extrema entre fazer o que lhe exigem e permanecer nas mãos dos homens
  alternative: Parafrasear as consequências como desonra social ou simples perigo jurídico
  rationale: O grego apresenta uma coerção direta e sem saída. A tradução mantém a gravidade moral e narrativa sem introduzir consequências específicas que o versículo não nomeia.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural ὑμῶν e conserva tanto a estrutura equilibrada do dilema quanto a metáfora concreta das “mãos”.
