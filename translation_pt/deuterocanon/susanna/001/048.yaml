base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/048.yaml
  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
translation:
  language: pt
  text: 'Ele, porém, pôs-se de pé no meio deles e disse: “Vocês são assim tão insensatos, filhos de Israel?[a] Sem investigar o caso nem apurar claramente os fatos,[b] condenaram uma filha de Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Vocês são assim tão tolos, filhos de Israel?”. A repreensão grega Οὕτως μωροί admite tanto “insensatos” como “tolos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sem fazer uma investigação nem verificar o que estava claro”. A expressão grega tem tom judicial e destaca que eles condenaram Susana sem examinar devidamente o caso.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: pôs-se de pé
  rationale: O particípio aoristo de ἵστημι descreve a ação concreta que precede a fala; a forma finita é natural em português e mantém a imagem de ele se levantar ou tomar posição.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Reproduz de modo claro e idiomático o cenário público e a força confrontadora da expressão grega.
- source_word: Οὕτως μωροί
  choice: Vocês são assim tão insensatos
  rationale: Preserva a repreensão incisiva e o valor intensificador de Οὕτως, formulando em português natural a pergunta retórica implícita no contexto.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: filhos de Israel
  rationale: Mantém o vocativo masculino explícito e o contraste retórico com “uma filha de Israel” no fim do versículo.
- source_word: ἀνακρίναντες
  choice: investigar o caso
  rationale: O verbo tem sentido judicial de examinar ou conduzir uma investigação; “o caso” explicita apenas o referente contextual, sem impor um procedimento técnico específico.
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: apurar claramente os fatos
  rationale: Comunica tanto a obtenção de conhecimento seguro quanto a ideia de clareza expressa por σαφές, dentro do tom judicial da passagem.
- source_word: κατεκρίνατε
  choice: condenaram
  rationale: Expressa diretamente o ato judicial já consumado e funciona naturalmente na pergunta acusatória em português.
- source_word: θυγατέρα Ἰσραήλ
  choice: uma filha de Israel
  rationale: Conserva a expressão pactual no singular e o contraste deliberado entre os homens interpelados e Susana.
theological_decisions:
- issue: Designações pactuais marcadas por gênero
  choice: filhos de Israel / uma filha de Israel
  alternative: israelitas / uma mulher israelita
  rationale: O grego estabelece um contraste retórico explícito entre o plural masculino e o singular feminino. Preservá-lo evita neutralizar uma dimensão relevante da repreensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala preserva a severidade da repreensão e o tom judicial sem recorrer a linguagem excessivamente técnica ou arcaica.
