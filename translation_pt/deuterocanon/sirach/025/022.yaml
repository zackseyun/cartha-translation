  text: For because of her there is reproach and shame[a], when a wife supports her husband.
translation:
  language: pt
  text: Pois, por causa dela, há desonra e vergonha, quando a esposa sustenta o marido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando uma mulher provê o sustento do marido”. O hebraico מְכַלְכֶּלֶת e o paralelo grego ἐπιχορηγῇ podem indicar prover ou manter alguém materialmente.'
    reason: Registra a alternativa lexical e explicita o sentido material possível do verbo sem inseri-lo à força no texto principal.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior sem tornar a relação causal mais pesada do que no hebraico.
- source_word: בַעֲדָהּ
  choice: por causa dela
  rationale: Expressa a causa ou ocasião indicada pela preposição com sufixo feminino, preservando a referência pronominal do hebraico.
- source_word: חֶרְפָּה
  choice: desonra
  rationale: Comunica a dimensão pública e social de censura, afronta ou perda de honra, mantendo-a distinta de בֹּשֶׁת.
- source_word: וּבֹשֶׁת
  choice: e vergonha
  rationale: É a correspondência direta e natural para o termo hebraico ligado à vergonha e humilhação.
- source_word: אִשָּׁה
  choice: a esposa
  rationale: Embora possa significar 'mulher', a menção imediata ao marido determina o sentido conjugal neste contexto.
- source_word: מְכַלְכֶּלֶת
  choice: sustenta
  rationale: O particípio de כלכל indica prover, manter ou sustentar, especialmente em sentido material; 'sustenta' é conciso e mantém essa amplitude.
- source_word: אֶת בַּעֲלָהּ
  choice: o marido
  rationale: בעל tem aqui inequivocamente o sentido conjugal, confirmado pela relação expressa na oração.
theological_decisions:
- issue: Se a tradução deve explicar ou suavizar o juízo social patriarcal expresso pelo versículo
  choice: Conservar diretamente a afirmação de desonra e vergonha
  alternative: Acrescentar no texto que se trata de uma convenção social antiga ou reformular a frase para atenuá-la
  rationale: A tradução deve preservar a retórica e a tensão ética do texto antigo sem endossá-las por comentário inserido nem intensificar sua condenação.
- issue: Sentido de אִשָּׁה no contexto
  choice: esposa
  alternative: mulher
  rationale: A expressão 'o marido' restringe contextualmente o substantivo à relação matrimonial.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o encadeamento explicativo e a referência feminina do hebraico; 'sustenta' evita tanto eufemismo quanto intensificação do juízo social antigo.
