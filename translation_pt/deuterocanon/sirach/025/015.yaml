translation:
  language: pt
  text: Não há cabeça superior à cabeça da serpente[a], nem há ira superior à ira do inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não há veneno como o veneno da serpente». Em sentido literal, o grego diz «cabeça [...] cabeça da serpente»; a tradução preserva essa imagem em vez de substituí-la por uma paráfrase interpretativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: cabeça
  rationale: O grego repete concretamente «cabeça». Embora a expressão possa aludir por metonímia ao veneno ou ao poder de ataque da serpente, a tradução preserva a imagem e deixa essa interpretação para a nota.
- source_word: ὄφις
  choice: serpente
  rationale: «Serpente» é uma equivalência natural e digna em português, adequada à linguagem proverbial; «cobra» seria possível, mas é um pouco mais específico e coloquial.
- source_word: θυμός
  choice: ira
  rationale: Neste contexto, o termo indica hostilidade intensa. «Ira» conserva a força proverbial e o paralelismo melhor do que o mais brando «raiva» ou o mais explosivo «furor».
- source_word: ἐχθρός
  choice: inimigo
  rationale: É o equivalente corrente e direto, preservando a dimensão relacional e hostil do grego.
- source_word: ὑπέρ
  choice: superior a
  rationale: Na construção comparativa, indica aquilo que excede ou sobrepuja. «Superior a» expressa isso de modo claro e ainda mantém a estrutura elevada do provérbio.
