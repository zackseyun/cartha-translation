translation:
  language: pt
  text: Não se deixe cativar pela beleza de uma mulher e não a deseje pelo que ela possui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e não deseje ardentemente uma mulher”. O testemunho hebraico é mais específico e adverte contra desejá-la por causa do que ela possui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיֹפִי אִשָּׁה
  choice: Não se deixe seduzir pela beleza de uma mulher
  rationale: Embora o hebraico diga literalmente “não caia”, a construção com “na/pela beleza” adverte contra deixar-se cativar. “Não se deixe seduzir” comunica esse valor idiomático em português natural, sem introduzir a ideia mais específica de uma armadilha.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O termo pode designar “mulher” ou “esposa”, mas a ausência de contexto conjugal favorece o sentido mais amplo.
- source_word: וְעַל יֵש לָהּ
  choice: pelo que ela possui
  rationale: A expressão hebraica, compacta, indica aquilo que ela tem ou que lhe pertence. Esta formulação preserva o motivo da cobiça sem restringi-lo apenas a dinheiro ou bens materiais.
- source_word: לֹא תַּחְמוֹד
  choice: não deseje
  rationale: O verbo חמד pode significar desejar ou cobiçar. “Deseje” conserva a amplitude do termo no contexto, que pode envolver atração interessada, sem reduzi-lo exclusivamente à luxúria sexual.
theological_decisions:
- issue: Texto hebraico mais específico em contraste com o paralelo grego mais curto
  choice: 'Seguir o hebraico: “não deseje uma mulher pelo que ela possui”'
  alternative: “não cobice uma mulher” ou “não deseje ardentemente uma mulher”
  rationale: O hebraico sobrevivente, de alta confiança, explicita o motivo do desejo mediante a referência ao que a mulher possui. O paralelo grego omite essa especificação; por isso, sua leitura é registrada em nota, sem substituir o testemunho hebraico no texto principal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil. A tradução mantém a advertência sapiencial e a diferença textual entre o hebraico e o paralelo grego.
