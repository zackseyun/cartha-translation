  source_fidelity: A segunda oração hebraica preserva a referência a “o que ela tem/lhe pertence” (וְעַל יֵשׁ לָהּ), ausente no paralelo grego. A redação principal conserva apropriadamente essa especificação. Contudo, “seduzir” pode sugerir uma ação intencional da mulher, não expressa pelo hebraico; “cativar” mantém melhor a imagem de ser vencido ou atraído pela beleza.
  naturalness: “Não se deixe cativar pela beleza de uma mulher” é natural, moderno e amplo em português. “Não a deseje pelo que ela possui” evita a repetição desnecessária de “uma mulher”, preservando a referência implícita da segunda oração e a motivação indicada no hebraico.
  terminology: “Mulher” é adequado para אִשָּׁה sem contexto conjugal. “Deseje” conserva a amplitude de חמד; a nota registra de modo adequado a formulação mais breve do grego, sem torná-la indevidamente mais sexualizada.
