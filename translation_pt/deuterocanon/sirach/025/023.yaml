  text: 'Slack hands and failing knees: a wife who does not bless her husband[a].'
translation:
  language: pt
  text: 'Mãos sem força e joelhos vacilantes: a esposa que não abençoa o marido[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não considera feliz o marido”. A expressão também pode ter o sentido de “não faz o marido considerar-se feliz” ou “não o torna feliz ou afortunado”. O texto grego diz: “não considera feliz o seu marido”.'
    reason: 'Alternativa lexical: o verbo hebraico pode significar abençoar, declarar feliz ou, em sentido resultativo, tornar feliz/afortunado.'
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: mãos sem força
  rationale: Preserva a imagem corporal de mãos frouxas ou enfraquecidas e comunica de modo natural a ideia de incapacidade ou desânimo.
- source_word: וְכִשְׁלוֹן בִּרְכַּיִם
  choice: e joelhos vacilantes
  rationale: O substantivo deriva da ideia de tropeçar ou falhar; “joelhos vacilantes” mantém a metáfora de joelhos que cedem, confirmada pelo paralelo grego.
- source_word: אִשָּׁה
  choice: a esposa
  rationale: Embora possa significar “mulher”, a referência imediata ao marido determina aqui a relação conjugal.
- source_word: לֹא תְאַשֵּׁר
  choice: não traz felicidade
  rationale: Expressa em português corrente o possível sentido causativo de não tornar alguém feliz ou afortunado, sem limitar o verbo ao ato religioso de abençoar. A nota conserva as demais possibilidades lexicais.
- source_word: בַּעֲלָהּ
  choice: ao marido
  rationale: No contexto conjugal, “marido” é o sentido claro; “senhor” introduziria uma conotação inadequada.
theological_decisions:
- issue: Relação entre o texto hebraico e a forma grega mais extensa
  choice: Traduzir como texto principal apenas a linha hebraica preservada, usando o grego para confirmar a estrutura comparativa e as imagens corporais.
  alternative: 'Incorporar a descrição grega adicional da esposa má: coração abatido, rosto sombrio e ferida do coração.'
  rationale: O testemunho hebraico desta linha tem alta confiança e deve reger a tradução. O material adicional do grego não deve ser importado para o texto principal, embora o paralelo ajude a confirmar seu sentido.
- issue: Sentido de לֹא תְאַשֵּׁר
  choice: não traz felicidade ao marido
  alternative: não abençoa o marido; não considera feliz o marido
  rationale: A formulação principal oferece uma leitura natural do possível valor resultativo do piel, enquanto a nota preserva a ambiguidade entre causar felicidade, declarar feliz e abençoar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mãos sem força” evita a possível conotação moral de “mãos frouxas”; “joelhos vacilantes” conserva a imagem poética. A inserção discreta de “assim é” torna explícita em português a relação nominal e comparativa sugerida pela construção hebraica, sem acrescentar conteúdo interpretativo substancial.
