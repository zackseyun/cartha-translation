  text: If you did not gather in your youth[a], how then would you find anything in your old age?
translation:
  language: pt
  text: Se você não ajuntou[a] na juventude, como encontraria na velhice?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma verbal grega neste testemunho é textualmente difícil; a tradução segue o sentido provável de «ajuntar» ou «reunir».
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  choice: na juventude
  rationale: Expressa naturalmente a etapa da vida e mantém o paralelismo temporal com «na velhice».
- source_word: οὐ συναγίοχας
  choice: você não ajuntou
  rationale: A forma grega transmitida é incomum e possivelmente problemática; «ajuntou» comunica o provável sentido de reunir ou acumular sem especificar indevidamente o objeto.
- source_word: καὶ πῶς ἂν εὕροις
  choice: como encontrará
  rationale: A pergunta retórica apresenta a consequência esperada. Em português, o futuro do indicativo comunica com naturalidade a impossibilidade prática sugerida, enquanto «como» preserva a força interrogativa.
- source_word: ἐν τῷ γήρᾳ σου
  choice: na velhice
  rationale: Mantém a referência à etapa da vida e o equilíbrio com «na juventude»; o possessivo fica naturalmente implícito em português após «você».
theological_decisions:
- issue: Objeto não expresso de «ajuntar/encontrar»
  choice: Manter o objeto implícito.
  alternative: Acrescentar «sabedoria», «provisões» ou «alguma coisa».
  rationale: O grego não declara o objeto. Preservar a elipse mantém a amplitude proverbial e evita impor uma interpretação sapiencial ou material específica.
- issue: Incerteza textual e lexical da forma συναγίοχας
  choice: Traduzir pelo sentido provável «ajuntou» e registrar a dificuldade em nota.
  alternative: Verter como «reuniu», «acumulou» ou tentar reproduzir literalmente a forma problemática.
  rationale: A tradução deve tornar inteligível o sentido mais provável sem ocultar que a forma transmitida é incomum e possivelmente corrompida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Ajuntar» conserva o tom concreto e proverbial. A construção omite deliberadamente o objeto, como no grego.
