  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
translation:
  language: pt
  text: Todo mal é pequeno em comparação com o mal de uma mulher[a]; que a sorte de um pecador caia sobre ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Pequeno é o mal diante do mal de uma mulher.” O hebraico é conciso; o paralelo grego explicita “todo mal”. Ambas as fontes apresentam uma comparação.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração final também pode ser entendida como predição: “a sorte de um pecador cairá sobre ela”. O paralelo grego favorece o sentido de desejo ou imprecação adotado no texto.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט רָעָה
  choice: Todo mal é pequeno
  rationale: מְעַט comunica pequenez ou pouca importância em uma comparação. A formulação portuguesa segue o sentido proverbial, com apoio do paralelo grego μικρὰ πᾶσα κακία; a nota registra uma forma mais próxima da concisão hebraica.
- source_word: רָעָה / כְרָעַת
  choice: mal / em comparação com o mal de
  rationale: רָעָה pode abranger maldade, dano ou desgraça. “Mal” preserva essa amplitude e a dureza da afirmação. O prefixo כְּ introduz a comparação, expressa naturalmente em português por “em comparação com”.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo singular não especifica “esposa”. A tradução mantém o gênero e o número do hebraico, sem suavizar nem ampliar a afirmação culturalmente áspera.
- source_word: גוֹרַל
  choice: sorte
  rationale: גוֹרַל designa literalmente a sorte lançada e, por extensão, a porção ou destino atribuído a alguém. “Sorte” conserva a imagem e corresponde ao grego κλῆρος.
- source_word: חוֹטֵא
  choice: um pecador
  rationale: O particípio substantivado indica genericamente uma pessoa que peca; “um pecador” é a forma corrente e fiel em português.
- source_word: יִפּוֹל עָלֶיהָ
  choice: que ... caia sobre ela
  rationale: O yiqtol pode ter força volitiva. O optativo grego ἐπιπέσοι reforça a leitura como desejo ou imprecação, bem expressa por “que ... caia”.
theological_decisions:
- issue: Força da oração verbal final
  choice: 'Desejo ou imprecação: “que a sorte de um pecador caia sobre ela”'
  alternative: 'Predição: “a sorte de um pecador cairá sobre ela”'
  rationale: A forma hebraica admite valor modal, e o optativo do paralelo grego favorece fortemente a leitura volitiva. A alternativa permanece possível em termos estritamente morfológicos e é registrada em nota.
- issue: Linguagem marcada por gênero
  choice: Mantida a expressão singular “uma mulher”
  alternative: “uma esposa” ou o plural “as mulheres”
  rationale: O hebraico diz אִשָּׁה no singular, sem elemento que exija o sentido mais estreito de “esposa”. A tradução não neutraliza a linguagem nem amplia a referência para o plural.
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura proverbial clara. “Em comparação com” torna explícita a relação comparativa sem atenuar a afirmação contundente do original. A colocação dos marcadores segue os pontos exatos de ambiguidade lexical e modal.
