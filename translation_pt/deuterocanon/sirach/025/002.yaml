  text: 'Three things my soul has hated[a], and I am greatly distressed by their lives:'
translation:
  language: pt
  text: 'Três coisas a minha alma odeia[a], e a vida delas me causa profunda aflição:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego diverge profundamente neste ponto: “a concórdia entre irmãos, a amizade entre vizinhos e uma esposa e um marido que vivem em harmonia”. O hebraico e o grego parecem refletir formas textuais diferentes aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ
  choice: Três coisas
  rationale: O numeral introduz uma lista; acrescentar “coisas” torna a frase natural em português e prepara a referência plural seguinte.
- source_word: שָׂנְאָה
  choice: odeia
  rationale: Embora a forma hebraica possa ser lida como ação já estabelecida, o presente português expressa com naturalidade a aversão duradoura própria do contexto sapiencial.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Mantém a expressão concreta e afetiva do hebraico, sem reduzi-la simplesmente a “eu”.
- source_word: וְצַר לִי מְאֹד
  choice: me causa profunda aflição
  rationale: Comunica de modo atual e digno a forte angústia ou vexação pessoal expressa pelo hebraico.
- source_word: בְּחַיֵּיהֶם
  choice: a vida delas
  rationale: Reflete de perto o hebraico “na/pela vida delas”, preservando a possibilidade de referência à vida ou conduta sem explicitar interpretativamente “modo de viver”.
theological_decisions:
- issue: Divergência textual entre o hebraico e o grego em Eclesiástico 25:2
  choice: Traduzir no texto principal a cláusula hebraica preservada e registrar a forma grega em nota.
  alternative: 'O grego apresenta três bens sociais: “a concórdia entre irmãos, a amizade entre os próximos e a mulher e o marido que vivem em harmonia”.'
  rationale: O hebraico sobrevivente é a fonte principal, mas a divergência grega é substancial e altera por completo o sentido; por isso, deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva “a minha alma” e evita transformar de modo inequívoco “a vida delas” em “o modo de viver delas”.
