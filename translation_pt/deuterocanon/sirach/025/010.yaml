  text: Blessed is the one who has found wisdom[b][a], and the one who speaks in the ears of those who hear.
translation:
  language: pt
  text: Feliz quem encontrou discernimento e quem fala aos ouvidos dos que escutam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode significar “relata”, “expõe” ou “explica”; assim, a expressão pode ser entendida como “quem expõe aos que escutam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Expressa a condição invejável celebrada nas máximas sapienciais, em português atual e digno, sem sugerir necessariamente uma bênção pronunciada.
- source_word: εὗρε
  choice: encontrou
  rationale: Reproduz naturalmente o aoristo como ação realizada, deixando que o contexto comunique o estado alcançado.
- source_word: φρόνησιν
  choice: discernimento
  rationale: Preserva a ideia de compreensão prática e juízo sensato própria de φρόνησις, sem a confundir automaticamente com termos gregos mais gerais para sabedoria.
- source_word: διηγούμενος
  choice: fala
  rationale: O particípio pode indicar relatar, expor ou discorrer. “Fala” mantém a frase natural e evita especificar um objeto ou modo de exposição que o grego não explicita; a amplitude lexical é registrada em nota.
- source_word: εἰς ὦτα
  choice: aos ouvidos
  rationale: Conserva a imagem concreta e a direção expressa por εἰς, mas usa uma construção idiomática em português.
- source_word: ἀκουόντων
  choice: dos que escutam
  rationale: Mantém a forma participial e sugere ouvintes receptivos sem transformar explicitamente o ato de ouvir em obediência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e sapiencial. “Feliz” evita a solenidade menos corrente de “bem-aventurado”; “discernimento” mantém o aspecto prático de φρόνησις. A imagem concreta de falar “aos ouvidos” foi preservada sem reproduzir de modo artificial a preposição grega.
