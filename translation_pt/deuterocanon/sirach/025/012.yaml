base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: pt
  text: O temor do Senhor supera tudo[a]; a quem será comparado aquele que se apega a ele[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está acima de tudo”. A expressão grega indica superioridade sobre todas as coisas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquele que o possui”. O verbo grego pode indicar tanto segurar com firmeza como conservar em sua posse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: o temor do Senhor
  rationale: Preserva o termo grego φόβος e a expressão teológica característica da literatura sapiencial, sem reduzi-la apenas a “reverência”.
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: supera tudo
  rationale: Expressa com naturalidade a superioridade sobre todas as coisas indicada por ὑπὲρ πᾶν e pelo verbo ὑπερέβαλεν. O presente comunica em português o valor proverbial da afirmação.
- source_word: ὁ κρατῶν αὐτοῦ
  choice: aquele que se apega a ele
  rationale: κρατέω com o genitivo pode indicar segurar firmemente, conservar ou possuir. “Apega-se a ele” conserva a ideia de firme adesão, e “ele” retoma “temor”.
- source_word: τίνι ὁμοιωθήσεται
  choice: a quem será comparado
  rationale: Reproduz a pergunta retórica e o futuro passivo do grego em português claro e atual.
theological_decisions:
- issue: Manter “temor” ou suavizar como “reverência”
  choice: o temor do Senhor
  alternative: a reverência ao Senhor
  rationale: “Temor” preserva a força e a tensão teológica de φόβος, além de manter a formulação tradicional da literatura sapiencial.
- issue: Valor temporal do aoristo ὑπερέβαλεν
  choice: supera
  alternative: superou
  rationale: A sentença apresenta uma verdade sapiencial geral; o presente proverbial é a forma mais natural de expressá-la em português.
- issue: Referência representativa masculina de ὁ κρατῶν
  choice: aquele que se apega a ele
  alternative: quem se apega a ele
  rationale: A formulação mantém o singular masculino gramatical do particípio grego sem limitar explicitamente a aplicação do provérbio aos homens.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém o paralelismo conciso e a pergunta retórica do grego.
