base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/020.yaml
  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: pt
  text: Como uma subida arenosa[a] sob os pés de um idoso, assim é uma esposa faladora[b] para um homem manso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico חוּץ é difícil neste ponto; o paralelo grego diz «arenosa», provavelmente preservando o sentido da imagem: terreno instável para um homem idoso.'
    reason: textual_variant
  - marker: b
    text: Literalmente, «uma esposa de língua». O grego traz «uma mulher dada a falar»; também pode ser entendido como «uma esposa de língua afiada».
    reason: lexical_alternative
  - marker: c
    text: Ou «um homem tranquilo». O hebraico pode significar «terno» ou «manso»; o paralelo grego usa uma palavra que também pode significar «tranquilo» ou «pacífico».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה
  choice: Como uma subida
  rationale: O substantivo derivado de עלה designa uma subida ou caminho ascendente; o paralelo grego ἀνάβασις confirma a imagem de subir uma encosta.
- source_word: חוּץ
  choice: arenosa
  rationale: A forma hebraica é difícil neste contexto. O paralelo grego traz ἀμμώδης, «arenosa», preservando provavelmente a imagem de terreno instável.
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: sob os pés de um idoso
  rationale: יָשִׁישׁ indica uma pessoa de idade avançada, não necessariamente alguém que ocupa o cargo de ancião. A formulação mantém de modo natural a imagem do apoio inseguro.
- source_word: אֵשֶׁת לָשׁוֹן
  choice: uma esposa de língua afiada
  rationale: A expressão significa literalmente «mulher/esposa de língua». O grego γλωσσώδης pode indicar alguém falador ou dado a falar; no contexto negativo do provérbio, «de língua afiada» comunica a fala que fere ou perturba, sem ocultar a alternativa mais literal.
- source_word: לְאִישׁ רַךְ
  choice: para um homem manso
  rationale: רַךְ significa literalmente «macio, terno» e, aplicado ao caráter, pode indicar mansidão. O grego ἡσύχῳ aponta para «tranquilo» ou «pacífico»; «manso» preserva o contraste de temperamentos sem sugerir necessariamente covardia.
theological_decisions:
- issue: Uso de termos marcados por gênero em um provérbio sapiencial
  choice: esposa ... homem
  alternative: mulher ... homem; cônjuge ... pessoa
  rationale: O hebraico emprega אֵשֶׁת e אִישׁ, e o grego também mantém os termos femininos e masculinos. A tradução conserva a forma concreta e o contexto social do provérbio, sem neutralizar o gênero.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade no Brasil. «Idoso» evita que «ancião» seja entendido como título. As notas preservam a incerteza textual em חוּץ e a amplitude semântica das expressões relativas à fala e ao temperamento.
