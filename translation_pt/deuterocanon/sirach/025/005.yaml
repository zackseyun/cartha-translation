  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: pt
  text: Se você não os desejou na juventude[a], como os alcançará na velhice?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não especifica o referente do pronome plural “os”. O paralelo grego tem uma formulação diferente, sobre julgamento e entendimento de conselho entre os anciãos; por isso, não é possível identificar o referente com segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa pela oração inicial.
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: na sua juventude
  rationale: Forma portuguesa natural para o período da juventude, em contraste com a velhice.
- source_word: לֹא חֲפַצְתָּם
  choice: você não os desejou
  rationale: Preserva o sentido principal de חפץ, ‘desejar, ter prazer em’, e mantém sem explicitação o objeto plural indicado pelo sufixo.
- source_word: אֵיךְ
  choice: como
  rationale: Introduz a pergunta retórica sem suavizar sua força.
- source_word: תַּשִּׁיגֵם
  choice: os alcançará
  rationale: השיג denota alcançar ou obter; ‘alcançar’ funciona naturalmente com qualidades ou realizações abstratas.
- source_word: בְּזִקְנוֹתֶיךָ
  choice: na velhice
  rationale: Expressão idiomática e clara, que mantém o contraste temporal com a juventude.
theological_decisions:
- issue: Antecedente não expresso do objeto plural
  choice: Manter o pronome plural ‘os’, sem identificar explicitamente seu referente.
  alternative: Traduzir o referente como ‘a sabedoria’ ou ‘essas coisas’.
  rationale: O hebraico contém apenas um sufixo pronominal plural. Embora o paralelo grego aponte para discernimento e compreensão do conselho, especificar ‘sabedoria’ resolveria uma ambiguidade que o texto hebraico preserva.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla compreensão internacional e boa legibilidade brasileira. ‘Desejou’ segue mais de perto o hebraico do que ‘buscou’; a ambiguidade do objeto plural foi preservada.
