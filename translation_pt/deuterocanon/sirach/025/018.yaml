  text: Her husband sits among his companions[a], and without sense he groans.
translation:
  language: pt
  text: O marido dela se senta entre seus companheiros[a] e, sem entender, geme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “O marido dela se reclinará entre seus companheiros e, ao ouvir, gemeu amargamente.” Essa versão diverge de modo significativo do hebraico preservado, sobretudo na segunda parte do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: o marido dela
  rationale: Neste contexto, בַּעַל com sufixo feminino singular designa o marido; a tradução evita possibilidades lexicais como “senhor” ou “dono”, inadequadas aqui.
- source_word: בֵּין רֵעִים
  choice: entre seus companheiros
  rationale: רֵעִים pode indicar amigos ou companheiros. “Companheiros” preserva o cenário social sem afirmar um grau específico de intimidade.
- source_word: יֵשֵׁב
  choice: se senta
  rationale: Segue diretamente o verbo hebraico “sentar-se”. O grego traz “se reclinará”, possivelmente em contexto de refeição, mas não substitui o testemunho hebraico principal.
- source_word: וּבְלֹא טַעֲמוֹ
  choice: sem entender
  rationale: טַעַם pode exprimir senso, discernimento ou entendimento. Nesta construção, “sem entender” comunica em português corrente a falta de compreensão, preservando a possível ideia de não saber a razão.
- source_word: יִתְאַנָּח
  choice: geme
  rationale: O verbo expressa manifestação audível de aflição; “geme” mantém intensidade maior que “suspira”, sem acrescentar o advérbio “amargamente” encontrado apenas no grego.
theological_decisions:
- issue: Prioridade do hebraico diante da divergência com o grego
  choice: 'O texto principal segue o hebraico preservado: o marido se senta entre companheiros e geme sem entender.'
  alternative: O paralelo grego diz que ele se reclinará entre os seus e, ao ouvir, gemeu amargamente.
  rationale: Como há testemunho hebraico de alta confiança, ele rege o texto principal. A divergência significativa do grego, sobretudo no segundo membro, é conservada em nota em vez de ser harmonizada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a estrutura concisa do hebraico e registra em nota a divergência textual grega.
