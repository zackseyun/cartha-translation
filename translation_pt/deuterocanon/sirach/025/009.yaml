base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: pt
  text: Feliz o homem que vive com uma esposa sensata[a], que não tropeçou ao falar[b] e que não serviu a alguém indigno dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma esposa prudente” ou “uma esposa de bom entendimento”; o grego descreve uma esposa dotada de compreensão prática.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não tropeçou com a língua”; é uma imagem para não falhar no falar.
    reason: lexical_alternative
  - marker: c
    text: Ou “não foi escravizado por alguém indigno dele”; o verbo grego pode expressar serviço ou sujeição escrava.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Expressa de modo natural, em português contemporâneo, a condição afortunada elogiada pela literatura sapiencial, sem limitar o sentido a um estado emocional.
- source_word: συνοικῶν
  choice: vive com
  rationale: O particípio indica convivência no mesmo lar; a formulação é corrente e preserva o sentido doméstico e conjugal.
- source_word: γυναικὶ συνετῇ
  choice: uma esposa sensata
  rationale: O contexto de convivência doméstica favorece “esposa”; συνετή denota entendimento prático, discernimento e prudência, bem expressos por “sensata”.
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: não tropeçou com a língua
  rationale: Preserva a metáfora corporal do grego para uma falha na fala, sem especificar indevidamente a natureza da transgressão verbal.
- source_word: ἐδούλευσεν
  choice: serviu
  rationale: O verbo pode indicar serviço ou sujeição escrava. “Serviu” mantém aqui a relação pessoal sem afirmar além do texto que se trate necessariamente de escravidão formal.
- source_word: ἀναξίῳ αὐτοῦ
  choice: a alguém indigno dele
  rationale: Reproduz a avaliação comparativa do grego sem introduzir linguagem mais rígida de classe ou posição, como “inferior” ou “abaixo dele”.
theological_decisions:
- issue: Masculino singular na declaração sapiencial
  choice: o homem
  alternative: a pessoa
  rationale: Os artigos e pronomes gregos estão no masculino singular, e a referência conjugal a uma esposa confirma que a figura descrita no versículo é masculina.
- issue: Força de δουλεύω
  choice: serviu
  alternative: foi escravizado por
  rationale: A forma verbal admite a ideia forte de sujeição ou escravidão, mas o contexto não determina com segurança uma condição jurídica de escravo; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura tríplice do grego foi mantida, e os marcadores foram colocados junto às expressões a que de fato correspondem.
