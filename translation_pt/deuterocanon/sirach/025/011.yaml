  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: pt
  text: Feliz é o marido de uma mulher sensata e que não ara com boi e jumento juntos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem provavelmente alude a Deuteronômio 22:10, que proíbe arar com boi e jumento juntos; aqui ela funciona proverbialmente para representar uma parelha incompatível.
    reason: cross_reference
  - marker: b
    text: 'O grego traz uma leitura substancialmente diferente: “Como é grande quem encontrou a sabedoria, mas ninguém está acima de quem teme o Senhor.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula sapiencial expressa uma condição digna de admiração e desejo. “Feliz” é natural em português atual e evita acrescentar conotações que não são exigidas pelo termo.
- source_word: בַעַל אִשָּׁה
  choice: o marido de uma mulher
  rationale: A expressão hebraica é idiomática para “marido”; uma tradução literal com ideia de posse seria enganosa em português.
- source_word: מַשְׁכָּלֶת
  choice: sensata
  rationale: O termo indica discernimento e bom senso prático. “Sensata” comunica isso com naturalidade no contexto da vida conjugal.
- source_word: חוֹרֵשׁ
  choice: lavra
  rationale: O particípio se refere ao ato de arar ou lavrar a terra. “Lavra” preserva a imagem agrícola e se encaixa com fluidez na frase.
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: com boi e jumento juntos
  rationale: Tradução direta que mantém os dois animais e o advérbio “juntos”, preservando a alusão a Deuteronômio 22:10 sem explicá-la dentro do texto.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Seguir o hebraico no texto principal e registrar a leitura grega em nota.
  alternative: 'Adotar no texto principal a leitura grega: “Como é grande quem encontrou a sabedoria, mas ninguém está acima de quem teme o Senhor.”'
  rationale: O hebraico existente é a fonte primária adotada para esta passagem. Como o grego preserva um dito inteiramente diferente, a divergência não deve ser harmonizada nem ocultada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa “Feliz o marido” conserva o tom proverbial. A oração relativa foi ligada diretamente ao marido para deixar claro que ambas as descrições se referem ao mesmo homem, sem explicitar além do hebraico o sentido figurado da parelha incompatível.
