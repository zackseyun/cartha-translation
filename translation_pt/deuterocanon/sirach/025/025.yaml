base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: pt
  text: Uma esposa má é lepra para seu marido[a]; que ele a expulse de sua casa[b][c], e ele ficará curado de sua lepra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico צָרַעַת, tradicionalmente traduzido por “lepra”, abrange nas Escrituras diferentes afecções graves da pele, não necessariamente a hanseníase moderna.
    reason: cultural_note
  - marker: b
    text: 'Ou: “que ele se divorcie dela”. Mais literalmente, o hebraico diz “que ele a expulse de sua casa”, o que pode implicar separação sem especificar sua forma jurídica.'
    reason: alternative_reading
  - marker: c
    text: 'O texto grego paralelo é bem diferente: “Não dê passagem à água, nem autoridade a uma esposa má”. Esta tradução segue o testemunho hebraico preservado como fonte principal deste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: uma esposa má
  rationale: No contexto de לְבַעֲלָהּ (“para seu marido”), אִשָּׁה designa especificamente a esposa. “Má” preserva a amplitude de רָעָה sem restringi-la necessariamente a “perversa”.
- source_word: צָרַעַת
  choice: lepra
  rationale: É o termo convencional para a afecção bíblica, embora a categoria antiga seja mais ampla que a hanseníase moderna. A repetição mantém a força e a simetria da metáfora hebraica.
- source_word: לְבַעֲלָהּ
  choice: para seu marido
  rationale: No contexto conjugal, בַּעַל significa “marido”, não “dono” ou “senhor”; a preposição לְ é expressa naturalmente por “para” nesta construção predicativa.
- source_word: יְגַרְשֶׁנָּה
  choice: que ele a expulse
  rationale: גרש significa expulsar ou mandar embora. A forma volitiva é representada por “que ele”, sem transformar a ação explicitamente em um procedimento jurídico de divórcio.
- source_word: מִבֵּיתוֹ
  choice: de sua casa
  rationale: Preserva o cenário doméstico concreto e combina de modo natural com “expulse” em português.
- source_word: וְיִתְרַפֵּא
  choice: e ele ficará curado
  rationale: 'A sequência é entendida de modo resultativo: depois da expulsão, ele será curado. A explicitação de “ele” evita obscuridade na frase portuguesa.'
- source_word: מִצָּרַעְתּוֹ
  choice: de sua lepra
  rationale: Mantém o sufixo possessivo masculino e retoma literalmente a metáfora da primeira oração.
theological_decisions:
- issue: Se o remédio deve ser apresentado como divórcio legal ou como expulsão concreta da casa
  choice: 'Expulsão concreta: “que ele a expulse de sua casa”'
  alternative: “que ele se divorcie dela”
  rationale: O hebraico emprega גרש com “de sua casa”, descrevendo diretamente uma expulsão. Traduzir por “divorciar-se” restringiria o sentido a uma categoria jurídica que o texto não especifica, embora possa estar implícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a metáfora dura e a tensão do hebraico sem suavizá-las nem convertê-las em prescrição jurídica mais específica.
