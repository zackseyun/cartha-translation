  yaml_path: translation/deuterocanon/sirach/025/001.yaml
  text: 'In three things I was made beautiful[b][a], and I stood beautiful before the Lord and men:'
translation:
  language: pt
  text: 'Em três coisas fui embelezada[a] e me ergui bela[b] diante do Senhor e dos seres humanos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornei-me bela”. O passivo grego pode destacar tanto uma ação realizada sobre quem fala quanto o estado resultante.
    reason: lexical_alternative
  - marker: b
    text: Ou “levantei-me bela” ou “apresentei-me bela”. O grego conserva a imagem concreta de erguer-se ou pôr-se de pé, embora o contexto também permita a ideia de apresentar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: Em três coisas
  rationale: Mantém a construção enumerativa e expressa o âmbito em que a beleza se manifesta, preparando a lista que vem a seguir.
- source_word: ὡραιώθην
  choice: fui embelezada
  rationale: Reproduz diretamente o aoristo passivo de ὡραιόω e conserva a linguagem estética. O feminino é explicitado pela concordância posterior de ὡραία no grego.
- source_word: ἀνέστην
  choice: me ergui
  rationale: Conserva a imagem concreta de levantar-se ou pôr-se de pé, sem reduzi-la ao sentido abstrato de apenas aparecer.
- source_word: ὡραία
  choice: bela
  rationale: Retoma a mesma ideia de beleza presente em ὡραιώθην e preserva o feminino explícito do adjetivo grego.
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: diante do Senhor e dos seres humanos
  rationale: “Diante de” expressa presença ou avaliação; “seres humanos” comunica claramente o sentido genérico de ἀνθρώπων, sem restringi-lo aos homens do sexo masculino.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte desta passagem é grego e emprega κύριος; “Senhor” preserva a referência reverente a Deus sem pressupor, neste ponto, um testemunho hebraico direto do nome divino.
- issue: Identidade e gênero da voz que fala
  choice: fui embelezada; bela
  alternative: fui embelezado; belo
  rationale: O adjetivo grego ὡραία está no feminino. A tradução mantém esse dado gramatical sem identificar além do que o verso declara a figura que fala.
- issue: Alcance de ἀνθρώπων
  choice: seres humanos
  alternative: homens
  rationale: O plural grego designa aqui seres humanos em geral. A formulação escolhida preserva esse alcance universal e evita uma leitura exclusivamente masculina.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém o paralelismo da linguagem de beleza, o feminino explícito do grego e a imagem concreta de erguer-se.
