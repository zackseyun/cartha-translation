  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
translation:
  language: pt
  text: De uma mulher vem o princípio do pecado[a], e por causa dela todos morremos juntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase provavelmente alude à mulher no relato primordial da queda; o versículo é conciso e não desenvolve aqui essa alusão nem suas implicações teológicas.
    reason: cross_reference
  - marker: b
    text: 'A forma hebraica também pode ser entendida como ação concluída: “morremos” ou “perecemos”. O paralelo grego traz o sentido presente e universal: “todos morremos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: De uma mulher
  rationale: A preposição מִן indica origem ou procedência, confirmada pelo grego ἀπό. “Mulher”, e não “esposa”, preserva a formulação genérica e alusiva do texto.
- source_word: תְחִלַת עָוֹן
  choice: é o princípio do pecado
  rationale: A primeira oração é nominal no hebraico. “É o princípio” mantém sua concisão e reproduz תְחִלָּה como “princípio”, em consonância com o grego ἀρχή; “pecado” expressa aqui o sentido moral de עָוֹן, apoiado por ἁμαρτία.
- source_word: וּבִגְלָלָהּ
  choice: e por causa dela
  rationale: בגלל assinala causa. A expressão portuguesa é corrente e preserva a referência feminina singular sem tornar a relação mais instrumental do que o hebraico exige.
- source_word: גָוַעְנוּ
  choice: morremos
  rationale: גוע significa morrer ou expirar. Em português, “morremos” pode ser entendido tanto como presente geral quanto como pretérito perfeito, preservando de modo especialmente adequado a tensão entre a forma hebraica e o presente universal do paralelo grego.
- source_word: יַחַד
  choice: todos juntos
  rationale: “Juntos” conserva o valor lexical de יַחַד, enquanto “todos”, apoiado pelo grego πάντες, explicita a abrangência coletiva da afirmação.
theological_decisions:
- issue: Atribuição do início do pecado e da morte a “uma mulher”
  choice: 'Preservar literalmente a referência singular feminina: “De uma mulher é o princípio do pecado, e por causa dela...”'
  alternative: Suavizar para uma referência neutra à humanidade ou acrescentar explicitamente o nome Eva.
  rationale: Hebraico e grego dizem “mulher” no singular e provavelmente aludem ao relato primordial da queda. A tradução mantém essa formulação tensa sem neutralizá-la nem inserir no corpo do versículo uma identificação ou elaboração teológica que o texto não explicita.
- issue: Valor temporal de גָוַעְנוּ
  choice: morremos
  alternative: morremos no sentido exclusivamente passado; perecemos; todos morrem
  rationale: A mesma forma portuguesa admite leitura presente e passada, conservando a ambiguidade relevante do hebraico e permitindo a leitura universal sustentada pelo grego, sem decidir silenciosamente entre elas.
translation_notes:
  register: Português moderno, digno e conciso, com legibilidade brasileira. A ordem marcada “De uma mulher é...” preserva o caráter proverbial e a estrutura nominal do hebraico. “Todos juntos” retém tanto a força coletiva do hebraico יַחַד quanto a universalidade explicitada no paralelo grego.
