  text: Any wound[a], but not like a wound of the heart; any evil, but not like the evil of a woman.
translation:
  language: pt
  text: Qualquer ferida, mas não uma ferida do coração; qualquer mal, mas não o mal de uma mulher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qualquer desgraça, mas não como a desgraça causada por uma mulher”. O hebraico רָעָה pode significar “mal”, “dano” ou “desgraça”, e אִשָּׁה também pode significar “esposa”, conforme o contexto.'
    reason: Alternativas lexicais e contextuais do hebraico.
lexical_decisions:
- source_word: כָּל
  choice: toda / todo
  rationale: O termo tem alcance universal e, repetido nos dois membros do provérbio, é expresso naturalmente em português por “toda” e “todo”.
- source_word: מַכָּה
  choice: ferida
  rationale: O hebraico pode indicar golpe, aflição ou a lesão resultante. “Ferida” preserva tanto o sentido concreto quanto a imagem metafórica ligada ao coração, em acordo com o grego πληγή.
- source_word: הַלֵּב
  choice: o coração
  rationale: A tradução literal mantém a imagem do texto e sua referência ampla à vida interior, sem restringi-la à mente ou às emoções.
- source_word: רָעָה
  choice: mal
  rationale: “Mal” conserva melhor a amplitude do hebraico, que pode designar maldade, dano ou desgraça. Também corresponde ao teor moral possível do paralelo grego πονηρία sem eliminar o sentido de infortúnio.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: Sem marcador possessivo ou matrimonial, o sentido mais direto é “mulher”. O possível sentido de “esposa” é registrado em nota.
- source_word: וְלֹא כְ
  choice: mas nenhuma/nenhum como
  rationale: 'A formulação explicita em português a comparação superlativa idiomática do hebraico: pode haver toda espécie de ferida ou mal, mas nenhum se compara ao exemplo indicado.'
theological_decisions:
- issue: Possível suavização do teor depreciativo do segundo membro
  choice: Manter no texto principal a formulação direta “o mal de uma mulher”
  alternative: a desgraça ou o dano causado por uma mulher/esposa
  rationale: O provérbio hebraico é deliberadamente contundente. A tradução não deve neutralizar essa tensão nem transformar o enunciado em linguagem mais branda; as ambiguidades lexicais relevantes são preservadas em nota.
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo equilibrado entre os dois membros. A construção “mas nenhuma/nenhum como” comunica naturalmente a força comparativa do original sem apagar sua concisão ou sua tensão.
