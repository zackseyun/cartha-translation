  source_fidelity: 'A tradução conserva adequadamente os principais termos hebraicos: מַכָּה como “ferida”, לֵב como “coração”, רָעָה como “mal” e אִשָּׁה como “mulher”. Contudo, “Toda ferida, mas nenhuma como...” introduz uma construção comparativa (“nenhuma como”) que não corresponde tão diretamente à fórmula hebraica “qualquer/toda X, mas não X de Y”.'
  naturalness: 'A redação proposta abaixo mantém o paralelismo conciso e proverbial, mas torna a oposição portuguesa mais coerente: “Qualquer ferida, mas não uma ferida do coração”.'
  terminology: “Ferida”, “coração”, “mal” e “mulher” são escolhas fiéis e naturais. A nota preserva, sem impor, as alternativas contextuais “desgraça/dano” e “esposa”.
  issues:
