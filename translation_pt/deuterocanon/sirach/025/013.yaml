revisions:
- from: Toda ferida, mas nenhuma como a ferida do coração; todo mal, mas nenhum como o mal de uma mulher.[a]
  to: Qualquer ferida, mas não uma ferida do coração; qualquer mal, mas não o mal de uma mulher.[a]
  rationale: A revisão substitui a paráfrase comparativa “nenhuma como” por uma construção que reflete mais de perto o paralelismo hebraico e continua idiomática em português. Mantém-se a formulação direta e historicamente áspera do segundo membro, sem a suavizar nem ampliar seu referente; as possibilidades lexicais permanecem assinaladas em nota.
