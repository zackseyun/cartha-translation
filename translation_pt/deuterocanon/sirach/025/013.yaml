    issue: A construção “Toda ferida, mas nenhuma como...” reformula a negação comparativa do hebraico.
    rationale: O original repete o substantivo após “não como” (literalmente, “qualquer ferida, mas não ferida do coração”). “Qualquer..., mas não uma...” preserva melhor essa estrutura e evita a mudança para “nenhuma”.
  - severity: low
