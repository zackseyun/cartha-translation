  text: Any wound[a], but not the wound of those who hate; and any vengeance[b], but not the vengeance of enemies.
translation:
  language: pt
  text: Qualquer ferida[a], mas não a ferida dos que odeiam; e qualquer vingança[b], mas não a vingança dos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Qualquer aflição, mas não a aflição dos que odeiam”. O substantivo grego traduzido por “ferida” também pode ter o sentido mais amplo de dano ou aflição.
    reason: lexical_alternative
  - marker: b
    text: 'O grego apresenta um provérbio elíptico, literalmente: “qualquer ferida... e não a ferida dos que odeiam; e qualquer vingança... e não a vingança dos inimigos”. A ideia é que essa hostilidade é pior do que outras formas de dano.'
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: qualquer
  rationale: 'Tem valor distributivo na comparação implícita: qualquer ocorrência seria preferível ao tipo especialmente doloroso mencionado em seguida. Também conserva a concisão proverbial.'
- source_word: ἐπαγωγήν
  choice: ferida
  rationale: O substantivo pode indicar algo infligido ou trazido sobre alguém, incluindo ataque, dano ou aflição. “Ferida” dá concretude e força ao paralelismo, enquanto a amplitude semântica é preservada em nota.
- source_word: μισούντων
  choice: dos que odeiam
  rationale: Traduz naturalmente o particípio substantivado no genitivo e mantém o sentido ativo de hostilidade.
- source_word: ἐκδίκησιν
  choice: vingança
  rationale: Expressa retaliação e preserva o tom grave e o paralelismo do provérbio sem especificar indevidamente punição judicial.
- source_word: ἐχθρῶν
  choice: dos inimigos
  rationale: Equivalente claro e corrente do genitivo plural, preservando a relação de inimizade.
theological_decisions:
- issue: Interpretação do provérbio comparativo elíptico
  choice: Manter a formulação concisa “qualquer... mas não...”, que sugere ser preferível suportar qualquer ferida ou vingança, exceto a especialmente dolorosa causada por quem odeia ou por inimigos.
  alternative: 'Explicitar: “Não há ferida como a ferida de quem odeia, nem vingança como a vingança dos inimigos.”'
  rationale: O grego não tem verbo e emprega uma construção proverbial elíptica. A tradução conserva essa tensão e evita transformar a comparação implícita em uma afirmação mais explícita do que o texto.
- issue: Amplitude de ἐπαγωγή
  choice: Usar “ferida” no texto e registrar “aflição” como alternativa em nota.
  alternative: Traduzir diretamente por “aflição”, “dano” ou “ataque”.
  rationale: “Ferida” preserva a força concreta do dito, mas o termo grego admite sentido mais amplo; a nota evita encerrar uma ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura breve e paralela preserva o caráter proverbial e a elipse do grego.
