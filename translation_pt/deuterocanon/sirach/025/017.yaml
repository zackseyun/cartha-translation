translation:
  language: pt
  text: A maldade de uma mulher[a] escurece a aparência de um homem e deixa o rosto dele sombrio como o de um urso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico אִשָּׁה também pode significar “esposa”; nesse caso, o provérbio pode ser entendido mais especificamente no contexto do casamento.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “e escurece o rosto dela como tecido de saco”, apresentando pronomes e uma imagem diferentes dos do hebraico preservado, que diz “o rosto dele [...] como o de um urso”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: maldade
  rationale: O substantivo indica mal moral ou caráter nocivo. “Maldade” conserva a força proverbial e corresponde bem ao grego πονηρία.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. Sem marca possessiva explícita, “uma mulher” preserva no texto principal a formulação genérica do hebraico; a possibilidade de “esposa” é registrada em nota.
- source_word: יַשְׁחִיר
  choice: escurece
  rationale: A forma causativa comunica a ideia de tornar escuro ou negro. “Escurece” mantém a imagem e soa natural em português.
- source_word: מַרְאֶה אִישׁ
  choice: a aparência de um homem
  rationale: מַרְאֶה designa o aspecto visível, e אִישׁ é explicitamente masculino. A expressão escolhida é clara e evita o arcaísmo de “semblante” neste primeiro membro.
- source_word: וְיַקְדִיר
  choice: deixa ... sombrio
  rationale: קדר pode expressar escurecimento, abatimento ou aspecto carregado. “Deixa ... sombrio” preserva a sobreposição com o verbo anterior sem repetição mecânica.
- source_word: פָּנָיו
  choice: seu rosto
  rationale: פָּנִים significa normalmente “rosto”; o sufixo masculino retoma “um homem” no texto hebraico.
- source_word: לְדוֹב
  choice: como um urso
  rationale: O hebraico preservado traz דֹּב, “urso”. A tradução segue esse testemunho principal, enquanto a imagem divergente do grego é indicada em nota.
theological_decisions:
- issue: Linguagem de gênero no provérbio
  choice: A maldade de uma mulher escurece a aparência de um homem
  alternative: A maldade de uma esposa escurece a aparência do marido
  rationale: O hebraico emprega os termos explicitamente marcados אִשָּׁה e אִישׁ. A tradução não neutraliza o gênero nem restringe silenciosamente אִשָּׁה ao sentido conjugal; essa possibilidade contextual é preservada em nota.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: 'seguir o hebraico: “seu rosto sombrio como um urso”'
  alternative: 'seguir o grego: “o rosto dela escuro como pano de saco”'
  rationale: O testemunho hebraico fornecido é a fonte principal e apresenta com clareza os pronomes masculinos e a imagem do urso. A leitura grega constitui uma variante substancial e é documentada sem ser combinada com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura breve e paralela conserva o caráter proverbial; “sombrio” comunica tanto escurecimento visual quanto abatimento sem eliminar a ambiguidade da imagem.
