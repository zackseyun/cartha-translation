  yaml_path: translation/deuterocanon/sirach/025/007.yaml
  text: The crown of the aged is much experience[a], and their boast is the fear of the Lord.
translation:
  language: pt
  text: A coroa dos idosos é a vasta experiência[a], e o motivo de orgulho deles é o temor do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande experiência” ou “ampla experiência”. O grego πολυπειρία destaca a experiência extensa adquirida ao longo do tempo.
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  choice: coroa
  rationale: O substantivo designa uma coroa ou grinalda honorífica; “coroa” preserva com clareza a imagem metafórica de honra.
- source_word: γερόντων
  choice: dos idosos
  rationale: O genitivo plural refere-se a pessoas de idade avançada. “Dos idosos” mantém o sentido etário sem sugerir necessariamente o cargo de ancião.
- source_word: πολυπειρία
  choice: vasta experiência
  rationale: O composto ressalta uma experiência extensa e acumulada ao longo do tempo. “Vasta experiência” é natural em português e conserva a força de πολυ-.
- source_word: καύχημα
  choice: motivo de orgulho
  rationale: O termo pode indicar tanto o ato de gloriar-se quanto aquilo em que alguém se gloria. “Motivo de orgulho” expressa de modo natural o segundo sentido exigido pelo contexto.
- source_word: φόβος Κυρίου
  choice: temor do Senhor
  rationale: A expressão tradicional da literatura sapiencial designa o temor reverente diante de Deus. “Temor” preserva a tensão teológica do original, sem reduzi-la apenas a “reverência”.
theological_decisions:
- issue: Tradução de Κυρίου na fórmula sapiencial φόβος Κυρίου
  choice: do Senhor
  alternative: do SENHOR
  rationale: O texto grego traz Κυρίου; por isso, “Senhor” traduz diretamente o testemunho grego, embora a fórmula remeta ao uso sapiencial hebraico muitas vezes vertido como “SENHOR”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição explícita em “deles” evita possível ambiguidade de “seu”, e “motivo de orgulho” comunica naturalmente o valor contextual de καύχημα.
