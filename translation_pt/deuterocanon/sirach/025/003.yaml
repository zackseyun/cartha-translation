base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/003.yaml
  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
translation:
  language: pt
  text: Um pobre arrogante, um rico que mente[a] e um velho que comete adultério e não tem discernimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode significar “engana” ou “nega”; o paralelo grego traz “mentiroso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não tem entendimento” ou “é falto de juízo”; o grego diz, de modo semelhante, “deficiente em entendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: um pobre arrogante
  rationale: דַּל designa uma pessoa pobre ou de condição humilde, e גֵּאֶה expressa orgulho altivo. A forma masculina singular do hebraico foi preservada; “arrogante” comunica com clareza a censura presente no contexto.
- source_word: וְעָשִׁיר מְכַחֵשׁ
  choice: um rico que mente
  rationale: עָשִׁיר significa “rico”, enquanto o particípio מְכַחֵשׁ pode indicar mentir, enganar ou negar. O grego ψεύστην confirma aqui o sentido geral de “mentiroso”; a construção verbal soa natural em português.
- source_word: וְזָקֵן מְנָאֵף
  choice: um velho que comete adultério
  rationale: זָקֵן refere-se aqui a um homem idoso, não necessariamente a alguém que ocupa o cargo de ancião. מְנָאֵף designa quem pratica adultério; a formulação verbal mantém a ação explícita.
- source_word: וַחֲסַר דַּעַת
  choice: e não tem discernimento
  rationale: A expressão hebraica indica falta de conhecimento, entendimento ou bom juízo. “Não tem discernimento” conserva a dimensão intelectual e moral da frase e concorda com o paralelo grego ἐλαττούμενον συνέσει.
theological_decisions:
- issue: Relação entre a linha hebraica preservada e a forma mais extensa do paralelo grego
  choice: Traduzir diretamente a enumeração preservada no hebraico e usar o grego apenas para confirmar o sentido de termos semanticamente amplos.
  alternative: 'Acrescentar do grego a introdução: “Há três tipos de pessoas que detesto...”'
  rationale: Como o texto hebraico disponível contém apenas os três tipos censurados, não se acrescenta ao corpo do versículo a moldura extensa do grego. Ainda assim, a concordância substancial entre as testemunhas apoia os sentidos “mente” e “discernimento”, sem eliminar as alternativas lexicais do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura concisa de lista do hebraico foi mantida. Empregaram-se formas masculinas singulares porque o texto-fonte apresenta três figuras masculinas específicas.
