base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/008.yaml
  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: pt
  text: Feliz quem não tropeçou com a língua[a] e não serviu a alguém mais desprezível do que ele próprio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz, em vez disso: “um homem que se alegra com seus filhos e que, estando vivo, vê a queda de seus inimigos”. O testemunho hebraico aqui difere substancialmente do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz quem
  rationale: A fórmula hebraica de bem-aventurança descreve uma condição afortunada ou digna de admiração. “Feliz quem” é natural no português atual e mantém o tom sapiencial sem acrescentar uma conotação teológica mais explícita.
- source_word: נִכְשַׁל
  choice: não tropeçou
  rationale: Preserva a metáfora hebraica do tropeço e, junto de “com a língua”, comunica um deslize ou uma falta na fala sem reduzir a expressão a “pecou”.
- source_word: בִּלְשׁוֹנוֹ
  choice: com a língua
  rationale: Mantém a imagem concreta e o foco moral na fala. “No falar” seria mais explicativo, porém menos próximo do idioma hebraico.
- source_word: עֹבֵד
  choice: serviu
  rationale: Expressa de modo amplo a subordinação social indicada pelo hebraico, sem especificar indevidamente escravidão ou emprego.
- source_word: נִקְלֶה
  choice: mais desprezível
  rationale: O adjetivo indica alguém tido como vil, desonroso ou de pouca estima. A forma comparativa corresponde à construção com מִמֶּנּוּ.
- source_word: מִמֶּנּוּ
  choice: do que ele próprio
  rationale: 'Torna explícita e idiomática a comparação reflexiva: a pessoa servida é considerada mais desprezível do que aquele que a serve.'
theological_decisions:
- issue: Divergência substancial entre o hebraico e o grego
  choice: O texto principal segue o testemunho hebraico preservado.
  alternative: 'O grego traz: “um homem que se alegra com seus filhos e que vive para ver a queda dos inimigos”.'
  rationale: Como há texto hebraico de alta confiança, ele recebe prioridade. A leitura grega, materialmente diferente, é preservada em nota para expor com transparência a variação textual, sem harmonizar os testemunhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação proverbial é concisa; conserva-se a metáfora concreta de tropeçar com a língua e evita-se interpretar além do que o hebraico afirma.
