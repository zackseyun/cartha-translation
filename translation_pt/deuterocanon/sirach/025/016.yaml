translation:
  language: pt
  text: Prefiro morar com um leão e um dragão a viver com uma mulher perversa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma esposa perversa”. A palavra grega γυνή pode significar “mulher” ou “esposa”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῆσαι
  choice: morar com
  rationale: O infinitivo de συνοικέω indica viver junto na mesma habitação. “Morar com” é natural em português e preserva o sentido doméstico sem acrescentar conotação sexual.
- source_word: λέοντι
  choice: um leão
  rationale: Tradução direta do dativo singular de λέων; o singular mantém a vivacidade da comparação proverbial.
- source_word: δράκοντι
  choice: um dragão
  rationale: δράκων pode designar um dragão ou uma grande serpente. “Dragão” preserva de modo direto a imagem intensificada do provérbio, sem restringi-la a “serpente”.
- source_word: εὐδόκησα
  choice: prefiro
  rationale: Embora εὐδοκέω possa significar “agradar-se” ou “ter prazer”, na construção comparativa com ἤ expressa preferência. O presente proverbial “prefiro” comunica essa força de modo claro e idiomático em português.
- source_word: ἐνοικῆσαι
  choice: viver
  rationale: ἐνοικέω significa habitar ou residir. “Viver” mantém o sentido de convivência no mesmo ambiente e evita repetição rígida de “morar”.
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: com uma mulher perversa
  rationale: γυνή pode significar “mulher” ou “esposa”, conforme o contexto. Como não há possessivo explícito, “mulher” é a opção mais cautelosa no texto principal; πονηρός tem aqui valor moral, bem expresso por “perversa”.
theological_decisions:
- issue: Se γυνή deve ser traduzido como “mulher” ou “esposa” neste provérbio
  choice: mulher
  alternative: esposa
  rationale: O grego permite ambos os sentidos. A ausência de possessivo favorece “mulher” como tradução principal, enquanto os verbos de convivência doméstica tornam “esposa” uma alternativa contextual plausível, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial natural. A repetição dos verbos gregos de habitação é representada por “morar” e “viver”, e a ambiguidade de γυνή é mantida por meio da nota.
