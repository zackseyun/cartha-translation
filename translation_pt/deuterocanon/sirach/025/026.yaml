  text: If she does not go according to your hand[b][a], cut her off from your flesh.
translation:
  language: pt
  text: Se ela não agir segundo a sua mão[a], corte-a da sua carne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «segundo a sua mão», expressão que pode indicar agir sob a direção, autoridade ou controle de alguém.
    reason: lexical_alternative
  - marker: b
    text: A expressão «corte-a da sua carne» emprega uma imagem corporal de separação decisiva; o grego não usa aqui um termo técnico explícito para divórcio.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: Se ... não
  rationale: Mantém a formulação condicional direta e incisiva do grego; «a menos que» seria possível, mas alteraria a estrutura da frase.
- source_word: πορεύεται
  choice: agir
  rationale: O verbo significa literalmente «ir» ou «andar», mas aqui descreve o modo de proceder da mulher. «Agir» comunica esse sentido contextual sem acrescentar uma interpretação jurídica.
- source_word: κατὰ χεῖρά σου
  choice: segundo a sua mão
  rationale: Preserva a imagem concreta da mão e a ambiguidade do idioma grego, que pode indicar direção, autoridade ou controle. A nota esclarece o sentido sem substituí-lo no texto.
- source_word: ἀπότεμε
  choice: corte-a
  rationale: Reproduz o imperativo forte do verbo «cortar, amputar, separar cortando» e mantém sua ligação com a imagem corporal que vem em seguida.
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: da sua carne
  rationale: O plural grego é vertido pelo singular idiomático em português. «Carne» preserva a imagem de união corporal ou de parentesco melhor do que «corpo».
- source_word: αὐτήν
  choice: -a
  rationale: O pronome feminino retoma a mulher mencionada no contexto e é expresso como objeto direto enclítico em «corte-a».
theological_decisions:
- issue: Força ética da ordem no contexto sapiencial
  choice: Manter a ordem severa de separação por meio da imagem de cortar alguém da própria carne.
  alternative: Traduzir explicitamente como «divorcie-se dela» ou atenuar para «afaste-se dela».
  rationale: O grego não emprega um termo jurídico explícito para divórcio, mas uma metáfora corporal intensa. A tradução conserva essa força sem restringir indevidamente o sentido a uma categoria legal específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção incomum «segundo a sua mão» foi mantida deliberadamente para preservar a metáfora e a ambiguidade do grego, acompanhada de nota explicativa. O imperativo permanece incisivo, sem suavização nem explicitação denominacional.
