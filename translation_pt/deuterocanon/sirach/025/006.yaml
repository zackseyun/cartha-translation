  text: How beautiful is wisdom in the aged[a], and understanding and counsel in those who are honored.
translation:
  language: pt
  text: Como é bela a sabedoria dos idosos, e o discernimento e o conselho nos que são honrados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Como é bela a sabedoria dos idosos, e o pensamento e o conselho dos que são honrados.»'
    reason: Alternativa lexical para διανόημα («pensamento») e possível relação possessiva expressa pelo dativo δεδοξασμένοις.
lexical_decisions:
- source_word: ὡς ὡραία
  choice: Como é bela
  rationale: O ὡς exclamativo introduz uma exclamação. A formulação preserva a apreciação estética de ὡραία sem reduzi-la à ideia de mera conveniência.
- source_word: γερόντων
  choice: dos idosos
  rationale: O genitivo plural designa pessoas de idade avançada. «Idosos» é corrente e não sugere necessariamente um cargo comunitário, como poderia ocorrer com «anciãos».
- source_word: σοφία
  choice: sabedoria
  rationale: Mantém o termo central da literatura sapiencial e sua correspondência direta com σοφία.
- source_word: δεδοξασμένοις
  choice: entre os que são honrados
  rationale: O particípio perfeito indica pessoas que se encontram em condição de honra ou estima. A preposição «entre» expressa naturalmente a associação em português, embora o dativo também permita uma leitura de posse ou conveniência.
- source_word: διανόημα
  choice: discernimento
  rationale: No paralelismo com «conselho», comunica pensamento sensato e capacidade de compreensão sem o tom técnico moderno de «inteligência».
- source_word: βουλή
  choice: conselho
  rationale: Preserva tanto a dimensão de deliberação prudente quanto a de orientação sábia adequada ao contexto.
theological_decisions:
- issue: Gênero e referência de γερόντων
  choice: «dos idosos», em sentido geral
  alternative: «dos homens idosos» ou «dos anciãos»
  rationale: Embora a forma grega seja gramaticalmente masculina, a máxima sapiencial apresenta uma observação geral sobre a velhice; a tradução não restringe indevidamente o referente a homens nem introduz a ideia de um ofício.
- issue: Relação do dativo δεδοξασμένοις com διανόημα καὶ βουλή
  choice: «entre os que são honrados»
  alternative: «dos que são honrados» ou «para os que são honrados»
  rationale: O dativo admite mais de uma relação contextual. A opção principal é idiomática e evita decidir de modo rígido entre posse, esfera de ocorrência e conveniência; a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência sapiencial. «Idosos» tem ampla compreensão no português internacional e boa legibilidade brasileira; «discernimento» preserva o caráter reflexivo do termo sem soar excessivamente técnico.
