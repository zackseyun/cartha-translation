  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
translation:
  language: pt
  text: Em todas as suas ações, cuide de si[a], pois quem faz isso guarda o mandamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cuide de sua alma» ou «preserve sua vida»; o hebraico néfesh pode significar a própria pessoa, a alma ou a vida.
    reason: lexical_alternative
  - marker: b
    text: Ou «guarda um mandamento». O singular «mandamento» pode ter sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: Em tudo o que você fizer
  rationale: Expressa de modo natural o âmbito abrangente da construção hebraica, literalmente «em todas as suas ações», sem perder seu sentido ético.
- source_word: שמור
  choice: cuide
  rationale: Neste contexto, o imperativo de שמר pede vigilância e cuidado sobre a própria pessoa. «Cuide de si mesmo» comunica isso com naturalidade; «guarde a si mesmo» seria pouco idiomático em português.
- source_word: נפשך
  choice: de si mesmo
  rationale: נפש pode designar a pessoa, a vida ou a alma. Aqui, junto das ações, aponta para o cuidado vigilante da pessoa inteira.
- source_word: כי
  choice: pois
  rationale: Introduz de maneira concisa a razão da exortação.
- source_word: עושה זה
  choice: quem faz isso
  rationale: Reproduz o valor genérico do particípio hebraico sem restringir a referência a um gênero.
- source_word: שומר מצוה
  choice: guarda o mandamento
  rationale: Mantém o verbo tradicional «guardar», correspondente a שמר, e conserva o singular מצוה. O caráter definido ou genérico de «mandamento» permanece indicado em nota.
theological_decisions:
- issue: Sentido de נפש na exortação sapiencial
  choice: si mesmo
  alternative: sua alma; sua vida
  rationale: O termo hebraico pode abranger a pessoa inteira, não apenas uma parte imaterial. O contexto ético favorece a referência ao cuidado integral de si, sem impor uma antropologia dualista.
- issue: Caráter definido ou genérico de מצוה
  choice: o mandamento
  alternative: um mandamento
  rationale: O substantivo hebraico está no singular e sem artigo, podendo referir-se genericamente ao mandamento divino ou a um mandamento. A tradução principal segue a leitura coletiva, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A forma «você» explicita o singular do hebraico; «guarda o mandamento» conserva a tonalidade sapiencial e bíblica. O paralelo grego fornecido não corresponde semanticamente ao hebraico deste versículo e, diante da alta confiança do texto hebraico, não foi usado para alterar a tradução.
