  text: Speak briefly[a], though you know much, and be like one who knows and keeps silent.
translation:
  language: pt
  text: Fale pouco[a], mesmo que saiba muito, e seja como quem sabe e se mantém calado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é bastante condensado e talvez elíptico. A primeira frase contém as ideias de falar, pouco e muito, mas sua sintaxe exata é incerta; a tradução expressa o provável sentido de falar com moderação, mesmo quando se sabe muito. O texto grego indicado para este versículo não corresponde a esta linha hebraica; por isso, aqui se segue o hebraico como testemunho principal.
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  choice: Fale pouco, mesmo que saiba muito
  rationale: O hebraico transmitido é muito condensado e possivelmente elíptico. A tradução explicita com cautela o provável contraste sapiencial entre saber muito e falar pouco, sem tratar a reconstrução como indiscutível.
- source_word: ודמה
  choice: e seja como
  rationale: Expressa de modo natural o valor comparativo de דמה e mantém a sequência exortativa.
- source_word: ליודע
  choice: quem sabe
  rationale: O ל é entendido comparativamente após דמה; a formulação é clara, concisa e não acrescenta uma qualificação ausente.
- source_word: ומחריש
  choice: e se mantém calado
  rationale: Comunica não apenas ausência de fala, mas contenção deliberada, adequada ao particípio e ao contexto sapiencial.
- source_word: יחדו
  choice: '[incorporado na coordenação]'
  rationale: O sentido literal de simultaneidade, 'juntamente/ao mesmo tempo', é transmitido pela união das duas qualidades — saber e manter-se calado — sem uma expressão pesada em português.
