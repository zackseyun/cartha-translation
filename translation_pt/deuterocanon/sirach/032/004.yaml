translation:
  language: pt
  text: Como um selo sobre uma bolsa de ouro é um cântico a Deus num banquete de vinho[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cântico de Deus”. A expressão hebraica é condensada e pode indicar tanto um cântico dirigido a Deus como um cântico relacionado a ele.'
    reason: lexical_alternative
  - marker: b
    text: As linhas hebraicas anteriores desta unidade foram transmitidas com dificuldades textuais. Esta comparação final é a parte mais clara do hebraico preservado. A tradição grega correspondente apresenta aqui uma redação diferente.
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: Como um selo
  rationale: O prefixo כ introduz uma comparação. “Selo” traduz חותם sem restringir o termo ao sentido mais específico de “sinete”.
- source_word: על כיס זהב
  choice: sobre uma bolsa de ouro
  rationale: כיס designa uma bolsa ou saco para dinheiro e objetos de valor. A formulação conserva a imagem concreta e a preposição על, embora “bolsa de ouro” possa referir-se ao conteúdo, não necessariamente ao material da bolsa.
- source_word: שיר
  choice: um cântico
  rationale: O substantivo singular indica uma composição cantada. “Cântico” mantém o tom sapiencial e a possível dimensão religiosa sem soar arcaico em excesso.
- source_word: אל
  choice: a Deus
  rationale: Na expressão comprimida שיר אל, אל pode indicar que o cântico é dirigido a Deus. A nota preserva a leitura genitiva possível, “de Deus”.
- source_word: על משתה היין
  choice: num banquete de vinho
  rationale: משתה é um banquete ou festa marcada pela bebida, e היין especifica o vinho. “Num” expressa de modo idiomático a relação contextual de על.
theological_decisions:
- issue: Relação sintática na expressão comprimida שיר אל
  choice: um cântico a Deus
  alternative: um cântico de Deus
  rationale: A construção hebraica permite entender o cântico como dirigido a Deus ou relacionado a ele. O texto principal adota a leitura direcional mais natural, enquanto a nota mantém aberta a alternativa genitiva, sem impor uma interpretação litúrgica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se a imagem proverbial do hebraico e sua concisão; as duas notas explicitam a ambiguidade de שיר אל e a divergência da tradição grega.
