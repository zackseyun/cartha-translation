  text: Whoever seeks the law will grasp it[b][a], but the one who plays the hypocrite will be caught by it.
translation:
  language: pt
  text: Quem busca a Lei a obterá[b], mas quem age como hipócrita[a] será enredado por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico ומתלהלה é incerto; pode significar “o impostor”, “quem se ilude” ou outra pessoa igualmente insincera.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego deste versículo é substancialmente diferente: “E não persistas num sacrifício injusto, pois o Senhor é juiz, e junto dele não há parcialidade.” Os testemunhos hebraico e grego parecem refletir formas textuais diferentes neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש
  choice: busca
  rationale: O particípio de דרש expressa busca ou procura diligente; “busca” preserva essa ação sem restringi-la ao estudo formal.
- source_word: תורה
  choice: a Lei
  rationale: Embora תורה também possa significar “instrução” ou “ensino”, neste contexto sapiencial judaico pode designar a Torá como ensino divino normativo; “a Lei” mantém esse peso.
- source_word: יפיקנה
  choice: a compreenderá
  rationale: O verbo הפיק pode indicar obter, alcançar ou extrair. No contexto da busca da Lei, “compreenderá” comunica sua apropriação bem-sucedida, embora “a alcançará” ou “a obterá” sejam possíveis.
- source_word: ומתלהלה
  choice: quem se faz de hipócrita
  rationale: A forma hebraica é difícil e parece caracterizar alguém que assume uma postura falsa ou insincera. A expressão preserva a ideia de fingimento sem apresentar a análise como certa.
- source_word: יוקש
  choice: será apanhado
  rationale: A forma passiva denota cair numa armadilha ou ser capturado; “será apanhado” é natural e mantém a imagem, ainda que “será enredado” seja mais literal.
- source_word: בו
  choice: por ela
  rationale: 'O sufixo pode retomar a Lei, antecedente imediato. Essa leitura conserva o paralelismo: quem a busca a compreende, enquanto quem age com falsidade é apanhado por ela.'
theological_decisions:
- issue: Sentido de תורה
  choice: a Lei
  alternative: a instrução / o ensino
  rationale: A tradução mantém a provável referência à Torá como ensino divino autorizado, sem excluir a amplitude semântica de “instrução”.
- issue: Sentido do difícil ומתלהלה
  choice: quem se faz de hipócrita
  alternative: o impostor / quem se ilude / o frívolo
  rationale: O hebraico não permite certeza. A opção escolhida exprime insinceridade performativa e a nota preserva as alternativas, sem transformar uma possibilidade lexical em conclusão doutrinária.
- issue: Divergência entre os testemunhos hebraico e grego
  choice: traduzir o hebraico e registrar o grego em nota
  alternative: seguir o texto grego substancialmente diferente
  rationale: Como o testemunho hebraico está preservado e tem alta confiança, ele serve de base; a divergência grega é relevante para a história textual e deve permanecer visível ao leitor.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção “se faz de hipócrita” assinala comportamento fingido, enquanto as notas mantêm explícitas tanto a incerteza lexical quanto a importante variante textual.
