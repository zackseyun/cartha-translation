base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: pt
  text: Se escolheram você para presidir[a], não se exalte; esteja entre eles como um deles. Cuide deles[b] e depois recline-se[c]; prepare o necessário e então ocupe o seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase inicial do testemunho hebraico aparece entre colchetes na edição de Kahana: “Se escolheram você para presidir, não se exalte”. As linhas seguintes apoiam claramente o contexto de alguém que preside uma refeição.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Dê atenção a eles”. O verbo hebraico pode indicar tanto preocupação como cuidado prático.'
    reason: lexical_alternative
  - marker: c
    text: “Reclinar-se” reflete a postura costumeira nas refeições formais da Antiguidade.
    reason: cultural_note
lexical_decisions:
- source_word: ראש נבחרת
  choice: escolheram você para presidir
  rationale: A expressão designa a pessoa escolhida como cabeça de um grupo. No contexto imediato, trata-se de quem preside a reunião ou refeição; a formulação portuguesa comunica a função sem restringi-la mais do que o hebraico.
- source_word: אל תתרומם
  choice: não se exalte
  rationale: Preserva a imagem reflexiva de elevar a si mesmo e a exortação à humildade.
- source_word: היה להם כאחד מהם
  choice: esteja entre eles como um deles
  rationale: Expressa de modo natural tanto a presença junto ao grupo como a igualdade e solidariedade exigidas de quem preside.
- source_word: דאג להם
  choice: Cuide deles
  rationale: O verbo abrange preocupação e atenção prática; no contexto de uma refeição, inclui cuidar das necessidades dos convidados.
- source_word: תסב
  choice: recline-se
  rationale: Conserva a postura habitual à mesa em refeições formais da Antiguidade, esclarecida em nota cultural.
- source_word: הכן מרכם
  choice: prepare o necessário
  rationale: O texto hebraico transmitido é difícil. A tradução mantém o provável sentido contextual de providenciar os preparativos sem alegar uma precisão lexical incerta.
- source_word: תרבץ
  choice: ocupe o seu lugar
  rationale: O verbo pode indicar deitar-se ou acomodar-se. Esta formulação corresponde à sequência da refeição e evita repetir 'recline-se'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção 'escolheram você para presidir' evita o regionalismo potencial de 'fizeram de você o líder' e explicita apenas a função indicada pelo contexto. A dificuldade de הכן מרכם é preservada por uma tradução cautelosa, sem falsa precisão.
