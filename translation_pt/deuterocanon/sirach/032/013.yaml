base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: pt
  text: Por tudo isso, bendiga aquele que o fez[a], que o enche de sua bondade. Quem busca a Deus espera favor[b], mas quem se vangloria ficará enredado nele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico deste versículo difere substancialmente do grego, que diz: “Pois o Senhor é aquele que retribui e lhe retribuirá sete vezes mais.”'
    reason: textual_variant
  - marker: b
    text: 'O hebraico desta frase é difícil. Outra leitura possível é: “Quem busca a Lei obterá favor”, entendendo a expressão como referência à instrução divina.'
    reason: alternative_reading
  - marker: c
    text: A palavra traduzida como “quem se vangloria” é incerta; também pode indicar alguém que se ilude ou age com falsidade. “Nele” pode referir-se a Deus, conforme a leitura adotada na frase anterior, ou à Lei/instrução divina, conforme a leitura alternativa.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ברך
  choice: bendiga
  rationale: O imperativo pede que se louve a Deus por seus benefícios. “Bendiga” conserva o registro bíblico e a construção com objeto direto.
- source_word: עושך
  choice: aquele que o fez
  rationale: Traduz de modo direto o particípio com sufixo pessoal, em português corrente, sem perder a relação pessoal expressa no hebraico.
- source_word: המרוך מטובתו
  choice: que o sacia com a sua bondade
  rationale: A forma hebraica é incerta, mas parece indicar que o Criador provê abundantemente de sua bondade. “Sacia” é idiomático e mantém a imagem de plena provisão.
- source_word: דורש אל
  choice: quem busca a Deus
  rationale: O texto transmitido traz אל, que pode designar Deus. Esta leitura é gramaticalmente direta e evita inserir “a Lei” sem apoio explícito no hebraico, embora a expressão também possa aludir à busca da instrução divina.
- source_word: יקוה רצון
  choice: pode esperar favor
  rationale: Preserva o sentido verbal de esperar com confiança, sem converter a expectativa em obtenção já consumada. “Favor” representa adequadamente רצון neste contexto sapiencial.
- source_word: ומתלהלה
  choice: mas quem se ilude
  rationale: A forma é rara ou textualmente incerta. “Quem se ilude” expressa uma possibilidade lexical plausível e forma um contraste sapiencial natural com quem busca a Deus, sem impor a noção mais específica de hipocrisia.
- source_word: יוקש בו
  choice: será apanhado por ele
  rationale: O verbo indica cair numa armadilha ou ser enredado. Como o antecedente explícito adotado é Deus, “por ele” conserva a referência pronominal e a tensão do texto.
theological_decisions:
- issue: Texto hebraico da Geniza versus tradição grega divergente
  choice: Traduzir o testemunho hebraico preservado no texto principal e registrar a leitura grega em nota.
  alternative: 'Seguir apenas o grego: “Pois o Senhor é aquele que retribui e lhe retribuirá sete vezes mais.”'
  rationale: O hebraico sobrevivente tem prioridade como fonte, mas a divergência substancial da antiga tradição grega deve ser apresentada ao leitor com transparência.
- issue: Sentido de אל na segunda frase
  choice: Entender אל como “Deus”.
  alternative: Entender a expressão contextualmente como referência à Lei ou à instrução divina.
  rationale: “Quem busca a Deus” é a leitura mais direta das consoantes transmitidas e preserva a ambiguidade teológica por meio de nota, em vez de substituir silenciosamente o referente.
- issue: Referente de בו
  choice: Traduzir como “por ele”, referindo-se a Deus.
  alternative: Traduzir como “por ela”, tomando a Lei ou a instrução divina como antecedente implícito.
  rationale: A concordância referencial decorre da leitura de אל como Deus. A formulação mantém a afirmação difícil do hebraico, sem suavizar a ideia de que a pessoa iludida é apanhada por Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendiga” mantém o tom bíblico sem arcaísmo excessivo; as frases curtas preservam o paralelismo sapiencial. As notas explicitam a grande variante textual e as incertezas lexicais sem sobrecarregar o texto principal.
