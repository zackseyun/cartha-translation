base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: pt
  text: O sábio volta-se para as repreensões[a], mas quem se deixa enganar é levado pelo próprio desejo. O sábio não encobre a ira, mas o zombador não guarda a língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego diz: «Ele não desprezará a súplica do órfão, nem a viúva quando ela derramar a sua queixa». O testemunho hebraico preservado aqui difere substancialmente do grego neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם
  choice: o sábio
  rationale: Embora a expressão hebraica seja masculina singular, o português proverbial usa naturalmente «o sábio», preservando sua forma e categoria sapiencial sem a formulação pesada «um homem sábio».
- source_word: יטה תוכחות
  choice: se inclina para as repreensões
  rationale: Mantém a imagem verbal de voltar-se ou inclinar-se e conserva no plural a força corretiva de תוכחות.
- source_word: נפתה
  choice: quem se deixa enganar
  rationale: Expressa a vulnerabilidade ou passividade sugerida pela forma hebraica, sem convertê-la indevidamente no termo técnico «insensato».
- source_word: ואחר צרכו ימשך
  choice: vai atrás do próprio desejo
  rationale: Verte de modo natural a ideia de ser atraído ou seguir aquilo que se deseja; «desejo» preserva a amplitude contextual de צרכו melhor que uma leitura estritamente material de «necessidade».
- source_word: לא יכסה כחמה
  choice: não encobre a ira
  rationale: Segue diretamente o hebraico transmitido, apesar de sua nuance difícil, sem explicar se a ira é justa nem resolver a tensão proverbial.
- source_word: לץ
  choice: o zombador
  rationale: Termo corrente e digno para a figura sapiencial insolente que ridiculariza e despreza a correção.
- source_word: לא ישמר לשונו
  choice: não guarda a língua
  rationale: Preserva a metáfora hebraica de vigiar e refrear a fala, que também é transparente em português.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Adotar no texto principal os dois dísticos preservados em hebraico e registrar o grego em nota.
  alternative: «Ele não desprezará a súplica do órfão, nem a viúva quando ela derramar a sua queixa.»
  rationale: Como há testemunho hebraico sobrevivente, ele serve de base principal. O grego apresenta conteúdo inteiramente distinto, não simples variante lexical, e por isso deve ser preservado para transparência textual sem ser harmonizado com o hebraico.
- issue: Sentido moral de לא יכסה כחמה
  choice: Traduzir literalmente «não encobre a ira».
  alternative: Interpretar como não ocultar indignação justa ou não reprimir uma reação apropriada.
  rationale: O texto hebraico é semanticamente difícil e não especifica a qualidade da ira. A tradução conserva essa tensão e evita acrescentar uma avaliação teológica não expressa.
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. Conservam-se as imagens hebraicas de inclinar-se, encobrir a ira e guardar a língua; evita-se linguagem excessivamente arcaica.
