  text: When it is time to depart, do not linger; go home and do what pleases you.
translation:
  language: pt
  text: Quando chegar a hora de partir, não se demore; vá para casa e faça o que quiser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בעת מפקד
  choice: Quando chegar a hora de partir
  rationale: No contexto de uma refeição, a expressão indica o momento de despedida ou saída; a formulação portuguesa explicita naturalmente o valor temporal sem acrescentar uma circunstância não presente.
- source_word: אל תתאחר
  choice: não te demores
  rationale: Reproduz de modo direto a proibição de atrasar-se ou permanecer além da hora.
- source_word: פטר לביתך
  choice: vai para casa
  rationale: Expressa a ordem de deixar o encontro e dirigir-se para casa, em concordância com o contexto e com o sentido contextual de פטר.
- source_word: ושלם רצון
  choice: e faze o que te agrada
  rationale: Mantém o sentido contextual de cumprir ou realizar o próprio desejo, sem transformar רצון em obrigação, propósito religioso ou doutrina específica.
theological_decisions:
- issue: Alcance de רצון (“vontade”, “desejo”, “agrado”)
  choice: o que te agrada
  alternative: o teu desejo
  rationale: A frase hebraica é breve e pode referir-se à vontade ou ao desejo pessoal. A tradução escolhida conserva esse sentido amplo e segue o contexto prático da partida, sem moralizar nem atribuir explicitamente a vontade a Deus.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa do singular tradicionais na linguagem bíblica. A tradução cobre apenas o segmento identificado pelo numeral hebraico (יא); a frase anterior no testemunho fornecido pertence ao versículo precedente.
