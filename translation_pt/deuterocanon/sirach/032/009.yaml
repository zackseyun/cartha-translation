translation:
  language: pt
  text: Antes do granizo, o relâmpago irrompe; e diante do humilde[b], o favor se manifesta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego aqui fornecido traz, em vez disso: “O sacrifício de um justo é aceitável, e sua memória não será esquecida”, refletindo uma tradição textual ou uma correspondência de versículos diferente da do hebraico preservado.'
    reason: textual_variant
  - marker: b
    text: Ou “do abatido” / “do de condição humilde”. O termo hebraico pode indicar alguém humilde ou alguém que foi rebaixado ou esmagado.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: antes de / à frente de
  rationale: 'O paralelismo sugere precedência nos dois membros. A formulação varia de modo idiomático em português: temporalmente na imagem meteorológica e figurativamente na máxima sobre o humilde.'
- source_word: בָרָד
  choice: granizo
  rationale: É o sentido comum do substantivo e corresponde à imagem meteorológica.
- source_word: יִנְצַח
  choice: irrompe / vai
  rationale: 'O verbo é difícil neste contexto. As escolhas preservam a ideia provável de manifestação ou precedência: o relâmpago surge antes do granizo, e o favor segue adiante do humilde. A pequena variação evita uma formulação artificial em português.'
- source_word: בָּרָק
  choice: relâmpago
  rationale: Equivalente lexical comum, naturalmente associado ao granizo.
- source_word: דַכָּא
  choice: o humilde
  rationale: O termo pode designar alguém humilde, abatido ou de condição baixa. Neste provérbio sapiencial, “o humilde” preserva a força ética sem acrescentar um referente masculino ausente como substantivo explícito.
- source_word: חֵן
  choice: favor
  rationale: Em contextos sapienciais e sociais, o termo frequentemente indica favor, boa aceitação ou benevolência; “favor” é claro e mantém a amplitude do hebraico.
theological_decisions:
- issue: Texto hebraico sobrevivente versus paralelo grego divergente
  choice: Traduzir no texto principal o provérbio hebraico preservado.
  alternative: 'Seguir o grego: “O sacrifício de um justo é aceitável, e sua memória não será esquecida.”'
  rationale: Como há texto hebraico para esta passagem de Sirácida, ele recebe prioridade. O grego fornecido contém uma sentença inteiramente diferente, provavelmente por tradição textual ou numeração divergente, e por isso é registrado em nota, não incorporado ao texto principal.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo proverbial conciso. “À frente do humilde vai o favor” conserva a imagem hebraica de precedência e evita acrescentar “dele”, ausente no original.
