base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: pt
  text: Em todos os seus caminhos, guarde-se, pois quem faz essas coisas guarda o mandamento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No testemunho hebraico de Kahana, antes do número deste versículo, lê-se: “Não confie no caminho dos perversos e tenha cuidado em suas veredas.” Como essa frase precede o marcador versicular e o paralelo grego neste ponto apresenta um texto substancialmente diferente, ela pode pertencer ao contexto anterior.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: Não confie no caminho dos perversos
  rationale: Mantém a metáfora hebraica do caminho como modo de agir. “Perversos” comunica רשעים de modo natural e moralmente preciso, sem acrescentar uma definição doutrinária.
- source_word: ובארחותיך הזהר
  choice: e tenha cuidado em suas veredas
  rationale: “Tenha cuidado” expressa a advertência reflexiva de הזהר; “veredas” preserva a imagem paralela a “caminho”.
- source_word: בכל דרכיך
  choice: Em todos os seus caminhos
  rationale: Preserva a metáfora hebraica para os rumos e as condutas da pessoa, com formulação corrente em português.
- source_word: שמור נפשך
  choice: cuide de si mesmo
  rationale: Neste contexto, נפש designa a própria pessoa ou vida, não necessariamente uma “alma” abstrata. A formulação reflexiva é natural e mantém o sentido prático da exortação.
- source_word: כי
  choice: pois
  rationale: Introduz de maneira concisa a razão da exortação.
- source_word: כל עושה אלה
  choice: todo aquele que faz essas coisas
  rationale: Reproduz o valor genérico do particípio hebraico sem especificar além do texto.
- source_word: שומר מצוה
  choice: guarda o mandamento
  rationale: Conserva tanto o singular מצוה quanto o idioma ético de “guardar”, evitando explicitar “Lei” ou “Torá”, termos que não aparecem aqui.
theological_decisions:
- issue: Alcance de מצוה no contexto sapiencial
  choice: o mandamento
  alternative: um mandamento; o mandamento da Lei
  rationale: O singular definido é preservado, mas a tradução não identifica explicitamente o mandamento com a Torá nem restringe seu alcance de forma não declarada pelo texto.
- issue: Delimitação da frase anterior ao marcador do versículo
  choice: incluir a frase no texto principal com nota textual
  alternative: omiti-la como material pertencente ao contexto adjacente
  rationale: A frase consta no testemunho hebraico fornecido e foi mantida conforme a revisão mais recente, mas sua posição antes do marcador e a divergência da tradição grega exigem transparência sobre a incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Foram preservadas as metáforas de caminho e vereda e a ambiguidade do singular “o mandamento”. A repetição conceitual do hebraico foi mantida sem tornar a frase excessivamente literal.
