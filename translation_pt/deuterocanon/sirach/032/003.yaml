  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
translation:
  language: pt
  text: Fale, ancião, pois isso lhe convém; mas fale com sensatez e reserva[a] e não impeça o canto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta expressão é conciso e incerto; também pode ser entendido como “seja modesto em sua sabedoria” ou “mostre prudente reserva”.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego difere substancialmente e diz: “Quem oferece flor de farinha retribui um favor”, refletindo uma tradição textual divergente neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: מלל
  choice: Fale
  rationale: Imperativo do verbo מלל, “falar”. A forma é concisa e adequada à instrução dirigida a alguém numa reunião festiva.
- source_word: שב
  choice: ancião
  rationale: Designa aqui um homem idoso e honrado. “Ancião” preserva tanto a referência à idade quanto o tom respeitoso do contexto.
- source_word: כי הוא לך
  choice: pois isso lhe convém
  rationale: A expressão indica que tomar a palavra é próprio ou apropriado à posição do destinatário, não simplesmente que a fala lhe pertence.
- source_word: והצנא שכל
  choice: mas fale com sensatez e reserva
  rationale: A construção hebraica é comprimida e incerta. A tradução preserva a provável ideia de entendimento prudente associado à moderação; a repetição de “fale” é uma explicitação mínima exigida pela fluência em português.
- source_word: ואל תמנע שיר
  choice: e não atrapalhe o canto
  rationale: מנע pode significar impedir, reter ou obstruir. “Não atrapalhe o canto” comunica naturalmente que a fala não deve interromper a música da celebração, mantendo “canto” no singular coletivo.
theological_decisions:
- issue: Forma de tratamento שב no contexto de instrução durante um banquete
  choice: ancião
  alternative: homem idoso; velho
  rationale: “Ancião” conserva o respeito social associado à idade sem introduzir uma função eclesiástica específica.
- issue: Sentido da expressão comprimida והצנא שכל
  choice: com sensatez e reserva
  alternative: com entendimento prudente; seja modesto em sua sabedoria
  rationale: A redação mantém juntas as ideias possíveis de prudência e moderação, sem transformar a ambiguidade lexical em uma afirmação doutrinária específica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com tratamento respeitoso. A tradução evita que “ancião” seja entendido como título institucional e conserva, em nota, a incerteza da expressão hebraica central.
