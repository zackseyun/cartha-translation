    reason: textual_variant
lexical_decisions:
- source_word: בלא עצה
  choice: sem conselho
  rationale: A expressão abrange tanto buscar orientação quanto ponderar antes de agir. “Conselho” preserva essa amplitude e o tom da literatura sapiencial.
- source_word: אל תפעל דבר
  choice: não faça nada
  rationale: Na proibição, דבר tem sentido indefinido, “coisa alguma”. A formulação escolhida é natural em português e mantém o alcance amplo da ordem.
- source_word: ואחר מעשיך
  choice: e, depois de agir
  rationale: Embora a construção seja literalmente “e depois de teus atos”, a oração temporal comunica com naturalidade a sequência entre a ação e a reação posterior.
- source_word: אל תתקצף
  choice: não fique aborrecido
  rationale: O verbo pode indicar ficar irritado, perturbado ou desgostoso. “Não fique aborrecido” conserva essa amplitude melhor do que uma tradução exclusivamente voltada ao arrependimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Sem conselho” mantém o registro sapiencial; “depois de agir” evita a rigidez de “depois de seus atos”, e a ambiguidade de תתקצף é preservada no texto e explicitada em nota.
