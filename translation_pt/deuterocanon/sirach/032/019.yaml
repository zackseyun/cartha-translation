translation:
  language: pt
  text: Não faça nada sem conselho e, depois de agir, não fique aborrecido[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se arrependa” ou “não fique irritado”. O verbo hebraico pode descrever irritação ou desgosto depois de agir; neste contexto, também pode envolver pesar ou autorreprovação.'
    reason: lexical_alternative
  - marker: b
