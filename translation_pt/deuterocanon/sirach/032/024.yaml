  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: pt
  text: Quem observa a Lei protege a própria vida[a], e quem confia no SENHOR não será envergonhado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego neste versículo é substancialmente diferente: «até que retribua a cada pessoa segundo os seus atos, e as obras das pessoas segundo os seus pensamentos». O texto principal segue aqui o testemunho hebraico existente.'
    reason: textual_variant
lexical_decisions:
- source_word: נוצר תורה
  choice: observa a Lei
  rationale: נצר tem o sentido de guardar, vigiar ou conservar. Com תורה como objeto, «observar a Lei» expressa de modo natural em português o cumprimento cuidadoso da instrução divina.
- source_word: תורה
  choice: a Lei
  rationale: Embora תורה também possa significar «instrução» ou «ensino», aqui o vínculo com a confiança no SENHOR favorece seu sentido religioso e pactual; «a Lei» é claro e tradicional sem excluir a dimensão de instrução.
- source_word: שומר נפשו
  choice: protege a própria vida
  rationale: נפש designa aqui a vida ou a própria pessoa, não uma «alma» separada do corpo. «Protege a própria vida» comunica a ideia de preservação pessoal e mantém o campo semântico de guardar.
- source_word: ובוטח ביהוה
  choice: e quem confia no SENHOR
  rationale: A construção participial hebraica tem valor geral. «Quem confia» soa natural em português, e SENHOR representa o nome divino יהוה segundo a convenção bíblica adotada.
- source_word: לא יבוש
  choice: não será envergonhado
  rationale: בוש pode indicar sofrer vergonha ou ver frustrada a própria confiança. A forma passiva «não será envergonhado» preserva o idioma bíblico e se encaixa diretamente no contexto de confiar no SENHOR.
theological_decisions:
- issue: Representação de יהוה
  choice: SENHOR
  alternative: Javé
  rationale: A forma em versaletes, aqui representada por maiúsculas, segue a convenção judaico-cristã amplamente reconhecida para o tetragrama sem impor uma vocalização discutida.
- issue: Divergência substancial entre o hebraico e o paralelo grego
  choice: Traduzir no texto principal o testemunho hebraico existente e registrar o grego em nota
  alternative: 'Adotar o texto grego: «até que retribua a cada pessoa segundo os seus atos, e as obras das pessoas segundo os seus pensamentos»'
  rationale: O hebraico conservado apresenta um dito completo e é a fonte principal solicitada. Como o grego contém uma sentença inteiramente diferente, harmonizar os dois apagaria uma tensão textual genuína; a nota preserva ambos os testemunhos.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. «Observa a Lei» evita o possível sentido meramente físico de «guarda», enquanto «protege a própria vida» torna explícito o valor contextual de נפש. O marcador [a] aparece no texto principal.
