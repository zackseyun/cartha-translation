  text: And fulfill your desire in the fear of God[a], and not with any lack.
translation:
  language: pt
  text: E realize o seu desejo no temor de Deus[a], sem falta alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Dê ao Altíssimo conforme o dom que ele lhe concedeu e, com generosidade, conforme aquilo que a sua mão encontrar”. O testemunho grego reflete uma forma do versículo substancialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: E realize
  rationale: O piel de שלם, em forma exortativa, comunica levar algo à sua realização ou completude. “Realize” combina naturalmente com “desejo” e evita sugerir pagamento, embora “complete” também seja possível.
- source_word: רצון
  choice: o seu desejo
  rationale: רצון pode significar desejo, vontade, agrado ou favor. Neste contexto, “desejo” preserva o sentido pessoal e se ajusta à exortação, sem tornar a expressão excessivamente abstrata.
- source_word: ביראת אל
  choice: no temor de Deus
  rationale: Mantém o conhecido idioma sapiencial hebraico, no qual “temor” expressa reverência diante de Deus. A preposição ב pode indicar esfera ou circunstância, adequadamente representada por “no”.
- source_word: אל
  choice: Deus
  rationale: אל é aqui uma designação divina comum; “Deus” é a tradução mais clara e natural em português.
- source_word: ולא בחסר כל
  choice: sem falta alguma
  rationale: A frase hebraica é concisa e literalmente indica ausência de qualquer falta ou deficiência. “Sem falta alguma” conserva essa abrangência e soa natural, sem acrescentar um objeto ou agente que o hebraico não explicita.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego nesta exortação sapiencial divergente
  choice: Seguir o hebraico preservado no texto principal e registrar em nota a redação grega substancialmente diferente.
  alternative: “Dê ao Altíssimo conforme o dom que ele lhe concedeu e, com generosidade, conforme aquilo que a sua mão encontrar.”
  rationale: Como o texto hebraico está preservado com alta confiança, ele deve reger a tradução. O grego constitui testemunho antigo relevante, mas parece refletir uma forma textual diferente; harmonizá-lo com o hebraico apagaria uma divergência textual genuína.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A formulação mantém a concisão e certa compressão do hebraico, sem resolver indevidamente o alcance de “desejo” nem especificar em que consiste a “falta”.
