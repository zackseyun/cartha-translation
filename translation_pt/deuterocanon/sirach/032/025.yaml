  text: until he judges the case of his people and gladdens them with his mercy[a].
translation:
  language: pt
  text: até que julgue a causa do seu povo e os alegre com a sua misericórdia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até que decida a causa do seu povo»; ou: «até que faça justiça ao seu povo». A expressão grega é formalmente repetitiva e pode ser uma maneira idiomática de falar da emissão ou execução de um julgamento.'
    reason: Preserva as principais possibilidades lexicais e a ambiguidade da expressão judicial grega.
lexical_decisions:
- source_word: ἕως
  choice: até que
  rationale: Marca o ponto final da ação anterior e introduz naturalmente, em português, uma oração com subjuntivo.
- source_word: κρίνῃ
  choice: julgue
  rationale: O presente do subjuntivo após «até que» reproduz o valor da forma grega e mantém o vínculo lexical com κρίσιν.
- source_word: τὴν κρίσιν
  choice: a causa
  rationale: Na expressão algo repetitiva κρίνειν τὴν κρίσιν, «causa» comunica com naturalidade a matéria submetida a julgamento, sem impor se o resultado é condenação ou vindicação.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: do seu povo
  rationale: Preserva a construção genitiva e a ambiguidade entre uma causa pertencente ao povo, relativa ao povo ou defendida em favor dele.
- source_word: εὐφράνει
  choice: os alegre
  rationale: Conserva o sentido causativo de fazer o povo alegrar-se; o pronome retoma coletivamente «seu povo».
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: com a sua misericórdia
  rationale: Expressa de modo natural o provável valor instrumental ou associativo de ἐν, sem excluir a ideia de que a misericórdia seja também a esfera dessa alegria.
theological_decisions:
- issue: Sentido da expressão judicial κρίνῃ τὴν κρίσιν
  choice: julgue a causa do seu povo
  alternative: decida a causa do seu povo; faça justiça ao seu povo
  rationale: A expressão grega é formalmente repetitiva e pode indicar a decisão de uma causa ou a execução da justiça em favor do povo. O texto principal mantém a imagem judicial sem decidir além do grego se há sobretudo adjudicação, vindicação ou justiça executada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Julgue a causa» evita o artificial «julgue o julgamento», mas conserva o campo judicial e a tensão interpretativa mediante nota.
