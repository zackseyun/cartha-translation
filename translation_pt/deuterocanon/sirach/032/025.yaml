  source_fidelity: «até que julgue a causa do seu povo» reproduz adequadamente ἕως κρίνῃ τὴν κρίσιν τοῦ λαοῦ αὐτοῦ. «Causa» é uma solução portuguesa natural para a expressão grega repetitiva, sem reduzir indevidamente a ambiguidade entre decidir uma causa e fazer justiça. «e os alegre com a sua misericórdia» conserva o valor causativo de εὐφράνει e o sentido instrumental/associativo de ἐν τῷ ἐλέει αὐτοῦ.
  naturalness: O texto é fluente, digno e compreensível no português internacional com boa legibilidade brasileira. O subjuntivo em «até que julgue» é apropriado, e «os alegre» é uma forma correta e concisa no registro bíblico-literário moderno.
