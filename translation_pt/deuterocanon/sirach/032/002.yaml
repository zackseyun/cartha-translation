translation:
  language: pt
  text: para que você se alegre com a honra deles e receba uma recompensa pela instrução[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma leitura muito diferente: “Quem dá atenção aos mandamentos oferece um sacrifício de comunhão.” O texto principal segue o testemunho hebraico preservado.'
    reason: alternative_reading
  - marker: b
    text: Ou “disciplina”, “correção” ou “boa ordem”. O hebraico מוסר abrange vários sentidos próprios da literatura sapiencial.
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  choice: para que
  rationale: Introduz finalidade ou resultado e corresponde de modo natural à força do hebraico.
- source_word: תשמח
  choice: você se alegre
  rationale: שמח expressa alegria; a formulação preserva o sentido e usa português moderno amplamente compreensível.
- source_word: בכבודם
  choice: com a honra deles
  rationale: כבוד pode significar “honra” ou “glória”. A construção mantém em aberto se a honra pertence a eles ou lhes é prestada.
- source_word: ועל
  choice: e ... pela
  rationale: Liga a segunda oração e apresenta a instrução como base ou ocasião da recompensa.
- source_word: מוסר
  choice: instrução
  rationale: O termo pode designar instrução, disciplina, correção ou boa ordem. “Instrução” se ajusta ao registro sapiencial sem impor um sentido punitivo.
- source_word: תשא
  choice: receba
  rationale: Embora נשא signifique literalmente “levantar” ou “carregar”, com שכר tem o sentido idiomático de receber ou obter recompensa.
- source_word: שכר
  choice: recompensa
  rationale: Expressa compensação ou retribuição e é mais apropriado ao contexto sapiencial do que o sentido comercial de “salário”.
theological_decisions:
- issue: Primazia do testemunho hebraico diante da leitura grega divergente
  choice: Traduzir diretamente a linha preservada em hebraico e registrar a leitura grega em nota.
  alternative: “Quem dá atenção aos mandamentos oferece um sacrifício de comunhão.”
  rationale: O hebraico existente pertence ao contexto do banquete e difere substancialmente do paralelo grego. Como o testemunho hebraico está preservado, ele fundamenta o texto principal; a leitura grega é apresentada sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” para representar a segunda pessoa singular. A expressão “com a honra deles” conserva a ambiguidade do hebraico quanto à honra possuída por eles ou demonstrada a eles. Evitou-se acrescentar um possessivo a “instrução”, pois ele não está expresso no hebraico.
