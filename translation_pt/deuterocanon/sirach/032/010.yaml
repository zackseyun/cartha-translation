  text: Before hail[a], lightning flashes forth; and before shame[b], favor goes forth.
translation:
  language: pt
  text: Antes do granizo, o relâmpago irrompe; e antes da vergonha, o favor[a] se manifesta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “graça”, em vez de “favor” (hebraico חֵן).
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego deste versículo difere substancialmente: “Com bons olhos, glorifica o Senhor e não diminuas as primícias das tuas mãos.” O texto principal segue aqui o testemunho hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי
  choice: antes de
  rationale: Mantém o sentido temporal e sequencial que estrutura os dois membros do provérbio.
- source_word: בָרָד
  choice: granizo
  rationale: Equivalente português comum e direto do termo meteorológico hebraico.
- source_word: יִנְצַח
  choice: irrompe / manifesta-se
  rationale: Neste contexto, o verbo indica surgir ou aparecer de antemão, não vencer. A variação em português preserva o mesmo sentido contextual com combinações naturais para relâmpago e favor.
- source_word: בָּרָק
  choice: relâmpago
  rationale: Tradução padrão do termo hebraico, em associação natural com granizo.
- source_word: בוֹשׁ
  choice: vergonha
  rationale: Reproduz diretamente o sentido de vergonha ou desonra e é natural no português contemporâneo.
- source_word: חֵן
  choice: favor
  rationale: O termo pode significar favor, graça ou encanto. Aqui, “favor” preserva melhor o provável sentido social do provérbio sem lhe acrescentar carga teológica indevida.
theological_decisions:
- issue: Tradução de חֵן em contexto sapiencial
  choice: favor
  alternative: graça; encanto
  rationale: O contexto não trata explicitamente da graça salvífica. “Favor” mantém o sentido social e ético possível, enquanto a nota conserva a alternativa lexical “graça”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Irrompe” comunica vividamente o aparecimento do relâmpago; “manifesta-se” evita a formulação pouco natural “o favor sai” e conserva o paralelismo sem forçar identidade verbal absoluta.
