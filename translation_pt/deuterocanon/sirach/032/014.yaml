base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/014.yaml
  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
translation:
  language: pt
  text: Quem busca o que agrada a Deus aceitará a instrução[a], e quem o busca desde cedo obterá resposta por meio de sua oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega diz: “Não ofereça subornos, pois ele não os aceitará.” O testemunho hebraico preservado neste ponto difere substancialmente do grego.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש חפצי אל
  choice: Quem busca o que agrada a Deus
  rationale: O particípio expressa uma busca contínua, e a construção condensada חפצי אל é vertida de modo natural como aquilo que agrada a Deus, sem restringi-la a uma formulação doutrinária específica.
- source_word: יקח לקח
  choice: aceitará a instrução
  rationale: A expressão significa literalmente tomar ou receber ensino; “aceitará a instrução” comunica de maneira idiomática a disposição de acolher o ensino.
- source_word: ומשחרהו
  choice: e quem o busca desde cedo
  rationale: שחר pode indicar buscar cedo e, por extensão, buscar com empenho. A tradução preserva a imagem temporal do hebraico, enquanto o pronome remete naturalmente a Deus.
- source_word: ישיג מענה
  choice: obterá resposta
  rationale: Mantém o sentido direto de alcançar ou obter uma resposta em português corrente.
- source_word: ויענהו בתפלתו
  choice: por meio de sua oração
  rationale: A formulação relaciona a resposta à oração sem decidir de modo excessivamente específico se a preposição indica meio ou esfera.
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: não adotado no texto principal
  rationale: A tradição grega diverge substancialmente do testemunho hebraico preservado. Como o hebraico é a fonte principal onde subsiste, a leitura grega é registrada em nota como variante textual importante.
theological_decisions:
- issue: Divergência entre as tradições textuais hebraica e grega
  choice: Traduzir o testemunho hebraico preservado no texto principal e registrar a leitura grega em nota.
  alternative: 'Traduzir a leitura grega: “Não ofereça subornos, pois ele não os aceitará.”'
  rationale: As leituras têm sentidos materialmente distintos. A prioridade dada ao hebraico não deve ocultar a antiga tradição grega nem resolver silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Desde cedo” conserva a imagem hebraica, e “por meio de sua oração” mantém aberta a relação exata entre oração e resposta.
