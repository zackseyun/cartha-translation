  yaml_path: translation/deuterocanon/sirach/032/005.yaml
  text: Like a gold ornament set with onyx and sapphire[c][b][a], so are beautiful words at a banquet of wine.
translation:
  language: pt
  text: Como um adorno de ouro incrustado de ônix[a] e safira[b], assim são belas palavras num banquete de vinho.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação da pedra hebraica aqui traduzida como “ônix” é incerta; outras pedras também têm sido propostas.
    reason: lexical_alternative
  - marker: b
    text: A “safira” dos textos antigos talvez não corresponda exatamente à gema moderna; alguns a identificam como lápis-lazúli.
    reason: lexical_alternative
  - marker: c
    text: O paralelo grego fornecido para este versículo não corresponde ao texto hebraico aqui traduzido e parece refletir outro alinhamento textual.
    reason: textual_variant
lexical_decisions:
- source_word: כרביד זהב
  choice: Como um adorno de ouro
  rationale: רביד designa um adorno, provavelmente usado no pescoço. “Adorno” conserva a imagem sem definir com excessiva precisão sua forma, e כ introduz a comparação.
- source_word: נפך
  choice: ônix
  rationale: A identificação moderna dessa pedra preciosa é incerta. “Ônix” segue uma identificação tradicional plausível, enquanto a nota preserva a incerteza lexical.
- source_word: ספיר
  choice: safira
  rationale: É a tradução convencional de ספיר, embora a pedra antiga talvez fosse lápis-lazúli; a nota registra essa possível diferença.
- source_word: כך נאים דברים יפים
  choice: assim são belas palavras
  rationale: A formulação mantém concisa a comparação estética entre o adorno e a fala apropriada e agradável.
- source_word: על משתה היין
  choice: num banquete regado a vinho
  rationale: A expressão descreve um banquete marcado pelo consumo de vinho. A tradução é natural em português e preserva o contexto social concreto.
theological_decisions:
- issue: Alinhamento entre a testemunha hebraica e o paralelo grego fornecido
  choice: Traduzir a testemunha hebraica de Ben Sira
  alternative: Seguir o texto grego fornecido, que fala em afastar-se do mal e da injustiça
  rationale: O hebraico é coerente e tem alta confiança para este versículo, ao passo que o paralelo grego fornecido não corresponde semanticamente a ele e parece pertencer a outro alinhamento textual.
translation_notes:
  register: Português atual, digno e de leitura ampla, com imagem poética preservada. “Banquete regado a vinho” comunica de modo natural o hebraico sem sugerir juízo moral adicional.
