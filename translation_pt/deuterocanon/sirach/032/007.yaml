base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/007.yaml
  text: Speak[a], young man, if there is need for you to do so, with restraint[b], two or three times if you are asked.
translation:
  language: pt
  text: Fale, jovem, se for necessário; com moderação[a][b], duas ou três vezes, se lhe perguntarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico בחזק é incerto nesta linha. A tradução “com moderação” segue o contexto de fala comedida; o paralelo grego transmitido difere substancialmente.
    reason: textual_variant
  - marker: b
    text: Outras possibilidades são “brevemente” ou “com cuidado”; o testemunho hebraico deste versículo apresenta dificuldade textual.
    reason: lexical_alternative
lexical_decisions:
- source_word: דבר
  choice: Fale
  rationale: Imperativo direto de דבר; “fale” é natural em português e preserva a exortação.
- source_word: נער
  choice: jovem
  rationale: O substantivo hebraico masculino singular designa aqui um jovem do sexo masculino. Em português, “jovem” funciona naturalmente como substantivo masculino neste contexto, sem tornar a expressão pesada.
- source_word: אם צריך אתה
  choice: se for necessário
  rationale: Expressa a condição de necessidade ou conveniência de falar. A formulação idiomática em português mantém a referência implícita ao interlocutor.
- source_word: בחזק
  choice: com moderação
  rationale: A forma hebraica é textualmente difícil. No contexto de fala comedida por parte de um jovem, “com moderação” transmite o provável sentido de contenção sem impor uma reconstrução excessivamente específica.
- source_word: פעמים ושלש
  choice: duas ou três vezes
  rationale: Reproduz de modo natural a expressão hebraica “duas vezes e três”, indicando repetição limitada.
- source_word: אם ישאלך
  choice: se lhe perguntarem
  rationale: Expressa naturalmente a condição hebraica sem acrescentar um sujeito específico; “lhe” conserva a referência ao jovem interpelado.
