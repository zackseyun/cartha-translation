translation:
  language: pt
  text: O homem sábio não aceitará suborno, mas o zombador arrogante[a] não guardará a lei[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico זד ולץ também pode ser entendido como dois rótulos de caráter: “o arrogante e o zombador”, em vez da expressão combinada “o zombador arrogante”.'
    reason: alternative_reading
  - marker: b
    text: Ou “a instrução”. O hebraico תורה pode indicar ensino autorizado em sentido mais amplo, e não somente uma lei ou um código legal.
    reason: lexical_alternative
  - marker: c
    text: O paralelo grego transmitido para este versículo não corresponde a esta linha hebraica; por isso, a tradução segue principalmente o testemunho hebraico preservado.
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  choice: o homem sábio
  rationale: O hebraico traz explicitamente um substantivo masculino singular. A formulação conserva essa forma e continua natural como máxima proverbial.
- source_word: לא יקח
  choice: não aceitará
  rationale: O yiqtol expressa aqui uma conduta característica. “Aceitará” comunica com naturalidade a ideia de receber deliberadamente um suborno.
- source_word: שחד
  choice: suborno
  rationale: É o equivalente português direto e corrente para a vantagem indevida indicada pelo termo hebraico.
- source_word: זד ולץ
  choice: o zombador arrogante
  rationale: Os dois qualificativos formam uma descrição compacta de um tipo moral. “Arrogante” reflete זד, e “zombador” preserva o sentido sapiencial de לץ; a possibilidade de dois rótulos coordenados é mantida em nota.
- source_word: לא ישמור
  choice: não guardará
  rationale: שמר com תורה significa guardar ou observar. “Guardará” conserva a imagem verbal hebraica sem impedir o sentido de obedecer.
- source_word: תורה
  choice: a lei
  rationale: Neste contraste ético, “a lei” expressa ensino normativo e autorizado. Como תורה também pode designar instrução em sentido mais amplo, essa alternativa é registrada em nota.
theological_decisions:
- issue: Sentido de תורה em contexto sapiencial
  choice: a lei
  alternative: a instrução; o ensinamento
  rationale: “A lei” preserva a força normativa do termo neste contexto moral, sem negar que תורה possa abranger ensino autorizado mais amplo; essa amplitude lexical é explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo proverbial, o masculino explícito do hebraico e a linguagem tradicional de “guardar a lei”, esclarecendo em notas as ambiguidades lexical e textual.
