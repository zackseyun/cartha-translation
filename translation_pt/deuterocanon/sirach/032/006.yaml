base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: pt
  text: Como engastes de ouro e um selo de berilo[a], assim é o som de um salmo com a doçura do vinho novo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um sinete de esmeralda». A identificação de ברקת é incerta; «berilo» é uma opção comum entre os estudiosos.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego fornecido para este versículo diz: «Não apareças de mãos vazias diante do Senhor», refletindo outra tradição textual ou numeração. A tradução principal segue o testemunho hebraico existente.'
    reason: textual_variant
lexical_decisions:
- source_word: מלואות פז
  choice: engastes de ouro
  rationale: A expressão é elíptica e poética. פז denota ouro fino, e מלואות provavelmente evoca engastes ou encaixes ornamentais; «engastes de ouro» conserva de modo natural a imagem de joalheria.
- source_word: חותם ברקת
  choice: um selo de berilo
  rationale: חותם pode designar selo ou sinete. ברקת é uma pedra preciosa de identificação incerta, tradicionalmente entendida como berilo ou esmeralda; a formulação evita acrescentar a ideia de anel, não exigida pelo hebraico.
- source_word: קול מזמור
  choice: o som de um salmo
  rationale: קול significa voz ou som, e מזמור, cântico ou salmo, frequentemente musical. «Som de um salmo» preserva o caráter poético e possivelmente litúrgico.
- source_word: על נועם תירוש
  choice: junto à doçura do vinho novo
  rationale: תירוש é vinho novo, e נועם expressa agrado, suavidade ou doçura. A preposição על é difícil neste contexto; «junto à» mantém a associação ou acompanhamento sem determinar além do necessário a relação sintática.
theological_decisions:
- issue: Uso do hebraico diante do paralelo grego divergente
  choice: Traduzir no texto principal a linha poética preservada no testemunho hebraico.
  alternative: 'Seguir o grego: «Não apareças de mãos vazias diante do Senhor».'
  rationale: O hebraico existente e o grego fornecido não são equivalentes semânticos, indicando tradição textual ou numeração diferente. Como o hebraico sobrevive neste ponto, ele rege a tradução; a divergência grega é registrada em nota para transparência.
translation_notes:
  register: Português atual, digno e de leitura ampla, com imagem poética compacta. «Engastes» preserva a linguagem de joalheria; «junto à» mantém aberta a relação difícil expressa por על. Os marcadores seguem a ordem em que aparecem no texto.
