  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: pt
  text: Bela é a misericórdia no tempo da aflição dele[a][b], como nuvens de chuva num tempo sem chuva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A misericórdia é oportuna num tempo de aflição.” O adjetivo grego pode destacar beleza, encanto ou adequação à ocasião.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz “aflição dele”, empregando um pronome masculino singular em sentido genérico, como é comum em máximas sapienciais.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: bela
  rationale: O adjetivo pode indicar beleza, encanto ou adequação ao momento. “Bela” preserva sua força avaliativa e combina com a imagem poética das nuvens de chuva.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Expressa misericórdia ou auxílio compassivo; “misericórdia” é a correspondência mais direta e mantém o peso do termo grego.
- source_word: ἐν καιρῷ
  choice: no tempo de / num tempo de
  rationale: Mantém a ênfase temporal repetida nas duas partes do versículo, com formulação natural em português.
- source_word: θλίψεως
  choice: aflição
  rationale: Abrange sofrimento, pressão e dificuldade sem restringir indevidamente o tipo de adversidade.
- source_word: αὐτοῦ
  choice: dele
  rationale: Reproduz explicitamente o pronome masculino singular grego, empregado de modo representativo na máxima sapiencial, e evita a possível ambiguidade de “sua”.
- source_word: νεφέλαι ὑετοῦ
  choice: nuvens de chuva
  rationale: É uma expressão portuguesa clara e idiomática que conserva a imagem de nuvens portadoras de chuva.
- source_word: ἀβροχίας
  choice: um tempo sem chuva
  rationale: Traduz diretamente a ausência de chuva e preserva o paralelismo temporal do grego, em vez de condensá-la interpretativamente como “seca”.
theological_decisions:
- issue: Pronome masculino singular genérico αὐτοῦ na máxima sapiencial
  choice: “dele” no texto principal
  alternative: “de alguém”, “da pessoa” ou omissão do pronome
  rationale: O grego apresenta um masculino singular com sentido representativo. A tradução conserva essa forma sem transformar a referência em linguagem neutra, enquanto a nota esclarece seu emprego genérico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Bela é a misericórdia” conserva o destaque poético do predicativo inicial grego; “dele” torna explícito o pronome da fonte, e “num tempo sem chuva” mantém o paralelismo entre as duas ocorrências de ἐν καιρῷ.
