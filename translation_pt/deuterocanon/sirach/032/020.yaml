base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/020.yaml
  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: pt
  text: Não ande por um caminho cheio de obstáculos[a][b] e não tropece duas vezes no mesmo obstáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um caminho de מוקשות”. O termo pode indicar laços, armadilhas ou obstáculos que fazem tropeçar.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego difere substancialmente: “Quem serve com boa vontade será aceito, e sua súplica chegará até as nuvens”. O texto principal segue o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: por um caminho
  rationale: דרך designa caminho, estrada ou modo de viver. “Caminho” conserva tanto a imagem concreta quanto sua possível dimensão figurada.
- source_word: מוקשות
  choice: cheio de obstáculos
  rationale: O termo pode indicar coisas que prendem, fazem tropeçar ou constituem armadilhas. “Cheio de obstáculos” combina naturalmente com o verbo “tropeçar” da segunda oração sem limitar o sentido a armadilhas ocultas.
- source_word: אל תלך
  choice: Não ande
  rationale: הלך significa andar ou ir. “Não ande” preserva a metáfora sapiencial do caminho e soa natural como advertência.
- source_word: ואל תתקל
  choice: e não tropece
  rationale: No contexto, a forma verbal descreve esbarrar ou vir a cair por causa de um impedimento; “tropece” mantém de modo claro a imagem do hebraico.
- source_word: בנגף
  choice: no mesmo obstáculo
  rationale: נגף pode referir-se a golpe, causa de queda ou impedimento. “Obstáculo” preserva a ligação com o tropeço. “Mesmo” explicita em português a ideia contextual de repetir a queda duas vezes diante da mesma causa.
- source_word: פעמים
  choice: duas vezes
  rationale: 'O termo tem aqui seu sentido adverbial numérico direto: “duas vezes”.'
