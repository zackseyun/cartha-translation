  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
translation:
  language: pt
  text: Quem teme Yahweh compreenderá o juízo[a] e, desde o alvorecer[b], fará brotar do coração palavras de sabedoria.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os testemunhos hebraicos variam: alguns trazem “compreenderá o juízo”; outros, “compreenderão o seu juízo”.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida como “desde o alvorecer” é incerta; também pode significar “cedo” ou referir-se, de modo mais geral, ao romper do dia ou ao crepúsculo.
    reason: lexical_alternative
  - marker: c
    text: 'Outra forma da linha hebraica diz: “Os que temem Yahweh compreenderão o seu juízo e, com muita sabedoria, farão sair do coração”. O objeto de “farão sair” não é expresso no hebraico.'
    reason: textual_variant
  - marker: d
    text: O paralelo grego preservado para este versículo tem uma redação substancialmente diferente, o que indica uma tradição textual divergente neste ponto.
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  choice: quem teme Yahweh
  rationale: A formulação singular funciona como singular representativo em português e segue o primeiro testemunho hebraico; a variante plural é registrada em nota. יהוה é transliterado como “Yahweh”.
- source_word: יבין / יבינו
  choice: compreenderá
  rationale: בין expressa compreender ou discernir. “Compreenderá” é claro e natural neste contexto sapiencial.
- source_word: משפט / משפטו
  choice: o juízo
  rationale: “Juízo” preserva a amplitude de משפט sem reduzi-lo a “justiça” ou “o que é certo”. A oscilação textual entre a forma absoluta e “seu juízo” é mantida em nota.
- source_word: מנשף
  choice: desde o alvorecer
  rationale: נשף pode designar o romper do dia ou o crepúsculo. “Desde o alvorecer” oferece uma leitura natural, enquanto a incerteza lexical é explicitada em nota.
- source_word: יוציא / יוציאו
  choice: fará brotar
  rationale: A forma causativa comunica a ideia de fazer sair ou trazer para fora; “fará brotar” preserva a imagem de algo que procede do interior.
- source_word: תחבולום / ובחכמות רבות
  choice: palavras de sabedoria
  rationale: Os testemunhos apresentam formulações difíceis e divergentes, ligadas a conselhos ou a múltiplas expressões de sabedoria. “Palavras de sabedoria” comunica o provável referente sapiencial sem impor a tradução pouco idiomática “muitas sabedorias”.
- source_word: מלבם
  choice: do coração
  rationale: Mantém a imagem antropológica hebraica do coração como sede do pensamento e da sabedoria. O singular harmoniza-se com o sujeito representativo singular; a forma plural da variante é conservada na nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” representa diretamente o Tetragrama e evita substituir o nome por um título.
- issue: Prioridade do hebraico diante do paralelo grego divergente
  choice: Traduzir a tradição hebraica e registrar a divergência grega em nota
  alternative: Traduzir o grego ou harmonizar as duas tradições
  rationale: O hebraico sobrevivente é a fonte principal para esta passagem. O grego preserva uma redação substancialmente diferente e, por isso, serve como testemunho da história textual, não como base para uma harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação principal mantém a concisão proverbial e sinaliza, sem harmonização silenciosa, a instabilidade dos testemunhos hebraicos e a divergência do grego.
