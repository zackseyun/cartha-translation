  text: Do not trust in a way of stumbling[b][a], and in your end be on guard.
translation:
  language: pt
  text: Não confie num caminho que leva à queda[a][b] e, quanto ao seu desfecho, fique alerta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico מחתף é difícil; provavelmente se refere a algo que causa tropeço ou queda. Outras traduções possíveis são “um caminho escorregadio” e “uma vereda traiçoeira”.
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego fornecido com a fonte parece corresponder a outro versículo; por isso, não foi seguido onde diverge do testemunho hebraico preservado.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: Não confie
  rationale: בטח expressa confiar ou apoiar-se em algo; a formulação direta conserva o tom de advertência.
- source_word: בדרך
  choice: num caminho
  rationale: דרך pode designar uma estrada literal ou um modo de proceder. “Caminho” preserva essa amplitude e a metáfora hebraica.
- source_word: מחתף
  choice: que leva à queda
  rationale: O termo é difícil, mas parece indicar algo que provoca tropeço ou queda. Esta tradução comunica o sentido provável sem especificar indevidamente se o caminho é escorregadio, traiçoeiro ou figurativamente perigoso.
- source_word: ובאחריתך
  choice: e, quanto ao seu desfecho
  rationale: אחרית pode indicar fim, resultado ou futuro. “Seu desfecho” preserva o sufixo possessivo e mantém aberta a referência ao resultado final da conduta ou ao fim da vida.
- source_word: השמר
  choice: fique alerta
  rationale: O imperativo reflexivo pede que a pessoa se guarde ou tenha cautela; “fique alerta” é atual, claro e mantém a ideia de vigilância.
