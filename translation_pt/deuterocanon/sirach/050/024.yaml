base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: pt
  text: Que a sua misericórdia permaneça fiel para com Shimon[a], e que ele estabeleça para ele a aliança de Fineias[b], a qual não será cortada dele nem de sua descendência enquanto durarem os dias do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Que ele nos confie a sua misericórdia e, em seus dias, nos redima.” Essa forma difere substancialmente do hebraico preservado, que fala de Shimon e da aliança de Fineias.'
    reason: alternative_reading
  - marker: b
    text: A “aliança de Fineias” alude à aliança sacerdotal duradoura de Números 25:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: Que a sua misericórdia permaneça fiel para com Shimon
  rationale: A formulação conserva separadamente a ideia de firmeza ou fidelidade de יֵאָמֵן e o sentido de misericórdia, com ressonância de lealdade pactual, de חַסְדּוֹ. “Para com” expressa em português natural a relação indicada por עִם sem apagar sua força relacional.
- source_word: וְיָקֶם לוֹ בְּרִית פִּינְחָס
  choice: e que ele estabeleça para ele a aliança de Fineias
  rationale: O hifil de קום com בְּרִית significa estabelecer ou confirmar uma aliança. “Estabeleça” preserva a linguagem pactual, e “Fineias” é a forma portuguesa reconhecível do nome.
- source_word: אֲשֶׁר לֹא יִכָּרֵת לוֹ
  choice: a qual não será cortada dele
  rationale: “Cortada” mantém a imagem e a textura jurídica e pactual de כרת, em vez de substituí-la por uma explicação como “não cessará”.
- source_word: וּלְזַרְעוֹ
  choice: nem de sua descendência
  rationale: No contexto genealógico, זרע designa os descendentes. “Nem” liga naturalmente este membro à negação anterior.
- source_word: כִּימֵי שָׁמָיִם
  choice: enquanto durarem os dias do céu
  rationale: A expressão torna explícita a força temporal do idioma hebraico, preservando ao mesmo tempo sua imagem poética.
theological_decisions:
- issue: Relação entre o texto hebraico sobre Shimon e o texto grego paralelo
  choice: Dar primazia ao hebraico preservado, que menciona Shimon e a aliança de Fineias, registrando a leitura grega em nota.
  alternative: 'Seguir o grego: “Que ele confie sua misericórdia conosco e, nos dias dele, nos redima.”'
  rationale: As duas formas diferem substancialmente e provavelmente refletem tradições textuais distintas. Como o hebraico de Sirácida está preservado neste ponto, ele fundamenta o texto principal; o grego é apresentado sem harmonização silenciosa.
- issue: Valor de חֶסֶד em associação com יֵאָמֵן
  choice: “sua misericórdia permaneça fiel”
  alternative: “seu amor fiel esteja”
  rationale: A escolha conserva tanto a dimensão de misericórdia de חֶסֶד, apoiada pelo grego ἔλεος, quanto a noção verbal de firmeza ou fidelidade de יֵאָמֵן, sem fundir os dois termos.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Mantêm-se a imagem hebraica “cortada” e a expressão poética “dias do céu”. O nome Shimon é transliterado do hebraico; Fineias segue a forma portuguesa amplamente reconhecida.
