  text: like a blossom of Lebanon in the days of summer[a], and like a fire of frankincense upon the grain offering.
translation:
  language: pt
  text: como uma flor do Líbano nos dias de verão[a], e como um fogo de olíbano sobre a oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego apresenta uma sequência diferente de comparações: “como flor de rosas nos dias da juventude, como lírios junto às saídas das águas, como brotos do Líbano nos dias de verão”. Ele não traz a imagem hebraica de “fogo de olíbano sobre a oferta de cereal”. O texto principal segue o testemunho hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח
  choice: como uma flor
  rationale: O prefixo כְּ expressa comparação, e פֶּרַח designa flor ou botão. “Flor” é natural e preserva a imagem poética.
- source_word: לְבָנוֹן
  choice: do Líbano
  rationale: Mantém a construção hebraica e a associação poética com a vegetação do Líbano.
- source_word: בִּימֵי קָיִץ
  choice: nos dias de verão
  rationale: Reproduz de perto a expressão temporal hebraica e conserva sua cadência poética.
- source_word: וּכְאֵשׁ
  choice: e como fogo
  rationale: Preserva a comparação concreta e incomum do texto hebraico, sem suavizá-la.
- source_word: לְבוֹנָה
  choice: de olíbano
  rationale: לְבוֹנָה designa especificamente o olíbano, resina aromática usada no culto, e não incenso em sentido genérico.
- source_word: עַל הַמִּנְחָה
  choice: sobre a oferta de cereal
  rationale: No contexto cultual, מִנְחָה se refere à oferta feita de cereal; a formulação é clara e mantém a especificidade sacrificial.
theological_decisions:
- issue: Sentido cultual de מִנְחָה
  choice: oferta de cereal
  alternative: oferta
  rationale: A imagem está ligada ao culto do templo. A tradução específica preserva essa dimensão sem introduzir interpretação denominacional.
- issue: Imagem incomum אֵשׁ לְבוֹנָה
  choice: fogo de olíbano
  alternative: olíbano em chamas
  rationale: A formulação mais próxima do hebraico conserva a tensão e a concretude da metáfora, sem explicá-la ou normalizá-la no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Olíbano” preserva a precisão cultual; “oferta de cereal” torna o termo sacrificial compreensível. A ausência de vírgula antes de “e” mantém unidas as duas comparações breves.
