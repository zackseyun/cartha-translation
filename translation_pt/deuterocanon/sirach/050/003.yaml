translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação incomum “muro dos cantos” é mantida deliberadamente para preservar a incerteza arquitetônica do hebraico; as notas explicam tanto essa dificuldade quanto a ampla divergência do testemunho grego.
