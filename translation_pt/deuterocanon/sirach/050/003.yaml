translation:
  language: pt
  text: Em seus dias foi construído o muro dos cantos[a][b], uma morada semelhante a um palácio real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Muro dos cantos” traduz literalmente uma expressão hebraica difícil; ela pode se referir a seções de esquina, torres de esquina ou a um recinto fortificado.
    reason: lexical_alternative
  - marker: b
    text: 'O grego apresenta aqui um texto muito diferente: “Em seus dias, um reservatório de águas foi reduzido, tendo ao redor bronze como o mar”. Isso sugere um texto-base diferente ou uma linha corrompida em uma das tradições.'
    reason: textual_variant
lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: Em seus dias
  rationale: Mantém a expressão temporal concisa do hebraico e associa a obra ao período de atuação do sumo sacerdote.
- source_word: נִבְנָה
  choice: foi construído
  rationale: Reproduz o passivo de בנה sem acrescentar a ideia de reconstrução, que não está explícita no hebraico.
- source_word: קִיר
  choice: muro
  rationale: É o sentido básico do substantivo no contexto arquitetônico; “muro” é mais natural do que “parede” para uma estrutura monumental ou defensiva.
- source_word: פִּנּוֹת
  choice: dos cantos
  rationale: Conserva a formulação difícil e ambígua do hebraico, sem decidir se se trata de seções angulares, torres de esquina ou um recinto fortificado.
- source_word: מָעוֹן
  choice: morada
  rationale: Preserva o sentido lexical de lugar de habitação, embora o contexto possa apontar de modo mais amplo para uma construção imponente.
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: semelhante a um palácio real
  rationale: Expressa naturalmente a comparação e traduz הֵיכָל, em associação com “rei”, no sentido de palácio.
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: usado como testemunho de controle, sem ser seguido no texto principal
  rationale: O grego diverge profundamente do hebraico preservado e parece refletir outro texto-base ou corrupção em uma das tradições; a divergência é registrada em nota.
