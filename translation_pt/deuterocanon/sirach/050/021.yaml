  text: And they bowed down a second time[b][a], to receive blessing from before him.
translation:
  language: pt
  text: E, pela segunda vez, tornaram a prostrar-se[b], para receber as bênçãos de diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “para apresentar a bênção da parte do Altíssimo”, leitura interpretativa que explicita Deus, e não o sacerdote, como fonte da bênção.'
    reason: alternative_reading
  - marker: b
    text: O hebraico diz literalmente “cair”; neste contexto, a expressão se refere à prostração em adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁנוּ ... שֵׁנִית
  choice: pela segunda vez, tornaram a
  rationale: Os dois elementos hebraicos reforçam a repetição do ato. A formulação portuguesa conserva essa ênfase sem recorrer à expressão pouco natural «repetiram sua queda».
- source_word: לִנְפּוֹל
  choice: prostrar-se
  rationale: O infinitivo significa literalmente «cair», mas, neste contexto litúrgico, descreve a prostração em adoração; o paralelo grego προσκύνησις confirma esse sentido.
- source_word: בְּרָכוֹת
  choice: as bênçãos
  rationale: Conserva o plural morfológico do hebraico. O grego traz o singular coletivo «a bênção», mas não exige que se abandone a forma hebraica.
- source_word: לָקַחַת
  choice: receber
  rationale: Embora o verbo possa significar literalmente «tomar», «receber» expressa naturalmente a acolhida da bênção no contexto cultual.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: Preserva a expressão espacial hebraica, literalmente «de diante de sua face/presença», e mantém sem explicitação indevida o referente do pronome.
theological_decisions:
- issue: Referente de מִפָּנָיו e sua relação com a leitura grega
  choice: diante dele
  alternative: da parte do Altíssimo
  rationale: O texto hebraico preservado tem um pronome de terceira pessoa e não nomeia explicitamente Deus. A tradução principal mantém essa ambiguidade; a leitura grega, que explicita o Altíssimo como fonte da bênção, é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. «Tornaram a prostrar-se» comunica o gesto cultual com naturalidade, enquanto «pela segunda vez» preserva a repetição enfática do hebraico. A ordem das notas segue sua ocorrência no versículo.
