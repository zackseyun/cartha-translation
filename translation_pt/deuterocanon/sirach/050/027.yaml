  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: pt
  text: Instrução em entendimento e domínio da expressão[a], por Simão, filho de Jesus, filho de Eleazar, filho de Sira, que fez brotar sabedoria do seu coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “domínio da expressão” é difícil. Pode indicar habilidade no discurso ordenado ou na composição; a nuance exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico do trecho final é incerto nos manuscritos da Geniza e difere da estrutura do paralelo grego: ele contém duas cláusulas difíceis, com verbos que podem evocar brotar ou jorrar e expressar, e termina com uma referência a “entendimentos” ou “discernimentos”. O paralelo grego diz “que fez brotar sabedoria do seu coração” e orienta o texto principal.'
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: Instrução para o entendimento
  rationale: מוּסַר indica ensino de caráter formativo, e שֵׂכֶל especifica entendimento ou discernimento. A formulação mantém o tom de título ou colofão e soa natural em português.
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: e domínio da expressão
  rationale: A frase hebraica é difícil e possivelmente instável. No contexto, parece indicar habilidade na ordenação ou composição do discurso; a tradução comunica esse provável sentido sem esconder a incerteza, registrada em nota.
- source_word: לְשִׁמְעוֹן
  choice: por Simão
  rationale: Neste colofão, a preposição לְ provavelmente assinala autoria ou atribuição. “Por” exprime essa função com clareza.
- source_word: נִיבַּע / ἀνώμβρησεν
  choice: fez brotar
  rationale: O hebraico evoca algo que brota ou jorra, enquanto o grego apresenta a imagem de derramar ou fazer chover. “Fez brotar” conserva a metáfora de expressão abundante e combina naturalmente com “do coração”.
- source_word: בִּפְתוֹר לְבָן / ἀπὸ καρδίας αὐτοῦ
  choice: do seu coração
  rationale: O texto hebraico transmitido é difícil e incerto neste ponto. O paralelo grego traz claramente “do seu coração” e serve de controle textual para a formulação principal.
- source_word: בִּתְבוּנוֹת / σοφίαν
  choice: sabedoria
  rationale: O hebraico sugere “entendimentos”, “discernimentos” ou “com inteligência”, ao passo que o grego lê explicitamente “sabedoria”. Em razão da incerteza do hebraico e da coerência do grego, “sabedoria” é adotado no texto, com a tensão textual explicada em nota.
