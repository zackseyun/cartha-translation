translation_notes:
  register: 'Português moderno, claro e digno, com formas onomásticas amplamente reconhecíveis em português: Simão, Jesus, Eleazar e Sira. A sintaxe preserva o caráter de colofão, enquanto as notas registram tanto a dificuldade lexical quanto a tensão entre o hebraico e o paralelo grego.'
