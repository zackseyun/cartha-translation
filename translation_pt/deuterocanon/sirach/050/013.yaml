    rationale: אִשֵּׁי se refere a ofertas caracterizadas por serem queimadas ou apresentadas no fogo. Em português, "pelo fogo" tende a significar "por meio do fogo" e não funciona como o termo sacrificial usual. "Ofertas queimadas" transmite melhor o valor do hebraico.
