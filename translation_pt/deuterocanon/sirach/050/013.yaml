  verdict: revise
  source_fidelity: 'A tradução preserva a estrutura e o sentido geral do hebraico: as ofertas estavam nas mãos dos sacerdotes, à vista da assembleia. Contudo, "ofertas pelo fogo" não é a formulação portuguesa mais fiel e idiomática para אִשֵּׁי; o composto hebraico designa ofertas queimadas/no fogo, não ofertas feitas "pelo" fogo como agente.'
  naturalness: '"Ofertas pelo fogo" soa pouco natural em português litúrgico contemporâneo e pode sugerir instrumentalidade. "Ofertas queimadas para o SENHOR" é clara, natural e mantém a especificidade cultual do hebraico. O restante é fluente.'
  terminology: '"SENHOR" representa adequadamente o Tetragrama. "Assembleia de Israel" traduz bem קְהַל יִשְׂרָאֵל. "Ofertas queimadas" é um equivalente estabelecido e compreensível para אִשֵּׁי, sem impor uma leitura doutrinária.'
