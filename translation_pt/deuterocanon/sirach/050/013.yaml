lexical_decisions:
- source_word: וְאִשֵּׁי יְהֹוָה
  choice: e as ofertas pelo fogo para o SENHOR
  rationale: אִשֵּׁי designa especificamente ofertas feitas pelo fogo. A formulação explicita esse valor do hebraico com naturalidade em português; “para o SENHOR” expressa o destinatário cultual sem sugerir que as ofertas pertençam materialmente a ele. O grego paralelo traz o termo mais amplo προσφορὰ Κυρίου.
- source_word: בְּיָדָם
  choice: estavam nas mãos deles
  rationale: Preserva a imagem ritual concreta do hebraico e mantém explícito que os sacerdotes seguravam as ofertas.
- source_word: נֶגֶד
  choice: diante de
  rationale: Equivalente natural e digno para a posição pública perante a assembleia reunida.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: קהל refere-se à comunidade reunida, especialmente apropriada aqui ao contexto litúrgico; “toda a assembleia” é corrente e fiel.
theological_decisions:
- issue: Especificidade sacrificial de אִשֵּׁי
  choice: ofertas pelo fogo para o SENHOR
  alternative: ofertas para o SENHOR
  rationale: O testemunho hebraico de alta confiança contém o termo sacrificial específico אִשֵּׁי, ao passo que o grego paralelo generaliza com προσφορά. A tradução principal segue a leitura hebraica sem apagar sua especificidade; a alternativa grega é registrada como dado textual, mas não exige nota no texto curto.
translation_notes:
  register: Português moderno, claro e liturgicamente digno, com legibilidade brasileira. A sintaxe acompanha de perto a linha hebraica sem soar artificial; SENHOR em versaletes tipográficos simulados por maiúsculas representa o Tetragrama.
