  text: May he give you wisdom of heart[b][a], and may there be peace among you.
translation:
  language: pt
  text: Que ele lhes dê sabedoria de coração[a], e que haja paz entre vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz «alegria do coração» em vez de «sabedoria de coração».
    reason: alternative_reading
  - marker: b
    text: 'O grego também amplia a bênção: «e paz em nossos dias, em Israel, como nos dias de outrora».'
    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  choice: Que ele lhes dê
  rationale: O yiqtol tem aqui valor volitivo numa bênção; a construção com «que» comunica naturalmente um desejo ou oração, não uma simples previsão.
- source_word: לָכֶם
  choice: lhes
  rationale: Expressa de modo natural o objeto indireto plural em português.
- source_word: חָכְמַת לֵבָב
  choice: sabedoria de coração
  rationale: Segue o testemunho hebraico e preserva a imagem do coração como centro do discernimento interior. A leitura grega divergente é registrada em nota.
- source_word: וִיהִי
  choice: e que haja
  rationale: Mantém o valor volitivo da fórmula de bênção em português corrente e digno.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a tradução consagrada e abrange tanto a harmonia entre as pessoas quanto o bem-estar.
- source_word: בֵּינֵיכֶם
  choice: entre vocês
  rationale: Representa com clareza o sentido interpessoal da preposição com sufixo plural e mantém boa legibilidade no português brasileiro sem deixar de ser amplamente compreensível.
theological_decisions:
- issue: Escolha do texto principal diante da divergência entre o hebraico e o grego
  choice: Manter no texto principal a leitura hebraica «sabedoria de coração» e a formulação breve «paz entre vocês».
  alternative: 'Adotar a leitura grega «alegria do coração» e sua bênção ampliada: «paz em nossos dias, em Israel, como nos dias de outrora».'
  rationale: Como o hebraico de Ben Sira está preservado aqui com alta confiança, ele rege a tradução. As diferenças significativas do paralelo grego são apresentadas em notas, sem harmonização nem eliminação da tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «que ele lhes dê» preserva o tom de bênção; «sabedoria de coração» conserva deliberadamente o idioma hebraico, e «entre vocês» evita o arcaísmo de «entre vós».
