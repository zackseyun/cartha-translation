translation:
  language: pt
  text: como um vaso de ouro lavrado e com antimônio[a], preso sobre pedras preciosas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do hebraico וְאַנְטִיל é incerto. Pode referir-se ao antimônio ou a algum tipo de incrustação ou adorno. O paralelo grego diz, de modo mais geral, “adornado com toda pedra preciosa”.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego apresenta a imagem de modo mais desenvolvido: “como um vaso de ouro, inteiramente martelado e adornado com toda pedra preciosa”. Isso reforça o sentido geral de ornamentação elaborada no hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּכְלִי זָהָב
  choice: como um vaso de ouro
  rationale: כִּ marca a comparação, e כְּלִי designa aqui um vaso ou objeto trabalhado. “Vaso” mantém a imagem poética de uma peça cerimonial de ouro.
- source_word: מְפֻתָּח
  choice: lavrado
  rationale: O particípio indica trabalho ornamental executado no metal. “Lavrado” é natural em português para metal decorado e evita limitar a técnica especificamente à gravação.
- source_word: וְאַנְטִיל
  choice: e com antimônio
  rationale: O termo hebraico é incerto. “Antimônio” preserva uma possibilidade lexical antiga, enquanto a preposição acrescentada em português torna compreensível seu provável uso ornamental; a incerteza é explicitada em nota.
- source_word: הַנֶּאֱחָז
  choice: engastado
  rationale: O particípio nifal exprime algo preso ou fixado. No contexto de pedras preciosas e ourivesaria, “engastado” comunica de modo natural a fixação ornamental sem eliminar totalmente a imagem material.
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: em pedras preciosas
  rationale: Literalmente, trata-se de pedras desejáveis ou valiosas. “Pedras preciosas” é idiomático e recebe apoio do paralelo grego παντὶ λίθῳ πολυτελεῖ.
