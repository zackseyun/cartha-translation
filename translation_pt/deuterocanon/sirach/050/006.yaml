  text: Like a shining star from among clouds[a], and like the full moon in the days of the feast.
translation:
  language: pt
  text: Como uma estrela brilhante dentre as nuvens[a], e como a lua cheia nos dias da festa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Como a estrela da manhã no meio de uma nuvem”. O hebraico diz, de modo mais geral: “como uma estrela brilhante dentre as nuvens”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: Como uma estrela brilhante
  rationale: כְּ marca a comparação, כוֹכָב significa “estrela” e אוֹר comunica luminosidade. “Estrela brilhante” é natural em português e mantém o testemunho hebraico sem adotar a especificação grega “da manhã”.
- source_word: מִבֵּין עָבִים
  choice: surgindo entre as nuvens
  rationale: A combinação מִן + בֵּין indica procedência do meio de algo, isto é, “do meio de/por entre”. “Surgindo entre as nuvens” expressa naturalmente a imagem de aparecimento ou emergência implícita na construção.
- source_word: וּכְיָרֵחַ מָלֵא
  choice: e como a lua cheia
  rationale: יָרֵחַ é “lua” e מָלֵא, “cheia”. A formulação preserva o paralelismo entre as duas comparações.
- source_word: בִּימֵי מוֹעֵד
  choice: nos dias da festa
  rationale: מוֹעֵד pode designar um tempo determinado ou uma festa. O contexto cultual e a imagem da lua cheia favorecem “festa”, sem identificar uma celebração específica.
theological_decisions:
- issue: Seguir a imagem hebraica de luminosidade ou a expressão grega mais específica “estrela da manhã”
  choice: Manter no texto principal a leitura hebraica “estrela brilhante”
  alternative: Como a estrela da manhã no meio de uma nuvem
  rationale: O hebraico preservado traz אוֹר, ligado à luz ou ao brilho, enquanto o paralelo grego traz ἑωθινός, “da manhã”. A prioridade do texto hebraico recomenda não acrescentar ao texto principal a especificação temporal grega; a variante é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a estrutura poética paralela e a referência genérica à festa.
