base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: pt
  text: Agora, por favor, bendigam o SENHOR, o Deus de Israel, que realiza maravilhas na terra, que engrandece o ser humano desde o ventre e o trata segundo a sua vontade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “e age conosco segundo a sua misericórdia”, em vez de “e o trata segundo a sua vontade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה בָּרְכוּ נָא
  choice: Agora, por favor, bendigam
  rationale: Preserva עַתָּה (“agora”), o imperativo plural de ברך e a força exortativa cortês de נָא em português atual.
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: o SENHOR, o Deus de Israel
  rationale: Emprega a convenção portuguesa amplamente reconhecida para o tetragrama e mantém a aposição hebraica.
- source_word: הַמַּפְלִיא לַעֲשׂוֹת בָּאָרֶץ
  choice: que realiza maravilhas sobre a terra
  rationale: Expressa a ação extraordinária indicada por פלא e entende בָּאָרֶץ em sentido abrangente, coerente com o contexto de louvor.
- source_word: הַמְגַדֵּל אָדָם מֵרֶחֶם
  choice: que engrandece o ser humano desde o ventre
  rationale: “Engrandece” conserva a ideia causativa de tornar grande ou elevar; “o ser humano” comunica o valor representativo de אָדָם sem restringi-lo ao sexo masculino, e “desde o ventre” mantém a imagem hebraica.
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: e o trata segundo a sua vontade
  rationale: A formulação idiomática preserva a ação de Deus para com o ser humano e segue a leitura hebraica בִּרְצוֹנוֹ, sem ocultar a variante grega registrada em nota.
theological_decisions:
- issue: Sentido representativo de אָדָם
  choice: o ser humano
  alternative: o homem
  rationale: No contexto, o singular designa genericamente a pessoa humana; a tradução inclusiva preserva essa abrangência sem transformar o termo em plural.
- issue: Divergência da cláusula final entre o hebraico e o grego
  choice: segundo a sua vontade
  alternative: segundo a sua misericórdia
  rationale: O texto hebraico preservado traz בִּרְצוֹנוֹ (“segundo a sua vontade”) e, por isso, governa o texto principal. A leitura grega é teologicamente significativa e fica registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais correntes no plural. A redação mantém o paralelismo de louvor e evita linguagem arcaica; a variante textual relevante é preservada sem harmonização.
