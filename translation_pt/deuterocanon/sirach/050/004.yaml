translation:
  language: pt
  text: aquele que cuida do seu povo contra a calamidade[a] e fortalece sua cidade contra a aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do desastre repentino”. O paralelo grego diz “da queda” ou “da ruína”, reforçando a ideia de proteção contra a destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fortifica sua cidade contra o cerco”. O paralelo grego aponta mais especificamente para uma ameaça militar.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג לְעַמּוֹ
  choice: aquele que cuida do seu povo
  rationale: O particípio de דאג expressa cuidado ou preocupação contínua. “Cuida do seu povo” é natural em português e mantém o sentido ativo sem acrescentar uma ideia específica de administração.
- source_word: מֵחֶתֶף
  choice: diante da calamidade
  rationale: חֶתֶף pode indicar um golpe destrutivo e repentino ou uma calamidade. “Diante da calamidade” comunica cuidado protetor sem apagar a possível nuance de desastre súbito; o paralelo grego traz “da queda/ruína”.
- source_word: וּמְחַזֵּק
  choice: e fortalece
  rationale: No piel, חזק significa fortalecer e pode, neste contexto urbano, incluir a ideia de fortificar. A escolha preserva a amplitude do hebraico.
- source_word: עִירוֹ
  choice: sua cidade
  rationale: Tradução direta de עִיר com o sufixo possessivo de terceira pessoa.
- source_word: מִצָּר
  choice: contra a aflição
  rationale: צָר pode designar aflição, aperto ou pressão e, em contexto militar, aproximar-se de cerco. “Aflição” mantém a formulação hebraica mais ampla, enquanto a leitura militar é registrada em nota.
