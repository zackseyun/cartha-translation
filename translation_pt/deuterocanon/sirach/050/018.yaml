translation:
  language: pt
  text: E o cântico elevou a voz[a], e sobre a multidão puseram em ordem a lâmpada dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “E os cantores de salmos louvaram com suas vozes; numa casa muito cheia, a melodia foi suavizada.” Isso sugere que o texto hebraico, especialmente a segunda linha, é textualmente difícil ou foi transmitido de forma diferente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: o cântico fez ouvir a sua voz
  rationale: A construção נתן com קול expressa produzir ou erguer a voz. “Fez ouvir a sua voz” comunica naturalmente o idioma hebraico, mantendo “o cântico” como sujeito e “sua voz” como complemento.
- source_word: הַשִּׁיר
  choice: o cântico
  rationale: שיר significa canto ou cântico. “Cântico” é claro, digno e adequado ao contexto litúrgico, sem substituir o singular hebraico pelos cantores mencionados no paralelo grego.
- source_word: וְעַל הֲמּוֹן
  choice: e sobre a multidão
  rationale: על preserva a imagem espacial de “sobre”, enquanto המון designa uma multidão. Como o segmento é difícil, evita-se interpretar a preposição como “entre” ou “em meio a” sem apoio suficiente.
- source_word: הֶעֱרִיכוּ
  choice: puseram em ordem
  rationale: O hifil de ערך significa dispor, preparar ou pôr em ordem. A escolha conserva o sentido concreto e a possível ressonância cerimonial.
- source_word: נֵרוֹ
  choice: a lâmpada dele
  rationale: נר significa normalmente “lâmpada”, e o sufixo masculino singular significa “dele”. A formulação explicita em português que o referente do pronome permanece incerto, em vez de atribuí-lo silenciosamente ao cântico.
theological_decisions:
- issue: Primazia do hebraico diante de um segundo hemistíquio textualmente difícil
  choice: Traduzir diretamente o hebraico preservado e registrar o paralelo grego em nota.
  alternative: 'Adotar no texto principal o grego: “E os cantores de salmos louvaram com suas vozes; na casa repleta, a melodia tornou-se doce.”'
  rationale: O hebraico está preservado e deve orientar o texto principal, embora sua segunda linha seja obscura e difira substancialmente do grego. A nota mantém transparente a outra tradição textual sem harmonizá-las nem resolver artificialmente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Cântico” preserva o cenário litúrgico; “puseram em ordem” mantém a concretude do hebraico. A expressão incomum “a lâmpada dele” é mantida deliberadamente por causa da incerteza textual e referencial, esclarecida pela nota.
