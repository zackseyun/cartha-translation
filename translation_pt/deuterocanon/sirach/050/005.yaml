translation:
  language: pt
  text: Como era esplêndido quando olhava para fora da tenda[a] e quando saía da casa da cortina[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “Como foi glorificado no giro (ou circuito) do povo”, em vez do hebraico “quando olhava para fora da tenda”. Isso indica uma divergência textual no primeiro membro do versículo.'
    reason: textual_variant
  - marker: b
    text: Ou “véu”. O hebraico parókhet e o grego katapétasma designam a cortina que separava o espaço mais interior do santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: Como era esplêndido
  rationale: A construção exclamativa מַה com נֶהְדַּר expressa admiração diante de uma aparência magnífica. “Esplêndido” conserva tanto o aspecto visual quanto a dignidade da cena.
- source_word: בְּהַשְׁגִּיחוֹ
  choice: quando olhava para fora
  rationale: O verbo sugere olhar de dentro para fora ou tornar-se visível. A formulação mantém de perto o hebraico sem reduzir a possível nuance de aparição.
- source_word: מֵאֹהֶל
  choice: da Tenda
  rationale: O hebraico diz literalmente “tenda”. A inicial maiúscula sinaliza a referência cultual sem substituir a imagem herdada por “templo” ou “santuário”.
- source_word: וּבְצֵאתוֹ
  choice: e quando saía
  rationale: Reproduz naturalmente a construção temporal e seu paralelismo com a oração anterior.
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: da casa da cortina
  rationale: Tradução próxima da construção hebraica, que combina “casa” com a cortina do santuário. Evita acrescentar “de trás de” ou impor uma identificação arquitetônica mais específica do que o texto.
theological_decisions:
- issue: Imagens cultuais mistas de “tenda” e “casa da cortina”
  choice: Conservar as duas imagens do hebraico
  alternative: Uniformizar como “santuário” ou “templo”
  rationale: A combinação pode evocar a linguagem tradicional do tabernáculo dentro do contexto do templo. A uniformização eliminaria uma tensão genuína do texto.
- issue: Divergência textual no primeiro membro do versículo
  choice: Traduzir o hebraico no texto principal e registrar o grego em nota
  alternative: Adotar a leitura grega sobre a volta ou procissão do povo
  rationale: O testemunho hebraico fornecido é a base principal e tem alta confiança, enquanto o paralelo grego atesta uma leitura substancialmente diferente que deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação foi explicitada pela pontuação. “Casa da cortina” é deliberadamente incomum para preservar a formulação compacta e a ambiguidade arquitetônica do hebraico; as notas esclarecem sem substituir o texto.
