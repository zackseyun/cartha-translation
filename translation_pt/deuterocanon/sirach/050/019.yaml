base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: pt
  text: E todo o povo da terra clamou em oração diante do Misericordioso, até que ele terminou de servir no altar e seus ritos prescritos chegaram ao fim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: «o povo do Senhor Altíssimo [...] diante do Misericordioso, até que se completasse o esplendor/serviço do Senhor e eles concluíssem a liturgia dele». O hebraico e o grego diferem na parte final; o texto principal segue o hebraico preservado, levando também em conta a ideia de conclusão presente no grego.'
    reason: textual_variant
  - marker: b
    text: 'Ou: «e suas ordenanças chegaram ao fim». A última expressão hebraica é difícil; o paralelo grego também favorece o sentido de conclusão do serviço litúrgico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: clamou
  rationale: O verbo רנן pode indicar um brado sonoro, jubiloso ou suplicante. Neste contexto litúrgico, com בִּתְפִלָּה, «clamou em oração» expressa uma súplica pública em voz alta sem pressupor necessariamente canto.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a formulação hebraica e, no contexto, designa a população reunida daquela terra, não toda a humanidade.
- source_word: בִּתְפִלָּה
  choice: em oração
  rationale: Tradução direta e natural da construção preposicional, adequada ao cenário de culto comunitário.
- source_word: לִפְנֵי רַחוּם
  choice: diante do Misericordioso
  rationale: O hebraico emprega um epíteto divino sem substantivo ou nome explícito. A forma substantivada e reverente conserva essa característica sem acrescentar «Deus».
- source_word: עַד כַּלּוֹתוֹ
  choice: até que ele terminou
  rationale: O infinitivo construto com sufixo aponta para a conclusão da ação do sacerdote; a oração finita é idiomática em português.
- source_word: לְשָׁרֵת מִזְבֵּחַ
  choice: de servir junto ao altar
  rationale: שרת denota serviço ministerial ou cultual. «Servir junto ao altar» comunica com naturalidade a função sacerdotal sem introduzir terminologia denominacional.
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: e seus ritos prescritos chegaram ao fim
  rationale: A expressão hebraica é difícil. מִשְׁפָּטָיו pode designar procedimentos ou deveres determinados, e o paralelo grego favorece a ideia de conclusão do serviço litúrgico. A tradução preserva a construção em que os ritos chegam à sua conclusão, sem convertê-la silenciosamente em uma ação mais explícita do sacerdote.
theological_decisions:
- issue: Título divino רַחוּם
  choice: o Misericordioso
  alternative: o Compassivo; o Deus misericordioso
  rationale: A fonte apresenta um epíteto divino, não um nome próprio nem o substantivo «Deus». A tradução como título mantém a ênfase na misericórdia divina e evita acrescentar conteúdo ausente do hebraico.
- issue: Sentido cultual de מִשְׁפָּטָיו
  choice: seus ritos prescritos
  alternative: suas ordenanças; seus deveres prescritos; seus juízos
  rationale: No contexto do serviço do altar, o termo provavelmente se refere aos procedimentos ritualmente determinados. «Ritos prescritos» torna esse sentido inteligível, enquanto a nota registra a dificuldade textual e lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se «povo da terra» pela textura e pelo alcance social do hebraico; «Misericordioso» funciona como título divino. A formulação final mantém a tensão e a relativa estranheza da expressão hebraica, esclarecida por notas, em vez de resolvê-la como se o texto dissesse inequivocamente que o sacerdote «cumpriu seus deveres».
