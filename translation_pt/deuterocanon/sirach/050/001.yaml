base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: pt
  text: Simão, filho de Joanã, o sacerdote[a], era grande entre seus irmãos e o esplendor do seu povo. Em sua geração, a Casa foi restaurada[b], e, em seus dias, o Templo foi fortalecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Simão, filho de Onias, o grande sacerdote”, ou “o sumo sacerdote”. O testemunho hebraico aqui diz: “Simão, filho de Joanã, o sacerdote”.'
    reason: alternative_reading
  - marker: b
    text: Ou “a Casa recebeu cuidados” ou “foi reparada”. O verbo hebraico pode indicar que ela foi atendida ou restaurada; o paralelo grego aponta especificamente para obras de construção na Casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: era grande entre seus irmãos
  rationale: Mantém de perto o sentido elogioso e comparativo da expressão hebraica, sem transformar גְּדוֹל em um substantivo como “glória”.
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: e o esplendor do seu povo
  rationale: תִפְאֶרֶת exprime esplendor, beleza e honra; “esplendor” preserva o paralelismo elevado e o tom poético.
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: Simão, filho de Joanã
  rationale: “Simão” é a forma portuguesa tradicional de שִׁמְעוֹן; “Joanã” translitera o hebraico יוֹחָנָן sem substituí-lo pela forma portuguesa distinta “João”.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Segue o testemunho hebraico, que traz simplesmente “o sacerdote”; o título mais amplo do paralelo grego é registrado em nota.
- source_word: נִפְקַד הַבָּיִת
  choice: a Casa foi restaurada
  rationale: O nifal de פקד pode indicar que algo recebeu atenção ou cuidado. No contexto arquitetônico e à luz do paralelo grego, “foi restaurada” comunica uma intervenção no edifício sem especificar indevidamente o trabalho exato.
- source_word: הַבָּיִת
  choice: a Casa
  rationale: Preserva a variação hebraica entre “a Casa” e הֵיכָל, “o Templo”. A inicial maiúscula deixa claro o uso como designação do templo.
- source_word: חֻזַּק
  choice: foi fortalecido
  rationale: Reproduz o passivo do hebraico, “foi tornado forte/firme”, e mantém a possível referência ao reforço estrutural.
- source_word: הֵיכָל
  choice: o Templo
  rationale: Neste contexto, הֵיכָל designa o santuário ou templo; “Templo” é claro e natural em português.
theological_decisions:
- issue: Título sacerdotal de Simão
  choice: o sacerdote
  alternative: o sumo sacerdote / o grande sacerdote
  rationale: O testemunho hebraico primário lê הַכֹּהֵן, “o sacerdote”, enquanto o paralelo grego lê ἱερεὺς ὁ μέγας, expressão que pode significar “o grande sacerdote” ou “o sumo sacerdote”. O texto principal segue o hebraico e a variante grega é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo elogioso do hebraico, distingue “Casa” de “Templo” e não resolve silenciosamente a divergência entre os títulos sacerdotais hebraico e grego.
