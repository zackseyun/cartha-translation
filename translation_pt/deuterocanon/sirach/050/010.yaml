  text: like a flourishing olive tree heavy with berries[b][a], and like an rich tree drenching its branches.
translation:
  language: pt
  text: como uma oliveira viçosa, carregada de azeitonas,[a] e como uma árvore frondosa que rega seus ramos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cheia de frutos”; o raro termo hebraico provavelmente se refere aqui às azeitonas.
    reason: lexical_alternative
  - marker: b
    text: O grego traz “como um cipreste que se eleva até as nuvens”, em vez do hebraico “como uma árvore frondosa que rega seus ramos”. Segue-se aqui o texto hebraico preservado nos manuscritos da Genizá do Cairo.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  choice: como uma oliveira viçosa
  rationale: O prefixo כְּ marca a comparação; זַיִת designa aqui a oliveira, como confirmam o paralelismo arbóreo e o grego. “Viçosa” expressa de modo natural o vigor verde de רַעֲנָן.
- source_word: מָלֵא גַרְגַּר
  choice: carregada de azeitonas
  rationale: Literalmente, “cheia de gargar”. O substantivo raro provavelmente se refere aos frutos da oliveira; “azeitonas” preserva a imagem concreta e se ajusta ao contexto.
- source_word: וּכְעֵץ שָׁמֵן
  choice: e como uma árvore frondosa
  rationale: שָׁמֵן significa literalmente “gorda”, mas, aplicado à vegetação, comunica riqueza, abundância ou luxuriância. “Frondosa” oferece em português uma imagem natural de crescimento abundante sem introduzir a estranha expressão “árvore de óleo”.
- source_word: מְרַוֶּה עָנָף
  choice: que rega seus ramos
  rationale: O particípio de רוה significa regar, saturar ou saciar de água. A tradução conserva a ação metafórica e o singular coletivo עָנָף, vertido naturalmente no plural em português.
