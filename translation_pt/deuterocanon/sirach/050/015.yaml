translation:
  language: pt
  text: Então os filhos de Arão, os sacerdotes, davam um brado[b] com trombetas feitas a martelo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz aqui um paralelo mais longo: o sacerdote estende a mão sobre a libação, derrama o sangue da uva junto às bases do altar e apresenta ao Altíssimo, Rei de todos, um aroma agradável. O testemunho hebraico preservado aqui contém somente a linha sobre a aclamação com trombetas.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “davam um toque com trombetas”. O verbo hebraico pode indicar uma aclamação em voz alta ou um brado de sinal; neste contexto, o som é produzido por meio das trombetas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal e introduz a ação litúrgica seguinte de modo natural em português.
- source_word: יָרִיעוּ
  choice: faziam soar uma aclamação
  rationale: Preserva a ideia de brado ou aclamação forte do verbo hebraico e, ao mesmo tempo, deixa claro que ela era produzida por meio das trombetas. O imperfeito português expressa adequadamente a ação reiterada ou descritiva no contexto ritual.
- source_word: בְנֵי אֲהַרֹן
  choice: os filhos de Arão
  rationale: Mantém a designação sacerdotal de linhagem explicitamente presente no hebraico.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Conserva a explicação em aposição que identifica os filhos de Arão.
- source_word: בַּחֲצֹצְרוֹת
  choice: com trombetas
  rationale: Traduz naturalmente o sentido instrumental da preposição e identifica os instrumentos metálicos usados no culto sacerdotal.
- source_word: מִקְשֶׁה
  choice: feitas a martelo
  rationale: Expressa de maneira corrente o processo de fabricar o metal por martelamento, sem sugerir que as trombetas eram simplesmente golpeadas durante o toque.
theological_decisions:
- issue: Relação entre a linha hebraica e o paralelo grego mais extenso
  choice: Traduzir no texto principal somente a linha preservada em hebraico e registrar a forma grega em nota.
  alternative: Incluir no texto principal os pormenores gregos sobre a libação e o sangue da uva.
  rationale: Como há testemunho hebraico para esta linha, ele recebe prioridade. O texto grego descreve ações sacrificiais adicionais que não devem ser inseridas silenciosamente na tradução do hebraico, mas sua existência é textualmente relevante e deve ser informada ao leitor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Feitas a martelo” comunica o antigo processo de trabalho do metal com mais naturalidade do que “trombetas marteladas”, enquanto “aclamação” preserva a amplitude do verbo hebraico sem reduzi-lo a um termo técnico específico.
