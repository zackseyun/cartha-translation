base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/017.yaml
  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: pt
  text: Todos juntos se apressaram e caíram com o rosto por terra, para se prostrarem diante do Altíssimo, diante do Santo de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: Todos
  rationale: A expressão hebraica, literalmente «toda carne», refere-se aqui ao conjunto das pessoas presentes. «Todos» comunica esse sentido naturalmente em português, em consonância com o paralelo grego πᾶς ὁ λαός.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Preserva a ideia de ação coletiva e simultânea.
- source_word: נִמְהָרוּ
  choice: se apressaram
  rationale: Expressa o movimento urgente do verbo hebraico sem sugerir necessariamente pânico ou desordem.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: e caíram com o rosto por terra
  rationale: Mantém a imagem corporal concreta do hebraico em português claro e corrente.
- source_word: לְהִשְׁתַּחֲוֹת
  choice: para se prostrarem
  rationale: O verbo denota inclinar-se profundamente ou prostrar-se em reverência; o contexto cultual favorece «prostrar-se».
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: Título divino tradicional e semanticamente direto para o hebraico.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Santo de Israel
  rationale: Preserva literalmente o conhecido título divino hebraico.
theological_decisions:
- issue: Relação entre «Altíssimo» e «Santo de Israel»
  choice: 'Manter os dois títulos em aposição: «diante do Altíssimo, diante do Santo de Israel»'
  alternative: Fundir os títulos ou inserir uma conjunção explicativa
  rationale: A repetição de לִפְנֵי no hebraico dá destaque paralelo aos dois títulos do mesmo referente divino; a tradução conserva essa estrutura sem explicá-la além do texto.
- issue: Objeto da prostração
  choice: Traduzir diretamente o hebraico, sem acrescentar «Senhor», «Todo-Poderoso» ou «Deus»
  alternative: Incorporar os títulos adicionais presentes no paralelo grego
  rationale: A fonte hebraica de alta confiança traz apenas «Altíssimo» e «Santo de Israel»; os elementos expansivos do grego não devem ser importados para o texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita o literalismo pouco natural de «toda carne», mas conserva a ação coletiva, a urgência, o gesto físico e os dois títulos divinos do hebraico.
