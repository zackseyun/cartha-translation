  text: until he finished ministering at the altar[a], and arranging the offerings of the Most High.
translation:
  language: pt
  text: até terminar de servir no altar e de pôr em ordem as disposições do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: «para dispor a oferta do Altíssimo Todo-Poderoso». O hebraico é mais conciso: «pôr em ordem as disposições do Altíssimo».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: até terminar
  rationale: Expressa de modo natural o limite temporal indicado por עַד com o infinitivo construto כַּלּוֹתוֹ.
- source_word: לְשָׁרֵת
  choice: de servir
  rationale: No contexto sacerdotal, descreve o serviço litúrgico; «servir» é claro, digno e não reduz a ação a trabalho comum.
- source_word: מִזְבֵּחַ
  choice: junto ao altar
  rationale: «Altar» é o equivalente padrão; «junto ao» comunica o âmbito do serviço sem introduzir a ideia mais específica de algo colocado sobre o altar.
- source_word: וּלְסַדֵּר
  choice: e de pôr em ordem
  rationale: Reproduz o sentido de organizar ou dispor e mantém o paralelismo verbal com «de servir».
- source_word: מַעַרְכוֹת
  choice: as disposições
  rationale: Preserva a referência ampla a coisas ou conjuntos postos em ordem, sem identificar de forma indevida o objeto como lenha, pães ou ofertas. A nota registra a explicitação cultual da tradição grega.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Forma portuguesa consagrada e natural para este título divino.
theological_decisions:
- issue: Grau de especificidade de מַעַרְכוֹת diante do grego προσφοράν
  choice: Manter no texto a formulação mais ampla «as disposições do Altíssimo».
  alternative: «a oferta do Altíssimo Todo-Poderoso» ou «as ofertas do Altíssimo»
  rationale: O hebraico extante tem um plural que designa disposições ou conjuntos ordenados, enquanto o grego explicita uma oferta no singular e acrescenta «Todo-Poderoso». A tradução principal dá prioridade ao hebraico e conserva sua concisão e ambiguidade, registrando a leitura grega em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. «Disposições» é deliberadamente mais formal para conservar a indeterminação cultual do hebraico; a nota evita que a leitura grega mais explícita seja perdida.
