base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: pt
  text: Ao receber as porções da mão de seus irmãos[a], ele estava de pé junto aos arranjos[b]. Ao seu redor havia uma coroa de filhos, como mudas de cedros no Líbano; eles o cercavam como salgueiros à beira de um riacho — todos os filhos de Arão em seu esplendor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “das mãos dos sacerdotes”, onde o hebraico diz “da mão de seus irmãos”. Pelo contexto, os irmãos são seus companheiros sacerdotes.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por “junto aos arranjos” é difícil; o paralelo grego descreve-o de pé junto ao braseiro do altar.
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ
  choice: Ao receber
  rationale: O infinitivo construto com בְּ introduz uma circunstância temporal. “Ao receber” é natural em português e mantém a simultaneidade da cena.
- source_word: נְתָחִים
  choice: as porções
  rationale: O termo designa partes cortadas, aqui no contexto sacrificial. “Porções” comunica esse sentido sem acrescentar uma identificação não expressa.
- source_word: מִיַּד אֶחָיו
  choice: da mão de seus irmãos
  rationale: Segue de perto o hebraico, inclusive o singular “mão”. O contexto identifica esses irmãos como sacerdotes, mas essa explicitação não é inserida no texto principal.
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: permanecia de pé junto ao que estava disposto
  rationale: A expressão hebraica é difícil e envolve a ideia de algo ordenado ou disposto. A formulação preserva essa indeterminação, enquanto a nota apresenta o esclarecimento cultual oferecido pelo grego.
- source_word: עֲטֶרֶת בָּנִים
  choice: uma coroa de filhos
  rationale: Mantém a metáfora visual de descendentes ou sacerdotes formando uma coroa ao redor dele; a linha final os identifica como filhos de Arão.
- source_word: כִּשְׁתִילֵי אֲרָזִים
  choice: como mudas de cedro
  rationale: שְׁתִילִים evoca plantas jovens e vigorosas. “Mudas de cedro” preserva a imagem concreta.
- source_word: בְּעַרְבֵי נָחַל
  choice: como salgueiros à beira de um riacho
  rationale: A expressão designa salgueiros ligados a um curso de água. A comparação é vertida de modo claro e poético em português atual.
- source_word: בִּכְבוֹדָם
  choice: em seu esplendor
  rationale: Expressa a aparência honrosa e majestosa dos sacerdotes aarônicos, com dicção digna e natural.
theological_decisions:
- issue: Identidade sacerdotal de “seus irmãos”
  choice: Manter “seus irmãos” no texto principal.
  alternative: “das mãos dos sacerdotes”
  rationale: O hebraico preservado diz “da mão de seus irmãos”, enquanto o grego traz “das mãos dos sacerdotes”. A leitura hebraica recebe prioridade, e a variante grega esclarece na nota que se trata de sacerdotes companheiros.
- issue: Sentido da expressão cultual עַל מַעֲרָכוֹת
  choice: Preservar no texto a noção indeterminada de algo disposto ou ordenado.
  alternative: “junto ao braseiro do altar”
  rationale: O hebraico é difícil e pode referir-se a disposições ou arranjos; o paralelo grego localiza a cena junto ao braseiro do altar. A tradução não resolve silenciosamente a tensão textual, mas a nota fornece a leitura grega.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e poético, sem arcaísmos desnecessários. A pontuação divide a cena em duas imagens e mantém o aposto conclusivo sobre os filhos de Arão.
