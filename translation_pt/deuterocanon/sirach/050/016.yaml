    issue: A expressão «para trazer à memória diante do Altíssimo» é semanticamente ambígua de modo pouco natural em português.
    rationale: Embora preserve a abertura do hebraico quanto ao objeto da recordação, «trazer à memória» tende a requerer complemento e pode ser lida como uma recordação mental comum. «Fazer memória» mantém melhor o valor cultual de לְהַזְכִּיר/μνημόσυνον sem explicitar o referente.
