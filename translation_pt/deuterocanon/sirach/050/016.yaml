  text: And they raised a shout and made a mighty sound heard[a], to make remembrance before the Most High.
translation:
  language: pt
  text: Então eles soltaram um brado e fizeram ressoar um som poderoso, para fazer memória diante do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para servir de memorial diante do Altíssimo”. O infinitivo hebraico e o paralelo grego empregam linguagem de memória em sentido litúrgico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: soltaram um brado
  rationale: Expressa a aclamação forte e pública do verbo hebraico no contexto litúrgico, sem atribuí-la necessariamente a um instrumento.
- source_word: וַיַּשְׁמִיעוּ
  choice: fizeram ressoar
  rationale: Conserva de modo natural em português o valor causativo do hifil de שמע, isto é, fazer com que algo seja ouvido.
- source_word: קוֹל אַדִּיר
  choice: um som poderoso
  rationale: קוֹל pode designar voz ou som; a formulação ampla evita restringir o sinal audível à fala, enquanto 'poderoso' preserva a força de אַדִּיר.
- source_word: לְהַזְכִּיר
  choice: para trazer à memória
  rationale: Mantém a linguagem memorial do infinitivo hebraico e sua ressonância litúrgica, também confirmada pelo paralelo grego, sem explicar quem é levado a recordar.
- source_word: לִפְנֵי עֶלְיוֹן
  choice: diante do Altíssimo
  rationale: '''Diante de'' representa naturalmente לִפְנֵי no cenário cultual, e ''o Altíssimo'' preserva עֶלְיוֹן como título divino.'
theological_decisions:
- issue: Sentido cultual da linguagem de memória
  choice: para trazer à memória diante do Altíssimo
  alternative: para servir de memorial diante do Altíssimo
  rationale: O hebraico e o grego indicam uma função memorial no culto. A redação mantém em aberto se o ato traz algo à memória ou funciona como memorial, sem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário litúrgico compreensível. A construção evita tanto um literalismo pouco idiomático como uma explicitação indevida do agente da lembrança.
