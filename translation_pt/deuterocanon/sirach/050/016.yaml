- from: Então eles soltaram um brado e fizeram ressoar um som poderoso, para trazer à memória diante do Altíssimo.[a]
  to: Então eles soltaram um brado e fizeram ressoar um som poderoso, para fazer memória diante do Altíssimo.[a]
