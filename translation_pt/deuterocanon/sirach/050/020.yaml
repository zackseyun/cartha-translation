base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: pt
  text: Então ele desceu e ergueu as mãos sobre toda a assembleia de Israel, para pronunciar a bênção de Yahweh com seus lábios[a] e para gloriar-se no nome de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz literalmente uma frase nominal: «e a bênção de Yahweh em seus lábios». O paralelo grego explicita a finalidade: «para dar a bênção ... de seus lábios».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «exultar» ou «orgulhar-se no nome de Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: desceu
  rationale: Expressa diretamente o movimento para baixo no contexto narrativo e soa natural em português.
- source_word: וְנָשָׂא יָדָיו
  choice: e ergueu as mãos
  rationale: Preserva o gesto litúrgico convencional de levantar as mãos para abençoar ou orar.
- source_word: עַל כָּל קְהַל יִשְׂרָאֵל
  choice: sobre toda a assembleia de Israel
  rationale: “Assembleia” comunica uma comunidade formalmente reunida; “sobre” mantém a imagem das mãos estendidas sobre o povo.
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: para pronunciar com seus lábios a bênção de Yahweh
  rationale: O hebraico preservado é uma frase nominal comprimida. O propósito verbal é apoiado pelo grego δοῦναι, enquanto “pronunciar” torna natural em português a ação sacerdotal sem apagar a dificuldade textual.
- source_word: וּבְשֵׁם יְהֹוָה
  choice: no nome de Yahweh
  rationale: Mantém a fórmula bíblica de invocação ou exultação associada ao nome divino.
- source_word: הִתְפָּאֵר
  choice: gloriar-se
  rationale: Conserva o tom elevado e a amplitude entre exultar, orgulhar-se e gloriar-se, também refletida pelo grego καυχᾶσθαι.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome próprio e segue a camada de consulta fornecida.
- issue: Relação sintática de וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: 'finalidade: “para pronunciar ... a bênção de Yahweh”'
  alternative: 'coordenação nominal: “com a bênção de Yahweh nos lábios”'
  rationale: O hebraico transmitido não apresenta verbo explícito, ao passo que o paralelo grego fornece δοῦναι, um infinitivo de finalidade. A tradução adota esse sentido, mas registra a forma hebraica em nota.
- issue: Sentido de הִתְפָּאֵר
  choice: gloriar-se no nome de Yahweh
  alternative: exultar ou orgulhar-se no nome de Yahweh
  rationale: “Gloriar-se” mantém a tensão lexical sem impor uma conotação necessariamente negativa de vanglória.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve elevação litúrgica. “Pronunciar” evita uma construção pouco idiomática com “dar a bênção”, e as notas preservam tanto a forma comprimida do hebraico quanto a ambiguidade de הִתְפָּאֵר.
