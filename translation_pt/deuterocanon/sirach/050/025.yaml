  text: With two nations my soul is disgusted[a], and the third is not a people.
translation:
  language: pt
  text: Minha alma sente aversão por duas nações, e a terceira não é um povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e a terceira não é uma nação”. O hebraico diz “povo” aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: De duas nações
  rationale: A preposição ב־, com o verbo de aversão, indica aquilo contra o qual se dirige o sentimento. “De duas nações” é idiomático em português e mantém a formulação simples do hebraico, também refletida pelo paralelo grego.
- source_word: קָצָה נַפְשִׁי
  choice: minha alma tem aversão
  rationale: Preserva o termo explícito נַפְשִׁי (“minha alma”) e comunica a forte repulsa expressa pelo verbo קָצָה sem reduzir a expressão poética a um simples “eu detesto”.
- source_word: וְהַשְּׁלִישִׁית
  choice: e a terceira
  rationale: O ordinal feminino retoma elipticamente uma coletividade, aqui entendida pelo contexto como nação. A forma “a terceira” conserva a elipse sem acrescentar uma identificação ausente no verso.
- source_word: אִינֶנּוּ עָם
  choice: não é um povo
  rationale: Traduz diretamente עָם por “povo”, dando prioridade ao testemunho hebraico de alta confiança. Mantém também a força retórica de negar à terceira coletividade a condição de povo.
theological_decisions:
- issue: Normalizar a expressão antropológica “minha alma” como uma declaração simples na primeira pessoa
  choice: Manter “minha alma” no texto principal
  alternative: Tenho aversão / Eu detesto
  rationale: O hebraico emprega explicitamente נַפְשִׁי, e o paralelo grego também conserva “minha alma”. A manutenção respeita o caráter poético sem impor uma antropologia técnica.
- issue: Seguir “nação” no paralelo grego ou “povo” no hebraico na oração final
  choice: Usar “povo” no texto principal
  alternative: não é uma nação
  rationale: Como o texto hebraico preservado é de alta confiança, עָם governa a tradução. A variante lexical do grego é registrada em nota, sem apagar a diferença entre os testemunhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo, a expressão poética “minha alma” e a distinção lexical entre o hebraico “povo” e o grego “nação”.
