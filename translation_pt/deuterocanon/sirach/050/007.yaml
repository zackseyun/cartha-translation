base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/007.yaml
  text: Like the sun shining on the palace of the king[a], and like a rainbow appearing in the cloud.
translation:
  language: pt
  text: Como o sol que brilha sobre o palácio do rei[a], e como o arco-íris que aparece na nuvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “o templo do Altíssimo” em vez de “o palácio do rei”. O testemunho hebraico provavelmente preserva uma formulação variante, enquanto o grego explicita o contexto cultual.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: Como o sol
  rationale: O prefixo כְּ marca comparação; esta formulação preserva de modo natural a imagem poética.
- source_word: מְשַׁקֶּרֶת
  choice: que brilha
  rationale: A forma hebraica é incomum, mas o contexto de luminosidade e o paralelo grego ἐκλάμπων sustentam o sentido de resplandecer ou brilhar.
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: sobre o palácio do rei
  rationale: אֶל pode indicar direção ou incidência, e הֵיכַל admite tanto 'palácio' quanto 'templo'. No texto hebraico, a construção 'do rei' favorece 'palácio'; a leitura cultual do grego é registrada em nota.
- source_word: וּכְקֶשֶׁת
  choice: e como o arco-íris
  rationale: Embora קֶשֶׁת também signifique 'arco', a menção da nuvem torna inequívoco o fenômeno celeste.
- source_word: נִרְאֲתָה
  choice: que aparece
  rationale: O nifal expressa aquilo que se torna visível ou aparece, e a oração relativa soa natural em português.
- source_word: בֶעָנָן
  choice: na nuvem
  rationale: Preserva o substantivo singular e definido do testemunho hebraico, sem importar o plural e o acréscimo 'de glória' do grego.
theological_decisions:
- issue: Hebraico 'palácio do rei' versus grego 'templo do Altíssimo'
  choice: Manter no texto principal a leitura hebraica 'palácio do rei'.
  alternative: templo do Altíssimo
  rationale: A prioridade do testemunho hebraico recomenda preservar הַמֶּלֶךְ, 'o rei', e o sentido comum de הֵיכַל nessa construção pode ser 'palácio'. O paralelo grego apresenta uma variante cultual materialmente relevante, registrada em nota sem harmonização silenciosa.
translation_notes:
  register: Português atual, digno e poeticamente simples, com ampla legibilidade brasileira. Conserva as duas comparações e a ambiguidade textual relevante por meio de nota.
