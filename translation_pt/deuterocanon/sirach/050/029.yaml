  yaml_path: translation/deuterocanon/sirach/050/029.yaml
  text: For if one does these things[a], he will prevail in everything, for the light of the Lord is his path.
translation:
  language: pt
  text: Pois, se alguém fizer essas coisas, prevalecerá em tudo, porque a luz do Senhor é o seu caminho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a sua pegada” ou “o seu rastro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: Pois, se alguém fizer essas coisas
  rationale: Preserva a condição introduzida por ἐάν, a ligação explicativa de γάρ e a referência de αὐτά aos ensinamentos anteriores. O sujeito genérico «alguém» torna natural em português o verbo grego sem sujeito expresso.
- source_word: πρὸς πάντα ἰσχύσει
  choice: prevalecerá em tudo
  rationale: ἰσχύω expressa força ou eficácia, e a construção condensada πρὸς πάντα amplia seu alcance. «Prevalecerá em tudo» comunica capacidade e êxito abrangentes sem limitar o sentido à oposição contra adversários.
- source_word: φῶς Κυρίου
  choice: a luz do Senhor
  rationale: Mantém literalmente a metáfora de φῶς e emprega a forma portuguesa corrente do título divino Κύριος.
- source_word: τὸ ἴχνος αὐτοῦ
  choice: o seu caminho
  rationale: ἴχνος significa literalmente pegada, rastro ou pista. «Caminho» transmite com naturalidade a metáfora do curso de vida, enquanto a imagem concreta do grego é preservada em nota.
theological_decisions:
- issue: Sentido da metáfora τὸ ἴχνος αὐτοῦ
  choice: A luz do Senhor é o caminho da pessoa, sugerindo que a iluminação divina orienta ou caracteriza seu percurso.
  alternative: A luz do Senhor é sua pegada ou seu rastro, destacando a marca concreta deixada pela iluminação divina.
  rationale: A formulação grega é metafórica e condensada. «Caminho» é coerente com o contexto sapiencial e inteligível em português, mas a nota conserva a imagem mais concreta e a ambiguidade de ἴχνος.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição causal «Pois... porque» reflete as duas relações discursivas do grego sem tornar a frase obscura.
