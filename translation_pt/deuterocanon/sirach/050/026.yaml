  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: pt
  text: os habitantes de Seir e da Filístia[a], e a nação insensata que habita em Siquém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “os que habitam no monte da Samaria, os filisteus”, em vez de “os habitantes de Seir e da Filístia”.'
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: os habitantes de
  rationale: O plural construto de ישב é usado substantivamente para os residentes de um lugar; “os habitantes de” é natural e preserva o sentido coletivo.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Mantém o topônimo hebraico sem acrescentar “monte”, termo ausente no texto hebraico.
- source_word: וּפְלֶשֶׁת
  choice: e da Filístia
  rationale: פְלֶשֶׁת designa a terra ou região; a contração “da” liga naturalmente o nome ao sintagma “os habitantes de”.
- source_word: גּוֹי
  choice: nação
  rationale: Preserva o sentido coletivo de povo ou grupo nacional presente em גוי.
- source_word: נָבָל
  choice: insensata
  rationale: Comunica uma falta moral e intelectual de bom senso, evitando reduzir o termo a mera deficiência de inteligência.
- source_word: הַדָּר
  choice: que habita
  rationale: Verte o particípio atributivo como ação contínua de residência, em português corrente e digno.
- source_word: בִּשְׁכֶם
  choice: em Siquém
  rationale: Emprega a forma portuguesa bíblica amplamente reconhecida para o topônimo hebraico שְׁכֶם.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na primeira referência geográfica
  choice: 'Seguir no texto principal o hebraico preservado: “os habitantes de Seir e da Filístia”'
  alternative: “os que habitam no monte da Samaria, os filisteus”
  rationale: O testemunho hebraico existente, de alta confiança, tem prioridade. A leitura grega difere materialmente e é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente internacional. A formulação conserva a estrutura coordenada e o tom crítico do hebraico.
