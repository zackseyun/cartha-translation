translation:
  language: pt
  text: Em seus dias, foi escavado um reservatório e um canal[a], como o mar em sua abundância.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por “canal” é incerta e pode designar, de modo mais geral, um curso ou conduto de água.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego traz: “Por ele foi estabelecida a parte alta da estrutura dupla, o alto contraforte do recinto do templo.” O testemunho hebraico fala, em vez disso, de um reservatório e de um canal, refletindo uma divergência textual significativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְרָה
  choice: foi escavado
  rationale: O nifal de כרה tem sentido passivo de cavar ou escavar; a expressão é clara e apropriada para a construção de um reservatório.
- source_word: מִקְוֶה
  choice: reservatório
  rationale: Neste contexto de obras, designa uma acumulação ou instalação para armazenar água; “reservatório” comunica melhor uma obra hidráulica de porte.
- source_word: שִׂיחַ
  choice: canal
  rationale: O termo hebraico é incerto, mas o paralelismo com o reservatório favorece algum tipo de canal ou curso de água. “Canal” preserva o sentido geral sem impor uma especificação técnica excessiva.
- source_word: כַּיָּם
  choice: como o mar
  rationale: Mantém explicitamente a comparação do hebraico.
- source_word: בַּהֲמוֹנוֹ
  choice: em sua abundância
  rationale: הָמוֹן pode indicar abundância, multidão ou tumulto. No contexto aquático, “abundância” expressa a grande quantidade sem eliminar por completo a imagem vigorosa do mar.
- source_word: בְּדוֹרוֹ
  choice: Em seus dias
  rationale: A expressão assinala idiomaticamente o período de atuação do sumo sacerdote e soa natural em português bíblico atual.
theological_decisions:
- issue: Uso do testemunho hebraico diante da leitura grega divergente
  choice: Seguir no texto principal o hebraico preservado, que fala de um reservatório e de um canal.
  alternative: 'Seguir o grego: “Por ele foi assentada a altura da estrutura dupla, o alto contraforte do recinto do templo.”'
  rationale: O hebraico existente tem prioridade como fonte principal, enquanto o grego testemunha uma divergência textual substancial que deve ser preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a imagem e a ordem básica do hebraico; as incertezas lexical e textual são explicitadas em notas.
