  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
translation:
  language: pt
  text: Feliz[a] o homem que medita nestas coisas; quem as põe no coração se tornará sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado”. O hebraico אַשְׁרֵי e o grego μακάριος exprimem uma condição digna de felicitação e favorecida, não apenas uma sensação de felicidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Expressa a fórmula hebraica de bem-aventurança em português atual e natural, sem reduzi-la necessariamente a uma emoção passageira; a nota registra a alternativa tradicional.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o masculino singular do hebraico e o estilo proverbial da literatura sapiencial; no contexto, a figura tem valor representativo.
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: medita nestas coisas
  rationale: הגה, neste contexto sapiencial, indica reflexão atenta e contínua. A construção portuguesa transmite naturalmente o conteúdo sobre o qual se medita.
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: quem as põe no coração
  rationale: Preserva a imagem hebraica do coração como centro da reflexão e da interiorização. O pronome plural retoma “estas coisas”, leitura também confirmada pelo grego αὐτά.
- source_word: יֶחְכָּם
  choice: se tornará sábio
  rationale: 'Reproduz o sentido resultativo do verbo hebraico: vir a adquirir sabedoria. Evita impor o possível matiz passivo do grego σοφισθήσεται sobre o testemunho hebraico primário.'
theological_decisions:
- issue: Masculino genérico na bem-aventurança sapiencial
  choice: o homem
  alternative: a pessoa; quem
  rationale: O texto hebraico emprega אִישׁ no masculino singular. A tradução conserva essa forma, sem entender que a verdade sapiencial esteja limitada aos homens.
- issue: Relação entre o hebraico e o paralelo grego
  choice: O hebraico rege a tradução, e o grego confirma que o objeto implícito da segunda oração retoma “estas coisas”.
  alternative: 'Traduzir de modo estritamente elíptico: “e quem põe sobre o coração se tornará sábio”.'
  rationale: O pronome grego αὐτά torna explícita uma retomada já natural no hebraico e permite clareza em português sem acrescentar conteúdo estranho ao texto.
- issue: Imagem antropológica do coração
  choice: põe no coração
  alternative: leva a sério; considera atentamente
  rationale: A formulação mantém a imagem bíblica do coração como sede da compreensão e da decisão, sem restringi-la a mero sentimento.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A estrutura proverbial foi preservada; o ponto e vírgula torna nítido o paralelismo sem fragmentar o pensamento.
