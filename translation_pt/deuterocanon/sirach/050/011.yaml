base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: pt
  text: Ao vestir trajes de honra e revestir-se de vestes esplêndidas, ao subir ao altar de majestade[a], ele adornou o átrio do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz «altar santo» e «glorificou o recinto (ou a vestimenta) do santuário»; o hebraico traz «altar de majestade» e «o átrio do santuário».
    reason: Registra a diferença textual entre o hebraico e o paralelo grego e preserva a ambiguidade de um termo grego que pode se referir a recinto ou vestimenta.
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: Quando vestia
  rationale: Expressa de modo natural a ação de pôr as vestes, mantendo a construção temporal hebraica e o paralelismo com a oração seguinte.
- source_word: בִּגְדֵי כָבוֹד
  choice: trajes de honra
  rationale: Preserva a relação nominal e o sentido de כָבוֹד como honra ou glória, sem identificar além do texto a natureza das vestes.
- source_word: וְהִתְלַבְּשׁוֹ
  choice: e se revestia
  rationale: Mantém o valor reflexivo e o registro solene da cena cerimonial.
- source_word: בִּגְדֵי תִפְאָרֶת
  choice: vestes esplêndidas
  rationale: Comunica a beleza e o esplendor de תִפְאָרֶת em português corrente e digno, evitando uma expressão nominal excessivamente rígida.
- source_word: בַּעֲלוֹתוֹ
  choice: quando subia
  rationale: Reproduz tanto a relação temporal quanto o movimento ascendente indicado pelo hebraico.
- source_word: מִזְבַּח הוֹד
  choice: altar majestoso
  rationale: הוֹד pode indicar majestade, esplendor ou glória. 'Majestoso' conserva a qualidade atribuída ao altar e soa natural em português.
- source_word: וַיֶּהְדַּר
  choice: ele adornava
  rationale: Reflete o sentido de embelezar ou tornar esplêndido e se ajusta naturalmente ao átrio como objeto.
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: o átrio do santuário
  rationale: עֲזֶרֶת designa o pátio ou recinto do templo; 'átrio' é uma designação bíblica clara e preserva a relação com מִקְדָּשׁ.
theological_decisions:
- issue: Relação entre o texto hebraico e a leitura grega do altar
  choice: Seguir o hebraico, traduzindo מִזְבַּח הוֹד como 'altar majestoso'.
  alternative: 'Seguir o grego: ''altar santo''.'
  rationale: O hebraico preservado é coerente e de alta confiança; o grego confirma o cenário litúrgico, mas apresenta ἁγίου, 'santo', em vez de הוֹד, 'majestade/esplendor'. A variante é registrada sem substituir silenciosamente a leitura hebraica.
- issue: Aspecto verbal da descrição cerimonial
  choice: 'Usar o imperfeito descritivo em português: ''vestia'', ''se revestia'', ''subia'', ''adornava''.'
  alternative: 'Usar o pretérito perfeito: ''vestiu'', ''revestiu-se'', ''subiu'', ''adornou''.'
  rationale: As construções temporais hebraicas retratam as ações simultâneas da cerimônia; o imperfeito português apresenta naturalmente a cena sem impor uma sequência rígida.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A alternância entre 'trajes' e 'vestes' evita repetição pesada sem apagar o paralelismo. 'Átrio' mantém o vocabulário cultual reconhecível, e a nota preserva a tensão real entre os testemunhos hebraico e grego.
