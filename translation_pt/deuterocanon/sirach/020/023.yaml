  yaml_path: translation/deuterocanon/sirach/020/023.yaml
  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: pt
  text: Há quem, por vergonha, prometa um favor a um amigo e, assim, faça dele um inimigo em vão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem motivo”; o advérbio grego pode indicar algo inútil ou sem proveito, ou algo feito sem justa causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: um favor
  rationale: Neste contexto de relações sociais, indica um favor ou ato de bondade, não a noção teológica de “graça”.
- source_word: αἰσχύνης
  choice: por vergonha
  rationale: 'O genitivo exprime a motivação da promessa: ela é feita sob a pressão da vergonha ou do constrangimento.'
- source_word: ἐπαγγελλόμενος
  choice: prometa
  rationale: Expressa de modo direto e natural o ato de assumir verbalmente o compromisso de prestar o favor.
- source_word: φίλῳ
  choice: a um amigo
  rationale: O dativo assinala o destinatário do favor prometido.
- source_word: ἐκτήσατο αὐτὸν ἐχθρόν
  choice: faça dele um inimigo
  rationale: Reproduz com clareza o resultado irônico de “adquiri-lo como inimigo”, evitando em português uma formulação excessivamente literal e pouco natural.
- source_word: δωρεάν
  choice: em vão
  rationale: Conserva o sentido de inutilidade ou ausência de proveito; a possibilidade de entender o termo como “sem motivo” é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com construção proverbial natural. “Por vergonha” mantém a motivação explícita do grego, enquanto “faça dele um inimigo” comunica a ironia do resultado sem rigidez literal.
