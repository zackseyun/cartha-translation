  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: pt
  text: Há quem se cale por não haver resposta,[a] e há quem se cale porque vê o momento certo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por falta de resposta»; literalmente, «por não haver resposta».'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: «O sábio ficará calado até o momento certo, mas o tagarela e o insensato ultrapassarão o momento certo». As formas hebraica e grega deste provérbio diferem consideravelmente; o texto principal segue o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: se cale
  rationale: O particípio de חרש indica abster-se de falar. A construção proverbial «há quem se cale» é natural em português e preserva o paralelismo das duas orações.
- source_word: מֵאֵין מַעֲנֶה
  choice: por não ter resposta
  rationale: Expressa de modo idiomático a ausência de resposta ou réplica, sem decidir se a pessoa não sabe responder ou se não existe resposta disponível.
- source_word: רֹאֶה עֵת
  choice: percebe o momento certo
  rationale: O hebraico diz literalmente «vê o tempo». «Percebe» transmite a ideia de discernir a ocasião, enquanto «momento certo» explicita a adequação temporal sugerida pelo contexto sapiencial e corroborada pelo paralelo grego.
- source_word: עֵת
  choice: momento certo
  rationale: עֵת significa «tempo, ocasião». Neste provérbio, a ideia é a ocasião apropriada para falar; «momento certo» é claro e natural em português contemporâneo.
