translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo «Há quem... e há quem...» reproduz a estrutura proverbial hebraica. A formulação evita linguagem marcada por gênero onde o hebraico não exige explicitá-la.
