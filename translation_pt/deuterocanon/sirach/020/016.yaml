  text: A fool will say[a], “I have no friend, and there is no gratitude for my good deeds.”
translation:
  language: pt
  text: 'O insensato dirá: “Não tenho amigo, e não há gratidão pelas minhas boas ações.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há agradecimento pelos benefícios que faço”. O grego χάρις pode significar “gratidão”, “agradecimento” ou “favor”, e τοῖς ἀγαθοῖς μου pode significar “minhas coisas boas”, “meus benefícios” ou “minhas boas ações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: o insensato
  rationale: Designa genericamente uma pessoa sem sabedoria. “O insensato” é natural na literatura sapiencial em português e preserva o caráter proverbial.
- source_word: ἐρεῖ
  choice: dirá
  rationale: Reproduz diretamente o futuro do indicativo grego, sem prejudicar a naturalidade da máxima.
- source_word: Οὐχ ὑπάρχει μοι φίλος
  choice: não tenho amigo
  rationale: A construção com ὑπάρχει e dativo expressa existência ou posse em relação ao falante; esta é a forma idiomática e clara em português.
- source_word: χάρις
  choice: gratidão
  rationale: Neste contexto, indica reconhecimento ou agradecimento em resposta ao bem realizado, e não o sentido teológico específico de “graça”.
- source_word: τοῖς ἀγαθοῖς μου
  choice: pelas minhas boas ações
  rationale: O adjetivo plural substantivado pode indicar as coisas boas, os benefícios ou os atos bons do falante. “Boas ações” comunica o sentido provável com naturalidade, enquanto a nota preserva a amplitude lexical.
