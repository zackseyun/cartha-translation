lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: É o sentido normal no contexto sapiencial e preserva o paralelo com o tesouro como algo valioso.
- source_word: κεκρυμμένη
  choice: escondida
  rationale: O particípio perfeito passivo indica algo que foi ocultado e permanece escondido; a formulação é natural e concisa em português.
- source_word: θησαυρός
  choice: tesouro
  rationale: Mantém a imagem concreta de algo valioso e corresponde ao sentido corrente do substantivo grego.
- source_word: ἀφανής
  choice: que não se vê
  rationale: Expressa aquilo que não está visível e evita repetir de modo pesado «escondido», preservando o paralelismo.
- source_word: τίς ὠφέλεια
  choice: que proveito há
  rationale: Reproduz com clareza e dignidade a pergunta sobre utilidade ou benefício prático.
- source_word: ἐν ἀμφοτέροις
  choice: em ambos
  rationale: Conserva de modo formalmente próximo a referência grega aos dois elementos tomados em conjunto, sem excluir a implicação de que nenhum deles beneficia quando permanece inacessível.
