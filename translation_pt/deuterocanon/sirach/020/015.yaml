  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
translation:
  language: pt
  text: Hoje ele empresta, e amanhã exige de volta; um homem assim é detestável.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «odiado». O adjetivo grego pode descrever tanto alguém detestável quanto alguém que é odiado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Hoje
  rationale: Preserva de modo direto o contraste temporal proverbial com αὔριον, «amanhã».
- source_word: δανιεῖ
  choice: ele empresta
  rationale: Embora a forma grega seja futura, o presente em português expressa naturalmente a ação típica ou proverbial e mantém a concisão.
- source_word: αὔριον
  choice: amanhã
  rationale: Mantém o contraste incisivo entre a concessão de hoje e a cobrança no dia seguinte.
- source_word: ἀπαιτήσει
  choice: exige de volta
  rationale: O verbo significa pedir ou exigir a restituição; «de volta» explicita com naturalidade o objeto implícito no ato de emprestar.
- source_word: μισητός
  choice: detestável
  rationale: Comunica que esse comportamento torna o homem odioso, sem excluir a possibilidade semântica de que ele seja odiado.
- source_word: ἄνθρωπος
  choice: homem
  rationale: Conserva o singular masculino do grego e a caracterização proverbial de um tipo humano.
- source_word: ὁ τοιοῦτος
  choice: um homem assim
  rationale: Formulação portuguesa natural para identificar o tipo de homem descrito na primeira oração.
theological_decisions:
- issue: Sentido passivo ou qualitativo de μισητός
  choice: detestável
  alternative: odiado
  rationale: O adjetivo grego admite tanto a descrição do caráter odioso quanto a reação que ele provoca. O texto principal usa o sentido qualitativo, e a nota preserva a alternativa passiva.
- issue: Forma genérica de ἄνθρωπος no provérbio sapiencial
  choice: homem
  alternative: pessoa
  rationale: A tradução mantém a forma masculina singular do texto grego sem transformar a afirmação em distinção doutrinária de gênero.
translation_notes:
  register: Português moderno, conciso e proverbial, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A pontuação conserva o paralelismo entre «hoje» e «amanhã».
