  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
translation:
  language: pt
  text: Como o desejo de um eunuco de tirar a virgindade de uma jovem, assim é quem executa decisões judiciais à força.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com violência”. A expressão grega pode destacar coerção ou ação violenta.
    reason: lexical_alternative
  - marker: b
    text: A imagem do provérbio pode enfatizar tanto a impropriedade de decisões judiciais coercivas quanto sua incongruência, frustração e inutilidade.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: desejo
  rationale: O substantivo designa desejo ou anseio; “desejo” é natural e não especifica além do que a própria imagem sexual já implica.
- source_word: εὐνούχου
  choice: de um eunuco
  rationale: “Eunuco” é o equivalente tradicional e preciso, preservando o aspecto físico e cultural necessário à comparação.
- source_word: ἀποπαρθενῶσαι
  choice: tirar a virgindade
  rationale: O verbo significa privar uma jovem de sua virgindade. A expressão é clara em português moderno e semanticamente mais precisa que uma formulação genérica sobre relações sexuais.
- source_word: νεάνιδα
  choice: uma jovem
  rationale: O termo indica uma pessoa jovem do sexo feminino; “uma jovem” é corrente, digno e adequado ao contexto.
- source_word: οὕτως
  choice: assim é
  rationale: Introduz diretamente o segundo termo da comparação proverbial.
- source_word: ὁ ποιῶν ... κρίματα
  choice: quem executa julgamentos
  rationale: A formulação conserva o particípio substantivado e o plural κρίματα, indicando a prática ou aplicação de decisões judiciais, sem reduzir o sentido a uma única sentença.
- source_word: ἐν βίᾳ
  choice: à força
  rationale: A expressão indica coerção ou ação violenta; “à força” é direta e natural, mantendo aberta a possibilidade de violência explícita.
theological_decisions:
- issue: Sentido moral da comparação proverbial
  choice: Preservar a imagem e apresentar a administração coerciva de julgamentos como algo impróprio ou frustrado, sem explicar no texto principal qual aspecto domina.
  alternative: Entender a comparação principalmente como referência à impotência, ao absurdo ou à inutilidade, e não sobretudo à condenação moral da coerção.
  rationale: O grego oferece a comparação sem explicá-la. A tradução mantém tanto a crítica à força quanto a tensão entre impropriedade, incongruência e frustração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tirar a virgindade” evita o caráter literário ou eufemístico de “desvirginar”, enquanto “executa julgamentos” mantém proximidade com a construção grega, embora soe deliberadamente formal.
