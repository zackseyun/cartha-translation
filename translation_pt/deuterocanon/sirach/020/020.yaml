  yaml_path: translation/deuterocanon/sirach/020/020.yaml
  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
translation:
  language: pt
  text: Da boca do insensato, um provérbio será rejeitado,[a] pois ele certamente não o dirá no momento oportuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Da boca do insensato, uma parábola será rejeitada”, caso o termo παραβολή seja entendido em sentido mais amplo que “provérbio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  choice: Da boca de
  rationale: Preserva a imagem concreta de origem ou procedência da fala, com formulação natural em português.
- source_word: μωροῦ
  choice: do insensato
  rationale: No contexto sapiencial, designa alguém sem bom senso moral e prático, não apenas uma pessoa de pouca inteligência.
- source_word: ἀποδοκιμασθήσεται
  choice: será rejeitado
  rationale: Mantém o futuro passivo e evita especificar além do texto quem rejeita o provérbio.
- source_word: παραβολή
  choice: um provérbio
  rationale: No contexto sapiencial de Sirácida, refere-se de modo natural a um dito de sabedoria; a acepção mais ampla é registrada em nota.
- source_word: οὐ γὰρ μὴ
  choice: pois ele certamente não
  rationale: Comunica a força enfática da negação grega em português atual.
- source_word: εἴπῃ αὐτὴν
  choice: o dirá
  rationale: Expressa de maneira idiomática o ato de enunciar o provérbio; o pronome retoma 'provérbio'.
- source_word: ἐν καιρῷ αὐτῆς
  choice: no momento oportuno
  rationale: καιρός indica não apenas tempo, mas a ocasião apropriada; αὐτῆς é entendido como referência à ocasião própria do provérbio.
