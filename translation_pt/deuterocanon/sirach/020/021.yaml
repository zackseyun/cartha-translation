  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: pt
  text: Há quem seja impedido de pecar pela pobreza[a] e, em seu descanso, não sentirá remorso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da necessidade” ou “pela falta de recursos”. A expressão grega indica que a carência ou pobreza é a razão pela qual a pessoa é impedida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não será pungido” ou “não será traspassado”. A imagem indica não sentir compunção ou remorso interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: seja impedido
  rationale: Preserva o sentido passivo de ser restringido ou impedido, em português natural.
- source_word: ἁμαρτάνειν
  choice: de pecar
  rationale: Mantém diretamente a força moral e religiosa do infinitivo grego.
- source_word: ἀπὸ ἐνδείας
  choice: pela pobreza
  rationale: Expressa de modo conciso o valor causal da falta ou necessidade como aquilo que impede a pessoa de pecar.
- source_word: ἀναπαύσει
  choice: descanso
  rationale: É a correspondência mais direta e preserva a abertura entre repouso, alívio e uma condição tranquila.
- source_word: οὐ κατανυγήσεται
  choice: não sentirá remorso
  rationale: Comunica em português corrente a ideia figurada de não ser interiormente pungido, isto é, não sentir compunção ou remorso.
theological_decisions:
- issue: Implicação moral da pobreza como impedimento ao pecado
  choice: O texto afirma, como observação de sabedoria, que a pobreza pode impedir alguém de pecar e que essa pessoa não sentirá remorso em seu descanso.
  alternative: Entender a falta de modo mais geral como limitação que impede uma ação errada, sem atribuir virtude moral à pobreza em si.
  rationale: A tradução conserva a tensão do grego sem transformar a pobreza em virtude inerente nem explicar qual pecado seria inviabilizado pela falta de recursos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Há quem” traduz naturalmente a expressão existencial grega; “em seu descanso” mantém a formulação aberta do original.
