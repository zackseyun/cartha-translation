base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/024.yaml
  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: pt
  text: A mentira é uma mancha vergonhosa numa pessoa[a]; na boca dos indisciplinados[b], ela estará sempre presente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mancha má” ou “uma desonra”. O grego usa um singular genérico para “pessoa”.'
    reason: lexical_alternative
  - marker: b
    text: “Indisciplinados” também pode ser traduzido por “não instruídos”, “sem formação” ou “incultos”; aqui, o sentido provavelmente envolve falta de formação moral, e não apenas de escolaridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: mancha vergonhosa
  rationale: Preserva a imagem concreta de μῶμος como mancha ou defeito e expressa a avaliação negativa de πονηρός em português natural.
- source_word: ἐν ἀνθρώπῳ
  choice: numa pessoa
  rationale: O singular é genérico, sem referência exclusiva ao sexo masculino; “numa pessoa” comunica essa abrangência com naturalidade em português moderno.
- source_word: ψεῦδος
  choice: a mentira
  rationale: Tradução direta e concreta, adequada ao caráter proverbial da frase.
- source_word: ἀπαιδεύτων
  choice: quem não aceita instrução
  rationale: No contexto sapiencial, o termo indica falta de formação e disciplina moral, não apenas ausência de escolaridade. A formulação evita sugerir mera deficiência educacional.
- source_word: ἐνδελεχισθήσεται
  choice: persistirá continuamente
  rationale: Expressa a continuidade duradoura indicada pelo futuro passivo, preservando a ideia de presença habitual na boca.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπῳ
  choice: numa pessoa
  alternative: num homem
  rationale: O grego emprega o singular genérico; a opção escolhida preserva a referência humana abrangente sem introduzir exclusividade masculina.
- issue: Nuance moral de ἀπαίδευτος
  choice: quem não aceita instrução
  alternative: o indisciplinado; o inculto
  rationale: Em literatura sapiencial, a palavra costuma envolver falta de formação moral. A escolha torna essa nuance clara sem reduzir o termo à escolaridade nem definir de modo excessivamente rígido a causa dessa condição.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção proverbial e o paralelismo entre “numa pessoa” e “na boca” foram preservados.
