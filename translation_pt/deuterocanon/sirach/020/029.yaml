  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: pt
  text: A hospitalidade[a] e os presentes[b] cegam os olhos dos sábios e, como uma mordaça na boca, afastam as repreensões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presentes de hospitalidade”. O grego pode se referir tanto à hospitalidade oferecida a um hóspede quanto aos presentes associados a ela.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “presentes” tem o sentido de favores capazes de corromper o julgamento; o grego não diz explicitamente “subornos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: hospitalidade
  rationale: O termo pode indicar a hospitalidade oferecida a um hóspede ou presentes ligados à relação de hospitalidade. “Hospitalidade” preserva o favor social em contraste com δῶρα, sem reduzir ambos os termos a “presentes”.
- source_word: δῶρα
  choice: presentes
  rationale: É o sentido literal do termo. O contexto sugere favores capazes de corromper o julgamento, mas o grego não emprega explicitamente uma palavra que signifique “subornos”.
- source_word: ἀποτυφλοῖ
  choice: cegam
  rationale: Preserva a metáfora forte de tornar alguém incapaz de ver, aqui aplicada ao discernimento dos sábios. O plural é exigido pela concordância natural em português com o sujeito composto.
- source_word: ὀφθαλμοὺς σοφῶν
  choice: os olhos dos sábios
  rationale: Reproduz diretamente a construção grega e mantém a imagem do discernimento prejudicado.
- source_word: φιμός
  choice: focinheira
  rationale: Mantém a imagem concreta de um objeto posto sobre a boca para impedir a fala, em vez de substituí-la pela interpretação mais abstrata “mordaça”.
- source_word: ἀποτρέπει
  choice: afastam
  rationale: Expressa o ato de desviar ou impedir que as repreensões cheguem a ser feitas. O plural mantém a concordância idiomática em português.
- source_word: ἐλεγμούς
  choice: repreensões
  rationale: No contexto sapiencial, o termo designa censuras ou correções verbais; “repreensões” conserva sua força moral em linguagem atual.
