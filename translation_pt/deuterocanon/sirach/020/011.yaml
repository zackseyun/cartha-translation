  text: There is one who buys much for little[b][a], and repays it sevenfold.
translation:
  language: pt
  text: Há quem compre muitas coisas por pouco e pague por elas sete vezes tanto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «pagando-as sete vezes tanto»; a formulação é condensada, e o pronome plural retoma o que foi comprado.
    reason: lexical_alternative
  - marker: b
    text: O sentido pode ser que alguém compre muitas coisas barato e pague sete vezes o valor, ou, de forma mais geral, que uma aparente pechincha acabe custando muito caro.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν
  choice: Há quem
  rationale: A fórmula existencial introduz, em estilo sapiencial, um tipo de pessoa ou uma situação recorrente.
- source_word: ἀγοράζων
  choice: compre
  rationale: Preserva de modo natural e direto a imagem comercial do verbo ἀγοράζω.
- source_word: πολλὰ
  choice: muitas coisas
  rationale: O neutro plural funciona como objeto da compra; a tradução explícita evita que «muito» seja entendido apenas como intensidade.
- source_word: ὀλίγου
  choice: por pouco
  rationale: O genitivo expressa preço e indica custo baixo, mantendo a concisão proverbial.
- source_word: ἀποτιννύων
  choice: pague
  rationale: O verbo indica pagar ou quitar o que é devido. Neste contexto comercial, «pague» é natural e não determina se o pagamento é literal ou figurado.
- source_word: αὐτὰ
  choice: por elas
  rationale: Mantém o referente no plural, de acordo com a forma grega e com «muitas coisas», sem substituir o pronome por uma explicação do seu valor.
- source_word: ἑπταπλάσιον
  choice: sete vezes tanto
  rationale: Reproduz a medida sétupla sem definir indevidamente se ela se aplica ao preço, ao valor ou ao custo final.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e ampla compreensão internacional. «Há quem» conserva o caráter sapiencial; «sete vezes tanto» evita a possível imprecisão aritmética de «sete vezes mais».
