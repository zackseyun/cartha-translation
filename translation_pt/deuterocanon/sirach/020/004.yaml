translation:
  language: pt
  text: Há quem se mantenha calado e seja considerado sábio, e há quem seja odiado por falar demais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν
  choice: Há quem
  rationale: A fórmula existencial repetida apresenta dois tipos de pessoa e, assim, preserva com naturalidade o contraste proverbial.
- source_word: σιωπῶν
  choice: se mantenha calado
  rationale: O particípio presente indica silêncio continuado; a expressão também sugere contenção sem afirmar além do texto qual seja a motivação.
- source_word: εὑρισκόμενος
  choice: seja considerado
  rationale: Expressa de modo natural o passivo grego no sentido de alguém ser reconhecido ou avaliado como sábio, sem transformar isso numa afirmação direta de que realmente o seja.
- source_word: σοφός
  choice: sábio
  rationale: É o equivalente corrente e apropriado ao contexto sapiencial, sem acrescentar marca de gênero.
- source_word: μισητός
  choice: odiado
  rationale: Conserva de modo direto e atual a forte avaliação negativa do grego.
- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: por falar demais
  rationale: ἀπό indica aqui a causa, enquanto πολλῆς λαλιᾶς descreve fala abundante; a formulação portuguesa é clara, concisa e idiomática.
