  text: Better is a man who hides his foolishness than a man who hides his wisdom[a].
translation:
  language: pt
  text: Melhor é quem esconde a própria insensatez do que quem esconde a própria sabedoria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείσσων
  choice: Melhor é
  rationale: O comparativo introduz uma comparação proverbial; a construção mantém a concisão e a força aforística do grego.
- source_word: ἄνθρωπος
  choice: quem
  rationale: Embora o substantivo grego esteja no masculino singular, aqui tem sentido humano genérico. “Quem” comunica esse valor naturalmente em português e evita a repetição pesada de “uma pessoa” sem alterar o alcance do provérbio.
- source_word: ἀποκρύπτων
  choice: esconde
  rationale: O particípio presente caracteriza a pessoa em questão. A forma verbal “esconde” é idiomática e preserva o paralelismo repetido do original.
- source_word: μωρίαν
  choice: insensatez
  rationale: μωρία designa falta de juízo ou tolice moral. “Insensatez” é clara, digna e apropriada ao tom sapiencial.
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o equivalente corrente de σοφία e preserva um termo central da literatura sapiencial.
- source_word: αὐτοῦ
  choice: a própria
  rationale: O possessivo refere-se, em cada membro, ao sujeito que esconde. “A própria” explicita essa referência reflexiva de modo natural e mantém o paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e proverbial, com ampla legibilidade brasileira. A repetição de “quem esconde” conserva o paralelismo grego; não há necessidade de nota textual ou lexical.
