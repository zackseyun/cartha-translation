translation:
  language: pt
  text: O caráter do mentiroso é uma desonra,[a] e a sua vergonha o acompanha continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A índole de um homem mentiroso é desonra, e sua vergonha está constantemente com ele”.'
    reason: Registra alternativas legítimas para ἦθος, ἀνθρώπου ψευδοῦς, ἀτιμία e a formulação mais literal de μετʼ αὐτοῦ ἐνδελεχῶς, sem introduzir uma relação causal ausente do grego.
lexical_decisions:
- source_word: ἦθος
  choice: caráter
  rationale: Neste contexto, designa a disposição moral consolidada ou o modo característico de ser de alguém; “caráter” é natural e não reduz o sentido a mero hábito ou costume.
- source_word: ἀνθρώπου ψευδοῦς
  choice: do mentiroso
  rationale: A expressão genitiva descreve uma pessoa caracterizada pela falsidade. “Do mentiroso” conserva o singular masculino gramatical e soa mais natural em português do que “do homem mentiroso”.
- source_word: ἀτιμία
  choice: uma desonra
  rationale: O termo indica desonra, falta de honra ou condição vergonhosa. “Uma desonra” preserva a distinção em relação a αἰσχύνη e produz uma frase idiomática em português.
- source_word: αἰσχύνη
  choice: vergonha
  rationale: É a correspondência mais direta e transparente, mantendo-a distinta da “desonra” mencionada na primeira oração.
- source_word: μετʼ αὐτοῦ
  choice: o acompanha
  rationale: Embora literalmente signifique “está com ele”, o verbo “acompanha” expressa com naturalidade em português a presença persistente da vergonha sem acrescentar uma ideia estranha ao texto.
- source_word: ἐνδελεχῶς
  choice: continuamente
  rationale: Comunica a continuidade ou persistência indicada pelo advérbio grego, em linguagem moderna e clara.
