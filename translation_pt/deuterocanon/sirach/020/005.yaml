  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
translation:
  language: pt
  text: Há quem se cale e seja considerado sábio[a], e há quem seja desprezado por falar demais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Há quem se cale porque não tem resposta, e há quem se cale por conhecer o momento oportuno.” O testemunho hebraico preservado aqui difere substancialmente; o texto principal segue o hebraico existente como fonte primária de Sirácida quando disponível.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: A construção existencial introduz um tipo de pessoa; «Há quem» é natural em português e preserva o paralelismo proverbial.
- source_word: מַחֲרִישׁ
  choice: se cale
  rationale: O particípio de חרש descreve alguém que permanece em silêncio. A forma pronominal é corrente e mantém o sentido caracterizador.
- source_word: וְנֶחְשָׁב
  choice: seja considerado
  rationale: O nifal indica ser tido ou reputado como algo por outras pessoas; «seja considerado» expressa claramente essa avaliação social.
- source_word: חָכָם
  choice: sábio
  rationale: O adjetivo tem o sentido sapiencial comum de pessoa dotada de sabedoria, sem necessidade de explicitar o gênero masculino em português.
- source_word: נִמְאָס
  choice: seja desprezado
  rationale: מאס comunica rejeição acompanhada de desdém; «desprezado» preserva o contraste social com «considerado sábio».
- source_word: בְּרוֹב
  choice: por ... demais
  rationale: A preposição com רֹב indica causa ligada ao excesso. Em português natural, a construção «por falar demais» transmite essa força causal.
- source_word: שִׂיחַ
  choice: falar
  rationale: שִׂיחַ denota fala ou conversa. A locução verbal «falar demais» é idiomática, clara e incisiva no contraste com calar-se.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Seguir o testemunho hebraico no texto principal e registrar o grego em nota
  alternative: Adotar no texto principal a leitura grega sobre calar-se por não ter resposta ou por conhecer o momento oportuno
  rationale: O testemunho hebraico disponível é a fonte primária indicada e forma um provérbio coerente. A diferença do grego é genuína e relevante, por isso não deve ser harmonizada nem omitida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Há quem» conserva a concisão proverbial; «falar demais» comunica naturalmente a ideia hebraica de fala excessiva. O marcador [a] aparece no texto principal junto ao ponto de divergência textual.
