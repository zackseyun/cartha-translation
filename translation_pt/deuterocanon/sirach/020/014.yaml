translation:
  language: pt
  text: Dá pouco e faz muitas censuras; abre a boca como um arauto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Dará pouco e fará muitas censuras; abrirá a boca como um arauto». Os futuros gregos também podem ser traduzidos literalmente, embora aqui provavelmente expressem um comportamento habitual em forma proverbial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: pouco
  rationale: O neutro plural funciona como objeto de δώσει e indica uma dádiva escassa; «dá pouco» é natural e conciso em português.
- source_word: δώσει
  choice: dá
  rationale: Embora a forma grega seja futura, o contexto proverbial favorece o presente gnômico, que expressa um padrão habitual de comportamento.
- source_word: πολλὰ ὀνειδίσει
  choice: faz muitas censuras
  rationale: A expressão contrapõe a escassez da dádiva à abundância de recriminações. «Faz muitas censuras» preserva essa oposição sem acrescentar ao grego a imagem de acumular.
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: abre a boca
  rationale: A expressão idiomática grega é transparente em português e conserva a imagem que introduz a comparação seguinte.
- source_word: ὡς κῆρυξ
  choice: como um arauto
  rationale: κῆρυξ designa quem faz proclamações públicas; «arauto» mantém o caráter público e enfático da imagem.
