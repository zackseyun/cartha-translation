  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: pt
  text: O sábio progredirá por suas palavras, e o homem prudente agradará aos poderosos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos grandes”, “aos nobres” ou “aos governantes”. O grego se refere de modo amplo a pessoas socialmente proeminentes ou poderosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  choice: sábio
  rationale: Em literatura sapiencial, designa quem possui sabedoria prática; “sábio” é o equivalente português mais direto e natural.
- source_word: ἐν λόγοις
  choice: por suas palavras
  rationale: 'A preposição tem aqui valor instrumental: as palavras são o meio pelo qual o sábio progride.'
- source_word: προάξει ἑαυτόν
  choice: progredirá
  rationale: O verbo com o pronome reflexivo expressa fazer a si mesmo avançar. “Progredirá” comunica esse avanço pessoal em português natural, sem a conotação moderna e possivelmente negativa de “se promoverá”.
- source_word: ἄνθρωπος φρόνιμος
  choice: o homem prudente
  rationale: “Homem” preserva o singular masculino do grego, e “prudente” expressa discernimento e bom senso prático no contexto sapiencial.
- source_word: ἀρέσει
  choice: agradará
  rationale: Tradução direta do verbo grego para ser agradável ou causar satisfação a alguém.
- source_word: μεγιστᾶσιν
  choice: aos poderosos
  rationale: O termo se refere amplamente a pessoas socialmente eminentes ou influentes. “Poderosos” é natural e evita sugerir necessariamente um cargo político específico.
