  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: pt
  text: Quem cultiva a terra aumentará o seu monte de grãos, e quem agrada aos poderosos fará expiação pela injustiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encobrirá a injustiça”. O grego emprega linguagem de expiação, talvez descrevendo o efeito prático de conquistar o favor de pessoas poderosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: quem cultiva a terra
  rationale: A expressão participial designa genericamente a pessoa que trabalha o solo. “Cultiva a terra” comunica com naturalidade o sentido agrícola sem restringi-lo a uma função específica.
- source_word: ἀνυψώσει
  choice: aumentará
  rationale: O verbo significa literalmente “levantará” ou “erguerá”; aplicado a um monte de grãos, indica fazê-lo ficar mais alto e, portanto, aumentá-lo. A escolha preserva a imagem de crescimento de modo natural em português.
- source_word: θιμωνιὰν αὐτοῦ
  choice: o seu monte de grãos
  rationale: O substantivo designa um monte de grãos colhidos ou de feixes. “Monte de grãos” mantém a imagem agrária e é prontamente compreensível.
- source_word: ὁ ἀρέσκων
  choice: quem agrada
  rationale: Traduz diretamente o particípio substantivado sem acrescentar a conotação negativa de bajulação, que não é explícita no grego.
- source_word: μεγιστᾶσιν
  choice: aos poderosos
  rationale: O termo se refere a pessoas eminentes, influentes ou socialmente poderosas. “Poderosos” expressa o status social sem especificá-los indevidamente como governantes.
- source_word: ἐξιλάσεται
  choice: fará expiação por
  rationale: O verbo pertence ao campo semântico da expiação e do apaziguamento. A formulação mantém seu peso moral e cultual, embora o provérbio também possa sugerir o efeito prático de obter o favor dos poderosos.
- source_word: ἀδικίαν
  choice: injustiça
  rationale: O termo pode significar injustiça, iniquidade ou ato errado. “Injustiça” conserva sua dimensão moral e social e combina com a linguagem de expiação.
theological_decisions:
- issue: 'Sentido da segunda oração: se agradar aos poderosos expia a injustiça ou, pragmaticamente, faz com que ela seja encoberta.'
  choice: fará expiação pela injustiça
  alternative: encobrirá a injustiça
  rationale: O grego ἐξιλάσεται tem força expiatória ou propiciatória. A tradução principal preserva essa linguagem e a tensão moral do provérbio, enquanto a nota registra a possível implicação social sem torná-la a única leitura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Evitou-se “bajula” para não importar uma avaliação negativa ausente do verbo grego, e manteve-se a linguagem forte de expiação na segunda oração.
