translation:
  language: pt
  text: O sábio fala pouco de si mesmo[b], mas a bondade dos insensatos derrama sabedoria[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «O presente de um insensato não lhe trará benefício, pois os olhos dele são muitos em vez de um só.» Os testemunhos hebraico e grego diferem substancialmente neste versículo. O texto principal segue o testemunho hebraico preservado; a forma grega é registrada aqui porque a divergência altera de modo significativo a interpretação.'
    reason: textual_variant
  - marker: b
    text: 'Ou: «O sábio fala brevemente.»'
    reason: lexical_alternative
  - marker: c
    text: 'A oração final pode ser irônica: os insensatos derramam palavras como se estivessem distribuindo sabedoria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: o sábio
  rationale: Uso substantivado de חָכָם, natural em português e adequado ao caráter proverbial.
- source_word: בִּמְעַט דִבֶּר
  choice: fala pouco
  rationale: Expressa de modo conciso o falar com poucas palavras; a alternativa «fala brevemente» é registrada em nota.
- source_word: נַפְשׁוֹ
  choice: de si mesmo
  rationale: Entende נֶפֶשׁ reflexivamente no contexto, sem introduzir a noção de alma como entidade imaterial.
- source_word: וְטוֹבַת
  choice: mas a bondade
  rationale: Preserva o valor mais direto de טוֹבָה e a estranheza do hebraico; «presente» ou «benefício» é possível, mas poderia aproximar indevidamente o texto principal da forma grega divergente.
- source_word: כְּסִילִים
  choice: dos insensatos
  rationale: Mantém a relação genitiva e usa um termo corrente e digno para pessoas moral ou intelectualmente tolas.
- source_word: יִשְׁפוֹךְ
  choice: derrama
  rationale: Conserva a imagem concreta do verbo hebraico, inclusive sua possível força irônica.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente direto que preserva a tensão ou ironia do segundo membro.
