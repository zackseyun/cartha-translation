  text: There is a humiliation for the sake of glory, and there is one who from humiliation has lifted up his head.
translation:
  language: pt
  text: Há rebaixamento em vista da glória[a], e há quem, a partir da humilhação, tenha erguido a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há uma redução por causa da glória”. O substantivo grego pode indicar redução, rebaixamento ou humilhação; a frase associa o ser posto abaixo à glória ou honra.'
    reason: lexical_alternative
  - marker: b
    text: “Erguer a cabeça” é uma imagem para sair de uma condição inferior e alcançar dignidade ou confiança.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  choice: rebaixamento
  rationale: Expressa a redução ou condição de ser posto abaixo, sobretudo no plano social, sem limitar o sentido à experiência subjetiva de vergonha.
- source_word: ἕνεκεν δόξης
  choice: em vista da glória
  rationale: Mantém a relação de finalidade ou orientação possível em ἕνεκεν e reproduz o paradoxo de um rebaixamento relacionado à glória.
- source_word: δόξης
  choice: glória
  rationale: Preserva a amplitude de δόξα e o contraste elevado com o rebaixamento; no contexto, também pode envolver honra ou estima.
- source_word: ἀπὸ ταπεινώσεως
  choice: a partir da humilhação
  rationale: Apresenta a humilhação ou condição inferior como o ponto de partida da elevação, sem convertê-la na virtude da humildade.
- source_word: ἦρεν κεφαλήν
  choice: tenha erguido a cabeça
  rationale: Conserva a imagem concreta do idioma grego, que sugere sair de uma condição inferior para dignidade, confiança ou honra.
- source_word: ἔστιν ὃς
  choice: há quem
  rationale: É a formulação portuguesa natural e concisa para introduzir, em estilo proverbial, um tipo indeterminado de pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Rebaixamento” e “humilhação” distinguem os dois substantivos gregos sem romper seu paralelismo; a imagem de erguer a cabeça foi preservada.
