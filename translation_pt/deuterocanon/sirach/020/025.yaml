  text: A thief is preferable to one who persists in lying[a]; yet both will inherit destruction.
translation:
  language: pt
  text: É preferível um ladrão a alguém que persiste em mentir[a]; ambos, porém, herdarão a destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Um ladrão deve ser escolhido em vez de alguém que persiste em mentir.”'
    reason: Alternativa lexical para αἱρετόν; «deve ser escolhido» exprime de modo mais formal o sentido de «é preferível».
lexical_decisions:
- source_word: αἱρετὸν
  choice: é preferível
  rationale: Expressa de modo natural o sentido comparativo de algo que deve ser escolhido ou considerado preferível, sem transformar a frase em recomendação moral.
- source_word: κλέπτης
  choice: um ladrão
  rationale: κλέπτης designa normalmente quem furta, e não especificamente um assaltante violento.
- source_word: ἐνδελεχίζων
  choice: quem persiste
  rationale: O particípio comunica ação contínua ou habitual; “persiste” preserva essa força durativa em português corrente.
- source_word: ψεύδει
  choice: na mentira
  rationale: O dativo indica a esfera ou prática em que a pessoa persiste. “Na mentira” é conciso, natural e mantém a possível referência tanto ao ato de mentir quanto à falsidade habitual.
- source_word: ἀμφότεροι
  choice: ambos
  rationale: Equivalente direto que inclui as duas pessoas comparadas.
- source_word: ἀπώλειαν
  choice: a destruição
  rationale: Preserva o peso de ἀπώλεια como ruína ou destruição, sem impor um sentido teológico técnico posterior.
- source_word: κληρονομήσουσιν
  choice: herdarão
  rationale: Mantém a imagem literal e a ironia proverbial de receber a destruição como herança ou porção.
theological_decisions:
- issue: Comparação moral no provérbio
  choice: O ladrão é declarado preferível à pessoa que persiste na mentira, mas ambos têm a destruição como destino.
  alternative: Entender a comparação apenas como hipérbole retórica sobre a gravidade da mentira persistente.
  rationale: O comparativo grego é real e deve ser preservado; ao mesmo tempo, a segunda oração impede que a preferência relativa seja entendida como aprovação do furto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o contraste proverbial e a imagem da herança. “Contudo” explicita naturalmente a oposição marcada por δέ, sem suavizar a condenação de ambos.
