  text: There is a gift that will not profit you[a], and there is a gift whose repayment is double.
translation:
  language: pt
  text: Há uma dádiva que não lhe trará benefício[a], e há uma dádiva cuja retribuição é dupla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há um ato de dar que não lhe trará benefício, e há um ato de dar cujo retorno é em dobro.”'
    reason: δόσις pode indicar a dádiva ou o próprio ato de dar; ἀνταπόδομα também pode ser traduzido como “retorno”.
lexical_decisions:
- source_word: δόσις
  choice: dádiva
  rationale: O substantivo pode designar tanto o ato de dar como aquilo que é dado. “Dádiva” mantém a concisão proverbial e permite entender algo concedido, sem restringir o sentido a dinheiro.
- source_word: λυσιτελήσει
  choice: trará benefício
  rationale: O futuro verbal exprime vantagem ou proveito. “Trará benefício” é natural no português atual e não limita o proveito ao âmbito financeiro.
- source_word: σοι
  choice: lhe
  rationale: O dativo identifica a pessoa afetada; “lhe trará benefício” reproduz essa relação de modo idiomático.
- source_word: ἀνταπόδομα
  choice: retribuição
  rationale: O termo indica aquilo que é dado de volta em resposta. “Retribuição” preserva a reciprocidade sem exigir que se trate de uma dívida financeira.
- source_word: διπλοῦν
  choice: dupla
  rationale: O adjetivo significa “duplo” ou “em dobro”; a forma “dupla” concorda diretamente com “retribuição” e conserva a estrutura concisa do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A formulação preserva a ambiguidade de δόσις mediante uma alternativa em nota, sem introduzir interpretação confessional.
