  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: pt
  text: Há quem destrua a própria vida[a] por vergonha e, por causa de um semblante insensato[b], a perderá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a própria alma” ou “a si mesmo”; o grego ψυχή pode significar “vida”, “pessoa” ou “alma”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de um rosto/semblante insensato”. A expressão pode se referir a um semblante ou comportamento exterior insensato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολλύων
  choice: destrua
  rationale: O particípio de ἀπόλλυμι pode indicar destruir, arruinar ou perder. “Destrua” preserva a força do verbo e a gravidade da conduta descrita.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a própria vida
  rationale: ψυχή pode significar vida, pessoa ou alma. Neste contexto sapiencial, “vida” é natural e evita impor uma afirmação antropológica mais estreita; “própria” explicita a referência ao sujeito.
- source_word: διʼ αἰσχύνην
  choice: por vergonha
  rationale: διά com acusativo expressa aqui causa ou meio. “Por vergonha” é claro, conciso e mantém a ambiguidade entre vergonha sentida e preocupação com a desonra.
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: por causa de um rosto insensato
  rationale: A formulação conserva de perto a imagem grega de πρόσωπον, “rosto/semblante”, modificada por ἄφρων, “insensato”. Como a expressão é incomum e seu sentido exato não é seguro, uma nota apresenta a provável referência ao semblante ou comportamento exterior.
- source_word: ἀπολεῖ αὐτήν
  choice: venha a perdê-la
  rationale: O futuro ἀπολεῖ retoma o verbo anterior, e αὐτήν se refere a ψυχή. “Venha a perdê-la” expressa o resultado futuro de modo natural em português, sem eliminar a ligação semântica com a autodestruição da primeira oração.
theological_decisions:
- issue: Sentido de ψυχή no contexto sapiencial
  choice: vida
  alternative: alma; a si mesmo
  rationale: O versículo adverte sobre uma conduta autodestrutiva ligada à vergonha e à apresentação social. “Vida” preserva o sentido prático da advertência sem decidir uma questão doutrinária sobre a natureza metafísica da alma.
- issue: Sentido de ἀπὸ ἄφρονος προσώπου
  choice: por causa de um rosto insensato
  alternative: por causa de uma expressão insensata; diante de um insensato
  rationale: A construção grega é difícil. A tradução mantém a leitura gramatical mais direta, sem resolver silenciosamente se o “rosto” designa uma expressão facial, uma aparência ou uma postura exterior.
translation_notes:
  register: Português atual, digno e acessível, com construção impessoal natural (“Há quem”). A formulação difícil “rosto insensato” foi preservada no texto para refletir o grego, enquanto a nota esclarece as possibilidades sem eliminar a ambiguidade.
