base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/007.yaml
  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: pt
  text: O sábio fica calado até o momento certo[a], mas o insensato não observa o momento certo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a ocasião apropriada”. O hebraico diz literalmente: “até um tempo”. O texto grego deste versículo é bem diferente: “Quem fala em excesso será detestado, e quem age com arrogância será odiado”.'
    reason: Registra a formulação literal da primeira expressão e a divergência substancial da tradição grega, sem fundir as duas formas textuais.
lexical_decisions:
- source_word: חָכָם
  choice: o sábio
  rationale: O substantivo masculino singular designa, em estilo proverbial, o homem sábio. Em português, «o sábio» é natural, conciso e preserva a forma gramatical do hebraico.
- source_word: יַחֲרִישׁ
  choice: fica calado
  rationale: O verbo expressa estar ou manter-se em silêncio. «Fica calado» é corrente em português e, neste contexto, comunica a contenção deliberada.
- source_word: עַד עֵת
  choice: até o momento certo
  rationale: A expressão é literalmente «até um tempo», mas, na literatura sapiencial, עֵת pode indicar a ocasião apropriada. «Momento certo» explicita esse sentido idiomático sem ampliar indevidamente o texto.
- source_word: וּכְסִיל
  choice: mas o insensato
  rationale: Embora a conjunção possa ser traduzida simplesmente por «e», aqui ela introduz o contraste proverbial entre o sábio e o insensato.
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: não sabe respeitar o momento
  rationale: Literalmente, «não guarda/observa o tempo». A formulação escolhida comunica em português natural a incapacidade de observar a ocasião apropriada, preservando a concisão e o contraste com a primeira oração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. «Insensato» mantém o registro sapiencial sem soar arcaico; «momento» é retomado na segunda oração para reproduzir o paralelismo hebraico de modo natural.
