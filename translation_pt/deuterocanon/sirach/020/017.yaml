translation:
  language: pt
  text: Os que comem o meu pão são maus de língua; quantas vezes e quantos zombarão dele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego da segunda oração é abrupto e possivelmente comprimido. A tradução conserva de perto a formulação existente, sem explicitar quem é “ele”.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: os que comem
  rationale: O particípio presente substantivado indica, de modo geral, aqueles que comem; a formulação é natural em português.
- source_word: τὸν ἄρτον μου
  choice: do meu pão
  rationale: Preserva a imagem concreta do pão e expressa naturalmente em português a participação no alimento oferecido pelo falante.
- source_word: φαῦλοι γλώσσῃ
  choice: maus de língua
  rationale: φαῦλοι comunica baixeza ou maldade, e o dativo γλώσσῃ situa essa maldade na fala. A expressão portuguesa mantém a imagem da língua sem soar excessivamente literal.
- source_word: ποσάκις
  choice: quantas vezes
  rationale: Equivalente interrogativo direto e idiomático.
- source_word: καὶ ὅσοι
  choice: e quantos
  rationale: Mantém o segundo elemento interrogativo e a formulação abrupta do grego, sem acrescentar um substantivo ausente.
- source_word: καταγελάσονται
  choice: zombarão
  rationale: O verbo καταγελάω normalmente expressa riso dirigido contra alguém, isto é, zombaria ou escárnio; 'zombarão' transmite essa força com naturalidade.
- source_word: αὐτοῦ
  choice: dele
  rationale: O genitivo masculino funciona como complemento pessoal de καταγελάω. 'Dele' preserva a referência masculina sem identificar além do que o texto permite.
theological_decisions:
- issue: Formulação abrupta e possível compressão textual na segunda oração
  choice: 'Manter a pergunta próxima do texto existente: ''quantas vezes e quantos zombarão dele?'''
  alternative: Suavizar como 'quantas vezes e quantas pessoas zombarão dele!'
  rationale: O grego é conciso e sintaticamente difícil. A tradução preserva sua tensão e evita suprir elementos ou definir o referente de αὐτοῦ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'maus de língua' conserva a imagem grega; a segunda oração permanece deliberadamente abrupta por fidelidade à fonte.
