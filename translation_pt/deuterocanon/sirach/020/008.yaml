  text: There is success for a man in evil things[a], and there is a gain that leads to loss.
translation:
  language: pt
  text: Há sucesso para um homem em coisas más[a], e há ganho que leva à perda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há prosperidade para um homem em meio aos males, e há um achado que resulta em diminuição.” A formulação grega é proverbial e condensada, podendo referir-se tanto a coisas moralmente más quanto a males ou adversidades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδία
  choice: sucesso
  rationale: O substantivo indica bom andamento ou resultado próspero. “Sucesso” é natural em português e mantém a ironia do provérbio sem restringir o sentido à prosperidade material.
- source_word: ἐν κακοῖς
  choice: em coisas más
  rationale: A expressão é ambígua e também poderia indicar males ou adversidades. No contexto proverbial, a leitura moral é provável; a formulação concisa conserva parte da amplitude do grego.
- source_word: ἀνδρί
  choice: para um homem
  rationale: Mantém o singular masculino do grego e funciona como formulação proverbial em português.
- source_word: εὕρεμα
  choice: ganho
  rationale: Embora possa significar algo achado ou descoberto, aqui forma um contraste proverbial eficaz com a diminuição subsequente; “ganho” exprime uma vantagem obtida.
- source_word: εἰς ἐλάττωσιν
  choice: que leva à perda
  rationale: A expressão indica direção ou resultado em diminuição. A tradução idiomática preserva o paradoxo de um ganho aparente que acaba em prejuízo.
