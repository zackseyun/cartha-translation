base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: pt
  text: É melhor um escorregão no chão do que um deslize da língua; assim, a queda dos maus[a] virá depressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a queda dos males virá depressa”. O grego κακῶν pode referir-se tanto aos “maus” como aos “males”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  choice: escorregar
  rationale: Expressa de modo natural o deslize físico e mantém a forma proverbial, sem sugerir primariamente uma falha moral.
- source_word: ἀπὸ ἐδάφους
  choice: por causa do chão
  rationale: Neste contraste, ἀπό indica a origem ou causa do tropeço; esta formulação preserva a imagem concreta e soa natural em português.
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: é melhor ... do que por causa da língua
  rationale: A comparação grega é elíptica; acrescentar «é melhor» torna o sentido claro, enquanto «língua» conserva a metáfora concreta da fala.
- source_word: πτῶσις
  choice: queda
  rationale: É o equivalente direto e adequado ao contexto proverbial, podendo abranger queda e ruína.
- source_word: κακῶν
  choice: dos maus
  rationale: O genitivo pode ser pessoal ou abstrato. A leitura pessoal produz uma frase natural e coerente no contexto, sem eliminar a alternativa em nota.
- source_word: κατὰ σπουδήν
  choice: às pressas
  rationale: Preserva a ideia de pressa ou urgência, mais marcada do que o simples «rapidamente».
- source_word: ἥξει
  choice: virá
  rationale: Reproduz diretamente o futuro do verbo «vir» e combina naturalmente com «queda».
theological_decisions:
- issue: Referente de κακῶν
  choice: 'leitura pessoal: «dos maus»'
  alternative: 'leitura abstrata: «dos males»'
  rationale: A leitura pessoal é idiomática no gênero sapiencial e forma uma afirmação coerente sobre a queda dos maus; como o grego também admite o sentido abstrato, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção proverbial e a imagem concreta da língua foram preservadas; a ambiguidade de κακῶν foi registrada em nota.
