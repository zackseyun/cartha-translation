  verdict: revise
  source_fidelity: A tradução capta corretamente o contraste proverbial entre um escorregão físico e um deslize ligado à língua, bem como o futuro da queda dos maus. Contudo, «escorregar por causa do chão» transforma o substantivo ὀλίσθημα numa construção verbal e soa menos idiomático; a repetição de «por causa de» também obscurece a imagem contrastante do grego.
  naturalness: «É melhor um escorregão no chão do que um deslize da língua» é uma formulação moderna, proverbial e clara em português. «A queda dos maus virá depressa» expressa naturalmente a rapidez de κατὰ σπουδήν sem sugerir que a própria queda seja feita de maneira precipitada.
  terminology: «Deslize da língua» conserva a metáfora de γλῶσσα e é expressão idiomática. «Maus» é uma leitura pessoal defensável de κακῶν; a nota mantém a leitura abstrata possível. O marcador deve estar ligado a «maus», o termo ao qual a nota se refere.
