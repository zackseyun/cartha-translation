  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: pt
  text: Como é bom repreender, em vez de se irar! E quem confessa será preservado de perda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quem reconhece isso será poupado de dano». O grego não declara o objeto de «confessa/reconhece», e o termo traduzido por «perda» também pode significar dano ou desvantagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: Como é bom
  rationale: Mantém a exclamação que introduz a avaliação moral, em português natural e digno.
- source_word: ἐλέγξαι
  choice: repreender
  rationale: Expressa correção ou censura verbal; é mais preciso que «corrigir» e, neste contexto sapiencial, menos explosivo que «ralhar».
- source_word: ἢ θυμοῦσθαι
  choice: em vez de se irar
  rationale: O contraste favorece o valor comparativo de ἤ; «irar-se» preserva a ideia de entrar em estado de ira e combina com o registro sapiencial.
- source_word: ὁ ἀνθομολογούμενος
  choice: quem confessa
  rationale: O particípio pode indicar confessar ou reconhecer abertamente. A formulação não acrescenta um objeto que o grego deixa implícito.
- source_word: ἀπὸ ἐλαττώσεως
  choice: de perda
  rationale: ἐλάττωσις pode indicar diminuição, perda, dano ou desvantagem. «Perda» mantém amplitude semelhante sem definir a natureza da consequência.
- source_word: κωλυθήσεται
  choice: será preservado de
  rationale: O futuro passivo de κωλύω, construído com ἀπό, comunica aqui ser impedido de sofrer algo ou ser poupado disso; «preservado de» é idiomático neste enunciado proverbial.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A pontuação ressalta a força exclamativa da primeira oração. Conservou-se sem explicitação o objeto de «confessa» e não se definiu se a perda é material, social ou moral.
