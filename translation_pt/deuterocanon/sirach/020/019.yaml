  text: An ungracious person is an untimely saying[a]; in the mouth of the undisciplined it will be repeated continually.
translation:
  language: pt
  text: Uma pessoa sem encanto é um dito fora de hora[a]; na boca dos indisciplinados, ele será repetido continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma pessoa desagradável é uma história inoportuna”. As duas partes são breves e um tanto elípticas em grego, por isso são possíveis várias traduções de sentido próximo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  choice: uma pessoa sem graça
  rationale: ἄνθρωπος é genérico, por isso “pessoa” evita restringir o provérbio ao sexo masculino. ἄχαρις descreve alguém destituído de graça, encanto ou afabilidade; “sem graça” preserva essa amplitude, sem reduzi-la à ingratidão.
- source_word: μῦθος
  choice: dito
  rationale: Neste provérbio, μῦθος designa uma fala ou expressão, não necessariamente uma narrativa desenvolvida. “Dito” é conciso e combina com a formulação proverbial.
- source_word: ἄκαιρος
  choice: fora de hora
  rationale: A palavra indica algo inoportuno, proferido no momento impróprio. “Fora de hora” comunica esse valor temporal em português corrente.
- source_word: ἀπαιδεύτων
  choice: dos indisciplinados
  rationale: O termo se refere aos que carecem de formação, instrução ou disciplina. “Indisciplinados” conserva aqui a dimensão moral e social, em vez de sugerir apenas falta de escolaridade.
- source_word: ἐνδελεχισθήσεται
  choice: será repetido continuamente
  rationale: O futuro passivo expressa persistência ou repetição continuada. A formulação deixa claro que o dito inoportuno continua sendo proferido.
- source_word: ἐν στόματι
  choice: na boca
  rationale: Mantém a imagem grega convencional para palavras proferidas por alguém e permanece natural no estilo proverbial português.
