translation:
  language: pt
  text: O sábio se fará querido pela sua fala, mas os favores dos insensatos serão derramados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as graças dos insensatos serão derramadas” ou “os encantos dos insensatos serão derramados”. A palavra grega χάριτες pode indicar favores, atos de bondade, graças ou encantos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σοφὸς
  choice: O sábio
  rationale: O adjetivo grego está no masculino singular com artigo e funciona como substantivo. “O sábio” preserva essa forma representativa e é natural no gênero sapiencial.
- source_word: ἐν λόγῳ
  choice: por suas palavras
  rationale: A expressão pode indicar meio ou esfera. O plural idiomático “por suas palavras” comunica com clareza que a fala do sábio é o meio pelo qual ele se torna querido.
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: se fará querido
  rationale: Preserva a construção reflexiva e o sentido relacional de προσφιλής (“querido”, “estimado”, “agradável”), em português natural e conciso.
- source_word: χάριτες
  choice: favores
  rationale: O plural pode designar atos de benevolência, graças ou encantos. “Favores” oferece o sentido contextual mais concreto, sem eliminar as alternativas lexicais, registradas em nota.
- source_word: μωρῶν
  choice: dos insensatos
  rationale: Traduz diretamente o genitivo possessivo. “Insensatos” é corrente, digno e adequado ao vocabulário da literatura sapiencial.
- source_word: ἐκχυθήσονται
  choice: serão derramados
  rationale: Mantém a voz passiva futura e a imagem literal de ἐκχέω. A formulação permite perceber a possível ideia de desperdício ou distribuição indiscriminada sem explicitá-la como interpretação.
