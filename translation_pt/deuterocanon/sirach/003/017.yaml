base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/017.yaml
  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: pt
  text: Meu filho[a], em sua prosperidade, ande com humildade, e você será mais amado do que quem dá presentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Filho, conduza suas obras com mansidão, e você será amado por uma pessoa estimada.” O testemunho hebraico, seguido no texto principal, diz: “Meu filho, em sua prosperidade, ande com humildade, e você será mais amado do que quem dá presentes.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém a forma masculina singular e o sufixo de primeira pessoa do hebraico; o grego paralelo traz a forma mais ampla “filho/criança”.
- source_word: בְּעָשְׁרְךָ
  choice: em sua prosperidade
  rationale: Expressa o estado de riqueza indicado por עֹשֶׁר sem restringir indevidamente o sentido a posses materiais isoladas.
- source_word: הִתְהַלֵּךְ
  choice: ande
  rationale: Preserva a metáfora hebraica de caminhar como modo de viver e soa natural na exortação em português.
- source_word: בַּעֲנָוָה
  choice: com humildade
  rationale: Traduz o valor ético de modéstia ou mansidão; “com humildade” é idiomático no contexto.
- source_word: וְתֵאָהֵב
  choice: e você será mais amado
  rationale: Mantém o sentido passivo e prospectivo da forma verbal; “mais” antecipa naturalmente a comparação introduzida em seguida.
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: do que quem dá presentes
  rationale: Representa o מן comparativo e o particípio de modo direto e corrente, sem transformar a expressão em título ou categoria formal.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: prosperidade, humildade e ser mais amado do que quem dá presentes.'
  alternative: “Filho, conduza suas obras com mansidão, e você será amado por uma pessoa estimada.”
  rationale: O testemunho hebraico está preservado e tem alta confiança, portanto rege o texto principal. A divergência substancial do grego é mantida em nota, sem ser harmonizada ou ocultada.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. O tratamento por “você” evita uma mescla regionalmente marcada entre “tu” e formas verbais de terceira pessoa; “ande com humildade” conserva a metáfora sem soar artificial.
