  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: pt
  text: Quem pratica o bem será chamado feliz por seus caminhos[a], e, no momento em que tropeçar, encontrará apoio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Aquele que retribui favores se lembra do que virá depois”. O primeiro membro do grego difere substancialmente do hebraico preservado, embora ambos concordem, no segundo membro, que se encontra apoio no momento da queda.'
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  choice: Quem pratica o bem
  rationale: O particípio masculino singular descreve genericamente a pessoa que faz o bem. Esta formulação conserva o singular e soa natural em português, sem tornar explícito um substantivo ausente no hebraico.
- source_word: יקראנו
  choice: será chamado feliz
  rationale: A forma significa literalmente “o chamará”; no contexto, exprime aclamação ou reconhecimento favorável. A construção passiva comunica esse sentido sem especificar um sujeito não expresso.
- source_word: בדרכיו
  choice: por seus caminhos
  rationale: Literalmente “em/por seus caminhos”. “Caminhos” preserva a metáfora sapiencial referente à conduta, enquanto “por” expressa a relação causal provável.
- source_word: בעת מוטו
  choice: no momento em que tropeçar
  rationale: מוטו evoca vacilar, escorregar ou cair. A forma verbal em português preserva a imagem e evita sugerir necessariamente uma ruína definitiva.
- source_word: ימצא משען
  choice: encontrará apoio
  rationale: משען é aquilo em que alguém pode se apoiar. “Apoio” é claro, atual e abrange tanto o sentido concreto quanto o figurado.
theological_decisions:
- issue: Masculino singular genérico no dito sapiencial
  choice: Quem pratica o bem
  alternative: O homem que pratica o bem
  rationale: O hebraico emprega uma forma masculina singular, mas não contém o substantivo “homem”. O pronome relativo substantivado conserva o referente singular genérico de modo fiel e natural.
- issue: Divergência entre o hebraico e o grego no primeiro membro
  choice: Seguir o hebraico no texto principal
  alternative: Aquele que retribui favores se lembra do que virá depois
  rationale: Como o hebraico está preservado e é a testemunha primária nesta passagem de Sirácida, ele orienta o texto principal. A leitura grega substancialmente distinta é registrada em nota, enquanto seu segundo membro confirma a ideia de apoio no tempo da queda.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial natural. “Caminhos” mantém a imagem sapiencial; “tropeçar” e “apoio” preservam a metáfora da instabilidade e do amparo.
