  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
translation:
  language: pt
  text: O coração pesado acabará em ruína[b][a], e quem ama as coisas boas será guiado por elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «o coração duro será afligido no fim». O hebraico diz literalmente: «o coração pesado se tornará repugnante em seu fim».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «se tornará repugnante» ou «apodrecerá». O verbo hebraico significa mais literalmente «cheirar mal» ou «tornar-se podre» e, aqui, expressa um desfecho desastroso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: o coração pesado
  rationale: Preserva a expressão literal do testemunho hebraico e sua abertura semântica. Ela pode indicar uma disposição interior moral ou espiritualmente desordenada, não apenas tristeza; a leitura grega «coração duro» fica registrada em nota.
- source_word: תִּבְאַשׁ
  choice: acabará em ruína
  rationale: O sentido básico do verbo é «cheirar mal, tornar-se repugnante ou apodrecer», mas, associado ao fim ou desfecho, comunica idiomaticamente um resultado desastroso. A alternativa mais literal é preservada em nota.
- source_word: אַחֲרִיתוֹ
  choice: acabará
  rationale: A construção portuguesa «acabará em ruína» exprime de modo natural o fim ou desfecho indicado pelo hebraico, sem impor se o sufixo se refere ao coração ou à pessoa.
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: e quem ama as coisas boas
  rationale: Mantém a amplitude de טוֹבוֹת, que pode abranger coisas boas, benefícios, prazeres ou dádivas, sem restringir indevidamente o sentido.
- source_word: יִנְהַג בָּהֶם
  choice: será guiado por elas
  rationale: נהג significa conduzir ou guiar. A forma passiva comunica que as coisas boas amadas passam a orientar o caminho da pessoa e preserva a ambiguidade potencialmente admoestadora do dito.
theological_decisions:
- issue: «Coração pesado» no hebraico em contraste com «coração duro» no paralelo grego
  choice: Manter «o coração pesado» no texto principal.
  alternative: «O coração duro»
  rationale: O hebraico disponível é o testemunho principal. O grego pode refletir uma Vorlage variante ou uma interpretação; a nota preserva essa diferença sem dissolver a tensão sobre a disposição interior descrita.
- issue: Sujeito proverbial genérico
  choice: Usar «quem» sem pronome marcado por gênero.
  alternative: «Aquele que»
  rationale: O provérbio tem aplicação genérica, não exclusivamente masculina; «quem» é natural, inclusivo e fiel ao alcance do hebraico.
- issue: Valor de «coisas boas» e efeito sobre quem as ama
  choice: 'Preservar a formulação ampla e potencialmente ambígua: «será guiado por elas».'
  alternative: Interpretar טוֹבוֹת especificamente como «bênçãos», «prazeres» ou virtudes.
  rationale: O hebraico não determina de modo inequívoco se essas «coisas boas» são benefícios, prazeres, dádivas ou bens em sentido moral. A tradução não deve resolver silenciosamente essa ambiguidade.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com naturalidade brasileira. A ordem dos marcadores [b][a] acompanha o ponto exato das duas notas: primeiro a alternativa lexical para o verbo e depois a leitura paralela grega. A expressão incomum «coração pesado» é mantida deliberadamente por fidelidade ao hebraico.'
