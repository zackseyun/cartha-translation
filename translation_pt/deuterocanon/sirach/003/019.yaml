  yaml_path: translation/deuterocanon/sirach/003/019.yaml
  text: Many are lofty and renowned[a], but mysteries are revealed to the gentle.
translation:
  language: pt
  text: Muitos são de alta posição e ilustres, mas aos mansos[a] são revelados mistérios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «gentis» ou «humildes». O grego pode descrever pessoas brandas, mansas ou humildes em sua maneira de ser.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: Mantém o plural indefinido substantivado e a concisão proverbial do grego.
- source_word: ὑψηλοὶ
  choice: de alta posição
  rationale: Expressa a ideia de elevação ou status sem sugerir necessariamente superioridade moral, como poderia ocorrer com «elevados» em português.
- source_word: ἐπίδοξοι
  choice: ilustres
  rationale: Transmite reputação pública, distinção e honra em registro natural e digno.
- source_word: πραέσιν
  choice: aos mansos
  rationale: O dativo plural designa pessoas de disposição branda e não agressivamente autoafirmativa. «Mansos» preserva a ressonância bíblica e o contraste com os que têm posição e prestígio.
- source_word: ἀποκαλύπτεται
  choice: são revelados
  rationale: Preserva a voz passiva e não identifica quem revela. A concordância no plural é a forma natural em português para «mistérios».
- source_word: μυστήρια
  choice: mistérios
  rationale: É a correspondência direta para coisas ocultas ou secretas e conserva o peso do termo sem explicá-lo em excesso.
theological_decisions:
- issue: Como traduzir πραέσιν
  choice: aos mansos
  alternative: aos gentis; aos humildes
  rationale: «Mansos» abrange a brandura e a ausência de autoafirmação agressiva. «Gentis» pode ser entendido apenas como corteses, enquanto «humildes» enfatiza mais diretamente a baixa condição ou a modéstia; por isso, as alternativas são registradas sem restringir o sentido do grego.
- issue: Identidade de quem revela os mistérios
  choice: manter a voz passiva sem indicar o agente
  alternative: explicitar Deus como agente
  rationale: O texto grego não nomeia o revelador. Explicitar Deus resolveria uma ambiguidade que deve permanecer no texto.
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com cadência proverbial. «De alta posição» evita a ambiguidade moral de «elevados»; «ilustres» mantém o registro digno. A colocação «aos mansos são revelados» preserva o contraste e a passiva do original.
