base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: pt
  text: Quem honra seu pai terá alegria em seu filho[a], e sua oração será ouvida e respondida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz «por meio dos filhos», no plural, em vez do hebraico «em seu filho», no singular.
    reason: alternative_reading
  - marker: b
    text: No final, o paralelo grego traz apenas «será ouvida»; o testemunho hebraico acrescenta «e respondida».
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honra
  rationale: O particípio piel de כבד expressa a ação de dar o devido peso, consideração e honra. «Honra» é natural em português e preserva a força ética do hebraico.
- source_word: אָבִיו
  choice: seu pai
  rationale: O hebraico menciona especificamente o pai; a tradução mantém essa referência sem generalizá-la para «pais» ou «progenitor».
- source_word: יִשְׂמַח
  choice: terá alegria
  rationale: O verbo שמח denota alegrar-se. A formulação «terá alegria» combina naturalmente com «em seu filho» e mantém o caráter de consequência ou promessa próprio da literatura sapiencial.
- source_word: בִּבְנוֹ
  choice: em seu filho
  rationale: Mantém o singular do hebraico e a relação ampla expressa pela preposição ב, sem restringi-la necessariamente a causa, companhia ou meio. A locução «terá alegria em seu filho» é clara e digna em português.
- source_word: וּתְפִלָתוֹ
  choice: e sua oração
  rationale: תפלה é o termo comum para oração; «oração» é a correspondência portuguesa direta e natural.
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: será ouvida e respondida
  rationale: Embora as formas hebraicas sejam ativas, a oração é entendida como objeto implícito dos verbos. A construção passiva é natural em português, conserva os dois verbos do testemunho hebraico e não explicita quem ouve e responde.
theological_decisions:
- issue: Promessa ligada a honrar o pai
  choice: Apresentar a frase como consequência ou promessa sapiencial, sem identificar explicitamente o agente divino.
  alternative: Acrescentar «por Deus» como agente de «será ouvida e respondida».
  rationale: A ação divina está fortemente implícita, mas o hebraico não nomeia Deus. A tradução preserva o grau de explicitude e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Quem» traduz naturalmente a construção participial genérica; «terá alegria em seu filho» preserva o singular e evita tornar mais específica a relação indicada pela preposição hebraica. Os marcadores de nota aparecem imediatamente após as expressões às quais se referem.
