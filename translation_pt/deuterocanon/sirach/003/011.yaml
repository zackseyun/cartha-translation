translation:
  language: pt
  text: A honra de um homem é a honra de seu pai, e quem amaldiçoa sua mãe[a] multiplica o pecado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem desonra sua mãe multiplica o pecado”. O verbo hebraico pode referir-se a amaldiçoar ou a tratar com desprezo; “amaldiçoa” é o sentido mais direto, enquanto “desonra” ressalta o contraste contextual entre honra e desonra.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo diz: “Pois a glória de um homem vem da honra de seu pai, e uma mãe em desonra é motivo de vergonha para os filhos”, refletindo uma segunda linha um pouco diferente da do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד אִישׁ
  choice: a honra de um homem
  rationale: כְּבוֹד designa aqui honra ou reputação social, e אִישׁ é singular masculino com força proverbial. A formulação preserva tanto o gênero quanto o caráter sapiencial do hebraico.
- source_word: כִּבּוּד אָבִיו
  choice: é a honra de seu pai
  rationale: O hebraico transmitido é conciso e favorece uma relação equacional entre a honra do homem e a do pai. A tradução mantém essa construção sem introduzir explicitamente a ideia de origem sugerida pelo grego.
- source_word: וּמַרְבֶּה חֵטְא
  choice: multiplica o pecado
  rationale: O particípio causativo expressa aumento produzido pela ação; “multiplica” conserva sua força ativa, e “pecado” traduz diretamente חֵטְא.
- source_word: מְקַלֵּל אִמּוֹ
  choice: quem desonra sua mãe
  rationale: O Piel de קלל pode significar amaldiçoar ou tratar com desprezo. “Desonra” corresponde ao paralelismo de honra e desonra e é apoiado pelo testemunho grego, sem apagar a acepção mais específica, registrada em nota.
theological_decisions:
- issue: Sujeito proverbial masculino
  choice: a honra de um homem
  alternative: a honra de uma pessoa
  rationale: O hebraico emprega אִישׁ no singular masculino. A tradução conserva essa forma representativa em vez de neutralizá-la.
- issue: Sentido de מְקַלֵּל no contexto dos deveres filiais
  choice: quem desonra sua mãe
  alternative: quem amaldiçoa sua mãe
  rationale: O paralelismo imediato trata de honra, e o grego apresenta a mãe em desonra. A opção mais ampla preserva o contraste contextual; a acepção mais estreita permanece em nota.
- issue: Relação entre a honra do homem e a do pai
  choice: é a honra de seu pai
  alternative: vem da honra de seu pai
  rationale: A redação hebraica favorece uma identificação concisa, ao passo que o grego explicita derivação. A tradução segue prioritariamente o texto hebraico e registra a diferença do grego.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe proverbial concisa. “Pois” preserva a ligação explicativa indicada pelo grego paralelo, embora não esteja expresso no hebraico consonantal apresentado. Os marcadores são colocados ao final do versículo para não interromper o paralelismo.
