  source_fidelity: A tradução principal segue de modo justificável o sentido do grego paralelo («o que lhe foi ordenado») e preserva em nota a possível leitura do hebraico הוּרְשֵׁיתָ como «permitido» ou «autorizado». «Reflita» corresponde bem a הִתְבּוֹנֵן, e «não lhe cabe ocupar-se das coisas ocultas» comunica com precisão a restrição expressa pelo hebraico e pelo grego, sem especificar indevidamente o conteúdo do que está oculto.
