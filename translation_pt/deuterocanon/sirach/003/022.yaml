translation:
  language: pt
  text: Reflita sobre o que lhe foi ordenado[a], pois não lhe cabe ocupar-se das coisas ocultas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o que lhe foi permitido” ou “o que lhe foi autorizado”; o paralelo grego diz “o que lhe foi ordenado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה
  choice: sobre o que
  rationale: Introduz o objeto da reflexão; esta formulação é natural em português e preserva a relação expressa pela preposição hebraica.
- source_word: הוּרְשֵׁיתָ
  choice: lhe foi ordenado
  rationale: Embora o hebraico possa indicar aquilo que foi permitido ou autorizado, o paralelo grego traz προσετάγη, «foi ordenado». A tradução principal segue esse testemunho, registrando a nuance hebraica em nota.
- source_word: הִתְבּוֹנֵן
  choice: Reflita
  rationale: Expressa atenção ponderada e deliberada, adequada ao contexto sapiencial, sem reduzir o verbo à mera compreensão intelectual.
- source_word: וְאֵין לְךָ עֵסֶק
  choice: pois não lhe cabe ocupar-se
  rationale: Reproduz de modo natural a ideia hebraica de que esses assuntos não pertencem ao âmbito próprio do destinatário, mantendo a força de advertência sem recorrer ao coloquialismo «não é da sua conta».
- source_word: בְּנִסְתָּרוֹת
  choice: das coisas ocultas
  rationale: Designa realidades escondidas da investigação humana. «Ocultas» é claro e evita associações teológicas posteriores que «mistérios» poderia introduzir.
theological_decisions:
- issue: Relação entre o hebraico הוּרְשֵׁיתָ e o grego προσετάγη
  choice: 'Traduzir no texto principal como obrigação: «o que lhe foi ordenado».'
  alternative: «o que lhe foi permitido» ou «o que lhe foi autorizado».
  rationale: O hebraico favorece a noção de permissão ou autorização, enquanto o paralelo grego explicita uma ordem. Como há uma divergência textual menor e o grego constitui evidência antiga relevante, o texto principal segue «ordenado», mas a nota preserva honestamente a leitura possível do hebraico.
- issue: Alcance de «coisas ocultas»
  choice: Manter uma expressão geral, sem especificar o conteúdo das coisas ocultas.
  alternative: Interpretar como «mistérios divinos» ou «segredos de Deus».
  rationale: O verso não identifica explicitamente a natureza do que está oculto. A formulação geral conserva a tensão sapiencial e evita acrescentar uma interpretação doutrinária não exigida pelas fontes.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. «Não lhe cabe ocupar-se» preserva a advertência do hebraico sem soar excessivamente coloquial ou burocrático.
