  terminology: «Coisas ocultas» é uma escolha sóbria e fiel para בְּנִסְתָּרוֹת / τῶν κρυπτῶν. Evita tanto o coloquialismo quanto a carga teológica adicional que «mistérios» poderia introduzir. A nota registra adequadamente a divergência relevante entre os testemunhos.
