  text: A father's blessing establishes roots[a], but a mother's curse uproots a plant.
translation:
  language: pt
  text: A bênção do pai firma raízes[a], mas a maldição da mãe arranca uma planta pela raiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois a bênção do pai fortalece as casas dos filhos, mas a maldição da mãe arranca os alicerces.” O testemunho hebraico emprega, em vez disso, as imagens agrícolas de “raízes” e “planta”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: A bênção do pai
  rationale: Reproduz naturalmente a construção hebraica e mantém o singular de “pai”, em paralelo com “mãe”.
- source_word: תְּיַסֵּד
  choice: firma
  rationale: O verbo יסד expressa fundar, estabelecer ou tornar firme. “Firma” é conciso e funciona naturalmente com a imagem de raízes.
- source_word: שֹׁרֶשׁ
  choice: raízes
  rationale: Mantém a imagem agrícola do hebraico. O plural comunica bem em português o possível valor coletivo do singular hebraico e produz uma formulação proverbial natural.
- source_word: וְקִלְלַת אֵם
  choice: mas a maldição da mãe
  rationale: “Mas” explicita o paralelismo antitético já presente nos dois membros do provérbio, sem alterar seu sentido.
- source_word: תִּנְתּשׁ
  choice: arranca ... pela raiz
  rationale: Neste contexto agrícola, o verbo indica retirar do solo. A expressão idiomática portuguesa preserva a força de “desarraigar” sem soar técnica.
- source_word: נֶטַע
  choice: uma planta
  rationale: Designa aquilo que foi plantado. “Uma planta” é claro, concreto e preserva a metáfora agrícola.
theological_decisions:
- issue: Imagem textual principal diante da diferença entre o hebraico e o grego
  choice: 'Manter a imagem agrícola hebraica: “firma raízes ... arranca uma planta pela raiz”.'
  alternative: 'Seguir mais de perto o paralelo grego: “a bênção do pai fortalece as casas dos filhos, mas a maldição da mãe arranca os alicerces”.'
  rationale: O testemunho hebraico disponível é claro, coerente e de alta confiança, devendo governar o texto principal. A forma grega representa uma variante ou reformulação metafórica relevante, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Firma raízes” conserva a metáfora hebraica, enquanto “arranca uma planta pela raiz” é idiomático e vívido para leitores de diferentes regiões, com boa legibilidade brasileira.
