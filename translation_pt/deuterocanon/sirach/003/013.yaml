base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/013.yaml
  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: pt
  text: Mesmo que um homem não tenha entendimento, tenha paciência com ele[a] e não o envergonhe todos os dias de sua vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja tolerante com ele” ou “seja indulgente com ele”. O paralelo grego esclarece a expressão hebraica como um chamado à tolerância paciente.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz: “e não o desonre em todo o seu poder”. O hebraico diz: “todos os dias de sua vida”. O texto principal segue aqui o testemunho hebraico primário; o grego pode refletir um texto-base diferente ou uma tradução interpretativa.'
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם
  choice: Mesmo que
  rationale: No contexto, a expressão introduz uma concessão, leitura também apoiada pelo grego κἂν, “mesmo que”.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o singular masculino do hebraico e sua função representativa na instrução sapiencial.
- source_word: יֶחְסַר מַדָּעוֹ
  choice: perca o entendimento
  rationale: Expressa de modo natural a diminuição ou falta de entendimento indicada pelo hebraico; o paralelo grego σύνεσιν confirma o campo semântico de compreensão ou bom senso.
- source_word: עֲזָב לוֹ
  choice: seja paciente com ele
  rationale: Embora o hebraico possa sugerir literalmente deixá-lo ou dar-lhe espaço, o grego συγγνώμην ἔχε esclarece a ideia de tolerância paciente.
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: não o envergonhe
  rationale: Verte diretamente a ideia hebraica de causar vergonha ou humilhação, em linguagem atual e digna.
- source_word: כָּל יְמֵי חַיָיו
  choice: durante todos os dias da vida dele
  rationale: Mantém a formulação temporal explícita do testemunho hebraico sem perder naturalidade em português.
