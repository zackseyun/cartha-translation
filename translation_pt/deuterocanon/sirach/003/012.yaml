base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/012.yaml
  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: pt
  text: Meu filho[a], mantenha-se firme em honrar seu pai e não o abandone todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Filho, ampare seu pai na velhice e não o entristeça enquanto ele viver.”'
    reason: Leitura alternativa significativa do antigo paralelo grego.
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo masculino singular e o tom paterno de instrução próprio da literatura sapiencial hebraica.
- source_word: הִתְחַזֵּק
  choice: mantenha-se firme
  rationale: Expressa de modo natural o imperativo hitpael de חזק, que indica fortalecer-se ou mostrar firmeza, sem substituí-lo pela formulação distinta do paralelo grego.
- source_word: בִּכִבּוּד
  choice: em honrar
  rationale: Representa a construção com בְּ mais o substantivo כיבוד e apresenta a honra como prática contínua.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Tradução direta do substantivo com sufixo possessivo de segunda pessoa masculina singular.
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: e não o abandone
  rationale: עזב pode significar deixar, desamparar ou abandonar; aqui, “abandone” comunica com clareza a força moral do dever filial.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: durante todos os dias da sua vida
  rationale: Preserva de forma compreensível a expressão hebraica de duração por toda a vida.
theological_decisions:
- issue: Divergência entre o texto hebraico e o paralelo grego na exortação central
  choice: 'Seguir no texto principal o hebraico: manter-se firme em honrar o pai e não abandoná-lo.'
  alternative: 'Seguir o grego: amparar o pai na velhice e não entristecê-lo enquanto ele viver.'
  rationale: O hebraico preservado é a testemunha primária e está claro neste versículo. O grego apresenta uma formulação antiga significativamente diferente, que deve ser preservada em nota sem substituir a leitura hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Mantenha-se firme” soa mais natural que o literal “fortaleça-se”; “abandone” conserva a força ética de עזב sem o tom arcaico de “desampare” ou “deixe ao abandono”.
