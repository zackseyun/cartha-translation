translation:
  language: pt
  text: Um coração pesado tem suas dores multiplicadas[a], e quem age temerariamente[b] acrescenta pecado a pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “um coração duro será afligido no fim” e “um coração duro ficará sobrecarregado no fim”.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico é difícil e também pode sugerir agir de modo descontrolado, iludir-se ou exibir arrogância.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: o coração pesado
  rationale: Preserva a imagem literal e ambígua do hebraico, que pode sugerir peso interior, insensibilidade ou obstinação. A leitura grega divergente, «coração duro», é registrada em nota.
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: multiplica suas dores
  rationale: Expressa de modo natural o aumento das dores ou dos sofrimentos associados ao coração, mantendo o sufixo possessivo do hebraico.
- source_word: וּמִתְהוֹלֵל
  choice: e quem age temerariamente
  rationale: O termo hebraico é difícil e pode envolver conduta desenfreada, autoengano ou arrogância. «Age temerariamente» comunica a imprudência moral sem restringir excessivamente o sentido.
- source_word: מוֹסִיף עָוֹן עַל עָוֹן
  choice: acrescenta pecado a pecado
  rationale: Mantém tanto o sentido participial de continuar acrescentando como a imagem hebraica de acumulação; «pecado» é claro e adequado ao contexto moral.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego no primeiro membro do versículo
  choice: 'Seguir no texto principal o hebraico: «O coração pesado multiplica suas dores».'
  alternative: 'O grego traz: «um coração duro será afligido no fim» e «um coração duro ficará sobrecarregado no fim».'
  rationale: O testemunho hebraico conservado tem alta confiança e, por isso, orienta o texto principal. Como o paralelo grego apresenta uma leitura substancialmente diferente e possivelmente ampliada, ela é preservada em nota sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A formulação conserva a imagem incomum de «coração pesado» e sinaliza em notas tanto a divergência textual grega como a incerteza lexical do segundo membro.
