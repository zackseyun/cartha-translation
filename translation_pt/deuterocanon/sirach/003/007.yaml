translation:
  language: pt
  text: e servirá aos que o geraram como a senhores[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a amos” ou “como a donos”. O termo grego designa pessoas que exercem plena autoridade; aqui forma uma comparação forte quanto à honra devida aos pais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  choice: senhores
  rationale: O termo designa pessoas dotadas de plena autoridade e pode também indicar donos. “Senhores” preserva aqui a forte comparação aplicada à honra devida aos pais, sem introduzir diretamente a ideia de propriedade.
- source_word: δουλεύσει
  choice: servirá
  rationale: O futuro de δουλεύω expressa serviço em posição subordinada. “Servirá” é natural em português, enquanto a comparação com “senhores” conserva a intensidade da expressão grega.
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: àqueles que o geraram
  rationale: A formulação mantém o particípio explícito do grego e fundamenta a obrigação no vínculo de geração, em vez de substituí-lo simplesmente por “seus pais”.
theological_decisions:
- issue: Intensidade da imagem da obrigação filial
  choice: Manter a comparação de servir aos genitores como a senhores.
  alternative: servirá fielmente a seus pais
  rationale: O grego combina δεσπόταις e δουλεύσει, formando deliberadamente uma imagem forte de subordinação. Suavizá-la para simples respeito ou assistência reduziria a força ética do texto.
translation_notes:
  register: Português moderno, claro e digno. A construção “àqueles que o geraram” conserva a expressão concreta do grego; “como a seus senhores” mantém a comparação forte sem sugerir literalmente que os pais sejam proprietários do filho.
