base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: pt
  text: Não busque o que é maravilhoso demais para você[a], nem investigue o que lhe está oculto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto o paralelo grego: “Não busque o que é difícil demais para você, nem examine o que é forte demais para você.” O hebraico enfatiza o que é maravilhoso demais e o que está oculto; o grego, o que excede a sua capacidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת
  choice: o que é maravilhoso demais
  rationale: O plural hebraico derivado de פלא indica coisas extraordinárias ou maravilhosas; no contexto, refere-se a matérias que ultrapassam o alcance da pessoa, sem reduzir o termo a “milagres” ou substituí-lo apenas por “coisas difíceis”.
- source_word: מִמְּךָ
  choice: para você
  rationale: Embora literalmente possa ser “de você”, aqui assinala aquilo que excede a esfera ou capacidade da pessoa. A construção “maravilhoso demais para você” comunica esse valor idiomático e é apoiada pelo paralelo grego.
- source_word: אַל תִּדְרוֹשׁ
  choice: não busque
  rationale: דרש pode significar buscar ou procurar saber. “Não busque” mantém de forma concisa a força da proibição e não especifica em excesso o modo da procura.
- source_word: וּמְכֻסֶּה
  choice: o que está oculto
  rationale: O particípio de כסה denota aquilo que está coberto ou escondido. “O que está oculto” preserva o paralelismo e soa natural em português digno e atual.
- source_word: מִמְּךָ
  choice: de você
  rationale: 'No segundo membro, a formulação “oculto de você” conserva a relação expressa no hebraico: trata-se do que não foi revelado ou permanece fora do conhecimento da pessoa.'
- source_word: אַל תַּחְקוֹר
  choice: nem investigue
  rationale: חקר expressa exame ou investigação minuciosa. “Investigue” é mais forte que “busque” e reproduz a progressão verbal do paralelismo.
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: apoio semântico para “maravilhoso demais para você”
  rationale: O paralelo grego fala do que é mais difícil ou mais forte que a pessoa, confirmando a ideia de matérias que excedem sua capacidade, embora não substitua a imagem própria do hebraico.
theological_decisions:
- issue: Se o versículo proíbe toda investigação dos mistérios divinos ou adverte contra a busca do que ultrapassa o alcance humano
  choice: Advertência sapiencial contra buscar o que excede o alcance da pessoa ou permanece oculto para ela
  alternative: Proibição absoluta de toda investigação teológica; ou advertência restrita apenas à especulação orgulhosa
  rationale: O hebraico mantém em paralelo o que é maravilhoso demais e o que está oculto; o grego também enfatiza aquilo que excede a capacidade. A tradução preserva a tensão e não transforma a advertência em proibição universal de toda investigação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Maravilhoso demais” conserva a imagem hebraica; “investigue” diferencia o segundo verbo e mantém o paralelismo. O marcador [a] aparece no texto principal.
