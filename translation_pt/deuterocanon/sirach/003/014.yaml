  text: A father's righteousness will not be wiped away[a], and in place of sins it will be planted.
translation:
  language: pt
  text: A justiça do pai não será apagada[a] e, em lugar dos pecados, ela será plantada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Pois a esmola de um pai não será esquecida e, em lugar dos pecados, será edificada para você.” O grego reflete uma redação um pouco diferente, sobretudo em “esmola” e “será edificada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: a justiça do pai
  rationale: 'Preserva o sentido amplo de צדקה e a ambiguidade do genitivo hebraico: pode apontar para a justiça relacionada ao pai, no contexto do dever filial, ou para a justiça do próprio pai. Evita restringir o termo a “esmola”.'
- source_word: לֹא תִּמָּחֶה
  choice: não será apagada
  rationale: Expressa de modo natural a imagem de algo que não é eliminado, cancelado ou removido do registro.
- source_word: וּתְמוּר חַטָּאת
  choice: e, em lugar dos pecados
  rationale: Mantém a ideia de troca ou substituição presente em תמור sem definir como se dá essa relação. O plural “pecados” concorda com o sentido moral indicado pelo paralelo grego.
- source_word: הִיא תְּנַתֵּעַ
  choice: ela será plantada
  rationale: Segue a imagem concreta do verbo hebraico נטע, “plantar”. O pronome explicita em português que o sujeito continua sendo “a justiça”, sem acrescentar o beneficiário presente apenas no grego.
theological_decisions:
- issue: Se a justiça relacionada ao pai compensa ou expia pecados
  choice: Preservar a formulação substitutiva “em lugar dos pecados” sem explicar seu mecanismo teológico.
  alternative: Traduzir como expiação dos pecados, simples lembrança favorável ou restauração posterior ao pecado.
  rationale: O texto emprega linguagem forte de retribuição moral, mas não define uma doutrina completa de mérito ou expiação. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. “Justiça do pai” mantém deliberadamente a ambiguidade do hebraico; “será plantada” conserva sua metáfora incomum em vez de harmonizá-la com o grego.
