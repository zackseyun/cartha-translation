  text: Listen[a], children, to a father's instruction, and do so that you may live.
translation:
  language: pt
  text: Ouçam[a], filhos, a instrução de um pai e ajam de acordo com ela, para que vivam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Ouçam-me, filhos, eu, seu pai... para que sejam salvos”. O testemunho hebraico diz de modo mais geral: “a instrução de um pai... para que vivam”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural de שמע pede escuta atenta. “Ouçam” é natural e não reduz antecipadamente o sentido a “obedeçam”, embora a ação subsequente implique obediência.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo é masculino plural e, no gênero sapiencial, designa os destinatários como filhos de um pai que instrui. “Filhos” conserva a imagem familiar e é corrente em português.
- source_word: מִשְׁפַט
  choice: instrução
  rationale: Embora possa significar “juízo”, “norma” ou “direito”, aqui se refere à orientação dotada de autoridade dada por um pai, não a uma sentença judicial.
- source_word: אָב
  choice: de um pai
  rationale: O hebraico não traz pronome possessivo. A formulação indefinida preserva a generalidade do testemunho hebraico sem importar o “meu” explícito do grego.
- source_word: וַעֲשׂוּ
  choice: e ajam de acordo com ela
  rationale: O verbo עשה significa literalmente “fazer”. Em português, o complemento contextual explicita de modo natural que se deve pôr em prática a instrução ouvida, sem acrescentar conteúdo novo.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente uma oração de finalidade em português atual.
- source_word: תִּחְיוּ
  choice: vivam
  rationale: A forma de חיה significa “viver”. O grego apresenta “sejam salvos”, mas o texto principal segue o testemunho hebraico.
theological_decisions:
- issue: Divergência entre o hebraico e o grego quanto à referência ao pai
  choice: Seguir no texto principal a expressão hebraica genérica “de um pai”
  alternative: “a mim, seu pai” / “a mim, o pai”, conforme o grego
  rationale: Como o hebraico está preservado com alta confiança, ele é a testemunha principal. A primeira pessoa explícita do grego é registrada em nota, sem ser introduzida no texto.
- issue: Resultado expresso por “viver” no hebraico e “ser salvo” no grego
  choice: “para que vivam”
  alternative: “para que sejam salvos”
  rationale: תחיו significa claramente “vivam”. A variante grega é teologicamente significativa e por isso é preservada em nota, sem resolver artificialmente a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A segunda pessoa plural foi vertida pela forma corrente com “vocês” implícito (“ouçam”, “ajam”, “vivam”), evitando o registro regional ou arcaizante de “vós”. A expressão “filhos” mantém a moldura familiar própria da instrução sapiencial.
