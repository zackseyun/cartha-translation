  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: pt
  text: Meu filho, honre seu pai em palavras e ações, para que todas as bênçãos alcancem você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “para que a bênção venha sobre você da parte dele”, indicando mais explicitamente o pai como fonte da bênção.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo masculino singular explícito do hebraico, em linguagem natural e direta.
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: por palavras e ações
  rationale: Expressa os dois âmbitos complementares — fala e conduta — de modo corrente em português, mantendo a ordem do hebraico.
- source_word: כַּבֵּד אָבִיךָ
  choice: honre seu pai
  rationale: No contexto dos deveres filiais, כבד significa tratar com a devida honra e consideração. A forma escolhida é clara e tradicional sem ser arcaica.
- source_word: עֲבוּר
  choice: para que
  rationale: Introduz naturalmente a finalidade ou consequência esperada, sem decidir de forma rígida entre essas duas nuances.
- source_word: יַשִׂיגוּךָ
  choice: alcancem você
  rationale: Conserva a imagem hebraica de bênçãos que chegam até a pessoa; é mais próxima do verbo-fonte do que uma simples formulação como “venham sobre você”.
- source_word: כֹּל בְּרָכוֹת
  choice: todas as bênçãos
  rationale: Reflete diretamente o plural hebraico com כֹּל e evita harmonizá-lo silenciosamente com o singular coletivo do paralelo grego.
theological_decisions:
- issue: Fonte das bênçãos prometidas
  choice: Não especificar a fonte no texto principal
  alternative: Indicar que a bênção vem do pai
  rationale: O hebraico afirma apenas que todas as bênçãos alcançarão o filho, sem nomear sua fonte. O grego acrescenta “da parte dele”, provavelmente apontando para o pai; essa variante é registrada em nota, sem substituir a formulação mais aberta do testemunho hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “seu” e “você” de modo coerente; evita tanto arcaísmos como uma paráfrase excessiva.
