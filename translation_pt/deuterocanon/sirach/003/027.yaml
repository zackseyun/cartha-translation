  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: pt
  text: Sem a pupila[a], falta luz; e, sem conhecimento, falta sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego existente traz aqui um dito diferente: “Um coração endurecido será sobrecarregado de sofrimentos, e o pecador acrescentará pecados sobre pecados.”'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: sem
  rationale: A construção expressa ausência; “sem” é conciso e conserva o paralelismo proverbial.
- source_word: אִישׁוֹן
  choice: pupila
  rationale: No contexto de “luz”, designa a pupila do olho; esta é a forma anatômica clara e corrente em português.
- source_word: יֶחְסַר / תֶּחְסַר
  choice: falta
  rationale: O verbo indica falta ou deficiência. A repetição de “falta” preserva o equilíbrio e a correspondência entre as duas partes.
- source_word: אוֹר
  choice: luz
  rationale: É o sentido básico do termo e corresponde à imagem concreta da visão.
- source_word: דַעַת
  choice: conhecimento
  rationale: Mantém o sentido lexical usual e permanece distinto de “sabedoria” no segundo membro.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o sentido normal do termo na literatura sapiencial e a escolha mais natural em português.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego de Sirácida 3:27
  choice: Traduzir no texto principal o dito preservado em hebraico e registrar em nota o dito substancialmente diferente do testemunho grego existente.
  alternative: 'Seguir o grego: “Um coração endurecido será oprimido por sofrimentos, e o pecador acrescentará pecado a pecado.”'
  rationale: Como o hebraico está preservado com alta confiança, ele tem primazia como fonte nesta passagem. A divergência grega é extensa e relevante, por isso é apresentada sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A repetição de “falta” reproduz o paralelismo hebraico; “pupila” evita a expressão etimológica obscura “homenzinho do olho”.
