base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/028.yaml
  text: Do not hurry to heal the wound of a scoffer[a], for there is no healing for it, for they were planted from an evil planting.
translation:
  language: pt
  text: Não se apresse em curar a ferida do zombador, pois ela não tem cura, porque foram plantados[a] de um plantio mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico da oração final é difícil e traz uma forma plural. O paralelo grego diz: “pois uma planta de maldade criou raízes nele”.'
    reason: Leitura alternativa e dificuldade textual.
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: Não se apresse
  rationale: O verbo רוץ significa literalmente “correr”, mas aqui expressa agir com precipitação. “Não se apresse” comunica naturalmente a proibição em português.
- source_word: לְרַפְּאוֹת
  choice: em curar
  rationale: רפא significa “curar” ou “sarar”. “Curar” mantém a imagem médica e a ligação com רְפוּאָה na oração seguinte.
- source_word: מַכַּת
  choice: a ferida
  rationale: מכה pode indicar golpe, lesão ou ferida. Com o verbo “curar”, “ferida” torna a metáfora coerente e natural.
- source_word: לֵץ
  choice: o zombador
  rationale: Na literatura sapiencial, לץ designa quem zomba com desprezo e resiste à correção. “Zombador” é claro e atual, sem acrescentar uma caracterização ausente no hebraico.
- source_word: אֵין לָהּ רְפוּאָה
  choice: ela não tem cura
  rationale: A expressão declara que a ferida é incurável. Esta formulação é idiomática em português e preserva o vínculo lexical entre “curar” e “cura”.
- source_word: מִנֶּטַע רַע
  choice: a partir de um plantio mau
  rationale: נֶטַע pode referir-se ao plantio ou àquilo que foi plantado. A tradução conserva a imagem botânica e o sentido moral de רַע.
- source_word: נִטְעוֹ
  choice: foram plantados
  rationale: A forma hebraica transmitida parece plural, apesar dos referentes anteriores no singular. O plural é mantido para não corrigir silenciosamente a dificuldade textual.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na oração final
  choice: 'Manter no texto principal o plural difícil do hebraico: “foram plantados a partir de um plantio mau”.'
  alternative: “pois uma planta de maldade criou raízes nele”
  rationale: O hebraico existente recebe prioridade, embora sua oração final seja gramatical e textualmente difícil. A leitura grega, mais fluente e singular, é preservada em nota como testemunho antigo relevante, sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com construção natural nas duas primeiras orações. A estranheza limitada da oração final é deliberada, pois reflete a forma plural e a dificuldade do hebraico transmitido; a nota oferece a leitura mais fluente do paralelo grego.
