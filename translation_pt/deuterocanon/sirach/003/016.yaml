  yaml_path: translation/deuterocanon/sirach/003/016.yaml
  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: pt
  text: Pois quem despreza o seu pai age com arrogância[a], e quem amaldiçoa a sua mãe irrita o seu Criador.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido por “age com presunção”. O paralelo grego intensifica a expressão: “é blasfemo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego apresenta uma leitura diferente: “e quem irrita a sua mãe é amaldiçoado pelo Senhor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵזִיד
  choice: age com arrogância
  rationale: O particípio de זיד caracteriza uma conduta arrogante ou presunçosa. A formulação verbal é natural em português e preserva a força moral do hebraico sem adotar o sentido mais especificamente religioso do grego βλάσφημος.
- source_word: בּוֹזֶה
  choice: quem despreza
  rationale: בזה denota desprezar ou tratar com desdém; “despreza” é direto e adequado ao contexto de honra devida aos pais.
- source_word: אָבִיו
  choice: o seu pai
  rationale: Mantém o sufixo pronominal explícito do hebraico.
- source_word: וּמַכְעִיס
  choice: irrita
  rationale: O particípio hifil de כעס significa causar ira, irritar ou provocar. “Irrita” expressa com clareza, em português corrente, o valor causativo aplicado ao Criador.
- source_word: בּוֹרְאוֹ
  choice: o seu Criador
  rationale: O hebraico diz literalmente “seu Criador”. Esta leitura clara do testemunho hebraico tem prioridade sobre o paralelo grego e mantém a referência divina explícita.
- source_word: מְקַלֵּל
  choice: quem amaldiçoa
  rationale: O particípio piel de קלל é entendido ativamente como “amaldiçoa”, tendo “a sua mãe” por objeto. A ordem das palavras permite reconhecer este particípio como sujeito da oração cujo predicado é “irrita o seu Criador”.
- source_word: אִמּוֹ
  choice: a sua mãe
  rationale: Mantém o sufixo pronominal e o paralelismo familiar com “o seu pai”.
theological_decisions:
- issue: Relação sintática dos termos na segunda oração
  choice: quem amaldiçoa a sua mãe irrita o seu Criador
  alternative: quem irrita a sua mãe é amaldiçoado pelo Senhor
  rationale: O hebraico dispõe os constituintes como “irrita seu Criador — quem amaldiçoa sua mãe”, favorecendo a leitura ativa refletida no texto principal. O grego apresenta uma construção diferente, na qual quem irrita a mãe é amaldiçoado pelo Senhor; essa importante variante é preservada em nota, sem substituir o testemunho hebraico.
- issue: Intensidade de מֵזִיד diante do grego βλάσφημος
  choice: age com arrogância
  alternative: é blasfemo
  rationale: O hebraico aponta para arrogância ou presunção, ao passo que o grego intensifica a caracterização como blasfêmia. O texto principal segue o hebraico e a nota conserva a leitura grega.
- issue: Designação divina na segunda oração
  choice: o seu Criador
  alternative: o Senhor
  rationale: O testemunho hebraico, extante e de alta confiança, traz “seu Criador”. O grego traz “pelo Senhor” dentro de uma construção sintática distinta; a variante é informada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os artigos antes dos possessivos dão fluidez sem regionalismo forte. A tradução segue prioritariamente a sintaxe do hebraico e registra em nota a divergência substancial do paralelo grego.
