  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: pt
  text: O coração do sábio entende os ditos dos sábios[a], e o ouvido atento se alegra na sabedoria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ditos” também pode significar “provérbios” ou “parábolas”; o paralelo grego traz “parábola” no singular.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diverge na segunda linha e diz aproximadamente: “e o ouvido de quem escuta é o desejo do sábio”. Aqui, a tradução segue o texto hebraico preservado: “e o ouvido atento se alegra na sabedoria”.'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: O coração do sábio
  rationale: Preserva a imagem antropológica hebraica de לֵב como centro interior do entendimento; o singular חָכָם tem sentido representativo.
- source_word: יָבִין
  choice: entende
  rationale: Expressa de modo direto a compreensão do ensino sapiencial.
- source_word: מִשְׁלֵי חֲכָמִים
  choice: os ditos dos sábios
  rationale: מָשָׁל pode designar dito, provérbio ou parábola. “Ditos” mantém a amplitude sem sugerir necessariamente o livro canônico de Provérbios.
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: o ouvido atento
  rationale: Conserva a imagem concreta do hebraico e comunica a ideia de escuta cuidadosa e receptiva.
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: se alegra na sabedoria
  rationale: Segue o texto hebraico, no qual o ouvido atento encontra alegria associada à sabedoria; a formulação é natural e dignificada em português.
