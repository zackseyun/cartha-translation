base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/023.yaml
  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: pt
  text: Não investigue o que está além de você[a], pois o que é grande demais para você lhe foi mostrado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não investigue coisas maiores do que você.” O verbo hebraico é difícil; o paralelo grego diz: “Não seja excessivamente curioso em suas muitas atividades.”'
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser entendido como “pois você viu muitas coisas que estão além de você”; o paralelo grego favorece “lhe foi mostrado”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: o que está além de você
  rationale: A expressão comparativa indica aquilo que excede o alcance ou a capacidade da pessoa. A formulação é natural em português e mantém a ideia de limite.
- source_word: אַל תַּמֵּר
  choice: não investigue
  rationale: O verbo hebraico é difícil nesta forma. À luz do contexto e do paralelo grego μὴ περιεργάζου, trata-se de uma advertência contra a investigação excessiva de assuntos que ultrapassam a pessoa.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão da proibição.
- source_word: רַב מִמְּךָ
  choice: o que é grande demais para você
  rationale: Conserva o sentido comparativo de algo que supera a medida ou capacidade humana, sem especificar indevidamente a natureza dessas realidades.
- source_word: הָרְאֵיתָ
  choice: lhe foi mostrado
  rationale: Embora a forma hebraica possa ser entendida ativamente como 'você viu', o paralelo grego ὑπεδείχθη σοι apoia claramente o sentido passivo. A tradução mantém esse sentido sem identificar quem mostrou.
theological_decisions:
- issue: Voz de הָרְאֵיתָ em relação ao paralelo grego
  choice: 'sentido passivo: “lhe foi mostrado”'
  alternative: 'sentido ativo: “você viu”'
  rationale: O hebraico admite uma leitura ativa, mas o grego preserva um sentido passivo explícito. Adota-se o passivo como leitura principal, enquanto a nota registra a ambiguidade real, sem transformar a advertência sapiencial em afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Investigue” comunica a busca deliberada sem tom excessivamente técnico; “está além de você” preserva de modo idiomático a noção de limite. As duas ambiguidades relevantes são mantidas em notas.
