  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
translation:
  language: pt
  text: Pois muitas são as especulações dos seres humanos[a][b], e imaginações perversas desencaminham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Adão” ou “filhos do homem”; é uma expressão hebraica genérica para os seres humanos.
    reason: lexical_alternative
  - marker: b
    text: O raro termo hebraico traduzido como “especulações” também pode significar “pensamentos”, “raciocínios” ou “suposições”. O paralelo grego traz “opinião” ou “suposição”.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: muitas
  rationale: Concorda com o substantivo plural feminino “especulações” e expressa diretamente a grande quantidade.
- source_word: עֶשְׁתּוֹנֵי
  choice: especulações
  rationale: O termo hebraico é raro e incerto. “Especulações” transmite a ideia contextual de conclusões ou noções formadas pela mente, apoiada pelo grego ὑπόλημψις, sem reduzir o termo a pensamentos neutros.
- source_word: בְּנֵי אָדָם
  choice: seres humanos
  rationale: Expressa em português corrente o sentido coletivo da locução hebraica, literalmente “filhos de Adão/do homem”, evitando que ela seja confundida aqui com um título individual.
- source_word: דִמְיוֹנוֹת
  choice: imaginações
  rationale: Designa concepções produzidas pela mente e mantém o paralelismo com “especulações” sem acrescentar uma interpretação mais específica.
- source_word: רָעוֹת
  choice: perversas
  rationale: Preserva a força moral negativa do hebraico e do paralelo grego πονηρά; “perversas” soa natural com “imaginações” em português.
- source_word: מַתְעוֹת
  choice: desencaminham
  rationale: Reproduz a ideia causativa de levar para fora do caminho correto. O sujeito são as “imaginações perversas”, e o objeto permanece implícito, como no hebraico.
theological_decisions:
- issue: Sentido antropológico de בְּנֵי אָדָם
  choice: seres humanos
  alternative: filhos de Adão; filhos do homem
  rationale: A expressão é genérica e se refere à humanidade, não a um título messiânico neste contexto. A forma idiomática moderna comunica esse alcance, enquanto a nota conserva a expressão literal.
- issue: Caráter das concepções humanas
  choice: especulações
  alternative: pensamentos; raciocínios; suposições
  rationale: O vocábulo raro e o paralelo grego sugerem noções ou juízos formados pela própria mente. A tradução mantém o tom de advertência sem afirmar que todo pensamento humano seja necessariamente mau.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa próxima da estrutura sapiencial hebraica. “Desencaminham” conserva a imagem de afastamento do caminho correto, e as notas registram as duas principais ambiguidades lexicais.
