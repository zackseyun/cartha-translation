  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: pt
  text: Quem honra seu pai terá muitos dias, e quem honra sua mãe retribui a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “e quem obedece ao Senhor dará descanso à sua mãe”. O hebraico e o grego diferem substancialmente no segundo membro do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honra
  rationale: O particípio de כבד, neste contexto ético, expressa dar aos pais a honra e o respeito que lhes são devidos. “Honra” é natural em português e mantém a ligação com a tradição do mandamento.
- source_word: אָבִיו / אִמּוֹ
  choice: seu pai / sua mãe
  rationale: Os substantivos hebraicos trazem sufixos de terceira pessoa masculina singular; “seu pai” e “sua mãe” preservam essa referência individual.
- source_word: יִרְבּוּ יָמָיו
  choice: terá muitos dias
  rationale: A expressão significa literalmente “seus dias serão muitos”. A formulação escolhida conserva a imagem hebraica e continua clara em português, sem reduzi-la simplesmente a “viverá muito”.
- source_word: וּגְמוּל אֱלֹהִים עַל
  choice: retribui a Deus
  rationale: A frase hebraica transmitida é condensada e incomum, mas pode ser entendida como a honra prestada à mãe contando como retribuição dirigida a Deus. A tradução preserva essa relação sem substituí-la pela leitura grega divergente.
theological_decisions:
- issue: Divergência entre o segundo membro hebraico e o paralelo grego
  choice: 'Seguir no texto principal o hebraico preservado: quem honra a mãe retribui a Deus.'
  alternative: 'Seguir o grego: “quem obedece ao Senhor dará descanso à sua mãe”.'
  rationale: Como há testemunho hebraico de alta confiança, ele recebe prioridade. A diferença substancial do grego, porém, é teologicamente e textualmente relevante e por isso é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Terá muitos dias” conserva a imagem semítica; “retribui a Deus” mantém deliberadamente a formulação teologicamente tensa e algo incomum do hebraico.
