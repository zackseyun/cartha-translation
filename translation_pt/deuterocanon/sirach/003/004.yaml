  text: And whoever honors his mother is like one who stores up treasure.
translation:
  language: pt
  text: E quem honra sua mãe é como quem acumula um tesouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: honra
  rationale: Neste contexto de sabedoria e dever filial, o verbo indica conferir à mãe a devida honra e estima, sem exigir o sentido cultual mais forte de “glorificar”.
- source_word: ἀποθησαυρίζων
  choice: acumula um tesouro
  rationale: Preserva a imagem concreta de ajuntar e guardar algo valioso, em linguagem portuguesa natural, sem definir em que consiste a recompensa.
- source_word: μητέρα αὐτοῦ
  choice: sua mãe
  rationale: Mantém o substantivo singular e a referência possessiva explícita do grego proverbial.
- source_word: ὡς
  choice: é como
  rationale: Explicita de modo idiomático a comparação introduzida por ὡς na oração nominal grega.
theological_decisions:
- issue: Imagem de recompensa ligada à honra filial
  choice: 'Manter a comparação aberta: honrar a mãe é como acumular um tesouro.'
  alternative: Definir o tesouro como prosperidade material, recompensa celestial ou benefício moral geral.
  rationale: O texto grego não identifica a natureza do tesouro; a tradução conserva a metáfora e sua tensão sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Acumula um tesouro” soa natural e mantém a metáfora do original.
