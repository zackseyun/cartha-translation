base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: pt
  text: Quem honra seu pai faz expiação por seus pecados[a], e quem honra sua mãe acumula um tesouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “seu pecado” no singular; o paralelo grego traz “pecados”. Aqui, o singular hebraico é entendido em sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guarda um tesouro”. A imagem é a de reservar uma recompensa como riqueza acumulada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַבֵּד
  choice: honra
  rationale: O particípio piel de כבד indica dar a alguém a honra devida. “Honra” é natural, preserva a força ética do hebraico e é mais forte que simples respeito.
- source_word: אָב
  choice: seu pai
  rationale: O hebraico nomeia especificamente o pai no singular, com o possessivo entendido pelo paralelo e expresso no restante da oração.
- source_word: תְּכֻפַּר
  choice: faz expiação
  rationale: A forma de כפר expressa expiação. Em português, esta construção comunica de modo claro o resultado atribuído a quem honra o pai, em consonância com o paralelo grego ἐξιλάσεται.
- source_word: חַטָּאתוֹ
  choice: seus pecados
  rationale: Embora o hebraico tenha o singular “seu pecado”, ele pode ter sentido coletivo; o grego paralelo traz o plural. O plural comunica naturalmente esse provável sentido.
- source_word: וְגוֹנֵז אוֹצָר
  choice: acumula um tesouro
  rationale: גנז descreve guardar ou reservar algo, e אוצר significa tesouro. “Acumula um tesouro” preserva a imagem de uma recompensa posta em reserva sem a conotação negativa de “entesoura” ou “açambarca”.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Preserva o sufixo possessivo explícito e o paralelismo individualizado entre pai e mãe.
theological_decisions:
- issue: Linguagem de expiação no contexto sapiencial
  choice: Manter a formulação explícita “faz expiação por seus pecados”.
  alternative: “cobre seus pecados” ou “alcança perdão por seus pecados”
  rationale: Tanto כפר quanto o grego ἐξιλάσεται possuem força expiatória. A tradução mantém a tensão teológica do texto, sem reduzi-la a um benefício moral vago nem explicá-la por meio de um sistema doutrinário posterior.
- issue: Termos filiais marcados por gênero
  choice: Usar “pai” e “mãe”.
  alternative: “pais” ou “progenitores”
  rationale: O texto menciona separadamente o pai e a mãe, e o paralelismo depende dessa distinção.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Faz expiação” conserva o peso teológico do original; “acumula um tesouro” mantém a metáfora em linguagem corrente. Os marcadores aparecem junto aos termos a que se referem.
