base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: pt
  text: Pois o SENHOR honrou o pai diante dos filhos e confirmou a autoridade da mãe sobre seus filhos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabeleceu o direito da mãe sobre seus filhos”. O hebraico mishpat pode significar “juízo”, “justiça” ou um “direito” reconhecido; aqui se refere provavelmente à legítima autoridade da mãe na família.'
    reason: lexical_alternative
  - marker: b
    text: “Diante dos filhos” também pode ser entendido como “acima dos filhos”, indicando precedência ou posição de honra. Na segunda linha, o paralelo grego traz “filhos”, enquanto o hebraico preservado diz literalmente “seus filhos”; a tradução segue o hebraico.
    reason: textual_and_semantic_ambiguity
lexical_decisions:
- source_word: יְהֹוָה
  choice: o SENHOR
  rationale: Emprega a forma reverencial tradicional para o tetragrama, em harmonia com o paralelo grego Κύριος e com o uso bíblico corrente em português.
- source_word: כִּבֵּד
  choice: honrou
  rationale: O piel de כבד significa dar honra ou peso; “honrou” é natural e preserva o sentido direto.
- source_word: לִפְנֵי הַבָּנִים
  choice: diante dos filhos
  rationale: Preserva a imagem literal de לפני, que pode indicar presença, posição ou precedência, sem resolver em excesso a relação ambígua.
- source_word: וּמִשְׁפַּט הָאֵם
  choice: a autoridade da mãe
  rationale: משפט pode denotar juízo, direito ou reivindicação legal; no contexto familiar, “autoridade” comunica sua força relacional, mantendo “direito” como alternativa em nota.
- source_word: קִיֵּם
  choice: confirmou
  rationale: O verbo significa firmar, validar ou estabelecer. “Confirmou” exprime a validação divina da posição da mãe e corresponde bem ao grego ἐστερέωσεν.
- source_word: עַל יְלָדֶיהָ
  choice: sobre seus filhos
  rationale: על indica aqui a relação de autoridade ou âmbito, e o sufixo hebraico exige referência explícita aos filhos dela.
theological_decisions:
- issue: Distinção entre pai e mãe no paralelismo
  choice: o pai ... a autoridade da mãe
  alternative: os pais ... a autoridade parental
  rationale: O hebraico distingue explicitamente pai e mãe; preservar essa forma evita apagar o paralelismo e não acrescenta uma formulação abstrata ausente do texto.
- issue: Força social e jurídica de משפט
  choice: autoridade
  alternative: direito
  rationale: “Autoridade” comunica de modo claro a posição reconhecida da mãe, enquanto a nota conserva a possibilidade lexical de “direito” sem importar uma estrutura doutrinária posterior.
- issue: Sentido de לפני na relação entre pai e filhos
  choice: diante dos filhos
  alternative: acima dos filhos
  rationale: A expressão hebraica admite uma noção espacial, pública ou de precedência. A tradução principal conserva a imagem e a nota registra a leitura interpretativa de superioridade ou precedência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem proverbial e o paralelismo entre pai e mãe foram preservados; as ambiguidades reais de לפני e משפט são apresentadas em notas.
