base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/030.yaml
  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: pt
  text: A água apaga o fogo ardente; assim, dar esmolas[a] faz expiação pelo pecado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praticar a caridade”. O hebraico צדקה também pode significar “justiça”, mas o paralelo grego traz “dar esmolas” (ἐλεημοσύνη), provavelmente o sentido pretendido aqui.
    reason: lexical_alternative
  - marker: b
    text: O grego traz “pecados”, no plural. O singular hebraico pode ser entendido em sentido genérico.
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: fogo ardente
  rationale: Expressa naturalmente a imagem hebraica de um fogo que arde com intensidade; o paralelo grego confirma a ideia de fogo em chamas.
- source_word: יכבו
  choice: apaga
  rationale: O verbo hebraico significa extinguir ou apagar fogo. “Apaga” é claro, corrente e preserva a imagem concreta.
- source_word: מים
  choice: A água
  rationale: O hebraico usa o termo de modo coletivo; o singular “água” é a forma proverbial mais natural em português.
- source_word: כן
  choice: assim
  rationale: Marca de forma concisa a comparação entre as duas partes do provérbio.
- source_word: צדקה
  choice: dar esmolas
  rationale: Embora o termo também possa significar “justiça”, aqui indica concretamente a ajuda dada aos necessitados. O grego ἐλεημοσύνη confirma esse sentido. A expressão verbal “dar esmolas” é mais natural e inequívoca em português moderno do que o substantivo isolado “esmola”.
- source_word: תכפר
  choice: faz expiação por
  rationale: Preserva a força cultual e teológica do piel de כפר, também refletida pelo grego ἐξιλάσεται, sem enfraquecê-la para “compensa” ou “repara”.
- source_word: חטאת
  choice: pecado
  rationale: Neste contexto, o termo se refere ao pecado ou à culpa, não a uma oferta pelo pecado. O singular hebraico pode ter sentido genérico.
theological_decisions:
- issue: Sentido de צדקה em relação à expiação
  choice: “dar esmolas faz expiação pelo pecado”
  alternative: “a justiça faz expiação pelo pecado”
  rationale: צדקה pode designar justiça em sentido amplo, mas o paralelismo e o grego ἐλεημοσύνη apontam para a prática concreta de ajudar os necessitados. A formulação mantém, sem atenuar nem explicar doutrinariamente, a afirmação teológica do próprio texto sobre a expiação.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Dar esmolas” evita o possível sentido pejorativo moderno de “esmola” isolada e comunica uma prática voluntária de misericórdia. A expressão “faz expiação” conserva deliberadamente a tensão teológica do original.
