  text: The greater you are, the more you must humble yourself, and before God you will find mercy.
translation:
  language: pt
  text: Quanto maior você for, mais se faça pequeno[a], e diante de Deus encontrará misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Reduza a si mesmo em relação a toda grandeza”; o grego traz: “Quanto maior você for, tanto mais humilhe a si mesmo”.'
    reason: Registra a construção incomum do hebraico e a forma comparativa confirmada pelo antigo paralelo grego.
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: faça-se pequeno
  rationale: Preserva a imagem concreta do hebraico, literalmente ‘reduza/diminua a si mesmo’, em linguagem portuguesa natural, sem substituir a imagem diretamente por uma abstração como ‘seja humilde’.
- source_word: מִכָּל גְּדוּלָה
  choice: Quanto maior você for, mais
  rationale: Expressa em português fluente a relação entre grandeza e auto-humilhação; a leitura comparativa é explicitamente confirmada pelo paralelo grego, embora a formulação hebraica seja mais compacta.
- source_word: אֵל
  choice: Deus
  rationale: Equivalente direto do substantivo hebraico ’El neste contexto.
- source_word: רַחֲמִים
  choice: misericórdia
  rationale: O plural hebraico idiomático designa compaixão ou misericórdia; o singular coletivo é a forma natural em português.
theological_decisions:
- issue: Relação entre grandeza e humildade
  choice: Quanto maior você for, mais se faça pequeno
  alternative: Faça-se pequeno diante de toda grandeza
  rationale: A tradução escolhida mantém a exortação paradoxal e concorda com o testemunho grego, sem definir se a ‘grandeza’ é posição, honra, poder ou mérito.
- issue: Objeto encontrado diante de Deus
  choice: misericórdia
  alternative: graça
  rationale: Segue o hebraico רַחֲמִים, enquanto ‘graça’ reflete o grego χάριν; não se harmonizam silenciosamente os dois termos.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para ampla legibilidade brasileira. A expressão “faça-se pequeno” conserva a metáfora hebraica e evita linguagem excessivamente técnica ou confessional.
