base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/020.yaml
  text: For the mercies of God are many[b][a], and to the humble he reveals his secret.
translation:
  language: pt
  text: Pois muitas são as misericórdias de Deus,[a] e aos humildes ele revela o seu segredo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois grande é o domínio do Senhor, e ele é glorificado pelos humildes”. Neste ponto, o testemunho hebraico difere substancialmente do grego.'
    reason: alternative_reading
  - marker: b
    text: Ou “o seu conselho confidencial”. A palavra hebraica pode indicar um segredo partilhado em confiança íntima, e não apenas uma informação oculta.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  choice: muitas são as misericórdias de Deus
  rationale: Mantém o plural hebraico רַחֲמֵי e a construção predicativa com רַבִּים. “Misericórdias” comunica as numerosas manifestações da compaixão divina, sem substituir אֱלֹהִים por “Senhor”, como faz a tradição grega.
- source_word: וְלַעֲנָוִים
  choice: e aos humildes
  rationale: “Humildes” expressa de modo natural o sentido ético e social de עֲנָוִים na literatura sapiencial, evitando a conotação mais estreita ou tradicional de “mansos”.
- source_word: יְגַלֶּה
  choice: ele revela
  rationale: Verbo direto e corrente para a ideia de descobrir ou dar a conhecer algo antes reservado.
- source_word: סוֹדוֹ
  choice: o seu segredo
  rationale: É a correspondência mais direta, mas סוֹד também pode indicar conselho confidencial ou intimidade de deliberação; essa amplitude é registrada em nota.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: “muitas são as misericórdias de Deus [...] aos humildes ele revela o seu segredo”.'
  alternative: 'Paralelo grego: “grande é o domínio do Senhor, e ele é glorificado pelos humildes”.'
  rationale: Como há testemunho hebraico de alta confiança, ele orienta o texto principal. A forma grega transmite uma leitura teologicamente e semanticamente distinta de todo o versículo e, por isso, é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem “muitas são” preserva a ênfase do hebraico sem soar arcaica; “aos humildes” e “revela o seu segredo” mantêm concisão e naturalidade.
