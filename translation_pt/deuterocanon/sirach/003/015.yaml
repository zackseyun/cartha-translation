base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/015.yaml
  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: pt
  text: No dia da aflição, isso será lembrado em seu favor; como o calor sobre a geada[a], seus pecados serão eliminados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto o grego: “como o tempo bom sobre a geada, assim seus pecados se dissolverão”. O hebraico traz “calor sobre a geada”, enquanto o paralelo grego traz “tempo bom sobre a geada”. Ambas as formas evocam o desaparecimento da geada.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: No dia da aflição
  rationale: Preserva a formulação temporal e a gravidade de צָרָה, em português natural e digno.
- source_word: תִּזָּכֵר לָךְ
  choice: isso será lembrado em seu favor
  rationale: O feminino singular provavelmente retoma a conduta filial do contexto. O pronome neutro “isso” evita especificar além do hebraico, e לָךְ é entendido como dativo de vantagem.
- source_word: כְּחֹם עַל כְּפוֹר
  choice: como o calor sobre a geada
  rationale: Segue prioritariamente o hebraico, mantendo a imagem concreta do calor que faz desaparecer a geada.
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: seus pecados serão eliminados
  rationale: השבית expressa fazer cessar ou remover. “Eliminados” comunica essa força sem converter o resultado verbal em “derreter”, imagem apoiada pelo grego, mas não explicitada no verbo hebraico; “pecados” é claro e corrente para עוונות.
theological_decisions:
- issue: Relação entre a conduta filial lembrada e a remoção dos pecados
  choice: Manter juntas, sem explicação doutrinária adicional, a lembrança em favor da pessoa e a eliminação de seus pecados.
  alternative: Explicitar que honrar os pais expia pecados de modo meritório, ou reduzir a frase a uma promessa geral de auxílio providencial.
  rationale: O versículo afirma tanto a lembrança favorável quanto a remoção dos pecados. A tradução preserva essa tensão própria da literatura sapiencial sem impor uma construção teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno e claro; “em seu favor” explicita naturalmente o dativo de vantagem, enquanto “isso” conserva a referência contextual sem defini-la em excesso.
