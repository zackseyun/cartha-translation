translation:
  language: pt
  text: Não busque honra na desonra de seu pai[a], pois isso não é honra para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não busque honra por meio da desonra de seu pai.” O verbo hebraico reflexivo pode indicar a busca de honra para si, e a preposição também pode ter sentido instrumental. O paralelo grego emprega igualmente linguagem de glória e honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: Não busque honra
  rationale: O hitpael de כבד expressa a ideia reflexiva de obter ou buscar honra para si. Em português, “buscar honra” comunica esse sentido com naturalidade e evita a possível leitura positiva de “honrar-se”.
- source_word: בְּקְלוֹן
  choice: na desonra
  rationale: קלון significa desonra, vergonha ou humilhação. A preposição בְּ pode indicar circunstância (“na”) ou meio (“por meio da”); a tradução principal mantém a construção concisa e a nota preserva a alternativa instrumental.
- source_word: אָבִיךָ
  choice: de seu pai
  rationale: Preserva o substantivo singular e o possessivo do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão da proibição, em registro sapiencial.
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: isso não é honra para você
  rationale: Mantém a estrutura nominal e a repetição conceitual de כבד/כבוד, deixando claro que a desonra do pai não confere honra ao filho.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Seu pai” é mais natural que “teu pai” no registro internacional pretendido. A repetição de “honra” preserva o jogo lexical hebraico, enquanto “desonra” traduz קלון de forma direta.
