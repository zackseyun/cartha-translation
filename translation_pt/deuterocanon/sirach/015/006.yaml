  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
translation:
  language: pt
  text: Encontrará júbilo e alegria, e um nome eterno será sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “herdará um nome eterno”. O verbo hebraico também pode ser entendido dessa maneira, e o paralelo grego emprega explicitamente a linguagem de herança.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: contentamento
  rationale: Expressa alegria prazerosa em português atual e permite preservar, com termo distinto, o paralelismo com שִׂמְחָה.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Equivalente claro e corrente, adequado como quase sinônimo de שָׂשׂוֹן no par poético.
- source_word: יִמְצָא
  choice: encontrará
  rationale: Mantém o sentido básico de מצא e soa natural no contexto.
- source_word: שֵׂם עוֹלָם
  choice: um nome eterno
  rationale: Preserva a imagem hebraica de um nome duradouro, confirmada pelo grego ὄνομα αἰώνιον, sem substituí-la pela interpretação 'reputação'.
- source_word: תּוֹרִישֶׁנּוּ
  choice: será sua herança
  rationale: Conserva a linguagem de herança apoiada pelo paralelo grego, ao mesmo tempo que evita impor uma reconstrução sintática excessivamente específica ao hebraico condensado.
theological_decisions:
- issue: Construção da oração final com תּוֹרִישֶׁנּוּ à luz do alinhamento hebraico-grego
  choice: Um nome eterno será a herança da pessoa.
  alternative: Ele herdará um nome eterno; ou ela lhe dará um nome eterno por herança.
  rationale: A forma hebraica admite mais de uma construção, mas as leituras convergem na recepção de um nome duradouro como herança. A redação escolhida preserva o motivo da herança e a tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e a metáfora do “nome eterno” foram preservadas; o pronome sujeito, recuperável do contexto, não foi acrescentado.
