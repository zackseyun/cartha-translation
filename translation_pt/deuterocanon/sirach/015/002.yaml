translation:
  language: pt
  text: Ela irá ao encontro dele como uma mãe e o acolherá como a esposa da sua juventude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “como uma mulher em sua virgindade”, isto é, como uma jovem noiva ou esposa virgem.'
    reason: Leitura alternativa do paralelo grego, que ressalta a virgindade ou juventude nupcial.
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: irá ao encontro dele
  rationale: קדם expressa aqui a iniciativa de vir ou sair ao encontro de alguém; o paralelo grego ὑπαντήσεται confirma esse sentido ativo.
- source_word: כָאֵם
  choice: como uma mãe
  rationale: Reproduz diretamente a comparação introduzida por כ e mantém a imagem materna.
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: como a esposa da sua juventude
  rationale: A expressão hebraica designa a esposa ligada à juventude do homem, evocando o vínculo e o afeto do início do casamento. O artigo definido soa natural em português nesse idioma bíblico.
- source_word: תְּקַבְּלֶנּוּ
  choice: o acolherá
  rationale: קבל pode significar receber ou aceitar; “acolherá” comunica com naturalidade a recepção pessoal e afetuosa sugerida pelas imagens de mãe e esposa.
theological_decisions:
- issue: Personificação feminina da Sabedoria em imagens materna e conjugal
  choice: Manter a referência feminina por meio de “Ela” e das comparações com mãe e esposa.
  alternative: Tratar a Sabedoria de modo impessoal ou eliminar a personificação.
  rationale: Os verbos hebraicos estão no feminino, e o próprio verso apresenta a Sabedoria mediante imagens pessoais femininas; preservar isso mantém a força poética e teológica do texto.
- issue: Sentido de אֵשֶׁת נְעוּרִים diante do grego γυνὴ παρθενείας
  choice: 'Seguir no texto principal o hebraico: “a esposa da sua juventude”.'
  alternative: “uma jovem noiva”, “esposa virgem” ou “mulher em sua virgindade”.
  rationale: Como o hebraico está preservado e tem prioridade, sua expressão idiomática deve reger o texto principal; a nuance grega de virgindade ou juventude nupcial é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Irá ao encontro” preserva a iniciativa da Sabedoria; “acolherá” evita rigidez excessiva sem perder o sentido de receber. O marcador [a] aparece no texto principal.
