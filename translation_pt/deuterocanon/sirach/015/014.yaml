base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: pt
  text: Deus, desde o princípio, criou o ser humano[a] e o pôs nas mãos de seu próprio ímpeto[b]; entregou-o nas mãos de sua própria inclinação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem”. O hebraico אָדָם está no singular, mas pode representar coletivamente a humanidade.'
    reason: lexical_alternative
  - marker: b
    text: 'O termo hebraico é difícil e pode sugerir algo que arrebata, impele ou exerce força. O grego traz: “e o deixou nas mãos de seu próprio conselho”; essa formulação pode refletir uma tradição textual diferente.'
    reason: textual_difficulty
lexical_decisions:
- source_word: מִבְּרֵאשִׁית
  choice: desde o princípio
  rationale: Expressa naturalmente o sentido temporal de מִן + רֵאשִׁית, confirmado pelo grego ἐξ ἀρχῆς, sem produzir uma alusão desnecessariamente direta a Gênesis 1:1.
- source_word: בָּרָא
  choice: criou
  rationale: É o equivalente direto e teologicamente adequado do verbo ברא quando Deus é o sujeito.
- source_word: אָדָם
  choice: o ser humano
  rationale: O singular hebraico representa aqui a humanidade de modo coletivo. A expressão mantém o número gramatical no singular e é clara em português contemporâneo.
- source_word: וַיְשִׁיתֵהוּ
  choice: e o pôs
  rationale: שית significa pôr ou colocar. A formulação é concisa, natural e preserva a construção hebraica.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem hebraica da mão como esfera de poder ou domínio; o plural é a forma idiomática mais natural em português.
- source_word: חוֹתְפוֹ
  choice: seu próprio ímpeto
  rationale: A forma hebraica é difícil e sugere algo que arrebata ou impele. “Ímpeto” retém a ideia de força interior sem confundi-la plenamente com יצר nem impor a noção de um captor externo.
- source_word: וַיִּתְּנֵהוּ
  choice: entregou-o
  rationale: נתן com ביד pode significar entregar alguém ao poder ou à direção de algo. “Entregou-o” reproduz essa força com naturalidade.
- source_word: יִצְרוֹ
  choice: sua própria inclinação
  rationale: יצר, em contexto sapiencial e antropológico, pode designar a disposição ou inclinação interior da pessoa. A tradução evita qualificá-la antecipadamente como boa ou má.
theological_decisions:
- issue: A agência moral humana depois da criação
  choice: Deus põe o ser humano sob a direção de seu próprio ímpeto e de sua própria inclinação.
  alternative: Deus deixa o ser humano nas mãos de seu próprio conselho.
  rationale: O hebraico enfatiza que Deus é o Criador, mas também apresenta o ser humano entregue à sua direção interior. O grego confirma o tema da autodireção humana, embora formule a ideia como “seu próprio conselho”. A tradução não transforma isso em uma afirmação filosófica de autonomia absoluta nem define a inclinação como necessariamente má.
- issue: Valor moral de יִצְרוֹ
  choice: inclinação, sem adjetivo moral
  alternative: má inclinação
  rationale: O versículo não qualifica expressamente יצר como mau. Acrescentar “má” resolveria uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Desde o princípio” e “nas mãos de” preservam as imagens do original sem rigidez excessiva. “Ímpeto” mantém a dificuldade e a força de חוֹתְפוֹ, enquanto a nota registra a leitura grega sem fazê-la substituir silenciosamente o hebraico.
