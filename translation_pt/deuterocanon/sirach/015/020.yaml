  text: He did not command anyone to be ungodly, and he did not permit anyone to sin.
translation:
  language: pt
  text: Ele não ordenou ao ser humano que pecasse, nem fortaleceu os que vivem na falsidade. Não tem misericórdia de quem pratica o que é vão nem de quem revela um segredo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “Ele não ordenou a ninguém que agisse impiamente, nem deu a ninguém permissão para pecar.”'
    reason: Registra a diferença substancial entre o testemunho hebraico principal, que prossegue com mais dois membros e traz «fortaleceu os que vivem na falsidade», e o paralelo grego, cuja forma é mais breve e traz «deu ... permissão para pecar».
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: ser humano
  rationale: Expressa o sentido coletivo e universal do hebraico sem restringi-lo ao sexo masculino.
- source_word: לַחֲטֹא
  choice: que pecasse
  rationale: Reproduz diretamente o infinitivo hebraico «pecar» em construção portuguesa natural.
- source_word: הֶחֱלִים
  choice: fortaleceu
  rationale: Conserva o sentido causativo mais provável do verbo hebraico, «tornar forte/dar força», em vez de assimilá-lo à leitura grega «permitiu».
- source_word: אַנְשֵׁי כָזָב
  choice: os que vivem na falsidade
  rationale: Comunica idiomaticamente «homens/pessoas de falsidade», isto é, pessoas caracterizadas pela mentira ou falsidade.
theological_decisions:
- issue: Responsabilidade divina pelo pecado
  choice: Manter a afirmação hebraica de que Deus não ordena o pecado nem fortalece os que vivem na falsidade.
  alternative: 'Seguir o paralelo grego: «não deu a ninguém permissão para pecar».'
  rationale: A tradução principal segue o testemunho hebraico fornecido, sem harmonizá-lo silenciosamente com o grego nem ampliar a declaração para uma formulação doutrinária além do texto.
translation_notes:
  register: Português atual, digno e de leitura ampla. «Ser humano» evita o masculino genérico; «os que vivem na falsidade» torna natural a expressão hebraica sem reduzir כָזָב apenas a uma mentira pontual.
