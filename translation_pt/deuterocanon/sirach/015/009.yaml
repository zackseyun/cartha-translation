base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/009.yaml
  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
translation:
  language: pt
  text: O louvor não convém na boca de um perverso, pois não lhe foi destinado por Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “pois não foi enviado pelo Senhor”. O hebraico diz, mais literalmente: “pois não lhe foi repartido por Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: não convém
  rationale: Expressa adequação ou propriedade moral, não apenas beleza estética; é natural e digno em português atual.
- source_word: תְהִלָּה
  choice: o louvor
  rationale: O substantivo designa louvor de modo geral; o contexto não exige o sentido mais específico de cântico.
- source_word: בְּפִי
  choice: na boca de
  rationale: Preserva a imagem concreta do hebraico e corresponde de perto ao paralelo grego, sem soar artificial em português.
- source_word: רָשָׂע
  choice: um perverso
  rationale: Mantém o singular masculino do hebraico e seu sentido moral, distinguindo-o do grego ἁμαρτωλοῦ, 'pecador'.
- source_word: נֶחְלְקָה לּוֹ
  choice: não lhe foi concedido
  rationale: Comunica de modo natural a ideia passiva de algo dado como porção ou atribuição. 'Repartido' seria mais literal, mas pouco idiomático neste contexto.
- source_word: מֵאֵל
  choice: por Deus
  rationale: Em português, a construção passiva pede naturalmente o agente introduzido por 'por'. Embora a preposição hebraica seja literalmente 'de/desde Deus', o sentido de origem divina permanece.
theological_decisions:
- issue: Relação entre o hebraico e o grego no segundo membro
  choice: 'Seguir no texto principal o hebraico: o louvor não lhe foi concedido por Deus.'
  alternative: 'O grego traz: ''pois não foi enviado pelo Senhor''.'
  rationale: O testemunho hebraico existente é de alta confiança e deve reger a tradução. A forma grega pode refletir outro texto-base ou uma interpretação e, por transparência, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se a imagem semítica de algo estar “na boca” de alguém; a formulação “não lhe foi concedido” evita o pouco natural “não lhe foi repartido” no texto principal.
