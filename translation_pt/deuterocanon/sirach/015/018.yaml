  yaml_path: translation/deuterocanon/sirach/015/018.yaml
  text: For the wisdom of Yahweh is abundant[a]; he is mighty in power and sees all things.
translation:
  language: pt
  text: Pois a sabedoria de Yahweh é abundante[a]; ele é poderoso em força e vê tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico סָפְקָה também pode sugerir «é suficiente» ou «proveu»; o paralelo grego diz «grande/abundante», apoiando aqui a tradução «é abundante».
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקָה
  choice: é abundante
  rationale: O verbo hebraico pode exprimir abundância ou suficiência. Neste contexto, e à luz do paralelo grego πολλὴ, «é abundante» comunica melhor a grandeza da sabedoria divina sem eliminar a alternativa lexical.
- source_word: חָכְמַת
  choice: a sabedoria de
  rationale: Tradução corrente e direta do substantivo חָכְמָה em construção com o nome divino.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: poderoso em força
  rationale: אַמִּיץ denota vigor ou poder, enquanto גְּבוּרוֹת pode indicar força, poder ou feitos poderosos. A expressão escolhida conserva o sentido abstrato apoiado pelo paralelo grego, embora mantenha a intensidade do hebraico.
- source_word: וְחוֹזֶה כֹל
  choice: e vê tudo
  rationale: חזה significa ver ou contemplar, e כֹל dá alcance total à percepção divina. «Vê tudo» é natural e abrangente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama; «Yahweh» preserva o nome próprio e evita convertê-lo silenciosamente em título.
- issue: Alcance de וְחוֹזֶה כֹל
  choice: vê tudo
  alternative: contempla todas as coisas
  rationale: A formulação expressa percepção divina abrangente sem acrescentar uma explicação doutrinária além do enunciado do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. «Poderoso em força» mantém o paralelismo elevado e a intensidade da expressão original; «vê tudo» evita uma formulação desnecessariamente arcaica.
