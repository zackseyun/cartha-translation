  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
translation:
  language: pt
  text: Quem teme o SENHOR fará isso, e quem se apega à Lei[a] a guiará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico תּוֹרָה também pode ser traduzido por “Torá” ou, em sentido mais amplo, “instrução”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico preservado diz literalmente “a guiará”, uma leitura difícil no contexto. O paralelo grego diz “a alcançará”. O pronome feminino provavelmente se refere à Sabedoria personificada no contexto.
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: quem teme o SENHOR
  rationale: O particípio substantivado descreve, em forma proverbial, a pessoa que teme YHWH. “Quem teme” é natural e inclusivo em português, enquanto “SENHOR” segue a convenção bíblica de representar o nome divino.
- source_word: יַעֲשֶׂה זֹאת
  choice: fará isso
  rationale: Reproduz diretamente o demonstrativo feminino singular do hebraico sem explicitar além do texto a que “isso” se refere.
- source_word: וְתוֹפֵשׂ
  choice: e quem se apega
  rationale: תפש expressa tomar ou segurar firmemente. “Apegar-se” conserva a ideia de adesão firme e soa mais natural em português do que uma reprodução mecânica como “agarrar” a Lei.
- source_word: תּוֹרָה
  choice: à Lei
  rationale: No contexto judaico sapiencial, o termo pode designar a Lei/Torá e também instrução. O paralelo grego νόμος apoia “Lei”; a inicial maiúscula sinaliza a referência religiosa sem eliminar as alternativas, registradas em nota.
- source_word: יַדְרִיכֶנָּה
  choice: a alcançará
  rationale: A forma hebraica transmitida é difícil neste contexto e, tomada segundo sua vocalização, sugeriria “a guiará”. O paralelo grego καταλήμψεται αὐτήν traz “a alcançará/obterá” e fornece o sentido contextual mais coerente. O pronome feminino mantém a personificação e evita inserir “Sabedoria” onde o versículo traz apenas um objeto pronominal.
theological_decisions:
- issue: Referente do objeto feminino na última oração
  choice: Manter o pronome feminino “a”, que no contexto aponta para a Sabedoria personificada.
  alternative: Explicitar “alcançará a Sabedoria” ou entender o objeto como a Lei mencionada imediatamente antes.
  rationale: Sirácida 14:20–15:10 apresenta a Sabedoria como mulher, e o grego conserva um objeto feminino. O pronome preserva tanto a ligação contextual com a Sabedoria quanto a ambiguidade gramatical produzida em português pela proximidade de “Lei”.
- issue: Sentido do verbo hebraico final diante do paralelo grego
  choice: Adotar no texto “alcançará”, apoiado pelo grego, e registrar a dificuldade hebraica em nota.
  alternative: Traduzir a forma hebraica vocalizada por “a guiará”.
  rationale: A leitura hebraica é semanticamente difícil, pois faria daquele que se apega à Lei o agente que guia a figura feminina. O grego antigo oferece uma leitura coerente com o desenvolvimento sapiencial, mas a nota impede que a divergência textual seja ocultada.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Quem” evita peso desnecessário e continua fiel à função substantivada dos particípios. A colocação pronominal em “a alcançará” é natural no registro escrito e preserva a referência feminina sem resolver silenciosamente sua ambiguidade.
