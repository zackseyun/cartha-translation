  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
translation:
  language: pt
  text: Ela o alimentará com o pão do entendimento e lhe dará de beber a água do discernimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “água da sabedoria” onde o hebraico diz “água do discernimento”.
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: Ela o alimentará
  rationale: A forma hifil de אכל significa “fazer comer, alimentar” e tem sujeito feminino singular, coerente com a Sabedoria personificada no contexto, além do sufixo masculino singular “o”. O futuro expressa naturalmente a sequência verbal no contexto.
- source_word: לֶחֶם שָׂכֶל
  choice: o pão do entendimento
  rationale: Mantém a imagem concreta do pão e traduz שָׂכֶל por “entendimento”, em consonância com o sentido de compreensão ou bom senso e com o paralelo grego συνέσεως.
- source_word: וּמֵי תְבוּנָה
  choice: a água do discernimento
  rationale: Embora מֵי seja formalmente plural/construto, “água” no singular coletivo é natural em português. “Discernimento” distingue תְבוּנָה de שָׂכֶל sem apagar a proximidade semântica entre os dois termos.
- source_word: תַּשְׁקֶנּוּ
  choice: lhe dará de beber
  rationale: Traduz de modo idiomático o sentido causativo de שקה, “dar de beber”, preservando o objeto masculino singular.
theological_decisions:
- issue: Sujeito feminino personificado
  choice: Ela
  alternative: Ele; ou omitir o pronome
  rationale: O hebraico apresenta sujeito feminino singular, e o contexto identifica a Sabedoria personificada. Assim, “Ela” torna explícita em português uma informação gramatical e contextual do texto, sem introduzir uma identificação doutrinária adicional.
- issue: Variação entre “discernimento” e “sabedoria”
  choice: discernimento
  alternative: sabedoria
  rationale: O hebraico primário traz תְבוּנָה, “discernimento/entendimento”, enquanto o paralelo grego traz σοφίας, “sabedoria”. A leitura hebraica é mantida no texto, e a variante grega é documentada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo claro entre “pão do entendimento” e “água do discernimento”. O pronome feminino preserva a personificação da Sabedoria indicada pela morfologia hebraica e pelo contexto.
