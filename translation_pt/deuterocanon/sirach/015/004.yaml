base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: pt
  text: Ele se apoiará nela[a] e não vacilará[b]; confiará nela e não será envergonhado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a Sabedoria, personificada como mulher no contexto.
    reason: cross_reference
  - marker: b
    text: Ou «não cambaleará»; também pode significar «não será abalado».
    reason: lexical_alternative
  - marker: c
    text: Ou «não se envergonhará». A expressão também pode indicar que sua confiança não será frustrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  choice: Ele se apoiará nela
  rationale: Preserva a imagem concreta de שׁען, «apoiar-se», e ao mesmo tempo comunica dependência e confiança. O pronome feminino retoma a Sabedoria personificada.
- source_word: וְלֹא יִמּוֹט
  choice: e não vacilará
  rationale: מוֹט descreve perder a estabilidade, cambalear ou ser abalado. «Não vacilará» é natural em português e mantém tanto a imagem física quanto o sentido figurado.
- source_word: וּבָהּ יִבְטַח
  choice: confiará nela
  rationale: בטח expressa confiança e segurança. A formulação é direta e conserva o pronome feminino do hebraico.
- source_word: וְלֹא יֵבוֹשׁ
  choice: e não será envergonhado
  rationale: בוש pode indicar sofrer vergonha ou ver frustrada a própria confiança. A forma passiva preserva a dimensão pública do termo e concorda com o paralelo grego καταισχυνθῇ.
theological_decisions:
- issue: Referente e gênero dos pronomes femininos
  choice: Manter «nela», referindo-se à Sabedoria personificada como mulher.
  alternative: Empregar uma formulação impessoal ou substituir o pronome por «nisso».
  rationale: Os sufixos hebraicos são femininos, e o contexto imediato personifica a Sabedoria como mulher. Manter essa linguagem conserva a imagem literária e teológica da fonte sem acrescentar interpretação denominacional.
- issue: Sentido de vergonha decorrente de confiança frustrada
  choice: Traduzir por «não será envergonhado».
  alternative: «não ficará decepcionado» ou «não se envergonhará».
  rationale: A escolha mantém aberta a tensão entre vergonha pública, constrangimento pessoal e frustração da esperança; a nota registra a amplitude sem reduzi-la a apenas um desses sentidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das notas foi ajustada para que cada marcador apareça junto à expressão que explica.
