base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: pt
  text: Se você quiser, guardará o mandamento,[a] e ter entendimento é fazer a vontade dele.[b] Se confiar nele,[c] você também viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “mandamento” no singular; o paralelo grego traz “mandamentos” no plural.
    reason: textual_variant
  - marker: b
    text: 'A construção hebraica desta oração é difícil. Outra tradução possível é: “e o entendimento serve para fazer a vontade dele”. O paralelo grego diverge e pode ser traduzido: “e praticar a fidelidade depende da boa vontade”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “Se crer nele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: Se você quiser
  rationale: חפץ expressa desejo ou disposição voluntária. “Quiser” é natural em português e mantém a força volitiva da condição sem transformá-la numa afirmação filosófica sobre capacidade autônoma.
- source_word: תִּשְׁמֹר מִצְוָה
  choice: guardará o mandamento
  rationale: O hebraico traz מִצְוָה no singular. “Guardar” conserva o sentido bíblico, ainda compreensível, de observar e cumprir; o artigo permite que o singular tenha alcance representativo ou coletivo.
- source_word: וְתָבִינָה לַעֲשׂוֹת רְצוֹנוֹ
  choice: e ter entendimento é fazer a vontade dele
  rationale: תבינה é lido no texto vocalizado como “entendimento”, enquanto לַעֲשׂוֹת רְצוֹנוֹ significa literalmente “fazer a vontade dele”. A formulação portuguesa conserva esses elementos e entende a frase nominal como uma identificação, mas registra em nota a dificuldade sintática e a leitura divergente do grego.
- source_word: אִם תַּאֲמִין בּוֹ
  choice: Se confiar nele
  rationale: אמן com ב pode indicar crer ou depositar confiança em alguém. “Confiar nele” comunica de modo natural a dimensão relacional, sem excluir o sentido de crer.
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: você também viverá
  rationale: “Também” representa גַּם e preserva a ênfase inclusiva em אַתָּה; “viverá” traduz diretamente תִּחְיֶה.
theological_decisions:
- issue: Tensão textual e sintática na oração intermediária
  choice: e ter entendimento é fazer a vontade dele
  alternative: e agir com fidelidade depende da sua boa vontade
  rationale: O texto hebraico existente é mantido como testemunho principal e sua referência explícita à “vontade dele” não é substituída pela leitura interpretativa do grego. Como a sintaxe hebraica é difícil e o paralelo grego diverge, a incerteza é declarada em nota, em vez de ser resolvida silenciosamente.
- issue: Vontade humana e obediência
  choice: Se você quiser, guardará o mandamento
  alternative: Se você escolher, poderá guardar os mandamentos
  rationale: A tradução preserva a estrutura condicional e volitiva do hebraico, mas não acrescenta “poderá”, que converteria o verso numa afirmação mais explícita sobre capacidade humana do que a fonte faz.
- issue: Crer ou confiar
  choice: Se confiar nele
  alternative: Se crer nele
  rationale: Ambas as opções cabem no verbo hebraico. “Confiar” realça naturalmente a relação com o referente masculino sem impor uma definição doutrinária de fé; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “Guardar o mandamento” mantém uma expressão bíblica ainda transparente; o restante evita arcaísmos. Os pronomes “você” e “dele” tornam a relação sintática clara sem identificar além do que o verso explicita.
