base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/008.yaml
  text: She is far from scoffers[a], and men of falsehood will not remember her.
translation:
  language: pt
  text: Ela está longe dos zombadores[a], e os homens mentirosos não se lembrarão dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Ela está longe da soberba, e os homens mentirosos certamente não se lembrarão dela”. O hebraico traz “zombadores” onde o grego tem “soberba”, talvez por refletir um texto hebraico diferente ou uma tradução interpretativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא
  choice: Ela está longe
  rationale: Preserva a imagem hebraica de distância e o pronome feminino que retoma a Sabedoria personificada no contexto.
- source_word: מִלֵּצִים
  choice: dos zombadores
  rationale: לֵצִים designa os que zombam com atitude arrogante ou desdenhosa. “Zombadores” é corrente e mantém o sentido moral do vocabulário sapiencial.
- source_word: וְאַנְשֵׁי כָזָב
  choice: e os homens de falsidade
  rationale: Reproduz de perto o idioma hebraico, literalmente “homens de falsidade”, sem reduzi-lo apenas ao ato de contar mentiras; o masculino plural é mantido.
- source_word: לֹא יִזְכְּרוּהָ
  choice: não se lembrarão dela
  rationale: Traduz diretamente o verbo זכר no sentido de lembrar ou trazer à memória; o paralelo grego confirma esse sentido.
theological_decisions:
- issue: Referente e personificação do pronome feminino
  choice: “Ela/dela”, entendendo que o versículo continua a personificação da Sabedoria.
  alternative: “Isso/disso”, tratando a sabedoria como qualidade abstrata.
  rationale: O contexto imediato personifica a Sabedoria em termos femininos. A tradução mantém essa textura literária e teológica sem acrescentar uma interpretação alheia ao texto.
- issue: Diferença entre o hebraico e o paralelo grego
  choice: Seguir o hebraico “zombadores” no texto principal.
  alternative: Seguir o grego, que traz “orgulho” ou “soberba”.
  rationale: A fonte hebraica de alta confiança nomeia pessoas zombadoras, enquanto o grego apresenta o substantivo abstrato “orgulho/soberba”. A diferença genuína é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a personificação feminina da Sabedoria e mantém o paralelismo conciso do hebraico.
