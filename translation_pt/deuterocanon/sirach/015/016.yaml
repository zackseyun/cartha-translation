  text: Fire and water are set before you; whichever you choose[a], stretch out your hand to it.
translation:
  language: pt
  text: O fogo e a água estão postos diante de você[a]; estenda a mão para aquilo que desejar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz aqui uma forma incomum (מוּצָק); o sentido de “estão postos diante de você” é apoiado pelo grego paralelo: “pôs diante de você”.'
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק
  choice: estão postos
  rationale: Embora a forma hebraica seja incomum neste testemunho, o contexto com לְפָנֶיךָ e o paralelo grego παρέθηκέν σοι indicam que as opções são colocadas ou apresentadas diante da pessoa.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Expressão espacial direta e natural em português, adequada também ao contexto figurado de uma escolha moral.
- source_word: אֵשׁ וָמָיִם
  choice: o fogo e a água
  rationale: Mantém literalmente as imagens concretas e opostas do hebraico, confirmadas pelo paralelo grego.
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: para o que quiser
  rationale: חפץ expressa vontade ou desejo. A formulação portuguesa preserva a liberdade entre as alternativas sem explicar além do texto.
- source_word: שְׁלַח יָדֶיךָ
  choice: estenda a mão
  rationale: Reproduz naturalmente o gesto idiomático de alcançar uma das opções. O singular coletivo é idiomático em português e encontra apoio no grego χεῖρά σου.
theological_decisions:
- issue: A atuação moral humana enfatizada no versículo
  choice: Apresentar as alternativas como uma escolha real e conservar o imperativo dirigido ao leitor.
  alternative: Adotar uma formulação determinista que atenue a força da escolha ou do imperativo.
  rationale: Tanto o hebraico quanto o grego colocam alternativas diante da pessoa e a exortam a estender a mão. A tradução mantém essa linguagem sem acrescentar qualificações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem da primeira oração foi ajustada ao uso corrente, sem perder o paralelismo nem as imagens concretas do original.
