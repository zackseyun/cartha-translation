translation:
  language: pt
  text: Pela boca do sábio se proclama o louvor[a], e quem o domina o ensinará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois o louvor será proferido com sabedoria, e o Senhor lhe dará bom êxito”, diferindo especialmente no segundo membro do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה
  choice: Pela boca
  rationale: A preposição בְּ pode indicar instrumento ou esfera. “Pela boca” preserva a imagem hebraica e soa natural em português.
- source_word: חָכָם
  choice: do sábio
  rationale: O singular tem valor genérico e representativo; “do sábio” conserva essa forma sem acrescentar especificações.
- source_word: תֵּאָמֵר
  choice: se proclama
  rationale: O imperfeito nifal pode expressar uma verdade geral em estilo proverbial. “Se proclama” comunica fala pública e mantém a voz passiva/impessoal de modo idiomático.
- source_word: תְּהִלָּה
  choice: o louvor
  rationale: “Louvor” é o sentido mais direto neste contexto, também apoiado pelo grego αἶνος. O hebraico não explicita o destinatário do louvor.
- source_word: וּמשֵׁל בָּהּ
  choice: e quem o domina
  rationale: משל expressa governo ou domínio, e o sufixo feminino de בָּהּ remete provavelmente a תְּהִלָּה. “Quem o domina” preserva a noção de domínio, embora o antecedente exato permaneça algo condensado no hebraico.
- source_word: יִלַמְּדֶנָּה
  choice: o ensinará
  rationale: O verbo למד significa “ensinar”, e o sufixo feminino retoma provavelmente “louvor”. O futuro conserva o valor verbal do imperfeito hebraico e a estrutura do segundo membro.
theological_decisions:
- issue: Relação entre o segundo membro hebraico e o paralelo grego
  choice: 'Seguir o hebraico preservado: “e quem o domina o ensinará”.'
  alternative: 'O grego traz: “e o Senhor lhe dará bom êxito”.'
  rationale: Como há texto hebraico preservado, de alta confiança e validado, ele orienta o texto principal. A divergência substancial do grego é registrada em nota, sem harmonização nem preferência doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo proverbial e a concisão do hebraico. O pronome masculino em “o domina/o ensinará” decorre do gênero de “louvor” em português; no hebraico, os sufixos são femininos e provavelmente retomam תְּהִלָּה.
