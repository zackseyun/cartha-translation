base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/013.yaml
  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: pt
  text: Javé odeia o mal e a abominação[a] e não permitirá que isso aconteça aos que o temem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “e ela não é amada/aceita pelos que o temem”. O testemunho hebraico, porém, diz: “e ele não permitirá que isso aconteça aos que o temem”.'
    reason: Leitura alternativa no paralelo grego.
lexical_decisions:
- source_word: רָעָה
  choice: o mal
  rationale: No paralelismo com תוֹעֵבָה, designa o mal moral, não calamidade. A formulação é natural e mantém a amplitude do termo hebraico.
- source_word: תּוֹעֵבָה
  choice: a abominação
  rationale: Preserva a força do termo para algo moral ou ritualmente detestável; o paralelo grego βδέλυγμα confirma esse sentido forte.
- source_word: שָׂנֵא
  choice: odeia
  rationale: O presente exprime naturalmente em português uma verdade geral, de acordo com a força gnômica do hebraico.
- source_word: יְהֹוָה
  choice: Javé
  rationale: Representa em português o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא יְאַנֶּנָּה
  choice: e não permitirá que isso aconteça
  rationale: Segue o testemunho hebraico, que apresenta a ideia verbal de não permitir ou ocasionar isso. “Isso” retoma conjuntamente o mal e a abominação sem forçar uma concordância nominal artificial em português.
- source_word: לִירֵאָיו
  choice: aos que o temem
  rationale: Expressão bíblica clara e corrente para os que reverenciam a Deus, sem reduzir o temor a mero terror.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego no segundo membro do versículo
  choice: 'Seguir no texto principal o hebraico: “e não permitirá que isso aconteça aos que o temem”'
  alternative: 'Seguir o grego: “e ela não é amada/aceita pelos que o temem”'
  rationale: Como o testemunho hebraico está preservado e é considerado de alta confiança, ele tem prioridade no texto principal. A leitura substancialmente diferente do grego é registrada em nota para manter transparência textual sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “que isso aconteça” evita a construção pouco natural “permiti-la aos que” e conserva a referência abrangente do sufixo hebraico ao mal e à abominação.
