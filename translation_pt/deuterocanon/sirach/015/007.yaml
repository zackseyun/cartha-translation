base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/007.yaml
  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: pt
  text: Os homens de falsidade[a] não a alcançarão[b], e os homens insolentes não a verão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “homens de falsidade”. O paralelo grego traz “pessoas insensatas”, talvez por refletir outro texto hebraico ou por oferecer uma tradução interpretativa.'
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico, se entendido de modo estritamente literal, significaria “não a guiarão”, expressão difícil neste contexto. O paralelo grego favorece o sentido de “alcançar” ou “apreender”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: não a alcançarão
  rationale: Embora o hifil de דרך normalmente tenha o sentido de “conduzir” ou “guiar”, esse sentido é difícil aqui, pois o objeto é a Sabedoria e o segundo membro fala de não a ver. O paralelo grego καταλήμψονται favorece a ideia de alcançar, apreender ou obter. “Alcançar” é natural em português e mantém a ideia de que tais pessoas não chegam à Sabedoria.
- source_word: מְתֵי שָׁוְא
  choice: homens da falsidade
  rationale: A expressão hebraica é uma construção que significa literalmente “homens de falsidade”. שָׁוְא pode indicar falsidade, vazio ou inutilidade. “Homens da falsidade” conserva o caráter expressivo do hebraico e o contraste moral do versículo, sem adotar a leitura interpretativa do grego.
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: homens insolentes
  rationale: זָדוֹן designa orgulho, insolência ou presunção rebelde. “Homens insolentes” comunica essa disposição moral com clareza e evita generalizá-la simplesmente como “maus” ou “pecadores”.
- source_word: לֹא יִרְאוּהָ
  choice: não a verão
  rationale: ראה significa diretamente “ver”. Embora no contexto possa também sugerir perceber ou reconhecer a Sabedoria, o sentido básico é claro e é confirmado pelo grego ἴδωσιν.
theological_decisions:
- issue: Relação entre o testemunho hebraico e o paralelo grego no primeiro membro
  choice: Manter o sujeito conforme o hebraico e traduzir o verbo difícil à luz do grego como “alcançar”.
  alternative: “Os insensatos jamais a apreenderão” ou, de modo literal e obscuro, “Os homens da falsidade não a guiarão”.
  rationale: O hebraico sobrevivente é o testemunho principal, mas o paralelo grego constitui evidência textual relevante. Assim, preserva-se “homens da falsidade” do hebraico, enquanto o grego ajuda a esclarecer que o verbo descreve a incapacidade de alcançar a Sabedoria, não o ato de guiá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “homens da falsidade” é deliberadamente mais formal para conservar a construção e a ambiguidade semântica do hebraico; “não a alcançarão” oferece clareza idiomática com apoio do paralelo grego.
