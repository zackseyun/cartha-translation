base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/019.yaml
  text: The eyes of God see his works[b][a], and he knows every deed of a man.
translation:
  language: pt
  text: Os olhos de Deus veem as obras dele[b], e ele reconhece cada feito de um homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada feito de uma pessoa”. O hebraico traz “homem” (אִישׁ), forma masculina singular que muitas vezes tem sentido genérico na literatura sapiencial.
    reason: lexical_alternative
  - marker: b
    text: 'O grego apresenta uma leitura diferente na primeira oração: “os olhos dele estão sobre os que o temem”. O hebraico também pode ser entendido como “os olhos de Deus veem suas obras”, com “suas” referindo-se a Deus, embora o paralelismo favoreça a referência às obras humanas.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: Os olhos de Deus
  rationale: Preserva a imagem antropomórfica concreta do hebraico e traduz אֵל naturalmente como “Deus”, sem introduzir um nome divino ausente no texto.
- source_word: יִרְאוּ
  choice: veem
  rationale: Reproduz de modo direto e atual o sentido simples de ver.
- source_word: מַעֲשָׂיו
  choice: as obras dele
  rationale: Mantém o sufixo masculino singular do hebraico, cujo referente mais natural é o homem mencionado no segundo membro. “Dele” evita que, em português, “suas” pareça referir-se a Deus.
- source_word: יַכִּיר
  choice: reconhece
  rationale: Conserva a nuance de הכיר como reconhecer ou discernir plenamente, em vez de reduzi-la simplesmente a “saber”.
- source_word: כָּל מִפְעַל
  choice: cada feito
  rationale: “Cada” é natural diante do singular e “feito” comunica aquilo que uma pessoa pratica, mantendo alguma distinção lexical em relação a מַעֲשָׂיו.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva a forma masculina singular do hebraico e seu emprego representativo típico da literatura sapiencial.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção divina
  choice: Manter literalmente “Os olhos de Deus”.
  alternative: “Deus vê”
  rationale: A imagem concreta pertence à expressão poética hebraica e não precisa ser transformada em abstração.
- issue: Possível referente do sufixo em מַעֲשָׂיו
  choice: Entender “dele” como referente ao ser humano mencionado no segundo membro.
  alternative: Entender como “as obras de Deus”.
  rationale: A correspondência com “cada feito de um homem” favorece a referência humana, mas a forma hebraica isolada permite ambiguidade; a nota explicita isso sem alterar silenciosamente o texto.
- issue: Masculino genérico em אִישׁ
  choice: Traduzir por “um homem” no texto principal.
  alternative: “uma pessoa”
  rationale: Mantém a forma masculina singular da fonte, enquanto a nota registra a aplicação genérica possível.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de pronomes foi controlada para deixar claros os referentes: “dele” aponta para o homem, enquanto “ele” retoma Deus. Os marcadores aparecem junto aos trechos a que se referem.'
