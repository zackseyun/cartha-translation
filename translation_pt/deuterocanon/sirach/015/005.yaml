  yaml_path: translation/deuterocanon/sirach/015/005.yaml
  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: pt
  text: Ela o exaltará acima de seus companheiros[a] e, no meio da assembleia, lhe abrirá a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acima de seu companheiro”. O hebraico emprega uma forma singular, mas o paralelo grego apresenta um sentido plural mais amplo (“seus próximos/companheiros”), provavelmente pretendido aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: Ela o exaltará
  rationale: O verbo רומם expressa elevar ou exaltar, tanto em posição quanto em honra. A forma verbal feminina aponta para a Sabedoria como sujeito no contexto, e o sufixo indica o homem como objeto.
- source_word: מֵרֵעֵהוּ
  choice: acima de seus companheiros
  rationale: Embora רֵעַ apareça formalmente no singular, pode ter valor coletivo. O paralelo grego usa o plural τοὺς πλησίον αὐτοῦ, apoiando o sentido social mais amplo de companheiros ou pessoas próximas.
- source_word: וּבְתוֹךְ קָהָל
  choice: no meio da assembleia
  rationale: Mantém a expressão locativa concreta e traduz קָהָל de modo neutro, como um corpo reunido publicamente, sem restringi-lo a um contexto eclesiástico.
- source_word: תִּפְתַּח פִּיו
  choice: lhe abrirá a boca
  rationale: Preserva a imagem concreta do hebraico, também refletida no grego, e comunica que a Sabedoria lhe concede capacidade ou oportunidade para falar publicamente.
theological_decisions:
- issue: Identidade do sujeito dos verbos
  choice: O pronome feminino “Ela” retoma a Sabedoria no contexto imediato.
  alternative: Deixar o sujeito oculto ou entendê-lo genericamente como Deus.
  rationale: As duas formas verbais hebraicas estão no feminino singular, e o contexto anterior apresenta a Sabedoria como agente. A tradução explicita apenas o gênero já marcado pelo hebraico, sem identificar a Sabedoria com outra figura teológica.
- issue: Sentido de “abrir a boca”
  choice: Manter a expressão concreta “lhe abrirá a boca”.
  alternative: Parafrasear como “o fará falar” ou “lhe dará eloquência”.
  rationale: A expressão pode envolver fala autorizada, capacidade de expressão ou oportunidade de falar. Mantê-la preserva essa amplitude sem fixar uma interpretação teológica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Assembleia” evita uma leitura exclusivamente eclesiástica; “lhe abrirá a boca” conserva o idiomatismo bíblico sem soar excessivamente arcaico.
