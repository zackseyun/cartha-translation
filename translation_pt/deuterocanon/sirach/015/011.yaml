  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: pt
  text: 'Não diga[a]: “Minha transgressão vem de Deus”, pois ele não fez aquilo que odeia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não diga: ‘Foi por causa do Senhor que me afastei’, pois você não fará o que ele odiou”. O grego reflete uma redação relacionada, mas não idêntica à do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz de modo direto e natural a proibição hebraica, em linguagem moderna e amplamente compreensível.
- source_word: מֵאֵל
  choice: vem de Deus
  rationale: A preposição מִן indica mais naturalmente fonte ou origem neste contexto. A formulação nega que Deus seja a origem da transgressão humana.
- source_word: פִּשְׁעִי
  choice: minha transgressão
  rationale: פשע pode denotar transgressão ou rebeldia deliberada. “Transgressão” preserva a gravidade moral sem restringir o sentido a uma rebelião política.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição e mantém a cadência concisa própria da literatura sapiencial.
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: o que odeia
  rationale: Tradução idiomática da construção relativa; o sujeito implícito de “odeia” é Deus, mencionado na oração anterior.
- source_word: לֹא עָשָׂה
  choice: não fez
  rationale: Mantém o valor formal do perfeito hebraico e a afirmação incisiva do texto, sem substituir a leitura hebraica pelo futuro presente no paralelo grego.
theological_decisions:
- issue: Se o versículo nega que Deus seja a fonte da transgressão ou apenas a ocasião dela
  choice: “Minha transgressão vem de Deus”, negando que a transgressão tenha origem em Deus
  alternative: “Foi por causa do Senhor que me afastei” / “Por meio do Senhor me desviei”
  rationale: O testemunho hebraico primário, מֵאֵל פִּשְׁעִי, aponta mais naturalmente para fonte ou origem. O paralelo grego apresenta uma formulação relacionada, mas não idêntica, preservada em nota.
- issue: A intensidade moral de פשע
  choice: transgressão
  alternative: rebeldia; pecado
  rationale: “Transgressão” comunica culpa e violação deliberada sem impor uma nuance exclusivamente política nem generalizar o termo como simples “pecado”.
- issue: A diferença de sujeito e aspecto entre o hebraico e o paralelo grego na segunda oração
  choice: “ele não fez o que odeia”, seguindo o hebraico
  alternative: “você não fará o que ele odiou”, conforme o grego
  rationale: O hebraico de alta confiança tem sujeito divino na terceira pessoa e verbo perfeito. A leitura grega, com segunda pessoa e futuro, é relevante, mas não deve substituir silenciosamente o testemunho hebraico principal.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. A forma de tratamento “não diga” evita arcaísmo; “vem de Deus” expressa com naturalidade a ideia hebraica de origem. A nota preserva a variante grega sem diluir a prioridade do testemunho hebraico.
