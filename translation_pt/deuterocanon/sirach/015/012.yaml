  text: Do not say[b][a], “He made me stumble,” for he has no need of violent men.
translation:
  language: pt
  text: 'Não diga: “Ele me fez tropeçar”[a], pois não precisa de homens violentos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “Ele me desviou”, expressão de sentido mais amplo que o hebraico “me fez tropeçar”.
    reason: alternative_reading
  - marker: b
    text: O paralelo grego traz “homem pecador”, enquanto o hebraico diz “homens violentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: Não diga
  rationale: Neste contexto de instrução sapiencial, פֶּן seguido do imperfeito expressa uma advertência ou proibição. “Não diga” transmite isso de modo direto e natural em português.
- source_word: הוּא
  choice: Ele
  rationale: O pronome retoma Deus no contexto. A tradução mantém o pronome sem acrescentar uma forma enfática além da necessária.
- source_word: הִתְקִילָנִי
  choice: me fez tropeçar
  rationale: Preserva a metáfora concreta do hebraico, segundo a qual alguém causa um tropeço, sem substituí-la pela formulação mais ampla do paralelo grego.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira natural a razão que fundamenta a proibição anterior.
- source_word: אֵין צֹרֶךְ
  choice: não precisa
  rationale: Expressa de forma corrente e concisa a ideia hebraica de “não ter necessidade”.
- source_word: בְּאַנְשֵׁי חָמָס
  choice: de homens violentos
  rationale: חָמָס designa violência ou injustiça violenta; “homens violentos” conserva a especificidade e o plural masculino do texto hebraico.
theological_decisions:
- issue: Como descrever aquilo que não deve ser atribuído a Deus
  choice: Ele me fez tropeçar
  alternative: Ele me desviou
  rationale: O hebraico sobrevivente, de alta confiança, usa a imagem concreta de causar tropeço. O grego apresenta a noção mais ampla de desviar; essa variante é preservada em nota sem substituir o hebraico no texto principal.
- issue: Se חָמָס deve ser traduzido pela categoria específica de violência ou generalizado sob influência do grego
  choice: homens violentos
  alternative: homem pecador / pecadores
  rationale: O hebraico traz uma categoria moral mais específica que o grego ἀνδρὸς ἁμαρτωλοῦ. A tradução principal segue o hebraico, enquanto a diferença textual é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com construção sapiencial concisa. O pronome divino permanece sem capitalização especial, e as variantes gregas relevantes são registradas sem suplantar o testemunho hebraico.
