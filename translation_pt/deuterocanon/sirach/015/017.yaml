  text: Before human beings are life and death[b][a], and whichever he chooses will be given to him.
translation:
  language: pt
  text: Diante dos seres humanos estão a vida e a morte[a]; aquilo que cada um desejar lhe será dado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aos seres humanos cabem a vida e a morte”; a preposição hebraica admite esse sentido, mas o paralelo grego favorece “diante dos seres humanos”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e o que cada um escolher lhe será dado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: Diante dos seres humanos
  rationale: Embora a preposição hebraica possa significar “aos/para os”, o paralelo grego ἔναντι favorece a imagem de vida e morte postas diante das pessoas. “Seres humanos” traduz naturalmente a expressão coletiva sem restringi-la ao sexo masculino.
- source_word: חַיִּים וָמָוֶת
  choice: a vida e a morte
  rationale: Tradução direta das duas alternativas; o plural hebraico חַיִּים corresponde idiomaticamente ao singular português “vida”.
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: aquilo que cada um desejar
  rationale: חפץ expressa desejo, agrado ou vontade. “Desejar” conserva essa nuance volitiva sem reduzir o verbo simplesmente a uma decisão racional; “cada um” torna natural em português a passagem do coletivo para o indivíduo.
- source_word: יִנָּתֵן לוֹ
  choice: lhe será dado
  rationale: Mantém a voz passiva do hebraico e não identifica um agente que o versículo deixa implícito.
theological_decisions:
- issue: Agência moral humana diante da vida e da morte
  choice: Apresentar as alternativas e afirmar que aquilo que cada pessoa desejar lhe será dado, sem explicar a relação entre escolha humana e soberania divina.
  alternative: Enfatizar uma liberdade humana autônoma ou, no sentido oposto, explicitar que Deus determina a escolha.
  rationale: O hebraico apresenta uma estrutura de escolha, mas mantém a formulação passiva e não resolve debates teológicos mais amplos.
- issue: Expressão coletiva seguida de referência individual
  choice: Traduzir לִבְנֵי אָדָם por “seres humanos” e representar o singular subsequente por “cada um ... lhe”.
  alternative: Empregar “homens ... ele” ou pluralizar toda a segunda oração.
  rationale: A formulação escolhida preserva a humanidade coletiva da primeira expressão e o foco individual dos verbos e pronomes seguintes, em português natural e inclusivo sem apagar a mudança gramatical.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. “Diante de” preserva a imagem contextual de alternativas apresentadas; “aquilo que cada um desejar” mantém o valor de חפץ e evita o uso pouco natural do masculino genérico “ele”.
