base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: pt
  text: No dia bom, a desgraça é esquecida; no dia ruim, a prosperidade é esquecida; e o fim de uma pessoa estará sobre ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “estará sobre ela”. A expressão pode indicar que o desfecho final confronta a pessoa ou sobrevém a ela. O texto grego paralelo difere substancialmente do hebraico preservado e não esclarece esta cláusula.
    reason: A cláusula hebraica é idiomática e ambígua, e a tradição grega divergente não permite precisar seu sentido.
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: No dia bom
  rationale: Conserva a expressão hebraica concisa e apresenta o primeiro membro como uma circunstância favorável, em paralelo com רָע יוֹם.
- source_word: תִּשָּכַח רָעָה
  choice: a desgraça é esquecida
  rationale: Mantém a forma passiva do hebraico. Neste contraste, רָעָה indica infortúnio ou adversidade, não necessariamente mal moral.
- source_word: וְרָע יוֹם
  choice: no dia ruim
  rationale: Reproduz de modo simples e natural a antítese com o dia bom, sem moralizar indevidamente a expressão.
- source_word: תִּשָׁכַח טוֹבָה
  choice: a prosperidade é esquecida
  rationale: טוֹבָה designa aqui o bem experimentado, a boa condição ou fortuna; “prosperidade” comunica o contraste com a desgraça.
- source_word: וְאַחֲרִית אָדָם
  choice: e o fim de uma pessoa
  rationale: אַחֲרִית pode indicar fim, desfecho ou resultado final. “Pessoa” expressa naturalmente o sentido humano genérico de אָדָם em português.
- source_word: תִּהְיֶה עָלָיו
  choice: estará sobre ela
  rationale: Segue de perto a formulação literalmente ambígua do hebraico, evitando decidir se o desfecho confronta, sobrevém ou recai sobre a pessoa.
theological_decisions:
- issue: Sentido da cláusula final
  choice: e o fim de uma pessoa estará sobre ela
  alternative: e o desfecho de uma pessoa virá sobre ela
  rationale: A redação conserva a tensão e a ambiguidade de עָלָיו. Uma formulação como “virá sobre” explicaria de modo mais fluente, mas determinaria que o fim sobrevém à pessoa.
- issue: Valor genérico de אָדָם
  choice: uma pessoa
  alternative: um homem
  rationale: Neste contexto, אָדָם é um singular genérico referente ao ser humano, sem contraste entre homens e mulheres. “Pessoa” transmite esse alcance com naturalidade em português.
translation_notes:
  register: Português moderno, sóbrio e amplamente compreensível, com paralelismo conciso. A passiva “é esquecida” acompanha o hebraico; a formulação menos idiomática da última cláusula foi mantida para não apagar sua ambiguidade e é explicada em nota.
