base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/034.yaml
  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: pt
  text: Mantenha muitos fora de sua casa[a] e não deixe qualquer homem entrar nela, pois muitos ficam à espreita[b], e também muitos são enganadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico é a base do texto aqui, mas o paralelo grego traz algo como: “Hospede um estranho, e ele lhe causará perturbações e o afastará do que lhe pertence.” Isso provavelmente reflete uma forma textual diferente ou uma ampliação da advertência.'
    reason: alternative_reading
  - marker: b
    text: Na edição citada, parte do texto hebraico deste versículo aparece entre colchetes, indicando reconstrução ou incerteza na tradição manuscrita preservada.
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: Mantenha muitos fora de sua casa
  rationale: O imperativo pede que se negue acesso a muitos; a formulação é natural em português e conserva tanto a quantidade indefinida quanto o cenário doméstico.
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: e não leve qualquer homem para dentro dela
  rationale: A expressão adverte contra admitir pessoas indiscriminadamente. “Qualquer homem” mantém o substantivo masculino אִישׁ e expressa com naturalidade o sentido distributivo de לֹא כָל.
- source_word: אוֹרְבִים
  choice: ficam à espreita
  rationale: Preserva a imagem participial de pessoas que aguardam ocultamente uma ocasião para causar dano, sem restringir o termo a uma emboscada física.
- source_word: נוֹכְלִים
  choice: enganadores
  rationale: Designa pessoas ardilosas ou fraudulentas; “enganadores” conserva a amplitude sem especificar um tipo particular de fraude.
- source_word: וְכֵן
  choice: e
  rationale: No paralelismo português, a conjunção simples liga com clareza a segunda categoria à primeira; traduzir de modo mais explícito como “e também” seria possível, mas tornaria a frase menos fluente.
- source_word: ἐνοίκισον ἀλλότριον ...
  choice: registrado em nota como leitura alternativa
  rationale: O grego apresenta uma forma textual substancialmente diferente, centrada em hospedar um estranho e nas consequências disso; por isso, não foi incorporado ao texto hebraico principal.
