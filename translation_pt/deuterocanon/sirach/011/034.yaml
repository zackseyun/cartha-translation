  source_fidelity: O texto segue o hebraico como fonte principal e preserva a advertência sobre restringir a entrada em casa, pessoas à espreita e enganadores. Contudo, “não leve qualquer homem para dentro dela” pode sugerir transportar alguém, em vez de admitir alguém em casa. A ligação וְכֵן é melhor expressa por “também”.
  naturalness: A revisão torna a segunda advertência idiomática em português moderno. Também melhora levemente a redação da nota sobre o paralelo grego.
  terminology: “Homem” preserva o masculino singular de אִישׁ; “à espreita” traduz bem אוֹרְבִים; e “enganadores” é uma equivalência adequada para נוֹכְלִים. “Também” preserva explicitamente a força conectiva de וְכֵן.
  issues:
