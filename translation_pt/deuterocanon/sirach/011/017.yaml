  text: Good and evil[a], life and death[c][b], poverty and wealth—they are from him.
translation:
  language: pt
  text: O bem e o mal[a], a vida e a morte[b], a pobreza e a riqueza — vêm dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a adversidade”, “a calamidade” ou “o dano”. O hebraico רַע pode designar tanto o mal em sentido amplo quanto uma desgraça sofrida.
    reason: lexical_alternative
  - marker: b
    text: 'A tradição grega preservada para Sirácida 11:17 traz um texto muito diferente: “A dádiva do Senhor permanece com os piedosos, e seu favor prosperará para sempre.” As testemunhas hebraica e grega não correspondem de perto neste versículo.'
    reason: textual_variant
  - marker: c
    text: 'Hebraico: “dele”. Pelo contexto, o referente provavelmente é Deus, mas o nome ou título divino não aparece nesta linha.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: o bem
  rationale: Preserva o sentido amplo e substantivado do hebraico no primeiro par de opostos, sem restringi-lo à prosperidade.
- source_word: וְרַע
  choice: e o mal
  rationale: Mantém o termo abrangente em antítese com “o bem”; o hebraico também pode indicar dano, calamidade ou adversidade, possibilidade registrada em nota.
- source_word: חַיִּים
  choice: a vida
  rationale: É a forma portuguesa natural para o substantivo hebraico no par tradicional vida–morte.
- source_word: וָמָוֶת
  choice: e a morte
  rationale: Tradução direta que conserva a oposição com “a vida”.
- source_word: רֵישׁ
  choice: a pobreza
  rationale: Expressa de modo atual e claro o estado de privação indicado pelo hebraico e forma um contraste natural com “riqueza”.
- source_word: וְעֹשֶׁר
  choice: e a riqueza
  rationale: Equivalente moderno e abrangente, adequado ao contraste socioeconômico com “pobreza”.
- source_word: מֵיי הוּא
  choice: vêm dele
  rationale: Preserva o pronome masculino singular sem inserir um título divino ausente nesta linha; “vêm” comunica naturalmente a ideia de procedência aplicada à enumeração.
theological_decisions:
- issue: Referente do pronome final
  choice: dele
  alternative: do Senhor / de Deus
  rationale: Embora o contexto provavelmente aponte para Deus, a linha hebraica termina com um pronome, sem mencionar expressamente o nome ou título divino. A tradução mantém essa formulação e explica a provável referência em nota.
- issue: Alcance de רַע em relação à procedência divina
  choice: mal
  alternative: adversidade / calamidade / dano
  rationale: O vocábulo hebraico é semanticamente amplo. “Mal” conserva essa amplitude e a tensão teológica da afirmação, enquanto a nota informa os sentidos ligados à experiência de calamidade sem impô-los ao texto principal.
- issue: Divergência entre as testemunhas hebraica e grega
  choice: seguir o texto hebraico fornecido
  alternative: A dádiva do Senhor permanece com os piedosos, e seu favor prosperará para sempre
  rationale: A testemunha grega atribuída a este versículo apresenta conteúdo substancialmente diferente. Dada a alta confiança indicada para a fonte hebraica e a prioridade do original apresentado, o texto principal traduz o hebraico e registra a variante em nota.
translation_notes:
  register: Português moderno, claro e digno, com artigos definidos para tornar naturais os pares substantivados. O travessão destaca a conclusão sem alterar a estrutura concisa do dito sapiencial. A ordem dos marcadores segue sua ocorrência no texto.
