  text: For it is easy in the eyes of the Lord[a], in a sudden moment, to make a poor man rich.
translation:
  language: pt
  text: Pois é fácil aos olhos do Senhor[a], num súbito instante, tornar rico um pobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: «Pois é fácil diante do Senhor, no dia da morte, retribuir a uma pessoa segundo os seus caminhos». O grego reflete uma forma do versículo substancialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח
  choice: fácil
  rationale: No contexto de בְּעֵינֵי יי, e com o apoio do grego κοῦφον, indica que a ação não oferece dificuldade ao Senhor.
- source_word: בְּעֵינֵי יי
  choice: aos olhos do Senhor
  rationale: Preserva a expressão idiomática hebraica em português natural e verte reverentemente o nome divino.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: num súbito instante
  rationale: A formulação compacta conserva tanto a ideia temporal quanto a ênfase na rapidez expressa pela duplicação hebraica.
- source_word: לְהַעֲשִׁיר
  choice: tornar rico
  rationale: Expressa de modo transparente o valor causativo da forma hifil.
- source_word: דָּל
  choice: um pobre
  rationale: Representa o referente pessoal singular e indigente sem acrescentar uma especificação de sexo desnecessária em português.
- source_word: ἐν ἡμέρᾳ τελευτῆς ἀποδοῦναι ἀνθρώπῳ κατὰ τὰς ὁδοὺς αὐτοῦ
  choice: não adotado no texto principal
  rationale: O grego apresenta uma forma substancialmente diferente do versículo; como o hebraico está preservado com alta confiança, ele rege o texto principal, enquanto a variante grega é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino
  choice: Senhor
  alternative: YHWH
  rationale: O hebraico יי representa reverentemente o nome divino; «Senhor» é a forma tradicional, clara e adequada ao registro bíblico em português.
- issue: Formas hebraica e grega concorrentes do versículo
  choice: Seguir o hebraico preservado no texto principal e registrar o grego em nota
  alternative: Pois é fácil diante do Senhor, no dia da morte, retribuir a uma pessoa segundo os seus caminhos.
  rationale: O testemunho hebraico deste versículo é de alta confiança e tem prioridade onde sobrevive. A forma grega, porém, é materialmente diferente e deve ser preservada com transparência como leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão «num súbito instante» mantém a intensidade do hebraico sem soar excessivamente literal.
