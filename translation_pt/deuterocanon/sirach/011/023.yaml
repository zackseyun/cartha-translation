  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: pt
  text: 'Não diga: “Do que preciso? E que coisas boas serão minhas de agora em diante?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado diverge fortemente neste ponto: “Ele não soube o que viria depois, deixou-o para outro e morreu”, ou algo semelhante. O paralelo grego traz, em vez disso, esta advertência e foi seguido no texto principal, pois o hebraico parece estar textualmente desalinhado aqui.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ εἴπῃς
  choice: Não diga
  rationale: O imperativo grego introduz uma advertência coerente com o contexto imediato. O hebraico preservado traz לֹא יָדַע, “ele não soube”, mas parece deslocado ou textualmente incompatível neste ponto.
- source_word: Τίς ἐστίν μου χρεία
  choice: Do que preciso?
  rationale: χρεία expressa necessidade. A formulação idiomática em português conserva a pergunta retórica e evita o artificial “Qual é a minha necessidade?”.
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: que coisas boas serão minhas
  rationale: τὰ ἀγαθά pode abranger bens, benefícios e coisas boas em sentido amplo; “coisas boas” preserva essa amplitude sem restringir a expressão a posses materiais.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressão temporal clara e corrente, equivalente ao sentido direto do grego.
theological_decisions:
- issue: Ponderação textual quando o hebraico preservado diverge fortemente do grego
  choice: O texto principal segue a advertência grega
  alternative: “Ele não soube o que viria depois, deixou-o para outro e morreu”, ou formulação semelhante.
  rationale: Embora o hebraico sobrevivente normalmente tenha prioridade em Sirácida, sua redação aqui parece desalinhada, deslocada ou corrompida. O grego oferece uma advertência coerente com o contexto. A divergência é mantida de modo transparente na nota, sem ocultar a leitura hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica mantém o tom de autossuficiência censurado no contexto. A nota registra com transparência a tensão entre os testemunhos hebraico e grego.
