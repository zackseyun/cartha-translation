  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: pt
  text: Não elogie uma pessoa por sua aparência,[a] nem despreze uma pessoa de aparência desagradável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não elogie um homem por sua beleza, nem despreze uma pessoa por sua aparência.” O hebraico da primeira oração é mais amplo (“aparência”), enquanto o grego restringe o sentido a “beleza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: Não elogie
  rationale: O piel de הלל significa “louvar” ou “elogiar”. “Elogiar” é natural em português quando o objeto é uma característica externa de alguém.
- source_word: אָדָם
  choice: uma pessoa
  rationale: אָדָם designa aqui um indivíduo humano em sentido genérico. “Uma pessoa” comunica esse alcance naturalmente em português, sem exigir uma referência exclusivamente masculina.
- source_word: בְּתָאֳרוֹ
  choice: por sua aparência
  rationale: תֹּאַר se refere à forma ou aparência exterior. A tradução preserva a amplitude do hebraico, enquanto o grego paralelo traz o sentido mais estreito de “beleza”.
- source_word: וְאַל תְּתַעֵב
  choice: nem despreze
  rationale: תעב expressa forte rejeição ou aversão. “Desprezar” é claro e idiomático, mantendo força adequada sem soar arcaico.
- source_word: מְכוֹעָר
  choice: quem tem aparência desagradável
  rationale: מְכוֹעָר significa feio ou de aspecto desagradável. Esta formulação mantém a avaliação no campo visual e evita que “uma pessoa feia” soe como caracterização total da pessoa.
- source_word: בְּמַרְאֵהוּ
  choice: aparência
  rationale: מַרְאֶה indica aquilo que se vê, o aspecto visível. Em conjunto com מְכוֹעָר, “tem aparência desagradável” reproduz o sentido de modo corrente e digno em português.
