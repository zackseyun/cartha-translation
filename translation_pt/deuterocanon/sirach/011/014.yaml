  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: pt
  text: O bem e o mal, a vida e a morte, a pobreza e a riqueza vêm do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada na testemunha principal parece trazer uma redação diferente e não corresponde a este versículo: «Há quem empobreça e pereça enquanto caminha, carente de tudo e ainda mais pobre que um homem pobre». Como o hebraico aqui está assinalado como divergente, a tradução segue o texto grego: «O bem e o mal, a vida e a morte, a pobreza e a riqueza vêm do Senhor».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαθὰ
  choice: o bem
  rationale: Preserva a abstração coletiva e forma um par proverbial natural com «o mal».
- source_word: κακά
  choice: o mal
  rationale: Mantém a amplitude moral e experiencial do termo grego, sem reduzi-lo a «dificuldades» ou «desgraças».
- source_word: ζωὴ καὶ θάνατος
  choice: a vida e a morte
  rationale: Tradução direta do par antitético grego.
- source_word: πτωχεία καὶ πλοῦτος
  choice: a pobreza e a riqueza
  rationale: Expressa claramente o contraste socioeconômico e usa vocabulário português atual.
- source_word: παρὰ Κυρίου ἐστίν
  choice: vêm do Senhor
  rationale: Comunica de modo natural a ideia de origem ou procedência expressa por παρά, sem especificar além do texto o modo da ação divina.
theological_decisions:
- issue: Origem divina de realidades favoráveis e desfavoráveis
  choice: Manter «o bem e o mal [...] vêm do Senhor».
  alternative: Interpretar como «prosperidade e adversidade» ou explicar que Deus não é o autor do mal moral.
  rationale: O grego apresenta explicitamente ἀγαθὰ e κακά e atribui sua procedência ao Senhor. A tradução conserva a tensão e a amplitude da formulação, sem resolvê-la por explicação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo proverbial. O artigo definido repetido torna os três pares naturais em português e preserva o ritmo do grego. A nota torna transparente a divergência entre a linha hebraica preservada e o texto grego correspondente à referência.
