review_pass:
  verdict: revise
  source_fidelity: A tradução principal segue o grego de Sirácida 11:14, mas a fonte original primária fornecida é uma linha hebraica de alta confiança que traz conteúdo inteiramente diverso. A nota reconhece a divergência, porém não justifica substituir o texto hebraico pelo paralelo grego como texto do versículo. Deve-se traduzir o hebraico e registrar que ele parece corresponder a outra numeração ou tradição textual; o grego pode ser citado como paralelo divergente.
  naturalness: A redação atual em português é natural e bem ritmada para o grego, mas não resolve a incompatibilidade com a fonte primária. A revisão proposta mantém um português moderno e formula com cautela o comparativo final, que é sintaticamente elíptico no hebraico.
  terminology: «O Senhor» é apropriado para o grego e para a nota comparativa. Na tradução do hebraico, «empobrece», «perece» e «sem nada» refletem, respectivamente, רֹשֵׁשׁ, אֹבֵד e חֲסַר כֹּל. «Mais pobre que um pobre» conserva a repetição e a elipse marcadas de וְיוֹתֵר אִישׁ עָנִי sem impor uma interpretação mais específica.
  issues:
  - severity: high
    issue: O texto principal traduz o paralelo grego, não a linha hebraica apresentada como fonte original primária.
    rationale: O hebraico diz «Há quem empobreça e pereça enquanto caminha, sem nada, e [seja] mais pobre que um pobre», ao passo que o grego diz que bem e mal, vida e morte, pobreza e riqueza vêm do Senhor. A divergência textual deve ser explicitada, não resolvida mediante a substituição não assinalada da fonte primária.
  - severity: medium
    issue: A nota afirma que a tradução “segue o texto grego” por causa da divergência do hebraico.
    rationale: A indicação de minor_mismatch e a provável diferença de referência tornam necessária uma nota textual, mas não autorizam tratar o paralelo grego como se fosse automaticamente a leitura a traduzir quando há texto hebraico fornecido. A ambiguidade e o desalinhamento devem permanecer transparentes.
  revised_text: Há quem empobreça e pereça enquanto caminha, sem nada, e seja mais pobre que um pobre.[a]
  revised_footnotes:
  - marker: a
    text: 'A linha hebraica preservada na testemunha principal parece refletir uma numeração ou redação diferente da do paralelo grego tradicionalmente associado a Sirácida 11:14. Este grego lê: «O bem e o mal, a vida e a morte, a pobreza e a riqueza vêm do Senhor». O final hebraico é elíptico; «seja mais pobre que um pobre» procura conservar sua forma sem resolver além do necessário o sentido.'
    reason: textual_variant
  revision_rationale: A revisão traduz a fonte hebraica primária fornecida e preserva a construção elíptica final. A nota documenta, sem harmonizá-la, a profunda divergência do paralelo grego e a possível diferença de referência.
