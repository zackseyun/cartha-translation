base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/007.yaml
  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: pt
  text: Muitos que foram exaltados foram profundamente desonrados e, juntos, humilhados; até os honrados foram entregues nas mãos de outros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Antes de examinar, não culpe; primeiro compreenda e só então repreenda.” A tradução segue aqui o testemunho hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: Muitos
  rationale: O quantificador é usado substantivamente; “Muitos” é conciso e natural em português.
- source_word: נִשָּׂאִים
  choice: que haviam sido exaltados
  rationale: O particípio passivo de נשׂא indica elevação de posição ou prestígio, não levantamento físico. O mais-que-perfeito explicita a condição elevada anterior à queda.
- source_word: נִקְלוּ מְאֹד
  choice: caíram em profunda desonra
  rationale: A expressão comunica perda intensa de honra ou consideração. “Profunda” representa מְאֹד e preserva o contraste com a exaltação anterior.
- source_word: וְהִשְׁפִּלוּ יַחַד
  choice: e, todos juntos, foram rebaixados
  rationale: Embora a forma hebraica seja comprimida e apresente dificuldade gramatical, o contexto aponta para humilhação ou rebaixamento coletivo. A formulação mantém יַחַד e a reversão de condição.
- source_word: וְגַם נִכְבָּדִים
  choice: até pessoas honradas
  rationale: “Até” preserva a força intensificadora de וְגַם; “pessoas honradas” expressa status e consideração social sem restringir o sentido à nobreza hereditária.
- source_word: נִתְּנוּ בְיָד
  choice: foram entregues nas mãos de outros
  rationale: A expressão idiomática indica submissão ao poder ou controle alheio. A imagem das “mãos” foi preservada, com “de outros” tornando explícito o agente implícito exigido pelo português.
theological_decisions:
- issue: Diferença substancial entre o texto hebraico preservado e o paralelo grego
  choice: Traduzir o testemunho hebraico existente como texto principal e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Antes de examinar, não culpe; primeiro compreenda e só então repreenda.”'
  rationale: Como há testemunho hebraico para este versículo, ele recebe primazia. O grego representa uma forma textual substancialmente diferente e não deve substituir silenciosamente o hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o contraste sapiencial entre exaltação, desonra e submissão, evitando linguagem excessivamente arcaica.
