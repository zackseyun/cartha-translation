  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: pt
  text: A dádiva do justo permanecerá para os que o temem, e o seu favor prosperará para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego difere substancialmente: “Permaneça firme em sua aliança, ocupe-se com ela e envelheça em seu trabalho.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מַתַּן
  choice: dádiva
  rationale: Traduz diretamente o substantivo hebraico com o sentido de presente ou dom, em registro digno e natural.
- source_word: צַדִּיק
  choice: do justo
  rationale: Preserva o singular genérico hebraico sem acrescentar uma identificação não expressa no texto.
- source_word: יַעֲמֹד
  choice: permanecerá
  rationale: Neste contexto, o sentido de ficar de pé ou subsistir é expresso naturalmente por “permanecerá”.
- source_word: לִירֵאָיו
  choice: para os que o temem
  rationale: Mantém o pronome masculino e sua possível ambiguidade de referência, sem introduzir “Deus” nem usar maiúscula interpretativa.
- source_word: רְצוֹנוֹ
  choice: o seu favor
  rationale: רצון pode indicar vontade, agrado ou favor; “favor” produz uma afirmação coerente sem eliminar por completo a amplitude semântica.
- source_word: יִצְלַח לָעַד
  choice: prosperará para sempre
  rationale: Reproduz o sentido de ter êxito ou prosperar e conserva a duração enfática de לָעַד.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: O texto principal segue o hebraico preservado, de alta confiança.
  alternative: 'O grego traz uma exortação diferente: “Permaneça firme em sua aliança, ocupe-se com ela e envelheça em seu trabalho.”'
  rationale: A tradução deve partir primeiro da evidência na língua original fornecida. Como o hebraico está preservado e validado com alta confiança, ele fundamenta o texto principal; a leitura grega independente é registrada em nota, sem ser harmonizada com ele.
- issue: Referência dos sufixos masculinos em “os que o temem” e “seu favor”
  choice: Conservar os pronomes sem explicitar o referente.
  alternative: Interpretá-los como referência a Deus ou ao justo.
  rationale: O hebraico não nomeia novamente o referente, e explicitá-lo resolveria uma ambiguidade real do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dádiva” mantém o tom sapiencial sem arcaísmo excessivo; a sintaxe paralela procura refletir a concisão do hebraico.
