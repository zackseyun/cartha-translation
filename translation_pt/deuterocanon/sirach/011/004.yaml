translation:
  language: pt
  text: Não se glorie por causa de um manto gasto[a], nem se exalte em dias amargos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um manto arruinado” ou “uma veste desgastada”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “Não se glorie por causa de suas vestes, nem se exalte num dia de glória; pois as obras do Senhor são maravilhosas, e suas obras entre os seres humanos estão ocultas.”'
    reason: textual_variant
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: um pobre
  rationale: A expressão combina “manto/cobertura” com o particípio “arruinado, perecendo”. No contexto, pode descrever metonimicamente uma pessoa pobre ou malvestida. A tradução principal comunica naturalmente a advertência dirigida ao trato de uma pessoa, enquanto a imagem literal da roupa gasta é preservada em nota.
- source_word: אַל תְּהַתֵּל
  choice: não zombe
  rationale: O verbo התל pode expressar escárnio ou zombaria; aqui introduz uma proibição direta contra desprezar alguém por sua aparência ou condição.
- source_word: תְּקַלֵּס
  choice: se gabe
  rationale: O piel denota louvar ou exaltar. O sentido reflexivo é exigido pelo paralelismo admonitório; “se gabe” é corrente e preserva a ideia de autoexaltação.
- source_word: בִּמְרִירֵי יוֹם
  choice: em dias amargos
  rationale: A expressão hebraica aponta para amargura, aflição ou tempos difíceis. Mantém-se a formulação concreta e algo enigmática do hebraico, sem substituí-la pela leitura grega “num dia de glória”.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal a admoestação hebraica em dois membros.
  alternative: 'O grego diz: “Não se glorie por estar vestido com belas roupas, nem se exalte num dia de glória, pois as obras do Senhor são maravilhosas, e suas obras entre os seres humanos estão ocultas.”'
  rationale: O hebraico está preservado com alta confiança e, por isso, fundamenta o texto principal. A leitura grega diverge no conteúdo e acrescenta uma explicação ausente do testemunho hebraico; ela é registrada integralmente em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Zombe” e “se gabe” são formas correntes, sem coloquialismo excessivo. As notas preservam tanto a imagem literal ambígua do hebraico quanto a importante variante grega.
