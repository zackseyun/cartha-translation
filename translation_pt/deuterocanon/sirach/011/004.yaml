  terminology: «Manto gasto» comunica a imagem concreta do hebraico; a nota registra a possibilidade mais forte de «arruinado». A nota da variante grega deve evitar «belas roupas», pois o grego menciona vestes, sem o qualificativo «belas». «Senhor» reproduz adequadamente Κύριος na citação do paralelo.
