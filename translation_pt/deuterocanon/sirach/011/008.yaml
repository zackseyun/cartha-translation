  text: Before you investigate[a], do not find fault; examine first[b], and afterward rebuke.
translation:
  language: pt
  text: Antes de investigar, não deturpe; examine primeiro e, depois, repreenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A redação hebraica, sobretudo no fim do versículo, é difícil. O texto grego diz: “Antes de ouvir, não responda; e não interrompa no meio de uma conversa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: Antes de investigar
  rationale: 'Expressa naturalmente a relação temporal e conserva o sentido de חקר: apurar ou examinar cuidadosamente.'
- source_word: אַל תְּסַלֵּף
  choice: não deturpe
  rationale: Mantém o sentido lexical mais direto de סלף, “torcer, perverter, deturpar”, sem resolver a advertência como simples ato de censurar antes da apuração.
- source_word: בַּקֵּר לְפָנִים
  choice: examine primeiro
  rationale: Entende בקר como ordem para examinar e לפנים como indicação de anterioridade na sequência.
- source_word: וְאַחַר תַּזִּיף
  choice: e, depois, repreenda
  rationale: Segue a provável progressão do hebraico — exame antes da censura —, mas reconhece em nota que a forma final é difícil e que o grego preserva uma formulação diferente.
