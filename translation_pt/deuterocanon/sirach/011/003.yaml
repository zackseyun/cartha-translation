  text: The bee is small among flying creatures[a], but the first of sweet produce is its fruit.
translation:
  language: pt
  text: A abelha é pequena entre as criaturas que voam[a], mas seu fruto é o principal entre os produtos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre as aves”. O hebraico pode referir-se mais amplamente aos seres que voam. O paralelo grego especifica os produtos como “coisas doces”: “seu fruto é o principal dos doces”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיל
  choice: pequena
  rationale: No contexto, e em concordância com o grego μικρά, indica pequenez; “pequena” expressa com clareza o contraste do provérbio.
- source_word: בְּעוֹף
  choice: entre as criaturas que voam
  rationale: O hebraico עוף pode abranger seres voadores, não apenas aves; a formulação preserva essa amplitude e continua natural em português.
- source_word: דְּבֹרָה
  choice: a abelha
  rationale: Equivalente lexical direto, adequado ao estilo proverbial.
- source_word: וְרֹאשׁ
  choice: mas ... o principal
  rationale: רֹאשׁ denota primazia ou posição de destaque. “Mas” explicita o contraste implícito entre a pequenez da abelha e a excelência do que ela produz.
- source_word: תְּנוּבוֹת
  choice: dos produtos
  rationale: תְּנוּבוֹת significa produtos, rendimentos ou frutos da produção. A tradução mantém o sentido hebraico sem inserir no texto principal a especificação “doces”, presente apenas no paralelo grego.
- source_word: פּרִיָהּ
  choice: seu fruto
  rationale: Tradução literal da metáfora hebraica, confirmada pelo grego καρπός; no contexto, refere-se ao mel.
