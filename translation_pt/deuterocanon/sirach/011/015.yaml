translation:
  language: pt
  text: E o olhar do Senhor voltou-se para ele com favor[a] e o sacudiu do pó fétido.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o olhar do Senhor esteve atento a ele para o bem”; a expressão hebraica une a atenção divina a uma intenção benéfica.'
    reason: lexical_alternative
  - marker: b
    text: “Pó fétido” também pode ser entendido como “pó imundo” ou “pó de podridão”; a nuance exata da imagem hebraica é incerta.
    reason: alternative_reading
  - marker: c
    text: 'O texto grego deste versículo diverge profundamente: “O Senhor arrancou as raízes das nações e plantou os humildes no lugar delas”. O hebraico e o grego parecem refletir formas textuais substancialmente diferentes.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: E o olhar do Senhor
  rationale: A expressão hebraica traz literalmente o singular “olho”, como imagem da atenção divina. Em português, “o olhar do Senhor” conserva essa imagem de modo mais natural; יי é vertido como “Senhor”.
- source_word: צָפַתְהוּ
  choice: velou por ele
  rationale: O verbo indica olhar atentamente ou manter sob vigilância. “Velou por ele” combina a atenção divina com o contexto benéfico, sem reduzir a expressão a uma simples percepção visual.
- source_word: לְטוֹב
  choice: para o seu bem
  rationale: Expressa finalidade ou intenção benéfica. A inclusão de “seu” torna a relação natural em português sem alterar o referente pronominal já presente no verbo.
- source_word: וַיְנַעֲרֵהוּ
  choice: e o sacudiu para fora
  rationale: Preserva a imagem vigorosa de נער, “sacudir, fazer sair sacudindo”, evitando suavizá-la como apenas “ergueu” ou “retirou”.
- source_word: מֵעֲפַר
  choice: do pó
  rationale: Tradução direta da preposição מן com עפר; em combinação com “para fora”, comunica a retirada de uma condição de humilhação.
- source_word: צַחֲנָה
  choice: imundo
  rationale: O termo denota mau cheiro, podridão ou imundície. “Pó imundo” produz uma imagem compreensível e vívida, enquanto a nota preserva a nuance possível de fedor.
theological_decisions:
- issue: Forma reverencial יי para o nome divino
  choice: Senhor
  alternative: SENHOR; Yahweh
  rationale: “Senhor” representa a leitura reverencial indicada pelo manuscrito sem introduzir uma transliteração ausente do texto corrente.
- issue: Natureza da ação divina em צָפַתְהוּ לְטוֹב
  choice: velou por ele para o seu bem
  alternative: olhou para ele com favor
  rationale: A tradução mantém juntas a vigilância divina e a intenção benéfica, sem decidir de modo exclusivo entre proteção ativa e olhar favorável.
- issue: Grande divergência entre as formas hebraica e grega
  choice: Traduzir o texto hebraico fornecido e registrar o grego em nota
  alternative: 'Seguir o grego: “O Senhor arrancou as raízes das nações e plantou os humildes no lugar delas”'
  rationale: A fonte principal solicitada é o hebraico de Ben Sira; como o paralelo grego apresenta conteúdo substancialmente diferente, a divergência deve ser exposta, não harmonizada.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “O olhar” evita a rigidez de “o olho” sem apagar a imagem hebraica; “sacudiu para fora” conserva deliberadamente a força incomum da metáfora.
