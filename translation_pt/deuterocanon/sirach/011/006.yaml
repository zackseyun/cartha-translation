  text: Many who were oppressed sat on a throne[b][a], and one not thought of put on a turban.
translation:
  language: pt
  text: Muitos oprimidos sentaram-se num trono[b], e alguém em quem ninguém pensava pôs um turbante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “uma pessoa inesperada recebeu grande honra”. O hebraico diz literalmente que ela “não subiu ao coração” e depois “pôs um turbante”, imagem concreta de uma elevação inesperada.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo traz uma formulação diferente: “Muitos governantes foram profundamente desonrados, e homens ilustres foram entregues nas mãos de outros.” As duas formas expressam uma inversão de posição social.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: Muitos oprimidos
  rationale: Preserva tanto o plural quantitativo quanto a condição passiva de pessoas esmagadas ou oprimidas, em linguagem natural.
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: se assentaram num trono
  rationale: O substantivo pode designar assento ou trono; neste contexto de inversão de posição social, “trono” comunica melhor a elevação ao poder ou à alta dignidade.
- source_word: וּבַל עָלוּ עַל לֵב
  choice: e quem nem sequer era lembrado
  rationale: Traduz idiomaticamente a expressão hebraica literal “não subiram ao coração”, preservando a ideia de alguém que não entrava nas cogitações ou expectativas.
- source_word: עָטוּ צְנִיף
  choice: pôs um turbante
  rationale: Mantém a imagem concreta hebraica de vestir ou enrolar um turbante, símbolo de dignidade ou posição elevada, sem reduzi-la a uma abstração.
theological_decisions:
- issue: Primazia do texto hebraico diante da forma grega divergente
  choice: 'Traduzir a inversão de condição social conforme o hebraico: oprimidos chegam ao trono e uma pessoa inesperada põe um turbante.'
  alternative: 'Seguir o grego: muitos governantes foram profundamente desonrados, e homens ilustres foram entregues nas mãos de outros.'
  rationale: O hebraico disponível é o testemunho primário e tem alta confiança. A forma grega difere substancialmente, mas confirma o tema geral da reversão de posição sem justificar a substituição do conteúdo hebraico.
- issue: Sentido da imagem do turbante
  choice: Conservar literalmente a imagem “pôs um turbante”.
  alternative: Explicitar “recebeu grande honra” ou “foi elevado a uma posição de destaque”.
  rationale: A imagem pode indicar dignidade ou ofício, mas o tipo exato de elevação não é definido. Mantê-la evita impor uma identificação política, sacerdotal ou denominacional.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi normalizada conforme sua posição no texto: [b] após “trono” para a variante grega e [a] após “turbante” para a explicação idiomática.'
