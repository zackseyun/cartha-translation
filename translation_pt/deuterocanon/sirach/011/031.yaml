  text: An evil time makes pleasure be forgotten[a], and a man's end tells about him.
translation:
  language: pt
  text: Um tempo de adversidade faz esquecer o prazer[a], e o fim de um homem revela quem ele é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois, transformando as coisas boas em más, ele fica à espreita e lançará censura sobre aquilo que foi escolhido.” Os testemunhos hebraico e grego diferem consideravelmente neste ponto; o texto principal segue o hebraico preservado, adotado como testemunho primário de Eclesiástico quando disponível.'
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: um tempo de adversidade
  rationale: עֵת designa um tempo ou período, e רָעָה, neste contexto sapiencial, aponta para infortúnio ou aflição, não necessariamente para maldade moral. A expressão é clara e natural em português.
- source_word: תְּשַׁכֵּח
  choice: faz esquecer
  rationale: O hifil de שכח tem força causativa. “Faz esquecer” preserva essa relação de modo conciso e idiomático.
- source_word: תַּעֲנוּג
  choice: o prazer
  rationale: O substantivo indica deleite ou prazer desfrutado. “Prazer” mantém a concisão do provérbio.
- source_word: וְסוֹף אָדָם
  choice: e o fim de um homem
  rationale: סוֹף pode indicar fim ou desfecho, enquanto אָדָם aparece no singular representativo. “Um homem” conserva essa forma proverbial sem transformar a expressão em uma abstração coletiva.
- source_word: יַגִּיד עָלָיו
  choice: revela quem ele é
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. Com עָלָיו, a frase afirma que o fim ou desfecho torna conhecida a verdade a respeito do homem; “revela quem ele é” expressa isso com naturalidade, sem especificar em que consiste essa revelação.
theological_decisions:
- issue: Sentido do fim de uma pessoa como testemunho sobre ela
  choice: o fim de um homem revela quem ele é
  alternative: o fim de um homem fala a respeito dele
  rationale: A formulação escolhida comunica a força reveladora de יַגִּיד עָלָיו, mas não determina se “fim” significa morte, desfecho moral ou resultado final da vida. Assim, preserva-se a tensão sapiencial do hebraico.
- issue: Tradução do singular proverbial אָדָם
  choice: um homem
  alternative: uma pessoa
  rationale: O hebraico usa אָדָם no singular representativo. “Um homem” conserva essa configuração proverbial e corresponde diretamente ao referente masculino retomado pelo sufixo em עָלָיו, sem acrescentar uma aplicação exclusivamente masculina.
translation_notes:
  register: Português atual, digno e conciso, com legibilidade brasileira e compreensão internacional. A construção proverbial mantém o paralelismo das duas orações e evita explicar além do que o hebraico afirma.
