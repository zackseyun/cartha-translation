  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: pt
  text: Antes da morte, não chame nenhum homem de feliz[b], pois, no seu fim, o homem se dá a conhecer.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz um texto bastante diferente: “Cuidado com o malfeitor, pois ele trama o mal, para que não deixe em você uma mancha para sempre.” Isso provavelmente reflete outra forma textual; aqui se segue o hebraico como testemunha principal.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não declare afortunado nenhum homem”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no seu fim o homem é reconhecido” ou “se torna evidente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: Antes da morte
  rationale: Expressa diretamente a circunstância temporal e preserva a formulação concisa do hebraico.
- source_word: אַל תְּאַשֶּׁר
  choice: não proclame feliz
  rationale: 'O verbo אשר tem aqui sentido declarativo: declarar ou chamar alguém de feliz, afortunado. “Proclame feliz” mantém a força de um juízo público ou conclusivo.'
- source_word: גָּבֶר
  choice: nenhum homem
  rationale: Mantém o masculino singular do hebraico; “nenhum” é exigido naturalmente em português pela construção negativa, sem mudar o alcance proverbial.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira natural a razão da advertência e conserva o tom proverbial.
- source_word: בְּאַחֲרִיתוֹ
  choice: no fim
  rationale: Preserva a concisão e a possível referência tanto ao fim da vida quanto ao desfecho final da pessoa; o contexto fornece o referente possessivo.
- source_word: יִנָּכֵר
  choice: se dá a conhecer
  rationale: Reproduz o valor resultativo/passivo de tornar-se conhecido ou reconhecível, sem explicitar indevidamente se está em vista o caráter, a condição ou o destino.
- source_word: אִישׁ
  choice: o homem
  rationale: Conserva o masculino representativo e o paralelismo lexical do provérbio, com sentido genericamente humano no contexto sapiencial.
theological_decisions:
- issue: Masculino genérico no estilo sapiencial hebraico
  choice: Conservar “homem” nas duas orações
  alternative: “pessoa”, “alguém”
  rationale: גָּבֶר e אִישׁ são masculinos singulares. A tradução preserva essa forma textual sem restringir a aplicação geral do provérbio.
- issue: Sentido da oração final
  choice: “no fim que o homem se dá a conhecer”
  alternative: “no fim da vida o homem é reconhecido”; “pelo seu desfecho o homem se torna evidente”
  rationale: A formulação conserva a tensão entre o momento final da vida e o desfecho que revela quem a pessoa é, sem selecionar apenas uma dessas nuances.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Seguir o texto hebraico e registrar o grego em nota
  alternative: 'Traduzir o texto grego: “Cuidado com o malfeitor...”'
  rationale: O hebraico sobrevivente é a testemunha primária indicada e apresenta um dito substancialmente diferente; a variante grega deve permanecer visível, mas não substituir silenciosamente o texto-base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada com a construção enfática “é no fim que”, natural em português e fiel ao foco do hebraico. As notas preservam tanto as alternativas lexicais quanto a divergência textual grega.
