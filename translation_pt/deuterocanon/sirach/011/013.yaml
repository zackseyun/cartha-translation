base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/013.yaml
  text: There is one who labors and toils and rushes about[a], yet all the more he falls behind.
translation:
  language: pt
  text: Há quem trabalhe arduamente, se fatigue e corra de um lado para outro; ainda assim, fica cada vez mais para trás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz mais literalmente: “ele se atrasa”. A tradição grega apresenta aqui um texto substancialmente diferente: “e ele levantou a cabeça, e muitos ficaram admirados com ele”.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: Introduz de modo existencial e genérico um tipo de pessoa, sem especificar gênero e com naturalidade em português.
- source_word: עָמֵל
  choice: trabalhe arduamente
  rationale: Expressa trabalho penoso e intenso, preservando a força do particípio hebraico em linguagem corrente.
- source_word: וְיָגֵעַ
  choice: se fatigue
  rationale: 'Mantém a intensificação quase sinonímica: além de trabalhar arduamente, a pessoa se desgasta com o esforço.'
- source_word: וָרָץ
  choice: corra de um lado para outro
  rationale: O sentido literal é “corre”; a formulação escolhida comunica, no contexto sapiencial, atividade apressada e incessante sem transformar isso em interpretação excessiva.
- source_word: וּכְדֵי כֵן
  choice: ainda assim ... cada vez mais
  rationale: A expressão é difícil. A tradução preserva a relação irônica e adversativa entre o esforço frenético e o resultado, ao mesmo tempo que representa sua possível força intensificadora.
- source_word: הוּא מִתְאַחֵר
  choice: fica ... para trás
  rationale: O verbo derivado de אחר indica atrasar-se ou ficar para trás; esta opção é clara e idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção genérica “Há quem” evita acrescentar gênero não exigido pelo hebraico; o paralelismo e o contraste proverbial foram preservados.
