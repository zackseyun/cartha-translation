  yaml_path: translation/deuterocanon/sirach/011/027.yaml
  text: The blessing of God is the lot of the righteous[b][a], and in the time of his hope it will blossom.
translation:
  language: pt
  text: A bênção de Deus é a porção do justo, e, no tempo de sua esperança, ela florescerá.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “A bênção de Deus é a porção do justo, e, no tempo de sua esperança, ela florescerá.” O paralelo grego traz uma leitura muito diferente: “Uma hora de adversidade faz esquecer o luxo, e, no fim de uma pessoa, há a revelação de suas obras.” Isso indica uma tradição textual divergente para este versículo.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “sua esperança florescerá”. O verbo hebraico pode ter como referente tanto “a bênção” quanto “sua esperança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: A bênção de Deus
  rationale: A cadeia construta expressa a bênção associada a Deus ou procedente dele. A formulação é direta e preserva o título divino comum אֵל sem acrescentar especificidade ausente no hebraico.
- source_word: גּוֹרָל
  choice: a porção
  rationale: Embora o sentido concreto seja o de sorte lançada, aqui o termo designa aquilo que cabe a alguém. “Porção” comunica naturalmente essa ideia em português sem transformar a expressão em “destino” nem introduzir a noção mais específica de herança.
- source_word: צַדִּיק
  choice: do justo
  rationale: O adjetivo substantivado singular designa genericamente a pessoa justa. “Do justo” mantém o número e a categoria moral do hebraico em linguagem bíblica corrente e compreensível.
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: e, no tempo de sua esperança
  rationale: Mantém explicitamente a expressão temporal e traduz תִּקְוָתוֹ como “sua esperança”, preservando tanto o caráter pessoal do sufixo quanto a possível ideia daquilo que se espera.
- source_word: תִּפְרָח
  choice: ela florescerá
  rationale: O verbo descreve brotar ou florescer. O pronome feminino concorda naturalmente com “bênção”, mas a nota registra que “esperança”, também feminina em português, pode ser o referente.
theological_decisions:
- issue: Referente de תִּפְרָח, verbo feminino singular
  choice: No texto principal, “ela” aponta mais naturalmente para “a bênção de Deus”.
  alternative: A esperança do justo florescerá.
  rationale: Tanto בִּרְכַּת (“bênção”) quanto תִּקְוָתוֹ (“sua esperança”) podem funcionar como antecedente feminino singular. O texto deixa o pronome com referência gramaticalmente possível a ambos, enquanto a nota explicita a ambiguidade em vez de resolvê-la silenciosamente.
- issue: Grande divergência entre o hebraico e o paralelo grego
  choice: Traduzir prioritariamente o testemunho hebraico fornecido e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Uma hora de adversidade faz esquecer o luxo, e, no fim de uma pessoa, há a revelação de suas obras.”'
  rationale: O texto grego não representa apenas uma diferença lexical, mas uma tradição textual substancialmente distinta. Como o hebraico tem alta confiança e é a fonte primária indicada, ele fundamenta o texto principal; a divergência permanece visível na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Porção” é mais natural que o literal “sorte” neste contexto, sem perder a noção de parte atribuída. Os marcadores aparecem depois da frase, na ordem das respectivas notas.
