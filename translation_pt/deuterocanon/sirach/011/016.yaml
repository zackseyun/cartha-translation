translation:
  language: pt
  text: Ele o ergueu e o exaltou[a][b], e muitos ficaram maravilhados com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “ergueu em/sobre a sua cabeça”. A expressão parece indicar que ele foi elevado a uma posição alta ou de destaque.
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego fornecido para este versículo não corresponde a esta linha hebraica; por isso, a tradução segue o testemunho hebraico preservado.
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא בְּרֹאשׁוֹ
  choice: o ergueu
  rationale: נָשָׂא expressa levantar ou elevar. A expressão בְּרֹאשׁוֹ é literalmente difícil (‘em/sobre a sua cabeça’), mas neste paralelismo parece indicar elevação a uma posição alta; ‘o ergueu’ conserva o movimento ascendente sem impor uma imagem obscura ao leitor.
- source_word: וַיְרֹמְמֵהוּ
  choice: e o exaltou
  rationale: רומם significa elevar ou exaltar; ‘exaltou’ preserva a elevação de posição ou dignidade e forma um paralelismo natural com ‘ergueu’.
- source_word: וַיִּתְמְהוּ
  choice: ficaram maravilhados
  rationale: תמה denota espanto ou admiração diante de algo extraordinário. A expressão escolhida comunica assombro intenso em português corrente sem sugerir necessariamente medo.
- source_word: עָלָיו
  choice: com ele
  rationale: Com um verbo de assombro, עַל introduz a pessoa que provoca a reação; ‘com ele’ é uma construção natural e mantém essa referência.
- source_word: רַבִּים
  choice: muitos
  rationale: A forma simples e indefinida corresponde diretamente ao hebraico e dispensa acrescentar ‘pessoas’.
theological_decisions:
- issue: O sujeito e o referente dos pronomes não são nomeados no hebraico.
  choice: 'Manter os pronomes masculinos singulares sem identificar as personagens: ‘Ele’ e ‘o’.'
  alternative: Identificar o sujeito como Deus/o Senhor ou como um governante humano.
  rationale: As formas verbais e os sufixos indicam masculino singular, mas o versículo isolado não nomeia nem o agente nem aquele que é elevado. A tradução preserva essa abertura em vez de introduzir uma identificação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Ficaram maravilhados’ conserva o sentido de assombro sem reduzir o verbo a mera aprovação. Os marcadores seguem a ordem natural [a][b].
