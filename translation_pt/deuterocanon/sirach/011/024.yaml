base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/024.yaml
  text: My son[a], stand by your appointed lot and walk in it[b], and grow old in your work.
translation:
  language: pt
  text: Meu filho[a], permaneça no caminho que lhe foi determinado e ande nele[b]; envelheça em seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz: “Não diga: ‘Sou autossuficiente; que mal poderá me acontecer de agora em diante?’” O hebraico preservado neste ponto difere substancialmente da tradição grega.'
    reason: alternative_reading
  - marker: b
    text: O hebraico aqui é difícil. Pode significar algo como “na porção que lhe coube”, “na esfera que lhe foi prescrita” ou “em sua regra ou caminho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo masculino singular e o contexto de instrução paterna.
- source_word: עֲמוֹד
  choice: permaneça
  rationale: O imperativo de עמד, com complemento introduzido por ב, expressa aqui constância ou perseverança; “permaneça” é natural em português e evita uma tradução excessivamente literal.
- source_word: בְּחֻקֶּךָ
  choice: no caminho que lhe foi determinado
  rationale: A expressão hebraica é difícil e pode apontar para porção, esfera prescrita ou regra. Esta formulação comunica um curso atribuído sem limitar o sentido à lei ou ao ofício.
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: e ande nele
  rationale: Mantém a metáfora hebraica de andar como modo contínuo de viver ou conduzir-se.
- source_word: וּבִמְלָאכְתְּךָ
  choice: em seu trabalho
  rationale: מלאכה designa de modo amplo trabalho, ocupação ou tarefa; “trabalho” é claro e corrente.
- source_word: הִתְיַשֶּׁן
  choice: envelheça
  rationale: Expressa tornar-se velho e, no contexto, perseverar por longo tempo na própria ocupação, sem introduzir a ideia de esgotamento.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Traduzir apenas o grego: “Não diga: ‘Sou autossuficiente; que mal poderá me acontecer de agora em diante?’”'
  rationale: Como há testemunho hebraico, ele recebe primazia. A variante grega é relevante demais para ser omitida, mas não deve substituir silenciosamente o texto hebraico.
- issue: Sentido de בְּחֻקֶּךָ
  choice: no caminho que lhe foi determinado
  alternative: em seu estatuto; em sua porção; em sua esfera prescrita
  rationale: A tradução preserva a noção provável de um curso ou âmbito atribuído, sem decidir de modo indevido entre os sentidos possíveis de חק.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal em “lhe foi determinado” evita regionalismo marcado; a metáfora “ande nele” preserva a forma hebraica sem soar obscura.
