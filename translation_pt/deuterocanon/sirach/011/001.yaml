  text: The wisdom of the poor lifts up his head[a], and seats him among nobles.
translation:
  language: pt
  text: A sabedoria do pobre lhe ergue a cabeça[a] e lhe dá lugar entre os nobres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do humilde” ou “do que é de condição humilde”. O hebraico diz “do pobre”, enquanto o paralelo grego pode indicar baixa condição de modo mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת דַּל
  choice: A sabedoria do pobre
  rationale: Preserva a relação de construto do hebraico e mantém דַּל em seu sentido socioeconômico mais direto, sem excluir a ideia de condição humilde.
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: lhe ergue a cabeça
  rationale: Conserva a imagem hebraica, também confirmada pelo paralelo grego, e comunica elevação de dignidade ou posição.
- source_word: וּבֵין נְדִיבִים
  choice: entre os nobres
  rationale: “Entre” é natural com o plural; neste contexto, נְדִיבִים designa pessoas de posição elevada, em consonância com o grego μεγιστάνων.
- source_word: תּוֹשִׁיבֶנּוּ
  choice: lhe dá lugar
  rationale: O hifil de ישב significa fazê-lo sentar-se ou colocá-lo em um assento. “Dá lugar” soa natural em português e preserva a ideia de admissão honrosa no círculo dos nobres.
theological_decisions:
- issue: Se דַּל deve ser entendido sobretudo em sentido socioeconômico ou como humildade/baixa condição em geral
  choice: o pobre
  alternative: o humilde; o de condição humilde
  rationale: O hebraico, fonte primária, favorece a designação concreta “pobre”; o paralelo grego permite uma referência mais ampla à baixa condição. A nota conserva essa amplitude sem substituir o sentido principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora de erguer a cabeça foi mantida; “lhe dá lugar” evita uma formulação rígida como “o faz sentar” e comunica a honra social do contexto.
