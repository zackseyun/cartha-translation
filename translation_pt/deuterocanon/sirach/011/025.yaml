  text: Do not be astonished at evildoers[a]; run to the Lord and wait for his light.
translation:
  language: pt
  text: Não se espante com os que praticam o mal[a]; corra para o SENHOR e espere por sua luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “No dia das coisas boas, há esquecimento das coisas más; e, no dia das coisas más, não se lembrarão das coisas boas.” Nesse ponto, o testemunho grego difere substancialmente do hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: Não fique perplexo
  rationale: O verbo hebraico expressa espanto ou perturbação diante de algo. “Não fique perplexo” soa natural em português e preserva a advertência para não se deixar desconcertar.
- source_word: בְּעוֹשֵׂי רָע
  choice: diante dos que praticam o mal
  rationale: Traduz literalmente a ideia participial de “os que fazem o mal”, com formulação corrente e digna; a preposição “diante de” expressa adequadamente a reação perante essas pessoas.
- source_word: תָּרוּץ
  choice: corra
  rationale: Mantém a imagem concreta e urgente do verbo hebraico, sem reduzi-la a um abstrato “apresse-se”.
- source_word: לַיי
  choice: para o SENHOR
  rationale: A grafia reverencial representa o nome divino. “SENHOR” segue a convenção portuguesa amplamente reconhecida para o tetragrama.
- source_word: וְקַוֵּה
  choice: e espere
  rationale: O verbo reúne as ideias de esperar e ter esperança. “Espere” preserva a construção direta e deixa a expectativa confiante implícita no contexto.
- source_word: לְאוֹרוֹ
  choice: pela sua luz
  rationale: Conserva a imagem hebraica sem especificar se a luz representa favor, orientação ou livramento.
theological_decisions:
- issue: Representação do nome divino indicado pela grafia reverencial יי
  choice: o SENHOR
  alternative: o Senhor; Yahweh
  rationale: A forma em versaletes representa convencionalmente o nome divino em português e deixa claro que o referente é o Deus de Israel.
- issue: Relação entre os testemunhos hebraico e grego
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego substancialmente diferente em nota
  alternative: Traduzir apenas o grego; harmonizar os dois testemunhos
  rationale: O hebraico existente é a fonte primária aqui. Como o grego transmite outro dito, a nota preserva a variante sem criar um texto composto artificial.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com legibilidade brasileira. A formulação mantém a concisão proverbial, a urgência de “corra” e a ambiguidade figurada de “sua luz”.
