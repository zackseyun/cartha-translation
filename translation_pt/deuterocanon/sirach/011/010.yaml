base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/010.yaml
  text: Do not contend where there is no cause[b][a], and do not rise up in the quarrel of the arrogant.
translation:
  language: pt
  text: Não entre em disputa sem motivo[b] e não se levante na disputa dos arrogantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz aqui um texto muito diferente: “Meu filho, não te ocupes com muitas atividades; se as multiplicares, não serás absolvido; se perseguires, não alcançarás; e, ainda que fujas, não escaparás.” Isso provavelmente reflete uma Vorlage hebraica diferente ou uma grande divergência textual.'
    reason: alternative_reading
  - marker: b
    text: O sentido do hebraico עַצָּבָה neste contexto é incerto; a palavra pode significar “dor”, “aflição”, “problema” ou “agravo”. A tradução “motivo” entende a frase como ausência de fundamento válido para uma disputa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: sem
  rationale: A preposição com אֵין indica ausência ou inexistência; “sem” expressa essa circunstância de modo direto e natural em português.
- source_word: עַצָּבָה
  choice: motivo
  rationale: O substantivo tem nuance incerta e pode indicar dor, aflição, problema ou agravo. Em ligação com a proibição de contender, “motivo” comunica a provável ideia de falta de fundamento real para a disputa, sem esconder a incerteza, registrada em nota.
- source_word: אַל תִּתְחָר
  choice: não entre em disputa
  rationale: A forma verbal pode evocar acalorar-se ou envolver-se em contenda. A expressão escolhida transmite com clareza a força prática da proibição no contexto.
- source_word: וּבְרִיב
  choice: e ... numa briga
  rationale: רִיב pode designar contenda, disputa ou litígio. “Briga” é corrente e adequado ao cenário interpessoal do provérbio.
- source_word: זֵדִים
  choice: de arrogantes
  rationale: זֵדִים caracteriza pessoas insolentes, presunçosas ou orgulhosas. “Arrogantes” preserva de forma clara a avaliação moral do hebraico.
- source_word: אַל תְּקוֹמֵם
  choice: não se levante
  rationale: A expressão conserva a imagem de קום, “levantar-se”, provavelmente no sentido de tomar parte ou assumir posição na briga. A formulação portuguesa mantém a imagem sem desenvolver além do que o texto afirma.
theological_decisions:
- issue: Testemunho principal e uso do paralelo grego
  choice: Traduzir o hebraico preservado como texto principal e registrar em nota a leitura grega substancialmente diferente.
  alternative: 'Adotar como texto principal o grego: “Meu filho, não deixes que tuas atividades se ocupem de muitas coisas...”'
  rationale: Como há aqui testemunho hebraico, ele governa a tradução. O grego parece refletir uma Vorlage hebraica diferente ou uma divergência textual ampla e, por isso, funciona como testemunho paralelo, não como base para substituir o hebraico existente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa preserva o paralelismo proverbial hebraico. “Não se levante” mantém deliberadamente a imagem e certa abertura semântica do original.
