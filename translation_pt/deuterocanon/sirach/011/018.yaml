  text: Wisdom and understanding and the knowledge of a matter are from the Lord[a]; sin and upright ways are from the Lord.
translation:
  language: pt
  text: Há quem enriqueça por sua cautela e avareza, e esta é a parte de sua recompensa:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada nos manuscritos da Guenizá do Cairo traz aqui um dito diferente: “Sabedoria, entendimento e discernir uma questão vêm do SENHOR; pecado e caminhos retos vêm do SENHOR.” Como essa linha não corresponde à redação grega de Sirácida 11:18, a tradução principal segue o texto grego neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: Há quem enriqueça
  rationale: Expressa de modo natural em português a existência de alguém que adquire riqueza, preservando o aspecto processual do particípio grego.
- source_word: ἀπὸ προσοχῆς
  choice: por sua cautela
  rationale: προσοχή indica atenção ou cuidado; “cautela” conserva a concisão e certa ambiguidade moral, esclarecida pelo termo negativo seguinte.
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: e avareza
  rationale: O substantivo denota parcimônia rígida ou mesquinhez. “Avareza” é corrente, clara e adequadamente negativa, sem recorrer a expressão coloquial.
- source_word: καὶ αὕτη ἡ μερὶς
  choice: e esta é a parte
  rationale: Mantém a imagem de uma porção ou parcela atribuída como resultado.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: de sua recompensa
  rationale: μισθός pode ser salário ou recompensa; aqui, “recompensa” comunica naturalmente o resultado obtido por sua conduta, sem pressupor relação empregatícia.
theological_decisions:
- issue: Alinhamento das fontes entre o hebraico fornecido e o paralelo grego
  choice: Traduzir neste versículo o sentido do grego e registrar em nota a linha hebraica divergente.
  alternative: 'Traduzir a linha hebraica como outro dito: “Sabedoria, entendimento e discernir uma questão vêm do SENHOR; pecado e caminhos retos vêm do SENHOR.”'
  rationale: A linha hebraica fornecida não corresponde ao teor de Sirácida 11:18 na sequência grega e parece pertencer a outro dito textual. O grego oferece a redação coerente para este versículo; a divergência hebraica é preservada com transparência na nota, sem ser harmonizada nem omitida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Há quem” reproduz com naturalidade a fórmula sapiencial; “cautela e avareza” mantém a progressão do termo potencialmente neutro ao explicitamente negativo.
