base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/005.yaml
  text: For the works of the Lord are wondrous[b][a], and his work is hidden from man.
translation:
  language: pt
  text: Pois as obras do Senhor são maravilhosas[b], e sua obra permanece oculta ao ser humano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do ser humano”; o hebraico emprega um termo singular genérico para a humanidade.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego deste versículo difere substancialmente: “Muitos tiranos se sentaram no chão, mas alguém em quem não se pensava usou uma coroa”. As testemunhas hebraica e grega parecem refletir formas textuais diferentes neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: פְלָאוֹת
  choice: maravilhosas
  rationale: O termo, da raiz פלא, descreve aquilo que é extraordinário ou admirável. “Maravilhosas” conserva o tom elevado e funciona naturalmente como predicativo em português.
- source_word: מַעֲשֵׂי
  choice: as obras de
  rationale: Plural construto de מעשה. “Obras” abrange tanto os atos quanto aquilo que Deus realiza, mantendo uma formulação digna e corrente.
- source_word: יי
  choice: o Senhor
  rationale: A testemunha hebraica emprega a forma reverencial abreviada do nome divino. “O Senhor” comunica adequadamente essa referência sem alegar uma grafia plena de יהוה.
- source_word: וְנֶעְלָם
  choice: permanece oculta
  rationale: A forma passiva/Nifal de עלם indica que algo está fora do alcance da percepção ou compreensão humana. “Permanece oculta” expressa esse estado de modo idiomático.
- source_word: מֵאָדָם
  choice: ao ser humano
  rationale: אָדָם tem aqui sentido genérico, referente à humanidade. “Ao ser humano” preserva a referência humana singular e genérica sem sugerir exclusivamente o sexo masculino; a preposição “a” é natural com “oculta” em português.
- source_word: פָּעֳלוֹ
  choice: sua obra
  rationale: O substantivo singular refere-se ao agir ou feito do Senhor. “Sua obra” preserva a mudança do plural מַעֲשֵׂי para o singular פָּעֳלוֹ.
theological_decisions:
- issue: Representação do nome divino escrito como יי em uma testemunha hebraica deuterocanônica
  choice: o Senhor
  alternative: SENHOR; YHWH
  rationale: A forma reverencial יי aponta para o nome divino, mas não o apresenta em sua grafia plena. “O Senhor” mantém a referência tradicional sem exceder a evidência ortográfica da fonte.
- issue: Referência genérica de אָדָם
  choice: ao ser humano
  alternative: ao homem; à humanidade
  rationale: O contexto fala da limitação humana em geral. “Ser humano” conserva o valor genérico singular e evita que o leitor moderno entenda uma restrição aos homens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução segue prioritariamente a testemunha hebraica; a variante grega substancial é preservada em nota. A ordem dos marcadores acompanha as expressões a que cada nota se refere.
