base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: pt
  text: Meu filho[a], se você não correr, não alcançará; e, se não buscar, não encontrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho grego difere substancialmente neste ponto. Em vez deste provérbio, fala de uma pessoa sem disposição, necessitada de ajuda, fraca e muito pobre, para quem os olhos do Senhor se voltam com bondade e a quem ele levanta de sua humilhação. Aqui seguimos o hebraico como testemunho principal e registramos o grego como uma importante tradição textual alternativa.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo masculino singular e o tom de instrução paterna característico da literatura sapiencial.
- source_word: תָּרוּץ
  choice: correr
  rationale: Mantém a imagem concreta e proverbial do verbo רוץ, sem substituí-la por uma interpretação como “esforçar-se”.
- source_word: תַגִּיעַ
  choice: alcançar
  rationale: Expressa naturalmente em português a ideia ampla de chegar a um objetivo ou atingi-lo, sem especificar um objeto ausente no hebraico.
- source_word: תְּבַקֵּשׁ
  choice: buscar
  rationale: Preserva o sentido comum de בקש e forma o par proverbial natural “buscar/encontrar”.
- source_word: תִמְצָא
  choice: encontrar
  rationale: É o equivalente corrente de מצא e conserva o paralelismo com “buscar”.
theological_decisions:
- issue: Tratamento filial marcado por gênero na instrução sapiencial
  choice: Meu filho
  alternative: Meu filho ou minha filha; Minha criança
  rationale: O hebraico traz explicitamente um vocativo filial masculino singular. A tradução mantém essa forma histórica e literária, sem neutralização interpretativa.
- issue: Relação entre o testemunho hebraico e a tradição grega divergente
  choice: Traduzir diretamente o provérbio hebraico conservado e registrar a divergência grega em nota
  alternative: Seguir o texto grego sobre a pessoa sem forças e pobre, levantada pelo Senhor
  rationale: Há texto hebraico disponível e de alta confiança para esta passagem; o grego apresenta conteúdo substancialmente diferente, que deve ser preservado como variante textual, não harmonizado com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção proverbial foi mantida concisa; “você” comunica naturalmente o singular do hebraico, e os futuros “alcançará/encontrará” refletem as consequências expressas no texto.
