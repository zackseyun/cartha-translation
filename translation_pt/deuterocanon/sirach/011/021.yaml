base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
translation:
  language: pt
  text: Há quem enriqueça por meio de privações[a], e isso será a recompensa que lhe cabe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio da aflição”, “do sofrimento” ou “da mortificação”. O hebraico pode indicar tanto dificuldades sofridas quanto privação voluntária; o paralelo grego aponta para trabalho e pobreza.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, aproximadamente: “e isto fará com que sua recompensa seja devida” ou “exigível”. A cláusula é difícil; a tradução apresenta em português corrente o provável sentido de uma recompensa que lhe é devida.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: A construção existencial introduz um tipo de pessoa; “há quem” é natural em português e mantém o caráter proverbial da observação.
- source_word: מִתְעַשּׁר
  choice: enriqueça
  rationale: O particípio hitpael de עשר indica tornar-se rico; no português, o presente do subjuntivo após “há quem” expressa naturalmente esse processo sem transformá-lo em estado permanente.
- source_word: מֵהִתְעַנּוֹת
  choice: por meio de privações
  rationale: A expressão pode abranger aflição, sofrimento ou mortificação voluntária. “Privações” conserva essa amplitude melhor que uma referência exclusiva a ascetismo ou trabalho, enquanto o paralelo grego favorece o campo de labor e pobreza.
- source_word: וְזֶה
  choice: e essa
  rationale: O demonstrativo retoma a situação ou o resultado descrito; o feminino concorda naturalmente com “recompensa” na formulação portuguesa.
- source_word: יְחַיֵּב שְׂכָרוֹ
  choice: será a recompensa que lhe cabe
  rationale: A cláusula hebraica é comprimida e difícil. A formulação comunica a provável ideia de recompensa devida sem impor uma doutrina mais forte de mérito e sem reproduzir uma construção ininteligível em português.
theological_decisions:
- issue: Relação entre riqueza, privação e recompensa numa cláusula hebraica difícil
  choice: A prosperidade alcançada em meio a privações é apresentada como a recompensa que cabe à pessoa.
  alternative: A pessoa enriquece pela mortificação voluntária, e a riqueza é o salário que merece.
  rationale: O hebraico admite aflição imposta ou autonegação, e a expressão final não é sintaticamente transparente. A tradução mantém o hebraico como testemunho principal, usa o grego apenas como confirmação contextual e evita restringir o texto ao ascetismo ou afirmar uma doutrina explícita de mérito.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência proverbial. “Privações” preserva a amplitude semântica do hebraico, e “lhe cabe” evita linguagem excessivamente jurídica ou uma afirmação teológica mais forte do que o texto permite.
