base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/019.yaml
  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
translation:
  language: pt
  text: A insensatez e as trevas estão reservadas para os transgressores[a], e os que praticam o mal têm o mal consigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Quando ele diz: ‘Encontrei descanso e agora comerei dos meus bens’, não sabe quanto tempo passará; deixará seus bens para outros e morrerá.” O testemunho hebraico neste ponto difere profundamente da tradição grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂכְלוּת
  choice: insensatez
  rationale: Expressa falta de juízo e conduta moralmente insensata, com dignidade própria da literatura sapiencial; evita o tom mais coloquial ou meramente intelectual de “estupidez”.
- source_word: וְחֹשֶׁךְ
  choice: e as trevas
  rationale: Preserva a imagem hebraica e sua possível carga moral e desastrosa sem explicá-la além do texto.
- source_word: לְפוֹשְׁעִים
  choice: para os transgressores
  rationale: Mantém a ideia de violação deliberada ou rebelião associada à raiz פשע, sendo mais específico que “pecadores”.
- source_word: נוֹצְרָה
  choice: estão reservadas
  rationale: Comunica o sentido passivo de algo guardado ou mantido em reserva como consequência futura; a concordância plural é natural em português com o sujeito composto.
- source_word: וּמְרֵעִים
  choice: e os que praticam o mal
  rationale: Conserva a força verbal do particípio hebraico e é transparente para leitores contemporâneos.
- source_word: רָעָה
  choice: o mal
  rationale: Preserva tanto a repetição lexical com “praticam o mal” quanto a ambiguidade entre mal moral, dano e calamidade.
- source_word: עִמָּם
  choice: consigo
  rationale: Traduz de modo natural a ideia de que o mal está com essas pessoas, sem decidir se ele as acompanha como conduta ou como consequência.
theological_decisions:
- issue: Divergência acentuada entre o texto hebraico da Genizá do Cairo e a tradição grega paralela
  choice: Traduzir o hebraico preservado como texto principal e registrar a leitura grega em nota.
  alternative: 'Adotar no texto principal a leitura grega: “Quando ele diz: ‘Encontrei descanso e agora comerei dos meus bens’, não sabe quanto tempo passará; deixará seus bens para outros e morrerá.”'
  rationale: O testemunho hebraico existente tem primazia como fonte nesta passagem. Como o grego traz uma sentença inteiramente diferente, a nota conserva a transparência textual sem substituir nem harmonizar silenciosamente as tradições.
translation_notes:
  register: Português atual, claro e digno, com cadência sapiencial. “Insensatez”, “trevas” e “transgressores” preservam o peso moral do hebraico; a segunda oração mantém deliberadamente a repetição e a ambiguidade de “mal”.
