translation:
  language: pt
  text: Meu filho[a], não responda a uma questão antes de ouvi-la, nem fale no meio de uma conversa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Não discuta sobre uma questão da qual você não tem necessidade e não tome assento no julgamento com pecadores.” O hebraico preservado e o grego diferem substancialmente neste versículo; o texto principal segue o testemunho hebraico, e a leitura grega é mantida como tradição textual alternativa.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Vocativo masculino singular de pai ou mestre para seu discípulo; preserva a forma explícita do hebraico.
- source_word: אַל תָּשִׁיב דָּבָר
  choice: não responda a uma questão
  rationale: השיב significa responder ou replicar, e דָּבָר pode designar palavra, assunto ou questão. “Questão” comunica naturalmente a ideia de se pronunciar sobre algo ainda não ouvido por inteiro.
- source_word: טֶרֶם תִּשְׁמָע
  choice: antes de ouvi-la
  rationale: טֶרֶם indica anterioridade, e שמע significa ouvir. O pronome retoma “questão” e produz português claro sem acrescentar conteúdo.
- source_word: וּבְתוֹךְ שִׂיחָה
  choice: no meio de uma conversa
  rationale: שִׂיחָה pode significar fala, discurso ou conversa. A tradução mantém a formulação ampla do hebraico, sem explicitar indevidamente que se trata da fala de outra pessoa.
- source_word: אַל תְּדַבֵּר
  choice: nem fale
  rationale: דבר é o verbo comum para falar. “Nem” liga naturalmente as duas proibições coordenadas.
- source_word: περὶ πράγματος οὗ οὐκ ἔστιν σοι χρεία μὴ ἔριζε, καὶ ἐν κρίσει ἁμαρτωλῶν μὴ σύνεδρευε
  choice: não adotado no texto principal
  rationale: O grego diverge substancialmente do hebraico preservado. Como o testemunho hebraico é existente e de alta confiança, ele rege o texto principal; a tradição grega é registrada em nota.
theological_decisions:
- issue: Divergência textual entre o hebraico e o grego
  choice: Seguir o testemunho hebraico no texto principal e conservar o grego em nota
  alternative: 'Adotar no texto principal a leitura grega: “Não discuta sobre uma questão que não lhe diz respeito e não se assente em julgamento com pecadores.”'
  rationale: A fonte hebraica está preservada e foi avaliada com alta confiança. A diferença grega é extensa demais para ser harmonizada silenciosamente e deve permanecer visível como tradição textual alternativa.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial direta. “Meu filho” preserva o gênero do vocativo hebraico; “no meio de uma conversa” evita acrescentar ao texto a ideia explícita de interromper a fala de outra pessoa.
