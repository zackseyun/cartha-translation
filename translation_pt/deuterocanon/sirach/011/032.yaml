  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: pt
  text: Antes de examinar uma pessoa, não a declare feliz[a], pois uma pessoa será declarada feliz no seu fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não a declare bem-aventurada” ou “não a considere afortunada”. O hebraico emprega o mesmo verbo aqui na voz ativa e, no fim do versículo, na voz passiva.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego difere substancialmente: “De uma faísca de fogo se multiplicará um monte de brasas, e o homem pecador arma emboscadas para derramar sangue”. Isso indica uma grande divergência textual entre as testemunhas hebraica e grega deste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  choice: Antes de examinar
  rationale: Expressa de modo natural a relação temporal e o sentido de חקר, isto é, investigar ou avaliar cuidadosamente.
- source_word: אָדָם
  choice: uma pessoa
  rationale: O substantivo singular é genérico neste provérbio e designa qualquer ser humano individual; “uma pessoa” comunica esse alcance com clareza em português atual.
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: não a declare feliz
  rationale: O piel de אשר significa considerar ou proclamar alguém feliz, afortunado ou bem-aventurado. “Declarar feliz” preserva o caráter de avaliação pública sem introduzir linguagem confessional desnecessária.
- source_word: בְּאַחֲרִיתוֹ
  choice: no fim dela
  rationale: אַחֲרִית pode indicar fim, desfecho ou resultado final. A formulação mantém a abertura entre o fim da vida e o desfecho mais amplo da pessoa.
- source_word: יְאֻשַּׁר
  choice: será declarada feliz
  rationale: A forma passiva retoma deliberadamente o mesmo verbo da primeira oração; a tradução conserva essa repetição estrutural.
theological_decisions:
- issue: Sentido de אַחֲרִית na avaliação de uma vida
  choice: no fim dela
  alternative: pelo seu desfecho
  rationale: A opção principal preserva a ambiguidade do hebraico entre o fim da vida e o resultado final, sem transformar o dito em afirmação mais específica sobre juízo após a morte.
- issue: Valor de אשר
  choice: declarar feliz
  alternative: declarar bem-aventurada
  rationale: “Feliz” comunica o sentido sapiencial básico de alguém considerado afortunado ou digno de felicitação; “bem-aventurada” poderia sugerir uma categoria teológica mais estreita do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e acessível, com construção inclusiva natural. A repetição de “uma pessoa” e de “declarar feliz” reproduz a estrutura enfática do hebraico. “No fim dela” foi mantido para não eliminar a ambiguidade sapiencial de אַחֲרִית.
