  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: pt
  text: 'Não diga[a]: “Tenho o bastante diante de mim; que desastre virá sobre mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Não deixe qualquer pessoa entrar em sua casa, pois muitas são as armadilhas do enganador.” Isso reflete uma forma textual substancialmente diferente deste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz diretamente o imperativo negativo de אמר, sem convertê-lo no mais interpretativo “não pense”.
- source_word: דַּיִּי
  choice: Tenho o bastante
  rationale: Expressa a ideia de suficiência de די e mantém o sentido objetivo de possuir o necessário, em vez de enfatizar apenas satisfação subjetiva.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Preserva a imagem hebraica do que está perante a pessoa ou ao seu alcance, sem explicitação excessiva.
- source_word: מַה אָסוֹן
  choice: que desastre
  rationale: אָסוֹן indica dano grave ou calamidade; “desastre” comunica adequadamente essa gravidade.
- source_word: יְהִי עָלָי
  choice: virá sobre mim
  rationale: Segue de perto a formulação hebraica e preserva a força da pergunta retórica presunçosa sem acrescentar modalidade como “poderia”.
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: não adotado no texto principal
  rationale: O grego representa uma forma textual substancialmente diferente e não deve ser fundido com o hebraico existente; é registrado em nota como leitura alternativa.
theological_decisions:
- issue: Formas divergentes, hebraica e grega, de Sirácida 11:29
  choice: Seguir o hebraico existente no texto principal e registrar o grego em nota.
  alternative: 'Adotar como texto principal a forma grega: “Não deixe qualquer pessoa entrar em sua casa, pois muitas são as armadilhas do enganador.”'
  rationale: Como o testemunho hebraico está preservado e tem alta confiança, ele rege a tradução. A divergência material do grego é mantida de modo transparente em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Diante de mim” conserva a imagem do hebraico; “virá sobre mim” mantém a formulação direta e a tensão da pergunta retórica.
