base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/011.yaml
  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: pt
  text: Há[a] quem trabalhe, se desgaste e se apresse, mas ainda mais fique para trás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica fornecida pelos manuscritos da Geniza do Cairo não corresponde ao paralelo grego deste versículo; por isso, o texto principal segue aqui o testemunho grego. A linha hebraica diz aproximadamente: “Meu filho, por que aumentas a tua opressão? E quem a aumenta não ficará impune.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: Há
  rationale: Introduz de modo natural em português a existência de certo tipo de pessoa.
- source_word: κοπιῶν
  choice: trabalhe
  rationale: Expressa trabalho árduo e permite manter distinta a ideia seguinte de esforço desgastante.
- source_word: πονῶν
  choice: se desgaste
  rationale: Comunica o esforço penoso sem repetir simplesmente “trabalhe”.
- source_word: σπεύδων
  choice: se apresse
  rationale: Preserva o sentido contextual de pressa, embora o termo também possa indicar empenho ou zelo.
- source_word: τόσῳ μᾶλλον
  choice: cada vez mais
  rationale: 'Reproduz a progressão irônica: quanto maior o esforço, maior a desvantagem.'
- source_word: ὑστερεῖται
  choice: fique ... para trás
  rationale: Mantém aberta a natureza da insuficiência ou desvantagem, sem restringi-la à pobreza material.
theological_decisions:
- issue: Divergência entre a linha hebraica fornecida e o paralelo grego de Sirácida 11:11
  choice: Seguir no texto principal o testemunho grego coerente com este versículo e registrar a divergência em nota.
  alternative: “Meu filho, por que aumentas a tua opressão? E quem a aumenta não ficará impune.”
  rationale: A linha hebraica fornecida não corresponde ao conteúdo de Sirácida 11:11 preservado no grego e parece deslocada ou corrompida. O grego oferece uma leitura coerente no contexto, enquanto a nota conserva transparência sobre a evidência hebraica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal conserva a acumulação de esforço no grego, e a conclusão evita especificar em que sentido a pessoa fica em falta ou desvantagem.
