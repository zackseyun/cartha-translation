  text: Do not say[a], “Look, I have done what I desired; and what now will be lacking to me?”
translation:
  language: pt
  text: 'Não diga[a]: “Eis que fiz o que desejava; e o que me faltará agora?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Antes do fim, não chame ninguém de bem-aventurado; e um homem será conhecido em seus filhos.” O testemunho hebraico, porém, adverte contra dizer: “Eis que fiz o que desejava; e o que me faltará agora?”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz de modo direto e natural a proibição expressa pela partícula negativa com a forma verbal hebraica.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força apresentativa da expressão hebraica e combina com o tom autoconfiante da declaração, sem recorrer a uma formulação excessivamente coloquial.
- source_word: עָשִׂיתִי חֶפְצִי
  choice: fiz o que desejava
  rationale: Expressa a ação concluída e entende חֵפֶץ como desejo ou vontade, mantendo em português a ideia de ter realizado o próprio intento.
- source_word: וּמֶה עַתָּה
  choice: e o que ... agora
  rationale: Mantém explicitamente a conjunção hebraica e a transição retórica para a alegação de segurança futura, com ordem natural em português.
- source_word: יֵעָזֵב לִי
  choice: me faltará
  rationale: Embora a forma possa ser entendida mais literalmente como aquilo que será deixado ou restará para alguém, neste contexto a pergunta presunçosa tem o sentido natural de ‘o que ainda me faltará?’. A formulação preserva a pergunta retórica sem tornar a frase obscura.
theological_decisions:
- issue: Relação entre o texto hebraico e o paralelo grego divergente
  choice: Traduzir diretamente o testemunho hebraico existente e registrar o texto grego em nota como leitura alternativa.
  alternative: “Antes do fim, não chame ninguém de feliz; e um homem será conhecido em seus filhos.”
  rationale: O hebraico preservado tem prioridade para o texto principal. O grego apresenta uma formulação substancialmente diferente, ainda que compartilhe a advertência contra uma avaliação prematura da prosperidade; por isso, sua leitura não deve ser incorporada silenciosamente ao texto hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a função apresentativa do hebraico sem empregar o arcaísmo mais marcado “eis”, isoladamente, nem o coloquial “olhe”. A pergunta final soa natural e mantém o tom de autossuficiência censurado pelo provérbio.
