translation:
  language: pt
  text: 'E quando disser: “Encontrei descanso; agora comerei dos meus bens”,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego difere consideravelmente: “A bênção do Senhor está na recompensa do piedoso, e, em pouco tempo, faz florescer a sua bênção.” O hebraico e o grego parecem representar formas textuais diferentes neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת יֹאמַר
  choice: E, quando disser
  rationale: A expressão introduz o momento em que a pessoa fala. O futuro do hebraico permite esta formulação eventual e natural em português, sem precisar explicitar o sujeito genérico.
- source_word: מָצָאתִי נַחַת
  choice: Encontrei descanso
  rationale: O perfeito indica uma condição já alcançada segundo a perspectiva de quem fala; נַחַת designa descanso, tranquilidade ou alívio.
- source_word: וְעַתָּה אֹכַל
  choice: e agora desfrutarei
  rationale: A forma verbal é de primeira pessoa e dá continuidade à fala direta. Embora אכל signifique literalmente “comer”, neste contexto exprime usufruir aquilo que se possui; “desfrutarei” comunica esse sentido idiomático em português.
- source_word: מִטּוֹבָתִי
  choice: dos meus bens
  rationale: O sufixo hebraico é de primeira pessoa, “meus”, e טוֹבָה pode designar coisas boas, bens ou prosperidade. “Meus bens” preserva o sentido material sugerido pelo contexto.
theological_decisions:
- issue: Pessoa gramatical da segunda oração
  choice: 'Manter a primeira pessoa como continuação da fala: “desfrutarei dos meus bens”'
  alternative: 'Passar à narração em terceira pessoa: “desfrutará dos seus bens”'
  rationale: O texto hebraico vocalizado traz אֹכַל e מִטּוֹבָתִי, ambas formas de primeira pessoa. Não há razão textual suficiente para substituir essa fala direta por uma descrição em terceira pessoa.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A fala direta foi mantida conforme a gramática hebraica; “desfrutarei” traduz idiomaticamente o ato de comer dos próprios bens, evitando a formulação pouco natural “comerei dos meus bens”.
