base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: pt
  text: Se um homem entendido ouvir uma palavra sábia[a], ele a louvará e acrescentará algo a ela[b]; o homem dado aos prazeres a ouviu, mas desagradou-se dela[c] e lançou-a para trás das suas costas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma máxima sábia» ou «um ensinamento sábio». O grego pode indicar uma declaração sábia, não apenas uma palavra isolada.'
    reason: lexical_alternative
  - marker: b
    text: Isto provavelmente significa que ele desenvolverá a declaração sábia, contribuindo com mais entendimento; o grego diz literalmente que ele «acrescentará a ela».
    reason: lexical_alternative
  - marker: c
    text: A expressão grega é difícil. Também pode indicar que ele a rejeitou ou reagiu negativamente ao que ouviu.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: uma palavra sábia
  rationale: Mantém o singular e a concisão do grego; em português, pode designar uma declaração ou ensinamento sábio, não apenas um vocábulo isolado.
- source_word: ἐπιστήμων
  choice: um homem entendido
  rationale: Expressa alguém dotado de conhecimento e discernimento, preservando a forma masculina singular representativa do provérbio.
- source_word: αἰνέσει αὐτόν
  choice: ele a louvará
  rationale: Traduz diretamente a reação positiva futura diante da palavra sábia; o pronome feminino concorda naturalmente com «palavra» em português.
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: acrescentará algo a ela
  rationale: Conserva a imagem de adicionar à declaração sábia sem definir em excesso se se trata de explicação, aplicação ou nova percepção.
- source_word: ὁ σπαταλῶν
  choice: o homem dado aos prazeres
  rationale: O particípio caracteriza alguém indulgente, dissoluto ou extravagante. A formulação portuguesa comunica a autoindulgência sem restringir o sentido somente ao desperdício financeiro.
- source_word: ἀπῄρεσεν αὐτῷ
  choice: a rejeitou
  rationale: A expressão grega é difícil neste contexto. A sequência, na qual a palavra é lançada para trás das costas, indica uma reação negativa e de repúdio; a nota preserva a incerteza lexical.
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: a lançou para trás das costas
  rationale: Preserva a imagem concreta e enfática do grego, que representa o ato de descartar ou ignorar o que foi ouvido.
theological_decisions:
- issue: Masculino singular representativo em um provérbio sapiencial
  choice: «um homem entendido» e «o homem dado aos prazeres»
  alternative: «uma pessoa entendida» e «a pessoa dada aos prazeres»
  rationale: As formas gregas são masculinas singulares e estabelecem duas figuras proverbiais em contraste; a tradução preserva essa configuração sem fazer dela uma afirmação exclusiva sobre homens.
- issue: Sentido de «acrescentará»
  choice: 'Manter a ação aberta: «acrescentará algo a ela»'
  alternative: Explicitar como «desenvolverá o ensinamento» ou «contribuirá com nova percepção»
  rationale: O grego não especifica o conteúdo nem a natureza do acréscimo; explicá-lo no corpo do texto resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Homem entendido» mantém o tom proverbial sem soar técnico; «dado aos prazeres» comunica melhor a autoindulgência de σπαταλῶν do que «esbanjador», que em português tenderia a limitar o sentido ao dinheiro. A mudança do futuro na primeira oração para o passado na segunda foi preservada conforme o grego.
