  yaml_path: translation/deuterocanon/sirach/021/018.yaml
  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
translation:
  language: pt
  text: Como uma casa em ruínas[a], assim é a sabedoria para o insensato; e o conhecimento de quem não tem entendimento são palavras que não podem ser examinadas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma casa destruída»; o particípio grego também pode indicar algo aniquilado ou feito desaparecer.
    reason: lexical_alternative
  - marker: b
    text: Ou «palavras incompreensíveis»; o grego pode destacar tanto a falta de inteligibilidade quanto a impossibilidade de investigar significativamente essas palavras.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: uma casa em ruínas
  rationale: O particípio de ἀφανίζω pode indicar algo destruído, arruinado ou feito desaparecer. «Casa em ruínas» conserva a imagem concreta e comunica naturalmente a ideia de perda e inutilidade.
- source_word: μωρῷ
  choice: para o insensato
  rationale: O dativo expressa relação ou referência. «Para o insensato» é natural em português e preserva o sentido sem confundi-lo com ἀσύνετος no segundo membro.
- source_word: σοφία
  choice: sabedoria
  rationale: Equivalente corrente e adequado ao contexto sapiencial.
- source_word: γνῶσις
  choice: conhecimento
  rationale: Mantém a distinção lexical em relação a σοφία («sabedoria») e o paralelismo do verso.
- source_word: ἀσυνέτου
  choice: de quem não tem entendimento
  rationale: Expressa a falta de compreensão ou discernimento e evita repetir «insensato», usado para μωρός no primeiro membro.
- source_word: ἀδιεξέταστοι λόγοι
  choice: palavras que não podem ser examinadas
  rationale: Preserva a noção de palavras que não podem ser investigadas ou percorridas de modo inteligível, sem decidir silenciosamente entre impossibilidade de exame e incompreensibilidade.
