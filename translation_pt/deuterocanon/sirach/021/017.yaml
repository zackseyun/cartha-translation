  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
translation:
  language: pt
  text: A boca do sábio será buscada na assembleia[a], e suas palavras serão ponderadas no coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na congregação».'
    reason: lexical_alternative
  - marker: b
    text: Em grego, literalmente, «no coração»; não se expressa explicitamente quem ponderará as palavras.
    reason: source_ambiguity
lexical_decisions:
- source_word: στόμα
  choice: boca
  rationale: 'Mantém a imagem concreta e metonímica do grego: é a fala do sábio, representada por sua boca, que a comunidade valoriza.'
- source_word: φρονίμου
  choice: do sábio
  rationale: O adjetivo masculino singular substantivado modifica «boca». «Sábio» é natural no contexto sapiencial e conserva a forma masculina do grego.
- source_word: ζητηθήσεται
  choice: será buscada
  rationale: Reproduz diretamente o futuro passivo de ζητέω. No contexto, pode ter o sentido de ser procurada ou estimada, sem que a tradução elimine essa amplitude.
- source_word: ἐν ἐκκλησίᾳ
  choice: na assembleia
  rationale: Designa a comunidade reunida; «assembleia» evita importar o sentido institucional cristão posterior de «igreja».
- source_word: τοὺς λόγους αὐτοῦ
  choice: suas palavras
  rationale: É o equivalente amplo e idiomático de λόγους αὐτοῦ, preservando a referência ao sábio.
- source_word: διανοηθήσεται
  choice: serão ponderadas
  rationale: A formulação passiva em português comunica a consideração reflexiva indicada pelo verbo e evita impor ao singular grego um sujeito expresso que o texto não identifica claramente.
- source_word: ἐν καρδίᾳ
  choice: no coração
  rationale: Segue o singular sem possessivo do grego e preserva «coração» como centro da reflexão interior, sem reduzi-lo apenas à mente.
theological_decisions:
- issue: Forma masculina de φρονίμου
  choice: do sábio
  alternative: da pessoa sábia
  rationale: O grego apresenta uma forma masculina singular substantivada. A tradução conserva esse dado textual sem transformá-lo em uma afirmação doutrinária sobre quem pode possuir sabedoria.
- issue: Sentido de ἐκκλησία no contexto sapiencial
  choice: assembleia
  alternative: congregação; igreja
  rationale: O contexto fala da comunidade reunida, não necessariamente da instituição cristã posterior; «assembleia» mantém essa referência sem antecipar uma leitura eclesiológica.
- issue: Sujeito implícito de διανοηθήσεται
  choice: 'construção passiva: «suas palavras serão ponderadas»'
  alternative: «alguém ponderará suas palavras»; «eles ponderarão suas palavras»
  rationale: A forma verbal grega está no singular e não explicita seu sujeito. A construção portuguesa preserva o sentido comunitário e reflexivo sem inserir um sujeito plural ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário sapiencial corrente. Conserva-se a imagem concreta de «boca» e evita-se «igreja» por sua possível carga institucional posterior. A segunda oração foi formulada na passiva para soar natural em português e, ao mesmo tempo, não resolver indevidamente a ambiguidade sintática do grego.
