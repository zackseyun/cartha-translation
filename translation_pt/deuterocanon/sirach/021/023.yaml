  register: Português atual, digno e proverbial, com ampla legibilidade brasileira. “Insensato” preserva o caráter moral do vocabulário sapiencial; “homem honrado” traduz de modo natural a expressão hebraica comprimida. O marcador da nota aparece no texto principal.
