  text: A fool peers into a house from the doorway[b][a], but an honorable man will stand outside and speak.
translation:
  language: pt
  text: O insensato espia para dentro de uma casa, à porta, mas o homem honrado fica do lado de fora e fala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “e honra para o homem que fica do lado de fora e fala”, uma expressão condensada. O paralelo grego traz “mas um homem instruído ficará do lado de fora” e não inclui “e fala”.'
    reason: textual_variant
lexical_decisions:
- source_word: אֱוִיל
  choice: o insensato
  rationale: Termo sapiencial que descreve insensatez moral e social, não mera falta de inteligência; mantém o tom proverbial.
- source_word: מִפֶּתַח יַבִּיט אֶל בָּיִת
  choice: espia uma casa desde a entrada
  rationale: Expressa o olhar dirigido para dentro a partir da entrada e conserva a conotação de intromissão, também apoiada pelo grego παρακύπτει.
- source_word: וְכָבוֹד לְאִישׁ
  choice: mas o homem honrado
  rationale: O hebraico é comprimido, literalmente algo como 'e honra para o homem'; esta formulação natural associa a conduta seguinte a uma pessoa digna e respeitosa sem depender do grego.
- source_word: בַּחוּץ יַעֲמוֹד
  choice: fica do lado de fora
  rationale: Tradução idiomática da postura respeitosa descrita, confirmada pelo paralelo grego.
- source_word: וִידַבֵּר
  choice: e fala
  rationale: Mantém o verbo presente no testemunho hebraico, provavelmente indicando que a pessoa se anuncia ou fala sem entrar indevidamente.
