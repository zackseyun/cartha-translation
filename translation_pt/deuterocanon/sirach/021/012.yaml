  text: He who is not shrewd will not be instructed;[a]
translation:
  language: pt
  text: Quem não é sagaz não será instruído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esperto” ou “prudente”; em outros contextos, a palavra grega também pode ter sentido negativo, como “ardiloso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: não será instruído
  rationale: O futuro passivo de παιδεύω pode indicar ensino, formação ou disciplina. “Será instruído” mantém o sentido de receber ensino corretivo sem restringi-lo a punição ou escolarização formal.
- source_word: ὃς
  choice: quem
  rationale: O pronome relativo introduz uma pessoa genérica. “Quem” é natural em português e não acrescenta uma especificação de gênero ausente como referência necessária no provérbio.
- source_word: οὐκ ἔστιν
  choice: não é
  rationale: Reproduz de modo direto a construção copulativa grega, sem expansão interpretativa desnecessária.
- source_word: πανοῦργος
  choice: sagaz
  rationale: O termo pode descrever alguém perspicaz ou habilidoso, mas em outros contextos pode ter sentido negativo, como ardiloso. “Sagaz” preserva aqui a ideia de agudeza prática sem atribuir necessariamente desonestidade nem moralizar o termo como faria “prudente”.
theological_decisions:
- issue: Valor moral de πανοῦργος neste dito sapiencial
  choice: 'Usar um sentido relativamente neutro ou positivo: “sagaz”.'
  alternative: “astuto”, “esperto” ou “prudente”
  rationale: Como o versículo relaciona essa qualidade à capacidade de receber instrução, uma tradução inequivocamente negativa sugeriria que a malícia é necessária para aprender. “Sagaz” conserva a agudeza do termo, enquanto a nota registra sua amplitude sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Sagaz” é amplamente compreensível e preserva melhor que “prudente” a vivacidade e a ambivalência potencial do termo grego.
