  text: The inward parts of a fool are like a broken vessel[a], and they will not hold any knowledge.
translation:
  language: pt
  text: O interior do insensato é como um recipiente quebrado[a] e não reterá conhecimento algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma vasilha despedaçada”. A imagem grega é a de um recipiente quebrado, incapaz de conservar o que nele é colocado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγκατα
  choice: o interior
  rationale: O termo designa literalmente as entranhas ou partes internas e pode representar o ser interior. “O interior” mantém a imagem corporal de modo natural em português e permite a comparação concreta com um recipiente.
- source_word: μωροῦ
  choice: do insensato
  rationale: No contexto sapiencial, μωρός caracteriza quem carece de juízo tanto moral quanto intelectual. “Insensato” preserva o tom proverbial sem sugerir apenas pouca inteligência.
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: como um recipiente quebrado
  rationale: ἄγγιον é um recipiente de tipo não especificado, e συντετριμμένον indica que foi quebrado ou despedaçado. A formulação conserva a imagem sem determinar indevidamente o material ou o formato.
- source_word: πᾶσαν γνῶσιν
  choice: conhecimento algum
  rationale: Sob a negação οὐ, a expressão é vertida idiomaticamente como “conhecimento algum”, comunicando que nenhum conhecimento fica retido.
- source_word: οὐ κρατήσει
  choice: não reterá
  rationale: κρατέω pode significar segurar, conservar ou reter. “Reterá” preserva tanto a incapacidade de conservar o conhecimento quanto a metáfora do recipiente que não segura seu conteúdo.
theological_decisions:
- issue: Referente implícito do verbo singular κρατήσει
  choice: A frase portuguesa mantém o sujeito singular “o interior” implícito em “não reterá”.
  alternative: “E ele não reterá conhecimento algum”, tomando “o insensato” como sujeito lógico; ou “e não reterão”, concordando com o plural literal ἔγκατα.
  rationale: O grego traz ἔγκατα no plural, mas κρατήσει na terceira pessoa do singular. Verter ἔγκατα pelo coletivo singular “o interior” reproduz a imagem e acomoda a forma singular do verbo sem inserir um pronome que resolva explicitamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. “Insensato” e “conhecimento” mantêm a dignidade do registro sapiencial; “recipiente quebrado” conserva a metáfora concreta sem arcaísmo.
