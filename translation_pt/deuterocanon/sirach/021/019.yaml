  text: Instruction is shackles on the feet of the senseless[a], and like handcuffs on the right hand.
translation:
  language: pt
  text: A instrução é como grilhões nos pés de quem não tem entendimento[a] e como algemas na mão direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A disciplina é como grilhões nos pés do insensato e como algemas na mão direita.”'
    reason: Alternativa lexical para παιδεία e ἀνοήτοις, preservando a leitura mais concisa e tradicional.
lexical_decisions:
- source_word: πέδαι
  choice: grilhões
  rationale: Designa restrições presas aos pés; “grilhões” preserva com clareza a imagem concreta.
- source_word: ἐν ποσὶν
  choice: nos pés
  rationale: Indica onde os grilhões são colocados e reproduz naturalmente a imagem corporal em português.
- source_word: ἀνοήτοις
  choice: quem não tem entendimento
  rationale: Expressa a falta de compreensão própria da literatura sapiencial sem transformar necessariamente o termo em um rótulo fixo como “tolo”.
- source_word: παιδεία
  choice: instrução
  rationale: Abrange ensino e formação; neste contexto, a metáfora mostra como a pessoa sem entendimento os percebe como restrição.
- source_word: χειροπέδαι
  choice: algemas
  rationale: É o equivalente moderno e facilmente compreensível para restrições das mãos.
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: na mão direita
  rationale: Preserva tanto a especificação da mão direita quanto o singular incomum do grego.
