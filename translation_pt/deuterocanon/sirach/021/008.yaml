  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: pt
  text: Quem constrói sua casa com o dinheiro alheio é como quem ajunta suas pedras para o inverno.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os bens de outros”. O grego pode abranger dinheiro, riqueza, bens ou recursos pertencentes a outra pessoa.
    reason: lexical_alternative
  - marker: b
    text: “Para o inverno” também pode significar “para a estação das tempestades”, reforçando a imagem de uma construção insegura ou inútil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: Quem constrói
  rationale: O particípio presente substantivado tem sentido genérico e proverbial; esta forma é natural, inclusiva e fiel em português.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: sua casa
  rationale: Embora οἰκία também possa indicar família ou casa doméstica, o verbo construir e a menção de pedras favorecem o edifício literal.
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: com o dinheiro alheio
  rationale: χρήματα pode significar dinheiro, bens ou recursos, e ἀλλότριος indica aquilo que pertence a outra pessoa. “Dinheiro alheio” expressa a ideia de recursos que não pertencem ao construtor sem sugerir moeda estrangeira.
- source_word: ὡς συνάγων
  choice: é como quem ajunta
  rationale: ὡς com o particípio introduz uma comparação; “é como quem” mantém a forma explícita e proverbial.
- source_word: αὐτοῦ τοὺς λίθους
  choice: suas pedras
  rationale: Preserva o pronome possessivo do texto grego, embora seu referente exato não seja totalmente explícito.
- source_word: εἰς χειμῶνα
  choice: para o inverno
  rationale: χειμών pode designar inverno ou estação de tempestades; a tradução principal conserva o sentido mais direto e deixa a nuance alternativa em nota.
