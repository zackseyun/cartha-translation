  text: When the ungodly curses the Adversary[a], he curses his own soul.
translation:
  language: pt
  text: Quando o ímpio amaldiçoa o Adversário[a], amaldiçoa a própria alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Satanás”. O grego traz satanás, termo transliterado que significa “adversário”.'
    reason: Registra a alternativa tradicional como nome próprio e esclarece o sentido do termo grego.
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: Quando ... amaldiçoa
  rationale: A construção com ἐν e infinitivo articular expressa aqui uma circunstância temporal; “Quando” comunica isso de modo natural em português.
- source_word: ἀσεβῆ
  choice: o ímpio
  rationale: Embora a forma seja morfologicamente acusativa, ela funciona como sujeito do infinitivo. “O ímpio” preserva o singular genérico e o sentido moral-religioso.
- source_word: τὸν σατανᾶ
  choice: o Adversário
  rationale: σατανᾶς translitera um termo semítico que significa “adversário” ou “acusador”. A tradução mantém esse conteúdo lexical, enquanto a inicial maiúscula sinaliza um referente pessoal sem impor de modo absoluto o uso como nome próprio.
- source_word: αὐτὸς
  choice: sujeito implícito de “amaldiçoa”
  rationale: αὐτός retoma com leve ênfase o sujeito anterior. Em português, a continuidade do sujeito fica clara sem repetir “ele”, evitando rigidez desnecessária.
- source_word: καταρᾶται
  choice: amaldiçoa
  rationale: O mesmo verbo ocorre nas duas partes do versículo; repetir “amaldiçoa” conserva o paralelismo retórico.
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: a própria alma
  rationale: ψυχή pode significar “vida”, “ser” ou “alma”; “alma” preserva o peso moral e espiritual da máxima, e “própria” expressa ἑαυτοῦ.
theological_decisions:
- issue: Se σατανᾶ deve ser traduzido como título/substantivo ou transliterado como o nome próprio Satanás
  choice: o Adversário
  alternative: Satanás
  rationale: O termo grego conserva o sentido lexical de “adversário”, plausível neste dito sapiencial. A tradução evita fixar além do necessário um uso posterior como nome próprio; a alternativa tradicional é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa preserva o paralelismo do original e mantém “alma” em vez de reduzir a expressão a “si mesmo”.
