  text: Three things I hated[a], and four I did not love.
translation:
  language: pt
  text: Filho, você pecou? Não peque mais e ore a respeito dos seus pecados passados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada e fornecida para este local não corresponde a Sirácida 21:1; ela diz: “Três coisas odiei, e quatro não amei.” Por isso, este versículo segue o testemunho grego correspondente.'
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: Filho
  rationale: Vocativo direto que mantém o tom de instrução sapiencial. O grego não traz possessivo, por isso não se acrescentou “meu”; embora o substantivo português tenha gênero gramatical, aqui funciona como forma tradicional e natural de tratamento.
- source_word: ἥμαρτες
  choice: você pecou?
  rationale: O aoristo de ἁμαρτάνω é vertido como pergunta sobre um ato passado, preservando seu sentido moral e religioso sem recorrer a uma paráfrase.
- source_word: μὴ προσθῇς μηκέτι
  choice: Não peque mais
  rationale: A expressão idiomática significa literalmente não acrescentar ou repetir. Em contexto, proíbe a continuação do pecado; esta formulação é clara e natural em português.
- source_word: περὶ τῶν προτέρων σου
  choice: a respeito dos seus pecados passados
  rationale: O grego diz literalmente “a respeito das suas coisas anteriores”. “Pecados” é recuperado do contexto imediato, tornando explícito em português o referente elíptico.
- source_word: δεήθητι
  choice: ore
  rationale: O imperativo de δέομαι pode significar pedir, suplicar ou orar. “Ore” é corrente, digno e adequado ao contexto penitencial, sem explicitar um pedido de perdão que não aparece no texto.
theological_decisions:
- issue: Seleção do texto-base diante da divergência do hebraico fornecido
  choice: Traduzir o paralelo grego que corresponde a Sirácida 21:1 e registrar a divergência em nota.
  alternative: 'Traduzir a linha hebraica fornecida: “Três coisas odiei, e quatro não amei.”'
  rationale: A linha hebraica anexada não corresponde semanticamente ao versículo identificado e parece estar deslocada. O paralelo grego contém o texto reconhecível de Sirácida 21:1; por isso, ele governa a tradução, sem ocultar a incerteza documental.
- issue: Conteúdo da súplica
  choice: Manter “ore a respeito dos seus pecados passados”.
  alternative: “Peça perdão pelos seus pecados passados.”
  rationale: O pedido de perdão é plausível no contexto, mas o verbo grego não declara expressamente seu conteúdo nem seu destinatário. A redação escolhida preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém o tom direto da admoestação sapiencial. O marcador de nota aparece no texto principal.
