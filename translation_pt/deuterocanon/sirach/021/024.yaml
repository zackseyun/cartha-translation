  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: pt
  text: É falta de educação da parte de um homem escutar junto à porta[a], mas o homem prudente ficará oprimido pela desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “escutar junto à porta”; a expressão sugere ouvir às escondidas, sem tornar essa implicação explícita no texto principal.
