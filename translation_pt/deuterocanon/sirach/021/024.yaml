lexical_decisions:
- source_word: ἀπαιδευσία
  choice: falta de educação
  rationale: Expressa a ausência de formação e boas maneiras, incluindo o comportamento inconveniente, em português corrente e digno.
- source_word: ἀνθρώπου
  choice: '[implícito na formulação geral]'
  rationale: O genitivo liga a falta de educação ao ser humano em sentido geral; em português, a construção impessoal soa mais natural sem perder o alcance genérico.
- source_word: ἀκροᾶσθαι
  choice: escutar
  rationale: Mantém o sentido literal de ouvir atentamente; o contexto da porta sugere espionagem sem explicitá-la indevidamente.
- source_word: παρὰ θύραν
  choice: junto à porta
  rationale: Reproduz a posição indicada por παρά com acusativo e conserva a imagem concreta do original.
- source_word: φρόνιμος
  choice: homem prudente
  rationale: Comunica sabedoria prática e bom senso, preservando o substantivo masculino singular expresso no grego.
- source_word: βαρυνθήσεται
  choice: ficará pesaroso
  rationale: Conserva a metáfora de peso em linguagem portuguesa natural e indica a reação interior provocada pela desonra.
- source_word: ἀτιμίᾳ
  choice: com a desonra
  rationale: Mantém o campo social e moral de perda de honra; a preposição deixa aberta a relação como causa ou circunstância.
