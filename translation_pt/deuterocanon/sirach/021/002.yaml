base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/002.yaml
  text: Flee from sin as from the face of a snake[a]; for if you come near it, it will bite you.[b]
translation:
  language: pt
  text: Fuja do pecado como se foge da presença de uma serpente[a], pois, se você se aproximar, ela o morderá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como da face/presença de uma serpente”. A expressão grega descreve um encontro direto com a serpente.
    reason: lexical_alternative
  - marker: b
    text: A linha hebraica dos manuscritos da Guenizá do Cairo fornecida para este versículo não corresponde ao texto grego e parece estar deslocada. Por isso, a tradução segue aqui o testemunho grego.
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: Fuja
  rationale: O imperativo grego exprime afastamento urgente e deliberado. “Fuja” conserva a força concreta da advertência.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: É o equivalente português corrente que preserva o peso moral e teológico de ἁμαρτία.
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: como se foge da presença de uma serpente
  rationale: A formulação naturaliza a comparação em português sem apagar πρόσωπον, aqui entendido como “presença” ou encontro direto; “serpente” mantém o tom digno e a imagem concreta.
- source_word: ἐὰν ... προσέλθῃς
  choice: se você se aproximar
  rationale: Traduz de modo direto a ideia de chegar perto, mantendo como referente tanto a serpente da imagem quanto, figuradamente, o pecado.
- source_word: δήξεταί σε
  choice: ela o morderá
  rationale: O verbo grego significa especificamente “morder”; o pronome feminino retoma naturalmente “serpente” em português.
theological_decisions:
- issue: Base textual diante da divergência entre o hebraico fornecido e o paralelo grego
  choice: Seguir o testemunho grego no texto principal
  alternative: Traduzir a linha hebraica fornecida sobre um governante habituado a casas de bebida
  rationale: A linha hebraica preservada no material fornecido não corresponde a Sirácida 21:2 e parece estar deslocada. O grego contém a forma coerente e tradicionalmente atestada do versículo; a nota explicita a incerteza textual, sem ocultá-la.
- issue: Personificação metafórica do pecado
  choice: Conservar a imagem da serpente que morde
  alternative: Explicitar que o pecado causa dano
  rationale: A metáfora original deve permanecer aberta e concreta, sem substituí-la por uma interpretação teológica explicativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “como se foge” evita a estranheza de uma reprodução excessivamente literal, enquanto “presença” preserva o elemento concreto do grego. Os marcadores [a] e [b] aparecem no texto principal.
