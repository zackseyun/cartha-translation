  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
translation:
  language: pt
  text: O tolo ergue a voz ao rir, mas o homem sagaz mal sorrirá em silêncio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mal sorrirá quietamente”. A expressão grega reúne de forma compacta as ideias de quase não sorrir, quietude e contenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: tolo
  rationale: Termo tradicional e natural da literatura sapiencial para alguém sem discernimento moral e prático; preserva o tom proverbial.
- source_word: ἐν γέλωτι
  choice: ao rir
  rationale: Expressa em português corrente a circunstância em que o tolo ergue a voz, sem tornar a formulação pesada.
- source_word: ἀνυψοῖ φωνὴν αὐτοῦ
  choice: ergue a voz
  rationale: Equivalente idiomático direto, que comunica o riso ruidoso em contraste com a discrição da segunda oração.
- source_word: ἀνήρ
  choice: homem
  rationale: Mantém o substantivo masculino singular explícito do grego e o paralelismo proverbial.
- source_word: πανοῦργος
  choice: sagaz
  rationale: Neste contexto, indica inteligência prática e domínio social; “sagaz” conserva essa ideia sem impor necessariamente o sentido negativo de “ardiloso”.
- source_word: μόλις
  choice: mal
  rationale: Reproduz de modo conciso o sentido de “quase não” ou “apenas com dificuldade”, adequado ao registro proverbial.
- source_word: ἡσυχῇ
  choice: em silêncio
  rationale: Dativo de valor adverbial que comunica quietude e contenção, em contraste direto com a voz erguida do tolo.
- source_word: μειδιάσει
  choice: sorri
  rationale: Distingue o sorriso contido do riso sonoro indicado por γέλως na primeira oração.
