  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
translation:
  language: pt
  text: Quem guarda a Lei domina o próprio entendimento[a], e a plenitude do temor do Senhor é a sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mantém firme sua intenção”, “domina a própria mente” ou “preserva seu entendimento”. A expressão grega é compacta, e ἐννόημα pode significar pensamento, intenção ou entendimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων
  choice: Quem guarda
  rationale: O particípio presente substantivado tem sentido geral e contínuo. “Quem guarda” é natural em português e preserva as ideias de observar e conservar fielmente.
- source_word: νόμον
  choice: a Lei
  rationale: Embora νόμον não tenha artigo no grego, o contexto sapiencial judaico aponta para o corpo conhecido da instrução divina. A inicial maiúscula esclarece essa referência sem acrescentar conteúdo denominacional.
- source_word: κατακρατεῖ
  choice: domina
  rationale: O verbo pode significar apoderar-se, reter firmemente ou exercer domínio. Com o genitivo seguinte, “domina” exprime de modo conciso a ideia de alcançar controle ou senhorio sobre a faculdade interior.
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: o próprio entendimento
  rationale: ἐννόημα pode indicar pensamento, intenção ou entendimento. “O próprio entendimento” se ajusta ao contexto sapiencial e verte αὐτοῦ naturalmente, sem eliminar em nota a amplitude lexical.
- source_word: συντέλεια
  choice: a plenitude
  rationale: συντέλεια designa conclusão, consumação ou aquilo que chega à sua medida completa. “Plenitude” soa natural e digna em português e preserva a noção de pleno cumprimento sem sugerir necessariamente um evento escatológico.
- source_word: τοῦ φόβου Κυρίου
  choice: do temor do Senhor
  rationale: Mantém a expressão sapiencial tradicional para a reverência dirigida ao Senhor.
- source_word: σοφία
  choice: a sabedoria
  rationale: Equivalente direto e corrente do termo sapiencial σοφία; o artigo resulta natural na construção portuguesa.
theological_decisions:
- issue: Relação entre guardar a Lei e a faculdade interior em κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ
  choice: Guardar a Lei permite à pessoa dominar o próprio entendimento.
  alternative: Guardar a Lei faz a pessoa manter firme sua intenção ou preservar seu entendimento.
  rationale: A construção grega é compacta, e tanto o verbo quanto o substantivo admitem mais de uma nuance. A leitura principal comunica disciplina e domínio da vida interior, enquanto a nota preserva as alternativas legítimas sem resolver indevidamente a ambiguidade.
- issue: Sentido de συντέλεια na relação entre temor do Senhor e sabedoria
  choice: A sabedoria é a plenitude do temor do Senhor.
  alternative: A sabedoria é o cumprimento, a conclusão ou a consumação do temor do Senhor.
  rationale: “Plenitude” mantém a ideia de algo levado à sua medida completa e evita impor uma leitura cronológica ou escatológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lei”, “temor do Senhor” e “sabedoria” conservam o registro sapiencial bíblico; a ambiguidade da expressão interior é preservada em nota.
