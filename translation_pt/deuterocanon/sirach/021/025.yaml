  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
translation:
  language: pt
  text: Os lábios dos estranhos ficarão pesados por causa dessas coisas[a], mas as palavras dos sábios serão colocadas na balança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nessas coisas»; a expressão grega admite essa tradução mais literal, embora «por causa dessas coisas» comunique melhor o provável sentido no contexto.
    reason: lexical_alternative
  - marker: b
    text: A imagem de serem colocadas na balança sugere que os sábios falam com ponderação e juízo medido.
    reason: cultural_note
lexical_decisions:
- source_word: χείλη
  choice: lábios
  rationale: Preserva a imagem concreta e a metonímia dos lábios pela fala, sem reduzi-la ao termo abstrato «discurso».
- source_word: ἀλλοτρίων
  choice: dos estranhos
  rationale: Expressa pessoas alheias ou de fora sem especificar indevidamente uma origem étnica ou nacional.
- source_word: ἐν τούτοις
  choice: com essas coisas
  rationale: Retoma os assuntos anteriores e transmite de modo natural o possível sentido instrumental ou causal da expressão grega; a leitura mais literal «nessas coisas» permanece indicada em nota.
- source_word: βαρυνθήσεται
  choice: ficarão pesados
  rationale: Conserva a metáfora de adquirir peso ou ser sobrecarregado e prepara a imagem da balança na segunda oração. O verbo fica no plural em português para concordar naturalmente com «lábios».
- source_word: λόγοι
  choice: palavras
  rationale: É o equivalente direto e conciso, apropriado ao estilo proverbial da literatura sapiencial.
- source_word: φρονίμων
  choice: dos sábios
  rationale: Traduz o adjetivo substantivado com a expressão tradicional e clara da literatura sapiencial, sem excluir a nuance de prudência ou sensatez.
- source_word: ἐν ζυγῷ
  choice: na balança
  rationale: Neste contexto de peso e medida, ζυγός designa uma balança ou seu travessão, não um jugo.
- source_word: σταθήσονται
  choice: se manterão
  rationale: Preserva a ideia de permanecer ou firmar-se na balança, evitando decidir de modo excessivo entre a noção de ser colocado e a de permanecer sob avaliação.
