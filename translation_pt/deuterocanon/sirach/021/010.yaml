translation:
  language: pt
  text: O caminho dos pecadores é pavimentado com pedras[a], e no fim dele está a cova do Hades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi aplanado com pedras”. O particípio grego pode destacar uma estrada tornada plana ou regular; “pavimentado com pedras” explicita a provável imagem viária.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Hades” se refere à morada dos mortos; também se pode traduzir por “mundo dos mortos”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: caminho
  rationale: Preserva tanto a imagem concreta de uma via quanto o sentido metafórico de modo de vida ou conduta.
- source_word: ἁμαρτωλῶν
  choice: dos pecadores
  rationale: Reproduz de modo direto e conciso o genitivo descritivo/possessivo, sem atenuar a categoria moral.
- source_word: ὡμαλισμένη
  choice: é pavimentado
  rationale: O particípio indica tornar plano, regular ou liso; em combinação com ἐκ λίθων, sugere uma via preparada ou revestida de pedras.
- source_word: ἐκ λίθων
  choice: com pedras
  rationale: É a construção idiomática em português com “pavimentado” e conserva a ideia do material empregado.
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: no fim dele
  rationale: Expressa claramente o extremo ou destino final do caminho; o pronome masculino concorda naturalmente com “caminho” em português.
- source_word: βόθρος
  choice: cova
  rationale: Transmite a imagem de uma cavidade profunda e ameaçadora, adequada ao contexto de morte e ruína.
- source_word: ᾅδου
  choice: do Hades
  rationale: Mantém o termo grego que designa o domínio dos mortos e evita identificá-lo automaticamente com uma formulação doutrinária posterior sobre o inferno.
theological_decisions:
- issue: Tradução de ᾅδου na imagem sapiencial
  choice: Hades
  alternative: morada dos mortos; mundo dos mortos; sepultura
  rationale: O texto grego emprega explicitamente ᾅδης. “Hades” preserva o universo conceitual da Septuaginta e a tensão do texto sem reduzi-lo à sepultura nem importá-lo como sinônimo inequívoco de inferno.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a metáfora concreta da estrada e evita confundir Hades automaticamente com inferno.
