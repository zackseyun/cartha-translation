  text: The prayer of a poor man goes from his mouth to his ears[b][a], and his judgment comes quickly.
translation:
  language: pt
  text: A súplica do pobre vai de sua boca aos ouvidos dele[a], e seu julgamento[b] chega depressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da boca aos ouvidos dele”. O pronome pode referir-se a Deus; nesse caso, a súplica do pobre chega aos ouvidos de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua causa” ou “sua justiça”. O termo grego pode designar um julgamento ou decisão relativa ao caso do pobre.
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  choice: súplica
  rationale: Expressa um pedido insistente e dirigido a Deus; em português, “súplica” preserva melhor que o termo genérico “oração” a urgência do substantivo grego.
- source_word: πτωχοῦ
  choice: do pobre
  rationale: Reproduz de modo natural o genitivo masculino singular e designa a pessoa pobre sem acrescentar qualificações ausentes do grego.
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: da sua boca aos ouvidos dele
  rationale: Mantém a imagem e a ambiguidade pronominal do grego. “Dele” evita fazer com que “seus ouvidos” pareça necessariamente referir-se ao pobre; a nota registra que o referente mais provável é Deus.
- source_word: κρίμα
  choice: julgamento em seu favor
  rationale: κρίμα pode indicar a decisão judicial proferida no caso do pobre. “Em seu favor” torna inteligível a função contextual da decisão sem reduzir o termo simplesmente a “justiça”; a nota preserva alternativas possíveis.
- source_word: κατὰ σπουδήν
  choice: depressa
  rationale: Comunica de maneira atual e natural a prontidão ou rapidez expressa pela locução grega.
- source_word: ἔρχεται
  choice: chega
  rationale: Preserva o movimento figurado e a vivacidade do presente grego, além de combinar naturalmente com a ideia de uma decisão que chega.
theological_decisions:
- issue: Referente de αὐτοῦ em “aos ouvidos dele”
  choice: Manter o pronome no texto e explicar que provavelmente se refere a Deus.
  alternative: Explicitar no texto “aos ouvidos de Deus” ou entender os ouvidos como os do próprio pobre.
  rationale: Deus não é nomeado no verso, embora o contexto da súplica e da decisão pronta favoreça fortemente Deus como ouvinte e juiz. A formulação conserva a ambiguidade formal em vez de inserir o referente diretamente.
- issue: Sentido de κρίμα
  choice: “julgamento em seu favor”, entendido como a decisão relativa à causa do pobre.
  alternative: “julgamento”, “causa”, “sentença” ou “justiça”.
  rationale: O termo possui amplitude judicial. O contexto sugere uma decisão que responde à súplica do pobre, mas a nota reconhece que o grego também pode ser vertido de outras maneiras.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das notas segue sua ocorrência no texto. A construção conserva a imagem concreta do grego e documenta, sem ocultá-la, a ambiguidade do pronome.
