base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/013.yaml
  text: The knowledge of a wise man will increase like a flood[b][a], and his counsel is like a spring of life.
translation:
  language: pt
  text: O conhecimento de um homem sábio[a] aumentará como uma inundação, e o seu conselho é como uma fonte de vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do sábio”. O grego emprega o masculino singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma nascente de vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶσις
  choice: conhecimento
  rationale: É o equivalente mais direto de γνῶσις e preserva a ideia de saber que cresce em abundância.
- source_word: σοφοῦ
  choice: de um homem sábio
  rationale: O genitivo masculino singular apresenta um sábio como exemplo individual; a formulação mantém número e gênero do grego.
- source_word: ὡς κατακλυσμός
  choice: como uma inundação
  rationale: κατακλυσμός designa uma grande quantidade de água que transborda ou cobre a terra; «inundação» é claro e atual em português.
- source_word: πληθυνθήσεται
  choice: aumentará
  rationale: O futuro indica crescimento ou multiplicação; «aumentará» comunica isso naturalmente sem tornar a frase mecânica.
- source_word: βουλή
  choice: conselho
  rationale: No contexto sapiencial, βουλή se refere adequadamente à orientação ou ao conselho dado pelo sábio.
- source_word: πηγή ζωῆς
  choice: fonte de vida
  rationale: πηγή pode ser uma nascente ou fonte; «fonte de vida» preserva a metáfora e é uma expressão natural e digna em português.
theological_decisions:
- issue: Representação do gênero e número de σοφοῦ
  choice: um homem sábio
  alternative: uma pessoa sábia; os sábios
  rationale: O grego é masculino singular. A tradução conserva essa forma representativa sem convertê-la silenciosamente em expressão neutra ou plural.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Mantém-se o paralelismo entre o conhecimento que aumenta e o conselho que comunica vida.
