review_pass:
  verdict: revise
  source_fidelity: A primeira oração reproduz adequadamente a construção elíptica e a imagem de ἐν ἴχνει ἁμαρτωλοῦ; «segue os passos do pecador» é uma explicitação idiomática defensável, devidamente assinalada na nota. «Repreensão», «o Senhor» e «quem teme» são escolhas fiéis. Na segunda oração, porém, «de coração» tende a significar “com sinceridade/de boa vontade”, ao passo que ἐν καρδίᾳ localiza o retorno no âmbito interior. «Em seu coração» conserva melhor a imagem e a ambiguidade do grego.
  naturalness: O texto é claro e de registro sapiencial natural. «Voltará em seu coração» é um pouco mais próximo do idioma bíblico do que da conversação contemporânea, mas é compreensível, digno e preferível a «voltará de coração» por precisão semântica.
  terminology: «Repreensão» corresponde bem a ἐλεγμός; «pecador» preserva o singular genérico; e «o Senhor» é adequado para Κύριον neste contexto. A revisão não introduz leitura doutrinária em ἐπιστρέψει.
