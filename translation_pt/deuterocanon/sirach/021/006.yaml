translation:
  language: pt
  text: Quem odeia a repreensão segue os passos do pecador[a], mas quem teme o Senhor voltará em seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “está no rastro — ou nas pegadas — do pecador”. A primeira oração grega é elíptica e não traz um verbo explícito de movimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: quem odeia
  rationale: O particípio presente substantivado caracteriza uma pessoa por sua atitude contínua; “quem odeia” é natural e fiel em português.
- source_word: ἐλεγμὸν
  choice: a repreensão
  rationale: No contexto sapiencial, designa censura ou correção verbal; “repreensão” preserva essa amplitude sem tornar explícita uma ideia de disciplina que o termo não exige.
- source_word: ἐν ἴχνει ἁμαρτωλοῦ
  choice: segue os passos do pecador
  rationale: ἴχνος denota pegada, rastro ou vestígio. Como a oração grega é elíptica e não contém verbo finito, “segue” comunica naturalmente a imagem de caminhar no rastro de alguém; o singular definido também funciona genericamente em português.
- source_word: ὁ φοβούμενος Κύριον
  choice: quem teme o Senhor
  rationale: O particípio substantivado descreve uma classe de pessoa. “Senhor” é a forma reverente usual para κύριος quando se refere a Deus.
- source_word: ἐπιστρέψει
  choice: voltará
  rationale: O futuro ativo significa voltar ou retornar. “Voltará” evita antecipar a interpretação mais específica “se arrependerá”.
- source_word: ἐν καρδίᾳ
  choice: de coração
  rationale: A expressão aponta para a disposição interior. “De coração” é idiomático em português e mantém a dimensão interna sem inserir pronome de gênero ausente da expressão grega.
theological_decisions:
- issue: Sentido de ἐπιστρέψει no contexto moral
  choice: voltará
  alternative: se arrependerá
  rationale: Embora o retorno possa implicar arrependimento, o verbo grego mantém a imagem mais ampla de voltar-se ou retornar; a tradução não deve resolver além do texto.
- issue: Verbo implícito na primeira oração
  choice: segue os passos do pecador
  alternative: está nos passos do pecador
  rationale: A oração grega é elíptica. “Segue” torna inteligível em português a metáfora de ἴχνος, enquanto a nota registra que o movimento não é verbalmente expresso no original.
- issue: Tradução de Κύριον
  choice: o Senhor
  alternative: o Mestre
  rationale: No contexto, κύριος se refere reverentemente a Deus, e “o Senhor” é a tradução portuguesa consagrada e semanticamente adequada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Segue os passos” conserva a imagem sapiencial em formulação natural; “voltará de coração” mantém a tensão e a relativa abertura do grego.
