    rationale: Em português, «de coração» normalmente qualifica a ação como sincera ou voluntária. O grego «ἐν καρδίᾳ» indica antes o lugar/esfera interior do voltar-se. «Em seu coração» mantém essa dimensão sem sugerir necessariamente intensidade ou sinceridade.
