  text: All lawlessness is like a two-edged sword; for its wound there is no healing.
translation:
  language: pt
  text: Toda transgressão da lei é como uma espada de dois gumes; para a ferida que ela causa não há cura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz diretamente a comparação e soa natural em português.
- source_word: ῥομφαία δίστομος
  choice: uma espada de dois gumes
  rationale: Expressa de modo idiomático a imagem de uma espada afiada dos dois lados, sem reproduzir literalmente δίστομος como «de duas bocas».
- source_word: πᾶσα ἀνομία
  choice: toda transgressão da lei
  rationale: Preserva a ideia de violação da lei ou da ordem moral contida em ἀνομία, com formulação mais clara e corrente do que «ilegalidade» neste contexto sapiencial.
- source_word: τῇ πληγῇ αὐτῆς
  choice: para a ferida que ela causa
  rationale: πληγή pode designar golpe ou ferida; a menção de cura favorece «ferida». A explicitação «que ela causa» torna claro que αὐτῆς se refere à transgressão comparada à espada.
- source_word: οὐκ ἔστιν ἴασις
  choice: não há cura
  rationale: Mantém de maneira concisa a estrutura e a força proverbial do grego.
theological_decisions:
- issue: Sentido moral de ἀνομία
  choice: transgressão da lei
  alternative: iniquidade; injustiça; desobediência à lei
  rationale: A opção conserva a relação explícita com lei e ordem moral, sem reduzir o termo a um mal genérico nem introduzir uma interpretação denominacional.
- issue: Alcance da afirmação sobre a cura
  choice: para a ferida que ela causa não há cura
  alternative: sua ferida é incurável
  rationale: A formulação preserva a declaração absoluta e proverbial do texto, sem explicar se a incurabilidade é temporal, moral ou escatológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência, preservando a imagem e a tensão do original.
