  text: An assembly of the lawless is like a bundle of tow[a], and their end is a flame of fire.
translation:
  language: pt
  text: A reunião dos que vivem sem lei é como estopa amontoada[a], e o fim deles é uma chama de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estopa amontoada, uma reunião dos que vivem sem lei”. O grego apresenta a imagem de forma comprimida, sem a expressão “é como”.
    reason: lexical_alternative
lexical_decisions:
- source_word: στιππύον
  choice: estopa
  rationale: O substantivo designa material fibroso grosseiro, especialmente resíduos de linho, que se incendeia com facilidade. “Estopa” preserva tanto o referente concreto quanto a força da imagem.
- source_word: συνηγμένον
  choice: amontoada
  rationale: O particípio significa literalmente “reunida” ou “ajuntada”. Com “estopa”, “amontoada” comunica de modo natural uma massa de material combustível acumulado.
- source_word: συναγωγὴ ἀνόμων
  choice: a reunião dos que vivem sem lei
  rationale: “Reunião” representa συναγωγή sem impor uma instituição religiosa específica; “os que vivem sem lei” preserva a ideia de ἄνομοι como pessoas que desprezam ou transgridem a lei, sem reduzi-la a uma designação moral genérica.
- source_word: συντέλεια
  choice: fim
  rationale: No contexto, indica o desfecho ou destino final do grupo. “Fim” é conciso, natural e mantém a possível ressonância de consumação.
- source_word: φλὸξ πυρός
  choice: uma chama de fogo
  rationale: A formulação conserva a expressão enfática e poética do grego, sem reduzir a imagem simplesmente a “fogo”.
theological_decisions:
- issue: Como representar ἀνόμων sem suavizar sua dimensão legal e moral
  choice: os que vivem sem lei
  alternative: os maus; os ímpios; os transgressores
  rationale: A expressão escolhida mantém a referência explícita à ausência ou rejeição da lei, mas evita importar uma categoria doutrinária mais específica do que o grego exige.
- issue: Se a relação entre a estopa e a reunião deve ser apresentada como metáfora direta ou como comparação
  choice: comparação explícita com “é como”
  alternative: “A reunião dos que vivem sem lei é estopa amontoada”
  rationale: O grego é uma construção nominal comprimida e permite uma metáfora direta. A comparação explícita torna a imagem imediatamente inteligível em português sem alterar sua ideia central; a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Estopa” conserva a materialidade da imagem antiga; a nota esclarece a sintaxe grega condensada.
