  yaml_path: translation/deuterocanon/sirach/021/007.yaml
  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
translation:
  language: pt
  text: O homem poderoso na fala é conhecido de longe[a], mas o sensato percebe quando ele tropeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é reconhecido à distância”; a expressão grega pode sugerir tanto uma fala que chama atenção como uma reputação que chega antes da pessoa.
    reason: lexical_alternative
  - marker: b
    text: “Ele” se refere naturalmente ao homem poderoso na fala. “Tropeça” também pode significar que ele comete um erro.
    reason: ambiguity
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: é conhecido de longe
  rationale: Reproduz de modo compacto o sentido de alguém conhecido ou reconhecível à distância, sem decidir se isso ocorre por sua fala ostensiva ou por uma reputação que o precede.
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: o homem poderoso na fala
  rationale: δυνατός indica força ou poder, e ἐν γλώσσῃ se refere à capacidade de falar. “Poderoso na fala” conserva a imagem e soa mais natural em português do que uma reprodução literal com “língua”.
- source_word: ὁ δὲ νοήμων
  choice: mas o sensato
  rationale: νοήμων designa quem tem entendimento e discernimento. “O sensato” expressa esse contraste de maneira clara e digna.
- source_word: οἶδεν
  choice: percebe
  rationale: Embora o verbo normalmente signifique “sabe” ou “conhece”, aqui “percebe” comunica melhor o reconhecimento discernente envolvido no momento em que o outro tropeça.
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: quando ele tropeça
  rationale: A construção com ἐν e infinitivo articular tem valor temporal. ὀλισθάνειν mantém a imagem de tropeçar, que pode indicar tanto um tropeço concreto quanto um erro figurado; αὐτόν aponta naturalmente para o homem poderoso na fala.
theological_decisions:
- issue: Referente de αὐτόν na segunda oração
  choice: “quando ele tropeça”, entendendo “ele” como o homem poderoso na fala
  alternative: Entender que o sensato percebe quando ele próprio tropeça
  rationale: O pronome grego αὐτόν, no acusativo como sujeito do infinitivo, remete mais naturalmente ao homem mencionado na primeira oração; uma referência reflexiva ao sensato seria normalmente expressa de outra forma. A redação portuguesa conserva o pronome sem ampliar a afirmação.
- issue: Masculino representativo
  choice: “O homem poderoso na fala” e “o sensato”
  alternative: “Quem é poderoso na fala” e “a pessoa sensata”
  rationale: As duas expressões gregas estão no masculino singular e apresentam tipos humanos representativos. A tradução mantém essa forma sem lhe atribuir uma restrição doutrinária aos homens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva o paralelismo conciso do grego e mantém as imagens de poder na fala, distância e tropeço.
