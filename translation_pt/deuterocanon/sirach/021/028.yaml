translation_notes:
  register: Português moderno, digno e de leitura ampla. “Quem fala às escondidas” evita o sentido potencialmente inocente de “quem cochicha”, mas não explicita além do grego se a fala é calúnia, murmuração ou intriga. O marcador foi colocado junto à expressão de residência que a nota esclarece.
