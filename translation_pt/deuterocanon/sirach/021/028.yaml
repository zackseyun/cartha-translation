  text: The whisperer defiles his own soul[a], and in the place where he lives he will be hated.
translation:
  language: pt
  text: Quem fala às escondidas contamina a própria alma e será odiado no lugar onde reside.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre aqueles com quem vive”, “em sua vizinhança” ou “durante sua permanência”. A expressão grega pode se referir ao lugar, à comunidade ou à condição de residência de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μολύνει
  choice: contamina
  rationale: O verbo expressa tornar impuro ou moralmente maculado. “Contamina” preserva tanto a imagem de impureza quanto o dano ético.
- source_word: τὴν ἑαυτοῦ ψυχὴν
  choice: a própria alma
  rationale: A construção reflexiva enfatiza que o dano recai sobre o próprio interior da pessoa; “alma” mantém a amplitude antropológica de ψυχή sem reduzi-la apenas a “vida” ou “pessoa”.
- source_word: ὁ ψιθυρίζων
  choice: quem fala às escondidas
  rationale: O particípio descreve alguém que fala secretamente, com possível conotação de intriga ou maledicência. A formulação conserva a ideia de fala encoberta sem restringir o sentido a difamação formal.
- source_word: ἐν παροικήσει
  choice: no lugar onde reside
  rationale: παροίκησις pode indicar permanência, residência ou o âmbito social em que alguém vive. A expressão é natural em português e evita impor se a referência é especificamente à vizinhança, à comunidade ou a uma estada temporária.
- source_word: μισηθήσεται
  choice: será odiado
  rationale: Reproduz diretamente o futuro passivo grego e mantém a força de μισέω, sem atenuá-lo para “será desprezado”.
