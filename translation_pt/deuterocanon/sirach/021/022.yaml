base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/022.yaml
  text: A fool’s foot hurries to a house[a], but a man of schemes bows low before the great.
translation:
  language: pt
  text: O pé do insensato se apressa para uma casa, mas o homem de planos se humilha diante dos grandes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “mas um homem muito experiente se envergonhará diante de uma face/presença”. O hebraico e o grego diferem consideravelmente na segunda linha.'
    reason: Leitura alternativa decorrente de divergência textual significativa.
lexical_decisions:
- source_word: רֶגֶל
  choice: pé
  rationale: Mantém o singular e a imagem proverbial do hebraico, também refletida no paralelo grego.
- source_word: נָבָל
  choice: insensato
  rationale: Expressa o sentido moral e intelectual próprio da literatura sapiencial sem sugerir apenas falta de inteligência.
- source_word: מִהֲרָה
  choice: se apressa
  rationale: Reproduz a ideia de pressa impulsiva em linguagem portuguesa natural.
- source_word: אֶל בָּיִת
  choice: para uma casa
  rationale: Conserva a indefinição do hebraico e o alcance geral do provérbio.
- source_word: אִישׁ מְזִימוֹת
  choice: homem de planos
  rationale: Traduz מְזִימוֹת sem decidir indevidamente se os planos são prudentes ou ardilosos, preservando a ambivalência lexical.
- source_word: יַכְנִיעַ
  choice: se humilha
  rationale: No contexto, entende a forma causativa de כנע como rebaixamento voluntário ou deferência, sem acrescentar uma descrição física ausente no texto.
- source_word: לָרַבִּים
  choice: diante dos grandes
  rationale: רַבִּים pode significar 'muitos' ou 'grandes'; esta escolha produz uma máxima social coerente, enquanto a alternativa permanece reconhecida como incerta.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na segunda linha
  choice: 'Seguir o texto hebraico preservado: “o homem de planos se humilha diante dos grandes”'
  alternative: “um homem muito experiente se envergonhará diante de uma face/presença”
  rationale: O hebraico sobrevivente é a testemunha principal do projeto. Como o grego diverge de modo substancial e altera a interpretação, sua leitura é registrada em nota, não harmonizada silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Insensato” é mais idiomático no registro sapiencial do que “tolo” em alguns contextos internacionais; “homem de planos” mantém a ambiguidade do hebraico, e “diante dos grandes” conserva a provável nuance social sem ocultar a incerteza.
