  yaml_path: translation/deuterocanon/sirach/021/016.yaml
  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
translation:
  language: pt
  text: A explicação do insensato é como uma carga no caminho, mas nos lábios do prudente se encontrará graça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “favor”. O grego χάρις pode significar graça, favor ou amabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήγησις
  choice: explicação
  rationale: O substantivo indica uma explicação ou exposição; “explicação” mantém o contraste proverbial entre a fala do insensato e os lábios do prudente sem soar técnico.
- source_word: μωροῦ
  choice: do insensato
  rationale: O genitivo depende de ἐξήγησις. “Insensato” é corrente na literatura sapiencial e expressa falta de juízo, sem recorrer a um insulto coloquial.
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: como uma carga no caminho
  rationale: φορτίον designa carga ou peso, e ἐν ὁδῷ, o caminho ou a estrada. A formulação conserva a imagem concreta e sua possível ideia de incômodo ou obstáculo durante a viagem.
- source_word: χείλους
  choice: lábios
  rationale: A tradução literal preserva a imagem sapiencial da fala que procede dos lábios.
- source_word: συνετοῦ
  choice: do prudente
  rationale: No contexto sapiencial, συνετός caracteriza quem possui entendimento e bom juízo. “Prudente” oferece contraste natural com “insensato”.
- source_word: εὑρεθήσεται χάρις
  choice: se encontrará graça
  rationale: A construção preserva o futuro passivo grego em português natural. “Graça” mantém aberta a amplitude de χάρις, que aqui pode indicar favor, amabilidade ou uma qualidade atraente da fala.
