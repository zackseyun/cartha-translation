  yaml_path: translation/deuterocanon/sirach/021/021.yaml
  text: Instruction is like a golden ornament to a prudent man[a], and like a bracelet on his right arm.
translation:
  language: pt
  text: A instrução[a] é como um adorno de ouro para o homem prudente e como um bracelete em seu braço direito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «disciplina», «educação» ou «formação». O termo grego παιδεία pode abranger tanto o ensino quanto a formação moral.
    reason: alternativa lexical
lexical_decisions:
- source_word: κόσμος
  choice: adorno
  rationale: Neste contexto, designa um objeto ornamental, não o mundo ou a ordem; a comparação com ouro e com um bracelete favorece «adorno».
- source_word: χρυσοῦς
  choice: de ouro
  rationale: Expressa de modo natural em português o material ou valor do adorno, preservando a imagem do grego.
- source_word: φρονίμῳ
  choice: para o homem prudente
  rationale: O dativo indica aquele para quem a instrução funciona como adorno; «prudente» comunica sensatez e sabedoria prática, e «homem» preserva o masculino singular do texto.
- source_word: παιδεία
  choice: instrução
  rationale: É a opção mais natural no dito sapiencial, embora o termo grego também abranja disciplina, educação e formação moral; essa amplitude é registrada em nota.
- source_word: χλιδών
  choice: bracelete
  rationale: A localização no braço direito indica um ornamento usado no braço; «bracelete» é claro e corrente em português moderno.
- source_word: βραχίονι δεξιῷ
  choice: em seu braço direito
  rationale: Preserva a localização do bracelete e explicita naturalmente a relação possessiva implícita com o homem prudente.
theological_decisions:
- issue: Tradução do masculino singular φρονίμῳ
  choice: homem prudente
  alternative: pessoa prudente; sábio
  rationale: O grego emprega o masculino singular para uma figura representativa num dito sapiencial. A tradução mantém essa forma sem tornar a afirmação doutrinariamente mais restrita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura comparativa e as duas imagens concretas do grego foram preservadas.
