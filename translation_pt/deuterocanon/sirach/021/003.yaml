  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: pt
  text: Quem segura o pênis enquanto urina[a] é como quem entra de repente na casa do próximo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui uma expressão corporal crua. A palavra traduzida como “pênis” também pode significar “antebraço”, “côvado” ou “serva”, mas, na expressão “segurar ... e urinar”, é um eufemismo para o membro sexual masculino.
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz uma frase diferente: “Os dentes dela são dentes de leão, destruindo as vidas dos seres humanos.” Isso parece refletir uma forma textual substancialmente distinta.'
    reason: textual_variant
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: Como quem segura
  rationale: O particípio de אחז indica agarrar ou segurar. A formulação mantém a imagem concreta e explicita em português a comparação proverbial sugerida pela estrutura dos dois membros.
- source_word: בָּאַמָה
  choice: as partes íntimas de uma mulher
  rationale: Embora אַמָּה possa designar antebraço, côvado ou serva, esses sentidos não se ajustam bem à imagem corporal acompanhada de urinar. A tradução preserva o sentido obsceno provável sem recorrer a linguagem vulgar.
- source_word: וּמַשְׁתִּין מָיִם
  choice: e urina
  rationale: A expressão hebraica significa literalmente 'urina água'. Em português, 'urina' comunica naturalmente o ato e mantém a força corporal sem soar coloquial ou eufemístico demais.
- source_word: וְהַנִּכְנָס
  choice: assim é quem entra
  rationale: O hebraico coordena dois particípios. A inserção de 'assim é' torna clara a relação comparativa do provérbio sem alterar seu conteúdo.
- source_word: לְבֵית חֲבֵרוֹ
  choice: na casa do próximo
  rationale: חבר pode significar companheiro, amigo ou pessoa socialmente próxima. 'Próximo' evita pressupor amizade íntima e se harmoniza com o registro sapiencial.
- source_word: פִּתְאוֹם
  choice: de repente
  rationale: Expressa a entrada súbita e inesperada; é natural e claro no português contemporâneo.
- source_word: ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς, ἀναιροῦντες ψυχὰς ἀνθρώπων
  choice: registrado apenas em nota como variante textual
  rationale: O paralelo grego diverge substancialmente do hebraico. Como o testemunho hebraico está preservado e tem alta confiança, ele fundamenta o texto principal, enquanto a forma grega é documentada em nota.
theological_decisions:
- issue: Escolha do texto-base diante da forte divergência entre o hebraico e o grego
  choice: Traduzir o provérbio hebraico no texto principal e registrar o grego em nota.
  alternative: Usar no texto principal a frase grega sobre dentes de leão, ou combinar as duas formas.
  rationale: O hebraico existente deve ter prioridade. As versões apresentam conteúdos distintos, e uma harmonização ocultaria a divergência textual em vez de preservá-la honestamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A contundência corporal do hebraico foi mantida sem emprego de vulgarismo. A comparação foi explicitada de modo natural, e todas as variantes relevantes foram preservadas em notas.
