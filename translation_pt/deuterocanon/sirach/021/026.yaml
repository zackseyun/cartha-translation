translation_notes:
  register: Português moderno, conciso e proverbial, com ampla legibilidade brasileira. A repetição de “deles” evita a possível ambiguidade possessiva de “seu”, enquanto a construção deliberadamente incomum da segunda oração preserva a tensão do original.
