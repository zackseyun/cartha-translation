  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
translation:
  language: pt
  text: Na boca dos tolos está o coração deles, mas o coração dos sábios é a boca deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “a boca dos sábios está no coração deles” — isto é, os sábios mantêm a fala sob controle interior. A formulação grega é concisa e antitética; essa alternativa explicita o sentido implícito.'
    reason: Leitura interpretativa alternativa que esclarece a inversão elíptica do grego sem substituir sua formulação no texto principal.
lexical_decisions:
- source_word: ἐν στόματι
  choice: na boca
  rationale: 'Mantém a preposição e a imagem concreta do grego: o que está no íntimo dos tolos chega imediatamente à boca.'
- source_word: μωρῶν
  choice: dos tolos
  rationale: Traduz o substantivo plural de modo direto, atual e proverbial, sem acrescentar uma qualificação ausente no texto.
- source_word: καρδία
  choice: coração
  rationale: Preserva a antropologia bíblica do centro interior do pensamento, da vontade e das disposições, sem reduzi-la apenas à emoção.
- source_word: σοφῶν
  choice: dos sábios
  rationale: É a forma substantivada natural em português e conserva o contraste típico da literatura sapiencial.
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: mas o coração dos sábios é a boca deles
  rationale: Conserva a formulação elíptica e a inversão antitética do texto grego, em vez de explicar no corpo do versículo uma relação cuja forma exata permanece tensa e ambígua.
