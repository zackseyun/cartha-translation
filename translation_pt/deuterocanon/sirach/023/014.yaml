  source_fidelity: A tradução preserva adequadamente a exortação, o referente masculino de μεγιστάνων e a ambiguidade de ἐπιλαθῇ, explicitada em nota. A cadeia final é corretamente entendida como consequência temida sob μή ποτε, sem inserir uma negação antes de “amaldiçoe”. Contudo, “por causa de seus hábitos” pluraliza o singular τῷ ἐθισμῷ σου e a repetição de “que” torna a coordenação verbal sintaticamente defeituosa em português.
  naturalness: “Não aconteça que” é possível, mas pouco natural no português moderno, e a sequência “que você seja..., que ... se torne” soa como uma oração relativa solta. Uma construção com “para que você não...” permite uma advertência clara e mantém todos os verbos sob o mesmo alcance negativo.
  terminology: “Homens poderosos” é uma opção fiel e inteligível para μεγιστάνων. “Comportamento habitual” traduz com naturalidade o singular ἐθισμός sem impor que se trate de vários hábitos ou de um vício específico. “Insensato” mantém registro sapiencial apropriado.
