base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: pt
  text: Lembre-se de seu pai e de sua mãe, pois você está sentado entre homens poderosos[a], para que você não seja esquecido diante deles[b] nem, por seu comportamento habitual, se torne insensato, deseje não ter nascido e amaldiçoe o dia de seu nascimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Homens poderosos” traduz um termo masculino para homens de alta posição ou influência social; também se pode traduzir por “dignitários” ou “nobres”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que você se esqueça de si mesmo diante deles”, isto é, que perca o devido domínio próprio na presença deles. A forma grega admite mais de uma compreensão neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembre-se
  rationale: Imperativo aoristo que exorta à recordação ativa; a forma pronominal é direta e natural em português.
- source_word: πατρὸς καὶ μητρός σου
  choice: de seu pai e de sua mãe
  rationale: Mantém a menção concreta e distinta de ambos os pais, em vez de reduzi-la ao coletivo “pais”.
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: Expressa de modo atual e natural a ideia de estar no meio de um grupo.
- source_word: μεγιστάνων
  choice: homens poderosos
  rationale: O termo masculino designa homens de elevada posição ou influência social. “Poderosos” comunica esse estatuto com clareza, sem restringi-lo necessariamente à nobreza hereditária.
- source_word: συνεδρεύει
  choice: você se assenta
  rationale: O verbo indica sentar-se em companhia ou conselho. “Se assenta” conserva a imagem formal da sessão compartilhada.
- source_word: μή ποτε
  choice: Não aconteça que
  rationale: Introduz uma advertência sobre consequências possíveis e permite que a negação alcance naturalmente toda a sequência verbal.
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: você seja esquecido diante deles
  rationale: Segue de perto a leitura passiva sugerida pela forma grega, sem ocultar em nota a possibilidade contextual de sentido reflexivo.
- source_word: τῷ ἐθισμῷ σου
  choice: por causa de seus hábitos
  rationale: ἐθισμός denota costume ou comportamento habitual. O plural idiomático em português evita a formulação pouco natural “por seu hábito”, sem acrescentar explicitamente uma avaliação moral.
- source_word: μωρανθῇς
  choice: se torne insensato
  rationale: Preserva o sentido resultativo de passar a agir ou mostrar-se sem juízo, em registro digno.
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: deseje não ter nascido
  rationale: Reproduz em português idiomático a expressão de profundo arrependimento ou vergonha.
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου
  choice: o dia de seu nascimento
  rationale: Tradução clara e formal da referência ao dia do parto ou nascimento.
- source_word: μὴ καταράσῃ
  choice: e amaldiçoe
  rationale: O verbo integra a cadeia de consequências regida pela advertência negativa inicial; por isso não recebe uma segunda negação em português.
theological_decisions:
- issue: Termo social masculino μεγιστάνων
  choice: homens poderosos
  alternative: dignitários; nobres; pessoas importantes
  rationale: Mantém o referente masculino do cenário social antigo e transmite posição e influência sem especificar uma classe nobiliárquica não exigida pelo termo.
- issue: Ambiguidade de ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: você seja esquecido diante deles
  alternative: você se esqueça de si mesmo diante deles; você perca o decoro na presença deles
  rationale: A tradução principal acompanha a leitura passiva da forma transmitida, enquanto a nota preserva a leitura reflexiva favorecida pelo contexto, sem resolver silenciosamente a tensão.
- issue: Alcance de μή na sequência final
  choice: uma única advertência negativa rege “seja esquecido”, “se torne”, “deseje” e “amaldiçoe”
  alternative: repetir a negação antes do último verbo
  rationale: A sintaxe apresenta uma cadeia de resultados temidos sob μή ποτε; repetir “não” antes de “amaldiçoe” inverteria ou obscureceria o sentido.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil, com tratamento por “você” e tom sapiencial digno. A construção “Não aconteça que” preserva a advertência contínua e evita o arcaísmo de “para que não suceda que”. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
