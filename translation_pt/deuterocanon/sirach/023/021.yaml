  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: pt
  text: Esse homem será castigado nas ruas da cidade[a] e será apanhado onde não esperava[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas praças da cidade». O grego se refere literalmente aos lugares largos ou abertos da cidade, ressaltando a exposição pública.
    reason: lexical_alternative
  - marker: b
    text: Ou «onde não suspeitava» ou «onde não imaginava».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Esse homem
  rationale: O demonstrativo retoma o homem adúltero mencionado no contexto anterior. «Esse homem» conserva com naturalidade a força anafórica e a referência masculina.
- source_word: ἐν πλατείαις πόλεως
  choice: nas ruas da cidade
  rationale: πλατεῖαι designa ruas largas ou espaços públicos abertos. «Ruas da cidade» é uma formulação natural que mantém o cenário público; a alternativa mais literal é registrada em nota.
- source_word: ἐκδικηθήσεται
  choice: será castigado
  rationale: O futuro passivo comunica a aplicação de retribuição ou justiça punitiva. «Será castigado» expressa esse sentido sem especificar indevidamente o agente.
- source_word: οὗ οὐχ ὑπενόησεν
  choice: onde não esperava
  rationale: A expressão indica um lugar ou circunstância que ele não suspeitava, previa ou imaginava. «Onde não esperava» é idiomático em português e conserva a ideia de surpresa.
- source_word: πιασθήσεται
  choice: será apanhado
  rationale: O futuro passivo indica que ele será capturado, surpreendido ou pego. «Será apanhado» mantém o sentido concreto e é amplamente compreensível.
theological_decisions:
- issue: Referência das formas masculinas
  choice: O versículo se refere especificamente ao homem adúltero do contexto imediato, por isso se mantém «esse homem» e a concordância masculina.
  alternative: Usar uma formulação neutra, como «essa pessoa».
  rationale: O grego emprega formas masculinas e o contexto identifica um referente masculino específico; neutralizar apagaria essa informação textual.
- issue: Sentido de ἐκδικηθήσεται
  choice: Retribuição punitiva pública, traduzida por «será castigado».
  alternative: «Será vingado» ou «a vingança cairá sobre ele».
  rationale: O contexto favorece punição ou execução de justiça, sem exigir a ideia mais estreita de vingança pessoal nem identificar explicitamente quem aplica o castigo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a concisão proverbial do grego e não explicita o agente das formas passivas.
