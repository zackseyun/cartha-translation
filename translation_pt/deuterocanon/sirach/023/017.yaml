  yaml_path: translation/deuterocanon/sirach/023/017.yaml
  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: pt
  text: Para o homem promíscuo, todo pão é doce[a]; ele não parará até chegar ao fim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo tipo de pão é doce”. A imagem provavelmente indica um apetite indiscriminado, não apenas pão em sentido literal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até morrer”. O verbo grego pode referir-se especificamente à morte, embora “chegar ao fim” preserve também o sentido mais amplo de um desfecho final.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνῳ
  choice: homem promíscuo
  rationale: O termo descreve alguém caracterizado por conduta sexual ilícita. “Promíscuo” comunica o caráter habitual e indiscriminado dessa conduta em português atual, sem restringir o sentido à prostituição.
- source_word: πᾶς ἄρτος
  choice: todo pão
  rationale: Preserva a imagem concreta e proverbial do grego, em vez de explicitar no texto principal aquilo que ela representa. A nota esclarece a possibilidade idiomática de “todo tipo de pão”.
- source_word: ἡδύς
  choice: doce
  rationale: Mantém a imagem sensorial ligada ao pão e a ironia do apetite indiscriminado. Embora também possa significar “agradável”, “doce” reproduz melhor a metáfora.
- source_word: οὐ μὴ κοπάσῃ
  choice: não parará
  rationale: A construção οὐ μή com o subjuntivo expressa negação enfática, e κοπάζω indica cessar ou parar. A forma escolhida é clara, natural e vigorosa.
- source_word: ἕως ἂν τελευτήσῃ
  choice: até chegar ao fim
  rationale: τελευτάω pode significar tanto chegar ao fim como morrer. A tradução conserva essa amplitude, enquanto a nota registra explicitamente o sentido possível de morte.
theological_decisions:
- issue: Explicitar o referente sexual da imagem do pão
  choice: Preservar no texto principal a metáfora “todo pão é doce”.
  alternative: “todo tipo de alimento é agradável” ou uma referência explícita a parceiros sexuais
  rationale: O próprio grego emprega a imagem do pão, e o contexto identifica a conduta sexual. Explicar o referente dentro do versículo eliminaria a força proverbial e acrescentaria uma interpretação não expressa diretamente.
- issue: Entender τελευτήσῃ especificamente como morte ou de modo mais amplo como fim
  choice: 'Traduzir de modo amplo: “até chegar ao fim”.'
  alternative: “até morrer”
  rationale: O verbo pode designar literalmente a morte, mas também permite a ideia mais geral de chegar ao fim. A formulação escolhida preserva essa ambiguidade genuína sem excluir a morte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura proverbial e a metáfora concreta do original foram preservadas; as ambiguidades lexicais relevantes foram registradas em notas.
