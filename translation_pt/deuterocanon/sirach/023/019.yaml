  text: e os olhos dos homens são o seu temor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração grega é excepcionalmente condensada e talvez apresente incerteza textual. Também pode ser entendida, de modo mais interpretativo, como: “ele teme os olhos dos homens”.'
