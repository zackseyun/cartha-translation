  source_fidelity: A redação «o temor dele está nos olhos dos homens» introduz a relação locativa «está em», que não está expressa no grego. Na cláusula elíptica transmitida, ὀφθαλμοὶ ἀνθρώπων é o grupo nominativo mais naturalmente tratado como sujeito, e φόβος αὐτοῦ como predicativo. «Os olhos dos homens são o seu temor» conserva melhor essa estrutura, sem resolver a dificuldade textual.
  naturalness: «Os olhos dos homens são o seu temor» é uma frase portuguesa compreensível, ainda que deliberadamente densa, apropriada ao registro sapiencial e à incerteza da cláusula. A nota explica a estranheza sem normalizá-la excessivamente.
  terminology: «Olhos», «homens» e «temor» refletem adequadamente ὀφθαλμοί, ἀνθρώπων e φόβος. «O seu temor» mantém a ambiguidade genitiva de αὐτοῦ melhor do que uma paráfrase locativa.
