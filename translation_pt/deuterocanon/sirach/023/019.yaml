lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: olhos
  rationale: Mantém o sentido concreto e a imagem do substantivo grego, sem o tornar abstrato como “olhar” ou “vista”.
- source_word: ἀνθρώπων
  choice: dos homens
  rationale: Reproduz o genitivo plural grego e sua forma genérica masculina, sem substituir silenciosamente a expressão por uma formulação mais ampla.
- source_word: φόβος
  choice: temor
  rationale: “Temor” corresponde ao substantivo grego e se ajusta ao registro sapiencial; evita intensificações interpretativas como “terror” ou “pavor”.
- source_word: αὐτοῦ
  choice: dele
  rationale: 'Preserva a relação genitiva ambígua do pronome: pode indicar o temor que lhe pertence ou o temor dirigido a ele.'
theological_decisions:
- issue: Como traduzir a oração grega extremamente condensada e possivelmente textualmente incerta
  choice: e o temor dele está nos olhos dos homens
  alternative: e ele teme os olhos dos homens
  rationale: A redação principal mantém os elementos lexicais e a ambiguidade do grego, acrescentando apenas a cópula necessária para uma frase portuguesa inteligível. A leitura mais interpretativa fica registrada em nota, sem ser imposta ao texto.
translation_notes:
  register: Português moderno, digno e claro, com formulação deliberadamente próxima do grego. “Temor dele” conserva a ambiguidade da construção, e “olhos dos homens” retém sua imagem concreta.
