  yaml_path: translation/deuterocanon/sirach/023/013.yaml
  text: Do not accustom your mouth to crude ignorance, for in it there is a word of sin.
translation:
  language: pt
  text: Não acostume sua boca à ignorância grosseira[a], pois nela há palavra de pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à ignorância rude” ou “à falta de educação grosseira”. A expressão grega combina a ideia de ignorância ou falta de formação com a de grosseria.'
    reason: A formulação grega é incomum; a nota registra alternativas portuguesas plausíveis sem restringir indevidamente seu sentido.
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: grosseria ignorante
  rationale: A expressão combina falta de formação ou refinamento com uma qualidade grosseira ou indecorosa. A tradução conserva os dois aspectos sem tornar a frase excessivamente técnica.
- source_word: συνεθίσῃς τὸ στόμα σου
  choice: acostume sua boca
  rationale: Mantém a imagem concreta do grego e comunica a ideia de adquirir um hábito de fala.
- source_word: λόγος ἁμαρτίας
  choice: palavra de pecado
  rationale: 'Preserva a formulação genitiva e sua possível amplitude: palavra pecaminosa, fala ligada ao pecado ou expressão que conduz ao pecado.'
theological_decisions:
- issue: Relação entre a fala e o pecado em λόγος ἁμαρτίας
  choice: palavra de pecado
  alternative: fala pecaminosa
  rationale: A opção escolhida evita reduzir a construção a uma única interpretação moral e conserva a tensão e a concisão do original.
translation_notes:
  register: Português moderno, direto e digno. A imagem de habituar a boca foi preservada, e a expressão incomum do grego foi vertida de modo inteligível, com nota para registrar sua amplitude lexical.
