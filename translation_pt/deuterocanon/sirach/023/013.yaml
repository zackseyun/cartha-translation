review_pass:
  verdict: revise
  source_fidelity: A expressão grega ἀπαιδευσίαν ἀσυρῆ reúne a noção de falta de formação/ignorância com a de grosseria. «Grosseria ignorante» inverte a relação semântica mais natural e soa como se a grosseria fosse o núcleo. «Ignorância grosseira» preserva ambos os elementos e corresponde melhor à formulação-fonte e ao audit trail inglês («crude ignorance»). «Palavra de pecado» conserva adequadamente λόγος ἁμαρτίας.
  naturalness: «Não acostume sua boca à grosseria ignorante» é compreensível, mas a combinação nominal é pouco idiomática em português. «Não acostume sua boca à ignorância grosseira» é natural, concisa e mantém a imagem concreta de habituar a boca.
  terminology: «Ignorância grosseira» é uma formulação moderna, de registro digno e amplamente compreensível. A nota deve refletir a ordem e a relação dos componentes gregos, sem acrescentar «indecência», que é mais específico do que o texto exige.
  issues:
  - severity: medium
    issue: Colocação pouco natural e foco semântico deslocado em «grosseria ignorante».
    rationale: O substantivo português «grosseria» tende a designar uma fala ou ato rude; no grego, a expressão parte de ἀπαιδευσία, isto é, ignorância ou falta de formação, qualificada por ἀσυρῆ. «Ignorância grosseira» reproduz essa estrutura e é mais idiomático.
  - severity: low
    issue: A nota oferece «indecência» como componente necessário da expressão.
    rationale: Embora o campo de «grosseiro» possa, conforme o contexto, tocar o indecoroso, o versículo não exige essa especificação. A nota pode registrar a amplitude sem estreitá-la.
  revised_text: Não acostume sua boca à ignorância grosseira[a], pois nela há palavra de pecado.
  revised_footnotes:
  - marker: a
    text: 'Ou: “à ignorância rude” ou “à falta de educação grosseira”. A expressão grega combina a ideia de ignorância ou falta de formação com a de grosseria.'
