base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: pt
  text: O homem que faz muitos juramentos ficará cheio de iniquidade, e o açoite não se afastará de sua casa.[a] Se cometer uma falta, seu pecado recairá sobre ele; se a ignorar, terá pecado duplamente.[b] Se jurar em vão,[c] não será declarado justo, pois sua casa ficará cheia de calamidades.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Açoite” também pode ser entendido figuradamente como “flagelo” ou “castigo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se a desconsiderar, terá pecado duas vezes”. A ideia parece ser que tratar a falta com descaso agrava a culpa.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “se jurar por meio do vazio”; também pode significar fazer um juramento vazio ou jurar falsamente.
    reason: lexical_alternative
  - marker: d
    text: O termo grego é difícil e pode indicar males impostos, punições ou aflições que sobrevêm à casa.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: O homem que faz muitos juramentos
  rationale: Mantém o masculino singular representativo do grego e expressa de modo natural a ideia de alguém caracterizado pelo uso frequente de juramentos.
- source_word: πλησθήσεται ἀνομίας
  choice: ficará cheio de transgressão
  rationale: Preserva o peso moral de ἀνομία como violação da ordem ou da lei, sem reduzir o termo a um simples erro.
- source_word: μάστιξ
  choice: o açoite
  rationale: Conserva a imagem concreta do instrumento de punição, que também pode funcionar figuradamente como flagelo ou castigo.
- source_word: πλημμελήσῃ
  choice: cometer uma falta
  rationale: O verbo indica errar ou cometer uma falta; a formulação evita acrescentar a noção não expressa de pecado involuntário.
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: seu pecado recairá sobre ele
  rationale: Reproduz em português natural a imagem grega de responsabilidade pessoal que permanece sobre o transgressor.
- source_word: ὑπερίδῃ
  choice: a ignorar
  rationale: Expressa a ação de deixar de levar a falta em conta ou tratá-la com descaso, mantendo aberta a nuance entre ignorar e desconsiderar.
- source_word: ἥμαρτεν δισσῶς
  choice: terá pecado duplamente
  rationale: Preserva a ideia de culpa agravada ou duplicada expressa por δισσῶς.
- source_word: διὰ κενῆς ὤμοσεν
  choice: jurar em vão
  rationale: É uma expressão portuguesa idiomática que retém a imagem de vazio ou falta de fundamento sem restringi-la necessariamente a perjúrio.
- source_word: οὐ δικαιωθήσεται
  choice: não será declarado justo
  rationale: Comunica a vindicação judicial ou moral do verbo sem depender do uso teológico técnico de “justificar”.
- source_word: ἐπαγωγῶν
  choice: calamidades
  rationale: O termo raro e difícil parece designar males ou punições que sobrevêm à casa; “calamidades” preserva essa amplitude.
theological_decisions:
- issue: Sentido de δικαιωθήσεται no contexto sapiencial
  choice: não será declarado justo
  alternative: não será justificado / não será absolvido
  rationale: O contexto trata da culpa ligada aos juramentos e de suas consequências. A tradução mantém a dimensão judicial e moral sem importar debates doutrinários posteriores.
- issue: Natureza da falta em πλημμελήσῃ
  choice: cometer uma falta
  alternative: pecar involuntariamente
  rationale: O grego indica erro ou transgressão, mas não estabelece de forma inequívoca que a ação seja involuntária; a tradução não acrescenta essa especificação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura proverbial clara. A tradução conserva as imagens concretas do grego e esclarece em notas as ambiguidades lexicais sem impor uma interpretação confessional.
