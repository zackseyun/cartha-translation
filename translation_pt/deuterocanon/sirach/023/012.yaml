revisions:
- from: Há uma palavra envolta em morte[a]; que ela não seja encontrada na herança de Jacó. Pois todas essas coisas se afastarão dos piedosos, e eles não se revolverão em pecados.
  to: Há uma palavra envolta em morte[a]; que ela não seja encontrada na herança de Jacó. Pois todas essas coisas se afastarão dos piedosos, e eles não se chafurdarão em pecados.
  rationale: Substituiu-se apenas «não se revolverão em pecados» por «não se chafurdarão em pecados», a fim de obter uma formulação mais idiomática e conservar a força imagética do verbo grego. O sentido, a sintaxe e a ambiguidade do restante foram preservados.
