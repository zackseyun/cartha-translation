review_pass:
  verdict: revise
  source_fidelity: 'O texto preserva adequadamente a estrutura e o sentido do grego: a «palavra» é caracterizada pela imagem de estar envolvida/revestida de morte; a oração jussiva é mantida; «todas essas coisas» continua sendo o sujeito de «se afastarão»; e o plural «pecados» é conservado. A alteração proposta restringe-se à expressão final, para transmitir com maior clareza a imagem de ἐγκυλισθήσονται.'
  naturalness: «Não se revolverão em pecados» é compreensível, mas soa pouco idiomático no português moderno e pode sugerir apenas agitação, em vez da imagem de entrega degradante implícita no verbo grego. «Não se chafurdarão em pecados» é natural, vívido e preserva melhor a metáfora de 'wallow'. O restante tem registro digno e boa legibilidade.
  terminology: «Herança de Jacó» preserva sem interpretação adicional a expressão comunitária do original. «Piedosos» é uma opção válida, de registro bíblico-digno, para εὐσεβῶν. «Envolta em morte» representa adequadamente a metáfora; a nota mantém alternativas legítimas sem transformar a imagem em uma afirmação doutrinária.
  issues:
  - severity: low
    issue: «Não se revolverão em pecados» é uma formulação pouco natural e semanticamente menos precisa para ἐγκυλισθήσονται.
    rationale: O verbo grego evoca rolar ou chafurdar, isto é, uma imersão degradante em pecados. «Chafurdar» comunica essa imagem com mais precisão no português moderno.
  revised_text: Há uma palavra envolta em morte[a]; que ela não seja encontrada na herança de Jacó. Pois todas essas coisas se afastarão dos piedosos, e eles não se chafurdarão em pecados.
