base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: pt
  text: Há uma palavra envolta em morte[a]; que ela não seja encontrada na herança de Jacó. Pois todas essas coisas se afastarão dos piedosos, e eles não se chafurdarão em pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “revestida de morte” ou “cercada de morte”. A imagem grega apresenta uma forma de falar envolvida pela morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέξις
  choice: palavra
  rationale: No contexto, designa uma expressão falada ou modo de falar; “palavra” mantém o foco singular e é natural em português.
- source_word: ἀντιπεριβεβλημένη θανάτῳ
  choice: envolta em morte
  rationale: Preserva a imagem vívida de algo cercado ou revestido de morte, sem reduzir a expressão apenas a “palavra mortal”.
- source_word: μὴ εὑρεθήτω
  choice: que ela não seja encontrada
  rationale: Reproduz a força jussiva do imperativo grego na terceira pessoa.
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  choice: na herança de Jacó
  rationale: Mantém literalmente a linguagem comunitária e pactual, sem explicitar além do texto quem está incluído.
- source_word: εὐσεβῶν
  choice: dos piedosos
  rationale: Expressa pessoas reverentes e fiéis em registro digno e compreensível.
- source_word: ταῦτα πάντα ἀποστήσεται
  choice: todas essas coisas se afastarão
  rationale: Conserva “essas coisas” como sujeito do verbo, conforme a sintaxe grega, e remete às formas de fala pecaminosa do contexto.
- source_word: ἐν ἁμαρτίαις οὐκ ἐγκυλισθήσονται
  choice: não se revolverão em pecados
  rationale: Mantém a imagem forte de rolar ou chafurdar, bem como o plural concreto “pecados”.
theological_decisions:
- issue: Identidade da “herança de Jacó”
  choice: Manter a designação pactual e comunitária sem explicá-la no corpo do texto
  alternative: Interpretar explicitamente como Israel étnico ou como designação metafórica dos justos
  rationale: A formulação literal preserva a tensão quanto ao alcance da comunidade e evita importar conclusões teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “que ela não seja encontrada” preserva o tom exortativo; “revolver-se em pecados” conserva deliberadamente a metáfora forte do grego.
