review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente a relação conjugal, o herdeiro e a origem desse herdeiro em alguém que não é o marido. Contudo, «gerado por outro homem» substitui o particípio παριστῶσα («apresentando») por uma ação de geração e, assim, deixa de representar a formulação familiar/jurídica do grego.
  naturalness: «Assim também uma mulher que deixa o marido e apresenta um herdeiro de outro homem» é português atual, claro e mantém o tom conciso e proverbial. O uso de «uma mulher» reproduz melhor o valor indefinido de γυνή do que «a mulher».
  terminology: «Marido» para ἄνδρα e «herdeiro» para κληρονόμον são adequados. «De outro homem» conserva a origem/paternidade implicada por ἐξ ἀλλοτρίου sem transformar o verbo «apresenta» em «gera».
  issues:
