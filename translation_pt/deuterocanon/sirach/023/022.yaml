  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: pt
  text: Assim também uma mulher que deixa o marido e apresenta um herdeiro de outro homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de um estranho”. O grego refere-se a alguém que não é o marido; “de outro homem” explicita no contexto a origem ou paternidade do herdeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Preserva a força comparativa e conectiva da expressão grega, ligando o versículo ao contexto anterior.
- source_word: γυνή
  choice: a mulher
  rationale: O substantivo pode significar “mulher” ou “esposa”; como a relação conjugal já é explicitada por “o marido”, “a mulher” soa natural sem perder o contexto.
- source_word: καταλιποῦσα
  choice: que deixa
  rationale: Reproduz o particípio aoristo em forma natural para uma afirmação geral, sem acrescentar a carga intensificada de “abandona”.
- source_word: τὸν ἄνδρα
  choice: o marido
  rationale: No contexto matrimonial, ἀνήρ designa claramente o esposo da mulher.
- source_word: παριστῶσα
  choice: apresenta
  rationale: Mantém a imagem de trazer ou apresentar alguém na condição de herdeiro, preservando a nuance familiar e jurídica.
- source_word: κληρονόμον
  choice: um herdeiro
  rationale: Equivalente direto e corrente para aquele que recebe uma herança.
- source_word: ἐξ ἀλλοτρίου
  choice: gerado por outro homem
  rationale: A expressão indica origem ou paternidade proveniente de alguém alheio ao casamento. “Gerado por outro homem” torna clara essa relação sem sugerir apenas que se trate de um desconhecido.
theological_decisions:
- issue: Força moral e jurídica da referência à infidelidade e à herança
  choice: Descrever o ato e sua consequência sem chamar explicitamente a mulher de “adúltera”.
  alternative: Uma esposa que abandona o marido e gera um herdeiro de um estranho.
  rationale: O grego formula a ação e a situação do herdeiro, mas não emprega neste versículo um título moral explícito; a tradução conserva essa contenção e deixa a condenação ao contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom proverbial e a nuance jurídico-familiar do original.
