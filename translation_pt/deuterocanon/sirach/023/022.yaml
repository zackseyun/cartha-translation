    issue: «gerado por outro homem» não preserva o sentido verbal de παριστῶσα.
    rationale: O grego diz que a mulher «apresenta» um herdeiro; a geração/paternidade está implicada pela expressão seguinte. A formulação do rascunho funde os dois elementos e altera a imagem de apresentação do herdeiro.
  - severity: low
    issue: O artigo definido em «a mulher» é menos próximo do valor genérico-indefinido de γυνή.
    rationale: «Uma mulher» é natural em português e representa mais diretamente o substantivo grego sem artigo neste enunciado proverbial.
