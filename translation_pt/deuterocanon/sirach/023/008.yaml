translation:
  language: pt
  text: Pelos seus lábios, o pecador será apanhado[a], e o insultador e o arrogante tropeçarão por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pecador será deixado em seus lábios”. O verbo grego significa mais literalmente “ser deixado” ou “ser abandonado”, mas, neste contexto, pode indicar que a pessoa fica presa ou é arruinada pela própria fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: Por seus lábios
  rationale: O grego ἐν pode ter valor instrumental neste contexto. “Por seus lábios” conserva a imagem concreta e indica que a própria fala é o meio da ruína.
- source_word: καταλειφθήσεται
  choice: será apanhado
  rationale: Embora o sentido lexical mais direto seja “será deixado” ou “será abandonado”, o paralelismo com “tropeçarão” sugere aqui que o pecador fica preso ou é arruinado pela própria fala. A nota preserva a leitura mais literal.
- source_word: ἁμαρτωλός
  choice: o pecador
  rationale: O substantivo singular tem sentido genérico, próprio de uma máxima sapiencial; “o pecador” é natural e fiel em português.
- source_word: λοίδορος
  choice: o insultador
  rationale: Designa quem agride ou injuria por palavras. “Insultador” mantém o foco verbal e é amplamente compreensível.
- source_word: ὑπερήφανος
  choice: o arrogante
  rationale: Expressa orgulho presunçoso e altivo. “Arrogante” comunica claramente a carga moral do termo no português atual.
- source_word: σκανδαλισθήσονται
  choice: tropeçarão
  rationale: Preserva a metáfora de queda ou ruína sem introduzir um sentido teológico técnico posterior.
- source_word: ἐν αὐτοῖς
  choice: neles
  rationale: O pronome retoma naturalmente “lábios”. A formulação conserva a possível nuance locativa do grego e, no contexto, implica que tropeçam naquilo que dizem.
