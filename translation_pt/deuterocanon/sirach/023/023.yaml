base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: pt
  text: Pois, em primeiro lugar, ela desobedeceu à lei do Altíssimo; em segundo, cometeu uma falta contra seu marido; e, em terceiro, em imoralidade sexual, cometeu adultério e deu à luz filhos de outro homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «apresentou filhos de outro homem». O verbo grego pode sugerir trazer ou apresentar; neste contexto, refere-se a dar à luz filhos gerados por outro homem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: em primeiro lugar ... em segundo ... e, em terceiro
  rationale: Preserva a enumeração tríplice explícita do grego em português natural e mantém distintas as três acusações.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: à lei do Altíssimo
  rationale: Com ἀπειθέω, a expressão indica a lei à qual ela desobedeceu. “Altíssimo” traduz o título divino sem acrescentar “Deus”, ausente do texto.
- source_word: ἠπείθησεν
  choice: desobedeceu
  rationale: Equivalente direto e idiomático do aoristo de ἀπειθέω.
- source_word: εἰς ἄνδρα ἑαυτῆς
  choice: contra o próprio marido
  rationale: Expressa a pessoa contra quem a falta foi cometida; “próprio” representa o pronome reflexivo ἑαυτῆς.
- source_word: ἐπλημμέλησεν
  choice: cometeu uma falta
  rationale: Mantém a noção moral de falha ou transgressão sem antecipar nem fundir essa acusação com o adultério explicitado na terceira cláusula.
- source_word: ἐν πορνείᾳ
  choice: em imoralidade sexual
  rationale: Conserva o sentido amplo de πορνεία em linguagem atual, sem restringi-lo a prostituição ou usar o termo potencialmente mais estreito “fornicação”.
- source_word: ἐμοιχεύθη
  choice: cometeu adultério
  rationale: Embora a forma grega seja passiva ou média, o sentido contextual é que ela praticou adultério; a formulação ativa é clara em português.
- source_word: ἐξ ἀλλοτρίου ἀνδρός
  choice: de outro homem
  rationale: No contexto, designa um homem que não era o marido dela.
- source_word: τέκνα παρέστησεν
  choice: apresentou filhos
  rationale: Preserva de perto a imagem lexical de παρίστημι, que pode indicar apresentar, produzir ou fazer surgir, enquanto a nota oferece a formulação portuguesa mais dinâmica.
theological_decisions:
- issue: Progressão moral das três acusações
  choice: Manter separadas a desobediência à lei divina, a falta contra o marido e, por fim, o adultério com filhos de outro homem.
  alternative: Fundir a segunda e a terceira acusações em uma única referência à infidelidade conjugal.
  rationale: A enumeração grega distingue deliberadamente três aspectos da culpa; uni-los apagaria a estrutura retórica e a progressão do texto.
- issue: Tradução de Ὑψίστου
  choice: Altíssimo
  alternative: Deus Altíssimo
  rationale: Traduz o título divino de modo convencional sem acrescentar θεός, que não aparece no grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A enumeração formal foi preservada, e o vocabulário moral evita tanto arcaísmos quanto uma interpretação denominacional específica.
