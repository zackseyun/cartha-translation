  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
translation:
  language: pt
  text: O homem que se habitua a palavras de censura jamais será corrigido em toda a sua vida[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras de insulto” ou “palavras ofensivas”, em vez de “palavras de censura”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega uma negação enfática: literalmente, “certamente não será corrigido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: O homem
  rationale: O substantivo grego singular tem forma masculina e apresenta um indivíduo de modo representativo; “o homem” preserva essa forma sem excluir a aplicação geral da máxima.
- source_word: συνεθιζόμενος
  choice: que se habitua
  rationale: O particípio expressa a formação de um hábito pela repetição. “Que se habitua” conserva esse aspecto progressivo e habitual em português natural.
- source_word: λόγοις ὀνειδισμοῦ
  choice: a palavras de censura
  rationale: λόγοις significa “palavras” ou “fala”, e ὀνειδισμός pode indicar censura, afronta, insulto ou linguagem abusiva. “Palavras de censura” mantém a amplitude do grego sem intensificar indevidamente o sentido.
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: em toda a sua vida
  rationale: A expressão idiomática “em todos os seus dias” abrange a duração da vida. “Em toda a sua vida” comunica esse alcance temporal com naturalidade em português.
- source_word: οὐ μὴ παιδευθῇ
  choice: jamais será corrigido
  rationale: οὐ μή com o subjuntivo forma uma negação enfática, bem representada por “jamais”. παιδεύω abrange educar, formar, disciplinar e corrigir; neste contexto sapiencial, “será corrigido” expressa a correção moral sem restringir o termo à punição.
