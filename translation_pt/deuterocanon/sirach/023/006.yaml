base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: pt
  text: Não permitas que o apetite do ventre e as relações sexuais[a] se apoderem de mim, e não me entregues a uma alma sem vergonha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “indulgência sexual” ou “desregramento sexual”. O termo grego pode designar a união ou as relações sexuais de modo mais neutro, mas, neste contexto de oração contra os vícios, pode ter sentido negativo.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz literalmente “uma alma sem vergonha”; também pode referir-se ao próprio eu dominado pela falta de pudor.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: o apetite do ventre
  rationale: Mantém a imagem corporal do grego, em que κοιλίας depende de ὄρεξις, e expressa um apetite físico sem intensificá-lo indevidamente como “ânsia” ou “voracidade”.
- source_word: συνουσιασμός
  choice: as relações sexuais
  rationale: Representa de modo lexicalmente direto a união ou convivência sexual. O contexto da oração lhe dá força negativa, mas o termo grego, isoladamente, não exige uma palavra mais forte como “devassidão”.
- source_word: μὴ καταλαβέτωσάν με
  choice: Não permitas que ... se apoderem de mim
  rationale: Comunica a ideia de ser alcançado, dominado ou tomado por esses impulsos e transforma o imperativo grego em uma petição natural em português.
- source_word: ψυχὴ ἀναιδεῖ
  choice: uma alma sem vergonha
  rationale: Conserva ψυχή como “alma” e traduz ἀναιδής de maneira clara e corrente, sem reduzir a expressão a mero “desejo”.
- source_word: μὴ παραδῷς με
  choice: não me entregues
  rationale: Equivale diretamente ao sentido de παραδίδωμι, isto é, entregar alguém ao poder ou domínio de outrem.
theological_decisions:
- issue: Força moral de συνουσιασμός no contexto de vícios
  choice: relações sexuais, com nota contextual
  alternative: desregramento sexual; devassidão sexual
  rationale: A tradução principal preserva a amplitude lexical do substantivo e evita declarar que toda relação sexual seja, por si, o vício condenado. A nota informa que o contexto pode apontar para indulgência ou desregramento sexual.
- issue: Sentido antropológico de ψυχή
  choice: alma
  alternative: eu; pessoa; desejo
  rationale: '“Alma” conserva a linguagem antropológica explícita do grego e sua tensão: a oração pode ser entendida como não ser entregue a uma disposição interior sem vergonha ou a uma pessoa caracterizada assim.'
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais de oração no singular (“permitas”, “entregues”). A formulação conserva as imagens do “ventre” e da “alma”, enquanto “se apoderem de mim” comunica naturalmente a força de καταλαμβάνω.
