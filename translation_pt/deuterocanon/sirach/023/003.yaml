  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: pt
  text: para que minhas faltas por ignorância não se multipliquem[a], nem meus pecados aumentem, e eu caia diante dos meus adversários, e meu inimigo se alegre por minha causa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus erros” ou “meus atos de ignorância”. O grego distingue essas faltas dos “pecados” mencionados em seguida.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu inimigo se alegre às minhas custas”, ressaltando sua satisfação maliciosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: para que... não... nem
  rationale: Introduz a finalidade ou o resultado temido ligado à petição anterior. Em português, a construção com “não... nem” estende naturalmente a negação às duas primeiras orações.
- source_word: αἱ ἄγνοιαι μου
  choice: minhas faltas por ignorância
  rationale: Ἄγνοια pode indicar ignorância ou erro decorrente de não saber. “Faltas por ignorância” soa natural em português, conserva a dimensão moral sugerida pelo contexto e não confunde o termo com os “pecados” da oração seguinte.
- source_word: μὴ πληθύνωσιν
  choice: não se multipliquem
  rationale: O verbo expressa tornar-se numeroso ou aumentar. A forma pronominal é idiomática em português e preserva a imagem de multiplicação.
- source_word: αἱ ἁμαρτίαι μου πλεονάσωσιν
  choice: nem meus pecados aumentem
  rationale: Ἁμαρτία é traduzido pelo termo teológico corrente “pecado”, enquanto πλεονάζω indica aumento ou abundância. “Aumentem” evita repetição sem perder o paralelismo.
- source_word: πεσοῦμαι
  choice: eu caia
  rationale: Embora a forma grega seja futura, ela está coordenada numa sequência de consequências temidas após ὅπως μή. O subjuntivo português expressa naturalmente essa dependência sem especificar a natureza da queda.
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: diante dos meus adversários
  rationale: Ἔναντι indica presença ou posição diante de alguém, e ὑπεναντίοι são os que se opõem. A tradução é direta e mantém o plural.
- source_word: ἐπιχαρεῖταί μοι
  choice: se alegre com a minha queda
  rationale: O verbo indica alegrar-se com o mal ou a derrota de alguém. A formulação portuguesa explicita de modo natural que a alegria hostil decorre da queda mencionada imediatamente antes.
- source_word: ὁ ἐχθρός μου
  choice: meu inimigo
  rationale: Tradução corrente e direta de ἐχθρός. Mantém-se o singular do grego, apesar do plural “adversários” na oração anterior.
theological_decisions:
- issue: Distinção entre ἄγνοιαι e ἁμαρτίαι
  choice: Traduzir distintamente por “faltas por ignorância” e “pecados”
  alternative: “erros” e “pecados”; ou interpretar ἄγνοιαι tecnicamente como “pecados involuntários”
  rationale: O texto diferencia falhas ligadas à ignorância dos pecados em sentido mais amplo. “Faltas por ignorância” preserva essa distinção sem impor uma categoria técnica que o grego não explicita.
- issue: Nuance hostil de ἐπιχαρεῖταί μοι
  choice: “meu inimigo se alegre com a minha queda”
  alternative: “meu inimigo tripudie sobre mim”
  rationale: O contexto comunica satisfação maliciosa. A opção principal permanece digna e clara, enquanto a alternativa torna mais explícita a ideia de triunfo cruel.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O versículo foi mantido como continuação sintática da petição anterior. O paralelismo foi preservado, evitando tanto o literalismo pouco natural de “minhas ignorâncias” quanto uma interpretação técnica excessiva.
