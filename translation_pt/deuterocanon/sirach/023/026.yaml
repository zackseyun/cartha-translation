  yaml_path: translation/deuterocanon/sirach/023/026.yaml
  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: pt
  text: Deixará sua memória como maldição, e sua desonra não será apagada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: deixará
  rationale: O futuro de καταλείπω indica aquilo que permanecerá depois dela. “Deixará” é natural em português e preserva a ideia sem sugerir que ela abandona uma pessoa.
- source_word: εἰς κατάραν
  choice: como maldição
  rationale: εἰς com o acusativo pode indicar resultado. “Como maldição” comunica que a lembrança dela permanecerá associada à maldição, de modo idiomático e sem ampliar o sentido.
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: sua memória
  rationale: μνημόσυνον pode significar lembrança ou memorial. Neste contexto, refere-se à lembrança duradoura de sua reputação, não necessariamente a um monumento físico.
- source_word: τὸ ὄνειδος αὐτῆς
  choice: sua desonra
  rationale: ὄνειδος designa censura, vergonha ou desonra pública. “Desonra” conserva a dimensão social e moral do termo em linguagem atual e digna.
- source_word: οὐκ ἐξαλειφθήσεται
  choice: não será apagada
  rationale: O futuro passivo de ἐξαλείφω significa apagar ou eliminar. “Não será apagada” mantém a metáfora do original e soa natural em português contemporâneo.
theological_decisions:
- issue: A consequência moral aplicada à mulher adúltera no contexto
  choice: Manter a afirmação severa de que sua desonra pública perdurará, sem atenuá-la nem ampliá-la.
  alternative: Generalizar como simples má reputação ou acrescentar linguagem explícita de juízo divino.
  rationale: O grego fala de memória, maldição e desonra que não será apagada, mas esta oração não oferece explicação teológica adicional. A tradução preserva a força da advertência sapiencial sem importar afirmações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o paralelismo grego, e o feminino de “apagada” retoma inequivocamente “desonra”.
