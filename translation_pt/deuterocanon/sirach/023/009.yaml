  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: pt
  text: Não acostume sua boca a fazer juramentos, nem se habitue a invocar o Santo pelo nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem se habitue a mencionar o Santo”. A expressão grega pode referir-se a nomear ou invocar o Santo e também pode ser entendida como uma alusão ao uso do nome do Santo.'
    reason: alternativa lexical que preserva a ambiguidade de ὀνομασίᾳ τοῦ ἁγίου
lexical_decisions:
- source_word: ὅρκῳ
  choice: a fazer juramentos
  rationale: O dativo indica a prática à qual a boca não deve ser habituada. O plural genérico soa natural em português e mantém o foco no costume de prestar juramentos.
- source_word: μὴ ἐθίσῃς
  choice: Não acostume
  rationale: Preserva o sentido causativo de ἐθίζω, tendo “sua boca” como objeto, e expressa uma proibição contra criar esse hábito.
- source_word: τὸ στόμα σου
  choice: sua boca
  rationale: Mantém a imagem concreta do grego, natural também em português no contexto da ética da fala.
- source_word: ὀνομασίᾳ
  choice: a invocar ... pelo nome
  rationale: A palavra pode designar o ato de nomear, mencionar ou invocar pelo nome. No contexto de juramentos, “invocar ... pelo nome” comunica com clareza o uso reverente ou indevido do nome divino sem eliminar a ambiguidade, registrada em nota.
- source_word: τοῦ ἁγίου
  choice: o Santo
  rationale: O genitivo provavelmente funciona como título reverente de Deus. “O Santo” preserva esse referente sem transformar explicitamente a expressão principal em “o nome santo”.
- source_word: μὴ συνεθισθῇς
  choice: nem se habitue
  rationale: 'Expressa o valor passivo/incoativo do verbo composto: não chegar a adquirir um hábito arraigado. A formulação é corrente e digna em português.'
theological_decisions:
- issue: Referente de τοῦ ἁγίου
  choice: 'Entender a expressão como título divino: “o Santo”.'
  alternative: Entendê-la metonimicamente como “o nome santo” ou, de modo mais genérico, como “o que é santo”.
  rationale: O contexto trata do uso da fala em juramentos e favorece uma referência reverente a Deus. A tradução principal conserva o provável título, enquanto a nota reconhece a possível referência ao nome divino.
- issue: Alcance ético da proibição
  choice: Conservar a ênfase na formação de um hábito de fazer juramentos e invocar o nome divino.
  alternative: Apresentar o versículo como proibição absoluta de toda forma de juramento.
  rationale: A repetição de ἐθίζω e συνεθίζω destaca o costume ou a prática habitual. A tradução não amplia a advertência para uma proibição doutrinária universal que o texto, isoladamente, não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Sua boca” conserva a imagem sapiencial; “se habitue” mantém a ênfase ética no costume, sem linguagem excessivamente técnica ou arcaica.
