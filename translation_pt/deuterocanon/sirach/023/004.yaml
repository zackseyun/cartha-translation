  text: Lord[a], Father and God of my life, do not give me haughty eyes,
translation:
  language: pt
  text: Senhor, Pai e Deus da minha vida, não me dês olhos altivos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «olhos arrogantes» ou «olhos elevados»; a expressão grega também pode ser entendida mais literalmente como «inquietação dos olhos».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος dirigido a Deus; «Senhor» é a forma consagrada e natural na linguagem de oração.
- source_word: πάτερ
  choice: Pai
  rationale: Vocativo direto dirigido a Deus; «Pai» preserva de modo simples e exato a forma de tratamento.
- source_word: θεὲ ζωῆς μου
  choice: Deus da minha vida
  rationale: Mantém a expressão genitiva compacta e seu possível alcance, sem explicá-la como «Deus que me dá a vida».
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: olhos altivos
  rationale: A expressão pode indicar elevação ou arrogância manifestada nos olhos. «Olhos altivos» comunica naturalmente o provável sentido moral e conserva a imagem corporal do grego.
- source_word: μὴ δῷς μοι
  choice: não me dês
  rationale: Reproduz de forma direta e idiomática o pedido negativo feito em oração.
theological_decisions:
- issue: Sentido moral de μετεωρισμὸν ὀφθαλμῶν
  choice: olhos altivos
  alternative: elevação dos olhos; inquietação dos olhos; olhos errantes
  rationale: No contexto de uma oração contra vícios, a referência à soberba expressa pelo olhar é provável. Como o substantivo grego também pode sugerir elevação, inquietação ou movimento errante, a nota preserva essa ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com forma de oração natural e ampla legibilidade brasileira. A construção «Deus da minha vida» conserva o paralelismo compacto dos três vocativos; «olhos altivos» mantém a imagem bíblica sem tornar a frase artificial.
