  yaml_path: translation/deuterocanon/sirach/023/001.yaml
  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: pt
  text: Senhor, Pai e Soberano da minha vida, não me deixes no conselho deles[a]; não permitas que eu caia entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego não explicita, neste versículo, a quem ou a que se refere “deles”; a mesma ambiguidade permanece na expressão final.
    reason: Preservar a ambiguidade do antecedente dos pronomes αὐτῶν e αὐτοῖς.
lexical_decisions:
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade plena sobre a vida do orante, evitando o sentido moderno mais estreito ou áspero que “déspota” costuma ter em português.
- source_word: βουλῇ
  choice: conselho
  rationale: Mantém o campo semântico de deliberação, propósito ou plano sem escolher de modo definitivo entre essas nuances.
- source_word: ἐν αὐτοῖς
  choice: por meio deles
  rationale: Reproduz o valor instrumental possível de ἐν, refletido também na camada inglesa auditada, sem identificar explicitamente o referente do pronome.
theological_decisions:
- issue: Relação entre “Senhor”, “Pai” e “Soberano”
  choice: Manter os três títulos em sequência como formas de invocação
  alternative: Entender “Pai” como explicação de “Senhor” ou fundir os títulos
  rationale: A coordenação grega preserva uma invocação densa e teologicamente aberta, sem exigir que um título seja subordinado a outro.
- issue: Referente dos pronomes plurais
  choice: Preservar “deles” sem explicitar o referente
  alternative: Substituir por um referente inferido do contexto, como pecados, lábios ou adversários
  rationale: O versículo grego não nomeia aqui o antecedente; explicitá-lo resolveria indevidamente uma ambiguidade real.
translation_notes:
  register: Português moderno, claro e reverente. “Não me abandones” conserva o tom direto da oração; “não permitas” soa natural sem enfraquecer o pedido. A colocação “da minha vida” mantém a relação genitiva do grego.
