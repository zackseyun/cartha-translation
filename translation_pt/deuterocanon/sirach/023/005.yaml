translation:
  language: pt
  text: e afasta de mim o desejo;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cobiça”, “a luxúria” ou “o desejo desordenado”. O termo grego pode indicar um desejo intenso em sentido moralmente negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação simples com a oração precedente e preserva a dependência contextual do fragmento.
- source_word: ἐπιθυμίαν
  choice: o desejo
  rationale: O substantivo pode indicar desejo forte com sentido moralmente negativo, sem se limitar necessariamente à esfera sexual. A formulação ampla preserva o alcance lexical e deixa o contexto determinar sua força ética.
- source_word: ἀπόστρεψον
  choice: afasta
  rationale: O imperativo aoristo pede uma ação decisiva. “Afasta” comunica de modo natural em português a imagem de fazer o desejo apartar-se do suplicante.
- source_word: ἀπʼ ἐμοῦ
  choice: de mim
  rationale: A expressão preposicional indica separação do falante; “de mim” é direta e não acrescenta a interpretação mais específica “de dentro de mim”.
theological_decisions:
- issue: Força moral de ἐπιθυμία
  choice: “desejo”, em sentido amplo
  alternative: “luxúria”, “cobiça” ou “desejo desordenado”
  rationale: O grego pode designar um desejo moralmente negativo, mas a expressão isolada não o restringe explicitamente à luxúria sexual nem a uma espécie particular de cobiça. A tradução ampla preserva essa tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “afasta de mim o desejo” é idiomática e conserva a imagem verbal do grego. O ponto e vírgula reflete a continuidade da oração indicada na edição-fonte.
