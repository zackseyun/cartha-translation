base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: pt
  text: Quem porá açoites sobre os meus pensamentos e a disciplina da sabedoria sobre o meu coração, para que os açoites não me poupem por minhas faltas por ignorância e a disciplina da sabedoria não deixe passar os pecados deles[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “os pecados deles”. A expressão é difícil neste contexto, depois de “minhas faltas por ignorância”; alguns entendem o sentido como “os meus pecados” ou ajustam o pronome de outra maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: Quem porá
  rationale: Preserva a forma interrogativa e o sentido de colocar ou estabelecer algo sobre a vida interior do falante.
- source_word: ἐπὶ τοῦ διανοήματός μου
  choice: sobre os meus pensamentos
  rationale: διάνοημα pode indicar pensamento, intenção ou atividade mental; o plural coletivo soa natural em português e mantém o foco interior.
- source_word: μάστιγας
  choice: açoites
  rationale: Mantém a imagem concreta e severa de instrumentos de correção, em registro bíblico ainda compreensível.
- source_word: παιδείαν σοφίας
  choice: a disciplina da sabedoria
  rationale: παιδεία abrange disciplina, formação e instrução; a formulação conserva o genitivo e a dimensão sapiencial.
- source_word: καρδίας μου
  choice: meu coração
  rationale: Mantém a linguagem bíblica para o centro do pensamento, da vontade e da vida moral.
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: por causa das minhas faltas por ignorância
  rationale: ἀγνόημα designa uma falta cometida por desconhecimento ou inadvertência; esta formulação é mais clara que o pouco natural 'minhas ignorâncias' e preserva a distinção em relação a ἁμαρτήματα.
- source_word: μὴ φείσωνται
  choice: não me poupem
  rationale: Expressa diretamente a ideia de não refrear a correção; o objeto 'me' está implícito no contexto.
- source_word: οὐ μὴ παρῇ
  choice: não deixem passar
  rationale: Reproduz a negação enfática e o sentido de não ignorar, tolerar ou deixar sem atenção.
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: os pecados deles
  rationale: Preserva o pronome plural de terceira pessoa transmitido pelo texto grego, apesar de sua dificuldade contextual, sem emenda silenciosa.
theological_decisions:
- issue: Imagem de castigo ligada à sabedoria
  choice: Conservar 'açoites' e 'disciplina da sabedoria' como metáfora de correção moral rigorosa
  alternative: Suavizar para 'freios', 'orientação' ou 'instrução'
  rationale: O grego emprega deliberadamente uma imagem concreta e dolorosa; suavizá-la reduziria a seriedade da súplica por correção interior.
- issue: Pronome problemático em τὰ ἁμαρτήματά αὐτῶν
  choice: Manter 'os pecados deles' no texto e explicar a dificuldade em nota
  alternative: Traduzir 'os meus pecados' para ajustar o sentido ao contexto
  rationale: O testemunho fornecido traz αὐτῶν, 'deles'. A ambiguidade ou irregularidade textual deve permanecer visível, sem que uma provável correção seja incorporada silenciosamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. 'Açoites' conserva a força da metáfora sem recorrer a uma expressão excessivamente arcaica; 'faltas por ignorância' comunica com clareza o sentido específico de ἀγνοήματα. O marcador [a] está ligado ao pronome textualmente difícil.
