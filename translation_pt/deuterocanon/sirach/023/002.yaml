  terminology: “Açoites”, “disciplina da sabedoria”, “coração” e “faltas por ignorância” são escolhas fiéis e naturais. “Pecados deles” deve ser mantido, com a nota, pois corresponde ao αὐτῶν transmitido e contextualmente difícil.
