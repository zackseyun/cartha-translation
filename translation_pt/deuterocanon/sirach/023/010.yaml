base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a slave being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: pt
  text: Pois, assim como um escravo doméstico submetido a exame constante não escapará de contusões, assim também quem jura e pronuncia continuamente o Nome[a] jamais será purificado do pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “invoca continuamente o nome”. No contexto, o grego provavelmente se refere ao uso repetido do nome divino em juramentos ou em fala irreverente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: servo
  rationale: O termo designa alguém pertencente ao serviço doméstico e sujeito à autoridade de um senhor. “Servo” preserva essa condição de dependência sem reduzir o sentido ao de um empregado moderno.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: submetido a constantes interrogatórios
  rationale: O particípio com ἐνδελεχῶς expressa exame ou questionamento persistente. A formulação portuguesa mantém tanto a passividade quanto o caráter reiterado da ação.
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: não ficará livre de contusões
  rationale: μώλωψ é a contusão ou marca deixada por golpes. A expressão grega é idiomática e indica que a pessoa não escapará dessas marcas.
- source_word: ὁ ὀμνύων
  choice: aquele que vive jurando
  rationale: O particípio presente, reforçado pelo paralelo e por διὰ παντός, aponta para uma prática habitual, não para um juramento isolado.
- source_word: καὶ ὀνομάζων διὰ παντός
  choice: e pronunciando continuamente o Nome
  rationale: No contexto de juramentos, ὀνομάζω provavelmente se refere a proferir ou invocar o nome divino. “O Nome” conserva a elipse reverente do grego, enquanto a nota registra a alternativa lexical.
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: jamais será purificado do pecado
  rationale: A construção οὐ μή traz uma negação enfática, e καθαρίζω conserva aqui a imagem moral e religiosa de purificação.
theological_decisions:
- issue: Referência de “pronunciando o Nome”
  choice: Alusão ao uso habitual do nome divino em juramentos ou fala irreverente
  alternative: Referência genérica a pronunciar ou invocar um nome, sem identificar explicitamente o nome de Deus
  rationale: A associação imediata com jurar torna provável a referência ao nome divino. A tradução preserva a elipse do original por meio de “o Nome”, sem acrescentar explicitamente “de Deus”, e a nota mantém aberta a nuance de invocação.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Servo” mantém o cenário social antigo; “vive jurando” comunica o aspecto habitual, e “jamais” reproduz a forte negação grega.
