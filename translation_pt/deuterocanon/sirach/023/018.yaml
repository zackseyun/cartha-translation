  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: pt
  text: 'Um homem que se desvia do próprio leito[a] diz em sua alma: “Quem me vê?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito conforme o contexto, “que abandona o leito conjugal”. O grego diz literalmente “que transgride/se desvia do seu leito”, expressão eufemística que, neste contexto, se refere ao pecado sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Um homem
  rationale: O substantivo está no singular e, neste contexto, apresenta um indivíduo masculino representativo, não a humanidade em sentido abstrato.
- source_word: παραβαίνων
  choice: que se desvia
  rationale: O particípio expressa a ideia de ultrapassar um limite ou transgredir. Com «do próprio leito», «se desvia» conserva tanto a censura moral quanto a formulação indireta do grego, sem explicitar adultério além do que a oração declara.
- source_word: ἀπὸ τῆς κλίνης αὐτοῦ
  choice: do próprio leito
  rationale: κλίνη pode designar cama ou leito. «Leito» mantém um registro digno e permite que o contexto comunique a conotação conjugal; «próprio» torna clara a referência reflexiva de αὐτοῦ sem sugerir mera posse de um móvel.
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: diz em sua alma
  rationale: A expressão descreve fala interior. A tradução preserva ψυχή como «alma» e sua textura antropológica, embora «diz consigo mesmo» fosse mais idiomático.
- source_word: Τίς με ὁρᾷ;
  choice: Quem me vê?
  rationale: Tradução direta da pergunta no presente, preservando a suposição de que o ato permanece oculto.
theological_decisions:
- issue: Explicitar ou não a conotação sexual e conjugal no texto principal
  choice: Manter a expressão indireta «que se desvia do próprio leito»
  alternative: «que abandona o leito conjugal» ou «que comete adultério»
  rationale: O contexto torna forte a referência à infidelidade sexual, mas esta oração emprega linguagem eufemística, não um termo explícito para adultério. A tradução mantém essa tensão e esclarece a implicação apenas em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Leito» conserva o eufemismo conjugal e o tom sapiencial; «diz em sua alma» mantém deliberadamente a formulação antropológica do original.
