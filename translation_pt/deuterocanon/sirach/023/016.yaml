translation:
  language: pt
  text: Dois tipos multiplicam os pecados, e o terceiro[a] trará ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o terceiro tipo”. O grego deixa implícito o substantivo depois de “terceiro”.'
    reason: Esclarece a elipse gramatical sem inserir no texto principal uma especificação que o grego apenas sugere.
lexical_decisions:
- source_word: Δύο εἴδη
  choice: Dois tipos
  rationale: A expressão introduz duas categorias numa enumeração sapiencial; “tipos” é corrente e permite retomar naturalmente o substantivo implícito em “o terceiro”.
- source_word: πληθύνουσιν
  choice: multiplicam
  rationale: Preserva a imagem verbal de tornar os pecados mais numerosos, sem reduzi-la simplesmente a “aumentam”.
- source_word: ἁμαρτίας
  choice: os pecados
  rationale: Mantém o plural explícito do grego; o artigo torna a construção natural em português.
- source_word: τὸ τρίτον
  choice: o terceiro
  rationale: Conserva a forma elíptica do grego, na qual o substantivo correspondente a “tipo” fica implícito.
- source_word: ἐπάξει
  choice: trará
  rationale: Reproduz de modo direto o futuro de ἐπάγω, com o sentido de trazer ou ocasionar.
- source_word: ὀργήν
  choice: ira
  rationale: Mantém a intensidade de ὀργή sem acrescentar quem sente ou executa essa ira.
theological_decisions:
- issue: Referente da ira
  choice: A ira permanece sem possuidor ou agente especificado.
  alternative: A ira de Deus; castigo.
  rationale: O grego traz apenas ὀργήν e não identifica Deus nem substitui a ira por sua possível consequência punitiva.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma máxima sapiencial. A formulação preserva tanto a enumeração quanto a falta de especificação do referente de “ira”.
