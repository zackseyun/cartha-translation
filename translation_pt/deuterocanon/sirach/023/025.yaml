  text: Her children will not take root[a], and her branches will not bear fruit;
translation:
  language: pt
  text: Seus filhos não criarão raízes[a], e seus ramos não darão fruto;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “não se espalharão em direção a uma raiz”. A expressão grega é uma imagem vegetal condensada para não chegar a se estabelecer ou criar raízes.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαδώσουσιν ... εἰς ῥίζαν
  choice: criarão raízes
  rationale: A expressão grega é condensada e, literalmente, sugere espalhar-se ou estender-se em direção a uma raiz. Em português, “criar raízes” comunica com naturalidade o estabelecimento e a continuidade representados pela imagem vegetal, sem explicar além do que o texto diz.
- source_word: τὰ τέκνα αὐτῆς
  choice: seus filhos
  rationale: τέκνα designa filhos ou descendentes. “Seus filhos” é direto, corrente e preserva a imagem familiar do texto.
- source_word: οἱ κλάδοι αὐτῆς
  choice: seus ramos
  rationale: κλάδοι significa ramos ou brotos. “Ramos” mantém claramente a metáfora vegetal ligada às raízes e ao fruto.
- source_word: οὐ δώσουσιν καρπόν
  choice: não darão fruto
  rationale: Embora δίδωμι signifique literalmente “dar”, “dar fruto” é também a expressão idiomática natural em português e conserva de perto a forma e a imagem gregas.
theological_decisions:
- issue: Juízo metafórico sobre a mulher e sua descendência no contexto
  choice: Manter juntas as imagens familiar e vegetal, sem explicitar a natureza da condenação além do versículo.
  alternative: Traduzir interpretativamente como “seus descendentes não prosperarão, nem terão continuidade”.
  rationale: O grego apresenta a consequência por meio de filhos, raízes, ramos e fruto. A tradução preserva essa tensão metafórica e evita acrescentar uma explicação moral ou doutrinária ausente do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Criar raízes” oferece naturalidade sem desfazer a metáfora botânica, reforçada por “ramos” e “fruto”.
