base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/027.yaml
  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: pt
  text: E os que restarem[a] saberão que nada é melhor do que o temor do Senhor e nada é mais doce do que atender aos mandamentos do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os sobreviventes” ou “os que foram deixados”. O grego diz literalmente “os que foram deixados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “prestar atenção aos mandamentos do Senhor”. O verbo grego sugere atenção que leva a uma resposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: saberão
  rationale: O futuro de ἐπιγινώσκω indica aqui chegar a um conhecimento claro ou reconhecer algo à luz das consequências. “Saberão” é natural e conciso, sem excluir essa nuance contextual.
- source_word: οἱ καταλειφθέντες
  choice: os que restarem
  rationale: A expressão designa aqueles que foram deixados ou permaneceram. “Os que restarem” conserva a indeterminação do grego sem impor que sejam especificamente sobreviventes de um juízo.
- source_word: οὐδὲν κρεῖττον
  choice: nada é melhor
  rationale: Reproduz de modo direto e idiomático a força comparativa absoluta da expressão grega.
- source_word: φόβου Κυρίου
  choice: o temor do Senhor
  rationale: Mantém a expressão central da literatura sapiencial, cujo alcance inclui reverência, assombro e uma postura obediente diante do Senhor.
- source_word: γλυκύτερον
  choice: mais doce
  rationale: Preserva a metáfora sensorial e a qualidade poética do adjetivo grego, em vez de reduzi-lo a “mais agradável”.
- source_word: τοῦ προσέχειν
  choice: do que atender
  rationale: Com dativo, προσέχειν comunica atenção responsiva, isto é, dar ouvidos e orientar a conduta pelo que é ordenado. “Atender aos mandamentos” exprime isso em português atual e digno.
- source_word: ἐντολαῖς Κυρίου
  choice: aos mandamentos do Senhor
  rationale: “Mandamentos” preserva o registro bíblico de ἐντολαί e mantém o paralelismo com “temor do Senhor”.
theological_decisions:
- issue: Sentido de “temor do Senhor” na literatura sapiencial
  choice: Manter “o temor do Senhor”
  alternative: “a reverência pelo Senhor” ou “o assombro diante do Senhor”
  rationale: A formulação tradicional conserva a amplitude teológica da expressão, que reúne reverência, assombro e obediência; uma paráfrase selecionaria apenas uma dessas dimensões.
- issue: Identidade dos que foram deixados
  choice: Não identificar explicitamente o grupo como sobreviventes ou remanescente
  alternative: “os sobreviventes” ou “o remanescente”
  rationale: O particípio grego afirma apenas que essas pessoas foram deixadas. Especificar sobrevivência a um juízo ou um remanescente teológico resolveria uma ambiguidade que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “do Senhor” e a metáfora de doçura foram mantidas para preservar o paralelismo e o caráter sapiencial do grego.
