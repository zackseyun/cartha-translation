  yaml_path: translation/deuterocanon/sirach/023/007.yaml
  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: pt
  text: Ouçam, filhos, a instrução sobre o falar[a]; quem a observar de modo algum será apanhado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “instrução da boca”. Também pode ser traduzido por “disciplina da boca” ou “instrução para o falar”. A expressão grega é compacta e admite uma forma mais literal ou mais idiomática.
    reason: lexical_alternative
  - marker: b
    text: “De modo algum será apanhado” traduz uma negação enfática no grego. Outra tradução possível é “certamente não será pego”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  choice: instrução
  rationale: O termo pode significar instrução, formação ou disciplina. Neste contexto sapiencial e exortativo, “instrução” comunica com naturalidade o ensino formador sem restringi-lo a castigo ou correção.
- source_word: στόματος
  choice: sobre o falar
  rationale: O genitivo significa literalmente “da boca”, mas a expressão grega é compacta e se refere à conduta verbal. “Sobre o falar” transmite esse sentido em português corrente sem estreitá-lo a uma forma específica de discurso.
- source_word: ἀκούσατε
  choice: Ouçam
  rationale: O imperativo convoca os destinatários a receber atentamente a instrução. “Ouçam” preserva o sentido direto sem acrescentar explicitamente a ideia de obediência contida em “atendam” ou “sigam”.
- source_word: τέκνα
  choice: filhos
  rationale: Como vocativo plural em literatura sapiencial, “filhos” é uma forma natural e digna de tratamento pedagógico. Não se acrescenta o possessivo “meus”, ausente do grego.
- source_word: ὁ φυλάσσων
  choice: quem a observar
  rationale: φυλάσσω pode significar guardar, vigiar ou observar. “Observar” é idiomático para pôr uma instrução em prática; o pronome “a” explicita o objeto implícito, retomando “instrução”.
- source_word: οὐ μὴ
  choice: de modo algum
  rationale: A combinação οὐ μή expressa negação enfática. “De modo algum” conserva essa força de maneira clara e natural.
- source_word: ἁλῷ
  choice: será apanhado
  rationale: O verbo ἁλίσκομαι significa ser apanhado, capturado ou tomado. “Será apanhado” mantém a amplitude da imagem e evita impor uma interpretação especificamente jurídica, como “será condenado”.
theological_decisions:
- issue: Objeto implícito de ὁ φυλάσσων
  choice: Explicitar com “a”, retomando a instrução sobre o falar.
  alternative: Manter o objeto sem expressão explícita ou traduzir “quem guardar isso”.
  rationale: O português pede naturalmente um complemento neste contexto, e o antecedente imediato é “instrução”. O pronome feminino torna a referência clara sem introduzir um novo conceito.
- issue: Sentido da consequência final
  choice: Conservar a imagem ampla de não ser apanhado.
  alternative: 'Interpretar em sentido jurídico: “não será condenado” ou “não será declarado culpado”.'
  rationale: O contexto trata dos perigos da fala, mas o grego não especifica tribunal, condenação ou culpa formal. A tradução preserva a tensão entre ser pego em falta e sofrer as consequências dela.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e compreensão internacional. O vocativo foi deslocado para uma posição natural em português. “Sobre o falar” evita o pouco idiomático “da boca”, enquanto a nota preserva a forma compacta do original. O ponto e vírgula representa com fluidez a coordenação grega sem alterar a relação entre exortação e consequência.
