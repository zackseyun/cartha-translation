  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
translation:
  language: pt
  text: Ela será levada diante da assembleia, e haverá uma averiguação a respeito de seus filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haverá uma visitação sobre seus filhos”, possivelmente no sentido de punição judicial, e não apenas de averiguação.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a mulher adúltera do contexto imediato; o pronome é natural e claro em português.
- source_word: ἐκκλησίαν
  choice: assembleia
  rationale: Designa a comunidade reunida, sem antecipar o sentido técnico cristão posterior de “igreja”.
- source_word: ἐξαχθήσεται
  choice: será levada diante de
  rationale: Preserva a voz passiva e comunica a apresentação pública da mulher perante a comunidade.
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: a respeito de seus filhos
  rationale: Mantém a flexibilidade de ἐπί, indicando que os filhos serão objeto da averiguação sem afirmar no texto principal que sofrerão punição.
- source_word: ἐπισκοπὴ
  choice: averiguação
  rationale: Expressa exame ou investigação oficial em português corrente, evitando o sentido eclesiástico de “supervisão” e sem eliminar a possível conotação judicial.
- source_word: ἔσται
  choice: haverá
  rationale: Corresponde de modo direto e natural à construção existencial futura.
theological_decisions:
- issue: Se ἐκκλησία deve receber linguagem eclesial posterior
  choice: assembleia
  alternative: igreja; congregação
  rationale: O contexto é de exposição e julgamento perante a comunidade reunida, não de uma instituição cristã posterior.
- issue: A intensidade judicial de ἐπισκοπή
  choice: averiguação
  alternative: visitação; castigo
  rationale: O termo admite exame oficial e também uma visitação de caráter punitivo. O texto principal não explicita o castigo, por isso conserva a ambiguidade e registra a leitura mais forte em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assembleia” evita anacronismo eclesiástico; “averiguação” soa natural e preserva o caráter oficial e potencialmente judicial do contexto.
