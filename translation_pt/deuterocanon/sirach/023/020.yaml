translation:
  language: pt
  text: Antes de todas as coisas serem criadas, tudo já lhe era conhecido[a]; assim também depois de tudo estar concluído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Antes de todas as coisas serem criadas, ele já as conhecia; assim também depois de tudo estar concluído.” A forma grega ἔγνωσται pode ser expressa como um estado — “lhe era conhecido” — ou, pelo sentido, como conhecimento atribuído diretamente a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ
  choice: Antes de
  rationale: Introduz de modo direto a anterioridade temporal e se liga naturalmente ao infinitivo em português.
- source_word: κτισθῆναι
  choice: serem criadas
  rationale: Preserva o sentido passivo do infinitivo aoristo de κτίζω e concorda com “todas as coisas”.
- source_word: τὰ πάντα
  choice: todas as coisas / tudo
  rationale: A primeira expressão preserva o alcance totalizante e a forma plural do grego; “tudo”, na oração principal, evita uma construção artificial e representa o neutro coletivo.
- source_word: ἔγνωσται αὐτῷ
  choice: já lhe era conhecido
  rationale: Mantém a construção com dativo e o valor de estado resultante do perfeito médio-passivo, enquanto “já” explicita naturalmente a anterioridade completa indicada pelo contexto.
- source_word: οὕτως καὶ
  choice: assim também
  rationale: Conserva o paralelismo explícito entre o que ocorre antes da criação e depois da conclusão.
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: depois de chegarem ao fim
  rationale: Expressa a relação temporal do infinitivo articular e conserva a ideia de conclusão sem impor uma interpretação técnica ou denominacional a “fim”.
theological_decisions:
- issue: Referente implícito de αὐτῷ
  choice: Manter o pronome em “lhe”, deixando que o contexto identifique Deus.
  alternative: Inserir explicitamente “a Deus”.
  rationale: O contexto aponta para o conhecimento divino, mas o texto grego usa apenas o pronome; explicitar “Deus” acrescentaria algo não declarado neste versículo.
- issue: Voz e perspectiva de ἔγνωσται
  choice: Usar a formulação estativa “tudo já lhe era conhecido”.
  alternative: Usar a formulação ativa “ele já conhecia tudo”.
  rationale: A opção principal acompanha mais de perto a forma perfeita médio-passiva e preserva a perspectiva do objeto conhecido; a alternativa legítima é registrada em nota.
- issue: Sentido de συντελεσθῆναι
  choice: Traduzir de modo geral como “chegarem ao fim”.
  alternative: Traduzir como “serem consumadas” ou interpretar especificamente como o fim escatológico.
  rationale: O verbo comunica conclusão ou término, mas o versículo isolado não exige que se especifique a natureza desse fim.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção principal preserva a forma estativa do grego; a nota registra a alternativa ativa sem definir além do texto a natureza do conhecimento divino ou do fim mencionado.
