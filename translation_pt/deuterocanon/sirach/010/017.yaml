  text: He swept them from the earth and uprooted them[a], and he made their memory cease from the earth.
translation:
  language: pt
  text: Ele os varreu[a] da terra e os arrancou pela raiz; fez desaparecer da terra a memória deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O sentido do hebraico וְסִחָם é incerto; o paralelo grego apoia a ideia de removê-los ou eliminá-los. Outra tradução possível é: “Ele os eliminou da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: Ele os varreu
  rationale: O verbo hebraico é incomum e de sentido incerto; o paralelo grego confirma a ideia de remoção ou aniquilação. “Varreu” conserva a imagem vigorosa sem especificar em excesso.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. A repetição nos dois membros e o paralelo grego favorecem aqui o sentido amplo de “terra”.
- source_word: וַיִּתְּשֵׁם
  choice: e os arrancou pela raiz
  rationale: A forma de נתשׁ expressa arrancar ou desarraigar. A locução portuguesa mantém de modo claro a imagem de remoção completa.
- source_word: וַיַּשְׁבֵּת
  choice: fez desaparecer
  rationale: O Hifil de שׁבת significa causar a cessação. Com “a memória deles” como objeto, “fez desaparecer” é natural em português e preserva a ideia de pôr fim.
- source_word: זִכְרָם
  choice: a memória deles
  rationale: “Memória” é a equivalência portuguesa mais direta e natural para a lembrança, o nome ou o legado que permanece de alguém.
