base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/011.yaml
  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: pt
  text: Ao morrer, o homem herdará larvas e vermes, piolhos[a] e criaturas rastejantes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “mosquitos” ou, de modo mais geral, “insetos nocivos”; a identificação exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego traz uma lista mais ampla e diferente: “herdará criaturas rastejantes, feras e vermes”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Ao morrer
  rationale: A preposição בְּ com o infinitivo construto tem sentido temporal. “Ao morrer” é natural em português e conserva a concisão do hebraico.
- source_word: אָדָם
  choice: o homem
  rationale: O substantivo singular designa aqui um ser humano representativo. “O homem” mantém a forma masculina singular e o caráter proverbial da frase.
- source_word: יִנְחַל
  choice: herdará
  rationale: O verbo significa receber ou tomar por herança. A forma verbal direta preserva a imagem irônica de que, na morte, essas criaturas serão a herança humana.
- source_word: רִמָּה
  choice: larvas
  rationale: O termo se refere a larvas ou vermes associados à decomposição de cadáveres. “Larvas” também o distingue do substantivo seguinte.
- source_word: וְתוֹלֵעָה
  choice: e vermes
  rationale: תּוֹלֵעָה denota normalmente um verme. A tradução separada conserva o par de criaturas semelhantes, mas não idênticas, do hebraico.
- source_word: כִּנִּים
  choice: piolhos
  rationale: O termo pode indicar piolhos ou, de modo menos específico, pequenos insetos parasitas ou enxameadores. “Piolhos” é uma leitura lexical plausível e adequada à lista de criaturas desprezadas, com a incerteza registrada em nota.
- source_word: וָרֶמֶשׂ
  choice: e criaturas rastejantes
  rationale: רֶמֶשׂ é um termo amplo para pequenos seres que rastejam. “Criaturas rastejantes” comunica essa amplitude sem restringi-lo indevidamente a répteis.
theological_decisions:
- issue: Masculino representativo em אָדָם
  choice: o homem
  alternative: o ser humano; uma pessoa
  rationale: O provérbio tem aplicação humana geral, mas o hebraico emprega um substantivo masculino singular. A tradução mantém essa forma sem limitar explicitamente a afirmação aos homens do sexo masculino.
- issue: Prioridade do testemunho hebraico diante da forma grega
  choice: Traduzir diretamente a lista hebraica de criaturas
  alternative: 'Seguir o grego: “herdará criaturas rastejantes, feras e vermes”'
  rationale: Como há texto hebraico preservado e validado, ele rege a tradução. O grego confirma o sentido geral da imagem, mas apresenta uma lista diferente, que é registrada em nota sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e solene, com construção proverbial concisa. “Ao morrer” evita uma formulação pesada, enquanto “herdará” conserva diretamente a ironia do verbo hebraico. Os marcadores de nota aparecem junto ao termo incerto e ao fim da lista textual.
