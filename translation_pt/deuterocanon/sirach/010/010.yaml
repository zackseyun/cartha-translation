  text: A slight illness makes a physician turn pale[a]; a king today[b], and tomorrow he falls.
translation:
  language: pt
  text: Uma leve enfermidade faz o médico empalidecer[a]; um rei hoje, amanhã cairá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico emprega uma imagem de mudança de cor: “faz o médico amarelecer” ou “ficar amarelado”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego torna o sentido mais específico: “e amanhã morrerá” ou “chegará ao fim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶץ מַחֲלָה
  choice: uma leve enfermidade
  rationale: שֶׁמֶץ indica quantidade ou grau pequeno; junto de מַחֲלָה, descreve uma enfermidade de pouca gravidade e realça o contraste proverbial.
- source_word: יַצְהִיב
  choice: faz ... empalidecer
  rationale: O verbo evoca uma mudança de cor para o amarelo ou uma palidez doentia. “Empalidecer” comunica naturalmente em português o efeito visível da doença; a imagem cromática literal é registrada em nota.
- source_word: רוֹפֵא
  choice: médico
  rationale: Designa aquele que cura. “Médico” é corrente, claro e apropriado ao contexto, sem a possível amplitude religiosa ou popular de “curandeiro”.
- source_word: מֶלֶךְ הַיּוֹם
  choice: rei hoje
  rationale: Mantém a concisão da oração nominal hebraica e o contraste abrupto entre a posição presente e a queda no dia seguinte.
- source_word: וּמָחָר יִפּוֹל
  choice: amanhã cairá
  rationale: יִפּוֹל significa primariamente “cair”. O futuro “cairá” é natural em português e conserva a amplitude entre morte, ruína e perda de posição.
theological_decisions:
- issue: Se a queda do rei deve ser apresentada especificamente como morte ou, de modo mais amplo, como queda
  choice: amanhã cairá
  alternative: amanhã morrerá / chegará ao fim
  rationale: O testemunho hebraico principal usa יִפּוֹל, “cair”, que pode incluir a morte sem se limitar a ela. O paralelo grego explicita a morte; a tradução principal preserva a formulação mais ampla do hebraico e registra a interpretação grega em nota.
translation_notes:
  register: Português moderno, conciso e proverbial, com leitura natural no Brasil e compreensão internacional. A construção elíptica “rei hoje” preserva o impacto da oração nominal hebraica; a pontuação mantém o forte contraste entre a condição presente e a queda iminente.
