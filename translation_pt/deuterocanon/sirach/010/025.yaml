  text: Do not act wisely in doing your work, and do not boast in a time of distress.[a]
translation:
  language: pt
  text: Não se faça de sábio ao realizar o seu trabalho, nem se vanglorie quando estiver em dificuldades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado diverge substancialmente: “O servo prudente foi exaltado, e o servo insensato não se queixará”. O verbo final é incerto e também pode ter o sentido de “murmurar” ou “buscar um pretexto”.'
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ σοφίζου
  choice: Não se faça de sábio
  rationale: O imperativo médio adverte contra assumir ou exibir uma postura de sábio, não contra agir com verdadeira sabedoria. A formulação preserva essa nuance sem transformar a sabedoria em algo negativo.
- source_word: ποιῆσαι τὸ ἔργον σου
  choice: ao realizar o seu trabalho
  rationale: Expressa de modo natural a ação ou o âmbito em que ocorre a ostentação de sabedoria, mantendo o sentido de ἔργον como trabalho ou tarefa.
- source_word: μὴ δοξάζου
  choice: nem se vanglorie
  rationale: No contexto da exortação, o verbo tem sentido reflexivo de gloriar-se ou enaltecer-se; “vangloriar-se” é claro e idiomático em português atual.
- source_word: ἐν καιρῷ στενοχωρίας σου
  choice: quando estiver em dificuldades
  rationale: Reproduz de modo natural o valor temporal de καιρός e o sentido de aflição, aperto ou adversidade de στενοχωρία.
- source_word: עֶבֶד מַשְׂכּיל הוּרָם, וְעֶבֶד סָכָל לֹא יִתְאוֹנֵן
  choice: registrado em nota como testemunho hebraico divergente
  rationale: O hebraico preservado diverge substancialmente do grego e não deve ser fundido com ele. A leitura é apresentada em nota, com indicação da incerteza do verbo final.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego de Sirácida 10:25
  choice: Seguir no texto principal a exortação preservada no grego
  alternative: “O servo prudente foi exaltado, e o servo insensato não se queixará”, conforme o testemunho hebraico preservado
  rationale: Trata-se de uma decisão textual, não doutrinária. Os testemunhos não são semanticamente paralelos e não devem ser harmonizados. O grego fornece o texto contínuo desta passagem; a leitura hebraica substancialmente diferente é preservada com transparência em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não se faça de sábio” evita o sentido enganoso de proibir a conduta verdadeiramente sábia e comunica a ideia de ostentação ou pretensão presente no grego.
