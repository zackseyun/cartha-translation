translation:
  language: pt
  text: Como alguém é honrado em sua riqueza[a] e como é desprezado em sua pobreza!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego apresenta ordem e ênfase diferentes: “Mas aquele que é honrado na pobreza — quanto mais na riqueza? E aquele que não tem honra na riqueza — quanto mais na pobreza?” Aqui, o testemunho hebraico é tomado como principal, e o grego é usado como verificação de coerência.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: é honrado
  rationale: O nifal de כבד indica ser honrado ou estimado; “é honrado” preserva o sentido passivo e social.
- source_word: בְּעָשְׁרוֹ
  choice: em sua riqueza
  rationale: Mantém a preposição hebraica como indicação de circunstância ou esfera, sem decidir se a riqueza é propriamente a causa da honra.
- source_word: אֵיכָכָה
  choice: como
  rationale: A partícula expressa intensidade em tom exclamativo ou interrogativo; “como” preserva essa força sem introduzir explicitamente a ideia de “quanto mais”.
- source_word: וְנִקְלֶה
  choice: e é desprezado
  rationale: O nifal de קלה descreve alguém tido em pouca conta ou tratado com desprezo; a escolha forma um contraste claro com “honrado”.
- source_word: בְּעָנְיוֹ
  choice: em sua pobreza
  rationale: Reproduz o paralelismo com “em sua riqueza” e conserva a pobreza como condição ou esfera, sem convertê-la necessariamente em causa.
- source_word: δοξαζόμενος / ἄδοξος / ποσαχῶς (paralelo grego)
  choice: apoio ao contraste exclamativo do hebraico
  rationale: O grego confirma o tema da honra e da desonra em riqueza e pobreza, mas apresenta ordem e ênfase diferentes; por isso, o hebraico rege o texto principal.
