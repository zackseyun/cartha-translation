base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/003.yaml
  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
translation:
  language: pt
  text: Como é o governante de um povo[a], assim são os seus oficiais; e como é o chefe de uma cidade, assim são os seus habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Um rei sem instrução destruirá o seu povo, e uma cidade será povoada graças à inteligência dos governantes.” As formas hebraica e grega preservadas deste versículo diferem substancialmente; o texto principal segue o testemunho hebraico existente.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט
  choice: Como é o governante
  rationale: שׁוֹפֵט pode designar tanto juiz como governante. Neste provérbio sobre liderança pública, “governante” comunica naturalmente a função sem limitar o termo ao âmbito judicial; a construção “Como é... assim são...” preserva o paralelismo comparativo.
- source_word: עַם
  choice: um povo
  rationale: עַם tem sentido coletivo e genérico; “um povo” conserva o caráter proverbial, sem identificar uma nação específica.
- source_word: מְלִיצָיו
  choice: os seus oficiais
  rationale: Embora מֵלִיץ possa significar intérprete, porta-voz ou mediador, o contexto de governo favorece os agentes ou funcionários ligados ao governante. “Oficiais” mantém esse sentido administrativo sem especificar funções não expressas no hebraico.
- source_word: וּכְרֹאשׁ עִיר
  choice: e como é o chefe de uma cidade
  rationale: רֹאשׁ significa literalmente “cabeça” e, metaforicamente, chefe ou líder. “Chefe” é claro e idiomático em português, preservando a ideia de autoridade urbana.
- source_word: יוֹשְׁבָיו
  choice: os seus habitantes
  rationale: יוֹשְׁבָיו refere-se aos que moram nela. “Seus habitantes” é conciso, natural e mantém a correspondência proverbial entre o chefe e a população da cidade.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal o testemunho hebraico existente, que compara os oficiais e habitantes com seus líderes.
  alternative: 'Grego: “Um rei sem instrução destruirá o seu povo, mas uma cidade será povoada graças à inteligência dos governantes.”'
  rationale: O hebraico deste versículo está preservado com alta confiança e rege a tradução. O grego representa uma forma consideravelmente diferente, por isso não deve ser harmonizado silenciosamente com o hebraico; sua leitura é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação correlativa “Como é... assim são...” reproduz com naturalidade o paralelismo proverbial hebraico. O marcador [a] foi colocado após “povo”, onde sinaliza a variante grega referente ao versículo inteiro.
