  text: God erased the traces of nations[b][a], and their root to the very ground.
translation:
  language: pt
  text: Deus apagou os rastros das nações e arrancou sua raiz até o fundo da terra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo hebraico traduzido como “fundo” é raro e também pode indicar a profundidade mais baixa ou a base do solo. A imagem comunica remoção completa.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “O Senhor arrancou as raízes das nações e plantou os humildes no lugar delas.” O testemunho hebraico fala, em vez disso, de Deus apagar os “rastros” das nações e arrancar sua “raiz” até o fundo da terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִקְבוֹת
  choice: rastros
  rationale: Preserva a imagem concreta de marcas deixadas por passos, mas soa mais natural em português do que “pegadas” quando se fala da eliminação de povos.
- source_word: גּוֹיִם
  choice: nações
  rationale: Designa povos ou nações, sem introduzir o sentido teológico posterior de “gentios”.
- source_word: טִמְטֵם
  choice: apagou
  rationale: Expressa a ideia de obliterar ou fazer desaparecer e combina naturalmente com “rastros”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Segue diretamente o testemunho hebraico, sem harmonizá-lo com “o Senhor” do paralelo grego.
- source_word: וְשָׁרְשָׁם
  choice: sua raiz
  rationale: Mantém o singular coletivo do hebraico e a imagem da remoção completa desde a origem.
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: até o fundo da terra
  rationale: Comunica a extensão extrema da remoção sem impor a especificidade geológica de “rocha-mãe” a um substantivo hebraico raro e incerto.
theological_decisions:
- issue: Divergência entre as imagens do hebraico e do grego
  choice: 'Seguir no texto principal o hebraico preservado: Deus apaga os rastros das nações e remove sua raiz.'
  alternative: 'O grego diz: “O Senhor arrancou as raízes das nações e plantou os humildes no lugar delas.”'
  rationale: O hebraico é a fonte primária onde está preservado. A leitura grega é materialmente diferente e, por isso, é registrada em nota, sem substituir nem harmonizar o texto hebraico.
- issue: Força verbal implícita na segunda oração
  choice: Explicitar “arrancou” antes de “sua raiz”.
  alternative: 'Manter uma construção elíptica: “e sua raiz até o fundo da terra”.'
  rationale: O hebraico é conciso e a ação sobre a raiz pode ser entendida pelo paralelismo. Em português, explicitar “arrancou” torna a frase inteligível e preserva a imagem de erradicação total, sem recorrer à formulação distinta do grego como texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rastros” mantém a imagem hebraica de vestígios de passos; “fundo da terra” evita uma precisão indevida. Os marcadores seguem a ordem normal [a][b] e ambos aparecem no texto principal.
