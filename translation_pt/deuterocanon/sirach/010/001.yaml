  text: A wise judge sets his people in order[a], and the rule of one who understands is well arranged.
translation:
  language: pt
  text: Um juiz põe o seu povo em ordem[a], e o governo de quem tem discernimento é bem ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por «estabelece» ou «funda»; o paralelo grego favorece aqui a ideia de governar ou pôr um povo em ordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵט
  choice: juiz
  rationale: O substantivo hebraico designa naturalmente um juiz ou autoridade governante; o paralelo grego κριτής confirma «juiz».
- source_word: יוֹסֵד
  choice: põe ... em ordem
  rationale: Embora o verbo possa significar «estabelecer» ou «fundar», o objeto «povo», o paralelismo com סְדוּרָה e o testemunho grego favorecem aqui a ideia de ordenar e estabilizar mediante bom governo.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Preserva tanto o sentido coletivo de עַם como o possessivo explícito, também atestado no grego.
- source_word: מֶמְשֶׁלֶת
  choice: o governo
  rationale: Neste contexto, a palavra se refere ao exercício organizado da autoridade. «Governo» forma um paralelo natural com a atuação do juiz no primeiro membro.
- source_word: מֵבִין
  choice: quem tem discernimento
  rationale: O particípio descreve uma pessoa dotada de entendimento ou discernimento. A formulação é natural em português e não especifica gênero além do que o contexto exige.
- source_word: סְדוּרָה
  choice: bem organizado
  rationale: O termo expressa a condição de algo disposto ou ordenado. A concordância no masculino acompanha «governo» na tradução portuguesa e comunica a avaliação positiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial equilibrada. «Põe seu povo em ordem» mantém a imagem administrativa sem sugerir a fundação literal de um povo; «quem tem discernimento» evita linguagem excessivamente técnica.
