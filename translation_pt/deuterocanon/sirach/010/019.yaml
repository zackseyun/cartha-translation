base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/019.yaml
  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: pt
  text: Que descendência é honrada? A descendência humana.[a] Que descendência é honrada? Os que temem a Deus.[b] Que descendência é honrada? Os que guardam o mandamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego conclui o versículo de modo diferente: “Que descendência é desonrada? A descendência humana”. O hebraico traz: “Que descendência é honrada? Os que guardam o mandamento”.'
    reason: textual_variant
  - marker: b
    text: O grego traz “os que temem o Senhor”, em vez de “os que temem a Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: descendência
  rationale: Preserva o sentido coletivo e a repetição retórica do termo hebraico e grego. Em português atual, é mais natural neste contexto do que o literal «semente» e menos restrito do que «linhagem».
- source_word: נִכְבָּד / ἔντιμον
  choice: honrada
  rationale: Expressa valor e condição de honra sem sugerir necessariamente origem aristocrática, como poderia ocorrer com «nobre».
- source_word: מַה / ποῖον
  choice: que
  rationale: Na fórmula «Que descendência é honrada?», comunica de modo conciso a classificação retórica do original e conserva o estilo aforístico.
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: humana
  rationale: Indica a humanidade em sentido genérico, sem introduzir uma referência exclusivamente masculina.
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: os que temem a Deus
  rationale: Segue o hebraico extante, que traz «Deus»; a formulação verbal reproduz naturalmente o particípio e mantém a linguagem sapiencial bíblica.
- source_word: שׂוֹמֵר מִצְוָה
  choice: os que guardam o mandamento
  rationale: Mantém o singular «mandamento» do hebraico e traduz שמר pelo idioma bíblico corrente «guardar», que abrange observar e obedecer.
theological_decisions:
- issue: Divergência textual entre o hebraico e o grego na última frase do versículo
  choice: 'Seguir o hebraico extante, com a terceira formulação positiva: «Os que guardam o mandamento».'
  alternative: 'O grego conclui: «Que descendência é desonrada? A descendência humana».'
  rationale: Como o texto hebraico está preservado e é a fonte primária nesta passagem de Sirácida, ele rege o texto principal. A leitura grega é substancialmente diferente e, por isso, é registrada em nota sem harmonização.
- issue: Nome divino na segunda resposta
  choice: «Deus», conforme o hebraico יְרֵא אֱלֹהִים.
  alternative: O grego traz «o Senhor».
  rationale: A tradução segue o testemunho hebraico primário, preservando em nota a leitura paralela grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «Que descendência é honrada?» foi mantida para preservar a estrutura retórica do hebraico. «Descendência» funciona coletivamente, enquanto as respostas seguintes explicitam pessoas no plural.
