translation:
  language: pt
  text: A soberba é odiosa ao Senhor e aos homens[a], e contra ambos a opressão é uma transgressão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da segunda oração é condensado e diz literalmente algo como: “e de ambos, transgressão de opressão”. O grego traz uma construção diferente, que pode ser entendida como: “A soberba é odiosa diante do Senhor e dos homens e, por ambos, ela cometerá injustiças”.'
    reason: Registra a dificuldade sintática do hebraico e a leitura alternativa preservada pelo antigo paralelo grego.
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: é odiosa
  rationale: Expressa que a soberba é objeto de aversão; a formulação é natural e mantém a força avaliativa do hebraico.
- source_word: לְאָדוֹן
  choice: ao Senhor
  rationale: Embora אֲדוֹן também possa designar um senhor humano, o contexto sapiencial e o paralelo grego Κυρίου favorecem a referência a Deus.
- source_word: וַאֲנָשִׁים
  choice: e aos homens
  rationale: Conserva o plural masculino representativo do hebraico, com sentido geral referente aos seres humanos.
- source_word: גַּאֲוָה
  choice: A soberba
  rationale: No contexto moral, “soberba” comunica mais precisamente a arrogância condenada do que o mais ambivalente “orgulho” em português moderno.
- source_word: וּמִשְּׁנֵיהֶם
  choice: e contra ambos
  rationale: O hebraico diz literalmente “e de ambos”, construção comprimida e difícil. Pelo paralelismo, “contra ambos” apresenta a opressão como ofensa em relação às duas partes mencionadas, sem fazer de Deus uma fonte da transgressão.
- source_word: מַעַל
  choice: uma transgressão
  rationale: מַעַל denota ato de infidelidade, violação ou falta grave; “transgressão” preserva sua força moral sem exigir aqui uma nuance estritamente pactual.
- source_word: עֹשֶׁק
  choice: a opressão
  rationale: Mantém diretamente o sentido de opressão, exploração ou abuso presente no substantivo hebraico.
theological_decisions:
- issue: Referente de אֲדוֹן
  choice: o Senhor, isto é, Deus
  alternative: um senhor humano
  rationale: O contexto e o paralelo grego com Κυρίου apoiam a referência divina.
- issue: Relação expressa por וּמִשְּׁנֵיהֶם na segunda oração
  choice: a opressão é uma transgressão contra o Senhor e contra os homens
  alternative: “de ambos procede a transgressão opressiva”
  rationale: A alternativa reproduz mais literalmente a preposição מן, mas pode sugerir em português que Deus e os homens originam a transgressão. A tradução escolhida segue a relação ética indicada pelo paralelismo e registra a dificuldade textual em nota.
- issue: Alcance de אֲנָשִׁים
  choice: homens em sentido representativo
  alternative: pessoas / seres humanos
  rationale: A tradução mantém a forma masculina do texto hebraico sem limitar o princípio moral apenas ao sexo masculino.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Soberba” foi preferido a “orgulho” para deixar claro o sentido moral negativo. A construção da segunda oração busca clareza sem ocultar sua dificuldade textual, explicitada na nota.
