  text: Among brothers their chief is honored[a], and one who fears God among his people.
translation:
  language: pt
  text: Entre irmãos, o chefe deles é honrado, e quem teme a Deus é honrado em meio ao seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Rico, honrado e pobre — a razão de orgulho deles é o temor do Senhor.” Os testemunhos hebraico e grego diferem substancialmente neste versículo; o texto principal segue o hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: Entre irmãos
  rationale: בֵּין indica aqui a posição dentro de um grupo; “entre” é natural em português. אַחִים é masculino plural e foi mantido literalmente como “irmãos”.
- source_word: רֹאשָׁם
  choice: seu chefe
  rationale: רֹאשׁ significa literalmente “cabeça”, mas, em contexto social, designa o chefe ou líder de um grupo. “Seu chefe” comunica esse sentido sem estranheza.
- source_word: נִכְבָּד
  choice: é honrado
  rationale: A forma verbal de כבד expressa ser honrado ou estimado; “é honrado” preserva a voz passiva e o sentido social.
- source_word: וִירֵא אֱלֹהִים
  choice: e quem teme a Deus
  rationale: A expressão singular descreve uma pessoa por sua atitude diante de Deus. “Quem teme a Deus” é idiomático e preserva o singular proverbial.
- source_word: בְּעַמּוֹ
  choice: entre o seu povo
  rationale: A preposição בְּ tem aqui sentido social ou locativo. “Entre o seu povo” mantém o paralelismo com “entre irmãos” e conserva o pronome singular do hebraico.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: 'Seguir no texto principal o hebraico preservado: “Entre irmãos, seu chefe é honrado; e quem teme a Deus, entre o seu povo.”'
  alternative: 'Grego: “Rico, honrado e pobre — o orgulho deles é o temor do Senhor.”'
  rationale: Como há texto hebraico preservado com alta confiança, ele serve de base para a tradução. O paralelo grego apresenta uma leitura muito diferente e teologicamente relevante, por isso é registrado em nota sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A pontuação torna perceptível o paralelismo hebraico sem completar ou harmonizar a segunda oração. O marcador [a] aparece no texto principal.
