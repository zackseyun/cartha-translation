base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/026.yaml
  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: pt
  text: Não se faça de sábio para servir ao seu próprio desejo[a], nem busque honra para si no tempo da sua necessidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz uma leitura muito diferente: “Melhor é aquele que trabalha em tudo do que aquele que anda se vangloriando e não tem pão.” O hebraico preservado nos manuscritos da Guenizá do Cairo adverte contra a esperteza voltada ao interesse próprio e contra a busca de honra em tempo de necessidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: Não se faça de sábio
  rationale: O hitpael de חכם sugere apresentar-se ou agir como sábio, aqui com sentido crítico de esperteza afetada ou voltada ao próprio interesse. A formulação é natural em português e evita transformar a advertência em condenação da sabedoria genuína.
- source_word: לַעֲבוֹד
  choice: para servir
  rationale: O infinitivo de עבד pode significar servir ou trabalhar. “Servir” conserva a imagem incisiva do desejo pessoal como senhor ao qual alguém se submete.
- source_word: חֶפְצֶךָ
  choice: ao seu próprio desejo
  rationale: חפץ pode indicar desejo, prazer ou vontade. “Seu próprio desejo” comunica o caráter autocentrado da advertência sem restringi-la apenas ao prazer sensual.
- source_word: וְאַל תִּתְכַּבֵּד
  choice: nem busque honra para si
  rationale: 'O hitpael de כבד tem força reflexiva: conferir peso ou honra a si mesmo, fazer-se importante. Em português, “busque honra para si” expressa com naturalidade a autopromoção implícita.'
- source_word: בְּמוֹעֵד
  choice: no tempo da
  rationale: מוֹעֵד denota tempo determinado, ocasião ou período. “No tempo da” mantém a referência circunstancial de modo claro e digno.
- source_word: צָרְכֶּךָ
  choice: sua necessidade
  rationale: A palavra aponta para necessidade, carência ou falta. O paralelo grego, que menciona falta de pão, favorece a dimensão concreta de carência, sem exigir que ela seja explicitada no texto hebraico.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o testemunho grego
  choice: Traduzir o texto hebraico preservado e registrar em nota a leitura grega muito diferente.
  alternative: “Melhor é aquele que trabalha em tudo do que aquele que anda se vangloriando e não tem pão.”
  rationale: Como o hebraico sobrevive neste ponto, ele rege o texto principal. O grego não deve ser harmonizado silenciosamente com ele; sua divergência substancial é preservada para o leitor em nota. O grego apenas reforça que a frase final pode envolver carência material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se faça de sábio” preserva a censura à sabedoria afetada sem sugerir que a verdadeira sabedoria seja indesejável; “busque honra para si” soa mais natural do que uma reprodução rígida do reflexivo hebraico.
