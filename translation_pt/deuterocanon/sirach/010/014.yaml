  source_fidelity: A tradução segue o testemunho hebraico ao manter «Deus» e a sequência difícil de «encher o coração» seguida de dois verbos de ferir. Contudo, «até o fim» fica menos claro em português do que o sentido consumativo de עַד כַּלֵּה; «até destruí-lo» comunica esse desfecho sem recorrer à leitura grega plural.
  naturalness: «Deus encheu-lhe o coração» é deliberadamente áspero, mas compreensível à luz da nota. A ordem «lhe encheu o coração» é mais natural no português moderno e preserva a mesma lacuna textual. «Até destruí-lo» é mais idiomático e preciso que «até o fim» neste contexto.
  terminology: «Deus» corresponde a אֱלֹהִים; a variante grega «o Senhor» permanece corretamente assinalada. «Ferir» mantém o campo semântico punitivo dos verbos hebraicos sem impor explicação doutrinária.
