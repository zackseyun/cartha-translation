  text: Therefore God filled his heart and struck him[b][a], and struck him down completely.
translation:
  language: pt
  text: Por isso, Deus lhe encheu o coração e o feriu[b][a]; feriu-o até destruí-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil; literalmente, algo como: “Por isso, Deus lhe encheu o coração, feriu; e feriu-o até destruí-lo”. O grego traz: “Por isso, o Senhor tornou extraordinários os castigos e os destruiu por completo”.'
    reason: textual_variant
  - marker: b
    text: O grego traz “o Senhor”, onde o testemunho hebraico traz “Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Conector inferencial natural, que apresenta a consequência do orgulho descrito no contexto.
- source_word: מִלֵּא לִבּוֹ
  choice: encheu-lhe o coração
  rationale: Mantém de modo transparente a expressão hebraica difícil e sua imagem do coração, sem acrescentar um complemento ausente no texto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Segue o testemunho hebraico primário; a leitura grega 'o Senhor' é registrada em nota.
- source_word: נָגַע
  choice: o feriu
  rationale: Em contexto punitivo, o verbo pode indicar ferir ou afligir, não apenas tocar; o pronome explicita em português o referente masculino sugerido pela leitura recebida.
- source_word: וַיַּכֵּהוּ
  choice: feriu-o
  rationale: Expressa diretamente o golpe divino do verbo נכה, preservando a repetição enfática do hebraico.
- source_word: עַד כַּלֵּה
  choice: até o fim
  rationale: Tradução concisa que preserva a formulação hebraica e comunica a consumação total do castigo, sem especificar além do texto.
theological_decisions:
- issue: Título divino divergente entre os testemunhos hebraico e grego
  choice: Deus
  alternative: o Senhor
  rationale: O texto principal prioriza o hebraico preservado, enquanto a variante grega é indicada em nota, sem harmonização.
- issue: Cláusula hebraica textualmente difícil
  choice: Preservar a sequência 'Deus encheu-lhe o coração e o feriu'
  alternative: O Senhor tornou extraordinários os castigos e os destruiu por completo
  rationale: A tradução mantém a dificuldade e a tensão do testemunho hebraico em vez de fornecer um complemento conjectural; a leitura substancialmente diferente do grego é apresentada integralmente em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção pouco usual 'encheu-lhe o coração' é mantida deliberadamente por refletir a dificuldade real do hebraico; as notas evitam que essa opacidade seja ocultada.
