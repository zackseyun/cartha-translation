base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/020.yaml
  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: pt
  text: Que tipo de descendência é desprezível? A descendência de quem transgride um mandamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “os que transgridem mandamentos” (no plural), esclarecendo a difícil formulação hebraica.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: descendência
  rationale: Neste provérbio, o termo não indica semente literal, mas prole ou linhagem. “Descendência” preserva o sentido coletivo e é natural em português.
- source_word: נִקְלֶה
  choice: desprezível
  rationale: O adjetivo descreve aquilo que é tido por vil, de pouca estima ou sem honra; “desprezível” mantém a força avaliativa e corresponde ao grego ἄτιμον.
- source_word: מַה
  choice: que tipo de
  rationale: A expressão introduz uma pergunta retórica de classificação. “Que tipo de” comunica esse valor idiomático com clareza.
- source_word: לֶאֱנוֹשׁ
  choice: de quem
  rationale: A formulação hebraica transmitida é difícil. “De quem” representa de modo idiomático a referência humana, sem reproduzir uma construção portuguesa obscura.
- source_word: עוֹבֵר
  choice: transgride
  rationale: Com מִצְוָה, o particípio designa quem viola um preceito. “Transgride” preserva o registro moral e legal da literatura sapiencial.
- source_word: מִצְוָה
  choice: um mandamento
  rationale: Mantém-se o singular do testemunho hebraico. “Mandamento” é adequado ao contexto sapiencial e à linguagem da Torá.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro
  choice: Traduzir prioritariamente o hebraico preservando o singular “um mandamento”, com auxílio do grego para esclarecer a sintaxe difícil.
  alternative: “os que transgridem mandamentos”, seguindo mais diretamente o grego.
  rationale: O texto hebraico está preservado, embora sua formulação seja difícil; por isso, ele rege o texto principal. A variante grega é registrada em nota, sem apagar a divergência textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pergunta retórica e a tensão entre os testemunhos hebraico e grego foram preservadas.
