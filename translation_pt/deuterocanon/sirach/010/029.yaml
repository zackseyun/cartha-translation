base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/029.yaml
  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: pt
  text: Quem declarará justo aquele que condena a si mesmo?[a] E quem honrará aquele que desonra a si mesmo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha grega diz: «O pobre é honrado por seu conhecimento, e o rico é honrado por sua riqueza.» O hebraico e o grego preservam aqui ditos substancialmente diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: condena
  rationale: O hifil de רשע tem sentido forense de declarar culpado ou condenar. Com נַפְשׁוֹ, a formulação reflexiva «condena a si mesmo» preserva essa coloração judicial.
- source_word: נַפְשׁוֹ
  choice: a si mesmo
  rationale: נפש pode significar alma, vida ou a própria pessoa. Nos dois membros, o valor reflexivo é natural em português e evita espiritualizar indevidamente o termo como «sua alma».
- source_word: יַצְדִיקֶנּוּ
  choice: declarará justo
  rationale: 'O hifil de צדק é forense: declarar alguém justo ou inocente. «Declarará justo» explicita esse sentido sem introduzir de modo desnecessário a carga doutrinária que «justificará» pode assumir.'
- source_word: יְכַבֵּד
  choice: honrará
  rationale: O piel de כבד significa normalmente honrar. A escolha mantém a avaliação social do segundo membro.
- source_word: מַקְלֶה
  choice: desonra
  rationale: A forma derivada de קלל comunica tratar com pouco caso, aviltar ou desonrar. «Desonra» produz em português a antítese clara com «honrará».
theological_decisions:
- issue: Divergência substancial entre as testemunhas hebraica e grega
  choice: Traduzir no texto principal o hebraico preservado e registrar em nota o dito inteiramente diferente da testemunha grega.
  alternative: 'Grego: «O pobre é honrado por seu conhecimento, e o rico é honrado por sua riqueza.»'
  rationale: Como existe texto hebraico de alta confiança, ele serve de base. A tradição grega não deve ser harmonizada com ele, pois preserva conteúdo substancialmente diferente; a nota mantém transparente essa diversidade textual.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo retórico preservado. A repetição de «a si mesmo» é intencional e reproduz a estrutura dos dois membros hebraicos; a nota documenta sem harmonização a importante divergência textual.
