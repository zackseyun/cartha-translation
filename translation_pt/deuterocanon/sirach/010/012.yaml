  text: The beginning of a man's pride is defiance[a], and his heart turns away from his Maker.
translation:
  language: pt
  text: O princípio do orgulho de uma pessoa é a insolência[a], e seu coração se afasta de seu Criador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “O princípio do orgulho de uma pessoa é afastar-se do Senhor, e seu coração se afastou daquele que a fez.” O hebraico é mais breve na primeira oração e foi seguido no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: O princípio de
  rationale: Reproduz diretamente a ideia de começo e mantém a forma concisa e proverbial do hebraico.
- source_word: גְּאוֹן
  choice: orgulho
  rationale: Neste contexto sapiencial, indica autoexaltação humana em sentido moral negativo; “orgulho” é claro e natural em português.
- source_word: אָדָם
  choice: uma pessoa
  rationale: O singular hebraico é genérico. “Uma pessoa” conserva o valor representativo sem restringir a afirmação aos homens.
- source_word: מוּעָז
  choice: insolência
  rationale: Expressa a atitude audaciosa, presunçosa e desafiadora indicada pelo hebraico, sem acrescentar um objeto que o texto hebraico não explicita.
- source_word: וּמֵעֹשֶׂהוּ
  choice: de seu Criador
  rationale: O hebraico diz literalmente “daquele que o fez”. “Criador” é idiomático e reverente, e o contexto identifica Deus como referente.
- source_word: יָסוּר לִבּוֹ
  choice: seu coração se afasta
  rationale: Conserva a imagem hebraica do coração que se desvia ou se distancia, em linguagem portuguesa corrente.
theological_decisions:
- issue: Se o objeto da insolência deve ser explicitado como o Senhor, seguindo o paralelo grego
  choice: Manter no texto principal a formulação mais breve do hebraico, “é a insolência”, deixando a segunda oração explicitar o afastamento de Deus.
  alternative: O princípio do orgulho de uma pessoa é afastar-se do Senhor, e seu coração se afasta de seu Criador.
  rationale: O testemunho hebraico é a fonte principal e não nomeia explicitamente o Senhor na primeira oração. O paralelo grego esclarece a direção teológica, mas incorporá-la ao texto principal apagaria a concisão e a ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação proverbial foi preservada; “uma pessoa” comunica o sentido humano genérico de אָדָם, e “Criador” leva inicial maiúscula por se referir a Deus.
