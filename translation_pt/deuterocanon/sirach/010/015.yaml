translation:
  language: pt
  text: Deus derrubou o trono dos orgulhosos e colocou os humildes no lugar deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: o trono dos orgulhosos
  rationale: O hebraico traz כִּסֵּא no singular, seguido de גֵאִים, “orgulhosos”; por isso, mantém-se “trono” no singular, embora o paralelo grego apresente o plural “tronos” e especifique “governantes”.
- source_word: הָפַךְ
  choice: derrubou
  rationale: No contexto de um trono e da inversão de poder, “derrubou” comunica naturalmente a ideia de virar, subverter ou depor.
- source_word: וַיֹּשֶׁב
  choice: colocou
  rationale: A forma causativa indica que Deus fez os humildes ocupar a posição; “colocou” é claro e idiomático em português.
- source_word: תַּחְתָּם
  choice: no lugar deles
  rationale: 'Embora a expressão possa significar literalmente “debaixo deles”, neste contexto denota substituição: os humildes passam a ocupar o lugar dos orgulhosos.'
theological_decisions:
- issue: A inversão divina entre orgulhosos e humildes
  choice: Preservar Deus como agente direto tanto da queda dos orgulhosos quanto da elevação dos humildes.
  alternative: Atenuar a agência divina com uma formulação impessoal ou meramente proverbial.
  rationale: A sintaxe hebraica nomeia אֱלֹהִים como sujeito explícito e apresenta as duas ações como obra de Deus.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A tradução segue prioritariamente o hebraico e conserva o singular “trono”, em vez de harmonizá-lo com o plural do paralelo grego e da camada inglesa.
