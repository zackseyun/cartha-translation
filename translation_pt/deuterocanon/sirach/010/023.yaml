  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
translation:
  language: pt
  text: Não se deve desprezar o pobre que tem discernimento[a], nem honrar o injusto que foi elevado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz aqui uma leitura muito diferente: “O homem importante, o juiz e o governante serão honrados, mas nenhum deles é maior do que aquele que teme o Senhor.” O testemunho hebraico seguido no texto principal apresenta, em vez disso, uma máxima ética: não desprezar o pobre que tem discernimento nem honrar o injusto que foi elevado.'
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: Não se deve desprezar
  rationale: A construção אֵין + infinitivo exprime aqui uma proibição ou impropriedade em forma proverbial; esta formulação preserva o tom sentencioso.
- source_word: דַּל
  choice: o pobre
  rationale: דַּל designa alguém pobre, fraco ou de posição social baixa. O singular substantivado é natural em português e conserva o caráter genérico da máxima.
- source_word: מַשְׂכִּיל
  choice: que tem discernimento
  rationale: O particípio aponta para entendimento, prudência ou capacidade de agir com percepção. A locução é clara e evita reduzir o sentido à mera inteligência intelectual.
- source_word: לְכַבֵּד
  choice: honrar
  rationale: No piel, כבד significa dar honra ou importância; “honrar” mantém de modo direto o contraste social da máxima.
- source_word: עַוָּל
  choice: o injusto
  rationale: עַוָּל caracteriza quem pratica injustiça. “O injusto” é conciso, proverbial e não amplia indevidamente a categoria moral.
- source_word: אֲשֶׁר הוּרָם
  choice: que foi elevado
  rationale: O perfeito passivo indica alguém alçado a uma posição superior. A tradução conserva tanto a voz passiva quanto a provável nuance de elevação social.
theological_decisions:
- issue: Texto hebraico da Geniza versus tradição grega substancialmente divergente
  choice: Traduzir no texto principal a máxima hebraica preservada e registrar em nota a leitura grega.
  alternative: “O homem importante, o juiz e o governante serão honrados, mas nenhum deles é maior do que aquele que teme o Senhor.”
  rationale: O testemunho hebraico disponível é de alta confiança e tem prioridade para esta passagem de Sirácida. Como a tradição grega não representa apenas uma diferença menor, mas outra formulação do versículo, sua leitura é preservada explicitamente na nota sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial. “Que tem discernimento” comunica prudência e compreensão de maneira natural; “foi elevado” preserva a ambiguidade sobre quem ou o que concedeu a posição.
