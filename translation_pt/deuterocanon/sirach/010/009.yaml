  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
translation:
  language: pt
  text: Por que se ensoberbece quem é pó e cinza, embora, durante a vida, seu corpo seja erguido?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula final do hebraico é difícil. O texto grego traz: “Pois, ainda em vida, lancei fora as suas entranhas”, ressaltando a corrupção e a mortalidade do corpo humano. O hebraico talvez também aponte para a humilhação ou a condição perecível do corpo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יִּגְאֶה
  choice: Por que se ensoberbece
  rationale: A pergunta retórica censura a arrogância. “Ensoberbecer-se” expressa naturalmente em português a elevação orgulhosa indicada por גאה.
- source_word: עָפָר וָאֵפֶר
  choice: quem é pó e cinza
  rationale: A expressão conserva a imagem bíblica da fragilidade e mortalidade humanas. A inserção de “quem é” torna natural a personificação e mantém a concordância singular do hebraico.
- source_word: בְּחַיָּיו
  choice: durante a vida
  rationale: Equivalente português claro e idiomático para a expressão temporal “em sua vida/enquanto vive”.
- source_word: יוּרַם
  choice: seja erguido
  rationale: Mantém o sentido passivo de רום, “ser levantado/erguido”, sem definir por que ou de que maneira o corpo é erguido.
- source_word: גִּוְיוֹ
  choice: seu corpo
  rationale: O substantivo pode designar corpo ou cadáver. “Corpo” é a opção menos interpretativa, enquanto a nota registra a possível conotação de corrupção corporal.
theological_decisions:
- issue: Sentido da cláusula final difícil no testemunho hebraico
  choice: Traduzir o hebraico preservando a ideia de que o corpo é erguido durante a vida e marcar a dificuldade em nota.
  alternative: 'Seguir o grego: “pois, ainda em vida, lancei fora as suas entranhas”.'
  rationale: O hebraico extante é a testemunha principal, mas sua cláusula final é obscura e diverge consideravelmente do grego. A tradução evita harmonizar ou emendar silenciosamente o texto, e a nota apresenta a leitura grega como testemunho da fragilidade e corrupção humanas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem é pó e cinza” evita uma concordância artificial com a expressão personificada, sem perder sua força poética. A formulação mantém deliberadamente a tensão e a obscuridade da cláusula hebraica final.
