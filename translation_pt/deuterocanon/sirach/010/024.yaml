base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/024.yaml
  text: A ruler[a], a governor, and a judge are honored, but none is greater than one who fears God.
translation:
  language: pt
  text: Um líder[a], um governante e um juiz são honrados, mas ninguém é maior do que aquele que teme a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz aqui uma leitura substancialmente diferente: “Homens livres servirão a um escravo sábio, e o homem entendido não se queixará.”'
    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  choice: líder
  rationale: Expressa alguém colocado em posição de autoridade e evita a conotação dinástica que “príncipe” poderia sugerir; também permite distinguir o termo seguinte.
- source_word: מוֹשֶׁל
  choice: governante
  rationale: Representa quem exerce governo ou domínio e preserva, em português natural, a diferenciação na lista de três autoridades.
- source_word: שׁוֹפֵט
  choice: juiz
  rationale: É o equivalente corrente e preciso para a função judicial indicada pelo hebraico.
- source_word: נִכְבָּדוּ
  choice: são honrados
  rationale: Preserva o valor passivo plural de receber honra ou consideração social.
- source_word: וְאֵין גָּדוֹל
  choice: mas ninguém é maior
  rationale: A conjunção tem força contrastiva no contexto, e a formulação comunica naturalmente a comparação superlativa.
- source_word: מִיְּרֵא אֱלֹהִים
  choice: do que aquele que teme a Deus
  rationale: Mantém a expressão bíblica tradicional “temer a Deus”, que denota temor reverente e fidelidade, preservando o singular representativo.
theological_decisions:
- issue: Uso do hebraico diante da leitura grega divergente
  choice: Traduzir no texto principal o hebraico preservado e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Homens livres servirão a um escravo sábio, e o homem entendido não se queixará.”'
  rationale: O hebraico existente é a fonte primária para esta passagem. Como o grego contém uma sentença substancialmente diferente, a variante deve ser apresentada com transparência, sem substituir nem harmonizar o texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Líder”, “governante” e “juiz” preservam a lista tríplice sem arcaísmo; “teme a Deus” mantém o idioma bíblico e sua tensão teológica.
