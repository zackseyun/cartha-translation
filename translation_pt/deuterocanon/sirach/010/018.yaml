base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/018.yaml
  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: pt
  text: A arrogância e a insolência não convêm ao ser humano[a], muito menos àquele que nasceu de mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “A arrogância não foi criada para os seres humanos, nem a ira furiosa para os nascidos de mulheres”. O testemunho hebraico traz, em vez disso, “a arrogância e a insolência não convêm [...] muito menos àquele que nasceu de mulher”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: não convêm
  rationale: Expressa aquilo que não é apropriado ou digno, seguindo o sentido avaliativo do hebraico sem importar a formulação grega “não foi criada”.
- source_word: לֶאֱנוֹשׁ
  choice: ao ser humano
  rationale: אֱנוֹשׁ designa o ser humano mortal. A expressão é natural em português, inclusiva e mantém a ênfase na condição humana.
- source_word: זָדוֹן
  choice: arrogância
  rationale: Transmite a exaltação presunçosa de si mesmo indicada pelo termo, sem se confundir com a insolência exterior do vocábulo seguinte.
- source_word: וְעַזוּת
  choice: e a insolência
  rationale: Representa a audácia descarada e moralmente negativa do hebraico, preservando a distinção em relação a “arrogância”.
- source_word: אַף
  choice: muito menos
  rationale: Comunica a força intensificadora e climática da partícula no contexto, ressaltando a impropriedade dessas atitudes na frágil condição humana.
- source_word: לִילוּד אִשָּׁה
  choice: àquele que nasceu de mulher
  rationale: Preserva a imagem hebraica do nascimento de mulher, que salienta a mortalidade e a fragilidade comuns a toda pessoa, em linguagem portuguesa clara.
theological_decisions:
- issue: Relação entre o texto hebraico e o paralelo grego
  choice: Seguir no texto principal o hebraico, com “não convêm” e “insolência”, registrando o paralelo grego em nota.
  alternative: “A arrogância não foi criada para os seres humanos, nem a ira furiosa para os nascidos de mulheres.”
  rationale: O testemunho hebraico está preservado e tem alta confiabilidade. O grego apresenta diferenças relevantes tanto no predicado quanto no segundo vício; por isso, não deve substituir silenciosamente o hebraico, mas merece registro como leitura paralela significativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não convêm” conserva um tom sapiencial sem soar arcaico; “àquele que nasceu de mulher” mantém a imagem tradicional e a ênfase na fragilidade humana.
