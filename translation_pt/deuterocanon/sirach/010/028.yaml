base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/028.yaml
  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: pt
  text: Quem justificará aquele que peca contra a própria alma[a]? E quem honrará aquele que desonra a própria vida?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Genizá do Cairo difere muito do grego e é difícil. Aproximadamente: “Meu filho, com humildade honra a ti mesmo, e ele te dará discernimento e honra perdida.” O texto principal segue aqui o grego, pois o testemunho hebraico parece textualmente instável neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα
  choice: aquele que peca
  rationale: O particípio presente grego tem sentido geral; a formulação preserva sua força verbal e soa natural em português.
- source_word: εἰς τὴν ψυχὴν αὐτοῦ
  choice: contra a própria alma
  rationale: ψυχή pode significar alma, pessoa ou vida. “Alma” mantém a distinção lexical em relação a ζωή na segunda pergunta, e “contra” expressa a direção prejudicial da ação.
- source_word: τίς δικαιώσει
  choice: Quem justificará
  rationale: δικαιόω pergunta quem poderá declarar tal pessoa justa ou reconhecer que ela tem razão; “justificará” conserva a dimensão moral e forense sem explicar além do texto.
- source_word: δοξάσει
  choice: honrará
  rationale: Neste contexto sapiencial, “honrar” expressa adequadamente a estima social e forma uma antítese clara com “desonra”.
- source_word: τὸν ἀτιμάζοντα
  choice: aquele que desonra
  rationale: ἀτιμάζω significa tratar sem honra ou com desprezo; “desonra” preserva diretamente o contraste verbal da oração.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: a própria vida
  rationale: ζωή significa naturalmente “vida”; “própria” torna explícita a referência reflexiva e mantém a distinção em relação a ψυχή.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal o sentido coerente do grego
  alternative: “Meu filho, honra a ti mesmo com humildade...” — tradução aproximada do hebraico preservado, cuja cláusula final é obscura.
  rationale: O hebraico da Genizá diverge radicalmente do grego e sua cláusula final, tal como preservada, parece textualmente instável. O grego oferece um dístico coerente. A opção pelo grego é explicitada em nota, sem ocultar nem harmonizar a variante hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “justificará”, “alma” e “vida” para preservar o paralelismo, a tensão moral e a distinção lexical do grego. O marcador [a] aparece no texto principal.
