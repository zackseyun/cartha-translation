base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/004.yaml
  text: In the hand of God is the rule of every man, and before the lawgiver he sets his splendor.
translation:
  language: pt
  text: Na mão de Deus está o domínio de cada homem, e diante do legislador ele põe o seu esplendor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Na mão do Senhor está a autoridade da terra, e, no tempo certo, ele levantará sobre ela aquele que for adequado.” O grego apresenta uma segunda linha substancialmente diferente, provavelmente refletindo outro texto-base hebraico ou um desenvolvimento interpretativo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a sua majestade” ou “a sua honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: Na mão de
  rationale: Preserva a metáfora hebraica de controle ou poder e soa natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Traduz diretamente o substantivo hebraico, sem substituí-lo por “Senhor”.
- source_word: מֶמְשֶׁלֶת
  choice: o domínio
  rationale: Expressa poder de governo ou autoridade, preservando o alcance político do termo.
- source_word: כָּל גֶּבֶר
  choice: cada homem
  rationale: Mantém o valor masculino de גֶּבֶר e a referência distributiva do hebraico, sem neutralizá-la.
- source_word: וְלִפְנֵי
  choice: e diante de
  rationale: Reproduz de forma clara a relação espacial ou relacional indicada pela preposição.
- source_word: מְחוֹקֵק
  choice: o legislador
  rationale: Preserva a ideia de alguém que decreta ou estabelece leis; “legislador” é atual e inteligível.
- source_word: יָשִׁית
  choice: ele põe
  rationale: Traduz o sentido básico de colocar ou pôr sem acrescentar a ideia não explícita de conceder.
- source_word: הוֹדוֹ
  choice: o seu esplendor
  rationale: Mantém o sentido elevado de majestade, honra ou esplendor e conserva a ambiguidade do sufixo possessivo.
theological_decisions:
- issue: Relação entre a soberania divina e a autoridade política humana
  choice: O governo de cada homem está sob o domínio de Deus, sem explicar o mecanismo pelo qual Deus estabelece governantes.
  alternative: Deus nomeia diretamente cada governante, ou exerce autoridade especificamente sobre a terra e levanta nela a pessoa adequada, conforme o paralelo grego.
  rationale: O hebraico afirma o controle divino sobre o governo humano, mas não formula uma doutrina detalhada de nomeação. A leitura grega mais específica não deve ser harmonizada com o testemunho hebraico primário.
- issue: Referente dos pronomes em “ele põe o seu esplendor”
  choice: Conservar a formulação pronominal ambígua do hebraico.
  alternative: Explicitar que Deus põe o esplendor do legislador, ou que Deus põe o próprio esplendor diante do legislador.
  rationale: Os referentes de יָשִׁית e הוֹדוֹ não são plenamente inequívocos isoladamente; explicitar um referente resolveria uma tensão que o texto hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as metáforas do hebraico foram preservadas quando naturais; a ambiguidade pronominal da segunda linha não foi resolvida artificialmente.
