  source_fidelity: O hebraico preservado diz literalmente que o domínio do mundo está na mão de Deus e que «um homem», no tempo oportuno, «se levantará/ficará de pé» sobre ele. O rascunho introduz Deus como sujeito explícito de «levantará» e transforma o verbo em transitivo; isso vai além da forma hebraica, cujo verbo está no qal e cujo sujeito é «um homem».
  naturalness: «Nas mãos de Deus» é compreensível, mas «na mão de Deus» preserva melhor o singular hebraico e é uma expressão plenamente natural em português. «Um homem se levantará sobre ele» mantém a construção concisa e solene sem a inversão pouco natural de «levantará sobre o mundo o homem adequado».
  terminology: «Domínio» traduz adequadamente מֶמְשֶׁלֶת, e «mundo» traduz bem תֵּבֵל. «Homem» conserva o masculino singular de אִישׁ; «adequado» é uma qualificação interpretativa não expressa no hebraico e deve ser retirado. A nota deve continuar assinalando a divergência substancial do grego.
