base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/005.yaml
  text: In the hand of God is the rule of the world[a], and in due time he will raise up over it the right man.
translation:
  language: pt
  text: Na mão de Deus está o domínio do mundo[a], e, no tempo certo, um homem se levantará sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: «Na mão do Senhor está o êxito de um homem, e ele porá a sua glória sobre o rosto do escriba.» A tradição grega difere substancialmente do hebraico preservado neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: Nas mãos de Deus
  rationale: A expressão hebraica indica poder ou controle. A formulação preserva a metáfora da mão e soa natural em português; o plural idiomático evita a construção pouco fluente «na mão de Deus».
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: o domínio do mundo
  rationale: מֶמְשֶׁלֶת designa poder governante ou domínio, e תֵּבֵל, o mundo habitado. «Domínio do mundo» conserva o sentido político e a formulação nominal do hebraico.
- source_word: וְאִישׁ
  choice: o homem adequado
  rationale: אִישׁ é masculino singular e, no contexto, designa o indivíduo apto para governar. «Adequado» explicita com moderação essa pertinência contextual sem neutralizar o gênero do referente.
- source_word: לְעֵת
  choice: no tempo certo
  rationale: A expressão aponta para o momento apropriado. «No tempo certo» é atual, claro e mantém a ideia de ocasião oportuna.
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: ele levantará sobre o mundo
  rationale: O verbo expressa fazer alguém ficar de pé ou estabelecê-lo sobre algo. «Levantará sobre» preserva a imagem hebraica de instituir uma pessoa em posição de autoridade. A repetição de «o mundo» esclarece o referente feminino de עָלֶיהָ, que em português não poderia ser retomado naturalmente por «ele».
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Seguir no texto principal o hebraico preservado, que atribui a Deus o domínio do mundo e o estabelecimento de um homem sobre ele.
  alternative: 'Seguir o grego: «Nas mãos do Senhor está o sucesso de um homem, e sobre o rosto do escriba ele colocará a sua glória.»'
  rationale: O testemunho hebraico está preservado e tem alta confiança, devendo ser a base primária. A forma grega representa uma tradição textual marcadamente diferente e, por isso, é registrada integralmente em nota.
- issue: Referência masculina de אִישׁ
  choice: o homem adequado
  alternative: a pessoa adequada
  rationale: O hebraico emprega um substantivo masculino singular e provavelmente se refere a um governante individual. A tradução conserva essa especificidade sem acrescentar identidade ou cargo não expressos no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a metáfora da mão, a linguagem de domínio e a referência masculina singular, ao mesmo tempo que evita uma retomada pronominal ambígua de «mundo».
