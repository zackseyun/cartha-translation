  - severity: medium
    issue: «O homem adequado» acrescenta uma avaliação ausente do hebraico.
    rationale: אִישׁ significa «um homem». Embora o contexto possa sugerir um governante apropriado, o qualificativo «adequado» não está expresso e reduz a sobriedade da formulação hebraica.
  - severity: low
    issue: «Nas mãos de Deus» pluraliza a metáfora hebraica.
    rationale: בְּיַד está no singular. «Na mão de Deus» é idiomático em português e mais próximo do texto-fonte.
