  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: pt
  text: Há um pobre que é honrado por causa de seu discernimento[a], e há quem seja honrado por causa de sua riqueza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Mas aquele que é honrado na pobreza, quanto mais na riqueza? E aquele que não tem honra na riqueza, quanto mais na pobreza?” O hebraico e o grego diferem substancialmente neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: pobre
  rationale: O termo designa alguém pobre, necessitado ou de condição fraca. O substantivo adjetival singular «um pobre» preserva a forma representativa do hebraico e soa natural em português.
- source_word: נִכְבָּד
  choice: é honrado
  rationale: O nifal de כבד indica alguém que recebe honra ou é tido em consideração. «É honrado» mantém a nuance social nas duas ocorrências sem intensificá-la indevidamente.
- source_word: בִּגְלַל
  choice: por causa de
  rationale: A preposição indica causa ou fundamento. «Por causa de» expressa de modo claro e corrente a relação causal em ambas as orações.
- source_word: שִׂכְלוֹ
  choice: seu discernimento
  rationale: שכל pode indicar entendimento, prudência, bom senso ou capacidade de avaliar. «Discernimento» comunica essa percepção judiciosa sem ampliar o sentido para toda a noção de sabedoria.
- source_word: עָשְׁרוֹ
  choice: sua riqueza
  rationale: O substantivo se refere a riqueza ou bens materiais. «Riqueza» é o equivalente português direto e conserva o contraste social com «pobre».
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Há ... e há ...
  rationale: A construção existencial apresenta dois casos em paralelo. A repetição de «há» conserva o equilíbrio aforístico, com «quem» na segunda oração para evitar uma formulação pesada.
theological_decisions:
- issue: Uso do testemunho hebraico apesar da divergência substancial do paralelo grego
  choice: 'Seguir no texto principal o hebraico preservado, que contrasta duas pessoas honradas: uma por seu discernimento e outra por sua riqueza.'
  alternative: O grego traz perguntas retóricas sobre quem é honrado na pobreza e quem carece de honra na riqueza, perguntando quanto mais isso se aplicaria na condição oposta.
  rationale: O testemunho hebraico extante é a fonte principal, mas a divergência do grego é grande demais para ser ocultada. A leitura grega é, portanto, registrada em nota como forma textual alternativa, sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. «Discernimento» preserva a amplitude sapiencial de שכל; a estrutura paralela e concisa mantém o caráter proverbial do hebraico.
