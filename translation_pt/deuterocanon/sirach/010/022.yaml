base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/022.yaml
  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: pt
  text: O estrangeiro residente, o forasteiro, o estrangeiro e o pobre — a glória deles é o temor de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não é justo desonrar um pobre inteligente, nem convém glorificar um homem pecador.” O hebraico e o grego diferem substancialmente neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Expressa a condição de um não nativo estabelecido entre o povo, preservando a dimensão social de גֵּר melhor do que o termo mais amplo “estrangeiro”.
- source_word: וְזָר
  choice: o forasteiro
  rationale: זָר designa alguém de fora do círculo social, familiar ou cultual; “forasteiro” o distingue de נָכְרִי sem impor uma condição jurídica específica.
- source_word: נָכְרִי
  choice: o estrangeiro
  rationale: נָכְרִי costuma indicar uma pessoa pertencente a outro povo; “estrangeiro” é o equivalente moderno mais claro.
- source_word: וָרָשׁ
  choice: e o pobre
  rationale: רָשׁ designa uma pessoa pobre ou necessitada. O singular substantivado é natural em português e preserva a estrutura da enumeração.
- source_word: תִּפְאֶרֶת
  choice: a glória deles
  rationale: O substantivo pode indicar glória, esplendor ou adorno; aqui, “glória” comunica aquilo que confere verdadeira dignidade às pessoas enumeradas.
- source_word: יִרְאַת אֱלֹהִים
  choice: o temor de Deus
  rationale: Mantém a expressão sapiencial tradicional, que abrange temor reverente, respeito e devoção, sem reduzir sua força semântica.
theological_decisions:
- issue: Uso do testemunho hebraico apesar da divergência substancial do paralelo grego
  choice: Traduzir o hebraico preservado no texto principal e registrar a leitura grega em nota.
  alternative: 'Grego: “Não é justo desonrar um pobre inteligente, nem convém glorificar um homem pecador.”'
  rationale: O hebraico é a fonte primária quando preservado, mas a diferença do grego altera substancialmente o sentido e, por isso, deve ser apresentada com transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “estrangeiro” em “estrangeiro residente” e “estrangeiro” é intencional, pois preserva a distinção entre גֵּר e נָכְרִי; “forasteiro” representa זָר como uma terceira categoria.
