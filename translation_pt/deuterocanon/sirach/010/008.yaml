  text: Kingship passes from nation to nation because of violence and arrogance[a].
translation:
  language: pt
  text: O poder real passa de uma nação para outra por causa da violência e da arrogância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega diz: “O poder real é transferido de uma nação para outra por causa da injustiça, dos ultrajes e do dinheiro”.'
    reason: variante textual
lexical_decisions:
- source_word: מַלְכוּת
  choice: realeza
  rationale: Neste contexto, o termo designa o poder ou domínio régio, não apenas um território. “Realeza” conserva o sentido abstrato e é natural em português.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de uma nação para outra
  rationale: Expressa claramente a transferência do domínio entre povos politicamente organizados, com fluidez proverbial em português.
- source_word: תִּסֹּב
  choice: passa
  rationale: Embora o verbo tenha o sentido básico de girar ou mudar de direção, aqui descreve a mudança do poder régio de uma nação para outra.
- source_word: בִּגְלַל
  choice: por causa de
  rationale: Indica causa de modo direto e natural no português atual.
- source_word: חֲמַס
  choice: violência
  rationale: O hebraico denota violência ou grave injustiça praticada; “violência” representa diretamente o texto hebraico, que é a testemunha principal.
- source_word: גַּאֲוָה
  choice: arrogância
  rationale: Comunica claramente a soberba ou altivez moralmente censurada e forma um par natural com “violência”.
theological_decisions:
- issue: Diferença entre as causas enumeradas no hebraico e no grego
  choice: 'Seguir no texto principal a lista hebraica: “violência e arrogância”.'
  alternative: 'A tradição grega diz: “por causa da injustiça, dos ultrajes e do dinheiro”.'
  rationale: O hebraico preservado é de alta confiança e, por isso, rege o texto principal. A lista grega é significativamente diferente e deve ser registrada em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Realeza” preserva o caráter abstrato do domínio régio; a construção mantém a concisão proverbial do hebraico.
