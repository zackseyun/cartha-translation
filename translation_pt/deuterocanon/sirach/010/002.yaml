base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/002.yaml
  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: pt
  text: Um rei sem freio arruína uma cidade, mas uma cidade é habitada graças à prudência de seus governantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma formulação paralela: “Como é o governante da cidade, assim são todos os que nela habitam”.'
    reason: Registra a diferença relevante do testemunho grego sem deslocar a leitura hebraica do texto principal.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: rei
  rationale: É o sentido comum do termo hebraico e indica o governante político singular.
- source_word: פָּרוּעַ
  choice: sem freio
  rationale: Expressa falta de contenção ou disciplina em linguagem natural, sem especificar indevidamente ilegalidade ou criminalidade.
- source_word: יַשְׁחִית
  choice: arruína
  rationale: O verbo שחת indica causar destruição ou ruína; no contexto de governo, «arruína» preserva o efeito sociopolítico sem sugerir necessariamente destruição total.
- source_word: עִיר
  choice: cidade
  rationale: Equivalente direto, abrangendo tanto o espaço urbano quanto a comunidade cívica.
- source_word: נוֹשֶׁבֶת
  choice: é habitada
  rationale: Preserva o sentido passivo de uma cidade ocupada ou povoada, sem converter a afirmação em mera prosperidade.
- source_word: בְּשֶׂכֶל
  choice: graças à prudência
  rationale: שכל denota discernimento, bom senso ou prudência; a construção com ב indica aqui o meio ou fator pelo qual a cidade permanece habitada.
- source_word: שָׂרֶיהָ
  choice: seus governantes
  rationale: O plural שריה designa os líderes ou autoridades da cidade; «governantes» é claro e mantém o plural hebraico.
theological_decisions:
- issue: Relação entre os dois membros do provérbio e o paralelo grego
  choice: Traduzir diretamente os dois membros hebraicos, mantendo o contraste entre a ruína causada pelo rei sem freio e a cidade habitada graças à prudência de seus governantes.
  alternative: 'Seguir a formulação grega: «Como é o governante da cidade, assim são todos os seus habitantes».'
  rationale: O testemunho hebraico conservado é primário. O grego confirma o tema da influência da liderança sobre a comunidade, mas apresenta uma formulação diferente e não deve substituir o texto hebraico.
translation_notes:
  register: Português moderno, digno e acessível. «Sem freio» comunica de modo idiomático a falta de contenção moral e política; «é habitada graças à prudência» conserva a imagem hebraica, embora ela seja menos habitual em português.
