  text: For the hope of arrogance is sin[a], and its source pours out wickedness.
translation:
  language: pt
  text: Pois a esperança da arrogância é o pecado[a], e sua fonte jorra perversidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Pois o princípio do orgulho é o pecado, e quem se apega a ele fará jorrar abominação.” O grego apresenta uma primeira oração notavelmente diferente e altera a segunda.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  choice: esperança
  rationale: Segue o sentido hebraico comum de algo em que se espera ou confia. O grego traz ἀρχή, “princípio”, provavelmente refletindo outra leitura ou uma interpretação; essa variante é preservada em nota.
- source_word: זָדוֹן
  choice: arrogância
  rationale: Expressa a atitude orgulhosa, insolente e presunçosa indicada pelo hebraico, em linguagem atual e clara.
- source_word: חֵטְא
  choice: pecado
  rationale: Correspondência direta ao substantivo hebraico, também confirmado pelo grego ἁμαρτία.
- source_word: מְקוֹרָהּ
  choice: sua fonte
  rationale: Preserva a metáfora de uma nascente e entende o sufixo feminino como referência à arrogância personificada.
- source_word: יַבִּיעַ
  choice: faz jorrar
  rationale: Comunica o movimento de algo que brota ou flui de uma fonte, mantendo viva a imagem hídrica do hebraico.
- source_word: זִמָּה
  choice: perversidade
  rationale: Abrange intenção maligna, depravação e conduta perversa sem restringir indevidamente o termo à imoralidade sexual.
theological_decisions:
- issue: Hebraico מִקְוֵה em contraste com o grego ἀρχή no início do versículo
  choice: 'Seguir no texto principal o hebraico: “a esperança da arrogância é o pecado”.'
  alternative: “o princípio do orgulho é o pecado”
  rationale: Como o hebraico está preservado neste versículo, ele recebe prioridade. A tradição grega difere de modo interpretativamente relevante e, por isso, é registrada em nota, sem substituir o testemunho hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faz jorrar” preserva a metáfora da fonte; “perversidade” mantém a amplitude moral de זִמָּה.
