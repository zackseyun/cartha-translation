  text: Better is one who works and has abundant wealth than one who honors himself and lacks food[a].
translation:
  language: pt
  text: Mais vale quem trabalha e possui muitos bens do que quem se dá importância e não tem o que comer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego diz: “Meu filho, glorifique a sua alma com mansidão e dê-lhe honra segundo o seu valor.” O hebraico e o grego diferem substancialmente neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Mais vale
  rationale: A abertura tem valor comparativo numa máxima de sabedoria; “mais vale” é natural em português e introduz claramente a comparação.
- source_word: עוֹבֵד
  choice: quem trabalha
  rationale: O particípio de עבד indica aqui a pessoa que trabalha. O contraste com a autoimportância e a carência favorece esse sentido, sem sugerir indevidamente condição servil.
- source_word: וְיוֹתֵר הוֹן
  choice: e possui muitos bens
  rationale: A expressão hebraica é concisa e um tanto difícil. הוֹן indica riqueza ou recursos, e יוֹתֵר sugere abundância; “possui muitos bens” comunica a suficiência material sem excessiva rigidez literal.
- source_word: מִמִּתְכַּבֵּד
  choice: do que quem se dá importância
  rationale: A forma reflexiva favorece a ideia de atribuir honra ou importância a si mesmo. A formulação portuguesa expressa pretensão ou autoexaltação de modo atual e natural.
- source_word: וַחֲסַר מַתָּן
  choice: e não tem o que comer
  rationale: חסר indica falta, e מַתָּן, neste contexto econômico, é entendido como provisão ou sustento. A expressão idiomática comunica a carência de alimento sem apagar o contraste com a posse de bens.
theological_decisions:
- issue: Grande divergência entre os testemunhos hebraico e grego de Sirácida 10:27
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Grego: “Meu filho, glorifique a sua alma com mansidão e dê-lhe honra segundo o seu valor.”'
  rationale: Como o texto de Sirácida sobrevive em hebraico neste ponto, ele serve de fonte principal. Contudo, a versão grega apresenta uma leitura substancialmente distinta, não uma simples variação de estilo; por isso, sua forma é preservada com transparência em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Mais vale” mantém o tom proverbial; “se dá importância” torna natural a ideia reflexiva de autoexaltação. A nota registra integralmente a divergência textual relevante.
