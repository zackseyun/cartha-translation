  text: For any offense[a], do not repay your neighbor with evil, and do not walk in the way of pride.
translation:
  language: pt
  text: Por nenhuma ofensa[a], não retribua o mal ao seu próximo, nem ande no caminho do orgulho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Por toda injustiça, não fique irado com o seu próximo”, enfatizando a ira ou o ressentimento, em vez da retaliação.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: Por nenhuma ofensa
  rationale: A expressão significa literalmente “por/em toda ofensa”; sob a proibição, a formulação portuguesa com “nenhuma” comunica naturalmente que ofensa alguma justifica a retaliação.
- source_word: אַל תְּשַׁלֵּם רַע
  choice: não retribua o mal
  rationale: O piel de שׁלם tem o sentido de retribuir ou pagar de volta. “Retribuir o mal” preserva com clareza a ideia de retaliação.
- source_word: לְרֵע
  choice: ao seu próximo
  rationale: רֵעַ designa o próximo, companheiro ou semelhante. “Seu próximo” é corrente no registro bíblico português e corresponde também ao grego τῷ πλησίον.
- source_word: וְאַל תִּהֲלַךְ
  choice: e não ande
  rationale: Mantém a metáfora sapiencial de andar como modo de viver ou agir, sem perder a naturalidade.
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: no caminho do orgulho
  rationale: Preserva a imagem hebraica de um caminho como conduta de vida. “Orgulho” expressa גַּאֲוָה, que também pode assumir os matizes de arrogância ou altivez.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na primeira proibição
  choice: Seguir no texto principal o hebraico, que proíbe retribuir o mal.
  alternative: “Não fique irado/ressentido com o seu próximo por nenhuma injustiça”, conforme o grego.
  rationale: O testemunho hebraico está preservado e tem alta confiança, por isso rege o texto principal. O grego apresenta uma nuance relacionada, mas distinta, centrada na ira ou no ressentimento, que deve ser registrada sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência sapiencial. A metáfora “andar no caminho” foi mantida por ser inteligível e literariamente apropriada. O ponto e vírgula separa as duas proibições coordenadas.
