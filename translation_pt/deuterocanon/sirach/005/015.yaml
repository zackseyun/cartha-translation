translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Escutar” ressalta a atenção implícita no hebraico; “dê uma resposta” evita uma reprodução rígida de “devolva uma palavra”, preservando-a em nota.
