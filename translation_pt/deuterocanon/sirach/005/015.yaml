  text: Be quick to listen[c][b][a], and with patience give a reply.
translation:
  language: pt
  text: Seja rápido para escutar[a] e, com paciência[b], dê uma resposta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico indica escutar com atenção.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com longura de espírito”, expressão que indica paciência ou temperamento contido. A frase também pode ser traduzida: “com paciência, devolva uma palavra”.'
    reason: alternative_reading
  - marker: c
    text: O texto grego deste versículo difere substancialmente do hebraico preservado e parece refletir outra forma textual. A tradução segue o testemunho hebraico existente.
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: Seja pronto
  rationale: A construção imperativa com particípio expressa prontidão e presteza. “Seja pronto” conserva a força exortativa em português natural.
- source_word: לְהַאֲזִין
  choice: para escutar
  rationale: O verbo indica ouvir com atenção, não apenas perceber um som. “Escutar” comunica esse sentido ativo e atento.
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: com paciência
  rationale: A expressão hebraica significa literalmente “com longura de espírito” e descreve paciência ou domínio do temperamento. A formulação escolhida transmite o sentido idiomático sem obscurecê-lo.
- source_word: הָשֵׁב פִּתְגָּם
  choice: dê uma resposta
  rationale: O verbo significa devolver ou fazer retornar, e o substantivo pode designar palavra, declaração ou resposta. No paralelismo com escutar, a expressão se refere naturalmente à resposta dada depois de ouvir.
