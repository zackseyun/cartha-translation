  text: Be firm in your understanding[a], and let your word be one.
translation:
  language: pt
  text: Seja firme em seu entendimento, e que sua palavra seja uma só.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego, que diverge da redação hebraica, diz: “Não sejas chamado de intrigante ... uma severa condenação pesa sobre quem fala com duplicidade”. Isso pode esclarecer a possível advertência contra a fala dividida ou enganosa em “que sua palavra seja uma só”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה
  choice: Seja
  rationale: O imperativo de היה introduz uma exortação direta; “Seja” é natural e preserva o caráter sentencioso do hebraico.
- source_word: סָמוּךְ
  choice: firme
  rationale: O termo derivado de סמך comunica a ideia de estar sustentado, estabelecido ou seguro. “Firme” expressa estabilidade interior sem tornar a frase excessivamente literal.
- source_word: עַל דַּעְתֶּךָ
  choice: em seu entendimento
  rationale: דעת pode indicar conhecimento, entendimento ou discernimento. Neste contexto sapiencial, “entendimento” comunica uma compreensão refletida, e a preposição “em” produz uma construção idiomática em português.
- source_word: וְאֶחָד
  choice: uma só
  rationale: O hebraico diz literalmente “um”. Como דְבָרֶךָ é tratado em português pelo feminino “palavra”, “uma só” preserva a imagem de unidade e sugere coerência, em contraste com a duplicidade.
- source_word: יְהִי
  choice: que ... seja
  rationale: O jussivo de היה tem força exortativa. A construção “que ... seja” reproduz essa nuance de modo natural em português.
- source_word: דְבָרֶךָ
  choice: sua palavra
  rationale: דבר pode significar palavra, fala ou assunto. “Sua palavra” preserva o singular e permite manter a expressão compacta “uma só”, referindo-se à coerência do que a pessoa diz.
theological_decisions:
- issue: Relação entre a linha hebraica e o paralelo grego, que apresenta uma forma bastante diferente do versículo e enfatiza a murmuração e a fala dúplice
  choice: Traduzir diretamente o hebraico preservado como exortação à firmeza de entendimento e à unidade da palavra, registrando em nota a forma divergente do grego.
  alternative: 'Seguir o grego: “Não sejas chamado murmurador ... a condenação recai sobre quem tem língua dupla.”'
  rationale: Como há testemunho hebraico para este trecho de Sirácida, ele recebe prioridade. O grego pode refletir uma Vorlage divergente ou uma ampliação interpretativa; sua advertência contra a língua dupla, porém, esclarece uma possível dimensão ética de “que sua palavra seja uma só” sem justificar a substituição do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A formulação conserva a concisão e o paralelismo da máxima hebraica, sem explicitar no corpo do texto uma duplicidade que o hebraico apenas sugere.
