  text: Do not rely on your wealth[a], and do not say, “I have the power.”
translation:
  language: pt
  text: 'Não se apoie em sua riqueza e não diga: “Tenho poder.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil e diz literalmente algo como “há poder para a minha mão”, isto é, “tenho capacidade”. O paralelo grego traz o sentido “isso me basta” ou “sou autossuficiente”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Não se apoie
  rationale: O verbo שׁען significa literalmente “apoiar-se” e, em sentido figurado, confiar ou depender; a formulação portuguesa conserva a metáfora e é natural.
- source_word: חֵילֶךָ
  choice: sua riqueza
  rationale: חַיִל pode significar força, capacidade, recursos ou riqueza. O paralelo grego χρήμασίν (“bens, dinheiro”) favorece claramente o sentido econômico neste contexto.
- source_word: יֵשׁ לְאֵל יָדִי
  choice: Tenho poder para tudo
  rationale: A expressão hebraica é comprimida e literalmente associa poder à mão, idioma de capacidade. Esta formulação preserva a alegação de capacidade própria sem introduzir explicitamente a ideia grega de autossuficiência.
theological_decisions:
- issue: Interpretação da difícil segunda oração hebraica à luz do paralelo grego
  choice: 'A advertência condena a alegação abrangente de capacidade própria: “Tenho poder para tudo.”'
  alternative: “Meu próprio poder me basta” ou “Sou autossuficiente”
  rationale: O hebraico sobrevivente permanece primário e destaca o poder da própria mão; o grego confirma que se trata de autossuficiência. A tradução mantém a imagem conceitual hebraica, enquanto a nota registra a leitura do paralelo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não se apoie” conserva a metáfora hebraica; “riqueza” segue o sentido econômico confirmado pelo grego. A nota preserva a incerteza textual e semântica da segunda oração.
