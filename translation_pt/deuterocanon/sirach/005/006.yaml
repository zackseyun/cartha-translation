- source_word: עֲוֹנוֹתַי
  choice: minhas iniquidades
  rationale: Mantém o sentido de culpas ou atos perversos e a formulação religiosa reconhecível em português.
- source_word: יהוה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o Tetragrama.
