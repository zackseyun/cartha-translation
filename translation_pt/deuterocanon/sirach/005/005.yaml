base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: pt
  text: 'Não diga: “Pequei[a], e o que me acontecerá?[b] Nada”, pois Deus é paciente.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma leitura diferente: “Quanto à expiação, não fique sem temor, acrescentando pecado a pecados”. O hebraico adverte contra pensar que o pecado não terá consequência porque Deus é paciente; ambas as formas condenam a presunção diante da misericórdia divina.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e o que me será feito?” A forma hebraica é passiva e pode se referir à consequência futura do pecado.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “pois Deus é lento para a ira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz diretamente a proibição expressa pelo imperativo negativo hebraico, em português natural e digno.
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O perfeito hebraico apresenta o pecado como ato consumado; o pretérito perfeito simples é a forma idiomática correspondente em português.
- source_word: וְמַה יֵעָשֶׂה לִי
  choice: e o que me acontecerá?
  rationale: A forma passiva e não concluída pode apontar para o que será feito ao falante ou para a consequência que lhe sobrevirá. A formulação escolhida é natural em português e mantém a orientação futura, sem especificar indevidamente o agente.
- source_word: מְאוּמָה
  choice: Nada
  rationale: O termo funciona como resposta elíptica à pergunta retórica, expressando a alegada ausência total de consequência.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão usada pelo pecador para justificar sua falsa segurança.
- source_word: אֵל
  choice: Deus
  rationale: É a tradução portuguesa comum e adequada da designação divina neste contexto sapiencial.
- source_word: אֶרֶךְ אַפַּיִם
  choice: é paciente
  rationale: O idioma hebraico significa literalmente ser lento para a ira. “É paciente” comunica com clareza a demora da reação divina que o falante presume poder explorar, enquanto a forma mais literal é preservada em nota.
- source_word: הוּא
  choice: é
  rationale: O pronome hebraico é naturalmente incorporado à oração copulativa portuguesa, cujo sujeito explícito já é “Deus”.
theological_decisions:
- issue: A paciência divina e a presunção de impunidade
  choice: Deus é paciente
  alternative: Deus é lento para a ira
  rationale: A tradução comunica a longanimidade divina sem sugerir que o pecado ficará definitivamente sem julgamento. A advertência conserva a tensão entre misericórdia e responsabilidade, e a expressão hebraica mais literal aparece em nota.
- issue: Diferença entre o testemunho hebraico e o paralelo grego
  choice: Traduzir o texto hebraico e registrar o grego em nota
  alternative: 'Seguir o grego: “Quanto à expiação, não fique sem temor, acrescentando pecado a pecados”'
  rationale: O testemunho hebraico fornecido tem alta confiança e deve governar o texto principal. A leitura grega é suficientemente distinta para ser preservada, sem fundir artificialmente as duas formas textuais.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala presunçosa foi mantida breve e incisiva; evitou-se linguagem arcaica e preservaram-se em notas tanto a ambiguidade do verbo hebraico quanto a leitura divergente do grego.
