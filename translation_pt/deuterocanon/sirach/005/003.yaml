base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/003.yaml
  text: Do not go after your heart and your eyes[b][a], to walk in evil desires.
translation:
  language: pt
  text: Não siga o seu coração e os seus olhos[a], entregando-se a desejos maus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não vá atrás do seu coração e dos seus olhos”. A expressão concreta “coração e olhos” reúne o desejo interior e aquilo que atrai exteriormente.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego difere substancialmente: “E não diga: ‘Quem me dominará?’, pois o Senhor certamente se vingará de você.” Aqui se segue o testemunho hebraico como texto principal, mantendo o grego como tradição paralela divergente.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: Não siga
  rationale: A construção com הלך e אַחֲרֵי significa literalmente “ir/andar atrás de” e, neste contexto, expressa de modo natural a ideia de seguir ou deixar-se guiar.
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: o seu coração e os seus olhos
  rationale: 'Mantém a imagem concreta hebraica: o coração representa o desejo ou impulso interior, e os olhos, aquilo que atrai exteriormente.'
- source_word: לָלֶכֶת
  choice: andando
  rationale: O gerúndio preserva a repetição do verbo הלך e liga naturalmente, em português, a proibição inicial ao modo de vida resultante.
- source_word: בַּחֲמוּדוֹת
  choice: em desejos
  rationale: O substantivo derivado de חמד pode indicar coisas desejáveis, cobiçadas ou desejos. O contexto de seguir o coração e os olhos favorece “desejos”, sem restringir indevidamente o sentido a impulsos sexuais.
- source_word: רָעָה
  choice: maus
  rationale: O termo qualifica moralmente os desejos. A concordância idiomática em português exige o plural “maus” com “desejos”.
theological_decisions:
- issue: Imagem antropológica de “coração e olhos”
  choice: Conservar a imagem concreta no texto principal
  alternative: Não siga os seus próprios desejos; não se deixe levar por suas paixões
  rationale: A formulação hebraica distingue o impulso interior da atração exterior. Preservá-la mantém a tensão e as ressonâncias bíblicas sem reduzir a advertência a uma paráfrase abstrata.
- issue: Sentido de חֲמוּדוֹת רָעָה
  choice: maus desejos
  alternative: prazeres maus; coisas más cobiçadas; desejos perversos
  rationale: A expressão hebraica é condensada e admite mais de uma nuance. “Maus desejos” comunica o sentido moral provável sem acrescentar uma especificidade ausente do texto.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Seguir o testemunho hebraico como texto principal e registrar o grego em nota
  alternative: Adotar no texto principal a leitura grega sobre ninguém poder dominar o falante e sobre a vingança do Senhor
  rationale: O testemunho hebraico fornecido tem alta confiança e é a fonte primária desta tradução. Como o grego apresenta conteúdo substancialmente diferente, a divergência deve permanecer visível, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não siga” é mais natural que o literal “não ande atrás”, enquanto “coração e olhos” preserva a imagem hebraica. “Andando em maus desejos” retém deliberadamente o segundo emprego de הלך e a formulação moral condensada do original.
