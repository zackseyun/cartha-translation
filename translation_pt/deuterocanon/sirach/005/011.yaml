  text: For suddenly his wrath will come forth[a], and at the time of vengeance you will be swept away.
translation:
  language: pt
  text: Pois, de repente, a ira dele irromperá[a], e, no tempo da vingança, você será varrido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego deste versículo traz uma redação muito diferente: “Seja rápido para ouvir e, com paciência, dê uma resposta.” O texto principal segue aqui o testemunho hebraico preservado, cuja redação diverge substancialmente da tradição grega.'
    reason: textual_variant
lexical_decisions:
- source_word: פִתאוֹם
  choice: de repente
  rationale: Expressão corrente e direta para o valor adverbial de algo súbito ou inesperado.
- source_word: יֵצֵא
  choice: irromperá
  rationale: Preserva a imagem da ira que sai ou se manifesta repentinamente, com naturalidade em português.
- source_word: זַעְמוֹ
  choice: a ira dele
  rationale: Mantém a intensidade de זעם e conserva o pronome do hebraico, sem explicitar no texto principal que o referente implícito é Deus.
- source_word: וּבְעֵת
  choice: e, no tempo da
  rationale: Reproduz a construção temporal do hebraico de modo claro e relativamente formal.
- source_word: נָקָם
  choice: vingança
  rationale: Conserva a força retributiva de נקם, sem generalizá-la como mera punição.
- source_word: תִּסָּפֶה
  choice: você será arrastado para a destruição
  rationale: Comunica o sentido passivo de ser eliminado ou levado à ruína e procura preservar a imagem vívida sugerida pelo verbo, sem especificar um modo concreto de morte.
theological_decisions:
- issue: Referente implícito do sufixo em זַעְמוֹ, “a ira dele”
  choice: Manter “dele”, entendendo Deus ou o Senhor como referente provável no contexto.
  alternative: Explicitar “a ira de Deus” ou entender o pronome como referência a uma autoridade não especificada.
  rationale: O contexto favorece a referência divina, mas o versículo hebraico não repete o nome de Deus. A manutenção do pronome preserva essa forma implícita e evita tornar explícito o que o texto deixa subentendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ira” e “vingança” preservam a gravidade sapiencial; “você” torna a advertência direta e natural. O marcador [a] está ligado ao ponto em que se torna evidente a divergência textual.
