base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/012.yaml
  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
translation:
  language: pt
  text: Não confie em riquezas enganosas[b], pois elas não serão úteis no dia da ira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega paralela traz aqui um texto diferente: “Se você tem entendimento, responda ao seu próximo; se não, ponha a mão sobre a boca.” Esta tradução segue como principal o testemunho hebraico preservado.'
    reason: textual_variant
  - marker: b
    text: Ou “riquezas falsas”, “bens fraudulentos” ou “riquezas de falsidade”. O hebraico pode se referir a riquezas ligadas ao engano, seja porque foram adquiridas desonestamente, seja porque se mostram pouco confiáveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: Não confie
  rationale: Expressa de forma direta e natural a proibição própria da instrução sapiencial, sem intensificá-la.
- source_word: עַל נִכְסֵי
  choice: em riquezas
  rationale: A preposição foi ajustada à regência idiomática de «confiar» em português; «riquezas» comunica naturalmente o sentido coletivo de bens e patrimônio.
- source_word: שֶׁקֶר
  choice: enganosas
  rationale: Mantém a ideia de falsidade ou engano sem decidir se as riquezas foram adquiridas por fraude ou se apenas se mostram pouco confiáveis.
- source_word: כִּי לֹא יוֹעִילוּ
  choice: pois elas não serão úteis
  rationale: Traduz o sentido de não trazer benefício ou auxílio. O pronome explicita de modo natural que o sujeito são as riquezas.
- source_word: בְּיוֹם עֶבְרָה
  choice: no dia da ira
  rationale: Preserva a formulação solene e a força moral ou judicial de עֶבְרָה, sem acrescentar quem exerce essa ira.
theological_decisions:
- issue: Se עֶבְרָה deve ser entendido como ira em sentido forte ou como simples raiva
  choice: ira
  alternative: raiva; furor; juízo
  rationale: «Ira» preserva a possível dimensão judicial da expressão sem transformar o termo em «juízo» nem identificar explicitamente a ira como divina.
- issue: Prioridade entre o testemunho hebraico e a leitura grega divergente
  choice: seguir o hebraico preservado
  alternative: 'traduzir a leitura grega: «Se você tem entendimento, responda ao seu próximo; se não, ponha a mão sobre a boca.»'
  rationale: O testemunho hebraico disponível é a fonte primária indicada para este versículo. A divergência substancial da tradição grega é registrada em nota, sem substituir o texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A cadência proverbial foi preservada, e as ambiguidades lexical e teológica foram mantidas nas notas.
