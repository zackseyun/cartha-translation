  text: Do not be a winnower to every wind[b][a], or walk on the path of the storm.
translation:
  language: pt
  text: Não seja como quem joeira a todo vento, nem siga pelo caminho da tempestade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do hebraico שִׁבֹּלֶת neste trecho é incerto. Pode significar “tempestade” ou “torrente”; em outros contextos, também pode designar uma “espiga”. Aqui, “tempestade” acompanha melhor a imagem de “todo vento”.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo é bem diferente: “Honra e desonra estão no falar, e a língua do ser humano é sua ruína.” A tradução principal segue o testemunho hebraico preservado, que é a fonte primária adotada aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: Não seja
  rationale: Reproduz de modo direto a proibição hebraica e mantém o tom de advertência sapiencial.
- source_word: זוֹרֶה
  choice: como quem joeira
  rationale: Conserva a metáfora agrícola concreta do particípio de זרה. A construção com “como quem” soa mais natural em português do que “um joeirador”, sem eliminar a imagem.
- source_word: לְכָל רוּחַ
  choice: a todo vento
  rationale: Mantém a imagem concisa do hebraico e sugere a instabilidade de quem se deixa levar por qualquer influência.
- source_word: וּפוֹנֶה
  choice: nem siga
  rationale: No encadeamento da proibição, “nem” comunica que a segunda oração também é negativa; “siga” expressa naturalmente em português a adoção de um caminho, embora o verbo hebraico possa ser entendido mais literalmente como “voltar-se”.
- source_word: דֶרֶך
  choice: pelo caminho da
  rationale: Preserva a metáfora de caminho e forma uma expressão idiomática com “siga”.
- source_word: שִׁבֹּלֶת
  choice: tempestade
  rationale: O termo é incerto neste contexto. “Tempestade” harmoniza-se com a imagem paralela do vento, enquanto “torrente” é uma alternativa lexical plausível; a incerteza é explicitada em nota.
