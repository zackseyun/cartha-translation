  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Joeira” preserva a imagem agrícola do hebraico; o contexto e a formulação “como quem” ajudam a tornar o termo acessível. As notas mantêm visíveis tanto a incerteza lexical quanto a divergência substancial do grego.
