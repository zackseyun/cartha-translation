  text: Do not say[a], “Who can withstand his power?” for Yahweh seeks the persecuted.
translation:
  language: pt
  text: 'Não diga[a]: “Quem poderá resistir ao seu poder?”, pois o SENHOR busca os perseguidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Não diga: ‘Pequei, e o que me aconteceu?’, pois o Senhor é paciente.” Isso provavelmente reflete um texto subjacente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Imperativo negativo direto e natural, introduzindo a fala citada.
- source_word: מִי יוּכַל כֹּחוֹ
  choice: Quem poderá resistir ao poder dele?
  rationale: O hebraico transmitido é conciso e um pouco difícil. A formulação preserva a pergunta retórica e entende יוכל em sentido adversativo implícito diante de כוח, sem ocultar a incerteza textual.
- source_word: כִּי
  choice: Pois
  rationale: Introduz de modo compacto a razão da proibição.
- source_word: יְהֹוָה
  choice: YHWH
  rationale: Representa de modo transparente o Tetragrama presente no texto hebraico, sem substituir o nome por um título.
- source_word: מְבַקֵּשׁ
  choice: busca
  rationale: Tradução direta de בקש; mantém aberta a nuance exata da ação divina.
- source_word: נִרְדָּפִים
  choice: os perseguidos
  rationale: O particípio passivo de רדף designa os que são perseguidos; a escolha conserva a imagem verbal do hebraico.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Seguir o hebraico preservado no texto principal e registrar a leitura grega em nota.
  alternative: '“Não diga: ‘Pequei, e o que me aconteceu?’, pois o Senhor é paciente.”'
  rationale: Há texto hebraico disponível e de alta confiança, embora sua redação seja difícil e não corresponda ao grego. A leitura grega provavelmente representa outro texto subjacente e é importante demais para ser omitida, mas não deve substituir silenciosamente o testemunho hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A pergunta retórica conserva a tensão do hebraico difícil; a nota informa sem tentar harmonizar a divergência textual.
