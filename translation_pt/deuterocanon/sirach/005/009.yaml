  text: For mercy and anger are with him[a], and his wrath comes to rest on the wicked.
translation:
  language: pt
  text: Pois com ele estão a misericórdia e a ira,[a] e sobre os ímpios repousará a sua indignação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz em seu lugar: “Não joeires a todo vento, nem andes por toda vereda; assim é o pecador de língua dupla.” Essa leitura difere substancialmente do hebraico preservado e provavelmente representa outra forma textual do versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação precedente e mantém a ligação discursiva com o contexto.
- source_word: רַחֲמִים
  choice: misericórdia
  rationale: O plural abstrato hebraico designa misericórdia compassiva; o singular abstrato é natural em português e forma um par equilibrado com «ira».
- source_word: אַף
  choice: ira
  rationale: Embora o sentido concreto seja «nariz», o uso idiomático hebraico denota ira. A escolha também permite distinguir este termo de רָגְזוֹ no segundo membro.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a preposição e exprime que a misericórdia e a ira estão com Deus, sem acrescentar ao texto hebraico um nome divino explícito.
- source_word: אֵל
  choice: sobre
  rationale: Marca o alvo sobre o qual a indignação repousa; «sobre» é idiomático em português neste contexto.
- source_word: רְשָעִים
  choice: os ímpios
  rationale: Representa de modo conciso o substantivo plural e preserva o registro sapiencial e religioso do texto.
- source_word: יָנוּחַ
  choice: repousará
  rationale: Preserva a imagem de descansar ou assentar e expressa adequadamente o valor não concluído/futuro da forma verbal.
- source_word: רָגְזוֹ
  choice: a sua indignação
  rationale: Comunica agitação irada com força judicial e diferencia o termo da «ira» do primeiro membro.
theological_decisions:
- issue: Referente dos sufixos pronominais («com ele», «sua indignação»)
  choice: Deus é o referente implícito, sem inserir «Deus» no corpo do versículo.
  alternative: Explicitar «com Deus» e «a indignação dele».
  rationale: O contexto identifica suficientemente o referente, mas a linha hebraica não contém um nome divino explícito. A tradução preserva essa forma e evita explicitação desnecessária.
- issue: Testemunho hebraico diante da tradição grega substancialmente diferente
  choice: Traduzir o hebraico preservado como texto principal e registrar o grego em nota.
  alternative: 'Adotar no texto principal a leitura grega: «Não joeires a cada vento...»'
  rationale: O hebraico sobrevivente tem prioridade como fonte original para esta passagem; a diferença grega, por afetar materialmente o sentido, deve permanecer visível como variante textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ímpios» e «indignação» conservam o tom sapiencial sem recorrer a linguagem excessivamente arcaica. O marcador [a] aparece no texto principal junto à afirmação afetada pela variante.
