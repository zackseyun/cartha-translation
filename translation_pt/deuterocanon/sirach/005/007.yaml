translation:
  language: pt
  text: Não conte com o perdão para acrescentar pecado a pecado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não demore a voltar para o Senhor e não adie isso de um dia para o outro, pois de repente virá a ira do Senhor, e no tempo do castigo você perecerá.” O texto hebraico preservado aqui é mais curto e se concentra especificamente em contar com o perdão enquanto se continua pecando.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: no perdão
  rationale: Com o verbo בָּטַח, a preposição marca aquilo em que se deposita confiança; em português, “confiar no perdão” expressa naturalmente o idioma hebraico.
- source_word: אַל תִּבְטָח
  choice: Não confie
  rationale: O verbo בטח indica confiar ou apoiar-se. “Não confie” mantém a forma direta da advertência e, no contexto, comunica a ideia de não presumir do perdão.
- source_word: סְלִיחָה
  choice: perdão
  rationale: O substantivo denota perdão ou remissão da culpa. “Perdão” é claro, atual e apropriado ao registro sapiencial.
- source_word: לְהוֹסִיף
  choice: para acrescentar
  rationale: O infinitivo pode indicar propósito ou resultado. “Para acrescentar” preserva essa ligação sem decidir além do necessário se a confiança no perdão é intenção deliberada ou ocasião para continuar pecando.
- source_word: עָוֹן עַל עָוֹן
  choice: pecado a pecado
  rationale: עָוֹן pode indicar pecado, iniquidade ou culpa. Aqui, a repetição com עַל retrata a acumulação de uma transgressão sobre outra; “acrescentar pecado a pecado” conserva a forma e é compreensível em português.
theological_decisions:
- issue: Relação entre o perdão divino e a continuação no pecado
  choice: A advertência condena apoiar-se presunçosamente no perdão como motivo ou ocasião para acumular pecados.
  alternative: Uma advertência geral contra o excesso de confiança quanto ao perdão.
  rationale: A sintaxe hebraica vincula diretamente confiar no perdão a acrescentar pecado a pecado. Isso adverte contra a presunção, sem negar a realidade ou a disponibilidade do perdão. O paralelo grego desenvolve o tema como adiamento do arrependimento diante do juízo iminente.
- issue: Relação textual entre o hebraico e o paralelo grego
  choice: Traduzir no corpo do versículo o texto hebraico mais curto e registrar em nota a forma grega mais extensa.
  alternative: Incorporar a advertência grega sobre não adiar a conversão e sobre o castigo ao texto principal.
  rationale: O testemunho hebraico fornecido tem alta confiança e constitui a fonte primária desta tradução. Como o grego apresenta conteúdo substancialmente mais longo, a nota preserva a variante sem criar um texto híbrido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa acompanha o paralelismo e a força proverbial do hebraico. O marcador [a] aparece no texto principal e corresponde à nota textual.
