  text: Do not rely on your own strength to walk after the desire of your soul[a][b].
translation:
  language: pt
  text: Não confie na sua própria força para seguir o desejo da sua alma[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme mais de perto o paralelo grego: “Não siga sua alma nem sua força, andando nos desejos do seu coração.” O hebraico diz: “Não confie na sua força para andar atrás do desejo da sua alma.”'
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “sua alma” também pode significar “você mesmo”, “sua vida” ou “seu próprio ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Não confie
  rationale: O verbo שׁען significa literalmente “apoiar-se” e, por extensão, “confiar”. “Não confie” comunica com naturalidade a advertência contra depender da própria capacidade.
- source_word: כֹּחֶךָ
  choice: na sua própria força
  rationale: כֹּחַ denota força ou poder. “Força” se ajusta ao contexto moral, e “própria” explicita em português a autoconfiança indicada pelo possessivo.
- source_word: לָלֶכֶת אַחַר
  choice: para seguir
  rationale: A expressão literal é “andar atrás de”. “Seguir” preserva o sentido de orientar a conduta por algo, com maior naturalidade no português atual.
- source_word: תַּאֲוַת
  choice: o desejo
  rationale: O substantivo hebraico está no singular e pode indicar desejo, anseio ou cobiça. “Desejo” mantém o sentido amplo sem impor uma conotação exclusivamente sexual.
- source_word: נַפְשֶׁךָ
  choice: da sua alma
  rationale: נֶפֶשׁ pode significar alma, pessoa, vida ou o próprio ser. “Alma” preserva a textura antropológica do hebraico e sua correspondência com ψυχή no paralelo grego; outras possibilidades são registradas em nota.
theological_decisions:
- issue: Sentido antropológico de נַפְשֶׁךָ / ψυχή
  choice: sua alma
  alternative: você mesmo; sua vida; seu próprio ser
  rationale: A formulação conserva o termo antropológico da fonte sem reduzir a advertência a mera ênfase reflexiva. Como “alma” pode ser entendida de maneira mais estreita em português do que נֶפֶשׁ em hebraico, a amplitude semântica é indicada em nota.
- issue: Diferença entre o texto hebraico e o paralelo grego
  choice: 'Seguir o hebraico: não confiar na própria força para seguir o desejo da alma'
  alternative: Não seguir a própria alma e força, andando nos desejos do coração
  rationale: A fonte hebraica tem alta confiança e oferece uma construção coerente. O grego parece refletir uma forma textual diferente e é preservado em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Seguir” traduz idiomaticamente “andar atrás de”; as notas preservam tanto a amplitude de נֶפֶשׁ quanto a diferença textual do paralelo grego.
