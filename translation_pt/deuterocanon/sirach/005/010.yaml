  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: pt
  text: Não demore a voltar para ele[b] e não adie isso de um dia para o outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixe isso para o dia seguinte”. O verbo hebraico da segunda oração é difícil, mas o contexto indica claramente adiamentos repetidos.'
    reason: lexical_alternative
  - marker: b
    text: “Voltar para ele” provavelmente significa voltar para Deus em arrependimento, embora o hebraico diga apenas “para ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּאַחֵר
  choice: Não demore
  rationale: Expressa de modo natural e direto a proibição hebraica de retardar ou postergar.
- source_word: לָשׁוּב
  choice: a voltar
  rationale: שׁוב significa “voltar” ou “retornar” e, no contexto, pode ter o sentido moral de voltar-se novamente para Deus, sem que isso precise ser explicitado no corpo do texto.
- source_word: אֵלָיו
  choice: para ele
  rationale: Preserva o pronome masculino do hebraico e não introduz um título divino ausente deste versículo.
- source_word: וְאַל תִּתְעַבֵּר
  choice: e não adie isso
  rationale: Embora a forma verbal seja difícil, o paralelismo com “não demore” indica claramente a ideia de adiamento; “isso” retoma naturalmente o ato de voltar.
- source_word: מִיּוֹם אֶל יוֹם
  choice: de um dia para o outro
  rationale: Reproduz com clareza a expressão hebraica que descreve adiamentos sucessivos.
theological_decisions:
- issue: Explicitar que o retorno é arrependimento e volta para Deus
  choice: Manter “voltar para ele”
  alternative: “voltar para Deus” ou “arrepender-se e voltar para ele”
  rationale: O contexto provavelmente aponta para Deus e para arrependimento, mas o hebraico deste versículo traz apenas o pronome “ele”. A tradução preserva essa implicitude.
- issue: Sentido do verbo difícil תִּתְעַבֵּר
  choice: Traduzir contextualmente como “não adie isso”
  alternative: “não deixe para depois” ou “não demore”
  rationale: O paralelismo e a expressão “de um dia para o outro” favorecem fortemente o sentido de postergar. O paralelo grego diverge do texto hebraico e não deve controlá-lo aqui.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “demorar a voltar” é idiomática, e “de um dia para o outro” comunica naturalmente a postergação reiterada sem apagar a dificuldade lexical registrada em nota.
