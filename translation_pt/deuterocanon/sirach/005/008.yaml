translation:
  language: pt
  text: 'E disseste: “As suas misericórdias são muitas; por causa da multidão das minhas iniquidades, ele perdoará.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não te apoies em riquezas injustas, pois de nada te servirão no dia da visitação.” O testemunho hebraico preservado traz aqui, em vez disso, uma advertência contra a presunção em relação à misericórdia de Deus.'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: E disseste
  rationale: Mantém o perfeito hebraico na segunda pessoa do singular e a ligação por וְ, sem converter silenciosamente a forma em imperativo ou presente.
- source_word: רַחֲמָיו רַבִּים
  choice: São muitas as suas misericórdias
  rationale: Preserva o plural hebraico רַחֲמָיו e o sentido quantitativo direto de רַבִּים, com ordem natural em português.
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: a multidão das minhas iniquidades
  rationale: Conserva a ideia quantitativa de רֹב e o plural moralmente carregado de עֲוֹנוֹתַי. A construção liga-se naturalmente a 'perdoará' em português.
- source_word: יִסְלָח
  choice: ele perdoará
  rationale: O futuro expressa a expectativa presunçosa do falante e traduz com clareza o valor prospectivo da forma hebraica.
theological_decisions:
- issue: O paralelo grego contém uma advertência substancialmente diferente, sobre riquezas injustas e o dia da visitação.
  choice: Traduzir no texto principal o testemunho hebraico preservado e registrar o grego em nota como variante textual.
  alternative: 'Adotar no texto principal o grego: “Não te apoies em riquezas injustas, pois de nada te servirão no dia da visitação.”'
  rationale: Como há testemunho hebraico de alta confiança, ele recebe primazia. A diferença grega é material e, por isso, não deve ser omitida nem harmonizada.
- issue: A afirmação sobre a misericórdia divina pode ser lida isoladamente como confiança legítima, embora o contexto a apresente como presunção.
  choice: Preservar a afirmação direta sem acrescentar qualificação interpretativa ao versículo.
  alternative: Acrescentar palavras como “presunçosamente” ou transformar a frase em “não digas”.
  rationale: Essas explicitações não estão no texto hebraico fornecido. A tensão entre a abundância da misericórdia e o abuso presunçoso dela deve permanecer dependente do contexto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa coerentes com o singular hebraico. “Iniquidades” conserva o peso moral do termo sem introduzir formulação denominacional. A inversão “São muitas as suas misericórdias” soa natural e mantém em destaque a abundância alegada pelo falante.
