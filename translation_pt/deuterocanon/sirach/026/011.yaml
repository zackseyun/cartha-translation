  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: pt
  text: Mantém uma vigilância firme, sem ceder, sobre uma filha, para que ela, ao encontrar liberdade para si, não faça uso dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz mais literalmente: «Sobre uma filha, estabelece firmemente uma guarda, sem ceder, para que ela, encontrando liberdade para si, não faça uso dela». O advérbio grego qualifica o modo de estabelecer a guarda, não a filha. A construção é concisa, e «dela» retoma a liberdade ou folga encontrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ θυγατρί
  choice: sobre uma filha
  rationale: Com o dativo, ἐπί indica aqui a pessoa que fica sob guarda ou supervisão; «sobre» conserva essa relação de modo natural em português.
- source_word: ἀδιατρέπτως
  choice: obstinada
  rationale: Embora seja formalmente um advérbio, o termo expressa a ideia de não se deixar desviar ou persuadir. No contexto, «obstinada» comunica com clareza a disposição atribuída à filha, sem chegar ao sentido mais forte de «incorrigível».
- source_word: στερέωσον φυλακήν
  choice: mantém vigilância rigorosa
  rationale: A expressão significa literalmente tornar firme ou reforçar uma guarda. A formulação verbal escolhida é corrente em português e preserva tanto a vigilância quanto sua intensidade.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Expressa naturalmente a oração grega de finalidade negativa.
- source_word: εὑροῦσα ἄνεσιν
  choice: encontre liberdade
  rationale: ἄνεσις pode significar alívio, folga ou liberdade de restrições. Neste contexto de vigilância, «liberdade» representa melhor a possibilidade de agir sem contenção.
- source_word: ἑαυτῇ
  choice: ela ... encontre
  rationale: O dativo reflexivo indica que ela obtém essa liberdade para si. Em português, explicitar «para si mesma» seria possível, mas pesado e em grande parte redundante neste contexto.
- source_word: χρήσηται
  choice: faça uso dela
  rationale: χράομαι significa usar ou servir-se de algo. «Dela» retoma de maneira explícita a liberdade mencionada anteriormente.
