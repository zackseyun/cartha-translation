translation:
  language: pt
  text: Uma lâmpada que resplandece sobre um candelabro sagrado, e a beleza de um rosto em idade madura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em uma maturidade estabelecida». A expressão grega ἐπὶ ἡλικίᾳ στασίμῃ combina a ideia de idade ou etapa da vida com a de firmeza, estabilidade ou maturidade consolidada.
    reason: Preserva a nuance de στασίμῃ sem substituir o sentido mais direto de ἡλικία, «idade» ou «maturidade», por uma referência principal ao porte físico.
lexical_decisions:
- source_word: λύχνος
  choice: lâmpada
  rationale: Designa uma lâmpada concreta, provavelmente a óleo, e não a luz em sentido abstrato.
- source_word: ἐκλάμπων
  choice: que resplandece
  rationale: Expressa a emissão viva e intensa de luz, preservando a força poética do particípio grego.
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: sobre um candelabro sagrado
  rationale: Mantém a relação espacial de ἐπί e a nuance de consagração de ἁγίας; “candelabro” é a designação corrente do suporte elevado para uma lâmpada.
- source_word: κάλλος προσώπου
  choice: a beleza de um rosto
  rationale: Conserva a imagem concreta e o paralelismo poético do grego em linguagem portuguesa natural.
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: em um porte firme
  rationale: No contexto de uma série de imagens sobre a aparência e a constituição física, ἡλικία pode indicar porte ou estatura, enquanto στασίμη sugere firmeza, estabilidade ou compostura. A formulação preserva essa imagem sem excluir a alternativa ligada à idade, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, digno e poético, com estrutura nominal paralela próxima do grego. “Sagrado” preserva a possível conotação cultual sem tornar a frase excessivamente arcaica; “porte firme” favorece o sentido corporal sugerido pelo contexto, enquanto a nota mantém a ambiguidade lexical.
