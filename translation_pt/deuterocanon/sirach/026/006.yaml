  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: pt
  text: A difamação numa cidade[a], a reunião de uma turba e uma acusação falsa — tudo isso é pior que a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego apresenta uma lista condensada, com genitivos elípticos: literalmente, “difamação de/numa cidade” e “reunião de uma multidão”. A tradução explicita o sentido provável em português corrente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολὴν
  choice: difamação
  rationale: O substantivo designa acusação maliciosa ou dano à reputação. “Difamação” é natural em português e ajuda a distingui-lo de καταψευσμόν, traduzido como “acusação falsa”.
- source_word: πόλεως
  choice: numa cidade
  rationale: O genitivo grego é conciso e elíptico. “Numa cidade” exprime de modo idiomático o provável âmbito social da difamação, sem afirmar que a cidade inteira seja o alvo.
- source_word: ἐκκλησίαν
  choice: reunião
  rationale: Neste contexto sapiencial, refere-se a um grupo reunido, sem exigir o sentido religioso posterior de “igreja” ou “congregação”.
- source_word: ὄχλου
  choice: de uma turba
  rationale: Embora possa significar simplesmente “multidão”, a associação com outros males sociais favorece aqui “turba”, que comunica uma massa potencialmente desordeira.
- source_word: καταψευσμόν
  choice: uma acusação falsa
  rationale: O termo indica uma declaração falsa contra alguém. A tradução conserva o sentido interpessoal ou forense e o distingue da difamação já mencionada.
- source_word: ὑπὲρ θάνατον
  choice: pior que a morte
  rationale: No contexto, a construção comparativa indica que esses males superam a morte em gravidade. A formulação é clara e corrente em português.
- source_word: πάντα
  choice: tudo isso
  rationale: O neutro plural retoma coletivamente os três elementos anteriores; “tudo isso” torna essa referência natural em português.
- source_word: μοχθηρά
  choice: é pior
  rationale: O adjetivo significa mau, penoso ou grave. Junto de ὑπὲρ θάνατον, a expressão idiomática “é pior que a morte” transmite adequadamente a comparação.
