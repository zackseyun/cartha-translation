  text: Golden pillars on a silver base[a], and beautiful feet on the breast of one who stands firm.
translation:
  language: pt
  text: Colunas de ouro sobre uma base de prata, e pés formosos sobre o peito de quem se mantém firme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem grega é condensada e de interpretação difícil; literalmente, a segunda parte diz algo como “pés formosos sobre peitos de alguém firme/estável”. Aqui, εὐσταθοῦς é entendido como substantivado (“quem se mantém firme”), e στέρνοις como referência à região do peito.
    reason: lexical_alternative
lexical_decisions:
- source_word: στύλοι
  choice: colunas
  rationale: O substantivo designa estruturas verticais de sustentação; “colunas” preserva com naturalidade a imagem arquitetônica em português.
- source_word: χρύσεοι
  choice: de ouro
  rationale: O adjetivo indica que as colunas são feitas de ouro; a locução evita que “douradas” seja entendida apenas como referência à cor ou ao revestimento.
- source_word: βάσεως ἀργυρᾶς
  choice: uma base de prata
  rationale: Mantém a imagem concreta de uma base sobre a qual repousam as colunas e expressa claramente o material.
- source_word: πόδες
  choice: pés
  rationale: É o sentido concreto do substantivo grego. Embora a imagem possa sugerir postura ou modo de andar, o texto nomeia literalmente os pés.
- source_word: ὡραῖοι
  choice: formosos
  rationale: Expressa beleza e graciosidade em registro poético e digno, sem abandonar a linguagem corrente.
- source_word: στέρνοις
  choice: o peito
  rationale: O plural grego se refere à região do peito ou tórax; o singular coletivo é mais idiomático em português e conserva a imagem corporal.
- source_word: εὐσταθοῦς
  choice: de quem se mantém firme
  rationale: O adjetivo substantivado comunica firmeza, estabilidade ou constância. A formulação portuguesa preserva tanto a ideia de estabilidade quanto a possível imagem de postura firme.
