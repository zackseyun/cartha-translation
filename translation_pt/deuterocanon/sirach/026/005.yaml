  text: 'From three things my heart was afraid[a], and before a fourth I prayed:'
translation:
  language: pt
  text: 'Por causa de três coisas, meu coração teve medo; e diante da quarta face[a], supliquei:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “diante da quarta face”. A expressão pode significar “quanto à quarta pessoa” ou, de modo mais geral, “diante da quarta coisa”.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: por causa de três coisas
  rationale: A preposição ἀπό com o numeral introduz aqui aquilo que causa o medo. “Coisas” é suprido para que a frase seja natural em português, sem antecipar os itens enumerados a seguir.
- source_word: εὐλαβήθη
  choice: teve medo
  rationale: No contexto, o verbo expressa temor ou apreensão, não reverência. A formulação mantém o coração como sujeito e usa linguagem corrente.
- source_word: ἡ καρδία μου
  choice: meu coração
  rationale: Preserva a imagem antropológica do original, em que o coração é o centro da reação interior.
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: diante da quarta face
  rationale: Mantém a imagem incomum de πρόσωπον, “face”, sem decidir no texto principal se a expressão indica uma pessoa ou, de modo mais geral, a quarta coisa. A nota registra essa ambiguidade.
- source_word: ἐδεήθην
  choice: supliquei
  rationale: O verbo δέομαι pode significar implorar, suplicar ou orar. “Supliquei” conserva a intensidade do verbo sem explicitar um destinatário que não aparece neste versículo.
theological_decisions:
- issue: Grau de literalidade em ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: Conservar “diante da quarta face” no texto principal
  alternative: “quanto à quarta pessoa” ou “diante da quarta coisa”
  rationale: A expressão grega é deliberadamente preservada em sua forma incomum, pois normalizá-la como “pessoa” ou “coisa” resolveria uma ambiguidade real do texto. A nota oferece as leituras possíveis.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O paralelismo numérico e a imagem de “meu coração” foram mantidos; a formulação incomum “quarta face” é esclarecida em nota, sem eliminar a ambiguidade do grego.
