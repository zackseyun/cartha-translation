  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: pt
  text: Como um viajante sedento, ela abre a boca[a] e beberá de toda água que estiver por perto; diante de toda estaca se sentará e, diante de uma flecha, abrirá a aljava[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A imagem é metafórica e provavelmente retrata comportamento sexual indiscriminado: ela aproveita qualquer oportunidade que esteja ao alcance.'
    reason: cultural_note
  - marker: b
    text: “Estaca”, “flecha” e “aljava” traduzem literalmente as imagens gregas. O sentido exato da imagem final é discutido, mas ela dá continuidade à metáfora sexual do versículo.
    reason: lexical_note
  - marker: c
    text: O grego deste versículo é vívido, mas difícil, sobretudo na última oração. A tradução permanece próxima de sua formulação, sem explicar a metáfora de modo mais explícito.
    reason: translation_note
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: um viajante sedento
  rationale: Expressa de modo natural a comparação com quem viaja sentindo sede, sem aumentar a intensidade do grego.
- source_word: τὸ στόμα ἀνοίγει
  choice: abre a boca
  rationale: Mantém a ação concreta e o presente do verbo grego.
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς
  choice: de toda água que estiver por perto
  rationale: Preserva a abrangência de παντός e comunica em português corrente a ideia de beber de qualquer água disponível nas proximidades.
- source_word: πίεται
  choice: beberá
  rationale: Reproduz o futuro do verbo grego; o sujeito feminino é explicitado a partir do contexto imediato.
- source_word: κατέναντι παντὸς πασσάλου
  choice: diante de toda estaca
  rationale: Mantém literalmente πάσσαλος como “estaca” e não explicita no corpo do texto a provável conotação sexual.
- source_word: καθίσεται
  choice: se sentará
  rationale: O futuro médio é expresso naturalmente como ação reflexiva em português.
- source_word: ἔναντι βέλους
  choice: diante de uma flecha
  rationale: O texto grego fornecido traz βέλους no singular, sem παντός; o artigo indefinido produz uma formulação portuguesa natural sem importar “toda” ou “qualquer” do inglês de consulta.
- source_word: φαρέτραν
  choice: aljava
  rationale: É o equivalente português preciso de φαρέτρα, preservando a imagem concreta e incomum do original.
theological_decisions:
- issue: Metáfora sexual em uma advertência sapiencial
  choice: Conservar as imagens de beber, estaca, flecha e aljava.
  alternative: Substituí-las por uma paráfrase explícita sobre indiscriminação sexual.
  rationale: O contexto sugere fortemente uma metáfora sexual, mas o grego a comunica por imagens concretas. Preservá-las evita tornar explícito no texto principal o que permanece figurado no original.
- issue: Sujeito feminino nas orações
  choice: Empregar “ela” uma vez para ligar a comparação à mulher mencionada no contexto.
  alternative: Repetir “ela” em cada oração ou deixar o sujeito inteiramente implícito.
  rationale: O português permite omitir o pronome após sua primeira ocorrência. Assim, o referente fica claro sem repetição pesada nem mudança de sentido.
- issue: Número e determinação de βέλους
  choice: Traduzir “diante de uma flecha”.
  alternative: Traduzir “diante de toda flecha”, conforme a camada inglesa de consulta.
  rationale: Na fonte grega apresentada, βέλους é singular e não vem acompanhado de παντός. A tradução segue essa evidência, preservando também a dificuldade da imagem.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A estrutura conserva a progressão entre o presente inicial e os futuros subsequentes. “Aljava” é menos frequente no uso cotidiano, mas é o termo preciso e reconhecível para o recipiente de flechas.
