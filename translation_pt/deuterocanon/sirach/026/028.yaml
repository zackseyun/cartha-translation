    issue: O valor condicional de ἐὰν não aparece na tradução principal.
    rationale: ἐὰν σκυβαλωθῶσιν significa literalmente «se forem tratados como refugo/lixo». «Homens de entendimento tratados como lixo» pode ser lido apenas como sintagma descritivo, em vez da condição expressa no grego.
  - severity: low
    issue: «Justiça» é menos específico que «retidão» para δικαιοσύνη neste contexto.
    rationale: A oposição imediata é entre uma conduta moralmente reta e o pecado. «Retidão» conserva esse contraste de modo mais direto e evita uma leitura prioritariamente forense de «justiça».
