base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: pt
  text: 'Por duas coisas meu coração está entristecido, e por uma terceira a ira se apoderou de mim: um guerreiro que passa necessidade por causa da pobreza, homens sensatos, se forem tratados como lixo[a], e aquele que volta da retidão para o pecado — o Senhor o preparará para a espada.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tratados como refugo” ou “lançados fora como esterco”. O verbo grego deriva de uma palavra para lixo, dejetos ou algo descartado e exprime degradação contemptuosa.
    reason: lexical_alternative
  - marker: b
    text: O pronome singular “o” refere-se mais naturalmente àquele que volta da retidão para o pecado. Contudo, a lista grega tem uma sintaxe condensada, e a declaração de juízo também pode ser entendida como conclusão de todo o dito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: Por duas coisas
  rationale: Introduz de modo natural, em português, as causas da tristeza enumeradas pelo autor.
- source_word: λελύπηται ἡ καρδία μου
  choice: meu coração está entristecido
  rationale: O perfeito expressa um estado presente resultante da tristeza; a formulação conserva tanto o aspecto quanto a imagem do coração.
- source_word: θυμός μοι ἐπῆλθεν
  choice: a ira se apoderou de mim
  rationale: Expressa vividamente a ira que sobrevém ao falante, sem intensificar necessariamente o termo como fúria.
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: um guerreiro que passa necessidade por causa da pobreza
  rationale: Mantém a ideia de um homem de guerra privado do necessário em razão da indigência, em linguagem clara e corrente.
- source_word: ἄνδρες συνετοὶ
  choice: homens de entendimento
  rationale: Preserva o masculino plural e a noção de discernimento ou compreensão associada a συνετός.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: tratados como lixo
  rationale: O verbo, formado a partir de uma palavra para dejetos ou refugo, indica degradação e tratamento contemptuoso; esta opção conserva a força sem vulgaridade excessiva.
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: aquele que volta da justiça para o pecado
  rationale: Reproduz o movimento regressivo do particípio e mantém o contraste moral e religioso entre δικαιοσύνη e pecado.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É a forma portuguesa corrente para κύριος quando se refere a Deus, sem impor a convenção gráfica reservada ao tetragrama hebraico.
- source_word: ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: o preparará para a espada
  rationale: Segue de perto a construção grega e preserva seu tom ominoso de destinação ao juízo pela espada.
theological_decisions:
- issue: Referente do pronome singular αὐτόν na cláusula final
  choice: O pronome é apresentado como referente imediato de “aquele que volta da justiça para o pecado”.
  alternative: A sentença de juízo pode ser ouvida como conclusão referente a toda a lista.
  rationale: O singular masculino vem logo após o particípio singular e aponta mais naturalmente para quem retorna da justiça ao pecado; a sintaxe comprimida, porém, não permite eliminar por completo uma leitura mais abrangente.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o equivalente português tradicional e semanticamente amplo, mantendo a tensão entre condição moral, conduta correta e fidelidade, enquanto “retidão” explicitaria mais diretamente apenas o aspecto ético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração e a mudança abrupta para a sentença final foram preservadas; o travessão ajuda a marcar essa transição sem resolver em excesso a ambiguidade sintática.
