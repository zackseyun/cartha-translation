  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
translation:
  language: pt
  text: Seja rico ou pobre[a], quem tem bom coração tem sempre um rosto alegre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Do rico e do pobre, coração bom; em todo tempo, rosto alegre”. O grego é uma frase nominal condensada, sem verbos expressos; a tradução torna sua relação mais clara em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  choice: Rico ou pobre
  rationale: Os genitivos antitéticos πλουσίου e πτωχοῦ são vertidos como uma alternativa idiomática referente à condição econômica da pessoa. δέ funciona aqui como transição leve e não precisa ser expresso por uma conjunção adversativa.
- source_word: καρδία ἀγαθή
  choice: quem tem bom coração
  rationale: A formulação preserva a imagem concreta do coração como disposição interior boa e, ao mesmo tempo, explicita em português o referente humano implícito na construção grega comprimida.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: Mantém de perto a expressão temporal grega e comunica constância de modo claro e digno.
- source_word: πρόσωπον ἱλαρόν
  choice: mostra um rosto alegre
  rationale: πρόσωπον é literalmente “rosto”, e ἱλαρόν indica alegria ou jovialidade. O verbo “mostra”, suprido porque a oração grega é nominal, torna natural em português a relação entre a disposição interior e a expressão exterior.
