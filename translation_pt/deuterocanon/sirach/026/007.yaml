  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: pt
  text: A mulher rival em relação a outra mulher é dor no coração e tristeza; é um açoite da língua que alcança a todos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'A expressão final é difícil. Mais literalmente, o grego diz: “um açoite da língua, relacionando-se ou tendo em comum com todos”. O particípio feminino pode concordar tanto com “mulher” quanto com “açoite”. O sentido provável é que esse açoite verbal alcança a todos indiscriminadamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλγος καρδίας
  choice: dor no coração
  rationale: Mantém a imagem do grego e expressa de modo natural o sofrimento interior, sem reduzir a frase a uma referência anatômica.
- source_word: πένθος
  choice: tristeza
  rationale: O termo pode indicar pesar ou luto; “tristeza” se ajusta ao paralelismo e evita especificar indevidamente um luto ritual.
- source_word: γυνὴ ἀντίζηλος
  choice: a mulher que rivaliza
  rationale: ἀντίζηλος admite tanto a ideia de ciúme quanto a de rivalidade. A formulação verbal preserva as duas nuances melhor que uma qualificação exclusivamente emocional.
- source_word: ἐπὶ γυναικί
  choice: com outra mulher
  rationale: A expressão preposicional é condensada e indica uma relação de oposição ou rivalidade. “Com outra mulher” soa natural em português sem impor que ambas sejam esposas.
- source_word: μάστιξ γλώσσης
  choice: um açoite da língua
  rationale: Preserva a metáfora forte da fala que fere, em linguagem digna e compreensível.
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: que atinge a todos
  rationale: O particípio feminino se refere formalmente à mulher, mas a construção é difícil. No contexto, a tradução expressa a provável ideia de que seu açoite verbal alcança indiscriminadamente todas as pessoas, sem ocultar a dificuldade em nota.
