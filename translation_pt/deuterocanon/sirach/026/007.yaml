  naturalness: A inversão em «Dor no coração e tristeza é a mulher...» é compreensível, mas pouco natural em português moderno. Reordenar a frase torna a relação predicativa clara e conserva o tom proverbial.
  terminology: «Mulher rival» traduz de modo conciso ἀντίζηλος sem decidir entre rivalidade e ciúme. «Açoite da língua» conserva a imagem de μάστιξ γλώσσης. A nota final deve evitar afirmar que o feminino do particípio identifica a mulher como antecedente, pois μάστιξ também é feminino e pode ser o antecedente gramatical.
  issues:
