revisions:
- from: Dor no coração e tristeza é a mulher que rivaliza com outra mulher[a]; ela é um açoite da língua que atinge a todos[b].
  to: A mulher rival em relação a outra mulher é dor no coração e tristeza; é um açoite da língua que alcança a todos[b].
  rationale: A frase foi reordenada para maior naturalidade e clareza em português. «Mulher rival em relação a outra mulher» conserva a concisão e a ambiguidade relacional de γυνὴ ἀντίζηλος ἐπὶ γυναικί. A nota b foi corrigida para refletir que a concordância feminina do particípio não decide seu antecedente, pois «açoite» também é feminino em grego. O marcador a não é necessário no texto principal, pois a alternativa está adequadamente apresentada na nota; o marcador b permanece por assinalar uma dificuldade sintática relevante.
