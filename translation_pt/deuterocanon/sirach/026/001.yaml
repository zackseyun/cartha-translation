translation:
  language: pt
  text: Feliz é o marido de uma boa esposa[a], e o número dos seus dias é dobrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado é” ou “Afortunado é” o marido de uma boa esposa.'
    reason: Alternativas lexicais legítimas para אַשְׁרֵי, que pode expressar felicidade, fortuna ou bem-aventurança.
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: uma boa esposa
  rationale: A expressão hebraica significa literalmente “boa mulher/esposa”. Como בַעֲלָהּ estabelece a relação conjugal, “esposa” é o sentido natural; “boa” preserva a amplitude moral e prática do original sem acrescentar a interpretação mais específica de “virtuosa”.
- source_word: אַשְׁרֵי
  choice: Feliz é
  rationale: A forma exclamativa descreve uma condição invejável de bem-estar e admite “feliz”, “afortunado” ou “bem-aventurado”. “Feliz é” mantém o tom sapiencial e é claro em português atual, sem tornar explícita uma ação divina que o provérbio não declara.
- source_word: בַעֲלָהּ
  choice: o marido de
  rationale: Embora o termo possa significar “senhor/dono” em outros contextos, aqui designa o marido. A reestruturação “o marido de uma boa esposa” expressa naturalmente a relação conjugal e concorda com o paralelo grego ὁ ἀνήρ.
- source_word: וּמִסְפַּר יָמָיו
  choice: e o número dos seus dias
  rationale: A formulação conserva a imagem e o registro proverbial do hebraico, também refletidos no grego ἀριθμὸς τῶν ἡμερῶν αὐτοῦ, sem reduzir a expressão simplesmente a “sua vida”.
- source_word: כִּפְלַיִם
  choice: é dobrado
  rationale: O hebraico significa “duplo, duas vezes”. “É dobrado” é conciso e preserva a afirmação proverbial sobre longevidade ou plenitude de vida sem explicá-la além do texto.
theological_decisions:
- issue: Tradução de אַשְׁרֵי / μακάριος na fórmula sapiencial
  choice: Feliz é
  alternative: Bem-aventurado é; Afortunado é
  rationale: O contexto apresenta uma declaração sapiencial de condição invejável, não uma atribuição explícita de bênção por Deus. “Feliz é” preserva a força da fórmula em linguagem acessível, enquanto as alternativas continuam lexicalmente possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o paralelismo proverbial e a imagem formal de “o número dos seus dias”, sem suavizar a afirmação de que esse número “é dobrado”.
