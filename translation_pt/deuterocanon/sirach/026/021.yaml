lexical_decisions:
- source_word: ἀνὴρ πολεμιστής
  choice: um guerreiro
  rationale: A expressão designa, no singular, um homem caracterizado pela atividade ou capacidade militar; “guerreiro” é direto e natural em português.
- source_word: ὑστερῶν
  choice: que desfalece
  rationale: O particípio indica estar em falta, ficar aquém ou falhar. Em ligação com διʼ ἔνδειαν, “desfalece” comunica a decadência causada pela privação sem transformar a expressão numa afirmação completa.
- source_word: διʼ ἔνδειαν
  choice: por causa da penúria
  rationale: ἔνδεια denota falta, necessidade ou pobreza. “Penúria” preserva a ideia de privação grave, e “por causa de” expressa claramente o valor causal de διά com acusativo.
- source_word: ἄνδρες συνετοί
  choice: homens de discernimento
  rationale: συνετός aponta para compreensão e discernimento prático, não apenas inteligência; a tradução também mantém o plural masculino explícito.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: se forem tratados como lixo
  rationale: O verbo deriva de σκύβαλον, aquilo que é rejeitado como lixo, refugo ou esterco. A formulação preserva a imagem de aviltamento e descarte em português corrente.
