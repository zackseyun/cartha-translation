translation:
  language: pt
  text: Uma esposa capaz faz prosperar o marido, e ele passará seus anos em bem-estar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “e ele completará seus anos em paz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: uma esposa valorosa
  rationale: A expressão designa uma mulher de força, competência e reconhecido valor. “Valorosa” preserva essa amplitude no contexto sapiencial sem restringir o sentido à coragem militar.
- source_word: תְּדַּשֵּׁן
  choice: alegra
  rationale: O verbo evoca literalmente tornar viçoso, próspero ou bem nutrido e, por extensão, proporcionar bem-estar. “Alegra” expressa naturalmente o resultado nesse contexto e é corroborado pelo grego εὐφραίνει.
- source_word: לְבַעֲלָהּ
  choice: seu marido
  rationale: בעל significa claramente “marido” aqui; o objeto direto produz uma formulação natural em português.
- source_word: וּשְׁנֵי חַיָּיו
  choice: seus anos
  rationale: É uma forma concisa e natural de traduzir literalmente “os anos de sua vida”, mantendo a ênfase temporal.
- source_word: יְבַלֶּה
  choice: passará
  rationale: No contexto, o verbo indica passar ou viver o decorrer dos anos.
- source_word: בַנְעִימִים
  choice: em bem-estar
  rationale: O hebraico aponta para circunstâncias agradáveis, deleitosas e favoráveis. “Em bem-estar” comunica essa ideia de modo natural e digno, sem adotar a leitura grega “em paz” no texto principal.
theological_decisions:
- issue: Divergência hebraico-grega na frase final
  choice: Seguir no texto principal o hebraico “em bem-estar”
  alternative: “em paz”
  rationale: O hebraico sobrevivente e de alta confiança traz a ideia de agrado ou deleite, enquanto o grego lê “em paz”. A leitura hebraica permanece no texto, e a alternativa grega é registrada em nota para preservar a evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Esposa valorosa” conserva a força da expressão sapiencial hebraica; “em bem-estar” evita tanto uma formulação artificial quanto a assimilação indevida à variante grega.
