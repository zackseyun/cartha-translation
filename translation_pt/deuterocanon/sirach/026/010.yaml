translation:
  language: pt
  text: A imoralidade sexual de uma mulher é reconhecida pelo erguer de seus olhos[a] e por suas pálpebras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela inquietação, altivez ou movimento errante de seus olhos”. A expressão grega é difícil e pode descrever um olhar erguido, inquieto ou insinuante.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em suas pálpebras”; a expressão provavelmente se refere ao que a expressão dos olhos ou o olhar revela.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressa de modo amplo a conduta sexual ilícita, sem restringir o sentido a prostituição ou a uma categoria jurídica específica.
- source_word: γυναικὸς
  choice: de uma mulher
  rationale: O genitivo sem artigo tem sentido genérico e possessivo, adequado ao caráter proverbial da frase.
- source_word: ἐν
  choice: pelo modo como / por
  rationale: A preposição indica aqui o sinal exterior pelo qual algo é reconhecido; a formulação escolhida soa natural em português.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: pelo modo como ela levanta os olhos
  rationale: Conserva a imagem de olhos erguidos sem definir indevidamente se o gesto é altivo, inquieto, errante ou insinuante.
- source_word: βλεφάροις
  choice: pálpebras
  rationale: Mantém a imagem corporal concreta do grego, embora o termo provavelmente aluda à expressão ou ao movimento dos olhos.
- source_word: γνωσθήσεται
  choice: se reconhece
  rationale: O futuro passivo possui força proverbial; o presente impessoal comunica naturalmente essa verdade geral em português.
theological_decisions:
- issue: Alcance moral de πορνεία na literatura sapiencial
  choice: imoralidade sexual
  alternative: prostituição; fornicação; falta de castidade
  rationale: O enunciado é proverbial e não delimita uma infração comercial, civil ou ritual específica; a expressão ampla preserva o alcance do substantivo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o caráter proverbial e a imagem concreta das pálpebras, enquanto a nota preserva a ambiguidade de μετεωρισμοῖς.
