  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
translation:
  language: pt
  text: Uma esposa de fala comedida é dádiva do Senhor, e nada se compara a uma alma bem-formada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há equivalente para uma alma bem-instruída”. O grego pode enfatizar tanto a instrução quanto a disciplina e a formação do caráter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόσις
  choice: dádiva
  rationale: No enunciado proverbial, indica algo concedido. “Dádiva” mantém o tom sapiencial e expressa com naturalidade um presente proveniente do Senhor.
- source_word: Κυρίου
  choice: do Senhor
  rationale: O genitivo indica a origem da dádiva. “Senhor” segue o uso bíblico corrente e digno em português.
- source_word: γυνὴ
  choice: esposa
  rationale: Embora γυνή também possa significar “mulher”, o contexto matrimonial de Sirácida 26 favorece “esposa”.
- source_word: σιγηρά
  choice: de fala comedida
  rationale: O adjetivo caracteriza alguém contido no falar. A expressão evita sugerir mudez absoluta, como poderia ocorrer com “silenciosa”, e preserva o elogio proverbial.
- source_word: ἀντάλλαγμα
  choice: nada se compara
  rationale: O termo pode designar aquilo que se oferece em troca ou algo equivalente. A formulação portuguesa comunica de modo natural que tal qualidade tem valor incomparável.
- source_word: πεπαιδευμένης
  choice: bem-formada
  rationale: O particípio de παιδεύω abrange instrução, formação moral e disciplina. “Bem-formada” preserva essa amplitude melhor que uma referência apenas acadêmica.
- source_word: ψυχῆς
  choice: alma
  rationale: Aqui ψυχή aponta para a pessoa interior ou seu caráter. “Alma” conserva o registro moral e sapiencial sem restringir o sentido a “mente”.
theological_decisions:
- issue: Relação de πεπαιδευμένης ψυχῆς com a esposa da primeira oração
  choice: Manter “uma alma” sem acrescentar um possessivo ou repetir “esposa”
  alternative: Explicitar “a alma bem-formada dessa esposa” ou “uma esposa de alma bem-formada”
  rationale: O paralelismo sugere que a segunda oração continua elogiando o caráter da esposa, mas o grego não torna essa identificação gramaticalmente explícita. A tradução conserva essa abertura.
- issue: Amplitude de πεπαιδευμένης
  choice: bem-formada
  alternative: bem-instruída; disciplinada
  rationale: A palavra pode destacar tanto a instrução recebida quanto a disciplina e a formação do caráter. “Bem-formada”, acompanhada de nota, evita reduzir a expressão à educação acadêmica ou ao autocontrole.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. “De fala comedida” traduz o elogio à contenção no falar sem impor silêncio absoluto; “bem-formada” mantém a densidade moral própria da literatura sapiencial.
