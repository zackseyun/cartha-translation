    rationale: Embora “colo” possa corresponder a חֵיק em outros contextos, a construção portuguesa sugere uma ação física concreta que não comunica bem a imagem proverbial de vínculo íntimo/posse relacional.
  - severity: low
    issue: A formulação da nota “como porção” não reproduz com precisão a construção grega ἐν μερίδι.
    rationale: O grego diz literalmente que ela será dada “na porção” dos que temem o Senhor; a redação revista conserva essa diferença em relação à imagem hebraica.
  revised_text: Uma boa esposa é um bom presente; será dada ao abraço de quem teme a Deus.[a]
