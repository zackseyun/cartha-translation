revisions:
- from: Uma boa esposa é um bom presente; será dada ao colo de quem teme a Deus.[a]
  to: Uma boa esposa é um bom presente; será dada ao abraço de quem teme a Deus.[a]
  rationale: A revisão mantém o hebraico como texto-base e preserva sua imagem de intimidade por meio de “ao abraço”, expressão mais natural em português do que “ao colo” nesta construção. A nota continua a registrar tanto a leitura grega “Senhor” quanto sua metáfora de “porção”.
