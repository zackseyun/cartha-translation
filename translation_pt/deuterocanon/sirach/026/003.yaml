review_pass:
  verdict: revise
  source_fidelity: 'O texto principal preserva corretamente o hebraico: “esposa”, a repetição “boa/bom”, “presente”, o futuro passivo e “Deus” (não “Senhor”). Contudo, “dada ao colo” em português sugere sobretudo colocar alguém fisicamente no colo e soa mais deslocado que a imagem hebraica pretendida de proximidade íntima.'
  naturalness: A revisão substitui “ao colo” por “ao abraço”, uma imagem idiomática e digna em português que conserva a proximidade íntima de בְּחֵיק sem a conotação estranha ou infantilizante de “dar uma esposa ao colo” de alguém.
  terminology: “Boa esposa”, “bom presente” e “quem teme a Deus” são adequados ao contexto sapiencial e ao registro moderno. A nota é ajustada para representar mais exatamente o grego, que diz que ela será dada “na porção” dos que temem o Senhor, e não simplesmente “como porção”.
  issues:
