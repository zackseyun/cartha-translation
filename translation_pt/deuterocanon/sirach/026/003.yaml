  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: pt
  text: Uma boa esposa é um bom presente; será dada ao abraço de quem teme a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “será dada na porção dos que temem o Senhor”. O hebraico diz “ao abraço de quem teme a Deus”, empregando uma imagem mais íntima.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: uma boa esposa
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”, mas o contexto matrimonial favorece “esposa”. A formulação mantém também a repetição de “boa/bom” no provérbio.
- source_word: מַתָּנָה טוֹבָה
  choice: um bom presente
  rationale: מַתָּנָה designa algo dado como presente. “Bom presente” conserva de modo claro e natural a repetição de טוֹבָה.
- source_word: בְּחֵיק
  choice: ao colo de
  rationale: חֵיק pode indicar o colo ou o seio e expressa proximidade íntima. “Ao colo de” preserva a imagem concreta do hebraico em português atual, sem a tornar abstrata como “porção”.
- source_word: יֵרֵא אֱלֹהִים
  choice: quem teme a Deus
  rationale: A expressão hebraica significa literalmente alguém que teme a Deus. Esta tradução mantém o singular genérico sem acrescentar explicitamente “homem” e segue אֱלֹהִים, “Deus”.
- source_word: תִּנָּתֵן
  choice: será dada
  rationale: O nifal imperfeito é traduzido como futuro passivo; o gênero feminino remete claramente à boa esposa.
theological_decisions:
- issue: Título divino na oração final
  choice: Deus
  alternative: Senhor
  rationale: O testemunho hebraico primário traz אֱלֹהִים (“Deus”), enquanto o paralelo grego traz Κύριον (“Senhor”). O texto principal segue o hebraico, e a variante grega é registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A concisão proverbial e a repetição “boa/bom” foram preservadas; “colo” mantém a imagem hebraica sem recorrer ao menos corrente “seio”.
