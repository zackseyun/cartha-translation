  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
translation:
  language: pt
  text: Encanto sobre encanto é uma mulher recatada[a], e nenhuma balança é digna de uma alma que tem domínio de si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma mulher que tem pudor»; o termo grego também pode ser traduzido por «modesta», «reservada» ou, mais literalmente, «tímida».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: Encanto sobre encanto
  rationale: Neste contexto sapiencial, χάρις expressa encanto, agrado ou beleza graciosa. A repetição com ἐπί indica acumulação e é preservada sem sugerir principalmente o sentido teológico de “graça”.
- source_word: γυνὴ
  choice: uma mulher
  rationale: γυνή pode significar “mulher” ou “esposa”; sem indicação possessiva ou contexto conjugal imediato, mantém-se o sentido mais amplo.
- source_word: αἰσχυντηρά
  choice: recatada
  rationale: O adjetivo descreve quem possui pudor ou reserva apropriada. “Recatada” comunica essa virtude em português atual sem sugerir vergonha humilhante.
- source_word: σταθμὸς
  choice: balança
  rationale: O termo designa instrumento ou padrão de pesagem; “balança” preserva de modo claro a metáfora de valor incomensurável.
- source_word: πᾶς ἄξιος
  choice: nenhuma ... é digna
  rationale: A construção grega afirma literalmente que não existe balança alguma digna ou adequada; a formulação portuguesa preserva essa expressão comprimida, em vez de explicitar que a balança não consegue pesar o valor.
- source_word: ἐγκρατοῦς ψυχῆς
  choice: de uma alma que tem domínio próprio
  rationale: ἐγκρατής indica autocontrole ou domínio de si, e ψυχή é mantido como “alma”. A oração relativa soa mais natural que “alma autocontrolada” e conserva a força ética.
theological_decisions:
- issue: Sentido de αἰσχυντηρά como virtude
  choice: recatada
  alternative: modesta; reservada; que tem pudor
  rationale: O contexto elogia o pudor e a reserva moral, não a humilhação nem a vergonha. “Recatada” mantém o caráter positivo sem impor uma doutrina específica.
- issue: Metáfora de valor em οὐκ ἔστιν σταθμὸς πᾶς ἄξιος
  choice: nenhuma balança é digna
  alternative: nenhuma balança pode pesar o valor
  rationale: A versão escolhida preserva a forma e a tensão da frase grega, que declara não haver balança digna da alma, sem transformar a metáfora numa explicação explícita sobre seu valor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela e a metáfora da balança foram mantidas próximas do grego; evitou-se “graça sobre graça” por sua possível ressonância teológica alheia ao contexto sapiencial.
