base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/017.yaml
  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
translation:
  language: pt
  text: Como o sol que nasce nas alturas do Senhor, assim é a beleza de uma boa esposa[a] no ornamento[b] da casa dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma boa mulher». A palavra grega pode significar tanto «mulher» como «esposa»; o contexto da casa favorece aqui «esposa».
    reason: lexical_alternative
  - marker: b
    text: Ou «na ordem» ou «no arranjo». A palavra grega pode indicar tanto organização harmoniosa como adorno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: o sol que nasce
  rationale: Reproduz de modo natural a imagem dinâmica do particípio grego, sem transformá-la numa descrição estática.
- source_word: ἐν ὑψίστοις Κυρίου
  choice: nas alturas do Senhor
  rationale: Mantém o plural ὑψίστοις e o genitivo Κυρίου, sem substituir a expressão pela interpretação mais explícita «nas alturas do céu».
- source_word: κάλλος
  choice: beleza
  rationale: É o equivalente direto e corrente, adequado ao paralelismo poético.
- source_word: ἀγαθῆς γυναικός
  choice: de uma boa esposa
  rationale: γυνή pode significar «mulher» ou «esposa»; a menção da casa favorece aqui o sentido conjugal, enquanto «boa» preserva a amplitude de ἀγαθή.
- source_word: ἐν κόσμῳ
  choice: no ornamento
  rationale: κόσμος pode indicar ordem, arranjo ou adorno. «Ornamento» produz uma frase portuguesa clara e preserva o aspecto visual da comparação, enquanto a nota registra a amplitude lexical.
- source_word: οἰκίας αὐτοῦ
  choice: da casa dele
  rationale: Conserva o possessivo masculino αὐτοῦ e evita que o português «sua» torne indeterminado se a casa é atribuída à esposa.
theological_decisions:
- issue: Linguagem conjugal e doméstica marcada por gênero
  choice: boa esposa ... casa dele
  alternative: boa mulher ... sua casa
  rationale: O contexto doméstico favorece «esposa», e o possessivo grego é masculino. A tradução mantém esses dados sem neutralizá-los nem acrescentar uma doutrina sobre os papéis conjugais.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe comparativa natural. A fórmula «assim é» explicita a relação poética indicada pela justaposição grega. «Casa dele» foi mantido para tornar visível o possessivo masculino do texto-fonte.
