lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: Por duas coisas
  rationale: ἐπί com o dativo indica aqui a causa ou ocasião da tristeza; a formulação preserva com naturalidade a estrutura enumerativa.
- source_word: λελύπηται
  choice: está entristecido
  rationale: O perfeito médio/passivo de λυπέω descreve um estado presente resultante da tristeza, bem expresso pela locução portuguesa.
- source_word: ἡ καρδία μου
  choice: meu coração
  rationale: Mantém a imagem bíblica do coração como centro das emoções sem paráfrase desnecessária.
- source_word: ἐπὶ τῷ τρίτῳ
  choice: pela terceira
  rationale: Retoma a construção da primeira oração e conserva a progressão retórica até o terceiro motivo.
- source_word: θυμός
  choice: a ira
  rationale: Expressa a forte indignação indicada por θυμός em registro digno, sem chegar à intensidade potencialmente excessiva de “fúria”.
- source_word: μοι ἐπῆλθεν
  choice: se apoderou de mim
  rationale: Reproduz de modo idiomático a ideia de que a ira sobreveio ao falante e o dominou, sem reduzir a expressão a uma simples declaração de que ele ficou irado.
