  text: Guard yourself against an impudent eye[b][a], and do not be surprised if she sins against you.
translation:
  language: pt
  text: Proteja-se de um olhar sem pudor[a] e não se surpreenda se ela[b] pecar contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “proteja-se de/por trás de um olho sem pudor”. A expressão preposicional é idiomática e difícil; a tradução apresenta o sentido provável.
    reason: lexical_alternative
  - marker: b
    text: O grego não traz aqui um pronome equivalente a “ela”; o sujeito feminino é inferido do contexto próximo, que fala de uma mulher moralmente desregrada.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω
  choice: de
  rationale: A construção ὀπίσω ... φύλαξαι é idiomática e difícil. Em português, “proteja-se de” comunica de modo natural a ideia de cautela e afastamento, sem impor um sentido espacial estranho ao contexto.
- source_word: ἀναιδοῦς
  choice: sem pudor
  rationale: O adjetivo descreve falta de vergonha ou recato. “Sem pudor” conserva essa força moral e combina naturalmente com “olhar” em português atual.
- source_word: ὀφθαλμοῦ
  choice: olhar
  rationale: Embora o substantivo grego signifique literalmente “olho”, aqui ele representa o olhar ou a maneira de olhar. “Olhar” preserva a imagem e produz uma expressão natural em português.
- source_word: φύλαξαι
  choice: Proteja-se
  rationale: O imperativo aoristo de φυλάσσω expressa uma advertência direta para que a pessoa se resguarde. “Proteja-se” transmite com clareza esse valor reflexivo.
- source_word: μὴ θαυμάσῃς
  choice: não se surpreenda
  rationale: Neste contexto de advertência, θαυμάζω tem o sentido pragmático de ficar surpreso, não o de admirar.
- source_word: ἐὰν
  choice: se
  rationale: Mantém o valor condicional normal da partícula e evita apresentar o ato como inevitável.
- source_word: εἰς σέ
  choice: contra você
  rationale: Com πλημμελέω, a expressão indica a pessoa atingida pela ofensa. “Contra você” comunica diretamente essa relação.
- source_word: πλημμελήσῃ
  choice: pecar contra
  rationale: O verbo pode significar agir mal, cometer uma falta ou pecar. “Pecar contra” preserva seu peso moral e se ajusta à linguagem sapiencial.
theological_decisions:
- issue: O gênero do sujeito é inferido, mas não explicitado na frase grega
  choice: ela
  alternative: essa pessoa; formulação impessoal
  rationale: O contexto imediato de Sirácida 26 trata de uma mulher moralmente desregrada, por isso “ela” torna a referência clara. Como o verbo grego não traz pronome expresso, uma nota registra que o gênero é uma inferência contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Olhar sem pudor” evita o pouco natural “olho impudente”, enquanto as notas preservam a forma concreta e a ambiguidade do grego.
