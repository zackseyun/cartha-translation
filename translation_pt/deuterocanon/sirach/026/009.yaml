translation:
  language: pt
  text: Uma esposa embriagada[a] provoca grande ira, e não esconderá a própria vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma mulher embriagada”. O grego pode significar tanto “mulher” como “esposa”.'
    reason: Preserva a ambiguidade lexical de γυνή, embora o contexto conjugal favoreça «esposa» no texto.
lexical_decisions:
- source_word: γυνὴ μέθυσος
  choice: esposa embriagada
  rationale: γυνή pode significar “mulher” ou “esposa”; o contexto imediato sobre a vida conjugal favorece “esposa”. “Embriagada” conserva o sentido de μέθυσος em registro digno e atual.
- source_word: ὀργὴ μεγάλη
  choice: grande indignação
  rationale: A expressão nominal grega significa literalmente “grande ira”. “É causa de grande indignação” comunica em português natural que essa conduta desperta forte ira, sem a formulação pouco idiomática “é grande ira”.
- source_word: ἀσχημοσύνην
  choice: vergonha
  rationale: O termo denota comportamento ou exposição vergonhosa, indecorosa. “Vergonha” preserva a amplitude do grego sem especificar uma forma particular de desonra.
- source_word: οὐ συγκαλύψει
  choice: não esconderá
  rationale: Reproduz o valor futuro e a ideia de cobrir, ocultar ou dissimular.
theological_decisions:
- issue: Referência a mulher ou esposa
  choice: esposa no texto, com nota sobre a alternativa “mulher”
  alternative: mulher embriagada
  rationale: O substantivo grego é lexicalmente ambíguo, mas o contexto conjugal de Sirácida 26 favorece “esposa”; a nota mantém visível a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “é causa de grande indignação” evita o decalque pouco natural “é grande ira”, mantendo a força sentenciosa do original.
