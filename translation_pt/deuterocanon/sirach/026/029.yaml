  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
translation:
  language: pt
  text: Dificilmente um comerciante escapará de uma falta[a], e um varejista[b] não será absolvido do pecado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dificilmente se livrará de uma falta”. O verbo grego pode significar escapar ou conseguir se desvencilhar de algo.'
    reason: lexical_alternative
  - marker: b
    text: “Varejista” traduz um termo grego para um vendedor de pequena escala ou revendedor, palavra que às vezes tinha conotação social negativa.
    reason: cultural_note
  - marker: c
    text: 'Ou: “não será declarado justo em relação ao pecado”. O verbo grego tem sentido judicial e também pode ser traduzido “não será absolvido do pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μόλις
  choice: Dificilmente
  rationale: Expressa que algo só acontece com grande dificuldade ou quase não acontece, preservando a força proverbial do grego.
- source_word: ἐξελεῖται
  choice: escapará
  rationale: O futuro médio pode indicar que alguém escapa ou consegue se livrar de algo; “escapará” mantém essa ideia sem transformar a forma em passiva.
- source_word: ἔμπορος
  choice: comerciante
  rationale: Designa quem se dedica ao comércio, especialmente um mercador ou negociante; “comerciante” é claro e neutro no português atual.
- source_word: πλημμελείας
  choice: má conduta
  rationale: O termo abrange falta, infração ou procedimento errado. “Má conduta” conserva o sentido moral geral sem restringi-lo à fraude comercial.
- source_word: δικαιωθήσεται
  choice: será declarado justo
  rationale: Preserva a força declarativa ou judicial de δικαιόω sem recorrer ao termo teologicamente mais técnico “justificado”.
- source_word: κάπηλος
  choice: varejista
  rationale: Refere-se a um vendedor de pequena escala ou revendedor. “Varejista” distingue esse comerciante do ἔμπορος da primeira oração, sem inserir no substantivo uma conotação pejorativa incerta.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: Mantém o sentido moral e religioso comum do substantivo grego, sem enfraquecê-lo para “erro” ou “falta”.
theological_decisions:
- issue: Sentido de δικαιωθήσεται no contexto sapiencial
  choice: será declarado justo
  alternative: será absolvido
  rationale: A tradução conserva o aspecto declarativo e judicial do verbo, mas evita importar uma formulação doutrinária posterior. “Absolvido” seria natural, porém estreitaria o verbo à absolvição forense.
- issue: Relação de ἀπὸ ἁμαρτίας com δικαιωθήσεται
  choice: livre do pecado
  alternative: por causa do pecado
  rationale: A preposição ἀπό indica separação ou afastamento. A formulação escolhida preserva a ideia de ser declarado justo e separado do pecado, enquanto a alternativa causal não representa tão diretamente a construção grega.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A escolha de “comerciante” e “varejista” mantém a distinção entre os dois termos comerciais gregos. A construção “declarado justo, livre do pecado” conserva a linguagem judicial e a preposição de separação, enquanto a nota registra uma alternativa mais idiomática.
