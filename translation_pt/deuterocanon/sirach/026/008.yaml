translation:
  language: pt
  text: A esposa perversa é uma canga de bois que se sacode[a]; quem a segura é como quem agarra um escorpião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é difícil e muito metafórica. Pode referir-se a uma canga de bois que se move aos solavancos ou é instável; também pode evocar bois jungidos que se agitam.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: canga de bois
  rationale: O composto evoca bois unidos por uma peça de jugo. “Canga de bois” conserva a imagem agrícola concreta e é de leitura natural em português, sem decidir se o termo designa mais precisamente a própria canga ou os bois jungidos.
- source_word: σαλευόμενον
  choice: que se sacode
  rationale: O particípio indica algo movido, abalado ou instável. A formulação mantém o movimento vívido da metáfora, enquanto a nota registra sua dificuldade.
- source_word: γυνὴ πονηρά
  choice: a esposa perversa
  rationale: No contexto doméstico, γυνή é melhor entendido como “esposa”; πονηρά expressa avaliação moral forte, adequadamente transmitida por “perversa”.
- source_word: ὁ κρατῶν αὐτῆς
  choice: quem a segura
  rationale: κρατέω pode significar agarrar, segurar ou dominar. “Segura” preserva o sentido tátil reforçado pela comparação seguinte, sem introduzir a interpretação mais específica de contê-la ou dominá-la.
- source_word: δρασσόμενος
  choice: agarra
  rationale: O verbo descreve pegar firmemente com a mão. “Agarra” é vívido e estabelece a correspondência concreta com “segura”.
- source_word: σκορπίου
  choice: um escorpião
  rationale: Equivalente zoológico direto, empregado naturalmente no singular indefinido em português.
