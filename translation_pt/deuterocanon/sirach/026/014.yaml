  text: A wife's grace delights her husband[a], and her understanding puts flesh on his bones.
translation:
  language: pt
  text: A graça de uma esposa alegrará seu marido, e o entendimento dela tornará robustos os ossos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o conhecimento dela engordará os ossos dele”. O verbo grego preserva uma imagem corporal de nutrição e fortalecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Aqui indica a qualidade graciosa e cativante da esposa, não a graça salvífica. “Graça” conserva de modo compacto o sentido moral e estético do termo grego.
- source_word: γυναικός
  choice: da esposa
  rationale: Embora γυνή possa significar “mulher” ou “esposa”, a referência explícita ao marido dela torna “esposa” a leitura contextual natural.
- source_word: τέρψει
  choice: alegra
  rationale: O futuro de τέρπω expressa causar prazer ou deleite. “Alegra” é natural em português e mantém a força afetiva positiva.
- source_word: ἐπιστήμη
  choice: entendimento
  rationale: No contexto da literatura sapiencial, refere-se à compreensão inteligente e prática, não apenas ao acúmulo de informação.
- source_word: πιανεῖ
  choice: dá vigor
  rationale: O verbo significa literalmente tornar gordo, nutrido ou robusto. Com “ossos” como objeto, “dá vigor” comunica o efeito fortalecedor sem produzir em português uma formulação involuntariamente estranha; a imagem corporal permanece explicitada pela menção aos ossos.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: aos ossos dele
  rationale: A tradução mantém a imagem corporal semítica presente no grego, associada à vitalidade física e interior.
