translation:
  language: pt
  text: Aquele que retorna da justiça ao pecado — o Senhor o preparará para a espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «Aquele que traz ou leva de volta da justiça ao pecado». O particípio grego pode sugerir a ideia de trazer ou levar de volta; neste contexto, indica o retorno de um caminho justo ao pecado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανάγων
  choice: volta
  rationale: O particípio pode significar literalmente «trazendo/levando de volta», mas, com «da justiça para o pecado», exprime naturalmente uma reversão moral. «Volta» preserva a concisão sem definir se a ação é inteiramente reflexiva.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Neste contraste ético com «pecado», «justiça» comunica conduta moralmente reta e corresponde de perto ao substantivo grego, sem exigir a formulação mais abstrata «retidão».
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: É a tradução direta e corrente no contexto moral e religioso.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É a forma bíblica natural para κύριος quando se refere a Deus.
- source_word: ἑτοιμάσει
  choice: preparará
  rationale: Reproduz diretamente o futuro grego e mantém aberta a natureza exata do ato de preparação para o juízo.
- source_word: εἰς ῥομφαίαν
  choice: para a espada
  rationale: Conserva a imagem concreta da ῥομφαία e sua possível função metonímica como instrumento de juízo, sem acrescentar «morte» ou «execução».
theological_decisions:
- issue: A ação divina em «o Senhor o preparará para a espada»
  choice: Manter o Senhor como agente explícito de um juízo futuro.
  alternative: Entender a espada apenas como consequência providencial geral da recaída moral.
  rationale: O grego apresenta explicitamente «o Senhor» como sujeito de «preparará». A tradução conserva essa tensão teológica sem explicar o mecanismo nem formular uma doutrina mais ampla de retribuição.
- issue: Agência na passagem da justiça para o pecado
  choice: Usar «volta», preservando a ideia de reversão sem explicitar uma construção reflexiva.
  alternative: «faz a si mesmo voltar» ou «é levado de volta».
  rationale: A forma ativa de ἐπανάγων pode, em sentido mais literal, sugerir trazer ou levar de volta, enquanto o contexto favorece a recaída do próprio indivíduo. A nota registra a alternativa sem resolver além do texto.
translation_notes:
  register: Português atual, digno e conciso, com leitura natural no Brasil e compreensão internacional. Mantém-se a estrutura proverbial e a imagem forte da espada; o travessão marca a transição entre a conduta humana e o juízo divino.
