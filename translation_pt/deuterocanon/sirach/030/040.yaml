  text: Se você o maltratar e o mandar embora, ele fugirá; por qual caminho você irá procurá-lo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição aberta e corresponde naturalmente ao valor condicional do grego.
- source_word: κακώσῃς
  choice: maltratar
  rationale: Expressa tratar alguém mal ou causar-lhe dano, sem restringir o sentido à violência física.
- source_word: ἀπάρᾳς
  choice: mandar embora
  rationale: No contexto, indica provocar o afastamento da pessoa; a expressão é clara e natural em português, sem intensificar desnecessariamente para 'expulsar'.
- source_word: ἀποδρᾷ
  choice: fugirá
  rationale: Preserva a imagem concreta de alguém que escapa ou foge depois de ser maltratado e mandado embora.
- source_word: ἐν ποίᾳ ὁδῷ
  choice: por qual caminho
  rationale: Mantém a referência concreta do grego a uma estrada ou caminho, em vez de reduzi-la simplesmente a 'onde'.
- source_word: ζητήσεις
  choice: irá procurá-lo
  rationale: Reproduz o sentido futuro da pergunta retórica em português corrente e deixa claro que se trata de tentar encontrar a pessoa.
