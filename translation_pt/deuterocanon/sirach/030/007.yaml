  yaml_path: translation/deuterocanon/sirach/030/007.yaml
  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: pt
  text: A respeito da vida de seus filhos, ele enfaixará suas feridas; e, a cada grito, suas entranhas se agitarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “A respeito das almas de seus filhos, ele enfaixará suas feridas; e, a cada clamor, suas entranhas ficarão perturbadas.”'
    reason: Registra os sentidos formais possíveis de περί, ψυχή, βοή e ταράσσω, sem decidir além do que a construção grega permite.
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: Por causa da vida de seus filhos
  rationale: περί com o genitivo pode indicar aquilo em torno do qual se dá a preocupação ou a causa dela; ψυχή pode significar “alma”, “vida” ou a própria pessoa. “Vida” produz português natural sem eliminar a dimensão de cuidado ansioso presente no contexto.
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: ele enfaixará as próprias feridas
  rationale: καταδεσμεύω descreve atar ou enfaixar firmemente; “as próprias feridas” deixa claro que αὐτοῦ modifica “feridas”.
- source_word: ἐπὶ πάσῃ βοῇ
  choice: a cada grito
  rationale: βοή pode ser grito, clamor ou ruído forte; “grito” preserva a imagem concreta e concorda com a reação de alarme.
- source_word: ταραχθήσεται σπλάγχνα αὐτοῦ
  choice: suas entranhas se agitarão
  rationale: σπλάγχνα designa literalmente as entranhas e, figuradamente, o centro visceral das emoções. “Se agitarão” comunica a perturbação interior sem apagar a imagem corporal.
theological_decisions:
- issue: Sentido de ψυχή na expressão ψυχῶν υἱῶν
  choice: vida de seus filhos
  alternative: almas de seus filhos
  rationale: O termo grego admite ambos os sentidos. No contexto da ansiedade de um pai e de feridas corporais, “vida” é idiomático e plausível, enquanto a nota registra a leitura mais formal “almas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imagem visceral preservada. A construção difícil περὶ ψυχῶν υἱῶν foi vertida de modo natural, e sua alternativa mais literal foi mantida em nota.
