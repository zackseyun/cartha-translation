lexical_decisions:
- source_word: ἔμβαλε
  choice: Ponha
  rationale: O imperativo aoristo de ἐμβάλλω tem aqui sentido idiomático de pôr ou colocar alguém em determinada atividade. “Ponha” preserva a força imperativa sem recorrer ao literalismo inadequado “lance”.
- source_word: αὐτὸν
  choice: -o
  rationale: O pronome masculino no acusativo retoma, no contexto, uma pessoa do sexo masculino; o pronome oblíquo mantém sua função de objeto direto.
- source_word: εἰς ἐργασίαν
  choice: para trabalhar
  rationale: A construção com εἰς indica ingresso em atividade produtiva. “Para trabalhar” é natural em português moderno e comunica a ideia de ocupar alguém no trabalho.
- source_word: ἵνα μὴ ἀργῇ
  choice: para que não fique ocioso
  rationale: ἵνα introduz finalidade, enquanto ἀργῇ indica estar sem atividade. A formulação preserva o propósito e evita o sentido moral mais forte de “preguiçoso”.
