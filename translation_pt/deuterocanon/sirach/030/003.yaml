  text: He who instructs his son will provoke the enemy to jealousy[a], and in the presence of friends he will rejoice over him.
translation:
  language: pt
  text: Quem instrui seu filho provocará inveja no inimigo[a] e, na presença de amigos, se alegrará por causa dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “despertará ciúme no inimigo”. O verbo grego pode indicar provocar ciúme ou inveja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  choice: Quem instrui
  rationale: O particípio presente substantivado descreve aquele que instrui de modo contínuo; “instrui” é natural no contexto da formação dada pelo pai.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu filho
  rationale: Preserva o masculino singular explícito do grego.
- source_word: παραζηλώσει
  choice: provocará inveja
  rationale: O verbo pode indicar provocar ciúme ou inveja; diante de “o inimigo”, “provocará inveja” expressa naturalmente a ideia sem eliminar a alternativa lexical.
- source_word: τὸν ἐχθρόν
  choice: no inimigo
  rationale: Mantém o singular representativo com artigo e integra o objeto à construção idiomática portuguesa “provocar inveja em alguém”.
- source_word: ἔναντι φίλων
  choice: na presença dos amigos
  rationale: Expressa claramente o sentido espacial e social de ἔναντι, isto é, diante de amigos.
- source_word: ἐπʼ αὐτῷ
  choice: por causa dele
  rationale: Com ἀγαλλιάσεται, a expressão indica naturalmente a causa ou ocasião da alegria; o pronome retoma o filho.
- source_word: ἀγαλλιάσεται
  choice: se alegrará
  rationale: Comunica a alegria intensa do verbo em português atual e digno, sem recorrer a formulação arcaica.
