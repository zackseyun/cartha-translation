  text: On the day your life's days are completed, and at the time of your death, distribute your inheritance.
translation:
  language: pt
  text: No dia em que se completarem os dias da sua vida[a], e no momento da sua morte, distribua a sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia da conclusão dos dias da sua vida”. A expressão grega é compacta e pode ser traduzida mais literalmente dessa maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: No dia
  rationale: A construção temporal com ἐν é expressa naturalmente em português por “no dia”.
- source_word: συντελείας
  choice: se completarem
  rationale: O substantivo indica conclusão ou chegada ao fim; a forma verbal torna a frase natural sem perder a ideia de plena conclusão.
- source_word: ἡμερῶν ζωῆς σου
  choice: os dias da sua vida
  rationale: Reproduz com clareza e naturalidade a construção genitiva grega, sem o artificialismo de uma formulação como “os dias de vida seus”.
- source_word: καιρῷ τελευτῆς
  choice: no momento da sua morte
  rationale: τελευτή pode indicar fim ou morte; neste contexto de disposição da herança, “morte” comunica o sentido mais provável, enquanto “momento” representa naturalmente καιρός.
- source_word: διάδος
  choice: distribua
  rationale: O imperativo aoristo ordena um ato definido de dar ou repartir; “distribua” se ajusta ao contexto patrimonial.
- source_word: κληρονομίαν
  choice: a sua herança
  rationale: “Herança” é o equivalente português direto; o possessivo, implícito no contexto, esclarece que se trata do patrimônio da pessoa interpelada.
theological_decisions:
- issue: Força ética da instrução sobre a herança
  choice: Uma instrução prática de sabedoria para dispor da própria herança ao fim da vida.
  alternative: Uma exortação geral à generosidade antes da morte.
  rationale: A associação explícita entre morte e herança favorece o sentido patrimonial concreto. A tradução não acrescenta estruturas jurídicas posteriores nem amplia o texto para uma afirmação doutrinária geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “dia” e “dias” foi mantida por refletir a formulação grega; a nota registra sua construção compacta. O tratamento com “sua” evita regionalizar excessivamente o texto.
