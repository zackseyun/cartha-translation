  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: pt
  text: Quem disciplina seu filho receberá benefício dele e, entre seus conhecidos, se gloriará por causa dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: Quem disciplina
  rationale: παιδεύω abrange formação, instrução e correção. “Disciplina” preserva tanto o aspecto formativo quanto o corretivo sem restringir o sentido a castigo.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu filho
  rationale: O grego emprega o masculino singular específico, “filho”, que é mantido.
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  choice: receberá benefício dele
  rationale: O futuro médio indica obter benefício ou vantagem, e a expressão preposicional apresenta o filho como fonte desse benefício. A formulação evita o possível tom explorador de “tirará proveito dele”.
- source_word: ἀνὰ μέσον γνωρίμων
  choice: entre seus conhecidos
  rationale: γνωρίμων designa pessoas conhecidas ou do círculo de convivência, sem necessariamente implicar a intimidade de amigos.
- source_word: καυχήσεται ἐπʼ αὐτῷ
  choice: se gloriará por causa dele
  rationale: καυχάομαι expressa gloriar-se ou vangloriar-se, enquanto ἐπʼ αὐτῷ indica que o filho é o motivo. “Se gloriará” preserva o sentido direto sem impor uma avaliação moral negativa.
theological_decisions:
- issue: Valor moral de o pai gloriar-se
  choice: se gloriará
  alternative: terá orgulho
  rationale: O texto descreve a honra social decorrente de um filho disciplinado, mas não qualifica explicitamente esse ato como virtuoso ou pecaminoso. A tradução conserva essa tensão em vez de suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura acessível no Brasil e em outros contextos lusófonos. Mantém o paralelismo das duas orações e a referência masculina específica do original.
