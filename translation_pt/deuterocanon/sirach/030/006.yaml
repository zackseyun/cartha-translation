  text: Before enemies he left behind an avenger[a], and for friends one who repays kindness.
translation:
  language: pt
  text: Diante dos inimigos, deixou um vingador[a] e, para os amigos, alguém que retribui a bondade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguém que faz justiça” ou “um defensor”; o termo grego pode designar quem exige justiça ou exerce vingança em favor de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναντίον
  choice: Diante de
  rationale: Expressa a posição do filho perante os inimigos, preservando tanto a ideia de presença quanto o caráter de confronto, sem tornar a preposição simplesmente equivalente a “contra”.
- source_word: ἐχθρῶν
  choice: inimigos
  rationale: Equivalente corrente e claro para o genitivo plural, adequado ao contexto de continuidade familiar.
- source_word: κατέλιπεν
  choice: deixou
  rationale: No contexto, refere-se ao filho que permanece depois do pai. “Deixou” é natural em português e, com o complemento, comunica essa sucessão sem explicitação excessiva.
- source_word: ἔκδικον
  choice: um vingador
  rationale: Preserva a força do termo grego para alguém que exige justiça ou exerce vingança em favor de outro. A nota registra alternativas menos retaliatórias.
- source_word: τοῖς φίλοις
  choice: para os amigos
  rationale: Traduz naturalmente o dativo relacional e estabelece o contraste com os inimigos.
- source_word: ἀνταποδιδόντα
  choice: alguém que retribui
  rationale: O particípio indica uma resposta recíproca ao bem recebido; “retribui” é corrente e mantém essa reciprocidade.
- source_word: χάριν
  choice: a bondade
  rationale: Neste contexto interpessoal, designa o favor ou bem recebido e posteriormente retribuído. “Bondade” evita a conotação teológica que “graça” poderia adquirir.
theological_decisions:
- issue: Valor moral de ἔκδικον no contexto sapiencial de honra familiar
  choice: um vingador
  alternative: um defensor; alguém que faz justiça
  rationale: O grego apresenta o filho como aquele que responde aos inimigos em favor do pai, sem avaliar expressamente a retaliação. A tradução conserva essa tensão em vez de suavizá-la como mera proteção.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura paralela entre inimigos e amigos foi preservada; “alguém” explicita apenas o referente pessoal já inerente ao particípio grego.
