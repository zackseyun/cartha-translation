  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
translation:
  language: pt
  text: O jugo e a correia dobrarão o pescoço; para o escravo perverso[a], cavaletes de tortura e tormentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo doméstico”. O termo grego pode designar alguém pertencente ao serviço de uma casa; neste contexto, “escravo” ressalta a sujeição coerciva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγὸς
  choice: jugo
  rationale: Preserva a imagem concreta de um jugo colocado sobre o pescoço, e não o sentido possível de instrumento de pesagem.
- source_word: ἱμὰς
  choice: correia
  rationale: Designa uma tira de couro usada para prender ou dominar; “correia” é clara e combina naturalmente com “jugo”.
- source_word: κάμψουσιν
  choice: dobrarão
  rationale: Reproduz o futuro e a ação física de curvar ou fazer dobrar, sem explicitar mais coerção do que o grego expressa.
- source_word: τράχηλον
  choice: o pescoço
  rationale: O artigo definido soa natural em português numa afirmação proverbial sobre o efeito do jugo e da correia.
- source_word: οἰκέτῃ
  choice: escravo
  rationale: Embora o termo possa indicar um servo doméstico, o contexto de sujeição coerciva e castigo torna “escravo” a forma mais adequada para preservar a realidade social.
- source_word: κακούργῳ
  choice: perverso
  rationale: Mantém a caracterização moral ampla do termo, sem restringi-lo ao sentido jurídico de “criminoso”.
- source_word: στρέβλαι
  choice: cavaletes de tortura
  rationale: O termo se refere a instrumentos que torciam o corpo; a expressão comunica concretamente essa forma de suplício ao leitor moderno.
- source_word: βάσανοι
  choice: tormentos
  rationale: Expressa sofrimento severo infligido como tortura e evita uma repetição pesada de “tortura” logo após “cavaletes de tortura”.
theological_decisions:
- issue: Tradução da terminologia de condição servil num contexto sapiencial
  choice: escravo
  alternative: servo doméstico
  rationale: A referência a contenção física e instrumentos de tortura torna evidente a condição coerciva; “escravo” evita suavizar essa realidade, enquanto a nota preserva a amplitude lexical de οἰκέτης.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo nominal da segunda oração foi preservado sem acrescentar um verbo ausente do grego; o ponto e vírgula torna clara a mudança entre as duas imagens.
