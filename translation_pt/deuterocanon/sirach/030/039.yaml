  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a slave, let him be like yourself, because you acquired him with blood; if you have a slave, lead him as yourself, because you need him as your own life.
translation:
  language: pt
  text: Se você tem um escravo, que ele seja como você, pois foi com sangue que você o adquiriu.[a] Se você tem um escravo, conduza-o como a si mesmo, pois precisará dele como da sua própria vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em sangue”; o sentido preciso da expressão não é explicado no texto grego.
    reason: Sinalizar uma expressão incomum e preservar sua ambiguidade.
  - marker: b
    text: Literalmente, “conduza-o como a si mesmo”. O verbo grego também pode ter, conforme o contexto, a ideia de tratar ou lidar com alguém. “Vida” traduz ψυχή, que também pode significar “alma” ou a própria pessoa.
    reason: Preservar o verbo de condução do grego e registrar tanto sua possível extensão contextual quanto a amplitude semântica de ψυχή.
lexical_decisions:
- source_word: οἰκέτης
  choice: escravo
  rationale: O termo designa aqui uma pessoa escravizada pertencente à casa; “escravo” comunica com clareza a realidade social do texto, enquanto “servo” poderia suavizá-la indevidamente.
- source_word: ἐν αἵματι
  choice: com sangue
  rationale: Mantém a formulação concreta e incomum do grego sem decidir uma referência específica que o texto não explicita.
- source_word: ἄγε
  choice: trate-o
  rationale: Embora o verbo tenha como sentido básico “conduzir”, neste contexto rege a maneira de lidar com a pessoa; “trate-o” expressa isso de modo natural em português.
- source_word: ψυχή
  choice: vida
  rationale: No contexto, ψυχή indica a própria vida ou existência, não necessariamente a “alma” em sentido técnico.
theological_decisions:
- issue: A relação ética entre senhor e escravo
  choice: “que ele seja como você” e “trate-o como a si mesmo”
  alternative: “que ele seja igual a você”
  rationale: A tradução conserva a comparação do grego sem transformá-la numa afirmação mais explícita de igualdade jurídica ou social, nem enfraquecer sua exigência ética.
- issue: Sentido da aquisição “com sangue”
  choice: preservar literalmente a expressão
  alternative: explicá-la como aquisição por alto preço ou por parentesco
  rationale: O grego é conciso e ambíguo; a tradução não impõe uma interpretação histórica ou teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A repetição “Se você tem um escravo” foi mantida por corresponder à estrutura enfática do grego.
