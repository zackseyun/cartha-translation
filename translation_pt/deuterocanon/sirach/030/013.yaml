  text: Discipline your son and make his yoke heavy[a], lest in his foolishness he consume you.
translation:
  language: pt
  text: Discipline seu filho e torne pesado o seu jugo,[a] para que ele não o consuma em sua insensatez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Discipline seu filho e trabalhe nele, para que ele não tropece por causa da sua própria desonra.” O hebraico diz: “para que ele não o consuma em sua insensatez”.'
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: Discipline
  rationale: O verbo hebraico abrange correção e formação. “Discipline” preserva ambas as ideias em português atual e corresponde também ao sentido do paralelo grego παιδεύσον.
- source_word: והכבד עולו
  choice: torne pesado o jugo dele
  rationale: Mantém a imagem concreta do hebraico, literalmente “torne pesado o seu jugo”, sem reduzi-la à ideia genérica de impor uma carga.
- source_word: באולתו
  choice: em sua insensatez
  rationale: אולת indica insensatez ou falta de juízo. A formulação conserva a construção circunstancial do hebraico e evita resolver além do texto como essa conduta causa o dano.
- source_word: יבלע בך
  choice: ele não consuma você
  rationale: בלע significa literalmente engolir ou consumir. Aqui a imagem aponta para arruinar ou destruir o pai; “consuma” mantém sua força metafórica sem explicá-la em excesso.
theological_decisions:
- issue: Divergência entre o hebraico e o paralelo grego na advertência final
  choice: 'Seguir o hebraico preservado: “para que, em sua insensatez, ele não consuma você”'
  alternative: 'Seguir o grego: “para que ele não tropece por causa da sua desonra”'
  rationale: Como o texto hebraico está preservado com alta confiança, ele permanece primário. A divergência substancial do grego é registrada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Preserva-se a metáfora sapiencial do jugo e a aspereza deliberada da advertência hebraica.
