  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
translation:
  language: pt
  text: A inveja e a ira[a] encurtam os dias, e a preocupação faz envelhecer antes do tempo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico דין é difícil neste contexto. Pode significar “ira” ou, menos provavelmente, “contenda”, “conflito” ou “juízo”.
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido como paralelo não corresponde a este versículo e parece pertencer a outra passagem; por isso, a tradução segue o testemunho hebraico.
    reason: textual_variant
lexical_decisions:
- source_word: קנאה
  choice: inveja
  rationale: Neste dito sapiencial, designa uma disposição corrosiva; “inveja” é natural em português e se ajusta melhor ao contexto negativo do que “zelo”.
- source_word: דין
  choice: ira
  rationale: Embora o termo normalmente se relacione a juízo, aqui parece indicar uma disposição hostil ou contenciosa. “Ira” expressa com clareza essa leitura, sem ocultar em nota a dificuldade lexical.
- source_word: יקצרו ימים
  choice: encurtam os dias
  rationale: Preserva o idioma hebraico de modo claro e digno, comunicando a ideia de abreviar a vida.
- source_word: ובלא עת
  choice: antes do tempo
  rationale: Expressa naturalmente em português a ocorrência prematura indicada pelo hebraico.
- source_word: תזקין
  choice: faz envelhecer
  rationale: A construção causativa em português transmite bem que a preocupação provoca envelhecimento prematuro.
- source_word: דאגה
  choice: preocupação
  rationale: O substantivo indica cuidado inquietante ou ansiedade; “preocupação” é corrente, acessível e adequado ao paralelismo sapiencial.
