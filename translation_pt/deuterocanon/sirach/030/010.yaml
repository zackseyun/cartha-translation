translation:
  language: pt
  text: Não ria junto com ele[a], para não sofrer com ele; no fim, você rangerá os dentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não ria com ele”. O verbo grego sugere juntar-se ao riso de alguém; no contexto, isso pode indicar indulgência ou conivência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγελάσῃς
  choice: ria com ele
  rationale: O verbo composto indica participar do riso de outra pessoa. “Rir com ele” é direto e natural em português, e o contexto comunica a ideia de conivência indulgente.
- source_word: συνοδυνηθῇς
  choice: venha a sofrer com ele
  rationale: O composto expressa sofrer ou sentir dor juntamente com alguém. A formulação preserva tanto a participação no sofrimento quanto o valor preventivo de ἵνα μή.
- source_word: ἐπʼ ἐσχάτῳ
  choice: no fim
  rationale: A expressão aponta para o desfecho posterior da conduta e é vertida de modo conciso e idiomático.
- source_word: γομφιάσεις
  choice: você rangerá
  rationale: Com “os dentes” como objeto, o verbo descreve o ato de ranger ou apertar os dentes, associado aqui à aflição ou ao arrependimento.
- source_word: τοὺς ὀδόντας σου
  choice: os dentes
  rationale: Objeto direto da expressão idiomática; em português, o possessivo pode ser naturalmente omitido porque a referência ao sujeito já é inequívoca.
