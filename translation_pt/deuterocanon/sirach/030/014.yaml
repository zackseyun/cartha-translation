review_pass:
  verdict: revise
  source_fidelity: A estrutura comparativa e o contraste entre pobreza e aflição corporal são bem preservados. Contudo, “tem vida em si mesmo” pode sugerir vida inerente ou autossuficiência, sentidos que o provérbio não requer. “Está vivo” comunica com clareza o predicado hebraico חי; a nota pode conservar a expressão literal e registrar a ampliação do paralelo grego.
  naturalness: “Melhor é o pobre...” tem registro proverbial natural. A substituição de “tem vida em si mesmo” por “está vivo” elimina uma formulação pouco idiomática e uma possível conotação teológica indevida.
  terminology: “Pobre”, “rico” e “carne” preservam adequadamente os termos e o registro. “Atingido em sua carne” mantém a indeterminação de ונגע sem importar o sentido mais específico de “açoitado” do grego.
  issues:
  - severity: medium
    issue: “Tem vida em si mesmo” é ambíguo de modo potencialmente enganoso em português moderno.
    rationale: A expressão pode ser entendida como possuir vida em si de maneira inerente, em vez de simplesmente estar vivo ou ter vitalidade. O hebraico é conciso e seu elemento reflexivo é difícil; não é seguro transformar isso em uma afirmação de vida inerente.
