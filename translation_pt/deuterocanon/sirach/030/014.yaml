  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
translation:
  language: pt
  text: Melhor é o pobre que está vivo do que o rico atingido em sua carne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Melhor é um pobre, saudável e forte de constituição, do que um rico açoitado em seu corpo”. O testemunho hebraico é mais breve e diz literalmente: “vivo em si mesmo” e “atingido em sua carne”.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Melhor é
  rationale: Expressa o valor comparativo típico da literatura sapiencial, confirmado pelo grego κρείσσων.
- source_word: מסכן
  choice: o pobre
  rationale: Mantém o substantivo masculino singular e o contraste proverbial com o rico, sem intensificar indevidamente para “indigente”.
- source_word: וחי בעצמו
  choice: que tem vida em si mesmo
  rationale: Conserva o sentido direto de חי e a expressão reflexiva בעצמו, mas evita a formulação pouco natural “vivo em si mesmo”. A nota registra a interpretação corporal mais explícita do paralelo grego.
- source_word: מעשיר
  choice: do que o rico
  rationale: Explicita em português a comparação implícita e preserva o contraste singular entre pobre e rico.
- source_word: ונגע
  choice: atingido
  rationale: Comunica a ideia de alguém acometido ou ferido por uma aflição sem definir sua causa; é menos arcaico que “ferido” em certos usos e menos específico que o grego “açoitado”.
- source_word: בבשרו
  choice: em sua carne
  rationale: Preserva a concretude de בשר e o foco corporal do hebraico, em vez de generalizar para “saúde”.
theological_decisions:
- issue: Contraste entre condição econômica e condição corporal
  choice: Preservar “em sua carne” e a formulação hebraica “tem vida em si mesmo”.
  alternative: Traduzir de modo interpretativo como “saudável e forte de constituição”.
  rationale: O hebraico é mais breve e menos explícito que o grego. A tradução principal mantém essa tensão textual, enquanto a nota fornece o paralelo grego sem fundi-lo ao hebraico.
- issue: Masculino singular representativo no provérbio
  choice: Usar “o pobre” e “o rico”.
  alternative: Usar “a pessoa pobre” e “a pessoa rica”.
  rationale: As formas masculinas singulares estruturam o contraste proverbial no texto-fonte; preservá-las é natural em português e não acrescenta uma restrição doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem proverbial natural. “Tem vida em si mesmo” busca equilibrar a literalidade da expressão hebraica com a legibilidade; a variante grega mais explícita fica na nota.
