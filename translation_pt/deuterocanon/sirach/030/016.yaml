translation:
  language: pt
  text: Não há riqueza maior do que um corpo saudável[a], nem bem maior do que um coração alegre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é condensada e pode indicar a integridade ou o vigor do corpo; o paralelo grego traz “saúde do corpo”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “bem” ou “bondade do coração”; o paralelo grego traz “alegria do coração”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין עֹשֶׁר עַל עֹשֶׁר
  choice: Não há riqueza maior do que
  rationale: A construção comparativa אֵין ... עַל indica que nenhuma riqueza supera a mencionada. A formulação mantém o substantivo “riqueza” e expressa a comparação com naturalidade em português; o grego βελτίων confirma o valor comparativo.
- source_word: שַׂר עֶצֶם
  choice: um corpo saudável
  rationale: A expressão hebraica é condensada e de leitura idiomática, apontando para vigor ou integridade corporal. O paralelo grego ὑγείας σώματος, “saúde do corpo”, confirma esse sentido. “Um corpo saudável” é claro e preserva a imagem corporal.
- source_word: אֵין טוֹבָה עַל
  choice: nem bem maior do que
  rationale: Repete-se a estrutura comparativa do primeiro segmento. “Nem bem maior do que” conserva o paralelismo, mantém טוֹבָה como substantivo e liga naturalmente as duas orações.
- source_word: טוּב לֵבָב
  choice: um coração alegre
  rationale: Literalmente, a expressão pode ser entendida como “bondade/bem-estar do coração”; no contexto, designa contentamento interior. O grego χαρὰν καρδίας, “alegria do coração”, apoia o sentido afetivo, enquanto “coração alegre” retém a forma antropológica hebraica.
