base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
translation:
  language: pt
  text: Curva-lhe a cabeça enquanto é jovem e quebra-lhe os lombos[a] enquanto ainda é pequeno, para que não se endureça[b], se rebele contra ti e dele resulte angústia de alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “quebra-lhe os lombos”; o paralelo grego diz “esmaga-lhe os lados” ou “as costelas”.
    reason: textual_variant
  - marker: b
    text: A expressão hebraica é de leitura difícil; o paralelo grego traz mais claramente “para que não se endureça”.
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: Curva-lhe a cabeça
  rationale: כוף expressa a ação de curvar ou subjugar, e ראשו significa literalmente “a cabeça dele”. A formulação conserva a metáfora corporal do hebraico sem convertê-la em uma abstração como “disciplina-o”.
- source_word: בנערותו
  choice: enquanto é jovem
  rationale: Expressa de modo claro e natural a referência temporal à juventude.
- source_word: ובקע מתניו
  choice: e quebra-lhe os lombos
  rationale: בקע é um verbo forte, “fender/romper”, e מתנים designa os lombos ou a região dos quadris. “Quebra-lhe os lombos” preserva deliberadamente a severidade da imagem hebraica; a variante grega é registrada em nota.
- source_word: כשהוא קטן
  choice: enquanto ainda é pequeno
  rationale: Mantém o sentido concreto de pouca idade e distingue esta expressão da referência anterior, mais ampla, à juventude.
- source_word: למה ישקה
  choice: para que não se endureça
  rationale: A leitura hebraica é difícil. O sentido de endurecimento é apoiado com maior clareza pelo grego σκληρυνθείς e se ajusta ao contexto de resistência à autoridade.
- source_word: ומרה בך
  choice: se rebele contra ti
  rationale: O hebraico exprime rebeldia dirigida contra alguém; a tradução conserva essa ideia explícita, também apoiada pelo grego ἀπειθήσῃ σοι.
- source_word: ונולד ממנו מפח נפש
  choice: e dele nasça angústia de alma
  rationale: A construção preserva a imagem hebraica de algo que “nasce” dele e mantém נפש como “alma”, comunicando sofrimento interior profundo.
theological_decisions:
- issue: Imagem severa de castigo corporal na instrução sapiencial
  choice: Conservar as metáforas corporais concretas e fortes no texto principal.
  alternative: Abrandar a passagem para “disciplina-o com rigor”.
  rationale: Tanto o testemunho hebraico quanto o paralelo grego empregam imagens físicas severas. A tradução não deve ocultar essa tensão ética nem transformar a linguagem antiga em uma formulação doutrinária ou moral moderna.
- issue: Presença da rebeldia contra o pai ou responsável
  choice: Traduzir ומרה בך explicitamente como “se rebele contra ti”.
  alternative: Omitir a expressão e ligar diretamente o endurecimento à angústia.
  rationale: As palavras estão presentes no testemunho hebraico fornecido e encontram apoio semântico no paralelo grego. Sua inclusão segue a primazia da fonte original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi tornada natural sem suavizar a retórica corporal do original. Os pronomes em “lhe” e “ti” mantêm clareza e solenidade moderada, sem arcaísmo excessivo.
