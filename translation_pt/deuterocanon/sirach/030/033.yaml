  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a slave.
translation:
  language: pt
  text: Forragem, vara e cargas[a] são para o jumento; pão, disciplina[c] e trabalho são para o escravo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fardos».
    reason: lexical_alternative
  - marker: b
    text: Ou «servo» ou «servo doméstico»; o grego οἰκέτης muitas vezes se refere a um escravo doméstico.
    reason: alternative_reading
  - marker: c
    text: «Disciplina» também pode ser entendida como «treinamento», «formação» ou «correção».
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: forragem
  rationale: Designa alimento dado a animais; «forragem» preserva a imagem concreta e o tom proverbial.
- source_word: ῥάβδος
  choice: vara
  rationale: Neste contexto, indica um instrumento de condução ou correção; «vara» é corrente e mantém essa função.
- source_word: φορτία
  choice: cargas
  rationale: Refere-se ao que é posto sobre um animal para ser transportado. «Cargas» é direto e natural; «fardos» também seria possível.
- source_word: ὄνῳ
  choice: jumento
  rationale: Equivalente atual e amplamente compreensível para o animal mencionado, apropriado ao contexto de carga.
- source_word: ἄρτος
  choice: pão
  rationale: Traduz de modo concreto o termo grego, sem generalizá-lo desnecessariamente como «alimento».
- source_word: παιδεία
  choice: disciplina
  rationale: O termo abrange formação, treinamento e correção. «Disciplina» conserva essa amplitude razoavelmente bem e se ajusta ao paralelismo do provérbio.
- source_word: ἔργον
  choice: trabalho
  rationale: Tradução simples e direta, adequada ao contexto doméstico e ao estilo conciso.
- source_word: οἰκέτῃ
  choice: escravo
  rationale: Embora possa designar um servo da casa, o termo frequentemente se refere a uma pessoa em condição servil doméstica. «Escravo» torna explícita a condição social implicada pelo pão, pela disciplina e pelo trabalho impostos.
theological_decisions:
- issue: Condição social expressa por οἰκέτῃ
  choice: escravo
  alternative: servo ou servo doméstico
  rationale: O contexto destaca subordinação e trabalho imposto. «Escravo» evita suavizar a realidade social, enquanto a nota registra a extensão lexical do termo.
- issue: Amplitude semântica de παιδεία
  choice: disciplina
  alternative: treinamento, formação ou correção
  rationale: 'O grego não se limita a punição: pode incluir educação e treinamento. «Disciplina» funciona no contexto, e a nota preserva a amplitude sem resolver indevidamente a nuance.'
translation_notes:
  register: Construção proverbial breve e sem verbo, acompanhando a concisão do grego. O vocabulário é atual, digno e amplamente compreensível em português, com boa legibilidade brasileira.
