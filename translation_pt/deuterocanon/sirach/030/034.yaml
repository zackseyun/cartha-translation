  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: pt
  text: Põe-no a trabalhar enquanto ainda é menino, e encontrarás descanso; solta-lhe as mãos[a], e ele buscará liberdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «afrouxa-lhe o controle». A expressão pode referir-se a relaxar a disciplina ou a supervisão sobre ele.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «liberdade» refere-se a livrar-se de restrições ou da disciplina, não à liberdade política.
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Põe-no para trabalhar enquanto ainda é menino
  rationale: A expressão é concisa e elíptica. No contexto de instrução e disciplina, comunica a ideia de ocupar o menino com trabalho ou atividade disciplinada durante a infância. A formulação preserva o referente masculino singular do grego.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: encontrarás descanso
  rationale: Mantém de perto o sentido comum de ἀνάπαυσις como descanso ou alívio e conserva a forma proverbial da consequência.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: deixa as mãos dele sem ocupação
  rationale: ἄνες pode significar soltar, afrouxar ou deixar livre. A imagem das mãos representa o trabalho ou a atividade; a tradução explicita esse valor contextual sem eliminar a imagem corporal.
- source_word: ζητήσει ἐλευθερίαν
  choice: ele buscará liberdade
  rationale: Preserva o sentido literal de ἐλευθερία e a tensão do provérbio. O contexto indica liberdade em relação à disciplina, e não liberdade política.
theological_decisions:
- issue: Referência masculina singular na instrução sapiencial
  choice: Manter «-no», «menino», «dele» e «ele»
  alternative: Generalizar como «uma criança» com referência neutra ou plural
  rationale: O grego apresenta παιδί no singular e retoma o referente com αὐτῷ e um sujeito singular implícito. A tradução preserva a forma particular do texto sem a transformar em afirmação doutrinária sobre gênero.
- issue: Sentido ético de ἐλευθερία
  choice: Traduzir literalmente por «liberdade» e esclarecer o sentido contextual em nota
  alternative: Substituir no texto por «indisciplina», «independência» ou «libertinagem»
  rationale: Essas alternativas resolveriam de modo excessivo a formulação aberta do grego. «Liberdade» conserva a palavra e a tensão do original, enquanto a nota evita uma leitura política anacrônica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Emprega «menino» para preservar o masculino singular do grego e evita termos regionais. A construção proverbial e o paralelismo entre trabalho, descanso, ociosidade e liberdade foram mantidos.
