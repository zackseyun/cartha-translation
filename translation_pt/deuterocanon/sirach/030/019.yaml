base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/019.yaml
  text: What value is there in the idols of the nations[a], which neither eat nor smell?
translation:
  language: pt
  text: Que valor há nos ídolos das nações[a], que não comem nem sentem cheiro?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego acrescenta: “Assim é aquele que é afastado pelo Senhor.”'
    reason: Leitura adicional presente no paralelo grego, mas ausente do testemunho hebraico.
lexical_decisions:
- source_word: מה יעריכו
  choice: Que valor têm
  rationale: A expressão hebraica formula uma pergunta retórica sobre valor ou utilidade. A construção é natural em português e concorda com o paralelo grego τί συμφέρει, sem reduzir o sentido a uma avaliação monetária.
- source_word: לאלילי הגוים
  choice: os ídolos das nações
  rationale: Mantém a referência aos ídolos pertencentes às nações, evitando tanto o termo eclesiasticamente marcado “gentios” quanto a explicitação interpretativa “pagãos”.
- source_word: אשר לא יאכלון
  choice: que não comem
  rationale: Traduz diretamente a oração relativa que ressalta a incapacidade dos ídolos.
- source_word: ולא יריחון
  choice: nem sentem cheiro
  rationale: Expressa de modo claro e corrente o ato de perceber odores. Evita a possível leitura coloquial de “não cheiram” como “não exalam cheiro”.
theological_decisions:
- issue: Inclusão da continuação grega ausente do testemunho hebraico
  choice: Traduzir no texto principal apenas a frase preservada em hebraico
  alternative: 'Incluir no texto principal: “Assim é aquele que é expulso pelo Senhor.”'
  rationale: Como o hebraico está preservado neste versículo, ele rege o texto principal. A continuação do paralelo grego é uma variante significativa e, por isso, é registrada em nota, sem ser incorporada silenciosamente ao hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa conserva o caráter retórico do hebraico e a imagem sensorial sem acrescentar explicações ao texto.
