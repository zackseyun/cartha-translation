  naturalness: “Que valor há nos ídolos das nações?” é uma formulação portuguesa mais idiomática para a pergunta sobre valor ou proveito. “Não comem nem sentem cheiro” é clara e evita a ambiguidade de “não cheiram”, que pode significar não exalar odor.
