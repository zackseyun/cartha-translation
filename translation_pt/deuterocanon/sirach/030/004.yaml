base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: pt
  text: O pai dele morreu, mas foi como se não tivesse morrido, pois deixou, depois de si, alguém semelhante a ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deixou, depois de si, alguém semelhante a ele”. No contexto, trata-se de um descendente sobrevivente, provavelmente um filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: O verbo indica chegar ao fim e, neste contexto, refere-se claramente à morte. “Morreu” é direto, natural e preserva o aspecto pontual do aoristo.
- source_word: αὐτοῦ ὁ πατήρ
  choice: o pai dele
  rationale: A construção é possessiva. “O pai dele” evita a possível leitura de “seu pai” como referência ao interlocutor e mantém clareza em português corrente.
- source_word: ὡς οὐκ ἀπέθανεν
  choice: como se não tivesse morrido
  rationale: ὡς introduz uma comparação, não uma negação literal da morte. O mais-que-perfeito do subjuntivo expressa naturalmente essa situação contrária ao fato.
- source_word: ὅμοιον αὐτῷ
  choice: alguém semelhante a ele
  rationale: O adjetivo neutro singular é usado substantivamente e pressupõe uma pessoa, sem nomeá-la explicitamente como filho. A tradução conserva essa abertura lexical.
- source_word: κατέλιπεν
  choice: deixou
  rationale: Aqui o verbo descreve alguém que permanece após a morte do pai. “Deixou” comunica isso naturalmente sem acrescentar a ideia mais específica de herança ou legado.
- source_word: μετʼ αὐτόν
  choice: depois de si
  rationale: 'A expressão indica sequência temporal: essa pessoa permanece depois do pai. “Depois de si” conserva a referência ao sujeito e evita introduzir explicitamente a noção de sucessão.'
theological_decisions:
- issue: Se a pessoa deixada pelo pai deve ser identificada explicitamente como filho
  choice: alguém semelhante a ele
  alternative: um filho semelhante a ele
  rationale: O contexto mais amplo trata dos filhos e torna provável que se trate de um descendente, provavelmente um filho; contudo, esta oração emprega apenas ὅμοιον de modo substantivado, sem o substantivo “filho”. A tradução não especifica além do que o grego desta linha declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva a comparação enfática e não explicita “filho” no texto principal.
