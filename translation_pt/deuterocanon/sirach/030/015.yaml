  text: Life for the poor is better than refined gold[a], and a good spirit than pearls.
translation:
  language: pt
  text: A vida do pobre é melhor do que o ouro refinado[a], e um bom espírito, melhor do que pérolas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “A saúde e o bem-estar são melhores do que todo ouro, e um corpo vigoroso, do que riqueza incalculável.” O hebraico e o grego diferem consideravelmente neste ponto, o que sugere uma tradição textual variante ou corrupção no hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: חיי
  choice: A vida
  rationale: Forma construta de חַיִּים, usada aqui no sentido de “vida”; a formulação concisa conserva o caráter proverbial.
- source_word: שר
  choice: do pobre
  rationale: O testemunho hebraico traz שר, entendido no contexto como referência a uma pessoa pobre ou necessitada. A divergência do grego indica instabilidade textual, registrada em nota.
- source_word: איביתי
  choice: é melhor do que
  rationale: A forma hebraica é difícil, mas o paralelismo comparativo e o grego βελτίων...ἢ apoiam o sentido de superioridade ou preferência.
- source_word: מפז
  choice: o ouro refinado
  rationale: פז designa ouro fino, puro ou de alta qualidade; “ouro refinado” comunica claramente esse valor excepcional.
- source_word: ורוח טובה
  choice: e um bom espírito
  rationale: רוּחַ pode indicar espírito, disposição ou vigor interior. “Bom espírito” preserva essa amplitude sem reduzir a expressão apenas ao humor.
- source_word: מפנינים
  choice: melhor do que pérolas
  rationale: פנינים costuma designar pérolas ou outro artigo precioso semelhante. A repetição de “melhor do que” torna explícito em português o comparativo elíptico do segundo membro.
theological_decisions:
- issue: Divergência entre o testemunho hebraico preservado e o paralelo grego
  choice: 'O texto principal segue o hebraico: “A vida do pobre... e um bom espírito...”'
  alternative: 'O grego diz: “A saúde e o bem-estar são melhores do que todo ouro, e um corpo vigoroso, do que riqueza incalculável.”'
  rationale: Como o hebraico está preservado, ele orienta o texto principal. A diferença substancial do grego pode refletir outra tradição textual ou corrupção no hebraico sobrevivente; por isso, a leitura grega é apresentada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura proverbial concisa. A elipse comparativa do segundo membro foi levemente explicitada para soar natural e inequívoca em português.
