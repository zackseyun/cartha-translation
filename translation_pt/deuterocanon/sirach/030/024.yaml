base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/024.yaml
  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
translation:
  language: pt
  text: A alegria do coração é a vida de um homem, e a alegria de uma pessoa prolonga sua vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As últimas palavras hebraicas são difíceis. O texto transmitido diz literalmente algo como «alongou seu nariz/sua ira». O paralelo grego afirma que o ciúme e a ira diminuem os dias, apoiando aqui o sentido de «prolonga a vida».
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: a alegria do coração
  rationale: Reproduz naturalmente a construção hebraica «alegria do coração», mantendo o sentido interior e afetivo de לב.
- source_word: חיי איש
  choice: é a vida do homem
  rationale: חיים tem forma plural, mas aqui expressa a vida como realidade integral. איש é mantido como «homem», em paralelo proverbial.
- source_word: וגיל אדם
  choice: e o contentamento de uma pessoa
  rationale: גיל indica alegria ou regozijo; «contentamento» evita repetição pesada sem perder o sentido. אדם tem referência humana genérica e, por isso, é vertido como «uma pessoa».
- source_word: האריך אפו
  choice: prolonga sua vida
  rationale: O texto hebraico transmitido é difícil e, literalmente, parece dizer «alongou seu nariz/sua ira». O paralelo grego aponta para a duração dos dias; a tradução apresenta o provável sentido contextual em português natural.
theological_decisions:
- issue: Distinção antropológica entre איש e אדם
  choice: «homem» para איש e «uma pessoa» para אדם
  alternative: Traduzir ambos genericamente como «pessoa» ou ambos como «homem»
  rationale: 'A opção preserva a variação lexical hebraica: איש é mais especificamente «homem», enquanto אדם pode designar genericamente o ser humano.'
- issue: Formulação hebraica difícil no fim do versículo
  choice: Traduzir o provável sentido como «prolonga sua vida», com nota textual
  alternative: Traduzir literalmente «alongou seu nariz/sua ira»
  rationale: A leitura literal não produz sentido claro no contexto. O paralelo grego associa as disposições interiores à diminuição dos dias e sustenta indiretamente uma referência à duração da vida, mas a incerteza é explicitada na nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura proverbial concisa. A formulação conserva o paralelismo e evita resolver silenciosamente a dificuldade textual.
