  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: pt
  text: A morte é melhor do que uma vida vazia[a], e o descanso eterno é melhor do que uma dor persistente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “A morte é melhor do que uma vida amarga.” O hebraico traz “uma vida vazia”.'
    reason: alternative_reading
  - marker: b
    text: O paralelo grego traz “uma enfermidade persistente” onde o hebraico fala de uma “dor” que permanece.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: A morte é melhor
  rationale: A construção comparativa טוב ל־ tem sentido de superioridade; a formulação nominal preserva o caráter proverbial e é natural em português. O paralelo grego também traz um substantivo, θάνατος, e uma forma comparativa, κρείσσων.
- source_word: מחיי שוא
  choice: do que uma vida vazia
  rationale: חיי significa “vida” ou “modo de viver”, e שוא abrange vazio, vaidade, inutilidade e falta de valor. “Uma vida vazia” comunica o sentido hebraico em português corrente sem adotar a variante grega “vida amarga”.
- source_word: ונוחת עולם
  choice: e o descanso eterno é melhor
  rationale: נוחת designa descanso ou repouso, e עולם indica duração indefinida ou permanente. “Descanso eterno” conserva a força da expressão. A repetição de “é melhor” torna explícita em português a comparação elíptica do hebraico, sem acrescentar uma nova afirmação.
- source_word: מכאב נאמן
  choice: do que uma dor persistente
  rationale: כאב é “dor”; נאמן, literalmente firme, constante ou digno de confiança, qualifica aqui aquilo que permanece. “Dor persistente” preserva essa duração sem transformar o hebraico “dor” no grego “enfermidade”.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na primeira comparação
  choice: Seguir no texto principal o hebraico “uma vida vazia”
  alternative: “uma vida amarga”, conforme o paralelo grego
  rationale: O testemunho hebraico disponível é a fonte principal e tem alta confiança. A leitura grega é registrada em nota para manter transparente a tradição textual alternativa.
- issue: Força de עולם na expressão proverbial
  choice: “eterno”
  alternative: “perpétuo” ou “duradouro”
  rationale: “Eterno” transmite a duração plena da expressão sem definir além do texto a natureza desse descanso nem resolver sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura proverbial foi mantida, mas o verbo comparativo foi repetido na segunda oração para evitar uma elipse pouco natural em português.
