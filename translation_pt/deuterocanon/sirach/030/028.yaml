  text: Years of a glad heart are better than delicacies[b][a], and his food will agree with him.
translation:
  language: pt
  text: Anos de coração alegre valem mais do que iguarias[b][a], e o alimento lhe fará bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz: «Anos de coração bom em lugar de iguarias, e seu alimento subirá sobre ele». A segunda parte provavelmente indica que o alimento simples faz bem ou é bem digerido pela pessoa alegre.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego de Swete traz neste ponto um provérbio diferente: não se deve dar, enquanto se vive, autoridade sobre si mesmo ou sobre os próprios bens a filho, esposa, irmão ou amigo. O testemunho hebraico preserva, portanto, uma tradição textual substancialmente diferente.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: Anos de
  rationale: Preserva a imagem temporal do plural construto hebraico, sem a ampliar para «uma vida inteira».
- source_word: לב טוב
  choice: coração alegre
  rationale: No contexto sapiencial, a expressão aponta para bem-estar interior e alegria, não apenas para bondade moral.
- source_word: תחת
  choice: valem mais do que
  rationale: 'Explicita de modo natural a comparação implícita: anos vividos com alegria interior são preferíveis a alimentos requintados.'
- source_word: מטעמים
  choice: iguarias
  rationale: Designa pratos saborosos ou especiais e mantém um registro digno e corrente.
- source_word: ומאכלו
  choice: e o alimento
  rationale: O sufixo masculino singular vincula o alimento à pessoa de coração alegre; em português, o pronome possessivo pode ser omitido naturalmente sem perder a relação.
- source_word: יעלה עליו
  choice: lhe fará bem
  rationale: Comunica o provável sentido idiomático de o alimento ser benéfico ou cair bem, evitando reproduzir literalmente a expressão obscura «subirá sobre ele».
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Coração alegre» conserva a imagem sapiencial; «lhe fará bem» oferece uma equivalência idiomática clara sem ocultar, graças à nota, a formulação incomum do hebraico.
