  text: For anger has killed many[b][a], and there is no benefit in wrath.
translation:
  language: pt
  text: Pois a ira matou muitos[b], e não há proveito no furor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego fornecido para este versículo traz outra máxima: “Considerem que não trabalhei somente para mim, mas para todos os que buscam instrução”. Isso indica uma diferença de numeração dos versículos ou uma tradição textual divergente. A tradução principal segue o testemunho hebraico preservado.'
    reason: textual_variant
  - marker: b
    text: A forma da palavra hebraica traduzida por “ira” no primeiro membro é um tanto incerta; o sentido foi determinado pelo contexto e pelo paralelismo com “furor” no segundo membro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Pois
  rationale: Introduz a razão ou fundamento da advertência no contexto e mantém a concisão proverbial.
- source_word: רבים
  choice: muitos
  rationale: Preserva diretamente o alcance quantitativo amplo do hebraico.
- source_word: הרג
  choice: matou
  rationale: Traduz o verbo hebraico de matar; o pretérito perfeito é natural em português para uma constatação proverbial baseada na experiência.
- source_word: דין
  choice: ira
  rationale: Embora a forma hebraica seja incerta, o paralelismo com קצפון favorece uma emoção de indignação ou ira, não o sentido jurídico de “juízo”.
- source_word: ואין
  choice: e não há
  rationale: Reproduz a coordenação e a negação existencial do hebraico em português corrente.
- source_word: תעלה
  choice: proveito
  rationale: Expressa vantagem, benefício ou ganho e conserva o tom sapiencial conciso.
- source_word: בקצפון
  choice: no furor
  rationale: Mantém a preposição e traduz קצפון como ira intensa; “furor” evita repetição mecânica sem desfazer o paralelismo.
theological_decisions:
- issue: Uso do testemunho hebraico apesar da grande divergência em relação ao paralelo grego fornecido
  choice: Traduzir o hebraico preservado como texto principal e registrar a divergência em nota.
  alternative: 'Seguir o grego: “Considerem que não trabalhei somente para mim, mas para todos os que buscam instrução.”'
  rationale: O hebraico existente apresenta uma máxima sapiencial coerente e é a fonte primária indicada. O grego fornecido não corresponde ao conteúdo, provavelmente por divergência textual ou de numeração, e por isso não deve substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial concisa. “Ira” e “furor” preservam o paralelismo sem impor uma distinção teológica entre os termos.
