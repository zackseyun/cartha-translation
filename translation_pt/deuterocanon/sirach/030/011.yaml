  text: Do not give him free rein in his youth, and do not overlook his destructive behavior.
translation:
  language: pt
  text: Não lhe dê rédea solta enquanto for jovem,[a] nem faça vista grossa ao seu comportamento destrutivo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não lhe dê autoridade durante a juventude». O verbo hebraico pode significar conceder domínio ou controle; o paralelo grego diz: «não lhe dê autoridade na juventude».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «suas corrupções» ou «seus atos destrutivos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: lhe dê rédea solta
  rationale: O hifil de משל pode significar fazer governar ou conceder domínio/autoridade. No contexto da disciplina de um jovem, a expressão idiomática «dar rédea solta» comunica liberdade ou controle sem limites; o paralelo grego ἐξουσίαν confirma a ideia de autoridade ou licença.
- source_word: בנעוריו
  choice: enquanto for jovem
  rationale: Expressa naturalmente o valor temporal de «na sua juventude» em português atual.
- source_word: תשא
  choice: faça vista grossa
  rationale: נשא pode significar levantar, carregar ou suportar e, neste contexto, tolerar ou deixar passar faltas. «Fazer vista grossa» comunica claramente não ignorar nem desculpar a conduta, sem introduzir a carga teológica que «perdoar» poderia ter.
- source_word: לשחיתותיו
  choice: ao seu comportamento destrutivo
  rationale: שחיתותיו pode designar suas corrupções, atos corruptos ou ações destrutivas. A escolha preserva tanto a dimensão moral quanto o efeito nocivo da conduta em linguagem acessível.
