translation:
  language: pt
  text: Dê descanso à sua alma e alegre o seu coração[a]; mantenha a ira longe de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico deste versículo é difícil, sobretudo no verbo traduzido por “alegre”. Além disso, o texto grego preservado apresenta uma redação substancialmente diferente. A tradução segue o testemunho hebraico existente e entende o verbo pelo contexto.
    reason: textual_variant
lexical_decisions:
- source_word: פוג
  choice: Dê descanso
  rationale: O imperativo pode indicar afrouxar, aliviar ou fazer cessar. “Dê descanso” expressa de modo natural a ação benéfica dirigida à vida interior.
- source_word: נפשך
  choice: à sua alma
  rationale: נפש pode designar a vida, a pessoa ou o ser interior. “Alma” preserva o peso antropológico do hebraico sem exigir um dualismo técnico.
- source_word: ופיג
  choice: e alegre
  rationale: A forma hebraica é difícil. No paralelismo com “coração” e no contexto de afastar a ira, “alegre” comunica uma restauração positiva da disposição interior, sem ocultar a incerteza, registrada em nota.
- source_word: לבך
  choice: o seu coração
  rationale: לב é o centro interior do pensamento, da vontade e dos sentimentos; “coração” é a correspondência tradicional, clara e natural em português.
- source_word: וקצפון
  choice: a ira
  rationale: O substantivo indica ira ou indignação. “Ira” mantém o tom sapiencial e exortativo do texto com concisão.
- source_word: הרחק ממך
  choice: mantenha ... longe de você
  rationale: O imperativo pede distanciamento ativo. A formulação é idiomática em português e conserva a força da exortação.
theological_decisions:
- issue: Força antropológica de נפש
  choice: à sua alma
  alternative: à sua vida; a si mesmo
  rationale: A exortação sapiencial trata da pessoa interior. “Alma” preserva a amplitude do termo hebraico, mas não pretende definir uma separação metafísica rígida entre corpo e alma.
- issue: Linha hebraica difícil e paralelo grego substancialmente diferente
  choice: Traduzir prioritariamente o testemunho hebraico como exortação ao descanso interior, à alegria e ao afastamento da ira, assinalando a dificuldade textual em nota.
  alternative: 'Reproduzir literalmente o verbo obscuro; ou seguir o grego, que diz: “Também eu, o último, fiquei desperto, como quem recolhe espigas atrás dos vindimadores.”'
  rationale: O hebraico preservado deve orientar a tradução, enquanto o grego fornecido parece refletir um texto inteiramente diferente. A divergência relevante precisa ser informada, não harmonizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “seu/sua” evita formas marcadamente regionais; o ponto e vírgula conserva as duas partes coordenadas da exortação.
