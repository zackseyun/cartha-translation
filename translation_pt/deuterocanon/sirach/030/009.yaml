  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: pt
  text: Discipline seu filho[a], para que você não sofra vergonha; mas, se brincar com ele, ele humilhará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Cuide de uma criança, e ela deixará você espantado; brinque com ela, e ela entristecerá você.” O testemunho hebraico, porém, diz: “Discipline seu filho... ele humilhará você.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  choice: Discipline
  rationale: O hebraico indica instrução corretiva ou disciplina, não mero ensino verbal. “Discipline” preserva o sentido parental corretivo em português atual.
- source_word: בנך
  choice: seu filho
  rationale: O hebraico é explicitamente masculino singular; por isso, mantém-se “seu filho”, em vez de neutralizar como “sua criança”.
- source_word: לבל תבוש
  choice: para que você não passe vergonha
  rationale: A oração expressa finalidade preventiva. “Passar vergonha” comunica com naturalidade tanto a vergonha sofrida quanto sua dimensão social.
- source_word: תשחק עמו
  choice: brincar com ele
  rationale: O sentido direto de שׂחק é “brincar” ou “rir”; o grego σύνπαιξον também apoia “brincar com ele”. Evita-se explicitar “ser indulgente”, ideia possível no contexto, mas não lexicalizada diretamente.
- source_word: יכלימך
  choice: ele humilhará você
  rationale: O verbo כלם significa causar vergonha ou humilhar. “Humilhará você” conserva a força ativa da ação do filho e evita repetição exata com a oração anterior.
theological_decisions:
- issue: Preferência pelo hebraico quando o paralelo grego apresenta diferenças de nuance
  choice: Traduzir prioritariamente o testemunho hebraico preservado e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Cuide/mime uma criança, e ela deixará você espantado; brinque com ela, e ela entristecerá você.”'
  rationale: O testemunho hebraico tem alta confiança, é coerente e constitui a fonte primária neste trecho. O grego confirma a ideia de brincar no segundo membro, mas diverge no primeiro verbo e no resultado final; a diferença textual deve ser preservada, não harmonizada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Passe vergonha” é idiomático sem ser coloquial demais; “brincar com ele” mantém a imagem concreta e a possível tensão contextual. O marcador [a] aparece imediatamente após “filho”, onde sinaliza a divergência mais ampla do paralelo grego.
