base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/023.yaml
  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: pt
  text: Não entregue sua alma à tristeza[a][b], nem tropece em sua iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico לדין é difícil. O paralelo grego favorece o sentido de “tristeza” ou “pesar”; consideradas apenas as consoantes hebraicas, também seria possível entender “juízo”.
    reason: lexical_alternative
  - marker: b
    text: 'O testemunho grego é consideravelmente mais extenso: “Ame sua alma e console seu coração; afaste de você a tristeza, pois a tristeza matou a muitos e nela não há proveito.” O texto hebraico preservado é mais breve.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: Não entregue
  rationale: O verbo נתן, nesta construção, tem o sentido de entregar ou sujeitar algo a determinada condição. “Não entregue” conserva a imagem hebraica sem tornar a frase artificial em português.
- source_word: לדין
  choice: à tristeza
  rationale: A forma hebraica é difícil e, isoladamente, pode sugerir “juízo”; contudo, o paralelo grego emprega repetidamente λύπη, “tristeza, pesar”. “Tristeza” expressa de modo claro e natural a leitura contextual mais provável.
- source_word: נפשך
  choice: sua alma
  rationale: נפש pode designar alma, vida ou a própria pessoa. “Sua alma” preserva o termo antropológico do hebraico e corresponde ao grego ψυχή, permanecendo compreensível ao leitor moderno.
- source_word: ואל תכשל
  choice: nem tropece
  rationale: כשל descreve tropeçar, vacilar ou cair. “Nem tropece” mantém a metáfora moral e liga naturalmente a segunda advertência à primeira.
- source_word: בעונך
  choice: em sua iniquidade
  rationale: עון pode significar iniquidade, culpa ou consequência da transgressão. “Em sua iniquidade” conserva a amplitude moral e a estrutura concisa do hebraico.
theological_decisions:
- issue: Texto hebraico breve em contraste com o paralelo grego mais extenso
  choice: Traduzir no texto principal a linha hebraica preservada e usar o grego apenas para esclarecer o termo difícil לדין.
  alternative: 'Adotar no texto principal toda a forma grega: “Ame sua alma e console seu coração; afaste de você a tristeza, pois a tristeza matou a muitos e nela não há proveito.”'
  rationale: Como há texto hebraico disponível, ele permanece a fonte principal. A forma grega, embora substancialmente mais longa, oferece evidência útil para o sentido de לדין, mas sua expansão não deve ser incorporada silenciosamente ao texto hebraico.
- issue: Sentido de לדין
  choice: tristeza
  alternative: juízo
  rationale: A vocalização e o sentido do hebraico são incertos. O testemunho grego favorece fortemente o campo semântico de tristeza ou pesar, mas a alternativa mais literal é preservada em nota para não ocultar a dificuldade textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e o paralelismo das duas proibições hebraicas; “alma”, “tropece” e “iniquidade” preservam o peso poético e moral do original sem expansão interpretativa.
