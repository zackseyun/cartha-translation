lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Em tudo o que você fizer
  rationale: Expressa de modo natural e abrangente o sentido de “em todas as suas obras/ações”, sem restringir ἔργα a trabalhos ou realizações formais.
- source_word: γίνου ὑπεράγων
  choice: seja excelente
  rationale: O imperativo γίνου funciona como exortação à conduta, e ὑπεράγων indica sobressair ou exceder. “Seja excelente” é claro, atual e digno.
- source_word: μὴ δῷς μῶμον
  choice: não deixe que uma mancha recaia
  rationale: A formulação idiomática comunica a ideia de não ocasionar mancha ou censura, preservando a imagem metafórica de μῶμον.
- source_word: ἐν τῇ δόξῃ σου
  choice: sobre a sua honra
  rationale: Neste contexto sapiencial, δόξα se refere plausivelmente à honra ou reputação da pessoa; “honra” evita uma leitura teológica indevida de “glória”.
