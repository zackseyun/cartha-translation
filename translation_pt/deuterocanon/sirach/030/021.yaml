  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: pt
  text: Não olhe e gema[a], como um eunuco que abraça uma jovem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico, em forma de terceira pessoa, diz literalmente: “Ele vê com os olhos e geme, como um eunuco abraça uma jovem”. O paralelo grego traz: “Não entregue sua alma à tristeza e não aflija a si mesmo em seus planos”. A tradução conserva a imagem vívida do hebraico; a forma de advertência em segunda pessoa é apoiada pelo paralelo grego. O hebraico retrata o desejo frustrado, enquanto o grego expressa diretamente a advertência contra a tristeza autoinfligida.'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: fique olhando com os próprios olhos
  rationale: Preserva a ênfase visual do hebraico, embora a expressão seja incomum. O valor proibitivo e a referência direta ao leitor vêm do contexto sapiencial e são apoiados pelo imperativo negativo do paralelo grego.
- source_word: ומתאנח
  choice: e gemendo
  rationale: Expressa dor audível e intensa; “gemendo” comunica mais sofrimento que o mais brando “suspirando”.
- source_word: כאשר
  choice: como
  rationale: Introduz naturalmente a comparação em português.
- source_word: סריס
  choice: eunuco
  rationale: A imagem depende da incapacidade ou impossibilidade sexual, e não do possível sentido administrativo de oficial da corte.
- source_word: יחבק
  choice: que abraça
  rationale: Mantém o contato físico próximo indicado pelo verbo hebraico e soa natural dentro da comparação.
- source_word: נערה
  choice: uma jovem
  rationale: É uma forma moderna, digna e clara de designar uma mulher jovem, sem a conotação infantil de “menina” nem o tom arcaico de “donzela”.
theological_decisions:
- issue: Relação entre as formas hebraica e grega do versículo
  choice: Traduzir prioritariamente a imagem preservada em hebraico, usando o paralelo grego para apoiar a força proibitiva e a referência ao leitor.
  alternative: 'Traduzir apenas o grego: “Não entregue sua alma à tristeza e não aflija a si mesmo com seus próprios planos.”'
  rationale: O hebraico conserva a comparação vívida do desejo frustrado, enquanto o grego apresenta diretamente a exortação contra a tristeza autoinfligida. A tradução mantém a imagem hebraica sem ocultar a forma alternativa grega.
- issue: Pessoa gramatical do texto hebraico
  choice: Empregar a segunda pessoa em harmonia com a exortação contextual e com o paralelo grego.
  alternative: 'Manter literalmente a terceira pessoa: “Ele vê com os olhos e geme”.'
  rationale: A forma hebraica transmitida está na terceira pessoa, mas o grego se dirige explicitamente ao leitor. A nota registra a diferença para não apagar a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A locução “com os próprios olhos” retém uma ênfase deliberadamente concreta do hebraico; a nota esclarece a divergência textual e gramatical sem resolver silenciosamente a tensão.
