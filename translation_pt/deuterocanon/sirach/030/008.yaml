  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
translation:
  language: pt
  text: O cavalo não domado[a] acaba ficando obstinado, e o filho deixado sem limites acaba ficando voluntarioso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não amansado”. A expressão grega refere-se a um cavalo que não foi submetido à doma ou ao treinamento.
    reason: lexical_alternative
  - marker: b
    text: O adjetivo grego é raro; também pode ser traduzido como “teimoso”, “presunçoso” ou “rebelde”. No contexto, indica uma atitude impetuosa e não refreada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: cavalo
  rationale: É o equivalente comum e direto; o contexto não exige um termo mais elevado.
- source_word: ἀδάμαστος
  choice: não domado
  rationale: No contexto de um cavalo, indica que o animal ainda não foi submetido a doma ou treinamento; a expressão é clara e preserva a imagem concreta.
- source_word: ἀποβαίνει
  choice: acaba ficando
  rationale: Expressa o estado resultante de uma condição anterior e dá naturalidade proverbial ao português.
- source_word: σκληρός
  choice: obstinado
  rationale: Aqui o adjetivo descreve resistência comportamental, não dureza física. “Obstinado” comunica a dificuldade de conduzir o animal sem confundir o termo com o adjetivo aplicado ao filho.
- source_word: υἱός
  choice: filho
  rationale: Mantém o masculino singular específico do grego, sem generalizá-lo como “criança”.
- source_word: ἀνειμένος
  choice: deixado sem limites
  rationale: O particípio sugere alguém solto, não contido ou não refreado. A formulação comunica em português atual a falta de contenção educativa sem reduzir o sentido apenas à ausência de castigo.
- source_word: ἐκβαίνει
  choice: acaba ficando
  rationale: Assim como ἀποβαίνει no primeiro membro, indica o resultado produzido. A repetição conserva o paralelismo do provérbio.
- source_word: προαλής
  choice: voluntarioso
  rationale: O adjetivo é raro e parece descrever uma disposição desenfreada, autodecidida e impetuosa. “Voluntarioso” preserva esse sentido sem afirmar uma nuance mais precisa do que a evidência permite.
