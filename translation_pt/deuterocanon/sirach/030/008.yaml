  register: Português moderno, claro e proverbial, com paralelismo explícito entre as duas metades. “Acaba ficando” expressa naturalmente o resultado indicado pelos dois verbos gregos; “não domado” e “sem limites” mantêm a relação entre falta de treinamento e falta de contenção sem recorrer a linguagem denominacional.
