  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
translation:
  language: pt
  text: Pois é melhor que seus filhos lhe peçam do que você olhar para as mãos de seus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, depender de seus filhos para receber sustento. Literalmente, o grego diz: “olhar para as mãos de seus filhos”.'
    reason: Esclarece o sentido idiomático da imagem grega preservada no texto.
lexical_decisions:
- source_word: κρεῖσσον
  choice: melhor
  rationale: Equivalente comparativo direto e natural em português.
- source_word: τὰ τέκνα δεηθῆναί σου
  choice: que seus filhos lhe peçam
  rationale: δέομαι pode significar pedir, rogar ou suplicar. “Peçam” preserva a amplitude do verbo sem impor necessariamente mendicância; o pronome possessivo é exigido pelo σου.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: ficar olhando para as mãos
  rationale: Mantém a imagem concreta do grego e sugere a espera contínua por provisão; a nota esclarece o sentido idiomático.
- source_word: υἱῶν σου
  choice: seus filhos homens
  rationale: Distingue o termo específico υἱοί, “filhos homens”, do mais amplo τέκνα na primeira oração, embora a formulação seja menos fluida que o simples “filhos”.
theological_decisions:
- issue: Distinção entre τέκνα e υἱοί
  choice: filhos / filhos homens
  alternative: filhos / filhos
  rationale: O grego muda de um termo geral para outro especificamente masculino; a tradução torna essa distinção visível.
- issue: Imagem de dependência econômica
  choice: olhando para as mãos
  alternative: depender do sustento
  rationale: A expressão concreta foi preservada no texto, enquanto a implicação de dependência foi explicada em nota, sem substituir a metáfora por uma interpretação.
translation_notes:
  register: Português moderno, claro e digno. “Lhe peçam” evita a força possivelmente excessiva de “mendigarem”, enquanto “ficar olhando” comunica espera dependente. A expressão “filhos homens” é usada deliberadamente para preservar a diferença lexical entre τέκνα e υἱοί.
