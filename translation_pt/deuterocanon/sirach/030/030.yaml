  source_fidelity: A estrutura comparativa e a imagem de dependência estão essencialmente corretas. «Lhe peçam» é uma opção possível para δεηθῆναι, que pode significar pedir ou suplicar, sem exigir «mendigar». Contudo, «ficar olhando» introduz uma nuance durativa que o infinitivo grego ἐμβλέπειν não explicita. A nota pode esclarecer a implicação idiomática sem alterar a imagem no texto.
  naturalness: «Filhos homens» é compreensível, mas é pouco idiomático e pesado em português moderno. Como «filhos» normalmente pode designar especificamente descendentes masculinos conforme o contexto, a repetição de «filhos» é mais natural. A diferença lexical grega entre τέκνα e υἱοί não precisa ser reproduzida por uma construção artificial quando o português não oferece um contraste natural equivalente.
  terminology: «Melhor», «filhos», «mãos» e «sustento» são adequados. Mantém-se a metáfora concreta de olhar para as mãos dos filhos, e a nota explica, de modo não doutrinário, o sentido de dependência.
