base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: pt
  text: Ponha-o para trabalhar em tarefas adequadas a ele; e, se não obedecer, torne pesados os seus grilhões. Mas não seja excessivo com ninguém[a] e não faça nada sem discernimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com toda carne”, expressão de estilo semítico que aqui se refere aos seres humanos em geral.
    reason: Preserva a formulação lexical de σάρξ e esclarece seu sentido idiomático neste contexto.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Põe-o para trabalhar
  rationale: Expressa de modo natural o sentido causativo de καθίστημι com εἰς ἔργα e mantém a força do imperativo e o contexto de trabalho.
- source_word: καθὼς πρέπει αὐτῷ
  choice: no que lhe convém
  rationale: Transmite a ideia do que é apropriado ou adequado para ele, sem introduzir uma especificação ausente no grego.
- source_word: κἂν μὴ πειθαρχῇ
  choice: e, se não obedecer
  rationale: πειθαρχέω indica submissão à autoridade; “obedecer” preserva esse sentido sem acrescentar explicitamente “disciplina”, termo não expresso no texto.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: torna pesados os seus grilhões
  rationale: 'Segue de perto a imagem concreta do grego: βαρύνω significa tornar pesado, e πέδαι designa grilhões, especialmente os que prendem os pés.'
- source_word: μὴ περισσεύσῃς
  choice: não cometas excessos
  rationale: No contexto, o verbo adverte contra ultrapassar os limites. A formulação é clara e idiomática em português.
- source_word: ἐν πάσῃ σαρκί
  choice: contra ninguém
  rationale: A expressão semítica literal, “em/com toda carne”, refere-se aqui a qualquer ser humano. A tradução comunica naturalmente o referente, enquanto a nota preserva a imagem da fonte.
- source_word: ἄνευ κρίσεως
  choice: sem discernimento
  rationale: κρίσις pode indicar juízo, decisão ou discernimento. No contexto sapiencial, “discernimento” comunica a necessidade de agir após avaliação ponderada, sem restringir a expressão a um julgamento judicial.
- source_word: μὴ ποιήσῃς μηδέν
  choice: não faças nada
  rationale: Reproduz de forma direta e natural a proibição enfática do grego.
theological_decisions:
- issue: Sentido antropológico de σάρξ
  choice: ninguém, com nota sobre “carne”
  alternative: nenhuma carne / ser humano algum
  rationale: σάρξ não tem aqui o sentido paulino de natureza pecaminosa, mas integra uma expressão semítica para os seres humanos em geral. “Ninguém” evita em português a leitura equivocada de carne física ou alimento, e a nota conserva a metáfora e sua possível evocação da fragilidade humana.
- issue: Amplitude semântica de κρίσις
  choice: discernimento
  alternative: juízo
  rationale: A escolha se ajusta ao contexto de sabedoria prática, mas não transforma o termo em uma categoria técnica ou judicial.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos claros. A construção semítica mais opaca é vertida idiomaticamente no texto e documentada em nota; a dureza da imagem dos grilhões é preservada sem atenuação.
