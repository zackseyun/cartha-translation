  text: He who loves his son will continue the lash for him[b][a], so that he may rejoice in his final days.
translation:
  language: pt
  text: Quem ama seu filho persistirá em aplicar-lhe açoites,[a] para que se alegre em seu fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será assíduo nos açoites para com ele”. O verbo grego indica ação persistente ou diligente, e o substantivo pode significar “açoites”, “chicotadas” ou “flagelações”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em/sobre suas coisas finais”. A expressão pode referir-se ao desfecho, aos últimos anos ou ao fim; o pronome também pode ser entendido em relação ao pai ou ao filho.
    reason: ambiguity
lexical_decisions:
- source_word: Ὁ ἀγαπῶν
  choice: Quem ama
  rationale: O particípio com artigo tem valor genérico e proverbial. “Quem ama” é natural em português e não acrescenta um sujeito além do expresso no grego.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: o próprio filho
  rationale: υἱός designa especificamente “filho”. “Próprio” esclarece de modo idiomático a relação reflexiva de αὐτοῦ sem neutralizar o gênero do substantivo.
- source_word: ἐνδελεχήσει
  choice: persistirá
  rationale: O verbo comunica ação assídua, contínua ou reiterada. “Persistirá” conserva essa força sem reduzi-la a mera prontidão.
- source_word: μάστιγας αὐτῷ
  choice: em lhe aplicar açoites
  rationale: μάστιγας é plural e denota açoites, chicotadas ou flagelações; o pronome “lhe” representa o dativo αὐτῷ. A formulação portuguesa explicita a relação disciplinar exigida pelo contexto, sem substituir a imagem concreta por “disciplina” ou “correção”.
- source_word: ἵνα εὐφρανθῇ
  choice: para que se alegre
  rationale: Mantém o valor de finalidade ou resultado de ἵνα e a força afetiva de εὐφρανθῇ. O sujeito implícito continua sendo naturalmente entendido como aquele que ama.
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: no fim
  rationale: A expressão é ampla e pode apontar para o desfecho, os últimos anos ou o fim. A forma concisa preserva essa abertura, enquanto a nota registra a presença e a possível referência do pronome grego.
theological_decisions:
- issue: Imagem de castigo corporal
  choice: Conservar a imagem explícita com “açoites”
  alternative: Traduzir abstratamente por “disciplina”, “correção” ou “castigo”
  rationale: O grego emprega μάστιγας, termo concreto e severo. A tradução deve preservar a tensão moral do texto sem suavizá-la, ampliá-la nem apresentá-la como comentário normativo do tradutor.
- issue: Forma masculina do provérbio
  choice: Manter “filho”
  alternative: Generalizar como “criança” ou “filho ou filha”
  rationale: υἱός é especificamente masculino; manter “filho” representa a forma do texto sem introduzir uma generalização ausente do original.
- issue: Referência de αὐτοῦ na expressão final
  choice: Não fixar no texto principal se o fim é do pai ou do filho
  alternative: Traduzir “nos últimos dias do pai” ou “no desfecho do filho”
  rationale: O pronome grego admite mais de uma vinculação contextual, e ἔσχατα também possui amplitude semântica. A nota preserva essa ambiguidade em vez de resolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. “Açoites” mantém dignidade literária sem ocultar a severidade da imagem; as notas preservam as ambiguidades lexical e pronominal do grego.
