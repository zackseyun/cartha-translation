  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
translation:
  language: pt
  text: Iguarias derramadas diante de uma boca fechada são como uma oferta colocada diante de um ídolo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolo” é depreciativo; também pode ser entendido como “ídolo imundo” ou “ídolo de esterco”.
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego traz “porções de comida colocadas junto a um túmulo” em vez de “uma oferta colocada diante de um ídolo”. As duas formas preservam a mesma ideia de inutilidade.
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: iguarias
  rationale: No contexto de comida, designa coisas boas ou alimentos desejáveis; “iguarias” torna concreta a imagem proverbial.
- source_word: שפוכה
  choice: derramadas
  rationale: Preserva o sentido natural do particípio passivo de שפך e a imagem vívida, também refletida no paralelo grego.
- source_word: על פה סתום
  choice: diante de uma boca fechada
  rationale: Expressão natural em português que comunica comida posta perante quem não pode recebê-la.
- source_word: תנופה
  choice: uma oferta
  rationale: Mantém o contexto cultual sem restringir o termo à designação técnica “oferta movida”, que poderia sobrecarregar a comparação.
- source_word: מצגת
  choice: colocada
  rationale: Expressa com clareza o sentido de algo posto ou apresentado diante de alguém ou de algo.
- source_word: לפני גלול
  choice: diante de um ídolo
  rationale: Identifica claramente o referente, enquanto a força depreciativa do termo hebraico é registrada em nota.
theological_decisions:
- issue: Termo cultual תנופה na comparação sapiencial
  choice: “uma oferta”
  alternative: “uma oferta movida” ou “uma oferta de apresentação”
  rationale: A formulação geral preserva o pano de fundo cultual e ressalta a inutilidade da ação sem impor uma especificidade ritual incerta no contexto.
- issue: Designação depreciativa גלול para ídolo
  choice: “ídolo” no texto principal
  alternative: “ídolo imundo” ou “ídolo de esterco”
  rationale: “Ídolo” é claro e digno no texto principal; a nota conserva de modo transparente o tom de desprezo do hebraico.
- issue: Diferença entre o hebraico e o paralelo grego na segunda comparação
  choice: 'seguir o hebraico: oferta diante de um ídolo'
  alternative: 'grego: porções de comida colocadas junto a um túmulo'
  rationale: O hebraico fornecido tem alta confiança e deve governar o texto principal; a variante grega é significativa e fica documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A estrutura proverbial e o paralelismo foram preservados sem tornar excessivamente técnico o termo cultual.
