  text: Gladness of heart is a man's life, and a man's rejoicing prolongs his days.[a]
translation:
  language: pt
  text: Como alguém de confiança que passa a noite com uma virgem, assim é quem executa justiça pela força; e o SENHOR lhe pedirá contas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado deste versículo é difícil e difere radicalmente da tradição grega. O grego diz: “A alegria do coração é a vida do ser humano, e o júbilo do homem prolonga os seus dias.”'
    reason: textual_variant
lexical_decisions:
- source_word: כנאמן לן עם בתולה
  choice: Como um homem de confiança que passa a noite com uma virgem
  rationale: Traduz os elementos preservados no hebraico — נאמן, “confiável/de confiança”; לן, “passa a noite”; עם בתולה, “com uma virgem” — sem acrescentar explicitamente uma transgressão sexual que o texto não declara.
- source_word: עושה באונס משפט
  choice: quem faz justiça pela força
  rationale: 'Mantém a tensão da expressão hebraica: עושה משפט é “fazer/executar justiça”, enquanto באונס indica força, coerção ou constrangimento. A formulação portuguesa evita transformar silenciosamente משפט em mera condenação ou violência.'
- source_word: ויהוה מבקש מידו
  choice: e o SENHOR lhe pedirá contas
  rationale: מבקש מידו significa literalmente que YHWH “buscará/requererá de sua mão”; o idiomatismo português “pedirá contas” comunica responsabilidade divina com clareza. “SENHOR” segue a convenção bíblica corrente para o tetragrama.
theological_decisions:
- issue: Divergência radical entre o hebraico preservado e a tradição grega
  choice: Traduzir o testemunho hebraico fornecido como fonte original principal e registrar a leitura grega em nota
  alternative: 'Seguir o grego: “A alegria do coração é a vida do ser humano, e o júbilo do homem prolonga os seus dias.”'
  rationale: O testemunho hebraico foi fornecido com alta confiança e validação concordante. Embora sua relação interna seja difícil e ele divirja totalmente do grego, substituí-lo sem aviso pela leitura grega apagaria evidência textual primária e a tensão genuína da tradição manuscrita.
- issue: Possível implicação sexual da comparação com a virgem
  choice: Não explicitar violação, relação sexual ou culpa na tradução
  alternative: “Como aquele que se deita com uma virgem...”
  rationale: O verbo hebraico לן significa passar a noite ou pernoitar, não necessariamente manter relações sexuais. A tradução preserva a sugestão inquietante da comparação sem impor uma ação que não está lexicalmente expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura comparativa deliberadamente incomum reflete a dificuldade do hebraico. O marcador [a] aparece no texto principal.
