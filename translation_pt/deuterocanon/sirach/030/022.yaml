review_pass:
  verdict: revise
  source_fidelity: A tradução segue o testemunho hebraico fornecido, em vez de o substituir pela leitura grega, e conserva adequadamente a comparação difícil, a execução de justiça por coerção e a responsabilização perante YHWH. Contudo, “homem de confiança” tende a significar, em português, alguém a quem se confia uma tarefa; para נאמן, “homem fiel” é mais direto e menos interpretativo.
  naturalness: A redação é clara e mantém um registro bíblico moderado. “Como um homem fiel que passa a noite com uma virgem” preserva a estranheza do hebraico sem alegar explicitamente uma relação sexual. “O SENHOR lhe pedirá contas” é um idiomatismo natural para a cláusula final.
  terminology: “Justiça”, “virgem” e “SENHOR” são escolhas adequadas. A nota identifica corretamente a divergência substancial da tradição grega, sem apresentá-la como se fosse o sentido do hebraico.
  issues:
  - severity: low
    issue: “Homem de confiança” para נאמן
    rationale: A expressão portuguesa normalmente designa uma pessoa de confiança de outra pessoa, enquanto נאמן significa mais diretamente “fiel”, “digno de confiança” ou “leal”. “Homem fiel” reduz essa mudança de nuance.
  revised_text: Como um homem fiel que passa a noite com uma virgem, assim é quem faz justiça pela força; e o SENHOR lhe pedirá contas.[a]
  revised_footnotes:
