review_pass:
  verdict: revise
  source_fidelity: A tradução segue adequadamente o hebraico preservado, incluindo a comparação difícil, a execução da justiça «pela força» e a exigência divina de responsabilidade. A nota registra de modo apropriado a divergência completa da tradição grega. A forma «homem de confiança», porém, em português tende a significar «confidente» ou pessoa encarregada de confiança, não simplesmente alguém fiel/confiável (נֶאֱמָן).
  naturalness: A construção comparativa é necessariamente áspera, pois o hebraico é difícil. «Alguém de confiança» é mais idiomático e evita a leitura de «confidente», preservando a indefinição do substantivo hebraico. «Executa justiça» expressa com maior precisão e naturalidade o idiomatismo עושה משפט.
  terminology: «SENHOR» é uma convenção bíblica aceitável para יהוה. «Pedir contas» comunica bem a ideia de requerer algo de alguém (מבקש מידו), sem artificialidade. A nota textual mantém a leitura grega como variante, sem substituir silenciosamente o hebraico traduzido.
  issues:
  - severity: low
    issue: «Homem de confiança» é semanticamente ambíguo em português contemporâneo.
    rationale: A expressão pode designar um confidente ou agente de confiança; «alguém de confiança» comunica melhor «alguém confiável/fiel» e não acrescenta uma função social específica.
  - severity: low
    issue: «Faz justiça» pode ser entendido como uma avaliação genérica, não como a administração/executação de justiça.
    rationale: «Executa justiça» conserva mais claramente o valor de עושה משפט, sem resolver a dificuldade contextual nem intensificar o sentido de violência.
  revised_text: Como alguém de confiança que passa a noite com uma virgem, assim é quem executa justiça pela força; e o SENHOR lhe pedirá contas.[a]
  revised_footnotes:
  - marker: a
    text: 'O hebraico preservado deste versículo é difícil e difere radicalmente da tradição grega. O grego diz: “A alegria do coração é a vida do ser humano, e o júbilo do homem prolonga os seus dias.”'
    reason: textual_variant
  revision_rationale: A revisão é limitada a duas escolhas lexicais portuguesas. Ela esclarece נאמן sem impor a noção de «confidente» e torna explícito o sentido judicial de עושה משפט. Mantêm-se a sintaxe comparativa incomum, a ambiguidade da ação de «passar a noite com uma virgem», a referência a יהוה e a nota que documenta a divergência do grego.
