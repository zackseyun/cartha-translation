  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: pt
  text: Enquanto você ainda estiver vivo e houver fôlego em você, não se entregue a ser humano algum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a toda carne”; isto é, “a pessoa alguma” ou “a nenhum ser humano”. Aqui, “carne” provavelmente se refere à humanidade mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Enquanto você ainda estiver vivo
  rationale: Expressa naturalmente a duração indicada por ἕως e preserva a ênfase de ἔτι, “ainda”.
- source_word: πνοὴ ἐν σοί
  choice: houver fôlego em você
  rationale: Mantém a imagem concreta do fôlego como sinal da vida, em português corrente e digno.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: não se entregue
  rationale: Embora ἀλλάσσω possa significar “mudar” ou “trocar”, a construção reflexiva seguida do dativo aponta, neste contexto, para entregar-se ou colocar-se sob o poder de outro; uma tradução estritamente literal seria obscura em português.
- source_word: πάσῃ σαρκί
  choice: a ser humano algum
  rationale: O singular com πᾶς tem sentido distributivo, e “carne” designa aqui a humanidade mortal. A expressão idiomática no texto principal comunica esse sentido, enquanto a nota preserva a forma lexical grega.
theological_decisions:
- issue: Sentido de σάρξ em contexto sapiencial não paulino
  choice: ser humano
  alternative: carne; mortal
  rationale: Neste contexto, σάρξ não indica necessariamente uma natureza pecaminosa, mas uma pessoa humana em sua condição mortal. “Ser humano” evita importar um sentido doutrinário indevido; a nota registra a tradução literal e conserva a imagem antropológica do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva-se a imagem do fôlego, mas a expressão grega com “carne” é esclarecida no texto principal e documentada em nota para evitar obscuridade e falsa associação com um sentido técnico paulino.
