  text: For idleness has taught much evil[a].
translation:
  language: pt
  text: Pois a ociosidade ensinou muita maldade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande maldade”; a expressão grega pode enfatizar tanto a quantidade (“muita maldade”) como a magnitude.
