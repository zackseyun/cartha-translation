lexical_decisions:
- source_word: πολλὴν
  choice: muita
  rationale: O adjetivo modifica κακίαν no acusativo singular. “Muita maldade” preserva naturalmente a ideia de quantidade ou extensão, embora “grande maldade” também seja possível.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o contexto anterior, em português corrente e digno.
- source_word: κακίαν
  choice: maldade
  rationale: Expressa de modo amplo a qualidade moral negativa de κακία, sem restringi-la a um vício específico.
- source_word: ἐδίδαξεν
  choice: ensinou
  rationale: Preserva a imagem verbal do grego e traduz diretamente o aoristo, adequado ao tom proverbial.
- source_word: ἡ ἀργία
  choice: a ociosidade
  rationale: Corresponde ao substantivo abstrato grego e designa a condição de estar sem ocupação, sem introduzir a carga teológica mais específica de “preguiça” ou “acídia”.
