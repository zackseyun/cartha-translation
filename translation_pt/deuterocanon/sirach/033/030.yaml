  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: pt
  text: Designe-o para trabalhos adequados a ele; e, se não obedecer, torne pesados os seus grilhões. Mas não seja excessivo com ninguém[a] e não faça nada sem julgamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em toda carne”, isto é, com qualquer ser humano.
    reason: A nota preserva a expressão concreta ἐν πάσῃ σαρκί, traduzida idiomaticamente no texto principal.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Designe-o para trabalhos
  rationale: κατάστησον expressa colocação ou designação, e ἔργα indica trabalhos ou tarefas. A formulação mantém a força imperativa e soa natural em português.
- source_word: καθὼς πρέπει αὐτῷ
  choice: adequados a ele
  rationale: πρέπει indica aquilo que convém ou é apropriado; “adequados a ele” preserva a ideia de correspondência entre a pessoa e os trabalhos.
- source_word: κἂν μὴ πειθαρχῇ
  choice: e, se não obedecer
  rationale: πειθαρχέω significa obedecer à autoridade ou sujeitar-se a ela. “Não obedecer” é direto e não acrescenta um objeto que o grego não explicita.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: torne pesados os seus grilhões
  rationale: A tradução conserva literalmente o imperativo βάρυνον e o sentido de πέδαι como grilhões presos aos pés, sem suavizar a coerção física.
- source_word: μὴ περισσεύσῃς
  choice: não exceda a medida
  rationale: No contexto, περισσεύω adverte contra ultrapassar o limite apropriado. A expressão portuguesa é clara e preserva a noção de excesso.
- source_word: ἐν πάσῃ σαρκί
  choice: com ninguém
  rationale: A expressão grega literal, “com toda carne”, refere-se idiomaticamente a qualquer ser humano. “Com ninguém” comunica esse sentido no texto corrente, enquanto a nota preserva a imagem concreta do grego.
- source_word: ἄνευ κρίσεως
  choice: sem julgamento
  rationale: κρίσις pode indicar julgamento, decisão ou discernimento. “Sem julgamento” mantém a amplitude e a concisão do original.
- source_word: μὴ ποιήσῃς μηδέν
  choice: não faça nada
  rationale: Esta é a forma portuguesa natural de reproduzir a proibição enfática do grego.
theological_decisions:
- issue: Linguagem eticamente difícil sobre trabalho forçado e castigo
  choice: Manter a referência direta aos trabalhos, à obediência e aos grilhões.
  alternative: Suavizar a linguagem com termos genéricos como “serviço” e “restrição”.
  rationale: O grego descreve coerção e contenção física sem eufemismo. A tradução não deve ocultar a realidade social e moralmente difícil do texto.
- issue: Sentido de ἐν πάσῃ σαρκί
  choice: Traduzir idiomaticamente como “com ninguém”, com nota sobre a forma literal.
  alternative: Usar no texto principal “com toda carne”.
  rationale: No contexto, “carne” é uma designação concreta dos seres humanos. A tradução idiomática oferece clareza moderna, e a nota conserva a textura e a possível relevância antropológica da expressão grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém os imperativos e a severidade do original, sem arcaísmos desnecessários nem suavização moral.
