lexical_decisions:
- source_word: σύντριψον
  choice: Esmaga
  rationale: Imperativo aoristo de συντρίβω, com a ideia de quebrar ou despedaçar com violência. “Esmaga” preserva a força da imagem e soa natural em português.
- source_word: κεφαλὰς
  choice: as cabeças
  rationale: Plural literal de κεφαλή. Mantém-se a imagem concreta, sem amenizá-la com uma paráfrase figurada.
- source_word: ἀρχόντων
  choice: dos governantes
  rationale: Genitivo plural de ἄρχων, termo que designa pessoas investidas de autoridade. “Governantes” comunica com clareza essa função em português atual.
- source_word: ἐχθρῶν
  choice: inimigos
  rationale: O genitivo plural pode funcionar substantivamente (“dos inimigos”) ou caracterizar os governantes como hostis. No texto principal, “governantes inimigos” é natural e preserva a referência a autoridades adversárias; a outra construção possível é registrada em nota.
- source_word: λεγόντων
  choice: que dizem
  rationale: O particípio presente caracteriza os governantes. A oração relativa é fluente em português e conserva o aspecto de fala que os identifica.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Não há ninguém além de nós
  rationale: πλήν com o genitivo expressa exclusão. A formulação é clara e idiomática, mantendo a afirmação arrogante de exclusividade sem transformá-la em comparação.
theological_decisions:
- issue: Referente e alcance da afirmação dos inimigos
  choice: 'A frase é apresentada como uma declaração arrogante de exclusividade: “Não há ninguém além de nós.”'
  alternative: “Não há ninguém como nós.”
  rationale: O grego exprime mais diretamente exclusão do que comparação. A tradução preserva a tensão e o tom de soberba sem acrescentar uma reivindicação teológica mais específica.
- issue: Relação sintática entre ἀρχόντων e ἐχθρῶν
  choice: “governantes inimigos”
  alternative: “governantes dos inimigos”
  rationale: As formas genitivas permitem entender ἐχθρῶν como caracterização dos governantes ou como grupo ao qual eles pertencem. O texto principal adota a formulação portuguesa mais direta, e a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem violenta e concreta do grego foi mantida, assim como a ambiguidade sintática relevante, registrada em nota.
