  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
translation:
  language: pt
  text: Não peça conselho a qualquer pessoa[a], mas tenha como conselheiro um entre mil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não consulte qualquer pessoa”. O verbo grego pode significar consultar ou pedir conselho.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “um entre mil” é uma hipérbole proverbial que recomenda extrema cautela na escolha de um conselheiro.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ
  choice: Não
  rationale: Introduz naturalmente em português a ordem negativa expressa pelo grego.
- source_word: ἐν παντὶ ἀνθρώπῳ
  choice: a qualquer pessoa
  rationale: Com συμβούλευε, a expressão indica de quem se busca conselho. “Qualquer pessoa” transmite a advertência contra consultar indiscriminadamente, sem restringir o provérbio ao sexo masculino.
- source_word: συμβούλευε
  choice: peça conselho
  rationale: Expressa com clareza o sentido contextual de consultar ou buscar orientação, em linguagem corrente e digna.
- source_word: ἀλλὰ
  choice: mas
  rationale: Preserva o contraste direto entre a proibição e a instrução positiva.
- source_word: ἕνα ἐκ χιλίων
  choice: um entre mil
  rationale: Mantém a imagem proverbial e a forte seletividade da formulação grega.
- source_word: σύμβουλον
  choice: como conselheiro
  rationale: Verte diretamente o substantivo e, nesta construção, identifica com naturalidade a função da pessoa de confiança.
- source_word: ἔχε
  choice: tenha
  rationale: Equivalente direto e natural do imperativo de ἔχω, sem acrescentar explicitamente a ideia de escolher.
