lexical_decisions:
- source_word: ἔγειρον
  choice: Desperta
  rationale: O imperativo de ἐγείρω comunica a ideia de fazer surgir ou entrar em ação. “Desperta” preserva essa imagem e soa natural com “furor”.
- source_word: θυμόν
  choice: o furor
  rationale: θυμός pode designar ira intensa, ímpeto ou paixão. “Furor” mantém a intensidade e permite distingui-lo de ὀργή na segunda oração.
- source_word: ἔκχεον
  choice: derrama
  rationale: O imperativo de ἐκχέω significa literalmente “derramar”. A escolha conserva a metáfora vívida da ira vertida como um líquido.
- source_word: ὀργήν
  choice: a ira
  rationale: ὀργή denota ira ou indignação manifestada. “Ira” é uma equivalência corrente e digna, sem apagar o paralelismo com θυμός.
