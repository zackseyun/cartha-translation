  yaml_path: translation/deuterocanon/sirach/033/035.yaml
  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: pt
  text: Acolha um estranho para morar com você[a], e ele lançará você em meio a tumultos e afastará você do que é seu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faça um estranho residir junto de você”. A expressão grega também pode sugerir acolhê-lo como residente em sua casa ou em seu círculo.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “das coisas que são suas” e pode referir-se às pessoas do seu convívio, à sua casa ou aos seus bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  choice: Acolha ... para morar com você
  rationale: O imperativo causativo de παροικίζω indica fazer alguém residir junto de si ou como residente estrangeiro. A formulação explicita esse sentido em português natural, sem reduzi-lo a uma visita passageira.
- source_word: ἀλλότριον
  choice: um estranho
  rationale: O adjetivo substantivado designa alguém alheio ao círculo ou à casa da pessoa. “Estranho” preserva essa amplitude sem especificar indevidamente nacionalidade, como faria “estrangeiro”.
- source_word: διαστρέψει
  choice: lançará você
  rationale: Neste contexto, διαστρέφω expressa desestabilizar ou transtornar, não necessariamente perverter em sentido moral. Unido a ἐν ταραχαῖς, “lançará você” comunica uma perturbação intensa.
- source_word: ἐν ταραχαῖς
  choice: em meio a tumultos
  rationale: ταραχαί pode denotar agitações, perturbações ou dificuldades. “Em meio a tumultos” conserva a imagem plural e a ideia de desordem.
- source_word: ἀπαλλοτριώσει
  choice: afastará
  rationale: O verbo significa tornar alheio, alienar ou separar. “Afastará” soa natural no contexto relacional e conserva a consequência de ruptura.
- source_word: τῶν ἰδίων σου
  choice: dos seus
  rationale: 'A expressão substantivada é ampla: literalmente, “das coisas/pessoas que são suas”. “Dos seus” favorece a leitura relacional sugerida pelo contexto, enquanto a nota registra a possível referência à casa ou aos bens.'
