  yaml_path: translation/deuterocanon/sirach/033/031.yaml
  text: If you have a slave[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: pt
  text: Se você tem um escravo[a], que ele seja como você, pois você o adquiriu com sangue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo” ou “servo doméstico”. O grego οἰκέτης muitas vezes designa alguém do serviço da casa, mas, neste contexto, a ideia de aquisição destaca a condição de escravizado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com sangue você o adquiriu”. A expressão provavelmente indica uma aquisição custosa, sem especificar de quem é o sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: escravo
  rationale: Embora o termo possa designar um servo doméstico ou membro da criadagem, a afirmação de que ele foi adquirido torna evidente, neste contexto, a condição de escravizado; “escravo” evita suavizar essa realidade social.
- source_word: ἔστω ὡς σύ
  choice: que ele seja como você
  rationale: Conserva a formulação existencial e imperativa do grego, bem como sua amplitude, sem restringi-la à paráfrase interpretativa “trate-o como a si mesmo”.
- source_word: ἐν αἵματι
  choice: com sangue
  rationale: Reproduz a imagem concisa e vívida do grego sem decidir de quem é o sangue nem reduzir a expressão a uma explicação específica do custo envolvido.
- source_word: ἐκτήσω
  choice: você o adquiriu
  rationale: “Adquiriu” expressa obtenção e posse sem impor a ideia mais específica de compra, que o verbo grego não explicita por si só.
theological_decisions:
- issue: Linguagem relativa à escravidão
  choice: escravo
  alternative: servo ou servo doméstico
  rationale: O contexto associa οἰκέτης à aquisição e à posse. A tradução mantém visível a condição de escravizado sem acrescentar aprovação moral ou uma leitura confessional.
- issue: Sentido de “com sangue”
  choice: preservar a expressão sem identificar o sangue
  alternative: ao custo de sangue ou com o seu próprio sangue
  rationale: A expressão provavelmente sugere uma aquisição custosa, mas o texto não especifica de quem seria o sangue; a tradução conserva essa ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A construção “que ele seja como você” mantém a concisão e a abertura semântica do grego; “pois” estabelece naturalmente a relação causal.
