review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente as imagens de ζυγός («jugo»), ἱμάς («correia») e o futuro de κάμπτω («dobrarão»), bem como a dureza de στρέβλαι e βάσανοι. «Escravo» é uma opção defensável e preferível neste contexto coercitivo para οἰκέτῃ. No entanto, a construção elíptica depois do ponto e vírgula fica excessivamente truncada em português atual, e «perverso» é mais forte e mais específico do que o adjetivo grego genérico κακούργος neste uso.
  naturalness: A inserção de «há» torna explícita em português a cópula existencial implícita no grego, sem acrescentar sentido. «Mau» é mais idiomático e mantém a caracterização ampla, sem sugerir necessariamente perversidade deliberada. «Torturas» comunica diretamente βάσανοι e mantém o paralelismo concreto com «cavaletes».
  terminology: «Jugo», «correia», «escravo», «cavaletes» e «torturas» são termos claros e adequados ao registro proverbial e severo do texto. A nota deve apresentar «servo doméstico» como alternativa lexical, em vez de «empregado doméstico», que pode sugerir uma relação trabalhista moderna incompatível com o contexto antigo.
  issues:
  - severity: medium
    issue: «Perverso» estreita e intensifica κακούργῳ.
    rationale: O termo pode designar alguém mau, nocivo ou dado a más ações; «mau» preserva melhor sua amplitude sem impor uma leitura psicológica mais carregada.
  - severity: low
    issue: Falta o verbo existencial na segunda oração.
    rationale: A elipse é possível em estilo sentencioso, mas «para o escravo perverso, cavaletes...» soa truncado no português moderno. «Há» torna a oração natural e reproduz a estrutura semântica implícita.
  - severity: low
    issue: «Empregado doméstico» na nota é anacrônico e socialmente impreciso como alternativa principal.
    rationale: οἰκέτης pode referir-se a alguém da casa, mas «empregado» tende a evocar trabalho assalariado moderno. «Servo doméstico» registra a alternativa sem essa implicação.
  revised_text: O jugo e a correia dobrarão o pescoço; para um escravo mau, há cavaletes e torturas.
  revised_footnotes:
  - marker: a
    text: Ou «servo» ou «servo doméstico». O termo grego οἰκέτης pode designar alguém que serve numa casa; aqui, o contexto de disciplina coerciva favorece «escravo».
