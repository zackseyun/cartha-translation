  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
translation:
  language: pt
  text: O jugo e a correia dobrarão o pescoço; para um escravo mau, há cavaletes e torturas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: jugo
  rationale: O ato de dobrar o pescoço aponta claramente para o jugo colocado sobre um animal, não para uma balança.
- source_word: ἱμάς
  choice: correia
  rationale: Designa uma tira de couro; “correia” é natural em português e mantém a imagem concreta de contenção.
- source_word: κάμψουσιν
  choice: dobrarão
  rationale: Preserva o futuro ativo e a imagem física de fazer o pescoço curvar-se.
- source_word: τράχηλον
  choice: o pescoço
  rationale: O singular grego tem sentido genérico, expresso naturalmente com o artigo definido em português.
- source_word: οἰκέτῃ
  choice: escravo
  rationale: Embora o termo possa indicar um servo ou empregado da casa, o contexto de coerção e castigo torna saliente a condição servil e não livre.
- source_word: κακούργῳ
  choice: perverso
  rationale: Caracteriza moralmente o escravo como alguém que pratica o mal, sem restringir o sentido à categoria jurídica de criminoso.
- source_word: στρέβλαι
  choice: cavaletes de tortura
  rationale: Refere-se concretamente a instrumentos nos quais o corpo era torcido ou distendido; a explicitação evita a ambiguidade do simples “cavaletes”.
- source_word: βάσανοι
  choice: tormentos
  rationale: Mantém a ideia de sofrimento severo. “Tormentos” evita a repetição imediata de “tortura” exigida para esclarecer στρέβλαι, sem suavizar a dureza do grego.
theological_decisions:
- issue: Condição servil expressa por οἰκέτῃ
  choice: escravo
  alternative: servo ou empregado doméstico
  rationale: O contexto associa a pessoa a contenção física e castigos coercivos; “escravo” preserva essa realidade social, enquanto a nota registra a amplitude lexical do termo.
translation_notes:
  register: Português atual, digno e direto, com construção paralela e concisa. O ponto e vírgula representa a mudança entre a máxima inicial e sua aplicação ao escravo. “Cavaletes de tortura” explicita um instrumento antigo que, sem complemento, seria pouco claro para muitos leitores.
