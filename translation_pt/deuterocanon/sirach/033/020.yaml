  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: pt
  text: Não dê ao filho nem à esposa, ao irmão nem ao amigo, autoridade sobre você enquanto viver[a]; e não dê seus bens a outra pessoa[b], para que não se arrependa e venha a precisar deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «controle sobre você». O grego fala em conceder ἐξουσία, isto é, autoridade, poder ou controle, sobre si mesmo.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego χρήματα pode designar bens, posses, propriedades ou dinheiro.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: «e fique em necessidade a respeito deles». No contexto, pode indicar que a pessoa teria de pedir os bens de volta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: ao filho nem à esposa, ao irmão nem ao amigo
  rationale: 'Os substantivos gregos são masculinos ou relacionais específicos: filho, esposa, irmão e amigo. Em português, a repetição de «nem» deixa claro que a proibição se aplica a cada pessoa da lista, sem neutralizar os termos.'
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σέ
  choice: não dê ... autoridade sobre você
  rationale: ἐξουσία indica autoridade, poder ou controle. A formulação mantém a imagem de conceder a alguém poder sobre a própria pessoa ou seus assuntos.
- source_word: ἐν ζωῇ σου
  choice: enquanto viver
  rationale: 'Expressa de modo natural o alcance temporal da advertência: durante a vida do destinatário.'
- source_word: ἑτέρῳ
  choice: a outra pessoa
  rationale: Torna explícita em português a referência pessoal do adjetivo substantivado grego, sem acrescentar uma identidade específica.
- source_word: τὰ χρήματά σου
  choice: seus bens
  rationale: χρήματα pode abranger dinheiro, propriedades e posses. «Bens» conserva essa amplitude melhor que «dinheiro».
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: para que não se arrependa
  rationale: μεταμέλομαι descreve arrependimento ou mudança posterior de parecer; a tradução comunica diretamente a consequência temida.
- source_word: δέῃ περὶ αὐτῶν
  choice: venha a precisar deles
  rationale: A construção indica ficar em necessidade com respeito aos bens. Esta tradução preserva a formulação relativamente aberta do grego, sem tornar explícito no texto principal que seria necessário pedi-los de volta.
