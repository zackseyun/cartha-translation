base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/002.yaml
  text: One who hates instruction will not become wise[b][a], and he is tossed about in a storm like a ship.
translation:
  language: pt
  text: Quem odeia a instrução[a] não se tornará sábio[b] e, em meio à tempestade, é sacudido de um lado para outro como um navio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a lei” ou “o ensino”. O hebraico תוֹרָה pode ter esses sentidos.
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego fornecido no conjunto de fontes parece corresponder a outra linha. Aqui se segue o testemunho hebraico, que é coerente.
    reason: textual_variant
lexical_decisions:
- source_word: שׂוֹנֵא
  choice: quem odeia
  rationale: O particípio funciona como substantivo e caracteriza um tipo de pessoa. “Quem odeia” é natural em português e preserva a ideia de rejeição ativa.
- source_word: תוֹרָה
  choice: instrução
  rationale: No contexto sapiencial de Ben Sira, o termo pode designar instrução ou ensino, sem excluir sua ressonância de “lei”. A alternativa é registrada em nota.
- source_word: יֶחְכַּם
  choice: não se tornará sábio
  rationale: A formulação expressa o sentido de processo e resultado do verbo, em vez de apenas um estado estático.
- source_word: מִתְמוֹטֵט
  choice: é sacudido de um lado para outro
  rationale: No quadro da tempestade e do navio, a expressão comunica de modo claro a instabilidade causada por forças externas, preservando o valor passivo ou reflexivo contextual.
- source_word: בְּמִסְעָר
  choice: em meio à tempestade
  rationale: Reproduz o cenário indicado pela preposição e pelo substantivo, em português natural e vívido.
- source_word: כָּאֳנִיָּה
  choice: como um navio
  rationale: Mantém diretamente a comparação náutica do hebraico e a gravidade da imagem.
theological_decisions:
- issue: Sentido de תוֹרָה no contexto sapiencial
  choice: instrução
  alternative: lei; ensino
  rationale: O provérbio trata da aquisição da sabedoria, de modo que “instrução” preserva bem o contexto sapiencial. “Lei” continua possível e sua ressonância não deve ser apagada, por isso aparece em nota.
- issue: Uso do paralelo grego diante da divergência textual
  choice: seguir o testemunho hebraico coerente e de alta confiança
  alternative: subordinar a tradução ao texto grego fornecido ou considerar o verso intraduzível
  rationale: O paralelo grego fornecido contém uma linha diferente e não pode controlar a tradução deste verso. O hebraico é coerente e foi explicitamente classificado como de alta confiança; a divergência é informada ao leitor em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A imagem marítima foi mantida sem suavizar a relação proverbial entre rejeitar a instrução e permanecer instável.
