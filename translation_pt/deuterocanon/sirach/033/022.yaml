translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” e estrutura proverbial natural. A imagem das mãos foi preservada no texto, enquanto a nota esclarece seu sentido idiomático e a mudança lexical entre τέκνα e υἱῶν.
