review_pass:
  verdict: revise
  source_fidelity: A construção comparativa e a imagem de «olhar para as mãos» são preservadas. Contudo, «fique olhando» introduz uma ideia aspectual de permanência/encarar que o infinitivo grego ἐμβλέπειν não exige. A nota também enfraquece indevidamente o sentido específico de υἱῶν, que significa «filhos homens/filhos» no masculino, em contraste com τέκνα, mais abrangente.
  naturalness: «Olhe para as mãos» é uma formulação portuguesa natural o bastante em registro proverbial e conserva a imagem concreta; a nota esclarece seu sentido de dependência. «Você olhe» é mais direto e idiomático do que «você fique olhando» neste paralelismo.
  terminology: «Filhos» para τέκνα mantém o uso português inclusivo no plural. Na segunda ocorrência, o texto mantém a fluência com «filhos», e a nota registra com precisão que o grego usa υἱοί, especificamente «filhos homens»; não se deve descrevê-lo apenas como uma possibilidade.
  issues:
  - severity: medium
    issue: «fique olhando» acrescenta aspecto durativo e pode sugerir simplesmente encarar as mãos.
    rationale: O grego diz ἐμβλέπειν («olhar para/em direção a»); no contexto, a imagem comunica buscar apoio, mas não requer a perífrase «ficar olhando».
  - severity: medium
    issue: A nota diz que o segundo termo para «filhos» «pode ... significar especificamente filhos homens».
    rationale: υἱῶν é o genitivo plural de υἱός e é especificamente «filhos homens»; a distinção lexical em relação a τέκνα deve ser apresentada como tal.
