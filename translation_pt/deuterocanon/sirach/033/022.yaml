  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
translation:
  language: pt
  text: Pois é melhor que seus filhos precisem de você do que você olhe para as mãos de seus filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “do que você dependa de seus filhos”. O grego diz literalmente “olhe para as mãos de seus filhos”, usando as mãos como imagem de sustento ou auxílio. Na primeira ocorrência, o grego usa um termo mais abrangente para “filhos”; na segunda, usa um termo que significa especificamente “filhos homens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: melhor
  rationale: Expressa aquilo que é preferível ou mais vantajoso, com naturalidade em português.
- source_word: τὰ τέκνα
  choice: seus filhos
  rationale: τέκνα é o termo mais amplo para filhos ou descendentes; em português, “filhos” pode abranger ambos os sexos no plural.
- source_word: δεηθῆναί σου
  choice: precisem de você
  rationale: δέομαι com o genitivo indica ter necessidade de alguém ou depender dessa pessoa; a formulação é clara e corrente.
- source_word: ἐμβλέπειν
  choice: fique olhando para
  rationale: Preserva o sentido visual do verbo e, em conjunto com “mãos”, sugere esperar auxílio ou sustento.
- source_word: εἰς χεῖρας
  choice: para as mãos
  rationale: Mantém a imagem concreta do grego, em que as mãos representam provisão ou apoio.
- source_word: υἱῶν σου
  choice: seus filhos
  rationale: υἱῶν significa literalmente “filhos homens”, mas no contexto familiar o português natural usa “filhos”; a nota registra a possibilidade mais estrita.
