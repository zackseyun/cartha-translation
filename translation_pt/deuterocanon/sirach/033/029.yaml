  text: Pois a ociosidade ensinou muita maldade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὴν
  choice: muita
  rationale: Concorda com o substantivo singular «maldade» e preserva a ideia de grande quantidade ou extensão.
- source_word: γὰρ
  choice: pois
  rationale: Mantém de forma concisa a relação explicativa com a exortação anterior.
- source_word: κακίαν
  choice: maldade
  rationale: Expressa o sentido moral amplo de κακία sem o limitar a malícia interpessoal ou a um vício específico; evita também a ambiguidade de «ensinou muito mal».
- source_word: ἐδίδαξεν
  choice: ensinou
  rationale: Preserva diretamente a metáfora pedagógica do verbo grego e o valor proverbial do aoristo.
- source_word: ἡ ἀργία
  choice: a ociosidade
  rationale: É uma correspondência direta e natural para a condição de estar sem ocupação, sem intensificar o sentido para «preguiça» ou «indolência».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. «Ociosidade» preserva o tom sapiencial, e «muita maldade» evita uma leitura adverbial equivocada que seria possível em «muito mal».
