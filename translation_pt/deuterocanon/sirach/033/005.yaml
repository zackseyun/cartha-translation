translation:
  language: pt
  text: e que eles te conheçam[a], assim como nós também te conhecemos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega no primeiro membro um verbo que pode sugerir conhecimento mais definido, reconhecimento ou chegar a conhecer; no segundo, usa o verbo simples para “conhecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώτωσάν
  choice: que eles te reconheçam
  rationale: O imperativo aoristo na terceira pessoa do plural tem, neste contexto de oração, valor de pedido. “Reconheçam” conserva de modo natural a possível nuance de conhecimento mais definido de ἐπιγινώσκω.
- source_word: σε
  choice: te
  rationale: Pronome singular que funciona como objeto direto e se refere a Deus; a forma átona é natural em português.
- source_word: καθάπερ
  choice: assim como
  rationale: Introduz claramente a comparação e preserva sua força sem rigidez.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito conserva a ênfase contrastiva do grego.
- source_word: ἔγνωμεν
  choice: conhecemos
  rationale: O aoristo de γινώσκω é vertido pelo pretérito perfeito simples, forma portuguesa natural para conhecimento adquirido; distingue-se lexicalmente de “reconheçam” sem exagerar o contraste.
theological_decisions:
- issue: Força do imperativo em uma oração dirigida a Deus
  choice: “que eles te reconheçam” como pedido ou desejo
  alternative: “reconheçam-te” como ordem direta
  rationale: A construção com “que” comunica naturalmente em português o valor de súplica do imperativo grego, sem eliminar sua força volitiva.
- issue: Nuance entre ἐπιγινώσκω e γινώσκω
  choice: “reconheçam” no primeiro membro e “conhecemos” no segundo
  alternative: Empregar “conhecer” nos dois membros, ou traduzir o primeiro como “conheçam plenamente”
  rationale: A diferença lexical sinaliza a possível intensidade ou definição maior de ἐπιγινώσκω, mas evita impor a ideia mais forte e potencialmente excessiva de conhecimento pleno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura com “e” preserva a continuidade sintática do versículo no contexto. A colocação pronominal “te reconheçam” é corrente e natural.
