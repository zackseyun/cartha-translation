  text: On the day the days of your life are completed[a], and at the time of death, give an inheritance.
translation:
  language: pt
  text: No dia em que se completarem os dias da sua vida[a] e no momento da morte, dê uma herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “no dia da conclusão dos dias da sua vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: No dia em que
  rationale: A construção temporal com ἐν e dativo é expressa naturalmente em português por “no dia em que”, mantendo a referência a um dia específico.
- source_word: συντελείας
  choice: se completarem
  rationale: O substantivo indica conclusão ou término. A formulação verbal torna a cadeia nominal grega natural em português sem perder seu sentido.
- source_word: ἡμερῶν ζωῆς σου
  choice: os dias da sua vida
  rationale: Reproduz com clareza e dignidade a cadeia de genitivos do grego.
- source_word: καιρῷ τελευτῆς
  choice: no momento da morte
  rationale: καιρός indica aqui o tempo ou ocasião, e τελευτή pode designar o fim da vida, isto é, a morte. “Momento da morte” é direto e natural.
- source_word: διδὸς
  choice: dê
  rationale: Mantém o imperativo direto do verbo δίδωμι, sem acrescentar a ideia interpretativa de “deixar” ou “legar”.
- source_word: κληρονομίαν
  choice: uma herança
  rationale: κληρονομία designa herança ou patrimônio hereditário. O artigo indefinido corresponde naturalmente ao substantivo grego sem artigo e preserva seu sentido concreto e familiar.
theological_decisions:
- issue: Se κληρονομίαν deve ser traduzido por um termo concreto ou por uma expressão mais ampla e interpretativa.
  choice: uma herança
  alternative: um legado
  rationale: “Herança” conserva o sentido jurídico e familiar concreto do grego, sem introduzir as conotações abstratas que “legado” pode ter.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição temporal do original é preservada, enquanto a expressão nominal grega é reorganizada de modo natural.
