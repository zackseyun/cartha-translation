  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: pt
  text: Enquanto você ainda estiver vivo e houver sopro em você, não se entregue a nenhum ser humano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «a qualquer carne». A expressão se refere a uma pessoa ou ser humano mortal. A frase também pode ser entendida como «não se entregue a ninguém» ou «não se submeta a pessoa alguma».
    reason: A construção de ἀλλάσσω com o pronome reflexivo e o dativo é incomum; a nota preserva a expressão literal e registra o alcance semântico alternativo.
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Enquanto você ainda estiver vivo
  rationale: A construção temporal indica todo o período em que a pessoa continua viva. A formulação mantém a ênfase de ἔτι (‘ainda’) e soa natural no português atual.
- source_word: πνοὴ
  choice: sopro
  rationale: πνοή designa diretamente o sopro ou a respiração e, neste contexto, representa a continuidade da vida sem introduzir a interpretação mais carregada de ‘espírito’.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: não se entregue
  rationale: Embora ἀλλάσσω signifique normalmente ‘mudar’ ou ‘trocar’, a combinação reflexiva com o dativo seguinte sugere transferir ou sujeitar a própria pessoa a outro. ‘Não se entregue’ comunica essa força de modo claro, sem eliminar a dificuldade lexical, registrada na nota.
- source_word: σεαυτὸν
  choice: se
  rationale: O pronome reflexivo mostra que a advertência diz respeito à entrega da própria pessoa.
- source_word: πάσῃ σαρκί
  choice: a nenhum ser de carne
  rationale: Sob a negação, πάσῃ tem o sentido de ‘qualquer/nenhum’. ‘Ser de carne’ preserva a imagem concreta de σάρξ, ao mesmo tempo que deixa claro que a expressão se refere a outra pessoa mortal.
theological_decisions:
- issue: Sentido de σάρξ em πάσῃ σαρκί
  choice: ser de carne
  alternative: pessoa; mortal; ninguém; literalmente, carne
  rationale: A expressão aponta para seres humanos em sua condição corporal e mortal. ‘Ser de carne’ conserva a imagem do grego sem produzir a possível conotação sexual ou a obscuridade de ‘não se entregue a nenhuma carne’ em português.
- issue: Força de ἀλλάξῃς σεαυτόν com dativo
  choice: não se entregue
  alternative: não ponha a si mesmo sob o poder de; não troque a si mesmo por; não se submeta
  rationale: O grego admite tensão entre a ideia básica de mudar/trocar e o sentido contextual de transferir-se ao domínio de outra pessoa. A tradução principal oferece o sentido contextual mais provável, e a nota preserva as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira e internacional. “Ser de carne” preserva a textura do original sem a estranheza excessiva de uma tradução inteiramente literal.
