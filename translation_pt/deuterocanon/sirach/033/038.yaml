  yaml_path: translation/deuterocanon/sirach/033/038.yaml
  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: pt
  text: Pois há amigo no seu tempo[a], e ele certamente não permanecerá no dia da sua aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «há amigo por algum tempo» ou «há amigo quando lhe convém». A expressão pode indicar uma amizade que só dura enquanto as circunstâncias são favoráveis ao amigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: amigo
  rationale: É o equivalente português mais direto e natural para um amigo ou companheiro pessoal.
- source_word: ἐν καιρῷ αὐτοῦ
  choice: apenas quando lhe convém
  rationale: A expressão pode indicar o tempo ou a ocasião favorável ao próprio amigo. Esta formulação comunica com naturalidade a amizade condicionada sugerida pelo contraste, enquanto a nota preserva alternativas mais literais.
- source_word: οὐ μὴ παραμείνῃ
  choice: certamente não permanecerá
  rationale: A construção οὐ μή com o subjuntivo exprime negação enfática e força futura; «certamente não permanecerá» conserva ambos os aspectos.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: no dia da sua aflição
  rationale: Mantém a expressão temporal do grego e traduz θλῖψις por «aflição», termo claro e digno que abrange sofrimento, angústia e adversidade.
