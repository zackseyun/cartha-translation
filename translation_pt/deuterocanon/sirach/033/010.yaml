lexical_decisions:
- source_word: σπεῦσον
  choice: Apressa
  rationale: O imperativo aoristo de σπεύδω pede ação urgente. “Apressa” mantém a força imperativa e associa-se naturalmente a “o tempo”, sem ampliar o texto.
- source_word: καιρόν
  choice: o tempo
  rationale: καιρός pode indicar o momento oportuno ou determinado. “O tempo” preserva essa abertura sem tornar explícita uma determinação que o grego apenas pode sugerir.
- source_word: μνήσθητι
  choice: lembra-te
  rationale: Tradução direta do imperativo aoristo médio de μιμνῄσκομαι, em registro digno e amplamente compreensível.
- source_word: ὁρκισμοῦ
  choice: do juramento
  rationale: ὁρκισμός designa um juramento ou compromisso jurado. “Juramento” mantém o sentido lexical sem explicitar conteúdo pactual não declarado no verso.
- source_word: ἐκδιηγησάσθωσαν
  choice: que eles contem
  rationale: A forma é um imperativo de terceira pessoa e expressa que outros narrem ou relatem. “Que eles contem” reproduz naturalmente a força jussiva em português.
- source_word: τὰ μεγαλεῖά σου
  choice: os teus feitos grandiosos
  rationale: O plural substantivado τὰ μεγαλεῖα costuma designar grandes atos, especialmente obras divinas dignas de proclamação. “Feitos grandiosos” é idiomático e evita o literalismo obscuro de “grandezas”.
theological_decisions:
- issue: Referente da segunda pessoa e linguagem de louvor
  choice: Manter a oração como discurso dirigido a Deus por meio dos pronomes de segunda pessoa, sem acrescentar um título divino.
  alternative: Explicitar “ó Deus” ou tratar o destinatário de forma genérica.
  rationale: A lembrança do juramento e a narração dos feitos grandiosos se ajustam a uma prece dirigida a Deus, mas o grego não contém um vocativo ou título; os pronomes preservam o referente contextual sem adição interpretativa.
- issue: Incerteza textual indicada pela validação da fonte
  choice: Traduzir o texto grego fornecido e registrar em nota a incerteza textual.
  alternative: Reconstruir conjecturalmente um texto hebraico subjacente ou harmonizar o verso com outra tradição textual.
  rationale: A marcação “major_mismatch” recomenda transparência, não emenda conjectural. A tradução permanece ancorada no testemunho grego apresentado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção imperativa concisa. “Lembra-te” e “teus” mantêm coerência de segunda pessoa singular e um tom de oração. Os marcadores aparecem junto aos elementos a que se referem.
