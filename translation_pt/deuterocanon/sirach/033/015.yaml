  text: 'And so look at all the works of the Most High: two by two[a], one opposite the other.'
translation:
  language: pt
  text: 'E assim, observe todas as obras do Altíssimo: duas a duas, uma em oposição à outra[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma correspondendo à outra”. O grego pode expressar tanto oposição quanto correspondência entre pares; o contexto de contrastes emparelhados favorece a tradução no texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβλεψον
  choice: observe
  rationale: O imperativo pede atenção dirigida e consideração cuidadosa. “Observe” é natural em português moderno e conserva tanto o aspecto visual quanto o reflexivo.
- source_word: πάντα τὰ ἔργα
  choice: todas as obras
  rationale: ἔργα abrange as obras, realizações ou produções do Altíssimo. “Obras” mantém essa amplitude e se ajusta à linguagem sapiencial sobre a ordem da criação e os atos divinos.
- source_word: τοῦ ὑψίστου
  choice: do Altíssimo
  rationale: ὁ ὕψιστος é um título divino convencional. “O Altíssimo” é a forma consagrada, clara e natural em português.
- source_word: δύο δύο
  choice: duas a duas
  rationale: A repetição distributiva indica disposição em pares. “Duas a duas” preserva a estrutura do grego e concorda naturalmente com “obras”.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: uma em oposição à outra
  rationale: κατέναντι pode indicar oposição, posição correspondente ou colocação frente a frente. “Em oposição à” preserva o contraste dominante no contexto sem eliminar a possibilidade de correspondência emparelhada, registrada em nota.
theological_decisions:
- issue: Título divino ὁ ὕψιστος
  choice: o Altíssimo
  alternative: o Mais Alto
  rationale: “O Altíssimo” é o equivalente tradicional e inteligível do epíteto divino, preservando sua elevação sem acrescentar nuance doutrinária.
- issue: Relação entre as obras emparelhadas
  choice: uma em oposição à outra
  alternative: uma correspondendo à outra
  rationale: O contexto favorece pares contrastantes, mas o valor relacional de κατέναντι também permite correspondência. A tradução principal expressa o contraste, e a nota preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o paralelismo e a repetição distributiva do grego sem recorrer a linguagem arcaica.
