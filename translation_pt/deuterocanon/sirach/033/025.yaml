translation:
  language: pt
  text: Forragem, vara e cargas são para o jumento; pão, disciplina e trabalho, para o escravo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servo doméstico”. O termo grego designa uma pessoa da casa em condição servil; “escravo” preserva aqui essa condição de sujeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: forragem
  rationale: O plural grego designa alimento para animais. “Forragem” é claro em português e se ajusta especificamente ao jumento.
- source_word: ῥάβδος
  choice: vara
  rationale: Preserva a imagem concreta de uma vara usada para condução ou correção, sem explicitar além do que o grego afirma.
- source_word: φορτία
  choice: cargas
  rationale: Refere-se concretamente ao que o jumento transporta; “cargas” evita tornar a expressão indevidamente metafórica.
- source_word: ὄνῳ
  choice: o jumento
  rationale: O dativo singular indica o destinatário das coisas enumeradas. “Jumento” é corrente e natural; o artigo definido funciona bem na formulação proverbial portuguesa.
- source_word: ἄρτος
  choice: pão
  rationale: Mantém o substantivo concreto do grego e o paralelismo com a forragem destinada ao animal.
- source_word: παιδεία
  choice: disciplina
  rationale: Neste contexto de administração doméstica, abrange formação e correção; “disciplina” preserva melhor essa amplitude do que simples “instrução”.
- source_word: ἔργον
  choice: trabalho
  rationale: Tradução direta e natural para a atividade exigida no contexto doméstico.
- source_word: οἰκέτῃ
  choice: o escravo
  rationale: O termo designa aqui alguém da casa em condição servil. “Escravo” conserva a realidade de sujeição e evita suavizá-la como se fosse emprego livre.
theological_decisions:
- issue: Tradução de οἰκέτῃ no provérbio sobre a ordem doméstica antiga
  choice: o escravo
  alternative: o servo doméstico
  rationale: O texto reflete uma estrutura doméstica antiga de sujeição. “Escravo” torna visível essa condição, enquanto a nota registra a nuance de pertencimento à casa sem resolver de forma excessiva a extensão lexical do termo.
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo conciso. O verbo “são” foi explicitado apenas na primeira metade para dar fluência à construção nominal grega; a elipse permanece perceptível na segunda.
