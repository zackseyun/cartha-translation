  text: Listen to me[a], you great men of the people, and you leaders of the assembly, give ear.
translation:
  language: pt
  text: Escutem-me[a], homens de destaque do povo; e vocês, líderes da assembleia, prestem atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouçam-me, homens notáveis do povo; e vocês, dirigentes da congregação, deem ouvidos.”'
    reason: Registra alternativas lexicais possíveis para os dois verbos de audição e para os termos referentes às pessoas proeminentes, aos líderes e à comunidade reunida.
lexical_decisions:
- source_word: ἀκούσατέ
  choice: Escutem
  rationale: O imperativo aoristo plural introduz um apelo direto à audiência. “Escutem” é corrente e comunica atenção intencional.
- source_word: μεγιστᾶνες
  choice: homens de destaque
  rationale: O substantivo masculino designa homens proeminentes ou de alta posição. A expressão mantém a referência masculina sem sugerir necessariamente nobreza hereditária.
- source_word: λαοῦ
  choice: do povo
  rationale: Reproduz de modo direto o sentido coletivo e social de λαός neste contexto.
- source_word: ἡγούμενοι
  choice: líderes
  rationale: O particípio substantivado indica os que exercem liderança, sem exigir a ideia mais forte de governantes formais.
- source_word: ἐκκλησίας
  choice: assembleia
  rationale: No contexto de Sirácida, refere-se à comunidade reunida; “assembleia” evita a associação anacrônica e especificamente institucional de “igreja”.
- source_word: ἐνωτίσασθε
  choice: prestem atenção
  rationale: O segundo imperativo reforça o chamado a ouvir atentamente. A formulação é natural em português moderno e preserva a intensificação retórica.
theological_decisions:
- issue: Referência de gênero na interpelação às pessoas socialmente proeminentes
  choice: homens de destaque do povo
  alternative: notáveis do povo
  rationale: A forma grega é masculina e, neste contexto público, dirige-se a homens proeminentes. A tradução explicita essa referência sem neutralizá-la.
- issue: Sentido de ἐκκλησία
  choice: assembleia
  alternative: congregação
  rationale: A palavra designa aqui o corpo reunido, não necessariamente a instituição cristã posterior. “Assembleia” preserva esse sentido amplo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento no plural de boa legibilidade brasileira. O paralelismo entre os dois apelos à escuta foi mantido com verbos distintos, evitando tanto arcaísmo excessivo quanto linguagem eclesiástica anacrônica.
