  yaml_path: translation/deuterocanon/sirach/033/014.yaml
  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
translation:
  language: pt
  text: O oposto do mal é o bem, e o oposto da morte é a vida; assim, o oposto do piedoso é o pecador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: diante de
  rationale: A preposição repetida apresenta pares colocados frente a frente. “Diante de” preserva essa imagem e a estrutura paralela sem tornar a frase excessivamente abstrata.
- source_word: κακοῦ / ἀγαθόν
  choice: mal / bem
  rationale: Os substantivos “mal” e “bem” exprimem de modo direto e proverbial o contraste moral do grego.
- source_word: θανάτου / ζωή
  choice: morte / vida
  rationale: Equivalentes diretos que mantêm intacto o segundo par antitético.
- source_word: οὕτως
  choice: assim
  rationale: Introduz naturalmente em português o terceiro contraste como correspondente aos dois anteriores.
- source_word: εὐσεβοῦς
  choice: do piedoso
  rationale: O adjetivo substantivado descreve quem é devoto ou reverente para com Deus. “O piedoso” conserva o singular e evita acrescentar o substantivo “homem”, ausente no grego.
- source_word: ἁμαρτωλός
  choice: o pecador
  rationale: É o equivalente corrente do adjetivo usado como substantivo e mantém o contraste pessoal e singular com “o piedoso”.
theological_decisions:
- issue: Sentido de εὐσεβής no contraste com ἁμαρτωλός
  choice: piedoso
  alternative: justo; temente a Deus
  rationale: “Piedoso” conserva a ideia de devoção e reverência presente no termo grego sem reduzir seu sentido à retidão moral nem inserir uma fórmula religiosa mais específica.
- issue: Masculino singular substantivado em εὐσεβοῦς e ἁμαρτωλός
  choice: o piedoso / o pecador
  alternative: um homem piedoso / um pecador; a pessoa piedosa / a pessoa pecadora
  rationale: A tradução mantém o singular masculino formalmente presente no grego, mas não acrescenta “homem”. A nota registra que, como máxima geral, a referência pode ser expressa de modo inclusivo em português.
translation_notes:
  register: Português moderno, conciso e proverbial. A repetição de “diante de” reproduz deliberadamente a estrutura tripla do grego, enquanto o verbo “está”, implícito no original, é suprido para dar clareza e fluidez em português.
