translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Contenda» conserva o tom sapiencial sem sugerir necessariamente violência física; «para vergonha sua» mantém a concisão e a ambiguidade do grego.
