  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: pt
  text: Há também um amigo que se transforma em inimizade[a] e revelará uma contenda para sua vergonha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se torna hostil». O grego emprega o substantivo abstrato «inimizade», e não «inimigo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «revelará uma contenda como afronta contra você». A expressão grega é compacta e pode destacar tanto a contenda quanto a vergonha que sua revelação causa.'
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: amigo
  rationale: É o sentido relacional comum do termo e corresponde naturalmente ao contexto.
- source_word: μεταβαλλόμενος
  choice: que se transforma
  rationale: Expressa uma mudança de estado em curso sem reduzir a ideia ao simples resultado.
- source_word: εἰς ἔχθραν
  choice: em inimizade
  rationale: Preserva o substantivo abstrato grego, em vez de substituí-lo por «inimigo».
- source_word: μάχην
  choice: uma contenda
  rationale: No contexto social e sapiencial, indica conflito ou disputa, não necessariamente combate físico.
- source_word: ὀνειδισμοῦ σου
  choice: para vergonha sua
  rationale: Comunica a desonra ou afronta dirigida à pessoa, mantendo a formulação compacta e a flexibilidade da relação genitiva.
- source_word: ἀποκαλύψει
  choice: revelará
  rationale: Traduz diretamente a ideia de descobrir ou tornar público, sem acrescentar detalhes ausentes do grego.
