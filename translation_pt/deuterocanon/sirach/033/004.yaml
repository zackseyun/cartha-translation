  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
translation:
  language: pt
  text: Assim como foste santificado entre nós diante deles[a], assim também sejas engrandecido entre eles diante de nós[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, “foste reconhecido ou manifestado como santo entre nós à vista deles”. O passivo grego é uma expressão bíblica para Deus ser reconhecido como santo.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego está no optativo e exprime um desejo ou uma súplica: “que sejas engrandecido” também é possível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: Assim como … assim também
  rationale: Preserva com clareza a estrutura comparativa e o paralelismo do grego em português natural.
- source_word: ἐνώπιον αὐτῶν
  choice: diante deles
  rationale: Expressa presença ou percepção visual e mantém a correspondência com «diante de nós» na segunda metade.
- source_word: ἡγιάσθης
  choice: foste santificado
  rationale: Mantém o aoristo passivo e a linguagem bíblica aplicada a Deus; aqui, santificar significa reconhecer ou manifestar como santo, não tornar santo.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Indica a esfera comunitária em que Deus foi reconhecido como santo, sem sugerir transformação interior dos indivíduos.
- source_word: ἐναντίον ἡμῶν
  choice: diante de nós
  rationale: Conserva o sentido de presença ou vista e o paralelismo relacional do verso.
- source_word: μεγαλυνθείης
  choice: sejas engrandecido
  rationale: O optativo passivo exprime um desejo ou uma súplica. O subjuntivo português transmite essa força e preserva o tom elevado.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: Em paralelo com «entre nós», apresenta o outro povo como a esfera em que a grandeza de Deus deve ser reconhecida.
theological_decisions:
- issue: Sentido de ἡγιάσθης quando aplicado a Deus
  choice: Conservar «foste santificado» no texto e explicar seu sentido idiomático em nota.
  alternative: foste reconhecido como santo; manifestaste a tua santidade
  rationale: A construção não afirma que Deus tenha passado a ser santo, mas que foi reconhecido ou manifestado como santo. A formulação conserva a tensão e a forma passiva do original.
- issue: Força optativa de μεγαλυνθείης
  choice: 'Traduzir como desejo: «sejas engrandecido».'
  alternative: que sejas engrandecido; mostra-te grande
  rationale: O optativo grego formula uma súplica. O subjuntivo mantém essa modalidade sem transformar o pedido em simples afirmação ou ordem direta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com paralelismo próximo ao grego. «Foste santificado» conserva deliberadamente o idioma bíblico, esclarecido em nota; «sejas engrandecido» comunica a força de oração do optativo.
