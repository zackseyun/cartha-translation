lexical_decisions:
- source_word: δόξασον
  choice: Honra
  rationale: Imperativo singular de δοξάζω. “Honra” exprime de modo natural a ideia de atribuir honra ou glória, sem tornar a frase mais interpretativa do que o grego.
- source_word: χεῖρα
  choice: a mão
  rationale: χείρ significa diretamente “mão”. O artigo, embora não expresso no grego, é natural e necessário nesta formulação em português.
- source_word: βραχίονα
  choice: braço
  rationale: βραχίων significa comumente “braço” e pode evocar força no uso bíblico; “antebraço” seria anatômico demais neste contexto.
- source_word: δεξιόν
  choice: direito
  rationale: O adjetivo concorda com βραχίονα e é traduzido diretamente como “direito”, sem explicitar possíveis associações simbólicas.
theological_decisions:
- issue: Incerteza textual causada pela indicação de grande divergência e pela preservação apenas de uma oração fragmentária no texto grego fornecido
  choice: Traduzir diretamente apenas a oração grega preservada
  alternative: Reconstruir um texto mais amplo com base em outras edições ou versões
  rationale: A evidência grega fornecida contém somente “δόξασον χεῖρα καὶ βραχίονα δεξιόν” e está assinalada como uma grande divergência. Para manter a primazia da fonte apresentada e não acrescentar palavras sem apoio nela, a tradução não reconstrói o contexto ausente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade no Brasil. A formulação breve acompanha o caráter fragmentário da fonte fornecida.
