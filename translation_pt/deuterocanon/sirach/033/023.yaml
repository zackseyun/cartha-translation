  text: In all your works be preeminent[b][a]; do not give a blemish to your honor.
translation:
  language: pt
  text: Em tudo o que você fizer, seja excelente[a]; não manche a sua honra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobressaia” ou “seja notável”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não traga censura sobre a sua reputação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Em tudo o que você fizer
  rationale: Expressa de modo natural e abrangente o sentido de ἔργα com πᾶσι; evita a rigidez de “em todas as suas obras” neste contexto de conduta pessoal.
- source_word: γίνου
  choice: seja
  rationale: O imperativo presente de γίνομαι funciona aqui como exortação a assumir e manter determinada conduta; “seja” é claro e idiomático.
- source_word: ὑπεράγων
  choice: excelente
  rationale: O termo indica sobressair ou exceder o comum. “Excelente” preserva a força elogiosa sem impor uma comparação explícita nem sugerir supremacia absoluta.
- source_word: μὴ δῷς μῶμον
  choice: não manche
  rationale: A formulação idiomática preserva a imagem concreta de μῶμον, uma mancha, defeito ou motivo de censura, embora traduza δῷς de maneira não literal.
- source_word: ἐν τῇ δόξῃ σου
  choice: a sua honra
  rationale: Neste contexto sapiencial e ético, δόξα aponta para honra ou boa reputação; “honra” evita a possível conotação teológica excessiva de “glória”.
theological_decisions:
- issue: Sentido de δόξα no contexto ético-sapiencial
  choice: honra
  alternative: glória; reputação
  rationale: O contexto trata da conduta pessoal e de evitar censura. “Honra” mantém a dimensão social e moral do termo, enquanto “glória” poderia soar indevidamente exaltada ou teológica.
- issue: Força comparativa de ὑπεράγων
  choice: seja excelente
  alternative: sobressaia; seja superior; seja notável
  rationale: “Excelente” comunica desempenho acima do comum sem resolver o particípio como uma alegação de superioridade absoluta sobre outras pessoas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa é expressa por “você”, evitando tanto arcaísmo quanto regionalismo marcado. O paralelismo imperativo do grego foi preservado, e as alternativas lexicais relevantes aparecem em notas.
