  text: Be on guard against a wrongdoer, for he devises evil, lest he ever bring disgrace upon you.
translation:
  language: pt
  text: Guarde-se de um malfeitor, pois ele maquina maldades, para que ele não lhe cause desonra para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que ele não lhe cause reprovação para sempre».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: Guarde-se de quem pratica o mal
  rationale: O imperativo πρόσεχε, construído com ἀπό, expressa cautela e vigilância diante de alguém perigoso. A formulação escolhida é natural em português e conserva o sentido moral amplo de κακοῦργος, sem restringi-lo ao de criminoso.
- source_word: πονηρὰ τεκταίνεται
  choice: maquina maldades
  rationale: O neutro plural πονηρά designa coisas más ou planos perversos, enquanto τεκταίνεται sugere conceber ou arquitetar intencionalmente. «Maquina maldades» preserva de forma concisa a ideia de planejamento malicioso.
- source_word: μή ποτε
  choice: para que não venha a
  rationale: A expressão introduz uma consequência possível contra a qual se faz a advertência. «Não venha a» mantém esse caráter preventivo sem apresentar o resultado como certo.
- source_word: μῶμον
  choice: desonra
  rationale: μῶμος pode significar censura, reprovação, mácula ou desonra. Neste contexto, «desonra» comunica o dano à reputação que o malfeitor pode causar.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão indica duração indefinida ou permanente. «Para sempre» reproduz diretamente sua força temporal, sem reduzir o sentido a «algum dia» ou «jamais».
- source_word: δῷ σοι
  choice: trazer desonra sobre você
  rationale: Embora δῷ σοι signifique literalmente «dar a você», a colocação idiomática em português com «desonra» é «trazer desonra sobre alguém».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. «Guarde-se» conserva a força proverbial da advertência; «quem pratica o mal» evita uma designação excessivamente jurídica.
