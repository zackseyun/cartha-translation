review_pass:
  verdict: revise
  source_fidelity: A redação comunica adequadamente a advertência de πρόσεχε ἀπὸ κακούργου, o planejamento de males em πονηρὰ τεκταίνεται e a duração de εἰς τὸν αἰῶνα. Contudo, «para que não venha a trazer» deixa o sujeito de «trazer» sintaticamente pouco nítido; a oração grega indica que é o malfeitor quem pode causar a desonra/reprovação.
  naturalness: «Guarde-se» é apropriado ao registro proverbial e «maquina maldades» é compreensível. A revisão explicita o sujeito da consequência e troca «trazer desonra sobre você», construção algo calcada, por uma formulação portuguesa mais direta.
  terminology: «Malfeitor» representa bem κακούργος sem restringir o termo a um crime técnico. «Desonra» é possível para μῶμον; «reprovação» permanece uma alternativa lexical válida na nota.
  issues:
  - severity: medium
    issue: Ambiguidade sintática em «para que não venha a trazer desonra».
    rationale: Depois do imperativo dirigido ao leitor, o sujeito elíptico de «venha» pode ser momentaneamente entendido como o próprio leitor. No grego, δῷ está na terceira pessoa e se refere ao malfeitor.
  - severity: low
    issue: «Trazer desonra sobre você» é menos idiomático do que «causar-lhe desonra».
    rationale: A segunda formulação preserva o sentido causativo de δῷ σοι e soa mais natural no português moderno.
