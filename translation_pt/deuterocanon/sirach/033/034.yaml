revisions:
- from: Guarde-se de quem pratica o mal, pois ele maquina maldades, para que não venha a trazer desonra sobre você para sempre.[a]
  to: Guarde-se de um malfeitor, pois ele maquina maldades, para que ele não lhe cause desonra para sempre.[a]
  rationale: A revisão preserva o sentido e o registro do texto, mas torna explícito que o malfeitor é quem poderá causar a desonra. «Um malfeitor» reproduz de modo mais próximo o singular genérico de κακούργου, e «causar-lhe desonra» evita uma construção menos natural sem alterar a força de δῷ σοι.
