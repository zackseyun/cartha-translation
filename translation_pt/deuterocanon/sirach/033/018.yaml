  text: Understand that I have not labored for myself alone[a], but for all who seek instruction.
translation:
  language: pt
  text: Entendam que não trabalhei arduamente apenas para mim, mas para todos os que buscam instrução.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina” ou “formação”. O termo grego pode abranger tanto o ensino como a formação moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Entendam
  rationale: O imperativo aoristo plural convoca os ouvintes a compreender ou reconhecer o que está sendo dito. “Entendam” é direto, natural e preserva a força do apelo.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: não... apenas para mim
  rationale: 'O dativo indica benefício ou interesse: o esforço não foi somente em proveito do próprio autor. A formulação portuguesa comunica isso com naturalidade.'
- source_word: ἐκοπίασα
  choice: trabalhei arduamente
  rationale: κοπιάω denota trabalho cansativo ou esforço intenso. “Trabalhei arduamente” conserva essa intensidade sem recorrer a linguagem excessivamente literária.
- source_word: πᾶσιν τοῖς ζητοῦσιν
  choice: para todos os que buscam
  rationale: A expressão é inclusiva e genérica. “Todos os que buscam” reproduz de modo claro o particípio substantivado.
- source_word: παιδείαν
  choice: instrução
  rationale: παιδεία pode abranger ensino, disciplina, treinamento e formação moral. “Instrução” oferece o melhor equilíbrio entre amplitude lexical, dignidade e compreensão corrente.
