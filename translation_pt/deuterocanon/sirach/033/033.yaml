  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a slave.
translation:
  language: pt
  text: Forragem, vara e cargas são para o jumento; pão, disciplina e trabalho são para o escravo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo doméstico”; o termo grego refere-se especificamente a um escravo ou servo da casa.
    reason: Alternativa lexical que explicita a nuance doméstica de οἰκέτης.
lexical_decisions:
- source_word: χορτάσματα
  choice: forragem
  rationale: O substantivo plural designa alimento dado a animais. “Forragem” preserva a imagem concreta e é natural no contexto do jumento.
- source_word: ῥάβδος
  choice: vara
  rationale: Neste provérbio, refere-se a um instrumento de condução ou correção, não a um simples cajado de caminhada.
- source_word: φορτία
  choice: cargas
  rationale: Designa aquilo que um animal de carga transporta; “cargas” é concreto e direto.
- source_word: ὄνῳ
  choice: para o jumento
  rationale: O dativo indica referência ou destinação. “Para o jumento” reproduz naturalmente a construção proverbial.
- source_word: ἄρτος
  choice: pão
  rationale: Mantém o termo concreto do grego, embora ele também possa representar alimento de modo mais amplo.
- source_word: παιδεία
  choice: disciplina
  rationale: Abrange formação, treinamento e correção. “Disciplina” conserva tanto o aspecto formativo quanto o corretivo sem reduzir o sentido a castigo.
- source_word: ἔργον
  choice: trabalho
  rationale: Equivalente amplo e corrente para labor ou tarefa atribuída.
- source_word: οἰκέτῃ
  choice: escravo
  rationale: O termo designa especificamente um escravo ou servo pertencente à casa. “Escravo” não encobre a condição social de sujeição, enquanto a nuance doméstica é registrada em nota.
theological_decisions:
- issue: Tradução de οἰκέτῃ num contexto de subordinação doméstica
  choice: escravo
  alternative: servo doméstico
  rationale: A máxima trata do sustento, da disciplina e do trabalho de uma pessoa em condição subordinada dentro da casa. “Escravo” preserva com clareza essa realidade social; “servo doméstico” é lexicalmente possível, mas pode suavizar ou tornar ambígua a condição de sujeição.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. As duas ocorrências de “são” tornam a frase nominal grega natural em português sem alterar sua estrutura. O marcador foi colocado junto de “escravo”, termo ao qual a nota se refere.
