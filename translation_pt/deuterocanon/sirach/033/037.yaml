  source_fidelity: 'O texto preserva a estrutura e o sentido do grego: a aquisição deliberada de um amigo, repetida de modo enfático (κτήσῃ / κτῆσαι), deve ocorrer «mediante provação», seguida da advertência contra confiar precipitadamente. «Conquistares / conquista-o» é uma equivalência idiomática defensável para κτάομαι neste provérbio, sem introduzir sentido doutrinário. A nota registra adequadamente a ambiguidade contextual de ἐν πειρασμῷ.'
