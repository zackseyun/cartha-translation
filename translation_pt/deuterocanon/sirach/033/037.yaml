  terminology: «Amigo», «provação» e «confiar nele» correspondem bem aos termos gregos e ao registro sapiencial. A repetição de «conquistar» reproduz a repetição verbal grega. Embora «conquistar um amigo» possa ter matizes relacionais mais amplos no uso corrente, é apropriado neste contexto e não compromete a fidelidade.
