  yaml_path: translation/deuterocanon/sirach/033/037.yaml
  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: pt
  text: Quando conquistares um amigo, conquista-o mediante provação[a] e não te apresses a confiar nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conquista-o em tempo de provação” ou “ganha-o por meio de uma prova”. A expressão grega pode indicar tanto o meio de testar a amizade quanto uma situação de provação.
    reason: alternativa lexical e preservação de ambiguidade
lexical_decisions:
- source_word: κτήσῃ / κτῆσαι
  choice: conquistares / conquista-o
  rationale: κτάομαι significa adquirir ou ganhar. Em português, “conquistar um amigo” conserva a ideia deliberada do grego e permite reproduzir sua repetição enfática com mais naturalidade do que “adquirir um amigo”.
- source_word: φίλον
  choice: um amigo
  rationale: O substantivo está no masculino singular e designa a pessoa cuja amizade se pretende ganhar.
- source_word: ἐν πειρασμῷ
  choice: mediante provação
  rationale: πειρασμός pode indicar prova, provação ou experiência de teste. Neste conselho sapiencial, a expressão aponta para a necessidade de comprovar o caráter e a lealdade do amigo, sem excluir totalmente a ideia de uma situação de provação.
- source_word: μὴ ταχὺ ἐμπιστεύσῃς
  choice: não te apresses a confiar
  rationale: A formulação portuguesa expressa naturalmente a proibição de confiar de modo precipitado e preserva o sentido relacional de ἐμπιστεύω.
- source_word: αὐτῷ
  choice: nele
  rationale: Mantém a referência masculina singular do texto grego e retoma claramente “um amigo”.
theological_decisions:
- issue: Referência masculina singular na instrução sapiencial
  choice: Manter “amigo”, “-o” e “nele”
  alternative: Empregar formas neutras ou plurais, como “uma pessoa” e “nela”
  rationale: O grego apresenta um indivíduo representativo no masculino singular. A tradução conserva essa forma sem transformá-la em afirmação exclusiva sobre homens.
- issue: Sentido de ἐν πειρασμῷ
  choice: “mediante provação”, com alternativa em nota
  alternative: “em tempo de provação” ou “por meio de uma prova”
  rationale: A construção grega admite tanto valor instrumental quanto circunstancial. O texto principal adota uma leitura adequada ao contexto, enquanto a nota preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Conquistar um amigo” evita o tom possessivo pouco natural de “adquirir um amigo”, preservando, porém, a repetição proverbial do verbo grego. “Não te apresses a confiar” comunica com naturalidade a advertência contra a confiança precipitada.
