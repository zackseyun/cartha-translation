base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: pt
  text: Tem misericórdia do povo, Senhor, chamado pelo teu nome[a], e de Israel; torna-o semelhante a um primogênito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Chamado pelo teu nome» é uma expressão bíblica que indica que o povo pertence a Deus e é identificado com ele.
    reason: cultural_note
  - marker: b
    text: 'A construção grega é sintaticamente comprimida. Também pode ser entendida como referência ao que Deus já fez por Israel: «a quem tornaste semelhante a um primogênito».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Tem misericórdia
  rationale: O aoristo imperativo de ἐλεέω introduz uma súplica direta. A expressão é natural em português e mantém o tom solene de oração.
- source_word: λαόν
  choice: do povo
  rationale: O substantivo sem artigo refere-se naturalmente, neste contexto, ao povo da aliança. Não se acrescenta «teu», pois essa ideia, embora implícita, não está expressa no substantivo grego.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε é vertido como forma direta de tratamento. Em português, «Senhor» dispensa a interjeição «ó» para conservar solenidade sem soar arcaico.
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: chamado pelo teu nome
  rationale: Mantém de modo transparente o idioma bíblico que identifica o povo como pertencente a Deus, sem substituí-lo por uma interpretação explicativa no texto principal.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: ὃν
  choice: torna-o
  rationale: O pronome relativo masculino singular retoma Israel. A construção foi reorganizada com pronome oblíquo para produzir português natural e preservar Israel como objeto de ὁμοίωσον.
- source_word: πρωτογόνῳ
  choice: a um primogênito
  rationale: O dativo exprime o termo da comparação. «Primogênito» preserva a linguagem bíblica e evita acrescentar «filho», palavra não expressa separadamente no grego.
- source_word: ὁμοίωσον
  choice: torna-o semelhante
  rationale: A forma transmitida é aoristo imperativo, segunda pessoa do singular, e por isso é vertida como nova petição, não como descrição inequívoca de uma ação passada.
theological_decisions:
- issue: A condição de Israel como primogênito
  choice: O texto principal apresenta uma súplica para que Deus torne Israel semelhante a um primogênito.
  alternative: 'A construção pode ser entendida como referência ao modo como Deus já tratou Israel: «a quem tornaste semelhante a um primogênito».'
  rationale: A forma verbal grega é formalmente imperativa, mas a sintaxe comprimida e a tradição interpretativa permitem relacionar a cláusula à condição filial já conferida a Israel. A tradução principal segue a morfologia, enquanto a nota preserva a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o idioma bíblico «chamado pelo teu nome» e o termo tradicional «primogênito». O ponto e vírgula torna clara a nova petição exigida pela forma imperativa de ὁμοίωσον, sem ocultar na nota a leitura alternativa.
