review_pass:
  verdict: revise
  source_fidelity: A redação principal preserva adequadamente o sujeito representativo e os dois verbos finais. Contudo, כִּי אִם tem força mais naturalmente adversativa/qualificadora (“mas”) do que explicativa (“pois”), e a nota deve distinguir com precisão a leitura interpretativa “provação” da leitura sugerida pela vocalização transmitida, “fuga”.
  naturalness: O português é claro e digno. “Não será atingido pelo mal” exprime de modo mais idiomático a ocorrência adversa indicada por פגע com רָע do que “não se deparará com o mal”, que pode sugerir apenas encontro casual.
  terminology: “Yahweh” reproduz adequadamente o Tetragrama. “Mal” mantém a amplitude entre maldade e desgraça; não deve ser restringido a dano físico.
  issues:
  - severity: medium
    issue: Conector “pois, mesmo” para כִּי אִם
    rationale: 'A construção introduz melhor uma qualificação ou contraste: o temente não é abandonado ao mal, mas, na situação difícil, retorna/escapa. “Mas” evita apresentar a segunda oração como causa da primeira.'
  - severity: medium
    issue: Descrição imprecisa da alternativa textual na nota
    rationale: A forma vocalizada בְּנוּסוֹ aponta diretamente para “em sua fuga”; “provação” é uma interpretação contextual ou leitura alternativa, não o sentido imediato dessa vocalização. A nota deve expor isso sem resolver a incerteza.
  revised_text: Quem teme Yahweh não será atingido pelo mal[a], mas, na provação, voltará e escapará.
  revised_footnotes:
  - marker: a
    text: 'O hebraico desta frase é difícil, sobretudo na expressão traduzida como “na provação”. A forma vocalizada pode ser entendida como “em sua fuga”; uma tradução possível seria: “mas, em sua fuga, voltará e escapará”. O paralelo grego fornecido não corresponde a este versículo.'
    reason: alternative_reading
  revision_rationale: A revisão torna o conector mais próximo da função qualificadora de כִּי אִם, melhora a construção portuguesa para a ação adversa de רָע e corrige a explicação da ambiguidade de בְּנוּסוֹ. Mantêm-se a leitura contextual “provação”, os dois verbos hebraicos distintos (“voltará e escapará”) e a alternativa de “fuga” em nota, sem impor uma solução à dificuldade textual.
