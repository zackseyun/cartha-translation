  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: pt
  text: Quem teme Yahweh não será atingido pelo mal[a], mas, na provação, voltará e escapará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta frase é difícil, sobretudo na expressão traduzida como “na provação”. A forma vocalizada pode ser entendida como “em sua fuga”; uma tradução possível seria: “mas, em sua fuga, voltará e escapará”. O paralelo grego fornecido não corresponde a este versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Quem teme Yahweh
  rationale: A expressão participial descreve uma pessoa caracterizada pela reverência a Yahweh. A formulação é natural em português e mantém a força representativa do singular.
- source_word: לֹא יִפְגַּע רָע
  choice: não se deparará com o mal
  rationale: פגע pode indicar encontrar ou deparar-se com algo, enquanto רָע abrange tanto o mal quanto a desgraça. A tradução evita restringir o sentido apenas a dano físico.
- source_word: כִּי אִם
  choice: pois, mesmo
  rationale: 'No contexto, a expressão qualifica a afirmação anterior: a pessoa temente pode passar por provação, mas dela escapa. A formulação conserva essa tensão sem transformar o provérbio em promessa de imunidade a todo sofrimento.'
- source_word: בְּנוּסוֹ
  choice: na provação
  rationale: A forma hebraica é difícil. O sentido de prova ou provação produz uma sequência coerente com o livramento subsequente, embora a vocalização transmitida também possa sugerir fuga; essa incerteza é registrada em nota.
- source_word: שָׁב
  choice: voltará
  rationale: שוב significa voltar ou retornar. Mantém-se um verbo próprio, sem o reduzir silenciosamente a mero advérbio, embora neste contexto também possa ter o valor de “novamente”.
- source_word: וְנִמְלָט
  choice: e escapará
  rationale: נמלט expressa escapar ou ser livrado. “Escapará” preserva o caráter concreto da expressão sem explicitar um agente não mencionado.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” conserva o nome divino em vez de substituí-lo por um título.
- issue: Alcance da promessa de proteção contra רָע
  choice: não se deparará com o mal
  alternative: nunca sofrerá mal algum
  rationale: A segunda parte do versículo admite uma situação de provação seguida de escape. A redação mantém a confiança proverbial sem eliminar essa tensão ou prometer imunidade absoluta ao sofrimento.
- issue: Relação entre provação e escape
  choice: mesmo na provação, voltará e escapará
  alternative: ao fugir, tornará a escapar
  rationale: A leitura escolhida segue o sentido contextual mais coerente, mas não oculta a dificuldade textual nem a possibilidade de entender בְּנוּסוֹ em relação à fuga.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Deparar-se com o mal” conserva a amplitude de רָע, e a nota torna explícita a incerteza textual sem sobrecarregar o versículo.
