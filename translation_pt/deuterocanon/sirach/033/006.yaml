lexical_decisions:
- source_word: πλὴν σοῦ
  choice: além de ti
  rationale: 'Expressa com naturalidade a exclusão indicada por πλήν: não existe outro Deus fora do Senhor.'
- source_word: ἐγκαίνισον σημεῖα
  choice: Renova os sinais
