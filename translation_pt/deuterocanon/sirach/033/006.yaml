- source_word: ἀλλοίωσον θαυμάσια
  choice: faz novas maravilhas
  rationale: O sentido básico do verbo é mudar ou tornar diferente; em português, esta formulação comunica de modo natural o pedido por maravilhas renovadas ou diferentes, sem sugerir que maravilhas anteriores sejam corrigidas.
theological_decisions:
- issue: Exclusividade divina em οὐκ ἔστι θεὸς πλὴν σοῦ
  choice: não há Deus além de ti
  alternative: não existe deus senão tu
  rationale: Preserva a afirmação direta da incomparabilidade e exclusividade de Deus, sem acrescentar explicação doutrinária.
- issue: Relação entre sinais e maravilhas
  choice: Renova os sinais e faz novas maravilhas
  alternative: Renova os sinais e muda as maravilhas
  rationale: Mantém os dois pedidos paralelos, evitando que 'mudar as maravilhas' soe como alteração corretiva de feitos anteriores.
