  text: Raise up an adversary[a], and wipe out an enemy.
translation:
  language: pt
  text: Levanta um adversário[a] e elimina um inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste trecho é incerto nos metadados do projeto (“divergência importante”). A tradução segue de perto a redação preservada na edição de Swete, sem tentar reconstruí-la a partir de outras tradições textuais.
    reason: textual_variant
lexical_decisions:
- source_word: ἔξαρον
  choice: Levanta
  rationale: Imperativo de ἐξαίρω, que pode indicar levantar, erguer ou fazer surgir. “Levanta” conserva a formulação concisa e sua ambiguidade, sem decidir se se trata de elevação física ou de incitação à ação.
- source_word: ἀντίδικον
  choice: um adversário
  rationale: O substantivo pode designar a parte contrária numa disputa ou processo e, em sentido mais amplo, um oponente. “Adversário” preserva essa amplitude e corresponde ao paralelismo hostil com ἐχθρόν.
- source_word: ἔκτριψον
  choice: elimina
  rationale: Imperativo de ἐκτρίβω, literalmente “apagar por fricção” ou “desgastar”, e, em contexto hostil, destruir ou fazer desaparecer. “Elimina” comunica a força do verbo em português atual sem reproduzir uma expressão excessivamente coloquial.
- source_word: ἐχθρόν
  choice: um inimigo
  rationale: Equivalente corrente para uma pessoa hostil. O singular sem artigo é naturalmente expresso como “um inimigo” nesta frase breve e sentenciosa.
theological_decisions:
- issue: Incerteza textual indicada pela validação “major_mismatch” do testemunho grego
  choice: Traduzir o texto grego preservado em Swete como dois imperativos breves, sem ampliação contextual.
  alternative: Reconstruir a linha com base em outra forma grega ou em uma possível Vorlage hebraica de tradições textuais diferentes.
  rationale: O grego fornecido é breve e sintaticamente inteligível, mas os metadados assinalam uma divergência importante. Por isso, a tradução segue de perto o testemunho apresentado e não adota uma reconstrução conjectural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A concisão e o paralelismo do grego foram preservados; “Levanta” mantém a ambiguidade do primeiro imperativo, enquanto “elimina” transmite com naturalidade a força destrutiva do segundo.
