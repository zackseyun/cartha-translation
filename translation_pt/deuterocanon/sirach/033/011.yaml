  text: In the wrath of fire[a], let the one who is saved be consumed[b], and let those who wrong your people find destruction.
translation:
  language: pt
  text: Na ira do fogo, seja consumido aquele que escapa[a], e encontrem a destruição os que cometem injustiça contra o teu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser traduzido por “aquele que está sendo salvo” ou, de modo mais idiomático, “o sobrevivente”. Neste contexto, pode referir-se a alguém que escapou apenas para enfrentar novo juízo.
    reason: lexical_alternative
  - marker: b
