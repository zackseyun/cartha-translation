    reason: textual_variant
lexical_decisions:
- source_word: ἐν ὀργῇ πυρός
  choice: Na ira do fogo
  rationale: Mantém de perto a expressão genitiva, incomum e vigorosa, sem decidir se o fogo personifica a ira ou se é seu instrumento.
- source_word: καταβρωθήτω
  choice: seja consumido
  rationale: Reproduz o valor passivo e injuntivo do imperativo; no contexto do fogo, “consumido” é natural e conserva a ideia subjacente de ser devorado.
- source_word: ὁ σωζόμενος
  choice: aquele que escapa
  rationale: Embora o particípio também possa significar “aquele que está sendo salvo”, neste contexto de juízo pode designar quem escapou de uma destruição anterior. A formulação preserva a força participial e a tensão de que nem o fugitivo escapa ao juízo final.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: os que cometem injustiça contra o teu povo
  rationale: Expressa claramente a ação de praticar injustiça contra um objeto pessoal, sem reduzir o sentido a uma designação genérica como “malfeitores”.
- source_word: εὕροισαν ἀπώλειαν
  choice: encontrem a destruição
  rationale: Preserva a imagem verbal de “encontrar” e comunica o valor desiderativo ou injuntivo do optativo, bem como o caráter decisivo de ἀπώλεια.
theological_decisions:
- issue: Ambiguidade de ὁ σωζόμενος
  choice: aquele que escapa
  alternative: aquele que está sendo salvo; o sobrevivente
  rationale: O contexto de imprecação favorece a ideia de alguém que escapou inicialmente, mas a nota conserva a possibilidade lexical de salvação em processo, sem resolver silenciosamente a tensão.
- issue: Desalinhamento do texto-fonte com o contexto esperado de Sirácida 33:11
  choice: Traduzir diretamente o grego fornecido como uma petição de juízo
  alternative: Harmonizar com outra tradição textual ou numeração de versículos
  rationale: A primazia da fonte original fornecida exige que se traduza este testemunho tal como está, registrando em nota a discrepância textual em vez de importar o conteúdo de outra tradição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a expressão deliberadamente incomum “ira do fogo” e o tom imprecatório por meio dos subjuntivos “seja” e “encontrem”. Empregou-se “teu povo” para manter a interpelação direta e o registro bíblico sem arcaísmo excessivo.
