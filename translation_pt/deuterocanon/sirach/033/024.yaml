  text: On the day your life's days come to an end[a], and at the time of death, distribute your inheritance.
translation:
  language: pt
  text: No dia em que se completarem os dias da sua vida[a] e no momento da morte, distribua a sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no dia da conclusão dos dias da sua vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: No dia em que
  rationale: Expressa de modo natural em português a referência temporal específica introduzida por ἐν com o dativo.
- source_word: συντελείας
  choice: se completarem
  rationale: O substantivo indica conclusão ou chegada ao fim; a forma verbal torna a expressão idiomática sem perder a imagem dos dias completados.
- source_word: ἡμερῶν ζωῆς σου
  choice: os dias da sua vida
  rationale: Preserva a formulação concreta e plural do grego, em vez de reduzi-la simplesmente a 'sua vida'.
- source_word: καιρῷ
  choice: momento
  rationale: Neste contexto, designa a ocasião determinada ou apropriada; 'momento' combina naturalmente com a morte.
- source_word: τελευτῆς
  choice: morte
  rationale: Embora possa significar 'fim', aqui o contexto do término da vida favorece o sentido concreto de morte.
- source_word: διάδος
  choice: distribua
  rationale: O imperativo de διαδίδωμι comunica a repartição ou entrega de bens entre destinatários.
- source_word: κληρονομίαν
  choice: herança
  rationale: É o equivalente português direto para os bens patrimoniais a serem transmitidos.
