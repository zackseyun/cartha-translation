  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Ponha-o
  rationale: 'O imperativo de ἐμβάλλω significa literalmente lançar ou colocar dentro, mas, com εἰς ἐργασίαν, forma uma expressão idiomática: pôr alguém para trabalhar. “Ponha-o” preserva a força imperativa em português natural.'
- source_word: αὐτὸν
  choice: -o
  rationale: O pronome acusativo masculino singular retoma, no contexto, um servo ou escravo do sexo masculino. O pronome “o” mantém o gênero e o referente do grego.
- source_word: εἰς ἐργασίαν
  choice: para trabalhar
  rationale: ἐργασία indica trabalho, labor ou ocupação. Na construção com ἔμβαλε, “para trabalhar” é idiomático e claro, sem a rigidez de “dentro do trabalho”.
- source_word: ἵνα μὴ ἀργῇ
  choice: para que não fique ocioso
  rationale: ἀργέω significa estar sem atividade, inativo ou ocioso. “Fique ocioso” expressa diretamente o sentido sem acrescentar a censura moral mais forte de “preguiçoso”.
theological_decisions:
- issue: Manutenção do objeto masculino singular em contexto de servidão
  choice: -o / ocioso
  alternative: uma formulação sem marca de gênero
  rationale: O grego emprega formas masculinas singulares e o contexto se refere a um subordinado masculino. A tradução preserva essa especificidade histórica e gramatical, sem ampliá-la nem atenuá-la.
- issue: Grau de literalidade de ἔμβαλε αὐτὸν εἰς ἐργασίαν
  choice: Ponha-o para trabalhar
  alternative: Lance-o ao trabalho
  rationale: A formulação escolhida comunica naturalmente em português o sentido idiomático da construção grega, mantendo a ordem direta e a força do imperativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ponha-o para trabalhar” é corrente sem ser coloquial demais; “ocioso” conserva a precisão sem atribuir necessariamente preguiça. O ponto e vírgula acompanha o caráter de segmento contínuo do versículo na fonte fornecida.
