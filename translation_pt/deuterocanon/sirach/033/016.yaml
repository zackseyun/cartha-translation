  text: And I too kept watch last of all[a], like one who gleans behind the grape harvesters.
translation:
  language: pt
  text: E eu também, por último, mantive-me desperto[a], como quem rebusca atrás dos colhedores de uvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vigiei» ou «permaneci acordado»; o verbo grego pode enfatizar tanto estar desperto como manter-se vigilante e, neste contexto, provavelmente sugere trabalho diligente até mais tarde.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: E eu também
  rationale: A crase de καί + ἐγώ reúne a ligação com o contexto e a ênfase aditiva; «E eu também» preserva ambas de modo natural.
- source_word: ἔσχατος
  choice: o último de todos
  rationale: O adjetivo tem aqui valor predicativo ligado ao sujeito e indica que o autor veio depois dos demais.
- source_word: ἠγρύπνησα
  choice: fiquei vigilante
  rationale: O verbo pode indicar permanecer acordado ou manter-se atento. «Fiquei vigilante» conserva essa amplitude e, no contexto, sugere dedicação tardia sem transformar a imagem em simples insônia.
- source_word: ὡς
  choice: como
  rationale: Introduz uma comparação e é o marcador idiomático apropriado em português.
- source_word: καλαμώμενος
  choice: quem recolhe o que resta
  rationale: O particípio descreve a ação de juntar remanescentes após a colheita. A formulação explicita essa prática em linguagem corrente, sem impor ao verbo um objeto mais específico do que o texto fornece.
- source_word: ὀπίσω
  choice: atrás
  rationale: Mantém a imagem espacial concreta de alguém que segue os trabalhadores da colheita.
- source_word: τρυγητῶν
  choice: dos que colhem as uvas
  rationale: O substantivo designa especificamente os trabalhadores da vindima; a expressão é clara em português moderno e preserva a imagem da colheita de uvas.
