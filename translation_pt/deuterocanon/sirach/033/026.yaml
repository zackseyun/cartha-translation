  text: Put your slave to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: pt
  text: Ponha seu escravo para trabalhar[a], e você encontrará descanso; deixe as mãos dele ociosas, e ele buscará a liberdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego παιδί significa literalmente “criança” ou “menino”, mas aqui se refere a um dependente doméstico sob autoridade. “Servo” também seria possível, porém o contexto de buscar a liberdade favorece o sentido mais forte, “escravo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι
  choice: Ponha ... para trabalhar
  rationale: O imperativo aoristo de ἐργάζομαι tem aqui sentido transitivo na construção idiomática com ἐν + dativo. A formulação preserva a força da ordem em português natural.
- source_word: ἐν παιδί
  choice: seu escravo
  rationale: Embora παιδί possa significar literalmente “criança” ou “menino”, neste contexto designa um dependente doméstico sujeito à autoridade. A referência posterior a buscar liberdade torna evidente a condição de escravizado; “seu” explicita de modo idiomático a relação pressuposta pelo contexto.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: você encontrará descanso
  rationale: Reproduz diretamente o futuro e seu objeto, mantendo a imagem concreta de encontrar descanso.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: deixe as mãos dele ociosas
  rationale: ἄνες, de ἀνίημι, significa aqui afrouxar ou deixar sem atividade. A tradução conserva a imagem concreta das “mãos” e comunica que se trata de cessar o trabalho.
- source_word: ζητήσει ἐλευθερίαν
  choice: ele buscará a liberdade
  rationale: “Buscará” corresponde a ζητήσει sem intensificá-lo como exigência formal, e “liberdade” traduz diretamente ἐλευθερίαν.
theological_decisions:
- issue: Tradução de παιδί no contexto de trabalho doméstico compulsório
  choice: escravo
  alternative: servo; menino
  rationale: O contraste entre trabalho imposto e busca de liberdade torna saliente a condição de escravidão. “Escravo” expressa essa realidade social sem suavizá-la, enquanto “servo” poderia ocultar o caráter da sujeição e “menino” privilegiaria um sentido lexical inadequado ao contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta e vocabulário claro. “Você” torna explícito o sujeito singular da exortação; “as mãos dele ociosas” preserva a imagem grega sem soar excessivamente literal.
