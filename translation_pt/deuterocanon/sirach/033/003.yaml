base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/003.yaml
  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: pt
  text: O homem de discernimento entende a palavra de Yahweh[a], e sua instrução[b] é como os Urim no peitoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico deste versículo difere profundamente do paralelo grego preservado, que diz: “Levanta a tua mão contra nações estrangeiras, e que elas vejam o teu poder.” Esta tradução segue aqui o texto hebraico sobrevivente como testemunho principal.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “e a lei [ou instrução] dele é como os Urim no peitoral”, caso o possessivo se refira a Yahweh, e não ao homem de discernimento.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: o homem de discernimento
  rationale: Preserva o singular masculino representativo do hebraico e expressa de modo natural a percepção sábia indicada por נָבוֹן.
- source_word: יָבִין
  choice: entende
  rationale: Verbo corrente e direto para a compreensão correta ou discernimento expresso por בין neste contexto sapiencial.
- source_word: דְּבַר יְהֹוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר aqui é mais naturalmente uma palavra ou comunicação divina; o nome próprio da aliança, יהוה, é transliterado como Yahweh.
- source_word: וְתוֹרָתוֹ
  choice: e sua instrução
  rationale: “Instrução” conserva o sentido pedagógico de תּוֹרָה sem restringi-lo indevidamente a legislação. O pronome possessivo mantém em português a possível ambiguidade do sufixo hebraico.
- source_word: כְּאוּרִים
  choice: como os Urim
  rationale: Urim é o termo cultual técnico ligado à consulta sacerdotal; a transliteração evita reduzi-lo à tradução etimológica “luzes”.
- source_word: בַּחֹשֶׁן
  choice: no peitoral
  rationale: Designa o peitoral sacerdotal que continha ou acompanhava os Urim; “peitoral” é a forma bíblica portuguesa usual e não o apresenta explicitamente como armadura.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama; “Yahweh” preserva-o como nome próprio, sem substituí-lo por um título.
- issue: Referente do sufixo em וְתוֹרָתוֹ
  choice: “sua instrução”, entendida primariamente como a instrução do homem de discernimento
  alternative: a lei/instrução de Yahweh
  rationale: O antecedente pessoal imediato favorece o homem de discernimento, mas a referência a Yahweh também é gramatical e semanticamente possível. O texto português conserva a ambiguidade e a nota explicita as duas leituras.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa própria da literatura sapiencial. Mantêm-se o nome divino “Yahweh” e o termo cultual “Urim”; “peitoral” segue o uso bíblico corrente. A ambiguidade do possessivo hebraico é preservada no corpo do texto e esclarecida em nota.
