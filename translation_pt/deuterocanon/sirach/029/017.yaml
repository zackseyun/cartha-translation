  text: And one who is ungrateful in mind will abandon the one who rescued him[a].
translation:
  language: pt
  text: E quem é ingrato no íntimo abandonará aquele que o livrou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “aquele que livrou”; o objeto “o” está implícito.'
    reason: implicit_object
lexical_decisions:
- source_word: ἀχάριστος
  choice: ingrato
  rationale: Expressa diretamente a falta de gratidão, com força moral clara e linguagem corrente em português.
- source_word: ἐν διανοίᾳ
  choice: no íntimo
  rationale: A expressão caracteriza a disposição interior da pessoa. “No íntimo” preserva esse aspecto sem produzir a formulação pouco natural “na mente”.
- source_word: ἐγκαταλείψει
  choice: abandonará
  rationale: Mantém o valor futuro e o sentido forte de deixar alguém desamparado ou faltar-lhe com lealdade.
- source_word: ῥυσάμενον
  choice: aquele que o livrou
  rationale: O particípio aoristo substantivado designa quem efetuou o livramento. “Livrou” conserva o sentido de resgatar ou tirar de uma situação difícil; o pronome “o” explicita em português o objeto subentendido no grego.
theological_decisions:
- issue: Referência genérica de gênero
  choice: quem é ingrato
  alternative: o homem ingrato
  rationale: O grego emprega formas masculinas singulares, mas não apresenta um substantivo explícito equivalente a “homem”. A construção com “quem” mantém a referência pessoal e proverbial sem acrescentar ao texto um substantivo ausente.
- issue: Objeto implícito de ῥυσάμενον
  choice: aquele que o livrou
  alternative: aquele que livrou
  rationale: O grego não exprime separadamente o objeto do livramento, mas o contexto sintático o pressupõe. O português requer sua explicitação para indicar naturalmente que a pessoa abandonada é quem antes a livrou.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “No íntimo” conserva a ênfase na disposição interior sem tornar a frase artificial.
