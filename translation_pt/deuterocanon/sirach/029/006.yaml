base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: pt
  text: Se conseguir, mal recuperará a metade e a considerará como um achado[a]; caso contrário, terá ficado sem o seu dinheiro e terá ganhado um inimigo sem proveito algum[b]. Este lhe retribuirá com maldições e insultos e, em vez de honra, lhe dará desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “como um ganho inesperado”. O grego diz literalmente “como um achado”: até recuperar metade é tratado como encontrar dinheiro que já se considerava perdido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou “terá adquirido nele um inimigo, sem benefício”. A expressão grega salienta a ironia: além de perder dinheiro, o credor ganha a hostilidade do outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: Se conseguir
  rationale: ἰσχύω expressa capacidade ou possibilidade. “Se conseguir” é natural no contexto da tentativa de recuperar o empréstimo sem especificar indevidamente os meios usados.
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: mal recuperará a metade
  rationale: μόλις indica grande dificuldade ou resultado mínimo, e κομίζω, neste contexto, refere-se a receber de volta o que foi emprestado.
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: a considerará como um achado
  rationale: 'Mantém a imagem de εὕρεμα: até a recuperação de metade será vista como dinheiro inesperadamente encontrado.'
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: ficará privado do seu dinheiro
  rationale: A formulação comunica o resultado para o credor sem pressupor roubo violento nem fraude deliberada, sentidos possíveis mas mais específicos de ἀποστερέω.
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: terá ganhado um inimigo sem proveito algum
  rationale: κτάομαι significa adquirir ou ganhar; a expressão irônica οὐ δωρεάν salienta que a hostilidade foi obtida com perda, sem qualquer benefício.
- source_word: κατάρας καὶ λοιδορίας
  choice: maldições e insultos
  rationale: Equivalência atual e clara para as duas formas de fala hostil.
- source_word: ἀποδώσει αὐτῷ
  choice: lhe retribuirá
  rationale: ἀποδίδωμι significa devolver, pagar ou retribuir. “Retribuirá” preserva a ironia de que, no lugar do pagamento da dívida, vêm abusos.
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: em vez de honra ... desonra
  rationale: O contraste trata de estima social; “honra” e “desonra” preservam diretamente a antítese.
theological_decisions:
- issue: Enquadramento moral do empréstimo malsucedido
  choice: 'Apresentar as consequências concretas para o credor: recuperação parcial ou inexistente, perda financeira, inimizade e abuso verbal.'
  alternative: Transformar o texto numa condenação geral da usura, numa acusação explícita de fraude deliberada ou numa doutrina ampla sobre ingratidão humana.
  rationale: O grego descreve uma situação prática e seus resultados sociais. A tradução não acrescenta uma conclusão doutrinária que o versículo não enuncia.
- issue: Alternância implícita dos participantes
  choice: Manter o credor como foco na primeira parte e usar “Este” para o inimigo adquirido na frase seguinte.
  alternative: Nomear explicitamente “o credor” e “o devedor” em todas as orações.
  rationale: Os participantes são inferidos pelo contexto no grego. A solução portuguesa dá clareza mínima sem inserir repetidamente substantivos ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a ironia econômica do original e evita-se linguagem jurídica ou confessional excessivamente específica.
