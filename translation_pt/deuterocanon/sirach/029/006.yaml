  terminology: «Mal recuperará», «achado», «maldições», «insultos», «honra» e «desonra» são escolhas adequadas. «Sem proveito algum» comunica bem a ironia de οὐ δωρεάν; a nota deve, porém, evitar a formulação excessivamente literal «não de graça», que em português moderno pode sugerir apenas gratuidade monetária.
