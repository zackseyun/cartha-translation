review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: o imperativo para socorrer a pessoa pobre, a medida da ajuda segundo sua carência e a proibição de fazê-la partir sem receber nada correspondem ao grego. Contudo, «por causa do mandamento» pode sugerir uma causa circunstancial mais do que a motivação normativa expressa por χάριν; «em atenção ao mandamento» reproduz melhor esse valor sem especificar qual mandamento é visado.'
  naturalness: «Ampare o pobre» e «não o mande embora de mãos vazias» são naturais, claras e adequadas ao registro. «Conforme sua necessidade» é ligeiramente mais fluente e menos coloquial que «conforme a necessidade dele».
  terminology: «Mandamento», «pobre», «ampare» e «de mãos vazias» são escolhas apropriadas. A nota atual, porém, apresenta «virar-se para longe» como sentido básico de ἀποστρέφω e propõe «não lhe vire as costas», formulação que não é o equivalente mais direto da construção transitiva grega neste contexto. A nota deve oferecer uma alternativa portuguesa semanticamente precisa.
  issues:
  - severity: low
    issue: Valor de χάριν ἐντολῆς
    rationale: «Por causa do mandamento» é possível, mas pode soar meramente causal. «Em atenção ao mandamento» exprime de modo mais claro a motivação ou consideração normativa de χάριν, mantendo a referência indefinida quanto à identificação do mandamento.
  - severity: low
    issue: Nota lexical de ἀποστρέψῃς αὐτὸν κενόν
    rationale: A alternativa «não lhe vire as costas, deixando-o sem nada» é mais interpretativa e a explicação etimológica «virar-se para longe» não descreve com precisão a função transitiva exigida aqui. Uma alternativa como «não o despeça sem nada» preserva diretamente a ideia contextual.
