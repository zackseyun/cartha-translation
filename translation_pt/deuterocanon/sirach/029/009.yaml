base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/009.yaml
  text: For the sake of the commandment[a], help the poor, and according to his need do not send him away empty.
translation:
  language: pt
  text: Em atenção ao mandamento, ampare o pobre e, conforme sua necessidade, não o mande embora de mãos vazias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o despeça sem nada”.'
    reason: Alternativa lexical para ἀποστρέψῃς αὐτὸν κενόν; conserva a ideia de fazer a pessoa partir sem receber ajuda.
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: por causa do mandamento
  rationale: χάριν com genitivo expressa motivo ou razão. A formulação conserva o peso definido de ἐντολῆς sem especificar se se trata de um preceito concreto da Torá ou do mandamento divino em sentido geral.
- source_word: ἀντιλαβοῦ
  choice: ampare
  rationale: O imperativo médio de ἀντιλαμβάνομαι indica tomar alguém sob cuidado ou prestar-lhe auxílio efetivo. “Ampare” transmite apoio ativo com linguagem natural e digna.
- source_word: πένητος
  choice: o pobre
  rationale: πένης designa uma pessoa pobre ou necessitada. O singular representativo “o pobre” preserva a forma do grego e é corrente em português.
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: conforme a necessidade dele
  rationale: 'ἔνδεια indica carência, falta ou necessidade, e κατά comunica correspondência: a ajuda deve considerar a necessidade real da pessoa.'
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: não o mande embora de mãos vazias
  rationale: No contexto, ἀποστρέφω descreve rejeitar ou fazer alguém partir, enquanto κενόν indica que parte sem receber nada. A expressão portuguesa é concreta e idiomática.
theological_decisions:
- issue: Referência de “o mandamento”
  choice: Manter a referência definida, mas não especificada
  alternative: Explicitar “o mandamento de Deus”, identificar um preceito da Torá ou traduzir simplesmente como “uma instrução”
  rationale: O grego usa ἐντολῆς no singular, com força definida, mas não identifica um mandamento específico nem explicita aqui seu autor. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Ampare” evita uma paráfrase extensa, e “de mãos vazias” comunica naturalmente a imagem concreta do original.
