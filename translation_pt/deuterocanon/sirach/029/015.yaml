  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
translation:
  language: pt
  text: Não se esqueça dos favores de quem foi seu fiador[a], pois ele deu a própria vida por você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos benefícios daquele que se tornou seu fiador”. O termo grego designa quem garante a dívida ou obrigação de outra pessoa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a sua alma”; aqui, o sentido é “a sua vida” ou “a si mesmo”, entregue em seu favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: favores
  rationale: O plural indica benefícios ou atos concretos de bondade recebidos, não a ideia teológica abstrata de graça.
- source_word: ἐγγύου
  choice: de quem foi seu fiador
  rationale: ἐγγύου refere-se à pessoa que assumiu a garantia da dívida ou obrigação de outra; esta formulação é clara em português e explicita naturalmente a relação com o destinatário.
- source_word: μὴ ἐπιλάθῃ
  choice: Não se esqueça
  rationale: Reproduz de modo direto e idiomático a proibição de esquecer os benefícios recebidos.
- source_word: ἔδωκεν
  choice: deu
  rationale: Mantém o sentido simples de δίδωμι, sem acrescentar conotação sacrificial não exigida pelo contexto.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a própria vida
  rationale: Neste contexto de risco pessoal assumido pelo fiador, ψυχή designa a vida ou a própria pessoa, e não formula uma afirmação antropológica sobre a alma.
- source_word: ὑπὲρ σοῦ
  choice: por você
  rationale: Expressa de forma natural tanto benefício quanto atuação em favor do destinatário.
theological_decisions:
- issue: Possível leitura teológica excessiva de ψυχή
  choice: a própria vida
  alternative: a sua alma
  rationale: O contexto trata do risco social e financeiro assumido pelo fiador. 'Vida' conserva a força do idioma grego sem introduzir uma doutrina sobre a alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Fiador' preserva o contexto financeiro e social; 'a própria vida' comunica naturalmente a gravidade do risco assumido.
