  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: pt
  text: Guarde a esmola em seus cofres[a], e ela o livrará de toda aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Encerre a caridade em seus depósitos”; literalmente, o grego diz “feche a esmola em seus depósitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de todo mal” ou “de todo dano”.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύγκλεισον
  choice: Guarde
  rationale: O imperativo significa literalmente fechar ou encerrar. No contexto de bens postos em lugar seguro, “guarde” comunica com naturalidade a ideia de conservar algo protegido, sem perder a metáfora.
- source_word: ἐλεημοσύνην
  choice: a esmola
  rationale: No grego judaico helenístico, o substantivo costuma designar a ajuda material dada aos necessitados. “Esmola” mantém esse sentido concreto, em vez de reduzi-lo à qualidade abstrata da misericórdia.
- source_word: ἐν τοῖς ταμείοις σου
  choice: em seus cofres
  rationale: ταμεῖον pode indicar depósito, câmara ou tesouraria. “Cofres” expressa de modo claro e figurado um lugar seguro onde se guardam bens valiosos.
- source_word: ἐξελεῖταί
  choice: livrará
  rationale: O verbo significa tirar de uma situação perigosa ou libertar dela. “Livrará” é corrente, digno e evita acrescentar ao verso uma terminologia soteriológica mais específica.
- source_word: ἐκ πάσης κακώσεως
  choice: de toda aflição
  rationale: κακώσις pode indicar sofrimento, adversidade, dano ou maus-tratos. “Aflição” preserva a amplitude da dificuldade da qual a pessoa é livrada.
theological_decisions:
- issue: A eficácia protetora atribuída à esmola
  choice: e ela o livrará de toda aflição
  alternative: e isso o livrará de todo mal
  rationale: O grego atribui diretamente à esmola uma função de livramento. A tradução conserva essa afirmação e sua tensão teológica, sem transformá-la em simples consequência moral nem acrescentar qualificações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Esmola” conserva a concretude histórica da ajuda aos necessitados; “cofres” torna inteligível a imagem de algo valioso guardado em segurança. Os pronomes seguem o tratamento formal em terceira pessoa.
