  text: 'These things are grievous to a man who has understanding: the reproach of a household and the insult of a lender.'
translation:
  language: pt
  text: 'Essas coisas são penosas para quem tem entendimento: a censura dos de casa e o insulto do credor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα
  choice: penosas
  rationale: Expressa algo difícil e aflitivo de suportar, preservando o peso do adjetivo grego sem soar artificial.
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  choice: para quem tem entendimento
  rationale: Formulação inclusiva e natural que conserva o sentido de uma pessoa dotada de discernimento prático.
- source_word: ἐπιτίμησις οἰκίας
  choice: a censura dos de casa
  rationale: ἐπιτίμησις indica repreensão ou censura; οἰκίας pode apontar para a casa entendida como seus moradores. A formulação mantém essa relação sem acrescentar uma identificação específica.
- source_word: ὀνειδισμὸς δανιστοῦ
  choice: o insulto do credor
  rationale: ὀνειδισμός denota afronta, ultraje ou censura desonrosa; δανιστής é aquele que empresta, aqui naturalmente 'credor'.
theological_decisions:
- issue: Referência de οἰκίας
  choice: dos de casa
  alternative: de uma casa
  rationale: O genitivo é conciso e admite mais de uma nuance. 'Dos de casa' oferece sentido inteligível no contexto de humilhações sofridas, sem introduzir conteúdo doutrinário.
- issue: Força de ὀνειδισμός
  choice: insulto
  alternative: afronta; censura
  rationale: '''Insulto'' preserva a dimensão de desonra pessoal e acompanha a distinção provável em relação a ἐπιτίμησις.'
translation_notes:
  register: Português moderno, digno e acessível, com estrutura proverbial concisa. Evitou-se 'homem' como termo genérico porque ἀνθρώπῳ permite naturalmente 'quem', sem perda de sentido.
