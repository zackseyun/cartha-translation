  yaml_path: translation/deuterocanon/sirach/029/024.yaml
  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: pt
  text: Uma vida miserável é ir de uma casa para outra[a]; e, onde residir como estrangeiro[b], não abrirá a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma vida desgraçada é passar de uma casa para outra”. O grego pode ser traduzido de modo mais literal, mas a expressão descreve a instabilidade de viver de uma casa para outra.'
    reason: lexical_alternative
  - marker: b
    text: “Residir como estrangeiro” traduz um verbo que indica viver como forasteiro, sem pertencer plenamente à casa.
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: uma vida miserável
  rationale: Neste contexto, πονηρά qualifica a vida como penosa ou desgraçada, não necessariamente como moralmente má.
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: andar de casa em casa
  rationale: Expressa com naturalidade a instabilidade de quem passa continuamente de um lar para outro, preservando a imagem grega.
- source_word: παροικήσει
  choice: morar como estrangeiro
  rationale: παροικέω indica residir sem pleno pertencimento, na condição de forasteiro ou hóspede; a formulação mantém essa marginalidade social.
- source_word: οὐκ ἀνοίξει στόμα
  choice: não abrirá a boca
  rationale: Mantém o idioma vívido do grego e sugere que a pessoa dependente não tem liberdade ou posição para falar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a mudança implícita para a terceira pessoa na segunda oração, tal como no grego, sem explicitar um sujeito que o original deixa subentendido.
