  text: Better is the life of a poor man under shelter than splendid food in another's house[a][b].
translation:
  language: pt
  text: Melhor é a vida de um pobre sob um teto[a] do que comida requintada na casa de outros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O particípio grego nesta expressão é textual ou lexicalmente difícil; tomado em seu sentido habitual, significa “parecendo” ou “sendo considerado”. A tradução segue o sentido aparente do provérbio: é melhor ter segurança modesta do que depender de outros para refeições luxuosas.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “pratos requintados entre estranhos” ou “no que pertence a outros”. A expressão grega pode referir-se de modo mais geral a pessoas ou bens alheios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: Melhor é
  rationale: Mantém a forma comparativa e o tom proverbial de sabedoria em português natural.
- source_word: βίος πτωχοῦ
  choice: a vida de um pobre
  rationale: βίος aqui abrange a vida ou condição de vida; o masculino singular do grego é preservado sem acrescentar especificações.
- source_word: ὑπὸ σκέπην
  choice: sob um teto
  rationale: Expressa de modo idiomático a imagem de abrigo e alojamento modesto, sem pressupor propriedade.
- source_word: δοκῶν
  choice: não expresso separadamente no texto
  rationale: O particípio transmitido, normalmente entendido como “parecendo” ou “sendo considerado”, é difícil no contexto. A tradução segue o sentido aparente do provérbio e registra a dificuldade em nota, sem inserir uma interpretação obscura no corpo do texto.
- source_word: ἢ
  choice: do que
  rationale: Equivalente português normal da conjunção em uma comparação introduzida por κρείσσων.
- source_word: ἐδέσματα λαμπρά
  choice: comida requintada
  rationale: ἐδέσματα designa alimentos ou pratos preparados, e λαμπρά comunica esplendor ou luxo; “comida requintada” transmite naturalmente o contraste.
- source_word: ἐν ἀλλοτρίοις
  choice: na casa de outros
  rationale: O plural substantivado pode significar entre pessoas alheias ou no que pertence a outros. No contexto de abrigo e alimentação, “na casa de outros” conserva a noção de dependência sem restringi-la a uma só pessoa.
