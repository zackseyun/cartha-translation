translation:
  language: pt
  text: Cumpra a sua palavra[a] e seja fiel a ele; em todo tempo, você encontrará aquilo de que precisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mantenha firme a sua palavra e mostre-se digno de confiança em relação a ela”, entendendo “ele” de modo mais abstrato como referência à palavra empenhada ou ao compromisso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στερέωσον
  choice: Cumpra
  rationale: O imperativo de στερεόω significa firmar, estabelecer ou confirmar. No contexto de empréstimos e obrigações, “cumpra” comunica naturalmente a ideia de tornar firme a palavra empenhada mediante sua observância.
- source_word: λόγον
  choice: a sua palavra
  rationale: λόγος se refere aqui, com maior probabilidade, ao compromisso verbal assumido. “A sua palavra” preserva a expressão grega e soa natural em português.
- source_word: πιστώθητι
  choice: seja fiel
  rationale: O imperativo passivo/médio exprime mostrar-se fiel, digno de confiança ou confiável. “Seja fiel” mantém tanto a concisão quanto a dimensão moral da confiabilidade.
- source_word: μετʼ αὐτοῦ
  choice: a ele
  rationale: Embora μετά literalmente sugira “com”, em português “seja fiel a ele” expressa de modo idiomático a relação com a pessoa envolvida no compromisso. A possível referência mais abstrata à palavra ou ao acordo é preservada em nota.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: A expressão abrange toda ocasião ou momento; “em todo tempo” conserva essa amplitude e o registro sapiencial.
- source_word: εὑρήσεις
  choice: você encontrará
  rationale: Mantém o sentido direto do futuro de εὑρίσκω, sem explicitar indevidamente o modo pelo qual a necessidade será suprida.
- source_word: τὴν χρείαν σου
  choice: aquilo de que precisa
  rationale: χρεία designa necessidade ou aquilo que é necessário. Esta formulação é clara e idiomática em português atual.
