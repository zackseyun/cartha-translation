  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: pt
  text: Guarde o seu tesouro segundo os mandamentos do Altíssimo, e ele lhe trará mais proveito do que o ouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: Guarde
  rationale: O imperativo aoristo de τίθημι significa literalmente pôr ou colocar; com “tesouro”, “guarde” transmite de modo natural a ideia de depositá-lo ou armazená-lo prudentemente.
- source_word: τὸν θησαυρόν σου
  choice: o seu tesouro
  rationale: Mantém o sentido comum de θησαυρός como tesouro ou riqueza armazenada, sem restringi-lo explicitamente a esmolas.
- source_word: κατʼ ἐντολὰς
  choice: segundo os mandamentos
  rationale: Reproduz o plural grego ἐντολάς e expressa conformidade com as ordens divinas em português corrente.
- source_word: Ὑψίστου
  choice: do Altíssimo
  rationale: Forma tradicional e clara do título divino Ὕψιστος em português.
- source_word: λυσιτελήσει σοι
  choice: lhe trará mais proveito
  rationale: Expressa o sentido de ser vantajoso ou proveitoso para alguém e preserva a linguagem econômica da comparação.
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: mais ... do que o ouro
  rationale: Mantém diretamente a construção comparativa grega e o contraste com o ouro.
theological_decisions:
- issue: Se o versículo deve ser explicitamente limitado à prática de dar esmolas
  choice: Manter a formulação ampla sobre guardar o tesouro em conformidade com os mandamentos do Altíssimo
  alternative: 'Explicitar: “Dê esmolas e assim guarde um tesouro...”'
  rationale: Embora o contexto trate de empréstimos e generosidade, o texto grego deste versículo não menciona esmolas diretamente; a tradução evita inserir essa aplicação específica no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e as imagens do grego foram preservadas sem sacrificar a naturalidade.
