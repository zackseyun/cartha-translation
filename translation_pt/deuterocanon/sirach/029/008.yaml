  text: But be patient with the humble[a], and do not keep him waiting for almsgiving.
translation:
  language: pt
  text: Mas seja paciente com o humilde e não o deixe esperando por uma esmola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o faça esperar ao dar esmola”. O verbo grego pode significar adiar ou prolongar o assunto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz uma ressalva ou contraste com a orientação anterior de modo natural e fiel à força adversativa do grego.
- source_word: ἐπὶ ταπεινῷ
  choice: com o necessitado
  rationale: ταπεινός pode indicar alguém humilde, socialmente inferior, pobre ou aflito. No contexto de empréstimos e ajuda material, “necessitado” comunica a condição social em vista sem atribuir necessariamente uma virtude moral.
- source_word: μακροθύμησον
  choice: seja paciente
  rationale: O imperativo pede paciência e tolerância prolongada; esta formulação é clara, atual e digna.
- source_word: ἐπʼ ἐλεημοσύνην
  choice: pela esmola
  rationale: No uso judaico-grego, ἐλεημοσύνη frequentemente designa ajuda material dada ao necessitado. “Esmola” preserva o caráter concreto da dádiva.
- source_word: μὴ παρελκύσῃς
  choice: não o faça esperar
  rationale: O verbo pode significar adiar, prolongar ou fazer demorar. Como o objeto é uma pessoa, esta formulação expressa naturalmente a demora imposta a ela.
- source_word: αὐτόν
  choice: o
  rationale: O pronome masculino singular retoma o necessitado mencionado na primeira oração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Necessitado” foi preferido a “humilde” para evitar que a expressão seja entendida apenas como uma qualidade moral, embora o termo grego permita ambas as nuances.
