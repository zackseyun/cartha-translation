review_pass:
  verdict: revise
  source_fidelity: A construção adversativa («Mas») e os imperativos são bem transmitidos. Contudo, «necessitado» restringe ταπεινός à necessidade material e perde a ambiguidade do grego, que pode referir-se à pessoa humilde, baixa ou socialmente desfavorecida. «Humilde» preserva melhor essa amplitude, sem excluir o contexto de ajuda material.
  naturalness: A redação é clara e natural. «Não o faça esperar pela esmola» é idiomático; «não o deixe esperando por uma esmola» torna mais explícita, em português corrente, a ideia de demora imposta à pessoa.
  terminology: «Esmola» corresponde adequadamente a ἐλεημοσύνη neste contexto. «Humilde» é preferível a «necessitado» por manter a margem semântica do termo-fonte.
  issues:
  - severity: medium
    issue: «necessitado» estreita o sentido de ταπεινός.
    rationale: Embora o contexto permita uma referência a alguém pobre ou necessitado, ταπεινός também pode significar «humilde» ou «baixo/aflito». A tradução não deve resolver essa nuance em favor de uma leitura exclusivamente econômica.
  - severity: low
    issue: A nota alternativa não conserva com precisão o objeto pessoal do verbo grego.
    rationale: «Não adie a esmola para ele» desloca o foco para a esmola, ao passo que αὐτόν é a pessoa que não deve ser feita esperar.
  revised_text: Mas seja paciente com o humilde e não o deixe esperando por uma esmola.[a]
