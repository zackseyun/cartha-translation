translation:
  language: pt
  text: O fundamento da vida é água, pão, roupa e uma casa que cubra a nudez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vergonha” ou “indecência”. O termo grego pode indicar nudez, aquilo que não convém expor ou a vergonha associada a essa exposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: O fundamento da vida
  rationale: Ἀρχή pode indicar começo, origem ou fundamento. Nesta máxima sobre necessidades básicas, “fundamento” comunica o sentido contextual sem transformar a expressão em uma lista explicitamente interpretativa de “necessidades”.
- source_word: ὕδωρ
  choice: água
  rationale: Equivalente concreto e direto.
- source_word: ἄρτος
  choice: pão
  rationale: Preserva o substantivo concreto grego; embora possa representar alimento em sentido amplo, não há necessidade de explicitar isso no texto.
- source_word: ἱμάτιον
  choice: roupa
  rationale: O singular grego tem valor coletivo neste contexto; “roupa” é natural no português moderno e mantém a referência genérica ao vestuário.
- source_word: οἶκος
  choice: uma casa
  rationale: Mantém a imagem concreta do grego, em vez do mais interpretativo “abrigo”.
- source_word: καλύπτων
  choice: que cubra
  rationale: Expressa naturalmente em português o particípio presente que modifica “casa” e conserva sua função de proteção contra a exposição.
- source_word: ἀσχημοσύνην
  choice: a nudez
  rationale: No contexto de roupa e moradia, o termo aponta concretamente para a exposição corporal que deve ser coberta. A amplitude semântica relacionada a vergonha e indecência é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com vocabulário concreto. “Fundamento” evita que “começo da vida” seja entendido apenas em sentido cronológico, sem perder o valor de ἀρχή como base ou princípio. O marcador [a] aparece no texto principal.
