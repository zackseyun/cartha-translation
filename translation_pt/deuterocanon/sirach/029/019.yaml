  text: A sinner who falls into surety and pursues contracts will fall into lawsuits[a][b].
translation:
  language: pt
  text: Um pecador que assume fiança[a] e busca empreitadas cairá em processos judiciais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, assume a responsabilidade de garantir a dívida ou outra obrigação de alguém.
    reason: cultural_note
  - marker: b
    text: Ou «cairá em julgamentos» ou «em disputas judiciais». O grego κρίσεις pode referir-se de modo amplo a processos, decisões ou controvérsias judiciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλός
  choice: O pecador
  rationale: O substantivo singular tem valor genérico. «O pecador» conserva a caracterização moral sem acrescentar especificação de gênero no restante da frase.
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: que se envolve como fiador
  rationale: ἐγγύη designa fiança ou garantia, em especial a responsabilidade assumida pela obrigação de outra pessoa. A formulação comunica naturalmente a ideia em português, embora não reproduza literalmente a metáfora de «cair em».
- source_word: διώκων
  choice: corre atrás de
  rationale: A expressão preserva a ideia de busca ativa e insistente do particípio grego, em linguagem atual e compreensível.
- source_word: ἐργολαβίας
  choice: contratos
  rationale: O termo pode indicar empreitadas, negócios ou compromissos contratuais. «Contratos» é conciso e se ajusta ao contexto de obrigações financeiras.
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: acabará em processos judiciais
  rationale: κρίσεις pode abranger julgamentos, litígios ou procedimentos judiciais. No contexto de fiança e contratos, «processos judiciais» expressa o sentido jurídico provável, enquanto a nota preserva a amplitude lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Envolve como fiador» torna explícita uma prática jurídica antiga ainda reconhecível; «corre atrás» conserva o impulso verbal de διώκων sem excessiva formalidade.
