base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: pt
  text: A fiança arruinou muitos que prosperavam[a] e os sacudiu como uma onda do mar; expulsou homens poderosos de suas terras, e eles vaguearam entre nações estrangeiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que seguiam retamente». O particípio grego pode referir-se aos que avançavam em boa direção ou aos que prosperavam.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐγγύη
  choice: a fiança
  rationale: O substantivo designa a garantia assumida pela dívida de outra pessoa. «Fiança» é o termo jurídico-financeiro mais natural e conciso em português.
- source_word: ἀπώλεσεν
  choice: arruinou
  rationale: No contexto, o verbo indica levar à perda ou à ruína, sem exigir a ideia de morte física.
- source_word: κατευθύνοντας
  choice: que seguiam por um caminho seguro
  rationale: A expressão preserva a imagem de avançar em direção reta e, ao mesmo tempo, comunica que a vida ou os negócios dessas pessoas iam bem, sem reduzir a palavra exclusivamente à retidão moral ou à prosperidade.
- source_word: ἐσάλευσεν
  choice: os sacudiu
  rationale: Mantém a ideia de abalar ou fazer oscilar e combina naturalmente com a comparação marítima seguinte.
- source_word: ὡς κῦμα θαλάσσης
  choice: como uma onda do mar
  rationale: Reprodução próxima e natural da comparação grega no singular.
- source_word: ἄνδρας δυνατούς
  choice: homens poderosos
  rationale: Retém tanto a referência masculina explícita de ἄνδρας quanto a noção de força, capacidade ou posição expressa por δυνατούς.
- source_word: ἀπῴκισεν
  choice: expulsou de sua terra
  rationale: Expressa o afastamento forçado do lugar ou país de origem e prepara a referência subsequente à peregrinação entre povos estrangeiros.
- source_word: ἐπλανήθησαν
  choice: vaguearam
  rationale: Neste contexto de deslocamento geográfico, indica andar sem residência estável, não engano moral.
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: entre nações estrangeiras
  rationale: Tradução clara da permanência ou peregrinação entre povos que não eram os seus.
theological_decisions:
- issue: Ambiguidade de κατευθύνοντας
  choice: que seguiam por um caminho seguro
  alternative: que eram íntegros; que prosperavam
  rationale: O particípio pode sugerir seguir em linha reta ou ter os assuntos bem encaminhados. A tradução conserva a metáfora direcional e evita decidir sem necessidade entre retidão moral e prosperidade.
- issue: Linguagem masculina em ἄνδρας δυνατούς
  choice: homens poderosos
  alternative: pessoas poderosas; os poderosos
  rationale: O grego emprega explicitamente ἄνδρας, por isso a referência masculina foi preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Fiança» preserva o contexto jurídico-financeiro; a estrutura paralela e a imagem da onda foram mantidas.
