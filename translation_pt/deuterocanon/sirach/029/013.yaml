  text: More than a strong shield and more than a mighty spear, it will fight for you against an enemy.
translation:
  language: pt
  text: Mais do que um escudo forte e mais do que uma lança poderosa, lutará[a] por você contra um inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não repete aqui o sujeito. O sentido é que aquilo que foi elogiado no versículo anterior é personificado como quem luta em seu favor. Conforme a compreensão do contexto, pode-se explicitar como “sua bondade” ou “sua garantia”.
    reason: Esclarece o sujeito gramatical implícito sem eliminar a ambiguidade do original.
lexical_decisions:
- source_word: ὑπὲρ
  choice: mais do que
  rationale: Nas duas ocorrências diante de armas, a preposição tem valor comparativo e expressa superioridade em eficácia ou valor.
- source_word: ἀσπίδα κράτους
  choice: um escudo forte
  rationale: A expressão usa um genitivo de qualidade; esta forma mantém o sentido de força em português claro e natural.
- source_word: δόρυ ἀλκῆς
  choice: uma lança poderosa
  rationale: ἀλκή comunica força ou capacidade de defesa e combate; “poderosa” preserva o paralelismo sem recorrer a linguagem arcaica.
- source_word: κατέναντι ἐχθροῦ
  choice: contra um inimigo
  rationale: O contexto é de oposição hostil. Como ἐχθροῦ não tem artigo no texto grego fornecido, o indefinido “um inimigo” é apropriado.
- source_word: πολεμήσει
  choice: lutará
  rationale: O futuro ativo indica que o sujeito figurado combaterá em favor do destinatário.
- source_word: ὑπὲρ σοῦ
  choice: por você
  rationale: 'Aqui ὑπὲρ tem sentido benefativo: agir em favor ou em defesa do destinatário.'
- source_word: sujeito implícito de πολεμήσει
  choice: sujeito não expresso
  rationale: O português permite conservar o sujeito implícito do grego, evitando especificar indevidamente se se trata da bondade, da garantia ou de outra realidade mencionada no contexto anterior.
theological_decisions:
- issue: Sujeito implícito retomado do versículo anterior
  choice: Manter o sujeito não expresso no texto principal e esclarecer a ambiguidade em nota.
  alternative: Inserir “ela”, “isso”, “sua bondade” ou “sua garantia”.
  rationale: O grego não repete o sujeito. Mantê-lo implícito preserva a personificação e evita resolver uma referência que o próprio versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção sem sujeito expresso é possível em português e reproduz melhor a continuidade contextual do grego do que um pronome neutro artificial.
