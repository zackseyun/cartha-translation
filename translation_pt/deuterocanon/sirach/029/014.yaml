  yaml_path: translation/deuterocanon/sirach/029/014.yaml
  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
translation:
  language: pt
  text: Um homem bom será fiador do seu próximo, mas quem perdeu a vergonha[a] o abandonará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o sem-vergonha». O grego diz literalmente: «quem perdeu a vergonha».'
    reason: Alternativa lexical que explicita a equivalência idiomática sem apagar a imagem verbal do grego.
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: um homem bom
  rationale: Mantém o masculino singular de ἀνήρ e expressa ἀγαθός como qualidade moral de modo direto e natural.
- source_word: ἐγγυήσεται
  choice: será fiador de
  rationale: No contexto financeiro do capítulo, o verbo indica assumir responsabilidade como garantia por outra pessoa; «ser fiador de» é a formulação jurídica e corrente em português.
- source_word: τὸν πλησίον
  choice: seu próximo
  rationale: πλησίον designa a pessoa próxima no âmbito social e ético; «próximo» preserva essa amplitude tradicional sem restringi-la ao vizinho residencial.
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: quem perdeu a vergonha
  rationale: Reproduz a imagem explícita do particípio perfeito ἀπολωλεκώς com αἰσχύνην, em vez de reduzi-la ao adjetivo interpretativo «sem-vergonha».
- source_word: καταλείψει αὐτόν
  choice: o abandonará
  rationale: καταλείπω comunica deixar para trás ou desamparar; «abandonará» expressa claramente a quebra de lealdade, e o pronome mantém a referência masculina do grego.
theological_decisions:
- issue: Masculino singular na instrução sapiencial
  choice: um homem bom
  alternative: uma pessoa boa
  rationale: Embora a máxima possa ter aplicação representativa, o texto grego emprega especificamente ἀνήρ no masculino singular; a tradução conserva essa forma sem ampliar silenciosamente sua expressão gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Será fiador» preserva a linguagem financeira central ao contexto; «seu próximo» mantém o alcance ético e relacional do original.
