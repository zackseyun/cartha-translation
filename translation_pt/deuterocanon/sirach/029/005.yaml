  to: Até receber o dinheiro, ele beijará a mão do próximo e, por causa do dinheiro do próximo, falará em tom humilde.[a] Mas, na hora de pagar, adiará o pagamento e, em pagamento, dará palavras de descaso[b] e culpará o prazo.
  rationale: A revisão melhora a idiomaticidade e torna explícito, sem acrescentar sentido substantivo, que o adiamento se refere ao pagamento. «Prazo» transmite melhor a acusação dirigida ao tempo determinado para a quitação do que «momento».
