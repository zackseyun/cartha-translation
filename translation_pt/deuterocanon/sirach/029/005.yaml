  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: pt
  text: Até receber o dinheiro, ele beijará a mão do próximo e, por causa do dinheiro do próximo, falará em tom humilde.[a] Mas, na hora de pagar, adiará o pagamento e, em pagamento, dará palavras de descaso[b] e culpará o prazo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “humilhará a voz”, expressão que indica falar em tom baixo e submisso.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo ligado a “dar em pagamento” é irônico: em vez de devolver o dinheiro, ele oferece apenas palavras e desculpas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: Até receber o dinheiro
  rationale: A expressão marca o período anterior à obtenção do empréstimo. “O dinheiro” explicita o objeto subentendido pelo contexto imediato.
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: beijará a mão do próximo
  rationale: Preserva a imagem concreta de deferência exagerada; “do próximo” esclarece o referente do pronome grego à luz da oração seguinte.
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον
  choice: por causa do dinheiro do próximo
  rationale: Expressa de modo natural o motivo do comportamento servil, sem reduzir a frase a uma simples referência temática.
- source_word: ταπεινώσει φωνήν
  choice: falará em tom humilde
  rationale: Traduz o sentido idiomático de literalmente “humilhará a voz”, isto é, falar de maneira baixa e submissa.
- source_word: ἐν καιρῷ ἀποδόσεως
  choice: na hora de pagar
  rationale: Forma corrente e clara para o momento em que a dívida deve ser devolvida.
- source_word: παρελκύσει χρόνον
  choice: ficará protelando
  rationale: Comunica a ação deliberada e continuada de ganhar tempo ou adiar o pagamento.
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: em pagamento, dará palavras de descaso
  rationale: 'Mantém o jogo irônico de ἀποδώσει: em vez de devolver dinheiro, o devedor oferece palavras marcadas por negligência ou indiferença.'
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: culpará o momento
  rationale: Preserva a personificação das circunstâncias temporais como alvo da culpa, sem especificar quais desculpas são apresentadas.
