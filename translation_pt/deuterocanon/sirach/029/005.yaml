    issue: «ficará protelando» não indica claramente aquilo que é protelado.
    rationale: παρελκύσει χρόνον significa literalmente prolongar/arrastar o tempo; no contexto, adiar o pagamento é uma forma natural e precisa de expressá-lo.
  - severity: low
    issue: «culpará o momento» é pouco idiomático.
    rationale: τὸν καιρὸν αἰτιάσεται atribui a culpa ao tempo ou prazo; «culpará o prazo» é mais natural em contexto de dívida e preserva a ambiguidade sobre a desculpa concreta.
