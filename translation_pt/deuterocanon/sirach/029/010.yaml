  text: Lose silver for a brother and a friend[a], and do not let it rust under a stone to destruction.
translation:
  language: pt
  text: Perde a prata por um irmão e um amigo, e não deixes que ela enferruje[a] debaixo de uma pedra até se perder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se corroa». O verbo grego é difícil; a imagem indica que o dinheiro escondido e sem uso se deteriora ou acaba desperdiçado, em vez de servir para ajudar outros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλεσον
  choice: Perde
  rationale: 'O imperativo aoristo de ἀπόλλυμι conserva a força paradoxal do conselho: é preferível aceitar a perda da riqueza em benefício de alguém próximo. «Gasta» seria mais explícito, mas atenuaria a ideia deliberadamente forte de abrir mão do bem.'
- source_word: ἀργύριον
  choice: a prata
  rationale: Mantém a imagem concreta e proverbial do grego, embora o termo também designe dinheiro.
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: por um irmão e um amigo
  rationale: διά com acusativo indica aqui benefício ou consideração por alguém. Os substantivos sem artigo são traduzidos sem acrescentar um possessivo ausente do grego.
- source_word: μὴ ἰωθῇ
  choice: não deixes que ela enferruje
  rationale: O verbo raro e difícil sugere deterioração. «Enferruje» preserva a imagem antiga de dinheiro inutilizado por ficar escondido, sem tentar corrigir a linguagem segundo a metalurgia moderna.
- source_word: ὑπὸ τὸν λίθον
  choice: debaixo de uma pedra
  rationale: Reproduz diretamente a imagem de dinheiro escondido ou entesourado.
- source_word: εἰς ἀπώλειαν
  choice: até se perder
  rationale: 'Exprime de maneira natural em português o resultado final: a prata guardada acaba em perda ou inutilidade.'
