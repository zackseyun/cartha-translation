lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: com pouco e com muito
  rationale: A construção com ἐπί e dativo indica aqui as circunstâncias ou a quantidade em que se deve conservar uma disposição favorável. A formulação mantém o contraste conciso entre pouco e muito sem explicitar além do grego.
- source_word: εὐδοκίαν
  choice: satisfeito
  rationale: O substantivo pode significar boa vontade, agrado ou satisfação. Na expressão com ἔχε, descreve uma disposição de agrado ou aceitação; «satisfeito» comunica esse sentido de modo natural em português.
- source_word: ἔχε
  choice: esteja
  rationale: Embora o verbo signifique literalmente «tenha», o português expressa com mais naturalidade a locução εὐδοκίαν ἔχε por meio do imperativo de estado «esteja satisfeito».
