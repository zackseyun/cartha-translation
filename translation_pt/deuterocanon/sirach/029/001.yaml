  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
translation:
  language: pt
  text: Quem pratica a misericórdia emprestará ao seu próximo, e quem o ampara com a própria mão guarda os mandamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: Quem pratica a misericórdia
  rationale: A expressão de sabor semítico indica exercer misericórdia de modo concreto, e não apenas senti-la. “Pratica a misericórdia” preserva esse caráter ativo em português natural e digno.
- source_word: δανιεῖ
  choice: emprestará
  rationale: O verbo está no futuro do indicativo e significa conceder um empréstimo. O futuro foi preservado, podendo expressar a conduta característica que decorre da misericórdia.
- source_word: τῷ πλησίον
  choice: ao seu próximo
  rationale: Em contexto ético, πλησίον designa o próximo. A formulação é reconhecível e mantém a dimensão relacional do grego.
- source_word: ὁ ἐπισχύων
  choice: quem o ampara
  rationale: ἐπισχύω pode significar fortalecer, sustentar ou apoiar. “Ampara” comunica auxílio concreto sem eliminar a imagem da mão que vem em seguida.
- source_word: τῇ χειρὶ αὐτοῦ
  choice: com a própria mão
  rationale: A expressão instrumental foi conservada de modo idiomático. “Própria” esclarece que αὐτοῦ retoma o agente e destaca sua ajuda pessoal e concreta.
- source_word: τηρεῖ ἐντολάς
  choice: guarda os mandamentos
  rationale: τηρέω com ἐντολή exprime observar fielmente. “Guarda os mandamentos” preserva o peso moral e religioso usual em Sirácida.
theological_decisions:
- issue: Se ἐντολάς deve ser entendido genericamente como ordens ou, no contexto sapiencial, como os mandamentos de Deus
  choice: os mandamentos
  alternative: mandamentos; ordens
  rationale: Embora o grego não tenha artigo, o contexto de Sirácida favorece a categoria reconhecida dos mandamentos divinos. O artigo em português produz uma expressão natural sem acrescentar uma identificação denominacional.
- issue: Força do futuro δανιεῖ
  choice: emprestará
  alternative: empresta
  rationale: O futuro morfológico foi mantido, evitando corrigir o original a partir da camada inglesa. Ele pode ter valor sentencioso ou indicar a consequência prática da misericórdia, ambiguidade que a tradução conserva.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Registro sapiencial digno, com paralelismo preservado. Evitou-se uma nota herdada da camada inglesa porque nela o marcador parece ligado à primeira oração, embora a alternativa descrita pertença à segunda; a tradução “ampara com a própria mão” já comunica o sentido sem exigir nota.
