  text: Empreste ao seu próximo quando ele estiver necessitado e, por sua vez, pague ao seu próximo no tempo devido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  choice: Empreste
  rationale: Imperativo direto e corrente que expressa com precisão o ato de conceder um empréstimo.
- source_word: τῷ πλησίον
  choice: ao seu próximo
  rationale: Preserva a linguagem ética tradicional de proximidade comunitária e mantém a repetição presente no grego.
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: quando ele estiver necessitado
  rationale: Expressa naturalmente a ideia temporal de prestar ajuda no momento da necessidade da outra pessoa.
- source_word: πάλιν
  choice: por sua vez
  rationale: 'No contexto, indica reciprocidade: quem toma emprestado também deve cumprir sua obrigação.'
- source_word: ἀπόδος
  choice: pague
  rationale: No contexto de empréstimo, significa devolver ou quitar o que se recebeu; “pague” é claro e natural em português.
- source_word: εἰς τὸν καιρόν
  choice: no tempo devido
  rationale: Conserva a referência ao cumprimento oportuno sem acrescentar a ideia não explicitada de um prazo formalmente combinado.
