revisions:
- from: Siga adiante[a], forasteiro; ponha a mesa em ordem e, se tiver alguma coisa em suas mãos, dê-me de comer com ela.
  to: Vá adiante[a], forasteiro; ponha a mesa em ordem e, se tiver alguma coisa na sua mão, alimente-me com isso.
  rationale: A revisão corrige o singular de «mão» e substitui uma expressão final artificial por uma formulação idiomática que mantém o sentido de alimentar/dar alimento, a relação direta com o destinatário e a referência indefinida ao que ele tem consigo. A nota existente é preservada, pois assinala de modo apropriado a variação contextual possível de Πάρελθε.
