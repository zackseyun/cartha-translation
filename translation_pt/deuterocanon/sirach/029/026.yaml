review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os imperativos, o tratamento direto e o tom áspero do grego. Contudo, «em suas mãos» altera o singular ἐν τῇ χειρί σου («na sua mão»), e «dê-me de comer com ela» é sintaticamente pouco natural, além de tornar «alguma coisa» indevidamente feminino por meio de «ela».
  naturalness: «Vá adiante» é um imperativo moderno e natural que mantém o tom de dispensa ou ordem. «Ponha a mesa em ordem» é claro e corresponde bem a κόσμησον τράπεζαν. «Alimente-me com isso» é natural em português e conserva a ordem direta de ψώμισόν με.
  terminology: «Forasteiro» traduz bem πάροικε neste contexto, preservando a condição de alguém de fora sem introduzir o tecnicismo «estrangeiro residente» ou a suavização de «hóspede». A nota sobre Πάρελθε mantém alternativas legítimas e assinala corretamente a incerteza direcional do verbo.
  issues:
  - severity: medium
    issue: Número de «mãos»
    rationale: O grego traz ἐν τῇ χειρί σου, literalmente «na sua mão», no singular. A tradução deve conservar esse dado concreto quando não há motivo idiomático forte para pluralizá-lo.
  - severity: medium
    issue: Formulação final pouco natural e referente pronominal inadequado
    rationale: «Dê-me de comer com ela» soa artificial em português e «ela» força gênero feminino para o indefinido «alguma coisa». «Alimente-me com isso» transmite naturalmente ψώμισόν με e retoma o antecedente sem essa dificuldade.
