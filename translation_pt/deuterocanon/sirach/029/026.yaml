  yaml_path: translation/deuterocanon/sirach/029/026.yaml
  text: Move along[a], sojourner; set the table in order, and if you have anything in your hand, feed me with it.
translation:
  language: pt
  text: Vá adiante[a], forasteiro; ponha a mesa em ordem e, se tiver alguma coisa na sua mão, alimente-me com isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Passe adiante” ou “Venha para cá”. O verbo grego pode indicar passar, avançar ou aproximar-se, conforme o ponto de vista e o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρελθε
  choice: Siga adiante
  rationale: O imperativo de παρέρχομαι pode indicar passar, avançar ou seguir caminho. “Siga adiante” conserva o tom direto e um tanto brusco sem fixar de modo excessivo a direção do movimento.
- source_word: πάροικε
  choice: forasteiro
  rationale: O vocativo πάροικε designa alguém que reside ou permanece entre outros sem pertencer plenamente à casa ou à comunidade. “Forasteiro” é corrente, digno e preserva essa condição de pessoa de fora melhor que “hóspede”.
- source_word: κόσμησον τράπεζαν
  choice: ponha a mesa em ordem
  rationale: Neste contexto, κοσμέω tem o sentido prático de arrumar ou preparar, não de ornamentar. A formulação mantém tanto a mesa concreta como a ideia de ordená-la.
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: se tiver alguma coisa em suas mãos
  rationale: A construção condicional e a imagem concreta de ter algo na mão são preservadas; em português, o verbo “ter” explicita naturalmente a posse implícita.
- source_word: ψώμισόν με
  choice: dê-me de comer com ela
  rationale: ψωμίζω significa alimentar ou dar alimento, originalmente em bocados. A escolha mantém a ordem pessoal e direta, sem introduzir uma especificidade de porção que o contexto não exige.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos para conservar o tom incisivo do grego. “Forasteiro” mantém a distância social expressa por πάροικος sem recorrer ao termo técnico “estrangeiro residente” nem suavizá-la como “hóspede”.
