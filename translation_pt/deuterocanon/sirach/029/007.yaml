  text: Many[a], because of wickedness, turned away; they were afraid of being defrauded gratuitously.
translation:
  language: pt
  text: Muitos[a], por causa da maldade, se afastaram; recearam ser lesados em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitos se retiraram por causa do mal; tiveram medo de ser privados do que era seu sem motivo.”'
    reason: Registra alternativas legítimas para ἀπέστρεψαν, πονηρίας, ἀποστερηθῆναι, δωρεάν e εὐλαβήθησαν, sem resolver além do necessário a amplitude de δωρεάν.
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: Mantém o sujeito plural indefinido e generalizante do grego em português natural.
- source_word: χάριν πονηρίας
  choice: por causa da maldade
  rationale: χάριν com genitivo expressa causa; “maldade” conserva a força moral de πονηρία sem restringi-la exclusivamente a fraude ou desonestidade.
- source_word: ἀπέστρεψαν
  choice: se afastaram
  rationale: Reproduz o sentido de voltar-se para longe ou retirar-se, sem explicitar um objeto que não aparece no texto grego fornecido.
- source_word: ἀποστερηθῆναι
  choice: ser lesados
  rationale: No contexto econômico, o infinitivo passivo indica sofrer privação ou fraude. “Ser lesados” comunica ambos os aspectos com naturalidade.
- source_word: δωρεὰν
  choice: sem nenhum proveito
  rationale: Expressa a ideia contextual de sofrer a perda gratuitamente, em vão ou sem qualquer compensação, evitando o coloquialismo potencialmente ambíguo “de graça”.
- source_word: εὐλαβήθησαν
  choice: tiveram medo
  rationale: O verbo denota cautela apreensiva ou temor; aqui o contexto financeiro favorece a expressão direta de medo.
theological_decisions:
- issue: Força moral de πονηρίας no contexto sapiencial
  choice: maldade
  alternative: mal; desonestidade
  rationale: “Maldade” preserva o juízo ético amplo do substantivo, enquanto “desonestidade” estreitaria o referente à fraude financeira.
- issue: Relação entre a maldade e o afastamento
  choice: Manter “por causa da maldade” sem identificar de quem é a maldade
  alternative: Explicitar que se trata da maldade dos devedores ou dos que se recusam a ajudar
  rationale: O grego fornecido não identifica expressamente o agente da maldade; a tradução conserva essa ambiguidade em vez de resolver a tensão pelo contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita tanto o tecnicismo “defraudados gratuitamente” quanto o coloquial e ambíguo “enganados de graça”.
