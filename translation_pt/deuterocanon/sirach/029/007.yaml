  source_fidelity: 'O sentido central do grego está preservado: πολλοὶ é generalizante, χάριν πονηρίας exprime causa sem identificar o agente da maldade, ἀπέστρεψαν indica afastamento/retirada, e εὐλαβήθησαν expressa temor cauteloso. «Ser lesados» comunica adequadamente o passivo ἀποστερηθῆναι. Contudo, «sem nenhum proveito» torna δωρεάν excessivamente explicativo e um pouco deslocado, pois pode sugerir que o lesado esperava obter proveito. «Em vão» conserva melhor a concisão e a abertura de δωρεάν («por nada/sem causa/sem compensação»).'
