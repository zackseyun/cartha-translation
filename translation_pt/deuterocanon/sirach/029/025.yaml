  yaml_path: translation/deuterocanon/sirach/029/025.yaml
  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
translation:
  language: pt
  text: Hospedarás e darás de beber a ingratos e, além disso, ouvirás palavras amargas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “coisas amargas”; “palavras” está implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενιεῖς
  choice: Hospedarás
  rationale: O futuro de ξενίζω descreve receber alguém como hóspede. “Hospedarás” é direto, natural e preserva o contexto de hospitalidade.
- source_word: ποτιεῖς
  choice: darás de beber
  rationale: O verbo significa dar algo para alguém beber. A expressão portuguesa é idiomática e mantém o paralelismo com “hospedarás”.
- source_word: εἰς ἀχάριστα
  choice: a ingratos
  rationale: ἀχάριστος caracteriza os beneficiários como pessoas sem gratidão. A construção concisa “a ingratos” conserva essa avaliação moral sem acrescentar especificações.
- source_word: πρὸς ἐπὶ τούτοις
  choice: além disso
  rationale: A expressão, embora enfática e algo pleonástica no grego, tem sentido aditivo. “Além disso” comunica com clareza que outra dificuldade se soma às anteriores.
- source_word: πικρὰ
  choice: palavras amargas
  rationale: O adjetivo neutro plural funciona substantivamente, literalmente “coisas amargas”. Com ἀκούσει, “palavras amargas” explicita de modo natural em português o que se ouve, mantendo a imagem de amargura.
- source_word: ἀκούσει
  choice: ouvirás
  rationale: É o futuro simples de ἀκούω; “ouvirás” preserva tanto o valor temporal quanto o tom de advertência.
