  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
translation:
  language: pt
  text: Muitos consideraram um empréstimo como um achado[a] e causaram transtorno aos que os ajudaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como algo encontrado” — isto é, como se o dinheiro emprestado fosse um ganho inesperado, e não algo a ser devolvido.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: Plural indefinido e abrangente; a forma substantivada é concisa e natural em português.
- source_word: ὡς εὕρεμα
  choice: como um achado
  rationale: Preserva a imagem grega de algo encontrado ou de um ganho inesperado, sem explicitar no corpo do texto a inferência de que não precisaria ser devolvido.
- source_word: ἐνόμισαν
  choice: consideraram
  rationale: Traduz diretamente o aoristo de νομίζω no sentido de julgar ou ter por algo, mantendo o caráter proverbial da afirmação.
- source_word: δάνος
  choice: um empréstimo
  rationale: Refere-se ao valor emprestado, não meramente ao estado abstrato de endividamento.
- source_word: παρέσχον πόνον
  choice: causaram transtorno
  rationale: Expressa de modo corrente o sentido idiomático de provocar sofrimento, dificuldade ou incômodo; 'transtorno' conserva certa amplitude.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: aos que os ajudaram
  rationale: Mantém a referência ampla aos que prestaram ajuda, sem restringi-los por paráfrase a uma categoria social específica.
