translation:
  language: pt
  text: Um pecador arruinará as coisas boas de um fiador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arruinará os bens ou as propriedades de um fiador”. O grego pode referir-se amplamente a coisas boas, benefícios ou posses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὰ
  choice: os bens
  rationale: O neutro plural pode indicar coisas boas, benefícios ou posses; no contexto financeiro da fiança, “os bens” exprime naturalmente a provável referência patrimonial, enquanto a nota preserva a amplitude lexical.
- source_word: ἐγγύου
  choice: de quem lhe serviu de fiador
  rationale: ἐγγύου é o genitivo de ἔγγυος, a pessoa que assume responsabilidade como fiadora. A formulação explicita em português corrente a relação implícita entre o pecador e o fiador.
- source_word: ἀνατρέψει
  choice: arruinará
  rationale: O verbo significa literalmente derrubar ou transtornar e, neste contexto, comunica a destruição ou perda dos bens do fiador. “Arruinará” é idiomático e mantém a força do resultado.
- source_word: ἁμαρτωλός
  choice: O pecador
  rationale: O singular sem artigo tem valor genérico. Em português, “o pecador” expressa naturalmente essa caracterização moral geral sem acrescentar outra identificação.
theological_decisions:
- issue: Caracterização moral do sujeito
  choice: O pecador
  alternative: Uma pessoa pecadora
  rationale: A tradução conserva diretamente o rótulo moral do grego e seu sentido proverbial genérico, sem transformar a frase em afirmação doutrinária mais ampla.
- issue: Relação do fiador com o pecador
  choice: quem lhe serviu de fiador
  alternative: um fiador
  rationale: 'O pronome “lhe” torna clara a relação pragmática pressuposta pelo dito: trata-se de quem prestou fiança ao pecador. Isso não altera a advertência ética nem introduz uma doutrina particular.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Serviu de fiador” evita o tecnicismo excessivo sem perder o sentido jurídico-financeiro; a nota registra a maior amplitude possível de ἀγαθά.
