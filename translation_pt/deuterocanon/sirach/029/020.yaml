  text: Support your neighbor according to your ability[a], and watch yourself lest you fall.
translation:
  language: pt
  text: Ajude o seu próximo conforme as suas forças e tenha cuidado para não cair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para não cair em dificuldades” ou “para não cair numa armadilha”. O grego não especifica o perigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: Ajude
  rationale: O imperativo médio de ἀντιλαμβάνομαι expressa prestar auxílio ativo. “Ajude” é natural e direto em português, sem acrescentar uma forma específica de assistência.
- source_word: τοῦ πλησίον
  choice: o seu próximo
  rationale: “Próximo” é a expressão ética consagrada e corrente para πλησίον; o genitivo identifica a pessoa a quem se deve prestar ajuda.
- source_word: κατὰ δύναμίν σου
  choice: conforme as suas forças
  rationale: κατά com acusativo indica medida ou limite. A formulação comunica que a ajuda deve corresponder aos recursos ou à capacidade da pessoa, preservando o caráter delimitador do grego.
- source_word: πρόσεχε σεαυτῷ
  choice: tenha cuidado
  rationale: 'A expressão é uma advertência reflexiva: prestar atenção a si mesmo ou acautelar-se. “Tenha cuidado” soa natural em português; o contexto deixa claro que a cautela diz respeito ao próprio agente.'
- source_word: μὴ ἐμπέσῃς
  choice: para não cair
  rationale: ἐμπίπτω significa literalmente “cair em”, mas aqui não há complemento expresso. “Para não cair” conserva a advertência aberta sem especificar indevidamente perigo financeiro, moral ou outro.
theological_decisions:
- issue: Alcance da advertência em μὴ ἐμπέσῃς
  choice: Advertência geral para que a pessoa não caia ao ajudar o próximo
  alternative: “para não cair em dificuldades” ou “para não cair numa armadilha”
  rationale: O texto equilibra auxílio e prudência, mas não identifica a natureza da queda. A tradução mantém essa ambiguidade genuína, sem restringi-la a prejuízo financeiro, perigo moral ou armadilha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Conforme as suas forças” preserva a ideia de auxílio limitado pela capacidade pessoal; a frase final mantém deliberadamente aberta a natureza do perigo.
