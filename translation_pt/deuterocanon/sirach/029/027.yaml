  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: pt
  text: Saia, forasteiro, do lugar de honra[a], pois meu irmão está hospedado comigo, e há necessidade de hospedagem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de um lugar honrado”; mais literalmente, “da face da honra” ou “da presença da honra”. A expressão grega é incomum e provavelmente indica que o forasteiro deve deixar uma posição destacada ou honrosa para dar lugar a outro hóspede.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “há necessidade de hospitalidade” ou “é preciso alojamento”. A construção grega é impessoal e ressalta a necessidade surgida com a chegada de outro hóspede.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: Saia
  rationale: Imperativo direto de ἐξέρχομαι. “Saia” conserva a força abrupta da ordem e soa natural em português.
- source_word: πάροικε
  choice: forasteiro
  rationale: O vocativo designa alguém que vive temporariamente entre outros sem pertencer plenamente ao lugar. “Forasteiro” preserva sua condição de pessoa de fora sem recorrer ao termo técnico “estrangeiro residente”.
- source_word: ἀπὸ προσώπου δόξης
  choice: do lugar de honra
  rationale: A expressão grega, literalmente próxima de “da face/presença da honra”, é incomum. No contexto doméstico, provavelmente indica uma posição honrosa ou destacada; a nota preserva a estranheza e as alternativas.
- source_word: ἐπεξενώταί μοι
  choice: veio hospedar-se comigo
  rationale: O perfeito do verbo ligado à hospitalidade descreve o estado resultante de alguém ter sido recebido como hóspede. Esta formulação mantém a referência a μοι e é idiomática em português.
- source_word: ὁ ἀδελφός
  choice: meu irmão
  rationale: Embora o grego use o artigo, o contexto relacional favorece o possessivo implícito em português. “Irmão” pode referir-se ao irmão literal ou, conforme o contexto social, a um parente ou membro próximo do grupo.
- source_word: χρεία τῆς ξενίας
  choice: preciso do alojamento
  rationale: χρεία expressa necessidade, e ξενία pode denotar hospitalidade ou hospedagem. A construção verbal é clara em português e, no contexto de abrir espaço para outro hóspede, “alojamento” comunica o sentido concreto provável.
