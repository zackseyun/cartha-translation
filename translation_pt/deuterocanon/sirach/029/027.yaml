  terminology: «Forasteiro» é uma boa equivalência não técnica para πάροικε. «Hospedado» e «hospedagem» preservam o campo semântico de ξενία sem fixar indevidamente se se trata de alojamento ou hospitalidade. A nota deve explicitar que a construção grega final é impessoal.
