  text: Do not trust an enemy forever, for as bronze rusts, so does his evil.
translation:
  language: pt
  text: Jamais confie num inimigo, pois, assim como o bronze se corrói, também se corrói a maldade dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּאֲמִין ... לָעַד
  choice: Jamais confie
  rationale: A combinação da proibição com לָעַד exprime uma advertência permanente; “jamais” comunica isso de modo natural e inequívoco em português.
- source_word: שׂוֹנֵא
  choice: inimigo
  rationale: No contexto, o particípio substantivado designa aquele que nutre hostilidade, adequadamente expresso por “inimigo”.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode indicar cobre ou bronze; “bronze” segue a compreensão antiga refletida no paralelo grego χαλκός e mantém a imagem tradicional.
- source_word: רֹעַ
  choice: maldade
  rationale: Expressa a qualidade moral nociva do inimigo, sem restringi-la a uma ação específica.
- source_word: יַחֲלִיא
  choice: enferruja
  rationale: Embora a forma hebraica evoque adoecer ou deteriorar-se, o paralelo grego ἰοῦται confirma aqui a imagem da corrosão do metal. A repetição do verbo em português torna explícita a comparação elíptica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A metáfora deliberadamente incomum da maldade que “enferruja” foi preservada, em vez de ser explicada ou suavizada.
