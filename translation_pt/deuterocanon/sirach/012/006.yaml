base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/006.yaml
  text: For God also hates evildoers[b][a], and will repay the wicked with vengeance.
translation:
  language: pt
  text: Pois também Deus odeia os que praticam o mal[a] e retribuirá aos perversos com vingança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Deus odeia os que praticam o mal”; grego: “o Altíssimo odiou os pecadores”.'
    reason: textual_variant
  - marker: b
    text: No segundo membro, o grego diz “aos ímpios”, enquanto o hebraico diz “aos perversos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל / ὁ ὕψιστος
  choice: Deus
  rationale: O texto hebraico de base traz אֵל, “Deus”. O paralelo grego traz ὁ ὕψιστος, “o Altíssimo”; a variante é registrada em nota, sem substituir a leitura hebraica de alta confiança.
- source_word: שֹׂנֵא / ἐμίσησεν
  choice: odeia
  rationale: O hebraico expressa uma caracterização contínua por meio do particípio, e tanto ele quanto o grego empregam o verbo forte “odiar”; o presente comunica naturalmente a verdade geral em português.
- source_word: רָעִים / ἁμαρτωλούς
  choice: os que praticam o mal
  rationale: O hebraico רָעִים significa “maus” ou “malfeitores”. A formulação escolhida preserva o sentido moral ativo e distingue este grupo dos רְשָׁעִים do segundo membro; o grego, diferentemente, diz “pecadores”.
- source_word: לָרְשָׁעִים / τοῖς ἀσεβέσιν
  choice: aos perversos
  rationale: “Perversos” traduz naturalmente o hebraico רְשָׁעִים. O grego ressalta antes a impiedade, diferença preservada em nota.
- source_word: יָשִׁיב / ἀποδώσει
  choice: retribuirá
  rationale: Ambos os testemunhos sustentam a ideia de dar em retorno ou aplicar a devida paga; “retribuirá” mantém o tom judicial e solene.
- source_word: נָקָם / ἐκδίκησιν
  choice: vingança
  rationale: É o equivalente direto do substantivo hebraico, também apoiado pelo grego, e preserva a força da advertência sem suavizá-la como mera “punição”.
theological_decisions:
- issue: Título divino divergente entre os testemunhos
  choice: Deus
  alternative: o Altíssimo
  rationale: A tradução principal segue o hebraico fornecido, que lê אֵל, enquanto documenta com transparência o título mais específico do paralelo grego.
- issue: Linguagem de ódio e vingança atribuída a Deus
  choice: preservar “odeia” e “vingança”
  alternative: “rejeita” e “castigo”
  rationale: As alternativas mais brandas resolveriam indevidamente a tensão teológica e enfraqueceriam termos fortes presentes tanto no hebraico quanto no grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção paralela e o tom forte do original foram preservados; as divergências relevantes entre o hebraico e o grego aparecem nas notas.
