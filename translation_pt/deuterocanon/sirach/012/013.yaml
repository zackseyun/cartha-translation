  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: pt
  text: Não o ponha ao seu lado[a], para que ele não o empurre e fique em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Quem terá pena de um encantador de serpentes mordido por uma serpente, e de todos os que se aproximam de animais selvagens?” O testemunho grego apresenta aqui uma leitura substancialmente diferente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: Não o ponha
  rationale: O hifil de עמד significa fazer ficar de pé ou colocar em determinada posição. “Não o ponha” reproduz a advertência de modo natural e direto em português.
- source_word: אֶצְלֶךָ
  choice: ao seu lado
  rationale: אצל indica proximidade. A expressão preserva tanto a imagem espacial quanto a possível ideia social de conceder a alguém uma posição próxima.
- source_word: לָמָּה
  choice: para que ... não
  rationale: Embora a forma normalmente signifique “por quê?”, neste contexto introduz a consequência indesejada que deve ser evitada. A construção final negativa transmite essa força de advertência em português corrente.
- source_word: יֶהְדָּפְךָ
  choice: ele não o empurre
  rationale: O verbo הדף significa empurrar, repelir ou expulsar. “Empurre” conserva a imagem concreta e, em paralelo com a oração seguinte, permite entender o deslocamento também em sentido figurado.
- source_word: וְיַעֲמֹד
  choice: e fique
  rationale: O verbo significa literalmente “ficar de pé” ou “permanecer”. Com תַּחְתֶּיךָ, “fique em seu lugar” expressa com naturalidade que a pessoa assume a posição daquele que foi afastado.
- source_word: תַּחְתֶּיךָ
  choice: em seu lugar
  rationale: תחת pode indicar posição inferior ou substituição. Neste contexto, o paralelismo com o ato de empurrar favorece “em seu lugar”, sem eliminar a imagem de deslocamento de posição.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da leitura grega divergente
  choice: Traduzir o texto hebraico preservado como texto principal
  alternative: Adotar como texto principal a leitura grega sobre o encantador de serpentes e os que se aproximam de animais selvagens
  rationale: Como há testemunho hebraico extante e de alta confiança, ele serve de base. A leitura grega é substancialmente diferente e deve ser registrada em nota, não harmonizada nem usada para substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a metáfora espacial do hebraico e evita tornar explícita uma função política ou social que o texto apenas pode sugerir.
