  text: Do not give him your bread[b][a], lest by it he set himself against you.
translation:
  language: pt
  text: Não lhe dê alimento[a], para que ele não ganhe poder sobre você por meio dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “utensílios/itens de pão”; a expressão é difícil. O paralelo grego apoia mais claramente o sentido de “pão” ou “alimento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que ele não se volte contra você por meio deles”. O paralelo grego expressa mais fortemente a ideia de dominar ou exercer poder sobre alguém.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: alimento
  rationale: A expressão hebraica é difícil e, literalmente, parece significar “utensílios/itens de pão”. O paralelo grego aponta com mais clareza para pão ou comida. “Alimento” comunica naturalmente o sentido provável sem impor a ideia de posse presente em “seu pão”.
- source_word: אַל תִּתֵּן לוֹ
  choice: Não lhe dê
  rationale: Traduz diretamente a proibição hebraica em português atual e natural.
- source_word: לָמָּה
  choice: para que... não
  rationale: Embora o termo hebraico normalmente signifique “por quê?”, a construção transmitida é obscura. O grego ἵνα μὴ esclarece a força de advertência ou resultado negativo.
- source_word: בָם
  choice: por meio dele
  rationale: O hebraico traz pronome plural, em concordância com a expressão inicial difícil. Como “alimento” é singular coletivo em português, emprega-se o singular no texto, preservando o valor instrumental.
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: ganhe poder sobre você
  rationale: O hebraico sugere confronto ou oposição, enquanto o grego δυναστεύσῃ explicita a ideia de dominar. A formulação escolhida preserva a noção de vantagem hostil adquirida por meio da dádiva, sem afirmar necessariamente domínio já consumado.
theological_decisions:
- issue: Uso do testemunho hebraico em uma cláusula difícil, com esclarecimento pelo paralelo grego
  choice: Manter como base o hebraico preservado, usando o grego para esclarecer a finalidade negativa e a ideia de poder hostil no verbo final.
  alternative: “Não lhe dê itens de pão; por que, por meio deles, ele se voltará contra você?” ou, seguindo mais diretamente o grego, “Retenha dele o pão, para que não domine você por meio dele.”
  rationale: O hebraico tem prioridade, mas sua redação neste ponto é reconhecidamente difícil. O paralelo grego oferece evidência antiga para a força de advertência e para a ameaça de domínio, sem exigir que todo o texto hebraico seja substituído.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Alimento” evita a estranheza de uma reprodução literal do hebraico, enquanto as notas preservam a dificuldade textual e a tensão entre o hebraico e o paralelo grego.
