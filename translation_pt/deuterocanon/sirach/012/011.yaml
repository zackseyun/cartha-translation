base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/011.yaml
  text: Even if he listens to you and walks gently, give your heart to be afraid of him.[a]
translation:
  language: pt
  text: Mesmo que ele lhe dê ouvidos e ande com mansidão, empenhe-se em temê-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “ponha sua alma de sobreaviso e guarde-se dele”, tornando a advertência de autoproteção mais explícita do que a redação hebraica preservada.'
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  choice: lhe dê ouvidos
  rationale: שמע com ל pode indicar escutar ou atender alguém. “Dar ouvidos” preserva essa amplitude sem afirmar de modo excessivo que ele obedece.
- source_word: וִיהַלֵּךְ בְּנַחַת
  choice: ande com mansidão
  rationale: Mantém a imagem de הלך e expressa a conduta calma, branda ou aparentemente submissa indicada por בנחת; o paralelo grego reforça a ideia de uma postura abatida.
- source_word: תֵּן לִבְּךָ
  choice: ponha no coração
  rationale: Reproduz de modo idiomático e relativamente formal a imagem hebraica de “dar/pôr o coração”, aqui como decisão consciente e atenção deliberada.
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  choice: que deve temê-lo
  rationale: Conserva o verbo de temor ירא e deixa o contexto comunicar que se trata de receio cauteloso diante de uma pessoa hostil, sem substituir o hebraico pela linguagem mais explícita de vigilância encontrada no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de tratamento na terceira pessoa. A formulação conserva a metáfora do coração e o termo hebraico de temor, embora a advertência seja entendida no contexto como cautela, não como reverência.
