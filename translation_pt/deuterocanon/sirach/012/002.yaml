  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: pt
  text: Faça o bem ao justo, e você encontrará retribuição — se não vier dele, virá do SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “se não dele, mas do Altíssimo”; o testemunho hebraico traz: “do SENHOR”.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: Faça o bem
  rationale: O hifil imperativo de יטב expressa beneficência ativa em favor de outra pessoa. “Faça o bem” é direto, natural e corresponde ao grego εὖ ποίησον.
- source_word: לַצַּדִּיק
  choice: ao justo
  rationale: Traduz de perto o hebraico e designa uma pessoa moralmente íntegra. O singular masculino é preservado; o paralelo grego εὐσεβεῖ ressalta a ideia de alguém piedoso.
- source_word: תִּמְצָא
  choice: você encontrará
  rationale: Mantém o sentido básico de מצא, “encontrar”, e conserva a imagem hebraica de encontrar retribuição como resultado da boa ação.
- source_word: תַשְׁלוּמַת
  choice: retribuição
  rationale: O termo indica paga ou retorno correspondente. “Retribuição” preserva melhor essa reciprocidade do que “recompensa” e também se ajusta ao grego ἀνταπόδομα.
- source_word: אִם לֹא מִמֶּנוּ
  choice: se não vier dele
  rationale: Explicita de modo natural em português a origem subentendida da retribuição e preserva o referente masculino singular presente no hebraico.
- source_word: מֵיְהֹוָה
  choice: virá do SENHOR
  rationale: Segue o testemunho hebraico com o nome divino YHWH representado por “SENHOR”. A repetição de “virá” torna clara em português a elipse da frase hebraica.
theological_decisions:
- issue: O título divino da oração final difere entre os testemunhos hebraico e grego
  choice: do SENHOR
  alternative: do Altíssimo
  rationale: O texto principal segue o hebraico preservado, מֵיְהֹוָה. A leitura grega παρὰ Ὑψίστου é significativa e aparece na nota, sem harmonização silenciosa.
- issue: Pronome referente ao destinatário justo
  choice: dele
  alternative: dessa pessoa
  rationale: Tanto o sufixo hebraico masculino singular quanto o grego αὐτοῦ apontam para um referente singular. “Dele” preserva essa forma sem transformar o texto em plural neutro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos preservam a relação explicativa da oração final, e a repetição de “virá” torna natural a elipse do original sem alterar seu sentido.
