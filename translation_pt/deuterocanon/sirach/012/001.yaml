translation:
  language: pt
  text: Se você fizer o bem, saiba a quem você faz o bem, e haverá esperança para o seu bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e haverá esperança pelo bem que você faz”. Seguindo mais explicitamente o grego: “e haverá gratidão por suas boas obras”.'
    reason: A expressão hebraica final pode referir-se ao bem ou benefício do agente, mas também pode ser entendida em relação ao bem praticado; o paralelo grego explicita gratidão/favor ligado às boas obras.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força condicional normal da partícula hebraica, sem pressupor que a ação ocorrerá.
- source_word: תֵּטִיב
  choice: fizer o bem
  rationale: Expressa o sentido de agir bem ou beneficiar alguém e corresponde naturalmente ao idioma hebraico e ao paralelo grego.
- source_word: תֵּדַע
  choice: saiba
  rationale: Reproduz o valor imperativo contextual e a ideia direta de conhecer ou ter consciência de quem recebe o benefício.
- source_word: לְמִי תֵטִיב
  choice: a quem o faz
  rationale: Mantém o destinatário marcado por לְ e evita a repetição pouco elegante de “fizer o bem” em português, sem alterar o sentido.
- source_word: וִיהִי
  choice: e haverá
  rationale: Representa a consequência futura mais provável no contexto sapiencial, embora a forma possa ter matiz volitivo.
- source_word: תִקְוָה
  choice: esperança
  rationale: É a correspondência direta e natural para a ideia hebraica de esperança ou expectativa.
- source_word: לְטוֹבָתָךְ
  choice: para a sua bondade
  rationale: Conserva a amplitude do hebraico, que pode apontar para a boa ação, a bondade ou o bem do benfeitor, sem impor a leitura mais explícita do grego.
theological_decisions:
- issue: Sentido da cláusula final לְטוֹבָתָךְ diante do grego καὶ ἔσται χάρις τοῖς ἀγαθοῖς σου
  choice: “haverá esperança para a sua bondade”
  alternative: “haverá esperança para o seu bem” ou, conforme o grego, “haverá gratidão por suas boas obras”
  rationale: O texto hebraico favorece “esperança”, mas o referente de “seu bem/sua bondade” permanece aberto; o grego apresenta gratidão ou favor ligado às boas obras. A tradução principal preserva a tensão, e a nota registra as leituras alternativas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o paralelismo sapiencial e preserva a ambiguidade genuína da cláusula final.
