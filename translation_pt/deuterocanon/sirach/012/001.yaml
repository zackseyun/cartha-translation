  source_fidelity: A cláusula inicial reproduz adequadamente o condicional e o imperativo hebraicos. Contudo, “para a sua bondade” tende, em português, a designar uma qualidade moral pessoal, ao passo que לְטוֹבָתָךְ pode significar mais diretamente “para o seu bem/benefício” e, em contexto, também pode estar ligado ao bem praticado. A revisão mantém essa amplitude por meio da nota e registra a leitura mais explícita do grego.
  naturalness: “Saiba a quem o faz” é possível, mas o pronome “o” fica pouco claro e a construção soa elíptica. “Saiba a quem você faz o bem” é idiomático, claro e conserva o paralelismo do original. “Haverá esperança para o seu bem” é mais natural do que “para a sua bondade”.
  terminology: “Fazer o bem” é uma expressão portuguesa estabelecida e corresponde bem a היטיב. “Esperança” conserva תקוה. A nota distingue apropriadamente a possibilidade hebraica de “bem/benefício” da formulação grega, que fala de gratidão ou favor em relação às boas ações.
  issues:
  - severity: medium
    issue: “Para a sua bondade” desloca o sentido de לְטוֹבָתָךְ para uma qualidade moral e soa pouco natural.
    rationale: O hebraico pode referir-se ao bem ou benefício do destinatário e, possivelmente, ao bem praticado; não exige a noção de uma disposição moral chamada “bondade”. “Para o seu bem” representa com maior precisão a leitura hebraica mais direta, enquanto a nota preserva as demais possibilidades.
  - severity: low
    issue: O pronome em “saiba a quem o faz” tem antecedente pouco explícito.
    rationale: A repetição de “faz o bem” evita ambiguidade sintática sem acrescentar interpretação.
