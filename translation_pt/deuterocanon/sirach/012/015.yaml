translation:
  language: pt
  text: Mais tarde, você compreenderá minhas palavras[a] e suspirará por minha irmã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil neste versículo, especialmente na expressão traduzida como “por minha irmã”. O testemunho grego traz, em vez disso: “Ele permanecerá com você por uma hora e, se você se desviar, não perseverará”, o que reflete um texto ou uma interpretação substancialmente diferente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: Mais tarde
  rationale: Expressa naturalmente o sentido temporal de uma percepção posterior, sem decidir se ocorre simplesmente depois ou tarde demais.
- source_word: תַּשִּׂיג
  choice: você compreenderá
  rationale: Embora o verbo tenha o sentido básico de alcançar, com “minhas palavras” como objeto ele comunica de modo natural a ideia de chegar a compreendê-las.
- source_word: אֲמָרַי
  choice: minhas palavras
  rationale: Tradução direta e corrente do substantivo plural com sufixo de primeira pessoa.
- source_word: וּלְאַחְוָתִי
  choice: por minha irmã
  rationale: A forma hebraica é difícil, mas parece mais diretamente relacionada a “minha irmã”; a tradução mantém essa leitura transmitida sem normalizá-la silenciosamente.
- source_word: תִּתְאַנָּח
  choice: suspirará
  rationale: Preserva de forma concisa o sentido de suspirar ou gemer, sem intensificá-lo interpretativamente como “lamentar”.
theological_decisions:
- issue: Primazia do hebraico diante de um paralelo grego divergente
  choice: Seguir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Traduzir segundo o grego: “Ele permanecerá com você por algum tempo; mas, se você se desviar, não perseverará.”'
  rationale: Como existe testemunho hebraico, ele é a fonte principal. A divergência substancial do grego deve permanecer visível, mas não substituir silenciosamente o hebraico.
- issue: Tratamento da expressão hebraica semanticamente incerta וּלְאַחְוָתִי
  choice: Manter a tradução mais literal “por minha irmã”.
  alternative: Interpretar como “por minha parentela”, “por minha companheira” ou emendar a frase conforme o grego.
  rationale: A formulação transmitida é difícil e talvez reflita parentesco, fraternidade ou companhia. Preservá-la no texto, com nota explicativa, evita resolver uma incerteza textual e interpretativa sem evidência suficiente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Mais tarde” é mais natural do que “posteriormente”; a estranheza de “por minha irmã” é mantida deliberadamente por fidelidade à incerteza do hebraico.
