  text: Do not seat him at your right hand[a], lest he seek your seat.
translation:
  language: pt
  text: Não o faça sentar à sua direita, para que ele não procure ocupar o seu lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico também pode ser entendido mais literalmente: “Não o faça sentar à sua direita; por que haveria ele de procurar o seu assento?” “Lugar” pode significar tanto um assento concreto como a posição ou o status de alguém.'
    reason: Preservar a ambiguidade de לָמָּה e a amplitude semântica de מוֹשָׁבֶךָ.
lexical_decisions:
- source_word: אַל תּוֹשִׁיבֵהוּ
  choice: Não o faça sentar
  rationale: Preserva a proibição e o valor causativo do hifil de ישב, em português natural e atual.
- source_word: לִימִינֶךָ
  choice: à sua direita
  rationale: Reproduz a imagem concreta de proximidade privilegiada, que no contexto também pode sugerir honra.
- source_word: לָמָּה
  choice: para que ... não
  rationale: Embora לָמָּה normalmente signifique literalmente “por quê?”, aqui introduz de modo idiomático a consequência indesejada contra a qual se adverte. A nota conserva a possibilidade formal da pergunta.
- source_word: יְבַקֵּשׁ
  choice: procure ocupar
  rationale: בקש significa “buscar, procurar, tentar obter”; acrescentar “ocupar” torna natural em português sua relação com “lugar” sem restringir a possível ideia de posição ou status.
- source_word: מוֹשָׁבֶךָ
  choice: o seu lugar
  rationale: מושב pode designar assento, lugar ou posição. “Lugar” mantém a imagem espacial e, ao mesmo tempo, permite a referência à posição social.
theological_decisions:
- issue: Relação entre o texto hebraico preservado e o paralelo grego divergente
  choice: Traduzir diretamente o hebraico da Genizá, mantendo a advertência concreta sobre conceder proximidade e honra.
  alternative: Expandir segundo o grego, apresentando de forma mais geral a associação com um pecador e a participação em seus pecados.
  rationale: O hebraico está preservado com alta confiança e deve governar a tradução. O grego é sintaticamente distinto e não deve substituir a imagem específica do hebraico.
- issue: Valor de לָמָּה na segunda oração
  choice: 'Expressar uma finalidade preventiva: “para que ... não”.'
  alternative: 'Manter uma pergunta mais literal: “por que haveria ele de procurar o seu lugar?”'
  rationale: No contexto da advertência sapiencial, a leitura preventiva produz português coerente, mas a nota registra a forma interrogativa literal e evita ocultar a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural no Brasil e inteligível internacionalmente. A repetição de “lugar” foi evitada na primeira oração, enquanto “à sua direita” conserva a imagem de honra e proximidade.
