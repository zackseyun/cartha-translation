  text: He will not pass by until a fire burns in him[a].
translation:
  language: pt
  text: Ele não seguirá adiante até que um fogo arda nele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Ele sacudirá a cabeça e baterá palmas; murmurará muito e mudará de expressão.” Essa formulação mais extensa provavelmente interpreta o comportamento hostil descrito de modo conciso no hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: não seguirá adiante
  rationale: O verbo עבר pode significar “passar”, “seguir adiante” ou “ir embora”. A formulação mantém a imagem hebraica e, no contexto, sugere que a pessoa persiste em sua ação.
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da ação e introduz naturalmente, em português, a oração seguinte.
- source_word: תִּבְעַר
  choice: arda
  rationale: A forma verbal significa “arder” ou “queimar”. A construção hebraica permite tomar “fogo” como sujeito, por isso se evita a leitura causativa “ateie”.
- source_word: בּוֹ
  choice: nele
  rationale: Reproduz de modo conciso o sentido mais direto da preposição com sufixo, sem decidir se o fogo é interior, figurado ou dirigido contra a pessoa.
- source_word: אֵשׁ
  choice: um fogo
  rationale: O substantivo hebraico aparece sem determinação; o artigo indefinido preserva isso e mantém a força metafórica da expressão.
theological_decisions:
- issue: Primazia do testemunho hebraico breve diante do paralelo grego substancialmente mais desenvolvido
  choice: Traduzir o hebraico preservado no texto principal e registrar o paralelo grego em nota.
  alternative: 'Adotar no texto principal a descrição grega: “Ele sacudirá a cabeça e baterá palmas; murmurará muito e mudará de expressão.”'
  rationale: O hebraico existente deve orientar o texto principal. Como o grego pode refletir uma forma textual mais extensa ou uma interpretação antiga da hostilidade descrita de modo conciso no hebraico, ele é preservado para transparência sem substituir a leitura hebraica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Seguir adiante” preserva a imagem de עבר sem soar excessivamente literal; “nele” conserva a concisão e a ambiguidade do hebraico.
