  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
translation:
  language: pt
  text: Na prosperidade de alguém, até o inimigo se mostra amigo[a]; mas, na adversidade, até o amigo se afasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o inimigo se torna amigo”. O hebraico usa רֵעַ, termo que pode significar “amigo” ou “companheiro”; “se mostra amigo” preserva a ironia do provérbio sem afirmar necessariamente uma reconciliação genuína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: Na prosperidade de alguém
  rationale: טוֹבָה indica aqui uma condição favorável ou próspera. “De alguém” conserva o caráter genérico do provérbio em português natural, sem tornar o dito exclusivamente masculino.
- source_word: שׂוֹנֵא
  choice: o inimigo
  rationale: Embora signifique literalmente “aquele que odeia”, o contexto relacional favorece “inimigo”, em consonância com o paralelo grego ἐχθροί.
- source_word: רֵעַ
  choice: se mostra amigo
  rationale: רֵעַ pode designar amigo ou companheiro. “Se mostra amigo” preserva a ironia e a ambiguidade quanto à sinceridade ou permanência dessa amizade, além de manter a ligação verbal com “amigo” no segundo membro.
- source_word: וּבְרָעָתוֹ
  choice: mas, na adversidade
  rationale: רָעָה refere-se aqui a circunstâncias ruins, não ao mal moral. “Adversidade” forma um contraste claro e digno com “prosperidade”; o valor adversativo de “mas” explicita a oposição poética natural em português.
- source_word: בּוֹדֵד
  choice: se afasta
  rationale: A forma comunica separação ou isolamento. No contexto da conduta de um amigo, “se afasta” expressa de modo idiomático a retirada relacional e concorda com o grego διαχωρισθήσεται.
