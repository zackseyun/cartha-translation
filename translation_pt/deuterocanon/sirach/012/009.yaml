translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial equilibrada. A formulação genérica “de alguém” oferece leitura amplamente natural no português internacional e brasileiro, enquanto “se mostra amigo” preserva a tensão lexical do hebraico.
