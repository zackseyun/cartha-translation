  text: No good comes to one who persists in wickedness[b][a], nor to one who does not show mercy.
translation:
  language: pt
  text: Não há bem para quem persiste na maldade[b], nem para quem não pratica a justiça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «não pratica [ou: não faz] justiça». O paralelo grego traz «não concede esmola/misericórdia».'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por «persiste na maldade» é difícil; o paralelo grego sustenta o sentido de continuar no mal.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: Não há bem
  rationale: Reproduz de perto a construção existencial hebraica e expressa naturalmente, em português, a ausência de benefício ou resultado bom.
- source_word: לִמְנֹחַ רָשָׁע
  choice: para quem persiste na maldade
  rationale: A expressão hebraica é difícil; tomada isoladamente, לִמְנֹחַ pode sugerir repousar ou estabelecer-se. O paralelo grego, porém, traz a ideia de continuar ou persistir no mal, sentido adotado no texto e assinalado em nota.
- source_word: וְגַם
  choice: nem
  rationale: No paralelismo negativo, «nem» coordena com naturalidade a segunda afirmação, embora o hebraico seja literalmente aditivo, «e também».
- source_word: צְדָקָה
  choice: justiça
  rationale: Mantém no texto principal o valor lexical direto do hebraico צְדָקָה, sem eliminar a interpretação contextual de caridade, esmola ou misericórdia atestada pelo grego.
- source_word: לֹא עָשָׂה
  choice: não pratica
  rationale: «Praticar a justiça» é uma formulação portuguesa natural para o hebraico literalmente «não fez justiça», preservando seu caráter ético e habitual.
theological_decisions:
- issue: Sentido de צְדָקָה neste contexto sapiencial
  choice: justiça no texto principal, com a acepção caridade/misericórdia em nota
  alternative: não demonstra misericórdia; não dá esmola
  rationale: O testemunho hebraico de alta confiança diz literalmente «não fez justiça», enquanto o paralelo grego interpreta o termo como esmola ou misericórdia. Manter «justiça» no texto e registrar a interpretação grega em nota preserva a tensão lexical sem impor uma resolução denominacional.
translation_notes:
  register: Português moderno, claro e digno, com construção existencial próxima do hebraico. As notas aparecem na ordem em que seus marcadores ocorrem no versículo e preservam tanto a dificuldade textual da primeira oração quanto a diferença entre o hebraico e o paralelo grego na segunda.
