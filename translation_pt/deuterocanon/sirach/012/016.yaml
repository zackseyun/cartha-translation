base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: pt
  text: Quem terá pena de um encantador de serpentes que foi mordido, ou de quem se aproxima de uma fera?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um animal de dente/dentes”, isto é, um animal selvagem perigoso.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego de Swete difere substancialmente neste ponto: fala de um inimigo que adoça as palavras com os lábios enquanto planeja no coração lançar a pessoa numa cova; depois chora diante dela, mas, se tiver oportunidade, não se fartará de sangue. Como o hebraico foi preservado neste versículo e é a testemunha principal para as partes existentes do Sirácida hebraico, o texto principal segue o hebraico.'
    reason: textual_variant
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Introduz uma pergunta retórica; a forma simples preserva sua força e soa natural em português.
- source_word: יוּחַן
  choice: terá pena
  rationale: Neste contexto proverbial, o verbo חנן comunica a ideia de receber compaixão ou favor; “terá pena” expressa com clareza a pergunta sobre quem se compadeceria de alguém que assumiu um risco previsível.
- source_word: חוֹבֵר
  choice: encantador de serpentes
  rationale: חוֹבֵר designa quem pratica encantamentos; a menção subsequente à mordida indica, neste contexto, um encantador de serpentes.
- source_word: נָשׁוּךְ
  choice: que foi mordido
  rationale: O particípio passivo descreve o encantador depois de sofrer a mordida; a oração relativa é clara e natural em português.
- source_word: וְכָל הַקָּרֵב
  choice: ou de quem se aproxima
  rationale: A expressão introduz um caso paralelo abrangido pela mesma pergunta retórica. “Ou” torna explícita em português a alternativa comparativa sem alterar o sentido proverbial.
- source_word: אֶל חַיַּת שֵׁן
  choice: de uma fera
  rationale: A expressão literal “animal de dente/dentes” refere-se idiomaticamente a um animal selvagem perigoso; “fera” comunica esse sentido de modo conciso, enquanto a nota preserva a imagem hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção proverbial e a pergunta retórica do hebraico foram preservadas; a imagem incomum de חַיַּת שֵׁן é esclarecida em nota, sem sobrecarregar o texto principal.
