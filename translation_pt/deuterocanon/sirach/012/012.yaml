base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: pt
  text: Seja, para ele, como quem revela um segredo[a], e ele não encontrará como arruinar você; e saiba o desfecho da inveja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como quem desvenda um segredo”. A comparação é obscura; provavelmente recomenda cautela diante de quem expõe assuntos confidenciais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e saiba o fim do ciúme”. O hebraico também pode ser entendido como “o fim” ou “o resultado” do ciúme ou da inveja. O paralelo grego amplia consideravelmente a advertência.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: Seja para com ele
  rationale: O imperativo de היה com ל descreve a postura adotada em relação a alguém. A formulação conserva a concisão e a direção relacional do hebraico, sem transformar a advertência em uma paráfrase explicativa.
- source_word: כִּמְגַלֶּה רָז
  choice: como quem revela um segredo
  rationale: מְגַלֶּה é o particípio de גלה, “revelar, descobrir”, e רָז significa “segredo, mistério”. A tradução mantém a comparação e sua imagem deliberadamente pouco explícita.
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: e ele não encontrará como arruinar você
  rationale: O hebraico diz literalmente que ele “não encontrará” para arruinar. “Não encontrará como” expressa naturalmente em português a falta de ocasião ou meio, enquanto “arruinar” comunica dano grave sem restringi-lo à destruição física.
- source_word: וְדַע
  choice: e conheça
  rationale: Preserva o imperativo direto do testemunho hebraico. O paralelo grego apresenta uma formulação futura mais desenvolvida, mas não substitui aqui a leitura hebraica.
- source_word: אַחֲרִית
  choice: o desfecho
  rationale: O termo pode indicar fim, resultado ou consequência final. “Desfecho” é natural no contexto e preserva a orientação para o resultado final.
- source_word: קִנְאָה
  choice: inveja
  rationale: קִנְאָה pode significar inveja, ciúme ou zelo. Neste contexto de hostilidade destrutiva, “inveja” é idiomático, embora “ciúme” continue sendo uma alternativa legítima.
theological_decisions:
- issue: Imperativo hebraico conciso em contraste com a advertência ampliada do grego
  choice: Traduzir diretamente o hebraico preservado, mantendo seu imperativo e sua imagem concisa
  alternative: Seguir o grego, com as advertências de não colocar o inimigo ao lado nem à direita e com o reconhecimento posterior das palavras do sábio
  rationale: O testemunho hebraico disponível tem prioridade como texto-fonte. O paralelo grego confirma o tom geral de cautela, mas diverge amplamente na formulação e não deve substituir silenciosamente o hebraico.
- issue: Ambiguidade de קִנְאָה
  choice: inveja
  alternative: ciúme
  rationale: Ambos os sentidos são lexicalmente possíveis. “Inveja” se ajusta melhor à intenção hostil no contexto, enquanto a alternativa é registrada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “seja para com ele” conserva a forma relacional incomum do hebraico; as notas preservam tanto a obscuridade da comparação quanto a amplitude semântica de קִנְאָה.
