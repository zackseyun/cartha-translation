  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
translation:
  language: pt
  text: Na prosperidade, não se conhece o amigo[a]; na adversidade, o inimigo não fica oculto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Na boa fortuna não se conhece o amigo, e na adversidade não se oculta o inimigo.” O texto grego diverge na primeira oração, dizendo aproximadamente: “O amigo não será vingado/recompensado em coisas boas.” Aqui se segue o hebraico preservado, que forma um provérbio equilibrado entre prosperidade e adversidade.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: o amigo
  rationale: O particípio designa aqui alguém caracterizado pela amizade ou afeição, não um amante em sentido romântico. O grego φίλος confirma o sentido relacional de “amigo”.
- source_word: לֹא יִוָּדַע
  choice: não se conhece
  rationale: O nifal de ידע expressa ser conhecido ou reconhecido. “Não se conhece” mantém proximidade formal com o hebraico e, no provérbio, comunica que a prosperidade não revela quem é verdadeiramente amigo.
- source_word: בַּטּוֹבָה
  choice: na prosperidade
  rationale: Embora literalmente signifique “no bem”, neste contexto indica circunstâncias favoráveis ou boa fortuna e forma uma antítese clara com “adversidade”.
- source_word: וְלֹא יְכֻסֶּה
  choice: não fica oculto
  rationale: A forma passiva de כסה significa ser coberto, escondido ou ocultado. A formulação portuguesa expressa naturalmente que a adversidade expõe o inimigo.
- source_word: בְרָעָה
  choice: na adversidade
  rationale: רעה denota aqui infortúnio ou circunstâncias difíceis, e não maldade moral. “Adversidade” preserva o contraste sapiencial com “prosperidade”.
- source_word: שׂוֹנֵא
  choice: o inimigo
  rationale: O particípio descreve uma pessoa hostil, literalmente “quem odeia”. “Inimigo” é o equivalente idiomático adequado, também apoiado pelo grego ἐχθρός.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo proverbial marcado por ponto e vírgula. Os artigos definidos têm valor genérico em português e evitam uma formulação artificial. A expressão “não fica oculto” torna natural a voz passiva do segundo membro sem eliminar o contraste entre conhecer e ocultar.
