  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
translation:
  language: pt
  text: Assim é quem se associa a um homem insolente e se revolve nos pecados dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego difere substancialmente neste ponto: “Se algum mal lhe sobrevier, você o encontrará ali antes que você chegue; e, como quem ajuda, fará você tropeçar.” O hebraico preservado na Genizá do Cairo fala, em vez disso, de associar-se a um homem insolente e revolver-se nos pecados dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Assim é
  rationale: Introduz a comparação ou aplicação do versículo anterior e mantém o tom proverbial do hebraico.
- source_word: חוֹבֵר אֶל
  choice: quem se associa a
  rationale: Expressa o sentido de unir-se ou manter associação com alguém, sem pressupor amizade íntima.
- source_word: אִישׁ זָדוֹן
  choice: um homem insolente
  rationale: Conserva o masculino singular explícito e traduz זָדוֹן como uma disposição arrogante e presunçosa voltada para o mal.
- source_word: וּמִתְגֹלֵל
  choice: e se revolve
  rationale: Preserva de maneira natural a imagem reflexiva de rolar ou revolver-se, sem substituí-la por uma explicação interpretativa como 'se envolve'.
- source_word: בַּעֲוֹנֹתָיו
  choice: nos pecados dele
  rationale: עָוֹן pode indicar pecado, iniquidade ou culpa; 'pecados' é claro no contexto. 'Dele' explicita que o sufixo provavelmente se refere ao homem insolente, evitando a ambiguidade pronominal que 'seus' teria em português.
theological_decisions:
- issue: Relação entre o texto hebraico e o paralelo grego substancialmente divergente
  choice: Traduzir no texto principal o hebraico preservado nos manuscritos da Genizá do Cairo.
  alternative: 'Grego: “Se algum mal lhe sobrevier, você o encontrará lá antes de você; e, fingindo ajudá-lo, ele lhe dará uma rasteira.”'
  rationale: Como o hebraico está preservado, ele rege a tradução. A leitura grega formula uma advertência bastante diferente e, por afetar materialmente a interpretação, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção proverbial foi mantida, e a imagem concreta do hebraico foi preservada sem suavizar sua estranheza.
