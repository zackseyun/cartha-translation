base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/007.yaml
  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: pt
  text: Dê ao bom e negue ao mau.[a] Honre o pobre e não dê a um estranho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do mal». O hebraico pode referir-se ao mal em sentido abstrato ou, no contraste com «ao bom», a uma pessoa má; o grego traz: «não ampare o pecador».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «a um forasteiro» ou «a alguém de fora». O termo hebraico pode designar amplamente alguém que está fora da comunidade ou do círculo pertinente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: Dê ao bom
  rationale: Traduz diretamente o imperativo e preserva a formulação concisa do hebraico, cujo adjetivo substantivado se refere a uma pessoa boa.
- source_word: וּמְנַע מֵרָע
  choice: e retenha do mau
  rationale: 'Mantém o sentido usual de מנע, “reter/privar”, e a concisão ambígua de רָע, que pode indicar o mal ou uma pessoa má. O paralelo grego explicita uma leitura pessoal: “não ampare o pecador”.'
- source_word: הֹקֵיר מָךְ
  choice: honre o pobre
  rationale: הֹקֵיר expressa honra ou estima, e מָךְ designa alguém pobre, humilde ou de baixa condição; “o pobre” é claro e natural.
- source_word: וְאַל תִּתֵּן לְזֵר
  choice: e não dê ao estranho
  rationale: A negativa e o verbo são diretos. זָר pode designar estranho, forasteiro ou alguém de fora; “estranho” preserva essa amplitude sem impor uma definição étnica.
theological_decisions:
- issue: Se מֵרָע designa o mal em sentido abstrato ou uma pessoa má/pecadora
  choice: Preservar no texto a leitura pessoal concisa, “do mau”, sem substituir o hebraico pela explicitação grega “do pecador”.
  alternative: “afaste-se do mal” ou, conforme o paralelo grego, “não ampare o pecador”
  rationale: O contraste com “ao bom” favorece um referente pessoal, mas a forma hebraica continua lexicalmente ambígua. A tradução não deve resolver silenciosamente essa tensão.
- issue: Alcance social de לְזֵר
  choice: “ao estranho”
  alternative: “ao forasteiro” ou “a alguém de fora”
  rationale: O termo pode indicar alguém alheio ao grupo ou círculo pertinente, sem exigir uma leitura estritamente étnica.
translation_notes:
  register: Português moderno, sóbrio e acessível, com paralelismo imperativo próximo do hebraico. “Dê ao bom” e “retenha do mau” são deliberadamente concisos para conservar a antítese formal do original.
