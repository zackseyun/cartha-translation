revisions:
- from: Dê ao bom e retenha do mau; honre o pobre e não dê ao estranho.[a]
  to: Dê ao bom e negue ao mau.[a] Honre o pobre e não dê a um estranho.[b]
  rationale: A revisão substitui a formulação não idiomática «retenha do mau» por «negue ao mau», que transmite a recusa de dar ou conceder, conserva a oposição pessoal favorecida pelo paralelismo e não converte a formulação grega em texto principal. Também separa as notas e desloca cada âncora para o termo que ela esclarece.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:02:08Z'
review_pass:
  verdict: revise
  source_fidelity: O texto preserva bem a estrutura imperativa e os contrastes éticos do hebraico. Contudo, «retenha do mau» não expressa de modo idiomático em português a construção elíptica de מנע מן; «negue ao mau» conserva a ideia de reter/recusar algo a uma pessoa má sem adotar como texto principal a explicitação grega «não ampare o pecador».
  naturalness: «Dê ao bom» e «honre o pobre» são concisos e naturais no registro sapiencial. «Retenha do mau», porém, soa truncado em português moderno, pois reter normalmente pede um objeto expresso ou outra construção. «Negue ao mau» é uma elipse compreensível e idiomática nesse paralelismo. «Um estranho» evita a leitura adjetival de «estranho» e mantém o sentido de pessoa desconhecida ou exterior ao círculo relevante.
  terminology: '«Bom», «mau», «pobre» e «honre» refletem adequadamente as categorias concisas do hebraico. As duas ambiguidades relevantes devem ter notas distintas e ancoradas nos respectivos termos: מֵרָע pode ser «do mal» ou referir-se a uma pessoa má, enquanto לְזֵר pode ser «forasteiro», «alguém de fora» ou, em certos contextos, estrangeiro.'
  issues:
  - severity: medium
    issue: «retenha do mau» é pouco idiomático e sintaticamente incompleto em português moderno.
    rationale: Embora reproduza formalmente «withhold from», a construção portuguesa usual exige objeto («retenha algo do mau») ou um verbo de recusa/negação. A revisão mantém a elipse do objeto presente no hebraico sem sacrificar a legibilidade.
  - severity: low
    issue: A única nota, ancorada em «estranho», também comenta o primeiro membro do versículo.
    rationale: A ancoragem deve indicar claramente qual expressão cada esclarecimento lexical ou textual qualifica. Separar as notas melhora a verificabilidade sem alterar o sentido.
