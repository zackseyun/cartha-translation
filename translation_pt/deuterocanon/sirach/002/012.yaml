  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: pt
  text: Ai dos tímidos de coração e dos que têm as mãos frouxas, e do pecador de caminhos tortuosos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “do ímpio de caminhos tortuosos”. O paralelo grego traz “do pecador que anda por dois caminhos”, expressão que pode sugerir conduta dividida ou dúplice.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Ai
  rationale: Interjeição natural em português que preserva a força de lamento e advertência do hebraico.
- source_word: לְרַכֵּי לֵב
  choice: dos tímidos de coração
  rationale: O hebraico descreve negativamente a falta de coragem; o paralelo grego confirma o sentido de timidez, e a expressão conserva a imagem do coração.
- source_word: וּרְפֵה יָדָיִם
  choice: e dos que têm as mãos frouxas
  rationale: Mantém a imagem concreta de mãos sem força ou firmeza, usada para falta de ânimo e resolução.
- source_word: וְלָרָשָׁע
  choice: e do pecador
  rationale: Embora רשע também possa significar 'ímpio' ou 'malvado', o grego ἁμαρτωλῷ favorece 'pecador'.
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: de caminhos tortuosos
  rationale: Traduz diretamente o hebraico transmitido sem resolver sua formulação difícil pela leitura mais específica do paralelo grego.
theological_decisions:
- issue: Colo final difícil no hebraico em comparação com o paralelo grego
  choice: de caminhos tortuosos
  alternative: que anda por dois caminhos
  rationale: O texto principal segue o hebraico preservado, cuja linguagem caracteriza os caminhos como tortuosos. A nota registra o grego, que pode indicar conduta dividida ou dúplice, preservando a tensão textual sem impor essa interpretação ao hebraico.
translation_notes:
  register: Português moderno, claro e digno, com cadência sapiencial. “Ai” preserva a advertência solene; as imagens de coração e mãos foram mantidas. O marcador [a] aparece no texto principal junto ao trecho textual discutido.
