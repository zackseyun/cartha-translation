base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/001.yaml
  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
translation:
  language: pt
  text: Meu filho, se você se aproximar para servir a Yahweh, prepare-se para toda provação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prepare a sua alma para toda provação”. Tanto o hebraico como o grego empregam um termo relacionado a pôr à prova; conforme o contexto, a palavra grega também pode significar “tentação”.'
    reason: Registra a formulação mais literal de נַפְשְׁךָ e a amplitude semântica de נִסָּיוֹן / πειρασμόν.
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo filial, singular e masculino do hebraico, bem como o tom paterno característico da literatura sapiencial.
- source_word: תִּקְרַב
  choice: se você se aproximar
  rationale: Expressa naturalmente o sentido de chegar perto ou aproximar-se, confirmado pelo grego προσέρχῃ, sem perder a possível nuance de aproximação religiosa.
- source_word: לַעֲבוֹד
  choice: para servir
  rationale: O verbo עבד abrange serviço, obediência e serviço cultual; “servir” mantém essa amplitude, também refletida no grego δουλεύειν.
- source_word: אֶת יְהֹוָה
  choice: a Yahweh
  rationale: Translitera o nome divino pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: הָכֵן
  choice: prepare-se
  rationale: Transmite a ordem de dispor-se deliberadamente para o que virá e soa natural no português contemporâneo.
- source_word: נַפְשְׁךָ
  choice: -se
  rationale: O hebraico נֶפֶשׁ pode designar a pessoa, a vida ou a alma. A construção reflexiva “prepare-se” comunica aqui a preparação da pessoa inteira sem impor uma leitura antropológica mais estreita.
- source_word: לְכָל נִסָּיוֹן
  choice: para toda provação
  rationale: “Toda” conserva a abrangência de כָּל, e “provação” expressa o sentido de teste ou dificuldade de נִסָּיוֹן de modo idiomático e apropriado ao contexto.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita convertê-lo silenciosamente em um título; a forma portuguesa tradicional “Javé” é possível, mas se afasta mais da transliteração adotada pelo projeto.
- issue: Sentido de נַפְשְׁךָ / τὴν ψυχήν σου
  choice: prepare-se
  alternative: prepare a sua alma
  rationale: No contexto, a expressão se refere naturalmente à pessoa inteira. A forma reflexiva evita sugerir que apenas uma parte imaterial da pessoa deve ser preparada, enquanto a alternativa literal é registrada em nota.
- issue: Sentido de נִסָּיוֹן / πειρασμόν
  choice: provação
  alternative: teste; tentação
  rationale: O contexto trata das dificuldades encontradas no serviço a Deus. “Provação” preserva a ideia de algo que põe a pessoa à prova sem decidir que se trata especificamente de incitação ao pecado; o grego permite também “tentação” conforme o contexto.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, sem regionalismos marcados. O uso de “você” favorece clareza ampla; “provação” mantém o registro sapiencial e religioso sem soar arcaico.
