translation:
  language: pt
  text: Aceite tudo o que vier sobre você e, nas mudanças de sua humilhação,[a] seja paciente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em seu quebrantamento”; paralelo grego: “nas mudanças de sua humilhação”. O texto principal considera ambos os testemunhos.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: tudo o que vier sobre você
  rationale: Expressa naturalmente o sentido literal de “tudo o que vier sobre você” e mantém aberto o tipo de provação ou circunstância envolvida.
- source_word: קַבֵּל
  choice: aceite
  rationale: Transmite a exortação a receber as circunstâncias sem resistência; “acolha” sugeriria uma disposição positiva forte demais.
- source_word: וּבְשִׁבְרְךָ
  choice: nas mudanças da sua humilhação
  rationale: Leitura que considera em conjunto o hebraico, cujo sentido mais direto é “em seu quebrantamento”, e o paralelo grego, que fala das “mudanças” da humilhação. A incerteza textual é preservada em nota.
- source_word: הַאֲרֵךְ רוּחַ
  choice: seja paciente
  rationale: Equivalente português claro e corrente do idioma hebraico “alongue o espírito”, confirmado pelo grego μακροθύμησον, com o sentido de perseverar pacientemente.
theological_decisions:
- issue: Uso do testemunho hebraico primário em conjunto com o paralelo grego numa expressão difícil
  choice: nas mudanças da sua humilhação
  alternative: em seu quebrantamento
  rationale: A redação principal conserva a leitura mais ampla refletida pelo paralelo grego sem ocultar que o hebraico aponta mais diretamente para quebrantamento. A nota registra a diferença entre os testemunhos, sem resolver indevidamente a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros. A expressão incomum “mudanças da sua humilhação” foi mantida para preservar a tensão entre os testemunhos hebraico e grego, esclarecida em nota.
