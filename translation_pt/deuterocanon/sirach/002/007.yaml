base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/007.yaml
  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: pt
  text: Vocês que temem Yahweh, esperem por sua misericórdia[a] e não se desviem, para não caírem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode expressar amor constante, lealdade ou bondade; o paralelo grego traz “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: Vocês que temem Yahweh
  rationale: A construção hebraica, confirmada pelo particípio grego, funciona como tratamento direto a um grupo. “Vocês que temem” mantém a força exortativa e expressa temor reverente em linguagem portuguesa corrente.
- source_word: חַכּוּ / ἀναμείνατε
  choice: esperem por
  rationale: Os imperativos hebraico e grego indicam expectativa paciente. “Esperem por” é natural e conserva a relação explícita com o objeto, sem acrescentar a nuance interpretativa de “tenham esperança”.
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: sua misericórdia
  rationale: Embora חֶסֶד possa indicar amor constante, lealdade ou bondade, o paralelo grego usa ἔλεος, favorecendo “misericórdia” neste contexto de confiança na compaixão divina.
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: não se desviem
  rationale: O verbo retrata o abandono de um caminho ou curso. “Não se desviem” preserva essa imagem e soa claro e digno em português moderno.
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: para não caírem
  rationale: A formulação conserva a advertência negativa e deixa em aberto se a queda é moral, espiritual ou circunstancial. É mais natural no português corrente do que a construção mais solene “para que não caiam”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título; o grego Κύριον reflete a tradição de lê-lo como “Senhor”.
- issue: Nuance de חֶסֶד à luz do paralelo grego
  choice: misericórdia
  alternative: amor constante; lealdade; bondade
  rationale: O hebraico admite uma gama semântica mais ampla, inclusive lealdade e amor constante, mas o grego ἔλεος sustenta de modo específico “misericórdia”. A nota mantém visível a amplitude do termo hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O plural “vocês” torna explícito o tratamento direto já presente no hebraico e no grego. A redação conserva o paralelismo exortativo e evita definir a natureza da “queda”.
