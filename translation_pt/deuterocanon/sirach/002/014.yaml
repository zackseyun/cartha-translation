base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: pt
  text: Ai de vocês que perderam a esperança[a]! O que farão por ocasião da visitação do SENHOR[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “que perderam a perseverança” ou “que perderam a paciência” (τὴν ὑπομονήν), ao passo que o hebraico traz “esperança”.
    reason: alternative_reading
  - marker: b
    text: “Visitação” traduz um termo hebraico que pode indicar a atenção interventora do SENHOR, muitas vezes em julgamento, como sugere este contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: Ai de vocês
  rationale: Preserva a força profética da interjeição hebraica, que expressa tanto lamento quanto ameaça, em formulação natural em português.
- source_word: אוֹבְדֵי תִּקְוָה
  choice: que perderam a esperança
  rationale: Exprime de modo claro e idiomático a ideia hebraica daqueles cuja esperança se perdeu, sem substituir a leitura hebraica pela nuance do paralelo grego.
- source_word: תִּקְוָה
  choice: esperança
  rationale: É o sentido comum do termo hebraico e se ajusta naturalmente ao contexto sapiencial.
- source_word: פְקוֹד
  choice: visitação
  rationale: Mantém a amplitude do termo derivado de פקד, que pode indicar a atenção interventora de Deus, aqui com força ameaçadora, sem explicitar além do texto que se trata de punição.
- source_word: יְהֹוָה
  choice: SENHOR
  rationale: Segue a convenção reverente e amplamente reconhecida de representar o Tetragrama por “SENHOR”.
theological_decisions:
- issue: Se a frase final deve tornar explícita uma punição divina
  choice: por ocasião da visitação do SENHOR
  alternative: quando o SENHOR castigar
  rationale: O contexto de advertência confere tom ameaçador, mas o hebraico não restringe lexicalmente a visitação à punição. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com tratamento plural de ampla legibilidade brasileira. “Visitação” é deliberadamente mais formal para conservar a amplitude teológica do hebraico; a nota esclarece seu sentido. Os marcadores foram colocados junto aos termos que explicam.
