base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/017.yaml
  text: Those who fear Yahweh will prepare their hearts[a], and before him they will humble their spirits.
translation:
  language: pt
  text: Os que temem Yahweh prepararão seus corações e, diante dele, humilharão seus espíritos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “humilharão suas almas”. O testemunho hebraico diz “seus espíritos”, forma adotada no texto principal.
    reason: alternativa lexical no paralelo grego
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: os que temem a Yahweh
  rationale: A expressão hebraica designa pessoas caracterizadas pelo temor reverente a YHWH. A formulação preserva tanto o conhecido idioma bíblico do temor quanto o nome divino.
- source_word: יָכִינוּ לְבָבָם
  choice: prepararão seus corações
  rationale: O hifil de כון pode significar preparar, dispor ou firmar. “Prepararão” é natural no contexto de disposição interior e concorda com o paralelo grego ἑτοιμάσουσιν.
- source_word: לְבָבָם
  choice: seus corações
  rationale: לֵבָב abrange pensamento, vontade e interioridade. “Corações” mantém a metáfora bíblica sem reduzi-la apenas à mente ou às emoções.
- source_word: וּלְפָנָיו
  choice: diante dele
  rationale: Reproduz de modo direto e natural a ideia espacial e relacional de estar perante Deus.
- source_word: יַכְנִיעוּ רוּחָם
  choice: humilharão seus espíritos
  rationale: A tradução mantém o verbo de rebaixamento ou submissão e conserva o termo antropológico explícito רוּחַ, em vez de o substituir por um simples pronome reflexivo.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual, sem substituí-lo por um título.
- issue: Hebraico רוּחָם em comparação com o grego τὰς ψυχὰς αὐτῶν
  choice: seus espíritos
  alternative: suas almas
  rationale: O testemunho hebraico, fonte principal fornecida e de alta confiança, traz “seu espírito”; a variante do paralelo grego é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. O plural “seus corações” e “seus espíritos” acompanha o grupo plural e conserva as imagens antropológicas do hebraico.
