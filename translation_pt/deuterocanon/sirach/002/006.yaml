translation:
  language: pt
  text: Confie nele[a], e ele o sustentará; endireite seus caminhos[b] e ponha nele sua esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Creia nele” ou “Tenha fé nele”. O hebraico e o grego podem expressar confiança e dependência, não apenas assentimento intelectual.
    reason: lexical_alternative
  - marker: b
    text: 'A oração intermediária é traduzida como exortação — “endireite seus caminhos” — de acordo com o hebraico e o grego. Algumas traduções a entendem como promessa: “ele dirigirá” ou “ele endireitará seus caminhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  choice: Confie nele
  rationale: O hifil de אמן e o grego πιστεύω exprimem confiança e dependência, não apenas concordância intelectual. “Confie nele” é natural e preserva a força exortativa.
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: ele o sustentará
  rationale: A expressão hebraica e o paralelo grego comunicam tomar alguém pela mão em apoio, amparar ou sustentar. “Sustentará” conserva a imagem de apoio contínuo.
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: endireite os seus caminhos
  rationale: As formas hebraica e grega favorecem um imperativo dirigido ao leitor. “Endireite” reproduz a metáfora moral de tornar reto o curso da vida.
- source_word: אָרְחוֹתֶיךָ / ὁδούς σου
  choice: os seus caminhos
  rationale: “Caminhos” é uma metáfora corrente e inteligível para a conduta e o rumo da vida, correspondendo bem aos termos hebraico e grego.
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: e espere nele
  rationale: O hebraico קוה abrange esperar e ter esperança; o grego reforça a dimensão de esperança. “Espere nele” conserva a expectativa confiante e soa natural no contexto.
theological_decisions:
- issue: Sujeito e força da oração intermediária
  choice: 'Imperativo dirigido ao leitor: “endireite os seus caminhos”.'
  alternative: 'Promessa sobre Deus: “ele endireitará/dirigirá os seus caminhos”.'
  rationale: O hebraico e o grego apresentam formas imperativas numa sequência de exortações. Mantém-se essa leitura sem transferir silenciosamente a ação para Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega tratamento formal impessoal com “seus” e mantém o paralelismo conciso da máxima sapiencial.
