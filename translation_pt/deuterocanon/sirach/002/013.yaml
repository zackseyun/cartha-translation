  text: Woe to the heart that does not trust[a], for it also will not stand.
translation:
  language: pt
  text: Ai do coração que não confia[a], pois ele também não permanecerá de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Ai do coração enfraquecido, porque não crê; por isso não será protegido.” O hebraico traz “coração” e “não permanecerá de pé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Ai
  rationale: Interjeição corrente em português que conserva a força de lamento e advertência do hebraico.
- source_word: לְלֵב
  choice: do coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro da vontade e da disposição interior, também presente no grego καρδίᾳ.
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: que não confia
  rationale: O verbo אמן pode expressar crer ou confiar; no contexto de perseverança durante a provação, 'confia' comunica naturalmente a dependência prática de Deus sem transformar a frase em formulação doutrinária abstrata.
- source_word: וְאַף הוּא
  choice: pois ele também
  rationale: Expressa a consequência com a ênfase inclusiva da construção hebraica, em português natural.
- source_word: לֹא יָקוּם
  choice: não permanecerá de pé
  rationale: Preserva a imagem literal de קום, 'levantar-se/ficar de pé', e comunica a incapacidade de manter-se firme ou subsistir.
theological_decisions:
- issue: Sentido de אמן no contexto de uma exortação sapiencial
  choice: não confia
  alternative: não crê; não tem fé
  rationale: Hebraico e grego admitem a ideia de crer/confiar. 'Não confia' destaca a confiança perseverante exigida pelo contexto sem importar uma formulação confessional posterior.
- issue: Destino do coração sem confiança
  choice: não permanecerá de pé
  alternative: não se levantará; não resistirá; não será protegido
  rationale: A tradução segue o hebraico לֹא יָקוּם e mantém sua imagem e amplitude. A leitura grega 'não será protegido' é registrada em nota, sem substituir o texto hebraico de alta confiança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso e o tom sapiencial de advertência.
