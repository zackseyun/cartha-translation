base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/015.yaml
  text: Those who fear Yahweh will not rebel against his ways[a], and those who love him will keep his paths.
translation:
  language: pt
  text: Os que temem Yahweh não se rebelarão contra seus caminhos[a], e os que o amam guardarão suas veredas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “não desobedecerão às suas palavras”, em vez do hebraico: “não se rebelarão contra seus caminhos”. Aqui se segue como principal o testemunho hebraico da Genizá do Cairo; o grego preserva o mesmo sentido geral de obediência fiel.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: os que temem a Yahweh
  rationale: A expressão participial descreve pessoas caracterizadas pelo temor de YHWH. “Temem” preserva a força própria da linguagem sapiencial e da aliança, sem reduzi-la apenas a reverência; “Yahweh” representa diretamente o nome divino.
- source_word: לֹא יַמְרוּ
  choice: não se rebelarão
  rationale: O verbo מרה expressa rebeldia ou resistência desafiadora, sentido mais forte que uma simples falha em obedecer.
- source_word: בִּדְרָכָיו
  choice: contra os seus caminhos
  rationale: Com מרה, a preposição ב pode indicar aquilo contra o qual se dirige a rebeldia. “Contra” torna clara essa relação em português.
- source_word: וְאוֹהֲבָיו
  choice: os que o amam
  rationale: A construção participial identifica pessoas por seu amor a Deus; esta formulação é direta e natural em português.
- source_word: יִצְרוּ
  choice: guardarão
  rationale: נצר pode significar guardar, conservar ou observar. “Guardarão” preserva tanto a ideia de observância fiel quanto a de cuidado atento.
- source_word: אָרְחוֹתָיו
  choice: as suas veredas
  rationale: “Veredas” conserva a imagem de אָרְחוֹת e mantém a variação poética em relação a דְרָכָיו, traduzido como “caminhos” no primeiro membro.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e corresponde à orientação fornecida, sem substituí-lo por um título.
- issue: Força de מרה no relacionamento com Deus
  choice: rebelar-se
  alternative: desobedecer
  rationale: O hebraico sugere resistência ou desafio, não apenas desobediência. A leitura grega é registrada em nota para não ocultar a variante textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi preservado por meio de “caminhos” e “veredas”, e a linguagem mais forte de rebeldia foi mantida.
