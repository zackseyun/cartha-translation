  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: pt
  text: Vocês que temem Yahweh, esperem pelo bem[a], pela alegria eterna e pela misericórdia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “coisas boas”, com o substantivo no plural.
    reason: alternative_reading
  - marker: b
    text: O hebraico traduzido por “misericórdia” também pode significar “amor leal” ou “bondade”; o paralelo grego igualmente traz “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Vocês que temem Yahweh
  rationale: A expressão participial plural funciona como vocativo e se dirige diretamente a um grupo. “Vocês que temem” conserva a força exortativa em português atual.
- source_word: קַוּוּ
  choice: esperem
  rationale: O imperativo expressa expectativa confiante. “Esperem” preserva a amplitude do hebraico e corresponde bem ao grego ἐλπίσατε, sem restringir o sentido a mera espera passiva.
- source_word: לְטוֹב
  choice: o bem
  rationale: O hebraico emprega o singular de sentido amplo. “O bem” mantém essa formulação aberta, enquanto a variante de número do paralelo grego é registrada em nota.
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: a alegria eterna
  rationale: A expressão comunica alegria duradoura, sem impor uma nuance além do valor temporal de עוֹלָם; a formulação é natural e digna em português.
- source_word: וָחֶסֶד
  choice: e a misericórdia
  rationale: חֶסֶד pode indicar misericórdia, bondade ou amor leal. “Misericórdia” se ajusta à série de bens esperados e também é apoiado pelo grego ἐλέους, sem eliminar em nota a amplitude lexical do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração representa explicitamente o nome divino do texto hebraico. O grego Κύριον reflete a tradição reverencial de substituí-lo por “Senhor”, mas não exige que essa substituição seja introduzida na tradução do hebraico.
- issue: Prioridade do hebraico apesar da divergência indicada na validação
  choice: Traduzir prioritariamente o hebraico preservado, conferindo-o com o paralelo grego
  alternative: Traduzir somente o grego ou harmonizar o hebraico com o plural grego
  rationale: O hebraico está preservado e oferece uma leitura coerente. O grego confirma o sentido geral, mas sua forma plural em “coisas boas” não deve substituir silenciosamente o singular hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção diretamente exortativa. “Vocês” favorece a legibilidade brasileira sem recorrer a regionalismos; a coordenação concisa acompanha a estrutura poética do hebraico.
