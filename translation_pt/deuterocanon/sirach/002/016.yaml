base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/016.yaml
  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: pt
  text: Os que temem o SENHOR buscarão seu favor, e os que o amam aprenderão sua Lei.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua instrução”.
    reason: alternativa lexical para תוֹרָתוֹ, cujo sentido abrange Lei, instrução e ensino
  - marker: b
    text: 'O paralelo grego traz: “e os que o amam ficarão cheios da Lei”.'
    reason: leitura alternativa decorrente da divergência textual entre o hebraico e o grego
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: os que temem o SENHOR
  rationale: Preserva a formulação hebraica de temor reverente e pactual em português natural; SENHOR representa o nome divino YHWH.
- source_word: יְבַקְּשׁוּ
  choice: buscarão
  rationale: O imperfeito expressa ação futura ou característica, em acordo com o paralelo grego ζητήσουσιν.
- source_word: רְצוֹנוֹ
  choice: seu favor
  rationale: רצון pode indicar favor, aceitação ou beneplácito; o grego εὐδοκίαν apoia este sentido, sem excluir totalmente a ideia de vontade.
- source_word: וְאֹהֲבָיו
  choice: e os que o amam
  rationale: O sufixo remete ao SENHOR e exprime devoção pessoal de modo claro e corrente.
- source_word: יִלְמְדוּ
  choice: aprenderão
  rationale: No qal, למד significa normalmente aprender. A tradução segue o testemunho hebraico existente, enquanto registra em nota a divergência grega.
- source_word: תוֹרָתוֹ
  choice: sua Lei
  rationale: תורה designa a Lei e, mais amplamente, instrução ou ensino. 'Lei' conserva a força tradicional e pactual, e a alternativa semântica é indicada em nota.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro
  choice: aprenderão sua Lei
  alternative: 'o paralelo grego traz: “ficarão cheios da Lei”'
  rationale: O hebraico sobrevivente é o testemunho principal e tem alta confiança; a leitura grega materialmente distinta é preservada em nota, sem harmonização.
- issue: Amplitude semântica de תורה
  choice: Lei
  alternative: instrução ou ensino
  rationale: A opção principal mantém a ressonância pactual tradicional, mas a nota evita restringir תורה à ideia moderna de código jurídico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “SENHOR” para YHWH e mantém o paralelismo conciso do hebraico. Os marcadores aparecem no texto em ordem correspondente às notas.
