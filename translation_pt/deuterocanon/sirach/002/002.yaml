base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/002.yaml
  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: pt
  text: Prepare o seu coração e fortaleça-se; não se assuste no dia da calamidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “não se apresse no tempo da aflição (ou visitação)”. O hebraico enfatiza não ficar consternado; o grego, evitar a precipitação em meio à provação.'
    reason: Leitura alternativa do paralelo grego.
lexical_decisions:
- source_word: הָכֵן
  choice: Prepare
  rationale: O hifil de כון expressa estabelecer, preparar ou pôr em ordem. “Prepare” é natural em português e comunica a disposição interior requerida; o paralelo grego εὐθυνον (“endireite/dirija”) reforça a ideia de orientar interiormente o coração.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: לֵב designa o centro da vida interior, incluindo pensamento, vontade e resolução. “Coração” preserva o idioma bíblico e continua compreensível no português atual.
- source_word: וְהִתְחַזֵּק
  choice: fortaleça-se
  rationale: A forma reflexiva de חזק sugere fortalecer a si mesmo, mostrar firmeza ou perseverar. “Fortaleça-se” preserva essa força reflexiva e soa natural como exortação.
- source_word: וְאַל תִּבָּהֵל
  choice: não se assuste
  rationale: בהל significa ficar alarmado, perturbado ou consternado. “Não se assuste” representa diretamente o hebraico sem intensificá-lo para “não entre em pânico”.
- source_word: בְּיוֹם אֵד
  choice: no dia da calamidade
  rationale: A expressão significa literalmente “no dia da calamidade/desastre”. A formulação conserva a imagem temporal concreta do hebraico e permanece idiomática em português.
theological_decisions:
- issue: Relação entre o hebraico e o grego na última oração
  choice: Seguir no texto principal a advertência hebraica contra o susto ou a consternação.
  alternative: “Não se apresse no tempo da aflição/visitação”, conforme o grego.
  rationale: Como o hebraico está preservado com alta confiança, ele orienta o texto principal. O grego apresenta uma ênfase distinta, possivelmente contra uma reação precipitada durante a provação; essa tensão genuína é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O imperativo singular foi mantido. A pontuação preserva a progressão entre preparo interior, fortalecimento e firmeza diante da calamidade.
