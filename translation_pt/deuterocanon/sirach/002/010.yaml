base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: pt
  text: 'Olhem para as gerações antigas e vejam: quem creu em Yahweh e foi envergonhado? Ou quem confiou nele e foi abandonado? Ou quem o invocou e não recebeu resposta?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “quem permaneceu no temor dele e foi abandonado?”. O hebraico preservado diz: “quem confiou nele e foi abandonado?”.'
    reason: alternative_reading
  - marker: b
    text: 'O grego traz: “quem o invocou, e ele o ignorou?”. O hebraico diz: “quem o invocou e não recebeu resposta?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: Olhem para as gerações antigas
  rationale: Mantém o imperativo plural e apresenta as gerações anteriores como precedente histórico, em português natural e digno.
- source_word: הֶאֱמִין בַּיהֹוָה
  choice: creu em Yahweh
  rationale: Traduz אמן como crer, preservando sua distinção lexical em relação a בטח, traduzido na oração seguinte como confiar.
- source_word: וַיֵּבוֹשׁ
  choice: foi envergonhado
  rationale: Expressa o resultado de desonra ou frustração pública após uma confiança supostamente mal depositada, em consonância com o hebraico e o grego.
- source_word: בָּטַח בּוֹ
  choice: confiou nele
  rationale: בטח denota confiança e dependência; esta formulação é clara e preserva a diferença em relação a הֶאֱמִין.
- source_word: וְנֶעֱזַב
  choice: foi abandonado
  rationale: Reproduz diretamente a ideia de ser deixado sem auxílio.
- source_word: קָרָא אֵלָיו
  choice: o invocou
  rationale: No contexto, o verbo descreve um apelo dirigido a Deus; 'invocou' comunica essa dimensão de oração com concisão.
- source_word: וְלֹא נֶעֱנָה
  choice: não recebeu resposta
  rationale: Forma natural em português para o passivo hebraico 'não foi respondido', sem ampliar o sentido para 'não foi ouvido'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Seguir o hebraico no texto principal e registrar as variantes gregas em notas
  alternative: Adotar no texto principal 'permaneceu no temor dele' e 'ele o ignorou' segundo o grego
  rationale: O hebraico está preservado aqui com alta confiança e constitui a fonte principal; as divergências significativas do grego são mantidas de modo transparente nas notas.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O paralelismo retórico foi preservado, assim como a distinção entre 'crer' e 'confiar'. O tom é elevado sem recorrer a formas arcaicas.
