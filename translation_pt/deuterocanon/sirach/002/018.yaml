base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: pt
  text: Caiamos na mão de Yahweh[a], e não na mão do ser humano, pois, como é a sua grandeza, assim também é a sua misericórdia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “mãos” nas duas orações (“nas mãos do Senhor… nas mãos dos seres humanos”); o testemunho hebraico traz o singular “mão”, seguido aqui.
    reason: textual_variant
  - marker: b
    text: Ou “seu amor leal” ou “seu amor constante”. O hebraico חֶסֶד pode expressar bondade fiel e lealdade; o paralelo grego traz “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: Caiamos
  rationale: O coortativo hebraico na primeira pessoa do plural expressa uma exortação voluntativa. “Caiamos” preserva tanto essa força quanto a imagem concreta de cair na mão de alguém, também presente no paralelo grego.
- source_word: בְּיַד
  choice: na mão
  rationale: O testemunho hebraico primário emprega o singular nas duas orações. “Na mão” conserva essa forma e comunica estar entregue ao poder de alguém sem substituir a metáfora por uma explicação.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino expresso pelo Tetragrama no texto hebraico, em vez de substituí-lo por um título.
- source_word: אָדָם
  choice: ser humano
  rationale: Aqui o substantivo singular tem sentido genérico e contrasta a humanidade mortal com Yahweh. “Ser humano” mantém o singular representativo sem sugerir que a oposição se limite ao sexo masculino.
- source_word: כְּגָדְלוֹ ... כֵּן
  choice: assim como é a sua grandeza, assim também
  rationale: A formulação reproduz a correlação comparativa כ...כן e preserva o substantivo “grandeza”, com a cópula suprida em português para clareza natural.
- source_word: חַסְדּוֹ
  choice: sua misericórdia
  rationale: חסד pode indicar bondade leal ou amor constante; neste contexto, a confiança diante do juízo favorece “misericórdia”, também apoiado pelo grego ἔλεος.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem transformar o termo em título.
- issue: Sentido genérico de אָדָם no contraste com Deus
  choice: ser humano
  alternative: homem
  rationale: O referente é a humanidade mortal em geral, não especificamente um indivíduo masculino. A opção conserva o singular retórico e torna explícito o alcance genérico.
- issue: Amplitude semântica de חֶסֶד
  choice: misericórdia
  alternative: amor leal
  rationale: A tradução mantém em primeiro plano a compaixão divina evocada pelo contexto e pelo paralelo grego, enquanto a nota registra a dimensão possível de amor constante ou leal.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial próxima do hebraico. O singular “mão” foi mantido apesar de “nas mãos” ser mais idiomático em português, pois constitui uma variante textual relevante. “Ser humano” assegura leitura genericamente humana com ampla inteligibilidade internacional.
