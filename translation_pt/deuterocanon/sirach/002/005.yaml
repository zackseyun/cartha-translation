base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/005.yaml
  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: pt
  text: Pois o ouro é provado no fogo, e os que são aceitos, na fornalha da aflição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz uma expressão difícil no segundo membro. O paralelo grego diz: “pessoas aceitas numa fornalha de humilhação”. A tradução segue esse sentido, mantendo-se ligada ao texto hebraico preservado.'
    reason: Leitura alternativa e esclarecimento textual.
lexical_decisions:
- source_word: יִבָּחֵן
  choice: é provado
  rationale: O verbo בחן indica submeter a prova ou verificar a qualidade. “É provado” preserva a voz passiva e a comparação com o ouro sem acrescentar explicitamente a ideia de refino.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente lexical direto e natural.
- source_word: בְּנֵי אָדָם
  choice: os que são aceitos
  rationale: A expressão hebraica designa seres humanos, enquanto o paralelo grego traz ἄνθρωποι δεκτοί, “pessoas aceitas/consideradas dignas”. A formulação inclusiva “os que” expressa naturalmente a referência genérica a pessoas e preserva a passividade sem especificar quem as aceita.
- source_word: בְּכוּר
  choice: que são aceitos
  rationale: A forma hebraica transmitida é difícil neste contexto. O paralelo grego δεκτοί sustenta o sentido de pessoas aceitas ou aprovadas; “que são aceitos” mantém essa leitura sem introduzir linguagem mais forte de eleição.
- source_word: עֹנִי
  choice: aflição
  rationale: O substantivo pode indicar aflição, miséria, pobreza ou humilhação. “Aflição” corresponde bem ao contexto de provação e conserva uma amplitude maior que “humilhação”.
- source_word: καμίνῳ (paralelo grego; imagem elíptica no hebraico)
  choice: fornalha
  rationale: O paralelo grego explicita a fornalha e esclarece a imagem metalúrgica iniciada no primeiro membro. “Fornalha” é a expressão portuguesa natural para esse quadro.
theological_decisions:
- issue: Uso do paralelo grego para esclarecer a expressão hebraica difícil בְּכוּר עֹנִי
  choice: Entender o segundo membro como referência aos que são aceitos e provados na aflição
  alternative: Traduzir mecanicamente “os seres humanos no cadinho da aflição” ou entender בְּכוּר como “escolhidos/primogênitos”
  rationale: 'O hebraico sobrevivente apresenta uma dificuldade contextual, ao passo que o grego preserva uma leitura coerente: ἄνθρωποι δεκτοὶ ἐν καμίνῳ ταπεινώσεως. A tradução usa esse testemunho para manter o paralelismo entre o ouro provado no fogo e as pessoas aceitas na aflição, sem transformar “aceitos” em uma afirmação denominacional sobre eleição.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A construção elíptica do segundo membro preserva o paralelismo poético; “os que” comunica de modo inclusivo a referência genérica a seres humanos.
