  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: pt
  text: Apegue-se a ele e não se afaste, para que você se torne grande em seu desfecho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que você cresça em seus últimos dias” ou “para que você se torne grande em seu futuro”. O hebraico diz “se torne grande”; “desfecho” pode referir-se aos últimos dias ou ao resultado final da pessoa. O grego traz “seja aumentado”.'
    reason: Registra as amplitudes de תִּגְדַּל (“crescer”, “tornar-se grande”) e בְּאַחֲרִיתֶךָ (“últimos dias”, “futuro”, “desfecho”), sem definir a natureza da grandeza prometida.
lexical_decisions:
- source_word: הִדָּבֵק
  choice: Apegue-se
  rationale: O verbo דבק expressa adesão firme e proximidade contínua. “Apegue-se” é corrente em português e conserva a força relacional do hebraico, confirmada pelo grego κολλήθητι.
- source_word: בּוֹ
  choice: a ele
  rationale: O sufixo pronominal masculino singular retoma Deus no contexto imediato. A tradução mantém o pronome, sem inserir novamente o nome divino.
- source_word: וְאַל תָּסוּר
  choice: e não se afaste
  rationale: סור pode significar afastar-se, retirar-se ou desviar-se. “Não se afaste” forma um paralelo relacional natural com “apegue-se” e concorda com o grego μὴ ἀποστῇς.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado esperado da exortação, sem determinar rigidamente qual dessas nuances predomina.
- source_word: תִּגְדַּל
  choice: você se torne grande
  rationale: O qal de גדל significa crescer ou tornar-se grande. A formulação preserva esse sentido básico e evita substituir a ambiguidade por “prosperar” ou por uma promessa explicitamente material; o grego αὐξηθῇς também aponta para aumento ou crescimento.
- source_word: בְּאַחֲרִיתֶךָ
  choice: no fim de sua vida
  rationale: אַחֲרִית pode indicar o fim, a etapa final ou o desfecho de uma pessoa. “No fim de sua vida” é claro e idiomático, enquanto a nota registra a possibilidade mais ampla de “desfecho final”.
theological_decisions:
- issue: Referente do pronome masculino singular
  choice: Entender “ele” como referência a Deus, conforme o contexto imediato.
  alternative: Entender o pronome como referência genérica à sabedoria ou à instrução.
  rationale: O contexto precedente exorta o leitor a confiar no Senhor, e não introduz um novo antecedente. Manter apenas “ele” preserva a coesão contextual sem explicitação excessiva.
- issue: Natureza da promessa final
  choice: Traduzir o hebraico de modo amplo como “se torne grande”, sem definir a grandeza como riqueza, honra social ou exaltação escatológica.
  alternative: “Seja exaltado” ou “prospere”.
  rationale: גדל e o paralelo grego αὐξηθῇς admitem crescimento, aumento ou grandeza. A tradução conserva essa abertura teológica em vez de restringir a promessa a uma forma específica de recompensa.
- issue: Alcance temporal de אַחֲרִית
  choice: Usar “no fim de sua vida” no texto, indicando a fase ou resultado final da vida.
  alternative: “Em seu desfecho final”, que pode abranger mais diretamente o resultado último ou uma nuance escatológica.
  rationale: A expressão hebraica pode apontar tanto para os últimos dias quanto para o resultado final. A nota conserva essa amplitude sem impor uma leitura escatológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A construção em segunda pessoa de tratamento (“você”) é direta e natural; “apegue-se” e “não se afaste” preservam o paralelismo da exortação.
