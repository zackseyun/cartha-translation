  text: For the LORD is compassionate and gracious; he forgives sins and saves in a time of distress.
translation:
  language: pt
  text: Pois o SENHOR é compassivo e bondoso; perdoa os pecados e salva no tempo da aflição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם
  choice: compassivo
  rationale: Expressa de modo natural a compaixão misericordiosa atribuída ao Senhor.
- source_word: חַנּוּן
  choice: bondoso
  rationale: Comunica a disposição de conceder graça e favor em português corrente, sem criar uma expressão redundante com “compassivo”.
- source_word: יְהֹוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional para representar o nome divino, distinguindo-o por versaletes.
- source_word: סוֹלֵחַ לַעֲוֹנוֹת
  choice: perdoa os pecados
  rationale: “Pecados” é claro ao leitor comum e concorda com o paralelo grego ἁμαρτίας; o hebraico עֲוֹנוֹת também pode enfatizar culpas ou iniquidades.
- source_word: בְּעֵת צָרָה
  choice: no tempo da aflição
  rationale: Preserva a construção temporal e traduz צָרָה como situação de angústia ou adversidade.
theological_decisions:
- issue: Representação do nome divino
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma convencional é amplamente reconhecida e não introduz uma preferência confessional específica.
- issue: Objeto do perdão
  choice: pecados
  alternative: iniquidades
  rationale: A escolha é acessível e apoiada pelo paralelo grego, embora “iniquidades” reflita mais diretamente uma possível nuance de עָוֹן.
translation_notes:
  register: Português moderno, digno e claro, com estrutura paralela próxima do hebraico. “No tempo da aflição” mantém o caráter geral da promessa sem especificar uma modalidade particular de sofrimento.
