base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/008.yaml
  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: pt
  text: Vocês que temem Yahweh, confiem nele, e ele não demorará a lhes dar a recompensa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “ele não deixará a recompensa de vocês passar a noite”, expressão que indica não reter ou não atrasar o pagamento. O paralelo grego traz: “e vocês certamente não perderão a sua recompensa”.'
    reason: A nota preserva a imagem incomum do hebraico e informa a leitura diferente do testemunho grego.
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Vocês que temem Yahweh
  rationale: A expressão participial masculina plural funciona como vocativo no contexto. A construção com “vocês que” torna claro o discurso direto em português atual, e “Yahweh” preserva o nome divino expresso no hebraico.
- source_word: הַאֲמִינוּ בּוֹ
  choice: confiem nele
  rationale: O imperativo de אמן com ב indica confiança e dependência, não apenas assentimento intelectual. “Confiem nele” é natural e semanticamente preciso.
- source_word: וְהוּא לֹא יָלִין
  choice: e ele não demorará a lhes dar
  rationale: O hebraico diz de modo idiomático que ele não fará a recompensa “passar a noite”, isto é, não a reterá nem demorará a entregá-la. A formulação conserva “ele” como sujeito e comunica o sentido provável sem reproduzir literalmente uma expressão obscura em português.
- source_word: שְׂכַרְכֶם
  choice: a recompensa
  rationale: שׂכר pode designar salário, pagamento ou recompensa. Neste contexto de exortação sapiencial e retribuição divina, “recompensa” é a opção mais clara; o sufixo de segunda pessoa plural é expresso por “lhes”.
theological_decisions:
- issue: Tradução do nome divino יְהֹוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido da oração final diante da diferença entre o hebraico e o paralelo grego
  choice: ele não demorará a lhes dar a recompensa
  alternative: ele não deixará a recompensa de vocês passar a noite; vocês certamente não perderão a sua recompensa
  rationale: O hebraico apresenta a imagem de não fazer a recompensa passar a noite, que sugere não reter ou não atrasar o pagamento; o grego interpreta a promessa como não perder a recompensa. O texto principal segue mais de perto a imagem e o sujeito explícito do hebraico, enquanto a nota registra tanto a forma literal quanto a leitura grega.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” explicita o vocativo hebraico e permite uma exortação natural; “lhes” evita repetir o pronome possessivo. A formulação principal prioriza o hebraico, e a nota mantém transparente a tensão textual com o grego.
