  text: By them the physician eases pain, and so the perfumer prepares a mixture.
translation:
  language: pt
  text: Com eles, o médico alivia a dor, e igualmente o perfumista prepara uma mistura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בהם
  choice: Com eles
  rationale: Retoma os elementos medicinais mencionados no contexto e preserva o valor instrumental da preposição hebraica.
- source_word: רופא
  choice: o médico
  rationale: Equivalente direto e natural para o profissional que trata os enfermos.
- source_word: יניח מכאוב
  choice: alivia a dor
  rationale: O verbo pode expressar fazer cessar ou dar repouso; no contexto médico, “alivia” comunica naturalmente a redução da dor sem afirmar necessariamente sua eliminação completa.
- source_word: וכן
  choice: e assim
  rationale: Mantém a ligação entre a atuação do médico e a preparação feita pelo perfumista, sem tornar excessivamente rígida a relação lógica.
- source_word: רוקח
  choice: o perfumista
  rationale: Designa o artesão que compõe substâncias aromáticas ou medicinais; “perfumista” preserva o sentido histórico sem restringi-lo ao farmacêutico moderno.
- source_word: עושה מרקחת
  choice: prepara uma mistura
  rationale: Reproduz a ideia ampla de produzir um composto, evitando especificar uma forma farmacêutica não expressa no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. A tradução segue prioritariamente o hebraico; o paralelo grego confirma o sentido medicinal da primeira oração, embora não contenha a segunda.
