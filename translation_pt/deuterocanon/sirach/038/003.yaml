  text: A physician’s knowledge will raise his horn[a], and before nobles he will stand.
translation:
  language: pt
  text: O conhecimento do médico elevará sua honra[a], e ele se apresentará diante dos nobres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “erguerá seu chifre”, imagem de exaltação, força e honra.'
    reason: expressão idiomática
  - marker: b
    text: 'Grego: “e diante dos poderosos será admirado”.'
    reason: leitura alternativa
lexical_decisions:
- source_word: דעת
  choice: conhecimento
  rationale: O substantivo hebraico indica conhecimento ou entendimento; ligado ao médico, refere-se à sua competência adquirida. “Conhecimento” preserva o sentido direto e corresponde também ao grego ἐπιστήμη.
- source_word: רופא
  choice: médico
  rationale: O termo hebraico designa quem cura ou exerce a medicina. “Médico” é natural, preciso e amplamente compreensível em português.
- source_word: תרים קרנו
  choice: elevará sua honra
  rationale: A expressão diz literalmente “erguerá seu chifre”, imagem hebraica de exaltação, força e dignidade. “Elevará sua honra” comunica o valor idiomático em português atual sem sugerir uma ação física estranha.
- source_word: נדיבים
  choice: nobres
  rationale: O termo indica pessoas de posição elevada ou proeminente. “Nobres” conserva o contexto social e concorda com o paralelo grego μεγιστάνων.
- source_word: יתיצב
  choice: ele se apresentará
  rationale: O verbo significa pôr-se ou manter-se de pé. Neste contexto, “se apresentará diante” expressa naturalmente o acesso à presença de pessoas importantes, sem acrescentar a admiração afirmada apenas no grego.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro do versículo
  choice: 'Seguir no texto principal o hebraico: “ele se apresentará diante dos nobres”'
  alternative: 'Grego: “será admirado diante dos poderosos”'
  rationale: O testemunho hebraico é preservado com alta confiança e tem prioridade aqui. A leitura grega muda a ênfase, da presença do médico entre os nobres para a admiração que recebe, e por isso é registrada em nota.
- issue: Tratamento da imagem hebraica do chifre erguido
  choice: Traduzir idiomaticamente por “elevará sua honra” e preservar a forma literal em nota
  alternative: “erguerá seu chifre”
  rationale: Em hebraico, o chifre erguido representa exaltação, força e dignidade. A tradução literal seria pouco transparente em português; a nota conserva a imagem original sem obscurecer o sentido do texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura paralela próxima do hebraico. “Médico” e “conhecimento” mantêm clareza ampla; “elevará sua honra” traduz a força do idioma hebraico, cuja imagem literal fica preservada em nota.
