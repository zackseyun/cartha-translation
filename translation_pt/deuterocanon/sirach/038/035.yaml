  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
translation:
  language: pt
  text: Mas eles sustentarão a ordem do mundo[a], e a oração deles está no trabalho do seu ofício[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “firmarão a criação — ou a estrutura — da era”. A expressão grega é concisa e pode indicar tanto a ordem duradoura da sociedade como, em sentido mais amplo, a ordem estabelecida do mundo.
    reason: lexical_alternative
  - marker: b
    text: Ou “a súplica deles está no labor do seu ofício”. A frase também pode indicar que sua oração está ligada ao exercício do trabalho especializado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a descrição anterior dos artesãos, sem acrescentar uma oposição mais forte que a do grego.
- source_word: κτίσμα αἰῶνος
  choice: a ordem do mundo
  rationale: 'A expressão grega é compacta: κτίσμα é aquilo que foi feito ou estabelecido, e αἰών pode indicar era, mundo ou ordem duradoura. A formulação portuguesa é natural no contexto social, enquanto a nota preserva as alternativas.'
- source_word: στηρίσουσιν
  choice: sustentarão
  rationale: O futuro de στηρίζω pode significar firmar, estabelecer ou sustentar. No contexto, destaca como o trabalho dos artesãos mantém de pé a ordem comum.
- source_word: ἡ δέησις αὐτῶν
  choice: a oração deles
  rationale: δέησις designa pedido, súplica ou oração. “Oração” é claro e mantém o possível sentido devocional sem excluir a ideia de petição.
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: está no trabalho do seu ofício
  rationale: Preserva a relação locativa expressa por ἐν e traduz τέχνη como ofício ou atividade especializada, adequada ao contexto dos artesãos.
theological_decisions:
- issue: Sentido de “a oração deles está no trabalho do seu ofício”
  choice: Manter a oração ligada ao âmbito ou exercício do trabalho especializado.
  alternative: Entender que sua súplica pede êxito no trabalho, ou que sua oração acompanha o trabalho.
  rationale: O grego não define precisamente de que modo a oração se relaciona com o trabalho. A tradução conserva essa tensão e não afirma que o trabalho substitua a oração verbal.
- issue: Alcance de κτίσμα αἰῶνος
  choice: “a ordem do mundo”, com nota sobre a amplitude da expressão.
  alternative: “a criação da era”, “a estrutura duradoura da sociedade” ou “aquilo que foi estabelecido para sempre”.
  rationale: O contexto favorece a contribuição dos trabalhadores para a vida comum, mas a expressão pode ter alcance mais amplo. A nota evita restringi-la silenciosamente a uma leitura apenas social ou cosmológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ofício” conserva o contexto artesanal sem soar excessivamente técnico. A construção incomum da segunda oração foi mantida de propósito para preservar a ambiguidade do grego.
