  yaml_path: translation/deuterocanon/sirach/038/030.yaml
  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
translation:
  language: pt
  text: Ele dedicará o coração à conclusão de suas obras,[a] e passará noites em claro para lhes dar acabamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, em grego: “dará o seu coração à conclusão de obras, e [dará] sua vigília para ordenar até a conclusão”. A formulação é condensada; «ordenar» também pode sugerir adornar ou dar acabamento ao trabalho ao terminá-lo.'
    reason: Preserva o plural de ἔργων, explicita a elipse do segundo membro e registra a amplitude de κοσμῆσαι.
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: dedicará o coração à
  rationale: Conserva a imagem antropológica concreta de καρδία e expressa em português natural a construção idiomática δώσει εἰς, que indica direcionar interiormente a atenção e o empenho a um objetivo.
- source_word: συντέλειαν ἔργων
  choice: conclusão de suas obras
  rationale: Mantém o plural ἔργων e traduz συντέλεια pelo sentido prático de conclusão ou término dos trabalhos artesanais.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: passará noites em claro
  rationale: Torna natural a imagem de ἀγρυπνία como vigília ou privação de sono causada pela dedicação ao ofício, sem reduzi-la à mera atenção abstrata.
- source_word: κοσμῆσαι
  choice: dar o acabamento
  rationale: No contexto artesanal, κοσμέω pode significar ordenar, ornamentar ou conferir a forma apropriada; 'dar o acabamento' preserva essa amplitude melhor que uma referência exclusiva à decoração.
- source_word: ἐπὶ συντελείας
  choice: final
  rationale: Associado a 'acabamento', comunica a orientação para a plena conclusão. Evita introduzir 'perfeição' como ideia mais forte que o provável sentido contextual de acabamento completo.
