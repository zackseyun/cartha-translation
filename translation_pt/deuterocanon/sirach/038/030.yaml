translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. 'Obras' mantém o plural grego; 'passará noites em claro' explicita de modo idiomático a vigília dedicada ao trabalho. O marcador [a] aparece no texto principal.
