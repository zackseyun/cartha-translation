  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: pt
  text: Assim também todo artesão e projetista[a], que labuta de noite como de dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso: “todo artesão e projetista”, ou “aquele que planeja”. O paralelo grego amplia a descrição, mencionando o construtor, o mestre de obras, os gravadores e seu esforço vigilante para concluir o trabalho. O texto principal segue o hebraico, com o grego ajudando a esclarecer a ideia de concepção técnica e artística.'
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: Assim também
  rationale: Introduz uma comparação com os trabalhadores descritos no contexto e reproduz naturalmente a força aditiva e comparativa.
- source_word: עשה חרש
  choice: artesão
  rationale: A expressão hebraica é compacta e designa quem exerce um ofício manual especializado; o grego τέκτων confirma o sentido amplo, sem exigir uma profissão específica.
- source_word: וחשב
  choice: e projetista
  rationale: חשב pode indicar aquele que concebe, planeja ou executa trabalho artístico especializado. “Projetista” conserva a dimensão técnica e criativa sem restringir o termo a um ofício antigo específico.
- source_word: אשר
  choice: que
  rationale: Introduz a oração relativa que descreve o trabalhador.
- source_word: לילה כיום
  choice: de noite como de dia
  rationale: Preserva diretamente a comparação hebraica e comunica que o trabalho árduo se estende pela noite.
- source_word: יגיע
  choice: labuta
  rationale: Expressa trabalho intenso e fatigante, com mais força que o simples “trabalha” e em linguagem corrente.
