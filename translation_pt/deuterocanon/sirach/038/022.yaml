  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
translation:
  language: pt
  text: O lugar de repouso do morto é a sua morada[a]; console-se quando a vida dele partir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta oração é compacto e de interpretação incerta. O paralelo grego apresenta uma forma textual substancialmente diferente: “Lembre-se de que o julgamento dele é como o seu: para mim, ontem; para você, hoje.”'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “quando a alma dele partir”. O hebraico נפש pode significar vida, alma, pessoa ou alento vital.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מושבת מתו
  choice: Quando o morto repousar
  rationale: A sequência hebraica é compacta e textualmente difícil. מושבת deriva de ישב, ligado a sentar-se, habitar ou repousar, e מתו designa literalmente “seu morto”. Em contexto funerário, a formulação temporal “quando o morto repousar” comunica de modo natural o repouso final sem especificar indevidamente “sepultura”.
- source_word: שבת זכרו
  choice: deixe também repousar a lembrança dele
  rationale: שבת pode expressar cessar ou repousar, enquanto זכרו significa “sua lembrança/memória”. A tradução conserva a repetição conceitual de repouso e entende a frase como exortação a permitir que a memória do falecido repouse, sem apagar a dificuldade do hebraico.
- source_word: והנחם
  choice: console-se
  rationale: A forma verbal expressa receber ou encontrar consolo, com matiz reflexivo. “Console-se” é corrente, conciso e adequado ao tom exortativo.
- source_word: עם צאת
  choice: quando ... se for
  rationale: עם tem força temporal neste contexto, e צאת, literalmente “sair”, descreve a partida associada à morte. “Quando ... se for” reproduz o sentido de modo natural em português.
- source_word: נפשו
  choice: a vida dele
  rationale: נפש pode significar vida, alma, pessoa ou alento vital. “A vida dele” evita impor uma antropologia técnica e mantém a alternativa “alma” em nota.
theological_decisions:
- issue: Sentido de נפש no contexto da morte
  choice: quando a vida dele se for
  alternative: quando a alma dele partir
  rationale: O campo semântico de נפש é amplo. A leitura principal preserva o idioma de morte sem definir a relação entre corpo e alma; a alternativa tradicional e lexicalmente possível aparece em nota.
- issue: Forma textual hebraica diante do paralelo grego divergente
  choice: Traduzir prioritariamente o hebraico sobrevivente, reconhecendo a dificuldade da primeira oração
  alternative: '“Lembre-se de que o destino dele é como o seu: ontem foi a minha vez, hoje é a sua.”'
  rationale: O testemunho hebraico fornecido tem prioridade, embora sua formulação seja compacta e marcada por pequena divergência textual. O grego representa uma forma substancialmente diferente e, por isso, é preservado em nota em vez de substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “repousar” foi mantida para refletir o jogo verbal provável do hebraico; “se for” suaviza de modo idiomático a imagem literal de a vida sair.
