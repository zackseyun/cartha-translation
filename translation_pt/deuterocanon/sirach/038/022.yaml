review_pass:
  verdict: revise
  source_fidelity: A primeira oração do rascunho introduz uma construção temporal e dois imperativos (“Quando o morto repousar, deixe ... repousar”) que não correspondem com segurança à construção nominal preservada no hebraico. A tradução deve conservar a referência ao lugar de repouso/morada do morto, sem transformar a cláusula em instrução para esquecer ou suspender sua lembrança. A segunda oração é adequadamente representada como exortação a receber consolo no momento da partida da vida.
  naturalness: A revisão proposta é clara, digna e idiomática em português moderno. “Lugar de repouso” e “morada” preservam o caráter funerário sem especificar indevidamente “sepultura”; “console-se” é natural no registro sapiencial.
  terminology: “Vida” para נפשו preserva a amplitude semântica hebraica e evita impor uma leitura antropológica técnica; “alma” permanece como alternativa em nota. A nota grega deve dizer “julgamento”, correspondente a κρίμα, em vez de “destino”.
  issues:
  - severity: high
    issue: A primeira oração foi convertida em uma cláusula temporal imperativa.
    rationale: “Quando o morto repousar, deixe também repousar a lembrança dele” acrescenta um cenário e uma exortação que não são sustentados de modo seguro pela formulação nominal hebraica nem pelo registro auditado em inglês.
  - severity: medium
    issue: A tradução principal instrui a deixar a memória do falecido repousar.
    rationale: Essa interpretação de שבת זכרו é excessivamente específica e pode sugerir cessar a lembrança; dada a dificuldade textual, não deve ser apresentada sem ressalva como o sentido principal.
  - severity: medium
    issue: A nota do paralelo grego verte κρίμα como “destino”.
    rationale: O grego diz “julgamento”; “destino” reduz e altera o sentido lexical.
  revised_text: O lugar de repouso do morto é a sua morada[a]; console-se quando a vida dele partir[b].
  revised_footnotes:
  - marker: a
    text: 'O hebraico desta oração é compacto e de interpretação incerta. O paralelo grego apresenta uma forma textual substancialmente diferente: “Lembre-se de que o julgamento dele é como o seu: para mim, ontem; para você, hoje.”'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “quando a alma dele partir”. O hebraico נפש pode significar vida, alma, pessoa ou alento vital.'
    reason: lexical_alternative
  revision_rationale: A revisão remove a paráfrase imperativa não assegurada da primeira oração e traduz a construção funerária hebraica de modo mais direto, conservando a incerteza textual na nota do paralelo grego. Mantém-se a exortação a receber consolo e a alternativa lexical para נפש.
