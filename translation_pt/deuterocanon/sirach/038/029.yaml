lexical_decisions:
- source_word: φωνὴ σφύρης
  choice: o som do martelo
  rationale: No contexto da oficina, φωνή indica o som produzido pelo martelo, e não uma voz; σφύρης identifica sua origem.
- source_word: καινεῖ
  choice: golpeia
  rationale: O verbo é difícil neste contexto. Com o ouvido como objeto e o ruído do martelo como sujeito, “golpeia” comunica de modo natural o impacto sonoro, sem recorrer ao sentido usual, mas aqui obscuro, de “renovar”.
- source_word: τὸ οὖς αὐτοῦ
  choice: seu ouvido
  rationale: Mantém o singular concreto do grego e exprime a exposição auditiva do artesão.
- source_word: κατέναντι
  choice: estão voltados para
  rationale: Expressa a orientação dos olhos diante do objeto sem intensificar a frase com a ideia não explícita de estarem “fixos”.
- source_word: ὁμοιώματος
  choice: forma
  rationale: “Forma” preserva o sentido visual de semelhança ou configuração sem especificar indevidamente um molde ou padrão.
- source_word: σκεύους
  choice: objeto
  rationale: σκεῦος pode designar vaso, utensílio ou artefato. “Objeto” mantém essa amplitude, especialmente porque o contexto imediato fornecido não exige que seja um recipiente.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: seus olhos
  rationale: Preserva a imagem corporal concreta e o paralelismo com “seu ouvido”.
