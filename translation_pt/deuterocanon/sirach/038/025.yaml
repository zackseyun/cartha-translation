base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: pt
  text: Como poderá tornar-se sábio aquele que maneja o arado,[a] que guia o boi e cujas preocupações se voltam para o gado?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da primeira oração é um tanto difícil. O paralelo grego diz mais explicitamente: “Como se tornará sábio aquele que segura o arado... e conduz bois...?” A tradução acompanha o hebraico, recorrendo ao grego para esclarecer o contexto agrícola.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “cuja conversa é sobre o gado”. O hebraico pode indicar tanto suas preocupações em geral quanto, mais especificamente, aquilo de que ele fala; o paralelo grego favorece “conversa” ou “relato”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף
  choice: aquele que conduz
  rationale: O termo é difícil neste contexto. À luz do paralelo grego e da atividade agrícola descrita, foi entendido funcionalmente como referência ao trabalhador que dirige o trabalho de lavrar, sem transformá-lo em um título como “chefe” ou “mestre”.
- source_word: ינהג
  choice: conduz
  rationale: O verbo pode indicar conduzir ou guiar. “Conduz” é natural no contexto do manejo do arado e dos animais de tração.
- source_word: ישובב
  choice: guia
  rationale: A forma hebraica é incerta e pode sugerir fazer voltar ou movimentar de um lado para outro. No contexto do trabalho no campo, “guia” comunica de modo claro o manejo ativo do boi sem especificar em excesso o movimento.
- source_word: לשדד
  choice: o arado
  rationale: A raiz se relaciona a revolver ou romper o solo. O grego menciona explicitamente o arado; por equivalência ótima, a tradução expressa o instrumento e a atividade agrícola implicados no hebraico.
- source_word: בשור
  choice: o boi
  rationale: A construção pode ser entendida como “com um boi”. A formulação “guia o boi” transmite naturalmente em português o trabalho com o animal de tração.
- source_word: שעיותיו
  choice: cujas preocupações estão voltadas para
  rationale: O substantivo pode indicar pensamentos, interesses, ocupações ou conversa. A tradução mantém o sentido amplo de atenção habitual, enquanto uma nota registra a alternativa mais específica referente à fala.
- source_word: בני בקר
  choice: o gado
  rationale: Literalmente, “filhos do gado”, expressão coletiva referente aos bovinos. “O gado” é idiomático e adequado ao foco ocupacional geral do verso.
