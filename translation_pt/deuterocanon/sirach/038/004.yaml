  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: pt
  text: Deus faz surgir da terra os remédios[a], e o homem sensato não os despreza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma hebraica traduzida «faz surgir» é difícil na tradição manuscrita e parece indicar que Deus produz ou faz sair os remédios da terra. O grego paralelo diz: «O Senhor criou remédios da terra».'
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: Deus
  rationale: O hebraico traz diretamente o título divino אל, «Deus». O grego paralelo tem Κύριος, «Senhor», registrado em nota como leitura alternativa.
- source_word: מארץ
  choice: da terra
  rationale: Expressa a origem terrena dos remédios e corresponde naturalmente tanto ao hebraico quanto ao grego ἐκ γῆς.
- source_word: מצוציא
  choice: faz brotar
  rationale: A forma hebraica é textualmente difícil, mas parece ligada à ideia de fazer sair ou produzir. «Faz brotar» preserva essa imagem hebraica, enquanto o grego apresenta «criou».
- source_word: תרופות
  choice: os remédios
  rationale: Designa substâncias ou recursos medicinais. «Remédios» é corrente, concreto e amplamente compreensível em português.
- source_word: גבר מבין
  choice: o homem sensato
  rationale: Preserva o substantivo masculino גבר e traduz מבין como alguém dotado de entendimento prático; «sensato» soa natural no contexto.
- source_word: אל ימאס בם
  choice: não os despreza
  rationale: מאס denota rejeitar ou desprezar. O presente formula de modo natural uma verdade geral, sem perder a força avaliativa do hebraico.
theological_decisions:
- issue: Título divino no hebraico em contraste com o grego paralelo
  choice: Deus
  alternative: O Senhor
  rationale: Como o texto hebraico de alta confiança traz אל, a tradução principal segue «Deus». A leitura grega Κύριος, «Senhor», é genuína e fica documentada em nota.
- issue: Ação divina expressa pela forma hebraica difícil מצוציא
  choice: faz brotar
  alternative: criou
  rationale: A tradução principal conserva a provável imagem hebraica de produzir ou fazer sair da terra. O grego ἔκτισεν apoia a ideia mais geral de criação divina, indicada na nota sem apagar a dificuldade textual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação segue prioritariamente o hebraico e registra em nota as diferenças relevantes do grego.
