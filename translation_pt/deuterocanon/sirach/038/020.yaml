  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: pt
  text: 'Lembre-se do destino que lhe coube[a], pois é também o seu destino: para ele, ontem; para você, hoje.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «decreto dele» ou «porção que lhe foi determinada». O hebraico חק costuma significar «estatuto» ou «decreto», mas aqui provavelmente indica o destino que cabe a todo ser humano na morte.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego apresenta uma redação diferente: «Não entregue o seu coração à tristeza; afaste-a, lembrando-se das coisas finais». Essa leitura também aponta para a mortalidade, embora seja distinta da redação hebraica traduzida aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: Lembre-se
  rationale: Traduz diretamente o imperativo de זכר e expressa uma recordação ativa em português natural.
- source_word: חקו
  choice: do destino que lhe coube
  rationale: חק pode significar estatuto, decreto ou porção determinada. No contexto de luto e morte, a expressão comunica o destino atribuído ao falecido sem sugerir mero acaso.
- source_word: כי הוא חקך
  choice: pois é também o seu destino
  rationale: A frase aplica ao leitor a mesma condição mortal do falecido. «Também» torna explícita a relação compartilhada já implícita no hebraico, sem definir quando ela se cumprirá.
- source_word: לו אתמול ולך היום
  choice: para ele, ontem; para você, hoje
  rationale: Preserva a concisão, o paralelismo e a elipse poética do hebraico, com pontuação clara em português.
theological_decisions:
- issue: Sentido de חק no contexto de morte e luto
  choice: destino que coube a cada pessoa, isto é, a condição mortal compartilhada
  alternative: decreto; estatuto; porção determinada
  rationale: O contexto não trata de legislação, e a linha seguinte associa o que coube ao morto ao que cabe ao leitor. «Destino» expressa essa realidade determinada, enquanto a nota conserva a amplitude lexical do hebraico.
- issue: Grau de explicitação da frase final elíptica
  choice: manter «para ele, ontem; para você, hoje» sem acrescentar o verbo «morrer»
  alternative: ele morreu ontem, e você morrerá hoje
  rationale: O hebraico é deliberadamente conciso e não declara de forma explícita o verbo nem exige que «hoje» seja entendido como uma previsão literal da morte imediata do leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo lapidar do hebraico e evita tanto o arcaísmo «quinhão» quanto a possível conotação de acaso em «sorte».
