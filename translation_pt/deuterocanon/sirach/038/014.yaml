translation:
  language: pt
  text: pois sua súplica poderá ter êxito[a], e sua cura servirá para preservar a vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O sentido do hebraico פשרה é incerto aqui. O paralelo grego diz mais explicitamente: “pois eles também suplicarão ao Senhor, para que lhes conceda alívio e cura, em favor da continuidade da vida”.'
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  choice: sua súplica
  rationale: O termo hebraico é difícil neste contexto. O paralelo grego usa linguagem explícita de oração e súplica, apoiando este sentido sem especificar uma forma litúrgica.
- source_word: יצלח
  choice: poderá ter êxito
  rationale: O verbo expressa prosperar ou alcançar bom resultado. A formulação modal preserva a contingência presente no contexto de súplica e corresponde ao valor do grego εὐοδώσῃ.
- source_word: ורפאות
  choice: e sua cura
  rationale: O plural hebraico pode indicar atos ou meios de cura; o singular coletivo em português é natural e concorda com o grego ἴασιν.
- source_word: למען מחיה
  choice: servirá para preservar a vida
  rationale: 'A expressão indica finalidade: a cura visa manter a pessoa viva. A redação comunica esse propósito em português atual e digno.'
theological_decisions:
- issue: Relação entre o hebraico difícil e o paralelo grego mais explícito
  choice: Traduzir a estrutura do hebraico, usando o grego para esclarecer que פשרה se refere a uma súplica e que a cura tem por finalidade preservar a vida.
  alternative: pois sua oração prosperará, e os remédios são para a vida
  rationale: O hebraico sobrevivente é conciso e incerto, sobretudo em פשרה. O grego oferece apoio antigo para o sentido de súplica, mas a nota conserva a incerteza textual e evita transformar a leitura esclarecida em certeza absoluta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Súplica” mantém tom digno e acessível; “poderá ter êxito” preserva a cautela exigida pela incerteza do hebraico.
