  text: so that his work may not cease[b][a], and success may come through men.
translation:
  language: pt
  text: para que a sua obra não cesse e o êxito venha por meio dos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo hebraico traduzido como “êxito” é difícil neste contexto e também pode sugerir eficácia, solidez ou auxílio efetivo. O paralelo grego diz: “e a paz que vem dele está sobre a face da terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: למען
  choice: para que
  rationale: Introduz finalidade ou resultado e preserva naturalmente essa força em português.
- source_word: לא ישבות
  choice: não cesse
  rationale: O verbo שבת tem aqui o sentido de parar ou cessar; a formulação mantém a ideia de continuidade.
- source_word: מעשהו
  choice: a sua obra
  rationale: Traduz o substantivo singular com sufixo pronominal sem definir além do hebraico a identidade do referente de “sua”.
- source_word: ותושיה
  choice: e o êxito
  rationale: תושיה é semanticamente difícil neste contexto e pode indicar eficácia, bom resultado, solidez ou auxílio efetivo. “Êxito” expressa um resultado eficaz sem transformar o termo em sabedoria técnica.
- source_word: מבני אדם
  choice: por meio dos seres humanos
  rationale: A expressão hebraica é literalmente “dos filhos do ser humano”; no contexto, a preposição pode indicar origem ou mediação. A redação é inclusiva e conserva a referência genérica à humanidade.
theological_decisions:
- issue: Relação entre o difícil hebraico ותושיה מבני אדם e o paralelo grego sobre a paz na terra
  choice: Traduzir prioritariamente o hebraico como “o êxito venha por meio dos seres humanos”, registrando a leitura grega em nota.
  alternative: “e a paz que vem dele está sobre a face da terra”
  rationale: O texto hebraico preservado deve orientar o corpo do versículo. Como תושיה e a relação expressa por מן são ambíguos, a tradução evita identificar o resultado especificamente com “paz”, mas mantém visível em nota o testemunho grego substancialmente diferente.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Seres humanos” deixa claro que a expressão hebraica é genérica, não restrita aos homens do sexo masculino. A ausência de vírgula antes de “e” mantém a fluidez das duas orações coordenadas.
