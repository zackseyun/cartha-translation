  text: And he gave man understanding[c][b][a], to glory in his might.
translation:
  language: pt
  text: E deu ao ser humano[a] entendimento, para que se gloriasse[b] em seu poder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à humanidade” ou “aos mortais”. No hebraico, “ser humano” está no singular, mas tem sentido coletivo e representativo.
    reason: lexical_alternative
  - marker: b
    text: Ou “se orgulhasse” ou “exultasse”. O verbo hebraico pode indicar gloriar-se, vangloriar-se ou exultar; o paralelo grego favorece aqui um sentido elevado.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente “em seu poder” e pode também sugerir “em seus feitos poderosos”. O paralelo grego traz “em suas maravilhas”, favorecendo a referência às obras manifestas de Deus. Gramaticalmente, porém, “seu” também pode ser relacionado ao ser humano.
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  choice: E deu
  rationale: O waw seguido da forma verbal de נתן exprime aqui uma ação passada na sequência do discurso; o grego ἔδωκεν também confirma o passado.
- source_word: לאנוש
  choice: ao ser humano
  rationale: אֱנוֹשׁ designa o ser humano mortal e tem aqui sentido coletivo e representativo. A formulação é natural em português e abrange a humanidade sem transformar desnecessariamente o singular hebraico em plural.
- source_word: בינה
  choice: entendimento
  rationale: בִּינָה significa principalmente entendimento ou discernimento. “Entendimento” permanece próximo do hebraico e se ajusta ao contexto de conhecimento médico.
- source_word: להתפאר
  choice: para que se gloriasse
  rationale: O hitpael de פאר pode expressar gloriar-se, exultar ou vangloriar-se. “Gloriar-se” conserva o tom elevado e a amplitude semântica, sem reduzir a expressão à vaidade humana.
- source_word: בגבורתו
  choice: em seu poder
  rationale: גְּבוּרָה pode indicar força, poder ou feitos poderosos. “Poder” traduz diretamente o substantivo abstrato do hebraico, enquanto a nota registra a leitura contextual de manifestações poderosas apoiada pelo paralelo grego.
theological_decisions:
- issue: Referente do sufixo em בגבורתו (“seu poder”)
  choice: Manter no texto a ambiguidade gramatical de “seu”, entendendo contextualmente que o referente mais provável é Deus.
  alternative: O sufixo pode ser relacionado ao ser humano, de modo que ele se glorie em sua própria capacidade ou realização.
  rationale: O contexto apresenta Deus como aquele que concede entendimento, e o grego “em suas maravilhas” favorece a referência às obras de Deus. Contudo, o hebraico isoladamente permite alguma ambiguidade; por isso, o texto português não a elimina, e a nota explica as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com construção de boa legibilidade no Brasil e compreensão internacional. O singular coletivo “ser humano” preserva a forma hebraica; “seu poder” mantém a concisão e a ambiguidade genuína do original.
