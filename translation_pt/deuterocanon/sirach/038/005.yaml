base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: pt
  text: Não foi a água adoçada por meio da madeira[b], para dar a conhecer a todos os seres humanos[c] o seu poder[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poder dela”, se o pronome se referir à madeira. O hebraico e o grego permitem essa leitura, embora o contexto favoreça o poder de Deus manifestado por meio do recurso empregado.
    reason: alternative_reading
  - marker: b
    text: Provável alusão ao episódio em que a água amarga foi adoçada por meio de madeira (Êxodo 15:25).
    reason: cross_reference
  - marker: c
    text: 'Hebraico: “todo ser humano”, com um substantivo masculino singular empregado em sentido genérico.'
    reason: cultural_note
lexical_decisions:
- source_word: הלא
  choice: Não foi... ?
  rationale: Introduz uma pergunta retórica que espera concordância, em consonância com o grego οὐκ.
- source_word: בעץ
  choice: por meio da madeira
  rationale: A preposição ב indica instrumento ou meio. “Madeira” preserva a amplitude de עץ e ξύλον sem especificar indevidamente “árvore” ou “pedaço de madeira”.
- source_word: המתיקו מים
  choice: a água adoçada
  rationale: מתיק significa tornar doce; a voz passiva portuguesa acompanha naturalmente a forma verbal hebraica, e “água” funciona como nome massivo apesar da forma plural מים.
- source_word: בעבור להודיע
  choice: para dar a conhecer
  rationale: Expressa finalidade e mantém o valor causativo de להודיע de maneira clara e idiomática.
- source_word: כל אנוש
  choice: a todos os seres humanos
  rationale: אנוש designa aqui a humanidade em sentido genérico. A formulação inclusiva é natural no português atual e preserva o alcance universal de כל.
- source_word: כחו
  choice: o seu poder
  rationale: O sufixo masculino singular permite mais de um referente. No contexto, “seu” pode apontar para Deus, mas conserva em português parte da ambiguidade do original.
theological_decisions:
- issue: Referente do pronome em כחו / αὐτοῦ
  choice: “seu” no texto principal, entendido contextualmente como referência provável a Deus
  alternative: O poder da própria madeira; menos provavelmente, o poder de Moisés
  rationale: O contexto favorece o poder de Deus revelado por meio de um instrumento criado, mas a sintaxe hebraica e grega não elimina a possibilidade de o pronome retomar a madeira. A nota preserva essa tensão.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua primeira relevância no texto: meio instrumental e alusão, alcance humano e ambiguidade pronominal.'
