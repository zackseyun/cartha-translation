  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: pt
  text: A sabedoria do escriba multiplica a sabedoria, e quem está livre de ocupações[a] se tornará sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “carece de ocupação/afazeres”. O paralelo grego preservado para esta referência apresenta conteúdo diferente, provavelmente por divergência textual ou de numeração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חכמת
  choice: sabedoria
  rationale: O substantivo denota sabedoria, não apenas habilidade técnica ou erudição.
- source_word: סופר
  choice: escriba
  rationale: Preserva a função social do profissional letrado e a ligação com o contexto sobre ofícios e dedicação ao estudo.
- source_word: תרבה
  choice: multiplica
  rationale: Expressa de modo natural o valor causativo e incremental da forma hebraica, mantendo a repetição intencional de 'sabedoria'.
- source_word: וחסר עסק
  choice: e quem está livre de ocupações
  rationale: O hebraico diz literalmente 'e o que carece de ocupação/afazeres'. A formulação comunica disponibilidade para o estudo sem sugerir necessariamente desemprego.
- source_word: יתחכם
  choice: se tornará sábio
  rationale: Representa o sentido de adquirir ou alcançar sabedoria, em vez de apenas parecer sábio.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com 'escriba' para preservar o contexto histórico. 'Livre de ocupações' é mais claro e formal do que 'livre da agitação', sem transformar o ócio em requisito absoluto. O paralelo grego fornecido não sustenta lexicalmente esta frase hebraica, pois trata do repouso de uma pessoa falecida; por isso, a tradução segue prioritariamente o texto hebraico de alta confiança e registra a divergência em nota.
