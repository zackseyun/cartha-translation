translation:
  language: pt
  text: Apresente uma oferta memorial de aroma agradável[a][b] e enriqueça a oferta preparada com o melhor dos seus bens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “Apresente um memorial de aroma agradável e torne abundante a porção preparada com as extremidades dos seus bens.” A expressão “com as extremidades dos seus bens” traduz literalmente “com as asas dos seus bens” e provavelmente indica o melhor ou a plena medida dos recursos da pessoa.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “Ofereça fragrância e um memorial de flor de farinha, e torne rica a oferta, como alguém que nada possui.” A frase final difere substancialmente e é elíptica. Aqui se segue o testemunho hebraico, usando o grego como confirmação do contexto sacrificial.'
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: Apresente
  rationale: O imperativo de נגש, em contexto sacrificial, significa trazer ou apresentar uma oferta; “apresente” conserva o sentido cultual em português natural.
- source_word: ניחוח
  choice: de aroma agradável
  rationale: Na linguagem sacrificial, ניחוח evoca o aroma aceitável e agradável da oferta. A explicitação de “aroma” é natural em português e encontra apoio no paralelo grego εὐωδία.
- source_word: אזכרה
  choice: oferta memorial
  rationale: Termo cultual referente à porção memorial de uma oferta; “oferta memorial” mantém tanto a especificidade sacrificial quanto a ideia de memória.
- source_word: ודשן
  choice: enriqueça
  rationale: O verbo דשן pode significar tornar gordo, abundante ou rico. “Enriqueça” comunica aqui a provisão generosa sem a estranheza de uma tradução mecanicamente literal.
- source_word: ערוך
  choice: a oferta preparada
  rationale: ערוך indica algo disposto ou preparado, provavelmente as porções sacrificiais arrumadas para o altar. “Oferta preparada” preserva o sentido cultual com clareza.
- source_word: בכנפי
  choice: com o melhor de
  rationale: Literalmente “com as asas de”, expressão opaca em português. כנף pode indicar borda ou extremidade e, neste contexto, provavelmente aponta para a parte mais escolhida ou a plena medida dos recursos.
- source_word: הוניך
  choice: seus bens
  rationale: הון designa riqueza, recursos ou posses. “Seus bens” é claro, atual e adequado à exortação para contribuir generosamente.
theological_decisions:
- issue: Imagens cultuais em contexto sapiencial
  choice: Manter linguagem explicitamente sacrificial, incluindo “oferta memorial”.
  alternative: Generalizar como “memorial”, “tributo” ou ato de piedade.
  rationale: Tanto o hebraico quanto o grego empregam terminologia de oferta. A tradução não deve espiritualizar nem apagar essa textura cultual.
- issue: Referente de דשן ערוך
  choice: Traduzir de forma compreensível como “enriqueça a oferta preparada”.
  alternative: Reproduzir mais concretamente “engorde a gordura disposta”.
  rationale: A formulação hebraica é compacta e difícil; o contexto e o grego προσφορά sustentam o referente sacrificial mais amplo. A nota registra a forma literal para preservar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o paralelismo dos dois imperativos e mantém a terminologia cultual sem literalismos opacos.
