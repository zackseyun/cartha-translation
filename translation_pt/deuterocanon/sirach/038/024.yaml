  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: pt
  text: A sabedoria do escriba vem quando ele dispõe de tempo livre, e quem se ocupa menos com suas tarefas se tornará sábio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico preservado desta linha é difícil e não corresponde claramente ao grego. Aqui, a tradução segue o sentido mais claro do grego, especialmente em “escriba” e na ideia de que a sabedoria requer tempo livre.
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: sabedoria / se tornará sábio
  rationale: O hebraico preservado é difícil, mas o paralelo grego apresenta claramente o tema da sabedoria e de tornar-se sábio. A formulação conserva o caráter sapiencial sem tentar corrigir de modo especulativo o hebraico.
- source_word: תומך מלמד || γραμματέως
  choice: escriba
  rationale: A expressão hebraica é textualmente instável e não oferece aqui um sentido literal seguro; o grego traz γραμματεύς, “escriba”, leitura coerente com o contexto de estudo e sabedoria.
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: quando ele dispõe de tempo livre
  rationale: A expressão indica a ocasião favorável proporcionada pelo lazer ou pela ausência de trabalho urgente. Esta formulação é natural em português e mantém o tempo livre como condição para o cultivo da sabedoria.
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: quem se ocupa menos com suas tarefas
  rationale: O grego descreve alguém cuja atividade prática é reduzida. “Tarefas” comunica de modo abrangente as ocupações que limitam o tempo de estudo.
theological_decisions:
- issue: Uso do hebraico ou do grego diante de um testemunho hebraico difícil e divergente
  choice: Seguir no texto principal o sentido coerente do paralelo grego, com nota explícita sobre a dificuldade textual
  alternative: Traduzir literalmente o hebraico preservado como referência ao arado e à aguilhada
  rationale: A decisão é textual, não doutrinária. O hebraico desta linha é incerto e não corresponde claramente ao grego, enquanto o grego preserva um provérbio coerente no contexto. A nota evita ocultar essa tensão entre os testemunhos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dispõe de tempo livre” evita tanto o tom excessivamente erudito de “ócio” quanto a informalidade de “tem uma folga”; “tarefas” mantém amplo o sentido da atividade prática.
