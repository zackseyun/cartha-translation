  text: Honor the physician according to your need of him[a], for God has also given him a portion.
translation:
  language: pt
  text: Honre o médico de acordo com a necessidade que você tem dele[a], pois ele também tem uma porção da parte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo o grego: “Honre o médico por seus serviços, pois o Senhor também o criou”. Mais literalmente, o hebraico diz: “pois também com ele há uma porção de Deus”.'
    reason: Leitura alternativa do paralelo grego e transparência quanto à formulação literal do hebraico.
lexical_decisions:
- source_word: רעי
  choice: Honre
  rationale: O imperativo hebraico provavelmente expressa consideração e honra. O paralelo grego Τίμα confirma esse sentido; “Honre” é claro, atual e adequado ao registro sapiencial.
- source_word: רופא
  choice: o médico
  rationale: רופא designa quem cura, isto é, o médico. A escolha é natural no português moderno e preserva a dignidade do contexto.
- source_word: לפני צרכו
  choice: conforme a necessidade que você tiver dele
  rationale: A expressão hebraica é compacta e relaciona o devido apreço ao médico com a necessidade de seus cuidados. Esta formulação mantém essa relação sem introduzir no texto principal a ideia grega mais explícita de serviços ou honorários.
- source_word: כי עם אותו חלק אל
  choice: pois Deus também lhe deu uma porção
  rationale: A construção hebraica é concisa e literalmente associa ao médico uma “porção” proveniente de Deus. A redação portuguesa explicita de modo natural a concessão divina, preservando o substantivo חלק, “porção”.
theological_decisions:
- issue: Fundamento teológico para honrar o médico
  choice: pois Deus também lhe deu uma porção
  alternative: pois o Senhor também o criou
  rationale: O texto principal segue o hebraico preservado, que fala de uma porção ligada a Deus. O grego apresenta a criação do médico pelo Senhor; essa leitura distinta é mantida na nota, sem harmonizar silenciosamente os testemunhos.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo na forma brasileira amplamente compreensível. A formulação principal prioriza o hebraico extante; a nota registra sem harmonização a leitura grega.
