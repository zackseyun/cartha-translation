  text: All these have trusted in their hands[a], and each becomes skillful in his own work.
translation:
  language: pt
  text: Todos estes confiam em suas próprias mãos[a], e cada um se torna hábil em seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação grega é um tanto difícil. A oração também pode ser entendida como «foram confiados às suas mãos» ou «depositam sua confiança nas próprias mãos». O texto principal conserva o sentido provável de que esses artesãos dependem de sua habilidade manual.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Todos estes
  rationale: Retoma de modo direto os artesãos mencionados anteriormente, sem acrescentar um substantivo que não aparece no grego.
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: confiam em suas próprias mãos
  rationale: Mantém o sentido provável de que os trabalhadores dependem da própria habilidade manual. «Próprias» explicita em português o valor reflexivo do possessivo contextual, enquanto a dificuldade da construção grega é preservada em nota.
- source_word: ἕκαστος
  choice: cada um
  rationale: Reproduz naturalmente o sentido distributivo do grego.
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: em seu trabalho
  rationale: Conserva tanto a esfera de atividade quanto o possessivo, em linguagem portuguesa corrente.
- source_word: σοφίζεται
  choice: se torna hábil
  rationale: No contexto dos ofícios manuais, o verbo indica aquisição ou demonstração de sabedoria prática, isto é, habilidade no próprio trabalho.
