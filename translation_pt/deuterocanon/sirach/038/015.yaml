  text: Whoever sins before his Maker will be defiant before a physician[a].
translation:
  language: pt
  text: Quem peca diante do seu Criador se mostrará arredio diante de um médico[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “cairá nas mãos de um médico”. O hebraico traz: “se mostrará arredio diante de um médico”.'
    reason: Leitura alternativa na tradição textual grega.
lexical_decisions:
- source_word: אשר
  choice: Quem
  rationale: Introduz uma declaração geral de caráter proverbial; “Quem” é natural e preserva a força universal.
- source_word: חואט
  choice: peca
  rationale: O verbo חטא tem aqui sentido moral e religioso; “peca” conserva essa força.
- source_word: לפני
  choice: diante de
  rationale: Representa o sentido básico de presença ou posição perante alguém, sem interpretar excessivamente como “contra”.
- source_word: עושהו
  choice: seu Criador
  rationale: Literalmente, “aquele que o fez” ou “seu Fazedor”. “Seu Criador” é claro, digno e idiomático em português, mantendo a referência a Deus.
- source_word: יתנכר
  choice: se mostrará hostil
  rationale: O hitpael de נכר pode expressar alheamento, comportamento de estranho ou hostilidade. “Se mostrará hostil” comunica a atitude resistente indicada pelo hebraico sem reduzi-la a simples estranheza.
- source_word: רופא
  choice: um médico
  rationale: Corresponde diretamente ao profissional de cura no contexto e mantém um registro atual e digno.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro do versículo
  choice: 'Seguir o hebraico preservado: “se mostrará hostil diante de um médico”'
  alternative: 'Seguir o grego: “cairá nas mãos de um médico”'
  rationale: Como o texto hebraico está preservado com alta confiança, ele recebe prioridade no texto principal. A leitura grega, substancialmente diferente, é registrada em nota para transparência e para preservar a tensão textual.
translation_notes:
  register: Português moderno, claro e proverbial, com leve dignidade sapiencial. “Criador” evita a forma pouco natural “Fazedor”, e “se mostrará hostil” comunica de modo inteligível a difícil forma hebraica sem ocultar a divergência grega.
