  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
translation:
  language: pt
  text: Afaste-se da injustiça e endireite as suas mãos[a]; purifique o seu coração de todas as transgressões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta cláusula é textualmente difícil no hebraico preservado. O paralelo grego diz “endireite as suas mãos”, provavelmente no sentido de corrigir as próprias ações.
    reason: textual_variant
  - marker: b
    text: Ou “de todo pecado”. O hebraico usa um termo que pode ter o sentido mais forte de atos de rebeldia, enquanto o paralelo grego diz “de todo pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נום מעול
  choice: Afaste-se da injustiça
  rationale: A forma hebraica inicial é um tanto incerta, mas o contexto e o grego ἀπόστησον sustentam uma ordem para afastar-se do mal. עול pode indicar injustiça, maldade ou iniquidade; “injustiça” conserva de modo claro sua dimensão ética.
- source_word: ומהכר פנים
  choice: e endireite as suas mãos
  rationale: A leitura hebraica preservada é difícil. O paralelo grego traz εὔθυνον χεῖρας, literalmente “endireite as mãos”, imagem que exorta a corrigir as próprias ações. A tradução mantém essa metáfora sem ocultar a incerteza textual, registrada em nota.
- source_word: ומכל פשעים
  choice: de todas as transgressões
  rationale: פשעים designa transgressões e pode realçar atos de rebeldia. A escolha segue mais de perto o hebraico; o grego apresenta o termo mais geral “todo pecado”, preservado como alternativa em nota.
- source_word: טהר לב
  choice: purifique o seu coração
  rationale: טהר significa limpar ou purificar. “Purifique o seu coração” preserva tanto a força imperativa quanto a ressonância moral e ritual da expressão.
theological_decisions:
- issue: Uso do paralelo grego diante de uma cláusula hebraica textualmente difícil
  choice: 'Manter o hebraico como testemunho principal e usar o grego para esclarecer a cláusula como uma exortação a corrigir as ações: “endireite as suas mãos”.'
  alternative: Traduzir literalmente a leitura hebraica difícil ou entendê-la como uma expressão ligada ao rosto.
  rationale: O texto hebraico sobrevivente é incerto nessa cláusula, enquanto o grego oferece uma sequência coerente de imperativos. A nota explicita essa dependência textual, evitando apresentar como indiscutível uma leitura que não é segura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento na terceira pessoa para boa legibilidade brasileira e internacional. A metáfora concreta das mãos foi preservada; a incerteza do texto hebraico e a alternativa grega foram explicitadas em notas.
