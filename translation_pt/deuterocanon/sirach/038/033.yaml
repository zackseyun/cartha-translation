base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/033.yaml
  text: He will apply his heart to complete the glaze[b][a], and his wakefulness is to cleanse the furnace.
translation:
  language: pt
  text: Ele se dedicará de coração a completar o acabamento[a] e ficará acordado para limpar o forno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é difícil neste contexto. Em geral significa “dom” ou “favor”, mas aqui parece indicar o acabamento da peça, talvez sua decoração ou revestimento.
    reason: alternative_reading
  - marker: b
    text: Ou “fornalha”; no contexto da olaria, trata-se provavelmente de um forno de cerâmica.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: se dedicará de coração
  rationale: Reproduz a imagem antropológica de καρδία e o sentido idiomático de empenhar-se seriamente, em português natural.
- source_word: συντελέσαι
  choice: a completar
  rationale: Expressa a finalidade do empenho do artesão e conserva o sentido de levar a obra ao fim.
- source_word: τὸ χάρισμα
  choice: o acabamento
  rationale: Embora χάρισμα costume significar “dom” ou “favor”, esse sentido não se ajusta bem ao contexto do oleiro. “Acabamento” mantém a referência provável à etapa final ou decorativa da peça sem especificar indevidamente uma técnica como a esmaltação.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: ficará acordado
  rationale: Converte a construção nominal grega em uma expressão verbal corrente, preservando a ideia de vigília ou atenção que tira o sono.
- source_word: καθαρίσαι
  choice: para limpar
  rationale: Mantém o sentido concreto de remover impurezas do forno, sem sugerir necessariamente purificação ritual.
- source_word: κάμινον
  choice: o forno
  rationale: No contexto da olaria, “forno” é a designação portuguesa mais natural; o termo grego também pode ser traduzido de modo mais geral por “fornalha”.
