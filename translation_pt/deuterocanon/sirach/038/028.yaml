  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: pt
  text: Assim, o ferreiro se senta junto à bigorna e examina o ferro ainda não trabalhado; o vapor do fogo derrete sua carne[a], e ele luta contra o calor da fornalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «consome sua carne». Literalmente, «derrete sua carne».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκεύς
  choice: ferreiro
  rationale: Termo natural em português para o artesão que trabalha metais; a menção imediata ao ferro favorece esta escolha, sem exigir a especificação mais ampla e menos idiomática «trabalhador de metais».
- source_word: ἐγγὺς ἄκμονος
  choice: junto à bigorna
  rationale: Reproduz de modo direto e natural a relação espacial e o contexto da oficina.
- source_word: καταμανθάνων
  choice: examina
  rationale: Expressa a observação atenta do material pelo artesão sem dar ao verbo um sentido excessivamente acadêmico.
- source_word: ἀργῷ σιδήρῳ
  choice: o ferro ainda não trabalhado
  rationale: Neste contexto, ἀργός indica provavelmente aquilo que está inativo ou não trabalhado. A formulação preserva esse sentido sem introduzir uma afirmação técnica sobre o estado metalúrgico do ferro.
- source_word: ἀτμὶς πυρός
  choice: o vapor do fogo
  rationale: Mantém a imagem de ἀτμίς e evita confundi-la com θέρμη, «calor», que aparece logo depois.
- source_word: τήξει
  choice: derrete
  rationale: Preserva a metáfora forte e concreta do verbo grego, mesmo quando aplicada à carne; a nota esclarece a possível expressão idiomática do desgaste físico.
- source_word: σάρκας αὐτοῦ
  choice: sua carne
  rationale: Mantém a linguagem corporal vívida do plural grego, vertido naturalmente pelo coletivo singular em português.
- source_word: ἐν θέρμῃ καμίνου
  choice: contra o calor da fornalha
  rationale: «Fornalha» se ajusta ao trabalho com metais, e «contra» produz em português uma construção natural com o verbo de luta.
- source_word: διαμαχήσεται
  choice: ele luta
  rationale: Comunica a ideia de enfrentamento intenso e contínuo, sem reduzir o verbo a mero desconforto.
