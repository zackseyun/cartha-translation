translation:
  language: pt
  text: De Deus o médico se torna sábio[a][b], e do rei recebe uma dádiva[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: «Pois a cura vem do Altíssimo.» O hebraico traz «de Deus» e apresenta uma construção diferente e difícil.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico menciona explicitamente o «médico» e pode ser entendido como: «De Deus o médico se torna sábio». O grego concentra a frase na origem da cura.'
    reason: textual_variant
  - marker: c
    text: 'Ou: «recebe pagamento». A expressão hebraica é incomum e pode evocar, mais literalmente, carregar ou erguer cargas; o grego diz: «receberá uma dádiva».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: De Deus
  rationale: Segue o testemunho hebraico primário, que traz אל, «Deus»; o grego paralelo traz «do Altíssimo», registrado em nota.
- source_word: יחכם רופא
  choice: o médico recebe sabedoria
  rationale: Representa de modo natural a construção hebraica «o médico torna-se sábio/adquire sabedoria», sem omitir רופא («médico»). A formulação hebraica é difícil diante do grego, que fala de «cura», por isso a variante é indicada em nota.
- source_word: מאת מלך
  choice: do rei
  rationale: A expressão hebraica pode ser genérica («de um rei»), mas «do rei» é idiomático no contexto e corresponde bem ao paralelo grego.
- source_word: ישא משאות
  choice: recebe uma dádiva
  rationale: A locução hebraica é incomum e pode evocar levantar ou levar cargas, mas משאות também pode relacionar-se a presentes ou porções. O grego λήμψεται δόμα confirma o sentido de receber uma dádiva ou recompensa.
