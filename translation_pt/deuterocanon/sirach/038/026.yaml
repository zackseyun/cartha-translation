  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
translation:
  language: pt
  text: Seu empenho é concluir o estábulo de engorda[a]; ele põe o coração em revolver a terra nos sulcos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “e sua vigília se volta para o alimento dos bezerros”. Isso apoia a ideia de cuidado constante com a alimentação do gado; o hebraico parece destacar o estábulo ou local de engorda.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “em destorroar nos sulcos”. O verbo hebraico pode indicar trabalhar ou revolver o solo, sem especificar com certeza uma técnica agrícola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: Sua dedicação
  rationale: O termo derivado de שקד comunica atenção persistente e empenho contínuo; “dedicação” é natural em português e se ajusta ao contexto do trabalho rural.
- source_word: לכלות
  choice: concluir o trabalho
  rationale: כלה pode significar terminar ou completar. Como o objeto seguinte designa um local, “o trabalho” fica implícito no contexto e torna a frase compreensível sem alterar seu sentido básico.
- source_word: מרבק
  choice: no estábulo de engorda
  rationale: מרבק designa o lugar em que o gado é alimentado ou engordado. A expressão escolhida conserva tanto a ideia de instalação rural quanto sua função.
- source_word: לב ישית
  choice: ele põe o coração
  rationale: Mantém a imagem idiomática hebraica de dirigir a vontade e a atenção a uma tarefa, em linguagem digna e inteligível.
- source_word: לשדד
  choice: em revolver a terra
  rationale: No contexto agrícola, o verbo indica trabalhar novamente o solo, quebrando-o ou destorroando-o; “revolver a terra” preserva essa amplitude sem impor uma técnica específica.
- source_word: בתלמים
  choice: nos sulcos
  rationale: תלמים são os sulcos ou linhas abertas na terra pelo arado; a construção locativa acompanha de perto o hebraico.
