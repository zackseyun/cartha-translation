translation_notes:
  register: Português moderno, claro e digno, com vocabulário rural compreensível. A expressão hebraica “põe o coração” foi preservada por sua força concreta; a primeira oração foi levemente explicitada com “o trabalho” para evitar a impressão pouco natural de que se conclui o próprio edifício.
