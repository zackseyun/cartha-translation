base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: pt
  text: Meu filho, torne amargo o pranto e complete a lamentação; observe por ele o luto que lhe é devido. Derrame lágrimas por um ou dois dias[a]; depois, console-se da tristeza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “um dia e dois, por causa das lágrimas”. O grego traz “por causa da calúnia/reprovação”, talvez no sentido de evitar críticas por negligenciar o luto devido.
    reason: textual_variant
  - marker: b
    text: O termo hebraico também pode significar “iniquidade” ou ser entendido aqui como “aflição”; o grego apoia o sentido de “tristeza”.
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: torne amargo o pranto
  rationale: Preserva a imagem causativa de מרר e sua força idiomática de intensificar o pranto; o grego πίκρανον confirma a imagem de amargura.
- source_word: והתם מספד
  choice: complete a lamentação
  rationale: Expressa a ideia de levar a lamentação fúnebre ao devido cumprimento, sem sugerir uma interrupção prematura.
- source_word: ושית אבלו כיוצא בו
  choice: cumpra o luto por ele como lhe é devido
  rationale: Entende o sufixo como referente ao falecido e כיוצא בו como a medida apropriada ao que lhe é devido; o grego κατὰ τὴν ἀξίαν αὐτοῦ apoia essa leitura.
- source_word: יום ושנים בעבור דמעה
  choice: Derrame lágrimas por um ou dois dias
  rationale: Converte a expressão hebraica elíptica, literalmente ligada a um ou dois dias e às lágrimas, numa instrução natural em português. A divergência do grego é preservada em nota.
- source_word: הנחם
  choice: console-se
  rationale: Mantém o valor reflexivo ou passivo do imperativo e indica a passagem do luto ativo para o consolo.
- source_word: בעבור עון
  choice: da tristeza
  rationale: No contexto funerário, toma עון no campo semântico de aflição ou sofrimento, leitura apoiada pelo grego λύπη, sem ocultar em nota a dificuldade do hebraico.
theological_decisions:
- issue: Relação entre o hebraico preservado e o paralelo grego
  choice: Dar primazia ao hebraico no corpo do texto e registrar as variantes gregas relevantes em notas.
  alternative: Adotar no corpo do texto a leitura grega “por causa da calúnia/reprovação”.
  rationale: O hebraico está preservado e tem alta confiança; o grego serve como testemunho paralelo importante, sobretudo onde há dificuldade semântica, mas não deve substituir silenciosamente a leitura hebraica.
- issue: Sentido de עון na cláusula final
  choice: Traduzir no contexto como “tristeza”.
  alternative: “iniquidade”, “culpa”, “aflição” ou “sofrimento”.
  rationale: A referência imediata é ao luto, e o grego λύπη favorece “tristeza”; a nota mantém aberta a dificuldade lexical e evita transformar a frase numa afirmação doutrinária sobre pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. “Torne amargo o pranto” conserva deliberadamente a imagem hebraica; “cumpra o luto” comunica a observância adequada sem linguagem técnica.
