base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: pt
  text: Meu filho, quando estiver doente, não se descuide[a]; ore a Deus[b], pois ele o curará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não negligencie isso” ou “não deixe isso de lado”. O paralelo grego favorece o sentido de não desconsiderar a própria enfermidade.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “ore ao Senhor”; o testemunho hebraico aqui diz: “a Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בני
  choice: Meu filho
  rationale: O vocativo hebraico significa literalmente “meu filho” e preserva o tom paterno de instrução característico de Sirácida; o grego paralelo usa o termo mais amplo “filho/criança”.
- source_word: בחולי
  choice: quando estiver doente
  rationale: A construção com ב pode ter sentido circunstancial ou temporal. Esta formulação comunica naturalmente em português o sentido de “em sua enfermidade”, confirmado pelo grego paralelo.
- source_word: על תתעבר
  choice: não se descuide
  rationale: A expressão hebraica é idiomática e sua nuance exata é incerta. O grego μὴ παράβλεπε apoia o sentido de não negligenciar nem deixar de dar atenção à enfermidade. “Não se descuide” mantém a advertência sem acrescentar um objeto explícito ausente da redação hebraica transmitida.
- source_word: התפלל
  choice: ore
  rationale: O verbo significa diretamente “orar”; o imperativo português é claro, natural e fiel.
- source_word: אל אל
  choice: a Deus
  rationale: O testemunho hebraico traz “a Deus”. Embora o grego paralelo leia “ao Senhor”, o hebraico extante e de alta confiança rege o texto principal.
- source_word: כי הוא ירפא
  choice: pois ele o curará
  rationale: A oração apresenta a cura como razão para orar. O objeto “o” está implícito no contexto hebraico e aparece explicitamente no grego; sua inclusão produz português natural sem alterar o sentido.
theological_decisions:
- issue: Título divino na ordem para orar
  choice: Deus
  alternative: Senhor
  rationale: O hebraico extante lê אל, “Deus”, enquanto o paralelo grego traz Κυρίῳ, “Senhor”. O texto principal segue o hebraico, e a diferença textual relevante é registrada em nota.
- issue: Afirmação de cura divina
  choice: ele o curará
  alternative: ele pode curá-lo
  rationale: O hebraico emprega uma forma verbal que afirma a cura, não mera possibilidade. A tradução preserva essa força e a tensão teológica do texto, sem atenuá-la nem qualificá-la interpretativamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Quando estiver doente” evita a rigidez de “em sua enfermidade”, e “não se descuide” expressa naturalmente a advertência sem resolver em excesso a ambiguidade do hebraico.
