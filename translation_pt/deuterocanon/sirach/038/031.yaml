  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: pt
  text: Assim também o oleiro, sentado junto ao seu trabalho e fazendo a roda girar com os pés, está sempre preocupado com o seu trabalho, e todo o seu trabalho é numerado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o seu trabalho é contado”. O grego ἐνάριθμος pode significar “numerado” ou “contado”; ἐργασία também pode referir-se à atividade ou à produção resultante dela.'
    reason: Preserva as alternativas lexicais de ἐνάριθμος e a amplitude contextual de ἐργασία, sem tornar a formulação principal obscura.
lexical_decisions:
- source_word: κεραμεύς
  choice: oleiro
  rationale: É o termo português corrente para o artesão que fabrica vasos e outros objetos de barro, correspondendo diretamente ao sentido grego.
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: sentado ao seu trabalho
  rationale: Conserva tanto a postura do artesão como sua dedicação concreta à tarefa, em linguagem natural.
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: fazendo a roda girar com os pés
  rationale: Expressa claramente que o oleiro põe a roda em movimento por meio dos pés, sem sugerir que ele a gira com as mãos.
- source_word: ἐν μερίμνῃ κεῖται διὰ παντός
  choice: vive continuamente preocupado
  rationale: A construção descreve um estado persistente de cuidado ou preocupação. “Vive” comunica naturalmente a continuidade de κεῖται διὰ παντός, enquanto “preocupado” preserva a intensidade possível de μέριμνα sem pressupor ansiedade patológica.
- source_word: ἐπὶ τὸ ἔργον αὐτοῦ
  choice: com o seu trabalho
  rationale: Indica aquilo para o qual se dirige a preocupação do oleiro; a regência é idiomática em português.
- source_word: πᾶσα ἡ ἐργασία αὐτοῦ
  choice: toda a sua produção
  rationale: Neste contexto artesanal, ἐργασία pode designar o trabalho realizado ou seu produto. “Produção” evita repetição excessiva de “trabalho” e combina naturalmente com a ideia de itens contados, sem eliminar a alternativa lexical registrada em nota.
- source_word: ἐνάριθμος
  choice: é contada
  rationale: Reproduz o sentido básico de algo enumerado ou contabilizado e resulta mais claro em português do que o decalque “é por número”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário artesanal corrente. A frase conserva a estrutura descritiva do grego, mas usa construções idiomáticas. “Assim também” liga naturalmente o oleiro aos artesãos mencionados no contexto precedente.
