  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: pt
  text: Pois há ocasiões em que o sucesso está em suas mãos[a], porque ele também suplicará a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “há ocasiões em que o sucesso também está nas mãos deles”. O testemunho hebraico traz o singular (“em suas mãos”), seguido no texto principal.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Pois / porque
  rationale: 'As duas ocorrências introduzem explicações causais no contexto: a primeira fundamenta a consideração pelo médico, e a segunda explica sua dependência de Deus.'
- source_word: יש עתם
  choice: há ocasiões
  rationale: Expressa de modo natural o valor indefinido e temporal da construção hebraica, sem impor a ideia mais específica de um tempo divinamente marcado.
- source_word: בידו
  choice: em suas mãos
  rationale: Mantém o idioma hebraico e o singular do testemunho principal, indicando a capacidade prática do médico.
- source_word: מצלחת
  choice: sucesso
  rationale: Comunica um resultado favorável no contexto médico e corresponde bem ao paralelo grego εὐοδία.
- source_word: גם הוא
  choice: ele também
  rationale: Preserva a ênfase de que o próprio médico, além do paciente, recorre a Deus.
- source_word: אל אל
  choice: a Deus
  rationale: Entende a sequência como preposição mais título divino, evitando uma reprodução artificial em português.
- source_word: יעתיר
  choice: suplicará
  rationale: O verbo indica uma súplica insistente, mais forte que uma referência genérica à oração, sem exigir uma expressão arcaizante.
theological_decisions:
- issue: Relação entre a capacidade médica e a ação divina
  choice: O médico pode alcançar verdadeiro sucesso e, ao mesmo tempo, depender de Deus em súplica.
  alternative: A frase poderia ser entendida apenas como uma observação de que médicos às vezes obtêm bons resultados, ou o plural grego poderia generalizar a afirmação para os médicos como grupo.
  rationale: A formulação conserva a tensão do texto entre a eficácia real dos meios humanos e a dependência de Deus, sem reduzir a cura nem à técnica humana nem exclusivamente à intervenção milagrosa.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Há ocasiões” soa mais natural que “há um tempo” neste enunciado geral; “suplicará” preserva o peso do verbo hebraico. O pronome singular retoma o médico mencionado no contexto.
