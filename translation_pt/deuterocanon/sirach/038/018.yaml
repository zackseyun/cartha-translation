  text: For from grief disaster comes forth[a]; so a sorrowful heart wastes away in sadness.
translation:
  language: pt
  text: Pois da aflição surge a desgraça[a]; assim, o coração angustiado se consome na tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Pois da tristeza vem a morte, e a tristeza do coração abate a força”. O hebraico traz “desgraça”, e não “morte”; por isso, o texto principal segue o testemunho hebraico, enquanto esta nota preserva a alternativa grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: da aflição
  rationale: A forma hebraica é difícil isoladamente, mas o paralelo grego ἀπὸ λύπης apoia o sentido de aflição, tristeza ou pesar, adequado ao contexto de luto.
- source_word: יוצא
  choice: surge
  rationale: Expressa de modo natural em português a ideia hebraica de algo que sai ou procede como consequência.
- source_word: אסון
  choice: desgraça
  rationale: O hebraico indica uma calamidade grave; “desgraça” preserva esse sentido sem adotar no texto principal a leitura grega “morte”.
- source_word: כן
  choice: assim
  rationale: Mantém a relação comparativa ou consequencial entre os dois membros do verso, sem reduzi-la a uma simples conjunção.
- source_word: רע לבב
  choice: o coração angustiado
  rationale: Embora a expressão seja literalmente próxima de “mau de coração”, o contexto de luto e o paralelo grego indicam sofrimento interior, não maldade moral.
- source_word: יכלה
  choice: se consome
  rationale: O verbo transmite a ideia de esgotar-se, definhar ou chegar ao fim; a forma reflexiva é idiomática em português neste contexto.
- source_word: עצבה
  choice: na tristeza
  rationale: O termo pode designar dor, pesar ou tristeza; “na tristeza” mantém o foco emocional e produz uma frase natural.
