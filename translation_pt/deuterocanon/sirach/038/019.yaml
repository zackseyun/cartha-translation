base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/019.yaml
  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: pt
  text: Não fixe mais o coração nele[a]; deixe ir a lembrança dele[b] e lembre-se do fim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não ponha mais o coração em direção a ele”, expressão que, neste contexto, significa não permanecer emocionalmente fixado no morto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “solte a lembrança dele” ou “afaste a recordação dele”. O verbo hebraico desta expressão é difícil; o paralelo grego favorece a ideia de seguir adiante para além da tristeza.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “lembre-se do fim dele” ou “lembre-se do seu próprio fim”. O hebraico diz apenas “o fim” e pode deixar deliberadamente amplo o referente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב עוד
  choice: Não prenda mais o coração a ele
  rationale: Preserva a imagem hebraica do coração, mas a expressa em português natural como uma exortação a não continuar emocionalmente fixado no falecido. “Mais” comunica a cessação de uma atitude prolongada.
- source_word: פרע זכרו
  choice: deixe ir a sua lembrança
  rationale: O verbo hebraico é difícil. Esta formulação evita tanto o sentido excessivamente forte de apagar ou esquecer completamente quanto uma expressão artificial, e comunica a ideia contextual de soltar a lembrança à qual o enlutado permanece preso.
- source_word: וזכור אחרית
  choice: e lembre-se do fim
  rationale: אחרית pode indicar fim, desfecho ou destino final. A tradução concisa conserva a amplitude do hebraico e não determina se se trata do fim do falecido, do próprio leitor ou da mortalidade em geral.
theological_decisions:
- issue: Referente implícito de אחרית (“o fim”)
  choice: 'Manter o referente sem especificação: “o fim”'
  alternative: “o fim dele” ou “o seu próprio fim”
  rationale: O hebraico não explicita de quem é o fim. A formulação aberta preserva a ambiguidade sapiencial e sua possível referência ampla à mortalidade e ao desfecho da vida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A imagem do coração foi preservada sem recorrer à formulação potencialmente romântica “entregar o coração”. A pontuação acompanha as três exortações breves do hebraico.
