  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
translation:
  language: pt
  text: Meu filho, derrame lágrimas pelo morto; entregue-se à amarga dor e comece um lamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz, de modo aproximado, «torne-se amargo e [verbo difícil] lamento». O sentido do verbo final no hebraico preservado é incerto. O paralelo grego diz: «e, como quem sofre terrivelmente, comece um lamento», apoiando o sentido adotado aqui.'
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Meu filho
  rationale: Vocativo singular com sufixo de primeira pessoa; preserva o tom pessoal e instrutivo de Ben Sira.
- source_word: על המת
  choice: pelo morto
  rationale: A preposição marca a pessoa por cuja morte se chora; esta é uma formulação natural e direta em português.
- source_word: הזיב דמעה
  choice: derrame lágrimas
  rationale: O idioma hebraico descreve fazer correr uma lágrima; o plural é idiomático em português e o paralelo grego confirma a ordem de chorar.
- source_word: התמרר
  choice: entregue-se à amargura
  rationale: O hitpael expressa entrar ativamente na dor amarga. A formulação evita o sentido moderno de ressentimento que “amargure-se” poderia sugerir.
- source_word: וגהה קינה
  choice: comece a lamentação
  rationale: O verbo hebraico transmitido é difícil, mas קינה designa uma lamentação formal, e o paralelo grego apoia claramente o sentido de iniciá-la.
