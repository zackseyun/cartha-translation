  naturalness: «Derrame lágrimas pelo morto» é claro e digno. «Entregue-se à amarga dor» e «comece um lamento» soam mais naturais em português moderno do que «entregue-se à amargura» e «comece a lamentação», sem reduzir o registro solene.
  terminology: «Lamento» comunica adequadamente a קינה, uma lamentação formal. «Amarga dor» conserva o elemento de amargura de התמרר no contexto funerário, sem introduzir sentido doutrinário.
