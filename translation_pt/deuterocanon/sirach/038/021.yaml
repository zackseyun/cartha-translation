  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: pt
  text: Não continue se lembrando dele[a], pois não há retorno; você não o ajudará e fará mal a si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “pois ele não tem esperança”; o paralelo grego traz: “pois não há retorno”.'
    reason: Leitura alternativa decorrente da diferença entre a testemunha hebraica e o paralelo grego.
lexical_decisions:
- source_word: אל תזכרנו
  choice: Não continue se lembrando dele
  rationale: O imperativo negativo com זכר pode significar não se lembrar ou não mencionar. No contexto do luto, a formulação indica não permanecer fixado na lembrança, sem impor uma proibição absoluta de recordar o falecido.
- source_word: כי אין לו תקוה
  choice: pois não há retorno
  rationale: O hebraico diz mais literalmente que ele não tem esperança, mas o paralelo grego traz explicitamente que não há retorno. A leitura adotada comunica a força contextual referente à morte, e a leitura hebraica literal é preservada em nota.
- source_word: מה תועיל
  choice: você não o ajudará
  rationale: Embora o hebraico possa ser entendido literalmente como uma pergunta sobre que proveito haverá, o contexto fornece o falecido como objeto; o grego explicita que o enlutado não o beneficiará. A forma portuguesa é natural e clara.
- source_word: ולך תרע
  choice: e fará mal a si mesmo
  rationale: A expressão indica dano para o próprio enlutado. O paralelo grego torna explícito o sentido reflexivo, que esta tradução preserva.
theological_decisions:
- issue: Se תקוה deve ser traduzido pelo sentido lexical usual, “esperança”, ou pelo sentido contextual apoiado pelo grego, “retorno”
  choice: pois não há retorno
  alternative: pois ele não tem esperança
  rationale: O texto hebraico é a testemunha principal, mas o paralelo grego é evidência antiga relevante e, no contexto do luto pelos mortos, explicita a ideia de que o falecido não voltará. A tensão textual é mantida em nota, sem apagar a leitura literal do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com construção legível no Brasil. “Não continue se lembrando” expressa luto persistente sem sugerir que toda lembrança do falecido seja proibida.
