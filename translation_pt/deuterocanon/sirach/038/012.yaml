  text: Also give the physician a place[a], and do not dismiss him, for there is need of him as well.
translation:
  language: pt
  text: Dê também lugar ao médico[a] e não o deixe ir embora, pois ele também é necessário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego acrescenta, depois de «Dê também lugar ao médico»: «pois o Senhor o criou»; em seguida, traz «não o deixe afastar-se de você».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: também
  rationale: Preserva a força aditiva que liga esta exortação ao contexto anterior, em posição natural no português.
- source_word: לרופא
  choice: ao médico
  rationale: רופא designa o médico ou curador; «médico» é atual, digno e amplamente compreensível. O artigo dá valor genérico à classe.
- source_word: תן מקום
  choice: Dê ... lugar
  rationale: Conserva a metáfora concreta do hebraico, com o sentido contextual de acolher e permitir ao médico exercer seu papel.
- source_word: ולא ימוש
  choice: e não o deixe ir embora
  rationale: מוש exprime afastar-se ou partir. A construção causativa em português comunica naturalmente a exortação para que o médico não se afaste, sem transformar o verbo em «dispensar».
- source_word: כי גם בו צורך
  choice: pois você também precisa dele
  rationale: Expressa em português corrente a necessidade prática indicada pela construção hebraica impessoal, preservando a ênfase aditiva de גם.
theological_decisions:
- issue: Diferença entre o texto hebraico e a expansão do paralelo grego
  choice: Traduzir no corpo do versículo somente o hebraico preservado e registrar em nota a frase adicional do grego.
  alternative: 'Incluir no texto: «pois o Senhor o criou».'
  rationale: O hebraico disponível é a fonte primária e não contém a afirmação sobre a criação do médico. O paralelo grego é relevante para a história textual, mas não deve substituir nem ampliar silenciosamente o texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Dê lugar ao médico» mantém a imagem sapiencial do original; «não o deixe ir embora» evita tanto o arcaísmo quanto a interpretação mais específica de «não o dispense».
