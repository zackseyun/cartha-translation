translation:
  language: pt
  text: Com seu braço, moldará o barro e, diante de seus pés, curvará sua força.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele se curvará diante de seus pés, usando sua força”. A expressão grega é condensada e pode descrever tanto a postura física do artesão quanto o emprego de sua força no trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: Com o braço
  rationale: Mantém o braço como instrumento do trabalho manual e soa natural em português.
- source_word: τυπώσει
  choice: moldará
  rationale: No contexto do trabalho com πηλός, o verbo indica dar forma ao material; “moldará” preserva a imagem artesanal.
- source_word: πηλόν
  choice: o barro
  rationale: “Barro” é a designação corrente, em português, da argila trabalhada pelo oleiro.
- source_word: πρὸ ποδῶν
  choice: diante dos próprios pés
  rationale: Preserva a localização concreta expressa pelo grego; “próprios” esclarece naturalmente que os pés são os do artesão, sem mudar o referente.
- source_word: κάμψει ἰσχὺν αὐτοῦ
  choice: curvará toda a sua força
  rationale: Conserva a imagem incomum e comprimida do grego, em vez de decidir se ela descreve principalmente a postura física do artesão ou o emprego de sua força. “Toda” torna idiomática a noção de força plenamente aplicada, embora não corresponda a um termo grego separado.
