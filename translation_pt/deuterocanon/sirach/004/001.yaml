base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: pt
  text: Meu filho, não zombe da vida do pobre[a] e não cause dor a uma pessoa pobre e amargurada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “não prive o pobre de sua vida”, expressão que também pode ser entendida como “não prive o pobre de seu sustento”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico emprega “alma” (nefesh) e a expressão “amargo de alma”. “Alma” também pode significar “vida”, “ser” ou “pessoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva a forma masculina singular da fórmula de instrução sapiencial hebraica, sem neutralizar o endereço original.
- source_word: אַל תִּלְעַג
  choice: não zombe
  rationale: Expressa de modo natural e direto a ideia de escarnecer ou tratar com desprezo.
- source_word: לְחַיֵּי עָנִי
  choice: da vida do pobre
  rationale: Mantém de perto o hebraico, que fala da vida ou condição de vida do pobre; a leitura grega ligada à privação é registrada em nota.
- source_word: וְאַל תַּדְאִיב
  choice: não cause dor
  rationale: O verbo abrange causar sofrimento, tristeza ou aflição; esta formulação evita limitar o dano apenas à tristeza emocional.
- source_word: נֶפֶשׁ
  choice: pessoa
  rationale: Neste contexto, נֶפֶשׁ pode designar o próprio indivíduo, sua vida ou seu ser interior. 'Pessoa' produz português claro sem afirmar uma divisão antropológica específica.
- source_word: עָנֵי וּמַר נָפֶשׁ
  choice: pobre e amargurada
  rationale: Entende 'amargurada de alma' como descrição da pessoa pobre profundamente aflita, preservando a força do paralelismo em linguagem natural.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego no primeiro membro
  choice: 'Traduzir o hebraico no texto principal: ''não zombe da vida do pobre''.'
  alternative: 'Segundo o grego: ''não prive o pobre de sua vida'', possivelmente ''não prive o pobre de seu sustento''.'
  rationale: O hebraico conservado é a fonte principal e traz o verbo 'zombar'. O grego testemunha uma leitura distinta, ligada à privação, que merece ser preservada sem substituir silenciosamente o hebraico.
- issue: Amplitude semântica de נֶפֶשׁ
  choice: Usar 'pessoa' no texto e registrar em nota os sentidos 'alma', 'vida' e 'ser'.
  alternative: Traduzir literalmente 'alma pobre e amargurada'.
  rationale: No hebraico, נֶפֶשׁ frequentemente designa a pessoa inteira ou sua vida, além do ser interior. 'Pessoa' é claro e evita impor uma leitura doutrinária, enquanto a nota conserva a ambiguidade.
- issue: Forma masculina do endereço sapiencial
  choice: Meu filho
  alternative: Meu filho ou minha filha / Minha criança
  rationale: A forma hebraica é masculina singular. Preservá-la representa com precisão o gênero gramatical e a fórmula literária da fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita linguagem excessivamente técnica e conserva em notas as diferenças textuais e a amplitude lexical relevantes.
