base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/005.yaml
  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: pt
  text: Quem clama, amargurado de espírito e na dor de sua alma[a] — sua Rocha ouvirá a voz de seu clamor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não desvies os olhos de quem suplica e não dês a ninguém motivo para amaldiçoar-te.” O testemunho hebraico, porém, ressalta que a Rocha da pessoa aflita ouvirá seu clamor.'
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: Quem clama
  rationale: O particípio hebraico retrata uma pessoa no ato ou na condição de clamar. “Quem clama” é natural em português e mantém o caráter geral da expressão sem acrescentar uma identificação ausente no texto.
- source_word: מַר רוּחַ
  choice: com o espírito amargurado
  rationale: A expressão significa literalmente “amargo de espírito”. Esta formulação preserva a imagem da amargura interior em linguagem atual e digna.
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: na dor de sua alma
  rationale: כאב indica dor, e נפש designa aqui a pessoa em sua dimensão interior. “Alma” conserva a profundidade da aflição sem impor uma antropologia doutrinária específica.
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: ao som do seu clamor
  rationale: A expressão é literalmente “à/pela voz do seu clamor”. “Ao som do seu clamor” preserva a imagem auditiva e produz uma construção idiomática em português.
- source_word: צוּרוֹ
  choice: sua Rocha
  rationale: O hebraico traz literalmente “sua Rocha”, título metafórico divino. A tradução conserva a metáfora teologicamente significativa, em vez de substituí-la por “Deus”, “Criador” ou “protetor”.
- source_word: יִשְׁמַע
  choice: ouvirá
  rationale: 'O yiqtol tem força futura ou consequencial neste contexto: a Rocha do aflito ouvirá seu clamor. “Ouvirá” mantém essa força sem explicitar além do hebraico se ouvir implica responder.'
theological_decisions:
- issue: Relação entre o testemunho hebraico e o paralelo grego
  choice: Traduzir somente o conteúdo atestado no hebraico no texto principal e registrar em nota a redação substancialmente diferente do grego.
  alternative: 'Incorporar no texto principal a ordem grega: “Não desvies os olhos de quem suplica...”'
  rationale: O hebraico fornecido é a fonte primária e não contém uma proibição inicial explícita. Introduzi-la no corpo do versículo fundiria dois testemunhos distintos e resolveria indevidamente sua tensão textual. A nota permite que o leitor conheça a forma grega sem substituir o hebraico.
- issue: Sentido de נפש
  choice: alma
  alternative: ser, vida ou íntimo
  rationale: No contexto de dor e espírito amargurado, נפש aponta para a profunda aflição da pessoa. “Alma” conserva essa profundidade, mas não pretende definir uma antropologia técnica.
- issue: Força teológica de צוּרוֹ
  choice: Conservar o título divino “sua Rocha”.
  alternative: Explicitar “seu Deus”, “seu Criador” ou “seu protetor”.
  rationale: A metáfora da Rocha comunica estabilidade e proteção e pertence à formulação própria do testemunho hebraico. Explicá-la no corpo do texto reduziria sua riqueza e acrescentaria interpretação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural para brasileiros. O travessão ajuda a apresentar com clareza a consequência expressa no segundo membro, sem acrescentar a proibição encontrada apenas no grego. “Clamor”, “alma” e “Rocha” mantêm o tom elevado da literatura sapiencial sem arcaísmo excessivo.
