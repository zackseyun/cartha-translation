base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/003.yaml
  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: pt
  text: Não amargure o íntimo do pobre[a] nem cause dor ao coração do necessitado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as partes interiores”; o paralelo grego traz “coração”, entendendo a expressão como a vida emocional interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: amargure
  rationale: O causativo de חמר, neste contexto, comunica tornar amargo ou afligir profundamente. “Amargure” preserva a imagem hebraica e se combina naturalmente com “o íntimo”.
- source_word: מְעֵי
  choice: o íntimo
  rationale: O termo designa literalmente as partes interiores, entendidas como sede dos sentimentos. “O íntimo” mantém a antropologia concreta do hebraico em português atual sem recorrer ao pouco natural “entranhas”.
- source_word: דָךְ
  choice: o pobre
  rationale: דָךְ pode indicar quem está abatido, esmagado ou em condição humilde. “O pobre” é claro no contexto de responsabilidade social e conserva a vulnerabilidade implícita no termo.
- source_word: קֶרֶב
  choice: coração
  rationale: Embora signifique literalmente interior ou parte interna, aqui se refere à vida emocional. “Coração” é o equivalente idiomático mais natural e sustenta o paralelismo poético.
- source_word: עָנִי
  choice: o necessitado
  rationale: עָנִי abrange pobreza, aflição e dependência. “O necessitado” evita repetição mecânica de “pobre” e ressalta a situação de carência.
- source_word: תַּכְאִיב
  choice: cause dor
  rationale: A forma causativa de כאב significa provocar dor. A expressão portuguesa reproduz diretamente a força concreta da proibição.
theological_decisions:
- issue: Preservação do idioma antropológico hebraico
  choice: Distinguir “o íntimo” no primeiro membro e “coração” no segundo.
  alternative: Uniformizar ambos os membros com “coração” ou “íntimo”.
  rationale: מְעֵי e קֶרֶב se sobrepõem, mas não são idênticos. A distinção conserva a textura poética do hebraico, enquanto o paralelo grego confirma que a referência é à vida emocional interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Não amargure” conserva a imagem da fonte; “o íntimo” evita tanto a literalidade anatômica pouco natural quanto a completa eliminação do idioma hebraico.
