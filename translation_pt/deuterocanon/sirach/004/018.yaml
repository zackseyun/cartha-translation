translation:
  language: pt
  text: Se ele se desviar e se afastar, ela o prenderá[b] com amarras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz um texto bastante diferente: “Então ela voltará diretamente a ele, o alegrará e lhe revelará seus segredos.” Isso provavelmente reflete outra forma textual de Sirácida.'
    reason: textual_variant
  - marker: b
    text: A expressão hebraica traduzida por “e se afastar” é difícil e pode ter um sentido próximo de “e se desviar”. O verbo traduzido por “ela o prenderá” também pode ser entendido como “eu o prenderei”; “com amarras” pode ser traduzido mais especificamente por “com grilhões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Mantém o valor condicional normal da conjunção hebraica, sem transformá-la em indicação temporal.
- source_word: יָסוּר וּנְטוֹתֵיהוּ
  choice: ele se desviar
  rationale: A sequência hebraica é difícil. A formulação concisa preserva a ideia central de afastamento ou desvio sem acrescentar um complemento que não esteja claramente expresso no texto.
- source_word: וַאֲסַרְתִיהוּ
  choice: ela o prenderá
  rationale: O contexto apresenta a Sabedoria personificada como agente, favorecendo o sujeito feminino. A forma hebraica, porém, também admite a leitura em primeira pessoa, registrada em nota.
- source_word: בָאֲסוּרִים
  choice: com amarras
  rationale: Expressa de modo natural a ideia ampla de laços que restringem, sem limitar o sentido a correntes ou grilhões metálicos.
theological_decisions:
- issue: Identidade do sujeito na segunda oração
  choice: 'A Sabedoria é o sujeito: “ela o prenderá”.'
  alternative: 'Leitura em primeira pessoa: “eu o prenderei”.'
  rationale: A personificação da Sabedoria no contexto favorece o feminino, mas a dificuldade da forma hebraica não permite ocultar a alternativa; por isso, ela é preservada em nota.
- issue: Relação entre o hebraico e o paralelo grego
  choice: O texto principal segue o hebraico preservado.
  alternative: 'Seguir o grego: a Sabedoria volta diretamente ao homem, alegra-o e lhe revela seus segredos.'
  rationale: O paralelo grego difere substancialmente e provavelmente representa outra forma textual. Como o hebraico está preservado com alta confiança, ele permanece como base, e a divergência grega é documentada.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. “Amarras” preserva a imagem concreta de restrição sem recorrer a uma expressão arcaica. As notas mantêm visíveis tanto a incerteza gramatical do hebraico quanto a importante variante grega.
