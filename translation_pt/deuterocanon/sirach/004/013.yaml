base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/013.yaml
  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: pt
  text: Os que se apegam a ela encontrarão honra da parte de Yahweh[a] e serão agraciados com a bênção de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Quem se apega a ela herdará glória, e, onde quer que ele entre, o Senhor abençoará”. O hebraico diz: “encontrarão honra da parte de Yahweh” e “serão agraciados com a bênção de Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: Os que se apegam a ela
  rationale: O verbo תמך pode significar “sustentar”, “segurar” ou “manter firme”. No contexto da Sabedoria personificada, “apegar-se a ela” comunica adesão perseverante e concorda com o paralelo grego κρατῶν αὐτῆς.
- source_word: יִמְצְאוּ
  choice: encontrarão
  rationale: Reproduz diretamente o sentido comum do hebraico מצא sem adotar o “herdará” da tradição grega.
- source_word: כָבוֹד
  choice: honra
  rationale: No contexto sapiencial, indica estima ou dignidade concedida por Deus. “Glória” também é possível e corresponde ao grego δόξαν, mas “honra” representa bem o hebraico.
- source_word: מֵיהֹוָה
  choice: da parte de Yahweh
  rationale: A preposição מן indica a origem da honra; “da parte de” expressa essa procedência divina com naturalidade em português.
- source_word: וְיֻחַנּוּ
  choice: serão agraciados
  rationale: Preserva a voz passiva de חנן, “mostrar favor, agir graciosamente”, em linguagem portuguesa natural e digna.
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: com a bênção de Yahweh
  rationale: Mantém aberta a nuance associativa ou instrumental da preposição ב e liga o favor recebido à bênção divina sem estreitar indevidamente a relação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome divino pessoal, em conformidade com a orientação editorial fornecida, sem substituí-lo por um título.
- issue: Relação entre favor e bênção na segunda oração
  choice: serão agraciados com a bênção de Yahweh
  alternative: receberão favor por meio da bênção de Yahweh
  rationale: A formulação escolhida conserva a passividade de יֻחַנּוּ e a flexibilidade semântica de בְּ, evitando decidir se a bênção é estritamente o instrumento ou o conteúdo do favor.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A Sabedoria permanece personificada no pronome feminino “ela”. A nota registra a diferença substancial entre o hebraico e o paralelo grego.
