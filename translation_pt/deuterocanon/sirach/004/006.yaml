  source_fidelity: 'A tradução segue adequadamente o testemunho grego operacional: «Pois, se ele clamar contra você» comunica o apelo adversativo de καραμένου, «na amargura de sua alma» reproduz ἐν πικρίᾳ ψυχῆς αὐτοῦ, e «aquele que o criou ouvirá sua súplica» representa com fidelidade ὁ ποιήσας αὐτόν τῆς δεήσεως αὐτοῦ ἐπακούσεται. A nota identifica com transparência o desencontro da linha hebraica fornecida e a opção pelo grego.'
