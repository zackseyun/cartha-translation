  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: pt
  text: Pois, se ele clamar contra você na amargura de sua alma, aquele que o criou ouvirá sua súplica.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica existente nos manuscritos da Guenizá do Cairo citada para este versículo não corresponde ao texto grego; por isso, a tradução principal segue aqui o testemunho grego.
    reason: textual_variant
  - marker: b
    text: 'Ou: “invocar juízo contra você”, em vez de “clamar contra você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  choice: clamar contra você
  rationale: O particípio grego indica aqui um apelo hostil dirigido contra o destinatário, no contexto do sofrimento do pobre; a formulação preserva também a possibilidade de uma invocação de juízo.
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: na amargura de sua alma
  rationale: Tradução próxima da forma grega, preservando a intensidade emocional e a linguagem antropológica de ψυχή.
- source_word: δέησις
  choice: súplica
  rationale: Expressa um pedido urgente e dirigido a Deus, sem reduzir o termo a uma oração genérica.
- source_word: ἐπακούσεται
  choice: ouvirá
  rationale: Mantém o sentido de ouvir favoravelmente, sem explicitar como resposta aquilo que o verbo apenas implica.
- source_word: ὁ ποιήσας αὐτόν
  choice: aquele que o criou
  rationale: Forma natural em português que preserva a referência a Deus como Criador da pessoa oprimida.
theological_decisions:
- issue: Seleção da fonte primária diante do desencontro do testemunho hebraico
  choice: Traduzir o paralelo grego como fonte operacional e registrar a divergência textual em nota.
  alternative: 'Traduzir a linha hebraica fornecida: “Ama a tua vida diante da assembleia e inclina ainda mais a cabeça diante da autoridade.”'
  rationale: A linha hebraica preservada e apresentada não corresponde ao conteúdo deste versículo na tradição grega e parece pertencer a outro contexto. O grego oferece aqui um texto coerente com a sequência sobre o pobre e permite preservar honestamente a incerteza textual.
- issue: Força de καραμένου
  choice: clamar contra você
  alternative: invocar juízo contra você
  rationale: A opção principal conserva o caráter adversativo do apelo sem determinar de modo excessivo que se trata formalmente de uma maldição ou sentença judicial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” evita regionalismo excessivo; “aquele que o criou” soa mais natural que “seu Feitor” e mantém a teologia criacional. As notas registram tanto o problema textual quanto a ambiguidade lexical.
