base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: pt
  text: E até que o coração dele se encha de mim[a], voltarei e o farei feliz[b], e lhe revelarei os meus segredos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “até que ela confie na alma dele” — ou, possivelmente, “até que ele lhe confie a sua alma” — e acrescenta que a Sabedoria “o porá à prova por meio de seus preceitos”. Isso reflete uma forma mais extensa do texto sobre as provas da Sabedoria antes de ela voltar a favorecê-lo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o abençoarei” ou “o declararei feliz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: E até que
  rationale: Preserva a conjunção e expressa de modo natural o limite temporal indicado pelo hebraico.
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: o coração dele se encha de mim
  rationale: Mantém a imagem literal do coração cheio da Sabedoria personificada, sem substituir a ambiguidade hebraica por uma interpretação como “confiar em mim”.
- source_word: אָשׁוּב
  choice: voltarei
  rationale: Traduz diretamente o sentido comum de שוב, indicando que a Sabedoria volta a agir favoravelmente para com o discípulo.
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: o farei feliz
  rationale: Expressa de maneira clara e atual o sentido de fazer feliz ou declarar feliz, sem impor ao termo um peso teológico maior que o contexto exige.
- source_word: וְגָלִיתִי לוֹ
  choice: lhe revelarei
  rationale: Formulação portuguesa natural para o ato de descobrir ou revelar algo a alguém.
- source_word: מִסְתָּרִי
  choice: os meus segredos
  rationale: Comunica claramente as coisas ocultas pertencentes à Sabedoria; evita o tom técnico que “mistério” poderia adquirir.
theological_decisions:
- issue: Relação entre a linha hebraica e o paralelo grego mais extenso, que inclui temor, prova e confiança
  choice: Traduzir no texto principal o hebraico preservado, deixando a leitura grega mais extensa em nota.
  alternative: Incorporar ao versículo as referências gregas à confiança e às provas impostas pela Sabedoria.
  rationale: O hebraico existente deve reger o texto principal. O grego esclarece o contexto mais amplo, mas suas orações adicionais não devem ser inseridas silenciosamente na tradução do testemunho hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla compreensão e boa legibilidade brasileira. A personificação da Sabedoria e a imagem concreta do coração cheio dela foram preservadas.
