base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/012.yaml
  text: Those who love her love life[a], and those who seek her will obtain favor from Yahweh.
translation:
  language: pt
  text: Os que a amam amam a vida, e os que a buscam obterão o favor do SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “os que madrugam para buscá-la ficarão cheios de alegria”.'
    reason: Leitura alternativa da segunda oração preservada na tradição grega.
lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: os que a amam
  rationale: O particípio ativo com sufixo feminino singular refere-se à sabedoria no contexto; a forma substantivada plural soa natural em português.
- source_word: אָהֲבוּ חַיִּים
  choice: amam a vida
  rationale: Embora a forma hebraica seja formalmente perfeita, a frase tem valor proverbial geral. O presente comunica esse sentido gnômico em português, em concordância com o paralelo grego.
- source_word: וּמְבַקְשֶׁיהָ
  choice: os que a buscam
  rationale: בקש significa buscar ou procurar. Não se acrescentou um intensificador ausente do texto hebraico; a ideia de buscar cedo pertence à forma divergente do paralelo grego.
- source_word: יָפִיקוּ
  choice: obterão
  rationale: Neste contexto, o verbo הפיק expressa alcançar ou obter algo para si; “obterão” é claro e idiomático.
- source_word: רָצוֹן
  choice: favor
  rationale: Com a preposição מן e o nome divino, denota acolhimento favorável, benevolência ou aceitação concedida por Deus.
- source_word: מֵיהֹוָה
  choice: de Javé
  rationale: A preposição indica a origem do favor, e “Javé” é a forma portuguesa corrente do nome divino יהוה.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na segunda oração
  choice: 'Seguir o hebraico preservado: “os que a buscam obterão o favor de Javé”'
  alternative: 'O paralelo grego diz: “os que madrugam para buscá-la ficarão cheios de alegria”'
  rationale: O testemunho hebraico é extante, claro e de alta confiança, por isso governa o texto principal. A leitura grega, que traz tanto a busca matutina quanto uma promessa diferente, é preservada em nota para transparência.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial direta. O pronome feminino “a” mantém a referência contextual à sabedoria. Evitou-se acrescentar “diligentemente”, pois esse matiz não está expresso no hebraico.
