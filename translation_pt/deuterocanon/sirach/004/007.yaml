  text: Incline your ear to the poor[a], and answer him peacefully with humility.
translation:
  language: pt
  text: Incline o ouvido ao pobre[a] e responda-lhe em paz, com humildade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “Faça-se estimado pela assembleia e incline a cabeça diante de um homem importante.” Ele reflete uma forma textual substancialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט ... אָזְנֶךָ
  choice: Incline o ouvido
  rationale: Mantém a imagem hebraica de voltar ou inclinar o ouvido para alguém, uma expressão clara de escuta atenta em português.
- source_word: לֶעָנִי
  choice: ao pobre
  rationale: עָנִי pode designar o pobre, aflito ou socialmente vulnerável; “o pobre” é a tradução mais direta e adequada ao contexto ético.
- source_word: וַהֲשִׁיבֵהוּ
  choice: e responda-lhe
  rationale: No contexto de ouvir e falar, o hifil de שוב tem o sentido de responder; a forma com pronome preserva o objeto masculino singular.
- source_word: שָׁלוֹם
  choice: em paz
  rationale: O substantivo funciona adverbialmente e descreve uma resposta pacífica. “Em paz” conserva a ligação lexical com paz sem reduzir o termo apenas a gentileza.
- source_word: בַּעֲנָוָה
  choice: com humildade
  rationale: ענוה expressa humildade ou mansidão; “com humildade” é natural, atual e mantém a postura moral ordenada.
theological_decisions:
- issue: Primazia do hebraico preservado diante de uma forma grega substancialmente diferente
  choice: Traduzir diretamente o texto hebraico e registrar a forma grega em nota.
  alternative: 'Seguir o grego: “Faça-se estimado pela assembleia e incline a cabeça diante de um homem importante.”'
  rationale: Como o texto hebraico de Sirácida está preservado neste versículo, ele serve de base. A divergência grega não é harmonizada nem omitida, mas apresentada ao leitor como leitura alternativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção imperativa na forma de tratamento por “você” implícito. A expressão “incline o ouvido” preserva a imagem hebraica sem soar obscura; “em paz, com humildade” mantém distintos os dois complementos de modo.
