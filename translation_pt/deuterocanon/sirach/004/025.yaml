  text: Do not resist God, but humble yourself before God.
translation:
  language: pt
  text: Não resista a Deus, mas humilhe-se diante de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não contradiga a verdade e envergonhe-se da sua falta de instrução.” O testemunho hebraico, porém, diz: “Não resista a Deus, mas humilhe-se diante de Deus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: Não resista
  rationale: O verbo hebraico expressa recusa ou oposição. “Não resista” comunica com clareza essa postura e forma um contraste natural com “humilhe-se”.
- source_word: עִם הָאֵל
  choice: a Deus
  rationale: אֵל é um título divino comum, vertido naturalmente por “Deus”. A preposição עִם é incorporada de modo idiomático à regência portuguesa de “resistir”.
- source_word: וְאֶל אֱלֹהִים
  choice: diante de Deus
  rationale: Embora אֶל signifique literalmente “a/para”, com o verbo seguinte a expressão portuguesa “diante de Deus” transmite de modo natural a postura relacional indicada pelo hebraico.
- source_word: הִכָּנֵעַ
  choice: humilhe-se
  rationale: A forma hebraica indica tornar-se humilde, submeter-se ou ceder. “Humilhe-se” preserva a força reflexiva da ordem e contrasta adequadamente com resistir.
theological_decisions:
- issue: Divergência entre o testemunho hebraico preservado e o paralelo grego
  choice: 'Seguir o hebraico no texto principal: “Não resista a Deus, mas humilhe-se diante de Deus.”'
  alternative: “Não contradiga a verdade e envergonhe-se da sua falta de instrução.”
  rationale: O testemunho hebraico existente é a fonte principal para o texto de Sirácida neste ponto. Como o grego apresenta uma leitura substancialmente diferente, ela é preservada em nota sem substituir nem harmonizar silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta e paralelismo preservado. A repetição de “Deus” acompanha o hebraico e evita tornar implícito o segundo referente.
