base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/028.yaml
  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: pt
  text: Não se sente com um juiz injusto[a], pois, ao lado dele, você julgará conforme a vontade dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Lute pela verdade até a morte, e o Senhor Deus lutará por você.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: Não se sente
  rationale: Mantém a imagem concreta de “sentar-se” e, no contexto, comunica a ideia de tomar assento ou associar-se a alguém no exercício do juízo.
- source_word: שׁוֹפֵט עַוָּל
  choice: um juiz injusto
  rationale: “Juiz” expressa diretamente quem profere decisões, e “injusto” traduz a perversidade especificamente no contexto judicial.
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: conforme a vontade dele
  rationale: Reproduz a ideia de que o julgamento será dirigido pelo desejo pessoal do juiz, e não pela justiça.
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: ao lado dele, você julgará
  rationale: A forma verbal hebraica é de segunda pessoa singular, “você julgará”. A formulação portuguesa preserva essa responsabilidade pessoal e torna natural o sentido de participação no julgamento.
theological_decisions:
- issue: Base textual quando o hebraico e o grego divergem substancialmente
  choice: Traduzir o testemunho hebraico existente no texto principal e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Lute pela verdade até a morte, e o Senhor Deus lutará por você.”'
  rationale: O hebraico preservado tem prioridade como fonte principal. A leitura grega representa uma tradição textual muito diferente e, por alterar completamente o sentido do versículo, deve ser apresentada com transparência em nota.
- issue: Agência na segunda oração
  choice: 'Preservar a segunda pessoa explícita: “você julgará”.'
  alternative: 'Impersonalizar a frase: “o julgamento será conforme a vontade dele”.'
  rationale: O hebraico תִּשְׁפּוֹט é morfologicamente uma forma de segunda pessoa singular. Mantê-la conserva a advertência sobre a possível cumplicidade do destinatário com o juiz injusto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não se sente” conserva a metáfora hebraica sem soar excessivamente literal; “você” torna explícita a segunda pessoa já presente no verbo hebraico.
