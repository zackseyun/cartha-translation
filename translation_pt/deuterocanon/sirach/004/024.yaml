  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: pt
  text: Pois a sabedoria se dá a conhecer na fala, e o entendimento, na resposta da língua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e a instrução, numa palavra da língua”. O testemunho hebraico diz: “e o entendimento, na resposta da língua”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: no falar
  rationale: O substantivo ligado a אמר designa fala ou enunciação. “No falar” é natural em português, preserva a ideia de expressão verbal e não restringe o sentido a um provérbio específico.
- source_word: נוֹדַעַת
  choice: se dá a conhecer
  rationale: O nifal de ידע admite sentido passivo ou reflexivo. “Se dá a conhecer” conserva esse valor verbal e expressa que a sabedoria se torna reconhecível por meio da fala.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e preciso para חכמה neste contexto sapiencial.
- source_word: וּתְבוּנָה
  choice: e o entendimento
  rationale: תבונה indica entendimento, discernimento ou percepção. “Entendimento” mantém o paralelismo claro com “sabedoria” sem estreitar o campo semântico.
- source_word: בְּמַעֲנֵה
  choice: na resposta
  rationale: מענה significa resposta ou réplica. “Na resposta” segue de perto a forma nominal concreta do hebraico e mantém a correspondência estrutural entre os dois membros do verso.
- source_word: לָשׁוֹן
  choice: da língua
  rationale: A tradução literal preserva a metáfora corporal do hebraico, também refletida no paralelo grego, em vez de reduzi-la simplesmente a “fala” ou “linguagem”.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro
  choice: 'Seguir o hebraico preservado: “o entendimento, na resposta da língua”'
  alternative: 'Leitura grega: “a instrução, numa palavra da língua”'
  rationale: Como o testemunho hebraico deste versículo é preservado, validado e de alta confiança, ele rege o texto principal. A variante grega é registrada em nota para manter transparente a diferença textual, sem harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A elipse do verbo no segundo membro reproduz naturalmente o paralelismo hebraico; “resposta da língua” conserva deliberadamente a imagem concreta do original.
