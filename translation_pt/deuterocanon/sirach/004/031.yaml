  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: pt
  text: Não seja arrogante ao falar[a], nem descuidado e negligente em seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma forma diferente do provérbio: “Não deixe sua mão estendida para receber e retraída ao retribuir.”'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: arrogante
  rationale: O adjetivo expressa altivez ou soberba. “Arrogante” é corrente, claro e preserva a força da censura.
- source_word: בִּלְשׁוֹנֶךָ
  choice: no falar
  rationale: Embora a expressão seja literalmente “na sua língua”, aqui se refere à maneira de falar; “no falar” é natural em português e mantém concisão proverbial.
- source_word: רָפוּי
  choice: relaxado
  rationale: O termo sugere frouxidão, falta de firmeza ou de empenho. “Relaxado” comunica falta de diligência no trabalho sem introduzir a ideia mais específica de ociosidade.
- source_word: רָשִׁישׁ
  choice: negligente
  rationale: A palavra rara funciona como censura paralela a רָפוּי. “Negligente” preserva o segundo qualificativo e destaca o descuido no cumprimento do trabalho.
- source_word: בִּמְלַאכְתֶּךָ
  choice: no seu trabalho
  rationale: O substantivo abrange trabalho, ocupação ou tarefa. “Trabalho” é o equivalente moderno mais amplo e claro.
- source_word: μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν, καὶ ἐν τῷ ἀποδιδόναι συνεσταλμένη
  choice: usado como testemunho paralelo secundário, não como texto-base
  rationale: O grego apresenta uma máxima substancialmente diferente. Como o hebraico está preservado com alta confiança, ele rege o texto principal, enquanto a forma grega é registrada em nota.
theological_decisions:
- issue: Divergência entre as formas hebraica e grega de Sirácida 4:31
  choice: Traduzir o hebraico preservado no texto principal
  alternative: 'Traduzir a forma grega: “Não deixe sua mão estendida para receber e recolhida na hora de devolver.”'
  rationale: O testemunho hebraico está disponível e tem alta confiança. A forma grega não deve ser harmonizada com ele, pois constitui uma máxima materialmente diferente; por isso, é preservada de modo transparente em nota.
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve de máxima sapiencial. “No falar” evita o literalismo pouco natural de “na sua língua”; a dupla “relaxado e negligente” preserva os dois termos hebraicos próximos sem fundi-los.
