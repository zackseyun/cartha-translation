  rationale: A revisão substitui um calque pouco idiomático por “julgará com retidão”, mantendo o sentido adverbial de אמת (“verdadeiramente/corretamente”) e a prioridade do hebraico. Também ajusta a posição da nota cultural e torna a redação da leitura grega mais natural. A solução interpretativa “em segurança” é mantida, pois o hebraico final é difícil e o paralelo grego a sustenta, com a incerteza documentada na nota.
