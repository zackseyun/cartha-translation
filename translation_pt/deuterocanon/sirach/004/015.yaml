base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/015.yaml
  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: pt
  text: Quem me escuta julgará com retidão[a], e quem me dá ouvidos habitará em segurança nos meus aposentos interiores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Quem lhe obedece julgará nações, e quem se aproxima dela acampará em segurança”. O testemunho hebraico difere consideravelmente nas duas orações; o texto principal segue o hebraico preservado, recorrendo ao grego para esclarecer a difícil expressão final.'
    reason: alternative_reading
  - marker: b
    text: “Meus aposentos interiores” dá continuidade à personificação da Sabedoria como uma mulher que acolhe quem lhe dá ouvidos no espaço íntimo de sua casa.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: Quem me escuta
  rationale: שמע pode indicar ouvir, escutar ou obedecer. “Escuta” conserva a imagem auditiva e admite a ideia de resposta obediente, em consonância com o paralelo grego.
- source_word: יִשׁפֹּט אֱמֶת
  choice: julgará com verdade
  rationale: O hebraico diz literalmente “julgará verdade”. A formulação portuguesa preserva אֱמֶת e comunica um julgamento verdadeiro ou justo sem adotar o objeto diferente do grego, “nações”.
- source_word: וּמַאֲזִין לִי
  choice: e quem me dá ouvidos
  rationale: מאזין salienta atenção auditiva. “Dá ouvidos” mantém o paralelismo sem reproduzir exatamente o verbo da primeira oração.
- source_word: יִיחַן
  choice: habitará
  rationale: A forma difícil aponta para acampar, alojar-se ou habitar; o grego κατασκηνώσει confirma a imagem de residência. “Habitará” é natural e digna em português.
- source_word: בַּחֲדָרַי
  choice: nos meus aposentos interiores
  rationale: חדרים designa quartos ou câmaras interiores. A tradução conserva a metáfora doméstica da Sabedoria personificada como mulher que acolhe em sua casa.
- source_word: מִבָּיִת
  choice: em segurança
  rationale: A expressão hebraica é sintaticamente difícil e não produz aqui um sentido claro se vertida literalmente como “da casa”. O grego πεποιθώς indica confiança ou segurança e ajuda a esclarecer a ideia geral de habitação segura.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na primeira oração
  choice: Seguir no texto principal o hebraico “julgará com verdade”
  alternative: 'Grego: “julgará nações”'
  rationale: Como há testemunho hebraico preservado, ele permanece primário. A diferença substancial do grego é registrada em nota, sem substituir silenciosamente a leitura hebraica.
- issue: Sentido da difícil expressão final מִבָּיִת
  choice: Expressar habitação segura nos aposentos da Sabedoria
  alternative: 'Tradução literal e obscura: “habitará nos meus aposentos, da casa”; formulação mais grega: “acampará confiante”'
  rationale: O fim da frase hebraica é difícil e apresenta pequena discrepância textual. O paralelo grego esclarece o sentido provável de confiança ou segurança, enquanto a tradução mantém a imagem hebraica dos aposentos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Com verdade” conserva de modo natural a tensão da expressão hebraica; “aposentos interiores” mantém a personificação e a imagem doméstica. Os marcadores foram posicionados junto às afirmações que explicam.
