  terminology: “Escuta”, “dá ouvidos”, “habitará” e “aposentos interiores” mantêm bem o registro sapiencial e a personificação feminina da Sabedoria. “Com retidão” é uma solução portuguesa natural e semanticamente apropriada para o juízo conforme a verdade.
