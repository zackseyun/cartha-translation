  text: Do not show partiality against yourself[a], and do not stumble to your own downfall.
translation:
  language: pt
  text: Não mostre parcialidade contra si mesmo e não tropece por causa de seus próprios tropeços.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico transmitido pode ser traduzido mais literalmente: “e não tropece em teus tropeços”. O grego lê: “e não se envergonhe em sua queda”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: Não seja parcial
  rationale: A expressão hebraica נשא פנים significa literalmente “levantar o rosto”, mas funciona idiomaticamente como “mostrar parcialidade” ou “favorecer”. A formulação escolhida comunica esse sentido ético em português atual.
- source_word: עַל נַפְשֶׁךָ
  choice: contra você mesmo
  rationale: נפשך refere-se aqui à própria pessoa, e על tem sentido adversativo, confirmado pelo grego κατὰ τῆς ψυχῆς σου. A tradução mantém o paradoxo intencional de alguém agir com parcialidade contra si mesmo.
- source_word: וְאַל תִּכָּשֵׁל
  choice: e não tropece
  rationale: O hebraico deriva de כשל, “tropeçar, vacilar, cair”. A tradução segue o texto hebraico transmitido, sem substituí-lo pela leitura grega ligada à vergonha.
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: nos seus próprios obstáculos
  rationale: מכשול pode designar obstáculo, pedra de tropeço ou causa de queda. A expressão portuguesa preserva tanto a imagem concreta do tropeço quanto sua aplicação figurada; “próprios” explicita naturalmente o sufixo possessivo.
