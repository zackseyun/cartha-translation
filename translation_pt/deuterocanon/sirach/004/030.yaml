translation:
  language: pt
  text: Não seja chamado de pessoa de língua dupla[a][b], nem acostume sua língua a isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «possuidor de duas [coisas]», provavelmente uma expressão idiomática para fala dividida ou enganosa; daí «pessoa de língua dupla».'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo diz: «Não seja como um leão em sua casa, nem seja fantasioso entre os seus servos». Essa leitura difere muito do hebraico preservado e provavelmente reflete outra forma textual ou uma tradição interpretativa distinta.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: Não seja chamado
  rationale: Preserva o valor proibitivo de אַל e a voz passiva do nifal תִּקָּרֵא, em linguagem clara e própria da instrução sapiencial.
- source_word: בַּעַל שְׁתַּיִם
  choice: pessoa de língua dupla
  rationale: O hebraico diz literalmente «possuidor de duas [coisas]»; a menção imediata da língua indica fala dividida ou enganosa. «Pessoa de língua dupla» conserva a imagem e evita ampliar o sentido para toda forma de falsidade.
- source_word: לְשׁוֹנְךָ
  choice: sua língua
  rationale: Mantém a imagem hebraica da língua como instrumento da fala e soa natural em português.
- source_word: וְאֶל ... אַל תַּרְגֵּל
  choice: nem habitue ... a isso
  rationale: O verbo expressa acostumar ou criar um hábito. «A isso» retoma a fala de língua dupla e torna explícita em português a referência elíptica do hebraico.
