  text: Contend for righteousness until death[b][a], and Yahweh will fight for you.
translation:
  language: pt
  text: Lute pela retidão até a morte[a][b], e Yahweh lutará por você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lute pela justiça até a morte.” O hebraico צֶדֶק pode significar tanto “retidão” como “justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego preserva aqui uma frase diferente: “Não seja áspero no falar, nem preguiçoso e negligente em suas obras.” O texto principal segue o testemunho hebraico da Geniza do Cairo.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: até a morte
  rationale: Expressa de modo conciso o limite extremo da perseverança exigida pelo hebraico, sem explicitar além do texto se se trata de morrer pela causa.
- source_word: הִנָּצֵה
  choice: Lute
  rationale: O imperativo reflexivo transmite a ideia de entrar em luta ou contenda. “Lute” é claro em português e preserva a correspondência verbal com a ação de Yahweh na segunda oração.
- source_word: עַל הַצֶּדֶק
  choice: pela retidão
  rationale: צֶדֶק abrange retidão moral e justiça. “Retidão” preserva aqui o sentido ético amplo, enquanto a alternativa relevante “justiça” é registrada em nota.
- source_word: וַיהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo Tetragrama no texto hebraico.
- source_word: נִלְחָם לָךְ
  choice: lutará por você
  rationale: Embora נִלְחָם tenha forma participial, depois do imperativo a relação resultante é naturalmente expressa pelo futuro em português. A formulação mantém a imagem de combate e o paralelismo verbal.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o nome divino; “Yahweh” o preserva como nome próprio, sem substituí-lo por um título.
- issue: Sentido de צֶדֶק
  choice: retidão
  alternative: justiça
  rationale: O contexto sapiencial admite uma referência ampla ao que é moralmente reto, mas o termo também pode designar justiça; a nota mantém essa ambiguidade lexical significativa.
- issue: Relação temporal de נִלְחָם com o imperativo
  choice: lutará por você
  alternative: luta por você
  rationale: O futuro comunica naturalmente a promessa ou consequência ligada à exortação, sem transformar a afirmação em uma condição formal ausente do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “você” para interlocução singular amplamente compreensível. A repetição “Lute... lutará” preserva o paralelismo e a imagem do hebraico. As notas distinguem a ambiguidade semântica real de צֶדֶק e a importante divergência da tradição grega.
