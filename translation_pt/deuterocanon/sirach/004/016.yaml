  source_fidelity: O texto principal segue legitimamente o testemunho grego adotado na trilha de auditoria. Contudo, o grego fornecido alterna da segunda pessoa do singular (ἐμπιστεύσῃς; κατακληρονομήσεις) para «dele» (αὐτοῦ). A uniformização para a terceira pessoa no rascunho elimina essa dificuldade textual e não deve ser feita sem nota.
  naturalness: A redação proposta é clara e natural em português moderno. «Tu a herdarás» preserva a segunda pessoa do grego sem ser arcaico; «os descendentes dele» deixa explícito o referente gramatical de αὐτοῦ.
  terminology: «Herdar» mantém adequadamente a imagem de herança, e o feminino em «nela»/«a» conserva a personificação da Sabedoria. A nota traduz o hebraico divergente de modo mais direto, sem alegar certeza além do que o testemunho permite.
  issues:
