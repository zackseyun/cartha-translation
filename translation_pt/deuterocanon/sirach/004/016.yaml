  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: pt
  text: Se confiares nela, tu a herdarás, e os descendentes dele a possuirão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado aqui diz aproximadamente: “Pois andarei com ele de modo estranho e, no início, o provarei com provações.” Essa redação se aproxima mais do contexto anterior, no qual a Sabedoria põe o discípulo à prova. O testemunho grego, seguido no texto principal, diz: “Se confiares nela, tu a herdarás, e os descendentes dele a possuirão.” O grego alterna da segunda pessoa para «dele» na última cláusula.'
    reason: Leitura alternativa decorrente de divergência entre os testemunhos hebraico e grego; a nota também assinala a alternância de pessoa no grego.
lexical_decisions:
- source_word: ἐὰν ἐμπιστεύσῃς
  choice: Se ele confiar nela
  rationale: O grego fornecido expressa uma condição baseada em confiar; o referente feminino é a Sabedoria personificada. Embora as formas gregas apresentadas estejam na segunda pessoa do singular, a continuação usa a terceira pessoa, e a redação em terceira pessoa acompanha o contexto e evita uma mudança pronominal obscura.
- source_word: κατακληρονομήσεις αὐτήν
  choice: irá herdá-la
  rationale: Mantém a linguagem de herança e o pronome feminino referente à Sabedoria, em português natural.
- source_word: ἐν κατασχέσει ἔσονται
  choice: a possuirão
  rationale: Expressa posse duradoura de modo conciso e preserva a ligação com a herança.
- source_word: αἱ γενεαὶ αὐτοῦ
  choice: seus descendentes
  rationale: Comunica naturalmente a ideia das gerações provenientes dele, sem o sentido ambíguo que “suas gerações” teria em português.
- source_word: כִּי בְהִתְנַכֵּר אֵלֵךְ עִמּוֹ, וּלְפָנִים אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: preservado em nota como testemunho hebraico divergente
  rationale: O hebraico extante parece corresponder melhor ao tema do versículo anterior, no qual a Sabedoria põe o discípulo à prova, enquanto o paralelo grego oferece uma sequência coerente para este versículo.
theological_decisions:
- issue: Escolha do texto-base diante da divergência material entre o hebraico e o grego
  choice: Seguir o paralelo grego no texto principal e registrar o hebraico extante em nota.
  alternative: “Pois agirei como estranha ao andar com ele e, de início, eu o provarei com provações.”
  rationale: O testemunho hebraico parece deslocado em relação à divisão deste versículo e retoma a ideia anterior de prova. O grego fornece uma leitura coerente sobre confiar na Sabedoria e recebê-la como herança. A nota evita ocultar a divergência textual.
- issue: Alternância de pessoa gramatical no texto grego fornecido
  choice: Empregar a terceira pessoa de modo uniforme.
  alternative: “Se confiares nela, tu a herdarás, e os descendentes dele a possuirão.”
  rationale: As duas primeiras formas gregas fornecidas são de segunda pessoa, mas αὐτοῦ é de terceira pessoa. A uniformização em terceira pessoa, apoiada pelo contexto e pela tradição textual refletida na camada auditada, produz português inteligível sem transformar a oscilação em afirmação teológica; a questão textual permanece documentada nas decisões.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Irá herdá-la” preserva a metáfora de herança sem soar excessivamente literal; “descendentes” é preferido a “gerações” por clareza.
