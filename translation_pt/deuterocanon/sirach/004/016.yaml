    issue: Uniformização indevida da pessoa gramatical do grego
    rationale: O rascunho verte tanto a condição quanto a herança em terceira pessoa («Se ele confiar... irá herdá-la»), embora o texto grego apresentado tenha verbos de segunda pessoa. A alteração também oculta o «dele» na cláusula final, que é uma dificuldade real do testemunho e deve ser preservada ou assinalada.
  - severity: low
    issue: Formulação pouco precisa da nota hebraica
    rationale: «Agirei como estranha ao andar com ele» é menos direta e menos idiomática do que uma tradução que preserve a ideia de a Sabedoria caminhar com ele de modo estranho/disfarçado. A nota pode registrar a divergência sem resolver de forma excessiva o sentido do hebraico.
