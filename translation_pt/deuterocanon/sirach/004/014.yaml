  text: Those who minister to her minister to the Holy One[a], and God loves those who love her dwelling.
translation:
  language: pt
  text: Os que a servem servem ao Santo[a], e Deus ama os que amam a morada dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego: «e o Senhor ama os que a amam». O hebraico parece preservar aqui uma leitura mais difícil que envolve a morada dela.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: os que a servem / servem
  rationale: O verbo שרת indica serviço ou assistência, muitas vezes em contexto sagrado ou oficial. A repetição de «servem» conserva o paralelismo conciso do hebraico e soa natural em português.
- source_word: קֹדֶשׁ
  choice: o Santo
  rationale: A expressão hebraica é breve e elíptica. À luz do paralelo grego ἁγίῳ, «o Santo» comunica a referência sagrada pessoal sem transformar o termo em uma abstração, embora a formulação hebraica permaneça comprimida.
- source_word: וֵאלֹהִים
  choice: e Deus
  rationale: O testemunho hebraico traz explicitamente אֱלֹהִים. Por isso, «Deus» tem prioridade sobre «o Senhor», leitura encontrada no grego.
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: ama os que amam a morada dela
  rationale: A leitura hebraica transmitida parece conter linguagem de casa ou morada, embora seja textualmente difícil e parcialmente incerta. A tradução mantém essa leitura mais difícil de modo compreensível, enquanto a variante grega mais simples é registrada em nota.
- source_word: אָהֵב
  choice: ama
  rationale: É a equivalência corrente de אהב e preserva a repetição retórica do amor no segundo membro.
theological_decisions:
- issue: Título divino no segundo membro
  choice: Deus
  alternative: o Senhor
  rationale: O texto hebraico primário lê אֱלֹהִים, enquanto o paralelo grego traz ὁ κύριος. A tradução segue o hebraico e registra a forma grega na nota.
- issue: Objeto do amor divino no segundo membro
  choice: os que amam a morada dela
  alternative: os que a amam
  rationale: O hebraico parece preservar uma leitura mais difícil envolvendo a morada dela; o grego apresenta a leitura mais simples «os que a amam». A redação principal conserva a evidência hebraica sem ocultar a alternativa antiga.
- issue: Referente de קֹדֶשׁ
  choice: o Santo
  alternative: a santidade / o santuário
  rationale: O hebraico é elíptico e permite alguma tensão quanto ao referente. «O Santo» é favorecido pelo paralelo grego e pelo contexto de serviço sagrado, mas não elimina a dificuldade lexical do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição «servem» reproduz deliberadamente o paralelismo do original. O pronome «dela» mantém clara a referência à Sabedoria personificada.
