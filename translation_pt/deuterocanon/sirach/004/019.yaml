  text: If he turns away from me[a], I will cast him off and hand him over to plunderers.
translation:
  language: pt
  text: Se ele deixar de me seguir, eu o rejeitarei e o entregarei aos saqueadores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: «o abandonará e o entregará nas mãos de sua queda», talvez refletindo outra leitura subjacente ou uma tradução interpretativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר מֵאַחֲרַי
  choice: deixar de me seguir
  rationale: A expressão significa literalmente afastar-se de trás de alguém e, neste contexto, abandonar o seguimento. A formulação portuguesa torna explícito o valor idiomático sem acrescentar a ideia mais forte de apostasia.
- source_word: אַשׁלִיכֶנּוּ
  choice: eu o rejeitarei
  rationale: O verbo significa literalmente lançar ou jogar. Aqui comunica que a Sabedoria afasta e abandona quem deixa de segui-la; «rejeitarei» preserva essa força relacional em português natural, embora torne menos concreta a imagem hebraica.
- source_word: וְאַסְגִּירֶנּוּ
  choice: e o entregarei
  rationale: Na forma causativa, סגר indica entregar alguém ao poder de outros. «Entregarei» é direto, atual e conserva a nuance de abandono à autoridade ou ação alheia.
- source_word: לַשֹׁדְדִים
  choice: aos saqueadores
  rationale: O substantivo hebraico designa saqueadores ou invasores que despojam. «Saqueadores» corresponde diretamente ao testemunho hebraico e mantém a imagem concreta.
theological_decisions:
- issue: Divergência entre o texto hebraico e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: «aos saqueadores».'
  alternative: «nas mãos de sua queda» ou «à sua ruína»
  rationale: O hebraico preservado e validado lê לַשֹׁדְדִים, «aos saqueadores». O grego apresenta «nas mãos de sua queda», talvez por refletir outra leitura subjacente ou uma interpretação. Como o hebraico é a fonte primária extante neste versículo, ele rege o texto principal; a divergência grega é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Deixar de me seguir» comunica naturalmente o idioma hebraico; «saqueadores» preserva a imagem concreta do texto-fonte.
