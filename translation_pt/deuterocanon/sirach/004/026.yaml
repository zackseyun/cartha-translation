base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/026.yaml
  text: Do not be ashamed to turn back from iniquity, and do not stand before the current of a river.
translation:
  language: pt
  text: Não se envergonhe de abandonar a iniquidade e não fique diante da correnteza de um rio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Não se envergonhe de confessar os seus pecados e não force a correnteza de um rio.” O hebraico e o grego diferem na primeira oração e, em menor medida, na segunda; o texto segue o hebraico preservado, recorrendo ao grego para esclarecer a imagem da correnteza.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: Não se envergonhe
  rationale: Expressa diretamente a proibição ligada a בוש e soa natural no português atual.
- source_word: לָשׁוּב מֵעָוֹן
  choice: de voltar atrás, afastando-se da iniquidade
  rationale: Preserva a imagem concreta de שוב, «voltar», e a relação com aquilo de que a pessoa se afasta, sem substituir o hebraico pelo termo teológico mais técnico «arrepender-se».
- source_word: וְאַל תַּעֲמוֹד לִפְנֵי
  choice: e não fique diante
  rationale: Traduz עמד e לפני de modo claro e idiomático, mantendo a imagem de alguém que permanece diante de uma força perigosa.
- source_word: שִׁבֹּלֶת
  choice: da correnteza de um rio
  rationale: Neste contexto, שִׁבֹּלֶת indica uma corrente ou fluxo; o paralelo grego, ῥοῦν ποταμοῦ, confirma a imagem fluvial. «Correnteza» comunica essa força com clareza em português.
theological_decisions:
- issue: Se שוב deve ser traduzido por um termo penitencial explícito
  choice: voltar atrás, afastando-se da iniquidade
  alternative: arrepender-se do pecado
  rationale: O hebraico descreve uma mudança de direção moral, enquanto o grego fala em confessar pecados. A redação escolhida conserva a imagem hebraica e não transforma a frase em fórmula penitencial técnica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Iniquidade» mantém o peso moral de עָוֹן; a construção explicativa evita que «voltar atrás» seja entendido como recuar da decisão correta.
