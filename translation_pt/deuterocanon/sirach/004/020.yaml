  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: pt
  text: Meu filho, observe o tempo oportuno[a] e proteja-se do mal[b]; não se envergonhe a respeito de si mesmo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico transmitido é difícil, pois inclui הָמוֹן, palavra que normalmente significa “multidão”, “riqueza” ou “tumulto”. O paralelo grego diz simplesmente “observe o tempo oportuno”, sentido seguido aqui.
    reason: textual_variant
  - marker: b
    text: 'Ou: “tema o mal” ou “guarde-se do mal”. O hebraico é incomum nesta construção; o grego traz claramente “proteja-se do mal”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não se envergonhe a respeito de sua própria vida” ou “a respeito de sua própria alma”. Tanto o hebraico נֶפֶשׁ como o grego ψυχή podem significar “vida”, “pessoa” ou “alma”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Reproduz a forma masculina singular de tratamento e o registro tradicional da instrução sapiencial.
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: observe o tempo oportuno
  rationale: O hebraico transmitido é difícil por causa de הָמוֹן. A tradução segue o sentido coerente confirmado pelo grego Συντήρησον καιρὸν, preservando a incerteza textual em nota.
- source_word: וּפְחַד מִרָע
  choice: proteja-se do mal
  rationale: Embora o hebraico vocalizado possa sugerir literalmente 'tema o mal', a construção é incomum; o paralelo grego φύλαξαι ἀπὸ πονηροῦ apoia claramente a ideia de guardar-se ou proteger-se do mal.
- source_word: וְאֶל נַפְשְׁךָ אַל תֵּבוֹשׁ
  choice: não se envergonhe por causa de sua própria vida
  rationale: נֶפֶשׁ pode designar vida, pessoa ou alma. 'Vida' produz uma formulação natural em português sem impor uma antropologia dicotômica; as demais possibilidades são registradas em nota.
theological_decisions:
- issue: Nuance antropológica de נֶפֶשׁ / ψυχή
  choice: sua própria vida
  alternative: si mesmo; sua própria alma
  rationale: O termo admite 'vida', 'pessoa' e 'alma'. O contexto não exige uma doutrina específica sobre a composição humana; por isso, a tradução usa 'vida' e mantém as alternativas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada com ponto e vírgula para evitar uma sequência pesada de coordenações. As notas preservam tanto a dificuldade textual quanto a amplitude semântica.
