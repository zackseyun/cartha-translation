base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/021.yaml
  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
translation:
  language: pt
  text: Pois há uma vergonha que traz culpa[a], e há uma vergonha que é honra e favor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que carrega iniquidade”. Seguindo mais de perto o grego: “que leva ao pecado”. A expressão hebraica é condensada e admite essas nuances.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “glória e graça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: vergonha
  rationale: Preserva o peso moral e social do hebraico e corresponde naturalmente ao grego αἰσχύνη; “constrangimento” seria fraco demais.
- source_word: מַשְׂאֵת עָוֹן
  choice: traz culpa
  rationale: A expressão hebraica é condensada e difícil. “Traz culpa” comunica de modo natural o resultado moral negativo, mantendo o hebraico como testemunho principal e considerando o paralelo grego, que sugere causar ou conduzir ao pecado.
- source_word: עָוֹן
  choice: culpa
  rationale: Neste contexto, o termo pode indicar a iniquidade ou a culpa dela resultante. “Culpa” expressa bem o sentido resultativo sem excluir a dimensão moral.
- source_word: כָּבוֹד
  choice: honra
  rationale: Embora também possa significar “glória”, “honra” forma em português um contraste social e moral mais natural com “vergonha”.
- source_word: חֵן
  choice: favor
  rationale: Expressa aprovação e boa acolhida sem impor ao termo uma carga teológica posterior; corresponde ao campo semântico de graça, favor e aceitação.
theological_decisions:
- issue: Sentido da expressão hebraica difícil מַשְׂאֵת עָוֹן
  choice: Uma espécie de vergonha traz culpa.
  alternative: 'Uma espécie de vergonha leva ao pecado; ou: uma vergonha que carrega iniquidade.'
  rationale: O hebraico permite uma formulação ligada a carregar culpa ou iniquidade, enquanto o paralelo grego explicita uma consequência negativa, “trazendo pecado”. A tradução comunica o resultado moral sem resolver excessivamente a ambiguidade, que é registrada em nota.
- issue: Contraste entre vergonha negativa e vergonha digna
  choice: A segunda vergonha é caracterizada como honra e favor.
  alternative: A segunda vergonha é glória e graça.
  rationale: O verso distingue a vergonha que compromete moralmente daquela que é honrosa, sem definir aqui as circunstâncias específicas. “Honra e favor” preserva esse contraste sem acrescentar uma interpretação confessional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Pois” preserva a ligação explicativa; “vergonha” é repetida para manter o paralelismo do original.
