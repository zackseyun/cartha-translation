base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/008.yaml
  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: pt
  text: Resgate o oprimido de seus opressores[a] e não deixe que seu espírito se impaciente ao julgar com justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Incline o ouvido ao pobre e responda-lhe pacificamente, com mansidão.” O testemunho hebraico, seguido aqui, fala em resgatar o oprimido e não se impacientar ao julgar com justiça.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: Resgate
  rationale: O imperativo de ישׁע exige intervenção ativa. “Resgate” comunica urgência no contexto de injustiça social sem a possível carga teológica de “salve”.
- source_word: מוּצָק
  choice: o oprimido
  rationale: A forma passiva designa quem está sujeito a pressão ou maus-tratos; “o oprimido” é natural e adequado ao contexto ético e judicial.
- source_word: מִמְּצִיקָיו
  choice: das mãos de seus opressores
  rationale: A expressão explicita de modo idiomático a libertação do poder dos agentes da opressão, preservando a relação lexical com “oprimido”.
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: e não deixe que seu espírito se impaciente
  rationale: קוץ pode expressar impaciência, irritação, aversão ou enfado. A formulação preserva a referência ao estado interior e a nuance progressiva sem definir excessivamente o sentido.
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: ao julgar com justiça
  rationale: A expressão une julgamento e retidão. A formulação verbal é clara em português e mantém o cenário judicial indicado pelo hebraico.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico e o paralelo grego
  choice: Seguir o hebraico existente no texto principal e registrar o grego em nota.
  alternative: “Incline seu ouvido ao pobre e responda-lhe pacificamente, com mansidão.”
  rationale: Como o hebraico está preservado, ele serve de base principal. O grego apresenta uma tradição textual significativamente diferente, que deve ser preservada sem harmonização.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Das mãos de” foi empregado idiomaticamente para exprimir libertação do poder dos opressores; a segunda oração conserva a linguagem interior de “espírito” e a tensão semântica de קוץ.
