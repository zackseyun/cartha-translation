  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
translation:
  language: pt
  text: E Deus chamará você de filho[a], lhe será favorável e o livrará da cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e você será como filho do Altíssimo, e ele amará você mais do que sua mãe”. O testemunho hebraico, porém, traz: “E Deus chamará você de filho, lhe será favorável e o livrará da cova”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: E Deus
  rationale: אל funciona aqui como designação divina comum; “Deus” é natural em português e concorda com a referência grega ao Altíssimo.
- source_word: יִקְרָאֲךָ בֵּן
  choice: chamará você de filho
  rationale: Reproduz o sentido predicativo do hebraico sem acrescentar o possessivo “seu”, que não está expresso no texto.
- source_word: וְיָחְנְךָ
  choice: lhe concederá favor
  rationale: חנן indica conceder favor ou agir com graça. A formulação é clara e preserva a iniciativa graciosa de Deus sem deslocar o sentido para compaixão.
- source_word: וְיַצִּילְךָ
  choice: o livrará
  rationale: נצל significa livrar ou resgatar. “Livrará” mantém um registro bíblico digno e introduz naturalmente aquilo de que a pessoa será livrada.
- source_word: מִשָׁחַת
  choice: da Cova
  rationale: שחת pode designar cova, sepultura ou destruição. “Cova”, com inicial maiúscula, sinaliza a esfera da morte sem reduzir a ambiguidade a uma única interpretação.
theological_decisions:
- issue: Linguagem de filiação divina aplicada ao cuidador justo
  choice: Deus chamará você de filho
  alternative: você será como filho do Altíssimo
  rationale: O testemunho hebraico afirma diretamente que Deus chamará o destinatário de “filho”; o grego apresenta a comparação “como filho do Altíssimo”. Segue-se o hebraico como fonte principal, preservando a variante grega em nota sem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” expressa com naturalidade o singular do destinatário; “Cova” conserva a imagem bíblica e sua possível referência ao domínio da morte.
