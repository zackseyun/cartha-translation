  text: Do not abase yourself before a fool[b][a], and do not show partiality before rulers.
translation:
  language: pt
  text: Não se rebaixe diante de um insensato[a], nem mostre parcialidade diante de governantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “não estenda/deite a si mesmo diante de um insensato”. O paralelo grego esclarece a imagem como a de colocar-se por baixo de alguém, isto é, rebaixar-se.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta oração, considerado isoladamente, é menos claro e também poderia ser entendido em relação a “confiar” ou “ser complacente”. O paralelo grego diz “não aceites o rosto de um poderoso”, apoiando o sentido de não mostrar parcialidade diante dos governantes.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: Não se rebaixe
  rationale: O verbo hebraico sugere literalmente estender ou deitar a própria pessoa. O paralelo grego conserva a imagem de colocar-se por baixo de alguém; em português corrente, “rebaixar-se” comunica com naturalidade essa autodegradação sem tornar literal uma expressão obscura.
- source_word: לְנָבָל
  choice: diante de um insensato
  rationale: נָבָל designa alguém insensato em sentido moral, e não apenas uma pessoa de pouca inteligência. “Diante de” expressa a postura social indicada pelo contexto e confirmada pelo paralelo grego.
- source_word: נַפְשֶׁךָ
  choice: se
  rationale: נֶפֶשׁ pode indicar a própria pessoa, não somente a “alma” como entidade imaterial. O reflexivo português integra esse sentido naturalmente ao verbo “rebaixar-se”.
- source_word: וְאַל תַּאֲמֵן
  choice: nem mostre parcialidade
  rationale: A forma hebraica isolada admite uma leitura relacionada a confiar ou mostrar-se complacente, mas o paralelo grego diz literalmente para não “aceitar o rosto” de um poderoso, expressão que aponta para favorecimento ou parcialidade.
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: diante de governantes
  rationale: מוֹשְׁלִים são pessoas que governam ou exercem autoridade. “Governantes” é direto e amplamente compreensível, enquanto “diante de” preserva a situação de estar na presença dos poderosos.
theological_decisions:
- issue: Sentido da segunda oração, em que o hebraico תַּאֲמֵן não corresponde de modo transparente ao paralelo grego
  choice: Entender a oração como advertência contra mostrar parcialidade diante de governantes
  alternative: “não confie diante de governantes” ou “não seja complacente diante de governantes”
  rationale: O hebraico permanece a testemunha principal, mas sua formulação é menos transparente neste ponto. O grego antigo, usado como testemunha paralela, traz a expressão “não aceites o rosto de um poderoso”, apoiando o sentido de favorecer alguém por causa de sua posição. A nota preserva a incerteza textual e interpretativa em vez de ocultá-la.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário de compreensão internacional. “Insensato” preserva o teor moral de נָבָל; “rebaixar-se” traduz idiomaticamente a metáfora hebraica; as notas registram tanto a imagem literal da primeira oração quanto a ambiguidade real da segunda.
