  text: Do not make a needy soul despair[a], and do not ignore a crushed soul.
translation:
  language: pt
  text: Não leve ao desespero quem passa necessidade[a] nem ignore quem está com a alma esmagada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não entristeça uma alma faminta e não provoque um homem em sua aflição.” O testemunho hebraico é mais amplo, referindo-se a quem passa necessidade e a quem está com a alma esmagada; por isso, o texto principal segue o hebraico, e esta nota preserva a nuance do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: quem passa necessidade
  rationale: A expressão hebraica reúne sofrimento ou fraqueza (דוה) e carência (חסרה). A formulação portuguesa é natural e abrange privação material e necessidade em sentido mais amplo, sem limitar o texto à fome literal sugerida pelo paralelo grego.
- source_word: אַל תָּפוּחַ
  choice: não leve ao desespero
  rationale: O verbo é difícil, mas adverte contra agravar o abatimento de alguém que já sofre privação. A tradução conserva a força do hebraico no contexto, enquanto a nota registra a nuance do grego, “não entristeça”.
- source_word: וְאַל תִּתְעַלֵּם
  choice: nem ignore
  rationale: O hitpael de עלם pode indicar esconder-se de alguém ou fingir que não o vê. “Ignore” comunica esse sentido idiomático de modo claro e atual.
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: quem está com a alma esmagada
  rationale: מדוכדך descreve alguém esmagado, abatido ou alquebrado. A expressão preserva a metáfora intensa e a referência explícita à vida interior, sem empregar terminologia clínica moderna.
