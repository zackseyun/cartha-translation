  source_fidelity: 'O texto acompanha adequadamente o hebraico: “quem passa necessidade” reproduz de modo natural a pessoa em carência e sofrimento, sem restringir a expressão à fome; “não leve ao desespero” é uma solução contextual defensável para o verbo difícil תָּפוּחַ; e “nem ignore” expressa bem a ideia de não se ocultar ou desviar-se da pessoa abatida. “Alma esmagada” conserva a metáfora de מְדֻכְדַּךְ.'
