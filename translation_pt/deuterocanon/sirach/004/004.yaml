  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: pt
  text: Não negue uma dádiva ao pobre[a]; não despreze os pedidos do pobre, nem lhe dê motivo para amaldiçoar você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Não recuse quem suplica em sua aflição e não desvie o rosto do pobre.» O testemunho grego é mais curto e não contém a cláusula final sobre dar motivo para uma maldição.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע מַתָּן
  choice: Não negue uma dádiva
  rationale: מנע expressa reter ou negar, e מַתָּן significa dádiva ou presente. A formulação mantém o sentido amplo de ajuda sem restringi-lo tecnicamente a esmola.
- source_word: מִמִּסְכֵּנֶךָ
  choice: ao pobre que depende de você
  rationale: O substantivo designa uma pessoa pobre ou necessitada, e o sufixo de segunda pessoa estabelece uma relação de responsabilidade. A explicitação evita o português pouco natural «seu pobre» e preserva essa relação.
- source_word: וְלֹא תִבְזֶה שְׁאֵלוֹת דָּל
  choice: não despreze os pedidos do necessitado
  rationale: בזה significa desprezar ou tratar como insignificante; שְׁאֵלוֹת é plural, «pedidos» ou «súplicas», e דָּל designa o pobre ou vulnerável.
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: nem lhe dê motivo
  rationale: A expressão literalmente fala em «dar-lhe lugar», mas, neste contexto, significa dar ocasião ou motivo para a ação seguinte.
- source_word: לְקַלְלֶךָ
  choice: para amaldiçoar você
  rationale: O verbo קלל significa amaldiçoar. A tradução direta conserva a advertência de que a injustiça pode levar o necessitado a proferir uma maldição.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante do paralelo grego mais curto
  choice: Traduzir no texto principal as três cláusulas do hebraico preservado.
  alternative: 'Seguir o grego: «Não recuse quem suplica em sua aflição e não desvie o rosto do pobre.»'
  rationale: O hebraico sobrevivente é a fonte primária e inclui a cláusula final sobre a maldição. O grego confirma o tema geral, mas representa uma forma mais curta e diferente do versículo; sua leitura é registrada em nota sem harmonização.
translation_notes:
  register: Português atual, digno e de leitura ampla, com imperativos na forma «você». «Dádiva» preserva o sentido geral de מַתָּן, enquanto «o pobre que depende de você» comunica de modo natural a relação indicada pelo sufixo hebraico.
