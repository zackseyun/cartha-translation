translation:
  language: pt
  text: Seja como um pai para os órfãos[a] e, para as viúvas, faça as vezes de marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Livre o injustiçado da mão de quem o injustiça e não desanime ao julgar.” Isso provavelmente reflete uma forma textual diferente do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: Seja como um pai
  rationale: O imperativo de היה, seguido do כ comparativo, pede uma exortação que preserve a comparação, sem afirmar que o destinatário se torna literalmente pai.
- source_word: לִיתוֹמִים
  choice: para os órfãos
  rationale: יתומים designa os que perderam o pai ou os pais. “Órfãos” é claro, atual e natural em português.
- source_word: וּתְמוּר
  choice: e faça as vezes de
  rationale: תמור expressa substituição. A locução portuguesa comunica de modo natural a ideia de exercer, em favor de alguém, a função da pessoa ausente.
- source_word: בַּעַל
  choice: marido
  rationale: No contexto de viúvas, בעל tem o sentido doméstico de marido, e não o sentido geral de senhor, dono ou mestre.
- source_word: לְאַלְמָנוֹת
  choice: para as viúvas
  rationale: אלמנות significa “viúvas”. A preposição “para” expressa com naturalidade a atuação em benefício delas.
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος, καὶ μὴ ὀλιγοψυχήσῃς ἐν τῷ κρίνειν σε
  choice: não adotado no texto principal
  rationale: O grego preserva uma leitura substancialmente diferente. Como o hebraico está preservado, tem alta confiança e foi validado, ele rege o texto principal; a forma grega é registrada em nota.
theological_decisions:
- issue: Divergência entre o texto hebraico preservado e a leitura grega
  choice: Seguir no texto principal a exortação hebraica para agir como pai dos órfãos e em lugar de marido para as viúvas.
  alternative: 'Seguir o grego: “Livre o injustiçado das mãos de quem o trata injustamente e não desanime quando tiver de julgar.”'
  rationale: O hebraico sobrevivente é o testemunho primário deste versículo e possui alta confiança. A leitura grega, porém, representa uma forma textual materialmente distinta e por isso deve ser preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Faça as vezes de” preserva a noção hebraica de substituição de modo mais idiomático do que uma tradução rígida como “em lugar de marido”.
