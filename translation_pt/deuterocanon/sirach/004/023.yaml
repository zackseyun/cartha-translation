base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/023.yaml
  text: Do not withhold a word in the world, and do not hide your wisdom.
translation:
  language: pt
  text: Não retenha uma palavra no mundo[a], e não esconda a sua sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não impeça uma palavra em tempo de libertação” (ou “de salvação”). O testemunho hebraico traz “no mundo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Não deixe de
  rationale: מנע expressa impedir, reter ou deixar de fazer algo; com o infinitivo «falar», esta formulação transmite naturalmente em português a proibição de se calar.
- source_word: דִּבֵּר
  choice: falar
  rationale: A forma hebraica aponta para o ato de falar. O infinitivo português preserva a construção verbal sem impor a leitura nominal «uma palavra».
- source_word: בָּעוֹלָם
  choice: no mundo
  rationale: Segue literalmente o testemunho hebraico extante, embora a expressão seja incomum neste contexto. Evita substituí-la silenciosamente pela leitura grega ou por uma interpretação como «em público».
- source_word: וְאַל תַּצְפִּין
  choice: e não esconda
  rationale: צפן no causativo comunica esconder ou ocultar; «esconda» é claro, corrente e mantém o paralelismo da advertência.
- source_word: אֶת חָכְמָתֶךָ
  choice: a sua sabedoria
  rationale: חכמה corresponde diretamente a «sabedoria»; o possessivo é mantido sem transformar o termo em «ensino» ou «discernimento».
theological_decisions:
- issue: Divergência entre o hebraico e o grego na primeira oração
  choice: 'Seguir no texto principal o hebraico: «Não deixe de falar no mundo»'
  alternative: 'Seguir o grego: «Não impeça uma palavra em tempo de libertação/salvação»'
  rationale: O testemunho hebraico sobrevivente é a fonte principal e tem alta confiança, apesar da divergência substancial. A leitura grega é preservada em nota, sem harmonizar nem resolver artificialmente a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação incomum «no mundo» foi mantida por fidelidade ao testemunho hebraico e explicada em nota.
