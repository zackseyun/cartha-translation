  source_fidelity: 'O texto principal segue adequadamente o hebraico preservado: “A Sabedoria” mantém a personificação singular; “instruiu seus filhos” traduz למדָה בָנֶיהָ; e “dá testemunho em favor de todos os que nela têm entendimento” conserva a força testemunhal de ותעיד e a relação preposicional de מבינים בה. O presente em “dá testemunho” é aceitável como formulação sapiencial geral. A nota, porém, não traduz com precisão o primeiro verbo do paralelo grego, ἀνύψωσεν (“elevou/exaltou”), nem ἐπιλαμβάνεται (“toma/acolhe/agarra-se a”, não simplesmente “ampara”).'
  naturalness: O português do texto principal é formal, claro e apropriado ao registro sapiencial. “Nela têm entendimento” é uma construção algo marcada, mas é compreensível e preserva deliberadamente a relação do hebraico sem a reduzir a “a compreendem”.
  terminology: “Sabedoria”, “instruiu”, “filhos” e “dá testemunho” são escolhas coerentes com a personificação feminina e com o tom jurídico-sapiencial do hebraico. A nota deve usar “exaltou” e “acolhe” para representar melhor a leitura grega, sem sugerir uma equivalência inexistente com o hebraico.
