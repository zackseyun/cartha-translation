  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
translation:
  language: pt
  text: A Sabedoria instruiu seus filhos[a] e dá testemunho em favor de todos os que nela têm entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo apresenta uma leitura diferente: “A Sabedoria exaltou filhos para si e acolhe os que a procuram.” O hebraico preservado diz: “A Sabedoria instruiu seus filhos e dá testemunho em favor de todos os que nela têm entendimento.”'
    reason: Leitura alternativa substancial no paralelo grego.
lexical_decisions:
- source_word: חָכְמוֹת
  choice: A Sabedoria
  rationale: Embora tenha forma morfológica plural, o termo designa aqui a Sabedoria personificada no singular; o paralelo grego também emprega o singular.
- source_word: לִמְּדָה
  choice: instruiu
  rationale: O verbo למד significa ensinar ou instruir. O pretérito perfeito preserva o aspecto da forma hebraica sem tornar a expressão excessivamente escolar.
- source_word: בָנֶיהָ
  choice: seus filhos
  rationale: בנים pode designar filhos ou crianças em sentido amplo. Aqui, “filhos” preserva a imagem familiar da Sabedoria personificada sem exigir referência exclusiva ao sexo masculino.
- source_word: וְתָעִיד
  choice: dá testemunho
  rationale: A forma de העיד conserva a força de testemunhar. O presente expressa naturalmente em português a declaração sapiencial de caráter geral, sem importar a leitura divergente do grego.
- source_word: לְכָל
  choice: em favor de todos
  rationale: Com “dar testemunho”, a preposição ל admite sentido favorável ou beneficente; “em favor de” torna essa relação clara, embora o valor exato da preposição comporte alguma abertura.
- source_word: מְבִינִים
  choice: os que têm entendimento
  rationale: A formulação mantém o valor participial de בין e sua ênfase em possuir discernimento.
- source_word: בָּהּ
  choice: nela
  rationale: O sufixo feminino remete naturalmente à Sabedoria personificada, e “nela” preserva a preposição hebraica em vez de reduzi-la a um objeto direto.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a Sabedoria como figura feminina, retomada por formas femininas implícitas e por “nela”
  alternative: Tratar sabedoria apenas como abstração impessoal
  rationale: A gramática hebraica e o paralelo grego apresentam a Sabedoria de modo personificado; a tradução preserva essa imagem literária e teológica.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Usar o hebraico preservado no texto principal
  alternative: 'Seguir o grego: “elevou filhos para si e ampara os que a procuram”'
  rationale: Como há testemunho hebraico para este versículo, ele recebe prioridade. A leitura grega substancialmente diferente é registrada em nota, sem harmonização.
- issue: Sentido da relação expressa por בָּהּ
  choice: “nela têm entendimento”
  alternative: “a compreendem” ou “têm entendimento a respeito dela”
  rationale: A opção mantém a construção relacional do hebraico e sua possível densidade teológica, sem decidir que a Sabedoria seja apenas o objeto da compreensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dá testemunho em favor de” mantém a nuance forense do hebraico; “nela têm entendimento” é deliberadamente mais formal para preservar a relação preposicional e sua ambiguidade.
