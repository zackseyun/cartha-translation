  text: One who lowers his face and pretends not to hear—where he is not recognized, he will get ahead of you.
translation:
  language: pt
  text: Quem abaixa o rosto e finge não ouvir[a], onde não é reconhecido, passará à sua frente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «faz-se de surdo»; o particípio grego retrata alguém que simula surdez ou faz ouvidos moucos.
    reason: lexical_alternative
  - marker: b
    text: Ou «se antecipará a você» ou «levará vantagem sobre você»; o verbo grego significa chegar antes, antecipar-se ou ultrapassar alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων
  choice: abaixa
  rationale: O particípio descreve alguém que se curva ou se inclina para baixo. Com «o rosto», «abaixa» expressa o gesto corporal de modo natural e atual.
- source_word: πρόσωπον
  choice: rosto
  rationale: É o sentido comum e direto do substantivo neste contexto.
- source_word: ἑτεροκωφῶν
  choice: finge não ouvir
  rationale: O particípio raro indica comportar-se como surdo ou fazer ouvidos moucos. A formulação explicita naturalmente que se trata de uma atitude deliberada, sem tornar o texto excessivamente literal.
- source_word: ὅπου
  choice: onde
  rationale: Preserva o valor locativo mais direto do advérbio grego, embora uma leitura temporal também seja possível.
- source_word: οὐκ ἐπεγνώσθη
  choice: não é reconhecido
  rationale: O passivo de ἐπιγινώσκω pode significar ser reconhecido, conhecido ou percebido. O presente em português dá naturalidade à máxima geral sem alterar sua condição básica.
- source_word: προφθάσει σε
  choice: passará à sua frente
  rationale: A expressão conserva a imagem central de chegar antes ou ultrapassar alguém e evita definir demais se isso significa antecipação, vantagem ou manobra contra a outra pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção proverbial concisa. Mantém-se o «onde» locativo e a relativa ambiguidade do verbo final, esclarecida em nota.
