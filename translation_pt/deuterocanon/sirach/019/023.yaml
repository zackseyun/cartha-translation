  source_fidelity: 'A tradução conserva os elementos centrais do grego: a postura de curvar/baixar o rosto (συγκύφων πρόσωπον), a simulação de surdez (ἑτεροκωφῶν), o não reconhecimento (οὐκ ἐπεγνώσθη) e a ação de adiantar-se em relação ao interlocutor (προφθάσει σε). “Se antecipará a você” preserva adequadamente o sentido básico de agir antes, sem impor a interpretação mais forte de “enganará” ou “levará vantagem”.'
  naturalness: “Ele abaixa o rosto e se faz de surdo” é natural e facilmente compreensível no português brasileiro e internacional. A construção “onde não for reconhecido” é gramaticalmente apropriada para a referência futura introduzida por “onde”; a repetição de “ele” na segunda oração é aceitável e favorece clareza.
