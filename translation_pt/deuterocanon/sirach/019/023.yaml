  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
translation:
  language: pt
  text: Ele abaixa o rosto e se faz de surdo[a]; onde não for reconhecido, ele se antecipará a você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “age como se fosse surdo”. O verbo grego é raro e descreve alguém que aparenta não ouvir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “levará vantagem sobre você”. O verbo grego significa chegar ou agir primeiro e, assim, antecipar-se a alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  choice: abaixa o rosto
  rationale: A expressão descreve a postura física de inclinar ou baixar o rosto. A formulação é natural em português e conserva a possível aparência de humildade, dissimulação ou retraimento sem explicá-la no texto.
- source_word: ἑτεροκωφῶν
  choice: se faz de surdo
  rationale: O verbo raro indica agir como surdo ou aparentar não ouvir. “Se faz de surdo” é corrente, claro e mantém a ideia de comportamento deliberado.
- source_word: ὅπου
  choice: onde
  rationale: Mantém o sentido locativo normal do advérbio grego, embora no contexto ele também possa ter valor circunstancial.
- source_word: οὐκ ἐπεγνώσθη
  choice: não for reconhecido
  rationale: O aoristo passivo de ἐπιγινώσκω pode indicar não ser reconhecido ou identificado. “Reconhecido” preserva essa amplitude melhor que a opção mais interpretativa “descoberto”.
- source_word: προφθάσει σε
  choice: ele se antecipará a você
  rationale: προφθάνω expressa chegar ou agir antes de alguém e, por extensão, obter vantagem antecipando-se. A tradução conserva a imagem básica sem reduzir o sentido a “enganar” ou “vencer”.
