  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
translation:
  language: pt
  text: E o conhecimento da maldade não é sabedoria[a]; onde há conselho de pecadores, não há prudência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há sabedoria na perícia para a maldade”. O grego distingue “sabedoria” (σοφία), “conhecimento” (ἐπιστήμη) e “prudência” (φρόνησις).'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: É o equivalente corrente na literatura sapiencial e preserva o valor moral e intelectual do termo.
- source_word: πονηρίας
  choice: da maldade
  rationale: O genitivo qualifica ἐπιστήμη; “maldade” expressa de modo natural o caráter moralmente perverso desse conhecimento.
- source_word: ἐπιστήμη
  choice: conhecimento
  rationale: Mantém a distinção lexical em relação a σοφία (“sabedoria”) e φρόνησις (“prudência”).
- source_word: βουλή
  choice: conselho
  rationale: Preserva a ideia de deliberação, orientação ou plano promovido pelos pecadores, sem restringir indevidamente o sentido.
- source_word: ἁμαρτωλῶν
  choice: de pecadores
  rationale: Tradução direta do genitivo e categoria moral bíblica clara em português atual.
- source_word: φρόνησις
  choice: prudência
  rationale: Expressa discernimento prático e moral e mantém a distinção dos outros dois termos cognitivos do versículo.
- source_word: οὐκ ἔστιν ὅπου
  choice: onde há... não há
  rationale: Reproduz de forma idiomática a estrutura locativa e a negação enfática do grego.
theological_decisions:
- issue: Se a habilidade voltada para o mal pode ser considerada verdadeira sabedoria
  choice: O versículo nega que o conhecimento da maldade seja sabedoria e que o conselho de pecadores contenha verdadeira prudência.
  alternative: Entender a frase apenas como distinção entre tipos de capacidade intelectual, sem excluir totalmente a astúcia má da categoria de sabedoria.
  rationale: A dupla negação οὐκ ἔστιν sustenta uma rejeição forte nos dois membros, sem negar que pessoas más possam possuir informação ou habilidade; o que se nega é seu caráter de sabedoria e prudência autênticas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O ponto e vírgula separa os dois membros paralelos sem enfraquecer sua ligação. “Prudência” conserva o caráter prático e moral de φρόνησις.
