base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: pt
  text: Há uma astúcia meticulosa, e esta também é injusta; e há quem distorça as coisas a fim de trazer à luz um julgamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Julgamento” também pode ser traduzido por “justiça”, “sentença” ou “veredito”.
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία
  choice: astúcia
  rationale: O substantivo pode indicar habilidade engenhosa com conotação moral negativa; “astúcia” preserva essa carga sem impor um sentido mais específico como fraude.
- source_word: ἀκριβὴς
  choice: meticulosa
  rationale: Qualifica a astúcia como exata, cuidadosa ou finamente calculada; “meticulosa” comunica essa precisão em português corrente.
- source_word: ἄδικος
  choice: injusta
  rationale: Expressa uma avaliação moral ligada à injustiça e mantém a correspondência de gênero com “astúcia”.
- source_word: διαστρέφων
  choice: distorça as coisas
  rationale: O particípio descreve alguém que desvia ou deforma algo; o objeto não está expresso no grego, e “as coisas” o torna idiomático sem especificá-lo indevidamente.
- source_word: χάριν τοῦ
  choice: a fim de
  rationale: A construção indica propósito; “a fim de” conserva de modo claro essa relação.
- source_word: ἐκφᾶναι
  choice: trazer à luz
  rationale: O verbo significa tornar manifesto ou evidente; a expressão portuguesa preserva a imagem de revelação.
- source_word: κρίμα
  choice: julgamento
  rationale: O termo pode designar julgamento, sentença, veredito ou justiça; “julgamento” mantém sua amplitude jurídico-ética.
theological_decisions:
- issue: Avaliação moral da habilidade calculada
  choice: A primeira oração descreve uma forma meticulosa de astúcia e a declara injusta.
  alternative: Entender πανουργία de modo mais neutro como sagacidade ou habilidade.
  rationale: A expressão αὕτη ἄδικος avalia diretamente a qualidade mencionada como injusta, mas a tradução evita acrescentar intenções específicas não expressas.
- issue: Sentido de κρίμα na oração final
  choice: julgamento
  alternative: justiça; sentença; veredito
  rationale: O grego não determina um único sentido mais estreito. “Julgamento” conserva a ambiguidade entre o ato de julgar, uma decisão judicial e o conteúdo posto em evidência.
- issue: Tensão da oração final
  choice: Preservar a afirmação de que alguém distorce com o propósito de tornar um julgamento manifesto, sem explicar se esse propósito é legítimo ou irônico.
  alternative: Reformular como manipulação para obter um veredito ou como distorção para revelar a justiça.
  rationale: O texto liga a distorção ao propósito de manifestar κρίμα, mas não explicita a avaliação nem o mecanismo; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo com “há... e há...” e mantém aberta a difícil relação entre distorcer e trazer um julgamento à luz.
