  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
translation:
  language: pt
  text: 'Questione um amigo[a]: talvez ele não tenha dito isso; e, se tiver dito, para que não o repita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Repreenda um amigo”. O verbo grego pode ter sentido investigativo (“examinar”, “interrogar”) ou corretivo (“repreender”). A frase seguinte favorece primeiro verificar o que aconteceu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Confronte
  rationale: O imperativo de ἐλέγχω pode indicar examinar, interrogar, expor ou repreender. “Confronte” mantém tanto a ideia de averiguar diretamente com o amigo quanto a de corrigi-lo caso o relato seja verdadeiro; a nota registra a alternativa mais explicitamente corretiva.
- source_word: τὸν φίλον
  choice: um amigo
  rationale: Embora o grego use o artigo, a instrução proverbial tem sentido genérico. Em português, “um amigo” expressa isso de modo natural.
- source_word: μή ποτε οὐκ εἶπεν
  choice: talvez ele não tenha dito isso
  rationale: μή ποτε introduz a possibilidade cautelar de que o amigo não tenha pronunciado o que lhe atribuem. “Isso” explicita apenas o objeto já pressuposto pelo contexto.
- source_word: καὶ εἰ εἴρηκεν
  choice: e, se tiver dito
  rationale: A construção condicional preserva a possibilidade oposta, e o futuro composto do subjuntivo representa naturalmente em português a ação anterior com relevância para a confrontação.
- source_word: ἵνα μὴ δευτερώσῃ
  choice: para que não o repita
  rationale: δευτερόω significa fazer algo pela segunda vez. Como o contexto trata do que foi dito, “não o repita” comunica de forma clara a finalidade da confrontação.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura proverbial concisa. “Confronte” evita declarar antecipadamente que o amigo é culpado, sem eliminar a dimensão corretiva do verbo grego.
