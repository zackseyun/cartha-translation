revisions:
- from: Melhor é quem tem menos entendimento, mas é temente[a], do que quem é rico em prudência e transgride a lei.
  to: Melhor é quem tem menos, mas tem entendimento e temor, do que quem é rico em prudência e transgride a lei.
  rationale: A revisão restaura uma representação segura da relação entre “ter menos”, “entendimento” e “temor”, sem sobredefinir a natureza da carência nem o objeto do temor. O conectivo “mas” torna legível em português a tensão proverbial sem acrescentar conteúdo doutrinário. A âncora da nota deve ser colocada após “temor” no texto publicado.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:02:14Z'
review_pass:
  verdict: revise
  source_fidelity: A redação associa indevidamente ἐν συνέσει apenas a ἡττώμενος como se a expressão definisse uma deficiência de entendimento. Na sequência grega, ἡττώμενος (“em condição inferior”/“com menos”) é seguido por ἐν συνέσει e ἔμφοβος; a construção admite que a pessoa tenha entendimento e temor, sem especificar o objeto deste último. A revisão evita transformar o primeiro membro em “menos entendimento” e mantém a abertura de ἔμφοβος.
  naturalness: “Tem menos, mas tem entendimento e temor” é claro em português contemporâneo e preserva o paralelismo proverbial. “Temor” é mais natural que o adjetivo isolado “temente” quando o objeto não é expresso.
  terminology: “Entendimento” corresponde bem a σύνεσις; “prudência”, a φρόνησις; e “transgride a lei” preserva o registro moral-jurídico de παραβαίνων νόμον. A nota não acrescenta “do Senhor” ao texto.
  issues:
  - severity: high
    issue: “quem tem menos entendimento” faz de ἐν συνέσει o âmbito da carência de ἡττώμενος.
    rationale: Embora tal ligação possa parecer possível isoladamente, ela não preserva de modo seguro a construção nem o contraste transmitido pelo texto-base e pelo audit trail, que apresentam a pessoa menos favorecida como alguém caracterizado por entendimento e temor. A tradução não deve restringir a carência ao entendimento.
  - severity: medium
    issue: “é temente” sem complemento é menos idiomático e tende a sugerir em português um referente religioso determinado.
    rationale: ἔμφοβος exprime estar possuído de medo/temor, mas não nomeia seu objeto. “Tem temor” conserva melhor essa indeterminação; a nota pode registrar a possibilidade reverencial.
  revised_text: Melhor é quem tem menos, mas tem entendimento e temor, do que quem é rico em prudência e transgride a lei.
  revised_footnotes:
  - marker: a
    text: Ou “medo” ou “reverência”. O grego não especifica o objeto do temor; no contexto, pode haver uma alusão ao temor do Senhor.
    reason: lexical_alternative
  revision_rationale: A revisão restaura uma representação segura da relação entre “ter menos”, “entendimento” e “temor”, sem sobredefinir a natureza da carência nem o objeto do temor. O conectivo “mas” torna legível em português a tensão proverbial sem acrescentar conteúdo doutrinário. A âncora da nota deve ser colocada após “temor” no texto publicado.
