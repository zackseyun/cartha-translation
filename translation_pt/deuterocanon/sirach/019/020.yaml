  text: Better is one who is lacking[a], with understanding and fear, than one who abounds in prudence and transgresses the law.
translation:
  language: pt
  text: Melhor é quem tem menos, mas tem entendimento e temor, do que quem é rico em prudência e transgride a lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείττων
  choice: Melhor é
  rationale: Mantém a forma comparativa e proverbial do grego em português natural.
- source_word: ἡττώμενος ἐν συνέσει
  choice: quem tem menos entendimento
  rationale: Toma ἡττώμενος com a expressão imediatamente seguinte, no sentido de ser inferior ou deficiente em entendimento, criando o contraste com περισσεύων ἐν φρονήσει. Evita a leitura pouco clara de uma carência sem objeto expresso.
- source_word: ἔμφοβος
  choice: é temente
  rationale: Preserva a ideia de alguém tomado por temor, com possível sentido reverencial, sem acrescentar um objeto que o grego não declara.
- source_word: περισσεύων ἐν φρονήσει
  choice: quem é rico em prudência
  rationale: Expressa a abundância indicada pelo particípio e conserva φρόνησις como prudência prática, distinta de σύνεσις.
- source_word: παραβαίνων νόμον
  choice: transgride a lei
  rationale: Reproduz de modo direto e digno a violação da lei indicada pela expressão grega.
theological_decisions:
- issue: Se ἔμφοβος deve ser explicitado como “temente ao Senhor”
  choice: temente
  alternative: temente ao Senhor; medroso
  rationale: O contexto sapiencial permite entender temor reverente, possivelmente temor do Senhor, mas o objeto do temor não aparece no grego. A tradução mantém essa abertura.
translation_notes:
  register: Português atual, claro e digno, com estrutura proverbial. “Temente” conserva a ambiguidade teológica do grego; a nota registra alternativas sem inserir “ao Senhor” no texto.
