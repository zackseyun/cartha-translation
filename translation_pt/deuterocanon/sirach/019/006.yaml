lexical_decisions:
- source_word: μηδέποτε
  choice: Nunca
  rationale: Expressa de modo conciso e natural a proibição temporal enfática do grego.
- source_word: δευτερώσῃς
  choice: repita
  rationale: O verbo δευτερόω significa literalmente fazer pela segunda vez; com λόγον, indica repetir ou contar novamente algo.
- source_word: λόγον
  choice: uma palavra
  rationale: Mantém a forma ampla e proverbial do grego, que também pode significar declaração, relato ou assunto; essa ambiguidade é registrada em nota.
- source_word: οὐθέν
  choice: nada
  rationale: Reproduz diretamente o pronome neutro e funciona naturalmente como objeto de «perderá» em português.
- source_word: οὐ μὴ ἐλαττονωθῇ
  choice: não perderá
  rationale: A dupla negação grega dá uma garantia enfática; a formulação portuguesa comunica com naturalidade que nada será diminuído ou tirado da pessoa.
