review_pass:
  verdict: revise
  source_fidelity: A tradução principal acompanha adequadamente as duas proibições gregas e conserva a formulação condicional elíptica de καὶ εἰ μή ἐστίν σοι ἁμαρτία, sem impor no texto a leitura exceptiva. Contudo, a nota apresenta como alternativa uma inferência específica — que guardar silêncio seria pecado — que não é explicitada pela frase grega.
  naturalness: “Não conte isso nem a amigo nem a inimigo” é compreensível, mas a repetição do artigo indefinido torna a construção mais natural e clara em português moderno. A repetição de “isso” no fim evita a mudança pouco fluida de pronome neutro para masculino.
  terminology: “Pecado” traduz diretamente ἁμαρτία; “conte” e “revele” distinguem de modo natural os verbos de relatar e tornar conhecido. Não há questão de nomes próprios ou terminologia doutrinária.
  issues:
  - severity: medium
    issue: A nota caracteriza a cláusula final como uma possível exceção em que guardar silêncio seria pecado.
    rationale: O grego diz literalmente “e, se não é pecado para você, não revele”, mas não especifica que o eventual pecado seja o de guardar silêncio. Essa explicação resolve uma elipse discutida e introduz uma relação causal que o texto não declara. A nota deve registrar a concisão e a incerteza sintática/semântica sem privilegiar essa inferência.
  - severity: low
    issue: A construção “nem a amigo nem a inimigo” e a retomada “não o revele” podem soar levemente menos naturais.
    rationale: “Nem a um amigo nem a um inimigo” é mais idiomático; “não revele isso” retoma de forma uniforme o objeto implícito, sem alterar o sentido.
  revised_text: Não conte isso nem a um amigo nem a um inimigo e, se não for pecado para você, não revele isso.[a]
