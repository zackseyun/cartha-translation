  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: pt
  text: Não conte isso nem a um amigo nem a um inimigo e, se não for pecado para você, não revele isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é conciso e diz mais literalmente: “Com um amigo e com um inimigo, não relate; e, se não é pecado para você, não revele”. A relação exata entre a condição e a proibição final não é explicitada no grego; por isso, a tradução mantém a formulação condicional sem definir o que constituiria pecado.'
    reason: Preserva a construção elíptica do grego e sua ambiguidade, sem acrescentar que o pecado seria necessariamente guardar silêncio.
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: nem a amigo nem a inimigo
  rationale: No contexto do verbo de relatar, a expressão indica as pessoas a quem o assunto não deve ser contado. A construção portuguesa preserva o contraste abrangente entre amigo e inimigo.
- source_word: μὴ διηγοῦ
  choice: Não conte isso
  rationale: O verbo significa relatar ou contar; o objeto está implícito no grego e se refere ao assunto conhecido no contexto. “Conte isso” é claro e natural em português.
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: e, se não for pecado para você
  rationale: A tradução mantém a forma condicional e a concisão do grego, sem convertê-la no sentido interpretativo de “a menos que”. Assim, preserva-se a tensão e a possível ambiguidade da frase.
- source_word: μὴ ἀποκάλυπτε
  choice: não o revele
  rationale: O verbo denota tornar conhecido algo oculto ou reservado. “Revelar” conserva essa força e o pronome retoma naturalmente o assunto implícito.
theological_decisions:
- issue: Sentido de καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: 'Manter a condição: “se não for pecado para você”.'
  alternative: 'Interpretar como exceção: “a menos que calar seja pecado para você”.'
  rationale: A formulação grega é breve e sua lógica não é inteiramente explícita. A redação principal segue de perto a condição expressa no texto, enquanto a nota registra a leitura contextual possível sem incorporá-la como certeza.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Evitou-se “amigo ou inimigo” para reproduzir com maior nitidez a negação aplicada aos dois grupos; a formulação condicional foi mantida deliberadamente.
