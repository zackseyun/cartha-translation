  yaml_path: translation/deuterocanon/sirach/019/024.yaml
  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: pt
  text: E, se for impedido de pecar por falta de força[a], quando encontrar uma oportunidade[b], fará o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por fraqueza». A expressão grega pode indicar falta de poder ou incapacidade de modo mais geral.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «quando encontrar um tempo»; aqui, «tempo» tem o sentido de ocasião oportuna.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo simples que dá continuidade ao pensamento anterior, sem introduzir um contraste ausente do grego.
- source_word: ἐὰν
  choice: se
  rationale: Em ambas as ocorrências, introduz uma condição; a forma simples «se» reproduz adequadamente a sintaxe.
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  choice: por falta de força
  rationale: Expressa a deficiência ou insuficiência de poder/capacidade e preserva o sentido causal da expressão grega.
- source_word: κωλυθῇ
  choice: for impedido
  rationale: O passivo indica que a pessoa é impedida por uma limitação ou circunstância, e não que tenha abandonado moralmente o pecado.
- source_word: ἁμαρτεῖν
  choice: de pecar
  rationale: Complemento natural de «ser impedido» em português.
- source_word: εὕρῃ καιρόν
  choice: encontrar uma oportunidade
  rationale: καιρός designa aqui uma ocasião oportuna, não apenas um período cronológico.
- source_word: κακοποιήσει
  choice: fará o mal
  rationale: Preserva a amplitude do verbo, que pode significar praticar o mal ou agir perversamente, e mantém a ligação com «pecar».
theological_decisions:
- issue: Natureza do impedimento para pecar
  choice: A pessoa deixa de pecar por falta de força ou capacidade, não necessariamente por retidão genuína.
  alternative: A fraqueza poderia ser entendida especificamente como fraqueza moral.
  rationale: A expressão grega atribui o impedimento a uma deficiência de força; a oração futura mostra que, surgindo ocasião, a pessoa praticará o mal. A tradução conserva a tensão sem especificar se a incapacidade é física, social ou de outro tipo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a sequência condicional do grego e evita definir além do texto a natureza exata da falta de força.
