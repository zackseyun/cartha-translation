  text: From appearance a man is recognized[a], and from the expression of the face one who has understanding is recognized.
translation:
  language: pt
  text: Pela aparência, um homem será reconhecido; e pela expressão do rosto[a], será reconhecido quem tem entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo semblante”.'
    reason: A expressão grega ἀπαντήσεως προσώπου admite a ideia da expressão, do aspecto ou do porte percebido no rosto.
lexical_decisions:
- source_word: ὁράσεως
  choice: aparência
  rationale: Em ἀπὸ ὁράσεως, indica o aspecto visível pelo qual alguém pode ser reconhecido, não o ato de ver.
- source_word: ἐπιγνωσθήσεται
  choice: será reconhecido
  rationale: O futuro passivo expressa que a pessoa será identificada ou discernida por outros com base em sinais visíveis.
- source_word: ἀνήρ
  choice: um homem
  rationale: Preserva o singular masculino do provérbio grego sem introduzir o sentido específico de marido.
- source_word: ἀπαντήσεως προσώπου
  choice: expressão do rosto
  rationale: A locução aponta para aquilo que se percebe ao encontrar o rosto de alguém — sua expressão ou seu semblante — e esta formulação é clara em português moderno.
- source_word: νοήμων
  choice: quem tem entendimento
  rationale: Mantém o campo semântico de compreensão e discernimento e conserva o tom próprio da literatura sapiencial.
