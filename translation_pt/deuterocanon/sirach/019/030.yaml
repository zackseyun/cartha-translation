  text: A man's attire[a], and the laughter of his teeth, and a person's steps proclaim what is about him.
translation:
  language: pt
  text: O traje de um homem, o riso de seus dentes[a] e os passos de uma pessoa revelam coisas a seu respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sorriso que mostra os dentes”. O grego diz literalmente “o riso de dentes”, expressão que provavelmente se refere à expressão facial manifestada pelos dentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς
  choice: traje
  rationale: O substantivo indica adorno, vestimenta ou apresentação exterior. “Traje” é natural em português e mantém o foco no modo visível de vestir sem ampliar o sentido para toda a aparência.
- source_word: ἀνδρὸς
  choice: de um homem
  rationale: Mantém o singular masculino específico do grego, que neste provérbio também pode ter função representativa.
- source_word: γέλως ὀδόντων
  choice: o riso de seus dentes
  rationale: Reproduz de perto a imagem incomum do grego, literalmente “riso de dentes”, sem decidir no texto principal se se trata apenas de um sorriso ou, de modo mais amplo, da expressão revelada pelos dentes.
- source_word: βήματα ἀνθρώπου
  choice: os passos de uma pessoa
  rationale: “Passos” traduz diretamente βήματα, enquanto “uma pessoa” reflete o sentido humano mais geral de ἀνθρώπου e preserva a mudança lexical em relação a ἀνδρός.
- source_word: ἀναγγέλλει
  choice: revelam
  rationale: O verbo significa anunciar, dar a conhecer ou revelar. O plural é exigido naturalmente em português pelo sujeito composto; “revelam” comunica com clareza a função indicativa desses sinais exteriores.
- source_word: τὰ περὶ αὐτοῦ
  choice: coisas a seu respeito
  rationale: Preserva a amplitude da expressão grega, “as coisas acerca dele”, sem a restringir especificamente ao caráter, à reputação ou ao estado interior.
