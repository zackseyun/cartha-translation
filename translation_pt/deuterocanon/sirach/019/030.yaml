  register: Português moderno, claro e digno, com construção compreensível no Brasil e em outros contextos lusófonos. A imagem concreta e incomum “riso de seus dentes” foi mantida no texto, com uma alternativa mais idiomática em nota. O marcador foi colocado junto à expressão que a nota explica.
