  text: For he has heard you and has guarded himself against you[a], and in time he will hate you.
translation:
  language: pt
  text: Pois ele ouviu você e se precaveu contra você[a]; no devido tempo, odiará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vigiou você” ou “guardou você”. O verbo grego pode significar guardar, conservar ou vigiar; na forma média, como aqui, também pode sugerir que a pessoa se precaveu contra você. O contexto permite ambas as nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκήκοεν
  choice: ouviu
  rationale: O perfeito grego descreve algo que ele ouviu e cujos efeitos permanecem; em português corrente, o pretérito perfeito comunica isso com naturalidade no contexto.
- source_word: γάρ
  choice: pois
  rationale: Mantém a função explicativa da conjunção e liga a advertência ao que a precede.
- source_word: ἐφυλάξατό σε
  choice: ficou de sobreaviso contra você
  rationale: A forma média de φυλάσσω pode indicar que a pessoa se pôs em guarda ou se precaveu em relação ao interlocutor. A tradução preserva o tom ameaçador do contexto sem reduzi-la à mera vigilância.
- source_word: ἐν καιρῷ
  choice: quando chegar a ocasião
  rationale: Expressa uma ocasião futura ou oportuna, evitando que a locução seja entendida apenas como o decorrer genérico do tempo.
- source_word: μισήσει σε
  choice: odiará você
  rationale: Reproduz diretamente o futuro de μισέω e mantém a intensidade da advertência.
