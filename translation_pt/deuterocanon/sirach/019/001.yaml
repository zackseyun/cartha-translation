translation:
  language: pt
  text: Quem faz isto[a] não enriquecerá, e quem despreza as pequenas coisas acabará na ruína.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “O trabalhador beberrão”. O hebraico diz literalmente: “Quem faz isto”.'
    reason: Registra a diferença relevante entre o hebraico e o paralelo grego, preservando no texto principal a referência contextual não especificada do hebraico.
  - marker: b
    text: 'O grego diz: “cairá pouco a pouco”.'
    reason: Preserva a nuance progressiva encontrada no paralelo grego, ausente da formulação hebraica adotada no texto principal.
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: Quem age assim
  rationale: Traduz literalmente a ideia de alguém que faz ‘isto’, mas usa uma formulação natural em português; ‘assim’ conserva a referência ao comportamento mencionado no contexto anterior.
- source_word: לֹא יַעֲשִׁיר
  choice: não enriquecerá
  rationale: Mantém de modo direto o sentido econômico do verbo hebraico.
- source_word: וְבוֹזֶה מְעוּטִים
  choice: e quem despreza as pequenas coisas
  rationale: Preserva a formulação ampla do hebraico, que pode abranger pequenas quantias, ganhos ou faltas aparentemente insignificantes, sem restringir indevidamente o sentido.
- source_word: יִתְעַרְעָר
  choice: acabará na ruína
  rationale: Expressa em português corrente o resultado de desestabilização, queda ou empobrecimento indicado pelo verbo hebraico no contexto.
theological_decisions:
- issue: Identificação explícita do comportamento condenado
  choice: Conservar a referência contextual em ‘age assim’
  alternative: Explicitar ‘o trabalhador beberrão’, conforme o grego
  rationale: O texto hebraico recebido diz ‘faz isto’ e deixa o antecedente no contexto. A tradução não introduz no corpo do versículo a explicitação presente no paralelo grego.
- issue: Natureza da consequência final
  choice: ‘acabará na ruína’
  alternative: ‘cairá pouco a pouco’
  rationale: A redação principal segue o hebraico, enquanto a progressão explícita da queda no grego é registrada em nota, preservando a diferença textual sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção proverbial foi mantida concisa, e as diferenças do paralelo grego foram colocadas em notas.
