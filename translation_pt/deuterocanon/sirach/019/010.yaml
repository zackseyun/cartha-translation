  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
translation:
  language: pt
  text: Por causa de uma palavra[a], o insensato sentirá dores de parto, como a mulher que dá à luz por causa do bebê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «da face/presença de uma palavra [...] como da face/presença de um bebê». A expressão grega indica aqui causa ou motivo. «Palavra» também pode significar «fala», «relato» ou «assunto».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: por causa de
  rationale: A expressão significa literalmente «da face/presença de», mas aqui indica a causa ou o motivo das dores. «Por causa de» comunica esse valor com clareza e funciona nas duas partes da comparação.
- source_word: λόγου
  choice: uma palavra
  rationale: λόγος pode designar palavra, fala, relato ou assunto. «Uma palavra» preserva a formulação breve e concreta do provérbio sem eliminar por completo a amplitude do termo.
- source_word: ὠδινήσει
  choice: sentirá dores de parto
  rationale: O verbo evoca especificamente as dores do parto. Esta tradução mantém a imagem que a segunda oração torna explícita.
- source_word: μωρός
  choice: o insensato
  rationale: É um termo característico da literatura de sabedoria para quem age sem juízo, não apenas para alguém com pouca capacidade intelectual. «Insensato» conserva esse valor moral e prático em registro digno.
- source_word: βρέφους
  choice: o bebê
  rationale: βρέφος indica uma criança muito pequena ou recém-nascida. No contexto do parto, «bebê» é a forma moderna e natural.
- source_word: ἡ τίκτουσα
  choice: a mulher que dá à luz
  rationale: Tradução direta do particípio substantivado, que identifica a mulher no ato de dar à luz e mantém o paralelismo da comparação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com preferência por «insensato», termo corrente na literatura sapiencial. A repetição de «por causa de» foi mantida para reproduzir o paralelismo rigoroso e a imagem deliberadamente incisiva do grego.
