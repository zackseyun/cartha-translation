  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: pt
  text: 'Você ouviu uma palavra? Que ela morra com você[a]. Tenha coragem: ela não fará você arrebentar[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um assunto” ou “um relato”, em vez de “uma palavra” (λόγον).
    reason: lexical_alternative
  - marker: b
    text: 'A imagem grega é vívida: “não fará você arrebentar”; isto é, guardar o que ouviu não destruirá você.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας
  choice: Você ouviu
  rationale: O perfeito de ἀκούω apresenta algo já ouvido com relevância para a situação presente. Em português, o pretérito perfeito é a forma mais natural nesta pergunta retórica.
- source_word: λόγον
  choice: uma palavra
  rationale: λόγος pode indicar aqui uma palavra, um assunto ou um relato confidencial. “Uma palavra” conserva a concisão e a abertura semântica do provérbio, com as alternativas registradas em nota.
- source_word: συναποθανέτω σοι
  choice: Que ela morra com você
  rationale: 'O imperativo de συναποθνῄσκω é metafórico: o que foi ouvido não deve ser transmitido. A formulação preserva a imagem forte e é clara em português.'
- source_word: θάρσει
  choice: Tenha coragem
  rationale: O imperativo de θαρσέω encoraja o ouvinte a não temer guardar o que ouviu. “Tenha coragem” mantém o tom exortativo do grego.
- source_word: οὐ μή
  choice: não fará
  rationale: A construção οὐ μή expressa negação enfática. Em português, “não fará” comunica naturalmente a certeza no contexto, sem reproduzir de modo artificial a dupla partícula grega.
- source_word: ῥήξει
  choice: fará você estourar
  rationale: 'O futuro de ῥήγνυμι significa romper, rasgar ou fazer estourar. A escolha conserva a hipérbole corporal: guardar a palavra não fará a pessoa rebentar por dentro.'
theological_decisions: []
