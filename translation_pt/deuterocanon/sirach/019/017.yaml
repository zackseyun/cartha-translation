  text: All wisdom is fear of the Lord[b][a], and in all wisdom there is the practice of the law.
translation:
  language: pt
  text: Toda sabedoria é temor do Senhor[a], e em toda sabedoria há a prática da lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reverência ao Senhor”. A expressão grega inclui reverência cheia de assombro, mas o texto principal preserva a formulação mais forte da fonte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o cumprimento da lei”. O substantivo grego pode indicar a prática, realização ou observância da lei.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: Toda sabedoria
  rationale: Preserva o alcance abrangente do grego e mantém a formulação sapiencial concisa, sem acrescentar uma ideia como “consiste em”, ausente do texto.
- source_word: φόβος Κυρίου
  choice: temor do Senhor
  rationale: Mantém a força tradicional e teológica da expressão, que reúne medo, assombro e reverência, sem reduzi-la a mero respeito.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: em toda sabedoria
  rationale: Reproduz a construção preposicional e o paralelismo do grego, preservando sua formulação abrangente.
- source_word: ποίησις νόμου
  choice: a prática da lei
  rationale: ποίησις indica ação ou realização; neste contexto, “prática da lei” comunica que a sabedoria envolve pôr a lei em prática, sem tornar explícita uma interpretação mais estreita que o grego.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz Κυρίου, não o tetragrama hebraico; “Senhor” corresponde diretamente ao texto disponível e à expressão sapiencial consagrada.
- issue: Amplitude semântica de φόβος
  choice: temor do Senhor
  alternative: reverência ao Senhor
  rationale: “Temor” preserva a tensão entre medo, assombro reverente e devoção presente na expressão grega, em vez de suavizá-la para simples reverência.
- issue: Sentido de νόμου
  choice: lei
  alternative: instrução
  rationale: No contexto judaico sapiencial, νόμος aponta naturalmente para a lei divina; “instrução” é possível em sentido amplo, mas diluiria essa referência.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do paralelismo grego. “Toda sabedoria” evita uma paráfrase explicativa, e “prática da lei” soa natural sem perder a ênfase na ação.
