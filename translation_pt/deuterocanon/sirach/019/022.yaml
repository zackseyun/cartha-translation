  text: There is one who plots evil[a], bent low in gloom, and inwardly he is full of deceit;
translation:
  language: pt
  text: Há quem maquina o mal, curvado em melancolia, e por dentro está cheio de engano;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν
  choice: Há quem
  rationale: Introduz de modo idiomático, em português, um tipo geral de pessoa, preservando o valor existencial da expressão grega.
- source_word: πονηρευόμενος
  choice: pratique o mal
  rationale: O particípio retrata envolvimento ativo em conduta perversa. A formulação evita restringir o sentido a tramar ou planejar, noções possíveis, mas não obrigatórias.
- source_word: συγκεκυφώς
  choice: andando curvado
  rationale: Preserva a imagem concreta de alguém encurvado, sem decidir se a postura é literal, emocional ou fingida.
- source_word: μελανίᾳ
  choice: sombrio
  rationale: Comunica tanto uma aparência escura quanto um estado de abatimento ou melancolia, mantendo a polissemia do substantivo grego.
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: por dentro
  rationale: Expressa naturalmente o interior moral da pessoa e mantém o contraste com sua postura exterior.
- source_word: πλήρης δόλου
  choice: está cheio de engano
  rationale: δόλος indica dolo, fraude ou falsidade deliberada; “engano” é claro e abrangente no português atual.
theological_decisions:
- issue: Relação entre a aparência exterior e o caráter interior
  choice: A pessoa aparece curvada e sombria, enquanto interiormente está cheia de engano.
  alternative: A postura pode refletir abatimento real, e não uma aparência deliberadamente fingida.
  rationale: A justaposição grega sugere contraste entre o exterior e o interior, mas não afirma explicitamente que a postura seja uma encenação. A tradução conserva essa tensão.
- issue: Valor de καί antes da descrição interior
  choice: mas
  alternative: e
  rationale: Embora καί normalmente signifique “e”, aqui a oposição entre a postura visível e a realidade interior torna natural o valor adversativo em português, sem acrescentar uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Andando curvado” preserva a imagem física; “sombrio” mantém aberta a ambiguidade entre aparência e estado emocional.
