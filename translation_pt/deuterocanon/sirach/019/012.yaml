  text: Question a friend[a], perhaps he did not do it; and if he did do something, so that he may not add to it.
translation:
  language: pt
  text: 'Questione um amigo[a]: talvez ele não tenha feito isso; e, se fez alguma coisa, para que não acrescente.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Repreenda um amigo”. O verbo grego pode significar questionar, examinar, confrontar ou repreender.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para que não acrescente”. A expressão pode indicar não continuar, repetir ou agravar o que fez.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Interpele
  rationale: O imperativo pode expressar examinar, confrontar ou repreender. “Interpele” preserva a ideia de abordar diretamente o amigo para apurar ou corrigir a questão, sem pressupor de antemão sua culpa.
- source_word: φίλον
  choice: um amigo
  rationale: O objeto singular sem artigo tem sentido geral e proverbial; “um amigo” é a forma natural em português.
- source_word: μή ποτε οὐκ ἐποίησεν
  choice: talvez ele não tenha feito isso
  rationale: μή ποτε apresenta uma possibilidade cautelar. O perfeito composto em português comunica naturalmente que talvez a ação alegada não tenha ocorrido; “isso” explicita apenas o objeto implícito.
- source_word: καὶ εἴ τι ἐποίησεν
  choice: e, se fez alguma coisa
  rationale: Mantém o caráter indefinido de τι e o contraste entre não ter cometido o ato e ter feito alguma coisa.
- source_word: μή ποτε προσθῇ
  choice: para que não volte a fazê-la
  rationale: προστίθημι significa literalmente “acrescentar”, mas neste contexto ético pode indicar prosseguir ou reincidir na ação. A formulação portuguesa expressa com clareza a finalidade da interpelação, enquanto a nota conserva a imagem literal e a ambiguidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial geral. “Interpele” mantém a tensão entre investigação e correção; as notas registram as alternativas lexicais reais sem impor uma leitura confessional.
