  source_fidelity: A tradução reproduz adequadamente os dois imperativos, o objeto «o seu próximo», a prioridade temporal de πρὶν ἢ e o título divino «Altíssimo». «Ameaçá-lo» expressa corretamente ἀπειλῆσαι. A metáfora de δὸς τόπον é preservada sem fixar uma interpretação jurídica ou devocional.
