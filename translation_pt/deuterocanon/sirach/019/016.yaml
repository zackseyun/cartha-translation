  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
translation:
  language: pt
  text: Repreenda o seu próximo antes de ameaçá-lo e dê espaço à lei do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dê lugar à lei do Altíssimo”; isto é, abra espaço para que ela oriente a resposta ou siga seu curso, em vez de recorrer imediatamente a ameaças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξον
  choice: Repreenda
  rationale: O imperativo pede uma correção verbal direta e séria. “Repreenda” conserva essa força moral sem acrescentar a ideia de punição.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: Expressão ética tradicional e ainda compreensível para designar a outra pessoa, o semelhante.
- source_word: πρὶν ἢ ἀπειλῆσαι
  choice: antes de ameaçá-lo
  rationale: Mantém a prioridade temporal expressa pelo grego e apresenta a ameaça como possível escalada posterior à repreensão.
- source_word: δὸς τόπον
  choice: dê lugar
  rationale: Preserva a metáfora do original, que pode indicar abrir espaço, ceder ou permitir que algo exerça sua função.
- source_word: νόμῳ
  choice: à lei
  rationale: O dativo completa naturalmente a expressão “dar lugar a”; aqui, νόμος aponta para a lei ou instrução divina.
- source_word: Ὑψίστου
  choice: do Altíssimo
  rationale: Forma consagrada e reverente em português para o título divino grego.
theological_decisions:
- issue: Sentido de δὸς τόπον νόμῳ Ὑψίστου
  choice: manter a metáfora “dê lugar à lei do Altíssimo”
  alternative: “deixe a lei do Altíssimo seguir seu curso” ou “submeta-se à orientação da lei do Altíssimo”
  rationale: A expressão grega admite tanto a ideia de ceder à autoridade da lei quanto a de permitir que ela opere. A redação principal conserva essa abertura sem definir indevidamente se o foco é orientação moral, submissão ou procedimento judicial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva a metáfora deliberadamente aberta de δὸς τόπον e evita tornar explícita uma interpretação jurídica ou devocional que o grego não determina.
