  text: Reprove a friend[a], for often there is slander, and do not believe every word.
translation:
  language: pt
  text: Repreenda um amigo, pois muitas vezes surge uma calúnia; e não acredite em tudo o que se diz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não acredite em toda palavra”; no contexto, trata-se do que é dito ou relatado a respeito de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Repreenda
  rationale: O imperativo de ἐλέγχω pode significar repreender, corrigir ou chamar alguém a prestar contas. “Repreenda” conserva a força moral e interpessoal sem transformar o verbo em mera investigação.
- source_word: φίλον
  choice: um amigo
  rationale: O singular sem artigo tem sentido geral e proverbial. “Um amigo” evita acrescentar o possessivo “seu”, ausente do grego.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Equivalente corrente e claro do advérbio, preservando sua ideia de frequência.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão para a ordem anterior e mantém a ligação explicativa em registro sapiencial.
- source_word: γίνεται
  choice: surge
  rationale: O verbo significa literalmente vir a existir ou acontecer. Com “calúnia”, “surge” expressa de modo natural essa ocorrência.
- source_word: διαβολή
  choice: calúnia
  rationale: O substantivo designa acusação difamatória ou caluniosa. “Calúnia” é direto, atual e adequado ao alerta contra a credulidade.
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: não acredite em tudo o que se diz
  rationale: λόγος significa literalmente “palavra”, mas aqui se refere ao que é dito ou relatado. A formulação escolhida é natural em português e mantém a advertência para não aceitar indiscriminadamente toda alegação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial. A tradução mantém a força de “repreenda” e preserva a relação causal com a possibilidade frequente de calúnia. O ponto e vírgula separa as duas exortações sem desfazer sua unidade.
