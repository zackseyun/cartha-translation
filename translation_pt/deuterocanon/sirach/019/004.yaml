  yaml_path: translation/deuterocanon/sirach/019/004.yaml
  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: pt
  text: Quem confia depressa demais é leviano de coração, e quem peca contra a própria alma[a] cometerá uma falta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra si mesmo” ou “para o próprio mal”; em grego, “contra a própria alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχὺ
  choice: depressa demais
  rationale: O advérbio modifica ἐμπιστεύων. “Depressa demais” explicita a censura implícita no provérbio melhor do que o meramente temporal “depressa”.
- source_word: ἐμπιστεύων
  choice: confia
  rationale: O verbo indica depositar confiança; “confia” é direto, natural e adequado ao contexto sapiencial sobre credulidade.
- source_word: κοῦφος καρδίᾳ
  choice: leviano de coração
  rationale: Preserva a imagem de leveza expressa por κοῦφος e apresenta καρδίᾳ como o âmbito da disposição interior, sem reduzir a expressão a “ingênuo” ou “crédulo”.
- source_word: ἁμαρτάνων
  choice: peca
  rationale: É a tradução moral corrente do particípio e mantém sua força sem atenuá-lo como simples engano.
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: contra a própria alma
  rationale: Mantém a formulação e o peso antropológico do grego, ao mesmo tempo que a nota registra os sentidos contextuais de ação contra si e em prejuízo próprio.
- source_word: πλημμελήσει
  choice: cometerá uma falta
  rationale: O futuro de πλημμελέω denota dar um passo em falso, falhar ou proceder mal. “Cometerá uma falta” conserva o sentido moral e evita acrescentar a imagem de desvio ausente do verbo.
theological_decisions:
- issue: Sentido antropológico de ψυχή
  choice: alma
  alternative: si mesmo; vida
  rationale: Em literatura sapiencial, ψυχή pode designar a pessoa, o eu ou a vida. “Alma” preserva o termo e sua força moral-antropológica, enquanto a nota evita que ele seja entendido de maneira indevidamente estreita.
- issue: Relação entre ἁμαρτάνων e πλημμελήσει
  choice: peca ... cometerá uma falta
  alternative: peca ... se desviará
  rationale: A tradução mantém a proximidade semântica entre os dois verbos de conduta errada. “Se desviará” seria possível como interpretação do resultado, mas introduziria uma metáfora de caminho que não está explícita no grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção proverbial paralela foi preservada; “leviano de coração” mantém a metáfora grega sem soar excessivamente técnica.
