lexical_decisions:
- source_word: πονηρία
  choice: maldade
  rationale: Termo moral amplo que expressa perversidade ou mal ético sem restringir o sentido a uma atitude específica, como a malícia.
- source_word: βδέλυγμα
  choice: abominação
  rationale: Preserva a forte ideia de repulsa moral ou religiosa e mantém o registro bíblico sem soar incompreensível ao leitor moderno.
- source_word: ἄφρων
  choice: insensato
  rationale: Expressa a categoria moral e intelectual própria da literatura sapiencial; em português, é mais digno e menos coloquial que «tolo» neste contexto.
- source_word: ἐλαττούμενος
  choice: a quem falta
  rationale: Representa de modo natural a deficiência indicada pelo particípio, sem sugerir necessariamente perda progressiva ou redução causada por outro agente.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: Em Sirácida, o termo pertence claramente ao campo da sabedoria sapiencial, não ao de mera habilidade técnica.
- source_word: καὶ αὕτη
  choice: que também é
  rationale: Mantém a força aditiva de καί e liga a maldade à classificação adicional de «abominação» em português corrente.
