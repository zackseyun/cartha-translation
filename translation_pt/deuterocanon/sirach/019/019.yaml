translation:
  language: pt
  text: Há uma maldade que também é abominação, e há um insensato a quem falta sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um insensato carente de sabedoria»; mais literalmente, «um insensato diminuído em sabedoria». O particípio grego indica deficiência; «a quem falta sabedoria» é uma formulação mais idiomática em português.'
