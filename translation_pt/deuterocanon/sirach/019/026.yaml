translation:
  language: pt
  text: A maneira de um homem se vestir, o riso dos seus dentes[a] e os passos de uma pessoa revelam coisas a seu respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o riso dos dentes»; a expressão pode se referir ao sorriso ou à maneira de mostrar os dentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς ἀνδρός
  choice: a maneira de um homem se vestir
  rationale: Στολισμός indica a apresentação exterior, especialmente o traje ou adorno. A formulação escolhida é natural em português, conserva a referência masculina de ἀνδρός e evita sugerir apenas enfeites.
- source_word: γέλως ὀδόντων
  choice: o riso dos seus dentes
  rationale: A expressão grega diz literalmente «riso dos dentes». A imagem incomum foi mantida no texto, sem a reduzir de modo interpretativo a «sorriso».
- source_word: βήματα ἀνθρώπου
  choice: os passos de uma pessoa
  rationale: Βήματα pode designar passos e, por extensão, o modo de andar. «Passos» preserva essa abertura, enquanto «uma pessoa» comunica o sentido humano genérico de ἀνθρώπου.
- source_word: ἀναγγέλλει
  choice: revelam
  rationale: O verbo significa anunciar, comunicar ou dar a conhecer. Como os três sinais exteriores tornam conhecida alguma coisa sobre alguém, «revelam» é claro e vigoroso; o plural segue a concordância natural do português.
- source_word: τὰ περὶ αὐτοῦ
  choice: coisas a seu respeito
  rationale: A locução grega é ampla e significa literalmente as coisas relativas a ele. A tradução mantém essa generalidade, sem especificar caráter, condição ou intenção.
