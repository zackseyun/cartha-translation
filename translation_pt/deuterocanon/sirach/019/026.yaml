  source_fidelity: 'A tradução preserva com precisão a enumeração tripla do grego: o modo de vestir de «um homem» (ἀνδρός), o incomum «riso dos seus dentes» (γέλως ὀδόντων) e os passos de «uma pessoa» (ἀνθρώπου). «Revelam coisas a seu respeito» comunica adequadamente ἀναγγέλλει τὰ περὶ αὐτοῦ sem restringir o que tais sinais dão a conhecer.'
