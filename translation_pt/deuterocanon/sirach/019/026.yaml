translation_notes:
  register: Português atual, digno e acessível. A construção conserva a sequência concreta do grego e sua imagem incomum, mas emprega concordância plural natural em português. O texto grego alterna ἀνήρ («homem») e ἄνθρωπος («pessoa/ser humano»), distinção mantida na tradução.
