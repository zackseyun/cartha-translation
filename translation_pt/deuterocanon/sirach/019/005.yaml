  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
translation:
  language: pt
  text: Quem se alegra no coração será considerado culpado; e quem odeia a tagarelice[a] é diminuído pelo mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode significar “fala”, “conversa” ou “modo de falar”; neste contexto, provavelmente se refere à fala excessiva ou ociosa.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é concisa e também pode ser entendida como “é reduzido por causa da maldade” ou, possivelmente, “é diminuído no mal”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος καρδίᾳ
  choice: quem se alegra no coração
  rationale: O particípio substantivado tem sentido geral, e o dativo καρδίᾳ indica a disposição interior. A formulação conserva a expressão incomum e concisa do grego sem acrescentar um objeto à alegria.
- source_word: καταγνωσθήσεται
  choice: será considerado culpado
  rationale: O futuro passivo de καταγινώσκω possui força judicial e pode indicar que alguém recebe um veredito de culpa. A escolha evita tornar o resultado mais específico do que o grego exige.
- source_word: ὁ μισῶν λαλιὰν
  choice: quem odeia a tagarelice
  rationale: O particípio é vertido como máxima geral. Neste contexto sapiencial, λαλιὰν provavelmente se refere à fala excessiva ou ociosa; “tagarelice” comunica essa provável conotação sem usar uma expressão técnica.
- source_word: ἐλαττονοῦται κακίᾳ
  choice: é diminuído pelo mal
  rationale: A tradução mantém a voz passiva e a formulação compacta do grego. “Pelo mal” entende o dativo κακίᾳ como instrumental, mas a nota registra outras análises possíveis.
theological_decisions:
- issue: Sentido moral da segunda oração
  choice: Preservar a afirmação obscura “é diminuído pelo mal”
  alternative: Explicitar que a pessoa se torna menos má ou que sua vida é encurtada pela maldade
  rationale: O grego é sintaticamente conciso e semanticamente ambíguo. Explicitar o tipo de diminuição ou identificar de quem é o mal importaria uma interpretação não expressa no texto.
translation_notes:
  register: Português moderno, sóbrio e proverbial, com legibilidade brasileira. O ponto e vírgula separa as duas máximas coordenadas. Conservou-se deliberadamente a estranheza semântica do original na segunda oração, esclarecendo a ambiguidade em nota.
