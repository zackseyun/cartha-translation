  yaml_path: translation/deuterocanon/sirach/019/025.yaml
  text: A man is recognized by his appearance[a], and a man of understanding is recognized by the expression of his face.
translation:
  language: pt
  text: Um homem é reconhecido pela aparência, e um homem de entendimento é reconhecido pela expressão do rosto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “a partir do encontro do rosto”. A expressão pode se referir ao que o rosto de uma pessoa revela em um encontro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: pela aparência
  rationale: A construção indica aquilo que serve de base visível para reconhecer alguém. “Pela aparência” é natural em português e mantém a referência à apresentação exterior.
- source_word: ἐπιγνωσθήσεται
  choice: é reconhecido
  rationale: Embora a forma grega seja futuro passivo, o contexto proverbial permite entendê-la como futuro gnômico. O presente expressa com naturalidade uma verdade geral e preserva a voz passiva.
- source_word: ἀνήρ
  choice: um homem
  rationale: O substantivo grego é masculino singular. A tradução conserva essa forma sem ampliá-la nem neutralizá-la desnecessariamente.
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: pela expressão do rosto
  rationale: A formulação grega é incomum e associa o rosto a um encontro. “Pela expressão do rosto” comunica em português o aspecto visível pelo qual a pessoa é discernida, enquanto a nota preserva a imagem e a ambiguidade do original.
- source_word: νοήμων
  choice: quem tem entendimento
  rationale: O adjetivo substantivado descreve alguém dotado de compreensão ou discernimento. A escolha mantém o campo semântico sapiencial e evita restringi-lo à mera capacidade intelectual.
