base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
translation:
  language: pt
  text: E, se ele for impedido de pecar por falta de força, quando encontrar uma oportunidade, fará o mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causará dano”; o verbo grego pode indicar tanto fazer o mal em sentido geral como prejudicar alguém mais especificamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαττώματος ἰσχύος
  choice: falta de força
  rationale: A expressão indica que o impedimento decorre de uma deficiência de força ou capacidade. “Falta de força” é clara e natural, sem atribuir ao termo uma deficiência moral que o grego não explicita.
- source_word: κωλυθῇ
  choice: for impedido
  rationale: O passivo expressa um obstáculo circunstancial ou externo, não uma decisão virtuosa de se conter.
- source_word: ἁμαρτεῖν
  choice: de pecar
  rationale: Preserva diretamente a categoria moral expressa pelo infinitivo grego e se encaixa de modo idiomático com “impedido”.
- source_word: καιρόν
  choice: uma oportunidade
  rationale: καιρός designa aqui uma ocasião favorável para agir, e não apenas um momento cronológico.
- source_word: κακοποιήσει
  choice: fará o mal
  rationale: Mantém o sentido moral amplo do verbo, que também pode, conforme o contexto, referir-se mais especificamente a causar dano.
theological_decisions:
- issue: Sentido moral do versículo
  choice: A incapacidade de pecar não equivale à retidão; quando surgir a oportunidade, a disposição má se manifestará.
  alternative: Entender a frase final mais especificamente como causar dano a outras pessoas.
  rationale: A relação entre ἁμαρτεῖν e κακοποιήσει sustenta uma avaliação moral geral, mas a nota preserva a possibilidade lexical mais específica sem restringir o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O pronome “ele” explicita o sujeito implícito exigido pelo contexto sem acrescentar uma identificação interpretativa.
