translation:
  language: pt
  text: O vinho e as mulheres tornam o coração imprudente[a], e uma alma audaciosa destrói quem a possui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “O vinho e as mulheres afastarão os homens de entendimento, e quem se apega a prostitutas se tornará mais temerário.” O testemunho hebraico difere substancialmente na segunda linha.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: vinho
  rationale: Correspondência direta ao substantivo hebraico, preservando o primeiro elemento da advertência.
- source_word: נָשִׁים
  choice: mulheres
  rationale: O plural hebraico significa normalmente “mulheres”; o texto hebraico não o restringe a esposas nem a prostitutas.
- source_word: יַפְחִיזוּ
  choice: desviam
  rationale: O verbo expressa a ideia de tornar impetuoso, instável ou imprudente. “Desviam o coração” comunica de modo natural o efeito moral no contexto, sem reduzir o sentido apenas a uma emoção.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica do centro do pensamento, da vontade e dos desejos.
- source_word: נֶפֶשׁ
  choice: alma
  rationale: Mantém o termo tradicional para a pessoa viva ou o próprio ser, sem tratá-lo aqui como definição técnica da natureza humana.
- source_word: עָזָה
  choice: atrevida
  rationale: O adjetivo indica força, ousadia ou audácia; “atrevida” conserva no contexto a conotação moral negativa sem introduzir uma referência sexual ausente no hebraico.
- source_word: תַשְׁחִית
  choice: destrói
  rationale: Reproduz a força do verbo hebraico, que pode indicar arruinar ou destruir.
- source_word: בְעָלֶיהָ
  choice: quem a possui
  rationale: O hebraico diz literalmente “seu dono/senhor”, com sufixo feminino referente a “alma”. A formulação portuguesa preserva a relação sem sugerir propriedade sobre outra pessoa.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da forma grega divergente
  choice: Traduzir diretamente o hebraico preservado e registrar a forma grega em nota.
  alternative: 'Seguir o grego: “O vinho e as mulheres afastarão os homens de entendimento, e quem se apega a prostitutas se tornará mais temerário.”'
  rationale: O hebraico existente é o testemunho principal neste versículo. A segunda linha grega difere substancialmente e não deve ser harmonizada silenciosamente, mas sua leitura merece ser preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Desviam o coração” é idiomático e preserva a imagem hebraica; “alma atrevida” mantém a tensão e a concisão do segundo membro.
