  text: Uma flecha cravada na carne da coxa — assim é uma palavra no ventre do insensato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é condensado: literalmente, «numa coxa de carne». A relação entre «coxa» e «carne» pode ser entendida de modo ligeiramente diferente, mas a imagem é a de uma flecha alojada na carne da coxa.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: βέλος
  choice: flecha
  rationale: Designa um projétil; «flecha» é a opção concreta e natural que preserva a imagem proverbial.
- source_word: πεπηγὸς
  choice: cravada
  rationale: O particípio perfeito de πήγνυμι descreve algo que foi fincado e permanece alojado; «cravada» comunica tanto o ato como o estado resultante.
- source_word: ἐν μηρῷ σαρκός
  choice: na carne da coxa
  rationale: A formulação grega é condensada e sua relação genitiva é pouco usual. «Na carne da coxa» mantém μηρός como «coxa» e σάρξ no sentido físico de «carne», sem produzir uma expressão artificial em português.
- source_word: λόγος
  choice: palavra
  rationale: No contexto, refere-se a algo dito que o insensato guarda dentro de si; «palavra» conserva a amplitude e a concisão do grego.
- source_word: ἐν κοιλίᾳ
  choice: no ventre
  rationale: κοιλία designa literalmente o ventre e, por extensão, o interior da pessoa. «Ventre» preserva o paralelismo corporal da comparação em registro digno e compreensível.
- source_word: μωροῦ
  choice: do insensato
  rationale: Em literatura sapiencial, μωρός caracteriza quem age sem juízo moral e intelectual. «Insensato» é corrente no registro bíblico moderno e evita uma formulação excessivamente coloquial.
theological_decisions:
- issue: Sentido de σάρξ
  choice: carne em sentido físico
  alternative: corpo
  rationale: A comparação descreve literalmente uma flecha alojada no tecido da coxa; não há aqui o sentido teológico de natureza humana ou pecaminosa. «Carne» mantém a imagem concreta.
- issue: Valor de λόγος no provérbio
  choice: palavra
  alternative: assunto ou relato
  rationale: O contexto permite que λόγος seja uma fala, notícia ou assunto ouvido. «Palavra» preserva essa abertura sem especificar indevidamente o conteúdo.
translation_notes:
  register: Português moderno, internacional e legível no Brasil. A construção mantém a imagem corporal vívida e o paralelismo do provérbio, usando «insensato» em registro sapiencial digno.
