translation:
  language: pt
  text: A podridão e os vermes o herdarão, e a pessoa ousada será levada embora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a alma audaciosa será removida”.'
    reason: Registra as alternativas mais formais para ψυχή e ἐξαρθήσεται, preservando a ambiguidade lexical.
lexical_decisions:
- source_word: σήπη
  choice: a podridão
  rationale: Expressa diretamente decomposição ou putrefação, em paralelo com os vermes.
- source_word: κληρονομήσουσιν αὐτόν
  choice: o herdarão
  rationale: 'Preserva a metáfora forte do grego: a podridão e os vermes tornam-se os que recebem a pessoa como herança.'
- source_word: ψυχὴ τολμηρά
  choice: a pessoa ousada
  rationale: ψυχή pode designar a própria pessoa, e τολμηρός significa literalmente ousado ou audacioso. A tradução mantém essa ambiguidade moral, sem impor 'imprudente'.
- source_word: ἐξαρθήσεται
  choice: será levada embora
  rationale: Reproduz o sentido passivo de ser removida ou tirada, sem especificar um agente ausente no texto.
theological_decisions:
- issue: Valor moral de τολμηρά
  choice: ousada
  alternative: imprudente
  rationale: O adjetivo pode assumir conotação negativa no contexto, mas o grego isoladamente diz 'ousada/audaciosa'. Mantém-se a tensão em vez de explicitá-la no corpo do versículo.
- issue: Sentido de ψυχή
  choice: pessoa
  alternative: alma
  rationale: Aqui ψυχή provavelmente funciona como referência ao indivíduo inteiro. 'Pessoa' evita sugerir, sem necessidade, que apenas uma parte imaterial será retirada.
translation_notes:
  register: Português atual, digno e acessível. Conserva a imagem deliberadamente áspera de herança e decomposição, bem como a possível ambiguidade moral de “ousada”.
