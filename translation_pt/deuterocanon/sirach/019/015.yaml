translation:
  language: pt
  text: Há quem tropece, mas não de propósito[a]; e quem nunca pecou com a língua?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não a partir da alma”; isto é, não intencionalmente.
    reason: A nota preserva a metáfora e a ambiguidade lexical de οὐκ ἀπὸ ψυχῆς, enquanto o texto principal usa uma expressão portuguesa natural.
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: Há quem tropece
  rationale: A construção existencial com particípio apresenta uma pessoa genérica. “Há quem tropece” reproduz essa forma proverbial com naturalidade e mantém a imagem de um deslize.
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: não de propósito
  rationale: A expressão significa literalmente “não a partir da alma” e, neste contraste, indica que o deslize não foi deliberado. A tradução idiomática fica no texto, enquanto a formulação literal é preservada em nota.
- source_word: τίς οὐχ ἥμαρτεν
  choice: quem nunca pecou
  rationale: A pergunta retórica pressupõe que ninguém está isento. “Nunca” expressa naturalmente em português o alcance da negação grega, e “pecou” preserva o peso moral de ἁμαρτάνω.
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: com a língua
  rationale: A expressão grega emprega a língua como imagem concreta da fala. “Com a língua” conserva essa metáfora sem reduzir o sentido a um erro meramente verbal.
theological_decisions:
- issue: Peso moral de ἥμαρτεν no contexto sapiencial
  choice: pecou
  alternative: errou / ofendeu
  rationale: O verbo descreve uma falha de caráter moral na fala, não apenas um equívoco. “Pecou” mantém essa força sem acrescentar uma formulação doutrinária externa ao versículo.
- issue: Caráter voluntário ou involuntário do tropeço
  choice: não de propósito
  alternative: não a partir da alma / não do íntimo
  rationale: O grego conserva a imagem da ψυχή, mas o contraste mais provável é entre um deslize e uma ação deliberada. A nota registra a forma literal para não ocultar a amplitude da expressão.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial. “Há quem” evita introduzir gênero gramatical não exigido pelo particípio grego e mantém o sujeito genérico. O ponto e vírgula ressalta a relação entre o caso particular do deslize involuntário e a pergunta retórica universal.
