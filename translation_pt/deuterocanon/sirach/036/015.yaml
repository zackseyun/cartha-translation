  text: Have compassion on the city of your sanctuary[a], Jerusalem, the city of your dwelling place.
translation:
  language: pt
  text: Tem compaixão[a] da cidade do teu santuário, Jerusalém, cidade do teu lugar de repouso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tem misericórdia da cidade do teu santuário, Jerusalém, cidade do teu lugar de repouso.”'
    reason: Alternativa lexical para οἰκτείρησον, que pode ser expresso em português como um pedido de compaixão ou misericórdia.
lexical_decisions:
- source_word: οἰκτείρησον
  choice: Tem compaixão
  rationale: O imperativo pede misericórdia movida por compaixão. A expressão é natural no português atual e conserva tanto o apelo afetivo quanto a força da súplica.
- source_word: πόλιν
  choice: a cidade
  rationale: Embora o substantivo esteja sem artigo no grego, Jerusalém e os genitivos que o qualificam tornam a referência definida; o artigo é natural em português.
- source_word: ἁγιάσματός σου
  choice: do teu santuário
  rationale: ἁγίασμα designa aquilo que é santo ou consagrado e, neste contexto espacial, um lugar santo ou santuário. A escolha mantém a associação de Jerusalém com a presença santa de Deus.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: καταπαύματός σου
  choice: do teu repouso
  rationale: κατάπαυμα indica repouso ou lugar de repouso. “Teu repouso” preserva a imagem concreta e a concisão do grego, sem reduzi-la explicitamente a “morada”.
theological_decisions:
- issue: As duas expressões genitivas que descrevem Jerusalém
  choice: Jerusalém é apresentada como “a cidade do teu santuário” e “a cidade do teu repouso”.
  alternative: “Jerusalém, tua cidade santa e tua morada”
  rationale: O grego traz duas descrições paralelas e apostas. Mantê-las separadas conserva a associação entre Jerusalém, a santidade divina e o repouso de Deus, sem fundir as imagens em uma paráfrase.
- issue: Sentido de καταπαύματός
  choice: repouso
  alternative: morada
  rationale: “Morada” explicita uma possível implicação contextual, mas “repouso” representa mais diretamente o campo semântico do substantivo grego e preserva a imagem teológica sem resolvê-la.
translation_notes:
  register: Português moderno, claro e reverente, com formas de segunda pessoa do singular adequadas a uma oração dirigida a Deus. A formulação evita arcaísmos desnecessários e conserva o paralelismo do original.
