  text: And all men are from the ground[a], and Adam was created from the earth.
translation:
  language: pt
  text: E todos os seres humanos vêm do solo, e Adão foi criado da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: todos os seres humanos
  rationale: A expressão grega, embora tenha forma masculina plural, refere-se genericamente a toda a humanidade. Em português atual, “todos os seres humanos” preserva com clareza essa abrangência sem restringi-la aos homens do sexo masculino.
- source_word: ἀπὸ ἐδάφους
  choice: do solo
  rationale: ἐδάφος designa concretamente o chão ou solo. “Do solo” conserva a imagem da origem material da humanidade e distingue o termo de γῆς na oração seguinte.
- source_word: γῆς
  choice: da terra
  rationale: γῆ pode significar terra, chão ou solo. “Da terra” mantém a variação lexical em paralelo com “do solo” e ecoa naturalmente a linguagem da criação.
- source_word: ἐκτίσθη
  choice: foi criado
  rationale: O aoristo passivo de κτίζω expressa aqui o ato de criar. “Foi criado” reproduz diretamente o sentido e preserva o motivo teológico da criação.
- source_word: Ἀδάμ
  choice: Adão
  rationale: Emprega-se a forma portuguesa tradicional do nome próprio, mantendo a referência tanto ao primeiro ser humano individual quanto à sua função representativa no contexto.
theological_decisions:
- issue: Força representativa de ἄνθρωποι πάντες em relação a Adão
  choice: A primeira oração abrange toda a humanidade; a segunda apresenta a criação de Adão como fundamento ou modelo dessa origem comum.
  alternative: Ler a segunda oração como quase apositiva, com Adão representando paradigmaticamente a humanidade, e não apenas como referência ao primeiro indivíduo.
  rationale: O grego justapõe uma afirmação universal e a criação de Adão sem explicitar a relação lógica entre elas. A tradução conserva essa justaposição e, assim, não decide além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação simples com “e” reproduz a estrutura grega. “Seres humanos” comunica o valor genérico de ἄνθρωποι sem exigir nota lexical e sem introduzir linguagem denominacional.
