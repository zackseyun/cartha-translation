  text: Fill Zion with your praises[b][a], and your people with your glory.
translation:
  language: pt
  text: Enche Sião dos teus louvores[a] e o teu povo da tua glória.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a proclamação dos teus feitos poderosos” ou “com as tuas excelências”. O termo grego pode designar o louvor ou o relato de qualidades e feitos dignos de louvor.
    reason: lexical_alternative
  - marker: b
    text: O grego traz literalmente, de modo elíptico, “e o teu povo, de/a partir da tua glória”. Depois de “enche”, a expressão pode indicar tanto aquilo de que o povo é cheio como a glória que procede de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆσον
  choice: Enche
  rationale: O imperativo aoristo apresenta uma súplica direta para que Deus faça Sião e seu povo ficarem cheios; “enche” conserva a imagem concreta e é natural em português.
- source_word: Σιὼν
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ἀρεταλογίας σου
  choice: dos teus louvores
  rationale: ἀρεταλογία pode indicar louvor ou a proclamação das qualidades e feitos dignos de louvor. O plural idiomático “louvores” comunica bem a celebração pública, sem limitar o termo a uma única virtude ou ação.
- source_word: ἀπὸ τῆς δόξης σου
  choice: da tua glória
  rationale: Embora ἀπό expresse normalmente procedência, depois de “encher” a construção pode indicar aquilo de que alguém é cheio, sem excluir a ideia de que essa glória procede de Deus. Em português, “encher ... da tua glória” é natural e mantém em “de/da” certa abertura entre conteúdo e origem.
- source_word: τὸν λαόν σου
  choice: o teu povo
  rationale: Tradução direta do objeto acusativo, com o possessivo ligado a λαόν.
theological_decisions:
- issue: Sentido de ἀρεταλογίας na oração
  choice: “teus louvores” no texto principal
  alternative: “a proclamação dos teus feitos poderosos” ou “das tuas excelências”
  rationale: O substantivo pode apontar tanto para o louvor proclamado como para as qualidades ou feitos louváveis que são narrados. A tradução principal permanece ampla, e a nota preserva as possibilidades mais específicas.
- issue: Valor de ἀπό em ἀπὸ τῆς δόξης σου
  choice: “da tua glória”
  alternative: “com a tua glória” ou, mais literalmente, “a partir da tua glória”
  rationale: A construção portuguesa com “encher de” é idiomática e pode comunicar o conteúdo do enchimento, enquanto a preposição “de” ainda permite perceber a nuance de procedência presente no grego.
translation_notes:
  register: Português atual, digno e acessível, com construção natural tanto no Brasil como em outros contextos lusófonos. Mantém o paralelismo da súplica e registra em notas as ambiguidades lexicais e preposicionais relevantes.
