  text: Why does one day surpass another[a], when every daylight of the year comes from the sun?
translation:
  language: pt
  text: Por que um dia supera outro,[a] quando toda a luz dos dias do ano vem do sol?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por que um dia é superior a outro, quando toda a luz de cada dia do ano vem do sol?»'
    reason: Alternativa lexical para ὑπερέχει e explicitação possível do alcance distributivo de πᾶν φῶς ἡμέρας ἐνιαυτοῦ.
lexical_decisions:
- source_word: διὰ τί
  choice: Por que
  rationale: Introduz diretamente uma pergunta sobre a razão da diferença entre os dias.
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: um dia supera outro
  rationale: O genitivo expressa comparação; “supera” preserva essa força sem acrescentar uma avaliação moral ou cultual.
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: toda a luz dos dias do ano
  rationale: Expressa de modo natural em português a luz diurna correspondente aos dias ao longo do ano, mantendo o alcance coletivo do grego.
- source_word: ἀφ᾽ ἡλίου
  choice: vem do sol
  rationale: A preposição ἀπό indica origem; “vem do sol” é claro e idiomático.
theological_decisions:
- issue: Força comparativa de ὑπερέχει
  choice: supera outro
  alternative: é superior a outro
  rationale: Mantém a pergunta sapiencial sobre a distinção entre os dias apesar de sua fonte luminosa comum, sem definir em que consiste essa superioridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a tensão retórica do original e evita explicar antecipadamente por que certos dias se distinguem.
