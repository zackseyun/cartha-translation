  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
translation:
  language: pt
  text: Um cavalo para ser montado é como um amigo zombador; relincha sob qualquer pessoa que se sente sobre ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação grega é concisa e incomum. A expressão traduzida por «para ser montado» pode ter sentido sexual em outros contextos, mas aqui a imagem de alguém sentado sobre o cavalo favorece o sentido de montaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: cavalo
  rationale: É o sentido comum do termo; o contexto não exige a especificação «garanhão».
- source_word: εἰς ὀχείαν
  choice: para ser montado
  rationale: Embora ὀχεία possa ter sentido sexual em outros contextos, a menção de alguém sentado sobre o cavalo favorece aqui a imagem de montaria. A formulação conserva algo da expressão grega incomum.
- source_word: ὡς φίλος μῶκος
  choice: como um amigo zombador
  rationale: μῶκος se relaciona com zombaria ou escárnio. «Amigo zombador» mantém a imagem relacional e evita reduzi-la à mera insensatez.
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: sob qualquer pessoa que se sente sobre ele
  rationale: «Qualquer pessoa» preserva a força irrestrita de παντός, enquanto «que se sente sobre ele» traduz de modo claro o particípio ἐπικαθημένου.
- source_word: χρεμετίζει
  choice: relincha
  rationale: É o verbo português corrente e neutro para o som produzido pelo cavalo.
