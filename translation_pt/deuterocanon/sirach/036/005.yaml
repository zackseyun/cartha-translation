  text: The inward parts of a fool are like a cartwheel[a], and his thinking is like a turning axle.
translation:
  language: pt
  text: As entranhas do insensato são como a roda de uma carroça[a], e o seu pensamento, como um eixo que gira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «as entranhas de um insensato são como a roda de uma carroça». O grego emprega uma imagem corporal para retratar o estado interior do insensato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: a roda de uma carroça
  rationale: Traduz diretamente a imagem concreta de τροχός, “roda”, especificada por ἅμαξα, “carroça”; a formulação é clara e preserva o cenário rústico do provérbio.
- source_word: σπλάγχνα
  choice: as entranhas
  rationale: O termo designa literalmente os órgãos internos ou as entranhas e, por extensão, o íntimo da pessoa. A opção mantém a forte imagem corporal do grego sem reduzi-la a “coração” ou a um sentimento específico.
- source_word: μωροῦ
  choice: do insensato
  rationale: “Insensato” é corrente, digno e adequado ao vocabulário moral e intelectual da literatura sapiencial, sem a possível tonalidade meramente insultuosa de outras opções.
- source_word: διαλογισμὸς
  choice: pensamento
  rationale: O substantivo pode indicar pensamento, raciocínio ou deliberação. “Pensamento” conserva sua amplitude e soa natural no paralelismo.
- source_word: ὡς ἄξων στρεφόμενος
  choice: como um eixo que gira
  rationale: A oração relativa expressa naturalmente em português a ação contínua do particípio στρεφόμενος e preserva a imagem do eixo em rotação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A tradução preserva o paralelismo e a imagem corporal concreta do grego, sem explicar no texto principal qual aspecto do movimento circular está em foco.
