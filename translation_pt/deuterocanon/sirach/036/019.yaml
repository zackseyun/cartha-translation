  yaml_path: translation/deuterocanon/sirach/036/019.yaml
  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: pt
  text: conforme a bênção de Aarão sobre o teu povo,[a] e todos os que estão na terra saberão que tu és o Senhor, o Deus dos séculos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o teu povo” ou “a respeito do teu povo”; a expressão grega pode referir-se à bênção que Aarão pronunciava sobre Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Deus eterno”. Mais literalmente, o grego diz “o Deus dos séculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν
  choice: conforme a bênção
  rationale: 'κατά com acusativo expressa aqui conformidade: o pedido deve cumprir-se de acordo com a bênção. “Conforme” é natural e mantém a ligação sintática com o contexto anterior.'
- source_word: Ἀαρὼν
  choice: Aarão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: περὶ τοῦ λαοῦ σου
  choice: sobre o teu povo
  rationale: Em conexão com “bênção”, “sobre” comunica naturalmente a bênção pronunciada sobre o povo, sem eliminar a amplitude semântica de περί.
- source_word: γνώσονται
  choice: saberão
  rationale: O futuro simples reproduz com clareza o valor do futuro grego; neste contexto, pode envolver reconhecimento, mas não é necessário explicitá-lo.
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: todos os que estão na terra
  rationale: Expressão portuguesa corrente que preserva a referência abrangente a todas as pessoas sobre a terra sem acrescentar “habitantes” ao texto.
- source_word: Κύριος
  choice: Senhor
  rationale: Equivalente consagrado e adequado para o título divino κύριος.
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: o Deus dos séculos
  rationale: Mantém a construção plural do grego e sua amplitude temporal. “Séculos” é uma formulação digna e inteligível em português, sem reduzir a expressão à paráfrase “Deus eterno”.
theological_decisions:
- issue: Tradução do título divino Κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a correspondência tradicional e mais transparente para o título divino, sem acrescentar uma nuance específica não exigida pelo contexto.
- issue: Sentido de ὁ θεὸς τῶν αἰώνων
  choice: o Deus dos séculos
  alternative: o Deus eterno
  rationale: A opção escolhida preserva a forma plural e a tensão expressiva do original; a alternativa explicita uma possível implicação teológica, mas reduz a imagem dos tempos ou eras.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O início em minúscula preserva a dependência sintática aparente em relação ao contexto anterior. “Teu” mantém o singular do grego e o tom de oração; “dos séculos” conserva a formulação temporal sem impor uma paráfrase doutrinária.
