  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: pt
  text: O homem sensato confiará na Lei, e a Lei será para ele tão digna de confiança quanto um oráculo dos justos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma consulta dos justos»; o grego ἐρώτημα pode referir-se tanto a uma consulta ou pergunta quanto a uma resposta oracular.'
    reason: Preserva a ambiguidade lexical de ἐρώτημα e a relação não especificada de δικαίων («dos justos»), sem acrescentar que a resposta seja divina ou lhes seja concedida.
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: o homem sensato
  rationale: Expressa uma pessoa dotada de entendimento e discernimento em linguagem portuguesa natural e digna.
- source_word: ἐμπιστεύσει νόμῳ
  choice: confiará na Lei
  rationale: Mantém o valor futuro do verbo e traduz νόμος como «Lei», aqui entendida como a instrução normativa recebida pelo povo de Deus.
- source_word: πιστός
  choice: digna de confiança
  rationale: Preserva o paralelismo lexical com «confiará» e o sentido de algo fiel ou confiável.
- source_word: ἐρώτημα δικαίων
  choice: uma resposta divina concedida aos justos
  rationale: No contexto, ἐρώτημα pode designar uma consulta ou a resposta oracular a ela. «Resposta divina» comunica o provável sentido oracular sem recorrer a uma formulação obscura no texto principal; a ambiguidade é registrada em nota.
theological_decisions:
- issue: Natureza da confiabilidade da Lei
  choice: A Lei é apresentada como digna de confiança para o sensato.
  alternative: A Lei é personificada como fiel ao sensato.
  rationale: A tradução preserva a afirmação do grego sem acrescentar uma teoria específica sobre inspiração, mérito ou mecanismo de revelação.
- issue: Relação do genitivo δικαίων com ἐρώτημα
  choice: A resposta divina é concedida aos justos.
  alternative: A expressão pode significar «consulta dos justos» ou «resposta/oráculo dos justos».
  rationale: A construção grega admite mais de uma relação semântica. O texto principal adota uma leitura contextualmente clara, enquanto a nota conserva a ambiguidade real.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de «Lei» reproduz a ênfase do original; «resposta divina» evita a possível opacidade de «oráculo», e a nota documenta a ambiguidade lexical.
