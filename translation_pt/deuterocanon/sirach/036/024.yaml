  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: pt
  text: A beleza da mulher alegra o rosto[a] e supera todo desejo do homem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torna radiante o rosto” ou “anima o semblante”.
    reason: lexical_alternative
  - marker: b
    text: O grego também pode ser entendido como “supera todo desejo humano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλλος γυναικός
  choice: a beleza da mulher
  rationale: Mantém o sentido concreto de beleza ou formosura e a construção proverbial do grego, sem restringir γυνή ao sentido de “esposa”.
- source_word: ἱλαρύνει πρόσωπον
  choice: alegra o rosto
  rationale: ἱλαρύνω pode significar alegrar, tornar radiante ou iluminar de alegria. “Alegra o rosto” é natural em português e conserva a imagem concreta da expressão facial.
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν ... ὑπεράγει
  choice: supera todo desejo
  rationale: A combinação reforça a ideia de exceder ou ultrapassar. “Supera todo desejo” preserva de modo conciso a força comparativa.
- source_word: ἀνθρώπου
  choice: do homem
  rationale: Embora ἄνθρωπος possa ser genérico em outros contextos, a máxima contrapõe aqui a beleza da mulher ao desejo humano apresentado no masculino. “Do homem” conserva essa forma e evita neutralizar silenciosamente a tensão lexical.
theological_decisions:
- issue: Formulação de gênero na máxima sapiencial
  choice: Manter “mulher” e “homem” no texto principal.
  alternative: “A beleza da mulher alegra o rosto e supera todo desejo humano.”
  rationale: O grego traz γυναικός e ἀνθρώπου. Este último admite leitura genérica, mas, no contexto da atração pela mulher, pode conservar valor masculino representativo. A tradução principal retém a forma marcada, enquanto a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Rosto” foi preferido a “semblante” por ser mais corrente, e “alegra” conserva tanto o efeito emocional quanto a imagem visível do grego.
