  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: pt
  text: Onde não há cerca[a], a propriedade será saqueada; e onde não há esposa[b], gemerá enquanto vagueia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sebe”. O termo grego indica uma cerca, barreira ou fechamento protetor em torno de uma propriedade.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz literalmente: “e onde não há esposa, gemerá vagueando”. O sujeito não é expresso; o particípio está no masculino e, pelo contexto, sugere um homem sem esposa.'
    reason: source_ambiguity
lexical_decisions:
- source_word: φραγμός
  choice: cerca
  rationale: Designa uma barreira ou fechamento protetor. “Cerca” conserva a imagem sem especificar indevidamente uma sebe ou um muro.
- source_word: διαρπαγήσεται
  choice: será saqueada
  rationale: O futuro passivo expressa a apropriação violenta por terceiros; “será saqueada” comunica claramente a vulnerabilidade dos bens desprotegidos.
- source_word: κτῆμα
  choice: propriedade
  rationale: O termo pode indicar uma posse ou propriedade em sentido amplo. “Propriedade” mantém o singular e não restringe o referente a bens móveis.
- source_word: γυνή
  choice: esposa
  rationale: Neste contexto proverbial e doméstico, o sentido mais provável é “esposa”, e não simplesmente “mulher”.
- source_word: στενάξει
  choice: gemerá
  rationale: Preserva a expressão forte de aflição do verbo grego, sem a atenuar para um simples suspiro.
- source_word: πλανώμενος
  choice: enquanto vagueia
  rationale: Representa a ação ou condição simultânea do particípio e transmite a ideia de vida errante ou sem estabilidade, sem impor o sentido moral de “desviar-se”.
- source_word: οὗ οὐκ ἔστιν ... καὶ οὗ οὐκ ἔστιν
  choice: Onde não há... e onde não há...
  rationale: Conserva o paralelismo proverbial e a estrutura locativa do grego em português natural.
theological_decisions:
- issue: Sujeito implícito na segunda oração
  choice: manter o sujeito não expresso em “gemerá enquanto vagueia”
  alternative: explicitar “o homem gemerá” ou “ele gemerá”
  rationale: O grego não apresenta um substantivo nem um pronome como sujeito de στενάξει. O contexto sugere o marido ou chefe da casa sem esposa, mas o português permite conservar o sujeito implícito e, assim, evita acrescentar ao texto uma identificação explícita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. A omissão natural do pronome sujeito em português mantém a ambiguidade formal do grego sem neutralizar o contexto doméstico e masculino sugerido por “esposa”.
