base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/025.yaml
  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: pt
  text: Se há misericórdia e mansidão em sua língua,[a] seu marido não é como os demais homens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é um tanto incomum; refere-se a uma mulher cuja fala é marcada pela misericórdia e pela mansidão.
    reason: cultural_note
  - marker: b
    text: Literalmente, “como os filhos dos homens”; isto é, como os homens em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: em sua língua
  rationale: Preserva a imagem grega da língua como lugar da fala e soa natural em português, sem transformar a expressão diretamente em uma paráfrase como “em suas palavras”.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente mais direto e mantém a dimensão moral de compaixão e benevolência presente no termo grego.
- source_word: πραΰτης
  choice: mansidão
  rationale: Expressa uma disposição branda e não agressiva, conservando o caráter de virtude do grego; “gentileza” poderia sugerir sobretudo cortesia.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: seu marido
  rationale: No contexto conjugal, ἀνήρ designa naturalmente o marido, e não apenas um homem.
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: como os demais homens
  rationale: Reproduzir literalmente “como os filhos dos homens” seria pouco claro e artificial em português. A formulação idiomática comunica a comparação proverbial provável sem apagar em nota a forma masculina e incomum do grego.
theological_decisions:
- issue: Expressão antropológica masculina em καθʼ υἱοὺς ἀνθρώπων
  choice: como os demais homens
  alternative: como os filhos dos homens
  rationale: O grego emprega uma expressão masculina proverbial, mas a tradução literal é obscura em português. Mantém-se a referência masculina exigida pelo contexto e oferece-se em nota a forma literal, preservando a tensão textual sem neutralização de gênero.
- issue: Relação entre a fala da mulher e a condição excepcional do marido
  choice: manter a afirmação sem explicitar uma relação causal
  alternative: sua fala faz de seu marido alguém excepcional
  rationale: O texto justapõe a condição e a comparação, mas não declara formalmente o mecanismo causal. A tradução evita acrescentar uma interpretação que o grego apenas sugere.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e a imagem “em sua língua” acompanham de perto o grego, enquanto “os demais homens” evita uma tradução literal opaca; as notas registram tanto a estranheza da construção quanto sua forma original.
