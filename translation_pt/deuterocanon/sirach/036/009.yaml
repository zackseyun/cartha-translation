  text: From them he exalted and sanctified[b][a], and from them he appointed a fixed number of days.
translation:
  language: pt
  text: Dentre eles, ele exaltou e santificou alguns; e outros ele colocou no número dos dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “colocou [alguns] no número dos dias”. A expressão pode referir-se a dias contados entre os dias comuns, em contraste com os que foram exaltados e santificados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν
  choice: Dentre eles ... alguns
  rationale: Embora a expressão diga literalmente “deles” ou “a partir deles”, o uso partitivo e o paralelismo com ἐξ αὐτῶν favorecem “dentre eles ... alguns”. O complemento “alguns” fica implícito no grego, mas é necessário para uma formulação portuguesa clara.
- source_word: ἀνύψωσεν
  choice: exaltou
  rationale: ἀνυψόω significa elevar ou exaltar. “Exaltou” preserva o provável sentido honorífico e forma um paralelo natural com “santificou”.
- source_word: ἡγίασεν
  choice: santificou
  rationale: ἁγιάζω significa tornar santo, santificar ou consagrar. “Santificou” mantém o registro solene sem restringir o sentido a uma consagração estritamente cultual.
- source_word: καὶ ἐξ αὐτῶν
  choice: e outros
  rationale: Literalmente, “e dentre eles”. À luz da primeira oração e do contraste interno, “e outros” expressa naturalmente em português a segunda parte da divisão, sem identificar além do que o grego permite.
- source_word: ἔθηκεν εἰς ἀριθμὸν ἡμερῶν
  choice: incluiu na contagem dos dias
  rationale: A construção é literalmente “pôs na contagem/no número dos dias”. No contexto da distinção entre dias, ela parece contrastar dias exaltados e santificados com dias deixados na contagem comum. “Incluiu na contagem” conserva essa imagem melhor do que “estabeleceu um número fixo de dias”.
theological_decisions:
- issue: Sujeito implícito dos verbos gregos
  choice: ele
  alternative: Deus; o Senhor
  rationale: Os verbos estão na terceira pessoa do singular, mas esta oração não nomeia o sujeito. O pronome “ele” conserva a referência anafórica sem inserir um nome ou título divino ausente da linha.
- issue: Natureza do contraste entre os dois grupos
  choice: alguns foram exaltados e santificados; outros foram incluídos na contagem dos dias
  alternative: ele estabeleceu, dentre eles, um número fixo de dias
  rationale: O paralelismo partitivo ἀπ᾽ αὐτῶν ... ἐξ αὐτῶν sugere dois grupos tomados do mesmo conjunto. Ainda assim, a expressão final admite mais de uma compreensão, por isso a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe levemente solene. A repetição partitiva do grego foi vertida por “alguns ... outros” para dar fluidez, enquanto a ambiguidade da expressão final foi preservada em nota.
