base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: pt
  text: Pois quem confiará num salteador bem cingido[a], que anda aos tropeços de cidade em cidade? Assim é o homem que não tem ninho[b] e se hospeda onde quer que a noite o encontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «salteador pronto para agir». O adjetivo grego significa literalmente estar bem cingido, isto é, equipado e preparado para a ação.
    reason: lexical_alternative
  - marker: b
    text: «Ninho» preserva a metáfora grega de uma ave sem lugar fixo de repouso; aqui indica a falta de uma morada segura.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ πιστεύσει
  choice: Pois quem confiará
  rationale: πιστεύω, com referência a uma pessoa, expressa depositar confiança; «pois» conserva a função explicativa de γάρ.
- source_word: εὐζώνῳ
  choice: bem cingido
  rationale: Mantém a imagem concreta de alguém com o cinto ajustado e, portanto, equipado e pronto para agir, sem restringir indevidamente o sentido a estar armado.
- source_word: λῃστῇ
  choice: salteador
  rationale: λῃστής designa um ladrão violento ou bandido, não simplesmente um furtador; «salteador» preserva essa força.
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: que anda aos tropeços de cidade em cidade
  rationale: O particípio sugere tropeçar, cambalear ou mover-se de modo instável; a formulação conserva tanto o deslocamento quanto a precariedade.
- source_word: οὕτως ἀνθρώπῳ
  choice: Assim é o homem
  rationale: Introduz de modo natural a comparação proverbial; «homem» corresponde ao singular ἀνθρώπῳ neste contexto.
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: que não tem ninho
  rationale: Preserva a metáfora explícita de νοσσιά, o lugar fixo em que uma ave se abriga ou cria os filhotes.
- source_word: καταλύοντι
  choice: se hospeda
  rationale: Neste contexto, καταλύω indica parar e tomar pousada ou alojamento, especialmente ao fim do dia.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: onde quer que a noite o encontre
  rationale: Expressa naturalmente a ideia temporal de chegar a tarde ou anoitecer onde a pessoa estiver, sem apagar a sua falta de morada fixa.
