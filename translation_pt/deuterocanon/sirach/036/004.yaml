translation:
  language: pt
  text: Prepare suas palavras[a] e então você será ouvido; reúna a instrução e responda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Prepare uma palavra (ou um discurso), e assim você será ouvido; ligue a instrução e responda.” O grego λόγον está no singular, e σύνδησον παιδείαν emprega a imagem de ligar ou atar, possivelmente no sentido de reunir ou organizar a instrução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτοίμασον
  choice: Prepare
  rationale: Imperativo aoristo de ἑτοιμάζω; “prepare” expressa de modo natural a ação deliberada de deixar pronto o que será dito.
- source_word: λόγον
  choice: suas palavras
  rationale: Embora o grego tenha o singular λόγον, o contexto aponta para aquilo que a pessoa pretende dizer. O plural idiomático em português produz uma formulação clara, enquanto a nota preserva a possibilidade formal de “uma palavra” ou “um discurso”.
- source_word: οὕτως
  choice: então
  rationale: O advérbio pode indicar modo ou consequência. “Então” comunica com fluidez o resultado prático de preparar as palavras.
- source_word: ἀκουσθήσῃ
  choice: você será ouvido
  rationale: Preserva a voz passiva do futuro grego e o sentido social de conseguir que os outros deem atenção ao que se diz.
- source_word: σύνδησον
  choice: reúna
  rationale: O verbo significa literalmente “atar juntamente”. Em português, “reúna” comunica de modo natural a ideia metafórica de juntar ou organizar a instrução; a imagem literal é preservada na nota.
- source_word: παιδείαν
  choice: a instrução
  rationale: Na literatura sapiencial, παιδεία designa ensino formativo, educação ou disciplina. “Instrução” se ajusta melhor ao contexto de preparar uma resposta sem sugerir principalmente punição.
- source_word: ἀποκρίθητι
  choice: responda
  rationale: Imperativo aoristo médio de ἀποκρίνομαι; “responda” é direto, corrente e adequado ao contexto.
