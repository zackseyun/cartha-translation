base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: pt
  text: Dá uma recompensa aos que esperam por ti[a], e que se confie nos teus profetas[b]. Ouve, Senhor, a súplica dos que te imploram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos que perseveram por ti” ou “aos que permanecem firmes diante de ti”. O verbo grego pode expressar tanto espera quanto perseverança.
    reason: lexical_alternative
  - marker: b
    text: Ou “que os teus profetas sejam reconhecidos como dignos de confiança” ou “que se creia nos teus profetas”. A forma grega é concisa e pode referir-se tanto ao reconhecimento dos profetas como confiáveis quanto à confiança ou crença neles.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς
  choice: Dá
  rationale: Imperativo direto de δίδωμι; mantém a força simples e imediata da petição.
- source_word: μισθὸν
  choice: uma recompensa
  rationale: μισθός pode indicar salário, paga ou recompensa. Neste contexto de oração, “recompensa” evita uma conotação excessivamente comercial.
- source_word: τοῖς ὑπομένουσίν σε
  choice: aos que esperam por ti
  rationale: ὑπομένω pode expressar esperar, permanecer ou perseverar. Com Deus como objeto, “esperam por ti” comunica naturalmente a expectativa fiel, sem eliminar os outros matizes, registrados em nota.
- source_word: οἱ προφῆταί σου
  choice: os teus profetas
  rationale: Equivalência direta e natural para o sintagma grego.
- source_word: ἐμπιστευθήτωσαν
  choice: sejam dignos de confiança
  rationale: O imperativo passivo é conciso e difícil. A formulação portuguesa preserva a ideia de os profetas serem reconhecidos como confiáveis, embora também seja possível entender que sejam acreditados.
- source_word: εἰσάκουσον
  choice: Ouve
  rationale: Verbo tradicional e ainda corrente em oração, com o sentido de ouvir favoravelmente.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo dirigido a Deus; “Senhor” é a correspondência adequada e consagrada.
- source_word: δεήσεως
  choice: a súplica
  rationale: δέησις designa uma oração ou petição insistente; “súplica” conserva essa intensidade.
- source_word: τῶν ἱκετῶν σου
  choice: dos que te imploram
  rationale: ἱκέτης é quem se aproxima como suplicante. A locução verbal é mais clara e corrente em português do que “suplicantes”.
theological_decisions:
- issue: Sentido de τοῖς ὑπομένουσίν σε
  choice: aos que esperam por ti
  alternative: aos que perseveram por ti; aos que permanecem firmes diante de ti
  rationale: O verbo admite tanto expectativa quanto perseverança. O texto principal adota a expressão devocional mais natural, enquanto a nota preserva a amplitude lexical.
- issue: Força de ἐμπιστευθήτωσαν a respeito dos profetas
  choice: que os teus profetas sejam dignos de confiança
  alternative: que os teus profetas recebam confiança; que se creia nos teus profetas
  rationale: A forma passiva pode pedir que os profetas se mostrem confiáveis ou que sejam acreditados. A tradução principal mantém a noção de confiabilidade sem decidir de modo absoluto entre reconhecimento e recepção de confiança.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Usa “ti/te” de modo coerente na oração e evita vocabulário excessivamente técnico; “súplica” preserva o tom solene do original.
