    text: Ou “que os teus profetas sejam reconhecidos como dignos de confiança” ou “que se creia nos teus profetas”. A forma grega é concisa e pode referir-se tanto ao reconhecimento dos profetas como confiáveis quanto à confiança ou crença neles.
    reason: alternative_reading
