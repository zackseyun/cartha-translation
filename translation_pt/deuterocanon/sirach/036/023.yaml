translation:
  language: pt
  text: Uma mulher aceitará qualquer homem[a], mas uma filha é melhor do que outra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Uma esposa aceitará qualquer homem». O grego γυνή pode significar «mulher» ou «esposa»; ἄρρην designa literalmente alguém do sexo masculino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: qualquer homem
  rationale: πάντα com o singular ἄρρενα tem sentido distributivo, «qualquer homem» ou «todo indivíduo do sexo masculino». Em português, «qualquer homem» preserva o sentido humano e proverbial sem a conotação desumanizante que «qualquer macho» pode adquirir.
- source_word: ἐπιδέξεται
  choice: aceitará
  rationale: O futuro médio exprime receber ou aceitar. «Aceitará» é natural no contexto proverbial e evita tornar explícita uma situação matrimonial que o grego apenas pode sugerir.
- source_word: γυνή
  choice: uma mulher
  rationale: γυνή pode significar «mulher» ou «esposa». A formulação genérica favorece «uma mulher», enquanto a alternativa matrimonial é registrada em nota.
- source_word: ἔστιν δὲ
  choice: mas
  rationale: A conjunção introduz contraste entre as duas partes do provérbio; «mas» transmite essa força de modo direto e idiomático.
- source_word: θυγάτηρ θυγατρὸς
  choice: uma filha ... do que outra
  rationale: A repetição do substantivo integra uma construção comparativa com κρεῖσσον. A tradução explicita naturalmente em português a comparação entre uma filha e outra.
- source_word: κρεῖσσον
  choice: é melhor
  rationale: É o comparativo «melhor» ou «superior»; «é melhor» conserva o tom simples e proverbial.
theological_decisions:
- issue: Contexto social do provérbio
  choice: Apresentar a frase como uma observação geral sobre mulher e filhas, sem acrescentar explicação moral ou matrimonial.
  alternative: Traduzir γυνή por «esposa» e tornar a frase explicitamente relacionada ao casamento.
  rationale: O grego é breve e mantém alguma ambiguidade quanto ao contexto matrimonial. A tradução conserva a linguagem e a tensão social do texto sem suavizá-las nem ampliá-las interpretativamente.
translation_notes:
  register: Português atual, claro e digno, com estrutura proverbial concisa. Preferiu-se «homem» a «macho» por naturalidade no uso humano, registrando-se em nota a precisão lexical do grego.
