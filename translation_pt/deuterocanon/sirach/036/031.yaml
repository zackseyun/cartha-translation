base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: pt
  text: Pois quem confiará em um bandido bem equipado[a], que vai tropeçando de cidade em cidade? Assim é com o homem que não tem ninho[b] e se aloja onde quer que a noite o alcance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem cingido”; o termo grego se refere literalmente a estar com o cinto ajustado e, neste contexto, sugere prontidão para agir.
    reason: lexical_alternative
  - marker: b
    text: “Não tem ninho” é uma metáfora para não possuir morada fixa nem lugar seguro de repouso.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: bem equipado
  rationale: O adjetivo significa literalmente “bem cingido” e sugere alguém preparado para agir. Com “salteador”, “bem equipado” comunica essa prontidão sem afirmar de modo excessivamente específico que esteja armado.
- source_word: λῃστῇ
  choice: salteador
  rationale: O termo designa um ladrão ou bandido que pratica roubo, muitas vezes com violência. “Salteador” preserva melhor essa força do que o termo mais amplo “ladrão”.
- source_word: σφαλλομένῳ
  choice: anda aos tropeços
  rationale: O particípio pode indicar tropeçar, vacilar ou ser levado para fora do rumo. A expressão preserva a imagem de instabilidade, sem reduzi-la simplesmente a “vaguear”.
- source_word: νοσσιὰν
  choice: ninho
  rationale: A palavra designa literalmente um ninho. Mantê-la conserva a metáfora vívida de não possuir morada fixa nem lugar seguro de repouso.
- source_word: καταλύοντι
  choice: se aloja
  rationale: O verbo pode significar hospedar-se, alojar-se ou passar a noite. “Se aloja” é natural no contexto de alguém itinerante e sem residência fixa.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: onde quer que a noite o alcance
  rationale: A expressão se relaciona com o cair da tarde ou com ficar até tarde. Esta formulação idiomática transmite a ideia de parar onde estiver quando chega a noite, preservando o caráter itinerante.
- source_word: ἀνθρώπῳ
  choice: o homem
  rationale: O grego emprega o singular masculino em forma proverbial. “O homem” conserva essa forma representativa e estabelece naturalmente a comparação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial. A metáfora do “ninho” e a imagem de instabilidade em “anda aos tropeços” foram preservadas; “bem equipado” evita o arcaísmo pouco transparente de uma tradução estritamente literal.
