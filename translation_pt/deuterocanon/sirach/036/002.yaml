  yaml_path: translation/deuterocanon/sirach/036/002.yaml
  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
translation:
  language: pt
  text: Um homem sábio não odiará a lei, mas quem age com hipocrisia em relação a ela[a] é como um navio em meio à tempestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem se faz de hipócrita quanto a ela”. O particípio grego descreve alguém que representa um papel ou age com dissimulação.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  choice: um homem sábio
  rationale: Mantém o masculino singular explícito de ἀνήρ e o registro sapiencial natural de σοφός.
- source_word: οὐ μισήσει
  choice: não odiará
  rationale: Reproduz diretamente o futuro μισήσει e o sentido comum de μισέω, sem suavizá-lo para “desprezar”.
- source_word: νόμον
  choice: a lei
  rationale: Preserva a referência provável à Lei/Torá no contexto sapiencial judaico, sem eliminar a possível nuance mais ampla de instrução.
- source_word: ὁ δὲ ὑποκρινόμενος ἐν αὐτῷ
  choice: mas quem age com hipocrisia em relação a ela
  rationale: Expressa a força verbal do particípio ὑποκρινόμενος como conduta dissimulada e torna explícita, de modo natural em português, a relação indicada por ἐν αὐτῷ.
- source_word: ὡς ἐν καταιγίδι πλοῖον
  choice: é como um navio em meio à tempestade
  rationale: Conserva a comparação e a imagem de uma embarcação sujeita à instabilidade de uma tempestade violenta.
theological_decisions:
- issue: Referência de νόμον
  choice: “a lei”, provavelmente a Lei/Torá
  alternative: “instrução” em sentido geral
  rationale: Em Eclesiástico, νόμος frequentemente aponta para a Lei de Deus, mas a formulação simples preserva também a ressonância sapiencial de instrução.
- issue: Sentido de ὑποκρινόμενος
  choice: conduta hipócrita ou dissimulada em relação à lei
  alternative: rotular a pessoa simplesmente como “o hipócrita”
  rationale: O particípio apresenta uma ação ou postura contínua; a tradução evita reduzir essa força verbal a um rótulo estático.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “em relação a ela” evita a obscuridade de “nela” sem ampliar indevidamente o sentido; “em meio à tempestade” conserva a força da imagem náutica.
