- source_word: κοιλία
  choice: estômago
  rationale: No contexto da alimentação, o termo designa o órgão digestivo; “estômago” é claro e atual, sem a ambiguidade de “ventre”.
- source_word: ἔστιν δὲ
  choice: mas há
  rationale: Expressa a transição adversativa e conserva a construção existencial explícita do grego.
- source_word: βρῶμα βρώματος κάλλιον
  choice: alimento melhor que outro
  rationale: Torna idiomática em português a construção comparativa grega, preservando a ideia de que os alimentos diferem em qualidade.
