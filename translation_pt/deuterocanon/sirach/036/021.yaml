  text: The throat tastes the food of the hunt[b][a]; so an intelligent heart tests false words.
translation:
  language: pt
  text: A garganta prova o alimento obtido na caça[a]; assim, o coração sensato põe à prova[b] palavras falsas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “alimentos da caça”, “comida proveniente da caça” ou “carne de caça”.
    reason: alternative_reading
  - marker: b
    text: 'No grego, a segunda oração não traz verbo expresso: literalmente, “assim, o coração sensato, palavras falsas”. “Põe à prova” foi acrescentado para completar em português a comparação iniciada por “prova”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φάρυγξ
  choice: garganta
  rationale: Preserva o sentido anatômico básico e a imagem corporal do grego, sem ampliá-lo para “boca” nem interpretá-lo como “paladar”.
- source_word: γεύεται
  choice: prova
  rationale: Expressa o ato de experimentar pelo gosto e funciona naturalmente em português na comparação sapiencial.
- source_word: βρώματα θήρας
  choice: o alimento obtido na caça
  rationale: Traduz de modo idiomático o plural genérico βρώματα e torna clara a relação genitiva com θήρας, sem restringir necessariamente o sentido a “carne de caça”.
- source_word: καρδία συνετή
  choice: coração sensato
  rationale: Mantém “coração” como centro do entendimento e do juízo na antropologia sapiencial; “sensato” comunica a capacidade de compreender e discernir em português corrente.
- source_word: λόγους ψευδεῖς
  choice: palavras falsas
  rationale: Reproduz a expressão ampla do grego sem restringi-la a declarações formais nem acrescentar intencionalidade enganosa.
- source_word: '[verbo implícito em οὕτως καρδία συνετὴ λόγους ψευδεῖς]'
  choice: põe à prova
  rationale: A segunda oração é elíptica no texto grego. A expressão completa a comparação em português e comunica que o coração sensato examina as palavras, sem confundir esse exame com mera degustação literal.
