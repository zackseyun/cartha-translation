  yaml_path: translation/deuterocanon/sirach/036/014.yaml
  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: pt
  text: Tem misericórdia do povo, Senhor, que é chamado pelo teu nome, e de Israel, a quem tornaste semelhante a um primogênito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em interpretação: “a quem fizeste teu primogênito”, refletindo o tema bíblico mais amplo de Israel como filho primogênito de Deus (compare Êxodo 4:22). Mais literalmente, o grego diz: “a quem tornaste semelhante a um primogênito”.'
    reason: Registra a leitura interpretativa mais forte sem eliminar a formulação comparativa do texto grego.
lexical_decisions:
- source_word: ἐλέησον
  choice: Tem misericórdia
  rationale: O imperativo aoristo de ἐλεέω expressa uma súplica direta por ação compassiva. “Tem misericórdia” é natural, solene e corrente em português.
- source_word: λαόν
  choice: do povo
  rationale: Embora o substantivo esteja sem artigo no grego, o sentido é definido pelo contexto. Não se acrescenta “teu”, pois isso não está explícito no texto-fonte.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo é traduzido como forma direta de tratamento; em português, a pontuação já marca o vocativo, sem exigir a interjeição “ó”.
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: que é chamado pelo teu nome
  rationale: O particípio perfeito passivo preserva tanto a ideia de designação pelo nome de Deus quanto a condição resultante e contínua do povo assim chamado.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Mantém-se a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ὡμοίωσας
  choice: comparaste
  rationale: O verbo ὁμοιόω apresenta Israel em relação de semelhança com um primogênito. “Comparaste” preserva essa força comparativa sem transformar a frase numa declaração direta de identidade.
- source_word: πρωτόγονον
  choice: um primogênito
  rationale: O adjetivo substantivado é vertido de modo natural como “um primogênito”. Não se acrescenta “filho” no texto principal, pois o grego não o explicita, embora a imagem familiar o sugira.
theological_decisions:
- issue: Se a cláusula final declara que Israel é o primogênito de Deus ou afirma que Deus o comparou a um primogênito
  choice: a quem comparaste a um primogênito
  alternative: a quem fizeste teu primogênito
  rationale: A tradução principal conserva a força comparativa de ὡμοίωσας e não harmoniza silenciosamente a redação com Êxodo 4:22. A leitura mais forte, associada ao tema bíblico de Israel como primogênito de Deus, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se “teu” por sua naturalidade na linguagem bíblica e por combinar diretamente com o singular do grego. A construção evita acréscimos doutrinários e preserva a tensão da cláusula final.
