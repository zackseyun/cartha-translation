  text: In fiery wrath let the survivor be consumed[a], and let those who do injustice to your people meet destruction.
translation:
  language: pt
  text: Na ira ardente, seja consumido o sobrevivente[a], e encontrem a perdição os que cometem injustiça contra o teu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que está sendo salvo” ou “preservado”. A expressão grega é difícil neste contexto e pode referir-se a qualquer inimigo que até então tenha escapado da destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: Na ira ardente
  rationale: Expressa de modo natural o grego literalmente próximo de «na ira do fogo», preservando tanto a intensidade da ira como a imagem do fogo.
- source_word: καταβρωθήτω
  choice: seja consumido
  rationale: O imperativo passivo comunica a ideia de ser devorado ou inteiramente consumido; «consumido» harmoniza naturalmente com a imagem precedente do fogo.
- source_word: ὁ σωζόμενος
  choice: o sobrevivente
  rationale: No contexto hostil, provavelmente designa aquele que até então escapou da destruição. A nota conserva o sentido mais literal e a dificuldade da expressão.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: os que cometem injustiça contra o teu povo
  rationale: Mantém a força verbal do particípio e explicita de maneira natural que o povo de Deus é o alvo da injustiça, sem restringir o sentido a uma forma específica de opressão.
- source_word: εὕροισαν ἀπώλειαν
  choice: encontrem a perdição
  rationale: Preserva a imagem lexical de «encontrar» e a força optativa de uma petição por juízo. «Perdição» expressa ruína ou destruição grave sem transformar a frase em simples previsão.
theological_decisions:
- issue: Força imprecatória do versículo
  choice: Manter a oração por juízo como petição direta
  alternative: Suavizar a frase como previsão de um juízo futuro
  rationale: Tanto καταβρωθήτω como εὕροισαν exprimem desejo ou petição. A tradução conserva a tensão e a gravidade da imprecação.
- issue: Identidade de ὁ σωζόμενος
  choice: Entender contextualmente como o inimigo sobrevivente
  alternative: Traduzir de modo estritamente literal como «aquele que está sendo salvo/preservado»
  rationale: O contexto de julgamento favorece a referência a quem escapou até agora, mas a formulação grega permanece difícil; por isso, a alternativa literal é registrada em nota, sem apresentar a interpretação contextual como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem de «encontrem a perdição» conserva o tom elevado da oração sem soar excessivamente arcaica.
