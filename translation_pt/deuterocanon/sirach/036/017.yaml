translation:
  language: pt
  text: Dá testemunho às tuas criaturas desde o princípio[a] e levanta as profecias proferidas em teu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às tuas obras criadas no princípio”. A expressão grega é condensada e pode referir-se amplamente ao que Deus criou no princípio, não apenas a seres vivos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cumpre as profecias proferidas em teu nome”. O grego diz literalmente “levanta as profecias”, imagem que pode indicar que Deus as leve a efeito.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μαρτύριον
  choice: Dá testemunho
  rationale: Mantém diretamente o imperativo e o sentido de testemunho ou atestação, sem especificar de modo indevido a forma desse testemunho.
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  choice: às tuas criaturas que existem desde o princípio
  rationale: κτίσμα pode designar criatura ou coisa criada. A oração relativa explicita em português a ligação sintática comprimida entre ἐν ἀρχῇ e κτίσμασιν, sem restringir a referência a Israel ou apenas a seres vivos.
- source_word: ἔγειρον
  choice: faz levantar
  rationale: Conserva a metáfora básica de ἐγείρω e deixa em aberto se levantar as profecias significa cumpri-las, confirmá-las ou fazê-las voltar a ter força.
- source_word: προφητείας
  choice: as profecias
  rationale: Equivalente direto do substantivo grego no plural, entendido como palavras ou declarações proféticas.
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: proferidas em teu nome
  rationale: Acréscimo contextual de 'proferidas' torna natural a expressão portuguesa e apresenta as profecias como pronunciadas sob a autoridade de Deus.
theological_decisions:
- issue: Identidade das criaturas que existem desde o princípio
  choice: Mantém a referência ampla às criaturas ou coisas criadas por Deus desde o princípio.
  alternative: Entender a expressão especificamente como o antigo povo ou as tribos formadas por Deus.
  rationale: κτίσμασιν favorece lexicalmente seres ou coisas criadas, enquanto o texto grego não identifica expressamente Israel; por isso, a tradução não estreita a referência.
- issue: Sentido de levantar as profecias
  choice: Preserva a imagem de fazer as profecias se levantarem.
  alternative: Traduzir diretamente como 'cumpre as profecias'.
  rationale: O verbo pode sugerir que Deus leve as palavras proféticas a efeito, mas o grego não emprega o verbo usual para 'cumprir'. A formulação mantém abertas as ideias de cumprimento, confirmação e renovação de sua força.
translation_notes:
  register: Português moderno, digno e acessível, com formas pronominais amplamente compreensíveis. A construção incomum “faz levantar as profecias” é deliberada para preservar a metáfora e a tensão interpretativa do grego; a nota oferece a leitura idiomática provável.
