translation:
  language: pt
  text: Reúne todas as tribos de Jacó e dá-lhes a sua herança[a], como no princípio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e tu as herdarás, como no princípio” ou “e tu as repartirás como herança, como no princípio”. O verbo grego é raro e reúne ideias de herança, posse e repartição.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: Reúne
  rationale: O imperativo de συνάγω pede que Deus congregue as tribos; “reúne” é direto, natural e preserva a força da súplica.
- source_word: πάσας φυλὰς Ἰακώβ
  choice: todas as tribos de Jacó
  rationale: Tradução direta da expressão grega, mantendo “Jacó”, nome explicitamente presente no texto, sem substituí-lo por “Israel”.
- source_word: κατακληρονομήσεις
  choice: dá-lhes sua herança
  rationale: O verbo raro pertence ao campo semântico de herança, posse e repartição. Em português, esta formulação comunica com clareza a concessão ou restauração da herança, sem eliminar em nota as outras construções possíveis.
- source_word: αὐτούς
  choice: -lhes
  rationale: O pronome retoma as tribos. Embora seja objeto direto na construção grega, a expressão idiomática portuguesa “dar-lhes sua herança” exige pronome indireto.
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: como no princípio
  rationale: Preserva a comparação com a ordem ou situação original sem determinar se a referência específica é à primeira repartição da terra ou, de modo mais amplo, aos tempos antigos.
theological_decisions:
- issue: Sentido da linguagem de herança em κατακληρονομήσεις
  choice: Pedido para Deus conceder ou restaurar às tribos a herança delas.
  alternative: “tu as herdarás” ou “tu as tomarás por herança”
  rationale: A forma grega rara admite uma leitura mais literal em que as tribos são objeto da ação de herdar, mas também pode exprimir fazê-las entrar na posse de uma herança. O texto principal oferece a leitura contextual mais clara, enquanto a nota conserva a ambiguidade real.
- issue: Referência temporal de “como no princípio”
  choice: Manter a expressão aberta.
  alternative: Explicitar “como na primeira repartição da terra” ou “como antigamente”.
  rationale: O grego não identifica de maneira inequívoca qual momento inicial está em vista; por isso, a tradução não acrescenta uma especificação histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A súplica mantém forma direta e concisa; a nota registra a dificuldade lexical sem sobrecarregar o texto principal.
