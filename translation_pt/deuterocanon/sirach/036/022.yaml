  text: A crooked heart causes grief[b][a], and a very experienced man will repay him.
translation:
  language: pt
  text: Um coração tortuoso causará tristeza[a], e um homem de muita experiência lhe retribuirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “torcido” ou “perverso”.'
    reason: lexical_alternative
  - marker: b
    text: O grego também pode ser entendido de modo mais geral como “lhe responderá” ou “lhe dará uma retribuição”; não especifica a natureza dessa resposta.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  choice: coração
  rationale: Preserva a imagem bíblica do centro do pensamento, da disposição e do caráter.
- source_word: στρεβλὴ
  choice: tortuoso
  rationale: Comunica a ideia de algo moralmente torcido ou desviado sem especificar além do grego o grau de perversidade.
- source_word: δώσει λύπην
  choice: causará tristeza
  rationale: Expressa naturalmente em português o sentido de produzir dor ou pesar, mantendo o valor futuro do verbo.
- source_word: ἄνθρωπος
  choice: homem
  rationale: Mantém o singular masculino do provérbio grego; aqui designa um homem caracterizado por vasta experiência.
- source_word: πολύπειρος
  choice: de muita experiência
  rationale: Conserva a noção de alguém provado por numerosas experiências, com formulação natural e digna.
- source_word: ἀνταποδώσει
  choice: retribuirá
  rationale: Mantém o sentido recíproco de dar em resposta sem definir se a retribuição é favorável, punitiva ou meramente correspondente.
- source_word: αὐτῷ
  choice: lhe
  rationale: Preserva a referência pessoal singular, cujo antecedente está expresso de modo condensado no grego.
theological_decisions:
- issue: Masculino genérico ou específico em ἄνθρωπος
  choice: homem
  alternative: pessoa
  rationale: A forma grega é masculina singular e a máxima apresenta duas figuras pessoais; a tradução conserva essa forma sem transformar o enunciado em linguagem explicitamente inclusiva.
- issue: Valor de ἀνταποδώσει no contexto
  choice: lhe retribuirá
  alternative: lhe responderá; lhe dará o troco
  rationale: O grego não declara o conteúdo nem o valor moral da resposta. “Retribuirá” conserva essa tensão, enquanto “dará o troco” sugeriria retaliação e “responderá” enfraqueceria a reciprocidade do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo proverbial, os dois verbos no futuro e a ambiguidade da retribuição final.
