  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
translation:
  language: pt
  text: Nenhum mal[a] sobrevirá a quem teme o Senhor; mas, na provação[b], ele o livrará novamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Nenhum dano” ou “Nenhum infortúnio”. A palavra grega pode indicar mal, dano ou desgraça.
    reason: lexical_alternative
  - marker: b
    text: Ou “no teste” ou “na tentação”. A palavra grega pode indicar provação, teste ou tentação; aqui o contexto favorece adversidade ou teste.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ
  choice: a quem teme
  rationale: O particípio substantivado descreve genericamente a pessoa caracterizada por temer o Senhor. A formulação preserva o sentido proverbial e soa natural em português.
- source_word: Κύριον
  choice: o Senhor
  rationale: Emprega o título divino consagrado em português, com artigo exigido pelo uso natural da língua.
- source_word: οὐκ ἀπαντήσει
  choice: nenhum ... sobrevirá
  rationale: ἀπαντάω expressa encontro e, neste contexto, aquilo que vem sobre alguém ou lhe acontece. “Sobrevirá” comunica esse sentido sem tornar a frase artificial.
- source_word: κακόν
  choice: mal
  rationale: “Mal” conserva a amplitude de κακόν, que pode abranger tanto o mal em sentido geral quanto dano ou infortúnio.
- source_word: ἀλλʼ ἐν πειρασμῷ
  choice: mas, na provação
  rationale: πειρασμός pode indicar provação, teste ou tentação. O contexto de adversidade e livramento favorece “provação”, sem excluir totalmente a ideia de teste.
- source_word: καὶ πάλιν
  choice: novamente
  rationale: πάλιν indica repetição, isto é, livramento renovado ou reiterado.
- source_word: ἐξελεῖται
  choice: ele o livrará
  rationale: O verbo significa retirar de perigo, libertar ou livrar. Os pronomes explicitam em português o Senhor como sujeito contextual e a pessoa temente como objeto.
theological_decisions:
- issue: Sujeito implícito de ἐξελεῖται
  choice: 'O Senhor é retomado como sujeito: “ele o livrará”.'
  alternative: Formulação impessoal, como “haverá livramento para essa pessoa”.
  rationale: A menção imediatamente anterior ao Senhor e o padrão sapiencial de livramento divino tornam essa retomada a leitura contextual mais natural, embora o sujeito não esteja expresso no verbo grego.
- issue: Amplitude de κακόν diante da provação subsequente
  choice: Manter “mal” em sentido amplo.
  alternative: Restringir a “dano” ou “infortúnio”.
  rationale: 'A tradução preserva a tensão do provérbio: afirma que nenhum mal sobrevirá ao temente, mas reconhece logo em seguida que ele passa por provação e precisa ser livrado. Não se resolve essa tensão acrescentando uma qualificação ausente do grego.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Sobrevirá” mantém um tom sapiencial sem ser arcaico; “a quem teme” evita a rigidez de “àquele que teme”.
