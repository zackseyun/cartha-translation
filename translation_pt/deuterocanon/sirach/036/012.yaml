  yaml_path: translation/deuterocanon/sirach/036/012.yaml
  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: pt
  text: 'Esmaga as cabeças dos governantes inimigos, que dizem: “Não há ninguém além de nós”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não existe ninguém senão nós”. O grego expressa autoexaltação exclusiva; a frase pode soar como uma pretensão quase divina, mas o texto não menciona “Deus”.'
    reason: Registra a alternativa lexical e preserva a possível força teológica sem a inserir no texto principal.
lexical_decisions:
- source_word: σύντριψον
  choice: Esmaga
  rationale: O imperativo aoristo de συντρίβω comunica destruição violenta. “Esmaga” preserva a força e a imagem concreta do grego em português natural.
- source_word: κεφαλὰς
  choice: as cabeças
  rationale: Mantém o objeto plural e a imagem corporal explícita, sem a suavizar como simples referência ao poder ou à liderança.
- source_word: ἀρχόντων ἐχθρῶν
  choice: dos governantes inimigos
  rationale: A construção genitiva pode descrever governantes hostis ou governantes pertencentes aos inimigos. “Governantes inimigos” é conciso e natural, preservando o sentido adversarial sem especificar povo ou nação.
- source_word: λεγόντων
  choice: que dizem
  rationale: A oração relativa reproduz de modo fluente a função caracterizadora do particípio grego.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Não há ninguém além de nós
  rationale: Expressa a exclusividade arrogante da declaração sem acrescentar “Deus”, palavra ausente do texto grego.
theological_decisions:
- issue: Natureza da afirmação dos governantes inimigos
  choice: 'Traduzir como uma declaração de exclusividade arrogante: “Não há ninguém além de nós”.'
  alternative: “Não há Deus além de nós” ou “Não existe ninguém senão nós”.
  rationale: O grego pode sugerir autoexaltação extrema, talvez com pretensão quase divina, mas não contém a palavra “Deus”. A tradução mantém essa possível tensão sem tornar explícito o que a fonte deixa implícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem é direta, e a violência da imagem original foi mantida. O marcador da nota foi colocado após a declaração à qual a nota se refere.
