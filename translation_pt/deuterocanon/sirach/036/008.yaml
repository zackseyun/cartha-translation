  text: By the knowledge of the Lord they were distinguished, and he altered seasons and festivals.
translation:
  language: pt
  text: Pelo conhecimento do Senhor foram distinguidos, e ele alterou os tempos determinados e as festas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: Pelo conhecimento do Senhor
  rationale: Preserva a relação instrumental ou causal possível de ἐν e acompanha de perto a formulação grega sem explicitar além do texto se esse conhecimento pertence ao Senhor ou diz respeito a ele.
- source_word: διεχωρίσθησαν
  choice: foram distinguidos
  rationale: O passivo indica que foram separados ou diferenciados; “distinguidos” conserva essa ideia e deixa o referente plural dependente do contexto.
- source_word: καιρούς
  choice: os tempos determinados
  rationale: καιρός designa tempos ou ocasiões apropriadas, não simplesmente o tempo cronológico; “tempos determinados” expressa essa nuance.
- source_word: ἑορτάς
  choice: as festas
  rationale: Tradução natural para celebrações festivas, inclusive festas religiosas, sem acrescentar uma especificação ausente do verso.
- source_word: ἠλλοίωσεν
  choice: alterou
  rationale: Mantém o sentido de mudar ou tornar diferente, distinguindo-o de uma mera sucessão temporal.
theological_decisions:
- issue: Agente implícito de ἠλλοίωσεν
  choice: ele
  alternative: o Senhor
  rationale: O verbo grego tem sujeito implícito recuperado do contexto; o pronome conserva essa forma sem repetir interpretativamente o nome divino.
- issue: Ambiguidade de ἐν γνώσει Κυρίου
  choice: Pelo conhecimento do Senhor
  alternative: Segundo o conhecimento do Senhor / No conhecimento do Senhor
  rationale: A formulação escolhida mantém a ambiguidade do genitivo e comunica de modo natural a possível força instrumental de ἐν, sem decidir se se trata do conhecimento possuído pelo Senhor ou do conhecimento acerca dele.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com estrutura próxima ao grego. O referente de “foram distinguidos” permanece implícito como no original e deve ser recuperado do contexto.
