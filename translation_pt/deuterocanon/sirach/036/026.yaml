  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: pt
  text: 'Quem adquire uma esposa dá início a uma aquisição: uma auxiliadora que lhe corresponde[b] e um pilar de repouso.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma posse” ou “um patrimônio”. O grego emprega palavras da mesma raiz em “adquire” e “aquisição/posse”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo ele”; também pode significar “adequada para ele” ou “à sua altura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  choice: Quem adquire
  rationale: A construção participial tem sentido proverbial e genérico. “Quem adquire” é natural em português e mantém a ligação lexical com “aquisição”.
- source_word: γυναῖκα
  choice: uma esposa
  rationale: No contexto de formação do lar, γυνή designa especificamente a esposa, não apenas uma mulher.
- source_word: ἐνάρχεται
  choice: dá início a
  rationale: Expressa o começo de algo e rege com naturalidade o substantivo seguinte em português.
- source_word: κτήσεως
  choice: uma aquisição
  rationale: Mantém o jogo de palavras entre κτώμενος e κτήσεως por meio de “adquire” e “aquisição”, embora a formulação deliberadamente conserve certa estranheza do grego.
- source_word: βοηθὸν
  choice: uma auxiliadora
  rationale: Preserva a referência pessoal da palavra e sua relação a “esposa”; “ajuda” seria mais fluente, mas poderia soar como uma abstração.
- source_word: κατʼ αὐτὸν
  choice: que lhe corresponde
  rationale: Conserva a ideia de correspondência sem decidir de modo excessivo entre semelhança, adequação e compatibilidade.
- source_word: στύλον
  choice: um pilar
  rationale: Mantém a metáfora arquitetônica concreta do grego.
- source_word: ἀναπαύσεως
  choice: de repouso
  rationale: “Repouso” comunica descanso e alívio em registro digno e combina naturalmente com a imagem do pilar.
theological_decisions:
- issue: Sujeito masculino do provérbio
  choice: Quem adquire uma esposa
  alternative: O homem que adquire uma esposa
  rationale: O referente continua sendo masculino por causa de “esposa”, mas “quem” reproduz de maneira natural a função proverbial do particípio grego sem acrescentar uma identificação nominal ausente do texto.
- issue: Sentido relacional de κατʼ αὐτόν
  choice: que lhe corresponde
  alternative: adequada para ele
  rationale: “Corresponde” preserva a abertura da expressão grega entre correspondência e adequação, evitando impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A formulação conserva o paralelismo compacto e o jogo lexical do grego; “auxiliadora” foi preferido a “ajuda” para deixar claro que se trata de uma pessoa.
