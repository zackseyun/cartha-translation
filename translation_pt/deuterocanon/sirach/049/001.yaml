base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: pt
  text: O nome de Josias[a] é como incenso aromático preparado por um perfumista; sua memória é doce ao paladar como o mel e como música[b] num banquete regado a vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “A memória de Josias é uma mistura de incenso, preparada pelo trabalho de um perfumista; em toda boca será doce como o mel e como música num banquete regado a vinho”. O hebraico destaca “o nome” na primeira oração, enquanto o grego destaca “a memória”.'
    reason: alternative_reading
  - marker: b
    text: Ou “como um cântico num banquete regado a vinho”. O hebraico מזמור pode significar “cântico”, enquanto o paralelo grego favorece o sentido mais amplo “música”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: O nome
  rationale: O hebraico שם significa normalmente “nome”. A ideia de lembrança ou reputação permanece explícita na segunda oração por meio de זכרו, “sua memória”.
- source_word: כקטורת סמים
  choice: como incenso aromático
  rationale: קטורת é “incenso”, e סמים designa substâncias aromáticas usadas em sua composição. A formulação comunica a fragrância e o caráter composto do incenso sem soar técnica.
- source_word: וממלה מעשה רוקח
  choice: preparado por um perfumista
  rationale: A forma hebraica וממלה é difícil, mas o contexto e o grego ἐσκευασμένον apontam para algo preparado ou composto. רוקח é o profissional que mistura perfumes, especiarias ou unguentos; “perfumista” é claro e atual.
- source_word: בחך כדבש ימתיק זכרו
  choice: sua memória é doce ao paladar como o mel
  rationale: חך é literalmente “paladar”; זכרו significa “sua memória/lembrança”. O imperfeito ימתיק é entendido aqui em sentido descritivo ou proverbial, não necessariamente futuro.
- source_word: וכמזמור
  choice: e como música
  rationale: מזמור pode ser “cântico” ou composição musical; o paralelo grego μουσικά favorece o sentido mais amplo “música”, adequado ao contexto festivo.
- source_word: על משתה היין
  choice: num banquete regado a vinho
  rationale: משתה היין descreve um banquete ou festa com vinho. A expressão escolhida é natural em português e preserva esse cenário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao paladar” preserva a imagem hebraica de חך; “banquete regado a vinho” evita uma construção excessivamente literal e pouco natural. Os marcadores aparecem no texto principal junto às questões que esclarecem.
