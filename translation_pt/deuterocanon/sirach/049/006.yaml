base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: pt
  text: Incendiaram a cidade santa e deixaram desertas as suas ruas[a], pela mão de Yirmeyahu[b]; pois o afligiram, ele que fora formado desde o ventre como profeta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “caminhos” ou “vias”; no contexto da cidade, “ruas” expressa o sentido.'
    reason: lexical_alternative
  - marker: b
    text: Ou “por intermédio de Yirmeyahu”. A expressão hebraica “pela mão de” é comprimida e pode indicar uma ligação com seu ministério ou anúncio profético.
    reason: alternative_reading
  - marker: c
    text: A frase recorda o chamado de Yirmeyahu desde o ventre; compare Jeremias 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ויציתו
  choice: Incendiaram
  rationale: O verbo indica atear fogo ou queimar. “Incendiaram” expressa de modo direto e natural a destruição da cidade.
- source_word: קרית קדש
  choice: a cidade santa
  rationale: A construção hebraica significa literalmente “cidade de santidade” e corresponde naturalmente a “cidade santa”.
- source_word: וישמו
  choice: deixaram desertas
  rationale: O verbo descreve devastação e desolação. Esta formulação conserva a imagem e soa natural em português.
- source_word: ארחתיה
  choice: as suas ruas
  rationale: O substantivo pode significar caminhos ou vias; no contexto urbano, “ruas” comunica melhor o sentido, em consonância com o paralelo grego ὁδοὺς.
- source_word: ביד ירמיהו
  choice: pela mão de Yirmeyahu
  rationale: A expressão idiomática pode significar “por intermédio de” ou indicar uma ligação com a atuação profética. A tradução mantém a formulação comprimida e ambígua do hebraico.
- source_word: כי ענוהו
  choice: pois o afligiram
  rationale: O verbo indica que ele foi oprimido, humilhado ou maltratado. “Afligiram” preserva a amplitude sem especificar indevidamente a forma do sofrimento.
- source_word: מרחם נוצר נביא
  choice: desde o ventre, havia sido formado profeta
  rationale: A formulação conserva a designação profética desde o ventre e a provável alusão ao chamado narrado em Jeremias 1:5.
- source_word: ירמיהו
  choice: Yirmeyahu
  rationale: Translitera o nome hebraico em vez de substituí-lo pela forma portuguesa tradicional.
theological_decisions:
- issue: Relação sintática de ביד ירמיהו com a destruição da cidade e o sofrimento do profeta
  choice: Manter “pela mão de Yirmeyahu” no texto principal
  alternative: “por intermédio de Yirmeyahu”, “em conexão com Yirmeyahu” ou “como Yirmeyahu havia anunciado”
  rationale: O hebraico é comprimido, e o paralelo grego também conserva a expressão “pela mão de Jeremias”. Manter o idioma no texto evita resolver de modo excessivo se a frase aponta para mediação profética, anúncio ou outra conexão.
- issue: Relação entre a aflição de Yirmeyahu e sua formação como profeta desde o ventre
  choice: Ligar as orações com “e”, sem inserir uma concessão explícita
  alternative: “embora tivesse sido formado profeta desde o ventre”
  rationale: O hebraico traz uma coordenação simples. A tradução evita acrescentar “embora”, preservando a tensão e a relação lógica não explicitada pelo texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla legibilidade brasileira. Conserva-se o nome hebraico transliterado e a expressão difícil “pela mão de” para não apagar a ambiguidade do original.
