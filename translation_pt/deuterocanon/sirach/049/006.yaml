  to: Incendiaram a cidade santa e deixaram desertas as suas ruas[a], pela mão de Yirmeyahu[b]; pois o afligiram, ele que fora formado desde o ventre como profeta[c].
  rationale: 'A única alteração necessária é estilística e sintática: substitui-se “desde o ventre, havia sido formado profeta” por “fora formado desde o ventre como profeta”. Isso melhora a fluência do português e expressa com precisão a predicação “formado ... profeta”, sem mudar o tempo, a referência a Yirmeyahu ou a ambiguidade preservada em “pela mão de Yirmeyahu”.'
