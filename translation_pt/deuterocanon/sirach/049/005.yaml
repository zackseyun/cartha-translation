  text: And they gave their horn backward[b][a], and their glory to a foolish foreign nation.
translation:
  language: pt
  text: E entregaram seu chifre[b] a outros[a], e sua glória a uma nação estrangeira insensata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico preservado traz uma expressão incomum, literalmente “para trás” ou semelhante; o paralelo grego apoia o sentido “a outros”.
    reason: textual_variant
  - marker: b
    text: Ou “seu poder”. No hebraico e no grego, “chifre” é uma metáfora de força ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: entregaram
  rationale: Embora a forma hebraica seja singular, o contexto e o paralelo grego apresentam sujeito plural. “Entregaram” comunica naturalmente a cessão de poder e glória descrita no verso.
- source_word: קרנם
  choice: seu chifre
  rationale: קֶרֶן significa literalmente “chifre” e funciona como metáfora bíblica de força ou poder. O grego κέρας confirma a imagem, que é preservada no texto.
- source_word: לאחור
  choice: a outros
  rationale: A forma hebraica, literalmente “para trás” ou semelhante, é incomum neste contexto. O paralelo grego ἑτέροις sustenta claramente “a outros”, provável sentido do texto subjacente.
- source_word: כבודם
  choice: sua glória
  rationale: כָּבוֹד pode significar glória, honra ou esplendor; “glória” preserva o registro poético e corresponde ao grego δόξα.
- source_word: גוי
  choice: nação
  rationale: גּוֹי designa aqui uma coletividade nacional; “nação” mantém esse sentido político e coletivo.
- source_word: נבל
  choice: insensata
  rationale: נָבָל expressa insensatez com conotação moral. “Insensata” é natural e mantém a força avaliativa sem acrescentar uma categoria teológica mais específica.
- source_word: נכרי
  choice: estrangeira
  rationale: נָכְרִי significa estrangeiro ou alheio; “estrangeira” é claro no português atual e corresponde ao grego ἀλλοτρίῳ.
theological_decisions:
- issue: Força metafórica de “chifre”
  choice: Preservar “chifre” no texto principal.
  alternative: “força” ou “poder”
  rationale: A imagem bíblica tradicional representa força e poder. Mantê-la conserva a textura literária e teológica da fonte, enquanto a nota esclarece o sentido.
- issue: Irregularidade textual em לאחור
  choice: Traduzir “a outros” segundo o sentido apoiado pelo paralelo grego.
  alternative: “para trás”
  rationale: O hebraico preservado é estranho no contexto, ao passo que o grego oferece uma leitura coerente, provavelmente baseada numa forma hebraica diferente. A nota mantém transparente a incerteza textual.
- issue: Número do verbo ויתן
  choice: Usar o plural “entregaram”, em conformidade com o contexto e o paralelo grego.
  alternative: “ele entregou”
  rationale: A forma massorética preservada é singular, mas o referente contextual é plural e o grego traz ἔδωκαν, “deram”. O plural evita introduzir um sujeito singular não identificado.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética concisa. A metáfora bíblica do chifre foi preservada, e as incertezas textuais relevantes foram explicitadas em notas.
