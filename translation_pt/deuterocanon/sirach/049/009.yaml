translation:
  language: pt
  text: Também fez menção de Jó[a], que manteve todos os caminhos da justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma redação diferente: “Pois também se lembrou dos inimigos na chuva e fez o bem aos que endireitam os caminhos.” O texto hebraico diz: “Também fez menção de Jó, que manteve todos os caminhos da justiça.”'
    reason: Registra a variante substancial do paralelo grego e deixa transparente que o texto principal segue o testemunho hebraico preservado.
lexical_decisions:
- source_word: וגם
  choice: Também
  rationale: Conserva a força aditiva da expressão hebraica e dá continuidade natural à sequência de figuras recordadas.
- source_word: הזכיר
  choice: mencionou
  rationale: Traduz diretamente o sentido de fazer menção ou trazer alguém à lembrança; o paralelo grego favorece “lembrou-se”, mas o hebraico preservado é a base principal.
- source_word: את איוב
  choice: Jó
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ומכלכל
  choice: que se manteve firme
  rationale: O verbo pode expressar sustentar, manter ou conduzir. Nesta construção, a formulação reflexiva comunica de modo natural a constância de Jó na conduta justa, sem reduzir o termo a simples apoio material.
- source_word: כל דרכי צדק
  choice: em todos os caminhos da justiça
  rationale: Preserva a metáfora hebraica dos caminhos e mantém צדק como “justiça”, termo que abrange retidão moral sem eliminar sua dimensão ética e judicial.
theological_decisions:
- issue: A relação entre o texto hebraico preservado e o paralelo grego, cuja redação diverge substancialmente
  choice: 'Seguir no texto principal o hebraico: “Também mencionou Jó, que se manteve firme em todos os caminhos da justiça.”'
  alternative: 'Seguir o paralelo grego: “Pois também se lembrou dos inimigos na chuva e fez o bem aos que endireitam os caminhos.”'
  rationale: Onde o hebraico de Sirácida está preservado com alta confiança, ele deve orientar o texto principal. Como o grego representa uma tradição textual significativamente diferente, sua leitura é registrada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A expressão “caminhos da justiça” conserva a imagem hebraica; “se manteve firme” evita a construção pouco idiomática “sustentou todos os caminhos” e expressa constância sem impor uma interpretação denominacional.
