  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
translation:
  language: pt
  text: Como José, nasceu um homem; e até mesmo seu corpo recebeu cuidados.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Mas José tornou-se homem, líder de seus irmãos, sustentáculo do povo, e seus ossos receberam cuidado.” O testemunho hebraico aqui é mais breve.'
    reason: alternative_reading
  - marker: b
    text: A expressão provavelmente se refere ao cuidado posterior com os restos mortais de José e ao seu sepultamento; compare Êxodo 13:19 e Josué 24:32.
    reason: cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: Como José
  rationale: O prefixo כ expressa comparação (“como”). A formulação mantém a concisão e a elipse do testemunho hebraico.
- source_word: אם נולד גבר
  choice: nasceu um homem
  rationale: A sequência é entendida conforme a leitura contextual indicada pelo texto fornecido, נולד גבר, sem acrescentar ao texto principal os elogios presentes apenas no paralelo grego. O hebraico é abrupto, e a tradução preserva essa concisão.
- source_word: גבר
  choice: homem
  rationale: Embora גבר possa sugerir vigor, “homem” é o equivalente mais direto aqui e evita intensificar uma nuance incerta.
- source_word: גויתו
  choice: seu corpo
  rationale: גויה designa o corpo e, em certos contextos, o cadáver. “Corpo” conserva a expressão hebraica sem substituí-la pela especificação grega “ossos”.
- source_word: נפקדה
  choice: recebeu cuidado
  rationale: O passivo de פקד pode indicar que alguém ou algo foi atendido, lembrado ou objeto de cuidado. No contexto dos restos mortais de José, “recebeu cuidado” comunica naturalmente a atenção funerária sem eliminar toda a amplitude do verbo.
theological_decisions:
- issue: Texto hebraico mais breve em contraste com o paralelo grego ampliado
  choice: Seguir o hebraico no texto principal e registrar a forma grega mais extensa em nota.
  alternative: 'Traduzir no texto principal: “Mas José tornou-se homem, líder de seus irmãos, sustentáculo do povo, e seus ossos receberam cuidado.”'
  rationale: Como o hebraico está preservado, ele orienta o texto principal. A ampliação encomiástica do grego é relevante como testemunho paralelo, mas não deve ser inserida silenciosamente no hebraico mais curto.
- issue: Sentido post mortem de נפקדה
  choice: Traduzir de modo amplo como “recebeu cuidado” e explicar a provável referência funerária em nota.
  alternative: Especificar no texto principal “seus restos mortais foram sepultados com honra”.
  rationale: A alternativa explicita demais tanto o objeto quanto a ação. A tradução escolhida preserva a tensão lexical do hebraico, enquanto a nota esclarece o contexto tradicional.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e compreensão internacional. “Recebeu cuidado” soa mais natural do que o passivo rígido “foi cuidado” e mantém o caráter discreto da referência funerária. Os marcadores [a] e [b] aparecem no texto principal.
