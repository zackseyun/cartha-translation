  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: pt
  text: Como louvaremos Zorobabel? Ele era como um anel de sinete na mão direita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como engrandeceremos Zorobabel?” O paralelo grego traz “engrandecer”, enquanto o hebraico também permite “louvar” ou “exaltar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um selo” ou “como um sinete”. A imagem provavelmente evoca honra e valor especial; compare o uso profético da figura do sinete em Ageu 2:23.'
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: Como louvaremos
  rationale: A expressão interrogativa com forma volitiva comunica admiração retórica. “Como louvaremos...?” é natural em português e mantém a força do hebraico; o paralelo grego também admite a ideia de exaltar ou engrandecer.
- source_word: זרבבל
  choice: Zorobabel
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: כחותם
  choice: como um anel de sinete
  rationale: חותם pode designar um selo ou sinete. Como a imagem o situa na mão, “anel de sinete” torna concreto o objeto sem eliminar o valor metafórico.
- source_word: על יד ימין
  choice: na mão direita
  rationale: Reproduz de modo claro e idiomático a localização indicada pelo hebraico, confirmada pelo paralelo grego.
theological_decisions:
- issue: Imagem metafórica de Zorobabel como selo ou sinete na mão direita
  choice: Conservar diretamente a metáfora do anel de sinete
  alternative: Explicitar no texto principal que Zorobabel era honrado, escolhido ou precioso
  rationale: A imagem pode sugerir honra, escolha e valor especial, além de evocar Ageu 2:23, mas o versículo não explica essas implicações. A tradução preserva a tensão e deixa a associação para a nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A pergunta retórica e a metáfora concreta do original foram preservadas; as alternativas lexicais relevantes aparecem nas notas.
