base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: pt
  text: Também Yehoshua, filho de Jeozadaque,[a] ergueram um templo santo, estabelecido para glória eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A edição hebraica também conserva entre colchetes, como leitura textualmente incerta: “Também Yehoshua, filho de Jeozadaque, que em meio à aflição ergueu um altar.” O paralelo grego não traz a referência ao altar.'
    reason: textual_variant
lexical_decisions:
- source_word: גם
  choice: Também
  rationale: Introduz Yehoshua como mais um dos líderes celebrados na sequência; a forma simples e natural preserva a ligação com o contexto.
- source_word: יהושע בן יהוצדק
  choice: Yehoshua, filho de Jeozadaque
  rationale: Mantém a forma hebraica do primeiro nome por transliteração e usa a forma portuguesa consagrada e reconhecível para Jehozadak.
- source_word: אשר במצוק הקימו מזבח
  choice: que em meio à aflição ergueu um altar
  rationale: מצוק indica aperto, angústia ou aflição; 'em meio à aflição' comunica naturalmente a circunstância. הקימו é entendido no singular pelo referente Yehoshua, embora a forma consonantal possa ser lida como plural; a cláusula inteira é textualmente incerta.
- source_word: וירימו
  choice: e eles ergueram
  rationale: Preserva tanto o sentido de levantar/construir quanto o sujeito plural expresso pelo verbo hebraico, sem identificar além do texto quem participou da obra.
- source_word: היכל קדש
  choice: um templo santo
  rationale: היכל designa o templo ou santuário, e קדש lhe confere caráter sagrado. O artigo indefinido reflete a ausência de artigo no hebraico.
- source_word: ומכונן
  choice: estabelecido
  rationale: Expressa algo firmemente assentado ou consolidado; o singular concorda naturalmente com 'templo'.
- source_word: לכבוד עולם
  choice: para glória eterna
  rationale: כבוד abrange glória e honra, enquanto עולם comunica duração permanente; a formulação mantém o tom elevado e conciso.
theological_decisions:
- issue: Status da cláusula hebraica sobre Yehoshua e o altar
  choice: Incluí-la no texto principal com marcador de nota
  alternative: Omiti-la do texto principal e registrá-la apenas em nota
  rationale: A edição hebraica fornecida conserva toda a cláusula entre colchetes, sinalizando incerteza, mas ela faz parte da evidência textual apresentada. Sua inclusão com nota torna a incerteza visível sem apagar a leitura hebraica; o paralelo grego confirma o nome de Yehoshua, mas não contém a referência ao altar.
- issue: Mudança do singular para o plural
  choice: Manter 'ergueu' na cláusula relativa e 'eles ergueram' na oração seguinte
  alternative: Uniformizar os verbos no singular ou no plural
  rationale: 'A tradução preserva a tensão gramatical da forma transmitida: a cláusula relativa se refere a Yehoshua, enquanto וירימו é inequivocamente plural. Não se acrescenta uma identificação dos demais agentes.'
translation_notes:
  register: Português atual, claro e solene, com sintaxe próxima do hebraico sem artificialidade. A forma 'Yehoshua' preserva a política de transliteração do nome pessoal; 'Jeozadaque' favorece reconhecimento e legibilidade em português. O ponto e vírgula conserva a transição abrupta da cláusula singular para o verbo plural.
