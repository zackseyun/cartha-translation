  text: to uproot and to tear down and to destroy[a], to overthrow[b]; and likewise to build and to plant and to raise high.
translation:
  language: pt
  text: para arrancar, derrubar, destruir e arruinar; e também para construir, plantar e pôr no alto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico termina com mais um verbo positivo, que pode significar “pôr no alto”, “exaltar” ou “tornar seguro”. O paralelo grego é mais curto e termina com “construir e plantar”.
    reason: textual_variant
  - marker: b
    text: Esta sequência evoca deliberadamente a comissão profética de Jeremias 1:10, embora a formulação hebraica de Sirácida não seja idêntica.
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: arrancar
  rationale: Expressa tirar pela raiz e preserva, em português corrente, a imagem concreta da comissão profética.
- source_word: לנתוץ
  choice: derrubar
  rationale: Verbo natural para a demolição de construções e adequado à sequência de ações destrutivas.
- source_word: ולהאביד
  choice: destruir
  rationale: O causativo de אבד indica causar perdição ou ruína; “destruir” é a equivalência direta e clara.
- source_word: להרוס
  choice: arruinar
  rationale: Mantém a ideia de devastação sem repetir “derrubar”, preservando a sobreposição semântica entre os verbos hebraicos.
- source_word: וכן
  choice: e também
  rationale: Marca de forma simples e natural a passagem para a metade positiva e paralela da comissão.
- source_word: לבנות
  choice: construir
  rationale: Traduz o verbo sem acrescentar a noção não explícita de reconstrução.
- source_word: לנטע
  choice: plantar
  rationale: Equivalente usual que conserva o par profético “construir e plantar”.
- source_word: ולהשגיב
  choice: pôr em lugar alto
  rationale: Preserva o campo semântico de elevar ou colocar no alto sem decidir de modo excessivamente específico entre exaltação e segurança.
theological_decisions:
- issue: Eco intertextual da comissão profética de Jeremias
  choice: Preservar a sequência de infinitivos e sua cadência, seguindo a redação hebraica de Sirácida.
  alternative: Conformar a frase exatamente a Jeremias 1:10 ou adotar a sequência grega mais curta.
  rationale: O hebraico alude claramente à comissão de Jeremias, mas sua formulação não é idêntica; a tradução mantém tanto a alusão quanto a diferença textual.
- issue: Verbo final ולהשגיב em contraste com o texto grego mais curto
  choice: Incluir “pôr em lugar alto” no texto principal.
  alternative: Omitir o verbo final ou vertê-lo especificamente como “exaltar” ou “tornar seguro”.
  rationale: A prioridade do testemunho hebraico extante favorece sua inclusão, enquanto a nota registra a ausência no paralelo grego e a amplitude semântica do verbo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação verbal conserva a cadência profética do hebraico; a repetição de “para” divide com clareza as ações destrutivas e construtivas.
