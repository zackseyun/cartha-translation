base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/013.yaml
  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: pt
  text: Neemias — honrada seja a sua memória —, que reergueu as nossas ruínas[a], curou a nossa devastação e instalou portas e ferrolhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “que levantou para nós muralhas caídas, estabeleceu portões e barras e reconstruiu as nossas moradias ou locais de construção”. O testemunho hebraico fala mais amplamente de “nossas ruínas” e “nossa devastação” e emprega literalmente o verbo “curar” para a restauração.'
    reason: alternative_reading
lexical_decisions:
- source_word: יאדר זכרו
  choice: honrada seja a sua memória
  rationale: Reproduz em português natural a força beneditória da expressão hebraica, em vez de reduzi-la à simples afirmação de que Neemias é lembrado.
- source_word: המקים
  choice: que reergueu
  rationale: O causativo de קום descreve a restauração do que havia caído. “Reergueu” preserva a imagem verbal e concorda com o paralelo grego, sem restringi-la desde logo à reconstrução de muralhas.
- source_word: חרבתינו
  choice: as nossas ruínas
  rationale: O hebraico designa amplamente lugares arruinados. O paralelo grego especifica muralhas caídas, mas a tradução mantém a formulação mais abrangente do testemunho hebraico.
- source_word: וירפא
  choice: restaurou
  rationale: O sentido literal é “curou”. No contexto de danos urbanos, “restaurou” comunica com naturalidade a metáfora de sanar a devastação; a nota registra a imagem hebraica.
- source_word: הריסתינו
  choice: a nossa devastação
  rationale: Designa o estado ou resultado do que foi derrubado. “Devastação” distingue o termo das “ruínas” anteriores e mantém um registro digno e corrente.
- source_word: ויצב
  choice: assentou
  rationale: Expressa colocar firmemente em posição e combina de modo natural com elementos instalados em entradas fortificadas.
- source_word: דלתים ובריח
  choice: portas e trancas
  rationale: O hebraico traz literalmente portas e uma barra de fechamento. “Trancas” torna clara a função de segurança; no contexto, são as folhas das portas dos portões da cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção optativa preserva a bênção sobre a memória de Neemias; “reergueu” conserva a imagem concreta, enquanto “restaurou” evita em português uma formulação artificial sem ocultar a metáfora hebraica, registrada em nota.
