base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/002.yaml
  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
translation:
  language: pt
  text: Pois ele teve compaixão de nosso desvio[a] e removeu as abominações da vaidade[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego apresenta uma leitura mais positiva, associada ao retorno ou à conversão do povo; pode ser entendido, por exemplo, como “ele foi bem-sucedido na conversão do povo”. O hebraico preservado diz “nosso desvio”, ao passo que o grego reflete a ideia de retorno.
    reason: alternative_reading
  - marker: b
    text: “Abominações da vaidade” provavelmente se refere a abominações idolátricas. No hebraico bíblico, “vaidade” também pode significar “vazio” ou “insubstancialidade” e funcionar como designação polêmica dos ídolos.
    reason: lexical_alternative
  - marker: c
    text: O paralelo grego traz “abominações da transgressão da lei”, diferentemente do hebraico “abominações da vaidade”.
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: se compadeceu
  rationale: A forma hebraica é difícil, mas o contexto de restauração e reforma favorece a ideia de uma resposta misericordiosa. “Se compadeceu” é natural em português e evita firmar uma reconstrução mais específica do que a evidência permite.
- source_word: על משובתינו
  choice: de nosso desvio
  rationale: משובה costuma designar afastamento, desvio ou apostasia, e o sufixo é de primeira pessoa do plural. “Nosso desvio” preserva o sentido negativo do hebraico sem impor o termo mais técnico “apostasia”.
- source_word: וישבת
  choice: e eliminou
  rationale: O verbo comunica fazer cessar ou remover. “Eliminou” expressa com clareza a supressão das práticas ou coisas abomináveis.
- source_word: תועבות
  choice: abominações
  rationale: Mantém a forte carga moral e cultual do hebraico, especialmente apropriada em contexto de reforma contra a idolatria.
- source_word: הבל
  choice: futilidade
  rationale: הבל denota vapor, vazio, vaidade ou inutilidade e pode funcionar como designação polêmica dos ídolos. “Futilidade” conserva a imagem de falta de valor sem explicitar “ídolos” no texto principal.
theological_decisions:
- issue: Se משובה deve ser harmonizado com o grego ἐπιστροφή como retorno ou arrependimento
  choice: 'Manter no texto principal o sentido hebraico negativo: “nosso desvio”'
  alternative: “o retorno do povo” ou “o arrependimento do povo”
  rationale: O testemunho hebraico preservado favorece desvio ou infidelidade, enquanto o paralelo grego apresenta uma virada positiva. A tensão textual é mantida por meio de nota, sem harmonização silenciosa.
- issue: Se הבל deve ser explicitado como “ídolos”
  choice: Traduzir pela imagem mais ampla “futilidade”
  alternative: “ídolos” ou “coisas sem valor”
  rationale: O contexto provavelmente é anti-idolátrico, mas o hebraico não emprega aqui o substantivo explícito para ídolos. A tradução conserva a metáfora e a nota esclarece sua provável referência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Desvio” evita o tom excessivamente técnico de “apostasia”; “futilidade” preserva a metáfora hebraica e evita que “vaidade” seja entendida apenas como orgulho pessoal.
