base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: pt
  text: Quanto aos doze profetas, que seus ossos floresçam do lugar onde jazem.[a] Pois eles curaram Jacó; e ele o exaltou na fé da esperança.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil e diz, mais literalmente, “que seus ossos floresçam de sob eles”; o grego traz “que seus ossos floresçam do lugar deles”.
    reason: textual_variant
  - marker: b
    text: O grego diz “consolou Jacó”, em vez do hebraico “curaram Jacó”.
    reason: alternative_reading
  - marker: c
    text: A linha final varia entre os testemunhos. O hebraico diz literalmente “e ele o exaltou na fé da esperança”; o sujeito singular não é explicitado no contexto imediato. O grego diz “e os libertou na fé da esperança”.
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  choice: os doze profetas
  rationale: Ambos os testemunhos dizem literalmente “os doze profetas”. Evita-se acrescentar “menores”, designação posterior que não aparece no texto.
- source_word: עצמתם / τὰ ὀστᾶ
  choice: seus ossos
  rationale: O hebraico e o grego empregam a imagem concreta dos ossos, apropriada ao contexto de honra póstuma.
- source_word: פרחת / ἀναθάλοι
  choice: floresçam
  rationale: Preserva a imagem de brotar ou tornar a florescer e expressa naturalmente o desejo formulado no verso.
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  choice: do lugar onde jazem
  rationale: O hebraico é difícil e, literalmente, parece dizer “de sob eles”; o grego traz “do lugar deles”. A formulação adotada conserva o contexto funerário sem apagar a variante, registrada em nota.
- source_word: החלימו / παρεκάλεσεν
  choice: curaram
  rationale: Prioriza o hebraico preservado, cujo verbo significa “curar” ou “restabelecer”. O grego divergente, “consolou/encorajou”, é indicado em nota.
- source_word: יעקב
  choice: Jacó
  rationale: Mantém o nome próprio do texto, embora ele represente coletivamente o povo de Israel.
- source_word: וישגבהו / ἐλυτρώσατο αὐτοὺς
  choice: o exaltaram
  rationale: Segue a leitura mais direta do hebraico, com objeto masculino singular referente a Jacó. O grego diverge significativamente, trazendo “os libertou”; essa leitura é preservada em nota.
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  choice: na fidelidade da esperança
  rationale: Mantém a construção compacta e a relação genitiva entre fidelidade/fé e esperança, sem transformá-las silenciosamente em duas virtudes coordenadas.
theological_decisions:
- issue: Prioridade entre o hebraico e o grego em um verso com divergência importante
  choice: Seguir o hebraico no texto principal, usando o grego para esclarecer o contexto funerário da primeira linha e registrando as divergências em notas.
  alternative: 'Seguir integralmente o grego: “consolou Jacó e os libertou na fé da esperança”.'
  rationale: O hebraico de Ben Sira está preservado neste verso e deve orientar o texto principal. Como o grego atesta diferenças reais, elas não são harmonizadas nem omitidas.
- issue: Referente e número na oração final
  choice: “o exaltaram”, com Jacó como objeto singular, conforme o hebraico.
  alternative: “os libertou”, entendendo Jacó coletivamente como Israel, conforme o grego.
  rationale: A forma hebraica aponta para um objeto singular e para a ideia de exaltação; a leitura coletiva e plural pertence ao testemunho grego e fica explicitada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção clara e imagem poética preservada. “Floresçam” mantém a metáfora do original; “do lugar onde jazem” explicita discretamente o contexto funerário. As notas conservam as divergências substanciais sem sobrecarregar o texto principal.
