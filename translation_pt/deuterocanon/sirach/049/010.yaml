  naturalness: O português é claro e de registro apropriado. “Na fé da esperança” é mais diretamente inteligível e mais próximo tanto do hebraico quanto do grego do que “na fidelidade da esperança”, sem resolver a construção compacta.
  terminology: “Doze profetas”, “ossos”, “curaram” e “Jacó” são escolhas corretas. A nota sobre o grego deve conservar o singular de “consolou”, e a nota final deve indicar que a formulação hebraica mantém um sujeito singular não explicitado no contexto imediato.
