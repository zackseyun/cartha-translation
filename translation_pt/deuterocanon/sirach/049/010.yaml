revisions:
- from: Quanto aos doze profetas, que seus ossos floresçam do lugar onde jazem.[a] Pois eles curaram Jacó[b] e o exaltaram na fidelidade da esperança.[c]
  to: Quanto aos doze profetas, que seus ossos floresçam do lugar onde jazem.[a] Pois eles curaram Jacó; e ele o exaltou na fé da esperança.[b][c]
  rationale: A revisão corrige a mudança injustificada de número em וישגבהו e conserva, por meio de “ele”, o sujeito singular não explicitado e difícil do hebraico. Não se identifica esse sujeito nem se harmoniza a leitura hebraica com a grega. Também se ajusta “fé” para refletir mais diretamente אמונת/πίστει, preservando a concisão e a ambiguidade da expressão.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:23:25Z'
