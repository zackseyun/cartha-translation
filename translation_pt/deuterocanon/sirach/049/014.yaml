  yaml_path: translation/deuterocanon/sirach/049/014.yaml
  text: Few have been created on earth like Enoch, and he too was taken from the earth.
translation:
  language: pt
  text: Poucos foram criados na terra como Enoque,[a] e ele também foi tirado da terra.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz a formulação mais forte: “nem um só foi criado na terra como Enoque”. O testemunho hebraico diz “poucos”, e não “ninguém”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “Poucos foram criados na terra como Enoque, e ele também foi tirado…”. A última palavra hebraica é difícil neste contexto; o paralelo grego diz “da terra”, leitura seguida no texto principal.'
    reason: textual_variant
  - marker: c
    text: Ou “foi levado para o alto”. A expressão retoma a tradição de que Enoque foi levado por Deus (compare Gênesis 5:24).
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: Poucos
  rationale: O quantificador hebraico significa “poucos” ou “pouco”. Embora o paralelo grego apresente a formulação absoluta “nem um só”, o testemunho hebraico é prioritário e sustenta “poucos”.
- source_word: נוצרו
  choice: foram criados
  rationale: A forma passiva exprime criação ou formação, provavelmente como passivo divino. “Foram criados” mantém essa nuance e corresponde ao grego ἐκτίσθη.
- source_word: כחנוך
  choice: como Enoque
  rationale: O prefixo כ indica comparação; “como Enoque” é claro e natural em português.
- source_word: וגם הוא
  choice: e ele também
  rationale: Preserva a ênfase aditiva do hebraico em linguagem portuguesa corrente.
- source_word: נלקח
  choice: foi tirado
  rationale: Mantém a formulação contida do verbo לקח e a alusão bíblica ao destino de Enoque sem explicitar além do texto quem o tomou nem descrever o modo.
- source_word: פנים
  choice: da terra
  rationale: A palavra hebraica final é difícil e provavelmente reflete um problema textual. Segue-se o sentido preservado pelo paralelo grego ἀπὸ τῆς γῆς, com a dificuldade registrada em nota.
theological_decisions:
- issue: Grau de explicitação da remoção de Enoque
  choice: foi tirado da terra
  alternative: foi levado para o alto
  rationale: A tradução conserva a alusão à remoção extraordinária de Enoque, mas não acrescenta uma descrição explícita de ascensão nem “para a presença de Deus”, ideias que não estão inequivocamente expressas no verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “terra” foi mantida por refletir o paralelo grego que esclarece o final hebraico, e a voz passiva preserva a discrição do original quanto ao agente.
