translation:
  language: pt
  text: Ezequiel viu uma visão[a] e descreveu as formas do carro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Ezequiel, que viu uma visão da glória que lhe foi mostrada sobre um carro de querubins.” O hebraico é mais breve e pode conservar uma formulação condensada ou incerta em “as formas do carro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: Ezequiel
  rationale: Nome próprio do profeta em sua forma portuguesa consagrada. O ו inicial funciona como ligação com o contexto e não precisa ser reproduzido isoladamente no início do versículo.
- source_word: ראה
  choice: viu
  rationale: Tradução direta e natural do verbo comum “ver” no passado.
- source_word: מראה
  choice: uma visão
  rationale: No contexto profético, מראה designa uma experiência visionária; o paralelo grego ὅρασιν confirma esse sentido.
- source_word: ויגד
  choice: e descreveu
  rationale: O hifil de נגד significa contar, anunciar ou relatar. “Descreveu” expressa naturalmente o relato dos aspectos da visão sem acrescentar conteúdo.
- source_word: זני
  choice: as formas
  rationale: O texto hebraico transmitido parece indicar tipos, espécies ou variedades. “As formas” conserva a ideia de pluralidade sem sugerir, em português, modelos comuns de veículo; a expressão continua deliberadamente compacta, pois a leitura é incomum e possivelmente incerta.
- source_word: מרכבה
  choice: do carro
  rationale: מרכבה significa literalmente “carro”, aqui evocando o carro celestial da visão de Ezequiel. O texto principal não acrescenta “querubins”, presente apenas no paralelo grego.
theological_decisions:
- issue: Se a tradução deve ampliar o versículo segundo a descrição grega da glória e do carro dos querubins
  choice: Manter no texto principal a formulação hebraica breve e registrar em nota a leitura grega mais desenvolvida.
  alternative: Ezequiel, que viu uma visão da glória que lhe foi mostrada sobre um carro de querubins.
  rationale: O hebraico sobrevivente tem prioridade, embora sua expressão זני מרכבה seja incomum ou textualmente incerta. A leitura grega é testemunho relevante, mas incorporá-la ao corpo do versículo substituiria a concisão e a ambiguidade reais do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Carro” mantém o termo bíblico tradicional para o veículo da visão, enquanto “as formas do carro” preserva, sem explicar em excesso, a dificuldade do hebraico.
