  text: Shem and Seth were honored, and above every living thing was Adam’s glory.
translation:
  language: pt
  text: Sem, Sete e Enós foram lembrados, e a glória deles supera a de todo ser vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “Sem e Sete foram glorificados entre os homens, e, acima de todo ser vivo na criação, Adão.”'
    reason: 'Registra uma variante textual substancial: o grego omite Enós e menciona Adão, enquanto o hebraico inclui Enós e atribui a glória coletivamente aos três.'
lexical_decisions:
- source_word: נפקדו
  choice: foram lembrados
  rationale: O nifal de פקד pode indicar que alguém foi lembrado, reconhecido ou levado em conta. “Foram lembrados” mantém a imagem do hebraico e se ajusta ao contexto de rememoração de homens ilustres.
- source_word: תפארת עמם
  choice: a glória deles
  rationale: A expressão é literalmente próxima de “a glória está com eles”. Em português, “a glória deles” comunica naturalmente a ideia possessiva ou associativa sem identificar a glória exclusivamente com uma só personagem.
- source_word: ועל כל חי
  choice: supera a de todo ser vivo
  rationale: A construção elíptica expressa superioridade sobre todo vivente. O complemento “a de” deixa claro que a comparação é entre glórias, evitando sugerir posição espacial.
theological_decisions:
- issue: Identidade das personagens e atribuição da glória
  choice: Seguir o hebraico, incluindo Enós e atribuindo coletivamente a glória aos três
  alternative: 'Seguir o grego: omitir Enós e dizer que Adão teve glória acima de toda criatura viva'
  rationale: A fonte hebraica fornecida tem alta confiança e lê explicitamente “Sem, Sete e Enós”, seguida de uma referência plural (“com eles”). A variante grega é registrada em nota, não incorporada silenciosamente ao texto.
translation_notes:
  register: Português atual, claro e digno, com nomes na forma tradicional portuguesa. A formulação segue prioritariamente o hebraico e explicita apenas a comparação elíptica necessária para a fluência.
