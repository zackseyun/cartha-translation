base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: pt
  text: 'Com exceção de Davi, Ezequias e Josias, todos agiram de forma perversa[a]; os reis de Judá abandonaram a Lei do Altíssimo, até chegarem ao fim.[b]


    [a] Ou: “todos cometeram transgressão”, seguindo mais de perto o grego; o hebraico usa um verbo que pode significar “corromper” ou “arruinar”.


    [b] A frase final é concisa no hebraico: “até o fim deles” ou “até se acabarem”. O grego diz: “os reis de Judá chegaram ao fim” ou “desapareceram”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos cometeram transgressão”, seguindo mais de perto o grego; o hebraico usa um verbo que pode significar “corromper” ou “arruinar”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é concisa no hebraico: “até o fim deles” ou “até se acabarem”. O grego diz: “os reis de Judá chegaram ao fim” ou “desapareceram”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: Com exceção de
  rationale: Ambos os termos introduzem uma exceção. A expressão é clara e natural em português e apresenta Davi, Ezequias e Josias como exceções à avaliação geral dos reis.
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: agiram de modo corrupto
  rationale: O verbo hebraico da raiz שחת pode indicar corromper ou arruinar, enquanto o grego fala em cometer transgressão. A formulação preserva a força moral sem especificar indevidamente uma única espécie de pecado.
- source_word: ויעזבו / κατέλιπον
  choice: abandonaram
  rationale: O hebraico e o grego exprimem o afastamento culpável da obrigação da aliança; “abandonaram” transmite essa força em português corrente.
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: a Lei do Altíssimo
  rationale: Embora תורה também possa significar “instrução”, o paralelo grego νόμος e o contexto régio e pactual favorecem “Lei”. “Altíssimo” preserva o título divino.
- source_word: מלכי יהודה
  choice: os reis de Judá
  rationale: Tradução direta que mantém a referência histórica e concorda com o paralelo grego.
- source_word: עד תמם / ἐξέλιπον
  choice: até chegarem ao fim
  rationale: A expressão hebraica é breve e admite mais de uma análise; o grego sugere chegar ao fim, desaparecer ou faltar. A tradução conserva a ideia de término sem restringi-la à morte individual ou à extinção dinástica.
theological_decisions:
- issue: Relação sintática e sentido da frase final עד תמם à luz do grego ἐξέλιπον
  choice: 'Traduzir como resultado ou ponto final do abandono dos reis: “até chegarem ao fim”.'
  alternative: 'Entender como uma oração independente: “os reis de Judá desapareceram/fracassaram”, ou traduzir o hebraico mais literalmente como “até se acabarem”.'
  rationale: O hebraico é conciso e ligeiramente ambíguo, ao passo que o grego oferece uma formulação interpretativa. A redação principal leva ambos os testemunhos em conta e a nota preserva as alternativas sem definir de que modo específico ocorreu esse fim.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui a Lei do Altíssimo; a pontuação mantém as duas afirmações lado a lado sem acrescentar uma relação causal que não está explícita no hebraico.
