  text: He directed his heart to God[b][a], and in days of violence he showed loyalty.
translation:
  language: pt
  text: Dirigiu seu coração a Deus[a] e, em dias de violência, demonstrou lealdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “para o Senhor”, em vez do hebraico “a Deus”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “demonstrou bondade”. O grego expressa a ideia mais explicitamente, indicando que ele se manteve firme na piedade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם
  choice: dirigiu
  rationale: A forma hebraica é um tanto incerta, mas o paralelo grego κατεύθυνεν apoia o sentido de dirigir ou endireitar. “Dirigiu” é natural em português e combina com “o coração”.
- source_word: אל אל
  choice: para Deus
  rationale: Segue o hebraico preservado, que traz “para Deus”. O grego diz “para o Senhor”, variante registrada em nota.
- source_word: לבו
  choice: o coração
  rationale: Mantém a linguagem antropológica bíblica, que abrange vontade, pensamento e disposição interior, sem reduzi-la apenas à mente.
- source_word: ובימי חמס
  choice: em dias de violência
  rationale: חמס denota violência, injustiça ou dano. A tradução preserva a força social e moral do hebraico; o grego fala de “dias de transgressores”, nuance próxima, mas distinta.
- source_word: עשה חסד
  choice: demonstrou lealdade
  rationale: חסד pode expressar bondade, misericórdia ou lealdade fiel. “Demonstrou lealdade” é claro e natural, sem limitar a expressão à benevolência interpessoal; a interpretação religiosa mais explícita do grego é indicada em nota.
theological_decisions:
- issue: Se a cláusula final descreve bondade para com outros ou fidelidade religiosa a Deus
  choice: demonstrou lealdade
  alternative: demonstrou bondade; fortaleceu a piedade
  rationale: O hebraico עשה חסד permite tanto a ideia de bondade quanto a de lealdade fiel, enquanto o grego explicita “fortaleceu a piedade”. A formulação principal conserva a abertura sem importar integralmente a interpretação grega.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa. “Dirigiu o coração” preserva a imagem bíblica; “demonstrou lealdade” comunica o campo semântico de חסד de forma natural e mantém a tensão com as alternativas registradas em nota.
