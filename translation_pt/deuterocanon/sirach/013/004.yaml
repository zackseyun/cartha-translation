  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
translation:
  language: pt
  text: Se você lhe for útil[a], ele se servirá de você; e, se você se curvar, ele não poupará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega diz: “O rico comete injustiça e ainda esbraveja; o pobre sofre injustiça e ainda precisa suplicar.” O testemunho hebraico preservado aqui traz uma advertência diferente: quem tem poder usa você enquanto lhe é útil e não demonstra piedade quando você se curva.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: Se você lhe for útil
  rationale: כשר pode indicar ser apto, conveniente ou vantajoso. Neste contexto, a expressão aponta para a utilidade prática da pessoa aos olhos de alguém poderoso, não para sua retidão moral.
- source_word: יַעֲבֹד בָּךְ
  choice: ele se servirá de você
  rationale: A construção comunica que ele fará uso da pessoa. “Se servirá de você” é natural em português e preserva o sentido instrumental e potencialmente explorador sem intensificá-lo para “explorará”.
- source_word: וְאִם תִּכְרַע
  choice: mas, se você se curvar
  rationale: כרע significa dobrar-se, ajoelhar-se ou cair prostrado. “Se curvar” conserva a imagem concreta e permite também a leitura social de submissão ou abatimento, sem resolver a ambiguidade.
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: ele não poupará você
  rationale: חמל abrange poupar e demonstrar compaixão. “Não poupará você” mantém tanto a dureza prática quanto a ausência de piedade.
- source_word: πλούσιος / πτωχός
  choice: não explicitados no texto principal
  rationale: A tradição grega fala diretamente do rico e do pobre, mas o testemunho hebraico preservado usa discurso na segunda pessoa. O texto principal segue o hebraico, enquanto a nota registra a leitura grega divergente.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e a tradição grega
  choice: Traduzir diretamente o testemunho hebraico e registrar a tradição grega em nota
  alternative: 'Adotar no texto principal a leitura grega: “O rico comete injustiça e ainda esbraveja; o pobre sofre injustiça e ainda precisa suplicar.”'
  rationale: Como há texto hebraico extante e de alta confiança, ele serve de base. A leitura grega constitui uma variante genuína e importante, mas não deve substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação direta conserva o paralelismo do hebraico; “se curvar” mantém aberta a possibilidade de prostração física, submissão social ou abatimento.
