translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A expressão “o coração do homem” conserva o singular masculino representativo do hebraico; “seja para o bem, seja para o mal” mantém o paralelismo e a possível amplitude semântica de טוֹב e רָע.
