translation:
  language: pt
  text: O coração do homem muda seu rosto, quer para o bem, quer para o mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego paralelo difere consideravelmente neste ponto. Em linhas gerais, ele relaciona um rosto alegre a um coração em coisas boas e acrescenta uma frase difícil sobre encontrar parábolas ou comparações com esforço. Como o testemunho hebraico deste versículo está preservado e é aqui a fonte principal, o texto segue o hebraico. O grego confirma a relação geral entre a disposição interior e a expressão exterior, mas não a redação exata.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Na literatura sapiencial hebraica, לֵב designa o íntimo da pessoa, incluindo pensamento e disposição. “Coração” preserva a imagem antropológica concreta e o contraste entre o interior e o rosto visível.
- source_word: אֱנוֹשׁ
  choice: homem
  rationale: O substantivo hebraico singular apresenta um homem em sentido representativo. “Homem” conserva essa forma sem impedir a aplicação geral do provérbio a todo ser humano.
- source_word: יְשַׁנֵּא
  choice: muda
  rationale: O verbo, da raiz שנה, significa “mudar” ou “alterar”. A forma direta expressa que a disposição interior modifica a expressão exterior.
- source_word: פָנָיו
  choice: seu rosto
  rationale: Tradução concreta de “seu rosto”. Evita generalizar para “aparência” e mantém o foco do provérbio na manifestação visível do estado interior.
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: seja para o bem, seja para o mal
  rationale: A construção correlativa hebraica apresenta dois resultados opostos. “Bem” e “mal” preservam a formulação concisa sem decidir se o contraste é estritamente moral ou mais amplo.
