  text: Be on guard and be very careful, and do not walk with violent men.
translation:
  language: pt
  text: Mantenha-se alerta e tenha muito cuidado; não ande com homens violentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “pois você anda com a sua ruína” ou “com a sua queda”. O testemunho hebraico, porém, diz: “não ande com homens violentos”.'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Mantenha-se alerta
  rationale: O imperativo nifal de שמר expressa a ideia reflexiva de guardar-se e permanecer vigilante. A formulação é natural em português e preserva o tom de advertência.
- source_word: וֶהְיֵה זָהִיר
  choice: e tenha muito cuidado
  rationale: זָהִיר indica cautela e atenção. Embora o hebraico não traga um advérbio intensificador explícito, o paralelo grego πρόσεχε σφοδρῶς reforça enfaticamente a advertência e apoia «muito cuidado».
- source_word: וְאַל תִּתְהַלֵּךְ
  choice: não ande
  rationale: O hitpael de הלך pode significar andar, circular ou conduzir-se. «Andar com» mantém a metáfora sapiencial e também comunica associação habitual.
- source_word: עִם
  choice: com
  rationale: A preposição indica companhia ou associação; «com» é a correspondência direta e idiomática em português.
- source_word: אַנְשֵׁי חָמָס
  choice: homens violentos
  rationale: חָמָס abrange violência, injustiça e conduta cruel. «Homens violentos» conserva a expressão concreta e o masculino do hebraico sem introduzir uma interpretação mais ampla.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego na segunda parte do versículo
  choice: 'Seguir o hebraico preservado: «não ande com homens violentos».'
  alternative: 'O grego diz: «pois você anda com a sua ruína/queda».'
  rationale: Como o texto hebraico está preservado e oferece uma advertência sapiencial coerente, ele rege o texto principal. A leitura grega, substancialmente diferente, é registrada em nota, sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção «andar com» preserva a imagem hebraica e soa natural como advertência contra más companhias.
