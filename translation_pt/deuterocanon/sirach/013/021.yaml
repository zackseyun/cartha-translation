  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
translation:
  language: pt
  text: O rico fala[a], e muitos são os seus apoiadores; até suas palavras feias são embelezadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego difere consideravelmente: “Quando o rico vacila, é sustentado pelos amigos; mas, quando o humilde cai, é ainda empurrado para longe pelos amigos.” Aqui, o testemunho hebraico enfatiza, em vez disso, a recepção favorável dada às palavras do rico.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: o rico
  rationale: O singular hebraico apresenta uma figura representativa. “O rico” é direto, natural em português e preserva a forma masculina do texto.
- source_word: מְדַבֵּר
  choice: fala
  rationale: O presente simples corresponde ao estilo proverbial e traduz diretamente a ação verbal.
- source_word: וְעוֹזְרָיו רַבִּים
  choice: e muitos são os seus apoiadores
  rationale: Embora a expressão signifique literalmente “e seus ajudadores são muitos”, “apoiadores” comunica melhor a adesão social motivada pela riqueza.
- source_word: דְבָרָיו
  choice: suas palavras
  rationale: Tradução concreta e direta do substantivo plural, mantendo o foco no que o rico diz.
- source_word: מְכוֹעֲרִין
  choice: feias
  rationale: Preserva a imagem de algo desagradável ou censurável e prepara o contraste verbal com “embelezadas”.
- source_word: מְיוּפִּין
  choice: são embelezadas
  rationale: 'Mantém o sentido passivo-causativo: outras pessoas fazem parecer belas as palavras censuráveis do rico, sem eliminar a ironia do hebraico.'
