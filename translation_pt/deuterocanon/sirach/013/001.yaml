translation:
  language: pt
  text: Quem toca em piche terá a mão grudada nele[a], e quem se associa com o zombador aprenderá o caminho dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Quem toca em piche ficará contaminado, e quem convive com um orgulhoso se tornará semelhante a ele”. O testemunho hebraico traz “zombador” e “aprenderá o caminho dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  choice: Quem toca em piche
  rationale: O particípio tem sentido proverbial e genérico. “Quem toca” é natural em português, e “piche” preserva a imagem concreta de uma substância negra e pegajosa.
- source_word: תִּדְבַּק יָדוֹ
  choice: fica com a mão grudada nele
  rationale: O hebraico diz literalmente que a mão adere ou fica presa. A formulação mantém a imagem física e explicita de modo natural o referente implícito, o piche.
- source_word: וְחוֹבֵר אֶל
  choice: e quem se associa com
  rationale: O verbo expressa união, convivência ou associação com alguém. A escolha é corrente e conserva o caráter relacional do hebraico.
- source_word: לֵץ
  choice: o zombador
  rationale: Na literatura sapiencial hebraica, לֵץ designa quem zomba ou escarnece. “Zombador” é claro e atual, sem substituir a leitura hebraica pelo “orgulhoso” do paralelo grego.
- source_word: יִלְמַד דַּרְכּוֹ
  choice: aprenderá o caminho dele
  rationale: Reproduz a afirmação hebraica de que a pessoa aprende o caminho do zombador, preservando a metáfora moral de “caminho” e sem transformá-la silenciosamente em “se tornará semelhante a ele”.
theological_decisions:
- issue: Diferença entre o testemunho hebraico e o paralelo grego
  choice: 'Seguir no texto principal a leitura hebraica: a mão fica grudada; a pessoa aprende o caminho do zombador.'
  alternative: 'O grego diz: “Quem toca em piche ficará contaminado, e quem convive com um orgulhoso se tornará semelhante a ele”.'
  rationale: Como há testemunho hebraico de alta confiança, ele recebe primazia. O paralelo grego comunica a mesma advertência geral, mas muda tanto os termos quanto a ênfase; por isso, sua leitura é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura proverbial foi mantida, assim como a imagem concreta do piche e a metáfora sapiencial do caminho.
