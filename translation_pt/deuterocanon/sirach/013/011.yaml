base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: pt
  text: Não confie em falar livremente com ele[a], nem acredite em suas muitas palavras; pois, falando muito, ele o põe à prova e, enquanto ri com você, ele o sonda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na liberdade com ele”. Também pode indicar familiaridade sem cautela ou falar abertamente, de igual para igual, na presença dele. O paralelo grego apoia especialmente o sentido de falar livremente com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: Não confie
  rationale: Expressa de modo direto e natural a proibição hebraica de depositar confiança.
- source_word: לְחֹפֶשׁ עִמּוֹ
  choice: na liberdade que ele lhe dá
  rationale: חֹפֶשׁ denota liberdade; no contexto, trata-se da liberdade ou familiaridade aparentemente concedida pelo poderoso. A formulação preserva a imagem hebraica sem tornar o português excessivamente literal, enquanto a nota registra a possibilidade ligada a falar livremente.
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: nem acredite em suas muitas palavras
  rationale: אמן, diante das palavras como objeto, é traduzido naturalmente por 'acredite'; רֹב שִׂיחוֹ enfatiza a abundância de sua fala.
- source_word: כִּי מַרְבִּית שִׂיחוֹ נִסּיוֹן
  choice: pois, falando muito, ele o põe à prova
  rationale: O hebraico é comprimido, mas o paralelo grego explicita que a fala abundante serve para testar o interlocutor. A tradução conserva essa relação instrumental sem imitar a sintaxe obscura.
- source_word: וְשֹׂחֵק לְךָ
  choice: e, enquanto ri com você
  rationale: Mantém a simultaneidade do particípio e a aparência de cordialidade; 'ri com você' é mais natural e menos interpretativo do que 'sorri para você' ou 'faz gracejos'.
- source_word: וַחֲקָרֶךָ
  choice: procura sondá-lo
  rationale: A raiz חקר indica investigar ou examinar a fundo. 'Sondar' comunica uma investigação discreta das intenções ou vulnerabilidades da pessoa.
