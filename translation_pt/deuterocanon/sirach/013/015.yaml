translation:
  language: pt
  text: Todo ser vivo fica junto dos de sua espécie[a], e o ser humano se associa aos de sua espécie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Todo ser vivo ama o que lhe é semelhante, e todo ser humano, o seu próximo.” O texto hebraico enfatiza a associação com os de sua própria espécie.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִין
  choice: espécie
  rationale: מִין designa uma classe ou espécie. “Espécie” mantém a repetição proverbial do hebraico e é natural neste contexto de afinidade entre seres semelhantes.
- source_word: כָּל בָּשָׂר
  choice: ser vivo
  rationale: Embora a expressão signifique literalmente “toda carne”, aqui abrange os seres animados; o paralelo grego πᾶν ζῷον confirma esse sentido. “Ser vivo” comunica-o com clareza em português.
- source_word: אֶצְלוֹ
  choice: fica com os da sua própria espécie
  rationale: A primeira oração hebraica é elíptica. אֶצְלוֹ indica proximidade ou associação; a formulação escolhida explicita apenas o necessário para transmitir que cada ser permanece junto dos seus semelhantes.
- source_word: יְחֻבַּר
  choice: se une
  rationale: O passivo de חבר expressa ser ligado ou associado. “Se une” reproduz de modo natural a ideia de ligação social sem especificar a natureza dessa união.
- source_word: אָדָם
  choice: o ser humano
  rationale: אָדָם tem aqui sentido genérico, referente à humanidade representada no singular. “O ser humano” preserva esse valor abrangente e a forma proverbial.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da formulação grega paralela
  choice: Manter no texto principal a linguagem hebraica de “espécie” e união com os semelhantes.
  alternative: “Todo ser vivo ama o que lhe é semelhante, e todo ser humano, o seu próximo.”
  rationale: O hebraico preservado é o testemunho principal e enfatiza a associação com a própria espécie. O grego ajuda a esclarecer a oração hebraica elíptica, mas sua linguagem de amor e de próximo não deve substituir silenciosamente a leitura hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “espécie” foi preservada por fazer parte da estrutura e da força proverbial do hebraico.
