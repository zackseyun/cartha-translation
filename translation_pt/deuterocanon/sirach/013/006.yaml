  text: He has need of you[a], and he will deceive you[b]; he will smile at you and reassure you.
translation:
  language: pt
  text: Ele precisa de você[a] e o enganará[b]; sorrirá para você e lhe inspirará confiança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego começa: “Se você tiver [bens], ele viverá com você”, destacando que o interesse dele depende daquilo que você possui.'
    reason: alternative_reading
  - marker: b
    text: O hebraico desta expressão é difícil e pode parecer dizer “o ajudará”; o grego traz “ele o esvaziará”, isto é, consumirá seus recursos ou o explorará.
    reason: textual_variant
lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: Ele precisa de você
  rationale: A expressão hebraica apresenta diretamente a necessidade ou o interesse que ele tem na outra pessoa. A formulação é natural em português e mantém o hebraico como testemunho principal.
- source_word: וְהָשִׁיעַ לָךְ
  choice: e o explorará
  rationale: A forma hebraica é difícil e, tomada isoladamente, poderia sugerir ajuda ou livramento. Contudo, o paralelo grego traz ἀποκενώσει σε, literalmente 'esvaziará você', indicando que ele consumirá os recursos da pessoa. 'Explorará' comunica essa ação prejudicial sem impor uma imagem excessivamente literal.
- source_word: וְשׁוֹחֵק לְךָ
  choice: sorrirá para você
  rationale: Embora o verbo possa significar rir ou brincar, neste contexto descreve uma aparência amigável usada para conquistar confiança. 'Sorrirá para você' expressa isso com naturalidade.
- source_word: וְהִבְטִיחֶךָ
  choice: o fará sentir-se seguro
  rationale: O causativo de בטח indica levar alguém a sentir segurança ou confiança. A tradução preserva essa nuance causativa e a possível intenção manipuladora.
- source_word: ἀποκενώσει σε
  choice: o explorará
  rationale: O grego significa literalmente 'esvaziará você' e esclarece a ideia de drenar bens ou recursos. Em português corrente, 'explorará' transmite bem o efeito pretendido.
theological_decisions:
- issue: Tensão textual entre o hebraico difícil e o paralelo grego
  choice: Traduzir o sentido como exploração e registrar a dificuldade em nota
  alternative: Traduzir a forma hebraica aparente como 'o ajudará' ou reproduzir literalmente o grego como 'o esvaziará'
  rationale: O contexto imediato de interesse próprio e bajulação, junto com o grego, favorece exploração. A nota preserva, porém, a incerteza real do testemunho hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O pronome átono masculino retoma a pessoa interpelada sem acrescentar identificação social não expressa neste versículo.
