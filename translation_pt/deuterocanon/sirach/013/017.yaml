base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/017.yaml
  text: What peace can there be between a hyena and a dog? What peace can there be between a rich man and a poor man?[a]
translation:
  language: pt
  text: Que paz pode haver entre a hiena e o cão? Que paz pode haver entre o rico e o pobre?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Que terá o lobo em comum com o cordeiro? Assim é o pecador com o piedoso.” O testemunho hebraico, porém, traz “hiena ... cão” e “rico ... pobre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: Que ... pode haver
  rationale: A expressão funciona aqui como pergunta retórica que nega a possibilidade, não como pergunta literal sobre origem. A formulação preserva essa força em português natural.
- source_word: שָׁלוֹם
  choice: paz
  rationale: O termo designa paz ou relações harmoniosas; “paz” é o equivalente mais direto e mantém o paralelismo do provérbio.
- source_word: צָבוּעַ
  choice: hiena
  rationale: No hebraico pós-bíblico e em Ben Sira, o termo normalmente designa a hiena. O grego apresenta outra imagem, que não deve substituir o testemunho hebraico preservado.
- source_word: כָּלֶב
  choice: cão
  rationale: Equivalente lexical direto, adequado ao registro proverbial e digno do texto.
- source_word: עָשִׁיר
  choice: o rico
  rationale: O substantivo masculino singular contrasta diretamente com רָשׁ. “O rico” é corrente em português e preserva a forma proverbial.
- source_word: רָשׁ
  choice: o pobre
  rationale: O termo indica uma pessoa pobre ou necessitada. “O pobre” mantém o contraste masculino singular e a concisão do provérbio.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Traduzir no texto principal a imagem hebraica (“hiena ... cão”) e o contraste social (“rico ... pobre”), registrando em nota a forma grega divergente.
  alternative: 'Seguir o grego: “Que terá o lobo em comum com o cordeiro? Assim é o pecador com o piedoso.”'
  rationale: Como há testemunho hebraico extante e de alta confiança, ele tem primazia. A versão grega, porém, altera tanto a imagem quanto o contraste, passando do âmbito socioeconômico para o moral; por isso, sua leitura deve ser preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A repetição de “Que paz pode haver” conserva o paralelismo enfático do hebraico; os artigos definidos dão naturalidade à formulação proverbial.
