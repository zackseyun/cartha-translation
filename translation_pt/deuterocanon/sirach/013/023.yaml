  text: When a rich man speaks[a], everyone falls silent, and they lift up his sense to the clouds.
translation:
  language: pt
  text: Quando um rico fala, todos se calam e elevam o seu bom senso até as nuvens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e elevam a sua palavra até as nuvens”. O hebraico traz “o seu bom senso” ou “o seu entendimento”, leitura adotada aqui como testemunho principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: um rico
  rationale: Mantém o singular genérico e o estilo proverbial do hebraico, em linguagem portuguesa simples e natural.
- source_word: דּוֹבֵר
  choice: fala
  rationale: O presente traduz adequadamente o particípio hebraico com valor habitual ou proverbial.
- source_word: הַכֹּל
  choice: todos
  rationale: Equivalente coletivo idiomático em português neste contexto.
- source_word: נִסְכָּתוּ
  choice: se calam
  rationale: O sentido de ficar em silêncio é confirmado pelo paralelo grego ἐσίγησαν; a forma reflexiva é corrente e concisa em português.
- source_word: שִׂכְלוֹ
  choice: o seu bom senso
  rationale: שׂכל pode indicar entendimento, discernimento ou bom senso. “Bom senso” preserva a possível ironia de que até o juízo comum do rico é exageradamente elogiado.
- source_word: עַד עָב
  choice: até as nuvens
  rationale: Conserva a imagem hiperbólica de elevação; o plural soa natural em português e concorda com o paralelo grego.
- source_word: יַגִּיעוּ
  choice: elevam
  rationale: Expressa de modo natural o ato de fazer chegar ao alto e, figuradamente, de exaltar, sem perder a imagem espacial das nuvens.
