base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/016.yaml
  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: pt
  text: Que ligação há entre o lobo e o cordeiro? Assim é a relação do perverso com o justo[b], e a do rico com o homem rebaixado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um rico com um homem rebaixado”. A expressão final é um tanto incerta; pode designar alguém de posição social baixa ou cuja condição foi reduzida.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo diz: “Toda carne se reúne conforme a sua espécie, e o homem se apegará ao seu semelhante”. Essa forma diferente da máxima sustenta o tema geral de que as pessoas se associam com os seus semelhantes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: Que ligação pode haver
  rationale: A forma passiva de חבר formula uma pergunta retórica sobre união ou associação. “Que ligação pode haver” soa natural em português e conserva tanto a ideia relacional quanto a força retórica.
- source_word: זְאֵב
  choice: lobo
  rationale: Equivalente direto do termo hebraico e elemento predador da comparação.
- source_word: כֶּבֶשׂ
  choice: cordeiro
  rationale: No contraste entre predador e presa, “cordeiro” expressa com clareza a vulnerabilidade sugerida pelo provérbio.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado designa a pessoa moralmente má. “O perverso” preserva a forma masculina singular e o paralelismo proverbial sem acrescentar “homem” onde o português não o exige.
- source_word: לַצַּדִיק
  choice: entre o perverso e o justo
  rationale: Embora o hebraico empregue a preposição ל, o contexto compara relações incompatíveis. A construção portuguesa com “entre ... e ...” retoma naturalmente a primeira oração.
- source_word: עָשִׁיר
  choice: o rico
  rationale: O substantivo adjetival singular é traduzido de forma genérica e mantém o paralelismo com “o perverso” e “o justo”.
- source_word: אִישׁ נֶאֱצָל
  choice: o homem reduzido a uma condição humilde
  rationale: A expressão hebraica é difícil. Em contraste com “o rico”, parece indicar alguém socialmente rebaixado ou que sofreu redução de condição. A formulação escolhida preserva essa amplitude sem restringir o sentido à pobreza econômica.
theological_decisions:
- issue: Formas masculinas representativas em um provérbio sapiencial
  choice: o perverso / o justo / o rico / o homem reduzido a uma condição humilde
  alternative: a pessoa perversa / a pessoa justa / a pessoa rica / a pessoa humilde
  rationale: O hebraico emprega formas masculinas singulares numa máxima genérica. A tradução conserva essa forma representativa, usando construções naturais em português.
- issue: Prioridade do testemunho hebraico diante da forma grega divergente
  choice: Traduzir no texto principal o provérbio hebraico sobre o lobo e o cordeiro
  alternative: 'Traduzir segundo o grego: “Toda carne se reúne conforme a sua espécie, e o homem se apegará ao seu semelhante”'
  rationale: O hebraico está preservado com alta confiança e constitui a base principal. Como o grego apresenta uma forma consideravelmente diferente da máxima, sua leitura é registrada em nota sem substituir o texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A pergunta retórica foi mantida, assim como o paralelismo entre os três pares. As notas preservam tanto a incerteza lexical da expressão final hebraica quanto a divergência significativa do paralelo grego.
