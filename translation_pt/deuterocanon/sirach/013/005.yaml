  text: If you have something[a], he will speak kindly with you, and he will strip you bare without feeling pain.
translation:
  language: pt
  text: Se você tiver recursos[a], ele lhe dirigirá palavras amáveis e o reduzirá à miséria, sem se afligir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Se você lhe for útil, ele trabalhará com você; e, se lhe faltarem recursos, ele o abandonará.” Essa é uma forma do versículo materialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: Se você tiver recursos
  rationale: A expressão hebraica transmitida é difícil. “Recursos” preserva a ideia provável de possuir meios materiais no contexto da exploração pelo rico, sem restringi-la necessariamente à riqueza abundante.
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: ele lhe falará com bondade
  rationale: Representa de modo natural o sentido idiomático de literalmente tornar boas ou agradáveis as palavras dirigidas a alguém.
- source_word: וִירֹשֶׁשְׁךָ
  choice: o deixará na miséria
  rationale: O verbo comunica empobrecimento ou despojamento. A formulação é corrente em português e mantém a força predatória da ação.
- source_word: וְלֹא יִכְאַב לוֹ
  choice: sem sentir pesar
  rationale: A cláusula indica que o explorador não sofre nem se aflige pelo dano causado. “Pesar” exprime aqui insensibilidade moral com naturalidade.
theological_decisions:
- issue: Uso do testemunho hebraico da Genizá do Cairo diante do paralelo grego materialmente divergente
  choice: O texto principal segue o hebraico preservado, e a divergência grega é registrada em nota.
  alternative: 'Seguir o grego: “Se você lhe for útil, ele se servirá de você; e, se você ficar sem recursos, ele o abandonará.”'
  rationale: Como há texto hebraico para este versículo, ele recebe primazia. A forma grega, porém, constitui uma leitura antiga substancialmente diferente e deve permanecer visível ao leitor.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. “Recursos” mantém a abertura da expressão hebraica difícil; “deixará na miséria” comunica com clareza o empobrecimento deliberado.
