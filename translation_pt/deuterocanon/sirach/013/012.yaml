  text: A cruel man will give a stumbling block and will not spare[b][a]; against the life of many he plots a plot.
translation:
  language: pt
  text: Uma pessoa cruel causará tropeço e não poupará[a]; tramará uma conspiração contra a vida de muitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma redação substancialmente diferente: “Implacável é quem não guarda as palavras, e de modo nenhum poupará diante de dano e cadeias.” O texto principal segue o testemunho hebraico preservado; o paralelo grego confirma apenas o sentido geral de dano sem piedade.'
    reason: textual_variant
  - marker: b
    text: Mais literalmente, “tramará uma trama”. O hebraico repete a mesma raiz para dar ênfase; em português corrente, o sentido é que tramará uma conspiração contra a vida de muitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: o cruel
  rationale: O adjetivo substantivado designa uma pessoa cruel ou implacável. “O cruel” preserva a forma singular e representativa do hebraico sem acrescentar uma especificação de gênero desnecessária.
- source_word: יִתֵּן כֹּשֶׂל
  choice: causará tropeço
  rationale: A expressão hebraica é concisa e, literalmente, fala em “dar tropeço”. “Causará tropeço” conserva a imagem de fazer cair ou fracassar, mas soa mais natural em português.
- source_word: וְלֹא יַחְמוֹל
  choice: e não poupará
  rationale: חמל pode significar poupar ou ter compaixão. “Não poupará” mantém a concisão e o tom severo da frase, sem excluir a ideia de falta de piedade.
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: contra a vida de muitos
  rationale: 'נפש tem aqui o sentido concreto de “vida”, não necessariamente de “alma”. O singular coletivo do texto hebraico foi preservado, e על recebe sentido hostil: “contra”.'
- source_word: קוֹשֵׂר קָשֶר
  choice: trama uma conspiração
  rationale: A construção cognata hebraica repete a raiz para dar ênfase ao ato de conspirar. “Trama uma conspiração” preserva essa intensificação sem recorrer à expressão pouco natural “trama uma trama”.
