  text: Do not carry what is heavier than you, and do not associate with one richer than you.
translation:
  language: pt
  text: Não carregue o que é pesado demais para você[a], nem se associe a alguém mais rico que você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico formula esta frase como pergunta retórica: «O que é pesado demais para você, o que você carregará?» O antigo texto grego traz uma proibição explícita.'
    reason: Preserva a forma interrogativa do hebraico e informa, sem harmonizá-las indevidamente, a formulação proibitiva do paralelo grego que fundamenta a redação principal.
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: um peso pesado demais para você
  rationale: A expressão hebraica é elíptica, literalmente «pesado além de você»; «um peso pesado demais para você» explicita o substantivo implícito sem perder a imagem do ato de carregar.
- source_word: תִּתְחַבָּר
  choice: se associe
  rationale: O verbo ח־ב־ר indica unir-se, ligar-se ou manter associação com alguém. «Se associe» conserva a amplitude relacional e corresponde ao paralelo grego κοινώνει.
- source_word: עָשִׁיר מִמְּךָ
  choice: alguém mais rico que você
  rationale: Reproduz diretamente a comparação hebraica e evita acrescentar uma avaliação moral da pessoa rica.
theological_decisions:
- issue: Forma interrogativa do hebraico e proibição explícita no grego
  choice: Traduzir como proibição, com nota sobre a forma hebraica
  alternative: «Por que carregar algo pesado demais para você, e por que se associar a alguém mais rico que você?»
  rationale: O hebraico emprega מַה em construções retóricas, enquanto o antigo paralelo grego apresenta duas proibições explícitas. A tradução principal comunica a força exortativa atestada pelo grego, e a nota preserva a forma do hebraico.
translation_notes:
  register: Português atual, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O material hebraico adicional fornecido após a primeira frase corresponde ao dito seguinte sobre a panela de barro e a panela de metal e, por isso, não foi incorporado a Sirácida 13:2; o paralelo grego e a delimitação editorial confirmam que este versículo contém apenas a primeira frase.
