review_pass:
  verdict: revise
  source_fidelity: A primeira oração hebraica é uma pergunta retórica elíptica, literalmente próxima de «O que é pesado demais para você, o que você carregará?». O grego paralelo a formula como proibição. A tradução como proibição é defensável, mas «um peso pesado demais» introduz um substantivo e repete desnecessariamente a noção de peso. A segunda oração corresponde bem ao hebraico e ao grego.
  naturalness: «Não carregue o que é pesado demais para você» é natural no português moderno e preserva melhor a elipse do original. «Mais rico que você» é claro e idiomático; «do que você» também é possível, mas não necessário.
  terminology: «Associar-se» representa adequadamente o hebraico de unir-se/ligar-se e o grego κοινώνει, sem restringir a relação a amizade, negócios ou aliança. Não há termo teológico em questão.
  issues:
  - severity: low
    issue: Redundância e explicitação excessiva em «um peso pesado demais».
    rationale: O hebraico diz literalmente «[o] pesado além de você» e não expressa o substantivo «peso». A formulação do rascunho acrescenta «peso» e repete a ideia em «pesado», quando «o que é pesado demais» preserva a elipse e soa melhor.
  - severity: medium
    issue: A nota interpreta a pergunta hebraica como «Por que carregar...?».
    rationale: A construção hebraica usa «o que?» seguida de «carregarás?», não «por que?». A nota deve registrar a pergunta retórica de modo mais próximo do texto, sem atribuir-lhe uma interrogativa causal.
  revised_text: Não carregue o que é pesado demais para você[a], nem se associe a alguém mais rico que você.
  revised_footnotes:
  - marker: a
    text: 'O hebraico formula esta frase como pergunta retórica: «O que é pesado demais para você, o que você carregará?» O antigo texto grego traz uma proibição explícita.'
    reason: Preserva a forma interrogativa do hebraico e informa, sem harmonizá-las indevidamente, a formulação proibitiva do paralelo grego que fundamenta a redação principal.
  revision_rationale: A revisão remove a redundância introduzida por «um peso pesado» e corrige a descrição da pergunta retórica hebraica. Mantém-se a tradução exortativa, pois ela é apoiada pelo antigo paralelo grego, enquanto a nota conserva a diferença formal do hebraico.
