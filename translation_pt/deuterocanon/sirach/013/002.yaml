review_pass:
  verdict: revise
  source_fidelity: O hebraico fornecido inclui, além das duas perguntas retóricas iniciais, a comparação entre um caco e uma panela e sua aplicação à relação entre rico e pobre. O rascunho omite esse material. O paralelo grego conserva a exortação inicial em forma proibitiva, mas não justifica suprimir do texto traduzido as linhas presentes na fonte hebraica indicada. A forma interrogativa do hebraico é preservada na revisão; a diferença com o grego é registrada em nota.
  naturalness: A redação anterior é clara, mas «um peso pesado demais» é pleonástica. As perguntas retóricas e a imagem de cerâmica foram vertidas em português atual e inteligível, sem suavizar a advertência proverbial.
  terminology: «Associar-se» reproduz adequadamente o campo semântico de התחבר. «Caco de cerâmica» e «panela» conservam o contraste concreto entre o fragmento e o recipiente; «rico» e «pobre» mantêm os termos sociais do hebraico sem acrescentar julgamento moral.
  issues:
  - severity: high
    issue: Omissão das linhas sobre o caco, a panela e a relação entre rico e pobre.
    rationale: Essas linhas fazem parte do texto hebraico original fornecido para a referência. A nota editorial do rascunho as reclassifica como um dito seguinte, mas essa delimitação não pode prevalecer sobre a fonte-base sem assinalar a divergência textual.
  - severity: low
    issue: «um peso pesado demais» é redundante.
    rationale: O hebraico é elíptico e não exige introduzir simultaneamente «peso» e «pesado»; uma formulação interrogativa direta é mais natural e mais próxima da sintaxe da fonte.
  revised_text: Como você carregará algo pesado demais para você[a]? E como se associará a alguém mais rico do que você? Como um caco de cerâmica pode se unir a uma panela? A panela bate nele, e ele se quebra. Ou como um rico pode se unir a um pobre[b]?
  revised_footnotes:
  - marker: a
    text: 'O hebraico formula as duas primeiras advertências como perguntas retóricas. O antigo texto grego as expressa como proibições explícitas: «Não carregue o que é mais pesado do que você; e não se associe a alguém mais rico do que você.»'
    reason: Preserva a forma interrogativa da fonte hebraica e registra, sem harmonizá-la, a formulação proibitiva do paralelo grego.
  - marker: b
    text: O texto hebraico fornecido continua com a comparação entre o caco e a panela e sua aplicação ao rico e ao pobre. O paralelo grego citado para Sirácida 13:2 contém apenas as duas advertências iniciais.
    reason: Assinala a diferença de extensão entre as tradições textuais e de versificação, sem omitir o material da fonte hebraica.
  revision_rationale: A revisão restaura todo o conteúdo da fonte hebraica indicada e mantém sua modalidade retórica. A nota explica a formulação distinta e mais breve do grego, em vez de escolher uma tradição mediante omissão silenciosa. Também elimina a redundância estilística do texto anterior.
