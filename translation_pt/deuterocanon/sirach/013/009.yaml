  text: When a noble draws near[a], keep your distance, and then he will bring you nearer still.
translation:
  language: pt
  text: Quando um nobre chamar você para perto[a], mantenha distância; assim ele fará você chegar ainda mais perto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso e também pode ser entendido mais literalmente como: “Aproxime-se de um nobre; fique longe.” O paralelo grego apoia o sentido adotado aqui: quando uma pessoa poderosa chamar você, mostre reserva, e ela convidará você a chegar mais perto.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב
  choice: chamar você para perto
  rationale: A forma hebraica é breve e pode ser entendida como imperativo, “aproxime-se”, mas o paralelo grego προσκαλεσαμένου σε indica o ato de convocar ou convidar alguém a se aproximar. A tradução explicita esse sentido sem ocultar a leitura mais literal, registrada em nota.
- source_word: נָדִיב
  choice: nobre
  rationale: Neste contexto sapiencial, designa uma pessoa de posição social elevada e influente. “Nobre” preserva a ideia de status sem restringi-la a um príncipe ou monarca; o grego δυνάστης confirma a nuance de poder.
- source_word: הֱיֶה רָחוֹק
  choice: mantenha distância
  rationale: O imperativo aconselha reserva diante de alguém poderoso. A expressão é natural em português moderno e corresponde também ao sentido do grego ὑποχωρῶν γίνου, que sugere recuar ou não se adiantar.
- source_word: וּכְדֵי כֵן
  choice: assim
  rationale: A expressão introduz o resultado da atitude recomendada. “Assim” comunica com clareza a relação consequencial, enquanto a intensificação atestada no grego é refletida em “ainda mais perto”.
- source_word: יַגִּישֶׁךָ
  choice: ele fará você chegar ainda mais perto
  rationale: A forma verbal com sufixo de segunda pessoa indica fazer alguém se aproximar. A expressão preserva a progressão comparativa do provérbio, reforçada pelo grego τόσῳ μᾶλλον προσκαλέσεταί σε.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita uma construção pronominal excessivamente formal; “mantenha distância” conserva o tom direto da instrução sapiencial.
