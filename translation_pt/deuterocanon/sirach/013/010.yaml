translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. “Aproximar-se” e “ficar distante” mantêm a tensão social do conselho; as notas registram tanto a dificuldade da primeira oração hebraica quanto a leitura mais branda do grego na segunda.
