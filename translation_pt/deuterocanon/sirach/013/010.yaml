  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
translation:
  language: pt
  text: Não se aproxime, para não ser afastado[a]; e não fique distante, para não ser odiado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A primeira oração é difícil no hebraico tal como foi transmitido: literalmente, pode sugerir “não se aproxime, para não ficar distante”. O grego traz “para não ser repelido”, apoiando o sentido adotado no texto.'
    reason: textual_variant
  - marker: b
    text: O grego traz “para não ser esquecido” ou “negligenciado”, em vez do hebraico “para não ser odiado”. O texto principal segue o testemunho hebraico preservado.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: Não se aproxime
  rationale: A proibição com אַל e o imperfeito reflexivo expressa a advertência de não chegar perto; “aproximar-se” conserva tanto o sentido espacial quanto o relacional, em linguagem portuguesa natural.
- source_word: פֶּן
  choice: para não
  rationale: No contexto de advertência, פֶּן introduz uma consequência indesejada. “Para não” transmite isso de modo corrente e conciso nas duas metades do provérbio.
- source_word: תִּתְרַחֵק
  choice: ser afastado
  rationale: A forma hebraica, literalmente ligada a ficar ou tornar-se distante, é difícil na primeira oração. O paralelo grego usa ἀπωσθῇς, “ser repelido/afastado”, apoiando a ideia de que uma aproximação excessiva provoca rejeição.
- source_word: וְאַל תִּתְרַחֵק
  choice: e não fique distante
  rationale: Na segunda oração, a mesma raiz רחק tem claramente o sentido de manter distância. A formulação preserva o contraste equilibrado entre aproximar-se e ficar distante.
- source_word: תִּשָּׂנֵא
  choice: ser odiado
  rationale: O verbo hebraico significa normalmente “ser odiado”. A tradução mantém a força do testemunho hebraico, sem suavizá-la com “ser desprezado” ou com a variante grega.
