  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
translation:
  language: pt
  text: 'Quando um pobre fala, dizem: “Quem é este?” E, se ele tropeça, ainda[a] o empurram.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “também eles o empurram”. O sentido parece ser que outros agravam sua queda, em vez de ajudá-lo quando tropeça.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego difere substancialmente: “Boa é a riqueza quando nela não há pecado, e má é a pobreza na boca do piedoso”. A tradução principal segue o testemunho hebraico preservado; o grego representa uma tradição textual paralela.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: um pobre
  rationale: O termo designa alguém pobre, fraco ou socialmente humilde. “Um pobre” mantém o singular masculino e o caráter genérico do provérbio.
- source_word: דּוֹבֵר
  choice: fala
  rationale: O particípio tem sentido geral e habitual; “fala” é natural em português na construção “quando um pobre fala”.
- source_word: מִי זֶה
  choice: Quem é este?
  rationale: A pergunta direta conserva o tom de desprezo e desconsideração dirigido ao pobre.
- source_word: נִתְקַל
  choice: tropeça
  rationale: O verbo pode indicar tropeçar ou cair em ruína. “Tropeça” preserva a imagem concreta e permite sua dimensão social mais ampla.
- source_word: גַּם הֵם יֶהְדֳּפוּהוּ
  choice: ainda o empurram para baixo
  rationale: הדף significa empurrar, repelir ou impelir. No contexto, גם הם indica que os demais se somam à queda do pobre; “ainda” comunica essa crueldade adicional sem apagar a imagem física.
