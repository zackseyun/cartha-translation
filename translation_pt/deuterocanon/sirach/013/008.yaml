  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: pt
  text: 'Tenha cuidado: não seja presunçoso demais[a] e não se assemelhe aos que não têm entendimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Tenha cuidado para não ser desencaminhado e não seja humilhado em sua alegria.” O hebraico e o grego diferem substancialmente neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Tenha cuidado
  rationale: O imperativo nifal de שׁמר expressa uma advertência. “Tenha cuidado” é natural em português moderno e mantém a força admonitória; o grego πρόσεχε também indica atenção cautelosa.
- source_word: אַל תִּרְהַב מְאֹד
  choice: não seja ousado demais
  rationale: רהב pode indicar conduta ousada, presunçosa ou arrogante. “Ousado demais” preserva a ideia de autoafirmação excessiva sem restringir o sentido explicitamente ao orgulho; “demais” comunica מְאֹד de modo idiomático.
- source_word: וְאַל תִּדְמֶה
  choice: não se faça semelhante
  rationale: דמה significa aqui ser ou tornar-se semelhante. A construção reflexiva “não se faça semelhante” preserva a nuance volitiva da advertência, isto é, não adotar a maneira de agir do grupo mencionado.
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: aos que não têm entendimento
  rationale: A expressão significa literalmente os que carecem de conhecimento ou entendimento. “Entendimento” se ajusta ao contexto sapiencial e é claro para leitores atuais.
theological_decisions:
- issue: Divergência substancial entre o texto hebraico e o paralelo grego nos dois membros do versículo
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota
  alternative: 'Grego: “Tenha cuidado para não ser desencaminhado e não seja humilhado em sua alegria.”'
  rationale: Quando o hebraico de Sirácida está preservado com boa confiança, ele serve de fonte principal. Como o grego apresenta aqui uma redação materialmente diferente, a nota conserva a variante sem harmonizá-la nem ocultar a incerteza textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo das duas proibições e evita linguagem arcaica. O marcador [a] acompanha a primeira divergência relevante e a nota explicita que toda a redação grega é distinta.
