  text: All flesh loves its own kind[a], and every person the one like himself.
translation:
  language: pt
  text: Todo ser vivo ama os de sua espécie, e toda pessoa ama quem lhe é semelhante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e todo ser humano, o seu próximo”. O hebraico diz mais literalmente: “aquele que lhe é semelhante”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Todo ser vivo
  rationale: Embora a expressão hebraica signifique literalmente “toda carne”, aqui ela designa genericamente os seres vivos. “Todo ser vivo” comunica esse sentido proverbial com naturalidade em português e concorda com o paralelo grego πᾶν ζῷον, sem fazer dele a base da tradução.
- source_word: יֶאֱהַב
  choice: ama
  rationale: O imperfeito hebraico tem valor gnômico, expressando uma observação geral; o presente é a forma natural de reproduzi-lo em português.
- source_word: מִינוֹ
  choice: os de sua espécie
  rationale: מִין indica espécie, tipo ou classe. A formulação escolhida é idiomática e preserva a ideia de afinidade entre seres da mesma espécie.
- source_word: וְכָל אָדָם
  choice: e toda pessoa
  rationale: אָדָם designa aqui o ser humano em sentido genérico. “Toda pessoa” é corrente, abrangente e semanticamente exato no português moderno.
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: ama quem lhe é semelhante
  rationale: O hebraico se refere àquele que se parece com a pessoa ou lhe é semelhante. A repetição de “ama” explicita em português o verbo elíptico do segundo membro sem alterar o sentido.
theological_decisions:
- issue: Nuance hebraica ou grega no segundo membro
  choice: 'Seguir no texto principal o hebraico: “quem lhe é semelhante”'
  alternative: “o seu próximo”
  rationale: O testemunho hebraico preservado é a base primária e enfatiza semelhança ou afinidade. O grego apresenta “o seu próximo”, leitura antiga relevante que amplia a ideia para proximidade social; por isso, ela é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial equilibrada. “Todo ser vivo” evita o caráter pouco natural de “toda carne” neste contexto zoológico e sapiencial; “lhe é semelhante” conserva a ênfase específica do hebraico.
