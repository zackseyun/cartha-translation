  text: Humility is abhorrent to pride[a], and the poor are abhorrent to the rich.
translation:
  language: pt
  text: A humildade é detestável para o orgulho[a], e o pobre é detestável para o rico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “Os jumentos selvagens são presa dos leões no deserto; assim, os pobres são pasto dos ricos.” O hebraico preservado aqui diz, em vez disso: “A humildade é detestável para o orgulho, e o pobre é detestável para o rico.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: é detestável para
  rationale: 'A construção hebraica exprime forte repulsa numa relação: algo é detestável para alguém. A formulação preserva a intensidade sem recorrer a “abominação”, que em português pode sugerir indevidamente um contexto cultual.'
- source_word: גַּאֲוָה
  choice: orgulho
  rationale: Traduz diretamente o substantivo abstrato hebraico e conserva o contraste proverbial com a humildade.
- source_word: עֲנָוָה
  choice: humildade
  rationale: É o equivalente moderno e abrangente do substantivo hebraico, sem restringi-lo à mansidão nem apenas à baixa condição social.
- source_word: עָשִׁיר
  choice: o rico
  rationale: Embora singular, o termo tem valor representativo no provérbio; o singular genérico também preserva de perto a forma hebraica.
- source_word: אֶבְיוֹן
  choice: o pobre
  rationale: Expressa a pessoa pobre ou necessitada e mantém o paralelismo singular com “o rico”.
theological_decisions:
- issue: Preferência entre o texto hebraico da Genizá do Cairo e o paralelo grego, cuja imagem é substancialmente diferente
  choice: 'Traduzir diretamente o hebraico preservado: “A humildade é detestável para o orgulho, e o pobre é detestável para o rico.”'
  alternative: 'Leitura grega: “Os jumentos selvagens são presa dos leões no deserto; assim, os pobres são pasto dos ricos.”'
  rationale: Como o hebraico está preservado e possui alta confiança, ele rege o texto principal. A leitura grega, por representar uma formulação distinta e significativa, é registrada em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. O singular genérico “o pobre/o rico” acompanha de perto o hebraico e é natural em português; “detestável para” comunica repulsa forte sem conotação cultual excessiva.
