  text: Wealth is good if there is no iniquity[b][a], and poverty is bad according to the mouth of arrogance.
translation:
  language: pt
  text: A riqueza é boa se não há iniquidade; mas a pobreza é má na fala do arrogante.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “na fala do arrogante” é difícil. Literalmente, diz “segundo a boca da arrogância” e pode significar “no julgamento” ou “na fala do arrogante”.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego traz uma leitura substancialmente diferente: “O coração de uma pessoa muda o seu rosto, seja para o bem, seja para o mal.”'
    reason: textual_variant
lexical_decisions:
- source_word: טוֹב הָעֹשֶׂר
  choice: A riqueza é boa
  rationale: Mantém a avaliação direta e a força concisa do provérbio. “Riqueza” expressa de modo amplo a condição econômica indicada pelo hebraico.
- source_word: אִם אֵין עָוֹן
  choice: quando não há iniquidade
  rationale: A oração qualifica moralmente a riqueza. “Iniquidade” conserva o peso ético de עָוֹן sem restringi-lo apenas ao modo de adquirir os bens; “quando” comunica aqui a condição de maneira natural em português.
- source_word: וְרַע הָעוֹנִי
  choice: mas a pobreza é má
  rationale: “Pobreza” é a equivalência direta e corrente para a condição descrita. “Má” preserva o contraste proverbial com “boa”; a conjunção adversativa torna esse contraste natural em português.
- source_word: עַל פִּי זָדוֹן
  choice: no dizer da arrogância
  rationale: A expressão hebraica, literalmente “segundo a boca da arrogância”, é difícil. “No dizer” preserva a dimensão de fala ou pronunciamento sem produzir uma construção portuguesa excessivamente opaca, enquanto “arrogância” mantém o substantivo abstrato זָדוֹן.
theological_decisions:
- issue: Prioridade do hebraico diante do paralelo grego divergente
  choice: Traduzir no texto principal o provérbio hebraico sobre riqueza e pobreza.
  alternative: 'Seguir o grego: “O coração de uma pessoa muda o seu rosto, seja para o bem, seja para o mal.”'
  rationale: O hebraico está preservado com alta confiança e deve reger o texto principal de Sirácida. Como o grego apresenta uma sentença substancialmente diferente, sua leitura é registrada em nota, sem harmonização.
- issue: Sentido moral da riqueza e da pobreza
  choice: Conservar a formulação condicional e a avaliação difícil do segundo membro sem transformá-las numa doutrina geral sobre prosperidade ou pobreza.
  alternative: Explicitar que toda riqueza justa é uma bênção ou que somente os arrogantes consideram má a pobreza.
  rationale: O hebraico não explica a origem da iniquidade nem define de modo inequívoco a relação entre arrogância e pobreza. A tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Iniquidade” mantém a gravidade moral do hebraico; a dificuldade incomum do segundo membro é atenuada no corpo do texto e explicitada em nota.
