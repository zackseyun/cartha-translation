base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: pt
  text: Enquanto você lhe for útil, ele zombará de você[a]; duas ou três vezes o bajulará. Depois, olhará para você como quem vai passar adiante[b] e balançará a cabeça para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode significar zombar, escarnecer ou tratar alguém como objeto de diversão.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta oração é difícil. O testemunho grego desenvolve a ideia: depois de explorar você, ele o verá e o abandonará. A tradução acompanha a imagem hebraica, levando em conta esse paralelo.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: Enquanto você lhe for útil
  rationale: Expressa a duração condicionada à utilidade da pessoa e explicita, de modo natural em português, o beneficiário implícito no contexto; o grego confirma que o rico tem necessidade dela.
- source_word: יְהָתֵל בָּךְ
  choice: ele zombará de você
  rationale: התל pode envolver escárnio, abuso ou tratar alguém como objeto de diversão. “Zombará” é corrente e digno, embora a nota preserve a amplitude lexical.
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: duas ou três vezes
  rationale: Mantém diretamente o idiomatismo numérico hebraico e sua ideia de repetição limitada.
- source_word: יַעֲרִיצֶךָ
  choice: o bajulará
  rationale: No contexto de exploração interessada, indica exaltação ou elogio insincero, em consonância com a amabilidade enganosa descrita pelo paralelo grego.
- source_word: וּבְכֵן
  choice: Depois
  rationale: Marca com naturalidade a passagem do favor temporário para o desprezo e o abandono.
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: olhará para você como quem vai passar adiante
  rationale: Conserva a imagem difícil do hebraico ligada a passar ou seguir adiante, sem transformá-la indevidamente em aversão; o grego apoia a ideia de ver e abandonar.
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: balançará a cabeça para você
  rationale: Reproduz o gesto hebraico de desdém ou rejeição, também atestado literalmente no paralelo grego.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “você” para a segunda pessoa singular, com tom direto e digno. A formulação preserva a mudança entre bajulação interesseira e desprezo posterior, sem resolver excessivamente a oração hebraica incerta.
