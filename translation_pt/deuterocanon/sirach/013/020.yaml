  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: pt
  text: Quando um rico tropeça, é amparado por um amigo; mas, quando um pobre tropeça, é repelido de amigo em amigo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica pode indicar que o pobre é afastado ou passado adiante repetidamente, de um amigo para outro, em vez de receber verdadeiro apoio.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego difere consideravelmente: «A condição humilde é uma abominação para o orgulhoso, e o pobre é uma abominação para o rico». Aqui se segue o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: um rico
  rationale: O substantivo singular tem valor proverbial; «um rico» preserva a forma concisa e o contraste socioeconômico do hebraico.
- source_word: מוּט / נָמוֹט
  choice: tropeça
  rationale: As duas formas descrevem vacilar ou perder a firmeza, não necessariamente sofrer uma queda definitiva. A mesma tradução nos dois membros conserva o paralelismo.
- source_word: נִסְמָךְ
  choice: é amparado
  rationale: A forma passiva de סמך indica que a pessoa recebe apoio. «É amparado» é natural em português e mantém a imagem de sustentação.
- source_word: מֵרֵעַ
  choice: por um amigo
  rationale: Neste contexto, a preposição indica de quem procede o apoio; רֵעַ pode designar amigo ou companheiro.
- source_word: דַל
  choice: um pobre
  rationale: דַל designa alguém pobre ou socialmente fraco. «Um pobre» mantém o contraste direto com «um rico».
- source_word: נִדְחָה
  choice: é repelido
  rationale: O verbo comunica a ideia de ser afastado, rejeitado ou expulso. «É repelido» preserva tanto a força social da rejeição quanto o contraste com «é amparado».
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: de amigo em amigo
  rationale: A expressão sugere que o pobre é sucessivamente afastado ou passado adiante, sem receber apoio verdadeiro; a formulação conserva a concisão e o ritmo hebraicos.
theological_decisions:
- issue: Diferença substancial entre o texto hebraico e o paralelo grego
  choice: Traduzir o testemunho hebraico preservado e registrar a leitura grega em nota
  alternative: 'Seguir o grego: «A humildade é abominável para o orgulhoso, e o pobre é abominável para o rico»'
  rationale: A fonte hebraica fornecida é o testemunho primário desta tradução e apresenta uma máxima diferente, porém coerente. A variante grega é relevante demais para ser omitida, mas não deve substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura paralela do provérbio foi preservada; «tropeça» comunica um revés sem implicar necessariamente ruína definitiva.
