base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: pt
  text: 'O pobre cambaleia; quando fala, gritam: “Fora! Fora!”[a] Mesmo que fale com discernimento, não há lugar para ele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica traduzida por “Fora! Fora!” é breve e idiomática; comunica um grito repetido de rejeição ou repreensão. O paralelo grego explicita a ideia: quando o humilde falha, as pessoas o censuram.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não lhe dão ouvidos”. Literalmente, “não há lugar para ele”, isto é, suas palavras sensatas não encontram espaço nem acolhida entre as pessoas.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: o pobre
  rationale: Conserva o singular individualizado e abrange pobreza, fraqueza e baixa condição social, sem restringir desnecessariamente o referente a um homem.
- source_word: נָמוֹט
  choice: cambaleia
  rationale: Preserva a imagem de instabilidade expressa por מוט, sem decidir se a queda é moral, social ou circunstancial.
- source_word: גָּע גָּע יִשֶּׂא
  choice: 'gritam: “Fora! Fora!”'
  rationale: Reproduz a interjeição duplicada e abrupta como clamor coletivo de rejeição. O sujeito plural é suprido para tornar natural a construção hebraica concisa e difícil.
- source_word: מַשְׂכִּיל
  choice: alguém de discernimento
  rationale: Expressa inteligência perspicaz ou compreensão, evitando limitar o termo à sabedoria adquirida e mantendo uma formulação inclusiva e natural.
- source_word: וְאֵין לוֹ מָקוֹם
  choice: e não há lugar para ele
  rationale: 'Mantém a imagem literal e sua ambiguidade: suas palavras não recebem espaço, acolhida ou consideração social.'
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva o paralelismo conciso do provérbio; “Fora! Fora!” transmite oralmente a rejeição abrupta, e a formulação literal final preserva a tensão e a ambiguidade do hebraico.
