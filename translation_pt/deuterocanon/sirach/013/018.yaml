base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/018.yaml
  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
translation:
  language: pt
  text: Os animais selvagens do deserto[b] são alimento para o leão; assim, os pobres são pasto para os ricos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Que paz pode haver entre a hiena e o cão? E que paz entre o rico e o pobre?” O paralelo grego preserva um provérbio diferente, mas com o mesmo ponto social: a hostilidade entre ricos e pobres.'
    reason: alternative_reading
  - marker: b
    text: Ou, possivelmente, “os asnos selvagens do deserto”, caso o termo hebraico seja entendido em sentido mais específico, em vez de designar os animais selvagens em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל
  choice: alimento para
  rationale: O substantivo designa aquilo que é comido. “Alimento para” preserva a imagem predatória sem restringir o sentido a uma presa capturada.
- source_word: אֲרִי
  choice: leão
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: פִּרְאֵי מִדְבָּר
  choice: os animais selvagens do deserto
  rationale: A expressão foi entendida coletivamente como os animais selvagens das regiões desérticas. Como פִּרְאֵי também pode ser tomado mais especificamente como “asnos selvagens”, essa possibilidade foi preservada em nota.
- source_word: כֵּן
  choice: assim
  rationale: Introduz de modo natural a correspondência entre as duas partes do provérbio.
- source_word: מַרְעִית
  choice: pasto para
  rationale: O termo significa literalmente pastagem ou lugar de alimentação. A formulação mantém a metáfora contundente de que os ricos se alimentam dos pobres, sem substituí-la pela imagem mais estreita de “presa”.
- source_word: עָשִׁיר
  choice: os ricos
  rationale: Embora esteja no singular em hebraico, tem valor genérico e contrasta com o plural “pobres”; o plural em português expressa naturalmente essa referência a uma classe social.
- source_word: דַּלִּים
  choice: os pobres
  rationale: O termo pode indicar pessoas fracas ou necessitadas, mas neste contraste social a pobreza e a vulnerabilidade econômica são centrais, em consonância com o paralelo grego.
theological_decisions:
- issue: Divergência entre o texto hebraico preservado e o paralelo grego
  choice: Traduzir no texto principal o provérbio hebraico, que apresenta a exploração como alimentação predatória.
  alternative: “Que paz pode haver entre a hiena e o cão? E que paz entre o rico e o pobre?”
  rationale: Como o hebraico está preservado com alta confiança, ele recebe primazia. O grego contém um provérbio substancialmente diferente, centrado na hostilidade irreconciliável, embora mantenha o mesmo contraste social; por isso, sua leitura é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura proverbial e o paralelismo foram preservados; “pasto para os ricos” mantém deliberadamente a metáfora áspera e acusatória do hebraico.
