  source_fidelity: 'O texto principal segue adequadamente o hebraico preservado: o contraste é entre o rico e o pobre quando agem mal, seguido pela reação arrogante de um e pela súplica do outro. A nota registra corretamente que o grego transmite um provérbio inteiramente distinto. A formulação da citação grega, porém, precisa esclarecer que o mesmo vaso frágil é o que se choca e se despedaça.'
  naturalness: “Age mal” é mais direto e idiomático que “comete uma injustiça” neste paralelismo proverbial. A explicitação de “ele” recupera, sem artificialidade, a ênfase pronominal hebraica. A redação anterior da nota (“Uma bate na outra, e aquela...”) deixa os referentes ambíguos em português.
  terminology: “Rico”, “pobre”, “arrogante” e “misericórdia” são termos claros, atuais e adequados. “Panela de barro” e “caldeirão” preservam o contraste material do provérbio grego.
