base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/003.yaml
  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: pt
  text: Se um rico age mal, ele se mostra arrogante; mas, se um pobre age mal, ele implora por misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha grega traz um dito diferente: “O que uma panela de barro tem em comum com um caldeirão? Ela se choca contra ele e se despedaça.”'
    reason: A tradição grega diverge substancialmente da testemunha hebraica, apresentando outro provérbio.
lexical_decisions:
- source_word: עָשִׁיר
  choice: um rico
  rationale: Traduz diretamente o substantivo hebraico e mantém o contraste social com דַּל.
- source_word: יְעַוֶּה
  choice: comete uma injustiça
  rationale: O verbo עוה expressa agir perversamente ou praticar o que é errado; a formulação portuguesa comunica uma ação injusta sem restringi-la a um delito jurídico específico.
- source_word: יִתְנַוֶּה
  choice: mostra-se arrogante
  rationale: A forma reflexiva indica comportamento altivo ou arrogante. Esta opção preserva o contraste entre a autossuficiência do rico e a súplica do pobre.
- source_word: דַּל
  choice: um pobre
  rationale: Neste paralelismo social, o termo designa alguém pobre ou desprovido de recursos; “um pobre” é claro e direto em português.
- source_word: יִתְחַנָּן
  choice: suplica por misericórdia
  rationale: O hitpael de חנן denota pedir favor ou compaixão insistentemente. “Suplica por misericórdia” torna explícito o sentido implícito do pedido, em português natural.
theological_decisions:
- issue: Divergência substancial entre as testemunhas hebraica e grega de Sirácida 13:3
  choice: Traduzir no texto principal o dito hebraico sobre o rico e o pobre.
  alternative: 'Seguir o grego: “Que terá uma panela de barro em comum com um caldeirão? Uma bate na outra, e aquela se despedaça.”'
  rationale: A fonte hebraica fornecida tem alta confiança e apresenta um texto coerente, embora inteiramente diferente do grego. Como a tradução deve partir primeiro da evidência na língua original aqui indicada, o hebraico fica no texto principal. A leitura grega não é harmonizada nem ocultada, mas registrada integralmente em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi mantido por meio da repetição de “comete uma injustiça”; os pronomes hebraicos enfáticos não foram vertidos mecanicamente, para evitar uma construção artificial em português.
