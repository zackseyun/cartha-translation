base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/017.yaml
  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: pt
  text: E ele lhe deu os seus mandamentos[a] e lhe concedeu autoridade em matéria de estatutos e juízos, para ensinar a Jacó os seus testemunhos e iluminar Israel por meio da sua lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Geniza do Cairo traz uma forma mais curta deste versículo: “E ele lhe deu os seus mandamentos e lhe concedeu autoridade em matéria de estatutos e juízos”. As orações “para ensinar a Jacó os seus testemunhos e iluminar Israel por meio da sua lei” são atestadas pelo texto grego e foram incluídas aqui porque a linha hebraica parece abreviada.'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: E ele lhe deu os seus mandamentos
  rationale: Traduz diretamente נתן por “deu” e preserva em “mandamentos” a força jurídica e pactual de מצותיו. A conjunção inicial reflete ו.
- source_word: וימשילהו
  choice: e lhe concedeu autoridade
  rationale: O hifil de משל expressa fazer governar ou conferir domínio. Neste contexto sacerdotal e jurídico, “concedeu autoridade” comunica jurisdição delegada sem sugerir realeza.
- source_word: בחוק ומשפט
  choice: em estatuto e julgamento
  rationale: Mantém a textura jurídica formal do par hebraico חוק ומשפט e a preposição comprimida ב, sem ampliar indevidamente seu sentido.
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: para ensinar a Jacó os seus testemunhos
  rationale: A oração grega de finalidade completa a linha hebraica abreviada. “Testemunhos” conserva o vocabulário jurídico-pactual de μαρτύρια.
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: e iluminar Israel por meio da sua lei
  rationale: “Iluminar” preserva a metáfora de φωτίζω, enquanto “por meio da” torna clara a função instrumental da lei.
theological_decisions:
- issue: Uso do paralelo grego para completar o testemunho hebraico mais curto
  choice: Incluir no texto principal as orações sobre ensinar Jacó e iluminar Israel.
  alternative: 'Traduzir somente o hebraico preservado: “E ele lhe deu os seus mandamentos e lhe concedeu autoridade em estatuto e julgamento.”'
  rationale: O hebraico da Geniza preservado neste ponto é mais curto e está sinalizado como divergência importante; o grego apresenta uma continuação coerente com a função docente sacerdotal. A inclusão é explicitada em nota para não ocultar a variante textual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Conserva-se o vocabulário jurídico-pactual e a relativa compressão do hebraico, enquanto as orações supridas pelo grego são formuladas naturalmente e identificadas em nota.
