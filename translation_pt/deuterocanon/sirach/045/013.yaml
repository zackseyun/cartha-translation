review_pass:
  verdict: revise
  source_fidelity: O texto principal transmite adequadamente o contraste temporal, a exclusão permanente de quem é alheio à linhagem autorizada e a continuidade hereditária. A leitura explícita de «somente seus filhos e seus descendentes» depende legitimamente do paralelo grego, pois a segunda parte do hebraico conservado é difícil. A nota, porém, deve representar essa dificuldade com mais cautela e não introduzir «os filhos deles», expressão que não corresponde diretamente ao hebraico.
  naturalness: A redação é clara e solene em português moderno. «Antes dele, não houve» é mais preciso do que «Antes dele nunca houve», pois preserva sem ambiguidade o contraste temporal do hebraico. «Estranho» funciona no registro bíblico para alguém não autorizado, e a nota esclarece o sentido.
  terminology: «Vestes», «estranho» e «descendentes» são apropriados ao contexto sacerdotal. «Arão» é a forma de uso corrente e mais imediatamente reconhecível na leitura brasileira.
  issues:
  - severity: low
    issue: A nota apresenta uma paráfrase literal excessivamente definida e inclui «aos filhos deles».
    rationale: O hebraico de האמין לו ולבניו כזה, וכן בניו לדורותם é difícil e não sustenta com segurança a referência explícita a «filhos deles». A nota deve indicar a incerteza, sem converter uma possível reconstrução em tradução literal.
  - severity: low
    issue: «Antes dele nunca houve» pode soar como negação absoluta, e não apenas como anterioridade em relação a Arão.
    rationale: Antes dele, não houve reproduz de modo mais direto לפניו לא היה כן e mantém a formulação sóbria do original.
