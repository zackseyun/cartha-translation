base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/013.yaml
  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: pt
  text: Antes dele, não houve vestes como estas[a], e nenhum estranho jamais as vestirá; somente seus filhos e seus descendentes, por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil na segunda metade do versículo. De modo muito literal e incerto, lê-se algo como: “Ele lhe confiou/confirmou isto, a ele e a seus filhos, assim; e igualmente seus filhos, por suas gerações”. O paralelo grego esclarece o sentido como a exclusão de qualquer estranho e a inclusão somente dos filhos e descendentes de Arão.'
    reason: alternative_reading
lexical_decisions:
- source_word: לפניו
  choice: Antes dele
  rationale: Expressa prioridade temporal em relação a Aarão, de acordo também com o grego πρὸ αὐτοῦ.
- source_word: לא היה כן
  choice: nunca houve ... como essas
  rationale: Verte naturalmente a afirmação de que anteriormente não existira nada semelhante; o objeto implícito é explicitado pelo contexto das vestes sacerdotais.
- source_word: זר / ἀλλογενής
  choice: estranho
  rationale: Designa alguém alheio à linhagem sacerdotal autorizada, sem sugerir necessariamente nacionalidade estrangeira.
- source_word: לעולם לא ילבשם
  choice: jamais as vestirá
  rationale: Reproduz de modo idiomático a exclusão permanente e o sentido próprio de לבש no contexto de roupas.
- source_word: לבניו... בניו לדורותם / τῶν υἱῶν αὐτοῦ... τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: somente seus filhos e seus descendentes, por todas as suas gerações
  rationale: Segue a leitura esclarecedora do paralelo grego e conserva a ideia hebraica de continuidade hereditária através das gerações.
theological_decisions:
- issue: Exclusividade hereditária das vestes sacerdotais
  choice: A cláusula principal exclui quem não pertence à linhagem autorizada e inclui os filhos e descendentes de Aarão.
  alternative: 'Ler o hebraico difícil como: “Ele confiou isso a ele e igualmente a seus filhos, e assim aos filhos deles por suas gerações”.'
  rationale: A leitura adotada é explicitamente apoiada pelo paralelo grego e pelo contexto imediato, mas a formulação alternativa do hebraico transmitido é preservada em nota, sem ocultar a dificuldade textual.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil. “Vestes” mantém dignidade bíblica sem soar arcaico; “estranho” evita restringir זר a um estrangeiro de outra nação. A ambiguidade do hebraico transmitido é indicada em nota.
