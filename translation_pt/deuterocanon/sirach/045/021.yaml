base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: pt
  text: Deu-lhe como alimento a parte principal das coisas sagradas[a]; eles comerão das ofertas feitas pelo fogo de Yahweh[b]. O pão da Presença[c] é a porção dele, uma dádiva para ele e para seus descendentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “deu-lhe como pão a parte principal das coisas sagradas”. O hebraico é condensado; “parte principal” também pode ser entendida como “primeira parte” ou “parte mais excelente”. O paralelo grego fala mais amplamente dos sacrifícios de Yahweh destinados aos sacerdotes.
    reason: lexical_alternative
  - marker: b
    text: “Ofertas feitas pelo fogo” traduz o termo hebraico técnico também vertido como “ofertas queimadas” ou, em algumas traduções, “ofertas de alimento”.
    reason: lexical_alternative
  - marker: c
    text: O “pão da Presença” é o pão sagrado colocado diante de Deus, tradicionalmente chamado “pão da proposição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ראשית קדש
  choice: o melhor das coisas sagradas
  rationale: A expressão hebraica condensada indica a parte primeira, principal ou mais excelente das coisas consagradas. A tradução preserva essa prioridade sem restringi-la indevidamente apenas a pão.
- source_word: לחם
  choice: como alimento
  rationale: Embora o sentido básico seja “pão”, aqui o termo pode funcionar de modo mais amplo como alimento ou provisão sacerdotal; a segunda ocorrência, na expressão cultual לחם פנים, é traduzida literalmente por “pão”.
- source_word: אשי יהוה
  choice: as ofertas de alimento de Yahweh
  rationale: O termo sacrificial אשים é tradicionalmente vertido como “ofertas feitas pelo fogo”, mas também conceitua as ofertas como alimento apresentado a Deus. “Ofertas de alimento” é claro e mantém a categoria cultual; a alternativa formal consta em nota.
- source_word: יאכלון
  choice: eles comerão
  rationale: O verbo está no plural e aponta naturalmente para os beneficiários sacerdotais, isto é, Arão e sua linhagem. O futuro preserva a forma hebraica e sua força de concessão permanente.
- source_word: לחם פנים
  choice: o pão da Presença
  rationale: Expressão cultual para o pão colocado diante de Deus. A formulação é transparente e próxima do hebraico; o nome tradicional é indicado em nota.
- source_word: חלקו
  choice: é a porção dele
  rationale: חלק designa a parte ou quota atribuída a alguém. A expressão portuguesa comunica de modo conciso o direito sacerdotal.
- source_word: ומתנה לו ולזרעו
  choice: uma dádiva para ele e para seus descendentes
  rationale: מתנה é uma dádiva ou concessão, e זרעו designa aqui a linhagem sacerdotal de Arão. “Descendentes” torna o referente coletivo claro sem acrescentar especificação doutrinária.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: para seus descendentes
  rationale: O paralelo grego confirma que a concessão se estende à linhagem de Arão.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama יהוה. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Amplitude de ראשית קדש נתן לו לחם
  choice: Deu-lhe como alimento o melhor das coisas sagradas
  alternative: Deu-lhe o melhor pão sagrado; Deu-lhe como pão as primícias das coisas sagradas
  rationale: A sintaxe hebraica é comprimida e permite mais de uma relação entre “o principal das coisas sagradas” e “pão/alimento”. A redação escolhida mantém a ideia de provisão sacerdotal sem afirmar que ראשית קדש modifica diretamente “pão”.
- issue: Terminologia das porções sacerdotais
  choice: ofertas de alimento / pão da Presença
  alternative: ofertas feitas pelo fogo / pães da proposição
  rationale: As escolhas mantêm o contexto sacrificial e sacerdotal em linguagem compreensível, enquanto as formas mais tradicionais ou literais são preservadas nas notas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A redação conserva a ambiguidade da primeira oração hebraica por meio de uma nota e evita tornar “pão” um modificador explícito de “o melhor das coisas sagradas”. Os marcadores [a], [b] e [c] aparecem no texto.
