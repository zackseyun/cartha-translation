base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: pt
  text: Ele o vestiu de esplendor perfeito[a] e o adornou com glória e força, com calças, túnicas e um manto[b]; e o circundou com sinos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de pleno ornamento de beleza”, em lugar de “de esplendor perfeito”. A expressão hebraica é compacta e elevada, e o grego também aponta para um sentido intensificado e honorífico.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico sobrevivente e o grego diferem nos detalhes das vestes sacerdotais neste versículo. O hebraico traz “calças, túnicas e um manto [...] sinos”, enquanto o testemunho grego apresenta outra sequência e inclui o efod.
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו
  choice: Ele o vestiu
  rationale: O hifil de לבש significa vestir alguém. A formulação é natural em português e conserva o sentido cerimonial sem recorrer a terminologia eclesiástica posterior.
- source_word: כליל תפארת
  choice: esplendor perfeito
  rationale: כליל exprime completude ou perfeição, e תפארת, beleza, glória ou esplendor. A expressão compacta preserva o tom elevado do hebraico e sua correspondência geral com o grego.
- source_word: ויפארהו
  choice: o adornou
  rationale: O verbo פאר, no contexto das vestes sacerdotais, descreve tornar alguém belo e magnífico. “Adornou” mantém tanto o aspecto concreto quanto o honorífico.
- source_word: בכבוד ועוז
  choice: com glória e força
  rationale: כבוד pode significar glória ou honra, e עוז, força ou poder. A tradução permanece próxima do paralelismo hebraico e soa digna em português.
- source_word: מכנסים
  choice: calções
  rationale: O termo designa a peça sacerdotal que cobre a parte inferior do corpo. “Calções” é mais adequado ao vestuário antigo do que “calças” e evita tornar explícito “de linho”, ausente nesta linha.
- source_word: כתנות
  choice: túnicas
  rationale: כתנת designa normalmente uma túnica no vocabulário bíblico de vestuário; o plural do hebraico é mantido.
- source_word: ומעיל
  choice: e um manto
  rationale: מעיל é uma veste exterior semelhante a um manto, especialmente em contexto sacerdotal. “Manto” é claro e corrente.
- source_word: ויקיפהו
  choice: o cercou
  rationale: O verbo comunica a ideia de rodear ou circundar. “Cercou” reproduz naturalmente a imagem dos sinos dispostos ao redor da veste.
- source_word: פעמונים
  choice: sinos
  rationale: O hebraico diz apenas “sinos”. Não se acrescenta “de ouro”, embora outros textos sacerdotais tragam essa especificação.
theological_decisions:
- issue: Uso do texto hebraico da Geniza diante da divergência com o paralelo grego
  choice: Traduzir prioritariamente o hebraico preservado, usando o grego como testemunho de controle para o contexto das vestes sacerdotais e para o tom elevado.
  alternative: Seguir a sequência grega, que inclui a estola longa e o efod e não corresponde integralmente à lista hebraica.
  rationale: O hebraico fornecido é substancial e coerente, mas sua divergência com o grego é textualmente relevante. A tradução segue o testemunho hebraico sem ocultar a variante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a estrutura cerimonial e o paralelismo do hebraico, evitando arcaísmos como “bragas” e acréscimos não expressos no versículo.
