base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: pt
  text: Yahweh viu, indignou-se e os consumiu no ardor da sua ira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego amplia a descrição do juízo: “foram levados ao fim no furor da ira; ele realizou prodígios contra eles, para consumi-los no fogo da sua chama”. O testemunho hebraico é mais breve.'
    reason: alternative_reading
lexical_decisions:
- source_word: וירא יהוה
  choice: Yahweh viu isso
  rationale: Traduz diretamente o verbo ראה e conserva o nome divino יהוה como “Yahweh”. O pronome “isso” torna natural em português a referência ao episódio narrado nos versículos anteriores, sem acrescentar conteúdo substantivo.
- source_word: ויתאנף
  choice: e ficou indignado
  rationale: O hitpael de אנף expressa ira ou indignação intensa. “Ficou indignado” é atual, digno e evita uma formulação artificial.
- source_word: ויכלם
  choice: exterminou-os
  rationale: A forma indica que Yahweh lhes deu fim. “Exterminou-os” comunica claramente o juízo destrutivo; o paralelo grego confirma esse sentido, embora acrescente imagens não presentes na linha hebraica.
- source_word: בחרון אפו
  choice: no ardor da sua ira
  rationale: Preserva a metáfora hebraica de ira abrasadora em uma expressão idiomática e compreensível em português.
theological_decisions:
- issue: Nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Delimitação do versículo
  choice: Começar em וירא יהוה, conforme o marcador hebraico (יט) e o paralelo grego
  alternative: Incluir “Os homens de Datã e Abirão e o grupo de Corá...” no versículo 19
  rationale: Na fonte hebraica fornecida, o marcador (יט) aparece depois da referência aos rebeldes, e o texto grego de 45:19 também começa com a reação do Senhor. Assim, a primeira frase pertence ao contexto anterior, não ao corpo deste versículo.
- issue: Relação entre o hebraico e a expansão grega
  choice: Manter no texto principal a forma mais curta do hebraico
  alternative: Acrescentar os prodígios e o fogo da chama mencionados no grego
  rationale: Como o hebraico está preservado e tem alta confiança, ele rege o texto principal. A ampliação grega é relevante como variante e apoio interpretativo, mas não deve ser incorporada silenciosamente.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil. A redação é concisa e solene, conserva a intensidade do hebraico e respeita a delimitação do versículo indicada pela própria fonte.
