base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: pt
  text: 'E sua aliança foi com Davi, filho de Jessé, da tribo de Judá: a herança do rei passa exclusivamente de filho para filho, mas a herança de Arão pertence também à sua descendência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico deste versículo é mais breve e parece estar comprimido; o paralelo grego preserva o contraste mais completo: a herança régia segue uma única linha dinástica, enquanto a herança de Arão pertence à sua descendência.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: E sua aliança foi com Davi
  rationale: Mantém a coordenação do hebraico e o sufixo pronominal de בריתו. Pelo contexto, “sua” se refere a Deus, sem explicitar esse antecedente no texto.
- source_word: בן ישי למטה יהודה
  choice: filho de Jessé, da tribo de Judá
  rationale: Reproduz o patronímico e emprega “tribo” para מטה em seu sentido genealógico, com formulação natural em português.
- source_word: κληρονομία βασιλέως
  choice: a herança do rei
  rationale: O grego preserva a formulação mais completa do contraste. “Herança do rei” mantém o paralelismo concreto com a herança de Arão.
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: passa exclusivamente de filho para filho
  rationale: Expressa a transmissão pela única linha dinástica indicada por μόνου, sem sugerir que apenas um filho em toda a história pudesse herdá-la.
- source_word: אשר תהיה לו ולזרעו, כהונה גדולה על עולם / κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: mas a herança de Arão pertence também à sua descendência
  rationale: A formulação combina o contraste preservado no grego com a ideia hebraica da continuidade hereditária do sumo sacerdócio. “Descendência” traduz de modo natural tanto זרע quanto σπέρμα.
theological_decisions:
- issue: Uso conjunto do testemunho hebraico comprimido e do paralelo grego mais completo
  choice: Traduzir a cláusula hebraica sobre Davi como base e completar o contraste entre a sucessão régia e a herança de Arão segundo o grego.
  alternative: Traduzir somente o hebraico preservado, incluindo a cláusula sobre o sumo sacerdócio perpétuo e deixando a frase sobre Davi sem o contraste completo.
  rationale: O testemunho hebraico fornecido apresenta aparente compressão ou desalinhamento de versificação, enquanto o grego conserva a estrutura antitética completa. A redação mantém o hebraico onde é claro e recorre ao grego como evidência textual efetiva, assinalando a questão em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Passa exclusivamente de filho para filho” torna explícito o movimento sucessório da expressão grega sem resolver além do necessário a relação entre realeza davídica e sacerdócio aarônico.
