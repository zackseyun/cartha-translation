base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/003.yaml
  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: pt
  text: Por suas palavras, os sinais vieram depressa[a], e ele o fortaleceu diante de um rei[b]. Deu-lhe ordens a respeito do povo e mostrou-lhe a sua glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Com suas palavras, fez cessar os sinais”, em vez de “os sinais vieram depressa”.'
    reason: textual_variant
  - marker: b
    text: 'O grego traz: “ele o honrou diante de reis”, em vez de “ele o fortaleceu diante de um rei”.'
    reason: textual_variant
  - marker: c
    text: 'O hebraico transmitido nesta parte é difícil e pode sugerir: “e eles viram a sua glória”. O grego sustenta: “e mostrou-lhe a sua glória”, leitura adotada no texto.'
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: À sua palavra
  rationale: Expressa o valor instrumental ou temporal da preposição ב e mantém o foco do hebraico em sua palavra, com formulação natural em português.
- source_word: האותות
  choice: os sinais
  rationale: É o equivalente direto de אותות e corresponde ao grego σημεῖα, sem explicitar além do texto que se tratava de milagres.
- source_word: מהרו
  choice: vieram depressa
  rationale: O verbo hebraico indica rapidez; a formulação evita o pouco natural 'os sinais se apressaram' e conserva o sentido.
- source_word: ויחזקהו
  choice: ele o fortaleceu
  rationale: Traduz diretamente o hifil de חזק. A leitura grega 'honrou/glorificou' é preservada em nota como variante.
- source_word: לפני מלך
  choice: diante de um rei
  rationale: O hebraico não tem artigo e apresenta מלך no singular; a tradução preserva ambos os aspectos.
- source_word: ויצוהו אל העם
  choice: Deu-lhe ordens a respeito do povo
  rationale: צוה denota ordenar, enquanto אל העם indica de modo difícil a relação das ordens com o povo. 'A respeito do povo' é natural e mantém essa relação sem definir em excesso se o povo é destinatário ou beneficiário.
- source_word: ויראו את כבודו
  choice: e mostrou-lhe a sua glória
  rationale: A forma hebraica transmitida pode ser entendida como 'e eles viram a sua glória', mas o paralelo grego sustenta 'mostrou-lhe a sua glória'; essa leitura é adotada diante da instabilidade textual e a ambiguidade é registrada em nota.
theological_decisions:
- issue: Prioridade do hebraico diante de divergências substanciais no paralelo grego
  choice: Seguir o hebraico onde ele é claro e recorrer ao grego na cláusula final, aparentemente instável.
  alternative: Traduzir estritamente a forma hebraica final como 'e eles viram a sua glória', ou seguir integralmente o grego em todo o versículo.
  rationale: A solução conserva a evidência hebraica primária sem ocultar a dificuldade textual. O grego é usado como testemunho antigo na cláusula em que oferece uma leitura contextual e gramaticalmente coerente, e as divergências são explicitadas nas notas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe é direta, e as notas preservam as variantes relevantes sem sobrecarregar o texto principal.
