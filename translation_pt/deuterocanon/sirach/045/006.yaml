base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: pt
  text: Ele exaltou Aarão, um santo semelhante a ele, da tribo de Levi,[a] e o constituiu como estatuto perpétuo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma forma mais extensa: “santo semelhante a ele, seu irmão, da tribo de Levi”. O hebraico citado é mais curto; «semelhante a ele» segue o paralelo grego, enquanto «seu irmão» não é incluído no texto principal.'
    reason: alternative_reading
  - marker: b
    text: Ou “como ordenança perpétua”, “para um estatuto perpétuo” ou “por estatuto perpétuo”. A expressão hebraica é concisa e provavelmente se refere à nomeação legal e duradoura de Aarão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: Ele exaltou
  rationale: O hifil de רום expressa elevar ou exaltar. “Exaltou” preserva o tom honorífico e corresponde ao grego ὕψωσεν, sem explicitar o sujeito, que não aparece nesta linha hebraica.
- source_word: קדוש
  choice: homem santo
  rationale: קדוש está em aposição a Aarão e não tem artigo explícito. Em português, “homem santo” comunica naturalmente essa qualidade sem transformar a expressão em título definido.
- source_word: את אהרן
  choice: Aarão
  rationale: את marca o objeto direto, seguido do nome próprio. “Aarão” é a forma portuguesa tradicional e amplamente reconhecida.
- source_word: למטה לוי
  choice: da tribo de Levi
  rationale: מַטֶּה designa uma tribo no contexto genealógico. Embora ל possa sugerir literalmente “para a tribo”, a construção identifica aqui a vinculação tribal de Aarão; o paralelo grego confirma “da tribo de Levi” com ἐκ φυλῆς Λευεί.
- source_word: וישימהו
  choice: e o estabeleceu
  rationale: שׂים pode significar pôr, constituir ou estabelecer. “Estabeleceu” é natural em português e comunica nomeação duradoura sem acrescentar explicitamente “sacerdócio”, termo ausente da linha.
- source_word: לחק עולם
  choice: por decreto perpétuo
  rationale: חֹק pertence ao campo de estatuto, decreto ou ordenança, e עוֹלָם indica duração permanente. A formulação conserva o registro jurídico e evita a construção portuguesa pouco clara “fez dele um estatuto”.
theological_decisions:
- issue: Identificação do sujeito de וירם
  choice: Manter o sujeito apenas como “Ele”
  alternative: “Deus exaltou” ou “O Senhor exaltou”
  rationale: O verbo hebraico contém um sujeito masculino singular implícito, mas esta linha não o nomeia. O contexto permite identificá-lo, porém explicitá-lo no texto acrescentaria uma designação ausente do versículo.
- issue: Relação entre Aarão e o decreto perpétuo
  choice: “o estabeleceu por decreto perpétuo”
  alternative: “fez dele um estatuto perpétuo” ou “estabeleceu seu sacerdócio para sempre”
  rationale: A escolha conserva tanto o ato de constituição quanto o caráter jurídico e duradouro da expressão. Evita identificar expressamente o objeto como “sacerdócio”, embora essa seja a implicação contextual, e evita sugerir literalmente que a pessoa de Aarão seja um estatuto.
- issue: Leitura mais extensa do paralelo grego
  choice: Traduzir no texto principal a linha hebraica mais curta e registrar a expansão grega em nota
  alternative: Inserir no texto “santo semelhante a ele, seu irmão”
  rationale: O hebraico de alta confiança não contém as palavras correspondentes a “semelhante a ele, seu irmão”. O grego constitui testemunho textual importante, mas sua expansão deve ser preservada como variante, sem ser incorporada silenciosamente ao texto hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “Aarão” e “Levi” nas formas bíblicas reconhecidas. A redação evita linguagem denominacional e mantém implícito o sujeito que o hebraico não nomeia. “Por decreto perpétuo” oferece clareza idiomática sem apagar a concisão jurídica do original.
