base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: pt
  text: Pôs sobre ele esplendor e o serviu com sua glória; cingiu-o com os chifres de um boi selvagem[b] e o vestiu de sinos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Estabeleceu para ele uma aliança eterna, deu-lhe o sacerdócio do povo, abençoou-o com belo adorno e cingiu-o com uma veste de glória”. O testemunho hebraico neste ponto difere substancialmente do grego.'
    reason: alternative_reading
  - marker: b
    text: Ou, possivelmente, “com a força elevada de um boi selvagem”. A expressão hebraica é difícil, e a imagem pode ser metafórica, não uma referência a um ornamento literal com chifres.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוד
  choice: esplendor
  rationale: Preserva a ideia de majestade visível e mantém distinção em relação a כבוד, traduzido como “glória”.
- source_word: וישרתהו
  choice: o serviu
  rationale: Traduz diretamente o verbo שרת, “servir, ministrar”. A construção hebraica é incomum, mas não deve ser suavizada nem harmonizada silenciosamente com o grego.
- source_word: בכבודו
  choice: com sua glória
  rationale: Conserva o sufixo possessivo e a linguagem elevada da investidura sacerdotal.
- source_word: ויאזרהו
  choice: cingiu-o
  rationale: אזר designa cingir ou prender ao redor, especialmente em contexto de vestimenta; “cingiu-o” é digno e adequado à cerimônia.
- source_word: בתועפות ראם
  choice: com os chifres de um boi selvagem
  rationale: Mantém a imagem concreta possível no hebraico. Como תועפות também pode expressar força elevada, a alternativa é preservada em nota.
- source_word: וילבישהו פעמונים
  choice: o vestiu de sinos
  rationale: Segue de perto a imagem hebraica das vestes sacerdotais adornadas com פעמונים, “sinos”.
theological_decisions:
- issue: Prioridade entre o testemunho hebraico e o paralelo grego substancialmente diferente
  choice: Seguir no texto principal o hebraico preservado e registrar o grego em nota
  alternative: 'Adotar o grego: “Estabeleceu com ele uma aliança eterna, deu-lhe o sacerdócio do povo, abençoou-o com belo adorno e cingiu-o com uma veste de glória.”'
  rationale: O hebraico existente tem prioridade como fonte principal, mas a divergência textual significativa do grego é evidência antiga relevante e deve permanecer visível, sem harmonização.
- issue: Sentido da expressão בתועפות ראם
  choice: Preservar no texto a imagem dos chifres de um boi selvagem
  alternative: “com a força elevada de um boi selvagem”
  rationale: A expressão hebraica é difícil e admite tanto uma leitura concreta quanto uma metáfora de força; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação cerimonial. “Cingiu-o” conserva o contexto de investidura; “o serviu” mantém a formulação incomum do hebraico em vez de resolvê-la pelo paralelo grego.
