  text: God honored him[a], and strengthened him in the heights.
translation:
  language: pt
  text: Deus o honrou[a] e o fortaleceu nas alturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma redação mais extensa: “Ele o tornou semelhante à glória dos santos e o engrandeceu entre os terrores dos inimigos”. O testemunho hebraico, porém, diz: “Deus o honrou e o fortaleceu nas alturas”.'
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: o honrou
  rationale: O piel de כבד expressa a concessão de honra ou glória. “O honrou” traduz diretamente o hebraico em português natural, sem intensificar desnecessariamente para “o glorificou”.
- source_word: אלהים
  choice: Deus
  rationale: No contexto, o substantivo hebraico designa o Deus de Israel como sujeito singular.
- source_word: ויאמצהו
  choice: o fortaleceu
  rationale: 'A forma de אמץ tem sentido causativo: tornar forte, fortalecer. “O fortaleceu” preserva essa força verbal.'
- source_word: במרומים
  choice: nas alturas
  rationale: מרומים indica alturas ou lugares elevados. “Nas alturas” conserva a imagem espacial e deixa em aberto se ela se refere à esfera celestial ou a uma condição elevada.
theological_decisions:
- issue: Grande divergência textual entre o hebraico e o grego
  choice: 'Seguir no texto principal o hebraico preservado: “Deus o honrou e o fortaleceu nas alturas”.'
  alternative: 'O grego traz: “Ele o tornou semelhante à glória dos santos e o engrandeceu entre os terrores dos inimigos”.'
  rationale: O testemunho hebraico existente tem alta confiança e é a fonte principal. Como a divergência grega é substancial e pode refletir outra forma textual, ela é registrada em nota, sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa acompanha o paralelismo hebraico e preserva a possível ambiguidade de “nas alturas”.
