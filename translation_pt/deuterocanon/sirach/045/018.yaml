base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: pt
  text: Estrangeiros se enfureceram contra ele[a] e, no deserto, tiveram ciúmes dele — os homens ligados a Datã e Abirão e o grupo de Corá, movidos por furor e ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico existente é mais breve: “Estrangeiros se enfureceram contra ele e, no deserto, tiveram ciúmes dele”. O paralelo grego identifica explicitamente os opositores como os homens ligados a Datã e Abirão e o grupo de Corá, acrescentando que agiram com furor e ira.'
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: se enfureceram contra ele
  rationale: O verbo חרה com ב expressa ira que se acende contra alguém. A formulação é natural em português e mantém a intensidade da hostilidade.
- source_word: זרים
  choice: estrangeiros
  rationale: A palavra hebraica significa literalmente pessoas estranhas, alheias ou de fora. “Estrangeiros” conserva essa forma lexical, sem decidir que se trata necessariamente de estrangeiros étnicos.
- source_word: ויקנאו בו
  choice: tiveram ciúmes dele
  rationale: קנא pode indicar ciúme, inveja ou zelo. Neste contexto de rivalidade contra Arão, “tiveram ciúmes dele” preserva o caráter pessoal da oposição e a ambiguidade próxima do paralelo grego.
- source_word: במדבר
  choice: no deserto
  rationale: “Deserto” é uma tradução corrente e clara para מדבר no contexto da peregrinação de Israel.
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: os homens ligados a Datã e Abirão
  rationale: A expressão grega designa os homens associados a Datã e Abirão. “Ligados a” evita sugerir posse ou parentesco e exprime claramente a associação.
- source_word: ἡ συναγωγὴ Κόρε
  choice: o grupo de Corá
  rationale: Aqui συναγωγή indica a coletividade ou facção reunida em torno de Corá. “Grupo” é natural e evita conotações eclesiais indevidas.
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: com furor e ira
  rationale: A dupla expressão grega intensifica a hostilidade. “Furor e ira” mantém a força retórica e o paralelismo.
theological_decisions:
- issue: Testemunho hebraico breve em contraste com o paralelo grego mais completo
  choice: Seguir as duas orações hebraicas no texto principal e incorporar, após travessão, a identificação e a intensificação preservadas no grego.
  alternative: 'Traduzir apenas o hebraico: “Estrangeiros se enfureceram contra ele e, no deserto, tiveram ciúmes dele.”'
  rationale: O hebraico sobrevivente tem prioridade, mas o paralelo grego constitui evidência textual antiga e preserva uma continuação explícita. A nota informa com transparência que essa continuação não consta do testemunho hebraico existente, sem ocultar a divergência textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem das orações acompanha o hebraico; o travessão sinaliza naturalmente a expansão identificadora preservada no grego.
