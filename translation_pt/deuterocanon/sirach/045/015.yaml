base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: pt
  text: Moisés o ordenou[a] e o ungiu com óleo santo. Isso lhe foi uma aliança eterna, e para sua descendência, enquanto durarem os céus.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “encheu-lhe a mão”, expressão sacerdotal que significa investir ou ordenar alguém para um ofício; o grego também traz “encheu as mãos”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “como os dias dos céus”, expressão que indica duração contínua.
    reason: lexical_alternative
  - marker: c
    text: 'O paralelo grego continua além do hebraico preservado aqui: “para servi-lo e exercer o sacerdócio, e para abençoar o seu povo em seu nome”. O texto principal segue o testemunho hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא ... את ידו
  choice: o ordenou
  rationale: A expressão hebraica literalmente significa “encher a mão” e funciona como termo técnico para investir alguém no ofício sacerdotal. “Ordenou” comunica esse sentido com clareza em português atual; o paralelo grego conserva literalmente a imagem das mãos.
- source_word: וימשחהו
  choice: o ungiu
  rationale: O verbo משח designa diretamente o ato ritual de ungir, confirmado pelo grego ἔχρισεν.
- source_word: בשמן הקדש
  choice: com óleo santo
  rationale: Tradução direta e natural da expressão hebraica, também apoiada pelo grego ἐν ἐλαίῳ ἁγίῳ.
- source_word: ברית עולם
  choice: uma aliança eterna
  rationale: A expressão indica permanência duradoura da aliança. “Aliança eterna” é clara, digna e mantém a força do hebraico e do grego διαθήκην αἰώνιον.
- source_word: ולזרעו
  choice: e para sua descendência
  rationale: “Descendência” expressa naturalmente o sentido coletivo de זרע, sem a possível opacidade de uma tradução literal como “semente”.
- source_word: כימי שמים
  choice: enquanto durarem os céus
  rationale: O hebraico diz literalmente “como os dias dos céus”. A formulação escolhida explicita seu valor temporal e preserva a imagem cósmica.
theological_decisions:
- issue: Alcance da promessa da aliança no contexto sacerdotal
  choice: Apresentar a aliança como pertencente a ele e à sua descendência em termos duradouros, sem ampliar a afirmação do versículo.
  alternative: Interpretá-la explicitamente como sacerdócio absolutamente perpétuo, ou restringi-la apenas à vida de Aarão.
  rationale: O hebraico e o grego vinculam uma aliança duradoura a Aarão e à sua descendência. A tradução mantém essa força sem resolver além do texto suas implicações teológicas.
- issue: Tradução da expressão técnica “encher a mão”
  choice: Traduzir no texto principal como “ordenou”.
  alternative: “Encheu-lhe a mão”, “o investiu” ou “o consagrou”.
  rationale: A expressão se refere à investidura no ofício sacerdotal, não a um ato comum envolvendo a mão. A nota preserva a forma literal para transparência.
- issue: Extensão do texto no paralelo grego
  choice: Seguir no texto principal o hebraico preservado e registrar em nota a continuação grega.
  alternative: Incorporar ao texto principal a continuação presente apenas no paralelo grego.
  rationale: O testemunho hebraico fornecido é a fonte principal e termina após a expressão sobre os céus; a leitura grega mais longa é relevante, mas deve permanecer identificada como variante textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe evita arcaísmos; “descendência” mantém o coletivo hebraico, e as notas documentam tanto o idioma sacerdotal quanto a variante grega.
