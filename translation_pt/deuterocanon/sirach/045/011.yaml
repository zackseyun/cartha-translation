base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/011.yaml
  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: pt
  text: pedras preciosas sobre o peitoral, gravadas à maneira de um sinete em seus engastes[a] — cada pedra preciosa como memorial, com uma inscrição gravada segundo o número dos filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego explicita que os engastes eram de ouro; o hebraico menciona apenas os engastes.
    reason: textual_variant
  - marker: b
    text: O grego traz “segundo o número das tribos de Israel”. O testemunho hebraico diz “filhos de Israel”, provavelmente em referência aos nomes tribais representados pelas pedras.
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: pedras preciosas
  rationale: A expressão hebraica designa pedras muito valiosas; a formulação é natural em português e é corroborada pelo grego λίθοις πολυτελέσιν.
- source_word: החשן
  choice: o peitoral
  rationale: No contexto das vestes sacerdotais, refere-se à peça adornada com pedras usada sobre o peito. “Peitoral” é claro e não sugere necessariamente uma peça de armadura.
- source_word: פתוחי חותם
  choice: gravadas à maneira de um sinete
  rationale: Preserva a ideia de gravação semelhante à usada em selos ou sinetes, também refletida no grego γλύμματος σφραγῖδος.
- source_word: במלואים
  choice: em seus engastes
  rationale: No contexto de pedras preciosas, indica as armações em que estavam fixadas. O hebraico não explicita o ouro mencionado no paralelo grego.
- source_word: לזכרון
  choice: como memorial
  rationale: Mantém o sentido cultual de memória ou comemoração, em consonância com o grego εἰς μνημόσυνον.
- source_word: בכתב חרות
  choice: com uma inscrição entalhada
  rationale: Expressa conjuntamente os elementos de escrita e gravação presentes no hebraico, com redação natural em português.
- source_word: למספר בני ישראל
  choice: segundo o número dos filhos de Israel
  rationale: Segue o testemunho hebraico extante, que diz “filhos de Israel”; a leitura grega “tribos de Israel” é registrada em nota.
theological_decisions:
- issue: Função memorial das pedras gravadas
  choice: As pedras servem de memorial e correspondem aos filhos de Israel.
  alternative: Ler a descrição apenas como referência ao trabalho luxuoso das vestes sacerdotais.
  rationale: Tanto o hebraico לזכרון quanto o grego εἰς μνημόσυνον tornam explícita a função memorial, sem exigir que a tradução acrescente uma interpretação doutrinária.
- issue: Identidade dos grupos representados pelas inscrições
  choice: filhos de Israel
  alternative: tribos de Israel
  rationale: O texto principal segue o hebraico, preservando em nota a leitura interpretativamente próxima do grego, sem harmonizá-las silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Sinete”, “engastes” e “memorial” preservam a precisão do vocabulário sacerdotal e artesanal sem recorrer a linguagem excessivamente arcaica.
