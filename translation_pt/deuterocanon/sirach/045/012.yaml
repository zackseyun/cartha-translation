translation:
  language: pt
  text: esplendor de glória e louvor de poder[a], deleite para os olhos e perfeição da beleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “orgulho da honra, obra de poder, adornos desejados pelos olhos”. O testemunho hebraico difere consideravelmente na formulação, embora ambos descrevam em termos elevados os ornamentos do sumo sacerdote.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: esplendor
  rationale: Expressa majestade e brilho em registro poético, sem se confundir com כבוד, traduzido em seguida por “glória”.
- source_word: כבוד
  choice: glória
  rationale: Sentido comum do termo neste contexto elevado; preserva a sequência poética do hebraico.
- source_word: ותהלת עז
  choice: e louvor de poder
  rationale: 'Mantém a construção condensada do hebraico: תהלה como “louvor” e עז como força ou poder. “Poder” soa mais natural em português nesta expressão sem eliminar sua tensão poética.'
- source_word: מחמד עין
  choice: deleite para os olhos
  rationale: Transmite a ideia de algo visualmente desejável e agradável em português corrente e digno.
- source_word: ומכלל יופי
  choice: e perfeição da beleza
  rationale: מכלל pode indicar plenitude ou perfeição; a escolha conserva o sentido superlativo da descrição ornamental.
theological_decisions:
- issue: Diferença significativa entre o texto hebraico da Genizá do Cairo e o paralelo grego
  choice: Traduzir no texto principal o hebraico preservado, registrando o paralelo grego em nota.
  alternative: 'Seguir a formulação grega: “orgulho da honra, obra de poder, adornos desejados pelos olhos”.'
  rationale: O testemunho hebraico é coerente e tem alta confiança, embora não corresponda verbalmente ao grego. Dar-lhe prioridade preserva a evidência da língua original sem ocultar a variante antiga.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão internacional. A estrutura nominal compacta do hebraico foi preservada sem tornar a frase obscura.
