translation:
  language: pt
  text: e romãs em abundância ao redor[a], para produzir um som melodioso quando ele caminhava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura mais extensa: “e o rodeou de romãs, com muitos sinos de ouro ao redor, para que se ouvisse um som a seus passos, para tornar audível o som no templo, como memorial para os filhos de seu povo”. O testemunho hebraico aqui é mais breve e menciona apenas as romãs e o som associado a seus passos.'
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: e romãs
  rationale: O hebraico diz literalmente “romãs”, provavelmente enfeites em forma de romã na veste do sumo sacerdote. Mantém-se o substantivo concreto, sem acrescentar ao texto principal os sinos mencionados apenas no grego.
- source_word: המון
  choice: em abundância
  rationale: המון expressa grande quantidade ou profusão; “em abundância” comunica esse sentido de modo natural.
- source_word: סביב
  choice: ao redor
  rationale: Indica que os adornos estavam dispostos em torno da veste.
- source_word: לתת
  choice: para fazer soar
  rationale: O infinitivo introduz a finalidade ou o resultado. Em combinação com o substantivo seguinte, “fazer soar” expressa naturalmente a produção de som.
- source_word: נעינה
  choice: uma melodia
  rationale: O termo sugere som musical. “Melodia” preserva essa nuance sem inserir no texto principal os “sinos” explicitados somente pelo paralelo grego.
- source_word: בצעדיו
  choice: a cada passo seu
  rationale: A expressão associa o som ao movimento do sacerdote. Esta formulação é corrente em português e mantém a ideia de que o som se produzia enquanto ele caminhava.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da leitura grega mais extensa
  choice: O texto principal segue o hebraico preservado e usa o grego apenas para esclarecer que se trata de um som audível.
  alternative: “e o rodeou de romãs, com muitos sinos de ouro ao redor, para fazer ouvir um som a cada passo...”
  rationale: O hebraico existente é breve e não menciona explicitamente sinos, templo nem memorial. Embora o grego conserve uma forma mais extensa, incorporar esses elementos ao texto principal apagaria a diferença textual. A nota registra a variante de maneira transparente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a concisão do hebraico e conserva a imagem concreta das romãs, enquanto a nota documenta sem harmonização a expansão grega.
