  text: holy garments of gold[a], blue, and purple, the work of a designer; a breastpiece of judgment, an ephod and a sash, and scarlet yarn[b], the work of a weaver.
translation:
  language: pt
  text: vestes sagradas de ouro, azul e púrpura, trabalho de artesão habilidoso; o peitoral do julgamento[a], o éfode e a faixa, e fio escarlate[b], trabalho de tecelão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peitoral do julgamento” retoma a terminologia sacerdotal de Êxodo para o peitoral usado pelo sumo sacerdote e associado à obtenção de decisões.
    reason: cross_reference
  - marker: b
    text: Ou “fio carmesim”. O hebraico designa o material têxtil tingido de escarlate ou carmesim empregado nas vestes sacerdotais.
    reason: lexical_alternative
lexical_decisions:
- source_word: בגדי קודש
  choice: vestes sagradas
  rationale: Expressa de modo natural o caráter separado para o culto, sem a rigidez pouco idiomática de “vestes de santidade”.
- source_word: זהב תכלת, וארגמן
  choice: de ouro, azul e púrpura
  rationale: Mantém a lista compacta de materiais e cores preciosos. “Azul” é uma tradução clara de תכלת, cujo matiz exato podia tender ao azul-violeta.
- source_word: מעשה חשב
  choice: trabalho de artesão habilidoso
  rationale: A expressão designa trabalho têxtil planejado e artisticamente elaborado; esta formulação preserva a habilidade artesanal sem especificar indevidamente bordado ou outra técnica.
- source_word: חשן משפט
  choice: peitoral do julgamento
  rationale: Conserva a terminologia sacerdotal de Êxodo e a relação lexical de משפט com julgamento, decisão ou pronunciamento.
- source_word: אפוד
  choice: éfode
  rationale: Termo técnico para uma peça sacerdotal sem equivalente descritivo curto e inequívoco em português.
- source_word: ואזור
  choice: e a faixa
  rationale: “Faixa” é atual, clara e adequada para a peça semelhante a um cinto usada nas vestes sacerdotais.
- source_word: ושני תולעת
  choice: e fio escarlate
  rationale: Designa o material têxtil tingido de escarlate ou carmesim; “fio escarlate” é natural no contexto da confecção das vestes.
- source_word: מעשה אורג
  choice: trabalho de tecelão
  rationale: Traduz diretamente a referência explícita ao tecelão e preserva a distinção em relação ao trabalho artístico mencionado antes.
theological_decisions:
- issue: Terminologia das vestes sacerdotais
  choice: Manter “éfode” como termo técnico e traduzir os demais itens em português corrente.
  alternative: Substituir todos os termos por descrições funcionais.
  rationale: O versículo evoca diretamente as vestes do sumo sacerdote em Êxodo. A transliteração é necessária para אפוד, mas os demais elementos possuem equivalentes claros em português.
- issue: Sentido de משפט em חשן משפט
  choice: peitoral do julgamento
  alternative: peitoral da decisão
  rationale: “Julgamento” preserva a formulação cultual tradicional e a amplitude do hebraico, sem restringi-lo apenas a uma decisão oracular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura em forma de catálogo foi preservada, assim como a distinção entre o trabalho artístico especializado e o trabalho específico do tecelão.
