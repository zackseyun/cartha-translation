base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/016.yaml
  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: pt
  text: para ministrar e servir-lhe como sacerdote, e para abençoar o seu povo em seu nome. Ele o escolheu dentre todos os seres vivos para apresentar holocaustos e porções de gordura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego é mais extenso: “para apresentar ao Senhor uma oferta, incenso e aroma agradável como memorial, e fazer expiação pelo teu povo”. O testemunho hebraico é mais breve neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: לשרת
  choice: ministrar
  rationale: No contexto cultual, o verbo denota serviço sagrado; “ministrar” conserva essa nuance sem recorrer a linguagem arcaica.
- source_word: ולכהן לו
  choice: servir-lhe como sacerdote
  rationale: A expressão explicita o exercício da função sacerdotal em favor de Deus e soa natural em português moderno.
- source_word: ולברך את עמו בשמו
  choice: abençoar o seu povo em seu nome
  rationale: Mantém tanto o ato litúrgico de abençoar quanto a referência ao nome divino, sem explicar além do hebraico.
- source_word: ויבחר בו מכל חי
  choice: Ele o escolheu dentre todos os seres vivos
  rationale: Preserva a formulação abrangente מכל חי, sem restringi-la explicitamente aos seres humanos.
- source_word: להגיש
  choice: apresentar
  rationale: Em contexto sacrificial, o verbo indica levar ou apresentar algo ao altar; “apresentar” permite que os objetos seguintes definam a oferta.
- source_word: עלה
  choice: holocaustos
  rationale: “Holocausto” é o termo sacrificial português estabelecido para a oferta inteiramente queimada; o plural comunica adequadamente o valor coletivo do singular hebraico.
- source_word: וחלבים
  choice: porções de gordura
  rationale: O plural se refere às partes gordurosas reservadas para o altar, não à gordura em sentido genérico.
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: não incorporado ao texto principal; registrado na nota como paralelo grego mais extenso
  rationale: Esses detalhes não constam do testemunho hebraico preservado, mas a divergência substancial é apresentada ao leitor em nota.
theological_decisions:
- issue: Escolha entre o testemunho hebraico mais breve e o paralelo grego mais extenso
  choice: Seguir o hebraico no texto principal e registrar a expansão grega em nota
  alternative: Traduzir o texto grego mais longo no corpo do versículo ou harmonizar os dois testemunhos
  rationale: Como o hebraico sobrevive neste trecho, ele rege o texto principal. A nota preserva com transparência os elementos gregos sobre oferta, incenso, memorial e expiação, sem produzir um texto composto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com terminologia sacrificial tradicional apenas onde ela comunica com precisão o hebraico. Os pronomes referentes a Deus permanecem em minúsculas, segundo o uso corrente.
