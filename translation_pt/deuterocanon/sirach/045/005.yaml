base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: pt
  text: Ele o fez ouvir a sua voz e o aproximou da nuvem escura. Pôs em sua mão o mandamento[a], uma lei de vida e entendimento, para ensinar a Jacó os seus estatutos[b], e a Israel os seus testemunhos e juízos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “mandamentos”, no plural, em vez de “o mandamento”.
    reason: textual_variant
  - marker: b
    text: O grego diz “para ensinar a Jacó a aliança, e a Israel os seus juízos”, onde o hebraico traz “os seus estatutos ... os seus testemunhos e juízos”.
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: Ele o fez ouvir a sua voz
  rationale: O hifil de שמע expressa causação. “Fez ouvir” conserva a iniciativa divina e soa natural e digna em português.
- source_word: ויגישהו לערפל
  choice: e o aproximou da nuvem escura
  rationale: O hifil de נגש significa fazer chegar ou aproximar. ערפל designa escuridão densa associada à manifestação divina; “nuvem escura” comunica essa imagem teofânica sem eliminar seu caráter velado.
- source_word: מצוה
  choice: o mandamento
  rationale: Mantém-se o singular do hebraico, entendido no contexto da entrega concreta da instrução divina no Sinai. O grego traz o plural.
- source_word: תורת חיים ותבונה
  choice: uma lei de vida e entendimento
  rationale: תורה pode significar lei ou instrução; no contexto sinaítico e em paralelo com “mandamento”, “lei” é adequada. תבונה é entendimento ou discernimento.
- source_word: ללמד ביעקב חוקיו
  choice: para ensinar a Jacó os seus estatutos
  rationale: O infinitivo indica finalidade. A preposição ב é vertida idiomaticamente com Jacó como objeto do ensino; חוקים são estatutos ou decretos estabelecidos.
- source_word: ועדותיו ומשפטיו לישראל
  choice: e a Israel os seus testemunhos e juízos
  rationale: עדותיו preserva a noção de testemunhos ligados à aliança, enquanto משפטיו mantém a força jurídica de decisões ou juízos.
theological_decisions:
- issue: Imagem teofânica de ערפל
  choice: nuvem escura
  alternative: escuridão espessa; trevas densas
  rationale: A expressão retrata a presença divina no Sinai como revelada e, ao mesmo tempo, encoberta. “Nuvem escura” torna a imagem compreensível sem explicar além do texto.
- issue: Divergência entre o hebraico e o grego nos termos legais
  choice: o mandamento ... os seus estatutos ... os seus testemunhos e juízos
  alternative: mandamentos ... a aliança ... os seus juízos
  rationale: O texto principal segue o hebraico preservado, de alta confiança. As diferenças reais do paralelo grego são registradas em notas, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A sintaxe preserva o paralelismo dos termos legais sem se tornar excessivamente técnica.
