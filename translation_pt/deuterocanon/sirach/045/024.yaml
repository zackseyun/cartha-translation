  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
translation:
  language: pt
  text: Por isso, Deus estabeleceu também para ele um estatuto[a], uma aliança eterna, para a manutenção do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “Por isso, foi estabelecida para ele uma aliança de paz, como guardião das coisas santas e de seu povo, para que a dignidade do sacerdócio pertencesse a ele e à sua descendência para sempre”. O testemunho hebraico é mais breve e destaca um estatuto e uma aliança eterna para a manutenção do santuário.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Por isso
  rationale: Expressa com clareza a consequência da ação de Fineias mencionada no contexto anterior.
- source_word: גם לו הכין
  choice: também estabeleceu para ele
  rationale: Conserva a ideia de uma concessão adicional feita especificamente a Fineias; “estabeleceu” se ajusta ao contexto legal e pactual.
- source_word: חק
  choice: um estatuto
  rationale: Mantém a força jurídica de uma determinação fixa sem restringi-la indevidamente a uma prestação sacerdotal.
- source_word: ברית עולם
  choice: uma aliança eterna
  rationale: Reproduz a fórmula pactual e o caráter duradouro de עולם em português natural.
- source_word: לכלכל
  choice: para sustentar
  rationale: Comunica a ideia de prover continuamente para a manutenção ou o funcionamento do santuário.
- source_word: מקדש
  choice: o santuário
  rationale: Designa adequadamente o lugar sagrado sem limitar o referente, de modo anacrônico, apenas ao edifício posterior do templo.
theological_decisions:
- issue: Divergência entre o hebraico e o grego quanto ao conteúdo da promessa pactual
  choice: 'Traduzir no texto principal o hebraico preservado: “um estatuto, uma aliança eterna, para sustentar o santuário”.'
  alternative: 'O grego traz uma forma mais extensa: “uma aliança de paz”, vinculada à guarda das coisas santas e à dignidade sacerdotal perpétua de Fineias e de sua descendência.'
  rationale: Como há testemunho hebraico, ele orienta o texto principal. A expansão grega é teologicamente relevante e, por isso, é registrada em nota, sem ser incorporada silenciosamente ao hebraico.
translation_notes:
  register: Português moderno, claro e digno, com terminologia bíblica amplamente compreensível. A formulação mantém a concisão do hebraico e assinala a variante grega substancial por meio de nota.
