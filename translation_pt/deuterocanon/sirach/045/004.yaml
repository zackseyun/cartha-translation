  text: In his faithfulness and humility[a], he chose him from all flesh.
translation:
  language: pt
  text: Em sua fidelidade e humildade, ele o escolheu dentre todos os seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Em sua fé e mansidão, ele o santificou; escolheu-o dentre toda a carne.” O testemunho hebraico não traz o verbo explícito “santificou”, presente no grego; o grego também admite “fé” em vez de “fidelidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: por sua fidelidade
  rationale: אֱמוּנָה pode significar fé ou fidelidade. Em paralelo com a humildade e no contexto de um elogio ao caráter de Moisés, “fidelidade” comunica bem a qualidade ética; a preposição ב pode aqui indicar a razão ou base da escolha.
- source_word: ובענותו
  choice: e humildade
  rationale: עֲנָוָה abrange humildade, mansidão e modéstia. “Humildade” é natural e clara no português atual, sem excluir a nuance de mansidão atestada pelo grego πραΰτης.
- source_word: בחר בו
  choice: ele o escolheu
  rationale: Com בחר, a preposição ב introduz idiomaticamente a pessoa escolhida. Em português, a construção natural é “escolheu-o/ele o escolheu”.
- source_word: מכל בשר
  choice: dentre todos os seres humanos
  rationale: A expressão literal “de toda carne” é um hebraísmo que designa a humanidade mortal. “Dentre todos os seres humanos” torna explícito o referente e soa natural em português moderno.
theological_decisions:
- issue: Sentido de אמונה no elogio a Moisés
  choice: fidelidade
  alternative: fé
  rationale: O hebraico permite ambas as leituras. A associação com “humildade” favorece a descrição de uma qualidade de caráter, mas a alternativa “fé” continua possível e é preservada na nota.
- issue: Diferença textual entre o hebraico e o paralelo grego
  choice: seguir o hebraico sem acrescentar “ele o santificou”
  alternative: “Por sua fé e mansidão, ele o santificou; escolheu-o dentre toda a carne.”
  rationale: A testemunha hebraica fornecida, de alta confiança, não contém o verbo explícito correspondente a “santificou”, presente no grego. A tradução principal segue o hebraico, e a variante grega é documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação evita o hebraísmo pouco transparente “toda carne” no texto principal, preservando-o na nota referente ao paralelo grego.
