translation:
  language: pt
  text: E acrescentou honra a Aarão[a] e lhe deu a sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego prossegue: “Repartiu entre eles as primícias das primícias e preparou pão em abundância para os principais.” O testemunho hebraico neste ponto é mais breve que o grego.'
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  choice: E acrescentou
  rationale: O hifil de יסף expressa acrescentar ou aumentar. “Acrescentou” conserva a imagem verbal do hebraico e corresponde de perto ao grego προσέθηκεν.
- source_word: לאהרן
  choice: a Aarão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: כבודו
  choice: honra
  rationale: כבוד pode significar “honra” ou “glória”. Neste contexto de elevação da dignidade sacerdotal de Aarão, “honra” é natural e preserva o sentido de posição e reconhecimento.
- source_word: ויתן לו
  choice: e lhe deu
  rationale: Tradução direta e corrente de נתן com objeto indireto, em registro digno e acessível.
- source_word: נחלתו
  choice: a sua herança
  rationale: נחלה designa herança, posse ou porção atribuída. “Herança” conserva a ressonância bíblica e permite que a dimensão de porção sacerdotal permaneça implícita.
theological_decisions:
- issue: Natureza da “herança” de Aarão
  choice: a sua herança
  alternative: a porção que lhe cabia
  rationale: O contexto aponta para a parte sacerdotal concedida a Aarão, não necessariamente para propriedade territorial. “Herança” mantém tanto o sentido de concessão divina quanto a amplitude do termo hebraico.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do hebraico sem rigidez. O pronome possessivo em “a sua herança” preserva a formulação do texto-fonte, entendida no contexto como a herança atribuída a Aarão.
