  text: His grain offering shall be burned up whole[a], every day, twice a day.
translation:
  language: pt
  text: Sua oferta de cereal será inteiramente queimada[a], todos os dias, continuamente, duas vezes por dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Seus sacrifícios serão inteiramente consumidos, continuamente, duas vezes por dia”. O testemunho hebraico é mais específico: “sua oferta de cereal”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מנחתו
  choice: Sua oferta de cereal
  rationale: No contexto sacerdotal e sacrificial, מִנְחָה designa especificamente uma oferta de cereal; o sufixo possessivo foi preservado.
- source_word: כליל תקטר
  choice: será inteiramente queimada
  rationale: כליל indica consumo total, e תקטר descreve a queima sacrificial no altar. A formulação evita confundir essa oferta com o holocausto técnico, עֹלָה.
- source_word: בכל יום
  choice: todos os dias
  rationale: Tradução direta e natural da expressão temporal, indicando a repetição diária.
- source_word: צמיד פעמים
  choice: duas vezes por dia
  rationale: פעמים, confirmado pelo grego δίς, indica duas vezes. צמיד expressa regularidade ou continuidade cultual, comunicada naturalmente pela repetição diária já explicitada no contexto.
theological_decisions:
- issue: Especificidade da oferta no contexto sacerdotal
  choice: oferta de cereal
  alternative: sacrifícios
  rationale: O testemunho hebraico primário traz מנחתו, mais específico que o grego θυσίαι αὐτοῦ. A tradução conserva essa especificidade sem ampliar o sentido para sacrifícios em geral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Inteiramente queimada” preserva a ideia de consumo total no altar sem empregar terminologia técnica potencialmente enganosa.
