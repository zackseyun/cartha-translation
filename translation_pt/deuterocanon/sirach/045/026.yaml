  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: pt
  text: E agora[a], por favor, bendigam Yahweh[b], que é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E agora, por favor, bendigam Yahweh, que é bom”. O testemunho grego traz aqui um texto substancialmente diferente: “Que ele lhes dê sabedoria no coração, para julgarem o seu povo com justiça, a fim de que os bens deles não desapareçam, nem a glória deles ao longo de suas gerações”.'
    reason: textual_variant
  - marker: b
    text: O hebraico traz o nome divino YHWH, aqui transliterado como “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o valor temporal quanto a força conectiva do marcador discursivo hebraico.
- source_word: בָּרֲכוּ־נָא
  choice: por favor, bendigam
  rationale: O imperativo está no plural, e a partícula נָא acrescenta tom de apelo ou cortesia; esta formulação conserva ambos em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: הַטּוֹב
  choice: que é bom
  rationale: O adjetivo definido funciona de modo apositivo ou substantivado após o nome divino; a oração relativa comunica esse sentido com clareza e naturalidade.
- source_word: δόῃ ὑμῖν σοφίαν ...
  choice: não adotado no texto principal
  rationale: O testemunho grego diverge substancialmente do hebraico preservado. Como o texto hebraico deste trecho é atestado com alta confiança, ele rege o texto principal, e a forma grega é documentada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem o substituir por um título.
- issue: Relação entre os testemunhos hebraico e grego
  choice: Seguir no texto principal a exortação hebraica e registrar a forma grega em nota
  alternative: Adotar a bênção grega como texto principal ou combinar as duas formas
  rationale: O hebraico está preservado com alta confiança, ao passo que o grego apresenta uma forma textual substancialmente diferente. A nota mantém transparência sem fundir tradições distintas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural de “bendigam” reproduz o destinatário coletivo; “por favor” conserva o tom suplicante de נָא sem enfraquecer o imperativo.
