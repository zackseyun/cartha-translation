base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/001.yaml
  text: Beloved by God and men was Moses[c][b][a], whose memory is for blessing.
translation:
  language: pt
  text: Amado por Deus e pelos homens foi Moisés,[a][b] cuja memória é bendita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “homens”; o paralelo grego emprega um termo mais amplo, que também pode significar “pessoas” ou “seres humanos”.
    reason: alternative_reading
  - marker: b
    text: 'O paralelo grego contém uma introdução mais longa: Deus “fez surgir dele um homem de misericórdia, que encontrou favor aos olhos de toda a humanidade”, antes de mencionar Moisés. Essas palavras não constam do testemunho hebraico aqui traduzido.'
    reason: textual_variant
  - marker: c
    text: Mais literalmente, “sua memória é para o bem”. O paralelo grego diz “cuja memória está entre bênçãos”, confirmando o sentido de memória bendita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  choice: Amado
  rationale: Reproduz o valor passivo e honorífico do hebraico e concorda com o grego ἠγαπημένον.
- source_word: אלהים
  choice: Deus
  rationale: Neste contexto referente a Moisés, o termo designa naturalmente o Deus de Israel.
- source_word: ואנשים
  choice: e pelos homens
  rationale: Traduz de perto o plural masculino hebraico אנשים; o grego paralelo permite a compreensão mais ampla de seres humanos.
- source_word: משה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: זכרו לטובה
  choice: cuja memória é bendita
  rationale: Expressa em português natural o idioma comemorativo hebraico, literalmente ligado a uma memória 'para o bem'; o grego 'em bênçãos' confirma esse sentido.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante do texto grego mais longo
  choice: Traduzir no texto principal apenas a cláusula preservada em hebraico, usando o grego para confirmar o sentido da expressão final.
  alternative: Incluir as palavras gregas sobre Deus fazer surgir um homem de misericórdia que encontrou favor diante de toda a humanidade.
  rationale: O testemunho hebraico fornecido deve reger o texto principal; a expansão grega é relevante como variante, mas não deve ser incorporada silenciosamente.
- issue: Amplitude de ואנשים
  choice: pelos homens
  alternative: pelas pessoas
  rationale: A opção conserva a forma masculina do hebraico, enquanto uma nota registra que o paralelo grego emprega um termo de alcance humano mais geral.
translation_notes:
  register: Português moderno, digno e de leitura natural. A ordem levemente marcada preserva o tom laudatório do hebraico sem se tornar arcaica; as notas mantêm visíveis a variante grega e a literalidade do idioma final.
