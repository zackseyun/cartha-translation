base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/022.yaml
  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: pt
  text: Mas, na terra deles, ele não herdará, e entre eles não lhe será atribuída uma herança; as ofertas do SENHOR constituem a sua porção e a sua herança entre os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “pois ele mesmo é a tua porção, herança”, refletindo uma forma diferente da cláusula final. O hebraico preservado diz: “as ofertas do SENHOR são a sua porção e a sua herança”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Mas
  rationale: Introduz o contraste entre a concessão feita anteriormente a Aarão e a ausência de uma herança territorial.
- source_word: בארצם
  choice: na terra deles
  rationale: Refere-se à terra pertencente a Israel e mantém a linguagem territorial ligada à herança.
- source_word: לא ינחל
  choice: ele não herdará
  rationale: Preserva a forma verbal de נחל e o singular que representa Aarão ou coletivamente a linhagem sacerdotal.
- source_word: ובתוכם לא יחלק נחלה
  choice: e entre eles não lhe será atribuída herança
  rationale: Expressa o sentido contextual de não receber uma parcela territorial entre os israelitas, sem traduzir literalmente יחלק como se o sacerdote repartisse a herança.
- source_word: אשי יהוה
  choice: as ofertas do SENHOR
  rationale: אשי designa ofertas sacrificiais, frequentemente consumidas pelo fogo. A formulação concisa e natural preserva o testemunho hebraico sem especificar além do necessário o modo de oferecimento.
- source_word: חלקו ונחלתו
  choice: a sua porção e a sua herança
  rationale: Mantém o par jurídico e cultual que descreve aquilo que cabe ao sacerdócio em lugar de propriedade territorial.
- source_word: בתוך בני ישראל
  choice: entre os filhos de Israel
  rationale: Reproduz a expressão hebraica בני ישראל e sua referência coletiva ao povo de Israel.
theological_decisions:
- issue: Se a cláusula final deve seguir o hebraico preservado ou a forma divergente do paralelo grego.
  choice: 'Seguir no texto principal o hebraico preservado: “as ofertas do SENHOR são a sua porção e a sua herança”.'
  alternative: “pois ele mesmo é a tua porção, herança”, conforme o paralelo grego.
  rationale: O texto hebraico existente é a fonte principal e relaciona explicitamente a porção sacerdotal às ofertas do SENHOR. Como o grego apresenta uma leitura teologicamente significativa e diferente, ela é registrada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural e vocabulário bíblico reconhecível. “SENHOR” representa o nome divino יהוה; “filhos de Israel” conserva a forma do hebraico.
