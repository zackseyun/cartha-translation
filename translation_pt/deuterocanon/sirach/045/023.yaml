base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: pt
  text: Também Fineias, filho de Eleazar, recebeu o terceiro lugar em bravura[a], porque teve zelo pelo Deus de todos e se pôs na brecha em favor do seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “terceiro em glória”; o hebraico diz literalmente que ele “recebeu o terceiro lugar em bravura”. Segue-se aqui o hebraico.
    reason: textual_variant
  - marker: b
    text: '“Pôr-se na brecha” é uma expressão hebraica para intervir num momento de perigo coletivo, protegendo o povo ou intercedendo por ele. O grego acrescenta: “e fez expiação por Israel”, frase ausente do hebraico preservado neste ponto.'
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: נחל שלישי
  choice: recebeu o terceiro lugar
  rationale: O hebraico combina o verbo de herdar ou receber com “terceiro”. No contexto do elogio a figuras sacerdotais, a expressão indica mais naturalmente posição ou distinção; esta formulação conserva a metáfora sem sugerir herança territorial literal.
- source_word: בגבורה
  choice: em bravura
  rationale: O termo hebraico expressa força, valentia ou valor. “Bravura” comunica aqui mérito heroico de modo natural e preserva a diferença em relação ao grego, que traz “em glória”.
- source_word: בקנאו
  choice: porque teve zelo
  rationale: A construção com preposição e infinitivo admite valor circunstancial ou causal. “Porque teve zelo” exprime a provável relação causal entre a atitude de Fineias e a honra mencionada.
- source_word: לאלוה כל
  choice: pelo Deus de todos
  rationale: Reproduz o título hebraico distintivo quase literalmente, preservando sua afirmação da soberania universal de Deus sem substituí-lo por um título mais convencional.
- source_word: ויעמוד בפרץ
  choice: se pôs na brecha
  rationale: Mantém a metáfora idiomática hebraica de alguém que intervém num momento de perigo coletivo, com força protetora ou intercessora.
- source_word: עמו
  choice: em favor do seu povo
  rationale: Explicita de forma natural em português que Fineias agiu em benefício do povo, sentido exigido pelo idioma “pôr-se na brecha” neste contexto.
theological_decisions:
- issue: Relação entre o zelo de Fineias e sua posição honrosa
  choice: A posição honrosa de Fineias é apresentada como decorrente de seu zelo por Deus e de sua intervenção em favor do povo.
  alternative: A frase pode ser entendida apenas como descrição da ocasião de sua honra, sem causalidade acentuada.
  rationale: A construção hebraica ב mais infinitivo comporta sentido causal ou temporal. A tradução adota o valor causal mais provável, sem acrescentar pormenores do episódio de Números 25.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a imagem hebraica da brecha, acompanhada de nota explicativa. A ordem dos marcadores segue sua ocorrência no texto.
