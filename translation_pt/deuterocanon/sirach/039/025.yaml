  text: Good is allotted to the good from the beginning; so too[a], for the wicked, good and evil.
translation:
  language: pt
  text: O bem é a porção dos bons desde o princípio; assim também[a], para os maus, o bem e o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Coisas boas foram criadas para os bons desde o princípio; do mesmo modo, coisas más para os pecadores». O testemunho hebraico aqui preservado traz a formulação mais ampla: «para os maus, o bem e o mal».'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: o bem
  rationale: Preserva o sentido amplo do hebraico — aquilo que é bom ou benéfico — e mantém o paralelismo compacto com «o mal».
- source_word: חלק
  choice: é a porção
  rationale: Mantém a forma nominal do hebraico («porção», «parte atribuída») com uma cópula exigida pelo português, sem converter desnecessariamente o termo em verbo.
- source_word: מראש
  choice: desde o princípio
  rationale: Expressa naturalmente a ideia temporal de algo estabelecido desde o começo e concorda com o paralelo grego ἀπ’ ἀρχῆς.
- source_word: לרעים
  choice: para os maus
  rationale: Refere-se a pessoas moralmente más. «Os maus» é claro, corrente e preserva a correspondência lexical com «mal» no fim do verso; o grego paralelo traz «pecadores».
- source_word: טוב ורע
  choice: o bem e o mal
  rationale: Conserva a antítese ampla e deliberadamente tensa do hebraico, sem restringi-la a prosperidade e adversidade.
theological_decisions:
- issue: Como entender a oração final em relação ao paralelo grego
  choice: Traduzir o hebraico como afirmando que, para os maus, há tanto o bem como o mal.
  alternative: O paralelo grego apresenta apenas «para os pecadores, coisas más», formando um contraste mais simples.
  rationale: O testemunho hebraico preservado é a fonte primária e contém explicitamente «para os maus, o bem e o mal». A formulação mais curta do grego é registrada em nota, mas não substitui a leitura hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo sapiencial conciso. «É a porção» conserva a estrutura nominal do hebraico; «assim também» mantém a relação entre as duas metades sem explicar além do texto.
