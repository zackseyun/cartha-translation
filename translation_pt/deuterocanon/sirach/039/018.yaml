  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: pt
  text: Aquilo que ele deseja se realiza[a], e não há impedimento para a sua salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que lhe agrada prospera”. O paralelo grego diz: “Por seu mandado, cumpre-se tudo o que lhe agrada, e não há quem diminua a sua salvação”.'
    reason: A construção hebraica pode referir-se ao desejo ou ao que é desejado, e יצליח admite os sentidos de ter êxito ou prosperar; o grego oferece uma formulação paralela distinta.
lexical_decisions:
- source_word: תאות רצונו
  choice: Aquilo que ele deseja
  rationale: A construção pode indicar tanto o desejo quanto aquilo que é desejado. A formulação verbal é natural em português e preserva a ideia da vontade divina sem tornar a expressão artificial.
- source_word: יצליח
  choice: se realiza
  rationale: O hifil de צלח comunica êxito ou prosperidade. Neste contexto, “se realiza” expressa naturalmente que o propósito desejado chega a bom termo; “prospera” permanece como alternativa na nota.
- source_word: מעצור
  choice: impedimento
  rationale: O substantivo designa aquilo que restringe ou bloqueia. “Impedimento” acompanha diretamente o hebraico, sem transformar a expressão em referência exclusiva a uma pessoa.
- source_word: תשועתו
  choice: sua salvação
  rationale: תשועה pode designar salvação, livramento ou ação salvadora. “Salvação” é a correspondência direta e também concorda com o grego σωτήριον, mantendo a amplitude do termo bíblico.
theological_decisions:
- issue: Amplitude de תשועתו
  choice: sua salvação
  alternative: seu livramento; sua ação salvadora
  rationale: “Salvação” conserva o peso teológico do hebraico e do paralelo grego, mas não restringe o versículo a uma formulação soteriológica posterior; no contexto, abrange o poder e o resultado da ação salvadora de Deus.
- issue: Relação entre o desejo divino e sua realização
  choice: Aquilo que ele deseja se realiza
  alternative: O desejo da sua vontade tem êxito; O que lhe agrada prospera
  rationale: A tradução mantém a afirmação da eficácia da vontade divina, sem acrescentar explicações sobre causalidade, decreto ou liberdade humana que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A referência pronominal a Deus permanece em minúscula segundo o uso corrente, e a sintaxe evita tanto literalismo rígido quanto paráfrase doutrinária.
