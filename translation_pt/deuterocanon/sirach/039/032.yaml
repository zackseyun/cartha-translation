  text: Therefore from the beginning I took my stand[a], and I considered, and I set it down in writing.
translation:
  language: pt
  text: Por isso, desde o princípio, tomei posição[a], refleti e deixei por escrito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “fui estabelecido” ou “fui fortalecido”, onde o hebraico diz “tomei posição”. O texto principal segue aqui o hebraico como testemunho primário, sem perder de vista a nuance grega.
    reason: alternative_reading
lexical_decisions:
- source_word: על כן
  choice: Por isso
  rationale: Expressa de modo natural a inferência que liga o versículo à reflexão anterior.
- source_word: מראש
  choice: desde o princípio
  rationale: Preserva o sentido temporal de um ponto inicial, confirmado pelo grego ἐξ ἀρχῆς.
- source_word: התיצבתי
  choice: tomei minha posição
  rationale: Reflete o hitpael de יצב como ato deliberado de se posicionar, sem adotar como texto principal a forma passiva do paralelo grego.
- source_word: והתבוננתי
  choice: refleti
  rationale: Comunica reflexão atenta e soa natural no encadeamento da frase.
- source_word: ובכתב הנחתי
  choice: deixei tudo registrado por escrito
  rationale: Conserva a ideia de deixar ou preservar em forma escrita; “tudo” explicita em português o objeto implícito, isto é, o conteúdo considerado.
