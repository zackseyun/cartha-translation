  text: The deeds of all flesh are before him[b][a], and nothing is hidden from before his eyes.
translation:
  language: pt
  text: As ações de toda carne[a] estão diante dele, e nada fica oculto aos seus olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo ser vivo” ou “toda a humanidade”. A expressão hebraica “toda carne” é ampla; o paralelo grego também diz “toda carne”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz: “não é possível esconder-se dos seus olhos”, tornando a impossibilidade um pouco mais explícita do que o hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: ações
  rationale: O substantivo singular em construção com כל בשר tem sentido coletivo. “Ações” expressa naturalmente em português aquilo que os seres fazem e corresponde ao grego ἔργα, sem limitar o termo a obras materiais.
- source_word: כל בשר
  choice: toda carne
  rationale: Mantém a expressão hebraica ampla e sua correspondência direta com o grego πάσης σαρκὸς. O contexto pode abranger todo ser vivo ou, mais especificamente, toda a humanidade; a tradução não resolve indevidamente essa amplitude.
- source_word: נגדו
  choice: diante dele
  rationale: Expressa que as ações estão expostas à presença e ao conhecimento de Deus, preservando de modo conciso o sentido espacial figurado do hebraico e do grego ἐνώπιον αὐτοῦ.
- source_word: אין נסתר
  choice: nada fica oculto
  rationale: Reproduz diretamente a afirmação hebraica de que nada está escondido. “Fica oculto” é corrente e natural em português, sem acrescentar explicitamente a ideia modal de impossibilidade presente no paralelo grego.
- source_word: מנגד עיניו
  choice: aos seus olhos
  rationale: É a forma portuguesa natural de dizer que nada escapa à visão divina. Evita o calque pouco idiomático “de diante dos seus olhos”, preservando o sentido da expressão hebraica.
theological_decisions:
- issue: Alcance de “toda carne” sob a observação divina
  choice: Conservar a expressão “toda carne” sem restringir seu referente.
  alternative: “todo ser vivo” ou “toda a humanidade”
  rationale: Tanto o hebraico quanto o paralelo grego empregam “carne”. A expressão pode ter alcance amplo, e mantê-la preserva a ambiguidade genuína e a afirmação abrangente do conhecimento divino.
- issue: Afirmação de que nada está oculto
  choice: 'Seguir a formulação declarativa do hebraico: “nada fica oculto”.'
  alternative: “não é possível esconder-se”
  rationale: O hebraico declara o fato de que nada está oculto, enquanto o grego torna a impossibilidade mais explícita. A tradução principal segue a fonte hebraica e registra a nuance grega em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Toda carne” conserva a dicção bíblica e a amplitude do original; “aos seus olhos” dá naturalidade à segunda oração sem enfraquecer a imagem da visão divina.
