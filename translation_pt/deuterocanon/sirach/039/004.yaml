base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/004.yaml
  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: pt
  text: Servirá entre os poderosos e comparecerá diante de um governante; percorrerá a terra de nações estrangeiras, pois conheceu por experiência o bem e o mal entre os seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pois pôs à prova o bem e o mal entre os seres humanos”. O verbo grego pode indicar tanto testar por meio de provas quanto conhecer pela experiência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: entre os poderosos
  rationale: A expressão ἀνὰ μέσον significa “no meio de/entre”, e μεγιστάνων designa pessoas de posição elevada. “Os poderosos” comunica de modo natural o contexto social e político sem recorrer ao termo técnico “magnatas”.
- source_word: ὑπηρετήσει
  choice: servirá
  rationale: O verbo indica prestar serviço ou assistência. “Servirá” mantém a amplitude do grego e não introduz uma conotação especificamente religiosa.
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: comparecerá diante de um governante
  rationale: Embora ὀφθήσεται signifique literalmente “será visto”, a construção exprime a ideia de obter audiência ou apresentar-se perante alguém que governa. “Comparecerá diante de” é idiomático e preserva o cenário oficial.
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται
  choice: percorrerá a terra de nações estrangeiras
  rationale: Διελεύσεται indica passar ou viajar através de um lugar. A tradução conserva o singular γῇ e o plural ἐθνῶν, além da noção de território pertencente a outros povos.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: o bem e o mal
  rationale: A dupla pode abranger tanto dimensões morais quanto experiências favoráveis e adversas. “O bem e o mal” preserva deliberadamente essa amplitude.
- source_word: ἐν ἀνθρώποις ἐπείρασεν
  choice: conheceu por experiência ... entre os seres humanos
  rationale: Ἐπείρασεν pode indicar provar, testar ou adquirir conhecimento pela experiência. No contexto da formação do sábio, “conheceu por experiência” soa natural e mantém a ideia de aprendizado direto. “Seres humanos” expressa o uso genericamente humano de ἀνθρώποις.
theological_decisions:
- issue: Amplitude de ἀγαθὰ καὶ κακὰ
  choice: manter “o bem e o mal” sem restringir a expressão
  alternative: “a prosperidade e a adversidade” ou “coisas boas e ruins”
  rationale: O grego não determina se o contraste é exclusivamente moral ou circunstancial. A formulação escolhida conserva a tensão e evita impor uma interpretação.
- issue: Linguagem de gênero em μεγιστάνων e ἀνθρώποις
  choice: “os poderosos” e “os seres humanos”
  alternative: “homens poderosos” e “entre os homens”
  rationale: As formas gregas são gramaticalmente masculinas, mas neste contexto designam classes de pessoas e a humanidade em geral, sem contraste explícito entre homens e mulheres. As escolhas mantêm a referência humana e social sem acrescentar exclusividade masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comparecerá diante de” comunica de modo natural a audiência perante uma autoridade; “poderosos” evita o tecnicismo pouco corrente “magnatas”.
