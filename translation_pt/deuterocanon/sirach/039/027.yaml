  text: All these things are for good to the good[a]; so also for the wicked they are turned to harm.
translation:
  language: pt
  text: Todas essas coisas beneficiam os bons[a]; assim, para os maus, elas se transformam em dano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego diz “os piedosos”; o hebraico diz “os bons”.
    reason: alternative_reading
lexical_decisions:
- source_word: כל אלה
  choice: Todas essas coisas
  rationale: Mantém o alcance abrangente e o valor demonstrativo da expressão hebraica em português natural.
- source_word: לטובים ייטיבו
  choice: beneficiam os bons
  rationale: O verbo יטב, aqui com as coisas como sujeito, expressa efeito benéfico. “Os bons” preserva o adjetivo substantivado טובים sem importar para o texto principal a especificação religiosa do paralelo grego.
- source_word: כן
  choice: mas
  rationale: No paralelismo antitético, o hebraico introduz a correspondência do segundo membro; em português, “mas” explicita naturalmente o contraste, sem alterar a relação proverbial.
- source_word: לרעים
  choice: para os maus
  rationale: Reproduz o adjetivo substantivado hebraico רעים e mantém a oposição lexical direta com “os bons”; o grego paralelo traz “pecadores”, mas essa especificação não substitui o hebraico.
- source_word: לרעה נהפכו
  choice: transformam-se em dano
  rationale: Preserva o valor reflexivo/passivo de נהפכו e apresenta רעה como resultado nocivo, sem afirmar que as coisas sejam intrinsecamente más.
theological_decisions:
- issue: Caracterização moral ou religiosa dos beneficiários
  choice: os bons
  alternative: os piedosos
  rationale: O hebraico disponível diz literalmente “os bons”, enquanto o paralelo grego interpreta “os piedosos”. A primazia do testemunho hebraico recomenda manter “os bons” no texto e registrar a variante interpretativa em nota.
- issue: Natureza do resultado para os maus
  choice: transformam-se em dano
  alternative: transformam-se em mal
  rationale: “Dano” conserva a ideia contextual de resultado prejudicial e evita resolver a frase como uma afirmação sobre mal moral intrínseco.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo sapiencial conciso. A oposição “bons/maus” acompanha de perto o hebraico; a nota preserva a leitura moral-religiosa mais explícita do grego.
