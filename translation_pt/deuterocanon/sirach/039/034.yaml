base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/034.yaml
  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
translation:
  language: pt
  text: 'Não diga: “Isto é pior do que aquilo”[a], pois tudo se mostrará bom[b] a seu tempo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta frase é difícil; o paralelo grego esclarece o sentido como “Isto é pior do que aquilo”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “tudo prosperará a seu tempo” ou “tudo será aprovado a seu tempo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אל לאמר
  choice: Não diga
  rationale: A partícula proibitiva אל seguida do infinitivo לאמר forma naturalmente uma proibição. Em português atual, “Não diga” expressa isso com clareza.
- source_word: זה רע מה זה
  choice: Isto é pior do que aquilo
  rationale: 'O hebraico transmitido é difícil, mas o paralelo grego traz explicitamente uma comparação: Τοῦτο τούτου πονηρότερον, “isto é pior do que aquilo”. A tradução preserva esse sentido provável sem reproduzir de modo obscuro a sequência hebraica.'
- source_word: כי
  choice: pois
  rationale: Introduz a razão pela qual não se deve fazer tal juízo comparativo.
- source_word: הכל
  choice: tudo
  rationale: Mantém a abrangência universal da expressão hebraica em português natural.
- source_word: בעתו
  choice: a seu tempo
  rationale: Reproduz a ideia de que cada coisa tem o seu próprio tempo, com formulação idiomática e digna.
- source_word: יגביר
  choice: se mostrará bom
  rationale: O verbo hebraico é difícil neste contexto. O paralelo grego εὐδοκιμηθήσεται aponta para ser aprovado, prosperar ou revelar-se bom; “se mostrará bom” preserva a força avaliativa que sustenta a proibição anterior.
theological_decisions:
- issue: Relação entre o hebraico difícil e o paralelo grego
  choice: Entender a primeira oração como uma proibição de declarar que uma coisa é pior do que outra e a segunda como a afirmação de que tudo se mostrará bom em seu próprio tempo.
  alternative: 'Traduzir literalmente o hebraico transmitido: “Não diga: ‘Isto é mau; o que é isto?’, pois tudo prevalecerá a seu tempo.”'
  rationale: O hebraico continua sendo a testemunha principal, mas sua formulação é reconhecidamente difícil. O grego antigo esclarece tanto a comparação quanto a força positiva do desfecho, sem exigir uma harmonização doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação é concisa e digna; conserva a tensão textual por meio das notas, sem impor uma interpretação denominacional.
