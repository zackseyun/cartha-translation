  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: pt
  text: Se permanecer firme, deixará um nome que supera o de mil[a]; e, se repousar[b], ainda realizará essas coisas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma construção difícil: «deixará um nome — ἢ χίλιοι». O sentido provável é que seu nome superará o de mil pessoas.'
    reason: lexical_alternative
  - marker: b
    text: “Repousar” pode aludir aqui à morte, mas também mantém o sentido mais amplo de descansar.
    reason: alternative_reading
  - marker: c
    text: O grego traz um pronome plural indefinido, “essas coisas”, sem esclarecer exatamente a que se refere.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: Se permanecer firme
  rationale: ἐμμένω pode significar permanecer, persistir ou perseverar. “Permanecer firme” expressa a continuidade com constância adequada ao contexto sapiencial, sem acrescentar um objeto ausente no grego.
- source_word: ὄνομα καταλείψει
  choice: deixará um nome
  rationale: Preserva o idioma bíblico de deixar um “nome”, isto é, reputação ou memória duradoura, sem substituí-lo interpretativamente por “fama”.
- source_word: ἢ χίλιοι
  choice: que supera o de mil
  rationale: A sequência transmitida é difícil. Aqui ἢ é entendida em valor comparativo (“do que”), e “o de” explicita em português a comparação implícita com o nome de mil pessoas. A dificuldade textual e a formulação mais literal são registradas em nota.
- source_word: ἐὰν ἀναπαύσηται
  choice: se repousar
  rationale: ἀναπαύομαι significa repousar ou descansar e, neste contexto, pode aludir à morte. “Repousar” conserva essa ambiguidade.
- source_word: ἐμποιεῖ
  choice: ainda realizará
  rationale: ἐμποιέω pode significar produzir, causar ou realizar. “Realizará” é natural no contexto da atividade e dos efeitos duradouros do sábio; “ainda” torna perceptível a continuidade sugerida pelo contraste, sem definir seu mecanismo.
- source_word: αὐτά
  choice: essas coisas
  rationale: O pronome neutro plural é indefinido e não tem antecedente imediato claro. “Essas coisas” preserva o plural e evita especificá-lo como obras, feitos ou efeitos.
theological_decisions:
- issue: Possível referência à morte em ἀναπαύσηται
  choice: se repousar
  alternative: se morrer
  rationale: O contexto pode indicar que a influência do sábio continua depois de sua morte, mas o verbo grego não diz explicitamente “morrer”. A tradução mantém a tensão entre repouso e morte.
- issue: Continuidade da ação do sábio depois do repouso
  choice: ainda realizará essas coisas
  alternative: ainda as produzirá
  rationale: A frase pode apontar para os efeitos contínuos da vida e obra do sábio, mas o objeto de αὐτά permanece indefinido. A tradução não identifica esses efeitos nem formula uma doutrina específica sobre atividade após a morte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o idioma bíblico “deixar um nome” e preservam-se, em notas, a dificuldade comparativa de ἢ χίλιοι, a possível alusão à morte e a indefinição de αὐτά.
