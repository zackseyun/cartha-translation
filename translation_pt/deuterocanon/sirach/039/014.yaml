  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: pt
  text: Ergam a voz e bendigam juntos[a], e deem graças a Yahweh por todas as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “E, como o olíbano, exalem perfume; floresçam como o lírio, espalhem perfume e entoem um cântico de louvor.” Essa redação mais extensa representa uma forma textual diferente da linha hebraica preservada.'
    reason: Leitura alternativa
lexical_decisions:
- source_word: הרימו קולכם
  choice: Ergam a voz
  rationale: O imperativo plural de רום rege o substantivo coletivo singular קולכם. “Ergam a voz” preserva essa forma coletiva e é natural em português.
- source_word: וברכו
  choice: e bendigam
  rationale: ברך no piel significa aqui “bendizer”. A escolha conserva a linguagem litúrgica e evita reduzir o sentido a “louvar”.
- source_word: יחדו
  choice: juntos
  rationale: O advérbio indica ação comunitária, realizada em conjunto.
- source_word: והודו
  choice: e deem graças
  rationale: ידה no hifil, em contexto de culto, expressa agradecimento; “deem graças” preserva essa nuance.
- source_word: ליהוה
  choice: a Yahweh
  rationale: O texto hebraico traz explicitamente o nome divino יהוה; “Yahweh” o representa como nome próprio.
- source_word: על כל מעשיו
  choice: por todas as suas obras
  rationale: מעשים designa obras ou feitos. “Obras” mantém o substantivo e o tom de louvor bíblico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR; Jeová
  rationale: A tradução mantém o nome da aliança presente no hebraico, sem substituí-lo por um título.
- issue: Diferença substancial entre a linha hebraica e o paralelo grego
  choice: Seguir o hebraico no texto principal e registrar o grego em nota
  alternative: Traduzir no texto principal a forma poética mais extensa do grego
  rationale: A linha hebraica disponível é coerente e tem alta confiança, embora a validação registre pequena divergência. O paralelo grego testemunha outra forma textual e deve ser preservado sem substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Ergam a voz” conserva o singular coletivo hebraico; “bendigam” mantém o vocabulário litúrgico sem soar arcaico. A nota documenta de modo transparente a forma grega divergente.
