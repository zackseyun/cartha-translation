base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: pt
  text: Ouçam-me, filhos piedosos[a], e brotem como uma rosa que cresce junto a uma corrente de água no campo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos santos” ou “filhos fiéis”. O adjetivo grego pode designar pessoas piedosas, devotas ou fiéis em sua conduta religiosa.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode entender: “como uma rosa que cresce junto a uma corrente do campo”. A construção grega mantém ligeiramente aberta a relação de “do campo” com a corrente e com o cenário rural.'
    reason: source_ambiguity
lexical_decisions:
- source_word: εἰσακούσατέ
  choice: Ouçam-me
  rationale: O imperativo aoristo pede atenção imediata à exortação; “Ouçam-me” é direto, natural e mantém o apelo pessoal.
- source_word: υἱοὶ
  choice: filhos
  rationale: Preserva o substantivo masculino plural empregado na forma de tratamento grega, sem neutralizá-lo.
- source_word: ὅσιοι
  choice: piedosos
  rationale: No contexto, ὅσιοι caracteriza pessoas devotas e fiéis na conduta religiosa. “Piedosos” é mais natural em português do que “filhos santos” e evita sugerir necessariamente santidade cultual ou consagração.
- source_word: βλαστήσατε
  choice: brotem
  rationale: Mantém o imperativo e a imagem do surgimento de crescimento vegetal, sem antecipar plenamente a floração.
- source_word: ῥόδον
  choice: rosa
  rationale: É o equivalente direto e comum do substantivo grego.
- source_word: φυόμενον
  choice: que cresce
  rationale: Expressa de modo claro o crescimento contínuo indicado pelo particípio.
- source_word: ἐπὶ ῥεύματος
  choice: junto a uma corrente de água
  rationale: A preposição com ῥεῦμα descreve naturalmente a proximidade de água corrente; a explicitação “de água” evita a leitura abstrata de “corrente”.
- source_word: ἀγροῦ
  choice: no campo
  rationale: Conserva o cenário rural concreto de ἀγρός. A relação exata do genitivo com “corrente” ou com a cena mais ampla é ligeiramente ambígua.
theological_decisions:
- issue: Forma de tratamento υἱοὶ ὅσιοι
  choice: filhos piedosos
  alternative: filhos santos; filhos fiéis
  rationale: “Filhos” conserva a forma masculina do grego. “Piedosos” comunica o sentido religioso e ético de ὅσιοι em português corrente, enquanto “santos” poderia ser entendido mais estritamente como uma condição sacra; a alternativa é registrada para preservar a amplitude lexical.
- issue: Imagem hortativa de βλαστήσατε
  choice: brotem
  alternative: floresçam; germinem
  rationale: “Brotem” preserva a metáfora vegetal e o caráter imperativo sem determinar que o processo já chegou à floração completa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do grego foram preservadas, mas a formulação evita literalismos pouco naturais. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
