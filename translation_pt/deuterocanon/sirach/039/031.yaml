  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: pt
  text: À sua ordem, alegram-se[b] e, na ordem que lhes foi determinada, não se rebelam contra sua palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “sua boca”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego amplia a frase: “e serão preparados sobre a terra para as necessidades, e, nos seus tempos, não transgredirão uma palavra”. Isso reforça a ideia de que as coisas criadas cumprem sua função no tempo e na ordem que lhes foram designados.'
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: À sua ordem
  rationale: 'Expressa de modo conciso a força circunstancial do infinitivo construto com ב: quando Deus ordena ou em resposta à sua ordem. O paralelo grego, ἐν τῇ ἐντολῇ αὐτοῦ, confirma essa relação com a ordem divina.'
- source_word: ישישו
  choice: eles se alegram
  rationale: O verbo שוש/שיש indica alegria ou exultação. “Alegram-se” é natural em português moderno e preserva a personificação dos elementos criados.
- source_word: ובחקם
  choice: na ordem que lhes foi determinada
  rationale: חקם pode indicar seu estatuto, limite, curso ou disposição fixada. No contexto, a expressão comunica que as coisas criadas cumprem a função ou ordem que lhes foi atribuída, sem reduzir o termo a uma lei jurídica.
- source_word: לא ימרו פיו
  choice: não se rebelam contra o que ele diz
  rationale: מרה significa rebelar-se ou desobedecer, e פיו, literalmente “sua boca”, funciona como metonímia para aquilo que Deus fala. A formulação conserva a força de rebeldia e soa natural em português.
theological_decisions:
- issue: Linguagem antropomórfica referente à fala divina
  choice: o que ele diz
  alternative: sua boca
  rationale: O hebraico menciona literalmente a boca de Deus, mas o sentido imediato é aquilo que ele profere. A tradução evita uma formulação pouco natural sem acrescentar conteúdo teológico; a forma literal fica registrada em nota.
- issue: Obediência personificada da criação
  choice: eles se alegram ... não se rebelam
  alternative: eles exultam ... não desobedecem
  rationale: Mantém-se a personificação e a tensão poética do hebraico, sem transformar a declaração em uma explicação doutrinária sobre a natureza ou a vontade dos elementos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A expressão “ordem que lhes foi determinada” explicita com moderação o valor contextual de חקם, enquanto as notas preservam tanto o hebraísmo literal quanto a expansão do paralelo grego.
