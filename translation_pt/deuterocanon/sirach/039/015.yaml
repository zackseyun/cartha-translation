base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/015.yaml
  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: pt
  text: Ao som da harpa[a] e de instrumentos musicais, assim falem com aclamação.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lira”. O hebraico nomeia um antigo instrumento de cordas cuja correspondência moderna exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “com um grito jubiloso”; o termo hebraico pode indicar uma aclamação forte e, em certos contextos, um toque retumbante.
    reason: lexical_alternative
  - marker: c
    text: 'O paralelo grego deste versículo é consideravelmente mais extenso: exorta explicitamente a bendizer o Senhor, engrandecer seu nome e louvá-lo. O testemunho hebraico aqui preserva apenas a parte musical e a aclamação.'
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: Ao som de
  rationale: No contexto musical, exprime de modo natural o acompanhamento ou execução sonora, sem a rigidez pouco idiomática de “com o serviço de”.
- source_word: נבל
  choice: harpa
  rationale: Designa um antigo instrumento de cordas; “harpa” é uma tradução tradicional e compreensível, embora a identificação exata seja incerta.
- source_word: כלי מינים
  choice: instrumentos musicais
  rationale: כלי significa instrumentos, e מינים, tipos ou variedades; no contexto, a expressão indica instrumentos de música, possivelmente de diversas espécies.
- source_word: וכן
  choice: assim
  rationale: Introduz a maneira correspondente pela qual os ouvintes devem falar ou responder.
- source_word: תאמרו
  choice: falem
  rationale: O imperativo português transmite naturalmente a força diretiva da forma hebraica de segunda pessoa plural, literalmente “direis/falareis” ou “falem”.
- source_word: בתרועה
  choice: com aclamação
  rationale: תרועה pode indicar grito jubiloso, aclamação ou toque retumbante; “aclamação” preserva a amplitude e se ajusta ao contexto litúrgico-musical sem acrescentar explicitamente “de louvor”.
theological_decisions:
- issue: Diferença substancial entre o testemunho hebraico e o paralelo grego
  choice: Traduzir somente a linha hebraica preservada, usando o grego apenas para confirmar o contexto de louvor musical.
  alternative: Incluir as exortações gregas a bendizer o Senhor, engrandecer seu nome e confessá-lo em louvor.
  rationale: O hebraico sobrevivente é o testemunho primário e não contém as cláusulas adicionais do grego. Importá-las no texto principal apagaria uma variante textual real.
translation_notes:
  register: Português moderno, digno e acessível, com construção idiomática. “Ao som de” evita o pouco natural “com o serviço de”, enquanto “aclamação” conserva a ambiguidade de תרועה. Os marcadores aparecem em ordem de leitura no texto.
