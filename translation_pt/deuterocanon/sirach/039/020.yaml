base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/020.yaml
  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: pt
  text: De eternidade a eternidade, ele contempla[a], e nada é maravilhoso demais nem forte demais para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “De era em era, ele contemplou, e nada é maravilhoso diante dele”, sem o acréscimo hebraico “nem forte demais”.'
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: De eternidade a eternidade
  rationale: Preserva o alcance temporal elevado do idioma hebraico, que pode significar literalmente «de era em era» ou «de eternidade a eternidade», sem o reduzir a um intervalo finito.
- source_word: יביט
  choice: ele contempla
  rationale: O verbo indica olhar ou ver atentamente. O imperfeito hebraico admite aqui valor presente e geral, próprio de uma afirmação sapiencial sobre a percepção contínua de Deus.
- source_word: נפלא
  choice: maravilhoso demais
  rationale: O termo descreve aquilo que é extraordinário, admirável ou além da capacidade. Na construção negativa, «nada é maravilhoso demais ... para ele» comunica naturalmente que nada excede sua compreensão ou poder.
- source_word: חזק
  choice: forte demais
  rationale: Conserva o segundo predicado explícito no hebraico, ausente no paralelo grego, e expressa que nenhuma força supera Deus.
- source_word: ממנו
  choice: para ele
  rationale: Embora a preposição possa sugerir comparação ou procedência, nesta construção «para ele» é a formulação portuguesa mais natural para os dois predicados, sem forçar uma leitura estritamente comparativa.
theological_decisions:
- issue: O sujeito está implícito no hebraico e no grego.
  choice: Usar «ele», com referência a Deus pelo contexto.
  alternative: Repetir explicitamente «Deus».
  rationale: O português exige sujeito expresso ou recuperável; o pronome mantém a concisão da fonte sem acrescentar um nome que não aparece neste versículo.
- issue: Relação de נפלא e חזק com Deus.
  choice: 'Traduzir ambos como limites inexistentes para Deus: «maravilhoso demais nem forte demais para ele».'
  alternative: 'Traduzir comparativamente: «nada é mais maravilhoso ou mais forte do que ele».'
  rationale: A sintaxe admite alguma tensão, mas o contexto e o paralelo grego favorecem a ideia de que nada é extraordinário diante dele; a formulação escolhida também preserva o acréscimo hebraico «forte».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Contempla» conserva o campo visual e o tom elevado sem soar arcaico; a repetição de «demais» torna natural a coordenação dos dois adjetivos.
