  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: pt
  text: Bênçãos[a] transbordaram como o Nilo e, como um rio, encharcaram o mundo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Bênçãos” no plural, embora os verbos estejam no singular; o paralelo grego lê “sua bênção”, no singular.
    reason: alternative_reading
  - marker: b
    text: 'Ou “regaram o mundo”. O paralelo grego diz: “e, como uma inundação, encharcou a terra seca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: Bênçãos
  rationale: O hebraico traz a forma plural. A tradução a conserva no texto principal, sem acrescentar o possessivo presente apenas no paralelo grego.
- source_word: כיאור
  choice: como o Nilo
  rationale: יאר designa com frequência o Nilo; nomeá-lo preserva a imagem concreta de suas cheias.
- source_word: הציפה
  choice: transbordaram
  rationale: O verbo expressa inundação ou transbordamento. Em português, “transbordaram” mantém a imagem da cheia e concorda naturalmente com “bênçãos”.
- source_word: וכנהר
  choice: e, como um rio
  rationale: Mantém a segunda comparação aquática sem fundi-la com a referência específica ao Nilo.
- source_word: תבל
  choice: o mundo
  rationale: תבל costuma indicar o mundo, especialmente como espaço habitado; “o mundo” é claro e natural em português.
- source_word: ריותה
  choice: encharcaram
  rationale: O verbo comunica regar abundantemente ou saturar de água. “Encharcaram” conserva a intensidade da imagem, sem sugerir embriaguez literal.
theological_decisions:
- issue: Número e possessivo de “bênção”
  choice: 'Plural sem possessivo: “Bênçãos”'
  alternative: 'Singular com possessivo: “Sua bênção”'
  rationale: O hebraico de alta confiança apresenta o plural ברכות e não traz aqui o sufixo possessivo. O grego paralelo lê “sua bênção” no singular; essa variante é preservada em nota, sem substituir o texto hebraico no corpo.
- issue: Alcance da imagem final
  choice: “o mundo”
  alternative: “a terra seca”
  rationale: O hebraico traz תבל, “mundo” ou “mundo habitado”. O grego paralelo traz “a terra seca”; a diferença textual é indicada em nota para não harmonizar silenciosamente as testemunhas.
translation_notes:
  register: Português moderno, claro e digno, com imagens concretas e ritmo poético. O texto principal segue prioritariamente o hebraico; as diferenças relevantes do paralelo grego ficam explícitas nas notas.
