  text: Nations will recount his wisdom[a], and the assembly will proclaim his praise.
translation:
  language: pt
  text: As nações contarão a sabedoria dele, e a assembleia[a] proclamará o louvor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a congregação proclamará o louvor dele”. O grego ἐκκλησία designa a comunidade reunida, isto é, uma assembleia ou congregação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσονται
  choice: contarão
  rationale: O futuro de διηγέομαι indica narrar ou relatar. “Contarão” é natural em português e conserva a ideia de dar testemunho público da sabedoria do sábio.
- source_word: ἔθνη
  choice: as nações
  rationale: No uso da LXX e da literatura sapiencial, ἔθνη designa amplamente nações ou povos. “As nações” evita impor um contraste específico entre judeus e gentios.
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o equivalente corrente de σοφία e preserva seu peso moral e intelectual em Sirácida.
- source_word: ἐξαγγελεῖ
  choice: proclamará
  rationale: O verbo expressa anúncio público; “proclamará” mantém o registro elevado e o paralelismo com a primeira oração.
- source_word: ἐκκλησία
  choice: assembleia
  rationale: Neste contexto sapiencial judaico anterior ao cristianismo, refere-se à comunidade reunida. “Assembleia” é preciso e evita o anacronismo de “igreja”.
- source_word: ἔπαινον
  choice: louvor
  rationale: O substantivo denota louvor ou elogio; “louvor” combina naturalmente com “proclamará” e conserva o sentido de honra pública.
- source_word: αὐτοῦ
  choice: dele / seu
  rationale: Os dois pronomes gregos retomam o sábio individual do contexto. A formulação portuguesa mantém a referência masculina singular e usa “dele” na primeira ocorrência para reduzir possível ambiguidade.
theological_decisions:
- issue: Sentido de ἐκκλησία em um texto sapiencial judaico pré-cristão
  choice: assembleia
  alternative: congregação; igreja
  rationale: “Assembleia” representa a comunidade reunida sem sugerir anacronicamente a Igreja cristã; “congregação” também é possível e consta na nota.
- issue: Referência de gênero de αὐτοῦ
  choice: 'masculino singular: “dele / seu”'
  alternative: plural ou forma neutralizada
  rationale: O pronome grego masculino singular remete ao sábio descrito no contexto; a tradução preserva essa referência.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe paralela. “Contarão” foi preferido a “relatarão” por sua naturalidade, sem perder o sentido narrativo; “assembleia” preserva o contexto judaico e evita leitura cristã anacrônica.
