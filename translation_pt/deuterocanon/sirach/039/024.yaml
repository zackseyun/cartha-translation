  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
translation:
  language: pt
  text: Os caminhos de quem é íntegro se endireitam; mas, para os estranhos, tornam-se ruinosos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O último verbo hebraico é difícil e seu sentido exato é incerto; “tornam-se ruinosos” expressa o resultado negativo indicado pelo contexto e pelo paralelo grego.
    reason: textual_variant
  - marker: b
    text: 'O grego traz: “para os transgressores da lei, obstáculos que fazem tropeçar”. Ele parece interpretar os “estranhos” do hebraico como aqueles que vivem alheios ao caminho de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ארחות
  choice: caminhos
  rationale: O plural de אֹרַח pode indicar caminhos ou modos de vida. “Caminhos” preserva a metáfora e soa natural em português.
- source_word: תמים
  choice: quem é íntegro
  rationale: תמים expressa inteireza moral, irrepreensibilidade ou retidão. “Quem é íntegro” comunica esse sentido sem adotar a interpretação cultual sugerida pelo grego ὁσίοις.
- source_word: יישרו
  choice: se endireitam
  rationale: A forma de ישר comunica que os caminhos ficam retos ou são endireitados. A construção pronominal conserva a força verbal sem explicitar um agente ausente do hebraico.
- source_word: כן
  choice: mas
  rationale: Embora כן costume significar “assim”, aqui introduz o membro oposto do paralelismo. “Mas” torna clara essa antítese em português.
- source_word: לזרים
  choice: para os estranhos
  rationale: זר significa literalmente “estranho” ou “alheio”. A tradução mantém a formulação hebraica e sua ambiguidade, sem substituí-la pela interpretação moral “transgressores” presente no grego.
- source_word: יסתוללו
  choice: tornam-se ruinosos
  rationale: O verbo hebraico é raro e de sentido incerto. “Tornam-se ruinosos” expressa um resultado nocivo sem fixar uma imagem mais específica do que o hebraico permite; a ideia de tropeço atestada no grego é registrada em nota.
theological_decisions:
- issue: “Estranhos” no hebraico em contraste com “transgressores da lei” no grego
  choice: Manter “os estranhos” no texto principal
  alternative: os transgressores da lei
  rationale: Como o testemunho hebraico está preservado e tem alta confiança, ele rege o texto principal. A versão grega parece interpretar “estranhos” como pessoas alheias ao caminho ou à ordem de Deus; essa explicação não deve substituir silenciosamente a ambiguidade do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo proverbial foi preservado; “estranhos” mantém a tensão do hebraico, e as notas apresentam a incerteza lexical e a leitura interpretativa grega.
