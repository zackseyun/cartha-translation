  text: So also his wrath will dispossess nations, and he will turn their drink into brine.
translation:
  language: pt
  text: Assim também a sua ira despojará as nações[a], e ele transformará em salmoura o que elas bebem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “a sua ira herdará as nações”. O hebraico provavelmente significa que ela as despojará, sentido mais adequado ao contexto de juízo.'
    reason: alternative_reading
  - marker: b
    text: O grego traz “as águas”, enquanto o hebraico usa um termo mais amplo, que significa “bebida” ou “aquilo que se bebe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: Assim também
  rationale: Preserva a força comparativa e a ligação com o contexto anterior em português natural.
- source_word: זעמו
  choice: a sua ira
  rationale: Comunica a gravidade do juízo divino e corresponde ao grego ὀργή.
- source_word: גוים
  choice: as nações
  rationale: É a tradução corrente e contextualmente adequada, sem introduzir o contraste posterior sugerido por “gentios”.
- source_word: יוריש
  choice: despojará
  rationale: O hifil de ירש pode indicar privar alguém de sua posse ou expulsá-lo. No contexto de juízo, “despojará” mantém o objeto direto “as nações” e evita acrescentar explicitamente uma terra não mencionada.
- source_word: ויהפך
  choice: e transformará
  rationale: Expressa naturalmente a mudança de estado indicada pelo verbo hebraico na sequência futura.
- source_word: למלח
  choice: em salmoura
  rationale: No contexto de líquido tornado salgado e impróprio para beber, “salmoura” é mais concreto do que o abstrato “sal”.
- source_word: משקה
  choice: o que elas bebem
  rationale: Reproduz o sentido amplo de bebida ou líquido bebido, com referência contextual às nações; não o restringe a “águas”, como faz o paralelo grego.
theological_decisions:
- issue: Se ירש deve ser entendido como “despojar” ou, conforme o grego, “herdar”
  choice: a sua ira despojará as nações
  alternative: a sua ira herdará as nações
  rationale: A tradução principal dá prioridade ao hebraico preservado e ao sentido judicial coerente do hifil nesse contexto. A leitura grega distinta é mantida em nota para não eliminar a tensão textual.
- issue: Se משקה deve ser traduzido genericamente ou especificamente como água
  choice: o que elas bebem
  alternative: as suas águas
  rationale: O hebraico é mais abrangente que “água”; a formulação escolhida preserva essa amplitude, enquanto a especificação do grego é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Despojará” conserva a concisão poética e a ambiguidade lexical relevante é documentada; “o que elas bebem” evita o possessivo potencialmente ambíguo de “sua bebida”.
