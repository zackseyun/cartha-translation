base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: pt
  text: Há espíritos criados para o juízo[a]; em sua ira, deslocam montanhas. No tempo do furor, mostram seu poder[b] e desencadeiam uma tempestade vinda do campo aberto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ventos criados para o castigo”. Tanto o hebraico רוחות como o grego πνεύματα podem significar “espíritos” ou “ventos”.
    reason: lexical_alternative
  - marker: b
    text: A continuação a partir de “No tempo do furor” aparece entre colchetes na edição hebraica dos manuscritos da Genizá do Cairo, o que indica incerteza textual. O texto grego também traz uma continuação mais extensa, mas sua formulação difere consideravelmente do hebraico aqui traduzido.
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: espíritos
  rationale: O hebraico pode significar tanto “espíritos” quanto “ventos”, assim como o grego πνεύματα. “Espíritos” comunica melhor, no texto principal, a ideia de agentes criados para o juízo, enquanto a nota preserva a leitura meteorológica.
- source_word: למשפט
  choice: para o juízo
  rationale: Expressa a finalidade indicada pela preposição e mantém a amplitude de משפט, sem reduzi-lo exclusivamente a castigo.
- source_word: נוצרו
  choice: criados
  rationale: Reproduz de modo claro o passivo hebraico e concorda com o sentido do grego ἔκτισται, deixando implícito o agente divino.
- source_word: ובאפם
  choice: em sua ira
  rationale: אף é usado idiomaticamente para ira; a tradução também corresponde ao contexto punitivo e ao paralelo grego ἐν θυμῷ αὐτῶν.
- source_word: הרים יעתיקו
  choice: deslocam montanhas
  rationale: O verbo sugere remover ou tirar algo de seu lugar. “Deslocam montanhas” conserva a imagem de força devastadora sem especificar indevidamente que elas sejam arrancadas pela raiz.
- source_word: בעת זעם
  choice: no tempo do furor
  rationale: Mantém a indicação temporal e distingue זעם da ira já mencionada na oração anterior.
- source_word: גבורתם יראו
  choice: mostram seu poder
  rationale: Traduz naturalmente a manifestação visível da força desses agentes.
- source_word: וסער מן שדה יעוררו
  choice: e fazem surgir uma tempestade do campo aberto
  rationale: סער é “tempestade”, e יעוררו indica despertar ou suscitar. “Campo aberto” conserva o sentido básico de שדה e a imagem de uma tormenta que vem de uma região aberta.
theological_decisions:
- issue: Se רוחות/πνεύματα deve ser entendido como forças meteorológicas impessoais ou agentes personificados do juízo divino
  choice: “espíritos” no texto principal
  alternative: “ventos criados para o castigo”
  rationale: O hebraico e o grego permitem ambos os sentidos, e o versículo combina linguagem de agência com imagens de tempestade. A tradução principal adota “espíritos”, mas a nota mantém explicitamente a ambiguidade.
- issue: Como tratar a continuação entre colchetes no testemunho hebraico da Genizá do Cairo
  choice: incluir a continuação no texto principal e assinalar sua incerteza
  alternative: omitir a continuação e traduzir somente a primeira parte do versículo
  rationale: A edição hebraica fornecida põe a continuação entre colchetes, mas o testemunho grego também apresenta uma continuação mais extensa, embora com formulação consideravelmente diferente. A inclusão com nota preserva tanto o conteúdo quanto a transparência textual.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. “Juízo” mantém o tom bíblico sem soar arcaico; “campo aberto” evita interpretar שדה como deserto ou terra devastada.
