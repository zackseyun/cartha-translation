  text: All the works of God are good[a], and for every need he provides in its time.
translation:
  language: pt
  text: Todas as obras de Deus são boas[a], e ele provê para cada necessidade no tempo certo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Todas as obras do Senhor são muito boas, e toda ordem se cumprirá no seu tempo”. O testemunho hebraico, seguido no texto principal, traz “as obras de Deus” e fala da provisão para cada necessidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: as obras de Deus
  rationale: O plural construto מעשי designa amplamente aquilo que Deus faz ou cria, e אל é o título divino “Deus”. “As obras de Deus” é direto, natural e mantém a concisão do hebraico.
- source_word: כלם טובים
  choice: todas ... são boas
  rationale: כלם expressa totalidade, incorporada naturalmente em “todas as obras”, enquanto טובים recebe seu sentido amplo e direto, “boas”. O intensificador “muito” do paralelo grego não aparece no hebraico.
- source_word: לכל צורך
  choice: para cada necessidade
  rationale: צורך indica necessidade ou aquilo de que se precisa. “Para cada necessidade” preserva o valor distributivo de לכל e se ajusta ao contexto de provisão divina.
- source_word: בעתו
  choice: no tempo certo
  rationale: A expressão indica o tempo próprio ou adequado de cada necessidade. “No tempo certo” comunica o idioma hebraico com naturalidade, sem explicitar além do necessário o referente do sufixo.
- source_word: יספיק
  choice: ele provê
  rationale: No hifil, ספק comunica suprir o suficiente. O verbo singular não traz sujeito expresso; “ele” torna explícito o sujeito divino sugerido pelo contexto, sem alterar o sentido básico.
theological_decisions:
- issue: Título divino
  choice: Deus
  alternative: Senhor
  rationale: O testemunho hebraico traz אל, “Deus”, enquanto o paralelo grego usa Κυρίου, “Senhor”. A tradução principal segue o hebraico existente.
- issue: Relação entre bondade e provisão divina
  choice: manter as duas afirmações coordenadas do hebraico
  alternative: adotar a leitura grega sobre o cumprimento de cada ordem
  rationale: O hebraico afirma que todas as obras de Deus são boas e que ele provê para cada necessidade no tempo adequado. A leitura grega é significativamente diferente e, por isso, é registrada em nota, não incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No tempo certo” soa mais natural do que o literal “em seu tempo”, preservando a ideia de tempo próprio sem eliminar a possível ligação com cada necessidade.
