base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/017.yaml
  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: pt
  text: À sua palavra, ele reúne as águas como um monte; ao que sua boca profere, há reservatórios de água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz de forma concisa: “e, ao que sai de sua boca, o seu depósito”; o texto grego traz “reservatórios de águas”, leitura que esclarece o sentido e é seguida aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: À sua palavra
  rationale: A preposição ב pode ter valor temporal ou instrumental. “À sua palavra” mantém a concisão poética e permite entender tanto “quando ele fala” como “por meio de sua palavra”.
- source_word: יעריך
  choice: se amontoam
  rationale: Embora ערך signifique basicamente “dispor, pôr em ordem”, a imagem de נד e o paralelo grego indicam águas reunidas numa massa elevada. A forma reflexiva é natural em português e evita uma construção rígida.
- source_word: כנד מים
  choice: as águas ... como uma pilha
  rationale: נד designa um montão ou massa acumulada, especialmente de águas. “Pilha” conserva a imagem concreta e corresponde ao apoio do grego θιμωνιά.
- source_word: ובמוצא פיו
  choice: ao pronunciamento de sua boca
  rationale: מוצא é literalmente aquilo que sai, aqui a fala ou pronunciamento. A formulação preserva a concretude hebraica e o paralelismo com “à sua palavra”.
- source_word: אוצרו
  choice: formam-se depósitos de água
  rationale: O hebraico transmitido traz de modo muito conciso “seu depósito/tesouro”; o grego explicita “depósitos de águas”. “Formam-se” fornece em português o elo verbal elíptico sem especificar se os depósitos são criados, abertos ou abastecidos.
theological_decisions:
- issue: Referente dos sufixos pronominais em “sua palavra” e “sua boca”
  choice: Manter o referente implícito por meio dos possessivos
  alternative: Acrescentar explicitamente “Deus”
  rationale: O contexto do hino identifica o Criador como referente, mas o versículo hebraico não repete o nome divino. Preservar os possessivos respeita a forma poética sem reduzir o sentido teológico.
- issue: Relação entre a palavra divina e os depósitos de água
  choice: Usar “formam-se”, preservando uma descrição geral do efeito da fala
  alternative: Traduzir como abertura, criação ou enchimento dos depósitos
  rationale: O segundo membro hebraico é elíptico e não define precisamente a ação. A opção evita impor um mecanismo cosmológico específico.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético preservado. “Pilha” comunica a imagem concreta de águas acumuladas; “depósitos” mantém o sentido cosmológico sem recorrer ao termo mais técnico “reservatórios”.
