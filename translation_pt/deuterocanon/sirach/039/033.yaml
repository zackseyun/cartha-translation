  text: The works of God are all good[a], and for every need he provides in its time.
translation:
  language: pt
  text: As obras de Deus são todas boas[a], e ele supre cada necessidade a seu tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “As obras do Senhor são todas boas”. O testemunho hebraico traz “Deus”, em vez de “o Senhor”.'
    reason: Leitura alternativa do título divino no paralelo grego.
lexical_decisions:
- source_word: מעשה
  choice: as obras
  rationale: O singular hebraico tem valor coletivo diante de כלם (“todas”), referindo-se ao conjunto das obras ou ações de Deus; o plural é natural em português e concorda com o paralelo grego τὰ ἔργα.
- source_word: אל
  choice: Deus
  rationale: Traduz diretamente o título divino hebraico אל. O paralelo grego traz Κυρίου (“do Senhor”), variante registrada em nota.
- source_word: טובים
  choice: boas
  rationale: Equivale diretamente a “boas”, sem restringir o sentido a utilidade ou excelência moral.
- source_word: לכל צורך
  choice: para cada necessidade
  rationale: צורך designa necessidade; “cada necessidade” expressa com naturalidade a distribuição indicada por כל e mantém o sentido confirmado pelo grego χρείαν.
- source_word: בעתו
  choice: no seu tempo
  rationale: 'Preserva a referência do sufixo à necessidade ou ocasião mencionada: cada necessidade é atendida no tempo que lhe corresponde, sem tornar explícita a ideia interpretativa de “tempo certo”.'
- source_word: יספיק
  choice: ele provê
  rationale: O verbo pode significar suprir ou fornecer o suficiente. O presente geral exprime aqui uma afirmação habitual sobre a provisão divina; “ele” torna explícito o sujeito implícito, Deus.
theological_decisions:
- issue: Título divino no primeiro membro
  choice: “Deus” no texto principal
  alternative: “o Senhor”
  rationale: O testemunho hebraico primário traz אל (“Deus”), enquanto o paralelo grego traz Κυρίου (“do Senhor”). A tradução principal segue o hebraico, e a variante grega é preservada em nota.
- issue: Valor temporal de יספיק
  choice: 'presente geral: “provê”'
  alternative: 'futuro: “proverá”'
  rationale: O imperfeito hebraico admite valor geral ou habitual neste enunciado sapiencial. O presente comunica melhor uma verdade geral sem excluir a atuação contínua de Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “No seu tempo” conserva a concisão e a ambiguidade referencial do hebraico; o pronome pode remeter ao tempo próprio de cada necessidade. A ordem foi levemente ajustada para soar natural em português.
