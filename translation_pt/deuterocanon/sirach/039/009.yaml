base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: pt
  text: Muitos louvarão o seu entendimento; ele nunca será apagado. A sua memória não desaparecerá, e o seu nome viverá por gerações e gerações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “por gerações de gerações”, expressão que indica continuidade através de sucessivas gerações.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: louvarão
  rationale: Expressa de modo direto e natural o elogio público indicado pelo futuro de αἰνέω.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Preserva o sentido de compreensão e discernimento próprio da literatura de sabedoria, sem recorrer a linguagem técnica.
- source_word: ἕως τοῦ αἰῶνος οὐκ ἐξαλειφθήσεται
  choice: nunca será apagado
  rationale: Transmite a duração permanente da expressão grega e conserva a imagem concreta de apagar, evitando em português a possível ambiguidade de 'não será apagado para sempre'.
- source_word: μνημόσυνον
  choice: memória
  rationale: No paralelismo com o nome que continua vivo, refere-se à lembrança duradoura da pessoa, não necessariamente a um monumento físico.
- source_word: οὐκ ἀποστήσεται
  choice: não desaparecerá
  rationale: Aplica de maneira natural à memória a ideia de não se afastar, cessar ou deixar de existir.
- source_word: ὄνομα αὐτοῦ ζήσεται
  choice: o seu nome viverá
  rationale: Mantém a personificação vívida do original, na qual o nome e a reputação continuam vivos.
- source_word: εἰς γενεὰς γενεῶν
  choice: por gerações e gerações
  rationale: Reproduz em português corrente a expressão intensificadora de duração através de sucessivas gerações.
theological_decisions:
- issue: Grau de literalidade nas imagens de fama duradoura
  choice: Manter as imagens do entendimento apagado, da memória que desaparece e do nome que vive.
  alternative: Resumir tudo como 'seu legado durará para sempre'.
  rationale: As imagens concretas pertencem à textura poética e sapiencial do versículo e não devem ser reduzidas a uma abstração interpretativa.
- issue: Referente implícito de ἐξαλειφθήσεται
  choice: Retomar 'entendimento' com o pronome 'ele'.
  alternative: Entender a oração de modo mais geral como referência à reputação ou memória do sábio.
  rationale: O antecedente gramatical mais próximo é σύνεσιν, e a retomada explícita em português torna a conexão clara sem substituir a imagem do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Preferiu-se 'memória' a 'lembrança' e 'não desaparecerá' a uma reprodução rígida de 'não se afastará', preservando o paralelismo poético.
