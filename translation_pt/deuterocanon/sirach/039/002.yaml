  text: He will preserve the accounts of famous men, and he will enter into the twists of parables.
translation:
  language: pt
  text: Conservará os relatos de homens ilustres e penetrará nas voltas das parábolas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: relatos
  rationale: Expressa narrativas ou exposições transmitidas a respeito de pessoas notáveis, com naturalidade em português.
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: homens ilustres
  rationale: ὀνομαστός designa quem tem nome ou renome; “ilustres” preserva esse sentido sem sugerir necessariamente aprovação moral.
- source_word: συντηρήσει
  choice: conservará
  rationale: Mantém a ideia de guardar e preservar cuidadosamente os relatos.
- source_word: ἐν στροφαῖς παραβολῶν
  choice: nas voltas das parábolas
  rationale: στροφαί pode indicar voltas, giros ou meandros; a formulação preserva a imagem e a possível referência às complexidades das parábolas.
- source_word: συνεισελεύσεται
  choice: penetrará
  rationale: No contexto, comunica entrar profundamente no objeto de estudo; evita a construção pouco natural “entrará juntamente em” sem apagar a ideia de ingresso.
theological_decisions:
- issue: Natureza das “voltas” das parábolas
  choice: Preservar a metáfora como “voltas”
  alternative: “complexidades” ou “sentidos ocultos”
  rationale: O grego não especifica que sejam segredos doutrinários nem apenas dificuldades intelectuais; a imagem aberta evita resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe concisa e paralelismo entre as duas ações.
