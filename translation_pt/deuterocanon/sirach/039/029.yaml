base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/029.yaml
  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: pt
  text: Fogo e granizo, fome e peste — estes também foram criados para o juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “todos estes foram criados para a vingança” ou “para o castigo”. O hebraico diz: “para o juízo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  choice: fogo
  rationale: Equivalente direto e natural do substantivo hebraico, confirmado pelo grego πῦρ.
- source_word: ברד
  choice: granizo
  rationale: Designação comum do fenômeno meteorológico, confirmada pelo grego χάλαζα.
- source_word: רעב
  choice: fome
  rationale: Em português, “fome” pode designar tanto a privação coletiva quanto a individual; nesta lista de calamidades, o contexto deixa claro o sentido de fome generalizada.
- source_word: דבר
  choice: peste
  rationale: Preserva o sentido hebraico de epidemia ou calamidade pestilencial, sem adotar o termo mais amplo “morte” da versão grega.
- source_word: גם אלה
  choice: também estes
  rationale: Mantém a força aditiva da expressão hebraica, ligando essas calamidades aos elementos anteriormente mencionados.
- source_word: למשפט
  choice: para o juízo
  rationale: Preserva o alcance judicial de משפט sem restringi-lo de imediato a castigo ou vingança.
- source_word: נוצרו
  choice: foram criados
  rationale: Verte naturalmente o passivo plural e se ajusta ao tema da criação no contexto; o masculino plural concorda em português com a enumeração mista tomada coletivamente.
theological_decisions:
- issue: Nuance entre o hebraico e o grego na oração final
  choice: para o juízo
  alternative: para a vingança; para o castigo
  rationale: O texto hebraico, testemunho principal, traz למשפט, de sentido judicial mais amplo. O grego εἰς ἐκδίκησιν acentua a retribuição punitiva; essa nuance é preservada em nota, sem substituir a leitura hebraica no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário corrente. “Peste” conserva o sentido específico do hebraico; “juízo” mantém a amplitude teológica e judicial do termo original.
