base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/021.yaml
  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: pt
  text: 'Não se deve dizer[a]: “Por que isto? E por que aquilo?” Pois tudo prevalecerá a seu tempo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Pois todas as coisas foram criadas para as suas necessidades [ou: usos]”. O hebraico diz: “Pois tudo prevalecerá a seu tempo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  choice: Não se deve dizer
  rationale: A expressão hebraica é impessoal e tem força de advertência geral; esta formulação é natural em português e evita transformar o enunciado em uma ordem direta.
- source_word: זה למה זה
  choice: “Por que isto? E por que aquilo?”
  rationale: Mantém a repetição retórica de זה e o tom de questionamento ou queixa, com fluência em português atual.
- source_word: כי
  choice: Pois
  rationale: Introduz de modo claro e digno a razão da advertência.
- source_word: הכל
  choice: tudo
  rationale: Expressa naturalmente a totalidade abrangida pelo hebraico.
- source_word: בעתו
  choice: a seu tempo
  rationale: Conserva a ideia do tempo próprio ou apropriado de cada coisa, sem explicitar além do texto.
- source_word: יגבר
  choice: prevalecerá
  rationale: Preserva o sentido de גבר, ‘ser forte, prevalecer’, e evita substituí-lo pela leitura distinta do paralelo grego.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na segunda oração
  choice: Pois tudo prevalecerá a seu tempo.
  alternative: Pois todas as coisas foram criadas para sua necessidade/utilidade.
  rationale: O texto hebraico existente e de alta confiança é adotado como fonte primária. Como o grego apresenta uma diferença semântica substancial, sua leitura é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção impessoal de ampla compreensão. A formulação preserva a concisão sapiencial, a repetição retórica e a tensão entre os testemunhos hebraico e grego.
