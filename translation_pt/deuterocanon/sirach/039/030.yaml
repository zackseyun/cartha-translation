  to: Os dentes das feras, os escorpiões e as víboras[a], e a espada vingadora para destruir[b] os maus — todos esses foram criados para a sua finalidade e estão guardados no depósito até o tempo em que forem convocados.[c]
  rationale: 'A revisão é limitada a duas correções seguras: «os maus» representa רשעים de modo mais amplo e neutro, e a nota sobre פתן deixa de sugerir «cobras» como equivalente não qualificado. Permanecem a imagem do depósito, a finalidade não especificada e a tensão de que tais agentes foram criados e reservados para sua convocação.'
