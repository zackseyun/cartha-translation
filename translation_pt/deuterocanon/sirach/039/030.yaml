base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: pt
  text: Os dentes das feras, os escorpiões e as víboras[a], e a espada vingadora para destruir[b] os maus — todos esses foram criados para a sua finalidade e estão guardados no depósito até o tempo em que forem convocados.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serpentes venenosas” ou “áspides”; o hebraico designa uma serpente venenosa, mas a espécie exata é incerta. O paralelo grego também emprega um termo geral para víbora ou serpente.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ter o sentido mais forte de “exterminar” ou “consagrar à destruição”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estão no depósito e, no tempo determinado, são mobilizados”. A frase final é condensada no hebraico e indica que essas forças ficam reservadas até o momento de serem empregadas.'
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: os dentes das feras
  rationale: O hebraico traz literalmente uma construção com “dente” no singular coletivo; “os dentes das feras” é natural em português e concorda com o plural do paralelo grego.
- source_word: עקרב
  choice: os escorpiões
  rationale: O plural coletivo comunica naturalmente a classe de animais nocivos e corresponde ao paralelo grego.
- source_word: פתן
  choice: as víboras
  rationale: Designa uma serpente venenosa cuja espécie exata é incerta. “Víboras” é claro e atual, sem sugerir precisão zoológica indevida.
- source_word: חרב נקמות
  choice: a espada vingadora
  rationale: Preserva a força ativa da construção hebraica, também refletida pelo particípio grego, em português conciso e digno.
- source_word: להחרים
  choice: para destruir
  rationale: Expressa o sentido contextual básico, embora o verbo possa indicar mais fortemente exterminar ou consagrar à destruição.
- source_word: רשעים
  choice: os perversos
  rationale: Equivalente corrente para os moralmente culpados, sem restringir o termo a uma categoria denominacional.
- source_word: לצורכם
  choice: para a sua finalidade
  rationale: Mantém amplo o sentido funcional do hebraico, sem decidir explicitamente de quem é a necessidade ou para qual uso particular foram criados.
- source_word: נבראו
  choice: foram criados
  rationale: Reproduz diretamente a afirmação passiva de criação e não atenua sua tensão teológica.
- source_word: באוצר
  choice: estão guardados no depósito
  rationale: Conserva a imagem concreta de um lugar de armazenamento ou reserva, em vez de substituí-la por uma formulação abstrata.
- source_word: ולעת יפקדו
  choice: até o tempo em que forem convocados
  rationale: פקד, neste contexto, sugere chamar ou mobilizar para a ação no tempo determinado. A formulação preserva a concisão e a relativa abertura do hebraico.
theological_decisions:
- issue: Se as criaturas nocivas e as forças destrutivas pertencem à ordem criada e permanecem sob governo divino
  choice: Manter que “foram criados” para uma finalidade e permanecem guardados até serem convocados.
  alternative: Atenuar a afirmação como mera observação da natureza ou traduzir “vieram a existir”.
  rationale: O hebraico atribui criação, finalidade e reserva a esses agentes destrutivos. A tradução preserva essa tensão teológica sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva as imagens concretas do hebraico, evita arcaísmos desnecessários e mantém a ambiguidade funcional de לצורכם e a tensão teológica da criação de agentes destrutivos.
