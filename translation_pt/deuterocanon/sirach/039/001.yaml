base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: pt
  text: Mas aquele que se entrega a essa busca[a] e medita na lei do Altíssimo procurará diligentemente a sabedoria de todos os antigos e se ocupará com as profecias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entrega a sua alma” ou “entrega a si mesmo”; o objeto dessa entrega fica implícito no grego.
    reason: lexical_alternative
  - marker: b
    text: Ou “se dedicará aos escritos proféticos”; o grego diz literalmente “se ocupará com as profecias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν
  choice: Mas
  rationale: Marca o contraste com a descrição anterior dos trabalhadores e introduz aquele que se dedica ao estudo da sabedoria.
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: aquele que se entrega a essa busca
  rationale: A expressão grega fala literalmente de entregar a própria alma ou a si mesmo. Em português, «se entrega» comunica dedicação integral; «a essa busca» explicita com moderação o objeto subentendido pelo contexto.
- source_word: διανοουμένου
  choice: medita
  rationale: Expressa reflexão atenta e contínua, apropriada ao contexto sapiencial, sem reduzir o verbo a mera consideração casual.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: na lei do Altíssimo
  rationale: «Na lei» é construção natural em português bíblico e preserva a preposição grega; «Altíssimo» mantém o título divino.
- source_word: σοφίαν πάντων ἀρχαίων
  choice: a sabedoria de todos os antigos
  rationale: Mantém a referência pessoal aos sábios das gerações passadas e reproduz de perto a extensão de πάντων, «todos».
- source_word: ἐκζητήσει
  choice: procurará diligentemente
  rationale: O composto ἐκζητέω sugere busca intensa ou cuidadosa; o advérbio preserva essa força em português corrente.
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: se ocupará com as profecias
  rationale: Traduz diretamente tanto a ideia de dedicar tempo e atenção quanto o substantivo «profecias», sem restringi-lo de modo não explícito a escritos.
theological_decisions:
- issue: Objeto implícito de «entregar-se»
  choice: a essa busca
  alternative: deixar o objeto sem expressão, ou especificar «ao estudo da lei»
  rationale: O grego não declara o objeto, mas o contexto o associa à busca sapiencial. «Essa busca» torna a frase natural sem limitá-la exclusivamente ao estudo da lei.
- issue: Sentido de προφητείαις
  choice: profecias
  alternative: escritos proféticos
  rationale: «Profecias» preserva a amplitude e a ambiguidade do termo grego; «escritos proféticos» seria uma contextualização possível, porém mais restritiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo sapiencial e evita tecnicismos, ao mesmo tempo que sinaliza em notas as expressões mais literais e as ambiguidades relevantes.
