  text: He himself will direct his counsel and knowledge[a], and he will reflect on his hidden things.
translation:
  language: pt
  text: Ele mesmo orientará seu conselho e seu conhecimento e refletirá sobre seus assuntos ocultos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus segredos” ou “seus assuntos ocultos”. A expressão grega é concisa e pode referir-se tanto a ensinamentos ocultos como a assuntos ocultos em sua própria reflexão.
    reason: alternativa lexical e preservação da ambiguidade
lexical_decisions:
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Preserva a ênfase do pronome grego sem tornar a frase artificial em português.
- source_word: κατευθυνεῖ
  choice: orientará
  rationale: Expressa a ideia de dar direção ou tornar reto, com formulação natural no contexto de deliberação e sabedoria.
- source_word: βουλήν
  choice: conselho
  rationale: Mantém abertas as nuances de conselho, deliberação e propósito, sem restringir o termo a apenas uma delas.
- source_word: ἐπιστήμην
  choice: conhecimento
  rationale: É a equivalência mais direta e abrangente para o termo no contexto da literatura sapiencial.
- source_word: ἀποκρύφοις
  choice: coisas ocultas
  rationale: Conserva a formulação substantivada e concisa do grego, sem impor a conotação esotérica mais forte de “segredos”.
- source_word: διανοηθήσεται
  choice: refletirá sobre
  rationale: Comunica a deliberação interior e contemplativa indicada pelo verbo grego.
- source_word: αὐτοῦ
  choice: seu/suas
  rationale: Mantém a ligação gramatical dos genitivos com o sujeito masculino singular, sem identificar além do que o versículo declara.
theological_decisions:
- issue: Referente dos pronomes possessivos repetidos
  choice: Manter o sujeito masculino singular e os possessivos (“Ele mesmo... seu... suas”).
  alternative: Generalizar a formulação ou explicitar, com base no contexto, a identidade do referente.
  rationale: O grego preserva coesão gramatical, mas o versículo isolado não nomeia o referente; a tradução não deve resolver essa questão silenciosamente.
- issue: Sentido de “coisas ocultas”
  choice: Preservar a expressão ampla e ambígua.
  alternative: Traduzir como “segredos”, “ensinamentos ocultos” ou “assuntos íntimos”.
  rationale: A expressão grega pode apontar para matérias escondidas, ensinamentos reservados ou conteúdos de reflexão interior; a formulação principal mantém essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição dos possessivos foi mantida para refletir a coesão do grego; “coisas ocultas” conserva deliberadamente a concisão e a ambiguidade do original.
