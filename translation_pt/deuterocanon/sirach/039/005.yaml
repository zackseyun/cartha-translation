base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: pt
  text: Ele dedicará seu coração a levantar-se cedo para buscar o Senhor que o fez[a], e suplicará diante do Altíssimo; abrirá a boca em oração e suplicará por seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a buscar o Senhor desde cedo”; o verbo grego se refere a levantar-se cedo e, neste contexto, pode implicar a busca diligente do Senhor desde cedo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: dedicará seu coração
  rationale: Expressa a orientação deliberada do íntimo para um propósito, preservando a imagem antropológica de καρδία sem restringi-la apenas à mente.
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: a levantar-se cedo para o Senhor
  rationale: Mantém o sentido básico de ação realizada cedo e a orientação indicada por πρός. A possível nuance de buscar o Senhor desde cedo é preservada em nota.
- source_word: τὸν ποιήσαντα αὐτόν
  choice: que o fez
  rationale: Segue de perto o particípio grego e identifica o Senhor como aquele que lhe deu existência, sem substituir a formulação por um título interpretativo.
- source_word: ἔναντι Ὑψίστου
  choice: diante do Altíssimo
  rationale: Conserva a metáfora de presença reverente e emprega a forma portuguesa tradicional e clara para Ὕψιστος.
- source_word: δεηθήσεται
  choice: suplicará
  rationale: Comunica petição insistente, e não apenas oração em sentido amplo; a repetição do verbo é mantida nas duas ocorrências.
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: abrirá a boca em oração
  rationale: Preserva a imagem vívida e o paralelismo formal da expressão grega.
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: por seus pecados
  rationale: Indica o assunto de sua súplica de modo conciso, sem especificar se se trata de confissão, perdão ou outra petição relacionada aos pecados.
theological_decisions:
- issue: Tradução de Κύριος no contexto sapiencial grego
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva a força reverencial e é a designação portuguesa mais reconhecível para Deus neste contexto.
- issue: Sentido da súplica relacionada aos pecados
  choice: suplicará por seus pecados
  alternative: suplicará a respeito de seus pecados
  rationale: A formulação mantém aberta a natureza precisa da petição, pois o grego não explicita perdão, expiação nem uma fórmula de confissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens de “coração”, “abrir a boca” e a repetição de “suplicará”, evitando explicitar além do grego o conteúdo da súplica pelos pecados.
