  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: pt
  text: Agora, de todo o coração, cantem de alegria e bendigam o nome do Santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e bendigam o nome do Senhor”. O testemunho hebraico traz “o Santo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  choice: Agora
  rationale: Marca temporal e discursiva que introduz a exortação final; segue o hebraico sem acrescentar a conjunção presente no paralelo grego.
- source_word: בכל לב
  choice: de todo o coração
  rationale: Expressão portuguesa natural para a dedicação plena indicada pelo idiomatismo hebraico.
- source_word: הרנינו
  choice: cantem de alegria
  rationale: O imperativo de רנן expressa júbilo vocal; esta formulação comunica tanto o canto quanto a alegria.
- source_word: וברכו
  choice: e bendigam
  rationale: Preserva o idioma bíblico e doxológico de ברך aplicado ao nome divino, com registro digno e compreensível.
- source_word: את שם
  choice: o nome
  rationale: Mantém a construção hebraica e seu uso reverente do nome como referência à pessoa e à honra de Deus.
- source_word: הקדוש
  choice: do Santo
  rationale: Representa o título substantivado do testemunho hebraico sem substituí-lo pela leitura grega «Senhor».
theological_decisions:
- issue: 'Título divino na oração final: hebraico הקדוש em contraste com o grego Κυρίου'
  choice: do Santo
  alternative: do Senhor
  rationale: O texto principal segue o testemunho hebraico preservado, que traz «o Santo»; a leitura significativa do paralelo grego é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural dos imperativos foi explicitado por «cantem» e «bendigam»; «de todo o coração» conserva o caráter coletivo da exortação sem recorrer a formas regionais como «vosso».
