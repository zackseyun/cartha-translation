base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: pt
  text: Essenciais para a vida humana são a água, o fogo, o ferro e o sal; a farinha fina de trigo[a], o leite e o mel; o sangue da uva[b], o azeite e a roupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico nesta expressão é difícil e pode ser entendido literalmente como «a gordura do trigo», isto é, sua melhor parte. O paralelo grego traz «farinha fina de trigo».
    reason: textual_variant
  - marker: b
    text: Literalmente, «o sangue da uva»; a imagem pode designar uma bebida de uva, inclusive o vinho, mas o texto não a especifica mais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: Essenciais para a vida humana
  rationale: ראש indica aqui aquilo que é primordial ou indispensável, não um começo temporal. A formulação portuguesa comunica o valor idiomático e entende אדם como referência genérica à humanidade.
- source_word: חלב חטה
  choice: farinha fina de trigo
  rationale: A expressão hebraica transmitida é difícil e, literalmente, poderia sugerir «a gordura do trigo», uma imagem para sua melhor parte. O paralelo grego σεμίδαλις πυρός apoia claramente o sentido de farinha fina de trigo.
- source_word: חלב
  choice: leite
  rationale: No contexto da lista de alimentos, o sentido é «leite», confirmado pelo grego γάλα, e não «gordura».
- source_word: דם עינב
  choice: o sangue da uva
  rationale: Preserva a imagem vívida do hebraico, também reproduzida no grego, sem decidir indevidamente se a referência é especificamente a vinho fermentado ou, de modo mais amplo, a uma bebida de uva.
- source_word: יצהר
  choice: azeite
  rationale: O termo hebraico costuma designar óleo fresco, normalmente de oliva. «Azeite» é natural em português e corresponde ao grego ἔλαιον neste contexto alimentar.
- source_word: בגד
  choice: roupa
  rationale: O singular coletivo hebraico é expresso naturalmente pelo substantivo coletivo «roupa» em uma lista de necessidades humanas.
theological_decisions:
- issue: Sentido genérico de אדם
  choice: vida humana
  alternative: vida do homem
  rationale: O texto se refere à vida dos seres humanos em geral, não especificamente à dos homens; «vida humana» conserva esse alcance sem introduzir uma distinção de gênero ausente do contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A enumeração e as imagens concretas do original foram preservadas; «azeite» foi preferido a «óleo» por ser a designação portuguesa comum do óleo de oliva no contexto alimentar.
