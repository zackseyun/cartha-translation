  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
translation:
  language: pt
  text: Investigará as coisas ocultas dos provérbios[a] e se ocupará com os enigmas das parábolas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os aspectos obscuros dos provérbios”. O grego pode indicar, de modo amplo, coisas ocultas ou obscuras, não apenas um “sentido oculto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “viverá entre os enigmas das parábolas”. O verbo grego pode sugerir mover-se, conviver ou ocupar-se dentro de determinado âmbito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  choice: as coisas ocultas
  rationale: Reproduz o substantivo adjetival grego sem restringi-lo à ideia interpretativa de «sentido oculto»; pode abranger conteúdos ocultos ou aspectos obscuros.
- source_word: παροιμιῶν
  choice: dos provérbios
  rationale: Equivalente direto e reconhecível para ditos sapienciais.
- source_word: ἐκζητήσει
  choice: investigará
  rationale: Comunica a busca diligente e aprofundada sugerida pelo verbo composto, com naturalidade em português.
- source_word: ἐν αἰνίγμασι
  choice: com os enigmas
  rationale: Em ligação com ἀναστραφήσεται, indica o âmbito de envolvimento; «com» produz uma formulação natural sem eliminar a nuance espacial, registrada em nota.
- source_word: παραβολῶν
  choice: das parábolas
  rationale: Preserva o termo literário tradicional, embora o grego também possa designar comparações ou ditos figurados.
- source_word: ἀναστραφήσεται
  choice: se ocupará
  rationale: Neste contexto, expressa dedicação e convivência habitual com uma matéria, e não simplesmente conduta moral.
