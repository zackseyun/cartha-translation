  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: pt
  text: Se o grande Senhor quiser, ele será cheio de espírito de entendimento; ele mesmo fará chover palavras de sabedoria[a] e, em oração, dará graças ao Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «derramará palavras de sabedoria como chuva». O verbo grego emprega uma imagem de chuva.
    reason: lexical_alternative
  - marker: b
    text: Ou «confessará/reconhecerá o Senhor». O verbo grego pode ter esses sentidos, embora o contexto de oração favoreça «dará graças».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν ... θελήσῃ
  choice: Se ... quiser
  rationale: Expressa de modo natural em português a condição com valor real e preserva o sentido volitivo do verbo.
- source_word: Κύριος ὁ μέγας
  choice: o grande Senhor
  rationale: Mantém o título «Senhor» e traduz diretamente o qualificativo enfático «grande».
- source_word: πνεύματι συνέσεως
  choice: de um espírito de entendimento
  rationale: Preserva a ideia qualitativa de πνεῦμα e traduz σύνεσις por um termo corrente que comunica compreensão e discernimento.
- source_word: ἐμπλησθήσεται
  choice: será cheio
  rationale: Reproduz claramente o futuro passivo do grego, sem apagar a ação recebida pelo sujeito.
- source_word: ἀνομβρήσει
  choice: fará chover
  rationale: Conserva de maneira vívida a metáfora de chuva presente no verbo grego raro.
- source_word: ῥήματα σοφίας
  choice: palavras de sabedoria
  rationale: É uma tradução direta, natural e adequada para enunciados produzidos pela sabedoria.
- source_word: αὐτός
  choice: ele mesmo
  rationale: Preserva a ênfase explícita do pronome grego.
- source_word: ἐν προσευχῇ
  choice: em oração
  rationale: Comunica naturalmente a esfera ou o modo em que ocorre a ação.
- source_word: ἐξομολογήσεται
  choice: dará graças
  rationale: No contexto de oração dirigida ao Senhor, o sentido de ação de graças ou louvor é o mais provável, sem eliminar em nota as possibilidades de confessar ou reconhecer.
theological_decisions:
- issue: Sentido de ἐξομολογήσεται no contexto da oração
  choice: ação de graças dirigida ao Senhor
  alternative: confissão ou reconhecimento diante do Senhor
  rationale: O contexto de sabedoria e oração favorece louvor agradecido, mas a amplitude semântica do verbo é preservada em nota para não impor uma resolução absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «fará chover palavras» conserva a imagem incomum do original, e as notas mantêm abertas as alternativas lexicais genuínas.
