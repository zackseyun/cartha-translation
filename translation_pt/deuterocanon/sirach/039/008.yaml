  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: pt
  text: Ele mesmo torna clara a instrução do seu ensino[a] e se gloriará[b] na lei da aliança do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “traz à luz a formação do seu ensino”. Os termos gregos também podem indicar disciplina formativa e o ato de tornar algo evidente.
    reason: lexical_alternative
  - marker: b
    text: Ou “se orgulhará” ou “se gabará”. O verbo grego indica exultar ou ter orgulho; no contexto, não precisa ter sentido negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Preserva a ênfase do pronome intensivo sobre o sujeito.
- source_word: ἐκφαίνει
  choice: torna clara
  rationale: Expressa a ideia de fazer aparecer com clareza ou tornar evidente, em português natural.
- source_word: παιδείαν
  choice: instrução
  rationale: No contexto sapiencial, o termo abrange ensino formativo e disciplina; “instrução” mantém o sentido pedagógico sem sugerir apenas correção punitiva.
- source_word: διδασκαλίας
  choice: ensino
  rationale: Mantém o sentido pedagógico direto e evita o tom mais técnico ou confessional de “doutrina”.
- source_word: νόμῳ
  choice: lei
  rationale: Neste contexto sapiencial judaico, o termo se refere naturalmente à Lei/Torá.
- source_word: διαθήκης
  choice: aliança
  rationale: É o equivalente bíblico adequado no contexto da relação entre o Senhor, sua lei e seu povo.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Segue o uso bíblico consagrado e preserva a relação genitiva da expressão grega.
- source_word: καυχήσεται
  choice: se gloriará
  rationale: Comunica exultação ou orgulho declarado sem a conotação exclusivamente negativa que “se gabará” costuma ter no português atual.
theological_decisions:
- issue: Relação entre “lei” e “aliança” em ἐν νόμῳ διαθήκης Κυρίου
  choice: na lei da aliança do Senhor
  alternative: na lei, a aliança do Senhor; na lei pactual do Senhor
  rationale: O genitivo liga mais naturalmente “aliança” a “lei”. A formulação preserva a estrutura compacta do grego sem definir além do texto a natureza exata dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição pedagógica de “instrução” e “ensino” presente no grego, enquanto as notas registram as principais alternativas lexicais.
