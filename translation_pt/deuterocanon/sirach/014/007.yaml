  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
translation:
  language: pt
  text: Mesmo que faça o bem, ele o faz no esquecimento[a] e, no fim, revela a sua maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele o faz distraidamente” ou “ele o faz como algo destinado ao esquecimento”; a expressão grega significa literalmente “em esquecimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: Mesmo que
  rationale: A contração de καὶ ἐάν introduz uma condição concessiva; “mesmo que” expressa essa força de modo natural em português.
- source_word: εὖ ποιῇ
  choice: faça o bem
  rationale: A expressão εὖ ποιέω pode significar fazer o bem ou agir bem; “faça o bem” é clara, concisa e preserva o possível sentido beneficente.
- source_word: ἐν λήθῃ
  choice: no esquecimento
  rationale: Tradução próxima da forma grega, literalmente “em esquecimento”. Embora incomum, preserva a abertura semântica entre agir sem se lembrar, agir de modo negligente ou fazer algo destinado a cair no esquecimento.
- source_word: ποιεῖ
  choice: ele o faz
  rationale: Mantém a repetição do verbo ποιέω e explicita em português que o pronome retoma o bem mencionado na oração anterior.
- source_word: ἐπʼ ἐσχάτων
  choice: no fim
  rationale: Expressão temporal que significa finalmente ou ao término; “no fim” é natural e fiel.
- source_word: ἐκφαίνει
  choice: revela
  rationale: O verbo indica trazer à luz ou tornar manifesto; “revela” comunica com clareza essa exposição.
- source_word: τὴν κακίαν αὐτοῦ
  choice: a sua maldade
  rationale: κακία abrange maldade, perversidade ou malícia. “Maldade” conserva o sentido moral amplo sem restringi-lo à intenção maliciosa.
