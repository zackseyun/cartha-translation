  verdict: revise
  source_fidelity: 'A primeira oração traduz com precisão כל הבשר e a comparação עם בגד. “Decreto perpétuo” é uma boa representação de וחק עולם. No cólon final, o hebraico transmitido é elíptico e gramaticalmente difícil: o particípio singular גווע seguido do imperfeito plural יגועו não sustenta com segurança a paráfrase condicional “Os que expiram...”. A repetição verbal e a referência plural devem ser preservadas sem fingir que a sintaxe é mais clara do que é.'
  naturalness: “Toda carne se desgasta como uma veste” é natural em registro bíblico-literário e acessível. “Os que expiram certamente expirarão” soa excessivamente explicativo e condicional em português, além de tornar a expressão menos concisa. “Morrendo, morrerão” conserva a concisão enfática e a estranheza controlada do original.
  terminology: “Toda carne”, “veste” e “decreto perpétuo” são escolhas adequadas. “Expirar” pode referir-se à morte, mas a duplicação em “os que expiram... expirarão” cria uma relação de sujeito e predicado que o hebraico não expressa claramente. “Morrerão” comunica de modo direto o sentido mortal confirmado pelo paralelo grego.
  issues:
  - severity: medium
    issue: A formulação “Os que expiram certamente expirarão” resolve indevidamente a construção hebraica difícil como uma oração relativa plural e acrescenta uma nuance condicional.
    rationale: O hebraico apresenta um particípio singular seguido de verbo plural, e a nota reconhece justamente essa dificuldade. Uma formulação participial impessoal em português preserva melhor a elipse e a repetição.
  - severity: low
    issue: A nota traduz o paralelo grego como “morrerás de morte”, expressão pouco natural e que pode parecer uma tradução portuguesa proposta para o texto principal.
    rationale: Convém descrever o grego como uma formulação enfática na segunda pessoa, esclarecendo que ele explicita o decreto universal de morte, sem substituir a forma hebraica no texto.
