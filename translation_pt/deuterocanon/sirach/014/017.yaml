  text: All flesh wears out like a garment[a], and the everlasting decree is, “Dying, they shall die.”
translation:
  language: pt
  text: 'Toda carne se desgasta como uma veste, e o decreto perpétuo é: “Morrendo, morrerão.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico do final é terso e difícil; literalmente, aproxima-se de “um que expira, eles expirarão” ou “morrendo, morrerão”. A repetição exprime a mortalidade universal. O paralelo grego esclarece o sentido como um decreto antigo de morte, em formulação enfática na segunda pessoa: “certamente morrerás”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Toda carne
  rationale: Preserva a expressão coletiva e concreta do hebraico para os seres mortais, em concordância com o grego πᾶσα σὰρξ.
- source_word: כַּבֶּגֶד
  choice: como uma veste
  rationale: בגד é uma peça de roupa em sentido geral; “veste” mantém o registro digno e serve naturalmente à comparação.
- source_word: יִבְלֶה
  choice: se desgasta
  rationale: בלה descreve aquilo que envelhece ou se gasta pelo uso; “se desgasta” prolonga de modo natural a imagem da veste.
- source_word: וְחֹק עוֹלָם
  choice: e o decreto perpétuo
  rationale: חק designa uma determinação fixa, enquanto עולם aqui comunica sua permanência ou vigência desde sempre. A conjunção “e” reproduz o vínculo simples do hebraico sem impor uma relação causal.
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: Os que expiram certamente expirarão
  rationale: Mantém a terceira pessoa plural e procura reproduzir a repetição enfática da raiz גוע. A formulação continua deliberadamente tersa, enquanto a nota registra a dificuldade textual e o esclarecimento oferecido pelo paralelo grego.
theological_decisions:
- issue: Como traduzir o difícil cólon final do hebraico, que é terso e gramaticalmente incomum, à luz do paralelo grego
  choice: 'e o decreto perpétuo é: “Os que expiram certamente expirarão.”'
  alternative: 'e esta é a determinação desde sempre: “Morrerás de morte.”'
  rationale: A tradução principal dá prioridade ao hebraico preservado, incluindo sua terceira pessoa plural e a repetição da raiz, sem converter o enunciado em uma fala direta na segunda pessoa. O grego confirma que se trata da determinação universal e antiga da morte, mas não deve apagar a forma difícil do texto hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Toda carne” conserva o idioma bíblico concreto; “veste” e “decreto perpétuo” mantêm dignidade sem arcaísmo excessivo. A estranheza controlada do último membro reflete uma dificuldade genuína do hebraico, explicada em nota.
