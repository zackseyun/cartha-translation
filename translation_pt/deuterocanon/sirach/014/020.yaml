  text: Blessed is the man who meditates on wisdom[b][a], and who reflects with understanding.
translation:
  language: pt
  text: Feliz o homem que medita na sabedoria[b][a] e reflete com entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Bem-aventurado o homem”. A fórmula hebraica descreve uma condição favorecida e digna de admiração, não apenas um sentimento de felicidade.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo traz uma redação bastante diferente: “Feliz o homem que chegará ao fim em sabedoria e que conversará em seu entendimento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança declara a condição invejável e próspera da pessoa; “Feliz” é natural em português e não se limita aqui a um estado emocional.
- source_word: אֱנוֹשׁ
  choice: o homem
  rationale: Preserva o singular masculino representativo do texto hebraico e o estilo proverbial da literatura sapiencial.
- source_word: בְּחָכְמָה
  choice: na sabedoria
  rationale: Com o verbo הָגָה, a expressão portuguesa “meditar na sabedoria” comunica de modo natural o objeto da meditação, mantendo a preposição do hebraico.
- source_word: יֶהְגֶּה
  choice: medita
  rationale: O verbo denota ponderação ou meditação atenta, por vezes articulada em voz baixa; “medita” preserva bem o teor contemplativo.
- source_word: וּבִתְבוּנָה
  choice: com entendimento
  rationale: Expressa de modo idiomático o possível valor instrumental ou concomitante da preposição e mantém o campo semântico de discernimento.
- source_word: יִשְׁעֶה
  choice: reflete
  rationale: O verbo pode indicar voltar a atenção, considerar ou contemplar; “reflete” comunica atividade intelectual atenta sem impor a imagem física possível de olhar ou inclinar-se.
theological_decisions:
- issue: Masculino representativo na bem-aventurança sapiencial
  choice: o homem
  alternative: a pessoa
  rationale: O hebraico emprega um substantivo masculino singular numa máxima geral. A tradução conserva essa forma textual sem restringir a aplicação moral do provérbio.
translation_notes:
  register: Português moderno, digno e acessível, com cadência sapiencial. “Feliz o homem” é amplamente inteligível; a nota preserva a alternativa litúrgico-literária “bem-aventurado”. Os marcadores seguem a ordem fornecida na camada inglesa ([b][a]) e ambos aparecem no texto principal.
