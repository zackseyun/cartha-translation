  text: He pitches his tent beside her[b][a], and he lodges in a good dwelling-place.
translation:
  language: pt
  text: Arma a sua tenda junto dela[a] e se aloja numa boa morada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “sobre/junto à mão dela”, expressão que aqui indica proximidade; compare o grego: “junto às mãos dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e habita numa agradável pousada”. O hebraico é conciso, e o paralelo grego aponta para o sentido de alojar-se num bom lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹטֶה
  choice: Arma
  rationale: Com אָהֳלוֹ (“a sua tenda”), o verbo נטה descreve o ato de estender ou montar uma tenda. “Arma” é a expressão portuguesa natural e preserva a imagem concreta.
- source_word: אָהֳלוֹ
  choice: a sua tenda
  rationale: אהל é o termo comum para “tenda”. A tradução mantém a figura literal, sem transformá-la numa ideia abstrata de proximidade.
- source_word: עַל יָדָהּ
  choice: junto dela
  rationale: A expressão significa literalmente “sobre/junto à mão dela”, mas funciona aqui como indicação de proximidade. “Junto dela” comunica naturalmente o sentido em português, enquanto a nota preserva a forma hebraica.
- source_word: וְשָׁכַן
  choice: e se aloja
  rationale: שכן pode significar habitar, permanecer ou instalar-se. No paralelismo com a tenda, e à luz do grego καταλύσει, “se aloja” conserva a ideia de tomar pousada sem sugerir necessariamente residência permanente.
- source_word: שֹׁכֶן טוֹב
  choice: numa boa morada
  rationale: O hebraico transmitido é compacto, aproximadamente “boa habitação/morada”. A formulação portuguesa preserva a imagem de habitação sem impor ao texto a possível nuance grega de “bens” ou “coisas boas”.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter a referência feminina em “dela”.
  alternative: Empregar uma forma impessoal que desfaça a personificação.
  rationale: O contexto personifica a sabedoria como mulher. A referência feminina preserva essa imagem literária e teológica presente no hebraico e no paralelo grego.
- issue: Grau de explicitação da imagem de habitação
  choice: Conservar as imagens concretas de tenda, alojamento e morada.
  alternative: 'Parafrasear como proximidade abstrata da sabedoria, por exemplo: “permanece perto dela e vive bem”.'
  rationale: O versículo expressa a proximidade da sabedoria por meio de uma cena doméstica ou de acampamento. Preservar a metáfora mantém a força poética e evita interpretação excessiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Arma a sua tenda” mantém a imagem concreta; “junto dela” evita o pouco natural “junto à mão dela” no corpo do texto, e “se aloja” harmoniza com o contexto de tenda sem eliminar a possível ideia de permanência.
