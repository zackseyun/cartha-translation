revisions:
- from: Você não deixará sua riqueza para outro[a], e o fruto do seu trabalho para os que repartem a herança?
  to: Você não deixará sua riqueza para outro e seu trabalho para aqueles que lançam sortes[a]?
  rationale: A revisão elimina «herança» do texto principal, pois é uma explicitação possível à luz do grego, mas não uma exigência do hebraico. «Aqueles que lançam sortes» preserva a imagem de גורל e a ambiguidade sobre quem são essas pessoas; as leituras mais interpretativas ficam na nota, agora corretamente ancorada. «Seu trabalho» também é mais próximo do substantivo hebraico do que «o fruto do seu trabalho», sem excluir que o contexto inclua o resultado do labor.
