  naturalness: «Você não deixará...» é português moderno e claro. «Aqueles que lançam sortes» é uma formulação natural e inteligível em registro bíblico-sapiencial; a nota esclarece a expressão sem sobrecarregar o texto.
  terminology: «Riqueza» traduz adequadamente חיל. «Seu trabalho» preserva o alcance de יגיע, que pode abranger o labor e aquilo por ele obtido, sem explicitar desnecessariamente «fruto». «Lançam sortes» mantém a imagem de גורל e evita identificar os destinatários como herdeiros.
