translation:
  language: pt
  text: Você não deixará sua riqueza para outro e seu trabalho para aqueles que lançam sortes[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais interpretativamente, “para herdeiros por partilha” ou “para os que recebem uma porção atribuída”. Em hebraico, a expressão “conhecedores de sorte/lote” é idiomática; o paralelo grego aponta para a divisão de uma porção ou de uma herança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Você não deixará...?
  rationale: Mantém a pergunta retórica, que espera resposta afirmativa, e preserva sua força de advertência.
- source_word: לְאַחֵר
  choice: para outro
  rationale: Indica de modo direto outra pessoa como beneficiária, sem acrescentar uma figura jurídica específica.
- source_word: תַּעֲזוֹב
  choice: deixará
  rationale: Expressa deixar para trás; evita tanto o tom negativo de 'abandonar' quanto a especificidade jurídica de 'legar'.
- source_word: חֵילֶךָ
  choice: sua riqueza
  rationale: Neste contexto sapiencial, חיל designa os bens ou recursos materiais da pessoa.
- source_word: וִיגִיעֲךָ
  choice: o fruto do seu trabalho
  rationale: יגיע pode referir-se ao esforço e ao que ele produz. Aqui, aquilo que fica para outros é mais naturalmente entendido como o resultado do trabalho.
- source_word: לְיוֹדֵי גוֹרָל
  choice: para os que repartem a herança
  rationale: A expressão hebraica é literalmente próxima de 'os conhecedores da sorte/porção', mas é idiomática. O paralelo grego aponta para a divisão de uma porção ou herança; a tradução conserva a ideia de repartição sem determinar precisamente quem são os beneficiários.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. A pergunta retórica foi preservada. 'Fruto do seu trabalho' explicita naturalmente o produto do labor, e 'repartem a herança' comunica o sentido contextual da expressão idiomática hebraica à luz do paralelo grego.
