translation:
  language: pt
  text: Quem se priva acumula para outro, e um estranho[a] se deleitará com os bens desse homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o singular “um estranho”; o paralelo grego traz o plural “outros”.
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: Quem se priva
  rationale: O verbo מנע significa reter ou negar, e לְנַפְשׁוֹ funciona aqui de modo reflexivo. “Quem se priva” expressa naturalmente a ideia de negar a si mesmo o uso do que possui.
- source_word: יִקְבֹּץ לְאַחֵר
  choice: ajuntará para outro
  rationale: Mantém o sentido direto de קבץ, “ajuntar/reunir”, e a ironia de que a acumulação acabará beneficiando outra pessoa.
- source_word: וּבְטוֹבָתוֹ
  choice: com os bens que ele juntou
  rationale: טובה é concreto neste contexto e se refere aos bens do homem que se privou. A formulação evita a ambiguidade pronominal que “com os seus bens” teria em português, embora explicite pelo contexto que se trata dos bens acumulados.
- source_word: יִתְבַּעְבֵּעַ
  choice: se regalará
  rationale: A forma rara indica desfrute abundante ou indulgente; o paralelo grego τρυφήσουσιν confirma esse sentido. “Se regalará” comunica prazer intenso sem restringir a ação a comer ou festejar.
- source_word: זָר
  choice: um estranho
  rationale: Preserva o singular do hebraico e o sentido de alguém alheio ao possuidor original; a variante plural do paralelo grego é registrada em nota.
