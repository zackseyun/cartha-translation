  source_fidelity: 'O sentido central está bem representado: quem se recusa o uso de seus próprios recursos acumula para outra pessoa, que desfrutará de seus bens. Contudo, “os bens que ele juntou” acrescenta explicitamente que os bens foram reunidos, enquanto o hebraico diz simplesmente “seus bens/coisas boas”.'
  naturalness: A formulação é clara e proverbial. “Acumula” é mais corrente no português moderno do que “ajuntará” neste contexto, e “se deleitará” comunica naturalmente o desfrute abundante sem a associação alimentar que “se regalará” pode ter para alguns leitores.
  terminology: “Um estranho” preserva adequadamente o singular genérico do hebraico זָר. A nota registra de modo apropriado o plural do paralelo grego. “Bens desse homem” esclarece em português que os bens pertencem à pessoa que se priva, sem introduzir conteúdo novo.
