    issue: “pela janela dela” é espacialmente ambíguo em português.
    rationale: Pode significar “junto à janela” ou “por meio da janela”; “através da janela” reproduz com maior precisão o sentido de בעד.
  - severity: medium
    issue: “junto às suas entradas” é uma atenuação interpretativa da imagem de escutar às portas/aberturas.
    rationale: O hebraico על פתחיה e o grego ἐπὶ τῶν θυρωμάτων mantêm a localização nas aberturas da casa. “Às suas portas” é natural e mais próximo do texto.
