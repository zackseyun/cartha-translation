translation:
  language: pt
  text: Aquele que olha através da janela dela e escuta às suas portas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: Aquele que olha
  rationale: O particípio de שׁקף descreve quem olha atentamente através de uma abertura. A formulação conserva o caráter proverbial sem acrescentar clandestinidade ao ato de olhar.
- source_word: בְּעַד חֲלוֹנָה
  choice: pela janela dela
  rationale: בְּעַד tem sentido espacial de “através de”. “Pela janela dela” é natural em português e mantém a personificação feminina da Sabedoria.
- source_word: וְעַל פְּתָחֶיהָ
  choice: e, junto às suas entradas
  rationale: O hebraico traz o plural de פתח com sufixo feminino. “Entradas” preserva esse número e a imagem arquitetônica; “junto a” expressa idiomaticamente a posição indicada por עַל neste contexto.
- source_word: יְצוֹתֵת
  choice: escutará
  rationale: O verbo indica escuta atenta e pode sugerir ouvir às escondidas. “Escutará” preserva o sentido seguro, confirmado pelo paralelo grego, sem especificar indevidamente a intenção.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a referência feminina em “dela” e “suas”
  alternative: Empregar uma referência abstrata ou neutra
  rationale: O contexto personifica a Sabedoria como mulher e associa sua presença a uma casa. A referência feminina preserva a imagem hebraica e grega.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura proverbial. O plural “entradas” segue de perto o hebraico, enquanto “junto às” evita uma construção espacial pouco natural em português.
