  yaml_path: translation/deuterocanon/sirach/014/014.yaml
  text: Do not deprive yourself of a good day, and do not let your share in a good desire pass you by.
translation:
  language: pt
  text: Não se prive de um dia bom[a], nem deixe que lhe escape a parte que lhe cabe em um bom desejo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico também traz, entre colchetes, a oração “e não prive a si mesmo do bem”; sua redação é incerta no texto apresentado e talvez seja secundária. O paralelo grego diz: “e não deixe que lhe escape a parte que lhe cabe em um bom desejo”.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע / μὴ ἀφυστερήσῃς
  choice: Não se prive de
  rationale: Expressa naturalmente a advertência hebraica de não reter ou negar algo a si mesmo e corresponde ao sentido grego de privar.
- source_word: מִטּוֹבַת יוֹם / ἀπὸ ἀγαθῆς ἡμέρας
  choice: um dia bom
  rationale: Mantém a imagem concreta de um dia caracterizado pelo bem, sem ampliar interpretativamente para prazeres ou prosperidade.
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: omitido do texto principal
  rationale: A oração está entre colchetes no testemunho hebraico apresentado, sua redação é incerta e ela não aparece como tal no paralelo grego; sua existência é registrada em nota.
- source_word: μερὶς
  choice: a parte que lhe cabe
  rationale: Traduz a ideia de porção ou participação de modo idiomático em português, explicitando apenas a relação inerente de pertencimento.
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: em um bom desejo
  rationale: Conserva a formulação positiva e um tanto incomum do grego, sem reinterpretá-la como prazer, apetite ou prosperidade.
- source_word: μὴ σε παρελθάτω
  choice: não deixe passar
  rationale: É uma exortação portuguesa natural para algo que não deve passar sem ser acolhido ou aproveitado.
theological_decisions:
- issue: Uso do hebraico e do grego diante de uma redação hebraica incerta
  choice: O texto principal segue o início hebraico estável e usa o grego para a segunda oração.
  alternative: 'Incluir no texto principal a oração hebraica entre colchetes: “e não negue o bem a si mesmo”.'
  rationale: Dá prioridade ao hebraico conservado sem apresentar como segura uma oração explicitamente marcada como incerta; o grego oferece uma segunda oração coerente, e a variante hebraica permanece visível na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Um dia bom” evita a possível leitura formulaica da saudação “bom dia”; “a parte que lhe cabe” torna idiomática a noção grega de porção sem eliminar a ambiguidade de “bom desejo”.
