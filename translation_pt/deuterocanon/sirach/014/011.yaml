  text: My son[a], if you have the means, treat yourself well; and if you have anything, do good to yourself.
translation:
  language: pt
  text: Meu filho, se você tem recursos, trate-se bem; e, se tem alguma coisa, faça o bem a si mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado contém os dois membros paralelos traduzidos no texto. O paralelo grego apresenta uma redação diferente: “Meu filho, conforme o que você tem, faça o bem a si mesmo e apresente ao Senhor ofertas de modo digno”.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo direto e o masculino singular explícito do hebraico.
- source_word: אִם יֵשׁ לְךָ
  choice: se você tem
  rationale: Expressa de modo natural em português a construção existencial hebraica usada para indicar posse ou disponibilidade.
- source_word: שָׁרֵית נַפְשֶׁךָ
  choice: trate bem a si mesmo
  rationale: A expressão hebraica é comprimida e incomum; no contexto, indica proporcionar benefício ou alívio a si próprio com os recursos disponíveis. A formulação preserva o sentido reflexivo sem tentar reproduzir literalmente a expressão com נֶפֶשׁ.
- source_word: וְאִם יֵשׁ לְךָ
  choice: e, se tem alguma coisa
  rationale: Conserva a repetição do segundo condicional hebraico e explicita de forma idiomática o objeto indefinido da posse.
- source_word: הֵיטִיב לָךְ
  choice: faça o bem a si mesmo
  rationale: Reflete o hifil de יטב e a força reflexiva de לָךְ, preservando o tom ético e a leve variação em relação ao primeiro imperativo.
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: apresente ao Senhor ofertas dignas
  rationale: Tradução da cláusula preservada no paralelo grego, registrada em nota por não constar do texto hebraico extante fornecido.
theological_decisions:
- issue: Cláusula sacrificial presente no grego, mas ausente do hebraico extante
  choice: Manter no texto principal os dois membros do hebraico e registrar em nota a forma grega alternativa
  alternative: Substituir o segundo membro hebraico por “e apresente ao Senhor ofertas dignas”
  rationale: O testemunho hebraico extante é a fonte primária e contém dois condicionais. O grego oferece uma forma textual substancialmente diferente, que não deve ser fundida silenciosamente com o hebraico; a nota preserva a variante e sua possível leitura mais longa.
- issue: Sentido do conselho de beneficiar a si mesmo
  choice: Preservar a linguagem reflexiva sem moralizá-la nem atenuá-la
  alternative: Interpretar como generosidade para com outras pessoas ou como prazer indulgente
  rationale: Os pronomes hebraicos se referem diretamente ao destinatário. A tradução mantém essa tensão sapiencial sem acrescentar avaliação doutrinária.
- issue: Tradução de Κυρίῳ na variante grega
  choice: ao Senhor
  alternative: a Deus
  rationale: “Senhor” é a correspondência transparente e tradicional para Κύριος neste contexto de ofertas cultuais.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construção brasileira natural. A repetição de “se” e a diferença sutil entre “trate bem” e “faça o bem” conservam o paralelismo e a tensão lexical do hebraico.
