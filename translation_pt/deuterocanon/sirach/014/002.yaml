  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: pt
  text: Feliz é o homem a quem sua alma não repreendeu[a] e cuja esperança não cessou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta oração é difícil no testemunho preservado da Geniza do Cairo. O paralelo grego diz: “cuja alma não o condenou” e orienta esta tradução. Também são possíveis as nuances “não o censurou” ou “não o envergonhou”.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Introduz uma bem-aventurança sapiencial; em português atual, “Feliz” expressa naturalmente a condição objetiva de quem é favorecido, sem reduzir a frase a uma emoção passageira.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o masculino singular do hebraico e o caráter representativo da máxima sapiencial.
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: a quem sua própria alma não repreende
  rationale: O hebraico preservado é difícil. “Alma” mantém נַפְשׁוֹ, enquanto “repreende” conserva uma nuance possível do verbo; o paralelo grego, com κατέγνω, confirma o sentido geral de censura ou condenação interior.
- source_word: וְלֹא שָׁבְתָה
  choice: não cessou
  rationale: Traduz diretamente o sentido de cessar ou chegar ao fim, com formulação clara em português.
- source_word: תּוֹחַלְתּוֹ
  choice: esperança
  rationale: É a equivalência natural no contexto sapiencial e corresponde ao grego ἐλπίς.
theological_decisions:
- issue: Formulação da primeira oração diante do hebraico difícil e do paralelo grego
  choice: a quem sua própria alma não repreende
  alternative: a quem sua própria alma não condena
  rationale: O hebraico permanece como base, mas sua forma é textualmente difícil. O grego esclarece o campo semântico como censura ou condenação; “repreende” preserva essa amplitude sem impor a força judicial mais estreita de “condena”.
translation_notes:
  register: Português moderno, claro e digno, com cadência de máxima sapiencial. “Sua própria alma” evita ambiguidade referencial e mantém a linguagem antropológica do original.
