base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: pt
  text: 'Como as folhas que brotam numa árvore viçosa — uma murcha e outra desponta —, assim são as gerações de carne e sangue: uma morre e outra nasce.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, גּוֹמֵל pode significar “amadurece” ou algo semelhante; o testemunho grego traz “nasce”, leitura seguida aqui por se ajustar à comparação entre gerações sucessivas.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: Como as folhas que brotam
  rationale: A expressão hebraica é condensada, e o paralelo grego ὡς φύλλον θάλλον confirma a imagem de folhagem em brotação ou florescimento. O plural coletivo soa natural em português.
- source_word: עֵץ רַעֲנָן
  choice: numa árvore viçosa
  rationale: רַעֲנָן indica verdor, frescor e crescimento vigoroso; “viçosa” comunica essa exuberância de modo corrente e digno.
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: uma murcha e outra desponta
  rationale: “Murcha” traduz נוֹבֵל, enquanto “desponta” expressa o surgimento e crescimento de צוֹמֵחַ, preservando a metáfora vegetal.
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: assim são as gerações de carne e sangue
  rationale: Mantém a comparação e conserva o idiomatismo semítico, também refletido no grego, que ressalta a mortalidade humana.
- source_word: אֶחַד גֹּוֵעַ
  choice: uma morre
  rationale: גוע significa morrer ou expirar; “morre” é claro, natural e adequado ao contraste entre gerações.
- source_word: וְאֶחַד גּוֹמֵל
  choice: e outra nasce
  rationale: Embora גּוֹמֵל possa indicar maturação ou crescimento, o testemunho grego γεννᾶται traz “nasce”, leitura que se ajusta à sucessão das gerações e é adotada no texto, com a ambiguidade hebraica registrada em nota.
theological_decisions:
- issue: Expressão antropológica בָּשָׂר וָדָם
  choice: manter “carne e sangue”
  alternative: “seres humanos” ou “humanidade”
  rationale: A expressão concreta enfatiza a condição mortal e preserva a textura do hebraico e do paralelo grego sem introduzir interpretação denominacional.
- issue: Sentido de גּוֹמֵל no ciclo das gerações
  choice: “nasce”, seguindo o testemunho grego
  alternative: “amadurece”, “cresce” ou “chega à maturidade”
  rationale: O hebraico admite um sentido ligado à maturação, mas o grego antigo lê “nasce”. A tradução segue esse testemunho por sua coerência com a sucessão geracional, sem ocultar a alternativa hebraica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é simples e digno; “viçosa” preserva a imagem vigorosa da árvore, e “desponta” mantém a metáfora vegetal antes da aplicação às gerações humanas.
