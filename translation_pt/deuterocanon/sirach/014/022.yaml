  text: Go out after her in search[a], and lurk at all her entrances.
translation:
  language: pt
  text: Saia em busca dela e fique à espreita em todas as suas entradas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é raro e pode significar “vigie atentamente” ou, de modo mais incisivo, “fique à espera para uma emboscada”. O grego traz a imagem de ficar à espreita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָצֵאת אַחֲרֶיהָ בְחֵקֶר
  choice: Saia em busca dela
  rationale: Expressa com naturalidade a exortação a sair atrás da sabedoria para procurá-la. Preserva a referência feminina e o sentido investigativo de חֵקֶר, também apoiado pelo grego ὡς ἰχνευτής.
- source_word: וְכָל מְבוֹאֶיהָ
  choice: em todas as entradas dela
  rationale: Mantém a imagem espacial concreta de מְבוֹאֶיהָ, confirmada pelo grego εἰσόδοις, e evita que o possessivo fique ambíguo.
- source_word: יְרַצֵּד
  choice: fique à espreita
  rationale: O verbo hebraico é raro, mas parece indicar observação vigilante ou espera oculta; o grego ἐνέδρευε reforça a imagem de ficar à espreita. A formulação portuguesa conserva a força da metáfora sem recorrer a expressão excessivamente coloquial.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter a referência feminina em “dela”
  alternative: Repetir “sabedoria” ou usar uma paráfrase sem gênero
  rationale: Os sufixos hebraicos estão no feminino singular e retomam a sabedoria personificada no contexto. A tradução preserva essa característica literária sem acrescentar identificação doutrinária.
- issue: Força da metáfora de vigilância no final do versículo
  choice: “fique à espreita” no texto principal
  alternative: “vigie” ou “arme emboscada”
  rationale: “Fique à espreita” conserva tanto a vigilância paciente quanto a sugestão de espera oculta presente no raro verbo hebraico e explicitada no paralelo grego. A nota registra a incerteza lexical sem neutralizá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém as imagens de busca, personificação feminina e vigilância paciente.
