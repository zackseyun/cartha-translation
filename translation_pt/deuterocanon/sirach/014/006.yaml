  source_fidelity: O texto reproduz adequadamente a construção comparativa hebraica e preserva a formulação distinta da segunda oração, «com ele [está]», em vez de a harmonizar com o grego. «Mau consigo mesmo» transmite de modo apropriado a amplitude de רַע לְנַפְשׁוֹ, enquanto «retribuição de sua maldade» reflete תשלומת רעתו.
  naturalness: A abertura do rascunho, «Quem é mau consigo mesmo, não há ninguém pior do que ele», é compreensível, mas soa como um tópico solto em português. A inversão para «Não há ninguém pior do que quem é mau consigo mesmo» é mais idiomática, sem perda de ênfase proverbial. A nota também pode exprimir com maior precisão e naturalidade a nuance do grego.
  terminology: «Mau», «pior», «retribuição» e «maldade» mantêm o registro sapiencial e a recorrência semântica de רע. A nota deve evitar apresentar «se priva por mesquinhez» como equivalente estrito; o grego aponta mais diretamente para ser mesquinho ou negar algo a si próprio.
