  text: For one who is evil to himself[a], there is none more evil than he; and this is the repayment of his evil.
translation:
  language: pt
  text: Não há ninguém pior do que quem é mau consigo mesmo[a]; com ele está a retribuição de sua maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “quem é mesquinho consigo mesmo” ou “quem se priva”, tornando explícita a ideia de uma avareza que leva a pessoa a negar bens até a si própria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: Quem é mau consigo mesmo
  rationale: A expressão hebraica, sem verbo expresso, significa literalmente “mau para si mesmo/sua própria vida”. “Mau consigo mesmo” conserva a formulação moral ampla do hebraico e soa natural em português; a nuance mais específica do paralelo grego fica registrada em nota.
- source_word: אֵין רַע מִמֶּנּוּ
  choice: não há ninguém pior do que ele
  rationale: Expressa com clareza a construção comparativa hebraica. “Pior” é a forma portuguesa natural de repetir semanticamente רַע sem produzir uma frase artificial.
- source_word: וְעִמּוֹ
  choice: e com ele está
  rationale: Mantém a construção hebraica “e com ele”, em vez de seguir a formulação explicativa do grego, “e isto é”. O acréscimo de “está” torna a oração compreensível em português sem eliminar sua concisão.
- source_word: תּשְלוּמַת
  choice: a retribuição
  rationale: O substantivo indica pagamento, recompensa ou retribuição. “Retribuição” preserva o sentido de consequência moral e se ajusta ao registro sapiencial.
- source_word: רָעָתוֹ
  choice: da sua maldade
  rationale: “Maldade” retoma o campo lexical de רַע e preserva a repetição temática do hebraico. Também admite tanto a conduta má quanto sua disposição nociva.
- source_word: τοῦ βασκαίνοντος ἑαυτόν
  choice: é mau consigo mesmo
  rationale: O paralelo grego sugere alguém que se priva por mesquinhez ou se mostra avarento até consigo mesmo. Como o hebraico é primário e mais amplo, essa especificação é oferecida em nota, não incorporada ao texto principal.
