base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: pt
  text: Dê a um irmão, seja bondoso e mime-se[a], pois no Sheol[b] não há como buscar prazer. E tudo o que for bom fazer, faça-o diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “dê e receba, e engane a sua alma”, expressão difícil que provavelmente aponta para permitir-se desfrutar; o testemunho hebraico diz mais claramente “mime-se”.
    reason: alternative_reading
  - marker: b
    text: “Sheol” é o domínio dos mortos; também se pode traduzir por “mundo dos mortos” ou, em certos contextos, “sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: Dê a um irmão
  rationale: Preserva o termo concreto hebraico “irmão”, que pode designar um parente ou membro da comunidade, sem ampliá-lo silenciosamente para “outra pessoa”.
- source_word: וְחֹנֵן
  choice: seja bondoso
  rationale: Expressa a ideia de agir com graça e favor em português natural; “seja generoso” restringiria o sentido ao aspecto material.
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: mime-se
  rationale: O verbo פנק indica tratar com delicadeza ou luxo. “Mime-se” conserva esse sentido concreto e reflexivo, embora o paralelo grego apresente uma formulação difícil, registrada em nota.
- source_word: כִּי אֵין בִּשְׁאוֹל
  choice: pois no Sheol não há como
  rationale: Mantém “Sheol” como o nome hebraico do domínio dos mortos e verte a construção existencial de maneira idiomática em português.
- source_word: לְבַקֵּשׁ תַּעֲנוּג
  choice: buscar prazer
  rationale: Conserva tanto a ação de buscar quanto o campo semântico de prazer ou deleite, também atestado pelo paralelo grego.
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: E tudo o que for bom fazer
  rationale: Neste contexto, יפה tem sentido ético de bom, apropriado ou digno, não apenas de beleza estética.
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: faça-o diante de Deus
  rationale: Preserva a expressão “diante de Deus”, com sua possível referência à presença, ao olhar e à avaliação divina.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração preserva a concepção antiga do domínio dos mortos sem identificá-lo indevidamente com o inferno nem reduzi-lo ao túmulo físico.
- issue: Imperativo reflexivo em וּפַנֵּק נַפְשֶׁךָ e sua relação com o grego
  choice: mime-se
  alternative: engane a sua alma; permita-se desfrutar; delicie-se
  rationale: O testemunho hebraico, aqui claro e primário, favorece a ideia de tratar bem ou mimar a si mesmo. A leitura grega difícil é preservada em nota, sem substituir o hebraico no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos diretos. “Mime-se” é conciso e natural, preservando a força concreta do hebraico. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
