  source_fidelity: 'A tradução segue fielmente o hebraico: «Antes de morrer» expressa בטרם תמות; «faça o bem» preserva o imperativo benefactivo היטב; e «a quem você ama» mantém a amplitude relacional de לאוהב, sem reduzir indevidamente o referente a “amigo”. A segunda cláusula conserva a imagem de “mão” em והשגת ידך e comunica adequadamente o sentido de meios ou capacidade, confirmado pelo paralelo grego. «Dê a essa pessoa» retoma de modo claro o referente sem impor gênero que o hebraico não marca.'
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. «O que estiver ao alcance de sua mão» é uma expressão idiomática que preserva a metáfora original e evita uma construção excessivamente literal. O tratamento por «você» é coerente em todo o versículo.
  terminology: «Faça o bem», «a quem você ama» e «dê a essa pessoa» são escolhas semanticamente precisas e de registro digno. As notas distinguem corretamente a alternativa do paralelo grego e o valor idiomático da expressão hebraica, sem apresentar a leitura alternativa como se fosse o texto hebraico.
