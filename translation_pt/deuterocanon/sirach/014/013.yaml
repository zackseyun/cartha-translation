base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/013.yaml
  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
translation:
  language: pt
  text: Antes de morrer, faça o bem a quem você ama[a] e, conforme o que estiver ao alcance de sua mão[b], dê a essa pessoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a um amigo”. O paralelo grego diz: “faça o bem a um amigo”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “conforme o alcance de sua mão”, isto é, conforme seus recursos ou sua capacidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: Antes de morrer
  rationale: Expressa diretamente a relação temporal e o sentido comum do verbo מות, em português natural.
- source_word: הֵיטִב
  choice: faça o bem
  rationale: 'O hifil de יטב tem força benefativa: fazer o bem ou beneficiar alguém, sem especificar indevidamente a forma da ajuda.'
- source_word: לְאוֹהֵב
  choice: a quem você ama
  rationale: Mantém a amplitude relacional do hebraico, que pode designar uma pessoa amada; o grego φίλῳ sustenta também a leitura 'a um amigo'.
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: conforme o que estiver ao alcance de sua mão
  rationale: Preserva a imagem hebraica da mão e comunica recursos ou capacidade disponíveis; o grego κατὰ τὴν ἰσχύν σου confirma esse sentido.
- source_word: תֶּן לוֹ
  choice: dê a essa pessoa
  rationale: Traduz o imperativo de נתן e evita em português a introdução desnecessária de gênero não marcado no referente hebraico.
theological_decisions:
- issue: Objeto relacional da beneficência em לְאוֹהֵב / φίλῳ
  choice: a quem você ama
  alternative: a um amigo
  rationale: O hebraico primário favorece uma formulação mais ampla ligada ao amor, enquanto o paralelo grego explicita 'amigo'. A tradução conserva o alcance do hebraico e registra a alternativa grega em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por “você”. A imagem concreta da mão foi preservada, mas formulada idiomaticamente. “Essa pessoa” mantém a referência sem impor gênero.
