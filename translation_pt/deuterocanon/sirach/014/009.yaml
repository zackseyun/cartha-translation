base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/009.yaml
  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: pt
  text: Aos olhos do ganancioso[a], sua porção é pequena demais; ao tomar a porção do próximo, ele destrói a própria porção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente, “Aos olhos de... sua porção é pequena”. O termo aqui traduzido como “ganancioso” é difícil nesta tradição manuscrita; o paralelo grego diz: “O olho do ganancioso não se satisfaz com uma porção”, o que apoia este sentido.'
    reason: Leitura alternativa decorrente de uma forma hebraica difícil, esclarecida pelo paralelo grego.
lexical_decisions:
- source_word: בְּעֵין
  choice: Aos olhos de
  rationale: Reproduz a imagem hebraica do “olho” e expressa naturalmente, em português, como algo parece ou é avaliado por alguém.
- source_word: כּוֹשֵׁל
  choice: ganancioso
  rationale: A forma hebraica é difícil nesta tradição manuscrita e, tomada isoladamente, poderia sugerir alguém que tropeça ou fraqueja. O paralelo grego traz πλεονέκτου, “ganancioso/cobiçoso”, leitura que se ajusta ao contexto de insatisfação e apropriação da porção alheia.
- source_word: מְעַט
  choice: pequena demais
  rationale: Além da ideia literal de pequenez, o contexto comunica que a porção parece insuficiente ao ganancioso; “demais” explicita essa avaliação sem apagar a formulação hebraica.
- source_word: חֶלְקוֹ
  choice: sua porção / a própria porção
  rationale: “Porção” preserva o tom sapiencial e a repetição lexical do hebraico. Na ocorrência final, “a própria” evita ambiguidade em português.
- source_word: וְלוֹקֵחַ
  choice: ao tomar
  rationale: Traduz o particípio como ação característica e relaciona de modo natural a apropriação da porção alheia à destruição da própria.
- source_word: חֵלֶק רֵעֵהוּ
  choice: a porção do próximo
  rationale: רֵעַ pode designar próximo, companheiro ou semelhante. “Próximo” é claro e conserva a dimensão ética da violação contra outra pessoa.
- source_word: מְאַבֵּד
  choice: destrói
  rationale: Reflete o valor causativo do verbo hebraico, mais forte que simplesmente “perde”, e mantém a advertência moral do provérbio.
theological_decisions:
- issue: Uso do paralelo grego para interpretar a leitura hebraica difícil
  choice: Entender כּוֹשֵׁל como referência ao “ganancioso” e a primeira oração como expressão de sua insatisfação.
  alternative: Traduzir de modo mais literal e incerto como “aquele que tropeça” ou “aquele que fraqueja”.
  rationale: O testemunho hebraico apresenta dificuldade textual e semântica neste ponto. O grego, “o olho do ganancioso não se satisfaz com uma porção”, oferece apoio antigo e coerente com a segunda oração, na qual a pessoa toma a porção do próximo. A nota preserva a consciência da incerteza em vez de apresentá-la como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A imagem dos “olhos” e a repetição de “porção” foram preservadas por seu valor proverbial; a sintaxe foi ajustada para soar natural em português.
