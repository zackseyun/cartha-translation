translation:
  language: pt
  text: A riqueza não convém a quem tem o coração mesquinho, nem os bens a quem tem mau-olhado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “mau-olhado” descreve uma atitude avarenta ou invejosa, não uma maldição.
    reason: Evita que a expressão hebraica seja interpretada exclusivamente segundo o uso popular moderno do termo em português.
lexical_decisions:
- source_word: לְלֵב קָטֹן
  choice: a quem tem o coração mesquinho
  rationale: Literalmente, “a um coração pequeno”. No contexto sapiencial, descreve alguém de espírito estreito, mesquinho ou avarento; a formulação escolhida conserva a imagem hebraica do coração e comunica seu sentido moral em português atual.
- source_word: לֹא נָאוֶה
  choice: não convém
  rationale: נָאוֶה expressa aquilo que é apropriado, digno ou adequado. “Não convém” mantém o tom proverbial e natural.
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Equivalente direto e corrente para riqueza ou prosperidade material.
- source_word: לְאִישׁ רַע עַיִן
  choice: a quem tem mau-olhado
  rationale: A expressão hebraica “mau de olho” caracteriza, neste contexto, a pessoa avarenta ou invejosa. A tradução mantém a metáfora antiga, cuja explicação é dada em nota para evitar que seja entendida apenas no sentido popular de feitiço.
- source_word: חָרוּץ
  choice: bens
  rationale: Neste contexto, o termo designa riqueza material, possivelmente ouro ou tesouro. “Bens” distingue-o de עֹשֶׁר sem impor uma precisão maior do que o hebraico permite.
theological_decisions:
- issue: Sentido moral de “coração pequeno” e “mau-olhado”
  choice: Preservar as duas imagens hebraicas, tornando explícita apenas a construção da primeira e explicando a segunda em nota.
  alternative: Substituí-las diretamente por “mesquinho” e “avarento”.
  rationale: As metáforas fazem parte da forma sapiencial do verso e podem carregar tanto avareza quanto estreiteza ou inveja; uma paráfrase única reduziria essa amplitude.
translation_notes:
  register: Português moderno, digno e proverbial, com ampla legibilidade brasileira. O paralelismo hebraico foi preservado; “nem” reproduz naturalmente a coordenação negativa. A metáfora “mau-olhado” permanece no texto com esclarecimento conciso em nota.
