  text: Happy is the man whose mouth has not caused him to stumble[b][a], and whose heart has not condemned him.
translation:
  language: pt
  text: Feliz o homem cuja boca não o fez tropeçar[a] e cujo coração não o condenou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta oração é difícil; literalmente, diz algo como “cuja boca não o abandonou”. O grego antigo traz o sentido de “não tropeçou por sua boca”, isto é, não falhou no falar.
    reason: alternative_reading
  - marker: b
    text: 'O hebraico da segunda oração também é incerto e pode sugerir o juízo ou a censura interior do coração. O grego antigo diz: “não foi traspassado na tristeza do pecado”.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula sapiencial introduz uma condição digna de admiração. “Feliz” é natural no português atual e não pressupõe aqui um agente divino explícito.
- source_word: אֱנוֹשׁ
  choice: o homem
  rationale: Preserva a forma masculina singular representativa do hebraico e o tom proverbial, sem transformar o termo em designação de um indivíduo específico.
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: cuja boca não o fez tropeçar
  rationale: O hebraico transmitido é difícil, literalmente próximo de “sua boca não o abandonou”. O paralelo grego aponta para tropeçar pela boca, isto é, falhar na fala; a formulação portuguesa expressa esse sentido provável sem ocultar a dificuldade textual.
- source_word: וְלֹא אָבַח עָלָיו דִּין לִבּוֹ
  choice: e cujo coração não o condenou
  rationale: A construção hebraica é incomum, mas associa o juízo ao coração. “Condenou” preserva a imagem de um veredito interior sem substituir “coração” pelo termo interpretativo “consciência”.
theological_decisions:
- issue: Formulação da bem-aventurança sapiencial
  choice: Feliz o homem
  alternative: Bem-aventurado o homem
  rationale: “Feliz” comunica de modo claro a condição invejável indicada por אַשְׁרֵי e mantém o caráter sapiencial do verso, sem acrescentar uma declaração explícita de bênção divina.
- issue: Primeira oração hebraica de leitura difícil
  choice: cuja boca não o fez tropeçar
  alternative: cuja boca não o abandonou
  rationale: A tradução literal do texto hebraico seria obscura. O grego antigo sustenta o sentido de tropeçar pela fala; esse apoio é assinalado em nota, sem apresentar a interpretação como textualmente indiscutível.
- issue: Relação entre coração, juízo e pecado
  choice: cujo coração não o condenou
  alternative: não foi traspassado pela tristeza do pecado
  rationale: O texto principal permanece ancorado no hebraico preservado, que contém “juízo” e “coração”. A leitura grega, que introduz a tristeza do pecado, é relevante como variante antiga, mas não deve ser incorporada silenciosamente ao texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência proverbial. O texto principal segue prioritariamente o hebraico, enquanto as duas dificuldades reais e o testemunho grego são preservados nas notas.
