  text: An evil eye is stingy over bread[b][a], and there is meanness at his table.
translation:
  language: pt
  text: Quem tem olho mau é mesquinho com o pão[a], e há mesquinhez à sua mesa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “olho mau” descreve uma disposição invejosa, avarenta ou relutante em repartir. O paralelo grego apoia esse sentido.
    reason: lexical_alternative
  - marker: b
    text: A redação hebraica desta oração é um tanto difícil; o paralelo grego favorece o sentido de “mesquinhez” ou “avareza à sua mesa”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  choice: quem tem olho mau
  rationale: Preserva a imagem idiomática hebraica, também refletida no grego, ao mesmo tempo que produz uma frase natural em português. A nota esclarece que se trata de uma disposição invejosa e avarenta.
- source_word: תָּעִיט / φθονερὸς
  choice: é mesquinho
  rationale: A forma hebraica é difícil, mas o contexto e o paralelo grego apontam para a atitude de negar ou repartir com má vontade. “É mesquinho” comunica com clareza essa conduta.
- source_word: לָחֶם / ἄρτος
  choice: pão
  rationale: Hebraico e grego empregam literalmente “pão”. A escolha mantém a imagem concreta, que também pode representar o alimento comum.
- source_word: מְהוּמָה / ἐνλεπής
  choice: mesquinhez
  rationale: Embora o termo hebraico seja textual e semanticamente difícil, o paralelo grego favorece a ideia de escassez avarenta ou sordidez à mesa. “Mesquinhez” mantém tanto o aspecto moral quanto o efeito sobre a hospitalidade.
- source_word: שֻׁלְחָנוֹ / τραπέζης αὐτοῦ
  choice: à sua mesa
  rationale: 'Reproduz diretamente a imagem compartilhada pelas testemunhas hebraica e grega: a mesa como lugar de provisão e hospitalidade.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o idioma concreto “olho mau” e explica seu sentido em nota; “até com o pão” torna natural a força da mesquinhez sem abandonar a imagem literal.
