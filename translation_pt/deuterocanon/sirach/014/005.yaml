  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: pt
  text: Quem é mau para si mesmo, a quem fará bem? Não desfrutará do seu próprio bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “não verá o seu bem”. A expressão hebraica provavelmente significa que ele não experimentará nem desfrutará do bem que lhe pertence; o paralelo grego explicita uma nuance material: “não se alegrará com os seus bens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: faz mal a si mesmo
  rationale: A construção descreve a maneira nociva como alguém trata a si próprio. “Faz mal a si mesmo” é natural em português e preserva o contraste ético com “fará bem”, sem transformar נֶפֶשׁ em uma referência técnica à alma.
- source_word: לְמִי יֵיטִיב
  choice: a quem fará bem?
  rationale: O hifil de יטב significa fazer o bem ou beneficiar. A formulação conserva a pergunta retórica e o paralelismo verbal entre fazer mal e fazer bem.
- source_word: וְלֹא יִרְאֶה
  choice: Não desfrutará
  rationale: 'Embora o hebraico diga literalmente “não verá”, o verbo tem aqui sentido experiencial: usufruir ou desfrutar. O paralelo grego, “não se alegrará”, confirma essa leitura.'
- source_word: בְּטוֹבָתוֹ
  choice: dos seus próprios bens
  rationale: טוֹבָה pode indicar o bem, a prosperidade ou coisas boas. No contexto de autoprivação e à luz do grego χρήμασιν, “bens” comunica adequadamente os recursos que lhe pertencem, enquanto “próprios” explicita o sufixo possessivo e reforça a ironia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. O paralelismo “faz mal/fará bem” reproduz a força retórica do hebraico. “A si mesmo” evita uma leitura antropológica técnica de נֶפֶשׁ, e “bens” mantém o contexto material sugerido pelo grego sem restringir excessivamente o hebraico.
