    issue: «Revigore-se» é uma equivalência pouco precisa para הִדָּשֵׁן neste contexto.
    rationale: Embora o verbo possa envolver tornar-se viçoso ou bem provido, a exortação sapiencial visa o desfrute/bem-estar enquanto ainda há capacidade. «Revigore-se» tende a ser entendido como recuperar energia e cria redundância imediata com «ainda tem forças». «Desfrute da vida» comunica melhor o sentido contextual sem literalismo enganoso.
