base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: pt
  text: Desfrute da vida enquanto você ainda tem forças; lembre-se de que não há prazer no Sheol, de que a morte não demora e de que o decreto do Sheol não lhe foi revelado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Lembre-se de que a morte não demorará, e a aliança do Hades não lhe foi mostrada”. O hebraico traz: “o decreto do Sheol não lhe foi revelado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ
  choice: enquanto você ainda tem forças
  rationale: A expressão hebraica é difícil, mas aponta para a capacidade ou os recursos que a pessoa ainda possui. A formulação escolhida comunica essa capacidade presente em português natural.
- source_word: הִדָּשֵׁן
  choice: Revigore-se
  rationale: O verbo דשן pode indicar tornar-se viçoso, próspero ou bem provido. Neste contexto de aproveitar a vida antes da morte, “Revigore-se” mantém a imagem concreta sem sugerir literalmente engordar.
- source_word: זְכוֹר
  choice: lembre-se
  rationale: Equivalente direto e natural do imperativo hebraico, adequado ao tom de exortação sapiencial.
- source_word: בִשְׁאוֹל
  choice: no Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos e evita reduzi-lo à sepultura ou identificá-lo com concepções posteriores de inferno.
- source_word: תַּעֲנוּג
  choice: prazer
  rationale: O substantivo denota prazer, deleite ou desfrute; “prazer” se ajusta de modo claro ao contraste entre a vida presente e o Sheol.
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: a morte não demora
  rationale: O verbo expressa tardar ou demorar. O presente comunica naturalmente a máxima geral do hebraico e concorda com o paralelo grego.
- source_word: וְחֹק לִשְׁאוֹל
  choice: o decreto do Sheol
  rationale: חֹק pode designar estatuto, limite fixado ou decreto. A construção mantém a ligação com o Sheol sem substituir o hebraico pela leitura grega “aliança do Hades”.
- source_word: לֹא הֻגַּד לָךְ
  choice: não lhe foi revelado
  rationale: O passivo de נגד significa que algo não foi contado ou dado a conhecer. “Não lhe foi revelado” é claro, digno e preserva a ideia de conhecimento não comunicado.
theological_decisions:
- issue: Tradução de שְׁאוֹל / ᾅδης
  choice: Sheol
  alternative: sepultura; mundo dos mortos; Hades
  rationale: O texto evoca o domínio dos mortos na linguagem sapiencial hebraica, sem definir doutrinas posteriores sobre o inferno. “Sheol” preserva essa especificidade e a tensão histórica do termo.
- issue: Relação entre חֹק e o Sheol
  choice: decreto do Sheol
  alternative: decreto para o Sheol; aliança do Hades
  rationale: A tradução segue prioritariamente o hebraico חֹק לִשְׁאוֹל e mantém sua concisão. A divergência do grego é registrada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A sintaxe conserva o encadeamento sapiencial do hebraico, enquanto “Sheol” mantém o termo cultural e teologicamente não reduzido.
