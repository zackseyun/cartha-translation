translation:
  language: pt
  text: Aquele que põe o coração nos caminhos dela e pondera seus discernimentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e alcançará entendimento nas coisas ocultas dela”, ou “nos segredos dela”. O hebraico diz “nos discernimentos dela”, leitura seguida no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  choice: Aquele que põe
  rationale: O particípio com artigo tem valor substantivado, “aquele que põe”. A formulação conserva o singular masculino do hebraico e soa natural em português.
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: o coração nos caminhos dela
  rationale: Mantém a imagem hebraica do coração como centro do pensamento, da intenção e da vontade, além da referência feminina à Sabedoria. “Nos caminhos” expressa naturalmente a atenção dirigida a eles.
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: e sobre as compreensões dela
  rationale: תבונותיה designa as compreensões, discernimentos ou percepções pertencentes à Sabedoria. “Compreensões” preserva a relação lexical com o verbo seguinte e não substitui o hebraico pela leitura grega “coisas ocultas/segredos”.
- source_word: יִתְבּוֹנָן
  choice: reflete
  rationale: A forma verbal comunica consideração atenta e reflexiva. “Reflete” é corrente, digna e mantém a força contemplativa.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: dela
  alternative: seus / da sabedoria como abstração impessoal
  rationale: Os sufixos femininos hebraicos retomam a Sabedoria personificada no contexto. “Dela” preserva essa textura literária e teológica sem transformar a personificação em entidade independente.
- issue: Participante no singular masculino
  choice: Aquele que põe o coração
  alternative: Quem põe o coração
  rationale: “Aquele” representa de modo transparente o particípio substantivado masculino singular, sem acrescentar uma especificação ausente no texto.
- issue: Diferença entre o hebraico e o paralelo grego
  choice: O texto principal segue “compreensões”
  alternative: coisas ocultas / segredos
  rationale: O testemunho hebraico fornecido é direto e de alta confiança. A leitura grega é preservada em nota como variante antiga relevante, sem substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição “compreensões... reflete” procura conservar a ligação semântica entre תבונות e יתבונן; a nota registra a divergência do grego.
