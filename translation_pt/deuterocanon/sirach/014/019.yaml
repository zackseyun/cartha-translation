base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/019.yaml
  text: All his works rot away[a], and the work of his hands is dragged along behind him.
translation:
  language: pt
  text: Todas as suas obras apodrecem[a], e o trabalho de suas mãos é arrastado atrás dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e quem a realiza partirá junto com ela”. O hebraico, porém, diz que o trabalho de suas mãos é arrastado atrás dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: Todas as suas obras
  rationale: Mantém o alcance total de כָּל e traduz מַעֲשָׂיו de modo amplo e literário, abrangendo aquilo que a pessoa faz ou produz.
- source_word: רָקוֹב יִרְקָבוּ
  choice: apodrecem
  rationale: A construção hebraica repete a raiz ligada à podridão para dar ênfase. O verbo simples em português comunica a imagem com naturalidade; o contexto e a forma verbal já expressam o processo de corrupção.
- source_word: וּפֹעַל יָדָיו
  choice: e o trabalho de suas mãos
  rationale: Preserva tanto o produto da ação indicado por פֹעַל quanto a imagem concreta das mãos, sem reduzir a expressão apenas a 'feito' ou 'obra'.
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: é arrastado atrás dele
  rationale: Reproduz o sentido passivo de משך e traduz diretamente אַחֲרָיו, conservando a imagem incomum de o trabalho ser levado atrás de quem o realizou.
theological_decisions:
- issue: Divergência entre o hebraico e o grego no segundo membro do versículo
  choice: 'Seguir o hebraico preservado: o trabalho de suas mãos é arrastado atrás dele.'
  alternative: 'Seguir o grego: quem o realiza partirá junto com ele.'
  rationale: O testemunho hebraico é preservado com alta confiança e tem prioridade. O grego confirma o tema geral da transitoriedade, mas muda o sujeito da oração; por isso, sua leitura é registrada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla. A formulação mantém a imagem concreta e um tanto áspera do hebraico. O pronome masculino singular foi conservado porque o verso fala do indivíduo em termos genéricos.
