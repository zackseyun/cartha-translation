  text: He sets his nest in her foliage[a], and lodges among her branches.
translation:
  language: pt
  text: Ele põe seu ninho na folhagem dela[a] e passa a noite entre seus ramos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Porá seus filhos sob a proteção dela e passará a noite debaixo dos ramos dela.” O hebraico traz “seu ninho” e “na folhagem dela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  choice: põe
  rationale: O verbo שׂים significa pôr ou colocar; “põe seu ninho” é natural em português e mantém a ação concreta do hebraico.
- source_word: קִנּוֹ
  choice: seu ninho
  rationale: O hebraico designa claramente um ninho. A imagem é coerente com a folhagem e os ramos, embora o paralelo grego tenha “seus filhos”.
- source_word: בְעָפְיָהּ
  choice: na folhagem dela
  rationale: A palavra se refere ao conjunto de folhas ou à vegetação frondosa. A formulação preserva o sufixo feminino, que retoma a Sabedoria na imagem de uma árvore.
- source_word: וּבַעֲנָפֶיהָ
  choice: entre seus ramos
  rationale: עָנָף significa ramo. “Entre seus ramos” expressa de modo natural a localização dentro da copa, sem adotar o “debaixo dos ramos” do paralelo grego.
- source_word: יִתְלוֹנָן
  choice: passa a noite
  rationale: O verbo denota alojar-se ou pernoitar. “Passa a noite” conserva seu valor temporal mais específico e se integra naturalmente à imagem do ninho.
theological_decisions:
- issue: Divergência entre o texto hebraico de Ben Sira e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: “seu ninho”, “na folhagem dela” e “entre seus ramos”.'
  alternative: 'O grego diz: “Porá seus filhos sob a proteção dela e passará a noite debaixo dos ramos dela.”'
  rationale: Como o testemunho hebraico está preservado, é coerente e tem alta confiança, ele rege a tradução. A divergência significativa do grego é mantida em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de imagens arbóreas foi preservada, assim como a referência feminina à Sabedoria. “Passa a noite” traduz de forma concreta o verbo hebraico, evitando o sentido mais amplo de permanência contínua.
