  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: pt
  text: Mau é quem tem o olhar invejoso[a], desvia o rosto e despreza as pessoas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o olhar mau”. A expressão grega pode indicar uma disposição invejosa e mesquinha e também evocar a ideia de mau-olhado.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as almas”; também pode ser entendido como “as vidas”. Aqui, o termo se refere a pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: Mau
  rationale: Mantém a avaliação moral do adjetivo predicativo sem reduzir o sentido a algo apenas desagradável.
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: quem tem o olhar invejoso
  rationale: Expressa em português corrente a disposição invejosa e mesquinha do idioma grego, preservando a imagem do olho por meio de “olhar”.
- source_word: ἀποστρέφων πρόσωπον
  choice: desvia o rosto
  rationale: Reproduz de modo direto e natural o gesto concreto de recusa ou indiferença.
- source_word: ὑπερορῶν
  choice: despreza
  rationale: Comunica claramente a ideia de tratar com desdém ou não dar consideração, adequada ao registro conciso do provérbio.
- source_word: ψυχάς
  choice: as pessoas
  rationale: Neste contexto, ψυχαί designa seres humanos, não necessariamente almas como componente imaterial; “pessoas” torna essa referência inequívoca.
theological_decisions:
- issue: Sentido do idioma βασκαίνων ὀφθαλμῷ
  choice: o olhar invejoso
  alternative: o mau-olhado; o olhar mau
  rationale: O contexto ético favorece inveja, mesquinhez e má vontade. A nota conserva a possibilidade de uma leitura mais literal e culturalmente marcada.
- issue: Sentido de ψυχάς
  choice: as pessoas
  alternative: as almas; as vidas
  rationale: Evita impor ao termo uma antropologia técnica que o contexto não exige, ao mesmo tempo que registra em nota a amplitude lexical do grego.
translation_notes:
  register: Português moderno, conciso e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura proverbial e as imagens concretas do olhar e do rosto foram preservadas.
