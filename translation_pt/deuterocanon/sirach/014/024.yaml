  text: He who camps around her house and drives his tent peg into her wall—[a]
translation:
  language: pt
  text: Aquele que acampa ao redor da casa dela e crava suas estacas na parede dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que se hospeda perto da casa dela e fixa uma estaca em seus muros”. O grego diz mais explicitamente “perto” e traz “uma estaca” e “muros”, enquanto o hebraico conserva a imagem de acampar “ao redor” e fala de “suas estacas” “na parede dela”.'
    reason: Registra as diferenças de imagem, número e localização entre o hebraico e o grego paralelo.
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: Aquele que acampa
  rationale: O particípio de חנה descreve quem acampa ou se instala de modo característico; “acampa” preserva a imagem concreta do hebraico.
- source_word: סְבִיבוֹת בֵּיתָהּ
  choice: ao redor da casa dela
  rationale: סְבִיבוֹת expressa proximidade circundante. A formulação conserva a imagem mais vívida do hebraico, enquanto o grego paralelo traz “perto da casa dela”.
- source_word: וְהֵבִיא
  choice: e finca
  rationale: Embora o sentido básico seja “trazer”, com estacas o verbo indica colocá-las ou fixá-las; o grego πήξει confirma essa ação.
- source_word: יְתֵדָיו
  choice: as estacas
  rationale: יתד designa estaca ou pino, especialmente no contexto de uma tenda. A forma hebraica é plural e o plural natural em português foi mantido, apesar do singular no grego paralelo.
- source_word: בְּקִירָהּ
  choice: junto ao muro dela
  rationale: A preposição בְּ pode indicar localização ou contato. “Junto ao muro” preserva a imagem de instalar a tenda ao lado da morada sem sugerir, de modo estranho, perfurar o muro da casa.
theological_decisions:
- issue: Referente dos pronomes femininos
  choice: Os pronomes remetem à Sabedoria personificada.
  alternative: Uma mulher ou dona de casa genérica.
  rationale: O contexto imediato trata da busca pela Sabedoria e de permanecer perto dela; portanto, a metáfora da casa continua essa personificação.
translation_notes:
  register: Português moderno, digno e acessível. “Aquele que” reproduz o caráter proverbial do particípio; “casa”, “estacas” e “muro” mantêm a metáfora concreta de alguém que arma sua tenda bem perto da Sabedoria.
