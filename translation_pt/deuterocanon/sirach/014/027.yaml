  text: He takes refuge in its shade from the heat[a], and he dwells in its shelters.
translation:
  language: pt
  text: Ele se refugia à sombra dela, protegido do calor[a], e habita em suas moradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto o paralelo grego: “Será protegido por ela do calor abrasador e se hospedará em sua glória”. O hebraico traz “em suas moradas”, enquanto o grego traz “em sua glória”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: Ele se refugia
  rationale: O particípio de חסה expressa buscar abrigo ou proteção; o presente comunica naturalmente a máxima proverbial, mantendo o sujeito singular.
- source_word: בְּצִלָּהּ
  choice: à sombra dela
  rationale: צל significa “sombra” ou “abrigo sombreado”. O pronome feminino retoma a sabedoria personificada e preserva em português o gênero do antecedente.
- source_word: מֵחֹרֶב
  choice: longe do calor
  rationale: חרב pode indicar calor, secura ou condição abrasadora. A preposição מן marca proteção ou afastamento; o paralelo grego καύματος confirma a ideia de calor intenso.
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: em suas moradas
  rationale: מְעוֹנוֹת designa moradas, habitações ou lugares onde se permanece. “Moradas” traduz diretamente o hebraico sem substituir a imagem pelo sentido contextual de abrigo.
- source_word: יִשְׁכֹּן
  choice: habita
  rationale: שכן significa morar, residir ou permanecer. O presente harmoniza-se com o particípio anterior e com o caráter proverbial do verso; o imperfeito hebraico também poderia ser vertido no futuro.
theological_decisions:
- issue: Gênero do antecedente personificado
  choice: 'Usar formas femininas: “dela” e “suas”, retomando a sabedoria.'
  alternative: Usar referência impessoal à sombra ou à imagem arbórea.
  rationale: Em português, “sabedoria” é feminina e a concordância soa natural, além de conservar a personificação e os sufixos femininos do hebraico.
- issue: Valor temporal de יִשְׁכֹּן
  choice: 'Traduzir pelo presente proverbial: “habita”.'
  alternative: “habitará”.
  rationale: O imperfeito pode ter valor prospectivo, habitual ou modal. No paralelismo com o particípio וְחוֹסֶה, o presente comunica adequadamente uma ação característica sem excluir a nuance durativa.
- issue: Diferença textual entre o hebraico e o grego
  choice: Manter “em suas moradas”, conforme o hebraico.
  alternative: “em sua glória”, conforme o grego δόξῃ.
  rationale: O testemunho hebraico fornecido é primário e tem alta confiança; a divergência genuína do paralelo grego é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com cadência sapiencial. “Moradas” conserva o caráter elevado sem ser arcaico; “à sombra dela” mantém naturalmente a personificação feminina da sabedoria.
