  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: pt
  text: Aos olhos de todo ser vivo — e, mesmo depois de sua morte, ele foi procurado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma forma ampliada: “Depois que adormeceu, ele profetizou e mostrou ao rei o seu fim; da terra, ergueu a voz em profecia, para apagar a iniquidade do povo”. Isso provavelmente esclarece que o hebraico “foi procurado” se refere ao fato de Samuel ter sido consultado depois da morte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני
  choice: Aos olhos de
  rationale: Mantém o idiomatismo hebraico e seu sentido público ou avaliativo sem decidir entre mera observação e estima.
- source_word: כל חי
  choice: todo ser vivo
  rationale: Reproduz a amplitude literal do hebraico; no contexto, a expressão provavelmente se refere a todas as pessoas vivas.
- source_word: וגם
  choice: e, mesmo
  rationale: Expressa tanto a coordenação quanto a ênfase crescente que introduz o fato posterior à morte.
- source_word: אחרי מותו
  choice: depois de sua morte
  rationale: Tradução direta, natural e formalmente próxima da expressão temporal hebraica.
- source_word: נדרש
  choice: foi procurado
  rationale: Preserva a concisão e a abertura semântica do nifal de דרש, que pode significar ser procurado, buscado para consulta ou consultado. A nota apresenta o esclarecimento oferecido pelo paralelo grego.
theological_decisions:
- issue: Grau de explicitação da atuação de Samuel depois da morte
  choice: 'Manter no texto principal a formulação hebraica concisa: “depois de sua morte, ele foi procurado”.'
  alternative: 'Traduzir segundo a expansão grega: “depois que adormeceu, profetizou e mostrou ao rei o seu fim...”'
  rationale: O hebraico preservado tem prioridade e não explicita a profecia póstuma. A formulação escolhida conserva sua ambiguidade genuína, enquanto a nota registra a tradição mais desenvolvida do paralelo grego sem incorporá-la silenciosamente ao texto principal.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Todo ser vivo” conserva a abrangência do hebraico; “foi procurado” evita resolver no texto principal a ambiguidade entre busca e consulta. O travessão marca a progressão enfática do breve fragmento.
