base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: pt
  text: O Senhor[a] deu força a Calebe, e ela permaneceu com ele até a velhice, para que subisse às regiões altas da terra; e seus descendentes tomaram posse de uma herança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “o Senhor”; o hebraico preservado diz apenas “ele”.
    reason: Registrar a diferença textual quanto à explicitação do sujeito.
  - marker: b
    text: A partir de “para que subisse”, a continuação é preservada no grego, mas não consta no texto hebraico disponível deste versículo.
    reason: Distinguir com transparência o conteúdo atestado apenas pelo paralelo grego fornecido.
lexical_decisions:
- source_word: עָצְמָה / ἰσχύν
  choice: força
  rationale: Expressa de modo direto a força ou vigor concedido a Calebe, preservando a correspondência entre o hebraico e o grego.
- source_word: עָמְדָה עִמּוֹ / διέμεινεν αὐτῷ
  choice: permaneceu com ele
  rationale: Mantém a personificação gramatical da força como aquilo que continuou com Calebe até a velhice.
- source_word: ὕψος τῆς γῆς
  choice: regiões altas da terra
  rationale: Traduz literalmente a ideia topográfica sem restringi-la indevidamente a um monte específico.
- source_word: σπέρμα αὐτοῦ
  choice: seus descendentes
  rationale: Comunica naturalmente o sentido coletivo de linhagem ou posteridade neste contexto.
- source_word: κατέσχεν κληρονομίαν
  choice: tomaram posse de uma herança
  rationale: Preserva tanto a ação de ocupar/possuir quanto a linguagem de herança territorial.
theological_decisions:
- issue: Identidade do sujeito que concede força a Calebe
  choice: O Senhor
  alternative: Ele
  rationale: O hebraico preservado traz apenas o sujeito implícito, literalmente “ele”, enquanto o paralelo grego identifica explicitamente “o Senhor”. A tradução adota a leitura explícita do testemunho grego e registra a diferença em nota.
- issue: Extensão do versículo além de “até a velhice”
  choice: Incluir a subida às regiões altas e a posse da herança pelos descendentes
  alternative: Encerrar o versículo após “até a velhice”
  rationale: O manuscrito hebraico composto fornecido termina nesse ponto, mas o paralelo grego conserva a continuação, também refletida na camada inglesa auditada. A continuação é incluída com transparência textual em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação conserva a linguagem territorial e hereditária do texto sem acrescentar interpretação denominacional.
