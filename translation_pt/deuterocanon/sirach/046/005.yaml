base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: pt
  text: Pois ele clamou ao Deus Altíssimo quando seus inimigos o pressionavam por todos os lados, e o Deus Altíssimo lhe respondeu com pedras de granizo e pedras de gelo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego apresenta uma formulação diferente e mais expansiva: “o grande Senhor os ouviu [ou: ouviu-o] com pedras de granizo, com poder vigoroso”. Aqui, segue-se como principal o testemunho hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: clamou ao
  rationale: A expressão indica um pedido dirigido a Deus em busca de socorro. “Clamou ao” é corrente em português, conserva a intensidade da invocação e concorda com o grego ἐπεκαλέσατο.
- source_word: אל עליון
  choice: Deus Altíssimo
  rationale: Conserva o título divino hebraico e sua repetição nas duas orações, em formulação natural e reconhecível em português.
- source_word: כאכפה לו אויביו מסביב
  choice: quando seus inimigos o pressionavam por todos os lados
  rationale: A forma verbal hebraica é rara ou incerta; o paralelo grego indica aflição causada por inimigos ao redor. A tradução preserva tanto a pressão hostil quanto o cerco, sem reduzi-los a mera localização.
- source_word: ויענהו
  choice: lhe respondeu
  rationale: O hebraico expressa resposta, enquanto o grego traz a ideia de ouvir favoravelmente. “Lhe respondeu” segue de modo direto o testemunho hebraico e implica uma resposta eficaz.
- source_word: באבני ברד
  choice: com pedras de granizo
  rationale: 'A preposição tem valor instrumental: a resposta divina ocorre por meio do fenômeno tempestuoso. A expressão também mantém a imagem concreta de “pedras” presente no hebraico.'
- source_word: וא לגביש / ואלגביש
  choice: e pedras de gelo
  rationale: O termo raro pertence ao vocabulário de teofanias de tempestade e parece designar gelo ou granizo endurecido. Como ברד já significa granizo, “pedras de gelo” mantém distinta a segunda imagem, sem fundir os dois termos.
theological_decisions:
- issue: Repetição do título divino
  choice: Repetir “Deus Altíssimo” nas duas orações
  alternative: Empregar apenas “o Altíssimo” na segunda oração
  rationale: O hebraico repete אל עליון, enfatizando que o mesmo Deus invocado é quem responde. A repetição foi preservada sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção conserva o paralelismo e a repetição do hebraico; a rara duplicação das imagens de granizo e gelo foi mantida, em vez de ser harmonizada.
