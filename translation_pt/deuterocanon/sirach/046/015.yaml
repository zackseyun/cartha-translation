base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/015.yaml
  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: pt
  text: Pela fidelidade de sua boca[a], foi consultado como vidente[b]; e também, por sua palavra, mostrou-se fiel como pastor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pela fé de sua boca”; neste contexto, o hebraico sugere mais naturalmente a fidelidade ou confiabilidade de sua fala.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz “profeta”, onde o hebraico traz “vidente”.
    reason: alternative_reading
  - marker: c
    text: 'A segunda linha é sintaticamente condensada no hebraico. Também pode ser entendida como: “por sua palavra, foi reconhecido como pastor fiel”.'
    reason: textual_variant
lexical_decisions:
- source_word: באמונת פיו
  choice: Pela fidelidade de sua boca
  rationale: Mantém a imagem hebraica da “boca” e entende אֱמוּנָה como fidelidade ou confiabilidade da fala, não primariamente como crença interior.
- source_word: דרוש
  choice: foi consultado
  rationale: O sentido passivo de דרש permite “foi procurado” ou “foi consultado”; no contexto de um vidente, “foi consultado” expressa naturalmente que as pessoas recorriam a ele.
- source_word: חזה
  choice: vidente
  rationale: Traduz o termo hebraico específico para quem recebe ou comunica visões, sem substituí-lo pelo termo mais amplo “profeta” presente no paralelo grego.
- source_word: בדברו
  choice: por sua palavra
  rationale: Preserva o paralelismo com “sua boca” e expressa a palavra proferida como o meio pelo qual sua fidelidade se tornou manifesta.
- source_word: נאמן רועה
  choice: mostrou-se fiel como pastor
  rationale: Explicita com moderação a construção hebraica comprimida, conservando tanto a qualidade “fiel” quanto a imagem de “pastor” aplicada à liderança de Samuel.
theological_decisions:
- issue: Nuance de אמונה / πίστις
  choice: fidelidade
  alternative: fé; confiabilidade
  rationale: Com “sua boca”, o hebraico aponta mais naturalmente para a confiabilidade de suas declarações do que para uma fé subjetiva. A alternativa é registrada em nota.
- issue: חזה em contraste com o grego προφήτης
  choice: vidente
  alternative: profeta
  rationale: O testemunho hebraico, que é a fonte primária, emprega o termo mais específico “vidente”; a leitura grega é preservada em nota sem substituir o hebraico.
- issue: Sintaxe comprimida de בדברו נאמן רועה
  choice: mostrou-se fiel como pastor
  alternative: foi reconhecido como pastor fiel
  rationale: A formulação mantém a fidelidade como predicação sobre Samuel em seu papel de pastor, sem ocultar que o hebraico omite um verbo explícito.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário de ampla compreensão no Brasil e no mundo lusófono. “Boca”, “vidente” e “pastor” preservam as imagens concretas do hebraico; “mostrou-se” torna inteligível a elipse da segunda linha sem apresentar a expansão como textualmente explícita.
