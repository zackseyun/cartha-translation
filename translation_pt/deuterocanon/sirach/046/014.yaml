  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
translation:
  language: pt
  text: Por ordem do SENHOR, ele deu ordens à assembleia[a], e o Deus de Jacó interveio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico transmitido diz “deu ordens à assembleia”; o texto grego diz “julgou a assembleia”, leitura que combina com o papel de Samuel como juiz.
    reason: alternative_reading
  - marker: b
    text: 'O verbo hebraico também pode significar “visitou”, “voltou sua atenção” ou “prestou auxílio”, e não traz objeto expresso. O grego diz: “o Senhor visitou Jacó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: במצות
  choice: Por ordem de
  rationale: O ב prefixado a מִצְוָה exprime aqui a norma ou a autoridade sob a qual Samuel agiu. “Por ordem de” é natural em português e mantém essa relação.
- source_word: יהוה
  choice: o SENHOR
  rationale: Emprega a convenção bíblica portuguesa de representar o nome divino YHWH por “SENHOR” em versaletes tipográficas, aqui indicadas por maiúsculas.
- source_word: צוה
  choice: deu ordens
  rationale: Segue o sentido normal do hebraico transmitido, “ordenar”, usando uma formulação portuguesa que admite naturalmente a assembleia como destinatária. A leitura grega “julgou” é registrada em nota.
- source_word: עדה
  choice: a assembleia
  rationale: עֵדָה designa a comunidade reunida. “Assembleia” é atual, claro e corresponde também ao grego συναγωγή.
- source_word: ויפקד
  choice: interveio
  rationale: פקד pode indicar voltar a atenção para alguém, visitar, cuidar ou intervir. Sem objeto explícito no hebraico, “interveio” produz uma oração portuguesa completa sem inserir silenciosamente um destinatário.
- source_word: אלהי יעקב
  choice: o Deus de Jacó
  rationale: Tradução direta do título divino, preservando Jacó como parte da expressão hebraica e não como objeto do verbo.
theological_decisions:
- issue: Divergência entre o hebraico צוה (“ordenou”) e o grego ἔκρινεν (“julgou”)
  choice: 'Manter no texto principal o hebraico: “deu ordens à assembleia”'
  alternative: “julgou a assembleia”
  rationale: Como o texto hebraico está preservado e sua forma tem sentido lexical claro, ele recebe prioridade. A leitura grega se ajusta ao papel judicial de Samuel e pode refletir outra forma textual; por isso, é apresentada em nota sem substituir silenciosamente o testemunho hebraico.
- issue: Sujeito e objeto da oração final
  choice: Ler “o Deus de Jacó” como sujeito e não acrescentar objeto
  alternative: “o Senhor visitou Jacó”, conforme o grego; ou “o Deus de Jacó o visitou”, com objeto inferido
  rationale: A sintaxe do hebraico faz de אֱלֹהֵי יַעֲקֹב o sujeito e não traz objeto expresso. A tradução evita identificar sem base textual quem recebeu a intervenção divina, preservando em nota a diferença do grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Deu ordens” evita a repetição pouco natural “por ordem... ordenou”; “interveio” conserva a ação divina sem acrescentar um objeto ausente do hebraico. Todos os marcadores de nota aparecem no texto em ordem.
