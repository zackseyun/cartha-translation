  source_fidelity: 'O texto principal segue adequadamente o hebraico transmitido: במצות יהוה é bem expresso por “Por ordem do SENHOR”; צוה por “deu ordens”; e עדה por “à assembleia”. A oração final preserva de modo prudente a construção hebraica, na qual “o Deus de Jacó” é o sujeito e não há objeto expresso. “Interveio” é uma opção contextual possível para פקד, sem identificar indevidamente um destinatário. A nota informa tanto a amplitude semântica do verbo quanto a formulação mais explícita do paralelo grego.'
