  source_fidelity: A tradução preserva com precisão a estrutura temporal de ועת נוחו על משכבו e traduz adequadamente o sentido não explicitamente mortal de נוחו e משכבו. “Deu testemunho diante do SENHOR e do seu ungido” é uma leitura defensável de העיד יהוה ומשיחו e acompanha a opção do registro de auditoria inglês, sem apresentar como certa a alternativa de invocar ambos como testemunhas.
