base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/018.yaml
  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: pt
  text: E, no momento em que repousava em seu leito[b], ele deu testemunho diante do SENHOR e do seu ungido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traduzido por “ungido” pertence à mesma raiz de “Messias”; neste contexto, a expressão pode se referir especificamente ao governante ungido do SENHOR nos dias de Samuel.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego diverge profundamente neste ponto: “E esmagou os líderes de Tiro e todos os governantes dos filisteus.” Isso indica uma diferença textual substancial entre os testemunhos hebraico e grego.'
    reason: textual_variant
lexical_decisions:
- source_word: ועת
  choice: E, no momento em que
  rationale: Reproduz a introdução temporal do hebraico de modo natural em português.
- source_word: נוחו
  choice: repousava
  rationale: Preserva a ideia de repouso final sem explicitar 'morte', que seria mais interpretativo.
- source_word: על משכבו
  choice: em seu leito
  rationale: Traduz literalmente o lugar onde se deita, com registro digno; 'leito de morte' explicitaria uma inferência.
- source_word: העיד
  choice: deu testemunho diante de
  rationale: Expressa diretamente o valor testemunhal do hifil e mantém a leitura adotada no texto de consulta, embora o verbo também possa ser entendido como invocação de testemunhas.
- source_word: יהוה
  choice: o SENHOR
  rationale: Forma tradicional portuguesa para representar o Tetragrama.
- source_word: ומשיחו
  choice: e do seu ungido
  rationale: Mantém o título hebraico sem o substituir por um nome próprio nem impor uma leitura messiânica posterior.
theological_decisions:
- issue: Sentido de משיחו
  choice: seu ungido
  alternative: seu Messias; seu rei
  rationale: A expressão conserva o título e sua ambiguidade lexical; no contexto histórico, pode indicar especificamente o governante ungido do SENHOR nos dias de Samuel.
- issue: Relação sintática de העיד com יהוה ומשיחו
  choice: deu testemunho diante do SENHOR e do seu ungido
  alternative: chamou o SENHOR e seu ungido como testemunhas
  rationale: A formulação principal segue o entendimento de testemunhar perante ambos, sem ocultar que o hifil de עוד também pode admitir a interpretação de invocá-los como testemunhas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Leito' preserva o tom literário sem soar arcaico; 'repousava' evita interpretar explicitamente a cena como morte. Todos os marcadores de nota aparecem no texto.
