base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: pt
  text: Josué, filho de Num, foi um guerreiro valente, assistente de Moisés na profecia[a]; ele foi formado, em seus dias, para ser uma grande salvação para os seus escolhidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “sucessor de Moisés nas profecias”, tornando a relação de Josué com Moisés mais explicitamente uma relação de sucessão do que a redação hebraica preservada.'
    reason: alternative_reading
  - marker: b
    text: “Uma grande salvação” também pode ser traduzida por “uma grande libertação” ou “uma grande vitória”; o hebraico תשועה e o grego σωτηρία podem ter tanto sentido militar quanto um sentido mais amplo de salvação.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: guerreiro valente
  rationale: A expressão hebraica reúne a ideia de um homem poderoso à de valor e capacidade militar. “Guerreiro valente” é natural em português e preserva a força marcial, também confirmada pelo grego κραταιὸς ἐν πολέμῳ.
- source_word: משרת משה
  choice: assistente de Moisés
  rationale: משרת designa alguém que serve em função auxiliar ou oficial. “Assistente” comunica essa relação sem sugerir um cargo eclesiástico posterior.
- source_word: בנבואה
  choice: na profecia
  rationale: A expressão hebraica é breve e admite mais de uma relação possível com a função profética. A tradução compacta preserva essa abertura, enquanto a variante grega é registrada em nota.
- source_word: אשר נוצר
  choice: ele foi formado
  rationale: נוצר provavelmente é uma forma passiva com o sentido de “formado” ou “moldado”, possivelmente sugerindo preparação divina. A tradução acompanha o hebraico preservado sem o tornar mais específico como “designado”.
- source_word: להיות בימיו
  choice: para ser, em seus dias
  rationale: Mantém tanto a finalidade expressa pelo infinitivo quanto o elemento temporal, com uma ordem compreensível em português.
- source_word: תשועה גדולה
  choice: uma grande salvação
  rationale: תשועה pode indicar salvação, libertação ou vitória. “Salvação” conserva a amplitude do termo e sua ressonância teológica, sem excluir a libertação militar presente no contexto.
- source_word: לבחיריו
  choice: para os seus escolhidos
  rationale: O sufixo possessivo provavelmente se refere aos escolhidos de Deus, mas a formulação não explicita o referente. “Seus escolhidos” preserva essa ambiguidade, em concordância com o grego ἐκλεκτῶν αὐτοῦ.
theological_decisions:
- issue: Relação de Josué com Moisés na expressão בנבואה
  choice: Manter “assistente de Moisés na profecia” no texto principal.
  alternative: “sucessor de Moisés nas profecias”
  rationale: O grego explicita uma relação de sucessão, mas o hebraico preservado diz משרת משה, “assistente de Moisés”. A tradução segue o testemunho hebraico primário e registra a leitura grega em nota, sem resolver indevidamente a tensão textual.
- issue: Amplitude semântica de תשועה
  choice: Traduzir por “salvação”.
  alternative: “libertação” ou “vitória”
  rationale: O contexto é militar, mas tanto o hebraico תשועה quanto o grego σωτηρία têm alcance mais amplo. “Salvação” preserva essa amplitude sem eliminar o sentido histórico de livramento.
- issue: Agente e propósito implícitos em נוצר
  choice: Traduzir literalmente por “foi formado”, sem nomear o agente.
  alternative: “foi designado”
  rationale: A forma passiva pode sugerir ação divina, mas o agente não é expresso. “Foi formado” preserva essa possibilidade sem acrescentar uma afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a concisão solene do hebraico, mas usa pontuação e ordem natural em português. As ambiguidades relativas à profecia, ao agente de “foi formado” e ao referente de “seus” foram preservadas.
