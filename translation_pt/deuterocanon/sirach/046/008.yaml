base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: pt
  text: Por isso, também aqueles dois foram preservados ao longo dos anos[a], dentre seiscentos mil soldados de infantaria, para conduzi-los à sua herança[b], a uma terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica traduzida por «ao longo dos anos» é difícil; pode indicar que os dois foram preservados durante os anos no deserto ou até a velhice. O paralelo grego diz mais simplesmente: «sendo dois, foram salvos».'
    reason: textual_variant
  - marker: b
    text: 'O paralelo grego acrescenta: «para conduzi-los à sua herança, a uma terra que mana leite e mel». Essa continuação provavelmente preserva o sentido mais completo do versículo, cujo testemunho hebraico é mais curto.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da linha anterior, preservando a ligação causal.
- source_word: גם הם
  choice: também aqueles dois
  rationale: O contexto identifica Josué e Calebe, e o paralelo grego explicita que eram dois; a formulação portuguesa torna clara essa referência.
- source_word: בשנים נאצלו
  choice: foram preservados ao longo dos anos
  rationale: A expressão hebraica é difícil. Esta tradução mantém a provável ideia de terem sido conservados com vida durante os anos no deserto, sem ocultar a incerteza textual, indicada em nota.
- source_word: משש מאות אלף רגלי
  choice: dentre seiscentos mil homens de infantaria
  rationale: רגלי designa quem anda ou combate a pé. Neste contexto censitário e militar, «homens de infantaria» comunica o sentido com clareza e corresponde ao grego πεζῶν.
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: para conduzi-los à sua herança
  rationale: A continuação preservada no grego associa a sobrevivência dos dois à entrada do povo na terra herdada. «Sua herança» conserva o sentido pactual da terra sem o português pouco natural «para dentro de uma herança».
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: a uma terra que mana leite e mel
  rationale: Reproduz a expressão bíblica tradicional e inteligível para a terra prometida, atestada na continuação grega.
theological_decisions:
- issue: Uso do paralelo grego para completar o testemunho hebraico mais curto
  choice: Manter o hebraico como base e incorporar no texto principal a continuação grega sobre a herança e a terra que mana leite e mel, com nota explícita.
  alternative: Traduzir somente o hebraico conservado, encerrando o versículo depois de «seiscentos mil homens de infantaria».
  rationale: O hebraico existente é primário, mas parece abreviado neste ponto; o grego oferece uma continuação coerente com o contexto de Josué e Calebe. A nota preserva transparência quanto à base textual.
- issue: Sentido da expressão hebraica בשנים
  choice: Traduzir «ao longo dos anos» e registrar a dificuldade em nota.
  alternative: 'Seguir apenas a formulação simplificada do grego: «sendo dois, foram salvos».'
  rationale: A escolha conserva no texto a expressão do testemunho hebraico sem fixar definitivamente se ela alude aos anos no deserto ou à preservação até a velhice.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. «Mana leite e mel» preserva o conhecido registro bíblico sem soar arcaico; as notas tornam transparentes tanto a dificuldade do hebraico quanto a continuação fornecida pelo grego.
