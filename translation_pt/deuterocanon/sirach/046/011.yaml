base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: pt
  text: E os juízes, cada um pelo seu nome — todos aqueles cujo coração não se desviou[a] e que não se afastaram de Deus[b] — que a memória deles seja uma bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “que não elevou o seu coração”; o paralelo grego traz: “cujo coração não se prostituiu”, isto é, cujo coração não se tornou infiel nem se desviou.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz “do Senhor”; o testemunho hebraico aqui diz “de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: E os juízes
  rationale: No contexto, שופטים designa os líderes de Israel no período dos Juízes; o grego οἱ κριταί confirma essa tradução direta.
- source_word: איש בשמו
  choice: cada um pelo seu nome
  rationale: Preserva a ideia de que cada juiz é lembrado individualmente, não apenas o grupo em conjunto.
- source_word: כל אשר לא נשא לבו
  choice: todos aqueles cujo coração não se desviou
  rationale: O hebraico transmitido é conciso e literalmente sugere 'não elevou o coração', mas o paralelo grego indica um coração que não se tornou infiel. A tradução mantém o sentido provável de fidelidade sem reproduzir explicitamente a metáfora grega de prostituição.
- source_word: ולא נסוג מאחרי אל
  choice: e que não se afastaram de Deus
  rationale: נסוג מאחרי exprime recuar ou deixar de seguir; 'afastaram de Deus' é natural e conserva אל, 'Deus', do testemunho hebraico.
- source_word: יהי זכרם לברכה
  choice: que a memória deles seja uma bênção
  rationale: Reproduz de modo claro e idiomático a fórmula hebraica de desejo, preservando 'memória' e 'bênção'.
theological_decisions:
- issue: Título divino na expressão sobre não se afastar
  choice: Deus
  alternative: Senhor
  rationale: O hebraico primário traz אל, 'Deus'; o grego paralelo traz Κυρίου, 'Senhor'. O texto principal segue o hebraico, e a variante grega é registrada em nota.
- issue: Sentido da oração relativa ao coração
  choice: cujo coração não se desviou
  alternative: cujo coração não se elevou
  rationale: A forma hebraica pode sugerir elevação ou orgulho do coração, enquanto o grego aponta para desvio e infidelidade. A leitura principal considera o paralelo grego, mas a ambiguidade do hebraico é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura parentética por travessões preserva o fluxo do original, e as notas mantêm visíveis a ambiguidade hebraica e a variante do título divino.
