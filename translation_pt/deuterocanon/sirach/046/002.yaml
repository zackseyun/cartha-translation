  text: How glorious he was when he stretched out his hand[a], when he brandished a spear against a city.
translation:
  language: pt
  text: Como era glorioso quando estendia a mão[a], quando brandia uma lança contra uma cidade!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Como ele foi glorificado ao erguer as mãos e empunhar uma espada contra cidades.” O testemunho hebraico traz “brandia uma lança contra uma cidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  choice: Como era glorioso
  rationale: A expressão exclamativa hebraica admira a imponência de Josué em combate. “Glorioso” comunica o elogio em português corrente e também corresponde à nuance do paralelo grego.
- source_word: בנטותו יד
  choice: quando estendia a mão
  rationale: O infinitivo hebraico indica a circunstância temporal da ação. A formulação preserva a imagem corporal do hebraico sem especificar além do texto se o gesto era levantar, apontar ou estender.
- source_word: בהניפו כידון
  choice: quando brandia uma lança
  rationale: הניף descreve o movimento de erguer ou agitar uma arma, bem expresso por “brandia”; כידון designa uma arma do tipo lança ou dardo. “Lança” é claro e não restringe excessivamente o tipo de arma.
- source_word: על עיר
  choice: contra uma cidade
  rationale: No contexto militar, על expressa direção hostil. O singular do testemunho hebraico é mantido.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego quanto à arma e ao número
  choice: 'Seguir no texto principal o hebraico: “uma lança contra uma cidade”'
  alternative: O paralelo grego traz “uma espada contra cidades” e apresenta “mãos” no plural.
  rationale: O testemunho hebraico disponível é de alta confiança e coerente, por isso orienta o texto principal; a variante grega é preservada em nota para transparência textual.
- issue: Nuance da linguagem de louvor
  choice: “Como era glorioso”
  alternative: “Como era esplêndido” ou “como foi honrado”
  rationale: A tradução conserva a admiração pela proeza militar de Josué sem acrescentar uma afirmação teológica que ultrapasse o texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção exclamativa natural. O texto principal segue o hebraico; a nota registra de modo conciso as diferenças relevantes do paralelo grego.
