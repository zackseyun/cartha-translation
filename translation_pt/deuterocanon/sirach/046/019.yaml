base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: pt
  text: 'Até o tempo de seu fim, ele foi achado fiel aos olhos de Yahweh: “Tomei um resgate e o escondi — de quem tomei alguma coisa?” E ninguém respondeu contra ele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso e pode também ser entendido assim: “Tomei suborno e o escondi? De quem tomei alguma coisa?” A expressão “ninguém respondeu contra ele” pode significar “ninguém o acusou”. O testemunho grego traz uma forma mais explícita: “Não recebi de ninguém dinheiro, nem sequer sandálias, e ninguém apresentou acusação contra ele.”'
    reason: Registra as ambiguidades lexicais de כפר e ענה בו e a leitura mais desenvolvida do testemunho grego.
lexical_decisions:
- source_word: וגם עד עת קצו
  choice: Até o tempo de seu fim
  rationale: Segue o testemunho hebraico, que diz literalmente que isso se manteve até o tempo do fim de Samuel. O grego apresenta uma formulação diferente e mais desenvolvida sobre o sono eterno.
- source_word: נכון נמצא
  choice: foi achado fiel
  rationale: נכון comunica firmeza, constância e confiabilidade. “Fiel” expressa de modo natural a integridade duradoura de Samuel, sem excluir a ideia de firmeza.
- source_word: בעיני יהוה
  choice: aos olhos de Yahweh
  rationale: Preserva o idioma hebraico e translitera o nome divino יהוה como “Yahweh”.
- source_word: כפר
  choice: resgate
  rationale: “Resgate” é o equivalente lexical mais direto de כפר. Neste contexto de integridade pública, o termo também pode designar compensação indevida ou suborno; essa possibilidade é mantida na nota.
- source_word: ונעלם
  choice: e o escondi
  rationale: Mantém o sentido direto de ocultar ou encobrir algo, com o pronome retomando “resgate”.
- source_word: ממי לקחתי
  choice: de quem tomei alguma coisa?
  rationale: O hebraico é elíptico; “alguma coisa” torna a pergunta compreensível em português sem especificar além do texto o que teria sido tomado.
- source_word: וכל אדם לא ענה בו
  choice: E ninguém respondeu contra ele
  rationale: Conserva a formulação relativamente aberta do hebraico. No contexto forense, a expressão pode significar que ninguém o acusou, sentido corroborado pelo grego e registrado na nota.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém diretamente o Tetragrama יהוה; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Relação entre a declaração citada e a integridade de Samuel
  choice: Apresentar a declaração como testemunho da fidelidade de Samuel sem ampliá-la doutrinariamente
  alternative: Explicitar no texto principal que se trata de uma defesa judicial contra suborno
  rationale: O versículo associa a fidelidade de Samuel à sua negação de ganho indevido, mas a redação hebraica permanece concisa e parcialmente ambígua.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do hebraico. Emprega “ninguém” em vez de “nenhum homem” por naturalidade e inclusão sem perda do sentido universal. A pontuação interrogativa esclarece a negação retórica implícita, enquanto a nota preserva a incerteza textual e lexical.
