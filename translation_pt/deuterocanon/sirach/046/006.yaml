revisions:
- from: Ele lançou destruição sobre uma nação inimiga[a] e, enquanto fugiam, destruiu a todos, para que toda nação conhecesse a condenação deles ao extermínio[b], pois o SENHOR vigia a batalha deles.[c]
  to: Ele lançou destruição[a] sobre uma nação inimiga e, enquanto fugiam, destruiu todos eles, para que toda nação conhecesse a destruição consagrada deles[b], pois o SENHOR vigia a batalha deles.[c]
  rationale: A revisão reduz a interpretação inserida na tradução de חרם, preservando no texto principal a ideia de destruição consagrada e deixando a explicação técnica para a nota. Também desloca a âncora da nota sobre a elipse para “destruição”, o elemento efetivamente suprido, e torna a expressão de totalidade mais natural em português.
