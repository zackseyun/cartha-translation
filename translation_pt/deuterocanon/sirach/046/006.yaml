base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
translation:
  language: pt
  text: Ele lançou destruição[a] sobre uma nação inimiga e, enquanto fugiam, destruiu todos eles, para que toda nação conhecesse a destruição consagrada deles[b], pois o SENHOR vigia a batalha deles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “lançou sobre uma nação inimiga”, sem declarar o que foi lançado; “destruição” é suprido pelo contexto.
    reason: textual_difficulty
  - marker: b
    text: O termo hebraico חרם designa aquilo que é irrevogavelmente entregue ou consagrado à destruição sob juízo divino; a frase hebraica é breve e de construção difícil.
    reason: lexical_alternative
  - marker: c
    text: 'O paralelo grego difere consideravelmente: fala em desencadear guerra contra uma nação e destruir “os que resistiam”; também diz que a batalha estava diante do Senhor e acrescenta que ele seguiu atrás do Poderoso.'
    reason: alternative_reading
lexical_decisions:
- source_word: השליך על גוי אויב
  choice: lançou destruição sobre uma nação inimiga
  rationale: השליך expressa lançar ou arremessar com força, e גוי אויב designa coletivamente uma nação hostil. O hebraico não explicita o objeto lançado; “destruição” torna a frase inteligível sem identificar indevidamente o meio do juízo.
- source_word: ובנוסם
  choice: enquanto fugiam
  rationale: A construção apresenta a fuga como circunstância simultânea à destruição, em português natural.
- source_word: האביד כולם
  choice: destruiu a todos
  rationale: O hifil de אבד significa fazer perecer ou destruir; כולם ressalta a totalidade do grupo no contexto militar.
- source_word: למען דעת כל גוי
  choice: para que toda nação conhecesse
  rationale: Mantém tanto a finalidade expressa por למען quanto o valor distributivo de כל גוי.
- source_word: חרם
  choice: a condenação deles ao extermínio
  rationale: חרם é um termo de guerra pactual para aquilo que é irrevogavelmente consagrado à destruição sob juízo divino. A formulação comunica esse sentido ao leitor moderno sem reduzir o termo a uma simples derrota militar.
- source_word: כי צופה יהוה מלחמתם
  choice: pois o SENHOR vigia a batalha deles
  rationale: צפה significa observar ou manter-se vigilante; מלחמתם conserva o sufixo plural potencialmente ambíguo. יהוה é vertido pela convenção portuguesa “o SENHOR”.
theological_decisions:
- issue: Sentido de חרם numa oração hebraica comprimida
  choice: a condenação deles ao extermínio
  alternative: o anátema deles; sua destruição consagrada; o extermínio decretado contra eles
  rationale: A escolha explicita o núcleo judicial e destrutivo do termo sem introduzir uma doutrina denominacional. A nota preserva seu caráter técnico e a dificuldade sintática.
- issue: Objeto não expresso de השליך
  choice: Inserir “destruição” para completar a expressão em português
  alternative: lançou [algo] sobre; arremeteu contra; lançou guerra contra
  rationale: O hebraico preservado não nomeia claramente aquilo que foi lançado. “Destruição” segue o efeito descrito na oração seguinte, mas a inserção interpretativa é assinalada em nota.
- issue: Relação entre o testemunho hebraico e o paralelo grego
  choice: Seguir o hebraico no texto principal e registrar a divergência grega em nota
  alternative: 'Traduzir segundo o grego: “desencadeou guerra contra uma nação” e “destruiu os que resistiam”'
  rationale: O hebraico existente é a testemunha primária aqui. O grego, porém, diverge de modo substancial e merece documentação por poder refletir outra forma textual.
- issue: Referente do sufixo em מלחמתם
  choice: batalha deles
  alternative: batalha de Israel; batalha dos inimigos
  rationale: O referente do plural não é inequívoco no hebraico. A expressão com “deles” conserva a ambiguidade em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Destruiu a todos” mantém tom formal sem perder a força militar. “O SENHOR” segue a convenção bíblica portuguesa para o Tetragrama. As notas tornam transparentes a elipse hebraica, o termo técnico חרם e a divergência do grego.
