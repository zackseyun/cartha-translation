  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: pt
  text: Que os ossos deles floresçam como um lírio[a][b], e que o nome deles se renove nos seus filhos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um lírio”. Algumas traduções empregam um termo mais geral para a flor ou trazem “rosa”, mas “lírio” é o sentido mais provável de שושנה.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego acrescenta “do lugar deles” depois de “os ossos deles floresçam”. Esse acréscimo pode explicitar a imagem de um florescimento a partir do lugar onde repousam.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “e que o nome deles seja transmitido por seus filhos”. O verbo hebraico pode sugerir renovação ou sucessão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה
  choice: floresçam
  rationale: O verbo פרח descreve o ato de brotar ou florescer. “Floresçam” conserva a imagem botânica e, com “que”, expressa naturalmente o valor volitivo do contexto.
- source_word: עצמותם
  choice: os ossos deles
  rationale: Mantém a expressão concreta do hebraico, também confirmada pelo paralelo grego, sem atenuá-la para “restos mortais”.
- source_word: כשושנה
  choice: como um lírio
  rationale: שושנה provavelmente designa o lírio. “Como um lírio” é natural em português e preserva a comparação floral; “rosa” continua sendo uma alternativa tradicional, mas menos provável.
- source_word: ושמם
  choice: e que o nome deles
  rationale: “Nome” preserva o idioma bíblico, que pode abranger memória, reputação e continuidade familiar sem escolher apenas um desses sentidos.
- source_word: תחליף
  choice: se renove
  rationale: חלף pode indicar renovação, sucessão ou substituição. “Se renove” mantém a imagem de continuidade do nome na geração seguinte sem reduzi-la a mera troca.
- source_word: לבניהם
  choice: nos seus filhos
  rationale: O hebraico especifica filhos homens. A formulação preserva essa referência e representa naturalmente a preposição ל no sentido de continuidade neles.
theological_decisions:
- issue: Termo masculino para os descendentes
  choice: filhos
  alternative: descendentes; filhos e filhas
  rationale: בניהם é masculino plural e deve ser preservado sem ampliação interpretativa, embora no contexto represente a continuidade familiar.
- issue: Expressão “do lugar deles” no paralelo grego
  choice: não incorporada ao texto principal
  alternative: Que os ossos deles floresçam, desde o lugar onde estão, como um lírio
  rationale: A expressão ἐκ τοῦ τόπου αὐτῶν aparece no grego, mas não no texto hebraico fornecido. Registrá-la em nota respeita o testemunho paralelo sem inseri-la silenciosamente na tradução do hebraico nem impor uma leitura de ressurreição corporal.
- issue: Continuidade do nome
  choice: se renove nos seus filhos
  alternative: seja transmitido por seus filhos
  rationale: A escolha conserva a ambiguidade entre renovação e sucessão presente em תחליף e evita definir de modo excessivo como essa continuidade ocorre.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “deles” evita ambiguidade referencial; “nos seus filhos” mantém a construção compreensível e próxima do hebraico. A imagem concreta dos ossos que florescem foi preservada.
