translation:
  language: pt
  text: para que todos os descendentes de Jacó saibam que é bom seguir plenamente a Javé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “todos os filhos de Israel” em vez de “todos os descendentes de Jacó”.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por “seguir plenamente” é um tanto incomum; o paralelo grego apoia o sentido de “ir” ou “caminhar após o Senhor”.
    reason: textual_variant
lexical_decisions:
- source_word: למען
  choice: para que
  rationale: Introduz a finalidade ou o resultado e é a formulação mais natural em português.
- source_word: דעת
  choice: saibam
  rationale: Com למען, expressa o conhecimento que se pretende produzir; o subjuntivo é exigido naturalmente por “para que”.
- source_word: כל זרע יעקב
  choice: todos os descendentes de Jacó
  rationale: זרע significa literalmente “semente”, mas aqui designa coletivamente a descendência. “Descendentes” comunica esse sentido com clareza, preservando “Jacó” conforme o testemunho hebraico.
- source_word: כי טוב
  choice: que é bom
  rationale: Apresenta o conteúdo que os descendentes devem saber e mantém explícita a avaliação positiva.
- source_word: למלא אחרי
  choice: seguir plenamente
  rationale: A expressão hebraica é incomum, mas מלא favorece a ideia de plenitude, enquanto o paralelo grego confirma o sentido direcional de ir ou caminhar após alguém. A formulação preserva ambos os aspectos sem reduzi-los a uma paráfrase abstrata de obediência.
- source_word: יהוה
  choice: Javé
  rationale: Emprega em português uma forma conhecida do nome divino representado pelo Tetragrama, em vez de ocultá-lo sob um título.
theological_decisions:
- issue: Jacó no hebraico versus Israel no grego
  choice: todos os descendentes de Jacó
  alternative: todos os filhos de Israel
  rationale: Segue-se o testemunho hebraico sobrevivente, que traz “toda a descendência de Jacó”; a leitura grega é registrada em nota por ser uma variante antiga relevante.
- issue: Sentido da expressão de lealdade/obediência
  choice: seguir plenamente a Javé
  alternative: caminhar após o Senhor
  rationale: A tradução conserva tanto o elemento de plenitude sugerido pelo hebraico quanto a metáfora de seguir confirmada pelo grego, sem substituir a tensão lexical por uma formulação doutrinária mais específica.
translation_notes:
  register: Português atual, digno e acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. “Descendentes” evita o literalismo obscuro de “semente”, e “seguir plenamente” preserva a concisão e a tensão do hebraico.
