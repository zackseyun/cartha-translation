base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: pt
  text: Ele também clamou a Deus quando seus inimigos o cercaram por todos os lados[a]; quando ofereceu um cordeiro ainda mamando[b], Yahweh trovejou do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz algo como “quando seus inimigos ... ao redor”, mas a forma exata no texto hebraico preservado é difícil; o paralelo grego apoia o sentido de que os inimigos o apertavam ou cercavam por todos os lados.
    reason: textual_variant
  - marker: b
    text: 'Ou: “um cordeiro alimentado com leite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: clamou a Deus
  rationale: A expressão קרא אל indica dirigir a Deus um apelo ou oração. “Clamou a Deus” é natural em português e comunica a invocação feita em situação de aflição.
- source_word: כאפכה לו אויביו מסביב
  choice: quando seus inimigos o cercaram por todos os lados
  rationale: A forma hebraica preservada é difícil, mas o contexto e o paralelo grego, com a ideia de inimigos que o afligem ao redor, sustentam o sentido de cerco e pressão por todos os lados.
- source_word: בעלתו
  choice: quando ofereceu
  rationale: Embora a forma do testemunho hebraico seja problemática, o grego ἐν προσφορᾷ confirma um contexto de oferta sacrificial. A construção verbal é clara e natural em português.
- source_word: טלה חלב
  choice: um cordeiro ainda mamando
  rationale: A expressão designa um cordeiro jovem que ainda se alimenta de leite. A formulação escolhida é concreta e idiomática, sem tornar o animal mais velho ou apenas cevado.
- source_word: וירעם משמים יהוה
  choice: Yahweh trovejou desde o céu
  rationale: O verbo רעם descreve o trovão como resposta divina. “Trovejou” preserva de modo direto essa imagem, e “desde o céu” expressa a origem indicada por משמים.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. “Clamou” e “trovejou” mantêm o tom elevado sem arcaísmo; a incerteza textual é preservada em nota.
