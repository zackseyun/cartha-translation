  text: Who could stand before him? For he fought the wars of Yahweh[a].
translation:
  language: pt
  text: Quem poderia manter-se de pé diante dele? Pois ele travou as guerras de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego difere: “Quem, antes dele, se manteve assim de pé? Pois o próprio Senhor lançou contra ele os inimigos.” O texto principal segue o testemunho hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; a forma simples preserva clareza e força.
- source_word: לפניו יתיצב
  choice: poderia manter-se de pé diante dele
  rationale: Reproduz a imagem hebraica de permanecer diante de alguém, com valor contextual de resistir-lhe; o modal expressa naturalmente a força retórica do imperfeito.
- source_word: כי
  choice: Pois
  rationale: Introduz a razão que fundamenta a pergunta anterior, mantendo a ligação explicativa.
- source_word: מלחמות
  choice: guerras
  rationale: Conserva o plural e a amplitude do substantivo hebraico, sem restringi-lo a batalhas isoladas.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino presente diretamente no testemunho hebraico.
- source_word: נלחם
  choice: ele travou
  rationale: Em combinação com “guerras”, “travou” é uma expressão portuguesa natural e preserva o sentido marcial do verbo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Agente das guerras na leitura hebraica
  choice: Josué travou as guerras pertencentes a Yahweh
  alternative: O próprio Senhor trouxe os inimigos, conforme o paralelo grego
  rationale: A construção hebraica faz do personagem o sujeito de נלחם e relaciona as guerras a Yahweh. A diferença substantiva do grego é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Manter-se de pé diante dele” conserva a imagem do hebraico e comunica, no contexto, a ideia de conseguir resistir; “travou as guerras” é idiomático sem modernização excessiva.
