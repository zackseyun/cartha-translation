base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: pt
  text: Samuel, que amava seu povo e era agradável ao seu Criador, pedido desde o ventre de sua mãe, foi nazireu de Javé na profecia; foi juiz e exerceu o sacerdócio. Pela palavra de Deus, estabeleceu o reino e ungiu governantes sobre o seu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  choice: Amado por seu povo e agradável ao seu Criador
  rationale: Reproduz os dois qualificativos do testemunho hebraico. “Criador” expressa o particípio עושהו, literalmente “aquele que o fez”, em português natural e digno.
- source_word: המשואל מבטן אמו
  choice: pedido desde o ventre de sua mãe
  rationale: Mantém o vínculo verbal com a ideia de “pedir”, que também ecoa o nome de Samuel, sem explicitar além do que o hebraico afirma.
- source_word: נזיר יהוה
  choice: nazireu de Javé
  rationale: “Nazireu” preserva a referência específica à consagração especial e vitalícia de Samuel; “Javé” verte em português o nome divino יהוה.
- source_word: בנבואה
  choice: na profecia
  rationale: Conserva a formulação compacta e algo elíptica do hebraico, sem decidir se a expressão descreve esfera de atuação, condição ou função profética.
- source_word: שופט ומכהן
  choice: foi juiz e exerceu o sacerdócio
  rationale: Comunica tanto a função judicial e governante de Samuel quanto sua atividade sacerdotal; o verbo כהן indica serviço sacerdotal, não apenas um título.
- source_word: בדבר אל
  choice: Pela palavra de Deus
  rationale: Preserva a ideia de autorização ou agência divina expressa pela preposição ב.
- source_word: הכין ממלכת
  choice: estabeleceu o reino
  rationale: הכין indica estabelecer ou tornar firme, e ממלכת pode designar reino ou realeza; “estabeleceu o reino” mantém a formulação tradicional sem excluir a instituição da monarquia.
- source_word: וימשח נגידים על עם
  choice: ungiu governantes sobre o seu povo
  rationale: “Governantes” exprime נגידים no contexto da unção de Saul e Davi, enquanto “sobre o seu povo” preserva a relação marcada por על e recebe apoio do paralelo grego.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o tetragrama. “Javé” preserva o caráter de nome próprio em forma corrente no português, em vez de substituí-lo por um título.
- issue: Natureza da consagração de Samuel
  choice: nazireu de Javé
  alternative: consagrado a Javé
  rationale: A opção específica conserva a ressonância cultual de נזיר e a ligação com a dedicação de Samuel desde o nascimento, sem reduzir a expressão a uma consagração genérica.
- issue: Status sacerdotal de Samuel
  choice: exerceu o sacerdócio
  alternative: serviu como sacerdote
  rationale: O hebraico acrescenta explicitamente ומכהן. A tradução retém essa afirmação sem procurar harmonizá-la ou redefini-la segundo sistemas posteriores de ofício sacerdotal.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. A sintaxe em aposição preserva a sequência poética do hebraico; “na profecia” foi mantido deliberadamente compacto para não eliminar a ambiguidade da expressão original.
