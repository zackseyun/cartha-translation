  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: pt
  text: Não foi por sua mão que o sol parou[b], e um dia foi como dois[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “um dia foi como dois dias”. O hebraico diz apenas “como dois”; “dias” fica subentendido pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: O versículo alude à tradição da vitória de Josué, na qual o curso do sol foi interrompido; compare Josué 10:12–14.
    reason: cross_reference
lexical_decisions:
- source_word: הלא
  choice: Não foi... que...?
  rationale: Introduz uma pergunta retórica que espera concordância, em formulação natural e digna em português.
- source_word: בידו
  choice: por sua mão
  rationale: Preserva a imagem concreta do hebraico e expressa a ação realizada por intermédio de Josué.
- source_word: עמד השמש
  choice: o sol parou
  rationale: No contexto, עמד indica a interrupção do curso do sol; a formulação também corresponde à tradição evocada em Josué 10.
- source_word: יום אחד
  choice: um dia
  rationale: Tradução direta e idiomática da expressão hebraica.
- source_word: כשנים היה
  choice: se tornou como dois
  rationale: Mantém a concisão do hebraico, que diz literalmente 'foi/tornou-se como dois', deixando 'dias' subentendido pelo contexto.
theological_decisions:
- issue: Linguagem milagrosa sobre Josué e o sol
  choice: Apresentar diretamente o sol como tendo parado por intermédio de Josué.
  alternative: Entender a frase como hipérbole poética sobre a vitória militar ou a duração percebida da luz do dia.
  rationale: O hebraico apresenta a paralisação do sol e o prolongamento do dia sem a naturalizar; a tradução preserva essa afirmação e sua tensão.
translation_notes:
  register: Português atual, amplamente internacional e de leitura natural no Brasil. A pergunta retórica e a imagem concreta de “sua mão” foram preservadas; a formulação evita explicações denominacionais.
