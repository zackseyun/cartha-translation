base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/017.yaml
  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: pt
  text: Num estrondo poderoso, ouviu-se a sua voz[a]; ele subjugou os líderes do inimigo[b], e pereceram todos os governantes dos filisteus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “num estrondo poderoso”. O paralelo grego diz mais explicitamente que o Senhor trovejou do céu e fez ouvir a sua voz com grande estrondo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as guarnições do inimigo”, caso נציבי designe postos ou destacamentos militares, e não líderes.'
    reason: lexical_alternative
  - marker: c
    text: “Governantes dos filisteus” traduz o título filisteu conhecido também nos livros de Samuel; outra tradução possível é “senhores dos filisteus”.
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: Num estrondo poderoso
  rationale: A expressão hebraica é difícil, mas aponta para um acontecimento sonoro intenso; o paralelo grego menciona o trovão vindo do céu e um grande som. “Estrondo poderoso” preserva essa força sem introduzir no texto principal a palavra mais específica “trovão”.
- source_word: נשמע קולו
  choice: ouviu-se a sua voz
  rationale: Reproduz naturalmente em português a construção passiva hebraica e conserva o pronome, sem explicitar no corpo do versículo um referente que o hebraico identifica apenas pelo contexto.
- source_word: ויכנע
  choice: foram subjugados
  rationale: O verbo pode expressar humilhação ou sujeição. “Foram subjugados” comunica com clareza seu sentido militar neste contexto.
- source_word: נציבי צר
  choice: os líderes do inimigo
  rationale: נציב pode designar um oficial ou líder, mas também uma guarnição ou posto. O sentido pessoal harmoniza-se com o membro paralelo sobre os governantes filisteus; צר é entendido coletivamente como “inimigo”.
- source_word: ויאבד
  choice: pereceram
  rationale: A leitura intransitiva exprime diretamente o destino dos governantes filisteus e mantém a concisão poética.
- source_word: סרני פלשתים
  choice: os governantes dos filisteus
  rationale: סרנים é o título característico dos chefes filisteus conhecido nos livros de Samuel. “Governantes” é claro e atual, evitando as possíveis conotações feudais ou teológicas de “senhores”.
theological_decisions:
- issue: Referente de “sua voz”
  choice: Conservar o pronome no texto e indicar em nota que, no contexto, se trata da voz de Deus.
  alternative: 'Explicitar no texto principal: “a voz do Senhor”.'
  rationale: O paralelo grego atribui expressamente ao Senhor o trovão e a voz, e o contexto fala da intervenção divina em resposta a Samuel. Contudo, o hebraico apresenta apenas o pronome; mantê-lo preserva a forma e a leve ambiguidade do texto primário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a sequência solene do hebraico, usando pontuação natural em português.
