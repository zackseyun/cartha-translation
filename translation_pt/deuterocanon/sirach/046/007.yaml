base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: pt
  text: Também, por ter seguido plenamente a Deus e agido com lealdade[b] nos dias de Moisés, ele e Calebe, filho de Jefoné, mantiveram-se firmes contra a rebelião da assembleia, para impedir o povo de pecar e calar a murmuração perversa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz, de forma condensada e um tanto incerta, “manter-se firme na rebelião da assembleia”. O grego apresenta mais plenamente: “resistir ao inimigo, impedir o povo de pecar e fazer cessar a murmuração perversa”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “mostrou misericórdia”. Os termos hebraico e grego podem indicar misericórdia, mas, neste contexto, também expressam uma atuação leal e fiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מלא אחרי אל
  choice: seguiu plenamente a Deus
  rationale: A expressão hebraica indica seguir a Deus de todo o coração. A formulação preserva a força do idioma e sua ligação com a caracterização bíblica de Josué e Calebe.
- source_word: עשה חסד
  choice: agiu com lealdade
  rationale: Embora חסד também possa significar misericórdia, aqui descreve uma atuação fiel e leal nos dias de Moisés; por isso, a alternativa é registrada em nota.
- source_word: להתיצב
  choice: mantendo-se firmes
  rationale: O infinitivo comunica uma tomada de posição resoluta. O plural em português corresponde ao referente composto, Josué e Calebe.
- source_word: בפרע קהל
  choice: contra a rebelião da assembleia
  rationale: O hebraico é condensado e textualmente incerto, mas aponta para a desordem ou revolta da comunidade. A preposição 'contra' expressa a resistência indicada pelo contexto e apoiada pelo paralelo grego.
- source_word: κωλῦσαι λαὸν ἀπὸ ἁμαρτίας
  choice: para impedir o povo de pecar
  rationale: A cláusula final do paralelo grego preserva de modo claro a finalidade da resistência e é vertida diretamente.
- source_word: κοπάσαι γογγυσμὸν πονηρίας
  choice: calar a murmuração perversa
  rationale: A expressão mantém tanto a ideia de fazer cessar a queixa quanto sua avaliação moral, em linguagem corrente e digna.
theological_decisions:
- issue: Uso do paralelo grego para complementar o testemunho hebraico condensado
  choice: Manter o hebraico como base e incluir as cláusulas finais preservadas no grego, com transparência em nota.
  alternative: 'Limitar o texto principal ao hebraico sobrevivente: “mantendo-se firmes contra a rebelião da assembleia”.'
  rationale: O hebraico disponível apresenta formulação comprimida e pequena divergência textual; o grego parece conservar a continuação explicativa. A nota evita apresentar a forma combinada como se não houvesse dificuldade textual.
- issue: Sentido de חסד / ἔλεος
  choice: agir com lealdade
  alternative: mostrar misericórdia
  rationale: A narrativa enfatiza a fidelidade demonstrada por uma tomada de posição firme, mas a amplitude semântica de ambos os termos exige que a leitura “misericórdia” permaneça visível em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Mantiveram-se o encadeamento do versículo anterior, o tom solene e a tensão entre os testemunhos hebraico e grego, sem ocultar a variante textual.
