lexical_decisions:
- source_word: הסב
  choice: Recoste-se à mesa
  rationale: No contexto de um banquete, o verbo indica reclinar-se para comer, postura habitual nas refeições formais antigas. A expressão «à mesa» explicita em português o contexto já pressuposto pelo hebraico.
- source_word: כאיש אשר נבחר
  choice: como um homem distinto
  rationale: נבחר significa literalmente «escolhido» ou «seleto», mas aqui caracteriza a conduta própria de alguém distinto ou refinado. «Homem» preserva a correspondência com איש, sem tornar a expressão artificial.
- source_word: תעט
  choice: não coma com voracidade
  rationale: O verbo descreve o ato de comer de modo ávido e grosseiro. Esta formulação é natural, clara e digna em português, sem acrescentar um objeto ausente no hebraico.
- source_word: תגעל
  choice: não se torne repugnante
  rationale: A forma verbal aponta para tornar-se objeto de repulsa em consequência da má conduta à mesa. «Tornar-se repugnante» conserva diretamente esse resultado social.
