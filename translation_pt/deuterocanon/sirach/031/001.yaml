translation:
  language: pt
  text: A insônia do rico consome sua carne[a], e a preocupação com o sustento afasta o sono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da primeira oração é difícil. O texto grego paralelo diz: “Esperanças vazias e falsas pertencem ao homem sem entendimento, e os sonhos dão asas aos tolos.” O texto principal segue o testemunho hebraico preservado, reconhecendo que a transmissão deste trecho é instável.'
    reason: textual_variant
lexical_decisions:
- source_word: שקר עשיר
  choice: a insônia do rico
  rationale: O hebraico transmitido é difícil. No paralelismo com a preocupação que afasta o sono, a expressão foi entendida como referência à insônia do homem rico; a formulação portuguesa mantém o referente masculino singular sem tornar a frase pesada.
- source_word: ימחה שארו
  choice: consome sua carne
  rationale: שארו admite o sentido corporal de “sua carne”, e ימחה descreve aqui o desgaste progressivo causado pela falta de sono. “Consome” preserva a imagem física em português natural.
- source_word: דאגת
  choice: a preocupação
  rationale: דאגה indica cuidado inquieto ou ansiedade. “Preocupação” é corrente e expressa a perturbação interior sem intensificar indevidamente o termo.
- source_word: מחיה
  choice: com o sustento
  rationale: מחיה designa aquilo que mantém a vida materialmente. “Sustento” abrange provisão e meios de subsistência com clareza.
- source_word: תפריע נומה
  choice: afasta o sono
  rationale: A construção comunica que a preocupação interrompe ou faz desaparecer o sono. “Afasta o sono” reproduz a relação causal de modo conciso e idiomático.
