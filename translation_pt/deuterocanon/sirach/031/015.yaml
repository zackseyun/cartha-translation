translation:
  language: pt
  text: Quem tem olhar mau[a] odeia a Deus, e ele não criou nada pior do que isso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «mau de olho» ou «olho mau»: expressão hebraica para uma pessoa ou disposição mesquinha, invejosa ou ressentida.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é conciso: o sujeito de «criou» é provavelmente Deus, e «isso» pode referir-se à pessoa ou à disposição de «olhar mau». O texto grego diverge radicalmente: «pois a esperança deles está naquele que os salva».'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: mau-olhado
  rationale: Preserva a imagem concreta do hebraico, embora em português a expressão possa sugerir superstição; a nota esclarece que aqui designa a pessoa ou disposição mesquinha, invejosa e ressentida.
- source_word: שונא
  choice: odeia
  rationale: Corresponde diretamente ao verbo hebraico e mantém como sujeito a expressão anterior, conforme a ordem e a sintaxe mais naturais do texto preservado.
- source_word: אל
  choice: a Deus
  rationale: Neste contexto sapiencial, אל é naturalmente entendido como título divino; a regência portuguesa de 'odiar' pede objeto direto, sem preposição, mas a forma 'a Deus' explicita o objeto pessoal de modo corrente.
- source_word: ורע ממנו לא ברא
  choice: e ele não criou nada pior do que isso
  rationale: Mantém a linguagem de criação e a provável referência do sujeito implícito a Deus. 'Isso' conserva alguma abertura quanto a a comparação apontar para a disposição ou para a pessoa caracterizada pelo 'olho mau'.
theological_decisions:
- issue: Sentido e sujeito da primeira oração diante da forte divergência do paralelo grego
  choice: 'Seguir o hebraico: ''O mau-olhado odeia a Deus'''
  alternative: 'O grego traz: ''pois a esperança deles está naquele que os salva'''
  rationale: Como há hebraico preservado e a leitura grega constitui outra frase, não uma pequena variante, o texto principal traduz o testemunho hebraico e registra a divergência em nota.
- issue: Sujeito implícito de ברא
  choice: 'Entender Deus como sujeito: ''ele não criou'''
  alternative: 'Construção passiva: ''nada pior do que ele/isso foi criado'''
  rationale: A oração anterior menciona Deus, que oferece um antecedente natural para o sujeito implícito de 'criou'; a nota reconhece a concisão e a ambiguidade referencial do hebraico.
translation_notes:
  register: Português moderno, digno e acessível. A formulação conserva a imagem semítica no texto principal, com explicação em nota. 'Mau-olhado' é reconhecível, mas seu sentido supersticioso comum em português exige esclarecimento lexical. A repetição pronominal foi formulada naturalmente sem eliminar a ambiguidade do referente final.
