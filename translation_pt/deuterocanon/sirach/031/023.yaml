base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/023.yaml
  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
translation:
  language: pt
  text: Não basta pouco para o homem sensato? E, em seu leito, ele não fica ofegante.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traduzido por “não fica ofegante” é incerto neste ponto. O texto preservado é difícil, mas, pelo contexto, o sentido parece ser que comer com moderação evita mal-estar no leito.
    reason: textual_variant
  - marker: b
    text: O paralelo grego fornecido nos dados desta passagem não corresponde a esta linha hebraica e parece pertencer a outro versículo. Por isso, a tradução segue o hebraico como testemunho principal, assinalando a incerteza.
    reason: textual_variant
lexical_decisions:
- source_word: הלא
  choice: Não... ?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção portuguesa preserva diretamente essa força.
- source_word: די
  choice: basta
  rationale: Expressa suficiência de modo natural e conciso em português.
- source_word: אנוש
  choice: homem
  rationale: Mantém a forma singular e proverbial do hebraico, que designa um ser humano mortal.
- source_word: נבון
  choice: sensato
  rationale: Comunica discernimento e bom senso prático no contexto da moderação à mesa.
- source_word: מזער
  choice: pouco
  rationale: Indica uma pequena quantidade e se combina naturalmente com “basta”.
- source_word: יצועיו
  choice: seu leito
  rationale: Refere-se ao lugar de repouso; “leito” conserva o registro digno e é claro no contexto.
- source_word: לא ישיק
  choice: não fica ofegante
  rationale: A expressão hebraica é difícil. Esta tradução preserva a ideia provável de aflição respiratória ou corporal depois de comer, sem especificar indevidamente vômito ou engasgo.
