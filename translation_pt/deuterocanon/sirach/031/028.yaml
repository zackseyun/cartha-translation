  text: In all your deeds be modest[a], and no disaster will touch you.
translation:
  language: pt
  text: Em tudo o que fizer, seja modesto[a], e nenhuma calamidade o atingirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz aqui uma leitura substancialmente diferente: “Um constrói e outro derruba; o que ganharam além de fadiga?” Este versículo foi traduzido do hebraico preservado, que difere marcadamente da tradição grega.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: Em tudo o que fizer
  rationale: Expressa de modo natural e abrangente a esfera de todas as ações do destinatário, sem perder o sentido ético de מעשים.
- source_word: היה
  choice: seja
  rationale: O imperativo de היה com predicativo é adequadamente vertido pelo imperativo português “seja”.
- source_word: צנוע
  choice: modesto
  rationale: Preserva a ideia de modéstia, discrição e contenção na conduta; “humilde” seria possível, mas estreitaria a nuance.
- source_word: וכל אסון לא
  choice: e nenhuma calamidade
  rationale: A construção hebraica é traduzida idiomaticamente como uma negação abrangente em português.
- source_word: יגע בך
  choice: tocará você
  rationale: Mantém a imagem concreta do verbo נגע, que pode significar tocar, atingir ou alcançar, e soa compreensível em português.
- source_word: εἷς οἰκοδομῶν καὶ εἷς καθαιρῶν, τί ὠφέλησαν πλεῖον ἢ κόπους;
  choice: usado apenas como controle textual secundário
  rationale: O grego apresenta uma forma textual substancialmente diferente. Como o hebraico está preservado e tem prioridade neste caso, a variante grega é registrada em nota, não no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em tudo o que fizer” é mais natural que o literal “em todas as suas obras”; “tocará você” conserva a metáfora hebraica sem obscurecer o sentido.
