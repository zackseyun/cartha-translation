base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/026.yaml
  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: pt
  text: Anos de vida acompanham o homem de discernimento; ele passará a noite até o amanhecer, e sua vida[a] está com ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por “e sua alma está com ele”. O termo נפש pode significar vida, pessoa, ser ou alma, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego citado para este versículo difere profundamente do hebraico e diz aproximadamente: “Quem tira do próximo os meios de subsistência o mata”. Isso parece refletir outra forma textual; por isso, a tradução principal segue o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: Anos de vida
  rationale: Mantém a expressão hebraica sem transformá-la explicitamente em uma promessa de “vida longa”.
- source_word: איש נבון
  choice: o homem de discernimento
  rationale: נבון destaca entendimento e capacidade de discernir; a formulação preserva o singular masculino de איש e soa natural em português.
- source_word: ילין עד בקר
  choice: ele passará a noite até o amanhecer
  rationale: O verbo לין descreve passar a noite ou pernoitar. Esta escolha conserva a imagem noturna e é mais corrente do que uma tradução rígida como “alojar-se-á”.
- source_word: ונפשו עמו
  choice: e sua vida estará com ele
  rationale: נפש pode indicar vida, pessoa, ser ou alma. No contexto, “vida” expressa a ideia de permanecer vivo sem impor uma leitura antropológica dualista; a construção deliberadamente próxima do hebraico preserva certa ambiguidade.
- source_word: φονεύων τὸν πλησίον ὁ ἀφαιρούμενος συμβίωσιν
  choice: não adotado no texto principal; registrado como variante textual
  rationale: O paralelo grego diverge radicalmente do hebraico preservado e parece representar outra forma textual. O testemunho hebraico, por estar disponível, rege a tradução principal.
theological_decisions:
- issue: Sentido antropológico de נפש
  choice: vida
  alternative: alma
  rationale: Neste contexto, o termo provavelmente se refere à vida preservada ou à pessoa viva, não necessariamente a uma entidade imaterial distinta. A alternativa é mantida em nota.
- issue: Divergência entre os testemunhos hebraico e grego
  choice: seguir o texto hebraico no corpo do versículo
  alternative: 'traduzir a linha grega: “Quem tira do próximo os meios de subsistência o mata”'
  rationale: Como há um testemunho hebraico extante e de alta confiança, ele recebe prioridade. A divergência substancial do grego é documentada sem harmonização.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Homem de discernimento” preserva o gênero e o valor semântico do hebraico; “passará a noite” evita linguagem arcaica. A expressão final mantém de propósito algo da formulação incomum do original.
