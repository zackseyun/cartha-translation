lexical_decisions:
- source_word: עמלי
  choice: trabalha arduamente
  rationale: Expressa o labor penoso indicado por עמל em português corrente, sem tornar o sofrimento mais intenso do que o texto exige.
- source_word: עשיר
  choice: um homem rico
  rationale: Mantém o referente masculino singular do hebraico e soa natural em português moderno.
- source_word: לקבץ
  choice: para acumular
  rationale: No contexto de riqueza, 'acumular' comunica com naturalidade a ideia de juntar ou amealhar progressivamente.
- source_word: הון
  choice: riqueza
  rationale: Equivalente direto e corrente para bens ou riquezas no contexto econômico.
- source_word: ינוח
  choice: descansa
  rationale: Traduz diretamente o verbo נוח, preservando o contraste entre trabalho e repouso.
- source_word: לקבל תענוג
  choice: recebe prazer
  rationale: Conserva de perto a construção hebraica 'receber prazer', sem restringir תענוג a luxos materiais; a nota registra uma formulação portuguesa mais idiomática.
