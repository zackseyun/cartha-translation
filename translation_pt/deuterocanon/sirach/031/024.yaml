  text: Pain and sleepless wandering[a], and retching and choking[c][b], and a turned face with a foolish man.
translation:
  language: pt
  text: Dor e sono que foge[b], ânsia de vômito e engasgo, e o rosto virado[c], na companhia de um insensato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico desta frase é difícil, sobretudo nos sintomas intermediários e na expressão “o rosto virado”. O texto grego correspondente é inteiramente diferente, o que revela uma grande divergência na transmissão textual.
    reason: textual_variant
  - marker: b
    text: Ou “sono inquieto”, “vigília agitada”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o rosto desviado” ou “a expressão transtornada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  choice: dor
  rationale: O substantivo indica dor ou sofrimento, provavelmente físico nesta sequência de sintomas.
- source_word: ונדד ישנה
  choice: sono que foge
  rationale: Preserva de modo natural a imagem hebraica do sono que se afasta, sem decidir entre insônia e sono agitado.
- source_word: ומער
  choice: ânsia de vômito
  rationale: A forma hebraica é difícil; a expressão comunica perturbação gástrica sem afirmar com certeza que houve vômito.
- source_word: ותשניק
  choice: engasgos
  rationale: Reflete a ideia de constrição ou sufocamento e se encaixa naturalmente na enumeração de sintomas físicos.
- source_word: ופני הפוכות
  choice: o rosto virado
  rationale: Mantém a imagem concreta e a incerteza do hebraico, que também pode indicar um rosto desviado ou uma expressão transtornada.
- source_word: עם איש כסיל
  choice: na companhia de um insensato
  rationale: Traduz com naturalidade a relação expressa por עם e conserva a categoria sapiencial de כסיל.
