base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: pt
  text: Quem é este[a] que se apegou a isso e ficou em paz, e isso se tornou motivo de honra para ele? Pois, pela abundância de paz em sua vida[b], isso será motivo de honra para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico deste versículo é difícil e diverge profundamente do grego. Uma tradução próxima da forma hebraica preservada é a apresentada no texto; não é certo a que “isso” se refere.
    reason: alternative_reading
  - marker: b
    text: 'A cláusula final do hebraico é incerta e passa de “ele” para “você”. O grego traz uma forma inteiramente diferente: “Quem não foi provado em pouco sabe pouco.”'
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  choice: Quem é este
  rationale: Preserva a pergunta retórica e identificadora do hebraico em português natural.
- source_word: שנדבק בו
  choice: que se apegou a isso
  rationale: Traduz diretamente o sentido de aderir ou apegar-se, sem substituir a leitura hebraica difícil pela ideia grega de ser provado.
- source_word: והיה לו שלום
  choice: e ficou em paz
  rationale: Mantém o substantivo hebraico שלום e expressa naturalmente o estado resultante, sem decidir entre paz, bem-estar e prosperidade.
- source_word: והיה לו תפארה
  choice: e isso se tornou motivo de honra para ele
  rationale: תפארה pode indicar glória, esplendor ou honra; 'motivo de honra' comunica o valor positivo sem introduzir a conotação potencialmente negativa de vanglória.
- source_word: כי ברבות שלום חייו
  choice: Pois, pela abundância de paz em sua vida
  rationale: Representa a cláusula adicional preservada no testemunho hebraico, embora sua forma e relação sintática sejam difíceis.
- source_word: יהיה לך לתפארת
  choice: isso será motivo de honra para você
  rationale: Preserva a segunda pessoa do texto hebraico recebido e o sentido de תפארת, sem harmonizá-la silenciosamente com a terceira pessoa anterior.
- source_word: ὃς οὐκ ἐπειράθη ὀλίγα οἶδεν
  choice: Quem não foi provado em pouco sabe pouco
  rationale: Mantida em nota como variante grega substancialmente diferente, em vez de ser fundida de modo conjectural ao texto hebraico principal.
theological_decisions:
- issue: Divergência profunda entre o testemunho hebraico e o paralelo grego
  choice: Traduzir no texto principal o hebraico preservado, incluindo sua cláusula final, e registrar a forma grega em nota.
  alternative: 'Produzir uma leitura eclética sobre alguém testado e considerado íntegro, ou adotar diretamente o grego: ''Quem não foi provado em pouco sabe pouco.'''
  rationale: A leitura eclética inglesa combina elementos incompatíveis e omite material hebraico. Como o testemunho hebraico tem alta confiança, é preferível representar sua dificuldade honestamente e documentar a variante grega, sem resolver a tensão por conjectura.
- issue: Mudança de terceira para segunda pessoa na cláusula final
  choice: Conservar 'para você' no texto principal.
  alternative: Harmonizar como 'para ele'.
  rationale: A mudança está no testemunho fornecido. Preservá-la evita uma emenda não indicada e permite que a nota informe a dificuldade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém as ambiguidades referenciais e a mudança de pessoa do hebraico, enquanto as notas tornam explícita a divergência textual.
