review_pass:
  verdict: revise
  source_fidelity: 'O texto principal representa de modo geral o hebraico conservado, inclusive a mudança de pessoa na cláusula final. Contudo, «ficou em paz» torna והיה לו שלום excessivamente verbal e pode sugerir apenas um estado passageiro; «teve paz» é mais direto e fiel. A nota grega deve reproduzir com maior precisão o paralelo fornecido: ὃς οὐκ ἐπειράθη ὀλίγα οἶδεν significa literalmente algo como «Quem não foi provado sabe pouco», com ὀλίγα funcionando como objeto de «sabe», não «em pouco».'
  naturalness: «Quem é este que se apegou a isso?» é natural, embora «Quem é este que se apega a isso?» também fosse possível. «Teve paz» soa mais idiomático e conciso do que «ficou em paz» neste paralelismo. A redação conserva adequadamente o tom sapiencial sem explicar o referente incerto de «isso».
  terminology: «Honra» é uma boa opção para תפארה neste contexto e «motivo de honra» evita impor a conotação de vanglória. «Paz» preserva a amplitude de שלום. A nota deve evitar apresentar uma tradução inexata do grego como se fosse literal.
  issues:
  - severity: medium
    issue: A nota b traduz o grego como «Quem não foi provado em pouco sabe pouco».
    rationale: No texto grego citado, ὀλίγα («pouco; poucas coisas») é mais naturalmente o objeto de οἶδεν («sabe»), não um complemento de ἐπειράθη («foi provado»). A formulação atual altera a relação sintática e o sentido básico da variante.
  - severity: low
    issue: «ficou em paz» para והיה לו שלום.
    rationale: A expressão pode ser entendida como entrada num estado de calma. «Teve paz» mantém mais diretamente a construção hebraica e a amplitude semântica de שלום.
  revised_text: Quem é este[a] que se apegou a isso e teve paz, e isso se tornou motivo de honra para ele? Pois, pela abundância de paz em sua vida[b], isso será motivo de honra para você.
  revised_footnotes:
  - marker: a
    text: O hebraico deste versículo é difícil e diverge profundamente do grego. Uma tradução próxima da forma hebraica preservada é a apresentada no texto; não é certo a que “isso” se refere.
    reason: alternative_reading
  - marker: b
    text: 'A cláusula final do hebraico é incerta e passa de “ele” para “você”. O grego traz uma forma inteiramente diferente: “Quem não foi provado sabe pouco.”'
    reason: textual_variant
  revision_rationale: A revisão mantém o hebraico como texto principal, sem fundi-lo conjecturalmente ao paralelo grego, preserva as ambiguidades referenciais e a mudança textual de pessoa, e corrige a tradução da variante grega. Ajusta-se também «ficou em paz» para a formulação mais fiel e natural «teve paz».
