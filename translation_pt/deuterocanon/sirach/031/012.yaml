  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: pt
  text: Por isso, apegue-se firmemente à bondade dele[a], e a assembleia contará o seu louvor. O pão é disciplina[b], e o vinho, junto com ele.
  philosophy: optimal-equivalence
  footnotes:
