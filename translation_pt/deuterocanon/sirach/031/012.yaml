    reason: lexical_alternative
lexical_decisions:
- source_word: על כן
  choice: Por isso
  rationale: Conector inferencial natural em português, que liga a exortação ao contexto anterior.
- source_word: חזק
  choice: apegue-se firmemente
  rationale: O imperativo pode significar ser forte, fortalecer ou agarrar; com טובו, esta formulação comunica a ideia de manter-se firmemente ligado à bondade, sem reduzir o verbo a mera afirmação verbal.
- source_word: טובו
  choice: à bondade dele
  rationale: טובו pode indicar bondade, benefício ou generosidade. “Bondade” conserva a amplitude do termo, enquanto a nota registra as alternativas ligadas ao contexto de hospitalidade.
- source_word: ותהלתו
  choice: o seu louvor
  rationale: Tradução direta do substantivo com sufixo possessivo; no contexto, é o louvor dirigido a ele.
- source_word: יספר קהל
  choice: a assembleia contará
  rationale: יספר exprime contar ou relatar, e קהל designa um grupo reunido. “Assembleia” evita restringir o cenário a uma congregação litúrgica.
- source_word: מוסר לחם
  choice: O pão é disciplina
  rationale: A construção é obscura. מוסר abrange disciplina, instrução e correção; “disciplina” preserva sua força formativa e corretiva sem explicar excessivamente o texto.
- source_word: ויין יחדו
  choice: e o vinho, junto com ele
  rationale: יחדו significa “junto” ou “juntamente”. A formulação mantém a relação de acompanhamento e a concisão difícil do hebraico.
theological_decisions:
- issue: Base textual diante da forte divergência entre o hebraico e o grego
  choice: Seguir o testemunho hebraico no texto principal e registrar a leitura grega em nota.
  alternative: 'Traduzir exclusivamente o grego: “Vi muitas coisas em minhas peregrinações, e meu entendimento supera minhas palavras.”'
  rationale: O hebraico preservado constitui a base primária solicitada. Como o grego apresenta uma leitura substancialmente distinta, não é adequado fundir os dois testemunhos nem ocultar a divergência.
- issue: Sentido de מוסר na cláusula final
  choice: disciplina
  alternative: instrução; correção
  rationale: “Disciplina” mantém juntas as dimensões pedagógica e corretiva do termo e preserva a dificuldade semântica da frase.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução conserva a forma concisa e obscura da cláusula final e evita harmonizar os testemunhos hebraico e grego.
