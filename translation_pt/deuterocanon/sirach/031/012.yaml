    text: 'O grego traz uma leitura substancialmente diferente: “Vi muitas coisas em minhas peregrinações, e meu entendimento supera minhas palavras.” Os testemunhos hebraico e grego divergem fortemente neste ponto. “Bondade” também pode ser traduzida por “generosidade” ou “beneficência”.'
