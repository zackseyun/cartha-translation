  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: pt
  text: Quem é esse? Vamos declará-lo feliz[a], pois ele realizou feitos extraordinários entre o seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego difere substancialmente: “Um homem instruído conheceu muitas coisas, e quem tem muita experiência exporá discernimento.” Isso provavelmente reflete outra forma textual ou outro alinhamento dos versículos.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: Quem é esse?
  rationale: Preserva a pergunta retórica e a força demonstrativa de זה, sem acrescentar “homem”, embora o referente seja uma pessoa.
- source_word: ונאשרנו
  choice: Vamos proclamá-lo feliz
  rationale: O verbo אשר expressa declarar alguém feliz ou bem-aventurado. A formulação com “vamos” comunica a nuance volitiva do hebraico em português atual e evita sugerir que o grupo concede uma bênção.
- source_word: כי
  choice: pois
  rationale: Introduz de modo conciso e natural a razão da declaração anterior.
- source_word: הפליא לעשות
  choice: fez maravilhas
  rationale: A construção verbal comunica uma ação extraordinária ou admirável; “fez maravilhas” conserva o tom elevado sem especificar feitos que o texto não identifica.
- source_word: בעמו
  choice: entre o seu povo
  rationale: Representa naturalmente a preposição ב como esfera social, sem impor a ideia mais específica de benefício expressa por “pelo seu povo”.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico e o paralelo grego fornecido
  choice: Seguir no texto principal o hebraico preservado e registrar o grego em nota.
  alternative: “Um homem instruído conheceu muitas coisas, e quem tem muita experiência relatará entendimento.”
  rationale: Como o hebraico está preservado com alta confiança, ele é a base da tradução. O grego não corresponde de perto à linha hebraica e pode refletir outra forma textual ou outro alinhamento dos versículos; a nota mantém essa divergência visível sem substituir nem harmonizar os testemunhos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Proclamá-lo feliz” conserva o sentido declarativo de אשר sem recorrer ao mais eclesiástico “bem-aventurado”. A pergunta breve mantém o caráter retórico do hebraico.
