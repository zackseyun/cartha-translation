revisions:
- from: Pois isso é tropeço para o insensato[a], e todo ingênuo fica preso nele.
  to: Pois isso é um obstáculo para o insensato[a], e todo ingênuo é enredado por ele.
  rationale: A revisão substitui “tropeço” por “obstáculo”, para expressar o valor de algo que faz tropeçar, e “fica preso” por “é enredado”, para manter mais claramente a imagem passiva de captura. Mantêm-se a ambiguidade do referente “isso”, a distinção entre “insensato” e “ingênuo” e a nota que registra a divergência substancial do paralelo grego.
