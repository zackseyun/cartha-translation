  text: For it is a stumbling block to a fool[a], and every simpleton is ensnared by it.
translation:
  language: pt
  text: Pois isso é um obstáculo para o insensato[a], e todo ingênuo é enredado por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois os sonhos desviaram muitos, e os que neles puseram a esperança caíram.” Os testemunhos hebraico e grego diferem substancialmente neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  choice: tropeço
  rationale: Preserva a imagem concreta de algo que leva alguém a cair ou à ruína, com formulação natural em português.
- source_word: אויל
  choice: insensato
  rationale: Termo corrente na literatura sapiencial para quem demonstra deficiência moral e intelectual; mantém dignidade e clareza sem soar como insulto coloquial.
- source_word: פותה
  choice: ingênuo
  rationale: Expressa a pessoa inexperiente e facilmente enganada, sentido característico do termo sapiencial hebraico.
- source_word: יוקש
  choice: fica preso
  rationale: Reproduz de modo idiomático a imagem passiva de ser apanhado numa armadilha.
- source_word: בו
  choice: nele
  rationale: Mantém a referência pronominal masculina a “tropeço” sem identificar explicitamente o objeto subentendido pelo contexto.
theological_decisions:
- issue: Divergência substancial entre o texto hebraico e o paralelo grego
  choice: Traduzir no texto principal o hebraico preservado e registrar o grego em nota.
  alternative: “Pois os sonhos desviaram muitos, e os que neles puseram a esperança caíram.”
  rationale: Como há texto hebraico preservado, ele serve de base principal. O grego apresenta uma linha materialmente diferente sobre sonhos, não uma simples variante lexical; por isso, a divergência é mantida de forma transparente em nota.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário sapiencial acessível. “Insensato” e “ingênuo” distinguem os dois termos hebraicos; a nota preserva a importante divergência textual.
