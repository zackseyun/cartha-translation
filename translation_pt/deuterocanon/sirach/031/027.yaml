translation:
  language: pt
  text: '[E, se insistirem para que você coma[a], retire-se do banquete,] e encontrará descanso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado diz: “[E, se insistirem para que você coma, retire-se do banquete,] e encontrará descanso.” O paralelo grego apresentado para este versículo diz, em vez disso: “e quem priva um trabalhador contratado do salário é alguém que derrama sangue”, o que indica uma grande divergência textual ou uma diferença no alinhamento dos versículos.'
    reason: textual_variant
lexical_decisions:
- source_word: ואם יפצירו בך
  choice: E, se insistirem
  rationale: O waw e a condição são preservados, enquanto יפצירו בך é expresso naturalmente como pressão insistente dirigida à pessoa.
- source_word: לאכול
  choice: para que você coma
  rationale: Representa diretamente o infinitivo de אכל em português corrente.
- source_word: סור
  choice: afaste-se
  rationale: O imperativo indica retirar-se ou desviar-se; “afaste-se” conserva essa nuance sem restringi-la ao simples ato físico de sair.
- source_word: מן הסבה
  choice: do banquete
  rationale: הסבה designa aqui a refeição em que os participantes se reclinam ou o grupo reunido à mesa; “banquete” comunica com clareza o cenário social.
- source_word: ותמצא נחת
  choice: e encontrará alívio
  rationale: נחת pode significar descanso, tranquilidade ou alívio; neste contexto, “alívio” expressa naturalmente o resultado de escapar à pressão social.
theological_decisions:
- issue: Cláusula hebraica entre colchetes e grande divergência em relação ao paralelo grego
  choice: Traduzir o hebraico preservado no texto principal, mantendo os colchetes e registrando a divergência grega em nota.
  alternative: 'Seguir o grego: “e quem priva um trabalhador contratado do salário é como quem derrama sangue”.'
  rationale: O testemunho hebraico é a fonte principal quando está disponível, mas a divergência substancial do grego precisa ser apresentada com transparência, pois pode refletir outra tradição textual ou um desalinhamento na numeração dos versículos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os colchetes do testemunho hebraico foram preservados, e a nota documenta a forte divergência textual sem tentar resolvê-la.
