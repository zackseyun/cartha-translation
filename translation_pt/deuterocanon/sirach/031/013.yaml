translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A imagem incomum da garganta foi mantida para preservar o caráter vívido do hebraico, mas recebe esclarecimento em nota. A ambiguidade de גדול também foi preservada no texto e explicada sem impor uma única leitura.
