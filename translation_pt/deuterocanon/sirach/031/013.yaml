  yaml_path: translation/deuterocanon/sirach/031/013.yaml
  text: My son[a], if you sit at a great table[b], do not open your throat over it.
translation:
  language: pt
  text: Meu filho, se você se sentar a uma grande mesa[a], não abra a garganta sobre ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Grande mesa” pode indicar uma mesa farta ou prestigiosa, e não apenas uma mesa de grandes dimensões.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “não abra a garganta sobre ela” é uma imagem que adverte contra a gula ou a avidez diante de uma mesa farta. O paralelo grego fornecido para este versículo não corresponde ao texto hebraico e parece estar associado a outra passagem; por isso, a tradução segue o testemunho hebraico.
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Meu filho
  rationale: Preserva o vocativo com sufixo de primeira pessoa e o tom paterno característico da literatura sapiencial.
- source_word: אם
  choice: se
  rationale: Mantém o valor condicional direto da partícula hebraica, sem transformar a situação em algo necessariamente esperado.
- source_word: על שלחן גדול
  choice: a uma grande mesa
  rationale: A construção com o verbo 'sentar-se' pede naturalmente 'a uma mesa'. 'Grande' conserva a amplitude de גדול, que pode sugerir tamanho, fartura ou importância social, sem limitar o sentido a apenas uma dessas ideias.
- source_word: ישבת
  choice: você se sentar
  rationale: Embora a forma hebraica seja formalmente perfeita, na oração condicional de instrução ela expressa uma situação geral; o futuro do subjuntivo é natural em português.
- source_word: אל תפתח
  choice: não escancare
  rationale: O imperativo negativo é preservado; 'escancare' comunica uma abertura excessiva e mantém a força concreta da imagem.
- source_word: גרנך
  choice: a garganta
  rationale: גרון designa literalmente a garganta. A tradução conserva a imagem corporal do idioma hebraico, enquanto a nota esclarece sua referência à voracidade.
