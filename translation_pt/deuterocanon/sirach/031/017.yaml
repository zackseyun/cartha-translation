  naturalness: “Estenda a mão para o lugar para onde ele olha” é claro e conserva a formulação concreta, ainda que algo literal, do hebraico. “Não meta a mão na travessa ao mesmo tempo que ele” é português moderno, natural e adequado ao contexto de mesa.
  terminology: “Travessa” é uma boa contextualização de בטנא como recipiente de servir. A nota sobre a tradição grega deve ser preservada, com o marcador ajustado após a remoção da nota indevida sobre a suposta negação.
