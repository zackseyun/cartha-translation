    rationale: Isso inverte indevidamente a prioridade textual. A nota deve ser removida em vez de conservar uma explicação que apoia uma emenda insegura.
  - severity: low
    issue: Os marcadores de nota precisam ser renumerados após a remoção da nota a.
    rationale: A única nota necessária é a referente à divergência substancial da tradição grega.
