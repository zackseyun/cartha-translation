base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/017.yaml
  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
translation:
  language: pt
  text: Estenda a mão para o lugar para onde ele olha e não meta a mão na travessa ao mesmo tempo que ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz aqui: “Feliz é a alma daquele que teme o Senhor”. O testemunho hebraico preservado na Genizá do Cairo apresenta, em vez disso, uma instrução sobre o comportamento à mesa; a tradição textual neste ponto é incerta.'
    reason: alternative_reading
lexical_decisions:
- source_word: מקום
  choice: lugar
  rationale: É o sentido comum do substantivo hebraico e, neste contexto de refeição, indica o lugar ou a porção para a qual o outro conviva dirige a atenção.
- source_word: יביט
  choice: para onde ele olha
  rationale: Traduz naturalmente o verbo ‘olhar’ e conserva a referência à direção da atenção do outro conviva.
- source_word: טל תושיט יד (provavelmente אל תושיט יד)
  choice: não estenda a mão
  rationale: A forma transmitida é problemática, mas o contexto e a provável leitura אל sustentam uma proibição. A formulação portuguesa mantém a imagem concreta do gesto à mesa.
- source_word: אל תחד
  choice: não meta a mão
  rationale: A forma verbal hebraica é textualmente difícil. No contexto, proíbe disputar ou alcançar simultaneamente a comida; a tradução expressa essa força prática sem atribuir ao verbo uma nuance excessivamente específica.
- source_word: עמו
  choice: ao mesmo tempo que ele
  rationale: Explicita em português natural a simultaneidade implícita em agir ‘com ele’ no recipiente comum.
- source_word: בטנא
  choice: na travessa
  rationale: Embora o substantivo possa designar um cesto ou recipiente, ‘travessa’ comunica com clareza o recipiente comum de servir no contexto da refeição.
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: não adotado no texto principal
  rationale: A tradição grega apresenta uma frase inteiramente diferente. Como há testemunho hebraico para esta passagem, ele orienta o texto principal, enquanto a leitura grega é registrada em nota.
theological_decisions:
- issue: Divergência entre as tradições hebraica e grega
  choice: Seguir no texto principal a instrução hebraica sobre o comportamento à mesa e registrar em nota a bênção da tradição grega.
  alternative: Feliz é a alma daquele que teme o Senhor.
  rationale: O hebraico sobrevivente tem prioridade para o texto de Ben Sira, mas a divergência é substancial e deve permanecer visível ao leitor.
- issue: Negação na primeira oração do testemunho hebraico
  choice: Traduzir a provável leitura אל como ‘não’.
  alternative: Estenda a mão para o lugar para onde ele olha.
  rationale: A sequência impressa טל é obscura, enquanto אל produz uma proibição coerente com a etiqueta da segunda oração. A incerteza textual é explicitada em nota, sem ocultar a possível leitura alternativa.
translation_notes:
  register: Português moderno, digno e direto, com vocabulário cotidiano de refeição. A expressão ‘ao mesmo tempo que ele’ torna inteligível a ação simultânea indicada pelo hebraico, e as notas preservam tanto a dificuldade interna do testemunho hebraico quanto a grande divergência da tradição grega.
