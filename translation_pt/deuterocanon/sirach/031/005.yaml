base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/005.yaml
  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: pt
  text: Quem corre atrás do ganho não ficará impune[b][a], e quem ama o lucro[c] se desviará por causa dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado traz um dito sobre buscar o ganho e amar o lucro. O paralelo grego deste versículo diz, em vez disso: “Adivinhações, presságios e sonhos são vãos, e o coração tem fantasias como o de uma mulher em trabalho de parto”. Isso parece refletir uma tradição textual substancialmente diferente.'
    reason: textual_variant
  - marker: b
    text: Ou “ouro” ou “riqueza”, em vez de “ganho”; o termo hebraico pode designar mais especificamente bens materiais.
    reason: lexical_alternative
  - marker: c
    text: Ou “preço” ou “pagamento”, em vez de “lucro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רודף
  choice: corre atrás
  rationale: O particípio expressa uma busca ativa e contínua. “Corre atrás” é natural em português e conserva a ideia moral de perseguir deliberadamente algo.
- source_word: חרוץ
  choice: ganho
  rationale: Neste contexto, o substantivo provavelmente indica ganho ou riqueza material, não necessariamente ouro literal. “Ganho” também mantém o paralelismo econômico com מחיר.
- source_word: לא ינקה
  choice: não ficará impune
  rationale: A expressão idiomática indica não escapar da punição ou não ser considerado inocente. Esta formulação comunica com clareza a consequência.
- source_word: אוהב
  choice: quem ama
  rationale: O particípio substantivado tem sentido genérico. “Quem ama” reproduz de modo natural a estrutura sapiencial.
- source_word: מחיר
  choice: lucro
  rationale: Embora o termo possa significar “preço” ou “pagamento”, aqui se refere provavelmente à vantagem financeira desejada. “Lucro” preserva esse sentido sem simplesmente repetir “ganho”.
- source_word: בו
  choice: por causa dele
  rationale: 'A preposição com sufixo é entendida em sentido causal ou instrumental: o lucro amado torna-se a causa ou o meio do desvio.'
- source_word: ישגה
  choice: se desviará
  rationale: O verbo descreve afastar-se do caminho correto ou cair em erro. “Se desviará” preserva tanto a dimensão moral quanto a prática, sem explicitar uma agência externa.
theological_decisions:
- issue: Preferência pelo hebraico diante do paralelo grego divergente
  choice: Traduzir o testemunho hebraico preservado, registrando em nota a leitura grega substancialmente diferente.
  alternative: 'Seguir o grego: “Adivinhações, presságios e sonhos são vãos, e o coração tem fantasias como o de uma mulher em trabalho de parto.”'
  rationale: Como há texto hebraico preservado, ele serve de fonte principal. A divergência grega não é uma variante menor, mas outro dito, e por isso deve ser documentada sem harmonização.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo conciso. “Corre atrás” oferece naturalidade brasileira sem perder inteligibilidade internacional; “não ficará impune” conserva o tom proverbial e judicial do hebraico.
