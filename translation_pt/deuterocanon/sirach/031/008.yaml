  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: pt
  text: Feliz o homem que se mostra íntegro[a] e que não se desviou em busca de riqueza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego difere substancialmente do hebraico preservado: «Sem falsidade, a lei será cumprida, e a sabedoria é perfeição numa boca fiel». Aqui, a tradução segue o hebraico.'
    reason: textual_variant
  - marker: b
    text: O hebraico da segunda oração é difícil. Também pode ser entendido como «não correu atrás da riqueza» ou «não foi desencaminhado pelo dinheiro».
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: Feliz
  rationale: Fórmula de bem-aventurança corrente na literatura sapiencial; em português, «Feliz» comunica naturalmente a condição afortunada declarada pelo texto, sem reduzi-la a uma emoção passageira.
- source_word: איש
  choice: o homem
  rationale: Mantém o masculino singular do hebraico e o estilo proverbial do enunciado.
- source_word: נמצא
  choice: é considerado
  rationale: Expressa de modo natural o sentido passivo e avaliativo de ser achado ou reconhecido como alguém de determinada qualidade.
- source_word: תמים
  choice: íntegro
  rationale: No contexto ético, indica inteireza moral e conduta irrepreensível, não perfeição absoluta.
- source_word: ממון
  choice: riqueza
  rationale: Abrange dinheiro e bens materiais, preservando o alcance amplo do termo.
- source_word: לא נלוז
  choice: não se desviou
  rationale: Conserva a imagem de afastamento do caminho correto e sua dimensão moral.
- source_word: ויחר
  choice: por causa de
  rationale: A forma transmitida é difícil. Esta opção apresenta em português a provável relação entre o desvio negado e a riqueza, sem reconstruir detalhes além da evidência contextual.
theological_decisions:
- issue: Relação entre a integridade do homem e a riqueza na segunda oração hebraica
  choice: «não se desviou por causa da riqueza»
  alternative: «não correu atrás da riqueza»; «não foi desencaminhado pelo dinheiro»
  rationale: O hebraico transmitido é difícil, mas contém claramente «riqueza» e uma negação do ato de desviar-se. A tradução mantém esse núcleo e deixa em nota as relações causativa e direcional possíveis, sem impor uma doutrina sobre a posse de bens.
- issue: Divergência substancial do paralelo grego
  choice: Seguir o hebraico preservado e registrar a variante em nota
  alternative: 'Traduzir o grego: «Sem falsidade, a lei será cumprida, e a sabedoria alcança a plenitude numa boca fiel»'
  rationale: A fonte hebraica é o testemunho principal fornecido e tem conteúdo inteligível em seus elementos centrais; a redação grega, porém, é tão diferente que deve ser reconhecida como variante textual, não harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com fluência brasileira e compreensão internacional. «Feliz» preserva o tom sapiencial; «íntegro» evita sugerir perfeição sem pecado. As notas distinguem a grande variante grega da incerteza interna da oração hebraica.
