  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: pt
  text: Mesmo que você esteja sentado entre muitos[b], não estenda a mão antes do seu companheiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não pegue a comida antes de outra pessoa à mesa.
    reason: cultural_note
  - marker: b
    text: O paralelo grego difere muito e traz uma linha sobre “as zombarias dos ímpios” não alcançarem favor. Aqui se segue o testemunho hebraico, mantendo o grego em vista como variante divergente.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Mesmo que
  rationale: Expressa de modo natural em português a circunstância concessiva do hebraico.
- source_word: בין רבים
  choice: entre muitos
  rationale: Mantém a formulação ampla do hebraico sem especificar além do texto um banquete ou uma multidão.
- source_word: ישבת
  choice: você esteja sentado
  rationale: O perfeito hebraico tem força geral numa condição; o presente do subjuntivo é idiomático depois de “mesmo que”.
- source_word: לפני
  choice: antes de
  rationale: No contexto, indica precedência na ação, não apenas posição espacial.
- source_word: רע
  choice: seu companheiro
  rationale: Aqui designa outro conviva ou associado; “companheiro” preserva o sentido social sem restringi-lo a um vizinho.
- source_word: אל תושיט יד
  choice: não estenda a mão
  rationale: Reproduz naturalmente a imagem concreta da etiqueta à mesa, sem explicitar no corpo do texto aquilo que permanece implícito.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego
  choice: Seguir o hebraico no texto principal
  alternative: 'Traduzir o grego: “e as zombarias dos ímpios não obtêm favor”'
  rationale: O testemunho hebraico fornecido tem alta confiança e constitui a fonte primária solicitada; o grego apresenta uma linha substancialmente diferente e é registrado em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que a nota textual acompanhe a situação inicial e a nota cultural explique a ação final.
