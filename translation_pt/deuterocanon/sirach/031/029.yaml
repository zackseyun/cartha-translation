  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: pt
  text: Mesmo que você seja pressionado[b], espere com paciência pelos pratos saborosos, e isso lhe trará descanso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Um ora e outro amaldiçoa; a voz de qual deles o Soberano ouvirá?” Ele representa uma tradição textual substancialmente diferente do hebraico preservado aqui.'
    reason: alternative_reading
  - marker: b
    text: O hebraico deste versículo é incerto e difere radicalmente do testemunho grego. “Você seja pressionado” traduz uma forma difícil que também pode significar “você seja compelido” ou “você seja forçado”.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Mesmo que
  rationale: Expressa de modo natural em português a força concessiva da combinação hebraica, sem perder a ideia condicional.
- source_word: נאנסתה
  choice: você seja pressionado
  rationale: O verbo deriva de אנס e aqui sugere compulsão ou pressão. “Pressionado” preserva a amplitude do termo sem introduzir o sentido sexual possível em outros contextos.
- source_word: במטעמים
  choice: pelos pratos saborosos
  rationale: מטעמים designa comidas apetitosas ou especiais. A expressão é clara, atual e adequada ao contexto de refeição.
- source_word: קוה קוה
  choice: espere com paciência
  rationale: A repetição hebraica intensifica ou prolonga a espera; em português natural, “com paciência” comunica essa persistência sem reproduzir uma repetição pouco idiomática.
- source_word: וינוח לך
  choice: e isso lhe trará descanso
  rationale: Comunica o resultado benéfico expresso por נוח e o dativo לך, embora a sintaxe hebraica permaneça difícil.
theological_decisions:
- issue: Divergência substancial entre o texto hebraico e o paralelo grego
  choice: Traduzir no texto principal o hebraico preservado e registrar o grego em nota.
  alternative: “Um ora e outro amaldiçoa; a voz de qual deles o Senhor ouvirá?”
  rationale: Como o versículo sobrevive em hebraico, esse testemunho orienta o texto principal. A tradição grega, porém, apresenta um conteúdo completamente diferente e precisa ser preservada para transparência textual, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a estranheza textual por meio das notas, mas mantém o corpo do versículo fluente. Todos os marcadores de nota aparecem no texto principal.
