review_pass:
  verdict: revise
  source_fidelity: O texto hebraico fornecido para o v. 2 começa com רֵעַ («amigo»), não com «mau», e deve ter precedência como testemunho hebraico existente. A redação portuguesa atual traduz exclusivamente o paralelo grego, que apresenta uma sentença inteiramente diversa. A leitura de תניד é algo incerta, mas «afastará» representa de modo prudente a ideia de remover/afastar a desonra.
  naturalness: 'A formulação proposta é clara, atual e digna em português internacional: «amigo fiel», «afastará a desonra» e «guardar um segredo» são naturais. «Como a própria alma» preserva a imagem hebraica sem introduzir interpretação confessional.'
  terminology: «Amigo fiel» traduz רֵעַ נֶאֱמָן; «desonra» reproduz חרפה com registro apropriado; «alma» mantém נפש no símile final. O paralelo grego sobre sonhos deve ser preservado em nota como variante textual, não adotado no texto principal quando há hebraico para este versículo.
  issues:
  - severity: high
    issue: O texto principal segue o grego apesar de o hebraico fornecido conter uma leitura para Sirácida 31:2.
    rationale: A diretriz do projeto requer traduzir Sirácida do hebraico onde ele sobrevive. A divergência é real e deve ser explicitada em nota, mas não justifica substituir silenciosamente o texto hebraico por uma sentença grega não correspondente.
  - severity: high
    issue: A nota a interpreta רֵעַ («amigo») como «um fiel perverso» e apresenta essa interpretação como a leitura hebraica.
    rationale: No contexto e na grafia fornecida, רֵעַ é «amigo»; «fiel perverso» é uma análise lexical inadequada e produz uma frase semanticamente improvável.
  - severity: medium
    issue: A nota lexical sobre ἐπέχων deixa de ter âncora no texto principal quando este é corrigido para o hebraico.
    rationale: A alternativa grega pode ser registrada na nota de variante, mas não deve subsistir como nota lexical autônoma ligada a palavras ausentes do texto principal.
  revised_text: Um amigo fiel afastará a desonra, e quem guarda um segredo é amigo como a própria alma.[a]
  revised_footnotes:
  - marker: a
    text: 'O paralelo grego nesta referência traz uma sentença muito diferente: «Como quem tenta agarrar uma sombra e persegue o vento, assim é quem se apega aos sonhos.» A divergência pode refletir deslocamento de versículo ou tradições textuais distintas; o texto principal segue o testemunho hebraico preservado.'
    reason: textual_variant
  revision_rationale: A revisão restaura o hebraico como base do texto principal, conforme a prioridade da fonte sobrevivente. Ela corrige a leitura de רֵעַ para «amigo», mantém a concisão e o paralelismo da frase hebraica e documenta honestamente, em nota, o paralelo grego radicalmente divergente. A incerteza lexical de תניד é tratada com a opção moderada «afastará», sem sobrecarregar o versículo.
