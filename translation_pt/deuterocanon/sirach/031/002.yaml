translation:
  language: pt
  text: Como quem tenta agarrar uma sombra e persegue o vento, assim é quem se apega aos sonhos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado e associado aqui na edição de Kahana apresenta uma frase muito diferente: «Um fiel perverso suscitará desonra, e quem guarda um segredo é amigo como a própria alma». Como os textos hebraico e grego não coincidem nesta referência, o texto principal segue o testemunho grego para 31:2.'
    reason: textual_variant
  - marker: b
    text: 'Ou: «quem dá atenção aos sonhos» ou «quem se prende aos sonhos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: tenta agarrar
  rationale: Expressa a tentativa de apanhar algo inalcançável, sem sugerir que a ação tenha êxito.
- source_word: σκιᾶς
  choice: uma sombra
  rationale: É o sentido direto e preserva a imagem de algo impalpável.
- source_word: διώκων
  choice: persegue
  rationale: Mantém o caráter ativo e contínuo da perseguição em registro digno e natural.
- source_word: ἄνεμον
  choice: o vento
  rationale: Preserva a imagem proverbial de perseguir algo que não se pode capturar.
- source_word: ὁ ἐπέχων
  choice: quem se apega a
  rationale: O verbo pode indicar manter-se ligado a algo ou dar-lhe atenção; no contexto da comparação, «se apega a» comunica dependência insistente sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: ἐνυπνίοις
  choice: aos sonhos
  rationale: Traduz de modo claro o plural referente a sonhos ou visões durante o sono.
theological_decisions:
- issue: Escolha da fonte principal diante da grande divergência entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal a comparação grega sobre agarrar uma sombra e perseguir o vento.
  alternative: 'O testemunho hebraico associado neste ponto traz: «Um fiel perverso suscitará desonra, e quem guarda um segredo é amigo como a própria alma».'
  rationale: O hebraico fornecido não corresponde ao conteúdo de Sirácida 31:2 na numeração grega e provavelmente reflete deslocamento de versículo ou tradição textual divergente. Assim, o grego é a base defensável para esta referência, enquanto a leitura hebraica é preservada explicitamente em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A formulação conserva o paralelismo da comparação grega e sinaliza de modo transparente tanto a divergência textual quanto a amplitude semântica de ἐπέχω.
