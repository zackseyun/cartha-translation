  source_fidelity: 'A tradução segue corretamente o hebraico: רבים היו חבולי זהב, והבוטח על פנינים; ולא מצאו להנצל מרעה, וגם להושע ביום עברה. Contudo, a construção portuguesa atual torna a segunda oração causal de modo excessivamente explícito e perde a transição hebraica para o singular («o que confia»).'
  naturalness: O texto é claro e fluente, mas «por confiarem em pérolas» pode sugerir que todos os muitos arruinados confiavam nelas e obscurece o paralelismo com «Muitos foram arruinados pelo ouro». «Não encontraram como escapar» é natural, porém «não encontraram livramento» reproduz melhor a formulação concisa e solene do versículo.
  terminology: «Ouro», «pérolas», «mal» e «dia da ira» são adequados. «Ser salvos» é possível, mas «ser libertos» evita uma conotação soteriológica posterior e corresponde bem ao sentido de resgate no paralelismo. A nota sobre פנינים preserva adequadamente a incerteza lexical; a nota textual grega deve indicar que «isso» e «essas coisas» têm referentes contextualmente incertos, sem os identificar.
  issues:
  - severity: medium
    issue: A expressão «por confiarem em pérolas» regulariza demais o singular participial hebraico.
    rationale: הבוטח é literalmente «o que confia». Uma tradução com «e os que confiam em pérolas» conserva melhor a construção e o paralelismo, sem sacrificar a legibilidade.
  - severity: low
    issue: «Ser salvos» pode soar mais teologicamente específico do que o hebraico exige.
    rationale: להושע denota ser socorrido, resgatado ou liberto. «Ser libertos» mantém o sentido no contexto de perigo e juízo sem estreitar seu alcance.
  - severity: low
    issue: A nota grega traduz «ἐπισκοπῇ» por «visitação» sem explicitar seu valor de juízo.
    rationale: «Em uma visitação» é defensável, mas «numa visitação de juízo» comunica melhor o provável sentido contextual, mantendo a formulação como variante e não como harmonização.
