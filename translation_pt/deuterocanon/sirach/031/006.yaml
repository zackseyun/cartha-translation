base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
translation:
  language: pt
  text: Muitos foram arruinados pelo ouro, e os que confiam em pérolas[a] não encontraram livramento do mal[b], nem foram libertos no dia da ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico פנינים pode significar “pérolas” ou, de modo mais amplo, pedras preciosas, gemas ou joias valiosas.
    reason: lexical_alternative
  - marker: b
    text: 'A testemunha grega difere substancialmente neste ponto: “A menos que isso seja enviado pelo Altíssimo numa visitação de juízo, não entregues a elas o teu coração.” Os referentes de “isso” e “elas” não são explicitados nesta frase grega. O texto hebraico seguido na tradução principal adverte, em vez disso, que a confiança nas riquezas não traz livramento do mal nem no dia da ira.'
    reason: textual_variant
lexical_decisions:
- source_word: חבולי
  choice: foram arruinados
  rationale: O particípio descreve pessoas feridas, prejudicadas ou levadas à ruína pelo ouro. Em português, “foram arruinados” comunica com naturalidade a queda prática e moral indicada pelo contexto.
- source_word: זהב
  choice: ouro
  rationale: Equivalente direto; no contexto, representa a riqueza em forma de metal precioso.
- source_word: הבוטח
  choice: por confiarem
  rationale: O hebraico passa de uma declaração plural a uma expressão participial singular. A formulação portuguesa regulariza a sintaxe e explicita a confiança nas riquezas como causa da ruína, sem alterar o sentido básico.
- source_word: פנינים
  choice: pérolas
  rationale: “Pérolas” é uma tradução tradicional e defensável, embora o termo possa abranger pedras preciosas ou joias de grande valor; a amplitude lexical é registrada em nota.
- source_word: להנצל
  choice: escapar
  rationale: O infinitivo expressa livramento ou fuga de um perigo. “Não encontraram como escapar” reproduz de modo idiomático a construção hebraica com “encontrar”.
- source_word: מרעה
  choice: do mal
  rationale: O substantivo pode designar tanto o mal em sentido amplo quanto dano, desgraça ou calamidade. “Mal” preserva essa amplitude sem resolver indevidamente a ambiguidade.
- source_word: להושע
  choice: ser salvos
  rationale: O verbo pertence ao campo semântico de salvar, livrar e socorrer. “Ser salvos” é natural em português e mantém a força do resgate no contexto de juízo.
- source_word: ביום עברה
  choice: no dia da ira
  rationale: A expressão aponta para um tempo de ira e juízo. “Dia da ira” preserva sua gravidade e sua ressonância bíblica.
theological_decisions:
- issue: Escolha da fonte principal diante da grande divergência entre o hebraico e o grego
  choice: Seguir no texto principal o hebraico preservado e registrar a leitura grega em nota textual.
  alternative: 'Traduzir o grego: “A menos que isso seja enviado pelo Altíssimo em visitação, não entregue a essas coisas o seu coração.”'
  rationale: Como o texto hebraico está preservado neste ponto, ele fundamenta a tradução principal. A testemunha grega diverge substancialmente e, por isso, é documentada sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe hebraica abrupta, que muda do plural para o singular, foi suavizada em português sem ocultar a relação entre confiança na riqueza e ruína. A ambiguidade de מרעה foi preservada por “mal”, e a grande variante grega foi indicada em nota.
