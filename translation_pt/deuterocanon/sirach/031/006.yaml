- from: Muitos foram arruinados pelo ouro e por confiarem em pérolas[a]; não encontraram como escapar do mal[b], nem como ser salvos no dia da ira.
  to: Muitos foram arruinados pelo ouro, e os que confiam em pérolas[a] não encontraram livramento do mal[b], nem foram libertos no dia da ira.
  rationale: A revisão conserva o hebraico como texto-base, mantém a ambiguidade de פנינים em nota e documenta honestamente a grande divergência grega. Ela recupera a mudança hebraica do plural para «os que confiam», evita tornar a relação causal mais rígida do que o texto exige e emprega «libertamento/libertos» no campo semântico de livramento, sem carregar «salvos» de associações doutrinais posteriores.
