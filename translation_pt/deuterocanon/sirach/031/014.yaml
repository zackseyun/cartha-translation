  text: 'Não diga: “Já basta para ele”; lembre-se de que um olho mau[a] é mau.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “olho mau” costuma indicar uma disposição mesquinha, invejosa ou que dá de má vontade.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego fornecido para esta referência diz: “O espírito dos que temem o Senhor viverá”. Ele não corresponde ao texto hebraico aqui e provavelmente reflete outro alinhamento textual ou outra numeração de versículos.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: Não diga
  rationale: Preserva diretamente o imperativo negativo hebraico e o tom de advertência.
- source_word: ספוק עליו
  choice: Para ele, já basta
  rationale: Expressa de modo natural em português a ideia de suficiência aplicada à pessoa indicada pelo sufixo masculino singular, sem explicitar além do hebraico o que lhe estaria sendo negado.
- source_word: זכור
  choice: lembre-se
  rationale: Mantém o imperativo e soa natural no português atual.
- source_word: רעה עין רעה
  choice: um olho mau é mau
  rationale: Conserva tanto a imagem concreta do idioma hebraico quanto a repetição proverbial de רעה, deixando sua extensão semântica para a nota.
theological_decisions:
- issue: Sentido da expressão hebraica “olho mau”
  choice: Manter “olho mau” no texto principal
  alternative: pessoa mesquinha; atitude invejosa; olhar rancoroso
  rationale: A formulação concreta pode indicar mesquinhez, má vontade ou inveja. Preservá-la evita reduzir indevidamente a ambiguidade do idioma bíblico.
- issue: Divergência entre o hebraico e o paralelo grego fornecido
  choice: Traduzir o hebraico preservado e registrar a divergência em nota
  alternative: 'Seguir o grego: “O espírito dos que temem o Senhor viverá”'
  rationale: O texto hebraico existente é a fonte primária indicada para esta tradução; o grego não corresponde a esta linha e provavelmente reflete outro alinhamento textual ou outra numeração de versículos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta usa uma formulação idiomática, enquanto a segunda oração conserva deliberadamente a concisão e a repetição do provérbio hebraico.
