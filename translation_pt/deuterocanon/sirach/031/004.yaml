  text: A poor man labors until his strength is spent, and if he rests, he is still in need.
translation:
  language: pt
  text: O pobre trabalha até esgotar as forças; e, se descansar, continuará necessitado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os manuscritos hebraicos preservam duas leituras deste versículo. Uma diz: “O pobre se afadiga por causa da carência de sua casa; se descansar, ficará necessitado.” A outra diz: “O pobre se afadiga até lhe faltarem as forças; se descansar, não há descanso para ele.” O texto grego transmitido sob esta referência é inteiramente diferente: “Do impuro, o que poderá ser purificado? E do falso, o que poderá tornar-se verdadeiro?”'
    reason: Registra a variação substancial entre as leituras hebraicas, esclarece a combinação refletida no texto principal e assinala a divergência do paralelo grego.
lexical_decisions:
- source_word: עמל עני
  choice: O pobre trabalha
  rationale: עמל descreve trabalho árduo ou penoso. “Trabalha” conserva clareza e dignidade, enquanto o contexto comunica o esforço extenuante.
- source_word: לחסר כחו
  choice: até esgotar suas forças
  rationale: A construção expressa o desgaste ou a diminuição da força do pobre; em português, “até esgotar suas forças” transmite naturalmente o resultado do trabalho incessante.
- source_word: ואם ינוח
  choice: se descansa
  rationale: Mantém diretamente a condição expressa pelo hebraico sem acrescentar motivo ou avaliação moral.
- source_word: יהיה צריך
  choice: continua passando necessidade
  rationale: צריך, neste contexto, indica estar necessitado. “Continua” explicita a persistência da necessidade implícita no contraste entre trabalhar e descansar.
theological_decisions:
- issue: Relação entre pobreza, trabalho e descanso
  choice: Preservar a observação sapiencial de que o pobre permanece necessitado mesmo quando descansa
  alternative: Apresentar a pobreza como consequência moral da ociosidade
  rationale: O hebraico não formula uma censura moral nem atribui culpa ao pobre; descreve a tensão entre exaustão e necessidade contínua.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação evita tom arcaico e não transforma a descrição da precariedade econômica em juízo moral.
