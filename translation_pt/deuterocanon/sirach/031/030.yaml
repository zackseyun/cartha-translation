translation:
  language: pt
  text: Escute, meu filho, e não me despreze; no fim, você compreenderá as minhas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego fornecido para este versículo traz um dito completamente diferente: “Quem se lava depois de tocar num morto e torna a tocá-lo, que proveito tirou do seu banho?” Isso parece refletir um grande desalinhamento de versículos ou uma divergência de tradição textual. O texto principal segue a testemunha hebraica preservada.'
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: Escute
  rationale: O imperativo pede recepção atenta. “Escute” é natural e direto, sem acrescentar o sentido mais específico de “obedeça”.
- source_word: בני
  choice: meu filho
  rationale: O hebraico traz um vocativo masculino singular explícito, preservado naturalmente em português.
- source_word: תבוז
  choice: não me despreze
  rationale: בזה expressa tratar alguém com desprezo; esta tradução conserva a força da advertência.
- source_word: ובאחרית
  choice: no fim
  rationale: 'Mantém de forma idiomática o sentido temporal e resultativo de אחרית: a compreensão virá como desfecho.'
- source_word: תשיג
  choice: você compreenderá
  rationale: נשׂג significa alcançar ou atingir; com “minhas palavras”, o sentido contextual é chegar a compreendê-las. “Compreenderá” soa mais natural em português, embora torne menos explícita a metáfora de alcançar.
- source_word: אמרי
  choice: as minhas palavras
  rationale: Tradução direta e digna de אמרי, adequada ao tom de instrução sapiencial.
theological_decisions:
- issue: Divergência completa entre a testemunha hebraica e o paralelo grego fornecido
  choice: Seguir no texto principal o hebraico preservado de Ben Sira e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Quem se lava depois de tocar num morto e torna a tocá-lo, que proveito tirou do seu banho?”'
  rationale: Quando o hebraico de Sirácida está preservado, ele tem prioridade como fonte. O grego aqui não oferece apenas uma variante menor, mas um dito inteiramente diferente, provavelmente devido a desalinhamento de versículos ou a uma tradição textual distinta; a nota mantém essa divergência transparente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” evita construções excessivamente solenes; “Escute” conserva o tom direto da exortação. O ponto e vírgula reproduz a progressão entre a ordem e seu resultado futuro.
