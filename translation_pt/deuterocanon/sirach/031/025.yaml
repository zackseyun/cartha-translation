review_pass:
  verdict: revise
  source_fidelity: O texto principal capta de modo plausível a leitura contextual de שנות como «sono» e preserva em nota a alternativa «anos de vida». «Estômago moderado» transmite adequadamente קרב תולל, e «vigor» é uma explicitação possível de ונפשו אתו. Contudo, a formulação portuguesa deixa «ele» com antecedente gramatical imediato em «estômago», criando uma ambiguidade sintática evitável.
  naturalness: A construção proverbial é clara e contemporânea. A substituição de «ele» por «a pessoa» elimina a leitura involuntária de que o estômago se levanta, sem alterar o sujeito humano implícito no hebraico.
  terminology: «Sono saudável», «estômago moderado» e «vigor» são escolhas sóbrias e não doutrinárias. As notas preservam a ambiguidade de שנות e o alcance de נפש.
  issues:
  - severity: low
    issue: Antecedente ambíguo de «ele»
    rationale: Em «vem de um estômago moderado; ele se levanta», o antecedente gramatical mais próximo de «ele» é «estômago». O hebraico tem um sujeito humano masculino implícito; «a pessoa» o torna inequívoco em português.
