  text: Years of life come from a sound stomach; one rises in the morning, and his life is with him.
translation:
  language: pt
  text: O sono saudável vem de um estômago moderado[a]; a pessoa se levanta pela manhã, e seu vigor está com ela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico sem vogais também pode ser lido: “Anos de vida vêm de um estômago moderado”.'
    reason: Preserva a ambiguidade gráfica de שנות entre uma leitura ligada a “sono” e a leitura “anos de”.
  - marker: b
    text: 'Literalmente: “e sua vida — ou alma — está com ele”.'
    reason: Expõe a formulação hebraica e a amplitude semântica de נפש, traduzida no texto como vitalidade ou vigor.
lexical_decisions:
- source_word: שנות חיים
  choice: sono saudável
  rationale: No contexto da alimentação e do despertar pela manhã, שנות é entendido como forma relacionada a “sono”, e חיים comunica saúde ou vitalidade. A escrita hebraica sem vogais também permite ler שנות como “anos de”, razão pela qual a ambiguidade é registrada em nota.
- source_word: קרב תולל
  choice: estômago moderado
  rationale: קרב designa aqui o interior ou estômago; תולל caracteriza um estômago contido, regulado ou moderado, em contraste com o excesso alimentar.
- source_word: ונפשו אתו
  choice: e seu vigor está com ele
  rationale: A expressão literal “e sua vida/alma está com ele” indica que a pessoa desperta com vitalidade e plena disposição. “Vigor” preserva o sentido concreto sem introduzir uma interpretação doutrinária de “alma”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial. “Estômago moderado” mantém a ênfase na moderação alimentar; as notas preservam as ambiguidades reais do hebraico.
