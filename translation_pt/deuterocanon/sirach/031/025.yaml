review_pass:
  verdict: revise
  source_fidelity: O texto hebraico fornecido lê primariamente שנות חיים, «anos de vida», e não «sono saudável». Embora o contexto e tradições textuais paralelas possam favorecer uma leitura relacionada a sono, essa leitura não deve substituir sem qualificação a leitura do texto-base; a nota atual inverte indevidamente a relação entre leitura principal e alternativa.
  naturalness: A redação é fluente e proverbial, mas «O sono saudável vem de» e «seu vigor está com ele» se afastam do texto-base mais do que o necessário. «Anos de vida vêm de um estômago moderado» é natural em português e preserva a concisão proverbial.
  terminology: «Estômago moderado» é compreensível, embora a moderação descreva por metonímia a alimentação ou o apetite. «Vida» é a opção mais fiel para נפש neste paralelismo; uma nota pode registrar «alma» e a possível nuance de vitalidade sem impor uma leitura técnica.
  issues:
  - severity: high
    issue: A tradução principal escolhe «sono saudável» para שנות חיים.
    rationale: No hebraico apresentado, שנות חיים tem como leitura direta «anos de vida». A possibilidade contextual de uma leitura ligada a «sono» deve ser anotada, não promovida ao texto sem que o texto-base a sustente inequivocamente.
  - severity: medium
    issue: A nota a apresenta «anos de vida» como mera alternativa de um hebraico sem vogais.
    rationale: 'Isso é enganoso para a forma consonantal fornecida: «anos de vida» é a leitura primária de שנות חיים. A nota deve apresentar a leitura «sono» como possibilidade interpretativa ou textual, se for mantida.'
  - severity: medium
    issue: «Seu vigor» traduz נפשו de modo interpretativo.
    rationale: A expressão hebraica diz literalmente que sua vida/alma está com ele. «Sua vida está com ele» preserva a formulação e permite que a nota explique a nuance de vitalidade.
  revised_text: Anos de vida vêm de um estômago moderado[a]; ele se levanta pela manhã, e sua vida está com ele[b].
  revised_footnotes:
  - marker: a
    text: O hebraico lê literalmente «anos de vida». No contexto, alguns entendem uma leitura relacionada a «sono», isto é, sono revigorante, mas essa leitura é incerta.
    reason: Mantém no texto a leitura primária da forma hebraica fornecida e registra, sem inverter a evidência, a possibilidade contextual que motivou a tradução anterior.
  - marker: b
    text: 'Literalmente: «e sua alma/vida está com ele». A expressão pode indicar que ele desperta com vitalidade.'
    reason: Preserva a amplitude de נפש e distingue a tradução literal da explicação idiomática.
  revision_rationale: A revisão restaura no texto principal a leitura diretamente indicada pelo hebraico fornecido («anos de vida») e conserva em nota, de maneira cautelosa, a possibilidade de uma leitura contextual ligada ao sono. Também substitui a paráfrase «vigor» pela formulação mais próxima de נפש, sem perder a explicação de sua possível nuance.
