base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/031.yaml
  text: Listen, my son, and accept my words; do not reject me, and in the end you will find my words.
translation:
  language: pt
  text: Escute, meu filho, e acolha minhas palavras; não zombe de mim e, no fim, encontrará minhas palavras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שמע
  choice: Escute
  rationale: Imperativo direto e natural, que preserva o chamado à atenção e à obediência implícito no hebraico.
- source_word: וקח אמרי
  choice: e acolha minhas palavras
  rationale: לקח significa literalmente 'tomar', mas neste contexto exortativo 'acolher' comunica naturalmente a ideia de receber e aceitar o ensinamento.
- source_word: ואל תלעיז עליי
  choice: não fale mal de mim
  rationale: O verbo לעז pode indicar falar contra alguém, difamar ou desacreditar. A formulação evita o sentido menos provável de simples rejeição e preserva o componente verbal da expressão.
- source_word: ובאחרית
  choice: e no fim
  rationale: Mantém a expressão temporal aberta do hebraico, sem especificar se se trata do fim da experiência, da vida ou do resultado final.
- source_word: תמצא דברי
  choice: você compreenderá o que eu disse
  rationale: Embora literalmente seja 'encontrará minhas palavras', a expressão aponta para descobrir ou constatar o sentido e a verdade delas. Esta formulação produz português claro sem repetir artificialmente 'palavras'.
theological_decisions:
- issue: Relação com o paralelo grego fornecido
  choice: Traduzir o texto hebraico atestado para este versículo
  alternative: Seguir o grego, que trata de jejum, repetição do pecado e oração não atendida
  rationale: Há uma divergência textual e de numeração total entre as fontes. Como o hebraico tem alta confiança e é a fonte principal indicada, sua leitura deve reger a tradução; o conteúdo grego não pode ser harmonizado sem substituir integralmente o versículo.
- issue: Sentido escatológico ou temporal de באחרית
  choice: Manter 'no fim' sem explicitação
  alternative: Traduzir como 'no fim da vida' ou 'por fim'
  rationale: O hebraico não define o referente exato. A tradução preserva essa abertura e não impõe uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com uso de 'você' para ampla legibilidade brasileira. A tradução segue prioritariamente o hebraico, pois o paralelo grego fornecido apresenta conteúdo inteiramente diferente. Não há marcadores de nota no texto porque nenhuma nota de publicação foi incluída.
