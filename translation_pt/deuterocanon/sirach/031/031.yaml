review_pass:
  verdict: revise
  source_fidelity: 'O hebraico diz literalmente: “Ouve, meu filho, e recebe as minhas palavras; não zombes de mim, e no fim encontrarás as minhas palavras.” O rascunho acerta a exortação inicial e mantém a abertura temporal de ובאחרית, mas enfraquece/altera dois pontos: תלעיז עליי é mais especificamente “zombar/escarnecer de mim” do que simplesmente “falar mal de mim”, e תמצא דברי preserva a imagem de “encontrar minhas palavras”, não apenas “compreender o que eu disse”. O paralelo grego fornecido contém matéria inteiramente distinta e não deve substituir ou harmonizar o hebraico atestado.'
  naturalness: A redação proposta é natural em português moderno de ampla compreensão, com formas de tratamento coerentes com a legibilidade brasileira. “Zombar de mim” é claro, adequado ao registro sapiencial e mais exato que “falar mal de mim”.
  terminology: “Acolha minhas palavras” comunica bem וקח אמרי no contexto. “Não zombe de mim” traduz o componente de escárnio de לעז. “Encontrará minhas palavras” conserva a formulação e a repetição deliberada de אמרי/dברי, sem impor a interpretação de que se trata exclusivamente de entendimento intelectual.
  issues:
  - severity: medium
    issue: “não fale mal de mim” é impreciso para ואל תלעיז עליי.
    rationale: לעז, neste contexto, expressa zombaria, escárnio ou ridicularização. “Falar mal” pode indicar difamação ou crítica e perde esse matiz.
  - severity: medium
    issue: “você compreenderá o que eu disse” substitui “encontrará minhas palavras”.
    rationale: A interpretação é possível como efeito contextual, mas o hebraico conserva a expressão concreta “encontrar minhas palavras” e repete “palavras”; a reformulação reduz essa ambiguidade e a repetição textual.
  revised_text: Escute, meu filho, e acolha minhas palavras; não zombe de mim e, no fim, encontrará minhas palavras.
