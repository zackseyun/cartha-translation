  text: Be the first to stop[a], for the sake of good manners, and do not be a glutton[b], lest you be despised.
translation:
  language: pt
  text: Sê o primeiro a parar, por uma questão de boas maneiras[a]. Não sejas guloso, para não seres desprezado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica מוסר geralmente significa “disciplina” ou “instrução”; neste contexto de comportamento à mesa, provavelmente se refere à boa conduta ou às boas maneiras.
    reason: lexical_alternative
  - marker: b
    text: 'O texto hebraico deste versículo está preservado, mas os dados fornecidos apresentam uma incompatibilidade entre as fontes: o paralelo grego citado não corresponde a esta frase hebraica. A tradução segue, portanto, o testemunho hebraico como texto principal.'
    reason: textual_variant
lexical_decisions:
- source_word: חדל ראשון
  choice: Sê o primeiro a parar
  rationale: O imperativo חדל pede que se interrompa a ação, e ראשון indica fazê-lo antes dos demais; no contexto, trata-se de parar de comer.
- source_word: בעבור מוסר
  choice: por uma questão de boas maneiras
  rationale: בעבור expressa motivo ou propósito. Embora מוסר costume significar “disciplina” ou “instrução”, à mesa designa aqui conduta apropriada e autocontrole social.
- source_word: גרגרן
  choice: guloso
  rationale: Designa quem come com avidez. “Guloso” é natural em português e conserva a censura moral do termo hebraico.
- source_word: פן תמאס
  choice: para não seres desprezado
  rationale: 'פן introduz a consequência que se deseja evitar, e תמאס é entendido passivamente: a gula levaria à rejeição ou ao desprezo por parte dos outros.'
