translation_notes:
  register: Português atual, digno e acessível, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A forma “Sê” mantém a exortação direta do singular hebraico; “boas maneiras” comunica naturalmente o sentido contextual de מוסר sem apagar sua acepção mais ampla, registrada em nota.
