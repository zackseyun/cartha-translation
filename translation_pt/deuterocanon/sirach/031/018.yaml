translation:
  language: pt
  text: Compreenda o seu próximo como a si mesmo[a][b] e reflita sobre tudo o que você odeia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego difere substancialmente do hebraico e diz aproximadamente: “A quem ele se atém? E quem é o seu apoio?”. Esta tradução segue o testemunho hebraico preservado, adotado aqui como fonte principal.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “como à sua própria pessoa” ou “como à sua própria vida”. A palavra hebraica נפש pode significar “alma”, “vida” ou a própria pessoa.'
    reason: lexical_alternative
  - marker: c
    text: 'A oração final também pode ser entendida como: “e considere cuidadosamente tudo o que você odeia”, formulando um critério ético baseado no que a própria pessoa não desejaria para si.'
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  choice: Conheça
  rationale: O imperativo de ידע expressa conhecimento atento e reconhecimento pessoal. “Conheça” mantém o verbo distinto de “amar” e evita harmonizar o texto com uma fórmula bíblica mais conhecida.
- source_word: רעך
  choice: o seu próximo
  rationale: רע designa outra pessoa dentro da esfera social. “Próximo” preserva a ressonância ética bíblica sem limitar o sentido a quem mora perto.
- source_word: כנפשך
  choice: como a si mesmo
  rationale: נפש pode indicar alma, vida ou a própria pessoa. Nesta comparação ética, “a si mesmo” comunica naturalmente a referência ao próprio ser.
- source_word: ובכל ששנאת
  choice: e, em tudo o que você odeia
  rationale: A formulação conserva o alcance amplo de בכל e apresenta de modo direto aquilo que é detestado pelo destinatário, sem definir além do que o hebraico permite.
- source_word: התבונן
  choice: reflita
  rationale: O imperativo pede consideração cuidadosa e discernimento. “Reflita” é atual e natural, preservando o caráter deliberativo da exortação.
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: usado apenas como testemunho de controle, não seguido no texto principal
  rationale: O paralelo grego diverge substancialmente do hebraico e pode refletir outra forma textual ou outro alinhamento de versículos. Como há testemunho hebraico preservado, ele fundamenta o texto principal.
theological_decisions:
- issue: Relação com a fórmula conhecida “ame o seu próximo como a si mesmo”
  choice: Manter “Conheça o seu próximo”, conforme o verbo hebraico ידע.
  alternative: “Ame o seu próximo como a si mesmo.”
  rationale: O texto hebraico enfatiza conhecer ou compreender, não emprega explicitamente o verbo amar. A tradução preserva essa formulação ética própria, sem harmonização.
- issue: Força ética da oração final
  choice: 'Preservar a ordem aberta: “em tudo o que você odeia, reflita”.'
  alternative: 'Explicitar: “considere cuidadosamente tudo o que você odeia” ou “não faça aos outros o que você odeia”.'
  rationale: O hebraico exige reflexão sobre o que o destinatário odeia, mas não declara expressamente a aplicação negativa mais ampla. A tradução não transforma a possível implicação em texto explícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O uso de “seu”, “si mesmo” e “você” mantém o tratamento coerente e natural. A sintaxe um pouco marcante da primeira oração foi preservada porque reflete uma formulação hebraica distinta e teologicamente significativa.
