  text: For because of every matter the eye trembles[a], and from the face tears will flow.
translation:
  language: pt
  text: Pois, diante de qualquer coisa, o olho treme[a], e do rosto as lágrimas escorrem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado aqui difere muito da tradição grega, que diz: “Quem teme o Senhor de modo nenhum ficará receoso nem será covarde, porque ele é a sua esperança.” O texto principal segue o testemunho hebraico existente.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Pois
  rationale: Introduz a afirmação explicativa sem reproduzir de modo artificial a sobreposição causal possível no hebraico elíptico.
- source_word: מפני כל דבר
  choice: diante de qualquer coisa
  rationale: Preserva a amplitude de דבר (“coisa”, “assunto”, “palavra”) e a possibilidade espacial ou causal de מפני, sem restringir o sentido apenas à fala.
- source_word: תזוע עין
  choice: o olho treme
  rationale: Mantém o singular e a imagem corporal vívida do verbo זוע, que indica tremor ou abalo.
- source_word: ומפנים
  choice: e do rosto
  rationale: Traduz literalmente פנים como “rosto”, evitando substituir a imagem hebraica por “olhos” ou “faces”.
- source_word: דמעה תדמע
  choice: as lágrimas escorrem
  rationale: Expressa em português natural a combinação intensiva de substantivo e verbo ligada ao pranto, preservando a imagem concreta.
theological_decisions:
- issue: Divergência textual entre o hebraico e a tradição grega
  choice: Seguir no texto principal o testemunho hebraico preservado e registrar a leitura grega em nota.
  alternative: “Quem teme o Senhor de modo nenhum ficará receoso nem será covarde, porque ele é a sua esperança.”
  rationale: O hebraico existente e o grego apresentam textos substancialmente diferentes. Como há testemunho hebraico preservado, ele serve de base, sem harmonização; a variante grega é apresentada ao leitor como tradição textual divergente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e a estranheza imagética do hebraico, mas evita uma duplicação causal pouco natural em português.
