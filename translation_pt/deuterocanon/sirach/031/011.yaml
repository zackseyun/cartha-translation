base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: pt
  text: Quem foi provado por ela e achado íntegro? Isso será motivo de honra para ele.[a] Quem pôde transgredir e não transgrediu, e fazer o mal, mas não o quis?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A primeira linha do hebraico é textualmente difícil. A redação transmitida também pode ser entendida mais literalmente como: “Quem o abençoou, e ele foi íntegro durante a vida? Ele é uma honra para você”. O contexto favorece o sentido de alguém provado e considerado íntegro.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Quem pôde desviar-se e não se desviou, e fazer o mal, mas não quis fazê-lo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מי
  choice: Quem
  rationale: Mantém a abertura interrogativa e a estrutura retórica do hebraico.
- source_word: ברכו
  choice: foi provado por ela
  rationale: A forma hebraica transmitida é textualmente difícil. À luz do contexto, que elogia a integridade diante da riqueza, entende-se aqui a ideia de ser posto à prova; o pronome retoma o elemento de prova mencionado no contexto.
- source_word: וישלם בחייו
  choice: e achado íntegro
  rationale: שלם exprime aqui inteireza e integridade moral, não apenas paz. A formulação portuguesa comunica o resultado positivo da prova sem sugerir perfeição absoluta.
- source_word: הוא לך לתפארת
  choice: Isso será motivo de honra para ele
  rationale: תפארת pode indicar glória, honra ou motivo de exaltação. A redação transmitida apresenta dificuldade pronominal; esta formulação preserva o sentido de reconhecimento honroso sem solucionar silenciosamente a instabilidade textual.
- source_word: יוכל לסור
  choice: pôde transgredir
  rationale: Embora סור signifique literalmente desviar-se ou afastar-se, o contexto ético aponta para a possibilidade de cometer uma transgressão.
- source_word: ולא סר
  choice: e não transgrediu
  rationale: Repete o mesmo verbo para conservar o paralelismo e deixar clara a resistência ao erro moral.
- source_word: ולהרע רעה
  choice: fazer o mal
  rationale: A construção com verbo e objeto cognato intensifica a ação maléfica; a expressão escolhida é concisa, natural e moralmente clara.
- source_word: ולא אבה
  choice: e não o quis
  rationale: אבה denota querer, dispor-se ou consentir. A tradução conserva a dimensão interior da recusa sem especificar além do hebraico.
theological_decisions:
- issue: Uso do testemunho hebraico apesar da instabilidade textual e da divergência do paralelo grego
  choice: Traduzir prioritariamente a linha hebraica preservada, recorrendo ao contexto e à tradição paralela para entender a primeira oração como uma prova de integridade, e registrar a dificuldade em nota.
  alternative: Traduzir ברכו literalmente como “o abençoou”, ou reconstruir o versículo principalmente a partir do grego divergente.
  rationale: O hebraico preserva a estrutura retórica e a segunda pergunta de modo inteligível, mas a primeira linha é instável. A solução contextual evita uma leitura portuguesa obscura, enquanto a nota mantém transparente a leitura literal possível e não oculta a incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Íntegro” preserva o caráter moral da prova; “motivo de honra” soa mais natural do que uma formulação literal com “glória”. As notas expõem tanto a dificuldade da primeira linha quanto as alternativas lexicais da segunda.
