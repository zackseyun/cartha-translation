  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: pt
  text: Saiba que o seu próximo é um homem como você[a][b], e coma o que foi posto diante de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais inclusivo, “o seu próximo é uma pessoa como você”. O hebraico diz literalmente “um homem como você”.
    reason: lexical_alternative
  - marker: b
    text: 'O testemunho grego difere substancialmente neste ponto: “elevando a alma e iluminando os olhos, dando cura, vida e bênção”. O hebraico e o grego parecem preservar formas diferentes do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: Saiba
  rationale: Imperativo de ידע. “Saiba” preserva de modo direto e natural a força exortativa do hebraico, sem acrescentar a nuance interpretativa de “reconheça” ou “compreenda”.
- source_word: רעך
  choice: o seu próximo
  rationale: רֵעַ pode designar amigo, companheiro ou próximo. “Próximo” conserva o sentido ético e social da pessoa com quem se está em relação.
- source_word: איש כמוך
  choice: um homem como você
  rationale: O hebraico emprega explicitamente o substantivo masculino singular איש, seguido de “como você”. A tradução mantém essa forma, enquanto a abrangência proverbial é esclarecida em nota.
- source_word: ואכול
  choice: e coma
  rationale: O imperativo ligado pela conjunção é reproduzido de forma paratática. Evita-se acrescentar uma relação conclusiva mais forte, como “portanto, coma”.
- source_word: דבר
  choice: o que
  rationale: Neste contexto, דָּבָר funciona idiomaticamente como “aquilo que” ou “o que”; a tradução evita o pouco natural “a coisa que”.
- source_word: ששם לפניך
  choice: for posto diante de você
  rationale: A expressão refere-se naturalmente ao alimento servido à mesa. “For posto diante de você” é idiomático em português e mantém a imagem concreta do hebraico.
theological_decisions:
- issue: Expressão marcada por gênero em איש כמוך
  choice: Manter “um homem como você” no texto principal
  alternative: “uma pessoa como você” ou “alguém como você”
  rationale: O testemunho hebraico usa o substantivo masculino איש. A tradução principal preserva essa forma, sem impedir que a aplicação proverbial mais ampla seja indicada em nota.
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Traduzir o hebraico no texto principal e registrar o grego em nota
  alternative: 'Seguir o grego: “elevando a alma e iluminando os olhos, dando cura, vida e bênção”'
  rationale: Há texto hebraico disponível e ele constitui o testemunho primário indicado. Como o grego preserva uma linha substancialmente diferente, os dois textos não são harmonizados; a divergência é apresentada ao leitor.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem simples das orações conserva a concisão proverbial do hebraico; “próximo” mantém o tom ético tradicional sem soar arcaico.
