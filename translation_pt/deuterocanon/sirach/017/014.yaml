  text: Their ways are always before him[a]; they will not be hidden from his eyes.
translation:
  language: pt
  text: Os caminhos deles estão sempre diante dele[a] e não ficarão escondidos dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A conduta deles está continuamente diante dele”. Aqui, “caminhos” pode referir-se à maneira de viver, não apenas a caminhos literais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτῶν
  choice: Os caminhos deles
  rationale: ὁδοί significa literalmente “caminhos”, mas também pode designar a maneira de viver ou a conduta. “Caminhos” preserva a metáfora sapiencial e é natural em português.
- source_word: ἐναντίον αὐτοῦ
  choice: diante dele
  rationale: A expressão indica aquilo que permanece na presença ou à vista de alguém. “Diante dele” conserva tanto a dimensão visual quanto a possível nuance de prestação de contas.
- source_word: διὰ παντός
  choice: sempre
  rationale: A locução significa continuamente ou em todo tempo; “sempre” é a forma mais clara e concisa em português moderno.
- source_word: οὐ κρυβήσονται
  choice: não ficarão escondidos
  rationale: O futuro passivo de κρύπτω é mantido como afirmação futura, sem convertê-lo na formulação modal “não podem ser escondidos”.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ
  choice: dos seus olhos
  rationale: A tradução conserva a imagem antropomórfica concreta do grego, que comunica a percepção constante de Deus.
theological_decisions:
- issue: Linguagem antropomórfica sobre o conhecimento divino
  choice: Manter “diante dele” e “dos seus olhos”
  alternative: Parafrasear como “são conhecidos por ele” ou “da sua vista”
  rationale: O grego emprega linguagem visual pessoal para expressar a percepção contínua que Deus tem da conduta humana. Preservar a imagem evita tornar abstrata a força teológica e poética do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora sapiencial de “caminhos” e o paralelismo visual do original foram preservados.
