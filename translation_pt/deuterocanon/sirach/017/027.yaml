  yaml_path: translation/deuterocanon/sirach/017/027.yaml
  text: Who will sing praise to the Most High in Hades[c][b][a], instead of the living who give thanks?
translation:
  language: pt
  text: Quem louvará o Altíssimo no Hades[a], em lugar dos vivos que oferecem ação de graças[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hades” designa aqui o domínio dos mortos, não necessariamente o lugar do juízo final. Também se pode traduzir por “morada dos mortos”.
    reason: alternative_reading
  - marker: b
    text: O grego também pode ser entendido como “em lugar dos vivos e dos que oferecem ação de graças”. “Ação de graças” pode ainda significar “louvor agradecido”.
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: o Altíssimo
  rationale: O dativo indica o destinatário do louvor; “o Altíssimo” preserva o título divino consagrado e sua força titular.
- source_word: τίς αἰνέσει
  choice: Quem louvará
  rationale: Traduz diretamente a pergunta retórica e o futuro de αἰνέω, sem acrescentar a ideia específica de cantar, ausente do verbo grego.
- source_word: ἐν ᾅδου
  choice: no Hades
  rationale: Mantém o termo do testemunho grego para o domínio dos mortos, evitando reduzi-lo à sepultura ou identificá-lo com o lugar do juízo final.
- source_word: ἀντὶ
  choice: em lugar de
  rationale: Expressa o contraste ou a substituição entre quem está no Hades e os vivos.
- source_word: ζώντων καὶ διδόντων
  choice: dos vivos que oferecem
  rationale: A formulação portuguesa entende os dois particípios como descrição do mesmo grupo, leitura contextual natural; a possível coordenação de dois grupos é preservada em nota.
- source_word: ἀνθομολόγησιν
  choice: ação de graças
  rationale: O substantivo pode indicar agradecimento, reconhecimento responsivo ou louvor agradecido; “ação de graças” conserva o tom de culto e é inteligível em português.
theological_decisions:
- issue: Sentido de ᾅδης no contexto sapiencial
  choice: Hades como domínio dos mortos
  alternative: sepultura; morada dos mortos; Sheol
  rationale: O verso contrasta os mortos com os vivos que louvam. “Hades” preserva a terminologia grega sem importar uma doutrina posterior de punição final.
- issue: Relação entre ζώντων e διδόντων
  choice: os vivos são os que oferecem ação de graças
  alternative: os vivos e os que oferecem ação de graças como grupos coordenados
  rationale: O contexto favorece a descrição dos vivos como aqueles que dão graças, mas a coordenação com καί permite uma leitura mais estritamente aditiva, registrada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário de culto compreensível. A tradução evita acrescentar a ideia de canto a αἰνέσει e mantém “Hades” para refletir diretamente o texto grego.
