  source_fidelity: A primeira oração e «até ele se apaga» representam adequadamente τί φωτεινότερον ἡλίου e καὶ τοῦτο ἐκλείπει. Na forma grega fornecida, πονηρὸς é nominativo masculino singular e σάρκα καὶ αἷμα é acusativo; portanto, o sujeito é «o perverso/a pessoa má», e «carne e sangue» é o complemento de ἐνθυμήσεται. A tradução não deve substituir silenciosamente essa sintaxe pela leitura refletida no audit trail inglês («flesh and blood devises evil»).
  naturalness: «O que é mais luminoso do que o sol?» é ligeiramente mais idiomático em português. «O perverso» é possível, mas pode adquirir em português uma conotação mais específica do que o grego; «uma pessoa má» comunica de modo claro o adjetivo substantivado e mantém o valor indefinido sem introduzir sexo.
  terminology: «Carne e sangue» preserva corretamente a expressão concreta σάρκα καὶ αἷμα. «Apaga» é uma opção defensável para ἐκλείπει, sem fixar o sentido em eclipse astronômico. A nota b atual introduz uma suposta leitura alternativa e uma interpretação sem documentação textual fornecida; deve ser retirada, não apresentada como variante estabelecida.
