  - severity: low
    issue: «O perverso» pode ser semanticamente mais estreito em português contemporâneo.
    rationale: «Uma pessoa má» é uma forma natural de representar πονηρὸς substantivado, sem as conotações adicionais que «perverso» pode ter.
