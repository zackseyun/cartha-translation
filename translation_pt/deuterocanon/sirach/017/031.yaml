  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: pt
  text: O que é mais luminoso do que o sol? No entanto, até ele se apaga[a]; e uma pessoa má pensará em carne e sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até ele falha», «até ele desaparece» ou «até ele sofre eclipse»; o verbo grego pode indicar falhar, cessar, desaparecer ou ser eclipsado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: O que é mais luminoso que o sol?
  rationale: A construção introduz uma pergunta retórica, e o genitivo após o comparativo é expresso naturalmente por «que o sol».
- source_word: καὶ τοῦτο ἐκλείπει
  choice: No entanto, até ele se apaga
  rationale: O pronome retoma o sol. ἐκλείπει pode indicar falhar, cessar, desaparecer ou sofrer eclipse; «se apaga» preserva a imagem luminosa e a ideia mais ampla de perda ou cessação, sem restringi-la necessariamente a um eclipse astronômico.
- source_word: πονηρὸς
  choice: o perverso
  rationale: 'Na forma nominativa masculina singular apresentada pela edição, funciona naturalmente como adjetivo substantivado: uma pessoa moralmente má.'
- source_word: ἐνθυμήσεται
  choice: pensará em
  rationale: O futuro médio de ἐνθυμέομαι indica considerar, ter em mente ou refletir sobre algo; «pensará em» mantém o sentido sem acrescentar a ideia mais forte de tramar.
- source_word: σάρκα καὶ αἷμα
  choice: carne e sangue
  rationale: A tradução literal conserva a expressão antropológica concreta do grego e, nesta forma textual, funciona como objeto de «pensará em».
theological_decisions:
- issue: Relação sintática entre πονηρὸς e σάρκα καὶ αἷμα
  choice: «o perverso pensará em carne e sangue»
  alternative: «carne e sangue conceberá o mal»
  rationale: A edição grega fornecida traz πονηρὸς no nominativo masculino singular e σάρκα no acusativo, favorecendo «o perverso» como sujeito e «carne e sangue» como objeto. A alternativa reflete uma forma textual ou análise diferente e produz uma afirmação antropológica distinta; por isso, não foi incorporada silenciosamente ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução segue prioritariamente a morfologia do texto grego fornecido, registrando em nota a divergência relevante refletida na camada inglesa.
