  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: pt
  text: Como é grande a misericórdia do Senhor e a expiação[a] para os que se voltam para ele!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «propiciação» ou «reparação».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Como é grande
  rationale: A construção ὡς com adjetivo tem força exclamativa; «Como é grande» a reproduz de modo natural em português.
- source_word: ἐλεημοσύνη
  choice: misericórdia
  rationale: Embora o termo possa significar «esmola» em outros contextos, aqui, como atributo ou ação do Senhor, designa sua misericórdia.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Neste contexto sapiencial judaico, κύριος é um título reverente para Deus.
- source_word: ἐξιλασμός
  choice: expiação
  rationale: O termo indica a remoção da culpa ou o ato pelo qual ela é reparada. «Expiação» preserva esse peso teológico sem definir uma teoria específica sobre seu funcionamento.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: para os que se voltam
  rationale: Mantém a imagem de mudança de direção e retorno a Deus sem substituí-la pelo termo interpretativo «se arrependem».
- source_word: ἐπ᾿ αὐτόν
  choice: para ele
  rationale: Com ἐπιστρέφω, expressa a direção da volta; «para ele» é claro e idiomático em português.
theological_decisions:
- issue: Sentido de ἐξιλασμός em relação ao perdão divino
  choice: expiação
  alternative: propiciação; reparação; meio de perdão
  rationale: «Expiação» comunica a remoção da culpa e conserva a densidade teológica do termo, sem impor uma explicação denominacional de como ela ocorre.
- issue: Natureza da resposta humana em ἐπιστρέφουσιν
  choice: os que se voltam para ele
  alternative: os que retornam a ele; os que se arrependem
  rationale: A tradução conserva a metáfora relacional e direcional do grego, deixando implícita, sem a apagar, sua dimensão de arrependimento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A exclamação reproduz a força de ὡς μεγάλη; a coordenação nominal concisa do grego foi mantida sem acrescentar um possessivo ausente no texto-fonte.
