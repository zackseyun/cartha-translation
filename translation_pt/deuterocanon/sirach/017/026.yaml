  yaml_path: translation/deuterocanon/sirach/017/026.yaml
  text: For not everything can be in human beings, because a son of man is not immortal.
translation:
  language: pt
  text: Pois nem tudo pode estar presente nos seres humanos, porque um filho de homem[a] não é imortal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um ser humano». O grego diz literalmente «um filho de homem»; aqui, a expressão se refere genericamente a um ser humano mortal e não é um título.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois
  rationale: γάρ introduz a explicação ou fundamento ligado ao contexto anterior; «Pois» preserva essa conexão sem acrescentar interpretação.
- source_word: δύναται
  choice: pode estar
  rationale: O verbo expressa possibilidade ou capacidade; com πάντα como sujeito, «pode estar» é natural e conserva a construção do grego.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente; «tudo» comunica esse alcance de modo claro e idiomático.
- source_word: ἐν ἀνθρώποις
  choice: nos seres humanos
  rationale: Mantém o valor básico de ἐν e o sentido genérico e inclusivo de ἀνθρώποις, evitando restringi-lo ao sexo masculino.
- source_word: ἀθάνατος
  choice: imortal
  rationale: Equivalente direto e corrente do adjetivo grego, preservando o contraste com a limitação humana.
- source_word: υἱὸς ἀνθρώπου
  choice: um filho de homem
  rationale: Preserva a expressão semítica e sua forma indefinida no grego. Aqui ela designa genericamente um ser humano mortal, sem funcionar como título.
theological_decisions:
- issue: Se υἱὸς ἀνθρώπου deve ser entendido como título ou como referência humana genérica
  choice: 'Referência genérica: «um filho de homem»'
  alternative: «um ser humano»; «o Filho do Homem»
  rationale: Neste contexto sapiencial, a expressão se refere à humanidade mortal. A ausência de artigo e a afirmação sobre a mortalidade desfavorecem a leitura como título messiânico. A tradução mantém o modo de dizer da fonte e esclarece seu uso genérico em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservou-se a expressão concreta «um filho de homem» no texto e explicou-se em nota seu sentido genérico, evitando tanto linguagem arcaica quanto uma associação cristológica indevida.
