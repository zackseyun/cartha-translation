  text: He added knowledge to them[a], and he bequeathed to them the law of life.
translation:
  language: pt
  text: Acrescentou-lhes conhecimento e lhes legou a lei da vida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a lei que dá vida”. A expressão grega significa literalmente “lei da vida”.'
    reason: Registra uma interpretação lexical plausível de νόμον ζωῆς sem eliminar a ambiguidade do genitivo no texto principal.
lexical_decisions:
- source_word: προσέθηκεν
  choice: Acrescentou
  rationale: Traduz diretamente o aoristo de προστίθημι e preserva a ideia de que Deus acrescentou este dom aos já mencionados.
- source_word: ἐπιστήμην
  choice: conhecimento
  rationale: Expressa naturalmente o sentido amplo de saber ou compreensão, sem restringi-lo a habilidade técnica ou discernimento moral.
- source_word: νόμον ζωῆς
  choice: a lei da vida
  rationale: Mantém de modo transparente a construção genitiva grega e evita decidir se a lei pertence à vida, orienta a vida ou produz vida.
- source_word: ἐκληροδότησεν
  choice: legou
  rationale: Preserva a nuance de transmissão como legado ou herança presente em κληροδοτέω, em português digno e conciso.
- source_word: αὐτοῖς
  choice: -lhes / lhes
  rationale: Conserva a referência repetida aos destinatários nas duas orações, de maneira idiomática em português.
theological_decisions:
- issue: Sentido da expressão νόμον ζωῆς
  choice: a lei da vida
  alternative: a lei que dá vida
  rationale: A tradução principal conserva a relação genitiva sem determinar sua força teológica; a nota registra a leitura resultativa plausível.
translation_notes:
  register: Português moderno, claro e solene. A colocação pronominal em “Acrescentou-lhes” e o verbo “legou” preservam concisão e dignidade sem tornar o versículo arcaico.
