  text: He set his eye upon their hearts[a], to show them the greatness of his works.
translation:
  language: pt
  text: Ele pôs o seu olho sobre os corações deles,[a] para lhes mostrar a grandeza das obras dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu olhar»; literalmente, «seu olho». O grego emprega uma imagem antropomórfica no singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: pôs
  rationale: Traduz diretamente o aoristo de τίθημι e preserva a força concreta do verbo sem acrescentar ideia de duração.
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
  choice: seu olho
  rationale: Mantém o singular e a imagem antropomórfica concreta do grego; «seu olhar» seria mais idiomático, porém ligeiramente interpretativo.
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: sobre o coração deles
  rationale: Preserva a metáfora bíblica de καρδία como centro interior do ser humano. Embora o grego tenha o plural «corações», o singular distributivo é mais natural em português e não altera o referente plural.
- source_word: δεῖξαι αὐτοῖς
  choice: para lhes mostrar
  rationale: Expressa claramente a finalidade do infinitivo e conserva a ligação visual entre «olho» e «mostrar».
- source_word: τὸ μεγαλεῖον
  choice: a grandeza
  rationale: Reproduz o sentido de grandeza ou magnificência sem o restringir à majestade abstrata ou a um único feito.
- source_word: τῶν ἔργων αὐτοῦ
  choice: de suas obras
  rationale: «Obras» mantém a amplitude dos atos divinos e a ressonância própria da literatura sapiencial.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção divina
  choice: 'Preservar a imagem concreta: «Ele pôs seu olho sobre o coração deles»'
  alternative: «Ele voltou seu olhar para o coração deles» ou «Ele vigiou o coração deles»
  rationale: O grego emprega deliberadamente a imagem singular do olho de Deus dirigido ao interior humano. A tradução mantém essa tensão em vez de convertê-la silenciosamente em linguagem abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. A formulação menos comum «pôs seu olho» é mantida por fidelidade à imagem concreta do original e esclarecida em nota.
