base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/024.yaml
  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: pt
  text: Do morto, como de alguém que já não existe, desaparece a ação de graças[a]; mas quem está vivo e com saúde louvará o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «confissão» ou «louvor agradecido»; o substantivo grego pode indicar reconhecimento, confissão ou louvor em forma de agradecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: Do morto
  rationale: 'A preposição ἀπό com o genitivo indica a fonte: a ação de graças deixa de proceder da pessoa morta. O singular do grego é preservado.'
- source_word: ὡς μηδὲ ὄντος
  choice: como de alguém que já não existe
  rationale: Expressa de modo natural a comparação retórica do grego sem transformar o verso numa afirmação metafísica sistemática sobre os mortos.
- source_word: ἀπόλλυται
  choice: desaparece
  rationale: O verbo pode significar perecer, perder-se ou deixar de existir. «Desaparece» é idiomático em português para a cessação da ação de graças e mantém a força da imagem.
- source_word: ἐξομολόγησις
  choice: ação de graças
  rationale: Na Septuaginta, o substantivo frequentemente designa reconhecimento agradecido ou louvor dirigido a Deus. «Ação de graças» preserva uma distinção lexical em relação a αἰνέσει, «louvará».
- source_word: ζῶν καὶ ὑγιὴς
  choice: quem está vivo e com saúde
  rationale: Os adjetivos/particípios descrevem substantivamente a pessoa viva e saudável. A formulação é clara, atual e natural em português.
- source_word: αἰνέσει
  choice: louvará
  rationale: Preserva o futuro indicativo e o contraste com o desaparecimento da ação de graças no primeiro membro.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a forma consagrada e apropriada para κύριος neste contexto das Escrituras judaicas.
theological_decisions:
- issue: Sentido de «como de alguém que já não existe» em relação ao morto
  choice: Manter a expressão como comparação retórica sobre a impossibilidade de oferecer ação de graças na condição de morto.
  alternative: Interpretá-la como negação doutrinária de toda existência após a morte.
  rationale: O texto sapiencial contrasta a atividade do morto com a da pessoa viva e saudável. A tradução preserva a tensão e a linguagem enfática sem impor uma conclusão ontológica que o verso não desenvolve.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura antitética e o futuro do original foram preservados; evitou-se linguagem arcaica e também qualquer explicação doutrinária inserida no texto.
