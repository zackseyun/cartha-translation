  text: For each nation he appointed a ruler[a], and Israel is the Lord’s own portion.
translation:
  language: pt
  text: Para cada nação, ele designou um governante[a], e Israel é a porção do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: para cada nação
  rationale: O dativo tem sentido distributivo; esta formulação é clara e natural em português.
- source_word: κατέστησεν
  choice: designou
  rationale: Expressa o ato de colocar alguém numa função de autoridade sem acrescentar detalhes ausentes do grego.
- source_word: ἡγούμενον
  choice: um governante
  rationale: O particípio substantivado indica alguém que dirige ou governa; “governante” preserva o contexto de autoridade, enquanto “líder” continua sendo uma alternativa possível.
- source_word: καὶ
  choice: e
  rationale: Mantém a conjunção grega e não torna explícito um contraste que o contexto pode sugerir, mas que a forma gramatical não exige.
- source_word: μερὶς Κυρίου
  choice: a porção do Senhor
  rationale: Preserva a imagem de parte ou porção pertencente ao Senhor, sem ampliá-la para “herança” nem acrescentar “própria”.
- source_word: Ἰσραήλ ἐστιν
  choice: Israel é
  rationale: Reproduz de modo direto e natural o sujeito e a cópula do grego.
theological_decisions:
- issue: Relação entre as nações e Israel
  choice: Unir as orações com “e”
  alternative: “mas Israel é a porção do Senhor”
  rationale: O contexto pode sugerir contraste entre os governantes das nações e a relação de Israel com o Senhor, porém καί significa formalmente “e”. A tradução conserva essa abertura interpretativa.
- issue: Imagem de μερίς aplicada a Israel
  choice: “a porção do Senhor”
  alternative: “o quinhão do Senhor” ou “a herança do Senhor”
  rationale: “Porção” mantém a metáfora de pertencimento ou partilha e evita especificar que se trata de herança, sentido possível no uso bíblico, mas não lexicalmente obrigatório aqui.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe amplamente compreensível no Brasil e em outros contextos lusófonos. Conserva-se “e” para refletir a coordenação grega e “porção” para manter a imagem bíblica sem interpretação excessiva.
