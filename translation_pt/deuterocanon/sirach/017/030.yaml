  yaml_path: translation/deuterocanon/sirach/017/030.yaml
  text: For not everything can be among human beings[a], because a son of man is not immortal.
translation:
  language: pt
  text: Pois nem tudo pode existir entre os seres humanos, porque um filho do homem[a] não é imortal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “um filho do homem”, expressão de estilo hebraico que aqui significa um ser humano mortal, e não um título messiânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: Pois ... não pode
  rationale: γάρ introduz a razão ou explicação ligada ao contexto anterior, e δύναται expressa possibilidade ou capacidade; a construção portuguesa mantém ambas de modo natural.
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: nem tudo pode existir entre os seres humanos
  rationale: A expressão grega é condensada e admite alguma amplitude. “Existir entre” preserva o valor de εἶναι ἐν sem especificar indevidamente quais qualidades, capacidades ou realidades estão em vista.
- source_word: ἀνθρώποις
  choice: os seres humanos
  rationale: O plural é genérico e se refere à humanidade, não apenas a pessoas do sexo masculino.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de maneira clara a razão da afirmação anterior.
- source_word: οὐκ ἀθάνατος
  choice: não é imortal
  rationale: Tradução direta e corrente de ἀθάνατος, mantendo a afirmação sobre a mortalidade humana.
- source_word: υἱὸς ἀνθρώπου
  choice: um filho do homem
  rationale: Preserva a forma semítica refletida literalmente no grego. O artigo indefinido comunica o caráter genérico da expressão, e a nota evita que ela seja entendida aqui como título messiânico.
theological_decisions:
- issue: Se υἱὸς ἀνθρώπου deve ser vertido como expressão literal ou como equivalente idiomático
  choice: um filho do homem
  alternative: um ser humano
  rationale: Neste contexto, a expressão designa genericamente um mortal, não funciona como título messiânico. A tradução literal preserva a textura da fonte, enquanto a nota esclarece seu sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação deliberadamente não explicita o referente abrangente de “tudo”, preservando a concisão e a abertura semântica do grego.
