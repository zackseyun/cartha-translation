  text: Their injustices were not hidden from him[a], and every sin of theirs was before the Lord.
translation:
  language: pt
  text: As injustiças deles não lhe ficaram ocultas[a], e cada pecado deles estava diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não escaparam à atenção dele». O grego diz mais literalmente: «não lhe ficaram ocultas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: não ficaram ocultas
  rationale: Preserva de modo natural em português a forma passiva e a imagem grega de atos que não permanecem escondidos.
- source_word: αἱ ἀδικίαι αὐτῶν
  choice: as injustiças deles
  rationale: ἀδικίαι designa injustiças ou atos contrários ao que é justo; a formulação conserva o valor concreto e a referência possessiva.
- source_word: ἀπ᾿ αὐτοῦ
  choice: para ele
  rationale: Na construção portuguesa «ficar oculto para alguém», traduz idiomaticamente ἀπό com o sentido de algo escondido da percepção de alguém.
- source_word: πᾶσα ἁμαρτία αὐτῶν
  choice: cada pecado deles
  rationale: O singular distributivo πᾶσα é bem representado por «cada», ressaltando individualmente os pecados.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: Traduz diretamente a ideia de presença expressa por ἔναντι e mantém Κυρίου como «Senhor», sem substituir pelo nome divino hebraico.
theological_decisions:
- issue: A plena visibilidade do pecado humano diante de Deus
  choice: Manter a imagem de injustiças não ocultas e de cada pecado diante do Senhor.
  alternative: Parafrasear como «nenhum dos pecados deles escapou à atenção do Senhor».
  rationale: O grego afirma que os atos estão expostos diante de Deus, sem desenvolver uma formulação doutrinária mais ampla; a tradução conserva essa imagem e seu peso teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Não ficaram ocultas» conserva a imagem do original; «cada pecado» reproduz a força distributiva do grego.
