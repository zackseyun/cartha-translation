  text: After this he will rise up and repay them[b][a], and he will bring their repayment upon their head.
translation:
  language: pt
  text: Depois disso, ele se levantará[a] e lhes retribuirá; fará recair sobre a cabeça deles[b] a retribuição que lhes cabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se erguerá”. O verbo grego retrata literalmente o ato de levantar-se, aqui como imagem de uma ação decidida.'
    reason: lexical_alternative
  - marker: b
    text: “Sobre a cabeça deles” é uma expressão que indica que a paga ou as consequências recaem sobre os próprios envolvidos.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa com naturalidade a sequência temporal explícita no grego.
- source_word: ἐξαναστήσεται
  choice: ele se levantará
  rationale: Preserva a imagem concreta de levantar-se para agir, sem reduzi-la ao simples sentido de “agirá”.
- source_word: ἀνταποδώσει
  choice: lhes retribuirá
  rationale: Mantém o sentido recíproco de dar em resposta à conduta anterior e conserva o agente pessoal da ação.
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: a retribuição que lhes cabe
  rationale: Comunica que se trata da retribuição destinada a eles; evita a ambiguidade pouco natural de “a retribuição deles”, sem especificar além do texto a natureza exata da paga.
- source_word: εἰς κεφαλὴν αὐτῶν ἀποδώσει
  choice: fará recair sobre a cabeça deles
  rationale: Conserva a imagem idiomática do grego e exprime em português corrente a ideia de que a retribuição retorna sobre os próprios envolvidos.
theological_decisions:
- issue: Natureza da ação divina na linguagem de juízo
  choice: 'Preservar a ação pessoal e retributiva: “ele se levantará e lhes retribuirá”.'
  alternative: Tornar a formulação impessoal, como “eles sofrerão as consequências de seus atos”.
  rationale: O grego apresenta um agente pessoal que se levanta e retribui. A tradução não dilui essa tensão em um processo meramente impessoal.
- issue: Sentido da retribuição
  choice: Usar “a retribuição que lhes cabe”, sem explicitar se é castigo, recompensa ou consequência.
  alternative: Traduzir como “o castigo que merecem”.
  rationale: O contexto sugere juízo, mas o substantivo grego designa de modo mais amplo uma paga ou retribuição; a formulação escolhida evita acrescentar uma especificação não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público brasileiro e compreensível internacionalmente. A repetição de “retribuirá/retribuição” preserva a ligação lexical do grego; o ponto e vírgula mantém o paralelismo sem produzir uma frase excessivamente mecânica.
