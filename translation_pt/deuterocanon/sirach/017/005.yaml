  yaml_path: translation/deuterocanon/sirach/017/005.yaml
  text: He gave them counsel and a tongue and eyes[a], ears and a heart[b], to reason with.
translation:
  language: pt
  text: Deu-lhes a capacidade de deliberar[a], a língua e os olhos, os ouvidos e o coração[b], para refletirem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deliberação”; o termo grego pode indicar a faculdade de formar um juízo ponderado.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “coração” tem o sentido bíblico de centro interior do pensamento e da vontade, não apenas das emoções.
    reason: cultural_note
lexical_decisions:
- source_word: διαβούλιον
  choice: a capacidade de deliberar
  rationale: O substantivo designa deliberação ou juízo ponderado. A formulação explicita a faculdade humana em vista, sem reduzi-la a um conselho recebido de outra pessoa.
- source_word: γλῶσσαν
  choice: a língua
  rationale: Mantém o órgão concreto, empregado também por metonímia para a fala, em harmonia com a enumeração grega.
- source_word: ὀφθαλμούς
  choice: os olhos
  rationale: Preserva o substantivo concreto no plural, em vez de substituí-lo pela função abstrata da visão.
- source_word: ὦτα
  choice: os ouvidos
  rationale: Mantém a forma concreta da lista; em português, “ouvidos” é a designação natural nesse contexto.
- source_word: καρδίαν
  choice: o coração
  rationale: Conserva a antropologia bíblica, na qual o coração inclui pensamento e vontade, não apenas emoção.
- source_word: ἔδωκεν
  choice: Deu-lhes
  rationale: Tradução direta do aoristo; o pronome enclítico expressa naturalmente o objeto indireto αὐτοῖς.
- source_word: διανοεῖσθαι
  choice: para refletirem
  rationale: Exprime a atividade mental ponderada e apresenta o infinitivo como finalidade das faculdades concedidas, em português natural.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: O pronome dativo é incorporado ao verbo “deu”, conforme o uso idiomático do português.
theological_decisions:
- issue: Sentido antropológico de καρδία em uma lista de faculdades humanas
  choice: Manter “coração” e deixar “para refletirem” indicar sua dimensão cognitiva.
  alternative: mente; entendimento
  rationale: A tradução conserva a tensão própria da antropologia bíblica, em que o coração é sede do pensamento e da vontade, sem convertê-lo em uma categoria psicológica moderna.
- issue: Forma concreta e mista da enumeração
  choice: Preservar “língua”, “olhos”, “ouvidos” e “coração”.
  alternative: fala, visão, audição e entendimento
  rationale: O grego reúne uma faculdade e órgãos corporais concretos. Manter essa forma evita transformar a lista em uma paráfrase de funções abstratas.
- issue: Relação do infinitivo διανοεῖσθαι com os dons enumerados
  choice: 'Traduzir como finalidade: “para refletirem”.'
  alternative: com os quais pensar; para compreenderem
  rationale: A construção admite valor de finalidade ou resultado. “Para refletirem” preserva a atividade mental sem afirmar que somente o coração, ou cada item isoladamente, seja seu instrumento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe compacta conserva a enumeração do grego, enquanto “capacidade de deliberar” e “para refletirem” tornam explícitas relações semânticas necessárias em português.
