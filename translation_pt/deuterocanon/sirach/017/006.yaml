lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: conhecimento e compreensão
  rationale: A expressão grega liga estreitamente conhecimento e compreensão. A coordenação em português comunica essa plenitude cognitiva com naturalidade, sem transformar os termos em capacidades totalmente independentes.
- source_word: ἐνέπλησεν
  choice: encheu-os
  rationale: Preserva a imagem verbal de plenitude e retoma de modo claro as pessoas mencionadas no contexto.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: o bem e o mal
  rationale: A formulação concisa expressa naturalmente categorias morais em português, sentido favorecido pelo contexto, sem ocultar a possibilidade lexical de coisas benéficas e prejudiciais.
- source_word: ὑπέδειξεν αὐτοῖς
  choice: mostrou-lhes
  rationale: Reproduz de forma idiomática tanto o ato de mostrar ou indicar quanto o objeto indireto expresso pelo dativo grego.
theological_decisions:
- issue: Se ἀγαθὰ καὶ κακὰ designa categorias morais ou coisas benéficas e prejudiciais
  choice: o bem e o mal
  alternative: as coisas boas e as coisas más
  rationale: O contexto trata da capacidade cognitiva e moral concedida por Deus, favorecendo a ideia de discernimento moral. A nota preserva a amplitude semântica da expressão grega.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla legibilidade brasileira. A coordenação “conhecimento e compreensão” evita o pouco natural “conhecimento de compreensão”, ao mesmo tempo que mantém a estreita relação entre os dois substantivos gregos.
