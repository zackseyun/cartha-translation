  text: Encheu-os de conhecimento e compreensão, e mostrou-lhes o bem e o mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas boas e as coisas más”. O grego pode indicar tanto categorias morais como coisas benéficas e prejudiciais; o contexto favorece o discernimento moral.'
