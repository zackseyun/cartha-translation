  yaml_path: translation/deuterocanon/sirach/017/001.yaml
  text: The Lord created man from the earth[a], and returned him to it again.
translation:
  language: pt
  text: O Senhor criou o ser humano da terra[a] e o fez voltar novamente para ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem”; o grego emprega o singular ἄνθρωπον de modo representativo para a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: O Senhor
  rationale: Forma consagrada e natural em português para o título divino κύριος.
- source_word: ἔκτισεν
  choice: criou
  rationale: Preserva o sentido comum de κτίζω e o tom elevado do contexto da criação, sem acrescentar a ideia mais concreta de modelar.
- source_word: ἐκ γῆς
  choice: da terra
  rationale: Expressa de modo conciso e natural a origem indicada por ἐκ, mantendo a ligação temática entre a procedência humana e seu retorno à terra.
- source_word: ἄνθρωπον
  choice: o ser humano
  rationale: Mantém o singular representativo de ἄνθρωπον e deixa claro que a afirmação abrange a humanidade, sem excluir a possível ressonância adâmica.
- source_word: πάλιν
  choice: novamente
  rationale: Traduz explicitamente o advérbio πάλιν, embora a noção de retorno também esteja presente no verbo.
- source_word: ἀπέστρεψεν
  choice: o fez voltar
  rationale: 'O verbo é causativo no contexto: o Senhor faz o ser humano retornar. Esta formulação preserva essa força com naturalidade em português.'
- source_word: εἰς αὐτήν
  choice: para ela
  rationale: O pronome feminino retoma claramente 'a terra'; 'para ela' reproduz a direção expressa por εἰς.
theological_decisions:
- issue: Alcance antropológico de ἄνθρωπον
  choice: Traduzir pelo singular representativo 'o ser humano'.
  alternative: '''o homem'' ou ''a humanidade'''
  rationale: '''O ser humano'' conserva a referência a uma criatura humana singular usada como representante da humanidade. Evita restringir indevidamente o referente ao sexo masculino, ao mesmo tempo que não dissolve o singular na expressão abstrata ''a humanidade''.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semântica de 'voltar novamente' foi mantida para representar tanto ἀπέστρεψεν quanto πάλιν e preservar a ênfase do grego.
