base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/032.yaml
  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: pt
  text: Ele mesmo vela pela hoste da altura do céu[a], e todos os seres humanos são terra e cinza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «poder da altura do céu». A palavra grega pode significar «poder» ou, no uso bíblico, uma «hoste».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: hoste
  rationale: Embora o substantivo esteja no singular e possa significar «poder» ou «força», no grego bíblico também pode designar uma força organizada ou hoste celestial. «Hoste» preserva esse provável sentido cósmico e o contraste com a fragilidade humana.
- source_word: ὕψους οὐρανοῦ
  choice: da altura do céu
  rationale: Mantém a construção descritiva do grego, sem transformar «altura» em um título divino. O singular também é preservado.
- source_word: ἐπισκέπτεται
  choice: vela por
  rationale: O verbo pode significar visitar, inspecionar ou cuidar. Neste contexto, «vela por» expressa supervisão e cuidado contínuos de modo natural em português.
- source_word: οἱ ἄνθρωποι πάντες
  choice: todos os seres humanos
  rationale: A expressão grega abrange toda a humanidade. Esta formulação é clara, inclusiva e semanticamente exata no português atual.
- source_word: γῆ καὶ σποδός
  choice: terra e cinza
  rationale: Traduz diretamente os dois substantivos gregos e evita substituir «terra» pela expressão bíblica mais familiar «pó e cinza».
theological_decisions:
- issue: Sentido de δύναμιν no contexto celestial
  choice: hoste
  alternative: poder
  rationale: O contexto admite lexicalmente as duas leituras. A leitura coletiva, «hoste», combina melhor com algo sobre o qual Deus vela, mas a alternativa «poder» é preservada em nota para não eliminar a ambiguidade genuína.
- issue: Alcance de οἱ ἄνθρωποι πάντες
  choice: todos os seres humanos
  alternative: todos os homens
  rationale: O masculino grego tem sentido genérico e se refere à humanidade inteira; «seres humanos» comunica esse alcance sem introduzir uma limitação masculina ausente do sentido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Hoste» conserva o tom elevado e o provável sentido celestial; a sintaxe permanece próxima do grego sem soar excessivamente arcaica.
