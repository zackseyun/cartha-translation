  text: Return to the Most High and turn away from unrighteousness[c][b][a], and hate what is abominable intensely.
translation:
  language: pt
  text: Volte ao Altíssimo[a] e afaste-se da injustiça[b][c]; odeie profundamente o que é abominável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Retorne ao Altíssimo”. O imperativo grego expressa a volta para Deus e a renovação do rumo da vida.'
    reason: lexical_alternative
  - marker: b
    text: “Injustiça” também pode ser traduzida como “maldade”, “iniquidade” ou “conduta errada”, conforme se destaque o sentido social ou o sentido moral mais amplo.
    reason: lexical_alternative
  - marker: c
    text: Nesta parte de Sirácida, o texto grego é a principal testemunha adotada. Como a validação das fontes aponta uma divergência importante na história da transmissão deste versículo, a tradução segue de perto a redação grega preservada.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπάναγε
  choice: Volte
  rationale: O imperativo exorta a pessoa a retornar para Deus, com a ideia de arrependimento e renovação de rumo. “Volte” é natural e preserva essa força.
- source_word: ἐπὶ Ὕψιστον
  choice: ao Altíssimo
  rationale: A expressão indica movimento em direção a Deus e mantém “Altíssimo” como título divino.
- source_word: ἀπόστρεφε
  choice: afaste-se
  rationale: O presente imperativo sugere uma mudança moral contínua. “Afaste-se” comunica com naturalidade o abandono do mal sem reduzir o verbo a mera prevenção.
- source_word: ἀπὸ ἀδικίας
  choice: da injustiça
  rationale: ἀδικία pode abranger injustiça, maldade ou conduta errada. “Injustiça” preserva o vínculo lexical com a ausência de justiça e continua suficientemente ampla neste contexto.
- source_word: σφόδρα
  choice: profundamente
  rationale: O advérbio intensifica a ordem de odiar. “Profundamente” soa natural em português junto de “odeie” e mantém a ênfase.
- source_word: μίσησον
  choice: odeie
  rationale: O verbo grego é forte; “odeie” conserva sua intensidade sem suavização interpretativa.
- source_word: βδέλυγμα
  choice: o que é abominável
  rationale: A formulação comunica algo moralmente repulsivo e preserva o peso de βδέλυγμα, evitando a construção menos natural “odeie a abominação”.
theological_decisions:
- issue: Amplitude moral de ἀδικία na exortação sapiencial
  choice: injustiça
  alternative: maldade; conduta errada; iniquidade
  rationale: O termo pode designar tanto atos injustos quanto o mal moral em sentido amplo. “Injustiça” mantém a ambiguidade lexical básica, e a nota registra alternativas legítimas.
- issue: Força de βδέλυγμα
  choice: o que é abominável
  alternative: a abominação; o que é detestável
  rationale: A tradução conserva a forte repulsa moral do termo grego sem especificar uma categoria ritual ou doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição literal de verbos ligados a “voltar” foi evitada por meio de “afaste-se”, sem perder o paralelismo ético. O ponto e vírgula organiza as duas exortações principais e torna a frase natural.
