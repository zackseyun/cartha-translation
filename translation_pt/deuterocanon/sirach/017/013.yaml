  text: And he said to them[a], “Watch yourselves against every injustice,” and he commanded each of them concerning his neighbor.
translation:
  language: pt
  text: 'E ele lhes disse: “Guardem-se de toda injustiça”[a], e ordenou a cada um deles a respeito do seu próximo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham cuidado com toda injustiça” ou “Guardem-se de tudo o que é injusto”. A expressão grega é concisa e admite essas traduções próximas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: Guardem-se
  rationale: O imperativo, seguido de ἀπό, expressa cautela diante de algo que deve ser evitado. “Guardem-se” é natural em português e preserva essa força reflexiva.
- source_word: ἀπὸ παντὸς ἀδίκου
  choice: de toda injustiça
  rationale: A expressão grega é concisa e pode designar toda ação ou realidade injusta. “Toda injustiça” mantém o alcance ético e se liga naturalmente a “guardem-se de”.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: O verbo indica uma ordem ou incumbência dotada de autoridade; “ordenou” preserva essa força.
- source_word: ἑκάστῳ
  choice: a cada um deles
  rationale: Reproduz o sentido distributivo explícito do dativo singular, apresentando a obrigação como individual.
- source_word: περὶ τοῦ πλησίον
  choice: a respeito do seu próximo
  rationale: “Próximo” conserva o registro ético bíblico de πλησίον. O possessivo explicita em português a relação distributiva presente no contexto, sem transformar o singular em plural.
theological_decisions:
- issue: Alcance ético da linguagem de ἀδίκου
  choice: “injustiça”
  alternative: “mal”, “ato injusto” ou “iniquidade”
  rationale: No contexto sapiencial, “injustiça” comunica com clareza a dimensão ética e interpessoal, reforçada pela referência seguinte ao próximo, sem converter o termo em categoria doutrinária técnica.
- issue: Singular distributivo de “próximo”
  choice: “a cada um deles a respeito do seu próximo”
  alternative: “a cada um a respeito dos seus próximos” ou “a respeito uns dos outros”
  rationale: A formulação mantém o singular do grego e sua aplicação distributiva, preservando o foco na responsabilidade pessoal sem identificar o próximo exclusivamente com os demais destinatários.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Guardem-se” evita a construção pouco idiomática “vigiem-se contra”, enquanto mantém a advertência reflexiva do grego. O marcador da nota foi colocado após a oração citada à qual se refere.
