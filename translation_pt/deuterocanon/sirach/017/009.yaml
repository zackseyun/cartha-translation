lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade de modo natural e preserva a força final da conjunção grega.
- source_word: διηγῶνται
  choice: contem
  rationale: Expressa o ato de narrar ou relatar; o presente do subjuntivo após «para que» reproduz naturalmente a construção grega.
- source_word: τὰ μεγαλεῖα
  choice: as grandezas
  rationale: Mantém o substantivo plural e sua amplitude sem restringi-lo indevidamente a feitos poderosos ou maravilhas.
- source_word: τῶν ἔργων
  choice: das obras
  rationale: Correspondência formal e idiomática para ἔργων, preservando a relação genitiva com «grandezas».
- source_word: αὐτοῦ
  choice: dele
  rationale: Pronome possessivo que remete a Deus no contexto; «dele» evita uma sequência potencialmente pesada de possessivos.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: Deus, expresso por «dele»
  alternative: suas obras
  rationale: O contexto de Sirácida 17 trata da ação de Deus em favor da humanidade; não há outro referente plausível, mas o versículo isolado mantém o referente pronominal implícito como no grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A formulação conserva a concisão e a finalidade do grego, bem como o plural concreto e semanticamente aberto de τὰ μεγαλεῖα.
