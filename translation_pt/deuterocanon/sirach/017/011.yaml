  text: He established with them an everlasting covenant[b][a], and showed them his judgments.
translation:
  language: pt
  text: Ele estabeleceu com eles uma aliança perpétua[a] e lhes mostrou os seus juízos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma aliança eterna” ou “uma aliança duradoura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as suas ordenanças” ou “os seus decretos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: aliança
  rationale: No grego bíblico, διαθήκη tem normalmente sentido pactual; “aliança” preserva essa ressonância bíblica e teológica sem reduzi-la a um acordo comum.
- source_word: αἰῶνος
  choice: perpétua
  rationale: O genitivo αἰῶνος caracteriza a aliança como duradoura. “Perpétua” é natural em português e conserva a ideia de permanência, enquanto a nota registra alternativas possíveis.
- source_word: ἔστησεν
  choice: estabeleceu
  rationale: O verbo indica instituir ou firmar algo. “Estabeleceu” comunica essa ação duradoura e corresponde bem ao registro pactual.
- source_word: μετ᾿ αὐτῶν
  choice: com eles
  rationale: μετά com genitivo significa naturalmente “com”; a tradução mantém a dimensão relacional da aliança.
- source_word: τὰ κρίματα αὐτοῦ
  choice: os seus juízos
  rationale: κρίματα pode designar juízos, ordenanças ou decretos. “Juízos” é a correspondência mais direta e preserva a amplitude judicial e normativa do termo.
- source_word: ὑπέδειξεν
  choice: mostrou
  rationale: O verbo significa indicar ou mostrar. “Mostrou” é direto, claro e evita ampliar interpretativamente para “revelou”.
theological_decisions:
- issue: Linguagem de aliança em contexto sapiencial
  choice: aliança perpétua
  alternative: aliança eterna; aliança duradoura
  rationale: O grego emprega linguagem inequivocamente pactual. A tradução conserva esse peso teológico, enquanto a nota mantém aberta a extensão semântica de αἰῶνος.
- issue: Sentido de κρίματα no contexto da aliança
  choice: juízos
  alternative: ordenanças; decretos
  rationale: O texto não exige um sentido exclusivamente legislativo. “Juízos” mantém tanto a força judicial quanto a normativa, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluência (“lhes mostrou”), sem alterar a estrutura paralela nem o conteúdo do grego. Os marcadores aparecem junto aos termos que explicam.
