  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: pt
  text: A esmola de um homem é como um selo que ele traz consigo; e conservará[a] a bondade de uma pessoa como a pupila do olho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego não declara quem conservará. O contexto mais amplo pode sugerir: “Deus conservará”, mas a própria cláusula deixa o sujeito implícito.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “como a pupila do olho”; a expressão retrata algo guardado com extremo cuidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: esmola
  rationale: No uso judaico helenístico, o termo frequentemente designa a ajuda concreta dada aos necessitados. “Esmola” preserva essa especificidade melhor do que o sentido mais amplo de “caridade”.
- source_word: ἀνδρός
  choice: de um homem
  rationale: Mantém o substantivo grego masculino singular e sua distinção em relação ao termo humano mais amplo ἀνθρώπου no segundo membro.
- source_word: σφραγίς
  choice: selo
  rationale: É o equivalente direto e conserva a metáfora sem especificar indevidamente um sinete ou anel.
- source_word: μετ᾿ αὐτοῦ
  choice: que ele traz consigo
  rationale: Expressa em português natural a ideia compacta de algo que permanece com a pessoa, sem perder a imagem de posse próxima e cuidadosa.
- source_word: χάριν
  choice: bondade
  rationale: Neste paralelismo, refere-se naturalmente a um favor ou ato benéfico humano. “Bondade” evita a carga teológica que “graça” poderia introduzir.
- source_word: ἀνθρώπου
  choice: de uma pessoa
  rationale: Reflete o sentido humano geral de ἄνθρωπος e preserva o singular, distinguindo-o de ἀνήρ no primeiro membro.
- source_word: κόρην
  choice: a pupila dos olhos
  rationale: Traduz a referência anatômica de modo claro e natural, mantendo a imagem de algo cuidadosamente protegido.
- source_word: συντηρήσει
  choice: conservará
  rationale: Mantém o futuro ativo singular e a ideia de preservar ou guardar cuidadosamente, sem acrescentar um sujeito que o grego não explicita.
theological_decisions:
- issue: Sujeito do verbo futuro συντηρήσει
  choice: sujeito singular deixado implícito em “conservará”
  alternative: “Deus conservará” ou “ele conservará”
  rationale: O grego não apresenta sujeito explícito. O português permite conservar essa indeterminação; embora o contexto mais amplo possa sugerir Deus, nomeá-lo no texto resolveria uma ambiguidade genuína da cláusula.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O ponto e vírgula preserva os dois membros do paralelismo. A omissão do pronome antes de “conservará” reproduz, tanto quanto possível, a ambiguidade do sujeito no grego.
