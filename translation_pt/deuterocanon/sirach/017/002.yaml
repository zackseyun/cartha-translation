  yaml_path: translation/deuterocanon/sirach/017/002.yaml
  text: He gave them a fixed number of days and a set time[b][a], and he gave them authority over the things on it.
translation:
  language: pt
  text: Deu-lhes um número determinado de dias e um tempo estabelecido[a], e deu-lhes autoridade sobre as coisas que há sobre ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um tempo determinado” ou “um tempo designado”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as coisas sobre ela”. O pronome provavelmente se refere à terra mencionada no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: um número determinado de dias
  rationale: A construção genitiva indica dias contados e, portanto, limitados; a formulação comunica naturalmente a duração finita da vida sem acrescentar uma interpretação além do grego.
- source_word: καιρόν
  choice: um tempo estabelecido
  rationale: Neste contexto, καιρός designa um período fixado ou oportunamente determinado, não o tempo em sentido abstrato. “Tempo estabelecido” é claro e preserva essa nuance.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: O termo expressa autoridade ou direito concedido, e não mera força; “autoridade” mantém a ideia de poder delegado sem sugerir domínio absoluto.
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: as coisas que há nela
  rationale: A expressão mantém a referência pronominal elíptica do grego. O pronome feminino provavelmente retoma “terra” no versículo anterior, mas não se explicita isso no texto principal.
theological_decisions:
- issue: Alcance do governo humano em ἐξουσίαν τῶν ἐπ᾿ αὐτῆς
  choice: A humanidade recebe autoridade sobre as coisas que há na terra.
  alternative: A humanidade recebe autoridade sobre a própria terra ou poder sobre a vida terrena em geral.
  rationale: A construção aponta mais naturalmente para aquilo que está sobre a terra, dentro do tema da criação, mas o texto preserva o pronome e evita transformar a autoridade concedida em posse absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima do grego, enquanto “um número determinado de dias” e “as coisas que há nela” tornam os respectivos idiomatismos naturais em português. Os marcadores aparecem em ordem sequencial no texto.
