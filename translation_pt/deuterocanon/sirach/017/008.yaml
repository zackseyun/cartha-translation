lexical_decisions:
- source_word: ὄνομα ἁγιασμοῦ
  choice: o nome de santidade
  rationale: Mantém a construção genitiva do grego e evita transformar sem indicação textual a expressão em «o santo nome». Embora menos idiomática, a formulação preserva a possível referência ao nome caracterizado pela santidade ou ligado à consagração.
- source_word: αἰνέσουσιν
  choice: louvarão
  rationale: Futuro do verbo αἰνέω, expresso naturalmente pelo futuro simples em português.
- source_word: καί
  choice: e
  rationale: Conserva a ligação coordenativa do fragmento com o contexto anterior.
theological_decisions:
- issue: Relação entre «nome» e «santidade»
  choice: Preservar o genitivo «nome de santidade»
  alternative: «santo nome»
  rationale: O grego apresenta ἁγιασμοῦ como substantivo no genitivo, não o adjetivo «santo». A tradução mantém essa tensão sem decidir se se trata de um nome santo, do nome ligado à santidade ou de uma expressão cultual mais específica.
translation_notes:
  register: Português moderno e digno. A expressão «nome de santidade» é deliberadamente formal por refletir uma construção incomum do grego; a nota oferece a leitura idiomática possível.
