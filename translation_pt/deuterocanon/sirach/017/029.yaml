  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: pt
  text: Como é grande a misericórdia do Senhor e a expiação[a] para os que se voltam para ele!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meio de expiação”; o termo também pode ser traduzido por “propiciação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Como é grande
  rationale: A construção ὡς com o adjetivo tem força exclamativa. “Como é grande” a reproduz de modo natural em português.
- source_word: ἐλεημοσύνη
  choice: misericórdia
  rationale: Com referência ao Senhor e em paralelo com ἐξιλασμός, designa misericórdia ou compaixão divina, não a prática de dar esmolas.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Mantém a forma portuguesa consagrada e natural para o título divino κύριος.
- source_word: ἐξιλασμός
  choice: expiação
  rationale: Preserva a ideia de remoção da culpa e restauração da relação sem reduzir o termo simplesmente a “perdão” nem impor um modelo doutrinário mais estreito.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: para os que se voltam
  rationale: Expressa o movimento de retorno ou conversão a Deus e soa natural em português contemporâneo.
- source_word: ἐπʼ αὐτόν
  choice: para ele
  rationale: Com ἐπιστρέφω, indica a pessoa para quem alguém se volta; a repetição de “para” é idiomática e torna clara a relação.
theological_decisions:
- issue: Sentido de ἐξιλασμός
  choice: expiação
  alternative: propiciação; meio de expiação
  rationale: “Expiação” conserva a remoção da culpa e a dimensão reconciliadora do termo. “Propiciação” é possível, mas pode sugerir uma formulação doutrinária mais específica do que o grego exige.
- issue: Relação da expiação com o Senhor
  choice: Não acrescentar um possessivo antes de “expiação”
  alternative: sua expiação
  rationale: O contexto associa a expiação ao Senhor, mas o texto grego não repete um genitivo nem contém um possessivo. A tradução preserva essa concisão e a leve ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto de exclamação explicita a força exclamativa de ὡς. Evitou-se “esmola” para ἐλεημοσύνη e não se acrescentou o possessivo ausente no grego.
