base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/028.yaml
  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: pt
  text: Do morto, como de quem já não existe, desaparece o louvor[a]; quem está vivo e com saúde louvará o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desaparece a ação de graças”. O termo grego também pode significar “confissão”, mas o paralelo com “louvará o Senhor” favorece aqui o sentido de louvor ou ação de graças.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: Do morto
  rationale: O singular é genérico e indica que o louvor já não procede de uma pessoa morta. A formulação é concisa e preserva a construção grega com ἀπό.
- source_word: ὡς μηδὲ ὄντος
  choice: como de quem já não existe
  rationale: Expressa a comparação retórica do morto com alguém que não existe, sem transformar a frase numa afirmação metafísica sobre o estado dos mortos.
- source_word: ἀπόλλυται
  choice: desaparece
  rationale: O verbo indica que algo se perde, deixa de estar presente ou perece. “Desaparece” soa natural em português e combina claramente com “louvor”.
- source_word: ἐξομολόγησις
  choice: louvor
  rationale: Embora o substantivo também possa significar “ação de graças” ou “confissão”, o paralelismo com αἰνέσει τὸν κύριον favorece aqui o sentido de louvor dirigido ao Senhor.
- source_word: ζῶν καὶ ὑγιὴς
  choice: quem está vivo e com saúde
  rationale: Preserva os dois elementos da expressão e estabelece um contraste natural com o morto.
- source_word: αἰνέσει
  choice: louvará
  rationale: Mantém o futuro do verbo grego e sua ligação lexical direta com “louvor” na primeira oração.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Neste contexto sapiencial judaico, κύριος se refere a Deus; “o Senhor” é a forma portuguesa consagrada e adequada.
theological_decisions:
- issue: 'Sentido de ἐξομολόγησις: confissão, ação de graças ou louvor'
  choice: louvor
  alternative: ação de graças; confissão
  rationale: O paralelismo com “louvará o Senhor” favorece “louvor”. A nota preserva as possibilidades lexicais legítimas sem introduzir indevidamente a ideia específica de confissão de pecados.
- issue: Força de ὡς μηδὲ ὄντος em relação ao estado dos mortos
  choice: como de quem já não existe
  alternative: como de quem não é; como se não existisse
  rationale: A tradução mantém a força retórica do grego, mas não a amplia para uma definição doutrinária sobre a existência ou consciência após a morte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Do morto” conserva a concisão proverbial do grego; “com saúde” evita o tom coloquial de “bem” e mantém explicitamente o sentido de ὑγιής.
