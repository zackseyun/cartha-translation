  text: Who will sing praise to the Most High in Hades[b][a], instead of the living who give thanks?
translation:
  language: pt
  text: Quem louvará o Altíssimo no Hades[a], em lugar dos vivos que lhe rendem graças[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no Sheol» ou «na sepultura»; o grego traz «no Hades», referindo-se aqui ao domínio dos mortos.
    reason: lexical_alternative
  - marker: b
    text: «Rendem graças» também pode ser traduzido por «oferecem reconhecimento» ou «fazem confissão», no sentido de louvor agradecido no culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: o Altíssimo
  rationale: O dativo indica aquele que recebe o louvor; «o Altíssimo» é a forma corrente do título divino Ὕψιστος.
- source_word: τίς αἰνέσει
  choice: Quem louvará
  rationale: O pronome interrogativo e o futuro de αἰνέω formam uma pergunta retórica. «Louvará» traduz diretamente o verbo sem acrescentar necessariamente a ideia de canto.
- source_word: ἐν ᾅδου
  choice: no Hades
  rationale: Mantém o termo do testemunho grego e designa aqui o domínio dos mortos, sem identificá-lo com uma doutrina posterior de punição final.
- source_word: ἀντὶ ζώντων
  choice: em lugar dos vivos
  rationale: Preserva o valor contrastivo ou substitutivo de ἀντί e a oposição entre os mortos e os vivos.
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: que lhe rendem graças
  rationale: A expressão pode indicar reconhecimento, confissão ou ação de graças. Neste contexto de louvor, «rendem graças» comunica naturalmente o reconhecimento agradecido dirigido a Deus; «lhe» explicita em português o destinatário já expresso no verso.
theological_decisions:
- issue: Sentido de ᾅδης no contexto sapiencial
  choice: Hades como domínio dos mortos
  alternative: sepultura; Sheol; inferno como lugar de punição final
  rationale: O verso contrasta os mortos com os vivos quanto à capacidade de louvar. Não exige a noção posterior de punição final, e a tradução mantém o termo do texto grego, explicando-o em nota.
- issue: Alcance de ἀνθομολόγησις
  choice: ação de graças no contexto de louvor
  alternative: reconhecimento; confissão
  rationale: O campo semântico permite mais de uma nuance. A tradução adota a que melhor se ajusta ao contexto cultual, enquanto a nota preserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe simples. «Hades» foi mantido por fidelidade ao testemunho grego e esclarecido em nota. O verbo principal foi traduzido por «louvará», sem acrescentar uma nuance musical não exigida por αἰνέω.
