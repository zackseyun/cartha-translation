  source_fidelity: A primeira oração traduz adequadamente πλὴν μετανοοῦσιν ἔδωκεν ἐπάνοδον. Na segunda, «a perseverar» é uma explicitação possível, mas resolve a construção concisa ἐκλείποντας ὑπομονήν mais do que o necessário. «Desfaleciam na perseverança» mantém mais diretamente a relação entre o desfalecimento e a perseverança, sem sugerir que o infinitivo esteja expresso no grego.
  naturalness: «Contudo, aos que se arrependem ele concedeu um retorno» é natural e de registro apropriado. «Os que desfaleciam na perseverança» é claro em português moderno e conserva o tom elevado, mas acessível, do contexto.
  terminology: «Arrependem», «concedeu», «retorno», «encorajou» e «perseverança» são escolhas adequadas. «Retorno» preserva prudentemente a abertura semântica de ἐπάνοδος.
