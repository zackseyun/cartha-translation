  text: Yet to those who repent he granted a return[c][b][a], and he encouraged those who were failing in patience.
translation:
  language: pt
  text: Contudo, aos que se arrependem ele concedeu um retorno[c][b], e encorajou os que desfaleciam na perseverança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encorajou os que desfaleciam a perseverar”. A construção grega é compacta e admite mais de uma interpretação.'
    reason: alternative_reading
  - marker: b
    text: “Um retorno” também pode ser entendido como “um caminho de volta” ou “restauração”.
    reason: lexical_alternative
  - marker: c
    text: A validação desta fonte grega indica uma divergência significativa; por isso, a formulação exata deve ser considerada com cautela, embora o sentido geral seja claro.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Contudo
  rationale: Mantém a transição adversativa do grego de modo natural e digno em português.
- source_word: μετανοοῦσιν
  choice: aos que se arrependem
  rationale: O particípio presente substantivado no dativo designa os que se arrependem, preservando o sentido verbal ativo.
- source_word: ἔδωκεν
  choice: concedeu
  rationale: Expressa adequadamente o ato de dar ou proporcionar quando o objeto é um retorno.
- source_word: ἐπάνοδον
  choice: um retorno
  rationale: Permanece próximo do sentido básico do substantivo e não especifica indevidamente se se trata de volta a Deus, restauração ou recuperação.
- source_word: παρεκάλεσεν
  choice: encorajou
  rationale: Preserva a amplitude de παρακαλέω entre exortação e consolo, salientando aqui o fortalecimento solidário.
- source_word: ἐκλείποντας
  choice: os que estavam desfalecendo
  rationale: Comunica a ideia de perder as forças ou fraquejar sem restringi-la necessariamente ao âmbito físico.
- source_word: ὑπομονήν
  choice: a perseverar
  rationale: Converte em expressão verbal portuguesa a construção grega compacta, produzindo uma frase natural; a nota registra a alternativa sintática.
theological_decisions:
- issue: Sentido de ἐπάνοδον no contexto do arrependimento
  choice: um retorno
  alternative: um caminho de volta; restauração
  rationale: A tradução mantém aberta a natureza precisa do retorno e evita transformar o substantivo em uma formulação doutrinária mais específica que o grego.
- issue: Relação de ὑπομονήν com παρεκάλεσεν ἐκλείποντας
  choice: encorajou os que estavam desfalecendo a perseverar
  alternative: confortou com perseverança os que estavam desfalecendo
  rationale: O grego é sintaticamente compacto. A leitura principal entende a perseverança como aquilo a que os enfraquecidos são encorajados, enquanto a nota preserva a possibilidade de entendê-la como algo comunicado ou proporcionado no encorajamento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível; “desfalecendo” conserva a imagem de perda de forças, e a ambiguidade sintática final é preservada em nota.
