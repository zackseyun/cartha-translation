  source_fidelity: 'A tradução preserva a estrutura paralela do grego: olhos/viram e ouvidos/ouviram, bem como a repetição de «glória». «Uma glória majestosa» comunica adequadamente μεγαλεῖον δόξης em português atual. A troca interpretativa do possessivo final («dele») não é apresentada como leitura literal e está devidamente qualificada em nota, que registra o αὐτῶν transmitido e a dificuldade textual.'
