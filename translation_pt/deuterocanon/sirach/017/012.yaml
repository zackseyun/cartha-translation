  text: Their eyes saw a majestic glory[a], and their ears heard the glory of his voice.
translation:
  language: pt
  text: Seus olhos viram uma glória majestosa, e seus ouvidos ouviram a glória da voz dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego transmitido diz literalmente: “o ouvido deles ouviu a glória da voz deles”. O texto é difícil; pelo contexto, a tradução entende que se trata da voz de Deus.'
    reason: textual_variant
lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: uma glória majestosa
  rationale: A expressão grega associa grandeza ou majestade à glória. Esta formulação é natural em português e conserva o caráter elevado da visão.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: seus olhos
  rationale: Mantém a menção explícita aos olhos e o paralelismo corporal com os ouvidos.
- source_word: δόξαν
  choice: glória
  rationale: Preserva a repetição de δόξα no versículo e seu sentido de esplendor manifesto.
- source_word: δόξαν φωνῆς αὐτῶν
  choice: a glória da voz dele
  rationale: A construção transmitida é difícil. A tradução conserva 'glória' e entende a voz, pelo contexto da revelação divina, como a voz de Deus; a forma literal do pronome grego é registrada em nota.
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: seus ouvidos ouviram
  rationale: Embora o grego empregue 'ouvido' no singular, o plural distributivo é mais idiomático em português e mantém o paralelismo com 'seus olhos'.
theological_decisions:
- issue: Referente do pronome em 'voz'
  choice: voz dele, entendida como a voz de Deus
  alternative: voz deles
  rationale: O texto grego transmitido traz αὐτῶν, 'deles', mas essa leitura produz uma declaração difícil no contexto. A referência à voz de Deus oferece o sentido contextual mais coerente, sem ocultar a forma grega, que é apresentada na nota.
translation_notes:
  register: Português atual, claro e solene, com paralelismo entre olhos e ouvidos. A repetição de “glória” foi mantida para refletir o grego, e a dificuldade do pronome foi explicitada em nota.
