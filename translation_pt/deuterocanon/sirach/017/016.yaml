  text: All their works are before him like the sun[a], and his eyes are continually upon their ways.
translation:
  language: pt
  text: Todas as obras deles estão diante dele como o sol[a], e os olhos dele estão sempre sobre os caminhos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todas as ações deles estão diante dele como o sol”. A comparação provavelmente destaca que as ações humanas estão plenamente expostas diante de Deus.'
    reason: Registra a alternativa lexical para ἔργα e esclarece, sem inseri-la no texto, a provável força da comparação elíptica com o sol.
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: Todas as obras deles
  rationale: “Todas” expressa a totalidade enfática de ἅπαντα, enquanto “obras” mantém a amplitude de ἔργα, que pode abranger feitos, ações e seus resultados.
- source_word: ὡς ὁ ἥλιος
  choice: como o sol
  rationale: Preserva de modo direto a comparação introduzida por ὡς, sem acrescentar ideias como “claras” ou “à luz”, que estão apenas implícitas.
- source_word: ἐναντίον αὐτοῦ
  choice: diante dele
  rationale: Expressa naturalmente presença e plena exposição perante Deus, sem transformar a imagem em explicação abstrata.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: os olhos dele
  rationale: Mantém a imagem antropomórfica concreta do grego e evita a possível ambiguidade referencial de “seus olhos” em português.
- source_word: ἐνδελεχεῖς
  choice: estão sempre
  rationale: Reproduz em português corrente a ideia de constância ou continuidade comunicada pelo adjetivo grego na oração nominal.
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: sobre os caminhos deles
  rationale: Conserva a metáfora de “caminhos”, que pode indicar tanto trajetos quanto o modo de viver e agir.
theological_decisions:
- issue: Linguagem antropomórfica sobre o conhecimento divino
  choice: Manter “os olhos dele estão sempre sobre os caminhos deles”.
  alternative: Ele observa continuamente a conduta deles.
  rationale: A formulação escolhida preserva a imagem corporal empregada pelo texto para comunicar a percepção constante de Deus, sem reduzi-la a uma paráfrase abstrata.
- issue: Sentido da comparação com o sol
  choice: Manter a formulação elíptica “diante dele como o sol”.
  alternative: Todas as obras deles estão tão manifestas diante dele quanto o sol.
  rationale: A alternativa explicita uma provável ideia de visibilidade, mas o grego não contém um adjetivo como “manifestas”. A tradução preserva a concisão e a tensão da comparação original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “dele/deles” foi mantida para distinguir com clareza Deus das pessoas mencionadas. A sintaxe conserva deliberadamente a comparação concisa e um pouco elíptica do grego.
