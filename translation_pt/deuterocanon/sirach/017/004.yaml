  text: And he placed his fear upon all flesh[a], and to rule over beasts and birds.
translation:
  language: pt
  text: E pôs sobre toda carne o temor que ele inspira[a] e concedeu-lhe dominar feras e aves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre todo ser vivo”. A expressão grega diz literalmente “sobre toda carne” e, aqui, refere-se amplamente às criaturas vivas.
    reason: Alternativa lexical e esclarecimento do idioma coletivo.
lexical_decisions:
- source_word: ἔθηκεν
  choice: pôs
  rationale: Reproduz de modo direto e natural o aoristo de τίθημι, preservando a imagem concreta de colocar algo sobre outros seres.
- source_word: τὸν φόβον αὐτοῦ
  choice: o temor dele
  rationale: Mantém tanto o sentido básico de φόβος quanto o pronome singular do grego. No contexto, o pronome retoma o ser humano representativo; “temor” evita intensificar indevidamente para “terror”.
- source_word: ἐπὶ πάσης σαρκός
  choice: sobre toda carne
  rationale: Conserva a expressão bíblica e a abrangência coletiva do grego. Uma nota esclarece que, neste contexto, “carne” designa os seres vivos.
- source_word: κατακυριεύειν
  choice: lhe concedeu dominar
  rationale: O infinitivo exprime a capacidade ou autoridade concedida ao ser humano. A formulação portuguesa explicita a ligação sintática necessária sem enfraquecer a ideia de domínio.
- source_word: θηρίων
  choice: feras
  rationale: Verte θηρία de maneira concisa e digna, conservando sua referência típica aos animais, especialmente os selvagens.
- source_word: πετεινῶν
  choice: aves
  rationale: Equivalente corrente e preciso para os seres alados aqui mencionados.
theological_decisions:
- issue: Pronome singular representativo da humanidade
  choice: Manter o singular em “dele” e “lhe”
  alternative: Empregar o plural “deles” e “lhes” para explicitar o sentido coletivo
  rationale: O grego conserva formas singulares que retomam o ser humano como representante da humanidade. A tradução preserva essa forma sem transformá-la silenciosamente em plural.
- issue: Sentido coletivo de σάρξ
  choice: Traduzir literalmente como “toda carne”, com nota explicativa
  alternative: “todo ser vivo” ou “toda criatura viva”
  rationale: A expressão é coletiva e não tem aqui sentido moral. A tradução mantém a textura do original, enquanto a nota comunica seu alcance idiomático.
- issue: Relação do infinitivo κατακυριεύειν com a oração anterior
  choice: 'Explicitar em português a concessão de domínio: “lhe concedeu dominar”'
  alternative: Traduzir formalmente “e dominar”, deixando a ligação sintática elíptica
  rationale: O grego apresenta um infinitivo coordenado de forma compacta. A explicitação mínima produz português inteligível e preserva o sentido de autoridade concedida, sem identificar uma modalidade teológica além do contexto.
translation_notes:
  register: Português moderno, digno e acessível, com leve textura bíblica em “toda carne”. “Feras” e “aves” mantém concisão e paralelismo. O pronome singular foi preservado, e a sintaxe do infinitivo foi explicitada apenas o necessário para soar natural em português.
