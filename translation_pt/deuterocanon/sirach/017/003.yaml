  text: And he clothed them with strength[a], and made them according to his image.
translation:
  language: pt
  text: E os revestiu de força e os fez conforme a sua imagem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à sua imagem”. A expressão grega evoca a linguagem da criação em Gênesis.'
    reason: Registra uma tradução portuguesa mais idiomática da construção e explicita a alusão intertextual sem alterar o texto principal.
lexical_decisions:
- source_word: ἐνέδυσεν
  choice: revestiu
  rationale: Preserva a metáfora concreta do verbo grego, literalmente ligado ao ato de vestir, sem reduzi-la ao sentido mais abstrato de “dotou”.
- source_word: ἰσχύν
  choice: força
  rationale: É o equivalente corrente e natural de ἰσχύς neste contexto, sem ampliar o sentido para uma noção mais abstrata de poder ou autoridade.
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: conforme a sua imagem
  rationale: Reflete κατά com acusativo e mantém a alusão à linguagem da criação em Gênesis. “Conforme” soa natural em português e conserva a ideia de correspondência ao modelo.
- source_word: ἐποίησεν
  choice: fez
  rationale: Reproduz o sentido amplo de ποιέω sem introduzir a especificidade de “criou” ou “formou”, que não é exigida pelo verbo nesta oração.
- source_word: αὐτούς
  choice: os
  rationale: O pronome masculino plural retoma os seres humanos coletivamente e conserva de modo conciso a referência plural do grego.
theological_decisions:
- issue: Antropologia alusiva a Gênesis em κατ᾿ εἰκόνα αὐτοῦ
  choice: conforme a sua imagem
  alternative: à sua imagem
  rationale: A formulação mantém a relação entre a humanidade e a imagem de Deus e preserva a construção comparativa do grego, sem acrescentar explicações doutrinárias sobre a natureza dessa imagem.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição de “os” mantém os dois verbos ligados ao mesmo referente plural; a metáfora “revestiu de força” foi preservada.
