  text: Return to the Lord and leave sins behind[b][a]; pray before his face and lessen stumbling.
translation:
  language: pt
  text: Volte-se para o Senhor e deixe os pecados para trás; suplique na presença dele[a] e reduza o que causa tropeço[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante da face”; isto é, diretamente na presença do Senhor.
    reason: lexical_alternative
  - marker: b
    text: Ou “reduza o obstáculo” ou “diminua o motivo de queda”. O termo grego pode indicar um impedimento ou algo que leva alguém a tropeçar moralmente.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: Volte
  rationale: O imperativo de ἐπιστρέφω indica voltar-se ou retornar. “Volte” expressa de modo natural o movimento em direção ao Senhor sem acrescentar toda a carga teológica de “arrependa-se”.
- source_word: ἐπὶ Κύριον
  choice: para o Senhor
  rationale: Com ἐπιστρέφω, ἐπί com acusativo indica direção. “Para o Senhor” é idiomático em português e conserva o título κύριος.
- source_word: ἀπόλειπε ἁμαρτίας
  choice: deixe os pecados para trás
  rationale: Mantém o plural “pecados” e comunica separação decisiva em linguagem atual, sem o tom mais arcaico de “abandone” ou “renuncie a”.
- source_word: δεήθητι
  choice: suplique
  rationale: O verbo δέομαι denota pedido insistente ou súplica. “Suplique” preserva essa especificidade melhor do que o termo mais amplo “ore”.
- source_word: κατὰ πρόσωπον
  choice: na presença dele
  rationale: A expressão literalmente relacionada a estar “diante da face” funciona como idioma de presença direta. O pronome retoma “o Senhor”, implícito como referente no grego.
- source_word: σμίκρυνον
  choice: reduza
  rationale: O imperativo significa tornar menor, diminuir ou reduzir. “Reduza” é claro e combina naturalmente com a expressão explicativa adotada a seguir.
- source_word: πρόσκομμα
  choice: o que causa tropeço
  rationale: πρόσκομμα pode designar obstáculo, motivo de tropeço ou causa de queda. A formulação mantém aberta a natureza concreta ou moral desse impedimento.
theological_decisions:
- issue: Expressão antropomórfica κατὰ πρόσωπον sem pronome explícito
  choice: na presença dele
  alternative: diante da sua face
  rationale: A opção principal transmite em português natural a ideia de aproximar-se diretamente do Senhor. “Dele” explicita apenas o referente já dado no contexto, enquanto a nota conserva a imagem literal.
- issue: Sentido ético de πρόσκομμα
  choice: o que causa tropeço
  alternative: o obstáculo; o motivo de queda
  rationale: A tradução evita decidir se o impedimento é uma disposição interior, uma ocasião externa de pecado ou uma causa de tropeço para outros. Assim, preserva-se a amplitude do substantivo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de imperativos foi preservada, assim como o plural “pecados” e a ambiguidade de πρόσκομμα.
