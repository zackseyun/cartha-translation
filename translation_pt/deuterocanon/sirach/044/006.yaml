  text: Men of valor[a], steadfast in strength, and at ease in their place.
translation:
  language: pt
  text: Homens de valor[a], firmes em sua força e tranquilos em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “homens ricos, dotados de força, vivendo em paz em seus assentamentos”. Aqui se segue prioritariamente o hebraico, usando-se o grego como testemunho paralelo.'
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  choice: homens de valor
  rationale: A expressão hebraica descreve homens notáveis por capacidade, força ou valentia. “Homens de valor” conserva essa amplitude elogiosa sem restringir o sentido à riqueza ou ao valor militar.
- source_word: וסמכי כח
  choice: firmes em sua força
  rationale: A expressão sugere força estabelecida ou sustentada. Esta formulação é natural em português e preserva a ideia de vigor firme, sem adotar a leitura excessivamente literal e incerta de “sustentadores da força”.
- source_word: ושוקטים
  choice: tranquilos
  rationale: O particípio comunica quietude, repouso ou vida pacífica; “tranquilos” expressa de modo claro esse estado de paz estabelecida.
- source_word: על מכונתם
  choice: em seu lugar
  rationale: מכונה pode indicar lugar fixo, base ou situação estabelecida. “Em seu lugar” mantém a amplitude do hebraico e evita especificar indevidamente “moradas”, embora o paralelo grego favoreça um contexto de assentamento.
