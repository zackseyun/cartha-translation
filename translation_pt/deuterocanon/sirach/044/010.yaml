  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: pt
  text: Mas estes[a] foram homens de misericórdia, cujas ações justas[b] não foram esquecidas;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Genizá do Cairo é difícil e parece estar deslocado neste ponto. Traduzido mais literalmente, diz algo como: “Como se não tivessem existido, existiram, e seus filhos depois deles.” O texto principal segue o paralelo grego coerente deste versículo.'
    reason: textual_variant
  - marker: b
    text: Ou “atos de justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: Mas estes
  rationale: O hebraico preservado parece deslocado ou corrompido neste ponto; a leitura grega oferece uma transição adversativa coerente com o contexto, sem ocultar a dificuldade textual.
- source_word: ἄνδρες
  choice: homens
  rationale: Mantém o masculino plural explícito do texto grego.
- source_word: ἐλέους
  choice: de misericórdia
  rationale: Preserva a construção caracterizadora do grego e seu provável sabor semítico, em registro digno e compreensível.
- source_word: δικαιοσύναι
  choice: ações justas
  rationale: O plural indica manifestações concretas de justiça ou retidão, não apenas uma qualidade abstrata; a formulação é natural em português.
- source_word: οὐκ ἐπελήσθησαν
  choice: não foram esquecidas
  rationale: Expressa diretamente o sentido do verbo grego e mantém o contraste contextual com a perda da memória no versículo anterior.
theological_decisions:
- issue: Tensão textual entre o hebraico preservado e o paralelo grego
  choice: Traduzir no texto principal a leitura grega coerente, registrando em nota a leitura difícil do hebraico.
  alternative: “Como se não tivessem existido, existiram, e seus filhos depois deles.”
  rationale: Embora o hebraico tenha prioridade quando preservado com segurança, a linha fornecida parece não corresponder adequadamente a este lugar. O grego apresenta uma leitura estável e contextualmente apropriada; a nota preserva com transparência a evidência hebraica e sua incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “homens de misericórdia” conserva deliberadamente a forma semítica refletida no grego; “ações justas” comunica o caráter concreto do plural sem restringi-lo a uma interpretação denominacional.
