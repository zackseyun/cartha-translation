review_pass:
  verdict: revise
  source_fidelity: A primeira frase preserva adequadamente o hebraico transmitido, que diz que foi suscitado um filho para Isaque por causa de Abraão, seu pai. Porém, "antepassado" não é uma tradução lexicalmente justificável de ראשון, cujo sentido básico é "primeiro" e, neste contexto, possivelmente "primogênito". A dificuldade da expressão hebraica deve permanecer visível, sem substituí-la por uma interpretação patriarcal. O grego diverge de modo substancial e deve ser apresentado como leitura alternativa em nota.
  naturalness: '"Também fez surgir para Isaque um filho" é compreensível e apropriado para o registro bíblico moderno. "A aliança de todo primogênito" continua deliberadamente áspero, pois reproduz uma construção hebraica difícil; a nota explica essa dificuldade. "Abraão, pai de Isaque" evita a ambiguidade potencial de "pai dele".'
  terminology: '"Isaque", "Abraão", "aliança", "bênção" e "Israel" são adequados. "Primogênito" traduz ראשון de modo mais fiel do que "antepassado". "Israel" deve permanecer sem explicitação, preservando a possível referência simultânea ao patriarca e à sua descendência.'
  issues:
  - severity: medium
    issue: '"antepassado" traduz ראשון em "Deu-lhe a aliança de cada antepassado".'
    rationale: ראשון significa primariamente "primeiro"; pode designar "primogênito" conforme o contexto. Não há base lexical suficiente para "antepassado", e essa opção suaviza uma dificuldade textual que deve ser mantida.
  - severity: low
    issue: A nota b chama a expressão literal de "a aliança de cada primeiro" e propõe "antepassado" no contexto.
    rationale: A formulação literal é pouco precisa e a proposta contextual introduz um sentido não assegurado pelo hebraico. A nota deve identificar "todo primogênito" como a tradução mais direta e reconhecer que a construção permanece obscura.
  - severity: low
    issue: '"pai dele" pode ter referência sintaticamente menos nítida em português.'
    rationale: Embora o hebraico se refira a Abraão como pai de Isaque, "pai de Isaque" comunica essa relação sem ambiguidade e não altera o sentido.
