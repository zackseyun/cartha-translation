base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/022.yaml
  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: pt
  text: Também fez surgir para Isaque um filho[a], por causa de Abraão, pai de Isaque. Deu-lhe a aliança de todo primogênito[b], e a bênção repousou sobre a cabeça de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente “fez surgir para Isaque um filho”. O grego apresenta uma leitura substancialmente diferente: “em Isaque estabeleceu ... uma bênção para toda a humanidade e uma aliança”.'
    reason: textual_variant
  - marker: b
    text: 'O hebraico diz literalmente “a aliança de todo primogênito”, mas a expressão é difícil. O grego traz uma leitura diferente: “uma bênção para toda a humanidade e uma aliança”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: Também fez surgir para Isaque um filho
  rationale: Mantém o בן (“filho”) do texto hebraico transmitido e traduz הקים de modo natural, sem apagar a dificuldade textual. A preposição ל é vertida como “para”.
- source_word: בעבור אברהם אביו
  choice: por causa de Abraão, pai dele
  rationale: Preserva o valor causal de בעבור. “Pai dele” evita que a construção portuguesa pareça identificar Abraão como pai do sujeito não expresso, embora o referente continue sendo Isaque.
- source_word: ברית כל ראשון נתיו
  choice: Deu-lhe a aliança de cada antepassado
  rationale: נתיו é representado explicitamente por “deu-lhe”. ראשון pode designar alguém anterior ou ancestral; “antepassado” produz uma frase compreensível no contexto da enumeração dos patriarcas, sem adotar no texto principal a leitura grega divergente. A expressão hebraica, contudo, permanece difícil.
- source_word: וברכה נחה על ראש ישראל
  choice: e a bênção repousou sobre a cabeça de Israel
  rationale: Conserva tanto o verbo נחה (“repousou”) como a imagem concreta de uma bênção sobre a cabeça. O nome “Israel” não é expandido, preservando sua referência imediata a Jacó e sua possível ressonância coletiva.
theological_decisions:
- issue: Identidade de “Israel”
  choice: Manter apenas o nome próprio “Israel”
  alternative: Explicitar “Jacó, isto é, Israel” ou entender Israel coletivamente como o povo
  rationale: Na sequência Abraão–Isaque–Israel, a referência imediata é provavelmente o patriarca Jacó; o nome, porém, também evoca seus descendentes. A tradução mantém essa abertura.
- issue: Relação entre o filho, a aliança e a bênção
  choice: Preservar as duas frases e os elementos distintos do hebraico
  alternative: 'Reestruturar todo o versículo segundo o grego: “em Isaque estabeleceu... a bênção de toda a humanidade e uma aliança”'
  rationale: O hebraico fornecido contém explicitamente “filho” e depois “aliança”. Fundi-los resolveria silenciosamente uma dificuldade textual e eliminaria conteúdo do testemunho hebraico principal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla compreensão lusófona e legibilidade brasileira. O texto principal segue prioritariamente o hebraico transmitido; as divergências substanciais do grego são registradas em notas, sem harmonização silenciosa.
