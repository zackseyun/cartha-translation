  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: pt
  text: A memória deles permanecerá para sempre[a], e a sua justiça não será esquecida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “A descendência deles permanecerá para sempre, e a sua glória não será apagada.” O manuscrito de Massada também traz “descendência/semente” onde o hebraico da Geniza do Cairo aqui traz “memória”.'
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: a memória deles
  rationale: זֵכֶר designa a memória ou lembrança preservada de alguém. “A memória deles” é direto, natural em português e mantém o contraste com o esquecimento na segunda oração.
- source_word: יעמד
  choice: permanecerá
  rationale: Embora עמד signifique literalmente “ficar de pé”, aqui expressa duração e continuidade. “Permanecerá” comunica naturalmente o sentido contextual sem perder a ideia de constância.
- source_word: עד עולם
  choice: para sempre
  rationale: A expressão idiomática hebraica indica duração permanente; “para sempre” é a equivalência corrente e clara em português.
- source_word: וצדקתם
  choice: e a sua justiça
  rationale: צדקה pode indicar justiça, retidão ou conduta justa. “Justiça” preserva a forma nominal e a amplitude do hebraico, sem explicitar indevidamente “atos justos”.
- source_word: לא תשכח
  choice: não será esquecida
  rationale: A forma passiva é reproduzida diretamente e cria um paralelismo natural com “a memória deles”.
theological_decisions:
- issue: Tradição hebraica do Cairo em comparação com a leitura grega e de Massada
  choice: 'Traduzir no texto principal a leitura hebraica da Geniza do Cairo: “A memória deles permanecerá para sempre, e a sua justiça não será esquecida.”'
  alternative: “A descendência deles permanecerá para sempre, e a sua glória não será apagada.”
  rationale: O testemunho hebraico principal fornecido sustenta “memória” e “justiça”. Contudo, o grego e o manuscrito de Massada preservam uma variante relevante, com “descendência/semente” e, no grego, “glória”; por isso, ela é registrada em nota, sem substituir silenciosamente o texto hebraico adotado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “permanecerá” ao literal “ficará de pé” por naturalidade contextual; “justiça” conserva a amplitude semântica e a tensão do substantivo hebraico.
