base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: pt
  text: 'Noé foi achado justo e íntegro;

    no tempo da destruição, tornou-se um substituto.[a]

    Por causa dele, restou um remanescente,

    e, por sua aliança, o dilúvio cessou.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma troca”, “uma compensação” ou “um resgate”. O hebraico תחליף e o grego ἀντάλλαγμα expressam a ideia de algo ou alguém dado em lugar de outro.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diverge nesta oração final e aponta para a ocorrência do dilúvio, em vez de seu término. O testemunho hebraico adotado aqui diz: “e, por sua aliança, o dilúvio cessou”.'
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: צדיק
  choice: justo
  rationale: Preserva o sentido de retidão moral e corresponde naturalmente ao grego δίκαιος.
- source_word: תמים
  choice: íntegro
  rationale: Neste contexto, descreve inteireza de caráter, não perfeição absoluta; “íntegro” é natural em português e mantém a distinção em relação a “justo”.
- source_word: לעת כלה
  choice: no tempo da destruição
  rationale: כלה indica aqui ruína ou destruição catastrófica, e não apenas o fim cronológico.
- source_word: תחליף
  choice: um substituto
  rationale: O termo designa algo ou alguém posto no lugar de outro; o paralelo grego ἀντάλλαγμα confirma a noção de troca ou compensação, embora a nuance exata permaneça aberta.
- source_word: בעבורו
  choice: Por causa dele
  rationale: 'Expressa de modo claro a relação causal: em razão de Noé houve sobreviventes.'
- source_word: שארית
  choice: restou um remanescente
  rationale: שארית pode indicar o grupo sobrevivente preservado em meio ao juízo; “remanescente” conserva essa ressonância bíblica.
- source_word: ובבריתו
  choice: por sua aliança
  rationale: A preposição foi entendida instrumentalmente. O sufixo se refere mais naturalmente a Noé, isto é, à aliança vinculada a ele, sem explicitar além do que diz o hebraico.
- source_word: חדל מבול
  choice: o dilúvio cessou
  rationale: חדל significa cessar ou chegar ao fim; a tradução segue diretamente o testemunho hebraico.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego na oração final
  choice: 'Seguir o hebraico preservado: “e, por sua aliança, o dilúvio cessou”'
  alternative: O paralelo grego transmitido aponta para a ocorrência do dilúvio, em vez de seu término.
  rationale: Como há testemunho hebraico para esta passagem de Sirácida, ele recebe prioridade. A divergência altera substancialmente o sentido e, por isso, é registrada em nota, sem harmonização silenciosa.
- issue: Sentido de Noé como תחליף
  choice: “tornou-se um substituto”
  alternative: “tornou-se uma troca”, “uma compensação” ou “um resgate”
  rationale: Tanto o hebraico quanto o paralelo grego expressam algo dado ou colocado em lugar de outra coisa. A formulação concisa preserva a tensão teológica sem explicar de que modo Noé teria exercido essa função.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético discreto. “Íntegro” evita sugerir perfeição absoluta; “remanescente” mantém a linguagem bíblica sem soar excessivamente arcaica. As notas foram posicionadas junto às expressões a que efetivamente se referem.
