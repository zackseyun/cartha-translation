  source_fidelity: 'O texto principal traduz fielmente o hebraico da Genizá: עם זרעם é bem expresso por “Com seus descendentes”; טובם נאמן pela formulação ampla “o bem deles permanece firme”; e ונחלתם לבני בניהם por “sua herança passa aos filhos de seus filhos”. A explicitação de “passa” é compatível com o campo semântico de herança e a construção dativa/final com ל. A nota identifica adequadamente a tradição alternativa grega e o testemunho de Massada, sem a introduzir no texto principal.'
