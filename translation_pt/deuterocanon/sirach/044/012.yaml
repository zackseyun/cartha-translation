  text: With their offspring their good endures faithfully[a], and their inheritance is for their children's children.
translation:
  language: pt
  text: Com seus descendentes, o bem deles permanece firme[a], e sua herança passa aos filhos de seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Sua descendência permaneceu nas alianças, e seus filhos, por causa deles”. O testemunho hebraico mais antigo de Massada também apresenta uma leitura voltada para a aliança, em vez de “o bem deles [...] e sua herança”, como nos manuscritos da Genizá do Cairo.'
    reason: Registra uma importante leitura alternativa preservada pelo grego e pelo testemunho hebraico de Massada.
lexical_decisions:
- source_word: עם זרעם
  choice: Com seus descendentes
  rationale: עם expressa associação, e זרע designa aqui a posteridade. “Descendentes” é claro e natural em português, sem reproduzir literalmente a imagem de “semente”.
- source_word: נאמן טובם
  choice: o bem deles permanece firme
  rationale: טובם pode abranger bondade, bem-estar ou prosperidade, por isso “o bem deles” preserva sua amplitude. נאמן comunica firmeza, segurança ou permanência; a formulação verbal torna natural a construção hebraica concisa sem eliminar sua ambiguidade.
- source_word: ונחלתם
  choice: e sua herança passa
  rationale: נחלה é herança ou patrimônio transmitido. O verbo “passa”, implícito na frase nominal hebraica, explicita com naturalidade a transmissão entre gerações.
- source_word: לבני בניהם
  choice: aos filhos de seus filhos
  rationale: A expressão hebraica enfatiza a continuidade por várias gerações. A tradução mantém essa forma em vez de reduzi-la a “netos”.
theological_decisions:
- issue: Diferença entre o texto hebraico da Genizá do Cairo e a tradição grega, com apoio do testemunho hebraico mais antigo de Massada
  choice: Traduzir no texto principal a leitura hebraica preservada na edição de Kahana, centrada no bem e na herança que permanecem com os descendentes.
  alternative: “Sua descendência permaneceu nas alianças, e seus filhos, por causa deles”, segundo a forma grega, ou uma leitura hebraica de Massada que explicite a aliança.
  rationale: O hebraico sobrevivente é a fonte principal e tem alta confiança, embora seja conciso. Como o grego e o testemunho de Massada conservam uma leitura significativamente diferente e voltada para a aliança, essa variante é registrada em nota, sem substituir silenciosamente o hebraico principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o paralelismo e a concisão do hebraico; “o bem deles” mantém aberta a referência à bondade, ao bem-estar ou à prosperidade.
