  text: rulers of the land in their kingdoms[a], and men renowned for their might; counselors in their understanding[b], and seers of all things in their prophecy.
translation:
  language: pt
  text: 'Governantes da terra em seus reinos[a],

    e homens de renome por sua força;

    conselheiros por seu discernimento,

    e videntes de tudo em sua profecia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “governantes da terra” é difícil. O paralelo grego diz “os que exerciam domínio em seus reinos”, apoiando este sentido.
    reason: alternative_reading
  - marker: b
    text: Ou, quanto ao paralelo grego, “os que proclamavam por meio de profecias”. O hebraico é breve e diz literalmente “videntes de tudo em sua profecia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: governantes da terra
  rationale: A expressão hebraica é difícil, mas o contexto político de במלכותם e o paralelo grego κυριεύοντες apontam para pessoas que exercem domínio. “Da terra” mantém a referência concreta ao território governado.
- source_word: במלכותם
  choice: em seus reinos
  rationale: מלכות pode indicar realeza, reinado ou reino. O plural “reinos” se ajusta ao retrato político e concorda com o paralelo grego βασιλείαις.
- source_word: אנשי שם
  choice: homens de renome
  rationale: A expressão significa literalmente “homens de nome” e funciona como um idioma para homens célebres. A formulação preserva o masculino explícito do hebraico.
- source_word: בגבורתם
  choice: por seu poder
  rationale: גבורה abrange força, poder e valentia. “Poder” comunica naturalmente a capacidade notável desses homens sem restringir o sentido à bravura militar.
- source_word: היועצים
  choice: conselheiros
  rationale: A forma designa aqueles que dão conselho. “Conselheiros” é conciso, corrente e adequado à enumeração de figuras ilustres.
- source_word: בתבונתם
  choice: por seu discernimento
  rationale: תבונה denota entendimento, perspicácia ou discernimento. “Por seu discernimento” expressa de modo natural em português a qualidade pela qual aconselhavam.
- source_word: וחוזי כל
  choice: e videntes de tudo
  rationale: חוזי significa “videntes”, enquanto כל, sem objeto mais explícito, produz uma expressão breve e ambígua. “De tudo” preserva essa amplitude sem especificar indevidamente o conteúdo das visões.
- source_word: בנבואתם
  choice: em sua profecia
  rationale: O substantivo pode referir-se à profecia ou ao pronunciamento profético. O singular coletivo e a preposição são mantidos para refletir de perto o hebraico.
theological_decisions:
- issue: Linguagem masculina no catálogo de antepassados honrados
  choice: homens de renome
  alternative: pessoas de renome
  rationale: O hebraico emprega explicitamente o substantivo masculino אנשי. A tradução conserva essa forma gramatical e histórica sem generalizá-la nem neutralizá-la.
- issue: Alcance da percepção profética
  choice: videntes de tudo em sua profecia
  alternative: os que proclamavam por meio de profecias
  rationale: O hebraico é conciso e pode sugerir videntes com amplo alcance, ao passo que o grego enfatiza a proclamação profética. O texto principal segue o hebraico sem transformar a frase em uma afirmação doutrinária mais precisa do que a fonte permite; a nota registra o paralelo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética em quatro linhas conserva o paralelismo enumerativo do hebraico. As escolhas mantêm a concisão e a ambiguidade da última expressão, recorrendo ao grego apenas como testemunho de apoio e alternativa registrada em nota.
