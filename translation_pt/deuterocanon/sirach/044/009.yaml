base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: pt
  text: E há alguns de quem não há lembrança[a]; deixaram de existir como se nunca tivessem existido, e o mesmo aconteceu com seus filhos depois deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico é mais curto e diz literalmente: “Há alguns dos quais não há lembrança, e cessaram como cessaram”. O paralelo grego preserva uma forma mais completa do pensamento: “pereceram como se não tivessem existido [...] e seus filhos depois deles”. O texto principal toma o hebraico como fonte primária e usa o grego para esclarecer sua formulação condensada.'
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: Há também alguns
  rationale: Expressa naturalmente a ideia partitiva do hebraico, que destaca alguns entre os antepassados mencionados no contexto.
- source_word: אשר אין לו זכר
  choice: dos quais não ficou lembrança
  rationale: זכר pode indicar lembrança ou memorial. Aqui, “não ficou lembrança” comunica em português corrente que nenhuma memória deles permaneceu, sem pressupor um monumento físico.
- source_word: וישבתו
  choice: deixaram de existir
  rationale: O verbo שבת exprime cessação. A formulação preserva esse sentido sem sugerir necessariamente morte violenta, como poderia ocorrer com “foram destruídos”.
- source_word: כאשר שבתו
  choice: como se nunca tivessem existido
  rationale: 'O hebraico preservado é extremamente comprimido e repete a ideia de cessar. O paralelo grego explicita o provável sentido da comparação: desapareceram como quem nunca existiu.'
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: e o mesmo aconteceu com seus filhos depois deles
  rationale: O paralelo grego contém esta conclusão, ausente no testemunho hebraico preservado. A tradução portuguesa comunica com clareza que os descendentes tiveram o mesmo destino de esquecimento.
