  to: E há alguns de quem não há lembrança[a]; deixaram de existir como se nunca tivessem existido, e o mesmo aconteceu com seus filhos depois deles.
  rationale: A revisão limita-se a retirar “também”, para não acrescentar uma ênfase não expressa no hebraico. Mantêm-se a expansão apoiada pelo grego e a nota textual, que preserva transparentemente a diferença entre os testemunhos.
