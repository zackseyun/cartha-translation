translation:
  language: pt
  text: O Altíssimo repartiu honra abundante[a][b], e a sua grandeza vem desde a eternidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os manuscritos hebraicos da Guenizá do Cairo trazem חלק עליון, enquanto o manuscrito mais antigo de Massada traz חולק עליון, leitura que sustenta o sentido “o Altíssimo repartiu/distribuiu”. O paralelo grego diz: “O Senhor criou muita glória”.'
    reason: textual_variant
  - marker: b
    text: Ou “glória abundante”. O hebraico כבוד e o grego δόξα podem significar “honra” ou “glória”, conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “desde os tempos antigos” ou “desde tempos remotos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רב
  choice: abundante
  rationale: Em רב כבוד, indica grande quantidade ou intensidade. “Honra abundante” é natural em português e preserva a amplitude da expressão.
- source_word: כבוד
  choice: honra
  rationale: כבוד pode significar “honra” ou “glória”. No contexto da celebração de homens ilustres e com o verbo distributivo, “honra” se encaixa bem; “glória” permanece como alternativa em nota.
- source_word: חלק / חולק
  choice: repartiu
  rationale: A leitura חולק do manuscrito de Massada sustenta uma forma verbal, tendo “o Altíssimo” como sujeito. “Repartiu” conserva a ideia distributiva de חלק em português corrente e digno.
- source_word: עליון
  choice: o Altíssimo
  rationale: Título divino consagrado e imediatamente compreensível em português.
- source_word: וגדלו
  choice: e a sua grandeza
  rationale: A leitura nominal com sufixo, “sua grandeza”, é apoiada pelo paralelo grego τὴν μεγαλωσύνην αὐτοῦ. A construção hebraica não identifica de modo totalmente explícito o referente do pronome, por isso a tradução não o explicita além do texto.
- source_word: מימות עולם
  choice: vem desde a eternidade
  rationale: A expressão pode apontar para a eternidade ou para tempos remotíssimos. “Vem desde a eternidade” reproduz a leitura principal sem eliminar as alternativas, registradas em nota.
theological_decisions:
- issue: Sujeito e sintaxe da primeira oração
  choice: 'O Altíssimo é o sujeito: “O Altíssimo repartiu honra abundante”.'
  alternative: “O Senhor criou muita glória” ou “Grande honra é a porção do Altíssimo”.
  rationale: O hebraico é a fonte principal onde está preservado, e a leitura mais antiga de Massada, חולק, favorece uma oração verbal com o Altíssimo como sujeito. O grego apresenta ἔκτισεν, “criou”, provavelmente refletindo uma variante textual ou interpretação, mencionada em nota.
- issue: Alcance temporal de מימות עולם
  choice: desde a eternidade
  alternative: desde os tempos antigos; desde tempos remotos
  rationale: A expressão hebraica admite tanto antiguidade remota quanto eternidade. A leitura principal acompanha o peso da formulação no contexto da grandeza divina, enquanto a nota preserva a amplitude semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Repartiu” conserva a nuance distributiva sem soar excessivamente técnica; “vem desde” fornece a cópula exigida pelo português e mantém a cadência poética.
