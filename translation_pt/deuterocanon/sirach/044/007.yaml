  text: All these were honored in their generations[a], and in their days they were a glory.
translation:
  language: pt
  text: Todos eles foram honrados em suas gerações e, em seus dias, foram uma glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz uma oração nominal compacta, literalmente: “e, em seus dias, sua glória”. O paralelo grego diz: “e, em seus dias, [houve] motivo de orgulho/glória”. A tradução expressa o sentido em português natural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  choice: Todos eles
  rationale: Retoma de maneira natural as pessoas mencionadas anteriormente, sem acrescentar ao hebraico uma especificação como “homens”.
- source_word: בדורם
  choice: em suas gerações
  rationale: Mantém o termo “gerações” e segue o apoio do paralelo grego no plural, indicando as épocas históricas às quais essas pessoas pertenciam.
- source_word: ומימיהם
  choice: e, em seus dias
  rationale: Expressa o sentido temporal mais provável da construção hebraica, confirmado pelo paralelo grego, sem substituí-lo pela explicação mais ampla “durante a vida deles”.
- source_word: תפארתם
  choice: foram uma glória
  rationale: תפארת pode indicar glória, esplendor ou motivo de honra. A formulação portuguesa torna inteligível a oração nominal compacta e preserva a ideia de que essas pessoas constituíam uma glória em seu tempo.
