base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: pt
  text: Por isso, confirmou-lhe com juramento que, em sua descendência, as nações seriam abençoadas e que lhes daria por herança desde um mar até o outro[a], e desde o Rio[b] até os confins da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da edição citada traz literalmente uma forma semelhante a «de águas até o mar», mas o paralelo grego diz «de mar a mar», provavelmente preservando a fórmula territorial pretendida; a tradução segue esse sentido.
    reason: textual_variant
  - marker: b
    text: «O Rio» é a maneira bíblica convencional de se referir ao Eufrates em textos sobre limites territoriais e promessas de terra.
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: Por isso
  rationale: Conector inferencial natural que apresenta a consequência do elogio anterior a Abraão.
- source_word: בשבועה הקים לו
  choice: confirmou-lhe com juramento
  rationale: A construção com הקים e linguagem de juramento indica confirmar ou estabelecer solenemente uma promessa; o objeto implícito fica recuperável pelo contexto em português.
- source_word: לברך בזרעו גוים
  choice: que, em sua descendência, as nações seriam abençoadas
  rationale: Mantém a formulação passiva apoiada pelo paralelo grego e preserva a ressonância da promessa abraâmica sem especificar além do texto a agência ou o valor exato da preposição ב.
- source_word: זרעו
  choice: sua descendência
  rationale: Expressa o singular coletivo hebraico de modo natural em português, sem limitar a referência a um único descendente nem recorrer ao menos claro «semente».
- source_word: להנחילם
  choice: que lhes daria por herança
  rationale: Traduz o hifil de נחל como concessão de uma herança. O pronome «lhes» conserva a referência pronominal do texto sem substituir explicitamente seu antecedente.
- source_word: מים עד ים
  choice: desde um mar até o outro
  rationale: O hebraico citado traz literalmente uma forma semelhante a «de águas até o mar», mas o paralelo grego preserva a conhecida fórmula territorial «de mar a mar»; a redação portuguesa comunica esse sentido de modo natural.
- source_word: ומנהר
  choice: e desde o Rio
  rationale: A designação convencional «o Rio» preserva a referência bíblica provável ao Eufrates sem inserir o nome próprio no texto principal.
- source_word: עד אפסי ארץ
  choice: até os confins da terra
  rationale: Equivalente português corrente e digno para o idioma hebraico que indica os limites ou extremos da terra.
theological_decisions:
- issue: Agência e sentido preposicional na promessa de bênção abraâmica
  choice: em sua descendência, as nações seriam abençoadas
  alternative: por meio de sua descendência, ele abençoaria as nações
  rationale: A forma passiva concorda com o paralelo grego e evita definir de maneira excessiva tanto a agência quanto o valor instrumental ou locativo da preposição hebraica.
- issue: Antecedente do sufixo em להנחילם
  choice: lhes daria por herança
  alternative: daria à sua descendência por herança
  rationale: O pronome reproduz a referência anafórica do original e evita explicitar um antecedente que a forma hebraica não nomeia novamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega «descendência» para o coletivo hebraico e mantém a linguagem bíblica tradicional em «o Rio» e «confins da terra». Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
