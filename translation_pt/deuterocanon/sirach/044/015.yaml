  text: Their wisdom is proclaimed by the assembly[b][a], and their praise is recounted by the congregation.
translation:
  language: pt
  text: A assembleia repete a sabedoria deles,[a][b] e a congregação relata o louvor deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico dos manuscritos da Genizá do Cairo diz literalmente: «A assembleia repete a sabedoria deles, e a congregação relata o louvor deles». O paralelo grego diz: «Os povos contarão a sabedoria deles, e a assembleia anunciará o louvor deles». O texto principal segue o hebraico, a testemunha primária aqui, enquanto esta nota registra o sujeito mais amplo do grego: «os povos».'
    reason: alternative_reading
  - marker: b
    text: O rolo de Massada está fragmentário neste versículo e conserva apenas a frase final correspondente a «o louvor deles ... congregação/assembleia», não o verso inteiro.
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  choice: a sabedoria deles
  rationale: Reproduz de modo direto o substantivo חכמה com o sufixo possessivo masculino plural, evitando a possível ambiguidade de «sua sabedoria».
- source_word: תשנה
  choice: repete
  rationale: O verbo שנה tem aqui o sentido de repetir ou recitar. A construção ativa com «a assembleia» como sujeito segue naturalmente a sintaxe hebraica e sugere transmissão pública.
- source_word: עדה
  choice: a assembleia
  rationale: עדה designa a comunidade reunida. «Assembleia» preserva o caráter coletivo e permite distingui-la de קהל no segundo membro.
- source_word: ותהלתם
  choice: e o louvor que recebem
  rationale: תהלה significa «louvor». A explicitação «que recebem» evita que «louvor deles» seja entendido como louvor proferido por eles, sem alterar o referente contextual.
- source_word: יספר
  choice: relata
  rationale: ספר, neste contexto, indica contar ou narrar publicamente. «Relata» mantém o paralelismo com «repete» em português corrente e digno.
- source_word: קהל
  choice: a congregação
  rationale: קהל é o povo reunido ou a congregação. A escolha conserva a distinção lexical e o paralelismo poético com עדה.
