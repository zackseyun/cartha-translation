  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: pt
  text: Mas estes são homens de amor leal[a][b], e a esperança deles não cessará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Com a descendência deles permanece uma boa herança: seus descendentes.” O texto hebraico da Genizá do Cairo, seguido aqui, diz: “estes são homens de amor leal, e a esperança deles não cessará”. O manuscrito de Massada também apresenta, no contexto próximo, uma redação diferente, centrada na descendência e na permanência.'
    reason: textual_variant
  - marker: b
    text: Ou “amor constante”, “misericórdia” ou “lealdade” (hebraico חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Introduz o contraste com os que, no contexto anterior, caíram no esquecimento; “Mas” exprime de modo conciso a força adversativa.
- source_word: אֵלֶּה
  choice: estes
  rationale: Mantém diretamente o demonstrativo hebraico, que aponta para os antepassados exemplares em questão.
- source_word: אַנְשֵׁי
  choice: homens de
  rationale: Reproduz a forma masculina plural e a construção hebraica que descreve esses antepassados.
- source_word: חֶסֶד
  choice: amor fiel
  rationale: Expressa tanto o aspecto afetivo como a constância e lealdade relacionais de חֶסֶד, sem restringir o termo apenas a bondade ou misericórdia.
- source_word: וְתִקְוָתָם
  choice: e a esperança deles
  rationale: תקוה significa naturalmente “esperança”; a formulação explícita com “deles” é clara e evita uma sequência potencialmente ambígua de possessivos.
- source_word: לֹא תִשְׁבֹּת
  choice: não cessará
  rationale: Preserva o sentido de deixar de existir ou parar, sem definir além do texto como essa esperança perdura.
theological_decisions:
- issue: Divergência textual entre o hebraico da Genizá do Cairo e o paralelo grego
  choice: 'Traduzir no texto principal a leitura hebraica existente: “estes são homens de amor fiel, e a esperança deles não cessará”.'
  alternative: 'Seguir o grego: “Com a descendência deles permanecerá uma excelente herança: os descendentes deles”, ou harmonizar o versículo com tradições voltadas para descendência e permanência.'
  rationale: Como há texto hebraico preservado, ele fundamenta a tradução principal. O grego representa aqui uma linha substancialmente diferente e, por isso, deve ser registrado em nota, não incorporado silenciosamente ao hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a concisão e o contraste do hebraico, mantém a referência masculina aos antepassados e registra sem harmonização a importante variante grega.
