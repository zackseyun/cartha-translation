translation:
  language: pt
  text: Louvarei agora os homens de amor leal[a], nossos pais em suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Louvemos, pois, homens ilustres e nossos pais em sua geração”. O hebraico traz “homens de amor leal”.'
    reason: Registra a diferença entre o texto hebraico e o paralelo grego quanto ao número verbal, à descrição dos homens e ao número de “geração”.
lexical_decisions:
- source_word: אהללה נא
  choice: Louvarei agora
  rationale: A forma hebraica é um coortativo na primeira pessoa do singular, que aqui se expressa naturalmente como uma declaração enfática de intenção. נא é representado por “agora”. O grego traz uma exortação no plural, registrada na nota.
- source_word: אנשי חסד
  choice: homens de amor leal
  rationale: Preserva o sentido amplo de חסד, que reúne amor, bondade e lealdade, sem reduzi-lo apenas a piedade religiosa nem assimilá-lo ao grego “homens ilustres”.
- source_word: אבותינו
  choice: nossos pais
  rationale: Reproduz diretamente o termo familiar masculino do hebraico e mantém o tom tradicional e solene da evocação histórica.
- source_word: בדורותם
  choice: em suas gerações
  rationale: Mantém o plural do hebraico e aponta para os sucessivos períodos históricos em que viveram os pais mencionados.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na abertura e na descrição dos homenageados
  choice: 'Seguir no texto principal o hebraico: “Louvarei agora os homens de amor leal”.'
  alternative: 'O grego diz: “Louvemos, pois, homens ilustres e nossos pais em sua geração”.'
  rationale: O testemunho hebraico existente tem prioridade, enquanto a diferença material do grego é preservada de modo transparente em nota, sem decidir se resulta de outra Vorlage ou de uma tradução interpretativa.
translation_notes:
  register: Português atual, digno e legível, com leve solenidade apropriada à abertura de um elogio aos antepassados. “Amor leal” conserva a densidade de חסד de maneira mais clara que uma formulação excessivamente literal ou confessional.
