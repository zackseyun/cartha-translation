  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
translation:
  language: pt
  text: Seus corpos foram recolhidos em paz[a][b], e seu nome vive de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “Seu corpo foi sepultado em paz”. O testemunho grego torna explícito o sentido funerário onde o hebraico diz “foram recolhidos em paz”.'
    reason: alternative_reading
  - marker: b
    text: 'O manuscrito de Massada preserva aqui uma leitura mais breve (“se/em paz foram recolhidos”), enquanto o texto da Genizá do Cairo diz: “Seus corpos foram recolhidos em paz”.'
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: seus corpos
  rationale: גויה designa o corpo, muitas vezes o cadáver. O contexto pede o plural em português, embora o paralelo grego use um singular coletivo.
- source_word: בשלום
  choice: em paz
  rationale: Mantém a expressão preposicional hebraica e corresponde ao grego ἐν εἰρήνῃ, sem reduzi-la apenas ao advérbio «pacificamente».
- source_word: נאספו
  choice: foram recolhidos
  rationale: O passivo de אסף pode funcionar como expressão de morte. «Foram recolhidos» preserva a formulação do hebraico e permite perceber o sentido funerário sem inserir no texto principal o verbo explícito «sepultar» do grego.
- source_word: ושמם
  choice: e seu nome
  rationale: «Nome» conserva a imagem bíblica de reputação e memória duradouras, sem substituí-la por uma abstração interpretativa.
- source_word: חי
  choice: vive
  rationale: Reproduz a personificação vívida do hebraico e concorda com o grego ζῇ; «perdura» seria mais explicativo e menos imagético.
- source_word: לדור ודור
  choice: de geração em geração
  rationale: É a formulação portuguesa natural para a continuidade através de gerações sucessivas e mantém de perto o idioma hebraico.
theological_decisions:
- issue: Se a expressão hebraica de morte deve ser harmonizada com o grego «foi sepultado»
  choice: Manter no texto principal a leitura hebraica «foram recolhidos em paz»
  alternative: Seus corpos foram sepultados em paz
  rationale: Como o hebraico de Sirácida está preservado neste ponto, ele governa o texto principal. O grego esclarece o sentido funerário, mas sua explicitação deve ficar em nota, preservando a diferença entre as testemunhas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Recolhidos» preserva a ambiguidade formal do hebraico; as notas esclarecem tanto o sentido funerário do grego quanto a variante textual. Os marcadores seguem ordem alfabética no texto.
