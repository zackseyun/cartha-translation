  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: pt
  text: Alguns deles deixaram um nome[a], para serem louvados em sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Em sua herança” também pode ter o sentido de “entre os seus descendentes” ou “em seu legado”. O paralelo grego ressalta que os louvores deles são narrados.
    reason: lexical_alternative
lexical_decisions:
- source_word: יש מהם
  choice: Alguns deles
  rationale: Expressa naturalmente a construção partitiva hebraica, que destaca um grupo entre os antepassados mencionados.
- source_word: הניחו
  choice: deixaram
  rationale: Indica aquilo que permaneceu depois da vida deles; no contexto, trata-se da memória ou reputação legada.
- source_word: שם
  choice: um nome
  rationale: Preserva o idioma bíblico em que “nome” pode significar reputação, renome ou memória duradoura.
- source_word: להשתענות
  choice: para serem louvados
  rationale: A forma hebraica é difícil, mas aponta para menção elogiosa; o paralelo grego, que fala de narrar louvores, confirma esse sentido geral sem exigir que ele seja explicitado como “recontar”.
- source_word: בנחלתם
  choice: em sua herança
  rationale: Mantém a imagem concreta do hebraico e sua ambiguidade entre herança, legado e o círculo dos descendentes, esclarecida em nota.
theological_decisions:
- issue: Linguagem memorial de “nome” e “herança”
  choice: Conservar “um nome” e “em sua herança”.
  alternative: Alguns deles deixaram renome, para que seus descendentes contassem seus louvores.
  rationale: A formulação escolhida preserva a textura e a tensão lexical do hebraico, sem reduzir “herança” exclusivamente a descendentes nem substituir “nome” por uma interpretação abstrata.
translation_notes:
  register: Português atual, digno e de leitura ampla. A expressão “deixaram um nome” conserva um idioma bíblico compreensível; a nota esclarece a ambiguidade de “herança” sem resolvê-la no texto principal.
