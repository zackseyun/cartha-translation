base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/019.yaml
  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: pt
  text: Abraão, pai de uma multidão de nações, não lançou uma mancha sobre sua honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Abraão, grande pai de uma multidão de nações, e não se encontrou igual em glória” (ou “em honra”).'
    reason: Leitura alternativa do paralelo grego.
lexical_decisions:
- source_word: אב
  choice: pai
  rationale: O hebraico identifica Abraão diretamente como “pai”, em consonância com o grego πατήρ; “antepassado” seria menos direto.
- source_word: המון גוים
  choice: uma multidão de nações
  rationale: Preserva o sentido de המון e a ressonância da promessa feita a Abraão, além de corresponder ao grego πλήθους ἐθνῶν.
- source_word: לא נתן
  choice: não pôs
  rationale: Mantém a construção ativa do hebraico, literalmente próxima de “não deu/pôs”, mas usa em português a expressão natural “pôr mancha”.
- source_word: בכבודו
  choice: em sua honra
  rationale: כבוד admite “honra” ou “glória”; com “mancha”, “honra” forma uma expressão clara e natural sem excluir a nuance de glória.
- source_word: מום
  choice: mancha
  rationale: מום significa defeito ou mácula. “Mancha” comunica adequadamente, neste contexto, algo que comprometeria a honra de Abraão.
theological_decisions:
- issue: Relação entre a cláusula final hebraica e a grega
  choice: Traduzir o hebraico como uma afirmação de que Abraão não manchou sua honra.
  alternative: “e não se encontrou ninguém igual a ele em glória/honra”
  rationale: O testemunho hebraico preservado tem prioridade e apresenta מום, “mancha/defeito”, com uma construção ativa. O grego traz uma afirmação distinta sobre não haver igual; a diferença material é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A expressão “não pôs mancha em sua honra” preserva mais de perto a forma ativa e a imagem do hebraico do que uma formulação passiva como “nenhuma mancha foi encontrada”.
