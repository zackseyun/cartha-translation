  text: investigating the structure of song according to rule, and bearing proverbs in writing.
translation:
  language: pt
  text: os que investigaram cânticos segundo uma regra[a] e apresentaram provérbios por escrito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “segundo uma regra” é difícil. O paralelo grego diz “procuravam cânticos ou peças musicais”, favorecendo a ideia de música elaborada ou ordenada.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “provérbios”; o paralelo grego traz um termo mais amplo, que pode significar “ditos”, “versos” ou “enunciados” por escrito.
    reason: alternative_reading
lexical_decisions:
- source_word: חוקרי
  choice: investigaram
  rationale: O particípio de חקר descreve os que se dedicavam a examinar ou pesquisar; em português, o pretérito harmoniza naturalmente com o elogio retrospectivo dos antepassados no contexto.
- source_word: מזמור
  choice: cânticos
  rationale: מזמור pode designar cântico ou salmo. “Cânticos” preserva o sentido musical amplo sem restringi-lo ao uso litúrgico ou ao livro canônico dos Salmos.
- source_word: על חוק
  choice: segundo uma regra
  rationale: חוק indica algo fixado, prescrito ou regulado. A expressão hebraica é difícil neste contexto artístico; a tradução mantém a ideia de composição ordenada sem convertê-la diretamente no sentido musical mais explícito do grego.
- source_word: נושאי
  choice: apresentaram
  rationale: O particípio de נשא significa literalmente “levar” ou “portar”, mas, com provérbios em forma escrita, “apresentaram” comunica de modo natural a produção ou transmissão literária sem especificar excessivamente o processo.
- source_word: משל
  choice: provérbios
  rationale: משל abrange provérbio, máxima, parábola ou dito sapiencial. “Provérbios” é a opção mais direta no contexto da literatura de sabedoria, embora o paralelo grego seja mais amplo.
- source_word: בכתב
  choice: por escrito
  rationale: Tradução direta e idiomática da expressão hebraica, confirmada pelo paralelo grego ἐν γραφῇ.
