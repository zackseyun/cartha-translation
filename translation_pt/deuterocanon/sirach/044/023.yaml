base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/023.yaml
  text: He established him with a blessing[a], and gave him his inheritance; he set him over the tribes, as twelve divisions.
translation:
  language: pt
  text: Estabeleceu-o com uma bênção e lhe deu a sua herança; estabeleceu-o para as tribos, repartindo em doze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso: literalmente, “para dividir doze”, sem declarar o objeto. O paralelo grego explicita a relação com as tribos: “entre as tribos, repartiu [as porções] em doze”.'
    reason: A nota registra a elipse do hebraico e o esclarecimento parcial oferecido pelo paralelo grego, sem fixar no texto principal o objeto da divisão.
lexical_decisions:
- source_word: ויכוננהו
  choice: Firmou-o
  rationale: O hifil de כון expressa tornar firme ou estabelecer. “Firmou-o” mantém a imagem hebraica e soa natural no contexto da bênção concedida a Jacó.
- source_word: בברכה
  choice: com uma bênção
  rationale: A preposição ב admite valor instrumental ou concomitante; “com uma bênção” conserva essa abertura sem tornar explícita uma causalidade não exigida pelo hebraico.
- source_word: ויתן לו נחלתו
  choice: e lhe deu a sua herança
  rationale: נחלה designa herança, patrimônio ou porção atribuída. “Herança” é direto e também corresponde ao paralelo grego κληρονομία.
- source_word: ויציבהו לשבטים
  choice: constituiu-o em tribos
  rationale: יצב indica colocar ou estabelecer firmemente, enquanto ל pode introduzir o estado ou configuração resultante. A formulação entende o referente singular, Jacó/Israel, como constituído em tribos, sem introduzir a ideia menos segura de autoridade “sobre” elas.
- source_word: לחלק שנים עשר
  choice: dividindo-o em doze
  rationale: A expressão hebraica é comprimida e traz literalmente a ideia de dividir e o número doze, sem objeto expresso. O pronome retomado em português torna a construção inteligível, e “em doze” evita acrescentar “porções” ao texto principal.
theological_decisions:
- issue: Referente dos sufixos pronominais masculinos no singular
  choice: Mantêm-se os pronomes, entendidos contextualmente como referentes a Jacó/Israel, sem inserir seu nome no texto.
  alternative: Nomear Jacó explicitamente, seguindo o paralelo grego, ou deixar o referente patriarcal inteiramente indeterminado.
  rationale: O hebraico desta linha é elíptico, mas o contexto e o paralelo grego identificam Jacó. Preservar os pronomes reproduz a forma hebraica e evita explicitar no corpo do texto mais do que a fonte hebraica diz.
- issue: Relação de Jacó/Israel com as doze tribos
  choice: “constituiu-o em tribos, dividindo-o em doze” apresenta o singular coletivo Israel como organizado em doze.
  alternative: “estabeleceu-o sobre as tribos, como doze divisões” ou “colocou-o entre as tribos, para as dividir em doze porções”.
  rationale: O hebraico permite mais de uma análise por sua concisão. A leitura escolhida dá sentido natural à passagem do ancestral singular às doze tribos e não importa uma função de governo que o texto não afirma inequivocamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com colocação pronominal natural em registro bíblico contemporâneo. A repetição de “-o” preserva a cadeia referencial do hebraico; a nota acompanha a frase a que de fato se refere.
