  naturalness: A redação revista emprega português moderno e claro, preservando a concisão e a elipse do original. “Para as tribos” é menos interpretativo do que “em tribos”, e a nota esclarece a dificuldade sem a resolver no corpo do versículo.
  terminology: “Estabeleceu-o”, “bênção” e “herança” são escolhas adequadas e coerentes com o hebraico e com o paralelo grego. “Repartindo em doze” mantém a expressão final aberta, em vez de impor “porções” ou atribuir explicitamente às tribos um objeto que o hebraico não declara.
