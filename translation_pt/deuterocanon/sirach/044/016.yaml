  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: pt
  text: Enoque foi achado íntegro, andou com o SENHOR e foi levado — um sinal de conhecimento de geração em geração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz: “um exemplo de arrependimento para as gerações”.'
    reason: Registra uma variante antiga e teologicamente significativa em relação ao hebraico “um sinal de conhecimento de geração em geração”.
lexical_decisions:
- source_word: נמצא תמים
  choice: foi achado íntegro
  rationale: Mantém de perto a formulação hebraica e expressa integridade ou irrepreensibilidade sem sugerir perfeição absoluta.
- source_word: והתהלך עם יהוה
  choice: andou com o SENHOR
  rationale: Reproduz a conhecida imagem hebraica de viver em comunhão com Deus; SENHOR representa o nome divino יהוה na convenção portuguesa tradicional.
- source_word: ונלקח
  choice: foi levado
  rationale: Preserva a concisão e a ambiguidade do hebraico, sem explicitar destino ou mecanismo.
- source_word: אות דעת
  choice: um sinal de conhecimento
  rationale: Segue o texto hebraico atestado, apesar da leitura distinta do paralelo grego.
- source_word: לדור ודור
  choice: de geração em geração
  rationale: Equivalente idiomático natural da expressão distributiva hebraica.
theological_decisions:
- issue: Natureza do desaparecimento de Enoque
  choice: foi levado
  alternative: foi arrebatado
  rationale: A opção escolhida não acrescenta ao verbo hebraico uma descrição específica do modo como Enoque foi retirado.
- issue: Lição representada por Enoque
  choice: um sinal de conhecimento
  alternative: um exemplo de arrependimento
  rationale: A tradução principal prioriza o hebraico דעת, enquanto a divergência significativa do grego é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. A tradução permanece próxima do hebraico e registra em nota a divergência relevante do paralelo grego.
