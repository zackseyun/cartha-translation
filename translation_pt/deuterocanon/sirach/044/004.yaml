translation:
  language: pt
  text: líderes de nações em seus planos, e governantes em suas investigações[b]; sábios no discurso, em seus escritos[a], e os que governam em suas vigílias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os testemunhos hebraicos apresentam uma pequena variação nesta expressão: o texto da Genizá do Cairo diz “em sua escrita/seus escritos”, enquanto o rolo de Massada traz uma leitura estreitamente relacionada, “em seus livros”. Ambas apontam para sabedoria escrita ou literária.'
    reason: textual_variant
  - marker: b
    text: O paralelo grego difere em certa medida do hebraico nesta expressão, enfatizando entendimento ligado à administração escribal do povo. A tradução segue aqui o hebraico como testemunha principal, sem desconsiderar o grego.
    reason: alternative_reading
lexical_decisions:
- source_word: שרי גוים
  choice: líderes de nações
  rationale: שרי designa príncipes ou altos oficiais; “líderes” é claro e atual. גוים mantém o sentido político amplo de “nações”.
- source_word: במזמתם
  choice: em seus planos
  rationale: מזמה pode indicar plano, projeto ou deliberação. Aqui, no contexto de elogio, “planos” preserva o sentido positivo ou neutro, em consonância com o paralelo grego.
- source_word: ורוזנים
  choice: e governantes
  rationale: רוזנים designa dignitários ou autoridades elevadas. “Governantes” explicita a função política.
- source_word: במחקרותם
  choice: em suas investigações
  rationale: A expressão deriva do campo semântico de pesquisar, examinar ou inquirir. “Investigações” conserva essa atividade intelectual sem reduzi-la simplesmente a entendimento.
- source_word: חכמי שיח
  choice: sábios no discurso
  rationale: A expressão significa literalmente sábios de fala ou discurso. A formulação portuguesa preserva a ênfase na expressão ponderada e é digna e compreensível.
- source_word: בספרתם
  choice: por meio de seus escritos
  rationale: A leitura hebraica aponta para atividade escrita ou literária, e a variante “em seus livros” confirma esse campo semântico. “Por meio de” expressa como essa sabedoria se manifestava.
- source_word: ומושלים
  choice: e os que governavam
  rationale: O particípio de משל indica pessoas que exerciam governo. A forma verbal evita repetir “governantes” e preserva o paralelismo funcional.
- source_word: במשמרותם
  choice: em seus turnos de serviço
  rationale: משמרת pode significar turno de guarda, encargo ou serviço designado. “Turnos de serviço” conserva a ideia de dever organizado sem restringi-la indevidamente ao âmbito militar.
