translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantém o paralelismo da enumeração e conserva as ambiguidades reais de במחקרותם e משמרותם. A nota sobre a divergência grega foi omitida porque o marcador correspondente no material inglês estava aparentemente associado à frase errada; a tradução segue prioritariamente o hebraico fornecido.
