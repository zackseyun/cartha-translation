    issue: A expressão «por meio de seus escritos» é excessivamente instrumental para בספרתם.
    rationale: O hebraico admite mais diretamente «em sua escrita/em seus escritos»; a variante «em seus livros» reforça o campo da escrita, mas não exige que os escritos sejam o meio pelo qual a sabedoria é adquirida ou exercida.
  - severity: medium
    issue: «Os que governavam» desloca o particípio para o passado verbal.
    rationale: ומושלים designa os que exercem governo; «os que governam» conserva melhor seu valor, sem introduzir uma localização temporal não expressa.
