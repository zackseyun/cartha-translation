  text: who kept the commandments of the Most High and entered into covenant with him[a]. In his flesh he cut for him a statute[b], and in testing he was found faithful.
translation:
  language: pt
  text: que guardou os mandamentos do Altíssimo e entrou em aliança com ele. Em sua carne, estabeleceu para ele um estatuto[a] e, ao ser provado, mostrou-se fiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e em sua carne estabeleceu uma aliança”. O testemunho hebraico diz “um estatuto”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שמר מצות עליון
  choice: guardou os mandamentos do Altíssimo
  rationale: “Guardar os mandamentos” é uma expressão portuguesa natural e preserva a ideia de observância fiel; “Altíssimo” é o título divino consagrado.
- source_word: ובא בברית עמו
  choice: e entrou em aliança com ele
  rationale: Expressa com clareza o ingresso na relação de aliança indicado pelo hebraico, sem ampliar a formulação.
- source_word: בבשרו
  choice: Em sua carne
  rationale: Mantém a linguagem corporal concreta do hebraico e a provável alusão à circuncisão, sem explicitá-la no texto.
- source_word: כרת לו חק
  choice: estabeleceu para ele um estatuto
  rationale: Segue o substantivo hebraico חק, “estatuto”. Embora כרת signifique literalmente “cortou”, “estabeleceu” comunica melhor em português o sentido idiomático da instituição de uma ordenança; a possível ressonância com a circuncisão permanece no contexto de “carne”.
- source_word: ובניסוי נמצא נאמן
  choice: e, ao ser provado, mostrou-se fiel
  rationale: Traduz naturalmente a situação de prova e o resultado expresso por “foi achado fiel”, evitando a possível conotação moral indevida de “tentação”.
theological_decisions:
- issue: Alusão à circuncisão e à fidelidade de Abraão
  choice: Conservar “Em sua carne” e a linguagem de aliança sem explicitar a circuncisão no corpo do versículo.
  alternative: “Recebeu na carne a circuncisão como sinal da aliança.”
  rationale: O contexto identifica Abraão e torna provável a alusão, mas o hebraico permanece conciso e indireto; explicitá-la resolveria interpretativamente o que o texto apenas sugere.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Seguir no texto principal o hebraico “estatuto”.
  alternative: “Em sua carne, estabeleceu uma aliança com ele.”
  rationale: O testemunho hebraico existente tem prioridade, mas a leitura grega “aliança” é materialmente diferente e deve ser registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo, a concisão e a alusão corporal do hebraico sem recorrer ao literalismo pouco natural de “cortou um estatuto”.
