translation:
  language: pt
  text: Uma aliança eterna foi firmada com ele[a], para que toda carne não fosse destruída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “para que toda carne não fosse apagada por um dilúvio”, tornando explícito o contexto de Noé.'
    reason: alternative_reading
lexical_decisions:
- source_word: באות עולם
  choice: uma aliança eterna
  rationale: O hebraico testemunha uma formulação singular, e עולם indica duração permanente. Em português, “aliança eterna” conserva o peso bíblico e soa natural.
- source_word: נכרת עמו
  choice: foi firmada com ele
  rationale: כרת é o verbo idiomático usado para a celebração de uma aliança. A tradução literal “foi cortada” seria pouco natural e possivelmente obscura em português; “foi firmada” preserva o sentido solene e relacional.
- source_word: לבלתי
  choice: para que ... não
  rationale: A construção expressa finalidade ou resultado negativo. “Para que ... não” é clara e corrente.
- source_word: השחית
  choice: fosse destruído
  rationale: O verbo comunica destruição. A forma passiva preserva a estrutura e não acrescenta ao texto hebraico a menção explícita do dilúvio.
- source_word: כל בשר
  choice: nenhum ser vivo
  rationale: Literalmente, “toda carne”; no contexto do dilúvio, a expressão abrange os seres vivos. Com a negação, “nenhum ser vivo” comunica naturalmente em português o sentido de que a totalidade da vida não seria destruída, sem restringi-la apenas à humanidade.
theological_decisions:
- issue: Explicitar o dilúvio com base no paralelo grego
  choice: Manter no texto principal a formulação mais ampla do hebraico, sem mencionar explicitamente o dilúvio.
  alternative: “para que toda carne não fosse apagada por um dilúvio”
  rationale: O testemunho hebraico existente não contém equivalente explícito de κατακλυσμῷ (“por um dilúvio”). Como o hebraico é a fonte primária neste ponto, sua concisão é preservada no texto, enquanto a leitura grega é registrada em nota.
- issue: Representação de כל בשר
  choice: “nenhum ser vivo”
  alternative: “toda carne”
  rationale: A expressão hebraica abrange a vida sujeita à destruição no relato de Noé, não apenas os seres humanos. A formulação escolhida evita que “carne” seja entendida no sentido alimentar ou meramente corporal, sem estreitar o alcance teológico da aliança.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. “Foi firmada” traduz de modo natural o idioma hebraico de celebrar literalmente uma aliança; “ser vivo” esclarece a abrangência contextual de “carne”.
