base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: pt
  text: 'Instrução sobre a vergonha: escutem, filhos[a], e envergonhem-se de acordo com os meus juízos. Nem toda vergonha é apropriada para ser guardada, nem toda humilhação é preferível.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos” traduz a forma masculina do hebraico e conserva o modo de falar do mestre de sabedoria a seus discípulos.
    reason: cultural_note
  - marker: b
    text: 'O paralelo grego diz: “Portanto, envergonhem-se diante da minha palavra; pois não é bom guardar toda vergonha, e nem tudo é aprovado por todos na fé.” A oração final grega difere consideravelmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: מוסר
  choice: Instrução
  rationale: Na literatura de sabedoria, o termo designa formação, disciplina ou admoestação. Aqui introduz o ensino dirigido aos filhos, por isso “Instrução” comunica melhor o sentido sem sugerir castigo.
- source_word: בשת
  choice: vergonha
  rationale: É o equivalente amplo e natural do substantivo hebraico, preservando o tema central do versículo e sua correspondência com o grego αἰσχύνη.
- source_word: שמעו בנים
  choice: escutem, filhos
  rationale: “Escutem” expressa naturalmente o imperativo sapiencial, e “filhos” conserva a forma masculina explícita e a relação convencional entre mestre e discípulos.
- source_word: והכלמו
  choice: e envergonhem-se
  rationale: 'Mantém a força exortativa do verbo: os ouvintes devem sentir vergonha nos casos em que ela é moralmente adequada.'
- source_word: על משפטי
  choice: de acordo com os meus juízos
  rationale: Segue o hebraico, no qual משפטי indica juízos, decisões ou critérios do mestre. A locução “de acordo com” torna clara a função normativa da expressão sem substituir o termo por uma interpretação mais específica.
- source_word: לא כל בשת נאה לשמור
  choice: Nem toda vergonha é apropriada para ser guardada
  rationale: “Apropriada” traduz נאה como aquilo que convém, enquanto “ser guardada” conserva a imagem verbal de לשמור, “guardar, preservar”.
- source_word: ולא כל הכלם נבחר
  choice: nem toda humilhação é preferível
  rationale: “Humilhação” distingue הכלם do substantivo בשת da oração anterior, e “preferível” expressa o sentido de נבחר, literalmente “escolhida”, no contexto de uma avaliação ética.
theological_decisions:
- issue: Forma masculina do vocativo בנים
  choice: filhos
  alternative: filhos e filhas; crianças
  rationale: O hebraico emprega explicitamente o masculino plural e preserva a forma tradicional de tratamento do mestre de sabedoria a seus discípulos. A tradução não neutraliza nem amplia silenciosamente essa forma.
- issue: Divergência entre o hebraico e o grego na parte final
  choice: Seguir o texto hebraico no corpo da tradução
  alternative: 'Seguir o grego: “pois não é bom guardar toda vergonha, e nem tudo é aprovado por todos na fé”'
  rationale: O testemunho hebraico está disponível e é considerado de alta confiança. O grego parece refletir uma forma textual diferente, especialmente na oração final, por isso sua leitura é registrada em nota sem substituir o hebraico.
- issue: Valor moral ambivalente da vergonha
  choice: Preservar a distinção entre vergonha apropriada e humilhação não preferível
  alternative: Tratar toda vergonha como virtude ou como vício
  rationale: O próprio paralelismo hebraico avalia diferentes manifestações da vergonha de modos distintos. A tradução mantém essa tensão, sem impor uma avaliação teológica uniforme.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Instrução sobre a vergonha” funciona como abertura temática natural; “juízos” preserva o registro sapiencial e jurídico do hebraico. A repetição de “vergonha” é mantida onde lexicalmente central, enquanto “humilhação” sinaliza a mudança de forma hebraica na última oração.
