base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: pt
  text: Ó morte, como é amarga a lembrança de ti para o homem que vive tranquilo com o que possui,[a] para o homem sossegado e próspero em tudo, e que ainda tem forças para desfrutar de prazer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser entendida como “que repousa seguro em sua posição”. O grego diz: “que vive em paz com o que possui”.'
    reason: textual_variant
  - marker: b
    text: 'Hebraico: “ainda tem forças para receber prazer”. O paralelo grego diz mais especificamente: “ainda tem forças para receber alimento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: como é amarga a lembrança de ti
  rationale: Preserva a apóstrofe à morte e traduz זכרך / μνημόσυνον como a lembrança ou memória dela, sem transformar a afirmação numa caracterização abstrata da própria morte.
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: para o homem que vive tranquilo com o que possui
  rationale: A expressão hebraica é incerta; o paralelo grego aponta para alguém que vive em paz com seus bens ou recursos. A formulação portuguesa é natural e conserva essa ideia sem estreitá-la a riqueza.
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: para o homem sossegado
  rationale: שליו denota tranquilidade ou segurança despreocupada, enquanto o grego acrescenta a ideia de não estar perturbado ou distraído. “Sossegado” expressa bem o núcleo comum.
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: e próspero em tudo
  rationale: Reproduz de modo conciso a ideia, presente no hebraico e no grego, de êxito ou prosperidade abrangente.
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: e que ainda tem forças para desfrutar o prazer
  rationale: Segue prioritariamente o hebraico, no qual תענוג significa prazer ou deleite, e preserva a ideia de vigor para recebê-lo ou desfrutá-lo. O grego especifica alimento, leitura registrada em nota.
theological_decisions:
- issue: Linguagem masculina singular איש
  choice: o homem ... o homem
  alternative: a pessoa ... quem
  rationale: O texto apresenta uma figura masculina singular representativa. A tradução conserva essa forma sem acrescentar uma afirmação doutrinária sobre gênero.
- issue: Relação entre o hebraico e o paralelo grego na cláusula final
  choice: desfrutar o prazer no texto principal
  alternative: receber alimento
  rationale: Como o hebraico preservado traz תענוג, “prazer”, ele permanece no texto principal; a leitura mais específica do grego, τροφήν, “alimento”, é apresentada em nota, preservando a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição de “para o homem” conserva a estrutura enfática do original; “Ó morte” mantém a apóstrofe solene.
