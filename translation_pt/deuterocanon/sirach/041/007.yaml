  text: The children of a wicked father are cursed[a], for because of him they are a disgrace.
translation:
  language: pt
  text: Os filhos amaldiçoam um pai perverso[a], pois, por causa dele, ficam expostos à desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Os filhos censuram um pai ímpio, pois, por causa dele, serão desonrados”. O hebraico emprega um verbo mais forte, “amaldiçoam”, enquanto o grego enfatiza a censura e apresenta a desonra como futura.'
    reason: alternative_reading
lexical_decisions:
- source_word: אב רשע
  choice: um pai perverso
  rationale: A expressão hebraica é singular e especificamente paterna. “Perverso” comunica maldade moral em linguagem atual e digna; o paralelo grego também confirma a referência ao pai ímpio.
- source_word: יקוב
  choice: são amaldiçoados
  rationale: O hebraico admite aqui o sentido forte de maldição e, no contexto, é melhor entendido com valor passivo ou resultativo aplicado coletivamente aos filhos. O presente expressa uma máxima geral.
- source_word: ילד
  choice: os filhos
  rationale: Embora a forma hebraica seja singular ou coletiva, o sentido abrange a descendência; o plural também é confirmado pelo grego τέκνα.
- source_word: כי בגללו
  choice: pois, por causa dele
  rationale: Mantém explicitamente a relação causal e o pronome do hebraico, cujo referente — o pai — permanece claro.
- source_word: לחרפה
  choice: ficam expostos à desonra
  rationale: חרפה denota vergonha, opróbrio ou desonra social. Esta formulação natural evita sugerir que os filhos sejam moralmente vergonhosos em si e expressa que sofrem desonra por causa do pai.
theological_decisions:
- issue: Dar destaque à linguagem de maldição do hebraico ou à de censura do paralelo grego
  choice: são amaldiçoados
  alternative: são censurados / serão desonrados
  rationale: Como o texto hebraico está preservado e tem alta confiança, sua formulação mais forte rege o texto principal. A diferença de ênfase do grego é mantida em nota, sem harmonizar os testemunhos nem eliminar a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é conciso e sapiencial. “Pai” preserva a referência masculina específica; “ficam expostos à desonra” comunica o efeito social sem tornar os filhos agentes da vergonha.
