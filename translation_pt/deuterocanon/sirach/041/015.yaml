  text: Better is a man who hides his folly than a man who hides his wisdom[b][a]; instruction is shame.
translation:
  language: pt
  text: Melhor é o homem que esconde sua insensatez do que o homem que esconde sua sabedoria[b]; a disciplina é vergonha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico termina com uma expressão difícil, literalmente algo como “disciplina/correção de vergonha” (מוסר בשת). O grego não traz essa frase e apresenta apenas a comparação: “do que o homem que esconde sua sabedoria”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Melhor é uma pessoa que esconde sua insensatez do que alguém que esconde sua sabedoria”. O original usa a forma masculina singular “homem” em sentido representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב
  choice: Melhor é
  rationale: O contexto proverbial exige valor comparativo, confirmado pelo grego κρείσσων; a formulação preserva a concisão do hebraico.
- source_word: איש
  choice: o homem
  rationale: O hebraico emprega o substantivo masculino singular em sentido representativo, e o paralelo grego também usa o singular. Uma nota esclarece a abrangência.
- source_word: מצפין
  choice: que esconde
  rationale: O particípio repetido indica quem oculta ou mantém algo encoberto; a mesma formulação nas duas ocorrências conserva o paralelismo.
- source_word: אולתו
  choice: sua insensatez
  rationale: “Insensatez” pertence ao registro da literatura sapiencial e exprime אולת sem a aspereza coloquial de “estupidez”.
- source_word: חכמתו
  choice: sua sabedoria
  rationale: É o equivalente direto de חכמה e é confirmado pelo grego σοφία.
- source_word: מוסר בשת
  choice: a disciplina é vergonha
  rationale: A expressão hebraica final é difícil. A tradução retém seus dois elementos lexicais e, seguindo a revisão adjudicada, apresenta-os como uma breve oração nominal, sem apagar a dificuldade textual.
