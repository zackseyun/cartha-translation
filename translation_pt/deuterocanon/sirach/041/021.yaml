  text: of staring at the face of another man’s wife[a], and of drawing near to her maidservant.
translation:
  language: pt
  text: de fixar o olhar no rosto da esposa de outro homem[a] e de se aproximar da serva dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido como “uma mulher estranha” ou “uma mulher estrangeira”; o paralelo grego diz “uma mulher casada”, apoiando aqui o sentido “a esposa de outro homem”.
    reason: Leitura alternativa decorrente da amplitude semântica de זרה e da especificação presente no paralelo grego.
lexical_decisions:
- source_word: מהביט
  choice: de fixar o olhar
  rationale: O infinitivo hebraico significa “olhar, contemplar”. Neste catálogo de condutas vergonhosas, “fixar o olhar” comunica um olhar demorado e impróprio sem transformar o verbo em uma ação mais forte do que o contexto permite.
- source_word: אל פני
  choice: no rosto de
  rationale: Preserva a imagem concreta do hebraico, literalmente “para o rosto de”, em português natural.
- source_word: זרה
  choice: a esposa de outro homem
  rationale: זרה pode designar uma mulher estranha, alheia ou proibida ao homem em questão. O paralelo grego especifica “mulher casada”; por isso, “esposa de outro homem” expressa o sentido contextual provável, enquanto a nota preserva a amplitude do hebraico.
- source_word: ומהתקרב
  choice: e de se aproximar
  rationale: Reproduz de modo direto o infinitivo de קרב, “aproximar-se, chegar perto”, mantendo aberta a natureza exata da aproximação imprópria.
- source_word: שפחתה
  choice: da serva dela
  rationale: שפחה designa uma serva ou escrava. “Serva” é claro e digno no registro do texto, e “dela” conserva o sufixo possessivo feminino.
theological_decisions:
- issue: Identidade da mulher designada por זרה
  choice: a esposa de outro homem
  alternative: uma mulher estranha; uma mulher estrangeira; uma mulher casada
  rationale: O hebraico admite mais de um sentido e, isoladamente, não explicita o estado civil. O paralelo grego lê “mulher casada”, apoiando a referência a uma mulher que pertence à união conjugal de outro homem. A tradução adota esse sentido contextual, mas registra a ambiguidade lexical em nota, sem fazer dela uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção em minúscula e iniciada por “de” foi mantida porque o versículo fornecido funciona como continuação sintática da lista anterior. “Fixar o olhar” transmite a força contextual sem recorrer a uma formulação excessivamente coloquial.
