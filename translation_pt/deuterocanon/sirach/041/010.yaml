  text: Everything from nothing returns to nothing[a]; so the ungodly go from emptiness to emptiness.
translation:
  language: pt
  text: Tudo o que vem do nada volta ao nada[a]; assim, o ímpio vai do vazio ao vazio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Tudo o que vem da terra irá para a terra; assim, os ímpios vão da maldição para a destruição.” O texto grego reflete uma forma do versículo substancialmente diferente do hebraico sobrevivente.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: Tudo o que
  rationale: Expressa naturalmente em português o valor coletivo e distributivo de כל no início do provérbio.
- source_word: מאפס
  choice: do nada
  rationale: אפס indica aqui nada, inexistência ou nulidade; “do nada” preserva a concisão e a força do hebraico.
- source_word: אל אפס
  choice: ao nada
  rationale: Mantém a repetição de אפס e o movimento proverbial da origem ao destino.
- source_word: ישוב
  choice: volta
  rationale: שוב significa comumente voltar ou retornar; “volta” é corrente, claro e fiel neste contexto.
- source_word: כן
  choice: assim
  rationale: Introduz de modo natural a correspondência entre os dois membros do verso.
- source_word: חנף
  choice: o ímpio
  rationale: Embora possa significar “hipócrita”, no contexto sapiencial o termo tem sentido moral-religioso mais amplo; o grego ἀσεβεῖς também apoia “ímpio”.
- source_word: מתהו
  choice: do vazio
  rationale: תהו pode designar vazio, desolação, caos ou nulidade; “vazio” conserva a imagem de futilidade sem impor uma associação cosmológica.
- source_word: אל תהו
  choice: ao vazio
  rationale: Repete o mesmo termo para reproduzir a estrutura enfática do hebraico.
theological_decisions:
- issue: Sentido de חנף
  choice: o ímpio
  alternative: o hipócrita; o irreligioso
  rationale: “O ímpio” preserva o sentido moral-religioso amplo do hebraico, sem restringi-lo à hipocrisia comportamental; o paralelo grego reforça essa leitura.
- issue: Relação entre os testemunhos hebraico e grego
  choice: Traduzir o hebraico no texto principal e registrar a forma grega divergente em nota
  alternative: Adotar no texto principal “da terra à terra” e “da maldição à destruição”, ou harmonizar os testemunhos
  rationale: Como o hebraico está preservado e tem alta confiança, ele fundamenta o texto principal. A forma grega é substancialmente diferente e deve permanecer visível, sem ser fundida ao hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “do nada... ao nada” e “do vazio ao vazio” preserva o paralelismo e a contundência proverbial do hebraico.
