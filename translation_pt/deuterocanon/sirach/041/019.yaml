  text: for violating an oath and a covenant[b][a], and for leaning with your elbow over the bread.
translation:
  language: pt
  text: por violar um juramento[b] e uma aliança, e por apoiar o cotovelo sobre o pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é conciso e um tanto incerto nesta segunda oração. O paralelo grego traz mais explicitamente «firmar o cotovelo sobre os pães», apoiando a tradução «apoiar o cotovelo sobre o pão».
    reason: textual_variant
  - marker: b
    text: «Juramento» também pode ser traduzido por «maldição» ou «adjuração», pois o termo hebraico pode incluir a ideia de uma maldição ligada ao juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מהפר
  choice: por violar
  rationale: O hifil de פרר pode significar quebrar, anular ou violar uma obrigação. Neste catálogo moral, «violar» exprime de modo natural a transgressão de um compromisso solene.
- source_word: אלה
  choice: um juramento
  rationale: אלה pode designar juramento, imprecação ou adjuração, muitas vezes com sanção de maldição implícita. Em paralelo com «aliança», «juramento» é a opção mais natural sem apagar a alternativa lexical, registrada em nota.
- source_word: וברית
  choice: e uma aliança
  rationale: ברית designa normalmente uma aliança ou pacto formal; «aliança» preserva o caráter solene e relacional do compromisso.
- source_word: ממטה
  choice: e por apoiar
  rationale: A forma hebraica e a construção são difíceis. À luz do paralelo grego πήξεως ἀγκῶνος, a expressão descreve o ato de firmar ou apoiar o cotovelo à mesa.
- source_word: אציל
  choice: o cotovelo
  rationale: אציל refere-se ao cotovelo ou à articulação do braço, confirmado pelo grego ἀγκών.
- source_word: אל לחם
  choice: sobre o pão
  rationale: O hebraico é conciso e pouco usual; o grego ἐπ᾿ ἄρτους favorece a imagem concreta do cotovelo sobre os pães ou a comida. O singular coletivo «pão» acompanha o hebraico e soa natural em português.
