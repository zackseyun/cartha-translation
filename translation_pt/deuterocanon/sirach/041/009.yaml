  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: pt
  text: Se vocês se multiplicarem, será por meio da desgraça; e, se gerarem filhos, será para gemidos. Se tropeçarem, será para alegria eterna; e, se morrerem, será para maldição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego apresenta uma forma mais breve e diferente: «Se vocês nascerem, nascerão para a maldição; e, se morrerem, serão destinados à maldição».'
    reason: 'Registrar uma variante textual substancial: o hebraico composto dos manuscritos da Geniza fala em multiplicar-se, gerar filhos e tropeçar, enquanto o grego repete a ideia de nascer para a maldição.'
lexical_decisions:
- source_word: תפרו
  choice: se vocês se multiplicarem
  rationale: O verbo פרה significa dar fruto ou multiplicar-se; no contexto da geração de descendentes, «multiplicar-se» é natural e mantém a imagem do hebraico.
- source_word: על ידי אסון
  choice: será por meio da desgraça
  rationale: Preserva a relação instrumental expressa por על ידי e o sentido de calamidade ou desgraça de אסון, sem especificar além do texto quem sofre ou provoca o desastre.
- source_word: תולידו
  choice: se gerarem filhos
  rationale: Torna explícito em português o objeto naturalmente pressuposto pelo verbo hebraico «gerar/dar à luz», em paralelo com a multiplicação da descendência.
- source_word: לאנחה
  choice: será para gemidos
  rationale: Mantém o sentido concreto de אנחה, «gemido» ou «suspiro de aflição», e a finalidade ou resultado indicado por ל.
- source_word: תכשלו
  choice: se tropeçarem
  rationale: Tradução direta de כשׁל, preservando a possibilidade de queda, fracasso ou ruína sem escolher apenas uma dessas extensões metafóricas.
- source_word: לשמחת עולם
  choice: isso será motivo de alegria para sempre
  rationale: Expressa em português corrente a relação resultativa da frase hebraica, sem identificar quem se alegra; עולם é vertido temporalmente como «para sempre».
- source_word: לקללה
  choice: para a maldição
  rationale: Mantém a construção concisa e a força de קללה, sem transformar a maldição em condenação ou destino teologicamente mais específico.
theological_decisions:
- issue: Quem experimenta a alegria associada ao tropeço dos ímpios
  choice: Não identificar o sujeito da alegria
  alternative: Explicitar que outras pessoas ou os justos se alegrarão
  rationale: O hebraico apenas diz «para alegria eterna/para sempre»; nomear os que se alegram resolveria uma ambiguidade genuína sem apoio explícito.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Traduzir integralmente a leitura hebraica fornecida e registrar a leitura grega em nota
  alternative: Substituir o hebraico pela forma grega mais breve, como faz a camada inglesa de consulta
  rationale: A fonte hebraica tem alta confiança e contém uma leitura substancialmente diferente. A prioridade é traduzir a evidência da língua original apresentada, enquanto a nota preserva a importante testemunha grega e torna transparente a incerteza textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento plural por «vocês». A formulação conserva o paralelismo severo e a estranheza significativa do hebraico, mas emprega sintaxe corrente. A nota textual é necessária porque a camada inglesa segue o grego, ao passo que a fonte hebraica fornecida diverge de modo substancial.
