  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
translation:
  language: pt
  text: Sabedoria escondida e tesouro oculto — que proveito há em ambos?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que proveito há em qualquer um dos dois?” O hebraico diz literalmente “em ambos”, referindo-se conjuntamente à sabedoria escondida e ao tesouro oculto.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego acrescenta antes desta frase: “Conservem a instrução em paz, filhos.” O testemunho hebraico usado como base para a tradução começa com a frase sobre a sabedoria escondida.'
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: sabedoria
  rationale: É o sentido direto do hebraico e corresponde ao grego σοφία; mantém a imagem de algo valioso que, por estar escondido, não beneficia ninguém.
- source_word: טמונה
  choice: escondida
  rationale: O particípio indica algo guardado fora da vista. “Escondida” é claro, natural e não especifica indevidamente que esteja enterrada.
- source_word: אוצר
  choice: tesouro
  rationale: No paralelismo, designa a riqueza valiosa, não o depósito onde ela é guardada; o grego θησαυρός confirma esse sentido.
- source_word: מוסתר
  choice: oculto
  rationale: Preserva o paralelismo sem repetir “escondido” e expressa de modo digno e corrente aquilo que foi posto fora da vista.
- source_word: מה תועלה
  choice: que proveito há
  rationale: Traduz a pergunta retórica sobre utilidade ou benefício prático com concisão e naturalidade em português.
- source_word: בשתיהם
  choice: em ambos
  rationale: Mantém mais diretamente o hebraico “em ambos” e o grego ἐν ἀμφοτέροις, preservando a referência conjunta aos dois elementos sem substituir a formulação por uma interpretação distributiva.
