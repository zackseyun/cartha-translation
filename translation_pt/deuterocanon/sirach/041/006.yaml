  yaml_path: translation/deuterocanon/sirach/041/006.yaml
  text: The dominion of evil is from the child of injustice, and disgrace is always with his offspring.
translation:
  language: pt
  text: De um filho da injustiça vem o domínio do mal, e a pobreza está sempre com a sua descendência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “A herança dos filhos dos pecadores perecerá, e com a descendência deles continuará o opróbrio.” O hebraico preservado difere do grego nesta oração: traz “pobreza” onde o grego traz “opróbrio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: do filho da injustiça
  rationale: Preserva a construção hebraica מ־ + בן + עול e seu singular. “Filho” mantém a imagem genealógica do texto, enquanto “injustiça” expressa o sentido moral de עול.
- source_word: ממשלת רע
  choice: vem o domínio do mal
  rationale: ממשלה indica domínio, governo ou poder exercido, e רע pode ser entendido substantivamente como “mal”. A formulação com “vem” torna natural em português a relação expressa pela preposição hebraica.
- source_word: וריש עם
  choice: e a desonra permanece
  rationale: A forma hebraica transmitida é difícil. O paralelo grego traz ὄνειδος, “desonra, opróbrio”, e um verbo de continuidade; por isso, a tradução conserva o sentido provável sem alegar certeza sobre a redação hebraica exata.
- source_word: זרעו
  choice: a sua descendência
  rationale: זרע, neste contexto, designa os descendentes, não a semente em sentido literal. “Descendência” é claro, conciso e mantém o valor coletivo.
- source_word: תמיד
  choice: para sempre
  rationale: תמיד exprime duração contínua. “Para sempre” comunica aqui a persistência da desonra através da linhagem, em linguagem corrente e digna.
theological_decisions:
- issue: Uso do testemunho hebraico primário em uma passagem textualmente difícil
  choice: Manter a estrutura baseada no hebraico e recorrer ao grego apenas para esclarecer a ideia de desonra duradoura ligada à descendência.
  alternative: 'Traduzir diretamente o grego: “A herança dos filhos dos pecadores perecerá, e o opróbrio continuará com a descendência deles.”'
  rationale: O hebraico sobrevivente deve permanecer como base, embora a segunda oração seja difícil. O grego confirma o sentido geral de vergonha persistente, mas sua referência à herança não deve substituir silenciosamente a redação hebraica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem foi levemente ajustada com “vem” para evitar uma construção nominal pouco natural, sem eliminar a concisão ou a tensão do hebraico.
