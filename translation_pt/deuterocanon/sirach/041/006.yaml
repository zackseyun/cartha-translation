    rationale: No hebraico preservado, ריש significa normalmente “pobreza” ou “indigência”. O paralelo grego tem ὄνειδος (“opróbrio”), mas o grego funciona como paralelo e não justifica trocar sem indicação o sentido lexical do hebraico que sobrevive.
  - severity: medium
    issue: A nota apresenta o grego como apoio para a tradução principal, mas a tradução principal já adotou a leitura grega em vez da leitura hebraica.
    rationale: 'A nota deve explicitar a divergência: o hebraico diz “pobreza”, enquanto o grego traz “opróbrio”. Isso preserva a dificuldade textual sem apagar a diferença entre os testemunhos.'
