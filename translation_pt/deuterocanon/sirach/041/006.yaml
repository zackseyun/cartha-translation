  source_fidelity: 'A primeira oração acompanha adequadamente o hebraico: מבן עול pode ser traduzido como “De um filho da injustiça”, e ממשלת רע como “vem o domínio do mal”. Contudo, a segunda oração do texto hebraico preservado traz ריש, cujo sentido normal é “pobreza”, não “desonra”. Embora o grego apresente “opróbrio/desonra”, não é seguro substituir silenciosamente o termo hebraico por esse sentido.'
  naturalness: “De um filho da injustiça vem o domínio do mal” é uma formulação clara, solene e natural em português. “A pobreza está sempre com a sua descendência” mantém a concisão proverbial do paralelismo e é facilmente compreensível.
  terminology: “Injustiça”, “domínio”, “mal” e “descendência” são escolhas adequadas. “Pobreza” deve substituir “desonra” no texto principal por refletir ריש; a variante grega com “opróbrio” deve ficar na nota.
