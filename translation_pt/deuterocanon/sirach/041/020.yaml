  text: Be ashamed of refusing a request[a], and of turning away the face of your neighbor.
translation:
  language: pt
  text: Envergonhe-se de recusar um pedido[a] e de desviar o rosto do seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico neste ponto é incerto e difere muito do grego, que diz aproximadamente: “de saudar a respeito de silêncio e de olhar para uma mulher companheira/cortesã”. O texto principal segue o testemunho hebraico preservado, mas a divergência é significativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: de recusar
  rationale: A construção com מן e מנע expressa impedir, reter ou negar; no contexto de שאלה, “recusar” é natural e conserva a ideia de não atender ao que foi pedido.
- source_word: מתת שאלה
  choice: um pedido
  rationale: 'A expressão hebraica transmitida é difícil: מתת costuma relacionar-se a “dádiva” ou “dar”, enquanto שאלה significa “pedido” ou “petição”. A tradução verte o sentido provável da expressão sem reproduzir uma formulação opaca.'
- source_word: מהשב
  choice: de desviar
  rationale: A forma causativa ligada a שוב pode indicar fazer voltar ou afastar. Com “rosto”, “desviar” produz em português a expressão idiomática adequada.
- source_word: אפי
  choice: o rosto
  rationale: אף pode significar “nariz”, “rosto” ou, idiomaticamente, “ira”. Aqui a sequência com רעך e a construção verbal favorecem entender “rosto”, embora o texto transmitido apresente dificuldade morfológica.
- source_word: רעך
  choice: do seu próximo
  rationale: רע designa o semelhante, companheiro ou próximo; “próximo” preserva o alcance ético e o registro bíblico sem ser obscuro.
theological_decisions:
- issue: Incerteza textual e semântica do hebraico em contraste com o paralelo grego
  choice: Seguir o testemunho hebraico no texto principal, entendendo a segunda oração como desviar o rosto do próximo, e registrar em nota a leitura grega muito diferente.
  alternative: 'O grego diz aproximadamente: “de saudar a respeito de silêncio e de olhar para uma mulher companheira/cortesã”. Outra tradução mais literal, porém obscura, do hebraico seria: “de reter a dádiva de um pedido, de fazer voltar o rosto do seu próximo”.'
  rationale: O hebraico sobrevivente tem primazia, mas sua formulação é difícil e diverge profundamente do grego. A nota torna essa instabilidade transparente sem resolver a tensão de modo indevidamente categórico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Envergonhe-se” conserva a forma de exortação; “próximo” mantém o teor ético tradicional com ampla inteligibilidade.
