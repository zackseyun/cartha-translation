lexical_decisions:
- source_word: פחד על שם
  choice: Zele pelo seu nome
  rationale: O hebraico expressa preocupação cuidadosa com o nome, entendido no contexto como o nome ou reputação que a pessoa deixa. “Zele” transmite essa responsabilidade de modo natural e digno, sem substituir a imagem do “nome” por uma explicação.
- source_word: כי הוא ילוך
  choice: pois ele o acompanhará
  rationale: Preserva a personificação do nome e o sentido de que ele seguirá com a pessoa ou permanecerá ligado a ela.
- source_word: מאלפי אוצרות חכמה
  choice: mais do que milhares de tesouros de sabedoria
  rationale: Segue diretamente a leitura hebraica, incluindo “sabedoria”, embora o paralelo grego apresente “mil grandes tesouros de ouro”.
