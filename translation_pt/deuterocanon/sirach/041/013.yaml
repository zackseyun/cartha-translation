base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/013.yaml
  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: pt
  text: O bem da vida dura um número limitado de dias, mas o bem de um nome[a] dura dias sem número.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “nome” significa a reputação ou a honra pela qual alguém é lembrado, e não apenas um nome pessoal.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz: “e um bom nome permanecerá para sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: טובת
  choice: o bem de
  rationale: Preserva o substantivo e o paralelismo hebraico entre o bem da vida e o bem de um nome, sem introduzir uma comparação que o texto não explicita.
- source_word: חי
  choice: vida
  rationale: O sentido abstrato de 'vida' se ajusta ao contraste com a duração da reputação e corresponde ao paralelo grego ζωῆς.
- source_word: ימי מספר
  choice: dura um número limitado de dias
  rationale: Expressa em português natural o idioma hebraico 'dias de número', isto é, dias contáveis e limitados.
- source_word: שם
  choice: nome
  rationale: Mantém a imagem concreta do hebraico; neste contexto, 'nome' inclui a reputação e a honra pelas quais alguém é lembrado.
- source_word: ימי אין מספר
  choice: dura dias sem número
  rationale: Reproduz de perto o contraste hebraico com os dias contáveis da vida, sem substituir a expressão pela interpretação mais explícita do grego, 'para sempre'.
theological_decisions:
- issue: Relação entre o idioma hebraico e a formulação interpretativa do paralelo grego
  choice: Manter no texto principal o contraste hebraico entre a duração limitada da vida e os dias sem número de um bom nome.
  alternative: “Um bom nome permanecerá para sempre.”
  rationale: O testemunho hebraico é claro e de alta confiança. O grego torna explícito o sentido duradouro do segundo membro; essa leitura é registrada em nota sem substituir a forma hebraica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura proverbial concisa. O verbo “dura” foi explicitado nos dois membros para tornar natural em português a construção nominal hebraica, preservando o paralelismo.
