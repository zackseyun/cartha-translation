base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: pt
  text: Ó morte, como é boa a tua sentença para quem está necessitado e sem forças, para quem tropeça em tudo, é rebelde e perdeu a esperança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: האח למות
  choice: Ó morte
  rationale: A interjeição hebraica introduz uma apóstrofe à morte; a forma portuguesa preserva o tom solene sem acrescentar uma emoção não especificada.
- source_word: כי טוב חקיך
  choice: como é boa a tua sentença
  rationale: חקיך, literalmente algo como “teu decreto/estatuto”, refere-se aqui ao veredito ou destino imposto pela morte; “sentença” mantém a personificação e concorda com o paralelo grego κρίμα.
- source_word: לאיש אונים וחסר עצמה
  choice: para quem está necessitado e sem forças
  rationale: O hebraico descreve uma pessoa em carência e privada de vigor; a formulação evita limitar “homem” ao sexo masculino e preserva os dois aspectos.
- source_word: איש כושל ינקש בכל
  choice: para quem tropeça em tudo
  rationale: כושל indica alguém que vacila ou tropeça; o grego περισπωμένῳ περὶ πάντων sugere alguém atribulado com tudo, mas o hebraico sustenta a imagem do tropeço.
- source_word: סורב
  choice: é rebelde
  rationale: O termo aponta para resistência, recusa ou insubordinação. “Rebelde” conserva essa força melhor que uma mera teimosia.
- source_word: ואובד תקוה
  choice: e perdeu a esperança
  rationale: Tradução direta do estado de alguém cuja esperança se perdeu; em português corrente, o perfeito expressa naturalmente o resultado presente.
theological_decisions:
- issue: Avaliação positiva da sentença da morte
  choice: “como é boa a tua sentença”
  alternative: “como é apropriado o teu decreto”
  rationale: Mantém-se a linguagem forte e potencialmente tensa do original, sem suavizar “boa” nem transformá-la numa afirmação doutrinária geral sobre a morte.
- issue: Sentido de סורב
  choice: “rebelde”
  alternative: “obstinado”
  rationale: O hebraico e o paralelo grego ἀπειθοῦντι favorecem a ideia de recusa ou desobediência; não se especifica contra quem se dirige essa rebeldia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética moderada. A repetição de “para quem” organiza as duas linhas hebraicas numa única frase sem apagar a enumeração.
