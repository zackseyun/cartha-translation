base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: pt
  text: Esta é a sorte de toda carne, vinda de Deus[a]. Por que, então, rejeitar o decreto do Altíssimo?[b] Sejam mil anos, cem ou dez[c], não há no Sheol[d] repreensão quanto à vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “de Deus”; o texto grego paralelo diz “do Senhor”.
    reason: alternative_reading
  - marker: b
    text: O hebraico transmitido parece dizer “a lei do Altíssimo”; o grego traz “o beneplácito do Altíssimo”. “Decreto” expressa aqui aquilo que o Altíssimo determinou, sem ocultar a diferença entre as testemunhas.
    reason: alternative_reading
  - marker: c
    text: 'A sequência numérica é textualmente difícil no hebraico. O grego diz com clareza: “sejam dez, cem ou mil anos”.'
    reason: textual_variant
  - marker: d
    text: O hebraico traz “Sheol”; o texto grego paralelo traz “Hades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זה חלק כל בשר
  choice: Esta é a sorte de toda carne
  rationale: “Sorte” traduz חלק como porção ou destino atribuído, enquanto “toda carne” preserva o idioma hebraico referente à humanidade mortal. O grego apresenta “juízo”, mas o hebraico é a testemunha principal.
- source_word: מאל
  choice: vinda de Deus
  rationale: O hebraico diz literalmente “de Deus”. A formulação concorda naturalmente com “sorte” em português; a leitura grega “do Senhor” é registrada em nota.
- source_word: תמאס
  choice: rejeitar
  rationale: מאס pode significar rejeitar ou desprezar. “Rejeitar” expressa com clareza a pergunta retórica sem intensificar indevidamente o sentido.
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: o decreto do Altíssimo
  rationale: O hebraico transmitido aponta para “lei do Altíssimo”, enquanto o grego traz “beneplácito do Altíssimo”. “Decreto” comunica uma determinação divina no contexto da mortalidade sem identificar plenamente as duas leituras divergentes; ambas ficam documentadas em nota.
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: Sejam mil anos, cem ou dez
  rationale: A tradução conserva a sequência reconstruída a partir da ordem do hebraico e entende os números como durações de vida contrastantes. A dificuldade textual e a ordem mais explícita do grego são indicadas em nota.
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγμὸς ζωῆς
  choice: não há no Sheol repreensão quanto à vida
  rationale: A expressão é difícil no hebraico, mas תוכחות e o grego ἔλεγμος sustentam “repreensão”. “Quanto à vida” preserva a relação sintática ambígua de “repreensão da vida” sem impor a interpretação de prestação de contas ou queixa.
theological_decisions:
- issue: Tradução do termo do além שאול / ᾅδης
  choice: Sheol
  alternative: Hades; sepultura; mundo dos mortos
  rationale: Como o hebraico está preservado e traz שאול, “Sheol” mantém o conceito próprio do texto sem o reduzir à sepultura física nem importar associações posteriores. “Hades”, apoiado pelo grego, consta em nota.
- issue: Divergência entre “lei” no hebraico e “beneplácito” no grego
  choice: decreto do Altíssimo
  alternative: lei do Altíssimo; beneplácito do Altíssimo; vontade do Altíssimo
  rationale: “Decreto” se ajusta ao contexto da mortalidade estabelecida por Deus e evita resolver silenciosamente a divergência em favor de uma formulação legal ou volitiva. As leituras das testemunhas são explicitadas.
- issue: Sentido de “repreensão quanto à vida” no Sheol
  choice: preservar a formulação aberta
  alternative: não há prestação de contas pela vida; não há queixa sobre a duração da vida
  rationale: O hebraico é difícil e o grego também permite mais de uma compreensão da relação entre “repreensão” e “vida”. Uma tradução relativamente formal evita transformar a frase numa afirmação doutrinária mais específica sobre julgamento após a morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Toda carne”, “Altíssimo” e “Sheol” conservam o universo conceitual bíblico; a construção final permanece deliberadamente concisa e um pouco aberta por causa da dificuldade das testemunhas.
