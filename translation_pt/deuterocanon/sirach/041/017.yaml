base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/017.yaml
  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: pt
  text: Tenha vergonha diante de seu pai e de sua mãe por causa da imoralidade sexual, e diante de um governante em seu posto[a] por causa da mentira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um governante sentado”, provavelmente em seu assento de autoridade. O paralelo grego traz “um líder e um poderoso”.
    reason: A nota preserva a imagem concreta do hebraico e informa a formulação alternativa do paralelo grego.
lexical_decisions:
- source_word: בוש
  choice: Tenha vergonha
  rationale: O imperativo exorta a reconhecer e sentir vergonha; esta formulação é natural em português e mantém a força direta da advertência.
- source_word: מאב ואם
  choice: diante de seu pai e de sua mãe
  rationale: Depois de בוש, a preposição מן indica as pessoas diante das quais se sente vergonha. O possessivo torna natural em português a referência relacional, sem alterar o sentido.
- source_word: אל זנות
  choice: por causa da imoralidade sexual
  rationale: זנות abrange conduta sexual ilícita e não se limita à prostituição. “Imoralidade sexual” conserva essa amplitude, também atestada pelo paralelo grego πορνείας.
- source_word: מנשיא יושב
  choice: diante de um governante em seu posto
  rationale: O hebraico descreve literalmente um governante “sentado”, provavelmente em seu assento de autoridade. “Em seu posto” comunica essa função pública em português natural, enquanto a nota registra a imagem literal e o paralelo grego.
- source_word: אל כחש
  choice: por causa da mentira
  rationale: כחש denota falsidade ou engano. “Mentira” é direto, corrente e corresponde ao grego ψεῦδος.
