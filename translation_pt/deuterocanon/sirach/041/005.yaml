base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/005.yaml
  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
translation:
  language: pt
  text: Os filhos de quem é desprezado são coisa má[a][c], e os descendentes do insensato estão sob o terror do perverso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil no primeiro membro; o paralelo grego diz algo mais próximo de: “Filhos abomináveis tornam-se filhos de pecadores”.'
    reason: alternative_reading
  - marker: b
    text: 'O paralelo grego diverge mais fortemente no segundo membro e diz aproximadamente: “e convivem nos assentamentos dos ímpios”.'
    reason: alternative_reading
  - marker: c
    text: O testemunho mais antigo de Massada para esta seção está fragmentário neste ponto; a redação legível deste versículo provém principalmente dos manuscritos hebraicos da Genizá do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: filhos
  rationale: O termo designa prole ou descendência. “Filhos” é natural em português e mantém o paralelismo com נכד sem impor uma geração remota.
- source_word: נמאס
  choice: de quem é desprezado
  rationale: A forma passiva exprime alguém rejeitado ou desprezado. A construção evita transformar, sem necessidade, “desprezado” em predicado direto dos filhos.
- source_word: דבר רעים
  choice: são coisa má
  rationale: A expressão hebraica é difícil e possivelmente instável. Entender דבר como “coisa” ou “matéria” preserva o juízo negativo sem adotar uma reconstrução mais especulativa; o paralelo grego confirma o tom severo, mas não a formulação exata.
- source_word: נכד
  choice: descendentes
  rationale: Embora possa indicar neto, no paralelismo poético com נין refere-se de modo mais amplo à posteridade; “descendentes” evita restringir o sentido a uma geração específica.
- source_word: אויל
  choice: insensato
  rationale: É um termo típico da literatura sapiencial para a pessoa moralmente tola. “Insensato” conserva essa categoria sem sugerir apenas pouca inteligência.
- source_word: במגור
  choice: estão sob o terror
  rationale: מגור denota medo, pavor ou terror. “Sob o terror” reproduz a força do substantivo e oferece uma construção portuguesa natural sem acrescentar explicitamente a ideia de morar ou viver.
- source_word: רשע
  choice: perverso
  rationale: O singular pode ter valor representativo ou coletivo. “Perverso” preserva o singular hebraico e a dimensão moral própria do vocabulário sapiencial.
theological_decisions:
- issue: Uso do texto hebraico da Genizá do Cairo diante das divergências do paralelo grego
  choice: Traduzir prioritariamente o hebraico existente, usando o grego apenas como controle do tom e do sentido geral.
  alternative: 'Seguir o grego: “Filhos abomináveis são os filhos dos pecadores, e convivem nos assentamentos dos ímpios.”'
  rationale: O hebraico está preservado, embora contenha uma expressão difícil no primeiro membro. O grego diverge de maneira ainda mais acentuada no segundo; portanto, não deve substituir silenciosamente o testemunho hebraico nem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a dureza e a dificuldade do hebraico sem suavizar o juízo sapiencial nem resolver pelas notas do grego as ambiguidades do texto principal.
