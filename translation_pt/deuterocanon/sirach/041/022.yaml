translation:
  language: pt
  text: de um amigo[a], por palavras de afronta; e, depois de dar um presente a um irmão, não o repreenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta frase é conciso e um tanto elíptico. O paralelo grego explicita parte do sentido: “de amigos, acerca de palavras de afronta; e, depois de dar, não repreenda”.'
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  choice: quanto a um amigo
  rationale: אוהב designa aqui alguém que ama, isto é, um amigo. A expressão hebraica é elíptica; «quanto a» conserva o valor tópico sem definir em excesso a relação sintática, enquanto o paralelo grego confirma a referência a amigos.
- source_word: על דברי חרפה
  choice: por palavras de afronta
  rationale: דברי חרפה são palavras que insultam, humilham ou trazem desonra. «Palavras de afronta» preserva tanto o caráter verbal quanto a dimensão social de חרפה; «por» permite o sentido de motivo ou assunto da repreensão.
- source_word: ומאחרי
  choice: e, depois de
  rationale: A construção indica posterioridade. «Depois de» expressa naturalmente a relação temporal em português.
- source_word: מתת
  choice: dar um presente
  rationale: מתת pode indicar dádiva ou ato de dar. A forma verbal torna inteligível a expressão temporal sem afastar-se do sentido hebraico.
- source_word: אח
  choice: um irmão
  rationale: A palavra significa literalmente «irmão», embora possa ter extensão social mais ampla. Mantém-se a designação relacional específica do hebraico.
- source_word: מנאץ
  choice: não o repreenda
  rationale: A forma hebraica é muito concisa e difícil neste contexto. O paralelo grego traz explicitamente uma proibição com ὀνείδιζε, «repreender/censurar». A tradução explicita essa força admonitória e o objeto recuperável pelo contexto.
theological_decisions:
- issue: Uso do paralelo grego para esclarecer uma linha hebraica elíptica e textualmente difícil
  choice: Entender a segunda parte como proibição de repreender um irmão depois de lhe dar um presente, deixando a primeira parte relativamente elíptica.
  alternative: Traduzir toda a linha de modo fragmentário, sem suprir a proibição; ou entender מאוהב como «da parte de um amigo».
  rationale: O hebraico sobrevivente permanece a fonte principal, mas sua sintaxe é comprimida e o testemunho foi assinalado como grande desencontro textual. O grego preserva claramente «depois de dar, não repreendas», justificando a explicitação mínima da proibição. Na primeira parte, a tradução e a nota conservam a ambiguidade em vez de reconstruir uma oração completa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter de item numa lista de admoestações e evita preencher excessivamente a elipse da primeira oração.
