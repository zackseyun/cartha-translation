base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/003.yaml
  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
translation:
  language: pt
  text: Não tema o decreto de sua morte[a]; lembre-se de que os que vieram antes e os que virão depois estão com você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é comprimido e pode ser entendido como “não tema a morte, sua porção determinada”; o grego traz “não tema o julgamento da morte”. A tradução expressa o provável sentido conjunto.
    reason: alternative_reading
  - marker: b
    text: A expressão indica que tanto os que vieram antes como os que virão depois compartilham com você a mesma condição mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אל תפחד
  choice: Não tema
  rationale: Traduz diretamente a proibição hebraica com פחד, em linguagem atual, concisa e solene.
- source_word: ממות חקיך
  choice: o decreto de sua morte
  rationale: A frase hebraica é comprimida e admite a ideia de morte como porção ou determinação designada; o paralelo grego κρίμα θανάτου confirma o sentido de juízo ou decreto de morte. O possessivo mantém a interpelação pessoal sugerida por חקיך.
- source_word: זכור
  choice: lembre-se
  rationale: Equivalente natural do imperativo hebraico, adequado ao registro sapiencial moderno.
- source_word: ראשנים ואחרנים
  choice: os que vieram antes e os que virão depois
  rationale: Preserva o contraste temporal amplo do hebraico sem especificar indevidamente gerações, predecessores ou sucessores.
- source_word: עמך
  choice: estão com você
  rationale: 'Mantém a expressão literal e sua força figurada: pessoas anteriores e posteriores compartilham a mesma condição mortal.'
theological_decisions:
- issue: Como traduzir o objeto do temor diante da formulação hebraica comprimida e do paralelo grego
  choice: o decreto de sua morte
  alternative: a morte; o julgamento da morte; seu fim determinado
  rationale: A formulação escolhida dá primazia ao hebraico, mas acolhe o esclarecimento do grego sem reduzir a frase simplesmente a “morte” nem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a tensão entre a formulação hebraica e o esclarecimento do paralelo grego, sem sobrecarregar o versículo com terminologia técnica.
