  text: A man's body is vanity[a], but a gracious name will not be cut off.
translation:
  language: pt
  text: O corpo de uma pessoa é vapor[a], mas um nome de bondade não será eliminado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz uma leitura bastante diferente: “O pranto das pessoas está em seus corpos, mas o nome não bom dos pecadores será apagado”. O testemunho hebraico diz: “um nome de bondade não será eliminado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  choice: vapor
  rationale: Expressa a transitoriedade e a falta de substância da existência corporal. Em português atual, “vaidade” poderia ser entendida principalmente como presunção, enquanto “vapor” preserva com clareza a metáfora sapiencial.
- source_word: אדם
  choice: humano
  rationale: O singular tem valor proverbial e representa qualquer ser humano. “Humano” mantém esse alcance sem introduzir uma referência exclusivamente masculina.
- source_word: בגויתו
  choice: corpo
  rationale: גויה pode designar corpo ou cadáver; neste contraste entre a existência física passageira e o nome duradouro, “corpo” é a opção contextual mais adequada.
- source_word: אך
  choice: mas
  rationale: Marca o contraste entre a transitoriedade do corpo e a permanência de um bom nome.
- source_word: שם חסד
  choice: um nome de bondade
  rationale: Mantém “nome”, com seu sentido bíblico de reputação, e traduz חסד como qualidade positiva associada a essa reputação. A formulação preserva a construção hebraica sem reduzi-la simplesmente a “boa reputação”.
- source_word: לא יכרת
  choice: não será eliminado
  rationale: Comunica de modo natural o sentido de algo que não será cortado, suprimido ou levado ao fim, sem adotar o verbo “apagar” característico da leitura grega paralela.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego na segunda oração
  choice: 'Seguir o hebraico: “um nome de bondade não será eliminado”'
  alternative: O grego apresenta uma formulação negativa a respeito do nome dos pecadores e diz que ele será apagado.
  rationale: O hebraico sobrevivente é o testemunho primário e, neste caso, tem alta confiança. Sua afirmação positiva sobre a permanência de um nome associado à bondade deve permanecer no texto principal; a divergência substancial do grego é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vapor” evita o sentido moderno predominante de “vaidade” como presunção; “nome de bondade” conserva a concisão e a ressonância sapiencial do hebraico.
