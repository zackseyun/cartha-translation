base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/018.yaml
  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: pt
  text: Diante de um senhor e de uma senhora[a], envergonhe-se da mentira; diante de uma assembleia e do povo, da transgressão; diante de um companheiro e de um amigo, da deslealdade[b]; e, no lugar onde você mora, do furto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “senhor e senhora”; o paralelo grego traz “juiz e governante”. O texto principal segue o hebraico, a testemunha primária onde o texto hebraico de Sirácida está preservado.
    reason: textual_variant
  - marker: b
    text: O hebraico מעל também pode ser traduzido como “violação”, “infidelidade” ou “quebra de confiança”.
    reason: lexical_alternative
  - marker: c
    text: A frase hebraica final é difícil; literalmente, seria algo como “no lugar onde você mora, quanto a זר”. O paralelo grego favorece o sentido de “furto”, adotado no texto principal.
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  choice: Diante de um senhor e de uma senhora
  rationale: Segue o hebraico extante, que traz “senhor e senhora”. Neste catálogo do que causa vergonha, a preposição מ־ é vertida idiomaticamente por “diante de”.
- source_word: על שקר
  choice: da mentira
  rationale: Preserva o substantivo hebraico e expressa naturalmente aquilo de que a pessoa deve se envergonhar.
- source_word: מעדה ועם
  choice: diante de uma assembleia e do povo
  rationale: “Assembleia” comunica עדה sem restringir o termo a uma reunião especificamente cultual.
- source_word: על פשע
  choice: da transgressão
  rationale: Mantém o peso moral de פשע, que pode indicar transgressão, delito ou ruptura.
- source_word: מחבר ורע
  choice: diante de um companheiro e de um amigo
  rationale: Reproduz o paralelismo social sem especificar indevidamente uma parceria comercial ou jurídica.
- source_word: על מעל
  choice: da deslealdade
  rationale: מעל frequentemente denota quebra de confiança ou infidelidade. “Deslealdade” preserva essa dimensão relacional melhor que o genérico “má conduta”.
- source_word: וממקום תגור
  choice: e, no lugar onde você mora
  rationale: Expressa em português corrente a provável referência ao lugar em que alguém reside, sem impor ao verbo o sentido técnico de residência temporária.
- source_word: על זר
  choice: do furto
  rationale: A leitura hebraica é difícil; o paralelo grego e o contexto favorecem uma referência a roubo ou apropriação do que pertence a outro.
