  text: Woe to you[a], wicked men[b], who have abandoned the law of the Most High.
translation:
  language: pt
  text: Ai de vocês, homens perversos, que abandonaram a lei[b] do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: «a lei do Deus Altíssimo». O testemunho hebraico primário diz simplesmente: «a lei do Altíssimo».'
    reason: alternative_reading
  - marker: b
    text: O hebraico תורת também pode ser traduzido por «instrução» ou «ensino»; aqui, «lei» corresponde ao sentido da aliança e é apoiado pelo grego νόμον.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוי / οὐαί
  choice: Ai de
  rationale: Preserva a força profética de denúncia ou lamentação presente tanto no hebraico como no grego, em expressão natural no português bíblico contemporâneo.
- source_word: לכם / ὑμῖν
  choice: vocês
  rationale: Marca diretamente os destinatários; «Ai de vocês» é claro e idiomático no português moderno.
- source_word: אנשי / ἄνδρες
  choice: homens
  rationale: Ambos os testemunhos empregam um substantivo masculino plural; a tradução mantém essa especificidade sem neutralizá-la.
- source_word: רשע / ἀσεβεῖς
  choice: perversos
  rationale: O hebraico enfatiza a conduta moralmente má, enquanto o grego salienta a impiedade. «Perversos» traduz bem o testemunho hebraico primário sem restringir o sentido à irreligiosidade.
- source_word: אשר / οἵτινες
  choice: que
  rationale: Introduz de modo natural a oração relativa explicativa em português.
- source_word: עזבתם / ἐγκατελίπετε
  choice: abandonaram
  rationale: Expressa uma ação deliberada de deixar ou desamparar e conserva a força da deslealdade à aliança.
- source_word: תורת / νόμον
  choice: a lei
  rationale: Embora תורת também possa significar «instrução» ou «ensino», «lei» se ajusta ao contexto da aliança e é corroborado pelo grego νόμον.
- source_word: עליון / θεοῦ Ὑψίστου
  choice: do Altíssimo
  rationale: Segue o hebraico primário, que traz apenas o título «Altíssimo», sem acrescentar o substantivo explícito «Deus» presente no paralelo grego.
theological_decisions:
- issue: Título divino עליון em relação ao grego θεοῦ Ὑψίστου
  choice: do Altíssimo
  alternative: do Deus Altíssimo
  rationale: O testemunho hebraico primário não contém a palavra explícita «Deus». A forma mais curta evita acrescentá-la ao texto principal, enquanto a expansão grega é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém a concisão e a força de denúncia do original; as notas preservam a variante grega e a amplitude semântica de תורת.
