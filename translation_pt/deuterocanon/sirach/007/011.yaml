  text: Do not despise a man in bitterness of spirit[a]; remember that there is one who exalts and humbles.
translation:
  language: pt
  text: Não despreze alguém de espírito amargurado; lembre-se de que há quem eleve e rebaixe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz “elevar e rebaixar”; o paralelo grego traz a ordem inversa: “rebaixar e elevar”.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: Não despreze
  rationale: O verbo hebraico בזה expressa tratar alguém com desprezo. “Despreze” preserva esse sentido amplo sem restringi-lo à zombaria verbal sugerida pelo paralelo grego.
- source_word: לֶאֱנוֹשׁ
  choice: quem
  rationale: אֱנוֹשׁ designa aqui um ser humano individual. A construção portuguesa com “quem” conserva a referência pessoal e singular sem tornar a frase pesada ou sugerir que apenas homens do sexo masculino estejam em vista.
- source_word: בְּמַר רוּחַ
  choice: está com o espírito amargurado
  rationale: A formulação comunica de modo natural a expressão hebraica “em amargura de espírito” e mantém sua dimensão interior, em consonância com o grego “na amargura de sua alma”.
- source_word: זְכוֹר כִּי יֵשׁ
  choice: lembre-se de que há
  rationale: Mantém o imperativo e a força existencial da oração hebraica em português corrente e digno.
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: quem eleve e rebaixe
  rationale: “Eleve e rebaixe” preserva a ordem do testemunho hebraico e o contraste entre mudança ascendente e descendente de condição, evitando que “humilhe” seja entendido apenas como causar vergonha.
theological_decisions:
- issue: Identidade implícita daquele que eleva e rebaixa
  choice: 'Manter o agente sem nomeá-lo: “há quem”'
  alternative: “Deus eleva e rebaixa” ou “o Senhor eleva e rebaixa”
  rationale: Embora o contexto implique ação divina, nem o hebraico nem o grego nomeiam Deus nesta oração. A tradução conserva essa implicitude e não acrescenta um título ausente.
- issue: Ordem dos atos de reversão
  choice: “eleve e rebaixe”, conforme o hebraico
  alternative: “rebaixe e eleve”, conforme o paralelo grego
  rationale: O testemunho hebraico fornecido é a fonte primária e apresenta מֵרִים וּמַשְׁפִּיל nessa ordem. A leitura grega é registrada em nota para preservar a variante sem substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Espírito amargurado” preserva a imagem sem soar excessivamente literal; “eleve e rebaixe” comunica reversão de condição e mantém a ordem hebraica.
