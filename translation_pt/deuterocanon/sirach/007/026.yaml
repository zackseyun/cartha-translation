  text: Do not despise a wife who is yours[a], and do not trust one you hate.
translation:
  language: pt
  text: Não despreze sua esposa[a] e não confie naquela que você odeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Você tem uma esposa segundo o seu desejo? Não a mande embora.” O hebraico preservado e o grego diferem consideravelmente neste versículo; por isso, o texto principal segue o testemunho hebraico, e esta nota registra a alternativa grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: a esposa que é sua
  rationale: אִשָּׁה, com לְךָ, indica naturalmente a própria esposa. A formulação conserva a relação expressa no hebraico sem reduzir a expressão a uma mulher em geral.
- source_word: אַל תְּתַעֲבֶהָ
  choice: não despreze
  rationale: O verbo comunica forte rejeição ou aversão. “Desprezar” é corrente, digno e adequado ao estilo sapiencial; evita o tom menos natural de “abominar” neste contexto.
- source_word: וּשְׂנוּאָה
  choice: naquela que você odeia
  rationale: A forma pode ser entendida passivamente como “odiada”, mas o paralelismo relacional favorece a mulher que o destinatário odeia. “Naquela” mantém o referente feminino sem acrescentar “esposa” ao segundo membro.
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: não confie naquela
  rationale: O hifil de אמן com ב expressa depositar confiança em alguém. “Confiar em” é a correspondência portuguesa direta e não acrescenta a ideia reflexiva ausente do hebraico.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego
  choice: Seguir o hebraico no texto principal e registrar a leitura grega em nota.
  alternative: “Você tem uma esposa segundo o seu desejo? Não a mande embora.”
  rationale: O hebraico sobrevivente e o grego diferem de modo substancial. Como há testemunho hebraico de alta confiança, ele fundamenta o texto principal; a nota preserva a alternativa grega relevante sem harmonizar os dois textos.
translation_notes:
  register: Português moderno, claro e digno, com forma de tratamento por “você” implícita nos imperativos. A construção “a esposa que é sua” é deliberadamente próxima do hebraico e preserva o contraste com “aquela que você odeia”.
