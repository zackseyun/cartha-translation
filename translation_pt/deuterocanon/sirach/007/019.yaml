translation:
  language: pt
  text: Não despreze uma esposa sensata,[a] pois sua graça vale mais do que pérolas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mulher prudente” ou “uma mulher sábia”. O hebraico pode significar “mulher” ou “esposa”, e o termo descritivo enfatiza discernimento e bom senso.
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz: “Não deixe escapar uma mulher sábia e boa, pois a graça dela vale mais do que o ouro”. O hebraico diz “pérolas”, ou possivelmente outra joia preciosa, em vez de “ouro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Não despreze
  rationale: מָאַס pode indicar rejeitar ou tratar com desprezo. “Não despreze” preserva o tom firme da exortação e sua dimensão relacional.
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: uma esposa sensata
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; o contexto de instruções domésticas favorece “esposa”. מַשְׁכֶּלֶת ressalta discernimento, prudência e bom senso, expressos de modo natural por “sensata”.
- source_word: וְטוֹבַת חֵן
  choice: pois sua graça vale mais
  rationale: A expressão hebraica é condensada. “Sua graça” comunica favor, encanto e qualidade agradável sem limitá-la à aparência física. “Pois” explicita a relação explicativa sugerida pelo sentido do verso, embora o hebraico use literalmente “e”.
- source_word: מִפְּנִינִים
  choice: do que pérolas
  rationale: פְּנִינִים designa objetos de grande valor e pode ser entendido como pérolas, corais ou pedras preciosas. “Pérolas” é uma tradução tradicional e plausível, enquanto a nota registra a variação textual grega.
theological_decisions:
- issue: Referente de אִשָּׁה na exortação sapiencial
  choice: esposa
  alternative: mulher
  rationale: O substantivo permite ambas as leituras, mas a sequência de conselhos domésticos e relacionais torna “esposa” mais específica e natural. A alternativa é preservada em nota.
- issue: Caráter da qualidade expressa por חֵן
  choice: graça
  alternative: encanto ou favor
  rationale: “Graça” mantém a amplitude do termo hebraico, que pode abranger favor, encanto e amabilidade, sem reduzi-lo à beleza física.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Sensata” evita um tom excessivamente técnico; “vale mais do que” comunica de modo idiomático a comparação de valor.
