  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
translation:
  language: pt
  text: Não tagareles[a] na assembleia dos governantes e não repitas uma palavra em tua oração.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fales demais” ou “não fiques falando sem propósito”. O paralelo grego também adverte contra a fala ociosa ou excessiva entre os anciãos.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não repitas uma palavra em tua oração”. A advertência provavelmente visa a repetição redundante ou mecânica, não necessariamente toda repetição de um pedido sincero.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: tagareles
  rationale: O verbo hebraico, confirmado pelo paralelo grego ἀδολέσχει, adverte contra a fala excessiva, ociosa ou indisciplinada; “tagareles” preserva essa força sem reduzir o sentido a simplesmente “falar”.
- source_word: בַּעֲדַת
  choice: na assembleia dos
  rationale: עֵדָה designa uma comunidade reunida ou assembleia; a expressão mantém o caráter público e formal do contexto.
- source_word: שָׂרִים
  choice: governantes
  rationale: שָׂרִים indica pessoas de posição ou autoridade. “Governantes” expressa esse sentido sem restringi-lo a príncipes de uma monarquia.
- source_word: תִּישֶׁן דָּבָר
  choice: repitas uma palavra
  rationale: Embora a expressão hebraica seja incomum, o grego μὴ δευτερώσῃς λόγον apoia diretamente a ideia de repetir uma palavra ou enunciado. A formulação conserva a concretude e a tensão do original.
- source_word: בַּתְּפִלָּה
  choice: em tua oração
  rationale: O hebraico situa a advertência no âmbito da oração, e o grego explicita o possessivo em ἐν προσευχῇ σου. “Em tua oração” reproduz essa referência pessoal com concisão.
theological_decisions:
- issue: Se a segunda advertência proíbe toda repetição na oração ou a repetição redundante e mecânica
  choice: Manter no texto a formulação concreta “não repitas uma palavra”, explicando em nota sua provável referência à redundância verbal.
  alternative: Interpretar no próprio texto como “não uses repetições vazias” ou, no extremo oposto, como proibição absoluta de qualquer oração repetida.
  rationale: O hebraico e o paralelo grego falam de repetição, mas não definem explicitamente seus limites. A tradução preserva essa tensão e evita transformar uma máxima sapiencial em uma formulação doutrinária mais precisa do que a evidência permite.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa coerentes (“tagareles”, “tua”). “Tagarelar” comunica fala excessiva ou leviana sem recorrer a linguagem arcaica; as notas preservam alternativas e evitam resolver indevidamente a extensão teológica da advertência sobre a oração.
