base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/006.yaml
  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: pt
  text: Não se deixe intimidar diante de um nobre, para não comprometer sua integridade com suborno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “para não pôr um tropeço em sua retidão”. O hebraico usa de modo mais concreto um termo que significa ganho injusto ou desonesto, aqui traduzido como “suborno”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: se deixe intimidar
  rationale: Neste contexto, o verbo descreve recuar por medo ou pressão diante de alguém poderoso. A formulação comunica deferência temerosa, e não simples medo.
- source_word: נָדִיב
  choice: nobre
  rationale: O termo pode designar uma pessoa de posição elevada ou proeminente. “Nobre” preserva a nuance social do hebraico, enquanto o paralelo grego emprega “poderoso” ou “governante”.
- source_word: וְנָתוּן
  choice: comprometer ... com
  rationale: Embora a expressão hebraica seja literalmente “pôr” ou “colocar”, esta formulação portuguesa transmite com naturalidade a introdução de corrupção na integridade pessoal.
- source_word: בֶּצַע
  choice: suborno
  rationale: O substantivo denota ganho cobiçoso ou injusto. No contexto judicial indicado pelo paralelo grego, “suborno” expressa de modo concreto a corrupção resultante da intimidação pelo poderoso.
- source_word: בִּתְמִימִיךָ
  choice: sua integridade
  rationale: O termo pertence ao campo semântico de inteireza, retidão e conduta irrepreensível. “Integridade” comunica claramente seu sentido ético.
theological_decisions:
- issue: Como traduzir a frase hebraica concisa וְנָתוּן בֶּצַע בִּתְמִימִיךָ à luz do paralelo grego καὶ θήσεις σκάνδαλον ἐν εὐθύτητί σου
  choice: Traduzir o hebraico como a corrupção da própria integridade por meio de suborno.
  alternative: “para não pôr um tropeço em sua retidão”, conforme o grego.
  rationale: O hebraico existente é a testemunha principal e menciona concretamente ganho injusto; o grego apresenta a consequência moral de forma mais ampla. A tradução mantém o elemento concreto do hebraico sem ocultar a leitura grega, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção “se deixe intimidar” evita um tom arcaico, e “comprometer sua integridade com suborno” torna inteligível a expressão hebraica concisa sem eliminar sua força ética.
