  text: Do not delay with those who weep[a], and mourn with those who mourn.
translation:
  language: pt
  text: Não demore em acompanhar os que choram[a] e lamente com os enlutados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz: “Não hesite em visitar um doente, pois, por meio disso, você será amado.” Essa leitura é substancialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  choice: Não demore
  rationale: A proibição com o verbo no hitpael exprime não se atrasar nem se refrear. “Não demore” é natural, atual e mantém a urgência do hebraico.
- source_word: מִבּוֹכִים
  choice: a estar com os que choram
  rationale: Embora a preposição מִן seja formalmente “de”, o paralelismo e o contexto exortativo indicam que não se deve tardar em acompanhar os que choram. A formulação explicita em português a solidariedade sugerida pelo hebraico sem confundi-la com afastamento.
- source_word: אֲבֵלִים
  choice: os que estão de luto
  rationale: O substantivo designa pessoas enlutadas. “Os que estão de luto” é claro e preserva o contexto social de luto melhor do que uma referência genérica à tristeza.
- source_word: תִּתְאַבָּל
  choice: esteja de luto
  rationale: O hitpael exprime participar ou entrar no luto. “Esteja de luto” conserva a ligação lexical com “os que estão de luto” e comunica a solidariedade exigida.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado, que exorta à solidariedade com os que choram e estão de luto.
  alternative: 'O testemunho grego diz: “Não hesite em visitar o doente, pois por tais coisas você será amado.”'
  rationale: Quando o hebraico de Sirácida está preservado com alta confiança, ele serve de fonte principal. Como o grego apresenta uma leitura substancialmente diferente, e não uma simples variação lexical, sua forma é preservada em nota sem substituir nem harmonizar o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “luto” preserva o paralelismo e a força ética do original; a nota registra com transparência a divergência textual grega.
