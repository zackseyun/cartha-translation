translation:
  language: pt
  text: Com todo o seu coração, tema a Deus e honre os sacerdotes dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: Com todo o seu coração
  rationale: Reproduz de modo natural a expressão hebraica de totalidade interior e corresponde diretamente ao sentido do texto-fonte.
- source_word: פְּחַד
  choice: tema
  rationale: O imperativo hebraico pede temor reverente diante de Deus; “tema” preserva a força direta sem acrescentar explicação interpretativa.
- source_word: אִל
  choice: a Deus
  rationale: אֵל designa Deus neste contexto; a construção portuguesa exige a preposição “a” com o verbo “temer” nesta formulação.
- source_word: הַקְדִישׁ
  choice: honre
  rationale: Literalmente, o hifil pode significar “santifique”, “consagre” ou “trate como santo”. No contexto da conduta para com sacerdotes, “honre” comunica de forma natural o reconhecimento de sua condição sagrada, em consonância com o paralelo grego θαύμαζε, sem sugerir que o leitor lhes confere ordenação ou santidade.
- source_word: כֹּהֲנָיו
  choice: os sacerdotes dele
  rationale: Mantém o referente possessivo hebraico e usa vocabulário corrente. “Dele” evita uma possível associação momentânea de “seus sacerdotes” com o leitor.
theological_decisions:
- issue: Sentido de הַקְדִישׁ aplicado aos sacerdotes
  choice: honre os sacerdotes dele
  alternative: santifique os sacerdotes dele
  rationale: “Santifique” seria mais formalmente próximo da raiz קדש, mas em português pode insinuar que o destinatário torna os sacerdotes santos ou os consagra. “Honre” expressa a resposta humana ao caráter sagrado do ofício e recebe apoio do paralelo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase conserva o paralelismo imperativo do hebraico e evita linguagem eclesiástica denominacional.
