base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/003.yaml
  text: Do not seek authority from God[a], nor from the king a seat of honor.
translation:
  language: pt
  text: Não busque de Deus autoridade[a], nem do rei um lugar de honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz aqui um dito diferente: “Filho, não semeie nos sulcos da injustiça, e não os colherá sete vezes mais.” O texto principal segue o testemunho hebraico existente de Sirácida neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Não busque
  rationale: בקש pode significar buscar, pedir ou procurar obter. “Não busque” preserva tanto a procura quanto a aspiração, sem limitar a expressão a um pedido verbal.
- source_word: מֵאֵל
  choice: de Deus
  rationale: אֵל é aqui a designação comum de Deus; a tradução simples evita acrescentar um título divino mais específico.
- source_word: מֶמְשֶׁלַת
  choice: autoridade
  rationale: ממשלה designa governo, domínio ou autoridade para governar. “Autoridade” comunica a ideia de poder ou cargo sem restringi-la à soberania territorial.
- source_word: וְכֵן
  choice: nem
  rationale: Literalmente, “e igualmente/assim também”. Dentro da proibição coordenada, “nem” expressa naturalmente em português a continuidade da força negativa.
- source_word: מִמֶּלֶךְ
  choice: do rei
  rationale: A preposição מן significa “de”. O singular definido do hebraico é preservado e pode ser entendido genericamente.
- source_word: מוֹשַׁב כָּבוֹד
  choice: um lugar de honra
  rationale: מוֹשָׁב pode indicar assento, lugar ou posição, enquanto כָּבוֹד acrescenta a noção de honra. “Lugar de honra” mantém a imagem social de uma posição elevada e soa natural em português.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego deste versículo
  choice: Traduzir no texto principal o hebraico existente e registrar em nota a leitura grega substancialmente diferente.
  alternative: “Filho, não semeie nos sulcos da injustiça, e não os colherá sete vezes mais.”
  rationale: Em Sirácida, o hebraico existente tem prioridade como fonte. Neste ponto, ele adverte contra buscar autoridade e honra, enquanto o grego conserva outro dito. A divergência deve ser preservada, não harmonizada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Lugar de honra” foi preferido a “assento de honra” por naturalidade, sem perder o sentido de posição honrosa concedida pelo rei.
