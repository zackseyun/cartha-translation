  naturalness: A redação revista permanece moderna, clara e natural em português internacional, com boa legibilidade brasileira. A construção impessoal por meio de “lembre-se ... e nunca pecará” evita alternar desnecessariamente entre tratamento formal e “você”.
  terminology: “Fim” e “pecará” são termos adequados, dignos e não sobrecarregam o enunciado com interpretação escatológica. A nota identifica a leitura hebraica como aproximada e divergente, sem apresentar sua sintaxe difícil como se fosse inequívoca.
