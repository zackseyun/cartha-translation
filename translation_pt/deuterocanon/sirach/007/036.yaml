  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: pt
  text: Em todas as suas palavras, lembre-se de seu fim, e nunca pecará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico (Kahana, composto de manuscritos da Geniza do Cairo) diz aproximadamente: “Não afaste seu coração de quem ama, pois dele você será amado.” Aqui, o hebraico difere substancialmente da tradição grega; por isso, o texto principal segue o paralelo grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  choice: Em tudo o que disser
  rationale: λόγοις pode indicar palavras, falas ou assuntos; a formulação escolhida é natural em português e mantém o foco nas palavras e ações verbais.
- source_word: μιμνήσκου
  choice: lembre-se
  rationale: Traduz diretamente o imperativo de recordar ou manter em mente.
- source_word: τὰ ἔσχατά σου
  choice: do seu fim
  rationale: Preserva a concisão e a ambiguidade do grego quanto à morte, ao desfecho da vida ou ao destino final, sem impor uma elaboração doutrinária.
- source_word: καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις
  choice: e você nunca pecará
  rationale: Na construção grega, a expressão temporal com o futuro negado tem sentido idiomático de 'nunca'; ἁμαρτάνω é traduzido pelo verbo teologicamente usual 'pecar'.
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב, כִּי מִמֶּנוּ תֵּאָהֵב
  choice: registrado em nota como testemunho hebraico substancialmente divergente
  rationale: O hebraico preservado não corresponde semanticamente ao paralelo grego e apresenta uma formulação difícil; por isso, a tradução principal segue a tradição grega coerente, enquanto a variante hebraica é apresentada com transparência.
theological_decisions:
- issue: Se 'seu fim' deve receber uma interpretação escatológica explícita
  choice: seu fim
  alternative: seu destino final
  rationale: A expressão não especifica uma doutrina desenvolvida da vida futura ou do juízo; a tradução mantém sua amplitude e tensão.
- issue: Escolha do texto principal diante da forte divergência entre o hebraico e o grego
  choice: seguir o paralelo grego no texto principal e registrar o hebraico em nota
  alternative: seguir no texto principal o hebraico preservado, apesar de sua dificuldade
  rationale: Embora o testemunho hebraico tenha grande importância, neste versículo ele é semanticamente divergente e difícil, ao passo que o grego transmite uma admoestação estável e coerente. A nota impede que a divergência seja ocultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” evita solenidade artificial; “Em tudo o que disser” soa mais natural que o literal “Em todas as suas palavras” sem perder o sentido do grego.
