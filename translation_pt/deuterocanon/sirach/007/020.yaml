  text: Do not mistreat a faithful servant[b][a], nor a hired laborer who gives himself.
translation:
  language: pt
  text: Não maltrate um trabalhador fiel[a], nem um assalariado que dá a própria vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “trabalhador de verdade”; o grego traz “servo doméstico que trabalha com fidelidade”. O sentido é o de alguém que trabalha fiel ou honestamente.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico desta parte é difícil. O grego traz “um assalariado que dá a própria vida”, expressão que também pode comunicar que ele se entrega inteiramente ao trabalho.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: Não maltrate
  rationale: O verbo hebraico רעע, em sentido causativo, expressa fazer mal ou tratar mal alguém; o grego κακόω confirma esse sentido. “Não maltrate” é claro e natural em português.
- source_word: עוֹבֵד אֱמֶת
  choice: um trabalhador fiel
  rationale: A expressão significa literalmente “trabalhador de verdade”. Aqui, “fiel” comunica o sentido ético de alguém que trabalha com lealdade e honestidade, sem restringir indevidamente עוֹבֵד a um servo doméstico.
- source_word: וְכֵן
  choice: nem
  rationale: A conjunção introduz um segundo elemento sob a mesma proibição. Depois de “não”, “nem” reproduz naturalmente essa coordenação negativa em português.
- source_word: שׁוֹמֵר
  choice: um assalariado
  rationale: A forma hebraica transmitida é difícil e, isoladamente, poderia indicar alguém que guarda ou vigia. O paralelo grego μίσθιον, porém, aponta para um trabalhador contratado por salário; “assalariado” expressa isso de modo conciso.
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: que dá a própria vida
  rationale: Embora o texto hebraico seja difícil, o grego διδόντα ψυχὴν αὐτοῦ traz literalmente a ideia de “dar a sua vida/alma”. A formulação preserva a força da imagem e pode denotar a dedicação integral do trabalhador, sem reduzir o texto a uma paráfrase.
