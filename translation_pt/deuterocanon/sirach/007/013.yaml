  text: Do not desire to repeat a lie[a], for its outcome is not good.
translation:
  language: pt
  text: Não queira acrescentar mentira a mentira[a], pois o resultado disso não será agradável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “mentir sobre falsidade”; a expressão provavelmente significa acrescentar mentira a mentira ou repetir falsidades. O paralelo grego diz “toda mentira”, apoiando o sentido mais amplo de praticar a falsidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: queira
  rationale: O verbo חפץ expressa vontade, desejo ou prazer; “queira” preserva a nuance volitiva e soa natural na proibição.
- source_word: לְכַחֵש עַל כָּחַש
  choice: acrescentar mentira a mentira
  rationale: A construção é literalmente próxima de “mentir sobre falsidade” e sugere acumular ou repetir falsidades. Esta formulação conserva a imagem cumulativa do hebraico; o paralelo grego, “toda mentira”, confirma o sentido mais amplo de persistir na falsidade.
- source_word: תִקְוָתוֹ
  choice: o resultado disso
  rationale: Embora תִּקְוָה geralmente signifique “esperança” ou “expectativa”, aqui se refere ao que se pode esperar dessa prática, isto é, ao seu resultado. “Disso” evita uma referência pronominal ambígua em português.
- source_word: לֹא תִנְעָם
  choice: não será agradável
  rationale: נעם denota ser agradável, aprazível ou doce. A tradução mantém essa imagem hebraica, enquanto o futuro corresponde à forma verbal do texto.
