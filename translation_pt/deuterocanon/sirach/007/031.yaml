base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/031.yaml
  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: pt
  text: Honre a Deus e honre o sacerdote[a]; dê-lhes a porção que lhes cabe[b], conforme lhe foi ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Tema ao Senhor e glorifique o sacerdote, e dê-lhe a sua porção, conforme lhe foi ordenado desde o princípio”; em seguida, acrescenta uma lista mais extensa de direitos sacerdotais, incluindo oferta pela culpa, a porção das espáduas, sacrifício de santificação e primícias.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico traz “a porção deles”, no plural, provavelmente em referência aos direitos dos sacerdotes coletivamente. O paralelo grego usa o singular: “a sua porção”.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד אֵל
  choice: Honre a Deus
  rationale: O imperativo intensivo de כבד exprime prestar a devida honra; אֵל é o título divino genérico “Deus”. A formulação segue o hebraico, enquanto o grego traz “tema ao Senhor”.
- source_word: וַהֲדַר כֹּהֵן
  choice: trate o sacerdote com dignidade
  rationale: הדר aqui pede que o sacerdote seja tratado com honra ou distinção. Esta formulação natural preserva a proximidade semântica com כבד sem produzir uma repetição estilisticamente pesada em português. O singular כֹּהֵן é representativo da função sacerdotal.
- source_word: וְתֵן חֶלְקָם
  choice: dê a eles a porção que lhes cabe
  rationale: O sufixo de חֶלְקָם é plural e deve permanecer visível. “A porção que lhes cabe” comunica uma parte devida ou atribuída sem explicitar no texto principal quais ofertas a compõem.
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: conforme lhe foi ordenado
  rationale: A construção passiva indica uma ordem anteriormente dada ao destinatário. A tradução é concisa, digna e idiomática.
theological_decisions:
- issue: Título divino
  choice: Deus
  alternative: o Senhor
  rationale: O testemunho hebraico preservado traz אֵל, “Deus”, e tem prioridade no texto principal. A leitura grega κύριον, “Senhor”, é registrada em nota.
- issue: Número do possessivo em חֶלְקָם
  choice: a eles a porção que lhes cabe
  alternative: a ele a sua porção
  rationale: O hebraico apresenta sufixo plural, provavelmente abrangendo os sacerdotes e seus direitos coletivos, apesar do singular representativo “o sacerdote”. O grego regulariza a referência no singular.
- issue: Extensão da leitura grega
  choice: traduzir no texto principal apenas o conteúdo do hebraico
  alternative: acrescentar a lista grega de direitos sacerdotais
  rationale: O paralelo grego contém material adicional sobre ofertas e primícias, mas esse conteúdo não consta do testemunho hebraico fornecido; por isso, permanece documentado na nota e não é incorporado ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Trate ... com dignidade” evita a repetição imediata de “honre” e expressa naturalmente הדר. O tratamento ao leitor usa “lhe”, sem regionalismo marcado. Os marcadores [a] e [b] aparecem no texto principal.
