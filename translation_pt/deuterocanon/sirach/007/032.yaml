  text: Bread of the mighty and an offering of the hand[a], sacrifices of righteousness and a holy contribution.
translation:
  language: pt
  text: Pão dos poderosos e oferta da mão[a], sacrifícios de justiça e contribuição sagrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “E estende a mão ao pobre, para que tua bênção seja completa.” O hebraico e o grego diferem substancialmente neste ponto, o que sugere uma tradição textual variante ou corrupção do texto.'
    reason: textual_variant
lexical_decisions:
- source_word: לֶחֶם
  choice: Pão
  rationale: Mantém o sentido básico e concreto do hebraico, sem generalizá-lo para “alimento”.
- source_word: אַבִּירִים
  choice: dos poderosos
  rationale: O termo pode designar poderosos, fortes, nobres ou, em certos contextos, touros. Como o texto é difícil e a tradição grega diverge muito, “dos poderosos” preserva a forma e a ambiguidade do hebraico sem identificar indevidamente o referente.
- source_word: וּתְרוּמַת יָד
  choice: e oferta da mão
  rationale: Reproduz de modo conciso a imagem hebraica de uma contribuição ou oferta associada à mão, evitando impor uma interpretação cultual mais específica.
- source_word: זִבְחֵי צֶדֶק
  choice: sacrifícios de justiça
  rationale: Preserva a construção hebraica e sua possível tensão entre qualidade moral, conformidade e culto legítimo.
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: e contribuição santa
  rationale: Conserva tanto a ideia de contribuição consagrada quanto o registro cultual do hebraico.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico no texto principal e registrar o grego em nota.
  alternative: “Estenda também a mão ao pobre, para que sua bênção seja completa.”
  rationale: Quando o hebraico de Sirácida está preservado, ele recebe prioridade como testemunho de base. A leitura grega apresenta conteúdo bastante diferente e pode refletir outra tradição textual ou corrupção; por isso, deve ser preservada sem substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e conciso, com legibilidade brasileira e vocabulário amplamente internacional. A formulação deliberadamente incomum acompanha a dificuldade do hebraico; a nota impede que a grande variante grega seja ocultada.
