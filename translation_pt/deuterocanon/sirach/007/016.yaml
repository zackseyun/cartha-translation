  text: Humble pride very much[a], for the hope of man is worms.
translation:
  language: pt
  text: Humilhe profundamente o orgulho[a], pois a esperança do ser humano são os vermes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não se conte entre a multidão dos pecadores.” Isso parece refletir uma tradição textual diferente, e não apenas uma pequena variação de redação.'
    reason: textual_variant
lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: profundamente
  rationale: A duplicação intensifica fortemente a ordem. Em português, “profundamente” transmite essa ênfase de modo natural e digno, sem a formulação pouco idiomática “muito, muito”.
- source_word: הַשְׁפִּיל
  choice: Humilhe
  rationale: O imperativo no hifil de שׁפל exige uma ação de rebaixar. “Humilhe” preserva a força imperativa e se combina naturalmente com “o orgulho”.
- source_word: גַּאֲוָה
  choice: o orgulho
  rationale: O substantivo denota orgulho ou exaltação de si. “Orgulho” é a opção ampla e direta, sem restringir o sentido a “arrogância” ou “soberba”.
- source_word: תִקְוַת
  choice: a esperança
  rationale: תקוה significa normalmente esperança ou expectativa. Mantém-se a leitura hebraica, apesar da tradição grega divergente.
- source_word: אֱנוֹשׁ
  choice: do ser humano
  rationale: אֱנוֹשׁ apresenta a humanidade em sua fragilidade mortal. “Ser humano” conserva a referência humana geral e é claro no português atual.
- source_word: רִמָּה
  choice: os vermes
  rationale: O termo designa vermes ligados à decomposição. O plural é natural nesta máxima sobre a mortalidade e preserva sua imagem incisiva.
theological_decisions:
- issue: Divergência textual entre o hebraico e o paralelo grego
  choice: 'Seguir o hebraico preservado: “Humilhe profundamente o orgulho, pois a esperança do ser humano são os vermes.”'
  alternative: 'O paralelo grego diz: “Não se conte entre a multidão dos pecadores.”'
  rationale: Como o hebraico está preservado e tem alta confiança, ele fundamenta o texto principal. O grego apresenta uma linha substancialmente diferente, provavelmente de outra tradição textual, e por isso é registrado em nota sem ser harmonizado com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a imagem abrupta e sombria do hebraico. “Profundamente” representa idiomaticamente a forte intensificação de מְאֹד מְאֹד.
