base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: pt
  text: Não faça o mal[a], e o mal não alcançará você; mantenha-se longe da iniquidade[b], e ela se desviará de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Na segunda oração, “mal” também pode ter o sentido de “dano” ou “calamidade”: “Não faça o mal, e nenhum dano alcançará você”. O hebraico repete a mesma palavra, assim como o grego emprega “mal” nas duas ocorrências.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é concisa no hebraico e também pode ser entendida como “e isso se afastará de você”. A ideia é que, ao manter-se longe da iniquidade, a pessoa também se afasta do perigo ou dos efeitos dela.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: Não faça
  rationale: Preserva a proibição direta com עשה, sem acrescentar o sentido mais especializado de “cometer” nem o aspecto habitual de “praticar”.
- source_word: רָעָה
  choice: o mal
  rationale: Mantém a força moral e a repetição deliberada do hebraico nos dois membros, também refletida pelo grego κακά/κακόν; na segunda ocorrência, o termo pode incluir dano ou calamidade resultante.
- source_word: יַשִּׂיגְךָ
  choice: não alcançará você
  rationale: Expressa naturalmente a ideia de chegar até alguém ou apanhá-lo, preservando a imagem de consequências que sobrevêm à pessoa.
- source_word: הַרְחֵק
  choice: mantenha-se longe
  rationale: Conserva a metáfora espacial e comunica uma separação ativa em português corrente e digno.
- source_word: מֵעָוֹן
  choice: da iniquidade
  rationale: Neste contexto exortativo, עָוֹן aponta principalmente para a perversidade moral, embora também possa envolver culpa ou suas consequências.
- source_word: וְיֵט מִמְּךָ
  choice: e ela se desviará de você
  rationale: Preserva a formulação concisa e a ideia de que a iniquidade, ou o perigo ligado a ela, se afasta de quem dela se mantém longe, sem introduzir um agente não expresso.
theological_decisions:
- issue: Mal moral ou calamidade na repetição de רָעָה
  choice: Traduzir as duas ocorrências por “mal” no texto principal.
  alternative: Traduzir a segunda por “dano” ou “calamidade”.
  rationale: A repetição hebraica, acompanhada pelo paralelo grego, cria uma relação retórica entre praticar o mal e ser alcançado pelo mal. A mesma palavra no texto principal preserva essa tensão sem reduzir a segunda ocorrência apenas a calamidade.
- issue: Referente do sujeito na oração final
  choice: Usar “ela”, retomando gramaticalmente “iniquidade”, e explicar a concisão em nota.
  alternative: “Isso se afastará de você” ou “o perigo dela se desviará de você”.
  rationale: O hebraico não explicita novamente o sujeito e permite entender a iniquidade ou seus efeitos. Retomar “iniquidade” conserva a concisão sem inserir uma explicação interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A colocação “alcançará você” evita uma forma excessivamente literária, enquanto “iniquidade” conserva o peso moral do hebraico. O paralelismo e a ambiguidade entre o mal praticado e o mal sofrido foram preservados.
