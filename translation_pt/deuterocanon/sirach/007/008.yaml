review_pass:
  verdict: revise
  source_fidelity: 'A cláusula final está bem vertida: «nem por um só ficarás impune» reproduz adequadamente a ênfase de que nem um único pecado deixa alguém sem punição, preservando também, em nota, a possível nuance forense de נקה. Na primeira cláusula, «um pecado a outro» expressa acumulação, mas deixa de explicitar o elemento «uma segunda vez» (לשנות; confirmado pelo grego δίς).'
  naturalness: «Não acrescentes um segundo pecado» é mais idiomático em português moderno do que tentar reproduzir literalmente a metáfora de amarrar/ligar, e comunica de modo claro a advertência contra acrescentar pecado. O restante mantém registro sapiencial natural e digno.
  terminology: «Pecado», «impune» e «absolvido» são escolhas adequadas e amplamente compreensíveis. A nota a deve evitar apresentar «para repeti-lo» como literal, pois o hebraico diz de forma compacta «uma segunda vez», não uma oração final.
  issues:
  - severity: medium
    issue: A tradução principal não explicita «uma segunda vez».
    rationale: «Não acrescentes um pecado a outro» pode comunicar apenas a soma de pecados, ao passo que לשנות e o grego δίς salientam explicitamente a segunda ocorrência. «Não acrescentes um segundo pecado» conserva tanto a noção de adição quanto a de segundo pecado.
  - severity: medium
    issue: A nota a atribui ao hebraico, como literal, «não amarres o pecado para repeti-lo».
    rationale: «Para repeti-lo» é uma explicação interpretativa, não a forma literal da construção. A nota deve distinguir a formulação literal compacta das interpretações possíveis.
  revised_text: Não acrescentes um segundo pecado[a], pois nem por um só ficarás impune.[b]
