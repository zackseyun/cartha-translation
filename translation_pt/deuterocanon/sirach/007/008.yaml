  text: Do not add sin a second time[a], for even for one you will not go unpunished.
translation:
  language: pt
  text: Não acrescentes um segundo pecado[a], pois nem por um só ficarás impune.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não amarres/ligues o pecado uma segunda vez”. A expressão é compacta e seu sentido exato é incerto; também pode significar “não repitas um pecado”. O grego traz “não ligues um pecado duas vezes”.
    reason: A construção hebraica combina a imagem de amarrar ou ligar com a ideia de uma segunda vez. A nota preserva a imagem e a incerteza sem chamar uma paráfrase de literal.
  - marker: b
    text: 'Ou: “não serás absolvido” ou “não ficarás livre de culpa”.'
    reason: O verbo hebraico pode ter sentido tanto penal quanto forense.
lexical_decisions:
- source_word: אַל תִּקְשׁוֹר לְשָׁנוֹת חֵטְ
  choice: Não acrescentes um pecado a outro
  rationale: A expressão hebraica combina a imagem de amarrar ou ligar com a ideia de repetir o pecado. Esta formulação conserva a noção de acumular pecado e soa natural em português; a imagem literal e a leitura alternativa são registradas em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão da proibição, com o mesmo valor causal do hebraico.
- source_word: בְאַחַת
  choice: nem por um só
  rationale: Expressa a construção elíptica 'em/por um' como referência a um único pecado, preservando a ênfase de que até um só traz responsabilidade.
- source_word: לֹא תִנָּקֶה
  choice: ficarás impune
  rationale: O nifal de נקה pode indicar ficar livre de culpa, ser absolvido ou escapar da punição. 'Ficar impune' transmite diretamente a advertência no contexto sapiencial, enquanto o sentido forense permanece na nota.
theological_decisions:
- issue: Sentido penal ou forense da cláusula final
  choice: ficarás impune
  alternative: serás absolvido; ficarás livre de culpa
  rationale: O contexto favorece uma advertência sobre as consequências do pecado, mas o hebraico e o paralelo grego também admitem linguagem de absolvição. A nota preserva essa amplitude sem decidir uma questão doutrinária além do texto.
- issue: Se a primeira cláusula proíbe repetir o mesmo pecado ou acumular pecado sobre pecado
  choice: acrescentar um pecado a outro
  alternative: repetir um pecado; prender o pecado uma segunda vez
  rationale: O hebraico associa o verbo 'amarrar/ligar' à repetição, e o grego confirma a ideia de fazê-lo duas vezes. A redação principal conserva a imagem relacional de ligar pecados sem restringir indevidamente a advertência ao mesmo ato específico.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa do singular coerentes com o tom sapiencial. A redação evita literalismo obscuro, mas as imagens e ambiguidades relevantes do hebraico são preservadas nas notas.
