base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/024.yaml
  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: pt
  text: Você tem filhas? Proteja o corpo delas e não lhes mostre um rosto alegre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não faça seu rosto brilhar para elas”. A expressão provavelmente adverte contra ser excessivamente indulgente ou permissivo com elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנוֹת לְךָ / θυγατέρες σοί εἰσιν
  choice: Você tem filhas?
  rationale: A construção hebraica é elíptica, literalmente “filhas para você”, e o grego traz uma expressão existencial equivalente. A pergunta direta comunica com naturalidade a força condicional e exortativa.
- source_word: נְצוֹר / πρόσεχε
  choice: Proteja
  rationale: O imperativo hebraico significa guardar, conservar ou vigiar; o grego reforça a ideia de prestar cuidadosa atenção. “Proteja” expressa responsabilidade e cuidado sem tornar a frase excessivamente literal.
- source_word: שְׁאֵרָם / τῷ σώματι αὐτῶν
  choice: o corpo delas
  rationale: O hebraico שְׁאֵר pode designar carne ou corpo, e o paralelo grego explicita “corpo”. A tradução mantém a referência corporal concreta, sem restringi-la interpretativamente apenas à castidade.
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים / καὶ μὴ ἱλαρώσῃς πρὸς αὐτὰς τὸ πρόσωπόν σου
  choice: não lhes mostre um rosto alegre
  rationale: A formulação conserva a imagem concreta do rosto presente no hebraico e no grego. Embora incomum no português atual, permanece compreensível, e a nota esclarece a provável ideia de indulgência excessiva.
theological_decisions:
- issue: Força ética da advertência aos pais
  choice: Manter a imagem concreta do rosto e a referência ao corpo.
  alternative: “Guarde a castidade delas e não seja indulgente com elas.”
  rationale: A alternativa explicita interpretações plausíveis, mas estreita o alcance das expressões. A redação escolhida preserva a tensão e a concretude do texto antigo, enquanto a nota explica o provável sentido pragmático sem impor uma teoria moderna de educação dos filhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “mostrar um rosto alegre” foi mantida deliberadamente por refletir a imagem semítica, e sua estranheza moderada é compensada pela nota.
