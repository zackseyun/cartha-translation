base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/002.yaml
  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
translation:
  language: pt
  text: Não semeie sulcos de injustiça contra um irmão[b], para que não venha a colhê-la sete vezes tanto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o colha”; o referente do sufixo é ambíguo quando considerado isoladamente. A tradução o entende como referência à injustiça semeada, por ser o sentido que melhor se ajusta à imagem de semear e colher.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego traz uma forma mais geral do provérbio: “Afaste-se da injustiça, e ela se afastará de você”, refletindo uma versão diferente da preservada no hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: Não semeie
  rationale: Expressa de modo natural a proibição hebraica e preserva a metáfora agrícola, em correspondência com o verbo posterior “colher”.
- source_word: חֲרוּשֵׁי עָוֶל
  choice: sulcos de injustiça
  rationale: “Sulcos” mantém a imagem concreta do terreno lavrado; “injustiça” comunica o mal moral e relacional de עָוֶל sem recorrer a vocabulário excessivamente eclesiástico.
- source_word: עַל אָח
  choice: contra um irmão
  rationale: A preposição tem sentido adversativo no contexto. O artigo indefinido reflete a ausência de possessivo explícito no hebraico.
- source_word: פֶּן
  choice: para que não
  rationale: Forma corrente e digna de introduzir a consequência temida de uma advertência, evitando o menos usual “para não suceder que”.
- source_word: תִּקְצְרֵהוּ
  choice: a colha
  rationale: O pronome feminino em português retoma naturalmente “injustiça” e conserva a correspondência entre semear e colher. O sufixo hebraico, porém, é ambíguo isoladamente, como registra a nota.
- source_word: שִׁבְעָתָיִם
  choice: sete vezes mais
  rationale: Comunica em português corrente a ideia hebraica de retribuição intensificada ou multiplicada por sete.
theological_decisions:
- issue: Referente do sufixo pronominal em תִּקְצְרֵהוּ
  choice: 'Entendê-lo como referência à injustiça semeada: “a colha sete vezes mais”.'
  alternative: 'Entendê-lo como referência ao irmão (“o colha”) ou seguir a forma grega mais geral: “Afaste-se da injustiça, e ela se afastará de você”.'
  rationale: A sequência agrícola semear–colher favorece a referência ao que foi semeado. Como a forma hebraica compacta permite ambiguidade e o grego apresenta uma versão substancialmente diferente, essas possibilidades são documentadas sem substituir a leitura contextualmente mais coerente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que [b] acompanhe a divergência do texto grego junto à primeira oração e [a] acompanhe o pronome ambíguo na segunda. A metáfora agrícola incomum foi preservada em vez de ser reduzida a uma expressão genérica como “praticar injustiça”.
