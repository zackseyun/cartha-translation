translation:
  language: pt
  text: Estenda também a mão ao pobre[a], para que a sua bênção seja completa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Que a bondade de uma dádiva esteja diante de todo ser vivo, e não deixe de mostrar bondade nem mesmo aos mortos.” O testemunho hebraico deste versículo, porém, diz: “Estenda também a mão ao pobre, para que a sua bênção seja completa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Preserva a força aditiva da exortação em português natural, sem tornar a abertura pesada.
- source_word: לְאֶבְיוֹן
  choice: ao pobre
  rationale: אֶבְיוֹן designa a pessoa pobre ou necessitada; “ao pobre” é claro, corrente e adequado ao sentido social e ético.
- source_word: הוֹשִׁיט יָד
  choice: Estenda a mão
  rationale: Mantém a imagem corporal do hebraico, que no contexto comunica prestar auxílio ou dar generosamente.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de modo natural a relação de propósito ou resultado presente no hebraico.
- source_word: תִּשְׁלַם
  choice: seja completa
  rationale: O verbo da raiz שלם pode indicar chegar à plenitude ou completude. A tradução evita restringi-lo à ideia de recompensa.
- source_word: בִּרְכָתֶךָ
  choice: a sua bênção
  rationale: Conserva a amplitude do hebraico, que pode evocar bênção recebida, bênção concedida ou uma dádiva beneficente, sem resolver indevidamente a ambiguidade.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego em Eclesiástico 7:33
  choice: Traduzir no texto principal o hebraico preservado e registrar o paralelo grego em nota.
  alternative: 'Grego: “Que a bondade de uma dádiva alcance todo ser vivo, e não negue bondade nem mesmo aos mortos.”'
  rationale: O hebraico existente constitui a fonte principal adotada para esta passagem. Como o grego apresenta uma formulação substancialmente diferente, ele é preservado como testemunho textual alternativo, sem controlar nem substituir o hebraico.
- issue: Sentido de בִּרְכָתֶךָ
  choice: Manter “a sua bênção” sem explicitação interpretativa.
  alternative: “a sua dádiva” ou “a sua beneficência”
  rationale: A expressão admite mais de uma nuance. Mantê-la ampla preserva a tensão entre bênção, dádiva e ação beneficente, evitando impor uma leitura teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A imagem concreta de estender a mão e a ambiguidade de “bênção” foram preservadas.
