  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: pt
  text: Dê uma dádiva diante de toda pessoa viva[a] e não negue bondade nem mesmo a quem morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Não deixe de estar com os que choram e chore com os que estão de luto.” Essa redação reflete uma tradição textual substancialmente diferente para este versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: Dê uma dádiva
  rationale: O imperativo תֵּן pede uma ordem direta, e מַתָּן designa genericamente algo dado. “Dádiva” conserva a amplitude do hebraico sem sugerir necessariamente uma oferta cultual.
- source_word: לִפְנֵי כָל חָי
  choice: diante de toda pessoa viva
  rationale: Mantém o sentido espacial básico de לִפְנֵי, “diante de”, sem convertê-lo silenciosamente em uma simples marca de destinatário. “Pessoa viva” explicita o referente humano implícito no contexto sapiencial.
- source_word: וְגַם מִמֵּת
  choice: e ... nem mesmo a quem morreu
  rationale: A formulação portuguesa expressa a força aditiva e enfática de וְגַם e apresenta o morto singular de maneira genérica e natural.
- source_word: אַל תִּמְנַע חָסֶד
  choice: não negue bondade
  rationale: מנע indica reter ou recusar, enquanto חָסֶד, neste contexto ético, aponta para benevolência concreta. “Bondade” evita restringir o termo a misericórdia ou importar conotações exclusivamente pactuais.
theological_decisions:
- issue: Relação entre o texto hebraico e a tradição grega divergente
  choice: Traduzir o hebraico preservado como texto principal.
  alternative: 'A tradição grega diz: “Não falte com os que choram e chore com os que estão de luto.”'
  rationale: Como o hebraico está preservado e tem alta confiança textual, ele recebe primazia. A leitura grega não é uma pequena variante vocabular, mas uma tradição textual substancialmente diferente; por isso, é registrada em nota sem substituir o texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “diante de” conserva a expressão hebraica, embora seja menos idiomática que “a toda pessoa viva”, evitando resolver uma possível nuance espacial ou pública do original.
