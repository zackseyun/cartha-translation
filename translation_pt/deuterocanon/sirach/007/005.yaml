base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/005.yaml
  text: Do not seek to become a ruler if you have no strength to put an end to insolence[a].
translation:
  language: pt
  text: Não procure tornar-se governante se não tiver força para pôr fim à insolência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Não se justifique diante do Senhor e, diante de um rei, não se faça de sábio”, refletindo uma forma substancialmente diferente do versículo.'
    reason: Leitura alternativa da tradição textual grega.
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Não procure
  rationale: A proibição com בקש expressa buscar ou aspirar a algo. “Não procure” é direto, natural e não intensifica indevidamente a ideia.
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: tornar-se governante
  rationale: מוֹשֵׁל designa quem governa. “Tornar-se governante” comunica com naturalidade a aspiração ao cargo pressuposta pela advertência.
- source_word: חַיִל
  choice: força
  rationale: חַיִל pode indicar força, capacidade, poder ou recursos. “Força” conserva a expressão concreta do hebraico e, no contexto, abrange a capacidade necessária para governar.
- source_word: לְהַשְׁבִּית
  choice: pôr fim a
  rationale: O hifil de שבת significa fazer cessar. “Pôr fim a” transmite uma ação decisiva e soa natural em português.
- source_word: זָדוֹן
  choice: insolência
  rationale: זָדוֹן denota orgulho presunçoso e sua manifestação em conduta arrogante. “Insolência” preserva tanto a dimensão moral quanto a social do termo.
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: usado como testemunho secundário e registrado em nota
  rationale: O paralelo grego diverge substancialmente do hebraico preservado e parece representar outra forma textual do versículo. O hebraico rege o texto principal, enquanto a leitura grega é apresentada para transparência.
theological_decisions:
- issue: Formas divergentes de Sirácida 7:5 no hebraico e no grego
  choice: Traduzir no texto principal o hebraico preservado
  alternative: 'Traduzir o grego: “Não se justifique diante do Senhor e, diante de um rei, não se faça de sábio.”'
  rationale: Como o texto hebraico deste versículo está preservado com alta confiança, ele serve de base. A forma grega, que não corresponde de perto ao hebraico, é mantida em nota sem tentar harmonizar as duas tradições.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação é concisa como o provérbio hebraico e mantém “força” suficientemente abrangente para incluir capacidade e poder, sem limitar o sentido à força física.
