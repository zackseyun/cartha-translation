  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: pt
  text: Não te contes entre os mortos do povo; lembra-te de que a partida não passará ao largo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da segunda parte é difícil e talvez contenha um jogo de palavras entre “partida” e “passar”. O sentido provável é que a morte ou a mortalidade não deixa ninguém de lado.
    reason: lexical_alternative
  - marker: b
    text: 'A tradição grega traz: “Não odeies o trabalho penoso nem a agricultura criada pelo Altíssimo.” Aqui o grego difere substancialmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: Não te contes
  rationale: O verbo חשב, nesta construção, exprime considerar ou contar a si mesmo como pertencente a um grupo. A formulação conserva a imagem de inclusão e a força da proibição.
- source_word: בָּמֳתֵי עָם
  choice: entre os mortos do povo
  rationale: A expressão hebraica comprimida é entendida concretamente como os mortos pertencentes ao povo ou à comunidade, em vez de como uma referência abstrata à morte.
- source_word: זְכוֹר
  choice: lembra-te
  rationale: Tradução direta do imperativo de זכר, em registro bíblico atual, digno e amplamente compreensível.
- source_word: עִבָּרוֹן
  choice: a partida
  rationale: O substantivo é difícil e parece participar de um jogo de palavras com o verbo seguinte, derivado de עבר. “Partida” comunica a ideia provável de falecimento sem transformar em certeza absoluta uma leitura como “ira” ou “transgressão”.
- source_word: לֹא יִתְעַבָּר
  choice: não passará ao largo
  rationale: A expressão preserva a imagem de algo que não passa por alguém sem o atingir. Também retém parcialmente o jogo verbal hebraico entre o substantivo incerto e o verbo “passar”.
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: não incorporado ao texto principal
  rationale: A tradição grega difere substancialmente do hebraico preservado. Como há aqui testemunho hebraico de alta confiança, ele rege o texto principal, enquanto a leitura grega é apresentada em nota.
theological_decisions:
- issue: Sentido de עִבָּרוֹן e sua relação com a mortalidade
  choice: Traduzir como “a partida”, mantendo em nota a dificuldade do hebraico
  alternative: transgressão; ira; passagem
  rationale: O paralelismo com “os mortos” favorece uma referência à morte, mas a forma hebraica permanece incerta. A tradução comunica o sentido contextual provável sem ocultar outras possibilidades lexicais.
- issue: Divergência entre o hebraico preservado e a tradição grega
  choice: Seguir o hebraico no texto principal e registrar o grego em nota
  alternative: Não odeies o trabalho penoso nem a agricultura criada pelo Altíssimo
  rationale: O hebraico está preservado com alta confiança neste versículo. A leitura grega, embora antiga e relevante, parece refletir outra forma textual e não deve ser harmonizada silenciosamente com o hebraico.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em outros contextos lusófonos. Conserva-se a segunda pessoa singular, comum no registro bíblico, e a formulação deliberadamente tensa da segunda oração, pois o próprio hebraico é difícil.
