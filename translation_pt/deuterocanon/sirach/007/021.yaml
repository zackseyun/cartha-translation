  text: Love an intelligent slave as yourself[a], and do not withhold freedom from him.
translation:
  language: pt
  text: Ame o escravo sensato como a si mesmo[a] e não lhe negue a liberdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sensato”; o paralelo grego traz “bom”: “Ame o escravo (ou servo) bom como a si mesmo”.'
    reason: Registra a variante do paralelo grego sem substituir a leitura hebraica no texto principal.
lexical_decisions:
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo hebraico designa uma pessoa em condição servil. A referência explícita à concessão de liberdade torna essa condição central; por isso, “escravo” é mais preciso que “servo” neste contexto.
- source_word: מַשְׂכִּיל
  choice: sensato
  rationale: O particípio descreve quem demonstra entendimento e age com discernimento. “Sensato” é natural em português e preserva essa dimensão prática; o paralelo grego traz “bom”, provavelmente como leitura ou tradução variante.
- source_word: חַבֵּב
  choice: ame
  rationale: O imperativo pede afeto e estima genuínos. “Ame” expressa diretamente essa força e concorda com o paralelo grego.
- source_word: כְּנֶפֶש
  choice: como a si mesmo
  rationale: Literalmente, a expressão envolve “alma”, “vida” ou “pessoa”, mas funciona idiomaticamente como comparação com o cuidado pela própria pessoa. “Como a si mesmo” comunica esse sentido com clareza.
- source_word: וְאַל תִּמְנַע
  choice: e não lhe negue
  rationale: O verbo significa reter ou impedir que alguém receba algo. Com “liberdade”, “não lhe negue” é corrente e mantém a força da proibição.
- source_word: חֹפֶשׁ
  choice: liberdade
  rationale: O substantivo indica a libertação da condição servil. “Liberdade” é claro, atual e menos técnico que “alforria” ou “manumissão”.
theological_decisions:
- issue: Designação da condição social expressa por עֶבֶד
  choice: escravo
  alternative: servo
  rationale: A ordem de não negar a liberdade mostra que se trata de condição de escravidão, não apenas de serviço doméstico ou emprego. A tradução evita suavizar essa realidade social.
- issue: Sentido da comparação כְּנֶפֶש
  choice: como a si mesmo
  alternative: como à própria vida
  rationale: A formulação idiomática preserva a exigência ética sem determinar se נֶפֶשׁ deve ser entendido estritamente como “alma”, “vida” ou “pessoa”.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na forma de tratamento por “você” subentendida. “Escravo” preserva sem eufemismo a condição social indicada pelo contexto; “sensato” comunica discernimento prático de maneira natural.
