base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: pt
  text: Lembre-se de que, se não fosse por eles[a], você não teria vindo ao mundo; e o que você poderia lhes retribuir pelo que fizeram por você?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, seus pais; o pronome fica implícito no contexto imediato.
    reason: cross_reference
  - marker: b
    text: O hebraico pergunta literalmente o que se faz por eles e usa um verbo que pode significar «tratar», «recompensar» ou «retribuir». O grego formula explicitamente a pergunta em termos de retribuição.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: Lembre-se
  rationale: O imperativo de זכר pede uma lembrança ativa. “Lembre-se” é direto, natural e mantém a força exortativa.
- source_word: לוּלֵי הֵם
  choice: se não fosse por eles
  rationale: A expressão hebraica indica dependência contrafactual. Esta formulação é corrente em português e concorda com o paralelo grego διʼ αὐτῶν.
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: você não teria vindo ao mundo
  rationale: Preserva a imagem hebraica de “vir ao mundo” e, no contexto, comunica naturalmente o nascimento e a existência recebida por meio dos pais.
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: e como poderá retribuir-lhes
  rationale: O hebraico, literalmente, pergunta o que a pessoa faz ou pode fazer por eles. O grego ἀνταποδώσεις explicita a ideia de retribuição; “como poderá retribuir-lhes” transmite a força retórica sem afirmar que uma compensação equivalente seja possível.
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: o que fizeram por você
  rationale: גמל pode significar tratar, recompensar ou conceder um benefício. No contexto parental, a expressão aponta para o bem que os pais fizeram ao filho; a formulação portuguesa mantém o sentido amplo sem especificar somente o nascimento ou o cuidado.
theological_decisions:
- issue: Identificação do referente de “eles”
  choice: Manter o pronome no texto e esclarecer em nota que se refere aos pais
  alternative: Inserir “seus pais” diretamente no texto
  rationale: O contexto imediato identifica pai e mãe, mas o versículo hebraico usa apenas o pronome. Preservá-lo evita acrescentar ao texto uma identificação que, embora segura pelo contexto, permanece implícita na forma da frase.
- issue: Possibilidade de retribuir aos pais de modo equivalente
  choice: Manter a pergunta retórica sem declarar explicitamente se a retribuição equivalente é possível
  alternative: Traduzir “o que você pode fazer por eles à altura do que fizeram por você?”
  rationale: O hebraico e o grego evocam retribuição, mas não formulam uma doutrina sobre equivalência moral ou dívida filial. A pergunta preserva a tensão e deixa sua força ser percebida pelo leitor.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação conserva o pronome implícito do original e usa “retribuir” para refletir o paralelo grego, enquanto a nota registra a construção mais aberta do hebraico.
