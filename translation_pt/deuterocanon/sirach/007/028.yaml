  source_fidelity: 'A primeira oração traduz com fidelidade o hebraico: a construção contrafactual e a imagem de «vir ao mundo» são bem preservadas. Na segunda, «como poderá retribuir-lhes o que fizeram por você?» torna a pergunta sobre o objeto/medida da retribuição em pergunta sobre o modo de retribuir e pode soar como se se retribuíssem as próprias ações. «O que você poderia lhes retribuir pelo que fizeram por você?» mantém a pergunta retórica e é sustentado pelo paralelo grego, sem eliminar a abertura sintática do hebraico.'
  naturalness: O texto é claro, moderno e adequado ao tratamento por «você». A revisão da segunda pergunta produz uma construção mais idiomática e evita a ambiguidade de «retribuir-lhes o que fizeram».
  terminology: «Lembre-se», «vir ao mundo» e «retribuir» são escolhas apropriadas. A nota sobre «eles» identifica corretamente os pais apenas como esclarecimento contextual. A nota lexical deve descrever o hebraico com cautela e apresentar o grego como paralelo explicitador, não como se fosse uma citação portuguesa rígida do hebraico.
