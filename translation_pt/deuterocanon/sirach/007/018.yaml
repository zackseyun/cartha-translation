  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: pt
  text: Não troque um amigo em troca de pagamento[b], nem um irmão pelo ouro de Ofir.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz aqui uma leitura muito diferente: “Lembre-se de que a ira não dura muito.” O testemunho hebraico preservado na Geniza do Cairo adverte, em vez disso, contra trocar um amigo ou irmão por riqueza.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “por um preço”.'
    reason: lexical_alternative
  - marker: c
    text: “Irmão” pode indicar um irmão de sangue ou, em sentido mais amplo, um parente próximo ou companheiro íntimo. A expressão hebraica ligada ao “ouro de Ofir” é difícil; esta tradução segue o sentido de valor/troca sugerido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִיר
  choice: troque
  rationale: O hifil de מור expressa troca ou substituição. “Troque” preserva o sentido básico e, com “por um preço”, mantém a imagem comercial do hebraico.
- source_word: אוֹהֵב
  choice: amigo
  rationale: Embora a forma designe literalmente “quem ama”, no uso sapiencial refere-se naturalmente a um amigo ou companheiro leal.
- source_word: בִּמְחִיר
  choice: por um preço
  rationale: מחיר significa preço ou pagamento. A expressão conserva a força mercenária do aviso sem limitar o ganho especificamente a dinheiro em espécie.
- source_word: אָח
  choice: irmão
  rationale: Esta é a correspondência direta do hebraico. O termo pode também abranger um parente próximo ou companheiro íntimo, possibilidade registrada em nota.
- source_word: תָּלוּי
  choice: que vale
  rationale: A forma hebraica é difícil, mas o paralelismo com “por um preço” e a referência ao ouro de Ofir favorecem uma ideia de avaliação ou comparação. “Que vale” comunica essa leitura sem introduzir a noção não expressa de um irmão “verdadeiro”.
- source_word: בִּזְהַב אוֹפִיר
  choice: o ouro de Ofir
  rationale: Mantém o topônimo bíblico e sua associação literária com ouro de valor excepcional.
theological_decisions:
- issue: Escolha entre o testemunho hebraico e a leitura grega divergente
  choice: Seguir no texto principal o hebraico preservado na Geniza do Cairo.
  alternative: “Lembre-se de que a ira não dura muito.”
  rationale: Como o hebraico subsiste neste ponto, ele serve de fonte principal. A leitura grega é materialmente diferente e deve ser preservada em nota como testemunho de uma tradição textual divergente, sem harmonização.
- issue: Sentido da expressão אָח תָּלוּי בִּזְהַב אוֹפִיר
  choice: “um irmão que vale o ouro de Ofir”
  alternative: “um irmão comparável ao ouro de Ofir” ou uma tradução mais literal e obscura, “um irmão pendente do ouro de Ofir”
  rationale: O contexto comercial e o paralelismo favorecem uma relação de valor. A tradução mantém essa leitura como provável, mas evita qualificações teológicas ou morais sem apoio textual, como “irmão verdadeiro”.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva a metáfora comercial e o nome Ofir, evitando tanto arcaísmo desnecessário quanto explicitação doutrinária.
