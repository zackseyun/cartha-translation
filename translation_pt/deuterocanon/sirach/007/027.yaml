  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: pt
  text: De todo o coração, honre seu pai[a] e não se esqueça das dores de parto de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso na segunda parte (“e a mãe que deu à luz você, não...”); o paralelo grego esclarece o sentido: “não se esqueça das dores de parto de sua mãe”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: De todo o coração
  rationale: Expressão portuguesa natural e corrente que preserva a ideia hebraica de inteireza, sinceridade e dedicação plena.
- source_word: כַּבֵּד
  choice: honre
  rationale: Neste contexto familiar, o verbo כבד significa atribuir o devido peso e respeito; “honre” corresponde ao uso bíblico habitual e é claro em português moderno.
- source_word: לְאָבִיךָ
  choice: seu pai
  rationale: Reproduz diretamente o referente familiar e pessoal do hebraico.
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: sua mãe
  rationale: O hebraico diz de modo compacto “a mãe que deu à luz você”. A relação pessoal é explicitada naturalmente por “sua mãe”, enquanto a referência ao parto aparece na expressão seguinte, apoiada pelo paralelo grego.
- source_word: אַל תִּשֶּׁה
  choice: não se esqueça
  rationale: O paralelo grego traz μὴ ἐπιλάθῃ, “não se esqueça”, esclarecendo o sentido do final hebraico conciso.
- source_word: μητρὸς ὠδῖνας
  choice: das dores de parto de sua mãe
  rationale: O grego explicita o sofrimento materno no parto. “Dores de parto” é uma formulação atual, clara e fiel, sem tom arcaico ou excessivamente clínico.
theological_decisions:
- issue: Uso do testemunho hebraico primário com esclarecimento do paralelo grego
  choice: Traduzir o hebraico como testemunho principal e usar o grego para esclarecer a última oração como uma exortação a não esquecer as dores de parto da mãe.
  alternative: 'Verter apenas a formulação hebraica, de modo mais literal e obscuro: “e a mãe que deu à luz você, não...”'
  rationale: O hebraico preservado é prioritário, mas seu final é muito conciso. O paralelo grego oferece uma leitura coerente e provavelmente preserva de maneira explícita o sentido subentendido, permitindo uma tradução clara sem ocultar a base textual, que é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “seu” em vez de “teu” para manter um registro corrente e respeitoso; a construção conserva o paralelismo e a força imperativa do original.
