base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/007.yaml
  text: Do not make yourself guilty in the assembly at the gates of God[a], and do not bring yourself down in the congregation.
translation:
  language: pt
  text: Não se torne culpado na assembleia às portas de Deus[a], nem se rebaixe no meio da congregação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “Não peque na multidão da cidade, nem se lance por terra em uma multidão.” Isso pode refletir uma leitura hebraica diferente ou uma interpretação que suavizou a expressão hebraica “portas de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: Não se torne culpado
  rationale: O hifil de רשע com sufixo reflexivo aponta para fazer recair culpa sobre si mesmo. A formulação preserva essa especificidade melhor que o genérico “não peque”.
- source_word: בַּעֲדַת
  choice: na assembleia
  rationale: עֵדָה designa um grupo reunido; “assembleia” mantém o cenário público e coletivo.
- source_word: שַׁעֲרֵי אֵל
  choice: às portas de Deus
  rationale: Traduz de modo direto a expressão hebraica incomum, sem substituí-la pela leitura grega mais fluida. “Às portas” também sugere naturalmente o espaço público ou judicial associado às portas.
- source_word: וְאַל תַּפִּילְךָ
  choice: nem se rebaixe
  rationale: A forma causativa com valor reflexivo comunica fazer a si mesmo cair ou ficar em condição inferior. “Rebaixar-se” é idiomático em português e conserva a ideia de autodegradação sem impor uma ruína definitiva.
- source_word: בַּקְּהִלָּה
  choice: no meio da congregação
  rationale: קְהִלָּה indica a comunidade reunida. “Congregação” preserva a distinção lexical em relação a עֵדָה, e “no meio de” torna clara a esfera pública da ação.
theological_decisions:
- issue: Seguir a expressão hebraica incomum “portas de Deus” ou a leitura grega “multidão da cidade”
  choice: Manter “assembleia às portas de Deus” no texto principal
  alternative: “Não peque na multidão da cidade”
  rationale: O hebraico preservado é a testemunha primária e tem alta confiança, embora sua expressão seja difícil. A leitura grega pode refletir outro texto hebraico ou uma interpretação que tornou o cenário urbano mais explícito; por isso, ela é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução mantém a construção pública e comunitária dos dois membros e preserva, com nota, a dificuldade textual de “portas de Deus”.
