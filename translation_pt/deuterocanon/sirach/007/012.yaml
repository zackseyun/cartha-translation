  text: Do not plot violence against a brother, nor do the like against a friend or companion together.
translation:
  language: pt
  text: Não trame[a] violência contra um irmão; tampouco faça isso contra um amigo ou companheiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «Não lavre violência». A imagem é a de preparar ou arquitetar o mal.'
    reason: Explica a metáfora agrícola do verbo hebraico, que uma tradução idiomática como «trame» não mostra diretamente.
lexical_decisions:
- source_word: תַּחֲרוֹשׁ
  choice: trame
  rationale: O verbo significa literalmente «lavrar», mas aqui funciona metaforicamente no sentido de arquitetar ou planejar algo nocivo. «Trame» preserva a ideia de preparação deliberada em português natural.
- source_word: חָמָס
  choice: violência
  rationale: O termo hebraico pode abranger violência, dano e injustiça. «Violência» reproduz seu sentido central neste contexto sem reduzir toda a sua carga moral.
- source_word: אָח
  choice: um irmão
  rationale: Mantém o sentido direto do hebraico e sua possível amplitude relacional, sem especificar se se trata de irmão consanguíneo ou membro da comunidade.
- source_word: רֵעַ וְחָבֵר
  choice: um amigo ou companheiro
  rationale: Os dois termos próximos são mantidos para refletir a acumulação hebraica; a coordenação com «ou» soa natural sob a proibição e não limita a advertência apenas a quem reúna as duas condições.
- source_word: יַחְדָּו
  choice: '[expresso distributivamente em «amigo ou companheiro»]'
  rationale: Literalmente «juntos» ou «igualmente». Aqui reforça a inclusão conjunta das duas categorias; a formulação portuguesa comunica essa abrangência sem o pouco natural «juntos».
theological_decisions:
- issue: Natureza do mal proibido
  choice: violência
  alternative: mentira / falsidade
  rationale: O texto hebraico de alta confiança traz חמס, «violência, dano, injustiça». O grego paralelo traz ψεῦδος, «falsidade», mas deve servir como testemunho de comparação, não substituir a leitura hebraica adotada.
- issue: Alcance de «irmão»
  choice: preservar «irmão» sem explicitação
  alternative: compatriota ou membro da comunidade
  rationale: O hebraico admite alcance literal ou comunitário. A tradução conserva essa ambiguidade em vez de decidir por uma interpretação específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura em duas partes acompanha o paralelismo hebraico; «tampouco faça isso» evita repetição pesada e representa וְכֵן, «e do mesmo modo».
