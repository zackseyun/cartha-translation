  text: Marry off a daughter[a], and the matter will be settled[b]; and give her to an intelligent man.
translation:
  language: pt
  text: Dê uma filha em casamento, e a questão ficará resolvida[a]; una-a a um homem sensato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente, “e o assunto sairá”, no sentido de que a incumbência ou preocupação chegará ao fim. O paralelo grego explicita: “e você terá concluído uma grande tarefa”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “dê-a em casamento a um homem sensato”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: Dê uma filha em casamento
  rationale: Embora הוֹצֵא signifique literalmente “faça sair” ou “mande para fora”, neste contexto a expressão idiomática se refere à ação de dar uma filha em casamento, sentido confirmado pelo paralelo grego ἔκδου. O artigo possessivo não foi acrescentado porque בַת está sem possessivo explícito.
- source_word: וְיֵצֵא עֵסֶק
  choice: e a questão ficará resolvida
  rationale: A formulação hebraica é literalmente algo como “e o assunto sairá”. Aqui, עֵסֶק designa uma questão, incumbência ou preocupação, e יֵצֵא indica que ela chega ao fim. A tradução comunica esse sentido sem reproduzir uma expressão pouco natural em português.
- source_word: גֶּבֶר נָבוֹן
  choice: um homem sensato
  rationale: גֶּבֶר é “homem”, e נָבוֹן descreve alguém dotado de entendimento e discernimento. “Sensato” expressa essa qualidade de modo natural e evita limitar o termo à capacidade intelectual.
- source_word: חַבְּרָהּ
  choice: una-a
  rationale: A forma deriva da raiz חבר, “unir, associar, ligar”. “Una-a” preserva de perto a imagem hebraica, enquanto o contexto matrimonial esclarece a natureza dessa união.
