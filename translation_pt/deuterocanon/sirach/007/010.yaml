translation:
  language: pt
  text: Não desanime em sua oração e não deixe de dar esmolas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “esmolas” também pode significar “retidão” ou “justiça”; aqui, porém, o paralelo grego diz explicitamente “dar esmolas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: Não desanime
  rationale: A forma hebraica é difícil isoladamente, mas o paralelo grego μὴ ὀλιγοψυχήσῃς sustenta o sentido de perder o ânimo. “Não desanime” é natural e claro em português.
- source_word: בַּתְּפִלָּה
  choice: em sua oração
  rationale: O hebraico diz literalmente “na oração”, enquanto o paralelo grego explicita “sua”. O possessivo produz uma exortação natural em português sem alterar o sentido.
- source_word: וּבִצְדָקָה
  choice: e ... dar esmolas
  rationale: Embora צדקה também possa significar “justiça”, no hebraico tardio pode designar ajuda caridosa; o grego ἐλεημοσύνην ποιῆσαι confirma aqui o sentido de dar esmolas.
- source_word: אַל תִּתְעַבָּר
  choice: não deixe de
  rationale: O verbo sugere passar por cima, omitir ou negligenciar. “Não deixe de” transmite de modo idiomático a proibição de negligenciar essa prática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação amplamente compreensível e boa legibilidade brasileira. A tradução segue o hebraico e usa o paralelo grego para esclarecer as duas expressões difíceis.
