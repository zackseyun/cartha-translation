translation:
  language: pt
  text: Você tem animais de criação? Observe-os atentamente[a]; e, se forem úteis[b], mantenha-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “veja [com] seus olhos”; isto é, inspecione-os ou vigie-os atentamente.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato do adjetivo hebraico é incerto; o paralelo grego traz “úteis”. Outras possibilidades incluem “proveitosos” ou “confiáveis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה
  choice: animais
  rationale: O termo hebraico pode designar animal doméstico ou criação em sentido coletivo. “Animais” é claro e abrangente em português, sem restringir o sentido a gado bovino; o paralelo grego também emprega um termo amplo para animais de criação.
- source_word: לְךָ
  choice: Você tem
  rationale: A construção hebraica é nominal, literalmente “animal para você”, e expressa posse. A pergunta “Você tem animais?” reproduz de modo natural sua força contextual, confirmada pelo paralelo grego.
- source_word: רְאֵה עֵינֶיךָ
  choice: Mantenha-os sob seu olhar
  rationale: A expressão significa literalmente “veja [com] seus olhos” e comunica vigilância e cuidado atentos. A formulação conserva a imagem concreta dos olhos sem soar artificial em português.
- source_word: אֻמָּנָה
  choice: úteis
  rationale: A nuance exata do adjetivo hebraico é incerta. O grego χρήσιμα favorece “úteis” ou “proveitosos”; “úteis” preserva essa amplitude sem especificar indevidamente lucro, produtividade ou treinamento.
- source_word: הַעֲמִידָהּ
  choice: conserve-os
  rationale: A forma causativa de עמד significa literalmente fazer ou manter de pé. Neste contexto, indica manter ou reter os animais; “conserve-os” expressa essa continuidade com naturalidade.
