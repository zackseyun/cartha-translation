base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/023.yaml
  text: Do you have sons? Discipline them[a], and get wives for them in their youth.
translation:
  language: pt
  text: Você tem filhos? Discipline-os[a] e providencie esposas para eles enquanto ainda são jovens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Você tem filhos? Discipline-os e dobre-lhes o pescoço desde a juventude”. O testemunho hebraico traz, em vez disso: “e providencie esposas para eles enquanto ainda são jovens”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: filhos
  rationale: O plural masculino hebraico significa aqui especificamente “filhos”; a instrução seguinte, sobre providenciar esposas para eles, confirma a referência masculina.
- source_word: יַסֵּר
  choice: discipline-os
  rationale: O verbo יסר expressa instrução corretiva ou disciplina. “Discipline-os” conserva tanto a ideia de correção quanto a de formação, em linguagem atual.
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: providencie esposas para eles
  rationale: O idioma hebraico se refere a promover ou assegurar o casamento dos filhos. “Providencie esposas para eles” comunica de modo natural a atuação parental sem sugerir que o pai se case com essas mulheres.
- source_word: בִּנְעוּרֵיהֶם
  choice: enquanto ainda são jovens
  rationale: A expressão indica o período da juventude deles. Esta formulação é clara e idiomática em português contemporâneo.
theological_decisions:
- issue: Divergência entre o hebraico e o paralelo grego no segundo membro do versículo
  choice: 'Seguir o hebraico: “providencie esposas para eles enquanto ainda são jovens”'
  alternative: 'Seguir o grego: “dobre-lhes o pescoço desde a juventude”'
  rationale: Como o texto hebraico está preservado e é coerente no contexto, ele rege o texto principal. A leitura grega, substancialmente diferente, é mantida em nota para preservar com transparência a variação textual e interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta inicial reproduz a força pragmática do hebraico nominal, em consonância com o paralelo grego; “providencie” expressa o costume parental antigo sem recorrer a uma formulação arcaica.
