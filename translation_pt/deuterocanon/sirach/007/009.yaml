  text: Do not be hasty in the army[a], for it is laborious work allotted by God.
translation:
  language: pt
  text: Não se precipite no serviço militar[a], pois ele é um trabalho penoso atribuído por Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Não diga: “Ele olhará para a multidão das minhas ofertas e, quando eu as apresentar ao Deus Altíssimo, ele as aceitará.”» Isso reflete uma tradição textual substancialmente diferente do hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: Não se precipite
  rationale: O imperativo negativo adverte contra agir com pressa ou impetuosidade. «Não se precipite» é natural em português e preserva esse sentido.
- source_word: בַּצָּבָא
  choice: no exército
  rationale: צָבָא designa normalmente exército, hoste ou serviço militar. Neste testemunho hebraico, «no exército» expressa de modo direto o contexto militar.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: um trabalho penoso
  rationale: A combinação de «trabalho» com «serviço/labor» intensifica a ideia de esforço oneroso. «Trabalho penoso» comunica isso com clareza, sem reproduzir de modo rígido a duplicação hebraica.
- source_word: מֵאֵל
  choice: por Deus
  rationale: A preposição pode indicar origem ou agente; com o particípio passivo, «por Deus» é uma formulação natural que preserva a atribuição divina.
- source_word: נֶחֱלָקָה
  choice: atribuído
  rationale: A forma passiva de חלק indica algo repartido, destinado ou designado. «Atribuído» se ajusta ao trabalho que cabe a alguém por determinação de Deus.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego
  choice: Traduzir o hebraico preservado como texto principal
  alternative: O grego traz uma advertência sobre confiar na quantidade de ofertas para obter aceitação diante do Deus Altíssimo.
  rationale: O hebraico existente apresenta uma advertência sobre o exército, enquanto o grego reflete uma tradição textual substancialmente diferente. Segue-se o hebraico no texto principal, registrando-se o grego em nota para transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «esse é» explicita naturalmente o referente do pronome hebraico, isto é, o serviço no exército.
