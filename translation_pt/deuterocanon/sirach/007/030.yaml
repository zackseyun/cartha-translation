base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/030.yaml
  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: pt
  text: Com toda a sua força[a], ame o seu Criador e não abandone os seus ministros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com todo o seu vigor” ou “com todo o seu poder”.
    reason: lexical_alternative
  - marker: b
    text: “Seus ministros” pode referir-se mais especificamente aos que servem a Deus no culto ou no templo; também pode ser traduzido por “seus servos” ou “os que o servem”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: com toda a sua força
  rationale: A expressão hebraica indica a totalidade da força, capacidade ou poder da pessoa; o grego ἐν ὅλῃ δυνάμει confirma esse sentido. A formulação é clara e preserva a ênfase na devoção integral.
- source_word: אֱהוֹב
  choice: ame
  rationale: Imperativo direto de אהב, vertido naturalmente pelo verbo português “amar”.
- source_word: עוֹשֶׂךָ
  choice: o seu Criador
  rationale: O particípio significa literalmente “aquele que fez você”. “O seu Criador” é conciso, natural e explicita a relação pessoal com Deus sem acrescentar conteúdo estranho ao hebraico; o grego τὸν ποιήσαντά σε sustenta essa leitura.
- source_word: מְשָׁרְתָיו
  choice: os seus ministros
  rationale: Derivado de שרת, o termo designa pessoas que servem ou ministram, possivelmente em função oficial ou cultual. “Ministros” conserva essa nuance, também apoiada pelo grego λειτουργούς, embora em português possa ter associações contemporâneas mais específicas; por isso, a alternativa é registrada em nota.
- source_word: לֹא תַעֲזֹב
  choice: não abandone
  rationale: עזב significa deixar, abandonar ou desamparar. “Não abandone” transmite com naturalidade a força moral da proibição e corresponde ao grego μὴ ἐγκαταλίπῃς.
theological_decisions:
- issue: Referente de עוֹשֶׂךָ
  choice: o seu Criador
  alternative: aquele que fez você
  rationale: O contexto apresenta Deus como aquele que criou o destinatário. A inicial maiúscula sinaliza o referente divino segundo a convenção editorial, sem resolver qualquer tensão teológica adicional.
- issue: Sentido de מְשָׁרְתָיו / λειτουργούς αὐτοῦ
  choice: os seus ministros
  alternative: os seus servos; os que o servem
  rationale: O hebraico e o paralelo grego permitem um sentido geral de servidores de Deus, mas também sugerem serviço oficial, sagrado ou ligado ao templo. A tradução principal conserva essa provável nuance, enquanto a nota preserva a amplitude sem identificar o grupo com uma estrutura eclesiástica posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de tratamento na terceira pessoa. A ordem inicial do hebraico foi preservada para manter a ênfase em uma devoção exercida com toda a força. “Ministros” retém a provável dimensão cultual, e a nota evita que o termo seja entendido apenas segundo usos políticos ou eclesiásticos modernos.
