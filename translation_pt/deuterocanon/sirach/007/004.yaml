  text: Do not justify yourself before a king[a], and do not show understanding before a king.
translation:
  language: pt
  text: Não se justifique diante de um rei[a] e não exiba entendimento diante de um rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Não busque do Senhor o governo, nem de um rei um assento de glória.” A testemunha hebraica seguida aqui difere substancialmente.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  choice: Não se justifique
  rationale: 'O imperativo negativo com o hitpael de צדק tem força reflexiva: ‘justificar-se’ ou ‘mostrar-se justo’. A formulação preserva essa reflexividade sem explicitar além do hebraico uma acusação de hipocrisia.'
- source_word: לִפְנֵי מֶלֶךְ
  choice: diante de um rei
  rationale: לִפְנֵי indica presença ou posição perante alguém, e מֶלֶךְ não tem artigo; por isso, ‘um rei’ é preferível a ‘o rei’.
- source_word: וּמִפְּנֵי מֶלֶךְ
  choice: e ... diante de um rei
  rationale: Apesar da forma preposicional ligeiramente diferente, o segundo sintagma funciona em paralelo estreito com o primeiro. Repetir ‘diante de um rei’ conserva a concisão e o paralelismo do hebraico.
- source_word: אַל תִּתְבּוֹנֵן
  choice: não exiba entendimento
  rationale: A forma derivada de בין pode denotar mostrar-se entendido ou perspicaz neste contexto social. ‘Exiba entendimento’ comunica uma demonstração ostensiva sem reduzi-la simplesmente a ‘ser inteligente’.
theological_decisions:
- issue: Divergência substancial entre as testemunhas hebraica e grega
  choice: Traduzir como texto principal o hebraico preservado, que adverte contra justificar-se e exibir entendimento diante de um rei.
  alternative: 'O grego diz: ‘Não busque do Senhor o governo, nem de um rei um assento de glória.’'
  rationale: Como existe uma testemunha hebraica de alta confiança, ela é a fonte principal. A leitura grega não é harmonizada com ela, pois representa uma variante substancial e deve permanecer visível em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de ‘diante de um rei’ preserva o paralelismo hebraico. O marcador [a] foi colocado no texto principal junto à primeira ocorrência da expressão à qual se vincula a nota textual.
