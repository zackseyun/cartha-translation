base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: pt
  text: 'Quanto à disciplina do ingênuo e do insensato[a], e quanto ao idoso que volta atrás e busca conselho em matéria de imoralidade sexual: sê verdadeiramente cauteloso[b] e recatado diante de todo ser vivo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e de um homem extremamente idoso julgado com jovens”, em lugar de “e quanto ao idoso que volta atrás e busca conselho em matéria de imoralidade sexual”. O hebraico e o grego diferem substancialmente nesta oração.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, seguindo mais de perto o paralelo grego na exortação final: “serás verdadeiramente instruído e aprovado diante de todo ser vivo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: disciplina
  rationale: Abrange instrução corretiva e formação moral; “disciplina” conserva ambos os aspectos e se ajusta à construção introdutória.
- source_word: פותה
  choice: ingênuo
  rationale: Designa alguém inexperiente, crédulo ou facilmente seduzido; “ingênuo” comunica isso em português atual sem reduzir o termo a mera falta de inteligência.
- source_word: כסיל
  choice: insensato
  rationale: Termo sapiencial de censura moral e intelectual; “insensato” preserva esse valor melhor que uma designação puramente cognitiva.
- source_word: ושב
  choice: que volta atrás
  rationale: Mantém a imagem hebraica de retorno ou recaída sem definir de modo excessivo a conduta anterior.
- source_word: ישיש
  choice: idoso
  rationale: Indica um homem de idade avançada; “idoso” é claro, atual e respeitoso.
- source_word: נוטל עצה
  choice: busca conselho
  rationale: Expressa de maneira natural o idiomatismo de “tomar conselho”, preservando a ideia de consulta ou deliberação.
- source_word: בזנות
  choice: em matéria de imoralidade sexual
  rationale: זנות pode abranger prostituição e conduta sexual ilícita em sentido mais amplo; a formulação evita restringir indevidamente o alcance.
- source_word: זהיר
  choice: cauteloso
  rationale: Comunica vigilância prudente e se encaixa naturalmente na exortação.
- source_word: באמת
  choice: verdadeiramente
  rationale: Preserva a intensificação ligada à verdade, autenticidade ou sinceridade.
- source_word: צנוע
  choice: recatado
  rationale: Conserva as ideias de modéstia, reserva e domínio próprio, adequadas ao contexto ético e social.
- source_word: לפני כל חי
  choice: diante de todo ser vivo
  rationale: Tradução transparente que mantém o alcance universal e a expressão concreta do hebraico.
theological_decisions:
- issue: Prioridade do hebraico diante da divergência substancial do paralelo grego
  choice: Seguir no texto principal o hebraico preservado, que fala de um idoso que volta atrás e busca conselho em matéria de imoralidade sexual.
  alternative: 'Seguir o grego: “e de um homem extremamente idoso julgado com jovens”.'
  rationale: O testemunho hebraico é a fonte primária onde está preservado. Como o grego apresenta uma leitura sensivelmente diferente, sua forma é registrada em nota, sem harmonização silenciosa.
- issue: Sentido da exortação final
  choice: “sê verdadeiramente cauteloso e um homem recatado”
  alternative: “serás verdadeiramente instruído e aprovado”
  rationale: A tradução principal reflete זהיר e צנוע no hebraico; a leitura grega é semanticamente distinta e merece ser preservada como alternativa textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura enumerativa do hebraico foi mantida, mas com a repetição de “quanto a” para clareza. As notas preservam as divergências reais entre o hebraico e o grego.
