  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: pt
  text: Quanto a um lugar que designares[a], faze a contagem com tua própria mão; e registra por escrito todo dar e receber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação hebraica é bastante condensada. O paralelo grego diz: “Tudo o que entregares, faze-o por número e peso; e que todo dar e receber fique registrado por escrito”, apoiando o sentido de uma contabilidade cuidadosa e documentada.'
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום
  choice: Quanto ao lugar
  rationale: Mantém o substantivo hebraico מקום, “lugar”, e entende על como introdução do assunto. A expressão é comprimida e seu referente exato permanece incerto.
- source_word: תפקד
  choice: que designares
  rationale: פקד pode expressar designar, encarregar ou confiar. “Designares” preserva a construção hebraica sem fundir o verbo e “lugar” na ideia interpretativa de “depósito”.
- source_word: יד תספור
  choice: faze a contagem com tua própria mão
  rationale: Reproduz a imagem concreta de “a tua mão contará” em português compreensível e comunica uma conferência pessoal e cuidadosa.
- source_word: ומתת ולקח
  choice: tudo o que deres e receberes
  rationale: A dupla nominal abrange os dois lados de uma transação. A formulação verbal é natural em português e concorda com o paralelo grego δόσις καὶ λῆψις.
- source_word: הכל בכתב
  choice: põe por escrito tudo
  rationale: Expressa de modo direto a exigência de documentação escrita contida na frase nominal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa coerente com o contexto sapiencial. Conservou-se “lugar” no texto principal para não substituir silenciosamente a redação hebraica incerta pela leitura mais explícita do paralelo grego; a nota apresenta essa evidência. O pronome possessivo em “tua própria mão” mantém a imagem hebraica e reforça a responsabilidade pessoal.
