base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/016.yaml
  text: The sun rises and shines on everything revealed[b][a], and the glory of the Lord is over all his works.
translation:
  language: pt
  text: O sol nasce e brilha sobre tudo o que se torna visível[b][a], e a glória do Senhor está sobre todas as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «sobre tudo o que se revela/se torna visível». O paralelo grego diz, mais aproximadamente: «iluminando, contempla tudo».'
    reason: alternative_reading
  - marker: b
    text: O testemunho hebraico mais antigo de Massada parece conservar neste trecho uma redação diferente da encontrada nos manuscritos da Guenizá do Cairo, nos quais se baseia a tradução principal.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: O sol
  rationale: Tradução direta do substantivo; o artigo definido é natural em português.
- source_word: זורחת
  choice: nasce e brilha
  rationale: O particípio de זרח pode expressar tanto o nascer do sol quanto seu resplendor. A formulação conserva as duas nuances poéticas, e o paralelo grego reforça a ideia de iluminar.
- source_word: על כל
  choice: sobre tudo / sobre todas
  rationale: A expressão indica alcance abrangente; a repetição de «sobre» mantém o paralelismo dos dois membros.
- source_word: נגלתה
  choice: o que se torna visível
  rationale: Conserva o sentido passivo ou resultativo daquilo que é descoberto, manifesto ou visível, sem lhe impor uma interpretação teológica mais estreita.
- source_word: כבוד
  choice: glória
  rationale: Equivalente tradicional e semanticamente apropriado para כבוד quando relacionado a Deus.
- source_word: ה'
  choice: o Senhor
  rationale: Representa de modo corrente e digno a abreviação hebraica do nome ou título divino neste contexto.
- source_word: מעשיו
  choice: suas obras
  rationale: Abrange tanto os feitos quanto aquilo que Deus criou e preserva o paralelismo poético conciso.
theological_decisions:
- issue: Representação de ה'
  choice: o Senhor
  alternative: o SENHOR
  rationale: O manuscrito traz a forma abreviada ה'. «O Senhor» segue o uso corrente em Sirácida sem afirmar mais do que o testemunho textual permite.
- issue: Divergência hebraico-grega no primeiro membro
  choice: O sol nasce e brilha sobre tudo o que se torna visível
  alternative: O sol, iluminando, contempla tudo
  rationale: O texto hebraico é a base e contém a referência ao que se manifesta ou fica visível; o grego ressalta iluminação e contemplação. A tradução principal conserva o hebraico, enquanto a nota registra a diferença.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. «Torna visível» mantém a nuance passiva de נגלתה; «nasce e brilha» preserva a amplitude imagética de זורחת. Os marcadores seguem a ordem fornecida no texto de consulta.
