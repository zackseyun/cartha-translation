  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
translation:
  language: pt
  text: Para uma esposa má, é bom pôr um selo; e, onde muitas mãos têm acesso, tranque tudo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico preservado traz literalmente algo como “mãos frouxas” ou “mãos fracas”; o paralelo grego diz “muitas mãos”. O texto principal segue o sentido grego, coerente com a advertência sobre acesso compartilhado e segurança.
    reason: textual_variant
  - marker: b
    text: A forma hebraica final parece dizer “abra”, mas o paralelo grego traz “feche” ou “tranque”. O texto principal segue a leitura contextual mais clara do grego.
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  choice: uma esposa má
  rationale: אשה pode significar “mulher” ou “esposa”. O contexto doméstico favorece “esposa”, sem ampliar a afirmação para as mulheres em geral; רעה é vertido naturalmente como “má”.
- source_word: חותם חסם
  choice: é bom pôr um selo
  rationale: A expressão hebraica é concisa e difícil. O paralelo grego καλὸν σφραγίς confirma a ideia de que um selo é apropriado; a formulação portuguesa explicita de modo mínimo o ato de selar.
- source_word: ומקום
  choice: e, onde
  rationale: Introduz naturalmente a circunstância locativa, de acordo também com o grego ὅπου.
- source_word: ידים רפות
  choice: muitas mãos têm acesso
  rationale: O hebraico preservado parece dizer literalmente “mãos frouxas/fracas”, mas o grego lê χεῖρες πολλαί, “muitas mãos”. Esta leitura produz um provérbio coerente sobre acesso compartilhado e segurança; “têm acesso” torna a implicação clara sem perder a imagem das mãos.
- source_word: תפתח
  choice: tranque tudo
  rationale: A forma hebraica preservada parece significar “abra”, em tensão com o contexto. O imperativo grego κλεῖσον, “feche/tranque”, oferece a leitura contextual mais coerente. “Tudo” retoma de modo idiomático aquilo a que as muitas mãos têm acesso.
theological_decisions:
- issue: “Esposa” ou “mulher” numa máxima de tom difícil
  choice: esposa
  alternative: mulher
  rationale: Tanto אשה quanto γυνή admitem os dois sentidos, mas o contexto de administração da casa favorece “esposa”. Isso preserva o teor incômodo do texto sem convertê-lo numa generalização sobre todas as mulheres.
- issue: Seguir as formas hebraicas difíceis ou a leitura coerente do paralelo grego
  choice: muitas mãos têm acesso; tranque tudo
  alternative: as mãos estão frouxas; abra
  rationale: O hebraico composto apresenta uma sequência semanticamente obscura e contrária ao movimento do provérbio. O grego antigo preserva uma leitura clara e internamente coerente, enquanto as formas hebraicas são registradas em nota para manter transparência textual.
translation_notes:
  register: Português atual, digno e acessível, com cadência proverbial. “Pôr um selo” conserva a imagem antiga; “têm acesso” e “tranque tudo” comunicam sua função prática com clareza. As variantes relevantes são preservadas em notas.
