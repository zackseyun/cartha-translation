base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: pt
  text: Os santos de Deus não foram capazes de narrar as maravilhas do SENHOR.[a] Deus fortaleceu suas hostes, para que permanecessem firmes diante de sua glória.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Massada parece trazer “não compreenderam” onde o texto da Geniza do Cairo traz “não foram capazes” ou “não bastaram”; o grego favorece o sentido de não serem capazes de narrar tudo plenamente.
    reason: textual_variant
  - marker: b
    text: 'A segunda frase varia entre os testemunhos hebraicos: a Geniza do Cairo traz “Deus fortaleceu suas hostes”, enquanto Massada parece trazer “o Senhor fortaleceu em suas luzes” ou “em seus luminares”. O grego diz: “o que o Senhor Todo-Poderoso estabeleceu, para que o todo fosse firmado em sua glória”.'
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו / לא השכיל
  choice: não foram capazes
  rationale: No texto da Geniza, לא הספיקו exprime insuficiência ou incapacidade para realizar plenamente a ação; o paralelo grego também favorece a incapacidade de narrar. A variante de Massada pode apontar para “não compreenderam”, preservada em nota.
- source_word: קדושי אל
  choice: os santos de Deus
  rationale: Tradução formal que mantém aberta a identidade dos referentes — seres santos ou pessoas santas — sem acrescentar uma identificação específica.
- source_word: לספר נפלאות ה׳
  choice: narrar as maravilhas do SENHOR
  rationale: לספר significa contar ou narrar, e נפלאות designa maravilhas ou feitos maravilhosos. “Narrar as maravilhas” conserva o tom elevado e permanece claro em português atual.
- source_word: אמץ אלהים
  choice: Deus fortaleceu
  rationale: Segue o principal texto hebraico, no qual אלהים é o sujeito e אמץ comunica a ação de fortalecer ou tornar firme.
- source_word: צבאיו
  choice: suas hostes
  rationale: “Hostes” conserva a amplitude de צבא, que pode indicar exércitos ou hostes celestes, sem limitar indevidamente a referência.
- source_word: להתחזק לפני כבודו
  choice: para que permanecessem firmes diante de sua glória
  rationale: Expressa a ideia reflexiva de mostrar-se forte ou manter-se firme. “Diante de sua glória” traduz לפני כבודו sem explicar além do texto.
theological_decisions:
- issue: Título divino em testemunhos divergentes (ה׳ / אלהים / אדני; grego κύριος)
  choice: SENHOR na primeira frase; Deus na segunda
  alternative: SENHOR nas duas frases
  rationale: A escolha acompanha o texto hebraico principal, que traz ה׳ na primeira oração e אלהים na segunda, enquanto a nota registra a variação da segunda oração.
- issue: Identidade de קדושי אל
  choice: os santos de Deus
  alternative: os seres santos de Deus
  rationale: A formulação escolhida preserva a ambiguidade entre seres celestes e pessoas santas, evitando resolver uma questão que o hebraico não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Hostes” foi mantido por precisão semântica e para não restringir צבא a exércitos humanos. A capitalização “SENHOR” representa o tetragrama na primeira frase.
