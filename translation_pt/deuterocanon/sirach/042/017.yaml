  source_fidelity: 'A tradução segue de perto o hebraico da Geniza: “não foram capazes” comunica adequadamente לא הספיקו; “os santos de Deus” preserva a abertura de קדושי אל; e a alternância SENHOR/Deus reflete os títulos divinos do texto-base. A segunda oração traduz com fidelidade a ação de fortalecer, as “hostes” e a ideia de firmeza perante a glória divina. As notas registram de modo apropriado as variantes de Massada e o paralelo grego.'
  naturalness: O português é moderno, claro e de registro elevado sem soar artificial. “Narrar as maravilhas”, “suas hostes” e “diante de sua glória” são formulações naturais para o gênero sapiencial. A construção final com “para que permanecessem firmes” é idiomática e expressa bem o valor final/reflexivo do infinitivo hebraico.
  terminology: “SENHOR” para o tetragrama e “Deus” para אלהים seguem o texto hebraico principal. “Santos de Deus” mantém prudentemente a ambiguidade do referente, e “hostes” evita reduzir צבאיו a forças militares humanas. Não há imposição interpretativa ou confessional indevida.
