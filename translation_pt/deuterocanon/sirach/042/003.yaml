translation:
  language: pt
  text: sobre a prestação de contas de um arrendatário, de um senhor e de um hóspede[a], e sobre a divisão de uma herança e de bens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “sobre a prestação de contas de um sócio e de viajantes, sobre a entrega da herança de associados”, refletindo um texto subjacente diferente em vários pontos. A tradução principal segue o testemunho hebraico preservado.'
    reason: alternative_reading
  - marker: b
    text: A última palavra hebraica é concisa e seu sentido aqui é um tanto incerto; foi traduzida como “bens” de acordo com o contexto jurídico-econômico do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: על חשבון
  choice: sobre a prestação de contas
  rationale: A preposição introduz o assunto, e חשבון designa aqui uma apuração ou prestação de contas em contexto econômico. A expressão é natural em português e preserva o sentido jurídico-financeiro.
- source_word: חוכר
  choice: arrendatário
  rationale: O termo indica quem toma terras ou outros bens em arrendamento. “Arrendatário” é preciso e amplamente compreensível; “agricultor” seria restritivo demais.
- source_word: אדון
  choice: senhor
  rationale: Mantém o sentido amplo de alguém que exerce autoridade numa relação doméstica, social ou contratual, sem restringi-lo necessariamente a “proprietário”.
- source_word: אורח
  choice: hóspede
  rationale: O hebraico pode designar hóspede ou viajante. “Hóspede” segue de perto o testemunho hebraico, enquanto a leitura grega aponta para “viajantes”.
- source_word: מחלקות נחלה
  choice: divisão de uma herança
  rationale: מחלקות comunica divisão ou repartição, e נחלה é o termo jurídico-familiar comum para herança. A formulação é clara e idiomática em português.
- source_word: ויש
  choice: e de bens
  rationale: יש é conciso e incomum neste ponto, mas o contexto jurídico-econômico favorece o sentido de haveres ou propriedade. “Bens” preserva essa amplitude sem impor uma especificação ausente do hebraico.
