  text: For from a garment comes a moth, and from a woman a woman’s wickedness.
translation:
  language: pt
  text: Pois da roupa sai a traça, e de uma mulher, a maldade de uma mulher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e de uma mulher, o mal de uma mulher”. O hebraico é conciso e proverbial; o grego também traz “de uma mulher, a maldade de uma mulher”.
    reason: Alternativa lexical que explicita o sentido mais básico de רעה e a construção elíptica do original.
lexical_decisions:
- source_word: בגד
  choice: roupa
  rationale: O termo hebraico designa de modo amplo uma peça de vestuário. “Roupa” é corrente, claro e mantém a imagem do tecido atacado pela traça.
- source_word: יצא
  choice: sai
  rationale: O verbo significa literalmente “sair” ou “vir para fora”. “Sai” preserva de forma concisa a imagem proverbial do hebraico.
- source_word: עש
  choice: traça
  rationale: Refere-se à traça que danifica roupas; “traça” é a designação portuguesa comum e adequada ao contexto.
- source_word: אשה
  choice: mulher
  rationale: Embora possa significar também “esposa”, o caráter genérico do provérbio e o paralelo grego favorecem “mulher”.
- source_word: רעת אשה
  choice: a maldade de uma mulher
  rationale: A expressão construta é breve e incisiva. “Maldade” comunica a qualidade moral de רעה, enquanto a repetição de “mulher” conserva a formulação marcada do original.
theological_decisions:
- issue: Formulação proverbial potencialmente misógina
  choice: Manter a referência direta a “uma mulher” e a expressão “a maldade de uma mulher”, sem suavizá-las nem generalizá-las.
  alternative: Parafrasear como “o mal pode vir das mulheres” ou especificar “esposa”.
  rationale: O hebraico e o paralelo grego apresentam uma afirmação deliberadamente contundente. A tradução deve preservar essa tensão histórica e literária, sem transformá-la em uma afirmação doutrinária mais ampla nem restringir “mulher” a “esposa”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula após “mulher” conserva a elipse verbal e o paralelismo conciso do provérbio; a repetição incomum é intencional e reflete o hebraico.
