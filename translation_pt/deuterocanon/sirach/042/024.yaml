  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
translation:
  language: pt
  text: Todas as coisas estão aos pares[a], uma diante da outra, e ele não fez nada deficiente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico de Massada para esta seção também apoia o sentido de que nada foi feito deficiente ou em falta, embora a transmissão hebraica dessas linhas seja fragmentária e apresente uma disposição diferente.
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  choice: Todas as coisas
  rationale: O neutro plural é abrangente, e esta formulação preserva o alcance universal e o tom sapiencial.
- source_word: δισσὰ
  choice: existem aos pares
  rationale: O adjetivo indica duplicidade ou disposição em pares. A formulação expressa um estado, não um processo, sem sugerir simples repetição.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: uma em oposição à outra
  rationale: A expressão descreve cada realidade posta diante de sua correspondente, com possível ideia de contraste. A tradução preserva essa relação sem restringi-la a antagonismo moral.
- source_word: οὐκ ἐποίησεν
  choice: ele não fez
  rationale: O sujeito implícito é Deus no contexto. Torná-lo explícito mantém a coesão e soa natural em português.
- source_word: οὐδὲν ἐκλιπόν
  choice: nada incompleto
  rationale: O particípio pode indicar o que está em falta, é deficiente ou foi omitido. 'Nada incompleto' comunica de modo conciso a ausência de deficiência na obra criada.
theological_decisions:
- issue: Sujeito implícito de ἐποίησεν
  choice: Explicitar o sujeito como 'ele', em referência a Deus.
  alternative: 'Empregar a forma impessoal: ''nada foi feito incompleto''.'
  rationale: O contexto imediato trata das obras ordenadas de Deus; explicitar o pronome preserva a coerência sem acrescentar uma afirmação teológica estranha ao texto.
- issue: Natureza da relação entre os pares
  choice: Traduzir como 'em oposição', preservando a noção espacial e relacional de elementos postos um diante do outro.
  alternative: Traduzir como 'em correspondência' ou 'diante'.
  rationale: κατέναντι admite contraste e correspondência. 'Em oposição' acompanha o sentido provável, sem definir os pares como moralmente rivais ou absolutamente contrários.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva o paralelismo sapiencial e explicita apenas o necessário para a naturalidade.
