  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
translation:
  language: pt
  text: Uma coisa complementa o que há de bom na outra[a]; e quem se saciará de contemplar a glória dele?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Uma coisa fortaleceu o que há de bom na outra”. O verbo grego pode significar “tornar firme” ou “fortalecer”; aqui, a frase expressa como as coisas criadas se ajustam e se sustentam mutuamente.'
    reason: lexical_alternative
  - marker: b
    text: “Dele” provavelmente se refere a Deus. Outra possibilidade é entender a expressão de modo mais impessoal, como o esplendor manifestado na criação.
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: Uma coisa ... na outra
  rationale: A expressão elíptica descreve uma relação entre uma realidade criada e outra. O substantivo “coisa” é explicitado em português para tornar a frase compreensível sem limitar o referente.
- source_word: ἐστερέωσεν
  choice: complementa
  rationale: O verbo significa literalmente “tornar firme” ou “fortalecer”. Neste contexto de obras criadas que se correspondem, “complementa” comunica de modo natural que uma sustenta ou completa o bem da outra; a tradução mais formal é preservada em nota.
- source_word: τὰ ἀγαθά
  choice: o que há de bom
  rationale: O adjetivo substantivado no plural abrange bens, qualidades benéficas ou aspectos bons. A formulação portuguesa evita o pouco natural “as coisas boas da outra” e mantém o sentido amplo.
- source_word: τίς πλησθήσεται
  choice: quem se saciará
  rationale: O futuro passivo pode significar “ser cheio” ou, idiomaticamente, “ficar satisfeito, saciar-se”. A pergunta retórica indica que ninguém chega ao fim dessa contemplação.
- source_word: ὁρῶν
  choice: de contemplar
  rationale: O particípio presente exprime visão continuada. “Contemplar” combina naturalmente com “glória” e preserva essa ideia de observação atenta e prolongada.
- source_word: δόξαν αὐτοῦ
  choice: a glória dele
  rationale: δόξα designa glória ou esplendor manifesto. O pronome provavelmente se refere a Deus no contexto do louvor às obras da criação, mas a alternativa referente ao esplendor manifestado na criação é registrada em nota.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: “dele” refere-se a Deus
  alternative: A expressão pode ser entendida de modo mais impessoal como a glória ou o esplendor manifestado na criação.
  rationale: No contexto do hino sobre a criação ordenada, a glória contemplada é mais naturalmente a do Criador revelada em suas obras. Como o referente gramatical não é totalmente explícito, a outra possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a estrutura poética em duas partes e emprega ponto e vírgula para separar a afirmação da pergunta retórica. As notas preservam tanto o valor mais formal do verbo grego quanto a ambiguidade do pronome.
