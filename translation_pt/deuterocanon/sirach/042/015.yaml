base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: pt
  text: Recordarei as obras de Deus[a] e relatarei o que vi. Quando Deus fala, cumpre-se a sua vontade, e sua obra realiza o que lhe agrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Recordarei as obras do Senhor e relatarei o que vi; nas palavras do Senhor estão as suas obras». A linha final do hebraico é difícil; por isso, o texto principal expressa seu sentido provável, em vez de reproduzir literalmente uma redação obscura.'
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: Recordarei
  rationale: O verbo expressa a decisão de trazer à memória e celebrar; a partícula נא funciona aqui como marcador discursivo, sem exigir um «agora» explícito em português.
- source_word: מעשי אל
  choice: as obras de Deus
  rationale: מעשים designa feitos ou obras; «obras» conserva o tom hínico e segue o título divino do testemunho hebraico.
- source_word: וזה חזיתי ואספרה
  choice: e relatarei o que vi
  rationale: A construção hebraica é condensada; esta formulação natural preserva a relação entre aquilo que foi visto e seu relato, também apoiada pelo paralelo grego.
- source_word: באומר אלהים רצונו
  choice: Ao falar Deus, cumpre-se a sua vontade
  rationale: O texto transmitido é difícil. A formulação mantém a fala divina e a vontade de Deus, entendendo a frase como afirmação da eficácia de sua palavra sem reproduzir uma sintaxe obscura em português.
- source_word: ופועל רצונו לקחו
  choice: e sua obra realiza o que lhe agrada
  rationale: O hemistíquio hebraico é textualmente incerto. A tradução apresenta o sentido provável de que a ação divina efetua seu querer, preservando em «agrada» a amplitude de רצון entre vontade, favor e prazer.
theological_decisions:
- issue: Título divino em אל e no paralelo Κυρίου
  choice: Deus
  alternative: Senhor
  rationale: O texto principal segue o hebraico existente, que traz אל; a leitura grega com «Senhor» é registrada na nota.
- issue: Sentido do último cólon hebraico difícil
  choice: A palavra e a obra de Deus realizam sua vontade
  alternative: 'Seguir mais de perto o grego: «nas palavras do Senhor estão as suas obras»'
  rationale: A redação hebraica é difícil e parcialmente incerta. O texto principal oferece o sentido provável sem fingir precisão, enquanto a forma substancialmente diferente do paralelo grego é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. «Recordarei» sustenta o tom sapiencial; «relatarei» evita coloquialismo. A nota torna explícita a divergência textual entre o hebraico e o grego.
