  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: pt
  text: Ele vive e permanece para sempre[a]; sua bondade passa de uma coisa a outra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A redação hebraica deste versículo é concisa e um tanto incerta. O texto grego paralelo preserva uma forma diferente e mais extensa: “Nada lhe foi acrescentado nem tirado, e ele não precisou de conselheiro algum. Como são desejáveis todas as suas obras! Contemplá-las é como ver uma centelha.”'
    reason: textual_variant
  - marker: b
    text: 'Ou: “sua bondade passa sobre cada coisa” ou “sua bondade vai de uma para outra”. A expressão hebraica é condensada, e o sentido exato de “esta sobre esta” é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: Ele
  rationale: O pronome retoma Deus no hino ao redor; por isso, a forma pessoal masculina é adequada.
- source_word: חי
  choice: vive
  rationale: Expressa vida contínua de modo direto e natural em português.
- source_word: ועומד
  choice: e permanece
  rationale: Embora o verbo signifique literalmente “estar de pé”, neste contexto comunica continuidade e permanência; “permanece” conserva esse sentido sem produzir uma imagem pouco natural em português.
- source_word: לעד
  choice: para sempre
  rationale: Equivalente corrente e claro para duração perpétua.
- source_word: זה על זה
  choice: de uma coisa a outra
  rationale: A expressão hebraica é condensada e pode indicar relação, distribuição ou sucessão entre as coisas; esta formulação mantém aberta a direção exata do movimento.
- source_word: חלף
  choice: passa
  rationale: Preserva a imagem de movimento do verbo, que pode significar passar, atravessar ou suceder, sem fixar uma nuance incerta.
- source_word: טובו
  choice: sua bondade
  rationale: É a tradução mais direta de טוב com sufixo possessivo; evita restringir o sentido a generosidade ou interpretá-lo especificamente como beleza.
theological_decisions:
- issue: Relação entre a linha hebraica e o texto grego mais extenso
  choice: Traduzir no texto principal o hebraico preservado e registrar a forma grega em nota.
  alternative: Substituir o hebraico pelo texto grego ou harmonizar os dois textos.
  rationale: Como o hebraico sobrevive, ele tem prioridade. O grego parece representar uma forma textual diferente ou ampliada e deve ser apresentado como variante, não incorporado silenciosamente.
- issue: Sentido preciso da passagem da bondade divina
  choice: 'Manter a metáfora aberta: “passa de uma coisa a outra”.'
  alternative: Explicitar que a bondade se estende sucessivamente por todas as obras criadas.
  rationale: O hebraico é comprimido e não determina com segurança se a ideia principal é sucessão, extensão ou passagem sobre cada coisa; uma explicitação maior resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Permanece” comunica idiomaticamente o valor contextual de עומד; a segunda oração conserva a concisão e a ambiguidade genuínas do hebraico.
