revisions:
- from: Sobre sua filha virgem, mantenha vigilância rigorosa, para que ela não lhe dê má fama — tornando-o assunto de comentários na cidade e alvo da maldição do povo[a] — e não o faça tomar assento na assembleia à porta[b].
  to: Mantenha vigilância rigorosa sobre sua filha virgem, para que ela não lhe dê má fama, não o torne objeto de comentários na cidade e de maldição entre o povo[a], nem o faça sentar-se no ajuntamento à porta[b].
  rationale: A revisão mantém o sentido e a perspectiva social do hebraico, mas dispõe as consequências públicas em coordenação mais próxima da sequência nominal original. Também emprega formulações portuguesas mais naturais e evita definir excessivamente a natureza do grupo reunido à porta, cuja formulação hebraica é incerta.
