base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: pt
  text: Mantenha vigilância rigorosa sobre sua filha virgem, para que ela não lhe dê má fama, não o torne objeto de comentários na cidade e de maldição entre o povo[a], nem o faça sentar-se no ajuntamento à porta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Um manuscrito de Massada conserva uma forma mais breve: “Sobre uma filha, mantenha vigilância; comentários na cidade e uma assembleia de pessoas...”, enquanto o texto da Genizá do Cairo é mais completo aqui.'
    reason: textual_variant
  - marker: b
    text: A expressão hebraica final é difícil. Literalmente, fala de fazê-lo sentar-se numa “reunião” ou “multidão à porta”. A porta da cidade era lugar público de assembleia e julgamento; o paralelo grego também aponta para vergonha diante de uma multidão.
    reason: cultural_note
lexical_decisions:
- source_word: בני ... החזק משמר
  choice: mantenha vigilância rigorosa
  rationale: O primeiro imperativo, literalmente ligado a estabelecer ou construir, forma com “reforçar a guarda” uma ordem única e enfática. A formulação portuguesa é natural e conserva a intensidade.
- source_word: על בתולתך
  choice: sobre sua filha virgem
  rationale: Preserva tanto a relação familiar implícita no sufixo quanto a referência explícita à virgindade da jovem.
- source_word: פן תעשה לך שם סרה
  choice: para que ela não lhe dê má fama
  rationale: שם סרה diz respeito a um nome ou reputação desonrosa. “Dê má fama” comunica com clareza a consequência pública sem depender da ampliação grega sobre o escárnio dos inimigos.
- source_word: דבת עיר
  choice: assunto de comentários na cidade
  rationale: דבה pode indicar rumor, comentário difamatório ou má notícia. A escolha mantém a conotação pública e negativa sem fixar exclusivamente “calúnia” ou “fofoca”.
- source_word: וקללת עם
  choice: alvo da maldição do povo
  rationale: Expressa que o pai se torna objeto da censura ou imprecação coletiva, preservando a força nominal da frase hebraica.
- source_word: והושיבתך בעדר שער
  choice: e não o faça tomar assento na assembleia à porta
  rationale: Mantém o causativo de והושיבתך e entende a expressão difícil בעדר שער como uma reunião pública no portão da cidade. A nota registra a incerteza.
theological_decisions:
- issue: Prioridade do hebraico e uso do paralelo grego na cláusula final
  choice: Seguir o texto hebraico da Genizá e usar o grego apenas como confirmação do cenário de vergonha pública.
  alternative: 'Seguir a expansão grega: “torná-lo motivo de alegria para os inimigos” e “envergonhá-lo diante de uma grande multidão”.'
  rationale: O hebraico está preservado e deve governar a tradução. O grego ajuda a confirmar o sentido público da passagem, mas suas expansões não são introduzidas no corpo do versículo.
- issue: Referente das consequências públicas
  choice: Manter o pai como objeto da má fama, dos comentários, da maldição e da exposição pública.
  alternative: Entender a filha como referente direto de “comentários” e “maldição”.
  rationale: A sequência começa com “lhe dê má fama” e termina com o causativo “o faça tomar assento”, favorecendo uma cadeia de consequências sofridas pelo pai, embora a concisão hebraica permita alguma tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A tradução conserva o tom paternal e social do original sem suavizar sua perspectiva antiga, e assinala a dificuldade textual da cláusula final.
