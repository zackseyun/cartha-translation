  source_fidelity: 'A tradução segue adequadamente o hebraico como texto-base: preserva a ordem de vigilância sobre a filha, a consequência de desonra pública para o pai e o causativo da cláusula final. Contudo, «tornando-o assunto de comentários» torna a relação sintática mais explicativa do que o hebraico nominal permite, e «assembleia» pode sugerir uma instituição mais definida do que a expressão hebraica difícil.'
  naturalness: O português é claro e de registro apropriado. «Faça tomar assento» soa mais pesado e menos direto do que «faça sentar-se». A coordenação negativa explícita torna a série de consequências mais natural e inteligível.
  terminology: «Filha virgem», «má fama» e «vigilância rigorosa» são escolhas fiéis e compreensíveis. «Objeto de comentários» e «objeto de maldição entre o povo» reproduzem melhor a sequência de desonra pública sem reduzir דבה a mera conversa neutra nem tornar a maldição uma posse do povo.
  issues:
