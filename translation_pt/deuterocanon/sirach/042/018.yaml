  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: pt
  text: Ele sonda o abismo e o coração[b] e discerne tudo o que neles está exposto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e considerou todos os seus ardis (ou atos astutos)”. O hebraico diz literalmente “todas as suas nudezes”, provavelmente no sentido de tudo o que está descoberto diante dele.'
    reason: alternative_reading
  - marker: b
    text: 'O manuscrito de Massada preserva a abertura hebraica mais curta: “O abismo e o coração ele sondou”; o texto da Guenizá do Cairo continua com a oração sobre tudo o que neles está exposto.'
    reason: textual_variant
lexical_decisions:
- source_word: תהום
  choice: o abismo
  rationale: O hebraico designa a profundeza ou abismo primordial. “Abismo” mantém a dimensão cósmica e corresponde ao grego ἄβυσσον.
- source_word: לב
  choice: o coração
  rationale: לב abrange o interior da pessoa, incluindo pensamento e intenção. “Coração” preserva a imagem antropológica hebraica e concorda com o grego καρδίαν.
- source_word: חקר
  choice: sonda
  rationale: O verbo expressa investigação profunda e cuidadosa. “Sonda” é natural em português e comunica mais do que uma busca superficial.
- source_word: מערומיהם
  choice: tudo o que neles está exposto
  rationale: A forma hebraica significa literalmente “suas nudezes”, isto é, aquilo que está despido, descoberto ou plenamente exposto. A formulação escolhida conserva essa imagem sem a estranheza ou a possível conotação sexual de “todas as suas nudezes” em português corrente.
- source_word: יתבונן
  choice: discerne
  rationale: A forma verbal indica consideração atenta, percepção e entendimento. “Discerne” reúne o aspecto cognitivo e a ideia de observação penetrante.
theological_decisions:
- issue: O sujeito divino está implícito na linha hebraica
  choice: Manter o pronome “Ele”, sem inserir “o Senhor”
  alternative: Explicitar “o Senhor” no texto principal
  rationale: O contexto identifica Deus como sujeito, e o paralelo grego o explicita na continuação; contudo, esta linha hebraica não traz o nome divino. O pronome respeita essa forma do texto sem obscurecer o referente.
- issue: Sentido de מערומיהם
  choice: Representar a imagem hebraica como aquilo que está exposto
  alternative: Traduzir como “segredos” ou seguir o grego com “ardis”
  rationale: A leitura hebraica aponta para “nudezes” ou coisas postas a descoberto. “Segredos” explicaria a possível implicação, mas eliminaria a imagem; “ardis” representa a tradição grega, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi naturalizada sem apagar o paralelismo. O presente expressa uma afirmação geral sobre o conhecimento divino; evitou-se tornar explícito no texto aquilo que o hebraico deixa implícito.
