base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: pt
  text: Ele pôs em ordem as obras grandiosas de sua sabedoria[a], e somente ele existe desde a eternidade. Nada lhe é acrescentado, e nada lhe é tirado[b]; ele não precisa de ninguém que tenha entendimento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “o poder de sua sabedoria”; o grego traz “as grandezas de sua sabedoria”.
    reason: lexical_alternative
  - marker: b
    text: O segundo verbo hebraico é difícil. O sentido provável é que nada pode ser acrescentado a Deus nem tirado dele.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “ninguém que entenda” ou “nenhuma pessoa perspicaz”; no contexto, pode ter o sentido de “nenhum conselheiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  choice: as obras grandiosas de sua sabedoria
  rationale: A construção hebraica é condensada e pode indicar o poder ou as manifestações poderosas da sabedoria divina. O paralelo grego τὰ μεγαλεῖα favorece o sentido concreto de feitos ou obras grandiosas.
- source_word: תכן
  choice: pôs em ordem
  rationale: O verbo pode significar medir, regular, estabelecer ou ordenar; o grego ἐκόσμησεν reforça a nuance de organizar ou dispor em ordem.
- source_word: אחד הוא מעולם
  choice: somente ele existe desde a eternidade
  rationale: אחד הוא pode ser literalmente 'ele é um', mas no contexto salienta sua singularidade. מעולם admite 'desde tempos antigos', enquanto o paralelo grego sustenta o alcance eterno.
- source_word: לא נוסף ולא נאצל
  choice: Nada lhe é acrescentado, e nada lhe é tirado
  rationale: A formulação passiva conserva mais de perto o hebraico. נאצל é difícil neste ponto, mas o paralelismo sugere que nada pode ser subtraído dele.
- source_word: ולא צריך לכל מבין
  choice: ele não precisa de ninguém que tenha entendimento
  rationale: מבין significa literalmente alguém que entende ou discerne. A tradução mantém essa expressão em vez de restringi-la funcionalmente a 'conselheiro'.
theological_decisions:
- issue: Singularidade divina em אחד הוא
  choice: somente ele existe
  alternative: ele é um
  rationale: A opção escolhida comunica em português a provável força contextual de unicidade sem transformar a frase numa formulação metafísica mais específica.
- issue: Força temporal de מעולם
  choice: desde a eternidade
  alternative: desde tempos antigos
  rationale: Embora o hebraico isolado permita uma referência à antiguidade remota, o paralelo grego estende a existência divina para antes e através das eras.
- issue: Imutabilidade na expressão לא נוסף ולא נאצל
  choice: Nada lhe é acrescentado, e nada lhe é tirado
  alternative: Ele não aumenta nem diminui
  rationale: A tradução preserva a construção relacional/passiva e evita definir além do necessário a difícil forma נאצל.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a solenidade sapiencial sem arcaísmos. As ambiguidades relevantes do hebraico são preservadas ou registradas em notas.
