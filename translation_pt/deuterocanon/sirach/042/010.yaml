  source_fidelity: 'A tradução preserva a ordem algo abrupta do hebraico: virgindade, casa do marido, casa do pai e novamente casa do marido. Traduz adequadamente פן como advertência preventiva, mantém o sentido sexualmente marcado de תפתה sem exceder o hebraico, e conserva a amplitude de תשטה em “não se desvie”. “Não seja estéril” é uma tradução contextual justificável de תעצר, confirmada pelo grego στειρώσῃ, sem ocultar a alternativa literal na nota.'
  naturalness: O português é moderno, claro e de registro proverbial digno. “Enquanto virgem” e “fique grávida” são naturais e amplamente compreensíveis. A repetição de “na casa do marido” é apropriada, pois reproduz o paralelismo e as duas formulações hebraicas do texto-fonte.
  terminology: “Virgem”, “seduzida”, “desvie”, “grávida” e “estéril” são escolhas precisas e não impõem interpretação confessional. As notas distinguem corretamente a leitura grega alternativa e a nuance lexical da última cláusula.
