base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: pt
  text: Enquanto virgem[a], para que não seja seduzida; e na casa do marido, para que não se desvie. Na casa do pai, para que não fique grávida; e na casa do marido[b], para que não seja estéril.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “para que não seja profanada” onde o hebraico diz “para que não seja seduzida”, tornando explícito o sentido sexual.
    reason: alternative_reading
  - marker: b
    text: A última expressão poderia ser traduzida mais literalmente como “para que não seja impedida”; o paralelo grego, porém, apoia o sentido “para que não seja estéril”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  choice: Enquanto virgem
  rationale: Expressa naturalmente em português o estado de virgindade ou juventude solteira indicado pelo hebraico e correspondente ao grego ἐν παρθενίᾳ.
- source_word: פן תפתה
  choice: para que não seja seduzida
  rationale: O contexto favorece a acepção sexual de ser atraída ou seduzida; o paralelo grego, com 'seja profanada', confirma esse campo sem exigir que ele substitua a leitura hebraica.
- source_word: ובבית בעלה
  choice: e na casa do marido
  rationale: Mantém explícito o ambiente doméstico do casamento e traduz de modo direto a construção hebraica.
- source_word: לא תשטה
  choice: para que não se desvie
  rationale: Preserva a amplitude do verbo hebraico, que pode indicar desvio moral ou sexual, sem tornar explícita uma infidelidade que o texto não especifica de forma inequívoca.
- source_word: בבית אביה
  choice: Na casa do pai
  rationale: Tradução direta e idiomática do ambiente doméstico anterior ao casamento.
- source_word: פן תהרה
  choice: para que não fique grávida
  rationale: Forma atual e clara de exprimir o sentido hebraico de conceber ou tornar-se grávida.
- source_word: בבית אישה
  choice: e na casa do marido
  rationale: Neste contexto, אישה significa o marido dela; a tradução também mantém coerência com a expressão marital anterior.
- source_word: פן תעצר
  choice: para que não seja estéril
  rationale: Embora o verbo hebraico possa significar literalmente ser impedida ou retida, o contexto reprodutivo e o grego στειρώσῃ apoiam fortemente o sentido de esterilidade.
theological_decisions:
- issue: Relação entre o hebraico primário e o paralelo grego numa passagem com pequena divergência
  choice: Seguir a sequência e o sentido do hebraico dos manuscritos da Genizá, usando o grego para confirmar os sentidos sexual e reprodutivo onde o hebraico é conciso.
  alternative: 'Adotar uma formulação mais moldada pelo grego: ''para que não seja profanada... para que não transgrida... para que não se torne estéril''.'
  rationale: O hebraico preservado é coerente e deve permanecer como testemunho principal; o grego é útil como confirmação, mas suas formulações distintas não devem apagar a ambiguidade lexical hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'na casa do marido' foi preservada por refletir as duas expressões paralelas do hebraico. 'Para que não' soa mais natural no fluxo proverbial do que o mais formal 'para que não aconteça que', sem eliminar o caráter preventivo de פן.
