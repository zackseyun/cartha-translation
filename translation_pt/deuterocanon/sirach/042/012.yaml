  language: en
  yaml_path: translation/deuterocanon/sirach/042/012.yaml
  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
translation:
  language: pt
  text: Não mostre a sua beleza a nenhum homem[a] e não se sente numa casa de mulheres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a todo homem não dê beleza/aparência”. O paralelo grego diz: “Não contemple ninguém em beleza”, refletindo uma compreensão diferente da frase.'
    reason: alternative_reading
  - marker: b
    text: A forma do último verbo hebraico é incerta no texto da Guenizá. O paralelo grego sustenta o sentido de “não se sentar/não manter companhia entre mulheres”. O hebraico menciona literalmente uma “casa de mulheres”.
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: a homem algum
  rationale: O hebraico diz literalmente “a todo macho/indivíduo do sexo masculino”. Em português corrente, “a homem algum” conserva a referência masculina específica sem a conotação biológica mais marcada de “macho”.
- source_word: אל תתן תאר
  choice: não mostre sua beleza
  rationale: תאר pode indicar forma, aparência ou beleza. Neste contexto, e à luz do grego ἐν κάλλει, “mostrar sua beleza” expressa naturalmente a ideia de expô-la ao olhar, sem traduzir mecanicamente “dar aparência”.
- source_word: ובית נשים
  choice: entre mulheres
  rationale: A expressão hebraica menciona literalmente uma “casa de mulheres”, mas a construção é difícil. O paralelo grego traz ἐν μέσῳ γυναικῶν, “entre mulheres”, que preserva com clareza o ambiente feminino sem impor uma instituição específica.
- source_word: אל תסתויד
  choice: não se sente
  rationale: A forma e o sentido do verbo hebraico são incertos. O grego συνέδρευε aponta para sentar-se junto ou manter convivência; “não se sente” mantém a imagem concreta e deixa a incerteza textual documentada em nota.
theological_decisions:
- issue: Linguagem específica de gênero numa advertência sapiencial
  choice: manter “homem” e “mulheres”
  alternative: neutralizar como “pessoa” ou “pessoas”
  rationale: O hebraico distingue explicitamente זכר e נשים. Preservar essa especificidade evita apagar a forma genderizada da advertência.
- issue: Relação entre o hebraico difícil e o paralelo grego
  choice: usar o hebraico como base e o grego para esclarecer a cláusula final
  alternative: seguir literalmente o hebraico obscuro ou traduzir integralmente pelo grego
  rationale: O hebraico existente continua primário, mas o verbo final é incerto; o grego oferece apoio antigo para o sentido de sentar-se ou conviver entre mulheres, sem eliminar a divergência na primeira cláusula.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação é direta e conserva a linguagem específica de gênero. As notas registram tanto a ambiguidade da primeira frase quanto a incerteza textual da cláusula final.
