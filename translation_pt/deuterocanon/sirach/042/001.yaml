translation:
  language: pt
  text: Mas não se envergonhe destas coisas; não mostre parcialidade[b] e peque.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego preservado na Septuaginta apresenta aqui uma redação substancialmente diferente e mais extensa, com várias orientações específicas sobre vergonha e discrição. A tradução principal segue o texto hebraico dos manuscritos da Genizá do Cairo.
    reason: textual_variant
  - marker: b
    text: 'Ou: «não favoreça». A expressão hebraica significa literalmente «não levante um rosto».'
    reason: lexical_alternative
  - marker: c
    text: A frase final também pode ser entendida de maneira mais explícita como «e assim peque» ou «para que não peque».
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  choice: Quanto a estas coisas, porém
  rationale: A formulação reproduz o tópico introduzido por על אלה e expressa com naturalidade o valor restritivo ou contrastivo de אך, sem o reduzir rigidamente a «somente» ou «mas».
- source_word: אל תבוש
  choice: não se envergonhe
  rationale: בוש indica vergonha ou desonra, não apenas constrangimento passageiro. A forma reflexiva é corrente e digna em português.
- source_word: ואל תשא פנים
  choice: não mostre parcialidade
  rationale: A expressão idiomática hebraica נשא פנים, literalmente «levantar um rosto», significa favorecer alguém ou agir com parcialidade. A tradução comunica diretamente seu sentido ético.
- source_word: וחטא
  choice: e peque
  rationale: O hebraico traz a formulação breve e coordenada «e peque». Mantê-la evita decidir se o verbo expressa resultado («e assim peque») ou advertência («para que não peque»).
theological_decisions:
- issue: Relação sintática entre «e peque» e «não mostre parcialidade»
  choice: 'Manter a coordenação concisa: «não mostre parcialidade e peque»'
  alternative: «não mostre parcialidade, para que não peque» ou «não mostre parcialidade e assim peque»
  rationale: O texto hebraico é comprimido e permite mais de uma compreensão da relação entre as ações. Como o paralelo grego apresenta outra forma textual, a tradução segue o hebraico sem explicitar uma relação final ou consecutiva que ele não marca inequivocamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Quanto a estas coisas, porém» conserva o contraste do hebraico sem soar excessivamente literal; a concisão incomum de «e peque» é mantida deliberadamente para preservar a ambiguidade sintática do original.
