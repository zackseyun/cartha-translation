translation:
  language: pt
  text: quanto à lei do Altíssimo e ao estatuto[a], e quanto a uma sentença que declara justo o perverso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “estatuto”; o paralelo grego traz “aliança”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “quanto àquele que justifica o perverso” ou “quanto a uma sentença que absolve o perverso”. O hebraico tem uma formulação concisa que também pode ser entendida de modo agentivo; seus termos e os do grego têm sentido forense. O paralelo grego menciona explicitamente um “julgamento” ou uma “sentença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תורת עליון
  choice: lei do Altíssimo
  rationale: תורה pode significar “instrução” ou “lei”; sua associação com חוק e o contexto jurídico favorecem “lei”, enquanto עליון é vertido naturalmente por “Altíssimo”.
- source_word: חוק
  choice: estatuto
  rationale: חוק designa uma norma fixada ou prescrição; “estatuto” mantém o campo jurídico e o distingue de תורה.
- source_word: מצדיק / להצדיק
  choice: sentença que declara justo
  rationale: A raiz צדק no Hifil tem aqui sentido forense. “Declara justo” preserva essa força sem limitar a expressão à ideia de inocência factual; “sentença” é apoiada pelo paralelo grego κρίματος, diante da formulação hebraica concisa e ligeiramente incerta.
- source_word: רשע
  choice: o perverso
  rationale: רשע indica uma pessoa má ou culpada; “o perverso” funciona como singular genérico e conserva o contraste jurídico e moral.
- source_word: ועל
  choice: e quanto a
  rationale: A preposição repetida organiza a enumeração; “quanto a” é corrente, claro e apropriado ao registro digno do texto.
theological_decisions:
- issue: Sentido forense de צדק/δικαιόω
  choice: declara justo
  alternative: justifica; absolve
  rationale: “Declara justo” torna explícito o ato judicial sem importar automaticamente sentidos doutrinários posteriores de “justificar”. A nota conserva alternativas legítimas.
- issue: Referente de מצדיק e apoio do paralelo grego
  choice: uma sentença que declara justo
  alternative: aquele que declara justo
  rationale: O hebraico é conciso e pode sugerir um agente, mas o paralelo grego traz κρίματος, “julgamento/sentença”. A tradução principal segue essa evidência, e a nota registra a leitura mais diretamente agentiva do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. A estrutura fragmentária “quanto a...” foi mantida porque o versículo continua a enumeração iniciada no contexto anterior.
