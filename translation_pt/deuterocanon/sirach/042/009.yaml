base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: pt
  text: 'Uma filha é, para o pai, uma falsidade oculta[a], e a preocupação com ela lhe tira o sono: na juventude, com receio de que passe da idade de se casar[b]; e, enquanto ainda é virgem, com receio de que não se case.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “uma falsidade oculta”. O paralelo grego traz “uma insônia oculta”, sugerindo uma inquietação escondida que a filha causa ao pai.
    reason: alternative_reading
  - marker: b
    text: O sentido do hebraico é incerto. O paralelo grego sugere que ela passe do auge da juventude, isto é, da idade então considerada própria para se casar.
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: Uma filha é para o pai
  rationale: Preserva de modo natural a relação expressa pelo dativo hebraico e pelo paralelo grego πατρί.
- source_word: מטמנת שקר
  choice: uma falsidade oculta
  rationale: Mantém a formulação difícil e incisiva do hebraico, sem substituí-la silenciosamente pela leitura grega mais clara; a nota registra a variante.
- source_word: דאגה תפריע שנתו
  choice: a preocupação com ela lhe tira o sono
  rationale: Expressa em português corrente a ansiedade contínua que afasta o sono, em concordância com o grego μέριμνα ... ἀφιστᾷ ὕπνον.
- source_word: בנעוריה פן תגור
  choice: na juventude, para que não passe da idade de se casar
  rationale: O verbo hebraico é incerto neste contexto; a formulação comunica a ideia, apoiada pelo grego παρακμάσῃ, de passar do período então considerado próprio para o casamento.
- source_word: ובתוליה פן לא תנשא
  choice: e, enquanto virgem, para que não fique sem se casar
  rationale: Preserva a referência explícita à virgindade e o enquadramento passivo/social de תנשא, em português compreensível.
theological_decisions:
- issue: A relação entre o difícil hebraico מטמנת שקר e o grego ἀπόκρυφος ἀγρυπνία
  choice: Conservar no texto a expressão hebraica relativamente literal, “uma falsidade oculta”, explicando o paralelo grego em nota.
  alternative: “uma insônia secreta” ou “uma preocupação oculta”
  rationale: Como o testemunho hebraico existe, ele permanece principal; o grego ajuda a identificar o contexto de inquietação paterna, mas não deve eliminar a obscuridade textual genuína.
- issue: O sentido de פן תגור
  choice: “para que não passe da idade de se casar”
  alternative: “para que não fique sem se casar” ou “para que não passe do viço da juventude”
  rationale: A forma hebraica é semanticamente difícil. O grego aponta para o declínio ou a passagem do auge da juventude; a tradução mantém essa ideia sem apresentar uma idade objetiva ou universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção reflete o contexto social antigo sem endossá-lo nem suavizar as dificuldades textuais.
