revisions:
- from: 'Uma filha é para o pai uma falsidade oculta[a], e a preocupação com ela lhe tira o sono: na juventude, para que não passe da idade de se casar[b]; e, enquanto virgem, para que não fique sem se casar.'
  to: 'Uma filha é, para o pai, uma falsidade oculta[a], e a preocupação com ela lhe tira o sono: na juventude, com receio de que passe da idade de se casar[b]; e, enquanto ainda é virgem, com receio de que não se case.'
  rationale: A revisão corrige o valor de פן, de finalidade para receio, e melhora levemente a fluência da frase. Mantém a ambiguidade textual de «falsidade oculta», a referência explícita à virgindade e a explicação do paralelo grego nas notas.
