review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva corretamente a estrutura e os elementos principais do hebraico: a formulação obscura לגבי מטמנת שקר, a preocupação que priva o pai do sono, a juventude, a virgindade e os dois receios. A primeira cláusula permanece devidamente qualificada pela nota à luz do paralelo grego. Contudo, «para que não» exprime finalidade em português, enquanto פן introduz o receio que motiva a preocupação; isso deve ser corrigido.'
  naturalness: «Uma filha é para o pai uma falsidade oculta» é aceitável como formulação deliberadamente próxima de um hebraico difícil, mas fica mais legível com a intercalação «para o pai». «Com receio de que» comunica com naturalidade a relação sintática e semântica das cláusulas finais. «Enquanto ainda é virgem» é mais fluente que «enquanto virgem», preservando o termo explícito.
  terminology: «Falsidade oculta» preserva prudentemente a aspereza e a ambiguidade de מטמנת שקר, sem substituir o hebraico pela leitura grega. «Preocupação», «tirar o sono», «idade de se casar» e «virgem» são escolhas claras e adequadas ao registro. A nota histórica em b deixa claro que a expressão reflete uma concepção social antiga, sem a universalizar.
  issues:
  - severity: medium
    issue: As duas ocorrências de «para que não» traduzem as cláusulas introduzidas por פן.
    rationale: Em português, «para que» normalmente indica propósito; aqui o sentido é «com receio de que»/«temendo que». A formulação atual pode dar a entender que o pai age a fim de impedir tais resultados, em vez de descrever a ansiedade que lhe tira o sono.
  revised_text: 'Uma filha é, para o pai, uma falsidade oculta[a], e a preocupação com ela lhe tira o sono: na juventude, com receio de que passe da idade de se casar[b]; e, enquanto ainda é virgem, com receio de que não se case.'
