translation:
  language: pt
  text: quanto à fraude com balanças e instrumentos de pesagem[a], e quanto às medidas do efa e do peso de pedra[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego diz, mais literalmente, “quanto à exatidão da balança e dos pesos”. O hebraico neste ponto é difícil e não corresponde claramente ao grego.
    reason: alternative_reading
  - marker: b
    text: 'O segundo membro do texto grego difere bastante: “quanto a adquirir muito e pouco”, ou possivelmente “quanto a quantidades grandes e pequenas”.'
    reason: textual_variant
  - marker: c
    text: O efa era uma antiga medida de capacidade para produtos secos; o “peso de pedra” era uma pedra usada como peso padrão no comércio.
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  choice: fraude
  rationale: A forma hebraica transmitida é difícil. No contexto de balanças, pode sugerir manipulação desonesta; “fraude” expressa esse sentido prático sem especificar o método. A leitura grega, que fala de exatidão, é preservada em nota.
- source_word: מאזנים
  choice: balanças
  rationale: É o termo hebraico comum para balanças usadas em pesagens e transações comerciais.
- source_word: פלס
  choice: instrumentos de pesagem
  rationale: No contexto, designa algum tipo de balança, mecanismo ou padrão de pesagem. A expressão evita identificar com excessiva precisão um objeto cuja natureza exata não é segura.
- source_word: תמחות
  choice: medidas
  rationale: A forma é textualmente difícil; em associação com o efa e a pedra usada como peso, “medidas” preserva o provável campo comercial sem impor uma reconstrução estreita.
- source_word: איפה
  choice: efa
  rationale: Mantém o nome da unidade antiga de capacidade para secos; seu caráter é explicado em nota.
- source_word: אבן
  choice: peso de pedra
  rationale: Em contextos comerciais, a pedra funcionava como peso padrão. A tradução torna explícita essa função.
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: quanto à fraude com balanças e instrumentos de pesagem
  rationale: O texto principal prioriza o testemunho hebraico e sua provável referência à manipulação comercial, enquanto a leitura grega, voltada para a exatidão, é registrada em nota devido à divergência real.
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: quanto às medidas do efa e do peso de pedra
  rationale: O segundo membro grego diverge substancialmente do hebraico. A tradução segue as referências concretas do hebraico ao efa e à pedra-peso, registrando a variante grega em nota.
