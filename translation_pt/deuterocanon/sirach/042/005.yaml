translation:
  language: pt
  text: sobre o gado[a], seja muito ou pouco, e sobre o preço da mercadoria de um comerciante;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego difere perceptivelmente neste ponto, referindo-se mais amplamente a transações comerciais e a comerciantes. Segue-se aqui o testemunho hebraico como texto principal; o grego é usado apenas como confirmação do sentido comercial.
    reason: textual_variant
lexical_decisions:
- source_word: על
  choice: sobre
  rationale: A preposição introduz os assuntos nos quais, segundo o contexto, não se deve ter vergonha de agir com exatidão. “Sobre” preserva esse valor tópico com naturalidade em português.
- source_word: מקנה
  choice: gado
  rationale: Neste contexto, em combinação com “seja muito ou pouco”, o termo designa mais naturalmente animais possuídos ou rebanhos do que propriedade em geral. “Gado” é uma expressão corrente e suficientemente abrangente.
- source_word: בין רב למעט
  choice: seja muito ou pouco
  rationale: A expressão contrapõe quantidades. Esta formulação comunica claramente o sentido distributivo sem reproduzir de modo rígido a construção hebraica.
- source_word: ממחיר
  choice: o preço
  rationale: O hebraico parece apresentar uma construção comprimida. Em português, “o preço” transmite com clareza o sentido comercial sem conservar uma preposição que resultaria pouco natural.
- source_word: ממכר
  choice: mercadoria posta à venda
  rationale: O substantivo pode designar aquilo que é vendido ou o próprio ato da venda. A formulação escolhida preserva o referente comercial e evita uma construção possessiva ambígua ou pouco natural.
- source_word: תגר
  choice: comerciante (incorporado ao sentido comercial da expressão)
  rationale: O termo se refere a negociante ou comerciante. Como a sequência hebraica é compacta e difícil, seu valor é representado no conjunto “mercadoria posta à venda”, sem introduzir em português uma relação possessiva incerta.
- source_word: περὶ ἀδιαφόρου πράσεως καὶ ἐμπόρων
  choice: sobre negócios e comerciantes (como confirmação contextual)
  rationale: O paralelo grego diverge e não corresponde precisamente ao hebraico preservado, mas confirma que o assunto é comercial. Por isso, serve como controle de sentido, enquanto o hebraico permanece como texto principal.
