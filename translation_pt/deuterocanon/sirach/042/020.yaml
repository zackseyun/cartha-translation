  text: No understanding is lacking to him, and no word has escaped him.
translation:
  language: pt
  text: Nenhum entendimento lhe falta, e nenhuma palavra lhe escapa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שכל
  choice: entendimento
  rationale: O substantivo pode indicar entendimento, inteligência ou discernimento. “Entendimento” preserva a amplitude do hebraico e corresponde bem ao paralelo grego διανόημα.
- source_word: דבר
  choice: palavra
  rationale: דבר pode significar “palavra”, “assunto” ou “coisa”. O paralelo grego λόγος favorece “palavra”, sem excluir completamente a ideia mais ampla de assunto.
- source_word: חלפו
  choice: escapa
  rationale: O verbo expressa passar além ou escapar à percepção. O presente em português formula naturalmente a verdade geral afirmada sobre Deus.
theological_decisions:
- issue: Alcance do conhecimento divino
  choice: 'Formulação absoluta: “Nenhum entendimento... nenhuma palavra”'
  alternative: Atenuar como “quase nada” ou restringir o conhecimento a certo domínio
  rationale: As duas negações universais do hebraico afirmam conhecimento sem lacunas; a tradução mantém essa força sem acrescentar uma explicação doutrinária.
- issue: Referente pronominal implícito
  choice: Manter “lhe” sem explicitar “Deus”
  alternative: Inserir “a Deus” ou “dele”
  rationale: O hebraico usa um pronome cujo referente vem do contexto. Preservar o pronome evita acrescentar ao versículo um nome ausente no texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo equilibrado. “Lhe falta” e “lhe escapa” reproduzem as duas afirmações negativas do hebraico sem tornar a frase excessivamente literal.
