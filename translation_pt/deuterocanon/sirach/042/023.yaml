  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: pt
  text: Todas estas coisas vivem e permanecem para sempre; em toda necessidade, todas obedecem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico da Guenizá do Cairo aqui impresso traz uma linha diferente, aproximadamente: “E quem pode fartar-se de contemplar? A beleza das alturas do firmamento em sua pureza.” Evidências mais antigas de Massada e a tradição grega apoiam o sentido adotado no texto principal; a linha hebraica parece ter sido deslocada de um contexto próximo.'
    reason: textual_variant
  - marker: b
    text: Ou “para toda finalidade” ou “em toda circunstância de necessidade”, em vez de “em toda necessidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: Todos estes
  rationale: Conserva a força demonstrativa do grego e remete às obras da criação mencionadas no contexto imediato.
- source_word: ζῇ
  choice: vivem
  rationale: Expressa de modo direto a vitalidade contínua atribuída às obras criadas.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: permanecem para sempre
  rationale: Reproduz tanto a ideia de continuidade quanto a duração ilimitada, sem acrescentar a nuance de resistência que «perduram» poderia sugerir.
- source_word: ἐν πάσαις χρείαις
  choice: em todas as necessidades
  rationale: Mantém a amplitude de χρεία, que pode indicar necessidade, uso ou finalidade; uma nota registra alternativas naturais.
- source_word: ὑπακούει
  choice: obedecem
  rationale: Traduz de forma clara a submissão ou resposta ordenada de toda a criação.
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: Quem pode fartar-se de contemplar? A beleza das alturas do firmamento em sua pureza
  rationale: Esta linha hebraica divergente é preservada na nota, e não no texto principal, porque parece deslocada do contexto; a redação principal segue o sentido coerente atestado pelo grego e apoiado pelo testemunho mais antigo de Massada.
theological_decisions:
- issue: Texto principal diante da divergência entre o hebraico composto da Guenizá do Cairo e a tradição grega, apoiada pelo testemunho de Massada
  choice: 'Seguir no texto principal o sentido da tradição grega: «Todos estes vivem e permanecem para sempre; em todas as necessidades, todos obedecem».'
  alternative: 'Traduzir como texto principal a linha hebraica: «E quem pode fartar-se de contemplar? A beleza das alturas do firmamento em sua pureza».'
  rationale: A linha hebraica impressa parece deslocada de seu contexto, enquanto o grego oferece uma continuação coerente e corresponde ao teor preservado pelo testemunho mais antigo de Massada. A nota mantém visível a divergência textual, sem ocultá-la nem resolver silenciosamente a tensão.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção direta. «Firmamento» aparece apenas na nota por corresponder à linha hebraica divergente; o texto principal conserva a formulação universal e ordenada da tradição grega.
