  naturalness: “Todos estes” soa elíptico e pouco idiomático em português sem um antecedente masculino claro. “Todas estas coisas” torna explícita a referência às obras criadas e permite concordância natural ao longo do versículo. “Em toda necessidade” é mais fluente do que “em todas as necessidades”, sem estreitar o alcance do grego.
  terminology: “Permanecem para sempre” e “obedecem” conservam adequadamente μένει e ὑπακούει. A nota lexical deve oferecer alternativas portuguesas naturais e semanticamente próximas, sem apresentar “usos” como se fosse o único sentido alternativo.
