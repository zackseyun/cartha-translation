  text: He declares the changes that are coming[b][a], and reveals the search of hidden things.
translation:
  language: pt
  text: Ele dá a conhecer as mudanças que estão por acontecer[b][a] e revela a investigação de coisas ocultas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Paralelo grego: “Ele anuncia o que passou e o que está por vir e revela os vestígios das coisas ocultas.” Essa forma apresenta uma expansão temporal mais completa que o hebraico preservado.'
    reason: alternative_reading
  - marker: b
    text: O rolo de Massada correspondente a esta seção está fragmentado e não preserva este versículo de modo suficiente para substituir aqui a redação dos manuscritos da Guenizá do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  choice: dá a conhecer
  rationale: Expressa naturalmente o sentido de tornar conhecido ou anunciar, mantendo um registro digno sem excesso de formalidade.
- source_word: חליפות
  choice: as mudanças
  rationale: Preserva o sentido de mudanças, alternâncias ou sucessões, sem importar para o texto principal a expansão temporal explícita do paralelo grego.
- source_word: נהיות
  choice: que estão por acontecer
  rationale: Reflete o valor de coisas que vêm a existir ou sucederão; em português corrente, esta formulação é mais natural que uma tradução literal com 'vir a ser'.
- source_word: ומגלה
  choice: e revela
  rationale: Equivalente claro e direto para o verbo de descobrir ou tornar manifesto.
- source_word: חקר
  choice: a investigação
  rationale: Conserva o sentido substantivo de busca, exame ou sondagem presente no hebraico, ainda que a relação genitiva permaneça incomum.
- source_word: נסתרות
  choice: das coisas ocultas
  rationale: Representa de modo abrangente aquilo que está escondido ou encoberto.
theological_decisions:
- issue: Relação entre o hebraico preservado e o paralelo grego mais desenvolvido
  choice: Traduzir o hebraico como texto principal e registrar em nota a formulação temporal mais explícita do grego.
  alternative: Ele anuncia o que passou e o que está por vir e revela os vestígios das coisas ocultas.
  rationale: O hebraico existente não explicita 'passado e futuro'; inserir essa expansão no corpo do versículo substituiria a leitura hebraica pela do paralelo grego. A nota preserva a evidência alternativa sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores [b][a] acompanha a camada inglesa auditada; ambos aparecem no texto principal. A expressão 'investigação das coisas ocultas' mantém deliberadamente a formulação compacta e algo ambígua do hebraico.
