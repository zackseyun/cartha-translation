base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/014.yaml
  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: pt
  text: Melhor a maldade de um homem do que a bondade de uma mulher; e a mulher que causa vergonha torna-se motivo de reprovação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O trecho final em hebraico é difícil. O paralelo grego diz mais claramente: “e uma mulher que causa vergonha leva à reprovação”, apoiando o sentido adotado aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב
  choice: melhor ... do que
  rationale: A preposição מן, assimilada na forma, tem valor comparativo neste provérbio. O grego κρείσσων ... ἢ confirma a construção “melhor ... do que”.
- source_word: רוע
  choice: maldade
  rationale: O substantivo indica mal ou perversidade em sentido moral. “Maldade” preserva esse valor e forma uma antítese natural com “bondade”.
- source_word: איש
  choice: um homem
  rationale: O hebraico é singular e especificamente masculino, em contraste direto com אשה; por isso, não se neutraliza o gênero.
- source_word: אשה
  choice: uma mulher / a mulher
  rationale: O sentido comum é “mulher”, adequado ao contraste com איש. O contexto não exige a tradução “esposa”.
- source_word: מטוב אשה
  choice: do que a bondade de uma mulher
  rationale: A formulação mantém a comparação literal entre a maldade de um homem e a bondade de uma mulher, sem suavizar a retórica do texto.
- source_word: מחרפת
  choice: que causa vergonha
  rationale: A forma participial caracteriza a mulher como alguém que causa vergonha ou desonra. A oração relativa comunica o valor ativo e concorda com o grego καταισχύνουσα.
- source_word: תביע
  choice: torna-se
  rationale: A forma hebraica e a sintaxe do trecho são difíceis. À luz do paralelo grego e do sentido do provérbio, “torna-se” expressa com cautela o resultado sem alegar certeza lexical excessiva.
- source_word: חרפת
  choice: motivo de reprovação
  rationale: חרפה designa reprovação, afronta ou desonra. A expressão escolhida preserva a força nominal e soa natural em português.
theological_decisions:
- issue: Comparação moralmente perturbadora e marcada por gênero
  choice: Preservar o contraste explícito entre “um homem” e “uma mulher”, sem atenuá-lo nem universalizá-lo.
  alternative: Empregar termos neutros, como “uma pessoa”, ou reformular o dito para eliminar a comparação entre os gêneros.
  rationale: O hebraico contrapõe diretamente איש e אשה. A tradução deve representar de modo transparente a retórica do provérbio, sem corrigi-la por razões doutrinárias ou culturais.
- issue: Testemunho principal e obscuridade da oração final
  choice: Seguir o hebraico como testemunho principal e usar o paralelo grego para esclarecer prudentemente o sentido da oração final.
  alternative: Traduzir de modo estritamente literal a sintaxe hebraica obscura ou adotar integralmente uma reconstrução baseada no grego.
  rationale: O trecho final hebraico é textualmente difícil, sobretudo em torno de תביע. O grego apoia claramente a associação entre uma mulher que causa vergonha e a reprovação, justificando a redação adotada e uma nota de transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção proverbial foi mantida concisa; a linguagem marcada por gênero e a tensão moral do original não foram suavizadas.
