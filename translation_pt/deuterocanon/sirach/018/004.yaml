  text: And who can search out his mighty deeds?
translation:
  language: pt
  text: E quem poderá sondar as grandezas dele?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; “quem” é direto e natural em português.
- source_word: ἐξιχνιάσει
  choice: poderá sondar
  rationale: O futuro grego pode ser reproduzido naturalmente por “poderá”, enquanto “sondar” comunica a ideia de investigar profundamente ou tentar chegar ao fundo de algo. A formulação preserva a força retórica e a incapacidade implícita sem torná-la uma afirmação explícita.
- source_word: τὰ μεγαλεῖα
  choice: as grandezas
  rationale: O substantivo plural pode designar grandes feitos ou manifestações de grandeza. “As grandezas” conserva a amplitude e a relativa abstração do grego, sem restringir o sentido apenas a atos.
- source_word: αὐτοῦ
  choice: dele
  rationale: Possessivo natural em português. Pelo contexto, o pronome se refere a Deus, mas “dele” evita inserir o nome no versículo.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: “dele”, referindo-se contextualmente a Deus
  alternative: “de Deus” ou “do Senhor”
  rationale: O contexto identifica Deus como referente, mas manter o pronome preserva a forma do texto e evita explicitação desnecessária.
- issue: Sentido de τὰ μεγαλεῖα
  choice: “as grandezas”
  alternative: “os feitos poderosos”
  rationale: “As grandezas” preserva a possibilidade de o termo abranger tanto atos grandiosos quanto manifestações da grandeza divina; “feitos poderosos” resolveria a expressão exclusivamente como ações.
translation_notes:
  register: Português moderno, digno e acessível, com formulação retórica concisa. “Sondar” mantém ressonância bíblica sem ser arcaico; “dele” tem leitura natural para o público brasileiro e continua amplamente compreensível em português internacional.
