  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: pt
  text: Se você conceder à sua alma o prazer que ela deseja[a], isso fará de você motivo de alegria para os seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você ceder aos desejos da sua alma, se tornará motivo de satisfação para os seus inimigos.”'
    reason: Alternativa lexical que explicita o sentido contextual de χορηγήσεις e ἐπιθυμίας como entrega aos próprios desejos.
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição, preservando a estrutura direta da advertência sapiencial.
- source_word: χορηγήσεις
  choice: conceder
  rationale: Expressa a ideia de fornecer ou dar à própria alma o que ela deseja, sem explicitar demais o sentido contextual de ceder à cobiça.
- source_word: τῇ ψυχῇ σου
  choice: à sua alma
  rationale: Mantém a referência explícita à ψυχή, que aqui designa o ser interior, inclusive seus apetites, sem transformá-la em termo antropológico excessivamente técnico.
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: o prazer que ela deseja
  rationale: Torna natural em português a relação genitiva entre prazer e desejo, evitando restringir ἐπιθυμία a desejo sexual.
- source_word: ποιήσει σε
  choice: isso fará de você
  rationale: Reproduz de modo idiomático o valor causativo do futuro grego e deixa claro que a concessão anterior produz o resultado.
- source_word: ἐπίχαρμα
  choice: motivo de alegria
  rationale: O substantivo indica algo ou alguém sobre quem outros se alegram; a formulação preserva a imagem, enquanto o contexto dos inimigos comunica a ideia de satisfação maliciosa.
- source_word: τῶν ἐχθρῶν σου
  choice: para os seus inimigos
  rationale: 'Representa naturalmente em português o genitivo associado a ἐπίχαρμα: os inimigos são aqueles que se alegram com a situação da pessoa.'
theological_decisions:
- issue: Sentido antropológico de ψυχή
  choice: Manter “alma” no texto principal
  alternative: “você mesmo” ou “seu apetite”
  rationale: A máxima trata do desejo interior e do domínio próprio, não formula uma doutrina técnica sobre a alma. Ainda assim, o grego nomeia explicitamente ψυχή, e “alma” preserva essa linguagem.
- issue: Nuance hostil de ἐπίχαρμα τῶν ἐχθρῶν σου
  choice: “motivo de alegria para os seus inimigos”
  alternative: “alguém de quem os seus inimigos zombam” ou “motivo de satisfação maliciosa para os seus inimigos”
  rationale: A expressão diz literalmente que a pessoa se tornará objeto da alegria dos inimigos. A tradução principal conserva a imagem e a ambiguidade quanto à forma concreta dessa alegria hostil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. Conserva “alma” e a imagem de tornar-se motivo de alegria dos inimigos, evitando interpretar a consequência especificamente como zombaria ou ruína.
