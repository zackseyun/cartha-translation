translation:
  language: pt
  text: Antes de fazer um voto, prepare aquilo que vai prometer[a] e não seja como quem põe Yahweh à prova.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “aquilo que vai prometer” é difícil e também pode ser entendida mais simplesmente como “seu voto”. O sentido é que a pessoa deve estar pronta para cumprir o voto antes de fazê-lo.
    reason: lexical_alternative
  - marker: b
    text: 'A tradição grega difere consideravelmente neste ponto: “O orvalho não refresca o calor? Assim, uma palavra é melhor do que um presente.” Isso sugere que o texto grego se baseia em uma forma textual diferente.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: Antes de fazer um voto
  rationale: Expressa com naturalidade a relação temporal e o verbo נדר, “fazer um voto”, sem acrescentar conteúdo.
- source_word: הָכֵן נִדְרֶךָ
  choice: prepare o seu voto
  rationale: Mantém o imperativo הָכֵן e o sentido direto de נִדְרֶךָ, “seu voto”. A formulação conserva a concisão do hebraico; a nota esclarece que se trata de estar pronto para cumprir o voto.
- source_word: בַּל תִּהְיֶה
  choice: não seja
  rationale: Reproduz a proibição expressa por בַּל com a forma corrente e digna do português.
- source_word: כִּמְנַסָּה
  choice: como quem põe ... à prova
  rationale: Traduz a construção participial ligada a נסה de modo idiomático, preservando a ideia de testar ou provar alguém.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהֹוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e acompanha a decisão editorial fornecida, sem convertê-lo em título.
- issue: Sentido de pôr Yahweh à prova
  choice: não seja como quem põe Yahweh à prova
  alternative: não seja como quem tenta Yahweh
  rationale: “Pôr à prova” comunica com clareza o sentido de נסה e evita que “tentar” seja entendido apenas como induzir ao pecado; não explicita de que maneira o voto não cumprido prova Deus, preservando a concisão e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “voto” foi mantida por refletir a formulação enfática do hebraico. Os marcadores foram colocados junto às expressões que as notas explicam.
