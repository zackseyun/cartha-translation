translation:
  language: pt
  text: A ninguém ele concedeu proclamar as suas obras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não capacitou ninguém para declarar as suas obras” ou “A ninguém encarregou de proclamar as suas obras”. O verbo grego é incomum e pode sugerir permissão, capacitação ou incumbência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθενί
  choice: a ninguém
  rationale: 'O dativo do pronome negativo liga-se naturalmente ao verbo e preserva a estrutura grega: a concessão não foi dada a pessoa alguma.'
- source_word: ἐξεποίησεν
  choice: concedeu
  rationale: O verbo é incomum e, regendo o infinitivo, pode envolver permissão, capacitação ou incumbência. “Concedeu” é natural em português e mantém parte dessa amplitude sem reduzir o sentido a mera permissão.
- source_word: ἐξαγγεῖλαι
  choice: proclamar
  rationale: O infinitivo de ἐξαγγέλλω indica declarar ou divulgar; “proclamar” conserva sua força pública e declarativa.
- source_word: τὰ ἔργα αὐτοῦ
  choice: as suas obras
  rationale: Tradução direta que preserva a referência abrangente aos atos de Deus, sem restringi-los a feitos morais nem parafraseá-los.
theological_decisions:
- issue: Alcance da afirmação sobre as obras de Deus
  choice: A ninguém ele concedeu proclamar as suas obras.
  alternative: Ele não capacitou ninguém para proclamar as suas obras.
  rationale: A formulação conserva a declaração categórica do grego, mas evita explicitar que se trata necessariamente de incapacidade absoluta. A nota registra a tensão lexical entre concessão, capacitação e incumbência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção formal porém natural. O pronome “ele” retoma Deus no contexto; “as suas obras” evita possível ambiguidade de “suas obras” no uso isolado.
