  text: Before you speak[a], learn; and before sickness, seek treatment.
translation:
  language: pt
  text: Antes de falar, aprenda; e, antes da doença, cuide-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trate-se” ou “tome remédios”. O verbo grego pode significar cuidar, prestar assistência ou tratar medicamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ
  choice: Antes de
  rationale: Introduz a ação que deve preceder o falar; a formulação é direta e natural em português.
- source_word: λαλῆσαι
  choice: falar
  rationale: O infinitivo aoristo de λαλέω significa “falar”; mantém-se o infinitivo, que é idiomático depois de “antes de”.
- source_word: μάνθανε
  choice: aprenda
  rationale: O imperativo de μανθάνω exorta a adquirir conhecimento ou instrução antes de falar.
- source_word: πρὸ
  choice: antes de
  rationale: Marca prioridade temporal e preserva o paralelismo com a primeira oração.
- source_word: ἀρρωστίας
  choice: doença
  rationale: O substantivo designa doença, enfermidade ou debilidade física; “doença” é amplo e corrente.
- source_word: θεραπεύου
  choice: cuide-se
  rationale: O imperativo pode significar cuidar, atender ou tratar medicamente. “Cuide-se” preserva a amplitude do verbo e faz sentido como cuidado preventivo antes da doença, sem restringi-lo a um tratamento já iniciado.
