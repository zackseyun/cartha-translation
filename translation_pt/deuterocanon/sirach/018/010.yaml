base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/010.yaml
  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
translation:
  language: pt
  text: Como uma gota de água do mar e um grão de areia[a], assim são poucos anos no dia da eternidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pedrinha de areia”. A palavra grega geralmente pode significar “pedrinha”, mas, por estar ligada a “areia”, provavelmente indica aqui um único grão.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “no dia da era”. A expressão grega é compacta e pode indicar a imensa duração da eternidade em contraste com os poucos anos da vida humana.
    reason: alternative_reading
lexical_decisions:
- source_word: σταγών
  choice: gota
  rationale: Designa uma única gota e conserva de modo natural a imagem de extrema pequenez.
- source_word: ψῆφος ἄμμου
  choice: grão de areia
  rationale: Embora ψῆφος frequentemente signifique “pedrinha”, o genitivo ἄμμου especifica aqui uma única partícula de areia; “grão de areia” é a expressão portuguesa mais natural.
- source_word: ὀλίγα ἔτη
  choice: poucos anos
  rationale: Expressa diretamente a brevidade da vida humana em contraste com a duração imensa evocada no final do versículo.
- source_word: ἡμέρᾳ αἰῶνος
  choice: dia da eternidade
  rationale: Preserva a imagem singular e marcante do grego, na qual alguns anos são comparados a um só “dia” de duração imensurável.
- source_word: οὕτως
  choice: assim são
  rationale: Introduz com clareza a conclusão da comparação e concorda naturalmente com o plural “poucos anos”.
theological_decisions:
- issue: Sentido de αἰών na expressão ἐν ἡμέρᾳ αἰῶνος
  choice: eternidade
  alternative: era; idade; duração sem fim
  rationale: O contexto contrapõe a pequenez dos anos humanos a uma duração incomensurável. “Eternidade” comunica essa oposição sem eliminar, na nota, a formulação mais literal e ambígua “era”.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação incomum “dia da eternidade” foi mantida para preservar a força poética e a tensão temporal do original; as alternativas lexicais genuínas aparecem em notas.
