translation:
  language: pt
  text: Lembre-se da ira[a] nos dias do seu fim[c] e do tempo da vingança, quando o rosto se desviar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cólera”. O termo grego pode indicar forte indignação em geral, embora aqui provavelmente se refira à ira no juízo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no desviar de um rosto”. A imagem provavelmente indica a retirada do favor, possivelmente de Deus, mas o grego não identifica expressamente de quem é o rosto.
    reason: lexical_alternative
  - marker: c
    text: Ou “nos dias de sua morte”. O termo grego pode significar “fim”, “término” ou “morte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembre-se
  rationale: O imperativo aoristo pede que o leitor tenha conscientemente em mente a realidade anunciada; “Lembre-se” é direto, natural e fiel.
- source_word: θυμοῦ
  choice: ira
  rationale: θυμός pode indicar ira, cólera ou forte indignação. “Ira” preserva o tom solene e sua provável referência ao juízo, sem nomear explicitamente quem se ira.
- source_word: ἐν ἡμέραις τελευτῆς
  choice: nos dias do seu fim
  rationale: τελευτή pode significar fim, término ou morte. A formulação mantém “fim” no texto e, pelo contexto de exortação pessoal, explicita a relação com o destinatário sem reduzir o termo simplesmente a “morte”.
- source_word: καιρὸν
  choice: o tempo
  rationale: Embora não tenha artigo no grego, o genitivo seguinte identifica um tempo específico. “O tempo” é idiomático em português e não exige acrescentar “determinado” ou “designado”.
- source_word: ἐκδικήσεως
  choice: vingança
  rationale: ἐκδίκησις pode designar vingança, punição ou vindicação. Em paralelo com “ira” e no contexto de advertência, “vingança” comunica melhor o aspecto punitivo, preservando a força do termo.
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: quando o rosto se desviar
  rationale: A expressão significa literalmente algo como “no desviar de um rosto”. A redação verbal é natural em português, conserva a imagem do rosto que se afasta e não introduz Deus como sujeito explícito.
theological_decisions:
- issue: Se Deus deve ser explicitamente identificado como fonte da ira, da vingança e do rosto que se desvia
  choice: Manter o sujeito implícito no texto principal
  alternative: Explicitar “a ira de Deus”, “a vingança de Deus” ou “quando Deus desviar o rosto”
  rationale: O contexto provavelmente aponta para o juízo divino, mas o grego não nomeia Deus. Manter a formulação implícita preserva a ambiguidade e evita acrescentar uma identificação teológica ao texto.
- issue: Se τελευτή deve ser traduzido diretamente como morte
  choice: Conservar “fim” no texto principal e registrar “morte” em nota
  alternative: Traduzir “nos dias de sua morte” ou “no fim da vida”
  rationale: “Morte” é uma leitura contextual provável, mas τελευτή também tem o sentido mais amplo de fim ou término. A opção principal retém essa amplitude sem tornar a advertência incompreensível.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “seu”. A ordem das ideias e a imagem do rosto foram preservadas, enquanto a construção nominal grega final foi vertida como oração temporal para maior naturalidade. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
