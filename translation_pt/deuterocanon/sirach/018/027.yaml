  text: A wise man will be cautious in everything[b][a], and in days of sins he will beware of wrongdoing.
translation:
  language: pt
  text: O homem sábio será cauteloso em tudo[a] e, em dias de pecados[b], terá cuidado para não cometer falta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será reverente em tudo”. O verbo grego pode indicar tanto reverência quanto cautela vigilante; neste contexto, a segunda ideia é favorecida pelo cuidado de evitar uma falta.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em dias de pecados”; provavelmente, tempos ou ocasiões marcados pelo pecado ou pela tentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφὸς
  choice: O homem sábio
  rationale: Mantém a forma proverbial no singular e o substantivo grego de referência humana, aqui acompanhado do adjetivo masculino σοφός.
- source_word: ἐν παντὶ
  choice: em tudo
  rationale: Preserva de modo natural a abrangência da expressão grega, que pode incluir toda matéria ou circunstância.
- source_word: εὐλαβηθήσεται
  choice: será cauteloso
  rationale: O verbo pode indicar cautela, vigilância ou reverência. O paralelismo com evitar uma falta favorece aqui o sentido prático e moral de cautela, sem eliminar a alternativa em nota.
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: em dias de pecados
  rationale: Reproduz o plural incomum do grego e preserva sua possível referência a tempos ou ocasiões marcados por pecados.
- source_word: προσέξει ἀπὸ
  choice: terá cuidado para não cometer
  rationale: Expressa em português idiomático a ideia de prestar atenção para se manter afastado de algo.
- source_word: πλημμελίας
  choice: falta
  rationale: O termo denota falta, erro, ofensa ou má ação. 'Falta' conserva essa amplitude sem tornar o sentido mais técnico ou grave do que o grego exige.
theological_decisions:
- issue: Sentido de εὐλαβηθήσεται na máxima sapiencial
  choice: cautela prática e moral
  alternative: reverência em tudo
  rationale: A oração paralela, que descreve o cuidado de evitar uma falta, favorece cautela ou vigilância; a possível nuance de reverência é preservada em nota.
- issue: Expressão temporal ἡμέραις ἁμαρτιῶν
  choice: dias de pecados
  alternative: tempos de pecado ou de tentação
  rationale: A tradução mantém a forma plural e a ambiguidade da expressão, enquanto a nota esclarece seu provável alcance sem restringi-lo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura proverbial foi mantida, e as ambiguidades lexicais relevantes foram registradas em notas.
