  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
translation:
  language: pt
  text: O ingrato insensato lança censuras, e o presente do invejoso[a] consome os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «daquele que tem mau-olhado» — isto é, de quem dá de má vontade ou com mesquinhez. O grego βασκάνος pode evocar tanto a inveja como a ideia do «mau-olhado».
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
  choice: insensato
  rationale: Preserva a caracterização moral própria da literatura sapiencial, em linguagem atual e digna.
- source_word: ἀχάριστος
  choice: ingrato
  rationale: Expressa de modo direto a falta de gratidão; junto de «insensato», mantém a concisão proverbial do grego.
- source_word: ὀνειδιεῖ
  choice: lança censuras
  rationale: Comunica o ato de dirigir reprovação ou opróbrio a alguém, sem reduzir o sentido à simples crítica.
- source_word: δόσις
  choice: presente
  rationale: Neste contexto, designa naturalmente aquilo que é dado, e não apenas o ato de dar.
- source_word: βασκάνου
  choice: do invejoso
  rationale: Traduz o sentido lexical direto de inveja, enquanto a nota registra as nuances de mau-olhado e de generosidade contrariada.
- source_word: ἐκτήκει
  choice: consome
  rationale: Mantém a imagem forte de desgaste ou definhamento progressivo expressa pelo verbo grego.
- source_word: ὀφθαλμούς
  choice: os olhos
  rationale: Conserva literalmente a imagem ambígua do original, sem substituí-la por uma interpretação psicológica.
