translation:
  language: pt
  text: Ele viu e reconheceu que a ruína deles era terrível; por isso, multiplicou a sua expiação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua propiciação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἶδεν
  choice: viu
  rationale: Traduz diretamente o aoristo de ὁράω e mantém a progressão entre perceber e compreender.
- source_word: ἐπέγνω
  choice: reconheceu
  rationale: Expressa percepção plena ou compreensão, distinguindo o verbo do simples ato de ver.
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: a ruína deles
  rationale: καταστροφή pode indicar ruína, destruição ou desfecho desastroso. “Ruína” preserva a gravidade sem restringir o sentido ao ato físico de destruir.
- source_word: ὅτι πονηρά
  choice: que ... era terrível
  rationale: Neste contexto, πονηρά caracteriza a condição ou o destino como desastroso, penoso ou miserável, e não necessariamente como moralmente perverso. “Terrível” comunica esse valor contextual em português natural.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Equivalente inferencial claro e corrente para a locução grega.
- source_word: ἐπλήθυνεν
  choice: multiplicou
  rationale: Preserva a imagem enfática do verbo, que significa tornar numeroso, aumentar ou fazer abundar.
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: a sua expiação
  rationale: Mantém o possessivo e o peso cultual e teológico de ἐξιλασμός sem substituir o termo por uma noção mais geral, como misericórdia.
theological_decisions:
- issue: Sentido de ἐξιλασμός
  choice: expiação
  alternative: propiciação
  rationale: “Expiação” é um termo bíblico reconhecível e conserva a ideia de tratamento ou remoção da culpa e da ofensa. “Propiciação” destaca mais o apaziguamento, possibilidade lexical registrada em nota, sem impor essa nuance ao texto principal.
- issue: Objeto beneficiário da expiação
  choice: não acrescentar “em favor deles” ao texto principal
  alternative: sua expiação em favor deles
  rationale: O contexto associa a ação divina à ruína humana, mas o grego traz apenas o possessivo αὐτοῦ e não expressa um objeto indireto. A tradução evita explicitar como texto o que permanece implícito na fonte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. “Ruína” e “terrível” evitam uma formulação artificial, ao mesmo tempo que preservam a severidade da condição descrita. A ordem dos dois verbos e a imagem de multiplicar foram mantidas próximas do grego.
