  text: The one who lives forever created all things at once[a].
translation:
  language: pt
  text: Aquele que vive para sempre criou todas as coisas em conjunto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criou tudo coletivamente”, “criou todas as coisas como um todo” ou, possivelmente, “criou todas as coisas de uma só vez”. O advérbio grego κοινῇ é conciso e pode enfatizar a criação em sua totalidade.
    reason: alternativa lexical
lexical_decisions:
- source_word: Ὁ ζῶν
  choice: Aquele que vive
  rationale: O particípio presente com artigo funciona como substantivo. A formulação preserva a descrição do sujeito sem acrescentar “Deus” ou “Senhor”.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressa duração perpétua de modo natural, claro e solene em português atual.
- source_word: ἔκτισεν
  choice: criou
  rationale: Em contexto cosmológico, κτίζω indica a origem do que existe; “criou” transmite esse sentido com precisão.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém a expressão abrangente do grego e o tom elevado, referindo-se à totalidade do que foi criado.
- source_word: κοινῇ
  choice: em conjunto
  rationale: O advérbio pode significar “em comum”, “conjuntamente” ou “coletivamente”. “Em conjunto” conserva sua concisão e sua possível ênfase na criação tomada como um todo, sem impor exclusivamente uma ideia temporal.
theological_decisions:
- issue: Identificação do sujeito como Deus sem nome ou título divino explícito
  choice: Aquele que vive para sempre
  alternative: Deus, que vive para sempre; O Senhor, que vive para sempre
  rationale: O grego apresenta o sujeito por meio de uma expressão participial descritiva, sem θεός nem κύριος. A tradução mantém essa forma e não explicita uma identificação que o versículo deixa ao contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e claro; evita tanto arcaísmos quanto explicitação teológica não presente no grego. A nota preserva a ambiguidade de κοινῇ.
