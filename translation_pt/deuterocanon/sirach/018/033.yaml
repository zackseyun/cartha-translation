  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: pt
  text: Não seja glutão nem beberrão,[b] quando não há nada em sua bolsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico בַּכִּים é difícil. O paralelo grego traz “em sua bolsa” (ἐν μαρσιππίῳ), apoiando o sentido econômico adotado aqui.
    reason: textual_variant
  - marker: b
    text: 'O testemunho grego amplia a advertência: “Não se torne pobre, banqueteando-se com dinheiro emprestado, quando não há nada em sua bolsa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹלֵל
  choice: glutão
  rationale: No contexto sapiencial hebraico, o termo designa quem come de modo excessivo ou dissipador. “Glutão” conserva a força moral do termo e o paralelismo com “beberrão”.
- source_word: וְסוֹבֵא
  choice: nem beberrão
  rationale: O termo se refere a quem se entrega ao consumo excessivo de bebida. “Beberrão” é corrente, claro e mantém o paralelismo da dupla advertência; “nem” expressa naturalmente em português a coordenação sob a proibição.
- source_word: וּמְאוּמָה אֵין
  choice: quando não houver nada
  rationale: A oração descreve a falta absoluta de recursos. “Quando” dá à advertência uma relação circunstancial ou condicional natural em português, sem tornar essa relação mais precisa do que o contexto permite.
- source_word: בַּכִּים
  choice: em sua bolsa
  rationale: A forma hebraica é difícil, mas o paralelo grego ἐν μαρσιππίῳ indica uma bolsa de dinheiro. “Em sua bolsa” comunica de modo conciso a falta de recursos disponíveis.
theological_decisions:
- issue: Uso do testemunho hebraico principal diante da incerteza na palavra final e do paralelo grego mais desenvolvido
  choice: Preservar no texto principal a advertência hebraica contra a glutonaria e a embriaguez, entendendo a oração final em sentido econômico com o apoio do grego.
  alternative: Não se torne pobre, banqueteando-se com dinheiro emprestado, quando não há nada em sua bolsa.
  rationale: O hebraico existente deve permanecer como base. O grego esclarece de modo plausível o sentido econômico da palavra final, mas sua referência explícita a empobrecer e a festejar com dinheiro emprestado vai além da redação hebraica preservada; por isso, essa expansão fica registrada em nota, e não incorporada ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A dupla “glutão” e “beberrão” preserva o paralelismo incisivo do hebraico; as notas mantêm visível a incerteza textual e a forma mais ampla do grego.
