  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
translation:
  language: pt
  text: Não se deixe impedir de cumprir um voto no tempo devido e não espere até a morte para ser justificado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser declarado justo” ou “ser reconhecido como justo”. O grego pode se referir, de modo mais amplo, a ser considerado correto, sem necessariamente ter o sentido técnico posterior de “justificação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: se deixe impedir
  rationale: Preserva o sentido passivo da advertência e expressa em português natural que nenhum obstáculo deve levar ao adiamento.
- source_word: ἀποδοῦναι
  choice: cumprir
  rationale: Em combinação com εὐχήν, significa realizar aquilo que foi prometido; “cumprir um voto” é a expressão corrente e clara em português.
- source_word: εὐχήν
  choice: um voto
  rationale: Embora o termo também possa significar “oração”, a combinação com ἀποδοῦναι aponta para um voto feito a Deus e posteriormente cumprido.
- source_word: εὐκαίρως
  choice: no tempo devido
  rationale: Conserva tanto a ideia temporal quanto a obrigação moral de cumprir o voto na ocasião apropriada, sem adiá-lo.
- source_word: μὴ μείνῃς
  choice: não espere
  rationale: No contexto, o verbo adverte contra postergar a ação, e não apenas contra permanecer em determinado estado ou lugar.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: Mantém de forma concisa o limite extremo do adiamento expresso pelo grego.
- source_word: δικαιωθῆναι
  choice: ser justificado
  rationale: Preserva a ligação lexical com a linguagem de justiça do grego, sem definir de modo excessivamente estreito seu sentido neste contexto sapiencial.
theological_decisions:
- issue: Sentido de δικαιωθῆναι numa exortação sapiencial
  choice: ser justificado
  alternative: ser declarado justo; ser reconhecido como justo
  rationale: A tradução mantém visível o termo grego e sua tensão teológica, mas a nota esclarece que aqui ele pode ter o sentido mais amplo de ser considerado ou reconhecido como justo, sem exigir uma leitura doutrinária técnica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém a concisão e a urgência da dupla proibição grega.
