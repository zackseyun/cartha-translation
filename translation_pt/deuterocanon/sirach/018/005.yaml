  yaml_path: translation/deuterocanon/sirach/018/005.yaml
  text: Who can number the might of his majesty? And who can add to recounting his mercies?[a]
translation:
  language: pt
  text: Quem poderá enumerar o poder de sua majestade? E quem poderá continuar a relatar suas misericórdias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “quem acrescentará”, seguido de “relatar em detalhe”. A expressão significa acrescentar algo ao relato, isto é, continuar a narrar suas misericórdias.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτος
  choice: poder
  rationale: Expressa força ou poder manifesto; “poder” é claro, digno e natural em português, sem a conotação política mais estreita de “domínio”.
- source_word: μεγαλωσύνης
  choice: majestade
  rationale: No genitivo, qualifica o poder ligado à grandeza exaltada de Deus. “Majestade” preserva o tom elevado melhor que o termo mais genérico “grandeza”.
- source_word: ἐξαριθμήσεται
  choice: poderá enumerar
  rationale: O futuro tem força de pergunta retórica sobre capacidade. “Enumerar” comunica a ideia de contar exaustivamente, mantendo o registro elevado sem ser obscuro.
- source_word: προσθήσει
  choice: poderá continuar
  rationale: Embora o sentido básico seja “acrescentar”, com o infinitivo seguinte o verbo indica prosseguir ou acrescentar mais ao relato. “Continuar” torna o idioma grego natural em português.
- source_word: ἐκδιηγήσασθαι
  choice: relatando
  rationale: O verbo composto sugere narrar extensamente ou em detalhe. Em conjunto com “continuar”, “relatando” transmite uma narração prolongada sem produzir uma construção artificial.
- source_word: τὰ ἐλέη αὐτοῦ
  choice: suas misericórdias
  rationale: O plural é preservado para indicar as muitas manifestações da misericórdia divina, em vez de reduzir a expressão a uma disposição abstrata.
theological_decisions:
- issue: Referência divina e linguagem elevada
  choice: Empregar pronomes possessivos em minúscula e conservar os substantivos elevados “majestade” e “misericórdias”.
  alternative: Usar maiúsculas reverenciais (“Sua”) ou traduzir μεγαλωσύνη por “grandeza”.
  rationale: O grego expressa reverência pelo vocabulário, não pela capitalização dos pronomes. A escolha mantém o peso teológico sem importar uma convenção devocional posterior.
- issue: Alcance da segunda pergunta retórica
  choice: Manter a ideia de prosseguir no relato, sem afirmar explicitamente que alguém poderia completá-lo.
  alternative: Traduzir por “quem poderá relatar plenamente”, enfatizando apenas a impossibilidade de completar a narração.
  rationale: A construção προσθήσει ἐκδιηγήσασθαι conserva a imagem de acrescentar ou continuar a narrativa. A formulação escolhida preserva essa nuance e a tensão retórica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. As duas perguntas retóricas mantêm o paralelismo do grego; “continuar relatando” verte o idioma da segunda oração sem apagar sua imagem, explicitada na nota.
