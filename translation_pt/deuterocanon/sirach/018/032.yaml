  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
translation:
  language: pt
  text: Não se alegre com um mínimo de prazer[b], pois o seu fim é a pobreza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula hebraica final é incerta. O texto dos manuscritos hebraicos da Geniza do Cairo diz literalmente algo semelhante a “cuja boca de dois é a sua pobreza”, construção difícil de interpretar. O paralelo grego diz: “Não se alegre com muito luxo, nem se prenda à despesa que ele exige”, apoiando a ideia de que a indulgência resulta em perda financeira.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Não se alegre nem com um pouco de prazer”. O hebraico שֶׁמֶץ pode designar um pequeno fragmento, um vestígio ou uma quantidade mínima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Não se alegre
  rationale: A proibição expressa não tomar prazer ou satisfação em algo. “Não se alegre” conserva de modo natural o valor de שמח sem acrescentar uma censura mais forte do que a presente no hebraico.
- source_word: שֶׁמֶץ
  choice: um mero fragmento
  rationale: שֶׁמֶץ pode indicar uma pequena parte, um vestígio ou uma quantidade mínima. “Mero fragmento” preserva sua força diminutiva e levemente depreciativa; a alternativa “um pouco” é registrada em nota.
- source_word: תַּעֲנוּג
  choice: prazer
  rationale: O substantivo denota deleite, prazer ou satisfação, inclusive de caráter sensual. “Prazer” é amplo e direto; “luxo” dependeria mais do paralelo grego do que do texto hebraico.
- source_word: אֲשֶׁר
  choice: pois
  rationale: Embora seja normalmente um pronome relativo, aqui pode introduzir a explicação que fundamenta a advertência. “Pois” produz uma relação causal idiomática em português.
- source_word: פִּי
  choice: fim
  rationale: Literalmente “boca”, פִּי também pode participar de expressões relacionadas a extremidade, medida ou resultado. No contexto do provérbio, “fim” comunica o provável sentido de desfecho, mas a incerteza textual é explicitada em nota.
- source_word: רֵישׁוֹ
  choice: pobreza
  rationale: רֵישׁ significa pobreza, carência ou indigência. É a âncora lexical mais clara da cláusula hebraica final, apesar de a construção completa ser difícil.
- source_word: שְׂנַיִם
  choice: não representado diretamente no texto principal
  rationale: A forma significa normalmente “dois” ou “duplo”, mas sua relação sintática com פִּי e רֵישׁוֹ no texto transmitido é obscura. Em vez de impor a ideia de “pobreza dupla”, a tradução apresenta o sentido contextual provável e documenta a dificuldade na nota.
