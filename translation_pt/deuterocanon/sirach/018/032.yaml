translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação mantém a concisão proverbial do hebraico. A incerteza da cláusula final não é ocultada: o texto principal oferece o sentido contextual mais provável, enquanto a nota preserva a dificuldade do testemunho hebraico e registra o apoio divergente do paralelo grego.'
