  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
translation:
  language: pt
  text: O que é o ser humano, e qual é a sua utilidade?[a] Qual é o seu bem, e qual é o seu mal?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Utilidade” também pode ser entendida como “função”, “serventia” ou “valor prático”.
    reason: lexical_alternative
  - marker: b
    text: “Bem” e “mal” podem abranger tanto a dimensão moral quanto aquilo que beneficia ou prejudica.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: τί
  choice: o que / qual
  rationale: O interrogativo repetido introduz perguntas retóricas. Em português, “o que” é natural diante de “é o ser humano”, enquanto “qual” se ajusta aos substantivos determinados “utilidade”, “bem” e “mal”, preservando a repetição conceitual sem tornar a frase artificial.
- source_word: ἄνθρωπος
  choice: o ser humano
  rationale: O singular grego é genérico e pode representar qualquer pessoa ou a humanidade em sua condição comum. “O ser humano” conserva o singular e evita restringir a referência ao sexo masculino.
- source_word: χρῆσις
  choice: utilidade
  rationale: O termo pode indicar uso, emprego, função ou valor prático. “Utilidade” mantém a forma nominal e o paralelismo conciso do grego, sem acrescentar a ideia teleológica mais forte de “propósito”.
- source_word: ἀγαθόν
  choice: bem
  rationale: O adjetivo neutro substantivado forma contraste direto com κακόν. “Bem” preserva sua amplitude, que pode abranger bondade, benefício ou aquilo que é favorável.
- source_word: κακόν
  choice: mal
  rationale: No contraste com ἀγαθόν, o termo pode designar mal moral, algo ruim ou dano. “Mal” reproduz a oposição ampla e tradicional entre bem e mal sem limitar o sentido.
- source_word: αὐτοῦ
  choice: sua / seu
  rationale: Os possessivos retomam ἄνθρωπος no singular e conservam a simetria das três expressões gregas.
theological_decisions:
- issue: Referência antropológica genérica
  choice: o ser humano ... sua/seu
  alternative: o homem ... sua/seu
  rationale: O grego ἄνθρωπος é singular e genérico. “O ser humano” comunica essa abrangência em português atual sem transformar a referência em plural nem impor uma leitura exclusivamente masculina.
- issue: Sentido moral ou pragmático de κακόν
  choice: mal
  alternative: dano / aquilo que é ruim
  rationale: “Mal” mantém a força moral possível no contexto sapiencial, mas continua amplo o bastante para incluir adversidade, prejuízo ou o que é nocivo.
- issue: Alcance de χρῆσις
  choice: utilidade
  alternative: propósito / função / serventia
  rationale: “Utilidade” preserva a pergunta incisiva sobre valor ou emprego prático. “Propósito” sugeriria uma finalidade estabelecida de modo mais explícito do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura em duas perguntas conserva o paralelismo breve e meditativo do grego.
