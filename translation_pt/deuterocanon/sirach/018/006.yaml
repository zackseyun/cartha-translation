  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: pt
  text: Não é possível diminuir nem acrescentar, e não é possível sondar[a] as maravilhas do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seguir até o fim», «investigar» ou «compreender plenamente» as maravilhas do Senhor.'
    reason: Alternativas lexicais para ἐξιχνιάσαι, que contém a imagem de seguir rastros e pode indicar investigação ou compreensão exaustiva.
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: não é possível
  rationale: A construção impessoal expressa impossibilidade com clareza e conserva o paralelismo das duas orações.
- source_word: ἐλαττῶσαι
  choice: diminuir
  rationale: Mantém o sentido de tornar menor ou reduzir e forma uma antítese natural com «acrescentar».
- source_word: προσθεῖναι
  choice: acrescentar
  rationale: Expressa adição de modo natural e preserva o contraste com «diminuir».
- source_word: ἐξιχνιάσαι
  choice: sondar
  rationale: Comunica a ideia de investigar profundamente ou chegar à plena compreensão; a nota preserva mais explicitamente a metáfora de seguir rastros.
- source_word: τὰ θαυμάσια
  choice: as maravilhas
  rationale: Designação ampla que não restringe o referente a feitos, obras ou coisas maravilhosas.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Neste contexto sapiencial, κύριος funciona como título divino; «Senhor» preserva o uso bíblico estabelecido.
theological_decisions:
- issue: Escopo do objeto não expresso em «diminuir nem acrescentar»
  choice: Manter o objeto implícito.
  alternative: Suprir «a elas», «às suas obras» ou expressão semelhante com base no contexto.
  rationale: O grego não declara o objeto. Mantê-lo implícito preserva a formulação aforística e evita restringir interpretativamente a afirmação.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: senhor ou mestre
  rationale: O contexto aponta para Deus, e «Senhor» funciona como título divino sem acrescentar especificidade ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada e a repetição de «não é possível» conservam o paralelismo do grego; o objeto dos dois primeiros infinitivos permanece deliberadamente implícito.
