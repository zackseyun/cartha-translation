  text: Before you pray[a], prepare yourself, and do not be like a man testing the Lord.
translation:
  language: pt
  text: Antes de orar, prepare-se e não se torne como alguém que põe o Senhor à prova[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tenta o Senhor”. O verbo grego pode significar tanto “pôr à prova” como “tentar”; aqui, provavelmente se refere a submeter o Senhor a uma prova.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: Antes de orar
  rationale: Expressa de modo natural em português a relação temporal e toma εὔχομαι no sentido contextual de dirigir uma oração a Deus, sem introduzir aqui a possível nuance de voto.
- source_word: ἑτοίμασον σεαυτόν
  choice: prepare-se
  rationale: Preserva o imperativo e o caráter reflexivo da preparação pessoal, em formulação corrente e digna.
- source_word: μὴ γίνου ὡς ἄνθρωπος
  choice: não seja como alguém
  rationale: Em português, «não seja como alguém» comunica naturalmente a advertência de não assumir tal postura. «Alguém» preserva o valor humano genérico de ἄνθρωπος sem sugerir que a máxima se limita ao sexo masculino.
- source_word: πειράζων
  choice: que põe ... à prova
  rationale: A locução «pôr à prova» exprime com clareza o sentido de testar ou desafiar indevidamente, mantendo em nota a alternativa lexical «tentar».
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução tradicional e contextualmente apropriada de κύριος quando se refere a Deus nesta literatura sapiencial.
theological_decisions:
- issue: Sentido de πειράζων τὸν κύριον
  choice: que põe o Senhor à prova
  alternative: que tenta o Senhor
  rationale: πειράζω admite os sentidos de testar e tentar. Quando Deus é o objeto, «pôr à prova» comunica melhor a ideia de submetê-lo indevidamente a um teste, mas a nota conserva a ambiguidade lexical legítima.
- issue: Valor genérico de ἄνθρωπος
  choice: alguém
  alternative: um homem
  rationale: Neste provérbio, ἄνθρωπος designa genericamente uma pessoa. «Alguém» torna esse alcance claro em português natural, sem alterar a aplicação universal da advertência.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é concisa e sapiencial; «prepare-se» preserva a responsabilidade pessoal, e «põe o Senhor à prova» evita uma leitura artificial de tentativa de induzir Deus ao mal.
