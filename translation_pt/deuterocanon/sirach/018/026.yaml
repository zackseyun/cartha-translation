  text: From morning until evening the time changes[b][a], and all things are swift before the Lord.
translation:
  language: pt
  text: Da manhã até a tarde, o tempo muda[a], e tudo é rápido diante do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ocasião muda”, “a estação muda” ou “as circunstâncias mudam”. O grego καιρός pode indicar tempo, estação, ocasião ou circunstância, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tudo acontece depressa aos olhos do Senhor”. A frase pode destacar a rapidez com que as coisas mudam perante Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: Da manhã até a tarde
  rationale: Expressa com naturalidade o intervalo temporal do início ao fim do dia, sem restringir πρωΐθεν especificamente ao amanhecer.
- source_word: μεταβάλλει
  choice: muda
  rationale: Reproduz de modo direto o sentido de alteração ou mudança e mantém o caráter proverbial da frase.
- source_word: καιρός
  choice: o tempo
  rationale: Preserva a amplitude do termo grego, que pode indicar tempo, ocasião, estação ou circunstância, sem impor uma interpretação mais estreita.
- source_word: πάντα
  choice: tudo
  rationale: Transmite de forma abrangente e natural em português o neutro plural grego.
- source_word: ταχινὰ
  choice: rápido
  rationale: Mantém o sentido primário de rapidez de ταχινός. A construção concisa conserva certa tensão sem acrescentar uma ação não expressa no grego.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: Equivalente tradicional e claro para a ideia de estar perante o Senhor ou à sua vista, sem expansão interpretativa.
theological_decisions:
- issue: Sentido de καιρός nesta máxima sapiencial
  choice: o tempo
  alternative: a ocasião; a estação; as circunstâncias
  rationale: O contexto fala de mudança ao longo do dia. “O tempo” conserva a abrangência do grego e não limita a referência a estações do ano nem a uma circunstância específica.
- issue: Sentido de πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου
  choice: tudo é rápido diante do Senhor
  alternative: tudo acontece depressa aos olhos do Senhor; tudo é passageiro diante do Senhor
  rationale: A tradução mantém o valor lexical de rapidez em ταχινὰ e a formulação aberta do grego. Evita reinterpretar a frase como afirmação de que tudo é fácil para Deus ou de que tudo é necessariamente passageiro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Da manhã até a tarde” é idiomático; “diante do Senhor” preserva o registro bíblico sem soar arcaico. A concisão incomum de “tudo é rápido” acompanha deliberadamente a formulação grega e sua ambiguidade.
