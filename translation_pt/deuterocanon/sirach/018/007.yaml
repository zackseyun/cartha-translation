base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
translation:
  language: pt
  text: Quando uma pessoa termina[a], é então que começa; e, quando para, ficará sem saber como prosseguir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leva algo a termo” ou “chega ao fim”. O verbo grego expressa completar ou levar à conclusão.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficará perplexa” ou “ficará sem saída”. O grego sugere ficar sem um caminho adiante, sem recursos ou sem resposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma condição temporal geral. “Quando” é natural em português e preserva o estilo conciso do provérbio.
- source_word: συντελέσῃ
  choice: termina
  rationale: O verbo indica completar ou levar algo a termo. “Termina” funciona sem objeto expresso e mantém o paradoxo com “começa”.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Representa o substantivo singular genérico sem restringir o provérbio aos homens, em linguagem moderna e natural.
- source_word: τότε ἄρχεται
  choice: é então que começa
  rationale: Preserva o sentido de “então começa” e realça, sem explicá-lo, o contraste paradoxal com o término.
- source_word: παύσηται
  choice: para
  rationale: Tradução direta e corrente da ideia de cessar, adequada ao paralelismo com “termina” e “começa”.
- source_word: ἀπορηθήσεται
  choice: ficará sem saber como prosseguir
  rationale: Expressa o futuro passivo e a ideia de ficar sem caminho, recurso ou resposta, em português claro e idiomático.
theological_decisions:
- issue: Força interpretativa do provérbio sobre a limitação humana
  choice: 'Manter uma afirmação paradoxal e ampla: ao terminar, a pessoa começa; ao parar, não sabe como prosseguir.'
  alternative: Entender o versículo especificamente como referência ao trabalho humano interminável ou à morte.
  rationale: O grego é breve e não menciona explicitamente trabalho, conhecimento ou morte. A tradução conserva a tensão sapiencial sem impor uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e o paralelismo do provérbio, preservando a mudança do presente (“começa”) para o futuro (“ficará”) no grego.
