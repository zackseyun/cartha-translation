  text: My child[a], in good things do not add reproach, nor in any gift grief of words.
translation:
  language: pt
  text: Meu filho, ao fazer o bem, não o manche com censuras, nem acompanhe presente algum com palavras que causem tristeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nem, ao dar qualquer coisa, cause tristeza com suas palavras». O grego traz uma expressão condensada, literalmente «nem em toda dádiva, tristeza de palavras», advertindo contra estragar a generosidade com palavras que entristecem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Meu filho
  rationale: Vocativo singular típico da instrução sapiencial. Em português, «meu filho» preserva o tom afetuoso e pedagógico; embora a forma grega τέκνον não especifique necessariamente o sexo, «minha criança» soaria pouco natural neste registro.
- source_word: ἐν ἀγαθοῖς
  choice: ao fazer o bem
  rationale: O plural substantivado é amplo e, no contexto, aponta para benefícios ou atos de generosidade. A formulação idiomática mantém essa amplitude sem restringi-la apenas a bens materiais.
- source_word: μὴ δῷς μῶμον
  choice: não o manche com censuras
  rationale: δῷς significa literalmente «dês», mas a expressão indica não associar μῶμον — censura, reprovação ou mácula — ao bem praticado. «Manche com censuras» comunica naturalmente tanto a imagem de mácula quanto o efeito interpessoal da repreensão.
- source_word: ἐν πάσῃ δόσει
  choice: nem acompanhe presente algum
  rationale: δόσις pode indicar tanto a dádiva quanto o ato de dar; πάσῃ tem aqui força distributiva. «Presente algum» produz uma proibição natural em português, e «acompanhe» explicita com moderação a associação expressa pela preposição ἐν.
- source_word: λύπην λόγων
  choice: palavras que causem tristeza
  rationale: A construção genitiva grega é condensada e literalmente sugere «tristeza de palavras». A oração relativa esclarece que são palavras causadoras de tristeza, sem reduzir λύπη apenas a ofensa ou dor.
