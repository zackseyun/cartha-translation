lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e direto a relação causal ou conclusiva com o contexto anterior.
- source_word: ἐμακροθύμησεν
  choice: foi paciente
  rationale: Comunica a ideia de longanimidade e tolerância sem recorrer a uma formulação arcaica.
- source_word: Κύριος
  choice: o Senhor
  rationale: É a forma consagrada e natural em português para o título divino κύριος neste contexto.
- source_word: ἐπʼ αὐτοῖς
  choice: com eles
  rationale: Com o verbo 'ser paciente', a preposição 'com' é idiomática em português e representa adequadamente a relação expressa pelo grego.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: Preserva a metáfora concreta do verbo grego, sem enfraquecê-la com uma paráfrase.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: a sua misericórdia
  rationale: Misericórdia é a equivalência tradicional, clara e semanticamente apropriada para ἔλεος.
- source_word: ἐπʼ αὐτοὺς
  choice: sobre eles
  rationale: Combina naturalmente com 'derramou' e conserva a imagem espacial do original.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: O artigo definido produz em português a referência mais natural ao título divino, sem acrescentar uma identificação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de 'eles' foi mantida para refletir a estrutura e a ênfase do grego.
