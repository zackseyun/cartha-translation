  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: pt
  text: Ele tem misericórdia dos que acolhem a disciplina[a] e dos que se apressam em direção aos seus julgamentos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que recebem instrução”. O grego παιδεία pode significar instrução, formação ou disciplina corretiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas ordenanças”. O grego κρίματα pode referir-se a julgamentos, decisões ou ordenanças.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: tem misericórdia de
  rationale: Expressa de modo natural e teologicamente pleno a ação de mostrar misericórdia ou compaixão.
- source_word: τοὺς ἐκδεχομένους
  choice: os que acolhem
  rationale: 'Com παιδείαν, o verbo indica mais que mera espera: uma disposição receptiva, preservada por “acolhem” sem tornar explícita uma aceitação meramente intelectual.'
- source_word: παιδείαν
  choice: disciplina
  rationale: Mantém o campo formativo e corretivo próprio da literatura sapiencial; “instrução” continua sendo uma alternativa legítima.
- source_word: κατασπεύδοντας
  choice: correm com zelo
  rationale: Reproduz tanto a ideia de movimento apressado quanto a intensidade ou prontidão sugerida pelo verbo composto.
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: para os seus julgamentos
  rationale: A preposição com acusativo conserva a direção do movimento, enquanto “julgamentos” mantém a amplitude de κρίματα, que também pode designar decisões ou ordenanças.
theological_decisions:
- issue: Sentido de παιδεία no contexto sapiencial
  choice: disciplina
  alternative: instrução
  rationale: “Disciplina” preserva a dimensão formativa e corretiva, sem excluir o ensino que o termo também pode envolver.
- issue: Amplitude de κρίματα αὐτοῦ
  choice: seus julgamentos
  alternative: suas ordenanças
  rationale: “Julgamentos” evita restringir o termo apenas a prescrições legais e conserva sua possível referência a decisões ou atos judiciais divinos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acolhem” comunica receptividade de modo corrente; “correm com zelo” preserva a imagem de movimento e a intensidade do grego, ainda que mantenha a tensão incomum de correr para os julgamentos divinos.
