  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
translation:
  language: pt
  text: Antes de adoecer, humilhe-se; e, quando pecar, mostre arrependimento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mostre uma volta” ou “mostre um retorno”. A palavra grega pode indicar volta ou retorno; aqui, a referência imediata aos pecados favorece “arrependimento”.'
    reason: Preserva a alternativa lexical e a imagem de voltar presente em ἐπιστροφή.
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: Antes de adoecer
  rationale: 'Expressa de modo natural a anterioridade indicada por πρὶν e conserva o sentido ingressivo de ἀρρωστέω: ficar ou tornar-se doente.'
- source_word: ταπεινώθητι
  choice: humilhe-se
  rationale: Embora a forma grega seja passiva, o imperativo tem força reflexiva nesta exortação sapiencial e convoca a pessoa a uma humilhação voluntária.
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: quando pecar
  rationale: Reproduz em português corrente a referência temporal ligada a pecados, sem a construção pouco natural 'no tempo dos pecados'. O singular verbal genérico abrange as ocasiões ou atos de pecado indicados pelo plural grego.
- source_word: δεῖξον
  choice: mostre
  rationale: 'Mantém o sentido direto do imperativo: tornar visível ou evidente.'
- source_word: ἐπιστροφήν
  choice: arrependimento
  rationale: No contexto imediato de pecados, designa uma volta moral, comunicada naturalmente por 'arrependimento'; a imagem mais literal de voltar ou retornar é preservada em nota.
theological_decisions:
- issue: Sentido de ἐπιστροφήν em relação a ἁμαρτημάτων
  choice: arrependimento
  alternative: volta; retorno
  rationale: A menção imediata aos pecados favorece o sentido moral de arrependimento, sem transformar o termo em uma formulação teológica técnica. A nota conserva a amplitude lexical de uma volta ou retorno.
- issue: Força de ταπεινώθητι
  choice: humilhe-se
  alternative: seja humilhado
  rationale: A leitura reflexiva se ajusta à exortação para agir antes da doença; a alternativa passiva poderia sugerir uma humilhação meramente imposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação temporal foi tornada idiomática, enquanto a nota mantém a ambiguidade lexical relevante.
