  text: Is not a word better than a good gift? And both are with a gracious man[a][b].
translation:
  language: pt
  text: Uma palavra[a] não é melhor que um bom presente? E ambos se encontram num homem amável[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma fala” ou “um dito”; o grego contrapõe algo falado a um presente material.
    reason: lexical_alternative
  - marker: b
    text: Ou “num homem agraciado” ou “gracioso”. A expressão grega pode indicar que as duas coisas pertencem a essa pessoa ou se manifestam nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: não é
  rationale: A expressão introduz uma pergunta retórica afirmativa. Em português atual, a forma interrogativa com “não é” transmite essa força sem o arcaísmo de uma reprodução literal de ἰδού (“eis”).
- source_word: λόγος
  choice: uma palavra
  rationale: No contexto, λόγος designa algo dito, em contraste com um presente material. “Uma palavra” conserva a concisão proverbial e permite as nuances de fala, declaração ou dito.
- source_word: ὑπὲρ
  choice: melhor que
  rationale: Nesta comparação, ὑπέρ expressa superioridade de valor, não posição espacial. “Melhor que” comunica isso de modo claro e natural.
- source_word: δόμα ἀγαθόν
  choice: um bom presente
  rationale: δόμα é algo dado, um presente ou dádiva, e ἀγαθόν o qualifica como bom. A escolha mantém o contraste entre a palavra e o bem material.
- source_word: ἀμφότερα
  choice: ambos
  rationale: O termo retoma conjuntamente a palavra e o presente. O masculino plural é natural em português porque “presente” é masculino e coordena os dois elementos.
- source_word: παρὰ ἀνδρὶ
  choice: se encontram num homem
  rationale: παρά com o dativo pessoal pode indicar aquilo que está junto de alguém, lhe pertence ou se manifesta nele. “Se encontram num homem” expressa essa relação sem decidir rigidamente entre posse, procedência e qualidade pessoal.
- source_word: κεχαριτωμένῳ
  choice: bondoso
  rationale: O particípio descreve alguém marcado por graça, favor ou amabilidade. “Bondoso” se ajusta ao contexto de palavras benéficas e presentes, enquanto a nota registra a amplitude semântica do grego.
theological_decisions:
- issue: Masculino singular representativo na literatura sapiencial
  choice: homem
  alternative: pessoa
  rationale: O grego emprega explicitamente ἀνδρί, masculino singular. A tradução preserva essa forma proverbial sem afirmar que a máxima se aplique somente aos homens.
- issue: Sentido de κεχαριτωμένῳ
  choice: bondoso
  alternative: agraciado; cheio de graça; amável
  rationale: O contexto favorece uma qualidade benévola manifestada tanto na fala quanto no ato de dar, mas o termo também pode indicar alguém favorecido ou agraciado. A nota conserva essa tensão e evita transformar a expressão em afirmação técnica sobre a graça divina.
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. “Bom presente” é mais corrente no português brasileiro que “boa dádiva”, e “bondoso” evita tanto um tom excessivamente arcaico quanto uma interpretação teológica indevidamente específica.
