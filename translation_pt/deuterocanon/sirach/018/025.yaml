base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/025.yaml
  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: pt
  text: Lembre-se do tempo de fome em tempo de fartura[a], e da pobreza e da necessidade nos dias de riqueza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “época de fome... época de abundância”. O grego contrapõe tempos ou ocasiões de escassez e de plenitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembre-se
  rationale: O imperativo aoristo pede uma recordação deliberada. “Lembre-se” é direto, natural e preserva a força exortativa.
- source_word: καιρὸν λιμοῦ
  choice: do tempo de fome
  rationale: καιρός indica tempo ou ocasião, enquanto λιμός designa fome grave ou escassez de alimentos. A formulação mantém o contraste concreto do grego.
- source_word: ἐν καιρῷ πλησμονῆς
  choice: em tempo de fartura
  rationale: πλησμονή denota plenitude ou abundância. “Fartura” expressa com naturalidade a abundância material contraposta à fome.
- source_word: πτωχείαν
  choice: da pobreza
  rationale: πτωχεία designa o estado de pobreza; a escolha é clara, corrente e semanticamente direta.
- source_word: ἔνδειαν
  choice: da necessidade
  rationale: ἔνδεια enfatiza carência ou falta. “Necessidade” preserva sua distinção relativa em relação a “pobreza”.
- source_word: ἐν ἡμέραις πλούτου
  choice: nos dias de riqueza
  rationale: πλοῦτος significa riqueza ou bens. “Dias de riqueza” conserva a imagem temporal e o paralelismo do original.
theological_decisions:
- issue: Se o versículo deve ser suavizado em uma máxima geral sobre dificuldades futuras
  choice: Manter os contrastes concretos entre fome e fartura, e entre pobreza, necessidade e riqueza
  alternative: Parafrasear como “Nos bons tempos, lembre-se de que podem vir tempos difíceis”
  rationale: O grego apresenta condições econômicas específicas em paralelismo equilibrado. Preservá-las evita acrescentar uma generalização não expressa diretamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo sapiencial foi preservado; “fartura” oferece contraste idiomático e concreto com “fome”, enquanto a nota registra alternativas mais formais.
