  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
translation:
  language: pt
  text: Todo homem prudente reconheceu a sabedoria[a] e dará louvor a quem a encontrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “todo prudente”, no masculino singular, e usa um pronome feminino para retomar “sabedoria”. Também se pode traduzir o início por “Toda pessoa prudente reconheceu a sabedoria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς συνετός
  choice: Todo homem prudente
  rationale: O singular distributivo πᾶς com o adjetivo substantivado masculino συνετός descreve cada homem dotado de discernimento; “prudente” comunica entendimento aplicado sem confundi-lo com a própria “sabedoria” mencionada em seguida.
- source_word: ἔγνω
  choice: reconheceu
  rationale: O aoristo de γινώσκω apresenta o reconhecimento da sabedoria como fato completo; “reconheceu” expressa percebê-la pelo que ela é.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: É o equivalente corrente e mantém o tema sapiencial do livro.
- source_word: τῷ εὑρόντι αὐτήν
  choice: a quem a encontrou
  rationale: A construção dativa com particípio substantivado indica o destinatário do louvor. O pronome “a” retoma naturalmente “a sabedoria”, preservando o referente feminino sem forçar uma personificação além do que a gramática portuguesa permite afirmar.
- source_word: δώσει
  choice: dará
  rationale: Reproduz diretamente o futuro do indicativo grego.
- source_word: ἐξομολόγησιν
  choice: louvor
  rationale: Neste contexto, o substantivo denota reconhecimento elogioso ou agradecido, não confissão de pecado; “louvor” combina de modo natural com “dará”.
theological_decisions:
- issue: Representação masculina e linguagem feminina da sabedoria
  choice: “Todo homem prudente” e o pronome feminino “a” para a sabedoria
  alternative: “Toda pessoa prudente” e referência impessoal à sabedoria
  rationale: O grego emprega συνετός no masculino singular como designação substantivada do sujeito humano e αὐτήν no feminino em referência a σοφία. A tradução conserva essas formas, mas não transforma o gênero gramatical, por si só, em prova de personificação plena.
- issue: Destinatário do louvor
  choice: O homem prudente dará louvor àquele que encontrou a sabedoria
  alternative: Aquele que encontrou a sabedoria dará louvor
  rationale: A forma dativa τῷ εὑρόντι marca naturalmente o destinatário de δώσει ἐξομολόγησιν, enquanto πᾶς συνετός permanece como sujeito subentendido do segundo verbo.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada para evitar uma construção marcada, sem alterar as relações sintáticas do grego.
