lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  choice: os que têm discernimento nas palavras
  rationale: Expressa a capacidade de compreender e usar bem as palavras, preservando a construção grega sem restringi-la apenas à prudência ao falar.
- source_word: καὶ αὐτοὶ ἐσοφίσαντο
  choice: também se tornaram sábios
  rationale: Mantém o valor medial e a ideia de aquisição ou desenvolvimento de sabedoria; o pronome αὐτοί dá ênfase leve, que em português fica naturalmente absorvida pelo contexto.
- source_word: ἀνώμβρησαν
  choice: fizeram chover
  rationale: Preserva a metáfora vigorosa do verbo grego, em vez de substituí-la por uma formulação mais genérica como “derramaram” ou “proferiram”.
- source_word: παροιμίας ἀκριβεῖς
  choice: provérbios precisos
  rationale: παροιμίαι designa provérbios ou máximas, e ἀκριβεῖς ressalta exatidão, rigor e formulação cuidadosa.
