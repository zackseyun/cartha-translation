base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: pt
  text: A misericórdia humana se estende ao próximo, mas a misericórdia do Senhor se estende a toda carne[a]; ele repreende, disciplina, ensina e, como um pastor, reconduz[b] o seu rebanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade” ou “todo ser vivo”. “Toda carne” é uma expressão bíblica ampla para a vida criada.
    reason: lexical_alternative
  - marker: b
    text: Ou “faz voltar” ou “restaura”. O verbo grego indica voltar ou fazer voltar e, aqui, evoca um pastor que recupera os que se desviaram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος ἀνθρώπου
  choice: a misericórdia humana
  rationale: Expressa de modo natural o contraste entre a misericórdia limitada dos seres humanos e a misericórdia abrangente do Senhor, sem restringir o singular grego ao sexo masculino.
- source_word: ἐπὶ τὸν πλησίον αὐτοῦ
  choice: se estende ao próximo
  rationale: “Próximo” é a equivalência ética tradicional e clara de πλησίον; “se estende a” torna idiomática em português a relação expressa por ἐπί.
- source_word: ἔλεος δὲ Κυρίου
  choice: mas a misericórdia do Senhor
  rationale: Mantém o paralelismo com a primeira oração e traduz Κύριος pelo título bíblico corrente “Senhor”.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: se estende a toda carne
  rationale: Conserva a expressão bíblica ampla e sua possível referência à vida criada, sem limitá-la silenciosamente apenas à humanidade.
- source_word: ἐλέγχων
  choice: repreende
  rationale: Comunica a ideia de censura corretiva no contexto da misericórdia divina.
- source_word: παιδεύων
  choice: disciplina
  rationale: Preserva tanto o aspecto corretivo quanto o formativo do verbo grego.
- source_word: διδάσκων
  choice: ensina
  rationale: Equivalência direta, corrente e adequada à sequência de ações pastorais.
- source_word: ἐπιστρέφων
  choice: reconduz
  rationale: No contexto do pastor e do rebanho, exprime fazer voltar os que se desviaram sem transformar o verbo em termo teológico técnico.
- source_word: ὡς ποιμὴν τὸ ποίμνιον αὐτοῦ
  choice: o seu rebanho, como um pastor
  rationale: Mantém a comparação explícita e a metáfora pastoral em português natural.
theological_decisions:
- issue: Alcance de πᾶσαν σάρκα
  choice: toda carne
  alternative: toda a humanidade; todo ser vivo
  rationale: A expressão é deliberadamente abrangente e contrasta a misericórdia humana dirigida ao próximo com a misericórdia do Senhor. A tradução literal preserva sua amplitude e ressonância bíblica.
- issue: Sentido pastoral de ἐπιστρέφων
  choice: reconduz o seu rebanho
  alternative: faz voltar; restaura o seu rebanho
  rationale: A imagem permite tanto a noção de fazer voltar quanto a de restaurar. “Reconduz” preserva o movimento de retorno sugerido pelo verbo sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. “Misericórdia humana” evita um masculino genérico desnecessário; “toda carne” conserva o idioma bíblico, explicado em nota. Os marcadores foram colocados junto às expressões que efetivamente anotam.
