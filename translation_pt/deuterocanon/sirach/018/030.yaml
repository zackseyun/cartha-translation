  text: Do not go after your desires, and restrain yourself from your cravings;
translation:
  language: pt
  text: Não vá atrás dos seus desejos e refreie seus apetites;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀπίσω ... μὴ πορεύου
  choice: Não vá atrás
  rationale: A combinação idiomática expressa seguir ou ir em busca de algo. «Não vá atrás» conserva a imagem de movimento e é natural em português.
- source_word: τῶν ἐπιθυμιῶν σου
  choice: dos seus desejos
  rationale: ἐπιθυμία designa desejo em sentido amplo e adquire aqui força de advertência pelo contexto. «Desejos» evita restringir indevidamente o termo à luxúria sexual.
- source_word: ἀπὸ τῶν ὀρέξεών σου
  choice: diante dos seus apetites
  rationale: ὄρεξις pode indicar apetite, inclinação ou impulso forte. «Apetites» distingue o termo de ἐπιθυμίαι, enquanto «diante de» permite expressar em português idiomático a separação indicada por ἀπό com o imperativo reflexivo.
- source_word: κωλύου
  choice: contenha-se
  rationale: O imperativo médio/passivo pede que a pessoa imponha limite a si mesma. «Contenha-se» comunica de modo claro e conciso essa força reflexiva.
theological_decisions:
- issue: Nuance moral da linguagem do desejo
  choice: Empregar «desejos» e «apetites», termos amplos cuja força negativa decorre da advertência do versículo.
  alternative: «Cobiças» e «paixões» ou «desejos impuros»
  rationale: O grego adverte contra ser governado pelos desejos, mas não os restringe explicitamente à sexualidade nem define todos os desejos como intrinsecamente maus. A formulação preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, digno e acessível, com construção de boa legibilidade no Brasil e compreensão internacional. O ponto e vírgula preserva o caráter continuativo da unidade textual.
