  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
translation:
  language: pt
  text: Antes do julgamento, examine-se; e, na hora da visitação[a], você encontrará expiação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na hora da inspeção” ou “no momento da prestação de contas”; no grego, a linguagem de visitação pode indicar um momento de exame ou intervenção divina.
    reason: lexical_alternative
  - marker: b
    text: Ou “propiciação”; o termo grego indica a remoção da culpa e a restauração do favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: Antes do julgamento
  rationale: κρίσις indica julgamento ou avaliação judicial. “Julgamento” preserva o sentido amplo sem restringi-lo a condenação.
- source_word: ἐξέταζε σεαυτόν
  choice: examine-se
  rationale: O imperativo pede autoexame cuidadoso. A forma reflexiva é natural em português e traduz de modo direto tanto o verbo quanto seu objeto.
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: na hora da visitação
  rationale: ἐπισκοπή pode indicar visitação, inspeção ou prestação de contas. “Visitação” mantém a amplitude bíblica da expressão e suas possíveis conotações de exame ou intervenção divina.
- source_word: εὑρήσεις
  choice: você encontrará
  rationale: O futuro de εὑρίσκω significa diretamente “encontrará”; a forma com “você” oferece ampla legibilidade no português moderno.
- source_word: ἐξιλασμόν
  choice: expiação
  rationale: ἐξιλασμός se refere à remoção da culpa e à restauração do favor. “Expiação” conserva a densidade sacrificial e reconciliadora do termo sem reduzi-lo simplesmente a perdão.
theological_decisions:
- issue: Sentido de ἐπισκοπή no contexto sapiencial
  choice: visitação, com possíveis conotações divinas e judiciais
  alternative: inspeção; prestação de contas
  rationale: A expressão pode apontar para um momento decisivo de exame ou intervenção, possivelmente da parte de Deus. “Visitação” preserva essa tensão sem definir além do que o grego permite.
- issue: Sentido de ἐξιλασμόν
  choice: expiação
  alternative: propiciação; reparação; perdão
  rationale: O termo envolve a remoção da culpa e a restauração do favor. “Expiação” preserva seu peso teológico, enquanto as alternativas são registradas sem impor uma teoria específica da expiação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula reproduz a ligação estreita entre as duas orações sem tornar o período pesado. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
