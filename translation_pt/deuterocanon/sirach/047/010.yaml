base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: pt
  text: Ele deu às festas, ano após ano, esplendor, beleza e honra[b]; quando louvavam seu santo nome, desde cedo o santuário ressoava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula final é difícil no hebraico preservado. O texto grego diz: “e desde cedo o santuário ressoava”, provavelmente conservando o sentido pretendido.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “majestade, formosura e glória”. Os três termos hebraicos formam uma sequência de palavras de sentido próximo ligadas à magnificência e à honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן לחגים
  choice: Ele deu às festas
  rationale: Mantém o sentido direto de נתן, enquanto a preposição ל apresenta as festas como aquilo que recebeu esplendor e honra.
- source_word: בכל שנה ושנה
  choice: ano após ano
  rationale: Expressa naturalmente em português a repetição anual enfatizada pela duplicação hebraica.
- source_word: הוד פאר וכבוד
  choice: esplendor, beleza e honra
  rationale: Conserva os três termos do acúmulo hebraico e seu tom elevado, sem reduzir a sequência de quase sinônimos.
- source_word: בהללו את שם קדשו
  choice: quando louvavam seu santo nome
  rationale: Entende ב como circunstancial-temporal e verte a expressão hebraica idiomaticamente, sem explicitar além do texto quem compunha o sujeito plural.
- source_word: לפני בקר ירן משפט
  choice: desde cedo o santuário ressoava
  rationale: A frase hebraica preservada é obscura. O paralelo grego, ἀπὸ πρωῒ ἠχεῖν τὸ ἁγίασμα, sustenta com clareza a referência ao santuário ressoando desde a manhã; a tradução segue esse provável sentido contextual.
theological_decisions:
- issue: Como traduzir a cláusula final obscura do hebraico
  choice: desde cedo o santuário ressoava
  alternative: antes da manhã, o juízo/a ordenança ressoava
  rationale: A alternativa reproduz mais de perto as palavras do hebraico preservado, mas produz um sentido incerto no contexto. O grego antigo oferece uma leitura coerente com o louvor festivo no templo e é usado como testemunho paralelo sem ocultar a dificuldade textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética moderada. A sequência de três substantivos preserva a elevação do hebraico; “desde cedo” soa natural em português e reflete o controle textual oferecido pelo grego.
