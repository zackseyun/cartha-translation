base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: pt
  text: Em todas as suas obras, deu graças ao Deus Altíssimo com palavras de glória[a]; de todo o coração, amou aquele que o fez e, a cada dia, lhe deu graças com cânticos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com palavras de glória”; o grego traz de modo semelhante: “com uma palavra de glória”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz: “e, a cada dia, lhe deu graças com cânticos”. O paralelo grego diz, em vez disso: “com todo o seu coração, cantou louvores e amou aquele que o fez”, sem a referência explícita a “cada dia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: Em tudo o que fazia
  rationale: Expressa naturalmente a totalidade da atividade de Davi; evita o português menos fluente de uma reprodução rígida do singular coletivo hebraico.
- source_word: נתן הודות
  choice: dava graças
  rationale: Reproduz o sentido idiomático de ação de graças e combina com a ideia de prática habitual no contexto.
- source_word: לאל עליון
  choice: ao Deus Altíssimo
  rationale: Mantém diretamente o título divino hebraico עליון em formulação corrente e reverente em português.
- source_word: באמרי כבוד
  choice: com palavras de glória
  rationale: Preserva a construção hebraica, também apoiada pelo paralelo grego, sem reduzir כבוד apenas a elogio ou honra.
- source_word: בכל לבו
  choice: De todo o coração
  rationale: Equivalente idiomático claro da expressão hebraica de devoção integral.
- source_word: אוהב עשהו
  choice: amava aquele que o fez
  rationale: Torna explícita a relação pessoal contida no sufixo hebraico e evita a possível rigidez de 'seu Criador', embora essa seja uma alternativa legítima.
- source_word: וכבל יום
  choice: e, a cada dia
  rationale: Representa a leitura transmitida com o provável sentido de repetição diária; a incerteza textual e a ausência da frase no grego são registradas em nota.
- source_word: הודה לו בזמירות
  choice: lhe dava graças com cânticos
  rationale: Conserva o valor de ação de graças de הודה e traduz זמירות como composições cantadas de louvor, sem especificá-las indevidamente como salmos.
theological_decisions:
- issue: Título divino עליון
  choice: Deus Altíssimo
  alternative: o Altíssimo
  rationale: A forma escolhida preserva tanto o substantivo אל quanto o epíteto עליון, sem acrescentar formulação doutrinária.
- issue: Relação entre o hebraico e a leitura grega na segunda metade
  choice: 'Seguir o hebraico: amor ao Criador e ação de graças diária com cânticos'
  alternative: 'Seguir o grego: ''cantou louvores e amou aquele que o fez'', sem referência explícita a cada dia'
  rationale: O hebraico fornecido é a fonte primária e tem alta confiança, enquanto o grego funciona como paralelo; a diferença genuína entre as testemunhas é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A redação favorece fluência sem apagar as imagens do hebraico; 'cânticos' mantém um registro literário adequado ao contexto.
