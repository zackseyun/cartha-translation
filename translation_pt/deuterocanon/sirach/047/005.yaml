base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: pt
  text: Pois ele invocou o Deus Altíssimo[a], e Deus lhe deu força na mão direita, para repelir um homem perito na guerra e erguer o chifre[b] de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego paralelo traz “o Senhor, o Altíssimo”.
    reason: alternative_reading
  - marker: b
    text: “Chifre” é uma imagem bíblica de força, honra ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל
  choice: invocou
  rationale: O idioma expressa um apelo dirigido a Deus em busca de auxílio; “invocou” é natural, conciso e preserva o sentido de oração.
- source_word: אל עליון
  choice: o Deus Altíssimo
  rationale: Segue de perto o hebraico, testemunho principal. O grego paralelo traz “o Senhor, o Altíssimo”, variante registrada em nota.
- source_word: ויתן בימינו עז
  choice: e este deu força à sua mão direita
  rationale: Mantém a imagem corporal hebraica e torna claro, sem acrescentar conteúdo, que Deus fortaleceu a mão direita de Davi.
- source_word: להדוף
  choice: repelir
  rationale: Expressa o ato de empurrar para trás ou rechaçar sem especificar além do hebraico a forma da derrota.
- source_word: איש יודע מלחמות
  choice: um homem perito na guerra
  rationale: Reproduz naturalmente a ideia literal de um homem que conhece as guerras, isto é, experiente e hábil no combate.
- source_word: ולהרים את קרן ישראל
  choice: erguer o chifre de Israel
  rationale: Conserva a metáfora bíblica do chifre como imagem de força, honra e poder, esclarecida em nota.
theological_decisions:
- issue: Título divino com pequena diferença entre o hebraico e o grego
  choice: o Deus Altíssimo
  alternative: o Senhor, o Altíssimo
  rationale: O hebraico, fonte principal e de alta confiança, lê “Deus Altíssimo”; a forma grega é preservada como variante, sem harmonizar silenciosamente os testemunhos.
- issue: Agente que concede força
  choice: este, referindo-se a Deus
  alternative: ele, com referente gramatical menos explícito
  rationale: O contexto e a sequência sintática indicam Deus como aquele que fortalece a mão direita de Davi. “Este” evita em português uma possível leitura equivocada de que Davi fortaleceu a própria mão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e preservação da metáfora bíblica. “Perito na guerra” mantém o tom elevado sem soar arcaico.
