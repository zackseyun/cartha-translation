  text: He played with young lions as with a kid[b][a], and with bears as with calves of Bashan.
translation:
  language: pt
  text: Brincava com leões jovens como com um cabrito, e com ursos como com as crias de Basã.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e com ursos como com cordeiros do rebanho”, tornando a segunda comparação mais explícita do que o hebraico, que diz “as crias de Basã”.'
    reason: alternative_reading
  - marker: b
    text: Basã era conhecida por seus animais fortes e bem alimentados; aqui, o nome da região provavelmente evoca crias de animais domésticos.
    reason: cultural_note
lexical_decisions:
- source_word: לכפירים
  choice: com leões novos
  rationale: כפירים designa leões jovens, não leões de modo genérico. A preposição ל, no paralelismo, indica o âmbito ou a associação da ação; “com” produz em português uma imagem natural e coerente com o grego ἐν λέουσιν.
- source_word: שחק
  choice: brincava
  rationale: O verbo expressa ação lúdica. “Brincava” preserva o contraste poético entre a tranquilidade de Davi e o perigo dos animais.
- source_word: כגדי
  choice: como com um cabrito
  rationale: גדי é o filhote da cabra. A repetição de “com” explicita que ele tratava os leões como trataria um pequeno animal doméstico, sem alterar a comparação.
- source_word: ולדבים
  choice: e com ursos
  rationale: A conjunção e a preposição dão continuidade ao paralelismo. O hebraico emprega o termo comum para ursos, sem especificar idade ou sexo.
- source_word: כבני בשן
  choice: como com as crias de Basã
  rationale: A expressão significa literalmente “como [com] filhos/crias de Basã”, sem nomear inequivocamente a espécie. “Crias” conserva essa abertura do hebraico; Basã evoca os animais robustos e bem alimentados pelos quais a região era conhecida.
theological_decisions:
- issue: Relação entre o texto hebraico preservado e a forma mais explícita do paralelo grego
  choice: Manter no texto principal a expressão hebraica mais aberta, “as crias de Basã”.
  alternative: Adotar a explicitação grega, “cordeiros do rebanho”.
  rationale: O hebraico sobrevivente é a fonte principal e não identifica expressamente a espécie na segunda comparação. O grego confirma a imagem geral de animais domésticos jovens, mas parece interpretar ou tornar mais explícita a expressão hebraica; por isso, sua leitura é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi mantido por meio de “com... como com...”, e “crias de Basã” preserva a concisão e a ambiguidade lexical do hebraico.
