base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: pt
  text: Por isso, as filhas lhe responderam[a] e o aclamaram entre miríades. Quando pôs o turbante[b], ele combateu e, por todos os lados, subjugou o inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão provavelmente se refere a mulheres que respondiam com cânticos ou aclamações depois da vitória.
    reason: cultural_note
  - marker: b
    text: 'O grego traz: «Assim ele o glorificou entre miríades e o louvou com as bênçãos do Senhor, quando lhe foi trazido um diadema de glória». Essa tradição preserva uma imagem régia mais explícita que o hebraico «turbante».'
    reason: alternative_reading
lexical_decisions:
- source_word: על כן
  choice: Por isso
  rationale: Expressa de modo natural a consequência que liga o versículo às vitórias e ao louvor de Davi mencionados antes.
- source_word: ענו לו
  choice: lhe responderam
  rationale: Preserva o sentido básico de ענה, «responder», sem tornar explícita no texto principal a provável ideia contextual de canto responsivo.
- source_word: בנות
  choice: as filhas
  rationale: Reproduz de perto o hebraico e conserva sua forma de expressão; no contexto, provavelmente designa mulheres ou jovens que celebravam a vitória.
- source_word: ויכנוהו
  choice: o aclamaram
  rationale: A forma hebraica é difícil; «aclamaram» comunica honra pública e se harmoniza com o paralelo grego, que fala em glorificar e louvar.
- source_word: ברבבה
  choice: entre miríades
  rationale: Mantém o idioma numérico do hebraico e encontra apoio no grego ἐν μυριάσιν, sem reduzi-lo simplesmente a «multidões».
- source_word: בעטותו
  choice: Quando pôs
  rationale: Transmite de forma idiomática o ato hebraico de vestir ou envolver-se com a peça de cabeça e seu valor temporal.
- source_word: צניף
  choice: o turbante
  rationale: É o equivalente direto de uma peça de cabeça enrolada. A leitura régia do grego, «diadema de glória», é preservada em nota.
- source_word: נלחם
  choice: combateu
  rationale: Verbo marcial claro, atual e digno para o sentido de lutar ou fazer guerra.
- source_word: ומסביב
  choice: por todos os lados
  rationale: Comunica naturalmente a abrangência espacial da vitória.
- source_word: הכניע
  choice: subjugou
  rationale: Preserva a ideia de fazer o adversário baixar-se ou ficar sujeito, mais específica que apenas «derrotou».
- source_word: צר
  choice: o inimigo
  rationale: Representa com clareza o singular coletivo hebraico, que pode abranger os adversários ao redor.
theological_decisions:
- issue: Relação entre o צניף hebraico e o «diadema de glória» do paralelo grego
  choice: O texto principal segue o hebraico com «turbante», registrando em nota a imagem régia do grego.
  alternative: «diadema» ou «diadema de glória»
  rationale: Como o hebraico de Ben Sira está preservado aqui e tem alta confiança, ele orienta o texto principal. O grego pode refletir uma variante ou interpretação que acentua a realeza de Davi; a nota mantém essa tradição significativa sem fundi-la silenciosamente ao hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das notas foi ajustada para que a observação cultural acompanhe «as filhas lhe responderam» e a variante grega acompanhe «turbante». «Miríades» conserva o idioma numérico antigo e o tom poético, enquanto a sintaxe permanece corrente.
