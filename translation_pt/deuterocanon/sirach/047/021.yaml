  text: to divide the people into two tribes[b][a], and from Ephraim a lawless kingdom.
translation:
  language: pt
  text: para dividir o povo em duas tribos[a] e, de Efraim, um reino de violência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “para que o domínio se dividisse e, de Efraim, começasse um reino desobediente”. O hebraico diz mais explicitamente: “para dividir o povo em duas tribos”.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por “um reino injusto” ou, à luz do grego, “um reino rebelde”. O hebraico חמס pode indicar violência, injustiça ou dano; o paralelo grego enfatiza desobediência ou rebelião.
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק
  choice: dividir
  rationale: O infinitivo indica causar uma divisão; “dividir” expressa diretamente o cisma político.
- source_word: העם
  choice: o povo
  rationale: Preserva o sentido comum de עם e a referência ao povo como unidade antes da divisão.
- source_word: לשני שבטים
  choice: em duas tribos
  rationale: Traduz literalmente שבטים, sem substituir a formulação hebraica por uma reconstrução histórica.
- source_word: ומאפרים
  choice: e, de Efraim
  rationale: A preposição מן indica origem ou procedência; a formulação mantém aberta a relação sintática concisa do hebraico.
- source_word: ממלכת
  choice: um reino
  rationale: ממלכה designa reino ou domínio político; o artigo indefinido é natural em português neste fragmento predicativo.
- source_word: חמס
  choice: de violência
  rationale: חמס denota primariamente violência, injustiça ou dano. “De violência” preserva essa força sem restringi-la a mera desobediência política.
theological_decisions:
- issue: Caracterização do reino procedente de Efraim
  choice: reino de violência
  alternative: reino injusto; reino rebelde; reino desobediente
  rationale: O hebraico חמס favorece violência ou injustiça, enquanto o grego ἀπειθῆ destaca desobediência ou rebelião. O texto principal segue o hebraico e a nota conserva a tensão com o paralelo grego.
- issue: Sintaxe da segunda oração
  choice: 'manter a oração nominal: “e, de Efraim, um reino...”'
  alternative: “e de Efraim surgiu um reino...”
  rationale: O hebraico não apresenta verbo expresso na segunda oração. A elipse é inteligível em português e evita acrescentar “surgiu”, “estabeleceu” ou “levantou”.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem marcada “de Efraim, um reino” conserva a concisão e a ausência de verbo do hebraico; as vírgulas ajudam a leitura. Os marcadores aparecem junto aos elementos a que se referem.
