base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/009.yaml
  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: pt
  text: Com cânticos nos jardins[a], fez preparativos diante do altar e ordenou o som do salmo e das harpas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica “com cânticos nos jardins” é incerta. O paralelo grego diz: “Ele colocou cantores diante do altar, para que, com o som deles, tornassem doces as melodias”, o que pode refletir um texto hebraico subjacente diferente ou uma corrupção na expressão hebraica preservada.'
    reason: textual_variant
  - marker: b
    text: Ou “liras”; o termo hebraico designa um instrumento de cordas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: Com cânticos nos jardins
  rationale: Mantém o sentido mais direto do hebraico transmitido, embora a expressão seja difícil e possivelmente corrompida. A incerteza e a leitura divergente do grego são registradas em nota.
- source_word: הכין
  choice: fez preparativos
  rationale: O verbo pode significar preparar, estabelecer ou pôr em ordem. A formulação preserva a ausência de um objeto explícito no hebraico.
- source_word: לפני מזבח
  choice: diante do altar
  rationale: Tradução direta e natural da expressão preposicional no contexto do culto.
- source_word: וקול
  choice: e ... o som
  rationale: Embora קול também possa significar voz, 'som' se ajusta melhor aos termos musicais que o acompanham.
- source_word: מזמור
  choice: salmo
  rationale: Preserva a conotação de cântico musical e litúrgico do termo hebraico.
- source_word: ונבלים
  choice: e das harpas
  rationale: נבלים designa instrumentos de cordas, tradicionalmente entendidos como harpas ou liras; 'harpas' é claro e familiar, sem excluir a alternativa em nota.
- source_word: תקן
  choice: ordenou
  rationale: Expressa a ideia de dispor ou pôr em ordem e se encaixa naturalmente no contexto musical e cultual.
theological_decisions:
- issue: Uso do hebraico difícil em contraste com o paralelo grego mais fluente
  choice: O texto principal segue o hebraico preservado, com sua dificuldade assinalada em nota.
  alternative: Ele colocou cantores diante do altar, para que, com o som deles, tornassem doces as melodias.
  rationale: Dar primazia ao testemunho hebraico evita substituir silenciosamente sua leitura pela do grego. A nota conserva a divergência textual e permite ao leitor perceber a incerteza.
translation_notes:
  register: Português atual, digno e acessível, com leve tonalidade litúrgica. A sintaxe permanece próxima do hebraico sem ocultar a dificuldade textual; as formas “salmo” e “harpas” são familiares ao leitor comum.
