translation:
  language: pt
  text: que preparou uma casa para o seu nome[a] e estabeleceu o santuário para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego fornecido para este versículo traz, em vez disso: “Como te tornaste sábio em tua juventude e foste cheio de entendimento como um rio”, refletindo uma linha diferente no contexto próximo. O texto principal segue aqui o hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: אשר
  choice: que
  rationale: Introduz uma oração relativa que retoma Salomão no contexto anterior; “que” é a forma natural e não acrescenta informação.
- source_word: הכין
  choice: preparou
  rationale: O verbo expressa preparar ou deixar pronto. “Preparou” conserva essa nuance sem reduzi-la apenas ao ato de construir.
- source_word: בית
  choice: uma casa
  rationale: Traduz literalmente o termo hebraico e preserva a expressão bíblica referente ao templo, sem substituir de modo interpretativo por “templo”.
- source_word: לשמו
  choice: para o seu nome
  rationale: Mantém a expressão hebraica de dedicação do santuário a Deus e evita explicitar além do texto com “para o SENHOR”.
- source_word: ויצב
  choice: estabeleceu
  rationale: Comunica a ideia de firmar ou pôr de pé de maneira estável, em português natural.
- source_word: לעד
  choice: para sempre
  rationale: Preserva a linguagem de duração permanente e sua tensão retórica, sem ajustá-la à história posterior do templo.
- source_word: מקדש
  choice: o santuário
  rationale: Designa o lugar sagrado; o artigo definido é natural em português e adequado ao referente conhecido no contexto.
- source_word: ὡς ἐσοφίσθης ἐν νεότητί σου, καὶ ἐνεπλήσθης ὡς ποταμὸς συνέσεως
  choice: não seguido no texto principal
  rationale: O paralelo grego fornecido traz uma linha diferente, sobre a sabedoria de Salomão. Como o testemunho hebraico aqui é de alta confiança, ele fundamenta o texto principal, enquanto a divergência é registrada em nota.
theological_decisions:
- issue: Linguagem do templo e expressão do nome divino
  choice: Conservar “uma casa para o seu nome”.
  alternative: “um templo para o SENHOR” ou “uma casa em honra do SENHOR”
  rationale: A formulação hebraica associa o santuário ao nome de Deus sem afirmar que Deus esteja contido nele. Preservar a expressão mantém sua nuance teológica sem acrescentar palavras.
- issue: Sentido de לעד
  choice: Traduzir por “para sempre”.
  alternative: “perpetuamente” ou “por todo o tempo”
  rationale: A tradução direta mantém a afirmação idealizada de permanência e não resolve silenciosamente a tensão com a posterior destruição do templo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A expressão bíblica “uma casa para o seu nome” foi preservada por sua importância literária e teológica.
