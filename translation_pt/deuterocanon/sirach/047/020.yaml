base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/020.yaml
  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: pt
  text: Puseste uma mancha em tua honra e profanaste teu leito,[a] trazendo ira sobre teus descendentes e lamento em tua cama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “e profanaste tua descendência”, em vez de “e profanaste teu leito”.
    reason: textual_variant
  - marker: b
    text: O grego termina com “e angústia por causa de tua insensatez”, em vez de “e lamento em tua cama”.
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום
  choice: Você pôs uma mancha
  rationale: A expressão hebraica diz literalmente que se deu ou colocou um defeito. “Pôs uma mancha” comunica em português a desonra causada e preserva a imagem concreta, também apoiada pelo grego μῶμον.
- source_word: בכבודך
  choice: em sua honra
  rationale: כבוד pode significar “glória” ou “honra”. Aqui se refere à dignidade pessoal e régia de Salomão; “honra” é natural e adequada ao contexto moral.
- source_word: ותחלל
  choice: e profanou
  rationale: No piel, חלל transmite profanação ou violação daquilo que deveria ser tratado como santo. “Profanou” conserva a força moral e religiosa do termo.
- source_word: יצועיך
  choice: seu leito
  rationale: O termo designa leito ou cama e traz conotação sexual neste contexto. “Leito” mantém essa associação em português sem acrescentar explicitamente “conjugal”.
- source_word: להביא אף
  choice: trazendo ira
  rationale: O infinitivo indica resultado ou consequência. “Trazendo” conserva essa relação, e “ira” expressa melhor a intensidade de אף.
- source_word: על צאצאיך
  choice: sobre seus descendentes
  rationale: צאצאים abrange a descendência, especialmente apropriada às consequências dinásticas mencionadas no contexto. “Descendentes” é mais claro em português do que “prole”.
- source_word: ואנחה
  choice: e gemidos
  rationale: אנחה pode indicar gemido, suspiro ou lamento. O plural idiomático “gemidos” comunica naturalmente em português a aflição expressa pelo substantivo hebraico.
- source_word: על משכבך
  choice: sobre sua cama
  rationale: משכב é o lugar onde alguém se deita, isto é, cama ou leito. “Cama” evita repetir “leito” e preserva a ligação concreta que o hebraico estabelece entre a conduta sexual e a aflição resultante.
theological_decisions:
- issue: Relação entre a cláusula final, o pecado de Salomão e suas consequências
  choice: O texto descreve ira sobre os descendentes de Salomão e gemidos sobre sua cama como consequências de sua infidelidade sexual e matrimonial.
  alternative: A forma grega apresenta angústia por causa da insensatez de Salomão, sem mencionar sua cama na cláusula final.
  rationale: O hebraico menciona tanto o “leito” quanto a “cama”, criando uma ligação deliberada entre a conduta e suas consequências. Como esse testemunho hebraico é a fonte principal, ele rege o texto; a leitura grega é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém as imagens concretas do hebraico e assinala, sem harmonização, as variantes relevantes do texto grego.
