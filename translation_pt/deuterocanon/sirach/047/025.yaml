base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/025.yaml
  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: pt
  text: Ele deu a Efraim uma pedra de tropeço[a], para expulsá-los de sua terra; seu pecado tornou-se muito grande, e ele se vendeu a toda espécie de mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Seus pecados se multiplicaram muito, para afastá-los de sua terra; e buscaram toda espécie de perversidade, até que a vingança veio sobre eles”. O testemunho hebraico aqui é mais breve e emprega o singular.'
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: Ele pôs diante de Efraim uma pedra de tropeço
  rationale: A construção hebraica diz literalmente que ele deu a Efraim um מכשול. Em português, “pôs diante de” comunica naturalmente a colocação de algo que ocasiona queda, enquanto “pedra de tropeço” preserva a metáfora sem explicar em excesso.
- source_word: להדיחם
  choice: para expulsá-los
  rationale: O verbo expressa fazer alguém sair ou ser afastado. “Expulsá-los” liga-se de modo claro e idiomático à expressão seguinte, “de sua terra”.
- source_word: מאדמתם
  choice: de sua terra
  rationale: Embora אדמה possa designar solo, “terra” representa melhor aqui o território do qual o povo seria removido.
- source_word: ותגדל חטאתו מאד
  choice: Seu pecado tornou-se muito grande
  rationale: Segue o testemunho hebraico no singular, provavelmente referente ao governante mencionado no contexto. A divergência plural do grego é registrada em nota.
- source_word: ולכל רעה התמכר
  choice: ele se vendeu a toda espécie de mal
  rationale: “Vendeu-se” preserva a imagem reflexiva de מכר, de sujeição voluntária. “Toda espécie de mal” é português corrente e representa o alcance distributivo de לכל רעה.
theological_decisions:
- issue: Singular hebraico em contraste com o plural grego
  choice: Manter no texto principal “Seu pecado”, no singular.
  alternative: “Seus pecados se multiplicaram muito”, no plural, conforme o grego.
  rationale: O hebraico preservado é a fonte principal e apresenta חטאתו, “seu pecado”. Como o paralelo grego traz uma leitura coletiva substancialmente diferente e mais longa, ela é preservada na nota sem ser harmonizada com o hebraico.
- issue: Metáfora de agência moral em התמכר
  choice: “ele se vendeu a toda espécie de mal”
  alternative: “ele se entregou a toda espécie de mal”
  rationale: A formulação escolhida conserva a metáfora hebraica de vender a si mesmo, sem acrescentar uma estrutura doutrinária externa ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide as duas afirmações principais para maior clareza. A nota preserva a importante divergência entre o hebraico e o grego.
