  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
translation:
  language: pt
  text: Assim como a gordura é separada da oferta sagrada[a][b], assim também Davi foi separado dentre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso e pode ser traduzido mais literalmente: “Assim como a gordura é separada do que é sagrado”.'
    reason: textual_variant
  - marker: b
    text: 'O grego explicita a comparação: “da oferta de comunhão” e “dentre os filhos de Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כחלב
  choice: como a gordura
  rationale: חֵלֶב designa concretamente a gordura sacrificial. A tradução mantém a imagem cultual, sem substituí-la por uma abstração como “a melhor parte”.
- source_word: מורם
  choice: é separada
  rationale: O particípio passivo de רום, em contexto sacrificial, indica a porção retirada e destinada a uso sagrado. “É separada” comunica isso naturalmente, com apoio do grego ἀφωρισμένον.
- source_word: מקדש
  choice: da oferta sagrada
  rationale: A formulação hebraica é condensada e pode significar literalmente algo como “do que é sagrado”. No contexto sacrificial, “oferta sagrada” expressa o referente sem identificar מקדש com o edifício do santuário.
- source_word: כן דוד מישראל
  choice: assim também Davi foi separado dentre Israel
  rationale: O hebraico é elíptico; o predicado da primeira metade é entendido também na segunda. “Dentre Israel” preserva o sentido separativo, confirmado pelo grego ἀπὸ τῶν υἱῶν Ἰσραήλ, e evita a formulação pouco natural “de Israel”.
theological_decisions:
- issue: Grau de explicitação da distinção de Davi
  choice: Repetir “foi separado” na segunda metade como predicado subentendido pela comparação.
  alternative: “assim Davi dentre Israel” ou “assim Davi foi escolhido dentre Israel”
  rationale: A repetição torna a elipse hebraica inteligível em português e é apoiada pelo paralelismo e pelo grego. “Escolhido por Deus” acrescentaria uma afirmação e um agente que não aparecem expressamente neste versículo.
translation_notes:
  register: Português atual, digno e acessível, com terminologia sacrificial compreensível. A repetição de “separada/foi separado” conserva a estrutura da comparação e torna explícita apenas a elipse gramatical, sem acrescentar uma formulação doutrinária.
