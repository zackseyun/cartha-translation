base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/023.yaml
  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: pt
  text: E ele deu a Jacó um remanescente e, à casa de Davi, uma raiz vinda dele.[a] Salomão descansou com seus antepassados[b] e deixou depois de si um descendente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma linhagem que continuaria a partir de Davi. A imagem também pode ser traduzida como “um descendente vindo dele”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico depois de “Salomão descansou” é incerto nesta testemunha e também pode ser entendido como “envelhecido” ou “esgotado”. O paralelo grego diz “com seus antepassados”, leitura adotada aqui.
    reason: textual_variant
  - marker: c
    text: Ou “um herdeiro” ou “alguém de sua descendência”. O termo hebraico é raro e incerto, mas indica que Salomão deixou um sucessor de sua própria linhagem.
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: um remanescente
  rationale: Os termos hebraico e grego designam aquilo que resta ou é preservado. “Remanescente” é natural no registro bíblico e conserva a ideia de continuidade de uma linhagem.
- source_word: שרש / ῥίζαν
  choice: uma raiz
  rationale: Mantém a metáfora comum ao hebraico e ao grego, sem reduzi-la interpretativamente a “linhagem” ou transformá-la numa afirmação messiânica explícita.
- source_word: וישכב ... / ἀνεπαύσατο
  choice: descansou com seus antepassados
  rationale: Expressa com clareza o eufemismo de morte. “Antepassados” comunica em português corrente o sentido contextual de “pais” sem sugerir apenas os genitores imediatos.
- source_word: מיושש
  choice: com seus antepassados
  rationale: A forma hebraica desta testemunha é difícil e pode sugerir “envelhecido” ou “esgotado”; o paralelo grego traz “com os pais”, leitura adotada no texto e assinalada em nota.
- source_word: מנון
  choice: um descendente
  rationale: O termo hebraico é raro ou incerto, mas o contexto indica alguém da linhagem de Salomão que lhe sucede. “Descendente” preserva essa amplitude sem especificar indevidamente “filho”.
theological_decisions:
- issue: Linguagem da promessa dinástica na expressão “uma raiz procedente dele”
  choice: Conservar a metáfora de uma raiz que dá continuidade à casa de Davi, sem explicitar uma interpretação messiânica.
  alternative: Traduzir interpretativamente como “um descendente” ou “uma linhagem messiânica”.
  rationale: O versículo afirma a continuidade da casa de Davi. A imagem pode adquirir ressonância messiânica, mas o texto não exige que essa ressonância seja explicitada na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “remanescente” e a metáfora “raiz” pelo valor literário e dinástico; “antepassados” torna natural o antigo eufemismo de morte.
