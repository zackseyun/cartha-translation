  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: pt
  text: Tu cobriste a terra com a tua sabedoria[a] e encheste as alturas de cânticos de louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Teu nome chegou a ilhas distantes, e foste amado em tua paz.” O grego reflete uma forma textual substancialmente diferente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: כסית
  choice: cobriu
  rationale: O verbo hebraico כסה significa normalmente “cobrir”; a tradução conserva a metáfora concreta da sabedoria estendendo-se sobre a terra.
- source_word: בחכמתך
  choice: com a sua sabedoria
  rationale: A preposição ב pode indicar meio ou instrumento. “Com” é natural em português e preserva esse valor sem excluir a nuance de “por meio de”.
- source_word: ותקלס
  choice: encheu
  rationale: A forma hebraica é difícil. No contexto de במרום שירה, “encheu” expressa de modo coerente a ideia de fazer as alturas ressoarem ou ficarem repletas de canto, sem impor o sentido posterior de “louvar” diretamente.
- source_word: במרום
  choice: as alturas
  rationale: מרום pode designar um lugar elevado, as alturas ou o céu. “As alturas” conserva a imagem espacial poética e evita especificar além do hebraico.
- source_word: שירה
  choice: um cântico de louvor
  rationale: שירה significa “canto” ou “cântico”. “Cântico de louvor” comunica naturalmente em português a provável força laudatória da expressão neste contexto.
theological_decisions:
- issue: Uso do texto hebraico da Geniza do Cairo diante do paralelo grego divergente
  choice: O texto principal segue a testemunha hebraica preservada.
  alternative: “Seu nome chegou a ilhas distantes, e você foi amado em sua paz.”
  rationale: Como o hebraico está preservado e possui alta confiança, ele recebe primazia. O grego parece refletir uma forma textual substancialmente diferente e é registrado em nota para manter transparência quanto à tradição textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imagem poética preservada. Emprega-se “cântico de louvor” por ser mais natural e claro do que uma formação artificial como “canto-louvor”.
