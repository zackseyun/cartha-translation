  text: You gave your strength to women[a], and let them rule over your body.
translation:
  language: pt
  text: Você entregou às mulheres a sua força[a] e deixou que elas dominassem o seu corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «a sua força»; o paralelo grego diz «os seus lombos», explicitando o sentido sexual.'
    reason: Registra a dificuldade lexical de כסלך e a leitura mais anatômica preservada pelo testemunho grego.
lexical_decisions:
- source_word: ותתן
  choice: você entregou
  rationale: Traduz diretamente נתן, com «entregou» expressando neste contexto não apenas o ato de dar, mas a ideia de ceder algo ao domínio de outras pessoas.
- source_word: לנשים
  choice: às mulheres
  rationale: A preposição ל indica aqui a quem a força foi entregue; «às mulheres» é a formulação natural em português.
- source_word: כסלך
  choice: a sua força
  rationale: A forma hebraica é difícil. O contexto e o paralelo grego, que traz «os seus lombos», apontam para vigor ou potência sexual. «A sua força» conserva essa ideia sem tornar o texto excessivamente anatômico.
- source_word: ותמשילם
  choice: deixou que elas dominassem
  rationale: A forma causativa de משל comunica fazer ou permitir que alguém governe. «Deixou que elas dominassem» preserva tanto a responsabilidade atribuída a Salomão quanto a referência às mulheres.
- source_word: בגויתך
  choice: o seu corpo
  rationale: גויה designa o corpo físico. Embora a preposição hebraica seja literalmente «em», a construção portuguesa «dominar o seu corpo» expressa com clareza a relação exigida pelo verbo; o paralelo grego também confirma a referência corporal.
theological_decisions:
- issue: Uso do testemunho hebraico em uma expressão lexical difícil
  choice: Tomar o hebraico como texto-base e traduzir כסלך por «a sua força», deixando o paralelo grego esclarecer em nota a conotação sexual.
  alternative: Traduzir «os seus lombos» ou entender a palavra como «a sua insensatez».
  rationale: A repreensão se refere à entrega sexual e corporal de Salomão. O grego παρέκλινας τὰς λαγόνας σου γυναιξίν torna explícita a referência aos lombos e favorece a leitura ligada ao vigor físico, sem eliminar no texto principal a dificuldade própria do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Você» mantém a interpelação direta; «entregou» e «dominassem» comunicam a censura com naturalidade. O marcador [a] aparece imediatamente após a expressão explicada.
