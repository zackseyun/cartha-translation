base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: pt
  text: O SENHOR também deixou passar a sua transgressão[a] e exaltou para sempre o seu chifre[b]; deu-lhe um decreto de realeza[c] e firmou o seu trono até Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “O Senhor removeu os pecados dele”. O hebraico diz mais literalmente: “fez passar a sua transgressão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu chifre”, imagem bíblica de força, poder e honra.'
    reason: metaphor_explanation
  - marker: c
    text: 'O grego diz: “deu-lhe uma aliança de reis e um trono de glória em Israel”. O hebraico traz “um decreto de realeza” e “firmou o seu trono até Jerusalém”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  choice: o SENHOR
  rationale: Representa o nome divino conforme a convenção bíblica portuguesa amplamente reconhecida, sem adotar uma vocalização discutida.
- source_word: העביר פשעו
  choice: fez passar a transgressão dele
  rationale: Preserva a imagem verbal hebraica de fazer passar/remover e distingue פשע, transgressão ou rebeldia, do termo mais geral para pecado.
- source_word: וירם לעולם קרנו
  choice: exaltou para sempre o seu poder
  rationale: קרן significa literalmente “chifre”, metáfora bíblica de força, honra e poder; em português corrente, explicitar “poder” comunica naturalmente o sentido da imagem.
- source_word: חוק ממלכת
  choice: um decreto de realeza
  rationale: Mantém a força jurídica de חוק e expressa ממלכת de modo natural, sem importar a leitura grega “aliança de reis”.
- source_word: וכסאו הכין
  choice: firmou seu trono
  rationale: הכין aqui indica tornar firme ou estabelecer, com sentido dinástico.
- source_word: עד ירושלים
  choice: em Jerusalém
  rationale: Embora עד normalmente signifique “até”, no contexto a formulação espacial hebraica é vertida idiomaticamente como localização; a dificuldade e a variante grega são registradas em nota.
theological_decisions:
- issue: A ação de Deus diante da transgressão de Davi
  choice: fez passar a transgressão dele
  alternative: perdoou sua transgressão; removeu seus pecados
  rationale: A formulação conserva a imagem e a tensão do hebraico, sem desenvolver uma doutrina da expiação além do que o verso afirma.
- issue: Natureza da concessão dinástica
  choice: um decreto de realeza
  alternative: uma aliança de reis; uma aliança real
  rationale: O texto hebraico preservado traz חוק ממלכת, enquanto o grego apresenta “aliança de reis”; a tradução principal segue o hebraico e registra a variante.
- issue: Localização ou extensão do trono
  choice: em Jerusalém
  alternative: até Jerusalém; em Israel
  rationale: A tradução idiomática evita uma expressão portuguesa obscura, mas a nota preserva tanto a forma hebraica mais literal quanto a leitura grega divergente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A metáfora “chifre” foi comunicada no texto como “poder” e preservada em nota; as diferenças relevantes entre o hebraico e o grego foram explicitadas sem harmonização.
