- from: Também o SENHOR fez passar a transgressão dele[a] e exaltou para sempre o seu poder[b]; deu-lhe um decreto de realeza[c] e firmou seu trono em Jerusalém.
  to: O SENHOR também deixou passar a sua transgressão[a] e exaltou para sempre o seu chifre[b]; deu-lhe um decreto de realeza[c] e firmou o seu trono até Jerusalém.
  rationale: A revisão conserva as imagens e a dificuldade espacial do testemunho hebraico, enquanto mantém notas concisas para a leitura grega e para a metáfora do chifre. A ordem inicial e o verbo “deixou passar” tornam o português mais fluente sem eliminar a nuance de remissão expressa pelo hebraico.
