base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/007.yaml
  text: He gave cities among the Philistines[b][a], and to this day he has broken their horn.
translation:
  language: pt
  text: Ele colocou cidades entre os filisteus[a], e o chifre deles[b] permanece quebrado até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «colocou cidades no território filisteu» ou «tomou cidades dos filisteus». A expressão hebraica é condensada; o paralelo grego deixa claro que o contexto é a derrota duradoura dos filisteus por Davi.
    reason: alternative_reading
  - marker: b
    text: Na linguagem bíblica, o «chifre» é uma imagem de força ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: estabeleceu
  rationale: O verbo נתן pode significar «dar», «pôr» ou «estabelecer». Neste contexto, «estabeleceu» mantém a ideia de colocar cidades em determinada situação ou território sem sugerir, de maneira enganosa, que Davi as presenteou aos filisteus.
- source_word: בפלשתים
  choice: entre os filisteus
  rationale: A preposição ב diante do nome do povo forma uma expressão condensada, que pode indicar localização entre os filisteus, território filisteu ou cidades obtidas deles. «Entre os filisteus» permanece próximo da forma hebraica sem decidir além da evidência.
- source_word: ערים
  choice: cidades
  rationale: É o sentido comum do substantivo ערים e se ajusta ao contexto político e militar.
- source_word: ועד היום
  choice: até hoje
  rationale: Reproduz diretamente a expressão temporal hebraica e indica que o resultado da ação continuava perceptível no tempo do autor.
- source_word: שבר
  choice: quebrou
  rationale: Traduz diretamente o verbo «quebrar» e conserva a força da imagem ligada ao chifre.
- source_word: קרנם
  choice: o chifre deles
  rationale: Mantém a metáfora hebraica, confirmada pelo grego κέρας. No uso bíblico, o chifre representa força ou poder; a nota esclarece a imagem sem a eliminar do texto.
theological_decisions:
- issue: Sentido histórico da ação de Davi em relação às cidades filisteias
  choice: Conservar a formulação hebraica condensada, «estabeleceu cidades entre os filisteus».
  alternative: «Tomou cidades dos filisteus» ou «subjugou os filisteus por todos os lados».
  rationale: O paralelo grego explicita uma derrota militar dos filisteus, mas o testemunho hebraico primário fala de cidades com uma construção ambígua. A tradução não deve transformar essa formulação em uma reconstrução histórica mais específica do que a fonte permite.
- issue: Metáfora do chifre
  choice: Preservar «quebrou o chifre deles» no texto principal.
  alternative: «Destruiu o poder deles».
  rationale: A imagem é compartilhada pelos testemunhos hebraico e grego e pertence ao vocabulário bíblico da força e autoridade. Explicá-la em nota preserva sua forma e seu sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «estabeleceu cidades entre os filisteus» conserva a concisão e a ambiguidade do hebraico; as notas esclarecem as leituras possíveis e a metáfora sem sobrecarregar o texto principal.
