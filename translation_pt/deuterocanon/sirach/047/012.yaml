  text: Because of him there stood up after him an intelligent son[a], who lived in security.
translation:
  language: pt
  text: Por causa dele, levantou-se depois dele um filho inteligente[a], que vivia em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Depois dele levantou-se um filho entendido e, por causa dele, estabeleceu-se em ampla tranquilidade”. O testemunho hebraico diz: “que vivia em segurança”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: Por causa dele
  rationale: A expressão hebraica indica causa ou benefício. “Por causa dele” preserva a ligação causal com o antecessor sem definir além do texto a natureza desse benefício.
- source_word: עָמַד אַחֲרָיו
  choice: levantou-se depois dele
  rationale: עָמַד traz a imagem de pôr-se de pé e, neste contexto, também sugere que o filho surgiu como sucessor. A formulação conserva a imagem hebraica, confirmada pelo grego ἀνέστη.
- source_word: בֵּן מַשְׂכִּיל
  choice: um filho inteligente
  rationale: מַשְׂכִּיל descreve alguém dotado de entendimento ou discernimento. “Inteligente” mantém esse componente cognitivo sem ampliar necessariamente o termo para a sabedoria moral.
- source_word: שׁוֹכֵן לָבֶטַח
  choice: que vivia em segurança
  rationale: שׁוֹכֵן expressa habitar ou viver, e לָבֶטַח, segurança ou confiança. A tradução é natural em português e mantém o sentido central do testemunho hebraico.
theological_decisions:
- issue: Relação entre a segurança do filho e seu antecessor
  choice: O filho se levantou depois do antecessor e viveu em segurança por causa dele.
  alternative: Seguindo mais de perto o grego, pode-se entender que, por causa do antecessor, o filho se estabeleceu em ampla tranquilidade ou em espaço amplo.
  rationale: O hebraico e o grego vinculam a condição favorável do filho ao antecessor, mas o versículo não explicita a natureza exata dessa relação. A tradução evita transformá-la numa afirmação teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a repetição de “dele” para preservar as relações pronominais e a ambiguidade do hebraico, sem substituir os referentes por nomes inferidos do contexto.
