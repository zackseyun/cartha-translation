  text: And after him Nathan arose[a], to stand before David.
translation:
  language: pt
  text: E, depois dele, levantou-se Natã[a], para se apresentar diante de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Natã levantou-se para profetizar nos dias de Davi». O hebraico diz: «para se apresentar diante de Davi».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: E
  rationale: Introduz a continuação do contexto anterior. O valor aditivo de גם fica naturalmente incluído na conjunção portuguesa, sem tornar a frase pesada.
- source_word: אחריו
  choice: depois dele
  rationale: Preserva a referência pessoal ao personagem mencionado anteriormente e expressa a ideia de sucessão.
- source_word: עמד
  choice: levantou-se
  rationale: Embora o verbo possa significar literalmente «ficou de pé», aqui indica que Natã surgiu em cena depois do personagem anterior. «Levantou-se» também corresponde bem ao paralelo grego ἀνέστη.
- source_word: נתן
  choice: Natã
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: להתיצב
  choice: para se apresentar
  rationale: O infinitivo hitpael de יצב comunica a ideia de colocar-se ou apresentar-se diante de alguém. Esta formulação é natural em português e mantém a postura formal sugerida pelo hebraico.
- source_word: לפני דוד
  choice: diante de Davi
  rationale: Traduz diretamente a expressão hebraica. O paralelo grego traz «nos dias de Davi», variante registrada em nota.
theological_decisions:
- issue: Relação de Natã com Davi na oração final
  choice: diante de Davi
  alternative: nos dias de Davi
  rationale: O hebraico preservado diz literalmente «diante de Davi», enquanto o paralelo grego descreve Natã profetizando «nos dias de Davi». Como o testemunho hebraico está disponível e tem prioridade neste ponto, ele fundamenta o texto principal; a leitura grega é preservada em nota para manter transparente a diferença textual.
translation_notes:
  register: Português moderno, claro e digno, com pontuação que torna natural a breve transição narrativa. «Apresentar-se diante de» preserva o tom formal do hebraico sem soar arcaico.
