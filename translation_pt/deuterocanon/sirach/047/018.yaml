base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/018.yaml
  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
translation:
  language: pt
  text: Foste chamado pelo nome honrado, invocado sobre Israel;[a] acumulaste ouro como ferro e multiplicaste prata como chumbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamado sobre Israel”. A expressão hebraica pode indicar um nome invocado sobre alguém, ligado a essa pessoa ou que repousa sobre ela; o paralelo grego também sustenta esse sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: Foste chamado pelo nome honrado
  rationale: Mantém a construção passiva e o valor de כבד como honra, dignidade ou glória, sem ampliar a alusão. O singular masculino dirige-se a Salomão no contexto.
- source_word: הנקרא על ישראל
  choice: invocado sobre Israel
  rationale: A formulação preserva o idioma hebraico de um nome chamado ou invocado sobre alguém, também apoiado pelo grego ἐπικεκλημένου, sem decidir se a ênfase recai em pertença, consagração ou reivindicação divina.
- source_word: ותצבר
  choice: acumulaste
  rationale: Expressa a reunião e o armazenamento de riqueza em linguagem portuguesa natural.
- source_word: כברזל זהב
  choice: ouro como ferro
  rationale: Conserva a comparação compacta, que apresenta o ouro como tão abundante quanto o ferro.
- source_word: וכעפרת הרבית כסף
  choice: multiplicaste prata como chumbo
  rationale: עפרת designa chumbo, confirmado pelo paralelo grego; הרבית indica fazer aumentar ou multiplicar.
theological_decisions:
- issue: Referente do “nome honrado”
  choice: Manter a referência alusiva ao nome divino associado a Israel, sem explicá-la no corpo do versículo.
  alternative: Explicitar que Salomão portava o nome do Senhor ou interpretar a frase exclusivamente como identidade pactual de Israel.
  rationale: O hebraico e o grego vinculam o nome reverenciado a Israel, mas não definem precisamente como esse nome se relaciona com Salomão e Israel; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes com o discurso poético dirigido a Salomão. As imagens metálicas e a concisão do paralelismo hebraico foram preservadas.
