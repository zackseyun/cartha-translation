base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: pt
  text: Mas Deus não abandonará a misericórdia[a], nem deixará cair por terra nenhuma de suas palavras. Não eliminará a descendência nem a posteridade de seu escolhido[b], nem destruirá a linhagem daquele que o amou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Mas o Senhor certamente não abandonará sua misericórdia e certamente não destruirá nenhuma de suas obras”. O hebraico traz aqui: “nem deixará cair por terra nenhuma de suas palavras”.'
    reason: textual_variant
  - marker: b
    text: A forma hebraica traduzida por “seu escolhido” também pode ser entendida como plural, “seus escolhidos”; o paralelo grego apoia o singular.
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: Deus
  rationale: Reflete diretamente o título divino hebraico אל; o paralelo grego traz Κύριος, «Senhor».
- source_word: יטוש חסד
  choice: abandonará a misericórdia
  rationale: Expressa em português atual o ato de não desamparar ou deixar de exercer חסד; «misericórdia» também corresponde ao grego ἔλεος.
- source_word: ולא יפיל מדבריו ארצה
  choice: nem deixará cair por terra nenhuma de suas palavras
  rationale: Preserva a imagem idiomática hebraica de uma palavra divina que não falha nem fica sem cumprimento.
- source_word: לא יכרית
  choice: não eliminará
  rationale: Comunica a supressão de uma linhagem com naturalidade, sem restringir o verbo a um ato físico de cortar.
- source_word: לבחיריו
  choice: de seu escolhido
  rationale: Adota o singular apoiado pelo paralelo grego e pelo contexto davídico, embora a forma hebraica admita leitura plural.
- source_word: נין ונכד
  choice: a descendência nem a posteridade
  rationale: Mantém a expressão dupla referente à continuidade da linhagem através das gerações, em português natural.
- source_word: זרע
  choice: linhagem
  rationale: No contexto dinástico, «linhagem» transmite o sentido figurado de זרע com maior naturalidade que «semente» no português corrente.
- source_word: אובהו
  choice: daquele que o amou
  rationale: Mantém a referência a quem amou a Deus e concorda com o particípio aoristo do paralelo grego, provavelmente aludindo a Davi.
- source_word: ישמיד
  choice: destruirá
  rationale: Reproduz de modo direto a força do verbo hebraico.
theological_decisions:
- issue: Título divino na oração inicial
  choice: Deus
  alternative: Senhor
  rationale: O testemunho hebraico primário lê אל, enquanto o paralelo grego lê Κύριος; segue-se o hebraico no texto principal.
- issue: Número de «escolhido» na promessa dinástica
  choice: seu escolhido
  alternative: seus escolhidos
  rationale: O singular é sustentado pelo grego e pelo contexto da linhagem davídica; a possível leitura plural do hebraico é registrada em nota.
- issue: Imagem de זרע na promessa dinástica
  choice: linhagem
  alternative: semente
  rationale: «Linhagem» preserva o sentido dinástico sem tornar a expressão pouco natural, mas não identifica explicitamente um descendente específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «cair por terra» conserva deliberadamente a imagem bíblica; «descendência», «posteridade» e «linhagem» mantêm o foco dinástico sem linguagem excessivamente técnica.
