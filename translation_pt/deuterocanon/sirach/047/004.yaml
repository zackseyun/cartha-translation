base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: pt
  text: Em sua juventude, ele abateu um guerreiro e removeu uma desonra eterna[a]; ao erguer a mão com a funda[b], despedaçou a glória de Golias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: «removeu a desonra do povo». O hebraico diz: «removeu uma desonra eterna».'
    reason: alternative_reading
  - marker: b
    text: O grego diz explicitamente «gigante», menciona «uma pedra de funda» e fala em derrubar «o orgulho de Golias», deixando ainda mais clara a referência à vitória de Davi sobre Golias.
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: Na juventude
  rationale: Expressa de modo natural o período juvenil de Davi, sem especificar indevidamente sua idade.
- source_word: הכה גבור
  choice: abateu um guerreiro
  rationale: גבור designa um homem poderoso ou guerreiro. O grego explicita «gigante», mas o texto principal segue o hebraico preservado; «abateu» comunica o resultado fatal confirmado pelo contexto.
- source_word: ויסר חרפת עולם
  choice: removeu uma desonra eterna
  rationale: Mantém a formulação hebraica, na qual עולם qualifica a desonra como duradoura ou eterna, sem substituí-la pela leitura comunitária do grego.
- source_word: בהניפו ידו
  choice: ao erguer a mão
  rationale: Reproduz a circunstância da ação e soa natural no contexto do preparo para usar a funda.
- source_word: על קלע
  choice: com a funda
  rationale: A expressão hebraica é condensada; o grego menciona uma pedra de funda. A tradução apresenta com clareza o instrumento sem acrescentar ao texto principal o detalhe grego.
- source_word: וישבר תפארת גלית
  choice: despedaçou a glória de Golias
  rationale: תפארת pode significar glória, esplendor ou orgulho. «Glória» conserva a amplitude do hebraico, enquanto «despedaçou» preserva sua imagem vigorosa; o contexto permite perceber também a humilhação do orgulho de Golias.
theological_decisions:
- issue: Divergência hebraico-grega quanto à desonra removida
  choice: 'Seguir no texto principal o hebraico preservado: «removeu uma desonra eterna»'
  alternative: «removeu a desonra do povo»
  rationale: Onde o hebraico de Sirácida sobrevive, ele tem prioridade. O grego confirma o contexto de Davi e Golias, mas sua formulação comunitária é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo e a força poética do hebraico, enquanto as notas preservam as diferenças relevantes do paralelo grego.
