  source_fidelity: 'O texto preserva os elementos atestados no hebraico: a caracterização negativa de Roboão, a ruptura do povo ligada ao seu conselho, a imprecação textual e Jeroboão, que pecou e fez Israel pecar. O paralelo grego confirma em especial a noção de deserção/revolta causada pela política de Roboão. A redação deve apenas tornar mais idiomaticamente clara, sem resolver além do necessário, a sequência comprimida em torno de «até que se levantou ... Jeroboão».'
  naturalness: '«Grande em insensatez e falto de entendimento» é compreensível, mas soa calcado e algo arcaizante no português atual. «Muito insensato e sem entendimento» mantém o juízo e é mais natural. A construção «até que se levantou alguém ...: Jeroboão» é pesada; a aposição direta de Jeroboão após a oração parentética reproduz melhor a compactação do hebraico.'
  terminology: Roboão, Jeroboão, Nebate e Israel seguem as formas bíblicas portuguesas usuais. «Fez Israel pecar» conserva adequadamente o causativo hebraico. «Conselho» é mais próximo de בעצתו e do grego βουλή do que «decisão», embora possa denotar aqui a orientação política do rei.
