base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: pt
  text: Roboão[a] era muito insensato e sem entendimento; por seu conselho, levou o povo à revolta[b], até que se levantou — que não haja memória dele — Jeroboão, filho de Nebate, que pecou e fez Israel pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico neste ponto é comprimido, e a divisão do versículo parece instável. O paralelo grego traz uma formulação mais extensa, inclusive a frase “deu a Efraim um caminho de pecado”. Essa ampliação não foi incluída no texto principal porque não está explícita na linha hebraica preservada aqui.
    reason: textual_variant
  - marker: b
    text: 'Ou: “dividiu o povo por seu conselho”. O hebraico subjacente é difícil; o paralelo grego favorece o sentido de que o conselho ou a política de Roboão provocou a deserção do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רחב אולת
  choice: grande em insensatez
  rationale: A expressão hebraica transmitida é comprimida e incomum. A tradução mantém רחב como ideia de grandeza ou amplitude e a entende, no contexto imediato, como caracterização de Roboão, sem adotar a expansão grega sobre a descendência.
- source_word: חסר בינה
  choice: falto de entendimento
  rationale: Tradução direta e natural da expressão hebraica, preservando seu juízo negativo e correspondendo ao sentido do paralelo grego.
- source_word: רחבעם
  choice: Roboão
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: הפריע בעצתו עם
  choice: por sua decisão, levou o povo à revolta
  rationale: O hebraico é difícil neste testemunho. O paralelo grego indica que a política ou deliberação de Roboão provocou a deserção do povo. “Decisão” comunica aqui o conselho transformado em medida régia, e “levou o povo à revolta” expressa a ruptura política sem eliminar a alternativa de divisão.
- source_word: אל יהי לו זכר
  choice: que não haja memória dele
  rationale: Mantém a formulação imprecatória do hebraico e sua tensão retórica, sem suavizá-la.
- source_word: ירבעם בן נבט
  choice: Jeroboão, filho de Nebate
  rationale: Formas bíblicas tradicionais e inteligíveis em português para os nomes próprios.
- source_word: חטא והחטיא את ישראל
  choice: pecou e fez Israel pecar
  rationale: Preserva a distinção hebraica entre o ato de pecar e a forma causativa que atribui a Jeroboão responsabilidade por induzir Israel ao pecado.
theological_decisions:
- issue: Relação entre o testemunho hebraico comprimido e o paralelo grego mais completo
  choice: Manter em uma única sequência Roboão, a revolta do povo e Jeroboão, seguindo o conteúdo central comum, sem acrescentar a oração grega sobre Efraim.
  alternative: Traduzir de modo fragmentário segundo as quebras do hebraico ou incluir a expansão grega “deu a Efraim um caminho de pecado”.
  rationale: O hebraico preserva explicitamente os elementos centrais, embora sua sintaxe e divisão sejam instáveis. O grego ajuda a esclarecer a sequência, mas sua expansão sobre Efraim não deve entrar no texto principal sem apoio explícito na linha hebraica sobrevivente.
- issue: Identidade do referente em “que não haja memória dele”
  choice: Conservar a frase em sua posição antes da identificação de Jeroboão, permitindo que a construção a associe a ele sem explicação doutrinária adicional.
  alternative: Reformular a frase para identificar inequivocamente Roboão ou Jeroboão como referente.
  rationale: A disposição do hebraico associa naturalmente a imprecação ao personagem que surge em seguida, mas o estado comprimido do texto recomenda preservar a tensão em vez de resolver o referente por paráfrase.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas tradicionais dos nomes bíblicos. A sintaxe contínua torna inteligível o testemunho hebraico comprimido, enquanto os travessões preservam a força abrupta da imprecação. Evitou-se tanto uma tradução excessivamente literal e obscura quanto a importação integral da expansão grega.
