revisions:
- from: 'Grande em insensatez e falto de entendimento era Roboão[a], que, por sua decisão, levou o povo à revolta[b], até que se levantou alguém — que não haja memória dele —: Jeroboão, filho de Nebate, que pecou e fez Israel pecar.'
  to: Roboão[a] era muito insensato e sem entendimento; por seu conselho, levou o povo à revolta[b], até que se levantou — que não haja memória dele — Jeroboão, filho de Nebate, que pecou e fez Israel pecar.
  rationale: A revisão melhora o português contemporâneo e a coerência sintática, mantendo o conteúdo compartilhado pelo hebraico e pelo grego. Não acrescenta a cláusula grega sobre Efraim. A posição da imprecação continua deliberadamente não explicada, pois o estado comprimido do hebraico não justifica fixar seu referente por paráfrase.
