base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: pt
  text: Salomão reinou em dias de paz, e Deus lhe deu descanso por todos os lados, para que ele construísse uma casa em honra ao nome de Deus e preparasse um santuário para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada é mais curta: “Salomão reinou em dias de paz, e Deus lhe deu descanso por todos os lados.” O paralelo grego acrescenta a oração de finalidade sobre construir uma casa em honra ao nome de Deus e preparar um santuário para sempre.'
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מלך
  choice: reinou
  rationale: Traduz naturalmente a forma verbal hebraica, preservando seu caráter ativo.
- source_word: בימי שלוה
  choice: em dias de paz
  rationale: Mantém a expressão temporal hebraica e comunica um período caracterizado por paz e tranquilidade.
- source_word: ואל הניח לו מסביב / ᾧ ὁ θεὸς κατέπαυσεν κυκλόθεν
  choice: e Deus lhe deu descanso por todos os lados
  rationale: O hebraico transmitido é ligeiramente irregular, e o paralelo grego esclarece Deus como sujeito. A expressão portuguesa preserva a ideia de descanso diante de ameaças circundantes.
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: para que ele construísse uma casa para o nome de Deus
  rationale: Inclui a oração final preservada no grego. A repetição de 'Deus' evita em português a ambiguidade potencial do possessivo 'seu', sem alterar o referente.
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: e preparasse um santuário para sempre
  rationale: '''Santuário'' é a equivalência natural de ἁγίασμα neste contexto, e ''para sempre'' preserva o alcance de εἰς τὸν αἰῶνα.'
theological_decisions:
- issue: Inclusão da finalidade ligada à construção do templo, presente no grego, mas ausente da linha hebraica preservada
  choice: Incluir a oração grega no texto principal, com nota sobre a variante
  alternative: 'Traduzir somente o hebraico preservado: “Salomão reinou em dias de paz, e Deus lhe deu descanso por todos os lados.”'
  rationale: O hebraico sobrevivente é mais curto e apresenta pequena irregularidade textual, enquanto o paralelo grego conserva uma continuação coerente no contexto de Salomão e do templo. A nota mantém transparente a diferença entre os testemunhos, sem ocultar a leitura mais curta.
- issue: Referente de αὐτοῦ em “para o nome dele”
  choice: Explicitar “para o nome de Deus”
  alternative: “para o seu nome”
  rationale: Em português, “seu” poderia ser entendido como referência a Salomão. A explicitação preserva o referente indicado pela sintaxe grega e evita uma ambiguidade criada apenas na tradução.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formulação natural para leitores brasileiros. Conserva a expressão bíblica “dias de paz” e torna transparente, por meio da nota, a diferença entre o hebraico preservado e o paralelo grego.
