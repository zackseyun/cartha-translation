  text: How wise you were in your youth[a], and instruction overflowed like the Nile.
translation:
  language: pt
  text: Como você foi sábio em sua juventude[a], e a instrução transbordou como o Nilo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Sua alma cobriu a terra, e você a encheu de parábolas de enigmas”. Isso provavelmente reflete um texto-base hebraico diferente ou uma tradição textual divergente.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה
  choice: Como
  rationale: Aqui, מה introduz uma exclamação de admiração, não uma pergunta. “Como” comunica isso de modo natural em português.
- source_word: חכמת
  choice: você foi sábio
  rationale: A forma de חכם descreve a sabedoria demonstrada por Salomão; a construção predicativa é clara e idiomática em português.
- source_word: בנעוריך
  choice: em sua juventude
  rationale: Expressão temporal direta que se refere aos primeiros anos da vida de Salomão.
- source_word: ותצף
  choice: transbordou
  rationale: Preserva a imagem de algo que sobe e se derrama em abundância, mais adequada ao contexto do que a ideia de simplesmente flutuar.
- source_word: כיאר
  choice: como o Nilo
  rationale: יאר frequentemente designa especificamente o Nilo. Manter esse nome conserva a força concreta da imagem hebraica.
- source_word: מוסר
  choice: a instrução
  rationale: מוסר pode abranger disciplina, formação e ensino. “Instrução” expressa aqui o saber formativo associado à sabedoria de Salomão sem restringir indevidamente o termo.
theological_decisions:
- issue: Uso do hebraico diante da leitura grega substancialmente divergente
  choice: Traduzir no texto principal o hebraico preservado
  alternative: 'Seguir o grego: “Sua alma cobriu a terra, e você a encheu de parábolas enigmáticas”'
  rationale: Como há testemunho hebraico para o versículo, ele governa o texto principal. A leitura grega parece refletir um texto-base hebraico diferente ou outra tradição textual e, por ser antiga e substancial, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para ampla legibilidade brasileira. A exclamação preserva o tom admirativo do hebraico, e “Nilo” mantém a imagem específica do texto-fonte.
