translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “você” evita flexões literárias pouco correntes; a enumeração mantém o paralelismo conciso do hebraico. As notas preservam a incerteza textual e a diferença do paralelo grego.
