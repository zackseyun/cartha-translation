  text: With song[a], proverb, riddle, and saying[b], you astounded the peoples.
translation:
  language: pt
  text: Com cântico, provérbio, enigma e expressão eloquente[a], você deixou os povos maravilhados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “com cânticos, provérbios, parábolas e interpretação, terras ficaram maravilhadas com você”. Ele preserva “interpretação” como possível alternativa a “expressão eloquente”.'
    reason: alternative_reading
  - marker: b
    text: 'O verbo hebraico é difícil e pode evocar a ideia de agitar ou causar tumulto. A tradução leva em conta o sentido mais claro do paralelo grego: “ficaram maravilhadas com você”.'
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  choice: Com cântico
  rationale: A preposição ב pode indicar meio ou esfera. “Com cântico” conserva o singular hebraico e introduz naturalmente a série de formas literárias.
- source_word: משל
  choice: provérbio
  rationale: משל designa com frequência um provérbio ou máxima sapiencial; “provérbio” é claro e adequado ao contexto.
- source_word: חידה
  choice: enigma
  rationale: חידה é uma formulação enigmática ou um enigma. “Enigma” mantém o tom literário e é natural em português.
- source_word: ומליצה
  choice: e expressão eloquente
  rationale: מליצה pode indicar linguagem elaborada, expressão retórica ou interpretação. “Expressão eloquente” preserva a nuance estilística do hebraico, enquanto a leitura grega é registrada em nota.
- source_word: עמים
  choice: os povos
  rationale: עמים é um plural coletivo que pode significar povos ou nações. “Os povos” evita restringir a referência a entidades políticas.
- source_word: הסערתה
  choice: você deixou ... maravilhados
  rationale: A forma hebraica é difícil e deriva de uma raiz associada a agitação ou tumulto. O paralelo grego esclarece o efeito como admiração generalizada; a tradução comunica esse resultado sem impor ao português uma imagem obscura.
