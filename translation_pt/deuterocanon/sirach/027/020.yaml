base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: pt
  text: Não o persiga[a], pois ele se afastou para longe e escapou como uma gazela de uma armadilha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não corra atrás dele”. O verbo grego pode indicar perseguição em sentido geral, sem implicar necessariamente hostilidade.'
    reason: lexical_alternative
  - marker: b
    text: A imagem é a de um animal selvagem veloz que escapa da armadilha de um caçador. “Gazela” também pode ser traduzido por “corça” ou “antílope”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ αὐτὸν διώξῃς
  choice: Não o persiga
  rationale: O verbo διώκω expressa perseguir ou ir atrás de alguém. “Persiga” preserva a força do imperativo sem introduzir necessariamente a ideia de perseguição hostil.
- source_word: μακρὰν ἀπέστη
  choice: ele se afastou para longe
  rationale: A expressão indica afastamento ou retirada a grande distância. A formulação mantém tanto o movimento de separação quanto a distância indicada por μακράν.
- source_word: ἐξέφυγεν
  choice: escapou
  rationale: O verbo descreve livrar-se ou fugir de um perigo e conduz naturalmente à comparação com o animal que sai da armadilha.
- source_word: ὡς δορκὰς
  choice: como uma gazela
  rationale: δορκάς designa uma gazela ou animal semelhante. “Gazela” é a equivalência moderna mais clara e conserva a imagem de fuga ágil.
- source_word: ἐκ παγίδος
  choice: de uma armadilha
  rationale: παγίς pode designar laço ou armadilha. “Armadilha” é corrente e compreensível em português, sem especificar um mecanismo que o grego não determina.
