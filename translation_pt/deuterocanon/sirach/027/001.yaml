lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: por causa do lucro
  rationale: χάριν com o genitivo exprime motivo; neste provérbio, ἀδιαφόρου aponta para vantagem material ou lucro, como confirma a ideia de procurar aumentá-lo na oração seguinte.
- source_word: πολλοὶ ἥμαρτον
  choice: muitos pecaram
  rationale: Reproduz de modo direto o aoristo grego e mantém a formulação proverbial genérica.
- source_word: ὁ ζητῶν πληθῦναι
  choice: quem procura aumentá-lo
  rationale: O particípio articular tem sentido genérico; o pronome retoma naturalmente «lucro», objeto subentendido do infinitivo.
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: desviará o olhar
  rationale: Expressão portuguesa natural que preserva a imagem do original sem especificar aquilo de que a pessoa desvia os olhos.
theological_decisions:
- issue: Nuance moral da oração final
  choice: desviará o olhar
  alternative: fechará os olhos ao erro; ignorará a injustiça
  rationale: O grego não identifica o objeto evitado. Preservar a imagem mantém a ambiguidade e sugere compromisso moral deliberado sem acrescentar uma acusação específica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Lucro» comunica com clareza o sentido contextual, e «desviará o olhar» conserva a força proverbial da imagem grega.
